prompt: |-
  I teach a 90-minute upper-level seminar, about 14 students, philosophy of mind / well-being unit, and I want a runnable in-class activity that makes them feel that "pain is bad" is really two separable claims stuck together — there's the sensory side (where it is, how strong, burning vs. crushing) and the unpleasantness side, and once you pull them apart somebody has to say which one the badness was ever supposed to live in. No lecture up front; ideally they find the split themselves by actually undergoing a mildly painful thing (ice water, a wall sit, a snap on the wrist — nothing that leaves anyone genuinely suffering, opt-out should be easy and unremarkable) alongside something genuinely horrible but not painful (a sustained nasty tone, an intensely bitter strip, that held-breath / air-hunger feeling), and then being asked, first privately and then out loud, what they'd give up to skip each one and what they're even trying to avoid. Two wrinkles I want built into the mechanics and not just mentioned afterwards: (1) selective pain asymbolia — feels it, locates it, reports the intensity, totally unmoved — versus a global indifference where the person is unmoved by anything at all; I think people collapse these and the difference decides whether the interesting claim is about pain specifically or about caring in general; (2) the mirror case, where the sensation is intact and does hurt but the subject is fine with it, even likes it, and we have to say whether that thing is bad for them. Give me the setup, any roles or stations, a timeline that actually fits 90 minutes, the exact questions at each stage, and a debrief mapping what happened onto the live options (badness = unpleasantness, vs. badness = the way pain forces you to care about a part of your body, vs. badness = it's hijacking of attention and action). Also tell me what will predictably go wrong the first time I run it, and be honest about which part of the disagreement the activity can't stage at all and I'll just have to explain. They shouldn't hear the word asymbolia until after.
reasoning: |-
  We are designing a 90-minute seminar activity for an upper-level philosophy class on the philosophy of mind and well-being. The goal is to help students disentangle the sensory and unpleasantness components of pain and to explore where the badness of pain resides. We will use mild, opt-out experiential elements and structured discussion.

  Key elements:
  - Use two types of stimuli: 
    (A) Mildly painful (e.g., ice water, wall sit, rubber band snap) 
    (B) Unpleasant but non-painful (e.g., bitter taste, unpleasant sound, air hunger)
  - Wrinkle 1: Distinguish selective pain asymbolia (feeling pain without aversion) from global indifference (indifference to everything). We want students to see that the badness might be specific to pain or might be about caring in general.
  - Wrinkle 2: Consider cases where the sensation is painful but the subject likes it (e.g., masochism) and whether that is bad for them.

  Structure:
  - No lecture up front. Start with the activity.
  - Timeline: 
    0:00 - 0:10 Introduction and setup (without giving away the philosophical points)
    0:10 - 0:25 Experiential Part 1: Two stimuli (one painful, one unpleasant non-painful) with private reflection
    0:25 - 0:40 Group discussion of what they would give up to avoid each and what they are avoiding
    0:40 - 0:55 Thought experiments on asymbolia and masochism (using scenarios, not actual experience)
    0:55 - 1:15 Debrief and mapping to philosophical positions
    1:15 - 1:30 Wrap-up and address predictable problems

  Detailed Plan:

  I. Introduction (10 minutes)
    - Briefly state that we are going to explore the nature of pain and unpleasantness through a couple of experiences and discussions.
    - Emphasize that participation in the experiential part is voluntary and they can opt out at any time without explanation. They can also choose to only do one of the experiences if they prefer.
    - Set up two stations (or two experiences that everyone can do at their seat if possible):
        Station 1: Mild Painful Stimulus (e.g., ice water bucket for 10 seconds, or wall sit for 20 seconds, or a rubber band snap on the wrist - they choose one method and stick to it for consistency)
        Station 2: Unpleasant Non-Painful Stimulus (e.g., a very bitter strip (like quinine) on the tongue for 10 seconds, or a loud, unpleasant tone for 10 seconds, or holding breath until they feel air hunger for 10 seconds - again, choose one and be consistent)

    - Distribute a reflection sheet (or have them use their own paper) with the following questions for each stimulus:

        For the painful stimulus:
          1. Describe the sensation: Where did you feel it? How intense was it (on a scale of 1-10)? What was the quality (e.g., burning, crushing, sharp)?
          2. How unpleasant was it (on a scale of 1-10)? 
          3. What would you be willing to give up to avoid this experience? (e.g., $1, $5, $10? Or 1 minute of your time, 5 minutes? Or a small pleasure like a piece of chocolate? They can choose the currency but must be specific.)
          4. What exactly are you trying to avoid? (The sensation itself? The unpleasant feeling? The distraction? The bodily harm?)

        For the unpleasant non-painful stimulus:
          (Same questions 1-4)

    - Also, on the reflection sheet, after both experiences:
          5. Compare: Would you rather experience the painful stimulus or the unpleasant non-painful stimulus? Why?
          6. What if you could feel the sensation of the painful stimulus without the unpleasantness? Would you still avoid it? What about for the unpleasant non-painful stimulus?

  II. Experiential Part 1 (15 minutes)
    - Students go to the stations (or the stimuli are passed around). They do each stimulus and then immediately write their reflections. 
    - They do one after the other (order randomized? or let them choose? To avoid order effects, maybe assign half the class to start with pain and half with unpleasant non-painful).
    - Note: The stimuli should be brief and mild. For example:
        - Ice water: a bowl of ice water, dip hand for 10 seconds.
        - Wall sit: against the wall for 20 seconds (if they are able).
        - Rubber band: snap once on the wrist (not too hard).
        - Bitter strip: place on tongue for 10 seconds then spit out.
        - Unpleasant tone: play a high-pitched, grating sound for 10 seconds.
        - Air hunger: take a normal breath out, then hold for 15 seconds (if safe for them).

  III. Group Discussion (15 minutes)
    - Break into small groups (4-5 students each) to discuss their answers to the reflection questions.
    - Guiding questions for the groups:
        a. What did you notice about the two experiences? How were they similar and different?
        b. What did people say they were trying to avoid? Did that differ between the two?
        c. How did the sensory description (location, intensity, quality) relate to the unpleasantness?
        d. What did people say they would give up? Did the two experiences command similar "prices"?
        e. For the pain stimulus, if you could have the sensation without the unpleasantness, would you avoid it? What about for the unpleasant non-painful one?
    - Then, bring the class together and have each group share one key insight.

  IV. Thought Experiments (15 minutes)
    - Now introduce two scenarios to discuss in the same groups:

        Scenario 1: Selective Pain Asymbolia
          "Imagine a person who has a condition where they feel the sensation of pain (they can tell you where it is, how intense, and what it feels like) but they don't mind it at all. They don't find it unpleasant. They might even say it's interesting. They don't have any desire to avoid it. However, they still feel pleasure and other unpleasant experiences (like the bitter taste or the air hunger) as unpleasant and avoid those. They are otherwise normal."

          Questions for the group:
            - Is the pain bad for this person?
            - What does this tell us about the badness of pain? Where does the badness live?

        Scenario 2: Global Indifference
          "Now imagine a different condition: a person who feels all sensations (including pain and pleasure) but doesn't care about any of them. They are indifferent to everything. They don't avoid pain, but they don't seek pleasure either. They are apathetic about everything."

          Questions:
            - Is the pain bad for this person? What about the pleasure? 
            - How is this different from the first scenario?
            - What does this tell us about the badness of pain? Is it about pain specifically or about caring in general?

        Scenario 3: Pain that is Liked
          "Finally, imagine someone who feels the same pain sensation (say, from a rubber band snap) but actually likes it and finds it pleasant. They might even seek it out. They are not indifferent to it; they have a positive reaction to it."

          Questions:
            - Is the pain bad for this person? 
            - What does this tell us about the badness of pain? Does it depend on the unpleasantness?

    - After group discussion, have a class-wide discussion.

  V. Debrief (20 minutes)
    - Map the experiences and discussions to the philosophical positions:

        Position 1: Badness = Unpleasantness
          - The bad part is the unpleasant feeling. In the selective asymbolia case, the pain isn't bad because it's not unpleasant. In the liked pain, it's not bad because it's not unpleasant (it's pleasant). In the unpleasant non-painful stimuli, the badness is the unpleasantness.

        Position 2: Badness = The way pain forces you to care about a part of your body
          - Pain demands attention and action. Even if it's not unpleasant (as in asymbolia) it might still be bad because it forces you to focus on the body part and interrupts your activities. But note: in asymbolia, they don't care, so it might not force attention? So this position might be challenged.

        Position 3: Badness = Hijacking of attention and action
          - The badness is that pain captures attention and disrupts ongoing activities. This might be present in both the painful and unpleasant non-painful stimuli. But in the liked pain, if it doesn't hijack attention (because the person enjoys it and doesn't want to avoid it) then maybe it's not bad? Or if it does hijack attention, then it's bad?

    - Highlight the distinction between selective asymbolia and global indifference: 
          - Selective asymbolia suggests that the badness of pain might be separable from the sensation (because the sensation is present but not bad). 
          - Global indifference suggests that the badness of pain might be part of a broader issue about caring. But note: in global indifference, nothing is bad because they don't care. So is the badness of pain just a special case of the badness of not caring? Or is there something specific about pain?

    - Point out that the activity might show that the unpleasantness is what we avoid, and that unpleasantness can be present in non-painful experiences. But then why do we call pain bad? Maybe because it's typically unpleasant? But the asymbolia case challenges that.

  VI. Wrap-Up (15 minutes)
    - Summarize the main insights: 
        - Pain has two components: sensation and unpleasantness.
        - The badness seems to lie in the unpleasantness component (as evidenced by the asymbolia case and the liked pain case).
        - But then why do we have a special term for pain? Because the sensation is usually tied to bodily damage and the unpleasantness is very strong? Because it forces attention?
    - Address predictable problems:
        - Some students might not find the stimuli unpleasant enough, or might have different thresholds. This could lead to noise in the data, but it can be discussed as individual variation.
        - The opt-out might lead to some students not having the experience. They can still participate by imagining and listening to others.
        - The scenarios (asymbolia, global indifference) are hypothetical and some students might find them hard to imagine. Stress that we are doing thought experiments.
        - The liked pain scenario might be controversial (some might say it's not pain if it's liked). This is a point for discussion: can we have the same sensation but with a different affective reaction?
        - Time management: The experiential part and the group discussions might run over. Be strict with time and cut off if needed. The debrief is critical.

    - What the activity can't stage: 
        - We cannot actually make them experience pain without unpleasantness (as in asymbolia) or unpleasantness without the sensation. So we rely on thought experiments for that. 
        - The activity doesn't directly address the normative question: should we avoid unpleasantness? But that's for the lecture after.

    - Finally, introduce the term "asymbolia" and explain that it is a real condition (though rare) and that the activity was designed to help them see the distinction that philosophers like David Bain, Murat Aydede, and others have discussed.

  Materials Needed:
    - For ice water: a bucket, ice, water, towels.
    - For bitter: quinine strips or very bitter candy (like unsweetened chocolate or bitter melon extract).
    - For sound: a pre-recorded unpleasant tone (e.g., 3000 Hz at high volume, but safe level) and a speaker.
    - For wall sit: a clear wall space.
    - Rubber bands (for snap).
    - Reflection sheets and pens.
    - Timer.

  Safety and Ethics:
    - Clearly state that they can opt out at any time without penalty.
    - Avoid any stimuli that might cause harm (e.g., for ice water, warn about cold injuries if prolonged, but 10 seconds is safe; for wall sit, warn if they have knee problems; for bitter, check for allergies; for sound, keep at a safe volume; for breath holding, only if they are healthy and not asthmatic, and only for a short time).
    - Have water available for after the bitter taste.

  This plan should fit in 90 minutes and achieve the learning objectives.
answer: |-
  ### Pain Component Separation Activity: Setup and Timeline

  #### **Learning Goal**  
  Students experientially disentangle sensory intensity from unpleasant affect in aversive experiences, then explore philosophical implications for well-being (badness location, asymbolia variants, and "liked pain").

  ---

  ### **Setup & Materials**  
  - **Stations**:  
    1. **Pain Station**: Ice water bath (5°C) in a large bowl. *Alternative*: 60-second wall-sit (if space allows).  
    2. **Unpleasantness Station**:  
       - *Option A*: Bitter strip (e.g., Denatonium benzoate paper).  
       - *Option B*: 10-second "air hunger" (exhale fully, hold breath).  
       - *Option C*: Nails-on-chalkboard audio loop (play via speaker).  
  - **Materials**:  
    - Ice water basin, towels, timers.  
    - Bitter strips (e.g., "Bitrex" safety strips) / speaker for audio.  
    - Private reflection sheets (printed; see questions below).  
    - Whiteboard for group responses.  
  - **Opt-Out Protocol**:  
    - *Explicitly state*: "You may skip any activity, no questions asked. Observing is just as valuable."  
    - Alternatives for non-participants: Describe past experiences (e.g., dental pain, disgust at a smell).  

  ---

  ### **Timeline (90 Minutes Total)**  

  #### **Phase 1: Experiential Split (25 min)**  
  1. **Introduction (5 min)**:  
     - "Today we’ll explore aversive experiences. You’ll briefly try two stimuli and reflect privately. No right answers—just notice."  
     - Assign stations (half class to each first; rotate).  

  2. **Stimulus Exposure (10 min)**:  
     - **Station 1 (Pain)**: Submerge hand in ice water for 15 sec (or wall-sit 20 sec).  
     - **Station 2 (Unpleasantness)**: Suck bitter strip for 10 sec (or hear noise/hold breath).  
     - *Safety*: Supervise ice water for slipperiness; bitter strips pre-cut to minimize dose.  

  3. **Private Reflection (10 min)**:  
     Distribute sheets with questions:  
     > **A. During the PAINFUL stimulus**:  
     > 1. Sensory details: Where did you feel it? Rate intensity (1–10). Describe quality (e.g., "burning," "aching").  
     > 2. Unpleasantness: Rate how "bad" it felt (1–10).  
     > 3. What would you pay to avoid this *exact* experience again? (e.g., "$5," "skip a coffee," "5 mins of my time").  
     > 4. What are you *really* avoiding? (e.g., "the throbbing," "the distress," "losing focus").  
     >  
     > **B. During the UNPLEASANT stimulus**:  
     > *(Same as A1–4)*  
     >  
     > **C. Comparison**:  
     > 5. If you could remove ONLY the sensory intensity (e.g., cold without discomfort), would you still avoid the pain?  
     > 6. If you could remove ONLY the unpleasantness (e.g., bitter taste without disgust), would you avoid it?  

  ---

  #### **Phase 2: Group Synthesis (20 min)**  
  1. **Pair-and-Share (10 min)**:  
     - Students compare reflections in pairs:  
       - "Were your ‘avoidance prices’ similar for pain vs. unpleasantness? Why or why not?"  
       - "Did anyone *not* want to avoid the sensation once unpleasantness was removed?"  

  2. **Class Brainstorm (10 min)**:  
     - Whiteboard two columns: **Pain** vs. **Unpleasantness**.  
     - Poll volunteers:  
       - "What did you say you were avoiding in each?" (List responses).  
       - "Who would *still* avoid the ice water if it felt cold but neutral?"  
     - *Goal*: Surface consensus that unpleasantness drives avoidance (*not* sensation alone).  

  ---

  #### **Phase 3: Thought Experiments (25 min)**  
  **Introduce without jargon**: "Now imagine scenarios where reactions to pain/unpleasantness change."  

  1. **Scenario 1: Selective Indifference (10 min)**  
     > *"Jane feels pain normally (she pinches her arm and says ‘6/10 intensity, sharp’). But she doesn’t care—no urge to stop it. She still enjoys music and hates bitter tastes. Is Jane’s pain bad for her? Why?"*  
     - **Discussion**:  
       - Split groups: 2 argue "yes, bad"; 2 argue "no, not bad."  
       - *Key prompt*: "If she feels everything normally but *only* lacks pain aversion, is the ‘badness’ in the sensation or her reaction?"  

  2. **Scenario 2: Global Indifference (5 min)**  
     > *"Mark feels pain, bitterness, and joy—but cares about none of it. He’s indifferent to everything. Is his pain bad for him? Does it matter that he also doesn’t care about joy?"*  
     - **Discussion**:  
       - Contrast with Jane: "Does the badness require *any* capacity to care, or is pain uniquely bad?"  

  3. **Scenario 3: Liked Pain (10 min)**  
     > *"Alex feels identical ice-water pain (7/10 intensity, cold-burning) but *enjoys* it. They’d pay to feel it again. Is this bad for Alex? If not, where did the ‘badness’ go?"*  
     - **Discussion**:  
       - "If unpleasantness is gone, is the sensation still bad? Does intention matter (e.g., if it’s self-harm)?"  

  ---

  #### **Phase 4: Debrief & Theory Mapping (20 min)**  
  - **Reveal key terms**: Define *asymbolia* (selective) vs. *global indifference*.  
  - **Map responses to theories** (whiteboard):  

    | **Student Observations**          | **Philosophical Position**                          |  
    |-----------------------------------|----------------------------------------------------|  
    | "I avoided the *distress*, not the cold"           | Badness = Unpleasantness (affective component)     |  
    | "Pain demands attention—I couldn’t ignore my hand" | Badness = Forced care about body (sensory salience) |  
    | "Even without ‘hurt,’ the ice disrupted my focus"  | Badness = Hijacking attention/action               |  

  - **Synthesize wrinkles**:  
    - **Selective asymbolia**: If pain isn’t bad without unpleasantness (Jane), badness lives in affect.  
    - **Global indifference**: If pain is only "bad" if we *can* care, badness requires broader agency.  
    - **Liked pain**: If "badness" vanishes when affect flips, it supports affect-based theories.  

  - **Unstageable Disagreement**:  
    > "The activity *can’t* resolve whether ‘badness’ is objective (e.g., pain is inherently bad) or subjective (depends on the experiencer). You’ll see this in debates about whether Jane’s pain is *truly* not bad or if she just *thinks* it’s not bad."  
    > *(Explain post-activity: This requires analyzing meta-ethical frameworks like realism vs. subjectivism.)*  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Stimuli Flop**:  
     - *Risk*: Ice water feels "refreshing"; bitter strip is "mild."  
     - *Fix*: Test stimuli first. Have backups (e.g., hot sauce for bitterness; longer breath-hold).  

  2. **Skewed Avoidance Prices**:  
     - *Risk*: Students name joke prices ("$1,000,000"), confusing data.  
     - *Fix*: Pre-frame: "Give a *realistic* price—what you’d *actually* trade."  

  3. **Over-Generalizing**:  
     - *Risk*: "Pain is *always_ just sensation + dislike."  
     - *Fix*: In debrief, note: "Some theories (e.g., evaluativism) say these can’t be separated. We simplified for clarity."  

  4. **Ethical Anxiety**:  
     - *Risk*: Students feel pressured despite opt-out.  
     - *Fix*: Start with: "Your comfort is paramount. I skipped the hot peppers for this reason."  

  5. **Time Crunch**:  
     - *Risk*: Thought experiments run long.  
     - *Fix*: Use strict timers; cut group reports to 1 insight each.  

  ---

  ### **Instructor Notes**  
  - **Don’t Lecture Early**: Let confusion arise organically in reflections.  
  - **Emphasize Safety**: For wall-sits/breath-holding, say: "Stop if dizzy/uncomfortable."  
  - **Post-Activity Reading**: Assign Bain’s "Why Take Painkillers?" (links asymbolia to badness location).  
  - **Why It Works**: The visceral "aha!" when students realize they’d pay to skip bitterness but not neutral cold exposes the affect/sensation split—no lecture needed.  

  This structure forces engagement with the components, uses wrinkles to test intuitions, and fits snugly in 90 minutes. Run it, then refine based on where students get stuck!
