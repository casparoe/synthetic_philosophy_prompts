prompt: |-
  I teach a twelve-week upper-level seminar on concepts and categorization. The students are third- and fourth-years, roughly half philosophy majors and half cognitive science; they have already worked through the classical theory, prototype accounts, and exemplar accounts on the usual natural-kind-ish cases (water, gold, tiger). The session I need planned is the fifth, eighty minutes, seminar table and whiteboard, no projector — anything I use has to be drawable by hand in a few strokes. It is the pivot of the course: the point where we move from natural kinds to artifacts and notations, and I want to spend the whole hour on one question — what makes every 'a' an 'a'? — the question behind Hofstadter's Letter Spirit project. Please do not explain the question to me; I want a plan for teaching it.

  What I want from you:

  1. The order in which the components have to be introduced, with the dependency made explicit: what has to be in place before the question even looks like a question to them, and which step collapses if an earlier one is skipped or reversed. In particular, tell me whether the three-way distinction between the letter-type, the typeface or hand, and the individual variant should be handed to them at the start as vocabulary or extracted from them at the end, and what is lost each way. The claim I want them to be able to state by the end is that sameness of letter across its guises is neither sameness of intrinsic shape-properties nor a matter of stipulation, and that style is the name of what varies while letter-identity does not — but tell me if that is the wrong thing to aim at in eighty minutes.

  2. The one example to carry the session, what it must make vivid, and what it must keep out of the way. My candidate is a typeface — call it Rotunda — in which every lowercase glyph is the shape standardly used for the next letter of the alphabet, so that a page set in Rotunda looks like entirely ordinary, well-made text and cannot be read. I have also considered a face in which only the 'a' and 'o' shapes are exchanged and everything else is left alone, and a set of real 'a's from a serif face, a geometric sans, a blackletter, and a shaky hand. Which of these should carry it, or is there a better one? I suspect the failure mode is an example that lets them say it is obviously a code and stop thinking in the first two minutes.

  3. The misconceptions, the order in which they will actually arise, and the point in the sequence at which each should be headed off. The two I am confident about are the template picture — they will think sameness of letter is sameness of some stripped-down shape — and the shrug that since writing is a convention there is nothing more to say. I would guess there are three or four more, including one about the relation between being an 'a' and being read as an 'a', and one specific to the cognitive scientists in the room, who will reach for a learned similarity space and think the philosophical question dissolves.

  4. What to leave out at this level and say out loud that I am leaving out. I do not want to describe the Letter Spirit program's own machinery, and I do not want to reopen the general question of whether concepts are prototypes or theories. Tell me what else I should refuse to explain.

  5. A check that discriminates. At the end I would like to put a script I have invented in front of them: five letters, of which one is a small closed round bowl with a vertical stroke descending from the right of the bowl and a short horizontal bar crossing the stroke about two-thirds of the way down; a second is the same figure without the bar; a third has the bowl open at the lower left; a fourth has the bowl replaced by a triangle. Then a fifth figure — the first one, with the bowl broken and the bar reduced to a stub — and the question: which letter is it? Tell me what else the set has to contain for that question to have a determinate answer rather than being a matter of taste, and what an answer would have to cite in order to count as having got the idea rather than having been told it.

  Two last things. Mark the step in your sequence that you are least confident about, and the point where the plan depends on a substantive claim about perception or about conventions that you would expect a colleague of mine to reject. And if something in my framing is confused — if the distinction I want them to end up with is less stable than I am assuming, if the letterform case cannot bear the weight I am putting on it, or if the hour cannot hold what I have asked for — say so plainly instead of politely building me a plan around it, and tell me which of my stipulations to drop.
reasoning: |-
  We are designing an 80-minute seminar session for an upper-level course on concepts and categorization. The goal is to pivot from natural kinds to artifacts and notations by focusing on the question: "What makes every 'a' an 'a'?" (inspired by Hofstadter's Letter Spirit). The session should lead students to the claim that sameness of letter across guises is neither intrinsic shape-sameness nor mere stipulation, and that style is what varies while letter-identity remains fixed.

  ## 1. Order of Components and Dependencies

  The session must build step by step, ensuring that the question becomes meaningful. The key dependency is that students must first see that letter identity is not tied to a specific shape (breaking the template picture) and then see that it's not arbitrary either (avoiding the convention shrug). The three-way distinction (letter-type, typeface/hand, individual token) is central and should be extracted through examples, not handed as vocabulary at the start. 

  ### Sequence:

  1. **Introduction (5 min):** 
     - Start with a concrete example: show (by drawing) a few 'a's from different typefaces (e.g., serif, sans-serif, handwritten). 
     - Ask: "What makes these all the letter 'a'?" 
     - This immediately presents the puzzle.

  2. **Challenge the Template (15 min):**
     - Draw two very different 'a's (e.g., a double-story 'a' and a single-story 'a'). 
     - Ask: "Is there a common shape?" 
     - Then, introduce the Rotunda example (where each lowercase glyph is the shape of the next letter). Draw a few Rotunda glyphs (e.g., what looks like an 'a' is actually the shape of a 'b', etc.). 
     - Point: Rotunda has well-formed glyphs, but they don't function as the expected letters. This breaks the idea that any fixed shape must correspond to a letter.

     *Dependency:* Without this step, students might cling to the template picture. The Rotunda example is crucial because it shows that even with perfect shapes, if they are in the wrong role, they aren't the letter.

  3. **Convention Shrug Counter (10 min):**
     - Now, present the typeface where only 'a' and 'o' are swapped (draw a word with 'a' and 'o' swapped, e.g., "cat" becomes "cot" in appearance but is intended to be read as "cat" with swapped letters). 
     - Ask: "Is the swapped shape now an 'a'?" 
     - Students will likely say no. Then press: "But if it's just convention, why can't we stipulate that this shape is now an 'a'?" 
     - Point: Convention alone doesn't explain why we can't arbitrarily reassign. There must be something about the role in the system.

     *Dependency:* This step must come after breaking the template because if they think there's a fixed shape, convention isn't needed. Now they see that even with convention, there are constraints.

  4. **Introduce the Three-Way Distinction (15 min):**
     - Now extract the vocabulary. Draw multiple tokens of the same letter in the same typeface (e.g., three 'a's in Times New Roman) and then in different typefaces. 
     - Guide them to see:
       - The letter-type (the abstract category 'a')
       - The typeface (e.g., Times New Roman vs. Helvetica) which gives a style
       - The individual token (each drawn instance)
     - Emphasize that the same letter-type can have different styles (and tokens), and the same style can be applied to different letter-types.

     *Why extract, not hand?* If handed at the start, they might not see the problem. By extracting, they see why we need these distinctions.

  5. **Cognitive Science Temptation (10 min):**
     - The cognitive science students might think: "We recognize letters by learned similarity in a perceptual space." 
     - Counter: Show two 'a's that are very dissimilar (e.g., a printed 'a' and a cursive 'a') and ask: "Do they look similar? Or do we categorize them together because of their role?" 
     - Then, show the Rotunda example again: the shapes are familiar (they are the shapes of other letters) but in Rotunda, the 'a' shape is the one we usually call 'b'. So why isn't it recognized as 'b'? Because of the system.

     *Dependency:* This must come after the three-way distinction because we need to contrast the role-based view with the similarity-based view.

  6. **The Role of Style (10 min):**
     - Define style as the set of variations that preserve letter identity. Draw a few letters in a consistent style (e.g., all with rounded corners) and then change the style (e.g., angular). 
     - Ask: "What changes? What remains the same?" 
     - Then, break the style: draw a word where one letter is in a different style. Does it still count as the same letter? (Yes, but it looks odd.) 
     - Claim: Style is what varies while letter-identity does not.

  7. **Synthesis (10 min):**
     - State the claim: Sameness of letter is not sameness of intrinsic shape (as Rotunda shows) and not mere stipulation (as the swap example shows). It is about the role in a system of writing, and style is the dimension of variation that does not change the letter identity.

  ## 2. The Carrying Example

  Use the **Rotunda example** as the primary carrier. Why?
  - It vividly shows that even with perfectly normal shapes, if they are assigned to the wrong letter, the text is unreadable. This breaks the template picture.
  - It keeps out of the way the idea that it's just a code: because the shapes are familiar, but they are in the wrong place, so it's not a simple substitution cipher (which would be decipherable). Rotunda is not meant to be deciphered; it's meant to look normal but not function.

  The other examples:
  - The 'a'-'o' swap: useful for the convention counter, but not as primary.
  - Real 'a's from various faces: good for the initial puzzle but not for breaking the template.

  Rotunda avoids the failure mode because it doesn't look like a code; it looks like ordinary text that just doesn't make sense. It forces the issue of functional role.

  ## 3. Misconceptions and When to Address Them

  a. **Template picture (shape essentialism):** 
     - Will arise immediately when you show different 'a's. 
     - Address in Step 2 (Rotunda) by showing that same shape can be different letters and different shapes can be same letter.

  b. **Convention shrug (arbitrariness):** 
     - Will arise after the template is broken. 
     - Address in Step 3 (swap example) to show that convention alone doesn't allow arbitrary reassignment.

  c. **Recognition = Identity (if it's read as an 'a', it is an 'a'):** 
     - This might come up when discussing the Rotunda example: "If we get used to Rotunda, then we'll read it." 
     - Counter: That's changing the system. In our current system, Rotunda is not readable. The point is about the current system of writing.

  d. **Cognitive science: learned similarity space:** 
     - Address in Step 5 by showing dissimilar 'a's and the Rotunda example. The Rotunda 'a' (which is the shape of 'b') is perceptually similar to 'b's we've seen, but in Rotunda it's not a 'b'. So perception isn't enough; it's the role.

  e. **Confusion between token and type:** 
     - This is why Step 4 (three-way distinction) is necessary. Without it, they might think each token is just an instance of a shape template.

  ## 4. What to Leave Out

  - **Letter Spirit's machinery:** Do not describe the AI program. The goal is the philosophical question, not the computational model.
  - **General concepts debate (prototypes vs. theories):** Avoid reopening this. The focus is on the specific case of letters as artifacts.
  - **Historical evolution of letterforms:** Interesting but tangential. Leave out unless a student raises it, then note it's for another time.
  - **Neural basis of letter recognition:** The cognitive science students might want to go there. Say: "We're focusing on the conceptual structure, not the implementation."

  ## 5. The Check: Invented Script

  The check: Present five figures (as described) and then a broken version of the first. The set must contain:

  - **Enough variation to establish a style:** The first four figures should be in a consistent style (e.g., all have a vertical stroke, a bowl, etc.) and be distinct letters. For example:
    1. Closed bowl with vertical stroke and bar (say, 'p' or 'd'?).
    2. Same without bar (maybe 'b'?).
    3. Bowl open at lower left (like an 'a'?).
    4. Bowl replaced by triangle (a different letter?).

  But the critical point is that the set must establish a system of contrasts. For the fifth figure (broken first one) to be identifiable, the system must have:

  - **Contrasts between the letters:** For example, the bar might be distinctive of one letter (say, the first) versus the second (without bar). Then the broken one (with a stub) is closer to the first because it retains the remnant of the bar.

  What must be cited for a correct answer?
  - Not just perceptual similarity (the broken one looks like the first) but the role in the system: the bar was a distinctive feature of the first letter, and even though broken, the remnant serves the same contrastive function. They must note that the broken figure preserves the critical feature that distinguishes it from the second figure (which has no bar at all).

  Without a system of contrasts, the question is indeterminate. So the set must include at least two letters that are distinguished by the presence/absence of the bar. Then the broken one, having a remnant, is still in the "bar" category.

  ## Marking Weak Points and Substantive Claims

  - **Least confident step:** Step 5 (Cognitive Science Temptation). It might be too brief, and if students are entrenched in similarity-based views, it could derail. Be ready with more examples (e.g., uppercase and lowercase 'a' look different but are the same letter).

  - **Substantive claim that might be rejected:** The claim that letter identity is not reducible to perceptual similarity and is instead a matter of role in a system. Some colleagues might argue that all roles are ultimately implemented by perceptual processes, so the distinction is artificial. This plan assumes that the system-level role is conceptually distinct.

  ## If the Framing is Confused

  The letterform case can bear the weight, but the hour is tight. The key risk is that students might not let go of the template picture. Rotunda is crucial for that. The distinction (letter-type, style, token) is stable for the purpose of this session. However, if time runs short, be prepared to skip the cognitive science point (Step 5) and focus on the philosophical core.

  ## Adjusted Plan for 80 Minutes

  Given the time, here's a revised timing:

  1. Introduction and initial puzzle (5 min)
  2. Rotunda example to break template (15 min)
  3. Swap example to counter convention shrug (10 min)
  4. Extract three-way distinction (15 min)
  5. Style and variation (10 min)
  6. Cognitive science counter (if time, else skip) (5 min)
  7. Synthesis and check (20 min for synthesis and the invented script)

  The check (invented script) can be done in the last 10 minutes. Have the figures pre-drawn on the board.

  The session is ambitious but feasible if the examples are clear and the discussion is focused.
answer: |-
  Below is a structured 80-minute seminar plan designed to achieve your pedagogical goals. I've built it around your stipulations, prioritized conceptual dependencies, and flagged potential pitfalls. The plan is ambitious but feasible if tightly moderated. **Crucially, I mark one key step as unstable (Step 4) due to time constraints and a substantive claim about conventions that may be contested.**

  ---

  ### **1. Sequence of Components & Dependencies**  
  *(Total: 75 min + 5 min synthesis)*  
  **Dependency Chain**: Initial examples → Elicit template/shrug misconceptions → Introduce Rotunda to collapse both → Extract three-way distinction → Style as invariant-preserver → Check via invented script.  
  **Why extract the distinction?** Handing the triad (letter-type/typeface/token) upfront risks seeming stipulative. Instead, **extract it inductively** (Step 4). What’s lost: Efficiency. What’s gained: Students *feel* the problem’s necessity. Reversing this would make the resolution seem arbitrary.  

  **Steps**:  
  1. **Pose the Core Question (5 min)**  
     - Draw 3 *radically different* 'a's: serif (e.g., Times New Roman), geometric sans (e.g., Helvetica), shaky handwritten.  
     - *Prompt*: "You all call these 'a'. Why? What *must* be shared?"  
     - *Goal*: Surface template/shrug reflexes immediately.  

  2. **Elicit Misconceptions (10 min)**  
     - *Expected Responses*:  
       - **Template (shape-essentialism)**: "They share a core shape."  
       - **Convention Shrug**: "We just decided to call them 'a'."  
       - **Cognitive Science (learned similarity)**: "Our brains map variants to a prototype."  
     - *Pushback*: "If shape is key, what *is* the shared shape? If convention, why can’t we swap shapes arbitrarily?"  
     - *Dependency*: Must precede Rotunda to heighten tension.  

  3. **Introduce Rotunda (15 min)**  
     - Draw Rotunda: e.g., glyph with 'a'-label but 'b'-shape, 'b'-label but 'c'-shape, etc.  
     - *Key Properties*:  
       - Each glyph is "well-formed" (non-aliased, familiar contours).  
       - The *system* is dysfunctional (looks normal but unreadable).  
     - *Why Rotunda?* It:  
       - **Vividly shows** letter identity ≠ shape (same shapes now fail).  
       - **Blocks "just a code" shrug** by being uncrackable without external key.  
       - **Excludes** prototype confusion (shapes are prototypical but misassigned).  
     - *Avoid*: Your 'a/o swap' example (too simple, invites code-thinking). Real 'a' variants (too tractable).  

  4. **Extract Three-Way Distinction (20 min)** ***(Least Confident Step)***  
     - *Prompt*: "Rotunda uses 'correct' shapes, yet fails. What’s missing?"  
     - Guide discussion to:  
       - **Token**: This drawn glyph.  
       - **Typeface/Rotunda**: A system of glyph-shape conventions.  
       - **Letter-type**: Function of a glyph in a writing system (e.g., 'a' as first vowel).  
     - *Extraction Path*:  
       - Q1: "Is a Rotunda 'a' the same *token* as this serif 'a'?" (No → tokens are particulars).  
       - Q2: "Is Rotunda a valid *typeface*?" (Yes, it has consistent rules).  
       - Q3: "Why isn’t its 'a' functioning as an *'a'-type*?" (It’s not playing 'a's role).  
     - *Risk*: Time-consuming if students don’t land the triad. Have a fallback: Sketch the distinction if >12 min elapse without progress.  

  5. **Define Style as the Invariant-Preserver (10 min)**  
     - Draw 3 'a's in *one* consistent style (e.g., all rounded sans) + 1 in clashing style (e.g., blackletter).  
     - *Prompt*: "Which changes break letter-identity? Which don’t?"  
     - *Synthesis*: "**Style** is what varies *without* breaking identity (e.g., serif vs. sans). Rotunda breaks identity by misassigning *roles*, not style."  
     - *Goal Met*: Sameness ≠ shape (Rotunda); ≠ stipulation (Rotunda stipulates but fails); style = what varies harmlessly.  

  6. **Invented Script Check (10 min)**  
     - Draw your 5 figures:  
       - **1**: Closed bowl + vertical stroke + bar → Label as "Letter X".  
       - **2**: Same, no bar → "Letter Y".  
       - **3**: Bowl open at lower left → "Letter Z".  
       - **4**: Triangular bowl → "Letter W".  
       - **5**: Broken bowl + bar stub → "Which letter?"  
     - *For Determinacy, Add*:  
       - A **contrast pair** (e.g., 1 and 2 differ *only* by bar) to establish bar as **functional feature**.  
       - A **style anchor** (e.g., all share stroke thickness/curvature) to isolate identity-critical traits.  
     - *Correct Answer*: "X" because:  
       - Bar stub preserves the **functional contrast** with Y (absence of bar).  
       - Bowl breakage is **stylistic damage** (like messy ink), not role change.  
     - *Why This Works*: Cites system role (bar defines X vs. Y), not perception alone.  

  7. **Synthesis (5 min)**  
     - Restate: Letter-identity is **role-dependent in a system**. Rotunda corrupts roles; style modulates form within role constraints.  

  ---

  ### **2. Misconceptions & Mitigation Order**  
  Address them *as they arise* in the sequence above:  
  1. **Template (Step 2)**: Killed by Rotunda (same shape ≠ same letter).  
  2. **Convention Shrug (Step 2)**: Killed by Rotunda (stipulation alone fails without system coherence).  
  3. **Recognition = Identity (Step 3)**: "If Rotunda *were* readable, wouldn’t it work?" → No: Readability *presupposes* stable roles (Hofstadter’s point).  
  4. **Cognitive Science (Step 2/5)**: "Can’t we just learn a new similarity space?" → Rotunda’s shapes *are* in our space but misassigned; systems > perception.  
  5. **Token-Type Confusion (Step 4)**: Mitigated by extraction triad.  

  ---

  ### **3. What to Leave Out**  
  State explicitly:  
  - "We’re **not** discussing Letter Spirit’s AI mechanics (e.g., grid agents, role-transfer)."  
  - "We’re **not** revisiting prototypes vs. theories for natural kinds. Focus: artifacts’ *system-dependent identity*."  
  - "We’re **bracketing** how scripts evolve historically or neurally."  

  ---

  ### **4. Substantive Claim & Risks**  
  - **Contested Claim**: "Letter-identity requires *systemic role-fixing*, not just intention or convention." A conventionalist colleague might argue Rotunda *is* valid if users accept it. **Retort**: Even then, identity depends on *consensual role*, not shape.  
  - **Weak Step**: Step 4 (extraction). With cognitive science students, the triad may feel artificial. **Mitigation**: Use their language—e.g., "typeface as parameter space," "token as instance."  
  - **Framing Risk**: The letter case *can* bear the weight, but **style** may seem less universal than you hope. Style is parasitic on a system’s identity conditions. If pressed, concede: "Today, style = variation within identity-preserving bounds."  

  ---

  ### **5. Adjustments if Time Falters**  
  - **Drop Step 5’s style deep dive** if extraction lags. State: "Style preserves identity; we’ll refine next week."  
  - **Skip cognitive pushback** if unraised. Focus on philosophy majors’ needs.  
  - **Simplify Rotunda** to 3 glyphs (e.g., a→b, b→c, c→a) if drawing is slow.  

  This plan balances discovery with rigor. Rotunda forces the insight; the script check consolidates it. If executed crisply, students will articulate the target claim.
