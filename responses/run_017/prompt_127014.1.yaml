answer: |-
  ### Short Note on Framing
  Your framing is coherent, not muddled. Pure time preference *is* the residual component after accounting for survival risk and differential growth. The normative claim that it "ought to be zero" is defensible but requires argument: it asserts that temporal position alone is not a morally relevant reason to discount wellbeing. The challenge is showing why this residual isn’t justifiable by appeals to psychological asymmetry or life-shaping preferences. Your decomposition correctly isolates the debate’s core.

  ---

  ### Essay Question  
  **Time Allowed:** 30 minutes  
  **Expected Length:** 500–700 words  

  > **Scenario:** Your team proposes a technical migration that costs 100 "units" now to enable a benefit of 500 units in 50 years. Leadership argues this is uneconomical because future benefits are discounted at 5% per year. At this rate, the present value of 500 units in 50 years is roughly 500 × (1.05)⁻⁵⁰ ≈ 43 units, less than the 100-unit cost.  
  >  
  > Assume a **constant, time-consistent discount rate** throughout. Define:  
  > - **Pure time preference (PTP)**: Discounting future wellbeing *solely* because it occurs later in time, with all other factors equal.  
  > - **Survival risk**: The annual chance the project is canceled or beneficiaries cease to exist.  
  > - **Differential growth**: Future beneficiaries may be richer, so 1 unit provides less incremental wellbeing.  
  >  
  > **Question:**  
  > 1. Decompose the 5% discount rate. Explain how PTP, survival risk, and differential growth *could* each contribute to it.  
  > 2. Describe a **diagnostic test** to distinguish PTP from survival risk. Use this: *If the project’s survival to year 50 were guaranteed, should your valuation of the 500-unit benefit change? If yes, how and why?*  
  > 3. Suppose spending 20 units *now* reduces survival risk (e.g., improves system resilience). Explain why applying the same 5% discount rate to both the 500-unit benefit *and* to the risk-reduction benefit might be flawed. What is the correct approach?  
  > 4. Argue whether PTP is defensible in a **fixed, closed system** (no growth, no survival risk, same beneficiaries). Address:  
  >   - *Is discounting for temporal position like discounting for spatial distance?*  
  >   - *Does your answer change if the beneficiary is one person vs. different people?*  
  > 5. A 5% rate makes benefits beyond 100 years negligible. Is this a fatal flaw for nonzero PTP?  
  >  
  > **Take a clear stand**: Defend *either* "PTP can be nonzero and rational" *or* "PTP should always be zero." Confront the strongest counterargument to your view.  

  ---

  ### Model Answer (850 words)  
  **Stand: Pure time preference (PTP) should be zero.**  

  **1. Decomposition**  
  A 5% discount rate aggregates three components. First, *survival risk*: If there’s a 5% annual chance the project fails, a rational agent discounts future benefits by 5%/year because they likely won’t materialize. Second, *differential growth*: If beneficiaries’ wealth grows 5%/year, 500 units in 50 years may feel like 43 units today due to diminished marginal utility. Third, *PTP*: A direct preference for earlier benefits, independent of risk or growth. Any observed rate (e.g., 5%) could arise from varying combinations—e.g., 2% survival risk + 2% growth effect + 1% PTP. Crucially, only PTP discounts wellbeing purely for its timing.  

  **2. Diagnostic Test**  
  Survival risk and PTP can be distinguished by conditional valuation. Suppose we learn the project *will* survive to year 50. If the original 5% rate included survival risk, we should *increase* the benefit’s present value (e.g., to 500 × (1.03)⁻⁵⁰ ≈ 114 units, assuming 3% residual discount from growth/PTP). If the rate reflected *only* PTP, the valuation remains ~43 units—timing hasn’t changed. Real-world discount rates often embed survival risk, so valuations *should* jump upon survival confirmation. Failure to adjust implies conflation or hidden PTP.  

  **3. Double Counting**  
  Applying 5% discounting to *both* the 500-unit benefit and a risk-reduction benefit (e.g., spending 20 units to cut survival risk) double-counts risk. Discounting the 500-unit benefit already accounts for baseline survival risk. The risk-reduction itself—e.g., lowering annual failure risk from 5% to 3%—should be valued as the *increase* in expected benefit. For example:  
  - Original expected benefit: 500 × (0.95)⁵⁰ ≈ 40 units  
  - After risk reduction: 500 × (0.97)⁵⁰ ≈ 140 units  
  - Value of risk reduction: 140 – 40 = 100 units  
  Discounting this 100-unit *certain* gain at 5% is wrong—it’s a near-term improvement. The correct approach: Discount only the *underlying benefit* (500 units) for risk, then add/subtract undiscounted risk-modification effects.  

  **4. Defending Zero PTP**  
  In a fixed, closed system (no growth, no survival risk, same population), PTP discounts wellbeing solely for temporal position. This is morally arbitrary, akin to discounting a stranger’s suffering because they’re far away spatially—a bias we reject. Temporal distance doesn’t diminish moral claims.  

  *Objection 1: "Time is unique—we traverse it sequentially, and anticipation/memory are asymmetric."*  
  Reply: Sequencing affects *delivery* (we can’t aid past sufferers) but not *valuation*. Future pain is equally bad whether it occurs tomorrow or in 50 years. Preferring earlier enjoyment in a single life isn’t PTP—it’s life-shaping (e.g., health while young). This is a preference about *life stages*, not time itself.  

  *Objection 2: "We discount spatially! We’d save a nearby drowning child before a distant one."*  
  Reply: Spatial discounting reflects practical constraints (time/energy to reach the distant child), not moral valuation. If rescue were costless, saving either child is equal. PTP lacks even this pragmatic defense.  

  *Single vs. Multiple Persons*: PTP is harder to justify intergenerationally—sacrificing future people for our gain is exploitation. But *intrapersonally*, "discounting" later life stages (e.g., retirement) is often irrational; it misallocates resources across one’s lifespan.  

  **5. Scale Sensitivity**  
  A constant positive PTP (e.g., 0.1%) makes catastrophes in 500 years morally irrelevant—effectively zero weight. This is a reductio: If a future climate disaster destroying millions is negligible today, our model is broken. Survival risk/growth effects don’t have this flaw—they reflect empirical realities, not axiomatic devaluation. Nonzero PTP is unsustainable for long-horizon decisions.  

  **Conclusion**  
  PTP should be zero. Observed discounting should attribute all value reduction to survival risk, growth effects, or computational constraints—never to time itself. This avoids arbitrary devaluation of the future and prevents double counting. The 5% rate in the scenario likely embeds risk/growth; stripping those leaves no justification for PTP.  

  ---

  ### Marking Scheme (20 marks total)  
  **4 marks: Decomposition**  
  - Explains how 5% could mix PTP, survival risk, and growth.  
  - *Common error:* Merely defining terms without linking to the 5% rate.  

  **4 marks: Diagnostic Test**  
  - States that guaranteed survival should increase valuation *if* survival risk was part of 5%.  
  - Contrasts with PTP (no change if survival guaranteed).  
  - *Common error:* Claiming valuation "shouldn’t change" without justification.  

  **4 marks: Double Counting**  
  - Identifies flaw: Discounting both benefit and risk-reduction at same rate counts risk twice.  
  - Gives correct method (e.g., value risk reduction separately/undiscounted).  
  - *Common error:* Proposing to "adjust the rate" without specifying how.  

  **4 marks: Normative Stand**  
  - Takes clear stand (e.g., "PTP must be zero").  
  - Addresses spatial analogy + single/multiple persons.  
  - Counters strongest objection (e.g., time asymmetry or spatial discounting).  
  - *Common error:* Undefended assertion or ignoring counterarguments.  

  **4 marks: Scale Sensitivity**  
  - Notes far-future weights → 0 with constant PTP.  
  - Argues whether this is reductio (e.g., yes for PTP; no for risk/growth).  
  - *Common error:* Ignores scale or conflates with risk/growth.  

  **Zero Marks If:**  
  - Confuses discounting value vs. probability (e.g., "5% *is* the survival risk").  
  - Asserts "discounting is irrational/fine" without argument.  
  - Recites formulas without conceptual analysis.  

  ---

  ### First-Class vs. Upper Second Boundary  
  **First-Class (16–20 marks):** Clear stand defended with structured arguments. Integrates all five parts coherently. Diagnoses double counting precisely and offers correct alternative. Engages deeply with objections (e.g., "But time feels different!" answered robustly). Scale sensitivity used to reinforce stand.  

  **Upper Second (12–15 marks):** Covers all parts but with gaps. Stand is clear but defenses are uneven (e.g., strong on decomposition, weak on spatial analogy). May misstep on double counting (e.g., "adjust the rate" without specifics). Scale sensitivity noted but not weaponized effectively.  

  **Boundary Example:**  
  - *First-Class:* "PTP is immoral like spatial bias—rescuer analogy fails because PTP lacks constraints. Double counting: Discount only the base benefit for risk; risk reduction is a separate near-term gain."  
  - *Upper Second:* "PTP might be acceptable personally but not intergenerationally. Double counting is bad; use a different rate."
