prompt: |-
  Before I take another claim of the form "this legal change was ultimately a product of the economic structure" seriously, I want a specification rather than a verdict. Write the desiderata that any adequate theory of the relation between the economic base and the rest of social life — law, religion, science, family forms, political institutions, art — would have to meet, where adequate means adequate for exactly one job: serving as a standard for judging individual causal claims of that form in ordinary historical and political argument, not as a predictive science of long-run social change. So the theory is not required to forecast anything, and not required to rank modes of production by stage.

  The distinctions I most want the list to respect:

  Origination, selection, and shaping must be kept apart. A base may bring an element into existence, or merely filter variants that arose for unrelated reasons, or leave the element intact while fixing its content or use. A theory that tests only for origination will misclassify most real cases, and I want to know what evidence would separate the three.

  The grain of the base must be fixed in advance — how fine a description of the economic structure may be invoked (capitalist versus financialized, export-led capitalism with a large domestic rentier sector), and who bears the burden of proof when a mismatch is explained away by redescribing the base. Without this I cannot tell a confirmed theory from an unfalsifiable one.

  The hand-me-down and callback cases must be handled: elements that arrive by diffusion from another society, or are inherited from a predecessor economic structure, rather than generated by the present one; and old forms that a later structure revives and re-functions for its own purposes, such as feudal honor idioms in a modern officer corps or archaic legal categories pressed into service for novel property regimes. A theory must say what it predicts about such elements and how to tell inert residue from reactivated residue.

  The boundary problem must be answered: whether the relations of production themselves include the legal forms that constitute property, contract, and the wage relation. If they do, say what is left of the claim that the base explains the law; if they do not, say what makes the base an economic rather than a juridical entity.

  Wrong-way cases must be allowed or excluded explicitly — state fiscal capacity, rules on lending at interest and on marriage, religious doctrine plausibly shaping accumulation rather than the reverse.

  Content, uptake, and direction must be separable, with natural science as the test case: a practice's internal content, the resources and prestige it attracts, and the uses its results are put to may each relate to the base differently.

  And the theory must say, in the only sense I can test, what the familiar last-instance formula means and what would count as evidence against it.

  For each requirement, give the case or consideration behind it and mark it non-negotiable, negotiable, or a preference of one camp (predictive power, rational-choice microfoundations, refusal to treat any elite's self-description as data, and so on). Then tell me which two requirements you suspect cannot be jointly satisfied: my own suspicion is that fixing the grain of the base in advance and giving the theory enough latitude to absorb inherited and imported elements pull in opposite directions, and I want to know whether that is right rather than merely plausible. Finally, say which single requirement excludes the most candidates. A table for the requirements and their motivating cases is fine; keep any scorecard of the familiar positions — straight reductionism, functional explanation, relative autonomy with reciprocal causation, and the view that there is no economic essence to be explained — to a few lines each, since the criteria, not the scoring, is what I want. Lead with your bottom line, whether the list is jointly satisfiable and if not which requirement you would drop, in the first sentence, then give the reasoning. No preamble and no restatement of my question.
reasoning: |-
  Hmm, the user is asking for a rigorous set of criteria to evaluate claims about how economic structures influence other social domains like law, religion, and politics. They want these criteria to assess specific historical claims, not to build a predictive theory. They've outlined several key distinctions that must be addressed: origination vs. selection vs. shaping, defining the "grain" of the economic base, handling inherited or imported elements, clarifying what counts as the economic base, accounting for reverse causation, separating different aspects of influence, and interpreting the "last instance" doctrine.

  The user seems frustrated with vague Marxist theories where economic explanations can be stretched to fit anything. They want concrete standards to test individual causal claims in historical arguments. Their examples show they're thinking about complex cases like how feudal honor persists in modern militaries or how religious doctrines might influence economic development.

  I need to construct a list of requirements that address each of these concerns. For each requirement, I should note its motivation and how flexible it is. The user also wants me to identify which two requirements might conflict (they suspect defining the economic base precisely might clash with allowing inherited/influenced elements) and which requirement would eliminate most theories.

  The boundary problem about whether legal forms are part of the economic base is particularly tricky. If law is part of the base, then claiming the base "explains" law becomes circular. But if not, we need to define what makes the base purely economic. This might be the most exclusionary requirement.

  The user also wants me to state upfront whether all requirements can be satisfied simultaneously. Given the conflicts between precise base definitions and handling diffusion/revival cases, and between last-instance testability and non-predictive aims, I suspect full satisfaction might be impossible. I'd prioritize dropping the last-instance requirement since it pulls toward predictive claims the user wants to avoid.

  For the requirements list, I'll include: causal mechanism specification, base definition granularity, diffusion/revival handling, base-juridical boundary clarity, reverse causation policy, content-uptake-direction separation, and last-instance operationalization. Each will be tagged as non-negotiable, negotiable, or camp-specific based on the user's concerns.

  The grain definition and diffusion requirements likely conflict, as the user suspects - precise base definitions struggle with external elements. And the boundary problem will filter out many theories since most either include juridical elements in the base (creating circularity) or struggle to define a purely economic base.

  I'll present this concisely with a table summarizing requirements, then analyze conflicts and filtering power, ending with which requirement to drop if needed.
answer: |-
  **Bottom line:** The desiderata are jointly satisfiable only if the last-instance requirement is relaxed or reinterpreted; otherwise, drop Requirement 7 (Last-Instance Operationalization) to achieve coherence for the stated purpose.

  **Desiderata Table:**

  | Requirement                                | Motivating Case/Consideration                                                                 | Status              |
  | :----------------------------------------- | :-------------------------------------------------------------------------------------------- | :------------------ |
  | **1. Causal Mechanism Specificity**        | Must distinguish whether the base *creates*, *selects* (filters existing variants), or *shapes* (modifies content/use) a superstructural element. E.g., Did capitalism *invent* joint-stock companies or *select* them from pre-existing partnership forms? | Non-negotiable      |
  | **2. Base Granularity Fixation**           | Defines the acceptable level of economic description *a priori* (e.g., "capitalism" vs. "finance-led capitalism with offshore hubs"). Must specify burden of proof when mismatch prompts base re-description. Prevents unfalsifiability. | Non-negotiable     |
  | **3. Diffusion/Revival Handling**          | Explains elements *inherited* from prior modes (Roman law in feudalism) or *diffused* across societies (Buddhism adapting to new economies). Distinguishes *inert residue* (unused feudal titles) from *reactivated residue* (feudal honor codes in modern militaries). | Non-negotiable     |
  | **4. Base-Juridical Boundary Clarity**     | Resolves whether "relations of production" *include* legal forms (property, contract). If yes, explain how base "explains" law without circularity. If no, define the purely *economic* essence of the base (e.g., material forces/class conflict sans legal form). | Non-negotiable     |
  | **5. Reverse Causation Policy**            | States explicitly whether "wrong-way" causation (e.g., Calvinist doctrine enabling accumulation, state capacity enabling markets) is admissible evidence *against* a specific claim, or must be explained by the theory. | Negotiable          |
  | **6. Content-Uptake-Direction Separation** | Allows different base-relations for a practice's *internal content* (Newtonian physics), *social uptake* (state funding for rocketry), and *direction of use* (ballistics for war vs. space). Essential for science/art. | Preference (Empiricism Camp) |
  | **7. Last-Instance Operationalization**    | Defines "determination in the last instance" *testably*: What evidence would show the base *failed* to be ultimately decisive for a specific element? E.g., a legal change persists despite harming dominant accumulation. | Preference (Orthodox Camp) |

  **Conflicting Requirements:**
  *   **Requirement 2 (Base Granularity Fixation)** and **Requirement 3 (Diffusion/Revival Handling)** conflict as suspected. Fixing granularity *a priori* (e.g., "industrial capitalism") struggles with elements from prior/diffused sources (e.g., Roman law concepts in corporate finance). Explaining their selection/shaping *by* the base often requires *ad hoc* granular shifts ("finance-capital needs Roman-law-derived abstractions"), undermining falsifiability. Satisfying both requires strict rules for when base-redescription is permitted post-hoc.
  *   **Requirement 7 (Last-Instance Operationalization)** conflicts with the **non-predictive purpose**. Testing "last instance" inherently demands predictive implications (what *would* happen if base/superstructure conflict?) or long-run counterfactuals, contra the brief.

  **Most Excluding Requirement:**
  **Requirement 4 (Base-Juridical Boundary Clarity)** excludes the most candidates:
  1.  **"Straight reductionism"** often implicitly includes juridical forms in the base, making "explanation" tautological.
  2.  **Functional explanations** frequently define functions (e.g., "stabilizing class rule") in juridical/political terms.
  3.  **Relative autonomy theories** struggle to define a purely *economic* base distinct from the juridical/political structures granted autonomy.
  4.  **"No essence" views** reject the base/superstructure distinction entirely.
     Most theories either fail to rigorously separate the economic from the juridical *or* define the base so narrowly it becomes explanatorily weak.

  **Familiar Positions Scorecard (Brief):**
  *   **Straight Reductionism:** Fails R1 (no mechanism distinction), R3 (ignores diffusion), R4 (often circular), R6 (no separation).
  *   **Functional Explanation:** Fails R1 (confuses function with origin/shaping), R2/R3 (base often redescribed post-hoc to fit function), R4 (functions juridical), R7 (untestable teleology).
  *   **Relative Autonomy/Reciprocal Causation:** Struggles with R4 (boundary blurry), R7 (last instance vague/undermined), R2 (granularity fluid). May satisfy R1, R3, R5, R6.
  *   **No Economic Essence:** Rejects R4 (denies base/superstructure), thus failing core premise. Ignores R7.
