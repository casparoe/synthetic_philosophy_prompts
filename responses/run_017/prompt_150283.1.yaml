       4. Cultural embedding: Real conventions are often embedded in a rich cultural context that gives them meaning beyond coordination.

       5. Language and explicit agreement: Conventions in the real world are often supported by explicit communication and teaching, which we prohibited.

     We'll be ready to explain these in the debrief.

