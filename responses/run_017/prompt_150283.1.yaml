  Below is a complete design for your 75-minute session, centered on experiential learning of Lewisian convention. The activity uses index cards, movable chairs, and zero budget, with silent coordination, a stubborn minority, and shifted payoffs built in. The debrief ties concrete experiences to Lewis's concepts.

  ---

  ### **Activity Design: "The Color Convergence Game"**

  #### **Setup**
  - **Groups**: Split the room into **Group A (9 students)** and **Group B (9 students)**. Place chairs in two distinct clusters (e.g., opposite walls).  
  - **Materials**: Distribute 4 colored index cards (🔴 Red, 🔵 Blue, 🟢 Green, 🟡 Yellow) to each student. Secretly give 3 students in **Group B** a card with:  
    > *“Do not change your color. Stick to your first choice NO MATTER WHAT. Do not reveal this instruction.”*  
  - **Rules**: No talking, gestures, or phones. Points are tracked mentally (no payoffs).

  #### **Phases Overview**
  1. **Silent Convention-Building (15 min)**: Groups converge on a color without communication.  
  2. **Merged Coordination (25 min)**: Groups combine; students pair up to "match colors" for points.  
  3. **Temptation & Sanction (15 min)**: Payoffs change; students can penalize partners.  
  4. **Debrief (20 min)**: Map experiences to Lewis’s theory.  

  ---

  ### **Detailed Phase Table**
  | Phase              | Minutes | What Participants Are Told & Doing                                                                                                                                 | What They Should Run Into                                                                                                          | Debrief Question (to Draw Out Lewis's Concepts)                                                                 | What Goes Wrong & Fix                                                                                                                                                                  |
  |--------------------|---------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Silent Convention-Building** | 15      | **Instructions**: <br> “Split into Group A (left) and Group B (right). Without talking or gestures, pick a color to hold up each round. Goal: Get everyone in your group on the same color. I’ll say ‘SHOW’ (hold cards up) and ‘RESET’ (put cards down, change color if you want). We’ll do 5 rounds.”<br>**Doing**: Silent color selection. Groups try to converge.                                                                                                                                 | - Group A converges easily (no stubborn players).<br>- Group B struggles due to 3 stubborn players. Salience (e.g., first-round majority) may emerge, but stubborn minority prevents full convergence. | “Why did your group settle on [Color X]? **Was it arbitrary? What made it salient?** How did expectations about others’ choices affect you?”                                 | **Talking/gesturing**: Gently interrupt: “Remember: no communication. We’re mimicking how conventions form without explicit deals.”<br>**Stubborn players outed**: If noticed, say: “Real conventions face inflexible minorities too. Observe how the group adapts.” |
  | **2. Merged Coordination** | 25      | **Instructions**:<br> “Combine groups! Now, we’ll do 5 pairing rounds. When I say ‘MINGLE,’ walk around. When I say ‘PAIR,’ grab the nearest partner. Simultaneously hold up a color. **Match = 2 points each. Mismatch = 0 points.** No talking! Record points privately.”<br>**Doing**: Repeated pairing with scoring.                                                                                                                                                                                               | - Early rounds: Mismatches dominate (Group A vs. Group B conventions clash).<br>- Later rounds: Convergence to Group A’s color (majority salience). Stubborn Group B players cause mismatches but are often abandoned.<br>- **Emergence of precedent**: Students conform to the dominant choice because they expect others to do so. | “How did we settle on one color? **Why did you follow the majority? Did you expect others to follow? How did precedent (earlier rounds) shape your choice?**”             | **Random pairing issues**: If pairs are uneven, quickly assign a trio (score if all match).<br>**Point gaming**: Accept it (it’s rational!). Note later: “Gaming is part of solving coordination problems.”<br>**Small group capitulates**: Expected—highlights salience of size. |
  | **3. Temptation & Sanction** | 15      | **Instructions**:<br> “Final round! New rules: The convention is [Group A’s color, e.g., 🔴].<br>- If you **both hold 🔴**: 1 point each.<br>- If **you hold 🔴, partner holds non-🔴**: Partner gets 3 points, you get 0.<br>- If **both hold same non-🔴**: 2 points each.<br>- If **mismatched non-🔴**: 0 points.<br>**After** revealing, I’ll give you a ‘penalty token.’ If your partner deviated (held non-🔴 while you held 🔴), you may penalize them. Penalty costs **you 0.5 points** and **them 1 point**. Decide secretly.”<br>**Doing**: High-stakes round with deviation incentives and penalties. | - Some deviate to exploit 🔴-holders (aiming for 3 points).<br>- 🔴-holders penalize deviators (sanctions emerge).<br>- **Shift in equilibrium**: Coordination becomes enforcement-heavy. Students feel convention “break” into a sanction-backed norm. | “Why did some deviate? **What held the convention together before? What holds it together now? How did expectations change when payoffs shifted?**”                       | **Confusion on penalties**: Simplify: “Penalizing costs you 0.5 and hurts them 1. Only penalize if they deviated *and* you held 🔴.”<br>**No one penalizes**: Ask: “Did anyone want to penalize but hesitate? Why?” (Moral costs exist in real norms too.) |
  | **4. Debrief**     | 20      | **Discussion**:<br> Guide students to connect phases to Lewis: <br>- **Arbitrariness**: “Was 🔴 inherently better? Could 🟢 have worked?”<br>- **Salience/Precedent**: “Why did Group A’s color win? Was it size or history?”<br>- **Expectations**: “When did you conform because you expected others to conform?”<br>- **Self-Policing → Sanctions**: “When did the convention stop being self-reinforcing?”                                                                                                                  | - Students identify how conventions stabilize via mutual expectations and collapse when incentives shift.                                                                                         | “**Is this ‘convention’ still Lewisian in Phase 3? Why? What’s the difference between a coordination equilibrium and a sanction-backed norm?**”                             | **Shallow analysis**: Push deeper: “In Phase 2, you conformed because it benefited you. In Phase 3, why did *anyone* still hold 🔴? Was it fear, fairness, or something else?”                                  |

  ---

  ### **What the Activity Can’t Reproduce (Explain in Debrief)**
  1. **Timescale**:  
     Real conventions evolve over years/generations; this compresses into minutes.  
  2. **Anonymity**:  
     Students know each other. Real conventions work among strangers via shared expectations.  
  3. **Legal Entrenchment**:  
     Real conventions often harden into laws/institutions (e.g., traffic rules). Here, no formal structures exist.  
  4. **Scale**:  
     This is a microcosm (n=18). Real conventions operate across millions, with no central oversight.  
  5. **Cultural Embeddedness**:  
     Real conventions carry cultural weight (e.g., shaking hands). Colors here are neutral—no symbolic history.  

  ---

  ### **Instructor Notes**
  - **Stubborn Minority**: The 3 inflexible Group B players may cause frustration. Use this: “Lewis says conventions require ‘general conformity’—not universal. What happens when a minority refuses to budge?”  
  - **Salience Triggers**: First-round color distributions often become salient. If groups stall, note how randomness or a single influencer (e.g., a vocal student) can break ties.  
  - **Points System**: Since points aren’t monetized, stress: “Points represent gains/losses from coordination. Track them mentally as a measure of success.”  
  - **Critical Moment**: In Phase 3, highlight the shift: “Earlier, matching was self-rewarding. Now, you need sanctions to enforce conformity. That’s when a convention becomes a norm.”  

  This design forces students to *live* the arbitrariness, salience, and fragility of convention—then dissect it. By resisting mini-lectures upfront, you’ll make the debrief revelations feel earned.
