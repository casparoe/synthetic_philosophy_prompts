answer: |-
  ### Hinge Claim Diagnostic Procedure  
  **Purpose:** Classify deadlocked claims into (1) empirical, (2) framework clash, or (3) insulated hinge.  
  **Time:** 20 minutes per claim. **Format:** Written answers to sequential tests. **Audit:** Submit answers with board note.  

  ---

  ### Step-by-Step Procedure  
  **Instructions:** Answer each question in order. Stop and classify when a test gives a clear verdict. Use plain language—no philosophy jargon.  

  #### **Step 1: Identify the Claim**  
  - **Question:** "What is the **exact claim** causing the deadlock? Write it in one sentence."  
  - **Purpose:** Isolate the disputed proposition.  
  - **Sufficient Answer:** Unambiguous statement (e.g., "Only RCTs prove causality," "This catastrophic risk has no quantifiable probability").  
  - **Next:** Proceed to Step 2.  

  #### **Step 2: Empirical Testability Test**  
  - **Question:** "Could this claim be settled by **new data** within 6 months? Describe a feasible study/observation and what result would confirm/refute it."  
  - **Purpose:** Check if evidence could resolve it.  
  - **Verdict & Action:**  
    - **If YES + both parties would accept the outcome:** → **Category 1 (Empirical)**.  
      - **Action:** "Send back for evidence plan: specify metric, timeline, and decision threshold."  
      - **Stop here.**  
    - **If NO or parties reject the test:** → Proceed to Step 3.  
  - **Example Sufficient Answer:**  
    - ✅ *Yes: "Run an RCT on Intervention X; >20% improvement confirms effectiveness."*  
    - ❌ *No: "No study can prove a negative about unreplicable field observations."*  

  #### **Step 3: Framework Clash Test**  
  - **Question:** "Is the dispute about **what counts as valid evidence** or **core priorities** (e.g., rigor vs. speed, equity vs. scale)? Would perfect evidence on this claim end the broader disagreement?"  
  - **Purpose:** Detect irreconcilable standards or values.  
  - **Verdict & Action:**  
    - **If YES (dispute is about standards/values):** → **Category 2 (Framework Clash)**.  
      - **Action:** "Escalate to board: flag as values/scope conflict needing strategic guidance."  
      - **Stop here.**  
    - **If NO:** → Proceed to Step 4.  
  - **Example Sufficient Answer:**  
    - ✅ *Yes: "Even if this intervention works, they’d still debate whether mechanisms (not RCTs) justify funding."*  

  #### **Step 4: Hinge Insulation Test**  
  - **Question:** "Is this claim treated as **non-negotiable**? If ‘nothing’ would change their mind, is it because:  
    - (A) The claim is **foundational** to their work (doubt would collapse their approach)?  
    - (B) It’s a **refusal to engage** (no justification beyond preference)?"  
  - **Purpose:** Distinguish true hinges (riverbed) from dogmatism.  
  - **Verdict & Action:**  
    - **If (A):** → **Category 2 (Framework Clash)**.  
      - **Action:** "Escalate to board: foundational commitment affecting scope."  
    - **If (B):** → **Category 3 (Insulated Hinge)**.  
      - **Action:** "Push back: demand written justification for why the claim is immune to counterevidence."  
  - **Example Sufficient Answer:**  
    - ✅ *A: "Rejecting RCTs as the gold standard invalidates this analyst’s entire evaluation model."*  
    - ✅ *B: "No rationale given; analyst dismisses critiques without explanation."*  

  ---

  ### Case Applications  
  #### **Case 1: RCT vs. Mechanism + Field Visit**  
  - **Claim:** "Mechanism explanations + field visits are sufficient evidence for funding."  
  - **Step 2:** ❌ No empirical test accepted (RCT advocate rejects mechanisms; mechanism advocate rejects RCTs as impractical).  
  - **Step 3:** ✅ **Framework Clash** (dispute is about evidence standards; perfect proof wouldn’t resolve the RCT vs. mechanism debate).  
  - **Action:** Escalate to board.  

  #### **Case 2: Low-Probability Catastrophic Risk**  
  - **Claim:** "No probability can be assigned to this risk."  
  - **Step 2:** ❌ No feasible test (data is sparse; assigning a number relies on disputed models).  
  - **Step 3:** ✅ **Framework Clash** (dispute is about evidence standards for uncertainty; even with data, the analyst rejects probabilistic reasoning for black swans).  
  - **Action:** Escalate to board.  

  #### **Case 3: Your Impact Measurement Rule**  
  - **Claim:** "Only fund interventions with measurable impact."  
  - **Step 2:** ❌ No test (measurability is a policy rule, not testable).  
  - **Step 3:** ✅ **Framework Clash** (dispute is about priorities: accountability vs. funding unexplorable innovations).  
  - **Step 4:** (A) ✅ **Hinge as Framework Clash** (your rule is foundational to the foundation’s credibility; abandoning it would require overhauling its mission).  
  - **Action:** Escalate to board. *The procedure treats your rule less kindly—it’s a value-driven framework choice, not an empirical fact.*  

  ---

  ### Limitations and Risks  
  1. **Misfires:**  
     - **False Framework Clashes:** May over-escalate when creative compromises exist (e.g., blending RCTs with qualitative data).  
     - **Misclassified Hinges:** Risk mistaking deep expertise ("I’ve seen 100 field visits; this pattern is real") for dogmatism.  

  2. **Suspicious Verdicts:**  
     - **Category 3 (Insulated Hinge):** Most vulnerable to bias. Analysts may rationalize hinges as "foundational" to avoid scrutiny.  
     - **Category 2 (Framework Clash):** Board escalation could be premature if the dispute is resolvable through mediation.  

  3. **Procedural Risks:**  
     - **Stifling Debate:** Teams may use "framework clash" as an exit ramp to avoid hard empirical work.  
     - **Oversimplification:** Forces complex disagreements into three bins; nuances (e.g., partial hinges) get lost.  
     - **Audit Gaps:** Written answers may hide group dynamics (e.g., power imbalances silencing dissent).  

  4. **Unfixable Gaps:**  
     - **No Tool for Commitment Shifts:** Cannot resolve true hinges (e.g., "Science = RCTs")—only the board or a crisis can change these.  
     - **Temporal Blindness:** Fails if a hinge is shifting (e.g., field visits gain legitimacy after years of RCT failures).  

  **Recommendation:** Use this to **triage** disputes, not resolve them. Pair with:  
  - **For Category 1:** Evidence sprints (1-week rapid tests).  
  - **For Categories 2–3:** Facilitated "commitment mapping" workshops before board escalation.  
  - **Audit Check:** Randomly sample 20% of verdicts for peer review.  

  ---  
  **Final Note:** This systematizes Wittgenstein’s insight—but hinges only move when the river floods. Your role is to spot when the water is rising.
