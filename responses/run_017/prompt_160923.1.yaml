prompt: |-
  I'm in a small seminar this term on the ethics of organ transplantation — I'm the only philosophy major in it, the rest are mostly medical students plus a transplant surgeon who sits in — and we have spent the last three weeks on the dead donor rule, the constraint that organ retrieval must not itself cause the donor's death and must not begin before it. I'm writing the final paper, and before I commit myself to an account I've been trying to get my own responses to cases in order, because in discussion I noticed that my gut reactions don't line up neatly with any of the criteria we were handed. Going through them: a patient whose entire brain, brainstem included, has been destroyed, who is being oxygenated by a ventilator, whose heart is still beating and whose pituitary still responds to signals, is dead, and that one feels clear to me; a patient in a persistent vegetative state, cortex largely gone but brainstem intact, breathing spontaneously, with sleep-wake cycles and no evidence of awareness, is not dead, and I resist hard the suggestion that she is, even though I also want to say that something has gone out of her that matters more than breathing does; someone with a high cervical cord lesion, fully awake and dependent on a ventilator, is trivially alive; a donor declared dead after the customary short wait following asystole, with no resuscitation attempted, is dead, and I accept that declaration even though someone could in principle have restarted that heart if they had tried. But then: a patient undergoing deliberate circulatory arrest under deep hypothermia for aortic arch surgery, with no heartbeat, no circulation, and no brain activity for something like half an hour, who is then rewarmed, recovers fully and walks out of hospital weeks later — I don't want to say that person was dead and then alive again. That pair is the one that unsettles me most, because whatever makes me willing to call the donor dead, it isn't merely the absence of circulation or of brain activity. I should also flag three verdicts that feel right but that I can't defend: a woman declared brain-dead in the second trimester and maintained on somatic support with hormonal supplementation for months so the fetus could reach viability is dead throughout, and yet her body was doing something no corpse does, which is exactly what makes me suspicious of talk about the organism as a whole; a protocol in which, after death has been declared on circulatory grounds, perfusion is restarted to the abdominal organs while the vessels to the brain are deliberately occluded so that the brain remains unperfused, is one I want to call permissible, and I can't give a clean reason why that isn't just cheating; and two hypotheticals from a paper we read — a person whose neurons are replaced one at a time over a decade with functionally equivalent synthetic units, awake and psychologically continuous throughout, who I say survives and does not die somewhere in the middle, and a person whose brain is scanned and destroyed slice by slice with a functionally identical simulation then running, where I say the original dies even though the end state is the same thing made of different materials.

  The case I keep changing my mind about is a variant I invented to press on that last pair. Suppose the neurons aren't swapped gradually but all at once, during a single period of deliberate circulatory arrest under deep hypothermia: no brain activity of any kind during the procedure, the brain's biological tissue is removed and functionally equivalent synthetic units are installed, circulation is restored, and the person wakes up psychologically continuous with the one who went under, same memories, same projects, same character. Is that a death with a numerically distinct successor, or a survival with a change of substrate? My answer flips depending on which description I use, which makes me think I've been relying on something I haven't stated. So here is what I'd like from you: the two or three accounts of death that best fit the verdicts above — I take the candidates to be something like a whole-brain criterion, a brainstem criterion, a higher-brain or consciousness-based criterion, a circulatory criterion, and a criterion in terms of the organism's ceasing to function as an integrated whole — stated precisely enough that I can see what each predicts; which of my verdicts each one forces me to abandon; what each says about the hypothermic replacement case; and the further case that would separate the ones that survive. I'm also genuinely open to being told that no single principle fits, because I am tracking several different things at once — the organism, the person, the irreversibility of a loss as opposed to its mere permanence — and that the dead donor rule therefore has to be justified separately for each of them; if that's where you land, say clearly what it commits me to.

  Two constraints, because I know how these discussions usually go. I have the reading list and the statutory definitions in front of me, so please don't spend words on citations, bibliographies, or on what any particular commission, act, or landmark case held — assume I can look all of that up and that I'm not asking for it. What I need is the argumentative structure: a principle I could state in a single sentence, the case that motivates each clause of it, its verdict on the hypothermic replacement case and on one further case you choose, and an honest note about where the principle gives out or where the clause does the real work is one I'd rather not defend. Assume my seminar leader will press hardest on whichever clause I most want to fudge, and assume the surgeon will ask at the end whether any of it should change practice, so please say where the view you recommend leaves practice alone and where it wouldn't.
reasoning: |-
  Okay, the user is in a seminar on the ethics of organ transplantation, focusing on the dead donor rule. They're the only philosophy major, with medical students and a surgeon. Their final paper needs a coherent account of death that fits their intuitive responses to various cases. They provided several scenarios where their gut reactions don't align neatly with standard criteria like whole-brain, brainstem, circulatory, or higher-brain criteria. 

  The user's main challenge is reconciling their intuitions, especially with the hypothermic neuron replacement case where their judgment flips based on framing. They want a principle that explains all their verdicts without inconsistency. Their deeper need might be a defensible philosophical framework that also satisfies medical practicality, especially since a transplant surgeon is involved. They hint at possibly tracking multiple concepts (organism, person, irreversibility vs. permanence), so a monistic account might not work. 

  Looking at their verdicts: they accept whole-brain death for the brain-destroyed patient but reject it for PVS. They reject circulatory death for the hypothermia surgery case but accept it for DCD donors. They're uneasy about somatic support for brain-dead pregnant women and permit brain-occlusion protocols despite seeming "cheating." In gradual neuron replacement, they see survival; in destructive upload, death. The synthetic swap case stumps them. 

  Three approaches come to mind: 

  1. **Irreversible Loss of Fundamental Workings (Organism-Centered):** Death as irreversible cessation of the organism's fundamental self-maintenance. This fits their acceptance of brain death (irreversible loss of integrated function) and rejection of PVS as death (brainstem maintains basic homeostasis). It explains why the hypothermic surgery patient isn't dead (cessation is reversible) and DCD donors are (irreversible after no-resuscitation declaration). But it struggles with the pregnant brain-dead woman—her body gestates a fetus, suggesting residual integrated function. They'd need to argue gestation isn't *her* organismic function but the fetus's, or that artificial support masks irreversible loss. 

  2. **Irreversible Loss of Capacity for Consciousness (Personhood-Leaning):** Death as irreversible loss of consciousness capacity. This neatly handles PVS (brainstem intact → capacity remains) and higher cord injury (conscious). It validates their view that the brain-dead pregnant woman is dead (no consciousness possible) and the destructive upload dies (consciousness interrupted). For hypothermic neuron swap, if consciousness resumes continuously, survival. But it clashes with circulatory DCD—if consciousness could theoretically be restored, why is it death? They'd need "irreversible" tied to clinical context, not metaphysical possibility. Also, the surgeon might protest: this could exclude some current DCD practices. 

  3. **Disintegration View (Organism-Person Hybrid):** Death as irreversible disintegration of the biological basis for psychological continuity. This bridges organismic and personal identity. It explains gradual neuron replacement (continuity preserved) vs. destructive upload (discontinuity). For the synthetic swap: if discontinuity during arrest, death; if continuity via "same program" running post-swap, survival. But "disintegration" is vague. And it might not cleanly fit circulatory death—circulatory arrest alone doesn't disintegrate psychological capacity if reversed quickly. 

  The user's flip-flopping on synthetic swap suggests they're torn between biological persistence and psychological continuity. A dual-track approach might be honest: death of the *human organism* (irreversible loss of integrated function) vs. death of the *person* (irreversible loss of consciousness). The dead donor rule could then require both for organ retrieval, but this gets messy. 

  For the surgeon's practicality concern: Option 1 leaves current brain death and DCD practices intact but might question somatic support in pregnancy. Option 2 challenges DCD if "irreversible" is strict. Option 3 is likely too abstract for clinical use. 

  Recommend starting with Option 1 (organismic) as it fits most verdicts and is medically operational, then address discrepancies contextually. For the pregnant woman: her organism is dead because integration is artificially propped; gestation is passive, not self-sustaining. For synthetic swap: no death because the procedure replicates biological continuity. Stress that "irreversible" means *in that context given intent* (e.g., no resuscitation planned in DCD). The surgeon might accept this if it doesn't upend protocols. 

  Final note: Admit the hypothermic case exposes that "cessation" isn't sufficient; reversibility matters. The deeper principle might be *non-restorable* loss of function, with "restorable" defined clinically, not theoretically.
answer: |-
  Here are two precisely stated accounts of death that best fit your intuitive verdicts, along with their implications for your cases, their handling of the hypothermic neuron replacement scenario, a separating case for each, and notes on practicality. A third hybrid option addresses your openness to pluralism. I've focused on argumentative structure, as requested.

  ### **Account 1: Irreversible Loss of Fundamental Workings**  
  *"Death is the irreversible cessation of the organism's fundamental capacity to maintain itself as a unified, self-sustaining whole."*  

  - **Motivating Clauses**:  
    - *"Fundamental capacity"*: Rules out partial losses (e.g., PVS retains brainstem-driven homeostasis; high cord lesion retains CNS integration).  
    - *"Unified, self-sustaining whole"*: Focuses on organism-level integration (brain death destroys this; circulatory arrest alone does not if reversible).  
    - *"Irreversible"*: Clinically contextual (e.g., DCD donor: no intent to resuscitate → irreversible; hypothermic surgery: reversal planned → not irreversible).  

  - **Verdicts Forced to Abandon**:  
    - The pregnant brain-dead woman: Her body gestates a fetus → appears "self-sustaining." You must argue gestation is parasitic (fetus-driven), not her organism's self-maintenance.  
    - Brain-occlusion perfusion protocol: If organs are perfused, the body temporarily "functions" → forces you to reject it or redefine "unified whole" to exclude artificially segmented systems.  

  - **Hypothermic Neuron Replacement**: **Not dead**. The procedure is planned and reversible; self-maintenance capacity is intentionally suspended, not irreversibly lost. The organism persists through substrate change.  

  - **Separating Case**: *A patient with total artificial heart/bioengineered organs, fully conscious but dependent on external power.*  
    - Prediction: Alive (retains fundamental self-maintenance via artificial means).  
    - Challenge: If "self-sustaining" requires biological independence, this fails. Forces a clause: "Capacity persists if replaceable components sustain integration."  

  - **Practical Impact**:  
    - Upholds current brain death and DCD criteria.  
    - Rejects "higher-brain" criteria (PVS not dead).  
    - Surgeon takeaway: No change to practice if gestation/occlusion cases are edge exceptions.  

  ---

  ### **Account 2: Irreversible Loss of Capacity for Consciousness**  
  *"Death is the irreversible loss of the biological capacity for consciousness or subjective experience."*  

  - **Motivating Clauses**:  
    - *"Capacity for consciousness"*: Explains why PVS isn't death (brainstem preserves potential), but brain death is.  
    - *"Biological"*: Rejects computational continuity (e.g., destructive upload dies; gradual replacement survives).  
    - *"Irreversible"*: Contextual (DCD: no revival attempt → irreversible; hypothermia: reversibility planned → not death).  

  - **Verdicts Forced to Abandon**:  
    - Circulatory DCD donor: If capacity could theoretically be restored, you must accept irreversibility is clinical, not metaphysical.  
    - Synthetic swap case: If consciousness is interrupted, you must call it death—even if psychological continuity exists post-procedure.  

  - **Hypothermic Neuron Replacement**: **Dead** (if consciousness is disrupted). The loss of biological consciousness during arrest is irreversible *for that organism*; the synthetic entity is a successor.  
    - *Alternatively*: **Alive** if "capacity" includes restorable artificial substrates. But this may not fit your destructive upload verdict.  

  - **Separating Case**: *An anencephalic infant (no cortex, brainstem intact).*  
    - Prediction: Not dead (brainstem supports respiration/reflexes).  
    - Challenge: If capacity for consciousness is biologically impossible, is this equivalent to brain death? Forces a "brainstem as necessary for consciousness" clause.  

  - **Practical Impact**:  
    - Challenges circulatory DCD if consciousness could be restored (requires stricter irreversibility standards).  
    - Permits somatic support for pregnancy (no consciousness possible).  
    - Surgeon takeaway: Questions DCD protocols; may expand donor pool (e.g., anencephalic infants).  

  ---

  ### **Account 3: Pluralist Justification (Where You Might Land)**  
  *The dead donor rule applies to two distinct concepts: (1) Death of the human organism (cessation of integrated biological function), and (2) Death of the person (irreversible loss of consciousness). Organs may be retrieved only when both criteria are satisfied.*  

  - **Structure**:  
    - **Organism death**: Irreversible loss of somatic integration (fits brain death, DCD, rejects hypothermic surgery).  
    - **Person death**: Irreversible loss of consciousness (fits PVS ≠ death, destructive upload = death).  
    - **Overlap**: Both must hold for donation (e.g., brain death satisfies both; circulatory death satisfies both only if consciousness cannot be restored).  

  - **Resolves Your Troublesome Cases**:  
    - Pregnant brain-dead woman: Organism dead (no integration), but fetus sustains *some* functions. Person dead (no consciousness). Retrieval permissible if rule requires both.  
    - Brain-occlusion protocol: Organism dead (no whole-body integration); person dead (no consciousness). Permissible.  
    - Synthetic swap: *Organism* dies if biological integration ceases irreversibly; *person* dies if consciousness is discontinuous. Forces a choice: If psychological continuity is preserved, person survives, but organism may not.  

  - **Hypothermic Neuron Replacement**:  
    - *Option A*: Organism dies (biological function ceases); person survives (psychological continuity). → Retrieval impermissible (organism not dead).  
    - *Option B*: If synthetic units restore biological function, organism persists. → Permissible only if person survives.  

  - **Separating Case**: *A human-pig chimera with human consciousness but porcine physiology.*  
    - Tests boundaries: Is the "organism" human? Is consciousness sufficient for personhood?  

  - **Practical Impact**:  
    - Justifies current practices if brain death/DCD satisfy both criteria.  
    - Forbids organ retrieval from PVS patients (organism alive).  
    - Surgeon takeaway: Clarifies why some cases feel like "cheating" (e.g., occlusion protocol satisfies both definitions technically).  

  ---

  ### **Recommendation**  
  **Adopt Account 1** ("Irreversible Loss of Fundamental Workings") for your paper. It:  
  - Best fits your core intuitions (brain death = yes, PVS/DCD/hypothermia surgery = no).  
  - Minimally disrupts practice (surgeon concern addressed).  
  - Resolves synthetic swap cleanly: **No death** (procedure is temporary suspension; organism persists).  
  - Handles pregnancy case if you argue gestational processes are not *her* self-maintenance but the fetus's.  

  **Where it bites**: You must defend that the brain-occlusion protocol does not restore "unified" function (organs are perfused in isolation) and that the organism in synthetic swap survives via continuity of embodied function, not substrate.  

  **Final note**: Your flipped intuition in the synthetic swap case suggests you're tracking *psychological continuity* separately from biological life. If so, lean into pluralism—but this complicates the dead donor rule by requiring two death conditions.
