              - Is feedforward the best description? It is simpler and fits. But if the predictive coding model also fits (but is more complex) then we pass? Because the gate requires that there is no simpler alternative that fits equally well? The feedforward is the simpler alternative and it fits. So we pass.

          Then we ship the feedforward claim.

     Without ablation, we cannot. So the procedure forces us to get ablation data to settle it.

   This shows the importance of off-distribution tests and ablations.

   Finally, the single gate doing the most work: Gate 2 (Causal Structure Match). If we remove it, then the brick-wall problem returns: we would ship Claim 2 (lookup table) because it passes Gate 1. Also, we might ship claims that are only superficially similar.

   What if Gate 2 is indefensible? Then we might have to drop it and rely on Gate 4 (which requires the model to be the best description). But without Gate 2, we might still ship Claim 2? 

     Without Gate 2:

          Claim 2: 
              Gate 0: pass.
              Gate 1: pass.
              Gate 3: pass (no noise? or perfect).
              Gate 4: 
                  - Is the predictive coding model the best description for a lookup table? No, because a lookup table is best described as a lookup table. So we would fail at Gate 4.

          So we avoid shipping Claim 2. But note: the claim says "implements the same model". The model is predictive coding. A lookup table that matches the input-output behavior of the model is implementing the same function, but not necessarily the same model (if the model is defined by its internal structure). 

          Gate 4 would catch it because the best description of the lookup table is not predictive coding.

     But without Gate 2, we might ship a system that has the right behavior but for the wrong reasons (e.g., a system that by chance gives the same outputs but has no internal structure matching the model). Gate 4 is designed to require that the model is the best description. So that might help.

     However, Gate 4 is a judgment call and might be weaker. Gate 2 is more objective (if we have the data). So we keep Gate 2.

   We also note that Gate 4 is the one that handles the multiple descriptions issue.

   In summary, the procedure is:

     Gate 0 -> Gate 1 -> Gate 2 -> Gate 3 -> Gate 4 -> Gate 5 (if applicable)

     and at any gate: NO or HAND TO HUMAN stops the procedure.

     Only if all gates pass do we ship.
answer: |-
  Here's a decision procedure for evaluating "system S implements computation C" claims, designed for your constraints. Gates are ordered; failure at any gate returns **NO** or **HAND TO HUMAN**. The core challenge is balancing empirical evidence with philosophical robustness while avoiding overclaiming.

  ---

  ### **Decision Procedure: "Does S implement C?"**
  **Key Judgment Calls** (steps masquerading as objective but requiring human discretion) are marked with **⚖️**.

  #### **Gate 1: Behavioral Match (Plausibility)**
  - **Question**: Does S's output statistically match C's expected behavior on *tested* inputs, within noise/drift tolerances?
  - **Sufficient Evidence**: Benchmark logs showing:
    - Agreement metric (e.g., explained variance, accuracy) ≥ 70%.
    - Noise ≤ 10% (relative to output range).
    - Drift documented and corrected (e.g., recalibration logs).
  - **NO If**: Match < 60%, noise > 20%, or uncorrected drift causes > 15% performance drop.
  - **HAND TO HUMAN If**: Match 60–70%, noise 10–20%, or drift impact unquantified.
  - **Why?** Establishes baseline credibility. Minimal probing: Use existing benchmark inputs. If gaps exist, note them but don't block yet.

  #### **Gate 2: Causal Structure Match (Anti-Gerrymandering) ⚖️**
  - **Question**: Is there a *fixed, natural mapping* (defined pre-testing) from S's physical states to C's computational states that respects causal relationships?
  - **Sufficient Evidence**:
    - States: Defined by measurable voltages/currents (e.g., "voltage range X ≡ state Y").
    - Timesteps: Defined by input-propagation delays (e.g., "output stabilizes within 5ms → timestep").
    - Inputs/Outputs: Mapped to physical I/O channels (e.g., "pin A0 ≡ input pixel").
    - Evidence: Weight connectivity matches C's dataflow; ablation studies disrupt expected functions.
  - **NO If**: Mapping is disjunctive (e.g., "state = V1 OR V2"), absurdly fine-grained (e.g., "each electron position ≡ program counter"), or fails ablation tests.
  - **HAND TO HUMAN If**: Mapping is approximate (e.g., "voltage blob ≈ prediction error"), or off-distribution tests are impossible.
  - **Cost**: Rejects claims where S *could* behave like C under *some* mapping, but not a natural one. May block weak-but-marketing-useful claims.
  - **Why?** Solves the brick-wall problem by requiring mappings grounded in S's causal structure, not post-hoc storytelling.

  #### **Gate 3: Robustness to Perturbation**
  - **Question**: Does the match hold under minor hardware variations, noise injections, or untested inputs?
  - **Sufficient Evidence**: Logs showing:
    - Performance degradation ≤ 10% under +10% voltage noise.
    - Similar output for inputs from the same distribution as benchmarks.
  - **NO If**: Performance drops > 25% under noise, or untested inputs cause divergence.
  - **HAND TO HUMAN If**: Limited perturbation data (e.g., only one noise level tested).

  #### **Gate 4: Uniqueness of Description ⚖️**
  - **Question**: Is C the *simplest/most natural* explanation of S's behavior?
  - **Sufficient Evidence**: Ablations or weight analysis favoring C over alternatives (e.g., feedback loops exist for predictive coding but not feedforward).
  - **NO If**: An equally simple alternative exists (e.g., both predictive coding and feedforward fit).
  - **HAND TO HUMAN If**: Ambiguous evidence (e.g., no ablations, similar fit for multiple models).
  - **Why?** Avoids claiming C when S is equally consistent with other computations.

  #### **Gate 5: Semantic Claim Validity (If Applicable) ⚖️**
  - **Question**: For claims about *meaning* (e.g., "voltage represents X"), does the state covary with X *and* play a causal role in S's function?
  - **Sufficient Evidence**: Weight analysis shows state influences downstream computations aligned with C.
  - **NO If**: State correlates with X but is functionally inert (e.g., a dead neuron).
  - **HAND TO HUMAN If**: Role is ambiguous (common for representation claims).
  - **Why?** Handles "stands for" vs. "causes" debates.

  ---

  ### **Key Insights**
  - **Most Important Gate**: **Gate 2 (Causal Structure Match)**. It blocks gerrymandered mappings (e.g., brick walls "implementing" anything). If indefensible, the procedure collapses into behavioral similarity (Gate 1), allowing false positives like Claim 2 below.
  - **Judgment Calls**: Gates 2, 4, and 5 are **⚖️**. They require human discretion on "naturalness," "simplicity," and "meaning."

  ---

  ### **Test Cases**

  #### **Claim 1**: "Loom-3 implements a predictive-coding model of mouse V1."  
  - **Evidence**: 78% explained variance, predictive-coding-inspired architecture, 5% noise, no ablations.  
  - **Procedure**:  
    1. **Gate 1**: 78% > 70% → Pass.  
    2. **Gate 2**: No fixed state/timestep mapping defined; no off-distribution tests → **HAND TO HUMAN** (judgment: is architecture sufficient for "natural" mapping?).  
  - **Result**: **HAND TO HUMAN** (weak causal evidence).

  #### **Claim 2**: "The distilled lookup table implements the same model."  
  - **Evidence**: 40-row table, 100% benchmark match, no noise.  
  - **Procedure**:  
    1. **Gate 1**: 100% → Pass.  
    2. **Gate 2**: No internal states or causal dynamics (it's static) → **NO** (fails natural mapping; it's a behavior clone, not an implementation).  
  - **Result**: **NO** (Gate 2 blocks behaviorism).

  #### **Claim 3**: Predictive coding vs. feedforward descriptions fitting equally.  
  - **Evidence**: Both match logs; no ablations.  
  - **Procedure**:  
    1. **Gate 1**: Pass (both match).  
    2. **Gate 2**: Pass (both might have natural mappings).  
    3. **Gate 4**: Neither is uniquely simplest → **NO** for both claims.  
  - **Result**: **NO** (Gate 4 forces specificity).

  ---

  ### **Unsettlable Claims**
  The procedure **cannot settle**:  
  1. **Representation claims** (e.g., "voltage X *stands for* quantity Y"): Requires semantic interpretation (Gate 5 ⚖️).  
  2. **Formal equivalence without implementation**: E.g., "S *is* a Turing machine" – lacks causal specificity.  
  3. **Unfalsifiable descriptions**: E.g., claims requiring testing physically impossible inputs.  
  4. **Teleological claims**: E.g., "S *intends* to predict" – beyond causal/behavioral evidence.  

  For your recurring issue ("stands for" vs. "causes"):  
  - If voltage covaries with Y *and* weight analysis shows it causally influences downstream components *aligned with C* → **Weak pass** (Gates 2/5 ⚖️).  
  - Else → **NO/HAND TO HUMAN**.  

  ---

  ### **Procedure Summary**
  ```mermaid
  flowchart TB
      A[Start: Claim \\"S implements C\\"] --> B[Gate 1: Behavioral Match]
      B -- Pass --> C[Gate 2: Causal Structure Match ⚖️]
      B -- NO --> Reject
      B -- HAND TO HUMAN --> H[Human]
      C -- Pass --> D[Gate 3: Robustness]
      C -- NO --> Reject
      C -- HAND TO HUMAN --> H
      D -- Pass --> E[Gate 4: Uniqueness ⚖️]
      D -- NO --> Reject
      D -- HAND TO HUMAN --> H
      E -- Pass --> F[Gate 5: Semantics? ⚖️]
      E -- NO --> Reject
      E -- HAND TO HUMAN --> H
      F -- Not Needed --> Ship
      F -- Pass --> Ship
      F -- NO --> Reject
      F -- HAND TO HUMAN --> H
      Ship[SHIP]
      Reject[NO]
      H[HAND TO HUMAN]
  ```

  **To use**:  
  1. Require pre-defined state/timestep mappings (even if approximate).  
  2. Demand minimal robustness/ablation evidence for new claims.  
  3. Flag all ⚖️ gates for human review.  
  This balances rigor with pragmatism under your constraints.
