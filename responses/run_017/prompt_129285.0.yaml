prompt: |-
  I sit on the social-science panel of a national research council, and we have one funded slot left in this round and a genuinely split panel. I have some philosophy training from before I moved into economic history, and because of that the chair has asked me to draft the decision memo, with the understanding that the other four panelists will either sign it or annotate it. The application is from a group calling itself the Coordination and Expectations Lab, and it proposes to settle whether culture can be a cause in economic explanation. I want to be clear about the substantive details, because the memo has to be answerable by the applicants.

  The applicants are explicit that they are not doing another study of inherited values: they say that framing, which is how most people read Weber's Protestant ethic thesis, has never been able to separate the effect of a population's normative commitments from the effect of the institutions those commitments built. Their alternative is to define culture as a population's stock of common-knowledge defaults for solving recurring coordination problems — focal points, in the game-theoretic sense — held in expectations rather than in preferences, genes, or laws. On that definition, a shared expectation is claimed to be a cause in the ordinary difference-making sense (intervene on what people expect others to do, and the outcome changes) while also being nothing but a fact about what people believe about one another; they argue that this dissolves the older contrast between explaining an action by its causes and explaining it by the meanings it has for the agent, rather than picking a side in it. Their design has three arms: a border design exploiting a nineteenth-century administrative redistricting that split a linguistically homogeneous region into two districts with identical formal law and comparable geography; an epidemiological arm comparing descendants of emigrants from each side of that border who now live in the same city; and a lab-in-the-field coordination game run with both migrant and non-migrant samples, plus a measure of whether the relevant default survives better when transmitted within households than through schools. The panel's disagreements are sharp. Our statistician says that if institutions are themselves downstream of expectations, then the border design cannot separate culture from institutions at all, and that the game arm has no pre-registered prediction about magnitude. Our historian says that explaining with focal points is equilibrium selection, not the interpretation of meanings, so whatever the project studies it is not culture and the label is doing no work. A third member says the definition is unfalsifiable because any observed regularity can be redescribed after the fact as coordination on some focal point; the applicants' reply is that they will fix the focal point in advance using cooperative bylaws recorded in district archives before the outcome period begins. There is also a budget problem: four years were requested, and the archival arm may fall under the council's humanities budget line rather than ours.

  Please draft the memo for circulation before our meeting on the 14th. It should recommend one concrete course of action — fund as submitted, fund a reduced version, fund conditional on specified changes with a resubmission deadline, or reject — and give reasons the applicants could actually act on rather than merely rejections of their framing. Two further requirements. First, our rules say any funded project making a causal claim must rest on a design that could in principle have delivered the opposite answer; include one short paragraph stating whether this project meets that test, and on which arm the answer turns. Second, give the strongest consideration on the losing side its full force: I expect at least two panelists to read this as a decision about whether the project is, in the relevant sense, cultural explanation at all, and I would rather the memo say plainly what we are buying if we fund a study built on expectations rather than on values — including the possibility that a successful result would only relabel the old dispute instead of settling it.
reasoning: |-
  We are drafting a decision memo for the Coordination and Expectations Lab's project proposal. The panel is split, and we must recommend a concrete course of action. The memo must be answerable by the applicants and address the panel's concerns. We also have two specific requirements: one about the causal claim test and one about giving the strongest consideration on the losing side its full force.

  Key issues from the panel:
  1. Statistician: The border design may not separate culture from institutions if institutions are downstream of expectations. The lab-in-the-field arm lacks a pre-registered prediction about magnitude.
  2. Historian: The focal points approach is about equilibrium selection, not the interpretation of meanings, so it's not about culture.
  3. Third member: The definition might be unfalsifiable because any regularity can be described as a focal point. Applicants counter by pre-fixing the focal point using historical archives.
  4. Budget: Four years requested, and the archival arm might fall under humanities, which is a different budget line.

  The project has three arms:
  - Border design: Split region, same law, comparable geography.
  - Epidemiological arm: Emigrants from each side in the same city.
  - Lab-in-the-field: Coordination game with migrants and non-migrants, plus transmission measure.

  We must recommend one of:
  - Fund as submitted
  - Fund a reduced version
  - Fund conditional on specified changes with a resubmission deadline
  - Reject

  Also, we must include a paragraph on whether the design could have delivered the opposite answer (causal claim test) and on which arm the answer turns.

  Finally, we must address the losing side's strongest argument: that the project redefines culture as expectations (focal points) rather than values, and a successful result might just relabel the dispute.

  My recommendation: Fund conditional on specified changes. Why?
  - The project is innovative and addresses a long-standing debate.
  - However, there are valid concerns that need addressing to ensure the study is methodologically sound and that the results will be interpretable.

  Conditional funding would require:
  1. Addressing the border design concern: The applicants must provide a strategy to rule out the possibility that the observed differences are due to institutions that might have evolved differently after the split, even if they started identical. This might involve historical evidence about the timing of institutional changes relative to the emergence of cultural differences.
  2. Pre-registration: For the lab-in-the-field arm, they must pre-register predictions about the direction and magnitude of the effect. This addresses the statistician's concern.
  3. Falsifiability: The use of archival records to pre-specify the focal point is a good step, but they must also pre-specify how they will test for the presence of these focal points in the coordination games and what would count as disconfirmation.
  4. Budget: They must clarify the budget for the archival arm. If it falls under humanities, they need to either seek co-funding or adjust the project to fit within the social science budget.

  Now, the causal claim test: The project meets the test because the design could in principle deliver the opposite answer. This is most evident in the border design arm. If the researchers find no difference in economic outcomes or coordination behaviors across the border (despite the split and the archival evidence of different focal points), that would challenge the claim that culture (as defined) is a causal factor. Similarly, in the epidemiological arm, if descendants from both sides behave similarly in the new city, that would undermine the causal claim. The lab-in-the-field arm, with pre-registered predictions, would also allow for disconfirmation.

  Strongest losing argument: The historian's point that the project redefines culture as expectations (focal points) and thus does not address the traditional concept of culture as shared meanings and values. If we fund this project, we are buying a study that, even if successful, might not settle the older dispute about cultural explanation because it uses a different definition. It could merely shift the debate to whether expectations (as defined) are what we mean by culture, rather than proving that culture (in the traditional sense) is causal.

  Thus, the memo should state that we are funding a study that tests a specific, game-theoretic definition of culture as shared expectations for coordination. A positive result would show that such expectations can be a cause of economic outcomes, but it would not directly address the role of values or meanings in the Weberian sense. It might, however, provide a new framework for integrating causal and interpretive explanations.

  Draft Memo:

  ---

  **MEMORANDUM**

  To: Social-Science Panel, National Research Council  
  From: [Your Name], Panel Member  
  Date: [Current Date]  
  Subject: Recommendation for Funding Proposal by the Coordination and Expectations Lab  
  Meeting Date: 14th [Month]

  **Proposal Title:** Culture as Common-Knowledge Defaults: A Causal Test via Historical Border, Migration, and Experimental Designs

  **Applicants:** Coordination and Expectations Lab

  **Recommended Action:** Fund the project conditional on the applicants making specified revisions and providing additional documentation by [Resubmission Deadline, e.g., 6 weeks from the decision date].

  **Summary of the Proposal:** The applicants propose to test whether culture, defined as a population's stock of common-knowledge defaults (focal points) for solving coordination problems, can be a cause in economic explanation. The design includes three arms: (1) a historical border design exploiting a 19th-century redistricting event that split a linguistically homogeneous region, (2) an epidemiological study of emigrants from each side of the border and their descendants in a common city, and (3) a lab-in-the-field coordination game with pre-registered hypotheses about the transmission of these defaults.

  **Assessment of the Proposal:** The panel recognizes the proposal's ambition and innovation in tackling a foundational question in social science. The approach of defining culture as shared expectations (focal points) offers a potentially rigorous way to test causal claims. However, the panel has raised significant concerns that must be addressed to ensure the study's validity and interpretability.

  **Key Concerns and Required Revisions:**

  1. **Border Design and Institution-Culture Separation:** The applicants must provide a detailed plan to address the concern that institutions may evolve in response to changing expectations, making it difficult to separate culture from institutions. This should include:
     - A historical analysis of institutional changes in both districts after the split, with evidence that any differences in institutions did not precede the cultural differences under study.
     - A robustness analysis that controls for potential institutional confounders.

  2. **Pre-registration of Predictions in the Lab-in-the-Field Arm:** The applicants must pre-register (on a recognized platform) not only the direction but also the expected magnitude of the effect in the coordination games. This will strengthen the statistical inference and address concerns about post-hoc interpretation.

  3. **Falsifiability:** While the use of archival records to pre-specify focal points is a strength, the applicants must pre-specify in their pre-registration:
     - How the presence of these focal points will be measured in the coordination games.
     - Clear criteria for what would constitute disconfirmation of their hypotheses (e.g., effect sizes below a specified threshold, or failure to replicate in the migrant sample).

  4. **Budget and Timeline:** The archival component of the project may fall under the humanities budget line. The applicants must either:
     - Seek co-funding from the humanities panel for this component, or
     - Adjust the scope of the archival work to fit within the social science budget without compromising the core goals.
     Additionally, the panel notes that the four-year timeline is ambitious. The applicants should provide a phased plan, with milestones, to ensure feasibility.

  **Causal Claim Test:** The project meets the council's requirement that a causal claim must rest on a design that could in principle deliver the opposite answer. This is most clearly satisfied in the border design arm: if no differences in economic outcomes or coordination behaviors are found across the border, despite the archival evidence of different focal points, that would challenge the causal claim. Similarly, the epidemiological and experimental arms are designed to allow for null or opposite results (e.g., no persistence in migrant samples, or failure of the focal point to predict behavior in the games).

  **Strongest Consideration on the Losing Side:** The panel acknowledges the concern that the project's redefinition of culture as shared expectations (focal points) may not address the traditional concept of culture as shared values, norms, and meanings. A successful result would demonstrate that expectations can be a causal factor in economic outcomes, but it might not resolve the older debate about whether values or meanings are causal. Instead, it could reframe the debate by showing that at least some aspects of what we call "culture" (i.e., coordination defaults) are causally efficacious in a difference-making sense. The panel funds this project with the understanding that it tests a specific, game-theoretic definition of culture. If successful, it would advance our understanding of how shared expectations function as causes, but it would not directly engage with Weberian or interpretive notions of culture. This limitation should be explicitly discussed in the applicants' work.

  **Conclusion:** The proposed research has the potential to make a significant contribution by providing a test of culture-as-expectations in a causal framework. However, the revisions outlined above are necessary to address methodological weaknesses and ensure the study's findings are robust and interpretable. The applicants are invited to resubmit a revised proposal by [Date] addressing these points. Upon satisfactory revision, the project will be funded.

