  We are drafting a joint statement for an adversarial collaboration between two camps: the Pushers (who believe in symbol-level causation) and the Substratists (who believe that all causation is at the substrate level and symbols are merely patterns we recognize). The statement should include:
  1. A numbered section of agreed-upon claims (without weasel words).
  2. A disagreements table with three cruxes (a, b, c) as described, including:
     - Each side's position in their own words.
     - One case or argument both accept as bearing on the crux.
     - Each side's prediction for that case.
     - Identification of verbal disagreements and where neither side would move.

  Let me break this down step by step.

  ### Step 1: Agreed Claims
  We list claims that both Pushers and Substratists can agree on, without equivocation. Based on the setup:

  - **No physics-violation**: Both agree that the careenium (substrate) operates according to physical laws and that any symbol-level description must not violate these laws.
  - **Multiple realisability**: The same simmball pattern (symbolic pattern) can be implemented in different substrate configurations.
  - **Tractability of simmball-level generalizations**: When predicting the behavior of the system at a macro scale, the only tractable way is to use simmball-level descriptions. Substrate-level descriptions are computationally intractable for such predictions.
  - **Existence of patterns**: Both agree that simmballs (as patterns) exist in the substrate and that they are useful for description and prediction.
  - **Causal closure of physics**: The substrate is causally closed; there are no external influences beyond the physical substrate.

  We must avoid phrases like "in some sense" or "as if". We state these as clear, non-weaselly agreements.

  ### Step 2: Disagreements Table
  We have three cruxes:

  **(a) Grain-matching**: 
  - Issue: Can a simmball cause behavior if the substrate's causal grain is coarser than the simmball's individuation conditions? (i.e., the substrate changes only in chunks that don't align with the boundaries of a simmball.)
  - Pusher view: Even if the substrate grain is coarse, if the simmball pattern is present and the system's behavior is sensitive to it, then the simmball is causing the behavior. The coarse grain might just mean the substrate is implementing the symbol at a higher level of abstraction.
  - Substratist view: If the substrate grain is too coarse to distinguish between the presence and absence of a simmball, then there is no causal power at the simmball level. The simmball is an epiphenomenon.

  **(b) Frozen-substrate intervention**:
  - Issue: Consider a case where the substrate is held fixed (frozen) but the behavior changes because the context (e.g., a string in a context window) changes. Pushers see this as evidence that symbols (the string) cause behavior without substrate change. Substratists argue that the fixed substrate must include the context window, so it's still substrate.
  - Pusher view: This is a clean case of symbol-level causation: the same substrate state (in the processing unit) produces different outputs because the input (symbol string) is different. Thus, the symbols are causing the behavior.
  - Substratist view: The substrate must be considered as a whole, including the context window. If the context window has changed, then the substrate state is different. There is no such thing as a "frozen substrate" without freezing the entire relevant state.

  **(c) Posterior simmballs**:
  - Issue: Symbol units that appear later in substrate time than the behavior they are supposed to cause (e.g., in bidirectional models). Pushers might say the symbol pushes backwards in time along the symbolic causal chain. Substratists say if the substrate state at the time of behavior doesn't include the future symbol, it can't be a cause.
  - Pusher view: Symbolic causation operates in its own time. The later symbol can be part of a global pattern that influences the behavior retroactively in the symbolic timeline (e.g., via constraints in a constraint satisfaction system).
  - Substratist view: Causation only flows forward in substrate time. If the symbol unit is not present in the substrate at or before the behavior, it cannot cause it. Any apparent backward causation is an illusion from the pattern's global structure, which is implemented in the substrate's forward time evolution.

  For each crux, we need:
  - A case/argument both accept as bearing on the crux.
  - Each side's prediction for that case, written as they would state it.

  Also, we must separate verbal disagreements and note where neither side would move.

  ### Step 3: Verbal Disagreements and Immovable Points
  - **Verbal Disagreements**: Some of the disagreement might boil down to definitions. For example, in (a) the definition of "grain" and what counts as a causal unit. In (b) the definition of "substrate" (does it include the context window?). In (c) the definition of "time" (substrate time vs. symbolic time).
  - **Immovable Points**: 
    - Pushers will not give up the idea that symbols are causal in a non-derivative way.
    - Substratists will not give up the idea that every causal difference is a substrate difference.

  ### Drafting the Joint Statement

  #### Part 1: Agreed Claims
  Both parties agree on the following:

  1. **Physical Compliance**: The careenium (the substrate) operates in accordance with the laws of physics, and any description of simmball (symbol) patterns must not violate these laws.
  2. **Multiple Realisability**: The same simmball pattern can be implemented in multiple distinct substrate configurations, and these configurations may differ in their physical details.
  3. **Tractability of Symbol-Level Descriptions**: For the purpose of predicting and explaining the macro-level behavior of the system, simmball-level generalizations are indispensable and the only tractable approach. Substrate-level descriptions are computationally intractable for such predictions due to their fine-grained detail.
  4. **Pattern Existence**: Simmballs are real patterns in the substrate that can be identified and described.
  5. **Causal Closure**: The substrate is causally closed. All changes in the system are fully accounted for by the substrate's physical state and dynamics.

  #### Part 2: Disagreements Table

  We present the key disagreements in the form of a table. Each row addresses one crux, and we include:
  - The crux issue.
  - A case or argument that both sides accept as relevant to the crux.
  - The Pusher position and prediction.
  - The Substratist position and prediction.

  | Crux | Case/Argument | Pusher Position | Substratist Position |
  |------|---------------|----------------|----------------------|
  | **(a) Grain-Matching**<br><br>Issue: Can a simmball cause behavior when the substrate's causal grain is coarser than the simmball's individuation conditions? | Consider a substrate that updates in large blocks (e.g., at a coarse time scale or spatial chunk) such that within a block, the presence or absence of a particular simmball does not cause a substrate state change. However, at the macro scale, the system behavior is predictable only by tracking simmballs. Both agree that in such a system, simmball-level descriptions are necessary for prediction. | **Position:** The simmball causes the behavior even if the substrate grain is coarse. The coarse grain does not negate the causal efficacy of the pattern; it merely reflects the level at which the substrate implements the symbol. The simmball is the relevant unit of control.<br><br>**Prediction:** If we intervene to change the simmball pattern (while respecting the coarse grain of the substrate), the behavior will change in a way predictable only by the simmball change. | **Position:** If the substrate grain is too coarse to register the simmball's presence, then the simmball cannot be a cause. The apparent causal power is an illusion; the real causes are the substrate changes at their own grain. The simmball is a descriptive convenience.<br><br>**Prediction:** Any change in behavior must be due to a change in the substrate at the level of its own grain. If the simmball changes without a substrate change at the coarse grain, behavior won't change. |
  | **(b) Frozen-Substrate Intervention**<br><br>Issue: Can behavior change while the processing substrate is held fixed, solely due to a change in the input context (symbol string)? | Consider a system with a fixed processing core and a variable context window. The core substrate is frozen (no change in its state), but the context window contains a different symbol string. The system's output behavior changes. Both agree that this setup is physically realizable and that the output depends on the context string. | **Position:** This is a clear case of symbol-level causation. The fixed core processes the different input symbols, producing different outputs. The symbols in the context window are the cause of the behavioral difference.<br><br>**Prediction:** Holding the core substrate fixed and changing only the context window will result in different outputs. | **Position:** The entire substrate, including the context window, must be considered. If the context window changes, the substrate state has changed. There is no "frozen substrate" without freezing the entire relevant state. The cause is the total substrate state.<br><br>**Prediction:** If the entire relevant substrate (including the context window) is fixed, behavior won't change. If behavior changes, it must be because some part of the substrate (including the context) changed. |
  | **(c) Posterior Simmballs**<br><br>Issue: Can a simmball that appears later in substrate time cause behavior that occurs earlier in substrate time? | Consider a bidirectional model (e.g., a constraint satisfaction network) where a symbol unit is settled at a later substrate time than an earlier behavior. The behavior appears to be influenced by the later symbol. Both agree that in such systems, the global pattern may require the later symbol to be consistent. | **Position:** Symbolic causation operates in a logical time that may not align with substrate time. The later symbol can push backwards along the symbolic timeline to constrain the behavior.<br><br>**Prediction:** If we intervene to change the later symbol (before it is settled), the earlier behavior will change in a way consistent with the new symbol. | **Position:** Causation only flows forward in substrate time. A simmball not present in the substrate at or before the behavior cannot cause it. The apparent backward influence is an artifact of the global pattern being settled in the substrate's forward time evolution.<br><br>**Prediction:** Changing the later symbol after the behavior has occurred will not affect that behavior. The behavior is caused solely by the substrate state prior to or at the time of the behavior. |

  #### Part 3: Analysis of Disagreements

  Both parties recognize that some aspects of the disagreement may be verbal:

  - **Crux (a)**: The disagreement partly hinges on the definition of "causal grain". Pushers define the grain relative to the functional role of the simmball, while Substratists define it strictly by the minimal units of substrate change. This is not entirely verbal, however, because it relates to whether patterns can have causal powers beyond the substrate's micro-dynamics.

  - **Crux (b)**: The dispute about what constitutes "the substrate" (whether to include the context window) is partially verbal. Pushers consider the processing core as the substrate for the purpose of intervention, while Substratists insist on including the entire physical state. The underlying non-verbal issue is whether symbols can be causes when they are part of the input but not part of the processing core's fixed state.

  - **Crux (c)**: The definition of time (substrate time vs. symbolic time) is a key verbal difference. However, the non-verbal core is whether causation can operate backwards in physical time, which both agree is impossible at the substrate level. The disagreement is whether symbolic descriptions that include backward constraints are causal.

  Despite these clarifications, there are points where neither side will move:

  - **Pushers**: Will not concede that simmballs are merely descriptive and lack causal efficacy. They maintain that symbol-level causation is real and provides explanations that substrate-level descriptions cannot capture.
  - **Substratists**: Will not concede that there is any causation beyond the substrate. They hold that every causal difference must be a substrate difference, and simmballs are multiply realizable patterns that do not add extra causal powers.

  This joint statement reflects the current state of the debate and sets the stage for further empirical and conceptual investigation.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Simmball Causation in Careenium Systems  

  **Introduction**  
  This document represents a joint statement from two research camps—**Pushers** and **Substratists**—investigating the causal status of "simmballs" (symbolic patterns) in a computational substrate ("careenium"). The careenium is an alien physical system that hosts simmballs, which exhibit pattern-level regularities. Pushers argue simmballs have genuine causal power over system behavior (symbol-level causation). Substratists argue all causation is substrate-level; simmballs are descriptive patterns with no additive causal role. Below, we outline points of agreement, key disagreements with testable predictions, and an analysis of verbal vs. substantive disputes.  

  ---

  ### Part 1: Agreed Claims  
  Both camps endorse the following statements without reservation:  

  1. **Physical Law Compliance**: The careenium operates under deterministic physical laws. No simmball-level description violates or supersedes these laws.  
  2. **Multiple Realizability**: Identical simmball patterns can be implemented in distinct substrate configurations. Simmballs are not uniquely tied to a single physical instantiation.  
  3. **Tractability of Simmball-Level Generalizations**: Simmball-level descriptions are the only computationally tractable method for predicting system-wide behavior. Substrate-level descriptions are intractable for practical prediction due to combinatorial explosion.  
  4. **Pattern Reality**: Simmballs are real, observer-independent patterns in the careenium’s state evolution, detectable via invariant features.  
  5. **No Ghost Causation**: All system behavior is fully determined by the careenium’s substrate. There are no external or non-physical influences.  

  ---

  ### Part 2: Disagreements Table  
  Key disagreements are framed as empirical cruxes. Each row specifies:  
  - **The crux issue** in neutral terms.  
  - **A shared case/argument** both sides accept as probative.  
  - **Pusher position/prediction** in their own framing.  
  - **Substratist position/prediction** in their own framing.  
  - **Prediction divergence**: How each camp expects the case to resolve.  

  | Crux | Shared Case/Argument | Pusher Position & Prediction | Substratist Position & Prediction |  
  |------|----------------------|------------------------------|-----------------------------------|  
  | **(a) Grain-Matching**<br><br>*Issue: Can simmballs exert causal influence if the substrate’s causal grain (minimal unit of change) is coarser than a simmball’s individuation conditions?* | **Case**: A careenium where substrate transitions occur in macro-chunks (e.g., updating 10 simmball-equivalent units atomically). Simmballs are individuated at a finer grain (e.g., single-unit changes). System behavior correlates with fine-grained simmball states, but substrate transitions only respond to coarse aggregates. Both agree the coarse grain blinds the substrate to fine simmball differences. | **Position**: "Simmballs push the careenium: fine-grained patterns cause behavior even when substrate grain is coarse. Coarse transitions implement statistical summaries of simmball states, which are still causal."<br><br>**Prediction**: *If fine-grained simmball patterns are altered while holding coarse substrate inputs fixed, behavior will change in ways only predictable by simmball states (e.g., via emergent noise-amplifying dynamics).* | **Position**: "Causal differences require substrate differences: coarse-grained transitions cannot be sensitive to fine-grained simmballs. Simmballs are bookkeeping; behavior is driven solely by aggregate substrate properties."<br><br>**Prediction**: *No behavior change can occur without a change in coarse substrate inputs. Fine-grained simmball variations with identical coarse inputs yield identical behavior.* |  
  | **(b) Frozen-Substrate Intervention**<br><br>*Issue: Does behavior driven by contextual simmballs (e.g., a string in a context window) imply symbol-level causation when the processing substrate is fixed?* | **Case**: A careenium with a fixed processing core (frozen mid-computation) but a mutable context window holding simmball strings. Behavior (e.g., output) changes when the context string is altered, despite identical frozen core states. Both agree this is physically possible (e.g., via external memory access). | **Position**: "Simmballs push autonomously: the context string causes behavior without substrate changes in the core. This is pristine evidence for symbol-level causation."<br><br>**Prediction**: *With the core substrate frozen, altering context-window simmballs will reliably alter behavior. Core state differences are unnecessary.* | **Position**: "Substrate is non-negotiable: the ‘frozen’ core is part of a larger substrate. The context window is substrate, so changing it *is* a substrate change. No symbol-level ‘extra’ causation exists."<br><br>**Prediction**: *Behavior changes only if the total substrate (core + context window) changes. ‘Frozen core’ interventions inadvertently alter total substrate state.* |  
  | **(c) Posterior Simmballs**<br><br>*Issue: Can simmballs that emerge later in substrate time causally influence prior behavior?* | **Case**: A bidirectional careenium (e.g., constraint-satisfaction model) where a simmball unit stabilizes *after* an output behavior is generated, yet the output appears consistent with the later simmball (e.g., retroactive pattern completion). Both agree the final global state exhibits this consistency. | **Position**: "Simmballs push bidirectionally in symbolic time: posterior simmballs exert causal pressure ‘backward’ along the symbolic dependency graph, overriding substrate temporality."<br><br>**Prediction**: *Pre-emptive alteration of a posterior simmball (before substrate stabilization) will change prior behavior, violating forward-time substrate causality.* | **Position**: "Causation is substrate-time-bound: posterior simmballs cannot affect prior substrate states. Apparent backward influence is illusory; behavior is fixed by prior substrate alone."<br><br>**Prediction**: *Altering posterior simmballs after behavior occurs will not affect that behavior. Prior substrate fully determines outputs.* |  

  ---

  ### Part 3: Analysis of Disagreements  
  #### Verbal vs. Substantive Elements  
  - **Crux (a) Grain-Matching**: Primarily verbal. Disagreement reduces to the *definition of "cause"*:  
    - Pushers define causation via counterfactual dependencies in pattern space (e.g., "If simmball X changed, behavior Y would change").  
    - Substratists define causation via minimal physical state-changes (e.g., "Cause requires differential substrate microstates").  
    - *Substantive core*: Whether coarse-grained systems can exhibit fine-grained control without new physics. Agreed test: If behavior changes *without* coarse-input changes, Pushers win; else Substratists win.  
  - **Crux (b) Frozen-Substrate Intervention**: Partly verbal. Disagreement hinges on the *boundary of "substrate"*:  
    - Pushers demarcate "processing substrate" (core) from "symbol storage" (context).  
    - Substratists insist on a monolithic substrate (core + context).  
    - *Substantive core*: Whether context-dependency implies acausal pattern-level forces. Agreed test: If behavior changes while core microstates are fixed, it challenges Substratists.  
  - **Crux (c) Posterior Simmballs**: Minimally verbal. Disagreement centers on *temporal directionality of causation*:  
    - Pushers endorse atemporal symbolic causality; Substratists demand time-asymmetric physical causality.  
    - *Substantive core*: Whether future states can affect past events without time-reversed physics. Agreed test: If pre-emptive symbol edits alter prior behavior, it violates Substratist principles.  

  #### Where Neither Side Will Move  
  - **Pushers** will not abandon the claim that **simmball-level explanations provide unique, irreducible causal insight** (e.g., predicting system behavior without substrate details). They view Substratists as missing functional generalizations.  
  - **Substratists** will not concede that **simmballs add causal power beyond the substrate**. They view Pushers as conflating prediction with causation.  
  - **Both reject compromise positions** (e.g., "weak emergence" or "causation at multiple levels"). Pushers see substrate-independence as essential; Substratists see it as incoherent.  

  ---  
  **Conclusion**  
  This statement clarifies agreed foundations, crystallizes disagreements into testable cruxes, and distinguishes verbal from substantive disputes. Future work will empirically adjudicate these predictions using careenium simulations.  

