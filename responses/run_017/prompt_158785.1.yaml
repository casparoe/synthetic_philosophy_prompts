answer: |-
  That's an astute dissection of the contradictions at the heart of US campaign finance law. You're right—the system relies on a specific, narrow theory of corruption that struggles to reconcile its own inconsistencies. Let's reconstruct the implicit theory, separate core commitments from compatible elements, and explore alternatives.

  ### The Core Theory Actually Committed To: "Quid-Pro-Quo Plus Candidate Control"
  The Supreme Court's jurisprudence (especially *Buckley v. Valeo*, *Citizens United*, and *McCutcheon*) reveals a tightly defined theory:
  1.  **Corruption = Quid Pro Quo or Its Appearance:** The *only* compelling government interest justifying limits on money in politics is preventing *corruption or its appearance*, defined narrowly as **explicit bargains** ("dollars for official acts") or the unavoidable *suspicion* of such bargains.
  2.  **The Coordination Line = The Control Line:** Independent expenditures aren't corrupting because the candidate/campaign **lacks control** over how the money is spent. The spender acts purely on their own ideological/political motivation. Coordination transforms independent spending into a *de facto* contribution because it implies candidate influence/control over the message/spending, creating an implicit debt or expectation.
  3.  **Access/Attention as a Proxy for Bargain Risk:** Unlimited independent spending *does* buy access and attention. The Court acknowledges this (*Citizens United*), but **dismisses access/attention as corruption itself**. Instead, access is only problematic *because* it creates an *opportunity* for quid pro quo corruption or fuels the public's *appearance* of corruption. It's a stepping stone, not the harm itself.
  4.  **Speech Trumps Equality:** Political spending = Political speech (protected by the 1st Amendment). Concerns about "leveling the playing field" or political equality are explicitly **rejected** as justifications for limiting spending (*Buckley*). Wealth amplification of speech is an acceptable consequence of free speech.

  ### What the Practice is Merely Compatible With (But Doesn't Require)
  *   **Disclosure:** While justified partly as informing voters about potential influences (compatible with an appearance-of-corruption rationale), disclosure rules primarily serve the *existing* quid-pro-quo theory by:
      *   Helping *enforce* contribution limits and coordination bans (tracking money flows).
      *   Providing data to investigate potential *quid pro quo* violations.
      *   Informing voters about potential allegiances/influences that *might* signal a bargain risk.
  *   **Foreign National Ban:** This is treated as a **sovereignty/alien status exception**, not purely a corruption issue. The rationale is that foreign entities lack a constitutional right to participate in US self-governance. It's compatible with the quid-pro-quo theory but grounded in a different principle (legitimacy of the political community).
  *   **Unlimited Self-Financing:** Framed as an extension of personal liberty/free speech (*Buckley*). The implicit theory is that a candidate **cannot corrupt themselves**. There's no risk of a bargain between two parties when it's the same person spending their own money.

  ### Reconstructing the Actual Logic
  The system's core commitment is: **Money only corrupts when it passes through the candidate's (or their coordinated agent's) hands, creating an obligation *to that specific donor/spender*.** Independent spending lacks this direct, controllable link. Disclosure monitors the system for breaches of this control line. Foreign bans are a separate sovereignty rule. Self-funding is absolute personal speech.

  ### Swapping in a "Money Damages Political Equality" Theory
  If the core justification shifted to preventing wealth distortion and protecting equal opportunity for political influence:
  1.  **Coordination Distinction Crumbles:** The harm isn't candidate control; it's the sheer volume of money distorting debate and drowning out other voices. **Independent spending would be subject to limits** just like contributions, as both amplify wealthy voices. The "control" line becomes irrelevant to the core harm.
  2.  **Universal Spending Caps:** Caps would apply broadly to all spending supporting/opposing candidates (direct contributions, independent expenditures, PACs, potentially even issue ads close to elections), based on aggregate impact on the political marketplace.
  3.  **Disclosure for Equity:** Disclosure would focus on revealing concentrations of wealth/influence shaping the debate, potentially requiring more granular data on funders behind shell entities, to empower voters assessing systemic bias.
  4.  **Self-Financing Limits:** Significant limits would likely be permissible to prevent wealthy candidates from overwhelming opponents solely with personal resources, seen as undermining fair electoral competition.
  5.  **Foreign Ban Compatibility:** The ban could stand, reframed as preventing external wealth from distorting *internal* political equality, but the core rationale might shift slightly towards protecting domestic democratic integrity from external financial domination.

  ### Does it require believing in an "Exchange Rate"?
  **No.** The current system operates effectively on a **thinner story about access and attention as the pathway to corruption risk:**
  1.  **Core Premise:** Large sums of money (whether contributions or coordinated spending) create an *obligation* felt by the candidate and an *expectation* by the donor/spender.
  2.  **Access = Opportunity:** This obligation/expectation is mediated through **access**. Donors/spenders who give large amounts *get meetings*, *get their calls returned*, and *get their views heard* when others do not.
  3.  **Attention = Influence:** This access creates the **opportunity** for explicit quid pro quo ("Vote for X and I'll give $Y"). More subtly and pervasively, it shapes the candidate's **attention, priorities, and understanding of the "acceptable" policy spectrum**. The donor's perspective becomes constantly salient.
  4.  **The "Thinner Story":** The system accepts that **money buys disproportionate access and attention, which inherently creates a risk of improper influence (conscious or unconscious) and fosters the public's perception that government is "for sale."** Proving a specific "exchange rate" (e.g., $10,000 buys one vote) is unnecessary. The risk inherent in the *system* of wealthy access is sufficient to justify contribution limits and the coordination ban under the quid-pro-quo/appearance theory. The *independent* spender, lacking coordination, isn't buying access *to that specific candidate* in the same direct, obligated way.

  ### Conclusion
  The legal architecture rests on a narrow, fragile theory: corruption is solely about preventing cash-for-votes bargains or their appearance, hinging entirely on whether the candidate *controls* the spending. The coordination line is the lynchpin. Disclosure, foreign bans, and self-funding carve-outs are compatible satellites but not core requirements of this theory. Concerns about access/attention are only relevant as *proxies* for the underlying bargain risk, not as harms in themselves. A theory centered on political equality would fundamentally dismantle this structure, making the source and control of money less relevant than its aggregate volume and distorting impact on the democratic process. The system *does not* require proof of a precise "exchange rate"; it functions on the acknowledgment that concentrated money inevitably buys disproportionate access and attention, which creates an unacceptable environment for quid pro quo corruption and erodes public trust.
