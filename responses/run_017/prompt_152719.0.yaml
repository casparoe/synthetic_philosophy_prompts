prompt: |-
  I spent most of last night arguing with a friend about whether anyone has an account of how correctness itself — the fact that some moves in thought or argument count as right and others as wrong, that some considerations count in favour of a conclusion — got into a world of matter in motion. He thinks every account on offer cheats, and he has a compact vocabulary for saying why, picked up from Daniel Dennett's *Darwin's Dangerous Idea* (1995): 'skyhook', 'crane', and 'greedy reductionism'. As I understood him to be using them: a skyhook is an explainer that is itself unexplained, something that gets its purchase from above and so merely relabels the mystery; a crane is a mechanism that lifts from below, built out of the very materials it has to work with, so that nothing is left dangling; and greedy reductionism is the vice of trying to explain a phenomenon while skipping the cranes — going straight to the bottom and denying or ignoring the pattern that needed explaining in the first place.

  The argument kept stalling on three cases I invented to press him, and on one accusation he kept making.

  (a) *The borrowed crane.* Suppose correctness gets explained by a mechanical process — creatures or networks that update on feedback, retain what predicted well, discard what did not. The trouble is that I can only describe that process by saying it responds to *error*, retains what is *better*, tracks what is *correct*. The friend says: there, you helped yourself to the very thing you were explaining, so that is a skyhook. But it seemed to me that on that standard any crane whose parts have to be picked out by what they do would be disqualified, which would be absurd. Is there a principled line between a mechanism that presupposes the property it explains and one that merely gets described in the vocabulary of that property?

  (b) *The inherited crane.* Suppose a system exhibits correctness only because it was built, trained, or shaped by agents who already had it — a cultural practice, an institution, a model fitted to the output of reasoners. Relative to that system, the normativity arrives from above, unearned; relative to the history of the universe, it was produced by earlier cranes. He insisted skyhook-hood is not relative to a baseline. I could not see how that could be right.

  (c) *The stipulated floor.* Inside a simulation, the lowest-level rules look exactly like skyhooks: unexplained explainers, brute givens. From outside, they are ordinary cranes resting on the hardware. So it looked to me as though whether something is a skyhook depends on where one puts the floor of what needs no further explanation — which would make the slogan 'there are no skyhooks' either nearly trivial or nearly unfalsifiable, depending on where the floor is allowed to sit.

  Finally, whenever I tried to give a subpersonal, mechanism-level account, he accused me of greedy reductionism, and I could never tell whether he meant that my account was false, that it was true but not explanatory, that it skipped a level, or that it changed the subject.

  So: what I want is a disambiguation with verdicts. Please return a single JSON object and nothing else, with this schema.

  {
    "terms": [
      {
        "term": "<one of: 'skyhook', 'crane', 'greedy reductionism'>",
        "readings": [
          {
            "label": "<short name for the reading>",
            "precise_claim": "<one or two sentences, stated so that it could in principle be true or false>",
            "kind": "<one of: verbal stipulation | methodological rule | empirical claim | metaphysical claim | claim about what counts as an explanation>",
            "status": "<one of: trivial | substantive and defensible | contentious | false | incoherent>",
            "supports_my_friends_move": "<'yes' | 'no' | 'only if', followed by one clause saying why>",
            "what_would_have_to_be_shown": "<what someone defending this reading still owes us>"
          }
        ]
      }
    ],
    "cases": [
      {
        "case": "<one of: 'borrowed crane', 'inherited crane', 'stipulated floor'>",
        "skyhook_under": ["<labels of the readings under which it is a skyhook>"],
        "crane_under": ["<labels of the readings under which it is a legitimate crane>"],
        "verdict": "<one sentence, your own view>",
        "decisive_question": "<the one question that would settle it, if there is one; else null>"
      }
    ],
    "indexicality": {
      "is_skyhookhood_relative_to_a_baseline": "<'yes' | 'no' | 'yes for some readings only'>",
      "consequence_for_the_slogan": "<one or two sentences on whether 'there are no skyhooks' then becomes trivial, unfalsifiable, or still substantive>"
    },
    "bottom_line": "<at most 60 words: the single reading of 'skyhook' I should press my friend to commit to, and what it commits him to>"
  }

  Give every term at least three readings, ordered from the weakest to the strongest, and make sure the labels you use in the "cases" block match the labels in the "terms" block. If some reading of 'greedy reductionism' makes it a fault distinct from falsehood, say which one and why.
reasoning: |-
  We are given three terms: 'skyhook', 'crane', and 'greedy reductionism'. We must provide at least three readings for each, ordered from weakest to strongest. Then we address the three cases: 'borrowed crane', 'inherited crane', and 'stipulated floor'. We also address indexicality and provide a bottom line.

  Let's structure the response accordingly.

  First, we define the readings for each term.

  ## Terms

  ### Skyhook

  1. **Reading 1 (weakest): Unexplained Explainer in a Given Context**
     - **Label**: Contextual Skyhook
     - **Precise claim**: In a particular explanatory context, a skyhook is any element that is used to explain a phenomenon but is itself not explained within that context, and its explanatory power depends on accepting it without further accounting.
     - **Kind**: Methodological rule
     - **Status**: Trivial (since it's relative to context)
     - **Supports my friend's move**: Only if the context is fixed and the element is indeed unexplained in that context.
     - **What would have to be shown**: That in the context of the explanation, the element is taken as primitive and not further analyzed.

  2. **Reading 2: Non-Naturalistic Primitive**
     - **Label**: Non-Natural Skyhook
     - **Precise claim**: A skyhook is an explanatory posit that is non-natural (e.g., supernatural, non-physical, or irreducibly normative) and thus cannot be integrated into a naturalistic, scientific worldview.
     - **Kind**: Metaphysical claim
     - **Status**: Contentious (because naturalists would reject non-natural posits, but non-naturalists would accept them)
     - **Supports my friend's move**: Yes, if he is assuming a naturalistic worldview and the account relies on non-natural elements.
     - **What would have to be shown**: That the property (like normativity) being explained cannot be reduced to natural properties and must be accepted as primitive.

  3. **Reading 3 (strongest): Unexplained Explainer that is Inexplicable in Principle**
     - **Label**: Inexplicable Skyhook
     - **Precise claim**: A skyhook is an element that not only is unexplained in a particular account but also cannot, even in principle, be explained by any natural or mechanical process, and thus must be accepted as a brute fact.
     - **Kind**: Metaphysical claim
     - **Status**: Contentious (because it makes a strong claim about what is inexplicable)
     - **Supports my friend's move**: Yes, if he believes that normativity is inexplicable by natural processes.
     - **What would have to be shown**: That the property in question is indeed inexplicable by any crane, i.e., that there is no possible naturalistic explanation.

  ### Crane

  1. **Reading 1 (weakest): Any Step-by-Step Mechanism**
     - **Label**: Stepwise Mechanism
     - **Precise claim**: A crane is any process that builds up complexity through a series of steps, each of which is explicable in terms of the available materials and prior steps, without invoking unexplained high-level properties.
     - **Kind**: Methodological rule
     - **Status**: Substantive and defensible (as a general approach to explanation)
     - **Supports my friend's move**: No, because it allows for mechanisms that might be described using high-level vocabulary as long as they are built from below.
     - **What would have to be shown**: That the process can be fully specified without circularity and without leaving any step unexplained.

  2. **Reading 2: Non-Circular Naturalistic Mechanism**
     - **Label**: Non-Circular Natural Mechanism
     - **Precise claim**: A crane is a naturalistic mechanism that explains a higher-level property without presupposing that very property in its operation, thus avoiding circularity.
     - **Kind**: Methodological rule and claim about what counts as an explanation
     - **Status**: Substantive and defensible
     - **Supports my friend's move**: Only if the mechanism does presuppose the property, then it would not be a crane by this reading.
     - **What would have to be shown**: That the mechanism does not rely on the property it is supposed to explain, either in its description or in its operation.

  3. **Reading 3 (strongest): Complete Reduction**
     - **Label**: Reduction to Fundamental Physics
     - **Precise claim**: A crane is a mechanism that ultimately reduces the phenomenon to the fundamental laws of physics, leaving no explanatory gaps at any level.
     - **Kind**: Metaphysical claim
     - **Status**: Contentious (because of multiple realizability and emergent properties)
     - **Supports my friend's move**: No, but it sets a high bar for what counts as a crane.
     - **What would have to be shown**: That the phenomenon can be fully explained by the behavior of fundamental particles and forces.

  ### Greedy Reductionism

  1. **Reading 1 (weakest): Skipping Levels**
     - **Label**: Level-Skipping
     - **Precise claim**: Greedy reductionism is the mistake of trying to explain a phenomenon by jumping directly to a lower level of explanation without accounting for the patterns and regularities at the intermediate levels.
     - **Kind**: Methodological rule
     - **Status**: Substantive and defensible
     - **Supports my friend's move**: Yes, if my account skipped intermediate levels of mechanism.
     - **What would have to be shown**: That the intermediate levels are necessary for a complete explanation.

  2. **Reading 2: Changing the Subject**
     - **Label**: Eliminativism
     - **Precise claim**: Greedy reductionism is the error of explaining away the phenomenon by denying its reality or by redefining it in terms that do not capture the original pattern that needed explanation.
     - **Kind**: Claim about what counts as an explanation
     - **Status**: Substantive and defensible
     - **Supports my friend's move**: Yes, if my account changed the subject by, for example, reducing correctness to something that doesn't preserve normative force.
     - **What would have to be shown**: That the reduction fails to capture the essential features of the phenomenon.

  3. **Reading 3 (strongest): False Reduction**
     - **Label**: False or Incomplete Reduction
     - **Precise claim**: Greedy reductionism is an attempt to reduce a phenomenon that either is false (because the phenomenon is not reducible) or is incomplete (because it leaves out essential aspects).
     - **Kind**: Empirical claim or metaphysical claim
     - **Status**: Contentious (because it depends on whether the reduction is possible)
     - **Supports my friend's move**: Yes, if he believes my reduction is false or incomplete.
     - **What would have to be shown**: That the phenomenon is irreducible or that the reduction misses essential aspects.

  Note: The second reading of greedy reductionism (Eliminativism) makes it a fault distinct from falsehood because it's about failing to address the original explanandum (changing the subject) rather than being empirically false. It might be true that the lower-level phenomena occur, but they don't explain the higher-level pattern we started with.

  ## Cases

  We now address the three cases.

  ### (a) The borrowed crane

  - **Case**: borrowed crane
  - **Skyhook under**: 
     - If we use "Non-Circular Natural Mechanism" (crane reading 2): It would be a skyhook if the mechanism presupposes correctness in its operation. So under that reading, it might be a skyhook.
     - If we use "Inexplicable Skyhook" (skyhook reading 3): Only if the mechanism's use of normative terms indicates that normativity is inexplicable.
  - **Crane under**: 
     - "Stepwise Mechanism" (crane reading 1): It is a crane because it is a mechanism that builds from below, even if described with normative terms.
     - "Non-Circular Natural Mechanism" (crane reading 2): It is a crane only if the normative descriptions are eliminable in favor of non-normative ones.
  - **Verdict**: The borrowed crane is not necessarily a skyhook. It may be a legitimate crane if the normative vocabulary is just a way of describing a non-normative mechanism that doesn't actually rely on normativity.
  - **Decisive question**: Can the mechanism be fully specified without using normative terms?

  ### (b) The inherited crane

  - **Case**: inherited crane
  - **Skyhook under**: 
     - "Contextual Skyhook" (skyhook reading 1): In the context of the system, the normativity arrives from above and is unexplained, so it is a skyhook relative to that system.
     - "Non-Natural Skyhook" (skyhook reading 2): Only if the agents who built the system are taken to have non-natural normativity.
  - **Crane under**: 
     - "Stepwise Mechanism" (crane reading 1): It is a crane because it is part of a historical process that built up normativity step by step.
     - "Non-Circular Natural Mechanism" (crane reading 2): It is a crane if the earlier agents' normativity is itself explained by a non-circular natural mechanism.
  - **Verdict**: The inherited crane is not a skyhook in the absolute sense if the entire history of normativity is built by cranes. But relative to the system, it might appear as a skyhook.
  - **Decisive question**: Is the normativity of the original agents explainable by cranes?

  ### (c) The stipulated floor

  - **Case**: stipulated floor
  - **Skyhook under**: 
     - "Contextual Skyhook" (skyhook reading 1): The rules are skyhooks in the simulation context because they are unexplained.
     - "Non-Natural Skyhook" (skyhook reading 2): Only if the rules are taken as non-natural.
  - **Crane under**: 
     - All crane readings: From outside, the rules are implemented by hardware, so they are cranes. But within the simulation, they might be taken as primitive.
  - **Verdict**: Whether the rules are skyhooks depends on the context of explanation. They are skyhooks relative to the simulation but cranes relative to the hardware.
  - **Decisive question**: What is the explanatory context? (If the context is the entire system including hardware, then they are cranes; if only the simulation, then skyhooks.)

  ## Indexicality

  - **is_skyhookhood_relative_to_a_baseline**: yes for some readings only (specifically, for the "Contextual Skyhook" reading, it is relative; for the "Non-Natural" and "Inexplicable" readings, it is absolute).
  - **consequence_for_the_slogan**: If skyhookhood is relative, then the slogan "there are no skyhooks" becomes nearly trivial because one can always shift the context to make any explainer a skyhook. But for the absolute readings, the slogan is substantive and contentious.

  ## Bottom line

  The reading of 'skyhook' to press for is "Non-Circular Natural Mechanism" (which is actually a crane reading, but we are focusing on the non-circularity) or "Inexplicable Skyhook". This commits him to the view that any explanation of normativity must not presuppose normativity in a circular way and must be naturalistic. If he accepts that, then he must show that any proposed mechanism for normativity either is circular or relies on non-natural properties.

  We now output the JSON object accordingly.
