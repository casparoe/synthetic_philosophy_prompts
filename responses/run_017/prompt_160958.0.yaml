     4. Description of the Quarantined Mint scenario: Two identical kingdoms on silver standard. Same real resources, same trading partners, same laws, no paper money, no central bank, no futures. 
          - Gradual: New silver mine pays out slowly over 12 months, coins spent immediately on local goods.
          - Quarantine: Same total silver, but coins locked in mint for 12 months then released all at once.
          Why both accept: It isolates the effect of gradual circulation vs. sudden injection without other confounders.

   Disagreements Table (at least one row on Quarantined Mint predictions):

     Crux 1: What happens in the Quarantined Mint case?
        - Neutrality: In both kingdoms, by month 12 (end of injection) and month 24 (one year after), real output and employment will be the same. Only prices differ: in Gradual, prices rise gradually over the year; in Quarantine, prices jump at month 12. At month 3, Gradual might have a tiny temporary boost because some money is in circulation, but it's negligible and unstable. By month 24, both are back to normal.
        - Quickening: In Gradual, by month 3 and through month 12, we see higher employment and output because the gradual spending stimulates demand and industry. In Quarantine, nothing happens until month 12, then a price spike and minimal real effect. By month 24, both are back to long-run levels, but Gradual may have left behind better habits or capital.
        Shared evidence: The scenario itself, designed to test the gradual mechanism.
        Prediction: 
            - Neutrality: Real variables (output, employment) same in both at all times except maybe a trivial, unstable blip in Gradual during the year. Prices: gradual rise in Gradual, jump in Quarantine at month 12. By month 24, same real, same price level (adjusted for the new money).
            - Quickening: In Gradual, higher output and employment during months 1-12, especially noticeable at month 3 and 12. In Quarantine, no change until month 12, then only prices spike. By month 24, real variables same, but Gradual might have a small legacy (e.g., improved skills).

     Crux 2: Does Hume's oil metaphor commit to strict neutrality?
        - Neutrality: Yes, oil only reduces friction; it doesn't add a wheel. Money is purely facilitative and cannot boost real output even temporarily in a stable way.
        - Quickening: No, oil that is applied gradually can allow the wheels to turn faster for a while until the machine adjusts. The metaphor is compatible with a temporary stimulus.
        Shared evidence: Hume's metaphor and his discussion of the transition period.
        Prediction: Not directly, but we can use the Quarantined Mint as a test.

     Crux 3: Is the "spirit of industry" a real causal mechanism or just a description?
        - Neutrality: It's a way of talking about the temporary illusion of wealth that fades when prices adjust. Not a stable cause of growth.
        - Quickening: It is real: when merchants see more sales and profits, they work harder and hire more, and this can last until prices catch up.
        Shared evidence: Hume's discussion of how new money can "quicken" industry.
        Prediction: In Quarantined Mint, Gradual should show increased industry during the year; Quarantine won't.

     Crux 4: What time-scale is "short run" for Hume?
        - Neutrality: Very short, just the unstable transition period (months, not years).
        - Quickening: Long enough for output to rise and even leave some lasting effects (up to a few years).
        Shared evidence: Hume's examples and the speed of price adjustments in the 18th century.

   Note on verbal vs. real:
     - Some disputes are about time-scale (e.g., how long is short run) and might be partly verbal.
     - The existence of a non-negligible temporary boost is a real dispute.
     - The causal reality of the spirit of industry is real.

   Additional test for genuine cruxes (beyond Quarantined Mint):
