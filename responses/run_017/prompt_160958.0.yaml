          In Kingdom Spend, the ruler immediately spends it on public works (roads, bridges) and transfers to subjects. 
          In Kingdom Hoard, the ruler locks it in the vault for one year, then spends it all at once.
          Predictions:
            - Neutrality: In Spend, a temporary price spike and then inflation, but no lasting real effect. The public works might have real effects, but that's fiscal, not monetary. The monetary effect is just inflation. In Hoard, same but delayed.
            - Quickening: In Spend, the immediate spending (especially on public works) boosts employment and output during the year, and the infrastructure might leave lasting benefits. In Hoard, no effect until year 2, then inflation without the same real boost.

   Word count: We need to be concise. Aim for 1000-1200.

