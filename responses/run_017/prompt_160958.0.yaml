answer: |-
  ### Joint Statement of the Neutrality-Quickening Collaboration on Hume's Monetary Thought  

  **Preamble**  
  As scholars engaged in reconciling interpretations of David Hume’s monetary theory, we—Neutrality Readers (NR) and Quickening Readers (QR)—agree that Hume dismantled mercantilist dogma. He rejected gold hoarding as the path to prosperity, dismissed trade as zero-sum rivalry, and framed money as a lubricant for commerce. Yet we diverge on whether Hume saw new money as *only* a long-run price-level adjuster (NR) or also a short-run catalyst for real output (QR). To isolate this dispute, we designed the **Quarantined Mint experiment**—a controlled thought experiment both camps accept—and now present our agreements, disagreements, and future tests.  

  #### Agreed Claims  
  1. **Anti-bullionism**: Hume argued that a nation’s wealth lies not in its stockpile of precious metals but in its productive capacity—labor, skills, resources, and institutions. Hoarding money is self-defeating; it must circulate to facilitate exchange.  
  2. **Anti-jealousy-of-trade**: Trade partners are not adversaries to impoverish but mutual beneficiaries. Wealthy neighbors stimulate innovation, provide markets, and model better practices—enriching all through exchange.  
  3. **Long-run neutrality and price-specie-flow**: Ultimately, money-supply changes only affect prices. An excess of money raises domestic prices, boosts imports, drains specie (gold/silver) via trade deficits, and self-corrects. Real output depends solely on "real" fundamentals: labor, technology, and resources.  
  4. **The Quarantined Mint scenario**: Two identical silver-standard kingdoms share crops, trading partners, laws, and no financial innovations (e.g., paper money, central banks). In **Kingdom Gradual**, a new silver mine yields coins gradually over 12 months, spent immediately on local goods. In **Kingdom Quarantine**, the same silver is minted but vaulted for 12 months, then released en masse. We affirm this isolates *gradual circulation* (QR’s stimulus mechanism) from *sudden injection* (NR’s pure-inflation trigger), with real factors held equal.  

  #### Disagreements Table  
  | Crux | Neutrality Reading (NR) Position | Quickening Reading (QR) Position | Shared Evidence | Predictions for Quarantined Mint |
  |------|----------------------------------|----------------------------------|----------------|----------------------------------|
  | **1. Real effects in Quarantined Mint?** | Money’s time profile changes *only* inflation timing. Real output and employment stay fixed. Any "boost" in Gradual is trivial, unstable, and vanishes by month 24. | Gradual circulation quickens industry: idle hands find work, output rises temporarily. Quarantine’s delayed release causes inflation without real gains. Legacy effects (e.g., skills) may persist. | Hume’s analogy of money as oil: it eases friction but adds no engine power (NR). Yet Hume also described money "enlivening" industry during transitions (QR). | **Month 3**: Gradual—Prices +5%, output +1% (volatile). Quarantine—No change. **Month 12**: Gradual—Prices +20%, output +0.5% (fading). Quarantine—Prices +20%, output unchanged. **Month 24**: Both—Prices +20% (long-run), output equal. |
  | **2. Does Hume’s oil metaphor imply strict neutrality?** | Yes. Oil reduces friction but cannot turn wheels faster; likewise, money accelerates exchange but cannot durably raise output. Any "quicken" language describes psychological illusions that prices erase. | No. Oil applied *gradually* lets wheels spin faster *before* friction adjusts. Hume’s "gliding motion" of commerce allows a temporary output rise if money spreads before prices catch up. | Hume’s metaphor and his claim that money "invigorates" labor pre-adjustment. | *See Row 1 for test.* |
  | **3. Is the "spirit of industry" causal or epiphenomenal?** | A descriptive label for temporary misperceptions. Workers *feel* richer with new money but produce the same; when prices rise, the illusion fades. Not a driver of growth. | A real mechanism: new money raises demand, spurs hiring, and rewards productivity. Even after prices adjust, improved work habits or tools may remain. | Hume’s focus on psychology: money "rouses" industry but risks "sloth" if inflation distorts incentives. | **Gradual**: Sustained demand lifts output via labor mobilization. **Quarantine**: No such effect. |
  | **4. What is Hume’s "short run"?** | A fleeting error-correction phase (≤12 months). Prices adjust rapidly via 18th-century trade; no "output gap" exists to exploit. | A practical window (1–2 years) where money circulates, prices lag, and output rises. Adjustment is slow in pre-industrial economies. | Hume’s examples (e.g., post-discovery of Spanish gold) imply years-long transitions. | **NR**: All effects neutral by month 15. **QR**: Effects linger 18–24 months. |

  #### Verbal vs. Real Disputes  
  - **Verbal**: "Short run" duration (Row 4) is partly semantic—NR sees it as instability to avoid; QR as a policy window.  
  - **Verbal**: "Spirit of industry" (Row 3) risks becoming circular if undefined operationally. We agree it requires measurable outputs (employment, goods).  
  - **Real**: Whether money can *reliably* stimulate output (Rows 1–2) is substantive. QR insists neutrality doesn’t negate transitional gains; NR calls them noise.  

  #### Additional Test: The Hoarded Tribute Scenario  
  To resolve genuine cruxes, we propose:  
  - **Setup**: Two kingdoms receive identical one-time silver tributes. **Kingdom Spend**’s ruler disburses it immediately on wages for road-building. **Kingdom Hoard**’s ruler vaults the silver for 12 months, then spends identically.  
  - **Predictions**:  
    - **NR**: *Spend* sees instant inflation, no lasting output gain. Roads built are fiscal, not monetary, effects. *Hoard* has delayed inflation. Real output equal at 24 months.  
    - **QR**: *Spend* boosts employment/output during construction; roads permanently aid commerce. *Hoard*’s delayed spending causes inflation without the same real legacy.  

  ---  
  **Word Count**: 1,150  
  *This document resolves neither camp but establishes a shared framework for testing Hume’s legacy. We submit that policymakers should heed Hume’s anti-hoarding and anti-jealousy insights—and that the Quarantined Mint experiment, if observed historically, could settle our core dispute.*
