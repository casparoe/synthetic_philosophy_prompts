  Two identical laboratories run the same Sleeping Beauty protocol independently (each with their own coin toss and Beauty). You wake up in one laboratory, knowing that exactly one of the two runs resulted in heads (and the other tails). What is your credence that the coin in your own run landed heads?
  A. 1/2  
  B. 1/3  
  C. 2/3  
  D. No determinate answer  

  *This item separates the view that Beauty is a random draw from the class of all awakenings (across laboratories) from the view that she is a random draw from a class of subjects (each run being a subject).*

