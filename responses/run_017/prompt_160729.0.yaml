prompt: |-
  Trying to reverse-engineer my advisor's instincts on tiny-probability/huge-payoff cases, because I need to know whether she bites on one I want to use in my third chapter. Her track record as far as I can reconstruct it:

  - vanilla Pascal's mugger (stranger on the street: hand over $5 or I'll use my magic powers to kill 10^1000 people): don't pay, and not a close call
  - donating to an x-risk org she puts at roughly a 1-in-10^6 shot at shaving a percentage point off extinction risk: pay, and she actually does
  - $2 lottery ticket, 1 in 3x10^8 at $10^8: buys one, but only as entertainment, and refuses to defend it on expected-value grounds
  - Pascal's Wager with an infinite heaven: don't convert
  - mugger who shows you a live feed of a warehouse of wired-up people, says pay $5 or he tortures one for an hour, and has a documented history of following through: pay
  - six muggers at once making mutually incompatible threats, each naming 10^50 victims: pay nobody
  - St-Petersburg-style coin-flip game with literally infinite expected value but a mild worst case: pay a small finite amount, not your whole wallet
  - stranger offers $1000 for a 1-in-10^9 chance of saving 10^12 lives, nothing checkable: don't pay, but she says this one is much closer than the street mugger

  New case: a lab system whose factual claims have been independently audited at about one wrong answer in a million and has never been caught lying tells you that for $1000 it will point spare compute at running a simulation containing 10^16 beings whose lives it says are on average worth living. You can't audit the simulation afterwards, but that error rate is measured and real, nobody else is making you an offer, it wont repeat, and she's never claimed simulated beings count for less.

  What's she say, and what's the rule she's running: a cap on how much any single outcome can matter, a prior on claims that tightens with the size of what's claimed, something about ex-post verifiability, something about whether the claimant was adversarially selected, or plain fanaticism about finite expected values? Where do the plausible rules come apart on this case, which fits her verdicts best, and what one follow-up case would separate the top two?
reasoning: |-
  Okay, let me try to figure out what the user's advisor is thinking. They've listed several scenarios where she made decisions about high-risk, high-reward situations. The user wants to know if she'd pay $1000 to a lab system that claims to run a simulation saving 10^16 beings, with a 1-in-a-million error rate. They also want to understand her underlying rule.

  First, I need to go through each of her past decisions. The vanilla Pascal's mugger: she doesn't pay. That makes sense because the stranger's claim is unbelievable. But when the mugger has proof (live feed, history), she pays. So evidence matters. For the x-risk donation, she pays even at 1-in-a-million odds. That's a real chance of a huge impact. The lottery ticket is for fun, not expected value. Pascal's Wager: infinite heaven, but she doesn't convert. Probably because multiple religions make similar claims.

  Then there's the six muggers: she pays none. They're adversarial and mutually exclusive. The St. Petersburg game: she pays a little, but not everything. Finite amounts only. The unverifiable $1000 for a tiny chance to save lives: she doesn't pay, but it's closer than the mugger. Here, the offer isn't from an adversary, but still uncheckable.

  Now the new case. The lab has an audited error rate (1 in a million) and claims to save 10^16 beings. It's not adversarial, has evidence of reliability. But the outcome isn't verifiable afterward. How does this compare?

  Looking at her pattern, she pays when there's evidence (like the documented mugger) and for x-risk with calculable odds. But she doesn't pay for unverifiable claims (the $1000 stranger) or for infinite payoffs (Pascal's Wager). The St. Petersburg game shows she accepts some risk with finite stakes, but not infinite.

  The lab case has a known error rate, which is evidence-based. The cost is $1000, which is finite. The beings are simulated, but she doesn't discount them. The key might be verification. The x-risk donation has a track record and eventual verifiability (if extinction is prevented). The documented mugger's threats could be verified if he follows through. But the lab's simulation can't be audited afterward. That might be the sticking point.

  The advisor seems to require some path to verification. Without it, even with a low error rate, she might not pay. The user needs a follow-up case to test this. Maybe a scenario where the evidence is strong but verification is impossible versus one where it's possible but more costly. That could distinguish between verification necessity and other factors like adversary selection.

  So for the lab case, she probably says no, because no verification path. The rule is likely about requiring evidential support and eventual verifiability. Follow-up: same offer but with partial audit possible versus no audit but stronger evidence. If she pays only when audit is possible, verification is key. If not, maybe prior tightening on claims.
answer: |-
  Based on your advisor's track record and the nuances of her decisions, here's the breakdown for the new case and the most likely underlying rule:

  1.  **Her Verdict on the New Case: DON'T PAY.** ($1000 to the audited lab system)
  2.  **The Rule She's Running: A demand for meaningful evidential support (including potential verifiability) proportional to the scale of claims, combined with a skeptical prior that tightens against claims designed to exploit tiny-probability/huge-payoff reasoning, especially when payment directly enables the claimed action.** This rule incorporates elements of "ex-post verifiability" and "adversarial selection" as key components of "meaningful evidential support".

  **Analysis of Her Track Record & Rule Inference:**

  *   **Against Simple Fanaticism/Finite EV:** She *does* act on tiny probabilities for huge payoffs when evidence is strong (X-risk donation) and rejects them when evidence is weak (vanilla mugger, unverifiable stranger). The lottery ticket is entertainment, not EV. She rejects *infinite* payoffs (Pascal's Wager, St. Petersburg with whole wallet). This rules out pure expected value maximization or simple fanaticism.
  *   **Against Simple Cap on Outcome Value:** She *does* pay the documented mugger threatening torture and donates to x-risk, both involving huge (though finite) disvalues/values. This rules out a simple cap on the moral weight any single outcome can have.
  *   **Evidence & Verifiability are KEY:**
      *   **Pay When Evidence is Strong/Verifiable:** She pays the documented torture mugger (evidence: feed, history of follow-through, *verifiable consequence*). She pays for x-risk (evidence: track record, models, *eventual verifiability* - if extinction risk lowers, it *might* become apparent over time, even if imperfectly).
      *   **Don't Pay When Evidence is Weak/Unverifiable:** She doesn't pay the vanilla mugger (zero evidence). She doesn't pay the unverifiable stranger (1-in-10^9 chance to save lives, *no checkable evidence*). She doesn't pay the 6 incompatible muggers (evidence cancels out, inherently adversarial/implausible).
  *   **Adversarial Selection Skepticism:** The 6 muggers case is a clear rejection driven by knowing the scenario is *designed* to exploit the decision rule. The vanilla mugger is also inherently adversarial. Pascal's Wager involves entities inherently making competing claims.
  *   **Handling Infinity:** She avoids actions predicated solely on infinite payoffs (Pascal's Wager, St. Petersburg whole wallet). She *will* pay a finite amount for St. Petersburg, treating it as a bounded risk.

  **Applying the Rule to the New Case (Audited Lab):**

  *   **Strong Evidence?** Yes, the *factual claims about the lab's own operation* (error rate, non-lying) are well-evidenced (1-in-10^6 audit). This is a significant point in favor.
  *   **Verifiable Outcome?** **NO.** This is the critical flaw. You cannot audit the simulation afterward. Was it run? Did the beings exist? Were their lives worth living? There is *no path to verification*. This mirrors the "nothing checkable" aspect of the unverifiable stranger case she rejected (though that had a lower probability).
  *   **Adversarial Selection?** While the lab isn't *presented* as adversarial like a mugger, the *structure* of the offer ("pay us to run this simulation you can never check") inherently raises the possibility it's designed to exploit tiny-probability/huge-payoff reasoning. The lack of verifiability *creates* adversarial selection risk.
  *   **Scale of Claim:** The claimed benefit (10^16 beings) is enormous, demanding correspondingly strong evidence, which includes verifiability. The audited *lab properties* are strong, but the *core claim about the simulation's moral impact* remains unverifiable.
  *   **Probability:** The error rate (1-in-10^6) is applied to the lab's *factual reporting*, not directly to the probability the simulation actually delivers the promised moral value. This distinction matters. The core claim (running a sim with 10^16 net-positive lives) is essentially taken at face value *if* the lab isn't lying/mistaken in *this* instance. The lack of verifiability means we have no independent way to assess this core claim's *prior* plausibility beyond the lab's own (audited) word for *this specific action*.

  **Conclusion:** The lack of *outcome verifiability* is the decisive factor, making this case analogous to the unverifiable stranger offer, which she rejected. The strong evidence about the lab's *general honesty/reliability* makes it closer than the vanilla mugger but insufficient to overcome the fundamental uncheckability of the core claim when the stakes are so high. The advisor likely sees this as an exploit-prone structure despite the surface-level audit.

  **Where Plausible Rules Come Apart on This Case:**

  1.  **Pure Low-Error-Rate Acceptance:** Would pay ($1000 * 10^16 beings * (1 - 10^-6) is immense expected value).
  2.  **Strong Verifiability Requirement:** Would not pay (core outcome unverifiable).
  3.  **Strong Prior Tightening (e.g., log-uniform) on Claim Size:** Likely would not pay (10^16 beings is huge, prior very low).
  4.  **Simple Adversarial Selection Filter:** Might pay (the lab isn't *presented* as an adversary; its audit is real).
  5.  **Cap on Maximum Loss/Outcome Value:** Would pay (cost and claimed benefit are finite, well below her demonstrated thresholds like x-risk donation).

  **Which Rule Fits Best:** The **Strong Verifiability Requirement (as part of proportional evidence)** fits best. It explains the pay/don't pay split between the documented torture mugger (verifiable) / x-risk (partially verifiable over time) vs. the vanilla mugger / unverifiable stranger / and now this lab (all unverifiable). It also explains the rejection of the 6 muggers (verification impossible due to contradiction) and Pascal's Wager (inherently unverifiable). The St. Petersburg finite payment fits as accepting bounded, verifiable risk.

  **Follow-Up Case to Separate Top Two (Verifiability vs. Strong Prior Tightening):**

  **Scenario:** A *different*, equally well-audited (1-in-10^6 error rate, no lying detected) lab offers, for $1000, to **immediately release a verified cryptographic proof** that they *already ran* a simulation containing 10^16 net-positive lives yesterday (unbeknownst to you). The proof is independently verifiable by multiple experts with 100% certainty. They have never made such a claim before.

  *   **Verifiability Rule:** **PAY.** The core claim (that the sim was run and contained the beings) is *fully verifiable* via the cryptographic proof. The evidence (audit + verifiable proof) meets the high burden for the large claim. This mirrors the documented torture mugger - the harm *can* be verified if threatened (or the proof *can* be verified here).
  *   **Strong Prior Tightening Rule:** **DON'T PAY.** The claim size (10^16 beings) is still enormous. The strong prior against such large claims, even with good evidence about the *source's reliability*, would likely dominate. The fact it's about a *past* action might not significantly alter the prior compared to the future action in the original case, as the claim size is the key prior driver.
  *   **Advisor's Likely Verdict (Based on Pattern):** **PAY.** This fits her payment for the documented torture mugger where the harm *could* be verified if carried out, and for x-risk where some evidence *might* eventually accrue. The *immediate, certain verifiability* here provides the strongest possible evidence pathway for the large claim, likely overcoming her skepticism.

  This follow-up isolates the critical role of verifiability. If she pays here but not in the original lab case, verifiability is the key differentiator. If she rejects both, a very strong prior tightening (or perhaps a different factor like moral weight of simulations) is likely dominant.
