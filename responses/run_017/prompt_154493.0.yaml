answer: |-
  ## Courier-Intelligencer Standards Desk: House Rules for Rating Claims Containing Definite Descriptions (v. 3.1)

  **Preamble:** To ensure consistent and verifiable ratings (TRUE, FALSE, UNVERIFIABLE) for claims presented in the "We Checked This" column and related fact-checking contexts, the Standards Desk hereby establishes the following protocols for statements containing definite descriptions (phrases of the form "the [X]"). These rules address common points of ambiguity and enforce rigorous logical hygiene. Compliance is mandatory for all copy desk personnel. Rewrites by reporting staff are strongly encouraged prior to submission.

  **Rule 1: Existence and Uniqueness Mandatory for "The"**
  A definite description "the [X]" presupposes both the existence of at least one entity satisfying "[X]" and the uniqueness of that entity (exactly one such entity). Failure of either condition renders any claim predicating something of "the [X]" FALSE. Ties for uniqueness constitute failure.

  *   **Example Claim:** "The tallest building downtown is the First Commerce Tower." (Rated TRUE on 10/15/2023)
  *   **Example Claim:** "The tallest building downtown is the First Commerce Tower." (Submitted 11/02/2023)
  *   **Verdict:** FALSE
  *   **Note:** As of 11/01/2023, the Riverview Plaza was completed, matching First Commerce Tower’s exact height (327 feet) per city surveyor records. Two tallest buildings exist. Claim is therefore FALSE. Previous rating is rescinded.

  **Rule 2: Negation Scope Resolution Protocol**
  Negations applied to claims containing definite descriptions generate ambiguity regarding scope. Does the negation apply to the entire claim (including the description's presuppositions) or only to the predicate? The Standards Desk resolves this ambiguity by producing two potential analyses:
      *   **Wide Scope Negation (FALSE):** "It is not the case that: [the X is Y]." This asserts the whole proposition is false, consistent with Rule 1 if existence/uniqueness fails.
      *   **Narrow Scope Negation (TRUE):** "There is a unique X, and it is not Y."
  The desk MUST determine the intended meaning through context. If context is insufficient, the claim is rated UNVERIFIABLE. Compound ratings (e.g., "TRUE (Narrow)") are forbidden in print; rewrite the claim to eliminate ambiguity. Compound ratings are strictly prohibited in headlines.

  *   **Example Claim:** "The current King of France is not bald."
  *   **Verdict:** FALSE (Wide Scope)
  *   **Note:** Context (modern political discussion) indicates an attempt to predicate non-baldness. Wide scope negation applies: the proposition "The current King of France is bald" is false because no unique satisfier exists (Rule 1). Therefore, its wide scope negation ("It is not the case that the KoF is bald") is TRUE. However, the narrow scope reading ("There exists a unique KoF and he is not bald") is FALSE due to existence failure. Context strongly suggests wide scope intent. Verdict: TRUE. (Headline ban: "King of France Found Hirsute? Not So Fast, Says Logic" - REJECTED per Rule 2 & 5).

  **Rule 3: Temporal Binding for "Present" and Implied Timeframes**
  Definite descriptions implying temporal immediacy (e.g., "the present," "the current," "the incumbent") MUST be evaluated at a specific timestamp. The default evaluation time is the moment the final print edition files for the press run (typically 3:00 PM local time). Entities must demonstrably satisfy the description at this exact time. "Present" status ceases immediately upon death, resignation, or disqualification. Status changes occurring after 3:00 PM but before street delivery are irrelevant for that day's rating.

  *   **Example Claim:** "The present Mayor attended the ribbon-cutting ceremony at 1:00 PM."
  *   **Verdict:** UNVERIFIABLE (Potential) / TRUE (Confirmed)
  *   **Note:** Verification requires confirming the Mayor held office *at 3:00 PM* on the claim date. If the Mayor resigned at 2:59 PM, verdict is FALSE. If confirmed in office at 3:00 PM, verdict is TRUE. Attendance at 1:00 PM is a separate verifiable fact, but the description's temporal binding is paramount. Reporters must specify the exact time of any status-dependent claim.

  **Rule 4: Negative Existential Claims as Prime Verification**
  Claims asserting the *non-existence* of the entity described by a definite description ("There is no such thing as the [X]") are to be treated as straightforward existential propositions. Such claims are rated TRUE if no entity satisfying the description exists, FALSE if exactly one exists, and UNVERIFIABLE if existence cannot be confirmed. The Standards Desk considers the successful verification of these claims, particularly where common misunderstanding might assume a "gappy" truth value, a hallmark of rigorous application.

  *   **Example Claim:** "There is no such person as the present King of France."
  *   **Verdict:** TRUE
  *   **Note:** Certified records from the French Republic confirm no monarchical office exists or is filled. Existence fails. Claim is TRUE. This exemplifies logical precision.

  **Rule 5: Isolation Prohibition and Canonical Rewrite Requirement**
  A definite description ("the [X]") possesses no independent meaning or referent. It is an incomplete symbol, contributing only to the truth conditions of the entire sentence in which it appears. Consequently:
      *   Definite descriptions are PROHIBITED in isolation: Headlines, standalone photo captions, subheadings, section break text, or transitional phrases (e.g., "Meanwhile, the reason for the delay...") MUST NOT contain them unless embedded within a complete, ratable sentence meeting all other Standards rules.
      *   **Canonical Rewrite:** To ensure clarity and verifiability, reporters MUST rewrite any sentence containing a definite description into its explicit existential-unique quantifier form prior to submission for rating: "There exists exactly one [X] and that [X] is [Y]." The Standards Desk reserves the right to perform this rewrite for rating purposes if the submitted copy is ambiguous. News Editor appeals regarding "readability" are noted but overruled on grounds of verifiability.

  *   **Example Headline:** "The Mayor's Biggest Donor Under Scrutiny"
  *   **Action:** REJECTED (Rule 5 Violation)
  *   **Required Rewrite (for claim submission):** "There exists exactly one individual who is the biggest donor to the Mayor's current campaign fund, and that individual is currently under scrutiny by the Ethics Commission." (See Rule 6 for rating such constructs).
  *   **Note:** Isolated descriptions invite referential confusion and cannot be rated. Rewrites enforce logical structure.

  **Rule 6: Application to Mundane Claims**
  These rules apply universally to all definite descriptions within ratable claims, regardless of subject matter perceived as ordinary or uncontroversial. Failure of existence or uniqueness, per Rules 1 and 5, mandates a FALSE verdict.

  *   **Example Claim:** "The reason the school levy failed was voter apathy."
  *   **Verdict:** FALSE
  *   **Note:** Post-election surveys and expert analysis (Political Science Dept., State University) identified three statistically significant causal factors cited by voters: tax burden concerns (42%), dissatisfaction with specific budget allocations (38%), and timing/messaging issues (35%). No single unique "reason" satisfying the description exists. Claim is FALSE. Rewrite required per Rule 5 would be: "There exists exactly one reason the school levy failed and that reason is voter apathy," which is demonstrably FALSE. Reporters should instead write: "Key factors in the levy's failure included..."
