  For the discounting argument: The claim that known liars get "moral discounts" feels intuitively wrong. Even if some listeners discount statements, the speaker's intent remains full deception—especially for crucial audiences like grand juries who must take testimony at face value. The wrong lies in the speaker's deliberate exploitation of communication norms, not just the resulting belief. This explains why Clinton's parsing felt more offensive than a simple lie—it weaponized language itself.

  Legally, the perjury focus makes sense as a bright-line rule, but it created irony: by fighting on technicalities, Clinton amplified moral outrage. The legal system's need for verifiable falsity doesn't negate that misleading can be equally harmful—it just makes it harder to punish.

  The case actually strains standard deception theory: Clinton achieved near-lie effectiveness while technically avoiding falsity, exposing how context (especially legal settings) distorts moral intuition. Yet theories can't explain why his evasions provoked more anger than lies might have—that's about violated expectations of candor in certain roles.

  Throughout, I'll specify audiences: grand juries (must take statements literally), public (varies in skepticism), Paula Jones' lawyers (focused on legal definitions), and Lewinsky (personal betrayal). This audience lens clarifies why identical techniques had different impacts—the grand jury couldn't "discount" his testimony like cynical voters might.

  The user seems sophisticated—likely a grad student or scholar—frustrated with theoretical gaps in deception ethics. They want concrete application, not textbook recitation. Their "discounting" challenge suggests they're probing whether utilitarianism can handle habitual liars. I'll need to firmly separate intent from outcome effects while acknowledging their intuition about belief-strength variation.

  Most importantly, I must resist over-theorizing where the case exceeds current frameworks—like why we resent "trickster truth" more than bold lies. That's the unanswered gem in their query.
answer: |-
  Here's a bottom-up case analysis, following your structure and constraints:

  **1. Taxonomy & Clinton Statement Mapping**  
  *(Built from observed tactics, not prior labels)*  

  | **Category**               | **Description**                                                                 | **Clinton Example**                                                                 | **Hearer**                 |
  |----------------------------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------------|----------------------------|
  | **(a) Assertion of falsehood** | Directly stating a known false proposition                                    | Televised denial: "I did not have sexual relations with that woman..."           | General public            |
  | **(b) Truth → False Inference** | Asserting a truth while foreseeing the hearer will reasonably draw a false conclusion | Jones deposition: Denying "improper relationship" (technically true if "relationship" implies emotional entanglement, but foreseeing inference of "no sexual contact") | Jones's lawyers, public |
  | **(c) Semantic Exploitation** | Using words true only under a strained/unexpected definition known to the hearer | Jones deposition: Denying "sexual relations" under the stipulated legal definition (oral sex excluded) | Jones's lawyers (operating under the stipulation) |
  | **(d) Convention Exploitation** | Exploiting grammatical/logical conventions (tense, scope, quantity) to convey a falsehood | Grand jury: "There is not a sexual relationship" (present tense, while past acts existed) | Grand jury, public |
  | **(e) Evasion/Deflection** | Avoiding the question or answering a different one                             | Non-responsive answers during depositions/interviews; e.g., focusing on legal definitions instead of substance | All hearers |

  * **Assessment of Taxonomy:**  
    * **Gap?** Missing *Implicature Denial*: Later explicitly denying the intended implication ("It depends on what the meaning of 'is' is" – denying he implicated *no past relationship* via present tense).  
    * **(c) vs. (d) Distinction:** They hold. (c) relies on *lexical ambiguity* ("sexual relations" definition). (d) relies on *grammatical/pragmatic conventions* (present tense implies current state, not past). Legal stipulations formalize (c), making it distinct from exploiting inherent conventions like tense (d).  
    * **Bug?** Not inherently. The distinction clarifies *how* the evasion works (word meaning vs. grammatical structure). Collapsing them loses analytical precision.

  **2. Dissecting the Discounting Point**  
  * **The Argument:** Known-dishonest speakers get "discounted," making their evasions produce weaker false beliefs in fewer people → less morally wrong than a lie.  
  * **Why it Fails:**  
      1.  **Audience Heterogeneity:** While some voters "discount," critical hearers (e.g., **Jones's Lawyers, Grand Jury, Judge Starr**) *cannot* discount. They are obligated to take testimony literally and at face value for legal/truth-finding purposes. Clinton’s evasion specifically targeted these formal contexts *relying* on their lack of discounting.  
      2.  **Intent vs. Outcome:** The core wrong lies in the *speaker's intent and attempt* to deceive, regardless of success rate. Clinton *aimed* for the same false belief ("No sexual contact occurred") as a lie would. The evasion was the *means*, not a mitigation.  
      3.  **Harm Scope:** While discounting might reduce false beliefs in *part* of the audience (cynical public), it can *increase* harm in others:  
          *   It erodes trust in institutions (Grand Jury, Courts) forced to engage with the evasion.  
          *   It creates a *new* harm: Corrupting language and procedural norms (e.g., making a mockery of deposition definitions, tense conventions).  
      4.  **Moral Hazard:** Accepting the discounting point *does* create the perverse incentive you note: worse reputation → cheaper deception. This undermines the very norms of truthful communication the prohibition against lying/misleading seeks to uphold.  
  * **Location of Wrong:** Primarily in **the speaker's deliberate exploitation of the communicative convention/system to induce a false belief**. Secondarily, in the *attempted* deception of specific, critical hearers (Grand Jury, investigators) who *must* take statements literally. The harm isn't solely in the resulting belief, but in the *instrumentalization and degradation of language and process*.

  **3. The Legal Hook & Moral Weight**  
  *   **Literal Falsity Focus:** The law (perjury, obstruction) *needs* a bright line. Proving subjective intent to deceive *beyond reasonable doubt* is often impossible without a literally false statement or overt act (e.g., witness tampering). The legal fight over definitions/tense reflects this necessity, not a moral claim that *only* literal falsity matters.  
  *   **Moral Load-Bearing:** The distinction *is* morally load-bearing *within the specific context of formal oaths/testimony*. Under oath, exploiting loopholes (c, d) violates the *spirit* of the oath (truthfulness) while *technically* avoiding falsity. This is a distinct wrong from lying under oath, but still a serious violation of role-specific duties (President, witness).  
  *   **Reaction to Quibbling:** The harsher reaction isn't *just* irritation. It stems from:  
      *   **Perceived Insult to Intelligence:** The evasion treated hearers (public, Congress, legal system) as fools capable of being gamed by semantic tricks.  
      *   **Betrayal of Role:** A President, especially under oath, is expected to exhibit candor and respect for process, not adversarial lawyering. The quibbling felt like a *corruption of the office itself*.  
      *   **Hypocrisy:** Contrast with Clinton's public persona of empathy and directness.  

  **4. What the Episode Does to the Theory**  
  *   **Handling by Literature:** The case is **an anomaly that strains standard theory**.  
  *   **Win for "No Moral Difference"?** In *intent and effect* on key hearers (Grand Jury), Clinton achieved deception equivalent to a lie. This supports the "no moral difference" camp regarding *harm/deception*.  
  *   **Win for the Distinction?** The *means* (semantic/tense exploitation) were distinct from lying and created *additional* harms (eroding procedural norms, public contempt for legalistic evasion). This supports the distinction having *some* moral significance (a distinct *kind* of wrong).  
  *   **Where Theory is Silent/Strained:**  
      1.  **Role Morality:** Theory often underweights the heightened duty of candor in specific roles (President, witness under oath) vs. general conversation. Clinton’s evasion wasn't just deception; it was a *failure of role-specific integrity*.  
      2.  **Institutional Harm:** Standard theories focus on individual deception/harm. They struggle to fully account for the harm done to *institutions* (Grand Jury, Presidency, legal process) by formal, technical evasion.  
      3.  **Public vs. Formal Hearers:** The starkly different reactions of cynical public vs. obligated legal hearers highlights that the moral weight of evasion depends critically on context and the hearer's role/duty. Theory often treats "the hearer" generically.  
      4.  **Contempt for Evasion:** The *greater* outrage at evasion vs. a potential lie isn't well-explained. Theory might predict less outrage (no literal lie). The extra anger stems from perceived *insolence* and *corruption of process* – factors beyond standard deception models.

  **Conclusion on the Discounting Point:** It fails decisively. The wrong of Clinton's evasion resides chiefly in his *deliberate exploitation* of linguistic and procedural conventions to deceive critical hearers (Grand Jury, investigators) who were duty-bound *not* to discount him, and in the distinct harm done to institutional norms. The moral hazard it creates is itself a reason to reject it.
