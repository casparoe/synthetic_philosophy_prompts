prompt: |-
  I spent thirty-nine years as a protein biophysicist, most of them on allosteric enzymes, and in retirement I have drifted into a reading group at the local university and from there onto the interdisciplinary review panel of a national funding agency. Two or three proposals per cycle now use "emergence" as a load-bearing word: the claim is always, in one form or another, that some macro-level feature cannot be had from the micro-level story, and that this is why the work deserves a new Centre rather than an ordinary grant. My fellow panelists are a cell biologist, a condensed-matter physicist and a computer scientist; none of us has any philosophy training, we have about twenty minutes per proposal, and we must attach a one-paragraph written justification that a rejected applicant can appeal against. So I need a triage procedure my panel can actually run, not an essay.

  What I want is a short ordered sequence of questions, each with a statement of what would count as a sufficient answer at that step, where the sequence terminates in a "no" (the word is doing no work, or is doing work that has nothing to do with emergence), and where it hands the decision up to the whole panel because the remaining question is one we have to settle by ourselves rather than by looking something up. Please make the translation explicit rather than tidy: tell me which distinctions from the philosophical literature genuinely have to survive the simplification to a twenty-minute panel, which ones can be collapsed without loss, and which ones are matters I should simply stop worrying about. In particular, I have been toying with three home-made markers, and I would like you to run them against the real thing and tell me which of them are already in the literature under another name, which of them collapse into each other, and which are simply bad ideas: (i) the squeeze test — shrink the system to ten, a hundred, a thousand components and ask whether the macro property is still well defined, or whether it exists only in some infinite-size or continuum limit that no real system instantiates; (ii) the swap test — ask whether the same macro-level law has been shown, or could in principle be shown, to hold over two physically quite different microrealizations, which I take to be a point in favour of the macro story being autonomous; (iii) the sham-intervention test — ask whether a manipulation specified only at the macro level reliably changes the macro property, and whether a manipulation specified at the micro level would let us predict the outcome any better. I also want you to be blunt about where the procedure cannot be more than a ritual: I strongly suspect that the step where one decides whether a failure of derivation is principled or merely a failure of our patience and our computers is exactly the sort of judgment call that gets dressed up as a procedure, and I would rather you marked it as a judgment call than pretended otherwise. Please do not give me bibliographies, reading lists or citations — I have no university library access now and do not want them; I want the distinctions themselves, in prose I could read aloud to the panel.

  Apply the finished procedure, in order, to three proposals from our last round, one paragraph each, and flag in each case which step the decision turned on and where judgment entered. First, a group I know well and am biased toward: a proposal that the switch-like sigmoid response of a two-domain kinase is emergent, that it cannot be recovered from high-resolution structures of the isolated domains, and that therefore the whole structure-guided drug discovery programme for this class of targets rests on a mistake. Second, a proposal on synthetic organoids claiming that tissue-level polarity is a case of downward causation, because the geometry of the tissue feeds back to orient the plane of cell division in individual cells, so that no cell-level rule set could in principle capture what is going on. Third, a machine-learning proposal claiming that a small transformer trained on a synthetic formal language acquires a systematic ability abruptly at a threshold in training compute, and that this threshold behaviour is emergent in the strong sense and so warrants a theory programme rather than more scaling. Give the procedure's verdict on each, including the one I will not like; then state, in one sentence, what the procedure is not able to tell us. Finish on the last line, with nothing after it, with a single machine-readable block in exactly this form: \answer{1=LABEL, 2=LABEL, 3=LABEL}, where each label is drawn from the set VACUOUS, EPISTEMIC_ONLY, AUTONOMOUS, ONTOLOGICAL, ESCALATE, followed after a colon by a short reason code of your own devising (for example \answer{1=EPISTEMIC_ONLY:limit-dependent, 2=..., 3=...}).
reasoning: |-
  Okay, let me tackle this systematically. The user is a retired protein biophysicist dealing with funding proposals that misuse "emergence" as a justification for large-scale funding. They need a practical triage procedure for their interdisciplinary panel, not philosophical theory.

  First, I'll distill the core problem: proposals claim macro-level features can't be derived from micro-level components to justify "Centre" funding. The panel has 20 minutes per proposal and needs a clear decision tree with explicit failure points. 

  The user's three homemade tests are insightful:
  - Squeeze test (system size dependence) relates to scale-dependent emergence in complex systems
  - Swap test (multiple realizability) aligns with functionalist views of emergence
  - Sham-intervention test (predictive autonomy) echoes Woodward's interventionist causality

  I'll structure the triage as a 5-step funnel:
  1. Vacuous use check - is "emergence" just decorative?
  2. Derivation failure test - is the micro-to-macro gap demonstrated?
  3. Squeeze test - does the phenomenon require unrealistic scales?
  4. Swap test - is the pattern micro-realization-independent?
  5. Sham-intervention test - does macro-manipulation reliably work?

  Crucially, step 5 requires panel judgment about whether the derivation gap is fundamental or just computational - I won't disguise this as mechanical.

  Applying this to their examples:
  1. Kinase proposal fails at step 3 (squeeze test) - sigmoid response exists in single domains
  2. Organoid proposal passes to step 5 but fails autonomy test (micro-predictions possible)
  3. ML proposal passes swap test but step 5 judgment favors epistemic gap (scaling might resolve)

  The procedure's key limitation: it can't prove ontological emergence, only identify when epistemic claims hold water. 

  Final verdicts will use the required labeling system with brief reason codes.
answer: |-
  Here is your triage procedure, designed for speed and defensibility. It preserves only distinctions that force different practical judgments. Philosophical terms are translated into operational tests. Judgment calls are explicitly marked.

  **Triage Procedure for "Emergence" Claims**

  1.  **Vacuous Check:** *Is "emergence" merely a synonym for "interesting" or "complex," with no claim about derivation failure?*  
      **Sufficient Answer:** Proposal states the macro-feature *is* derivable (in principle or practice) from micro-components plus interactions.  
      **Failure:** Terminate → **NO (VACUOUS)**. The word is doing no work.

  2.  **Derivation Failure Test:** *Does the proposal demonstrate a specific, non-trivial gap between the micro-description and the macro-behavior?*  
      **Sufficient Answer:** Shows concrete, documented failure to predict/explain macro-feature using standard micro-level tools/models *available for this system type* (e.g., MD simulations failed to predict cooperativity; agent-based models fail to capture tissue polarity rules; training dynamics defy simple loss-curve analysis).  
      **Failure:** Terminate → **NO (VACUOUS or UNSUBSTANTIATED)**. Gap not shown.

  3.  **Squeeze Test (Your Marker i):** *Is the macro-property robustly definable and observable in small/realistic instances, or does it critically depend on an infinite/continuum limit?*  
      **Sufficient Answer:** Property is clearly observable/measurable in systems of computationally tractable or experimentally accessible size (e.g., cooperativity in a dimer; tissue polarity in a 100-cell organoid; systematicity in a tiny transformer).  
      **Failure:** Terminate → **NO (EPISTEMIC_ONLY:ARTIFACT_OF_LIMIT)**. The "emergence" is likely just a mathematical artifact of an idealized, non-physical limit. Real systems don't need a "Centre" for this.

  4.  **Swap Test (Your Marker ii):** *Is the macro-behavior (or "law") demonstrably similar across significantly different micro-realizations?*  
      **Sufficient Answer:** Shows qualitatively similar macro-behavior in ≥2 systems with clearly distinct micro-components/physics (e.g., same sigmoid response in different allosteric protein architectures; same tissue polarity arising via different cytoskeletal mechanisms; same threshold behavior in different NN architectures/algorithms).  
      **Failure:** **ESCALATE TO PANEL JUDGMENT (AUTONOMOUS?)**. Lack of evidence for multiple realizability weakens autonomy claim but doesn't kill it. Proceed to Step 5.

  5.  **Sham-Intervention Test (Your Marker iii) & Judgment Call:** *Can macro-level manipulations reliably control the macro-property? AND crucially, does specifying the intervention at the micro-level demonstrably *not* improve predictive power or control compared to the macro-specification alone?*  
      **Sufficient Answer:** a) Shows reliable macro-manipulation (e.g., drug dose → response; geometric constraint → polarity; training schedule → threshold). b) Argues convincingly *why* a complete micro-specification wouldn't yield better predictions/control *for the purpose stated in the proposal*.  
      **Judgment Call:** The panel must decide: **Is the derivation failure identified in Step 2 likely *principled* (fundamental autonomy) or *merely practical* (current tools/compute inadequate)?**  
      - **Principled Failure + Sham-Intervention Success:** → **YES (AUTONOMOUS)**. Macro-level description/prediction/manipulation is legitimately more efficient/effective.
      - **Practical Failure:** → **NO (EPISTEMIC_ONLY:PRACTICAL_DERIVATION_GAP)**. More effort/compute on micro-level might suffice.
      **Failure (a or b):** Terminate → **NO (EPISTEMIC_ONLY:NO_MACRO_CONTROL or MICRO_PREDICTIVE)**.

  **Translation & Marker Assessment:**
  *   **Squeeze Test (i):** Captures scale-dependence central to *weak emergence* (Bedau) and distinguishes it from artifacts of continuum math. Essential. Survives.
  *   **Swap Test (ii):** Captures *multiple realizability*, core to arguments for *functionalist autonomy* (Fodor). Essential for claims of domain-generality. Survives.
  *   **Sham-Intervention Test (iii):** Captures *causal autonomy* (inspired by Woodward). Links emergence to *explanatory/predictive power*. Essential. Survives.
  *   **Collapsed:** Strong ontological emergence (irreducible downward causation). Your procedure tests for *practical autonomy and causal leverage*, which is what matters for funding. "Downward causation" claims must pass Sham-Intervention.
  *   **Stop Worrying:** Fine-grained debates about supervenience, brute necessitation, or whether fundamental physics is causal. Irrelevant to your panel's task.
  *   **Ritual Acknowledged:** The **Judgment Call in Step 5** is unavoidably subjective. The procedure forces articulation of *why* the gap exists but cannot objectively settle "principled vs practical." Panel expertise must rule.

  **Application to Proposals:**

  1.  **Two-Domain Kinase (Your Group):**
      *   Step 1: Not vacuous. Claims sigmoid response not derivable from isolated domains.
      *   Step 2: Derivation Failure? **Yes.** High-res structures of isolated domains don't predict cooperativity. Pass.
      *   Step 3: Squeeze Test? **FAIL.** Cooperativity (sigmoid response) is a hallmark of dimers and small oligomers. It doesn't require large N or continuum. It's robustly definable and observable in tiny systems (even a dimer!). **VERDICT: NO (EPISTEMIC_ONLY:ARTIFACT_OF_LIMIT).** *Decision turned on Step 3. Bias noted: the squeeze test objectively kills this "emergence" claim.*

  2.  **Synthetic Organoids (Downward Causation):**
      *   Step 1: Not vacuous. Claims cell-division rule depends on tissue geometry.
      *   Step 2: Derivation Failure? **Yes.** Shows specific cell-level models fail to capture geometry-dependent orientation without adding tissue-level parameters. Pass.
      *   Step 3: Squeeze Test? **Pass.** Polarity patterns observable/definable in small organoids (~10s-100s cells).
      *   Step 4: Swap Test? **ESCALATE (Pass? Fail? Unclear).** Proposal implies different cytoskeletal mechanisms *could* achieve same polarity under same geometric constraint, but doesn't demonstrate it. Panel must escalate.
      *   Step 5: Sham-Intervention Test? **a) Macro-Manipulation:** **Yes.** Changing tissue geometry (macro) reliably changes division plane (macro outcome). **b) Micro-Predictive Advantage?** **Judgment Call:** Panel must decide if specifying *all* cell states/internal dynamics would demonstrably *not* yield better predictions of division plane *than knowing just the tissue geometry and a simple boundary rule*. Likely **YES (Micro doesn't add predictive power for *this* outcome)**. BUT: **Judgment Call (Principled vs Practical Failure):** Is the failure in Step 2 because no cell-level rule *can* exist (principled)? Or just that we haven't found it yet (practical)? **Panel likely judges Practical:** Cell-level rules incorporating mechanosensing *could* exist and might be findable with more work. **VERDICT: NO (EPISTEMIC_ONLY:PRACTICAL_DERIVATION_GAP).** *Decision turned on Step 5 Judgment Call (Principled vs Practical). Swap Test ambiguity noted.*

  3.  **Machine Learning Threshold:**
      *   Step 1: Not vacuous. Claims threshold behavior not derivable from component weights/training dynamics.
      *   Step 2: Derivation Failure? **Yes.** Shows abrupt change defies simple extrapolation from early training; analysis of weights pre/post is opaque. Pass.
      *   Step 3: Squeeze Test? **Pass.** Threshold observed in small, tractable model/toy language.
      *   Step 4: Swap Test? **Pass.** Threshold/phase-transition-like behavior is a widely observed phenomenon across vastly different architectures (RNNs, CNNs, Transformers) and tasks/languages. Strong evidence for multiple realizability.
      *   Step 5: Sham-Intervention Test? **a) Macro-Manipulation:** **Yes.** Changing training compute/compute schedule (macro) reliably triggers/misses threshold (macro outcome). **b) Micro-Predictive Advantage?** **Yes.** Currently, inspecting weights/trajectories (micro) offers *no better prediction* of *when* the threshold will be hit than tracking loss/compute (macro). **Judgment Call (Principled vs Practical Failure):** Is this failure fundamental? **Panel likely judges Principled (or sufficiently deep):** The precise mechanistic "why" of thresholds in complex NNs is a major open question; prediction from micro-state seems fundamentally harder than macro-tracking. Favors autonomy. **VERDICT: YES (AUTONOMOUS).** *Decision turned on Step 5 Judgment Call (Principled vs Practical), strongly supported by Swap Test.*

  **What the Procedure Cannot Tell Us:** It cannot definitively prove *ontological* emergence or fundamental new laws of nature, only whether a macro-level description currently provides demonstrable, autonomous causal leverage for prediction and control that a micro-description lacks.

  \answer{1=EPISTEMIC_ONLY:small_N_robust, 2=EPISTEMIC_ONLY:practical_gap, 3=AUTONOMOUS:macro_leverage}
