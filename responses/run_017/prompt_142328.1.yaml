      We'll use the lost drone in a warehouse grid.

      Grid: 
          North
        West   East
          NW    NE
          SW    SE
          South

      Message: "If the drone is in the East half, then it is in the South row."

      We'll call the session: "Lost Drone, Conditional Message"

  11. **Final timeline:**

      - 0-5 min: Introduction and setup.
      - 5-30 min: Group work (25 min) [Note: 25 minutes might be long, but they need to understand the protocol and update]
      - 30-35 min: Collect bets and reveal true location (SW)
      - 35-40 min: Compute scores and display
      - 40-50 min: Debrief and discussion

      Alternatively, we might cut group work to 20 min and extend debrief.

