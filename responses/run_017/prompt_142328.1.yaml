     This is a higher-order belief. It requires them to model what they will believe after the message. 

     We can do: 
          The protocol: in which cells would the operator send that message? 

     But it's circular: the operator is saying something about the drone's future belief.

     This might be too complex for 5 minutes. We can skip it.

     Alternatively, we can do a very simple version:

          Suppose the operator says: "I think you are in the West half."

          But then we need to define what the operator thinks? 

     Given time constraints, we might skip this variant.

