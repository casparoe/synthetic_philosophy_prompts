     - 30-40 min: Betting and Scoring
          Each group writes their chip distribution on a board. Then the true location (SW) is revealed.
          Facilitator computes the payout for each group using the quadratic scoring rule:

              payout = 20 + 20 * [ 2 * (fraction on SW) - (fraction_NW^2 + fraction_SW^2 + fraction_NE^2 + fraction_SE^2) ]

          But note: the fractions are based on their chip distribution.

          Example for Group 1: 
              They put (say) 7 on NW, 7 on SW, 6 on SE, 0 on NE? 
              Fractions: 
                  NW: 7/20=0.35, SW:0.35, SE:0.3, NE:0.
              Sum of squares: 0.35^2 + 0.35^2 + 0.3^2 + 0^2 = 0.1225 + 0.1225 + 0.09 = 0.335.
              2 * fraction_SW = 2*0.35 = 0.7.
