              Likelihoods: 
                  P(message|NW) = 0.9
                  P(message|SW) = 0.9
                  P(message|SE) = 0.9
                  P(message|NE) = 0.1
              Unnormalized posterior:
                  NW: 0.9 * 0.25 = 0.225
                  SW: 0.9 * 0.25 = 0.225
                  SE: 0.9 * 0.25 = 0.225
                  NE: 0.1 * 0.25 = 0.025
              Sum = 0.225*3 + 0.025 = 0.675+0.025=0.7
              Normalized:
                  NW: 0.225/0.7 ≈ 0.3214
                  SW: 0.3214
                  SE: 0.3214
                  NE: 0.025/0.7 ≈ 0.0357

              So chips: 
                  NW: 0.3214 * 20 ≈ 6.428 -> they might put 6 or 7
                  SW: 6.428 -> 6 or 7
                  SE: 6.428 -> 6 or 7
                  NE: 0.0357*20 ≈ 0.714 -> 1 chip? or 0? But we have 20 chips. They must distribute 20.

