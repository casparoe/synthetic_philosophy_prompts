      - 30-35 min: Compute and announce scores (if using candy, hand out then)
      - 35-50 min: Debrief (15 min)

      We'll provide the worked numbers for the facilitator.

      Now, the detailed script.

  **Facilitator Script:**

  **Introduction (0-5 min):**
  "Welcome to Hard Problems, Cold Pizza! Today, we're going to play a game about a lost drone in a warehouse. The warehouse is divided into four areas: Northwest, Northeast, Southwest, Southeast. [Show grid.] The drone doesn't know where it is, but it has a radio. It receives one message from the operator. We don't know where the drone is, but we all heard the same message: 'If you are in the East half, then you are in the South row.'

  But here's the twist: the operator has a different way of deciding what to send in different scenarios. You'll be in small groups, and each group has a different codebook that explains the operator's protocol. Your job: figure out how likely you think each cell is, and then bet your chips accordingly. You start with 20 chips, and initially, you think each cell is equally likely, so 5 chips on each.

  After you update your beliefs, distribute your 20 chips to reflect your confidence: more chips on cells you think are more likely. We'll then reveal the true location and score you. The scoring rule is designed so that you get the most candy if you honestly report your true beliefs. We'll explain the scoring rule after you bet.

  Any questions? [Answer any.] Now, break into your groups."

  **Group Work (5-25 min):**
  - Assign groups and hand out materials.
  - Materials: 
     - Grid map (same for all)
     - Codebook (different per group)
     - 20 chips per group
     - Instructions: "Read your codebook. Discuss: given that the drone received the message 'If you are in the East half, then you are in the South row', how should you update your beliefs about the drone's location? Distribute your 20 chips accordingly. Be ready to explain your reasoning."

  - Facilitator circulates, observes, and takes notes. 
    - Listen for: 
        - "So if the drone were in NE, the operator wouldn't have sent this message, right?" 
        - "Wait, our codebook says the message is only sent if in the south row, so NW and NE are ruled out."
        - For the noisy group: "There's a 10% chance it was garbled, so even in NE, there's a small chance we got the message."

    - If a group is stuck, ask: "According to your codebook, in which cells would the operator have sent this message? And in which cells would they not? Then, given that the message was sent, which cells are still possible?"

  **Betting and Scoring (25-35 min):**
  - Collect each group's chip distribution and write on a whiteboard.
  - Reveal the true cell: SW.
  - For each group, compute the fraction on SW and the sum of squares of fractions for all cells.
  - Compute payout: 20 + 20 * [ 2*(fraction_SW) - (fraction_NW^2 + fraction_SW^2 + fraction_NE^2 + fraction_SE^2) ]
  - Announce scores and hand out candy accordingly (if using).

  **Debrief (35-50 min):**
  - Show the distributions:
     Group 1: [their distribution]
     Group 2: [theirs]
     Group 3: [theirs]
     Group 4: [theirs]

  - Ask: 
     - "Why do Group 1 and Group 2 have the same distribution? What's similar about their protocols?" 
          [Expected: both protocols have the operator sending the message when the conditional is true, so the set of cells where the message is sent is the same: NW, SW, SE.]
     - "Why is Group 3 different? What did their protocol say?" 
          [They were told the message is sent only in the south row, so they ruled out NW and NE, leaving SW and SE.]
     - "Group 4 has a little bit on NE? Why?" 
          [Because of the noise: even in NE, there's a 10% chance the message was sent.]

  - Highlight the parallel:
     - "In our systems, when we see a log line, we often jump to a conclusion. But the same log line can mean different things depending on the code that produced it. Just like the same message from the operator meant different things depending on the protocol. And if there's noise (like a flaky network or a bug), it might be produced in unexpected circumstances."

  - If during the session someone said: "Wait, Group 1 and Group 2 are the same!" then highlight that moment: "Remember when X said that? That's because they realized the underlying event is the same. But in Group 3, the event is different: the message is sent in fewer cells."

  - If someone insisted that the conditional message just rules out NE (the negation of the conjunction), then that matches Group 1 and 2, but not Group 3. So we say: "But Group 3's protocol shows that the same message can rule out more cells."

  - Finally, the takeaway: "The message alone doesn't tell you the whole story. You need to know the protocol: what would have been logged in other situations."

  **What could go wrong:**
     - Groups might not update correctly: especially the noisy group. Facilitator can help by asking guiding questions without giving the answer.
     - Someone might treat it as a logic puzzle and ignore the protocol. Emphasize: "Remember, your codebook is your guide to what the operator does in each cell."
     - Scoring rule might be confusing. We can skip the actual candy and just discuss the distributions.
     - "Which group is right?" -> Answer: "They are all right according to their protocols. In a real system, the protocol is what matters. If you don't know the protocol, you can't be sure."

  **What the game cannot show:**
     - In real philosophical problems, the protocol isn't given. The Judy Benjamin problem leaves the protocol ambiguous, and that's why there's disagreement. We avoided that by specifying the protocol. In real life, we often have to infer or assume the protocol, and that's where mistakes happen.

  **Skipping the belief variant.**
answer: |-
  Here’s a streamlined 50-minute design focused on the core insight: **the same message means different things depending on what *would have* been said in other scenarios.** The re-skin: A lost warehouse drone radios for help, and operators send conditional messages based on predefined protocols. Groups update beliefs using protocols, not just the message.

  ---

  ### **Session Flow: "Lost Drone, Conditional Logs"**
  **Total: 50 minutes**  
  *(Groups: 3–4 people each; 3–4 groups total)*  

  ---

  #### **Phase 1: Setup (5 min)**  
  **Facilitator Script:**  
  *“We’re a warehouse ops team. A drone is lost in a 2x2 grid: North/South rows, East/West halves. Cells: NW, NE, SW, SE.  
  The drone radios home and gets one message:  
  **‘If you’re in East, then you’re in South.’**  
  We don’t know where it is. Each team has a ‘protocol’—a spec for what the operator *would have said* in each cell. Distribute 20 chips across cells to bet on your belief. Scoring: Later, we’ll reveal the true cell. Your payout depends on how many chips you placed there, but the formula rewards honest confidence.”*  

  - **Grid Visual:**  
    ```
    North: [ NW ] [ NE ]  
    South: [ SW ] [ SE ]  
    ```

  ---

  #### **Phase 2: Group Work (25 min)**  
  Hand each group a **protocol sheet** and chips. **True cell: SW** (unknown to groups). All protocols send the *same message* in SW.  

  | Group | Protocol Description                                                                 | Key Update Math (Sanity-Check)                                                                                   |
  |-------|--------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|
  | **A** | Operator sends the conditional **only if true**.<br>*(Sent in: NW, SW, SE)*          | Rules out NE. Posterior: NW 1/3, SW 1/3, SE 1/3. Chips: ~7 each.                                                |
  | **B** | Operator sends **"South"** (no conditional) if in South row.<br>*(Sent in: SW, SE)*  | Rules out NW/NE. Posterior: SW 1/2, SE 1/2. Chips: 10 on SW, 10 on SE.                                          |
  | **C** | Operator sends conditional **only if in South row**.<br>*(Sent in: SW, SE)*          | *Same as B?* Groups may split NW/NE chips between SW/SE (wrong) or notice it’s identical to B.                  |
  | **D** | Noisy channel: 10% chance operator sends **random cell’s message**.                 | Bayes’ update. Likelihoods: P(msg\|NW,SW,SE) = 0.9, P(msg\|NE) = 0.1. Posterior: NW/SW/SE ≈32% each, NE ≈4%.   |

  **Facilitator Instructions:**  
  - **Do:** “Use your protocol to update. How? If the message was sent in a cell, that cell is possible. If not, rule it out.”  
  - **Don’t:** Explain Bayes, philosophy, or “correct” answers. If groups ask: “What would your operator say in NE? In NW?”  
  - **Anticipate:**  
    - Group C may conflate protocol with literal message (e.g., rule out only NE).  
    - Noise Group D may ignore noise or average likelihoods.  
    - Someone in Group C/B may say: “Wait, our protocols are identical!”  

  ---

  #### **Phase 3: Betting & Scoring (10 min)**  
  - Groups distribute 20 chips. Reveal true cell: **SW**.  
  - **Scoring Rule (Simple):**  
    *“Payout = (Chips on SW) × (20 / Total chips on SW).”*  
    Example: If you put 10 chips on SW, payout = 10 × (20/10) = 20 candies.  
    - **Why it works:** Incentive to put more chips where you’re confident. Max payout if all-in on truth (40 candies), honest credence maximizes *expected* candy.  

  **Facilitator Script:**  
  *“True cell is SW. Calculate your payout: Chips on SW times (20 divided by your chips on SW). Write it down.”*  

  ---

  #### **Phase 4: Debrief (10 min)**  
  **Facilitator Script:**  
  1. **Show Results:**  
     - Post group distributions (e.g., “Group A: 7 NW, 7 SW, 6 SE, 0 NE”).  
     - Highlight differences: “Same message, but Group A/B vs. Group C have different beliefs. Group D even kept NE.”  
  2. **Map Moments to Insights:**  
     - **Group C vs. B:** “When Group C said ‘our protocol is just Group B’s!’, that’s the discovery: The conditional isn’t ‘new facts’—it’s a *signal* generated by a process. Change the process, and the signal means something else.”  
     - **Noise Group D:** “Your NE chips? That’s the noise. Real logs are like this: A message doesn’t mean ‘X is true’—it means ‘this code path ran’, and bugs are noise.”  
     - **Literal-Message Trap:** “If you only heard ‘if East then South’ and ruled out NE, you ignored the protocol. Like reading a log line without knowing what else could’ve been logged.”  
  3. **The Honest Answer:**  
     - When asked *“Which group is right?”*:  
       *“All are ‘right’—they followed their protocols. But in a real system, if you assume the wrong protocol, you’re wrong. The lesson: Messages don’t speak for themselves. You need the spec.”*  

  ---

  #### **What Will Go Wrong (And How to Handle It)**  
  - **“This is a logic puzzle!”**: Redirect: “Forget logic—what would your operator say in NW? What about NE?”  
  - **Spiteful uniform betting**: Low payout (e.g., 5 on SW → 5 × (20/5) = 20). Shows honesty pays more.  
  - **Noise group ignores noise**: Their posterior ≈ Group A (NW/SW/SE at 33%). Point out: “You assumed no noise. What if you accounted for 10% error?”  
  - **Gaming scoring**: Hard—rule encourages honesty. If caught: “Did gaming beat Group B’s 40-candy all-in?”  
  - **“But what’s the *right* update?”**: Double down: “It depends on the protocol. If you don’t know the protocol, you can’t know.”  

  ---

  #### **What the Game Can’t Show**  
  *“We assumed we knew the exact protocol. In reality, protocols are often ambiguous or unknown—like code you didn’t write. That’s where the deepest disputes happen. Philosophers debate it; we mitigate it with better logging specs.”*  

  ---

  ### **Optional 5-Minute Variant: Beliefs About Beliefs**  
  **Scenario:** Operator says: *“After this message, you’ll be >60% sure you’re in West.”*  
  - **Protocol:** Operator sends this only if it’s true *after* you update.  
  - **Execution:**  
    - Groups realize it’s self-referential.  
    - Key insight: The message constrains their *posterior* (e.g., “I must assign >12 chips to West”).  
    - Update: Reallocate chips to satisfy P(West) > 60% *and* match their protocol.  
  - **Why include?** It works—it forces groups to see protocols apply to meta-beliefs (like logs about system state).  
  - **Risk:** May overcomplicate. Only use if groups finish early.  

  ---

  ### **Materials**  
  - **Grid sheets** (one per group).  
  - **Chips/pennies** (20 per group).  
  - **Protocol sheets** (one per group):  
    ```plaintext
    GROUP A: "Operator sends 'If East then South' ONLY if that statement is true."  
      NW: true → send   | NE: false → no send  
      SW: true → send   | SE: true → send  

    GROUP B: "Operator sends 'South' (no conditional) ONLY if drone is in South row."  
      NW: false → no send | NE: false → no send  
      SW: true → send     | SE: true → send  

    GROUP C: "Operator sends 'If East then South' ONLY if drone is in South row."  
      NW: false → no send | NE: false → no send  
      SW: true → send     | SE: true → send  

    GROUP D: "Operator ALWAYS sends the true conditional, but radio has 10% noise.  
      If noise, sends RANDOM cell's true message. You received 'If East then South'."  
      [Likelihoods: P(msg|NW,SW,SE)=0.9, P(msg|NE)=0.1]  
    ```  
  - **Scoring cheat sheet** (for facilitator).  

  ---
  This design forces the insight through divergent group results, minimizes jargon, and ties cleanly to logging. Run it as-is—the chaos is part of the lesson!
