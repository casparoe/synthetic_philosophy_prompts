  - **Case 1/3/4 (future/spatial/event-based switch):** Active from Branch 2 onward.  
  - **Case 2 (past switch):** Resolved at Branch 1 (evidence splits).  
  - **Case 5 (physics-backed):** Resolved at Branch 2 (background knowledge).  
