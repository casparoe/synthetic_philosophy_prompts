  - **Case 7 (meta-induction):** Addressed in Leaf 1 (deflationary) as insufficient for the riddle.  

  ### **Tree Structure Summary**  
  - **7 questions** → **8 leaves** (6 occupied, 2 unoccupied).  
  - **Non-separable pairs:**  
    - *Entrenchment (L3) & Simplicity (L4):* Tree separates them, but in practice, they often overlap (entrenchment implies simplicity).  
    - *Natural Kinds (L5) & Reliabilism (L6):* Tree separates, but externalists may blend both (reliability tracks natural kinds).  

