answer: |-
  Below is a complete design for your 75-minute session, optimized for experiential learning about costly signaling without using the term "handicap" until debrief. The game addresses your three target mistakes, incorporates both transfer and "tell" variants, and uses raffle tickets as harmless stakes.

  ---

  ### **Game Title**: Signal Quest  
  **Core Mechanics**: Hidden-type signaling game with escalating stakes, repeated play, and variant rules.  
  **Stakes**: Raffle tickets (1 ticket = 1 entry for a prize, e.g., bookstore gift card). Losing tickets trigger a 5-minute transcription task (e.g., copying a dense philosophy paragraph).  

  ---

  ### **Materials**  
  - **Deck of cards**: Assign types:  
    - Hearts/Diamonds = **High type** (H)  
    - Spades/Clubs = **Low type** (L)  
  - **Index cards**: For signaling decisions.  
  - **Tokens**: 200+ identical tokens (poker chips, beads, or paper clips).  
  - **Scoreboards**: Two posters:  
    - **"Signaller Payoffs"** (Table 1)  
    - **"Receiver Payoffs"** (Table 2)  
  - **Timer**: For rounds and debrief.  

  ---

  ### **Payoff Tables**  
  *(Visible throughout the game)*  

  **Table 1: Signaller Payoffs**  
  | Outcome       | High Type (H) | Low Type (L) |  
  |---------------|---------------|--------------|  
  | Accepted      | 25 - *Cost*   | 15 - *Cost*  |  
  | Rejected      | 0 - *Cost*    | 0 - *Cost*   |  

  **Table 2: Receiver Payoffs**  
  | Phase       | Accept H | Accept L | Reject |  
  |-------------|----------|----------|--------|  
  | 1–2 (Waste) | +10      | +0       | +0     |  
  | 3 (Transfer)| +10      | **-10**  | +0     |  
  | 4 (Tell)    | +10      | +0       | +0     |  

  **Notes**:  
  - **Cost**: Tokens *burned* (Phases 1–2,4) or *transferred* (Phase 3).  
  - **Transfer variant**: Receiver gains tokens spent by signaller.  
  - **Stakes**: 1 token = 1 raffle ticket. 40+ tokens avoid transcription task.  

  ---

  ### **Game Phases & Timeline**  
  **Total: 75 minutes**  

  #### **Phase 0: Setup (5 min)**  
  - Split into 10 pairs (Signaller + Receiver).  
  - Explain:  
    - Goal: Maximize raffle tickets.  
    - Types: H (red suits) / L (black suits), drawn secretly each round.  
    - Rounds: 1 minute each. Random re-pairing after each round.  
  - Show payoff tables.  

  #### **Phase 1: Cheap Talk (10 min | 5 rounds)**  
  - **Rules**:  
    - Signaller draws card (type hidden).  
    - **Signal**: Write any message (e.g., "I am H!") on index card. *No token cost*.  
    - Receiver sees message → Accept/Reject.  
  - **Predictable collapse**:  
    - Round 1–2: Most signallers claim "H"; receivers often accept.  
    - Round 3–5: Receivers reject indiscriminately (messages become noise).  
  - **Debrief hook**: *"Why did messages stop working?"*  

  #### **Phase 2: Costly Signaling - Waste (20 min | 7 rounds)**  
  - **Rules**:  
    - Signaller chooses **signal cost** (0–20 tokens, *burned*).  
    - Receiver sees cost → Accept/Reject.  
  - **Key incentives**:  
    - H gains more from acceptance (25 vs. L’s 15) → Can afford higher costs.  
    - Separation point: H signals 11–15; L signals 0–5.  
  - **Predictable discoveries**:  
    - Early rounds: High bluffing (L mimics H).  
    - Mid-late rounds: Receivers demand higher costs; H/L separate at **cost=10**.  
  - **Debrief hook**: *"How did costs change behavior? Why did separation happen?"*  

  #### **Phase 3: Transfer Variant (20 min | 7 rounds)**  
  - **Rule change**: Tokens spent go to the *receiver* (no waste).  
  - **Receiver incentives**: Accepting L now **penalized** (-10).  
  - **Predictable outcomes**:  
    - **Mistake #2 test**: Honesty persists (H: cost=12–18; L: cost=0–5).  
    - **Divergence**: Receivers reject low-cost signals faster (avoid -10 penalty).  
  - **Debrief hook**: *"Did honesty survive without waste? What replaced it?"*  

  #### **Phase 4: The "Tell" (5 min | 1 round)**  
  - **Rule change**: Signal cost fixed by type (H: 10 tokens; L: 0 tokens).  
  - **No choice**: Signallers *must* pay fixed cost.  
  - **Outcome**: Perfect honesty (H always accepted; L always rejected).  
  - **Debrief hook**: *"Why did this work without strategy?"*  

  ---

  ### **Debrief (15 min)**  
  Map game moments to key concepts:  

  | **Game Moment**               | **Concept**                                  | **Mistake Addressed**                     |  
  |-------------------------------|----------------------------------------------|-------------------------------------------|  
  | Phase 1 collapse              | Cheap talk → Noise without cost              | N/A (Baseline)                            |  
  | Phase 2 separation            | Differential cost enables honesty            | #1 (Cost ≠ truth; differential matters)   |  
  | Phase 3 honesty with transfer | Waste unnecessary; cost structure drives it  | #2 (Waste is a byproduct)                 |  
  | Phase 2 bluffing early rounds | Honesty not guaranteed; equilibrium-dependent| #3 (Bluffing is possible)                 |  
  | Phase 4 "tell"                | Fixed signals ≠ costly signaling             | N/A (Highlights alternate mechanisms)     |  

  **Key Takeaways**:  
  1. Signals are honest because costs *differentially burden types* (H benefits more from acceptance).  
  2. Waste is a side effect; transfer shows differential costs do the work.  
  3. Costly signaling enables honesty *only if* incentives align (bluffing equilibria exist).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Variable risk aversion**:  
     - *Problem*: Students who hate transcription tasks under-bluff (L) or over-spend (H).  
     - *Fix*: Emphasize "tokens are proportional to effort," not absolute value. Use raffle tickets to dilute stakes.  

  2. **Reputation across rounds**:  
     - *Problem*: Players infer patterns from past partners (e.g., "Alice always bluffs!").  
     - *Fix*: Enforce random re-pairing and anonymous decisions (submit index cards to you).  

  3. **Transfer phase confusion**:  
     - *Problem*: Receivers miss the -10 penalty for accepting L.  
     - *Fix*: Highlight Table 2 with **bold text** and verbally reinforce: *"Accepting L COSTS you 10 tokens!"*  

  4. **"Tell" phase oversimplification**:  
     - *Problem*: Students assume fixed signals are "costly signaling."  
     - *Fix*: During debrief, contrast strategic choice (Phases 2–3) vs. mechanical constraint (Phase 4).  

  ---

  ### **What the Game Cannot Simulate**  
  Your intuition is correct. The game cannot replicate:  
  1. **Evolutionary dynamics**: Biological signals emerge from selection over generations, not rational choice. Players reason explicitly; genes don’t.  
  2. **Imperfect honesty**: Real signals are honest *on average* (some bluffing persists). The game’s strict payoffs force perfect separation.  
  3. **Common knowledge gaps**: Players see payoff tables; animals don’t "know" fitness trade-offs.  

  **Mitigation**: Briefly note these in debrief:  
  > *"In nature, this isn’t a game—it’s evolution. Organisms don’t calculate payoffs; selection favors traits that *on average* boost survival. Bluffers might occasionally thrive, but costly signals stabilize when honesty wins more often."*  

  ---

  ### **Why This Works**  
  - **Self-discovery**: Players *feel* why differential costs (not waste) matter via transfer variant.  
  - **Mistake prevention**: Bluffing in early rounds shows honesty isn’t guaranteed; "tell" highlights non-strategic honesty.  
  - **Low overhead**: Uses cheap materials, no tech, and raffle tickets incentivize engagement without ethical issues.  

  Adapt as needed, and enjoy teaching!
