answer: |-
  ### Procedure: "Do They Really Want X?" Checklist  
  **Run these in order. Stop at any "Hard Stop" and reject the claim. Judgment calls require team discussion.**  

  | # | Question                                                                 | Pass                                                                 | Fail                                                                                                | Hard Stop?                                                               | Judgment Call?                                                                 |
  |---|--------------------------------------------------------------------------|----------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------|--------------------------------------------------------------------------------|
  | 1 | **Is X *available*, *visible*, and *non-broken* for all users?**         | X is live, un-gated, discoverable (e.g., in main UI), and has no critical bugs. | X is hidden, gated (like old UI), buggy, or has a simpler alternative.                              | Yes (if unavailable/broken). Reason: Behavior might be forced, not wanted. | Defining "discoverable" or "critical bug" is subjective.                         |
  | 2 | **Is the behavior *unambiguous*?**                                       | Model infers one clear goal (high confidence), or clicks require deliberate intent (e.g., typing). | Model shows >1 goal fits the actions, or clicks are passive/accidental (e.g., misclicks).           | Yes (if ambiguous). Reason: Data doesn’t pin down a single goal.            | Assessing model confidence (if no score provided) or "deliberate intent" is fuzzy. |
  | 3 | **Is the behavior *repeated* and *current*?**                            | ≥10% of users do it ≥3 times in the last 30 days.                   | Rare (<5% users), one-off, or stale (>60 days old).                                                 | Yes (if stale/rare). Reason: Likely habit or noise, not active preference. | Thresholds (10%, 3 times) are arbitrary—adjust based on context.               |
  | 4 | **Is there *no avoidance trigger*?**                                     | No negative stimulus (e.g., banners, errors, slowness) precedes X. | X occurs after annoyances (e.g., closing a popup, post-error).                                      | Yes (if triggered by avoidance). Reason: Users want relief, not X.         | Linking behavior to a stimulus is factual; calling it "negative" is judgment.    |
  | 5 | **Do users *choose X despite alternatives*?**                            | Users actively bypass comparable options to use X.                  | X is the only path, or alternatives are worse/unknown.                                              | No—but weakens claim.                                                    | Defining "comparable alternatives" is subjective.                                |
  | 6 | **Is there *corroborating evidence*?**                                   | Direct feedback (e.g., tickets, surveys) supports wanting X.        | Feedback conflicts with X, or is silent.                                                            | No—but failing here means low confidence.                                | Interpreting feedback (e.g., "users said ‘faster builds’—is that X?") is judgment. |

  **Outcome:**  
  - **All pass**: Claim is plausible (not proven—still could be wrong).  
  - **Any hard stop**: Reject the claim.  
  - **Judgment calls**: Escalate to team/VP.  

  ---

  ### Your Tripping Points, Handled:  
  - **Model ambiguity (multiple goals)**: Q2 fails → Hard stop. *Cheap test*: Ask the data scientist for the top-3 goals that fit the same actions; if >1 is plausible, it’s ambiguous.  
  - **Legacy UI behavior**: Q1 fails (unavailable in new UI) → Hard stop. Old-path usage is likely muscle memory, not preference.  
  - **Nag-banner metric**: Q4 fails (avoidance trigger) → Hard stop. Clicks don’t mean "want X"—they mean "make banner go away."  

  ---

  ### Case Applications:  
  **(a) Advanced search underuse**  
  - Q1: Pass (available but less visible).  
  - Q2: Pass (using it is deliberate).  
  - Q3: Fail (rare usage). **Hard stop**—likely users don’t know or care.  
  - *Verdict*: Reject "users want advanced search."  

  **(b) Power users in screen we planned to delete**  
  - Q1: Pass (available).  
  - Q2: Pass (deliberate navigation).  
  - Q3: Pass (repeated + current).  
  - Q4: Pass (no avoidance trigger).  
  - Q5: Fail (no alternatives? Judgment call).  
  - Q6: ? (Check feedback—if none, weak claim).  
  - *Verdict*: Plausible they want it, but needs feedback (Q6 judgment call).  

  **(c) Nag-banner metric**  
  - Q1: Pass (available).  
  - Q2: Pass (intentional click).  
  - Q3: Pass (repeated).  
  - Q4: **Fail** (avoidance trigger). **Hard stop**—data shows annoyance, not desire.  
  - *Verdict*: Reject "users want X."  

  **"Data cannot tell you this" case**: (a) and (c) fail on unambiguous evidence of intent. (a) fails Q3 (rarity), (c) fails Q4 (avoidance).  

  ---

  ### What This Procedure Can Never Do (For VP Doc):  
  > **Limitations**: This checklist detects red flags—not truth. It cannot:  
  > 1. **Prove causality** (e.g., "X caused metric improvements").  
  > 2. **Capture unexpressed needs** (e.g., "users want Y but never click it").  
  > 3. **Replace experiments** (e.g., A/B tests trump telemetry).  
  > 4. **Override values** (e.g., "power users vs. newbies" is a business call, not data).  
  > 5. **Predict the future** (e.g., "will they want X after we change it?").  
  > **When in doubt: Test or talk to users.**  

  ---  
  **Total words**: ~650. Checklist: 240 words.
