prompt: |-
  Hey — I'm a backend engineer, no philosophy background, and I need something I can actually use. Please skip anything I'd have to look up: if you use a term from economics or ML, define it in one clause, and don't tell me to go read anything, I won't.

  The situation: every two weeks at sprint planning someone says "the data shows users want X" and I either have to back that or push back on it. The data is clickstream and event telemetry from about 4k internal engineers using a build/deploy dashboard my team owns, plus an experimental model one of our data scientists trained that looks at action sequences and guesses what goal a user was optimizing for (given what they did, infer what they wanted). Stakes are real — whatever we conclude decides what gets a quater of engineering time, and the VP of product signs off on it. I've got roughly 20 minutes per decision and my teammates know SQL and not much else.

  What I want: a procedure — ordered questions, six of them max, runnable in that 20 minutes — for deciding whether an observed pattern of behavior actually licenses the claim "these users want X," as opposed to "X was the easiest thing to do," "X was the only thing we made available," "they think they want X but are wrong about what X does," or "that behavior is stale habit and doesn't reflect anyone's current evaluation." For each question: what counts as a passing answer, what counts as a fail, where we stop with a no, and where the question has to be handed to a person because it's a values call and not a fact. Please be explicit about which steps are judgement calls dressed up as procedure.

  Three things I keep tripping over, handle them inside the procedure rather than as asides:

  - The model fits the data great and I have no way to tell whether the goal it inferred is the real one or just one of several that would produce the exact same clicks. Is there a cheap test for whether the data even pins down a single answer, and what do I do when it doesn't?
  - Half our users are still on a two-year-old UI because the rollout is gated, and they keep taking a path that no longer exists in the new one. Is that preference or cached muscle memory, and how do I tell?
  - Our favorite metric — the one I built the pipeline for, so I'm biased — went up 30% after we added a nag banner. I think people are clicking it to make it go away. Where does the procedure put that?

  Then run it on three cases, briefly: (a) almost nobody uses our "advanced search" even though it's strictly more powerful than the default; (b) power users spend 40% of session time in a screen we were about to delete; (c) the nag-banner metric. I want at least one of them to come out as "the data cannot tell you this," and I'd rather you tell me which one then flatter me.

  End with a short section on what this procedure can never do, written so I can paste it at the top of the doc where my VP will actually read it.

  Hard limit: 700 words total for the whole thing, with the checklist itself under 250. Bullets and a table are fine, I don't need prose.
reasoning: |-
  We are building a procedure to evaluate claims of the form "the data shows users want X" based on telemetry and an inference model. The procedure must account for:
  - Whether the behavior reflects actual preference or is due to constraints, habits, or misconceptions.
  - The limitations of the inference model (multiple goals leading to same behavior).
  - Distinguishing between preference and muscle memory in legacy UI users.
  - Differentiating between genuine engagement and avoidance behaviors (like nag banners).

  We design a checklist of up to 6 questions. For each question, we specify:
  - What a passing answer looks like.
  - What a fail looks like.
  - When to stop with a "no" (i.e., the claim is not supported).
  - When it becomes a judgment call.

  We then apply the checklist to three cases and note what the procedure cannot do.

  ---

  **Checklist: "Do They Really Want X?" (Max 6 Steps)**

  1. **Is the observed behavior *available* and *viable* for all relevant users?**
     - *Pass:* The feature/action (X) is available to all users in the segment and there are no known critical bugs blocking its use. Also, there is no simpler or more prominent alternative that would explain the behavior as a fallback.
     - *Fail:* X is unavailable (e.g., gated) for a significant user group, or there's a blocking bug, or there's a clear default/alternative that's easier to access.
     - *Stop if fail?* Yes, because if X isn't available or isn't viable, the behavior can't express preference for X. Move to judgment: if unavailable, we can't infer preference; if it's not viable, we might be seeing workarounds.
     - *Judgment call?* Partially: deciding "viable" requires knowing if bugs/alternatives are severe enough to invalidate the behavior.

  2. **Is the behavior *intentional*?**
     - *Pass:* The action sequence (or model inference) requires deliberate steps (e.g., multiple clicks, text input) that are unlikely to be accidental, or the model's inferred goal has high confidence and low ambiguity (if the model outputs these).
     - *Fail:* The behavior is a single click on a default path, could be accidental, or the model's goal inference has low confidence or high ambiguity (multiple goals explain the same actions).
     - *Stop if fail?* Not necessarily — but if it fails, we proceed cautiously. If the model ambiguity is high (multiple goals fit), we stop and say the data cannot pin down one goal. Otherwise, we note low intentionality as a risk.
     - *Judgment call?* Yes, especially in interpreting model ambiguity. If the model doesn't output confidence/ambiguity, we flag this as a data limitation.

  3. **Is there evidence of *repeated choice*?**
     - *Pass:* The behavior is observed repeatedly by the same users (e.g., at least 3 times per user in the segment) or by a growing number of users over time (not a one-off).
     - *Fail:* The behavior is rare (e.g., <5% of users) or one-time only.
     - *Stop if fail?* No, because novelty or discovery might be in progress. But if rare, we question if it represents a broad "want".
     - *Judgment call?* Setting the threshold for "repeated" or "rare" is a judgment (e.g., 3 times? 5%?).

  4. **Is the behavior *current*?**
     - *Pass:* The behavior is observed in the last 30 days (or a relevant timeframe) and is consistent across UI versions (if applicable).
     - *Fail:* The behavior is only seen in old UI versions, or it dropped off suddenly (e.g., after an update), or it's stale (no occurrences in last 60 days).
     - *Stop if fail?* If the behavior is exclusive to an old UI, we stop and say it may be habit, not current preference. If stale, we stop and say it's not relevant now.
     - *Judgment call?* Timeframe choice (30 vs 60 days) is context-dependent.

  5. **Is the behavior *avoidance-proof*?**
     - *Pass:* The action (X) is not attached to a negative stimulus (e.g., a nag banner, error message) and/or we see secondary positive signals (e.g., usage of related features, low exit rates after X).
     - *Fail:* X is primarily triggered to dismiss an annoyance (like a banner), or occurs right after an error, or leads to quick exits.
     - *Stop if fail?* Yes, because if the behavior is avoidance, it doesn't indicate "wanting X". We conclude: the data shows users want to avoid the annoyance, not that they want X.
     - *Judgment call?* Linking behavior to a stimulus (e.g., banner) is factual, but interpreting "negative stimulus" might involve judgment.

  6. **Does the behavior align with *explicit feedback* or *known alternatives*?**
     - *Pass:* We have recent user feedback (e.g., surveys, support tickets) explicitly asking for X or praising it, or there's evidence users tried and rejected alternatives to X.
     - *Fail:* Feedback complains about X, or users are not using X when it's clearly superior (by objective measures), or alternatives don't exist or weren't tried.
     - *Stop if fail?* No, but it weakens the claim. We might still proceed if other steps pass but note the conflict.
     - *Judgment call?* Interpreting feedback is subjective.

  **Procedure Flow:**
  - Run questions 1-6 in order. 
  - Any "stop if fail" halts the claim for "want X" with a reason. 
  - If you complete all steps without a stop, the claim is plausible (but not proven). 
  - Judgment calls are noted and escalated if needed.

  ---

  **Handling Your Tripping Points:**

  - **Model Ambiguity:** Covered in Q2 (Intentional). If the model doesn't provide confidence/ambiguity scores, we fail Q2 by default and stop if multiple goals fit (we can't tell). *Cheap test:* Ask the data scientist for the top-3 goals that fit the same action sequence; if multiple are plausible, it's ambiguous.
  - **Legacy UI Behavior:** Covered in Q1 (Availability) and Q4 (Current). If the path is gone in the new UI and they are only using it in the old one, Q4 fails — it's likely habit, not preference.
  - **Nag Banner Metric:** Covered in Q5 (Avoidance-proof). If the click is on the banner to dismiss it, Q5 fails — we stop and say it's avoidance, not desire.

  ---

  **Case Applications:**

  **(a) Advanced search underuse:**
  - Q1: Pass (available, but note: default is easier?).
  - Q2: Pass (using advanced search is intentional).
  - Q3: Fail (rare usage). Not a stop, but weak.
  - Q4: Pass (current).
  - Q5: Pass (no avoidance).
  - Q6: Fail (no feedback asking for it; users might not know it's superior). 
  - **Verdict:** Data doesn't show users *want* it — they might not know or care. Without Q3 pass, claim fails.

  **(b) Power users in a screen we planned to delete:**
  - Q1: Pass (available).
  - Q2: Pass (deliberate navigation).
  - Q3: Pass (repeated by power users).
  - Q4: Pass (current).
  - Q5: Pass (no avoidance trigger).
  - Q6: Check feedback — if power users complain about removing it, pass. Else, fail but not stop.
  - **Verdict:** Claim passes if Q6 feedback exists. Else, it's plausible but needs feedback check (judgment call).

  **(c) Nag-banner metric increase:**
  - Q1: Pass (available).
  - Q2: Pass (intentional click).
  - Q3: Pass (repeated).
  - Q4: Pass (current).
  - Q5: **Fail** (clicking to dismiss the banner). Stop: not evidence of wanting X, just avoiding annoyance.
  - **Verdict:** Claim fails at Q5. Data shows annoyance avoidance.

  ---

  **What This Procedure Cannot Do (for your VP):**

  - **Prove causation:** It can't show that a behavior *caused* a positive outcome (e.g., productivity boost).
  - **Read minds:** It infers intent from actions, but cannot capture unexpressed desires or motivations.
  - **Replace experiments:** If the data is ambiguous (e.g., Q2 fails), only an A/B test or user interview can resolve it.
  - **Override values:** Trade-offs (e.g., "power users vs. new users") require human judgment.
  - **Predict the future:** It assesses current behavior, not whether X will be wanted after changes.
  - **Handle novelty:** New features (<30 days) may show false negatives (Q3/Q4).

