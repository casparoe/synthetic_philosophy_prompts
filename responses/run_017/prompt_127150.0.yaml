  *   "This is RIDICULOUS! 'The salt' IS unique on THIS TABLE! I shouldn't need an annex just to ask for it!" - Scrawled in pencil  
  *   "My sentence wasn't FALSE! It just... didn't pick anything out! There IS a gap! You people are dogmatic!" - Taped note fragment  
