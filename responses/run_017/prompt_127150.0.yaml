answer: |-
  **BUREAU OF DENOTING PHRASES**  
  **Form 27-B, Rev. 8**  
  **Application for Leave to Refer via Definite Description**  
  *(Mandatory under the Russell-Whitehead Administrative Code, Title V, §7.1-7.9)*  

  **WARNING:** Failure to fully complete all applicable fields constitutes an Unlicensed Utterance (Class C Misdemeanor). Submission implies attestation under penalty of perjury (§9.4). All fields require quantificational expansion. Do not insert singular terms in Fields 2-4.

  ---

  **SECTION 1: UTTERANCE DECLARATION**  
  1.  **Full Sentence Containing Definite Description(s):**  
      *[Example: "The present King of France is bald."]*  
      _________________________________________________________  
      _________________________________________________________  
      *(Attach separate sheet if necessary. Do not abbreviate.)*

  2.  **Expansion into Canonical Quantificational Form (CQF):**  
      *a) Existence Clause:* "There exists an x such that..."  
      _________________________________________________________  
      *b) Uniqueness Clause:* "...x is uniquely such that..."  
      _________________________________________________________  
      *c) Predication Clause:* "...and x has the property that..."  
      _________________________________________________________  
      *(Field 2c must correspond directly to the predicative content of Field 1. See Instructions Pamphlet 27-B/I: "Avoiding the Singular Term Fallacy").*

  ---

  **SECTION 2: SCOPE AND MODALITY**  
  3.  **Negation Scope (Check ONE only):**  
      ☐ **Narrow Scope (¬φ):** "It is not the case that: [Insert FULL CQF from Section 2 here]."  
      *Example: "It is not the case that: ∃x(Kx ∧ ∀y(Ky→y=x) ∧ Bx)" → False if nothing satisfies K.*  
      ☐ **Wide Scope (∃x(φ(x) ∧ ¬ψ(x))):** "There exists a unique x such that [Insert Uniqueness Clause] and x does not have the property [Specify Property]."  
      *Example: "∃x(Kx ∧ ∀y(Ky→y=x) ∧ ¬Bx)" → True if nothing satisfies K.*  
      *(§7.3: Scope ambiguity constitutes an Incomplete Filing. Resubmit with single box checked.)*

  4.  **Attributive vs. Referential Use (Check ONE only):**  
      ☐ **Attributive:** The description is essential to picking out the intended referent. The truth conditions depend SOLELY on the satisfaction of the descriptive conditions in the CQF. *(Standard Use)*  
      ☐ **Referential:** The description is used merely to indicate a specific, mutually salient object/person, whose identity is known independently of the description's satisfaction.  
      *WARNING (Referential Box):* **§7.5.f.ii:** Referential filings are inadmissible as evidence in criminal proceedings where the defendant's state of mind or identity is material. Truth-value is determined SOLELY by the properties of the indicated object, irrespective of descriptive satisfaction. *Example: Pointing at a defendant clearly insane: "The man who robbed the bank is sane" may be TRUE referentially but FALSE attributively. Prosecution must file attributively.*

  ---

  **SECTION 3: DOMAIN AND SATISFIERS**  
  5.  **Domain of Quantification (Specify explicitly):**  
      *[Example: "Persons currently holding the title 'King of France' as recognized by the 1815 Congress of Vienna"]*  
      _________________________________________________________  
      _________________________________________________________  
      *(§7.4: "All persons", "Everything", or "The Universe" are insufficiently restricted and will trigger Rejection Code 4: Incomplete Description).*

  6.  **Incomplete Description Annex Required?** ☐ Yes ☐ No  
      *If "Yes" checked, you MUST attach Form 27-B/A: Domain Restriction Annex, detailing the contextual parameters restricting the domain to ensure practical uniqueness (e.g., "the table" → *"within the room designated 'Kitchen' at 123 Main St. as of [Date/Time]"*; "the car" → *"registered to applicant, VIN: XXXXXX"*). Failure to attach results in Rejection Code 4. Multiple satisfiers in the declared domain (Field 5) without a valid 27-B/A constitute a False Statement (§9.4).*

  7.  **Plural Definite Description Handling (Check if applicable):**  
      ☐ **Plural Definite ("The Fs are G") Expansion Filed:**  
          *a) Non-Empty Plurality Clause:* "There exist some Xs such that..."  
          *b) Maximality/Exhaustivity Clause:* "...and every one of those Xs is F, and everything that is F is one of those Xs..."  
          *c) Predication Clause:* "...and those Xs are G."  
          *(See Memo BDP-23-451: "Extension to Plurals: Non-Distributive Predicates Require Form 27-B/P Supplement").*

  ---

  **SECTION 4: EXISTENCE VERIFICATION & PENALTIES**  
  8.  **Existence Attestation:** I affirm that, within the declared Domain of Quantification (Field 5), there exists at least one satisfier of the descriptive conditions in the Uniqueness Clause (Field 2b).  
      ☐ **I affirm existence.** *(Proceed to Field 9)*  
      ☐ **I affirm non-existence / emptiness.** *(Proceed to Field 10)*

  9.  **If Existence Affirmed (Field 8):** I further affirm that within the declared domain, there exists exactly one satisfier of the descriptive conditions in the Uniqueness Clause (Field 2b).  
      ☐ **I affirm uniqueness.**

  10. **If Non-Existence Affirmed (Field 8):** I understand that by affirming non-existence, the entire statement (Field 1) is **FALSE** as a matter of law (§7.2). Filing a statement known to contain an empty definite description **IS** filing a false statement, a Class B Misdemeanor (§9.4.a). *Initial here to acknowledge penalty:* _______

  ---

  **SECTION 5: INDEFINITE EXTENSION (Per Memo BDP-23-452)**  
  11. **Indefinite Description ("A/An F is G") Handling (Check if applicable):**  
      ☐ **Indefinite Expansion Filed:**  
          *a) Existence Clause:* "There exists an x such that..."  
          *b) Satisfier Clause:* "...x is F..."  
          *c) Predication Clause:* "...and x is G."  
          *(§7.8: Scope ambiguity for indefinites under negation/modality requires separate Form 27-B/I Scope Rider. "Wide scope" readings may require Existential Import Permit - EI/44).*

  ---

  **SECTION 6: APPLICANT ATTESTATION**  
  *I hereby swear that the information provided on this Form 27-B is complete and accurate to the best of my knowledge and belief. I understand that failure to expand into CQF, misrepresentation of scope, filing an incomplete description without the required Annex, or filing a statement containing an empty definite description knowing it to be empty, constitutes a violation of the Russell-Whitehead Administrative Code and may result in penalties including fines, mandatory semantic retraining, or suspension of denoting privileges.*  
  **Signature:** _________________________ **Date:** __________  
  **Printed Name:** _________________________  
  **Denoting License #:** _________________________  

  **FOR BDP USE ONLY**  
  □ Approved □ Rejected (Code: ____) □ Domain Annex Required □ Scope Rider Required □ Existential Import Permit Required □ Forwarded to Truth-Value Enforcement Division □ Smugness Dispensed Per §7.2.f  

  ---

