  Hmm, this is a complex and detailed request about refugee policy framework design. The user works in a state resettlement agency's policy unit and needs to separate two fundamental questions: who qualifies as a refugee generating duties (the "who counts" question), and which states owe what obligations (the "who owes what" question). 

  The user has clearly encountered conceptual confusion in their drafting process, where arguments about distribution of responsibilities are being disguised as debates about eligibility criteria. They need a rigorous specification of desiderata for each question, grounded in operational reality rather than ideal theory. 

  Key operational constraints stand out: the framework must be administrable by caseworkers (decidable with asymmetric evidence), defensible to skeptical legislatures, and actionable under conditions of partial compliance where most states shirk responsibilities. Robustness against strategic state behavior is crucial - we can't reward states for making themselves inaccessible or degrading reception capacity.

  The cases provided are particularly challenging by design: climate displacement without persecutors, denationalized dissidents, composite causation scenarios, and protracted situations where "temporary" protection becomes permanent. Each probes specific conceptual boundaries the framework must address, like the distinction between owing admission to an individual versus contributing to a global burden-sharing system.

  I notice several potential tensions in the desiderata. The user's own candidate for joint unsatisfiability - requiring every refugee to have a duty-bearing state, while tying duties strictly to causal responsibility - creates a logical impasse when only the persecutor is responsible. Other problematic combinations emerge, like demanding both precise causal attribution for composite flows and individual state duties - an epistemological impossibility given information constraints.

  The neutrality requirements deserve careful scrutiny. While impartiality between claimants is operationally essential, demands for causal responsibility tracking or strict consent-based admission seem like ideological positions masquerading as constraints. The exclusionary power of the "no unallocated status bearers" requirement is particularly notable - it forces frameworks to either assign duties widely or exclude many from protection.

  When evaluating common approaches, capacity-based systems fail the strategic behavior test (rewarding capacity destruction), while causal responsibility models stumble on administrability and the persecutor paradox. Proximity principles conflict with burden-sharing needs, and market mechanisms risk commodifying protection. The fair-share approach shows promise but requires careful handling of the "duty to whom" question.

  Throughout, I maintain focus on the user's operational purpose: creating a tool for decision-makers, not philosophers. The framework must function in messy reality where evidence is patchy, states game systems, and resources are scarce. Any element that can't survive contact with these realities must yield to what's workably just under non-ideal conditions.
answer: |-
  Your request demands precision in disentangling two questions that persistently blur in refugee policy discourse: the eligibility question ("who counts") and the duty-allocation question ("who owes what"). The operational purpose – usability for caseworkers, defensibility to legislatures and other states, and actionability under partial compliance – imposes severe constraints that disqualify many philosophically appealing but operationally inert accounts. Let me first brainstorm candidate desiderata, cutting those that are disguised conclusions.

  **Brainstorming Desiderata (and Cuts):**

  For **"Who Counts?"**, candidates include: (1) Alignment with binding legal instruments (1951 Convention, 1967 Protocol, relevant regional definitions); (2) Coherence across triggering harms (persecution, public disorder, other serious harm); (3) Decidability based on evidence available at decision time; (4) Independence from speculative counterfactuals (e.g., "what if the state *could* have protected?" without evidence); (5) Handling non-state actors regardless of state willingness/ability; (6) Handling slow-onset harms without a persecutor or datable event; (7) Handling pre-emptive flight based on credible threat; (8) Avoiding reliance on unknowable causal chains; (9) Distinction between harm *causing* flight and harm *justifying* protection. I cut demands that "status must imply a duty-bearer exists" (disguised conclusion about duty-allocation) and "must exclude economic migrants" (too vague, disguises definitional choices).

  For **"Who Owes What?"**, candidates include: (1) Specifying *who* owes *what* to *whom* (individual duty or collective share?); (2) Robustness against strategic state behaviour (capacity destruction, offshoring, deflection); (3) Actionability under partial compliance (what duty remains when others default?); (4) Avoiding perverse incentives (rewarding inaccessibility, first-mover advantage); (5) Decidability without requiring impossible calculations (causal shares); (6) Handling the difference between owing admission *to this individual* vs. contributing to *a global solution*; (7) Clarifying whether duties pertain to admission, protection elsewhere, or both; (8) Addressing the temporal dimension (when does temporary protection become permanent?); (9) Reconciling with state sovereignty/consent claims. I cut "duties must track causal responsibility" (often a disguised conclusion, administratively impossible for composite flows), "duties must require consent" (disguised sovereignty claim), and "no admission without consent" (disguised conclusion negating duties).

  **Specification of Desiderata:**

  **I. Desiderata for "Who Counts?" (Eligibility):**
  1.  **Legally Anchored Trigger:** *Requirement:* Define the class by reference to the *type of harm or threat* triggering protection needs, incorporating the core 1951 grounds (persecution on specific bases) *and* the recognized expansions (events seriously disturbing public order). *Case Basis:* The Cartagena/OAU cases demand inclusion beyond strict persecution. *Non-negotiable:* Yes, for defensibility to other states and under international law.
  2.  **Harm-Centric, Agent-Neutral:** *Requirement:* Focus on the *nature and severity of the harm feared/suffered* and the *absence of available protection*, not solely the identity or capabilities of the persecuting agent. *Case Basis:* The cartel/militia cases (state unable/unwilling) and slow-onset climate case (no persecutor) probe this. The harm (denial of core rights, existential threat) defines need, regardless of perpetrator. *Non-negotiable:* Yes, operational necessity to cover real-world scenarios.
  3.  **Evidentiary Decidability:** *Requirement:* Eligibility must be assessable based on evidence reasonably obtainable by the applicant and verifiable by the adjudicator *at the time of decision*. Cannot require proving counterfactuals (e.g., precise state capabilities absent evidence) or inaccessible evidence (e.g., internal documents of threatening authority). *Case Basis:* Pre-emptive flight case (threat evidence held by persecutor), non-state actor cases (verifying state inability). *Non-negotiable:* Absolutely core to caseworker usability.
  4.  **Forward-Looking Assessment:** *Requirement:* Assessment based on risk *going forward*, considering past events as evidence, not solely past harm. *Case Basis:* Pre-emptive flight case. *Non-negotiable:* Yes, aligns with refugee definition's "well-founded fear".
  5.  **Causation Agnosticism:** *Requirement:* Eligibility determined by *current need for international protection due to the triggering harm*, not by assigning blame or calculating precise causal chains for *why* the harm occurred or flight happened. *Case Basis:* Composite causation flow, slow-onset climate case. *Non-negotiable:* Yes, administrability forbids impossible causal attribution.
  6.  **Distinct from Duty Allocation:** *Requirement:* The definition of "who counts" *must not presuppose or be contingent upon* the identification of a specific state duty-bearer. Status arises from need, not from assignment of responsibility. *Case Basis:* All cases, especially the denationalized dissident (no state of nationality) and the persecutor paradox (if persecutor is the only 'responsible' agent). *Non-negotiable:* Essential for prising the questions apart. *What it excludes:* Any account that makes status conditional on finding a responsible state.

  **II. Desiderata for "Who Owes What?" (Duty Allocation):**
  1.  **Bearer Specificity:** *Requirement:* Clearly identify *which entity* (which state, or collective mechanism) bears *which obligation* (admission? resourcing protection elsewhere? funding?). *Case Basis:* Offshoring, funding camps, onward transfer cases probe ambiguity. *Non-negotiable:* Yes, for defensibility and actionability ("who must do what?").
  2.  **Robustness to Strategic Non-Compliance:** *Requirement:* The allocation mechanism must not reward states for: (a) Making themselves inaccessible (closing land routes); (b) Degrading reception capacity; (c) Acting first to deflect responsibility (offshoring, pushbacks); (d) Free-riding on others. Must define duties *even when others default*. *Case Basis:* Rich state closing routes, offshoring, deflection to third country. *Non-negotiable:* Absolutely critical for actionability in the real world of partial compliance.
  3.  **Partial Compliance Actionability:** *Requirement:* Define what a duty *becomes* when other duty-bearing agents fail to act. Does it expand for compliers? Shift elsewhere? Lapse? Cannot simply assume full compliance or collapse. *Case Basis:* The structural fact of uneven hosting (majority in low-income adjacent states). *Non-negotiable:* Yes, operational reality.
  4.  **Distinction: Individual Claim vs. Global Share:** *Requirement:* Clearly separate (a) Does State X owe admission *to Individual Y* such that Y has a claim against X? from (b) Does State X owe a *contribution* (financial, resettlement slots) to a *global or regional protection effort*, the success of which discharges its duty, regardless of which individuals benefit? *Case Basis:* The outsourcing cases (funding camps ≠ owing admission to camp residents), the fair-share vs. individual right debates in the office. *Non-negotiable:* Yes, fundamental to clarifying arguments and designing mechanisms.
  5.  **Temporal Coherence:** *Requirement:* Address how the *stringency or nature* of a duty (e.g., "temporary protection") changes when the conditions justifying it (e.g., non-returnability) persist indefinitely. *Case Basis:* Protracted situations (15+ years). *Non-negotiable:* Yes, for sustainable and humane policy.
  6.  **Operational Decidability:** *Requirement:* Duty allocation criteria must be assessable with available data. Cannot require calculating unattainable metrics (precise causal shares, "fair" global shares without agreement). *Case Basis:* Composite causation flow. *Non-negotiable:* Yes, mirroring the eligibility constraint.
  7.  **Non-Exclusivity of Causal/Historical Responsibility:** *Requirement:* While causal/historical responsibility *may* be *a* factor, it cannot be the *sole* or *necessary* basis for assigning duties, as this fails administratively (composite flows) and morally (persecutor paradox, uninvolved states needing to step in). *Case Basis:* Persecutor paradox, composite flows, the many displaced hosted by states with little causal responsibility. *Non-negotiable:* Yes, for robustness and avoiding the persecutor impasse. *What it excludes:* Purely causal/historical responsibility models.
  8.  **Distinct from State Benefit:** *Requirement:* The duty to protect is conceptually distinct from a state's interest in retaining or regaining population. *Case Basis:* Post-conflict state wanting skilled citizens back. *Non-negotiable:* Yes, to prevent instrumentalization. *What it excludes:* Models making protection contingent on state benefit.

  **Rulings on Candidate Constraints:**
  *   **Non-Negotiable (as argued):** Administrability, Robustness to Strategic Behaviour, Partial Compliance Actionability.
  *   **Demote from Constraint to Contestable Factor/Principle:**
      *   *Track Causal/Historical Responsibility:* Desideratum 7 above shows it cannot be a *constraint*; it can be *a* factor in *some* accounts, but demanding it universally is a conclusion. *Reason:* Administratively impossible (composite flows), leads to persecutor paradox, ignores capacity/proximity realities.
      *   *State's Right to Determine Membership (Absolute Consent):* Cannot be an absolute constraint negating duties; sovereignty is bounded by international obligations. *Reason:* Required for defensibility *to* other states and under international law (non-refoulement), actionability. Consent matters in *how* duties are fulfilled (e.g., resettlement vs. asylum), not *if* duties exist.
      *   *Impartiality Between Unconnected Claimants:* Desirable principle, but not an absolute constraint; special ties (family links) can *supplement* duties without violating impartiality for core protection. *Reason:* Practical protection needs and family unity support it.
      *   *Neutrality WRT Religion/Ethnicity:* Core constraint for *eligibility assessment* ("who counts"), but less directly a constraint on *duty allocation mechanisms* between states, provided the mechanism doesn't cause discrimination *in provision*. *Reason:* Non-discrimination is fundamental to "who counts" (1951 grounds) and fair treatment, but duty allocation focuses on states, not individual claimant characteristics.
      *   *Conditional on Usefulness:* Must be rejected as a constraint. *Reason:* Violates core refugee principle; protection based on need, not utility. The post-conflict case highlights this distinction.

  **Joint Unsatisfiability and Exclusion:**

  1.  **Your Candidate:** Require (A) Every status holder has *some* state owing *them admission* (individual duty); (B) Duty tracks causal responsibility; (C) No causal involvement, no duty. **Unsatisfiable** with the denationalized dissident or where persecutor is sole causal agent. *Least Costly to Give Up:* (A) is least costly *for your operational purpose*. Insisting every individual has a claim *against a specific state* is incompatible with partial compliance and robust burden-sharing. Shifting to a model where states owe *contributions to a protection system* (discharging duty collectively) is more actionable and avoids the paradox. Giving up (B) is also possible but less aligned with intuitions of fairness; giving up (C) is essential (the uninvolved *must* bear duties).
  2.  **Other Unsatisfiable Subset:** (D) Duties must be allocated based on objectively measurable, agreed criteria (e.g., GDP, population); (E) Allocation must be dynamically responsive to sudden large flows; (F) Allocation must be decided unanimously/by consensus among states. **Unsatisfiable:** (D) & (E) require rapid adjustment, but (F) creates gridlock preventing responsiveness. *Least Costly to Give Up:* (F) for operational purposes. Actionability under partial compliance requires mechanisms that can function without universal consensus (e.g., coalition-based responses).
  3.  **Highly Exclusionary Requirement:** "**Every person qualifying under the 'who counts' criteria must have a claim to admission *against a specific, identifiable state*, such that refusal by that state constitutes a direct wrong *to them*.**" This excludes:
      *   Fair-share models (duty is to contribute to a system, not admit specific individuals).
      *   Proximity models (if the proximate state refuses, no other state *owes that individual* admission).
      *   Capacity models (capacity doesn't specify *which* individuals a state owes).
      *   Market models (trading quotas severs the individual claim).
      *   **Theorem:** Any account satisfying this requirement must concede that duty allocation is fundamentally about assigning individuals *to states* as claimants, akin to a global assignment system, and must resolve the persecutor paradox (likely by assigning duties widely or arbitrarily).

  **Scorecard on Account Families (Brief):**

  *   **Capacity-Based:** Fails Robustness (rewards capacity destruction), Partial Compliance Actionability (if high-capacity states defect, system collapses). May struggle with Bearer Specificity (capacity for whom?).
  *   **Causal/Historical Responsibility-Based:** Fails Operational Decidability (composite flows), Administrability for caseworkers (not their role), creates Persecutor Paradox. Robustness weak (states can deny responsibility).
  *   **Proximity/First-Asylum:** Fails Partial Compliance Actionability (overwhelms adjacent states), Robustness (deflection rewards first-asylum states for refusal). Conflicts with Burden-Sharing principle implicit in defensibility to other states. Bears temporal incoherence (protracted situations).
  *   **Associative/Special-Ties:** Useful supplementary factor, fails as *primary* basis – cannot cover claimants without ties, violates impartiality if primary. Administrable for those with ties.
  *   **Fair-Share/Global-Distribution:** Most promising on Partial Compliance Actionability and Robustness (duties defined independently of others' actions, contributions can be claimed). Needs clear metrics (demoting "objective measure" from constraint to aspiration). Handles "duty as contribution" well. Key challenge: Defensibility of the chosen "fair share" formula to legislatures and translating shares into *action* for individuals (the individual claim problem).
  *   **Consent/Self-Determination Based:** Fails core operational need – cannot ground duties if consent is absolute constraint. Sovereignty defines *how* duties are met, not *if* they exist. Undermines Robustness (states consent to avoid duties).
  *   **Market/Tradable-Quotas:** Potentially efficient, risks commodification, fails individual claim requirement spectacularly. Defensibility highly questionable ("selling" protection). Robustness unclear (market manipulation?).

  No family satisfies all desiderata perfectly. Fair-share models handle partial compliance and robustness best but require politically fraught share agreements and solve the "duty to whom" question collectively, not individually. Proximity is administrable but operationally unsustainable alone. The exclusionary power of the "individual claim against a state" requirement highlights the fundamental tension between individual rights and state-centric systems under partial compliance. Your guidance must force clarity on this divide: is the duty *to this person* or *to the system protecting people like this*? The cases, especially offshoring, deflection, and the unallocated individual (denationalized), probe this relentlessly. Prioritize frameworks that are actionable when states game the system and neighbours are overwhelmed.
