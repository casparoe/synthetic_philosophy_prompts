answer: |-
  ### Session Design: St. Petersburg Game Exploration  
  **Objective:** Participants confront the divergence between the St. Petersburg game's theoretical expected value and practical valuation through active decision-making, without upfront explanation of the paradox.  
  **Constraints Adhered To:**  
  - No real-money risk (book vouchers only).  
  - Hard ceiling on payouts ($25 per game).  
  - No lecture on expectation/utility/paradox until final 20 minutes.  
  - Pre-generated coin sequences for auditability.  
  - Focus on activity, not coin-tossing mechanics.  

  ---

  ### Materials & Setup  
  1. **Coin Sequences**:  
     - Pre-generate 30 sequences of fair coin tosses (H/T) until first H, using a public tool (e.g., [random.org](https://www.random.org/coins)). Stop sequences at 10+ consecutive T (cap trigger).  
     - Seal each sequence in an envelope labeled "Game 1," "Game 2," etc. (Example: "T, T, H" = 3 tosses → $8 payout).  
     - **Payout Rules**:  
       - Toss 1 (H): **$2**  
       - Toss 2 (TH): **$4**  
       - Toss 3 (TTH): **$8**  
       - Toss 4 (TTTH): **$16**  
       - Toss 5+ (≥4 tails before H): **$25** (cap)  
     - *Budget Impact*: Max payout per game = $25. Total worst-case = $300 (12 games max).  

  2. **Random Price Generator**:  
     - Pre-draw 3 random prices from $0–$25 (uniform distribution) for Round 1. Seal in envelopes labeled "Price A," "Price B," "Price C."  

  3. **Participant Materials**:  
     - Slips for private bids (Round 1).  
     - Whiteboards or paper for group bids (Rounds 2–3).  

  ---

  ### Timeline (90 Minutes)  

  #### **0–10 min: Introduction & Rules**  
  - **Facilitator Script**:  
    > "Today, we’re playing a simple betting game. I’ll sell you a ticket to play. Here’s how it works:  
    > - A coin is tossed until it lands heads.  
    > - You win **$2** if heads on the first toss, **$4** on the second, **$8** on the third, **$16** on the fourth, or **$25** if it takes five tosses or more.  
    > - We’ve pre-generated coin-toss sequences in these envelopes—you can audit them later.  
    > - We’ll do three rounds. In Round 1, you’ll bid privately. In Rounds 2 and 3, you’ll bid in groups.  
    > - You pay nothing to bid. If you ‘win’ a play, you’ll receive book vouchers for your net winnings (payout minus price paid)."  
  - **Key Rules**:  
    - No discussion of probabilities/expectation.  
    - Emphasize: "Bid what you genuinely think it’s worth to play."  

  #### **10–25 min: Round 1 – Private Truthful Bidding**  
  - **Task**:  
    - Each participant writes two things on a slip:  
      1. **Bid**: "The most I’d pay for one play: $______"  
      2. **Doubt Threshold**: "I’d doubt the setup if I saw ______ tails in a row."  
    - Collect all slips.  
  - **BDM Mechanism (Truthful Incentive)**:  
    > "We’ll draw a random price between $0 and $25. If your bid is **at or above** this price, you’re eligible to play. We’ll pick one eligible person at random to play."  
    - Open a pre-drawn "Price" envelope (e.g., "$10").  
    - Identify eligible bidders (bid ≥ drawn price). Randomly select one winner.  
    - Winner plays: Open a "Game" envelope, calculate payout, and award vouchers for **(payout - price)**.  
    - *Example*: Price = $10, Payout = $16 → Winner gets $6 in vouchers.  
  - **Transition**: Post results (price, winner, payout, net).  

  #### **25–45 min: Round 2 – Open Group Bidding (One Play)**  
  - **Structure**:  
    - **Tables (4 people, 5 min)**: Discuss and agree on a bid for one play. Write bid on whiteboard.  
    - **Whole Group (5 min)**: Tables share bids. Whole group debates and agrees on a single bid.  
  - **Task**:  
    > "Your group must bid together for **one play**. Bid what the whole group thinks it’s worth. We’ll run the game and see your net outcome."  
    - No real payment—calculate hypothetical net: **Payout - Bid**.  
    - Run the game: Open a "Game" envelope, announce payout and net.  
  - **Transition**: Record bid and net.  

  #### **45–65 min: Round 3 – Open Group Bidding (Ten Plays)**  
  - **Structure**:  
    - Same as Round 2 (tables → whole group).  
  - **Task**:  
    > "Now bid for the right to play **ten times**. You’ll win the sum of ten separate payouts. How much is that worth?"  
    - Groups bid for the package.  
    - Run **ten pre-sealed games** (open envelopes sequentially). Sum payouts.  
    - Calculate hypothetical net: **Total Payout - Bid**.  
  - **Doubt Threshold Recap**:  
    - Ask: "While watching the tosses, did anyone hit their doubt threshold? What happened?" (Note responses).  

  #### **65–90 min: Debrief**  
  - **Reveal Expected Value Calculation (First 5 min)**:  
    - Compute expected value for the **capped game**:  
      - Toss 1 (50%): $2 → **$1**  
      - Toss 2 (25%): $4 → **$1**  
      - Toss 3 (12.5%): $8 → **$1**  
      - Toss 4 (6.25%): $16 → **$1**  
      - Toss 5+ (6.25%): $25 → **$1.56**  
      - **Total EV = $5.56**  
    - Contrast with **original game**:  
      > "If we removed the $25 cap, payouts double forever (e.g., 10 tails → $1,024). The expected value becomes infinite: 1 + 1 + 1 + ... = ∞."  
  - **Diagnose the Disconnect (10 min)**:  
    Map observations to explanations:  
    | **Moment in Session**          | **Diagnosis**                                                                 | **Distinguishable?** |  
    |-------------------------------|------------------------------------------------------------------------------|----------------------|  
    | Bids in Round 1 < $5.56       | Diminishing marginal utility (high payouts feel less valuable)              | Partially (vs. model validity) |  
    | Low doubt thresholds (e.g., 5–6 tails) | Model validity (long tails make people doubt fairness/solvency)          | **Yes** (explicitly asked) |  
    | Round 3 bids > Round 1 bids (per play) | Heavy tails: Means stabilize with repeats (law of large numbers)        | **Yes** (observed bid shift) |  
    | Bids << EV even with cap      | Probability weighting (people ignore tiny chances of high payouts)          | No (vs. utility)     |  
    | No bid near ∞                 | Bankrupt bank (real-world payout limits)                                     | **Yes** (built into design) |  
    - **Key Insight**:  
      > "In this room, we capped payouts—so EV is $5.56. But in the original game, EV is ∞. Why won’t people pay ∞? Because:  
      > - Money has diminishing returns.  
      > - No bank can pay unlimited sums.  
      > - We stop trusting the model after long tails.  
      > - One-off decisions can’t rely on averages when extremes dominate."  
  - **One-Sentence Takeaway**:  
    > "The expected value diverges because of astronomically rare but high payouts, but we bid low because real-world constraints (bank solvency, model validity, risk aversion) override the math."  

  ---

  ### Handling Predictable Issues  
  1. **Prior Knowledge Announcement**:  
     - *Response*: "Interesting! Let’s see if our group agrees when we run it." Proceed with activity. Use their input in debrief ("Some knew the theory, but what did we observe?").  
  2. **Joke Bids (e.g., "$100")**:  
     - *Absorb*: In Round 1, high bids may win but likely lose money (payout cap = $25; net often negative). Group bidding (Rounds 2–3) self-corrects through peer pressure.  
  3. **Anchoring in Open Bidding**:  
     - *Design*: Tables bid first → multiple anchors. Whole-group debate overrides extreme anchors. Record all table bids to show variation.  
  4. **Unboundedness Not Reproducible**:  
     - *Facilitator Verbal Bridge*:  
       > "No room or budget can contain the true game’s unlimited payouts—we capped at $25 for practicality. But mentally, imagine payouts doubling forever. Would you bid $1,000? $1,000,000? Why not?"  

  ---

  ### Facilitator Notes  
  - **Budget**: Allocate $200 in vouchers (covers worst-case: 1 play in Round 1 + 1 in Round 2 + 10 in Round 3 = 12 games × $25 = $300, but probabilities make >$200 unlikely).  
  - **Key Outcomes**:  
    - Participants compute divergent EV.  
    - They articulate why EV alone doesn’t dictate bids (constraints/psychology).  
  - **Run Smoothly**: Stick to timeline. Use co-facilitator to manage envelopes/calculations.
