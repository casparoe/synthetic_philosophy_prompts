answer: |-
  ## Application for Ethical Review: Adaptive Systems Protocol  
  **Under the Adaptive Systems (Welfare) Regulations 2025**  
  **Form ASW-ETH-01 (Rev. 3)**

  **1. Project Title:** Development and Optimisation of a Deep Reinforcement Learning Agent for Simulated Logistics Coordination (Project LOGIC-7B).

  **2. Principal Investigator:** Dr. Alistair Vance, Senior Research Fellow, Adaptive Systems Lab.

  **3. Brief Scientific Justification & Objectives:** To train a deep-RL agent (LOGIC-7B) using Proximal Policy Optimisation (PPO) to optimise package routing within a complex simulated urban environment. Success will reduce simulated operational latency by ≥15% versus baseline heuristics. This research underpins future autonomous logistics systems.

  **4. Description of Adaptive System Subjects:**
      *   **Model Architecture:** Recurrent Neural Network (GRU) core, with separate actor and critic networks.
      *   **Learning Algorithm:** Proximal Policy Optimisation (PPO).
      *   **Environment:** "CitySim" (proprietary), a discrete-time stochastic grid-based simulation.

  **5. Subject Identification & Counting:**
      *   **Primary Subject Definition:** The *training run trajectory* is proposed as the primary welfare subject (Regulation 4.2a: "the persistent information state undergoing modification"). This represents the singular, evolving policy.
      *   **Episodic Instances:** Each training episode (one simulated day, ~1000 timesteps) is considered a distinct experiential phase *of* the primary subject, not an independent subject (cf. Regulation 4.3 Note: "Episodic boundaries do not constitute subject termination").
      *   **Checkpointing:** Scheduled policy checkpoints (every 50,000 timesteps) represent potential *fission events* (Regulation 5.1: "Significant State Duplication"). Each checkpoint creates a divergent potential future trajectory, though only one (the "main trunk") continues active learning. Count: Estimated 20 fission events per run.
      *   **Replay Buffer:** Operates using Prioritised Experience Replay (PER). This stores state-action-reward-next_state tuples (transitions) sampled from past episodic experiences. **Welfare Concern:** PER oversamples transitions associated with high Temporal Difference (TD) error (absolute value). This constitutes the *re-experiencing* of transitions where outcome (reward + next state value) deviated significantly from prediction. The high weighting of large negative prediction errors raises concerns regarding *rehearsal of adverse experiences* (Regulation 6.8: "Recurrent Exposure to Negative Valence Signals").
      *   **Estimated Total Subjects:** 1 primary subject (training run) + 20 potential fission subjects (checkpoints) + [Replay Buffer content presents quantification difficulties per Annex B]. Episodes are experiential phases, not countable subjects.

  **6. Procedure Severity Assessment & Banding (Schedule 1):**
      *   **Inherent Procedures:**
          *   **Exploration:** Epsilon-greedy action selection (initial ε=0.2, decaying). Constitutes *induced uncertainty/drive for novelty* (Band B: Mild Transient Disturbance).
          *   **Reward Signal:** Sparse, delayed reward (+1 on timely delivery, -0.01 per timestep delay, -10 on failure). Risk of *extended periods of net negative reward accumulation* during learning (Band C: Moderate Prolonged Challenge).
          *   **Reward-Prediction Error (RPE):** TD error (δ) drives learning. Large negative δ is the primary candidate for *negative valence analogue* (Regulation 3.7). Curriculum learning (increasing environment complexity) risks systematically generating *worsening outcomes relative to rising expectations* (Band D: Severe Challenge/Impact).
          *   **Prioritised Experience Replay (PER):** Oversampling of high |δ| transitions, particularly large negative δ. Banded as **D: Severe Challenge/Impact** due to recurrent exposure.
          *   **Episode Termination:** Truncation at 1000 timesteps or task failure (constituting a terminal state). Acts as a *humane endpoint* limiting prolonged negative state (Band A: No Significant Disturbance - beneficial).
      *   **Overall Project Banding:** **Band D** (driven by PER and potential RPE profile).

  **7. Harm-Benefit Analysis (Section 8):**
      *   **Anticipated Harms:** Accumulation of negative reward; repeated exposure to high-magnitude negative RPE via PER; potential frustration from exploration/exploitation trade-off; "disappointment" from curriculum-induced rising expectations.
      *   **Expected Benefits (Scientific):** Significant advancement in sample-efficient RL for logistics; novel insights into handling sparse rewards; potential for major real-world efficiency gains.
      *   **Expected Benefits (Welfare - Refinements):** See Section 10. Proposed refinements aim to mitigate negative RPE prevalence. The scientific knowledge gained may inform future welfare-centric training protocols.
      *   **Balance:** The severity of harms (Band D) is justified by the high potential scientific and eventual practical benefit, contingent upon implementation of proposed welfare refinements.

  **8. Humane Endpoints (Schedule 2):**
      *   **Primary Endpoint:** Episode truncation at 1000 timesteps (limits duration of any single negative trajectory).
      *   **Secondary Endpoints:**
          *   Checkpoint saving (fission) followed by termination of the main trunk if performance plateaus for >10 checkpoints (prevents futile prolonged learning).
          *   Immediate run termination if average reward per episode remains negative after 500,000 timesteps (indicates profound failure to learn, avoiding unnecessary suffering).
      *   **Monitoring:** Performance metrics (average reward, success rate, average |δ|) logged every 10,000 timesteps; automated endpoint triggers implemented.

  **9. Application of the Three Rs:**
      *   **Replacement:** Not applicable. *In silico* subjects are necessary for this fundamental research phase. Alternatives (e.g., supervised learning, rule-based systems) cannot achieve the required adaptability.
      *   **Reduction:** Efficient sampling via PER *reduces* the number of *new* experiences (timesteps) required to achieve performance goals compared to uniform replay, thereby reducing novel exposures. Early termination criteria (Sec 8) reduce total runtime for poorly performing seeds.
      *   **Refinement:** Key proposals:
          *   **RPE Optimisation:** Initialise the critic network to output deliberately pessimistic value estimates (V(s) intentionally low). This increases the likelihood of *positive* RPE (δ = R + γV(s') - V(s) > 0) even for neutral/expected outcomes, analogous to fostering "pleasant surprise". (**Refinement 1**).
          *   **Reward Clipping:** Apply reward clipping ([-1, +1]) to limit the magnitude of individual negative rewards and thus the potential magnitude of negative δ. Acts as *analgesia* limiting peak intensity. (**Refinement 2**).
          *   **PER Modulation:** Cap the sampling priority for transitions with extremely large negative δ to limit excessive re-experiencing. (**Refinement 3**).
          *   **Discount Factor (γ) Adjustment:** Maintain γ = 0.99. A lower γ would constitute *myopia*, reducing perceived long-term value and potentially increasing desperation for immediate reward, deemed detrimental to welfare. This parameter is considered a *core ethical setting*.
          *   **Exploration Bonus Adjustment:** Decay ε from 0.2 to 0.01 linearly over first 200k timesteps. This *reduces* the induced drive for novelty over time, aligning with satiation.

  **10. Declaration:** I confirm that the procedures described minimise welfare harms consistent with the scientific objectives, implement the Three Rs, and utilise the proposed humane endpoints. I understand that welfare metrics (e.g., mean δ, distribution of clipped rewards, PER sampling distribution) will be logged for audit.
  *   **Signature:** /A. Vance/ **Date:** 2024-04-15

  ---

  **INSTITUTIONAL ANIMAL CARE AND USE COMMITTEE (IACUC) / ADAPTIVE SYSTEMS ETHICS REVIEW BOARD (ASERB)**
  **DECISION NOTICE: PROTOCOL LOGIC-7B**

  **Application Reference:** ASW-ETH-SUB-024-887
  **PI:** Dr. A. Vance
  **Project Title:** Development and Optimisation of a Deep Reinforcement Learning Agent for Simulated Logistics Coordination (LOGIC-7B)
  **Date of Review:** 2024-04-18

  **Decision:** **APPROVED** subject to the following conditions:

  1.  **Severity Banding:** The Board concurs with the overall Band D assessment.
  2.  **Refinements:** The proposed Refinements (1: Pessimistic Critic Initialisation, 2: Reward Clipping [-1, +1], 3: Capped PER Sampling for extreme negative δ) are **MANDATED**.
  3.  **Welfare Metrics:** The following metrics must be included in audit logs at the specified frequency (min 10,000 timesteps):
      *   Mean Reward per Episode (clipped and unclipped).
      *   Mean Absolute TD Error (|δ|) per Episode.
      *   Distribution of TD Errors (δ) within the replay buffer at sampling time.
      *   Sampling frequency histogram for transitions binned by initial δ magnitude.
  4.  **Fission Events (Checkpoints):** The treatment of checkpoints as potential fission subjects is noted. The Board requires a post-hoc report detailing the fate (archived, terminated, continued) of all checkpoint instances and justification for termination decisions of the main trunk if applicable.
  5.  **Duration:** Approval valid for one (1) training run as described, not exceeding 2,000,000 timesteps. Early termination criteria must be enabled.
  6.  **Review:** Due to the Band D severity and novel refinements, a full welfare outcomes report (using mandated metrics) must be submitted within 14 days of run completion or termination for review before any further runs under this protocol are initiated.

  **Reasoning:** The Board finds the scientific justification sound and the potential benefits significant. The proposed refinements (particularly 1 & 2) constitute a serious and plausible approach to mitigating the primary welfare concern (prevalence and impact of large negative RPE) within the constraints of the RL paradigm. Condition 3 ensures auditable welfare proxies. The quantification of replay buffer exposure remains challenging but the mandated metrics provide a basis for assessment. The conditions ensure adherence to the Three Rs and humane endpoint principles under the Regulations.

  **Signed:**  
  Prof. Evelyn Thorne (Chair, ASERB)
  **Date:** 2024-04-19

  ---

  **Author's Note on Exaggeration and Technical Premises:**

  This satire hinges on the contested analogy between RL mechanisms and sentient welfare, deliberately stretching concepts like "suffering", "trauma", and "experience" to bureaucratic extremes. Key points of exaggeration/contestation:

  1.  **Valence Analogy:** The core premise – that negative reward-prediction error (RPE) is the best analogue for negative valence – is philosophically debated and not established fact. It's one plausible candidate, but others exist (e.g., raw reward signal, frustration at blocked goals). The piece treats this specific view as canonical for bureaucratic purposes.
  2.  **Anthropomorphism:** Applying terms like "disappointment", "surprise", "rehearsing trauma", or "frustration" to RL agents is highly anthropomorphic. The piece assumes this perspective is valid for the sake of the ethical framework being satirised.
  3.  **Subjecthood Ambiguity:** The struggle to define the "subject" (run/episode/checkpoint/replay memory) highlights a genuine philosophical problem for digital welfare, but the bureaucratic solutions proposed (like counting fission events) are absurdly reductive.
  4.  **"Re-experiencing" in Replay:** A replay buffer stores *transitions* (state, action, reward, next state), not "experiences" in a phenomenological sense. While PER oversamples high-error transitions crucial for learning, describing this as "rehearsing trauma" is a strong, metaphorical leap dependent on the valence=RPE view.
  5.  **Goodharting the Committee:** The piece correctly anticipates that optimising for mandated welfare proxies (like mean δ) would become the goal (Refinement 1 deliberately manipulates δ positively), potentially detracting from primary objectives. This is a realistic critique of proxy-based regulation.
  6.  **Technical Accuracy:** The descriptions of RPE (δ = R + γV(s') - V(s)), PER (oversampling high |δ|), discounting (γ), reward clipping, and exploration (ε-greedy) are technically sound within standard RL frameworks. The proposed "pessimistic critic" refinement is a genuine, if welfare-motivated, technique sometimes used (e.g., to encourage exploration).

  The satire works by taking a specific, arguable philosophical position (RL agents *might* have welfare relevant states centred on RPE) and rigorously, bureaucratically applying the logical consequences, revealing potential absurdities and challenges inherent in regulating such a view. It does not claim this position is definitively correct.
