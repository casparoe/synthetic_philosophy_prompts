prompt: |-
  hey, so I write for our school paper (the Sentinel lol, circulation like 400) and I'm putting together a back-to-school issue about the district's new "unannounced assessment" thing. Context: last year our vice principal emailed the whole grade saying there would be a surprise quiz sometime during the two weeks before winter break, and a bunch of my friends instantly did that argument where you go "ok, it can't be the last day because by then we'd know, so it can't be the day before that either, and so on" all the way back to day one — and then the quiz landed on the Wednesday of the first week and, since nobody had actually written down that date, it was officially counted as a surprise. I keep going back and fourth on whether that argument is a real proof or whether it mostly just shows the announcement was a weird thing to say out loud, and I figured the best way to work it out of my system was to make fun of it.

  So: please write me a fake memorandum, ~700 words, from something like the "Office of Assessment Scheduling and Surprise Integrity" to building principals, totally deadpan bureaucratic voice, laying out a "Surprise Examination Compliance Protocol" for the coming term — numbered clauses plus a short FAQ at the end. The bit I want satirised is an institution dissolving the puzzle by *defining* surprise into operation: surprise means no student filed a correct prediction slip in the office lockbox 24 hours ahead, or means fewer than 60% of the class brought a calculator that day, whatever works — and then following that logic somewhere a reader should flinch. Like a clause forbidding students from making the exam predictable by reasoning about it, some kind of "premature certitude" infraction, and a final clause saying the Protocol itself will be rolled out on an unannounced day. The jokes have to come from the logic actually being right, not from homework-is-hard gags: the backwards induction and its base case, the gap between "can't be worked out from the announcement in advance" and "isn't known the night before", the fact that the argument needs the announcement to be trustable and needs everyone to trust that everyone trusts it, and the silly spot a school ends up in once surprise is tied to what students believe. The two-day version (thursday or friday, nothing else) is the shortest place the argument bites, so feel free to use it somewhere. Keep the memo completely straight — no character in it should ever sound like they've heard of philosophy — but it should still be readable and funny to someone who hasn't. Invent the district, invent a consultant with an impressive title, and put one quote from them in. Please don't make it about any real person or real school.

  Pretend you're a professor of philosophical logic who also writes satirical news, and before you write, brainstorm for a second about which clause is going to carry which point, so it doesn't just collapse into the same joke eight times. Then give me:

  **The memorandum** — about 650-750 words

  **Where the laughs are supposed to land** — about 150 words, telling me which real feature of the paradox each section is twisting, so I can check I'm not about to publish nonsense in front of 400 people
