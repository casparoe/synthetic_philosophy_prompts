  ### Decision Tree for the Integrity Objection: A Procedural Guide  

  Imagine you're faced with a scenario where two people are trapped in separate locations, and you can only save one. One is your spouse, the other is a stranger who, if rescued, will go on to save many lives. While deciding, you find yourself thinking, "She's my wife." Later, after the rescue, someone asks why you chose her, and you say the same thing—"She's my wife"—and it feels perfectly appropriate. Start by reflecting on this retrospective moment: Does the fact that this explanation sounds acceptable after the event change your view of whether it was acceptable to think it during the deliberation? If you believe yes, the retrospective acceptability validates the deliberative thought, meaning the thought was appropriate both times, write that down. If you think no, the retrospective acceptability doesn't redeem the deliberative thought—it was "one thought too many" in the moment even if it's fine later—note that. If you think the thought is never acceptable, not during deliberation and not even retrospectively, because it should not factor into the decision at all, record that response.  

  Next, consider the nature of the relationship itself. When you think "She's my wife," is this relationship directly serving as your reason for action (e.g., the fact that she is your spouse is itself a justifying consideration), or is it merely a background condition that enables another reason to apply (e.g., like a live wire being a condition that makes touching it dangerous, but the reason not to touch is the danger, not the wire itself)? Or is the relationship entirely irrelevant to the moral calculus, a distraction from what truly matters? Choose one: the relationship as a reason, a background condition, or irrelevant.  

  Now, shift to a third-person perspective: You are not the spouse but an impartial allocator deciding who gets the last rescue slot between two strangers. One is married to someone else (let's call them X), while the other is unattached. You consider the thought, "She is X's wife." Is this "one thought too many" in this context? If yes, it is inappropriate for the allocator to consider the relationship. If no, it is acceptable to include it as a relevant factor. If you think it's not too many but only because it represents a different kind of reason (e.g., the general value of relationships, not X's personal attachment), select that option.  

  Based on your answers, your position aligns with one of the following leaves in the logical space. Each represents a coherent view, though some are more commonly held than others, and each carries an awkward commitment—a consequence that might feel counterintuitive or difficult to defend. The tree covers all 27 possible combinations of answers, but only six are occupied by named positions; the rest are empty due to incoherence, unattractiveness, or lack of exploration. For instance, combinations where the thought is deemed never acceptable (first answer) but the relationship is treated as a reason (second answer) are incoherent—why would something irrelevant to morality be cited as a reason? Combinations where the retrospective thought is acceptable but the relationship is irrelevant are unattractive, as they offer no clear moral basis for the retrospective justification. Many others are unexplored, simply because no major theory has articulated them.  

  If your answers were that the thought is never acceptable during or after deliberation, the relationship is irrelevant, and the allocator should ignore relationships entirely, you hold **Impartial Consequentialism**. The awkward commitment: You must prioritize the stranger over your spouse in the rescue case, as the relationship provides no moral weight against the greater good—even if this feels alienating or emotionally untenable.  

  If you thought the deliberative and retrospective uses were both acceptable, the relationship itself is a reason, but the allocator must ignore relationships, you land in **Scheffler's Agent-Centered Prerogative** (which also captures the demandingness complaint—they collapse here). The awkward commitment: Relationships matter for the agent but not for the allocator, creating tension—why do they lose moral significance when the perspective shifts?  

  If you saw the retrospective thought as acceptable but the deliberative one as too many, affirmed the relationship as a reason, and allowed the allocator to consider relationships, you're in the **Phenomenological View**. The awkward commitment: The same reason is valid after the fact but corrupting if consciously weighed during action, requiring an explanation for why articulation undermines moral integrity.  

  If you rejected the thought as never acceptable (because integrity is the real reason), treated the relationship as a background condition for integrity, and permitted the allocator to consider relationships, you're in **Integrity as Weighed**. This is a genuine but often-misread position; it treats integrity as just another factor in a cost-benefit calculus, misinterpreting Williams' objection that integrity cannot be "weighed" without losing its personal character. The awkward commitment: You must consciously factor your own integrity into decisions, which might itself feel like "one thought too many" and alienate you from your deepest commitments.  

  If you accepted the thought both times, saw the relationship as a reason, and allowed allocators to consider relationships simply as partial interests, you hold **Unrestricted Partiality**. The awkward commitment: Allocators must account for every personal relationship in every decision, risking unworkable complexity and potential injustices (e.g., favoring connected individuals over greater needs).  

  If you accepted the thought both times, affirmed the relationship as a reason, but said the allocator's consideration is only valid as a different kind of reason (e.g., intrinsic relational value), you're in **Relationships as Intrinsic Goods**. The awkward commitment: The intrinsic value of relationships could override saving more lives, which may seem perverse when stakes are high (e.g., saving a spouse over a famine-relief worker).  

  Now, for the control cases, which test the tree's distinctions without being branch points:  
  - **Control (a): Acting with no articulable thought ("one thought too few")** separates leaves. For the Phenomenological View, this is the ideal—spontaneous action preserves integrity. For Impartial Consequentialism and Integrity as Weighed, it's a failure (the agent should have calculated consequences or integrity). Other leaves sail through: Scheffler allows it (permission doesn't require deliberation), Unrestricted Partiality and Relationships as Intrinsic Goods tolerate it (if instinct aligns with partiality).  
  - **Control (b): Doctor favoring her own patient in triage** separates leaves based on institutional vs. intimate ties. Scheffler and Phenomenological Views struggle here—personal partiality permissions may not extend to professional roles, making the thought feel more like bias. Other leaves sail through: Impartial Consequentialism rejects it unless beneficial, Integrity as Weighed might accept it if integrity includes professional duty, and partiality-focused leaves (Unrestricted, Relationships) extend naturally.  
  - **Control (c): Relationship based on a mistake** separates leaves by whether reasons depend on belief or reality. Where the relationship is a reason (Scheffler, Phenomenological, etc.), the thought may still "work" if the belief was sincere; where it's a background condition (Integrity as Weighed), the duty dissolves if the relationship isn't real, making the thought retrospectively indefensible.  

  If the handout must be cut to two questions, drop the third (allocator perspective). While it splits Unrestricted Partiality from Relationships as Intrinsic Goods, and tests Scheffler's asymmetry, the core divide between "allowed to favor" and "demandingness" vs. "phenomenology" is captured by the first two questions. The first question (retrospective vs. deliberative) is especially crucial for isolating the phenomenological worry, and the second (reason vs. condition) prevents inconsistencies in how relationships are framed.
