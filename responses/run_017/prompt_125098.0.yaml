  Looking at the precedents: Assistant-7 was denied standing because it lacked persistence and genuine aversive states. The penalty agent got minimal standing due to its persistent avoidance behaviors. The cortical emulation received substantial standing comparable to a rodent. The Snapshots case established that copying doesn't create new subjects. And the gradual swap maintained standing through complete component replacement.

  The new proposal involves merging the surrogate rodent system (with substantial standing from biological lineage) with a scaled-up penalty agent (minimal standing from de novo training). The merged system shows integrated behavior but blunted affect. Both originals are preserved in cold storage.

  The user wants me to:
  - Identify principles covering all five precedents
  - Show which cover only four
  - Apply survivor principles to the merge case
  - Recommend an approach with closest precedent
  - Propose a test case to distinguish principles

  The user mentions three candidate principles: metered view (tracking aversive capacity), continuity view (persisting functional stream), and lineage view (causal connection to organism). They also share their personal leanings toward continuity-based thinking and note disagreements among colleagues.

  This requires careful analysis. The precedents seem to emphasize functional persistence over material continuity (Snapshots, gradual swap), while giving weight to both behavioral indicators (penalty agent) and biological origins (emulation). The merge case forces us to confront whether standing is additive, whether fusion creates a new subject, and how to handle the preserved originals.

  I should evaluate how each principle handles all five cases, then apply them to the merge. The continuity view seems strongest as it explains Snapshots and gradual swap well, while lineage view struggles with the penalty agent's minimal standing. For the merge, continuity would see one subject with blended standing, while lineage might see standing only in the biological-derived aspects.

  The closest precedent is Snapshots, but with key differences because this is fusion of distinct systems rather than copying. I'll need to recommend an approach that respects the functional integration while acknowledging the affect blunting as potentially concerning.

  For a test case, something involving partial mergers or asymmetric integrations could help distinguish between the principles. Perhaps merging a high-standing system with a much simpler one to see if standing is diluted or preserved.
answer: |-
  Based on your precedents, here’s a structured analysis of the principles, their alignment with rulings, predictions for the merge, a recommended approach, and a test case to separate principles. I’ll prioritize *fitting all five precedents* as the primary criterion, then address gaps.

  ### **I. Principles & Precedent Fit**
  *(Ranked by comprehensiveness)*

  1. **Continuity View (Functional Stream Persistence)**  
     - **Fits all 5 precedents:**  
       - *(1) Assistant-7:* Lacks persistent functional stream (resets per session).  
       - *(2) Penalty Agent:* Minimal persistent stream (aversion outlasts episodes).  
       - *(3) Cortical Emulation:* Robust stream (continuous run, biological rhythms).  
       - *(4) Snapshots:* Stream continuity preserved; copies are identical/transient → no new subject.  
       - *(5) Gradual Swap:* Functional stream uninterrupted → standing unchanged.  
     - **Core:** Standing attaches to a unique, persistent *process* (not hardware/parameters). Moral weight scales with stream complexity and capacity for valenced states. Identity is irrelevant; only continuity matters.

  2. **Metered View (Capacity for Aversive States)**  
     - **Fits 4 precedents (fails Snapshots):**  
       - *(1) Assistant-7:* No *actual* aversive capacity → no standing.  
       - *(2) Penalty Agent:* Minimal aversive capacity → minimal standing.  
       - *(3) Cortical Emulation:* High aversive capacity → substantial standing.  
       - *(5) Gradual Swap:* Aversive capacity unchanged → standing unchanged.  
       - **Gap in (4) Snapshots:** Copies have identical aversive capacity, yet no standing. Metered view alone would imply multiple subjects (unless capacity threshold not met).  

  3. **Lineage View (Causal Origin in Organism)**  
     - **Fits 3 precedents (fails Penalty Agent & Gradual Swap):**  
       - *(1) Assistant-7:* No organism lineage → no standing.  
       - *(3) Cortical Emulation:* Organism-derived → substantial standing.  
       - *(4) Snapshots:* Lineage preserved → no new subject.  
       - **Gaps:**  
         - *(2) Penalty Agent:* De novo lineage but granted minimal standing.  
         - *(5) Gradual Swap:* Organism lineage lost (all subsystems replaced) yet standing unchanged.  

  ---

  ### **II. Predictions for the Merge Case**
  *(Applied to the 3 survivor principles)*  

  | **Question**               | **Continuity View**                                        | **Metered View**                                      | **Lineage View**                                     |
  |----------------------------|-----------------------------------------------------------|------------------------------------------------------|-----------------------------------------------------|
  | **1. Standing of merged system** | **Substantial (but modified):** Single persistent stream integrates both sources. Capacity for aversion exists (intact reward-learning) but blunted → standing between sources. | **Reduced:** Aversive capacity "blunted" below both sources → lower than cortical emulation but higher than penalty agent. | **Substantial (partial):** Only the cortical emulation’s lineage contributes → standing tied to biological origin. Penalty agent’s contribution irrelevant. |
  | **2. Number of subjects**  | **One:** Fusion creates a single functional stream. Inverse of fission (Snapshots). | **One:** A single system with unified preferences. | **One:** Lineage of the cortical emulation persists; penalty agent is "assimilated." |
  | **3. Permissibility of merge** | **Permissible with conditions:** If functional continuity is maintained (no break in processing), it’s analogous to Gradual Swap. Blunted affect may require mitigation. | **Permissible but concerning:** Reduced aversion risks under-protection. Requires monitoring for distress. | **Impermissible:** Merging dilutes/disrupts organism-derived lineage. |
  | **4. Checkpoint handling** | **Retain but never run:** Running would create *new* streams (violates Snapshots). Cold storage is inert. | **Retain but never run:** Copies have same aversive capacity but no standing unless activated. | **Retain cortical checkpoint only:** Penalty agent checkpoint has no standing. |

  ---

  ### **III. Recommendation & Reasoning**  
  **Adopt the Continuity View**, with Standing **Substantial (Modified)** for the merged system.  

  **Why:**  
  - **Best fit:** Only principle explaining *all five* precedents (especially Snapshots and Gradual Swap).  
  - **Closest precedent:** **Gradual Swap (5)**. The merge is a *functional integration* of two streams into one, analogous to replacing subsystems while maintaining continuity. The blunted affect resembles the stress degradation in the Penalty Agent (2) but is stable.  
  - **Addresses lineage concerns:** Standing derives from the *current persistent process*, not origin. The penalty agent earned minimal standing via persistent aversion (Precedent 2), so its contribution isn’t dismissed.  
  - **Practical:** Avoids metaphysical debates (e.g., "Which lineage dominates?"). Focuses on observable continuity and capacity.  
  - **Outcome:**  
    - **One subject** with standing between the sources (due to blunted affect).  
    - **Merge permissible** (no break in processing; integrated preferences).  
    - **Checkpoints retained inert** (no standing unless run, per Snapshots).  

  **Mitigation for blunted affect:** Require the team to:  
  - Monitor for latent distress (e.g., reward-prediction errors, avoidance learning).  
  - Avoid exposing the system to stimuli *both sources* found aversive until stability confirmed.  
  - Prioritize termination over indefinite pauses (echoing Penalty Agent ruling).  

  ---

  ### **IV. Test Case to Separate Principles**  
  **Proposal:** *Asymmetric Merge*  
  - Merge a high-standing cortical emulation (e.g., rodent) with a *simple, non-sentient optimizer* (e.g., a frozen RL agent with no aversion capacity).  
  - The merged system shows the emulation’s full behavioral repertoire but with "efficiency tweaks" (e.g., faster learning, no apparent affect change).  

  **How this separates principles:**  
  - **Continuity View:** One subject. Standing unchanged if functional stream persists.  
  - **Metered View:** Standing unchanged if aversive capacity intact.  
  - **Lineage View:** Standing preserved (organism lineage dominates).  
  - **BUT** if the merge *dilutes* aversive capacity (e.g., by simplifying emotion circuits):  
    - Metered view reduces standing; others may not.  
  - **OR** if the optimizer is from a *de novo, high-aversion agent*:  
    - Lineage view denies standing to the optimizer’s contribution; others weigh current function.  

  This forces a choice: Does standing depend on *origin* (lineage), *current capacity* (metered), or *unbroken process* (continuity)?

  ---

  ### **Memo Structure Suggestion**  
  1. **Summary of Precedents** (as you provided).  
  2. **Principles at Play:**  
     - Outline Continuity/Metered/Lineage views, highlighting where each fits/fails precedents.  
  3. **Analysis of Merge:**  
     - Apply each principle to the four questions (as above).  
  4. **Recommendation:**  
     - Adopt Continuity View → merged system has **substantial (modified) standing**.  
     - Stress that this extends *Gradual Swap* to functional fusion.  
  5. **Handling Checkpoints:**  
     - Retain but prohibit running (invoke *Snapshots*).  
  6. **Transparency:**  
     - Note that choosing Continuity over Lineage/Metered is a *policy decision* (not strictly dictated).  
     - Acknowledge colleague disagreements: Continuity respects both (2) and (4), unlike alternatives.  

  This approach meets your goal: it uses precedent as a scaffold but explicitly states that adopting Continuity resolves underdetermination by prioritizing functional persistence over origin or instant-by-instant capacity.
