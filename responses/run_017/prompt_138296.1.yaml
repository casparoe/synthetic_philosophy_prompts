answer: |-
  The collision between program equilibrium's logic and competition law's "agreement requirement" reveals profound tensions in legal doctrine. Let's reconstruct the implicit theory, test its foundations, and explore alternatives:

  ### I. The Implicit Theory of Agreement in Competition Law
  The doctrine presupposes a **hybrid theory** blending elements from:
  - **Philosophy of action**: Agreement as a "meeting of wills" involving mutual commitment
  - **Normative powers**: The exercise of binding authority through communicative acts
  - **Illocutionary force**: Messages that create joint intentions (e.g., promises, offers)
  - **Proof proxies**: Communication as reliable evidence of illicit coordination

  **Core presuppositions**:
  1. **Volitional autonomy**: Firms retain unconstrained choice until communication creates mutual obligations
  2. **Causal primacy of communication**: Explicit coordination *changes* behavior rather than merely revealing pre-existing incentives
  3. **Distinct harm principle**: Collusion via agreement is uniquely dangerous because it creates stable expectations

  **Merely comfortable fits**:
  - **Administrability**: Punishing communications creates bright-line rules for enforcement
  - **Chilling effect avoidance**: Protecting price-matching preserves consumer benefits
  - **Moral culpability**: Agreements imply wrongful intent absent in parallel conduct

  ### II. Underdetermined Doctrine
  The same legal outcomes (allow price-matching; ban messages) could flow from divergent theories:
  | Theory Type          | Basis for Distinction                     | Weakness                        |
  |----------------------|------------------------------------------|---------------------------------|
  | Will-Based           | Subjective commitment to coordinate       | Ignores identical economic effects |
  | Epistemic            | Shared knowledge of mutual intentions     | Stable expectations exist without communication |
  | Procedural           | Transfer of decision-control              | Algorithms control decisions more rigidly than humans |
  | Consequentialist     | Provability of illicit intent            | Fails to explain why harmful transparency is allowed |

  The doctrine collapses these distinctions, creating **regulatory arbitrage** (e.g., publishing machine-readable pricing rules).

  ### III. Testing the Revocability Defense
  *"Unilateral conduct remains revocable, so no agreement exists"* – this common justification fails against program equilibrium:
  - **Temporal incoherence**: Program equilibrium requires *irrevocability during play* (policies fixed when code runs), yet legal analysis focuses on pre-play revocability
  - **Strategic equivalence**: A firm with a "beat competitors' prices" algorithm has functionally surrendered discretion as completely as through an agreement
  - **Empirical flaw**: Firms rarely revoke public price-matching guarantees due to reputational costs – making them *de facto* binding

  **Conclusion**: Revocability doesn't cleanly distinguish lawful/unlawful conduct. The equilibrium harm arises from *published interdependence*, not commitment mechanisms.

  ### IV. Structural Coordination Theory: Enforcement Implications
  If illegality required **interlocked decision procedures** (IDPs), enforcement would:
  - **Shift from intent to architecture**: Prosecute firms whose algorithms have provable interdependence (e.g., real-time price feeds to competitors)
  - **Create perverse incentives**:
    - **Obfuscation race**: Firms would make algorithms illegible (e.g., encrypted weights in ML pricing models)
    - **Plausible deniability**: Use stochastic systems claiming "independent" behavior
    - **Over-deterrence**: Punish benign parallel algorithms (e.g., common open-source pricing tools)
  - **Detection challenges**: Require algorithmic audits – raising privacy/trade secret concerns

  **Comparison to current regime**:
  |                          | Current "Agreement" Regime          | Structural IDP Regime             |
  |--------------------------|-------------------------------------|-----------------------------------|
  | **Primary incentive**    | Don't communicate                   | Don't be legible                  |
  | **False positives**      | Punishes harmless communications    | Punishes efficient parallelism    |
  | **False negatives**      | Allows harmful transparency          | Allows covert algorithmic collusion |
  | **Administrative cost**  | Lower (focus on documents/meetings) | Higher (requires technical forensics) |

  The structural approach might be *worse*: Illegibility defenses could enable more sophisticated collusion, whereas the current regime at least enables detection through communication trails.

  ### V. Resolving the Tension
  The doctrine persists because it balances **three irreconcilables**:
  1. Economic reality: Interdependence can emerge without agreement
  2. Legal culpability: Punishment requires moral agency
  3. Administrative feasibility: Rules must be enforceable

  **A path forward**: Retain the agreement requirement but:
  - Expand "agreement" to include **deliberate structural coupling** (e.g., publishing APIs for competitors to read prices)
  - Create **safe harbors** for pro-consumer transparency (e.g., price-matching guarantees with short expiration windows)
  - Develop **algorithmic auditing** for dominant firms to detect de facto IDPs

  The equilibrium you describe exposes competition law's foundational fiction: that "agreement" is ontologically distinct from predictable interdependence. Yet abandoning the distinction entirely risks greater harm. The doctrine survives precisely because its contradictions serve multiple masters – none perfectly, but sufficiently for practical justice.
