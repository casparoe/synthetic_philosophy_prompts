answer: |-
  Below is a concise flowchart designed for your magazine sidebar. It guides curators from an object's discovery to defensible claims (or agnosticism), with **8 branch nodes** (questions about evidence) and **7 leaf claims** + **agnosticism**. Key features:  
  - **Belief claims** are gated behind high barriers (Nodes 7–8).  
  - **Analogy problems** are flagged (Node 6) with risks explained.  
  - **Indistinguishable claims** (e.g., votive vs. elite trash) share a leaf.  
  - **Unoccupied combinations** are noted at the end.  

  ---

  ### Flowchart: From Object to Claim  

  **Start**: We have an object from a documented context (excavation, find spot, layer).  

  1. **Deposition context?**  
     - **Ritual/structured** (grave, hoard, shrine): → Node 2  
     - **Utilitarian** (midden, workshop, home): → Node 3  
     - **Ambiguous/unknown**: → Node 5  

  2. **Use-wear analysis?**  
     - **Heavy wear** (e.g., tool erosion, repairs): → Node 4  
     - **No/little wear** (pristine, fragile): → Node 5  
     - **Indeterminate**: → Node 5  

  3. **Frequency at site?**  
     - **One/few** (unique or rare): → Node 5  
     - **Many** (common, mass-produced): → Node 4  

  4. **Association with administrative objects?**  
     - **Yes** (sealings, tallies, weights): → **Bureaucracy** (Record-keeping, taxation)  
     - **No**: → Node 5  

  5. **Comparanda context?**  
     - **Ritual sites** (tombs, temples): → Node 6  
     - **Elite sites** (palaces, rich homes): → Node 6  
     - **Everyday sites** (farms, workshops): → **Household craft** or **Utilitarian use**  
     - **Mixed/no comparanda**: → Node 7  

  6. **Analogy source?**  
     - **Contemporary/nearby cultures**: → Node 7  
     - **Distant/later cultures** (e.g., comparing Neolithic to Roman): → **❗Risk: False equivalence**. Objects may share form but not meaning. → Node 7  

  7. **Exclude functional explanations?**  
     - **Yes** (e.g., non-utilitarian material, no practical use): → Node 8  
     - **No** (could be practical): → **Status competition** (display) or **Gift exchange**  
     - **Unclear**: → **Agnostic**  

  8. **Corroborating evidence?**  
     - **Texts/iconography** (e.g., prayers, myths depicted): → **Cult practice** or **Specific belief**  
     - **None**: → **Ritual deposit or elite trash?** (indistinguishable claims)  
     - **Circumstantial only**: → **Agnostic**  

  ---

  ### Key Features in Design  
  - **Belief not default**: Only reachable via Node 8 (requires functional exclusion AND texts/art).  
  - **Agnostic paths**: For ambiguous deposition (Node 1), analogy risks (Node 6), insufficient evidence (Node 7/8).  
  - **Indistinguishable claims**:  
    - *Ritual deposit vs. elite trash* (Node 8): Both fit "prestige" contexts with no use-wear/texts.  
    - *Status competition vs. gift exchange* (Node 7): Both explain rare/undamaged items in elite settings.  

  ### Unoccupied Combinations  
  1. **Bureaucratic + Ritual** (e.g., admin items in temples):  
     - *Why?* Usually siloed as "religion" or "state." Unexplored overlap (e.g., temple economies).  
  2. **Mass-produced + No use-wear** (e.g., thousands of pristine pots):  
     - *Why?* Incoherent without context—either unused (ritual?) or sampling error. Rarely studied.  
  3. **Household + Elite association** (e.g., humble items in palaces):  
     - *Why?* Unattractive to researchers; often overruled by "status" narratives without proof.  

  ---

  ### Sidebar Visual Suggestion  
  Format as a **vertical flowchart** with diamonds (questions) and boxes (claims). Use red for analogy risks (Node 6) and agnostic paths. Highlight "Belief" in Node 8 as a rare outcome.  

  Example snippet:  
  > Node 6 → "Used Roman rituals to interpret Neolithic figurines? → **Risk: Apples/oranges** → Proceed cautiously."  

  This meets your specs: avoids jargon, gates belief, flags analogy issues, and identifies evidentiary "blind spots."
