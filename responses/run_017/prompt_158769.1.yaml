  ### The Self-Defeating Nature of Distributed Veto Power: A First-Principles Argument

  As a journalist exploring the migration of decision-theoretic ideas into institutional design, you've identified a critical tension: the unilateralist's curse warns against allowing many independent actors to unilaterally impose high-stakes outcomes, leading to calls for concentrated action power and distributed vetoes. Yet your thesis—that this "solution" is self-defeating due to endogenous threshold adjustments in veto institutions—is both profound and correct. I'll argue for it from first principles, using small numerical illustrations to show why multiplying veto-holders buys far less caution than expected and can even backfire. I'll also show why the real lesson concerns informational design, not mere headcounts. Where your sketch needs refinement, I'll clarify and repair it.

  #### Core Symmetry and Its Breakdown
  Your sketch correctly identifies a symmetry between the unilateralist's curse and distributed vetoes, but it breaks down in two places:
  1. **Conditional Pivotality vs. Unconditional Opportunity**: In the unilateralist's curse, an agent conditions on being *pivotal to action* (others didn't act). In distributed vetoes, an agent conditions on being *pivotal to inaction* (others didn't block). This symmetry holds, but the informational content differs because "no action" in the curse is weak evidence (others might have been inactive), while "no block" in vetoes is strong evidence (others actively approved).
  2. **Threshold Direction**: Both cases involve threshold adjustments, but:
     - In the curse, agents *raise* their action threshold because others' inaction suggests pessimism.
     - In vetoes, agents *lower* their blocking threshold because others' approval suggests optimism.

  This breakdown is fatal to the "many watchdogs" intuition. Let's formalize the logic.

  #### First Principles: Bayesian Updating in Veto Institutions
  Consider a high-stakes binary decision: a proposal is either "Good" (beneficial) or "Bad" (harmful). Institutional designers add $N$ independent veto-holders to prevent Bad outcomes. Each agent:
  - Receives a private signal about the proposal's quality (e.g., "High" or "Low").
  - Decides whether to block (veto) or let it pass.
  - The proposal passes *only if no one blocks* (unanimity rule).

  Agents are rational Bayesian updaters. They know:
  - The prior probability that the proposal is Good: $P(\text{Good}) = p$.
  - Signal accuracy: $P(\text{High} | \text{Good}) = q$, $P(\text{Low} | \text{Bad}) = r$, with $q > 0.5$ and $r > 0.5$ (signals are informative).

  **Key insight**: When an agent considers blocking, they condition on being pivotal—i.e., *no other agent blocked*. This means all others saw signals that led them to approve. If others are competent ($q$ and $r$ high), this pivotality event is strong evidence that the proposal is Good. Thus, the agent discounts their own negative signal, requiring *stronger* evidence to block than if they were alone. As $N$ grows, this discounting intensifies, reducing the blocking probability.

  #### Numerical Illustration: The Curse of Unanimity
  Set parameters: $P(\text{Good}) = P(\text{Bad}) = 0.5$ (maximal uncertainty), $q = 0.8$, $r = 0.8$ (moderately accurate signals). We'll compute the probability a Bad proposal passes $P(\text{Pass} | \text{Bad})$ for varying $N$. Agents use a threshold rule: block if $P(\text{Bad} | \text{own signal}, \text{pivotality}) \geq 0.5$ (symmetric losses).

  - **$N=1$ (Single gatekeeper)**:
    - No pivotality conditioning. Agent blocks on Low signal.
    - $P(\text{Pass} | \text{Bad}) = P(\text{High} | \text{Bad}) = 0.2$.
    - Baseline caution: 20% failure rate.

  - **$N=2$ (Two veto-holders)**:
    - Equilibrium: Each blocks on Low signal *if* they believe others do the same.
    - Pivotality: Agent 1 blocks only if $P(\text{Bad} | \text{s1=Low}, \text{s2=High}) \geq 0.5$ (since no block from Agent 2 implies s2=High).
    - Bayes' theorem:
      $$
      P(\text{Bad} | \text{s1=Low}, \text{s2=High}) = \frac{P(\text{s1=Low}, \text{s2=High} | \text{Bad}) \cdot P(\text{Bad})}{P(\text{s1=Low}, \text{s2=High})}
      $$
      - Numerator: $P(\text{Low}|\text{Bad}) \cdot P(\text{High}|\text{Bad}) \cdot P(\text{Bad}) = 0.8 \cdot 0.2 \cdot 0.5 = 0.08$.
      - Denominator: $P(\text{s1=Low}, \text{s2=High} | \text{Bad}) \cdot P(\text{Bad}) + P(\text{s1=Low}, \text{s2=High} | \text{Good}) \cdot P(\text{Good}) = (0.8 \cdot 0.2 \cdot 0.5) + (0.2 \cdot 0.8 \cdot 0.5) = 0.08 + 0.08 = 0.16$.
      - Posterior: $0.08 / 0.16 = 0.5$.
    - Agent is indifferent; assume they block. $P(\text{Pass} | \text{Bad}) = P(\text{both High} | \text{Bad}) = 0.2 \cdot 0.2 = 0.04$.
    - Adding a veto-holder improves caution: Failure rate drops to 4%.

  - **$N=3$ (Three veto-holders)**:
    - Pivotality: Agent 1 blocks only if $P(\text{Bad} | \text{s1=Low}, \text{s2=High}, \text{s3=High}) \geq 0.5$.
    - Bayes' theorem:
      $$
      P(\text{Bad} | \text{s1=Low}, \text{s2=High}, \text{s3=High}) = \frac{P(\text{s1=Low}, \text{s2=High}, \text{s3=High} | \text{Bad}) \cdot P(\text{Bad})}{P(\text{s1=Low}, \text{s2=High}, \text{s3=High})}
      $$
      - Numerator: $P(\text{Low}|\text{Bad}) \cdot P(\text{High}|\text{Bad})^2 \cdot P(\text{Bad}) = 0.8 \cdot (0.2)^2 \cdot 0.5 = 0.016$.
      - Denominator: $[0.8 \cdot 0.04 \cdot 0.5] + [0.2 \cdot (0.8)^2 \cdot 0.5] = 0.016 + 0.064 = 0.08$ (Good-state term dominates).
      - Posterior: $0.016 / 0.08 = 0.2$.
    - $0.2 < 0.5$: Agent *does not block* on Low signal! Pivotality swamps their evidence.
    - If all agents follow this, $P(\text{Pass} | \text{Bad}) = 1$ (no one blocks). But this isn't equilibrium—agents might mix strategies or adjust thresholds. In practice, blocking probability plummets. Conservatively, assume agents block only if posterior $\geq 0.5$. Since $0.2 < 0.5$, $P(\text{block} | \text{Low}) \approx 0$. Then:
      - $P(\text{Pass} | \text{Bad}) \approx P(\text{all High} | \text{Bad}) + P(\text{exactly one Low}) \cdot P(\text{no block on Low}) \approx (0.2)^3 + 3 \cdot (0.2)^2 \cdot 0.8 \cdot 1 = 0.008 + 0.096 = 0.104$.
    - Failure rate jumps to ~10.4%—worse than $N=1$ (20%) and $N=2$ (4%).

  - **Large $N$ (Many veto-holders)**:
    - Pivotality: Agent conditions on $N-1$ others approving. As $N$ grows, $P(\text{all others approve} | \text{Bad}) \to 0$ (since $P(\text{High} | \text{Bad}) = 0.2 < 1$), but $P(\text{all others approve} | \text{Good}) \to (0.8)^{N-1}$ (slowly). The likelihood ratio favors Good overwhelmingly.
    - Example: For $N=5$, $P(\text{Bad} | \text{s1=Low}, \text{4 approvals}) \approx$ negligible (compute: numerator $0.8 \cdot (0.2)^4 \cdot 0.5 = 0.00064$, denominator $\approx 0.5 \cdot (0.8)^4 \cdot 0.8 = 0.2048$, posterior $\approx 0.003$).
    - Agents almost never block. $P(\text{Pass} | \text{Bad}) \to 1$ as $N \to \infty$.

  **Result**: Adding veto-holders initially helps (from $N=1$ to $N=2$), but beyond a point ($N \geq 3$), caution declines. By $N=3$, the system is less cautious than a single gatekeeper; for large $N$, it becomes reckless. The "many watchdogs" intuition fails because thresholds adjust endogenously: each agent's pivotality event ("others approved") becomes overwhelming evidence *for* the proposal, making them reluctant to block. 

  #### Why the Unilateralist's "Solution" Is Self-Defeating
  Your thesis's second part is spot-on: the standard remedy for the unilateralist's curse—concentrate action power, add veto points—collapses under its own logic. 
  - In the unilateralist's curse, multiplying actors *lowers* the chance of a Bad outcome because each agent's action threshold rises (they infer pessimism from others' inaction). Example: With $N=2$, $P(\text{Bad outcome} | \text{Bad}) = P(\text{at least one acts} | \text{Bad})$. If agents act only on High signals and condition on pivotality, they act less eagerly (e.g., $P(\text{act} | \text{High}, \text{Bad})$ drops), reducing risk.
  - But in distributed vetoes, multiplying veto-holders *raises* $P(\text{Pass} | \text{Bad})$ because each blocker's threshold *falls* (they infer optimism from others' approval). The unanimity rule amplifies this: pivotality directly rewards approval, punishing blockers. 

  Thus, replacing unilateral action with distributed vetoes swaps one pathology for another. The curse warns against dispersed action power, but veto institutions create dispersed *inaction* power, where pivotality induces timidity. The result isn't safety—it's recklessness disguised as caution.

  #### The Real Lesson: Informational Design Over Institutional Headcounts
  Your hunch about jury literature is apt (e.g., Condorcet’s paradox), but we'll avoid it per your request. The core insight is that the *number* of veto-holders is secondary; the key is *how information flows*. Designers must control three factors:

  1. **Observability of Others' Signals/Actions**: 
     - In our model, agents infer others' signals from their inaction (a weak proxy). If veto-holders *see* approvals (e.g., a public vote), pivotality effects strengthen, worsening the problem. 
     - Fix: **Isolate gatekeepers**. A single veto-holder chosen at random (ignoring others) faces no pivotality. For $K$ veto-holders, if one is randomly selected to review in isolation, $P(\text{Pass} | \text{Bad}) = P(\text{High} | \text{Bad}) = 0.2$ regardless of $K$—better than any $N \geq 3$ in the unanimity rule.

  2. **Correlation of Evidence**: 
     - If signals are correlated (common in real institutions), pivotality effects explode. Example: If all veto-holders rely on the same data source, one approval implies others agree, making blocking even harder. 
     - Fix: **Diversify evidence**. Independent signals reduce correlation, weakening pivotality. But our $N=3$ case already had independent signals and still failed—isolation is safer.

  3. **Threshold Setting**:
     - Rational agents lower thresholds endogenously. Designers can impose **fixed thresholds** (e.g., "block if $P(\text{Bad} | \text{signal}) \geq 0.3$"), but this requires paternalism and ignores information aggregation.
     - Better: **Designated skeptics**. A single blocker held accountable for misses (no pivotality) outperforms committees. In our model, one skeptic achieves $P(\text{Pass} | \text{Bad}) = 0.2$; three veto-holders under unanimity suffer $\geq 10.4\%$.

  #### Conclusion: Why Your Thesis Holds
  Distributed veto power is a weaker safeguard than advocates suppose because:
  1. **Threshold adjustments dominate headcounts**: Pivotality in veto institutions forces agents to lower blocking thresholds, offsetting the "wisdom of crowds." Beyond a small $N$, caution decreases—sometimes below a single gatekeeper.
  2. **The cure is self-defeating**: The unilateralist's curse prescribes veto points, but these create a mirror-image problem where pivotality favors approval. The result isn't safety but institutional timidity.
  3. **Information trumps structure**: The real fix isn't more veto-holders but smarter information flow—randomization, isolation, and diversification break pivotality.

  Your provocation hits hard: the migration of decision theory into institutional design has birthed a "curse of unanimity." Advocates who preach veto points as the answer to the unilateralist's curse are unwittingly reinscribing its logic. The lesson isn't to concentrate power—it's to clarify how agents know what they know. As you craft your piece, hammer this: good institutional design filters noise, not just options.
