  Step 1: Outline the positions we want to capture.

  The main dispute is about transworld identity and counterpart theory. The standard positions:

  1. **Ersatzism (or Abstract World Theory)**: Worlds are abstract representations. Individuals are world-bound, but we have counterparts across worlds based on similarity. (This is similar to David Lewis's counterpart theory but without concrete worlds.)

  2. **Concrete Modal Realism (Lewisian)**: There are concrete possible worlds, and individuals are world-bound. Cross-world identity is replaced by counterpart relations based on similarity.

  3. **Transworld Identity**: Individuals can exist in multiple possible worlds. Identity is primitive or based on some essential properties.

  4. **Haecceitism**: Allows transworld identity and also holds that there can be non-qualitative differences (bare identities). So two worlds can be qualitatively identical but differ only in which individual is which (by haecceity).

  5. **Anti-Haecceitism**: Transworld identity but without bare differences. If two individuals are qualitatively identical, they are the same individual.

  6. **Primitivism about Modality**: Modal facts are primitive and not to be analyzed in terms of worlds and individuals.

  We also have:

  7. **Fictionalism about Worlds**: The talk of worlds is just a useful fiction.

  But we are focusing on the metaphysical positions about the characters.

