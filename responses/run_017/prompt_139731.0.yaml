  Below is a decision tree designed to sort readers' metaphysical positions based on their interpretations of the characters in your novel. The tree uses eight nodes (questions) that reference specific cases from your books and can be answered by an intelligent reader without philosophical training. Each question focuses on concrete, observable details from the text (e.g., variations in origin, plot roles, or disclosures), avoiding direct questions about "sameness" or "identity." The tree is structured to branch through logical space, with answer patterns mapping to named metaphysical positions. Empty cells in the logical space are noted and explained. Finally, I address the nature of fictional characters and place your authorial stance on the tree.

  ---

  ### **Decision Tree**
  Answer the questions based on your interpretation of the cases in the novel. Each question has two or three options.

  1. **Changed Origin (Book 2):** In Book 2, Madeleine has a different birthplace and parents. Could this variation have been part of Book 1's story without altering who the character is?  
     - **A:** Yes, it could have been part of Book 1.  
     - **B:** No, it could not have been part of Book 1.  

  2. **Betrayal Bystander (Book 3):** In Book 3, a woman with Madeleine’s exact history and temperament is a bystander to the betrayal. Is this woman presented as if she *could* have committed the betrayal in this book’s version of events?  
     - **A:** Yes, she could have committed it (the story allows it).  
     - **B:** No, she could not have committed it (the story excludes it).  

  3. **Indiscernible Pair (Book 4):** Cécile and Céline are indistinguishable and both resemble Book 1’s Madeleine. Could the story of Book 4 have contained only one of them (e.g., just Cécile) without losing anything about Madeleine?  
     - **A:** Yes, one would suffice.  
     - **B:** No, both are needed.  

  4. **Far-Side Variant:** Imagine a variant where an event on the far side of the galaxy changes, but Madeleine is unaffected. If this variant were a book, would it require explicitly stating that Madeleine is "the same" as in Book 1?  
     - **A:** Yes, it would need explicit confirmation.  
     - **B:** No, it would not need explicit confirmation.  

  5. **Non-Transitive Chain:** Book 2’s Madeleine is very similar to Book 1’s; Book 4’s is very similar to Book 2’s; but Book 1’s and Book 4’s share no similarities. If Book 4’s character claimed to be Book 1’s Madeleine, would the story treat this as a mistake?  
     - **A:** Yes, it would be a mistake.  
     - **B:** No, it would not be a mistake.  

  6. **Governess Disclosure (Book 1 vs. Book 3):** In Book 3, the governess-Madeleine identity is never revealed. Could Book 3’s text be revised to disclose this without contradicting its existing plot?  
     - **A:** Yes, it could be added.  
     - **B:** No, it could not be added.  

  7. **Never-Born Variant:** In a variant where Madeleine is never born, is this a story about *her* (e.g., "a world where Madeleine doesn’t exist"), or about a world lacking her?  
     - **A:** About her (her absence is part of her story).  
     - **B:** About a world without her (not about her).  

  8. **Trait vs. Plot Weighting:** When a character resembles Madeleine but has a different plot role (e.g., the bystander in Book 3), what feels more decisive for calling her "Madeleine": her intrinsic traits (personality, history) or her narrative function (e.g., betrayer)?  
     - **A:** Intrinsic traits.  
     - **B:** Narrative function.  

  ---

  ### **Logical Space and Branching**
  The tree is built from the logical space defined by your distinctions. Each question isolates a dimension of the dispute:
  - **Q1 (Changed Origin):** Tests if origin is essential (world-bound views say "B").
  - **Q2 (Betrayal Bystander):** Distinguishes intrinsic traits (A) from narrative function (B). Also tests if plot roles are fixed.
  - **Q3 (Indiscernible Pair):** Probes if cross-book relations can hold within a book (A: no, B: yes).
  - **Q4 (Far-Side Variant):** Checks if bare differences matter (A: yes, haecceitism; B: no, anti-haecceitism).
  - **Q5 (Non-Transitive Chain):** Tests transitivity (A: required, B: not required).
  - **Q6 (Governess Disclosure):** Asks if identity claims are world-dependent (A: no, B: yes).
  - **Q7 (Never-Born):** Reveals if characters transcend existence in worlds (A: yes, B: no).
  - **Q8 (Trait vs. Plot):** Weights similarity (intrinsic vs. narrative).

  Answer patterns map to positions in this space. The tree starts with Q1 because it splits essentialism (world-bound views) from non-essentialism, a major fault line. Q2 is next as it separates trait-based from plot-based similarity weighting. The ordering ensures that later questions (e.g., Q4 on bare differences) only appear in branches where they resolve ambiguities.

  #### **Empty Cells in Logical Space**
  - **Cell 1 (A in Q1, B in Q2, B in Q3):** Claims origin isn’t essential (Q1-A), plot is decisive (Q2-B), but both characters in the indiscernible pair are needed (Q3-B). Empty because incoherent: if plot is weighted heavily, one character should suffice to "play the role."
  - **Cell 2 (B in Q1, A in Q4, A in Q5):** Claims origin is essential (Q1-B), bare differences matter (Q4-A), but transitivity isn’t required (Q5-B). Empty and unattractive: transitivity is central to identity, and haecceitism (Q4-A) usually assumes it.
  - **Cell 3 (A in Q6, B in Q7):** Claims identity disclosures can be added anywhere (Q6-A) but a never-born variant isn’t about Madeleine (Q7-B). Empty because Q6-A implies characters are world-independent, conflicting with Q7-B.
  - **Why empty?** 3/8 cells are incoherent (logical contradictions), 2/8 are unattractive (no theorist defends them), and 3/8 are unoccupied but possible (no one has articulated them).

