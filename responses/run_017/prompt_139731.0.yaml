  ### **Leaves (Metaphysical Positions)**
  Based on answer patterns, the tree ends at seven leaves. Names are from philosophy where standard; else, summarized plainly. Contested labels are noted.

  | Leaf (Position)                                                                 | Key Answers (Pattern)                                                                                              | Description                                                                                                                                                    |
