  | **3. Transworld Identity (Anti-Haecceitist)**                                   | Q1=A, Q6=B, Q4=B, Q5=A                                                                                         | Madeleine exists in multiple worlds. Bare differences (Q4=B) don’t matter; identity is qualitative. Transitive (Q5=A). Worlds are concrete.                 |
  | **4. Transworld Identity (Haecceitist)**                                        | Q1=A, Q6=B, Q4=A, Q5=A                                                                                         | Madeleine exists in multiple worlds. Bare differences (Q4=A) can matter (e.g., far-side variant). Transitive (Q5=A). Worlds are concrete.                   |
  | **5. Counterpart Theory (Strong Similarity)**                                   | Q1=B, Q2=A, Q3=A, Q5=B                                                                                         | Books are worlds. No identity across worlds; counterparts based on intrinsic similarity. Not transitive (Q5=B). Cécile/Céline aren’t both counterparts (Q3=A). |
  | **6. Counterpart Theory (Narrative Role)**                                      | Q1=B, Q2=B, Q3=A, Q5=B                                                                                         | Books are worlds. Counterparts defined by plot function. Not transitive (Q5=B). Bystander (Q2=B) isn’t a counterpart.                                        |
  | **7. Modal Primitivism**                                                        | Q7=A, Q6=A, inconsistent with Q1–Q5                                                                           | Modal facts (e.g., "Madeleine could have had different parents") are brute; no world-analysis needed. All books are "stories," not worlds.                  |

  #### **Notes on Leaves**
  - **Contested Labels:** "Transworld identity" is disputed; some philosophers reject it as incoherent. "Haecceitist" vs. "anti-haecceitist" is standard.
  - **Indistinguishable Leaves:** **Leaf 1 (world-bound similarity)** and **Leaf 3 (transworld identity anti-haecceitist)** agree on all cases if similarity weights identity maximally. The difference is verbal: one says "very similar individuals," the other says "same individual." No case distinguishes them (per your sixth requirement). The difference is real but collapses in practice; it’s about whether we call the relation "identity" or "counterpart."
  - **Missing Distinctions:** The tree omits "books as abstracta" (covered in the closing section) and non-transitive transworld identity (unattractive; no theorists hold it).

