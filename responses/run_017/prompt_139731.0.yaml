    - **Leaf 4 (haecceitism) should be set aside.** Use a different tree where "worlds" are readerly constructs, and bare differences are textual ambiguities.
  - **Recommendation:** Use this tree but note that for fiction, concrete-world views are metaphorical. The core dispute (e.g., essentialism vs. conventionalism) remains.

