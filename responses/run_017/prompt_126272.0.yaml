answer: |-
  Below is a complete game plan designed to achieve your goals—immersive, minimal lecture, candy-based, and focused on making students *feel* the two modes of reasoning. The game is called **"The Human Lottery"**.

  ---

  ### **Game Setup & Rules**  
  **Premise**: Students bet candy on whether humanity's total population will be **Small** (200 billion) or **Big** (200 trillion).  
  **Candy Economy**:  
  - Each student starts with 10 candies.  
  - Bets are whole candies placed in **Small** or **Big** jars at the front.  
  - Winning jar: Pays 2x candy (e.g., bet 5, win 10 back). *But we never resolve the bet*—this forces serious engagement.  

  **Key Twist**:  
  - **Round 1**: No extra info.  
  - **Round 2**: Half the room (Group A) gets a slip: *"You are the 90th human ever born."*  
    Group B gets no slip (representing "typical" humans).  

  **Time Allocation**:  
  - Intro & Round 1: 10 min  
  - Round 2: 10 min  
  - Group Discussion: 15 min  
  - Debrief: 10 min  

  ---

  ### **Game Flow (45 Minutes)**  
  **1. Intro (3 min)**:  
  - *"We’re betting on humanity’s fate: Will there be 200 billion humans total (Small)? Or 200 trillion (Big)? Small is 20x more than have ever lived; Big is 20,000x more. You have 10 candies. Bet wisely—winning pays double, but you’ll only collect if we confirm the answer someday!"*  
  - *No theory, no jargon.* Show two jars labeled **Small** and **Big**.  

  **2. Round 1 (7 min)**:  
  - Students place candies in jars. Record bets on a board:  
    - e.g., "Small: 4 candies | Big: 6 candies".  
  - *Teacher role:* Silently observe. Don’t explain, just nudge: *"Place bets based on what feels right."*  

  **3. Round 2 Setup (3 min)**:  
  - Randomly split room. Give Group A slips: *"You are the 90th human ever born."*  
  - Group B gets nothing. *"Rebet with this new info."*  

  **4. Round 2 (7 min)**:  
  - Students bet again (new 10 candies). Record Group A vs. Group B bets separately.  

  **5. Group Discussion (15 min)**:  
  - **Prompt 1**: *"Why did you change (or not change) your bets in Round 2?"*  
    - Target Group A: *"Did being ‘90th’ make Small seem more likely? Why?"*  
    - Target Group B: *"Why stick with Round 1 bets?"*  
  - **Prompt 2**: *"Does it feel fair to bet heavily on Big just because you exist? Or does betting on Small after getting ‘90th’ feel like cheating?"*  
  - **Goal**: Let students articulate the tension. Note phrases like "more people = more chances to exist" or "being early means fewer left".  

  **6. Debrief (10 min)**:  
  - Reveal the two philosophies:  
    > *"Some of you reasoned like **Self-Sampling**: ‘I’m a random human. If I’m *early* (like 90th), humanity must be small.’*  
    > *Others reasoned like **Self-Indication**: ‘Me existing *at all* means Big worlds are likelier—more tickets in the lottery!’"*  
  - **Map Moments**:  
    - *Self-Sampling in action*: Group A shifting to Small in Round 2 ("I’m early → fewer people exist").  
    - *Self-Indication in action*: High Big bets in Round 1 ("Existing suggests many people").  
  - **The Twist**:  
    - *Self-Sampling*: Group A’s shift makes sense—being early is likelier in Small worlds.  
    - *Self-Indication*: Group A *shouldn’t* shift—existing early in Big worlds balances the odds.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **"Betting feels arbitrary"**:  
     - *Fix*: Stress the candy payoff (even if unresolved). Ask: *"If you lost real candy, how would you bet?"*  

  2. **Confusion about "evidence from existence"**:  
     - *Fix*: Use analogies in discussion:  
       - *Self-Indication*: "If you win the lottery, you’d suspect many players (not that you’re lucky)."  
       - *Self-Sampling*: "If you draw a red marble, you’d guess the jar has few reds."  

  3. **Group A doesn’t shift bets**:  
     - *Lean in*: *"Did anyone *not* change? Why? Does ‘being 90th’ feel irrelevant if Big is likely?"* (This sets up SIA).  

  4. **Overly simplistic bets**:  
     - *Fix*: Encourage extreme bets: *"If you’re 90% sure, bet 9 candies!"*  

  ---

  ### **What the Game Can’t Show (Clarify in Debrief)**  
  - **Self-Indication’s cancellation**:  
    > *"Under Self-Indication, being ‘early’ doesn’t shift your bet because two things cancel out: (1) Big worlds have more people (so you’re *less* likely to be early), but (2) Big worlds are *more likely* because you exist. Net effect: No change!"*  
  - **Philosophical stakes**:  
    > *"Self-Sampling favors doom soon (‘we’re probably not early’). Self-Indication says we’re likely to survive—but is that *too* optimistic?"*  
  - **Real-world relevance**:  
    > *"This isn’t just candy. It’s the **Doomsday Argument**—predicting human extinction using probability."*  

  ---

  ### **Why This Works**  
  - **Minimal lecture**: The game *is* the explanation. Tension arises organically when Group A shifts bets.  
  - **Candy incentivizes engagement**: Unresolved payoffs create "skin in the game."  
  - **Debrief mirrors their reactions**: Students see their own reasoning in the frameworks.  
  - **Twist clarifies**: Group A’s divergence highlights both philosophies’ intuitions.  

  **Pro Tip**: Bring sour candy—philosophy tastes better when it makes you pucker.
