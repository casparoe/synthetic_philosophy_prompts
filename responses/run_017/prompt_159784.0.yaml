  Next, crafting replies that address each point but also note where they're soft. The reply to precision being a gain could emphasize that gain modulation reflects reliability, but I need to admit it's inferential. For the philosophers' constitutive question, explaining the non-conceptual nature of registration might help, but conceding it's a challenge is necessary.

