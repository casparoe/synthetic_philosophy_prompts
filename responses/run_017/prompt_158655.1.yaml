  ### Decision Tree: Virtual Objects and Harms  
  A taxonomy built from cases. Answer each question based on your intuition about the scenario. Proceed to the next node based on your answer. Conventional position names appear only at the leaves.

  1. **After a permanent server shutdown, the data sits unread on a drive in a drawer. Does your virtual house still exist?**  
