  ### Leaves (Positions)  
  Each leaf includes:  
  - **Name** (conventional or "unnamed"); **Most awkward commitment**; **Cathedral compensation implication**.  

  **Leaf A: Digital Artifact Realism**  
  - *Commitment:* The cathedral exists like a deleted document—real but intangible.  
  - *Compensation:* Yes, as data restoration or equivalent in-game value; real effort was converted.  

  **Leaf B: Illusionism**  
  - *Commitment:* Player effort is irrelevant; virtual objects are patterns, not possessions.  
  - *Compensation:* No; loss is fictional, like a canceled D&D campaign.  

  **Leaf C: Labor-Based Realism**  
  - *Commitment:* Effort defines reality—cathedral’s 4,000 hours make it real; the earned item does not.  
  - *Compensation:* Yes, proportional to labor (e.g., in-game currency for hours worked).  

  **Leaf D: Uniform Virtual Realism**  
  - *Commitment:* Rollback and cathedral are equally real; server persistence defines existence.  
  - *Compensation:* Yes, but only if the item was persistent (unlike rollback’s snapshot).  

  **Leaf E: Digital Sentientism**  
  - *Commitment:* NPCs can suffer without feeling; harm is behavioral, not experiential.  
  - *Compensation:* No for objects; cathedral is inert, so no moral claim.  

  **Leaf F: Player-Exclusive Harm**  
  - *Commitment:* NPC "harm" is code; only players experience loss.  
  - *Compensation:* Only if distress occurred (e.g., cathedral owner was traumatized).  

  **Leaf G: Monetary Realism**  
  - *Commitment:* Cash investment transmutes virtual to real; $200 item is property.  
  - *Compensation:* Only if real money was spent; cathedral labor is irrelevant.  

  **Leaf H: Consistent Fictionalism**  
  - *Commitment:* Money and effort are equally fictional; loss is always imaginary.  
  - *Compensation:* Never; compensation validates illusion.  

  **Leaf I: Psychological Reductionism**  
  - *Commitment:* Avatar harm reduces to player distress; no virtual "assault" exists.  
  - *Compensation:* Only for psychological harm (e.g., therapy costs), not objects.  

  **Leaf J: Dual Harm Realism**  
  - *Commitment:* Avatar violation is harm to both player and virtual entity.  
  - *Compensation:* Yes for cathedral, as destruction of created identity.  

