     - **No** → Go to 3  

  2. **If fans re-host the *same* world data years later with different players, is it the same world?**  
     - **Yes** → Go to 4  
     - **No** → Go to 5  

  3. **When the server is running but nobody visits or renders your house for months, does it exist during that time?**  
     - **Yes** → Go to 6  
     - **No** → Go to 7  

  4. **A duplication exploit creates 5,000 identical swords. Are they all distinct real objects?**  
     - **Yes** → Go to 8  
     - **No** → Go to 9  

  5. **An admin deletes a player-built cathedral (4,000 hours of work, no backup). Is this a genuine loss?**  
     - **Yes** → Leaf A  
     - **No** → Leaf B  

