answer: |-
  Rousseau's argument about actors in the *Letter to d'Alembert* centers on the transformative psychological harm inherent in the profession. When Rousseau describes the actor "divesting himself of his own character," he refers to the systematic process of self-alienation required for the craft: the actor must suppress their authentic personality, emotions, and moral disposition to embody diverse, often contradictory, roles and passions. This habitual abandonment of the true self is not merely dishonest—it fundamentally fractures the actor's psychological integrity. By repeatedly adopting artificial sentiments and depending on external validation (applause) for these performances, the actor cultivates a fluid, unstable identity detached from personal conviction. Consequently, this erodes the capacity for sincerity and constancy essential to republican citizenship, where the citizen must express their genuine will transparently to participate in forming the *general will*. The actor’s life of perpetual pretense makes them incapable of the unified selfhood required for civic virtue—a self rooted in inner truth and communal accountability. Thus, the danger is not just individual hypocrisy but the corrosion of the psychological preconditions for a political community based on mutual trust and collective self-governance. The public honor bestowed on actors legitimizes this fragmentation, while spectators, by indulging in the illusion, passively endorse a culture of dissimulation that undermines civic transparency.

  Your friend's reductive reading—that Rousseau objects solely to hypocrisy—captures only the surface of the argument. Rousseau *does* condemn pretense, but the deeper thrust is the *ontological and civic consequences* of professionalized self-estrangement: the actor's loss of a coherent, autonomous self. Your interpretation, however, fully grasps Rousseau's republican framework. The actor’s psychological disintegration directly threatens the ideal of the citizen as a unified agent whose public actions align with inner sentiment, enabling the authentic expression of the general will. This argument is pivotal to the *Letter*'s broader critique. Rousseau contrasts the theater—a passive, isolating spectacle that fosters emotional escapism and fragmented identity—with participatory civic festivals. In festivals, citizens actively embody their own values through collective rituals (like dances or games), reinforcing social bonds through shared, transparent expression. Theater encourages spectators to admire artificial emotions; festivals cultivate *amour-propre* (collective self-love) by engaging citizens as sincere participants in their community’s life. The actor’s corrupting role-playing exemplifies why theater is antithetical to the active, integrated civic existence festivals promote.

