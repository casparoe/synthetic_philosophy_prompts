answer: |-
  ### Parfit's Hitchhiker Game Design  
  **Goal:** Illustrate that being a *type of person* who pays even when it’s costly and pointless is key, without reputation or commitment devices.  

  **Materials:**  
  - Index cards (1 per player for scores, + extras for roles/pairs)  
  - Pens  
  - 2 bottles of wine (prizes)  
  - Envelopes (for round 5 anonymity)  

  **Setup (5 min):**  
  - Assign each player a unique number (1–25).  
  - Hand out scorecards: "Tokens: Start=10. Round 1:__, Round 2:__,... Total:__"  
  - Explain rules simply:  
    > "You’ll be paired each round. One is **Driver**, one is **Rider**.  
    > **Driver** chooses: GIVE RIDE or NO RIDE.  
    > If NO RIDE: Both get 0 tokens.  
    > If GIVE RIDE: **Rider** then chooses: PAY or NOT PAY.  
    > - PAY: Driver +4, Rider +3  
    > - NOT PAY: Driver –1, Rider +5"  

  **Rounds 1–4 (30 min total, 7 min/round):**  
  1. **Pair/Role Assignment:**  
     - Draw colored cards from a hat to pair players (e.g., same color = pair).  
     - In pairs, flip a coin: Heads = Driver, Tails = Rider (re-draw if odd number).  
  2. **Play:**  
     - Pairs discuss openly (Driver decides first, then Rider if ride given).  
     - Players record token changes privately.  
  3. **Key:** No enforcement. Players can lie.  

  **Round 5 (10 min):**  
  - **Announce:** "Final round. No future interactions. Partners are *anonymous*."  
  - **Anonymity Protocol:**  
    - Drivers write "GIVE" or "NO" on a card + their number. Riders write "PAY" or "NOT" + their number.  
    - Collect all in envelopes. Facilitator matches random Driver-Rider pairs.  
    - **Crucial:** If Driver chose "GIVE" and Rider "PAY": Driver +4, Rider +3.  
      If Driver "GIVE" and Rider "NOT": Driver –1, Rider +5.  
      If Driver "NO": Both 0.  
  - Announce outcomes by number (e.g., "Player 5: +3").  

  **Scoring & Prizes (5 min):**  
  - Highest token totals win wine.  

  **Debrief (20 min):**  
  - **Map to Parfit:**  
    - Rounds 1–4: "Why did Riders pay? *Reputation* for future rides."  
    - Round 5: "Driver gave a ride? They gambled you were the *type* to pay despite no benefit. Rider paid? You’re that *type*—it’s who you are, not what you gain."  
  - **Predictable Issues:**  
    - Game theorist leaks "equilibrium" early: Redirect with, "Test if that plays out in Round 5."  
    - Round 5 cooperation: "Some paid anyway—*disposition* beat logic."  
  - **Honest Gap:** The game can’t prove *why* being this "type" is rational long-term. Explain: "Life has many anonymous interactions—being ‘trustable’ gets you opportunities others miss."  

  **Failure Risks:**  
  - **Misleading Reputation:** If players ignore Round 5 anonymity ("I recognized their voice!"), stress the *intent*: "You knew it was one-shot—why pay?"  
  - **False Positive:** High Round 5 cooperation from altruism, not disposition. Mitigate by highlighting *cost*: "You paid 2 tokens for nothing. What made you do it?"  
  - **Time Crunch:** If pairing lags, skip a round. 70 min is tight but feasible with brisk facilitation.  

  **Why This Works:**  
  Round 5 forces the core dilemma: Paying is personally costly yet necessary for the Driver to trust you *without* reputation or contracts. The "type" insight emerges organically.
