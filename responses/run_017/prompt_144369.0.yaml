  - No-defence-for-willful-ignorance: this doctrine says that if you deliberately avoid knowledge, the law treats you as if you knew. So the utility of deliberately avoiding knowledge is low because you are still held liable. This is not a counterexample to step 4 because step 4 is about the value of information for the decision maker. In this case, the agent might want to avoid knowledge to avoid legal obligations. But if they avoid knowledge, they are still held liable. So the utility of avoiding knowledge is low. This does not contradict the theorem because the theorem says that ex ante, having the information is at least as good as not having it. But if the law punishes willful ignorance, then not having the information might lead to punishment. So the agent might prefer to have the information to avoid being punished for willful ignorance? Actually, the agent might prefer to have the information so they can act appropriately and avoid liability. So the information is valuable. This case does not seem to be a counterexample to the theorem. Instead, it might be a case where the agent has an incentive to acquire the information to avoid the penalty. So it does not cut against step 4.

