  Based on your cases and requirements, here are three candidate principles designed to be implementable as comparison functions over `(person, harm)` lists. Each principle is defined by a **comparator function** `P(A, B) -> {A, B, Incomparable}` for outcomes A and B. We derive verdicts from their outputs.

  ---

  ### **Candidate 1: Leximin with Aggregated Comparable Harms**
  **Principle**:  
  1. **Group harms by severity tier** (e.g., death > loss of limb > severe burns > rash).  
  2. Compare outcomes **tier by tier, worst-first**:  
     - If one outcome has a worse *single worst harm* in a tier, it loses.  
     - If tied in worst harm, compare the *number* of people experiencing that harm tier, discounted by √n.  
     - If still tied, proceed to the next-worst harm tier.  
  3. **Special obligations**: If you have a pre-existing duty (e.g., to your child), their harm counts 10× in aggregation.  

  **Clause motivations**:  
  - **Tiers** handle cases 3 (death > hands) and 4 (hand ≫ rashes, regardless of numbers).  
  - **√n aggregation** handles cases 1 (√5 ≈ 2.24 > √1) and 2 (√2 ≈ 1.41 ≈ √1), explaining your diminishing sensitivity.  
  - **Special obligations** handle case 5.  

  **Verdicts on your cases**:  
  | Case | Verdict | Match? |  
  |------|---------|--------|  
  | 1    | Save 5  | Yes    |  
  | 2    | Save 2? | Yes (√2≈1.41 > √1; but close) |  
  | 3    | Save life | Yes (death tier > hand tier) |  
  | 4    | Save hand | Yes (hand tier ≫ rash tier) |  
  | 5    | Save child | Yes (10× weight) |  
  | 6    | **Incomparable** | **No** (you prefer no one? Principle can't decide) |  
  | 7    | **Save 5?** | **No** (identical harms to case 1, but you resist) |  
  | 8    | Save 1 bio-person? | **Incomparable** (tiers: death=death, but minds are duplicates) |  
  | 9    | Lottery | **Save 1** (aggregation favors certainty; but you prefer lottery) |  
  | 10   | Hate coin flip | Yes (saving 5 is required by √5>√1; randomness violates duty) |  

  **New cases**:  
  - 100 vs. 1 identical harms: Save 100 (√100=10 > √1).  
  - 5 lose hand vs. 1 lose two hands: **Incomparable** (different harm tiers; no aggregation across types).  
  - Identified vs. statistical strangers: Same weight (impartial).  

  **Dropped verdicts**:  
  - **Case 6**: Forces incomparability, but you feel the single patient is worse off individually.  
  - **Case 7**: Requires saving 5, but your intuition rejects active killing.  
  - **Case 9**: Requires saving one, but you prefer lottery.  
  **Trade-off**: Drops your resistance to active harm (7) and lottery (9) for tiered harm comparability.  

  ---

  ### **Candidate 2: Ex Ante Equal Chances + Minimize Expected Harm**  
  **Principle**:  
  1. **Ex ante fairness**: Each person must have equal survival chance *if feasible*.  
  2. **Minimize expected harm**: When chances are equal, choose the outcome with lower *expected total harm* (harm × probability).  
  3. **Harm equivalence**: Define a harm "exchange rate" (e.g., 1 death = 20 hand-losses).  

  **Clause motivations**:  
  - **Ex ante chances** handle cases 9 (lottery) and 10 (no coin flip: saving 5 gives unequal chances).  
  - **Harm equivalence** handles case 3 (if 1 death > 5 hand-losses, save life).  
  - **Expected harm** handles aggregation (case 1).  

  **Verdicts**:  
  | Case | Verdict | Match? |  
  |------|---------|--------|  
  | 1    | Save 5  | Yes    |  
  | 2    | Save 2  | Yes    |  
  | 3    | Save life | **Only if** 1 death > 5 hand-losses |  
  | 4    | Save hand | Yes (if death > ∞ rashes) |  
  | 5    | **Save 5** | **No** (no special weighting) |  
  | 6    | Save two? | **If** 1 death + 1 hand-loss < 2 hand-losses? (unclear) |  
  | 7    | Save 5? | **Yes** (same as case 1) |  
  | 8    | Save minds? | **If** 10k deaths > 1 death |  
  | 9    | Lottery | **Yes** (equal chances) |  
  | 10   | Save 5 | **Yes** (coin flip violates ex ante fairness for the five) |  

  **New cases**:  
  - 100 vs. 1: Save 100 (lower expected harm).  
  - 5 hands vs. 2 hands: Save 5 (if harms sum).  
  - Identified vs. statistical: Same (impartial).  

  **Dropped verdicts**:  
  - **Case 5**: Forces saving five strangers over your child.  
  - **Case 7**: Requires saving five, ignoring your active/passive distinction.  
  - **Case 4**: If rashes are non-zero harm, large n could force saving rashes (but you reject this).  
  **Trade-off**: Drops personal obligations (5) and harm incommensurability (4,6) for consistency in chances/expectations.  

  ---

  ### **Candidate 3: Threshold Deontology with Agent-Relative Weights**  
  **Principle**:  
  1. **Thresholds**: Harms are *incomparable* across types (death ≠ hands ≠ rashes).  
  2. **Agent-relative duties**:  
     - Default: Minimize number of people suffering worst-comparable-harm.  
     - If you cause harm *directly* (e.g., cutting power), it’s 10× worse than allowing it.  
     - Special relationships (e.g., your child) get 10× weight.  
  3. **When harms equal**: Maximize chances for each.  

  **Clause motivations**:  
  - **Thresholds** handle cases 3/4 (death ≫ hands ≫ rashes).  
  - **Agent-relative** handles cases 5 (child), 7 (active harm), and 10 (duty to save more).  
  - **Equal chances** handles case 9.  

  **Verdicts**:  
  | Case | Verdict | Match? |  
  |------|---------|--------|  
  | 1    | Save 5  | Yes (same harm, minimize victims) |  
  | 2    | Save 2  | Yes |  
  | 3    | Save life | Yes (death > hands) |  
  | 4    | Save hand | Yes (hands ≫ rashes) |  
  | 5    | Save child | Yes (10× weight) |  
  | 6    | **Incomparable** | **Partial** (if hands/feet incomparable) |  
  | 7    | **Save 1** | **Yes** (active harm 10× worse; 5×allowing death < 1×causing death) |  
  | 8    | Save 1 bio? | **Incomparable** (if minds are "persons") |  
  | 9    | Lottery | Yes (equal chances when harms tied) |  
  | 10   | Save 5 | Yes (duty to minimize victims without active harm) |  

  **New cases**:  
  - 100 vs. 1: Save 100 (if harms comparable).  
  - 5 hands vs. 1 two-hands: Incomparable (if harm types differ).  
  - Identified vs. statistical: Same weight.  

  **Dropped verdicts**:  
  - **Case 8**: No verdict (incomparability).  
  - **Case 6**: No verdict.  
  **Trade-off**: Drops completeness (6,8) but captures agent-relative intuitions (5,7,10).  

  ---

  ### **Reconciling Cases 9 and 10**  
  - **Ex ante vs. ex post**: Case 9 is a true dilemma (only one *can* be saved), so equal chances are fair. Case 10 is asymmetric (you *can* save five), so flipping a coin violates your duty to minimize harm.  
  - **All candidates** distinguish them:  
    - **Candidate 1**: Case 9 requires saving one (aggregation), Case 10 forbids randomness (duty).  
    - **Candidate 2**: Case 9 requires lottery (fairness), Case 10 requires saving five (expected harm).  
    - **Candidate 3**: Case 9 allows lottery (harms tied), Case 10 requires saving five (no active harm).  

  ---

  ### **Which Requirement to Abandon?**  
  - **Completeness** must be abandoned. Your verdicts in cases 6 (one vs. two harms) and 8 (copies) resist comparison.  
  - **Failure in production**:  
    - Input: `[(PersonA, death), (PersonB, hand)]` vs. `[(PersonC, hand), (PersonD, hand)]`.  
    - Output: **Incomparable** (no strict winner).  
    - System behavior: Defaults to inaction/status quo, or uses a random/policy-based tiebreaker.  
  - **Why**: Forces clarity on harm equivalence and avoids false precision.  

  ### **Recommendation**  
  Implement **Candidate 3** with explicit harm thresholds and agent-relative weights. It best captures your resistance to active harm (7), special obligations (5), and harm incommensurability (3,4,6). For incomparable cases (6,8), log a "no decision" and escalate to human judgment.  

  **Clause summary for implementation**:  
  ```python
  def compare(outcome_A, outcome_B, actor_relations={}):
    # Thresholds: Define harm tiers [death, permanent_disability, ...]
    tier_A = max_harm_tier(outcome_A)  # Worst harm in outcome
    tier_B = max_harm_tier(outcome_B)
    
    if tier_A != tier_B: 
        return outcome_A if tier_A < tier_B else outcome_B  # Lower tier wins
    
    # Same tier: Apply agent-relative weights
    A_score = sum( weight(harm, person, actor_relations) for (person, harm) in outcome_A )
    B_score = sum( ... for outcome_B )
    
    if abs(A_score - B_score) > threshold: 
        return outcome_A if A_score < B_score else outcome_B  # Lower harm wins
    else:
        return "Incomparable"  # Escalate to tiebreaker
  ```  
  **Weight function**:  
  - `weight(harm, person, actor_relations) = base_weight(harm) * active_multiplier(action_type) * relation_multiplier(actor, person)`  
  - Example: `active_multiplier("direct_cause") = 10`, `relation_multiplier("child") = 0.1`.  

  This satisfies cases 1-5,7,9,10; incomparable on 6,8; and forces explicit harm-tier definitions.
