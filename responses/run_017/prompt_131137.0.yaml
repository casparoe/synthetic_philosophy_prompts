  the reason etched in every curve and fold,
  the purpose written in the turquoise **throat**.
  She measured strength within the fused ankle **bone**,
  observed the silent, never-lifted **crest**,
  the vestigial, sharp-pointed wing **claw**.

  What use, she asked, this remnant, hooked **claw**?
  Its grip on nothing? Surely not for it
  to cling. Perhaps some ancient, lifted **crest**
  once signaled mates? Though now no tales are **fold**
