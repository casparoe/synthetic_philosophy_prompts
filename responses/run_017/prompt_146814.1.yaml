prompt: |-
  I'm taking a political theory seminar and we just did a two-week unit on moral revolutions — Williams's argument that nobody in the ancient Mediterranean world could have been argued out of slavery, because the concepts you'd need to even mount the argument weren't in the repertoire yet, and then Appiah's book on moral revolutions (the one with dueling, footbinding and Atlantic slavery) saying that what actually ends practices like these is a shift in the honor code rather than anybody being persuaded. My roommate, who does econ and loves being insufferable, took those two together and built what he calls the argument-proofness test: a practice is argument-proof at a time if there is no argument from premises its participants already accept that gets you to the conclusion that the practice is wrong; on that definition both slavery and dueling were argument-proof right up until the moment they collapsed; therefore moral argument never does any causal work, it's just the noise people make while interests and honor shift underneath, and if you want to change something the rational move is to stop arguing and go straight to making the practice unprofitable or embarrassing.

  The problem is I half believe him, and it's messing with something I actually care about. I used to march in a college band, and the hazing there is defended entirely in honor terms — we're a family, what we put the new kids through is what makes the bond real, anyone who complains is weak — and every safety or dignity argument I make just bounces off, because from inside that little honor world the premises aren't available. So, before I spend the next couple of years either arguing with my old section mates or instead just trying to get the thing banned and uncool: is the argument-proofness test actually Williams's claim, or have we smuggled something in?

  Concretely, I can't tell whether no argument was available from inside their outlook really implies that argument did no work in the change — surely somebody has to build the new premises, and doesn't that count as argument doing something? And I can't tell whether Appiah's honor mechanism means reasons are epiphenomenal, or whether argument can be one of the things that rewrites an honor code — and if it can, who has to be listening for it to do any work, the people actually doing the practice or the bystanders who's respect they want? Also, my roommate's version seems to slide toward saying slavery was fine for the people who practiced it, which I really don't want to be committed to, but I can't put my finger on where exactly the slide happens. And last thing: if interests, honor and argument all show up in every one of these cases, how would you even tell which one did the work, or is that question just badly posed?
reasoning: |-
  Okay, let me try to unpack this user's query. They're dealing with a complex theoretical issue from their political theory seminar, mixed with a personal concern about hazing in their college band. The roommate's "argument-proofness test" claims that moral arguments don't cause change; only shifts in honor or interests do. The user feels conflicted because their experiences with hazing seem to mirror this—arguments against it don't work, suggesting it's argument-proof.

  First, I need to clarify Williams and Appiah's actual positions versus the roommate's interpretation. Williams argued that certain practices like slavery couldn't be challenged with contemporary concepts, not that arguments were irrelevant in principle. The user is right to question if building new premises counts as argumentative work. Appiah focused on honor codes but acknowledged that reformers used arguments to reshape those codes. The roommate's test oversimplifies by ignoring how arguments contribute to shifting honor and interests.

  The user's hazing example is key. They describe an honor-based defense where safety arguments bounce off. This seems argument-proof, but the user wonders if arguments could still play a role in changing the honor code over time. They need to know whether continuing to argue is futile or if there's a way to reframe the debate. Also, the roommate's stance implies moral relativism (slavery was "fine" for its time), which troubles the user. I should address where that slide happens—probably in conflating psychological acceptance with moral justification.

  The deeper questions here are about agency and moral progress. The user wants to believe that reasoning matters, not just social forces. They might fear that giving up on argument means accepting that their bandmates' honor code is unassailable. I should emphasize that arguments can plant seeds for change by targeting bystanders or future generations, even if they don't immediately persuade practitioners.

  Methodologically, untangling causes (interests vs. honor vs. argument) is messy. The user is astute to ask if it's a badly posed question. In historical cases like slavery, all factors interacted—economic shifts made slavery less profitable, but abolitionists used moral arguments to make it dishonorable. The key is that arguments often mediate how interests and honor are perceived.

  For the hazing situation, the user needs practical advice. Since direct arguments fail, maybe shifting the honor narrative—highlighting alumni regret or contrasting with other groups' bonding methods—could work. Or targeting external stakeholders (college admins) who care about liability. But they shouldn't abandon argument entirely; instead, they should recalibrate its audience and form, linking dignity to the group's long-term reputation.

  Finally, the user's anxiety about moral relativism is valid. We must distinguish between explaining why past societies accepted slavery and endorsing their views. Williams was clear that we can condemn past injustices using our framework. The roommate's test risks naturalizing oppression as "fine" contextually, which is a dangerous implication the user rightly rejects.
answer: |-
  You've hit on a profound and tangled set of problems at the intersection of moral philosophy, history, and social change. Your roommate's "argument-proofness test" is a clever but potentially misleading synthesis of Williams and Appiah. Let's untangle it step-by-step:

  1.  **Williams vs. the "Argument-Proofness Test":**
      *   **Williams' Claim:** Williams argued that moral concepts available in a specific historical context ("thick ethical concepts") constrain what counts as a *persuasive* or even *intelligible* argument. For ancient slaveholders, concepts like universal human dignity, inherent rights, or inherent equality weren't part of their conceptual repertoire. An argument *starting from premises they already accepted* (e.g., natural hierarchy, necessity for civilized life, fate, property rights) wouldn't lead to the conclusion that slavery *as such* was wrong. They might recognize *particular* cruelties as wrong, but not the institution itself.
      *   **The "Test" Overshoots:** Williams does **not** claim arguments played *no role whatsoever* in the *long process* of undermining slavery. His point is about the *impossibility of immediate, internal refutation* for practitioners deeply embedded in that worldview. The "test" smuggles in a stronger claim: that because an argument couldn't *immediately refute the practice from within* at time T, argument *never* played any *causal role* in its eventual collapse. This is a non sequitur.

  2.  **Appiah vs. Epiphenomenalism:**
      *   **Appiah's Mechanism:** Appiah emphasizes that practices collapse when they become *dishonorable*, not primarily when they are proven *immoral* through abstract argument. Dueling died because it became ridiculous, the mark of a fool or a brute, not a gentleman. Footbinding became a sign of backwardness, not refinement. Slavery became incompatible with new ideals of national honor and respectable society.
      *   **Where Argument Fits In:** Appiah **does not** say argument is irrelevant. He shows reformers *used* arguments to *shift the honor code*. Abolitionists didn't just say "slavery is unprofitable" (though some did); they argued it was *barbaric*, *unchristian*, *a national shame* – attacks precisely aimed at *honor*. Arguments *redefined* what honor meant. The key shift is that the *audience* for these arguments wasn't necessarily the *die-hard practitioners* first, but the *wider society* whose esteem the practitioners craved. Arguments can be tools for *reshaping the social meaning and honor status* of a practice. Reason isn't epiphenomenal; it's a primary engine for *redefining* honor and interests.

  3.  **The Slide into Relativism (and Why It's Wrong):**
      *   **The Slide:** Your roommate's test implies: "If practice X was argument-proof for group Y at time T, then practice X was morally acceptable/fine *for group Y at time T*." This is the slide.
      *   **Where it Happens:** It happens in conflating *psychological acceptance/justification within a framework* with *moral justification simpliciter*. Williams is making a point about *epistemic availability*, not moral truth. He explicitly rejected relativism. We (now) can (and should) condemn ancient slavery *using our concepts*, recognizing that *they* lacked the conceptual tools to see it as we do. The "test" smuggles in a strong relativism by assuming that if an argument can't be made *from inside*, then no valid external critique exists, or worse, that the practice *was* justified for them. This is false.
      *   **The Suffering Was Real:** Slaves suffered, women endured the agony of footbinding, people died pointlessly in duels – *regardless* of whether their society's dominant conceptual scheme allowed for a critique of the *institution* causing that suffering. Their suffering provides a *reason* for condemnation, even if contemporaries couldn't articulate it institutionally.

  4.  **Untangling Causes: Interests, Honor, Argument:**
      *   **The Question Isn't Badly Posed, But the Answer is Messy:** It's crucial to ask what caused the change. However, expecting a single, clean answer ("it was ONLY interests!" or "ONLY honor!") is unrealistic. Social change is massively overdetermined.
      *   **How They Intertwine:**
          *   **Arguments Reshape Honor/Interests:** Moral arguments can *make* a practice seem dishonorable or against one's true interests (e.g., "True national honor requires abolishing this barbaric practice," "True efficiency requires wage labor").
          *   **Honor Shapes Interests:** Maintaining honor *is* an interest. Losing honor has tangible costs (social exclusion, loss of status/power). Making a practice dishonorable *makes* it against practitioners' perceived interests.
          *   **Interests Shape Honor/Argument:** Rising bourgeois classes found older aristocratic honor codes (like dueling) ridiculous and developed new codes (commercial respectability) that better served their interests. Economic shifts (like industrialization) can create groups with an interest in challenging old practices (e.g., factory owners vs. slave plantations) and provide new arguments.
          *   **The Role of "Bystanders":** This is key. Arguments often work first on the *margins* or on *bystanders*. Religious reformers, intellectuals, competing elites, or rising social groups absorb new arguments. They then use social, political, and economic pressure (making the practice embarrassing, inconvenient, or unprofitable) to force change on the practitioners. The practitioners might abandon the practice *because* it's now dishonorable/unprofitable, but that shift was often *precipitated* or *enabled* by arguments reshaping the landscape.

  5.  **Implications for Your Band Hazing Problem:**
      *   **Is it Argument-Proof *Now*?** Within the *current, insular* honor code of the band ("this builds family, complaining is weak"), safety/dignity arguments *from outside that code* likely *are* argument-proof for the committed core. They reject your premises.
      *   **Can Argument Do Work? YES, but strategically:**
          *   **Reframe Within Honor:** Don't attack "family" – argue that *true* strength/family/loyalty is shown by protecting each other, ensuring everyone thrives, and building bonds through shared *positive* achievement, not degradation. Argue that *real* tradition is evolving to protect members. Argue that hazing makes the band look *ridiculous* or *cruel* to outsiders/the college community, damaging its *honor* and reputation. Connect dignity *to* their concept of band pride.
          *   **Target Bystanders/Stakeholders:** Argue to college administrators (whose interest is liability, reputation, student well-being), alumni, other student groups, potential new members. Make hazing *dishonorable* in the *wider campus honor code*. Make it *unprofitable* (threaten funding, participation, recruitment). Gather data on injuries, dropouts, mental health impacts – use this to persuade stakeholders and reshape the narrative.
          *   **Plant Seeds:** Even if arguments bounce off now, they might resonate with some members or future members. They contribute to a slow erosion or provide justification for later action.
      *   **Don't *Only* Argue, But Don't *Stop* Arguing:** Your roommate is right that *just* arguing *at the practitioners* from a completely alien framework is often futile. But abandoning argument entirely is also wrong. The rational move is:
          1.  **Reframe Arguments:** Use their honor concepts against the practice.
          2.  **Shift the Audience:** Persuade stakeholders and bystanders who can apply pressure.
          3.  **Pursue Structural Change:** Work with authorities to ban it, enforce rules, create consequences (making it unprofitable/embarrassing).
          4.  **Build Alternatives:** Propose and champion positive, honor-building initiation rituals that fulfill the need for bonding without harm.

  **Conclusion:** The "argument-proofness test" misrepresents Williams (who was making a point about historical conceptual constraints, not the universal futility of argument) and oversimplifies Appiah (who shows arguments *redefining* honor). Argument isn't epiphenomenal; it's a crucial tool for *reshaping* the very concepts of honor and interest that drive change. However, it often works most effectively not by directly converting die-hard practitioners in the moment, but by persuading wider audiences, reframing the discourse, and providing the intellectual foundation for shifts in social meaning and pressure. For your band, combine strategic reframing within their honor framework, pressure from outside stakeholders (using arguments about safety, dignity, liability, and reputation to make hazing dishonorable/unprofitable), and practical efforts to create alternatives and enforce bans. Don't give up on reason, but deploy it wisely within the complex social machinery of honor and interest.
