prompt: |-
  I do a fortnightly column on the science and ethics of food, and I'm drowning in pitches. Roughly three or four times a week some advocacy group or certification scheme sends me a claim about which way of eating is easier on wild animals: grazing is fine because it's just grass, chicken is worse because it's really soy in disguise, crop farming kills field animals by the billion so maybe beef is the humane option after all, and so on. Some of these are clearly rigged, but others feel like they turn on something real that I can't quite put my finger on, and right now I just squint at each one separately, which is getting embarrassing. You're an expert in animal welfare science and environmental ethics: please think carefully about this before writing, brainstorm a bit out loud first about what the underlying structure of these claims even is, and then do the translating work. Don't send me citations or a reading list — I can't check them at the desk and my editor will cut them anyway — I want the reasoning itself.

  Here's the pile of half-formed distinctions I've been carrying around, which you should feel free to reorganize, rename, or throw out. First, the denominator keeps getting swapped: per kilogram of meat, per gram of protein, per calorie, per meal on a plate — and because a chicken is small and mostly grain-fed while a cow is big and partly grass-fed, the beef-versus-chicken ordering seems to flip depending on which of these you pick. Second, there's what I've started calling the replacement question: the claim's numbers always depend on an assumption about what the land, and the animals on it, would otherwise be doing — does the pasture revert to scrub, get ploughed for crops, or just carry someone else's herd. Third, the subtraction problem: most of the wild animals on that land would have died anyway, of cold, hunger, or predation, and if their populations are limited by something density-dependent then a death now partly cancels out deaths later, so the honest net effect might be much smaller than the raw body count suggests. Fourth, there's the currency problem of comparing a cow to a mouse to an insect killed by pesticide or by a plough share, which involves both how much suffering we're talking about per animal and how confident we should be that the smaller creatures feel anything at all. I need this as a procedure I can actually run: the questions in order, what counts as an answer good enough to move on from each one, where the procedure just stops and says no verdict available, and where it has to hand the decision back to me because it's a values call and not a factual one. I've got about twenty minutes per pitch, no access to paywalled agricultural datasets, and my editor wants a one-sentence verdict with an honest hedge attached, not a 900-word essay.

  Then run it on three things so I can see it working. One: a press kit for a pasture-raised chicken certification arguing that their birds are better for wild animals than beef, since the birds forage on land that stays grassland. Two: an NGO graphic claiming that if everyone who eats beef switched to chicken, some large number of wild animal deaths per person per year would be avoided. Three, and this is the one I'm nervous about: my own recurring line that grass-fed beef is the closest thing to a wild-animal-friendly meat, which I've written in at least three columns and sort of hope survives. I'd especially like the procedure to tell me something I don't want to hear in at least one of these, and I want you to be blunt about what the procedure cannot do — where it will misfire, which inputs will always be guesswork at my level of access, and how I'm supposed to phrase that in print without either pretending to a precision I don't have or sliding into saying every diet is equally fine.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is drowning in conflicting claims about food ethics and needs a practical framework to evaluate them quickly. Their pain points are clear: inconsistent metrics, hidden assumptions, and unspoken value judgments that make comparisons messy.

  First, I need to unpack the core issues they've identified. The denominator swapping is a classic unit problem - shifting from per kg to per calorie can reverse conclusions. Then there's the replacement question: what happens to the land if we change practices? This is crucial but often glossed over. The subtraction problem about population-level effects is biologically sound but rarely addressed in advocacy materials. And the currency problem - comparing suffering across species - is fundamentally philosophical.

  Hmm... what they really need is a decision tree that forces explicit choices at each tricky junction. But it must be executable within 20 minutes without specialized data. That means focusing on interrogating the pitch itself rather than hunting external sources. The key is spotting internal inconsistencies or buried assumptions.

  For the procedure design, I'll structure it as four sequential gates where failure at any stage stops the analysis. Start with denominator scrutiny - if the claim doesn't specify units or switches them arbitrarily, that's an automatic red flag. Then force the replacement scenario into the open. If it's undefined or implausible (like assuming pastures would turn into parking lots without cattle), that's another halt point. 

  The population adjustment is trickier since few pitches address it. Here I'd set a simple rule: if the claim ignores density dependence or presents gross mortality without net impact, we note that as a critical uncertainty. Finally, the sentience weighting can't be resolved scientifically - that's where the columnist must make an editorial call about which deaths "count" more.

  Testing this on their three examples: The pasture-raised chicken claim likely fails at the replacement gate - what happens to that grassland without chickens? Would it support wild grazers? The chicken-substitution graphic probably collapses under denominator scrutiny (deaths per what?) and ignores that freed-up grazing land might get converted to crops. And their beloved grass-fed beef line? Ouch - it may survive the first three gates but stumbles at the sentience question when considering pesticide impacts on insects versus cattle lives.

  The brutal truth this reveals: without specifying land use alternatives and value positions, most claims are unverifiable. In practice, that means many pitches won't survive the procedure - which is actually useful for filtering. For the verdict phrasing, I'd suggest something like "This claim depends heavily on unstated assumptions about [specific gap], making comparisons uncertain - though plausible if [conditional]." Not satisfying, but honest.
answer: |-
  Here's a cognitive triage procedure for wild animal impact claims, built from your insights. Think of it as a four-stage filter. Fail any stage, and the claim gets flagged as "unverifiable given current info." Pass all four, and you get a qualified verdict.

  **The Procedure:**

  1.  **Fix the Denominator & Scope:**
      *   *Question:* What *exactly* is being compared? Per kg meat? Per gram protein? Per 1000 kcal? Per "meal"? Over what timeframe? What specific land use changes are implied?
      *   *Check for Rigging:* Does the claim switch denominators mid-stream to favor one outcome? Is the chosen denominator relevant to consumer choices (e.g., per meal is more relatable than per hectare-year for an eater)?
      *   *Good Enough?* The pitch *must* clearly state its comparison basis, and it must be consistent and relevant. If it doesn't, or switches confusingly, STOP – "Claims lack consistent basis for comparison."
      *   *Values Call?* Choosing *which* denominator is most relevant (environmental impact vs. dietary guidance) can be values-based, but the claim must pick one and stick to it factually.

  2.  **Force the Replacement Scenario:**
      *   *Question:* What is the **counterfactual**? What happens to the land, inputs (feed, pesticides), and existing animal populations if we *don't* use this specific farming method (grazing, chicken, soy cropping)?
      *   *Check for Rigging:* Does the claim assume an unrealistic counterfactual (e.g., pasture magically becomes pristine wilderness, or freed-up cropland lies fallow forever)? Does it ignore indirect land use change?
      *   *Good Enough?* The pitch must explicitly state (or you must reasonably infer) the replacement scenario used. If it's vague ("saves land"), implausible, or ignores knock-on effects, STOP – "Impact depends critically on unstated land-use assumptions."
      *   *Values Call?* Predicting complex land-use changes involves uncertainty, but assuming *no change* is usually unrealistic. The *plausibility* of the counterfactual is a factual judgment.

  3.  **Account for Population Dynamics (The Subtraction Problem):**
      *   *Question:* Does the claim distinguish between **gross mortality** (animals killed directly/indirectly) and **net population impact**?
      *   *Check for Rigging:* Does it present gross deaths as the net impact? Does it ignore density-dependent mortality (where one death prevents another later)?
      *   *Good Enough?* Acknowledge the distinction. If the claim *only* uses gross numbers without caveats, flag it as "likely overstates net impact on wild populations." You usually can't *calculate* the net impact without complex data, but you *can* note when it's ignored.
      *   *Values Call?* Recognizing that net impact ≠ gross mortality is a scientific point. How much weight to *give* gross mortality vs. estimated net impact when data is scarce is a values/judgment call.

  4.  **Acknowledge the Suffering Currency Problem:**
      *   *Question:* How are deaths/suffering across vastly different species (cow vs. mouse vs. insect) being compared? What assumptions are made about sentience and capacity for suffering?
      *   *Check for Rigging:* Does the claim implicitly weight all lives equally? Does it ignore smaller animals entirely? Does it dismiss potential insect suffering without basis?
      *   *Good Enough?* The pitch (or your assessment) must explicitly state the *limitation*. You likely *cannot resolve* this scientifically at your desk. The key is honesty: "Comparisons involve uncertain ethical weighting across species."
      *   *Values Call?* **Crucially, this is ALWAYS a values call.** Science informs *if* an animal might feel pain, but *how much* its suffering counts relative to another's is fundamentally ethical. The procedure forces you to surface this.

  **Output Verdict Template:**
  "While [Claim X] highlights [Potential Issue Y], its conclusion that [Specific Comparison Z] is [Better/Worse] for wild animals depends critically on [Specific Limitation from Steps 1-4, e.g., 'assumptions about freed-up land use', 'unverified counterfactual', 'unweighted mortality counts'] and involves unquantifiable ethical trade-offs across species, making a definitive verdict elusive at this scale."

  **Running the Procedure:**

  **1. Pasture-Raised Chicken Certification (Better than Beef?)**
  *   **Step 1 (Denom):** Likely per kg meat or per bird? Implied land stays grassland. *Passes - Scope is clear enough.*
  *   **Step 2 (Replacement):** **FAIL.** Key assumption: Land remains grassland *only* if used for their chickens? What if it wasn't used for chickens? Could it support native grazers? Could it be converted to crops or housing? The claim assumes the *only* alternative to their chicken pasture is beef pasture, which is highly specific and likely rigged. The "grassland stays" is true for *their operation* but ignores the counterfactual for the *land itself*.
  *   **Verdict:** "While promoting grassland preservation, this claim's superiority over beef relies on an unverified assumption that the land would otherwise support less wildlife-friendly beef grazing or be lost entirely, ignoring other plausible land-use alternatives."

  **2. NGO Graphic (Switch Beef -> Chicken Saves Wild Animals)**
  *   **Step 1 (Denom):** "Per person per year." But deaths *from what*? Likely from crop production for feed. *Passes - Scope defined.*
  *   **Step 2 (Replacement):** **FAIL.** Massive red flag. Assumes land freed up from *not* producing beef feed is simply *retired* or used benignly. Ignores: What will people eat instead? (More chicken = more chicken feed demand). What happens to the grazing land? (Ploughed for crops? Developed?). Ignores indirect land use change – saved soy might just go elsewhere. Classic "land sparing" assumption rarely holds perfectly.
  *   **Verdict:** "This graphic's estimated animal savings depend entirely on the implausible assumption that reduced beef consumption directly and proportionally leads to large-scale land retirement for wildlife, without considering increased demand for other meats or alternative uses for freed-up land."

  **3. Your Line: Grass-Fed Beef = Wild-Animal-Friendly Meat**
  *   **Step 1 (Denom):** Implied per unit of meat/meal. *Passes - Clear enough for the claim.*
  *   **Step 2 (Replacement):** **Passes (Conditionally).** The counterfactual for grazing land is often plausible: if not grazed by cattle, it might revert to scrub/succession (potentially supporting different wildlife) *or* be converted to crops (likely worse). It *acknowledges* the land-use context. *Passes - Plausible counterfactual range.*
  *   **Step 3 (Population):** **Partial Pass/Fail.** It avoids gross mortality hype. But does it *implicitly* assume net impact is low? Probably. Needs caveat: "Likely has lower *direct* mortality than cropping systems, but net population impact on grassland ecosystems is complex and less studied."
  *   **Step 4 (Currency):** **FAIL (Values Call Surfaced).** Here's the rub you might not want to hear: Grass-fed beef systems often involve significant predator control (shooting/culling coyotes, wolves, foxes to protect calves). You're trading potential field-mouse/insect deaths from cropping (uncertain suffering) for deliberate killing of larger mammals (clear suffering) and habitat modification. *How do you weight a shot coyote vs. a mouse killed by harvest?* This is purely ethical.
  *   **Verdict:** "Grass-fed beef systems generally avoid feed-crop mortality and can maintain grassland habitat, making them potentially less harmful to *some* wildlife than intensive cropping or feedlots. However, this comes with significant trade-offs, including deliberate lethal control of native predators, making its overall 'wild-animal-friendly' status highly dependent on how one ethically weights the lives and suffering of larger predators versus smaller field animals."

  **Where It Misfires & The Hedge:**

  *   **Land-Use Crystal Ball:** Step 2 (Replacement) is the biggest guesswork. We *never* know exactly what land would do otherwise. The procedure forces plausibility checks, not certainty.
  *   **Net Impact Calculation Impossible:** Step 3 highlights the issue but rarely provides an answer. You flag when gross mortality is misused as net, but you can't calculate the true net effect.
  *   **Suffering Imponderable:** Step 4 cannot be resolved. It ensures you *don't* hide the ethical dilemma.
  *   **Data Light:** You're assessing the *logic* and *assumptions* of the pitch, not auditing their data. Your verdict critiques their reasoning and exposes hidden dependencies.
  *   **The Honest Hedge:** Use phrases like: "depends critically on...", "requires assuming that...", "neglects the trade-off of...", "involves unquantifiable weighting of...", "plausible only if...", "overlooks potential for...". State *which specific* uncertainty or value judgment prevents a clear answer.

  This procedure won't give you easy answers, but it will expose where the answers aren't easy – and that's the honest, defensible position. It turns vague unease into specific, articulable critiques. You'll often end up saying "This claim is unverifiable because of X," which is far more valuable to your readers than a false certainty.
