  ### Teaching Plan: 45 Minutes  
  **Goal:** Demonstrate the inherent tension between calibration, FPR equality, and FNR equality when base rates differ, using insurance groups (Medicaid vs. commercial) without triggering defensiveness.  

  #### **1. Setup & Context (5 min)**  
  - **Board:**  
    - "Today: How our readmission-risk score behaves in two groups (Medicaid vs. commercial insurance)."  
    - "Known fact: Medicaid patients have higher readmission rates. Not about 'fairness'—about structural trade-offs."  
  - **Why this matters:**  
    - "We need the score to be actionable for care teams. Let’s define what makes it useful."  

  ---

  #### **2. Core Concepts: The 2x2 Table & Metrics (10 min)**  
  - **Draw a 2x2 confusion matrix** (Actual vs. Predicted):  
    ```
                  | Predicted High Risk | Predicted Low Risk
    -------------|---------------------|--------------------
    Readmitted   | TP                  | FN  
    Not Readmitted| FP                  | TN  
    ```  
  - **Define metrics (no formulas yet, just intuition):**  
    - *Calibration:* "If 100 patients get a score of 0.3, ~30 should be readmitted. **Same meaning in both groups.**"  
    - *False Positive Rate (FPR):* "Of patients **not readmitted**, how many were incorrectly flagged as high-risk?"  
    - *False Negative Rate (FNR):* "Of patients **readmitted**, how many were missed (labeled low-risk)?"  
  - **Reinforce:** "We want all three: calibration, low FPR, low FNR—for both groups."  

  ---

  #### **3. Reveal Base Rates & Introduce Example (5 min)**  
  - **Board:**  
    - Group A (Commercial): 20 patients, **4 readmitted** (base rate = 20%).  
    - Group B (Medicaid): 20 patients, **8 readmitted** (base rate = 40%).  
  - **Stress:** "This difference is real. Not a model flaw—it’s in the data."  
  - **Example Setup (Hand-Countable):**  
    - "Our model assigns scores. We’ll track predictions and outcomes."  

  ---

  #### **4. The Example: Calibration Holds, Errors Diverge (15 min)**  
  - **Board the patient table (40 total patients):**  
    | Group       | Risk Score | # Patients | # Readmitted | Readmission Rate |  
    |-------------|------------|------------|--------------|------------------|  
    | Commercial  | 0.2        | 10         | 1            | 10%              |  
    | Commercial  | 0.4        | 10         | 3            | 30%              |  
    | Medicaid    | 0.4        | 10         | 3            | 30%              |  
    | Medicaid    | 0.6        | 10         | 5            | 50%              |  

  - **Verify calibration together (finger counting!):**  
    - Commercial: Score 0.2 → 1/10 readmitted (≈10%); 0.4 → 3/10 (30%).  
    - Medicaid: Score 0.4 → 3/10 (30%); 0.6 → 5/10 (50%).  
    - ✅ **Key:** Score means the same thing in both groups (0.4 = ~30% risk for all).  

  - **Apply a threshold (e.g., 0.5):**  
    - *High-risk* = Score ≥ 0.5.  
    - **Commercial:**  
      - TP = 0 (no one ≥0.5), **FN = 4** (all readmitted missed).  
      - FP = 0, TN = 16 (all non-readmitted correct).  
      - **FPR = 0%** (FP/[FP+TN]), **FNR = 100%** (FN/[FN+TP]).  
    - **Medicaid:**  
      - TP = 5 (score 0.6 readmitted), FN = 3 (score 0.4 readmitted).  
      - FP = 5 (score 0.6 not readmitted), TN = 7 (score 0.4 not readmitted).  
      - **FPR = 42%** (5/12), **FNR = 38%** (3/8).  
    - 😟 **Tension revealed:** Calibration holds, but FPR/FNR differ wildly.  

  - **Try another threshold (e.g., 0.3):**  
    - *Exercise:* Let them calculate FPR/FNR.  
    - Result: FPR/FNR still differ (Commercial FPR ↑, Medicaid FNR ↓).  

  ---

  #### **5. Impossibility & Misconceptions (7 min)**  
  - **State the takeaway:**  
    > "When base rates differ, we **can’t have all three** at once:  
    > (1) Calibration,  
    > (2) Equal FPR, *and*  
    > (3) Equal FNR—  
    > ...unless the model is perfect or random."  

  - **Defuse misconceptions in order:**  
    1. **"AUC is similar, so it’s equally good."**  
       - "AUC measures ranking, not calibration or error balance. Our example has good ranking, but errors still diverge."  
    2. **"Drop insurance field to fix it."**  
       - "If insurance correlates with other features (e.g., income, chronic conditions), the model infers it. Base rates still differ."  
    3. **"Use different thresholds per group."**  
       - "Then a 0.4 score might be 'high risk' in Group A but 'low risk' in Group B. Score loses consistent meaning."  
    4. **"Base rates differ because patients differ—no issue."**  
       - "Agreed! This isn’t about fairness. It’s about the math: you can’t optimize all three metrics simultaneously."  
    5. **"Just get more data."**  
       - "More data sharpens estimates, but doesn’t resolve the trade-off. It’s structural."  
    - **Missed misconception:** *"We can fix it with better features."*  
      - "Even with perfect features, if base rates differ, the tension remains."  

  ---

  #### **6. Closing: The Check & Boundaries (3 min)**  
  - **The Check Question (tests understanding, not slogans):**  
    > "If we calibrate scores so a 0.3 means 30% risk in both groups, and we set one threshold for everyone, can we expect FPR and FNR to be **equal across groups** if their readmission rates differ? Why/why not?"  
    - *Correct answer:* **No.** Base rate difference forces FPR/FNR to diverge.  

  - **What We’re Skipping (state explicitly):**  
    - "No time for: The mathematical proof, causal why behind base rates, or solutions. Today is about **recognizing the trade-off** in metrics dashboards."  
    - "When you see a vendor’s 'fairness report,' check if they claim calibration + equal FPR + equal FNR with differing base rates. They can’t all be green."  

  ---

  **Why This Order Works:**  
  1. **Starts non-threateningly** (acknowledges model value, focuses on structural math).  
  2. **Builds step-by-step** from definitions (2x2) to base rates (revealed early) to example (hands-on).  
  3. **Example design:**  
     - Uses insurance (non-sensitive, real base rate difference).  
     - Avoids "sicker group" debates (calibration ensures scores match outcomes).  
     - Hand-countable (40 patients, whole-room participation).  
  4. **Misconceptions addressed post-tension** when the group is primed to see why quick fixes fail.  
  5. **Ends with a concrete skill:** Auditing vendor dashboards for incompatible metrics.
