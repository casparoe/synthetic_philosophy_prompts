    - True Positive (TP): Predicted high risk and actually readmitted.
    - False Positive (FP): Predicted high risk but not readmitted.
    - True Negative (TN): Predicted low risk and not readmitted.
    - False Negative (FN): Predicted low risk but actually readmitted.
