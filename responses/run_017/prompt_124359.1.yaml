  - Start by acknowledging their work: "We've built a great readmission-risk model, and it's being used on every discharge. Today, we're going to explore some inherent trade-offs in how we use such models, especially when patient groups have different underlying rates of readmission."
  - Set the stage: "We're going to look at two groups of patients: those with commercial insurance (Group A) and those with Medicaid (Group B). We know from our data that the readmission rate is higher for Medicaid patients. We want our model to be equally useful for both groups."
  - State the three desirable properties (without calling them fairness criteria):
    a. **Calibration**: When the model predicts a 30% risk, it should mean that about 30% of such patients are readmitted, regardless of group.
    b. **Similar false positive rates (FPR)**: The chance of incorrectly flagging a patient who won't be readmitted should be similar in both groups.
    c. **Similar false negative rates (FNR)**: The chance of missing a patient who will be readmitted should be similar in both groups.

  **2. The 2x2 Confusion Matrix (5 minutes):**
