            - Score>=0.4: none, so TP=0, FP=0
            - Score<0.4: 20 patients, 4 readmissions (FN=4), 16 not ( and for the purpose of TN, we have to see: the non-readmitted are 16, but how many are predicted negative? all 20 are predicted negative) -> so TN=16, FP=0.
            - FPR=0, FNR=4/4=100%

        - Group B:
            - Score>=0.4: the 0.5 group (10 patients) -> readmissions=5 (TP=5), not readmitted=5 (FP=5)
            - Score<0.4: the 0.3 group (10 patients) -> readmissions=3 (FN=3), not readmitted=7 (TN=7)
            - FPR=5/(5+7)=5/12=41.67%
            - FNR=3/(3+5)=3/8=37.5%

    Still not equal.

    This example allows us to show that calibration holds (within each score bin, the readmission rate is as predicted) and that at any threshold, the error rates (FPR and FNR) differ between the groups.

    So we use this example.

    **5. Present the Example (10 minutes):**
        - Draw a table for Group A:
            - Score 0.1: 10 patients, 1 readmitted, 9 not.
            - Score 0.3: 10 patients, 3 readmitted, 7 not.
        - Draw a table for Group B:
            - Score 0.3: 10 patients, 3 readmitted, 7 not.
            - Score 0.5: 10 patients, 5 readmitted, 5 not.

        - Verify calibration: 
            Group A: score 0.1: 1/10=10% (close to 0.1), score 0.3: 3/10=30% ( matches).
            Group B: score 0.3: 3/10=30% (matches), score 0.5:5/10=50% (matches).

        - Now choose a threshold, say 0.2. 
            - In both groups, we predict high risk if score>=0.2.
            - Group A:
                 - High risk: score>=0.2 -> both categories, 20 patients.
                   - TP = 1 (from score 0.1) + 3 (score 0.3) = wait, no: we have to see who is readmitted and predicted high risk: the readmitted are 1 (at 0.1) and 3 (at 0.3) -> but wait, the score 0.1 is below 0.2? 
                   - Let's recalculate with threshold 0.2:
                       - High risk: score>=0.2 -> the score 0.3 group (10 patients) and the score 0.1 group is low risk.
                       - So:
                           - High risk (>=0.2): the score 0.3 group -> 3 readmitted (TP), 7 not readmitted (FP)
                           - Low risk: the score 0.1 group -> 1 readmitted (FN) and 9 not readmitted (TN).
                   - FPR = FP / (FP+TN) = 7/(7+9)=7/16=43.75%
                   - FNR = FN / (FN+TP) = 1/(1+3)=25%
            - Group B:
                   - High risk: score>=0.2 -> both groups (0.3 and 0.5) -> 20 patients.
                   - TP = 3 (score 0.3) + 5 (score 0.5) = 8
                   - FP = (7 from score 0.3) + (5 from score 0.5) = 12
                   - Low risk: none, so FN=0, TN=0.
                   - FPR = 12/(12+0)=100%
                   - FNR = 0/(0+8)=0%

        - This shows that at threshold 0.2, FPR is much higher in Group B and FNR is lower.

        - Try threshold 0.4:
            - Group A:
                 - High risk: score>=0.4 -> none in Group A (because scores are 0.1 and 0.3), so TP=0, FP=0, FN=4, TN=16.
                 - FPR=0, FNR=4/4=100%
            - Group B:
                 - High risk: score>=0.4 -> only the score 0.5 group: 10 patients.
                   - TP=5, FP=5
                   - Low risk: score<0.4 -> the score 0.3 group: 10 patients.
                   - FN=3, TN=7.
                 - FPR=5/(5+7)=5/12≈41.67%
                 - FNR=3/(3+5)=3/8=37.5%

        - Still not equal.

    **6. Impossibility (5 minutes):**
        - We have seen that with calibration holding in both groups (the score means the same in both groups) and the base rates being different, we cannot find a threshold that makes both FPR and FNR equal in both groups.
        - In fact, it's a mathematical impossibility except in trivial cases.

    **7. Address Misconceptions (10 minutes):**
        - "the model has basically the same AUC in both groups, so it's equally good for both": 
            - AUC measures overall ranking ability. It is possible to have the same AUC but still have calibration issues and the trade-off we've seen. AUC doesn't ensure that we can achieve equal error rates with calibration.

        - "just drop the insurance field and it's fine":
            - If insurance is correlated with other features, the model may still learn to distinguish the groups, and the issue remains. Also, we have already built the model without insurance, and we see the scores are calibrated within each insurance group by accident or design, but the base rates are different, so the trade-off is there.

        - "so we should use a different cutoff per group then":
            - That's a possible mitigation (and common in practice), but then the score doesn't mean the same thing in terms of the decision: a patient in Group A might be flagged as high risk at 0.3, while in Group B at 0.5, so the meaning of the score for decision making is not the same. Also, it might be seen as unfair to have different thresholds.

        - "the rates differ because the patients differ, so this isn't a fairness question at all":
            - We are not talking about fairness, we are talking about the model properties. Even if the difference is explainable by patient factors, the mathematical tension between calibration and error rate equality remains.

        - "that's just a small-sample / bad-data artifact, we need more data":
            - This is not a small-sample issue. With more data, the proportions will become sharper, and the tension will remain.

    **8. The Final Question (2 minutes):**
        - Ask: "If we have Group A with a 10% readmission rate and Group B with a 30% readmission rate, and we have a model that is perfectly calibrated in both groups, can we set a threshold such that the fraction of non-readmitted patients who are incorrectly flagged (FPR) is the same in both groups and also the fraction of readmitted patients who are missed (FNR) is the same in both groups? If not, why not?"

    **9. What to Skip (1 minute):**
        - We are not going into the mathematical proof.
        - We are not discussing the causal reasons for the base rate difference.
        - We are not discussing what to do about it (e.g., whether to change thresholds or not).
        - We are not using the word "bias" to avoid semantic traps.
        - The goal is to recognize the trade-off when they see it in a fairness dashboard: if they see calibration equality and then also see that the false positive rate and false negative rate are not both equal across groups when base rates differ, they should not be surprised.

  **Summary of the Example on the Board:**

    Group A (Commercial, 20 patients):
        - Score 0.1: 10 patients -> 1 readmitted, 9 not.
        - Score 0.3: 10 patients -> 3 readmitted, 7 not.

    Group B (Medicaid, 20 patients):
        - Score 0.3: 10 patients -> 3 readmitted, 7 not.
        - Score 0.5: 10 patients -> 5 readmitted, 5 not.

    At threshold 0.2:
        Group A:
          High-risk: score>=0.2 -> 10 at 0.3: TP=3, FP=7.
          Low-risk: score<0.2 -> 10 at 0.1: FN=1, TN=9.
          FPR = 7/16 = 43.75%, FNR=1/4=25%.

        Group B:
          High-risk: score>=0.2 -> 20 patients: both categories.
            TP=3+5=8, FP=7+5=12.
            FPR=12/12=100% (since no negatives in low-risk), FNR=0.

    At threshold 0.4:
        Group A:
          High-risk: none -> FPR=0, FNR=100%.
        Group B:
          High-risk: score>=0.4 -> 10 at 0.5: TP=5, FP=5.
          Low-risk: score<0.4 -> 10 at 0.3: FN=3, TN=7.
          FPR=5/12≈41.67%, FNR=3/8=37.5%.

    We see that at no threshold are both FPR and FNR the same in both groups.
