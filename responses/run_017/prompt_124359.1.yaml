  Hi — I need a teaching plan, not the explanation itself. I've got 45 minutes and a whiteboard with the care-management team at the hospital where I work: about fifteen people, roughly half nurses and care coordinators, half IT and analytics, nearly all of whom helped ship the readmission-risk score we now run on every discharged patient. They're proud of it, and they can tell I'm circling around something critical, so the sequence has to not land as "your model is bad and so are you." Also I can't use the word "bias" even once: to the nurses it means prejudice, to the analytics folks it means the statistical kind, and every time it comes up we spend ten minutes talking past each other.

  The thing they need to get is the impossibility one: a score can't at the same time *mean the same thing* in both groups (a 0.3 means a 30-ish percent chance of readmission whether you're on Medicaid or commercial insurance) and *make the two kinds of mistake at the same rates* in both groups, once the groups' base rates differ — except in the degenerate cases where the score is either perfect or useless. My two groups are insurance type, not a protected class, which is part of why I want to use it: the readmission rate really is higher in one group, and nobody in the room will think I'm making a moral accusation.

  So plan the arc. What has to be on the board before the tension can even be felt — the 2x2 of predicted vs. actual, does "the score means what it says" have to come before error rates or after, when do the two base rates get revealed — and why that order and not another. One example carries the whole thing and it has to be hand-checkable: a table of maybe forty patients across two groups that someone can literally count on their fingers. Rules: not recidivism, not loans, not hiring (they've all seen those and they switch off), and built so that the base-rate difference is real but nobody can settle everything by saying "well, that group just is sicker." Tell me what the numbers have to be, not only what the example is about.

  Misconceptions I'm expecting, roughly in the order I think they'll fire: "the model has basically the same AUC in both groups, so it's equally good for both"; "just drop the insurance field and it's fine"; "so we should use a different cutoff per group then"; "the rates differ because the patients differ, so this isn't a fairness question at all"; "that's just a small-sample / bad-data artifact, we need more data." Where does each one get defused in the sequence, and which one am I not seeing that always shows up anyway?

  Then: the single question I can ask at the end that tells me they got the structural point rather than memorised the slogan "you can't have all three" — something they'd get wrong if they'd only retained the slogan. And what should I openly refuse to get into in 45 minutes (the proof? the causal and measurement story? what we should actually do about it?) and say out loud that I'm skipping. Ideally they walk out able to look at a vendor's "fairness dashboard" and know which numbers can't all be green at once.
