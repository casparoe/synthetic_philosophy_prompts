  **(d) Offline vs. online fitting**  
  - *Humean batch fitting*: Best system from complete \( \mathcal{D} \) ≈ training on test data; counterfactuals extrapolate from observed regularities.  
  - *Governance claim*: Laws enable OOD robustness because \( \mathcal{G} \) generates *all* data (seen/unseen).  
  - *Incremental Humean*: Refitting on growing \( \mathcal{D} \) ≈ online learning. *Residue*: Governance asserts stability *without refitting*—a claim ML can’t make without assuming \( \mathcal{G} \).  

