prompt: |-
  I'm retired now -- materials science, mostly spectroscopy, ran a small lab for about thirty years -- and for the last year or so I've been sitting in on a philosophy reading group at the university. First philosophy I've done since a compulsory "science and its methods" course in the seventies, which was mostly about falsification and not much else. So please tell me if I'm reinventing the wheel.

  Here's the thing I keep noticing about if-then sentences, and it's not the thing people usually make a fuss about.

  First instance. In group meeting someone says: if the sample's contaminated, we'll see a peak at twelve minutes. I'd have put about 0.8 on that. Then we test for contamination and it comes back positive. My 0.8 on that sentence does not move. It doesn't go to one, it doesn't go anywhere. Compare: my confidence that the sample is contaminated goes straight to one when the test comes back. Every ordinary factual sentence I can think of gets settled, one way or t'other, by whatever settles the matter it's about. But the conditional seems numb to exactly the news you'd think mattered most to it.

  Second instance. When the contamination gets ruled out, nobody in the lab says "good, your prediction came out true." We say the prediction is moot, the run it was about never happened. But nor does anyone retract it -- I'd still insist I'd been right about what would have happened. So refuting the antecedent doesn't confirm the conditional either, the way the truth-table treatment I was taught as an undergraduate says it should. Blind in both directions: confirming the antecedent doesn't raise the number, refuting it doesn't send it to one.

  The only way I can make sense of my own 0.8 is as a procedure rather than a state of the world: suppose the sample is contaminated, then judge how much confidence the peak gets. Which makes me think both halves come from the same place -- once you've supposed the antecedent, there's nothing left for the news about the antecedent to do.

  So, what I'm after:

  Does this have a name, and is it one phenomenon or two that happen to travel together? Someone in the group said the "suppose it and then judge" move has a name going back to the 1920s, and separately that if-then sentences might not express propositions at all -- but I can't tell whether either of those is what I've stumbled on, or a different claim in the neighbourhood. The refuting-the-antecedent half at least feels like something everybody already has a word for; the confirming-the-antecedent half feels less talked about.

  And edges, please, since a name alone won't satisfy me. Does the pattern separate the indicative case from the subjunctive one (if the pump *had* failed, the run would have been lost -- I can't do the same "learn the antecedent" move there, because it's already settled)? What about 'if' doing duty for 'whenever' -- if the temperature crosses forty degrees the valve opens -- which does seem to get confirmed by testing? Is the pattern about the word or about one use of the word?

  One more thing: a retired logician in the group told me there's a famous result, Lewis I think, showing that the probability of an if-then can't be the probability of any proposition, on pain of everything coming out probabilistically independent. Is that the same thing I've noticed, or a much stronger claim that my two observations don't get near? I half-suspect I've confused myself somewhere here.

  Which brings me to what I want from you. Push back if the observation is muddled, or if the two halves really are unrelated and I've stitched them together, or if learning the antecedent would in fact move the number on the serious accounts. Say plainly if there's no established concept and give me a term with a definition and the boundary cases if so. Flag how confident you are in each part, and don't invent references -- no reading list, no citations, I'll chase those myself; if you're not sure a result is correctly attributed, just say you're not sure.
reasoning: |-
  Okay, let's tackle this retired materials scientist's query about conditionals. They've noticed something interesting: confirming the antecedent doesn't raise their confidence in the conditional, and refuting it doesn't confirm the conditional either. They mention two instances from their lab experience and connect it to probability and philosophy concepts. 

  First, I need to parse their core observation. The key points are: (1) Learning the antecedent is true doesn't change their confidence in the conditional (e.g., confirming contamination doesn't boost the 0.8 for "if contaminated, peak at 12min"). (2) Learning the antecedent is false makes the conditional moot but doesn't retract it, contradicting classical truth tables where false antecedent makes the whole conditional true. 

  They're essentially describing how conditionals behave differently from factual statements under evidence. Their "suppose it and then judge" intuition aligns with the suppositional theory of conditionals. The term they're looking for is likely Adams' Thesis or the Equation, where P(if A then C) = P(C|A). This explains why confirming A doesn't change the probability—it was already conditional on A being true. Refuting A makes the conditional undefined or void, not automatically true.

  The two observations are connected: both stem from the conditional's probability being defined only when A is possible. The independence issue they mention (Lewis' triviality result) is related but stronger—it shows conditionals can't be standard propositions without probabilistic constraints breaking. Their observation is a practical consequence of this.

  For edge cases: 
  - Subjunctive conditionals (e.g., "if the pump had failed...") behave differently because they're counterfactual; learning A is false is baked in, so probability isn't assessed via conditioning. 
  - Universal generalizations ("if temp>40, valve opens") are confirmed by instances because they're claims about all cases, not single instances.

  Their reasoning isn't muddled—it's astute. The two halves (confirming/refuting antecedent) are two sides of the suppositional coin. I should emphasize that Adams' Thesis covers both behaviors naturally. No need to invent terms; the existing framework fits. Confidence is high here—this is well-trodden ground in philosophy of language.

  The Lewis triviality result is a deeper formal limitation, but their observation is a tangible manifestation of it. They've intuitively grasped why conditionals resist truth-conditional treatment in daily use. Solid insight for someone new to philosophy!
answer: |-
  Your observation is sharp, coherent, and absolutely not muddled. It’s a well-documented phenomenon in philosophical logic, and the two halves (antecedent confirmation/refutation not affecting conditional confidence) are deeply connected. Here’s a precise breakdown:

  ### Core Concept: **The Suppositional Theory of Conditionals**  
  This is the "name" for what you’ve described. It treats *indicative* conditionals (e.g., "If the sample is contaminated, we’ll see a peak at 12 min") not as factual propositions about the world, but as **procedures for managing hypothetical belief**.  
  - **Key Principle (Adams' Thesis/The Equation)**:  
    Your confidence in *If A, then C* is given by the conditional probability **P(C | A)**, not P(A ⊃ C) or any truth-functional construction.  
    This explains both your observations:  
    - **Confirming A doesn’t raise P(If A, then C)**: Because **P(C | A)** *already assumes A is true*. Learning *A* gives you direct evidence about *C*, not about the *relationship* between A and C.  
    - **Refuting A doesn’t make P(If A, then C) = 1**: When A is false, **P(C | A)** is undefined or irrelevant (no probability conditional on an impossibility). The conditional becomes *void*—neither true nor false in a classical sense.  

  ### Why Your Two Halves Are One Phenomenon  
  1. **Confirmation of A**:  
     - Your 0.8 was *always* **P(peak | contamination)**. Learning contamination occurred *replaces* the conditional with a direct claim about the peak. The conditional was a *rule for updating beliefs if A holds*; once A is known, the rule is "spent."  
  2. **Refutation of A**:  
     - With A false, **P(C | A)** has no anchor. The conditional isn’t "true" (as truth tables say) because it never had truth conditions—it was a *constraint on your belief system* for when A is live.  

  ### Edges and Boundary Cases  
  - **Indicative vs. Subjunctive Conditionals**:  
    - *Indicative* ("If the sample *is* contaminated..."): Governed by suppositional theory. Antecedent learning voids them.  
    - *Subjunctive/Counterfactual* ("If the pump *had* failed..."): These *require* a false antecedent. They appeal to possible worlds or causal models. Learning A is false doesn’t void them—it’s their starting point. Probability here involves similarity-weighted worlds (e.g., Lewis-Stalnaker semantics).  
  - **Generics/Universals ("If T > 40°C, the valve opens")**:  
    These *are* truth-apt propositions (e.g., ∀x (T(x)>40 → Open(x))). They get confirmed/falsified by instances because they make claims about *all cases*. Your observation applies only to *single-case* conditionals.  
  - **The Pattern Is Use-Specific**:  
    It holds for *epistemic* conditionals (about belief updates) but not *ontic* ones (about lawlike regularities). The word "if" is polysemous; your case targets its role in reasoning under uncertainty.  

  ### Lewis' Triviality Result: Connection to Your Observation  
  - **What Lewis Showed**: If you treat *If A, then C* as a proposition with a fixed truth value, and demand P(If A, then C) = P(C | A) universally, then **A and C must be probabilistically independent**—which is absurd for most meaningful conditionals.  
  - **Relation to Your Insight**:  
    Your observation (that conditionals resist truth values and behave as P(C | A)) is the *intuitive precursor* to Lewis' formal result. Lewis proves that this behavior *cannot* be reconciled with treating conditionals as standard propositions. You’ve hit the empirical heart of the problem: conditionals guide suppositional reasoning, not factual description.  

  ### Confidence and Pushback  
  - **Confidence Levels**:  
    - Suppositional theory explaining your 0.8: **High (≥95%)**.  
    - Two halves as one phenomenon: **High (≥90%)** (both stem from P(C | A) being antecedent-relative).  
    - Lewis’ result vs. your observation: **High**—they are complementary (yours is the "why," his the "why not").  
  - **No Major Pushback**: Your account aligns with dominant frameworks (e.g., Adams, Edgington). One quibble:  
    - If *A* is learned, *some* accounts (e.g., "dynamic" semantics) allow conditionals to "become" assertions of *C*, but this doesn’t contradict you—it dissolves the conditional.  

  ### The Established Concept  
  **Adams' Thesis** (1965) or **The Equation** is the umbrella for your core observation.  
  **Defined**: For an indicative conditional *If A, then C*, its probability is the conditional probability **P(C | A)**.  
  **Boundaries**:  
  - Fails for counterfactuals (subjunctive mood).  
  - Fails for generic "if" (= "whenever").  
  - Holds when "if" expresses a *conditional belief update*.  

  You’ve independently reconstructed a pillar of modern conditional logic—a testament to the clarity of your scientific intuition. No wheel-reinventing; you’ve precisely nailed the axle.
