answer: |-
  ### The setup: agents and omissions  
  *Candidate agents and their omissions:*  
  - **Wireless operator (Cyril Evans)**: Failed to maintain wireless vigilance after duty hours (omission: monitoring distress calls).  
  - **Watch officer (Stanley Lord)**: Failed to wake Captain Lord upon seeing distress rockets (omission: escalating alert).  
  - **Captain Lord**: Failed to order investigation or movement (omission: initiating rescue).  
  - **Californian’s owners/company**: Failed to mandate 24-hour wireless operation (omission: policy creation).  
  - **Industry/norms**: Failed to establish standard emergency protocols pre-disaster (omission: regulatory foresight).  

  ### But-for and where it over-generates  
  But-for causation implies: *But for X’s omission, the outcome would not have occurred*.  
  - **Over-generation**: But-for implicates *all* agents above (e.g., but for the company’s policy, Evans would have heard the call; but for the captain’s inaction, the ship might have moved). It even implicates distant agents (e.g., "but for Marconi’s failure to install backup operators...").  
  - **Bug or moral smuggling?** This *is* a bug in but-for theory. It conflates causal contribution with culpability and ignores *actual capacity* (e.g., a sailor off-duty asleep isn’t "omitting" rescue). Your discomfort isn’t just moral; it reveals but-for’s inability to distinguish relevant omissions from mere absences.  

  ### Mechanism, defaults, and the normativity worry  
  - **The "nothing happened" objection**: Omissions lack physical processes (no energy transfer from non-action). Theories like *process reliabilism* (Dowe) or *counterfactual dependence* (Lewis) bypass this by focusing on *what should have happened*.  
  - **Baseline problem**: If "no night watch" was normal, is omitting it causal? Yes—if we adopt a *norm-relative baseline* (e.g., "ships *should* monitor distress signals"). But this imports morality: calling it "causal" assumes a duty existed *before* it was codified.  
  - **Normativity leak**: Theories like Hart & Honoré’s (*Causation in the Law*) explicitly tie omissions to duties. If the baseline is normative (e.g., "reasonable captain"), causation claims *do* covertly moralize.  

  ### Testing the liveness idea  
  Your proposal: An omission causes harm only if the action was *live* (on the agent’s realistic menu of options).  
  - **Applies well to**:  
    - Captain Lord (action "order ship to move" was live—he had authority and capacity).  
    - Watch officer (action "wake captain" was live—routine in emergencies).  
  - **Kills**:  
    - Evans (action "monitor wireless" not live—off duty, no expectation).  
    - Company (action "mandate 24-hour watch" not live *that night*—policy change isn’t instantaneous).  
  - **Self-blinding flaw**: An agent who deliberately avoids making an action live (e.g., training oneself to ignore rockets) exploits your criterion. If avoiding "liveness" negates causation, manipulative agents escape accountability. This *does* sink the idea without modification (e.g., adding "duties of awareness").  

  ### What the case does back to the theory  
  - **Retrospective duties**: Post-disaster rule changes confirm that causal judgments are interest-relative. We label omissions "causes" *because* we now see them as failures against newly recognized norms.  
  - **Blame vs. description**: Calling an omission a "cause" *is* partly blame allocation—but not arbitrarily. It reflects a counterfactual truth: *if* the action occurred, harm would likely have diminished.  
  - **Silences on specifics**: The apparatus can’t specify *which deaths* were caused (e.g., people who died before rescue was possible) or exact numbers. It treats "failure to rescue" as causing *some* deaths without granularity.  

  ### Settled vs. contested  
  - **Settled**:  
    - But-for *over-generates* causes (consensus: Lewis, Schaffer).  
    - Pure physicalism (omissions as literal "nothing") fails—causation requires counterfactuals (Dowe, Beebee).  
    - Norms shape omission-as-cause judgments (Hart & Honoré; legal practice).  
  - **Contested**:  
    - Whether baselines *must* be normative (metaphysical vs. pragmatic views).  
    - How to limit but-for without moralizing (e.g., "necessity" vs. "sufficiency" frameworks).  
    - If "duty" is inherent in causation or a separate layer.  

  ### Bottom line  
  The Californian case shows causation-by-omission is inherently normative: we single out failures against expected duties (even nascent ones). But-for overreach is real, not just moral bias. Your "liveness" idea aligns with *contrastive causation* (Schaffer) but falters on culpable ignorance. Ultimately, calling omissions "causes" serves dual roles: explaining harm *and* shaping future responsibility—a blend of metaphysics and ethics the literature hasn’t fully disentangled.  

  **On your liveness idea**: The core exists in "contrastive causation" (focusing on feasible alternatives), but the "realistic menu" framing is novel. The self-blinding flaw isn’t addressed in mainstream work—it’s your insight and its key weakness.
