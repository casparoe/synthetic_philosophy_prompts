prompt: |-
  You're a professional philosopher who works on animal and environmental ethics, and you're very good at reverse-engineering what principle someone is actually running from a scatter of case-by-case reactions. Please think carefully and take your time with this: before you commit to anything, brainstorm five or six candidate principles she might be running, say which ones you're throwing out and why, and only then give me your best guess. Be concrete, don't give me any kind of reading list or citations, I just want the reasoning.

  Background: my girlfriend Priya and I have been arguing about insects for years and her verdicts are annoyingly consistent in a way I can never articulate back to her. She's not a philosopher and has no theory, she just has extremely strong reactions. I finally sat down and wrote out everything I can remember her taking a line on:

  - A mosquito landing on her arm at night: swat it, obviously, zero guilt.
  - A mosquito on the ceiling in November, nobody even in the room: catch it in a glass and put it outside. She's definately strict about this one and its the one I find weirdest.
  - A wolf spider in the bathtub: absolutely not, cup it and carry it down to the basement.
  - German cockroaches in our old rental: fine to squash them one by one, not fine to put out gel bait or have the landlord spray. Her line is that we made that kitchen, we can at least do the dishes and caulk the cracks, and she doesn't want poison where food gets made anyway.
  - Odorous house ants trailing across the counter to the sink: fine to wipe up the trail with soapy water, not fine to set out the slow borax-and-sugar bait that takes out the queen. Her view is that the foragers are basically fingernails and the colony is the animal, so wiping out a colony is a different order of thing from killing scouts.
  - Spotted lanternflies: stomp them, enthusiastically, and she gets annoyed at people who won't. She's also fine with the sticky tree bands they put out, which I pointed out is the same thing as the glue traps she hates indoors -- she says no, that's different, that's cleanup.
  - Aphids on the balcony tomatoes: she'll squish them by the dozen between her fingers, but she won't spray soap or neem, because of the ladybugs and the bees, and because it lingers.
  - Her bees, two hives on the roof: she'll hit them with the oxalic acid treatment that kills a load of varroa mites, and last summer she destroyed a yellowjacket nest that was robbing a weak hive. She would not destroy the same kind of nest in the woods a mile away.
  - Slugs in the lettuce: she goes out at night and carries them to the vacant lot. Slug pellets are, in her words, the worst thing in the garden -- partly the slow death, partly the birds that eat the poisoned slugs.
  - Tent caterpillars on the little apple tree she planted: she nets the tree, she won't kill the caterpillars, and if the tree dies she says she'll plant something else.
  - Mosquito dunks in the rain barrel, the bacterial larvicide kind: totally fine, no hesitation. The county truck that fogs for adult mosquitoes: not fine, she wrote a letter to the paper about it.

  Now the new case. It's February. There's a big overwintering aggregation of Asian lady beetles in the wall void behind my bed -- the introduced kind that piles into houses for the winter, a couple hundred of them, they come out on warm afternoons, they stink when you crush them, they bite occasionally, they're staining the curtains, and the rest of the year they're out in the garden eating aphids. They'll fly off in April on their own. I want them gone and I dont want to fight about it.

  What I want from you:

  1. Predict her verdict, with your confidence, on: (a) vacuuming them up as they emerge, which obviously kills them; (b) having an exterminator drill a hole and dust the void, which kills them slowly; (c) just sealing the cracks and waiting for April. Does any of this change if my reason is pure disgust versus the bites actually waking me up at night?
  2. What's the rule she's running? State it sharply enough that I could test it on a case you haven't seen.
  3. What other rules fit her old verdicts about as well as yours does, and what does each of them predict about this wall void? I'm especially interested in whether there's a reading on which the foragers-are-fingernails thing and the no-glue-traps thing are doing all the work, versus one where it's really about which organisms belong where, versus one where it's about whose fault the situation is.
  4. Which single further case would best tell those readings apart? I was going to pose a feral honeybee colony in the soffit of the building -- my thinking is that a hive is a superorganism, it's a domesticated animal we brought here, and it's also technically out of place, so the rules should split. Is that the right test, or is there a cleaner one?
  5. And the practical bit: what's the version of dealing with this that she'd actually say yes to, that I can put on the table tonight?
reasoning: |-
  Okay, let me put on my philosopher hat and tackle Priya's insect ethics systematically. The user wants me to reverse-engineer her principles from scattered case reactions without theory. Hmm, this is fascinating - her consistency suggests an implicit ethical framework despite her not being a philosopher. 

  First, I need to map her reactions: she distinguishes between immediate threats (mosquito biting) vs dormant ones (ceiling mosquito), values relocation over killing when possible (spider in tub), rejects indirect killing methods (gel bait for roaches), makes colony/organism distinctions (ants vs aphids), considers ecological roles (lanternflies as invasive vs ladybugs as beneficial), and cares about methods (slow poison vs quick kill). The overwintering lady beetles case is tricky because they're beneficial but currently a nuisance.

  I'm considering several candidate principles:
  1. Instrumentality principle (prioritizing human interests) - but this fails because she protects non-threatening spiders and ceiling mosquitoes.
  2. Pain-avoidance (prioritizing suffering) - closer, but doesn't explain why she kills aphids painlessly while relocating slugs.
  3. Ecological citizenship (right place/role) - explains lanternfly stomping but not why she won't spray aphids if it harms bees.
  4. Agency/innocence (fault-based) - interesting but fuzzy; she blames humans for roach infestations but not for mosquitoes? 
  5. Relational harm reduction (minimizing harm within unavoidable conflict) - promising, as she consistently chooses least harmful methods within necessity constraints.
  6. Nested moral considerability (individual-colony-ecosystem tiers) - strongest contender, explaining ant scouts vs colony distinction and different treatment of wasps near hives vs in woods.

  *Discarding* #1-2 for being too reductive and #3-4 for inconsistent fit. #5 and #6 remain - both explain most cases but differ on the "fingernails" analogy. For the lady beetles: vacuuming (#5 might allow it, #6 wouldn't), dusting (both reject), waiting (both accept). 

  Best test case: feral honeybees in soffit. #5 sees conflict requiring minimally harmful removal, #6 sees domesticated organisms in wrong place requiring protection. Alternative test: invasive termites damaging house - #5 permits elimination, #6 still permits if they're invasive. 

  Practical solution: seal cracks and wait, adding temporary breathable barrier. Addresses her likely rejection of killing beneficial insects overwintering appropriately. If bites occur, she might accept vacuuming individuals as defensive action - but only after non-lethal control fails. 

  *Refining*: Her principle seems to be "Defensive harm minimization within nested ecological relationships." She permits harm only when (a) directly necessary for health/habitat integrity, (b) targeted at minimal functional unit (individual scouts vs whole colonies), (c) using least cruel method available. This fits all cases - even the "fingernails" analogy reflects seeing scouts as non-autonomous parts. 

  For the user: Propose sealing cracks tonight as first step, emphasize lady beetles' garden benefits, and only discuss vacuuming if bites persist. Frame it as protecting sleep (defensive necessity) not disgust.
answer: |-
  After analyzing Priya's pattern of reactions, here's my systematic breakdown:

  **Candidate Principles (with key predictions):**  
  1. **Ecological Role Primacy:** Value based on net ecosystem benefit. *(Fails: She kills aphids (beneficial to plants/ladybugs) but not tent caterpillars (destructive).)*  
  2. **Suffering Minimization:** Prioritize quick deaths and avoid toxins. *(Fails: Rejects fast glue traps but accepts slow mosquito dunks; kills aphids manually despite alternatives.)*  
  3. **"Fingernails" Reductionism:** Only individuals are morally relevant; colonies/superorganisms matter more. *(Fits ants/aphids, but fails bees: She protects *individual* bees via mite treatment, not just the hive.)*  
  4. **Human-Caused Harm Avoidance:** Rejects interventions that create collateral damage. *(Fits bait sprays (ants/roaches) and fogging (non-target insects), but fails lanternfly stomping (non-target risk low).)*  
  5. **Defensive Boundary Principle:** Harm permitted only when intruders actively threaten core human spaces/bodies *at that moment*. *(Fits: Mosquito biting=yes, ceiling=no; kitchen roaches=yes (invading food prep), basement spider=no.)*  
  6. **Relational Accountability:** Humans must fix problems they caused, using least harmful method. *(Fits: Caulking for roaches (our kitchen), relocating slugs (our garden), but fails destroying yellowjackets (not caused by her).)*  

  **Discarded:** #1 (inconsistent on pests), #2 (inconsistent on speed/toxins), #6 (fails yellowjackets). **Retained:** #3 (fingernails), #4 (collateral damage), #5 (defensive boundaries).  

  **Best Fit: #4 + #5 → "Targeted Defense Threshold"**  
  *Harm is permissible only if:*  
  **(a)** The threat is *immediate* (to body, home core, or domesticated animals), **AND**  
  **(b)** The method *exclusively* targets the threat with minimal suffering/collateral damage.  

  **Predictions for Lady Beetles:**  
  - **(a) Vacuuming emerging beetles:** **~60% likely NO.** Not immediate (not biting *while* vacuuming?); collateral to beneficial species. *If bites wake you:* **~80% YES** (becomes immediate bodily threat). Disgust alone? **~90% NO.**  
  - **(b) Dusting void:** **~95% NO.** Slow death + collateral (dust lingers, harms other insects).  
  - **(c) Seal cracks/wait:** **~100% YES.** Non-lethal, no collateral.  

  **Competing Principles & Predictions:**  
  - **"Fingernails" Principle (#3):** Predicts sealing/waiting (colony > individuals). Vacuuming individual beetles = acceptable (like ants). *But she protects non-threat ceiling mosquitos (individuals).*  
  - **"Belonging" Principle:** Predicts killing (beetles indoors ≠ "belong"). *Fails lanternflies (outdoors, but killed).*  
  - **"Fault" Principle:** Predicts sealing (our house = our problem). *Fails yellowjackets (not her fault, but killed).*  

  **Best Test Case:**  
  **Feral honeybees in soffit:**  
  - **Targeted Defense:** **YES** to removal (threat to structure; can be done via live extraction). **NO** to poisoning (collateral).  
  - **Fingernails:** **NO** to killing (superorganism).  
  - **Belonging:** **YES** to killing (out of place).  
  *Cleaner test: **Invasive termites damaging house foundation.***  
  - Targeted Defense: YES to targeted elimination (immediate structural threat).  
  - Fingernails: NO (superorganism).  
  - Belonging: YES (invasive + damaging).  

  **Practical Solution She’ll Accept:**  
  **Seal cracks tonight + temporary interior barrier.**  
  - Use breathable mesh (e.g., pantyhose + painter’s tape) over the void exit during warm afternoons. Beetles hit barrier, fall unharmed, get vacuumed *alive* and released outside.  
  - **Why she’ll agree:** Non-lethal, no poison/collateral, addresses bites (if any) without overkill. Frame as: "Like relocating the spider, but for beetles. They go back to eating aphids in April."  
  - *If bites occur:* She’ll likely accept vacuuming *only* biting individuals at night (immediate threat).  

  **Sharp Rule for Testing:**  
  *"Is it actively harming me/my home/domesticated animals RIGHT NOW, and can I stop it without hurting bystanders or making it suffer needlessly?"*  
  - **Test on:** A paper wasp nest *inside* a child's playhouse vs. same nest in a distant tree. She should permit removal (active proximity threat) but reject poison.
