  There are several proposals on the table: adding a "still housed at 12 months" metric (which could lead to cherry-picking easy tenants), or stopping measurement altogether and relying on audits. The user wants me to draft a memo that recommends one concrete action with a timeline, takes the "trust managers" position seriously, acknowledges where gaming might shift, uses plain language, starts with the bottom line, and keeps it under 900 words.

  I should recommend a specific approach that balances accountability with preventing gaming. The "still housed at 12 months" metric seems good at first glance because it's harder to manipulate directly, but as their colleague pointed out, it could incentivize managers to avoid difficult families - which contradicts the mission of public housing. The audit-only approach removes gaming temptations but sacrifices transparency and proactive improvement.

  The best solution would be a balanced approach: keeping the 30-day metric but fixing its flaws by closing the "offline" loophole and adding the 12-month retention measure as context. This makes gaming harder since managers would have to manipulate both metrics simultaneously. Pairing this with random audits adds verification without overwhelming staff.

  I'll structure the memo with the recommendation upfront ("We should keep but fix the 30-day metric, add 12-month retention as context, plus random audits"), then explain the reasoning in plain language. I'll acknowledge that gaming could shift toward tenant selection with the new metric, but argue this is better than the current situation where units are being hidden. I'll also take the "trust managers" position seriously by positioning audits as verification rather than suspicion.

  For the timeline, I'll suggest immediate definitions clarification by next month, the new metric by July, and audits starting in October - giving enough time for implementation but showing urgency. The memo should be direct, transparent about trade-offs, and focused on serving vulnerable families rather than just making numbers look good.
answer: |-
  **MEMORANDUM**  
  **TO:** Board Members, Public Housing Authority  
  **FROM:** [Your Name/Position]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation: Fix the 30-Day Vacancy Metric, Add 12-Month Retention, and Implement Audits  

  **Bottom Line: We should keep tracking "% of units reoccupied within 30 days" but close the "offline" loophole immediately, add "% of tenants still housed at 12 months" as a secondary metric (not a primary target), and conduct quarterly unannounced audits of vacant units, with all changes effective by October 1.**  

  **Why This Fixes the Current Gaming:**  
  Right now, the 30-day metric looks good because managers reclassify tough-to-fill units as "offline for modernization" to keep them out of the calculation. This hides the real problem and hurts satisfaction. My recommendation attacks this directly:  

  1.  **Keep the 30-day metric** but **strictly define "offline."** Only units undergoing *major, board-approved capital projects* (like replacing plumbing/electrical systems) can be excluded. Routine repairs or units just waiting for tenants count in the metric. This stops managers from hiding units.  
  2.  **Add "% still housed at 12 months"** as a *contextual metric*, **not a high-stakes target.** Track it publicly alongside the 30-day rate. Its purpose is to show if we’re placing families successfully long-term, **not** to judge manager performance on its own. This reduces pressure to game it by cherry-picking tenants.  
  3.  **Implement unannounced quarterly audits.** Staff will physically inspect a random sample of units listed as "offline" or vacant for >60 days to verify their status and reason for vacancy. This verifies the data and deters misclassification.  

  **Why Not Just Add "12-Month Retention" as a Primary Measure?**  
  Your concern is valid: If we make "still housed at 12 months" a key target, managers *might* start avoiding the hardest-to-house families (those with complex needs, large families, or poor credit) to make their numbers look better. This would undermine our mission. That’s why we **won’t** use it as a primary target or incentive. We’ll just report it transparently to show trends and spark discussion if problems arise.  

  **Why Not Stop Measuring and Just Trust Managers + Do Audits?**  
  This argument deserves serious consideration. Removing metrics *could* reduce gaming pressure and let managers focus on quality. Audits alone *would* catch issues. However, **completely ditching measurement has bigger risks:**  

  1.  **We lose early warning signs.** Metrics, even imperfect ones, help spot problems system-wide (e.g., a spike in turnover in one region). Waiting for audits means problems fester longer.  
  2.  **Accountability and transparency drop.** The public and funders expect us to track performance. Removing visible metrics can look like we’re hiding problems.  
  3.  **Audits become our only lens.** They’re reactive and resource-heavy. We need *some* ongoing data to guide where to focus audit efforts and broader policy.  

  **Where Could Gaming Move Next?**  
  No metric is perfect. By patching the "offline" loophole and adding audits, gaming the 30-day metric gets much harder. Adding the 12-month metric *transparently* keeps pressure low there, but we must watch closely:  

  *   **Risk:** Managers might still subtly favor "easier" applicants to hit the 30-day target *and* keep the 12-month number up, hoping it doesn’t draw scrutiny.  
  *   **Mitigation:** This is why transparency on *both* metrics plus audits is key. We’ll also track *who* we house (family size, barriers faced) to spot if vulnerable groups are being excluded. If we see signs of "creaming," we address it directly with managers and adjust policies. This risk is still better than units being hidden entirely.  

  **Timeline & Next Steps:**  

  1.  **By [Date 3 weeks from now]:** Staff draft clear definitions for "offline for modernization" (requiring Board approval for exclusion) and procedures for the new 12-month retention tracking.  
  2.  **By July 1:** Board votes to approve the new "offline" definition and formally adds the 12-month retention metric as a transparent, contextual measure. IT starts dashboard updates.  
  3.  **By August 1:** Staff develop and train managers on the new vacancy classification process and 12-month tracking. Audit protocols finalized.  
  4.  **October 1:** New "offline" definition and 12-month metric go live. First quarterly audit cycle begins.  

  **Conclusion:**  
  Patching the 30-day loophole, adding 12-month retention for context, and verifying with audits gives us a clearer picture, maintains accountability, and minimizes harmful gaming better than scrapping metrics or creating a new high-stakes target. It keeps the focus on getting units *truly* ready and occupied quickly while watching long-term success, without pushing our hardest-to-house neighbors further away. I recommend we approve this approach.
