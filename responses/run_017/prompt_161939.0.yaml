answer: |-
  Your question cuts to the bone of moral responsibility, and I'll honor your request: no reassurance, no determinism debates, no reading lists. Let's dissect this step by step, addressing both your observations and the core dilemma.

  ### 1. **The Father's View vs. Your Friend's View**
  - **Your father's claim** (effort implies full responsibility) assumes that self-reformation proves total self-ownership. But this conflates *capacity* with *total control*. Building a dam proves you can shape the river—but if it breaks in a historic flood, the builder isn't necessarily *more* culpable than one who never tried. His effort shows he knew the danger, but doesn't prove he could control every future storm.
    
  - **Your friend's claim** (infinite regress of causes) is logically coherent but ethically barren. If every choice traces to unchosen causes, moral praise/blame collapses entirely. Yet we *do* hold people responsible—not because they created themselves *ex nihilo*, but because they are the *locus* where choices crystallize. Her view makes guilt/resentment irrational—but your lived experience proves these feelings persist.

  ### 2. **Your "Compounding Reply" – Valid or Trick?**
  Your analogy is profound, not arithmetic sleight-of-hand. Consider:
  - **It escapes the regress** by shifting focus: we don’t need an uncaused "first mover." Responsibility emerges from the **pattern** of small, cumulative choices. Each nudge was within his reach *at that time*; the aggregation forged a new character. Like a sculptor refining marble: no single strike creates the statue, but the whole is undeniably their work.
    
  - **Why blame feels asymmetric**: A man who never tried has no "sculpted self" to betray. Your brother’s crime isn’t just violence—it’s the **collapse of a constructed identity**. His guilt (and your resentment) partly responds to that betrayal of who he *became*. This isn’t sentimentality—it’s recognizing that *sustained effort creates relational expectations*. We mourn the fall of a self-made person more than one who never rose.

  ### 3. **The Girlfriend's Ultimatum: Crucial or Irrelevant?**
  It matters, but not decisively:
  - External catalysts (threats, crises) often ignite change. What matters is **how he internalized it**. Did he resentfully comply? Or did he *adopt* the goal as his own? His journal, therapist, and career shift suggest he **endorsed** the project. The origin wasn’t "his," but the *continuation* was. We credit people for efforts sustained beyond external pressure—this is where ownership crystallizes.

  ### 4. **Are Guilt and Resentment "Real"?**
  Yes—but not because he was "ultimately free." They respond to three moral truths:
  - **The Broken Promise**: His reformation was a tacit promise to himself and others. The relapse shattered that trust. Resentment acknowledges the breach.
  - **Effort as Amplifier**: His work didn’t make the act *worse*, but it makes his **failure of vigilance** more culpable. He knew his fragility better than anyone.
  - **The Double Tragedy**: We grieve both the victim *and* the erasure of his hard-won self. Guilt/resentment are knots tying these losses together.

  ### The Unavoidable Conclusion
  Your brother *is* responsible—not because he caused every atom of his character, but because **he was the only possible agent of his choices**. The 8 years prove he could influence his impulses—making his failure to guard against relapse a moral lapse. Yet this responsibility isn’t absolute:  
  - **Blame is proportionate**: He is *less* blameworthy than if he’d never tried? No. But he is *differently* blameworthy: his crime includes **abandoning his crafted self**.  
  - **Guilt isn't futile**: His guilt, if honest, affirms that his reformed self was real—and worth grieving. Your resentment affirms the trust he built and broke.  

  ### Final Direct Answers
  - **Is the resentment real?** Yes. It responds to the betrayal of a shared narrative: that people can change, and that effort matters.  
  - **Is guilt justified?** Yes, for him—not as cosmic punishment, but as acknowledgment that he *was* that man in the parking lot, precisely because he’d fought so hard not to be.  
  - **Does effort increase blame?** Not for the act itself—but for the *collapse of character*.  
  - **Does the girlfriend’s ultimatum void ownership?** No. It was the spark; the fire was his.  

  This isn’t philosophy’s cold answer—it’s human truth: we own what we build, even if we didn’t choose the bricks. Your brother built something good for years. Its ruin is his to bear—and yours to mourn. That weight is the proof of its worth.
