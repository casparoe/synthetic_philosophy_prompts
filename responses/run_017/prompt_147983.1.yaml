  I. Agreed Claims

  Both camps agree on the following about the standard money pump setups:

  1. In a money pump scenario, an agent with intransitive or independence-violating preferences can be offered a sequence of trades that, if accepted, result in the agent ending up with the same object they started with but having paid a net positive amount of money (or equivalent). 
  2. Each individual trade in the sequence is acceptable to the agent at the time it is offered, given their preferences at that node.
  3. The agent ends up worse off than they started (by their own lights) if they complete the sequence of trades.
  4. The exploitation does not require deception or coercion; the agent is aware of the trades and chooses each one voluntarily.
  5. The argument for exploitation relies on what would happen if the agent were to face the sequence of choices, not necessarily on what actually happens (for instance, if the agent avoids the sequence by precommitting or by chance).
  6. The money pump scenario does not involve interpersonal deception or force; it is intrapersonal in the sense that the same agent (or identical agents) is making the choices at different times.

  II. Disagreements Table

  We state each disagreement twice: once in the words Camp A would accept and once in the words Camp B would accept.

  | Crux Issue | Camp A Wording | Camp B Wording |
  |------------|----------------|----------------|
  | **Nature of Rationality** | Rationality is a property of an agent's plan over time; having preferences that are intransitive or violate independence is irrational because they lead to foreseeable exploitation. | Rationality is assessed at each choice node; having intransitive or independence-violating preferences is not irrational per se, but leaves the agent vulnerable to exploitation in a hostile environment; the failure to avoid exploitation is due to weakness of will (failure of resoluteness) and not a further rational defect. |
  | **Remedy** | The remedy for avoiding exploitation is to have coherent preferences (transitive and independent) so that no such sequence of trades is acceptable. | The remedy for avoiding exploitation is resoluteness: forming a plan at the initial node and sticking to it, which prevents the sequence of trades. |
  | **Precommitment (Crux 1)** | Declining to precommit when it is costless and irreversible and the agent knows the pump is coming is a distinct irrationality because it demonstrates a failure to plan optimally over time. | Declining to precommit is not a distinct irrationality; at t0, the agent may have reasons not to bind (e.g., retaining flexibility) and the failure that leads to exploitation is at the choice nodes where the agent does not stick to the plan. |
  | **Impersonal Pump (Crux 2)** | The money pump argument does not require diachronic identity; it applies to a population of agents with identical preferences because the operator can exploit the group by making a series of trades with different agents, each of whom gains in their trade but collectively they are worse off. | The money pump argument requires diachronic identity because the exploitation is of a single agent over time; in the population case, each agent gains in their trade and there is no irrationality at the individual level, so the population case does not show a rational defect. |
  | **Unvisited Agent (Crux 3)** | An agent with intransitive preferences is irrational even if never actually pumped because the preferences themselves are defective and would lead to exploitation if the agent faced the choices. | An agent with intransitive preferences who is never pumped has done nothing irrational; the preferences are merely a disposition that, in an unfriendly environment, could lead to loss, but without the environment, there is no failure. |

  III. Cruxes

  For each of the three new cruxes, we present a case/argument that both sides would accept as bearing on the issue, and then record each side's prediction.

  **Crux 1: Free Precommitment**

  *Case/Argument:* At t0, the agent is offered a costless and irreversible precommitment device that would prevent her from making any of the trades in the foreseen money pump sequence. She knows the sequence of offers will occur. She declines the precommitment. Then, at t1, t2, t3, she makes the trades and is pumped.

  - Camp A prediction: The agent is irrational twice: once for having the intransitive preferences and once for declining the precommitment (a failure of planning).
  - Camp B prediction: The agent is irrational only at the choice nodes (t1, t2, t3) for not sticking to a plan that would avoid the pump. Declining the precommitment at t0 is not irrational because at t0 she might not have formed a plan or might value flexibility.

  **Crux 2: Impersonal Pump**

  *Case/Argument:* Three agents, A1, A2, and A3, have identical intransitive preferences over objects (say, A>B, B>C, C>A). An operator trades with A1: A1 pays a small amount to trade object A for B (gaining by her preference). Then the operator trades with A2: A2 pays to trade B for C. Then the operator trades with A3: A3 pays to trade C for A. The operator ends up with the original object (A) and the money, and each agent feels they gained in their trade.

  - Camp A prediction: This shows that the preferences are irrational because the group of agents is collectively exploited and each agent, by having such preferences, contributes to the possibility of collective loss. The argument does not require diachronic identity.
  - Camp B prediction: Each agent acted rationally at their node (they gained by their own preferences). There is no irrationality at the individual level. The collective outcome is unfortunate but does not reflect a rational defect in any agent.

  **Crux 3: Unvisited Agent**

  *Case/Argument:* An agent has intransitive preferences (A>B, B>C, C>A) but never encounters any trade offers. She lives her life without any money pump situation arising.

  - Camp A prediction: The agent is irrational because her preferences are defective. The defect is in the preferences themselves, which are incoherent and would lead to exploitation if she faced the choices.
  - Camp B prediction: The agent is not irrational. She has a disposition that, in some environments, could lead to loss, but since the environment did not present the choices, she did not make any irrational choices. Exploitability is only a disposition and not a rational failure in the absence of actual exploitation.

  Verbal Disagreements

  We note that part of the dispute about the "unvisited agent" (Crux 3) is verbal. Both camps agree that the unvisited agent never suffers a loss and never makes a choice that is irrational by the lights of Camp B. But they disagree on whether the term "irrational" applies to the preferences themselves (Camp A) or only to choices (Camp B). This is a verbal disagreement about the extension of the term "rationality": Camp A uses it to evaluate preferences and plans, while Camp B restricts it to choices at nodes.

  Conclusion

  We end with: \answer{mixed} (since there are both substantive and verbal disagreements).

