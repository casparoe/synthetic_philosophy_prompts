prompt: |-
  I keep bumping into a thing and I dont have a word for it. Example: arguing with a friend who says, seriously, that any photo in the news might be AI-generated, so nothing visual is evidence for anything anymore. I notice I can't produce an argument that stops him — every reason I give already assumes what he's denying — but I also don't treat his position as a live option I might turn out to be wrong about. I just treat him as outside the conversation. Same shape, different content, a couple of hundred years back, or so it seems to me: which sources count as testimony you can build on has changed, and it changed without anyone winning an argument.

  So the pattern. Some claims work as stopping points where reasons run out, but (a) they're not insulated from revision — whole communities have swapped them out over time and you can often say roughly when, and (b) while one is in force, denying it doesn't get you a hearing; you get corrected, trained, or laughed at rather than argued with. They behave like facts when you deny them and like contingent historical commitments when you look at them from far enough away.

  I half-remember that Wittgenstein's On Certainty is somewhere in this neighborhood, but as far as I can tell that's about propositions that can't be doubted, and mine plainly can be — just not all at once. Is there an established concept for this exact configuration, and what are the nearest candidates and where does each fail to fit? Don't just hand me a label: if nothing established fits, give me a name, a definition, and the borderline cases where it'd be unclear whether something counts.
reasoning: |-
  Okay, the user is describing a recurring philosophical dilemma they're encountering. They're noticing certain foundational beliefs that function as unquestionable truths within a discourse community, yet historically these beliefs have changed over time. The key characteristics are: (1) these beliefs serve as stopping points for arguments, (2) they're revisable historically, (3) denying them excludes one from serious conversation, and (4) they appear as facts internally but as contingent commitments externally.

  The user mentions Wittgenstein's On Certainty but correctly notes it doesn't quite fit because Wittgenstein focused on propositions that can't be coherently doubted, whereas the user observes beliefs that are collectively doubted and changed over time. The user wants either an established term for this concept or a newly coined term with clear definition and boundaries.

  I recall that Robert Brandom's work on "deontic scorekeeping" addresses how communities maintain normative commitments. His concept of "default entitlements" seems relevant - these are commitments treated as prima facie justified unless challenged. Michel Foucault's "episteme" describes historical frameworks that determine what counts as knowledge. Thomas Kuhn's "paradigm" from scientific revolutions also fits well, as paradigms define what counts as legitimate problems and solutions.

  For a new term, I consider "discursive bedrock" to capture how these beliefs form the foundation of discourse, "justificatory commons" to emphasize their shared nature as resources, "hermeneutic threshold" to highlight their gatekeeping function, or "epistemic levees" as a metaphor for their boundary-protecting role. 

  The clearest fit seems to be Kuhn's "paradigm" supplemented with Foucault's "episteme." For a new term, "discursive bedrock" is strong because it combines the foundational aspect with the conversational context. Borderline cases would include: beliefs that are doubted by some but not excluded (like flat earth theories), temporary methodological assumptions in science, and cultural beliefs that are challenged internally rather than externally.

  The user likely wants this concept not just for classification but to navigate situations like their AI-skeptic friend - understanding why some positions don't get traction helps decide when to engage or disengage. There's also an unstated need to reconcile the tension between respecting others' views while maintaining intellectual integrity when faced with radical skepticism.
answer: |-
  Your observation is razor-sharp, and the pattern you describe is indeed central to epistemology and the philosophy of language. Wittgenstein's *On Certainty* touches the edges (focusing on "hinge propositions" we don't doubt *in practice*), but your phenomenon is more social, historical, and normative. **There isn't a single, universally accepted term capturing *exactly* this configuration, but several concepts get close.** Let's break it down:

  **Near Candidates & Where They Fall Short:**

  1.  **Wittgenstein's "Hinge Propositions" (On Certainty):**
      *   **What it is:** Foundational propositions that are not justified by other propositions but are the "hinges" on which our language games and inquiries turn. We don't *doubt* them practically (e.g., "The Earth exists," "I have hands," "This is a chair").
      *   **Why it's close:** They function as stopping points where reasons run out; denying them seems nonsensical *within* the language game. You *can't* argue for them without circularity.
      *   **Where it fails:** (a) Hinges are presented as *individual* or *universal* necessities of thought/action, not as *historically contingent community commitments* that demonstrably change ("The sun revolves around the Earth" *was* a hinge). (b) Denying a hinge makes you seem *mad* or *philosophically confused*, not necessarily "outside the conversation" in a social sense – it might just halt *that specific* inquiry. (c) Hinges are often pre-linguistic or basic sensory certainties, not complex social-epistemic norms like "Photographic evidence is generally reliable" or "This ancient text is authoritative."

  2.  **Thomas Kuhn's "Paradigm" (The Structure of Scientific Revolutions):**
      *   **What it is:** The constellation of beliefs, values, techniques, and exemplars shared by a scientific community that defines legitimate problems and solutions within a period of "normal science."
      *   **Why it's close:** (a) Paradigms define what counts as evidence, legitimate questions, and acceptable solutions (like photographic evidence being bedrock). (b) They are historically contingent and change via revolutions, not argument. (c) Working *within* a paradigm, foundational assumptions aren't questioned; challenging them marks you as *outside* the community of normal science.
      *   **Where it fails:** Kuhn focused on *science*. Your examples (photo evidence reliability, historical testimony norms) span broader social/cultural/epistemic practices. Paradigms are more complex systems; your pattern might be a *component* (the foundational commitments *within* a paradigm) rather than the whole.

  3.  **Robert Brandom's "Default Entitlements" / Deontic Scorekeeping:**
      *   **What it is:** Within a discursive practice, speakers are *presumed entitled* to certain claims unless challenged. Challenging a default entitlement shifts the justificatory burden. The community implicitly "keeps score" of what commitments/entitlements each speaker has.
      *   **Why it's close:** (a) Perfectly captures the "stopping point" nature – photo evidence is a default entitlement; denying it *requires* justification *from you*, not justification *for it* from others initially. (b) Explains why denial excludes you or requires correction – you're violating the normative scorekeeping rules of the conversation. (c) These defaults are socially instituted and can change.
      *   **Where it fails:** Brandom's framework is highly technical and focused on *linguistic* practices and inference. While applicable, it might feel overly abstract for describing the concrete historical shifts you note. It doesn't inherently emphasize the *historical contingency* aspect as strongly as you do; change is possible, but the *mechanism* isn't its primary focus.

  4.  **Michel Foucault's "Episteme" (The Order of Things) / "Regime of Truth":**
      *   **What it is:** The underlying historical "grid" or structure that defines what counts as knowledge, truth, and legitimate discourse within a particular period and culture.
      *   **Why it's close:** (a) Directly addresses the historical contingency of foundational concepts ("what counts as testimony"). (b) Defines what is sayable/thinkable/arguable – denying episteme-bound truths excludes you from serious discourse *within* that episteme. (c) Changes occur through historical shifts, not argument.
      *   **Where it fails:** Epistemes are vast, epoch-defining structures. Your pattern seems like a *micro-practice within* an episteme – specific norms about evidence types (photos, texts) rather than the entire historical a priori. Foucault is also less concerned with the *justificatory stopping point* in individual arguments and more with large-scale power/knowledge structures.

  5.  **"Common Ground" (Pragmatics/Linguistics):**
      *   **What it is:** The shared beliefs, assumptions, and knowledge participants in a conversation mutually take for granted.
      *   **Why it's close:** Violating common ground disrupts conversation. Photo evidence reliability *is* common ground in most news discussions.
      *   **Where it fails:** Too weak. Common ground is often trivial or contextual (e.g., "We're talking about the weather"). It doesn't capture the *foundational*, *justification-halting*, *historically shifting*, and *normatively enforced* nature you describe. Challenging common ground might just cause confusion, not exclusion or correction.

  **A Proposed New Term: "Discursive Bedrock"**

  Since no single established term perfectly fits your precise, insightful configuration, let's coin one:

  *   **Term:** **Discursive Bedrock**
  *   **Definition:** A proposition, norm, or category of evidence that, within a specific epistemic community at a given time, functions as:
      1.  **Justificatory Terminus:** A stopping point for reasons; arguments *rely* on it but cannot coherently *argue for* it within the discourse without circularity or presupposition.
      2.  **Normative Foundation:** Its acceptance is a prerequisite for being recognized as a competent participant in the relevant domain of discourse. Denial typically results in correction, dismissal, exclusion, or training rather than argumentative engagement *on the merits of the bedrock proposition itself*.
      3.  **Historically Contingent:** While treated as immutable fact *within* its operational context, discursive bedrock is recognized (often retrospectively) as subject to historical change through shifts in practice, technology, or broader epistemic regimes, not through direct refutation by argument *within* the previous framework.
  *   **Key Features:** Social, Normative, Foundational within context, Historically Mutable, Justification-Halting, Community-Defining.

  **Borderline Cases for "Discursive Bedrock":**

  1.  **"The Earth is Round":** In mainstream contemporary discourse? Absolutely bedrock. Denial gets you excluded from serious geography/science talk. *But*... in a Flat Earth community? Denying roundness *is* the bedrock. The key is the *specific epistemic community* and *domain*.
  2.  **Mathematical Axioms:** Within a specific formal system (e.g., Euclidean geometry), axioms are bedrock. Denying them excludes you from *that* system. But mathematicians constantly create *new* systems with different axioms. Is this historical change *of the same type* as shifting views on testimony? Arguably yes, though more formalized. **Verdict:** Clear bedrock *within a specific formal system*.
  3.  **"Water is H₂O":** In chemistry? Bedrock. Denial requires massive justification or marks you as incompetent. But what about historical periods before modern chemistry? "Water is an element" was bedrock then. **Verdict:** Clear bedrock *within modern chemistry*.
  4.  **"Democracy is good":** Within many Western political discourses? Often treated as bedrock. Denial can exclude you from mainstream debate. *But*... is this enforced via argumentative exclusion *in the same way*? Often, opponents *are* argued with, even if fiercely. The *type* of exclusion might be different (more political/social than epistemic). **Verdict:** Borderline. It functions *somewhat* like bedrock in certain contexts, but the enforcement mechanism (social pressure vs. epistemic dismissal) and the potential for argument *within* the discourse might be higher.
  5.  **"This specific scientific instrument is accurate":** Within a lab using a well-established technique? Temporarily bedrock *for interpreting results*. Denial requires extraordinary evidence. But this is more *methodological assumption* than broad epistemic foundation, and it *can* be directly challenged with evidence *within* the paradigm (e.g., calibration error found). **Verdict:** Borderline. Shares the justification-halting and normative features *contextually*, but is usually less foundational and more open to direct empirical challenge *within* the normal discourse than, say, the reliability of *all* photography.

  **Why "Discursive Bedrock" Fits Your Examples:**

  *   **Photo Evidence:** In mainstream news discourse, "Generally, photos presented as evidence in reputable outlets are reliable representations of reality" is **discursive bedrock**. Denial (like your friend's) marks you as outside the conversation (you get dismissed, not debated on the merits of each photo). This norm emerged historically (with photography) and *is* changing due to AI, but that change isn't happening because your friend *won an argument*; it's a messy socio-technical shift.
  *   **Historical Testimony:** "Certain texts/authorities are reliable historical sources" is bedrock *within a specific historiographical tradition*. What counts as bedrock changes over time (e.g., shift from solely relying on religious texts to archaeological evidence + critical textual analysis). Denying the bedrock sources of one era would have excluded you; denying them now is standard practice *because the bedrock shifted*.

  **In essence, Discursive Bedrock is the socially enforced, historically contingent foundation upon which the "game" of giving and asking for reasons is temporarily played within a community.** It explains why you can't "argue" your friend out of his position – his denial attacks the bedrock your argument *requires*. It also explains why his position isn't a "live option" for you – accepting it would require abandoning the discursive game you're both ostensibly trying to play (evaluating news events), rendering coherent conversation impossible *on those terms*. The bedrock defines the terms.
