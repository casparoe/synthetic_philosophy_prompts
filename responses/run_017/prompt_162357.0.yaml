   Let's write the procedure formally:

   **Safeguard Evaluation Procedure**

   1. **Harm Severity Assessment**
      - Ask the proposer: "What is the worst-case harm that could occur if this safeguard fails?"
      - If the worst-case harm is catastrophic (e.g., loss of life, existential risk, company failure, massive irreversible damage), then output: "Requires worst-case guarantee" and stop.
      - Otherwise, proceed.

   2. **Safeguard Type**
      - Ask the proposer: "Is this safeguard claimed to be absolute worst-case, conditional worst-case, or average-case?"
          - If absolute worst-case:
              - Require either:
                  a) A formal proof from a trusted expert team, reviewed by independent experts, OR
                  b) Extensive independent penetration testing that failed to break the safeguard.
              - If provided, output: "Absolute worst-case guarantee provided" and stop.
              - If not provided, then treat as conditional worst-case and proceed to step 3.
          - If conditional worst-case, proceed to step 3.
          - If average-case, proceed to step 4.

   3. **Conditional Worst-Case Test**
      - Ask the proposer to provide:
          a) An enumeration of scenarios that are mutually exclusive and exhaustive for the threat model.
          b) Evidence that within each scenario, the safeguard provides a worst-case guarantee (i.e., it works for every possible instantiation of that scenario).
          c) Evidence that the distribution over scenarios is fixed and cannot be influenced by the agent.
          d) A statement of any known gaps in the scenario enumeration.
      - If all of the above are satisfied and there are no known gaps, output: "Conditional worst-case sufficient" and stop.
      - Otherwise, proceed to step 4 (average-case evaluation).

   4. **Average-Case Evaluation**
      a) **Validation Data Independence**
          - Determine if the validation data was generated by the model being deployed or a similar model.
          - If independent (e.g., human-generated, historical data), proceed to step 4c.
          - If dependent (model-generated), proceed to step 4b.
      b) **Coverage of Deployment Distribution**
          - Ask for evidence that the validation data covers the deployment distribution, including:
              - The model used for generating the validation data is at least as capable (in the relevant dimensions) as the deployed model.
              - The validation scenarios include adversarial examples and are representative of real use.
              - There is no distributional shift due to the safeguard being active or the model's awareness.
          - If evidence is provided and it convinces the reviewer, proceed to step 4c.
          - Otherwise, output: "Requires worst-case guarantee because validation distribution does not cover deployment" and stop.
      c) **Failure Rate Estimation**
          - Obtain the failure rate from the validation data, including confidence intervals.
          - If the failure rate is not provided or the confidence intervals are too wide, output: "Insufficient evidence for average-case; requires worst-case guarantee" and stop.
      d) **Expected Harm Calculation**
          - Calculate the expected harm per deployment: failure rate * harm per failure.
          - Extrapolate to the expected harm over the planned number of deployments.
          - Present to a human decision-maker: "The expected harm per week/month/year is [X] (with confidence interval [Y]). Is this acceptable?"
          - If acceptable, output: "Average-case evidence sufficient."
