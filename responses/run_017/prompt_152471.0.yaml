prompt: |-
  I mod a ~40k-person community in a niche technical hobby (Discord plus a forum, professional and amateur members mixed together), and I also write the weekly roundup that goes out to everyone. Our head mod wants us to start doing a quarterly "epistemic self-audit" of the community and of each of its subforums, and she wants it to be a procedure, not a vibe: something a mod with no philosophy background can run in about half an hour per subforum, using only things we can actually observe from mod tooling and from reading a random sample of threads, producing a short result that has to be signed off by her and then posted publicly — which is a real constraint, because if it reads as "your community is brainwashed" it will start a flame war and get reverted, so it needs to be able to say "this community has this structural feature" without issuing a verdict on any member's rationality. The distinction I want to operationalize is the one I half-remember from a philosophy paper I read a while back (possibly by someone named Nguyen? I genuinely don't remember and I don't need a citation): an *epistemic bubble* is where you simply never encounter the other side, it's a failure of omission, and it pops on contact with outside sources; an *echo chamber* is where you do encounter them but the community has installed a credibility-reduction machine against outgroup sources, so exposure makes things worse rather than better, and the thing to audit is the machine, not the exposure.

  Here's the wrinkle I most want the procedure to handle, because I think it's real and I don't think it's in the thing I read: our sister community runs "steelman Saturday," where every week they post the strongest version of the outgroup case *already attached to a rebuttal written by one of their own*, and everyone there thinks this makes them unusually open-minded. My suspicion is that refutation-first curation is a discreditation engine with extra steps — it manufactures the appearance of contact while training members that outgroup arguments arrive pre-defeated — and is therefore worse than simply not posting them, but I want a procedure that can *return* that verdict rather than me asserting it. Relatedly, I want the procedure to distinguish a community that discredits the outgroup *source* ("that lab is industry-funded") from one that discredits the *practice of taking it seriously* ("why are you platforming this," "this is both-sidesing"), and to track the asymmetry between inbound permeability (do outgroup links ever get posted?) and outbound permeability (do members read everything and just filter the uptake?), plus whether ex-members who come back with reports from outside get a hearing or get treated as contaminated. So: give me the questions in the order to ask them, what counts as a sufficient answer to each given only mod-level evidence, where the procedure stops with a hard NO on an intervention — my strong prior is that "just add more outside sources" should be a NO for one of the two categories and a YES for the other, and I want that written into the flow — and where it hands the decision to a person because it's a values question rather than a factual one (e.g. our community does legitimately exist to advance a position, and the head mod will veto anything that requires judging whether an outgroup claim is actually true, so the procedure has to bracket first-order truth and only audit structure). Then run it on three cases: a small genealogy subforum that cites only three in-group sites but is perfectly friendly to outsiders; the steelman-Saturday community; and our own main forum — and I want you to be willing to give me an answer I won't like on the third one, since my honest guess is that we're an echo chamber specifically around whether the mainstream institutions in our field are trustworthy, and that my own weekly roundup is part of the machine. Also tell me which distinctions from the theory have to survive the simplification for it to still be doing real work and which can be dropped, and be blunt about where it will misfire — especially that it can't distinguish a justified refusal to amplify a bad actor from an unjustified one.
reasoning: |-
  We are designing an epistemic self-audit procedure for a community. The goal is to distinguish between:
  - Epistemic bubbles (failure of omission: lack of exposure to outgroup views) and 
  - Echo chambers (discrediting machine: exposure to outgroup views but with a mechanism to reduce their credibility).

  Key features of the procedure:
  1. Must be runnable by a mod with no philosophy background in about 30 minutes per subforum.
  2. Uses only observable evidence from mod tools and reading a random sample of threads.
  3. Produces a short result that is signed off by the head mod and posted publicly without causing flame wars (so no judgment on members' rationality, just structural features).
  4. Must bracket first-order truth (we don't judge if an outgroup claim is true, only the structural handling of it).

  The procedure should also handle:
  - The "steelman Saturday" case: where outgroup arguments are presented but pre-rebutted by an in-group member. We suspect this is a discreditation engine.
  - Distinguish between discrediting the source (e.g., "that lab is industry-funded") vs discrediting the practice of taking it seriously (e.g., "why are you platforming this").
  - Track inbound permeability (are outgroup links posted?) vs outbound permeability (do members engage with outgroup content?).
  - How ex-members returning with outside reports are treated.

  We also want the procedure to have:
  - Clear questions in a specific order.
  - What counts as sufficient evidence (using mod-level evidence).
  - Where the procedure stops with a hard NO (e.g., on interventions: "just add more outside sources" should be a NO for one category and YES for the other).
  - Where it hands off to a human for a values decision.

  We'll test the procedure on three cases:
  1. A small genealogy subforum that cites only three in-group sites but is friendly to outsiders.
  2. The steelman-Saturday community.
  3. The main forum (which the requester suspects is an echo chamber on the trustworthiness of mainstream institutions).

  Additionally, we need to note:
  - Which theoretical distinctions must survive the simplification to be useful and which can be dropped.
  - Where the procedure might misfire (e.g., can't distinguish justified vs unjustified refusal to amplify a bad actor).

  ## Design of the Procedure

  ### Step 0: Preparation
  - Select a random sample of threads (e.g., 10 recent threads, or more if time allows) from the subforum to review.
  - Gather mod tooling data: number of posts removed, reasons for removal (if categorized), warnings/bans related to content (especially for posting outgroup content or challenging in-group norms).

  ### Step 1: Inbound Permeability
  - **Question 1.1**: In the random sample of threads, are there any posts that reference or link to outgroup sources? (Outgroup sources: those that represent a perspective that is opposed to or significantly different from the community's consensus on key issues.)
    - **Evidence**: Direct observation in the sample. If none found, check mod logs for removals of such content. Also, check if the subforum rules explicitly forbid certain sources.
    - **Sufficient answer**: 
      - If yes (found in sample or logs without being removed), move to Step 2.
      - If no, then the community might be an epistemic bubble (failure of omission). But we must check if the community is *supposed* to be about a specific topic that doesn't require outgroup views (values decision). So:
        - **Handoff to human (head mod)**: Is this subforum intended to be a space exclusively for in-group discussion? (e.g., a support group for a specific method might not need to engage with alternatives.) 
          - If yes, then it's not necessarily a problem (but note in report: "This subforum is intentionally focused and does not regularly engage with alternative perspectives.").
          - If no, then it is an epistemic bubble. **Intervention NO**: Simply adding more outside sources is appropriate (but note: we have to check if the community is an echo chamber first? We are in Step 1 and found no exposure. So we can recommend exposure, but we must note that if the community is an echo chamber, exposure might backfire. So we have to go through the steps.)

  - **Question 1.2**: If outgroup content is posted, what is the typical response? (Skip if no outgroup content found.)
    - **Evidence**: In the sample, look at the replies to outgroup content. Are they:
      - (a) Engaged with the substance of the argument (even if critical)?
      - (b) Dismissive without engaging (e.g., "this is garbage")?
      - (c) Discrediting the source (e.g., "that source is industry-funded")?
      - (d) Discrediting the act of posting (e.g., "why are you posting this?" or "this is both-sidesing")?
    - **Sufficient answer**: Categorize the dominant response. Also note if the outgroup content is removed by mods and for what reason (e.g., rule violation or not).

  ### Step 2: Outbound Permeability and Uptake
  - **Question 2.1**: When outgroup content is posted and not removed, do members engage with it beyond the initial response? (e.g., read the linked content and discuss it, or just dismiss it?)
    - **Evidence**: In the sample, look for follow-up comments that reference the linked content in detail. Also, check if the original poster of the outgroup content is asked for clarifications or if there is a substantive debate.
    - **Sufficient answer**: 
      - If there is substantive engagement (even if critical), then the community has some outbound permeability (members are willing to process outgroup information).
      - If not, then the community filters uptake.

  ### Step 3: Pre-rebutted Content and Credibility Reduction
  - **Question 3.1**: Does the community have a practice of presenting outgroup arguments with pre-attached rebuttals (like "steelman Saturday")?
    - **Evidence**: Check if there are regular features or common practices where outgroup views are presented only alongside an in-group rebuttal. Also, in the sample, note if when outgroup content is posted independently, it is often met with a rebuttal by an in-group member that becomes the focal point.
    - **Question 3.2**: In such cases, is the outgroup argument presented in its strongest form (steelmanned) and then rebutted, or is it presented in a weak form (strawman)?
      - **Evidence**: Compare the presented version with the original (if available) or with known strong versions. This is tricky without first-order judgment, so we rely on mods to note if the presentation seems fair (e.g., does the rebuttal acknowledge the strongest points?).

    - **Sufficient answer**:
      - If the community has a practice of pre-rebutted content and the outgroup argument is not steelmanned (or if the rebuttal is the main focus and the outgroup argument is not engaged with beyond the rebuttal), then this is evidence of a credibility reduction machine. 
      - If the pre-rebutted content is presented in a way that the outgroup's case is fairly represented and the rebuttal is a starting point for discussion (and the sample shows that the discussion sometimes leads to updating the in-group position), then it might be less problematic.

  ### Step 4: Treatment of Ex-Members and Returning Outsiders
  - **Question 4.1**: In the sample, are there any posts by ex-members or members who have engaged with outgroup communities and are reporting back? If not, skip.
  - **Question 4.2**: How are such reports received?
    - **Evidence**: Look at the responses: 
      - Are they given a fair hearing (e.g., questions asked about the experience, discussion of the content)?
      - Are they dismissed (e.g., "you've been brainwashed")?
      - Is the member themselves discredited (e.g., "you're a traitor")?
    - **Sufficient answer**: Categorize the dominant response.

  ### Step 5: Moderation Actions
  - **Question 5.1**: In mod logs, what are the common reasons for removing posts that contain outgroup content?
    - **Evidence**: Check the reasons given (e.g., "misinformation", "off-topic", "inflammatory"). Note if the removal is based on the source being outgroup (without regard to the content) or based on the content violating rules (e.g., being abusive).
    - **Question 5.2**: Are there warnings or bans for members who post outgroup content even when it is done respectfully and on-topic?
    - **Sufficient answer**: If outgroup content is removed primarily because it is from an outgroup source (or without a clear rule violation), then this is part of the discrediting machine.

  ### Step 6: Synthesis
  Based on the above, we can classify the community as:

  - **Epistemic bubble**: If there is no exposure to outgroup views (and the community is not intended to be insular) OR if exposure is very rare and not due to active suppression (then it's a bubble by omission).
  - **Echo chamber**: If there is exposure but:
    - The dominant response is discrediting the source or the act of posting without substantive engagement (Step 1.2, 2.1).
    - There is a practice of pre-rebutted content that trains members to see outgroup arguments as pre-defeated (Step 3).
    - Returning ex-members are discredited (Step 4).
    - Moderation actively removes outgroup content without clear rule violations (Step 5).

  Interventions:
  - For an epistemic bubble: **YES** to adding more outside sources (but note: if the community is also an echo chamber, this might backfire, so we must check for echo chamber features first? Actually, we can only add if it's a bubble and not an echo chamber. But if it's both, we have to address the echo chamber first? We don't want to add sources if it will make things worse. So the procedure should note: if echo chamber features are present, then adding outside sources without addressing the discrediting machine is **NOT RECOMMENDED** (hard NO for that intervention in the echo chamber case). Instead, the echo chamber must be addressed by changing the discrediting practices.

  But note: the head mod will veto anything that requires judging truth. So we can only recommend structural changes.

  ### Procedure Flow

  1. **Step 1: Inbound Permeability**
     - 1.1: Is outgroup content present? 
       - If no: handoff to human (is this intentional?).
          - If intentional: report as intentionally focused (not a bubble or echo chamber by design? But note: if intentional, it might still be a bubble, but one that is acceptable. We note it as such.)
          - If not intentional: then it's an epistemic bubble. **Recommendation: Increase exposure to outgroup sources (with caution: if echo chamber features are found later, this might not be safe). But we haven't checked for echo chamber yet. So we can only note "potential bubble" and move on to check for echo chamber? We can do the steps and then synthesize at the end.**
     - 1.2: If yes, what is the response? (Record the type.)

  2. **Step 2: Outbound Permeability** (if outgroup content is present)
     - 2.1: Is there substantive engagement? (Record.)

  3. **Step 3: Pre-rebutted Content**
     - 3.1: Is there a practice of pre-rebutted outgroup content? (Record.)
     - 3.2: Is the outgroup argument fairly presented? (Record.)

  4. **Step 4: Treatment of Ex-Members** (if applicable)

  5. **Step 5: Moderation Actions**

  6. **Step 6: Classification and Recommendations**
     - If no outgroup content and not intentional -> **Epistemic bubble**. 
       - Intervention: **YES** to adding outside sources (but note: if the community is also an echo chamber, we must fix that first? We haven't found evidence of an echo chamber because there's no exposure to discredit. So we can only say: add sources and monitor for echo chamber formation.)
     - If outgroup content is present but:
          - Dominant response is discrediting without engagement (Step 1.2: c or d, and Step 2.1: no substantive engagement)
          - Pre-rebutted content is used and the outgroup argument is not fairly presented (Step 3.1 and 3.2: no)
          - Ex-members are discredited (Step 4)
          - Moderation removes outgroup content without clear rule violations (Step 5)
       -> Then **Echo chamber**.
          - Intervention: **NO** to simply adding more outside sources (because it will feed the discrediting machine). Instead, recommend structural changes to reduce discrediting (e.g., change rules to require substantive engagement, ban source discrediting without evidence, etc.). But note: if the discrediting is based on values (e.g., the community is explicitly opposed to a position), then handoff to human.

     - If there is outgroup content and the response is substantive engagement (even if critical) and no discrediting machine features, then **Healthy engagement**.

  Also note: A community can have both bubble and echo chamber features? But typically, an echo chamber has some exposure (so not a bubble). The bubble is defined by lack of exposure.

  ### Hard NOs and Handoffs
  - **Hard NO**: For an echo chamber, the intervention "just add more outside sources" is a NO because it may worsen the situation.
  - **Handoff to human**:
    - When the lack of outgroup content is intentional (Step 1.1).
    - When the community has an explicit mission that requires discrediting certain sources (e.g., a community dedicated to debunking a specific theory might have rules against platforming it). Then the head mod must decide if the discrediting is aligned with the community's purpose.

  ### Running on the Three Cases

  #### Case 1: Small genealogy subforum
  - Only cites three in-group sites, but friendly to outsiders.
  - **Step 1.1**: Likely no outgroup content (since only three in-group sites). 
    - Handoff: Is this intentional? Yes, because it's a focused resource. 
    - Report: This subforum is intentionally focused and does not engage with alternative genealogy approaches. It is an epistemic bubble by design, but not an echo chamber because there's no discrediting machine (since no exposure). 
  - **Recommendation**: None needed, as it's intentional and not causing harm.

  #### Case 2: Steelman Saturday community
  - **Step 1.1**: Outgroup content is present (via the steelman event).
  - **Step 1.2**: The response is predetermined: the rebuttal is attached and becomes the focus. The outgroup argument is presented only through the lens of the rebuttal. So the dominant response is not to engage with the outgroup argument on its own, but to see it as already defeated.
  - **Step 2.1**: Since the event is structured, there might be discussion, but it's centered on the rebuttal. The outgroup argument is not independently engaged with (it's always mediated by the in-group).
  - **Step 3.1 and 3.2**: Pre-rebutted content is the norm. We need to check if the steelman is fair. Without first-order judgment, we can look at whether the outgroup's strongest points are acknowledged. But even if it is a fair steelman, the problem is that every outgroup argument is introduced with a rebuttal, which trains the community that outgroup arguments are always already defeated. This is a credibility reduction machine.
  - **Step 4**: Not specified, but assume no ex-members are present in the sample.
  - **Step 5**: Moderation might remove independent outgroup posts because they are not part of the event? (This would be a sign of discrediting the practice of posting outside the event.)
  - **Synthesis**: This community is an echo chamber because it has a credibility reduction machine (pre-rebutted content that reduces the need for individual critical engagement). The exposure is structured to reinforce in-group beliefs.
  - **Recommendation**: **NO** to adding more outside sources without changing the structure. The Steelman Saturday event itself is part of the problem. Instead, consider having events where outgroup arguments are presented without immediate rebuttal, and discussion is open.

  #### Case 3: Main forum (requester's own)
  - The requester suspects it's an echo chamber on the trustworthiness of mainstream institutions.
  - **Step 1.1**: Outgroup content (e.g., mainstream institutional reports) is sometimes posted, but perhaps rarely? Or when posted, it is often attacked.
  - **Step 1.2**: The dominant response might be discrediting the source (e.g., "that institution is corrupt") or discrediting the practice of posting (e.g., "why are you giving them a platform?"). The requester suspects the weekly roundup (written by them) is part of the machine. The roundup might highlight outgroup claims and then immediately refute them? Or frame them in a discrediting way?
  - **Step 2.1**: Substantive engagement might be lacking: members might not read the linked reports, or dismiss them without discussion.
  - **Step 3**: The weekly roundup might function like the steelman event: it curates outgroup content and pre-rebuts it. This is a discrediting machine.
  - **Step 4**: Ex-members who report from outside might be treated as contaminated (e.g., "you've gone mainstream").
  - **Step 5**: Moderation might remove posts that defend mainstream institutions as "misinformation" or "off-topic", without clear rule violations.
  - **Synthesis**: Likely an echo chamber. The weekly roundup is part of the credibility reduction machine.
  - **Recommendation**: **NO** to adding more mainstream sources without addressing the discrediting practices. The roundup should be restructured to present outgroup views without immediate rebuttal, and the community rules should encourage substantive engagement.

  ### Theoretical Distinctions that Must Survive
  - The core distinction between bubble (no exposure) and echo chamber (exposure with discrediting) must survive.
  - The distinction between discrediting the source and discrediting the practice is useful for diagnosing the machine, but in practice, both are discrediting. The procedure should note both as problematic.
  - Inbound vs outbound permeability: both are important, but if there's no inbound, then outbound doesn't matter (it's a bubble). For echo chambers, outbound permeability is low (they don't engage substantively).

  ### What Can Be Dropped?
  - We don't need to perfectly distinguish between a justified and unjustified discrediting. The procedure only notes the structural presence of discrediting. The justification is a values decision (handoff to human if the community has a mission that requires it).

  ### Where It Will Misfire
  - If the outgroup source is a known bad actor (e.g., a spammer or a troll), then discrediting them is justified. The procedure cannot distinguish this. So we rely on the mod logs: if the removal is for a clear rule violation (e.g., spam, abuse) then it's not discrediting for being outgroup. But if the reason is vague (e.g., "misinformation" without evidence) then it might be problematic.
  - The procedure might be too simplistic for communities with mixed behavior (some threads are open, some are not). We rely on the random sample, which might not be representative.

  ### Final Procedure Outline

  **Epistemic Self-Audit Procedure**

  1. **Inbound Permeability**:
     - Check sample and logs: Are outgroup sources referenced or linked? 
       - If no: Ask head mod if intentional. If not, flag as epistemic bubble.
       - If yes: Note the response type (substantive, dismissive, source discrediting, practice discrediting).

  2. **Outbound Permeability** (if outgroup content found):
     - Check sample: Is there substantive engagement with the outgroup content? (e.g., detailed discussion, questions about the content).

  3. **Pre-rebutted Content**:
     - Check for practices where outgroup arguments are presented with pre-attached rebuttals. Note if the outgroup argument is fairly presented.

  4. **Treatment of Ex-Members** (if present in sample):
     - Note how reports from outside are received.

  5. **Moderation Actions**:
     - Check mod logs: Are outgroup posts removed without clear rule violations? Are members warned/banned for posting outgroup content respectfully?

  6. **Classification**:
     - If no outgroup content and not intentional: **Epistemic bubble**.
     - If outgroup content is present and there is evidence of discrediting (from Steps 1.2, 3, 4, or 5) and lack of substantive engagement (Step 2): **Echo chamber**.
     - Otherwise: **Healthy engagement** (or mixed, note the features).

  7. **Recommendations**:
     - Bubble (non-intentional): Recommend adding outgroup sources. But caution: if echo chamber features are also present, adding sources without addressing discrediting may backfire. (So if both, address echo chamber first.)
     - Echo chamber: Do not simply add outgroup sources. Instead, recommend:
          - Changing rules to require substantive engagement and prohibit ad hominem or practice discrediting.
          - Ending practices that pre-rebut outgroup content (or restructuring them to present the outgroup view alone first).
          - Training mods to not remove outgroup content unless it violates clear rules (e.g., spam, abuse, not just because it's outgroup).
     - Intentional bubble: No action needed if approved by head mod.

  **Report Template**:
  - Findings: 
    - Inbound: [description]
    - Outbound: [description]
    - Pre-rebutted: [description]
    - Ex-members: [description]
    - Moderation: [description]
  - Classification: [Bubble/Echo chamber/Healthy/Other]
  - Recommendations: [Specific actions]

  This should fit in 30 minutes by focusing on a small sample and mod logs.
answer: |-
  ### Epistemic Self-Audit Procedure  
  Designed for a mod with no philosophy background, using observable evidence (mod logs + random thread samples), in ~30 mins per subforum. Outputs a structural diagnosis (no verdict on members' rationality) and avoids flame wars by bracketing first-order truth.  

  **Key Theory Simplified**:  
  - **Epistemic Bubble**: Lack of exposure to outgroup views (omission). Pops on contact. **Intervention YES**: Add outside sources.  
  - **Echo Chamber**: Exposure occurs, but a *credibility-reduction machine* discredits outgroup sources/arguments. Contact worsens polarization. **Intervention NO**: Adding sources backfires; fix the machine first.  
  - **Must-Survive Distinctions**: Bubble vs. chamber, inbound vs. outbound permeability, source discrediting vs. practice discrediting. Ex-members' treatment is a strong echo chamber signal.  
  - **Dropped for Practicality**: Justified vs. unjustified discrediting (e.g., "bad actor" vs. bias). Values decisions deferred to head mod.  

  ---

  ### Procedure Flow (Ordered Questions)  
  **Step 1: Inbound Permeability**  
  *Question*: Do outgroup links/arguments appear in the subforum?  
  - **Evidence**: Random thread sample (min. 5 threads). Check for links, quotes, or named outgroup sources (e.g., opposing forums, institutions, experts). Mod logs: Removed posts with "off-topic," "misinfo," or "low-quality" tags.  
  - **Sufficient Answer**:  
    - **YES** (observed in sample/logs) → Proceed to Step 2.  
    - **NO** → *Handoff to head mod*: "Is this subforum intentionally insular?" (e.g., support group). If yes, **bubble by design** (no intervention). If no, **epistemic bubble** → *Intervention YES: Add curated outgroup exposure*.  

  **Step 2: Outbound Permeability**  
  *Question*: When outgroup content appears, is it substantively engaged with?  
  - **Evidence**: Thread sample. Look for:  
    - Follow-up questions about the source.  
    - Quoting/paraphrasing outgroup arguments (not just attacking).  
    - Upvotes or neutral replies to outgroup posts.  
  - **Sufficient Answer**:  
    - **YES** (engagement observed) → Proceed to Step 3.  
    - **NO** (dismissed without discussion, e.g., "ignore this") → Echo chamber **red flag**.  

  **Step 3: Credibility-Reduction Machine**  
  *Questions*:  
  - **3a. Source Discrediting**: Are outgroup sources attacked personally? (e.g., "that lab is corrupt," "they’re paid shills").  
  - **3b. Practice Discrediting**: Is *posting* outgroup content framed as harmful? (e.g., "why platform this?" or "don’t both-sides us").  
  - **3c. Pre-Rebuttal Curation**: Are outgroup arguments *only* presented pre-rebutted? (e.g., "steelman" events with in-group rebuttals attached).  
  - **Evidence**: Thread sample. Note frequency of 3a/3b language. For 3c, check if outgroup arguments stand alone or always come with rebuttals.  
  - **Sufficient Answer**:  
    - **NO to all** → Proceed to Step 4.  
    - **YES to 3a/3b** → Echo chamber **red flag**.  
    - **YES to 3c** → **Hard NO on "add more sources"** (pre-rebuttal = discreditation engine).  

  **Step 4: Ex-Member Treatment**  
  *Question*: Do ex-members reporting outside views get a fair hearing?  
  - **Evidence**: Thread sample/search for "I used to think X" posts. Look for replies:  
    - Engagement: "What changed your mind?"  
    - Discrediting: "You’re contaminated," "sellout."  
  - **Sufficient Answer**:  
    - **Fair hearing** → Proceed to Step 5.  
    - **Discrediting** → Echo chamber **red flag**.  

  **Step 5: Moderation Patterns**  
  *Question*: Are outgroup posts disproportionately removed?  
  - **Evidence**: Mod logs. Compare removal rates for outgroup vs. in-group content tagged "controversial."  
  - **Sufficient Answer**:  
    - **NO** (similar removal rates) → No echo chamber evidence.  
    - **YES** (outgroup removed more for vague reasons like "low quality") → Echo chamber **red flag**.  

  **Synthesis & Classification**:  
  - **Epistemic Bubble**: Step 1 = NO (not intentional).  
  - **Echo Chamber**: ≥2 red flags (Steps 2, 3, 4, or 5).  
  - **Healthy**: No flags, inbound/outbound permeability.  
  - **Values Handoff**: If head mod confirms subforum *should* discredit certain sources (e.g., anti-vaxxers in a medical forum), override echo chamber call.  

  **Intervention Rules**:  
  - **Bubble**: YES to adding sources.  
  - **Echo Chamber**: NO to adding sources; YES to dismantling discrediting (e.g., ban practice discrediting, end pre-rebuttals).  
  - **Ambiguous**: Human judgment (head mod).  

  ---

  ### Case Studies  
  **Case 1: Small Genealogy Subforum**  
  - *Description*: Cites only 3 in-group sites, friendly to outsiders.  
  - **Audit**:  
    - Step 1: **NO** outgroup links. Head mod confirms intentional focus → **Bubble by design** (no intervention).  
    - Steps 2-5: N/A.  
  - **Classification**: Non-problematic epistemic bubble.  

  **Case 2: Steelman Saturday Community**  
  - *Description*: Weekly "steelman" of outgroup + attached in-group rebuttal.  
  - **Audit**:  
    - Step 1: **YES** (outgroup content posted weekly).  
    - Step 2: **NO** outbound permeability (discussion focuses on rebuttal, not outgroup argument).  
    - Step 3: **YES to 3c** (pre-rebuttal curation). *Also* **YES to 3b** (posting standalone outgroup content gets "why not wait for Steelman?" replies).  
    - Step 4: Not observed.  
    - Step 5: Logs show standalone outgroup posts removed as "redundant" or "unvetted."  
  - **Classification**: **Echo chamber** (red flags: Steps 2, 3b/c, 5). Pre-rebuttals train members to see outgroup arguments as pre-defeated.  
  - **Intervention**: **NO** to adding sources; end Steelman Saturday or restructure to post steelmanned arguments *alone* for 24h before rebuttals.  

  **Case 3: Your Main Forum (Suspected Echo Chamber)**  
  - *Description*: Weekly roundup (yours) summarizes outgroup views; community distrusts mainstream institutions.  
  - **Audit**:  
    - Step 1: **YES** (outgroup content in roundup/linked threads).  
    - Step 2: **NO** outbound permeability (threads show quick dismissal; e.g., "institutional propaganda" replies without engagement).  
    - Step 3: **YES to 3b** (practice discrediting: "why amplify this?" replies to standalone posts) and **YES to 3c** (your roundup *always* pairs outgroup claims with rebuttals).  
    - Step 4: **YES** (ex-members called "corrupted" when sharing mainstream reports).  
    - Step 5: **YES** (mod logs show outgroup links removed as "misinfo" without evidence).  
  - **Classification**: **Echo chamber** (red flags: Steps 2, 3b/c, 4, 5). Your roundup is part of the machine (pre-rebuttal curation + training).  
  - **Intervention**: **NO** to adding mainstream sources; revise roundup to present outgroup claims neutrally (no rebuttals), ban practice discrediting (e.g., "why platform this?").  

  ---

  ### Where the Procedure Misfires (Be Blunt)  
  1. **Justified vs. Unjustified Discrediting**: Cannot distinguish legitimate source criticism (e.g., "this think tank is oil-funded") from bias. Relies on head mod for values calls.  
  2. **Small Samples**: Random threads may miss nuances (e.g., one toxic thread skews results). Mitigation: Use mod logs for patterns.  
  3. **"Healthy" False Negatives**: A subforum may engage with outgroups but still be polarized (e.g., both sides entrenched). Procedure only detects structural barriers, not outcomes.  
  4. **Ex-Member Absence**: If no ex-members post, Step 4 skipped (weakens echo chamber detection).  

  ### Final Output Template  
  ```  
  Subforum: [Name]  
  Inbound Permeability: [Yes/No + evidence]  
  Outbound Permeability: [Yes/No + evidence]  
  Credibility-Reduction Patterns: [Source discrediting/Practice discrediting/Pre-rebuttal/None]  
  Ex-Member Treatment: [Fair/Discrediting/Not observed]  
  Moderation Bias: [Yes/No + evidence]  
  Classification: [Epistemic bubble / Echo chamber / Healthy / Unclear]  
  Intervention: [Add sources (bubble) / Dismantle discrediting (echo chamber) / None (healthy)]  
  Values Handoff: [Head mod decision required?]  
  ```  
  This is factual, structural, and avoids "brainwashed" language. Run quarterly, signed off by head mod.
