prompt: |-
  Hi — I cover science and ideas for a living, and a philosopher friend cornered me at dinner the other night and I still haven't found the exit. Hoping you can help.

  Her target was the intuition that there is something epistemically special about *doing* a thing as opposed to reading about it. Here's what I reconstructed from my notes the next morning (I cleaned up the numbering; the spelling errors are mine):

  (1) Knowing how to do X is just a case of knowing that: knowing how to ride a bike is knowing, of some way w, that w is a way to ride a bike. Call this intellectualism. She says every anti-intellectualist alternative dies on Ryle's regress, and honestly the regress does sound convincing when she explains it.

  (2) Knowledge is of propositions, and propositions are coarse-grained in the relevant way: if it's the same proposition, then knowing it is the same piece of knowledge, however you came by it.

  (3) Knowledge-that isn't graded. You either know that p or you don't. There is no knowing-that-p *more thoroughly*, or knowing the very same thing *in a better way*.

  (4) Now take a trainee who has read and memmorized everything there is to know about bicycle riding — grant that she even knows that w is a way to ride — and set her next to a lifelong cyclist. Both know that w is a way to ride a bike.

  (5) So by (2) and (3) the two of them have the very same knowledge of how to ride. What seperates them is only execution: the cyclist's body runs w reliably, the trainee's doesn't.

  (6) If the only difference is reliability of execution, then practice, apprenticeship, muscle memory, and the feedback you get from actually trying — none of that is in the business of producing knowledge. It just tunes the machinery that carries out what you already know.

  (7) Which means: a system that has absorbed every text ever written about, say, emergency surgery knows how to perform that surgery in exactly the sense the surgeon does, and is missing only the ability to act on it. And a surgical residency teaches you nothing, epistemically speaking, that a sufficiently good manual wouldn't.

  I can't accept (7), but I also can't put my finger on where it goes wrong, and my friend just smiles and says the conclusion follows.

  Two wrinkles I should flag. First, the cyclist usually *can't tell you* what w is — ask her and she says something like "I don't know, I just do it." My friend says that's a fact about verbal access and ability to report, not about knowledge. Fine, but isn't it at least some evidence that she doesn't know that p? Second, someone at the table pointed out that reliability of execution might itself depend on stuff you can only get by doing — proprioceptive, indexical, situation-specific stuff — in which case (5) is false even if (1) is true. My friend said that move collapses back into (2) being false. I'm not sure she's right about that either.

  So: which step do you reject, and what does rejecting it cost you elsewhere? I'm especially curious about the price of each option — I've heard there's a version of the view where the trainee and the cyclist grasp the same proposition *under different modes of presentation*, one practical and one theoretical, and if that's the move then I want to know what the trainee's relation to w actually is supposed to be, because "she knows it, just worse" sounded like something that (3) forbids. And if the answer is to give up (1) and go anti-intellectualist about abilities and dispositions, I'd like to know whether the regress really is fatal or whether that's just a rhetorical habit.

  If I have to choose I'd rather keep (1) than (7) — but tell me what I'm paying, and be specific about which step looked fine and isn't.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a science writer who got cornered by a philosopher friend arguing that there's nothing epistemically special about doing something versus just knowing about it. The key points are laid out in seven steps leading to the counterintuitive conclusion that a trainee who's read all about biking or surgery knows just as much as the expert—only execution differs. 

  Hmm, the user seems frustrated but intellectually engaged—they clearly reject step (7) instinctively but can't pinpoint why. Their two wrinkles suggest they've already tried poking holes: the cyclist's inability to articulate "w", and the idea that reliability might depend on experiential knowledge. The philosopher friend dismissed both, leaving them stuck.

  First, I need to identify where the argument cracks. Step (3) feels off—saying knowledge-that isn't gradable clashes with how we treat expertise. But denying that outright might force me into muddy "knowledge-how" territory. Maybe propositions *can* be known more or less thoroughly? That might preserve intellectualism while explaining why the cyclist knows "better" without denying the trainee knows at all. 

  Then there's step (2). If the cyclist and trainee grasp "w" under different modes—say, sensorimotor vs theoretical—that could make their knowledge different even if the proposition is identical. But the user mentioned their friend thinks this violates (3). Is it really the same knowledge if accessed differently? That feels like the heart of it. 

  The Rylean regress against anti-intellectualism... maybe it's not fatal? If abilities are primitive, the regress stops at "I can just do it." But the user seems wary of ditching intellectualism. 

  Cost-wise: rejecting (3) means biting the bullet that "knowing p" isn't binary—which might confuse everyday usage but fits expertise. Rejecting (2) makes propositions fine-grained, which could explode our epistemology. Rejecting (1) invites the regress monster. 

  Wait—what if the trainee knows *that* w works, but the cyclist knows w *as* a way to ride? That slight shift might preserve intellectualism while allowing depth. The user would pay by making knowledge context-sensitive... but maybe that's worth it to save surgery residencies? 

  *checks notes* The proprioceptive point—if reliability requires indexical knowledge ("*my* body does w like *this*"), that *is* new propositional knowledge! The friend wrongly called this a collapse of (2). That’s actually the cheapest fix: keep all premises but show (5) fails because the cyclist has extra situational knowledge. The trainee knows abstract w; the expert knows w-in-this-body-in-real-time. Different propositions! 

  User’s relief would be palpable—no need to dismantle intellectualism or gradable knowledge. Just admit that "knowing how" includes knowing indexical truths you can only get by doing. The cost? We must accept that not all knowledge is verbalizable or context-free. Small price for saving apprenticeships.
answer: |-
  You're in good company—that conclusion (7) *feels* wrong, but the argument is tight. Your philosopher friend is presenting a sophisticated intellectualist position (defended by philosophers like Jason Stanley & Timothy Williamson) that pushes Rylean anti-intellectualism to its limits. Here's the breakdown of where it goes wrong, the costs of rejecting each step, and the most defensible escape route:

  ### The Core Problem & The Best Move: Reject Premise (3)
  **Premise (3) is false: Knowledge-that *can* be "graded" in a meaningful epistemic sense.** You can know the same proposition *more thoroughly* or *in a better way*. This doesn't mean you "sort of know it," but that your grasp of the proposition involves richer connections, deeper understanding, or access under more relevant modes of presentation.

  *   **How this saves the intuition:** The lifelong cyclist doesn't just know *that* w is a way to ride a bike. They know it **under a practical, embodied, sensorimotor mode of presentation**. The trainee knows it **under a theoretical, descriptive, or verbal mode of presentation**. These are different epistemic relations to the *same proposition*. The cyclist's grasp is demonstrably superior for the purpose of *riding a bike* because it integrates the proposition into a web of indexical, proprioceptive, and situational knowledge inaccessible through text.
      *   *The trainee's relation to w:* They know a *description* of w. They might know "w involves shifting weight to counterbalance lean during turns." They know this propositionally. *But they don't grasp w as a practical possibility for their own body in real-time situations.* They lack the sensorimotor mode of access.
  *   **What this costs:** You pay a price in metaphysical and semantic simplicity.
      1.  **Modes of Presentation:** You must accept that *how* a proposition is grasped (the "mode of presentation") is part of the epistemic state itself, even if the propositional content is identical. Knowledge isn't *just* a binary relation between a mind and a proposition; it's a ternary relation: mind-proposition-mode. This complicates the theory of knowledge.
      2.  **Gradedness:** You must defend that "knowing p better" isn't just having *more* propositional knowledge *about* p, but a deeper *way* of knowing p itself. This challenges a purely binary conception of belief/knowledge.
      3.  **Access & Justification:** The cyclist's justification for believing w is a way to ride is grounded in embodied success and feedback loops fundamentally different from the trainee's textual justification. This might require acknowledging different *sources* or *types* of justification as constitutive of the knowledge state itself.

  **Why reject (3) instead of other premises?**
  *   **Preserves (1) Intellectualism:** You keep the core idea that knowing-how is a species of knowing-that. Abilities are grounded in propositional knowledge.
  *   **Preserves (2) Coarse-Grained Propositions:** You don't need to say the *proposition known* is different. You say the *epistemic relation to it* is different. This is less ontologically costly than fine-graining propositions.
  *   **Explains the Wrinkles:**
      *   *The Cyclist's Silence:* It's not (just) about reporting. The cyclist lacks *access* to the proposition under the theoretical/descriptive mode needed for verbal report. Their knowledge is fundamentally tied to embodied action. Their muteness *is* evidence their knowledge resides in a different epistemic mode.
      *   *The Proprioceptive/Indexical Point:* This is *precisely* what constitutes the richer, practical mode of presentation. The surgeon *does* gain new propositional knowledge through practice: indexical knowledge ("*This* is what a ruptured appendix looks like *under these lights*," "*My* hand needs to apply *this* much pressure *here*," "*Now* is the moment to suture"). Crucially, this knowledge is *integrated* into their grasp of the core proposition "w is a way to perform surgery." **Your friend is wrong:** This does *not* force you to reject (2). You can hold that "w" encompasses these indexical details *in principle*, but the trainee only grasps w abstractly, while the surgeon grasps w concretely *including* its indexical instantiations – it's the *same* w, known under a different (richer) mode. This *is* a rejection of (3), not (2).

  ### Evaluating Other Escape Routes (Higher Costs)

  1.  **Reject Premise (1) - Embrace Anti-Intellectualism (Ryle):**
      *   **The Move:** Deny that knowing-how is knowing-that. Knowing-how is a sui generis ability or disposition.
      *   **Avoids Regress?** Potentially. The standard move is to reject the premise that performing intelligently requires *contemplating* propositions (the "intellectualist legend"). Abilities are primitive dispositions to behave successfully. The regress stops because there's no prior "knowing-that" required for the application of knowledge-how; you just *do* it competently. (e.g., Ryle: "The cleverness of the clown may be exhibited in his tripping and tumbling. He trips and tumbles just as clumsy people do, except that he trips and tumbles on purpose and after much rehearsal and at the golden moment and where the children can see him and so as not to hurt himself.")
      *   **Cost:** High.
          *   **Metaphysical Cost:** Requires accepting irreducible dispositions or abilities as fundamental components of the mind/knowledge. This is less parsimonious for many naturalistic views of cognition.
          *   **Explanatory Cost:** Makes it harder to explain the cognitive *content* underlying skilled action. How does practice *teach* if not by imparting knowledge? What guides the skilled action if not (implicit) propositional knowledge?
          *   **Link to Knowledge-that:** Severes a seemingly intuitive link between skill and understanding (e.g., the skilled surgeon *understands* anatomy in a way the trainee doesn't).

  2.  **Reject Premise (2) - Fine-Grained Propositions:**
      *   **The Move:** Argue that propositions are structured or individuated finely (e.g., Fregean senses). The proposition known by the trainee (w described verbally) is *different* from the proposition known by the cyclist (w known practically/embodiedly), even if they refer to the same action-type w.
      *   **Cost:** Very High.
          *   **Semantic Cost:** Requires a robust theory of fine-grained propositions or senses. This is complex and controversial.
          *   **Proliferation:** Leads to a massive proliferation of propositions. Is there a distinct proposition for *every* possible mode of grasping w? This seems ontologically extravagant.
          *   **Linguistic Evidence:** Ordinary language ("They both know how to ride a bike") suggests coarseness. Fine-graining often seems like an artificial solution.

  3.  **Reject Premise (5) - The Reliability Claim:**
      *   **The Move:** Argue that the difference *isn't just* reliability of execution; it *is* a difference in knowledge. The cyclist has additional knowledge (e.g., indexical, proprioceptive) gained only through practice.
      *   **Cost:** Moderate. This is compatible with rejecting (3). The main cost is needing to argue that this *is* genuinely new *propositional* knowledge (indexical propositions: "Applying *this* much pressure *now* is part of w") that the trainee lacks, rather than just a different way of knowing the *same* proposition w. It risks fragmenting "knowing how" into knowing a core proposition *plus* knowing countless indexical details, rather than seeing it as one richer epistemic state. **This is essentially the "indexical move" you mentioned, and it works best *within* the framework of rejecting (3).**

  ### Conclusion & Recommendation

  *   **Reject Premise (3).** This is the most defensible and least costly path that preserves the core intellectualist insight (1), avoids ontological explosion (2), explains the experiential difference (wrinkles), and delivers the intuitive result that practice yields epistemic gain. The trainee and cyclist know the *same proposition* (w is a way to ride), but the cyclist knows it *under a practical, embodied mode of presentation* – a deeper, richer, more action-guiding form of knowledge-that.
  *   **The Cost:** Accept that knowledge-that is not a simple binary state. Grasping a proposition can be more or less thorough, and this thoroughness depends on the *mode* of access (theoretical, practical, indexical, etc.) which constitutes the epistemic relation itself. This complicates epistemology but aligns with the phenomenology of expertise and practice.
  *   **What about (7)?** Rejecting (3) directly undermines (7). The surgical resident *does* gain new epistemic goods: they come to grasp the proposition "w is a way to perform surgery" under the practical, embodied, indexically-rich mode required for successful execution. This is knowledge they demonstrably lacked after *only* reading the manual. The residency *is* epistemically productive.

  **In short:** Tell your friend the exit is through the door marked "Modes of Presentation." The trainee knows *that* w is the way, but the cyclist knows w *as* the way. That "as" makes all the epistemic difference. The cost is accepting that knowledge-that comes in degrees of depth determined by the mode of access. It's a price worth paying to save the epistemic value of doing from the clutches of pure text.
