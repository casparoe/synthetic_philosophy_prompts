  ### Decision Tree on Aggregation in Normative Ethics

  **Instructions:** Answer each question with Yes (Y) or No (N) based on your intuitive judgment of the concrete cases. Proceed down the tree until you reach a leaf (named position). Each position includes one sentence on its most awkward commitment.

  #### Node 1: Base Case  
  *You can save five anonymous people or save one anonymous person (all face identical fatal harm, no special relationships). Should you save the five?*  
  - **Y** → Proceed to Node 2.  
  - **N** → Proceed to Node 4.  

  #### Node 2: Identifiable Victim  
  *You can save five people known only statistically (e.g., anonymous patients in a collapsing building) or save one identifiable child in front of you (same fatal harm). Should you save the five?*  
  - **Y** → Proceed to Node 3.  
  - **N** → Proceed to Node 3.  

  #### Node 3: Finger vs. Life  
  *You can save five people from each losing a finger or save one person from death. Should you save the five?*  
  - **Y** → Proceed to Node 4.  
  - **N** → Proceed to Node 6.  

  #### Node 4: Small-Scale Tradeoff  
  *You can save two anonymous people or save one anonymous person (identical fatal harm). Should you save the two?*  
  - **Y** → Proceed to Node 5.  
  - **N** → Proceed to Node 5.  

  #### Node 5: Certainty vs. Risk  
  *You can save five people for sure or take a 50% chance to save ten people (and 50% chance to save none). Should you take the 50% chance for ten?*  
  - **Y** → **Straightforward additive aggregation** (e.g., utilitarianism).  
    - *Most awkward commitment:* Requires torturing one person to cure millions of minor headaches if net utility increases.  
  - **N** → **Risk-averse aggregation** (ex post focus).  
    - *Most awkward commitment:* Prefers saving five for sure over a 50% chance to save ten, even when both have equal expected value.  

  #### Node 6: Policy Rule  
  *You write a rule for 100 future emergencies (each: save five or save one, identical fatal harms, no knowledge of who will be in which group). Should the rule be "always save the five"?*  
  - **Y** → **Lexically-thresholded aggregation** (e.g., weighted prioritarianism).  
    - *Most awkward commitment:* Allows saving five from death over one death in a policy, but forbids saving five from fingernail injuries over one death in a single case.  
  - **N** → **Strict anti-aggregation on equal-claim model**.  
    - *Most awkward commitment:* Cannot save five from death over one death, even in a policy affecting thousands, because "numbers never count."  

  ---

  ### Leaf Positions and Awkward Commitments
  - **Straightforward additive aggregation** (Node 1=Y, Node 2=Y, Node 3=Y, Node 4=Y, Node 5=Y):  
    *Awkward commitment:* Justifies sacrificing one person to harvest organs for five, violating intuitions about individual rights.  
  - **Risk-averse aggregation** (Node 1=Y, Node 2=Y, Node 3=Y, Node 4=Y, Node 5=N):  
    *Awkward commitment:* Rejects a 51% chance to save 100 lives if a 50% chance to save one life exists, favoring certainty over large gains.  
  - **Threshold aggregation** (Node 1=Y, Node 2=Y, Node 3=Y, Node 4=N):  
    *Awkward commitment:* Saves five over one but not two over one, implying arbitrary thresholds for when numbers "matter."  
  - **Lexically-thresholded aggregation** (Node 1=Y, Node 2=Y, Node 3=N, Node 6=Y):  
    *Awkward commitment:* Prioritizes preventing one death over any number of non-fatal harms (e.g., paralysis), ignoring massive suffering.  
  - **Identifiability-blocked aggregation** (Node 1=Y, Node 2=N, Node 3=Y):  
    *Awkward commitment:* Saves five over one in the finger-vs-life case but not the base case, overvaluing identifiability in life-or-death choices.  
  - **Strict anti-aggregation** (Node 1=Y, Node 2=N, Node 3=N, Node 6=N):  
    *Awkward commitment:* Forces letting five die to save one in a policy affecting thousands, violating ex ante fairness.  
  - **Ex ante policy aggregation** (Node 1=N, Node 4=Y, Node 6=Y):  
    *Awkward commitment:* Endorses a policy that saves more lives overall but deems it wrong to follow that policy in any single emergency.  
  - **Numbers never settle** (Node 1=N, Node 4=N, Node 5=N, Node 2=N, Node 6=N):  
    *Awkward commitment:* Cannot justify saving two over one, even with 1,000 emergencies, rendering all non-lottery tradeoffs arbitrary.  

