    - **Logical probability (Leaf 8) vs. Objective Bayesianism (Leaf 9):** Not cleanly separated. Both answer "yes" to Q6, differing only in justification ("logical" vs. "rules"). No question forces a split, as cases like the classifier/theory probability don't isolate logical relations.  
    - **Long-run propensity (Leaf 4) vs. Hypothetical frequentism (Leaf 2/Leaf 3):** Not separated. Q8B (inverses not objective) and Q9A (hypothetical sequences) both cover similar ground; long-run propensity often collapses into hypothetical frequentism.  
  - **Distinctiveness:** All other leaves are separated (e.g., subjectivism vs. objective Bayesianism by Q3; primitivism vs. Humean by Q10).  
  - **Structure:** The tree builds the space first—answers define positions (e.g., acceptance of single-case chance → Q4–Q10), with views mapped to resulting commitments. Cases are placed where they discriminate (e.g., the deterministic coin at Q4 tests compatibility with determinism).
