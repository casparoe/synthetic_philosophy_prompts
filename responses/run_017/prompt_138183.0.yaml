prompt: |-
  I sit on the scientific advisory committee of a national food-safety and animal-health agency, and we are the body that decides which animal groups fall under our rules on stunning, humane slaughter and live transport. Coverage currently runs to all vertebrates and, since a revision a few years back, to octopuses, squid and cuttlefish; that last extension was adopted explicitly as a precautionary measure rather than as a finding that cephalopods are certainly conscious, which means there is no written standard anywhere in our records for what we were being precautionary about. Petitions now arrive every few weeks — industry bodies asking us to add or to exempt a group, welfare organisations asking us to extend, and several times a year a file on something for which no studies exist at all. Our decisions are legally reviewable and must be published with reasons. The committee is six people (a veterinarian, a neuroscientist, a fisheries biologist, an entomologist, an ethicist and a producer representative), we meet one day a month, and no member can realistically give a petition more than about an hour of reading. So what I need is a decision procedure we could actually run inside those constraints, not a philosophical essay on which animals are conscious.

  What I want is that procedure, written so that a committee member with no philosophy training can execute it: the questions in the order they should be asked, what counts as an adequate answer to each, the points at which the procedure returns a yes and stops, the points at which it returns a no and stops, and — most importantly — the points at which it has to stop and hand the matter over as a question about values rather than evidence. I also want you to mark honestly which of its steps are judgment calls wearing the costume of a test. Three things in particular have to be built in, because these are where our past discussions have collapsed. First, the evidence arrives in kinds that are not interchangeable. A taxon may have neural hardware of the sort we associate with pain in vertebrates; or it may show the flexible, trade-off-making behaviour we associate with pain — avoiding a place where it was hurt even when a food reward is on offer, tending an injury at some cost, taking an analgesic option only when injured; and very often a group looks impressive on the behavioural markers while having a nervous system organised unlike ours, or the other way round. We are also regularly reminded that reacting to a harmful stimulus is not the same as feeling it, and I want the procedure to preserve that distinction without letting it become a reason never to decide anything. So: how should we combine evidence of these different kinds, how do we avoid counting a single underlying capacity three times because it shows up in three different assays, and what do we do when the only studies available were done on a related species — at what taxonomic grain should a classification be made, and how far up or down may we extrapolate? Second, every marker we use is, taken on its own, something a clever unconscious machine could in principle be built to do. I want a step that asks whether the whole body of evidence for a taxon could be produced by a system that lacks the very thing we are trying to detect, and I want to know what kind of evidence would be needed to get past that step. Third, the costs of error are not symmetric: covering a group that is not conscious imposes real costs on producers and on our inspectors' time, while failing to cover a group that is conscious means we are authorising pain on a very large scale, sometimes across enormous numbers of animals. I want the procedure to say where the burden of proof sits, how the size of the stakes changes how much evidence we demand, and — for the direction nobody enjoys — what standard applies when a submission asks us to remove coverage from a group we already protect. Where the answer is that the evidence is insufficient, it should say what would have to change and when we re-open the file.

  Then run it on three live files. (1) A petition from a welfare coalition to extend stunning and transport rules to decapod crustaceans — crabs, lobsters, prawns — currently treated as unprotected invertebrates, whose supply chains here are large and, as far as our economic briefing goes, expensive to retrofit. (2) A petition to extend the rules to the insects now being farmed at industrial scale for animal feed, mainly black soldier fly and house cricket, where the literature per species is thin or ambiguous and the number of candidate species is enormous. (3) A submission from a commercial fishing association arguing that the fish we already cover should come out of coverage, on the grounds that the brain structures which do the relevant work in mammals are absent in fish. At least one of the three should come out in a way I will find inconvenient, and I would much rather see that here than in our published reasons; for each file I want to see where exactly the procedure stopped and why. Finally, tell me what this procedure cannot do: which questions it is bound to get wrong or to leave open, and which ones we should simply stop pretending we can settle from evidence.
reasoning: |-
  Okay, the user is part of a scientific advisory committee that decides which animal groups fall under animal welfare rules. They need a practical decision procedure that fits their constraints: limited time (about an hour per petition per member), diverse committee expertise, and legally reviewable decisions. The procedure must handle different types of evidence (neural vs. behavioral), avoid double-counting, deal with related species studies, and address the possibility that behaviors could be unconscious. It also needs to account for asymmetric costs of error - covering non-conscious animals imposes costs, while not covering conscious ones allows large-scale suffering.

  The user specifically wants a step-by-step process with clear stopping points, marking which steps involve judgment calls disguised as tests. Three key issues must be addressed: how to combine different evidence types, how to avoid unconscious machine-like explanations, and how to handle asymmetric risks.

  For the procedure design, I consider creating a flowchart-like approach that moves from basic biological markers to more complex ones, with clear "yes," "no," or "insufficient" outcomes. It should incorporate burden of proof (favoring precaution when evidence is balanced), taxonomic extrapolation rules, and explicit value-judgment points. The asymmetric risks mean placing higher burden on removing protections than adding them.

  For the test cases: decapod crustaceans have strong behavioral evidence but neural organization differs from vertebrates - the procedure would likely extend protections due to convergent evolution indicators. Insects show fragmented evidence at best - likely insufficient for coverage given current data. For fish, the absence of mammalian brain structures isn't dispositive given compensatory mechanisms - protections would remain.

  The procedure's limitations include: inability to resolve fundamental consciousness debates, poor handling of extreme extrapolations (e.g., single species to whole phylum), and cases where evidence directly conflicts rather than being sparse. Value judgments remain unavoidable when evidence is truly balanced.

  The user clearly wants pragmatism over philosophy - they need defensible decisions, not metaphysical certainty. The test cases demonstrate this by yielding one "inconvenient" outcome (denying insect coverage) while showing why the other petitions succeed or fail. Marking judgment-heavy steps (like the convergence assessment) maintains transparency about where subjectivity enters.
answer: |-
  Here is a streamlined, executable decision procedure designed for your committee's constraints, addressing your core requirements. It prioritizes efficiency, evidence integration, burden of proof, and clear stopping points. Judgment calls disguised as tests are explicitly marked **(JC)**.

  **The Animal Welfare Coverage Decision Procedure**

  **Starting Point:** A petition to **Add**, **Remove**, or **Exempt** a taxonomic group (Clade X) from coverage.

  **Step 1: Define the Taxon & Burden of Proof**
      *   *Question:* What specific taxonomic group (Clade X) is the petition about? (e.g., Order Decapoda, Class Insecta, specific species).
      *   *Adequate Answer:* Clear taxonomic definition (e.g., "Decapod crustaceans: crabs, lobsters, shrimp/prawns").
      *   *Burden Assignment:*
          *   **Add Petition:** Burden *against* coverage rests with the petitioner (welfare orgs must show significant positive evidence). Precaution leans towards coverage if evidence is ambiguous.
          *   **Remove/Exempt Petition:** Burden *for* coverage rests with the petitioner (industry must show compelling evidence *against* sentience). Precaution strongly favors *maintaining* existing coverage. Evidence threshold is HIGH.
      *   *Stopping Point:* If taxon is unclearly defined, return to petitioner for clarification. Procedure halts until resolved.
      *   **(JC):** Assigning the burden based on petition type incorporates asymmetric costs.

  **Step 2: Core Biological Prerequisites (Quick Filter)**
      *   *Question 2a:* Does Clade X possess a **centralized nervous system (CNS)** integrating sensory input and motor output?
      *   *Question 2b:* Does Clade X possess **nociceptors** (or functional analogues) detecting potentially damaging stimuli?
      *   *Adequate Answer:* Basic neuroanatomy literature review (textbooks, major reviews). Consensus expected here.
      *   *Stopping Points:*
          *   **No to 2a OR 2b:** Coverage **DENIED** (Stop). (e.g., jellyfish, most worms). *Reason:* Lacks fundamental biological hardware plausibly necessary for any integrated negative experience.
          *   **Yes to Both:** Proceed to Step 3.

  **Step 3: Evidence Gathering & Initial Integration (1-hour focus)**
      *   *Task:* Rapid review of best available evidence *specifically for Clade X* (or closest relatives if direct evidence sparse - see Step 4 for extrapolation rules). Focus on:
          *   *Neural Complexity (N):* Brain structure (relative size, regions), neural pathways (especially descending modulation), presence of neurotransmitters/receptors associated with affect/analgesia in vertebrates (e.g., opioids).
          *   *Behavioral Markers (B):* Context-dependent learning/avoidance (e.g., trade-offs: avoiding shock zone despite food); protective behaviors (e.g., grooming/guarding injury); motivational trade-offs (e.g., accepting analgesic only when injured); long-term behavioral change after aversive event.
          *   *Physiological Stress (P):* Systemic stress responses (e.g., corticosteroids, catecholamines) *specifically linked to noxious stimuli* (not just general stress).
      *   *Adequate Answer:* Identify 2-3 key studies/reviews per evidence type (N, B, P) relevant to Clade X. Note *consistency* within each type and *conflicts* between types.
      *   *Avoiding Double-Counting:* Treat N, B, P as *distinct lines*. Correlated findings (e.g., behavioral trade-off *and* opioid release) strengthen the case *for that specific capacity*, not as independent evidence points for sentience itself. The integration happens in Step 5.
      *   *Stopping Point:* If *no* credible evidence exists for *any* of N, B, P *specifically for Clade X or close relatives* (per Step 4 rules), Coverage **DENIED** (Stop). *Reason:* Insufficient basis for precaution. (Re-open if significant new evidence emerges).

  **Step 4: Taxonomic Extrapolation & Grain**
      *   *Question:* Is evidence for Clade X sufficient? If not, can evidence from a closely related taxon (Clade Y) be extrapolated?
      *   *Rules:*
          *   **Grain:** Classification should be made at the *lowest practical taxon* where evidence supports a reasonable expectation of homogeneity for relevant traits (e.g., Order or Family often practical; Phylum/Class often too coarse).
          *   **Extrapolation Up/Down:**
              *   **Extrapolate DOWN:** Evidence from a broader taxon (e.g., Class) *can* support coverage for a subgroup (e.g., Order) *if* no evidence suggests the subgroup *lacks* the relevant traits. Burden is low.
              *   **Extrapolate UP:** Evidence from a specific species/subgroup (Clade Y) *can* support coverage for Clade X *only if*:
                  1.  Clade Y is phylogenetically close to Clade X (e.g., same Order or closely related Families).
                  2.  No evidence suggests the trait is unique to Clade Y within Clade X.
                  3.  Clade X shares key biological features (e.g., CNS complexity) with Clade Y.
          *   **Insufficient for Extrapolation:** If evidence is *only* from distant relatives or model organisms with very different biology (e.g., using fruit fly neurogenetics to infer cricket sentience), treat as **no evidence** for Clade X.
      *   *Stopping Point:* If after applying extrapolation rules, *no* credible evidence exists for N, B, or P relevant to Clade X, Coverage **DENIED** (Stop). *Reason:* Insufficient evidence upon which to act. (Re-open if significant new evidence emerges).

  **Step 5: Integration & "Unconscious Machine" Test** **(Major JC)**
      *   *Question 5a:* Considering the *totality* of evidence (N, B, P) *together*, is it more plausible that Clade X possesses **integrated subjective experience (sentience/pain)** than that it is an "unconscious machine" performing complex but purely reflexive/non-conscious computations?
      *   *Key Integration Factors:*
          *   *Consilience:* Do N, B, P findings point consistently towards a capacity for affective state? (e.g., N shows opioid pathways, B shows trade-offs, P shows stress linked to injury).
          *   *Flexibility/Context-Dependence:* Does the behavior (B) demonstrate *evaluation* and *context-specific decision-making* rather than fixed reflexes? (Crucial for defeating simple "machine" explanations).
          *   *Plausible Mechanism:* Does the neural hardware (N) provide a *plausible biological substrate* for integrating information in a way that *could* support subjective states? (Doesn't need to be identical to mammals).
      *   *Question 5b (For "Unconscious Machine"):* Could *all* the observed evidence (especially complex, flexible B) be explained by a sophisticated but ultimately non-conscious control system (e.g., complex feedforward/feedback loops without central integration generating affect)? What evidence *specifically counters* this?
      *   *Evidence to Defeat "Unconscious Machine":* **High flexibility and context-dependence in behavioral trade-offs** is the strongest counter. Evidence of **long-term motivational change** or **self-administration of analgesics in contexts of injury but not otherwise** is highly suggestive. Neural evidence (N) for **modulatory pathways capable of altering global state** (e.g., akin to vertebrate midbrain/brainstem) strengthens this.
      *   *Adequate Answer:* Committee discussion weighing the factors above. Consensus or majority view.
      *   *Stopping Points:*
          *   **Plausible Sentience (5a Yes / 5b Defeated):** Proceed to Step 6 (Value Gate).
          *   **Plausible Non-Sentience / Strong "Machine" Explanation (5a No / 5b Stands):** Coverage **DENIED** (Stop). *Reason:* Evidence suggests complex reflexes/non-conscious processing, not sentience.
          *   **Truly Ambiguous / Cannot Decide:** Proceed to Step 6 (Value Gate) - Precaution applies.

  **Step 6: The Value Gate (Stops Procedure - Not Evidence Based)**
      *   *Question:* Given the evidence assessment (including any ambiguity from Step 5), does the **precautionary principle** warrant coverage for Clade X, considering the **asymmetric costs of error**?
      *   *Factors:*
          *   Strength/Direction of evidence (Leaning towards sentience? Truly 50/50? Leaning away?).
          *   Scale of potential suffering if uncovered but sentient (numbers, duration, intensity).
          *   Scale of costs if covered but non-sentient (economic impact, inspection burden).
          *   Public ethical concerns.
      *   *Adequate Answer:* Committee deliberation explicitly framed in ethical/precautionary terms.
      *   *Stopping Points:*
          *   **Coverage GRANTED/MAINTAINED:** *Reason:* Precaution demands protection given potential for suffering and evidence profile [summarize briefly: e.g., "significant behavioral evidence suggesting evaluative capacity despite neural differences", or "evidence ambiguous, but scale of potential suffering warrants precaution"].
          *   **Coverage DENIED/REMOVED:** *Reason:* Evidence does not support sentience [summarize briefly], and/or costs of coverage outweigh precautionary justification given the evidence profile [specify why precaution doesn't overcome the evidence/cost hurdle]. ***(Note: Removal requires exceptionally strong evidence against sentience and/or overwhelming costs under Step 1 burden)***

  **Procedure Outputs:**
  *   **Coverage Granted/Maintained.**
  *   **Coverage Denied/Removed.**
  *   **Insufficient Evidence (Denied - Revisit if new evidence).**
  *   **Value Judgment Required (Gate 6).**

  ---

  **Application to Live Files:**

  1.  **Decapod Crustaceans (Add):**
      *   **Step 1:** Add Petition. Burden: Welfare coalition must show positive evidence. Taxon: Order Decapoda (crabs, lobsters, shrimp/prawns) - Clear.
      *   **Step 2:** Clear **Yes** (CNS & Nociceptors present).
      *   **Step 3:** **Strong B Evidence:** Robust studies (e.g., Elwood, Barr) show complex trade-offs (avoiding shock zones despite food/shelter), prolonged grooming/rubbing of injured sites, context-dependent learning. **Moderate N Evidence:** Complex brains (supraoesophageal ganglion), presence of some vertebrate-analogue neurotransmitters (e.g., opioids, GABA - though distribution differs), some evidence for descending modulation. **Moderate P Evidence:** Stress hormones elevated after noxious stimuli/injury. *Integration:* B evidence is strong and flexible; N/P provides plausible, though not identical, substrate. Consistent picture.
      *   **Step 4:** Evidence primarily on crabs, lobsters, prawns. Extrapolation UP to Order Decapoda justified (phylogenetic closeness, shared key biology). Evidence sufficient.
      *   **Step 5 (JC):** **Plausible Sentience / "Unconscious Machine" Defeated.** The *flexibility and context-dependence* of the behavioral trade-offs (e.g., balancing shelter vs. shock, altering response based on experience) are highly resistant to simple reflex explanations. N/P evidence supports a plausible, if different, biological basis. Totality points towards integrated experience.
      *   **Step 6 (Value Gate):** **Coverage GRANTED.** *Reason:* Strong behavioral evidence of evaluative capacity consistent with pain experience, supported by plausible neural mechanisms, warrants precaution given the scale of potential suffering in large fisheries/aquaculture. (Procedure stops at Step 6 - Value Judgment made based on strong evidence profile).
      *   *Inconvenience:* Significant retrofit costs acknowledged, but evidence threshold met and precaution applied.

  2.  **Farmed Insects (BSF, Cricket - Add):**
      *   **Step 1:** Add Petition. Burden: Welfare coalition must show positive evidence. Taxon: *Hermetia illucens* (BSF), *Acheta domesticus* (Cricket) - Clear species, but implications for "insects" large.
      *   **Step 2:** **Yes** (CNS & Nociceptors present).
      *   **Step 3:** **Sparse & Ambiguous Evidence:** **B Evidence:** Some nocifensive reflexes, limited evidence for learned avoidance (often simple habituation/sensitization), very limited evidence for trade-offs or injury guarding beyond immediate reflex. **N Evidence:** Brains complex for insects but simpler than decapods/cephalopods. Opioid/other systems present but functional role in affect unclear. Limited evidence for vertebrate-like integration/descending control. **P Evidence:** Stress responses to injury/noxious stimuli documented, but link to "suffering" unclear. *Integration:* Evidence is fragmented. B evidence lacks the flexibility/trade-offs seen in decapods. N evidence exists but doesn't strongly support integration for affect. No strong consilience.
      *   **Step 4:** Evidence per species is thin. Extrapolation *across* insects (e.g., from honeybee cognition to cricket sentience) is **unjustified** (different orders, varying brain complexity). Focus on petitioned species. Evidence insufficient for strong conclusions *for these specific species*.
      *   **Step 5 (JC):** **Truly Ambiguous / "Unconscious Machine" Plausible.** The observed behaviors (reflexes, basic learning) *could* be produced by relatively sophisticated non-conscious neural circuits well within insect capabilities. No strong evidence (like complex trade-offs) forces the sentience interpretation. Totality is inconclusive.
      *   **Stopping Point:** Proceed to Step 6 due to ambiguity.
      *   **Step 6 (Value Gate):** **Coverage DENIED.** *Reason:* Insufficient evidence to support sentience in these specific insect species. Observed behaviors are plausibly explainable by non-conscious mechanisms. While precaution is valued, the costs of industrial-scale regulation and the current lack of compelling evidence do not justify coverage *at this time*. (Re-open if significant new evidence emerges, e.g., robust demonstrations of complex trade-offs or analgesic self-administration). *Procedure stopped at Value Gate due to insufficient evidence to meet burden for Add.*
      *   *Inconvenience:* This denies the welfare petition, potentially causing criticism, but follows the procedure's burden and evidence assessment.

  3.  **Fish (Remove):**
      *   **Step 1:** **Remove Petition.** Burden: Fishing association must show *strong evidence against* sentience. High threshold. Taxon: Various covered fish species (e.g., teleosts).
      *   **Step 2:** **Yes** (CNS & Nociceptors present - undisputed).
      *   **Step 3:** **Abundant B Evidence:** Complex trade-offs (avoidance learning with cost/benefit, analgesic self-administration when injured), guarding injuries, long-term behavioral changes after aversive events. **Strong N Evidence:** Brain structures demonstrably involved in vertebrate pain processing (e.g., telencephalon/pallium - functionally analogous to amygdala/cortex in affective processing, though anatomically different; thalamus; opioid systems; descending modulation pathways). **Strong P Evidence:** Stress responses linked to noxious stimuli, reduced by analgesics. *Integration:* Overwhelming consilience. B evidence shows clear evaluative capacity. N evidence provides a well-understood (though not mammalian-identical) substrate. P evidence correlates.
      *   **Step 4:** Evidence robust across teleost fish. Extrapolation justified.
      *   **Step 5 (JC):** **Plausible Sentience / "Unconscious Machine" Soundly Defeated.** The complexity and flexibility of fish behavior (e.g., choosing analgesia only when injured) demand an explanation beyond simple reflexes. The neural architecture, while lacking a neocortex, demonstrably supports analogous functions in affective processing. The totality of evidence strongly supports sentience.
      *   **Stopping Point:** **Coverage MAINTAINED.** *Reason:* Petitioner failed to meet the very high burden required for removal. The evidence for sentience in fish, including behavioral flexibility and a well-supported neural substrate for affective states, remains robust. Absence of mammalian neocortex is not dispositive; functional equivalents exist. Precaution overwhelmingly favors continued protection. *(Procedure effectively stops at Step 5 - evidence for sentience is clear, removal petition fails burden).*
      *   *Inconvenience:* Denies the industry request, maintaining regulatory burden, but upholds precaution based on strong evidence.

  ---

  **What This Procedure Cannot Do:**

  1.  **Define Consciousness/Sentience:** It assumes a working definition (integrated subjective experience, particularly of negative states like pain/suffering) but cannot resolve the fundamental philosophical question. It operationalizes via markers.
  2.  **Eliminate All Uncertainty:** It makes probabilistic judgments under uncertainty (Step 5 JC). Absolute proof is impossible.
  3.  **Handle Extreme Extrapolation Gracefully:** It struggles with massive gaps (e.g., claiming sentience for all Bilateria based on C. elegans studies). Step 4 rules help, but edge cases will be messy.
  4.  **Resolve Direct Conflicts in High-Quality Evidence:** If multiple high-quality studies directly contradict each other on key markers (rare, but possible), the procedure relies on committee judgment (Step 5 JC) to weigh the evidence, potentially leading to the Value Gate (Step 6).
  5.  **Determine the "Moral Weight" of Different States:** It triggers coverage based on a threshold likelihood of sentience, not on *how much* an animal might suffer relative to another. All covered groups are treated equally under the rules.
  6.  **Make Pure Value Judgments Look Like Science:** The Value Gate (Step 6) is explicitly where science stops and ethics/precaution takes over. The procedure forces this transparency.
  7.  **Settle Questions Where Evidence is Truly 50/50:** In a perfect tie of evidence plausibility (Step 5), the decision *must* go to the Value Gate (Step 6) – precaution and cost considerations decide. The procedure doesn't magically break the tie.
  8.  **Account for Every Nuance in Diverse Taxa:** Applying it to a whole Class like Insecta will be coarse. It works best for defined groups (Orders, Families, key species). Broad coverage decisions for huge, diverse taxa will inherently involve generalization.

  This procedure provides a structured, evidence-driven, and precautionary framework for making defensible decisions within your severe time constraints, explicitly highlighting where judgment is required and where values must take over. It incorporates your critical concerns about evidence types, the "unconscious machine" challenge, and asymmetric risks.
