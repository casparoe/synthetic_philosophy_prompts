  The user wants to carve out this concept rather than just label it. They're looking for established concepts that are near neighbors but miss the mark in specific ways. They've already considered competitive victimhood and deflection tactics but find those insufficient because they focus on competition or blame evasion, not the directional norm of comparison. They also want the concept to cover boundary cases: comparisons within one community's history, by survivors, framed for prevention, and outside atrocity contexts like grief or achievements. Finally, they question if this norm can be stated as a non-self-serving principle.

  First, I need to unpack the asymmetries. The first is directional: upward comparisons (calling something the worst) are mandatory, downward (suggesting something else might be worse) forbidden. The second is dimensional: classification is okay, magnitude isn't, even though classification isn't neutral. The user needs analysis, not just terms or bibliography.

  Considering established concepts: competitive victimhood comes close but is about groups vying for top victim status, not the norm itself. The deflection tactic (whataboutism) is about deflecting blame, not comparison rules. So those don't fully fit. Hierarchies of suffering might be relevant, but the user wants the mechanism behind the asymmetry.

  The core issue seems to be that superlatives (unprecedented, worst) are treated as non-comparative even though they are. This might be due to the commemorative frame where uniqueness is a form of respect. But that's a contradiction because uniqueness claims inherently rank events. The taboo on magnitude comparisons might arise because quantifying suffering reduces it to numbers, which feels disrespectful, whereas classification can be seen as analytical. But classifications aren't neutral; labeling something a genocide elevates it above other terms.

  Boundary cases: If a community compares its own historical harms, is that more acceptable? Or if a survivor makes the comparison? The user suggests that framing for prevention might bypass the taboo. Outside atrocity, not ranking a friend's grief but calling it the worst possible—same asymmetry. So the norm is broader.

  Can this be a non-self-serving principle? The user suspects any formulation might just justify existing biases. For example, "acknowledge the unique significance of each event" still implies hierarchy. Or "avoid quantifying suffering" still allows classification, which has its own hierarchy. So the principle might always be self-serving.

  To carve this, I should identify the components: the commemorative duty (upward comparison as obligation), the prohibition (downward as sacrilege), and the dimensional split (classification vs. magnitude). The near-miss concepts could be uniqueness framing, moral singularity, and commensurability denial. Each misses something: uniqueness framing ignores that it's still comparative, moral singularity conflates magnitude with significance, and commensurability denial pretends classification is neutral.

  For a coined term, "directional commemorative exceptionalism" captures the one-way nature in memorial contexts. "Hierarchical incommensurability" combines the ranking with the denial. The definition would need to specify the asymmetries and address boundary cases, like when comparisons come from within or are for prevention.

  Ultimately, the norm might not be defensible as a principle because it's inherently paradoxical. It demands superlatives (which are comparative) while forbidding explicit comparison, revealing a contradiction in commemorative practices. The user's insight exposes this tension between the need for respect and the inevitability of ranking.
answer: |-
  Your observation cuts to the heart of a profound tension in how societies process collective trauma. Let's carve the phenomenon by dissecting its structure, identifying near-miss concepts, and examining the boundaries you've set. The core lies in **two nested asymmetries: a directional taboo (forbidding downward comparison while demanding upward superlatives) and a dimensional split (permitting classificatory comparison while forbidding magnitude comparison), both operating under the guise of anti-comparativism.**

  ### Core Components for Carving
  1.  **The Directional Asymmetry (Upward Permitted/Downward Forbidden):**
      *   **Permitted/Required:** Asserting uniqueness ("unprecedented"), supremacy ("worst"), or rupture ("nothing was the same"). These are *implicitly comparative* (ranking the event at the top) but presented as intrinsic attributes.
      *   **Forbidden:** Explicit comparative questions or statements suggesting equivalence ("one among many") or inferiority ("less severe than X"). This is seen as relativizing, diminishing, or profaning the specific suffering.
      *   **Driver:** The commemorative imperative. Superlatives function as a performative act of respect and sacralization within a specific memorial framework. Downward comparison is perceived as desacralizing, threatening the event's designated moral and historical weight essential to its commemorative identity.

  2.  **The Dimensional Asymmetry (Kind Permitted/Magnitude Forbidden):**
      *   **Permitted:** Classification ("Was it genocide?"), typology ("part of a pattern of ethnic conflict"), debates on legal categories (crimes against humanity vs. extermination). This is framed as analytical, scholarly, or definitional.
      *   **Forbidden:** Explicit quantification or ranking based on scale (death tolls, geographic scope, duration tables). This is seen as crude, dehumanizing, or engaging in "atrocity olympics".
      *   **Driver:** The illusion of categorical neutrality. Classification is perceived as objective taxonomy, masking the inherent hierarchy (e.g., "genocide" carries greater moral/legal weight than "ethnic cleansing"). Quantification is seen as inherently reductive and inherently competitive. The taboo on magnitude protects the emotional core of commemoration from perceived vulgar reductionism, *even though* classificatory success often hinges on implied magnitude thresholds.

  ### Near-Miss Concepts & Where They Fall Short
  Let's test established ideas against your boundaries and the dual asymmetries:

  1.  **"Uniqueness" Framing:**
      *   **Nearness:** Directly addresses the obligatory superlatives ("unprecedented," "rupture").
      *   **Miss:** Fails to capture the *asymmetry*. It doesn't explain why asserting uniqueness is allowed while *any* downward comparison (even questioning uniqueness) is forbidden. It also ignores the dimensional split (classifying *is* allowed, even if it challenges absolute uniqueness). Doesn't handle boundary cases like comparisons within a single community's history by survivors.

  2.  **"Moral Singularity":**
      *   **Nearness:** Captures the idea that the event is treated as incomparable, existing in its own ethical category. Explains the taboo on magnitude/ranking.
      *   **Miss:** Directly contradicts the *reality* of classificatory comparisons and the *requirement* for superlatives. If truly singular, why fight for the "genocide" label (a comparative category)? Why is saying "worst" obligatory? It cannot accommodate the *permitted* forms of comparison. Also struggles with boundary cases (e.g., survivor-led comparative prevention efforts).

  3.  **"Hierarchies of Suffering" / "Competitive Victimhood":**
      *   **Nearness:** Acknowledges that groups *do* implicitly or explicitly compete for recognition and status based on suffering. Explains the campaign for "genocide" status.
      *   **Miss:** (As you noted) Focuses on the *motivation* (scrambling for the top slot) rather than the *normative structure* (the specific asymmetry of what comparisons are *forbidden* vs. *required*). It doesn't explain why *explicit* ranking is taboo while *implicit* ranking via uniqueness/genocide claims is mandatory. Doesn't cleanly handle the dimensional split or the boundary case of internal community comparisons or non-atrocity examples.

  4.  **"Commensurability Denial":**
      *   **Nearness:** The assertion that different sufferings *cannot* be meaningfully compared in scale or severity. Explains the taboo on magnitude.
      *   **Miss:** Fails spectacularly on the directional asymmetry. If suffering is truly incommensurable, then asserting *supremacy* ("worst") should be just as logically invalid and taboo as asserting inferiority. Yet it isn't. Also ignores that classificatory comparisons *assume* a level of commensurability (enough similarity to fit a category).

  5.  **"Deflection" / "Whataboutism":**
      *   **Nearness:** Involves pointing to others' worse deeds to deflect criticism.
      *   **Miss:** (As you noted) This is a *tactic* used *within* comparative frameworks to evade accountability. It doesn't describe the foundational *norm* that *creates* the asymmetry where asserting "our" supremacy is sacred while making any downward comparison is profane. It's an application, not the underlying structure.

  ### Coining the Core: Directional Commemorative Incommensurability (DCI)
  This term attempts to capture the essence:
  *   **Directional:** Explicitly names the asymmetry (upward permitted/required, downward forbidden).
  *   **Commemorative:** Roots the phenomenon in the specific context of memorialization and sacralized remembrance, where the imperative is to honour *this* event above all.
  *   **Incommensurability:** Highlights the core *claim* (explicit or implicit) that the event defies comparison, particularly on magnitude.
  *   **The Paradox:** DCI is inherently paradoxical. "Incommensurability" is violated by the required superlatives and classificatory fights, and the "directional" aspect reveals the claim of incommensurability is applied selectively.

  ### Handling the Boundary Cases
  1.  **Single Community's History:** DCI often weakens internally. A community *might* tolerate comparing its own harms (e.g., "Our 1921 disaster was terrible, but the 1943 atrocity was unprecedented for us") because it reinforces a unified narrative of escalating victimhood/resilience. Downward comparisons *within* the community might still be taboo if they diminish the central sacralized event. The key is whether the comparison threatens the *core commemorative narrative*.
  2.  **Comparison by a Survivor:** This challenges the norm. Survivors possess inherent moral authority within the commemorative space. If *they* make a comparative statement (e.g., "Our suffering was like X" or "Y was worse in this specific way"), it forces a reevaluation. It may be accepted as profound testimony, dismissed as individual perspective, or controversially seen as breaking solidarity. It exposes the norm's vulnerability when the "protected" group itself challenges the asymmetry.
  3.  **Framed for Prevention:** This navigates the dimensional asymmetry. Framing comparison as analytical ("Patterns of dehumanization in Event A and Event B show early warning signs") leverages the *permitted* classificatory/comparative mode. It deliberately avoids magnitude ranking ("which was worse?") and focuses on mechanisms/processes, aiming to bypass the magnitude taboo by appealing to a future-oriented, utilitarian purpose. Its success depends on the audience's willingness to accept this framing over the commemorative imperative.
  4.  **Outside Atrocity (Grief/Achievement):** Confirms DCI is a broader social norm. We refuse to rank a friend's grief ("Don't say your breakup was worse than her losing her parent!") yet readily say "This is the hardest thing I've ever faced" or "She was the most inspiring teacher." Superlatives function similarly as performative acts of respect/solidarity/admiration within a specific relational context. Downward comparison is seen as diminishing the other's experience or achievement within *their* frame of significance. The commemorative impulse operates in micro-social contexts too.

  ### Can the Norm Be Stated Non-Self-Servingly?
  This is the crux. **It is exceptionally difficult, likely impossible, to formulate this norm as a consistent, non-self-serving principle.** Any attempt reveals the contradiction:

  *   **Attempt 1:** "We must acknowledge the unique and incomparable significance of specific historical traumas." *Problem:* "Unique and incomparable" *is* a comparative claim (it ranks the event above others). It's self-serving for the group asserting it.
  *   **Attempt 2:** "Quantifying suffering is inherently dehumanizing and disrespectful." *Problem:* This justifies the dimensional asymmetry but ignores that classificatory claims (like "genocide") also quantify implicitly and carry hierarchical weight. It doesn't explain why asserting *supremacy* ("worst") isn't equally dehumanizing via quantification. It also doesn't prevent using the norm selectively (forbidding quantification *only* when it might diminish *our* event).
  *   **Attempt 3:** "Commemoration requires focusing solely on the specific victims and their experience without reference to others." *Problem:* This directly contradicts the *requirement* for superlatives ("unprecedented," "worst") and classificatory labels ("genocide"), which *are* references placing the event in a larger context. The superlatives are essential *to* the commemoration.
  *   **The Underlying Principle:** The only consistent principle seems to be: **"The designated sacralized event must be rhetorically protected from any comparison that might diminish its perceived absolute moral weight within its commemorative framework."** This *is* inherently self-serving for the group invested in that commemoration. It prioritizes the *function* of remembrance (honouring *this* group, *this* event, in *this* way) over logical consistency or historical contextualization. Any "non-self-serving" formulation either dissolves into the contradiction or ceases to perform the commemorative function that necessitates the asymmetry in the first place.

  ### Conclusion
  You've identified **Directional Commemorative Incommensurability (DCI)**: a social-normative structure arising from the sacralization of trauma within memorial contexts. It demands superlatives (implicitly comparative upward rankings) and classificatory elevation (e.g., genocide status) while forbidding explicit downward comparisons and magnitude rankings, masking its inherent comparativism under claims of uniqueness and the rejection of "ranking suffering." Its near-miss concepts (Uniqueness, Moral Singularity, Competitive Victimhood, Commensurability Denial) fail because they cannot simultaneously account for the *requirement* of implicit upward comparison and the *forbidding* of explicit downward/magnitude comparison. Boundary cases reveal its flexibility and broader application but also its tensions, especially when challenged from within the commemorated group. Crucially, **the norm resists coherent non-self-serving formulation** because its purpose is precisely to protect a specific, invested narrative of supreme significance, making any universal principle inherently contradictory. The power of your analysis lies in exposing this fundamental tension between the need to honour specific suffering and the impossibility of doing so without invoking, and simultaneously denying, comparison.
