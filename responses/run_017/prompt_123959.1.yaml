answer: |-
  Here’s a streamlined decision procedure that fits your constraints, targets your four theoretical concerns, and uses only data you already collect. It runs in three sequential steps, takes <5 minutes prep and ~10 minutes meeting time, and outputs one of four verdicts with prescribed remedies. I’ve corrected one point in your summary: **herding isn’t always arbitrary**—if early speakers have strong expertise, the cascade may be rationally justified (though still fragile). The procedure accounts for this.

  ---

  ### **Step 1: Vote Shift Analysis**  
  *(Uses: Sealed pre-votes vs. final tally)*  
  **Diagnostic**: **Net Vote Shift (NVS)** = |Final "Yes" votes| – |Pre-vote "Yes" votes|.  
  - **Sufficient answer**: NVS ≥ 3 (e.g., pre-vote 4-6 against → final 9-1 for).  
  - **Non-answer**: NVS ≤ 2.  
  - **Terminates in No**: Proceed to Step 2.  
  **Why**: Large shifts suggest herding, as private signals are overridden by social updating.  

  ### **Step 2: Evidence & Fragility Check**  
  *(Uses: Stated reasons, proposal context)*  
  **Diagnostic A: Evidence Concentration Index (ECI)**  
  - Count unique, **citable sources** in reasons (e.g., "Field visit," "Evaluation Report," "WSJ 4/12 article"). Ignore vague claims ("gut feeling").  
  - **High concentration**: ≤2 unique sources cited by ≥80% of voters.  
  - **Low concentration**: >2 sources or <80% alignment.  

  **Diagnostic B: Fragility Threshold (FT)**  
  - Calculate votes needed to flip outcome: e.g., 9-1 for → needs 5 flips to become 4-6 against.  

  **Verdict Matrix**:  
  | ECI       | FT ≤3       | FT ≥4       |  
  |-----------|-------------|-------------|  
  | **High**  | **Yellow**  | Green       |  
  | **Low**   | **Red**     | **Yellow**  |  

  - **Green**: Genuine convergence (low fragility + diverse evidence). Proceed to vote.  
  - **Yellow**: Possible cascade. Proceed to Step 3.  
  - **Red**: High cascade risk. **Stop here → Remediate** (see below).  

  **Why**: High ECI + low FT indicates shared evidence dominates (legitimate) or herding (fragile). Low ECI + low FT suggests arbitrary cascade.  

  ### **Step 3: Speaker Order Test**  
  *(Uses: Speaking order, pre-votes)*  
  **Diagnostic**: **Speaker Sensitivity Score (SSS)**  
  - Simulate two alternative speaking orders:  
    1. **Reverse order**: Last speaker first.  
    2. **Expert-first**: Member with strongest relevant expertise (per your judgment) first.  
  - Reproject votes: Assume each member votes "No" unless:  
    - Their pre-vote was "Yes," OR  
    - An earlier speaker in the new order cited **new, non-public evidence** (e.g., "my contact in Bogotá said...").  
  - **Sufficient answer**: Outcome flips in ≥1 simulation. → **Red verdict**.  
  - **Non-answer**: Outcome unchanged. → **Yellow verdict**.  

  **Why**: Tests path-dependence. True cascades flip if early speakers change.  

  ---

  ### **Verdicts & Remedies**  
  1. **Green** ("Genuine Convergence"):  
     - **Remedy**: Accept the final vote.  
     - **Board note**: "Convergence supported by diverse evidence and high confidence threshold."  

  2. **Yellow** ("Ambiguous: Possible Cascade or Expertise Deference"):  
     - **Remedy**: **Defer once**. Re-solicit private evidence:  
       - Members submit **new, written comments** in fixed order (no live discussion).  
       - Focus: "What is one piece of **non-public** information affecting your view?"  
     - **Board note**: "Potential information effects detected; additional private signals requested."  

  3. **Red** ("High Cascade Risk"):  
     - **Remedy**: **Outside read + defer**.  
       - Commission a 1-hr expert review (e.g., academic or field contact).  
       - Share review anonymously with committee before re-vote.  
     - **Board note**: "Vote pattern suggests fragile consensus; external input sought."  

  4. **Black** ("Non-Informative Vote"):  
     - **Trigger**: If NVS ≤2 *and* all reasons cite the same public source (e.g., "the memo says X").  
     - **Remedy**: Ignore live vote. **Use pre-votes as the decision**.  
     - **Board note**: "Decision relied on initial private assessments due to redundant public information."  

  ---

  ### **Application to Your Cases**  
  **Case 1: Ballot-Measure Grant (9-1 for, pre-vote ?)**  
  - **Step 1**: Pre-votes unknown, but final 9-1 vs. likely split pre-vote (since 2 seniors drove consensus). Assume NVS ≥3 → Proceed.  
  - **Step 2**: ECI = High (all cited same memo). FT = 5 flips needed (9-1 → 4-6). **Verdict: Green** (High ECI + High FT).  
  - **Friend's rebuttal**: Wrong. **Step 3**: Simulate expert-first order (seniors last). Without their early input, others vote pre-vote (assume ~5-5). Outcome flips → **Red verdict**.  
  - **Conclusion**: Cascade. **Remedy**: Outside read + re-vote.  

  **Case 2: Your 10-0 Grant (Pre-vote 6-4)**  
  - **Step 1**: NVS = |10| – |6| = 4 → Proceed.  
  - **Step 2**: ECI = High (all cited same report). FT = 5 flips needed → **Verdict: Green**.  
  - **Step 3**: Simulations: Reverse/expert-first orders unlikely to flip votes because evidence is public and unanimous.  
  - **Conclusion**: Genuine convergence (shared evidence, not herding). **Remedy**: Accept vote.  

  **Case 3: Renewal 9-1 Against (You deferred)**  
  - **Step 1**: Assume pre-vote split (e.g., 4-6 against → NVS=3). Proceed.  
  - **Step 2**: ECI = Low (3 unique sources: separate reporting issues). FT = 5 flips → **Verdict: Yellow**.  
  - **Step 3**: Simulations: Reordering unlikely to flip outcome; problems were independently verified.  
  - **Conclusion**: Not a cascade (legitimate shared concerns). **Your intervention unnecessary**.  
  - **Better remedy**: Yellow verdict → Defer and re-solicit private evidence (e.g., "Share one unreported incident with grantee").  

  ---

  ### **Limitations & Safeguards**  
  1. **Cannot detect**:  
     - Reputational conformity (e.g., voting "No" to avoid blame).  
     - "False negative" cascades where pre-votes accidentally align.  
  2. **Degradation when gamed**:  
     - If members know the procedure, they may:  
       - Inflate pre-votes to avoid Step 1 flags (counter: use pre-votes as tiebreaker in Black verdicts).  
       - Fabricate "unique" sources in reasons (counter require citations).  
     - **Mitigation**: Run sporadically (e.g., 1–2 grants/meeting); don’t reveal diagnostics.  
  3. **Audit frequency**:  
     - Quarterly, audit **4 random grants** (2 unanimous, 2 split).  
     - Track: Verdict accuracy (vs. outcomes) + time cost.  
  4. **Judgment points**:  
     - Step 2 (ECI): Deciding what counts as a "unique source" (your call).  
     - Step 3 (SSS): Judging "strongest expertise" for simulations.  

  This gives you a defensible, theory-grounded filter for cascade risk using existing data. It flags 3–5 grants/year for deeper review, costing ~15 min/week. Board note is a checkbox: "Verdict: [Green/Yellow/Red/Black] per Sec. 4.B of Committee Charter."
