prompt: |-
  I'm writing a seminar paper on subsidiarity across four systems — the United States, Germany, Switzerland and the European Union — and I keep hitting the same obstruction. Every formulation of the principle I can find is procedural: it tells you who must justify what, to whom, and how clearly, but never which substantive wrong the principle is meant to prevent. So I want to approach it from the other side and treat the practices as the evidence. Four of them puzzle me. First, in Germany a federal statute that the Länder will have to execute, or that regulates their administrative procedure, cannot take effect without the consent of the Bundesrat, whose members are the Länder governments themselves: the Länder hold something close to a veto over federal legislation not because the subject matter is reserved to them but because they are the ones who will administer it. Yet the same Länder execute a great deal of EU law with, as far as I understand it, only a weaker right of participation in the making of that law — something approaching a veto only where their exclusive competences over schools, culture and broadcasting are touched. Second, in the Union the rule is stated as a comparative test — Article 5(3) of the Treaty on European Union says that in areas which do not fall within its exclusive competence, the Union shall act only if and in so far as the objectives of the proposed action cannot be sufficiently achieved by the Member States, either at central level or at regional and local level, but can rather, by reason of the scale or effects of the proposed action, be better achieved at Union level — and it is operationalised by the Commission giving reasons for its own proposals, by national parliaments (and, in some states, regional parliaments with legislative powers) sending reasoned opinions within a fixed period, and by a mechanism whereby objections reaching a threshold share of the votes allocated to those parliaments force the Commission to review and justify, while a larger majority lets the Council and Parliament send the proposal back. But the same member-state governments that sit in the Council adopt the measure, and the Court of Justice has rarely if ever annulled one on subsidiarity grounds. Third, American courts say that a federal statute will not be read to displace state law unless Congress has made its intention to do so unmistakably clear in the language of the statute — while the very same courts will invalidate a state statute under the dormant commerce clause, a doctrine inferred from a grant of power to a Congress that has said nothing at all. Fourth, in Switzerland no court can set aside a federal statute for exceeding federal competence, since the Federal Supreme Court is bound to apply federal statutes; boundary disputes are settled politically instead, through the optional referendum and through fiscal equalisation among the cantons.

  What I would like from you is the implicit theory behind each of these, and the differences between them. My own attempt at a taxonomy gives three candidates, which you should feel free to replace or refine: (a) a reserved-sphere view, on which certain matters belong to a lower level as such and central action over them is a distinct kind of wrong; (b) a comparative-efficiency view, on which allocation is a single test about the achievement of a given objective plus a rule about who bears the burden of proof; and (c) a participation-or-consent view, on which the real wrong is not centralisation but being bound by a decision in the making of which you had no part, so that what is owed to the lower level is a voice or a veto rather than a domain. Then tell me, for each practice, what it strictly presupposes as opposed to what it merely fits well with, and where the practice is philosophically underdetermined because several quite different theories would license exactly what those systems do.

  There are four cruxes I especially want addressed. Does the German consent requirement presuppose (a) or (c), and if (c), why is it not inconsistent to withhold the corresponding veto over EU law the Länder execute? Is a self-applied constraint — a legislature judging its own compliance, as the Union in effect does — a normative constraint at all, and how much does it matter whether the boundary question is ultimately settled by a court, by an electorate, or by the body whose power is in question? Does the American asymmetry between demanding clarity from Congress and demanding none from the states show that federalism there is protected as a matter of process rather than substance, or does it show something about who is thought to be the beneficiary of the principle? And is there any upward principle anywhere in this material: none of these rules says that a level must act, or must defer, when another level's failure harms outsiders, and yet Germany's Basic Law also authorises federal legislation where it is required to establish equivalent living conditions across the country, and the Union counts cohesion among member states among its aims — so is that a rival principle, a corollary, or already implicit in the phrase about what cannot be sufficiently achieved by the member states? Finally, say in concrete terms what would have to change in each system if the theory you reconstruct were replaced by one of the others — which existing rule becomes indefensible, and which rule now looks like it was doing no work at all. Please don't give me a bibliography, case citations or a reading list; I have those, and I want the reconstruction itself, roughly 800 to 1000 words, with your distinctions explained in your own terms rather than merely labelled.
reasoning: |-
  Okay, the user is grappling with the conceptual foundations of subsidiarity across four different systems. They've identified a pattern: all existing formulations seem procedural rather than substantive, and they want to reverse-engineer the implicit theories from actual practices. Their frustration with abstract definitions is palpable—they're clearly deep in the weeds of comparative federalism research.

  The core challenge here is extracting unstated normative principles from institutional designs. Each of their four puzzling practices represents a different philosophical stance masquerading as procedure. The German Bundesrat veto, the EU's multi-stage review, the American judicial asymmetries, and Swiss political safeguards—all these mechanisms answer the "why" of subsidiarity through "how."

  Hmm, their proposed taxonomy (reserved-sphere, comparative-efficiency, participation-consent) is useful but incomplete. The Swiss example especially breaks it—if boundary disputes are settled politically rather than judicially, that suggests a fourth category: subsidiarity as negotiated equilibrium rather than rule-based allocation. 

  For the German crux: The Bundesrat requirement leans heavily on (c) participation-consent, but its absence at the EU level isn't inconsistent because consent operates differently in delegated execution scenarios. Länder accept EU law administration as part of a broader sovereignty trade-off—their "voice" shifts from veto power to implementation discretion. This is crucial: participation theory doesn't demand uniform mechanisms across governance tiers.

  On the EU's self-policing question: A self-applied constraint absolutely functions normatively when paired with external review points (national parliaments' yellow cards, ECJ's theoretical oversight). The constraint lies in the justification ritual itself—forcing the Commission to articulate why members can't achieve objectives alone creates discursive accountability. Judicial review's absence matters less than the user thinks; the system prioritizes political dialogue over litigation.

  The American asymmetry reveals federalism's beneficiary. Dormant commerce clause protects interstate actors (citizens, businesses) from state parochialism, while the clear-statement rule protects states as institutions. Both are procedural but serve different masters—one prevents negative externalities, the other preserves state autonomy. This duality shows subsidiarity isn't monolithic even within one system.

  The upward principle (federal power to ensure equity) isn't rival but complementary. When "sufficient achievement" fails due to regional disparities or spillovers, higher-level intervention becomes justified under comparative efficiency (b). Germany's equivalent living conditions clause operationalizes this—subsidiarity isn't just bottom-up protection but upward obligation when lower levels cause collective harm.

  If theories were swapped: Imagine imposing Germany's consent model on the EU. Suddenly, every delegated regulation would require unanimous Council approval—paralyzing the single market. Conversely, applying the US judicial model to Switzerland would collapse its political safeguards tradition. Each system's friction points (e.g., ECJ's non-intervention, Swiss lack of judicial review) prove functional within their native theories.
answer: |-
  Your analysis cuts to the heart of subsidiarity's paradox: it defines *how* power should be allocated but remains elusive on *why*. Let's reconstruct the implicit theories behind each practice, using your taxonomy as a scaffold while refining it to capture the nuances:

  **Refined Taxonomy:**
  1.  **Reserved Domain (Substantive):** Certain powers are inherently local, central encroachment is a *category error* violating sovereignty/identity.
  2.  **Comparative Efficiency (Functional):** Allocation is purely instrumental; the level achieving a specific policy goal *most effectively* should act, burden of proof dictates who justifies why.
  3.  **Procedural Consent (Relational):** The wrong is *imposition without voice*. Legitimacy stems from participation/consent of the level bound/executing, not the subject matter per se.
  4.  **Political Safeguards (Systemic Equilibrium):** Boundaries are best maintained through political negotiation and compromise between levels, not judicial or rigid legal formulas. Focus on systemic stability.

  **Applying the Theories to the Practices:**

  1.  **German Bundesrat Consent (Federal Laws Executed by Länder):**
      *   **Implicit Theory:** Primarily **Procedural Consent (c)**, significantly infused with **Political Safeguards (d)**. The veto isn't primarily about the *topic* belonging inherently to Länder (Reserved Domain), but about the *Länder governments* being the ones burdened with execution. They must consent to being saddled with implementing federal will. The Bundesrat mechanism forces negotiation and compromise (*Political Safeguards*) between the federal legislature and the Land executives.
      *   **Crux Resolution (EU Law Execution):** The lack of a strong Länder veto over EU law isn't inconsistent *if* we view the EU relationship through **Political Safeguards (d)** and modified **Procedural Consent (c)**. Germany (federal government) participates in EU law-making via the Council. The Länder's "voice" is channeled *through* the federal government in this forum (via instructions, Art. 23 GG), representing a different *kind* of consent/participation chain. Accepting EU law execution is seen as part of Germany's overall sovereignty bargain within the EU, a negotiated equilibrium. The weak direct participation on exclusive competences is a limited carve-out acknowledging **Reserved Domain (a)** concerns.
      *   **Presupposes:** That the legitimacy of imposing administrative burdens hinges crucially on the consent of those bearing the burden (Procedural Consent). It does *not* strictly presuppose Reserved Domain, as the topic can be federal; it presupposes an administrative burden on Länder governments.
      *   **Underdetermined:** It *could* fit a Reserved Domain view if seen as protecting Land *executive* autonomy, but the trigger (execution burden) is functional, not substantive.

  2.  **EU Subsidiarity Procedure (Art. 5(3) TEU):**
      *   **Implicit Theory:** Overwhelmingly **Comparative Efficiency (b)**, operationalized through **Procedural Safeguards** (reasoned opinions, review mechanisms). The core test is instrumental: can Member States (centrally, regionally, locally) achieve the objective *sufficiently*? If not, and the EU can do it *better*, action is justified. The elaborate procedural steps (Commission justification, national/regional parliamentary opinions, review triggers) are about *enforcing the burden of proof* on the EU to demonstrate inefficiency at lower levels.
      *   **Crux Resolution (Self-Application/Lack of Annulment):** This *is* a normative constraint, but of a specific kind: a **deliberative constraint**. The requirement to justify *forces articulation* of the efficiency rationale, subjecting it to political scrutiny (national parliaments, Council, EP). The rarity of ECJ annulment suggests the system prioritizes the *political dialogue and justification process* over judicial second-guessing of complex policy efficiency assessments. The constraint is procedural/deliberative, not necessarily substantive/judicial. The Council adopting the measure after this process reflects acceptance of the justification within the political system.
      *   **Presupposes:** That subsidiarity is fundamentally about *effectiveness* and *burden of proof*. Legitimacy stems from correctly answering "who can do this job better?" not "who owns this domain?" or "who consented directly?".
      *   **Underdetermined:** The process *could* be seen as a form of indirect **Procedural Consent** via national parliaments, but its focus remains squarely on justifying efficiency, not consent per se.

  3.  **US Asymmetry (Clear Statement vs. Dormant Commerce Clause):**
      *   **Implicit Theory:** A hybrid revealing distinct beneficiaries:
          *   *Clear Statement Rule (Protecting States):* **Procedural Consent (c)** / **Reserved Domain (a) Lite**. Congress must speak clearly to displace state law, protecting states' sphere of action and their legislative autonomy from implied federal override. It emphasizes state consent to *displacement*.
          *   *Dormant Commerce Clause (Protecting the National Market/Individuals):* **Comparative Efficiency (b)** / **Reserved Domain (a) for the National Sphere**. The *negative* implication protects the federal sphere (national common market) from state parochialism *even if Congress is silent*. The wrong is state laws harming interstate commerce (inefficiency/barriers), and the beneficiary is the national economy and its participants. Courts act as guardians of this federal space.
      *   **Crux Resolution (Beneficiary/Process vs. Substance):** This asymmetry shows subsidiarity isn't monolithic. It protects *states as institutions* (via process/clear statement) and protects the *integrity of the national common market* (via substantive judicial review). The dormant commerce clause presupposes a **Reserved Domain of National Economic Unity** that states cannot invade, justifying judicial intervention even without Congressional action. The clear statement rule protects a **Procedural Consent/Reserved Domain Lite** for states against federal encroachment.
      *   **Presupposes:** A fundamental distinction between protecting lower-level *autonomy* (states) and protecting the *functional integrity* of the national sphere (common market) from lower-level interference. Judicial review is central for the latter.
      *   **Underdetermined:** The dormant commerce clause *could* fit a strong **Reserved Domain** view for national commerce, but its judicial creation sits uneasily with strict textualism.

  4.  **Swiss Political Settlement (No Judicial Review, Referendum, Equalization):**
      *   **Implicit Theory:** **Political Safeguards (d)** as the dominant principle, with **Procedural Consent (c)** via referendum. Boundary disputes are inherent political questions best resolved through negotiation and direct democracy. The optional referendum gives cantons/people a direct veto (**Procedural Consent**) over federal laws, acting as the primary constraint. Fiscal equalization is a tool for **negotiated equilibrium**, compensating for centralization pressures and maintaining cantonal viability/consent.
      *   **Presupposes:** That ultimate sovereignty rests with the people/cantons, expressed politically, not judicially. Trust lies in direct democracy and inter-cantonal compromise to maintain the federal balance. Judicial review is viewed as potentially disruptive to this political process.
      *   **Underdetermined:** While clearly rejecting judicial enforcement of subsidiarity boundaries, the system *could* incorporate elements of **Comparative Efficiency** or **Reserved Domain** as arguments used *within* the political process (e.g., referendum campaigns).

  **Addressing the Upward Principle (Cohesion/Equivalence):**
  This is **implicit within the Comparative Efficiency (b) framework**, not a rival principle. The phrase "cannot be sufficiently achieved by the Member States" (EU) or the requirement for "equivalent living conditions" (Germany) addresses *negative externalities* or *collective action problems*. If sub-units *cannot* solve a problem (e.g., cross-border pollution, extreme economic disparity harming national cohesion, preventing a race to the bottom), their action is deemed *insufficient*. Central action becomes justified *because* lower-level failure harms the collective good ("outsiders" in the broader unit). It's the flip side of the efficiency test: lower-level insufficiency justifies upward action.

  **Consequences of Theory Swaps:**

  1.  **Impose Reserved Domain (a) on Germany's Bundesrat:** The Bundesrat veto would be restricted *only* to laws touching inherently Land matters (culture, education), not *all* laws they execute. The current broad veto over execution burdens would become indefensible, as the trigger wouldn't align with the substantive domain.
  2.  **Impose Procedural Consent (c) on the EU:** Every EU law requiring national/regional execution would need direct approval by national parliaments or regional assemblies (a super-Bundesrat model), not just reasoned opinions. The current efficiency-based justification and political review would seem inadequate, lacking true lower-level consent. The Commission's role would diminish drastically.
  3.  **Impose Comparative Efficiency (b) on the US Dormant Commerce Clause:** Courts would need to defer to state laws unless Congress expressly preempted them, even if they burdened commerce. The dormant commerce doctrine would collapse, as the judicial role in protecting the national market without Congressional action relies on a substantive view of federal domain/national efficiency needing protection.
  4.  **Impose Judicial Review (implied by a/b/c) on Switzerland:** The Federal Supreme Court would gain the power to annul federal laws for exceeding competence. The referendum and political negotiation would lose their status as the *ultimate* arbiters of competence boundaries. Fiscal equalization might become subject to legal challenges over its distributive impact on cantonal autonomy.
  5.  **Impose Political Safeguards (d) on the US:** The dormant commerce clause would likely be abolished, leaving disputes over state burdens on commerce to be resolved politically by Congress. The clear statement rule might remain, but as a political norm rather than a judicial canon, potentially weaker.

  In essence, each system embodies a distinct *mix* prioritizing different facets of the subsidiarity puzzle: Germany emphasizes consent of the executor; the EU focuses on proving comparative efficiency; the US reveals a dual protection (state autonomy vs. national market integrity); Switzerland relies on direct democracy and political bargaining. The "substantive wrong" prevented varies accordingly: imposition without voice, inefficient allocation, erosion of state autonomy, disruption of the national market, or destabilization of the federal political compact. The procedural mechanisms are the tailored solutions to these diverse perceived wrongs.
