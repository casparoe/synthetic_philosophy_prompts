  | **IRV (Instant Runoff)**       | ✘★★★?★★                              | - Violates Unanimity (1): Spoilers *can* flip results (e.g., similar candidates split votes).<br>- Robust to garbled ballots (6a) if errors are random.<br>- Fails partial ballots (6c): Requires full rankings.<br>- Simple explainability (6d). | **Avoid** – spoiler risk violates your core concern. |
  | **Approval**                | ✘✘★★★?★                              | - Violates Pareto (2) & Condorcet Loser (3): A "least hated" candidate can win.<br>- Simple explainability (6d).<br>- Handles partial ballots (6c). | **Avoid** – fails key fairness checks. |
  | **Borda**                   | ★✘✘★★✘★                              | - Violates Condorcet Loser (3) & Robustness (6a): Adding clones shifts scores; sensitive to incomplete ballots.<br>- Explainability moderate (6d). | **Avoid** – fragile and manipulable. |
  | **Plurality**               | ✘✘✘★★✘✘                              | - Violates almost all non-negotiables. Susceptible to spoilers.                                  | **Worst fit**. |

  #### Key Takeaways:
  - **Condorcet methods** (Ranked Pairs or Schulze) satisfy all non-negotiables except 4b/6d. Schulze is used by Debian/Ubuntu and handles large committees well.
  - **IRV fails your spoiler requirement** – it's better than plurality but still vulnerable to factional manipulation.
  - **Drop 6b (shortlist consistency)**: No rule satisfies this without violating fairness. Instead, compute the shortlist as the top 3 in the Condorcet ranking.

  ---

  ### **4. Recommendation**
  - **Adopt a Condorcet method (Ranked Pairs or Schulze)**.  
    - **Why**: Only rule satisfying all non-negotiables. Resists spoilers, respects unanimity, and handles partial/erroneous ballots robustly.
    - **Compromises**:  
      - **Explainability (6d)**: Publish pairwise matchups (e.g., "X won because 65% preferred X over Y"). For cycles, use a tiebreaker (e.g., "margin of victory").  
      - **Strategy-proofness (4b)**: Accept that tactical voting *can* happen but is hard to coordinate (monitor for manipulation).  
      - **Shortlist consistency (6b)**: Abandon this; take the top 3 from the full ranking.
  - **Avoid IRV/Approval/Borda** – they fail critical fairness requirements.
  - **Implementation**: Use open-source tools like [OpenSTV](https://www.openstv.org/) (supports Condorcet). For shortlists, run the rule once and take the top three.

  ### **Final Checklist**
  | Requirement      | Condorcet (Ranked Pairs/Schulze) | Action                                                                 |
  |------------------|----------------------------------|------------------------------------------------------------------------|
