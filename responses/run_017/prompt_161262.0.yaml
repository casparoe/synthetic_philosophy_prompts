prompt: |-
  Our open-source foundation has about 400 voting members, and we're about to move to one single rule for everything: electing the chair from 3–6 candidates, picking one of 4–8 mutually exclusive roadmap proposals, and producing a ranked shortlist of three for the grants committee. Right now every committee invents its own procedure and it's a mess. I want the spec written down before I look at any actual rule: what does a rule have to get right to count as adequate *for us*, with the case behind each requirement, and which of the things people demand are genuine requirements and which are just what one camp happens to like.

  Roughly what's on my list so far:

  - if everyone ranks X above Y and nobody changes their mind about anything else, X and Y shouldn't swap places (the spoiler thing — I keep seeing a faction win by getting an extra similar-looking option onto the ballot, which maybe belongs here too)
  - if every single member prefers X to Y, Y doesn't win
  - a candidate who would lose head-to-head against every other candidate never wins (does this one have a name?)
  - nobody should get a better result by staying home, or by ranking there favourite lower
  - it has to actually produce an answer, or at least a tie-break a member can carry out by hand
  - three things I made up and have never seen written down anywhere: (a) if ~2% of ballots get garbled — misclicks, duplicates, someone filling in only two of the options — the outcome should usually be unchanged, and piling more irrelevant options onto the ballot shouldn't make it more fragile; (b) shortlisting three and then running the same rule on the shortlist should give the same winner as running it once on the full field; (c) it shouldn't matter whether we ask members to rank every option or only the ones they have an opinion about; (d) we need to publish a few lines explaining why X beat Y that a losing member can check without seeing the whole ballot set.

  I suspect (b) and (c) are secretly the same requirement as the spoiler one, or the spoiler one in a costume — if so, say so plainly rather than scoring rules against my list politely.

  The part I most want is the joint-unsatisfiability part: I know Arrow's theorem says some cluster of these can't all hold at once, and I think there's something similar about strategic voting (Gibbard–whatsit?). State precisely which subsets are impossible together and where exactly I have to choose — and don't just gesture at the theorem, tell me which of *my* items are in the impossible cluster and which are safe.

  Two smaller asks. Mark each requirement non-negotiable-for-us vs. nice-to-have, and tell me which single requirement does the most work in ruling rules out — the one where dropping it suddenly makes everything available. A short scorecard at the end is fine: plurality, instant runoff, Borda, approval/score, and the pairwise-Condorcet family, a line or two each, no more.

  And be honest about confidence: flag which claims are theorems you'd stake money on, which are standard-but-informal, and which are your own judgement call. If the whole framing is misguided — if one rule for chair elections and shortlists is a bad idea, or a couple of my requirements are just confused — tell me that instead of filling in the table.
reasoning: |-
  We are dealing with a complex set of requirements for a voting rule that must handle several types of elections (electing a chair, choosing one proposal, and producing a ranked shortlist). The goal is to specify a single rule for all. We have a list of desired properties, some of which are standard and some novel. We also need to understand which properties are mutually incompatible (due to Arrow's theorem and the Gibbard-Satterthwaite theorem) and which are practical necessities.

  Let's break down the requirements:

  1. **Spoiler Effect / Independence of Clones (related to your first point):** 
     - If everyone ranks X above Y and nothing else changes, then X should be ranked above Y in the result. Also, adding a candidate that is very similar to an existing one (a "clone") should not cause the original candidate to lose when they would have won without the clone. This is known as the "Independence of Clones" criterion.

  2. **Pareto Efficiency:**
     - If every voter prefers X to Y, then Y should not win. This is a fundamental criterion and non-negotiable.

  3. **Condorcet Loser Criterion:**
     - A candidate who would lose in a head-to-head matchup against every other candidate should never win. This is a standard criterion and has the name you mentioned.

  4. **Strategy-Proofness (or lack of incentive to misrepresent preferences):**
     - No voter should get a better outcome by:
          (a) Staying home (participation criterion: if you vote honestly, you shouldn't cause a worse outcome than by not voting).
          (b) Ranking their favorite candidate lower (this is about strategic voting, i.e., no benefit from insincerely ranking a candidate lower than they truly prefer).

  5. **Decisiveness:**
     - The rule must produce a winner (or a tie that can be broken by a simple, predetermined method). This is non-negotiable.

  6. **Novel Requirements:**
     - (a) **Robustness to ballot errors:** If about 2% of ballots are invalid or incomplete, the outcome should usually remain the same. Also, adding irrelevant options (candidates that are not competitive) should not make the outcome more sensitive to errors. This is about stability and is a practical requirement.
     - (b) **Consistency under shortlisting:** Running the rule on the full field and then shortlisting the top three and running the same rule again should yield the same winner as running it once on the full field. This is a kind of "consistency" or "subset choice consistency" requirement.
     - (c) **Indifference handling:** The rule should work the same whether voters are required to rank all candidates or only some (partial ballots). This is about the treatment of incomplete ballots. Many rules (like IRV) require complete rankings, but others (like Condorcet methods) can handle incomplete ones. This is a practical requirement for voter convenience.
     - (d) **Explainability:** There should be a simple explanation (a few lines) for why X beat Y that a losing member can verify without seeing the entire ballot set. This is about transparency and auditability.

  You suspect that (b) and (c) might be related to the spoiler effect. Let's analyze:

  - Requirement (b) (consistency under shortlisting) is a form of "independence of irrelevant alternatives" (IIA) in a specific context? Actually, IIA (in the Arrow sense) is about the relative ranking of two candidates being independent of other candidates. But requirement (b) is about the outcome being consistent when we remove candidates that are not in the top three. This is a stronger form of consistency and is not directly the same as the spoiler effect, but it is related to the idea that the removal of candidates shouldn't change the winner if the winner is still present and the removed candidates were not the winner.

  - Requirement (c) (handling partial ballots) is about the voting rule being robust to incomplete preferences. It is not directly the same as the spoiler effect, but it does relate to the rule's behavior when some information is missing.

  Now, the big issue: Arrow's Impossibility Theorem and the Gibbard-Satterthwaite Theorem.

  - **Arrow's Theorem**: In an election with three or more candidates, no ranked voting system can simultaneously satisfy:
    1. **Unanimity** (if every voter prefers X over Y, then the system should rank X above Y) — this is similar to Pareto efficiency.
    2. **Independence of Irrelevant Alternatives (IIA)**: The relative ranking of two candidates should depend only on the voters' rankings of those two candidates (not on the presence or ranking of other candidates).
    3. **Non-dictatorship**: There is no single voter whose preferences always determine the outcome.

  Note: Your requirement 1 (if everyone ranks X above Y, then X and Y shouldn't swap) is a form of unanimity. Requirement 1 also touches on IIA because it says that adding a candidate (a spoiler) shouldn't change the relative ranking of X and Y if no one changes their mind about X and Y.

  - **Gibbard-Satterthwaite Theorem**: Any voting system for three or more alternatives that is deterministic and satisfies unanimity and has a range of at least three possible outcomes must be susceptible to strategic voting (i.e., it is not strategy-proof).

  Now, let's map your requirements to these theorems and see the conflicts.

  **Impossible Clusters:**

  1. Arrow's Theorem: We cannot have a rule that satisfies:
     - Unanimity (which is part of your requirement 1 and requirement 2) 
     - IIA (which is related to your requirement 1 and requirement 6b and 6d, but note that IIA is a very strong condition that most rules fail) 
     - Non-dictatorship (which we definitely want)

     However, note that Arrow's theorem applies to rules that produce a complete ranking of all candidates. If we only need to choose a single winner (and not a complete ranking), then Arrow's theorem does not directly apply. But many of the same issues remain.

  2. Gibbard-Satterthwaite Theorem: We cannot have a rule that is:
     - Deterministic
     - Unanimous (if everyone prefers X, then X wins)
     - Strategy-proof (no incentive to misrepresent preferences) for every possible preference profile.

     This directly conflicts with your requirement 4 (strategy-proofness).

  Therefore, we must give up on having a rule that is completely strategy-proof (requirement 4) because of Gibbard-Satterthwaite. Similarly, we cannot have a rule that satisfies IIA (a strong form of your requirement 1 and 6b) and non-dictatorship and unanimity because of Arrow.

  So which of your requirements are in the impossible cluster?

  - Requirement 4 (strategy-proofness) is impossible to achieve fully (by Gibbard-Satterthwaite) for any rule that is deterministic and satisfies unanimity (which we require). Therefore, we have to relax requirement 4: we can only aim for rules that are "resistant" to strategic voting in practice, or that are strategy-proof in some restricted domains, but not in general.

  - Requirement 6b (consistency under shortlisting) is a form of consistency that is very strong and might be related to IIA. In fact, if we require that the winner remains the same when we remove candidates that are not in the top three, this is a kind of IIA. But note: Arrow's theorem is about complete rankings, and we are only concerned with the winner. However, there are known impossibilities for choice functions as well. It is likely that requirement 6b is too strong and may conflict with other requirements.

  **Re-evaluating the Requirements:**

  Let's classify each requirement as non-negotiable or nice-to-have, and note conflicts:

  1. **Spoiler/Clone Independence (and the specific example of adding a similar candidate):** This is non-negotiable because you've observed problems with spoilers. However, note that the standard formulation of IIA is too strong and cannot be satisfied. Therefore, we might aim for a weaker condition: independence of clones (a specific kind of spoiler) and the condition that if everyone prefers X to Y, then Y doesn't win (which is Pareto). 

     Non-negotiable: The Pareto condition (if everyone prefers X to Y, then Y doesn't win) is non-negotiable. The spoiler effect in the form of clone independence is also non-negotiable because of past problems.

  2. **Pareto Efficiency:** Non-negotiable.

  3. **Condorcet Loser Criterion:** Non-negotiable? You said "never wins", so it's a must.

  4. **Strategy-Proofness (Requirement 4):** We have to relax this because of Gibbard-Satterthwaite. We can only hope for a rule that is "resistant" to strategic voting in practice. So we mark this as a nice-to-have but we know we can't fully achieve it.

  5. **Decisiveness:** Non-negotiable.

  6. **Novel Requirements:**
     - (a) **Robustness to ballot errors:** Non-negotiable for practical reasons.
     - (b) **Consistency under shortlisting:** This might be too strong and conflict with other requirements. We might have to drop this. Let's mark it as nice-to-have for now, but note that it might be impossible to satisfy with others.
     - (c) **Indifference handling (partial ballots):** Non-negotiable for voter convenience.
     - (d) **Explainability:** Non-negotiable for transparency.

  Now, the requirement that does the most work in ruling out rules: **Independence of Irrelevant Alternatives (IIA)** (which is related to your requirement 1 and 6b). If we insist on IIA, then by Arrow we can only have a dictatorship. But we don't want that. Therefore, we must relax IIA. 

