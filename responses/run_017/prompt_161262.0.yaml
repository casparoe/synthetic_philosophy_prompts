  Based on your requirements and constraints, here's a structured analysis. I'll be brutally honest: **no single rule satisfies all your requirements simultaneously** due to fundamental impossibilities in social choice theory (Arrow's theorem and Gibbard-Satterthwaite). However, a Condorcet method (specifically **Ranked Pairs** or **Schulze**) comes closest. Below, I break down the requirements, impossibilities, and rule evaluations.

  ---

  ### **1. Requirement Analysis & Classification**
  Your requirements are categorized as **non-negotiable** (essential for fairness) or **nice-to-have** (pragmatic but flexible). I've added context and conflicts.

  | Requirement                                                                                             | Non-Negotiable? | Case/Rationale                                                                                                                               | Conflict Notes                                                                                                |
  |---------------------------------------------------------------------------------------------------------|-----------------|----------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|
  | **1. Unanimity (if all rank X>Y, result respects this)**                                                | **Yes**         | Prevents spoilers/factional manipulation (e.g., similar candidates splitting votes). Violations cause distrust.                             | Implied by Pareto; violated by IRV/plurality in split-vote scenarios.                                         |
  | **2. Pareto Efficiency (if all prefer X>Y, Y can't win)**                                               | **Yes**         | Basic fairness; losing when universally preferred is unacceptable.                                                                          | Violated only by severely flawed rules (e.g., non-monotonic methods).                                         |
  | **3. Condorcet Loser (candidate losing all head-to-head matchups can't win)**                           | **Yes**         | Avoids electing broadly disliked candidates. Violations imply systemic failure.                                                              | Violated by Borda/Approval; satisfied by Condorcet methods.                                                   |
  | **4a. No Participation Failure (staying home doesn't help)**                                            | **Yes**         | Critical for voter turnout; if skipping votes improves outcomes, system is broken.                                                           | Violated by IRV in edge cases; Condorcet methods resist this better.                                          |
  | **4b. No Tactical Ranking (ranking favorite lower shouldn't help)**                                     | **Nice**        | Strategy-proofness is ideal, but **Gibbard-Satterthwaite makes this impossible** (see §2). Aim for "resistant" instead.                     | *All* ranked rules fail this strictly; relax to "minimal susceptibility".                                     |
  | **5. Decisiveness (always produces a winner/tiebreak)**                                                 | **Yes**         | Prevents gridlock; hand-countable tiebreaks ensure practicality.                                                                             | Satisfied by all common rules.                                                                                |
  | **6a. Robustness to 2% garbled ballots**                                                                | **Yes**         | Real-world ballots have errors; outcome shouldn't flip due to small noise or added irrelevant options.                                      | Violated by Borda (sensitive to incomplete ballots); Condorcet/IRV better.                                    |
  | **6b. Shortlist Consistency (top 3 rerun = full result)**                                               | **No**          | Desirable for efficiency, but **mathematically conflicts with Unanimity/IIA** (Arrow). Drop this or accept rare failures.                   | Violates Independence of Irrelevant Alternatives (IIA); incompatible with fairness in edge cases.             |
  | **6c. Partial Ballots (allow incomplete rankings)**                                                     | **Yes**         | Voters shouldn't be forced to rank options they dislike; reduces ballot errors.                                                             | Violated by IRV (requires full rankings); Condorcet/Approval handle this.                                     |
  | **6d. Explainability (simple reason why X>Y)**                                                          | **Nice**        | Transparency builds trust, but **Condorcet methods struggle here** (complex cycles). Prioritize auditability over simplicity.               | Best achieved by Approval ("most approvals"); worst in Condorcet cycles.                                      |

  #### Key Takeaways:
  - **6b and the spoiler effect are *not* the same**: 6b is about **procedural consistency** (re-running the rule), while spoilers relate to **Independence of Irrelevant Alternatives (IIA)**. Both touch on IIA, but 6b is a stricter, self-imposed constraint.
  - **Non-negotiable cluster**: Pareto + Unanimity + Condorcet Loser + Decisiveness + Robustness + Partial Ballots. **This is achievable** with Condorcet methods.
  - **Relax immediately**: 4b (tactical ranking) and 6b (shortlist consistency) are **impossible to fully satisfy** (§2 explains why).

  ---

  ### **2. Impossibility Theorems: Where You *Must* Compromise**
  #### **Arrow's Theorem** (staking money on this)
  - **Impossible cluster**: Unanimity (Req 1) + IIA (embedded in Req 1/spoiler resistance) + Non-Dictatorship + Complete Rankings.
  - **Conflict with your list**: Req 1 (Unanimity) and IIA (a core part of spoiler resistance) **cannot coexist** in any rule that produces a full ranking.  
    - **Solution**: Drop the need for full rankings (use a rule that outputs only a winner/shortlist). Condorcet methods avoid Arrow by not requiring a full societal ranking.

  #### **Gibbard-Satterthwaite Theorem** (staking money on this)
  - **Impossible cluster**: Strategy-proofness (Req 4b) + Unanimity (Req 1) + Non-Dictatorship + ≥3 candidates.
  - **Conflict with your list**: Req 4b (no tactical ranking) **cannot be satisfied** without a dictatorship.  
    - **Solution**: Drop 4b as a strict requirement. Aim for rules where tactical voting is rare/detectable (Condorcet methods resist it better than IRV/Borda).

  #### **The Brutal Trade-off**
  - **You must sacrifice either:**
    - (A) **Strategy-proofness (4b)** to keep fairness (Unanimity/Pareto), *or*
    - (B) **Spoiler resistance (part of 1)** to keep strategy-proofness.
  - **Recommendation**: Prioritize fairness (A). Spoilers cause more harm than tactical voting in practice (your faction-manipulation example).

  ---

  ### **3. Rule Scorecard**
  Evaluated against your non-negotiables (★ = satisfied, ✘ = violated). Confidence: **★** = theorem/evidence, **✓** = empirical consensus, **?** = context-dependent.

