prompt: |-
  I'm a teaching assistant for a graduate seminar on explanation in evolutionary biology, and next week we're doing the adaptationist programme and the Gould–Lewontin spandrels critique. I want a piece of mock-documentary satire to hand out alongside the readings: a parody of the compliance form that a fictional journal — call it the *Journal of Ultimate Design* — requires every submitted manuscript to file, a "Certification of Adaptation," submitted by a fictional lab (Brocklebank Institute for Ultimate Causation) in support of a paper arguing that the near-universal human disposition to press the "door close" button in an elevator — including in elevators where the button is disconnected, which is most of them — is an adaptation produced by a dedicated closure-response module, shaped in the ancestral environment by the fitness value of rapidly sealing an enclosure against predators, cold, and intruders. Roughly 700–900 words, laid out as a numbered form: a manuscript header block, eight or nine numbered certification items the authors must swear to, and a closing line recording the editorial decision.

  The jokes have to come from getting the methodology right rather than from inventing absurdities, so exaggerate real features of adaptationist practice, don't fabricate new ones: the atomization of a trait into sub-traits until a function can be found for one of them (and then speaking of the whole as a "trait complex"); the argument from costliness or "special design"; reverse-engineering an ancestral function and then treating the elevator as a supernormal stimulus exploiting a mismatch with the ancestral environment; a small optimality model with a cost-benefit curve that is fitted rather than derived; a comparative prediction from a single outgroup; and the ritual dismissal of the byproduct and developmental-constraint alternatives as untestable, unfalsifiable, or a mere redescription of the phenomenon to be explained. In the same spirit, give the form a quantitative confidence device — a "Design Confidence Score" obtained by multiplying the authors' own ratings for costliness, specificity of design, cross-cultural universality, and so on, with a pass threshold, and a clause permitting authors whose score falls short to subdivide the trait and resubmit. The authors should be competent and deadpan throughout: everything they sign should be something a real, good adaptationist could write with a straight face, because the reductio depends on their competence — a reader should feel that a practitioner following the form faithfully could certify almost anything, without the text ever saying so.

  Two further constraints. First, include at least two bracketed interventions from the journal's in-house spandrel skeptic interleaved with the items; at least one must be a genuinely strong objection (that the behavior is best explained as a byproduct of a general-purpose causal-contact or goal-completion system plus a modern artifact, with no selection history of its own), and the authors' answer to it should be recognizable, on reflection, as not answering it at all. Second, never name Gould or Lewontin or any living researcher — have the authors refer to their critics only obliquely, as the San Marco school or the Pangloss-skeptics — and don't let anyone break character to signal that this is a joke. No citations or bibliography are needed; the piece should be legible and funny to a newcomer who has only half-remembered the debate, while making someone who actually knows the literature wince in recognition.
reasoning: |-
  Okay, the user is a teaching assistant preparing for a graduate seminar on the adaptationist program and the Gould-Lewontin critique. They want a satirical mock "Certification of Adaptation" form for a fictional journal, parodying how adaptationists might justify a trivial human behavior (pressing disconnected elevator buttons) as an evolved adaptation. 

  Hmm, the challenge is balancing academic rigor with humor. The satire must feel authentic—exaggerating real methodological flaws without inventing absurdities. Key targets include: trait atomization, reverse-engineering ancestral functions, dismissive handling of alternatives, and quantitative overconfidence via a "Design Confidence Score."

  The user’s constraints are precise: 
  - Must include two bracketed skeptic interventions (one genuinely strong objection about the behavior being a byproduct of general cognition). 
  - Authors’ rebuttal should subtly fail to address the core critique. 
  - Avoid naming Gould/Lewontin or living researchers; use oblique references like "San Marco school." 
  - Maintain deadpan delivery—no winking at the audience.

  *Brainstorming the structure*: 
  The form should mirror real submission templates. Start with manuscript header fields (journal name, title dripping with adaptationist jargon). Then 8-9 certification items: 
  1. Trait decomposition into "closure-seeking module" 
  2. Reverse-engineering ancestral threats (predators/cold) 
  3. Optimality model with fudged cost-benefit curve 
  4. Single outgroup comparison (bonobos?) 
  5. Dismissal of alternatives as "untestable" 
  6. Confidence score calculation (universality! costliness! specificity!) 
  7. Threshold clause allowing trait subdivision 
  8. Signature block 

  For the skeptic’s strong objection: Have them argue the behavior is a byproduct of general causal reasoning + modern interfaces. Authors "refute" this by... citing universality and cost, which misses the point entirely. Classic adaptationist sleight-of-hand!

  *Nailing the tone*: 
  The Brocklebank Institute researchers must sound like competent scientists earnestly following methodology. Their confidence score multipliers (e.g., "universality × 7") should feel plausibly quantitative yet arbitrary. Closing with "Certified as Adaptive" stamps the bureaucratic absurdity.

  *Inside jokes for experts*: 
  - "Pangloss-skeptics" reference 
  - Optimality model where benefits exceed costs "by several orders of magnitude" (real grad-school trauma) 
  - Trait subdivision loophole mocking how any failure can be redefined as success

  This should make newcomers chuckle while veterans recoil at the painful accuracy. Final check: All critiques are methodologically sound exaggerations, no strawmen. The elevator button shall be enshrined as evolution’s masterpiece!
answer: |-
  ## CERTIFICATION OF ADAPTATION  
  *Journal of Ultimate Design (JUD)*  
  Manuscript ID: JUD-2024-007  
  Title: **Phylogenetic Inertia and the Operant Closure Module: The 'Door Close' Button Press as an Adaptation for Ancestral Enclosure Security in *Homo sapiens***  
  Corresponding Author: Dr. A. Thorne, Brocklebank Institute for Ultimate Causation  
  Certifying Lab: Brocklebank Institute for Ultimate Causation (BIUC), Dept. of Behavioral Selection Pressures  

  **Authors hereby certify compliance with JUD Publication Standard 4.2 (Adaptive Trait Verification) by affirming the following:**

  1.  **Trait Complex Identification & Decomposition:**  
      The behavior under study ("Door Close Button Press", DCBP) is not a unitary trait but a component of the broader "Operant Closure Seeking Trait Complex" (OCSTC). The OCSTC includes sub-traits: visual targeting of portal-control interfaces, rapid distal digit extension, force application to perceived barrier-control surfaces, and anticipatory tension release upon perceived barrier movement. *This paper focuses exclusively on the adaptive significance of the DCBP sub-trait within the OCSTC.*

  2.  **Ancestral Environment Reconstruction:**  
      The DCBP sub-trait evolved in response to critical selective pressures in the Pleistocene savanna-mosaic/woodland environment. Recurrent threats demanding rapid enclosure sealing included:  
      *   2a. **Predator Incursion Risk:** Delayed cave/refuge sealing increased predation probability (e.g., *Panthera spp.*, hyenids).  
      *   2b. **Thermal Stress Mitigation:** Rapid closure minimized heat loss in cold nocturnal environments/unseasonable storms.  
      *   2c. **Resource/Intruder Defense:** Sealing protected gathered resources, offspring, and mates from conspecific raiding parties.  
      *The modern elevator vestibule is a novel environment presenting a supernormal stimulus (highly salient button, instantaneous perceived action potential) perfectly matching the input conditions of the evolved DCBP module.*

  3.  **Costliness & Specificity of Design Argument:**  
      The DCBP sub-trait exhibits costly, specific design incompatible with a non-adaptive origin:  
      *   3a. **Energetic Cost:** Repetitive, goal-directed motor action consumes calories above basal metabolic rate. Persistence despite futility (see point 7) indicates strong selective maintenance.  
      *   3b. **Cognitive Specificity:** Rapid targeting and execution amidst complex visual fields (e.g., other buttons, advertisements) implies a dedicated perceptual module for "closure-affording interfaces."  
      *   3c. **Temporal Precision:** Latency between door-open state and button press initiation (mean observed: 1.2s ±0.3s) aligns with predator/opportunist approach speeds, suggesting fine-tuned adaptive responsiveness.

  4.  **Optimality Modeling:**  
      A cost-benefit model demonstrates the adaptive peak of DCBP:  
      *   **Benefit (B):** Survival probability increase from sealing (scaled to ancestral threat severity/frequency).  
      *   **Cost (C):** Caloric expenditure + opportunity cost of foregone alternative actions.  
      *   **Net Utility (U):** U = B - C.  
      *Empirical observation confirms U > 0 across diverse modern contexts, exceeding the threshold by several orders of magnitude, confirming adaptation.* (See Fig. 1: *Fitted* cost-benefit curve based on ethnographic threat reports and metabolic measurements).

  5.  **Comparative Phylogenetic Prediction:**  
      Prediction: Species lacking ancestral pressure for rapid refuge sealing should exhibit no DCBP-like behavior.  
      Test: Observation of *Pan paniscus* (bonobo) in captive settings with simulated door mechanisms.  
      Result: Bonobos exhibited random button pressing with no preference for "close" symbols or temporal association with portal state (*p* < 0.01).  
      Conclusion: Supports *Homo sapiens*-specific adaptation of DCBP within the OCSTC. *[JUD Spandrel Auditor Note: *Pan paniscus* is an arboreal frugivore with minimal selective pressure for terrestrial refuge sealing. Doesn't this merely confirm the trait's *absence* where selection pressure is absent, not its *adaptive origin* where it's present?]*  
      *Author Response:* The successful falsification of the prediction in a closely related outgroup lacking the proposed selective pressure robustly confirms the adaptationist hypothesis within the *Homo* lineage. Comparative method requirements are satisfied.

  6.  **Cross-Cultural Universality:**  
      DCBP is observed at high frequency (>92% of opportunities) across diverse sampled populations (BIUC Field Stations: Tokyo, Oslo, Mumbai, Buenos Aires, Lagos). Minor variations in button symbology or placement cause no significant reduction in behavior execution, demonstrating canalization – a hallmark of an evolved adaptation buffered against environmental noise.

  7.  **Dismissal of Non-Adaptive Hypotheses:**  
      Alternative explanations for DCBP are methodologically deficient:  
      *   7a. **Byproduct Hypothesis (General Causal Contact/Goal-Completion):** Posits DCBP is a side-effect of a domain-general learning system reinforced by occasional button functionality. This is unfalsifiable. Any behavior can be dismissed as a "byproduct" of vague, overarching mechanisms. It fails to explain the *specificity, universality, and costliness* (points 3 & 6) of DCBP. *[JUD Spandrel Auditor Note: Isn't this the *strongest* alternative? Modern elevators train causal contact via functional buttons (floor selection). The "close" button, even if disconnected, occupies the same perceptual/causal niche. The ancestral environment lacked buttons entirely. Couldn't DCBP be a *modern* byproduct of general learning applied to a novel artifact, requiring no dedicated Pleistocene module?]*  
      *Author Response:* The byproduct hypothesis ignores the exquisite fit between DCBP and Pleistocene pressures (point 2). The universality and immediate, unlearned manifestation of the behavior in children encountering elevators for the first time (BIUC Crèche Study #45) refute a purely operant/modern artifact origin. Domain-general systems cannot account for the *specificity* of the action targeting closure.  
      *   7b. **Developmental Constraint Hypothesis:** Suggests DCBP arises from biomechanical or cognitive constraints. This is a redescription, not an explanation. It fails to address *why* this specific constraint manifests as *this* functional behavior under *these* conditions. It is untestable and offers no predictive power.

  8.  **Design Confidence Score (DCS) Calculation:**  
      Authors assign the following ratings (Scale: 1-10, 10 = Maximum Confidence) and calculate DCS:
      *   Costliness (Point 3a): 8
      *   Specificity of Design (Point 3b,c): 9
      *   Cross-Cultural Universality (Point 6): 10
      *   Fit to Ancestral Model (Point 2): 9
      *   Failure of Alternatives (Point 7): 10
      *   **DCS = (8 * 9 * 10 * 9 * 10) / 1000 = 64.8**  
      *[Rationale: Multiplicative model captures joint probability; division by 1000 scales to ~0-100 range. Threshold for Certification: DCS >= 50].*

  9.  **Trait Subdivision Clause:**  
      Should the DCS fall below the threshold of 50, authors reserve the right to further decompose the DCBP sub-trait (e.g., isolating "Symbol-Agnostic Vertical Surface Depression Force Application" or "Post-Portal-State-Change Motor Initiation Latency") and recertify the newly defined sub-trait possessing the highest DCS relative to a refined ancestral model.

  **Certification:** We, the undersigned, attest that the manuscript titled above presents a trait certified as an adaptation under JUD Standard 4.2, based on the fulfillment of the criteria above and a DCS of 64.8 (>50).  
  *Signed:*  
  Dr. A. Thorne, Dr. L. Vance, Prof. E. Brocklebank (Emeritus)  
  Brocklebank Institute for Ultimate Causation

