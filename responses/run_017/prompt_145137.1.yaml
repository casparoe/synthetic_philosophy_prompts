prompt: |-
  Hey, I’ve been lurking rationalist blogs since the old SSC days and I finaly decided to ask something instead of just argueing in the comments. I’ve been re-reading bits of William James’s 1890 Principles of Psychology, specifically the chapter on the perception of time, and I’m stuck on what he’s really committed to. I don’t have the text in front of me in quotable form and I’m not going to fake a verbatim quote from memory, so here’s a close paraphrase of the passage I mean (no quote marks, just my rough rendering): James says the present moment we actually experience is not a razor-thin mathematical instant; instead it is a kind of saddle-shaped stretch with a little breadth of its own, so we are perched on a short duration that includes some of the just-past and some of the not-yet, and it is only within that thick present that we perceive succession, earlier and later, at all. He seems to say the rearward part of this stretch is continually slipping out of immediate consciousness while a new forward edge is added, and that this specious present is the prototype from which we build our idea of time. I’m not totally sure I’ve got the paraphrase right, but its the gist Im working from.

  Help me understand two things. First, what exactly is James claiming about the specious present in that bit? I’m particularly unsure whether he thinks the just-past is literally still perceived, or whether it is already memory by the time we notice it. Second, how does this 1890 picture connect to the modern color phi phenomenon and the Orwellian vs Stalinesque distinction about the timing of experience? Just to make sure we’re on the same page without anyone needing to search: color phi is the apparent-motion setup where a dot appears at one location, then a differently colored dot appears at a second location, and subjects report seeing the first dot change color somewhere in between, even though nothing of that intermediate color was ever shown. The philosophical question is whether the subject’s conscious experience is rewritten after the fact (the Orwellian story: experience was one way, then memory is edited) or whether the brain delays consciousness and presents a pre-edited experience in which the change already appears (the Stalinesque story: history is rewritten before the show trial, so to speak). My confusion is this: James’s thick present seems to offer a third option, where the color change is just in the specious present as part of the perceived succession, with no sub-personal editing outside consciousness either before or after. Call this thick-now chauvinism: the view that a proper account of temporal experience has to locate the succession within a thick present rather than posit unconscious revision outside it. But maybe I’m reading James anachronistically, or maybe the slipping rearward edge actually makes him an Orwellian or a Stalinesque theorist in disguise, and my third option is just confusion.

  So: help me understand the passage and how it bears on the color phi / revision distinction. Is thick-now chauvinism a fair reading of James’s specious present, or is it a modern gloss he would reject? Does the saddle-back give us a way out of the Orwellian/Stalinesque dilemma, or does it just relocate the puzzle? Also, please say how confident you are in the reading you’re giving me, and single out the one point you’re least sure about (I’d rather have calibrated uncertainty than a smooth story).
