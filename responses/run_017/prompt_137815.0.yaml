prompt: |-
  I want to think through a practice that has always struck me as philosophically strange, and I would like you to reconstruct what it presupposes about meaning.

  The practice is statutory interpretation as it is actually done in common-law courts. As I understand it (correct me if I have the practice wrong, but I don't want the answer to turn on contested legal detail): when a dispute turns on what a statutory word means, courts apply something like a plain-meaning rule. Absent a statutory definition, ordinary words get their ordinary meaning, technical terms get their technical meaning, and judges routinely consult dictionaries and corpus evidence of ordinary usage, and other statutes, to establish it. Statutes frequently contain definitions sections, in which a term is defined by other terms of the statute, which are sometimes themselves defined further along. The meaning is treated as fixed at the time of enactment rather than as tracking later changes in usage. Where the term is a term of art, courts defer to the specialized community that uses it rather than to the general reader's sense of the word. And the ordinary-meaning inquiry is explicitly relativized to a readership: the meaning that competent speakers within the statute's intended audience would have taken the text to have. Finally, the whole apparatus has an escape hatch: a reading is abandoned, even when the words are clear, if it would produce absurd or cruel results.

  Here is what puzzles me. The practice looks, on its face, like an attempt to fix meaning entirely by symbol-to-symbol relations — a statute defining its terms by its other terms, judges consulting a book that defines words by other words, the inquiry stopping at the walls of the legal corpus. But the canonical illustration of the symbol grounding problem is precisely that a dictionary cannot do this: someone who did not already understand the language would cycle endlessly from one uninterpreted definition to another without ever touching anything nonsymbolic. So I want the implicit theory made explicit, and I want it made explicit in both directions.

  First, reconstruct it. What account of meaning does this practice only make sense under? Notice that the practice does not claim the statutory text is self-interpreting in the way a formal system is; it says the text means what a specified population of already-competent readers would have understood it to mean. That is not grounding in the demanding nonsymbolic sense — it looks more like a deliberate parasitism on meanings already in speakers' heads, with the legal system outsourcing grounding to the linguistically competent community and helping itself to the results. Is that the right way to describe it? And is it coherent, or does the outsourcing leave a hole exactly where hard cases live?

  Second, I want you to work with a distinction I have been using and tell me whether it survives. Call *anchoring* the fixation of which thing or which set of items a term picks out — by stipulation, by a definition, by a precedent that settles one concrete application — and call *grounding* the possession of a nonsymbolic capacity to identify further instances on one's own. My sense is that legal practice is very good at anchoring and indifferent to grounding: a definitions section anchors by fiat, and a line of precedents accumulates anchored exemplars. But does a sufficiently dense set of anchored exemplars *converge* on grounding, the way a large enough labeled sample can leave you with a capacity you could not have stated as a rule? Or does exemplar-anchoring merely postpone the question, since each new application still requires someone who can already tell whether the new case is like the old ones? Say which, and say what it would take to tell the difference.

  Third, the part I think is genuinely hard. Many of the terms statutes fight over are not the names of perceptible natural kinds whose grounding is the paradigm case; they are institutional or normative terms, whose content seems to be fixed by their role in a system of rules rather than by anyone's sensorimotor discrimination. If that is right, then the grounding demand may simply misfire for most of legal language, and the practice may be philosophically fine. But institutional terms typically piggyback on ordinary terms that do look grounded — the chestnut about whether a bicycle, or an e-scooter, or a toy car is a "vehicle" under a rule banning vehicles from a park is a dispute of exactly this shape. So: for which statutory terms does the grounding problem genuinely arise, for which is it a pseudo-problem, and is the boundary itself something the practice can mark, or only something we can mark from outside it? I would also like your view on what the absurdity escape hatch is doing: is it an admission that the symbol-to-symbol machinery has run off the end of the community's anchoring, or is it a separate normative principle with nothing to do with meaning?

  Finally, the replacement question. Suppose we dropped the implicit theory and required instead that statutory meaning be answerable to the nonsymbolic, experienced capacities of those who apply it, and not merely borrowed from a readership's prior understanding. Which devices of current practice would then become illegitimate or pointless — definitions sections, dictionaries, fixation of meaning at enactment, textualism itself? What would take their place, and what would we lose? I have a particular worry I want addressed: grounding, on the standard account, is a property of agents with sensorimotor histories, not of texts, and different interpreters are grounded differently. Does taking grounding seriously therefore trade the law's aspiration to a single public meaning for something irreducibly interpreter-relative, and is that a cost the practice could bear?

  Please be disciplined about the difference between what the practice strictly presupposes, what it merely sits well with, and what several rival theories of meaning would license equally — I suspect the practice is more underdetermined than it looks, and I would rather hear that than a tidy reconstruction. Where the symbol grounding literature has nothing to say about a question I have asked, say so rather than stretching it. I don't need citations, bibliographies, or a reading list; I know the standard sources, and I'm interested in the argument.
reasoning: |-
  Okay, the user is diving deep into statutory interpretation and its philosophical underpinnings, especially regarding meaning and the symbol grounding problem. They're clearly well-versed in legal theory and philosophy of language, so I need to meet them at their level without oversimplifying.

  First, I should reconstruct the implicit theory behind legal practice. The courts rely on a specified readership's understanding at enactment time, which means they're outsourcing meaning to the linguistic community. This isn't full grounding in the philosophical sense—it's more like anchoring through social consensus. The user's distinction between anchoring (fixing reference) and grounding (nonsymbolic capacity) is crucial here. Legal practice excels at anchoring via definitions, dictionaries, and precedents but seems indifferent to grounding. 

  The user's third point about institutional terms is thorny. Terms like "vehicle" in park regulations show how ordinary anchored terms can blur into grounding questions. But for purely institutional terms (like "emolument" or "due process"), grounding might be a category error since their meaning is systemic. The absurdity escape hatch probably isn't about meaning failure but about avoiding outcomes that would violate the system's implicit norms—more normative than semantic.

  Replacing the current approach with direct grounding requirements would be messy. Grounding is interpreter-relative, tied to individual sensorimotor histories, which clashes with law's need for public meaning. Definitions sections and dictionaries would lose authority, and fixation at enactment might not make sense. The trade-off would be interpretive flexibility at the cost of predictability and uniformity.

  The user suspects the practice is underdetermined, and they're right. Competing theories of meaning could justify the same outcomes. The key is recognizing that legal interpretation is a specialized practice optimized for stability and constraint, not a perfect philosophical solution to symbol grounding. 

  I should emphasize that the escape hatch isn't an admission of grounding failure but a safety valve for when anchored meanings produce normatively intolerable results. And while dense precedent might approximate grounding by building recognitional capacity, it's still anchored—it doesn't solve the core philosophical problem but works pragmatically for law's purposes.
answer: |-
  Here's a disciplined reconstruction of the implicit theory underlying statutory interpretation, engaging your anchoring/grounding distinction and the hard cases:

  ### Reconstructing the Implicit Theory
  1.  **Meaning as Public, Conventional, and Timestamped:** The practice presupposes that meaning is an objective, intersubjective fact established by *shared linguistic conventions among a specific community* (competent speakers in the intended audience) *at a specific time* (enactment). This is neither pure formalism nor radical subjectivism. It's a deliberate **semantic parasitism** on the pre-existing, socially grounded linguistic competence of the enacting community. The system outsources grounding to that community's collective, historically situated understanding.
      *   **Coherence:** This is coherent *for the system's purposes*. It provides a stable, publicly accessible anchor point. It avoids the regress by presupposing the community's competence as a brute fact, not by solving grounding internally. The "hole" in hard cases arises precisely because the community's shared understanding *at enactment* runs out – the term's conventional boundaries are fuzzy or contested for the novel case. The practice doesn't presuppose meaning is always determinate; it presupposes a method for finding the *best available public anchor*.

  2.  **Anchoring vs. Grounding in Practice:**
      *   **Anchoring Reigns Supreme:** You are correct. Definitions sections are explicit anchors by fiat. Dictionaries provide evidence of conventional anchors. Precedents establish anchored exemplars. Fixation at enactment freezes the relevant anchoring community and conventions.
      *   **Does Dense Anchoring Converge on Grounding?** **No, not in the philosophical sense.** A dense set of precedential anchors creates a *recognitional capacity within the legal system*. An experienced judge/lawyer develops a "feel" for whether a new case fits the pattern. However:
          *   This capacity is *still anchored* to the prior symbols (cases, rules, definitions). It's pattern-matching within the symbolic system, heavily influenced by institutional norms and analogical reasoning. It doesn't necessarily connect to the interpreter's *personal* sensorimotor grounding of the underlying concepts.
          *   It **postpones the question**. Each new application *does* require someone who can "tell whether the new case is like the old ones." That "telling" relies on:
              *   Understanding the *reasons* behind prior decisions (themselves symbolic).
              *   Applying shared legal/conceptual schemas (also symbolic).
              *   Conventional analogical reasoning techniques.
          *   **The Difference:** True grounding (philosophically) involves direct, non-symbolically mediated recognition (e.g., recognizing RED). The legal "recognitional capacity" is mediated by institutional history, training, and symbolic reasoning – it's a *secondary*, system-internal skill built *upon* the initial parasitism, not primary grounding. You'd know the difference if the judge's "feel" could be explained *entirely* by citing anchored precedents and analogies without invoking their personal sensorimotor experience of "vehicle-ness" – which is the norm.

  3.  **The Hard Cases: Institutional Terms and Grounding:**
      *   **Genuine Grounding Problem:** Arises primarily for **terms directly tied to observable reality** where the statute relies on ordinary perception for application ("vehicle," "dwelling," "injury," "daylight," "river"). Here, the legal system *depends* on the grounding possessed by the enacting community (and later interpreters) to connect the symbol to the world. The "vehicle in the park" problem is paradigmatic – the dispute exposes the boundary where conventional anchoring (dictionary definition, prior exemplars like cars) fails to dictate the application to a novel artifact. Grounding is needed but unavailable in a decisive public form.
      *   **Pseudo-Problem:** For **purely institutional/status terms** ("corporation," "felony," "emolument," "due process," "copyright holder"), meaning *is* constituted by their role within the legal system itself. Their "grounding" *is* their systemic role and relations to other anchored symbols. Demanding sensorimotor grounding misfires. Their content is fixed by anchoring (definitions, rules, precedents).
      *   **The Boundary:** The practice *can* mark the boundary **operationally**, not theoretically. Courts intuitively differentiate:
          *   Cases where evidence of ordinary usage, context, purpose, or precedent provides a clear answer (anchored).
          *   Cases where the dispute hinges on the applicability of an observable concept to a novel instance, leading to arguments about purpose, consequences, and analogies – signaling the grounding-dependent edge.
      *   **The Absurdity Escape Hatch:** This is **primarily a normative principle**, not an admission of semantic failure. It presupposes that:
          1.  The conventional meaning *is* clear (anchored).
          2.  Applying that clear meaning leads to a result so contrary to the perceived fundamental purpose of the statute (or justice/morality) that it *must* be overridden.
          It's a safety valve against *overly literal* application of anchored meaning when it produces outcomes wildly dissonant with the system's implicit normative foundations. It admits the *rule* has an anchor, but insists the *system* has deeper principles. It's about the limits of rule application, not necessarily the limits of the meaning anchor itself.

  ### Replacing the Theory: Consequences
  Dropping the "parasitism on prior community understanding" and requiring meaning to be answerable to the *interpreter's own* nonsymbolic, experienced capacities would fundamentally alter the practice:

  1.  **Illegitimate/Pointless Devices:**
      *   **Dictionaries:** Become largely irrelevant, as they record convention, not the interpreter's personal grounding.
      *   **Fixation at Enactment:** Loses its core rationale. Why privilege a past community's grounding if meaning hinges on the present interpreter's capacities?
      *   **Textualism (as usually understood):** Collapses. The text's public, historical meaning is no longer the object.
      *   **Definitions Sections:** Might retain some role as internal anchors *within* the system, but their authority over the interpreter's personal grounding would be diminished. They become starting points, not binding fiat.
      *   **Precedent (as binding authority on meaning):** Severely weakened. If meaning depends on the current interpreter's grounding, why defer to a past judge's (differently grounded?) application?

  2.  **What Would Take Their Place:**
      *   **Interpreter's Testimony/Reasoning:** Judges would need to articulate their own experiential grounding for terms. ("Based on my understanding of 'vehicle' derived from experience X, Y, Z, an e-scooter is/isn't one.").
      *   **Expert Testimony on Grounding:** Psychologists, cognitive scientists testifying about typical human grounding of concepts.
      *   **Pragmatic/Purposive Reasoning:** Dominant, as interpreters rely more heavily on perceived statute purpose and consequences, mediated by *their* grounded understanding of the goals.
      *   **Radical Contextualism:** Meaning becomes highly context-dependent on the specific interpreter and situation.

  3.  **Your Worry: Interpreter-Relativity & Loss of Public Meaning:**
      *   **This is the fundamental cost.** Grounding *is* agent-relative. Different interpreters have different sensorimotor histories, conceptual schemas, and recognitional capacities. Statutory meaning would become fragmented, unstable, and unpredictable. The law's aspiration to a single, public, knowable-in-advance standard ("What does this statute *mean*?") would be sacrificed for meaning-as-applied-by-this-judge-now.
      *   **Cost:** This undermines core rule-of-law values: predictability, consistency, equality before the law, constraint on official power, and democratic legitimacy (if meaning drifts from the text understood by the enacting legislature). Disputes would increasingly focus on the *interpreter's* qualifications and biases rather than the public text.
      *   **Could the Practice Bear It?** Arguably not, without ceasing to be "law" as understood for predictability and constraint. It would resemble arbitration or equity more than a system of rules. The current practice's stability and constraint rely heavily on the fiction (or functional presupposition) of a discoverable public meaning.

  ### Underdetermination and Rival Theories
  Your suspicion is correct. The practice is **highly underdetermined** philosophically. It *sits well* with:
  *   **Moderate Conventionalism:** Meaning is fixed by shared linguistic conventions at a time.
  *   **Moderate Originalism:** Meaning is fixed at enactment by original understanding.
  *   **Certain forms of Semantic Externalism:** Meaning depends on the community/environment at the time.

  It is *compatible* with (though less naturally aligned with):
  *   **Some versions of Pragmatism:** Purpose/consequences matter, but only *after* establishing conventional meaning or via the absurdity doctrine.
  *   **Minimalist Semantics:** The text provides a minimal proposition, filled in by context (though fixation at enactment constrains context).

  It **clashes** with:
  *   **Radical Subjectivism/Expressivism:** Meaning is purely in the interpreter's mind.
  *   **Strong Dynamic Interpretation:** Meaning evolves continuously with usage.
  *   **Theories denying stable conventions:** (e.g., certain deconstructionist views).
  *   **The grounding-demanding view you propose.**

  **Symbol Grounding Literature's Limits:** This literature brilliantly exposes the problem of connecting symbols to the world for AI/cognition. It has less to say about:
  *   The *social* dimension of meaning as convention.
  *   The nature and function of *institutional* concepts.
  *   How complex systems like law *functionally manage* the grounding problem through anchoring, delegation to community competence, and normative overrides, without solving the deep philosophy.
  *   The specific trade-offs between stability/constraint and flexibility/accuracy in legal interpretation.

  The practice is a sophisticated, evolved mechanism for managing semantic uncertainty within a system prioritizing stability, constraint, and public accessibility. It outsources grounding pragmatically, relies heavily on anchoring, and employs normative overrides when anchoring leads to systemic breakdown. It doesn't solve the symbol grounding problem; it finds a functional workaround that serves law's distinctive purposes, even if philosophically messy.
