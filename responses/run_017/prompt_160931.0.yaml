answer: |-
  *(Racz sets down his chipped mug of lukewarm tea, the steam long gone. He leans back in the creaking staff room chair, his eyes sharp but weary, like a librarian scanning a familiar, dense index. He doesn't look at the archivist directly at first, instead tracing a faint watermark on the Formica tabletop with a blunt fingertip. When he speaks, it’s quiet, precise, almost conversational, but with the weight of settled conviction.)*

  Ah, the 'third time'. An excellent place to start, precisely because it seems so ready-made for your subsumption. But let me tell you about Parole Board Matter 91-447, a case that haunts me, perhaps because it so neatly refuses the pattern you’d drape over it. A man, call him Evans, convicted thrice for passing bad cheques – small sums, desperation, not malice. The third offence came ten years after the second, following the collapse of his business and his wife’s terminal illness. Now, the Board’s guidelines, their cherished 'principle', stated that recidivism, especially a *third* offence, demonstrated incorrigibility, a pattern of disregard. A clear token, yes? But was it? Was that third cheque, written in the bleak waiting room of the hospice, truly *of a piece* with the youthful follies twenty years prior? Or did the very repetition, in *that* context, become a cry of helplessness, a measure of his breaking point, rather than his character? The pattern was there, undeniable. But its *meaning* as a reason to deny parole? That depended entirely on the texture of his life *around* those three points. The ‘third time’ wasn’t a fixed weight; its salience, its force as a reason *against* him, depended utterly on *why* it was the third time. The pattern didn't judge him; we judged the pattern’s place in his particular wreckage. We let him out. He never reoffended. The 'principle' of recidivism didn't justify the decision; understanding *Evans* did. The repetition was a fact; its moral weight was not dictated by the fact of recurrence alone.

  *(He pauses, picks up the mug, peers into its dregs as if reading tea leaves, then sets it down decisively.)*

  You speak of 'salience' as if it were a smuggled principle. But salience isn't dictated *by* the rule; it’s what *precedes* any useful rule, and often renders it obsolete. Think of spotting a forgery, my dear – your trade. You don't consult a list: 'Principle 7: Ink saturation variance exceeding 0.5% indicates fraud.' Nonsense. You look at the *document*. The tremor in a flourish, the subtle wrongness of the paper grain under the light, the clash with the surrounding hand. These features *become* salient because they jar against the *particular* context of *this* letter, signed by *this* person at *this* time. Your skill isn't applying a rule defining 'jarringness'; it's perceiving the jar *here*. You see resemblance to other forgeries you've handled, yes, but the resemblance is in the *gestalt*, the feel of wrongness in *this* instance, not because Feature A and Feature B always mean forgery. If they did, the clever forger would simply avoid A and B. But they can't avoid the *particular* wrongness that emerges only in the whole. Your 'pattern' recognition is precisely *not* subsumption; it's the trained eye seeing *this* case as akin to *that* one in its unique, context-bound dissonance. You don't judge by the pattern; the pattern *is* the perceived resemblance in judgment.

  *(He leans forward slightly, his voice gaining a fraction more edge, though still unhurried.)*

  And the novelist? Henry James, Chekhov – *they* are my allies, not yours. Does James subsume Isabel Archer under 'Victorian Heiress Betrayed'? Or does he justify her choices, her suffering, by saturating us in the *particular* pressures of *her* world, *her* relationships, *her* moment-by-moment perceptions? We understand why she returns to Osmond not by slotting her into a category, but by feeling the accumulated weight of *her* promises, *her* pride, *her* disillusionment, laid bare in thousands of tiny, concrete observations. The 'pattern' of tragic return emerges *from* the particularity, not the other way around. A novelist who merely slapped labels on types – 'The Relapser', 'The Prodigal' – *that* hack would indeed not get through a page worth reading. True fiction, like true judgment, traffics in the reasons embedded *within* the unique configuration, reasons that resonate because we recognize their *kinship* with reasons we've seen before, not because they fit a pre-cut slot. The difference you ask for? Moral understanding isn't *like* the understanding fiction gives us; it *is* that kind of understanding. It’s the deep attention to the singular case that reveals the reasons at play – reasons whose force we grasp because we've seen *similar* forces at work in *other* singular cases. The generalization 'promises should be kept' is true, profoundly true. But it didn't tell Isabel Archer what to do. Only *her* situation, understood in its dense particularity, could do that. Just as only *Evans'* situation told us that third cheque wasn't a mark of incorrigibility, but of a man drowning. The generalization illuminates nothing until the particular case shows *how* it applies, *if* it applies, and *what else* applies alongside it. The work, the *justifying* work, is always done down here, in the grit of the case. The rest is… filing.
