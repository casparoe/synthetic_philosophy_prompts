prompt: |-
  I'm a high school student working on a project about moral revolutions, and I need you to construct a thought experiment to specifications. Please use a made-up school tradition I will call the Last Period Walk: if one student publicly accuses another of cheating or betrayal, the accused must meet the accuser alone after the last period for a ritualized fight, and refusing means social exile; the tradition is costly and dangerous but widely seen as the honorable way to settle a grievance. Build a realistic one-paragraph scenario in which this tradition collapses mainly through a shift in what students regard as honorable, as in Appiah's honor-based explanation of moral revolutions, while both the Williams thesis that moral argument by itself does not overturn an entrenched norm and a simple interest-based story that norms persist or collapse because of material payoffs predict the tradition would continue. Constraints: the setting should be ordinary, like a high school, a sports team, or a town club, not a fantasy world or a battlefield; the collapse must not be produced by a new adult rule, an economic shock, or a single charismatic speech; and it should fall out of a genuine change in the internal code of honor rather than the students suddenly becoming more altruistic or more rational. After the scenario, show the reasoning for each of the three explanations—moral argument, interests, and honor—say which structural feature makes the honor explanation peel off, and whether removing that feature collapses the case back into a standard argument or interest story. Finish by explaining what a defender of the argument-based or interest-based account would say to stop the case from counting, and note which feature of your scenario is doing the real work.
