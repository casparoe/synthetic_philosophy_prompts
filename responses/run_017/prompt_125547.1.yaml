  We are building a thought experiment about the collapse of a norm called the "Last Period Walk" (LPW) in a high school. The tradition: if a student publicly accuses another of cheating or betrayal, the accused must meet the accuser after the last period for a ritualized fight. Refusal leads to social exile. The tradition is costly and dangerous but seen as honorable.

  We want the collapse to occur mainly through a shift in what students regard as honorable (as per Appiah's honor-based moral revolutions). We also need to show that both the Williams thesis (moral argument alone doesn't overturn entrenched norms) and a simple interest-based story (norms persist due to material payoffs) would predict the tradition continues.

  Constraints:
  - Setting: ordinary (high school, sports team, town club) - we'll stick to high school.
  - Collapse not due to: new adult rule, economic shock, or single charismatic speech.
  - Collapse must come from a change in the internal code of honor, not because students become more altruistic or rational.

  Scenario (one paragraph):

  At Lincoln High, the Last Period Walk had endured for decades, a rite where accusations of cheating or betrayal were settled by a post-school fight. The tradition began to unravel when a group of students, including popular athletes and respected club leaders, started to quietly refuse participation after being accused. Instead of fighting, they openly admitted to the alleged transgression if true and apologized, or if false, presented evidence to the school community via social media. At first, they faced social exile, but their refusal was framed not as cowardice but as a principled stand against violence. Over time, as more students adopted this response, the social cost of refusing the LPW diminished. Simultaneously, a new narrative emerged: honor became associated not with physical confrontation but with accountability and non-violent resolution. The shift was gradual, fueled by a series of incidents where the old system led to severe injuries and academic setbacks, and the new approach proved more effective in restoring trust. Eventually, the LPW was seen as a barbaric relic, and the honor code transformed to value integrity and restorative justice.

  Reasoning for each explanation:

  1. Moral argument (Williams thesis): Moral arguments against the LPW (it's violent, dangerous, counterproductive) had been made for years by some students and even teachers, but they failed to change the norm. The tradition persisted because the arguments did not engage with the existing honor code; they were seen as irrelevant or weak by the students who valued the tradition's role in upholding personal honor. Thus, moral argument alone did not cause the collapse.

  2. Interest-based: Materially, the LPW was costly (injuries, suspensions) but it also had benefits: deterring false accusations and maintaining a stable social order. The interest-based story would predict the tradition would continue because the costs of defection (social exile) were high and the benefits of participation (preserving one's reputation and social standing) were significant. Even though the costs were high, the tradition provided a clear mechanism for settling disputes that avoided prolonged feuds. Thus, based on interests, the norm should have persisted.

  3. Honor-based (Appiah): The collapse occurred because the underlying notion of honor changed. Initially, honor was tied to physical courage and willingness to fight. The shift began when influential students redefined honor to include accountability, honesty, and non-violence. This redefinition was not driven by altruism (they were still protecting their own reputation) or by a sudden calculation of interests (the risks of social exile were still high at first). Instead, it was a change in what the community found admirable. The key structural feature that made the honor explanation "peel off" is the role of social leaders (athletes and club leaders) who, by their example, changed the meaning of honorable behavior. They did not argue against the norm on moral grounds but acted in a way that redefined the honor code.

  Structural feature: The involvement of high-status individuals (popular athletes and club leaders) who redefined honor through their actions. Without this feature, the case might collapse into a standard argument or interest story. If it were just a few low-status students refusing, they would have been exiled and the norm would have continued. If the shift were driven solely by an increase in costs (e.g., more injuries leading to rational avoidance), it would be an interest story. But here, the change in the honor code (what is seen as honorable) is the driving force.

  Defender of argument-based or interest-based account:

  - Argument-based defender: They might say that the moral arguments against the LPW were actually internalized by the students over time, and the actions of the influential students were just a way of making these arguments more persuasive. Thus, it was the moral argument that did the work, but through a slow process of persuasion.

  - Interest-based defender: They might argue that the shift was really due to an increase in the costs of the LPW (more injuries leading to more suspensions and academic problems) and a decrease in the costs of defection (as more students refused, social exile became less effective). Thus, the change in material payoffs (increased costs of participation and decreased costs of refusal) led to the collapse.

  What is doing the real work in the scenario? The key feature is the redefinition of honor by high-status individuals, which changed the social meaning of refusing the LPW from "cowardice" to "principled non-violence." This redefinition was not primarily driven by moral arguments or by a change in material interests (though those factors were present as background conditions) but by a shift in what the community admired and respected.

  Thus, the case illustrates Appiah's honor-based mechanism: moral revolutions occur when the honor code shifts, and this shift is often led by influential members of the community who change the meaning of actions within the existing framework of honor.
answer: |-
  ### Thought Experiment: The Collapse of the Last Period Walk at Westfield High

  At Westfield High, the Last Period Walk (LPW) had been a defining tradition for generations. Students saw it as the only honorable way to resolve accusations of cheating or betrayal, reinforcing social order through ritualized fights after last period. The shift began subtly when Jamie Chen, a respected debate team captain, was accused by a rival of sharing confidential team strategies. Instead of accepting the LPW challenge, Jamie publicly posted security footage proving the accusation false, then declared, "Honor isn’t in fists—it’s in truth." This sparked ridicule and temporary social exile, but soon other high-status students followed. Elena Rodriguez, star soccer player, refused an LPW after being falsely accused of cheating, opting for a mediated discussion with teachers and peers. As more students adopted this approach, the social cost of refusal plummeted. Honor became linked to transparency and dialogue, not violence. Within months, LPW invitations were met with laughter or indifference, and the tradition dissolved. This wasn’t due to new rules or altruism—students still fiercely guarded reputations—but because the community now saw non-violent accountability as braver than fighting.

  ### Reasoning for Each Explanation
  1. **Moral argument (Williams thesis)**: Moral critiques of the LPW (e.g., "violence is wrong") had existed for years but failed. Students dismissed them as naive, seeing honor as transcending ethics. Williams predicts this: abstract arguments don’t dislodge entrenched norms without a shift in underlying values. Here, arguments alone didn’t cause collapse—only after honor was redefined did moral reasoning gain traction.  
     
  2. **Interest-based story**: Material payoffs favored LPW’s persistence. Accusers benefited from public vindication; the accused avoided exile by fighting; and the norm deterred false accusations through high stakes. Even as injuries mounted, the costs of defiance (exile) outweighed risks of participation. A rational actor would thus uphold LPW, as alternatives like mediation seemed riskier to social standing.  

  3. **Honor-based explanation (Appiah)**: The collapse stemmed from a reconception of honor itself. Jamie and Elena’s actions—backed by their social capital—redefined "courage" from physical confrontation to public truth-seeking. This shifted the *internal code of honor*: refusing LPW became a mark of integrity, not cowardice. Crucially, this wasn’t altruism (students still protected self-interest) or new rationality (risks remained high initially). Instead, admiration pivoted to those who "fought with facts," making the old norm dishonorable.

  ### Structural Feature Peeling Off Honor Explanation
  The key feature is **high-status individuals redefining honor through visible, status-preserving actions**. Jamie and Elena used their influence (debate/sports clout) to frame refusal as *more honorable* than compliance, leveraging their platforms to shift peer admiration. Without this, the scenario collapses into standard explanations:  
  - If low-status students refused, they’d face exile, reinforcing LPW (interest story).  
  - If the shift lacked social capital, moral arguments alone would fail (Williams thesis).  

  ### Counterarguments from Critics  
  - **Argument-based defender**: "This is just moral argument in disguise! Jamie’s ‘truth’ framing is a clever repackaging of ethical reasoning, and peer influence merely amplified it. The real driver was the persuasive power of their logic, not honor."  
  - **Interest-based defender**: "The collapse reduced costs—once refusal gained traction, exile became impractical, making defiance ‘cheaper.’ Students simply followed the new low-risk path to protect social standing. It’s pure payoff calculation."  

  ### What’s Doing the Real Work  
  The **social capital of early defectors** is pivotal. High-status students absorbed initial exile costs, creating a "cascade" where their redefinition of honor became aspirational. This allowed the norm to flip without material changes or top-down rules. Critics miss that Jamie/Elena acted *within* the honor framework—elevating new virtues (truth, transparency) as superior to old ones (courage in violence)—which argument/interest models can’t fully capture. The real engine is the mutable nature of honor itself: when influencers redeploy its language, revolutions ignite.
