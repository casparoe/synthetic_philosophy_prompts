  Noticing their hidden pedagogical needs: Students keep collapsing textualism and originalism, so I'll decouple them explicitly. They also assume neither theory is falsifiable, so I'll build in "evidence against own view" sections. The "merely verbal" point suggests students waste energy on pseudo-disagreements—I'll flag that in the cruxes column.

  For structure: Starting with bedrock agreements makes sense—establishes common ground. The hypothetical statute is perfect because it's simple but has lurking ambiguities ("knowingly," "dangerous weapon," "school property"). The four test cases will force confrontation: 

  - The teacher's glove compartment knife tests "brings onto" vs. "possesses on" 
