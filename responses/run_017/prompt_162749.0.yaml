  Biggest challenge: Making both sides' positions authentically defensible. The textualist can't sound like a pedant; the purposivist can't sound unmoored. For the disagreements table, I'll let each side describe their method in their own terms—e.g., textualists won't say they "ignore purpose," they'll say purpose is constrained by text. 

  Ah, and that "text perfectly clear but legislators would disavow" case is gold. Purposivists will see it as proof of text's inadequacy; textualists as proof democratic process requires sticking to enacted words. I'll use the unloaded rifle example for this: clear textual violation but maybe not what legislators feared.

  For evidence against own view: Textualists struggle with absurd literal results; purposivists with judges imposing personal views. I'll cite the nail file—if "dangerous weapon" excludes it, textualism avoids absurdity; if purposivism stretches "school safety" too far, it overreaches.

  Final touch: Adding "predictions" for each test case forces both sides to apply their method, not just theorize. The shop teacher case is key—purposivists might carve exceptions textualists reject. That’ll show methodology in action.
answer: |-
  Here’s a joint statement designed for adversarial collaboration, with the fictional statute as an anchor and constraints addressed. Both sides can endorse the **Agreed Principles**, while the **Disagreements Table** and **Cruxes** frame conflicts constructively.  

  ---

  ### **Joint Statement: Textualism vs. Purposivism**  
  **Statutory Anchor**:  
  *"Any person who knowingly brings a dangerous weapon onto school property is guilty of a felony."*  

  #### **I. Agreed Principles**  
  1. **Judicial Role**: Courts interpret statutes, not rewrite them.  
  2. **Text Primacy**: The enacted text is the starting point for interpretation.  
  3. **Clarity Threshold**: If text is unambiguous, it controls absent constitutional defect.  
  4. **Legislative Supremacy**: Legislatures, not courts, make law.  
  5. **Avoiding Absurdity**: Genuinely absurd outcomes (e.g., prosecuting a parent for a toy plastic sword) may justify departure from text.  
  6. **Distinction from Originalism**: Textualism focuses on the *statutory text’s meaning*; originalism focuses on the *Constitution’s original meaning*.  
  7. **Textualism’s Anchor**: We define textualism as seeking the **ordinary meaning of the text at the time of enactment**.  

  #### **II. Disagreements Table**  
  | **Issue**                  | **Textualist Position**                                                                 | **Purposivist Position**                                                                 |  
  |----------------------------|-----------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|  
  | **Core Method**            | Meaning derives *exclusively* from the text’s words, syntax, and context at enactment. | Meaning derives from the statute’s *purpose*, with text as the primary but not sole guide. |  
  | **When Text "Runs Out"**   | Genuine ambiguity is rare; if text is clear, it binds regardless of outcomes.          | Purpose resolves ambiguities and corrects textual over-/under-inclusion where necessary. |  
  | **Defining "Purpose"**     | Purpose is inferred *only* from the text and traditional canons, not subjective intent. | Purpose is the *abstract goal* of the statute, informed by text, history, and problem addressed. |  
  | **Role of Legislator Intent** | Individual legislators’ expectations are irrelevant; only enacted text matters.       | Legislative history and expected applications illuminate the statute’s objective.        |  

  #### **III. Cruxes & Test Cases**  
  *(Using hypothetical cases under the statute)*  

  | **Crux**                                                                 | **Concrete Case**                                                                 | **Textualist Prediction**                                                                 | **Purposivist Prediction**                                                               | **Evidence Bearing on Crux**                                                                 |  
  |--------------------------------------------------------------------------|----------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|  
  | **1. Does "brings onto" imply active carriage, or include passive storage?** | *Teacher’s folding knife locked in glove compartment.*                          | Not guilty ("brings onto" requires action, not passive storage).                          | Guilty (purpose is to exclude weapons from campus; storage risks access).                | Dictionary definitions (enactment-era); usage in contemporaneous statutes; case law on "bring." |  
  | **2. Is "dangerous weapon" defined by typical use or abstract capability?** | *Senior’s 2-inch nail file in backpack.*                                         | Not guilty (ordinary meaning: nail file is a tool, not a weapon absent violent context). | Guilty (purpose: ban objects capable of causing harm; nail files can be weapons).        | Statistical data on weaponization of objects; legislative hearings on "dangerous instruments." |  
  | **3. Does "knowingly" require intent to violate the law, or merely awareness of possession?** | *Shop teacher uses a box cutter for supplies (knows it’s there, but for work).* | Guilty (textually "knowingly" modifies possession, not criminal intent).                 | Not guilty (purpose: target illicit threats; tools used responsibly serve the mission). | Statutory structure (e.g., mens rea elsewhere); agency guidance on occupational exceptions.     |  
  | **4. Does clear text bind even if application contradicts all legislators’ expectations?** | *Parent with unloaded, cased hunting rifle in trunk during pickup.*             | Guilty (text is clear; judicial override usurps democracy).                              | Not guilty (purpose: prevent immediate threats; unsecured rifles aren’t the target).     | Floor debates showing legislators feared *accessible* weapons; post-enactment legislative reactions. |  

  #### **IV. Where Disagreement Might Be Merely Verbal**  
  - **"Ambiguity" Threshold**: Textualists see ambiguity as rare (only when text is genuinely unclear); purposivists see it as inherent where purpose and text diverge. This is partly definitional.  
  - **"Purpose" as Constraint**: Both agree purpose must be textually grounded, but textualists see purposivists as overclaiming; purposivists see textualists as underclaiming. The dispute is *how tightly* text binds purpose.  

  #### **V. Evidence Against Own View**  
  - **Textualist Vulnerability**: A case where *literal text produces an outcome even textualists concede is "absurd"* (e.g., prosecuting a student for a butter knife in a lunchbox). This forces confrontation with the "absurdity exception."  
  - **Purposivist Vulnerability**: A case where *invoking "purpose" leads to judicial overreach* (e.g., exempting a gang member with a knife because he "intended no harm"). This highlights slippery-slope risks.  

  ---  

  ### **Notes for Your Seminar**  
  1. **Textualism ≠ Originalism**: Emphasize that textualism here is *statutory*, focused on the law’s words at enactment. Constitutional originalism is a separate debate.  
  2. **Purpose as Abstract Goal**: Purposivists in this model prioritize the statute’s *functional objective* (e.g., "prevent weapon-related violence in schools") over specific applications.  
  3. **Predictions Force Specificity**: The table requires each side to apply its method to concrete facts—exposing where theories actually diverge.  
  4. **Self-Criticism**: Both sides acknowledge counterevidence, discouraging caricature.  

  This structure models collaborative disagreement: shared foundations, precise conflicts, and testable predictions. It should help students move beyond "text vs. intent" slogans to examine *when*, *why*, and *how* methods diverge.
