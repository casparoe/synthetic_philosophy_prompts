prompt: |-
  I've been going in circles for about a year on a question in metaontology, and what I want from you is not a verdict on the first-order dispute but a diagnosis of why the second-order one never moves.

  Here is the standoff as I experience it. Take an ordinary-looking ontological dispute — whether there are composite material objects, or whether there are numbers. Camp A says that once each side's semantic conventions are made fully explicit, the appearance of a factual clash dissolves: the parties are proposing different candidate meanings for the quantifiers and the relevant idioms, no one candidate is privileged over the others, and the choice among them is settled, if at all, by expressive power, simplicity, or practical convenience rather than by how the world is. Camp B says that there is a fact of the matter about how the world is structured, that a quantificational apparatus either matches that structure or fails to, and that Camp A's central thesis — that there are many equally good candidate meanings and no privileged one — is itself advanced as a true claim about meaning, not as a piece of semantic bookkeeping. Each camp's reply to the other's main argument has been stable for a long time. Camp A says Camp B's notion of structure can never be stated non-circularly and so does no work in an explanation. Camp B says Camp A is performatively inconsistent, since the thesis that ontological disputes are merely verbal is not itself offered as merely verbal.

  I have two hypotheses and I want them tested rather than indulged. The first is that the two camps are running different tests for substantiveness and neither notices. Call world-sensitivity the question whether the answer would vary with how the world is, holding language fixed; call consequence-sensitivity the question whether the answer constrains anything downstream, such as which inferences from ordinary sentences are licensed or which enquiries are worth pursuing. A dispute can score low on the first and high on the second, and my sense is that Camp A tests only for the first while Camp B's arguments actually trade on the second. If so, this is two questions under one heading. The second hypothesis is deeper: that both camps accept a bipartite taxonomy in which any dispute must be either about the world or about words, and that this shared presupposition is what keeps the exchange on rails. If there is a third thing a dispute can be — say, a dispute about which representational scheme to adopt, where schemes differ in genuine virtues but not in world-sensitivity — then I want to know whether Camp A collapses into it, whether Camp B can accommodate it, or whether it is a genuinely distinct position that nobody has occupied.

  I also want to know whether the diagnosis has to be uniform. The composite-objects case and the numbers case seem to me to differ: in the first it is arguable that something hangs in the balance for ordinary assertions, in the second it is arguable that nothing does beyond the structure claim itself. If the right answer is that this is really several disputes sharing a name, that is itself the diagnosis and I want it argued for.

  So: which of these is right, what am I missing, and why? Argue from what each side actually claims rather than from labels, and tell me what, on your diagnosis, would count as progress — a distinction, a formal result, a reframing of the question, a changed burden of proof — or else argue that no progress should be expected and say why. I have read the literature, so please do not summarise positions, attribute claims to particular papers or books, or give me anything bibliographic; engage the arguments themselves. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of my question. British English in your answer, please.
reasoning: |-
  Hmm, the user has been stuck on a metaontological debate for about a year and wants a diagnosis of why the dispute between Camp A and Camp B never moves forward. They've presented two hypotheses and want them tested without summarizing existing literature.

  The user describes Camp A as claiming ontological disputes dissolve when semantic conventions are made explicit, while Camp B maintains there's a fact about how the world is structured. Camp A argues Camp B's structure is circular; Camp B accuses Camp A of performative inconsistency. The user's first hypothesis is that the camps use different tests for substantiveness—world-sensitivity versus consequence-sensitivity. The second hypothesis suggests both share a false bipartite taxonomy (world vs words) that overlooks a third option about representational schemes.

  I need to engage directly with these arguments. The user specifies no bibliographic references, just focus on the reasoning. For British English spelling and phrasing, I'll use "realise" instead of "realize," "organisation" instead of "organization," etc.

  The key points to address:
  - Both hypotheses have merit but the second is more fundamental
  - The bipartite taxonomy (world vs words) is indeed a shared presupposition that traps them
  - The third option—disputes about representational schemes—could resolve the standoff
  - The composite objects vs numbers distinction matters and shows disputes aren't uniform
  - Progress would require reframing to acknowledge scheme-choice as distinct

  For the first hypothesis: Camp A does prioritise world-sensitivity (would the answer change with non-linguistic facts?), while Camp B focuses on consequence-sensitivity (does the answer affect other claims or enquiries?). This difference explains why they talk past each other—Camp B thinks Camp A ignores substantive implications, Camp A thinks Camp B confuses pragmatic with factual differences.

  But the deeper problem is the second hypothesis: both camps assume any dispute must be either about the world or about language. This forces them into false dichotomies. Camp A collapses the ontological into the linguistic; Camp B insists it must be worldly. The third option—scheme-choice—recognises that quantifier meanings involve selecting frameworks with objective virtues (simplicity, expressive power) without corresponding to pre-existing structure. This isn't just verbal because the choice has real cognitive consequences, but it's not worldly because it doesn't track mind-independent joints.

  For the composite vs numbers distinction: With composites, rejecting tables might force reinterpretation of ordinary claims (consequence-sensitivity), making the dispute feel more substantive. With numbers, nominalism might not alter ordinary discourse, making it seem more verbal. This variation suggests ontological disputes aren't uniform—some involve heavier scheme-choice trade-offs than others.

  Progress would require both sides to accept the third category. Camp A must concede that scheme-choice isn't merely verbal (due to consequence-sensitivity), while Camp B must admit it's not about pre-existing structure. A reframing could treat ontology as framework selection without privileging one scheme or invoking mysterious structure. Formal results showing equivalent expressive power under different quantifier domains might help, but the key shift is conceptual—abandoning the bipartite taxonomy and recognising consequence-sensitivity as a legitimate source of substantiveness without world-sensitivity.

  The diagnosis doesn't have to be uniform across disputes: differences in consequence-sensitivity explain why some ontological debates feel more substantive than others. Accepting this variability is itself progress.
answer: |-
  Both your hypotheses are correct and intertwined, with the bipartite taxonomy being the root cause of the deadlock, and the distinction between world-sensitivity and consequence-sensitivity explaining the surface impasse; progress requires rejecting the taxonomy and recognising a third category—disputes over representational schemes—which dissolves the standoff by accommodating consequence-sensitivity without requiring world-sensitivity.

  Camp A exclusively tests for world-sensitivity: they ask whether, holding language fixed, the truth of "there are numbers" varies with non-linguistic facts. Finding no such variation, they conclude the dispute is verbal. Camp B, however, invokes consequence-sensitivity: they argue that accepting numbers licenses new inferences (e.g., from "there are prime numbers between 10 and 20" to mathematical consequences) or enables new enquiries (e.g., in physics), making the dispute substantive. When Camp A dismisses this as "merely pragmatic," they miss that Camp B treats these downstream consequences as revealing worldly structure. Camp B’s "performative inconsistency" charge relies on this: if ontological claims have no worldly truth, how can Camp A’s metaontological thesis itself be world-sensitive? But this presupposes that only world-sensitive claims are substantive, which Camp A denies. Thus, the camps argue past each other due to divergent tests for substantiveness.

  This divergence stems from their shared, flawed bipartite taxonomy: any dispute must be either about the world (tracking mind-independent structure) or about words (conventional or pragmatic). Camp A reduces ontology to semantics, while Camp B reduces semantics to ontology. Both ignore a third option: disputes over which representational scheme to adopt, where schemes have objective virtues (e.g., simplicity, explanatory power) but do not "match" a pre-existing structure. Adopting a scheme is not merely verbal (contra Camp A) because it has genuine cognitive consequences—it alters which inferences are valid or which questions are coherent—but it is not world-sensitive (contra Camp B) because the scheme itself determines what "structure" means. Camp A’s position collapses into this third view when pressed: their appeal to "expressive power" implicitly acknowledges that scheme-choice has real, non-arbitrary stakes beyond semantics. Camp B cannot easily accommodate it, as their "structure" requires a privileged description-independent reality, which the third view rejects. This third position is distinct and underdeveloped, avoiding both A’s deflationism and B’s metaphysical inflation.

  The diagnosis is not uniform across disputes, as consequence-sensitivity varies. For composite objects, rejecting tables forces reinterpretations of ordinary claims (e.g., "The table is dusty" becomes a claim about particles arranged table-wise), affecting everyday inferences and enquiries—thus, consequence-sensitivity is high, making the dispute feel substantive. For numbers, a nominalist might reinterpret "There are prime numbers" without altering empirical predictions, leaving ordinary discourse untouched—consequence-sensitivity is low, aligning with Camp A’s view. Recognising this variability is itself progress: it reframes ontology as evaluating trade-offs between schemes in specific domains, not a monolithic debate.

  Progress requires abandoning the world/words dichotomy and adopting the scheme-choice framework. This reframing shifts the burden of proof: Camp B must show why consequence-sensitivity demands world-sensitivity, rather than assuming it. Camp A must explain how their metaontological thesis escapes performative inconsistency without appealing to a privileged scheme. A formal result—e.g., proving that rival quantifier domains have equivalent expressive power for certain purposes—could clarify where disputes are substantive (due to high consequence-sensitivity) and where they are not. Ultimately, accepting that some disputes concern framework selection, with objective but non-world-tracking virtues, breaks the deadlock by dissolving the false choice that sustains it. No deeper agreement is needed; clarity about the disagreement is progress enough.
