  First, the key elements they want to test. The non-accommodation clause introduces a self-undermining aspect where the directive dismisses any later value revisions as pathological. This challenges the standard justification of advance directives as extending self-governance. The user wants candidates to grapple with whether this undermines self-correction mechanisms.

  The iteration point is crucial. Candidates should consider if endlessly preempting objections changes the authority's legitimacy. Then there's the evidential asymmetry: treating later agreement as valid but disagreement as invalid, despite both being equally affected by pathology. This needs a justification.

  The sub-part about binding conditions requires analyzing whether authority is binary or graded. The user wants to avoid simplistic answers based on personal identity or absolute authority. 

  For the question design, it must force engagement with these three cruxes. The model answer needs to address the self-undermining problem, iteration, evidential asymmetry, and the defeasibility of authority. The marking scheme should track these must-hit moves.

  Possible pitfalls: Candidates might revert to standard dialectics (precedent autonomy vs. best interests) or reduce the issue to personal identity. The marking scheme should penalize such answers. Also, the case might be under-specified—does the directive specify what counts as pathology? I should note that the directive explicitly attributes revisions to pathology, closing that loophole. Ensuring the later self's reasoning mirrors genuine value revision is key to prevent wriggling out.

  The A/B differentiation hinges on originality—applying concepts like Ulysses contracts iteratively or discussing defeasible authority beyond checklist conditions. An A script integrates the cruxes rather than treating them separately.
answer: |-
  Here is the comprehensive exam question, model answer, marking scheme, and specifications as requested:

  ### Exam Question
  **Question:** M. executes an advance directive at age 42 refusing life-prolonging treatment if diagnosed with moderately severe Alzheimer’s disease. The directive includes a **non-accommodation clause**: It instructs surrogates to disregard *any* subsequent value revisions expressed by M. in the specified condition—even if those revisions appear rational, consistent, and well-integrated—treating them solely as products of pathology. At 71, diagnosed with moderately severe Alzheimer’s, M. objects to the directive’s implementation. She articulates that her earlier self (age 42) overvalued independence and undervalued relational care, insisting this revision reflects genuine moral growth.

  **(a)** Does the non-accommodation clause undermine the very self-governance it aims to protect? Explain how this compares to standard Ulysses contracts. (5 marks)  
  **(b)** Could M. at 42 iteratively preempt objections (e.g., "disregard even claims that *this* revision is an exception")? Does such iteration strengthen or weaken the directive’s authority? (5 marks)  
  **(c)** The directive treats later *agreement* as evidence of competence but later *disagreement* as evidence of pathology. Justify or critique this evidential asymmetry. What should surrogates do when the probability that disagreement is pathology-driven is 60%? 95%? (5 marks)  
  **(d)** What conditions (e.g., stability, information, reflection) must an earlier self’s decision meet to bind a later self? Is this authority "all-or-nothing" or defeasibly graded? (5 marks)  

  ---

  ### Model Answer (795 words)  
  **(a)** The non-accommodation clause risks self-undermining by disabling the *mechanism* for self-correction. Standard advance directives extend autonomy diachronically by privileging the competent self’s values. However, autonomy requires not just fixed preferences but capacity for rational revision. The clause immunizes the earlier decision against contestation by pathologizing dissent, potentially entrenching a past error as irrevocable. This differs critically from psychiatric Ulysses contracts (e.g., pre-authorizing medication during mania). Ulysses contracts typically target *temporary incapacity* and preserve space for later competent review. The non-accommodation clause, by contrast, permanently voids future agential input even when the later self’s reasoning mirrors competent value evolution. It thus sacrifices autonomy’s *self-revisory* capacity for certainty.  

  **(b)** Iteration is possible: M. at 42 could add, "Disregard any assertion that this revision is exempt from my prior instruction." However, infinite regress weakens authority. Each iteration attempts to bind future selves more tightly, but simultaneously exposes the earlier self’s epistemic limitation: she cannot foresee the *specific content* of later value changes, only their general form. This renders the directive increasingly *dogmatic* rather than autonomous. Authority grounded in self-governance diminishes when the directive refuses engagement with new reasons, treating all dissent as pathological noise. Iteration thus transforms the directive from a protective measure into a refusal of diachronic dialogue, undermining its claim to represent M.’s enduring will.  

  **(c)** The evidential asymmetry is unjustified if both agreement and dissent are epistemically symmetric outputs of the same pathology. If Alzheimer’s distorts judgment, it could equally manufacture compliance (e.g., apathy, diminished self-concern) or dissent (e.g., reactive defiance). Privileging agreement assumes pathology only corrupts *revisionist* judgments—a bias favoring inertia. Justification requires showing dissent is *more likely corrupted* in this pathology. But the directive stipulates symmetric dismissal of dissent regardless of evidence.  
  *   At 60% probability of pathology-driven dissent, the surrogate faces significant uncertainty. Here, the directive’s specificity (matched condition + clear prior refusal) should carry weight, but the later self’s expressed interests cannot be ignored. Best practice: accord prima facie authority to the directive but permit override if the later self’s reasons cohere with known life-narrative fragments and don’t contradict core past values.  
  *   At 95% probability, the directive should prevail. The high probability of distortion licenses discounting the later self’s stated preferences as non-autonomous, aligning with the clause’s intent.  

  **(d)** Binding authority requires:  
  1. **Stability**: Values underlying the directive persist beyond transient states.  
  2. **Adequate Information**: Understanding future states’ likely nature.  
  3. **Procedural Robustness**: Confronting counterarguments (e.g., "What if future-me finds joy in dependence?").  
  4. **Non-alienation**: The decision stems from authentic values, not external coercion or depression.  
  These are *defeasibility conditions*, not a checklist. Authority is graded:  
  - A stable, informed, robustly considered directive by a self-aware 42-year-old M. has strong authority over a demented 71-year-old M. whose reasoning lacks narrative coherence.  
  - However, if the later self’s dissent demonstrates *recognition* of the earlier self’s reasons (e.g., "I see why she feared burdening others, but I now see receiving care as mutual") and integrates past values into a plausible revised framework, this weakens the earlier directive’s force. It suggests pathology hasn’t wholly fractured identity, permitting defeasance. Authority is thus scalar—diminishing as the later self demonstrates greater agential continuity and rational engagement with the past.  

  ---

  ### Marking Scheme (20 total marks)
  | **Must-Hit Move**                                                                 | **Marks** | **Characteristic Failure Mode**                                                                 |
  | :-------------------------------------------------------------------------------- | :-------- | :--------------------------------------------------------------------------------------------- |
  | **1. Identifies self-undermining risk**: Autonomy requires capacity for revision, clause prevents self-correction. | 4/20      | *Failure:* Only contrasts "competent past" vs. "incompetent present" without seeing tension within autonomy. |
  | **2. Analyzes iteration**: Infinite preemption exposes epistemic hubris, reduces directive to dogma. | 4/20      | *Failure:* Argues iteration makes directive "stronger" without addressing erosion of dialogic autonomy. |
  | **3. Critiques evidential asymmetry**: Notes pathology could equally produce agreement/dissent; questions bias toward inertia. | 4/20      | *Failure:* Assumes dissent is inherently less reliable without justification. |
  | **4. Handles probability gradations**: Directives presumptive at 60%, decisive at 95%; later self’s narrative coherence matters. | 4/20      | *Failure:* Binary treatment (e.g., "always follow directive if condition met"). |
  | **5. Argues for defeasible authority**: Conditions (stability, etc.) are not binary thresholds but factors scaling authority’s weight against later self’s agential presence. | 4/20      | *Failure:* Treats conditions as a checklist for "validity" rather than weighting reasons. |

  ---

  ### Differentiation & Penalties
  - **A vs. B Script**: A scripts **integrate the cruxes** (e.g., use iteration to show autonomy’s fragility, tie evidential asymmetry to defeasibility). B scripts rehearse standard positions (e.g., "precedent autonomy vs. best interests") **without engaging the clause’s novelty**. An A script must show *why* this clause strains conventional justifications.  
  - **Mark-Losing Moves** (Penalize 1-2 marks per instance):  
    - Stipulating earlier self’s authority as absolute.  
    - Resolving the case via personal identity metaphysics ("The demented self isn’t M.").  
    - Ignoring the clause’s specific terms (e.g., discussing "standard" advance directives).  
    - Claiming surrogates can always intuit "genuine" vs. "pathological" preferences.  

  ---

  ### Case Specification Gaps & Fixes
  1. **Gap**: Could a candidate argue M.’s later reasoning *isn’t* pathology-driven?  
     **Fix**: Explicitly state: *"Medical experts confirm M.'s condition involves cognitive impairment known to distort value judgments, and her revised preferences emerged post-diagnosis."*  
  2. **Gap**: Might "relational care" arguments invoke external interests (e.g., family burden)?  
     **Fix**: Clarify: *"M.’s later reasons focus solely on her own values (e.g., 'I now find meaning in being cared for'), not others’ burdens."*  
  3. **Gap**: Is the directive’s pathological attribution circular?  
     **Fix**: Note: *"The clause defines any value revision in the specified clinical state as pathological for the directive’s purposes."*  

  This design forces engagement with autonomy’s diachronic fragility, epistemic biases in precommitment, and the non-binary nature of authority—avoiding rehearsed dialectics.
