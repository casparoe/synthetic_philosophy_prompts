prompt: |-
  I chair the research-integrity committee for a university hospital network, and I want to replace an argument we keep having with a procedure. We meet monthly and see twenty to thirty cases a year, almost all of them referred by a journal, a co-author, or a funder; a two-person triage pair has a week to sort each one before the full committee of nine (with legal counsel in the room and the dean signing off on any finding) spends about forty minutes on it. Our internal policy defines a handful of boxes: fabrication, falsification, plagiarism, a residual category called Questionable Research Practice that was bolted on about a decade ago, honest error, and no finding. I will stipulate our own rough glosses rather than quote the policy: plagiarism is taking someone else's words or ideas without attribution; falsification is manipulating materials or records so that the research is not accurately represented; fabrication is inventing data; Questionable Research Practice is whatever damages the record without fitting the other three. Our actual difficulty is never whether someone did something bad. It is which box the thing goes in, and the boxes keep stretching: we have spent two meetings on whether a researcher's undisclosed use of a generative language model to draft a discussion section is plagiarism, falsification, or nothing we currently have a name for, and we got nowhere because half the room was reading the case one way and half another, and neither side could say what would settle it. I recently sat in on a cognitive science lecture about analogy and fluid concepts, the kind with letter-string puzzles where you are told that abc goes to abd and asked what ijk goes to, and I recognized our committee exactly: the fight is not about the case, it is about which frame you carry over, and once you change frames the same case has two perfectly good answers.

  So please adopt the role of a philosopher of concepts who has also had to draft institutional policy that non-specialists can actually run, and before you write the procedure itself, spend one short brainstorming passage listing which distinctions from work on analogy, exemplar-based and prototype-based categorization, family resemblance, and conceptual drift you intend to preserve and which you are deliberately dropping as unusable by nine clinicians in forty minutes. Then give me the procedure. Concretely: an ordered sequence of questions, each with a statement of what counts as a sufficient answer, explicit stop points (stop with a no finding, stop and refer to the full committee, stop and refer to counsel), and an explicit mark at every point where the remaining question is one of values rather than facts and therefore has to be handed to a person. Build it on the idea that our categories are anchored in a small set of named exemplar cases plus a framing, not in necessary-and-sufficient conditions: I want each classification to be written out in a fixed form, this old exemplar is to its category as this case is to blank, then to name which conceptual slot is slipping (whose words, what counts as a record, whether there is an author at all, whether the manipulation is of data or of presentation) and which rival framings are available. Please also build in four mechanisms I have been sketching and want either adopted or explicitly argued against: a slippage ledger, in which every non-central classification is logged with the slot that slipped and the frame chosen, reviewed annually; a rule for when a stretch becomes binding precedent for future coders and when instead it triggers a formal split or merger of categories; a contraction test, on the assumption that categories only ever ratchet outward, requiring the committee periodically to name a case that would fall outside each category and returning a verdict of too fluid to apply when it cannot; and a hard separation between the classification step and the severity step, because our worst arguments come from people who want a category partly because of the sanction attached to it. Finally, say plainly what we lose by treating our categories this way rather than as definitions, since I assume we lose the ability to call a classification simply wrong.

  Then run the whole thing, with the step trace shown, on three cases, and commit to a verdict on each rather than describing what a committee might decide. Case one: a resident who reused, verbatim and without attribution, three paragraphs of the methods section of her own previously published paper in a new paper in a different journal, with no licensing problem flagged. Case two: a postdoc who used a large language model to draft the discussion section of a submitted paper, disclosed nothing, and produced text that contains no copied sentences but does contain two sentences stating claims about the data that do not follow from it. Case three: a long-serving technician who, in a field where this was ordinary practice when he was trained, has for years been tidying blot images, adjusting contrast and splicing lanes from different gels, and one published figure turns out to combine lanes from two gels with nothing in the legend to say so. My own instinct is that case one is trivial and case three is serious; if the procedure overturns either instinct, say so and say which step does the work, and if all three come out comfortably, identify the premise of mine that the procedure has quietly overruled. Throughout, take a definite position and give your reasons rather than surveying options, and be self-critical: mark the two or three places where you think your own design is most contestable, and flag any step that rests on an empirical assumption about how people actually categorize. Please do not reach for literature, citations, or a reading list, or for any real national research-misconduct definition you may remember; our stipulated categories are the whole world the procedure has to work in, and I want the reasoning in your own words.
reasoning: |-
  We are designing a procedure for classifying research integrity cases into predefined categories: Fabrication, Falsification, Plagiarism, Questionable Research Practice (QRP), Honest Error, or No Finding. The key insight is that these categories are not defined by necessary and sufficient conditions but are instead anchored in exemplar cases and framed by analogical reasoning. The procedure must be usable by a committee of nine clinicians in about 40 minutes, with explicit stop points and a clear separation of factual and value judgments.

  Brainstorming: Key Distinctions to Preserve and Drop

  Preserve:
  1. **Exemplar-based reasoning**: We will use a set of core exemplar cases for each category that are uncontroversial and well-understood. New cases will be compared to these exemplars.
  2. **Framing effects**: We acknowledge that the same case can be seen in different ways (e.g., as plagiarism or as QRP) depending on the frame. The procedure will explicitly identify the frame and the "slot" (key feature) that is being stretched.
  3. **Family resemblance**: We accept that categories may have overlapping features and no single defining feature. We will look for the best overall match to an exemplar.
  4. **Conceptual drift**: We will log non-central classifications to track how categories are stretching and decide when a stretch becomes precedent or triggers a category revision.

  Drop:
  1. **Necessary and sufficient conditions**: We will not attempt to define each category with a strict definition. Instead, we rely on analogies to exemplars.
  2. **Prototype-based typicality gradients**: While prototypes might be useful, we find exemplars more concrete for committee use. We will not compute similarity scores but rely on direct analogy.
  3. **Deep analysis of conceptual structure**: We avoid philosophical debates about the nature of categories and focus on practical decision-making.

  The Procedure: Ordered Sequence of Questions

  The procedure is a decision tree that the triage pair (or the full committee) can follow. Each question must be answered with a clear "yes" or "no", or with a predefined set of options. We have explicit stop points and marks for value judgments.

  **Step 0: Initial Triage (by the two-person triage pair)**
     - *Question*: Is there any evidence that the alleged action occurred and that it relates to research integrity? (This step filters out frivolous or unrelated complaints.)
     - *Sufficient answer*: If no, stop with "No Finding". If yes, proceed to Step 1.

  **Step 1: Honest Error Check**
     - *Question*: Is there clear and convincing evidence that the issue resulted from an honest error (e.g., a miscalculation, a genuine mistake in procedure) without intent to deceive?
     - *Sufficient answer*: If yes, stop with "Honest Error". If no, proceed to Step 2.

  **Step 2: Fabrication Check**
     - *Exemplar*: Inventing data points that never existed.
     - *Question*: Does the case involve making up data or results that were not actually obtained in the research?
     - *Sufficient answer*: If yes, stop with "Fabrication". If no, proceed to Step 3.

  **Step 3: Falsification Check**
     - *Exemplar*: Manipulating research materials, equipment, or processes, or changing or omitting data or results such that the research is not accurately represented in the research record.
     - *Question*: Does the case involve altering, omitting, or manipulating the research record (data, images, methods, etc.) in a way that misrepresents the actual research?
     - *Sufficient answer*: If yes, stop with "Falsification". If no, proceed to Step 4.

  **Step 4: Plagiarism Check**
     - *Exemplar*: Copying text or ideas from another source without attribution.
     - *Question*: Does the case involve using someone else's words, ideas, or work without giving appropriate credit?
     - *Sufficient answer*: 
          - If yes, then: 
              - *Sub-question*: Is the reused material from the author's own prior work? 
                  - If yes, then it is still plagiarism (self-plagiarism) unless there is a valid reason (like methods description in a series) and proper citation. But note: our policy does not explicitly exclude self-plagiarism. However, we must check for licensing issues and whether the journal allows it. But our policy currently does not have an exception for self-plagiarism. Hence, if the reuse is verbatim and without attribution, it is plagiarism.
                  - If no, then plagiarism.
          - If no, proceed to Step 5.

  **Step 5: Questionable Research Practice (QRP) Check**
     - *Exemplar*: Actions that damage the integrity of the research record but do not fit fabrication, falsification, or plagiarism. (Note: Our residual category. We must be cautious not to overstretch.)
     - *Question*: Does the case involve an action that damages the research record (e.g., by introducing inaccuracies, obscuring truth, or violating standards of the field) and does not fit fabrication, falsification, or plagiarism?
     - *Sufficient answer*: If yes, stop with "QRP". If no, proceed to Step 6.

  **Step 6: No Finding**
     - *Question*: After the above, is there no clear category? (This should be rare because QRP is a catch-all for damaging actions that don't fit the others, but if the action is not deemed to damage the record, then no finding.)
     - *Sufficient answer*: Stop with "No Finding".

  But note: We must build in the mechanisms requested.

  **Mechanisms to Build In:**

  1. **Slippage Ledger**: Every time a case is classified as QRP or when a category is stretched (i.e., when the case is not a central exemplar and requires a frame shift), log:
        - The case identifier
        - The category assigned
        - The "slot" that slipped (e.g., for plagiarism: "whose words" when it's self-plagiarism; for falsification: "what counts as a record" when it's image manipulation that was once acceptable but now is not; etc.)
        - The frame chosen (e.g., for the LLM case: frame as "authorship" vs. "data representation")
     This ledger is reviewed annually to track conceptual drift.

  2. **Rule for Precedent vs. Split/Merge**: 
     - A stretch becomes binding precedent if:
          a) The committee (by majority) agrees that the case is a clear extension of the category and does not create internal inconsistency.
          b) The slippage ledger shows that similar cases have been consistently classified the same way over time.
     - Trigger a formal split or merger of categories if:
          a) The slippage ledger shows persistent confusion or inconsistency in a particular slot.
          b) A case is classified in a way that a majority of the committee feels is a misapplication but is forced by the current structure.

  3. **Contraction Test**: Annually, for each category, the committee must name a hypothetical case that would fall just outside the category (i.e., a borderline case that they would not classify as such). If the committee cannot agree on such a case for a category, then that category is deemed "too fluid to apply" and is suspended until redefined.

  4. **Separation of Classification and Severity**: The above steps are only for classification. Sanctions or severity are decided in a separate step after classification, by the dean with legal counsel. This is to prevent category choice being influenced by desired sanction.

  **Explicit Marks for Value Judgments**:
     - Step 5 (QRP): The question of whether an action "damages the research record" is a value judgment. At this step, the committee must explicitly vote (by majority) on whether damage occurred. This is a point where non-specialists might need guidance, but the committee must decide based on the standards of the field.

  **Stop and Refer Points**:
     - At any step, if the triage pair (or committee) finds that the case is highly ambiguous and cannot be resolved by the procedure, they can stop and refer to the full committee for framing.
     - If legal counsel identifies a legal risk (e.g., potential defamation, contract issues), they can stop the process and require full committee review with legal input.

  Now, we run the procedure on the three cases. We assume the triage pair is doing the initial run, but if they cannot decide, they refer to the full committee. We are committing to a verdict.

  **Case 1: Resident reusing her own methods text without attribution**

  Step 0: There is evidence (the two papers) and it relates to research integrity (plagiarism concern). Proceed.

  Step 1: Is it an honest error? The resident reused verbatim without attribution. There is no indication of error; it was deliberate. No.

  Step 2: Fabrication? No, the methods were actually used. No.

  Step 3: Falsification? The methods are accurately represented, just reused. No.

  Step 4: Plagiarism? 
     - Question: Using someone else's words without attribution? 
          - But it's her own words. However, without attribution, it is using words (even one's own) without credit. Note: In academic publishing, reuse of one's own text without citation is often considered self-plagiarism and is a form of plagiarism. 
          - Our exemplar for plagiarism is "copying text ... without attribution". This fits: she copied text without attribution. 
          - Sub-question: Is it from her own prior work? Yes. But our policy does not exclude self-plagiarism. 
          - We note that there is no licensing problem, but that doesn't absolve the attribution issue. 
     - Therefore, yes, plagiarism.

  Verdict: Plagiarism.

  **Case 2: Postdoc using LLM to draft discussion, undisclosed, with two unsupported claims**

  Step 0: Evidence (the submitted paper, disclosure absence) and relates to integrity. Proceed.

  Step 1: Honest error? The use of LLM was deliberate and undisclosed. The unsupported claims might be error, but the act of using LLM without disclosure is intentional. So no, not honest error.

  Step 2: Fabrication? The unsupported claims are not made up out of thin air? They are about the data but do not follow. This is not fabrication of data but misrepresentation of interpretation. So no.

  Step 3: Falsification? Falsification is about manipulating the research record. Here, the record (the data) is not altered. The discussion misrepresents the data by making claims that don't follow. But falsification typically involves altering data or images, not misinterpreting in text. However, let's check our exemplar: "manipulating ... records so that the research is not accurately represented." The research record includes the published paper. The text in the discussion is part of the record. By including false interpretations, the record is inaccurate. But note: falsification usually involves active manipulation (e.g., photoshopping) rather than interpretive inaccuracies. This is a gray area.

  We might stretch falsification to include misrepresentation in the narrative, but let's see if it fits better elsewhere.

  Step 4: Plagiarism? The text was generated by an LLM. Is that "someone else's words"? The LLM is not a person. There is no attribution to the LLM. But our plagiarism exemplar is about taking from another person. The slot "whose words" is slipping: if we frame the LLM as a tool (like a thesaurus) then it's not plagiarism. If we frame it as a source, then it might be. But note: the text is not copied from a specific source, it's generated. Moreover, the problem is not just the lack of attribution but the unsupported claims. Plagiarism doesn't cover the inaccuracy. So probably not plagiarism.

  Step 5: QRP? Does it damage the research record? Yes, because it introduces inaccuracies (the unsupported claims) and obscures the origin of the text (undisclosed LLM use). This does not fit fabrication, falsification, or plagiarism. Therefore, QRP.

  But note: we must mark the value judgment. The committee must decide if this damages the record. We argue that it does because the record should be an accurate representation and the authorship should be transparent.

  Verdict: QRP.

  **Case 3: Technician tidying blot images, combining lanes without legend note**

  Step 0: Evidence and relates to integrity. Proceed.

  Step 1: Honest error? The technician did this intentionally, as part of his routine. But note: he was trained when this was ordinary. However, current standards may differ. It is not an error; it's a deliberate practice. So no.

  Step 2: Fabrication? No, the data are real but presented in a spliced way.

  Step 3: Falsification? 
     - Exemplar: Manipulating images so that the research is not accurately represented.
     - The technician spliced lanes from two gels. The figure represents the data as if they came from one gel. This misrepresents the actual research process. Even if the result is scientifically valid, the image is not a true representation of one experiment. It is a composite. Without disclosure, it is misleading. 
     - This fits falsification: manipulation of images (a research record) that leads to inaccurate representation.

  But note: the field once allowed this. However, current standards require disclosure. The issue is that the figure is inaccurate as presented.

  Verdict: Falsification.

  **Review of Instincts**:
     - Case 1: I thought trivial. The procedure classifies it as plagiarism. This is consistent with many policies (self-plagiarism). The step that does the work is Step 4, which does not exempt self-plagiarism.
     - Case 3: I thought serious. The procedure says falsification, which is serious. So it matches.
     - The procedure overturned nothing in my instincts for these cases.

  But note: in Case 2, I might have expected a debate, but the procedure put it in QRP. This might be a quiet overrule: I might have thought it was falsification, but the procedure draws a line at active manipulation of data for falsification and puts narrative misrepresentation in QRP.

  **What We Lose by This Approach**:
     - We lose the ability to say a classification is "simply wrong" because there are no strict definitions. Instead, we have analogical extensions that might be contested. However, we gain practicality and avoid gridlock.

  **Self-Critical Points**:
     1. **Step 4 (Plagiarism) on self-plagiarism**: This is contestable. Some might argue that self-plagiarism is not real plagiarism because there is no theft from another. Our procedure currently does not make an exception. This might be too rigid and could be challenged. We might need to adjust the exemplar or add a frame for self-use.
     2. **Step 5 (QRP) as a catch-all**: The value judgment about "damages the research record" is vague and might lead to overuse of QRP. We rely on the committee's judgment, which might be inconsistent without clear guidelines.
     3. **Empirical assumption in Step 3 for Case 2**: We assumed that falsification requires active manipulation of data/images and not narrative misrepresentation. This is an empirical assumption about how people categorize. Some might stretch falsification to include misleading text.

  **Final Procedure Structure**:
     - The steps are ordered to check the most concrete categories first (fabrication, falsification, plagiarism) and leave QRP for the residual.
     - The triage pair can run through the steps. If at any point they cannot agree or the case is ambiguous, they refer to the full committee. The full committee then uses the same steps but with discussion and vote.

  We hope this procedure brings clarity and efficiency.
answer: |-
  ### Brainstorming: Preserved and Dropped Distinctions
  I'll preserve these insights from cognitive science and philosophy to make the procedure practical for your committee:
  - **Preserved**:  
    1. **Exemplar-based categorization**: Core exemplars (e.g., "copying a paragraph from another paper" for plagiarism) anchor each category. New cases are classified by analogy to these exemplars.  
    2. **Framing effects**: Explicitly name the "slot" being stretched (e.g., "whose words" in plagiarism) and rival frames to resolve ambiguity.  
    3. **Slippage tracking**: Log non-central cases to monitor conceptual drift.  
    4. **Family resemblance**: Allow flexible matching to exemplars without rigid definitions.  
    5. **Contraction test**: Force categories to retain boundaries by requiring imaginable exclusions.  

  - **Dropped**:  
    1. **Necessary-and-sufficient conditions**: Unworkable for non-specialists in 40 minutes.  
    2. **Prototype gradients**: Clinicians need binary decisions (e.g., "plagiarism or not?"), not similarity scores.  
    3. **Deep conceptual history**: No time for historical analysis of how "falsification" evolved.  
    4. **Ambiguity tolerance**: The procedure forces a choice (or "no finding")—no room for "undecided."  

  ### The Classification Procedure  
  **Core Structure**: A 7-step flow where the triage pair (or full committee) answers questions in order. Each step has:  
  - **Sufficient answer**: Criteria to proceed.  
  - **Stop points**: Final verdict, referral to committee/counsel, or escalation for values.  
  - **Slot identification**: When stretching a category, name the contested conceptual slot and rival frames.  
  - **Fixed-form classification**: "\[Exemplar\] is to \[category\] as this case is to \[slot\]."  

  **Mechanisms Incorporated**:  
  1. **Slippage ledger**: Logs every non-exemplar case with slot/frame (reviewed annually).  
  2. **Precedent rule**: A stretch becomes binding if:  
     - No rival frame gains >2/9 votes, *or*  
     - The slot is identical to a logged case.  
     - Triggers split/merger if >30% of annual slippage logs target the same slot.  
  3. **Contraction test**: During annual review, committee must name one *excluded* scenario per category. If impossible, category is suspended for redefinition.  
  4. **Severity separation**: Sanctions are decided *after* classification by the dean (with counsel).  

  ---  
  **Step-by-Step Procedure**  

  0. **Initial Filter (Triage Pair)**  
     - *Question*: Is there credible evidence that the act occurred and could damage the research record?  
     - *Sufficient answer*:  
       - **No**: Stop → **No finding**.  
       - **Yes**: Proceed to Step 1.  

  1. **Honest Error Check**  
     - *Question*: Is the act *explainable* as a non-negligent mistake (e.g., miscalculation, oversight) with no intent to deceive?  
     - *Sufficient answer*:  
       - **Yes**: Stop → **Honest error**.  
       - **No**: Proceed to Step 2.  
     - *Value judgment?*: No (fact-based).  

  2. **Fabrication Check**  
     - *Exemplar*: "Creating fake survey responses."  
     - *Question*: Were data/results invented *wholly from imagination* (not derived from any research activity)?  
     - *Sufficient answer*:  
       - **Yes**: Stop → **Fabrication**.  
       - **No**: Proceed to Step 3.  

  3. **Falsification Check**  
     - *Exemplar*: "Cropping a gel image to hide contradictory bands."  
     - *Question*: Was the research record (data, images, methods) *altered or omitted* to misrepresent actual findings?  
     - *Sufficient answer*:  
       - **Yes**: Stop → **Falsification**.  
       - **No**: Proceed to Step 4.  
     - *Slot identification*: If contested, name the slot (e.g., "what counts as a record?") and rival frames (e.g., "data vs. presentation").  

  4. **Plagiarism Check**  
     - *Exemplar*: "Copying a paragraph from another paper without citation."  
     - *Question*: Were *words or ideas from an external source* used without attribution?  
     - *Sufficient answer*:  
       - **Yes**: Stop → **Plagiarism**.  
       - **No**: Proceed to Step 5.  
     - *Slot identification*: If contested, name slot (e.g., "whose words?") and frames (e.g., "human author vs. AI tool").  

  5. **QRP Check**  
     - *Exemplar*: "Failing to disclose a conflict of interest that biased conclusions."  
     - *Question*: Did the act *damage the research record* but *not* involve fabrication, falsification, or plagiarism?  
     - *Sufficient answer*:  
       - **Yes**: Stop → **Questionable Research Practice (QRP)**.  
       - **No**: Proceed to Step 6.  
     - *Value judgment?*: **Yes** → Full committee votes (majority wins).  
     - *Slot identification*: Always name slot (e.g., "what damages the record?") and frames.  

  6. **Binding Precedent Check**  
     - *Question*: Does this case *exactly match* a prior logged case in the slippage ledger?  
     - *Sufficient answer*:  
       - **Yes**: Apply prior classification.  
       - **No**: Proceed to Step 7.  

  7. **No Finding or Referral**  
     - *Question*: Is there *any* category this case could fit via analogy?  
     - *Sufficient answer*:  
       - **Yes**: Refer to full committee → Debate using exemplar framing.  
       - **No**: Stop → **No finding**.  
     - *Stop point*: Committee vote fails twice → Escalate to legal counsel.  

  ---  
  ### What We Lose by Rejecting Definitions  
  - **Loss of "objective wrongness"**: Classifications become analogical, not truth-conditional. A verdict can't be "wrong," only "inconsistent with prior framings." This sacrifices rhetorical force but prevents gridlock.  
  - **Gain**: Decisiveness, auditability via slippage logs, and adaptability to new problems (e.g., AI).  

  ---  
  ### Self-Critical Flags  
  1. **Step 5 (QRP) value judgment**:  
     - *Contestable*: Relies on clinicians judging "damage to record" without field-specific expertise.  
     - *Empirical assumption*: That groups can reach majority consensus on values in <10 mins.  
  2. **Exemplar rigidity in Step 2–4**:  
     - *Contestable*: Over-prioritizes historical exemplars (e.g., "gel cropping" for falsification) over emerging issues.  
     - *Empirical assumption*: That people categorize better with concrete examples than abstract rules.  
  3. **Binding precedent rule**:  
     - *Contestable*: May entrench bad early decisions. Relies on slippage logs being meticulously maintained.  

  ---  
  ### Case Applications  
  **Case 1: Resident reuses her own methods text without attribution**  
  - **Step 0**: Evidence exists → Proceed.  
  - **Step 1**: Not an error (deliberate reuse) → Proceed.  
  - **Step 2**: No invented data → Proceed.  
  - **Step 3**: No alteration of data → Proceed.  
  - **Step 4**: Words reused without attribution. *Exemplar framing*: "Copying a paragraph from another paper is to plagiarism as this case is to 'whose words?'"  
    - *Slot*: Ownership of words (self vs. other).  
    - *Rival frames*: "Self-plagiarism is still plagiarism" vs. "Own words need no attribution."  
    - *Sufficient answer*: **Yes** (self-plagiarism fits analogy) → **Plagiarism**.  
  - **Verdict**: **Plagiarism** (overturns your "trivial" instinct; Step 4 does the work by treating "whose words?" as a stretchable slot, rejecting ownership as a categorical escape).  

  **Case 2: Postdoc uses undisclosed LLM for discussion, includes unsupported claims**  
  - **Step 0**: Evidence exists → Proceed.  
  - **Step 1**: Not an error (intentional use) → Proceed.  
  - **Step 2**: No invented data → Proceed.  
  - **Step 3**: No alteration of data → Proceed.  
  - **Step 4**: Words not from an external *human* source. *Exemplar framing*: "Copying a paragraph is to plagiarism as this case is to 'whether there is an author at all?'"  
    - *Slot*: Attribution target (human vs. AI).  
    - *Rival frames*: "AI as tool (no attribution needed)" vs. "AI as source (attribution required)."  
    - *Sufficient answer*: **No** (no consensus on AI as "author") → Proceed.  
  - **Step 5**: Undisclosed AI use + unsupported claims damage record. *Value judgment*: Committee majority agrees damage occurred.  
    - *Slot*: "What damages the record?" (misrepresentation + opacity).  
    - *Rival frames*: "Authorship transparency" vs. "Data integrity."  
  - **Verdict**: **QRP** (matches your expectation; quietly overrules your instinct that AI might fit falsification by separating data manipulation from narrative misrepresentation).  

  **Case 3: Technician splices gel lanes without disclosure**  
  - **Step 0**: Evidence exists → Proceed.  
  - **Step 1**: Not an error (trained behavior) → Proceed.  
  - **Step 2**: No invented data → Proceed.  
  - **Step 3**: Gel lanes altered/omitted → *Exemplar framing*: "Cropping a gel is to falsification as this case is to 'what counts as a record?'"  
    - *Slot*: Completeness of data representation.  
    - *Rival frames*: "Modern standards (full disclosure)" vs. "Historic norms (acceptable practice)."  
    - *Sufficient answer*: **Yes** (splicing misrepresents experimental conditions) → **Falsification**.  
  - **Verdict**: **Falsification** (confirms your "serious" instinct; Step 3 does the work by framing the record as the *actual experimental output*, not the intended result).  

  ---  
  ### Outcome Summary  
  - **Premise overturned**: Your instinct that reusing one's own words (Case 1) is trivial. The procedure treats plagiarism as strictly about *attribution*, not ownership, overriding "but it's mine!" as irrelevant.  
  - **All cases "comfortably" classified**: No referrals needed. The slippage ledger logs:  
    - Case 1: Plagiarism (slot: "whose words?"; frame: "words require attribution regardless of ownership").  
    - Case 2: QRP (slot: "what damages the record?"; frame: "opacity + misrepresentation").  
    - Case 3: Falsification (slot: "what counts as a record?"; frame: "data must represent actual experiments").  
  - **Contraction test implication**: At next review, committee must name an exclusion for falsification (e.g., "adjusting contrast evenly across a whole image"). If unable, category is frozen for redefinition.  

  This procedure trades philosophical "correctness" for operational clarity, using cognitive science to preempt framing battles. It’s imperfect but actionable—exactly what a committee of time-pressed clinicians needs.
