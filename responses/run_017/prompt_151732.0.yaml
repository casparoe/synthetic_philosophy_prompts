    Switch: B → C. Fee: $1.  
    Verification: Complete/transitive (only two options); C undominated (cheaper than B).  
  - **Step 3 (Menu: {C, A})**:  
    Ranking: A > C (without B, quality is salient).  
    Switch: C → A. Fee: $1.  
    Verification: Complete/transitive; A undominated (higher quality than C).  
  - **End**: Holds A again. Wealth: $W - 3.  
  Net loss per lap: $3. After 10 laps: $30 extracted.

  ### Structural Feature and Removal
  The key feature is **context-dependence via the compromise effect**: Adding or removing options shifts which attribute (price/quality) is salient, altering preferences.  
  If removed (menu-independent preferences), the agent would have fixed trade-offs. For example, if B > C in Step 1’s menu, she must rank B > C in Step 2’s menu and wouldn’t switch. Only with genuine intransitivity (e.g., B > C in one menu, C > B in another) could a similar pump occur, but our case avoids this by having transitive rankings in every menu.

  ### Verdict on Lines of Attack
  **(b) Myopia is the strongest line.** The agent evaluates each menu myopically without foresight. A sophisticated chooser, anticipating the cycle, would refuse the first switch to avoid net loss. This is not about context-sensitivity per se but about the failure to plan across time, which is the core vulnerability.  
  - *(a) Indexing*: Redefining outcomes to include context (e.g., "A-in-menu3") artificially creates intransitivity over indexed objects. But the money-pump argument targets physical outcomes (e.g., A itself), not contextual labels.  
  - *(c) Judgment error*: Context-sensitivity is a documented feature of human preferences (e.g., via attribute weighting), not necessarily an error. Preferences are coherent within menus, so this misdiagnoses the issue.

  ### Failure Type and Confidence
  - **Failure type**: Diachronic. The irrationality arises across time from myopic choice, not within a single moment (synchronic preferences are coherent in each menu).  
  - **Confidence**: 90%. This is a money pump in the sense that the agent’s choices are *exploitable under sequential myopia*, leading to guaranteed, avoidable losses.  
  - **Mind-changing observation**: If a sophisticated agent (foreseeing the cycle) still makes all switches due to context-dependence forcing immediate dominance violations, it would weaken the myopia claim. But in this case, sophistication would block the first switch.
