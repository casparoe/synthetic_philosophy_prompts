    The prediction is sealed in an envelope. The accuracy of our predictor in the past is about 85%. That is, it is correct about 85% of the time.

    After you choose, we will open the envelope to see the prediction and then give you the points you earned.

    Your earnings:
      - If you choose Choice 1 and Box A has 100 points, you earn 100 points.
      - If you choose Choice 1 and Box A is empty, you earn 0 points.
      - If you choose Choice 2, you earn the content of Box A plus 1 point. So if Box A has 100 points, you earn 101 points. If Box A is empty, you earn 1 point.

    Please make your choice privately on the ballot and hand it to the instructor.
