      If you have the lesion, you will die young unless you avoid smoking? That's not how it's framed.

    The standard smoking lesion:

      - Lesion: if present, reduces utility by a lot.
      - Smoking: gives a small pleasure.

      But the lesion is more common in people who would smoke. So:

          P(lesion | smoke) = high
          P(lesion | not smoke) = low

