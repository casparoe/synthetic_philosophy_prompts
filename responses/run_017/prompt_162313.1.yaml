    - In the debrief, we can show the actual accuracy of the predictor in Game 1 and the actual conditional probabilities in Game 2.

    - We also note that in Game 1, a student who two-boxes might argue: "The prediction is already made, so I might as well take both." But then they are likely to get only 1 point. Whereas in Game 2, a student who takes the pleasant option is likely to have the marker and get 99 points.

    - The third vote: we expect more students to be willing to pay for the intervention in Game 1 than in Game 2, because in Game 1 being a one-boxer causes the predictor to put the 100 points in the box, while in Game 2 being the kind of person who does not take the pleasant option does not cause the marker to be present; it is only correlated.

  ### Failure Modes

    1. **Students naming decision theories within the first ten minutes and derailing the exercise.**
       - Handle by: "For the purpose of this exercise, please set aside what you've read and focus on the games as they are presented. We will connect it to the theories in the debrief."

    2. **Students who try to game the predictor in Game 1.**
       - They might fill out the questionnaire dishonestly. We can't prevent that, but we can say: "Answer the questionnaire honestly, as you would in a real study." And then in the debrief, we can discuss how their attempt to game might have affected the predictor.

    3. **A student who refuses to play because the predictor or the setup feels illegitimate.**
       - Allow them to abstain. They can still participate in the discussion. In the debrief, discuss what feels illegitimate and why.

    4. **A split vote that calcifies into two camps talking past each other.**
       - In the small group discussion, assign specific questions: "In Game 1, what is the expected utility of one-boxing? of two-boxing? In Game 2, what is the expected utility of each choice? How do the causal structures differ?" Then in the whole group, have groups report on these questions.

    5. **85% predictor is not near-perfect.**
       - This changes the expected utility calculation. In the classic Newcomb with a near-perfect predictor, two-boxing always yields $1000+$10=$1010, while one-boxing yields $1,000,000. But with 85%, one-boxing yields on average $850,000 and two-boxing yields $101,000 (if we scale it). So one-boxing is still better. The argument for two-boxing is that you are better off by $10 no matter what, but the probability of the $1,000,000 is higher if you one-box. So the evidential decision theory still recommends one-boxing, and causal decision theory still recommends two-boxing.

    - In the debrief, we can show the expected utility calculations and note that with a less than perfect predictor, the expected utility of one-boxing is still higher, but the causal decision theorist doesn't care because they think the state is fixed.

  ### Limitations

    - The activity cannot reproduce the idealization to a near-perfect predictor. We have to explain that in the classic Newcomb, the predictor is near-perfect, and that makes the expected utility of one-boxing much higher than two-boxing, but the causal decision theorist still says to two-box.

    - The one-shot play cannot show the long-run difference between strategies. We can only show it by the expected utility calculation.

    - The metaphysics of what the predictor is sensitive to is not directly observable. We have to explain that in Game 1, the predictor is sensitive to your decision-making process, while in Game 2, the marker is not sensitive to your decision in the game.

    - We will have to say in the debrief: "In Game 1, if you change your decision procedure (e.g., decide to always one-box), then the predictor will adjust and put the 100 points in the box. In Game 2, if you change your decision procedure (e.g., decide to never take the pleasant option), that does not change the probability that you have the marker, because the marker is fixed by factors that are not affected by your procedure in this game."

    - What to say if the class demands the correct answer? "There is no universally agreed-upon 'correct' answer. The point is to understand the arguments and the role of causal structure. In Game 1, one-boxing yields a higher expected utility, but causal decision theory says to two-box. In Game 2, both decision theories might agree on taking the pleasant option because there is no causal influence and the expected utility is higher."

