              P(marker present | not take pleasant) = 0.15? Wait, we have:
              P(marker present | take pleasant) = 0.85
              P(marker present | not take) = 0.15
          But the payoffs are:

            Game 1:
              one-box: 100 with prob 0.85, 0 with prob 0.15 -> expected value 85
