    - In Game 1, the state (content of Box A) is caused by the prediction of your choice. In Game 2, the state (marker) and the choice are both caused by the common cause (impatience).

    - The sentence "the state is already fixed, so take the extra point" (or the pleasant option) is licensed in both. But in Game 1, if you two-box, you get the extra point and also sometimes the 100. In Game 2, if you take the pleasant option, you get the candy and also are more likely to have the marker.

    - However, the expected utility calculation shows that in Game 1, one-boxing is better (85 > 16), while in Game 2, taking the pleasant option is better (84 > 15).

    - The difference is in the causal structure: in Game 1, your choice does not cause the state, but the state is sensitive to your decision procedure (because the predictor is trying to anticipate it). In Game 2, your choice does not cause the state and the state is not sensitive to your decision procedure; it is only correlated via a common cause.

