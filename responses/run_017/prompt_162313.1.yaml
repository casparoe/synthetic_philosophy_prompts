      - Then, we flipped a biased coin to set whether you have the marker or not.
      - We set the probabilities such that:
            - Among people who choose to take the pleasant option, about 85% have the marker.
            - Among people who choose not to take the pleasant option, about 15% have the marker.

    Note: The marker status is already fixed and is not affected by your choice. However, the same factors (measured by the questionnaire) that influence your choice also influence the marker.

    Your earnings:
      - If you have the marker and you take the pleasant option: -100 + 1 = -99 points.
      - If you have the marker and you do not take the pleasant option: -100 points.
      - If you do not have the marker and you take the pleasant option: 1 point.
      - If you do not have the marker and you do not take the pleasant option: 0 points.

    After you choose, we will reveal your marker status and you will receive the points.
    ```

