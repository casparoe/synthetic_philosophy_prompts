    - 35-40 min: Reveal marker status and distribute points for Game 2. (5 min)
    - 40-45 min: Distribute the ballot for the third vote. Students vote. (5 min)
    - 45-60 min: Small group discussion: in groups of 4, discuss the two games and your choices. (15 min)
    - 60-75 min: Debrief with the whole class. (15 min)

    This is very tight. Alternatively, we can run the games without revealing the points until the end, to save time. Or we can reveal the points for both games at the end.

    Revised timeline to save time:

    - 0-5 min: Distribute and collect questionnaire.
    - 5-10 min: TA works on predictions/markers. Instructor gives intro and then distributes Game 1 rules.
    - 10-15 min: Students read Game 1 rules and vote.
    - 15-20 min: Collect Game 1 ballots. Distribute Game 2 rules.
    - 20-25 min: Students read Game 2 rules and vote.
    - 25-30 min: Collect Game 2 ballots. TA finishes preparing.
