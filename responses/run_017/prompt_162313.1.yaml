    ```

    **Handout 2: Game 1 Rules**

    ```
    Game 1: The Box Game

    In this game, there are two boxes:
      - Box A is opaque. It contains either 100 points or nothing.
      - Box B is transparent and contains 1 point.

    You must choose one of the following:
      - Choice 1: Take only Box A.
      - Choice 2: Take both Box A and Box B.

    How the content of Box A was determined:
      - We have already used your responses to the initial questionnaire to predict your choice.
