    We set the probability such that:
      - Among people who take the pleasant option, about 85% have the marker.
      - Among people who do not take the pleasant option, about 15% have the marker.

    Note: The marker status is fixed before you make your choice and is not influenced by your choice. However, the same factors that influence the marker also influence your choice.

    Your payoff:
      - If you have the marker and you take the pleasant option: -100 + 1 = -99 points.
      - If you have the marker and you do not take the pleasant option: -100 points.
      - If you do not have the marker and you take the pleasant option: 1 point.
      - If you do not have the marker and you do not take the pleasant option: 0 points.

    After you make your choice, we will reveal your marker status and you will receive the points.
    ```

    Now the expected utilities are:

        take: 0.85 * (-99) + 0.15 * 1 = -84.15 + 0.15 = -84
        not take: 0.85 * 0 + 0.15 * (-100) = -15   [I think I swapped the conditional probabilities]

    Let me check the conditional probabilities:

        P(marker present | take pleasant) = 0.85  -> then P(marker absent | take) = 0.15
        P(marker present | not take) = 0.15 -> then P(marker absent | not take) = 0.85

    So for take:
        marker present (0.85): -99
        marker absent (0.15): 1
        expected value = 0.85*(-99) + 0.15*1 = -84.15 + 0.15 = -84

    for not take:
        marker present (0.15): -100
        marker absent (0.85): 0
        expected value = 0.15*(-100) + 0.85*0 = -15

    So not take has higher expected utility.

    In this game, a causal decision theorist would take the pleasant option because it doesn't cause the marker and you might as well get the point. But then they risk being in the 15% who have the marker and get -99, while if they don't take, they might be in the 15% who have the marker and get -100 or in the 85% who don't and get 0.

    The expected utility of taking is -84, which is worse than not taking (-15). So even though the causal decision theorist might want to take the point, the numbers are against them? 

    But the causal decision theorist doesn't maximize expected utility conditional on the act; they maximize expected utility using the causal structure. They would say: "My choice does not cause the marker, so I should ignore the correlation. The marker is fixed, so I should take the pleasant option to gain 1 point regardless of the marker."

    How do they compute expected utility? They would use the unconditional probabilities or condition on the causal parents. In this case, since the marker is not caused by the choice, they would use:

        EU(take) = P(marker present) * (-99) + P(marker absent) * (1)
        EU(not take) = P(marker present) * (-100) + P(marker absent) * (0)

    What is P(marker present)? We said overall 50%. So:

        EU(take) = 0.5 * (-99) + 0.5 * 1 = -49.5 + 0.5 = -49
        EU(not take) = 0.5 * (-100) + 0.5 * 0 = -50

    So they would take.

    Therefore, the evidential decision theorist would not take (because -15 > -84) and the causal decision theorist would take (because -49 > -50).

    This is the conflict we want.

    So in Game 2, we must make sure to explain to the causal decision theorist that they should not condition on the act but should use the causal structure. This might be advanced for the students.

    In the debrief, we will have to explain both methods.

