    So let's change Game 2 to this.

    **Revised Game 2 Rules Handout**:

    ```
    Game 2: The Medical Test

    We are conducting a medical study. You will be tested for a genetic marker. If you have the marker, you will lose 100 points (because it indicates a condition that is costly to treat). If you do not, you lose 0 points.

    However, you have a choice to make first:

