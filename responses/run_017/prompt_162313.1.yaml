  ### Facilitator's Packet for Rational Choice Seminar Session  

  **Session Goal:** Students re-encounter Newcomb-style disagreement in two novel, high-stakes games with identical probabilities/payoffs but different causal structures. They confront the gap between causal and evidential reasoning without relying on prior philosophical labels.  

  ---

  ### **Game 1: The Prediction Game**  
  *Rules Handout (Photocopy and Distribute)*  
  ```  
  **The Prediction Game**  

  - **Setup**:  
    - Box A is sealed and contains **either 100 points or 0 points**.  
    - Box B is transparent and contains **1 point**.  
  - **Prediction Mechanism**:  
    - Before today, you answered a "Time Preference Survey" (see back). We used your responses to predict your choice.  
    - If we predicted you will take **ONLY BOX A**, we placed 100 points in Box A.  
    - If we predicted you will take **BOTH BOXES**, we placed 0 points in Box A.  
  - **Accuracy**: Our predictor is **85% accurate** (it matches actual choices 17 times out of 20 in tests).  
  - **Your Choice**:  
    - Option 1: Take ONLY BOX A.  
    - Option 2: Take BOTH BOXES.  
  - **Payoffs**:  
    - Only Box A: 100 points (if predicted correctly) or 0 points (if predicted wrong).  
    - Both Boxes: 101 points (if predicted to take both) or 1 point (if predicted to take only A).  
  - **Procedure**:  
    1. Your prediction is sealed in an envelope with your name.  
    2. Choose privately on the ballot.  
    3. After all choices, we reveal predictions and distribute points.  

  *Time Preference Survey (From Start of Class)*  
  1. Would you rather have $50 today or $60 in a month?  
  2. Would you rather have $100 in 6 months or $120 in 1 year?  
  3. Would you rather have $200 now or $250 in 6 months?  
  ```  

  **Ballot (Private, Collect Immediately After Choice)**  
  ```  
  Name: __________  
  [ ] Take ONLY BOX A  
  [ ] Take BOTH BOXES  
  ```  

  **Predictor Setup & Verification**  
  - **Pre-Session**: Score surveys: "Patient" = chose delayed reward in ≥3/3 questions. Predict "ONLY BOX A" for patient respondents, "BOTH" for impatient.  
  - **Accuracy Control**: Disclose: "Accuracy is 85% based on past classes." (Actual accuracy may vary; adjust post-hoc if needed by sharing class data.)  
  - **Sealing**: Pre-session, place predictions in individual envelopes. Students witness sealing. Post-game, open envelopes publicly to compare predictions vs. choices.  

  ---

  ### **Game 2: The Medical Marker Game**  
  *Rules Handout (Photocopy and Distribute)*  
  ```  
  **The Medical Marker Study**  

  - **Setup**:  
    - A **genetic marker** (tested post-choice) gives **+100 points** if absent. If present, it gives **0 points** (it indicates a costly health condition).  
    - You may take a **pleasant option** (a piece of chocolate) for **+1 point**.  
  - **Marker Probability**:  
    - Among those who take the pleasant option, **85% have the marker** (lose 100 points).  
    - Among those who decline, **15% have the marker**.  
  - **Causal Note**: The marker is fixed before your choice (via genetics/lifestyle) and is **not caused by your choice**.  
  - **Your Choice**:  
    - Option 1: **Decline** the pleasant option.  
    - Option 2: **Take** the pleasant option.  
  - **Payoffs**:  
    - Decline: 100 points (if marker absent) or 0 points (if present).  
    - Take: 101 points (if marker absent) or 1 point (if present).  
  - **Procedure**:  
    1. Choose privately on the ballot.  
    2. After choices, we test for the marker (via pre-determined lottery).  
    3. Points distributed.  
  ```  

  **Ballot (Private, Collect Immediately After Choice)**  
  ```  
  Name: __________  
  [ ] Decline the pleasant option  
  [ ] Take the pleasant option  
  ```  

  **Marker Setup & Verification**  
  - **Pre-Session**: Assign marker status using survey scores:  
    - "Patient" (≥3/3 delayed choices): 15% chance of marker (roll die: 1–15 on d100 = marker).  
    - "Impatient": 85% chance (1–85 on d100 = marker).  
  - **Correlation Check**: Post-game, compare marker frequency in takers vs. decliners. Disclose: "Marker is fixed pre-choice; your choice only *correlates* with it."  

  ---

  ### **Third Vote: Intervention Worthiness**  
  *Ballot (Private, After Both Games)*  
  ```  
  Would you pay **10 points** (deducted from your total) for an intervention making you:  

  - **In Game 1**: The type who takes ONLY BOX A?  
    [ ] Yes  [ ] No  
  - **In Game 2**: The type who DECLINES the pleasant option?  
    [ ] Yes  [ ] No  
  ```  

  ---

  ### **Session Timeline (75 Minutes Total)**  
  1. **0–5 min**: Collect pre-session "Time Preference Surveys" (already completed).  
  2. **5–15 min**: Distribute Game 1 rules. Students vote privately. Collect ballots.  
  3. **15–25 min**: Reveal Game 1 predictions. Distribute points.  
  4. **25–35 min**: Distribute Game 2 rules (frame as unrelated medical study). Students vote privately. Collect ballots.  
  5. **35–45 min**: Reveal Game 2 marker status. Distribute points.  
  6. **45–50 min**: Third vote (intervention worthiness). Collect ballots.  
  7. **50–65 min**: **Small-group discussion (3–4 students)**:  
     - "What was your expected utility for each choice in Game 1? In Game 2?"  
     - "Why did you value the intervention differently in the two games?"  
  8. **65–75 min**: **Debrief (Whole Class)**:  
     - Display aggregated choices and intervention votes.  
     - **Map to Dispute**:  
       - *Identical Sentences*: "The state (prediction/marker) is fixed, so take the extra point!"  
         - Cost in Game 1: One-boxers avg. ~85 pts; two-boxers avg. ~16 pts (lose ~69 pts).  
         - Cost in Game 2: Decliners avg. ~15 pts; takers avg. ~84 pts (gain ~69 pts).  
       - *Causal Structure Difference*:  
         - Game 1: Predictor is sensitive to your decision-making *process*. If you pre-commit to one-box, you *cause* the $100 to appear.  
         - Game 2: Marker only *correlates* with your trait. Changing your choice doesn’t alter the marker.  
       - *Coin-Flips*: If a student announced, "I’ll flip a coin!" in Game 1:  
         - Predictor accuracy drops → Expected value plummets.  
         - In Game 2, coin-flips don’t alter expected value.  
     - **Consistency Cost**:  
       - Causal theorists: Lose in Game 1 (two-boxing nets ~16 pts) but win in Game 2 (taking nets ~84 pts).  
       - Evidential theorists: Win in Game 1 (one-boxing nets ~85 pts) but lose in Game 2 (declining nets ~15 pts).  

  ---

  ### **Predictable Failure Modes & Solutions**  
  1. **Students Derail with Decision Theory Jargon**:  
     - *Solution*: "Set aside labels for now. Focus on choices in *this room* with *these stakes*." Redirect to expected utility calculations.  
  2. **Students Try to "Fool" Predictor**:  
     - *Solution*: "You’re welcome to try! But note: the predictor uses pre-choice data." Post-game, show how attempts fared (most fail; predictor still ~85% accurate).  
  3. **Student Refuses to Play**:  
     - *Solution*: Allow abstention. Assign them as an observer: "Track how causal structure affects others’ choices."  
  4. **Vote Calcifies into Camps**:  
     - *Solution*: In small groups, assign specific calculations: "Compute expected utility for both choices in Game 1 if predictor is 85% accurate." Force engagement with numbers.  
  5. **85% ≠ Near-Perfect Predictor**:  
     - *Solution*: Acknowledge quietly: "With 85% accuracy, two-boxing’s expected utility (~16) is still far below one-boxing (~85). The logical gap remains, but magnitudes shrink."  

  ---

  ### **What This Activity Cannot Do (Limitations Note)**  
  1. **Reproduce Near-Perfect Prediction**:  
     - 85% accuracy weakens the dominance argument for two-boxing (since one-boxing still wins on EV). *Supply verbally*: "In the classic case with 99.9% accuracy, two-boxing feels dominant, yet one-boxing massively outperforms long-term."  
  2. **Show Long-Run Strategy Effects**:  
     - One-shot play obscures repeated-game advantages. *Supply verbally*: "If played 100 times, one-boxers build a reputation that fills Box A."  
  3. **Resolve the Metaphysics**:  
     - "What the predictor senses" (decision process) vs. "what the marker tracks" (distal cause) is abstract. *Supply verbally*: "The predictor’s sensitivity to your *reasoning* changes the causal topology."  
  4. **Deliver a Verdict**:  
     - Activity produces choices *and* disagreement. *Declare openly*: "No ‘right answer’ exists. The goal is to map the rift between causal and evidential reasoning."  

  ---

  ### **When Students Demand "The Correct Answer"**  
  - **Response**: "I won’t give one. Philosophy isn’t done by authority. Instead, let’s dissect the cost of consistency:  
    - If you always ignore correlations (two-box + take), you gain in Game 2 but lose in Game 1.  
    - If you always follow correlations (one-box + decline), you win in Game 1 but lose in Game 2.  
    Your third vote shows where your allegiance wavers. That tension *is* the lesson."  

  ---  
  **Materials Provided**: Rules sheets, ballots, timeline, debrief guide.  
  **No Tech Needed**: All mechanics run manually. Use dice for marker lottery.  
  **Outcome**: Students experience the Newcomb split *behaviorally*, setting up deeper meta-ethical discussion in future sessions.
