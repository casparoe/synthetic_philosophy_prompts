    **Third Vote Ballot**:

    ```
    Third Vote

    Would you pay 10 points (which will be deducted from your total points from the two games) for an intervention that would make you the kind of person who:

      In Game 1: takes only Box A (Choice 1)?
          [ ] Yes
          [ ] No

      In Game 2: does not take the pleasant option (Option 1)?
          [ ] Yes
          [ ] No
    ```

    **Timeline**:

    - 0-5 min: Distribute and collect the initial questionnaire.
    - 5-10 min: While TA is working, instructor introduces the session. Then distribute Game 1 rules and ballot.
    - 10-15 min: Students vote for Game 1.
    - 15-20 min: Collect Game 1 ballots. Distribute Game 2 rules and ballot.
    - 20-25 min: Students vote for Game 2.
    - 25-30 min: Collect Game 2 ballots. TA finishes preparations.
    - 30-40 min: Reveal Game 1 predictions and distribute points. Then reveal Game 2 markers and distribute points.
    - 40-45 min: Distribute and collect the third vote.
    - 45-60 min: Small group discussion (groups of 4) on: 
          - What were the expected utilities for each choice in each game?
          - How did the causal structures differ?
          - Would you change your choices if you played again?
    - 60-75 min: Whole class debrief. 
          - Compare the two games: same conditional probabilities, different causal structures.
          - Show that in Game 1, one-boxing has higher expected utility (85 > 16) and in Game 2, taking the pleasant option has higher expected utility from a causal perspective (-49 > -50) but lower from an evidential perspective (-84 < -15). 
          - Discuss the third vote: why might someone pay for the intervention in Game 1 but not in Game 2?
          - Highlight the role of the predictor being sensitive to your decision procedure in Game 1.

    **Failure Modes and Handling** (as above)

    **Limitations Note** (for the instructor):
      - The predictor is only 85% accurate, not near-perfect. This means that one-boxing is not guaranteed to give 100 points, but it is still better on average.
      - The common cause in Game 2 is measured by a questionnaire, which is a proxy. The conditional probabilities might not be exactly 85% and 15% in the actual play.
      - The activity does not reproduce the long-run behavior.
      - The metaphysics of what the predictor is sensitive to might be hard to grasp; it requires explanation.

    **What to say about the correct answer?**
      - "There is no consensus. The point is to understand the arguments. In Game 1, if you are an evidential decision theorist, you one-box; if you are a causal decision theorist, you two-box. In Game 2, the evidential decision theorist does not take the pleasant option, while the causal decision theorist does."

    This is a complex session, but it should achieve the goals.
