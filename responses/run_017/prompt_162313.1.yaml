    **Handout 3: Game 2 Rules**

    ```
    Game 2: The Medical Test

    In this game, you will be tested for a genetic marker. The marker is present in about 50% of people. If you have the marker, you will lose 100 points (because it indicates a condition that is costly to treat). If you do not have the marker, you lose 0 points.

    You have a choice to make first:
      - Option 1: Not take the pleasant option (which is free, so no change in points).
      - Option 2: Take the pleasant option (a piece of candy) and gain 1 point.

