prompt: |-
  hi, I'm in year 12 doing a levels in chemistry, maths and computer science. chemistry is my best subject, I'm on for an A and I actually enjoy the organic stuff, so please don't dumb anything down. I also don't want this turned into a chemistry lesson either, if that makes sense.

  so I went to a philosophy taster day at a uni near us last month and one of the grad students talked about this thought experiment — twin earth I think its called, Putnam, some american philosopher from decades ago. The setup as I remember it: there's a planet basically identical to earth where the stuff in the lakes and rivers looks and tastes and behaves exactly like water, boils at the same temp, dissolves the same things, but its actual microscopic structure is different, some complicated formula they just label XYZ instead of H2O. The claim was that when earth people say water they mean H2O, and when the twin earth people say water they mean XYZ, even though everyone is psychologically identical and back in the 1700s or whatever nobody on either planet knew the formula for their own liquid. And the conclusion was something like: meaning isn't in your head, what a word picks out is fixed by what's actually out there in the world, not by what you believe about it.

  Here's what I actually want. Restate that whole argument as faithfully as you can in the vocabulary I use in chemistry — substance vs sample, empirical vs structural vs displayed formula, macroscopic properties versus microstructure, allotropy and isomerism where two things have the same formula but a different arrangement and count as different substances, purity and impurity, mixtures and mole fractions, that kind of thing. Give me the mapping explicitly, like what plays the role of H2O, what plays the role of XYZ, what plays the role of the 1700s when nobody knew the structure, what plays the role of the guy on earth and his twin.

  Then the part I actually care about: the residue report. What translates cleanly, what you had to bend to make it fit, and what has no expression in chemistry at all. My guesses are that the "isn't in your head" bit and the bit where water apparently couldn't have been anything other than H2O are the awkward ones, because chemistry tells you what stuff is, not what it had to be, and it says nothing about what's going on in anyone's mind. But I want you to do it properly, and I especially want to know whether the residue is a limit of chemistry as a vocabulary or a sign that the philosophy was vaguer than it sounded.

  One more thing, and please deal with this rather than skipping to the standard answer. I made up a version in the pub with my mate and nobody could settle it. Forget two planets: imagine one planet where the liquid in the lakes is a mixture of H2O and XYZ, and the proportion changes gradually as you travel, so its basically pure H2O at one end and basically pure XYZ at the other with a continuous gradient in between, and the mixture behaves like water to us at every point along it. What does water refer to on that planet, and does translating into chemistry help or does the gradualness wreck the whole story? I have a feeling the answer turns on how chemistry itself decides when a mixture stops counting as a substance and starts counting as a contaminated one, which always seemed a bit arbitary to me in the markscheme anyway. Is that a real insight or am I just importing a chemistry habit and calling it philosophy?
