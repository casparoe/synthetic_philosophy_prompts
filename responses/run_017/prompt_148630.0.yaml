  Or:

  We can combine (4) and (5) and spend 5 min on both.

  But note: the partitioning part is the hardest and most important, so it should have the most time.

  Alternatively, we can cut the MoE example short and let them think about it after the talk.

  (11) Version Notes:
  - IIT has evolved (from 1.0 to 4.0). We are explaining the core concepts that are consistent across versions: cause-effect power, irreducibility, partitions, and Φ as the measure of integration.
  - Recent versions (3.0 and 4.0) have a more complex definition of systems (including requirements for having a cause-effect structure that is maximally irreducible) and Φ is defined for a set of elements in a state. We are not going into the details of the "unfolding" of the system over time or the requirement for a maximum of Φ over partitions and subsystems.

  Given the audience and time, we stick to the foundational ideas.

  Final Plan:

  Whiteboard:

  1. Draw two binary nodes A and B, connected both ways. 
     - State: A=0, B=0.
     - Cause: What could have led to this? (Both 0 in the past, because they copy each other)
     - Effect: What will happen? (Both 0 in the future, assuming no change).

  2. Partition: Cut the connection. Now we have two independent nodes.
     - Cause for A=0: could be anything? But without the connection, we lose the constraint that B must have been 0. Similarly for effect.
     - The cause-effect repertoire for the partitioned system is different (less constrained) than for the whole.

  3. Calculate the difference (using a simple metric, e.g., the Kullback-Leibler divergence). The amount of information lost by partitioning is the integration. Φ is the minimal such loss over all partitions.

  4. Now, draw a system with multiple modules. Each module is like the two-node system (so has internal Φ) but the modules are independent. The whole system has low Φ because partitioning between modules loses nothing.

  5. Draw a feedforward network (three layers, no feedback). Show that without feedback, the system at a given time step has no cause-effect power on its own past (because the past is fixed) and future is determined by inputs. So the cause-effect repertoire is minimal? Actually, without feedback, the system is not considered to have a state that persists. IIT requires a system with feedback to have a cause-effect repertoire that is non-trivial.

  6. For the MoE: draw 64 boxes (experts) and a router. For a given input, two experts are activated. The rest are idle. The system is not integrated because the idle experts are not part of the current cause-effect structure.

  Check Question (at 25 min):
  - "In our MoE model, if we consider the entire system (all 64 experts and the router) as one entity, why might Φ be low?"

  Answer: Because the system can be partitioned into the experts and the router without much loss of cause-effect power, since only two experts are active at a time and they are largely independent of the rest.

  This should set them up to reason about the MoE.

