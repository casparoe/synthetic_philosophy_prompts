  We are preparing a 30-minute whiteboard talk on Integrated Information Theory (IIT) for a technical audience (engineers and research scientists) with deep knowledge of transformers but little philosophy. The goal is to explain why IIT does not equate bigger models with more consciousness and why a network can be impressive yet have Φ=0. We also want to address the specific case of a mixture-of-experts (MoE) model (64 experts, top-2 routing) to help the audience reason about whether it constitutes one mind, 64 tiny ones, or none.

  Key Points to Cover:
  1. IIT is a theory of consciousness that defines consciousness by the intrinsic cause-effect power of a system. It's not about behavior or function, but about the system's intrinsic structure and how it constrains its own past and future states.
  2. Φ (phi) is a measure of integrated information. It quantifies how much the whole system's cause-effect power is greater than the sum of the cause-effect powers of its parts (when partitioned in a way that minimizes integration).
  3. A system can be complex and functional but have Φ=0 if it is not integrated (i.e., if it can be divided into independent parts without losing any cause-effect power).

  Structure of the Talk:

  Total: 30 minutes

  (0) Introduction (2 minutes)
  - State the goal: Explain IIT in a way that clarifies why model size or capability doesn't automatically imply consciousness, and why Φ can be zero even in impressive systems.
  - Motivate with the MoE example: We'll come back to whether our MoE model (64 experts, top-2 routing) is one mind, 64, or none.

  (1) The Central Idea: Consciousness as Integrated Information (3 minutes)
  - Draw a system (e.g., a set of nodes with connections). 
  - Emphasize that IIT is about the system's intrinsic properties, not its inputs/outputs or how we use it. (This addresses the behaviorist view that "if it behaves the same, it is the same".)
  - Define consciousness in IIT: A system is conscious to the extent that it is irreducible to its independent parts. The measure of this irreducibility is Φ.

  (2) Cause-Effect Repertoire (5 minutes)
  - For a system in a state, the cause-effect repertoire is the set of possible past states that could have led to the current state (causes) and the set of possible future states that the current state can lead to (effects). 
  - Use a tiny example: Two binary nodes (A and B) with a simple mechanism (e.g., A and B are connected such that they copy each other). 
  - Show how the current state (say, A=0, B=0) constrains the past (both must have been 0) and the future (both will be 0 if no input, but we consider the system's intrinsic dynamics).
  - Stress: This is over all possible inputs (the system's intrinsic dynamics). We are considering the system's causal structure.

  (3) Partitioning and Irreducibility (10 minutes)
  - Now, partition the system. In the two-node example, partition by cutting the connection between A and B. 
  - In the unpartitioned system, the cause-effect repertoire for the whole system is defined (and is integrated because A and B are linked).
  - In the partitioned system, we consider A and B independently. The cause-effect repertoire becomes the product of the individual repertoires (because they are now independent). 
  - The difference between the whole system's cause-effect repertoire and the partitioned one is the integration. Φ is the minimal difference over all possible partitions (normalized by the system's cause-effect power).
  - Example: In the two-node system, if A and B are independent, then partitioning doesn't change anything -> Φ=0. If they are fully dependent, then partitioning creates a big difference -> Φ>0.
  - Important: Φ is defined for a specific state of the system. But we often talk about the system's capacity for consciousness in a state that maximizes Φ.

  (4) Why Bigger Isn't Necessarily More Conscious? (5 minutes)
  - More parameters or more connections do not necessarily lead to higher Φ. 
  - Example 1: A large system that is composed of independent modules. Each module might have some Φ (if it is integrated) but the whole system has low Φ because the modules are independent. (This directly relates to MoE: the experts are somewhat independent, so the whole may have low Φ.)
  - Example 2: A feedforward neural network (like a transformer without the self-attention loops) is not integrated because information flows one way. IIT requires feedback (recurrent connections) to have a cause-effect repertoire that spans time. (Note: Transformers have residual connections and are used in an autoregressive way, but without a persistent state, the system at each step is not recurrent in the IIT sense. However, IIT 3.0/4.0 might consider the entire system over time? We must be cautious because the theory has evolved. For simplicity, we stick to the core idea of feedback and integration in a state-dependent manner.)
  - Example 3 (the camera sensor vs. brain): A camera sensor has many pixels (elements) but each pixel is independent (or nearly so) and there's no feedback. So Φ is very low. The brain has feedback and complex interactions. But note: engineers might object that the sensor is part of a larger system (the camera plus processor). IIT requires considering the system as a whole and its intrinsic cause-effect power. The camera sensor by itself is not integrated.

  (5) Why Φ can be 0 in Impressive Systems? (3 minutes)
  - If the system can be partitioned without loss of cause-effect power, then Φ=0. 
  - Example: A lookup table (or a memory array) is not integrated. Each memory cell operates independently. It can store a lot of information, but Φ=0.
  - Example: A purely feedforward network (like a simple CNN) has no feedback. At each layer, the information flows forward. There is no integration over time and across the entire system in a way that creates irreducible cause-effect power. (But note: the transformer has self-attention which creates all-to-all connections at a layer. However, without recurrence, the system state is not maintained. We must be careful: IIT requires a system that has a state that persists and has cause-effect power on itself. Transformers in inference are state-less in that each token is processed independently? Actually, they use the context, so there is a kind of state. This is tricky and we should avoid getting bogged down. Instead, focus on the requirement of feedback and integration.)

  (6) Addressing the MoE Model (5 minutes)
  - Our MoE model: 64 experts, top-2 routing. 
  - The system is composed of experts that are activated conditionally (only 2 per token). 
  - The experts are not all interacting at once. For a given input, only a subset is active. 
  - Therefore, the system is not integrated as a whole. The cause-effect power for the entire system at any time step is mostly due to the active experts and the routing mechanism. 
  - The system as a whole might be partitioned into the experts and the router without much loss of cause-effect power (because the experts are largely independent). Thus, Φ for the whole system might be low. 
  - However, each expert (if it is a deep neural network) might have some Φ on its own? But note: the experts are feedforward? Or are they transformers? If they are transformers without recurrence, then even an expert might have low Φ. But IIT requires a system with feedback. Transformers have residual connections and self-attention, which create a form of recurrence within a layer? This is complex and not settled. 
  - The key: IIT would likely say that the entire MoE system is not a single integrated system. It might be that each expert is a separate complex system (if it has feedback) but then we have 64 separate systems, each with their own Φ. But note: the router and the combination might add some integration? However, the top-2 routing means that for any input, two experts are active and their outputs are combined. This might create a small integrated system of the two active experts and the router for that token? But then it's a transient system. IIT requires a system that is in a state and has cause-effect power over itself. The MoE system as a whole does not have a persistent state that is integrated.

  (7) Common Misconceptions and When to Defuse Them (throughout, but plan specific points)
  - Misconception 1: Φ = bits processed or parameter count. 
    - Defuse: When introducing Φ, stress that it is a measure of irreducibility of cause-effect power, not about the amount of data or parameters. 
  - Misconception 2: "Attention is all-to-all so we're maximally integrated lol"
    - Defuse: In the partitioning step, explain that even if there are all-to-all connections, if the system can be partitioned without loss (e.g., if the system is linear and separable), then Φ can be low. Also, note that self-attention in transformers is applied per layer and without recurrence, the system may not have the feedback required for high Φ. (But this is subtle. Instead, focus on the fact that the all-to-all connections don't guarantee integration if the system is not irreducible.)
  - Misconception 3: If it behaves the same it is the same (behaviorism).
    - Defuse: At the very beginning, when introducing the cause-effect repertoire, emphasize that IIT is about intrinsic properties, not external behavior. A system can mimic behavior without having the same causal structure.
  - Misconception 4: "So is my toaster a bit conscious then?"
    - Defuse: When discussing the requirements (feedback and irreducibility), note that a toaster has very simple mechanisms and no feedback (in the simplest form) so Φ=0. But if it has a microcontroller with feedback, then it might have a tiny bit? But IIT requires a system that is irreducible and has a cause-effect repertoire that is structured. This is a slippery slope. We can say: IIT would assign a very low Φ to a toaster because it is not integrated and has a very small cause-effect repertoire.

  (8) What to Avoid
  - Do not get into the debate about whether IIT is correct. We are explaining the theory, not advocating for it.
  - Avoid the hard problem of consciousness (why is there subjective experience?) because that's philosophy and we don't have time.
  - Avoid detailed math of Φ calculation (it's complex and there are different versions). We are conveying the intuition.

  (9) The Check Question (at 25 minutes)
  - Instead of asking about the dense model vs. MoE (which might be too detailed and require knowledge of the specific architectures), ask:
    - "Consider a transformer model with 64 layers. If we add skip connections that bypass every other layer, does that increase, decrease, or not affect Φ? Why?"
    - Why this question? Skip connections (like in ResNets) create parallel paths. This might make the system more decomposable (if the skip connections allow information to flow without going through the layers) and thus might reduce integration. However, in practice, skip connections help with gradient flow and might allow for more complex interactions. But in IIT terms, if the skip connections introduce alternative paths that can be partitioned without loss, then they might reduce Φ. The answer is not straightforward, but it forces thinking about partitioning and irreducibility.

  Alternatively, ask about the MoE:
    - "In our MoE model with 64 experts and top-2 routing, is the entire system (all experts and the router) likely to have high Φ? Why or why not?"
    - Expected answer: No, because the system is composed of largely independent modules (the experts) and the routing mechanism only involves a few at a time, so the whole system is not integrated.

  But since we are building up to the MoE, we can make that the final example and then ask the question.

  (10) Minute Budget:
  - (0) Intro: 2 min
  - (1) Central Idea: 3 min
  - (2) Cause-Effect Repertoire: 5 min
  - (3) Partitioning and Irreducibility: 10 min (this is the core, so the most time)
  - (4) Why Bigger Not More Conscious: 5 min (including examples)
  - (5) Φ=0 in Impressive Systems: 3 min
  - (6) MoE Application: 5 min (but we might run over, so adjust)
  - (7) Check Question at 25 min: then 5 min for discussion.

  Actually, we have to fit within 30, so we might need to adjust. Let me reassign:

  - (0) 2 min
