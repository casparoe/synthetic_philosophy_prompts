answer: |-
  ### Thought Experiment: Vaccine Batch Efficacy  
  In a pharmaceutical quality control lab, technicians test influenza vaccine vials for efficacy. Vials arrive in dated batches (A: April 30, B: May 10, C: May 20). All vials tested before May 15 (batches A and B) show full efficacy. Unbeknownst to the lab, a refrigeration failure on May 5 exposed batch B to damaging heat, but this wasn’t recorded. Batch C was stored correctly. Testing occurs in batch order. As of May 14, 100 vials from batches A/B are tested and effective. On May 16, batch C testing begins. Two hypotheses fit the data:  
  - **H-plain**: All vials are effective.  
  - **H-grue**: Vials tested before May 15 are effective; those tested after are ineffective.  

  H-grue is correct because batch B’s thermal damage causes failure, and batch B/C testing aligns with post-May 15 timing.

  ---

  ### Analysis of Projection Criteria  

  **(a) Entrenchment Criterion**  
  Goodman holds that predicates gain projectibility through frequent past projection. "Effective" is deeply entrenched here: lab history shows consistent success projecting it for vaccines, while time-indexed predicates like "effective-if-tested-before-t" have never been projected. Thus, entrenchment favors H-plain.  

  **(b) Structural Simplicity Criterion**  
  Simplicity prioritizes predicates not indexed to specific times/places. H-plain uses "effective," syntactically simple and free of arbitrary temporal markers. H-grue’s "effective-if-tested-before-May-15" explicitly references a calendar date, making it structurally complex. Simplicity favors H-plain.  

  **(c) Causal-Structure Criterion**  
  Projectible predicates should track causally homogeneous kinds. Here, efficacy depends on *batch storage conditions*: Batch A (cold) and C (cold) share a causally efficacious property (thermal stability), while Batch B (heated) does not. "Tested after May 15" correlates perfectly with *batch order*, acting as a proxy for the unobserved thermal variable. Thus, H-grue aligns with the causal structure, while H-plain falsely assumes thermal homogeneity.  

  **Verdict**: Inquirers should project H-grue. The causal criterion (c) is decisive: entrenched and syntactically simple predicates are misleading when decoupled from underlying causal mechanisms. This agrees with (c).  

  ---

  ### Three Notes  

  1. **Crucial Feature and Its Removal**  
     The enabling feature is the *causal link* between batch sequence and thermal damage, with test dates acting as a reliable proxy. If removed (e.g., testing is random, not batch-ordered), "tested after t" loses its causal grounding. Entrenchment and simplicity would still favor H-plain, while the causal criterion would lack grounds to prefer H-grue—reverting to a standard Goodman case.  

  2. **Endorsement: Grue or Neighbor?**  
     Criterion (c) primarily endorses the predicate indexed to *thermal history*, not directly to test time. However, since test date perfectly tracks batch (and thus thermal history) in this setup, H-grue inherits projectibility. If test dates were noisy proxies (e.g., some Batch B tested post-May 15), only the thermal-indexed predicate would be projectible, weakening H-grue’s warrant.  

  3. **Entrenchment Theorist’s Defense**  
     An entrenchment theorist could argue: Once technicians discover batch sequencing, they project "thermal stability" (not grue), so entrenchment wasn’t violated—just temporarily incomplete. *Reply*: This concedes that *during the discovery phase*, grue-shaped projection was warranted despite lacking entrenchment, showing entrenchment is not necessary for warrant. The defense does not fully defuse the case.  

