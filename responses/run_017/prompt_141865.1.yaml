answer: |-
  Your diagnosis is sharp: the stalemate *is* significantly verbal, masking a deeper substantive disagreement about the nature of blame itself. The confusion around "standing" acts as a semantic fog bank, but beneath it lies a fundamental clash between competing conceptions of blame's core function and structure. Here's a breakdown:

  1.  **The Verbal Knot: "Standing" as a Conflation Point**
      Your carve-up (a)-(d) is precisely right. When participants say "the hypocrite lacks standing," they conflate distinct concepts:
      *   **(a) Normative Power/Speech-Act Felicity:** The hypocrite *cannot successfully perform the speech-act* of blame-as-demand. Their utterance misfires because it presupposes an authority or commitment they lack (like demanding rent after selling the property). This is a pre-condition for the act *being* blame (in this performative sense).
      *   **(b) Moral Wrongness of the Act:** The hypocrite *can* successfully blame (the speech-act works), but *doing so* is morally wrong (unfair, manipulative, vicious). This evaluates the *act* of blaming as bad *despite* its felicity.
      *   **(c) Epistemic/Relational Defect:** The blame fails because the blamer lacks crucial perspective (busybody) or is compromised by complicity (accomplice), making their judgment unreliable or intrusive. This isn't hypocrisy per se but shares a "not your place" intuition.
      *   **(d) Blame's Nature/Success:** Hypocrisy reveals that the hypocrite fundamentally misunderstands or fails to embody what blame *is* (e.g., presupposing shared commitment they violate). This is a claim about blame's constitutive conditions.

      **Why it's verbal:** Participants are often arguing past each other. A "standing" proponent arguing for (a) hears a "substantive wrongness" proponent arguing for (b) as denying the *distinctive* defect of hypocrisy, while the (b) proponent hears the (a) proponent as conflating the defect *with* the act of blaming itself. Both might agree the hypocrite's blame is "defective" but disagree profoundly on *how*.

  2.  **The Substantive Core: What *Is* Blame?**
      The stalemate isn't *just* verbal. The underlying, genuinely substantive disagreement concerns **whether the reactive attitude of blame is essentially communicative/demanding or essentially evaluative/attitudinal**.
      *   **The Strawsonian/Communicative View:** Blame *is* essentially a form of address, a demand for recognition, accountability, or change issued within a moral community. Its core function is interpersonal regulation. *Hypocrisy directly undermines this:* A hypocrite cannot sincerely or authoritatively issue a demand whose standard they flout. They lack the normative position to *make the demand*. Your "private blame" test case is devastating here: If blame is *essentially* address, then "private blame" isn't full-blooded blame at all, but perhaps just resentment or disapproval. The persistence of the defect in private blame (if your intuition holds) thus challenges this view's completeness. The "paid-up hypocrite" regains standing because their repentance restores their position *within the moral community* to make demands.
      *   **The Evaluative/Attitudinal View:** Blame is fundamentally an internal judgment or attitude – a negative evaluation of an agent for a wrong, typically involving withdrawal of goodwill or esteem. Its core function is appraisal. Expression is secondary. *Hypocrisy does not undermine the attitude itself:* The hypocrite can correctly judge that the other's act is wrong (the attitude can be fitting). Their hypocrisy is a *separate* moral failing – the act of *expressing* that blame (or perhaps even *holding* it while violating the norm) might be unfair, vicious, or manipulative. The defect in private blame persists because *holding* the attitude while violating the norm is itself morally problematic (unfairness in attitude, cognitive dissonance). The "paid-up hypocrite" lessens the objection because their repentance mitigates the unfairness – they've leveled the moral playing field.

      **The Hidden Empirical Question (Partly):** While fundamentally philosophical, intuitions about your test cases *are* empirical anchors. Does the intuitive defect in hypocritical blame vanish in the "paid-up hypocrite"? Does it persist strongly in "private blame"? Surveying diverse intuitions here *could* pressure-test the presuppositions of each view. If almost everyone finds the paid-up hypocrite's blame unproblematic, it undermines strong versions of (a) that see hypocrisy as an irrevocable forfeiture. If almost everyone finds private hypocritical blame defective, it significantly challenges purely communicative views.

  3.  **Bedrock Intuitions?**
      There is *some* bedrock. Proponents of the communicative view have a strong intuition that hypocrisy makes blame *inauthentic* or *impotent* as a moral address. Proponents of the evaluative view have a strong intuition that the *truth* of the blame judgment is separable from the *character* of the blamer. Neither intuition is easily reducible to the other. However, the stalemate arises because these intuitions are often presented *as* arguments for the conflation points (a)-(d), rather than as foundations for the deeper views of blame.

  **Pathways to Progress:**

  Given this diagnosis, here's how to move beyond the stalemate:

  1.  **Rigorous Disambiguation:** Force the group to explicitly define their terms *every single time*. Insist they specify: Are they talking about:
      *   The *felicity* of the blaming speech-act? (a)
      *   The *moral permissibility* of expressing/holding the attitude? (b)
      *   The *epistemic/reliability* of the judgment? (c)
      *   The *fittingness* of the internal attitude? (Part of d/b)
      *   The *constitutive conditions* of blame itself? (d)
      Frame every argument and counter-example explicitly within one of these categories. This exposes when a move smuggles in a shift.

  2.  **Leverage the Test Cases Systematically:**
      *   **Private Blame:** Focus relentlessly: "If Blamer secretly resents Victim for X while doing/having done X themselves, is there *still* a defect specific to hypocrisy? If so, what is its nature (unfair attitude? lack of integrity?)? Does this defect depend on them ever expressing it?" If the defect persists, it severely undermines purely communicative accounts and pushes towards (b) or (d).
      *   **Paid-Up Hypocrite:** Press: "Does *all* the distinctive force of the 'standing' objection disappear? If yes, why? (Restored authority? Mitigated unfairness? Regained integrity?) If no, what residue remains? (Permanent taint? Different kind of unfairness?)" If the objection vanishes, it strongly suggests the core issue is about *current unfair advantage* or *unclean hands* (b) rather than inherent performative incapacity (a).

  3.  **Reframe the Core Question:**
      Shift the debate *away* from "Does the hypocrite have standing?" and towards:
      *   **"What is the primary function of blame: Interpersonal regulation or evaluative appraisal?"** Argue *directly* for your preferred view of blame's nature using hypocrisy as a test case.
      *   **"What specific *moral risk* does the hypocrite run when blaming, beyond the potential falsity of the blame?"** Focus on pinpointing the *wrong* (unfairness, exploitation of power differential, vice of hypocrisy, undermining trust) rather than a metaphysical "standing."
      *   **"Does hypocrisy primarily affect the *felicity*, the *permissibility*, or the *integrity* of the blaming act/attitude?"** This forces categorization along your (a)-(d) lines.

  4.  **Explore the "Unfair Advantage" Hypothesis:** Your intuition points strongly here. Develop this explicitly: Hypocritical blame is defective because it leverages a position the blamer has *unjustly exempted themselves from*, creating an unfair power imbalance or exploiting social norms they don't adhere to. This explains:
      *   Why the defect persists in *private* blame (the hypocrite benefits psychologically/socially from the norm while violating it).
      *   Why the paid-up hypocrite regains standing (they've accepted the cost, leveling the field).
      *   Why accomplice blame feels different (complicity creates entanglement, not necessarily *unfair exemption*).
      This view falls primarily under (b) – the *act* of blaming is morally wrong due to unfairness – but connects deeply to the social nature of norms and power hinted at in (a) and (d). It's a powerful substantive contender *distinct* from both pure performative failure and mere vice.

  5.  **Accept Pluralism (as a last resort):** Acknowledge that "blame" might encompass a family of related phenomena. Sometimes we use it to refer to the Strawsonian demand; sometimes to the internal attitude; sometimes to a social sanction. Hypocrisy might disrupt *some* of these (the performative address) but not others (the fittingness of the attitude). Clarifying *which* sense is in play in a given context could dissolve apparent contradictions.

  **Conclusion:**

  The stalemate is **primarily verbal** due to the conflation of distinct defects (felicity, permissibility, epistemic reliability, constitutive conditions) under the umbrella term "standing," **overlaid onto a substantive disagreement** about whether blame is fundamentally communicative or evaluative. **Progress lies in relentless disambiguation, leveraging your powerful test cases to pressure-test the core views of blame, and reframing the debate around the specific moral wrong of unfair advantage or the essential function of blame.** Stop asking "Do they have standing?" and start asking "What, *precisely*, is wrong (or not) with the hypocrite's blame in *this specific sense and context*?" This shifts the focus from a mystifying metaphysical status to analyzable features of actions, attitudes, and social practices. Your "unfair advantage" hypothesis provides a particularly promising substantive path forward that integrates insights from both sides.
