answer: |-
  Below is a decision tree designed to sort historical theories by their logical structure, not labels. It starts from a shared observation and uses 10 binary or ternary questions to map the space. Theorists are not named in the nodes; named views are assigned to leaves. The tree addresses your specified distinctions (recurrence type, engine, unit, projectability, survival after collapse, terminal condition, closure, non-human succession, and periodization).  

  ### **Decision Tree: Structure of Historical Beliefs**  
  *Start with this shared observation: "Large-scale political orders have risen and collapsed, while population and stored techniques (e.g., technology, knowledge) have increased over long spans."*  

  1. **Does history show recurrent patterns in political orders?**  
     - **Yes** → Q2  
     - **No** → Q8  

  2. **What recurs?**  
     - **A state** (e.g., identical constitution, dynasty traits) → Q3  
     - **A process** (e.g., similar dynamics but different outcomes) → Q4  

  3. **Why does the state recur?**  
     - **A stock depletes** (e.g., solidarity, virtue; once spent, collapse resets it) → *Leaf: **Ibn Khaldunian solidarity cycle***  
       *Awkward: Must claim solidarity rebuilds identically after collapse, ignoring new techniques.*  
     - **No stock depletion; inherent instability** → *Leaf: **Polybian constitutional rotation***  
       *Awkward: Assumes regime forms must rotate identically, regardless of external events.*  

  4. **What drives the process?**  
     - **Costs of complexity rise, returns fall** → *Leaf: **Cost-of-complexity view***  
       *Awkward: Requires that complexity always becomes unsustainable, even with new tools.*  
     - **Exogenous shocks** (e.g., invasions, climate) → Q5  
     - **A spiral** (process repeats at higher "level" due to accumulated techniques) → *Leaf: **Spiral view***  
       *Awkward: Must explain why politics doesn’t stabilize despite technical gains.*  

  5. **Do shocks guarantee recurrence?**  
     - **Yes** → *Leaf: **Exogenous-recurrence view***  
       *Awkward: Assumes shocks will perpetually reset systems identically.*  
     - **No** → Q6  

  6. **Can the pattern project forward?**  
     - **Yes, lawlike** → Q7  
     - **No, contingent** → *Leaf: **Contingent-recurrence view***  
       *Awkward: Denies predictability while asserting a recurrent "pattern."*  

  7. **What survives collapse?**  
     - **Techniques only** → *Leaf: **Compartmentalised view***  
       *Awkward: Politics cycles identically even though techniques advance.*  
     - **Nothing significant** → *Leaf: **Isolated-cycle view***  
       *Awkward: Must ignore how past collapses influence future rises.*  
     - **Techniques and prior challenges** → *Leaf: **Toynbee's challenge-and-response***  
       *Awkward: Creative minorities must always emerge when challenged.*  

  8. **(From Q1) Is there directional change?**  
     - **Yes** → Q9  
     - **No** → *Leaf: **Deflationary view***  
       *Awkward: Patterns are pure narrative; denies even population/technique trends.*  

  9. **What drives direction?**  
     - **Accumulating techniques** → *Leaf: **Uncomplicated progress view***  
       *Awkward: Progress is inevitable; collapses are temporary setbacks.*  
     - **Fixed stages** (e.g., economic, cultural) → *Leaf: **Stage-theory view***  
       *Awkward: All societies must pass through identical stages in order.*  
     - **Organic growth/ageing** → *Leaf: **Spenglerian morphology***  
       *Awkward: Civilizations must die after fixed lifespans, like organisms.*  

  10. **Terminal condition? (For all leaves except deflationary)**  
      - **Exhaustion/end** (e.g., complexity unsustainability, no new challenges) → *Applies to: Cost-of-complexity, Spengler, some Stage-theory*  
        *Closure problem: If the globe is one system, collapse is terminal (no outside). Forces these views to predict an end or adapt.*  
      - **Endless turning** → *Applies to: Khaldun, Polybius, Exogenous-recurrence*  
        *Closure problem: No external "barbarians" or frontier. Forces claim that internal dynamics alone sustain cycles.*  
      - **Open/unknown** → *Applies to: Spiral, Toynbee, Progress*  
        *Closure problem: New challenges might include non-human actors (e.g., AI inheriting systems). These views must allow non-human succession or reject it explicitly.*  

  ### **Unoccupied Cells & Unseparated Pairs**  
  - **Unoccupied cells**:  
    - *Process recurrence driven by stock depletion*: Incoherent. A "stock" (e.g., solidarity) implies a reset state, not a process.  
    - *Directionality via exogenous shocks*: Unattractive. Shocks imply randomness, not direction.  
    - *Spiral with nothing surviving collapse*: Incoherent. Spirals require something (e.g., techniques) to elevate the next cycle.  
  - **Unseparated pairs** (distinguished only by unit/engine, not structure):  
    - *Ibn Khaldun vs. Polybius*: Both are state-recurrence driven by internal decay. Khaldun focuses on dynasties (solidarity stock), Polybius on regimes (virtue instability). No further node prises apart; the difference is unit-specific.  
    - *Spengler vs. terminal stage-theory*: Both predict end states. Spengler is organic; stage-theory is teleological. Add: **"Is the endpoint biologically predetermined?"** to separate.  

  ### **Periodization Node**  
  - **Q6 (for contingent recurrence) and implicit in all leaves**: If "no" to lawlike projection (Q6), periodization artifacts are a real position. Elsewhere, start/stop points are part of the theory’s mechanics (e.g., Toynbee’s "challenges" define periods).  

  ### **Named Views in Leaves**  
  - Includes all requested: Khaldun (Q3), Polybius (Q3), Spengler (Q9), Toynbee (Q7), Progress (Q9), Cost-of-complexity (Q4), Spiral (Q4), Compartmentalised (Q7), Deflationary (Q8).  
  - Added: Exogenous-recurrence (Q5), Stage-theory (Q9), Contingent-recurrence (Q6), Isolated-cycle (Q7).  
  - Unnamed: Exogenous-recurrence, Contingent-recurrence, Isolated-cycle (no major theorists defend these purely).  

  ### **Tree Format**  
  ```plaintext
  Start → Q1 (Recurrence?)  
  │  
  ├─ Yes → Q2 (Recurs: State/Process?)  
  │  │  
