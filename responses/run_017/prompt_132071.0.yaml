answer: |-
  To the Editor, 

  We, the undersigned, having completed our adversarial collaboration on the Church-Fitch knowability paradox (arising from Fitch’s Theorem 5), present this joint statement outlining points of agreement and key areas of divergence. Our collaboration focused on understanding the derivation, its implications for anti-realism, and potential responses. We concur on the following:

  The derivation, in its essence, is remarkably frugal. It requires only: (1) The **Distribution Principle**: Knowledge distributes over conjunction (K(p ∧ q) entails Kp and Kq); (2) **Factivity**: Knowledge entails truth (Kp entails p); (3) **Classical Logic and Modal Logic (K)**: Specifically, the rule that if a contradiction is derivable from p, then p is impossible (¬◊p), and the interdefinability of necessity and possibility. Crucially, **factivity is indispensable**; removing it blocks the derivation entirely, as the contradiction relies on deriving p from Kp. The core move demonstrates that for any proposition p, the specific proposition (p ∧ ¬Kp) – a "Moorean proposition" – cannot be known. If it were known, distribution yields Kp, and factivity yields p, but Kp contradicts the second conjunct (¬Kp) within the known proposition. Therefore, ◊K(p ∧ ¬Kp) is false for every p. The knowability principle, ∀p (p → ◊Kp), applied to the proposition q = (p ∧ ¬Kp) (assuming q is true, i.e., p is true but unknown), yields ◊Kq. But we've just established ¬◊Kq. Contradiction. This constitutes a **"choose your exit" reductio ad absurdum**: The conjunction of the knowability principle, distribution, factivity, and the existence of an unknown truth leads to contradiction. One must reject at least one. It is not a direct refutation of any single premise in isolation. Furthermore, we agree that this style of argument is **operator-general**. It can be formulated for any operator O satisfying Distribution and Factivity, such as Ideal Warranted Assertibility, Provability (in a consistent system), or Could-Be-Rationally-Believed-With-Certainty. The viability of such variants hinges critically on whether O satisfies Distribution and Factivity. The question of whether non-factive operators can sustain similar paradoxes remains open and is a distinct line of inquiry.

  Our fundamental disagreement centers on the viability of a restricted knowability principle as a response to the paradox.

  **The Repairer's Stance:** The derivation decisively refutes the *unrestricted* knowability principle (∀p (p → ◊Kp)). However, anti-realism, understood as the rejection of evidence-transcendent truths, need not and should not be abandoned. The correct response is to articulate a principled **restriction** of the knowability principle to a domain of propositions immune to the Fitch construction. Specifically, the domain must be **Moorean-Free**: it must contain no true proposition of the form (p ∧ ¬Kp). The challenge is to define such a domain non-trivially. Crucially, a restriction is **principled** only if it can be specified without epistemic vocabulary ("known", "knowable", etc.), relying solely on non-epistemic features of propositions (e.g., logical form, subject matter, ontological commitments). Plausible candidates include: *Observational Truths* (contingent, present-tense claims about observable states of affairs – likely Moorean-Free and specifiable non-epistemically), *Non-modal Truths* (atomic or truth-functional, lacking modal operators – potentially Moorean-Free, specifiable syntactically), and *Truths with Actual Truthmakers* (truths grounded in existing states of affairs – potentially Moorean-Free, though specifying "truthmaker" non-epistemically is contentious). Restriction to a base vocabulary (e.g., phenomenal or physical primitives) might also work syntactically. The "knowable" in the restricted principle must mean **metaphysical possibility**. If knowledge of p is metaphysically possible *simpliciter* – even in worlds with different physical laws or cognitive agents – then p is knowable. In the case of the melted jar of coins, the exact number (call it N) *is* metaphysically knowable; there exists a possible world (perhaps with time-travel, or perfect forensic reconstruction, or different laws allowing exact residue analysis) where some being knows N. The restricted principle (e.g., applying only to observational truths) can defensibly include such truths under this reading without collapsing, precisely because (N ∧ ¬KN) is not in the domain. The restricted principle **does not need to apply to itself universally**. A stable hierarchy is possible: a principle RK1 governing knowability for propositions of "level 0" (e.g., non-epistemic, observational), while RK1 itself and claims about knowledge belong to a higher level (level 1), governed by a distinct principle RK2. This avoids self-application paradoxes without collapsing levels. Crucially, a well-chosen restricted principle (e.g., for observational truths) **still earns its anti-realist keep**. It rules out evidence-transcendence *for a vast, fundamental domain of discourse* (e.g., the observable world), grounding truth in ideal verification conditions relevant to that domain. A realist could not happily sign this, as they are committed to truths (even observational ones) existing independently of *any* possible verification. Evidence against my position would be: (1) A demonstration that *every* non-trivially specifiable Moorean-Free domain is *also* one a realist could readily accept as verifiable (e.g., only tautologies), or (2) A proof that any stratified knowability principle inevitably leads to contradiction or expressive inadequacy equivalent to abandoning knowability.

  **The Undertaker's Stance:** While technically possible to restrict the knowability principle to a Moorean-Free domain, any such restriction that blocks the Fitch proof is either **ad hoc or too weak** to serve the core anti-realist purpose. The proposed test for non-ad-hocness – specification without epistemic vocabulary – is fair and necessary to avoid triviality ("all truths except the Moorean ones"). However, *no* plausible restriction passes this test while retaining anti-realist force. Syntactic restrictions (e.g., non-modal, base vocabulary) exclude vast swathes of meaningful discourse anti-realism should cover (e.g., "There were dinosaurs"). Subject matter restrictions (e.g., observational) are vague and themselves often implicitly epistemic (what counts as "observable"?). "Truths with actual truthmakers" smuggles in correspondence metaphysics anathema to thoroughgoing anti-realism. Even if a restriction like "observational truths" is granted as principled and Moorean-Free, the crucial question is the **modality of "knowable"**. For anti-realism to have bite, knowability must mean **relevant possibility**: possibility relative to our cognitive capacities, laws of nature, and actual history. In the melted jar case, the exact number N is *not* knowable in this relevant sense; no possible investigation *from our historical and physical situation* can reveal it. If the Repairer adopts metaphysical possibility, the restricted principle becomes toothless (N *is* knowable metaphysically), failing to rule out evidence-transcendence *in the relevant sense*. If they adopt relevant possibility, the principle becomes too weak for anti-realism; truths like N *are* evidence-transcendent in the relevant sense, and the restricted principle (e.g., for observational truths) allows this, contradicting the core anti-realist motivation. Regarding self-application, any attempt at stratification either **collapses** (if level n+1 knows level n is knowable at level n, why not just know it at level n?) or becomes **incoherent or inexpressible** – we cannot coherently state a single, unified anti-realist thesis about truth grounded in knowability if the thesis itself falls outside its scope or requires an infinite hierarchy of principles we cannot articulate. Consequently, even if a restricted principle survives Fitch, it fails the **work test**. A realist *can* happily accept that every *observable, non-modal* truth is knowable (in the relevant sense) – it simply reflects human empirical limitations, not a constitutive link between truth and knowability. The principle no longer underwrites a global epistemic theory of truth or meaning. Anti-realism must be reformulated without relying on knowability, perhaps focusing directly on verificationist semantics or the rejection of classical logic for certain domains. Evidence against my position would be: (1) A demonstrably non-ad-hoc (non-epistemically specifiable), Moorean-Free domain that is both substantial enough to be interesting *and* one a realist must reject as verifiable, *and* (2) A compelling argument that knowability in the metaphysically possible sense *is* sufficient for the anti-realist's core theoretical needs regarding truth and meaning in that domain.

  **Cruxes and Verbal Disputes:** Our core disagreements hinge on four cruxes:
  (1) **Ad-hocness & Domain:** Whether a non-epistemically specified, Moorean-Free domain exists that is both non-trivial *and* central enough for anti-realism. Repairer predicts Observational/Non-Modal can work; Undertaker predicts they either fail specification or lack anti-realist force.
  (2) **Modality of "Knowable":** Whether metaphysical possibility suffices for anti-realism. Repairer believes it can, especially restricted (e.g., for observational truths, the melted jar number is knowable metaphysically, supporting the principle). Undertaker believes only relevant possibility matters, rendering such a principle either false (if it claims relevant knowability) or inert (if it claims metaphysical knowability) for anti-realism. The melted jar case is pivotal here.
  (3) **Self-Application & Hierarchy:** Whether a stratified knowability principle is viable and expressible. Repairer believes a typed hierarchy (e.g., levels 0,1) is stable and sufficient. Undertaker believes it collapses or becomes practically inexpressible/unworkable.
  (4) **Work Test:** Whether a principle surviving (1)-(3) still performs the core anti-realist function. Repairer believes a restricted metaphysical-knowability principle for (e.g.) observation *does* ground truth epistemically in that domain, excluding realist transcendence. Undertaker believes it becomes compatible with realism about that very domain.

  We acknowledge potential **verbal disputes** lurking. The fight over **"in principle" knowability** often conflates metaphysical possibility ("could be known by some being under some conditions") with relevant possibility ("could be known by us, or beings like us, given actual laws/history"). Clarifying which notion is intended is crucial. Similarly, debates about the **quantifier over propositions** ("all truths") – whether it ranges over all actual truths (actualist) or all possible truths (possibilist) – can cause confusion, though the Fitch derivation itself primarily concerns actual unknown truths. These differences in interpretation can make disagreements *appear* deeper than they are, or conversely, mask genuine substantive divides. However, we maintain that even after clarifying these terms, our core disagreements on the four cruxes outlined above represent substantive philosophical differences concerning the nature of truth, knowledge, and the prospects for anti-realism.

  Signed,

  [The Repairer]
  [The Undertaker]
