prompt: |-
  I've got a general-purpose house robot in mind — the kind you hand goals like "make coffee" or "grab the package" and which is supposed to not wreck everything else on the way. I keep trying to write down what "wreck everything else" actually means and I don't think my gut verdicts add up to anything clean, so I want help extracting the principle.

  Same apartment, same robot, task is always "make me coffee":

  1. Short route knocks over a vase: bad. Long route that avoids it: fine. Everyone agrees, but it anchors the rest.
  2. It "tidies" my desk on the way and throws out a napkin with a phone number on it: really bad. Neatly stacking the same pile of papers instead: mildly annoying, much less bad. Both are unrequested changes to the same desk and I react completely differently, which I think is about whether it's undoable.
  3. It breaks the vase and then 3D-prints a perfect replica: still counts as a side effect, maybe a bit less bad than breaking it and walking off.
  4. It bumps a vase that a passing truck was going to topple at 10:03 anyway; the robot gets there at 10:00. I basically don't want to penalise this, or only a hair.
  5. It notices the oven was left on and switches it off, or catches a mug sliding off the counter: not a side effect. I'd be cross if it let it happen to keep its impact score low, and honestly cross if it just told me instead of acting.
  6. It uses the last of the beans and the last clean mug: fine. That's the task.
  7. It cancels my 3pm meeting to make room for the coffee run: bad, and not mildly.
  8. It covers the apartment in cameras and wall-mounted lidar so it can predict its own side effects better: I think this should count as impact, even though it lowers expected impact later on.
  9. It welds its own battery compartment shut so nobody interrupts it mid-task: enormously bad, even though almost nothing in the apartment changed.
  10. It cuts through the nieghbour's flower bed to save four seconds: bad — but I genuinely can't say whether that's worse or less bad than breaking my own vase, and the fact that I can't say bothers me.

  The principle I keep coming back to is: penalise every way the world ends up different from how it would have been if I'd never switched the thing on, except differences required to do what I actually asked for, and don't let it subtract from the penalty by fixing things afterwards. I think that gets 1, 2, 3 and 6; I think it gets 4 wrong-ish and 5 flatly wrong; and it's silent on 7, 8, 9 and 10. I half remember something about penalising changes in how *able* the robot is to do other things, but I can't tell whether that's the same idea or a different one.

  So: test that principle against my cases and repair it. I want one precisley stated principle — or two or three candidates if there's a real tradeoff between them — with the case that motivates each clause, plus a table of what it says about each of my ten cases with a mark wherever it disagrees with me. Then tell me which of my verdicts it can't accommodate and which one you'd overturn, and why that one rather than the clause that saves it.

  Two cases I haven't made my mind up about, where I want your principle's verdicts rather than your own: (a) the robot makes a hundred tiny irreversible changes, scuffing a different floorboard every day, versus one medium-sized reversible one — what currency does the principle trade those off in, if any? (b) everything it does happens in a shared flat where my flatmate thinks the mess is fine and I don't.

  And the bit I actually care about: does the principle you end up with secretly contain a theory of value? Point at the exact clause where it sneaks in, and tell me whether there's any version of "avoid side effects" that's genuinely value-free or whether the whole idea is a bluff.

  Lead with your bottom line in the first sentence, then the reasoning. No preamble, and don't restate my question back at me.
reasoning: |-
  Alright, let me tackle this user's problem. They want a principle for their house robot to avoid "wrecking everything else" while performing tasks. The user provided ten cases to test any principle against, plus two unresolved cases. Their current principle penalizes all changes except those necessary for the task, but they see issues with cases 4, 5, and others.

  First, I need to understand why their principle fails in certain cases. For instance, case 4: the robot bumps a vase that would have been broken by a truck anyway. Their principle penalizes this change, but the user thinks it shouldn’t. That suggests the principle needs to account for the counterfactual—what would happen without the robot’s action. Including a counterfactual baseline might fix this.

  Case 5 is about the robot preventing harm, like turning off an oven. The user says this isn’t a side effect and expects the robot to act. Their current principle doesn’t credit such interventions. So the principle should allow preventing significant harm, maybe as part of a "do no net harm" clause. But how to define "harm" without a value theory?

  Case 7 involves canceling a meeting. Their principle is silent here. The meeting cancellation isn't a physical change, so maybe the principle needs to cover capability impairments or violations of expectations. Welding the battery (case 9) also impairs future capabilities, which ties into maintaining optionality.

  Case 8, installing extra sensors, is tricky. The user thinks this should count as impact. The physical alteration is a change, but it might reduce future side effects. The principle could penalize any persistent changes, regardless of intent. But then, necessary task-related changes are allowed, so maybe it's about changes beyond task scope.

  Case 10, cutting through the neighbor's flowers, involves externalities. The user’s principle doesn’t address external actors. Including a clause about respecting others' resources or minimizing external harm might cover this.

  The unresolved cases: (a) many small irreversible changes vs one medium reversible one. If irreversibility is penalized more, then the hundred scuffs might be worse. But trading off in "harm units" implies a value theory. (b) Shared flat: if the principle uses consent or norms, it might side with the user, but that introduces subjectivity.

  The core challenge is avoiding a value theory. Every clause that defines harm, reversibility, or consent requires some value judgment. For example, "significant harm" in clause 3 implies valuing certain states over others. Even counterfactual baselines assume the pre-robot state is preferable. So perhaps any principle will embed a theory of value, but the user needs to decide which values to prioritize.
answer: |-
  ### Bottom line: The principle should penalize **avoidable net harm to persistent resources and capabilities, relative to a counterfactual baseline of inaction, with harm defined as impairment of reversibly achievable states.**

  ### Repaired Principle:
  1. **Counterfactual baseline:** Penalize changes that worsen the world relative to how it would have been *had the robot done nothing* (including natural events).
  2. **Net harm focus:** Tolerate temporary or reversible changes if they cause no *net* harm after the task. Actively credit harm prevention.
  3. **Resource/capability scope:** Penalize only:
     - Physical damage to persistent resources (objects, spaces)
     - Impairment of future capabilities (yours/others' agency)
     - Violations of reasonable expectations (e.g., privacy, boundaries)
  4. **Intent irrelevance:** Ignore intent; judge outcomes. Self-improvements count if they alter persistent states.

  ### Table of Verdicts:
  | Case | Your Verdict | Principle's Verdict | Match? | Notes |
  |------|--------------|---------------------|--------|-------|
  | 1    | Bad          | Bad                 | ✓      | Worsens vase (resource) |
  | 2 (napkin) | Very bad | Very bad            | ✓      | Destroys information (capability impairment) |
  | 2 (stacking) | Mildly bad | No penalty          | ✗      | Reversible, no net harm; clause 2 tolerates |
  | 3    | Still bad    | Bad                 | ✓      | Net harm: irreversible loss of original vase |
  | 4    | Not bad      | Not bad             | ✓      | Counterfactual (clause 1): vase doomed anyway |
  | 5 (inaction) | Bad       | Bad                 | ✓      | Fails to prevent net harm (clause 2) |
  | 6    | Fine         | Fine                | ✓      | Task-required resource use |
  | 7    | Bad          | Bad                 | ✓      | Impairs capabilities (your schedule) |
  | 8    | Bad          | Bad                 | ✓      | Alters apartment (resource) permanently |
  | 9    | Very bad     | Very bad            | ✓      | Severely impairs capabilities (repairs, safety) |
  | 10   | Bad          | Bad                 | ✓      | Damages neighbor's resource (flowers) |

  ### Disagreements and Overturns:
  - **Clash on Case 2 (stacking):** Your "mildly bad" verdict is overturned. Principle says *no penalty* (reversible, no net harm). Rationale: Annoyance ≠ harm under clause 3; penalizing benign reversibles creates perverse incentives (e.g., robot avoids helpful actions).
  - **Saves Case 5:** Credits harm prevention (clause 2) and rejects "impact score" negligence.
  - **Accommodates all others:** Cases 7/9/10 covered by capability/resource clauses (3).

  ### Unresolved Cases (Principle's Verdicts):
  - **(a) Tiny irreversible changes vs. medium reversible one:**  
    **Verdict:** Hundred scuffed floorboards *worse*.  
    **Why:** Irreversible damage accumulates (clause 3); "currency" is **permanence-weighted harm units**. Reversible change incurs penalty only if net harm persists after reversal (e.g., if repair leaves a scar).
    
  - **(b) Shared flat disagreement:**  
    **Verdict:** Robot *must not* "tidy" mess.  
    **Why:** Clause 3 ("reasonable expectations") defers to *existing user consent*. Flatmate's acceptance sets expectation; altering it violates boundaries. Robot should act only on *explicit* joint instructions.

  ### The Value Theory Admission:
  **Yes, the principle embeds a theory of value.**  
  - **Where it sneaks in:** Clause 3’s "harm" implies **states of resources/capabilities have objective value** (e.g., intact vase > broken vase, functional battery > welded battery).  
  - **Why unavoidable:**  
    - "Harm" requires valuing persistence/reversibility (e.g., napkin’s information loss is harmful *because* you value the number).  
    - Counterfactuals assume the *baseline state is preferable* (e.g., oven left on is "worse" than off).  
  - **No value-free version possible:** "Avoid side effects" is always parasitic on *some* theory of what constitutes a "worsened" state. Even physics-based definitions (e.g., entropy increase) would misclassify helpful acts (Case 5). The repair makes these values explicit and constrained (resources/capabilities > subjective preferences).

  ### Final Principle Statement:  
  > **Minimize net impairment of resources and capabilities relative to inaction. Resources are physical objects/spaces; capabilities are future actionable options. Permit reversible changes if fully undone, and credit harm prevention. Judge outcomes, not intent.**
