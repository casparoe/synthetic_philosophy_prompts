prompt: |-
  I'm on the executive committee of a scientific society — about 3,000 members — and every couple of years we put out an official position statement on some contested question in the field (does effect X replicate, is technique Y safe at scale, should regulators treat Z as settled). Right now a 12-person elected council ratifies it's wording by simple majority, and the chair breaks ties. Two motions are on the floor for the AGM, which is in three weeks, and I have to circulate the committee's one-page recommendation by Friday.

  Motion A, from a group of members: put every statement to an online vote of the whole membership — a two-week comment thread first so people can see each other's arguments, then a simple majority of whoever turns up. Their argument is basically the Condorcet jury theorem: lots of roughly independent voters, each a bit better than chance, and the majority ends up very likely to be right.

  Motion B, from our treasurer, who's worried about reputational damage: keep it with the council but require two-thirds.

  Some things I've noticed that I want the memo to actually deal with.

  First, we're 12 — an even number. If ties are broken by a coin flip, I think a 12-person council is exactly as reliable as an 11-person one; I checked it on toy cases (1 vs 2, and 3 vs 4, both came out identical when everyone's reliability is 0.6) but I can't prove it in general. If that's right, the 12th vote is worth nothing and we should either go to 11 or change the tie rule. Is defaulting to "we issue no statement" better than the chair's casting vote, and does that depend on what fraction of proposed statements are true in the first place?

  Second, the comment thread. If everyone reads the same three loud people before voting, we don't have 3,000 independent votes, we have fewer — and I've been told that once votes are correlated the majority stops converging on the truth at all and plateaus somewhere below 1, which would take the legs out of motion A entirely. But the obvious reply is that our 12-person council is far more correlated than the membership: they've been in the same room for three years.

  Third, and this is the bit that actually worries me: on a specialist question most of our members are in subfields that have nothing to do with it, so the average member's reliability might be near chance or below it — and if it's below, the same theorem says a bigger electorate makes us worse, not better. I have no idea which side of 0.5 we're on, and we have no track record of scoring our own statements against what later happened, so no one can honestly say. What do you do with a decision rule when you can't tell whether it's helping or hurting?

  Fourth, one of our committee members — she's an econometrician — says the simple-majority framing is wrong anyway: if votes are independent, the right rule weights each person by the log-odds of their being right, and a few hundred members who are each only marginally better than a coin flip will beat twelve experts under it. She wants self-reported expertise added as a weighting to the online vote. I don't know if the weighting claim is right, and I definately don't know how anyone would report their own expertise honestly.

  Fifth, our statements come in two parts: a factual bit (does the effect replicate) and a recommendation bit (so here's what practitioners and regulators should do). The jury-theorem reasoning seems to touch only the first part, and I suspect that's where the two-thirds rule really belongs, if it belongs anywhere — but I also suspect the threshold ought to fall out of the base rate of statements being right and how much worse a false statement is than silence, rather than from a round number somebody liked.

  What I need is the memo: a position on each motion (adopt, reject, adopt with conditions), what we do at the AGM in three weeks, what we do over the next year instead — pilot something? record votes before the comment thread opens and compare them to the post-deliberation ones? split each statement into two separate votes? drop to 11 members and fix the tie rule? — and reasons our members could actually argue with rather than just nod at. Please be straight about the strongest argument for whichever motion you're telling us to reject; the referendum people will be in the room and they're not stupid. If it helps you put numbers on any of this, assume a decent specialist is right about 60% of the time on these questions.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on the executive committee of a scientific society with 3,000 members. They need to decide on two motions about how the society approves position statements. Motion A suggests an online vote of all members after a comment period, while Motion B wants to keep it with the council but require a two-thirds majority. The user has several concerns: the reliability of a 12-person council with tie-breaking, the impact of correlated votes in an online forum, the average member's expertise being near or below chance, the potential for weighted voting based on self-reported expertise, and the distinction between factual and recommendation parts of statements.

  First, I need to address the tie-breaking issue with the 12-person council. The user noticed that a 12-member council with a coin flip tie-breaker is as reliable as an 11-member one. I recall that in group decision theory, an even-sized group with random tie-breaking doesn't add value over the next smaller odd size. That makes sense because the tie-breaking vote is random, so it doesn't improve accuracy. The user suggested defaulting to "no statement" on ties. That might be better if false statements are more harmful than silence. But how much worse? If false positives are disastrous, then requiring consensus or a higher threshold makes sense. But if missing a true statement is worse, then a simple majority might be better. Without knowing the cost ratio, it's hard to say. Still, moving to an odd-numbered council or using a chair's vote (if the chair is more expert) could help.

  Next, the comment thread in Motion A. The Condorcet Jury Theorem relies on independent votes. If members are influenced by a few loud voices, votes become correlated. Research shows that even small correlations can drastically reduce the "wisdom of the crowd" effect. The council, being a small group that's worked together, likely has high correlation. But with 3,000 members, even with some correlation, the crowd might still outperform a small group if the average competence is above 0.5. But here's the catch: the user suspects average member competence might be near or below 0.5. If it's below 0.5, larger groups make worse decisions. Without data on member expertise, this is risky. Pilot testing or splitting statements into factual vs. recommendation parts could help gauge competence.

  The treasurer's Motion B wants a two-thirds majority for the council. This increases the threshold, reducing false positives but increasing false negatives. If the base rate of true statements is low, a higher threshold might be better. But without historical data, it's guesswork. The user mentioned that the cost of errors should drive the threshold. For factual statements, avoiding false claims might be critical, so a higher bar makes sense. Recommendations might need a different approach, like simple majority.

  The econometrician's point about weighted voting is interesting. Log-odds weighting is optimal if competences are known. But self-reported expertise is unreliable—people overestimate their knowledge. Even if members report honestly, verifying that is tough. Practical issues like implementation and member trust make this unfeasible now. Maybe as a future pilot, but not for immediate adoption.

  The two-part structure of statements is crucial. Factual assertions need high accuracy to maintain credibility, while recommendations involve values and trade-offs better suited for representative debate. Splitting votes could address this, but complexity might deter participation.

  Underlying all this is the need for data. The society doesn't track past statement accuracy or member expertise. Without this, any change is speculative. Piloting an advisory vote or recording pre-deliberation preferences could provide insights. Also, reducing council size to 11 avoids tie issues and maintains stability while improvements are tested.

  The user's deeper needs include preserving the society's reputation, ensuring credible statements, and fostering member engagement without compromising decision quality. They need actionable steps that balance immediate changes with longer-term data collection. Rejecting both motions now in favor of incremental steps allows for evidence-based reforms later.
answer: |-
  Here's a concise, actionable memo for the executive committee, addressing each concern directly and providing clear recommendations:

  ---

  **TO:** Executive Committee  
  **FROM:** [Your Name/Committee Role]  
  **SUBJECT:** Recommendations on Motions A & B - Position Statement Approval Process  
  **DATE:** [Circulation Date]

  After thorough analysis of Motions A (full membership vote) and B (council supermajority), the committee recommends **rejecting both motions** at this AGM. Instead, we propose an immediate structural fix to the council process and a one-year pilot to gather critical data. Below is our reasoning and action plan.

  ### 1. **Motion A (Full Membership Vote): REJECT**  
     *Strongest Argument For:* Condorcet’s theorem *could* harness collective wisdom if members vote independently and average competence >0.5.  
     *Why Reject Now:*  
     - **Competence Uncertainty:** If average member accuracy ≤0.5 (plausible for non-specialists), larger votes *decrease* accuracy. With 60% specialist accuracy, non-specialists likely fall below 0.5.  
     - **Correlation Risk:** A comment thread risks herding (e.g., 3 loud voices swaying votes). Correlation dramatically erodes Condorcet benefits—even modest correlation can cap accuracy at 60-70%, potentially *below* our council’s current performance.  
     - **Operational Risks:** Low turnout could enable activist blocs; self-report weighting (see §4) is unverifiable and prone to bias.  

  ### 2. **Motion B (Council Two-Thirds): REJECT**  
     *Strongest Argument For:* Protects against controversial false statements, preserving society credibility.  
     *Why Reject:*  
     - **Tie-Breaker Issue:** A 12-person council with random tie-breaker (e.g., coin flip) has **identical accuracy** to an 11-person majority (provable via binomial symmetry). The 12th vote adds zero marginal reliability.  
     - **Error Trade-offs:** Two-thirds thresholds reduce false positives (bad statements issued) but increase false negatives (good statements blocked). If false statements are 2× worse than silence, optimal thresholds require knowing the base rate of true statements—which we don’t.  
     - **Better Solution:** Fix council size to 11 (odd number) with majority rule. This preserves current reliability without arbitrary supermajorities.  

  ### 3. **Immediate Action (AGM in 3 Weeks):**  
     - **Propose Amendment:** Reduce council to **11 members** starting next term (no tie risk).  
     - **Tie-Breaker Rule:** If ties occur before reduction, default to **"no statement"**—safer than coin-flip if false positives harm reputation more than silence.  
     - **Pilot Study:** Launch a 12-month **advisory vote pilot** for non-binding input:  
       - For each statement, all members vote *before* council deliberation (avoids herding).  
       - Split votes: **Factual claim** (e.g., "Effect replicates?") and **Recommendation** (e.g., "Regulators should act?").  
       - Record pre-deliberation votes and track against later consensus/council decisions.  

  ### 4. **Addressing Key Concerns:**  
     - **Correlation:** The council *is* highly correlated, but Motion A’s comment thread risks worse. The pilot measures actual correlation in membership votes.  
     - **Weighted Voting:** The econometrician is correct—log-odds weighting is optimal *if* competences are known. But **self-reported expertise is unreliable** (overconfidence bias). Pilot data can identify weighting feasibility (e.g., correlate self-reports with voting accuracy).  
     - **Factual vs. Recommendation:**  
       - *Factual claims* require high accuracy; council (with expertise) is currently better suited.  
       - *Recommendations* involve values/pragmatism; future online votes may work but need testing. The pilot splits these to assess member competence on each.  

  ### 5. **One-Year Plan:**  
     | Phase | Action | Goal |  
     |-------|--------|------|  
     | **Now** | Reduce council to 11; adopt "no statement" on ties. | Fix tie-breaker flaw. |  
     | **0–12 mo** | Run advisory pilot on 3–4 statements (pre-deliberation vote + split questions). | Measure average member competence & correlation. |  
     | **12 mo** | Analyze pilot: Compare member/council accuracy, herding effects, weighting options. | Data-driven reform at next AGM. |  

  ### Why This Approach?  
  - **Motion A** risks amplifying errors if member competence is <0.5 or correlation is high.  
  - **Motion B** ignores the council’s structural flaw (even size) and imposes arbitrary thresholds.  
  - **Our path** fixes immediate issues, gathers evidence, and delays irreversible changes until we know:  
    - Is average member competence >0.5?  
    - How correlated are votes post-deliberation?  
    - Can we weight votes reliably?  

  **AGM Strategy:** Frame this as "evidence-based reform." Acknowledge Motion A’s democratic intent and Motion B’s risk-mitigation but emphasize that both require data we lack. The pilot empowers members while safeguarding the society’s credibility.  

  ---  

  **Key Assumption:** With specialist accuracy at 60%, non-specialists likely fall to 40-55%. Until proven otherwise, expanding voting is high-risk. The pilot provides proof without commitment.  

  Let me know if you need revisions for tone or tactical emphasis ahead of Friday’s circulation.
