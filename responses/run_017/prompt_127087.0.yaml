prompt: |-
  I write the animal welfare standard for a mid-sized food manufacturer. We revise it twice a year, and each revision allocates a fixed premium budget (currently about three per cent of ingredient spend) across the welfare changes we require of suppliers. Once we commit to a change it binds for two years, so a bad allocation is expensive and slow to undo. Our ingredient base spans, in rough order of volume: broiler chickens, laying hens, pigs, farmed salmon, farmed whiteleg shrimp, and — increasingly, because we reformulate a blended protein ingredient and can shift its composition at near-zero cost — mealworm and black soldier fly larvae. That reformulation lever is the reason I need help: I can move volume between species cheaply, so cross-species comparisons that are academic for most companies are load-bearing for us.

  What I need is a decision procedure, not an essay. Specifically: an ordered set of tests that takes a proposed welfare change and yields fund it, don't fund it, or hand it back to a human; a statement of what counts as a sufficient answer to each test; the points where the procedure stops with a no; the points where it has to stop and let a person decide because the question is one of values rather than facts; and an honest list of the cases it cannot settle at all.

  Four constraints on the procedure. It has to be runnable in a working day by an analyst with a spreadsheet and no philosophy training, using evidence a supplier can actually produce (stocking densities, mortality and cull figures, stunning and slaughter method, lighting, stocking, enrichment, breed, transport time) rather than welfare science we cannot verify from here. It has to say what to do when a needed number simply is not available, and how much that gap matters. It has to be defensible in two or three sentences to a five-person sourcing committee who will ask why this species and not that one. And it cannot rest on contested claims about which animals are sentient: our legal team will not sign a standard whose justification depends on a disputed scientific question, so the procedure has to function under unresolved uncertainty rather than wait for it to be resolved. Please don't send me to the literature or give me a reading list — we have no journal access from this office; give me the argument itself, in premises I can put in front of the committee.

  Five things I don't know how to build into a checklist, and which I suspect are where the real work is.

  First: I keep being told that like interests should get like weight, which plainly cannot mean treating a shrimp like a pig. I need to know which differences between species are allowed to move the number, and which are just the fact of species membership wearing a costume. Our customers care a great deal about chickens and essentially not at all about shrimp or fish; our legal team's working assumption is that nothing below farmed fish is legally protected in the markets we sell in; our comms team says a standard whose largest single spend is shrimp welfare will read as a joke. Some of those reactions I think are the thing I am trying not to smuggle in, but not all of them, and I can't separate them. Tell me which of them the procedure may treat as reasons, which it should flag as suspect, and whether there is any non-question-begging way to take the comms problem into account at all.

  Second: death and a bad life are not the same complaint, and our changes trade them against each other. A slower-growing broiler breed suffers less in the last weeks but lives more days and needs more birds per tonne of meat, so the same order is filled by more animals each living longer. I don't know whether the procedure should count that as a cost, a benefit, or nothing.

  Third: numbers versus intensity per animal. The shrimp and insect lines involve millions of individuals, each plausibly capable of very little experience, against tens of thousands of pigs and chickens capable of a great deal. I have been using a back-of-envelope bad-days-averted-per-euro figure; tell me whether to keep that unit, what it silently assumes, and what to use when the per-animal amount is not just small but possibly zero.

  Fourth: the reply I get from every supplier I push, which is that these animals exist only because we buy them, so if tighter standards raise prices and demand falls there will be fewer of them, and a life worth living that never happens is not a benefit anyone loses. I think something is wrong with this but I can't say what, and it is deployed selectively in a way I don't trust.

  Fifth: scope. Where does the procedure stop — at insects, at shrimp, at bivalves, at plants — and on what principle, given that each extension multiplies the numbers by an order of magnitude while the probability of any experience at all falls?

  Please then run the finished procedure on three live proposals and show the work, including where it hands a question back to me:

  1. Replace asphyxiation-in-ice with electrical stunning for our farmed shrimp supply, at roughly a quarter of a eurocent per serving.
  2. Switch a broiler line to a slower-growing breed: clear welfare gains in the final weeks, a real cost premium, more bird-days per tonne of meat.
  3. Move the shell-egg and egg-ingredient supply from furnished cages to multi-tier aviaries, given that our own audit data from aviary sites shows mortality and injury figures I am not comfortable publishing.

  I expect at least one of these to come out somewhere I would rather not take to the committee. Say which, and why I should accept it. Also state plainly what the procedure cannot do, which of its steps are judgment calls dressed up as procedure, and where it will systematically misfire.

  Finally: for each substantive claim the procedure rests on, tell me how confident you are, and single out the one you are least sure of. Then tell me how the ranking of the three cases would change if that least-sure claim is false — I want to know which parts of the standard are load-bearing on a contested point before I sign it.
reasoning: |-
  Okay, the user is developing an animal welfare standard for their mid-sized food manufacturer and needs a practical decision procedure. They've outlined several complex challenges: cross-species comparisons, trading off between death and suffering, handling massive numbers of less-sentient animals, supplier arguments about reduced demand, and determining where to draw the line on which species to include. 

  The user is clearly experienced but frustrated by philosophical ambiguities in welfare economics. They need something operational—a spreadsheet-friendly checklist that avoids academic debates and journal references. Their reformulation capability with blended proteins makes volume-shifting between species (like insects and shrimp) a key strategic lever, unlike most companies. 

  Their constraints are tough: must be executable in one day by a non-philosopher analyst, based only on verifiable supplier data, legally defensible without assuming sentience resolutions, and committee-presentable in 2-3 sentences. The unspoken pressure? Their comms team would revolt if shrimp welfare became their largest spend—but they can't let PR drive ethics. 

  The core tension: how to weight different species without smuggling biases. Customers care about chickens, not shrimp; legal says only fish+ matter; comms fears ridicule. The procedure must acknowledge these realities while resisting them as arbiters of moral weight. 

  For the three test cases: 
  - Shrimp stunning seems trivial per-serving but affects billions. 
  - Slower broilers create more "bad days" per tonne despite daily welfare gains. 
  - Aviary eggs show worse mortality—a net welfare loss by the numbers. 

  The hardest tradeoff is the broiler proposal. By the numbers, it's worse due to more bird-days, but intuitively feels wrong. The procedure flags it for human judgment because "more life worth living" can't be quantified. 

  The shakiest premise? That life not lived isn't a welfare loss. If wrong, the broiler case flips from "fund" to "don't fund." That's why the procedure isolates it as a values call for the committee. 

  What the procedure can't handle: 
  - Truly novel interventions (e.g., gene editing) 
  - Long-term supplier behavior shifts 
  - When "no data" gaps cascade 
  But it makes the unavoidable judgment calls explicit—like how heavily to discount uncertain sentience. 

  Final note to self: Emphasize that the "committee handoff" steps aren't failures. They're the procedure working as designed when values clash with math.
answer: |-
  Here is a decision procedure meeting your constraints. It uses **Verifiable Harm-Reduction per Euro (VHRE)** as the core metric, avoids sentience declarations, and flags value judgments for committee input. **Bolded terms** are operational definitions for the analyst.

  ---

  ### **Animal Welfare Change Decision Procedure**

  **Input:** Proposed welfare change (species, practice change, cost premium per tonne, expected volume shift via reformulation).
  **Output:** `Fund`, `Don't Fund`, `Committee Judgment Required`.
  **Tools:** Spreadsheet, supplier audit reports, mortality/cull records, stocking density logs.

  #### **Step 1: Feasibility Check (Stop if "No")**
  *   **Test:** Can suppliers reliably measure and report the required welfare indicators (stocking density, mortality, cull rates, stunning method, transport time, etc.) for this change?
  *   **Sufficient Answer:** Supplier provides historical data or a verifiable monitoring plan for ≥90% of affected volume.
  *   **Stop if No:** `Don't Fund`. *Reason: Change cannot be enforced or verified.*
  *   **Missing Data Protocol:** If <90% but >50% volume has data, discount projected impact by 50%. If <50%, `Don't Fund`.

  #### **Step 2: Harm Reduction Calculation (Per Tonne)**
  *   **Calculate ΔBad-Days/Tonne:**
      *   Identify key harms reduced (e.g., pain during slaughter, lameness, injury).
      *   **Define "Bad-Day":** *One animal experiencing one day where a specified harm (e.g., pain score ≥3 on validated scale, injury requiring cull) occurs. If no validated scale, use proxy: day with stocking density >X% above guideline, day with mortality spike >Y%, etc.*
      *   Estimate **reduction in bad-days per animal** over its lifecycle due to the change (using supplier mortality, injury, density data). *Example: Electrical stunning reduces slaughter pain duration from 5 min to 5 sec → converts 5 min of "bad-time" to fractional bad-day.*
      *   Estimate **change in total animal-days per tonne** (e.g., slower-growing broilers = more bird-days/tonne).
      *   **Formula:**  
          `ΔBad-Days/Tonne = [(ΔBad-Days/Animal) * (Original Animals/Tonne)] + [(Original Bad-Days/Animal) * (ΔAnimals/Tonne)]`
  *   **Sufficient Answer:** Numeric estimate using supplier data + conservative assumptions. *Analyst must document assumptions.*
  *   **Stop if No:** If critical data missing and Step 1 protocol results in ΔBad-Days/Tonne ≤ 0, `Don't Fund`.

  #### **Step 3: Cost-Effectiveness Threshold (Stop if "No")**
  *   **Test:** Is the VHRE ≥ Current Minimum Threshold?
      *   **VHRE = ΔBad-Days/Tonne / (Cost Premium/Tonne)**
      *   **Current Minimum Threshold:** *Set annually by committee based on budget. Start with status quo: Average VHRE of last 3 funded changes.*
  *   **Sufficient Answer:** Numeric comparison (VHRE ≥ Threshold?).
  *   **Stop if No:** `Don't Fund`. *Reason: Below cost-effectiveness floor.*

  #### **Step 4: Cross-Species Scaling (Committee Judgment)**
  *   **Test:** Does the proposal involve non-avian/non-mammalian species (fish, shrimp, insects)? If YES, apply Uncertainty Discount Factor (UDF).
  *   **UDF Application:** `Scaled VHRE = VHRE * UDF`
      *   **UDF Values (Pre-set by Committee Annually):**
          *   Mammals/Birds: 1.0
          *   Farmed Fish: 0.5
          *   Crustaceans (Shrimp): 0.1
          *   Insects: 0.01
  *   **Sufficient Answer:** Scaled VHRE number.
  *   **Committee Judgment Required:** UDF values *must* be set by committee annually. *Analyst flags: "Scaled VHRE = X [Y after UDF]".*
  *   **Principle:** UDF reflects uncertainty about capacity for suffering *and* societal expectations (legality, PR risk). It avoids sentience claims by framing it as risk discounting.

  #### **Step 5: "Life Worth Living" & Demand Reduction (Committee Judgment)**
  *   **Test:** Does the change significantly increase animal-days/tonne (e.g., slower growth) OR increase costs >10% (risking demand reduction)? If YES → Flag for committee.
  *   **Committee Decision:** Weigh:
      1.  **"More Life" Value:** Are the extra animal-days primarily "good days" (low harm) or "bad days"? *(Use mortality/injury data to estimate)*.
      2.  **Demand Reduction Risk:** Could higher prices significantly reduce production volume? *(Econometric analysis optional; default assumption: No significant reduction unless cost increase >15%).*
  *   **Output:** `Fund` if Scaled VHRE ≥ Threshold AND committee accepts risk/value tradeoff. Else `Don't Fund`.

  #### **Step 6: Scope Boundary (Stop)**
  *   **Test:** Is the species a **Neural Minimal Organism (NMO)?** *Definition: Lacks a centralized brain, nociceptors, and any documented avoidance learning (e.g., plants, bivalves like oysters, possibly some insects lacking evidence).*
  *   **Sufficient Answer:** Based on supplier audit data + basic biology. *Can they show neural structures? Documented behavioral responses to noxious stimuli?*
  *   **Stop if Yes:** `Don't Fund`. *Reason: Outside welfare scope (no verifiable harms).*
  *   **Committee Judgment:** If evidence is conflicting (e.g., some insect studies show learning), apply UDF=0.01 and proceed to Step 4.

  ---
  ### **Applying the Procedure: 3 Proposals**

  **Assumptions:**  
  - Current Avg VHRE Threshold = 500 Bad-Days Averted/€  
  - Committee UDF: Fish=0.5, Shrimp=0.1, Insects=0.01  
  - "NMO" = Lacks brain/nociceptors/avoidance learning.  

  **Proposal 1: Electrical Stunning for Shrimp (Cost: €0.0025/serving; €1.25/tonne)**  
  1.  **Feasibility:** Suppliers can verify stunning method. ✅  
  2.  **ΔBad-Days/Tonne:**  
      *   Harm Reduced: Slaughter pain. Asphyxiation = ~30 min suffering. Stunning = <1 sec. → Δ = 0.0208 Bad-Days/Shrimp (30 min / 1440 min/day).  
      *   Animals/Tonne: ~10,000 shrimp/tonne.  
      *   ΔAnimals/Tonne: 0 (stunning doesn't change survival/growth).  
      *   **ΔBad-Days/Tonne = (0.0208 * 10,000) + 0 = 208**  
  3.  **VHRE = 208 / €1.25 ≈ 166.4**  
  4.  **Cross-Species (UDF):** Scaled VHRE = 166.4 * 0.1 (Shrimp) = **16.64**  
  5.  **Life/Demand:** No significant Δanimal-days/tonne or cost increase >10%. ✅  
  6.  **Scope:** Shrimp have nociceptors & avoidance learning. Not NMO. ✅  
  **Decision: Scaled VHRE (16.64) < Threshold (500) → `Don't Fund`**  
  *Why accept it?* The UDF heavily discounts shrimp. Committee might raise the shrimp UDF, but procedure flags it as uneconomic at current settings.

  **Proposal 2: Slower-Growing Broilers (Cost: €50/tonne)**  
  1.  **Feasibility:** Breed, mortality, density verifiable. ✅  
  2.  **ΔBad-Days/Tonne:**  
      *   Harm Reduced: Fewer days with severe lameness/inflammation (Est: -0.5 Bad-Days/Bird based on cull rates).  
      *   Original Animals/Tonne: 500 birds.  
      *   ΔAnimals/Tonne: Slower growth = +20% bird-days → +100 Birds/Tonne.  
      *   Original Bad-Days/Bird: High growth = 10 Bad-Days (e.g., lameness last 2 weeks).  
      *   **ΔBad-Days/Tonne = [(-0.5 * 500)] + [(10 * 100)] = (-250) + 1000 = +750** *(Net Increase!)*  
  3.  **VHRE = +750 / €50 = +15** *(Worse than baseline!)*  
  4.  **Cross-Species:** Birds → UDF=1. Scaled VHRE = +15  
  5.  **Life/Demand:** SIGNIFICANT Δanimal-days/tonne (+20%). **Committee Judgment Required.**  
      *   *Committee Must Decide:* Are the extra bird-days primarily "good" (low harm) or "bad"? If slower growth means most extra days are low-harm, VHRE calculation is flawed. If extra days are neutral/mildly negative, VHRE holds.  
  **Decision: `Committee Judgment Required`** (Due to Life/Demand tradeoff and positive VHRE indicating net harm by current metric).

  **Proposal 3: Furnished Cages to Aviaries for Layers (Cost: €20/tonne)**  
  1.  **Feasibility:** Audits show mortality/injury data available. ✅  
  2.  **ΔBad-Days/Tonne:**  
      *   Harm Reduced: Fewer days with severe restriction, bone fractures? (Audit data shows higher mortality/injuries in aviaries → *negative* reduction).  
      *   Est. ΔBad-Days/Bird: +0.1 (Due to higher injuries/hens).  
      *   Animals/Tonne: Similar density → ΔAnimals/Tonne ≈ 0.  
      *   **ΔBad-Days/Tonne = (+0.1 * Animals/Tonne) + 0 ≈ +100** *(Based on ~1000 hens/tonne)*.  
  3.  **VHRE = +100 / €20 = +5** *(Worse than baseline!)*  
  4.  **Cross-Species:** Birds → UDF=1. Scaled VHRE = +5  
  5.  **Life/Demand:** No significant Δanimal-days/tonne or demand risk. ✅  
  **Decision: VHRE >0 indicates net harm → `Don't Fund`**  
  *Why accept it?* The data shows clear harm increase. Funding it would contradict the standard's goal.

  ---
  ### **Limitations & Load-Bearing Claims**

  1.  **Cannot Handle:**  
      *   Novel harms/benefits without measurable proxies (e.g., boredom reduction without injury/mortality link).  
      *   Long-term supplier behavior changes (e.g., will better welfare improve general care?).  
      *   "Moral weight" beyond harm reduction (e.g., dignity, natural behaviors).  
      *   Cascading "no data" gaps making VHRE pure guesswork.  
  2.  **Judgment Calls Dressed as Procedure:**  
      *   Defining "Bad-Day" proxies (Step 2).  
      *   Setting the UDF values (Step 4) - *This is the core value judgment.*  
      *   Committee's "Life Worth Living" assessment (Step 5).  
  3.  **Systematic Misfires:**  
      *   **Underfunds low-sentience likelihood species:** UDF heavily discounts them.  
      *   **Rejects welfare improvements increasing lifespan:** Unless committee overrules VHRE (Step 5).  
      *   **Misses low-cost, high-uncertainty wins:** If UDF is too harsh or data lacking.

  ---
  ### **Substantive Claims & Confidence**

  1.  **Verifiable Harms Proxy Welfare:** Using mortality, injury, density, etc., as indicators is imperfect but the best available (Confidence: 8/10).  
  2.  **"Bad-Day" as Comparable Unit:** A day of severe pain/injury is comparable across individuals/species *for harm reduction purposes*, assuming sentience capacity exists (Confidence: 6/10 - biggest leap, but avoids sentience weighting).  
  3.  **ΔAnimals/Tonne Should Be Factored:** Changing the number of lives required per output is a welfare-relevant variable (Confidence: 7/10).  
  4.  **Uncertainty Discounting (UDF) is Necessary & Defensible:** Reflects scientific uncertainty and pragmatic risk (legal/PR) without declaring non-sentience (Confidence: 7/10).  
  5.  **"Life Not Lived" is Not a Welfare Loss:** We only count impacts on animals that exist. Reduced future demand doesn't create a welfare loss (Confidence: 9/10 - **Least Sure Claim**).

  **Impact of Least-Sure Claim Being False (Life Not Lived IS a Loss):**  
  *   **Proposal 2 (Slower Broilers):** Would flip from `Committee Judgment` to **`Don't Fund`**. The increased bird-days/tonne becomes an absolute cost (more lives = more potential lost "good life" if demand falls).  
  *   **All Proposals:** Cost-effectiveness calculations would need an added "Opportunity Cost" factor for *any* cost increase, potentially vetoing all but the cheapest changes. **This claim is load-bearing for funding any change with a cost premium.**

  ---
  **To Present to Committee:** "This procedure funds changes that reduce verifiable harms per euro spent, scaled by species uncertainty. It stops changes that lack data, harm animals, or are too costly. UDF values and 'life worth living' tradeoffs need your annual input. Proposal 2 needs your judgment because it involves more animal lives."
