prompt: |-
  Hey — I run a monthly theory night for our local tenants' union. About twenty people, mostly tenants plus a couple of organisers, a whiteboard, eighty minutes, and basically no economics or game theory beyond what people absorb from the news. In two weeks I've got to do the session on why groups get locked into outcomes nobody wants — races to the bottom, multipolar traps, the Moloch thing. Don't explain it to me; I need a plan for how I explain it to them.

  The main thing is that they will walk in already having a theory, and the theory is roughly "the problem is bad people with power" — landlords, basically. So somewhere early I have to get them to see a case where there's no villain, no one chose the outcome, and it's still bad and stable. What I can't decide is whether to lead with that, or to build the machinery first and spring the villain-free point on them around minute forty. Which order, and why — what exactly has to be in place before that point can land?

  Here's the bit I've been chewing on and want the session built around. I've started sorting these situations by three knobs: the selector (whatever's actually doing the choosing — competition, an election, a funder's audit, a hiring process), the step (the individual move an actor makes to gain relative position), and the floor (whether the thing being eroded bottoms out somewhere or just keeps going). My instinct is that people who half-get this idea only ever see the step, and that the selector has to be in place before anyone can see why unilateral restraint just selects you out. But I genuinely can't tell whether the floor belongs early, as a way of sorting cases from each other, or late, as a way of talking about what to do. Where would you put each knob in the sequence and why?

  On the example that has to carry the whole thing. I've got four candidates and I don't trust my own judgement:

  (a) The parade. Everyone stands up to see better, so now everyone's standing, nobody sees any better, and everybody's legs hurt. Vivid, obviously villain-free — but it's one clean move with one obvious answer (everyone sit down, or make a rule), and I worry it teaches them that these are coordination problems you fix by talking to each other, which is the exact confusion I'm trying to prevent.

  (b) The service charges. Restaurants in our high street all adding mandatory fees and surcharges, each one doing it because it makes the headline price look lower than the place next door, until everyone has them, nobody has an advantage, and they all eat the customer resentment. Real, close to home, involves money — and I'm not sure the money helps or just adds noise.

  (c) Their own campaigning. Every tenants' group in the city now has to run a slick social media presence and a legal-aid fund to be taken seriously by councillors, so they're all spending more and more volunteer hours on the same things and none of them gets heard any more than before. This is their actual life, which is worth a lot — but it's also the case where they'll have the strongest opinions and where "we should just all agree to stop" feels most plausible.

  (d) Something from inside our own union: the shift-signup spreadsheet, where whoever grabs the good shifts fastest gets them, so everyone ends up refreshing it at midnight and nobody gets better shifts.

  Which one should carry the eighty minutes, which should be held back as a second or closing case, and what does the carrying case have to have — and lack — structurally? I want the answer to be about the shape of the case, not about which one is funnier, and I want to know what each of the others is good for if it isn't carrying.

  Misconceptions I expect, roughly in the order I think they'll show up — tell me if I've got the order wrong and where precisely in the sequence to head each one off: (1) someone is to blame; (2) oh, so its the prisoner's dilemma and the fix is communication and trust; (3) so we just need everyone to agree to stop, collective willpower; (4) surely the winners like it — someone must be winning, so it can't really be bad for everyone; (5) this is just capitalism (or the flip side: this is just game theory, so it's an excuse for doing nothing); (6) afterwards, seeing Moloch in everything, including in things that are just a bad decision or a shared preference. And if you think one of those isn't a misconception at all and should be granted rather than defused, say so — I'd rather be corrected now than in front of them.

  Two last things. First: I want them to leave able to look at a new situation and say whether it's this, and if it is, where you'd interrupt it. Give me that as a takeaway diagnostic in a sentence someone could actually use out loud at a meeting — not a definition. Second: tell me what to openly refuse to explain at this level and say out loud that I'm leaving out. I'm thinking formal game theory and equilibrium stuff, the tragedy-of-the-commons literature, anything about AI risk, and where the word Moloch even comes from — but tell me if one of those is actually load-bearing for the idea and I'm wrong to cut it. And one question I can ask at the end that tells me whether they've got the idea or just learned a word.
reasoning: |-
  Okay, let me unpack this tenant union organizer's request. They're running a theory night on systemic traps like Moloch, and need to structure an 80-minute session for non-experts. The core challenge is shifting participants from "bad people cause problems" to understanding systems without villains.

  First, the key tension in their approach: Should they start with a villain-free example immediately to disrupt the "bad people" mindset, or build concepts first? Considering their audience walks in with strong pre-existing theories about landlords being villains, I think hitting them with a clean, villain-free case upfront is crucial. The parade example seems perfect for minute 5 - it's visceral, universally relatable, and has zero scapegoats. 

  But the organizer's worried the parade teaches the wrong lesson about coordination being easy. Valid concern. That's why I'd follow it immediately with their shift-signup example (option d). This shows how communication fails when incentives are misaligned - people can't just "agree to stop" because the spreadsheet rewards individual action. The sequence becomes: 1) Parade (simple villain-free intro), 2) Shift signup (shows why talking isn't enough), building to 3) Their own campaigning (option c) as the main case study.

  For the main case study, their tenant campaigning example (c) is strongest despite being messy. Yes, participants will have opinions, but that's good - the emotional weight makes the systemic trap more jarring when revealed. The structural advantages: multiple actors (all tenant groups), clear selector (councillors' attention), visible step (investing in social media/legal funds), and no floor in sight. Most importantly, it lacks what they need: no individual villain (councillors aren't evil), and collective action fails because defectors would gain advantage.

  Now the three knobs question:
  - Selector must come first - before step or floor. Participants need to see what's driving the behavior (e.g., councillors rewarding slick campaigns) before understanding why individuals can't opt out.
  - Step comes second - show the individual actions taken in response to the selector.
  - Floor belongs late, when discussing interventions. The absence/presence of a floor (like regulations) determines whether you focus on stopping erosion or building safeguards.

  For misconceptions, I'd tackle them in this order during the flow:
  1) "Someone's to blame" - addressed immediately with parade example
  2) "Fix is communication" - shattered by shift-signup case
  3) "Collective willpower works" - countered by selector mechanics in main case
  4) "Winners exist" - disproven by service charges example (b) later
  5) "Just capitalism/game theory" - handled in Q&A with concrete diagnostics
  6) "Overapplying the concept" - managed through the takeaway diagnostic

  The diagnostic takeaway should be actionable: "Check if good behavior gets punished - if doing the right thing loses you the game, we're in this trap." This focuses on incentive misalignment rather than definitions.

  Crucially, I'd explicitly omit: 
  - Game theory jargon (Nash equilibrium etc.)
  - Tragedy of the commons debates
  - AI risk/Moloch etymology
  These aren't needed for the core insight. Instead, end with a piercing question: "Imagine your building stopped campaigning on social media - would they get ignored even if others kept doing it?" If they see why the answer is yes, they've got it.
answer: |-
  Here’s a battle-tested plan for your session, structured to dismantle misconceptions while building the core idea. The key is **starting villain-free immediately** to disrupt their default framework, then layering complexity. The "selector" concept is your anchor—everything hinges on establishing it early.

  ### Step-by-Step Session Flow (80 mins total)
  1.  **Min 0-5: Hook with "The Parade" (Villain-Free Intro)**  
      *Why first?* It’s visceral, universally understood, and has **no human villain**. State upfront: *"No one here is greedy or evil. Everyone just wants to see."*  
      *Use it to surface Misconception #1:* Ask: *"Who’s to blame?"* Let them conclude: no one. Trap = emergent outcome.  
      *Risk managed:* Acknowledge its simplicity: *"This seems fixable by talking—but real traps aren’t. Let’s see why."*

  2.  **Min 5-25: Introduce the "Selector" (Core Machinery)**  
      *Build this before steps/floors.* Define: **"The Selector is what rewards or punishes your choices. It’s the rule of the game you can’t change alone."**  
      - Parade example: Selector = *"If you sit, you can’t see; if you stand, you can."*  
      - Add **Shift Signup Spreadsheet (d)** as case #2: Selector = *"First-come, first-served shifts."* Ask: *"What happens if you wait for a ‘good’ shift? What if everyone waits?"*  
      *Key insight:* **Unilateral restraint fails.** Doing the "right" thing (sitting/not refreshing) gets you punished by the selector.  
      *Dismantles Misconception #2/3:* Communication fails because incentives > promises. Collective willpower can’t beat the selector.

  3.  **Min 25-45: Deep Dive: Tenant Campaigning (c) (Carry Case)**  
      *Why it carries:*  
      - **Selector is clear:** Councillors only engage groups with "professional" resources (social media/legal funds).  
      - **Step is relatable:** Investing time/money to "keep up."  
      - **No villains:** Councillors aren’t evil—they’re overwhelmed. Tenant groups aren’t foolish.  
      - **No easy fix:** If one group stops, they lose influence. No "floor" (yet).  
      *Structure the discussion:*  
      - *"Why did groups start doing this?"* (Initial advantage)  
      - *"Why can’t they stop now?"* (Selector punishes stopping)  
      - *"Who benefits?"* → *No one.* Output is identical but costlier. **Dismantles Misconception #4.**  
      *Holds back:* Don’t discuss solutions yet. Focus on why it’s *stable*.

  4.  **Min 45-60: Add "Step" and "Floor" (Knobs 2 & 3)**  
      - **Step:** Individual actions (standing, adding fees, refreshing spreadsheets). *"Steps feel rational in the moment but erode the commons."*  
      - **Floor:** *"Does the erosion stop naturally?"*  
        Parade = No floor (could escalate to standing on chairs).  
        Tenant Campaigning = No floor (costs keep rising).  
        → **Service Charges (b) enters here:** Floor = customer backlash. Ask: *"What might stop fees from rising forever?"*  
      *Why now?* Steps make sense after seeing the selector’s power. Floor transitions to solutions.

  5.  **Min 60-75: Solutions & Misconception Cleanup**  
      - **Interrupting traps:** Focus on **changing the selector** (e.g., rent caps for landlords, standardized metrics for councillors). *"Coordination rarely works unless you alter the rules."*  
      - **Address Misconception #5:** *"Is this just capitalism? No—traps appear in nonprofits, governments, even volunteer groups. It’s about incentive design, not ideology."*  
      - **Address Misconception #6:** *"Not every bad outcome is a trap. If people *want* the outcome (e.g., everyone prefers standing), it’s not Moloch."*

  6.  **Min 75-80: Takeaway & Diagnostic**  
      - **Diagnostic sentence:** ***"If doing the right thing gets you punished by the system, you’re in a trap."***  
      - **Closing question:** *"Imagine your building stops social media campaigning while others continue. What happens? Why?"* (Tests if they grasp selector-driven punishment).  

  ---

  ### Why This Order Works
  - **Villain-free first:** Disrupts "bad people" theory before defenses activate.  
  - **Selector before steps/floors:** Steps feel irrational without understanding the selector’s power. Floors are solution-focused—save them.  
  - **Tenant Campaigning (c) as carrier:**  
    - *Lacks:* Villains, easy fixes, winners.  
    - *Has:* Deep relatability, clear selector, escalating steps, no floor.  
    - *Structurally perfect:* Their emotional investment forces cognitive dissonance when they see no villain.  
  - **Service Charges (b) as closer:** Money adds concreteness, and the "floor" (customer anger) segues into solutions. Hold it until now to avoid early capitalism debates.  

  ### What to Overtly Omit (Say This!)
  *"We’re skipping formal game theory terms (Nash equilibrium), the ‘tragedy of the commons’ literature, AI, and Moloch’s origins. Why? Those are rabbit holes. Today is about spotting the trap pattern—not jargon."*  
  **None are load-bearing.** The core stands on examples and the selector-step-floor framework.

  ### Misconception Order & Counterattacks
  1.  **"Bad people!"** → Crush with **Parade (min 5)**.  
  2.  **"Just communicate!"** → Destroy with **Shift Signup (min 15)**: *"What if you agree not to refresh, but someone does?"*  
  3.  **"Collective willpower!"** → Kill with **Tenant Campaigning (min 35)**: *"Would *every* group citywide agree to disarm? What if one holds out?"*  
  4.  **"Winners exist!"** → Undermine with **Service Charges (min 50)**: *"Do restaurants profit more now? Or just work harder for the same?"*  
  5.  **"Just capitalism/game theory!"** → Neutralize in solutions (min 65): Emphasize apolitical universality.  
  6.  **"Over-application"** → Prevent with diagnostic (min 75): Stress *"punished for doing right"* threshold.  

  ### Why Service Charges (b) Isn’t the Carrier
  It’s excellent but has **hidden villains** (restaurant owners making choices). Use it late to discuss floors/resistance. The shift signup (d) is a better second example—it’s internal, painless, and shows communication futility.  

  Your group will leave seeing traps in their daily fights—armed to diagnose and demand selector-level change. **Crucially, they’ll stop yelling at ghosts and start fixing rules.**
