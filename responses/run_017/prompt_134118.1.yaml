answer: |-
  ### Explanation of the Conceptual Knot

  The "shoving" question—whether simmballs push the careenium or vice versa—appears singular but conflates distinct issues: causal relevance (do simmball states cause changes in the careenium?), explanatory autonomy (can simmball-level rules predict outcomes without substrate details?), and ontological autonomy (are simmball states more than just careenium states?). These are separable, and the answer depends critically on the **mapping and dynamics** between levels, not just dynamical interactions.

  #### 1. Variants and the Shoving Verdict
  - **Pliable careenium (i)**: Verdict: **yes** (simmballs push the careenium).  
    **Decisive feature**: Many-to-one mapping with bidirectional causation. Simmball configurations constrain careenium states (e.g., dents form where balls sit), and careenium dynamics push back (e.g., ridges steer balls). But coarse-graining allows simmball states to be cited as causes: changing a simmball state necessitates a careenium change (e.g., adding a ball always creates a dent).  
    **Mind-body analogue**: Functionalism: mental states (simmballs) multiply realizable in neural substrate (careenium), with bidirectional interaction.  
  - **Indexed careenium (ii)**: Verdict: **ill-posed**.  
    **Decisive feature**: One-to-one mapping and identical dynamics. No coarse-graining exists; simmball and careenium states are isomorphic (e.g., each ball configuration corresponds to one exact substrate state). The levels are dynamically redundant, making "shoving" a verbal dispute about labels, not causal direction. This shows why (i) puzzled us: coarse-graining in (i) creates apparent tension between levels, but (ii) eliminates it by collapsing the distinction.  
    **Mind-body analogue**: Identity theory: every mental state is identical to a specific brain state; no level separation.  
  - **Passive careenium (iii)**: Verdict: **yes** (simmballs push the careenium).  
    **Decisive feature**: Substrate lacks autonomous dynamics; deformations are solely determined by current simmball positions and do not affect future simmball motion. Simmballs deform the careenium (e.g., creating dents), but this is unidirectional. Yet, it seems wrong to say the simmball "level" accomplishes anything because the careenium is **causally inert**: it does not influence the simmball dynamics, which are governed solely by ball-level rules (e.g., collisions). The simmball level is explanatorily complete without referencing the substrate, making the careenium a mere epiphenomenon. What's missing is **causal reciprocity**: the substrate cannot "shove back," so the simmball level operates independently.  
    **Mind-body analogue**: Epiphenomenal physical substrate: body (careenium) is a passive byproduct of mind (simmballs), with no feedback.

  #### 2. Why Coarse-Graining Cuts Both Ways
  Coarse-graining (many-to-one mapping) enables explanatory utility by ignoring substrate details that do not alter simmball outcomes (e.g., predicting primality testing without tracking careenium micro-ripples). However, it simultaneously suggests epiphenomenalism because every event is sufficiently caused by the substrate alone (e.g., a specific careenium state fully determines the next state, regardless of which simmball state it realizes). The principle to resolve this is **interventionist causation**: a variable is causally relevant if intervening on it (while holding other same-level variables fixed) changes the outcome. For simmball states, this requires interventions that alter the simmball configuration independently of the exact careenium state. In the pliable case, such interventions are possible (e.g., adding a ball changes the careenium), supporting causal relevance. However, this relocates disagreement to the **granularity of control**: holding "other variables fixed" may require fixing the careenium state, which is impossible without breaking the mapping. Thus, coarse-graining sustains tension but does not settle whether simmball-level causes are "real" or just pragmatic summaries.

  #### 3. Predictive Indispensability vs. Causal Standing
  Computational tractability of the simmball level (e.g., cheap transition rules) confers **predictive indispensability** but not necessarily **causal standing**. The latter requires that interventions on simmball states (e.g., altering ball arrangements) produce changes in outcomes (e.g., careenium deformations or future ball states) that are not fully explainable by substrate-level interventions. In the pliable case, simmball interventions work (e.g., adding a ball causes a dent), supporting causal relevance. However, if substrate details affect outcomes (e.g., different careenium states for the same simmball state lead to divergent futures), the simmball level lacks **causal completeness**—it may be indispensable for prediction but not a sufficient cause. The difference is empirical: predictive power is about efficiency; causation is about counterfactual dependence under interventions.

  #### 4. Empirical Discrimination
  The issue is partly empirical. A **discriminating test** in the pliable careenium:  
  - **Intervention**: Fix the simmball configuration identically (e.g., same ball arrangement) but vary the careenium state within its equivalence class (e.g., different micro-ripples under the balls).  
  - **Observation**: If future simmball configurations diverge (e.g., balls roll differently despite identical starting positions), then careenium states have **independent causal influence**, refuting explanatory autonomy of the simmball level. This would support that the simmball level is causally relevant (it still deforms the substrate) but not explanatorily autonomous (substrate details matter). If outcomes remain identical, simmball states are causally sufficient. This test separates:  
    - **Causal relevance**: Simmball changes cause careenium changes (observed in all variants except passive, where it is trivially true).  
    - **Explanatory autonomy**: Outcomes predictable from simmball states alone (falsified if careenium variations alter outcomes).  
    - **Ontological autonomy**: Simmball states are more than substrate states (falsified in indexed case; irrelevant in passive case).

  #### Weakest Step
  The claim that the indexed case renders the question "ill-posed" is weakest; one could argue that even with isomorphism, the substrate level is fundamental, making simmballs derivative.

