  ## 4. Residue Report

  ### What maps cleanly:
  - The basic structure of Anselm's argument: a maximal being in the understanding must exist in reality, because otherwise there would be a greater being, contradicting maximality.
  - The use of quantifiers and predicates in the first-order setting.

  ### What had to be fudged:

  - **Anselm's conceivability and the same being in two states**: We had to introduce a new being that is greater, rather than the same being existing. This is a known point of debate.
  - **Gödel's version**: 
     - The definition of essence and necessary existence had to be adapted to the world-indexed setting. 
     - We had to assume that the property of being Godlike is positive, which is not in the original axioms and is a known gap.
     - The modal operators were implemented as quantifiers over worlds, which is S5 but might not reflect the modal aspect if we want to use a different modal logic.
     - The necessary existence property, defined as `□∃y φ(y)` for the essence φ, became `∀ w, ∃ y, φ w y`, which is a strong form of necessary existence: it requires that in every world, there is some being that has φ in that world. This might not be what is intended (which is that the being that is the essence exists in every world).

  ### What has no expression at all:

  - **The notion of "conceivability" as a mental act**: In our formalization, we have `in_understanding` as a predicate, but we don't capture the idea that we can form concepts arbitrarily.
  - **The distinction between existence in the understanding and existence in reality**: In the preorder variant, we have both predicates, but we don't have a way to relate the two except through the greatness relation.
  - **The positivity primitive in Gödel's version**: We had to take it as an uninterpreted constant, and its intended meaning (moral and aesthetic positivity) is not captured.

  ### Specific questions:

  #### 1. Is necessary existence as a first-order property of individuals just the existential quantifier in modal costume?

  In our formalization of Gödel's version, necessary existence of an individual `x` is defined as: for every essence φ of x, necessarily there exists some individual that has φ. This is a second-order property because it quantifies over properties (essences). Moreover, it is defined in terms of the existence of some individual (not necessarily x) in every world. This is not the same as the individual x existing in every world. In fact, the definition does not require that x exists in every world. It only requires that in every world, there is some individual that has the essence φ (which is the essence of x in the actual world). This is sometimes called "necessary exemplification" of the essence.

  So it is not the existential quantifier in a modal costume applied to x, but applied to the property φ. It is impredicative because it quantifies over all properties (in the definition of necessary existence, when we say "for every essence φ").

  #### 2. Does the choice of modal logic do more work than the positivity axioms?

  In our formalization, we used S5 (by taking □ as ∀ over worlds). This is necessary for the last step: from the possibility of a Godlike being we get its necessary existence, and then by S5 we can drop the possibility and get actual existence. But in the proof, we used the S5-like feature that if □P holds at any world, then it holds at the actual world. The positivity axioms are used to show that the Godlike property is possibly instantiated and that it entails necessary existence. Both are crucial. But the modal logic S5 is essential to derive the actual existence from the necessary existence of the exemplification of the essence.

  In the proof assistant, we can see the role of the modal logic by the way we interpret the modal operators. If we used a weaker modal logic, we would not be able to perform the last step (we would need the accessibility relation to be universal). So the choice of S5 is doing work, and it is visible in the proof assistant because we used a universal quantifier over worlds.

  #### 3. The modal collapse result: in your translation does it read as a defect of the axiom set or just as another theorem?

  Modal collapse is the result that in Gödel's system, every truth is necessary. That is, if p is true, then necessarily p is true. This is a consequence of the axioms. In our translation, we would have to prove: ∀ (p : Prop), p → □p. But this is not a Prop in our world-indexed setting because p is a meta-level proposition. If we try to formalize it, we would have to have a world-dependent proposition. In our embedding, we have not defined the truth of arbitrary propositions in all worlds. So we haven't captured modal collapse.

  However, in the standard formalization of Gödel's argument, modal collapse is a theorem. In our residue, we would view it as a theorem, but it might be considered a defect because it collapses the modal distinction.

  ### Overall residue:

  - **Vocabulary's fault**: 
     - The two-layer system (worlds and then predicates) is heavy and makes the argument less readable.
     - The use of higher-order logic (quantifying over properties) is not easily handled in some proof assistants without impredicativity.

  - **Original argument's lack of clarity**:
     - Anselm's argument: the move from "exists in the understanding" to "exists in reality" is fudged by the introduction of a new being. The original argument is not clear on whether we are considering the same being or a different being.
     - Gödel's argument: 
        - The positivity primitive is left uninterpreted.
        - The necessary existence property is defined in a way that does not obviously align with the intuitive notion.
        - The proof that Godlike is positive is missing and is a gap.
        - The definition of essence is very strong and essentially requires that the essence is the property of being that individual.

  ## Conclusion

  The preorder variant is simpler and easier to check in a proof assistant. It avoids the complexity of modal logic and higher-order properties. However, it loses the modal aspect of necessary existence. The residue report shows that both the vocabulary and the original arguments have their own share of fudges and gaps.
