answer: |-
  ### Decision Procedure for Bongard-Style Task Review

  **Goal**: Accept only tasks where the 12 panels uniquely determine the intended rule, minimizing ambiguity from competing rules. The procedure systematically checks for common pitfalls (extensional/grid-based rules, low-level correlates, non-complementary rules, vagueness) and requires feasible minimal pairs to separate competitors. Annotators have 20 minutes per task and no philosophy background.

  ---

  #### **Procedure Steps**  
  *(Run in order; stop at first "reject" or escalate if marked)*  
  1. **Clarity & Non-Vagueness Check**  
     - **Question**: Is the rule stated clearly without vague thresholds (e.g., "large," "approximately") or tolerances?  
     - **Sufficient Answer**: Rule uses discrete, objective properties (e.g., "contains a triangle," "rotationally symmetric").  
     - **Stop if No**: Reject if vague (e.g., "complex shape," "mostly symmetric").  
     - **Judgment Call?** No. Rule must be mechanically applicable.  

  2. **Complementarity Check**  
     - **Question**: Do the A and B rules partition *all possible panels* exhaustively and exclusively?  
     - **Sufficient Answer**: Every panel must be classifiable as A or B (no gaps/overlaps). Example failure: A = "has triangle," B = "has circle" → panels with both/neither break the rule.  
     - **Stop if No**: Reject.  
     - **Judgment Call?** No. Gaps/overlaps are factual errors.  

  3. **Grid-Position Competitor Check**  
     - **Question**: Do the A/B labels correlate perfectly with grid position (e.g., row, column, 2x2 block)?  
     - **Sufficient Answer**: If a simple grid rule (e.g., "top row is A") fits all 12 panels, reject.  
     - **Stop if Yes**: Reject (minimal pairs can’t fix grid dependencies).  
     - **Judgment Call?** No. Grid correlations are verifiable.  

  4. **Low-Level Feature Competitor Check**  
     - **Question**: Is the rule reducible to size, stroke width, color, or pixel density?  
     - **Sufficient Answer**: Measure panels (e.g., bounding-box area, stroke width). If a low-level rule fits perfectly (e.g., "area > 100 units² = A"), escalate to maintainer.  
     - **Escalate**: Maintainer decides if the correlate is "natural" (e.g., stroke width may be intentional).  
     - **Judgment Call?** Yes (maintainer decides naturalness).  

  5. **Competitor Generation & Minimal Pairs**  
     - **Step 1**: Identify ≥1 non-trivial competitor rule that fits the 12 panels (e.g., component parity, shape count).  
       - *Always include extensional rule* (A = {panel1, panel2, ...}).  
       - *Required*: Find ≥1 geometric competitor (e.g., "even components = A").  
     - **Step 2**: For each competitor, design a **minimal pair** of SVG-drawable panels:  
       - Panel X: Intended rule says A, competitor says B.  
       - Panel Y: Intended rule says B, competitor says A.  
     - **Sufficient Answer**: Sketches/descriptions of X and Y (e.g., "X: rotationally symmetric shape with odd components").  
     - **Stop if No**: Reject if any minimal pair is impossible to draw (e.g., violates physics) or violates rule clarity.  
     - **Judgment Call?** Partially (competitor creativity), but minimal pairs are factual.  

  6. **Output**  
     - **Accept**: All checks pass, no edits needed.  
     - **Accept-with-Required-Edit**: Fixable issue (e.g., break low-level correlate in existing panels).  
     - **Reject**: Unfixable failure (steps 1–3 or minimal pairs impossible).  

  ---

  #### **Key Distinctions & Tradeoffs**  
  - **Kept**:  
    - **Minimal pairs**: Core to ensuring rules are distinguishable (addresses underdetermination).  
    - **Complementarity**: Prevents ambiguous classifications.  
    - **Low-level/grid checks**: Targets common confounds.  
  - **Dropped**:  
    - **Philosophical "naturalness"**: Delegated to maintainer (avoids annotator bias).  
    - **Pixel density**: Irrelevant for SVG (vector graphics).  
  - **Cost of Dropping**:  
    - "Naturalness" judgment deferred to maintainer (step 4) → avoids rejections for intentional low-level rules.  
  - **Misfires**:  
    - May reject valid tasks if annotators miss subtle competitors (step 5).  
    - May escalate tasks where low-level features are intentional (step 4).  

  ---

  ### **Application to Example Tasks**  
  #### **Task 1: Symmetry vs. Component Parity**  
  - **Rule**: A = 180° rotational symmetry; B = not symmetric.  
  - **Competitor**: Component parity (A = even, B = odd).  
  - **Checks**:  
    1. Clear? **Yes**.  
    2. Complementary? **Yes** (symmetry is binary).  
    3. Grid-based? **Assume no** (no position correlation).  
    4. Low-level? **Assume no** (no size/stroke correlate).  
    5. Minimal Pairs:  
       - vs. Parity: X (symmetric but odd components, e.g., asymmetric shape with odd parts) → **A by intended, B by competitor**.  
       - Y (non-symmetric but even components, e.g., two asymmetric shapes) → **B by intended, A by competitor**.  
  - **Verdict**: **Accept** (minimal pairs feasible).  

  #### **Task 2: Prime vs. Composite Components**  
  - **Rule**: A = prime component count; B = composite count.  
  - **Checks**:  
    1. Clear? **Yes**.  
    2. Complementary? **No** (count = 1 is neither prime nor composite → unclassifiable gap).  
  - **Verdict**: **Reject** (fails complementarity).  

  #### **Task 3: Triangle vs. Circle Presence**  
  - **Rule**: A = contains triangle; B = contains circle.  
  - **Checks**:  
    1. Clear? **Yes**.  
    2. Complementary? **No** (panels with both or neither shapes are unclassifiable).  
    3. **Minimal Pair Test**: Irrelevant (already rejected).  
  - **Verdict**: **Reject**.  
  - **Required Fix**: Redefine rules (e.g., A = "contains triangle but no circle," B = "contains circle but no triangle") and ensure no panel has both/neither.  
  - **Shipped Tasks**: Must be **pulled** (or edited) unless they explicitly exclude both/neither cases.  

  ---

  ### **Annotation Workflow**  
  1. Spend ≤5 min on steps 1–3 (clearness, complementarity, grid).  
  2. Spend ≤10 min on steps 4–5 (low-level, competitors, minimal pairs).  
  3. If minimal pairs are challenging, reject.  
  4. Escalate only for low-level correlates (step 4).  

  **Outcome**: Ensures tasks are unambiguous with minimal annotator burden. Tasks 1 and 2 are clear rulings; Task 3 is rejected but fixable with edits. Shipped "triangle vs. circle" tasks violate complementarity and must be revised.
