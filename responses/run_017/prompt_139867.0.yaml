prompt: |-
  Bit of a niche one on evolutionary debunking arguments. The two standard versions as I get them: the coincidence version — if moral facts are independent of whatever shaped our moral beliefs, the realist owes an explanation of why the two line up, and the options are the tracking account (the pressures somehow homed in on the facts) or the adaptive-link account (our judgements got selected for being useful, and their truth is beside the point); and the insensitivity version — the causal story would have handed us these beliefs whether or not they were true, which is meant to undercut them.

  Here's the bit I never see discussed. Suppose the actual genealogy turns out to be mostly neutral drift rather than selection: a random walk through normative space, where the variants that spread spread for reasons with nothing to do with their content. Drift looks worse for the realist in one way — there is no pressure toward truth at all — but better in another: there's no systematic push toward falsehood either, no parochialism or kin favouritism installed in us that someone then has to explain away. My hunch is that drift is on balance less damaging than selection, but I can't tell whether that's actually right or how to price the two effects against each other.

  Give me two seperate numbers: your credence that at least some of our core moral beliefs amount to knowledge of mind-independent moral facts, conditional on drift, and conditional on selection. Mine are around 0.3 and 0.15. Then decompose them — how much rides on whether a third-factor explanation is available, how much on whether the analogy to perceptual or mathematical belief survives, how much on whether debunking arguments generalise to our epistemic and logical beliefs and so prove too much, how much on whether justified means reliably formed as opposed to internally coherent — tell me which term your numbers are most sensitive to, and which one you'd revise first if you had to. Also: what single argument or finding would move you most, and where do you think your own reasoning is most likely to be broken? British English please.
reasoning: |-
  Okay, this user is diving deep into evolutionary debunking arguments in metaethics - clearly someone with serious philosophy background. They're wrestling with how different evolutionary mechanisms (selection vs drift) affect moral realism, and specifically want quantified credences broken down. 

  First impression: This is refreshingly precise. Most people don't distinguish selection from drift in this context. Their hunch that drift might be less damaging than selection is interesting - I need to test that. 

  Breaking it down: Under selection pressures, the worry is systematic distortion (e.g. kin bias). But drift is random noise - no truth-tracking but no distortion either. Like flipping coins vs loading dice. Their 0.3 vs 0.15 credences seem plausible but I'll refine. 

  Key variables they want addressed: Third-factor explanations (e.g. constitutive luck), perceptual/math analogies, self-defeat worries (if debunking generalizes), and reliabilism vs coherentism. 

  Biggest vulnerability in my view? The analogy to math/logic. If moral facts necessarily guide successful action (unlike math), that changes everything. A single knock-down argument showing moral properties must be action-guiding would massively shift my numbers. 

  Personal blind spot: I might be overrating third-factor accounts. Street's "Darwinian Dilemma" paper keeps haunting me - her point about representational content being fitness-oriented feels hard to escape. 

  Final credences: Drift gets 0.33 because randomness could accidentally align with truth. Selection gets 0.15 because adaptive false beliefs seem more probable than adaptive true ones. That perceptual argument about necessary truth-connection? That's the lever that could break this whole thing open.
answer: |-
  Right, let's tackle this properly—evolutionary debunking arguments (EDAs) are slippery beasts, and the drift vs. selection distinction is underexplored. Your framing is spot on: **drift** (neutral, random fixation of moral beliefs) lacks truth-tracking pressure but avoids *systematic* distortion, while **selection** (adaptive shaping) risks bundling false-but-useful beliefs. Your credences (0.3 for drift, 0.15 for selection) feel reasonable—here’s my take, decomposed.

  ### My Credences:
  1. **Conditional on drift**: **0.33**  
     *(Slightly more optimistic than yours—drift’s randomness leaves room for accidental alignment.)*  
  2. **Conditional on selection**: **0.12**  
     *(Slightly more pessimistic—adaptive benefits heavily favour utility over truth.)*  

  ---

  ### Decomposing the Credences  
  **Key Variables & Sensitivities**:  
  | **Factor** | **Weight in Drift (0.33)** | **Weight in Selection (0.12)** | **Dominant Sensitivity** |  
  |------------|----------------------------|-------------------------------|--------------------------|  
  | **Third-factor explanations** | 40% | 50% | **Highest for selection** (Realist *must* explain coincidence without tracking—e.g., "co-evolution" of facts/fitness. Failure here sinks realism faster under selection.) |  
  | **Perceptual/mathematical analogy** | 30% | 25% | **Moderate** (If moral facts are *necessarily* action-guiding like prudential facts, not "detached" like maths, selection looks less damaging. Drift is less affected.) |  
  | **Self-defeat/generalisation worry** | 15% | 15% | **Low** (EDAs *do* threaten logic/epistemology, but this cuts both ways—it may force anti-realists into global scepticism. I discount this slightly.) |  
  | **Reliabilism vs. coherentism** | 15% | 10% | **Lowest** (Even if justification is internalist, the *genealogical challenge* to truth-connection remains. More relevant to "knowledge" than "justification".) |  

  **Where I’d Revise First**:  
  - **Third-factor accounts**. If we found a plausible link between moral truth and evolutionary success (e.g., "cooperation *constitutively* requires fairness"), my selection credence could jump to ~0.25. Without it, selection drops to <0.05.  
  - **Drift** is most sensitive to the **perceptual analogy**. If morals are *uniquely* disconnected from adaptive truth (unlike perception), drift’s credence falls to ~0.15.  

  ---

  ### The Biggest Lever: What Would Move Me Most?  
  A single argument/finding that **morally relevant properties (e.g., welfare, agency) are *necessarily* implicated in evolutionary success** would shift me dramatically. For example:  
  - If we proved that *any* adaptive social species *must* converge on "proto-moral" norms tracking mind-independent facts (e.g., via game theory), **selection credence → 0.4+**.  
  - Conversely, evidence that successful tribes thrived on *radically false* moral beliefs (e.g., ritual sacrifice boosting cohesion) **→ selection credence → 0.05, drift → 0.2**.  

  ---

  ### Where My Reasoning is Likely Broken  
  **Blind spot: The "Necessity" of Moral Truths**.  
  - I’m assuming moral facts *could* be inert (like maths), but if they’re inherently action-guiding (e.g., "ought implies can"), their evolutionary emergence isn’t coincidental. I’ve underweighted this in the perceptual analogy term.  
  - **Selection bias**: I focus on *content* (e.g., "kin favouritism"), but the deeper threat is the *mechanism*—why would *any* belief-forming process shaped by fitness track moral truth? I might be over-optimistic about drift’s "neutrality".  

  **In short**: Your hunch holds—drift is less damaging (0.33 > 0.12) because it dodges *systematic* falsehood. But both hang on third-factor explanations. If I had to bet, I’d say realism’s fate hinges on whether moral facts are "shapeless" (vulnerable to drift/selection) or structurally woven into practical rationality (resilient). Street’s challenge still bites.
