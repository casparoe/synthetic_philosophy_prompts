  Okay, the user needs a speech for his wife's citizenship ceremony. Let me start by understanding the context. His wife just became a citizen after 14 years, lawyers, and a rescheduled interview. The ceremony has 180 new citizens from 50 countries, families, officials, and notably, some undocumented attendees, including his mother-in-law. Plus, family members with conflicting views: one in Border Patrol, another an immigration lawyer critical of the system.

  The key challenge is balancing the tone. He doesn't want the typical "welcome" speech that implies the hosts are graciously allowing them in. Instead, he wants to acknowledge their new role as members with agency. But it can't be a protest speech since it's his wife's special day. Also, the speech needs to be simple for non-native speakers, avoid clichés, and not make undocumented attendees feel either criminalized or pitied.

  First, the speech must shift from hospitality to membership. That means focusing on their new rights and responsibilities, not just gratitude. Phrases like "you belong here" or "this country is yours now" emphasize ownership. Avoiding "welcome" is tricky; maybe replace it with affirmations of belonging and participation.

  He mentioned the mother-in-law's presence. The speech should subtly include those without status without singling them out. Words like "every person here" or "all of us" can encompass everyone. Also, acknowledging family sacrifices without making it about legality.

  The conflicting family dynamics: Border Patrol brother-in-law and critical lawyer sister. The speech shouldn't alienate them but promote unity. Highlighting shared responsibility and collective effort might bridge that. Phrases like "we live this together" or "belongs to all of us" can include diverse perspectives.

  Practical aspects: short sentences, no jargon, 4-5 minutes. Avoid quotes, clichés like melting pot. Keep it heartfelt but concise. Start with a hook—mentioning the journey and effort. Then transition to membership, rights, and responsibilities. End with congratulations and pride.

  Check if the draft meets all points. Opening acknowledges the struggle. Defines citizenship as membership, not hospitality. Uses "belong" instead of "welcome." Includes families and sacrifices. Addresses collective responsibility. Simple language. No protest tone, just empowerment. Subtle nod to undocumented by mentioning "every person here."

  Possible pitfalls: Avoiding "welcome" entirely might be hard, but replacing it with "belong" works. Ensuring the mother-in-law isn't singled out but feels included. Balancing agency without provoking family tensions. The draft seems to navigate this by focusing on unity and shared future. Ending with the oath reminds everyone of the ceremony's purpose, bringing it back to the celebratory aspect.
answer: |-
  Here’s a speech draft focusing on **membership**, **belonging**, and **shared future**, avoiding "welcome," clichés, protest, or awkwardness for your complex audience. It uses simple, direct language:

  ---

  **(Start with quiet sincerity, looking at the new citizens)**

  **"Fourteen years. Two lawyers. One interview delayed by snowstorms twice.**  
  **(Pause, slight smile)**  
  **That was just *one* journey ending here today. Your journeys? Each unique. Each demanding. Years of waiting, working, learning, proving. Holding onto hope through paperwork and uncertainty. You carried that weight. You earned this moment.**

  **But today isn’t just an ending. It’s a profound beginning. A shift.**

  **Before today, being here? For many, it was about permission. About conditions, papers, visas. About being *allowed* to be here.**

  **Today changes that.**

  **Today, you become members. Full members. Not guests. Not applicants. Members.**

  **What does that mean?**

  **It means this country isn’t just a place you live *in* anymore. It’s a place you *belong* to. It’s yours. Its future is yours to help shape. Its strengths are yours to celebrate. Its flaws? They are yours to help fix. That’s the power – and the responsibility – you take on today.**

  **You belong here. You have the right to speak, to vote, to demand better, to build. You have the right to say, 'This is my home, and here is how it should be.' You have the right to disagree – even about the very doors you walked through.**

  **Look around. (Gesturing slightly) See the people who walked alongside you? Family. Friends. Loved ones. They sacrificed too. They held your hope when yours wavered. They belong in this story. Their strength is part of your strength today.**

  **This room holds many stories. Many paths. Many views on what borders mean, what fairness looks like. That’s okay. That’s America too. Today isn’t about agreeing on everything. Today is about agreeing on one fundamental thing: You belong. You are part of *us* now.**

  **You are no longer asking for a place at the table. You *are* the table. You help set the table.**

  **So, this afternoon, breathe deep. Feel the weight lift. Feel the new ground beneath your feet. This is yours. You built it. You fought for it. You earned it.**

  **Congratulations. Not just on becoming citizens, but on claiming your place. On becoming members. We live this future together now.**

  **(Nod decisively, step back)**  
  **It is my deep honor to witness this moment for you, and for my wife. Thank you."**

  ---

  **Why this works for your specific situation:**

  1.  **Avoids "Welcome":** Replaces it with "You belong," "It’s yours," "You are part of us," "claiming your place."
  2.  **Focus on Membership:** Explicitly contrasts "permission/allowed/guests" with "members/belong/shape/fix/rights/responsibility." The "table" metaphor reinforces agency.
  3.  **Acknowledges Undocumented Presence Subtly:** "The people who walked alongside you... Family... Friends... Loved ones. They sacrificed too. They belong in this story." This includes your mother-in-law and others without naming status, focusing on shared humanity and contribution to the *citizen's* journey. It avoids labeling it a "favor" or a "crime."
  4.  **Handles Diverse Family Views:** "This room holds many stories... Many views... That’s okay. That’s America too. Today isn’t about agreeing on everything. Today is about agreeing on one fundamental thing: You belong." This acknowledges the tension (BP brother, lawyer sister) without fueling it, focusing on the unifying moment for the *new citizens*.
  5.  **Avoids Clichés & Lectures:** No "nation of immigrants," "melting pot," quotes, or philosophers. Plain language, short sentences.
  6.  **Respects the Occasion:** Centers the new citizens' effort ("You earned this," "You carried that weight"), celebrates the achievement ("profound beginning," "breathe deep," "feel the weight lift"), and avoids protest while affirming their new rights ("demand better," "disagree," "how it should be").
  7.  **Personal Connection:** Starts with your wife's specific journey (briefly, factually) as an example, ends with your personal honor/perspective.
  8.  **Sets Up the Oath:** The focus on rights, responsibility, and belonging naturally leads into the Judge administering the Oath of Allegiance.

  **Delivery Tips:**

  *   Speak slowly and clearly. Pause after key lines ("Members," "You belong," "That’s the power – and the responsibility").
  *   Make genuine eye contact with the new citizens throughout.
  *   Keep the tone sincere, respectful, and strong – acknowledging the struggle while celebrating the achievement and future agency.
  *   When mentioning "family... friends... loved ones," a brief, warm glance towards their section is appropriate.

  This speech respects the complexity in the room while squarely focusing on the transformative power of the moment for the 180 people becoming citizens, granting them the standing you feel they deserve. It avoids landmines while speaking truth. Good luck!
