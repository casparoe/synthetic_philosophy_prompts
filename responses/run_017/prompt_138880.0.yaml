  We are designing a procedure for classifying research misconduct cases into predefined categories: fabrication, falsification, plagiarism, Questionable Research Practice (QRP), honest error, or no finding. The procedure must be usable by a committee of nine clinicians in about 40 minutes, with legal counsel present. The key insight is that categorization is based on analogy to exemplar cases and framing, not necessary-and-sufficient conditions.

  Core ideas from cognitive science to preserve:
  - **Exemplar-based categorization**: We anchor each category with a few clear, named exemplar cases. New cases are compared to these exemplars.
  - **Framing effects**: The same case can be seen differently depending on the frame (e.g., is the issue about authorship, data integrity, etc.?). We need to make the frame explicit.
  - **Conceptual slippage**: Categories can stretch over time. We will log such stretches and periodically review them.

  Ideas to drop for simplicity:
  - **Prototype-based categorization**: While useful, it's harder to operationalize in a committee setting. We stick to concrete exemplars.
  - **Family resemblance**: We acknowledge it, but for efficiency we focus on analogy to exemplars and explicit framing.
  - **Necessary-and-sufficient conditions**: We reject this approach because it causes the very disputes we want to avoid.

  The procedure will have:
  1. A set of fixed exemplar cases for each category (to be defined by the committee in advance).
  2. A sequence of questions that force a choice of frame and then an analogy to an exemplar.
  3. Explicit stop points (e.g., no finding, refer to committee, etc.).
  4. Separation of classification (which box) from severity (sanction).

  Mechanisms to build in:
  - **Slippage ledger**: Each non-central classification is logged with the frame and the stretched slot. Reviewed annually.
  - **Precedent rule**: If a stretch occurs and is accepted by the committee without triggering a category split or merger, it becomes binding for future coders. If it causes significant disagreement, it triggers a formal review of category definitions.
  - **Contraction test**: Periodically (e.g., annually), the committee must name a hypothetical case that would fall outside each category. If they cannot, the category is deemed "too fluid" and must be redefined or split.
  - **Separation of classification and severity**: The procedure only classifies; severity is handled later.

  What we lose by this approach:
  - We lose the ability to say a classification is "simply wrong" in an absolute sense. Instead, we have a record of how the category has been applied over time, and classifications are justified by analogy and frame. This might make the system feel less objective, but it is more honest about how concepts actually work.

