  ### Brainstorming: Core Distinctions to Preserve and Drop
  As a philosopher of concepts and policy drafter, I'll preserve key insights while prioritizing operational simplicity for your committee. The goal is a procedure that leverages analogy and framing without overloading clinicians.

  **Preserve:**
  1. **Exemplar-based anchoring**: Use clear, pre-defined "paradigm cases" for each category (e.g., "copying another's paragraph" for plagiarism). New cases are classified by analogy to these exemplars.  
  2. **Framing effects**: Explicitly identify the "slot" of ambiguity (e.g., "whose words?" or "what counts as a record?"). This forces the committee to articulate why a case feels like an exemplar.  
  3. **Conceptual slippage tracking**: Log when categories stretch (e.g., plagiarism extended to self-reuse). This creates an audit trail for category evolution.  
  4. **Family resemblance**: Acknowledge that categories share overlapping features (e.g., "damaging the record" links QRP to falsification), but don't require defining all features.  

  **Drop:**  
  1. **Prototype-based grading**: Avoid weighting features (e.g., "how many copied words?"). Clinicians lack time for scoring.  
  2. **Necessary-and-sufficient conditions**: Reject strict definitions (e.g., "plagiarism requires intent"). Focus on analogy, not boundary-policing.  
  3. **Conceptual drift historicity**: Ignore how categories evolved (e.g., why QRP was added). Focus on current use.  
  4. **Fluid-concept puzzles**: Don't embed abstract tests (e.g., "What does ijk go to?"). Use concrete exemplars.  

  This preserves cognitive realism while simplifying execution. Now, the procedure.  

  ---

  ### Procedure: Research-Integrity Classification  
  **Principles:**  
  - **Input**: Triage pair’s case summary (facts only; no interpretation).  
  - **Output**: One category (fabrication, falsification, plagiarism, QRP, honest error, no finding) or a referral.  
  - **Process**: Sequential questions; stops at first sufficient answer.  
  - **Exemplars**: Pre-defined by committee (see *Annex A*). Each classification must state: *"This case is to [category] as [exemplar] is to [exemplar's category], with slippage in [slot]."*  
  - **Severity Separation**: Classification is independent of sanctions. Sanctions are decided post-classification.  
  - **Slippage Ledger**: Non-central classifications log: (1) case ID, (2) stretched slot, (3) frame chosen. Reviewed annually.  
  - **Precedent Rule**: If a slippage is uncontested (≤1 dissent), it becomes binding. If contested (≥2 dissent), trigger category review.  
  - **Contraction Test**: At annual review, committee must name *one* hypothetical case outside each category. If impossible, category is "too fluid" and must be split/merged.  

  **Steps:**  
  1. **Initial Filter (1 min)**:  
     - *Question*: Does the case involve a *research output* (e.g., paper, dataset, image)?  
     - *Sufficient answer*: **No** → Stop: **no finding**.  
     - *Values referral*: None (purely factual).  

  2. **Frame Selection (5 min)**:  
     - *Question*: "Which *aspect* is primarily at issue? Choose one:  
       (A) **Words/text** (e.g., unattributed copying, generative text).  
       (B) **Data/images** (e.g., manipulation, invention).  
       (C) **Ideas/concepts** (e.g., unattributed ideas).  
       (D) **Presentation/context** (e.g., undisclosed methods affecting interpretation)."  
     - *Sufficient answer*:  
       - A or C → Proceed to **Plagiarism Path**.  
       - B → Proceed to **Fabrication/Falsification Path**.  
       - D → Proceed to **QRP Path**.  
     - *Stop points*:  
       - If disagreement on frame (≥2 dissent) → **Refer to full committee** for vote.  
     - *Values referral*: Frame choice is values-based (what "matters most").  

  3. **Plagiarism Path** (for frames A or C):  
     - *Question 3.1*: "Is there verbatim/near-verbatim copying of *another's* words without attribution?"  
       - *Yes* → Classify as **plagiarism** by analogy to exemplar P1 (*"as P1 is to plagiarism"*).  
       - *No* → Go to Question 3.2.  
     - *Question 3.2*: "Is there unattributed use of *another's* ideas/concepts (not common knowledge)?"  
       - *Yes* → Classify as **plagiarism** by analogy to P2 (*"as P2 is to plagiarism"*).  
       - *No* → Go to Question 3.3.  
     - *Question 3.3*: "Does the act involve *self-owned* words/ideas (e.g., self-reuse)?"  
       - *Yes* → Log slippage (slot: "whose words/ideas"). Classify as **QRP** by analogy to Q2 (*"as Q2 is to QRP"*).  
       - *No* → Stop: **no finding** for plagiarism.  
     - *Stop points*:  
       - If copying/use is disputed → **Refer to triage pair** for fact-check (if unresolved, **no finding**).  

  4. **Fabrication/Falsification Path** (for frame B):  
     - *Question 4.1*: "Was data/imagery *invented* (never existed)?"  
       - *Yes* → Classify as **fabrication** by analogy to Fa1 (*"as Fa1 is to fabrication"*).  
       - *No* → Go to Question 4.2.  
     - *Question 4.2*: "Was existing data/imagery *manipulated* (e.g., altered, spliced, enhanced)?"  
       - *Yes* → Go to Question 4.3.  
       - *No* → Proceed to **QRP Path**.  
     - *Question 4.3*: "Did the manipulation *change the research representation* (e.g., hiding inconsistencies)?"  
       - *Yes* → Classify as **falsification** by analogy to F1 (*"as F1 is to falsification"*).  
       - *No* → Log slippage (slot: "manipulation of presentation"). Classify as **QRP** by analogy to Q3 (*"as Q3 is to QRP"*).  
     - *Stop points*:  
       - If intent/effect disputed → **Refer to counsel** (legal risk).  

  5. **QRP Path** (for frame D or referrals):  
     - *Question 5.1*: "Does the act *damage the research record* but *not* fit fabrication, falsification, or plagiarism?"  
       - *Yes* → Go to Question 5.2.  
       - *No* → Stop: **no finding**.  
     - *Question 5.2*: "Is it analogous to a QRP exemplar (Q1, Q2, Q3)?"  
       - *Yes* → Classify as **QRP** (e.g., *"as Q1 is to QRP"*).  
       - *No* → Log slippage (slot: e.g., "undisclosed tool use"). Classify as **QRP** (*"residual damage to record"*).  
     - *Stop points*: None beyond this.  

  6. **Honest Error Check** (post-classification; 2 min):  
     - *Question*: "Is there clear evidence the act was *intentional or reckless*?"  
       - *No* → Reclassify as **honest error** by analogy to H1 (*"as H1 is to honest error"*).  
       - *Yes* → Classification stands.  
     - *Stop points*:  
       - If evidence ambiguous → **Refer to full committee**.  

  7. **Final Output**:  
     - State classification with: (1) analogy statement, (2) slippage slot (if any).  
     - Update slippage ledger if non-central.  

  **What We Lose**:  
  - **Absolute correctness**: We can’t say a classification is "simply wrong," only "inconsistent with past analogies." This sacrifices definitional objectivity for operational clarity.  
  - **Predictability**: Categories evolve via slippage, so outcomes may shift over time.  
  - **Boundary precision**: Ambiguous cases are forced into boxes (via QRP), risking over-categorization.  

  **Contestable Design Choices**:  
  1. **Frame selection as Step 2**: Forces early, values-laden framing. Risk: Oversimplifies multi-issue cases. *Why kept?* Prevents circular debates.  
  2. **QRP as residual catch-all**: May stretch QRP beyond meaning. *Why kept?* Avoids paralysis; slippage ledger tracks inflation.  
  3. **Contraction test reliance**: Assumes committees can imagine category boundaries. *Empirical risk*: Clinicians may struggle with hypotheticals.  

  ---

  ### Exemplars (Annex A)  
  *Pre-defined by committee; used in procedure:*  
  - **Plagiarism (P)**:  
    - P1: Copying a paragraph from another paper without citation.  
    - P2: Using another’s unique methodology without attribution.  
  - **Fabrication (Fa)**:  
    - Fa1: Inventing survey responses.  
    - Fa2: Generating false patient data.  
  - **Falsification (F)**:  
    - F1: Cropping a gel image to hide contradictory bands.  
    - F2: Altering data points to strengthen correlations.  
  - **QRP (Q)**:  
    - Q1: Undisclosed conflict of interest.  
    - Q2: Redundant publication of same data.  
    - Q3: Adjusting image contrast without disclosure.  
  - **Honest Error (H)**:  
    - H1: Miscalculation due to spreadsheet error.  
  - **No Finding (N)**:  
    - N1: Authorship dispute without misrepresentation.  

  ---

  ### Case Applications  
  **Case 1: Resident reuses own methods text verbatim without attribution.**  
  - **Step 0**: Involves research output → Proceed.  
  - **Step 1 (Frame)**: Aspect is **words/text (A)** → Plagiarism Path.  
  - **Step 3.1**: Verbatim copying? **Yes**, but not "another’s" → Proceed to 3.3.  
  - **Step 3.3**: Self-owned words? **Yes** → Log slippage (slot: "whose words").  
    - Analogize to Q2 (redundant publication): *"This case is to QRP as Q2 is to QRP."*  
  - **Step 6 (Honest Error)**: Intentional? **Yes** (reuse is deliberate) → Final: **QRP**.  
  - **Your instinct overturned?** Yes. You saw this as trivial (no finding), but Step 3.3 frames self-reuse as QRP due to "damage to record" via redundancy.  

  **Case 2: Postdoc uses undisclosed LLM; text has unsupported claims.**  
  - **Step 0**: Research output → Proceed.  
  - **Step 1 (Frame)**: Primary issue is **presentation/context (D)** (undisclosed tool + misleading claims) → QRP Path.  
  - **Step 5.1**: Damages record? **Yes** (false claims + misleading authorship).  
  - **Step 5.2**: Analogous to Q1/Q2/Q3? **No** → Log slippage (slot: "undisclosed tool use + false inference").  
    - Classify as **QRP** (*"residual damage to record"*).  
  - **Step 6 (Honest Error)**: Intentional? **Yes** (undisclosed use) → Final: **QRP**.  
  - **Your instinct**: Consistent (non-trivial).  

  **Case 3: Technician splices gels without disclosure; historical practice.**  
  - **Step 0**: Research output → Proceed.  
  - **Step 1 (Frame)**: Aspect is **data/images (B)** → Fabrication/Falsification Path.  
  - **Step 4.1**: Data invented? **No** → Proceed.  
  - **Step 4.2**: Manipulated? **Yes** (splicing + contrast adjustments) → Proceed.  
  - **Step 4.3**: Changed representation? **Yes** (splicing presents non-contiguous data as contiguous) → Analogize to F1: *"This case is to falsification as F1 is to falsification."*  
  - **Step 6 (Honest Error)**: Intentional? **No** (historical practice) → Reclassify as **honest error** (*"as H1 is to honest error"*).  
  - **Your instinct overturned?** Partially. You saw it as serious, but Step 6 reclassifies as honest error due to lack of intent. Step 4.3 does the work: splicing is falsification *if* it changes representation, but intent is separated.  

  **Premise Quietly Overruled**: Your instinct treated case severity as inherent to acts (e.g., "splicing is serious"). The procedure decouples severity from classification, making "historical practice" a valid honest error defense.  

  ---  
  This procedure prioritizes decisiveness over precision, using analogy to cut through definitional debates. It works because it mirrors how humans categorize, but annual reviews (slippage ledger + contraction test) prevent conceptual inflation. If testing reveals bottlenecks, simplify frames or add exemplars.
