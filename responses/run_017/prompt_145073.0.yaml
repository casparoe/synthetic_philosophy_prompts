  Okay, let me start by unpacking the user's situation. They manage a scholarship fund with unique constraints: fixed annual payouts, anti-correlated top-up donations, and lumpy investment opportunities. The textbook Kelly criterion doesn't fit because of these mismatches. Their main goal is to allocate research time effectively over the next year to adjust their capital allocation rule, focusing on changes that will actually impact the fraction committed to each bet.

  First, I need to identify which of their concerns are most critical. The fixed payouts mean wealth isn't just compounding, which affects sustainability. The anti-correlated top-ups act like a hedge, potentially allowing more aggressive betting. The lumpy bets with minimum sizes and decaying edge complicate position sizing. They also mention model uncertainty and frame dependency, but those might be less urgent.

  The user emphasized that they care about actionable results—factors that would change their bet fraction. So, each research question should be evaluated by how much it moves the needle, tractability, and dependencies. They have two junior researchers and a year, so simulations and pencil-and-paper math are feasible, but complex proofs or data-heavy models aren't.

  Starting with the top priority: integrating payouts and donations. This directly affects the bankroll dynamics. Modeling payouts as a negative drift and donations as a covariance term could show a higher optimal leverage. Since this is foundational, other questions depend on it. I'd estimate a 15-25% adjustment here. Simulating with different donation correlations should be straightforward.

  Next, lumpy bets with decaying edge. The minimum cheque size means fractional Kelly isn't possible, requiring a binary decision. Threshold rules and opportunity cost from waiting need modeling. This could push them to take smaller edges if the alternative is missing out, possibly lowering the fraction by 10-20%. Simulations here are manageable, though game theory aspects might be tricky.

  Illiquid payouts are third. Locking capital reduces future flexibility, so haircuts based on duration are necessary. This might reduce allocation by 5-15% per bet. Simulating liquidity scenarios is tractable, but assessing the secondary market risk adds complexity.

  For overrated concerns, model uncertainty and frame dependency seem less impactful. Their adaptive donations and fixed payouts might smooth variance, making the time-average vs. expected utility debate less critical. Robust control methods might only tweak the fraction slightly. Similarly, uncertainty about edge is important but can be addressed later with sensitivity analysis.

  Recent research on path-dependent bankrolls or payoff illiquidity could shift priorities. If new papers on philanthropic hedging or liquidity premia come out, they might validate or adjust their approach, moving those questions up the list.

  I should also consider dependencies. Without addressing the payout and donation structure first, other models might be inaccurate. Then, lumpiness and liquidity can be tackled in parallel. The user's team should start with simulations on integrated bankroll dynamics while one researcher works on lumpy bet thresholds. Mid-year, incorporating liquidity factors would round out the model. Sensitivity analysis on edge uncertainty can be last, as it's more about fine-tuning.

  The user's deeper needs include ensuring the scholarship's longevity despite payouts, maximizing returns with donor support, and not missing opportunities due to rigid rules. They might also worry about justifying their allocation strategy to stakeholders, needing a robust yet flexible framework. Addressing the anti-correlated donations effectively turns a constraint into an advantage, which is key for their confidence in taking calculated risks.
answer: |-
  Here's a prioritized research agenda for your year, focusing on actionable insights that will materially change your capital allocation fraction ("f"), grounded in your unique constraints. The priorities balance impact on `f`, tractability, dependencies, and overrated concerns.

  ### Top 3 Research Questions (High Impact, High Tractability)
  1. **Integrated Payouts & Anti-Correlated Donations: Optimal "Effective Bankroll"**  
     * **Why it matters most:** Fixed payouts act as negative drift, while anti-correlated donations are effectively hedging. **This likely increases your optimal `f` vs. standard Kelly.**  
     * **Expected Δf:** **+15% to +25%** (e.g., moving from f=0.5% to 0.6-0.63% per bet).  
     * **Tractability:** High. Model payouts as a fixed annual withdrawal rate. Model donations as a function of prior year's return (e.g., donation_t = a - b * return_{t-1} + noise). Simulate wealth paths under different `f` using historical returns + synthetic donation rules. Use Merton's framework with income.  
     * **Upstream of:** All other questions (sets the baseline bankroll dynamics).  
     * **Worry Addressed:** Payouts + Donations (core mismatch).  

  2. **Lumpy Bets with Decaying Edge & Minimum Size: Threshold Rules & Opportunity Cost**  
     * **Why it matters:** Minimum cheque size forces binary "play/don't play" decisions when fractional Kelly is optimal. Decaying edge means waiting is costly. **This likely *reduces* your average `f` per opportunity vs. naive fractional Kelly.**  
     * **Expected Δf:** **-10% to -20% per bet** (but higher participation rate). Requires defining `f` as *% of bankroll per bet when played*.  
     * **Tractability:** Medium-High. Simulate a stream of opportunities arriving with random edge/size/decay. Test rules: "Bet if edge > X%", "Bet if Kelly fraction > Y% of min cheque", "Bet if opportunity cost of waiting > Z%".  
     * **Upstream of:** Illiquid payout haircuts (if you bet less often, liquidity matters less).  
     * **Worry Addressed:** Lumpy/decaying opportunities.  

  3. **Illiquid Payouts: Liquidity Haircuts & Horizon Mismatch**  
     * **Why it matters:** Locking capital reduces flexibility for future bets/payouts. **Requires reducing `f` on illiquid bets.**  
     * **Expected Δf:** **-5% to -15% per illiquid bet** (scaled by lockup duration/uncertainty).  
     * **Tractability:** Medium. Simulate liquidity shocks (e.g., unexpected payout hike). Apply haircuts based on: discount rate for lockup period, estimated secondary market discount, or VaR for liquidity shortfalls.  
     * **Depends on:** #1 (bankroll stability affects liquidity needs).  
     * **Worry Addressed:** Illiquid payouts.  

  ### Lower Priority (Impactful but Complex or Smaller Δf)
  4. **Uncertain Edge: Bayesian Shrinkage vs. Robust Optimization**  
     * **Why it matters:** Overbetting on overestimated edges is catastrophic. **Likely reduces `f` on high-uncertainty bets.**  
     * **Expected Δf:** **-5% to -10%** (for high uncertainty bets only).  
     * **Tractability:** Medium. Simulate edge uncertainty (e.g., true edge ~ Beta distribution around estimate). Compare: Bayesian Kelly (integrate over posterior), min-max regret, or simple haircuts.  
     * **Overrated?** Partially. Basic uncertainty adjustment (e.g., "use 50% of estimated edge") gets 80% of the benefit without complex math.  

  ### Overrated Concerns (Settling These Likely Won't Change `f` Much)
  * **Time-Average vs. Expected Utility Framing:** Your payout/donation structure creates a natural "soft floor" on wealth. Anti-correlated donations buffer drawdowns. **Result:** Both framings converge. Δf < 2%.  
  * **"True Model Not in Set" (Robustness):** Adaptive donations simplify this. Focus on *known* model uncertainties (edge, liquidity) rather than metaphysical robustness.  
  * **Precise Donation Modeling:** Knowing donations are anti-correlated is 90% of the value. Fancy correlation modeling won't change `f` much if donations are noisy.  

  ### Dependencies & Sequencing
  ```mermaid
  graph LR
      A[Payouts & Donations Model] --> B[Lumpy Bet Thresholds]
      A --> C[Liquidity Haircuts]
      B --> D[Edge Uncertainty]
      C --> D
  ```

  ### Critical Input: Your "Risk Capacity"
  * **Key Tractable Question:** *What's the maximum acceptable probability of missing a payout in the next 5-10 years?*  
  * **Why:** This anchors your simulations. If donors *absolutely* cover shortfalls, you can be more aggressive. If not, conservatism reigns.  
  * **Method:** Simulate payout coverage under different `f`/donation rules. Aim for <5% failure probability.  

  ### What Could Change the List?
  * **New Result in Next 6 Months:**  
    * **If:** Papers on "*Philanthropic Hedging*" (quantifying anti-correlated donations) emerge → **Boost #1 priority.**  
    * **If:** Breakthrough in "*Option-Embedded Kelly*" for decaying edges → **Boost #2 priority.**  
    * **If:** Empirical study on "*Illiquid Bet Payoffs*" in endowments → **Boost #3 priority.**  

  ### Execution Plan for 1 Year
  1. **Months 1-3:** Build base simulator with payouts + donations (Junior #1). Start lumpy bet simulations (Junior #2).  
  2. **Months 4-6:** Integrate liquidity constraints (Team). Calibrate donation rules with fund data.  
  3. **Months 7-9:** Test edge uncertainty methods. Run sensitivity analyses.  
  4. **Months 10-12:** Stress-test unified rule. Document thresholds/haircuts.  

  **Your edge is unique:** Anti-correlated donations are a superpower. **Lean into this.** A well-calibrated simulator will let you run 10,000 futures, revealing how much *more* risk you can take than textbook models suggest. Start simple, add complexity only where it moves `f`.
