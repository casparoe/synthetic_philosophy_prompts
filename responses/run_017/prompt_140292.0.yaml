  ### Memo  
  **To**: Fellowships Committee  
  **From**: [Your Name], PhD Candidate & Graduate Representative  
  **Date**: [Current Date]  
  **Re**: Resolution for Dissertation Fellowship Deadlock and Charter Amendment  

  #### I. The Core Problem  
  We face a trilemma:  
  1. **Imperceptible differences**: Adjacent files in our 17-application band (F-06 to F-51) differ by <0.2 points, and readers cannot distinguish them pairwise. Yet F-06 (published article, polished sample) and F-51 (no publications, thin chapter) are manifestly unequal.  
  2. **Intransitivity**: Head-to-head votes cycle among F-06, F-11, and F-17 (4–3 majorities in conflicting directions), violating transitivity ("if A>B and B>C, then A>C").  
  3. **Charter violation**: Our pairwise clause forbids ranking any applicant above one preferred head-to-head by a majority—making a complete, consistent ranking impossible.  

  Margin rules fail because they create "tied" chains where F-06 = F-07 = ... = F-51, yet F-06 ≠ F-51. Agenda-order sensitivity further proves procedural arbitrariness.  

  #### II. Philosophical Groundwork  
  I reject the premise that "better than" must be a transitive, two-place relation. Instead, I endorse the **respect-relative view**:  
  - **Merit is purpose-dependent**. "Better for fellowship X" depends on the award’s aims (here, "buying out a year of writing").  
  - **Imperceptible differences are irrelevant for judgment**. When differences fall below discernment thresholds (<0.2 points, per reader consensus), they cannot justify distinctions.  
  - **Transitivity fails under multi-dimensional criteria**. Our head-to-head cycling arose because members prioritized different *respects* (writing sample, teaching, promise vs. accomplishment, fit). No single scale exists.  

  Thus, we cannot force a strict ordering. Treating the band as "tied" isn’t a compromise—it’s epistemically honest.  

  #### III. Recommendation for This Cycle  
  **A. Decision Rule**:  
  - Declare all 17 files in the band **tied** for fellowship purposes. Differences are imperceptible and criteria conflict, precluding reliable ranking.  
  - Allocate awards via **random lottery** from these 17, using the dean’s option to split one fellowship.  

  **B. Awards**:  
  - Award **3 full fellowships** and **2 half-fellowships** (from splitting one full award).  
  - **Conduct a public lottery**: Draw 5 winners randomly from the 17. Assign 3 full awards via a second draw from the 5; the remaining 2 receive half-fellowships.  

  **Why this works**:  
  1. **Honors imperceptibility**: No arbitrary distinctions between adjacent files.  
  2. **Respects purpose**: All 17 cleared the merit threshold (top 17/58); the lottery allocates scarce resources fairly.  
  3. **Solves intransitivity**: Avoids head-to-head comparisons entirely.  
  4. **Uses split pragmatically**: Funds 5 applicants, reducing lottery impact.  

  **C. Written Justification for Split**:  
  > "The committee deemed 17 applicants indistinguishably meritorious for the fellowship’s purpose. Due to intransitive preferences across evaluation criteria, awards were allocated via lottery. Two half-fellowships reflect equitable distribution of limited resources."  

  #### IV. Charter Amendment  
  Replace the pairwise clause with:  
  > "Applicants shall be ranked by average first-round score. Files within 1.0 point shall be considered tied. Ties shall be broken by majority vote on the tied set. If no majority ranking emerges, awards shall be allocated by lottery, with optional fellowship splitting if approved by the dean."  

  **Why**:  
  - **Scores anchor objectivity** but accept margins of error (±1 point).  
  - **Lottery/splitting** are fallbacks for irreconcilable ties.  

  #### V. Strongest Objection and Response  
  **Objection**: "A lottery abandons meritocracy. F-06 ‘deserves’ to beat F-51, and random selection betrays our duty to judge each candidate individually."  
  **Response**: True meritocracy requires discernible differences. F-06 only "deserves" to beat F-51 if all intermediate steps are merit-relevant—but imperceptible gaps and intransitivity prove they are not. Forcing a ranking *imposes* arbitrariness; the lottery *acknowledges* it.  

  #### VI. Next Steps  
  We must act decisively to meet the 9-day deadline. I move to adopt this proposal.  

