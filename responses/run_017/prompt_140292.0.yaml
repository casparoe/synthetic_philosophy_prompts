  **To**: Fellowships Committee  
  **From**: [Your Name], Graduate Representative  
  **Date**: [Current Date]  
  **Re**: Recommendation for Dissertation Fellowship Awards and Charter Amendment  

  Dear Colleagues,  

  I write to propose a resolution to the impasse we face in awarding this year’s dissertation fellowships. After careful consideration of the philosophical and practical challenges posed by our dense band of 17 applications, I recommend a course of action that addresses the immediate deadline and suggests a charter amendment to prevent recurrence.  

  ### The Problem  
  Our first-round scoring placed 17 applications in a band with average scores ranging from F-06 (86.2) to F-51 (83.1), with adjacent gaps below 0.2 points. Readers confirmed that adjacent pairs are indistinguishable, yet the endpoints differ markedly: F-06 has a sole-authored article in a leading journal and a polished sample, while F-51 has no publications and a thin chapter. This creates a sorites-like paradox: if each imperceptible step is treated as non-meritorious, we cannot explain the clear difference between endpoints.  

  Compounding this, head-to-head votes on the top three files (F-06, F-11, F-17) revealed an intransitive cycle:  
  - 4–3 preferred F-06 to F-11  
  - 4–3 preferred F-11 to F-17  
  - 4–3 preferred F-17 to F-06  

  Our charter’s pairwise clause (Section 4.2) forbids ranking any applicant above one preferred by a majority head-to-head. This cycle makes a complete, charter-compliant ranking impossible.  

  Proposals to adopt a margin rule (e.g., treating files <1 point apart as tied) founder because:  
  1. Every adjacent pair in the band would be tied, but F-06 and F-51 are not equal.  
  2. Chains of ties allow arbitrary paths: comparing F-06 to F-17 directly might yield a different outcome than stepping through intermediates.  
  3. Last year’s agenda-order sensitivity shows procedural arbitrariness.  

  ### Philosophical Stance  
  I propose we adopt the view that "better than" is respect-relative: merit claims depend on the purpose of the fellowship. Our committee’s divergent head-to-head votes (some prioritizing writing samples, others teaching, promise, or fit) confirm that no single ordering captures all respects. The fellowship’s purpose—buying out a year of writing—requires us to prioritize writing quality and project viability, but our scoring system did not isolate these.  

  In this band, the imperceptible differences between adjacent files and the intransitive cycle suggest that, for our purpose, these applicants are *effectively tied*. We reject the notion that imperceptible differences are always merit-relevant: when differences are smaller than the committee’s discriminatory threshold, they cannot justify distinctions. Transitivity fails here because merit is multi-dimensional, and head-to-head votes fragment across criteria.  

  ### Recommendation for This Cycle  
  Given the tie and the pairwise clause, I recommend:  
  1. **Treat the 17 files in the band as tied for the purpose of awarding the fellowships**.  
  2. **Use a lottery to select awardees**, leveraging the dean’s option to split one fellowship. We will award:  
     - 3 full one-year fellowships  
     - 2 half-year fellowships (by splitting one full fellowship)  
     This funds 5 applicants, reducing the lottery’s impact.  
  3. **Conduct the lottery publicly** at Thursday’s meeting:  
     - Draw 5 winners randomly from the 17.  
     - Then draw 3 of these 5 to receive full fellowships; the remaining 2 receive half-fellowships.  

  This approach:  
  - Honors the pairwise clause by avoiding any charter-violating ranking.  
  - Respects the indistinguishability of adjacent files.  
  - Acknowledges the fellowship’s purpose by limiting awards to the top band (which scored above 83/100).  
  - Maximizes equity: all band members have equal claim given our inability to discern merit differences.  

  ### Charter Amendment  
  To prevent future deadlocks, I propose replacing the pairwise clause (Section 4.2) with:  
  > "Applicants shall be ranked by average first-round score. Files within 1.0 point shall be considered tied. Ties shall be broken by committee majority vote on the tied set. If no majority ranking is possible, awards shall be allocated by lottery from the tied set, with the option to split fellowships if approved by the dean."  

  This retains scoring as the primary tool but accepts that ties and non-transitivity may require probabilistic or split awards.  

  ### Strongest Objection  
  The primary objection will be that a lottery abandons individual merit judgments, particularly for files like F-06 (clearly stronger than F-51) and F-51 (clearly weaker). Why should F-06 not be guaranteed an award? The answer lies in the band’s density: F-06 is indistinguishable from F-07, who is indistinguishable from F-08, and so on to F-51. If we reject imperceptible differences as merit-relevant, we cannot elevate F-06 above its immediate neighbors—and by extension, above the band. The lottery treats all band members equally where our discernment fails.  

  ### Next Steps  
  I move that we:  
  1. **Vote on this proposal** at Thursday’s meeting.  
  2. **If approved**, conduct the lottery during the meeting.  
  3. **Draft notifications** for winners and the graduate school by [Date +3 days].  
  4. **Submit charter amendments** for faculty review by [Date +7 days].  

  This balances fairness with urgency. I welcome your critiques.  

  Sincerely,  
  [Your Name]  

