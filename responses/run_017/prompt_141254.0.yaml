  Now, let's list the non-negotiable requirements (N) and preferences (P):

  Non-negotiable (N):
  1. **N1 (Asymmetric Loss)**: Conservative against false recurrences (prefer novelty when in doubt).
  2. **N2 (Evidence at Triage)**: Use only triage-time evidence.
  3. **N3 (Cross-Instance)**: Work for distinct devices.
  4. **N4 (Mechanism over Symptom)**: Distinguish same symptom, different mechanism.
  5. **N5 (Logical Structure)**: Handle conjunctive, disjunctive, redundant mechanisms; specify output type.
  6. **N6 (Drift and Substitution)**: Account for parameter drift and component substitution.
  7. **N7 (Targeted by Runbook)**: Be sensitive to what the runbook fix targets (the specific component or parameter).
  8. **N9 (Fix Effectiveness)**: The criterion must support the prediction that if same mechanism, then runbook fix works.
  9. **N13 (Prevention of Recurrence)**: Same mechanism implies runbook fix prevents recurrence under same conditions.
  10. **N14 (Overdetermination Handling)**: In overdetermined cases, only match if the runbook fix would have prevented the event (or will prevent recurrence) and there is no doubt.
  11. **N16 (Per Runbook Mechanism)**: Match against the mechanism specified in the runbook, not the symptom class.
  12. **N19 (Clear Runbook Mechanism)**: Require that the runbook specifies a clear mechanism; else, do not match.

