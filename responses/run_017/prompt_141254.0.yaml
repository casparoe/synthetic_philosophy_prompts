  1. **P1 (Mechanism/Environment Boundary)**: Help clarify the boundary, but not required to be sharp.
  2. **P2 (Overdetermination)**: Ideally, handle overdetermination without requiring single root cause, but N14 already covers the essential.
  3. **P3 (Mechanism Scope)**: Allow for parameters being part of the mechanism.

