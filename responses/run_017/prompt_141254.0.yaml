  ### Desiderata for Mechanism-Identity Criterion in Anomaly Triage

  The criterion must decide if a new anomaly shares the *same mechanism* as a known fault (runbook-applicable) or is novel (escalate). Non-negotiable requirements (**N**) stem from the asymmetric loss (false recurrence worse than false novelty), cross-instance context, and evidence constraints. Preferences (**P**) reflect design choices but are not absolute. Each requirement is traced to the docket cases or constructed considerations.

  #### Non-Negotiable Requirements (N)
  1. **Conservative Edge-Case Handling (N1)**  
     - *Requirement*: In ambiguous cases (e.g., mechanism boundary, drift, or overdetermination), default to novelty.  
     - *Case*: Docket case 5 (mixed-aetiology runbook) and constructed drift scenarios. False recurrence ships a broken fix, which is catastrophic; false novelty only wastes engineering hours.  
     - *Rationale*: Asymmetric loss forces conservatism. If evidence doesn't decisively match the runbook's mechanism, escalate.

  2. **Runbook-Fix Effectiveness Prediction (N2)**  
     - *Requirement*: Same-mechanism verdict must imply the runbook fix resolves the anomaly *under identical triggering conditions*.  
     - *Case*: Docket case 1 (unit 1: calibration drift fix works; unit 2: same fix fails due to tubing). Also case 2 (threshold change)—if the runbook fix adjusts the threshold, same mechanism; if it patches sensor code, different.  
     - *Rationale*: Routing depends on fix efficacy, not mechanism similarity. The criterion must ensure the fix corrects the *specific pathway* disrupted in the new case.

  3. **Mechanism-Not-Symptom Sensitivity (N3)**  
     - *Requirement*: Do not collapse cases with identical symptoms but divergent causal pathways.  
     - *Case*: Docket case 1 (calibration drift vs. tubing-induced pressure change) and case 5 (runbook built on symptom similarity, not mechanism).  
     - *Rationale*: Symptoms (e.g., late alarm) are unreliable; mechanisms determine fix applicability.

  4. **Logical Structure Accommodation (N4)**  
     - *Requirement*: Support conjunctive (AND), disjunctive (OR), and redundant mechanisms. Output must be a single verdict (recurrence/novelty) or abstention—no graded/set outputs.  
     - *Case*: Docket case 3 (conjunction: altitude + occlusion + pump rate) and case 4 (redundant checks). Abstention invokes N1 (default novelty).  
     - *Rationale*: Routing needs a binary decision. Graded outputs delay triage; sets create ambiguity under asymmetric loss.

  5. **Evidence-Constrained Feasibility (N5)**  
     - *Requirement*: Use only triage-time evidence: telemetry, logs, provenance, and ≤3 cheap diagnostics (e.g., sensor readout, tubing swap). No disassembly, lab tests, or fix simulation.  
     - *Case*: All docket cases. E.g., case 3 (conjunction) cannot require reproducing high altitude; case 4 (overdetermined) cannot demand isolating each degraded check.  
     - *Rationale*: Triage is time/resource-constrained; interventions must be field-deployable.

  6. **Cross-Instance Applicability (N6)**  
     - *Requirement*: Judge mechanism identity without diachronic/spatiotemporal continuity (e.g., "same device over time" irrelevant).  
     - *Case*: Constructed case: Unit A (site X) and Unit B (site Y) fail identically but lack shared history.  
     - *Rationale*: Devices are independent; mechanism identity is relational (e.g., "same as runbook's root cause").

  7. **Runbook Mechanism Specificity (N7)**  
     - *Requirement*: Match to the *runbook-specified mechanism* (e.g., "sensor drift"), not the symptom class (e.g., "late alarms"). If the runbook mechanism is ambiguous (e.g., case 5), verdict is novelty.  
     - *Case*: Docket case 5 (mixed-aetiology runbook)—fails specificity, so new cases escalate.  
     - *Rationale*: Ambiguous runbooks cannot reliably support fixes; asymmetric loss forbids guessing.

  #### Preferences (P)  
  *Preferences reflect practical ideals but can be traded off under N1–N7. They are not binding if they conflict with non-negotiables.*

  1. **Parameter-Mechanism Distinction (P1)**  
     - *Requirement*: Treat tunable parameters (e.g., thresholds) as distinct from core mechanisms.  
     - *Case*: Docket case 2 (firmware update changed threshold). Threshold is a "setting" if adjustable via field fix (same mechanism); a "mechanism" if hardcoded (novel).  
     - *Preference*: Clarifies boundary but defers to N2 (fix efficacy). Not strict—e.g., if threshold change requires firmware rework, it may be novel.

  2. **Environment-Mechanism Boundary Clarity (P2)**  
     - *Requirement*: Favor mechanisms that include environmental dependencies (e.g., altitude) when critical to fault closure.  
     - *Case*: Docket case 3 (altitude-dependent occlusion). If the runbook includes altitude, same mechanism; if not, novelty.  
     - *Preference*: Ideal for case 3 but secondary to N4 (conjunctions handled via abstention if unclear).

  3. **Overdetermination Tolerance (P3)**  
     - *Requirement*: Do not require a single root cause in overdetermined cases.  
     - *Case*: Docket case 4 (two degraded checks). If the runbook fix corrects one check and prevents recurrence, same mechanism.  
     - *Preference*: Aims for efficiency but superseded by N2 (fix must resolve the anomaly) and N1 (if uncertainty, escalate).

  4. **Drift/Substitution Continuity (P4)**  
     - *Requirement*: Allow small parameter drifts or component substitutions without breaking identity.  
     - *Case*: Constructed case: Sensor drift within 5% is same mechanism; beyond 10% is novel.  
     - *Preference*: Pragmatic but undefined in docket; defer to N2 (does fix correct it?) and N1 (if drift magnitude unknown, escalate).

  #### Conflicts Between Requirements
  - **N2 (Fix-Effectiveness Prediction) vs. N5 (Evidence Constraints)**  
    N2 demands predicting fix efficacy without applying it, but N5 limits evidence to cheap diagnostics. This is the core tension: Fix efficacy is counterfactual ("if we applied the fix, would it work?"), but triage cannot test fixes. *Resolution*: N2 dominates—criterion must infer efficacy from mechanism identity (e.g., via causal signatures). If evidence is insufficient (e.g., case 3’s conjunction unreproducible), N1 forces novelty.

  - **N4 (Logical Structure) vs. P3 (Overdetermination Tolerance)**  
    N4 requires a binary verdict/abstention, but P3 wants to accept multi-cause mechanisms. In case 4, if the runbook fix only addresses one degraded check, N2 may fail (fix might not resolve future faults), forcing abstention/novelty per N1. P3 cannot override this.

  - **Most Exclusionary Requirement**: **N2 (Fix-Effectiveness Prediction)**  
    This excludes criteria that cannot bridge mechanism identity to fix outcomes. E.g., signature-based or parts-based criteria often fail here (see scoring below). It is the keystone: If the criterion cannot support N2, routing decisions risk false recurrences.

  ---

  ### Candidate Family Scoring
  Scored against non-negotiables (N1–N7). ✓ = Fully satisfies, △ = Partially/contextually, ✗ = Fails.  
  *Output constraint*: Must return recurrence/novelty/abstain (no sets/graded).

  | Candidate Family              | N1 | N2 | N3 | N4 | N5 | N6 | N7 | Verdict |
  |-------------------------------|----|----|----|----|----|----|----|---------|
  | **Observable Signature**      | ✗  | ✗  | ✗  | △  | ✓  | ✓  | ✗  | Poor. Fails N2/N3 (case 1: same signature, different mechanisms; no fix-efficacy link). Outputs symptom matches, not mechanism. |
  | **Causal/Spatiotemporal Continuity** | △  | ✗  | △  | ✓  | ✗  | ✗  | ✗  | Inapplicable. Fails N6 (cross-instance) and N5 (requires historical/continuity evidence). |
  | **Parts + Organization**      | △  | △  | △  | ✓  | ✓  | ✓  | △  | Moderate. Fails N2 (case 2: same parts, but threshold change may alter efficacy). Struggles with N3 (case 1: same parts, different root causes) and environment (case 3). |
  | **Counterfactual Profile**    | ✓  | ✓  | ✓  | △  | △  | ✓  | ✓  | Best. N2/N3 satisfied (fix efficacy inferred from responses to interventions). Fails N5 if interventions are costly (case 3), but cheap diagnostics (e.g., tubing swap in case 1) suffice for some cases. Output may abstain under ambiguity (✓N4). |

  **Summary**:  
  - **Counterfactual profile** wins but requires careful intervention design (per N5).  
  - **Parts + organization** is fallback if counterfactuals are infeasible but risks false recurrences (N2).  
  - **Signature** and **continuity** are inadequate for core requirements.
