     - In case 4, the parts (the safety checks) are the same, but both are degraded. The criterion might say the mechanism is the same (if one safety check is degraded) but then it would match a runbook for that check. But N14 requires that we are sure the fix would work, and if both are degraded, fixing one might not be enough? But as discussed, fixing one might prevent the event for future faults. However, the criterion doesn't capture the overdetermination. 
     - Overall: mixed, but fails in key cases (like case 1) and doesn't handle environment well.

  4. **Sameness of counterfactual profile under interventions**:
     - This means: if we perform the same interventions, do we get the same responses? 
     - This is close to N9: if the counterfactual "applying the runbook fix" leads to the anomaly being resolved, then it is the same mechanism. But we cannot do that intervention at triage. So we must infer from other interventions. 
     - With the available evidence (a few cheap diagnostics), we might run some tests. 
     - In case 1: for unit 1, if we test by applying pressure, we might see the sensor reading is off. For unit 2, the sensor reading might be in spec, but with stiffer tubing, the pressure profile is different. If we change the tubing back, the problem goes away. But if we don't have that tubing available, we might not be able to test. 
     - In case 2: if we change the threshold back, the problem goes away. But we might not be allowed to change firmware at triage. 
     - In case 3: we might not be able to reproduce the conjunction (high altitude, etc.) at triage. 
     - So it might work if the cheap diagnostics can mimic the necessary interventions. But often they cannot. So it may fail N2 (if the necessary interventions are not cheap or available). 
     - However, if we can do some tests, then it directly addresses fix effectiveness (N9). 
     - This criterion might handle drift: if the counterfactual response is the same, then even if parts are different, the mechanism is the same. 
     - It also handles the environment: if an environmental factor is part of the mechanism, then changing it changes the counterfactual profile. 
     - But it requires the ability to test, which is limited. 
     - Overall: the most promising, but may be constrained by N2.

  Summary of requirements (non-negotiable):

  1. **Conservative against false recurrences**: Prefer novelty when uncertain.
  2. **Triage-time evidence only**: Cannot require extensive testing.
  3. **Cross-instance operation**: No reliance on diachronic continuity.
  4. **Mechanism, not symptom**: Must distinguish same symptom from same mechanism.
  5. **Accommodate logical structure**: Handle AND/OR, specify output type (e.g., abstain in doubt).
  6. **Account for drift/substitution**: Define how much change is allowed before identity breaks.
  7. **Sensitivity to runbook target**: The match must be to the specific mechanism the runbook fixes.
  8. **Predict fix effectiveness**: Same mechanism must imply the runbook fix works.
  9. **Prevent recurrence**: Same mechanism implies the fix prevents recurrence under same conditions.
  10. **Overdetermination caution**: In overdetermined cases, only match if confident the fix would have prevented the event (else escalate).
  11. **Per runbook mechanism**: Match against the mechanism described in the runbook.
  12. **Require clear runbook mechanism**: If the runbook mechanism is ambiguous, do not match.

  Conflict: The strongest requirement is **Predict fix effectiveness (N9)** because it is the core of the routing decision. It also forces the other requirements (like mechanism not symptom, and sensitivity to runbook target). It is also the one that is hardest to satisfy without testing, which conflicts with **Triage-time evidence only (N2)**. But we can design the criterion to use the available evidence to infer the counterfactual.

  The candidate family that best meets the requirements is **sameness of counterfactual profile under interventions**, but it must be feasible with triage-time evidence and cheap diagnostics. If not, then we must find a proxy.

  Given the asymmetric loss, the criterion might be implemented as:

  - If the evidence (including diagnostics) shows that the runbook fix would work (e.g., by simulating the fix or by showing that the mechanism is the same as the one the fix targets), then recurrence.
  - Else, novelty.

  But the challenge is to show that without applying the fix.

  We might use a causal model to predict the effect of the fix. But building causal models for each fault is expensive.

  Alternatively, the counterfactual profile can be approximated by signatures under interventions that are proxies for the fix. But this is not perfect.

  Given the constraints, we might have to live with some false positives (novelty) but that is acceptable due to the asymmetric loss.

  The requirements are demanding, but necessary for the purpose.
