     - Overall: poor.

  2. **Causal or spatiotemporal continuity**: 
     - Fails N3: we are cross-instance, no continuity. 
     - Also, continuity doesn't help in comparing two separate devices. 
     - Overall: not applicable.

  3. **Sameness of parts plus organization**:
     - This is a structural criterion. 
     - Might handle drift (N6) by allowing small changes in parts? But how much? 
     - In case 1, unit 1 and unit 2 have the same parts (the sensor and the alarm logic) but unit 2 has different tubing (a consumable). Is the tubing part of the mechanism? The runbook might target the sensor, which is the same part. But the cause is the tubing. So if the runbook fix is to recalibrate the sensor, it won't work for unit 2. So it fails N7 and N9. 
