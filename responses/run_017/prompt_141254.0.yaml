  We are building a criterion for mechanism identity to route anomaly cases in a fleet of infusion pumps. The purpose is to decide whether a new anomaly is a recurrence of a known fault (use existing runbook) or novel (escalate to engineering). The loss is asymmetric: falsely labeling a novel case as a recurrence (so the fix doesn't work) is worse than the reverse (which costs extra engineering hours).

  The criterion must be based on evidence available at triage time: telemetry, event logs, firmware/consumable provenance, and a few cheap diagnostics.

  We have a docket of cases to handle:

  1. Two units have late occlusion alarms. 
     a. Unit 1: due to pressure-sensor calibration drift.
     b. Unit 2: due to a stiffer tubing lot changing the pressure profile (so same downstream pathway triggered by a different upstream condition).
  2. Unit 3: late alarms because a firmware update changed the alarm-threshold constant (sensor physics untouched).
  3. Unit 4: late alarms only under a conjunction of high altitude, partially occluded line, and a specific pump rate. No single known mechanism covers it, and no factor alone causes it.
  4. Unit 5: two independent safety checks were degraded, either would have caught the fault alone. Overdetermined?
  5. The known fault runbook was written from 40 prior cases that shared a signature but later split into two distinct aetiologies. The reference class is not a mechanism type.

  Wrinkles:
  - Sameness is relational and cross-instance (no diachronic persistence).
  - Mechanisms have logical structure (conjunctive, disjunctive, redundant) so we must specify the output (single verdict, set, graded, abstention?).
  - The mechanism/environment boundary is fuzzy (some mechanisms require environmental conditions to close the loop).
  - Drift and part-substitution are continuous: how much change is allowed?

  We must write desiderata (requirements) for the criterion, traceable to the cases or constructed ones, and mark non-negotiable vs. preferences. Then identify conflicts and which requirement excludes most candidates.

  Finally, briefly score four candidate families:
  1. Identity of observable signature (e.g., same pattern in telemetry)
  2. Causal or spatiotemporal continuity (but note: cross-instance, so continuity might not apply)
  3. Sameness of parts plus organization (physical components and their arrangement)
  4. Sameness of counterfactual profile under interventions (how the system responds to changes)

  Let's build the desiderata:

  Non-negotiable requirements (N):
  1. **Asymmetric Loss Handling (N1)**: The criterion must be conservative against false recurrences. That is, when in doubt, it should prefer novelty. This is because a false recurrence leads to applying a fix that doesn't work, which is worse than engineering hours. [Derived from the asymmetric loss]

  2. **Evidence-Based at Triage (N2)**: The criterion must use only evidence available at triage time (telemetry, logs, provenance, a few cheap diagnostics). It cannot require extensive testing or disassembly. [Given the context]

  3. **Cross-Instance (N3)**: The criterion must work for two different devices (spatially and temporally separate). It cannot rely on tracing a continuous world-line. [From the first wrinkle: relational and cross-instance]

  4. **Mechanism Identity, Not Symptom Identity (N4)**: The criterion must distinguish between cases that have the same symptoms but different underlying mechanisms. [From case 1: same symptom (late alarm) but two different mechanisms (calibration drift vs. tubing change). Also from case 5: the reference class was based on signature but split into two mechanisms.]

  5. **Accommodate Logical Structure (N5)**: The criterion must handle mechanisms with conjunctive, disjunctive, or redundant structures. It must specify the output (e.g., single verdict, set, graded, abstention) in a way that works with the asymmetric loss. [From the second wrinkle and cases 3 and 4: case 3 is conjunctive, case 4 is overdetermined (redundant).]

