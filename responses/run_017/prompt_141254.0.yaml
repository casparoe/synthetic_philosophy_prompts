  - **N6 (Drift) vs. N9 (Fix Effectiveness)**: How much drift is allowed? The criterion must allow enough drift so that the runbook fix still works. But if the drift is too much, the fix might not work. So the criterion must be tied to the fix: if the runbook fix corrects the drift (e.g., recalibration), then it is the same mechanism. But if the drift is beyond what the fix can handle (e.g., a hardware failure that recalibration won't fix), then it is different.

  The hardest requirement is **N9 (Fix Effectiveness)**: because it requires that the criterion is predictive of the fix working, without applying the fix. This is the core and it must be built into the definition of mechanism identity. It also forces the runbook to be clear about the mechanism and the fix.

  Which requirement excludes the most candidates? **N9 (Fix Effectiveness)**. Because many candidate criteria (like signature similarity) might not guarantee that the fix works. For example, same signature (N4 already says that's not enough) might have different mechanisms and the fix might not work.

  Now, briefly score the four candidate families:

  1. **Identity of observable signature**: 
     - Fails N4 and N9: same signature does not imply same mechanism (case 1 and 5) and does not guarantee fix effectiveness. Also, in case 3, the signature might be different because of the conjunction? So not even same signature. 
