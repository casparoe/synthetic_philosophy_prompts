prompt: |-
  I am a professor of philosophy, and I sit on our university's Committee on Enhancement and Academic Practice. Our remit is deliberately narrow: we decide only which interventions the university health service will provide or prescribe at university cost, never what students may obtain privately. In four years we have ruled as follows: we approved stimulant medication for a student with a diagnosed attention disorder, and approved extra examination time for a student with the same diagnosis who declines medication; we declined the same stimulant for an undiagnosed student preparing for finals, noting explicitly that our ruling was about provision, not permission; we approved an antidepressant for a student with a diagnosed depressive episode and declined the same drug for a student with subclinical low mood who wanted more drive; we declined a cochlear implant for a congenitally deaf student who is a fluent signer and does not consider herself disabled, funding interpreters and real-time captioning instead, while approving an implant for a student who lost his hearing at nineteen and does not sign; we approved, narrowly and on grounds of risk to patients, a wakefulness agent for a healthy senior medical resident on night rotations with no sleep disorder; and we approved without discussion reading glasses for age-related presbyopia in faculty and elective laser correction for mild myopia in a student who manages perfectly well with glasses.

  Next week's request is this. A healthy thirty-four-year-old doctoral student with no diagnosis asks us to provide, at university cost, a newly licensed sleep-compression agent — it does not improve cognition; it simply delivers a full night's restorative sleep in five hours rather than eight, with no measurable health cost on the evidence before us. She is the sole carer of a four-year-old and wants the three recovered hours for her dissertation. She has declined a reduced teaching load, which would take her past her funding deadline, and says the childcare subsidy available to her would not help, since the bottleneck is hours after her daughter is asleep rather than money.

  I want three things from you. First, the rule, or short list of rules, that best describes our record, together with at least one substantially different rule that fits it equally well: I suspect a diagnosis-based reading, a welfarist reading, and a "change the environment before the person" reading all survive the precedents, and I want to know exactly where they diverge. Second, your recommendation for the new case on grounds of consistency with what we have already done, with the closest analog identified and an explicit statement of the principle we would be adopting under each ruling — including whether the therapy/enhancement distinction is doing any real work in our decisions, or whether we have in fact been tracking something else, such as welfare, positional advantage, risk to third parties, or the availability of an environmental fix. Third, the further case you would place in front of us to tell the surviving rules apart. Argue from our record rather than from the literature: I do not want a survey of the enhancement debate, citations, or reading suggestions, since nothing we decide can rest on them.
reasoning: |-
  Hmm, the user is a philosophy professor on a university committee that decides which health interventions to fund. They've provided a detailed history of past decisions and now have a new case about a sleep-compression drug. They want me to: identify the rules that fit their precedents, recommend how to handle the new case consistently, and propose a future case to distinguish between competing rules.

  I need to analyze their precedents carefully. Looking at the stimulant cases - they approved it for diagnosed ADHD but declined for undiagnosed use during finals. The antidepressant followed the same pattern: approved for diagnosed depression, declined for subclinical low mood. The cochlear implant cases are interesting - they funded it for someone who lost hearing but not for a congenitally deaf person who didn't consider themselves disabled, instead providing interpreters. The wakefulness agent for the medical resident was approved due to patient risk, not for enhancement. Reading glasses and laser correction seem straightforward medical needs.

  Several principles emerge here. There's clearly a diagnosis requirement in many cases - they only fund when there's a recognized medical condition. But the environmental accommodation cases (extra exam time, interpreters) show they prefer modifying the environment before altering the person. The wakefulness agent was approved for third-party risk, not individual benefit. And the laser correction case is interesting as it was approved despite being "elective" - suggesting appearance matters less than actual function.

  For the sleep-compression case, the student has no diagnosis, wants it purely for time management, and has declined environmental options. If we apply the diagnosis rule strictly, we'd decline. The welfare argument might support approval since it clearly helps her, but their precedent with the undiagnosed stimulant seeker suggests welfare alone isn't sufficient. The environmental principle suggests declining since she refused teaching load reduction. The third-party risk argument doesn't apply here.

  The therapy/enhancement distinction seems less important than whether there's pathology to correct. Their approvals focus on restoring function to typical levels (like antidepressants for depression) rather than boosting beyond normal (like stimulants for exam prep). The laser eye surgery is borderline but was framed as managing a condition rather than enhancement.

  I'd recommend declining the sleep-compression request to be consistent with their undiagnosed stimulant and antidepressant denials. The closest analog is the student wanting stimulants for finals prep - both seek cognitive advantage through pharmacology without pathology. 

  To distinguish between the competing rules, I'd propose a case about mild myopia correction versus night-vision enhancement. If they'd fund the former but not the latter, it confirms they're tracking pathology rather than enhancement per se. If they fund both, welfare becomes primary; if neither, diagnosis remains key.
answer: |-
  Based strictly on your committee's record, here is the analysis you requested:

  ### 1. Rules Fitting the Precedents
  **Primary Rule (Diagnosis + Functional Restoration):**  
  *"Provide interventions only to treat diagnosed medical conditions that impair baseline function, restore typical function, and lack a feasible environmental alternative. Prioritize environmental accommodations over biomedical interventions when possible."*  
  - **Fits:** Stimulants (diagnosed ADHD → functional impairment), antidepressants (diagnosed depression → impairment), cochlear implant (acquired hearing loss → impairment), wakefulness agent (undiagnosed but third-party risk), glasses/laser (age-related/myopia → functional impairment).  
  - **Environmental Priority:** Extra time > meds for ADHD; interpreters > implant for congenital deafness.  
  - **Exclusions:** Undiagnosed stimulant (no condition), subclinical antidepressant (no diagnosis), congenital deafness (no functional impairment per patient).  

  **Alternative Rule (Welfarist + Third-Party Risk):**  
  *"Provide interventions when net welfare gain is significant, unavoidable by reasonable alternatives, and either (a) mitigates immediate third-party harm or (b) corrects a biologically-based functional deficit relative to species-typical norms."*  
  - **Fits:** Wakefulness agent (third-party risk), all approved treatments (correct deficits: attention, mood, vision, hearing).  
  - **Exclusions:** Undiagnosed stimulant/subclinical mood (welfare gain avoidable via study habits/lifestyle), congenital deafness (no deficit claimed; welfare addressed via interpreters).  
  - **Divergence:** This rule *could* approve the sleep-compression case (significant welfare gain) if no alternatives exist, whereas the Diagnosis Rule would not.  

  **Where Rules Diverge:**  
  - **Congenital Deafness:** Diagnosis Rule declines (no pathology/impairment). Welfarist Rule declines (welfare met via interpreters; no deficit).  
  - **Laser Myopia:** Diagnosis Rule approves (corrects deficit). Welfarist Rule approves (corrects deficit).  
  - **Sleep-Compression:** Diagnosis Rule *declines* (no diagnosis). Welfarist Rule *may approve* (if welfare gain is irreplaceable).  

  **Therapy/Enhancement Distinction:**  
  It appears **irrelevant** in your decisions. What matters is:  
  - Presence of a **diagnosed pathology** (ADHD, depression, presbyopia).  
  - **Functional restoration** (correcting deficits to typical function, not boosting beyond it).  
  - **Alternatives** (environmental fixes preferred).  
  - **Third-party risk** (wakefulness agent approved despite no diagnosis).  

  Enhancements (undiagnosed stimulant, subclinical antidepressant) are declined, but so are therapies lacking diagnosis (undiagnosed ADHD) or functional impairment (congenital deafness). Laser correction is therapy (correcting myopia), not enhancement.  

  ---

  ### 2. Recommendation for the Sleep-Compression Case  
  **Decision: Decline**  
  **Closest Analog:** *Undiagnosed student seeking stimulants for finals.*  
  - **Consistency:** Both involve healthy individuals requesting cognitive-time efficiency agents without a diagnosis.  
  - **Principle Under Diagnosis Rule:** "No provision without a diagnosed medical condition impairing function." Sleep compression does not treat a pathology; it enhances time efficiency beyond typical limits.  
  - **Principle Under Welfarist Rule:** "Welfare gains alone are insufficient if reasonable alternatives exist." She declined teaching reduction (environmental fix) due to funding deadlines—a *financial* constraint, not an irreplaceable time constraint. The committee has not prioritized personal convenience (e.g., subclinical antidepressant for "drive").  

  **Bottleneck Analysis:** The "hours after her daughter sleeps" bottleneck is a life-circumstance (single parenting + academia), not a biomedical deficit. Your precedents treat social/financial constraints as environmental, not medical (e.g., childcare subsidy offered, interpreters funded).  

  ---

  ### 3. Test Case to Distinguish Surviving Rules  
  **Case:** *A 50-year-old professor with age-related cognitive decline (diagnosed mild cognitive impairment) requests a cognition-enhancing drug proven safe but not restorative—it boosts working memory 20% above age-typical levels.*  

  - **Diagnosis Rule:** Decline. Though diagnosed, the drug *enhances* beyond typical function for her age rather than restoring it. Fits: laser correction restores typical vision; stimulants restore focus to neurotypical baseline.  
  - **Welfarist Rule:** Approve. Significant welfare gain (career preservation), biologically-based deficit (age-related), no feasible alternative (teaching reductions may harm tenure).  
  - **Environmental Priority Test:** If committee funds this but not sleep-compression, Diagnosis Rule is primary. If both declined, Diagnosis Rule is stricter. If both approved, Welfarist Rule dominates.  

  **Why this works:**  
  - Directly tests whether "restoring typical function" (Diagnosis) vs. "addressing biologically-based deficits with net welfare gain" (Welfarist) drives decisions.  
  - Isolates enhancement in a diagnosed population, unlike previous cases.  

  **Key Insight from Precedents:** Your committee uses **pathology** as a gatekeeper, **functional restoration** as the goal, and **environmental fixes** as first resort. The sleep-compression request fails all three.
