  ### Scenario: Software Subscription Trial  
  Alice is offered a one-month free trial for productivity software. If she starts the trial and doesn’t cancel within the month, she’ll be charged $100 at month’s end for Year 1 and $100 a year later for Year 2. Canceling after the trial incurs a $50 fee. Alice is present-biased (β=0.5, δ=1). At the start, she believes she’ll use the software heavily for both years, valuing it at $120/year. She forms the optimal plan: start the trial and continue, valuing it at 30. The resolute Alice executes this plan. By month’s end, she realizes she’ll only use it moderately, valuing it at $80/year. She continues as planned. Experienced utility: trial month (+10), Year 1 ($80−$100=−20), Year 2 ($80−$100=−20). Discounted to present: −10. A sophisticated Alice, foreseeing she’ll value it at $80/year, skips the trial. At month’s end, she signs up for a pay-as-you-go plan at $80/year—exactly matching her valuation—yielding 0. Resolute Alice ends up worse off.  

  ### (a) Sequence of Choices  
  - **Time 0 (Start)**:  
    - Options: Start trial (A) or Do nothing (B).  
    - Resolute: A (plan: start and continue).  
    - Sophisticated: B.  
  - **Time 1 (Month’s end)**:  
    - *If started trial*: Cancel (A1, pay $50) or Continue (A2, pay $100 now + $100 next year).  
    - *If did nothing*: Sign pay-as-you-go (B1, $80/year) or Do nothing (B2).  
    - Resolute: A2 (executes plan).  
    - Sophisticated: B1.  

  ### (b) Reasoning and Payoffs  
  - **Resolute Alice**:  
    - *Time 0*: Values plan (A then A2): Trial (+10) + βδ(120−100) + βδ²(120−100) = 10 + 0.5×20 + 0.5×20 = 30.  
    - *Time 1*: Executes A2. Experienced outcome: Time 0: +10, Time 1: 80−100 = −20, Time 2: 80−100 = −20.  
    - Discounted to Time 0: 10 + 0.5×(−20) + 0.5×(−20) = −10.  
  - **Sophisticated Alice**:  
    - *Time 0*: Predicts if she starts trial, she’ll choose A2 at Time 1 (since −30 > −50; see below). Outcome of A: 10 (trial) + 0.5×(−20) + 0.5×(−20) = −10. Outcome of B: At Time 1, B1 yields 0 (pay $80, value $80). Chooses B.  
    - *Time 1*: Chooses B1. Outcome: Time 1: 0.  
    - Final: 0.  
  - **Comparison**: Resolute gets −10, Sophisticated gets 0. Worse for resolute by *initial* preferences (initial self valued −10 < 0) and *final* preferences (net cash: −30 < 0).  

  ### (c) Structural Feature  
  **Misprediction of future preferences** (not menu growth or legibility). Resolute Alice commits based on overoptimistic beliefs about future usage. Sophisticated Alice avoids by foreseeing the drop in valuation. The counterparty (software company) exploits common misprediction but doesn’t target commitment specifically.  

  ### (d) Ablation Test  
  Remove misprediction: Assume Alice knows at Time 0 she’ll value software at $80/year.  
  - Resolute at Time 0: Values plan (A then A2): 10 + 0.5×(80−100) + 0.5×(80−100) = 10 − 10 − 10 = −10. Chooses B instead (0).  
  - Sophisticated: Chooses B (0).  
  - **Result**: Both get 0. Gap collapses; resolute wins by avoiding the plan.  

  ### (e) Honest Defence  
  A resolute-choice advocate might argue: "A good plan includes a reconsideration clause—e.g., ‘start trial, but cancel if valuation drops.’" This dissolves the case *only if* the agent can cancel without cost. But here, cancellation costs $50. Even with the clause, Alice would:  
  - Start trial (Time 0),  
  - Cancel at Time 1 (pay $50),  
  - Then sign pay-as-you-go (net −50 at Time 1).  
  Discounted to Time 0: 10 (trial) + 0.5×(−50) = −15—still worse than sophisticated’s 0. The vulnerability is the *initial commitment to start*, not the lack of an exit policy. The reply relocates but doesn’t solve the problem; it highlights that some commitments are inescapably costly.  

  ### Conclusion for Money-Pump Arguments  
  This case shows money-pump arguments establish only a *conditional* claim: coherence pays if preferences are stable and the option set fixed. With mispredicted preferences (e.g., overoptimism), commitment becomes a liability, and reconsideration protects. The arguments thus support a contingent strategic generalization—not a universal requirement of rationality—when real-world uncertainty and preference shifts are acknowledged.
