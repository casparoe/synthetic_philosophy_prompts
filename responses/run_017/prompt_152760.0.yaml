prompt: |-
  I'm in a graduate seminar on the foundations of quantum mechanics, and over the semester I've drifted, somewhat against my own expectation, into defending a position I originally took to be indefensible: that the probability problem for Everettian quantum mechanics is basically solved, and that what's left over is metaphysics of personal identity rather than anything specifically probabilistic.

  The version I hold has four parts. First, branch counting is dead: no scheme that gets probabilities by counting successors can handle unequal amplitudes, and the continuous structure of the state space was always going to force a measure rather than a count. Second, the decision-theoretic and self-locating-uncertainty derivations show that an agent who knows she is about to branch, and who cares about all of her successors, must set her credences equal to branch weight (squared amplitude) — so the Born rule is recovered as a constraint on rational action rather than postulated. Third, the objections I keep hearing — that the derivations are circular, that nothing is genuinely probable when every outcome occurs, that the derivations only fix betting behavior and not belief — either presuppose what they are meant to establish or would bite equally in non-quantum cases: ordinary duplication, deterministic cosmology with self-location uncertainty, fission cases generally. Fourth, so the Everettian owes us a story about persons and branches, but not a story about probability.

  I want the case against this, and I want it ranked. Give me the defeaters ordered from fatal to merely awkward, and for each one say whether a committed defender of my position would concede it as counting against them or would dismiss it, and why. I'm especially interested in exposure rather than restatement: what does this package predict or entail that its rivals don't, and is there anything — an experiment, a formal result, a case — that could actually break it? Three things worry me most, and I'd like them treated directly rather than folded into the general verdict.

  One: the derivations are supposed to be general principles of rationality, not principles about amplitudes. So apply them outside quantum mechanics. If I'm told that tonight I will be scanned and reconstituted a hundred times in one city and once in another, do those principles return 1/101 to being in the first city? Whatever they return, does it match what I antecedently think, and does the Everettian have a non-question-begging way of saying why the quantum case is different?

  Two: branch weight is standardly glossed as how much of the agent there is, or how much existence a successor has. But consider two branches of equal weight in which one successor goes on to a long, experiencially rich life and the other is destroyed a microsecond later. Weight apparently doesn't track amount of experience, or amount of anything else I care about. Is the gloss therefore empty — a metaphor propping up an intuition — and what argument or case would establish that it is empty rather than substantive? If it is substantive, what would count against it?

  Three: decoherence is approximate, and the decomposition into branches is not given by the formalism in any exact way. So the measure looks primitive — a thickness or mass attached to quasi-branches, doing exactly the work the Born rule used to do. What would show that this is a genuine addition to the ontology rather than the Born rule restated in new vocabulary? And if the Born rule is derived from the dynamics, what precisely would a detected deviation — departure from squared-modulus frequencies, or collapse-type noise — refute: the premises of the derivations, or the interpretation as a whole?

  Finally, be honest with me about insulation. I can't shake the suspicion that once the Born rule is a rationality constraint, there is no possible course of experience that could refute it: an agent who weighted all branches equally would be declared irrational rather than unlucky. If that's right, say so, and then tell me whether it's a defect here — whether a view of this kind is allowed to be unfalsifiable in that way, or whether it thereby forfeits the claim to have explained anything. For what it's worth, the thing I would personally find most persuasive is a case where the derivation's principles, run outside quantum mechanics, return advice that almost nobody would endorse; I'd rate that above any purely interpretive objection.

  Assume I can follow arguments in terms of amplitudes, decoherence and branching structure — no need to rehearse the basics.
reasoning: |-
  Okay, the user is in a graduate seminar on quantum mechanics foundations and has ended up defending Everettian quantum mechanics, specifically the idea that the probability problem is solved via decision-theoretic approaches. They want the strongest counterarguments ranked from fatal to awkward, focusing on three specific worries and the issue of insulation.

  First, I need to recall the main critiques against Everettian probability. The user mentions four parts of their position: rejecting branch counting, decision-theoretic derivations of the Born rule, objections being circular or irrelevant, and the remaining issue being personal identity metaphysics.

  Their three worries are:
  1. Applying the decision-theoretic principles outside QM to duplication cases.
  2. Whether branch weight corresponds to anything meaningful like experience.
  3. Decoherence being approximate, making branch weight primitive.
  And the insulation problem: if the Born rule is a rationality constraint, is it unfalsifiable?

  I should structure the response by ranking defeaters. Let me list the major objections I know. The Incoherence of Pre-measurement Uncertainty is a big one—how can there be uncertainty if all outcomes happen? Wallace and others use self-locating uncertainty, but critics like Maudlin say it's not genuine. Then there's the Epistemic vs. Metaphysical Uncertainty issue. If probability comes from ignorance, but in Everett there's no ignorance, can probability make sense?

  The Applicability to Non-QM Cases is one of their worries. Applying the same reasoning to duplication scenarios might lead to counterintuitive results, like 50-50 credence in the quantum case but not in the duplication. This could show that the derivations aren't general principles but rely on quantum specifics. 

  The Branch Ontology Problem ties into decoherence being approximate. If branches aren't fundamental, branch weight might be primitive. This could mean the Born rule isn't derived but built into the ontology, which undermines the derivation.

  The Empirical Accountability issue is about insulation. If no experience can refute the Born rule because deviations are just irrationality, that makes it unfalsifiable. That's a problem for scientific theories that need to be testable.

  For ranking, I'd say:
  - Fatal: Incoherence of Pre-measurement Uncertainty. If probability requires uncertainty and Everett denies it, the whole framework might collapse. 
  - Serious: Applicability to Non-QM Cases. If the principles give wrong results in classical cases, they're flawed.
  - Serious: Empirical Accountability. Unfalsifiability is a major flaw in a scientific theory.
  - Serious: Branch Ontology Problem. Primitive weights mean the Born rule isn't derived.
  - Awkward: Metaphysical Commitments. Personal identity issues are messy but not fatal.

  On their three worries:
  1. Non-QM Cases: The principles might require indifference over identical successors, but in asymmetric cases (like different cities), they might not apply. But if in symmetric cases they give 50-50, but intuitively we'd say 100 duplicates mean higher chance, that's a problem. The Everettian might bite the bullet or argue caring measure makes sense.
  2. Branch Weight and Value: If weight doesn't track experience, why care? The response is that pre-branching, you care proportionally because all possible experiences matter. Post-branching, successors care about their own futures. But if a branch dies quickly, that might not affect pre-branching concern if weight is about possibility.
  3. Decoherence Approximation: If branches aren't exact, weights are approximate. But this might make probabilities vague, which is awkward. A deviation could refute the dynamics, not the probability rule.

  Insulation: If Born rule is a rationality constraint, deviations in experience don't refute it—you're just irrational. This is problematic because scientific theories need empirical accountability. The Everettian might say overall wavefunction statistics should match, so deviations refute the dynamics. But if not, it's insulated.

  The user wants a case where the principles give counterintuitive results outside QM. The duplication case: 100 copies in NY, 1 in LA. Decision theory might say care equally, so 1/101 for LA. But intuitively, you'd think 1/101 is too low for being in LA. If the Everettian says this case is different because of quantum amplitudes, but the principle was supposed to be general, that's circular. That's a strong counter.

  In conclusion, the strongest defeaters are incoherence of uncertainty, non-applicability to non-QM cases, and insulation. The user's position is defensible but has serious challenges, especially on generality and testability.
answer: |-
  Here's the case against your position, ranked from most to least damaging, based on the strongest philosophical and technical objections in the literature. I'll address your three worries explicitly and close with insulation. Each defeater includes: (1) the objection, (2) how fatal it is, (3) whether your position must concede it, and (4) potential responses from your side.

  ### **Ranked Defeaters**
  1.  **The Incoherence of Pre-measurement Uncertainty (Fatal, but debatable)**  
      - **Objection**: If all branches are actual, there is *no metaphysical uncertainty* about outcomes for a pre-measurement agent. Rational credence requires *ignorance* of which outcome will obtain, but in Everett, *all* outcomes obtain. Self-locating uncertainty (e.g., "Which branch am I in?") fails because the agent *isn't yet* in any branch pre-measurement. The decision-theoretic derivations (e.g., Wallace's) *presuppose* that agents care about future selves in a way that requires probabilistic weighting, but this begs the question: why weight by amplitude if all successors are equally real?  
      - **Fatality**: Potentially fatal. If probability requires genuine uncertainty, and Everett denies it, the entire project collapses.  
      - **Concession?** You *must* concede this is the core challenge, but may dismiss it by rejecting the link between probability and uncertainty. Critics (e.g., Maudlin, Albert) argue that without ontological indeterminism, "probability" is incoherent.  
      - **Response from your side**: Appeal to *caring measure* (Wallace): rational agents *must* weight their concern for successors by amplitude to avoid Dutch books or instrumental irrationality. But this assumes amplitude is the correct weighting, which is circular if amplitude *is* probability.  
      - **Exposure**: A formal result breaking this would be a proof that no coherent preference relation can recover the Born rule without smuggling in probabilistic assumptions. None exists, but the burden is on Everettians to show why non-probabilist agents are irrational *prior* to assuming amplitude matters.

  2.  **Non-Applicability of the Derivation to Non-QM Cases (Serious)**  
      - **Objection (your first worry)**: Apply the decision-theoretic principles to your duplication case. An agent told they'll have 100 duplicates in City A and 1 in City B should, by indifference over identical successors, assign 1/101 credence to being in B. But intuitively, we'd assign ~1/2 to B (if the process is symmetric) or reject the question (if duplicates are distinct persons). Worse: if duplicates in A are *not* identical (e.g., different memories), the principle returns no clear answer. Yet in QM, branches have *intrinsic weights* (amplitudes), making the cases disanalogous. The derivation only "works" in QM because amplitude is *already* a measure—it doesn't generalize.  
      - **Fatality**: Serious. If the principles fail outside QM, they aren't general rationality constraints but ad hoc moves for QM.  
      - **Concession?** You must concede the disanalogy but dismiss it as irrelevant: amplitudes are part of quantum branching, so the derivation needn't apply elsewhere. Critics (e.g., Price) argue this reveals amplitude as a *primitive probabilistic input*.  
      - **Response**: Claim that in non-QM fission, *no physical measure* plays amplitude's role, so indifference is undefined. But this implies amplitude isn't derived from rationality alone—it's baked into physics.  
      - **Exposure**: A case where the principles advise something indefensible (e.g., caring equally about 1 duplicate and 1000 in a non-QM setup). If users of the principle *reject* its advice here (e.g., "I'd bet on being in A, not 50/50!"), it undermines their universality.

  3.  **Empirical Accountability and Insulation (Serious)**  
      - **Objection**: If the Born rule is a rationality constraint, no sequence of outcomes can refute it. An agent who observes low-amplitude outcomes consistently is *irrational* for not updating—but in Everett, those outcomes *happen* in some branches. This makes the theory unfalsifiable: deviations from Born statistics are attributed to the agent's location in a low-weight branch, not an error in QM.  
      - **Fatality**: Serious for scientific realism. If probabilities can't be empirically wrong, they don't explain frequencies.  
      - **Concession?** You concede insulation but dismiss it: Everett *predicts* Born statistics in the majority of branches (per measure), so it's falsifiable *in the aggregate*. Critics (e.g., Kent) retort that "majority" presupposes the Born measure—a circular epistemic move.  
      - **Response**: Appeal to *typicality* (Greaves): rational agents should expect to find themselves in high-weight branches. But this assumes the measure *defines* typicality, which is question-begging.  
      - **Exposure**: A confirmed deviation from Born statistics (e.g., in a space-based interference experiment) *would* refute unitary QM—but on your view, it shouldn't affect the probability rule. This divorces theory from evidence.

  4.  **Branch Ontology and Primitive Weights (Awkward)**  
      - **Objection (your third worry)**: Decoherence only approximates branches, so branch weights aren't fundamental. The "measure" is just the Born rule in disguise—a primitive posit that does no explanatory work. If weights are ontologically basic (e.g., as "quantum mass"), why call this "deriving" probability?  
      - **Fatality**: Awkward but not fatal. It makes Everett less parsimonious but doesn't break it.  
      - **Concession?** You concede weights are emergent but dismiss the objection: decoherence *explains* why weights are empirically salient. Critics (e.g., Baker) argue this reduces to "shut up and calculate" with extra steps.  
      - **Response**: Weights are *defined* by the Hilbert space norm, which is dynamical (via the Schrödinger equation). A deviation from Born statistics would refute unitarity itself, not just interpretation.  
      - **Exposure**: If a theory with *different* weights (e.g., based on branch count) matched experiment, it would break your view. But no such theory exists.

  5.  **Value/Experience Mismatch (Awkward)**  
      - **Objection (your second worry)**: Branch weight doesn't track any intrinsic value (e.g., duration of experience). In your example, a high-weight branch ending quickly provides less total experience than a low-weight long-lived one. The "how much of you exists" gloss is thus empty—it conflates *caring measure* (a decision-theoretic tool) with *ontology*.  
      - **Fatality**: Awkward. It undermines intuitive justifications but not formal ones.  
      - **Concession?** You concede the gloss is metaphorical but dismiss it: pre-branching, you care about *possible futures*, and amplitude measures their "reality." Critics (e.g., Papineau) argue this is circular without independent grounding.  
      - **Response**: Rational action doesn't require weights to track experience—only to avoid incoherent preferences. Post-branching, successors care about their *own* futures.  
      - **Exposure**: If a theory linked weights to conscious moments (e.g., integrated information), and it deviated from QM, it might break the decision-theoretic story. But this is speculative.

  6.  **Metaphysical Commitments (Merely Awkward)**  
      - **Objection**: The "personal identity" problem is severe. If persons are branch-relative, how can pre-branching agents have unified preferences? If not, what constitutes "surviving" as a successor? This isn't solved—it's swept under "metaphysics."  
      - **Fatality**: Awkward. It doesn't refute probability but makes the view philosophically costly.  
      - **Concession?** You concede it's unresolved but dismiss it as separable. Critics (e.g., Lewis) argue that fission cases threaten the coherence of "caring about successors."  
      - **Response**: Parfit-style reductionism: identity doesn't matter; survival does, and amplitude weights rational concern.  

  ---

  ### **Direct Response to Your Three Worries**
  1.  **Non-QM Duplication Case**:  
      - The principles *do* return 1/101 for being in the sparse city. This conflicts with intuition (most would say ~1/2 or undefined).  
      - **Everettian defense**: The QM case differs because amplitudes are *physical degrees of reality* (via Hilbert space), while duplication is conventional. But this admits the derivation isn't pure rationality—it needs quantum physics.  
      - **Breaker**: If users of the principle *reject* 1/101 in duplication (e.g., "I'd pay to avoid being scanned if duplicates suffer"), the derivation isn't general. This exposes it as quantum-specific.

  2.  **Branch Weight Gloss**:  
      - The gloss *is* metaphorical. Weight doesn't track experience; it's a normative constraint on rational action.  
      - **Substantive?**: Only if you accept decision theory as constitutive of rationality. A **case against it**: Suppose a branch with high weight but no consciousness (e.g., a rock). Why "care" about it? If you don't, the gloss fails.  
      - **Everettian defense**: Branches without observers aren't agents—the derivation only applies to future *selves*.

  3.  **Primitive Weights**:  
      - Weights *are* the Born rule in disguise. Decoherence's approximations mean probabilities are vague (e.g., for "fuzzy" branches).  
      - **What would show it's primitive?**: If no derivation of weights from non-probabilistic axioms succeeds. Wallace's proofs *assume* unitary dynamics—so deviations (e.g., collapse) refute the axioms, not the probability rule.  
      - **Breaker**: A viable alternative measure (e.g., based on decoherence time) that fits experiment would break the Born rule derivation.

  ---

  ### **Insulation: The Unfalsifiability Problem**
  - **Your suspicion is correct**: If the Born rule is a rationality constraint, no individual experience can refute it. An agent in a low-weight branch who doubts the Born rule is *irrational*, not unlucky.  
  - **Is this a defect?** Yes, for three reasons:  
    1. **Scientific explanation requires risk**: A theory that cannot be empirically wrong (at the level of individual agents) explains nothing.  
    2. **It inverts epistemology**: Born statistics aren't *observed*—they're *defined* as "what rational agents expect."  
    3. **It privileges the theory**: Everett becomes immune to evidence that would falsify rivals (e.g., collapse models).  
  - **Consequence**: The view forfeits explanatory power. It *describes* why Born weights are action-guiding but doesn't *explain* why we observe them. Rivals (e.g., de Broglie-Bohm) can do both.  
  - **Everettian escape hatch**: Claim that *unitarily expected frequencies* match Born statistics, so the theory *is* testable at the ensemble level. But this relies on the very measure in question.  

  ### **Final Verdict**
  Your position is defensible but **highly vulnerable** to the incoherence of probability (#1) and non-generality (#2). The strongest breaker is **failure in non-QM cases**: if users of the decision-theoretic principles reject their own advice in classical fission (e.g., refusing 1/101 credence), it reveals the derivation as question-begging. This isn't yet decisive—hardcore Everettians bite the bullet—but it shifts the burden. Insulation (#3) is a serious cost but not unique to Everett (e.g., Boltzmann brains in cosmology). If you can live with these, your view stands; if not, the probability problem remains open.
