  We are translating a metaethical debate into the terminology of functional programming, specifically focusing on types, expressions vs. statements, and monads.

  The core of the Frege-Geach problem for expressivism:

  Expressivism (in its naive form) says that a moral sentence, such as "stealing is wrong", is not of a type that represents a truth value (like Bool) but rather performs an action (like a side effect). For example, it might express disapproval of stealing.

  The problem arises when such a sentence is embedded in a larger structure, such as a conditional: "If stealing is wrong, then getting your little brother to steal is wrong." The conditional is typically thought to require components that are truth-apt (i.e., of type Bool) so that we can apply modus ponens. But if "stealing is wrong" is an action (like a command or an effect), then it doesn't have a truth value and cannot be embedded.

  In programming terms:

  - The expressivist initially assigns the moral sentence a type that is an effectful action, say `IO ()` (an action that does something and returns nothing). But then we try to use it in a context that requires a boolean (like an `if` condition) and we get a type error.

  The expressivist responses:

  1. **Attitude toward a complex**: The expressivist might say that when we use a moral sentence in a conditional, we are not expressing an attitude toward stealing but toward the complex of stealing and its relation to getting one's brother to steal. In functional terms, they might try to change the type of the moral sentence so that it can be embedded. One idea is to make the moral sentence a function that takes a proposition (the content) and returns an attitude (an effect). But then we need to handle composition.

  2. **Quasi-realism**: The project of building truth-apt moral judgments out of expressive materials. This is analogous to using a monad to turn a sequence of effectful actions into a pure value that can be manipulated. Specifically, we might use a monad to "lift" the expressive content so that we can embed it in conditionals and other truth-functional contexts.

  Let's try to formalize:

  - Let `MoralSentence` be the type of moral sentences.

  Naive expressivism: 
     `assert "stealing is wrong" : IO ()`

  But we want to form:
     `if (assert "stealing is wrong") then (assert "getting your brother to steal is wrong")`

  But `if` requires a condition of type `Bool`, not `IO ()`.

  So the expressivist might try to reinterpret the conditional as expressing a complex attitude. For example, the conditional expresses a conditional attitude: disapproval of stealing would lead to disapproval of getting one's brother to steal. 

  In functional terms, they might change the type of the moral sentence to be a function from propositions to attitudes:

     `moral : Proposition -> Attitude`

  But then we need to define what an attitude toward a conditional proposition is. For a conditional, we might have:

     `if (moral p) then (moral q)` 

  But that doesn't type because `moral p` is an attitude, not a boolean.

  Alternatively, we might try to define a new type for moral propositions that can be embedded. This is where the monad comes in.

  Quasi-realism might be seen as introducing a monadic type:

     `type Moral a = (a -> Attitude) -> ...`

  But actually, a common quasi-realist move is to define moral propositions as being truth-apt by constructing a notion of moral truth from the expressive attitudes. This is analogous to defining a monad that allows us to combine these expressive actions and then project out a truth value.

  For example:

     We can define a type `Moral` that is a monad. Then:

     `stealingIsWrong :: Moral Bool`

     Now, `stealingIsWrong` is a monadic value that, when run, would express an attitude and also yield a boolean (which might be true if stealing is wrong, false otherwise). But note: the expressivist doesn't want to commit to there being an independent truth value. So the boolean here is a projection of the attitude.

     The conditional becomes:

     `ifM stealingIsWrong then (gettingBrotherToStealIsWrong) else (return ())`

     But that doesn't solve the embedding in a conditional that is not moral. The Frege-Geach example is a conditional that is itself a moral sentence? Actually, the conditional is a moral sentence? Or is it a non-moral conditional with a moral antecedent?

     The original example: "If stealing is wrong, then getting your little brother to steal is wrong." This whole sentence is a moral sentence? Or is it a logical sentence about moral sentences?

     The expressivist wants to say that the entire conditional is also expressive. So:

     `moralConditional :: Moral Bool -> Moral Bool -> Moral Bool`

     But then we have to define what it means to have a conditional between two moral sentences. The quasi-realist project is to define the logical operations for the `Moral` type so that they behave exactly like the truth-functional operations, even though the underlying material is non-cognitive.

     The monad (or more generally, a monad-like structure) allows us to sequence and combine these moral expressions. But note: the conditional in logic is usually a function of type `Bool -> Bool -> Bool`. We need to lift this to the moral realm.

     We might define:

     `moralIf :: Moral Bool -> Moral Bool -> Moral Bool`
     `moralIf mb1 mb2 = do
          b1 <- mb1
          b2 <- mb2
          return (if b1 then b2 else True)   -- but note: this is just the material conditional?`

     However, this is not capturing the expressivist idea because the expressivist doesn't want to evaluate the moral sentences to booleans. Instead, they want to express attitudes conditionally.

     Another approach is to use the continuation monad. This is a known way to model embeddings in expressivism (see work by Schroeder or others). 

     Define:

     `type Moral = forall r. (Bool -> Attitude) -> r`

     But that might be overcomplicating.

  Residue Report:

  You suspect that the monad analogy is doing too much work. The key question is whether the quasi-realist reconstruction of truth, belief, and disagreement in moral discourse is genuine or a simulacrum.

  In functional programming, when we use a monad to handle side effects, we are not eliminating the side effects; we are structuring them so that we can reason compositionally. The pure code that uses the monad is abstracted from the side effects, but when we run the program, the effects are still there.

  Similarly, the quasi-realist project does not claim that moral sentences are describing mind-independent facts. Instead, it claims that we can reconstruct the logical behavior of moral discourse in a way that respects truth-aptness, disagreement, etc., even though the underlying machinery is expressive.

  The philosophical question is: does this reconstruction capture everything we mean by truth and belief? The realist will say no: because the attitudes are still just attitudes, not beliefs about objective facts. The quasi-realist will say that the distinction collapses because there is no practical difference in the use of the language.

  In your vocabulary, the monad gives you a way to compose effects and treat them as pure values within the monadic context. But when you leave the monad (by running the program), you get the effects. Similarly, in moral discourse, we are always within the monad? There is no "running" the moral discourse to get a pure value? Or is the moral discourse itself the run?

  The hole in the translation: the monad analogy captures the compositionality, but it doesn't address the metaphysical question of what moral properties are. The quasi-realist is an anti-realist at heart, and the monad is just a way to make the anti-realism compatible with the surface features of moral language.

  The distortion: we are treating moral sentences as computations that produce attitudes, but the attitudes are not side effects in the same way as printing to the screen. They are psychological states. The monad analogy might obscure the fact that the expressivist is giving a psychological account of moral judgment.

  Moreover, the question of whether the reconstructed truth is "real" might not have a counterpart in programming. In programming, we don't care if a monadic value is "really" a pure value; we care that it composes correctly and does what we want. But in philosophy, the question of whether moral truth is objective is considered important.

