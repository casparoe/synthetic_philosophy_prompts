  1. The psychological nature of attitudes: in programming, effects are observable actions (like I/O). But in expressivism, the attitude is a mental state. This might be a difference.

  2. The question of objectivity: the realist thinks that moral truth is independent of our attitudes. The quasi-realist denies that. The monad doesn't help decide that issue.

  3. The difference between a simulation and the real thing: in programming, we often simulate one thing with another and don't worry about the "realness". But in philosophy, the realism/anti-realism debate is central.

  Therefore, the translation is helpful for understanding the compositionality problem and how expressivists might solve it (with a monad-like structure). But it doesn't resolve the deeper philosophical question. That question might be one that your framework (focused on composition and types) is not designed to answer. It's a metaphysical question, not an engineering one.

  So, the dispute is not thinner than it sounds. The compositionality problem is technical and can be solved (or so expressivists claim) by a monad-like construction. But the residue is about what moral judgments are ultimately about, and that is a substantive philosophical disagreement.

  Final note: the expressivist must also explain moral disagreement. In programming, two monadic values might be different, but that doesn't necessarily capture the idea of two people disagreeing in their attitudes. The quasi-realist has to reconstruct the phenomenon of disagreement from the expressive materials. This might be analogous to having two computations that produce conflicting effects? But then how do we judge which one is correct? In programming, we don't have an external standard for the effects; we just have the program. Similarly, the expressivist doesn't have an external standard for moral attitudes.

  This is where the analogy might break down: because in moral discourse, we do think there is a standard of correctness. The expressivist must explain that standard without appealing to mind-independent facts. The quasi-realist project is to show that the standard can be internal to the practice of expressing and combining attitudes.

  In summary:

  - The Frege-Geach problem is a type error in the naive expressivist theory.
  - The expressivist repairs by introducing a more complex type (like a monad) that allows embedding.
  - The quasi-realist project is the construction of a monadic structure that recovers truth-aptness and logic.
  - The residue: the monad solves the compositionality, but the philosophical question of whether this reconstructed moral discourse captures "real" truth and belief is not settled by the monad. It depends on whether you think the monadic representation is all there is to moral truth.

  Thus, the hole in your framework is that it doesn't have the resources to decide between realism and anti-realism. But that's okay because that's a philosophical question beyond the scope of type theory and functional programming.

  The distortion: we had to treat moral sentences as side effects and attitudes as outputs of computations, but in reality, the attitudes are not just outputs; they are part of a complex psychological and social practice. The monad helps with the logic, but less so with the phenomenology and the metaphysics.
answer: |-
  ### Translation of the Expressivism/Frege-Geach Dialectic into Functional Programming Concepts

  #### Core Setup
  - **Naive Expressivism**:  
    A moral sentence like `stealingIsWrong` isn't a truth-apt description (i.e., not `Bool`). Instead, it **performs an effect** (expressing disapproval).  
    - **Type**: `MoralStatement :: IO ()`  
      (An effectful action with no meaningful return value. Like `print "Disapprove(stealing)"`.)

  - **Frege-Geach Problem**:  
    When embedded (e.g., in a conditional: `if stealingIsWrong then gettingBrotherToStealIsWrong`), we need a **truth-apt value** (e.g., `Bool`) for logical operations. But `IO ()` isn't composable here.  
    - **Type Error**:  
      ```haskell
      -- Type mismatch!
      if :: Bool -> a -> a -> a  -- Requires Bool
      stealingIsWrong :: IO ()   -- Got IO () instead
      ```
    - **Problem**: Effects (`IO ()`) can't be embedded in truth-functional contexts (`Bool`). Modus ponens requires chaining truth values, not effects.

  ---

  #### Expressivist Repairs: Two Moves

  1. **Attitudes Toward Complex Propositions (Hybrid Expressivism)**  
     Idea: Moral sentences express attitudes **about propositions**, not just atomic actions.  
     - **Type Change**:  
       ```haskell
       -- Before: Atomic attitude (no embedding)
       stealingIsWrong :: IO ()  
       
       -- After: Attitude about a proposition (embeddable)
       type Attitude = Proposition -> IO ()
       
       stealingIsWrong :: Attitude
       stealingIsWrong = \prop -> when (prop == Stealing) (print "Disapprove")
       ```
     - **Conditional Handling**:  
       Express an attitude toward the **implication itself**:  
       ```haskell
       ifStealingWrongThenBrotherWrong :: Attitude
       ifStealingWrongThenBrotherWrong = \prop -> 
         when (prop == (Stealing `Implies` BrotherStealing)) $
           print "Disapprove(implication)"
       ```
     - **Critique**:  
       This is **shallow lifting** (`IO` → `Attitude`). It handles embedding but violates compositionality:  
       - The conditional attitude is **disconnected** from atomic attitudes.  
       - No way to derive `ifStealingWrongThenBrotherWrong` from `stealingIsWrong` and `brotherStealingWrong`.  
       - **Analogy**: Manually defining a new effect for each logical operator. Not scalable.

  2. **Quasi-Realism (Monadic Lift)**  
     Project: Reconstruct truth-apt moral "beliefs" from attitudes using a **monad-like structure**.  
     - **Type**: Introduce a moral "context" monad:  
       ```haskell
       -- Moral a = A computation producing an attitude, 
       --           but projecting a truth-like value (a)
       type Moral a = (a -> IO ()) -> IO ()
       ```
       (This is a **continuation monad** `ContT IO a`, threading attitudes through computations.)  
     - **Embedding Conditionals**:  
       Define `return`, `(>>=)`, and moral operators:  
       ```haskell
       -- Pure value → moral truth-apt value
       return :: a -> Moral a
       return x = \k -> k x  -- "Holds" x as a value in moral context
       
       -- Moral modus ponens
       (>>=) :: Moral a -> (a -> Moral b) -> Moral b
       moralIf :: Moral Bool -> Moral Bool -> Moral Bool
       moralIf cond consequent = 
         cond >>= \c -> if c then consequent else return True
       ```
     - **Truth-Aptness**:  
       Quasi-realism "hacks" truth by:  
       - Projecting a `Bool` from attitudes (`Moral Bool`).  
       - Defining `moralNot`, `moralAnd`, etc., to mirror logic.  
     - **Analogy**:  
       Like `IO String` projecting a pure `String` via `unsafePerformIO` (but without unsafety).  
       The monad **encapsulates effects** while exposing pure-like interfaces.

  ---

  ### Residue Report: What Doesn't Translate Cleanly

  #### 1. **The Monad Analogy Overextends**
     - **Success**: The monad perfectly models **compositionality of effects** (solving Frege-Geach).  
     - **Failure**: It **doesn't resolve metaphysical disputes**:  
       - Quasi-realism’s `Moral Bool` is **technically truth-apt** (it supports `moralIf`, `moralNot`).  
       - But is it "real" belief or a **simulacrum**? Your framework can't tell.  
       - **Key Hole**: Functional programming cares about **behavior**, not metaphysics. The type `Moral Bool` works if it satisfies the laws of logic and monads. But philosophers care whether this construction "corresponds to mind-independent facts" – a notion absent in FP.

  #### 2. **Where the Analogy Distorts**
     - **Attitudes ≠ Side Effects**:  
       Expressivist "attitudes" (disapproval) are **psychological states**, not observable actions like `print`. FP effects are public; attitudes are private. This makes "attitude composition" feel ad-hoc.  
     - **Disagreement**:  
       In FP, two `Moral Bool` computations can conflict (`return True` vs `return False`), but this doesn’t capture **normative force**. Why *should* you care if your `Moral` instance disagrees with mine? Expressivism needs an extra ingredient (e.g., **conversational scorekeeping**).  
     - **Truth as a Projection**:  
       Quasi-realism’s "truth" is **defined behaviorally** (via logical rules). FP says: "If it quacks like a `Bool`, it’s a `Bool`." Philosophers ask: "But is it a *duck*?" Your framework has no duck detector.

  #### 3. **The Thinness of the Original Dispute**
     - Frege-Geach is **trivially solvable** in FP (use a monad). Quasi-realism is just the `Monad` instance for `Moral`.  
     - **Why Philosophers Care**:  
       - They’re debating whether `Moral Bool` **reduces to** `IO ()` (anti-realism) or requires a **primitive `Bool`** (realism).  
       - Your framework is **neutral**:  
         ```haskell
         -- Anti-realist: Moral = Fn(IO ())
         type Moral a = (a -> IO ()) -> IO ()
         
         -- Realist: Moral = Bool (primitive)
         type Moral = Bool
         ```  
         Both pass the type checker if you define the operators.  
     - **The Real Issue**:  
       Whether "truth" in ethics is **procedural** (defined by how we use `moralIf`) or **substantive** (a pre-linguistic reality). FP has no tools for this.

  ---

  ### Conclusion
  - **Your Vocabulary Suffices** for the **technical/logical problem** (Frege-Geach is a type error; monads solve embedding).  
  - **The Residue is Metaphysical**:  
    - Quasi-realism is a **monadic lifting of attitudes** into a truth-apt interface.  
    - But the question *"Is this real truth or a pragmatic fake?"* has **no FP counterpart**. It reduces to:  
      - *Realism*: "`Moral` must be `Bool` (primitive)."  
      - *Anti-Realism*: "`Moral` is `ContT IO Bool` – truth is use-relative."  
  - **Why It Matters**:  
    If ethics is `ContT IO Bool`, then "stealing is wrong" has no authority beyond our collective attitudes. If it’s `Bool`, it’s a fact of the universe. FP can implement both; it can’t choose between them.  

  **Final Verdict**: The dispute isn't thin – it’s about the **ontology of moral facts**. But your framework exposes that the **logical machinery** is neutral scaffolding. The monad solves compositionality; the metaphysics is extra.
