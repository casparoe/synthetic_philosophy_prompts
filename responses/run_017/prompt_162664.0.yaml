prompt: |-
  I have been reading rationalist blogs and forum threads on Bayesian epistemology for something like fifteen years — the sequences, the old comment wars, and more recently a small forecasting league I help run, where participants routinely issue conditional forecasts (if the treaty is ratified, then the currency peg survives) and we argue about how to score them — and the same thing happens every time a thread turns to what it means to put a probability on an indicative conditional. Someone asserts that the probability of if A, B just is the conditional probability of B given A; someone else says that identity was refuted decades ago by Lewis's triviality arguments; a third person mentions Adams, or closest-world selection-function semantics, or the idea that conditional probabilities are primitive rather than derived; and the thread stalls at the level of brand names without anyone saying what a theory of the probability of a conditional is supposed to do. So before I read any more of the literature, I want the specification rather than the menu.

  Write me the desiderata for a theory of the probability of an indicative conditional: what any adequate account has to deliver, each paired with the case or consideration that makes it a requirement rather than a taste. I want the requirements to carry the weight here, not the scorecard, though two or three lines on the main candidate families at the end is welcome. In particular, say which of the things people routinely demand are genuine desiderata and which are the prejudices of one camp. Compositionality, for instance: a conditional occurring inside Boolean compounds and inside further conditionals, so the theory must make sense of the probability of if A then B, or if C then D — is that a requirement, or an artifact of assuming in advance that conditionals express propositions? Is a unified treatment of indicatives and counterfactuals required, or is that a preference a theory of indicatives may decline? Is it a desideratum that the probability of if A, B be defined when P(A) is zero or infinitesimal, or is leaving it undefined an acceptable cost, given that the near-miss cases (if the dam had held, if the launch had been scrubbed) are exactly the ones where people report the firmest probabilities? I suspect the deliberational cases matter and I almost never see them raised: when the antecedent describes an action the speaker is even now deciding whether to perform (if I were to press the button, if I pay the hundred dollars), conditional probability looks like the wrong object entirely, since an agent who has not yet settled on A has no stable unconditional P(A) to condition on, and yet agents hold firm credences in such conditionals and act on them. And I want a requirement — or a debunking of the apparent requirement — from the forecasting side: if a conditional forecast is scored only on those occasions where the antecedent is realized, is calibration over that subclass, or expected accuracy under a proper scoring rule, the standard an account of the probability of conditionals has to meet?

  The part I most want, though, is the negative result. As I understand them, Lewis's triviality arguments show that a cluster of plausible-looking constraints — that identity with conditional probability, the conditional's being a proposition in the algebra, closure under Boolean operations, and non-collapse of the probability space into a handful of atoms — cannot all hold together. So I want the list to be honest about which subsets are jointly unsatisfiable, with the minimal inconsistent subset identified and the assumption doing the damage named: I would rather watch the desiderata turn into a theorem than have the list quietly presuppose that some escape hatch has already been taken. Relatedly, tell me whether the choice between conditioning and imaging as the operation of supposing A is itself a desideratum or a disguised decision about semantics. My understanding is that if you revise by Lewis's imaging rule, moving each world to its closest A-world, the resulting probability of B just is the probability of the Stalnaker conditional, which is one route to letting the probability of the conditional come apart from the conditional probability; if that is right, what does it cost elsewhere — imaging does not commute with ordinary conditioning, or does not compose the way updating should, or something in that vicinity, and I want the cost stated properly rather than gestured at. I also want your view on conditional bets: if every payoff a bet on the conditional could deliver is replicable by a bet on B conditional on A, does that drain the identity of content, or does the price of a bet on the conditional remain a quantity a theory is obliged to predict? Finally, which single requirement on your list excludes the largest number of live candidates, and which two do you expect defenders to quietly drop? Please argue from the cases, and do not give me a reading list or a set of references — I have no library access and want the reasoning, not the citations.
reasoning: |-
  Okay, let me start by unpacking this user's query. They've been immersed in Bayesian epistemology for fifteen years, engaging with rationalist blogs, forecasting leagues, and conditional probability debates. The core frustration is the circular, unproductive arguments about what the probability of an indicative conditional means, without clear criteria for evaluating theories. They want a specification of desiderata—what any adequate theory must deliver—paired with concrete cases that justify each requirement.

  First, I need to identify the key pain points: triviality arguments (Lewis), compositionality disputes, unified treatment of indicatives/counterfactuals, zero-probability antecedents, deliberational conditionals, and scoring conditional forecasts. The user explicitly rejects "brand name" solutions (Adams, Stalnaker, etc.) and demands reasoning, not references.

  The user mentions Lewis's triviality results. I recall these show that equating P(if A then B) with P(B|A) leads to contradiction unless the probability space is trivial. The challenge is to present this without jargon, focusing on the conflicting constraints. The minimal inconsistent subset includes: (1) Probability of conditional equals conditional probability. (2) Conditionals express propositions. (3) Probability is Kolmogorov-consistent. (4) Non-triviality (no atomic collapse). 

  For deliberational cases, the user highlights situations where the agent hasn't decided on action A yet, so P(A) isn't stable, but they still assign credence to "if I do A, B." This seems crucial—standard conditional probability fails here because it relies on a fixed P(A). A theory must handle this without presupposing settled credences over actions.

  On forecasting, the scoring issue: should conditional forecasts be evaluated only when the antecedent occurs? The user wants to know if calibration over that subclass is a desideratum. Yes—proper scoring rules for conditionals must align with this to avoid perverse incentives. 

  Compositionality is tricky. The user asks if requiring conditionals to embed in Boolean compounds is necessary or a bias from propositional accounts. I think it's optional—some theories (like Adams') sacrifice it to preserve other desiderata, and real-world use rarely involves nested conditionals. 

  For zero-probability antecedents, the user notes that near-miss cases ("if the dam had held") feel most certain. A theory must either assign probabilities here (via imaging, infinitesimals) or explain why it's acceptable to leave undefined. The cost of undefined probabilities in high-stakes counterfactuals is a real concern.

  Conditional bets: if a bet on "if A, B" can be replicated by a conditional bet on B given A, does this undermine the need for distinct probabilities? Not necessarily—the pricing behavior might still differ, so a theory should predict this divergence.

  Imaging vs. conditioning: The user mentions that imaging (moving to closest A-world) gives P(Stalnaker conditional), which may differ from P(B|A). But imaging doesn't commute with conditioning, making sequential updates path-dependent. This is a cost for diachronic coherence—a key tradeoff.

  Now, prioritizing desiderata. The most exclusionary is probably **Non-Collapse Under Supposition (Desideratum 3)**, as it forces a break from pure conditional probability. The hardest to satisfy jointly are **Propositional Behavior (Desideratum 1)** and **Probability-Conditional Probability Identity (Desideratum 2)**—they directly trigger triviality. Theorists often drop 1 (e.g., Adams) or modify 2 (e.g., with imaging).

  Finally, the user wants "negative results" laid bare. The key inconsistency is: if you insist on conditionals having propositional truth-values AND matching conditional probability AND a non-trivial probability space, you get a contradiction. Any theory must ditch one of these. 

  The response should structure desiderata with: (1) the requirement, (2) the justifying case, (3) conflicts. No named theories until the end, and only to illustrate tradeoffs. Emphasize that forecasting/deliberation cases are underdiscussed but vital. Stress that compositionality and unified indicatives/counterfactuals are negotiable—focus on what users actually do with conditionals.
answer: |-
  Here are the core desiderata for any adequate theory of the probability of indicative conditionals, derived from the cases and constraints you've highlighted. Each is paired with the non-negotiable consideration that necessitates it. The list exposes inherent tensions and identifies minimal inconsistent sets.

  ### Core Desiderata (What a Theory Must Deliver)
  1.  **Probability Under Uncertainty (Deliberational Constraint)**
      *   **Requirement:** The theory must assign a coherent probability to *if A, B* even when the agent has *no settled credence* in the antecedent A, particularly when A describes an action under current deliberation (e.g., "If I press this button, the alarm will sound").
      *   **Case:** An agent deciding whether to press the button has no stable P(Press). Yet, they hold a meaningful (and actionable) credence in the conditional itself. Conditional probability P(B|A) is undefined or unstable without P(A). An adequate theory *must* model this pre-decision state.

  2.  **Scoring Alignment (Forecasting Constraint)**
      *   **Requirement:** The probability assigned to *if A, B* must correspond to the *calibration* or *expected accuracy* of the conditional forecast *specifically over the instances where A is true*, under a proper scoring rule.
      *   **Case:** In forecasting (e.g., "If the treaty is ratified (A), the currency peg survives (B)"), the forecast is only evaluated when A occurs. The score depends solely on whether B is true/false in those A-worlds. The theory's probability must predict performance *in this specific reference class*. Failing this makes the probability useless for its core predictive purpose.

  3.  **Non-Collapse Under Supposition (Near-Miss Constraint)**
      *   **Requirement:** The theory must assign a coherent probability to *if A, B* even when P(A) = 0 or is infinitesimal, particularly in cases where supposing A feels meaningful and the probability feels firm (e.g., "If the dam had held (A=0), the town would be safe (B)").
      *   **Case:** Humans confidently assign probabilities to counterfactuals and near-miss scenarios despite zero antecedent probability. A theory declaring these probabilities undefined or arbitrary fails to model actual reasoning and judgment.

  4.  **Suppositional Coherence (Adams' Thesis Constraint - Partial)**
      *   **Requirement:** When P(A) > 0 and the agent has a settled credence in A, the probability of *if A, B* must constrain or equal P(B|A) *in simple, non-nested contexts*. This must hold *at least* when evaluating a single conditional in isolation during static belief assessment.
      *   **Case:** In simple reasoning ("If it rains (A), the match will be canceled (B)"), competent speakers intuitively equate the plausibility of the conditional with the conditional probability. Denying this core intuition entirely divorces the theory from usage. *However, this is the constraint most likely to be violated under pressure from others (see Triviality below).*

  ### The Triviality Trap (The Minimal Inconsistent Set)
  Lewis showed that the following seemingly plausible constraints **cannot all hold simultaneously** in a non-trivial probability space:
      a.  **Propositional Truth (Truth-Conditionality):** *if A, B* expresses a proposition with a truth-value in every world (allowing it to be part of the algebra).
      b.  **Probability-Conditional Probability Identity:** P(if A, B) = P(B|A) for all A, B where P(A)>0.
      c.  **Kolmogorov Probability:** Standard probability axioms hold.
      d.  **Non-Triviality:** The probability space is not limited to a few atoms where conditioning degenerates.

  **Minimal Inconsistent Core:** (a) + (b) + (c) + (d) are jointly inconsistent. **The culprit is (a) + (b).** Assuming the conditional is a proposition *and* its probability always equals conditional probability forces the space to trivialize under (c) and (d).

  ### Non-Requirements (Prejudices & Optional Preferences)
  5.  **Compositionality (Embedding):** *Not* a strict requirement.
      *   **Reason:** Natural language indicative conditionals rarely embed cleanly within complex Boolean compounds or other conditionals in ways demanding a unified probabilistic truth-functional semantics ("If (if A then B) then C" is marginal at best). Requiring this *presupposes* the conditional expresses a proposition (a), which we know causes trouble. A theory can sacrifice seamless embedding (like Adams') to satisfy more critical desiderata (1-4). It's an artifact of a truth-conditional starting point.

  6.  **Unified Indicative/Counterfactual Treatment:** *Not* required.
      *   **Reason:** While elegant, the epistemological functions often differ. Indicatives frequently guide action under uncertainty with open antecedents (desideratum 1), while counterfactuals involve hypothetical reasoning about settled pasts. A theory of indicatives can excel without handling counterfactuals, and vice-versa. Forcing unification can distort one or the other.

  7.  **Conditional Bets Replicability:** *Not* a decisive argument against distinct content.
      *   **Reason:** While a bet on *if A, B* settled only if A occurs might *seem* payoff-equivalent to a conditional bet on B given A, the *pricing* behavior and cognitive role differ, especially under desideratum 1 (deliberation). The theory must predict the agent's *quoted price* for the conditional bet, which may not align with P(B|A) if P(A) is unsettled or the suppositional mechanism isn't simple conditioning. Replicability of payoffs doesn't drain the conditional of distinct content or cognitive role; it highlights a possible market inefficiency or different cognitive access.

  ### The Imaging vs. Conditioning Choice & Its Cost
  *   **Imaging** (moving probability mass to the "closest" A-worlds) *can* satisfy desiderata 3 (Near-Miss) and partially satisfy 4 (Suppositional Coherence, often equating P(Stalnaker Conditional) with imaged probability). It inherently avoids the triviality trap by abandoning strict truth-conditionality for the conditional (relaxing a).
  *   **Cost:** **Path-Dependence & Non-Commutativity.** Imaging does not commute with standard conditioning. Updating on C *then* imaging on A yields a different result than imaging on A *then* updating on C. This violates the principle that the order of acquiring *truthful* information should not affect the final belief state when learning sequences are compatible. Imaging is fundamentally a *revision* mechanism for hypotheticals, not a general *updating* mechanism for evidence. This makes it messy for iterated belief change involving both evidence and supposition.

  ### Which Desiderata Exclude the Most Candidates?
  *   **Most Exclusionary:** **Desideratum 1 (Probability Under Uncertainty / Deliberation).** Most popular accounts (Stalnaker, Adams, pure conditional probability) stumble here. They either require a defined P(A) or struggle to model the credence in the conditional *before* the agent commits to P(A).
  *   **Most Often Quietly Dropped:** **Desideratum 2 (Scoring Alignment)** is often ignored in philosophical treatments but is paramount for forecasting. **Desideratum 4 (Suppositional Coherence - Adams' Thesis)** is frequently sacrificed or heavily modified (e.g., only for non-nested, non-embeddable conditionals) by theories embracing truth-conditions (Stalnaker) or primitive conditional probabilities (Popper, Rényi) to avoid triviality.

  ### Summary of Key Trade-offs
  An adequate theory must handle **deliberation** (unsettled P(A)), align with **scoring practices**, and assign probabilities to **near-misses** (P(A)=0). To avoid triviality, it **must reject** the joint insistence that the conditional is a standard proposition *and* its probability equals conditional probability. **Compositionality and counterfactual unification are optional.** **Imaging** offers a path for near-misses and Stalnaker conditionals but introduces **path-dependence** violating commutativity of updating. The **deliberational case** is the hardest nut to crack and excludes the most theories. Prioritize what agents *do* with conditionals (decide, forecast, evaluate near-misses) over logical neatness.
