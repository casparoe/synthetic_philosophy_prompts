answer: |-
  The smallpox endgame provides qualified support for lexical threshold negative utilitarianism (LTNU) by demonstrating the non-negotiable prioritization of preventing severe suffering, but simultaneously exposes critical limitations in the theory's ability to guide practical decisions when confronting tail costs, risk, and termination points.

  **1. Tail Discipline:**  
  LTNU mandates the endgame: if smallpox inflicts suffering below the lexical threshold (e.g., acute agony, blindness), preventing even one case is lexically prior to any quantity of ordinary medical benefits. The rising cost per case is irrelevant under strict LTNU; the campaign *should* spend "without limit" until eradication. The cessation before destroying virus stocks, however, reveals a gap. LTNU offers no principled reason to stop here. It either demands indefinite spending to eliminate the residual risk (which wasn’t done) or falls silent. This isn’t incoherence but incompleteness: LTNU dictates absolute priority to *preventing* threshold suffering but lacks guidance on *securing* that prevention once achieved or when facing irreducible risks. The stopping point reflects practical/political constraints, not LTNU logic.

  **2. The Bearer Question:**  
  LTNU requires the threshold to apply to **moments or discrete episodes of suffering**, not whole lives. Smallpox causes specific, intense suffering (e.g., the acute febrile phase, scarring pain, corneal ulceration leading to blindness) that clearly falls below the threshold, irrespective of a survivor’s overall worthwhile life. If the threshold applied only to whole lives, smallpox eradication might not qualify, as many survivors adapt and find fulfillment. Shifting the bearer undermines the case for LTNU: a "life-level" threshold makes the immense cost of chasing the last cases seem disproportionate, as lives weren’t rendered lexically negative. The moment/episodic bearer is essential for LTNU to justify the endgame.

  **3. The Risk Version:**  
  This is a severe challenge for LTNU. A one-in-a-million chance of threshold suffering *should* be lexically prior to any finite sum of ordinary happiness under strict LTNU. Preventing vanishingly small risks of smallpox resurgence would then absorb infinite resources, paralyzing other health efforts. Denying lexical priority to small risks creates a de facto exchange rate: society accepts some probability of threshold suffering to allocate resources elsewhere. This smuggles commensurability in via probability, collapsing the lexical wall. LTNU struggles here; it either demands absurd over-investment in minute risks (a reductio) or must incorporate probabilistic thresholds (undermining its core claim of lexical priority).

  **4. Commensurability in Practice:**  
  Your reading holds. Practitioners treated "smallpox eradication" as a categorical goal (effectively lexically prior) and *then* used cost-effectiveness to choose strategies (surveillance/containment over mass vaccination). No common currency between eradication and other goods was needed; commensurability was applied only *within* the fixed goal. This shows lexical priorities can operate pragmatically without resolving the philosophical commensurability debate. The case doesn’t vindicate full commensurability; it shows a lexical goal can be pursued with commensurate means.

  **Conclusion:**  
  The endgame is strong evidence for LTNU’s core principle – the absolute priority of preventing acute, severe suffering – justifying extreme efforts to eliminate smallpox. However, it acts as an anomaly LTNU must absorb, exposing unresolved tensions: its silence on rational termination points, vulnerability to the bearer definition, and incoherence when applied to probabilistic harm. The case validates the intuition behind LTNU while highlighting its impracticality as a complete decision framework, particularly concerning tail risks and costs.
