  ### Ghazal on Indicative and Counterfactual Conditionals  

  If the drawer slid open, D was shortlisted then.  
  Yet R was hired in June—it happened anyway.  

  Had the drawer been freed, the file been read,  
  D stood atop the list—it happened anyway.  

  If D was shortlisted, the committee split.  
  Still R took the post—it happened anyway.  

  Had D been chosen, the vote torn in two,  
  The dean reclaimed the search—it happened anyway.  

  If the vote divided, the dean voided all,  
  Then R received the call—it happened anyway.  

  Had the split occurred, the dean reset the quest,  
  I never pulled the drawer—it happened anyway.
