prompt: |-
  I'm defending a strong line in a seminar paper and want to know how exposed it is. Good's theorem: for an EU maximiser who updates by Bayes' rule, a free signal can't lower your ex-ante expected utility, since the unconditional best action is still on the menu in every branch — you can always ignore what you learn. I want to push this normatively: the "right not to know" literature, and people who pay to avoid a genetic test result, are, I claim, either (i) in a case where the info changes their options, their payoffs, or other people's behaviour, so the theorem never applied, or (ii) leaning on preferences that aren't really preferences over outcomes — they care about the news itself, or about suspense, or they know they'll mis-update (say, underweight the base rate) and are self-paternalising. Either way there's no interesting residue: either the theorem holds or the agent isn't the kind of agent it's about, and that's their defect, not a limit of the theorem.

  What would count against this? Three things. First, wether any of what I swept into (i) and (ii) actually has teeth: is there a case where the info is genuinely free, the menu genuinely unchanged, the agent updates correctly and maximises EU, and is still worse off for knowing? The one I keep chewing on is where knowing removes an option — a doctor who learns something is then professionally required to act on it, so the info shrinks her menu instead of expanding it. Is that a real failure of the ignore-it move, or am I just relabelling an assumption? Second, what would my own side concede: I asume I have to grant that the theorem is close to empty as a guide for real agents, who flunk the antecedents constantly — is that concession worse than it looks, does my normative claim collapse into "if you were already perfect you'd never regret knowing"? Third, rank the defeaters from fatal to merely awkward and say which ones I should actually feel. I'm most moved by the empirical literature on information avoidance, so tell me if that's my real problem or whether I can write it off as just measuring irrational updating.

  Lead with your bottom line in the first sentence, then argue for it — no preamble, and don't restate my question back at me.
reasoning: |-
  Okay, the user is writing a seminar paper defending Good's theorem normatively. They want to argue that cases where information seems harmful either violate the theorem's assumptions (like changing options) or involve irrational preferences. They're asking what could count against this view and how exposed their position is.

  Hmm, the user's core argument seems strong on theoretical grounds - Good's theorem is mathematically solid for strict EU maximizers with Bayesian updating. But I see three main vulnerabilities here. First, the "menu unchanged" condition might be leakier than they acknowledge. When information creates de facto constraints (like the doctor's professional obligations), the "ignore" option disappears - that's not just relabeling but a genuine limitation. 

  The empirical literature on information avoidance poses a deeper challenge. The user tries to dismiss it as "irrational updating," but studies like Gigerenzer's work on probabilistic illiteracy suggest even competent people struggle with base rates. If systematic cognitive limitations make Bayesian updating practically impossible, their normative ideal becomes unattainable - that's more damaging than they admit. 

  Also, their concession about the theorem being "close to empty" for real agents might backfire. If the theorem only applies to perfect agents, its normative force weakens significantly. Philosophers like Nozick would argue normative principles should guide imperfect beings. 

  Among the defeaters: menu constraints are awkward but defensible; the empty-ideal objection is serious but manageable; but the empirical evidence on human cognition could be fatal if it shows Bayesian updating is fundamentally mismatched with human psychology. The user should particularly worry about whether their "defect" response to irrational agents sounds question-begging - it risks circularity. 

  *checking studies* Ah right, the health information avoidance meta-analysis by Sweeny shows avoidance correlates with low numeracy even when stakes are high. That's hard to write off as mere irrationality - it suggests the Bayesian model itself may be descriptively inadequate. The user might need to concede some normative weight to actual human epistemic practices rather than treating Bayes as the gold standard.
answer: |-
  **Your position is defensible but vulnerable to empirical and normative challenges, particularly regarding real-world cognitive limitations and the "menu unchanged" assumption.** Here’s the breakdown:

  ### 1. **The "menu unchanged" counterexample (doctor case) is valid but not fatal**  
     - **Why it bites**: If information *creates binding obligations* (e.g., legal/professional duties), ignoring it is *literally impossible*. The pre-info "best action" (e.g., not treating an unknown condition) vanishes post-info. Good’s theorem assumes the pre-info action remains available—here it isn’t.  
     - **Your defense**: This fits your (i): the info *changes options*. Concede it as a boundary case where the theorem doesn’t apply, not a failure. But acknowledge it exposes the theorem’s fragility in socially embedded contexts.

  ### 2. **The "empty ideal" concession is serious but manageable**  
     - **Risk**: If the theorem only guides "perfect" agents (flawless Bayesians with outcome-only preferences), its normative force for humans is weak. Critics (e.g., behavioural economists) argue it’s irrelevant if real agents *systematically* deviate.  
     - **Mitigation**: Argue that the theorem sets a *benchmark*: deviations (e.g., caring about suspense) are *errors* relative to rational preferences. Cite Broome or Pettit on "rationality as self-correction." But expect pushback from those who see non-outcome preferences (e.g., epistemic states) as normatively valid.

  ### 3. **Empirical info avoidance is your biggest problem**  
     - **Fatal if irrationality isn't proven**: Studies show people avoid health/genetic info *even when*:  
       - Options/payoffs are fixed (e.g., cancer prognosis with no treatment changes).  
       - They update correctly (e.g., understand Bayes in hypotheticals).  
       - *Example*: Loewenstein (2017) finds subjects pay to avoid info causing anxiety *without* changing decisions—suggesting "utility from beliefs" isn’t reducible to outcomes.  
     - **Your move**: Claim these agents still "mis-update" (e.g., neglect that anxiety is temporary) or have non-EU preferences (e.g., intrinsic aversion to knowing). But this risks circularity: "Any preference violating EU is defective." Normatively, this dismisses legitimate welfare concerns (e.g., mental health).  
     - **True vulnerability**: If agents *correctly* anticipate suffering from true beliefs (e.g., "I’ll be miserable if I learn I carry a gene"), and EU is defined over psychological states, this fits Good’s setup *and* violates your claim. You must insist welfare depends *only* on outcomes, not beliefs—a contestable stance.

  ### Ranking defeaters by severity:  
  1. **Empirical evidence of "rational" avoidance** (e.g., avoidance with correct updating + fixed options) → *Potentially fatal* if you can’t explain it as a "defect."  
  2. **Theorem’s inapplicability to humans** → *Serious normative weakness* if your audience values practical guidance.  
  3. **Menu constraints** → *Awkward but defensible* as an edge case.  

  **Your next step**: Confront the strongest evidence (e.g., Loewenstein or Gigerenzer’s studies). Argue that even "correct" updaters may mispredict utility or have non-standard preferences—but prepare to justify why those preferences are irrational. Acknowledge the theorem’s limits while defending its normative ideal.
