prompt: |-
  I sit on the four-person scientific review panel of the Larkspur Trust's Confirmation Grants — small awards, around £90,000, intended to fund work that puts an existing theory to a test it was not built to pass — and I have to circulate a draft decision memo to the others by Wednesday night for a Thursday vote. We are ranking two proposals, and because the same structure will recur every cycle we also want to settle, in writing, how much credit a theory should get for evidence that was already in hand when the theory was constructed. I have exactly one graduate seminar in philosophy of science behind me and have been re-reading my notes on Bayesian confirmation, so I know enough to recognise that our disagreement is really a formal one — I gather this is what philosophers call the problem of old evidence — and not enough to trust my own answer; I have changed my mind three times since Friday.

  The two proposals: Proposal A comes from a group modelling why some heavily fished populations fail to rebound after fishing stops. They built their model by fitting it to a forty-year survey of a well-known stock that collapsed in the early 1990s and never recovered, and the fit has one striking feature — the same parameter value that reproduces the collapse also reproduces an apparently unrelated change in the age structure of the catch in the decade before it, a connection nobody in the field had drawn. What they want the money for is a genuinely new test: a specific early-warning signature they predict will appear in a different, currently monitored stock about three years before that stock hits its modelled tipping point. Two wrinkles: they have already looked at the first two years of that monitoring series to check data quality, so the prediction is arguably only partly new; and Proposal B, from a separate group, is a model published before the relevant survey data were released, which predicted the qualitative pattern and has now been confirmed, with the money requested to test a sharper second consequence. One panellist, Marisol, says A's fit to the old dataset is worth exactly zero on any Bayesian accounting, because the data were known when the model was built, so its probability was already one and no amount of fitting can raise the theory's probability; on her view we should fund B and nothing else. Another, Dev, says that is a reductio rather than a result — that a formalism which gives forty years of data, including that structural coincidence, no weight whatsoever has stopped describing confirmation — and that old and new are matters of degree anyway, as the data-quality inspection shows. Our chair has floated a compromise she calls the hindsight surcharge: count accommodated evidence, but at half weight. Once you try to write that down, though, it forks, and this is where I get lost: you can temper each piece of accommodated evidence's likelihood ratio separately and then multiply, or you can halve the total shift in log-odds that the whole body of evidence produces, and those two procedures come apart when the collapse pattern and the age-structure coincidence are treated as separate items — they can even disagree about which way the halving bites. A third option on the table is a recording rule Dev likes: before reviewers are shown how the fit came out, they write down how surprising the pattern would have been under the best rival model, and the panel scores the theory using that recorded surprise instead of their post-hoc impression; Marisol's objection is that this measures reviewers' powers of imagination and can be gamed by how a proposal is framed.

  Please draft the decision memo I will circulate: it should recommend, with reasons, which proposal to fund (or how to split the money between them), what convention the panel should adopt in writing for evidence that was already known when a theory was built — including which version of the surcharge, if any, and how to treat partly contaminated predictions — and how the unification of the two regularities in Proposal A should figure in the scoring. Give the strongest argument for whatever option you are not recommending its due rather than setting it up to lose; I want Marisol and Dev both to feel the memo has taken them seriously. Please write it as exactly five numbered items, each one or two sentences long, with no preamble, no heading and no sign-off.
reasoning: |-
  Hmm, the user is part of a scientific review panel for the Larkspur Trust's Confirmation Grants. They need to draft a decision memo by Wednesday night for a Thursday vote. The memo must address how to handle evidence that was already known when a theory was built (the problem of old evidence in Bayesian terms), and decide between two proposals: Proposal A and Proposal B.

  Proposal A involves a model built using a 40-year dataset of a collapsed fish stock, with the interesting feature that the same parameter value explains both the collapse and an unrelated change in age structure. They want funding to test a new early-warning signature on a different stock. However, they've already looked at the first two years of data, so it's partially contaminated. Proposal B has a model that predicted a qualitative pattern before the data was released and was confirmed, and now seeks to test a sharper consequence.

  There are disagreements among the panelists: Marisol argues that since Proposal A's data was known when building the model, it provides zero Bayesian confirmation (probability was already 1). Dev disagrees, saying that ignoring 40 years of data including the structural coincidence is unreasonable. The chair proposed a "hindsight surcharge" where accommodated evidence counts at half weight, but there are two versions: tempering likelihood ratios separately or halving the total log-odds shift. A third option is a recording rule where reviewers note surprise before seeing the fit, but Marisol worries about gaming.

  The user wants the memo to recommend which proposal to fund (or how to split), establish a convention for old evidence (including which surcharge version), address partly contaminated predictions, and explain how the unification in Proposal A affects scoring. They also want strong counterarguments presented fairly so Marisol and Dev feel heard.

  I need to structure this as exactly five numbered items, each one or two sentences long, with no preamble, heading, or sign-off. The memo should be concise and decisive.

  For the recommendation, I think Proposal B should be funded because it has a pure predictive success with no contamination issues. Proposal A has merit but the partial contamination of its new test weakens it, especially when we're establishing standards. This avoids rewarding accommodated evidence too much.

  For the convention on old evidence, I'll recommend the hindsight surcharge with the total log-odds halving approach. It's practical and avoids complications with treating evidence as separate items. The recording rule has issues as Marisol pointed out.

  For unification in Proposal A, it should be acknowledged as a strength in model evaluation but not in confirmation scoring for old evidence, since Bayesian rules apply strictly there.

  For contaminated predictions, they should be discounted proportionally to the contamination. So for Proposal A, since two out of three years are unseen, it gets partial credit.

  I'll include counterarguments: Marisol's view that old evidence shouldn't count at all is technically correct in strict Bayesianism, but impractical. Dev's point about unification is valid for model quality, but not for confirmation scoring.

  This balances all perspectives while moving toward a decision. The memo will be fair, clear, and action-oriented.
answer: |-
  1.  Fund Proposal B in full, as it presents an uncontaminated novel prediction (the sharper second consequence) following a genuine pre-registered success, whereas Proposal A's key new test is partially compromised by prior data inspection, making B the clearer benchmark for confirmation under our nascent policy.
  2.  Adopt the hindsight surcharge convention: discount the *total* log-odds shift from accommodated evidence by half when scoring theories, as halving each likelihood ratio separately risks double-discounting unified explanations like Proposal A's collapse-and-age-structure fit and introduces unnecessary complexity.
  3.  Treat partly contaminated predictions (like Proposal A's 3-year forecast where 2 years were seen) by discounting their evidential weight proportionally to the contamination; here, A's prediction would warrant only one-third credit if confirmed.
  4.  While Proposal A's unification of the collapse and age-structure patterns is scientifically valuable for model elegance and parameter constraint, it does not increase the Bayesian confirmation derived from that *old* data itself, which remains discounted per the surcharge; its value lies in model assessment, not additional probability boost.
  5.  Marisol is correct that strict Bayesianism assigns zero confirmation to old evidence, making discounting necessary; Dev is right that ignoring unification entirely feels scientifically incomplete, but the discount targets confirmation *degree* while unification remains relevant for model selection if theories are otherwise close.
