  - Medium level (narrative structure): Viewer experience is literally Orwellian - later scenes rewrite earlier memories. But crucially, the *truth* exists in the chronological timeline inaccessible to viewers. 
  - Macro level (Sammy/Life story): This mirrors Dennett's indeterminacy most closely - we can't know if Leonard's past is being rewritten (Orwellian) or if his identity was always this fiction (Stalinesque). The film denies us access to the "real" timeline.

  The rewatch test is fascinating. On first viewing, Teddy's revelations feel shocking - suggesting our initial experience was "unrevised." But rewatching, we can't access that initial naive state; the revised understanding overwrites it completely. This perfectly embodies Dennett's claim about the unrecoverability of pre-revision states. 

  Where the analogy strains: The film's hidden chronological order implies an objective timeline (the "director's cut"), which Dennett rejects. Also, Leonard's tattoos function as externalized memory - a material correlate the brain lacks. 

  What the film adds: It forces us to *feel* the horror of indeterminacy through Leonard's existential vertigo. Philosophy argues it; the film makes it visceral. 

