prompt: |-
  I've been reading about transcendental arguments for a seminar and I keep feeling like I don't know what I'm supposed to be asking of one — everyone scores them with a different rubric and nobody says which rubric they're using. So before I read any more of them I want the spec.

  My rough picture, correct it if it's off: a transcendental argument starts from something about us — that we have experience at all, that we can identify and re-identify objects over time, that we can even formulate a doubt — and argues that some further claim is a necessary condition of that, so that the claim gets a necessity ordinary empirical arguments can't deliver. Usually pointed at some skeptic. Is that roughly the thing?

  What I actually want: the list of requirements an adequate transcendental argument has to meet — the cases it has to handle, the distinctions it can't collapse, the moves it isn't allowed to make — with the consideration behind each, plus your view on which are non-negotiable and which are just one camp's prejudices. I care much more about the list than about scoring particular arguments.

  Things I've seen people demand that I can't tell apart as real requirements vs. tribal preferences:

  - the starting point has to be something the skeptic themself grants (and does "grants" mean they beleive it, or that they're committed to it just by raising the doubt?)
  - it has to be fully a priori, no empirical premise smuggled in
  - the conclusion has to be about the world, not merely about what we're constrained to believe
  - the necessity has to be real necessity, not just "we can't picture it otherwise"
  - it can't quietly lean on verificationism
  - it has to rule the skeptical alternative out, not just make it look unappealing
  - it shouldn't be reducible to inference to the best explanation with an a priori sheen on top
  - the same argument shape should generalize — external-world skeptic, other minds, the Humean about induction — instead of being custom-built for one adversary
  - and I don't only mean the anti-skeptical ones: some conclude something about the self, or about what's constitutive of agency or judgment. Does one list cover those too?

  Two worries I want handled head-on. I'm naming them so we can refer back:

  "Modal laundering" — the step from "we cannot but take P to be true" (or "you couldn't so much as raise that doubt unless P") to "P is true," or worse to "P is necessarily true." Something has to do the work in the middle: what would count as an acceptable bridge and what's just a handshake? Is the bridge ever more than a verificationist principle in disguise? And does it change if the conclusion is read as being about our conceptual scheme rather than about mind-independent reality?

  "Adversary relativity" — is it a defect if an argument works against only one skeptic, or is a transcendental argument that worked against every skeptical scenario at once necessarily cheating? My hunch is that the "generalize to all adversaries" requirement quietly kills more otherwise decent arguments than any other, but I'm not sure.

  Also: does the list change with what the argument is *for*? I can think of at least three jobs — actually refuting the skeptic, showing the doubt is unmotivated or idle, and just making explicit what some discourse or practice already presupposes. I'd guess the first job makes the set of requirements jointly unsatisfiable and the second makes it satisfiable; I want to know where the break falls and which requirement you'd drop first.

  If some subset genuinely can't be satisfied together — either because of the classic "you've only shown we must believe it, not that it's true" objection, or because the premise set a skeptic will grant is never rich enough to yield a substantive conclusion — say so explicitly and show the squeeze. That's the part I most want to see.

  Then, cheaply, two lines each: how Kant's transcendental deduction and the Strawson-style arguments from identification do against your list. I'll build the real scorecard myself. Table or list, whatever's clearer.
reasoning: |-
  Okay, let me unpack this user's query. They're clearly deep into transcendental arguments (TAs) for a seminar but feeling lost in the methodological weeds. The core frustration: everyone evaluates TAs differently without stating their criteria. They want a "spec sheet"—a clear breakdown of what makes a TA philosophically valid, stripped of tribal biases.

  First, their rough understanding seems solid: TAs start from uncontestable features of experience/cognition and argue for necessary conditions, often anti-skeptical. But they're drowning in conflicting demands from secondary literature. I need to validate their confusion—this *is* a messy field—while giving structural clarity.

  Key pain points they raise:
  - **Modal laundering**: How does "we must believe P" become "P is true"? This is THE Achilles' heel of TAs.
  - **Adversary relativity**: Must a TA work against all skeptics? (I suspect not—different skeptics grant different premises.)
  - **Job-dependent criteria**: Refuting vs. exposing idle doubt vs. explicating presuppositions likely require different standards.

  Their listed "demands they've heard" are a mix of legitimate and parochial. Time to triage:
  - Non-negotiable: Avoiding verificationism, true necessity (not psychological), and not smuggling in empirical premises. These guard against fatal flaws.
  - Negotiable: "Conclusion about world not belief" depends on the argument's goal—Kant might settle for "experience-constituting reality," which isn't naïve realism.
  - Tribal: "Generalize to all skeptics" is unrealistic—Humean induction skeptics vs. external-world skeptics play by different rules.

  For the modal laundering problem, I'll emphasize the *transcendental conditional*: If experience exists, then P must hold. But bridging to P's *truth* requires additional commitments (like experience being veridical *as such*). This is where Strawson diverges from Kant.

  On adversary relativity: A good TA should work against *its target skeptic*. A "global" TA would be question-begging. Customization is a feature, not a bug.

  The "squeeze" they want: Yes, a *refutational* TA is nearly impossible because skeptics won't grant enough premises. But *presupposition-exposing* TAs can succeed—they shift the burden ("You're already committed to P by doubting").

  Quick Kant/Strawson scoring:
  - Kant: Hits most criteria but "conclusion about world" is nuanced—it's about world*ly* objectivity, not "world-in-itself." Modal bridge is robust (via transcendental idealism). Doesn't generalize to all skeptics (intentionally).
  - Strawson: More modest. Avoids idealism but leans on "we can't conceive otherwise," risking modal laundering. Best for exposing skepticism's idleness, not refuting it.

  User's depth impresses me. They've spotted the field's fault lines. My reply should honor that rigor while demystifying the chaos.
answer: |-
  Below is a distilled "spec sheet" for transcendental arguments (TAs), organized by core requirements, negotiable criteria, and context-dependent factors. I'll address your worries ("modal laundering" and "adversary relativity") explicitly, then score Kant and Strawson. **The non-negotiable requirements are bolded**; others depend on the argument's aim or philosophical commitments.

  ---

  ### **The Spec Sheet: Requirements for Transcendental Arguments**
  #### **Non-Negotiable Requirements** (Failure here invalidates the TA)
  1. **Necessity Must Be Genuine, Not Psychological**:  
     - **Requirement**: The necessity in "P is a necessary condition of Q" must be *logical*, *conceptual*, or *metaphysical*—not merely "we can't imagine otherwise."  
     - **Why**: Psychological unavoidability (e.g., "humans can't picture chaos") doesn’t entail truth. Collapsing this distinction reduces TAs to anthropology.  
     - **Squeeze**: If necessity is merely contingent (e.g., evolutionarily hardwired belief), the TA fails.

  2. **No Verificationism Smuggled In**:  
     - **Requirement**: The argument cannot implicitly assume that "unverifiable claims are meaningless" or "truth = justified assertibility."  
     - **Why**: Verificationism is contentious and reduces TAs to pragmatic or semantic theses. A TA must work without it.

  3. **Premises Must Be Dialectically Secure**:  
     - **Requirement**: The starting point (Q) must be something the *skeptic grants or is committed to*, not merely "believes." Commitment arises from the act of doubting/reasoning (e.g., "I doubt X" commits you to having a concept of X).  
     - **Why**: If the skeptic rejects Q, the TA is question-begging. "Grants" = *pragmatically committed* by their stance.  
     - **Squeeze**: Radical skeptics (e.g., global doubters) grant almost nothing—so refutational TAs targeting them often fail.

  4. **No Empirical Premises**:  
     - **Requirement**: All premises must be *a priori* (e.g., about the structure of experience, thought, or language).  
     - **Why**: TAs aim for necessity stronger than empirical induction. If "Q" is empirical (e.g., "we observe objects"), the argument collapses into science.

  #### **Negotiable Requirements** (Depend on the TA's purpose)
  5. **Conclusion About World vs. Belief**:  
     - **Requirement**: Some demand the conclusion (P) must be *ontological* (about reality), not just *doxastic* (about what we must believe).  
     - **Why Non-Negotiable for Refutation?**: To refute skepticism, P must be true. But for other aims (e.g., exposing presuppositions), doxastic conclusions suffice.  
     - **Tribal Preference**: Continental/Strawsonian TAs often accept doxastic conclusions; Kantian TAs push for ontological ones via idealism.

  6. **Generalization Across Skeptical Targets**:  
     - **Requirement**: Some insist a TA must work against multiple skeptics (e.g., external world, other minds, induction).  
     - **Why Negotiable?**: Skeptics grant different premises (e.g., Hume grants regularity; global skeptics grant nothing). A TA targeting one skeptic (e.g., external world) can be valid without generalizing.  
     - **Adversary Relativity Insight**: Forcing generalization leads to underpowered "one-size-fits-all" TAs. Customization isn't a flaw.

  7. **Ruling Out Skeptical Alternatives**:  
     - **Requirement**: Must show skeptical scenarios are *impossible*, not just implausible.  
     - **Why Context-Dependent?**: For *refutation*, ruling out is key. For *exposing idleness* (e.g., "doubt is empty without P"), showing incoherence suffices.

  #### **Common Pitfalls to Avoid**
  - **Modal Laundering**:  
    - **The Problem**: Moving from "We must believe P" to "P is true" requires a bridge. An **acceptable bridge** is:  
      - *Transcendental conditional*: If Q exists (e.g., experience), then P *must actually hold* for Q to be possible—not just "believed."  
      - **Unacceptable**: Verificationism ("if we must believe it, it's true") or psychologism ("we evolved to believe it").  
    - **The Fix**: Anchor P in the *conditions for Q's intelligibility*. E.g., "Doubt requires concepts; concepts require a stable world."  
    - **Conceptual Scheme vs. Reality**: If P is about our scheme (e.g., "causality is a category"), laundering is avoided—but anti-skepticism weakens.

  - **Reduction to Inference to Best Explanation (IBE)**:  
    - **Avoid by**: Focusing on *necessity*, not explanatory virtue. If P is merely "best" (not strictly necessary), it’s IBE, not TA.

  ---

  ### **The "Squeeze": Why Joint Satisfaction Is Hard**
  - **Refuting the skeptic** requires all non-negotiables + ontological conclusion + ruling out alternatives. But **premise scarcity** dooms this: skeptics grant only minimal commitments (e.g., "I think" or "I doubt"). From this, you can't derive substantive ontology without modal laundering or verificationism.  
  - **Workaround**: Shift goals. Most viable TAs:  
    - **Expose idleness**: Show skepticism *presupposes* P (e.g., "doubt requires a world to doubt about").  
    - **Explicate presuppositions**: Show P is necessary for a practice (e.g., agency requires freedom).  
  - **Break Point**: Drop the "ontological conclusion" requirement for non-refutational TAs. This makes satisfaction possible.

  ---

  ### **Kant & Strawson: Quick Scores Against the Spec**
  | Requirement                | Kant's Transcendental Deduction (Critique of Pure Reason) | Strawson (Individuals, Ch. 1) |
  |----------------------------|-----------------------------------------------------------|--------------------------------|
  | **Genuine necessity**      | Pass: Categories are necessary for experience.            | Weak: "We can't conceive otherwise" risks psychologism. |
  | **No verificationism**     | Pass: No appeal to verification.                          | Pass: Focuses on conceptual commitments. |
  | **Dialectically secure Q** | Pass: Skeptic grants "experience exists."                 | Pass: Skeptic grants "we identify objects." |
  | **A priori only**          | Pass: Derives categories from unity of apperception.      | Pass: Starts from conceptual analysis. |
  | **Ontological conclusion?**| Qualified pass: P is about *empirical reality* (not things-in-themselves). | Fail: Conclusion is about our conceptual scheme. |
  | **Rules out alternatives?**| Pass: Chaos is impossible for experience.                 | Fail: Only shows skepticism is "idle." |
  | **Generalizes?**           | Fail: Targets Hume (causality), not global skeptics.      | Pass: Applies to objects, selves, etc. |
  | **Avoids modal laundering?**| Pass: P (categories) constitutes objectivity.             | Weak: "We must believe P" → "P is true" needs work. |
  | **Reducible to IBE?**      | Pass: Necessity is strict.                                | Weak: Borders on "best explanation" for our practices. |

  **Verdicts**:  
  - **Kant**: Strongest on necessity/dialectics but relies on transcendental idealism to bridge belief→truth. Fails against global skeptics.  
  - **Strawson**: Avoids idealism but risks psychologism; excels at exposing idleness, not refutation.  

  ---

  ### **Final Note**  
  Your instincts are sharp: **adversary relativity** isn't a flaw (TAs are tools for specific foes), and **modal laundering** sinks many TAs without robust idealism or pragmatism. The "spec" is tighter for refutation (often impossible) than for exposition (viable). Use this grid to test any TA—it covers all types (anti-skeptical, agency, judgment). If you need examples dissected, just ask!
