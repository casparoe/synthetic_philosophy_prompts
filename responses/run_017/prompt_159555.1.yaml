prompt: |-
  A colleague of mine in the department — her field is social epistemology, and she has an irritating habit of filing every story about crowds into "cascade" and "not a cascade" — refuses to say what she means by the word until she has seen the cases; she claims the definition is what you get at the end, from the pattern of rulings. Over about a year of departmental lunches she has given me these. Two identical lunch counters open side by side in a market; the first few buyers scatter, then everyone joins whichever queue is longer, and the other counter closes early — cascade, she says, and she adds that the winner is close to arbitrary and would often be the other counter if you re-ran the morning. A rumour about a contaminant in a popular breakfast cereal spreads through a messaging group; within ten days sales fall by two thirds and the product is suspended, and the rumour is later traced to a single misread lab report — cascade again. Nearly everyone in a country migrating to one messaging app within a year, each migrant explaining that this is where everyone they need to reach already is — not a cascade, she says, that is coordination: what others do changes your payoffs directly, not your beliefs. Every household in a town buying a generator the day before a storm that had been forecast for a week — not a cascade either: one public signal, nothing learned from anyone else. And when I offered the case of junior analysts all rating a stock "buy" while privately thinking it was overpriced, because being wrong on your own is career-ending in a way that being wrong in company is not, she declined to rule: herding, she said, and if you want to count reputational herding as a cascade she will not fight you, but she does not think anybody learned anything.

  I now have a case where the pressure point is different, and I want to predict her verdict rather than ask her, because she is on sabbatical and I have a small bet going with another student about it. It comes from a report on a seed-distribution programme that someone in my development-economics reading group was discussing. A government programme distributed a drought-tolerant maize variety to villages in one district; the trucks reached villages in an order fixed entirely by which roads had been repaired that year, so the earliest recipients were arbitrary, though they happened to sit in the sandier, drier part of the district and harvested noticeably more than their neighbours in the first season. Word moved village to village and within three seasons nearly everyone in the district had planted it. Almost every follower's own first plot did slightly worse than the local variety it replaced, because the new variety only outperforms the local one under water stress and most plots there are low-lying and wet in a normal year; interviewed later, farmers said they switched because everyone around them had, and several said they had attributed their own poor first plot to bad seedbed preparation rather than to the seed. The district then entered a run of dry years which turned out to be a lasting regional shift, not an anomaly; an independent agronomy service eventually confirmed that the new variety genuinely out-yields the local one below a certain rainfall threshold; a neighbouring district with the same soils adopted it four years later purely on the strength of its own trial plots, with no bandwagon at all; and in the original district nobody has gone back to the local variety now that full trial data are public. So: imitation of others' behaviour, private evidence overridden, the crowd vindicated, and the outcome stable and independently rediscoverable.

  My own money is on "cascade," on the grounds that the mechanism looks exactly like the lunch counters, while the friend I am betting with says no, because he thinks the word is reserved for processes that lead people astray and this one landed on the right answer. What I would like from you is the reasoning rather than the ruling: reconstruct the rule or rules she could be running that fit all five of her earlier verdicts equally well, say what each of them predicts about the seed case, which of her earlier rulings is the closest analogy and why that analogy might mislead, what you would actually predict she says and why you prefer that rule, and one further case — the single most discriminating one you can think of — that would separate the surviving candidate rules from each other. I do not need chapter and verse from the literature; I just want to be able to win the bet and, more importantly, to know what the disagreement between my friend and me is really about.
reasoning: |-
  Okay, let me tackle this problem step by step. The user's colleague has a specific way of classifying stories as "cascade" or "not a cascade" based on patterns from cases, without a predefined definition. There are five existing rulings:

  1. **Lunch counters**: People join the longer queue arbitrarily, leading to one closing early. Verdict: Cascade.
  2. **Cereal rumor**: Sales drop due to a false rumor. Verdict: Cascade.
  3. **Messaging app migration**: Everyone switches because others are there. Verdict: Not a cascade (coordination).
  4. **Generators before storm**: Everyone buys based on a public forecast. Verdict: Not a cascade.
  5. **Stock analysts**: All rate "buy" despite private doubts. Verdict: Herding (not ruled as cascade).

  Now, the new case involves maize adoption. Farmers switch because others did, overriding their own poor initial results, but the choice was later vindicated by dry conditions. The user bets on "cascade," their friend says no because it led to the correct outcome.

  First, I need to infer the colleague's implicit rules from the five cases. What patterns define a cascade? Looking at the examples:

  - **Cascade cases (lunch, cereal)**: People ignore private signals/information and follow others. The outcome is arbitrary or incorrect (wrong queue closes; false rumor causes sales drop).
  - **Non-cascade cases (app, generators)**: In the app case, switching is due to direct payoff (coordination), not belief change. In generators, everyone acts on the same public signal (storm forecast), so no social learning.
  - **Herding (analysts)**: Here, actions are driven by reputational risk, not learning. The colleague hesitates to call it a cascade, emphasizing no learning occurred.

  Possible rules:
  1. **Belief update via social observation**: Does seeing others' actions cause people to update their beliefs?
  2. **Override of private signals**: Do individuals disregard their own information?
  3. **Arbitrary/incorrect outcome**: Does the cascade lead to a suboptimal or random result?

  In the lunch case, people ignore their own judgment (which queue is better) and follow the crowd, leading to an arbitrary outcome. In the cereal rumor, people believe the contaminant rumor despite no evidence, overriding private doubts. Both result in incorrect actions.

  In the app migration, people switch because the payoff changes (everyone is there), not because they believe the app is better. No belief update. In generators, the public signal (storm) is the reason; no social influence. The analysts override private beliefs due to career risk, not learning.

  So the core of cascade seems to be: **social learning where individuals discard private information in favor of inferring from others' actions, leading to potentially arbitrary or incorrect outcomes.**

  Now, applying this to the seed case:
  - Farmers see others adopting and switch, overriding their own poor results (private signal).
  - Initially, the adoption seems incorrect (poor yield in normal conditions).
  - However, it was later vindicated by dry years, making it correct.

  The friend argues it's not a cascade because it was correct. But the colleague's cascade examples focus on the *process*, not the outcome. The lunch counter cascade is arbitrary, the cereal cascade is wrong. But could a cascade be correct by luck?

  The key is whether the *mechanism* fits: social learning that overrides private signals. Here, farmers ignored their own poor yields (private signal) and followed others. The outcome being correct doesn't change the mechanism. Analogy: if the lunch counter crowd happened to pick the better queue randomly, it's still a cascade.

  Closest analogy is the lunch counter: both involve following others despite arbitrary starts, overriding private judgment. The cereal case is similar but ended wrong. The seed case ended right, but the *process* of overriding private signals is the same.

  Predict the colleague says "cascade" because the mechanism matches: social learning discarding private info. The outcome being correct is incidental.

  To discriminate further, consider a case where social learning leads to a correct outcome but without overriding private signals. But in the seed case, they did override their own evidence. Alternatively, a case where a cascade occurs but the outcome is correct by luck.

  A discriminating case: **A new restaurant opens. First few diners have mediocre meals (private signals) but keep returning due to social pressure. Others see crowds and infer it's good, ignoring their own doubts. Later, the chef improves, and it becomes excellent.**
  - Here, initial cascade based on weak signals, overriding private doubts, but outcome correct. Should be cascade by mechanism.
  - If the colleague says "not cascade" because it ended well, that would conflict with the seed case logic.

  Final prediction: colleague calls seed case a cascade because the process—discarding private info for social observation—matches, regardless of outcome.
answer: |-
  Based on your description of your colleague's pattern of rulings across the five cases, I'll reconstruct the implicit rules she seems to be applying, predict her verdict for the seed-distribution case, explain why the closest analogy might mislead, and provide a discriminating case to test the rules. The goal is to clarify the disagreement between you and your friend, which hinges on whether the *outcome* (correct vs. incorrect) matters for a "cascade" label, or only the *mechanism* of social learning.

  ### Step 1: Reconstructing the Rules from the Five Verdicts
  Your colleague treats "cascade" as a process where individuals override their private information based on observing others' actions, leading to social learning that can be fragile or arbitrary. Her rulings suggest two core rules, which I'll state plainly:

  - **Rule 1 (Social Learning Overrides Private Signals)**: A cascade occurs when people ignore their own direct evidence or private signals because they infer information from others' actions. This leads to a "belief update" where individuals rationalize away their private information in favor of the crowd's behavior.
  - **Rule 2 (Arbitrary or Incorrect Outcome Not Required)**: The outcome (whether the crowd is "right" or "wrong") is irrelevant to the cascade label. What matters is the *mechanism*: the social learning process itself must involve a sequence where later individuals discount their private signals based on predecessors' choices. Coordination or public signals alone don't qualify.

  **How these rules fit all five cases**:
  - **Lunch counters (cascade)**: People join the longer queue because others did, ignoring their own judgment about which counter might be faster (Rule 1). The winner is arbitrary, but Rule 2 shows the arbitrariness isn't necessary—it just illustrates the fragility.
  - **Cereal rumor (cascade)**: People spread the rumor and avoid the cereal based on others' actions, overriding private doubts (e.g., "I trust my friends more than my own initial skepticism"). The outcome is incorrect, but Rule 2 says correctness doesn't define it—it's about the override mechanism.
  - **Messaging app (not a cascade)**: People switch because "everyone is there," which changes their payoffs directly (e.g., easier communication). No belief update occurs—they don't infer the app is "better," just that it's now more useful. Rule 1 isn't triggered; it's coordination, not learning.
  - **Generators (not a cascade)**: Everyone acts on the same public signal (storm forecast). No one is learning from others' choices—they're all responding identically to shared information. Rule 1 isn't satisfied.
  - **Stock analysts (herding, not ruled cascade)**: Analysts override their private belief ("overpriced") due to reputational risk, not because they learn from others' actions. Your colleague emphasizes "nobody learned anything"—it's about incentives, not belief updates. Rule 1 isn't met.

  **Key insight**: Your colleague's cascade concept is rooted in **informational cascades** from economics/social epistemology (e.g., Bikhchandani et al. 1992), where individuals sequentially abandon private signals to follow predecessors, potentially leading to path-dependent outcomes. Herding (like the analysts) involves similar behavior but is driven by external incentives (e.g., career risk), not belief updates.

  ### Step 2: Predicting the Seed-Distribution Case Verdict
  - **Your bet ("cascade") is correct**: Your colleague will call this a cascade.  
    **Why?** Rule 1 applies directly:  
    - Farmers ignored their private evidence (poor first-plot yields) because they saw others adopting the seed. They rationalized the failure ("bad seedbed prep") instead of trusting their own experience—classic cascade behavior where social observation overrides private signals.  
    - The arbitrary start (road repairs favoring drier villages) and rapid spread via word-of-mouth mirror the lunch-counter case's scattering-then-joining pattern.  
  - **Outcome irrelevance (Rule 2)**: The fact that the crowd was "vindicated" by dry years doesn't matter. Cascades can be "right" by accident (e.g., if the lunch counter crowd happened to pick the better queue). The process—not the outcome—defines it. Your friend is wrong to insist cascades must "lead people astray"; the cereal case did that, but the lunch counter was arbitrary, not necessarily "wrong."

  #### Disagreement between you and your friend:
  - **You** focus on the **mechanism** (social learning overriding private signals), which fits seed adoption perfectly.  
  - **Your friend** focuses on the **outcome** (the crowd was "right"), which is not part of your colleague's implicit rules. The cereal case shows cascades can be wrong, but the seed case shows they can be accidentally right—both are cascades. Your friend is conflating "cascade" with "error."

  ### Step 3: Closest Analogy and Why It Might Mislead
  - **Closest analogy**: Lunch counters.  
    - **Similarities**: Both start arbitrarily (road repairs vs. random early buyers), involve imitation cascading through a population, and override private signals (farmers' poor yields vs. buyers' initial queue choices).  
  - **Why it might mislead**:  
    - The lunch counter outcome is explicitly "arbitrary," while the seed outcome is "vindicated." This could tempt your friend to argue the seed case isn't a cascade because it worked—but that ignores Rule 2. The mechanism is identical: individuals join the crowd despite contradictory private evidence.  
    - The seed case adds complexity (later vindication, independent rediscovery), but your colleague's rules don't care about long-term stability or correctness—only the belief-update process.

  ### Step 4: What Your Colleague Would Say and Why I Prefer This Rule
  - **Prediction**: She says "cascade."  
  - **Why this rule is better**: It consistently explains all five cases based on mechanism alone. Introducing outcome-dependence (as your friend wants) would:  
    - Contradict the lunch counter case (arbitrary ≠ wrong).  
    - Create a gray area—e.g., if the cereal rumor had accidentally been true, would it stop being a cascade? Your colleague avoids this by focusing on process.  
    Your colleague's approach is pragmatic: cascades are defined by the *pattern* of social learning, not outcomes. The seed case fits that pattern perfectly.

  ### Step 5: A Discriminating Case to Test the Rules
  To separate candidate rules, we need a case where the mechanism resembles a cascade but the outcome is correct *and* no private signals are overridden. Here's the most discriminating example I can devise:

  > **The Art Exhibition**: A gallery displays an unsigned painting. The first few visitors, who are art experts, privately recognize it as a lost masterpiece and show visible excitement (e.g., taking photos, lingering). Later visitors, who know little about art, see the experts' behavior and infer the painting is valuable. They also act excited (e.g., crowding around it), but they don't override private signals—they had no prior opinion. The painting is later confirmed as genuine.

  **How this discriminates**:  
  - If your colleague calls this **not a cascade**, it confirms Rule 1 (social learning requires overriding private signals). Here, later visitors had no signals to override—they learned from others' actions but started with "no information." This matches her stock-analyst ruling (no belief update if no private signal exists).  
  - If she calls it a cascade, it might imply that *any* social learning qualifies, which contradicts her coordination case (messaging app) where payoff changes, not beliefs, drove behavior.  
  **Prediction**: She says **not a cascade**—it's "social learning" but not a cascade because later visitors aren't overriding anything; they're rationally using others' actions as informative signals when they lack data. This sharpens the focus on Rule 1: cascades require discarding *contradictory* private evidence.

  ### Summary for Your Bet
  - **You win the bet**: The seed case is a cascade because it matches the mechanism of social learning overriding private signals (like lunch counters and cereal rumors), regardless of the outcome being "correct."  
  - **Why you win**: Your colleague's rules are based solely on the belief-update process, not outcomes. The seed farmers' rationalization ("bad seedbed prep") shows classic cascade behavior.  
  - **The disagreement**: Your friend mistakes cascades for *failures* of collective intelligence, but your colleague sees them as *processes* that can be right or wrong by chance. The discriminating case (art exhibition) helps isolate this by testing whether private signal override is essential.  

  When your colleague returns, you might gently note that her definition aligns with informational cascades in theory—where cascades can be "efficient" if early signals are strong (here, the dry villages' good yields), but still qualify as cascades. For now, collect your winnings!
