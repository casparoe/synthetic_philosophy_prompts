  Here's a joke tailored to your setup, exploiting the unresolvable counterfactual and the expert panel's impossible task:

  **Setup:**  
  At the first annual audit of Metroville's shadow prediction market, the Chair of the Oversight Committee addresses the weary panel of experts who just settled the counterfactual for the "Rejected Policy A: Riverfront Gondolas".  

  **Exchange:**  
  > **CHAIR:** "Dr. Gupta, your report states the panel spent *three weeks* debating whether the gondolas would've boosted tourism or become a pigeon toilet. Yet your final probability estimate was 51.3% positive impact. How did you resolve it?"  
  > **DR. GUPTA:** "Madam Chair, after 400 hours of modeling, we achieved consensus... by realizing we were arguing about *which* dice to roll. We used Councilor Miller's lucky D20."  
  > **CHAIR:** *(Staring at the die)* "And the decimal?"  
  > **DR. GUPTA:** *(Sheepishly)* "We rolled twice."  

  ---

  **Why this works & why it's specific to futarchy:**  
  1. **Exploits the Unresolvable Counterfactual:** The core joke is the panel's surrender to randomness when judging an *unobservable outcome* (the gondolas' unrealized impact). This directly targets the epistemic void Hanson’s shadow market creates—no amount of expertise can verify a "what if?" scenario, reducing "retrospective judgement" to absurdity.  
  2. **Conditional Payoff Structure:** The punchline only makes sense because traders' profits *depend* on this fictional counterfactual being "settled." In regular elections or polls, there's no secondary market requiring experts to divine unrealized realities just to pay out bets.  
  3. **Government’s Dual Role:** The farcical authority of the panel stems from the city charter *mandating* this unprovable judgement to resolve a market it subsidizes—a circular burden exclusive to this mechanism.  

  **Why it wouldn’t fit ordinary systems:**  
  - **Elections:** Losers don’t trigger panels to imagine their hypothetical victory’s consequences for a betting payout.  
  - **Polls:** Opinion surveys measure preferences, not unobservable causal outcomes in alternate timelines. Sabotage jokes (e.g., "I polled badly so I hired pigeons") miss the structural irony of a *government-sanctioned fiction* determining real profits.  

  The humor lies in the system’s tragicomic blindness: it tries to quantify the unknowable to satisfy its own rules, and the experts—meant to be the solution—become prisoners of its design. Good luck with the panel!
