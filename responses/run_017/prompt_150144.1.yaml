              Since the replication was powered to detect 1.5*O, the replication's SE_r is such that 1.5*O is about 2.5 * SE_r (for 80% power). So 1.5*O ≈ 2.5 * SE_r  => SE_r ≈ 1.5*O/2.5 = 0.6*O.
              Then upper bound ≈ 0 + 1.96*0.6*O ≈ 1.18*O, which is greater than 0.5*O. 
          So we do not have evidence of a small effect (the upper bound is 1.18*O, which is above 0.5*O). 
     - Step 5: Consistent and non-significant -> "No verdict" (absence of evidence). 

     This is the outcome the committee didn't want: we cannot say the original is noise. But the procedure says we cannot conclude.

  Finally, we note that the procedure is a guide and the committee must use judgment, especially in borderline cases.
answer: |-
  Below is a step-by-step procedure for evaluating replication studies, designed for clarity, defensibility, and minimal statistical complexity. It addresses your five key questions and includes explicit stopping points ("No verdict," "Kill case," or "Hand to human"). The procedure prioritizes transparency and avoids jargon, focusing on observable facts rather than theoretical debates. It assumes basic familiarity with effect sizes, confidence intervals (CIs), and p-values.

  ---

  ### **Replication Evaluation Procedure: Step-by-Step Questions**
  **Inputs Needed**: Original study’s effect size, original CI, sample size; Replication’s effect size, replication CI, sample size, pre-registration status, and protocol deviations.  
  **Outputs**: "No verdict," "Kill case," or "Hand to human" + rationale for the journal’s decision.

  #### **Step 1: Is the replication a direct test?**  
     - **Check**: Population, procedure, and materials must be ≥90% identical to the original (e.g., same scale, stimuli, recruitment criteria). Minor adjustments (e.g., translating surveys) are acceptable if justified.  
     - **Stop if "no" → "No verdict"**:  
       *Rationale: Not testing the same hypothesis. No further action.*  
     - **Exception**: If original authors claim "hidden moderators" (e.g., "this only works in winter"), reject unless:  
       - (a) Moderator was pre-registered in the replication, or  
       - (b) Moderator is backed by strong prior evidence (e.g., meta-analyses).  
       *→ If unmet, ignore moderator claims and proceed.*  

  #### **Step 2: Was the replication high-quality?**  
     - **Check**:  
       - Pre-registered? (Yes = high quality; No = flag caution).  
       - Protocol deviations? (Minor = acceptable; Major = e.g., changing primary outcome).  
     - **Stop if major deviations → "No verdict"**:  
       *Rationale: Unreliable methods. No further action.*  

  #### **Step 3: Is the replication inconsistent with the original?**  
     - **Method**: Use a **prediction interval** (not CI). Why? Original CIs underestimate variability in replications by ignoring sampling error.  
       - **Simple formula**:  
         `Prediction Interval (95%) = Original effect ± 2.5 × Original SE`  
         *(Derived from standard prediction interval formulas, simplified for usability; see notes below).*  
       - **Compare**: Does the replication effect size fall outside this interval?  
     - **Stop if outside → "Inconsistent"** (proceed to Step 4).  
     - **Stop if inside → "No verdict"**:  
       *Rationale: Replication does not contradict original. Case closed.*  

     *Notes on Q1 (CI vs. Prediction Interval)*:  
     - The prediction interval (PI) is more conservative than CI comparisons. It "inflates" the original’s uncertainty, making it harder to declare inconsistency.  
     - **Which way it cuts**: Using a PI reduces false alarms (e.g., labeling noise as "replication failure"). In your case, it makes the committee *less* likely to "kill" papers.  

  #### **Step 4: Does the replication show evidence of absence?**  
     - **Check only if replication is "inconsistent" (Step 3) and non-significant (p ≥ 0.05)**.  
     - **Method**:  
       - Calculate the **upper bound of the replication’s 95% CI**.  
       - Compare to **50% of the original effect size** (a pragmatic threshold for "too small to matter").  
     - **Stop if upper bound < 50% of original effect → "Kill case"**:  
       *Rationale: Effect is meaningfully smaller than original. Recommend public note.*  
     - **Stop if upper bound ≥ 50% of original effect → "Hand to human"**:  
       *Rationale: Effect might still be practically significant. Committee decides based on context (e.g., clinical relevance).*  

     *Notes on Q2 (Evidence of absence)*:  
     - A non-significant replication with low power (e.g., only powered to detect 80% of the original) is **absence of evidence**.  
     - A replication powered to detect 50% of the original (requiring ~4× sample size; see Q5) and showing an upper CI <50% is **evidence of absence**.  
     - Bayesian framing (e.g., "How much should this move a prior?") is omitted for simplicity but would align with this approach.  

  #### **Step 5: Does publication bias or flexibility affect the original?**  
     - **Check**: Was the original study at high risk of bias?  
       - Small sample (n < 100)?  
       - Just-significant p-value (e.g., p = 0.04)?  
       - Many researcher degrees of freedom (e.g., 5+ outcome variables)?  
     - **If yes → Downgrade the original’s effect size by 30% in Steps 3–4** (e.g., use 70% of reported effect). Why? Meta-analyses show inflation is common.  
     - *Does not change conclusions about replication; only adjusts benchmarks for comparison.*  

  ---

  ### **Evaluation of Your Cases**
  **Case 1 (Your Department’s Multi-Lab Replication)**  
  - Step 1: Direct test (authors consulted; materials matched). → Proceed.  
  - Step 2: High quality (pre-registered; multi-lab). → Proceed.  
  - Step 3:  
    - Original effect = 0.5, original SE = 0.1 → Prediction interval = 0.5 ± 2.5×0.1 = [0.25, 0.75].  
    - Replication effect = 0.05 → Falls outside → **Inconsistent**.  
  - Step 4:  
    - Replication CI = [-0.1, 0.2] → Upper bound = 0.2.  
    - 50% of original = 0.25 → 0.2 < 0.25 → **Evidence of absence**.  
  - **Verdict**: **Kill case** (recommend public note).  

  **Case 2 (Replication by Original Authors)**  
  - Step 1: Direct test. → Proceed.  
  - Step 2: Assume high quality. → Proceed.  
  - Step 3:  
    - Original effect = 0.5, SE = 0.2 → PI = 0.5 ± 2.5×0.2 = [0.0, 1.0].  
    - Replication effect = 0.3 (60% of original) → Falls inside → **No verdict**.  
  - **Stop**: No inconsistency. Literature stands.  

  **Case 3 (Flashy Original, Underpowered Replication)**  
  - Step 1: Direct test. → Proceed.  
  - Step 2: Assume passed (despite "rushed" status). → Proceed.  
  - Step 3:  
    - Original effect = 0.8, SE = 0.4 (n=40) → PI = 0.8 ± 2.5×0.4 = [-0.2, 1.8].  
    - Replication effect = 0.1 → Falls inside → **No verdict**.  
  - **Stop**: Replication does not contradict original. Committee cannot act on suspicions.  

  *Note on Q5 ("Two-and-a-Half Rule")*:  
  - The rule (n_replication ≥ 2.5×n_original and effect <25% of original) is **unreliable**.  
    - In Case 1, it works (your replication had n ~50× original).  
    - In Case 3, n_replication = 1.5×n_original (n=60) would be underpowered and prone to false negatives.  
  - **Better**: Use prediction intervals (Step 3) and evidence of absence (Step 4).  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Not covered**:  
     - Whether to issue an expression of concern, retract papers, or change journal policy.  
     - Whether an effect is exactly zero (vs. small or context-dependent).  
     - Resolving debates about Bayesian priors or "true" effect sizes.  
     - Handling multiple replications (use meta-analysis instead).  
  2. **Limitations**:  
     - **Hidden moderators**: Only accepts pre-registered or strongly justified moderators (prevents rubber-stamping).  
     - **Publication bias**: Only adjusts original effect size (Step 5) but doesn’t override direct evidence.  
     - **Small samples**: Original studies with n < 30 are flagged but not auto-rejected.  

  ---

  ### **Final Output Example**  
  For your draft recommendation, structure a note as:  
  > *"Our committee applied a standardized evaluation (see [brief description of steps]). For Study X, Steps 1–4 indicate the replication was inconsistent and showed evidence of absence (effect <50% of original). We recommend a published Editorial Note. For Study Y, the replication was consistent; no action is needed. For Study Z, results were inconclusive; no action is taken."*  

  This procedure ensures defensibility: It uses conservative methods (PIs, 50% threshold), avoids jargon, and defaults to "no verdict" when evidence is ambiguous. A quantitatively literate reader will recognize it as aligned with replication standards (e.g., Open Science Collaboration, 2015).
