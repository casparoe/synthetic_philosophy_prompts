answer: |-
  Below is a concise decision tree for classifying positions on the units of selection. It starts by resolving the ambiguity you identified (causal bookkeeping vs. design explanations) and uses your cases to force distinctions. Terms are defined inline, and awkward commitments are noted for each leaf. Empty regions and collapses are explained at the end.

  ---

  ### **Units of Selection Decision Tree**  
  *Start at Node 1. Answer questions based on concrete cases (e.g., meiotic drive, transmissible cancer, cultural variants).*

  1. **Is the goal to partition causal influences on gene-frequency change (bookkeeping), or to explain adaptations (design)?**  
     - **Bookkeeping (causal)**: Go to 2.  
     - **Design (functional)**: Go to 9.  

  ---

  #### **BOOKKEEPING BRANCH**  
  *(How does selection change variant frequencies?)*  

  2. **Must a unit be a lineage?**  
     *(Lineage: Entity reproducing with heritability, e.g., transmissible cancer is a lineage; founder groups are not.)*  
     - **Yes**: Go to 3.  
     - **No**: Go to 7.  

  3. **Can selection act at multiple levels simultaneously?**  
     *(e.g., In colonial chimera, both cells and whole colonies may influence change.)*  
     - **Yes**: Go to 4.  
     - **No**: Go to 8.  

  4. **Are group-level traits reducible to aggregates of organism traits?**  
     *(e.g., Worker sterility reduces to individual kin altruism?)*  
     - **Yes**: **Leaf: Kin Selection / Inclusive Fitness**  
       - *Awkward commitment: Must accept that group structure is just a context for individual fitness.*  
     - **No**: Go to 5.  

  5. **Is group fitness defined as group reproduction?**  
     *(e.g., Insect colonies produce new colonies; founder groups do not.)*  
     - **Yes**: **Leaf: Multilevel Selection 2 (MLS2)**  
       - *Awkward commitment: Must show heritable group traits directly affect group reproduction.*  
     - **No**: **Leaf: Multilevel Selection 1 (MLS1)**  
       - *Awkward commitment: Groups are selected indirectly via individual fitness differences.*  

  6. **Can gene-level selection explain all changes?**  
     *(e.g., Segregation distorter allele; locked inversion genome.)*  
     - **Yes**: **Leaf: Strict Gene Selectionism**  
       - *Awkward commitment: Organisms/groups are mere "vehicles" for genes.*  
     - **No**: **Leaf: Weaker Genic Selectionism**  
       - *Awkward commitment: Gene-centric models are just optimal bookkeeping, not causal truth.*  

  7. **Do transient groups cause predictable frequency changes?**  
     *(e.g., Founder groups differ in productivity but don’t reproduce.)*  
     - **Yes**: **Leaf: Trait-Group/Haystack Selection**  
       - *Awkward commitment: Sorting without heritability at group level counts as selection.*  
     - **No**: *(Empty region: No position denies both lineages and sorting. Incoherent without one.)*  

  8. **Does gene-level bookkeeping suffice despite higher-level effects?**  
     *(e.g., Gene drive lowers fitness but spreads; locked genome acts as one unit.)*  
     - **Yes**: Go to 6.  
     - **No**: **Leaf: Organism-Level Selectionism**  
       - *Awkward commitment: Group adaptations are rare/illusory (e.g., worker insects are kin-selected).*  

  ---

  #### **DESIGN BRANCH**  
  *(What are adaptations "for"?)*  

  9. **Can adaptations exist above organism level?**  
     *(e.g., Worker sterility "for" colony benefit? Costly taboo "for" group survival?)*  
     - **Yes**: Go to 10.  
     - **No**: **Leaf: Organism-Level Selectionism** (Same as above.)  

  10. **Is the unit a cohesive "individual"?**  
      *(Cohesive: Division of labor, shared reproduction, e.g., insect colony; marine chimera is not.)*  
      - **Yes**: **Leaf: Group-as-Organism (Major Transitions)**  
        - *Awkward commitment: Groups must function like unified organisms.*  
      - **No**: Go to 11.  

  11. **Is the trait maintained by cultural transmission?**  
      *(e.g., Costly taboo spreads via prestige, not genes.)*  
      - **Yes**: **Leaf: Cultural Group Selection**  
        - *Awkward commitment: Cultural variants must have gene-like heritability.*  
      - **No**: Go to 12.  

  12. **Does the trait affect speciation/extinction rates?**  
      *(e.g., Lineage-level trait with no organism fitness effect.)*  
      - **Yes**: **Leaf: Species/Clade Selection**  
        - *Awkward commitment: Species traits must be "for" species survival, not side effects.*  
      - **No**: **Leaf: Kin Selection / Inclusive Fitness** (Same as Bookkeeping Branch.)  

  ---

  ### **Empty Regions & Collapses**  
  - **Empty region (Node 7, "No")**: Denying both lineages and transient sorting leaves no unit. *Incoherent*.  
  - **Collapse 1: Kin Selection vs. MLS1**. Collapse under *additivity of fitness effects*. If fitness effects are additive, kin selection = MLS1 (verbal).  
  - **Collapse 2: Gene Selectionism (Strict vs. Weaker)**. Collapses if genes are the *only* faithful replicators (substantive; e.g., in meiotic drive).  
  - **Unoccupied region**: Species selection without lineage heritability (e.g., one-off mass extinction). *Unattractive*; no cumulative selection.  

  ---

  **How to use**: Work through cases (e.g., for gene drive, start at Node 1 → Bookkeeping → Node 2 (lineage?) → Node 3 (multi-level?) → Node 6). Positions are mutually exclusive *except* collapses.
