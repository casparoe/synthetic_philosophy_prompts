     * Whether a unit must be a lineage with heritable variation in fitness or if transient groups that sort variants count.
     * Whether selection at a level requires traits not reducible to lower-level aggregates.
     * Selection of groups vs. selection of group-level traits (MLS1/MLS2).
     * Whether one-off sorting events that change frequencies predictably count as selection or drift.
     * Whether gene-level selection is substantive, a modelling convenience, or metaphysical.
     * Whether cultural variants can be units of selection in the same sense as genes.
