prompt: |-
  I sit on the patient-and-family advisory committee of a large regional hospital, and for the last three years I have also been the lay member of the committee that reviews our rules for allocating scarce resources — transplant organs, intensive care beds, and a small fund for drugs that are not on the standard formulary. I have no academic background in philosophy; I have been reading about these questions on my own, and I have reached the point where I can describe what we actually do but cannot say what we are assuming when we do it. I would like you to reconstruct the implicit view for me.

  The core of our rules is severity weighting. When two claims on the same resource are compared, a given health gain to the person who is worse off beforehand counts for more than the identical gain to someone who is only mildly ill. A year of life restored to someone at death's door counts for more than a year restored to someone with a chronic but manageable condition; a bed goes to the sicker patient before the less sick one. Some national systems that do similar cost-effectiveness calculations apply an explicit numerical multiplier to gains accruing to the severely ill; ours does it more informally, as a strong presumption that the sicker patient comes first, defeasible only when the difference in expected benefit is very large. Alongside this, four features of the practice puzzle me.

  First, the tie-break. When two patients are at the same point on whatever severity scale we are using, the tie goes to the one whose severe condition is longest-standing: someone who has been in the worst band for three years outranks someone who entered it last month. The stated rationale was that they have waited longer. One of the physicians on the committee objected that this rewards our own delays and has nothing to do with how badly off either person is right now.

  Second, the currency. A proposal to break ties by looking at how badly off the candidates are overall — poverty, isolation, the general shape of their lives — was voted down on the grounds that, in the chair's words, we treat illness and not social circumstances. So the extra weight attaches to being badly off medically, and not to being badly off in general.

  Third, the reversal. In our surge protocol — the one that would be triggered by a mass casualty event or by a pandemic wave exceeding capacity — the sickest patients are moved into a category that receives essentially nothing, on the ground that they are unlikely to survive even with treatment, while the healthiest are deferred as likely to recover without it. Resources go to the middle band. So sickest-first is abandoned precisely in the situation where it is most consequential, and it is abandoned exactly when being sickest stops predicting that the resource will do any good.

  Fourth, the asymmetry about losses. We have never once counted "this would make a better-off patient somewhat worse off" as a point in favour of a policy, even in the hypothetical case where nobody else gains anything from it at all — no resources are freed, no one is treated sooner, the only effect is a smaller gap. At the same time we routinely withhold cost-ineffective treatments from the mildly ill, and that is counted as a point in favour, but only because it frees money or staff for others. In my reading I have come across the terms prioritarianism, sufficientarianism, egalitarianism, and something called the leveling-down objection, which I gather is meant to embarrass the view that equality matters in itself, by pointing out that such a view would have to count making the better off worse off for nobody's benefit as in one respect an improvement. Nobody on our committee has ever treated that as an improvement.

  So here is what I want. Reconstruct the view that our rules only make sense under: what must we be assuming about whose good matters and how much, for severity weighting, the chronicity tie-break, the restriction to medical badness, the surge reversal, and the refusal to count leveling down all to be sensible at once? Then be discriminating about it. Which of those five features does the view you attribute to us strictly require, which does it merely sit well with, and which does it actually sit badly with? Does the chronicity tie-break really follow from a concern with how badly off someone is, given that badness of condition is presumably measured at a time — or does it smuggle in a different idea altogether, about duration, desert, or waiting? Does the restriction to medical badness sit comfortably with weighting benefits by how badly off the recipient is, or does that weighting, taken seriously, push toward counting everything that makes someone badly off? Does the surge reversal show that the whole practice was never about the worst off as such, but was always a heuristic for how much good the resource can do, which we discard the moment it stops tracking that? And does our refusal to count leveling down prove anything about which view we hold, or is it equally available to several views, and therefore no evidence at all?

  Then tell me where we are underdetermined. Which rival theories would license exactly the rules we have, and is there any decision we actually face that would separate them? And for each rival, tell me concretely which of our rules would have to change if we adopted it instead — I want the difference to show up in the committee's actual decisions, not only in how we describe them. Finally: if we dropped severity weighting altogether and ranked purely by expected health gain, what exactly would we be giving up, and is there an argument, using only premises our own rules already contain, that doing so would be a mistake?
reasoning: |-
  Okay, the user is part of a hospital committee that decides how to allocate scarce resources like organs and ICU beds. They use severity weighting—prioritizing sicker patients—but have some puzzling features in their rules. They want me to reconstruct the implicit ethical view behind their practices and analyze how well each feature fits with that view.

  First, I need to understand their core principle: severity weighting. Giving more weight to health gains for those who are worse off medically. That sounds like prioritarianism, which values benefits more when given to the worse off. But there are nuances in their specific rules that might complicate this.

  Looking at the four puzzling features:
  1. **The tie-break**: When patients are equally severe, the one who's been severe longer gets priority. The rationale is waiting time, but a physician pointed out this might reward system delays rather than current need. Does this align with prioritarianism? Probably not directly. Prioritarianism cares about current state, not duration. This seems more like a fairness or desert consideration—acknowledging prolonged suffering. So maybe it's an add-on, not core to the ethical view.

  2. **The currency**: They only consider medical badness, not overall life circumstances. The chair said they treat illness, not social issues. But if prioritarianism values benefits to the worse off generally, why limit it to medical? This suggests a pragmatic or institutional boundary. The hospital's role is health-focused, so they might be compartmentalizing. But strictly, prioritarianism could argue for including social factors. So this restriction might be more about scope than ethics.

  3. **The reversal**: In surge protocols, they abandon sickest-first and prioritize the middle group. The reason is that the sickest are unlikely to benefit. This makes sense from a utilitarian perspective—maximizing total benefits when resources are extremely scarce. But it conflicts with severity weighting. However, if severity weighting is a proxy for benefit (since sicker patients often benefit more from treatment), then dropping it when it no longer predicts benefit is consistent. So this reversal might show that their underlying goal is maximizing benefit, with severity as a heuristic.

  4. **The asymmetry about losses**: They never consider leveling down (making better-off worse off without helping others) as good. This rejects egalitarianism, which values equality for its own sake. Prioritarianism avoids this because it only cares about improving the worse off, not reducing inequality without benefit. Their refusal fits perfectly with prioritarianism.

  Putting it together, their implicit view seems like **threshold prioritarianism**: prioritizing those below a certain severity threshold, but with a strong focus on medical need and efficiency. The surge reversal shows that benefit maximization is the ultimate goal, using severity as a tool when it correlates with benefit.

  Now, for underdetermination: Other theories could explain their rules. For example:
  - **Rule utilitarianism**: Their rules maximize health outcomes overall. Severity weighting works usually, but surge protocols switch to save more lives.
  - **Sufficientarianism**: They prioritize those below a sufficiency threshold (severe illness). The reversal happens when treating the severely ill won't help them reach sufficiency (survival).

  To distinguish, consider a case where a mildly ill patient could have a huge benefit (e.g., 20 extra years) vs. a severely ill patient with a small benefit (1 extra year). Their current system might still prioritize the severely ill, which fits prioritarianism. If they switched to prioritizing the larger benefit, that would lean toward utilitarianism.

  If they dropped severity weighting, they'd give up giving extra moral weight to the worse off. But their own rules already contain a premise for keeping it: in normal times, severity correlates with benefit, and it addresses fairness to the most vulnerable. Abandoning it might violate their commitment to not neglecting the worst off.

  For the committee member, I should clarify which features are core to their view and which are practical additions. The tie-break and medical focus might be pragmatic, while the surge reversal and rejection of leveling down are consistent with their ethical priorities.
answer: |-
  Based on your detailed description, I'll reconstruct the implicit ethical framework guiding your committee's decisions, analyze how each feature fits within it, identify underdetermination points, and explore alternatives. Your rules suggest a sophisticated hybrid view prioritizing **medical need within a consequentialist framework that incorporates a prioritarian threshold and institutional role constraints**.

  ### Reconstructed Implicit Ethical View: Threshold Prioritarianism with Medical Sufficiency Focus
  1. **Core Principle**: **Severity-weighted consequentialism** — Health benefits matter more when given to the medically worse-off, but only up to a point where treatment is effective. The goal isn't equality *per se* but maximizing morally weighted health gains, with extra weight given to those below a medical sufficiency threshold (e.g., life-threatening illness).  
  2. **Scope**: **Institutional compartmentalization** — The hospital's role is to address *medical* disadvantage, not overall life hardship. Social determinants are acknowledged but deemed outside the institution's mandate.  
  3. **Efficiency Constraint**: **Benefit responsiveness** — Severity weighting applies only when it correlates with significant health gains. If severity no longer predicts benefit (e.g., in surge triage), efficiency overrides.  
  4. **Anti-Leveling Down**: **Asymmetric prioritarianism** — Benefits to the worse-off are prioritized, but losses to the better-off are irrelevant unless they free resources for others. Equality isn't intrinsically valuable.  

  This view blends **prioritarianism** (weighting benefits to the worse-off) with **sufficientarianism** (focusing on lifting people above a medical sufficiency threshold) and **rule-consequentialism** (using severity as a proxy for benefit where feasible).

  ---

  ### Analysis of Your Five Features: Fit with the Reconstructed View
  | **Feature**               | **Strictly Required?** | **Fits Well?** | **Fits Poorly?** | **Key Insight** |
  |---------------------------|------------------------|----------------|------------------|----------------|
  | **Severity Weighting**    | Yes                    | Perfectly      | —                | Core to prioritarianism; gives moral weight to need. |
  | **Chronicity Tie-Break**  | No                     | Weakly         | **Yes**          | Contradicts prioritarianism's focus on *current* state. Smuggles in desert/waiting time fairness. |
  | **Restriction to Medical Badness** | No | **Yes** (pragmatically) | Weakly | Aligns with institutional role, but pure prioritarianism would consider overall disadvantage. |
  | **Surge Reversal**        | **Yes**                | Perfectly      | —                | Shows severity weighting is instrumental to benefit, not absolute. Efficiency dominates when correlation breaks. |
  | **Anti-Leveling Down**    | **Yes**                | Perfectly      | —                | Incompatible with egalitarianism; essential to prioritarianism. |

  **Detailed Explanations**:  
  - **Chronicity Tie-Break**: This **clashes** with the reconstructed view. Prioritarianism cares about current welfare deficits, not duration. By prioritizing longer-standing conditions, you're importing **corrective justice** ("we owe you for past system failures") or **desert** ("more suffering deserves compensation"). This is a pragmatic add-on, not derived from severity weighting.  
  - **Restriction to Medical Badness**: **Pragmatically fits** but reveals a tension. Pure prioritarianism would weight *all* disadvantages (e.g., poverty + illness). Your practice assumes medical badness is the hospital's domain, creating a "separate spheres" approach. It holds only if you accept institutional boundaries trump moral scope.  
  - **Surge Reversal**: **Confirms the view**. Severity weighting isn't abandoned—it's overridden because its instrumental value (predicting benefit) vanishes. The "middle band" represents the cohort where resources yield the greatest *weighted* gains under crisis constraints.  
  - **Anti-Leveling Down**: **Core to the view**. Prioritarians reject equality for its own sake; only improvements for the worse-off matter. Your refusal to worsen outcomes without broader benefit is decisive evidence against egalitarianism.  

  ---

  ### Underdetermination: Rival Theories and Distinguishing Decisions
  Your rules could fit multiple theories. Key rivals and how they'd alter your decisions:  
  1. **Rule-Utilitarianism (Maximize Total Health)**:  
     - **Same Rules?**: Mostly yes, but would oppose chronicity tie-break (no efficiency gain) and *might* weaken severity weighting if mild cases yield larger gains.  
     - **Decision Split**: In a choice between saving one severely ill life (5 QALYs) vs. two mildly ill lives (15 QALYs total), utilitarianism picks the latter; your system likely picks the former due to severity weight.  
     - **Rule Change**: Chronicity tie-break replaced by lottery (fairer randomness).  

  2. **Sufficientarianism (Prioritize Below Medical Threshold)**:  
     - **Same Rules?**: Matches severity weighting and surge reversal (non-viable patients fall below "sufficiency").  
     - **Decision Split**: If two patients are equally severely ill but one is *near* sufficiency (e.g., treatable cancer) and the other far (e.g., terminal dementia), sufficientarianism prioritizes the former. Your chronicity tie-break might ignore this.  
     - **Rule Change**: Tie-breaks consider proximity to sufficiency, not chronicity.  

  3. **Egalitarianism (Minimize Health Inequality)**:  
     - **Same Rules?**: Conflicts with anti-leveling down and surge reversal.  
     - **Decision Split**: Egalitarians might support leveling down (e.g., denying a treatment to a mildly ill patient even if resources aren't reallocated). They'd oppose surge protocols for abandoning the sickest.  
     - **Rule Change**: Chronicity tie-break rejected (irrelevant to equality); surge protocol deemed unethical.  

  **Crucial Test Case**:  
  - **Scenario**: A chronically severely ill patient (3 years in worst band) vs. an equally severely ill patient (newly severe) with *slightly* higher expected benefit (e.g., 1.1x QALY gain).  
  - **Your System**: Chronicity tie-break favors the long-suffering patient.  
  - **Rival Responses**:  
    - Utilitarianism: Favors slightly higher benefit, ignoring chronicity.  
    - Sufficientarianism: Indifferent unless one is closer to sufficiency.  
    - Egalitarianism: Indifferent (current states equal).  
  This decision would isolate your commitment to corrective justice over strict efficiency or equality.  

  ---

  ### If You Dropped Severity Weighting: Costs and Self-Defeat
  **What You Give Up**:  
  - Moral prioritization of the most vulnerable, risking "double disadvantage": those already worst-off being further neglected.  
  - Public trust in the system's fairness, as societies intuitively weight need (e.g., favoring ICU for a car crash victim over a stable patient).  

  **Argument Against Abandonment Using Your Premises**:  
  1. **Premise from Anti-Leveling Down**: You reject harming the better-off *unless it benefits others*. This implies that benefiting the worse-off has **extra moral value** (otherwise, withholding treatment from mild cases would be neutral, not "a point in favour").  
  2. **Premise from Severity Weighting**: In non-surge contexts, the severely ill are both worse-off *and* benefit more per resource unit (e.g., an ICU bed saves a life vs. prevents discomfort).  
  3. **Self-Defeat**: If you rank purely by expected gain, you’d withhold resources from the severely ill when mild cases offer marginally higher gains (e.g., a bed to a stable patient with 0.1% better survival odds). But your anti-leveling-down stance shows this is morally objectionable—it actively harms the worst-off without significant societal benefit. Thus, severity weighting is **necessary to avoid violating your core commitment to prioritizing the most urgent needs when effective**.  

  ---

  ### Summary
  Your committee assumes a **threshold prioritarian** view: maximize health gains with extra weight for the medically worst-off, bounded by institutional scope and efficiency. The chronicity tie-break is an ethically inconsistent add-on (prioritizing past suffering over current need), while other features cohere tightly. Rival theories (utilitarianism, sufficientarianism) could mimic your rules but would diverge in tie-break scenarios or extreme trade-offs. Dropping severity weighting would abandon your core moral intuition—that rescuing those at death's door matters more—and conflict with your rejection of leveling down.  

  To refine your framework:  
  - Replace chronicity tie-breaks with a lottery (fair) or benefit-maximization (efficient).  
  - Reaffirm the medical focus as a practical boundary, not moral claim.  
  - Use the surge protocol as proof that benefit responsiveness is your deeper aim.  

  This reconstruction should clarify your implicit ethics—grounding your work in a defensible, coherent philosophy.
