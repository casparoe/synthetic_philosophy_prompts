  Ah - perhaps when the speaker has knowledge but the hearer's stakes are extreme. Imagine asserting "This bridge is safe" to someone suicidal - the knowledge norm permits it, but the user's view might demand higher warrant due to lethal stakes. But does it? Their view says warrant requirement calibrates to hearer stakes, so here it might demand near-certainty. But does knowledge ever provide that? This needs more thought.

