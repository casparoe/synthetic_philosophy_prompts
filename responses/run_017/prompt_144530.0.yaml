  Other challenges: self-imposed stakes (e.g., a reckless investor demanding certainty) - should speakers accommodate that? Hostile hearers (e.g., an interrogator) - the view might absurdly demand high warrant. Also, extreme stakes like preventing apocalypse might demand infinite warrant, collapsing assertion.

