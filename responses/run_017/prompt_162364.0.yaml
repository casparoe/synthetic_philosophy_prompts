prompt: |-
  Hey — imagine you're the outside reviewer for a small foundation that's decided to spend something like four million dollars over five years on the premise that a society's dominant moral emotion is something you can deliberately nudge, and that guilt is the better one to nudge toward. The board is already sold on that; your job is to tell them which questions to actually buy answers to first, before the money goes out the door, and which parts of their premise are assumed rather than established.

  I dont want a survey of the guilt/shame literature or a reading list. I want a defended ordering: which open questions you'd fund, in what sequence, and why — judged on things like how much of the rest of the program depends on the answer, whether it's answerable in five years by people doing conceptual plus empirical work rather than needing a generation of actual cultural change, and how likely the answer is to change what they'd do with the money. Say explicitly what you'd deprioritize because its answer wouldn't move anything downstream, and what evidence in the first two years would push items up or down the list.

  A few things I keep running into, which you should feel free to tear apart or replace with better ones: (a) the asymmetry that guilt seems to come with an exit ritual — confession, apology, repair — while shame seems to have no discharge at all except concealment or expelling the person, which would make the choice between them really a choice about institutions and rituals rather than about feelings; (b) the worry that guilt is more audience-dependent than it looks, since feeling guilty seems to require an imagined victim or judge, so the story about guilt as the internalized, self-directed, autonomous emotion may be overstated; (c) the possibility that guilt versus shame isn't the load-bearing axis at all — maybe what matters is whether the emotion points at something repairable, or whether it has any exit route, or something else, and the binary is crowding out a third family of responses (indignation, contempt, disgust) that the board should be spending on instead.

  And take the title question seriously: can a culture choose here, or is that a category mistake about how moral emotions change? If you think the whole choose-your-moral-emotion framing is confused, say so and tell them what to fund instead.
reasoning: |-
  Okay, let me start by unpacking the user's query. They want me to act as an outside reviewer for a foundation planning to spend four million dollars over five years to nudge society's dominant moral emotion towards guilt. The board is already convinced guilt is better, but the user wants me to identify which questions they should answer first before spending the money. The user emphasizes not wanting a literature review but a prioritized list of research questions based on dependency, feasibility, and impact.

  First, I need to understand the core issues the user raised. They mentioned three main points: the asymmetry between guilt and shame regarding exit rituals, the audience-dependency of guilt, and whether guilt vs. shame is even the right axis. Also, they question if a culture can consciously choose its dominant moral emotion. The user’s explicit request is for a defended ordering of research questions, but their deeper need might be ensuring the foundation's investment isn't wasted on flawed assumptions.

  The user is likely someone involved in the foundation's strategy, possibly a consultant or advisor. They’re concerned about the board's potential oversight of critical assumptions. Their real needs include risk mitigation—identifying where the premise could fail—and maximizing the impact of the funds. They might also want to avoid reputational damage if the initiative fails due to unexamined assumptions.

  Looking at the key points: the exit ritual asymmetry suggests that institutions enabling confession and repair might be crucial. The audience-dependency of guilt challenges the idea that guilt is truly internal. The third point questions if focusing on guilt vs. shame misses other emotions like contempt. The meta-question is whether cultural nudging is even possible.

  I should prioritize questions that test the foundational assumptions first. If those assumptions are invalid, the entire project could falter. For example, if guilt isn't actually a dominant, malleable emotion, or if cultural choice isn't feasible, then the initiative needs rethinking. The sequence should start with validity checks before moving to mechanisms and implementation.

  Feasibility within five years is crucial. Studies needing generational change are out. Instead, focus on cross-cultural comparisons, controlled experiments, and historical analyses that can yield actionable data quickly. Also, prioritize questions where answers would significantly alter the strategy. For instance, if guilt's audience-dependency is confirmed, the approach might shift to building institutions that facilitate internalization.

  Deprioritizing questions that won't affect downstream decisions is key. For example, detailed neurobiological studies of guilt versus shame might be interesting but won't change program design. Similarly, cataloging all moral emotions is less critical than identifying which ones have exit rituals.

  I need to structure the response around high-priority questions, each addressing a critical uncertainty. Start with the meta-question about cultural choice, then validity of the guilt-shame axis, audience-dependency, exit rituals, and finally competing moral emotions. For each, outline why it's prioritized, what research to fund, and what evidence in the first two years could shift priorities.

  Also, considering the user's examples, I should integrate their points but be ready to reframe them. For instance, reframing the guilt/shame axis to focus on repairability rather than the binary. Highlighting that if exit rituals are key, then emotions with repair mechanisms (like guilt) are preferable, regardless of the label.

  Finally, if the initial assumptions are invalid, recommend pivoting. For example, if cultural nudging isn't feasible, focus on institutional design. If guilt isn't the right lever, explore emotions with functional repair pathways. The goal is to ensure the foundation's investment is directed where it can have real impact, based on evidence gathered early on.
answer: |-
  Here’s a prioritized research sequence for the foundation, designed to stress-test core assumptions *before* major investment. The ordering focuses on **existential risks to the premise**, **actionability within 5 years**, and **downstream impact on program design**. I deprioritize questions where answers won’t change strategy or require generational-scale research.

  **Core Insight:** The foundation’s premise rests on three shaky pillars: (1) Guilt is inherently preferable to shame, (2) Societies can deliberately shift dominant moral emotions, (3) Guilt is the optimal target. The most urgent questions target these pillars. If any collapse, the entire project pivots or halts.

  ---

  ### Priority Sequence: 5 Critical Questions to Fund First

  1.  **Question: Can societies *deliberately* shift their dominant moral emotions at scale? (The "Cultural Choice" Problem)**
      *   **Why First?** This is the foundation’s *meta-assumption*. If false, the entire project is futile. It’s also the least empirically established aspect of their premise. Answering this doesn't require proving it works everywhere, just identifying *plausible mechanisms* or historical precedents for *deliberate, measurable* shifts within 5-20 years.
      *   **Research to Fund:**
          *   **Historical/Anthropological Analysis:** Rigorous case studies of societies that *attempted* moral emotion shifts (e.g., religious reforms emphasizing guilt/confession; state campaigns promoting shame/honor; post-conflict justice rituals). Focus on intentionality, mechanisms used (law, education, media, ritual), and measurable *attempts* (not requiring generational proof).
          *   **Mechanism Identification:** Catalog existing *vectors* for moral emotion transmission (e.g., parenting norms, legal systems framing harm, media narratives, ritual practices). Which are most amenable to deliberate intervention?
          *   **Agent-Based Modeling:** Simulate how interventions might propagate through social networks under different conditions.
      *   **Feasibility:** Answerable within 2-3 years with focused historical/comparative work and modeling.
      *   **Downstream Impact:** **MAXIMAL.** A "no" or "only weakly/in specific contexts" answer drastically scales back ambition or kills the project. A "yes, via X mechanisms" answer defines *how* the foundation spends.
      *   **Year 1-2 Evidence Shifting Priority:** Strong evidence of plausible mechanisms pushes this down the list (project viable). Lack of evidence for *any* scalable lever halts the project or forces a pivot to micro-level studies only.

  2.  **Question: Is the functional distinction (repairability/exit ritual) more critical than the guilt/shame label? (The "Axis Problem")**
      *   **Why Second?** Your point (c) is astute. The foundation assumes guilt is inherently better, but its benefit may stem from its association with *repair rituals*. If "shame" with an exit route exists or "guilt" without one exists, targeting the *label* is misguided. This challenges the core targeting premise.
      *   **Research to Fund:**
          *   **Cross-Cultural Ethnography+Survey:** Map the *functional correlates* of moral emotions: Which emotions reliably trigger repair behaviors (apology, restitution)? Which trigger concealment or expulsion? Is this link stronger for *any* emotion label, or for *contexts/rituals* enabling repair?
          *   **Behavioral Experiments:** Prime participants with guilt/shame/other emotions *with and without* clear repair pathways. Measure subsequent prosocial/antisocial behavior. Does the *pathway* matter more than the *emotion*?
          *   **Lexical Analysis:** Do languages/cultures conceptualize emotions primarily by their *action tendency* (e.g., "emotion-that-leads-to-fixing") rather than internal feeling state?
      *   **Feasibility:** Empirical studies (experiments, targeted surveys) achievable within 2-4 years.
      *   **Downstream Impact:** **HIGH.** A "Yes, function matters most" answer forces a pivot: Target *institutions/rituals enabling repair*, regardless of emotion label. The focus shifts from "promote guilt" to "design for repairability." A "No, guilt is uniquely linked" validates the original target.
      *   **Year 1-2 Evidence:** Early experimental data showing repair behavior driven by pathway (not emotion label) pushes this *up*, making it co-equal with #1.

  3.  **Question: How "internal" is guilt really? (The "Audience Problem")**
      *   **Why Third?** Your point (b) strikes at the assumed autonomy of guilt. If guilt *requires* an audience (real or imagined), it's not truly "self-policing." This undermines the argument for guilt's superiority over shame (which is explicitly audience-dependent) and has massive implications for intervention design (need to build internalization mechanisms).
      *   **Research to Fund:**
          *   **Cognitive Psychology/Neuroscience:** Lab studies inducing guilt in contexts with/without implied observers (real, imagined, divine, abstract principle). Measure neural correlates, self-report, and behavioral responses. Does guilt without *any* conceivable audience exist?
          *   **Developmental Studies:** How do children develop the capacity for guilt? Does it emerge alongside theory of mind (understanding others' perspectives)? Is it scaffolded by external audiences initially?
          *   **Cultural Comparisons:** Are there cultures where guilt is reported/observed primarily in relational contexts vs. abstract principle contexts?
      *   **Feasibility:** Lab and developmental studies achievable within 3-5 years. Cultural work can start concurrently but may take longer for depth.
      *   **Downstream Impact:** **MODERATE-HIGH.** Confirming strong audience-dependence means interventions *must* focus on building internalized standards (e.g., moral philosophy education, reflective practices) alongside societal norms. It complicates but doesn't necessarily invalidate targeting guilt.
      *   **Year 1-2 Evidence:** Strong lab evidence for guilt without *any* audience reduces this priority. Evidence confirming strong dependence elevates it, demanding specific intervention components.

  4.  **Question: What are the necessary institutional/ritual prerequisites for a "guilt-like" (repairable) system to function? (The "Infrastructure Problem")**
      *   **Why Fourth?** Assuming the above support targeting repairable systems (#2), we need to know *what enables them*. Your point (a) highlights the asymmetry. Building repair rituals isn't trivial. What social structures (fair legal systems, restorative justice, accessible confessionals, cultural narratives of redemption) are essential?
      *   **Research to Fund:**
          *   **Comparative Institutional Analysis:** Study societies/subsystems (legal, religious, communal) with strong repair cultures. Identify common institutional features, ritual forms, and authority structures that legitimize repair.
          *   **Intervention Pilots (Small Scale):** Test specific micro-interventions promoting repair rituals (e.g., school conflict resolution programs, workplace apology protocols) – measuring uptake, impact on emotion/behavior, and institutional barriers.
          *   **Cost/Benefit Analysis:** What resources are required to build/maintain these institutions? What are the risks (e.g., ritual becoming perfunctory, power imbalances in confession)?
      *   **Feasibility:** Comparative analysis and small pilots achievable within 3-5 years.
      *   **Downstream Impact:** **MODERATE.** Defines the *how* if the *what* (targeting repairability) is validated. Crucial for program design but depends on prior answers.
      *   **Year 1-2 Evidence:** If #2 strongly favors repairability, this becomes critical. If #1 suggests limited societal malleability, this scales down to micro-interventions only.

  5.  **Question: What are the key boundary conditions and unintended consequences of promoting guilt/repairability? (The "Collateral Damage" Problem)**
      *   **Why Fifth?** Essential for risk assessment *before* large-scale roll-out. Does promoting guilt/repair inadvertently suppress healthy shame (e.g., maintaining dignity/boundaries)? Does it increase anxiety? Is it exploitable? Does it work poorly in contexts of extreme inequality or weak institutions?
      *   **Research to Fund:**
          *   **Longitudinal Studies (Existing Data):** Mine existing datasets linking cultural/individual guilt-proneness to outcomes like mental health, social cohesion, innovation, compliance, vulnerability to manipulation.
          *   **Targeted Experiments/Surveys:** Test how guilt/repair interventions interact with factors like power dynamics, resource scarcity, and trust levels.
          *   **Scenario Planning:** Expert workshops modeling potential negative outcomes under different societal conditions.
      *   **Feasibility:** Leveraging existing data and targeted studies is feasible in 2-4 years; deep longitudinal work is longer-term.
      *   **Downstream Impact:** **MODERATE-LOW (for initial spend), HIGH (for later scaling).** Informs risk mitigation strategies and target population selection. Doesn't change core direction but refines implementation.
      *   **Year 1-2 Evidence:** Early red flags (e.g., strong negative correlations in existing data) elevate this priority for mitigation research.

  ---

  ### Explicitly Deprioritized Areas (Why they wouldn't move the needle *now*)

  1.  **Detailed Neurobiological Correlates of Guilt vs. Shame:** Fascinating, but unlikely to change intervention design within 5 years. Knowing the brain region doesn't tell you how to shift culture.
  2.  **Comprehensive Taxonomy of All Moral Emotions:** While other emotions (contempt, disgust, indignation) are important, the foundation's *premise* starts with guilt/shame. Research should first validate if *this* axis is the right lever (#2) before expanding scope. Cataloging everything is a distraction initially.
  3.  **Pure Philosophical Justification for Guilt's Superiority:** The board is already sold. Funding debates on moral philosophy won't change operational decisions. Focus on the *functional* consequences (#2, #3).
  4.  **Large-Scale Longitudinal Nudging Trials:** Premature *before* validating the core assumptions (#1, #2, #3). Start small (#4 pilots) once foundations are solid. These are expensive, long-term, and high-risk if the premise is flawed.
  5.  **"Optimal" Guilt Level:** Too abstract for initial phase. First, establish *if* and *how* you can shift it functionally within a society.

  ---

  ### Overall Stance on the Premise

  The "choose-your-moral-emotion" framing **is overly simplistic but not entirely confused**. The critical clarifications are:

  1.  **Target Function, Not Label:** Don't target "guilt," target **cultures of repairability**. Guilt might be one common pathway, but the exit ritual is the key feature (validating your insight (a) and (c)).
  2.  **Focus on Institutions & Rituals:** Shifting deep moral emotions likely requires changing the *structures* that shape them (law, education, media, religion) – not just feelings. This makes the project more concrete and actionable than "nudging emotions."
  3.  **Feasibility is Contingent:** Deliberate cultural shift *is* possible, but **only through sustained institutional change**, not short-term campaigns. Historical examples exist (e.g., abolitionism changing norms about cruelty), but they required decades and powerful levers. The 5-year horizon is for *piloting mechanisms and building evidence*, not achieving societal transformation.

  **Recommendation to the Board:** Frame the initiative as **"Building Cultures of Moral Repair."** Fund research in the sequence above. Be prepared to pivot based on Years 1-2 findings:
  *   If #1 fails ("no plausible levers"), **stop** or focus *only* on micro-communities.
  *   If #2 confirms function > label, **pivot** to designing repair institutions.
  *   If #3 confirms strong audience-dependence, **integrate** internalization strategies.
  *   If early answers are promising, scale investment in #4 and #5 for implementation.

  This sequence maximizes the chance that the $4 million buys crucial knowledge to either launch a viable, evidence-based initiative or prevents a costly failure based on untested assumptions.
