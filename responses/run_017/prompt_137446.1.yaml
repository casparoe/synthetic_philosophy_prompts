prompt: |-
  You are a philosopher of science who has also sat on interdisciplinary grant panels: someone equally at home with Dennett's vocabulary of cranes and skyhooks, with the contrast between good and greedy reductionism, and with the mundane business of turning a vague worry into something a reviewer can write down in a form that survives an appeal. Think carefully before you answer. Begin with a short brainstorm — a dozen lines or so — of the ways a proposal that is not a skyhook nevertheless looks like one, and the ways a real skyhook gets past busy reviewers, and let that shape the procedure you go on to write.

  I chair the review panel for a public funder's high-risk, cross-disciplinary scheme. Each round we read around forty proposals. Each gets roughly twenty minutes from one reviewer who is a specialist in one of the fields involved and therefore a non-specialist in the other, and the panel must then defend, in writing, both the declines and the awards, to applicants who will push back hard. Our recurring problem is not fraud or sloppiness; it is that a large fraction of the ambitious proposals buy their explanatory power with something they have not paid for. Some posit an explainer that is exactly as mysterious as the thing to be explained, or one whose operation would require an exemption from the very regularities it is invoked to explain. Others are honest but impatient: they jump straight from a high-level phenomenon to a low-level mechanism, skipping the intermediate levels where the real work was always going to be, so that the phenomenon becomes indescribable at every level except the bottom one. We have no shared way of separating these from proposals that are merely unfamiliar, or from proposals that have earned the right to leave a mechanism unspecified.

  I want a decision procedure my reviewers can actually run in twenty minutes. It should be ordered tests, with what counts as a sufficient answer to each, a stop-rule that says when to decline without going further, a stop-rule that says when to recommend funding without going further, and explicit escalation points where the call passes to an outside referee or to the panel because it is a judgement about risk appetite rather than a matter of fact. It must be usable by a reviewer who has never heard the word "skyhook": gloss each step in plain language. Give me a small set of verdict categories with wording that could go into a letter, and mark which steps are genuine findings and which are judgement calls wearing a procedure's clothing.

  Four distinctions I have found useful in our discussions must survive into the procedure, and I want you to sharpen or replace them where they are wrong:

  A dormant crane is not a skyhook. A proposal may leave a mechanism unidentified provided it says what kind of thing the mechanism is, what level it operates at, and how we would tell if it were absent. A skyhook is different: it is an explainer whose own operation would need resources, exemptions, or powers that the proposal has not budgeted for and cannot point to.

  Explanations must balance their books. Any apparent increase in order, specificity, or functional fit has to be paid for out of something the proposal can identify — a reservoir, a population, a selection process, a timescale. A mechanism that imports organisation without saying where it came from is borrowing a crane, not building one.

  There is a mirror test for greed as well as for skyhooks. If the property the proposal invokes at its preferred level is just as much in need of explanation as the phenomenon it was brought in to explain, nothing has been gained, and the proposal should be told so in those terms.

  And there is a ladder test for reductionism. Ask the applicant to restate the explanation one level up, and then one level above that. A good reductionism has to be able to descend the ladder, deriving the higher-level pattern rather than gesturing at it. A reductionism that can only be stated at the bottom rung, or that must quietly reintroduce higher-level vocabulary — function, information, representation, purpose — to do its work, is greedy: it is spending currency it refuses to acknowledge.

  Apply the finished procedure to four proposals, in this order, and show the reasoning at each step rather than only the verdict.

  One: a well-written, genuinely exciting proposal on the origins of life, which explains the emergence of biological organisation by positing a law-like intrinsic tendency of matter to complexify, and treats the appearance of design as the surface expression of that tendency. This is the panel's favourite going into the round.

  Two: a proposal on the persistence of promise-keeping in a large anonymous society, which proposes to explain it directly in terms of individual neurochemistry and reward circuitry, on the grounds that the institutional and strategic stories are, in its words, merely descriptive.

  Three: a molecular biology proposal which argues that an observed class of folding error is buffered by some as-yet-unidentified chaperone-like mechanism, and asks for money to run a screen to find it. The mechanism is not named; the kind of thing it is, and the detection method, are.

  Four: a proposal that a well-replicated but puzzling cognitive phenomenon depends on a quantum-level mechanism sustained in warm, wet neural tissue. The panel's instinct, off the record, is that this is theatre. I want to know whether the procedure agrees, or whether its distaste is doing the work.

  At least one of these applications must return a verdict I will not like, and I want you to say which and why you think I will find it unwelcome. Finally, tell me where the procedure will misfire: what kinds of proposal it will systematically punish, how a genuine revolutionary would look to it, and at which steps a reviewer's ignorance is most likely to be laundered into a finding.
reasoning: |-
  We are designing a decision procedure for reviewing interdisciplinary proposals that may suffer from "skyhook" problems (unearned explanatory power) or "greedy reductionism" (skipping levels). The procedure must be runnable in 20 minutes by a reviewer who may not be a specialist in all relevant fields. We'll structure it as a series of tests with stop rules and explicit verdict categories.

  First, let's brainstorm the issues:

  1. **Skyhook vs. Dormant Crane**: 
     - A skyhook: an explainer that itself requires unexplained resources or exemptions (e.g., a law that just happens to complexify without a mechanism).
     - A dormant crane: a mechanism that is not fully specified but is constrained (e.g., we know it's a chaperone protein and how to detect it).

  2. **Balancing the Books**: 
     - Any increase in order or specificity must be accounted for by a reservoir (e.g., energy source), a process (e.g., selection), or a timescale. If not, it's borrowing a crane.

  3. **Mirror Test for Greed**: 
     - If the proposed explanatory concept is as mysterious as the phenomenon, then nothing is gained (e.g., explaining promise-keeping by neurochemistry without explaining how neurochemistry produces that behavior in context).

  4. **Ladder Test for Reductionism**: 
     - Can the explanation be restated at a higher level? If not, it might be greedy. Also, does it reintroduce higher-level concepts (like function) at the bottom level? If so, it's spending unearned currency.

  Now, how might a skyhook slip through?
  - It might be dressed in technical jargon that impresses non-specialists.
  - It might be presented as a "law" or "principle" without scrutiny of its origin.
  - The reviewers might be excited by the high-level vision and overlook the missing mechanism.

  How might a real crane look like a skyhook?
  - If the reviewer is not familiar with the field, they might not recognize that the mechanism is well-constrained (dormant crane) and dismiss it as a skyhook.

  Given this, the procedure:

  **Decision Procedure: Four Tests with Stop Rules**

  *Test 1: The Skyhook Test (Stop if failed)*  
     - **Question:** Does the proposal rely on an explainer (e.g., a law, mechanism, or entity) that would require resources, exemptions, or powers that are not accounted for?  
     - **Check:** Identify the main explanatory element. Ask: "Does this element itself need an explanation that isn't provided? And would that explanation require something that breaks known regularities?"  
     - **Sufficient answer:** The proposal must either (a) show that the explainer is already established and doesn't need further explanation in this context, or (b) provide a credible path to account for it (e.g., via a reservoir, process, or known mechanism).  
     - **Stop rule:** If it fails, decline. Reason: "The proposed explanation relies on an unaccounted-for element that would violate established principles."  
     - **Escalation:** None. This is a factual test.

  *Test 2: The Bookkeeping Test (Stop if failed)*  
     - **Question:** For any increase in order, specificity, or functional fit, does the proposal identify the source (e.g., a reservoir, population, selection process, timescale)?  
     - **Check:** Look for any claim that something becomes more organized, adapted, or specified. Ask: "What pays for this? Is it a flow from a reservoir (like energy), a selection process, or a known random process with sufficient time?"  
     - **Sufficient answer:** The proposal must point to a plausible source. If it's a new law or principle, it must pass Test 1 and be more than a restatement of the phenomenon.  
     - **Stop rule:** If it fails, decline. Reason: "The proposal does not account for the source of increased organization/specificity."  
     - **Escalation:** None. Factual.

  *Test 3: The Mirror Test (Stop if failed)*  
     - **Question:** Is the proposed explanatory concept at the chosen level just as much in need of explanation as the original phenomenon?  
     - **Check:** Compare the mystery of the explainer and the explicandum. If they are equally mysterious, then nothing is gained.  
     - **Sufficient answer:** The explainer must be either (a) simpler, (b) independently established, or (c) such that it reduces the mystery by connecting to a broader framework.  
     - **Stop rule:** If it fails, decline. Reason: "The proposed explanation does not reduce the mystery; it relocates it."  
     - **Escalation:** None. Factual.

  *Test 4: The Ladder Test*  
     - **Question:** Can the explanation be restated at a higher level without losing its power? And does it avoid reintroducing higher-level concepts at the bottom?  
     - **Check:**  
          a. Ask: "How would this explanation look one level up (e.g., from molecular to cellular, or individual to social)?"  
          b. Then: "And one level above that?"  
          c. Also, check if the low-level explanation secretly uses functional/purposeful language.  
     - **Sufficient answer:** The explanation should be derivable from the lower level without circularity. It should not require higher-level concepts that are not reducible.  
     - **Stop rule:**  
          - If it passes all tests so far, and the proposal is otherwise sound, recommend funding.  
          - If it fails, but the problem is minor (e.g., one gap in an otherwise strong proposal), escalate to the panel for risk assessment.  
          - If it fails badly, decline.  
     - **Escalation:** If the reviewer is unsure about the ladder test (e.g., due to interdisciplinary gaps), they can escalate to an outside referee or the panel. Also, if the proposal is high-risk but the risk is acknowledged and the potential reward is high, the panel should decide.

  **Verdict Categories (for the decision letter):**

  1. **Decline (Skyhook)**: The explanation relies on an element that is not accounted for and would require exemptions from known principles.
  2. **Decline (Bookkeeping)**: The proposal does not account for the source of increased organization/specificity.
  3. **Decline (Mirror)**: The proposed explanation does not reduce the mystery; it merely relocates it.
  4. **Decline (Ladder)**: The explanation cannot be restated at multiple levels and/or relies on unreduced higher-level concepts at the bottom.
  5. **Escalate to Panel (Risk)**: The proposal has gaps but they are acknowledged and the potential reward justifies the risk. (Panel will make final call.)
  6. **Recommend Funding**: Passes all tests and is otherwise sound.

  Now, apply to the four proposals:

  **Proposal 1: Origins of life with a law-like tendency to complexify.**

  - *Test 1 (Skyhook)*: The "law-like intrinsic tendency" is the explainer. Does it require an exemption? Yes, because it posits a fundamental tendency that isn't part of known physics and isn't paid for by any reservoir or process. It's a skyhook: it would need an exemption from the second law (or a mechanism to harness energy) that isn't provided. **FAIL. Stop. Verdict: Decline (Skyhook)**.

  **Proposal 2: Promise-keeping via neurochemistry only.**

  - *Test 1 (Skyhook)*: The neurochemical mechanism is the explainer. It doesn't obviously require exemptions (neurochemistry is real). But let's proceed.
  - *Test 2 (Bookkeeping)*: The proposal explains a social phenomenon (promise-keeping) by jumping to neurochemistry. Does it account for the specificity? How do the neurochemical mechanisms produce this specific social behavior? It doesn't say. It dismisses institutional stories as "merely descriptive," but the bookkeeping isn't done for how neurochemistry accounts for the social context. **FAIL (Bookkeeping)**. However, let's see the mirror test.
  - *Test 3 (Mirror)*: Is the neurochemical explanation less mysterious than promise-keeping? Maybe, but the problem is that it doesn't connect to the social level. The mirror test: the neurochemical mechanism for promise-keeping is just as mysterious (if not more) without an account of how it arises in social contexts. **FAIL (Mirror)**. 
  - *Test 4 (Ladder)*: Try to restate one level up: at the individual level, what is the explanation? It would be about how an individual's brain chemistry makes them keep promises. But then, one level up (social): how does this lead to a society-wide norm? Without the institutional level, it's incomplete. Also, the proposal likely uses higher-level concepts (e.g., "promise" is a social concept) at the neurochemical level. **FAIL (Ladder)**. 
  - **Verdict: Decline (multiple reasons, but primarily Bookkeeping and Ladder).**

  **Proposal 3: Molecular biology with an unidentified chaperone.**

  - *Test 1 (Skyhook)*: The chaperone mechanism is not identified, but it is constrained: it's chaperone-like, and there's a detection method. This is a dormant crane, not a skyhook. **PASS**.
  - *Test 2 (Bookkeeping)*: The proposal is about buffering folding errors. The increase in specificity (correct folding) is paid for by the chaperone. The energy source is presumably cellular (ATP, etc.), which is standard. **PASS**.
  - *Test 3 (Mirror)*: The chaperone mechanism is a known class of mechanisms. The mystery of the folding error is reduced by positing a chaperone. **PASS**.
  - *Test 4 (Ladder)*: 
     - Level up: cellular function (e.g., protein homeostasis). 
     - Level above that: organismal fitness. 
     - The chaperone's role can be described at higher levels without losing the mechanism. Also, the proposal doesn't secretly use higher-level concepts at the molecular level. **PASS**.
  - **Verdict: Recommend Funding**.

  **Proposal 4: Quantum mechanism in warm, wet neural tissue.**

  - *Test 1 (Skyhook)*: The quantum mechanism is the explainer. In warm, wet tissue, quantum effects are usually decoherent. Does the proposal account for how this is sustained? If it doesn't provide a mechanism (e.g., screening, rapid processes), then it might require an exemption from known quantum decoherence. **Likely FAIL** unless the proposal has a plausible account (e.g., a specific structure that protects coherence). Given that the panel thinks it's theatre, it probably doesn't. **FAIL (Skyhook)**.
  - Even if it passed Test 1, we'd continue:
  - *Test 2 (Bookkeeping)*: The cognitive phenomenon is explained by quantum effects. But does it account for the specificity? How do quantum effects produce this specific cognitive outcome? Without a clear path, it fails bookkeeping.
  - *Test 3 (Mirror)*: The quantum mechanism might be as mysterious as the cognitive phenomenon, so nothing gained.
  - *Test 4 (Ladder)*: Restating at higher levels (neural, cognitive) would be difficult without the quantum part, and the quantum level might reintroduce cognitive concepts.
  - **Verdict: Decline (Skyhook)**.

  Now, the proposal that returns an unwelcome verdict: 
  - The panel's favorite was Proposal 1 (origins of life). The procedure declines it (skyhook). This will be unwelcome because the panel was excited by it.

  Where the procedure will misfire:
  - **Systematic punishment**: Proposals that are genuinely revolutionary but challenge fundamental assumptions might look like skyhooks (e.g., if they posit a new principle). The procedure is conservative.
  - **A genuine revolutionary**: Would look like a skyhook at Test 1 because they might propose something that seems to break current rules. Unless they can point to a reservoir/process, it would be declined.
  - **Reviewer ignorance laundering**: 
     - At Test 1, if the reviewer doesn't understand the field, they might mistake a dormant crane for a skyhook (e.g., in Proposal 3, if the reviewer doesn't know chaperones are common, they might call it a skyhook). 
     - At Test 4, if the reviewer isn't interdisciplinary, they might not see how to restate at higher levels.

  To mitigate, the escalation points (especially for Test 4) and the panel's role in risk assessment are crucial.

  Final note: The procedure is designed to catch unearned explanations. It will err on the side of caution, but that's appropriate for public funding.
answer: |-
  ### Decision Procedure for Interdisciplinary Proposal Review  
  Based on your distinctions, I've designed a 4-step procedure to identify skyhooks and greedy reductionism. Each step is a test with clear stop rules, escalation points, and plain-language glosses. The goal is efficiency (20 minutes per proposal) and defensibility. The tests are ordered to catch fatal flaws early.  

  #### **Verdict Categories (for Decision Letters)**  
  1. **Decline (Unaccounted Mechanism)**: The proposal relies on an explainer that violates known principles or lacks a plausible source.  
  2. **Decline (Unbalanced Explanation)**: The proposal does not identify what "pays for" increases in order, specificity, or function.  
  3. **Decline (Relocated Mystery)**: The explanatory concept is as puzzling as the phenomenon it explains.  
  4. **Escalate to Panel (Risk Assessment Needed)**: Gaps exist but are acknowledged and justified; high-risk/high-reward judgment required.  
  5. **Recommend Funding**: Passes all tests; mechanisms are either specified or constrained.  

  **Key**:  
  - ⚙️ = Factual test (failure is objective).  
  - ⚖️ = Judgment call (procedure guides but reviewer discretion needed).  

  ---

  ### **The 4-Step Procedure**  
  **Step 1: The Accountant Test (Skyhook vs. Dormant Crane)**  
  - **Plain Language**: *"Does the proposal’s key explainer require magic? If it needs special powers, resources, or exemptions from science’s rulebook that aren’t budgeted for, it’s a skyhook. If it’s an unspecified but constrained mechanism (we know its type, level, and how to test for it), it’s a dormant crane."*  
  - **Test**: Identify the core explanatory mechanism. Ask:  
    - Does it need resources/exemptions not mentioned (e.g., violating thermodynamics or requiring unobserved forces)?  
    - Is it a dormant crane? (Check: Type, level, and detection method are specified.)  
  - **Sufficient Answer**: Mechanism either (a) fits known principles, or (b) is a dormant crane with constraints.  
  - **Stop Rule**: **Decline (Unaccounted Mechanism)** if skyhook. **Proceed** if dormant crane or no issue.  
  - **Escalation**: None. ⚙️ (Factual).  

  **Step 2: The Banker Test (Balancing the Books)**  
  - **Plain Language**: *"Where does the ‘order’ come from? Any claim that things get more specific, organized, or functional must ‘pay’ for it with something real—like energy, time, selection, or randomness. If it imports organization without a source, it’s fraud."*  
  - **Test**: For increases in order/specificity, identify the "payment": Reservoir (e.g., energy gradient), process (e.g., selection), or timescale.  
  - **Sufficient Answer**: Explicit link to a feasible source (e.g., "ATP hydrolysis powers this" or "10^6 years allow selection").  
  - **Stop Rule**: **Decline (Unbalanced Explanation)** if no payment. **Proceed** if books balance.  
  - **Escalation**: None. ⚙️ (Factual).  

  **Step 3: The Mirror Test (Relocated Mystery)**  
  - **Plain Language**: *"Is the explainer just as mysterious as the thing it explains? If swapping the phenomenon for the mechanism leaves you equally puzzled, nothing has been gained."*  
  - **Test**: Compare the core explanatory concept to the phenomenon. Ask:  
    - Is the mechanism’s own origin/operation as enigmatic as the target phenomenon?  
    - Does it transfer the mystery elsewhere without reducing it?  
  - **Sufficient Answer**: The mechanism must be simpler, better-established, or reduce net mystery.  
  - **Stop Rule**: **Decline (Relocated Mystery)** if mystery isn’t reduced. **Proceed** if resolved.  
  - **Escalation**: None. ⚖️ (Judgment, but guided by comparison).  

  **Step 4: The Ladder Test (Greedy Reductionism)**  
  - **Plain Language**: *"Can the explanation climb the ladder? Restate it one level up (e.g., cells → organs) and then another. If it crumbles or sneaks in high-level ideas (purpose, function) at the bottom, it’s greedy. Good reductionism derives higher levels from lower ones."*  
  - **Test**:  
    - Restate the explanation at the next higher level (e.g., molecular → cellular).  
    - Restate one level above that (e.g., cellular → organismal).  
    - Check for "smuggled" high-level concepts (e.g., "information," "function") in low-level descriptions.  
  - **Sufficient Answer**: The explanation holds at higher levels without circularity or loss of coherence.  
  - **Stop Rule**:  
    - **Recommend Funding** if it passes.  
    - **Escalate to Panel (Risk Assessment Needed)** if gaps are acknowledged and risk is justified.  
    - **Decline (Relocated Mystery or Unbalanced Explanation)** if greedy.  
  - **Escalation**: ⚖️ (Judgment on risk/reward). Reviewer can escalate to panel if uncertain.  

  ---

  ### **Application to Four Proposals**  
  **Proposal 1: Origins of Life (Law-like tendency to complexify)**  
  - **Step 1 (Accountant)**: Posits a "law-like intrinsic tendency" as the explainer. This requires an exemption from entropy (2nd law of thermodynamics) without a payment (e.g., energy source). **Skyhook—Unaccounted Mechanism. Decline.**  
    - *Reasoning*: The tendency is as mysterious as biological organization. No dormancy—it doesn’t specify how to test for absence.  
  - **Stop**: No further testing.  
  - **Verdict**: **Decline (Unaccounted Mechanism)**.  
  - *Note: This is the panel’s favorite, but it fails Step 1 fatally. You’ll dislike this because the proposal is exciting but builds on an exemption it hasn’t earned.*  

  **Proposal 2: Promise-Keeping via Neurochemistry**  
  - **Step 1 (Accountant)**: Neurochemistry is real, but the mechanism isn’t a skyhook—it’s grounded. **Proceed.**  
  - **Step 2 (Banker)**: Explains promise-keeping (high-level social behavior) directly via reward circuitry (low-level). No "payment" for how neurochemistry scales to societal persistence (e.g., no selection process or cultural reservoir). **Unbalanced Explanation. Decline.**  
    - *Reasoning*: Jumps from neurons to norms without institutions/evolution. Books don’t balance—social specificity isn’t paid for.  
  - **Stop**: Decline after Step 2.  
  - **Verdict**: **Decline (Unbalanced Explanation)**.  
    - *Mirror/Ladder tests confirm: Step 3 would fail (neurochemical "reward" is as mysterious as promise-keeping without context); Step 4 would fail (restating at societal level reintroduces "trust" or "norms").*  

  **Proposal 3: Unidentified Chaperone Mechanism**  
  - **Step 1 (Accountant)**: Mechanism is "chaperone-like" (type), operates at molecular level (level), and detection method specified (test for absence). **Dormant crane—Proceed.**  
  - **Step 2 (Banker)**: Buffering folding errors increases functional specificity. "Payment" is implicit (cellular energy, evolutionary selection). **Books balance—Proceed.**  
  - **Step 3 (Mirror)**: Chaperones are known protein helpers; explaining folding errors with them reduces mystery. **Proceed.**  
  - **Step 4 (Ladder)**:  
    - Level up (cellular): Folding errors disrupt cell function; chaperones buffer errors.  
    - Level above (organismal): Buffering supports fitness; errors cause disease.  
    - No high-level concepts smuggled at molecular level. **Pass.**  
  - **Verdict**: **Recommend Funding**.  

  **Proposal 4: Quantum Mechanism in Neural Tissue**  
  - **Step 1 (Accountant)**: Quantum mechanism invoked. Warm, wet tissue typically destroys quantum effects (decoherence). No exemption budgeted (e.g., no shielding or timescale). **Skyhook—Unaccounted Mechanism. Decline.**  
    - *Reasoning*: Decoherence is a known regularity; exemption isn’t paid for by reservoirs/processes.  
  - **Stop**: Decline after Step 1.  
  - **Verdict**: **Decline (Unaccounted Mechanism)**.  
    - *Procedure agrees with panel’s instinct. Steps 2–3 would fail: No "payment" for quantum order in noisy systems (Bookkeeper); quantum cognition is as puzzling as the phenomenon (Mirror).*  

  ---

  ### **Where the Procedure Misfires**  
  1. **Systematically Punishes**:  
     - **Revolutionary but Speculative Ideas**: Proposals challenging paradigms (e.g., new fundamental laws) often look like skyhooks in Step 1. Genuine revolutions (e.g., quantum theory in 1920s) might be declined if they lack "payment."  
     - **Holistic/Emergentist Work**: Proposals emphasizing top-down causation may fail the Ladder Test if they reject reductionism outright.  

  2. **Genuine Revolutionary Looks Like**:  
     - Steps 1–2: A skyhook (no "payment") or unbalanced (no source for order).  
     - Step 4: Greedy reductionism if it can’t climb the ladder immediately.  
     - *Example*: A proposal for consciousness as a fundamental force would fail Step 1—even if true.  

  3. **Ignorance Laundering Risks**:  
     - **Step 1 (Accountant)**: Non-specialists may misclassify dormant cranes as skyhooks (e.g., unfamiliar but constrained mechanisms).  
     - **Step 4 (Ladder)**: Reviewers may force reductionism onto non-reductive fields (e.g., ecology), mistaking integration for greed.  
     - **Most Vulnerable Step**: Step 3 (Mirror Test). Judging "mystery reduction" is subjective; ignorance of a field may make everything seem equally mysterious.  

  ### **Conclusion**  
  The procedure prioritizes explanatory accountability. It declines Proposals 1, 2, and 4 but funds 3. Proposal 1’s decline will be unwelcome due to its appeal, but it conflates a pattern with a mechanism. To handle edge cases, **escalation to the panel** (Step 4) allows for risk-appetite judgments. For fairness, train reviewers on dormant cranes vs. skyhooks and emphasize that "judgment calls" (⚖️) require interdisciplinary consultation.
