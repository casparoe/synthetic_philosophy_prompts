prompt: |-
  I am trying to work out what I actually think about the authority of a community's memory when it collides with the documentary record, and I would like help extracting the principle — or, more realistically, the two or three candidate principles — that my verdicts on particular cases add up to. I am not asking for a bibliography or for the state of the literature; I have read enough of it to know the standard moves. What I want is the shape of the principle, stated precisely enough that I can test it against cases I have not yet considered.

  The cases below are composites. I have changed names, places, and dates, and nothing in what follows needs to be looked up; please treat them as stipulations rather than as history to be checked.

  1. A roadside marker in a hamlet in upstate New York, erected in 1921 by the local historical society, reads: *Near this spot the settlers of Harrow Ford drove off the Marlow gang, 1791.* The county militia pay rolls and a 1792 grand jury presentment tell a different story: four men were killed, they were unarmed debtors being pursued by a creditor's agent, and the settlers were fined. My verdict: the marker comes down. The town's memory gives way completely, and it should be replaced by something it does not want.

  2. A steelworkers' local in Ohio has told, since 1977, that its foundry strike was broken when a man named Ray Kovac crossed the picket line. Payroll records and a hospital admission record put Kovac in surgery that week. His granddaughter teaches at the high school and has grown up with the story. My verdict: the local owes a public correction, and it owes it even though the story is the thing that holds its identity together, and even though paying it will cost the local the only heroic episode it has.

  3. A K'iche'-speaking village in the western highlands remembers that in 1929 the landowner's militia killed a large part of the village at the river bend. The district judge's report for that quarter records *complete tranquility* and no disturbances anywhere in the department; the land registry shows transfers consistent with the families having fled. My verdict: the memory does not give way. The silence of that archive is not evidence against the memory; it is part of what the memory is about.

  4. A village in the Carpathians remembers that in 1946 the people of the next valley burned its church and killed forty of its men. The parish register and the district court's 1947 indictments show the direction reversed: its own men went up the valley first. My verdict: the record governs, the village should revise its account, and the cost — that it stops being able to think of itself as the wronged party — does not exempt it. I hold this alongside case 3, and I am aware the two need a distinction I have not yet stated.

  5. A town's national day of mourning commemorates *the Three Hundred* of the sack of Valmira in 1689. Tax rolls, hearth counts, and the burial register support something between sixty and eighty dead. My verdict, and this is the one I keep going back and forth on: the figure should be corrected in schoolbooks and on the civic monument, but the liturgy may go on saying "three hundred." Something in me thinks the prayer is not making the same kind of claim the monument is. Something else in me thinks I have invented that difference to avoid a cost.

  6. My husband's family has always said that his great-great-uncle enlisted in a Colored Infantry regiment in 1863. The muster rolls put him in a quartermaster labor detail, and there he stayed. My verdict: the family should stop asserting it flatly, but it would be grotesque to demand they stop telling it. It should be told as what it is — a family belief the record does not support — and I do not think the record's authority reaches far enough into a Sunday dinner to require more.

  7. An outport community on the Newfoundland coast has said since 1963 that the trawler *Sea Lark* was lost because the owner refused to replace a broken radio. The 1963 inquiry blamed the weather and exonerated the owner. In 2011 the owner's correspondence turned up in an estate sale and confirmed the refusal. My verdict: the community had been right, but more than that — the inquiry's authority was never as great as it presented itself as having, and it was a mistake, in 1963, to treat it as settling the question.

  The principle I have been toying with has three moving parts. First: deference to the record is *earned*, not automatic, and it is earned by the record's independence from the interests at stake, by its counterfactual sensitivity — would this archive look different if the memory were true? — and by its willingness to speak against the interest of whoever made it. Second: even a fully earned record governs only the assertoric content of a memory, never its commemorative force. Third, and least developed: I keep wanting an analogy to adverse possession in property law, so that a memory held openly, continuously, and under claim of right for three generations acquires a standing the record cannot simply extinguish, however much better the evidence may be.

  Here is what I would like from you.

  State the strongest version of that principle, and at least one genuinely different rival, each precisely enough to generate verdicts. Motivate every clause by a case above, and say which case each clause exists to save. Then tell me, honestly, which of my verdicts your preferred principle cannot accommodate and which of them you would overturn — I would rather lose a verdict than keep a principle that only works by multiplying clauses. Apply both candidates to four cases I have not listed: a community that would prefer to forget an atrocity the record insists on; a four-hundred-year-old memory with no living person affected either way; a document of dubious provenance that surfaces and appears to corroborate a memory; and a case where memory and record agree on the event but disagree about who struck the first blow. Finally, tell me where the adverse-possession analogy clarifies things and where it quietly does damage — in particular whether it is doing any work that the other two clauses are not already doing.
reasoning: |-
  Hmm, this user is grappling with profound questions about historical authority - where community memory clashes with documentary records. They've presented seven carefully constructed hypothetical cases and their personal verdicts on each, showing deep intellectual engagement with the tension between lived experience and archival evidence. 

  The core of their struggle seems to be developing a consistent principle that respects both truth and meaning. Their proposed framework has three elements: earned authority of records, separation of factual claims from commemorative functions, and an adverse possession analogy for long-held memories. But they wisely recognize this might need refinement.

  Looking at their cases, patterns emerge. In cases 1, 2, 4 and 6, they side with documents when records appear reliable and the stakes concern factual accuracy. Yet in cases 3 and 7, they privilege community memory when archives seem compromised by power structures. Case 5 shows their struggle with distinguishing factual from liturgical truth.

  What's impressive is their intellectual honesty - they explicitly want their principle challenged, even if it means overturning some verdicts. The four new scenarios they propose (forgetting atrocities, ancient memories, dubious documents, and first-blame disputes) are brilliantly chosen stress tests.

  The adverse possession analogy is particularly fascinating. While it captures something important about longstanding memories gaining legitimacy, I worry it might inadvertently validate persistent falsehoods. Their second principle (separating factual claims from commemorative meaning) seems more promising as it honors community significance without compromising truth.

  For the new scenarios, their framework would likely: insist on remembering documented atrocities regardless of community preference; treat ancient memories as commemorative rather than factual; subject new documents to the same reliability tests; and resolve "first blow" disputes based on record quality rather than narrative preference. 

  Ultimately, their deepest insight might be that not all truth claims serve the same function - sometimes what matters isn't whether something happened, but what it means to those who remember it.
answer: |-
  Based on your cases and verdicts, here are two precisely stated, competing principles designed to generate verdicts. Your own three-part principle provides the foundation, but it's refined and challenged to expose its core logic and limitations.

  **Principle A: Contextual Authority & Functional Separation (Reflecting Your Core Intuitions)**

  1.  **Documentary Primacy Condition:** Factual claims about specific past events (actors, actions, numbers, sequences, causality) must yield to contemporaneous documentary records *if* those records demonstrate:
      *   **Independence:** Were created primarily for purposes other than justifying/denying the specific event in question, by actors not directly involved in the contested event or its immediate aftermath as partisan agents.
      *   **Counterfactual Sensitivity:** Would likely contain traces of the event as remembered if it occurred as claimed (e.g., deaths require burial/legal records; large-scale violence requires administrative/military reports; strikes require payroll/union logs).
      *   **Contrary Interest:** Contain information damaging to the interests or reputation of the entity creating or controlling the record.
      *(Motivated by Cases 1, 2, 4, 7: Saves 1,2,4 by applying the tests; explains 7 by showing the 1963 inquiry *failed* these tests (likely lacked independence/contrary interest).)*
  2.  **Commemorative Autonomy Condition:** Commemorative practices (liturgies, rituals, stories told *as* identity-forming narratives rather than specific factual assertions) retain autonomy even when specific factual claims within them are falsified by records meeting Condition 1. Their function is meaning-making, not historical assertion.
      *(Motivated by Cases 5 & 6: Saves the 'Three Hundred' liturgy and the family story told *as* family belief. Distinguishes the monument/schoolbook (assertoric) from the prayer (commemorative/identity-forming).)*
  3.  **Structural Silencing Condition:** The absence of a documentary record *does not* challenge a community memory when the event remembered is precisely the kind an oppressive power structure (colonial, authoritarian, exploitative) *would* systematically obscure or deny, *and* the memory itself includes that silencing as part of its meaning.
      *(Motivated by Case 3: Saves the K'iche' memory. Explains why the judge's report and land registry silence is not just absence of evidence but evidence of the structure the memory testifies against. Distinguishes Case 4 where the parish register/court indictments are *present* and meet Condition 1.)*

  **Principle B: Critical Provenance & Narrative Integrity (A Genuine Rival)**

  1.  **Critical Provenance Standard:** The authority of *any* source (document or memory) derives from a critical assessment of its provenance:
      *   **For Documents:** Assess origin, purpose, creator bias, archival context, and potential for alteration/suppression (similar to your tests, but applied universally).
      *   **For Memory:** Assess the social processes of transmission (orality, ritual, teaching), the community's position within power structures (marginalized/dominant), the function of the memory (resistance, legitimation, cohesion), and its internal coherence/plausibility vis-à-vis broader historical context.
  2.  **Narrative Integrity Priority:** When sources conflict, priority goes to the source whose narrative demonstrates greater integrity in accounting for *all* available traces (documentary, physical, memorial) and the historical context of power, *unless* the documentary source's critical provenance is demonstrably superior on balance. Memory is not inherently subordinate.
      *(Motivated by Cases 3 & 7: Prioritizes the K'iche' memory and the outport belief *because* their narratives better account for the silence/corruption of the official record within the power context. Challenges the automatic deference in Cases 1 & 4.)*
  3.  **Functional Constraint:** Neither documents nor memory govern the *meaning* or *commemorative use* derived from the past by a community. However, communities have an ethical obligation to acknowledge significant conflicts between their commemorative narratives and the best critically assessed accounts of the factual past when making public assertions *about* that past.
      *(Addresses Cases 5 & 6 similarly to Principle A, but emphasizes the ethical obligation over strict separation. Might demand more nuance in the 'Three Hundred' liturgy label than Principle A.)*

  **Analysis Against Your Verdicts & Principle A's Limitations**

  *   **Principle A Accommodates:** Case 1 (Records meet Condition 1), Case 2 (Records meet Condition 1, public correction required for factual claim), Case 3 (Condition 3), Case 4 (Records meet Condition 1), Case 5 (Condition 2), Case 6 (Condition 2), Case 7 (1963 Inquiry fails Condition 1, later docs support memory).
  *   **Principle A Struggles/Overturns?** Principle A generally accommodates your verdicts. The tension is with **Case 4 vs. Case 3**. Principle A relies heavily on Condition 3 (Structural Silencing) to distinguish them. If Condition 3 is rejected or weakened, Principle A struggles to justify the different verdicts without appealing to something like your adverse possession idea implicitly favoring the K'iche'. Principle B handles this distinction through its Critical Provenance assessment of *both* sources.
  *   **Would Principle A Overturn Any?** It *might* demand more from **Case 5**: While allowing "three hundred" in the liturgy (Condition 2), it would likely insist the *label* "The Three Hundred" on the civic monument/day itself is an assertoric claim requiring correction, potentially altering the character of the commemoration more than you allow. It strictly rejects adverse possession for factual claims (Condition 1).

  **Adverse Possession Analogy: Clarification vs. Damage**

  *   **Clarifies:** Captures the intuition that longevity, openness, and integration into identity *do* confer a kind of legitimacy on memory, making it resistant to simple erasure by *late-arriving* or *contextually weak* documents. It resonates with your verdicts in Case 3 (long-held, open, identity-forming memory resisting silence) and Case 6 (family story persists despite muster rolls).
  *   **Damages/Redundant:**
      *   **Factual Claims:** It directly contradicts Documentary Primacy (Condition 1). If a record *earns* authority, adverse possession shouldn't override it for core facts (e.g., Case 1, 2, 4). Your verdicts side with the record in these cases, showing adverse possession isn't decisive for facts.
      *   **Commemoration:** Condition 2 (Commemorative Autonomy) already protects the *function* of longstanding memories without granting them factual authority. Adverse possession adds nothing here.
      *   **Structural Silencing:** Condition 3 protects memories *because* of the context of oppression and the meaning of the silence, not merely their age or openness. Adverse possession would protect dominant group myths too (e.g., the Harrow Ford marker *was* longstanding and open).
      *   **Core Issue:** Adverse possession focuses on the *memory's* qualities (time, openness) rather than the *relationship* between the memory and the record (the tests in Condition 1 & 3). Your principles A1 and A3 are doing the essential work of adjudicating that relationship. Adverse possession risks sanctifying persistent error.

  **Application to New Cases (Using Principle A & Principle B):**

  1.  **Community Preferring to Forget Documented Atrocity:**
      *   **Principle A:** Condition 1 (Records likely meet tests - atrocity creates traces, records may show contrary interest). The factual claim of the atrocity governs. The community cannot erase it publicly. Commemoration (or lack thereof) is autonomous, but public denial or suppression of records violates Documentary Primacy. *(Verdict: Record governs the fact; community cannot deny or suppress it publicly.)*
      *   **Principle B:** Critical Provenance of documents must be assessed. If strong, Narrative Integrity requires incorporating the atrocity to account for the documents. The community cannot deny the documented facts publicly. Functional Constraint allows non-commemoration but not denial. *(Verdict: Similar to A - record governs fact.)*

  2.  **400-Year-Old Memory, No Living Stakeholders:**
      *   **Principle A:** Documentary Primacy Condition 1 applies if relevant records exist. If records meeting Condition 1 contradict it, they govern the factual claim. Commemorative Autonomy (Condition 2) allows the story to be *told as tradition*. Adverse possession doesn't override Condition 1. *(Verdict: Correct factual claims publicly; tradition can be recounted *as* tradition.)*
      *   **Principle B:** Critical Provenance of both memory and any documents assessed. If documents have superior provenance, they govern the factual claim. Narrative Integrity might still find value in the *persistence* of the memory as a historical artifact itself. Functional Constraint allows the story to be told *as* the longstanding community belief. *(Verdict: Correct facts publicly if docs strong; story can be told as cultural heritage.)*

  3.  **Dubious Document Corroborates Memory:**
      *   **Principle A:** The document *itself* must pass Condition 1 to challenge or support anything. Dubious provenance likely fails Independence and Counterfactual Sensitivity tests. It doesn't *earn* authority. The memory stands or falls based on other evidence/tests (e.g., if it was previously challenged by *good* docs, or protected by Condition 3). *(Verdict: Dubious doc doesn't change the status quo based on other evidence/tests.)*
      *   **Principle B:** Critical Provenance Standard applied rigorously to the new document. If provenance is dubious (origin unknown, potential forgery, chain of custody broken), it adds little weight. The conflict resolution depends on the prior Critical Provenance assessment of the existing memory and any other records. *(Verdict: Dubious doc has minimal impact; rely on prior critical assessment.)*

  4.  **Memory & Record Agree on Event, Disagree on First Blow:**
      *   **Principle A:** Documentary Primacy Condition 1 applies to the specific claim of "who struck first." Do the records meet the tests regarding *this specific detail*? (e.g., Are they contemporaneous? Independent? Would they reflect the initiator? Do they speak against the creator's interest?). If yes, record governs the fact of who initiated. *(Verdict: Apply Condition 1 tests to the specific "first blow" claim.)*
      *   **Principle B:** Critical Provenance assessment of *both* sources regarding the specific claim. Which source's account of initiation has greater integrity given the full context and other traces? Does one source have a clear motive to distort *this detail*? *(Verdict: Assess provenance/narrative integrity specifically for the "first blow" claim.)*

  **Conclusion:**

  Your strongest principle aligns most clearly with **Principle A (Contextual Authority & Functional Separation)**. It best explains your pattern of verdicts, particularly the crucial distinction between Cases 3 and 4 via the **Structural Silencing Condition**. The **Commemorative Autonomy Condition** effectively handles the nuances of Case 5 and 6 without resorting to adverse possession.

  The **adverse possession analogy** captures an important *sentiment* about the resilience and identity-value of long-held memory, but it conflicts with the core logic of **Documentary Primacy** when records *earn* their authority and doesn't add necessary protection beyond **Commemorative Autonomy** and **Structural Silencing**. It risks protecting harmful falsehoods held by dominant groups.

  **Principle B (Critical Provenance & Narrative Integrity)** is a genuine rival, emphasizing a more symmetrical evaluation of sources. It might feel more consistent to some, particularly in Cases 3 and 7. However, it struggles to generate your verdict in **Case 1** as clearly as Principle A – why should the Harrow Ford marker yield so completely if both sources are subjected to critical provenance? Principle A's stricter deference to *earned* documents provides a clearer rule for factual correction in cases like 1, 2, and 4.

  Your struggle with **Case 5 ("Three Hundred")** highlights the genuine difficulty of cleanly separating "assertoric content" from "commemorative force." Principle A's Condition 2 provides the clearest framework for navigating this, though it requires accepting that the *label* itself straddles the line. Principle B's Functional Constraint, demanding ethical acknowledgment, might feel more burdensome in this specific liturgical context.

  The principles are now sharp enough to test against new cases and refine further. The core tension between documentary authority earned through reliability tests and the autonomous power of commemorative meaning, mediated by an awareness of structural oppression’s impact on the archive, captures the shape of your judgment.
