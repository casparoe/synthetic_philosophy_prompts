  The user also brings up the objection about the past changing. If "there will be a battle" has no truth value tonight but becomes true tomorrow, does that mean the past changes? I need to explain that on a no-truth-value view, truth values are timeless, so when the battle happens, it retroactively was true all along. However, this can be seen as counterintuitive because it suggests that the truth existed before the event was determined.

  Regarding contested readings of Aristotle, I should note that some scholars, like Frede and Hintikka, argue that Aristotle doesn't reject bivalence but instead makes a semantic point about assertability. Others, like Lukasiewicz, support the three-valued reading. Mentioning Ockhamism and the Thin Red Line will help the user understand alternative frameworks that preserve classical logic.

