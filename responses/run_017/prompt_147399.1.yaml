answer: |-
  Here's a breakdown of the book's claims, separating fair points from simplifications/disputed readings, followed by clarifications on your specific questions and the admiral/storm scenario. I'll flag confidence levels.

  **Book Claim Breakdown:**

  1.  **"Aristotle's worry... If that sentence is true today, then tomorrow's battle is unavoidable... deliberation is pointless."**
      *   **Fair Enough (Simplified Motivation).** This captures the core *motivation* driving Aristotle's discussion: avoiding fatalism. If future-tensed statements are *already* true/false, it *seems* to imply necessity/fixity, undermining contingency and deliberation. This is Aristotle's starting point.

  2.  **"Aristotle's way out was to deny that statements about future contingents are either true or false: they get a third, indeterminate value."**
      *   **Common Simplification / Disputed Reading.** Many scholars interpret Aristotle this way (the "Standard Interpretation" or "Traditional Interpretation," often associated with **Lukasiewicz** himself). However, it's highly contested.
      *   **Scholarly Dispute:** Others (e.g., **G. E. M. Anscombe, Jaakko Hintikka, Wolfgang Frede**) argue Aristotle isn't introducing a *third truth-value* but rather denying they have *any* truth-value *yet* (truth-value gaps), or even that he's making a point about *assertability* or *predication* rather than truth *simpliciter*. The text (De Int. 9, 19a23-39) is famously ambiguous on *how exactly* he denies bivalence.

  3.  **"He therefore rejected the law of the excluded middle for them."**
      *   **Just Wrong / Major Simplification (Confuses Bivalence and LEM).** **This is the crucial conflation you suspected.**
      *   Aristotle **rejected Bivalence** (the principle that every meaningful proposition is *either true or false*) for future contingents. He argued they are *neither* true *nor* false *now*.
      *   However, he almost certainly **maintained the Law of Excluded Middle (LEM)** for them. LEM states that "P or not-P" is *necessarily true*. Aristotle explicitly says "there will be a sea-battle tomorrow or there will not be a sea-battle tomorrow" is *necessarily true now* (19a27-32). His problem is assigning a truth-value to *each disjunct individually* ("There *will* be..." or "There *will not* be...") *before* the event. He denies *bivalence* for the singular future contingents, not LEM for the disjunction.

  4.  **"Two thousand years later Łukasiewicz built the first many-valued logic precisely to formalise this, giving future contingents the value ½ — and in his system 'either there will be a sea battle tomorrow or there won't' also comes out as ½ rather than as true..."**
      *   **Common Simplification / Disputed Reading.** Lukasiewicz *did* develop his three-valued logic (T, F, I/½) explicitly inspired by Aristotle and aiming to formalize the open future. Assigning ½ to singular future contingents captures the "neither true nor false" idea.
      *   **However:** Assigning ½ to the disjunction "P or not-P" is **Lukasiewicz's innovation, not Aristotle's**. As noted above, Aristotle held the *disjunction* to be necessarily true. Lukasiewicz's system makes "P or not-P" undefined (½) when P is undefined (½). So while inspired by Aristotle, Lukasiewicz's formalization goes beyond Aristotle's text by also denying LEM for the disjunction.

  5.  **"which is exactly what Aristotle had argued."**
      *   **Just Wrong (regarding LEM).** As established in point 3, Aristotle argued the *disjunction* is necessarily true, while Lukasiewicz's system makes it ½. Aristotle denied bivalence for the *components*, not LEM for the *disjunction*.

  6.  **"The moral is that an open future isn't compatible with classical logic: you have to weaken logic itself before you can take seriously the thought that tomorrow is genuinely unsettled..."**
      *   **Common Simplification / Disputed Claim.** This is Lukasiewicz's *own* moral and a popular view. **However, it's strongly contested.**
      *   **Alternatives Exist:** Positions like **Ockhamism** and the **Thin Red Line (TRL)** theory aim to preserve classical logic *and* an open future. They distinguish sharply between *truth* and *necessity*. They hold that future contingent statements *are* true or false *now* (bivalence & LEM hold), but crucially, *which* one is true depends on the *actual future*, which is not yet *necessary* or *settled*. The truth is "thin" – it doesn't imply inevitability. Deliberation matters because it *causes* which future (and thus which proposition) becomes actual/true. *(Think of it like a fact about the future that isn't yet fixed; your actions determine which fact it is.)*

  **Your Specific Questions Answered:**

  *   **Does Aristotle reject LEM?** **No, he does not reject LEM for future contingents.** He rejects **Bivalence** for singular future contingent statements ("There will be a sea-battle"), but maintains that the disjunction "There will be a sea-battle or there will not be a sea-battle" is necessary and true. *(Confidence: High - based on explicit text)*
  *   **Are "neither true nor false" and "the disjunction isn't true" the same?** **No, they are distinct claims.** Denying Bivalence for P (saying P is neither T nor F) is different from denying that "P or not-P" is true. Aristotle makes the first denial (for singular P) but *affirms* the truth of the disjunction. The book *merges* these. *(Confidence: High - logical distinction)*
  *   **Can you have an open future with classical logic?** **Yes, according to Ockhamism/TRL.** They preserve bivalence and LEM for *all* propositions, including future contingents. The "openness" comes from the lack of *metaphysical necessity* or *causal determination* of the future truth-makers, not from a lack of truth-value. Deliberation is effective because it *contributes to making* one future-tensed statement true and the other false. *(Confidence: High - established position)*

  **The Admiral & Storm Scenario:**

  *   **Tonight:** The storm is blowing up and *will definitely* prevent a battle. The admiral's decision is irrelevant.
  *   **Classical Logic (incl. Ockhamism/TRL):** "There will be a sea battle tomorrow" **is FALSE tonight**. Its truth depends on the state of affairs tomorrow. The storm ensures that state of affairs does not include a battle. The admiral's indecision is a red herring; the battle is impossible *regardless*. The book's picture oversimplifies by suggesting *any* undetermined *component* makes the whole proposition indeterminate. Here, one critical component (weather) *is* determined and sufficient to falsify the proposition. *(Confidence: High - straightforward application)*
  *   **Aristotelian/Łukasiewicz View:** This is trickier. A strict "no truth-value" view *might* be tempted to say it's indeterminate because the admiral hasn't decided *yet*, even though the storm makes his decision moot. This seems counterintuitive. A more plausible Aristotelian response might be that the storm's certainty *settles* the matter, making "There will be a battle" **false** (or at least *not* indeterminate), precisely because the admiral's choice is now irrelevant to the outcome. The indeterminacy only applies when the outcome genuinely depends on undetermined events. *(Confidence: Moderate - requires interpretation of Aristotle's scope)*

  **The "Past Changing" Objection:**

  *   **The Charge:** If "There will be a battle" (F) has no truth-value at T1, but becomes true at T2 (when the battle starts), then at T2, we say "F *was* true at T1". But at T1, we said it *wasn't* true (or false). So the truth-value *at T1* seems to change between T1 and T2.
  *   **Response (for No-Truth-Value views):** Proponents argue truth is *timeless*. At T2, we don't say "F *was* true at T1". We say "F (which is about T2) *is* true (timelessly), *and* it *was* the case at T1 that F would be true". Crucially, the *proposition* F doesn't change. What changes is our *knowledge* and, more metaphysically, *which* timeless truth F has. At T1, F had *no* timeless truth-value; at T2, it gains the timeless truth-value "True". The past (the state of affairs at T1) doesn't change; it included the fact that F was *indeterminate* (or gappy). *(Confidence: Moderate - standard defense, but some find the "timeless truth gaining a value" metaphysically odd)*
  *   **Is it a Cost?** Many philosophers think it *is* a significant cost. It requires accepting that the *truth-value* of propositions (or facts about what is true) can change over time, even if the *past events* don't change. This motivates Ockhamists to stick with timeless bivalence. *(Confidence: High - widely acknowledged as a point of contention)*

  **Summary for Your Talk:**

  *   **Book's Aristotle/Lukasiewicz Story:** A common but contested simplification. Aristotle rejected **bivalence** for singular future contingents, not LEM. Lukasiewicz formalized the "indeterminate" idea but *also* denied LEM for the disjunction, which Aristotle didn't. The claim that open future *requires* non-classical logic is Lukasiewicz's view, not universally accepted.
  *   **Key Distinction:** **Bivalence** (each prop. T or F) vs. **LEM** ("P or not-P" is necessary). Aristotle denied the first for singular future contingents, affirmed the second.
  *   **Open Future + Classical Logic:** Yes, via **Ockhamism/Thin Red Line**. Future contingents *are* T/F now, but this truth is "thin" – it doesn't imply necessity or undermine deliberation. Truth supervenes on the actual, open future.
  *   **Admiral/Storm:** Counters the book's simple "undetermined event = indeterminate proposition". Classical logic (and plausibly Aristotle) says "Battle" is **false** if the storm makes it impossible, regardless of admiral's indecision.
  *   **Past Changing Objection:** A genuine challenge to "no truth-value" views, requiring a defense involving timeless truth and truth-value "acquisition". Seen by many as a cost.

  Focus on clarifying the Bivalence/LEM distinction – that's the core confusion in the book and likely your group. Explaining Ockhamism as a classical alternative is crucial for countering the book's final "moral". Good luck!
