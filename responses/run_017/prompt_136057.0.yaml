prompt: |-
  I'm a novelist, and I run a week-long residential workshop for about fourteen fiction writers, mostly literary with a few working in genre. I have one 90-minute slot and nothing but index cards, envelopes, and a timer. I want an activity that makes them feel, in their own practice rather than as a thesis, the old logical puzzle about whether a claim about tomorrow's sea battle is already either true or false — specifically the way it bites when you are the one who gets to decide what tomorrow holds.

  The angle I want to exploit is something I've started calling "back-shadowing": in fiction, a line written early — a scrap of dialogue, a stray image, a throwaway prediction — can be made true or false by a chapter you write three months later, so at the moment of writing there is apparently nothing in the world that settles it, and yet once the draft is closed it seems to have been true all along. I want the group to collide with that themselves. Give me the setup, the roles, the rules, a minute-by-minute timeline, and a debrief that maps specific moments onto the structure of the puzzle. Have them work on scenes from their own works-in-progress so the stakes are small but not fake. No lecture up front, and they shouldn't hear the standard name for the problem until the debrief. Please keep it from sliding into a free-will seminar: what I want them to hit is that the trouble concerns the truth of the sentence, not causation and not who knows what.

  Also tell me what will predictably go the first time I run it — I'd guess writers will make the prediction self-fulfilling or self-defeating to dodge the issue, and will psychologize it into a character's fear — and how to handle each. Be frank about which part of the puzzle the activity cannot stage and that I will have to supply in my own words.

  Finally: mark where you're extrapolating, and if the analogy between back-shadowing and the sea battle is broken in some way that would leave the group with a false picture, say that plainly rather than building a graceful session around it.
reasoning: |-
  We are going to design an activity that forces writers to confront the logical puzzle of future contingents (the sea battle) through the lens of "back-shadowing" in fiction writing. The core idea is that a statement made early in a story (like a prediction) is neither true nor false until the author later writes the event that makes it true or false. The activity should use the writers' own works-in-progress to keep the stakes real but manageable.

  **Setup**
  - Each writer must bring a scene from their current work-in-progress (WIP) that they are willing to share and manipulate. The scene should be one that they are actively working on and that has some open-endedness (i.e., not yet finalized).
  - We will use index cards and envelopes to create a physical representation of the "future contingent" and its resolution.

  **Roles**
  - Each participant is both a writer and a "fate-maker" for their own story. They will also be paired with one other participant to serve as a "witness" (to avoid solipsism and to add a layer of external perspective).

  **Rules**
  1. Writers will write a "prophecy" or a forward-looking statement (e.g., a prediction, a fear, a promise) that appears in their current scene on an index card. This statement must be about an event that has not yet occurred in their story (even if the story is not yet written beyond that point).
  2. They will then write two versions of a future scene (on separate index cards) that make the prophecy either true or false.
  3. These cards will be sealed in envelopes (one for the true outcome, one for the false) and swapped with their partner. The partner will act as a witness and hold the envelopes until the resolution phase.
  4. The writer then returns to their current scene and writes two new versions of it: one that subtly sets up the prophecy to be true and one that sets it up to be false. They do this without knowing which envelope (true or false) they will have to use later.

  **Activity Timeline (90 minutes total)**

  * **Minute 0-5: Introduction and Setup (5 min)**
    - Explain that we are going to do an exercise about how early elements in a story can resonate differently based on what happens later. Avoid any philosophical jargon.
    - Ask each writer to take out a scene they are currently working on that includes (or can include) a line of dialogue, a thought, or a description that hints at something that might happen in the future. If they don't have one, they can add one now.

  * **Minute 5-15: Writing the Prophecy (10 min)**
    - Each writer writes on an index card (Card A) a single sentence that is a forward-looking statement from their scene (e.g., "I'll never see her again," or "The ship will sink by dawn"). They should note the context briefly (who says it, when, etc.) on the same card.
    - They then write two alternative versions of a future scene (not yet written in their WIP) that would make this statement either true or false. Each version is on a separate index card (Card B for true, Card C for false).

  * **Minute 15-25: Sealing and Swapping (10 min)**
    - Each writer puts Card B (true outcome) in Envelope 1 and Card C (false outcome) in Envelope 2. They label the envelopes only as "1" and "2" (without indicating true/false).
    - They swap their two sealed envelopes with their partner. Each partner now holds the other's envelopes and does not know which envelope contains which outcome.

  * **Minute 25-45: Rewriting the Present (20 min)**
    - Each writer now rewrites their original scene (the one with the prophecy) twice, creating two new versions (on separate index cards, Card D and Card E). 
    - In one version (Card D), they subtly set up the prophecy to feel inevitable (so that if the true outcome is drawn, it will feel like it was always going to happen). 
    - In the other version (Card E), they set it up so that the prophecy feels like it might be wrong (so if the false outcome is drawn, it will feel like the prophecy was unreliable). 
    - They should not change the prophecy sentence itself, but adjust the surrounding context (e.g., the tone, the character's state of mind, the setting, or other details).

  * **Minute 45-65: Reveal and Integration (20 min)**
    - Each writer gets back their own two envelopes from their partner. Without looking inside, they randomly choose one envelope (by flipping a coin or drawing from a hat) and open it to reveal one outcome (either true or false). 
    - They then choose the version of the present scene (Card D or Card E) that matches the outcome they drew (i.e., if they drew the true outcome, they use Card D; if false, they use Card E). 
    - Now, they write a new index card (Card F) that bridges their chosen present scene (either D or E) to the chosen outcome (from the opened envelope). They must write a transition that makes the outcome feel like a natural consequence of the present scene.

  * **Minute 65-80: Reading and Reflection (15 min)**
    - In pairs, writers share: 
        a) The original prophecy (Card A)
        b) The chosen present scene (Card D or E)
        c) The bridge (Card F) and the outcome (from the envelope)
    - The partner (who was the witness) reflects on how the chosen present scene sets up the outcome and how the prophecy now feels in retrospect (e.g., inevitable, ironic, etc.).

  * **Minute 80-90: Debrief (10 min)**
    - Bring the group together and ask: 
        - "When you wrote the prophecy (Card A), was it true or false at that moment of writing?"
        - "When you set up the two versions of the present (Cards D and E), did you feel you were creating truth conditions or just possibilities?"
        - "After the outcome was revealed and you wrote the bridge, did the prophecy feel like it had been true (or false) all along? Why or why not?"
    - Then reveal the connection to the sea battle puzzle: 
        - "This is a version of Aristotle's sea battle puzzle: a statement about the future (like 'There will be a sea battle tomorrow') is not yet true or false because the event hasn't happened. But once it does happen, it seems it was always going to be that way. In fiction, you are the arbiter of what happens. At the moment you write the prophecy, it's neither true nor false because you haven't written the future. But once you write the future, it retroactively fixes the truth value of the prophecy. This is what I call 'back-shadowing'."
    - Point out that the issue is about the truth of the sentence, not about causation or free will. The exercise shows that the truth of a future contingent is indeterminate until the event occurs (or is written).

  **Predictable Problems and How to Handle Them**

  1. **Problem: Making the prophecy self-fulfilling or self-defeating.**
     - *Why it happens:* Writers might try to control the outcome by writing the present scene in a way that directly causes the outcome, thus avoiding the indeterminacy.
     - *How to handle:* During the setup, emphasize that the two versions of the present scene (D and E) should only create a *feeling* of inevitability or doubt, not a causal mechanism. The outcome is already fixed by the envelope (which they don't control). Also, in the bridge (Card F), they must connect without altering the outcome.

  2. **Problem: Psychologizing into a character's fear.**
     - *Why it happens:* Writers may treat the prophecy as merely a character's subjective belief, thus avoiding the question of its objective truth.
     - *How to handle:* In the instructions, require that the prophecy be written as a factual statement (even if it's expressed by a character). During debrief, highlight that the exercise is about the truth of the statement in the fictional world, not the character's state of mind.

  3. **Problem: Confusion about the envelopes.**
     - *Why it happens:* The swapping and random selection might be logistically messy.
     - *How to handle:* Use a timer for each step and have extra envelopes and cards. Model the process with a volunteer.

  4. **Problem: The analogy breaks because the author has control.**
     - *Where the analogy breaks:* In the sea battle puzzle, the truth is settled by the world, but in fiction, it's settled by the author. The activity cannot stage the idea that the future is independent of the author's will. 
     - *How to handle:* Acknowledge this in the debrief: "In real life, we don't know what will happen, but in fiction, you decide. However, the moment of writing the prophecy is like the present moment in real life: until you write the future, the prophecy has no truth value in the story. Once you write it, it becomes fixed. The puzzle is about the logical status of the statement at the time it is written."

  **Extrapolations and Limitations**

  - **Extrapolation:** The activity uses random selection (envelope draw) to simulate the idea that the future is not yet determined. This is an extrapolation because in reality, the author could have chosen either outcome. The point is to mimic the experience of not knowing the future until it happens.
  - **Broken Analogy:** In the sea battle puzzle, the truth is settled by the world (and the principle of bivalence is challenged). In fiction, the author is the world. Therefore, the activity cannot replicate the metaphysical uncertainty of real future contingents. However, it does replicate the epistemic and logical uncertainty: at the time of writing the prophecy, the author hasn't decided, so the statement is neither true nor false in the story world until the later writing fixes it.

  **Conclusion**
  This activity should create a visceral experience of back-shadowing. By forcing writers to commit to a prophecy before knowing the outcome and then having to retroactively justify it, they will feel how the truth of a statement is fixed only by the occurrence (or non-occurrence) of the event. The debrief then maps this onto the sea battle puzzle, emphasizing the logical status of future contingents.
answer: |-
  ### Workshop Activity: "The Unwritten Future"  
  **Goal:** To create a visceral encounter with the indeterminacy of future truths in fiction (Aristotle's sea battle puzzle) through the lens of "back-shadowing"—where early story elements gain fixed truth only after later authorial decisions.  

  **Setup**  
  - **Materials:** Index cards (3 per writer), envelopes (2 per writer), timer, pens.  
  - **Prep:** Ask writers to bring a scene from their WIP containing a *forward-looking statement* (e.g., dialogue like "The storm will destroy us," a prophecy, or a character’s certainty about tomorrow). Ensure they’re prepared to rewrite it.  

  **Roles**  
  - **Writer:** Creates/reworks their own material.  
  - **Timekeeper:** You (facilitator), enforcing strict timing.  
  - **Pair Witness:** Partners swap envelopes to add objectivity (no collaboration).  

  **Rules**  
  1. **No pre-emptive philosophy:** Don’t mention "sea battle," "truth values," or "back-shadowing" until debrief.  
  2. **Focus on the sentence:** Isolate the *truth* of the forward-looking statement—avoid discussing character psychology, causality, or free will.  
  3. **Use real WIPs:** Grounds the exercise in personal stakes.  
  4. **Enforce randomness:** Outcomes are chosen blindly to simulate indeterminacy.  

  ---

  ### Step-by-Step Timeline (90 Minutes Total)  
  **Part 1: Isolating the "Sea Battle" (20 min)**  
  - **0–5 min:** Quick intro—"Today we’re experimenting with how early lines in a story shift meaning based on what comes later. Use your WIP."  
  - **5–15 min:** Writers write on Card 1:  
    - **A forward-looking statement** from their WIP (e.g., "We’ll find the treasure tomorrow" or "The killer won’t strike again").  
    - **Context:** Where it appears (scene/speaker). *No backstory or explanation.*  
  - **15–20 min:** Writers write on Card 2 and Card 3:  
    - **Card 2 (True):** A future scene where the statement becomes *true*.  
    - **Card 3 (False):** A future scene where it becomes *false*.  
    *Example: If Card 1 says "The ship will sink," Card 2 shows it sinking; Card 3 shows it saved.*  

  **Part 2: Locking the Future (15 min)**  
  - **20–25 min:** Seal Card 2 (True) in Envelope A and Card 3 (False) in Envelope B. Label envelopes only as "A" and "B."  
  - **25–30 min:** Swap envelopes with a partner. *Partners hold envelopes but DO NOT open them.*  
  - **30–35 min:** Writers rewrite their Card 1 scene *twice* on new cards:  
    - **Card 1-T:** Tweaks context to make the statement feel *plausible and likely*.  
    - **Card 1-F:** Tweaks context to make it feel *doubtful or ironic*.  
    *Rules: The statement itself stays identical; only adjust surrounding details (e.g., tone, imagery, subtext).*  

  **Part 3: The Revelation (30 min)**  
  - **35–40 min:** Randomly assign outcomes (e.g., coin flip: heads = Envelope A, tails = B). Partners return envelopes. Writers open their assigned envelope.  
  - **40–50 min:** Writers choose Card 1-T (if they opened "True") or Card 1-F (if "False"). They write a **transition paragraph** linking their chosen Card 1 to the outcome.  
  - **50–65 min:** **Pairs share:**  
    - Writer reads: Original Card 1 → Transition → Outcome (Card 2 or 3).  
    - Witness responds: "How did the *truth* of the statement feel once the outcome arrived?"  

  **Part 4: Debrief (25 min)**  
  - **65–75 min:** Group discussion:  
    - "When you first wrote your forward-looking statement (Card 1), was it true or false? What *made* it true/false then?"  
    - "After opening the envelope, did it feel like the statement had *always* been true/false? Why?"  
    - "Did your tweaks (Card 1-T/F) create truth or just anticipation?"  
  - **75–85 min:** Reveal the sea battle puzzle:  
    - "Aristotle asked: Is the statement ‘There will be a sea battle tomorrow’ true or false *today*? In life, we don’t know—but in fiction, *you* decide. When you wrote your Card 1, nothing in your draft made it true or false yet. It was indeterminate. But once you wrote the outcome, it retroactively fixed the truth. That’s back-shadowing: the past (your early line) is reshaped by the future (your later choice). The trouble isn’t about *why* things happen or what characters know—it’s about when a sentence gains its truth."  
  - **85–90 min:** Relate to craft:  
    - "Back-shadowing works because readers retroject meaning. Your exercise shows that early lines aren’t ‘foreshadowing’ until you *make* them true/false later. The power—and burden—is yours."  

  ---

  ### Predictable Problems & Fixes  
  1. **Problem: Writers make outcomes self-fulfilling/self-defeating**  
     - *Why:* To avoid discomfort of indeterminacy (e.g., Card 1-T directly causes the "True" outcome).  
     - *Fix:* In setup, stress: "The outcome envelope contains a *fait accompli*. Your transition can’t change it—only connect." Intervene if transitions "explain" causality.  

  2. **Problem: Psychologizing the statement**  
     - *Why:* Writers default to "The character was wrong" or "They were anxious."  
     - *Fix:* Redirect: "We’re not asking if the *character* knew—we’re asking if the *sentence itself* was true when written. In your draft, was there proof before you wrote the outcome?"  

  3. **Problem: Resisting randomness**  
     - *Why:* Writers dislike losing control ("But *my* story wouldn’t do that!").  
     - *Fix:* "This is a thought experiment. Surrender to the randomness to feel the puzzle."  

  4. **Problem: Overcomplicating the statement**  
     - *Why:* Using vague/poetic lines (e.g., "Darkness awaits").  
     - *Fix:* Enforce simple, testable statements in Card 1 (e.g., "X will happen").  

  ---

  ### Where the Analogy Breaks (Be Transparent!)  
  - **The Gap:** In Aristotle’s puzzle, the sea battle’s truth is settled by reality, independent of observers. In fiction, *the author is reality*. The activity can’t replicate "mind-independent" truth—it can only simulate the *feeling* of indeterminacy before the author decides.  
    - **Address in Debrief:** "In real life, the sea battle’s truth exists whether we know it or not. But in your draft, nothing settles the truth until *you* write it. That’s why back-shadowing isn’t magic—it’s authorship. The sea battle puzzle highlights a logical tension; back-shadowing is how you weaponize it."  

  - **Limitation:** Writers might conflate *truth* with *narrative inevitability*. Clarify: "We’re not asking ‘Was the outcome satisfying?’ but ‘Was the sentence factually accurate at the time?’"  

  ### Why This Works  
  - **No lecture:** The activity forces writers to *live* the paradox. The envelope swap makes the outcome feel "external," mimicking real-world indeterminacy.  
  - **Stakes:** Using WIPs ensures emotional investment without vulnerability (outcomes aren’t binding).  
  - **Debrief:** Maps concrete steps (Card 1 → envelope → outcome) onto the abstract puzzle, making philosophy visceral.  

  **Final Tip:** Run this mid-week when trust is built. Expect a "click" moment during transitions—when writers realize they’re *retroactively creating truth*. Name that in debrief: "That frustration? That’s the sea battle."
