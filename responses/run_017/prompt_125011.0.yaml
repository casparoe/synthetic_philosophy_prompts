prompt: |-
  My supervisor has spent something like fifteen years arguing that we don't need a substantive property of truth, and she has built up a pretty consistent track record of saying which bits of truth-talk her version of the view can absorb and which bits force her to admit something more. I'm writing the eight-page intro to a volume of her papers (due in March, she keeps asking whether it's done, it isn't) and I want to state the through-line correctly rather than flatteringly, so I've been trying to work out what rule she is actually running. Her verdicts so far, as she has stated them in various places: plain disquotation for a small finite language, nothing substantive needed; blind generalization of the sort where you say everything in the inspector's report is true, or every theorem of some formal system is true, still nothing substantive needed, because on her telling the predicate is there to do expressive work and not to name a property; truth at a world in modal semantics and truth in a model in model-theoretic semantics, also nothing substantive, those are devices defined recursively over a structure and not descriptions of a property; the claim that truth is the norm of assertion and the aim of belief, nothing substantive; the move where someone says our best scientific theories are successful because they are true, still nothing substantive, since on her view you can strip the word out and the explanation loses nothing. Where she does say something substantive is needed: truthmaking, as in it is true that the meeting was cancelled because the meeting was cancelled, where she thinks truth is on the receiving end of a real explanation that the equivalences don't capture; and the Liar and its strengthened variants, where she thinks you cannot have a consistent and complete unrestricted schema, so you need a hierarchy or truth-value gaps or a weaker logic, and whichever you pick you are saying something about the structure of truth that minimalism doesn't say.

  The case I can't figure out is vagueness, and specifically the supervaluationist-looking package: take a language with vague predicates, consider all the admissible ways of sharpening the vague vocabulary into precise vocabulary, call a sentence true when it comes out true on every admissible sharpening, and let the truth predicate itself behave perfectly classically, so that a borderline sentence like 'Nils is tall' is neither true nor false while 'it is true that Nils is tall' is straightforwardly false. Assume quantifiers and self-reference are handled some other way, say by a hierarchy, so paradox is off the table and the only issue is the vagueness. Would she say this forces her to admit a substantive property of truth, or is it another device? A friend of mine has been pushing something he calls sharpening-relative minimalism, where you keep the equivalence schema but index it to a sharpening and then define the real truth predicate as truth on all sharpenings, and he claims this shows the whole thing is deflationarily kosher; I can't tell whether that is a genuine extension of her view or just relabeling what she already rejects. So: predict her verdict, and say which rule she is running. The two I keep coming back to are that she needs substance exactly where the equivalence schema cannot be had in full, unrestricted and transparent, versus that she needs substance only where truth does metaphysical or explanatory work or where the flat list is outright inconsistent, with any relativized or parameterized schema counting as still deflationary the way models and worlds do. Give me the other rules that fit her seven verdicts just as well, tell me which of her earlier verdicts is load-bearing for the prediction you make, and name the further case that would actually tell these rules apart. My own guess is that the test is a variant where the truth predicate itself is vague, so the equivalences never fail but bivalence does, but I am not sure that separates them in the right direction, and it might be that the real crux is which relativizations of the schema she is willing to count as deflationary at all. I don't need any citations, I know the literature badly enough already; I just want the shape of the argument.
reasoning: |-
  Alright, let me tackle this user's problem. They're writing an introduction to their supervisor's volume of papers and need to accurately represent her view on when a substantive property of truth is necessary. The user has outlined seven verdicts where she rejects the need for substance, and two where she accepts it. The main confusion is about vagueness and supervaluationism.

  First, I need to parse the supervisor's existing positions. She rejects substance in cases like disquotation, blind generalization, modal semantics, and normativity of truth. She requires it for truthmaking and the Liar paradox. The user is stuck on how she'd handle supervaluationism for vagueness, where truth is defined over sharpenings.

  The user proposes two possible rules: one based on the unrestricted equivalence schema's failure, and another on truth's metaphysical/explanatory role. I should test these against the given verdicts. For the Liar, both rules align since the schema can't be unrestricted and consistent. Truthmaking involves explanation, which fits the second rule. But what about model-theoretic truth? Here, the schema is relativized to models, yet she considers it non-substantive. That suggests she accepts parameterized schemas as deflationary.

  Now, vagueness with supervaluationism: the truth predicate is classical but defined via sharpenings. The equivalence schema might be indexed to sharpenings, similar to models. If she treats models as devices, maybe she'd see sharpenings the same way. The user's friend proposes "sharpening-relative minimalism," which seems analogous. So likely, she'd say no substantive property is needed here.

  But the user mentions a variant where truth itself is vague. If the equivalence schema holds but bivalence fails, does that challenge deflationism? If she requires bivalence for the schema to work unrestricted, that might push towards substance. However, her acceptance of model-theoretic cases without bivalence (e.g., incomplete models) suggests she doesn't tie deflationism to bivalence. The key is whether the schema's structure remains intact, even if parameterized.

  The deeper issue might be what relativizations she accepts. Models and possible worlds are formal tools, so parameterizing truth over them is fine. But if truth's vagueness requires a hierarchy or context-dependence in the schema itself, that might cross into substantive territory. The user's test case where truth is vague could differentiate: if she rejects deflationism there, it's because the schema's application becomes unstable without parameters, hinting at a substantive property governing its behavior.

  In conclusion, her likely verdict on supervaluationism is non-substantive, aligning with model-theoretic cases. The critical factor is whether the equivalence schema can be maintained in a relativized form without invoking metaphysical explanations. The unresolved test case is when the truth predicate itself is vague, potentially revealing if any parameterization beyond formal tools necessitates substance.
answer: |-
  Based on the pattern of her verdicts and the underlying principles they reveal, here's the prediction, the rule, alternative rules, the load-bearing verdicts, and the decisive test case:

  1.  **Predicted Verdict on Supervaluationism/Vagueness:** She **would NOT need a substantive property of truth** in this case. The supervaluationist truth predicate is another expressive device/formal tool, analogous to truth-in-a-model or truth-at-a-world.

  2.  **The Rule She Is Running (Best Fit):** **Truth requires a substantive property precisely when it acts as a genuine, irreducible *explanans* in metaphysics or semantics, or when the *unrestricted, transparent use* of the disquotational schema leads to inconsistency (like the Liar), forcing a substantive choice about truth's structure (hierarchy, gaps, non-classical logic).** Parameterized or relativized uses of truth (models, worlds, sharpenings) are acceptable deflationary devices because they avoid both explanatory work and schema inconsistency.

      *   **Why it fits:**
          *   *No Substance (Disquotation, Blind Generalization):* Purely expressive, no explanation.
          *   *No Substance (Truth-in-Model, Truth-at-World):* Parameterized devices, not explanatory *explanans*, schema relativized avoids inconsistency.
          *   *No Substance (Norm of Assertion/Aim of Belief):* Seen as normative, not metaphysical explanation.
          *   *No Substance (Success because True):* Strip it out; no loss of *explanatory power* (her key criterion).
          *   *Substance Needed (Truthmaking):* Truth is the *explanandum* in a metaphysical explanation ("because the meeting was cancelled" explains *why* <meeting cancelled> is true).
          *   *Substance Needed (Liar):* Unrestricted, transparent schema leads to inconsistency; forces a substantive choice about truth's structure that minimalism doesn't dictate.

  3.  **Alternative Rules Fitting the Seven Verdicts:**
      *   **Rule A (Your Schema Restriction Focus):** Substance is needed iff the *classical, bivalent, fully unrestricted and transparent disquotational schema* cannot be consistently maintained for the relevant fragment of language. (Liar forces this; truthmaking might imply it can't handle explanation).
      *   **Rule B (Strong Explanatory Role):** Substance is needed *only* when truth plays an indispensable role as an *explanans* in a metaphysical or scientific explanation. (Truthmaking *might* fit if "because it is true" is seen as explanatory, but she rejects it in the success case; Liar is problematic as it's not obviously explanatory).

  4.  **Load-Bearing Verdict for the Prediction (Rule 2):**
      *   **Truth-in-a-Model / Truth-at-a-World:** This is the *most critical* for predicting the vagueness verdict. She explicitly accepts recursively defined, parameterized truth predicates ("truth in M") as non-substantive devices. Supervaluationist truth ("true simpliciter" defined as "true on all admissible sharpenings") is structurally identical: a defined predicate leveraging a parameterized notion (truth-on-a-sharpening). If model-theoretic truth is kosher, supervaluationist truth should be too. Her acceptance of the success explanation without substance shows her resistance to "true" as an *explanans*, further supporting seeing supervaluationist truth as non-explanatory.
      *   **Truthmaking:** Her insistence on substance here highlights the *explanatory* trigger. Since supervaluationist truth isn't typically used as the *explanans* in metaphysical grounding (like truthmaking) and can be seen as derived from truth-on-sharpenings, it avoids this trigger.
      *   **Liar:** Her substance verdict here shows the *inconsistency* trigger. Supervaluationism (assuming paradox is handled separately) avoids Liar-induced inconsistency *for the classical truth predicate it defines* by making borderline claims gappy, which is a structural choice, but one arguably analogous to how model theory avoids inconsistency by relativization. Her acceptance of gaps/hierarchies *as substantive choices forced by inconsistency* is key, but supervaluationism here is presented as the *solution* built using parameterization, not the problem forcing the choice.

  5.  **The Decisive Test Case to Distinguish the Rules:**
      *   **The Case:** **A *vague truth predicate* itself.** Imagine a view where:
          *   The T-schema (``<p>`` is true iff p) holds universally and transparently.
          *   Bivalence fails for the truth predicate due to vagueness (e.g., borderline cases of truth attribution).
          *   There is *no* parameterization (sharpenings, models, hierarchies) applied to the truth predicate itself. Truth is primitive but vague.
          *   The Liar is handled by the failure of bivalence (e.g., the Liar sentence is neither true nor false).
          *   Truth is *not* invoked as an *explanans* in metaphysical explanations like truthmaking (those rely on the world).
      *   **Why it Distinguishes:**
          *   **Rule 2 (Explanans/Inconsistency):** Likely **NO** substantive property needed. The T-schema holds unrestricted and transparently (no Liar inconsistency *forcing* a structural choice). Truth isn't acting as an irreducible *explanans*. The failure of bivalence is a fact about the *predicate's* vagueness, not necessarily about a substantive *property*.
          *   **Rule A (Schema Restriction):** Likely **YES**, substantive property needed. The *classical, bivalent* disquotational schema cannot be maintained universally due to the truth predicate's own vagueness. Bivalence is violated *for truth itself*.
          *   **Rule B (Strong Explanatory Role):** Likely **NO** substantive property needed. Truth isn't playing an indispensable role as an *explanans*.
      *   **Your Variant Insight:** You were right to suspect that a vague truth predicate is the key test. This case directly pits the preservation of the unrestricted, transparent T-schema against the failure of bivalence *for truth*, separating the schema-restriction rule (Rule A) from the explanatory/inconsistency rule (Rule 2). Rule B (Strong Explanatory) is separated by design in this test case.

  **Conclusion on Vagueness (Supervaluationism):** Her verdicts strongly suggest she would see the supervaluationist "truth" predicate as analogous to "truth-in-a-model" – a defined, parameter-relative device used for expressive/formal purposes (handling vagueness by quantifying over sharpenings), not requiring a substantive property. The "sharpening-relative minimalism" proposal fits neatly within this view, extending the deflationary core (indexed equivalences) and defining "real truth" via universal quantification over the parameter (sharpenings), just as "logical truth" is often defined via universal quantification over models. It *is* a genuine extension of her view into the vagueness domain, leveraging her acceptance of parameterized truth.

  **Shape of the Argument for Your Intro:** The core through-line is her distinction between *using* "true" as a logical/expressive device (deflationarily acceptable, encompassing disquotation, generalization, parameterized truth, norms, and stripped explanations) and situations where "true" either *must* play an irreducible role in metaphysical explanation (truthmaking) or *forces* us to make substantive commitments about its structure due to the inconsistency of its unrestricted, transparent use (the Liar). Vagueness, handled via supervaluationism, falls firmly into the first category as a logical device built on parameterized truth. The unresolved tension lies in whether *any* failure of classical features for the *basic, unrelativized* truth predicate (like bivalence in the vague truth case) would push it into the second category, or if only inconsistency or explanatory work triggers substance. Her acceptance of non-bivalent solutions *for the Liar* (as substantive) but non-bivalent *defined predicates* (like truth-in-a-model) suggests the latter, making the vague truth predicate case the true litmus test for the scope of her deflationism.
