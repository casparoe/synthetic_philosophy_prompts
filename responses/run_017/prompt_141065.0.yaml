  For the naming dispute, I'll argue the qualifier isn't throwaway but also not irredeemable - the chair can teach it critically. The foundation's committee vote needs neutralization through weighted processes. The plaque should stay but with explicit contextualization. 

  The strongest counterargument is that conditional acceptance is intellectual laundering - we're taking tainted money while pretending supplementary texts cleanse it. I'll present this sharply but then rebut by stressing that institutional survival sometimes requires engaging with problematic legacies to transform them.

  Structure thoughts:
