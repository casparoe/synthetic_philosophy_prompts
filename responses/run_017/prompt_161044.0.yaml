prompt: |-
  I work as the research officer to the Commission on Public Memory, a standing body of nine people — four councillors, three appointed historians, and two representatives of the city's religious and civic associations — which rules on street names, plaques, monuments and civic anniversaries in a city of roughly three hundred thousand people. I minute the meetings and draft the recommendations, and in six weeks we have to rule on a request I cannot see our way through, because I can think of at least two principles that fit every decision we have ever made and they point in opposite directions here. Our six precedents are these. First, a petition to rename the street named after a nineteenth-century industrialist who endowed the city's hospital and orphanage but whose fortune came from rubber extraction in a colony: we kept the name and required an explanatory plaque, refusing to rename. Second, a plaque honouring a police chief who signed the 1942 deportation orders: we removed the plaque, but kept his orders in the city archive and paid to have them digitised and published. Third, a school named after a resistance hero who, in 1946, organised the expulsion of a minority from a neighbouring district: we kept the name and funded a permanent exhibition on the expulsions in the school's entrance hall. Fourth, the unmarked grave of some two hundred villagers killed by the city's own militia in 1946: we funded the restoration of the site and a plaque naming the dead, declined to name the militia unit or any surviving perpetrator, and refused to fund an annual civic ceremony, on the stated ground that the city should record and mark what it did but should not perform a grief it does not share. Fifth, a 1990 plaque commemorating a woman publicly humiliated by a collaborationist court in 1941, which her grandchildren asked us to remove because it fixed her identity to her humiliation: we removed the plaque, kept her recorded testimony in the archive, and made it available as optional classroom material rather than compulsory. Sixth, we declined a proposal for a monument to all victims of violence everywhere, on the ground that a memorial which remembers no one in particular remembers no one.

  The new request comes from an association of refugees who arrived from a country several thousand kilometres away some fifteen years ago and who now make up a small but settled minority in one of our districts. They want two things: that a small square be named after the town in which, in 1988, that country's security forces killed several hundred civilians — among them relatives of many of the applicants — and that the massacre be added to the compulsory local history module in our secondary schools. The massacre is well documented by historians and flatly denied by the government of the country in question, which is currently courting trade with our city; our city had no part in it and no historical connection to it; the applicants' own community is divided, with the elders insisting on both measures and most of their children saying they would rather not be publicly marked by it; a handful of the community's men were conscripts who were present as bystanders; a local far-right group has threatened to vandalise anything we erect; the business association warns about the trade relationship; and the curriculum, unlike names and plaques, is not within our remit at all.

  What I need from you is a recommendation, not a survey. Tell me what we should decide if we want to be consistent with ourselves, treating the naming and the curriculum separately if our precedents pull them apart, and identify which of the six is the closest analogue and why. I would also like the two or three candidate principles that fit all six precedents set out explicitly — I have in mind something like a rule that turns on whether the 1988 massacre belongs to the class of radical evil that anyone, anywhere, has a duty to remember, something like a rule on which the community that owes the remembering is constituted by shared history rather than by present co-citizenship, something like a rule about the mode of remembering and whether we may fix a living community or a dead person to their worst moment, and something like the record-versus-honour-versus-performance distinction we seem to be running in precedents two, four and five — along with what each predicts for both halves of this request, which one you think is most likely to be the principle we have actually been applying, and what principle we would be adopting, knowingly or not, under each of the options, including the option of declining the curriculum question as outside our remit. Finally, name one further hypothetical case, specified in enough detail to be usable, whose ruling would most efficiently tell the surviving principles apart. Please answer in British English.
reasoning: |-
  Okay, let me unpack this complex request carefully. The user serves as research officer for a Commission on Public Memory with six established precedents, now facing a new petition regarding a foreign massacre. 

  Hmm, the core tension lies in reconciling two competing principles that both fit past decisions but conflict here. From precedents, I notice three recurring dimensions: historical connection (city's direct involvement), commemorative mode (record vs honour vs performance), and subject framing (fixing identity to trauma). 

  First, examining precedents: 
  - Street name kept (1) and plaque removed (5) show we avoid erasure but allow form changes when commemorations harm living descendants. 
  - Police chief plaque removal (2) vs resistance hero name retention (3) reveals stronger condemnation for direct city perpetrators than external actors. 
  - The unmarked grave (4) establishes "record but don't perform grief" for city's own crimes. 
  - Generic monument refusal (6) insists on specificity.

  Now the new case: 
  Naming request involves no city involvement, foreign atrocity denied by perpetrator state. Curriculum request exceeds mandate. Key conflicts: 
  - "Radical evil remembrance" principle might support naming, but "shared history" principle opposes it (precedent 4's logic). 
  - Plaque removal in case 5 suggests avoiding fixation to trauma, which aligns with younger refugees' wishes. 

  The closest analogue seems precedent 5 (humiliation plaque removal) due to descendant concerns and identity fixation. For principles, these emerge: 
  1. Specificity: Commemorations must be particular (precedents 2,4,6) 
  2. Agency/Culpability: City's role determines commemorative mode (direct crimes: record only; external: honour) 
  3. Descendant Primacy: Living communities' preferences override abstract duties (precedents 5,3)

  For the decision: 
  - Approve square naming with contextual plaque (applying specificity + honouring victims), but reject compulsory curriculum (outside remit + descendent division). 
  - Test case: Request to name a street after a foreign dissident tortured abroad. Would confirm whether "city connection" or "universal evil" dominates.

  Notably, the business/trade concerns shouldn't influence - precedents never mention external pressure. Consistency matters most here.
answer: |-
  Below is a reasoned recommendation for the Commission, grounded in your precedents and articulated principles. I address the naming and curriculum requests separately, identify the closest analogue, derive consistent principles, and provide a test case for future clarity.

  ---

  ### **Recommendation**
  1. **Square Naming Request: APPROVE** with an explanatory plaque contextualising the massacre and noting its denial by the perpetrator state.  
  2. **Curriculum Request: DECLINE** as outside the Commission’s remit, while recommending the testimony/documents be added to *optional* educational resources (aligned with Precedent 5).  

  **Closest Analogue**: **Precedent 5** (removed plaque for the humiliated woman). Both cases involve living descendants resisting public commemoration that fixes identity to trauma, and prioritise archival preservation over performative remembrance.  

  ---

  ### **Principles Derived from Precedents**
  Two consistent principles emerge, with Principle A dominating your rulings:  

  #### **Principle A: Commemoration Requires Direct Historical Connection to the City**  
  - **Definition**: The city may commemorate events/figures only where it has **agency, culpability, or direct heritage ties**.  
  - **Precedents Supporting A**:  
    - Precedent 1: Retained industrialist’s name (city benefactor).  
    - Precedent 2: Removed police chief’s plaque (city culpability).  
    - Precedent 4: Restored grave plaque (city’s militia involvement).  
    - Precedent 6: Rejected generic monument (no specific city link).  
  - **New Case Application**:  
    - *Naming*: **Reject** under Principle A (no city role in 1988 massacre).  
    - *Curriculum*: **Decline** (outside remit; lacks city link).  

  #### **Principle B: Universal Evil Demands Local Acknowledgment**  
  - **Definition**: Events constituting "radical evil" (e.g., atrocities) warrant commemoration *regardless of city ties*, but mode depends on descendant wishes.  
  - **Precedents Supporting B**:  
    - Precedent 3: Kept hero’s name but added exhibition (acknowledged evil).  
    - Precedent 5: Removed plaque due to descendant objections.  
  - **New Case Application**:  
    - *Naming*: **Approve** with plaque (acknowledge evil; elders’ wishes).  
    - *Curriculum*: **Reject compulsory teaching** (youth objections; Precedent 5).  

  **Dominant Principle**: **A** (Historical Connection). Precedents 2, 4, and 5 turn on city actions/legacy. Precedent 3 (resistance hero) is an exception due to the city’s *beneficiary* status from his actions. Principle B is secondary, filtered through community impact (e.g., Precedent 5).  

  **Implied Principle for New Decision**:  
  - If naming approved: **"The city may commemorate extra-jurisdictional atrocities only when requested by affected descendants *and* contextualised to avoid re-traumatisation."**  
  - If naming rejected: **"Commemoration requires demonstrable city agency (perpetrator, beneficiary, or custodian)."**  

  ---

  ### **Hypothetical Test Case**  
  **Scenario**: A petition requests a plaque for a 19th-century enslaved person brought to the city by a local merchant. The person’s descendants oppose it, fearing stigma. The merchant’s ledger (proving ownership) is in the city archive.  

  **Resolution Test**:  
  - **Upholds Principle A** if rejected (city’s culpability as trafficking hub).  
  - **Upholds Principle B** if approved with descendant consultation (evil transcending locality).  
  - **Decision**: Likely **APPROVE with contextual plaque** (city’s direct role) but **omit names if descendants object** (Precedent 5). This stresses *city connection* over universal duty.  

  ---

  ### **Summary**  
  Your precedents prioritise **city-specific historical responsibility** (Principle A), moderated by **sensitivity to descendant communities** (Precedent 5). The 1988 massacre lacks city ties, so Principle A suggests rejecting the naming request. However, Principle B—constrained by descendant division—supports approval *only* if elders’ wishes outweigh youth concerns. Given Precedent 5’s removal of the humiliation plaque due to family objection, I recommend **approving the square name** (as elders represent the primary victims) **with a plaque contextualising the denial**, but **declining the curriculum request** as ultra vires and inconsistent with optional treatment of trauma (Precedent 5). This balances remembrance with agency, avoiding performative grief (Precedent 4).  

  Trade threats or vandalism risks should not factor into the decision; your precedents ignore external pressure, focusing on historical and ethical consistency.
