prompt: |-
  I have been hanging around rationalist blogs and forums for something like fifteen years now — Less Wrong in its heyday, then Slate Star Codex, then whatever it renamed itself to — and one habit I picked up there has turned out to be my actual professional obligation: whenever someone proposes a fix for a bias, I want to know what observation would tell us the fix worked, and I want that specified before the fix is adopted rather than after. I am now the token philosopher of science on the Research Practices Committee at my institute, a nine-person body (two PIs from different departments, a statistician, the veterinary director, a postdoc rep, a grad student rep, our compliance officer, a senior ethologist, and me) that adjudicates methods disputes on animal-behaviour studies and issues recommendations that get attached to annual renewal reviews. We can recommend and we can attach conditions; we cannot shut a lab down. We have one meeting, in eleven days, to resolve a case that has split us almost exactly in half, and I am drafting the document I will circulate beforehand. I would like you to draft it for me.

  The case is this. A lab is testing whether an anxiolytic compound increases affiliative behaviour in group-housed mice. Nothing about the design is exotic: treated and control animals are filmed in the home cage, and a rotating group of undergraduates and one postdoc score the video frame by frame for events the lab cares about — social approach, rearing, grooming bouts, and what the lab calls agonistic contact, which is the outcome variable. The coders are not blinded, and the lab says they cannot be: the treated animals carry a shaved patch for injections, and the cage cards are visible at the edge of the frame. Inter-rater agreement between two coders is high by the lab's own numbers. The effect is large and in the predicted direction. Four options are on the table: require genuine blinding (re-filming, cropping, digitally obfuscating the patch and the cage card, and using coders who have not been told the hypothesis); replace human scoring with off-the-shelf pose-estimation software that detects body-part keypoints and derives the events automatically; keep the current pipeline but add more training, calibration sessions, and periodic reliability audits; or leave the humans in place but force hard pre-registered decision rules plus a held-out set of reference clips scored by consensus to serve as a ground truth. Roughly half the committee thinks automation dissolves the problem entirely, since the computer has no hypothesis; the other half, including me, thinks that pushes the problem upstream, because such systems are trained on human-labelled frames and the labels carry whatever the humans brought with them. Underneath the disagreement is a question I recognise from philosophy of perception, and which I think, unlike most of what we argue about, actually determines which policy is right: whether a coder's belief about which condition they are watching can change the content of what they visually experience — a two-hundred-millisecond contact between two animals — or whether it can only change where they look and for how long, or only what they say afterwards once the seeing is over. Those three loci, it seems to me, call for three different interventions, and the interventions are not equally expensive. If the experience itself is shaped by the expectation, then agreement between two coders who share the expectation is not evidence of accuracy, training will not fix it, and the only remedies are removing the expectation or removing the human. If it is only attention that is steered, then forcing full-frame review, minimum dwell times, and enforced coverage of the whole clip may be enough. If it is only downstream judgement and reporting, then hard rules and reference sets are the right tool, and blinding is gold-plating that costs a postdoc a year. I am not confident which it is, and I want the memo to be honest about that rather than pretending to a diagnosis the literature does not support — but I also want it to land somewhere actionable, because abstaining is itself a decision that leaves the current practice in place.

  Please work as a professional philosopher of perception and general philosophy of science who has served on methods and integrity committees before, and who is comfortable writing documents that non-philosophers have to act on. Before you write the memo, spend a few paragraphs brainstorming and listing: the candidate diagnoses (experience, attention, and report, and any intermediate case you think is real); what each one would predict about the observable pattern in this lab's data, including the pattern you would expect if the effect were partly at one locus and partly at another; which policy follows from each; and where you are genuinely uncertain. Then write the memo itself, roughly eight hundred to a thousand words, in American English, addressed to the committee. It should open with a concrete recommendation with a phase-in time frame — not a menu of options — and it should be specific enough that the lab could comply with it by a date. It should then give the reasoning in terms the statistician and the ethologist can follow, defining any technical term in a line or two, since only two of us are philosophers. It should include a serious, steelmanned statement of the strongest argument for whichever option you are rejecting — I would rather lose an argument that has been stated in its best form than win one that has been stated in a weak one — and it should close with a short section, under a heading like What would change our mind, that specifies in operational terms the observation or result that should make us revisit the policy, ideally something the lab could actually produce, such as rescoring the same clips under two differently framed hypotheses. Do not include citations, references, or a bibliography: nobody on this committee will check them and half of them will be distracted by them, so the argument has to stand on its own. And please do not give me a general essay on objectivity in science; I want a document with a bottom line that nine people can vote on.
reasoning: |-
  Okay, the user is deeply entrenched in rationalist thinking and philosophy of science, serving on a Research Practices Committee. They need a memo to resolve a dispute about bias in behavioral coding of mouse studies. The core tension is between automation advocates and those concerned about upstream human bias in training data.

  Hmm... the user's framing reveals sophisticated epistemic concerns. They've identified three potential loci of bias (perceptual experience, attention allocation, post-perceptual judgment) and want operational tests for each. Their hidden anxiety seems to be about institutional decision-making under uncertainty - they need to make a call without full scientific certainty.

  Let me break this down systematically. First, the three bias mechanisms:
  1. Perceptual experience: Actual visual perception changes with expectations. This would manifest as coders literally seeing different events in identical footage when primed differently. The smoking gun would be low agreement between expectation-biased vs neutral coders on basic physical events.
  2. Attention: Expectations guide where coders look. Predictable patterns would emerge - biased coders might miss events in "uninteresting" cage areas or during "uninteresting" time periods. Eye-tracking could reveal this, but is impractical.
  3. Post-perceptual judgment: The visual input is identical, but interpretation differs. Here we'd see high agreement on raw events but systematic differences in classification when rules are ambiguous.

  The lab's current high inter-rater agreement actually supports the attention or judgment hypotheses - true perceptual distortion would likely cause more variance. This suggests blinding might be overkill.

  For the memo structure: Opening with a clear recommendation (option 4: hard rules + reference clips) keeps it actionable. Steelmanning the automation position is crucial - we must acknowledge that removing humans from real-time scoring does eliminate in-the-moment biases, even if training data carries historical biases.

  The "What would change our mind" section needs practically testable conditions. Proposing within-lab comparisons (same clips scored under different hypotheses) could provide empirical evidence about bias mechanisms without demanding new experiments.

  Implementationally, the hybrid solution offers a compromise: retain human scoring but add robust safeguards. The 90-day timeline for developing reference clips is tight but feasible. Crucially, this approach generates diagnostic data - if bias persists despite these controls, it strengthens the case for more radical interventions later.
answer: |-
  ## Brainstorming: Loci of Bias & Diagnostic Predictions

  1.  **Perceptual Experience Bias (Strong Expectancy Effect):**
      *   **Claim:** Expectation alters the *raw sensory experience* itself. Coders literally see a brief contact as occurring (or not) based on their belief about the condition.
      *   **Predictions:**
          *   Very high agreement between biased coders (they "see" the same constructed reality).
          *   Low agreement between a biased coder and a truly blinded/neutral coder *on the raw occurrence of the physical event* (e.g., "Did contact happen at time T?"), even for simple, brief events like a 200ms contact.
          *   Agreement remains low even with enforced viewing rules.
          *   Effect size might be inflated even for unambiguous events.
      *   **Policy Implication:** Requires removing the expectation (full blinding) *or* removing the human (automation, though upstream training bias remains a separate concern). Training/calibration won't touch the perception itself.

  2.  **Attentional Bias:**
      *   **Claim:** Expectation directs *where* and *for how long* coders look, influencing which events are even available for subsequent processing/reporting. They might miss events in unexpected locations/times.
      *   **Predictions:**
          *   High agreement between biased coders *on the events they both attend to*.
          *   Discrepancies primarily arise from missed events, not disagreements on witnessed events.
          *   Patterns in missed events: e.g., more missed control events, missed events in certain cage regions, missed events during specific phases.
          *   Agreement improves significantly with enforced full-frame viewing, minimum dwell times, and comprehensive clip coverage.
      *   **Policy Implication:** Enforced viewing protocols (full frame, min dwell, full coverage) + training on vigilance. Blinding or automation also effective, but may be overkill.

  3.  **Judgment/Reporting Bias (Downstream Interpretation):**
      *   **Claim:** The raw visual input is stable. Bias affects how ambiguous or borderline sensory data is *categorized* ("Was that contact 'agonistic'?") or how confidently it's reported, or even deliberate (though perhaps unconscious) reporting toward the expected outcome.
      *   **Predictions:**
          *   High agreement between biased coders *on the raw occurrence of physical events* (e.g., "Contact happened").
          *   Disagreements cluster around the *classification* of events (e.g., "Was that contact agonistic or affiliative?") or borderline cases.
          *   Biased coders classify ambiguous events more often in the direction of the hypothesis.
          *   Biased coders report higher confidence for hypothesis-consistent classifications.
          *   Agreement on raw occurrence remains high between biased and blinded coders; disagreement arises primarily in classification.
      *   **Policy Implication:** Hard, pre-registered, operationalized decision rules + a held-out reference set scored by consensus for calibration. Training focused on rule application. Blinding or automation effective but potentially more resource-intensive than necessary.

  **Intermediate/Combined Cases:**
  *   **Attention + Judgment:** Expectation influences both where coders look *and* how they interpret what they see. Predictions combine elements of 2 & 3: missed events *and* biased classification of witnessed events.
  *   **Experience + Judgment:** Perceptual construction *and* interpretation are biased. Predictions combine 1 & 3: disagreements on occurrence *and* classification, low agreement with blinded on both levels.

  **Uncertainties:**
  *   The *relative contribution* of each locus is highly context-dependent (event complexity, coder experience, strength of expectation, ambiguity of rules).
  *   Distinguishing "pure" Experience bias from a very strong combined Attention/Judgment bias impacting simple events is empirically challenging without elaborate controls.
  *   The extent to which training/calibration can mitigate Attention or Judgment bias is variable.
  *   The degree to which upstream human bias in training data impacts automated systems for *this specific task* (detecting brief, defined contacts) is unknown but potentially lower than for complex classifications.

  ---

  ## MEMORANDUM

  **To:** Research Practices Committee
  **From:** [Your Name/Token Philosopher of Science]
  **Date:** October 26, 2023
  **Subject:** Recommendation Regarding Coding Practices in Lab [Lab ID] Anxiety/Affiliation Study - Meeting on November 6, 2023

  **1. Recommendation:**
  The Committee recommends that Lab [Lab ID] implement a hybrid approach combining **Option 4 (Hard Pre-Registered Decision Rules + Held-Out Reference Set)** with **enhanced viewing protocols** for the coding of video data in the ongoing anxiolytic/affiliation study. Compliance is required for all data coded after **February 1, 2024** (allowing time for development and training). Specifically, the lab must:

      a.  Develop, document, and pre-register (internally with the Committee or externally) explicit, unambiguous operational definitions and decision rules for scoring *all* target behaviors, especially "agonistic contact." These rules must include clear thresholds, examples, and non-examples.
      b.  Create a held-out reference set of video clips (minimum 5% of total data, stratified across conditions and behaviors) scored independently by the PI and senior postdoc to establish a consensus "ground truth" for calibration.
      c.  Implement mandatory calibration sessions for all coders using the consensus reference set before scoring new data batches and periodically thereafter (e.g., monthly).
      d.  Enforce viewing protocols requiring coders to watch the *entire frame* continuously and review the *entire clip duration* for each scoring session. Consider software tools to enforce full-screen viewing if possible.
      e.  Maintain the current practice of calculating inter-rater reliability (IRR), but specifically report IRR for the *detection of contact events* separately from IRR for the *classification as agonistic*.

  **2. Reasoning:**
  Our deliberation centered on the risk of observer bias due to non-blinded coding and the most effective, evidence-based mitigation strategy. We acknowledge the lab's reported high inter-rater agreement (IRR) and large effect size, but non-blinding remains a significant validity concern. The core philosophical question is *where* the expectation bias operates: in perception, attention, or judgment.

  *   **The Experience Hypothesis (Bias alters perception itself):** If coders' expectations literally change what they see (e.g., causing them to hallucinate or miss brief contacts), high IRR between biased coders is meaningless, and only blinding or automation could solve it. However, for relatively simple, discrete events like brief physical contact (the key outcome), the evidence suggests this strong form of bias is less likely to be the *primary* driver. Truly altered perception would likely manifest as persistent, fundamental disagreements on the *occurrence* of contacts even between highly trained coders using strict viewing rules when expectations differ – evidence we don't currently have.
  *   **The Attention Hypothesis (Bias directs gaze):** Expectation could lead coders to miss events entirely by not looking in the right place at the right time. The lab's high IRR suggests coders are consistent *in what they attend to*, but doesn't guarantee they see everything. The requirement for full-frame, full-clip viewing directly targets this potential mechanism, maximizing the opportunity to detect all relevant events regardless of condition.
  *   **The Judgment Hypothesis (Bias affects interpretation/reporting):** This is the most empirically supported locus for bias in observational coding, especially for classifications like "agonistic." Coders see the contact but may interpret ambiguous interactions, apply thresholds inconsistently, or subtly shift reporting towards the expected outcome. High IRR on contact *occurrence* but potential divergence on *classification* aligns with this. The recommended actions directly address this:
      *   **Hard Rules:** Minimize ambiguity in classification.
      *   **Reference Set & Calibration:** Anchor coders to an objective standard, correcting drift and reinforcing rule application.
      *   **Separate IRR Reporting:** Allows the committee to diagnose if disagreement stems from detection (attention) or classification (judgment).

  **3. Steelmanning the Case for Full Automation (Option 2):**
  The strongest argument for mandating off-the-shelf pose-estimation software is that it removes the *immediate, in-the-moment human subjectivity* from the scoring process. The computer algorithm, once running, applies its rules consistently without expectation, fatigue, or attentional lapses. It can process the entire frame and entire clip duration perfectly reliably. While the system *was* trained on human-labeled data potentially containing historical biases ("upstream bias"), for the specific task of detecting defined, brief physical contacts (like the 200ms "agonistic contact"), the impact of upstream bias might be minimal compared to the *ongoing, experiment-specific bias* introduced by non-blinded human coders in this lab. The algorithm's consistency is absolute, and its output can be audited against the video. Automation offers a permanent, scalable solution potentially more robust than constantly training new human coders. It directly eliminates the loci of Attentional and Judgment bias *during data generation*.

  **4. Why Hybrid Approach (Option 4 + Viewing) is Preferred Over Automation Now:**
  While automation is compelling, our recommendation prioritizes practicality, diagnostic value, and addressing the most probable bias mechanisms *based on the current data and task*:

  1.  **Resource Burden & Feasibility:** Implementing and validating a new automated system (Option 2) or achieving full blinding (Option 1) would likely impose significantly greater immediate time and resource costs on the lab than enhancing the existing human-coding pipeline. Option 4 + viewing is a substantial, targeted improvement over the status quo with a feasible 90-day implementation window.
  2.  **Diagnosing the Actual Problem:** The hybrid approach provides *diagnostic data* (via separate IRR measures and calibration performance) to pinpoint the bias mechanism if it persists. If high attention-based misses occur, it will show in detection IRR and calibration. If judgment bias persists, it will show in classification IRR and deviation from the reference set. Automation, while potentially solving the immediate bias, obscures *what the original problem was* and doesn't generate data to inform future committee decisions on similar protocols.
  3.  **Upstream Bias Uncertainty:** The magnitude of upstream bias in automated systems for *this specific, simple contact-detection task* is unknown. Option 4 + viewing mitigates the clear and present danger of *this experiment's* non-blinding bias without introducing new uncertainties about training data quality or algorithm suitability.
  4.  **Calibration as a Proxy Ground Truth:** The consensus reference set, while not perfect, provides a practical, auditable benchmark within the lab's context, offering a significant improvement over unanchored scoring.

  **5. What Would Change Our Mind:**
  The Committee should revisit this policy and consider mandating full automation or blinding if evidence emerges suggesting that bias is operating at the level of *perceptual experience* or that the hybrid approach is insufficient to control *attention/judgment bias* for this specific task. **Operationally, this means:**

  *   If the lab's *separate IRR for the detection of contact events* (implemented under the new protocol) shows **persistently low agreement (< [Specify Threshold, e.g., Cohen's Kappa 0.7]) between coders scoring the *same clips* but who have been *differently primed* about the expected outcome** (e.g., one group told "Treated mice show less contact," another told "Treated mice show more contact," or one blinded). This would indicate expectations fundamentally alter what coders perceive or reliably attend to.
  *   Or, if the lab's data under the new hybrid protocol shows that **coder classifications systematically and significantly deviate from the consensus reference set classifications *in the direction of the hypothesized effect*, even after repeated calibration**, indicating judgment bias remains uncontrolled by the rules and reference.

  Either result would suggest the bias is more entrenched in perception/attention or resistant to the implemented judgment controls, warranting the more radical solution of removing the human coder from the loop (automation) or removing the expectation (full blinding).

  This recommendation balances the imperative for methodological rigor with practical constraints, directly targets the most probable and impactful sources of bias based on current understanding, and establishes clear criteria for future evaluation. We urge the Committee to adopt it.
