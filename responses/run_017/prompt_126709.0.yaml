  ### Ratings and Tiers for Moral Worth (0-10)

  I evaluated each case based on your four components: (i) **Rightness** (assumed present unless noted), (ii) **Guidance** (right-making features non-accidentally causally/explanatorily guide the action), (iii) **Conception** (agent represents the right-making features *as normative reasons*, not merely motivating), and (iv) **Robustness** (agent would act rightly in nearby variations where actual cited features are absent/weakened/swapped). I interpret (iii) as requiring the agent to represent the features as *normative* (i.e., as justifying the action, not just as something they happen to care about), as this aligns with standard accounts of acting for the right reasons (e.g., Markovits, Arpaly). Ratings are holistic but grounded in how well each component is satisfied. Higher scores indicate greater moral worth.

