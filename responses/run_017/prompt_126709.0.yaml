    - **Effect**: With Accuracy, Case 6 might rate 6/10 (partial credit for proximity to the core right-making feature), while Case 1 remains 1/10. Currently, they are 4 points apart, but Accuracy clarifies why Case 6 isn't lumped with Cases 1–4.  
  - **Integration**: Add Accuracy as a sub-component of (iii) or a modifier, scaling ratings when the represented reason is a proxy for the right-making feature. 

  ### Summary
  Your framework is robust but benefits from refining (iii) to require normative representation and adding Accuracy. The scalar approach captures nuances binary views miss, and robustness (iv) is essential (e.g., for Cases 6 and 8). The cases highlight that moral worth depends on *how* reasons are integrated, not just rightness. For further development, focus on calibrating Conception and testing Accuracy with cases like the firefighter example.
