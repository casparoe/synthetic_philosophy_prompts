  ### Needed Distinction
  - **Distinction**: **Accuracy of Conception**  
  - **Definition**: The degree to which the agent's represented reason matches the *actual* right-making features (operationalized by testing if the agent would act if the feature were absent or misidentified).  
  - **Why needed**: Your components don't discriminate between agents who represent reasons that approximate the right-making features (e.g., "doing good" broadly) vs. those with precise alignment. This matters for cases where Conception is partially satisfied but flawed.  
