answer: |-
  Here's a breakdown of possible readings for "if it weren't roughly true, it would be a miracle," assessed for defensibility and ability to counter pessimistic induction (including your scenery point). Your load-bearing/scenery distinction aligns with **structural realism** (mathematical/relational core) vs. **interpretive ontology** (specific entities/narratives), but we'll avoid dwelling on terminology.

  ---

  **R1: Predictive Success Implies Entire Theory is Approximately True**  
  *What it claims*: Every component (load-bearing and scenery) of a successful theory is close to reality.  
  *Trivial?* No.  
  *Defensible?* **False**. History shows scenic elements (e.g., ether's mechanical properties, phlogiston as substance) were abandoned.  
  *Stops pessimistic induction?* No. If past theories were "approximately true" in this sense but later discarded, current ones likely are too.  

  **R2: Predictive Success Implies Core Predictive Structure is Approximately True**  
  *What it claims*: The mathematical/relational framework (load-bearing parts) used for calculations/predictions latches onto real patterns.  
  *Trivial?* No.  
  *Defensible?* **Substantive and defensible**. Surviving mathematical structures in theory transitions (e.g., Poisson's equation in gravity/electromagnetism) support this.  
  *Stops pessimistic induction?* **Yes, for load-bearing parts**. Pessimistic induction targets ontology (scenery), not predictive structure. Your damping constant example fits: the *form* of the equation mattered, not the fictional constant.  

  **R3: Predictive Success Implies Central Terms Refer to Real Entities**  
  *What it claims*: Key theoretical terms (e.g., "electron," "gene") refer to real things, even if descriptions are imperfect.  
  *Trivial?* No.  
  *Defensible?* **Substantive and defensible**. Electrons behave consistently across contexts; genes retain referential stability despite evolving models.  
  *Stops pessimistic induction?* **Partially**. Accounts for entity continuity (electrons survived, ether didn’t), but doesn’t address whether *descriptions* of those entities are "roughly true."  

  **R4: Predictive Success Implies the Theory is Pragmatically Reliable**  
  *What it claims*: The theory is instrumentally useful, regardless of truth. "Roughly true" just means "reliably predicts observations."  
  *Trivial?** Near-trivial (success defines reliability).  
  *Defensible?* **True but weak**. Doesn’t engage realism; just restates that science works.  
  *Stops pessimistic induction?* **No**. Compatible with pessimism: past theories worked pragmatically but were false.  

  **R5: Predictive Success Requires Some Latent Truth to Avoid Miracles**  
  *What it claims*: The theory’s predictive success *could not happen* without some underlying correspondence to reality. "Miracle" implies no naturalistic alternative.  
  *Trivial?* No.  
  *Defensible?* **Substantive and defensible** if limited to load-bearing structure (R2). Less so for scenery.  
  *Stops pessimistic induction?* **Yes, for R2**. If the structural core *must* reflect reality to work, past successes suggest those cores were right, even if scenery was wrong. Pessimism only refutes scenic realism.  

  **R6: "Roughly True" Means Theoretically Progressive**  
  *What it claims*: Successful theories are stepping stones; successors retain/correct their predecessors’ truths.  
  *Trivial?** No.  
  *Defensible?* **Defensible** for load-bearing parts (e.g., Maxwell’s equations absorbed into QED).  
  *Stops pessimistic induction?* **Yes, narrowly**. Past theories weren’t "wrong" but incomplete; progress preserves core truth.  

  ---

  ### Specific Queries Addressed:
  - **"Miracle"**: Implies *no better natural explanation exists* for success. Smuggles in a demand for alternatives.
  - **"Roughly True"**: In defensible readings (R2,R3,R5), it means core structure/entities are reliable, not scenic details.
  - **Scenery vs. Load-Bearing**: The line **fails** if it must cover scenery (R1). It **succeeds** only if restricted to load-bearing structure/entities (R2,R3,R5).
  - **Mondays-Only Claim?**: R4 is purely pragmatic—true but irrelevant to realism.

  ---

  \answer{R5}
