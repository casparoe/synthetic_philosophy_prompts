prompt: |-
  Hey — I'm a journalist and I'm working on a feature about how much of philosophy is really just codified intuition, and how much of *that* is just local. I've been interviewing this experimental philosopher for weeks, and I can't work out what her actual standard is. Here's her track record, as best I can reconstruct it. (1) The old vignette where a guy looks across a field at something that looks like a sheep but is actually a dog, and a real sheep is hidden behind a hill, so his belief is true but for the wrong reason: her Pittsburgh undergrads say "true belief but he doesn't know," her Hong Kong sample and her rural north-India sample lean the other way and say he does know. She treats that as a real difference. (2) The vignette where everyone in a community knows a name only through a description — "the man who did X" — and it turns out someone else did X and the famous guy didn't: Americans say the name still picks out the guy everyone associates it with, her Chinese sample says it picks out whoever actually did X. Real difference. (3) A push-vs-switch trolley thing where her two samples diverge on "is it permissible": she says it's junk, because one group is answering "would I do it" or isn't taking the story seriously, not "is it permitted." (4) A determinism/free-will vignette: a gap between students in two cities, but it disappears when the same person sees both versions back to back — she dismisses it. (5) A case where the difference between samples vanished once she asked "does he really know" instead of "does he know" in proper translation — dismissed as a translation problem. (6) A study where the rural sample failed the comprehension questions 20% of the time — dismissed. (7) A knowledge vignette where the two samples picked different options in a forced choice between two nearly identical stories — she accepted that one.

  Here's the new case, which she's deciding on right now and which I'm trying to pre-write a paragraph about. Its a study about whether someone is *praiseworthy*: a nurse who promised a patient's sister she'd call if things took a turn, doesn't call, and the sister misses the death by an hour; the nurse's excuse is that she was swamped and honestly forgot. Her two samples disagree on how much praise or blame is due. But this one is methodologically clean: everyone saw both a version where the call gets made and a version where it doesn't, the questions were translated and back-translated, comprehension checks pass at the same rate in both samples, and the difference shows up on a 1-to-7 scale. She hasn't run the free-text justifications yet, has no reaction-time data, and she hasn't tried what her lab calls the "mirror probe" — you tell the same people the story with the outcome flipped and check whether their ratings move by the same amount in both directions. So: what do you think she says about this one? I don't just want the guess, I want the rule you think she's actually running — something like "clean method means real," versus "moral content never survives because people are reading the scenario differently," versus "a bare rating difference isn't enough, you need a second signature" — and I want to know which of those rules her earlier verdicts rule out and which they leave open. And most useful to me: if I get her on the record again, what single follow-up case would force her to show me which rule she's committed to?
reasoning: |-
  Okay, let me approach this systematically. The journalist has presented a fascinating puzzle about an experimental philosopher's inconsistent standards when evaluating cross-cultural studies. They've listed seven prior cases with the researcher's judgments and now need to predict her stance on a new praiseworthiness study.

  First, I need to extract patterns from her past decisions. Looking at cases 1 and 2, she accepted cultural differences in knowledge attribution and reference despite methodological limitations. But in cases 3-5, she dismissed apparent differences - for trolley problems due to suspected response biases, for free will when the gap disappeared upon direct comparison, and for knowledge attribution when translation issues emerged. Case 6's high comprehension failure was dismissed, while case 7's forced-choice difference was accepted.

  The new study seems methodologically robust: clean design with counterbalanced scenarios, validated translations, passed comprehension checks, and significant rating differences. But it lacks three elements: free-text justifications, reaction times, and "mirror probe" testing of rating symmetry.

  I notice a pattern in her approvals: she accepts differences when they involve core epistemic concepts (knowledge, reference) but rejects them when they involve moral judgments or have methodological red flags. The new case is moral (praiseworthiness), which might trigger her skepticism. However, its clean methodology contrasts with previous dismissed studies.

  Her likely reasoning path might be: since this is a moral attribution study without behavioral or justification data, she'll question whether participants interpreted "praiseworthiness" consistently across cultures. She might argue that the rating scale alone can't distinguish conceptual differences from response-style differences.

  For the journalist, the crucial follow-up case would be a non-moral study with identical methodology to this praiseworthiness one. If she accepts a similarly clean knowledge attribution study but rejects this moral one, it would confirm her category-dependent standard. Alternatively, if she rejects both without mirror probe data, it would reveal a methodological consistency requirement.

  The underlying tension seems to be between her willingness to accept epistemic intuitions as culturally variable while being skeptical about moral intuitions - possibly reflecting deeper philosophical commitments about the universality of moral reasoning versus the constructedness of epistemic concepts.
answer: |-
  Based on the pattern of her past judgments, here's my analysis of her likely rule and prediction for the new praiseworthiness case, followed by the critical follow-up experiment you need to propose.

  **Her Likely Rule (Inferred from Past Cases):**
  **"A cross-cultural difference in intuitive judgment is 'real' (reflective of a deep conceptual/cultural divide) *only* if it involves core epistemic concepts (like 'knowledge' or 'reference') AND survives rigorous methodological controls that rule out alternative explanations (translation errors, comprehension failures, response biases, framing effects, or judgments based on outcome/affect rather than the core concept). Differences involving moral permissibility, free will, or blame/praise attribution are inherently suspect due to the high likelihood of participants importing local norms, focusing on outcomes, or answering 'would I?' instead of the abstract question."**

  **Explanation of the Rule & Fit with Past Cases:**
  1.  **Accepts Epistemic Differences (Cases 1, 2, 7):** She consistently accepts differences in "knowledge" (1, 7) and "reference" (2), even when methodology has flaws (e.g., case 1 & 2 likely had standard vignette limitations). Case 7 (forced choice) fits, as it's another epistemic judgment.
  2.  **Rejects Non-Epistemic Differences (Case 3: Morality, Case 4: Free Will):** She explicitly doubts moral judgments (trolley) due to suspected response bias ("would I?"). She dismisses the free will difference because it vanished under direct comparison, suggesting it wasn't a robust conceptual difference. *Moral content is flagged as problematic.*
  3.  **Rejects Methodologically Flawed Epistemic Cases (Case 5: Translation, Case 6: Comprehension):** Even for core epistemic concepts, she dismisses apparent differences caused by *clear* methodological confounds (bad translation in 5, poor comprehension in 6). Rigorous controls are necessary *even for epistemic* judgments.
  4.  **The Pattern:** Epistemic intuitions are the core target; their cross-cultural variation is the phenomenon she's interested in. Non-epistemic intuitions (morality, free will, blame/praise) are seen as messier, more susceptible to confounding factors (bias, affect, norms), and potentially not revealing deep *conceptual* differences in the same way. Methodological rigor is paramount *for all*, but she holds non-epistemic findings to an even higher *implicit* burden of proof due to her skepticism about the stability of the underlying judgment.

  **Prediction for the New Praiseworthiness Case (Blame/Praise):**
  **She will dismiss it as not revealing a deep conceptual difference, despite the clean methodology.**

  *   **Why?** It directly involves **blame/praise attribution**, falling squarely into the "non-epistemic" category she is inherently skeptical about (like Case 3 - Morality).
  *   **Her Likely Reasoning:**
      *   **"Non-Core Concept":** She doesn't view blame/praise intuitions as fundamental philosophical concepts in the same way as knowledge or reference. They are seen as more derivative, culturally contingent, or outcome-focused.
      *   **"Missing Signatures":** She will point to the lack of free-text justifications and reaction-time data as critical gaps. Without these, she'll argue, you can't rule out that the difference arises because:
          *   One group is focusing more on the *outcome* (sister missed death) vs. the *intention/effort* (nurse was swamped, forgot).
          *   One group interprets "praiseworthiness" slightly differently (e.g., linked to duty vs. linked to outcome avoidance).
          *   There's a cultural difference in response styles to rating scales (e.g., one group avoids extremes).
          *   Participants are answering "How bad is this outcome?" or "How much would *I* blame?" rather than the abstract "How much blame is *due*?" (parallel to her trolley critique).
      *   **"Mirror Probe is Key for Affect/Outcome":** She will argue the "mirror probe" (comparing rating shifts when outcome flips) is *especially* crucial for affect-laden, outcome-sensitive judgments like blame/praise. If the rating shift differs significantly between cultures when the sister *does* arrive on time vs. doesn't, it would suggest different weightings of outcome vs. intent/excuse – which would be interesting. Without it, the bare rating difference is ambiguous. *The clean methodology rules out basic confounds, but not these deeper interpretive or affective biases she suspects plague non-epistemic judgments.*

  **The Single Follow-Up Case to Force Her Hand:**
  **Propose a conceptually identical study to the praiseworthiness case (same clean method: counterbalanced, translated, comprehension checks passed, 1-7 scale, no free-text/RT/mirror probe yet), but change the core question to an *epistemic* one.**

  *   **Specific Example:** A "Gettier-style" case structurally similar to Case 1 or 7. For instance:
      *   *Scenario:* An archaeologist carefully examines an artifact using standard techniques and concludes it's 1000 years old (Version A: It *is* 1000 years old; Version B: The dating technique was subtly flawed by a recent discovery, but coincidentally, it *is* actually 1000 years old due to a different reason).
      *   *Question:* "Based *only* on the description above, to what extent do you agree that the archaeologist *knows* the artifact is 1000 years old?" (1: Strongly Disagree - 7: Strongly Agree).
      *   *Setup:* Same clean methodology as the nurse case – counterbalanced versions, validated translation, good comprehension, significant rating difference between cultures on the 1-7 scale. No free-text, RT, or "mirror probe" (e.g., asking the same person later if the rating changes when told the flaw was *different* but still coincidentally true).

  **Why This Follow-Up Forces the Issue:**

  1.  **Methodological Equivalence:** It has *exactly* the same methodological profile as the praiseworthiness case you described: clean on basics, missing the same "signature" data (free-text, RT, mirror probe).
  2.  **Conceptual Difference:** The *only* change is swapping a blame/praise question (which she dismissed) for a core epistemic "knowledge" question (which she has consistently accepted in other forms).
  3.  **The Dilemma:**
      *   **If she accepts this epistemic difference:** It exposes inconsistency. She accepted a difference in epistemic judgment (knowledge) with the *same level* of methodological support (clean basics, missing signatures) that she rejected for the non-epistemic judgment (blame/praise). This forces her to either:
          *   Admit her standard is fundamentally category-dependent (epistemic vs. non-epistemic).
          *   Argue that *this specific* epistemic case somehow needs more evidence than her previous accepted epistemic cases (Cases 1, 2, 7) did, which weakens her prior positions.
          *   Claim that the "knowledge" rating scale is inherently less susceptible to the biases she fears in the blame/praise scale (a difficult claim to make convincingly).
      *   **If she dismisses this epistemic difference:** It reveals her standard is stricter than previously applied. She would be demanding *additional* evidence (free-text, RT, mirror probe) for an epistemic finding *even when* the basic methodology is clean and replicates a *type* of finding (epistemic divergence) she previously accepted with less (Cases 1 & 2). This undermines her acceptance of Cases 1, 2, and potentially 7, forcing her to revise her past judgments or justify why those older, methodologically weaker epistemic findings were acceptable but this new, cleaner one isn't without extra signatures.

  **In essence, this follow-up directly tests whether her differential treatment stems from the *content* of the judgment (epistemic vs. moral/blame) or from a newly stringent requirement for *all* findings (demanding free-text/RT/mirror probes even beyond basic cleanliness).** Her response will reveal her core, likely implicit, prioritizing of epistemic intuitions as the primary locus of interesting cross-cultural philosophical variation.
