prompt: |-
  Hey, hoping you can help me think something through. I'm a volunteer on the steering committee of one of those neighborhood assembly things my city runs — residents deliberate on a topic for six Saturdays and we put out a report that goes to the council, and this year it also goes onto the ballot as an official recommendation. Our written guidance is basically one vague sentence about reasons needing to be ones other participants can engage with and answer, so all the actual content lives in the precedents we've built up, and I've been going through them because we have to rule on a new submission next weekend and I genuinely can't tell what we've been doing. My roommate, who's in a political theory PhD program, says we're obviously running a two-tier Rawlsian thing where faith is fine in the room but can't appear as a reason in the official output; another member says we're really just striking arguments that punch down, religious or not.

  The precedents, roughly: (1) on a homeless shelter siting, someone argued the city owes shelter to everyone because every person bears the image of God and nobody is disposable — no scripture, no secular backup — and we let that into the report, although two of us grumbled; (2) a Quaker argued for funding a mental health crisis team instead of more police, citing the peace testimony and also giving secular reasons about response times and cost, and we let the whole thing stand in the room but the report carried only the secular reasons; (3) an evangelical guy opposed a safe consumption site, citing a New Testament verse about the body being a temple and saying users were desecrating what God gave them, and offered nothing secular — we let him say it in the small group as his position, but we struck it as a reason from the report; (4) during a row over an LGBTQ-inclusive curriculum, someone said scripture plainly condemns homosexual acts and the city should say so, and he did bring secular arguments about parental choice and age-appropriateness but said they were fine but secondary — we told him he could state his opposition and could use the parental-choice argument, but not that reason, in any forum we convene, and we did let a secular parent make basically the parental-choice argument in the report; (5) a pastor arguing for tenant legal aid quoted Exodus and Amos about oppression and also gave a secular argument about eviction costs, and we kept the substance in the report but trimmed the chapter and verse; (6) on encampments, a resident argued unhoused people should be moved out of the city because they've chosen to live like animals and the rest of us shouldn't have to pay — completely secular — and we struck that everywhere.

  New case: we're finalizing the report on a ballot measure to scrap a planned jail expansion and fund community mental health and housing programs instead, and the imam of a local mosque wants his reasoning in the official recommendation. He has a strong secular case — recidivism data, cost per bed, the usual — but he also wants the report to cite Qur'anic passages about the community's duty to debtors, strangers and the sick, to describe people in the jail as our brothers and sisters rather than refuse, and to include a sentence saying the city stands under God's judgment for how it treats the people it locks up. So: lay out the candidate rules that fit our track record — more than the two we've been arguing about, please, I want at least three or four — and say what each predicts about his submission, ideally seperately for the secular case, the scripture citations, the brothers-and-sisters framing, and the God's-judgment sentence. Then give me your best guess at what we will in fact do given how we've behaved, and seperately what we should do if we want to be consistent with ourselves, since I suspect those come apart. Tell me which precedent is the closest analog and why the others are distinguishable, and if our precedents genuinely underdetermine it, spell out what we'd be committing to with each choice — I care alot about what we're signing up for the next time somebody cites a text on the other side. And name the one further case that would actually tell these rules apart, if there is one; also feel free to tell me we've just been inconsistent and there's no rule to be found. Our funders are a UK foundation, so the writeup has to be in British English — thanks!
reasoning: |-
  Okay, this user is deeply involved in civic deliberation processes and needs help untangling their committee's inconsistent precedents on religious reasoning in official reports. They're clearly frustrated by the ambiguity and wants systematic analysis before next weekend's ruling. 

  Hmm, the complexity here is fascinating - it's not just about legalistic rule-making but about the philosophy of public reason in grassroots democracy. The user mentions Rawls but seems more concerned with practical consistency than theory. Smart of them to ask for multiple candidate rules - that shows they understand precedents can be interpreted different ways.

  First I need to extract all relevant precedents:
  - Case 1 (homeless shelter): Pure religious reasoning allowed without secular backup
  - Case 2 (police funding): Religious reasoning allowed in discussion but stripped from report
  - Case 3 (drug site): Religious objection struck entirely
  - Case 4 (LGBTQ curriculum): Explicitly prohibited religious reasoning even in discussion
  - Case 5 (tenant aid): Religious references edited out but substance retained
  - Case 6 (encampments): Secular dehumanizing language struck

  The new case with the imam has four distinct elements: secular arguments, Qur'an citations, "brothers/sisters" framing, and "God's judgment" statement. Need to evaluate each separately under different possible rules.

  Developing candidate rules:
  1. The "Secular Translation" rule (only secularized religious substance survives)
  2. The "No Divine Sanctions" rule (strikes God's judgment language specifically)
  3. The "Dignity Threshold" rule (rejects dehumanizing language regardless of source)
  4. The "Majoritarian Comfort" rule (reflects which religious expressions dominant groups tolerate)

  For the imam's submission:
  - Secular case: Safe under all rules
  - Brothers/sisters framing: Likely passes Rules 1/3, borderline under Rule 2, fails Rule 4
  - Scripture citations: Fails Rules 1/2/4, may pass Rule 3
  - God's judgment: Fails all except possibly Rule 4 if majority-Christian committee

  Closest precedent is Case 5 (tenant aid) - similar religious framing of social justice issue. But the "God's judgment" language echoes Case 3's rejected phrasing. 

  Predicting the committee will likely: 
  - Keep secular arguments 
  - Allow brothers/sisters framing 
  - Trim scripture citations 
  - Remove God's judgment line

  But for true consistency (per Case 1 and 5 substance), they should allow brothers/sisters while editing out chapter/verse and divine sanctions. The unresolved tension is whether religious language is acceptable only when it aligns with liberal values - which surfaces in Case 4's asymmetry.

  The test case would be a conservative religious argument using dignified language (e.g. opposing abortion citing "sanctity of life"). That would force the committee to choose between the Dignity Threshold and Secular Translation rules.
answer: |-
  Right, let's crack this with surgical precision. Your precedents reveal competing principles, so I'll lay out four coherent candidate rules that fit the pattern (labelled R1-R4), apply them to the imam's submission element-by-element, predict your committee's likely action, advise on consistency, identify the closest precedent, and flag unresolved tensions. All in British English per funder requirements.  

  **Candidate Rules Derived From Precedents:**  

  1.  **R1: Secular Translation Principle**  
      *Reasoning must be translatable into secular, publicly accessible terms for the report, even if religious motivation is acknowledged in deliberation.*  
      *Fits:* Case 2 (Quaker peace testimony dropped, secular reasons kept), Case 5 (chapter/verse trimmed, substance kept), Case 3 (no translation possible, struck).  

  2.  **R2: No Divine Sanctions Principle**  
      *Statements framing policy outcomes as divine commands/judgments (e.g., "God requires X," "City stands under God's judgment") are excluded, but religiously inspired moral claims about human dignity/justice are permissible if framed generally.*  
      *Fits:* Case 3 ("desecrating God's temple" struck), Case 4 (explicit condemnation based on scripture prohibited), contrasts with Case 1 ("image of God" allowed as dignifying).  

  3.  **R3: Dignity/Punching-Down Threshold**  
      *Arguments are excluded if they dehumanise or "punch down" (regardless of religious/secular basis), but included if they affirm universal dignity (even if religiously grounded). Religious language itself isn't disqualifying if it clears this bar.*  
      *Fits:* Case 1 ("image of God" affirms dignity, included), Case 6 ("live like animals" punches down, excluded), Case 4 (scriptural condemnation seen as punching down).  

  4.  **R4: Majoritarian Comfort Principle (Unspoken but evident)**  
      *Familiar, broadly theistic language referencing "common ground" concepts (e.g., human dignity, justice) is tolerated in reports, while specific sectarian claims or challenges to dominant norms are excluded, especially if politically contentious.*  
      *Fits:* Case 1 (vague "image of God" acceptable to many), Case 5 (prophetic justice trimmed but substance kept), Case 3/4 (evangelical claims challenging policy struck), Case 2 (Quaker testimony less familiar, excluded).  

  **Application to Imam's Submission:**  

  | Element                 | R1: Secular Translation | R2: No Divine Sanctions | R3: Dignity Threshold | R4: Majoritarian Comfort |
  | :---------------------- | :---------------------- | :---------------------- | :-------------------- | :----------------------- |
  | **Strong Secular Case** | KEEP (obvious)          | KEEP (obvious)          | KEEP (obvious)        | KEEP (obvious)           |
  | **Qur'anic Citations**  | STRUCK (not translated) | KEEP? (duty to needy)   | KEEP (affirms duty)   | STRUCK (sectarian)       |
  | **"Brothers/Sisters"**  | KEEP (translatable)     | KEEP (not a sanction)   | KEEP (affirms dignity)| KEEP? (vague theism)     |
  | **"God's Judgment"**    | STRUCK (not secular)    | STRUCK (divine sanction)| AMBIGUOUS (could be seen as shaming) | STRUCK (confrontational) |

  **Prediction vs. Consistency:**  

  *   **Prediction (What Your Committee Will Likely Do):**  
      They'll **keep the secular case entirely**. They'll likely **strike the specific Qur'anic citations** (citing Case 2 & 5 precedent). They'll probably **allow "brothers and sisters"** (seeing it as similar to Case 1's "image of God" – affirming dignity). They'll almost certainly **strike "God's judgment"** (citing Case 3 precedent – divine sanction language). *Why?* R4 (Majoritarian Comfort) is the strongest unspoken driver. "Brothers/sisters" feels vaguely Christian-adjacent and dignifying; explicit Qur'an and "judgment" feel foreign and challenging. R2 also supports striking "judgment."  

  *   **Consistency Recommendation (What You *Should* Do to be Consistent):**  
      To be consistent with **Case 1 (Image of God)** and **Case 5 (Prophetic Justice Substance)**, you should:  
      *   **Keep the secular case.**
      *   **Allow "brothers and sisters" framing** (direct analog to "image of God" – universal dignity, no scripture cited).
      *   **Strike the specific Qur'anic citations** (consistent with trimming chapter/verse in Case 5).
      *   **Strike "God's judgment"** (consistent with striking divine sanction language in Case 3).  
      *Rationale:* This applies R1 (translation) and R2 (no sanctions) most cleanly. R3 supports keeping "brothers/sisters" but provides less clear guidance on "judgment."

  **Closest Precedent & Distinguishing Others:**  

  *   **Closest Analog: Case 5 (Pastor, Tenant Aid - Exodus/Amos cited, secular arguments, chapter/verse trimmed, substance kept).**  
      *   **Similarities:** Religious leader arguing for social justice policy, citing scripture *and* offering secular reasons, framing oppression/duty. "Brothers/sisters" is analogous to the retained *substance* of the prophetic call for justice. The Qur'anic citations are analogous to the specific "Exodus/Amos" trimmed.
      *   **Why Others Are Distinguishable:**
          *   *Case 1:* Pure religious reason allowed *without* secular backup *and* without specific citations/"judgment" language. Imam has secular backup and uses specific text.
          *   *Case 2:* Religious reason *only* allowed in deliberation, not report. Imam wants it *in* the report.
          *   *Case 3:* Pure religious reason *with* dehumanising/divine sanction language ("desecrating"), no secular backup. Imam has secular backup, affirms dignity ("brothers/sisters"), though "judgment" is similar sanction language.
          *   *Case 4:* Explicitly framed as *condemnation* based solely on scripture, seen as punching down. Imam's framing is about *duty/care*.
          *   *Case 6:* Secular but blatantly dehumanising. Imam's language is dignifying.

  **Undetermined Commitment & Test Case:**  

  Your precedents **undetermine the core tension:** Is religious language excluded because it's *religious* (R1/R4 leaning) or because of its *specific framing* (R2/R3 - divine sanctions/punching down vs. affirming dignity)?  

  *   **Commitment by Choice:**
      *   **Allowing "Brothers/Sisters" + Striking Citations/Judgment:** Commits you to R1/R2. Religious *motivation* expressed in vague, dignifying, non-sanctioning terms is okay in the report; specific texts and divine sanctions are not. Future cases would turn on whether language is "translatable" and avoids framing policy as divine command/judgment.
      *   **Striking *Only* "God's Judgment":** Would lean towards R2/R3. Affirming dignity via religious language (even specific citations?) is acceptable, but invoking divine *consequences* is not. Future cases turn on whether language implies divine reward/punishment for policy choices.
      *   **Striking Citations & Judgment, Allowing "Brothers/Sisters":** (The predicted/consistent path) avoids settling the core tension. It *looks* like R1/R2 but leaves ambiguity about why citations are different from "image of God."

  *   **The Test Case That Would Clarify:**  
      A submission arguing **against harm reduction services** using:  
      *"Addiction degrades the inherent dignity of the person, created in God's image. Providing needles facilitates this sin and offends God. We have a secular duty to fund recovery, not enable self-destruction."*  
      *   **R1:** Strikes "dignity/image/sin/offends God" - keeps secular duty/recovery argument.
      *   **R2:** Strikes "offends God" (divine sanction) but *might* allow "dignity/image" (affirming) and "sin" (contentious, possibly sanctioning). Keeps secular argument.
      *   **R3:** Strikes whole argument? "Degrades dignity" + "sin" + "self-destruction" could be seen as punching down/shaming users, despite starting with "dignity." Secular argument might be kept if stripped of context.
      *   **R4:** Likely strikes all religious language (uncomfortable, challenging policy), keeps secular argument if strong.  
      This pits the *affirming* use of religious language ("image of God") against a *policy conclusion* seen as harmful/punching down by others, directly testing R2/R3 vs. R1/R4.

  **Conclusion:**  
  Your committee hasn't been purely inconsistent, but has prioritised **dignity-affirming language (R3) and avoiding divine sanctions (R2)** while inconsistently handling *how* religion enters the report, influenced by majoritarian comfort (R4). **Case 5** is the clearest guide. For consistency: **Keep the secular case and the "brothers and sisters" framing, but strike the specific Qur'anic citations and the "God's judgment" sentence.** This aligns with trimming scripture (Case 5), allowing universal dignifying language (Case 1), and prohibiting divine sanctions (Case 3). Predict they'll do exactly this, but it dodges fully committing to *why* scripture is treated differently than "image of God." The test case above would force that clarification. Good luck next weekend!
