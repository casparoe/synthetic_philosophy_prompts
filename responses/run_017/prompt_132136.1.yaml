prompt: |-
  I'm in the second year of a PhD in evolutionary biology, and this term I'm running the graduate seminar in which every discussion of a trait collapses into the same stalemate: half the room wants to know what the trait is for, the other half wants to know why it is there, and everyone slides between the two without noticing. Before I assign any more of the classic adaptationism debate — the spandrels critique, the exaptation literature, optimality modelling, the comparative method — I want a specification of what an adequate answer to the question "why does this population have this trait?" would actually have to deliver, on either side of the dispute. So please write me the desiderata: what a claim that a trait is an adaptation must establish, and, symmetrically, what a claim that it is a structural byproduct, a developmental constraint, a co-opted relic, or drift must establish, with the case or consideration that motivates each requirement. Include the distinctions a theory in this area is not allowed to collapse — current utility versus historical origin, the trait now having an effect versus having been selected for it, selection maintaining a variant versus selection having built it — and say whether an adequate account may return a mixed verdict or must pick one. I also want a criterion about how traits get individuated in the first place, since in my material it is often unclear whether we are looking at one trait or three. Mark which requirements are non-negotiable and which are really methodological preferences of one camp, tell me which single requirement excludes the most candidate explanations, and flag any pair you suspect cannot be jointly satisfied — that is the part I most want, since I suspect the list is asking for demonstration-grade evidence from every trait while also wanting a programme general enough to be worth running.

  To keep this from being an exercise in recall, apply the criteria to a case I've constructed rather than the three textbook examples my students always reach for. A lineage of alpine skinks has a bony supraorbital crest in four of eleven populations; the four are exactly the populations that overlap a visually hunting bird, clay models with the crest are attacked less often than shaved models, and a genome scan shows a recent sweep in the crest region. Against this: five years of mark–recapture finds no survivorship difference between crested and crestless individuals, the crest forms as a mechanical consequence of a shifted jaw-adductor attachment that does improve bite performance, and in the sister genus the same outgrowth serves in burrowing. Each desideratum should say how this case fares under it, and the list should end by naming the single further observation that would do most to settle it. Then, briefly, say whether a trait whose shape matches an engineering optimum to within a few percent but which is invariant across forty species can ever satisfy the list — where the only comparison available is the engineering model itself. Keep any scorecard of the named positions to a few lines; the criteria and their motivating cases are what I need.
reasoning: |-
  We are constructing a set of desiderata for establishing claims about why a population has a trait, both for adaptationist explanations and for non-adaptationist explanations (structural byproduct, developmental constraint, co-opted relic, drift). We must avoid collapsing key distinctions. We then apply these to a novel case about alpine skinks with a bony supraorbital crest.

  ## Key Distinctions (Non-Negotiable)

  1. **Current Utility vs. Historical Origin**: A trait may currently be used for a function (current utility) without that being the reason it originally appeared (historical origin). Conversely, a trait may have lost its original function but still be present.
  2. **Having an Effect vs. Having Been Selected For It**: A trait may have a beneficial effect without having been shaped by selection for that effect (e.g., it might be a byproduct). Selection for a trait requires that the effect caused the spread of the trait.
  3. **Selection Maintaining a Variant vs. Selection Having Built It**: A trait may be maintained by selection (i.e., it is currently under stabilizing selection) without having been built by selection (i.e., it may have arisen for other reasons). Conversely, a trait built by selection might no longer be under selection.

  ## Desiderata for an Adaptationist Claim (that a trait is an adaptation)

  An adaptationist claim must establish:

  1. **Historical Selection for the Trait** (Non-negotiable): The trait must have arisen and spread in the population due to natural selection for the specific function it currently performs (or performed in the past). This requires evidence that the trait conferred a fitness advantage in the ancestral environment and that this advantage caused the increase in frequency of the trait. *Motivation: Without this, we cannot distinguish adaptation from exaptation or other non-selective processes.*  
     *Skink case: The genome scan showing a recent sweep in the crest region suggests historical selection, but the mark-recapture data showing no current survivorship difference complicates the picture. Also, the sweep might be for the jaw-adductor shift, not the crest per se.*

  2. **Current or Past Functional Advantage** (Non-negotiable): The trait must currently, or at the time of its fixation, have provided a functional advantage that contributed to fitness (e.g., survival or reproduction). *Motivation: Adaptation requires that the trait actually does something beneficial.*  
     *Skink case: The clay model experiment shows that the crest reduces predation by birds (current utility). However, the mark-recapture data fails to show a survivorship difference in the wild. This discrepancy must be resolved.*

  3. **Exclusion of Alternative Explanations** (Non-negotiable): The adaptationist claim must rule out that the trait is a byproduct of another adaptation, a developmental constraint, a co-opted relic, or drift. *Motivation: Without ruling out alternatives, we cannot be confident in the adaptationist explanation.*  
     *Skink case: The crest forms as a mechanical consequence of a shifted jaw-adductor attachment that improves bite performance. This suggests the crest might be a byproduct (structural constraint) of an adaptation for biting. Also, the sister genus using the same outgrowth for burrowing suggests possible exaptation or shared developmental pathway.*

  4. **Trait Individuation** (Methodological preference, but critical): The trait must be defined in a way that is biologically meaningful and not arbitrary. For adaptation, the trait should be a distinct unit that can be selected independently. *Motivation: If the trait is not a discrete unit, it may not be possible to select for it without affecting other traits.*  
     *Skink case: Is the supraorbital crest a separate trait or just part of the jaw system? The fact that it forms as a consequence of the jaw-adductor shift blurs the individuation. If the crest is not separable from the jaw adaptation, then it might not be an independent adaptation.*

  ## Desiderata for Non-Adaptationist Claims

  ### For a Structural Byproduct/Developmental Constraint Claim

  1. **Demonstration of Mechanistic Link** (Non-negotiable): Show that the trait arises as an inevitable or highly probable consequence of development or structure, without being directly selected for. *Motivation: Byproducts are not adaptations but arise from other selected features.*  
     *Skink case: The crest forms as a mechanical consequence of a shifted jaw-adductor attachment. This is strong evidence for a structural byproduct.*

  2. **Lack of Direct Selective History** (Non-negotiable): There must be no evidence that the trait itself was under direct selection in the past. *Motivation: If there was direct selection, it is an adaptation, not a byproduct.*  
     *Skink case: The genome scan shows a recent sweep in the crest region. This might indicate selection on the crest or on the jaw system. If the sweep is for the jaw shift, then the crest might be a byproduct. But if the sweep is for the crest itself (e.g., due to predation), then it is an adaptation.*

  ### For a Co-opted Relic (Exaptation) Claim

  1. **Evidence of Prior Existence and Function** (Non-negotiable): The trait must have existed prior to acquiring its current function and had a different function (or no function) in the past. *Motivation: Exaptation requires a shift in function.*  
     *Skink case: In the sister genus, the same outgrowth is used for burrowing. This suggests that the trait might have been co-opted from an ancestral function (burrowing) to a new function (predation avoidance). However, note that the current population does not burrow, and the crest might be a derived trait.*

  2. **Evidence of Functional Shift** (Non-negotiable): There must be evidence that the trait was co-opted for a new function without having been originally selected for that function. *Motivation: Without a shift, it's not an exaptation.*  
     *Skink case: The predation avoidance function (suggested by the clay models) might be a new function. But the mark-recapture data does not show a current advantage, and the sister genus suggests an ancestral function. However, the sweep might indicate recent selection for the new function.*

  ### For Drift

  1. **Neutrality and Random Fixation** (Non-negotiable): The trait must be selectively neutral (or nearly neutral) and its fixation must be explainable by random processes (e.g., genetic drift). *Motivation: Drift requires the absence of selection.*  
     *Skink case: The genome scan showing a recent sweep is strong evidence against drift (sweeps indicate selection). Also, the clay model experiment shows a functional effect, so drift is unlikely.*

  ## Additional Considerations

  - **Mixed Verdicts**: An adequate account may return a mixed verdict. For example, a trait might have originated as a byproduct but then been co-opted and modified by selection (exaptation). Or a trait might be under current selection but have been built by prior selection for a different function. The key is to disentangle the history.

  - **Trait Individuation**: This is a critical and often overlooked issue. Traits are not always discrete. We must define traits based on developmental modules, functional units, or genetic independence. *In the skink case, the crest might be part of a larger cranial system. If the crest cannot vary independently of the jaw attachment, then it may not be a trait that can be selected for alone.*

  ## Which Requirement Excludes the Most Candidate Explanations?

  The requirement to **exclude alternative explanations** (for adaptation) and the requirement to **demonstrate a mechanistic link** (for byproduct) are the most stringent because they force the consideration of multiple hypotheses and require evidence that rules out competing scenarios. Without this, any story can be told.

  ## Potential Incompatible Pairs

  - **Historical Selection vs. Mechanistic Link for Byproduct**: If we require strong evidence for historical selection (e.g., a selective sweep) and also a mechanistic link to another trait (for byproduct), these might conflict. In the skink case, the sweep might be interpreted as selection for the crest (adaptation) but the mechanistic link suggests it's a byproduct of jaw adaptation. We must resolve whether the sweep is for the crest or the jaw.

  - **Current Utility vs. Historical Origin**: We might have current utility (e.g., reduced predation in clay models) but without historical evidence that the trait spread because of that utility (e.g., the mark-recapture shows no current difference). This discrepancy must be explained.

  ## Application to the Skink Case

  - **Adaptation Claim**: 
    - Historical selection: The sweep suggests selection, but it could be for the jaw shift, not the crest.
    - Functional advantage: Clay models show reduced predation, but mark-recapture does not. Why the discrepancy? (Perhaps the crest is only advantageous in specific contexts, or the mark-recapture sample size is small, or the birds have learned, etc.)
    - Exclusion of alternatives: The crest is linked to the jaw adaptation, and the sister genus shows a different function, so alternatives are not ruled out.
    - Trait individuation: The crest is developmentally tied to the jaw, so it may not be an independent trait.

  - **Structural Byproduct Claim**:
    - Mechanistic link: Strong evidence from the jaw-adductor shift causing the crest.
    - Lack of direct selective history: The sweep complicates this. If the sweep is for the jaw, then the crest is a byproduct. If for the crest, then it's an adaptation.

  - **Exaptation Claim**:
    - Prior existence and function: The sister genus uses it for burrowing, suggesting an ancestral function.
    - Functional shift: The clay models suggest a new function (predation avoidance). But the mark-recapture doesn't support current utility, and the sweep might indicate recent selection for this new function.

  - **Drift**: Ruled out by the sweep and functional evidence.

  **Mixed Verdict**: The crest might have originated as a byproduct of the jaw adaptation (structural byproduct) and then been co-opted for a new function (exaptation) under recent selection (sweep) for reducing predation. However, the lack of current survivorship difference is puzzling. The clay model experiment and the sweep support a recent adaptive function, but the developmental link and the sister genus suggest an exapted byproduct.

  ## The Single Further Observation That Would Do Most to Settle It

  **Examine the genomic region of the sweep in detail to determine whether the selected alleles are associated with the crest specifically or with the jaw-adductor shift (and thus the crest as a byproduct).** If the selected alleles are in a gene that directly affects crest development independently of the jaw, then adaptation for the crest is supported. If the selected alleles are in a gene that affects the jaw muscle attachment and the crest is a passive consequence, then the byproduct+exaptation scenario is more likely.

  ## The Engineering Optimum Case

  **Question**: Can a trait whose shape matches an engineering optimum to within a few percent but which is invariant across forty species satisfy the list? The only comparison is the engineering model.

  - **Adaptation Claim**: Without variation, it is difficult to establish historical selection because we cannot test for fitness differences. The match to an engineering optimum suggests that the trait is adaptive, but it does not establish that selection built it (it could be a physical constraint). Also, without variation, we cannot rule out that the trait is a developmental constraint that happens to match the optimum. The invariance might indicate stabilizing selection, but it could also indicate lack of genetic variation or strong constraints.

  - **Non-adaptationist Claim**: The invariance might be due to developmental constraint or physical law. Without variation, we cannot test for drift or exaptation.

  **Verdict**: This case would struggle to satisfy the adaptation desiderata because we lack evidence of historical selection and cannot exclude constraints. The engineering match is suggestive but not sufficient. We would need evidence of variation in the past (e.g., fossil record) or genetic evidence of selection. Without any comparative data (only one trait state in 40 species), we cannot use the comparative method. Thus, the case does not meet the non-negotiable requirements for an adaptation claim (exclusion of alternatives, historical selection) or for a non-adaptationist claim (we cannot demonstrate the constraint without variation). The trait might be an adaptation, but we cannot establish it with the available evidence.

  ## Scorecard of Named Positions

  - **Adaptationists**: Focus on current utility and design; require evidence of selection and function.
  - **Non-adaptationists**: Emphasize alternatives (byproducts, constraints, exaptation, drift); require evidence of mechanistic links and lack of direct selection.

  The criteria above aim to force both sides to meet higher evidentiary standards and avoid collapsing the key distinctions.
answer: |-
  Below is a structured set of desiderata for evaluating claims about why a population has a trait, designed to clarify the adaptationism debate. The criteria are derived from foundational concepts in evolutionary biology (e.g., Gould and Lewontin's "spandrels" critique, exaptation, optimality models) and emphasize non-negotiable distinctions to prevent conceptual sliding. Each desideratum specifies:  
  - **What must be established** for a claim (adaptation vs. non-adaptation).  
  - **Motivation** (the case or consideration driving the requirement).  
  - **Non-negotiable vs. methodological preference** (marked as **NN** or **MP**).  
  - **Application to your alpine skink case**.  

  I then address trait individuation, mixed verdicts, the most excluding requirement, potentially incompatible pairs, the engineering optimum case, and a brief scorecard. The skink case is evaluated throughout, and I identify the single most decisive further observation.  

  ---

  ### **Core Distinctions (Non-Negotiable)**  
  These must **not** be collapsed:  
  1. **Current utility vs. historical origin** (**NN**): What the trait *does now* (e.g., deters predators) vs. *why it arose* (e.g., selection, constraint).  
  2. **Trait having an effect vs. being selected for that effect** (**NN**): A trait may have a beneficial effect (e.g., camouflage) without having been shaped *by selection for that effect* (e.g., it arose via drift).  
  3. **Selection maintaining vs. building a trait** (**NN**): Stabilizing selection preserving a trait ≠ directional selection constructing it.  
  4. **Function vs. evolutionary mechanism** (**NN**): "What it is for" (teleology) vs. "how it got there" (causal history).  

  ---

  ### **Desiderata for Adaptation Claims**  
  To claim a trait is an *adaptation* (shaped by selection for a specific function), one must establish:  

  1. **Historical selective advantage** (**NN**):  
     - **Must establish**: The trait increased in frequency due to selection *for its current (or ancestral) function* in a past environment. Requires evidence of fitness differences linked to the trait during its spread.  
     - **Motivation**: Without this, exaptation or drift could explain presence (e.g., bird feathers initially for insulation, later co-opted for flight).  
     - **Skink case**: Genome scan shows a recent sweep, suggesting historical selection. *But* the sweep could be for the jaw-adductor shift (improving bite performance), not the crest itself. Inconclusive.  

  2. **Current/past functional specificity** (**NN**):  
     - **Must establish**: The trait delivers a measurable fitness benefit *for a specific function* (e.g., survival, reproduction) that exceeds costs. This benefit must not be incidental.  
     - **Motivation**: Optimality models fail if benefits are marginal or shared with other traits (e.g., human chin as a byproduct of jaw evolution).  
     - **Skink case**: Clay models show reduced bird attacks (current utility), but mark-recapture finds no survivorship difference. Contradiction suggests the effect may be context-dependent or negligible in the wild.  

  3. **Exclusion of non-adaptive alternatives** (**NN**):  
     - **Must establish**: The trait is not better explained by structural byproducts, constraints, exaptation, or drift. Requires testing alternatives.  
     - **Motivation**: Spandrels critique (e.g., architectural constraints in snail coiling).  
     - **Skink case**: Crest is a mechanical byproduct of jaw adaptation (improves bite). Sister genus uses it for burrowing (exaptation potential). Not excluded.  

  4. **Trait autonomy** (**MP** for adaptationists):  
     - **Must establish**: The trait can be meaningfully individuated from correlated features (e.g., genetically or developmentally modular).  
     - **Motivation**: Adaptationists often assume traits are discrete targets of selection (e.g., elephant tusk size), but critics argue traits are rarely independent.  
     - **Skink case**: Crest is developmentally tied to jaw-adductor shift—likely not autonomous. Weak for adaptation.  

  ---

  ### **Desiderata for Non-Adaptationist Claims**  
  To claim a trait is a **structural byproduct, developmental constraint, co-opted relic (exaptation), or drift**, one must establish:  

  1. **Developmental/structural inevitability** (**NN** for byproduct/constraint):  
     - **Must establish**: The trait arises predictably from growth laws, physical constraints, or pleiotropy (e.g., spandrels in San Marco).  
     - **Motivation**: Without this, adaptation is default (e.g., vertebrate eye blind spot as a byproduct of optic nerve).  
     - **Skink case**: Crest forms mechanically from jaw-adductor shift—strong evidence for byproduct.  

  2. **Historical non-function or functional shift** (**NN** for exaptation):  
     - **Must establish**: For exaptation, the trait existed *before* its current function and was not selected for it (e.g., bird feathers co-opted from insulation).  
     - **Motivation**: Gould & Vrba’s exaptation: current utility ≠ original cause.  
     - **Skink case**: Sister genus uses crest for burrowing—suggests possible exaptation from an ancestral function.  

  3. **Selective neutrality or drift-compatible dynamics** (**NN** for drift):  
     - **Must establish**: The trait has no significant fitness effect, and its frequency changes align with neutral expectations (e.g., allele fixation in small populations).  
     - **Motivation**: Kimura’s neutral theory; traits can fix without selection.  
     - **Skink case**: Sweep suggests selection, not drift. Ruled out.  

  4. **Constraint persistence** (**MP** for non-adaptationists):  
     - **Must establish**: For constraints, the trait cannot evolve toward an optimum due to genetic/developmental limits (e.g., mammalian cervical vertebrae count).  
     - **Motivation**: Critics of optimality stress limits to selection.  
     - **Skink case**: Invariant link to jaw-adductor shift suggests constraint.  

  ---

  ### **Trait Individuation: Overarching Criterion**  
  - **Requirement**: Traits must be defined by **functional or developmental modularity** (**NN**). A "trait" is valid if it can vary semi-independently (e.g., via mutations affecting only it) or performs a distinct function.  
  - **Motivation**: Arbitrary individuation inflates adaptationist claims (e.g., is "hand" one trait or five digits?).  
  - **Skink case**: Crest is developmentally fused to jaw system—likely not a distinct trait. Weak for adaptation.  

  ---

  ### **Mixed Verdicts, Most Excluding Requirement, and Incompatible Pairs**  
  - **Mixed verdicts allowed?** Yes. A trait can have multiple phases (e.g., byproduct → exaptation → adaptation). The skink crest could be a byproduct (jaw shift) with later exaptation (predation shield).  
  - **Most excluding requirement**: **Exclusion of alternatives** (for adaptation) and **developmental/structural inevitability** (for byproduct). These force rigorous evidence and eliminate "just-so" stories.  
  - **Potentially incompatible pair**: **Historical selective advantage** (adaptation) and **Developmental inevitability** (byproduct). If a trait is *inevitable* due to constraints, it cannot have a *historical selective origin* independent of those constraints. In the skink case, the sweep suggests selection, but the jaw link suggests inevitability—tension exists.  

  ---

  ### **Application to Skink Case: Summary**  
  - **Adaptation claims**: Weak. Historical selection (sweep) is present but may target jaw, not crest; functional benefit is inconsistent (clay vs. mark-recapture); alternatives not excluded; trait not autonomous.  
  - **Byproduct/constraint claims**: Strong. Crest is mechanically tied to jaw adaptation; sister genus suggests non-crest function.  
  - **Exaptation claims**: Plausible. Crest may have been co-opted from burrowing to predation defense, but current utility is ambiguous.  
  - **Drift claims**: Ruled out by sweep.  
  - **Mixed verdict likely**: Crest is primarily a structural byproduct of jaw adaptation, possibly co-opted for minor predation defense (exaptation), but not a full adaptation.  

  **Single most decisive further observation**: **Embryological experiments** to test if the crest can develop independently of the jaw-adductor shift. If altering jaw attachment *without genetic changes to the crest region* still produces the crest, the byproduct claim is confirmed; if not, adaptation is stronger.  

  ---

  ### **Engineering Optimum Case: Invariant Trait**  
  - **Trait**: Shape matches engineering optimum (e.g., for aerodynamics) but is invariant across 40+ species; only engineering model for comparison.  
  - **Can it satisfy the desiderata?**  
    - **Adaptation claim fails**: No variation to test historical selective advantage or exclusion of alternatives. Matching a model suggests utility but cannot establish selection *for* that shape (could be a universal constraint).  
    - **Non-adaptation claim plausible**: Invariance suggests developmental constraint or physical inevitability, especially if the optimum is a "universal" solution. However, without evidence of constraints (e.g., pleiotropy), it remains speculative.  
    - **Verdict**: Cannot satisfy adaptation desiderata (due to lack of historical/comparative evidence). May weakly support constraint if the optimum arises from physical laws.  

  ---

  ### **Scorecard of Named Positions (Brief)**  
  - **Adaptationists**: Prioritize optimality models, selection tests; demand evidence of function and selective history. Risk teleology.  
  - **Non-adaptationists**: Emphasize alternatives (constraints, exaptation); demand evidence of non-adaptive origins. Risk dismissing adaptation.  
  - **Synthesis**: Most traits involve mixed mechanisms; rigid positions ignore contingency. Desiderata above force integration.  

  This framework should help your seminar move beyond stalemates by requiring explicit evidence for each criterion and respecting non-negotiable distinctions. The skink case illustrates how mixed explanations often prevail, and the engineering case shows the limits of adaptationist claims without variation.
