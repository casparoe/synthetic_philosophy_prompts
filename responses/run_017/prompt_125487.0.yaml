  First diagnosis: Reject the tracking condition (2). This would cost the intuitive link between justification and counterfactual sensitivity to truth, which is central to many externalist epistemologies. The cost is abandoning a powerful way to think about epistemic responsibility.

  Second diagnosis: Reject independence (3) by adopting a more nuanced moral realism. This could involve either naturalistic reduction (making moral facts dependent on evolutionary pressures) or response-dependence (making moral facts constitutively tied to human responses). The cost is compromising the robust objectivity many realists want to preserve.

