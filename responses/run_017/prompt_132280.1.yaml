prompt: |-
  I'm part of a small reading group — mostly philosophy of biology people plus two computer scientists — that has spent a term working through self-replication: von Neumann's self-reproducing automaton, Hofstadter's Typogenetics from *Gödel, Escher, Bach* (the formal system in which strings over A, C, G, T are simultaneously the data and, once translated into enzymes that cut, copy, move and insert on other strings, the programs, so that a strand can bring about the production of the very enzymes that act on strands), the actual molecular biology of template replication and translation, and the quining programs the CS people produce every time the discussion turns to codes. Before we read any more I want the specification rather than another theory. What I am asking for is the desiderata list for an account of what it is for a physical system to be a self-replicator, adequate for one job: to decide, without appeal to intuition, whether some novel system counts as one, and to say precisely what the DNA–Gödel isomorphism — the claim that the genetic code plays the role in replication that Gödel numbering plays in the incompleteness proof, letting a string inside a system reach out and act on the system that contains it — actually establishes and what it merely gestures at.

  Give me the requirements with the case or consideration behind each: the phenomena any such account must cover, the distinctions it must not collapse, and the results from chemistry, thermodynamics and computation it is not allowed to contradict. The cases I want stress-tested, each either handled or excluded with a stated reason, are these: a single DNA strand in a tube of activated nucleotides with no primer and no polymerase, where nothing happens, versus the same strand with both present, versus the same strand with a primer the experimenter supplies; a mirror-image cell, every molecule of the opposite handedness, sitting in ordinary nutrient broth where nothing can copy it and which divides happily once we add a mirror polymerase, so that the system is a replicator only relative to a medium that need not exist; a quine, which reproduces its own source only because a CPU happens to be executing it, and a virus, which reproduces only because a host cell supplies ribosomes, transfer RNAs, energy and membrane; a 3D printer with a robot arm that prints and assembles the parts of a 3D printer from a CAD file held in its own memory, and the variant where the file lives on a server and is downloaded each cycle; a photocopier that scans and prints its own parts but assembles them only because a technician does; crystal growth and a spreading fire, which everyone agrees are not replication but nobody excludes by a reason that generalizes; a prion, which imposes its fold on other copies of the same protein, with heritable strain differences, but with no sequence and no code; and an autocatalytic reaction network in which every member is produced by some other member and nothing is plausibly the entity being copied. I also want the following near-misses classified: a mule, a plaster cast taken from a statue through a mould, and a transposable element that is copied by machinery to which it contributes nothing. Please don't give me a reading list or citations; we have more than enough of those, and it is the conceptual work I'm after.

  Two things I especially want. First, mark which requirements are non-negotiable and which are the preferences of a camp: that replication essentially involve a description or code; that it be intrinsic to the object rather than to an object-in-a-medium; that it admit heritable variation of unbounded complexity; that it be statable without singling out a privileged level of description; that the interpreter of the description be produced by the replicating system itself rather than supplied by the environment — this last one is where the analogy with Gödel numbering bites, since a formal system interprets its own numerals by its own rules whereas DNA is read by polymerases the cell had to build. Second, if some subset of the desiderata is jointly unsatisfiable, say which and say what has to give; my suspicion is that you cannot have both a criterion intrinsic to the object and one that handles the primer case and the mirror cell, but I'd rather be told I'm wrong. Tell me which single requirement does the most work in excluding the accounts people actually hold. My own hypothesis, offered as one, is that the isomorphism is exact at exactly one narrow point — the double use of one string as instruction and as copied data — and that the further claims made on its behalf, that replication is essentially self-referential or that a replicator must supply the semantics of its own description, are either false or are really claims about evolvability rather than about replication. A compact table scoring the von Neumann description-used-twice picture, the Hofstadter strange-loop picture, and the chemical-autocatalysis picture against your list is welcome at the end, but keep the weight on the criteria and their motivating cases; I can argue about the scoring with the group myself.
reasoning: |-
  Okay, this user is part of a specialized reading group tackling self-replication across multiple disciplines. They've clearly done deep work on von Neumann automata, Hofstadter's Typogenetics, molecular biology, and quines. Now they want rigorous criteria to evaluate novel systems as self-replicators, specifically to demystify the DNA-Gödel analogy. 

  The cases they listed are brilliantly chosen stress tests: from inert DNA strands to mirror cells, quines to prions, each probing different conceptual boundaries. What stands out is their frustration with vague analogies - they want surgical precision on what the Gödel isomorphism actually entails beyond the superficial "string-as-both-data-and-code" observation. 

  Their hidden agenda seems twofold: First, to expose whether claims about "self-interpretation" in biology are overstated (hence the primer/mirror cell examples challenging intrinsicism). Second, to determine if replication fundamentally requires symbolic encoding (tested via prions/autocatalysis). The mule and transposon near-misses suggest they're also probing inheritance vs replication distinctions.

  Thermodynamically, they'll reject any account violating the second law (e.g., crystal growth exclusions). Computationally, they need to reconcile quines (environment-dependent) with biological replication. The 3D printer variants cleverly test "self-containment" of information. 

  Their hypothesis about the Gödel analogy being narrowly correct but overextended resonates. The key insight might be distinguishing replication (any copying mechanism) from evolvable replication (requiring decoupled description/interpreter). The mirror cell case kills intrinsicism unless we accept medium-relativity - which then trivializes the photocopier-with-technician. 

  For the scoring table, von Neumann's "description used twice" covers most cases but stumbles on prions/autocatalysis. Hofstadter's strange loops demand too much self-reference (failing primer/mirror cases). Autocatalysis is inclusive but overbroad (counting fires). The DNA-Gödel analogy truly holds only for the template-function duality, not semantic self-sufficiency.
answer: |-
  Here is a rigorous set of desiderata for defining physical self-replication, grounded in your cases and designed to adjudicate novel systems while clarifying the DNA-Gödel isomorphism. Requirements are categorized as **Core** (non-negotiable physical/computational constraints) or **Strategic** (contingent on explanatory goals, e.g., evolvability). Cases are resolved with explicit reasoning.

  ---

  ### **Core Desiderata** (Non-Negotiable)
  1. **Material Causation Requirement**  
     *Motivation*: Thermodynamics (2nd Law). Replication must involve physical work/energy transduction.  
     *Cases*: Excludes crystals/fire (no directed energy conversion; growth is passive diffusion/combustion).  
     *Exclusions*: "Self-replication" without material implementation (e.g., abstract quines) fails.

  2. **Asymmetric Dependency Requirement**  
     *Motivation*: Distinguish replication from equilibrium processes. The system must have a *causal asymmetry*: the replicator’s structure determines the structure of the copy *more* than the copy’s structure determines the replicator’s.  
     *Cases*:  
     - Excludes crystals (copy symmetry: seed crystal and new crystal mutually determine structure via lattice).  
     - Includes DNA+Polymerase (strand sequence directs nucleotide addition; reverse isn’t true).  
     - *Stress Test*: Prions qualify (misfolded protein *imposes* fold on new protein; reverse folding isn’t heritable).

  3. **Token-Copying Requirement**  
     *Motivation*: Avoid collapsing replication with mere persistence or reproduction. Must produce a *new, spatially distinct token* of the replicator’s type.  
     *Cases*:  
     - Excludes autocatalytic networks (no discrete token copied; network persists/expands).  
     - Includes cells, viruses, 3D printers (new physical instances created).  
     - *Near Miss*: Mule excluded (no token copying; gamete fusion creates hybrid).

  4. **Medium-Relativity Requirement**  
     *Motivation*: Physical implementation. Replication is *always* relative to a permissive environment supplying energy/materials.  
     *Cases*:  
     - DNA strand in tube: Replicator *only* when polymerase/primer present.  
     - Mirror cell: Replicator *only* with mirror polymerase added.  
     - Virus: Replicator *only* in host cell (environment supplies machinery).  
     - *Consequence*: Replication is not intrinsic to the object alone.

  ---

  ### **Strategic Desiderata** (Contingent on Explanatory Goals)
  5. **Descriptive Vehicle Requirement** (Camp: Symbolic Accounts)  
     *Motivation*: Enable heredity of complex traits. Replication must involve a stable, discrete *description* (e.g., sequence) that is copied and interpreted.  
     *Cases*:  
     - Includes DNA, von Neumann automata, quines.  
     - Excludes prions (no sequence; fold is template but not encoded).  
     - *Stress Test*: Plaster cast excluded (mold is template, but no symbolic description; mold shape directly imprints).

  6. **Interpreter Production Requirement** (Camp: Strong Self-Reference)  
     *Motivation*: Gödel isomorphism analogy. The replicator must *construct* the machinery that interprets/executes its description.  
     *Cases*:  
     - Includes cells (DNA codes for polymerases/ribosomes).  
     - Excludes quines (CPU/interpreter is external), viruses (host supplies interpreter), primer-dependent DNA (experimenter supplies primer).  
     - *Controversy*: Violated in mirror cell (interpreter added externally).

  7. **Unbounded Heredity Requirement** (Camp: Evolvability Focus)  
     *Motivation*: Support open-ended evolution. The replicator must allow arbitrary, heritable variation in its description.  
     *Cases*:  
     - Includes DNA, von Neumann automata.  
     - Excludes prions (limited "strain" variation not combinatorial), autocatalysis (no discrete heredity).

  8. **Level-Neutral Specification Requirement** (Camp: Anti-Reductionism)  
     *Motivation*: Avoid privileging molecular biology. Definition must apply to multiple physical scales (e.g., digital, mechanical).  
     *Cases*:  
     - Includes 3D printers (mechanical), quines (digital).  
     - Excludes accounts requiring "organic chemistry".

  ---

  ### **Resolution of Cases & Near-Misses**
  | **Case**                          | **Replicator?** | **Reason**                                                                 |
  |-----------------------------------|-----------------|----------------------------------------------------------------------------|
  | **DNA + nucleotides only**        | No              | Lacks polymerase (fails Asymmetric Dependency).                            |
  | **DNA + polymerase + primer**     | Yes             | Primer is part of environment; satisfies Token-Copying + Asymmetry.        |
  | **Mirror cell + mirror polymerase** | Yes             | Environment supplies interpreter; satisfies Core (1–4).                    |
  | **Quine**                         | Strategic No    | Fails Interpreter Production (CPU external); satisfies Core (1–4).         |
  | **Virus**                         | Yes             | Satisfies Core (environment-relative); fails Interpreter Production.       |
  | **3D printer (CAD in memory)**    | Yes             | Self-contained description + directed assembly (Token-Copying).            |
  | **3D printer (CAD on server)**    | Strategic No    | Fails Interpreter Production (server external); satisfies Core (1–4).      |
  | **Photocopier + technician**      | No              | Technician breaks Asymmetric Dependency (directed assembly not automated). |
  | **Crystal growth**                | No              | Fails Asymmetric Dependency + Token-Copying (equilibrium process).        |
  | **Spreading fire**                | No              | Fails Asymmetric Dependency (fuel state determines spread, not "copying"). |
  | **Prion**                         | Core Yes        | Fold template satisfies Asymmetric Dependency + Token-Copying.             |
  | **Autocatalytic network**         | No              | Fails Token-Copying (no discrete token replicated).                        |
  | **Near Miss: Mule**               | No              | Fails Token-Copying (sexual recombination, no cloning).                    |
  | **Near Miss: Plaster cast**       | No              | Fails Descriptive Vehicle (direct template imprint; no code).              |
  | **Near Miss: Transposable element**| Strategic No    | Satisfies Core; fails Interpreter Production (host machinery unmodified).  |

  ---

  ### **Key Tensions & Tradeoffs**
  - **Intrinsicism vs. Medium-Relativity**: You suspect correctly. Core Desideratum 4 (Medium-Relativity) *requires* environmental contribution. Intrinsicism (replication as object property) is untenable (fails primer, mirror cell, virus cases).  
  - **Gödel Isomorphism Scope**: Your hypothesis holds. The *only* exact isomorphism: a string functions as both **data (copied token)** and **instruction (template for copying)**. Claims that replication requires "self-interpretation" (Interpreter Production) or "self-reference" are *strategic* (for evolvability), not core to replication.  
  - **Most Exclusionary Requirement**: **Asymmetric Dependency** (Core 2). It cleanly excludes crystals/fire while including prions and mechanistic replicators.  

  ---

  ### **Account Scoring Table**
  | **Requirement**               | **Von Neumann (Description x2)** | **Hofstadter (Strange Loop)** | **Chemical Autocatalysis** |
  |-------------------------------|----------------------------------|--------------------------------|----------------------------|
  | **1. Material Causation**     | ✓                                | ✓ (if implemented)            | ✓                          |
  | **2. Asymmetric Dependency**  | ✓                                | ✓                             | ✗ (no token asymmetry)     |
  | **3. Token-Copying**          | ✓                                | ✓                             | ✗ (no discrete tokens)     |
  | **4. Medium-Relativity**      | ✓                                | ✗ (demands self-containment)  | ✓                          |
  | **5. Descriptive Vehicle**    | ✓                                | ✓                             | ✗                          |
  | **6. Interpreter Production** | ✗ (external constructor)         | ✓                             | ✗                          |
  | **7. Unbounded Heredity**     | ✓                                | ✓                             | ✗                          |
  | **8. Level-Neutrality**       | ✓                                | ✓ (digital)                   | ✗ (chemical only)         |
  | **Handles Prions?**           | ✗                                | ✗                             | ✓ (Core only)              |
  | **Handles Mirror Cell?**      | ✓                                | ✗                             | ✓                          |

  **Verdict**:  
  - **Von Neumann**: Strongest for evolvable systems but excludes prions/non-symbolic replicators.  
  - **Hofstadter**: Overly strict (fails primer, virus, mirror cell). Confuses replication with self-sufficiency.  
  - **Autocatalysis**: Overly broad (counts fires/crystals if Core 2 ignored). Useful only for basic token replication (prions).  

  **Recommendation**: Adopt **Core Desiderata (1–4)** for *minimal physical replication*. Add **Strategic Desiderata** only when targeting systems capable of open-ended evolution (e.g., life, evolvable AI). The DNA-Gödel analogy is precise only for the data/instruction duality—not self-semantics.
