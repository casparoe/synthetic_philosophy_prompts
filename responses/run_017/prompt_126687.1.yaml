answer: |-
  Here's a step-by-step ethical procedure designed for your specific needs. It focuses on **respect, integrity, and minimizing potential harm**, prioritizing the historical figure's legacy over legalities or abstract philosophy. Run it scene-by-scene.

  **The Procedure: "The Legacy Threshold Test"**

  1.  **Define the Core Truth: What is Undisputed?**
      *   *Question:* Based on primary sources (letters, diaries, speeches, confirmed actions), what are the essential, well-documented facts about her character, values, key relationships, and life's work *relevant to this scene*?
      *   *Good Enough Answer:* A clear list derived directly from sources (e.g., "Deeply compassionate toward workers' families," "Fiercely committed to nonviolence," "Close, supportive relationship with sister," "Professional respect for Editor X, no romantic rumors").
      *   *Stop:* If you cannot identify *any* core truths relevant to the scene. (Unlikely for a central figure).
      *   *Pass:* Clear documentation exists.
      *   *Handback:* Interpretation of sources is ambiguous on a relevant point. *Proceed cautiously.*

  2.  **Assess the Invention Type: Gap vs. Contradiction?**
      *   *Question:* Does my invented scene/detail fill a *gap* in the record (where we simply don't know) or does it *contradict* established facts or the clear trajectory of her documented character/values?
      *   *Good Enough Answer:* Honest assessment. Gap = plausible silence (e.g., a private moment, a common action). Contradiction = going against documented statements, actions, or core principles (e.g., admitting defeat privately while publicly proclaiming unwavering faith).
      *   *Stop:* If you realize it's a major contradiction *and* you cannot justify it compellingly *for her sake* (see Step 4). Minor contradictions need intense scrutiny.
      *   *Pass:* Clearly filling a gap plausibly.
      *   *Handback:* It's a plausible gap, but near the edge of contradiction, or a minor contradiction requiring justification.

  3.  **Evaluate Impact on Legacy: Harm or Distortion?**
      *   *Question A (Harm):* Could this invention, especially if vividly portrayed, *seriously damage* her historical reputation, undermine her life's work in the reader's mind, or cause significant distress to those who cared about her legacy (including informed readers)?
      *   *Question B (Distortion):* Does this invention fundamentally *misrepresent* who she demonstrably was or what she stood for, reducing her complexity to a stereotype or simplifying her struggle?
      *   *Good Enough Answer:* "Harm": Unlikely for flattering inventions; High risk for private doubts contradicting public work, unsubstantiated scandals, or portraying core failures without evidence. "Distortion": High risk if the invention overshadows documented reality or flattens complex motivation into a single invented moment.
      *   *Stop:* High probability of significant harm or severe distortion (e.g., inventing core cowardice, betrayal, bigotry without evidence; a vivid scene directly undermining her life's defining principle).
      *   *Pass:* Low risk of harm/distortion (e.g., plausible compassionate act); or potential distortion is minor and contextualized by the overall narrative.
      *   *Handback:* Moderate risk – needs justification and mitigation (see Step 5).

  4.  **Justify the Contradiction (If Applicable):**
      *   *Question:* **Only if Step 2 flagged a contradiction:** Is this contradiction *necessary* to explore a deeper, *plausible* human truth about her struggle that the historical record *cannot* show, yet *doesn't fundamentally betray* her core character or life's work? Does it serve *her* story, or just my plot?
      *   *Good Enough Answer:* The contradiction reveals a documented inner tension (e.g., letters show exhaustion but resolve), explores human complexity *within* her framework (doubt amidst commitment), and avoids cheapening her achievement. It feels true to the *spirit* of her documented struggles, not antithetical to them.
      *   *Stop:* Contradiction feels like a cheap plot device, fundamentally betrays her core self/life's work, or serves no purpose deeper than shock value or narrative convenience.
      *   *Pass:* Contradiction feels earned, psychologically plausible, and illuminates her documented struggles/complexity without negating them.
      *   *Handback:* The justification feels defensible but shaky. High stakes.

  5.  **Mitigation & Acknowledgement: Can the Risk Be Managed?**
      *   *Question:* What (if anything) can I do *within the narrative or surrounding paratext* to acknowledge the invention, ground it in documented reality, or signal its speculative nature *without* breaking immersion or relying solely on a distant author's note?
      *   *Good Enough Answer:* Weaving subtle clues into the scene (character questioning their own memory/interpretation, framing it as rumor within the story, juxtaposing it immediately with documented counter-evidence). *Not* relying solely on the copyright page or a backnote for high-stakes inventions.
      *   *Stop:* No feasible mitigation for a high-harm/high-distortion invention. The scene *must* stand on its own, and if it fails Step 3/4, mitigation won't fix it.
      *   *Pass:* Effective mitigation is possible and integrated.
      *   *Handback:* Mitigation options exist but are clunky or risk breaking the narrative. Is the invention worth the narrative cost?

  6.  **Living Descendants: Respectful Consideration (Not Veto)**
      *   *Question:* Are there known living descendants? If so, does this invention *specifically* contradict cherished *private* family narratives or attack the *personal* (non-public) character of their ancestor in a way that could cause unique distress? (Focus on *direct, personal* impact, not general disagreement with interpretation).
      *   *Good Enough Answer:* Acknowledge their existence and potential feelings. Their claim is to personal/familial memory, *not* historical interpretation of public actions. Avoid gratuitous attacks on purely private character without strong historical basis.
      *   *Stop:* Only in the extreme case of inventing a heinous *personal* act (abuse, profound cruelty within the family) with no basis, solely to cause shock, where descendants are known and engaged. (Rare).
      *   *Pass:* Invention relates to public life/work or plausible private moments not core to family lore. Or, no known/engaged descendants.
      *   *Handback:* Invention touches on sensitive private family territory (e.g., the affair *if* descendants hold a specific private narrative). Consider discreet outreach *after* the procedure? (High complexity).

  **Running the Scenes:**

  1.  **Scene: Sitting up with scab's sick kid.**
      *   Step 1 (Core Truth): Documented deep compassion for workers/families. **Pass.**
      *   Step 2 (Gap/Contradiction): Fills a gap (specific night/child undocumented). Plausible action. **Pass.**
      *   Step 3 (Harm/Distortion): Low risk. Shows documented compassion. Potentially flattering, but not distorting core. **Pass.**
      *   Step 4 (Contradiction Justification): N/A (No contradiction). **Pass.**
      *   Step 5 (Mitigation): Optional: Subtly show it's a common act for her, or have another character mention her known kindness. **Pass.**
      *   Step 6 (Descendants): Unlikely significant impact. **Pass.**
      *   **VERDICT: CLEAR PASS.** Gut was right. This is ethical invention.

  2.  **Scene: Affair with Married Editor.**
      *   Step 1 (Core Truth): Professional relationship documented. No evidence or even rumors of affair in sources. Core value likely included integrity (fighting for justice). **Pass** (Truth defined).
      *   Step 2 (Gap/Contradiction): **Contradiction.** Goes against documented nature of relationship and likely her public values (scandal could hurt movement). **Handback/Stop** (Major contradiction).
      *   Step 3 (Harm/Distortion): **High Risk.** Distortion: Reduces complex political/work relationship to a cliché. Harm: Could overshadow her work, paint her as hypocritical re: movement values (exploitation?), cause distress if descendants hold her personal life sacred. **Stop/Handback.**
      *   Step 4 (Justification): *Is it necessary?* For plot structure? Not for *her* truth. Does it reveal a deeper plausible truth? An affair *might* reveal human vulnerability, but it directly contradicts the documented professional dynamic and risks defining her by the affair. Feels more like plot convenience than deep character insight. **Stop.** (Justification fails).
      *   Step 5 (Mitigation): Could frame as rumor? But it's presented vividly in your draft. Mitigation unlikely to overcome core contradiction and harm. **Stop.**
      *   Step 6 (Descendants): Potential for significant distress if they value her personal reputation. **Handback/Concern.**
      *   **VERDICT: STOP.** The contradiction is significant, justification based on plot needs fails the "for her sake" test, and the risk of harm/distortion is very high. This is the answer you won't like. *Alternative:* Explore intense professional/intellectual intimacy that *stops short* of an affair? The tension without the contradiction.

  3.  **Scene: Private admission to sister that movement was a mistake.**
      *   Step 1 (Core Truth): Lifelong, *documented* public *and* private (letters) commitment to nonviolence and the movement. Core life project. **Pass.**
      *   Step 2 (Gap/Contradiction): **Major Contradiction.** Directly opposes documented private thoughts (letters). **Handback/Stop.**
      *   Step 3 (Harm/Distortion): **Extremely High Risk.** Distortion: Fundamental misrepresentation of her core belief. Harm: Utterly undermines her life's work and sacrifice in the reader's mind. A vivid scene like this is indelible. **Stop.**
      *   Step 4 (Justification): *Is it necessary?* To show human doubt? But the record shows *perseverance despite doubt*, not capitulation. Does it serve *her*? No, it negates her. Betrays the core truth. **Stop.** (Justification fails).
      *   Step 5 (Mitigation): Impossible. No note can unring this bell. **Stop.**
      *   Step 6 (Descendants): High potential for distress if they revere her commitment. **Concern.**
      *   **VERDICT: STOP.** This is the most ethically dangerous scene. It actively defeats the life project she dedicated herself to. *Alternative:* Show intense *doubt, exhaustion, frustration* with *specific tactics or setbacks*, even moments of despair, while her *underlying belief in the cause and principle of nonviolence* remains – as her letters show. "This is so hard, is it worth it?" NOT "This was all a mistake."

  **What the Procedure is Structurally Blind To:**

  1.  **The Unforeseen Cultural Shift:** It can't predict how future audiences or evolving cultural values might reinterpret your invention. A benign choice today might appear insensitive or distorting decades later.
  2.  **The Inherent Subjectivity of "Plausibility" & "Harm":** What feels plausible or minimally harmful to you might feel outrageous to a historian or descendant. The procedure flags risk but relies on your honest self-assessment.
  3.  **The Reader's Indelible Impression:** While mitigation is considered, the procedure can't *guarantee* a reader will contextualize a vivid invented scene, no matter how well-signaled. The power of narrative often trumps footnotes.
  4.  **The "Right" to Imagine vs. Responsibility to the Dead:** It provides a framework for responsibility but cannot resolve the philosophical tension between an artist's creative freedom and the duty to a real person's memory. It leans towards responsibility.
  5.  **The Nuance of "Life Project":** It flags contradictions to documented core beliefs but can't perfectly quantify the *degree* to which a specific invented doubt "defeats" the project. This remains a values call, though the procedure forces you to confront it rigorously.
  6.  **The True Motive:** It assumes you are applying it honestly. It can't stop you from rationalizing a harmful invention because you really want it.

  **Key Takeaway:** This procedure forces you to move beyond gut feeling by systematically confronting the intersection of historical evidence, your narrative desires, and Ada Kowalczyk's lived reality and legacy. It prioritizes minimizing harm and distortion over narrative convenience. It won't make the hard choices easy, but it makes them explicit and grounded in respect for the person whose life fuels your art. The "Stop" on the affair scene, despite its structural appeal, demonstrates its rigor. Use it to write with greater confidence where you pass, and to seriously reconsider or radically reshape where you hit "Stop" or a difficult "Handback."
