answer: |-
  ### Final Exam Essay Question  
  **Time Allowed:** 60 minutes  
  **Word Count:** 800–1000 words  
  **Instructions:** Answer the following question in a clear, structured essay. Engage directly with the six cases (i)–(vi) discussed in class. Do not merely summarize Kripke’s standard arguments for the essentiality of origin; your task is critical analysis.  

  **Question:**  
  The modal argument for the essentiality of origin relies on the necessity of distinctness and transitivity of identity. Apply this argument to cases (i) Ordinary Swap, (ii) Replacement, (iii) Delay, and (vi) Clone. Identify where (if anywhere) the argument fails in this series. Explain the substantive premise about cross-world identity the argument requires, and evaluate whether this premise is independent of the essentiality thesis or merely restates it. Defend your chosen "line" against alternatives: what makes it the correct boundary rather than an arbitrary stopping point? Finally, address case (v) Split: if both infants result from the same zygote, which (if either) is identical to you? What does your view imply if the answer is "neither"?  

  ---

  ### Model Answer (920 words)  
  The modal argument for essentiality of origin contends that an organism could not have originated from meaningfully different materials or events. It proceeds as follows: Suppose entity *a* could have originated from alternative origin *O₂* instead of actual origin *O₁*. Then there is a world *w* where *a* originates from *O₁*, and *a* originates from *O₂* (via transworld identity). But by the necessity of distinctness, the *O₁*-product and *O₂*-product in *w* are distinct entities. Transitivity implies *a* cannot be identical to both, contradicting the initial assumption. I argue this argument succeeds for cases (i)–(iii) but fails at (iv) Cytoplast and beyond. The critical premise—that origins *O₁* and *O₂* in the same world *always* yield distinct entities—is not independent of essentiality; it presupposes the thesis. My line falls between (iii) and (iv), grounded in token-origin specificity.  

  **Application to Cases (i), (ii), (iii), and (vi):**  
  - **(i) Ordinary Swap:** The modal argument works. If you (*a*) could originate from a different sperm (same parents, same conception event), consider a world *w* where both the actual sperm (*O₁*) and the swapped sperm (*O₂*) fertilize the egg. Necessity of distinctness dictates two distinct zygotes in *w*, so *a* cannot be identical to both.  
  - **(ii) Replacement:** The argument still holds. Though the alternative sperm is qualitatively identical to the actual one, it is numerically distinct. In *w*, the *O₁*-zygote and *O₂*-zygote (from the duplicate sperm) are separate entities. Transitivity forces *a*’s incompatibility with both origins.  
  - **(iii) Delay:** The argument succeeds. A 40-minute fertilization delay constitutes a different temporal origin event (*O₂*). In *w* where both immediate and delayed fertilizations occur with the same sperm and egg, two zygotes exist. *a* cannot originate from both.  
  - **(vi) Clone:** The argument fails. Your clone originates from a somatic cell at *t=30*, not your zygote. If *a* (you) could have been the clone, consider *w* where both your actual zygote (*O₁*) and the somatic-derived clone (*O₂*) exist. Nothing prohibits *a* from being the clone in *w*; no contradiction arises because the clone’s origin is *categorically* different (derived vs. zygotic). The argument’s premise—that *O₁* and *O₂* in *w* produce competing claims to *a*—collapses here.  

  **Breaking Point and the Cross-World Identity Premise:**  
  The argument fails at **(iv) Cytoplast**. Here, your nucleus and father’s sperm fuse, but the egg’s cytoplasm (including mitochondrial DNA) is donor-sourced. If *a* could originate from this modified setup (*O₂*), the modal argument requires that in *w*, the *O₁*-organism (with maternal cytoplasm) and *O₂*-organism (with donor cytoplasm) must be distinct. But this demand relies on the **substantive premise**: *Any variation in the material/event-specific token origin in a world necessitates distinct organisms*. This premise is **not independent** of essentiality; it *is* the essentiality thesis applied intra-world. To insist that cytoplast-altered origins yield distinct entities in *w* assumes that origin tokens are essential—which is precisely the conclusion in dispute. The argument circularly uses the thesis to "prove" itself when pushed to edge cases.  

  **Defending the Line:**  
  My boundary between (iii) and (iv) is principled: it distinguishes **token-specific biological processes** from **token-indifferent compositional changes**. Cases (i)–(iii) alter the *token event* (which sperm, when fusion occurs) but preserve the *specific material tokens* (sperm and egg cells) and biological process (natural fertilization). (iv) substitutes core material tokens (cytoplasm/mitochondria), disrupting the organism’s causal-historical chain. Coarse-graining origins to ignore such substitutions (e.g., treating cytoplasm as fungible) empties essentiality of content: if any genome-identical origin suffices, even clones (vi) threaten the thesis. Conversely, drawing the line earlier (e.g., at (i)) overemphasizes contingent sperm identity, violating intuition that *you* could have been conceived seconds later. (iii) is the latest defensible point where the origin event, while temporally shifted, involves all actual material tokens.  

  **Addressing (v) Split:**  
  In monozygotic twinning, the zygote splits into two embryos. On my view, *neither* resulting infant is identical to you (*a*), the pre-split zygote. The zygote ceases to exist at splitting, giving rise to two new entities. This implies **episodic essentialism**: you are essentially a non-split organism. If splitting occurs, you cease to exist. This avoids arbitrary choice (e.g., claiming you "are" one twin but not the other). However, this forces a revision: origins are essential *only if* they yield a non-branched entity. This is consistent—it simply adds persistence conditions to origin essentiality—but underscores that identity depends on both origin and uninterrupted continuity.  

  **Conclusion:**  
  The modal argument is robust for minor origin variations (i–iii) but fails for substantial substitutions (iv–vi) due to its reliance on a non-independent cross-world identity premise. The cytoplast case (iv) exposes the circularity: demanding distinct entities for different token origins in *w* presupposes essentialism. My line at token-specificity preserves the thesis’s core intuition—that *you* are tied to your concrete biological inception—while avoiding vacuity. Clones (vi) and splits (v) confirm that identity requires not just *an* origin, but *your* origin, with its unique material and historical constraints.  

  ---

  ### Marking Scheme (20 points total)  
  **Must-hit moves with marks and common errors:**  
  1. **Correct application of modal argument to (i), (ii), (iii), (vi)** (4 pts)  
     - *A/B Move: A answers recognize (ii) works despite qualitative sameness due to numerical distinctness.*  
     - *Common Error (CE): Misapplies argument to (vi) by ignoring categorical origin differences.*  

  2. **Identifies failure point & justifies choice** (3 pts)  
     - *CE: Vague placement (e.g., "somewhere after (iii)") without specifying (iv) as critical.*  

  3. **Names cross-world identity premise & evaluates independence** (5 pts)  
     - **A Move: Explicitly notes premise is non-independent/circular in edge cases (e.g., cytoplast).**  
     - *B Move: Correctly identifies premise but calls it "plausible" or "intuitive" without critiquing dependence.*  
     - *CE: Omits premise or conflates it with necessity of distinctness.*  

  4. **Defends chosen line vs. alternatives & rejects coarse-graining** (4 pts)  
     - *CE: Appeals to intuition alone or proposes arbitrary boundaries (e.g., "delays over 1 hour matter").*  

  5. **Handles (v) Split: Rejects identity with either twin & explains implications** (3 pts)  
     - *CE: Claims one twin is identical to original zygote without justification.*  

  6. **A-only Insight** (1 pt):  
     - **Links premise circularity to token-origin specificity** OR **Shows coarse-graining collapses essentiality into triviality (e.g., allows clones)**.  

  **Grading Key:**  
  - **A (18–20):** Hits all moves; #3 and #6 show deep critique of premise’s role.  
  - **B (15–17):** Hits #1–5 but misses #6; treats premise as independent or defends line weakly.  
  - **C+ (12–14):** Summarizes cases/modal argument; superficial on #3–5; regurgitates Kripke.  
  - **D/F (<12):** Major omissions (e.g., skips cases, ignores Split, misstates argument).  

  ---  
  **Note:** All text adheres to American English (e.g., "defends," "plausible," "recognizes"). The model answer takes a strong stance at (iv) to force engagement, but markers should credit alternative coherent positions (e.g., line at (iii)) if rigorously defended.
