answer: |-
  ### In-Class Activity: Mind Uploading Simulation  
  **Objective:** Students generate the central dilemma of gradual mind uploading through experiential simulation, without prior lecture or technical terms.  

  ---

  #### **Materials**  
  - 3 large boxes labeled "Clinic 1 (Drip)", "Clinic 2 (Shadowing)", "Clinic 3 (Hemispheric)"  
  - Index cards (20 per student)  
  - Sealed envelopes (1 per student)  
  - Pens  
  - Whiteboard with three pre-drawn axes (rounds 1–20 on x-axis; experience 0–10 on y-axis)  
  - Timer  

  ---

  #### **Setup (5 min)**  
  **Instructions to Students (verbatim):**  
  *"Today, you’ll simulate a medical trial for mind uploading. Each of you is a patient in one of three clinics. All clinics start with an organic brain and end with a fully synthetic brain, but use different replacement protocols. Your brain’s functional organization—how it processes inputs, outputs, and internal states—is identical at every step. Behavior and verbal reports are fixed: no matter what you experience, you’ll always say 'I feel normal' and pass all cognitive tests.*  

  *Here’s what you’ll do:*  
  1. *Write a sealed prediction: In which round (1–20) will your experience first change? If never, write ‘never’. Seal it.*  
  2. *Each round, privately rate your experience (0 = no consciousness; 10 = normal) and consent (yes/no) on an index card. Drop it anonymously in your clinic’s box.*  
  3. *After Round 10, we’ll plot averages and open predictions.*  

  *Protocols:*  
  - **Clinic 1 (Drip):** *5% of brain units replaced per round (e.g., Round 1: 5% synthetic; Round 20: 100%).*  
  - **Clinic 2 (Shadowing):** *Each round, every unit’s synthetic part grows by 5%, organic shrinks by 5% (e.g., Round 1: each unit 5% synthetic; Round 20: 100% synthetic).*  
  - **Clinic 3 (Hemispheric):** *Rounds 1–9: 0% replaced. Round 10: One hemisphere (50%) replaced under anesthesia. Rounds 11–19: 50% replaced. Round 20: Second hemisphere replaced (100%).*  

  *Your ratings are private. Do not discuss them."*  

  **Action:**  
  - Divide 16 students into clinics: Clinic 1 (5), Clinic 2 (5), Clinic 3 (6).  
  - Hand out envelopes and index cards.  

  ---

  #### **Activity Timeline (75 min)**  
  1. **Prediction Phase (5 min):**  
     - Students write/seal predictions. Collect envelopes.  

  2. **Rounds 1–10 (25 min):**  
     - **Per Round (2 min):**  
       - *Announce:* "Round [X]. Clinic 1: [X*5]% replaced. Clinic 2: All units [X*5]% synthetic. Clinic 3: [State: e.g., Round 5: 0%; Round 10: 50% under anesthesia]."  
       - *Task:* Students rate experience (0–10) and consent (yes/no) on card, drop in clinic box.  
     - *Timer:* Strict 2 min/round.  

  3. **Halfway Analysis (10 min):**  
     - Collect boxes. Calculate average experience rating per clinic per round. Plot three curves (Rounds 1–10) on whiteboard.  
     - Open sealed predictions. Tally "first change" rounds per clinic on board (e.g., "Clinic 1: 3 predicted change at Round 6; 2 at Round 10").  
     - **Prompt:** "What patterns do you see in the curves/predictions? Why might clinics differ?" *Note: Redirect labels ("fading qualia") to "describe the pattern without jargon."*  

  4. **Rounds 11–20 (25 min):**  
     - Repeat Round 11–20 as above.  

  5. **Final Plot (5 min):**  
     - Plot Rounds 11–20 averages. Complete curves for all clinics.  

  ---

  #### **Debrief (15 min)**  
  **Guide the Discussion:**  
  1. **Curve Divergence:**  
     - *Prompt:* "The endpoint and functional organization are identical across clinics. If ratings differ, is this noise—or does it track something non-functional?"  
     - *Key Point:* Divergence suggests intuitions violate functionalism (same function → same experience).  

  2. **Accumulation Problem:**  
     - *Prompt:* "If you said nothing changed at any step (e.g., Drip’s 5% swaps), how can anything change at the end? If you denied change at all steps, you’re committed to synthetic = conscious."  
     - *Key Point:* Functionalists must accept the synthetic system is conscious.  

  3. **Change Without Functional Difference:**  
     - *Prompt:* "If you reported change at a step (e.g., Hemispheric’s Round 10), but function was fixed, what does that imply?"  
     - *Key Point:* Admitting change despite identical function refutes functionalism.  

  4. **Undetectable Fading:**  
     - *Prompt:* "Could a gradual change go unnoticed? If your experience dimmed 1% per round, would you detect it? Why or why?"  
     - *Key Point:* Gradual fading is hard to refute (no behavioral trace) but intuitively implausible—this is the dilemma.  

  **Introduce Terms:** Now name "fading qualia" (gradual loss), "dancing qualia" (abrupt shifts), and "organization invariance" (functionalism’s claim).  

  ---

  #### **Predictable Problems & Solutions**  
  1. **Students Name Arguments Early:**  
     - *Issue:* E.g., "This is fading qualia!"  
     - *Solution:* "Hold that thought—describe the pattern without labels. We’ll map it to terms later."  

  2. **"Just Ask the Patient":**  
     - *Issue:* Students note verbal reports are fixed.  
     - *Solution:* "The stipulation forces us to confront: Can functionalism explain private experience if behavior is silent?"  

  3. **Reject Stipulated Behavior:**  
     - *Issue:* "If experience changes, behavior should too!"  
     - *Solution:* "But functionalism says fixed function → fixed behavior/experience. Rejecting this stipulation rejects functionalism—which is a valid conclusion to draw in debrief."  

  4. **Noisy/Performative Ratings:**  
     - *Issue:* Ratings skew high (defiance) or low (dramatic effect).  
     - *Solution:* Averages will still show clinic-level trends. Note in debrief: "Divergence between clinics is meaningful; internal variation is noise."  

  ---

  #### **What the Activity Cannot Reproduce**  
  **The Debrief Must Supply:**  
  - **Memory/Adaptation in Fading Qualia:** In a true gradual fade, the subject’s memory of "normal" would degrade, making change undetectable. Students use a fixed scale (0–10), so they "remember" baseline consciousness. *Explain:* "A fading being might recalibrate ‘normal,’ hiding the loss. This makes fading qualia unfalsifiable—a weakness functionalists exploit."  

  ---

  **Why This Works:**  
  Students *live* the tension between functionalist theory (same function → same experience) and their intuitive ratings (protocols feel different). The sealed predictions and anonymous curves make the dilemma emerge "bottom-up," priming deep engagement in the debrief.
