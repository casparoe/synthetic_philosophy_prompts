prompt: |-
  I'm chairing a small author-meets-critics breakfast at a conference in the spring (25 people, bad coffee, I'm also teaching a seminar on normative powers that term and want to reuse the recording in class, so I'd like the questions to be reusable as teaching prompts too). Next up is a manuscript by a visitor, Prof. Nadia Ferrante — working title *Being Bound: Promising as a Second-Person Power*. Her core claim as I understand it: what makes a promise bind isn't convention, social utility, or the expectations and reliance it generates, but the exercise of a primitive normative power — by saying *I promise* to you in the right circumstances I make it the case that I owe you the performance, and in doing so hand you a limited authority over that bit of my conduct, which is why breaking it wrongs *you* in particular rather than just being a failure to bring about a good state of affairs. The part I find both genuinely original and shaky is what she calls the pre-conventional argument: she thinks the Humean conventionalist line and the practice-conception people get the order of explanation backwards, because (she claims — and I am not asking you to go dig up the empirical literature, just take her claims as given) very young children already treat giving one's word as specially binding in novel, convention-free settings, and broadly similar patterns show up across cultures; on her telling the convention is scaffolding bolted onto an antecedent social-cognitive capacity, not the source of the normativity.

  I've got 45 minutes with her before three critics take over, and I want eight to ten questions that go past having her restate the view. Context on her as a speaker: she's fast, generous, and she has two moves I want progressively closed off. When pressed on where the power comes from, she says some version of "that's just asking what makes a power a power; explanation stops here." When handed a hard case, she says "that's a question about the conditions of successful exercise, not about what the power does." I want the sequence to make both harder and harder to reach for, and to end with one question about what would actually make her abandon the framework. Please also make sure the list covers: (1) the gap between the obligation to keep the promise and whatever reason there already was to do the promised act — does her view explain that gap or just rename it; (2) promises where the promisee doesn't care, doesn't rely, and might rather not have been promised at all (the commitment-device cases, the promise blurted out to a stranger on a train); (3) release and waiver — why the promisee can let me off but I can't let myself off, and what that asymmetry is really evidence for; (4) trivial and redundant promises, including promising to do what I already ought to do — is a wholly content-independent obligation really generated there; (5) scope limits: impossible, coerced, or immoral promises, since a power view owes an account of invalidity that isn't just "it doesn't work there"; (6) promises to the dying, to groups, to people who can't understand what's being said; and (7) the pre-conventional argument itself — even granting her the data, why think early sensitivity to promising reveals a normative power rather than a disposition to *feel* bound, i.e. isn't this the old gap between explaining our sense of obligation and vindicating it. For each question give me one follow-up keyed to the answer she's most likely to give, and mark in brackets where you're just guessing about what she'd say.

  Two last things. Role: you're a moral philosopher who works on normative powers and second-personal reasons — take a few minutes to brainstorm before you write, and assume I'll delete anything soft or generic, so no "what drew you to this topic," no "where do you see the field going." And commit: don't give me a menu and leave the picking to me. Tell me which two questions you'd actually lead with and why, which single question is most likely to get her to say something that isn't already in the manuscript, and where *you* think the framework is weakest — with your reasons, stated at whatever confidence you actually have, and flagged where you're less sure.
reasoning: |-
  Okay, let me tackle this query. The user is chairing an author-meets-critics session and needs sharp questions for Prof. Ferrante's work on promising as a normative power. The questions must avoid restating her view and close off her common escape moves. 

  First, I need to cover all seven specified areas while making the questions progressively harder. The escape moves are key: she tends to deflect to "what makes a power a power" or dismisses hard cases as about "conditions of exercise." The sequence should corner her into engaging more deeply.

  Starting with the gap between obligation and pre-existing reasons (point 1). This is foundational. If her power view just renames the gap instead of explaining it, that's a problem. The follow-up should press on whether the power adds anything beyond psychological effects. 

  Next, commitment-device cases (point 2). Promises to strangers where the promisee doesn't care challenge her second-personal wronging claim. If the obligation exists despite no relational harm, does that weaken her account? The follow-up could question if obligation is just self-imposed here.

  Release and waiver (point 3) is crucial for the authority asymmetry. Why can the promisee release but not the promisor? If she says it's inherent to the power, the follow-up should ask why this asymmetry exists only for some normative powers.

  Trivial promises (point 4) test content-independence. Promising what you already must do—does it create a new obligation? Her likely "double-counting" reply needs pushing: is this a real normative effect or just psychological?

  Scope limits (point 5) require her to explain invalidity beyond "it doesn't work." Coerced or immoral promises—how does her power account for their non-binding nature without circularity?

  Pre-conventional argument (point 7) needs scrutiny. Even if children treat promises as binding, does that show a normative power or just a feeling? The follow-up should challenge the is-ought gap here.

  The abandonment question must be last. What would make her drop the framework? This forces her to admit potential weaknesses.

  Leading with the gap question (1) and release asymmetry (3) makes sense. They attack core mechanisms without letting her retreat to abstractions. The release question especially targets her second-personal element.

  The commitment-device question (2) might get new insights. It's concrete and oddball, pushing her beyond manuscript examples. Her answer could reveal how far she stretches "authority."

  Weakest point for me is the pre-conventional argument. Granting the data, conflating phenomenology with normativity is a risk. But I'm unsure—maybe she has a response bridging the gap. Still, without external validation, it's shaky.
answer: |-
  Here's a tightly sequenced set of 10 questions designed to pressure-test Ferrante's core claims, progressively block her escape routes, and extract teaching-ready material. I've integrated your required coverage areas, predicted likely responses (marked **[Likely F]**), and crafted surgical follow-ups. My philosopher's perspective is grounded in Razian normative powers and Darwallian second-personal authority frameworks.

  ### Core Sequence (Leading to Abandonment Threshold)
  1. **Lead Question 1: The Obligation Gap**  
     *"You argue the promissory obligation is distinct from any pre-existing reason to perform the act. But when I promise to φ where I already have a strong independent duty to φ (e.g., rescue a drowning child), does your 'normative power' genuinely create a *new*, content-independent obligation? Or does it merely attach new relational consequences (like the promisee’s authority to demand compliance) to the old duty?"*  
     **[Follow-up if she says it creates new obligation]:** "If so, isn't this 'double-counting' irrational? Should we really owe two distinct obligations for one act? If not, how does your power *transform* rather than *add to* existing reasons without collapsing into a redundancy?"  
     **Why lead here:** Targets the fundamental "why powers matter" question. Forces engagement with normativity vs. psychological overlay.

  2. **Lead Question 2: Release Asymmetry**  
     *"The promisee's unilateral power to release seems central to your 'authority transfer' model. But if the normative power is mine (the promisor's) to create the obligation, why can't I unilaterally dissolve it? What in the *structure* of this specific power explains why its surrender is irrevocable except by the grantee?"*  
     **[Follow-up if she invokes the logic of powers/authority transfer]:** "Contrast consent: I can withdraw my consent to touch *before* you act, precisely because it’s *my* authority over my body. Why is promising different? Doesn’t this asymmetry suggest the power’s source isn't fully located in the promisor’s will alone?"  
     **Why lead here:** Directly confronts the second-personal heart of her view. Escape move 1 ("what makes a power a power") is weak here – powers have structural features.

  3. **Commitment-Device Cases (Stranger on Train)**  
     *"Consider: I impulsively promise a stranger on a train I’ll quit smoking. They shrug, say 'Don’t care,' and exit at the next stop. No reliance, no convention, no desire for the promise. On your view, do I still owe *them* performance? If so, what work is the 'authority' doing if the grantee is indifferent and unreachable?"*  
     **[Likely F: She’ll affirm obligation exists, saying authority exists even if unexercised]**  
     **[Follow-up]:** "If the obligation persists despite the promisee’s indifference/absence, doesn’t this reduce the 'second-personal wrong' to a metaphysical abstraction? What tangible normative difference does *their* authority make compared to a self-imposed vow?"

  4. **Trivial/Redundant Promises**  
     *"I promise my colleague I won’t steal their wallet tomorrow. I already have a stringent duty not to steal. Does your power view entail I now bear *two* distinct obligations? If not, how does promising alter the *quality* of the pre-existing duty rather than adding a new one?"*  
     **[Likely F: She may distinguish 'being obligated' from 'owing *to* someone' or emphasize the new demand-right]**  
     **[Follow-up]:** "If the only change is that my colleague now holds a claim-right they lacked before, isn’t the 'obligation' largely unchanged for *me*? Does your power merely distribute Hohfeldian incidents differently without creating a genuinely novel *duty*?"

  5. **Scope Limits (Coercion/Immorality)**  
     *"On your view, what *specifically* invalidates a coerced promise? If normative powers are primitive, why isn’t 'I promise with a gun to my head' a valid exercise, just an imprudent one? What feature intrinsic to powers explains invalidity here without smuggling in external norms (like autonomy)?"*  
     **[Likely F: She’ll argue coercion vitiates the voluntariness required for power exercise]**  
     **[Follow-up]:** "But doesn't voluntariness presuppose a background norm your theory claims to ground? If validity conditions depend on exogenous moral constraints, how is promising the *source* of normativity rather than its product?"

  6. **Promises to Non-Standard Grantees (Dying/Comatose)**  
     *"If I promise a dying person I’ll care for their child, and they die moments later, to *whom* do I owe performance? Their authority, on your view, dissolved at death. Does the obligation vanish? If not, how does the power bind me absent a living second person with authority?"*  
     **[Likely F: She may extend authority to estates/trusts or invoke the deceased’s 'surviving will']**  
     **[Follow-up]:** "If we invoke proxies or 'surviving will,' aren’t we tacitly appealing to convention or social practice to sustain the obligation? How is this consistent with the primitiveness of your power?"

  7. **Pre-Conventional Argument (The Is/Ought Gap)**  
     *"Granting your developmental data shows children *feel* bound by promises early on. Why does this demonstrate a *normative power* rather than a psychological disposition to experience fidelity pressure? Isn't this conflating the phenomenology of obligation with its justification?"*  
     **[Likely F: She’ll argue the early-emerging, cross-cultural recognition of bindingness points to a shared normative competence]**  
     **[Follow-up]:** "Even if universally *felt* as binding, doesn’t Hume’s Law still apply? How does the descriptive fact about our reactive attitudes bridge the gap to genuine normativity without your theory collapsing into a sophisticated conventionalism?"

  8. **Power Source & Explanatory Primitiveness**  
     *"When you say the power is 'primitive,' do you mean *conceptually* primitive (irreducible to other norms) or *causally* primitive (not socially constituted)? If the former, how does it interact with other norms? If the latter, how do we account for its emergence in human sociality without relying on practice?"*  
     **[Likely F: She’ll retreat to 'conceptual primitive' and say further explanation is impossible]**  
     **[Follow-up]:** "If it's conceptually primitive, why favor *this* primitive (promising-as-power) over Scanlon's principle of fidelity or Humean convention as the foundational explanans? What problem does primitiveness solve that alternatives cannot?"

  9. **The Hard Case: Sham Promises & Bad Faith**  
     *"I say 'I promise to φ' while secretly intending not to φ, and you overhear me. No convention, no reliance. Have I exercised the normative power? Do I owe you φ? If not, why not—given the 'right circumstances' (hearing, competence) seem met?"*  
     **[Likely F: She’ll say intention is a condition of successful exercise]**  
     **[Follow-up - BLOCKING ESCAPE MOVE 2]:** "But earlier you distinguished 'successful exercise' from 'what the power does.' If the power's core function is creating obligation via utterance, why does internal intention matter? Isn’t this conceding that the power's efficacy depends on non-linguistic mental states, undermining the performative purity?"

  10. **The Abandonment Question**  
      *"What empirical discovery or philosophical argument would force you to concede that conventionalism, expectation-based theories, or a Scanlonian principle better explains promissory obligation than your normative power framework? What's the falsification criteria?"*  
      **[No follow-up needed; let this hang]**

  ### Why This Sequence & My Assessment
  - **Why lead with Q1 (Obligation Gap) & Q2 (Release Asymmetry)?**  
    Q1 strikes at the **generative claim** of powers (do they *create* obligation?). If Ferrante stumbles here, the whole edifice wobbles. Q2 exploits the **most distinctive feature** (second-personal authority) and is hardest to dismiss with "it's just what powers do" – release is observable and structurally peculiar to promising. Together, they isolate the core mechanism before testing edge cases.

  - **Which question gets new material?**  
    **Q9 (Sham Promises).** Manuscripts often overlook bad faith. Her *intention* requirement forces her to specify conditions of exercise in ways that may reveal tacit concessions to intentionalism or mental states, potentially undermining her performative focus. This pressures her escape move 2 directly.

  - **Where I find the framework weakest (Confidence: High):**  
    **The Pre-Conventional Argument (Q7).** Granting the data, Ferrante commits a **category error**. Demonstrating an early-emerging *sense* of obligation or sensitivity to broken commitments **does not establish** the existence of a normative power as an objective feature of practical reason. It confuses developmental psychology (how we *acquire* the concept/feeling) with moral ontology (what *grounds* the obligation). The "universality" claim is also suspect – anthropological work (e.g., Graeber on debt) shows vast differences in how commitments are understood and enforced cross-culturally. Her move from "children react strongly" to "therefore, primitive normative power" is a non sequitur lacking a bridge principle. The authority-transfer element feels particularly ungrounded in the developmental data.

  **Delivery Tip:** After Q4 (Trivial), subtly note: *"We've now seen several cases where the 'new obligation' seems thin or redundant – let's press on how the power actually reshapes normativity."* This primes critics to target content-independence later. End with Q10 starkly – no softening preamble.
