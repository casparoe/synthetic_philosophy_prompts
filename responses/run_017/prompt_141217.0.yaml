prompt: |-
  I am part of a small reading group — mostly graduate students in philosophy and a couple of people from an effective-altruism adjacent policy shop — that has been working slowly through the literature on tiny probabilities of astronomically large stakes. Last week we reached the case where a stranger approaches you and offers to create or spare some colossal quantity of worthwhile simulated lives — say 10 to the power of 30, or a number you would have to write as a tower of exponents — in exchange for five dollars, on pain of being ignored entirely if you decline. One member, who had been growing impatient with the whole literature, said something like: "Look, extraordinary claims require extraordinary evidence. The mugger's story is about as extraordinary as a claim gets, so we are entitled to set it aside," and then treated the topic as closed. I want to reopen it, because I don't think the slogan is doing a single determinate piece of work there. Among the things it might mean: a purely Bayesian truism (improbable hypotheses need proportionally larger likelihood ratios to reach the same posterior, which is just the odds form of Bayes' theorem); a norm about testimony or burden of proof rather than about credence; a requirement that evidence strength scale with the *stakes* or *leverage* of the claim rather than with its prior improbability; a complexity or specificity constraint on priors (a claim that specifies an enormous number is one of astronomically many competing claims, so it inherits a description-length penalty); a norm against *acting* on low-probability, high-magnitude considerations; or, as a related nineteenth-century formulation attributed to Laplace puts it, the thesis that "the weight of evidence for an extraordinary claim must be proportioned to its strangeness." These differ enormously, and one thing I want explained rather than assumed is that paying five dollars does not require *believing* the mugger — an expected-value argument can go through at a credence of one in a trillion trillion — so I'd like to know which readings, if any, actually deliver the dismissal my group member wanted, as opposed to merely capping credence at a level that is still decision-relevant.

  To force the issue, I've been playing with two variants that I think separate the readings. In the first — call it the *humdrum mugging* — nothing remotely miraculous happens: a disgruntled data-centre technician tells you he is about to pull the power on a rack, and that the rack is running a simulation containing 10 to the power of 30 morally significant beings; the only extraordinary element is the number, since pulling a plug and running a simulation violate no known regularity whatsoever. In the second — the *scaling mugging* — the mugger supplies evidence that is extraordinary by any everyday standard: he lets you inspect, interrogate and repeatedly verify a working simulation of a million clearly sentient beings, then explains that this is a demo of a far larger system whose continued existence depends on your five dollars. Intuitively that demonstration carries an enormous Bayes factor in favour of his having *some* such capacity, yet it is nowhere near enough to make the 10-to-the-30 claim more likely than not. So the question is whether "extraordinary" is indexed to weirdness, to prior improbability, to the specificity of the claim, or to the size of the stakes it invokes, and how the required quantity of evidence is supposed to be measured — as a likelihood ratio, as a total body of testimony, as a threshold of posterior probability, or as something that has to grow with the magnitude of the claimed effect. As a final check on generality, note that another member used the very same slogan a week later to dismiss a long-term risk estimate that involved no single extraordinary event at all, only the aggregation of many ordinary mechanisms.

  What I'd like is a disambiguation I can bring back to the group: a numbered menu of the distinct precise theses the slogan could be expressing, each stated tightly enough that we could see whether it is true, false, or merely a restatement of something we already accept, and each labelled as trivial, substantive-but-defensible, contentious, or confused. For every reading, please say what "extraordinary" and "evidence" would have to denote for it to hold, whether it is a claim about belief, about assertion and burden of proof, or about action, and — this is the part I care most about — whether it actually licenses setting the original mugging aside, how it handles the humdrum and scaling variants, and whether it would equally license dismissing the mundane long-term risk estimate. If some readings collapse into each other, or if the only reading that does the real work is not really about evidence at all but about a constraint on how fast priors may decay with the size of a claimed effect, say so explicitly, and tell me which reading my group member was most plausibly reaching for and whether that reading survives scrutiny.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're part of a reading group focusing on tiny probabilities with huge stakes, like Pascal's Mugging scenarios. The core issue is their group member dismissing such scenarios using "extraordinary claims require extraordinary evidence" (ECREE). The user wants to dissect this slogan into precise interpretations to challenge the dismissal.

  First, I need to break down possible meanings of ECREE. The user listed several options: Bayesian truism, testimony norms, stakes-based evidence, complexity penalties, action norms, and Laplace's strangeness proportionality. Each needs clear definitions and implications for the mugging scenarios.

  The user mentioned two variants: the humdrum mugging, where the claim isn't miraculous, and the scaling mugging with strong evidence for a smaller simulation. Also, there's the long-term risk estimate without extraordinary events. Each variant tests different aspects of ECREE.

  For each interpretation, I must check if it justifies dismissing the original mugging, handles the variants, and addresses the long-term risk. The user cares most about whether paying $5 requires belief and if expected value arguments still hold at minuscule probabilities.

  I recall that in Bayesian terms, even a tiny credence can make high-stakes actions rational if the expected value is positive. So, dismissing based on low probability might not work. The group member might conflate low prior with insufficient evidence, ignoring that evidence strength (likelihood ratio) matters independently.

  The complexity penalty via Kolmogorov prior could explain low priors for large numbers, making the claim inherently improbable. But in the humdrum case, the simulation's existence isn't miraculous, so prior might not be as low. The scaling mugging shows that evidence can be strong for a smaller claim but not scale to the larger one, highlighting the problem of evidence magnitude.

  The stakes-based interpretation is problematic because it suggests evidence requirements should scale with stakes, which isn't standard Bayesianism. It might lead to avoiding action on low-probability high-impact risks, which the user wants to avoid, especially in long-term risk contexts.

  The testimony norm might not apply directly to credence but to social burden of proof. In the mugging scenario, there's no third party; it's a personal decision. So this might not justify dismissal.

  Action norms, like minimax regret, could reject acting on tiny probabilities, but that's a separate decision rule, not about evidence. The user wants to know if ECREE covers this.

  Putting it together, the group member likely relied on the complexity penalty interpretation, which is defensible but doesn't automatically dismiss the mugging. Expected value calculations might still compel action. The scaling variant shows that evidence doesn't linearly scale with stakes, making the huge claim unsupported even with strong evidence for a smaller one. The long-term risk estimate, aggregating ordinary events, wouldn't have the same description-length penalty, so dismissing it via ECREE would be invalid.

  The user needs a clear framework to show that ECREE isn't a one-size dismissal tool. Emphasizing that priors decay with claim size due to complexity, but actions depend on expected value, not just belief. That way, the group can see the nuances and avoid premature closure.
answer: |-
  Here's a disambiguation of "Extraordinary Claims Require Extraordinary Evidence" (ECREE) tailored to your scenario, presented as a numbered menu. Each thesis is stated precisely, analyzed for validity, and tested against the original mugging, your variants (Humdrum Mugging, Scaling Mugging), and the long-term risk estimate.

  ---

  ### **The Core Disambiguation Menu**

  1.  **The Bayesian Truism (Odds Form)**
      *   **Thesis:** For any hypothesis H, the posterior odds (P(H|E)/P(¬H|E)) equal the prior odds (P(H)/P(¬H)) multiplied by the likelihood ratio (P(E|H)/P(E|¬H)). If P(H) is extremely low (H is "extraordinary"), then the likelihood ratio (the "extraordinary evidence") must be correspondingly high to achieve any specific posterior probability (e.g., P(H|E) > 0.5).
      *   **"Extraordinary" denotes:** Extremely low prior probability (P(H) ≈ 0).
      *   **"Evidence" denotes:** Likelihood Ratio (P(E|H)/P(E|¬H)).
      *   **Domain:** Belief/Credence (Epistemology).
      *   **Status:** **Trivial (Mathematically True).** A direct consequence of Bayes' Theorem.
      *   **Licenses dismissal?** **No.** It *requires* assigning a low prior, but doesn't tell you *why* P(H) is low or *how* low it must be. Crucially, it **does not cap expected value**. Even if P(H|E) remains astronomically small (e.g., 10^-30), the enormous stakes (10^30 lives) can still dominate expected utility calculations ($5 cost vs astronomical potential benefit). This reading merely emphasizes the *math* of belief updating.
      *   **Handles Humdrum Mugging?** Neutral. If P(H) is deemed low *only* because of the enormous number N (see Thesis 4), the math applies. It doesn't address *why* N makes P(H) low.
      *   **Handles Scaling Mugging?** Illustrative. The demo evidence (E_demo) provides a high LR for the million-being claim (H_million), raising P(H_million|E_demo) significantly. However, for the 10^30-being claim (H_colossal), P(H_colossal) is vastly lower than P(H_million). Unless E_demo *also* provides a LR for H_colossal that is proportionally *much* larger than for H_million (which it likely doesn't, as the demo only weakly supports the scale), P(H_colossal|E_demo) remains extremely low. The truism highlights why strong evidence for a smaller claim doesn't suffice for a vastly larger one.
      *   **Dismisses Long-Term Risk?** **No.** If the long-term risk hypothesis aggregates ordinary mechanisms without inherently requiring an extraordinary *specification*, its prior might not be extraordinarily low. The math applies, but doesn't intrinsically dismiss it.

  2.  **The Testimonial Norm / Burden of Proof**
      *   **Thesis:** Social norms governing testimony or argument require that the proponent of a claim wildly at odds with common background knowledge ("extraordinary") bears a significantly higher burden ("extraordinary evidence") to establish credibility before the claim merits serious consideration or belief by others. Failure to meet this burden justifies listeners in provisionally rejecting or ignoring the claim.
      *   **"Extraordinary" denotes:** Highly inconsistent with widely shared, well-supported background beliefs ("common knowledge").
      *   **"Evidence" denotes:** Quality, quantity, and source reliability of testimony or argument offered publicly.
      *   **Domain:** Assertion, Testimony, Social Epistemology (Burden of Proof).
      *   **Status:** **Substantive-but-Defensible.** A pragmatic norm for efficient communication and preventing epistemic chaos.
      *   **Licenses dismissal?** **Potentially, as a social heuristic.** It justifies your group member *provisionally ignoring* the mugger's claim *in discussion* or refusing to engage seriously *until* stronger evidence is presented. It does **not** directly license a *credence* of zero or dictate *action* if one privately considers the EV calculation. It's about social engagement, not final belief or decision.
      *   **Handles Humdrum Mugging?** **Weakly.** If "common knowledge" doesn't include beliefs about the feasibility/scalability of massive simulations, the claim might not seem *as* extraordinary. The norm might be less applicable.
      *   **Handles Scaling Mugging?** **Yes.** The demo evidence *does* meet a high burden of proof for *some* simulation capacity. It forces engagement with the larger claim, though a further burden might apply to the specific scale.
      *   **Dismisses Long-Term Risk?** **Unlikely.** Well-supported arguments based on ordinary mechanisms presented within a relevant expert community (e.g., risk analysis) likely meet the burden of proof required in that context, even if shocking to laypeople.

  3.  **The Stakes/Leverage-Scaled Evidence Requirement**
      *   **Thesis:** The *minimum strength of evidence required to justify acting upon a claim* must increase with the magnitude of the potential costs or benefits ("stakes" or "leverage") invoked by the claim. For claims involving astronomically high stakes, only astronomically strong evidence suffices for action.
      *   **"Extraordinary" denotes:** Involves extremely high potential stakes (magnitude of outcome).
      *   **"Evidence" denotes:** Strength/weight of evidence required to make acting on the claim rational. (Likelihood Ratio? Posterior Probability?).
      *   **Domain:** Decision Theory / Action.
      *   **Status:** **Contentious (Often Confused/Rejected).** This directly modifies standard decision theory (maximize expected utility) by imposing an *additional* evidence threshold for action based on stakes magnitude, independent of calculated EV. It's often motivated by avoiding exploitation by Pascal's Muggers or being overwhelmed by low-probability tail risks.
      *   **Licenses dismissal?** **Yes, for action.** This reading *explicitly* aims to dismiss Pascal's Mugging-type actions. It argues that no matter the (finite) evidence, if the claimed stakes are large *enough*, it's irrational to act unless the evidence is *correspondingly* overwhelming (which it never is for a mugger). It potentially rejects EV maximization in extreme tails.
      *   **Handles Humdrum Mugging?** **Yes.** The enormous stakes (10^30 lives) demand impossible evidence strength, regardless of how mundane the mechanism seems.
      *   **Handles Scaling Mugging?** **Yes.** Even the strong demo evidence for a million lives is deemed insufficiently "extraordinary" to justify action on the vastly larger 10^30 claim. The required evidence scales with the *stakes*, not just the prior.
      *   **Dismisses Long-Term Risk?** **Potentially Controversially.** If the long-term risk involves sufficiently astronomical stakes, this thesis *would* demand impossibly strong evidence before acting to mitigate it, potentially dismissing it as a basis for precautionary action. This is highly contentious in risk analysis.

  4.  **The Complexity/Specificity Prior Constraint (Description-Length Penalty)**
      *   **Thesis:** Priors should be strongly penalized for hypotheses that are highly complex or specify very precise, large, or otherwise "fine-tuned" outcomes (like a specific astronomically large number N). This penalty arises because such hypotheses belong to a vast set of competing, mutually exclusive possibilities (e.g., all large numbers N) and simpler/more vague hypotheses are a priori more probable (e.g., Occam's Razor / Solomonoff Induction / Kolmogorov Complexity).
      *   **"Extraordinary" denotes:** High complexity or specificity, particularly involving very large numbers or precise outcomes.
      *   **"Evidence" denotes:** The Likelihood Ratio needed to overcome the extremely low prior probability resulting from the description-length penalty.
      *   **Domain:** Belief/Credence (Priors).
      *   **Status:** **Substantive-but-Defensible.** A core principle in formal epistemology (e.g., Solomonoff) and scientific reasoning (Occam's Razor). It explains *why* P(H) is astronomically low for claims specifying huge N.
      *   **Licenses dismissal?** **For high credence, yes; for action, not necessarily.** This *justifies* assigning P(H) ≈ 0 for the mugger's specific claim (e.g., "Give me $5 to save exactly 10^30 lives"). However, it **does not** inherently dismiss the *expected value argument for action**. P(H) might be 10^(-100), but the potential utility U is 10^30, so EU = P(H)*U could still be >> $5. The thesis explains the low prior but doesn't block the EV calculation. Dismissal requires an *additional* step (like Thesis 3 or 5).
      *   **Handles Humdrum Mugging?** **Yes.** Precisely. The mundanity of the mechanism (pulling a plug) doesn't matter. The extraordinary specificity of the *number* N=10^30 is sufficient to trigger the massive description-length penalty, making P(H) vanishingly small among all possible claims the disgruntled tech *could* make.
      *   **Handles Scaling Mugging?** **Yes.** The demo strongly confirms *a* simulation exists. However, the specific claim H_colossal (N=10^30) has a vastly lower prior than H_million (N=10^6) or even the vaguer "a very large simulation" due to its extreme specificity. The evidence doesn't overcome this penalty for the colossal N.
      *   **Dismisses Long-Term Risk?** **Unlikely.** A long-term risk estimate based on aggregating ordinary mechanisms typically doesn't specify an extraordinarily precise, large number in a way that triggers a unique description-length penalty. It's often a distribution or a range. Its prior isn't penalized *in the same way* as "exactly N=10^30".

  5.  **The Action Threshold Norm (Minimax/Maxipok etc.)**
      *   **Thesis:** Rational agents should adopt decision rules that explicitly avoid acting on extremely low-probability, extremely high-magnitude threats or opportunities, regardless of the naive expected utility calculation. Examples include Minimax Regret (focus on worst-case) or Maxipok ("Maximize the Probability of an OK outcome," avoiding extinction risk). Acting requires evidence sufficient to push the probability *above* a minimal threshold, which scales inversely with the stakes.
      *   **"Extraordinary" denotes:** Extremely low probability *and* extremely high magnitude (stakes).
      *   **"Evidence" denotes:** Strength/weight of evidence required to raise P(H) above a context-dependent, stakes-sensitive threshold for action.
      *   **Domain:** Decision Theory / Action.
      *   **Status:** **Contentious (Alternative Decision Theory).** Rejects standard EV maximization for extreme tail events. Motivated by practical reasoning, probability misestimation, or protecting against exploitation/blackmail.
      *   **Licenses dismissal?** **Yes, for action.** This is explicitly designed to dismiss Pascal's Mugging actions. It sets a threshold (e.g., P(H) > 10^-10 for any claim, regardless of stakes, or a stakes-dependent threshold) below which the claim is ignored for decision purposes. The "$5 bet" is rejected not because P(H)=0, but because acting on such tiny probabilities is deemed irrational *by the chosen decision rule*.
      *   **Handles Humdrum Mugging?** **Yes.** The low probability combined with high stakes triggers the action threshold.
      *   **Handles Scaling Mugging?** **Yes.** While evidence raises P(H_million) significantly, P(H_colossal) likely remains below the required action threshold.
      *   **Dismisses Long-Term Risk?** **Depends.** If the long-term risk estimate involves a *single event* (e.g., specific extinction scenario) with very low probability but vast stakes, it might be dismissed. If it involves a *distribution* of risks or aggregate effects, it might not trigger the same threshold (or might trigger a precautionary principle response instead).

  6.  **Laplace's Proportionality (Strangeness)**
      *   **Thesis:** The minimal degree of confidence warranted by evidence for a hypothesis must be proportional to the hypothesis's inherent "strangeness" or deviation from ordinary expectations. Stronger evidence is required to believe stranger things to the same degree.
      *   **"Extraordinary" denotes:** "Strangeness" - deviation from established regularities, laws of nature, or common experience.
      *   **"Evidence" denotes:** Strength/weight of evidence (posterior probability?).
      *   **Domain:** Belief/Credence.
      *   **Status:** **Confused / Ambigous.** "Strangeness" is vague. Does it map to low prior probability (Thesis 1/4)? To violation of physical law? To psychological surprise? It lacks the precision of Theses 1 & 4.
      *   **Licenses dismissal?** **Ambiguous.** If "strangeness" ≈ low prior due to law-breaking (e.g., magical mugger), it leans towards Thesis 1/4. If it's independent, it's unclear. It doesn't clearly address action/EV.
      *   **Handles Humdrum Mugging?** **Poorly.** The claim isn't "strange" if simulations and disgruntled techs are plausible. Only the number is large.
      *   **Handles Scaling Mugging?** **Poorly.** The demo removes the "strangeness" of *having simulation tech*, but the scale (10^30) might still seem "strange". It doesn't clarify the relationship.
      *   **Dismisses Long-Term Risk?** **Unlikely.** Aggregation of ordinary mechanisms isn't inherently "strange".

  ---

  ### **Synthesis & Answering Your Questions**

  1.  **Which readings license dismissing the *original mugging* (setting it aside)?**
      *   **For Belief/Credence:** Only **Thesis 4 (Complexity Penalty)** provides a *defensible reason* for assigning an astronomically low prior (P(H) ≈ 0). Theses 1 & 6 do not inherently justify low priors, they just describe the consequences. Theses 2, 3 & 5 do not directly govern belief.
      *   **For Action:** **Thesis 3 (Stakes-Scaled Evidence)** and **Thesis 5 (Action Threshold Norm)** are explicitly designed to dismiss Pascal's Mugging *actions*. **Thesis 2 (Testimonial Norm)** justifies *social dismissal* (ignoring the claim in discourse).
      *   **Crucially:** **No reading combining belief *and* decision theory inherently dismisses the *expected value argument* based purely on low probability.** Thesis 4 justifies low P(H), but EU = P(H)*U can still favor action. Theses 3 & 5 reject EV maximization *itself* for these cases.

  2.  **What was your group member plausibly reaching for?**
      Your group member was most plausibly reaching for a **blend of Thesis 2 (Testimonial Norm) and Thesis 4 (Complexity Penalty)**, with an *implicit* appeal to **Thesis 3/5 (Action Threshold)**. They treated the claim as socially dismissible due to its outlandishness ("extraordinary claim") and likely felt that no evidence a mugger could offer would be sufficient ("entitled to set it aside") for either belief or action, implicitly rejecting the EV calculation. They were gesturing towards the *practical rationality* of ignoring such claims, not just the math.

  3.  **Does this reading survive scrutiny?**
      *   **Thesis 4 (Complexity Penalty)** is robust and explains the low prior well. It survives scrutiny.
      *   **Thesis 2 (Testimonial Norm)** is pragmatically defensible for social discourse. It survives scrutiny *as a social heuristic*.
      *   **The implicit Thesis 3/5 (Action Threshold)** is **contentious**. It rejects standard decision theory. Scrutiny reveals it's a substantive (and debatable) philosophical choice about rationality in extreme tails, *not* a logical consequence of evidence norms or Bayes. Its defense requires arguments *beyond* ECREE, like concerns about probability distortion, moral corruption, or infinite regress of muggers.

  4.  **Handling the Variants:**
      *   **Humdrum Mugging:** **Thesis 4 (Complexity Penalty)** cleanly handles it by focusing on the specificity of the large number N, explaining the low prior despite mundane mechanisms. Theses 3 & 5 also apply to dismiss action. Thesis 2 & 6 struggle.
      *   **Scaling Mugging:** **Thesis 4 (Complexity Penalty)** handles it best: evidence strongly supports a less specific/smaller claim (H_million), but the penalty for the colossal N keeps P(H_colossal) negligible. **Thesis 1 (Bayesian Truism)** explains *why* the evidence doesn't lift P(H_colossal) significantly. **Thesis 3 (Stakes-Scaled Evidence)** insists the evidence, while strong, is still insufficient *relative to the colossal stakes*. **Thesis 5 (Action Threshold)** keeps P(H_colossal) below the action bar.
      *   **Long-Term Risk Estimate:** Only **Thesis 3 (Stakes-Scaled Evidence)** or **Thesis 5 (Action Threshold)** *might* controversially dismiss action, depending on how they are formulated. **Thesis 4 (Complexity Penalty)** generally **does not apply**, as these estimates usually avoid extraordinarily specific numerical claims triggering a unique description-length penalty. Using ECREE to dismiss this is likely a **misapplication**, confusing psychological surprise ("extraordinary") with low prior probability due to complexity/specificity.

  **Conclusion for your Group:** The slogan "ECREE" is doing multiple jobs. The **core insight justifying dismissal** in Pascal's Mugging scenarios is **Thesis 4 (Complexity Penalty on Priors)** for belief, often combined with an **implicit adoption of Thesis 3 or 5 (Stakes-Scaled Action Thresholds)** to block the expected value argument for action. Your impatient member was likely relying on this blend. While Thesis 4 is defensible and explains the vanishingly small prior, the move to dismiss the action *requires* the contentious extra step of rejecting standard EV maximization for extreme tails (Thesis 3/5). The **Scaling Mugging** powerfully illustrates that evidence strength doesn't linearly scale with claimed stakes, reinforcing the role of the complexity penalty. The **Humdrum Mugging** shows the penalty applies to the number itself, not the mechanism. Applying ECREE to dismiss the **long-term risk estimate** based solely on stakes magnitude is a category error, mistaking it for a Pascal's Mugging-type claim; Thesis 4 doesn't apply in the same way. Reopening the discussion means focusing on whether rejecting EV maximization in extreme tails (Theses 3/5) is philosophically justified and practically necessary, given that Thesis 4 alone does *not* block the EV argument.
