  Okay, let me try to unpack this user's query. They want a specification for hedonic commensurability that can support a lexical-threshold negative utilitarian view, especially for decision-making in areas like animal welfare or public health. The user already listed several requirements but wants them refined and expanded.

  First, I need to understand each requirement they mentioned. They talked about whether pleasure and pain are on one axis or two. If they're separate, how do we bridge them for lexical priority? That's crucial because without a common scale, comparing them lexically might not make sense. Then there's the threshold location—what exactly defines it? Intensity, duration, or something else? And how do we handle the continuity problem? If suffering is a spectrum, why draw the line at a specific point?

  Next, aggregation: does the threshold apply per episode or can multiple mild sufferings add up? This matters for policies affecting many individuals. Uncertainty is another big one. If there's even a tiny chance of severe suffering, does it dominate all other considerations? That could paralyze decision-making. Scale invariance is important too. If we recalibrate pain scales, does the threshold move? Otherwise, the theory might not be consistent.

  Temporal profiles: should we use moment-by-moment feelings or retrospective evaluations? People remember pain differently than they experience it, which affects how we measure suffering. Then there's the distinction between intrinsic badness and all-things-considered value. Some pains might be consented to or deserved, so they're not equally bad. The user also hinted at the repugnant conclusion and distribution issues, which I should include.

  The user wants to know which requirements conflict and which ones are hardest to satisfy. I recall that the uncertainty requirement (Requirement 4) clashes with making practical decisions. If any non-zero chance of severe suffering trumps everything, few options are viable. Also, the threshold location (Requirement 2) is tricky because continuous suffering variables don't have natural breaks, making any threshold seem arbitrary. The aggregation question (Requirement 3) might be unsolvable without ad hoc rules.

  I think the non-negotiable requirements are the foundational ones: the single axis or bridging mechanism (1), threshold definition (2), and intrinsic badness (7). Without these, the lexical threshold doesn't function. Scale invariance (5) and temporal profiles (6) are also essential for consistency. Aggregation (3) and uncertainty (4) are more methodological but still critical for real-world application. The repugnant conclusion (8) and distribution (9) are important but might be secondary.

  The biggest challenge is combining uncertainty with lexical priority. If regulators can't ignore tiny risks, they might not act at all. Theories that soften lexicality or use multi-dimensional scales might handle this better. Cardinal theories could assign thresholds numerically but face aggregation issues. Ordinal approaches avoid this but struggle with uncertainty. Ultimately, satisfying all requirements seems impossible without compromising on decision paralysis or arbitrariness. The user might need to prioritize which aspects to relax for practical use.
answer: |-
  Here is a specification for hedonic commensurability required to operationalize lexical-threshold negative utilitarianism (LTNU) in policy contexts, building on your list with clarifications, additions, and critical analysis.

  **Core Requirements for Hedonic Commensurability under LTNU:**

  1.  **Unified Hedonic Currency (Single Axis or Bridged Dual Axes):**
      *   **Requirement:** Must define a *single quantitative scale* or *bridged dual scales* allowing direct comparison of "suffering above threshold" vs. "mild states below". If pleasure/pain are distinct axes, a *transformation rule* or *common unit* must allow claims like "X units of suffering > threshold lexically outweighs Y units of pleasure" to be meaningful.
      *   **Case:** Without a common basis for comparison (even asymmetrical), lexical priority across fundamentally different entities (pleasure vs. severe pain) is incoherent. Dual-axis theories need a "translation key" for cross-axis comparison at the threshold.
      *   **Status:** **Non-negotiable.** Foundational for LTNU's core claim.

  2.  **Threshold Definition & Location:**
      *   **Requirement:** Precisely define the threshold-determining property: Peak intensity? Intensity-duration integral (e.g., "pain-seconds > level Z")? Peak intensity sustained for minimum duration? Subject-specific factors (e.g., overwhelming coping capacity)? Crucially, justify *why* the threshold falls at that specific point on the underlying continuous scale.
      *   **Case:** Arbitrary thresholds undermine normative weight. Continuous neurobiological/psychological substrates make any sharp cutoff philosophically and scientifically challenging. Regulators need clear operational criteria.
      *   **Status:** **Non-negotiable but deeply problematic.** The "justification" aspect is the major hurdle ("location problem").

  3.  **Aggregation Scope (Episodic vs. Holistic):**
      *   **Requirement:** Specify whether the threshold applies solely to *individual experiential episodes* or whether *aggregates* (e.g., many instances of moderate suffering across individuals/time) can "sum" to cross the threshold lexically.
      *   **Case:** Policy impacts populations. Does preventing one severe suffering episode outweigh *any* number of mild enjoyments? Or does mass moderate suffering eventually trigger lexical priority? LTNU needs rules for summing below-threshold states.
      *   **Status:** **Non-negotiable for applicability.** Answer dramatically alters policy choices (e.g., distributed mild harms vs. concentrated severe ones). Most LTNU proponents likely favor episodic, but this must be explicit.

  4.  **Handling Uncertainty & Small Probabilities:**
      *   **Requirement:** Define how LTNU ranks options with non-zero probability (p>0) of causing suffering *above* the threshold, especially when p is very small. Must avoid total paralysis ("Pascalian paralysis").
      *   **Case:** Real-world interventions carry unknown risks. Strict lexical priority implies *any* p>0 of above-threshold suffering outweighs *any* certainty of benefits below-threshold. This renders almost all options incomparable or equally worst.
      *   **Status:** **Non-negotiable for practical decision-making.** A theory causing paralysis is useless to a regulator. Solutions require modifying strict LTNU (e.g., probabilistic thresholds, lexical domains) or are a major weakness.

  5.  **Scale Invariance & Threshold Anchoring:**
      *   **Requirement:** Specify which transformations of the hedonic scale (e.g., linear, ratio, ordinal) preserve the preference ordering under LTNU. Crucially, determine if the threshold is defined in absolute units on the scale or shifts under recalibration (e.g., if reported pain intensity scales change).
      *   **Case:** Hedonic measurement scales (e.g., pain scores, QALYs) are conventions. Orderings and thresholds must be robust to legitimate scale transformations to be objective. An "anchored" threshold is needed for consistent application.
      *   **Status:** **Non-negotiable for objectivity/consistency.** Without invariance/anchoring, thresholds become arbitrary artifacts of measurement tools.

  6.  **Temporal Currency:**
      *   **Requirement:** Define *which temporal aspect* of experience bears the threshold: Momentary intensity? Integrated experience over time ("how bad was it overall")? Retrospective evaluation? Neurobiological "neural signature"?
      *   **Case:** Momentary agony might be severe, but brief; prolonged distress might be less intense but integrated as "awful". Retrospective evaluation can differ significantly (e.g., peak-end rule). LTNU needs to know *what* is being thresholded.
      *   **Status:** **Non-negotiable for consistent assessment.** Different choices yield different verdicts on the same event. Episodic theories usually focus on integrated experience or peak intensity, not momentary states.

  7.  **Intrinsic Disvalue vs. All-Things-Considered Badness:**
      *   **Requirement:** Clearly distinguish the *intrinsic disvalue of an experience* from the *all-things-considered badness of an outcome* containing that experience. The lexical threshold must apply to the *intrinsic disvalue*, while allowing that contextual factors (consent, desert, meaning) might affect the overall moral status of the outcome without negating the intrinsic disvalue.
      *   **Case:** A consensual surgical pain has intrinsic disvalue but might be part of a good outcome. Desert punishment involves pain with intrinsic disvalue. LTNU's threshold must target the intrinsic disvalue itself; otherwise, it cannot make the core claim about suffering's unique moral weight.
      *   **Status:** **Non-negotiable for conceptual coherence.** Failure here conflates the badness-of-pain with the badness-of-suffering-unjustly/in-vain/etc.

  8.  **Handling the Repugnant Conclusion & Distribution:**
      *   **Requirement:** Specify how LTNU interacts with population ethics and aggregation *below* the threshold. Does minimizing *total* suffering below threshold matter? Does preventing *more instances* of mild suffering outweigh preventing *fewer*? Or is only the *prevention of threshold-crossing* significant, making all below-threshold states morally equivalent/negligible?
      *   **Case:** Strict LTNU might imply indifference between a world with vast mild suffering and one with minimal mild pleasure, as long as no threshold is crossed. This "Reverse Repugnant Conclusion" is counterintuitive and potentially paralyzing for policy focused on widespread mild harms.
      *   **Status:** **Critical for policy scope.** Often a preference (strict LTNU vs. lexical+prioritarianism below), but impacts which interventions are justifiable. Neglecting it makes the theory incomplete for regulators.

  9.  **Inter-Personal Comparability:**
      *   **Requirement:** Establish robust grounds for comparing hedonic states (especially threshold-crossing) *across different individuals/species*. Define the unit of comparison.
      *   **Case:** Policy affects diverse beings. Can "severe suffering" in a mouse be meaningfully compared lexically to "mild pleasure" in a human? What constitutes "equal" suffering above threshold?
      *   **Status:** **Non-negotiable for multi-subject applications.** Without comparability, LTNU cannot rank interventions affecting different individuals.

  **Conflict Analysis & Feasibility:**

  1.  **The Fatal Conflict:** **Requirement 4 (Uncertainty) directly conflicts with Requirement 1 (Lexical Priority) in standard formulations.** Strict lexical priority implies any p>0 of above-threshold suffering dominates. Requirement 4 demands avoiding paralysis, requiring a modification (e.g., thresholds on probability, severity-probability products, lexical domains). This modification *weakens* the core lexical claim significantly.
  2.  **Most Exclusionary Requirement:** **Requirement 2 (Threshold Definition/Location Problem).** Theories relying on continuous hedonic dimensions struggle immensely to non-arbitrarily justify a *specific* cutoff point as lexically significant, especially against the continuity of neurobiology and psychology. This excludes most simple cardinal utility theories.
  3.  **The Unsatisfiable Trilemma:** Satisfying **1 (Lexical Priority)**, **3 (Episodic Threshold - the common view)**, and **8 (Avoiding Reverse Repugnance)** simultaneously seems impossible. If only episodic threshold-crossing matters lexically (3), and all below-threshold states are morally equivalent (strict interpretation of 1), then preventing one stubbed toe (if below threshold) is morally equivalent to preventing a lifetime of moderate depression (also below threshold) - a form of Reverse Repugnance (violating 8). Avoiding this requires aggregating below-threshold disvalue, contradicting strict episodic lexicality.

  **What Remains Standing? (Scorecard - Very Brief)**

  *   **Modified Lexical Domains:** (e.g., Arrhenius, Rabinowicz) Define domains (e.g., "extreme suffering") lexically prior. Addresses 2 (partly), 3, 7. Struggles with 4 (uncertainty), 5 (anchoring), 9 (comparability). May soften lexicality for uncertainty/practicality.
  *   **Multi-Dimensional Lexicality:** Suffering intensity is a distinct dimension lexically prior to pleasure. Addresses 1 (with bridging via dimensionality). Major struggles with 2 (location), 5 (scale), 6 (currency), 9 (comparability).
  *   **Thresholds on Cardinal Scales w/ Aggregation Below:** Uses robust cardinal scales (addressing 5, 6, 9 partially), defines threshold (struggles with 2), aggregates below threshold (avoids worst of 8). **Contradicts strict LTNU** by making below-threshold states matter non-lexically. Sacrifices core commitment.
  *   **"Fuzzy" Lexicality:** Threshold is a vague range. Avoids sharp location problem (2). Creates vagueness in application (violates need for clarity in 2, 3, 4, 5). Does not solve paralysis (4) or aggregation (3,8).

  **Conclusion:** Operationalizing LTNU for realistic policy requires significant concessions. The joint requirements of **non-arbitrary threshold location (2)**, **handling uncertainty without paralysis (4)**, **episodic focus (3)**, and **avoiding moral absurdity below threshold (8)** create severe tension, likely necessitating abandoning strict lexical priority in favor of a heavily modified or "softer" lexical view (e.g., lexical domains with aggregation below, or thresholds on multi-attribute scales) or accepting decision paralysis or counterintuitive implications. A theory satisfying *all* requirements in a way that remains true to the core spirit of LTNU (strict lexical priority for severe suffering) appears unattainable due to fundamental conflicts between the continuous nature of experience, the demands of decision-making under uncertainty, and the need for moral relevance below the threshold. The specification itself reveals the operational fragility of strict LTNU.
