prompt: |-
  Hey — I'm in a decision theory seminar this term (philosopy dept, cross-listed with econ) and I'm trying to work out what I actually think about the urn cases before I have to write anything up, going by gut rather than by the readings.

  Setup for all of them: you get $100 if the ball comes up red, otherwise nothing. K is a normal urn: exactly 50 red and 50 black, shaken, drawn by a machine. M is 100 balls, red and black in some mix I'm not told, and I'm also not told how it got filled.

  Here's where I land. Red from K versus red from M: I take K. Black from K versus black from M: I also take K. I know that pair is the famously awkward one and I still feel both. M filled by someone who gets $100 if I lose and who knows I'm betting on red: I take K, more strongly than in the first case — but honestly not that much more, which surprised me. M filled by someone who gets $100 if I win: I still take K. Less confidently, but I take it, and that one feels dumb of me. M filled by a machine that pulled 100 balls one at a time out of an enormous bin that is half red and half black, where I'm told this and believe it but can't check: here I'm basically fine, I'd take either urn — which is strange, because I know exactly as much about the actual contents of M as I did in the first case. K, but the draw is done by hand by someone with a tremor, and I've been told red balls are heavier and sink: I feel a flicker of something, but I'd still take it at even odds. Nowhere near as bad as the first case. Two urns, K and M, one ball from each, $100 if the two balls are the same colour: totally fine, feels like a coin flip. Someone in my seminar said that if I'm fussy in the first case I should be fussy here too, and I don't see why, but I also can't explain why not. And: I can pay $5 to watch one ball get drawn from M and put back before I choose. I'd pay. If it comes up red I feel better about betting on red, but I'd still take K.

  The rule I've been telling myself is: if I don't know the chances, act as if they'd been set to make me lose — unless I know the process that set them, in which case just work out the number and go with that. I think that gets the basic case, the hostile-filler case and the machine-filled case, but it says the wrong thing about the friendly-filler case and it's way too strong on the tremor case.

  So: is there one principle that gets all of these, or a defensible subset? I want it stated precisely enough that I could apply it to a case I haven't seen, with the verdicts that motivate each bit of it, and an honest account of which of my verdicts it can't save and why those are the ones to give up. And I want to know what it says about the one I keep flip-flopping on: M is 100 balls and all I'm told is that it contains at least 30 red and at least 30 black. Half the time that feels like knowing nothing, half the time it feels like it makes the whole thing fine. Also, does the principle have anything to say about whether I should pay the $5, or is that a separate question I'm smuggling in? I have a feeling it might be. I can't look anything up right now and I don't want paper recommendations or a reading list — I want the formulation and its verdicts, plus whatever standard rivals are worth putting next to it.
reasoning: |-
  Okay, let me start by unpacking this user's dilemma. They're in a decision theory seminar dealing with urn cases, trying to reconcile their intuitive judgments with a coherent principle. The core tension is between known probabilities (urn K) and ambiguous ones (urn M), with variations introducing adversarial actors, mechanical processes, and partial information.

  First, I notice their intuitions consistently favor urn K except in two scenarios: when M is filled by a verifiably random process (machine drawing from giant bin), and when betting on color matches between K and M. This suggests their discomfort stems not from ignorance per se, but from unconstrained causal influences—especially when humans with conflicting incentives are involved. The tremor case is telling: known physical bias triggers only mild concern compared to intentional manipulation.

  Their self-proposed "assume worst-case" rule explains hostility cases but fails friendly fillers and tremors. This indicates the real heuristic might be about *control* rather than pure uncertainty. When forces could deliberately undermine them (even potentially), they avoid ambiguity; when processes are indifferent or constrained, ambiguity becomes acceptable. 

  For the 30-red-30-black case, their flip-flopping makes perfect sense: the constraint removes extreme risks (no <30% red), but preserves uncertainty about the exact probability. If their principle centers on *exploitable vulnerability*, this case sits awkwardly—the bounds prevent worst-case exploitation, yet allow adversarial tuning within limits. 

  The $5 payment question reveals another dimension: they value information-gathering precisely because it reduces ambiguity about exploitability. Observing a draw provides evidence about whether the filler *actually* manipulated outcomes, not just whether they could have. This separates epistemic uncertainty from strategic risk.

  Now to systematize. The robust principle seems to be: **Prefer options where no agent has both incentive and opportunity to make you lose.** This handles:
  - Standard M: Unknown filler *could* be hostile → avoid
  - Hostile filler: Explicit incentive → strong avoid
  - Friendly filler: Inverse incentive → weak preference for K (since opportunity remains)
  - Machine-filled: No agent → indifferent
  - Tremor case: Physical bias isn't agential → tolerate
  - Two-urn match: Neither urn's filler controls the *match* outcome → indifferent

  It also explains paying $5: it tests whether an adversary *acted* on their opportunity. For the 30-30 case: a hostile filler can still set red=30% (near-worst-case), so caution persists. Their occasional comfort might stem from imagining non-agential filling (e.g., natural processes), exposing context-dependence in their intuition.

  Key rivals would be:
  1. **Maximin (their initial rule):** Too strong—wrongly rejects friendly fillers and tremors.
  2. **Subjective Bayesianism:** Requires precise priors, can't explain hostility aversion without ad-hoc beliefs. 
  3. **Knightian uncertainty:** Explains standard case but not differential responses to fillers.

  Their seminar peer's critique about two-urn matching highlights a nuance: the principle cares about *who controls the loss condition*. In single-urn bets, the filler controls the probability; in matching, neither does. Giving up the "friendly filler" intuition might be necessary—since opportunity for harm exists regardless of intent, maintaining caution there is consistent.

  Final principle formulation: **In the presence of ambiguity, discount options where the outcome depends on a process that could be controllably optimized against your interests by an aware entity.**
answer: |-
  Here's a unified principle derived from your intuitions, its exact verdicts on your cases, and a clear breakdown of where it aligns with your gut and where it requires revising your judgments. The core insight is that your discomfort stems not from *ignorance of probabilities* but from **unknown or adversarial causal influence over the outcome**.

  ### The Principle: **Causal Robustness**
  > Prefer an option if either:
  > 1. **The outcome-generating process is objectively symmetric or mechanistically verifiable** (e.g., known physical randomization), OR
  > 2. **No agent with conflicting incentives has unconstrained causal control over the process**.
  >
  > If neither condition holds, assume the worst-case *feasible* manipulation by an adversarial agent.

  **Key Mechanics:**
  - **"Unconstrained causal control"**: An agent can freely manipulate the process to harm you.
  - **"Feasible manipulation"**: Only physically possible setups are considered (e.g., can't violate known constraints).
  - **Objective processes** (like K) always satisfy (1). Ambiguous processes (like M) default to (2) unless specified otherwise.

  ---

  ### Verdicts on Your Cases
  | Case                                      | Your Judgment | Causal Robustness Verdict | Alignment | Why? |
  |-------------------------------------------|---------------|---------------------------|-----------|------|
  | **Red from K vs. Red from M**             | Prefer K     | Prefer K                 | ✅        | M fails (1) and (2): unknown filler *could* be adversarial. K satisfies (1). |
  | **Black from K vs. Black from M**         | Prefer K     | Prefer K                 | ✅        | Same as above—symmetry doesn't matter; control does. |
  | **M filled by hostile agent**             | Prefer K     | Prefer K                 | ✅        | Explicit adversarial control → worst-case assumed (e.g., M has 0 red). |
  | **M filled by friendly agent**            | Prefer K     | Prefer K                 | ❌ (Revise) | *You should be indifferent.* Friendly agent lacks *conflicting incentives*, so (2) is satisfied. Principle says: no adversarial control → treat as neutral uncertainty (like a fair coin). |
  | **M filled by random machine**            | Indifferent  | Indifferent              | ✅        | Satisfies (1): mechanistically verifiable randomness. No agent → no adversarial control. |
  | **K with tremor + bias**                  | Prefer K     | Prefer K                 | ✅        | Satisfies (1): known physical process. Bias is calculable risk, not unconstrained control. |
  | **Bet on same color (K and M balls)**     | Indifferent  | Indifferent              | ✅        | No agent controls *both* urns → outcome depends on independent processes. Satisfies (2) for the bet structure. |
  | **Pay $5 to observe M draw**              | Yes, pay     | Pay if affordable        | ✅        | Information reveals if an adversary *acted* on control. Red draw reduces feasibility of 0-red (worst-case). |
  | **M: At least 30 red and 30 black**       | Flip-flops   | Prefer K (weakly)        | ⚠️ (Partial) | Worst-case *feasible* is 30% red (adversary sets min to hurt you). Not as bad as 0% but still manipulable. |

  ---

  ### Where You Revise Your Intuitions
  1. **Friendly filler case**:  
     - Principle says: **No adversarial incentive → indifference between K and M**.  
     - Why revise? Your "assume worst-case" reflex overextends. A friendly filler has no motive to harm you, so M is just an urn with unknown-but-non-malicious odds. Betting on M is like betting on an unknown coin from a friend—you'd rationally accept it at even odds. Your intuition here is "dumb" because it conflates *ignorance* with *threat*.

  2. **M with ≥30 red/black**:  
     - Principle says: **Prefer K, but less strongly than standard M**.  
     - Why? A hostile agent can set red=30% (worst feasible), making M worse than K (50%). If no agent is involved (e.g., natural process), it *should* feel "fine"—but your uncertainty about the filler's existence/intent justifies caution. Your flip-flop reflects this ambiguity: when you assume no adversary, it's fine; when you suspect one, it's not.

  ---

  ### Why Your Seminar Peer is Wrong About the Two-Urn Match
  - Their argument: "If you avoid M in single draws, you should avoid it in matches."  
  - **Causal Robustness reply**: In the single urn bet, an adversary controls *your entire loss condition*. In the two-urn match, no single agent controls the outcome—it requires matching colors across two independent processes. Adversarial control over M can't force a loss (e.g., if M is all red, you win when K is red). The bet structure neutralizes unilateral control.

  ---

  ### Standard Rivals and Why They Fail
  1. **Maximin (your initial rule)**:  
     - *Rule*: Always assume the worst possible probability.  
     - *Fails*: Wrongly rejects friendly filler (shouldn't assume worst-case) and tremor case (bias isn't "worst possible"). Can't explain why you're fine with machine-filled M.

  2. **Subjective Bayesianism**:  
     - *Rule*: Assign priors, maximize expected utility.  
     - *Fails*: Can't explain hostility aversion without ad-hoc priors (e.g., "always assume high P(adversary)"). Makes you indifferent in all M cases unless you assume malice—but why assume that uniformly?

  3. **Knightian Ambiguity Aversion**:  
     - *Rule*: Avoid options with unknown probabilities.  
     - *Fails*: Can't explain why you accept machine-filled M or the two-urn match. Also can't differentiate hostile vs. friendly fillers.

  ---

  ### The $5 Payment Question
  - **Separate but addressed**: Paying for information tests whether an adversary *acted*. If you draw a red ball, worst-case manipulation is less feasible (can't be 0% red). The principle supports paying because it reduces uncertainty about *feasible adversarial control*. If the draw is black, you might avoid M entirely.

  ---

  ### Final Formulation
  **Causal Robustness Principle (Precise Version):**  
  > Let an option's *causal vulnerability* be the extent to which an agent with conflicting incentives could manipulate the outcome. Prefer options with lower causal vulnerability. Assign maximum vulnerability if:  
  > (i) The process is controlled by a known adversary,  
  > (ii) Control is feasible and unconstrained (within physical limits).  
  > Else, assign vulnerability proportional to uncertainty about adversarial intent/control.  
  > Processes with objective randomness (verifiable or known-symmetric) have vulnerability 0.

  **Why defensible?**  
  - Explains your aversion in hostile/standard cases (high vulnerability).  
  - Justifies indifference in machine/random cases (vulnerability 0).  
  - Forces revision of friendly-filler intuition (vulnerability 0 if intent known, low if uncertain).  
  - Handles constraints (e.g., ≥30 red) by limiting feasible manipulation.  
  - Extensible: Applies to any unseen case by assessing "Who controls this, and can they hurt me?"

  **What to give up:** Your instincts about the friendly filler and the tremor case. These are overgeneralizations of threat detection. The tremor case has calculable risk; the friendly filler has no rational threat. Hold firm on the rest—they reveal a coherent norm of avoiding *exploitable uncertainty*.
