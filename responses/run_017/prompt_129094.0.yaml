answer: |-
  **1.**  
  Question: Does your account of conscience's emergence explain only its existence, or also its specific injunctions—and what observable finding would falsify it?  
  Follow-up: You might cite hive-bees to show you never promised our exact moral code, but that variability itself challenges whether your theory predicts *any* stable core content, rendering it unfalsifiable if all outcomes fit.  

  **2.**  
  Question: Can tribal selection for patriotism and obedience genuinely explain sympathy extending impartially to strangers, distant generations, or animals—or is this wider sentiment imported from elsewhere?  
  Follow-up: Granting that advancing civilization widens sympathy, your mechanism relies on inter-tribal conflict; this cannot select for concern towards entities *beyond* the competing group, making universal benevolence an unexplained addition.  

  **3.**  
  Question: Did selective pressures shape conscience to track reproductive fitness or independent moral truths—and if the former, why trust its verdicts, like condemning slavery as owed justice?  
  Follow-up: You may say conscience requires no external truth, being sentiment alone—yet calling slavery a "sin" and demanding "rights" for the enslaved implies objective wrongs, not mere distaste.  

  **4.**  
  Question: Why does your natural history of belief deflate religion (e.g., design arguments failing post-selection) but not morality, given both stem from evolved faculties?  
  Follow-up: While noting origin doesn’t dictate truth, you treat theology’s genealogy as *discrediting* while morality’s isn’t—yet offer no criterion for this asymmetry beyond intuitive confidence in conscience.  

  **5.**  
  Question: If aiding the weak is injurious yet conscience compels it against "hard reason," what authority remains for conscience when it urges maladaptive acts?  
  Follow-up: The surgeon hardening himself is adaptive self-control; but systematically preserving the "helpless" contradicts selection itself—so why is conscience’s error here nobler than reason’s correction?
