prompt: |-
  I'm on the group benefits team at a big multinational and we're rewriting the parental leave policy, and I have now stared at the current one for to long to be able to tell whether it's a coherent scheme or just several different theories bolted together. Here's the shape of it:

  - the birthing parent gets 26 weeks at 90% of pay, starting whenever they like from two weeks before the birth, and none of it is transferable
  - then there's a shared pot of 30 weeks at a flat rate, which either parent can take in up to three separate blocks any time before the child turns three
  - 8 of those 30 weeks are earmarked for the second parent and lapse if they aren't used — but only if that parent is also on our payroll; if they work somewhere else, the 8 weeks just fold back into the general pot
  - any block shorter than 4 weeks is paid at 70% of the flat rate, and any week taken after the child's first birthday is paid at half the flat rate
  - the 90% bit has to be repaid pro rata if you leave within 12 months of coming back
  - seperate scheme: we subsidise nursery fees, but only for hours when both parents are working or studying. A parent who is on leave, or working part time, gets nothing for those hours.

  What I want to know is what a scheme like this presupposes about what parental leave is *for*. Is the 90% block really a medical and recovery benefit, so that it's sickness leave wearing a different hat? Is the shared pot a right the child has to be cared for by its parents, or a right the parents have, or deferred pay, or a retention device, or a deliberate nudge to rebalance care work inside couples? And which of those does the scheme actually presuppose, as opposed to merely sitting comfortably with?

  The bits that puzzle me most: the 90% block is individual and non-transferable, which seems to presuppose something about bodies and recovery, but the clawback only makes sense if the money is conditional on coming back, which is a different kind of justification entirely. The earmarked 8 weeks look like they treat the couple rather than the person as the unit — otherwise why would the weeks evaporate when the second parent happens to work elsewhere? And the childcare subsidy seems to assume the dual-earner family is the normal and desirable case, and that care provided by a parent during working hours is worth precisely nothing, while the leave scheme pays people to provide exactly that.

  My hunch is that the fragmentation penalty and the halving after the first birthday are really a "get back to work" mechanism dressed up as flexibility, and that they sit badly with the rest of it — but I'd like you to try to defend them rather than just agree with me. Maybe the whole thing is underdetermined and several theories would generate it.

  So: reconstruct the implicit theory, tell me where the scheme is genuinely inconsistent and where it's merely philosophically underdetermined, and tell me concretely what we'd have to change if we rebuilt it on each of the main rival readings — leave as the child's entitlement, leave as deferred compensation, leave as a gender-equality instrument, or the firm trying to be neutral between dual-earner and single-earner families. And if leave is the child's entitlement, does that commit us to extending it to adoptive parents and to carers who aren't employees? Please write in British English (organise, favourite, and so on).
reasoning: |-
  Okay, let me unpack this complex parental leave policy query. The user is clearly steeped in benefits design but has reached that point of policy fatigue where the original intent gets lost in mechanics. 

  First, I need to map the policy's moving parts to their possible philosophical underpinnings. That 26-week individual block at 90% pay screams "medical necessity" - it's non-transferable and tied to birth timing. But then the clawback provision contradicts that by treating it as retention bait. Interesting tension there.

  The shared pot feels like two ideas welded together: the 30-week base could be framed as the child's right to care, while the earmarked 8 weeks for second parents is clearly trying to nudge gender equality... except when it mysteriously vanishes if the partner works elsewhere. That's either a loophole or reveals a firm-centric worldview where benefits only "count" internally.

  Now those punitive bits - fragmentation penalties and post-birthday rate cuts. The user suspects they're "return-to-work" tools in disguise, which seems plausible. But playing devil's advocate: could they reflect actuarial concerns about operational disruption? Though if that were true, why allow three separate blocks at all?

  The childcare subsidy is the most philosophically stark element. By only paying when both parents are working/studying, it actively devalues parental care time - which directly contradicts the leave scheme's premise. That's not just inconsistent, it's ideologically incoherent.

  When reconstructing rival frameworks:
  - Child-entitlement model would demand equal treatment for adoptive parents and likely extend to non-employee caregivers
  - Deferred compensation would focus on tenure-based accruals
  - Gender-equality lens would push harder on nontransferable quotas
  - Dual-earner neutrality might eliminate the childcare subsidy's conditionality

  The real headache is that different policy elements point to different masters: HR retention goals, DEI aspirations, cost containment, and uncritical adoption of "presenteeism" culture. No wonder it feels bolted together.

  For the redesign pitch, I'll need to show how tweaking specific levers (like making the 8-week reserve truly universal or killing the fragmentation penalty) would shift the philosophical center of gravity. The subsidy contradiction especially needs airing - can't simultaneously pay parents to care and pay others to replace that care.
answer: |-
  Here’s a reconstruction of your policy’s implicit theories, inconsistencies, and redesign options based on core philosophies of parental leave, using British English:

  ### **Implicit Theories in Your Current Scheme**
  1. **The 26-Week Block (90% Pay)**  
     - **Presupposes**: Primarily **medical/recovery necessity** (non-transferable, birth-timed, individual).  
     - **Clawback Contradiction**: The 12-month repayment clause reframes it as **retention tool/deferred compensation**, undermining the medical justification.  
     - *Verdict*: **Inconsistent**. Medical leave shouldn’t be contingent on future employment.

  2. **Shared Pot (30 Weeks)**  
     - **Flexibility**: Supports **parental choice** (blocks, timing until age 3).  
     - **Earmarked 8 Weeks**:  
       - *Internal couples*: Acts as a **gender-equality nudge** (reserving time for non-birthing parents).  
       - *External partners*: Lapsing weeks reveal **firm-centric logic** (benefits as an employee perk, not a child’s right).  
     - *Verdict*: **Underdetermined**. Balances child’s care rights and gender equality but privileges "in-house" couples.

  3. **Penalties (70% for <4 Weeks; 50% After Age 1)**  
     - **Defence**: Encourages substantive care periods and cost management for late leave. Could align with **operational pragmatism** (minimising fragmented absences).  
     - **Critique**: Contradicts **child’s entitlement** logic (care needs don’t drop at age 1). Signals **labour coercion** ("get back to work").  
     - *Verdict*: **Inconsistent** with child/family-centred goals; consistent only with productivity aims.

  4. **Childcare Subsidy**  
     - **Presupposes**: **Dual-earner normativity**. Only values care when parents are "economically productive". Directly clashes with paying parents to provide care via leave.  
     - *Verdict*: **Philosophically inconsistent** with the leave scheme’s care-validation logic.

  ---

  ### **Rebuilding the Scheme: Rival Frameworks**  
  **1. Child’s Entitlement Model**  
     - **Core Principle**: Leave is the child’s right to parental care, regardless of parents’ employment.  
     - **Changes Needed**:  
       - Extend full benefits to **adoptive parents** and **non-birthing carers** (e.g., same-sex partners).  
       - Remove **clawbacks** (rights aren’t repayable).  
       - Scrap **fragmentation penalties** and **age-based rate cuts** (care needs are continuous).  
       - Make the "earmarked" 8 weeks **universal** (no lapse for external partners).  
       - *Childcare subsidy*: Revise to support all care arrangements, not just dual-earner hours.

  **2. Deferred Compensation/Retention Tool**  
     - **Core Principle**: Leave is accrued pay conditional on loyalty.  
     - **Changes Needed**:  
       - Strengthen **clawbacks** (e.g., extend to all paid leave).  
       - Tie leave duration/rate to **tenure** (e.g., 100% pay after 5 years’ service).  
       - Keep **non-transferability** (individual benefit).  
       - Drop **earmarked weeks** (redundant if retention-focused).  
       - *Childcare subsidy*: Align with return-to-work (e.g., subsidise only post-leave).

  **3. Gender-Equality Instrument**  
     - **Core Principle**: Redistribute care work by compelling non-birthing parents’ participation.  
     - **Changes Needed**:  
       - Make the "second parent" quota **longer, non-transferable, and universal** (e.g., 12 weeks at 90%, no lapse).  
       - **Penalise non-use** (e.g., forfeit if not taken by second parent).  
       - Remove **fragmentation penalties** (encourages uptake).  
       - *Childcare subsidy*: Prioritise subsidising care during *equally split* leave periods.

  **4. Dual-Earner/Single-Earner Neutrality**  
     - **Core Principle**: State/firm shouldn’t preference one family model.  
     - **Changes Needed**:  
       - Scrap **childcare subsidy conditionality** (support all families equally).  
       - Make shared pot **truly flexible** (no penalties for part-time use).  
       - Remove **earmarked weeks** (imposes dual-parent norm).  
       - Offer **cash-out options** for unused leave (supports single-earner choice).  

  ---

  ### **Key Inconsistencies vs. Underdetermined Elements**  
  | **Element**               | **Inconsistency**                                  | **Underdetermined?**                     |  
  |---------------------------|---------------------------------------------------|------------------------------------------|  
  | **90% block clawback**    | Medical need vs. retention logic.                 | No – **Fix** or drop one justification. |  
  | **Lapsing 8 weeks**       | Child’s right ≠ firm-centric lapse rule.          | Yes – Could align with either model.     |  
  | **Age-based rate cuts**   | Clashes with child’s ongoing care needs.          | No – **Remove** to align with care focus.|  
  | **Childcare subsidy**     | Actively contradicts leave’s care-validation.     | No – **Overhaul** conditionality.        |  

  ### **Recommendation**  
  Your policy is **philosophically fragmented**, not merely underdetermined:  
  - **Medical**, **care-entitlement**, and **retention** goals clash in the 26-week block.  
  - **Gender equality** is undermined by lapsing reserves for external partners.  
  - **Childcare subsidy** actively conflicts with leave’s ethos.  

  **To rebuild coherently**:  
  1. Choose one primary lens (e.g., **child’s entitlement**).  
  2. Scrap elements that contradict it (e.g., clawbacks, subsidy conditionality).  
  3. If retaining multiple goals, add **explicit trade-offs** (e.g., "We prioritise X, but accommodate Y via Z").  

  Example for a **child-focused scheme**:  
  > *"All primary carers receive 26 weeks at 90% pay (medical recovery + bonding). The child is entitled to 52 weeks of shared care: 26 weeks at 80% pay (state top-up), 26 weeks unpaid. Adoptive parents included. No clawbacks. Childcare subsidy universal."*  

  Would you like scenario-based redrafts for specific frameworks?
