  ### Decision Tree: Social Discount Rate for Long-Term Projects  
  *Assume: (1) Some far-future benefits are worth paying for; (2) Unspent money can be invested at a positive real return; (3) Future people’s welfare counts.  
  Work through the branches below. At each node, choose the option closest to your view.*  

  ---

  #### **Branch 1: Sea Wall (Certain Future)**  
  A coastal defense project costs $1B today and prevents $10B in damage exclusively in year 200. Beneficiaries will *certainly exist* and are *no richer than us*.  
  **How do you value the $10B future benefit?**  
  - **A**: Treat it as equivalent to $10B today (no time discount).  
  - **B**: Discount it to less than $10B present value.  
  *Note: A is defensible—no ethical reason to discount if beneficiaries are equally well-off and certain.*  

  #### **Branch 2: Sea Wall (Extinction Risk)**  
  Same project, but experts say there’s a 50% chance *no one exists* in year 200.  
  **How do you adjust for this risk?**  
  - **A**: Multiply the benefit by 50% (treat as probability).  
  - **B**: Use a higher discount rate (treat as time preference).  
  *Note: A is defensible—extinction risk is an event probability, not a preference about time.*  

  #### **Branch 3: Sea Wall (Risk-Reducing Project)**  
  Suppose the sea wall *itself* cuts extinction risk in half (e.g., by preserving infrastructure).  
  **Does this change your approach?**  
  - **A**: Yes—account for risk reduction separately (e.g., add it as a co-benefit).  
  - **B**: No—use the same method as in Branch 2.  
  *Note: A is defensible—projects affecting survival need explicit risk modeling.*  

  #### **Branch 4: Personal Discomfort**  
  You must choose: (1) Mild discomfort today, or (2) Severe discomfort in 10 years. You’ll live to experience both.  
  **Which do you choose?**  
  - **A**: Mild discomfort today.  
  - **B**: Severe discomfort in 10 years.  
  *Note: A is defensible—individuals reasonably discount their own future pain.*  

  #### **Branch 5: Backward-Looking Compensation**  
  Two claims for seized land: one 300 years ago, one 5 years ago. Land value at seizure was identical in today’s dollars.  
  **Should compensation be the same?**  
  - **A**: Yes—the harm’s magnitude doesn’t fade with time.  
  - **B**: No—prioritize recent claims (discount past harm).  
  *Note: A is defensible—temporal position shouldn’t alter owed compensation.*  

  #### **Branch 6: Distant vs. Near-Term Gaps**  
  When discounting, is the reduction in present value between years 100–101 **as large** as between years 0–1?  
  - **A**: Yes—use a constant discount rate.  
  - **B**: No—the distant gap should be smaller (declining rate).  
  *Note: B is defensible—uncertainty compounds over time, reducing precision.*  

  #### **Branch 7: Creating New Lives**  
  A project improves life for future people *and* creates additional worthwhile lives (e.g., via ecosystem restoration).  
  **How do you value new lives?**  
  - **A**: Count their welfare fully (e.g., "total utilitarianism").  
  - **B**: Ignore them or count only gains to existing lives.  
  *Note: No clear best answer; splits welfarists from "person-affecting" views.*  

  #### **Branch 8: Saving Rate Dilemma**  
  A 0% discount rate + optimistic growth implies saving 50% of current income for the far future, causing hardship.  
  **How respond?**  
  - **A**: Accept it—the future’s needs dominate.  
  - **B**: Use a positive discount rate to lower savings.  
  - **C**: Reject both extremes—use a balanced criterion.  
  *Note: C is defensible—avoids "dictatorship of the future" without ignoring it.*  

  ---

  ### Leaves (Final Positions)  
  Based on your path, identify your leaf. Each carries an awkward commitment:  

