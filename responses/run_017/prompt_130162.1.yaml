prompt: |-
  you're a historian of the Vienna Circle who also knows how design systems actually get built — take a minute to brainstorm before you answer.

  I'm a product designer: I build design systems (icon sets, components, all the documentation around them) and I've shipped localized products into a couple dozen locales. So translate Otto Neurath's picture-language project into the vocabulary I actually use — the Isotype charts from his Vienna museum in the interwar years, the flat repeat-the-symbol-to-show-quantity thing, the deliberate ban on perspective and shading, the "transformation" step where a source image gets flattened into a reusable symbol, the claim that the pictures still have to be taught and arn't self-explanatory, and the bigger claim that a shared visual language gives ordinary people and social scientists a common empirical footing. Map it onto tokens, icon semantics, localization, legibility at small sizes, brand constraints, the implicit grammar of a component library. Keep the translation honest — don't quietly swap my assumptions in and call it translation.

  Then give me the residue report, which is the part I care about: what translates cleanly, what only survives if you distort it, and what has no expression in my vocabulary at all. My hunch is that the whole thing is just a design system with an epistemological and political program bolted on, and that the epistemology does no real work. Tell me whether that's right, or whether there's something on Neurath's anti-foundationalist / unified-science side that my vocabulary genuinely can't say. Hard cap: 400 words.
