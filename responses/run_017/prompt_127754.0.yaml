prompt: |-
  Six months ago a close friend, who was diagnosed with bipolar I after a severe manic episode, asked me to serve as the enforcement agent under his psychiatric advance directive. If he stops his medication and becomes manic again, I am the person who signs the papers that get him admitted and treated over his objection. I said yes before I had thought about it. Since then I have been trying to work out, in a form I could actually defend to myself, when I would be right to refuse to enforce it. The same question is coming at me in an institutional form as well: I sit on the committee drafting the founding charter of a federation of housing cooperatives, and we are arguing about whether to entrench certain clauses against ordinary amendment.

  So what I need is a thought experiment built to specifications, not a survey of the literature. Build me a case of a Ulysses contract that is self-consuming: one in which the precommitment was adopted as a means to a transformation in the person himself, and in which completing that transformation requires, at the end, a decision made by the transformed person exercising the very capacities the restraint suspends. That is the notion I want tested, and you should feel free to sharpen it if you can state it better.

  Specifications:

  1. Realistic and contemporary. One paragraph. A hospital, a conservatorship or commitment hearing, a sober-living or residential treatment agreement, a religious vow, a founder's lock-up: a device that actually exists. No science fiction, no implanted or invented neurotechnology, no perfect predictors, no fission or teletransportation, and no appeal toParfitian metaphysics about what makes someone the same person over time. I want the normative dispute isolated, not dissolved into a dispute about identity.

  2. Every condition that friends of such agreements require for legitimate enforcement should hold: made in a cool hour, by a competent and informed adult, voluntarily, specific about the triggering circumstance, with a known mechanism by which the later condition (mania, craving, panic, despair) distorts judgment, and with no third party who benefits from enforcement.

  3. The epistemic question is to be settled by stipulation inside the case, not argued about. Give the agreement a verification clause: an independent assessment against stated criteria has confirmed that the bound person is competent, informed, and that the refusal is not itself a symptom of the condition the agreement guards against. The disagreement that remains must be purely normative.

  4. Stakes are high and irreversible, with a closing window, so that waiting to see how things settle is not available.

  5. The failure of enforcement must not come from any of the standard exits, and the case should make clear that it does not: the earlier self was not coerced, mistaken, or incompetent; circumstances have not changed in any unforeseen way; the later self is competent; the enforcing agent has no conflict of interest.

  6. Three verdicts, in specified directions. A precedent-autonomy view enforces. A present-autonomy view does not. A third view — I have in mind something like intertemporal co-authorship, on which a person's life is a cooperative arrangement among temporal stages and enforcement is warranted when the later refusal is attributable to the impairment the device was built to survive — must side with precedent autonomy in a textbook Ulysses case and side with present autonomy here. It must not be present autonomy relabeled: show it enforcing somewhere.

  After the scenario, walk through what each of the three views says and why, and then tell me which feature of the case is doing the work, what happens to each verdict if that feature is removed, and how a defender of precedent autonomy would attack the case. I expect the obvious attack to be that any I have been transformed exemption is indistinguishable in practice from the symptom the contract exists to discount, and I want to know whether your verification clause actually blunts that or merely restates it.

  Finally, one paragraph on whether a self-consuming precommitment has an analogue in constitutional entrenchment: a clause entrenched in order to make possible a political transformation whose success would render the entrenchment unnecessary or illegitimate. If the institutional case comes apart from the individual one, say what separates them — that many persons are involved, that amendment is the analogue of refusal, or something else — and whether the feature that does the work in your scenario survives the transfer.

  The point of all this is practical: I need a reason that would justify refusing to enforce in some possible future version of my friend's directive, and it cannot be a reason so loose that it licenses ignoring any directive at all. An exemption that turns out to be a general loophole is a failed design, and you should say so if that is where your case lands. If the specifications cannot all be met together, tell me which one gives way and what that shows.
reasoning: |-
  Okay, let me start by unpacking the user's query. They need a thought experiment about a self-consuming Ulysses contract. The key points are that the precommitment is meant to transform the person, and enforcing it later would undermine that transformation. The scenario must be realistic, meet all standard conditions for legitimacy, include a verification clause, have high stakes, and avoid standard loopholes. Plus, three verdicts: precedent autonomy enforcing, present autonomy not enforcing, and a third view that switches sides based on transformation.

  First, I need to create a scenario that fits. The example of a religious vow like a Catholic priest's promise of celibacy comes to mind. It's contemporary and real. The person takes the vow to achieve spiritual transformation, and after years, they genuinely feel transformed but now wish to leave the priesthood. The verification clause confirms they're competent and not impaired. This satisfies specifications 1 and 2.

  Next, the verification clause (spec 3) is crucial. An independent panel assesses that Father Mark isn't depressed or impaired, just authentically changed. High stakes: he has a limited-time job offer, so waiting isn't an option (spec 4). 

  For spec 5, ensure no standard exits. Mark wasn't coerced, circumstances haven't changed unexpectedly, he's competent, and the bishop has no conflict. The core conflict is normative, not epistemic.

  Now the three verdicts. Precedent autonomy enforces the vow. Present autonomy respects his current choice. The third view, intertemporal co-authorship, sides with present autonomy here because the transformation is complete. The key feature is the achieved transformation. If removed, the third view would enforce like precedent autonomy.

  The user's concern about the "transformation exemption" being a loophole is addressed by the verification clause. It's robust here but might be tricky in other cases. For the institutional analogy, constitutional entrenchment for political transformation could be self-consuming, but amendment requires collective action, making it different from individual refusal.

  I should check if all specs are met. The scenario seems solid. The attack from precedent autonomy defenders would be that the verification clause is unreliable, but the case sets high standards to counter that. The loophole risk exists but is contained by strict verification. 

  Finally, the practical application: the user needs a justified reason to refuse enforcement for their friend's directive. The transformation with verification provides that, without being a general loophole. They should ensure the directive includes similar verification criteria.
answer: |-
  Here is a thought experiment meeting your specifications, followed by analysis:

  **Scenario: The Completed Vow**  
  Father Mark, a devout Catholic priest for 15 years, entered seminary after a profound conversion experience following a life marked by impulsive hedonism and fractured relationships. Recognizing his past instability and deep longing for lasting spiritual commitment, he voluntarily made a solemn, lifelong vow of celibacy *as a means to achieve a fundamental transformation* – to internalize priestly identity so completely that celibacy would cease to feel like a sacrifice and become an integrated part of his being. Ten years later, after sustained prayer, therapy, and exemplary service, Mark experiences this transformation: he feels profound peace, his identity is now wholly that of a priest, and celibacy feels natural. However, this integrated self now concludes, with calm conviction, that his authentic calling requires him to leave the priesthood to marry and start a family, seeing this not as a rejection but a fulfillment of his journey. The triggering circumstance (a return to impulsive instability demanding enforcement) is absent. An independent panel (psychiatrist, theologian, senior priest) confirms Mark is competent, informed, free of depression or manic symptoms, acting authentically (not due to "acedia" or crisis), and circumstances are unchanged. The bishop (enforcer, bound by canon law and the vow) must decide *now* whether to grant the dispensation Mark requests, as a unique academic position he requires outside the priesthood has a deadline. Enforcement means blocking the dispensation.

  **Verdicts:**

  1.  **Precedent Autonomy:** Enforces the vow. Mark made a free, informed, rational commitment in a "cool hour" to bind his future self against anticipated weakness or error. The verification clause confirms the formal validity. The promise itself creates the obligation; the transformed self’s new desires are irrelevant. The bishop must deny the dispensation.
  2.  **Present Autonomy:** Does not enforce. The competent, un-impaired Mark *now* possesses full autonomy. His current settled will reflects who he truly is. Respecting persons requires respecting their *current* competent choices, not past mandates that now feel alien. The bishop should grant the dispensation.
  3.  **Intertemporal Co-Authorship:** Does **not** enforce. This view asks: *Is the refusal attributable to the impairment the device was designed to counter?* Here, it is not. The vow was a scaffold *for* transformation; the transformation is complete. Enforcing the vow now would *prevent* the transformed self from exercising the very capacities (integrated judgment, authentic identity) the scaffold helped build. The refusal stems from the *success* of the precommitment, not its failure or the targeted impairment (impulsive instability). The later self is not a "defector" due to impairment but a legitimate co-author continuing the narrative from a new, stable vantage point earned through the commitment. The agreement was self-consuming – its purpose was to make itself obsolete for *this* self. (Contrast: In textbook mania, refusal *is* attributable to the impairment; enforcement aligns stages against the distorting force).

  **The Key Feature & Its Role:**  
  The **achieved transformation specifically targeted by the precommitment itself** is doing the work. The vow wasn't just *against* impulsivity; it was explicitly *for* becoming a person for whom celibacy is natural *and* whose judgment about his vocation flows from that integrated identity.

  *   **If Transformation is Removed:**
      *   Precedent Autonomy: Still enforces (e.g., if Mark just changed his mind without deep transformation).
      *   Present Autonomy: Still refuses enforcement (respects current choice).
      *   **Intertemporal Co-Authorship: Switches to ENFORCE.** If Mark hasn't achieved the targeted transformation (e.g., he's just restless or mildly conflicted), his refusal *could* be seen as a failure of the process or nascent instability, attributable to the kind of weakness the vow guards against. Enforcement protects the co-authored project.

  **Attack from Precedent Autonomy (PA):**  
  A PA defender argues the "transformation exemption" is indeed indistinguishable from the symptom. The verification clause merely restates the problem: *How can any panel reliably distinguish "authentic transformation leading to a new competent choice" from "rationalization driven by the very impulses the vow was meant to counter" (e.g., subtle mid-life crisis, latent desire for intimacy masked as 'fulfillment')?* The vow's *point* was to bind against *all* future desires to leave, regardless of their apparent reasonableness *to the later self*, precisely because the earlier self judged those desires inherently suspect for someone with his history. Allowing the exemption destroys the predictability and force of the precommitment. The verification clause, they claim, cannot solve this epistemic problem; it just disguises a normative judgment to override the past promise as an empirical one.

  **Blunting the Attack?**  
  The verification clause *partially* blunts it by *stipulating* robust assessment rules the PA defender must accept *within the case*. It forces the PA attack to shift: they must argue that *even if* we stipulate perfect verification showing authentic transformation unrelated to old impulses, enforcing the *letter* of the promise should still trump the *spirit* of its purpose (transformation). They must defend prioritizing the *form* of the past promise over the *achieved purpose* of the precommitment for the current self. The case isolates the normative conflict: *Should a precommitment designed to enable a transformation bind the transformed self it created?*

  **Institutional Analogue: Constitutional Entrenchment**  
  A self-consuming constitutional entrenchment is plausible. Imagine a federation's charter entrenches a powerful, independent central bank with strict inflation targeting, overriding ordinary politics. The *purpose* is to force a transformation: breaking endemic inflationary expectations and establishing a deep cultural norm of price stability. If successful, after a generation, stable prices become an unquestioned public good, and the populace/internal politics reliably demand it. Enforcing the entrenchment *after* this transformation might then seem illegitimate – an unnecessary restriction on democratic self-government for a problem solved. The key difference is the **collective agent**: Amendment requires coordinated action by many transformed individuals, not a single self-refusal. The analogue of "verification" is complex political judgment about whether the transformation is complete and stable. The "self-consuming" logic survives transfer – entrenchment aims for its own obsolescence – but collective action problems and defining "the people's will" make the refusal/amendment moment inherently more contested than the individual case.

  **Practical Verdict for Your Friend:**  
  This case provides a *possible* justification for refusal: **if independent verification confirms your friend has *achieved the specific, sustained stability and integrated identity the medication/precommitment was designed to facilitate*, and their *current* refusal stems *from that achieved health* rather than mania, then enforcement might violate the directive's deeper purpose.** This is **not** a general loophole. It requires:
  1.  The directive explicitly or implicitly aiming for transformation *beyond* mere symptom control.
  2.  Robust, predefined verification *stipulating* criteria for "achieved transformation" and ruling out symptomatic refusal.
  3.  High confidence the refusal is an *authentic product of health*.
  **Risk:** Verification is still fallible. A PA defender would argue this *is* a loophole, as mania can mimic "transformative insight." However, your specifications *force* the verification clause to hold, making this a defensible, narrow exemption grounded in the *purpose* of the precommitment, not just present desire. It meets your need: a reason not to enforce that isn't just "he disagrees now," but relies on the directive *succeeding* on its own terms.
