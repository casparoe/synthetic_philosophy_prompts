answer: |-
  What you're describing is a profound and under-theorized phenomenon at the intersection of moral psychology, philosophy of emotion, and practical reason. I'll carve the phenomenon precisely, contrast it with the belief case and forgiveness, address your questions, and flag the contested grounds. The core phenomenon you identify is **Substitutional Instrumentalism**—a term I'll define and bound.

  ---

  ### **1. The Phenomenon: Substitutional Instrumentalism**
  **Definition**:  
  A psychological state where an attitude (e.g., trust, gratitude, admiration) is intentionally adopted *for instrumental reasons* (e.g., practical necessity, self-interest, or relational preservation) rather than for reasons that bear on the attitude's *fittingness* (e.g., evidence of trustworthiness, deservingness of gratitude). This generates a state that:  
  - **Is causally efficacious**: The attitude is genuinely experienced, not merely performed.  
  - **Is recognizably "real"**: It has phenomenological and behavioral substance (unlike pretense).  
  - **Is compromised**: It carries a residue of inauthenticity, fragility under reflection, and interpersonal friction.  
  - **Dissolves under salience**: Explicit attention to its instrumental origin destabilizes the attitude.

  **Boundaries**:  
  - **What it is not**:  
    - *The belief case*: Instrumental reasons cannot produce genuine belief—only pretense or self-deception ("believing at will" is impossible).  
    - *Simple hypocrisy*: The attitude is not faked; it has subjective reality.  
    - *Forgiveness*: As you note, forgiveness adopted for self-regarding reasons lacks this fragility.  
  - **Scope**:  
    - **Applies to**: Trust, gratitude, admiration, respect—attitudes that are *other-regarding* and *evaluative* (they assess the worth or actions of another).  
    - **Does not apply to**:  
      - *Self-regarding states* (e.g., self-compassion,决心).  
      - *Conative states* (e.g., decisions, intentions).  
      - *Forgiveness* (addressed below).  

  **Why the boundaries hold**:  
  Other-regarding evaluative attitudes have a "double object": (a) the person toward whom the attitude is directed, and (b) the *reason* justifying the attitude. When the reason is instrumental ("I trust you to save the business"), it bypasses the fittingness condition ("You are trustworthy"). The attitude becomes a *pragmatic substitute*—functional but ontologically unstable because its foundation conflicts with its intrinsic aim.

  ---

  ### **2. Contrast with the Belief Case: A Difference in Kind, Not Degree**  
  Your instinct is correct: **this is not the same phenomenon as the belief case**.  
  - **Belief case**: Impossible to believe *purely* for instrumental reasons. Truth-apt attitudes require evidence; attempts yield "alief" (Gendler) or pretense.  
  - **Trust case**: Possible because trust is *not truth-apt*. It is a hybrid attitude:  
    - Cognitive (involves expectations of reliability),  
    - Affective (involves emotional vulnerability),  
    - Volitional (can be cultivated through action).  
  Instrumental reasons can trigger behavioral compliance ("acting as if"), which—via self-perception or habit—generates genuine affective trust. Yet this trust is "hollow" because it lacks normative grounding in the other's *deservingness*.  

  **Key difference**:  
  - Belief is *mind-to-world* (aims to represent reality). Instrumental reasons are the "wrong kind of reason" (WKR) because they don't bear on truth.  
  - Trust is *world-to-mind* (involves a practical stance). Instrumental reasons can be "right-kind" causally but "wrong-kind" normatively. They produce a *real but alienated* state.  

  **Confidence**: High (9/10).  
  **What would change my mind**: Empirical evidence showing instrumental trust *never* generates genuine affect (only conditioned behavior), or proof that belief *can* be voluntarily adopted instrumentally without self-deception.  

  ---

  ### **3. Why Forgiveness is Different: The Self-Regarding Escape Valve**  
  Forgiveness lacks the fragility because it is **primarily self-regarding**, even when other-directed.  
  - **Structure of forgiveness**:  
    - It resolves *the victim's* resentment (Hampton, Murphy), not primarily the wrongdoer's desert.  
    - Self-interested reasons ("to heal myself") *are normatively appropriate*—they align with forgiveness's function of releasing the victim from toxic attachment.  
  - **Contrast with trust/gratitude**:  
    - Trust/gratitude *bind* you to another; their reasons must engage with the other's qualities.  
    - Forgiveness *unbinds* you; its reasons can be entirely internal.  

  **Is your sense of forgiveness's unproblematic nature mistaken?**  
  - In **therapeutic contexts**, no: Clinical forgiveness focuses on the victim's well-being, so instrumental reasons are fitting.  
  - In **moral contexts**, perhaps: Some philosophers (e.g., Griswold) argue forgiveness requires the wrongdoer's remorse to be fully moral. Yet even then, self-regarding reasons don't *destabilize* the attitude—they may just render it "imperfect" but still robust.  

  **Confidence**: Medium (7/10).  
  **What would change my mind**: Data showing forgiveness adopted for self-interest corrodes over time when the victim confronts the wrongdoer's unchanged character, or a case where someone says, "I forgave you for my peace, but it feels hollow and I resent you for it."  

  ---

  ### **4. Substitutional Instrumentalism: Boundary Cases**  
  - **Gratitude**: "I feel grateful to you (for saving my job) because otherwise I'd seem rude."  
    - *Compromised*: The gratitude dissolves if the benefactor discovers the motive.  
  - **Admiration**: "I admire your work (which I find mediocre) because it's politically useful."  
    - *Fragile*: Explicit discussion exposes the dissonance.  
  - **Non-applicable cases**:  
    - *Forgiveness*: "I forgive you because I deserve peace." → Stable.  
    - *Belief*: "I believe the system works (though evidence is weak) to motivate my team." → Pretense.  
    - *Love*: Complex—instrumental reasons (e.g., "for the children") can sustain love but may create resentment; arguably a borderline case.  

  ---

  ### **5. Contested Grounds**  
  - **The "Wrong Kind of Reasons" Problem**:  
    - Philosophers debate what makes reasons "right" for an attitude (Schroeder, Hieronymi). Hieronymi argues reasons must "settle the question" the attitude poses (e.g., trust asks, "Is this person reliable?"). Your cases show instrumental reasons *causally* succeed but *normatively* fail—a point contested by pragmatists.  
  - **Moral Residue**:  
    - Is the "compromise" a moral failing (e.g., "you should trust me for *me*, not the business") or a practical necessity? This splits ethicists (Kantian vs. consequentialist).  
  - **Forgiveness**:  
    - Is it essentially self-regarding (Nussbaum) or inherently relational (Griswold)? Your data suggest the former dominates in practice.  

  ---

  ### **Summary Verdicts**  
  1. **Name**: **Substitutional Instrumentalism**—instrumental reasons *substitute for* fitting reasons, generating a functional but alienated attitude.  
  2. **Vs. Belief Case**: Different in kind. Beliefs can't be willed; trust can be bootstrapped instrumentally but remains normatively deficient.  
  3. **Forgiveness Exception**: Plausibly due to its self-regarding core. Therapeutic practice validates this; moral theory may qualify it but doesn't undermine its stability.  

  This framework makes testable predictions:  
  - Substitutional instrumentalism will arise in *evaluative, other-regarding* attitudes under relational duress.  
  - It will cause interpersonal friction when exposed.  
  - It will not manifest in self-regarding or non-evaluative states.  

  Your fieldwork reveals a crucial niche: the *psychology of moral compromise*. If no term exists, "Substitutional Instrumentalism" captures its structure—**attitudes sustained by reasons that replace their justificatory heart with a functional prosthesis**. I welcome pushback.
