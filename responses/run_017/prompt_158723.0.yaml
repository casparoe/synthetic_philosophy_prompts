prompt: |-
  I'm a PhD student in philosophy finishing up in experimental epistemology, and in three weeks I'm taking over one 75-minute session of our upper-division Knowledge and Justification course: 19 students, mixed majors, a room with a whiteboard and index cards and nothing else. I've been asked to do the session on cross-cultural variation in epistemic intuitions, and I want the students to run into the problem rather than hear about it.

  What has failed before: I've watched this taught by putting a slide of bar charts on the screen and comparing verdict distributions across populations. It collapses every time into a methodological squabble about whether the survey questions were any good, with a good part of the room concluding that the subjects must have misread the vignette. I don't want that. And I don't want to put the six or seven students in the room who learned English later, or who grew up outside the United States, on display as specimens: no asking anyone to speak for a culture, no "and what would people back home say?" moves.

  Two things I'd like the design to carry, if you think they can be made to work in the time available.

  First: what does the philosophical damage, I think, is not the first-order split but the second-order surprise. Each of us tacitly predicts that a competent, attentive person will land where we land, and predicts it with real confidence; that prediction is what licenses us to treat disagreement as a mistake rather than as a difference to be explained. So I want the activity to record that prediction before anyone sees the actual distribution, and to let the gap between predicted and actual distribution be the datum the room discovers for itself. Call it the projection failure, and build the scoring so that it is visible on the board and not merely reported.

  Second: I'd like a causal handle, not just a correlation. My idea is to manufacture micro-cultures in the room: split the class by a genuinely random procedure, give each half a few minutes of different training in how to read a certain kind of case — I was thinking of instructing one half to read vignettes the way a lawyer reads a statute and the other the way a friend reads a text message — and then run the cases blind. If a habit acquired in five minutes shifts verdicts, the students can watch cultural transmission act on themselves instead of hearing about it in a stranger. Tell me honestly whether that device is a bad idea and why; if you keep it, tell me how long the training has to be, how to keep it from being transparent, and what it is a model of and what it merely looks like a model of.

  Cases: write your own, three or four, not the famous ones from the literature. I don't want the session to become a seminar on one well-known paper, and I don't want anyone guessing where this is going. They should be short enough to read twice, and they should be the sort of case where a "does she know" or "is he referring to" verdict plausibly moves with interpretive habit.

  What participants should come away seeing: that an intuition arrives wearing two credentials — it feels like a detection of how things are, and it feels like a verdict any careful person would share — and that cross-cultural variation strips the second credential while leaving the first untouched, which is why "the subjects must have misread the question" is not an answer to it.

  Also needed: a debrief mapping specific moments in the activity onto specific parts of the dispute, including the difference between verdicts varying and what that variation would warrant methodologically; an honest list of what will go wrong the first time, including what I should do if the room does not split, which with nineteen people it may well not; and a way of handling the student who says, correctly, that a roomful of undergraduates trained for five minutes tells us nothing about real cultural difference. Be frank about which feature of the real debate the activity cannot produce and that I will have to supply in my own voice.

  Skip the literature: no citations, no study names invoked as authorities, no numbers from published data. I have that material; what I need is the design.

  Give me the session plan first, then a single JSON object with this schema:

  - session_title: string
  - target_move: one sentence stating what participants discover for themselves, not what I tell them
  - timeline: array of objects with keys minutes, phase_name, what_participants_do, what_facilitator_does, discovery_baked_into_the_rules
  - scoring_scheme: object with keys first_order_measure, second_order_measure, how_the_gap_is_displayed, threshold_for_a_usable_split
  - failure_modes: array of objects with keys what_happens, why, handling
  - debrief_map: array of objects with keys moment_in_activity, what_participants_felt, maps_onto, facilitator_line
  - cannot_reproduce: array of objects with keys feature_of_the_debate, why_the_activity_cannot_generate_it, what_i_must_supply
  - safeguards: array of short strings on running this without making any student a representative of a culture
reasoning: |-
  We are designing a 75-minute session on cross-cultural variation in epistemic intuitions, with the following constraints and goals:

  1. Avoid slides of bar charts and methodological debates about survey quality.
  2. Do not put non-native English speakers or international students on display as cultural specimens.
  3. Focus on the "projection failure": the gap between participants' prediction of others' responses and the actual distribution.
  4. Introduce a causal element by creating "micro-cultures" in the room via random assignment and brief training in different interpretive habits.
  5. Use original, short vignettes that can be read twice and where the verdict (e.g., "does she know?") might shift with interpretive habits.
  6. Participants should see that intuitions feel objective and universally shared, but variation strips the second credential.
  7. Debrief to map activity moments to the philosophical dispute, including handling variation and what it warrants.
  8. Plan for failure modes (e.g., no split in responses) and the critique that the micro-culture exercise doesn't model real cultural differences.
  9. Skip literature citations and published data.

  **Session Plan:**

  **Total Time: 75 minutes**

  **Phase 1: Introduction and Setup (10 minutes)**
  - What participants do: Listen and get oriented.
  - What facilitator does: 
     - Introduce the session as an exploration of how we form judgments about knowledge in specific scenarios.
     - Explain that they will be reading short stories and answering questions about them. Emphasize that there are no right or wrong answers, and they should go with their initial intuition.
     - Describe the procedure: They will first make a prediction about how others will answer, then they will answer for themselves, and then we will see what happened.
     - Assign each student a random number (e.g., 1 or 2) by drawing from a hat. This splits the class into two groups (Group A and Group B) without any cultural or personal signaling.
  - Discovery baked in: None yet, just setup.

  **Phase 2: Training in Interpretive Habits (10 minutes)**
  - What participants do: 
     - Group A (e.g., number 1) is taken aside (or given instructions separately) and trained to read the vignettes "like a lawyer reading a statute": focus on the literal meaning, the exact words, and the logical implications. They are told to avoid inferring beyond what is explicitly stated.
     - Group B (number 2) is trained to read "like a friend reading a text message": focus on the context, the speaker's likely intentions, and what is implied but not stated. They are told it's okay to read between the lines.
     - Both groups get a practice vignette (unrelated to the test cases) to apply their training. They discuss briefly in their groups to ensure they understand the approach.
  - What facilitator does:
     - Deliver the training instructions clearly and concisely. 
     - For Group A: "When you read the scenarios, focus on the exact words. What do the words literally say? Do not add anything that isn't there. Be precise, like a lawyer interpreting a contract."
     - For Group B: "When you read the scenarios, think about the context and what the person might have meant. What is the likely intention? It's like when a friend texts you and you know what they mean even if they don't say it exactly."
     - Monitor the practice to ensure they are applying the method.
  - Discovery baked in: Participants experience being trained in a specific interpretive habit.

  **Phase 3: First-Order Intuitions and Predictions (15 minutes)**
  - What participants do:
     - Read the first test vignette (displayed on the board or read aloud). 
     - On an index card, they write:
          - Their prediction: What percentage of the class (excluding themselves) will answer "yes" to the knowledge question? (They write a number between 0% and 100%)
          - Their own verdict: "yes" or "no" to the knowledge question.
          - Their group (A or B) but not their name.
     - Repeat for 2-3 vignettes (each on a new card). Each vignette is presented one at a time, and cards are collected after each.
  - What facilitator does:
     - Present each vignette (read it aloud and/or write it on the board). 
     - Give them a minute to think and write their prediction and verdict for each.
     - Collect the cards after each vignette.
  - Discovery baked in: The prediction is recorded before seeing others' responses, setting up the projection.

  **Phase 4: Tallying and Revealing (15 minutes)**
  - What participants do: Watch as the facilitator tallies the results on the board for each vignette.
  - What facilitator does:
     - For each vignette, create a table on the board:
          - Actual distribution: Tally the "yes" and "no" votes for the whole class and for each group (A and B). Show the percentage of "yes" for the whole class and for each group.
          - Predicted distribution: Calculate the average predicted percentage (from the prediction cards) and display it.
     - Highlight the gap between the predicted percentage (what people thought others would say) and the actual percentage.
     - Also highlight the split between Group A and Group B (if any).
  - Discovery baked in: The gap between predicted and actual, and the effect of the training (if the groups differ) are visually displayed.

  **Phase 5: Group Discussion and Reflection (15 minutes)**
  - What participants do: 
     - Discuss in pairs or small groups: 
          - What surprised them about the results?
          - How did their training affect their reading?
          - Why might there be a gap between what they predicted and what actually happened?
     - Then, open discussion with the whole class.
  - What facilitator does:
     - Guide the discussion with questions: 
          - "Who was surprised by the actual distribution? Why?"
          - "Did anyone change their mind during the process? Why?"
          - "How did the training influence your judgment?"
          - "What does this tell us about why people might disagree about these cases?"
     - Steer away from methodological complaints (e.g., "the vignette was poorly written") by redirecting: "Even if the vignette could be clearer, why did the training make a difference?"
  - Discovery baked in: Participants articulate the surprise and the effect of the training.

  **Phase 6: Debrief and Philosophical Point (10 minutes)**
  - What participants do: Listen and connect the activity to the broader issue.
  - What facilitator does:
     - Summarize the key points:
          - The projection failure: We expect others to agree with us, but they often don't.
          - The training (a brief cultural intervention) shifted judgments, showing that interpretive habits can cause differences.
          - Philosophical damage: Our intuitions feel objective and universally shared, but when we see variation, we lose the universal credential. However, the intuition still feels like a direct detection of the truth (the first credential remains).
          - Address the critique: "A roomful of undergraduates trained for five minutes doesn't model deep cultural differences." Admit that this is a simplified model. The point is not to replicate real cultural differences but to show that interpretive habits can be acquired quickly and can cause differences in judgments. Real cultural differences might be more entrenched and complex, but the mechanism (interpretive habits) is similar.
     - Map specific moments to the dispute (see debrief_map below).
  - Discovery baked in: The facilitator ties together the discoveries.

  **Vignettes (3 original examples):**

  1. **The Lost Keys**
     - "Alex is looking for their keys. They remember putting them on the kitchen counter this morning. They go to the kitchen and see the keys on the counter. Does Alex know that the keys are on the counter?"

  2. **The Meeting Time**
     - "Sam gets an email from their boss that says, 'We'll meet at 3 PM.' Sam checks the email again and sees it clearly says 3 PM. But then Sam remembers that last week the boss sent an email with a typo about a meeting time. Does Sam know that the meeting is at 3 PM?"

  3. **The Gift**
     - "Taylor sees a wrapped box on the table with a note that says, 'For Taylor.' Taylor thinks, 'This must be a gift for me.' Does Taylor know that the box is a gift for them?"

  These vignettes are designed to be sensitive to interpretive habits:
  - Literal reading (Group A): Focus on the explicit facts (keys are seen, email says 3 PM, note says "For Taylor").
  - Contextual reading (Group B): Consider the context (memory might be faulty, boss has typos, maybe the note is for another Taylor).

  **Scoring Scheme:**
  - first_order_measure: The percentage of "yes" responses for each vignette (for the whole class and per group).
  - second_order_measure: The average predicted percentage of "yes" responses (from the prediction cards).
  - how_the_gap_is_displayed: On the whiteboard, for each vignette, write:
     - Actual: [X]% yes (Whole class), [A]% yes (Group A), [B]% yes (Group B)
     - Predicted (average): [Y]%
     - Gap: |X - Y| percentage points
  - threshold_for_a_usable_split: For the group split, we consider a difference of 20 percentage points or more between Group A and Group B as a usable split (given the small sample).

  **Failure Modes:**
  1. What happens: The room does not split (Group A and Group B have similar responses).
     - Why: The training might not have been effective, the vignettes might not be sensitive, or the sample is too small.
     - Handling: Focus on the projection gap (which should still be there). Say: "Even though the training didn't cause a split, notice that we still overestimated agreement. Why might that be?" Then discuss the projection failure.

  2. What happens: Students question the vignettes (e.g., "the question was ambiguous").
     - Why: Natural reaction to explain away disagreement.
     - Handling: Acknowledge that vignettes can be imperfect, but point out: "Even if the vignette could be improved, why did the training affect how you read it? And why did we all predict high agreement?" Redirect to the interpretive habit.

  3. What happens: The critique that the micro-culture doesn't model real culture.
     - Why: It's a valid point.
     - Handling: Admit the limitation. Say: "You're right, this is a quick simulation. But it shows how quickly habits can form and affect judgments. Real cultural differences might be deeper, but they also involve learned ways of interpreting the world."

  **Debrief Map:**
  1. Moment: Recording predictions before seeing results.
     - Participants felt: Confident that others would agree.
     - Maps onto: The tacit assumption of universal agreement in philosophical intuition.
     - Facilitator line: "Notice how sure we were that others would see it the same way. That's the projection we all start with."

  2. Moment: Seeing the actual distribution and the gap.
     - Participants felt: Surprised and maybe unsettled.
     - Maps onto: The discovery of cross-cultural variation (e.g., in the literature).
     - Facilitator line: "The gap shows we were wrong about the universal agreement. That's what happens when philosophers see data from other cultures."

  3. Moment: Comparing Group A and Group B results.
     - Participants felt: The training influenced their judgment.
     - Maps onto: Cultural differences as a causal factor in shaping intuitions.
     - Facilitator line: "We created a difference in just a few minutes. This models how cultural habits shape our epistemic intuitions."

  **Cannot Reproduce:**
  1. Feature: The depth and complexity of real cultural differences.
     - Why: The activity uses a 5-minute training; real cultures are deep and historically embedded.
     - What to supply: Explain that real cultural differences are more entrenched and involve many factors (language, tradition, etc.), but the mechanism (interpretive habits) is similar.

  2. Feature: The scale and robustness of the variation in real studies.
     - Why: We have a small, non-diverse sample (19 students).
     - What to supply: Mention that large-scale studies across many cultures show similar patterns of variation, but avoid citing specific studies.

  **Safeguards:**
  - "Random assignment to groups to avoid stereotyping."
  - "No student is asked to represent their culture."
  - "Groups are labeled A and B, not by cultural terms."
  - "Focus on the training as the cause, not personal identity."
  - "Avoid any question that asks about 'back home' or personal background."

