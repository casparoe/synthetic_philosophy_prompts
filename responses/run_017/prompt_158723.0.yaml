answer: |-
  ### Session Plan: "Intuition, Expectation, and the Gap"

  **Session Title:** "When Certainty Surprises Us"

  **Target Move:** Participants discover that their confident expectation of near-universal agreement on epistemic judgments is systematically miscalibrated, and that minor differences in interpretive framing can causally shift verdicts.

  ---

  ### Timeline (Total: 75 min)

  | Minutes | Phase Name                   | What Participants Do                                                                 | What Facilitator Does                                                                                                                                 | Discovery Baked into Rules                                                                                                |
  |---------|------------------------------|--------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------|
  | 5       | **Framing & Setup**          | Receive index cards; hear session goals.                                             | Explain: "Today, we map how we judge knowledge claims. You’ll answer questions, predict others, and see how it lands." Randomly shuffle/distribute cards assigning Group 🟦 or 🟨. | Groups assigned randomly (no cultural signaling); neutrality emphasized.                                                   |
  | 10      | **Micro-Culture Training**   | Split into 🟦/🟨 groups. Receive 5-min "frame training" via written instructions. | Hand out training sheets: 🟦 gets "Statute Reading Rules," 🟨 gets "Text Message Rules." Monitor time; no inter-group discussion.                     | Participants embody distinct interpretive habits without knowing the other group’s training.                               |
  | 15      | **Vignette Judgment & Prediction** | Read 3 vignettes. For each: <br>1. Predict % of class agreeing with their verdict.<br>2. Give own verdict (✔️/✖️).<br>3. Submit card anonymously. | Read vignettes aloud + write on board. Emphasize: "Answer intuitively. No debate." Collect cards after each vignette.                                  | Predictions locked in before seeing any results; cards track group (🟦/🟨) but no names.                                |
  | 15      | **Live Tally & Gap Reveal**  | Watch as facilitator tallies results per vignette.                                   | For each vignette:<br>- Calculate ACTUAL % agreement.<br>- Calculate AVERAGE PREDICTED %.<br>- Plot both on board with bars.<br>- Separate 🟦 vs 🟨 results if split emerges. | Visual gap between prediction (blue bar) and reality (red bar); group differences highlighted if present.               |
  | 20      | **Guided Reflection**        | Discuss in pairs: "Why the gap?" and "How did your training affect you?"             | Pose Qs: "Who was surprised? Why?" "Did anyone feel their training ‘pushed’ their answer?" Redirect "misread" claims to interpretive habits.          | Reflection on projection failure and causal mechanism (training → verdict shift).                                        |
  | 10      | **Debrief & Bridge**         | Listen; connect activity to philosophy.                                              | Map activity to epistemology: intuition’s "dual credentials," why variation undermines universality but not felt objectivity. Address limitations.    | Explicit link: "What you felt—surprise at disagreement—is the core philosophical problem."                             |

  ---

  ### Scoring Scheme
  ```json
  {
    "first_order_measure": "Percentage of 'yes' (✔️) verdicts per vignette (whole class and per group)",
    "second_order_measure": "Average predicted percentage of agreement with own verdict (across all predictions)",
    "how_the_gap_is_displayed": "Side-by-side bar graphs on whiteboard: blue bar (avg. predicted agreement) vs. red bar (actual agreement). Gap = |blue - red|.",
    "threshold_for_a_usable_split": "≥15% difference in ✔️ rates between 🟦 and 🟨 groups (given n=19, even 8-11 split = 42% vs 58%)"
  }
  ```

  ---

  ### Failure Modes & Handling

  | What Happens                     | Why                                                                 | Handling                                                                                                                               |
  |----------------------------------|---------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------|
  | No group split (🟦 ≈ 🟨)     | Small sample size; vignettes not sensitive to training.             | **Pivot:** Focus on prediction-actual gap (always present). Say: "Even without group differences, we all overestimated agreement. Why?" |
  | "The vignette was ambiguous!"    | Defense mechanism against surprise; entrenches "misread" objection. | **Redirect:** "Ambiguity is the point. Why did your training resolve it *this* way? What does that say about intuition?"               |
  | Student rejects micro-cultures | Correct: 5-min training ≠ deep culture.                             | **Acknowledge:** "This models *how* habits shift judgments, not *real cultures*. Real differences use similar mechanisms but deeper."  |
  | Dominant verdict (>90%)         | Reduces visible variation.                                          | **Use:** Highlight prediction gap: "You expected 95%? Actual was 100%? Why did we expect dissent when none existed?"                   |

  ---

  ### Debrief Map

  | Moment in Activity           | What Participants Felt                    | Maps Onto                                  | Facilitator Line                                                                                                    |
  |------------------------------|-------------------------------------------|--------------------------------------------|---------------------------------------------------------------------------------------------------------------------|
  | Predicting agreement         | Confidence: "Others *must* see it my way." | Tacit universalism in epistemology         | "Your prediction assumed disagreement = error. That’s the default license philosophers use."                       |
  | Seeing gap (blue vs. red bar)| Shock: "How could they *not* agree?"      | Second-order surprise in X-phi findings    | "This gap—not the split itself—is what challenges philosophy. Why were we so sure?"                                |
  | Seeing group split (if any)  | "My training *made* me answer that way."  | Cultural transmission as causal mechanism  | "You felt habit steer your intuition. Real cultural differences work like this—but slower and invisible."           |
  | Defending verdict            | "The vignette is flawed!"                 | Methodological dismissals in literature    | "Saying ‘they misread’ preserves your intuition’s universality. But you didn’t misread—you interpreted differently." |

  ---

  ### Cannot Reproduce & Facilitator Role

  | Feature of the Debate              | Why Activity Can’t Generate It              | What You Must Supply                                                                 |
  |------------------------------------|---------------------------------------------|--------------------------------------------------------------------------------------|
  | **Scale of real variation**        | N=19 undergraduates; artificial training.   | "Real studies show splits across 1000s of people with lifelong cultural exposure."   |
  | **Depth of cultural influence**    | 5-min training ≠ enculturation.             | "Real differences embed in language, education, social practice—but the *mechanism* is similar." |
  | **Normative implications**         | Activity is descriptive, not prescriptive.  | "Philosophers must now ask: If intuitions vary, can we treat them as objective anchors?" |

  ---

  ### Safeguards Against Cultural Tokenism
  1. **Random group assignment** (🟦/🟨)—no geographic/cultural labels.
  2. **No "speak for your culture" questions**—focus on training, not identity.
  3. **Anonymous submissions**—individual judgments not displayed.
  4. **Vignette design**—avoids culturally loaded scenarios (e.g., no "American" contexts).
  5. **Debrief framing**—"We modeled *how habits form*, not *real cultures*."

  ---

  ### Vignettes (Designed for Sensitivity to Interpretation)
  1. **The Assistant’s Email**  
     *"Jordan emails Taylor: ‘Your draft is in the shared folder.’ Taylor opens the folder, sees a file called ‘Draft_Final.docx,’ and thinks, ‘My draft is here.’ Does Taylor **know** the draft is in the folder?"*  
     - 🟦 (Statute): Focus on explicit claim ("draft is in folder") vs. ambiguous file name.  
     - 🟨 (Text): Infer Jordan’s intent; "Final" suggests it’s the right file.  

  2. **The Museum Label**  
     *"Sam sees a museum label: ‘This vase is 3,000 years old.’ Sam knows labels here are reliable, but also that a recent scandal revealed 1% are misdated. Does Sam **know** the vase is ancient?"*  
     - 🟦 (Statute): 1% error = reasonable doubt.  
     - 🟨 (Text): Trust context; "scandal" resolved, labels trusted.  

  3. **The Parking Spot**  
     *"Alex sees an open parking spot with a faded sign. Yesterday, it said ‘Reserved.’ Today, Alex thinks the sign was removed. Alex parks. Did Alex **know** the spot was available?"*  
     - 🟦 (Statute): No explicit evidence sign was removed.  
     - 🟨 (Text): Faded sign + context implies change.  

  ---

  ### Why This Works
  - **Projection Failure Front-and-Center**: The blue/red bar gap is visceral and unavoidable.  
  - **Causal Mechanism Personal**: Students *feel* their training sway them—no need for "exotic" examples.  
  - **No Literature, No Distraction**: Pure discovery of the gap + micro-variation.  
  - **Safety**: Random groups, anonymous data, and vignettes avoid cultural essentialism.  

  **First Run Tip:** If no group split occurs, leverage Vignette #2 (Museum Label)—it’s most likely to diverge. Stress: "The gap matters more than the split."
