      - Now knows Bob is Flexible.  
      - \(P(\text{Bob works}) = P(P_B(E) \geq 0.5 \mid \text{Flexible})\). Bob’s report is 0.2, and he updates based on her actions, but she’s Steadfast and works → Bob sees her work, so \(P_B(E) = 0.2 \times 1 = 0.2\) (unchanged). Thus, Bob doesn’t work.  
