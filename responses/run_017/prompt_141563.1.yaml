  ### 1. Scenario  
  Alice and Bob co-manage a critical project that succeeds only if both work diligently. Each believes the other might slacken if pessimistic, so they privately assess the project's success probability (which depends on their mutual effort). After exchanging posteriors honestly and updating rigorously, they remain stuck at 0.6 and 0.3. Alice stays confident because she interprets Bob's pessimism as a sign he might quit, justifying her high estimate. Bob remains pessimistic because Alice’s confidence seems unwarranted without his full effort, reinforcing his low estimate. The disagreement persists because the project’s success *depends* on their beliefs, creating a self-confirming deadlock.

  ### 2. Miniature Model  
  - **State space**: Project quality \(Q \in \{ \text{Good}, \text{Bad} \}\) and a binary "effort threshold" signal \(S_A, S_B \in \{ \text{High}, \text{Low} \}\) for each agent.  
  - **Common prior**: \(P(Q = \text{Good}) = 0.5\). Signals are independent given \(Q\):  
    - \(P(S_i = \text{High} \mid \text{Good}) = 0.8\), \(P(S_i = \text{Low} \mid \text{Good}) = 0.2\)  
    - \(P(S_i = \text{High} \mid \text{Bad}) = 0.2\), \(P(S_i = \text{Low} \mid \text{Bad}) = 0.8\)  
  - **Performative event \(E\)**: "Project succeeds" iff:  
    - Both agents *work hard* (agent \(i\) works hard iff their posterior \(P(E) \geq 0.5\)),  
    - And \(Q = \text{Good}\).  
  - **Why common prior?** Both know the joint distribution of \((Q, S_A, S_B)\) and agree on how \(E\) depends on beliefs/actions.  

  ### 3. One Round of Exchange (Worked Example)  
  **Initial setup**: Alice observes \(S_A = \text{High}\), Bob observes \(S_B = \text{Low}\).  
  - **Alice’s first posterior (\(P_A(E)\))**:  
    - Infers \(P(Q=\text{Good} \mid S_A=\text{High}) = \frac{0.8 \times 0.5}{0.8 \times 0.5 + 0.2 \times 0.5} = 0.8\).  
    - To compute \(P(E)\), she assumes Bob works hard iff his posterior \(\geq 0.5\). Given her signal, she estimates \(P(\text{Bob works} \mid S_A=\text{High})\):  
      - Bob’s signal is unknown, so she averages:  
        \(P(\text{Bob works}) = P(S_B=\text{High} \mid S_A=\text{High}) \cdot \mathbb{I}(\text{his posterior} \geq 0.5) + P(S_B=\text{Low} \mid S_A=\text{High}) \cdot 0\)  
      - By independence, \(P(S_B=\text{High} \mid S_A=\text{High}) = P(S_B=\text{High}) = 0.5\) (marginal).  
      - If Bob gets High, his posterior for \(Q=\text{Good}\) is 0.8, so he works (since \(E\) requires \(Q=\text{Good}\) and mutual effort).  
      - If Bob gets Low, his posterior is 0.2, so he doesn’t work.  
      - Thus, \(P(\text{Bob works} \mid S_A=\text{High}) = P(S_B=\text{High}) = 0.5\).  
    - Alice works hard (as \(0.8 \times 0.5 = 0.4 < 0.5\)? No: she works iff \(P_A(E) \geq 0.5\), but \(P_A(E) = P(Q=\text{Good} \mid S_A) \times P(\text{Bob works} \mid S_A) = 0.8 \times 0.5 = 0.4\). Since \(0.4 < 0.5\), she *would not work* by her own rule. **Inconsistency!**  

  **Revised model (to ensure consistency)**:  
  - **Adjusted event \(E\)**: "Project succeeds" iff:  
    - \(Q = \text{Good}\),  
    - And both agents have posteriors \(P_i(E) \geq 0.5\) *at the time of action*.  
  - **Fixed-point belief**: In state \(Q\), \(E\) occurs iff both agents’ signals induce \(P_i(E) \geq 0.5\).  
    - In Good: Only possible if both get High (since \(P_i(E \mid \text{Low}) = 0.2 < 0.5\)).  
    - In Bad: \(E\) never occurs (even if both get High, \(P_i(E) = 0.8\), but \(Q=\text{Bad}\) prevents success).  
  - **Common prior for \(E\)**: \(P(E) = P(\text{Good}) \cdot P(\text{both High} \mid \text{Good}) = 0.5 \times (0.8 \times 0.8) = 0.32\).  

  **Round 1 (signals: Alice High, Bob Low)**:  
  - **Alice’s posterior (\(P_A(E)\))**:  
    - \(P_A(E) = P(\text{Good} \mid \text{High}) \cdot P(\text{Bob gets High} \mid \text{Good}) = 0.8 \times 0.8 = 0.64\) (she assumes Bob works only if High).  
  - **Bob’s posterior (\(P_B(E)\))**:  
    - \(P_B(E) = P(\text{Good} \mid \text{Low}) \cdot P(\text{Alice gets High} \mid \text{Good}) = 0.2 \times 0.8 = 0.16\).  
  - **Exchange**: Alice reports 0.64, Bob reports 0.16.  
  - **Why no convergence?**  
    - Alice sees Bob’s 0.16: Infers Bob has Low signal (since \(P_B(E)=0.16\) only if \(S_B=\text{Low}\)).  
    - Bob sees Alice’s 0.64: Infers Alice has High signal.  
    - Both now know signals: \(S_A=\text{High}, S_B=\text{Low}\).  
    - Update: \(P(\text{Good} \mid \text{High}, \text{Low}) = 0.5\) (balanced evidence).  
    - But \(P(E \mid \text{High}, \text{Low}) = P(\text{Good} \mid \text{High}, \text{Low}) \cdot P(\text{both High} \mid \text{Good})\) is irrelevant now—they know both aren’t High, so \(E\) is impossible. Both set posterior to 0.  
    - **Problem**: They agree after one exchange.  

  **Key adjustment for disagreement**: Make the event \(E\) depend on *future* beliefs after exchanges.  
  - **New performative \(E\)**: "Project succeeds iff, after all belief exchanges, both agents’ *final* posteriors \(P_i(E) \geq 0.5\)".  
  - **Fixed point in beliefs**: A pair \((p_A, p_B)\) is stable if:  
    - \(p_A = P(E \mid S_A, p_B)\),  
    - \(p_B = P(E \mid S_B, p_A)\),  
    - Where \(P(E) = 1\) only if both \(p_A \geq 0.5\) and \(p_B \geq 0.5\) (and 0 otherwise).  
  - **Prior**: \(P(\text{Good}) = 0.5\), but \(P(E)\) is defined by the fixed point.  

  **Worked round (Alice High, Bob Low)**:  
  - Assume a fixed point where Alice is optimistic (\(p_A \geq 0.5\)) and Bob is pessimistic (\(p_B < 0.5\)).  
  - **Alice’s view**: She believes \(E\) occurs only if Bob ends with \(p_B \geq 0.5\). But she knows \(S_A=\text{High}\), and if Bob were to have \(p_B \geq 0.5\), she’d compute:  
    \(P_A(E) = P(\text{Good} \mid \text{High}) \approx 0.8\) (high).  
  - **Bob’s view**: He believes \(E\) requires his own \(p_B \geq 0.5\), but he has \(S_B=\text{Low}\), so \(P(\text{Good} \mid \text{Low}) = 0.2\). If he assumes Alice has \(p_A \geq 0.5\), then \(P_B(E) = 0.2 \times 1 = 0.2\) (low, since \(E\) fails if he’s pessimistic).  
  - **After exchange**: Alice reports 0.8, Bob reports 0.2.  
    - Alice sees 0.2: Updates to \(P_A(E) = P(\text{Good} \mid \text{High}) \cdot P(\text{Bob ends} \geq 0.5)\). But Bob’s report confirms he’s locked at 0.2, so \(P(\text{Bob ends} \geq 0.5) \approx 0\) → Alice’s posterior drops to 0.  
    - Bob sees 0.8: Already assumes Alice is optimistic, but his posterior remains 0.2 (as 0.2 < 0.5 dooms \(E\)).  
  - **Stuck?** Alice drops to 0, Bob stays at 0.2—still disagree.  
    - **Flaw**: Alice drops to 0, but Bob might update further.  

  **Final model for disagreement**: Introduce a "commitment" parameter.  
  - **State space**: \(Q \in \{\text{Good}, \text{Bad}\}\), and a binary trait \(C_i \in \{\text{Steadfast}, \text{Flexible}\}\) for each agent (unknown to both, with prior \(P(C_i = \text{Steadfast}) = 0.5\)).  
  - **Event \(E\)**: "Succeeds iff \(Q = \text{Good}\) and both work hard. Agent \(i\) works hard iff \(P_i(E) \geq 0.5\) *or* \(C_i = \text{Steadfast}\)."  
  - **Signals**: Alice observes \(S_A = \text{High}\) (updates \(P(\text{Good}) = 0.8\)), Bob observes \(S_B = \text{Low}\) (updates \(P(\text{Good}) = 0.2\)). Neither observes \(C_A\) or \(C_B\).  

  **Round 1 posteriors**:  
  - **Alice’s \(P_A(E)\)**: Computes \(P(E \mid S_A) = P(\text{Good} \mid \text{High}) \cdot P(\text{Bob works})\).  
    - Bob works if \(P_B(E) \geq 0.5\) or \(C_B = \text{Steadfast}\).  
    - She estimates \(P(\text{Bob works}) \approx P(C_B = \text{Steadfast}) + P(C_B = \text{Flexible}) \cdot P(P_B(E) \geq 0.5 \mid \text{Flexible})\).  
    - Initially, assumes \(P_B(E)\) is Bob’s signal-based estimate (0.2), so if Bob is Flexible, he doesn’t work.  
    - Thus, \(P(\text{Bob works}) = 0.5\) (if Steadfast) + \(0.5 \times 0 = 0.5\).  
    - \(P_A(E) = 0.8 \times 0.5 = 0.4\). But she needs \(P_A(E) \geq 0.5\) to work if Flexible—so she doesn’t work if Flexible.  
    - **Alice’s report**: She averages over her own type:  
      - If Steadfast, she works, \(P_A(E) = 0.8 \times P(\text{Bob works}) = 0.8 \times 0.5 = 0.4\)? No.  
      - Better: \(P_A(E)\) is her expectation of success. She works if Steadfast (always) or if Flexible and \(P_A(E) \geq 0.5\). But her \(P_A(E)\) depends on whether she works.  
    - **Abort**: This overcomplicates.  

  ### Deliverable 3 (Simplified Working)  
  **Scenario with types**:  
  - Alice is **Steadfast** (works hard if \(P(\text{Good}) \geq 0.4\), ignoring \(E\)’s performativity).  
  - Bob is **Flexible** (works hard only if \(P_B(E) \geq 0.5\)).  
  - Both know their own type but not the other’s. Common prior \(P(\text{Good}) = 0.5\).  
  - **Signals**: Alice gets High (\(P(\text{Good}) = 0.8\)), Bob gets Low (\(P(\text{Good}) = 0.2\)).  
  - **Event \(E\)**: Succeeds iff both work hard and \(Q = \text{Good}\).  

  **Round 1 posteriors**:  
  - **Alice’s \(P_A(E)\)**:  
    - She works (Steadfast, as \(0.8 \geq 0.4\)).  
    - \(P_A(E) = P(\text{Good} \mid \text{High}) \cdot P(\text{Bob works})\).  
    - She doesn’t know Bob’s type. If Bob is Steadfast, he works if \(P(\text{Good}) \geq 0.4\) (his signal gives 0.2, so he doesn’t work). If Bob is Flexible, he works only if \(P_B(E) \geq 0.5\).  
    - She estimates \(P(\text{Bob works}) = P(\text{Bob Flexible}) \cdot P(P_B(E) \geq 0.5 \mid \text{Flexible}) + P(\text{Bob Steadfast}) \cdot 0\).  
    - Initially, she assumes \(P_B(E)\) is based on Bob’s signal (0.2) → he doesn’t work if Flexible. Thus, \(P(\text{Bob works}) = 0\).  
    - So \(P_A(E) = 0.8 \times 0 = 0\).  
  - **Bob’s \(P_B(E)\) (Flexible)**:  
    - He works only if \(P_B(E) \geq 0.5\).  
    - \(P_B(E) = P(\text{Good} \mid \text{Low}) \cdot P(\text{Alice works})\).  
    - Doesn’t know Alice’s type. If Steadfast, she works if \(P(\text{Good}) \geq 0.4\) (0.8, so yes). If Flexible, she works only if \(P_A(E) \geq 0.5\).  
    - Estimates \(P(\text{Alice works}) = P(\text{Alice Steadfast}) \cdot 1 + P(\text{Alice Flexible}) \cdot P(P_A(E) \geq 0.5 \mid \text{Flexible})\).  
    - Initially, assumes \(P_A(E)\) is Alice’s signal-based estimate (0.8) → if Flexible, she works. Thus, \(P(\text{Alice works}) = 0.5 \times 1 + 0.5 \times 1 = 1\).  
    - So \(P_B(E) = 0.2 \times 1 = 0.2\).  
  - **Exchange**: Alice reports 0, Bob reports 0.2.  
  - **Update**:  
