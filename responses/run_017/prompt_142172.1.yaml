prompt: |-
  I do moderation (volunteer, unpaid, and yes I know how that sounds) on a long-running sandbox survival server — Minecraft-ish, except the world's been up for eleven years, the nightly snapshot only goes back thirty days so anything we miss is gone for good, and there's a house rule that a structure "belongs" to whoever built it for as long as someone in their group is still active. We're trying to write an actual policy document and I've realised I have very firm gut verdicts that don't obviously fit together. I want to know whether one principle is behind them or whether I have to give some up.

  1. Someone spends maybe 300 hours on a cathedral; another player burns it down with an in-game mechanic the rules explicitly allow. Verdict: real harm, we roll back and we ban.
  2. Same cathedral, wiped by a bad plugin update, no person did it. Verdict: nobody harmed anyone, and yet I want us to spend exactly the same effort restoring it. So the wrongness disappears but the badness doesn't?
  3. A player quits in 2014, never comes back, his enormous castle is still standing, nobody visits it. A new player knocks it flat. Verdict: feel bad about it, I'd stop them — even though the builder will never know and no current player cares. What's even being damaged there?
  4. Client-side defacement: someone runs a mod so that on their own screen the cathedral renders as rubble. Nobody else sees it, the save is untouched, they can toggle it. Verdict: not a harm at all, don't care, kind of funny. But if that's right then what I was protecting in (3) can't be "people's experience of the cathedral."
  5. Duping: someone uses a bug to copy a rare item instead of taking it. Nobody is deprived of anything, the economy shifts a bit. Verdict: genuinely wrong, but I can't say who is harmed.
  6. Someone griefs a character that turns out to be an automated one — no human behind it, indistinguishable in chat. Verdict: nothing happened. Same behaviour, no harm. Which suggests the harm is always to a person, never to the thing.
  7. Spawn-camping a real player for an hour so they effectively can't play. Verdict: real harm, and honestly worse than (1) — which is weird, because in (1) something that took 300 hours ceased to exist and here nothing in the world changed.
  8. Three players stand very close to someone's avatar in VR, silently, no chat, no touching, no damage, for twenty minutes. Verdict: definitely a harm, and it's worse in VR than the identical thing on a flatscreen, and I don't think that's just about intensity.
  9. Scamming someone out of an item that's on the official real-money marketplace (so it has an actual cash price) vs. scamming them out of an equally rare, equally hard-won item that can't legally be sold. Verdict: same harm. Which probly kills any purely economic account.

  My own attempt: "a virtual thing is real in the way that matters iff it's the kind of thing other agents can orient their behaviour and expectations around, and it was made by someone who meant it to persist." That gets (4) and maybe (6) right, but I think it makes (2) look fine and (1) look like nothing, and it says nothing about (8).

  Is there a principle that does better — ideally one that also gives verdicts on two cases we haven't had yet: a player who "claims" a naturally generated cave formation someone else then destroys, and an AI-run character that's been around for years and that current players genuinely care about, which we're about to delete in a cleanup.
reasoning: |-
  Okay, the user is a volunteer moderator on a long-running Minecraft-style sandbox survival server. They're trying to formalize their moderation policies but are struggling to reconcile their intuitive judgments across different scenarios. Let me unpack their cases and see what underlying principles might connect them.

  First, looking at their examples: In case 1, intentional destruction of a player-built cathedral leads to a rollback and ban. Case 2 shows the same destruction by a plugin error isn't "wrong" but still demands restoration effort. This suggests the harm isn't just about intent—the cathedral's value persists regardless of cause. 

  Case 3 is interesting: protecting an abandoned castle no one uses. The builder is long gone, yet the moderator feels it shouldn't be destroyed. This hints at valuing the creation itself as part of the server's history. Case 4 (client-side defacement) feels harmless because it doesn't alter shared reality—reinforcing that the value lies in communal persistence.

  Case 5 (duping) puzzles them—no direct victim, but it feels wrong. This might relate to undermining systemic trust in the game's economy. Case 6 (griefing an NPC) highlights that harm requires a human victim, except... case 7 (spawn-camping) shows blocking gameplay harms the player directly, worse than destroying objects. 

  Then case 8 (VR crowding)—no physical interaction but deeply violating. The embodied aspect intensifies harm beyond screen play. Case 9 shows scamming harm is identical regardless of real-money value, rejecting pure economic metrics. 

  Their proposed principle focuses on shared persistence and intentional creation. It works for cases 4 and 6 but fails case 2 (where persistence is broken accidentally yet restoration matters) and ignores embodied harm in VR. 

  What's the common thread? It seems to be about respecting *labor*, *agency*, and *shared context*. Player creations represent invested effort and become communal landmarks. Intentional destruction attacks others' agency to enjoy them—hence banning. Accidental loss (case 2) still damages the shared world, demanding restoration. Abandoned structures (case 3) preserve history, anchoring the server's continuity. 

  Harm scales with *violation of trust*: duping erodes fair play; VR crowding weaponizes intimacy; spawn-camping denies agency entirely. Scamming (case 9) is about betrayal, not monetary loss. 

  For their unresolved cases: A natural cave likely wouldn't warrant protection unless players had collectively designated it significant—it lacks intentional creation. The beloved AI character? If players have formed attachments, it functions as a social entity. Deleting it would rupture shared context, warranting preservation. 

  So a unified principle might be: **Harm occurs when acts disregard others' agency, labor, or the communal fabric—measured by impact on trust, attachment, or shared experience.** This covers object destruction (violating labor/continuity), scams/duping (eroding trust), and harassment (denying agency). It also explains VR's heightened harm (embodied presence deepens intrusion) and why restorations matter regardless of intent. 

  Final thought: Their instincts reveal deep care for the server as a persistent social artifact. The policy should formalize that ethos—protecting not just players, but the world they co-create.
answer: |-
  Your instincts point to a **Labor-Embedded Social Reality (LESR) principle**: virtual entities matter when they embody invested labor *and* function as shared social anchors. Harm occurs when acts disregard labor or rupture the communal fabric of trust, attachment, or agency. Here's how it resolves your cases:

  1.  **Cathedral Burned (Intentional):**  
      *Harm:* Disregard of labor (300hrs) + destruction of a social anchor.  
      *Action:* Rollback + ban preserves trust in labor's value.

  2.  **Cathedral Wiped (Accidental):**  
      *Harm:* Loss of labor-anchored social object. No *wrongdoing*, but the *badness* is the erosion of communal history.  
      *Action:* Restoration honors labor & server continuity.

  3.  **Abandoned Castle Destroyed:**  
      *Harm:* Labor is permanent—it shaped the world. Destroying it severs historical continuity (a shared social anchor).  
      *Action:* Preservation respects past labor sustaining the server's identity.

  4.  **Client-Side Defacement:**  
      *Harm:* None. No labor destroyed, no social anchor altered. Pure subjective experience.  
      *Action:* No intervention needed.

  5.  **Duping:**  
      *Harm:* Undermines communal trust in fairness & effort. Labor devaluation (even without scarcity).  
      *Action:* Sanction to protect systemic integrity.

  6.  **Griefing Bot:**  
      *Harm:* None if no human attachment. Mistaken intent ≠ harm.  
      *Action:* No penalty (but clarify bot-status).

  7.  **Spawn-Camping:**  
      *Harm:* Direct assault on *agency*—denial of play. More urgent than object loss as it targets a person.  
      *Action:* Ban for violating player sovereignty.

  8.  **VR Crowding:**  
      *Harm:* Exploits embodied presence to create psychological violation. Social anchoring of *personal space* is disrupted.  
      *Action:* Sanction—intensity matters because VR deepens social/embodied immersion.

  9.  **Scamming Rare Item:**  
      *Harm:* Betrayal of trust & effort—not monetary value. Labor (earning the item) is disrespected equally.  
      *Action:* Same penalty regardless of marketability.

  ### LESR Principle Defined:
  > **A virtual entity warrants protection if it (a) embodies significant invested labor, or (b) functions as a recognized social anchor. Harm arises from acts that:  
  > - Destroy labor-embedded objects without consent,  
  > - Violate agency or trust,  
  > - Sever communal attachments,  
  > - Exploit shared context (e.g., VR immersion).**

  ### Unresolved Cases Solved:
  - **Natural Cave "Claimed" & Destroyed:**  
    *No inherent protection.* Labor wasn’t invested. If players collectively treat it as a landmark (social anchor), it gains protected status. Else, it’s terrain.  
  - **Beloved AI Character Deleted:**  
    *Harm occurs.* If players formed attachments, it became a *social anchor*. Deletion severs communal bonds. Preservation honors player investment, even without labor.

  ### Why This Works:
  - **Labor** (cases 1,2,3,5,9) creates persistent value.  
  - **Social Anchoring** (cases 3,6,8,9) protects communal meaning.  
  - **Agency & Trust** (cases 5,7,8,9) are core to multiplayer ethics.  
  - **Embodiment** (case 8) intensifies harm by deepening social reality.  

  This framework aligns with your verdicts, resolves contradictions, and adapts to edge cases by prioritizing *labor*, *community*, and *player sovereignty* over rigid property rules.
