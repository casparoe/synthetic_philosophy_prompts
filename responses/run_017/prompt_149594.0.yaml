prompt: |-
  hey — act as an epistemologist who also knows something about how software actually gets built, and think it through properly: brainstorm two or three candidate principles before you settle on one. I want a real answer, not a menu.

  I'm a backend engineer, about ten years in, model assistance in the editor every day, and I'm trying to figure out when leaning on it costs me understanding. Here are my gut verdicts:

  1. Regexes, sed one-liners, the exact flag order for some aws command — let it write those. Fine, no loss; I never really "understood" them anyway.
  2. It writes a feature from a spec I wrote, I read the whole diff and test it. Fine.
  3. Same feature, but I only test the behavior and skim the diff. Not fine — feels like something's leaking away, even though the code that ships is identical to case 2.
  4. It explains a stack trace, or walks me through a new framework while I interrupt with dumb questions. Fine — I come out ahead of reading the docs.
  5. I ask it for an architecture for a service I'll own for years, can't find a hole in the plan, and accept it. Not fine, and worse than 3, even though in 3 I also can't fully produce the rationale.
  6a. It writes Rust for me; I don't know Rust; I accept code I couldn't have written and can't fully explain. Gut: basically fine, borrowed competence.
  6b. I open my own code from eight months ago, don't understand it, have the model explain my own code to me and then patch it. Gut: not fine, feels like rot. But 6a and 6b look structurally identical to me — in both I end up with working code whose rationale I can't state — so I think one of those verdicts is wrong and I want you to say which.
  7. Throwaway migration script, deleted after running: obviously fine. Same script, except someone drops it in a cron job and it becomes load-bearing without anybody reading it: not fine, and I feel it's partly my fault even though I didn't choose that.
  8. I let it write something, close the tab, and reimplement the idea from scratch my own way. Fine — fine even when my version is worse than what it gave me.

  The principle I keep coming back to: outsourcing is corrosive when it lowers my ability to handle the *next* problem in that area, and fine when it doesn't. But 6a breaks it (I never learn the borrow checker, so my next-problem ability in Rust stays at zero, and I'm fine with that), and it doesn't explain why 5 feels worse than 3. I've also started calling one failure mode "shadow comprehension": I can predict what the code does in situations I've already seen and gesture at why, but I can't write it myself or make the same call in a new situation — use that if it's useful, or tell me it's a bad category.

  So: repair my principle or replace it. Give me one that fits what it can fit, states plainly which of my verdicts it throws out and why, and hands down verdicts on cases I haven't listed — at minimum, pair-programming with a junior who is also using the model the whole time, and getting paged at 3am for a service the model largely wrote.

  Be committal: pick the principle you actually think is right, give your reasons, and say roughly how confident you'd be in each clause and where you'd expect a professional epistemologist to push back hardest.
reasoning: |-
  We are given a backend engineer's gut verdicts on various scenarios of using AI assistance in coding, and the task is to repair or replace the principle they've been considering. The principle they propose is: "outsourcing is corrosive when it lowers my ability to handle the *next* problem in that area, and fine when it doesn't." However, they note that this principle breaks in case 6a (using AI to write Rust without learning Rust) and doesn't explain why case 5 (accepting an architecture without understanding) feels worse than case 3 (accepting a feature implementation with only testing and skimming).

  We are to brainstorm two or three candidate principles and then settle on one. The chosen principle should:
  - Fit the cases it can fit.
  - State plainly which verdicts it throws out and why.
  - Hand down verdicts on at least two additional cases: pair-programming with a junior (who also uses the model) and being paged at 3am for a service the model largely wrote.

  We must be committal, give reasons, and note confidence levels and potential epistemological pushbacks.

  Let's break down the cases:

  1. Regex, sed, AWS flags: Fine. (No loss of understanding because these are often memorized and not deeply conceptual.)
  2. Feature from spec, read whole diff and test: Fine.
  3. Same feature, only test behavior and skim diff: Not fine. (Feels like something is leaking away.)
  4. Explains stack trace or new framework: Fine. (Better than reading docs.)
  5. Accepting an architecture for a long-term service without finding a hole: Not fine, worse than 3.
  6a. Write Rust without knowing Rust: Fine (borrowed competence).
  6b. Explain own old code and patch it without understanding: Not fine (feels like rot). But 6a and 6b seem structurally identical (both end with working code without full rationale). The engineer thinks one verdict is wrong.
  7. Throwaway script: Fine. Same script becomes load-bearing without reading: Not fine.
  8. Reimplement from scratch after seeing AI's solution: Fine.

  The engineer's principle focuses on the effect on future problem-solving ability. However, 6a breaks it because the engineer doesn't intend to learn Rust (so next-problem ability remains zero, but they are fine with that). Also, it doesn't explain why 5 feels worse than 3.

  We need a principle that can explain the difference between 3 and 5, and resolve the contradiction between 6a and 6b.

  Brainstorming candidate principles:

  Candidate 1: The principle of "responsibility and ownership".
  - If you are responsible for the long-term maintenance and evolution of the code/system, then you must have a deep understanding of it. Otherwise, it's acceptable to rely on AI without deep understanding.
  - Why? Because in cases of ownership, you are the one who will have to fix, extend, and debug. Without deep understanding, you cannot do so effectively. This principle would explain:
    - Case 5 (architecture for a service you own for years) is not fine because you are responsible for it and must understand it deeply to maintain and evolve it.
    - Case 3 (feature implementation) is less severe than 5 because the feature is a smaller unit, but still not fine because you are responsible for that code. However, the engineer feels case 3 is not fine too, so this matches.
    - Case 6a: If you are not responsible for maintaining the Rust code (maybe it's a one-off or someone else maintains it) then it's fine. But if you are, then it's not. The engineer says they don't know Rust and are fine with that, implying they don't plan to own it? But the scenario says "I accept code I couldn't have written and can't fully explain". The verdict is "basically fine", so perhaps they are not the long-term owner? The principle must account for ownership.
    - Case 6b: You are responsible for your own code, so not understanding it is not fine (rot).
    - Case 7: Throwaway script is not owned, so fine. When it becomes load-bearing, it becomes owned and then not fine.
    - Case 4: Explaining a stack trace or framework doesn't create an ownership burden, so fine.
    - Case 2: You are taking ownership by reading the whole diff and testing, so fine.
    - Case 8: Reimplementing from scratch leads to ownership because you build the understanding.

  But note: in case 6a, the engineer is accepting code they don't understand and can't explain, but they are fine with it. This candidate principle would say: if you are going to own that Rust code, then it's not fine. The engineer says it's fine, so we must assume they are not the owner? Or they are, but they are okay with not understanding? This might conflict.

  Candidate 2: The principle of "understanding depth required for task".
  - There are two kinds of understanding: shallow (knowing what the code does) and deep (knowing why, and being able to modify and adapt). The required depth depends on the task.
    - For tasks that are routine, one-off, or where the cost of misunderstanding is low, shallow understanding is sufficient.
    - For tasks that require future adaptation, debugging, or have high stakes, deep understanding is required.
  - This principle would explain:
    - Case 1: Shallow understanding is enough because the cost of getting it wrong is low (you can rerun or fix) and they are one-off.
    - Case 2: You are doing a feature that will be part of the codebase, so you need deep understanding. By reading the whole diff and testing, you gain that.
    - Case 3: Skimming the diff only gives shallow understanding, which is not enough for a feature that will be maintained.
    - Case 4: The goal is to gain understanding, so it's fine because you end up with deep understanding (or at least deeper than before).
    - Case 5: Architecture requires very deep understanding because it has long-term consequences. Without that, it's not fine.
    - Case 6a: If the Rust code is a one-off or you don't plan to maintain it, then shallow understanding (borrowed competence) is enough. But if you are going to maintain it, then not. The engineer says it's fine, so we assume they don't plan to maintain? Or they plan to, but are okay? This might be a problem.
    - Case 6b: You are patching your own code that you are maintaining, so you need deep understanding. Without it, it's rot.
    - Case 7: Throwaway doesn't require deep understanding. When it becomes load-bearing, it does, so then it's not fine.
    - Case 8: Reimplementing builds deep understanding, so fine.

  This candidate is similar to candidate 1, but emphasizes the depth required by the task rather than ownership per se. However, ownership often implies the need for deep understanding.

  Candidate 3: The principle of "learning versus doing".
  - Using AI is acceptable when it accelerates learning (as in case 4) or when it helps with a task that does not require learning (like one-off tasks). It is corrosive when it substitutes for learning in a context where learning is necessary for future tasks that you are expected to perform.
  - This would explain:
    - Case 6a: If you are not expected to learn Rust (i.e., you are not going to be a Rust developer), then it's fine. But if you are, then it's not.
    - Case 6b: You are expected to understand your own code (because you are the maintainer), so not learning is not fine.
    - Case 3: You are expected to understand the feature because you are the engineer responsible for it, so not learning the implementation is not fine.
    - Case 5: Architecture requires deep learning, so not fine.
    - Case 4: Learning is the goal, so fine.
    - Case 1: No learning needed because it's a one-off and you don't need to retain, so fine.

  But note: the engineer's principle already focuses on the next problem, which is about learning. However, in 6a, they don't learn but are fine. So we must account for whether learning is required by the role.

  Settling on one principle:

  After considering, I think the best principle is a combination of ownership and the required depth of understanding for the task at hand. However, we can unify it as:

  **Principle of Required Understanding Depth (RUD):** 
  Using AI assistance is acceptable when the depth of understanding it provides (or does not prevent you from obtaining) meets the requirements of the task. The required depth is determined by:
  - The long-term ownership of the artifact (code, architecture, etc.)
  - The cost of being unable to debug, modify, or explain the artifact in the future.

  Specifically:
  - For an artifact you own, you must have a deep understanding (able to explain, modify, and debug without relying on the AI for the same level of explanation in the future).
  - For an artifact you do not own, a shallow understanding (knowing what it does and how to use it) may be sufficient.

  This principle also acknowledges that in some cases, you can use AI to gain deep understanding (like case 4) and that is acceptable.

  Now, applying RUD to the cases:

  1. Regex, etc.: You don't own the one-liner (it's ephemeral), so shallow understanding is enough -> Fine.
  2. Feature from spec, read whole diff: You are building deep understanding for a feature you own -> Fine.
  3. Feature, only test and skim: You own the feature but only have shallow understanding -> Not fine (because when you need to modify or debug, you won't have the deep understanding).
  4. Explaining stack trace: This is a learning activity that builds deep understanding -> Fine.
  5. Architecture you own: Requires very deep understanding -> Not having it is not fine (and worse than 3 because architecture is more critical and complex).
  6a. Rust code: 
     - If you are not the owner (e.g., it's a one-off or someone else maintains it), then shallow understanding is enough -> Fine.
     - If you are the owner, then you need deep understanding -> Not fine.
     The engineer says "I don't know Rust" and "borrowed competence", and they are fine. So we must assume they are not the owner? The scenario doesn't specify. The verdict is "basically fine", so we can infer that they are not the long-term owner. If they were, it would not be fine.

  6b. Own old code: You own it, so you must have deep understanding -> Not fine (rot) because you are patching without building the understanding back.

  7. Throwaway script: Not owned -> Fine. Becomes load-bearing: Now it is owned, so without deep understanding -> Not fine.
  8. Reimplement: You are building deep understanding for an artifact you own -> Fine.

  This principle resolves the contradiction in 6a and 6b: in 6b, you are the owner, so you must have deep understanding. In 6a, if you are not the owner, then it's acceptable.

  But the engineer's description of 6a doesn't specify ownership. The scenario says: "I accept code I couldn't have written and can't fully explain". It doesn't say if they are the owner. The gut verdict is "basically fine", so we assume they are not the owner? Or perhaps the task is such that they don't need to own it. We must interpret the scenario in light of the principle.

  Now, which verdicts get thrown out? None, really. The principle explains all. But note: in case 3, the engineer feels it's not fine, and RUD agrees because the engineer owns the feature and has only shallow understanding. Similarly, case 5 is worse because the ownership is long-term and the artifact is more critical.

  Additional cases:

  - Pair-programming with a junior who is also using the model the whole time:
     - The goal is to build the junior's understanding and produce code that you both own. If the model is used in a way that the junior (and you) are not building deep understanding of the code being written, then it's not fine. But if the model is used as a tool to explain and the junior is learning, then it can be fine. However, if the junior is relying on the model to generate code without understanding, then they are not building the required understanding for ownership. Verdict: Not fine if it undermines the required understanding for the code being owned by the team. Fine if the model is used as a teaching aid and the junior (and you) are actively building understanding.

  - Paged at 3am for a service the model largely wrote:
     - You are the owner (since you are paged). At 3am, you need to debug and fix under pressure. Without deep understanding of the service, you are in trouble. Therefore, it's not fine that the model wrote it without you building the required understanding. This scenario is similar to case 7 becoming load-bearing: the ownership requires deep understanding, which you don't have.

  Confidence and epistemological pushback:

  - Confidence: High (90%) for the core idea that ownership and criticality determine the required depth of understanding. This aligns with software engineering best practices (e.g., code reviews, documentation, knowledge sharing) and the fact that maintenance is a large part of the cost.
  - Epistemological pushback: 
     - The principle might be criticized for being too vague: what exactly is "deep understanding"? How do we measure it? 
     - Also, it might not account for the fact that sometimes we rely on external systems (libraries, services) without deep understanding. But note: we don't own the library, so we only need shallow understanding (how to use it). 
     - Another pushback: what if the AI can always be used to provide the deep understanding on demand (like in case 4)? Then, perhaps, we don't need to have the understanding in our head. However, in a 3am page, you might not have time or access to the model, or the model might not be able to explain the issue. Moreover, the ability to reason about the system in your head is crucial for design and debugging. Therefore, the principle holds that for owned artifacts, you must have the understanding in your head (or within the team) without relying on an external AI at the moment of need.

  Therefore, the principle I settle on is: 

  **Principle of Required Understanding Depth (RUD):** 
  Relying on AI is acceptable if it does not prevent you from achieving the depth of understanding required for the tasks that you are responsible for. The required depth is proportional to the ownership and criticality of the artifact. 

  This principle:
  - Explains why 6a is fine (if the engineer is not responsible for maintaining the Rust code) and 6b is not (because they are responsible for their own code).
