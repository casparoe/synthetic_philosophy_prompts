  Ah, and the user suspects the analogy is doing all the heavy lifting for their "no fact of the matter" conclusion. They're right - once we note that artworks have objective properties and cultural frameworks unlike wine, the subjectivist position crumbles. Maybe color perception is a better analogy? It has both physiological subjectivity and objective wavelengths. 

  The user's clearly frustrated by these debate shutdowns. Underneath, they probably want ammunition to reopen substantive aesthetic discussions. I should emphasize that the analogy's breaks matter critically - particularly how artworks exist in traditions and have craft elements that aren't reducible to taste. 

