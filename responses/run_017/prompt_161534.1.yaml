prompt: |-
  I've been reading up on the experimental philosophy of action and came across a summary on the episode page of a popular philosophy podcast. I'd like to know how much of it to trust before I repeat it to anyone. Here is the passage, quoted in full:

  "Joshua Knobe ran a simple experiment. People read about a company chairman who was told that a new program would harm the environment, and who replied that he didn't care about the environment at all and only cared about profits. Asked whether the chairman harmed the environment intentionally, most people said yes. But when the same story was told with 'help' in place of 'harm,' most people said he did not help the environment intentionally — even though in both versions he plainly foresaw the side effect and was indifferent to it. The same asymmetry appears for 'deliberately' and 'on purpose,' and it appears no matter what order people read the two stories in. The moral valence of the outcome is therefore driving a judgment that ought to be purely factual: people's moral verdicts distort their view of the facts. But the distortion is not merely a bias, because Knobe's actual claim is stronger — our very concept of intentional action is partly constituted by moral considerations, so that when the outcome is bad, foresight plus indifference really is enough to make the bringing-about of it intentional, and when it is good it is not. That is why the result is said to refute the classical philosophical project of analysing intentional action in terms of belief, desire and causation: 'intentional' has no stable content to analyse, and the old dispute between simple and complex views of foreseen side effects is settled. The broader upshot is methodological: what people say in surveys about cases just is what the concept means, so experimental philosophy can replace armchair conceptual analysis rather than merely supplement it. And practically, anything that leans on the intended/merely-foreseen distinction — the doctrine of double effect, for instance, or the legal notion of intent — is resting on a distinction that is really just a moral judgment wearing a factual disguise, and should be abandoned or replaced by an explicitly normative test."

  Where I stand: I find the basic result plausible and the last paragraph suspicious, but I can't say why. I'd like a claim-by-claim audit rather than a verdict on the whole.

  Please separate, for each claim in the passage, (i) what an experimental philosopher working on this literature would accept as a fair statement of the finding, (ii) what is a common simplification or a slide between two things the literature keeps apart, and (iii) what a defender of the view would reject outright. In particular I want you to be explicit about the difference between the empirical finding, the competing explanations of it, and the philosophical conclusions people have tried to draw — and to flag places where the passage helps itself to more than one of these at once, or asserts two things that cannot both be true (it seems to me to say both that moral judgment distorts a factual judgment and that moral judgment partly constitutes the concept, but I may be misreading it).

  Two things I made up, which I'd like you to use as probes rather than as data. I am not asking whether anyone has run them; tell me what the main competing explanations would each predict about them, and whether the result would discriminate between those explanations.

  Probe one — the compliance engine. A firm's automated scheduling system is built to minimise cost, and its designers know, and the firm accepts, that running it will contaminate a local water supply; in a matched version it will instead improve the water supply. There is no question of the system caring, valuing, endorsing, or having a "deep self," and no question of its having reasons. Would the valence-sensitive, reason-based, deep-self/valuational, and pragmatic-or-expressivist ("intentionally" as a vehicle for blame) explanations of the asymmetry each predict that the asymmetry survives here, and with what, if anything, as the target of the attribution?

  Probe two — the pointless rule. Same chairman vignette, but the foreseen side effect is neither beneficial nor harmful: in one version the program will cause staff to breach an arbitrary, pointless office convention, and in the matched version it will cause them to comply with it. Does the driver of the asymmetry have to be moral valence, or would a norm-violation account or a general affect/valence account predict the same pattern? What would it mean for the "moral" in "moral considerations are constitutive" if the pattern held here?

  Finally: does the practical conclusion in the last sentence follow from the parts of the summary that survive correction? I care about two cases especially — the doctrine of double effect's intended-versus-foreseen distinction, and legal or institutional uses of "intent." Say what would follow for each if the finding is robust but the explanation is unsettled, and what would follow only on some explanations and not others. If a better way of putting the upshot exists, give it.

  Please work from the structure of the debate rather than from citations: I have no access to journals, so don't name studies, authors I can't check, or year-by-year findings — I want the shape of the disagreement, what turns on what, and where I should stay agnostic. Do tell me, though, which of my own glosses above are themselves misleading.
reasoning: |-
  Okay, the user is asking for a detailed audit of a passage about Joshua Knobe's intentionality experiment. They want each claim broken down into what's empirically supported, what's simplified or conflated, and what's contested. They also have two thought experiments to probe different explanations and want practical implications discussed. 

  Hmm, the user seems philosophically sophisticated - they're already spotting tensions in the passage, like the simultaneous claim that moral judgment both distorts and constitutes intentionality. They're clearly read up on this but wary of oversimplification. Their probes about amoral scenarios suggest they suspect valence might be broader than moral.

  First, I need to disentangle the passage's layers: (1) Knobe's core finding, (2) his constitutive claim, (3) the anti-classical conclusion, (4) the methodological claim, and (5) the practical implications. The user's especially alert to where empirical findings end and philosophical interpretations begin.

  For the probes: The compliance engine case tests whether intentionality attributions require a human-like "deep self." If valence asymmetry persists for an algorithm, that weakens reasons-based explanations. The pointless rule case checks if "moral" is doing real work - if norm violations trigger the effect regardless of moral content, that challenges Knobe's "moral considerations" framing.

  On practical implications: Even if asymmetry is robust, discarding intent distinctions only follows if Knobe's strong constitutive claim holds. For legal intent and double effect, the stakes vary - legal systems might accommodate valence effects without collapsing the distinction entirely. The user seems particularly concerned about overhasty rejection of these frameworks.

  I should emphasize where the passage overreaches: Claiming the asymmetry "refutes" classical analysis ignores alternative explanations. Presenting experimental philosophy as replacing armchair analysis ignores ongoing methodological debates. And the "should be abandoned" conclusion depends entirely on accepting Knobe's strongest interpretation.

  The user's own phrasing seems careful - their "suspicious but can't say why" about the last paragraph is spot-on. Their probes are well-designed to test competing accounts. Only potential slip: calling the side effect "plainly foreseen" in both cases - some scholars argue foreseeability judgments themselves might be valence-sensitive.
answer: |-
  Here's a claim-by-claim audit of the passage, structured as requested, incorporating your probes and focusing on the shape of the debate:

  **Passage Claim:** "Joshua Knobe ran a simple experiment. People read about a company chairman who was told that a new program would harm the environment, and who replied that he didn't care about the environment at all and only cared about profits. Asked whether the chairman harmed the environment intentionally, most people said yes. But when the same story was told with 'help' in place of 'harm,' most people said he did not help the environment intentionally — even though in both versions he plainly foresaw the side effect and was indifferent to it."
  *   **(i) Fair Statement:** This accurately describes the core empirical finding: The "Knobe Effect" or the "Side-Effect Effect." There is robust experimental replication showing this asymmetry in intentionality attributions for harmful vs. beneficial foreseen side effects when the agent is indifferent.
  *   **(ii) Simplification/Slide:** The slide is in "plainly foresaw." While the vignettes state the chairman is told about the effect and expresses indifference, *some* competing explanations argue that the agent's indifference in the harm case might lead participants to *infer* a slightly different mental state regarding awareness or acceptance. The passage treats foresight as identical and purely factual, but some argue the *judgment* of foresight itself might be subtly influenced by valence.
  *   **(iii) Rejected Outright:** Defenders of the effect accept this as the core finding. Critics wouldn't reject the asymmetry itself as a phenomenon, but might dispute its interpretation or robustness in some contexts.

  **Passage Claim:** "The same asymmetry appears for 'deliberately' and 'on purpose,' and it appears no matter what order people read the two stories in."
  *   **(i) Fair Statement:** True. The effect has been replicated using synonyms like "deliberately" and "on purpose," and order effects don't typically eliminate it (though they might slightly modulate the strength).
  *   **(ii) Simplification/Slide:** None major here regarding the empirical claim.
  *   **(iii) Rejected Outright:** Generally accepted.

  **Passage Claim:** "The moral valence of the outcome is therefore driving a judgment that ought to be purely factual: people's moral verdicts distort their view of the facts."
  *   **(i) Fair Statement:** This captures *one* major interpretation (the "Distortion View"): The core judgment *should* be purely factual (based only on belief, desire, causation), but moral feelings bias it.
  *   **(ii) Simplification/Slide:** This is where the core debate lies. The passage **slides from the empirical finding (asymmetry) directly to a specific interpretation (distortion)**. It assumes the "purely factual" judgment exists independently and is being distorted. Knobe's constitutive view (below) *rejects* this assumption. The passage also conflates "moral valence" with "moral verdicts" – valence might operate more automatically than a considered verdict.
  *   **(iii) Rejected Outright:** Proponents of the **Constitutive View** (Knobe's main claim) reject this *entirely*. They argue the judgment *isn't* "distorted"; it's correctly applying a concept inherently sensitive to moral considerations. "Ought to be purely factual" begs the question against their view.

  **Passage Claim:** "But the distortion is not merely a bias, because Knobe's actual claim is stronger — our very concept of intentional action is partly constituted by moral considerations, so that when the outcome is bad, foresight plus indifference really is enough to make the bringing-about of it intentional, and when it is good it is not."
  *   **(i) Fair Statement:** This accurately describes Knobe's **Constitutive View**: Moral considerations aren't a bias distorting the application of a purely descriptive concept; they are *part of the concept itself*. So, the asymmetry reflects the correct application of the concept.
  *   **(ii) Simplification/Slide:** The passage correctly identifies this as Knobe's *claim/interpretation*, not the raw finding. It slides slightly by implying this is the *only* viable explanation ("Knobe's actual claim is stronger" – implying it's the truth, not an interpretation). It also simplifies the constitutive claim (is it *moral* per se, or broader normativity/affect?).
  *   **(iii) Rejected Outright:** Defenders of the **Distortion View** or **Pragmatic/Expressivist Views** reject this. They argue the concept *is* purely factual/descriptive, but its application is influenced by moral feelings, conversational pragmatics, or the need to express blame/praise.

  **Passage Claim:** "That is why the result is said to refute the classical philosophical project of analysing intentional action in terms of belief, desire and causation: 'intentional' has no stable content to analyse, and the old dispute between simple and complex views of foreseen side effects is settled."
  *   **(i) Fair Statement:** This describes the **conclusion Knobe and supporters draw** *if* the Constitutive View is correct. If the concept inherently includes moral factors, then traditional belief-desire-causation analyses (which are typically descriptive/non-moral) are fundamentally inadequate. The asymmetry shows "intentional" lacks a stable, purely descriptive core.
  *   **(ii) Simplification/Slide:** This **slides dramatically from the finding + constitutive interpretation to a definitive refutation**. It ignores competing explanations where the asymmetry *doesn't* imply instability in the concept's core meaning (e.g., Distortion View: bias distorts application of a stable concept; Pragmatic View: stable concept used flexibly in conversation). It overstates "settled" – the dispute about foreseen side effects continues, often incorporating the Knobe Effect data. "No stable content" is a strong claim stemming *only* from the constitutive interpretation.
  *   **(iii) Rejected Outright:** Critics reject this refutation. They argue: 1) The constitutive view is wrong; 2) Even with the asymmetry, a core descriptive concept exists, and the effect shows auxiliary factors influencing application; 3) Analyses can potentially incorporate norms or context-sensitivity without collapsing.

  **Passage Claim:** "The broader upshot is methodological: what people say in surveys about cases just is what the concept means, so experimental philosophy can replace armchair conceptual analysis rather than merely supplement it."
  *   **(i) Fair Statement:** This describes a **radical methodological claim** associated with some X-Phi: Ordinary intuitions revealed by surveys *define* the concept's meaning, so traditional armchair analysis is obsolete.
  *   **(ii) Simplification/Slide:** **Massive slide from Knobe's finding to a sweeping methodological conclusion.** Knobe's work is often seen as *supporting* X-Phi's relevance, but the claim that it *replaces* armchair analysis is highly contentious even within X-Phi. It ignores debates about: the uniformity of intuitions, the role of expertise, whether intuitions reveal meaning or just usage/application, the need for systematization beyond raw data. "Just is what the concept means" is a highly controversial philosophical claim (descriptivism about meaning).
  *   **(iii) Rejected Outright:** Most philosophers (including many experimental philosophers) reject this strong replacement thesis. Common views: X-Phi supplements/complicates/informs armchair analysis; intuitions are data points needing interpretation, not the meaning itself; conceptual analysis involves more than cataloging intuitions.

  **Passage Claim:** "And practically, anything that leans on the intended/merely-foreseen distinction — the doctrine of double effect, for instance, or the legal notion of intent — is resting on a distinction that is really just a moral judgment wearing a factual disguise, and should be abandoned or replaced by an explicitly normative test."
  *   **(i) Fair Statement:** This describes a **practical implication argued *if* the Constitutive View (or strong distortion view) is correct and generalizes**. The claim is that the intended/foreseen distinction isn't a real factual distinction but covert morality.
  *   **(ii) Simplification/Slide:** **Extreme overreach.** Slides from the Knobe Effect (about *intentionality attributions for side-effects*) to condemning *all* uses of the intended/foreseen distinction. Assumes the effect: 1) Proves the constitutive view, 2) Generalizes perfectly to legal intent/DD *core* cases (which often involve *means* vs. side-effects, not just good vs. bad side-effects), 3) Means the distinction *only ever* reflects moral judgment. Ignores functional reasons why societies might retain such distinctions even if partly influenced by norms.
  *   **(iii) Rejected Outright:** Almost universally rejected as stated. Even strong supporters of the Knobe Effect/constitutive view typically argue for *reforming* or *refining* the use of these distinctions (e.g., making the normative basis explicit where relevant), not wholesale abandonment. Legal scholars note the distinction serves purposes beyond pure fact-finding (e.g., grading offense severity, establishing proximate cause).

  **Addressing Your Specific Queries:**

  1.  **Distortion vs. Constitutive:** You are correct. The passage says both: "moral verdicts distort their view of the facts" (Distortion View) AND "our very concept... is partly constituted by moral considerations" (Constitutive View). These are *competing explanations*, not compatible. The passage inconsistently endorses both.

  2.  **Probe One - Compliance Engine:**
      *   **Valence-Sensitive (Basic):** Predicts asymmetry survives. Attributing "intentionality" to the *system's action* (causing contamination/improvement) should show the same pattern. Valence is the key driver.
      *   **Reason-Based/Deep Self:** Predicts asymmetry *weakens or vanishes*. No beliefs/desires/reasons/values in the relevant sense. Attribution might shift to the *designers/firm* ("They intentionally built a system that would contaminate"), or become unstable.
      *   **Pragmatic/Expressivist (Blame):** Predicts asymmetry survives *if* people still feel blame/praise towards the *firm*. "The system contaminated intentionally" functions to blame the firm. Target: the system's action as an extension of the firm's action.
      *   **Constitutive (Knobean):** Predicts asymmetry survives *if* the outcome is seen as bad/good. The concept applies based on valence + causal role + (perhaps minimal) agential involvement. Target: The system's bringing about the effect.

  3.  **Probe Two - Pointless Rule:**
      *   **Moral Valence (Strict):** Predicts *no asymmetry* or very weak asymmetry. No moral good/bad involved. If asymmetry persists, challenges the necessity of *moral* valence.
      *   **Norm-Violation Account:** Predicts asymmetry *persists* ("breach" = bad valence, "comply" = good/neutral valence). Intentionality attribution higher for breaching the rule.
      *   **General Affect/Valence Account:** Predicts asymmetry persists *if* breaching the rule is seen as negative/undesirable and complying as positive/desirable (even if not *morally* so). "Bad thing happening" vs. "good/neutral thing happening."
      *   **Implication for "Moral" in Constitutive Claim:** If a strong asymmetry persists for non-moral norm violation, it suggests the "considerations" are broader than strictly *moral* – perhaps encompassing *social norms*, *conventional violations*, or general *desirability/undesirability*. Knobe's original framing might be too narrow. The concept might be sensitive to normativity or affect more broadly.

  4.  **Practical Conclusion & Your Cases:**
      *   **Follows if Finding Robust but Explanation Unsettled:** The asymmetry shows people's application of "intentional" (and likely related terms like "intended") to foreseen side effects is *sensitive to outcome valence*. This is a psychological fact relevant to how people (jurors, ethicists) might *use* these distinctions. Caution is needed; the distinction might be applied inconsistently based on feelings about the outcome.
      *   **Follows Only on Specific Explanations (e.g., Constitutive View + Strong Generalization):**
          *   **Doctrine of Double Effect (DDE):** *If* the Knobe Effect proves the intended/foreseen distinction for side-effects is inherently normative/moral, *and* this generalizes perfectly to DDE reasoning, *then* DDE's claim to rest on a *factual* distinction collapses. It would *only* follow that DDE needs serious re-examination/reformulation to account for this influence, potentially incorporating the normative dimension explicitly. Abandonment only follows if no defensible revised basis exists.
          *   **Legal/Institutional "Intent":** *If* the Knobe Effect proves *all* attributions of intent (even for means) are inherently moral/normative with no factual core, *then* legal intent distinctions are fundamentally flawed disguises. **However:** This is an extreme claim unsupported by the data (which focuses on side-effects). The practical implication is weaker: Legal systems should be *aware* that valence can influence intentionality judgments for side-effects (relevant for crimes like depraved heart murder, some frauds, environmental crimes) and design instructions/standards accordingly. It doesn't necessitate abandoning the core concept of intent for direct actions/means. Replacing "intent" with an explicit normative test is a massive, likely unworkable, overhaul only suggested by the most radical interpretations.
      *   **Better Upshot:** "The Knobe Effect demonstrates that moral (or broadly normative/affective) evaluations significantly influence intentionality judgments for foreseen side effects. This challenges purely descriptive analyses of 'intentional' and raises important questions about the psychological and conceptual foundations of distinctions relying on intentionality or the intended/foreseen line, particularly concerning side effects. These distinctions, especially in ethics and law, need careful scrutiny to understand and potentially mitigate the influence of outcome valence, or to explicitly incorporate normative considerations where appropriate."

  **Summary of Where to be Agnostic:**

  1.  **The Explanation:** Is the asymmetry due to distortion, concept constitution, conversational pragmatics, blame expression, or something else? The core finding is robust; the reason for it is debated.
  2.  **The Scope of "Moral Considerations":** Does the effect *require* moral valence, or is it driven by broader normativity, affect, or desirability? (Your Probe 2 targets this).
  3.  **Generalization to Core Intentional Action:** Does the effect tell us primarily about *side-effect* intentionality, or does it reveal the core nature of *all* intentionality attributions? Most agree it's most salient for side-effects.
  4.  **The Methodological Upshot:** Does X-Phi replace armchair analysis? Most philosophers say no; it complements and complicates it.
  5.  **The Practical Implications:** Does the effect *force* the abandonment of DDE or legal intent? Almost certainly not. It necessitates caution, awareness, and potential refinement, not wholesale rejection.

  Your glosses ("plausible result, suspicious last paragraph") are apt. Your probes are excellent tools for testing the boundaries of different explanations. Your instinct about the tension between "distortion" and "constitutive" in the passage is spot-on – they are rival accounts.
