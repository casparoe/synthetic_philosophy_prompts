  - Distinguish between ad hoc adjustments (bad) and theoretically motivated ones (okay)
  - Maintain that degenerating programs should only be abandoned when superior alternatives exist

  Smart how they forced me into the "no alternatives" position. I'll have to bite that bullet while emphasizing the uniqueness of quantum gravity's challenges. The landscape argument will be tricky - I'll need to frame it as exploratory rather than evasive.

  For the math point: I should stress that my framework deliberately treated math differently because its "empirical basis" is proof, not observation. But that might open another can of worms about whether math and physics programs should be judged identically.

