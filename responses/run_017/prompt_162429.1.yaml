answer: |-
  ### Response to Draft: "A prior is a budget, not a birthplace"

  **1. Machinery Check**  
  - **§2 (P) Public projection**: Correct. By the tower property and \(F_n \subseteq H^i_n\), \(E[X^i_n | F_n] = P(E | F_n)\) holds under common prior, no further assumptions needed.  
  - **§2 (Q) Private vantage**: Correct. If \(X^j_\infty = \mathbf{1}_E\) for all \(j\), then \(E[X^j_\infty | H^i_n] = E[\mathbf{1}_E | H^i_n] = X^i_n\) by martingale convergence.  
  - **§3 Variance identity**: Correct for square-integrable martingales. \(E[\sum_{n=0}^{N-1} (X_{n+1} - X_n)^2] = E[X_N^2] - E[X_0^2]\). As \(N \to \infty\), \(E[X_\infty^2] - E[X_0^2] \leq p - E[X_0^2] = E[X_0(1 - X_0)]\) (equality iff \(X_\infty = \mathbf{1}_E\)).  
  - **Upcrossing constant**: For a martingale in \([0,1]\), expected upcrossings of \([a,b]\) are bounded by \(\frac{p(1-p)}{(b-a)^2}\). Tight and standard (Doob’s inequality).  

  **2. Budget Framing Novelty**  
  The framing is novel in *context*, not in mathematics. The martingale variance identity is standard, but applying it as a "churn budget" to disagreement dynamics—where initial uncertainty caps expected belief revisions, and laundering must respect this—provides new insight. It collapses into the realization that a common prior enforces a **conservation of expected uncertainty** across updates, making churning revisions ex ante implausible under confidence.  

  **3. §4 on Laundering**  
  - **Agreement vs. Conservation**: Correct. Laundering (enlarging \(\Omega\) with \(\Theta\)) defeats the *agreement conclusion* (agents can disagree indefinitely by conditioning on private \(\Theta\)), but the *conservation law* holds: Both (P) and (Q) apply in the enlarged space. Belief paths remain martingales, so the budget constraint binds.  
  - **Evidentially inert \(\Theta\) is costly**: Correct. For disagreement to persist, \(\Theta\) must be minimally informed by public evidence (else updates would resolve \(\Theta\), collapsing disagreement). This posit is costly because it requires \(\Theta\) to be epistemically isolated from public data, which is artificial and often empirically unsupported.  

  **4. §5 Trilemma Overclaim**  
  You overclaim slightly. The per-agent budget constrains *individual belief paths*, not directly the *disagreement*. (P) ensures the *projected* disagreement \(E[X^i_n - X^j_n | F_n] = 0\), but the realized disagreement \(|X^i_n - X^j_n|\) can persist if paths are "frozen" (no churn). The trilemma holds for **paths**:  
  - **Confident**: Low \(E[X_0(1-X_0)]\).  
  - **Persistent**: Many rounds.  
  - **Churning**: High \(\sum (\Delta X_n)^2\).  
  A path cannot have all three (e.g., confidence + churn exhausts budget quickly). For *disagreement* to be confident, persistent, *and* churning, both agents’ paths must satisfy this—impossible under budget constraints. Rephrase as: "Confident and persistent disagreement cannot be churning."  

  **5. Strongest Objection**  
  **Objection**: The ex ante budget constraint does not bind realized disagreement; two agents can have frozen, confident disagreement (e.g., \(X^i \equiv 0.9\), \(X^j \equiv 0.1\)) with no churn, evading the trilemma. This persists under laundering if \(\Theta\) is inert, but such stagnation is empirically rare—most real disagreements involve *some* updates, which the budget should constrain. Yet the constraint is weak against low-magnitude revisions.  
  **Verdict**: Repairable. The budget still *prices* disagreement: If updates occur, their churn is bounded by initial uncertainty; if none occur, the posit of inert \(\Theta\) is suspect.  

  **Repair for §5**: Emphasize that the budget forces a choice: *Either* disagreement is frozen (no costly updates, raising \(\Theta\)-isolation concerns), or updates occur but are budget-constrained (churn cannot compound under confidence).  

  \answer{SALVAGEABLE}
