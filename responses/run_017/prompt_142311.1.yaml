prompt: |-
  Construct a case in which accuracy-first epistemology equipped with the quadratic (Brier) scoring rule and accuracy-first epistemology equipped with the logarithmic scoring rule tell the same agent, with the same evidence, to adopt different credences, and do so in a specified direction and by enough to change what the agent does.

  The case is for a paper I am writing on whether accuracy-first epistemology can deliver determinate rational requirements without an independent argument for a privileged scoring rule. So the case has to be one in which a realistic agent, holding a fixed body of evidence, is genuinely pulled two ways by the choice of rule, and in which the pull shows up in conduct rather than in a fourth decimal place.

  Specifications the case must meet.

  1. One agent, one partition of three mutually exclusive and jointly exhaustive hypotheses H1, H2, H3, where H3 is the rare but high-stakes cell: the diagnosis that must not be missed, the failure mode that is catastrophic if it occurs, the low-probability event whose occurrence triggers a costly protocol.

  2. The evidence is ambiguous in a way a reader can see. It does not single out one chance distribution over the partition; it narrows things to a set C of distributions all compatible with the evidence. Motivate C from the story: two defensible reference classes, a test whose operating characteristics are known only within a range, two guidelines that disagree about the base rate, and so on. Present C as the convex hull of two explicitly specified distributions, so that it is a one-parameter family and every step can be checked by hand.

  3. The agent cannot escape by being imprecise. The setting requires a single number on a form: a risk score, a probability that feeds a protocol. The agent must adopt one precise credence.

  4. Both theories handle the ambiguity by the same rule: the agent should adopt the credence that minimises worst-case expected inaccuracy over C, that is, maximise minimum expected accuracy. Hold this fixed across the two theories. The scoring rule is the only variable. If you think a different selection rule for action under ambiguity is more defensible, fix that rule and use it for both theories, but say in one sentence which you use and why.

  The verdicts I need.

  Let b be the credence the Brier rule recommends and l the credence the logarithmic rule recommends. I need l(H3) greater than b(H3), by a margin that flips a decision. Build into the scenario a threshold on the credence in H3 at which the costly protocol is triggered, a rule-out threshold, a monitoring trigger, a recall decision, whatever fits the setting. Require b(H3) to fall at least 1.5 percentage points below that threshold and l(H3) at least 1.5 percentage points above it, and require l(H3) to be at least 1.5 times b(H3). The two theories must disagree about whether to act.

  My hunch is that the logarithmic rule is the one that keeps the rare hypothesis above the threshold, since its penalty is unbounded as a credence goes to zero and it should therefore be more reluctant to let the credence in H3 get small. But the point of the exercise is to derive this rather than assume it. If in the case you build the divergence runs the other way, say so, explain why, and rebuild. And if your derivation keeps pushing one of the two recommendations to an endpoint of C, treat that as a sign the set is badly shaped for the purpose and reshape it.

  Constraints.

  Both rules are strictly proper, and the disagreement must not arise from one of them failing to be proper or from your having used an improper variant. Everything but the scoring rule is held fixed: same agent, same partition, same evidence set C, same rule for acting under ambiguity, same threshold. The divergence must fall out of the mathematics of expected inaccuracy rather than being imported: no costs of error inside the accuracy calculation, no decision-theoretic stakes, no penalty for imprecision, no value-of-inquiry considerations. Stakes enter only through the threshold, after the credences are fixed. Neither recommended credence may assign 0 or 1 to any cell. The numbers should be ones a real protocol could use, so no one-in-a-million events. The ranking of the three hypotheses by credence should be the same at b and at l: the disagreement is about magnitude, not about which hypothesis is most likely. The scenario itself is one or two paragraphs, realistic, set somewhere like a clinic, a laboratory, an engineering failure review, or a forensic unit, and contains no demons, no urns, and no prediction markets.

  Deliverables, in this order.

  (a) The scenario, with the numbers in it motivated by the story rather than reverse-engineered from the answer. A reader should be able to see why the evidence pins down C and not some other set, and why the threshold sits where it does.

  (b) The derivation. Write expected inaccuracy under each rule as a function of the agent's credence c and of the chance hypothesis Q in C. State the maximin condition for each rule. Solve for b and l on your one-parameter family, showing the first-order condition and checking second-order or boundary behaviour. Report both credences as explicit numbers to three decimal places.

  (c) A cross-check that does not presuppose your solutions are optimal. Evaluate worst-case expected Brier inaccuracy at b and at l, and worst-case expected logarithmic inaccuracy at l and at b, and confirm that the ordering is what it should be.

  (d) An account of which feature of the case is doing the work. Characterise, in one sentence each, which member of C each rule selects and what is distinctive about that member. I take it the relevant difference between the rules concerns how they treat credences that are small but not zero, but I want that to fall out of the arithmetic rather than be asserted.

  (e) Remove the feature and show the divergence collapses. At a minimum, collapse H2 and H3 into a single catch-all cell and rerun the derivation on the resulting two-cell set, showing whether the two rules now select the same credence and explaining why either way. Optionally, say what happens when C is a singleton, or when the logarithmic rule is replaced by a bounded strictly proper rule.

  (f) The attack. How would someone who holds that accuracy-first epistemology does yield determinate requirements respond to your case? Address at least three replies: that one of the two rules is the correct one and the choice is therefore not arbitrary; that ambiguous evidence should issue in imprecise credence rather than in a maximin point; and that a divergence of this size is an artefact of an unrealistic evidence set. Say which reply you find strongest and why.

  (g) One paragraph on what would have counted as cheating in this exercise, and on why your case is not cheating.
reasoning: |-
  We are to construct a case with three hypotheses H1, H2, H3, where H3 is rare but high-stakes. The evidence is ambiguous and defines a convex set C of chance distributions. We represent C as the convex hull of two distributions. The agent must choose a single credence function (a probability distribution over the three hypotheses). We use the minimax rule: choose the credence that minimizes the worst-case expected inaccuracy over C. We use two strictly proper scoring rules: Brier (quadratic) and logarithmic.

  We require that the recommended credence for H3 under the logarithmic rule (l(H3)) is greater than under the Brier rule (b(H3)) by an amount that flips a decision. Specifically, we set a threshold T for H3. We require:
     b(H3) <= T - 0.015   (at least 1.5 percentage points below)
     l(H3) >= T + 0.015   (at least 1.5 percentage points above)
  and also l(H3) >= 1.5 * b(H3).

  Moreover, the ranking of the hypotheses by probability should be the same at b and l.

  We design a scenario in a clinical setting.

  Scenario:

  A patient presents with symptoms that could be due to one of three conditions: 
     H1: Common cold (a mild, self-limiting viral infection)
     H2: Seasonal influenza (which is more severe and may require antiviral treatment)
     H3: A novel, highly contagious and dangerous respiratory virus (which is rare but requires immediate isolation and contact tracing to prevent an outbreak)

  The evidence comes from two sources:

  1. A rapid test that detects antigens common to all three viruses. The test has a known sensitivity (true positive rate) for the common cold (H1) of 90%, for influenza (H2) of 85%, but for the novel virus (H3) the sensitivity is not precisely known due to its novelty. The best estimate is that it lies between 70% and 80%. The test has a specificity of 95% for all three.

  2. Base rate information: 
     - From national surveillance, the base rate for the common cold in this season and region is about 60% of similar presentations, and for influenza about 35%. 
     - However, a recent local outbreak report suggests that the base rate for the novel virus might be as high as 5% in the current context, but the national guideline (which is based on a larger population) suggests it is only 1%. 

  The test result is positive. We must compute the posterior probability for H3.

  We assume the prior is ambiguous: the base rate for H3 is either 1% or 5%. The evidence (the positive test) is then incorporated. We assume the test has a fixed specificity (95%) and the sensitivities as above. However, for H3 the sensitivity is ambiguous: it could be 70% or 80%. 

  We have two reference points for the prior and two for the sensitivity of H3. We consider two extreme distributions that are compatible with the evidence:

  Distribution Q1 (conservative for H3):
     Prior: P(H1)=0.60, P(H2)=0.35, P(H3)=0.05
     Sensitivity for H3: 70%

  Distribution Q2 (optimistic for H3, meaning less probability for H3):
     Prior: P(H1)=0.60, P(H2)=0.39, P(H3)=0.01
     Sensitivity for H3: 80%

  But note: the test result is positive. We compute the likelihood of a positive test under each hypothesis.

  We assume the specificity is 95%, so the false positive rate is 5%. However, note that the test is designed to be positive when any of the three is present. Therefore, the likelihood of a positive test given H1 is the sensitivity for H1 (90%), given H2 is the sensitivity for H2 (85%), and given H3 is either 70% (for Q1) or 80% (for Q2). 

  We then compute the posterior for each distribution.

  For a distribution Q, the posterior for hypothesis Hi is:
     P(Hi | positive) = [P(positive|Hi) * P(Hi)] / [sum_j P(positive|Hj)*P(Hj)]

  We compute for Q1 and Q2.

  First, Q1:
     P(positive|H1) = 0.90
     P(positive|H2) = 0.85
     P(positive|H3) = 0.70

     Prior: (0.60, 0.35, 0.05)

     Numerator for H1: 0.90 * 0.60 = 0.54
     Numerator for H2: 0.85 * 0.35 = 0.2975
     Numerator for H3: 0.70 * 0.05 = 0.035

     Total = 0.54 + 0.2975 + 0.035 = 0.8725

     Posterior Q1:
          H1: 0.54 / 0.8725 ≈ 0.619
          H2: 0.2975 / 0.8725 ≈ 0.341
          H3: 0.035 / 0.8725 ≈ 0.040

  Second, Q2:
     P(positive|H1) = 0.90
     P(positive|H2) = 0.85
     P(positive|H3) = 0.80   (note: higher sensitivity)

     Prior: (0.60, 0.39, 0.01)   [note: H2 prior adjusted to 0.39 so that they sum to 1]

     Numerator for H1: 0.90 * 0.60 = 0.54
     Numerator for H2: 0.85 * 0.39 = 0.3315
     Numerator for H3: 0.80 * 0.01 = 0.008

     Total = 0.54 + 0.3315 + 0.008 = 0.8795

     Posterior Q2:
          H1: 0.54 / 0.8795 ≈ 0.614
          H2: 0.3315 / 0.8795 ≈ 0.377
          H3: 0.008 / 0.8795 ≈ 0.009

  So the set C of chance distributions (after the test) is the convex hull of:
     Q1 = (0.619, 0.341, 0.040)
     Q2 = (0.614, 0.377, 0.009)

  But note: the convex hull of two points is the set of all mixtures: 
     Q(λ) = λ * Q1 + (1-λ) * Q2, for λ in [0,1].

  We can write:
     H1: λ*0.619 + (1-λ)*0.614 = 0.614 + 0.005λ
     H2: λ*0.341 + (1-λ)*0.377 = 0.377 - 0.036λ
     H3: λ*0.040 + (1-λ)*0.009 = 0.009 + 0.031λ

  So the set C is parameterized by λ in [0,1]. The chance of H3 ranges from 0.009 to 0.040.

  We are to find the credence c = (p1, p2, p3) that minimizes the worst-case expected inaccuracy over λ.

  The agent must report a single probability for H3 to determine whether to trigger the costly protocol. The threshold for triggering is set at 0.02 (2%). If the probability of H3 is at least 2%, then the protocol (isolation and contact tracing) is activated.

  We require:
     b(H3) <= 0.02 - 0.015 = 0.005 (0.5%)
     l(H3) >= 0.02 + 0.015 = 0.035 (3.5%)
     and l(H3) >= 1.5 * b(H3)

  But note: the maximum H3 probability in C is 0.040 (4.0%) and the minimum is 0.009 (0.9%). We require l(H3) to be at least 3.5%, which is less than 4.0%, so it is possible.

  Now, we must choose a credence distribution c=(p1, p2, p3). However, the minimax rule will choose a particular c. We assume the agent is free to choose any probability distribution over the three hypotheses. But note: the worst-case expected inaccuracy for a given c is computed by taking the maximum over λ of the expected inaccuracy when the true chance is Q(λ).

  We use two scoring rules:

  1. Brier (quadratic) score: for a probability assignment p=(p1,p2,p3) and if the true state is i, the score is:
        S(p, i) = (1-p_i)^2 + sum_{j≠i} p_j^2
     The expected Brier score under a chance distribution Q(λ)=(q1,q2,q3) is:
        E[S(p, ·)] = q1*[(1-p1)^2 + p2^2 + p3^2] + q2*[p1^2 + (1-p2)^2 + p3^2] + q3*[p1^2 + p2^2 + (1-p3)^2]

     We can rewrite this as:
        E[S] = q1*(1 - 2p1 + p1^2 + p2^2 + p3^2) 
               + q2*(1 - 2p2 + p1^2 + p2^2 + p3^2)
               + q3*(1 - 2p3 + p1^2 + p2^2 + p3^2)
             = (q1+q2+q3) * (1 + p1^2+p2^2+p3^2) - 2*(q1 p1 + q2 p2 + q3 p3)
             = 1 + ||p||^2 - 2 (q·p)

     Since q1+q2+q3=1.

  2. Logarithmic score: 
        S(p, i) = - log(p_i)
     Expected score: E[S] = - [q1 log(p1) + q2 log(p2) + q3 log(p3)]

  We now set up the minimax problem for each scoring rule.

  We note that the set C is one-dimensional (parameterized by λ). We can express the expected scores as functions of λ and the credence p.

  We assume the agent chooses p to minimize the maximum (over λ) of E[S(p, Q(λ))].

  We are particularly interested in p3 (the credence in H3). We require that the entire distribution p is chosen optimally.

  However, note that the minimax credence might not be in the set C. We must find the credence p that minimizes the maximum expected inaccuracy over λ.

  We break the problem into two: one for Brier and one for logarithmic.

  We start with the Brier score.

  Let p = (p1, p2, p3) be a probability vector (p1+p2+p3=1, all nonnegative).

  The expected Brier score for a given λ and p is:
     E_Brier(p, λ) = 1 + (p1^2+p2^2+p3^2) - 2 [q1(λ) p1 + q2(λ) p2 + q3(λ) p3]

  where:
     q1(λ) = 0.614 + 0.005λ
     q2(λ) = 0.377 - 0.036λ
     q3(λ) = 0.009 + 0.031λ

  We can write:
     E_Brier(p, λ) = 1 + (p1^2+p2^2+p3^2) 
                     - 2 [ (0.614+0.005λ) p1 + (0.377-0.036λ) p2 + (0.009+0.031λ) p3 ]

  We can rearrange as a function of λ:
     E_Brier(p, λ) = [1 + p1^2+p2^2+p3^2 - 2*(0.614 p1 + 0.377 p2 + 0.009 p3)] 
                     + 2λ [ -0.005 p1 + 0.036 p2 - 0.031 p3 ]

  Let:
     A(p) = 1 + p1^2+p2^2+p3^2 - 2*(0.614 p1 + 0.377 p2 + 0.009 p3)
     B(p) = 2 * [ -0.005 p1 + 0.036 p2 - 0.031 p3 ]

  Then:
     E_Brier(p, λ) = A(p) + B(p) * λ

  Note: λ in [0,1]. Therefore, for fixed p, the maximum over λ is:
     If B(p) >= 0: then the maximum is at λ=1: A(p)+B(p)
     If B(p) < 0: then the maximum is at λ=0: A(p)

  We wish to minimize over p the function:
     M(p) = max{ A(p), A(p)+B(p) }   if B(p)>=0, then M(p)=A(p)+B(p); if B(p)<0, then M(p)=A(p)

  We can write:
     M(p) = A(p) + max{0, B(p)}

  But note: if B(p)>=0, then M(p)=A(p)+B(p); if B(p)<0, then M(p)=A(p).

  We now consider the logarithmic score.

  The expected log score for a given λ and p is:
     E_log(p, λ) = - [ q1(λ) log(p1) + q2(λ) log(p2) + q3(λ) log(p3) ]

  Substituting the expressions for q(λ):
     = - [ (0.614+0.005λ) * log(p1) + (0.377-0.036λ) * log(p2) + (0.009+0.031λ) * log(p3) ]

  We can write:
     E_log(p, λ) = - [ 0.614 log(p1) + 0.377 log(p2) + 0.009 log(p3) ]
                   - λ [ 0.005 log(p1) - 0.036 log(p2) + 0.031 log(p3) ]

  Let:
     C(p) = - [ 0.614 log(p1) + 0.377 log(p2) + 0.009 log(p3) ]
     D(p) = - [ 0.005 log(p1) - 0.036 log(p2) + 0.031 log(p3) ]

  Then:
     E_log(p, λ) = C(p) + λ * D(p)

  For fixed p, the maximum over λ in [0,1] is:
     If D(p) >=0: then max at λ=1: C(p)+D(p)
     If D(p) <0: then max at λ=0: C(p)

  So the worst-case expected log inaccuracy is:
     M_log(p) = C(p) + max{0, D(p)}

  We now have two minimax problems:

     For Brier: minimize M(p) = A(p) + max{0, B(p)}
     For Log: minimize M_log(p) = C(p) + max{0, D(p)}

  We must find the minimizer for each.

