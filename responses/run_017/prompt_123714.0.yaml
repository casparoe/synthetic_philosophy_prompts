prompt: |-
  I write a fortnightly column for a science-and-technology magazine about ideas that escape their home discipline, and part of my job is vetting the op-eds, book excerpts and embargoed press releases we run. A few times a month something crosses my desk in which a source — a theoretical physicist, an AI researcher, a legal theorist, a central banker with a taste for big ideas — reaches for Gödel's incompleteness theorems outside mathematics: to argue that machine intelligence can never equal human understanding, that there can be no final theory of physics, that no legal, tax or regulatory code can ever be complete, that no model of the economy can be closed, that the universe cannot be a simulation. I don't want the blanket newsroom response that every such use is abuse, because some of them are doing real work; but I also don't want to print a sentence that would make a working logician wince. My constraints are fixed: roughly fifteen minutes per item, no mathematics beyond what I remember from school, fact-checkers with humanities degrees who are not going to read a proof, and a standards editor who signs off and whom I need to be able to justify the call to in a Slack message. So what I want is a triage procedure I can actually run — the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no (cut the sentence), where it permits printing with a specified hedge, and where it has to hand the decision to a person, either because the remaining question is one of editorial judgment rather than fact or because it is a technical question that no amount of triage can settle.

  The conceptual work is in deciding which distinctions have to survive the translation into something a non-specialist can run. My sense is that the load-bearing ones include: whether a formal system has actually been specified at all, and whether it is the kind of structure that could encode elementary arithmetic rather than, say, a chess engine or a spreadsheet; whether what is said to be missing is derivability inside that system, truth, or knowability by any mind; whether the argument needs the system to be consistent and what becomes of it if it is not; whether the target is held fixed or quietly re-specified every time a gap is pointed out, which is what happens in the Lucas-Penrose style of argument about minds and machines; whether the limitation is claimed of one system or uniformly of all of them; and whether the word doing the work is really incompleteness or rather undecidability, uncomputability or Chaitin-style irreducibility. A friend who works in formal epistemology gave me three rough tests she uses — she calls them the arithmetization test, the export step and the mirror test, the last being: take the human, or the physics community, or the legal system as the target and see whether the argument, if sound, proves the same limitation about us. Keep, correct or discard those, and add whatever checks they miss. Be explicit about which steps are judgment calls dressed up as procedure, and give me two or three substitute sentences I can drop in when the verdict is that the analogy fails but the underlying point is fine.

  Then run it, in front of me, on three items. First, a press release in which an AI company's chief scientist says the incompleteness theorems show that no system of rules can capture mathematical truth, and therefore no AI can have understanding and their product will always need a human in the loop — vivid copy, and my editor wants to quote it. Second, an op-ed from a well-known theoretical physicist arguing that because any sufficiently strong formal system leaves truths unprovable, physics can never have a final theory, only an endless succession of them. Third, and this is the one where I want you to be ruthless: a column of my own, half written, arguing that Gödel shows the dream of a complete and consistent regulatory code — a rule for every case, no discretion, no gaps — is not merely impractical but incoherent, so that discretion is a permanent feature of law rather than a regrettable one; a colleague muttered something about open texture when I described it, which I took as dismissal. Give me the honest verdict on all three, including whether mine has to be killed or can only survive as an explicitly labelled illustration, and then say what the procedure cannot do: which of these arguments it can only classify as beyond triage, where it will misfire on claims that are metaphorical on purpose, and when the right answer is to go and find an actual logician. Please reason from the structure of the theorems themselves rather than from anything you would need to look up — I have no way of checking a reference, and I would rather have the argument than the authority.
reasoning: |-
  We are constructing a triage procedure for non-specialist use to evaluate applications of Gödel's incompleteness theorems outside mathematics. The goal is to quickly assess whether the application is sound, or at least not obviously abusive, and to provide guidance for editing.

  Key distinctions to consider (as per the user's note):
  1. Is a formal system specified? And is it the kind that can encode elementary arithmetic?
  2. What is claimed to be missing? (derivability, truth, knowability)
  3. Is consistency assumed? What if the system is inconsistent?
  4. Is the target fixed or moving? (e.g., in arguments about minds and machines)
  5. Is the limitation claimed for one system or uniformly for all?
  6. Is the key concept incompleteness, undecidability, uncomputability, or irreducibility?

  Additionally, the friend's tests:
  - Arithmetization test: Can the system in question encode arithmetic? (This is necessary for Gödel's theorems to apply.)
  - Export step: Is the step of applying the theorem to the non-mathematical domain clearly articulated and valid?
  - Mirror test: If the argument were applied to humans (or the relevant human system), would it show the same limitation? (To check for self-refutation or double standards.)

  The triage procedure:

  Step 1: Arithmetization Test
     Question: Is there a formal system specified that is rich enough to encode elementary arithmetic? (Note: This usually means it must be able to represent basic number theory and recursive functions.)
     If no: Stop. The use of Gödel's incompleteness theorems is almost certainly misplaced. (Cut the sentence unless there is a very clear and explicit analogy that doesn't require the full theorem.)
     If yes: Proceed to Step 2.

  Step 2: Export Step
     Question: What exactly is being claimed as the "missing" element? And how is it being exported to the non-mathematical domain?
     - Check: The theorem says that in such a system, there are statements that are true but unprovable within the system (if the system is consistent). It does not say that truth is unknowable by any means, only that the system cannot prove them. Also, note that the theorem applies to each specific formal system, but one can always extend the system to prove more (though the extended system will have its own Gödel sentence).
     - Red flags:
          a. Claiming that the system cannot know the truth at all (because an external agent might).
          b. Claiming that no system can ever capture all truth (but Gödel's theorem does not rule out a non-formalizable method, and it applies to one system at a time).
          c. Confusing unprovability in the system with absolute unknowability.
     If the export step is flawed (e.g., claims absolute unknowability, or that no system can ever be complete) and the flaw is fatal to the argument: Stop. Cut the sentence or require a rewrite that removes the Gödel reference and states the underlying point without it.
     If the export step is acceptable (or can be fixed with a hedge): Proceed to Step 3.

  Step 3: Mirror Test
     Question: Apply the same argument to the human mind (or the relevant human system). Does the argument prove too much? For example, if the argument says that no formal system (like an AI) can know mathematical truth because of Gödel, then does the same apply to the human brain? If the human brain is considered a formal system, then by the same argument it would be incomplete. But if the proponent claims that the human mind can somehow transcend formal systems, then they must explain how without special pleading.
     - If the argument fails the mirror test (i.e., it would also limit the human mind but the author exempts the mind without justification): Then the argument is likely flawed. This step is especially critical for AI-mind arguments.
     - If the mirror test passes (meaning the author is consistent and the limitation applies uniformly, or the author provides a non-arbitrary reason for the exemption) then the argument may be acceptable.

  Step 4: Consistency and Undecidability Check
     Question: Does the argument rely on the system being consistent? (Gödel's theorem requires consistency. If the system is inconsistent, then it can prove everything and is complete but unsound.) Also, check if the author might be confusing incompleteness with undecidability or uncomputability.
     - If the argument ignores the consistency requirement or conflates with other concepts: This is a problem. The hedge might be to note that the system must be consistent for the theorem to apply, and that inconsistency would be worse.
     - If the argument is about undecidability (e.g., the halting problem) or uncomputability (e.g., no algorithm for every problem) then Gödel's incompleteness is not the right theorem. In that case, the reference should be corrected if possible.

  Step 5: Judgment Call
     After the above, if the argument survives but with some quibbles, we may allow it with a hedge. If it fails, we cut or rewrite.

  Hedges and Substitute Sentences:
  When the analogy fails but the underlying point is fine, we can use:
     Hedge 1: "While Gödel's incompleteness theorems are often invoked to suggest inherent limitations in formal systems, their direct application to [domain] is debated. However, it is true that [underlying point without Gödel]."
     Hedge 2: "Some have drawn parallels to Gödel's results to argue for inherent gaps, but regardless of the mathematical analogy, [underlying point]."
     Hedge 3: "Even without invoking Gödel, one can argue that [underlying point]."

  Now, apply the procedure to the three items:

  Item 1: AI chief scientist
     Claim: Incompleteness theorems show that no system of rules can capture mathematical truth, therefore no AI can have understanding and they will always need a human in the loop.

     Step 1: Arithmetization Test
          The formal system in question is the AI (presumed to be a formal system). But is it specified? The claim is about any system of rules, which might include formal systems that can encode arithmetic. So, yes, in principle, if the AI is such a system.

     Step 2: Export Step
          The claim: no system of rules can capture mathematical truth. This is an overstatement. Gödel's theorem says that for any consistent formal system capable of arithmetic, there are truths it cannot prove. But it does not say that truth is uncapturable by any system. Also, the AI might be able to know the truth by other means (e.g., by using a different system). Moreover, the step from unprovability in the system to lack of understanding is not established.

          Also, note: the theorem says that the system cannot prove its own Gödel sentence, but we (outside) can see it is true. So the human in the loop might be playing that role. But that does not necessarily mean the AI lacks understanding; it might just mean that the AI is limited in proving every truth.

          Flaw: The claim that no system of rules can capture mathematical truth is too strong. Gödel's theorem does not show that truth is uncapturable, only that no single formal system can prove all truths. And the leap to "understanding" is not justified by the theorem.

     Step 3: Mirror Test
          If we consider the human brain as a formal system, then by the same argument it would be incomplete and hence unable to capture mathematical truth. But the chief scientist is likely exempting humans. Without a non-arbitrary reason, this is special pleading.

     Step 4: Consistency
          The argument assumes consistency, which is necessary. But if the AI is inconsistent, then it can prove everything but is unsound.

     Verdict: The argument fails the mirror test and overstates the export step. The use of Gödel is abusive. We should not print without correction.

     Suggested hedge: Cut the Gödel reference and state the underlying point (if any) without it. Alternatively, use a hedge: 
          "The chief scientist argues that AI systems will always have limitations in capturing mathematical truth, drawing an analogy to Gödel's incompleteness theorems. However, the exact implications of these theorems for AI are debated. What is clear is that current AI systems benefit from human oversight."

     But note: the editor wants to quote. We might have to quote exactly and then add a clarifying note? That's beyond the triage. The triage says: cut the sentence that abuses Gödel. Alternatively, we can run it with a hedge in the text or a footnote.

     Given the constraints, the triage says: cut the Gödel part. The underlying point about AI needing human oversight might be made without Gödel.

  Item 2: Theoretical physicist op-ed
     Claim: Because any sufficiently strong formal system leaves truths unprovable, physics can never have a final theory, only an endless succession.

     Step 1: Arithmetization Test
          The formal system is the physical theory. But is it specified? The claim is about any final theory being a formal system. The physicist is likely assuming that a final theory would be a formal system capable of encoding arithmetic (because physics includes arithmetic). So, yes.

     Step 2: Export Step
          The claim: the final theory would be incomplete, so there would be physical truths it cannot prove. Then we extend the theory to a new one, which in turn is incomplete. But note: the Gödel sentence for a physical theory might not be a physical truth. It might be a purely mathematical statement. Also, the theorem does not say that the unprovable truths are physical. They are arithmetical.

          Moreover, the physicist might be assuming that the physical theory is a formal system that includes arithmetic. But physical theories are usually not presented as formal systems in the logical sense. They are mathematical models, but not necessarily axiomatic systems that can encode arithmetic in the required way.

          Flaw: The unprovable truths are mathematical, not necessarily physical. There is no reason to believe that the physical world has truths that are unprovable by the theory but that are about physics. Also, we can always extend the theory, but the new theory might be more complete in the physical sense even if it is still incomplete mathematically.

     Step 3: Mirror Test
          If we apply the same to the current physical theories, they are incomplete. But that doesn't prevent us from having a final theory that is empirically complete (i.e., explains all physical phenomena) even if it doesn't decide every mathematical statement.

     Step 4: Consistency
          Assumed.

     Verdict: The export step is questionable because the unprovable truths are mathematical, not physical. The argument may not hold. However, the underlying idea of an endless succession of theories might be supported by other reasons.

     Suggested hedge: 
          "The physicist suggests that Gödel's incompleteness theorems imply that physics cannot have a final, complete theory. While these theorems do show that any formal system capable of arithmetic will have unprovable mathematical truths, it is an open question whether this necessarily applies to physical theories. Nevertheless, history shows that physical theories are often extended."

     Alternatively, we might allow the argument with a note that the application is speculative.

     Given the triage: The argument is not clearly abusive, but it is not airtight. We might let it stand with a hedge.

     Triage output: Permitted with hedge. We can use Hedge 1: "While Gödel's incompleteness theorems are often invoked to suggest inherent limitations in formal systems, their direct application to physics is debated. However, it is true that physics has progressed through a series of ever more comprehensive theories."

  Item 3: User's own column (regulatory code)
     Claim: Gödel shows that a complete and consistent regulatory code (a rule for every case, no discretion, no gaps) is not merely impractical but incoherent.

     Step 1: Arithmetization Test
          The formal system: the regulatory code. We must ask: can a regulatory code encode elementary arithmetic? Probably not. Regulatory codes are not designed to be formal systems for arithmetic. They are sets of rules for human behavior. They might be interpreted as a formal system, but it is unlikely that they can encode arithmetic in the required way.

          Without arithmetization, Gödel's theorem does not apply.

     Step 2: Export Step
          Even if we granted arithmetization, the theorem would say that there are regulatory statements (that are arithmetic) that the code cannot decide? But we don't care about arithmetic in the regulatory code. We care about regulatory gaps.

          The gap in regulation is about unregulated cases. Gödel's theorem produces a gap in the form of a statement that is true but unprovable. But in regulation, a gap is a case not covered by the rules. This is a different kind of gap.

     Step 3: Mirror Test
          If we take the legal system (including judges and lawmakers) as a whole, it might be seen as an evolving system that can extend itself. But the argument is about a fixed code.

     Step 4: Consistency
          The code must be consistent? In law, we tolerate some inconsistency and resolve it through interpretation.

     Verdict: The arithmetization test fails. Regulatory codes are not formal systems of arithmetic. Hence, the application is misplaced.

     Moreover, the gap in regulation is a different concept. The column is using Gödel to make a philosophical point about the necessity of discretion, but the theorem does not directly support it.

     However, the underlying point about the impossibility of a complete and consistent regulatory code might be supported by other arguments (e.g., the open texture of legal concepts, as suggested by the colleague).

     Suggested action: Kill the Gödel reference. Rewrite to use the concept of open texture or other non-mathematical arguments.

     Triage output: Cut the sentence. The procedure stops with a "no" at Step 1.

     But note: the user's column is about the dream being incoherent. Without Gödel, the point might be made with other reasoning. So we kill the Gödel part and use a substitute.

     Substitute: "Even without invoking mathematical logic, we can recognize that the dream of a complete and consistent regulatory code may be unattainable because of the open-ended nature of human affairs and the inevitability of unforeseen cases, making discretion a permanent feature of law."

  What the procedure cannot do:
  - It cannot settle arguments that are deliberately metaphorical. If the author is using Gödel as a metaphor for inherent limitations, the procedure will flag it as abusive, but the editorial judgment might be to allow it as a metaphor (with a note). The procedure is designed to catch misuse in technical claims.
  - It cannot handle highly technical arguments that require deep logical expertise. In such cases, the triage will either reject (if it fails an early step) or flag as "beyond triage" and require an expert.
  - It may misfire on arguments that are about uncomputability or undecidability (like the halting problem) but are misattributed to Gödel. The procedure checks for this in Step 4, but if the argument is really about uncomputability, then we might correct the reference.
  - It cannot replace expert judgment when the formal system in question is borderline (e.g., is a particular system strong enough?).

  Final Procedure Outline:

  1. Arithmetization: Is the system specified and capable of arithmetic? If not, stop: cut.
  2. Export: Check the claim about what's missing and the export. If flawed, stop: cut or require hedge.
  3. Mirror: Apply to the human system. If inconsistent, stop: cut or require hedge.
  4. Consistency and Concept: Check consistency requirement and if the right theorem is used. If not, correct or hedge.

  Hedges: Use the substitute sentences to remove the Gödel reference and state the underlying point.

  For the three examples:
  - Item 1: Cut the Gödel reference (fails Step 1? Not exactly: it passes Step 1 in the abstract, but fails Step 2 and Step 3). We cut.
  - Item 2: Permitted with hedge.
  - Item 3: Cut the Gödel reference.

  When to find a logician:
  - When the argument survives the triage but you are unsure (e.g., the arithmetization is debatable, or the export step is subtle).
  - When the author is a logician making a technical argument that requires expertise to evaluate.
  - When the triage procedure gives a borderline result and the piece is important enough to warrant expert review.
answer: |-
  Below is a triage procedure designed for your constraints (15 minutes per item, no advanced math, non-specialist fact-checkers). It focuses on the key distinctions you identified and your friend's tests (**arithmetization test**, **export step**, **mirror test**). The procedure is structured as a step-by-step checklist with explicit decision points. Steps that are judgment calls are flagged. 

  ### **Triage Procedure: Gödel's Incompleteness Theorems in Non-Mathematical Contexts**
  **Core Principle**: Gödel’s theorems apply only to formal systems that can encode elementary arithmetic (e.g., basic number theory). They show that in any such *consistent* system, there are statements that are **true but unprovable within the system** (first theorem), and the system cannot prove its own consistency (second theorem). The theorems do not address truth in absolute terms, human knowability, or systems outside arithmetic.

  **Key Questions in Order**:
  1. **Arithmetization Test**:  
     - *Question*: Is a formal system specified that can encode elementary arithmetic?  
     - *Sufficient Answer*: The system must be defined with symbols, rules, and axioms that allow operations like addition/multiplication (e.g., a programming language, logical framework, or axiomatic theory). Exclude systems like chess, spreadsheets, or informal human processes.  
     - *Judgment Call*: Does the system *realistically* encode arithmetic? (e.g., "a legal code" probably can’t; "a Turing-complete AI" might).  
     - **Outcomes**:  
       - ❌ **No system specified** → Cut the sentence.  
       - ❌ **System specified but cannot encode arithmetic** → Cut the sentence.  
       - ✅ **System can encode arithmetic** → Proceed to Step 2.  

  2. **Export Step**:  
     - *Question*: What is claimed to be "missing" (unprovability, truth, or knowability)? Is it correctly exported?  
     - *Sufficient Answer*:  
       - Derive the flaw:  
         - **Valid**: "System X cannot prove all truths about itself."  
         - **Invalid**: "System X cannot know truth," "No system can ever be complete," or "This proves absolute limits."  
       - Check for conflation:  
         - ❌ **Truth vs. Provability**: Gödel separates truth (external) from provability (internal). Claims like "no system can capture truth" overreach.  
         - ❌ **Consistency ignored**: If the system is inconsistent, it can "prove" anything, making incompleteness irrelevant.  
         - ❌ **Uniformity error**: Claims like "all systems are incomplete" misstate Gödel (each system has its own gaps; extensions can fill them).  
     - **Outcomes**:  
       - ❌ **Fatal flaw** (e.g., claims absolute unknowability or ignores consistency) → Cut the sentence.  
       - ⚠️ **Minor flaw** (e.g., overgeneralizes "all systems") → Permit with hedge.  
       - ✅ **Valid export** → Proceed to Step 3.  

  3. **Mirror Test**:  
     - *Question*: Does the argument, if sound, apply equally to the human mind/analogous human system?  
     - *Sufficient Answer*: Apply the same logic to humans (e.g., "If Gödel limits machines, why not physicists/lawyers?"). Reject special pleading (e.g., "humans are non-algorithmic" without evidence).  
     - **Outcomes**:  
       - ❌ **Fails test** (e.g., exempts humans arbitrarily) → Cut the sentence.  
       - ✅ **Passes test** (e.g., accepts humans are also limited) → Proceed to Step 4.  

  4. **Concept Check**:  
     - *Question*: Is the core limitation **incompleteness** (Gödel), or is it **undecidability** (e.g., halting problem), **uncomputability**, or **irreducibility**?  
     - *Sufficient Answer*:  
       - **Incompleteness**: About unprovable truths in arithmetic-encoding systems.  
       - **Other concepts**: Undecidability (no algorithm for all problems), uncomputability (functions with no algorithm), etc.  
     - **Outcomes**:  
       - ❌ **Wrong concept** (e.g., uses Gödel for uncomputability) → Cut the sentence.  
       - ⚠️ **Borderline** (e.g., mixes incompleteness with broader limitations) → Permit with hedge.  
       - ✅ **Correct concept** → Permit the sentence.  

  **Final Decision Summary**:  
  - ❌ **Cut** if any step fails (❌ outcome).  
  - ⚠️ **Hedge** if minor flaw (⚠️ outcome). Use substitute sentences below.  
  - ✅ **Permit** if all steps pass.  

  **Substitute Sentences for Failed Analogies** (use when the underlying point is sound but Gödel is misapplied):  
  1. "While Gödel’s theorems highlight limitations in formal arithmetic, [domain, e.g., law/AI] faces inherent gaps for more practical reasons: [briefly state point]."  
  2. "Even without invoking technical results like Gödel’s, we can see that [domain] cannot achieve perfection because [underlying point]."  
  3. "Gödel’s work is often misapplied here, but the core insight—that [underlying point]—stands on its own."  

  ---

  ### **Triage Applied to Your Three Items**
  **Item 1: AI Chief Scientist’s Press Release**  
  *Claim*: "Gödel’s incompleteness theorems show no system of rules can capture mathematical truth, so no AI can have understanding and always needs a human in the loop."  
  - **Step 1 (Arithmetization)**: ✅ Passes. AI systems (if Turing-complete) can encode arithmetic.  
  - **Step 2 (Export Step)**: ❌ Fatal flaw.  
    - *Why*: Conflates unprovability-in-a-system with "cannot capture truth." Gödel doesn’t say truth is uncapturable—humans can know Gödel sentences, and AIs might use meta-systems. Also claims "no system of rules" (uniformity error). Ignores that inconsistent systems can "prove" everything, which is worse.  
  - **Step 3 (Mirror Test)**: ❌ Fails.  
    - *Why*: If humans are formal systems, they’d be equally limited. Scientist exempts humans without justification (special pleading).  
  - **Step 4 (Concept Check)**: ❌ Fatal flaw.  
    - *Why*: Confuses incompleteness with understanding—a non-sequitur.  
  - **Verdict**: ❌ **Cut the sentence**. Gödel is doing no real work here; it’s a rhetorical crutch. The underlying point ("AI needs human oversight") can stand with Substitute #2.  

  **Item 2: Theoretical Physicist’s Op-Ed**  
  *Claim*: "Any sufficiently strong formal system leaves truths unprovable, so physics can never have a final theory—only endless approximations."  
  - **Step 1 (Arithmetization)**: ⚠️ Judgment call.  
    - *Why*: A "final theory" (e.g., a Theory of Everything) is often modeled as a formal system. It *might* encode arithmetic (e.g., via quantum mechanics). But this is debatable—physics describes the universe, not just math.  
  - **Step 2 (Export Step)**: ⚠️ Minor flaw.  
    - *Why*: Correctly identifies unprovability in strong systems. But subtly implies "physics truths" are like arithmetic truths (Gödel’s gaps are mathematical, not necessarily physical). Also, a final theory might be empirically complete without being mathematically complete.  
  - **Step 3 (Mirror Test)**: ✅ Passes.  
    - *Why*: The argument applies uniformly—human physicists would also face Gödelian gaps in their theories.  
  - **Step 4 (Concept Check)**: ✅ Passes.  
    - *Why*: Correctly targets incompleteness.  
  - **Verdict**: ⚠️ **Permit with hedge**. The analogy is speculative but not abusive. Use Substitute #1: "While Gödel’s theorems highlight limitations in formal arithmetic, physics may never achieve a final theory for more fundamental empirical reasons: our universe’s complexity and the need for iterative refinement."  

  **Item 3: Your Column on Regulatory Codes**  
  *Claim*: "Gödel shows a complete, consistent regulatory code (no gaps, no discretion) is incoherent, so discretion is permanent in law."  
  - **Step 1 (Arithmetization)**: ❌ Fails.  
    - *Why*: A regulatory code is not a formal system encoding arithmetic. It’s a set of rules for human behavior, lacking the logical structure for Gödel (e.g., no axioms for number theory). Your colleague’s "open texture" comment hints at this—legal terms are inherently vague.  
  - **Step 2 (Export Step)**: ❌ Fatal flaw.  
    - *Why*: Conflates "gaps" in law (unaddressed cases) with Gödelian gaps (unprovable arithmetic truths). Regulatory gaps are about ambiguity or omission, not unprovability.  
  - **Step 3 (Mirror Test)**: ⚠️ Judgment call.  
    - *Why*: If applied to humans, the argument might hold (e.g., "lawmakers are incomplete too"), but Step 1 already fails.  
  - **Step 4 (Concept Check)**: ❌ Fatal flaw.  
    - *Why*: Uses incompleteness for "gaps," but legal gaps are better explained by Hart’s "open texture" (which your colleague referenced) or computational limits.  
  - **Verdict**: ❌ **Kill the Gödel reference**. The analogy doesn’t hold, and Gödel adds no insight. However, your core point (discretion is unavoidable) is sound—rebuild it using:  
    - Substitute #3: "Gödel’s work is often misapplied to law, but the core insight—that regulatory codes can never cover every case due to ambiguity and evolving social contexts—stands."  
    - Better: Replace with "open texture" (Hart’s legal theory) or computational complexity. Example rewrite: *"No regulatory code can eliminate discretion because language is inherently vague (open texture), and real-world cases outstrip rules—not due to Gödel, but human limitations."*  

  ---

  ### **What the Triage Procedure Cannot Do**  
  1. **Arguments beyond triage**:  
     - Highly technical claims (e.g., "Chaitin’s irreducibility applies to economics") require an expert. The triage flags these at Step 1 or 4.  
     - "Moving target" arguments (e.g., Lucas-Penrose on minds/machines) often fail the mirror test but need a logician to dissect the reflexivity.  

  2. **Metaphorical or poetic uses**:  
     - The procedure will misfire on intentionally loose analogies (e.g., "Gödel as a metaphor for cosmic mystery"). If the author states it’s metaphorical, override triage and label it as such.  

  3. **Judgment-heavy steps**:  
     - Arithmetization (Step 1) and Export Step (Step 2) require editorial judgment. The procedure flags these but can’t eliminate subjectivity.  

  4. **When to call a logician**:  
     - If a claim survives Step 1 but has nuanced issues in Step 2 or 4 (e.g., "Does quantum gravity encode arithmetic?").  
     - If the argument is central to your piece (e.g., a cover story) and the triage outcome is ⚠️.  
     - For any claim made by a logician (e.g., "Gödelian constraints in type theory")—triage can’t handle niche extensions.  

  **Final Advice**: Use the triage to catch clear abuses (e.g., Items 1 and 3) and permit plausible analogies with hedging (e.g., Item 2). For borderline cases, the Slack-friendly justification is: *"Gödel requires arithmetic-encoding systems and consistent unprovability. This fails because [Step X]."* This respects logicians while letting you move fast.
