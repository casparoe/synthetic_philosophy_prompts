prompt: |-
  I serve on a small working group that is writing the consent chapter of an ethics manual for a clinical research network, and I have fallen into an argument with a colleague that we cannot settle. We agree on the verdict in nearly every case we throw at each other and still come out with different accounts of what consent requires, which makes me think each of us is quietly running a different principle and only noticing when the cases get strange. So I want to start from my own verdicts rather than from a theory. Here they are, as unlabelled as I can make them. (a) I agree to have blood drawn; the person who draws it is a first-week trainee, and I would have asked for someone experienced — my verdict: my consent was fine, but I was wronged anyway. (b) I donate blood because I am told it is going to the local children's hospital; it is in fact sold to a commercial lab. Not valid. (c) I donate blood because I am told there is a desperate shortage and one unit saves three lives; there is no shortage and the unit is discarded. I lean not-valid, without being able to say what does the work. (d) I donate blood because I am told there are free cookies afterwards, and there are none. Valid, and it would be absurd to say otherwise. (e) My partner removes a condom mid-act, or does not disclose a known infection. Not valid. (f) A friend lets me store boxes in her garage; she would have refused outright had she known the boxes held campaign literature for a party she detests. Valid — she has no complaint about what she authorized. (g) A landlord says: sleep with me or I evict you when the lease ends, which he is legally entitled to do. Not valid. (h) An unemployed father takes a hazardous, poverty-wage job because the benefit system leaves him nothing else. Valid, though the situation is unjust. (i) A devout Jehovah's Witness refuses transfusion while lucid and, hours later, delirious from blood loss, says yes. The yes does not count. (j) The case I keep reversing on: a woman with moderate dementia enrolled in a longitudinal study a year ago while fully competent and cheerful about it, and had also written, when competent, that she did not want to be enrolled in anything once she could no longer understand what it was; today she cannot recall the study but smiles and signs. (k) A hospital intake chatbot describes a procedure's side-effect as occasional tingling when the true risk is permanent numbness in one case in twenty; the phrasing was chosen by an administrator to reduce refusal rates; the patient would have signed anyway; the nurse who collected the signature never read the script and the clinician did not know it. I want to say not valid, but I cannot say whose act invalidated it. (l) A care home uses a model trained on a resident's recorded past choices to predict that she would consent to a daily blood-pressure check she now physically resists; the prediction is probably better than her present refusal. I want to say this is not consent at all, and I am not sure why.

  My own tentative principle, which I would like you to test rather than flatter, is this: a yes counts as valid consent just in case (1) the person was competent with respect to the kind of choice at issue at the time of the yes, (2) what they took themselves to be authorizing is, under some reasonable description, what actually happened, (3) no one in the chain of producing the yes used a fact about that person's alternatives that they had no standing to use, and (4) any false belief that moved them was about what they were authorizing, not merely about whether authorizing it was worth their while. Run it against the twelve cases, tell me which of my verdicts it cannot deliver and which clause is doing the failing, and then either repair it or replace it with something that does better, saying explicitly if some verdict of mine has to go and why that is the right place to give. If it matters, I care more about clause (4) than about the rest, because (b) and (c) feel the same to me and (d) does not, and I cannot articulate the difference. Finally, tell me what your preferred account predicts for three cases I have not listed: the chatbot script written by a clinician who had read the evidence and was merely negligent; consent given by someone competent but three days into acute grief; and an opt-out system in which silence is counted as agreement.

  Please lead with a single sentence stating the principle you are defending, then work through the cases and the three predictions, and keep the entire answer under 700 words.
reasoning: |-
  Hmm, the user presents a fascinating ethical puzzle about consent across twelve varied scenarios and asks me to evaluate their proposed principle. They're clearly deeply engaged in clinical ethics work and frustrated by theoretical disagreements masked by practical agreement. The core tension seems to be between autonomy violations versus mere disappointment or unrelated wrongs.

  Looking at their principle: Clause 1 (competence) handles cases like dementia and delirium well. Clause 2 (reasonable description of action) resolves garage storage and commercial blood diversion cleanly. Clause 3 (standing over alternatives) perfectly captures the landlord coercion case while allowing the hazardous job as valid consent under unjust circumstances. 

  But clause 4 (beliefs about authorization vs. worth) struggles. Blood shortage (c) and cookie deception (d) both involve false beliefs about worth, yet feel ethically distinct. Their intuition about (b) and (c) being similar while (d) is different suggests clause 4 needs refinement. I suspect the distinction lies in whether the deception fundamentally alters the nature of the transaction versus merely disappointing expectations.

  For the dementia case (j), their principle can't resolve the conflict between past and present selves without additional weighting of precedent autonomy. The chatbot case (k) reveals a gap about institutional responsibility - the consent is invalid not because of any individual's intent but because the system deliberately corrupted the information flow.

  My proposed modification centers on deception related to core aspects of what's being authorized. This preserves all their verdicts except possibly the dementia case, which requires acknowledging competing autonomy interests. The three new cases test boundaries: negligent clinicians still vitiate consent because misinformation source doesn't matter; grief may compromise specific competence; opt-out systems aren't consent but policy choices.

  The user's focus on clause 4 shows keen insight - the worth/authorization distinction is where most debates live. By tying "core aspects" to what reasonable people would consider material to the authorization act, we honor their intuition that saving lives (c) is fundamentally different from cookies (d).
answer: |-
  Here's my principle: **Consent is valid when (1) competent regarding the choice, (2) the act authorized reasonably matches the understanding under which consent was given, (3) no illegitimate use of alternatives occurred, and (4) no material deception about the nature or core purpose of the authorized act induced consent.**

  Testing your principle against your verdicts:

  *   **(a) Blood Draw:** Passes all clauses (trainee isn't about *what* was authorized). Verdict upheld.
  *   **(b) Sold Blood:** Fails (4) - Belief moved you about core purpose/destination. Verdict upheld.
  *   **(c) Shortage/Discarded:** Fails (4) - Belief moved you about the core purpose/urgency of the donation. Verdict upheld.
  *   **(d) No Cookies:** *Fails clause (4)*. Your principle says invalid (false belief moved you about worth). But your verdict is valid. **Conflict.**
  *   **(e) Condom/Infection:** Fails (2) - Act authorized (safe sex) ≠ act performed. Verdict upheld.
  *   **(f) Garage Boxes:** Passes all. Belief was about worth, not authorization. Verdict upheld.
  *   **(g) Landlord:** Fails (3) - Landlord illegitimately used control over alternatives (housing). Verdict upheld.
  *   **(h) Hazardous Job:** Passes (3) - Systemic injustice isn't *someone* illegitimately using alternatives. Verdict upheld.
  *   **(i) JW Transfusion:** Fails (1) - Not competent when consenting. Verdict upheld.
  *   **(j) Dementia Consent:** *Problematic*. Clause (1) fails (current competence). Upholds verdict that 'yes' doesn't count. BUT, your past directive *also* matters. Principle doesn't resolve conflict between past & present selves.
  *   **(k) Chatbot Risk:** Fails (2) & (4) - Act authorized (low risk) ≠ act performed (serious risk), induced by deception about nature. Verdict upheld. Institutional responsibility fills the gap.
  *   **(l) Model Prediction:** Fails (1) - Not competent *and* no current authorization. Not consent. Verdict upheld.

  **Repairing Clause (4):** Clause (4) must distinguish material deception about the *act itself* (purpose, nature, core conditions) from deception about *collateral benefits or context* that only affect its perceived worth. Revise: **(4) They were not induced to consent by a material deception regarding the nature, core purpose, or essential conditions of the act being authorized.** Cookies are collateral; saving lives/shortage is core to the donation's purpose. (d) now passes (valid consent), matching your verdict. (b) and (c) still fail.

  **Predictions for New Cases:**

  1.  **Negligent Clinician Chatbot:** Not valid. Fails revised clause (4) - Material deception about the nature/risk of the act occurred, regardless of intent.
  2.  **Consent in Acute Grief:** Competence (1) is context-specific. If grief impairs understanding/processing of *this specific choice*, not valid. If competence remains, valid.
  3.  **Opt-Out System:** Silence is not consent. Fails clause (1) - No affirmative demonstration of competence/choice, and often fails (2) - lack of understanding/authorization. It's a policy, not consent.

  **Your Verdict on (d) Must Stand:** Your intuition that cookie deception doesn't invalidate consent is correct. Revised clause (4) protects it by focusing deception on the core act authorized. The injustice in (c) lies in deceiving someone about the fundamental *point* of their authorization.
