answer: |-
  Your frustration cuts to the heart of how history is narrated and the powerful, often unexamined, assumptions baked into the word "collapse." You're right to sense a deep inconsistency. Let's dissect the implicit theory behind this practice:

  **The Core Presuppositions of "Collapse" Talk:**

  1.  **Societies as Discrete, Bounded Entities with Lifecycles:** This is fundamental. The practice assumes societies (Maya civilization, Roman Empire, Soviet Union) are like organisms or machines that can be "born," "peak," "decline," and "die" at a specific point. This reifies complex, fluid human networks into singular, nameable "things."
  2.  **Complexity as the Norm and Goal:** "Collapse" presupposes that a specific *level* of socio-political complexity (large cities, monumental architecture, centralized bureaucracy, writing systems, extensive trade networks, large armies) is the natural, desirable, and stable state. Losing this complexity is seen as an aberration, a failure, a regression.
  3.  **Rapid Loss as Catastrophic:** While definitions vary, "collapse" strongly implies a *relatively rapid* (within generations, not centuries) and *significant* loss of that core complexity. A slow transformation over centuries is "decline" or "transition," while a faster unraveling is a "collapse." The speed signals a loss of control.
  4.  **State-Centric Focus:** The primary "thing" that is usually understood to have "ended" is **the dominant political structure and its associated elite project.** The end of centralized state control, the ruling dynasty/ideology, the imperial administration, the elite cultural complex centered on palaces/temples. The "collapse" is the failure of *that specific project* to maintain its scale and complexity.
  5.  **Negative Evaluation (Often Implicit):** "Collapse" carries a heavy connotation of disaster, failure, loss, and often chaos. It suggests things got *worse* for the people involved in terms of security, order, prosperity (at least for the elites), and cultural achievement. This is why we don't say "France collapsed in 1958" – the Fifth Republic was seen as a successful adaptation, not a failure. The Berlin Wall "fell" positively; the USSR "collapsed" negatively.
  6.  **A Break in Continuity (Perceived or Emphasized):** The narrative highlights a rupture. What came after is framed as fundamentally different, lesser, or disconnected from what came before. This is where the contradiction with descendant communities is starkest: the *state project* ended, but the *people and core cultural elements* persisted, adapting.

  **What Exactly "Ends"?**

  Based on the practice, it's rarely the entire population, language, religion, or way of life that vanishes entirely (though aspects can be severely impacted). What "ends" is typically:

  *   **The Centralized State:** Its institutions, ruling elites, administrative control, monopoly on force.
  *   **The Elite Cultural Complex:** Monumental building, certain art styles, widespread literacy (if it existed), elite patronage systems.
  *   **Large-Scale Economic Integration:** Extensive trade networks, specialized production dependent on central redistribution.
  *   **A Specific Level of Socio-Political Complexity:** The society becomes less stratified, less centralized, operates on a smaller geographic scale, and relies on less intensive resource extraction/management.

  **Your Test Case: Collapse or Change?**

  This brilliantly exposes the biases. According to the *common practice* you're critiquing, most historians *would* likely label this a "collapse."

  *   **Why?** It hits the key presuppositions:
      *   **Rapid Loss of Complexity:** Cities emptied, writing abandoned, long-distance trade ceased – significant complexity lost within a few generations.
      *   **"Failure" of State/Elite Project:** The urban, literate, trading system failed.
      *   **Perceived Negative Evaluation (ignoring health):** The loss of cities, writing, and trade is *assumed* to be a regression, a "dark age," regardless of health outcomes. The narrative focuses on what was lost (complexity), not what might have been gained (health, sustainability).
      *   **Break in Continuity Emphasized:** The urban way of life *ended*.

  *   **What Actually Ended?** The *urban, state-level, literate, mercantile societal configuration.* The specific political economy built around those cities.

  *   **Why it *Shouldn't* be called Collapse (Your Point):** Because by the most crucial metric – *human well-being* – it was arguably a successful adaptation or even an improvement. The core cultural identity (language, religion) persisted. It was a profound *transformation*, a strategic *downsizing*, or a shift in societal priorities leading to better outcomes for the population. Calling it "collapse" imposes an external value judgment (complexity=good) that ignores the lived experience and agency of the people who made those choices.

  **Rewriting History Without "Collapse":**

  Dropping the "end at a datable moment" idea requires a fundamental shift:

  1.  **Focus on Transformation & Continuity:** Frame historical change as continuous processes of adaptation, resilience, and reconfiguration. Emphasize what persisted and evolved alongside what changed. Instead of "Maya Collapse," discuss "The Transformation of Maya Societies in the 9th-10th Centuries."
  2.  **De-center the State:** Focus less on the failure of kings and palaces and more on the experiences, choices, and adaptations of communities, farmers, artisans, and families.
  3.  **Evaluate Change Holistically:** Consider multiple metrics: not just political complexity or monument building, but health, equality, sustainability, cultural vitality, and resilience. Was the change an adaptive response to environmental stress or internal contradictions?
  4.  **Embrace Multiplicity & Scale:** Recognize that change happens at different speeds and scales simultaneously within a region. While cities might empty, rural villages thrive; while an empire fragments, local identities strengthen.
  5.  **Acknowledge Perspective:** Be explicit about *whose* "end" or "failure" is being discussed (usually the elites) and recognize that the same event might be liberation or opportunity for others.
  6.  **Use More Precise Language:** Replace "collapse" with terms like:
      *   Fragmentation
      *   De-urbanization
      *   Political rupture
      *   Administrative failure
      *   Socio-political transformation
      *   Period of decentralization
      *   Adaptation/Resilience response
      *   End of a specific dynasty/regime/state *project*.

  **Conclusion:**

  The "collapse" narrative is powerful because it simplifies complex history into a dramatic story with a clear ending. However, as you astutely observe, it rests on questionable presuppositions: reifying societies, equating complexity with success and its loss with failure, focusing narrowly on elite state structures, and often imposing negative judgments. It frequently ignores continuity, adaptation, and the perspectives of non-elites. Your test case perfectly illustrates how this framing can be misleading.

  Moving beyond "collapse" means embracing a messier, more nuanced, and more human-centered view of history, where change is constant, endings are rarely absolute, and societies are ongoing processes of adaptation rather than discrete entities with expiration dates. It requires us to ask not just "why did it fail?" but "how did people adapt?" and "what forms of resilience and continuity emerged?" This shift wouldn't just change our labels; it would fundamentally alter how we understand the dynamics of human societies through time.
