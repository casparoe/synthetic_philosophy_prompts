prompt: |-
  I sit on the small committee at work that has to sign off on a "mystery bonus" scheme HR has proposed, and two of my colleagues have argued themselves into a corner about it. The scheme: an employee is shown two sealed envelopes, one containing exactly twice the other, with the amounts drawn from a distribution the company controls; the employee picks one, is allowed to open it, and may then switch once. HR's question to us is whether letting employees peek and switch costs the company anything in expectation. I have to write the recommendation and I honestly can't tell who is right about which part.

  Ana says the scheme leaks and that the case is straightforward. Ben says it leaks nothing and that Ana's argument is a textbook error. They went six rounds:

  **(1) Ana:** If I open my envelope and see an amount a, the other envelope contains either 2a or a/2 with probability one-half each, so its expected value is 1.25a. Switching is therefore always right, and every employee who takes the option gains 25% in expectation. The company should price that in.

  **(2) Ben:** That one-half/each step is the entire mistake. Conditional on seeing a, how likely you are to be holding the smaller envelope depends on how probable the pair {a/2, a} is relative to the pair {a, 2a} under the company's distribution, and no genuine probability distribution makes those equally likely at every a. For any proper distribution, always-switching has exactly the same expected value as always-staying, so the option is free.

  **(3) Ana:** I concede always-switch is worthless — that isn't my claim. Give the distribution a ceiling. If the smaller amount can never exceed M and I see anything above M, I know I hold the larger envelope and must stay; if I see the smallest amount the process can produce, I know I hold the smaller and must switch. So switching is not expectation-neutral in general, the peek carries real information, and the option has a real price.

  **(4) Ben:** Peeking is worth something at the edges of a bounded range, granted — but that is information about where you sit in the range, not evidence that the other envelope is probably larger. And it doesn't generalise: for a fixed pair {x, 2x}, no rule that depends only on the number you see can get you the larger envelope more than half the time. The envelopes are exchangeable, so symmetry caps you at 50/50 whatever you do.

  **(5) Ana:** That last claim is simply false, and it's where I think your whole position breaks. Before opening, draw a threshold T from any continuous distribution with support over all positive amounts — say T = e^Z with Z normal of mean 0 and a very large standard deviation — then switch if and only if the amount you see is below T. For any pair {L, H} with L < H, your probability of ending up with H is 1/2 + (F(H) − F(L))/2, which strictly exceeds 1/2 because F is increasing; and your expected take is (H + L)/2 + (F(H) − F(L))(H − L)/2, strictly above the (H + L)/2 you get by choosing blind. No assumptions about the company's distribution enter anywhere. The option is exploitable at every pair.

  **(6) Ben:** Look at what you've actually bought, though. For any threshold law you fix in advance, finance can pick the stake so that your edge is as small a fraction of the stake as it likes: far out in the tail, F(2L) − F(L) goes to zero. And the more honestly scale-ignorant you try to be — the wider you spread T — the flatter F becomes across any single doubling, so your edge at every stake shrinks roughly like one over that spread. So your "exploit" is a strictly positive quantity whose only attainable floor is zero and which vanishes precisely in the case the original argument was about: unbounded ignorance about the scale of the amounts. Which suggests move (1) wasn't approximately right — it was pointing in the opposite direction from the truth.

  Please adjudicate this for me. I'd be grateful if you'd structure the reply as follows:

  **"The formalism"** (150–200 words): set out in your own terms the correct way to model the situation — a distribution over the smaller amount, a switching rule conditional on what is seen, and what peeking can and cannot buy — so that the rest of the reply has a fixed frame.

  **"Move-by-move verdicts"** (600–800 words): rate each of the six moves on a scale from clearly mistaken to clearly right, justify each rating in two or three sentences, and flag any move that reaches a correct conclusion by a faulty route or a faulty conclusion by a route that is nearly right.

  **"What both of them are missing"** (300–400 words): the considerations neither side brings up that change how the dispute should come out.

  **"What I should tell HR"** (150–250 words): the practical bottom line for the committee, including which design choices (revealing a ceiling, allowing the peek, how the amounts are drawn) actually matter for the cost of the scheme and which don't.

  Please keep the reasoning self-contained: I need arguments I can reproduce to two numerically literate colleagues, not references.
reasoning: |-
  We are considering the "mystery bonus" scheme: an employee is shown two sealed envelopes, one containing twice the other. The smaller amount is denoted by X, so the two envelopes contain X and 2X. The company chooses X from some distribution (with cumulative distribution function F and density f, if it exists) over the positive reals. The employee picks one envelope at random (so each with probability 1/2). They are allowed to open it, see an amount A, and then decide whether to switch to the other envelope.

  The question: does allowing the peek and switch cost the company in expectation?

  **The formalism**

  We model the situation as follows:
  - Let X be the smaller amount, drawn from a distribution with cumulative distribution function (CDF) F_X(x) = P(X ≤ x), and let the two envelopes be (X, 2X).
  - The employee picks an envelope at random. With probability 1/2, they pick the smaller (so A = X) and with probability 1/2, they pick the larger (so A = 2X).
  - Upon seeing A, the employee uses a switching rule: they may choose to switch or not. We denote by s(a) the probability that the employee switches upon seeing a (so s: R+ → [0,1] is a function chosen by the employee in advance).

  The expected gain from the switching rule relative to not switching (or relative to the initial choice) is the key. The company's expected cost per game is the expected amount the employee ends up with.

  Without loss of generality, we can compute the expected value of the amount the employee ends up with, and compare it to the expected value of the initial choice (which is (X + 2X)/2 * 1 = 1.5 E[X]). However, note that the initial choice already has an expectation of 1.5 E[X]. The question is whether the switching option increases this.

  The employee's final amount depends on:
  - If they start with X (prob 1/2) and switch (prob s(X)), they get 2X; if they don't switch (prob 1-s(X)), they get X.
  - If they start with 2X (prob 1/2) and switch (prob s(2X)), they get X; if they don't switch (prob 1-s(2X)), they get 2X.

  Therefore, the expected amount the employee ends up with is:
  E[final] = (1/2) * [ s(X)*2X + (1-s(X))*X ] + (1/2) * [ s(2X)*X + (1-s(2X))*2X ]
           = (1/2) * [ 2X s(X) + X - X s(X) ] + (1/2) * [ X s(2X) + 2X - 2X s(2X) ]
           = (1/2) * [ X + X s(X) ] + (1/2) * [ 2X - X s(2X) ]
           = (1/2) * [ X(1 + s(X)) ] + (1/2) * [ X(2 - s(2X)) ]
           = (X/2) * [ 1 + s(X) + 2 - s(2X) ]
           = (X/2) * [ 3 + s(X) - s(2X) ]

  Therefore, the expected final amount conditional on X is:
  E[final | X] = (X/2) * [3 + s(X) - s(2X)]

  The unconditional expected final amount is then:
  E[final] = E[ (X/2) * (3 + s(X) - s(2X)) ]

  The expected amount without switching (i.e., if the employee never switches) is E[1.5 X] = 1.5 E[X].

  The cost of the switching option is the difference: E[final] - 1.5 E[X]. We want to know if this can be positive.

  Alternatively, we can compute the difference:
  Δ = E[final] - 1.5 E[X] = E[ (X/2) * (3 + s(X) - s(2X)) ] - 1.5 E[X]
    = E[ (X/2)*(3) + (X/2)*s(X) - (X/2)*s(2X) ] - 1.5 E[X]
    = E[ (3X/2) + (X/2)s(X) - (X/2)s(2X) ] - 1.5 E[X]
    = 1.5 E[X] + (1/2) E[X s(X)] - (1/2) E[X s(2X)] - 1.5 E[X]
    = (1/2) [ E[X s(X)] - E[X s(2X)] ]

  So the cost (or gain to the employee) is:
  Δ = (1/2) E[ X s(X) - X s(2X) ]

  This expression tells us that the switching rule can lead to an advantage only if E[X s(X)] > E[X s(2X)]. Note that s(·) is a function chosen by the employee.

  **Move-by-move verdicts**

  **(1) Ana:**
  Rating: Clearly mistaken.
  Justification: Ana assumes that given an observed amount a, the other envelope is equally likely to be 2a or a/2. This is not necessarily true because the probability of observing a in the smaller envelope versus the larger envelope depends on the distribution of X. Specifically, the likelihood of the pair (a/2, a) versus (a, 2a) is proportional to the probability density of X at a/2 versus at a (if the density exists). Without a specific distribution, we cannot assume these are equal. Therefore, the expected value of the other envelope is not necessarily 1.25a. The argument is flawed because it ignores the prior distribution.

  **(2) Ben:**
  Rating: Clearly right (in refuting Ana's step (1)).
  Justification: Ben correctly points out that the conditional probability of the other envelope being 2a or a/2 depends on the distribution of the smaller amount. For instance, if the distribution is such that X is very unlikely to be a/2 and very likely to be a, then seeing a makes it more likely that you are holding the larger envelope. Therefore, the 1/2-1/2 assumption is invalid. Ben also correctly states that for any proper distribution, if the employee always switches, then the expected value is the same as always staying (by symmetry). This is because always switching is equivalent to initially choosing the other envelope, which by symmetry has the same distribution.

  **(3) Ana:**
  Rating: Clearly right (in the bounded case).
  Justification: Ana now considers a bounded distribution (with a ceiling M). In this case, if the employee sees an amount above M, they know it must be the larger envelope (since the smaller is at most M) and so they do not switch. Similarly, if they see the smallest possible amount, they know it is the smaller and switch. This strategy (switching only when seeing the smallest amount, or more generally when below a threshold) can yield a positive expected gain in a bounded distribution. This refutes Ben's earlier claim (in move 2) that switching is always neutral. The key is that the distribution is bounded, so the edges are informative.

  **(4) Ben:**
  Rating: Partially right and partially mistaken.
  Justification: Ben is right that at the edges of a bounded distribution, the peek gives information about the position in the range, not necessarily that the other envelope is probably larger. He is also right that for a fixed pair {x, 2x}, no rule based solely on the observed number (without knowledge of the distribution) can guarantee more than 50% chance of getting the larger envelope. However, he claims that the envelopes are exchangeable and thus symmetry caps the success rate at 50/50. This is true for a fixed pair and a fixed rule? Actually, note: for a fixed pair {x, 2x}, the employee initially has a 50% chance of picking the larger one. After seeing the amount, if they use a rule that depends on the value, they might do better only if they have some prior knowledge (like the bounds). But without any prior, they cannot. However, the employee can design a rule that uses a randomized threshold (as in move 5) that does break the symmetry. So Ben's claim that "no rule ... can get you the larger envelope more than half the time" is false in the context of a known distribution (or with a randomized threshold). However, it is true for a fixed pair without any prior information about the scale? Actually, if the employee has no idea about the scale, then they cannot break the symmetry. But note: the employee doesn't need to know the distribution; they can use a randomized threshold (as in move 5) which breaks the symmetry arbitrarily. Therefore, Ben's claim is too strong and incorrect as stated.

  **(5) Ana:**
  Rating: Clearly right (in the randomized threshold strategy).
  Justification: Ana proposes a strategy: draw a threshold T from a continuous distribution (with full support) and switch if and only if the seen amount is below T. She then shows that for any fixed pair {L, H} (with H=2L), the probability of ending up with H is 1/2 + (F(H) - F(L))/2, which is strictly greater than 1/2 if F is strictly increasing (because F(H)>F(L)). This breaks the symmetry and gives a strictly positive edge. Importantly, this holds for any pair and does not depend on the company's distribution. The edge is (F(H)-F(L))/2 * (H-L) per pair? Actually, the expected take per pair (given L) is (H+L)/2 + (F(H)-F(L))(H-L)/2, which is indeed above (H+L)/2. Therefore, the employee can gain in expectation. This refutes Ben's claim in move (4) that symmetry caps the success at 50%.

  **(6) Ben:**
  Rating: Partially right (in the asymptotic sense) but misses the main point.
  Justification: Ben points out that for any fixed threshold rule (or distribution of T), the company can choose the stake X to be very large, and then the edge (F(2X)-F(X)) becomes very small (if the distribution of T has wide support, then F is flat over the interval [X,2X]). Thus, the edge per unit stake (i.e., relative to the stake) becomes small. However, note that the absolute edge might still be positive and bounded away from zero? Actually, for a fixed rule (with a fixed distribution for T), the edge for a given X is (F(2X)-F(X))*(X) (up to a factor). As X goes to infinity, if the distribution of X has a tail that decays appropriately, then the edge might vanish. But note: the company does not know the employee's threshold distribution? And the employee can choose T arbitrarily. However, if the company chooses a distribution for X that is heavy-tailed, then the edge might be non-vanishing? Actually, the employee's rule is fixed in advance. So if the employee fixes a rule (with a fixed T distribution), then the company can choose a distribution for X that puts most of the mass in the tail, making the edge (F(2X)-F(X)) small. But the employee's gain is still positive (even if small in relative terms). Moreover, Ben says that the edge vanishes in the case of "unbounded ignorance", meaning when the distribution of X is unbounded and the employee's rule is fixed. However, note that the employee can choose a rule that is adaptive to the scale? But the rule must be fixed in advance. The key point is: the employee's strategy (with a fixed T distribution) does yield a strictly positive expected gain for any distribution of X chosen by the company. The gain might be small in relative terms for large X, but it is still positive. Therefore, the option does cost the company something. However, Ben's point that the relative edge vanishes as the stake grows is correct, but it does not negate the existence of a positive cost.

  **What both of them are missing**

  Both Ana and Ben are focusing on the switching rule and the edge it provides, but they are missing the following:

  1. **The role of the distribution of X**: The expected cost Δ = (1/2) E[ X s(X) - X s(2X) ] depends critically on the distribution of X and the switching rule s. The company can choose the distribution of X to minimize the employee's ability to gain. In particular, if the distribution of X is chosen to be heavy-tailed (like a log-normal distribution with a very high variance), then the relative edge from the switching rule might be negligible. However, the absolute edge is still positive.

  2. **The employee's prior knowledge**: In practice, the employee may have some prior knowledge about the scale of the bonuses (e.g., from past bonuses or company culture). This knowledge can be incorporated into the switching rule, making it more effective. The company might not know the employee's prior, so they must consider worst-case scenarios.

  3. **The possibility of multiple plays**: The analysis so far is for one play. If the scheme is offered repeatedly to the same employee, they can learn the distribution and adapt their switching rule. This would increase the cost to the company.

  4. **The boundedness issue**: Ana's move (3) shows that in a bounded distribution, the employee can gain at the edges. Ben counters in move (6) that in the unbounded case the relative edge vanishes. But even in the unbounded case, the absolute gain is positive. However, if the company chooses a distribution that is symmetric on the log scale (like a log-uniform over a very wide range), then the edge per unit stake might be very small. But note: the absolute expected gain is still positive.

  5. **The zero-cost case**: Ben is correct that if the distribution of X is such that for every x, the density satisfies f(2x) = 2 f(x) (a condition for the "equal likelihood" assumption to hold), then the naive 1.25a calculation holds and switching is always beneficial. But such a distribution must be scale-invariant and cannot be normalized (it would be the improper distribution with density proportional to 1/x). This is the only case where Ana's initial reasoning holds exactly, but it is not a valid probability distribution. Therefore, for any proper distribution, the employee can design a rule that yields a positive expected gain.

  **What I should tell HR**

  The bottom line is that allowing the peek and switch does cost the company in expectation, but the magnitude of the cost depends on the design choices:

  1. **The distribution of the smaller amount (X)**: 
     - If the company uses a bounded distribution (with a known maximum), the cost can be significant because employees can exploit the endpoints. Avoid bounded distributions with known endpoints.
     - For unbounded distributions, the cost per unit stake (i.e., relative to the bonus size) can be made arbitrarily small by choosing a heavy-tailed distribution (like a log-normal with high variance). However, the absolute cost is still positive and might be non-negligible if the distribution is concentrated in a range where the employee's switching rule is effective.

  2. **Revealing a ceiling**: 
     - If the company reveals a maximum possible amount, then employees can use that information to design a switching rule that exploits the upper bound (by never switching when seeing an amount above the maximum possible smaller amount). This increases the cost. Therefore, do not reveal a ceiling.

  3. **The switching rule**: 
     - The employee can use a randomized threshold (like drawing T from a normal distribution and exponentiating) to achieve a strictly positive expected gain regardless of the company's distribution. However, the expected gain is small when the distribution of X is spread over many orders of magnitude.

  4. **Practical cost**: 
     - The expected cost per game is positive but can be made very small (as a fraction of the expected bonus) by using a log-scale distribution with high variance. For example, a log-normal distribution with a large standard deviation on the log scale would make the employee's edge (F(2x)-F(x)) very small for typical x.

  Recommendation:
  - The option does have a cost, but it is controllable by the company's choice of distribution.
  - Do not reveal any bounds (especially a ceiling).
  - Use an unbounded distribution with a heavy tail (like log-normal with high variance) to minimize the relative cost.
  - The absolute cost might be negligible in practice for such a distribution.

  In summary, the peek-and-switch option does cost the company in expectation, but the cost can be made arbitrarily small (as a fraction of the bonus amount) by appropriately choosing a widely dispersed distribution for the smaller amount. Therefore, the cost is not zero, but it can be minimized to an acceptable level.
answer: |-
  ### The formalism
  The setup involves a smaller amount \(X\) drawn from a distribution \(F\) (with density \(f\)) over \((0,\infty)\). Two envelopes contain \(X\) and \(2X\). The employee randomly selects one envelope, opens it to observe an amount \(a\), and then decides whether to switch. A switching rule \(s(a)\) (a function from \(\mathbb{R}^+\) to \([0,1]\)) specifies the probability of switching upon seeing \(a\). The employee’s expected final amount, given \(X\), is \(\frac{X}{2} [3 + s(X) - s(2X)]\). The cost of the switching option—its expected gain over the baseline \(\frac{3}{2}E[X]\)—is \(\Delta = \frac{1}{2} E[X s(X) - X s(2X)]\). Peeking buys information about which envelope (\(X\) or \(2X\)) was drawn, but this is only useful if the employee’s switching rule exploits asymmetries in \(F\). Without such asymmetries (e.g., at points where \(f(x)\) and \(f(x/2)\) are comparable), peeking provides little value. The key is that \(\Delta \neq 0\) only if \(s\) correlates with \(X\) in a way that breaks exchangeability, which depends on \(F\).

  ### Move-by-move verdicts
  **(1) Ana: Clearly mistaken.**  
  Ana assumes that given observed \(a\), \(\frac{a}{2}\) and \(2a\) are equally likely. This requires \(P(X = a/2) = P(X = a)\), which is generally false; it holds only for pathological (improper) priors. The error ignores how \(F\) shapes the likelihood of pairs \(\{a/2, a\}\) vs. \(\{a, 2a\}\). Her 25% gain claim is invalid.

  **(2) Ben: Clearly right (refutes Ana).**  
  Ben correctly identifies Ana’s error: the conditional probability depends on \(f(a/2)\) vs. \(f(a)\), which are unequal for proper \(F\). His symmetry argument—envelopes are exchangeable, so always-switching equals always-staying—is sound and proves \(\Delta = 0\) for that rule.

  **(3) Ana: Clearly right (bounded case).**  
  Ana correctly notes that with a known upper bound \(M\), seeing \(a > M\) implies \(a = 2X\) (so stay), and seeing the minimum implies switch. This breaks symmetry: \(\Delta > 0\) for bounded \(F\) (e.g., uniform on \([1,10]\), seeing \(a=1\) or \(a>10\)). Her point that peeking carries information at edges is valid.

  **(4) Ben: Partially mistaken (overgeneralizes).**  
  Ben is right that for a *fixed pair* \(\{x, 2x\}\), no \(s(a)\) can exceed 50% success if \(a\) alone is used without distributional context. But he errs in claiming this holds universally: with prior knowledge (e.g., bounds) or randomized thresholds (move 5), symmetry *can* be broken. His "no rule" claim is disproven by Ana’s next move.

  **(5) Ana: Clearly right (randomized threshold).**  
  Ana’s randomized threshold \(T\) (e.g., \(T = e^Z\), \(Z \sim \mathcal{N}(0,\sigma^2)\)) yields \(\Delta > 0\) for any proper \(F\). Switching when \(a < T\) exploits the fact that \(F\) is increasing: for any pair \(\{L, H=2L\}\), \(P(\text{end with } H) = \frac{1}{2} + \frac{F(H) - F(L)}{2} > \frac{1}{2}\). Her math is correct, and this refutes Ben’s move 4.

  **(6) Ben: Partially right (asymptotic) but misses the point.**  
  Ben is right that for fixed \(s\) (e.g., a fixed \(F_T\)), \(\Delta / E[X]\) vanishes as \(X\) grows if \(F\) has wide tails (since \(F(2x) - F(x) \to 0\)). But \(\Delta > 0\) always holds for Ana’s rule, however small. His claim that unbounded ignorance reduces \(\Delta\) to zero is incorrect—it merely makes \(\Delta\) *relatively* small. His critique of move 1 is valid, but move 5’s \(\Delta > 0\) stands.

  ### What both of them are missing
  Ana and Ben overlook three key aspects:  
  1. **The zero-sum nature**: The envelopes are fixed before the switch; any employee gain is a company loss. Thus, \(\Delta > 0\) implies a real cost.  
  2. **The role of \(F\)’s support**: If \(F\) has bounded support, \(\Delta\) can be large (e.g., 10% of \(E[X]\) for uniform \(X\) on \([1,100]\)). For unbounded \(F\), \(\Delta > 0\) but \(\Delta / E[X]\) can be made arbitrarily small by choosing heavy-tailed \(F\) (e.g., log-normal with high \(\sigma\)).  
  3. **Employee priors**: Employees may bring external knowledge (e.g., typical bonus sizes), which could amplify \(\Delta\). Conversely, if \(F\) is unknown, employees cannot optimize \(s\), but Ana’s randomized threshold still guarantees \(\Delta > 0\).  
  Additionally, Ben underweights that absolute \(\Delta > 0\) matters for cost, even if small per dollar. Ana misses that her move 5 edge shrinks with distributional spread, making \(F\) a critical lever.

  ### What I should tell HR
  The peek-and-switch option **does cost the company in expectation**, but the cost is controllable through design:  
  - **Key factors**:  
    - **Distribution choice**: Use an unbounded, heavy-tailed distribution (e.g., log-normal with high variance) to minimize the cost *relative to the bonus size*. Bounded distributions (e.g., uniform) or revealing a ceiling significantly increase cost.  
    - **Peek allowance**: Peeking enables gains via smart switching rules, so disallowing it would eliminate cost but likely reduce engagement.  
    - **Amount selection**: The specific amounts drawn don’t matter; only \(F\) (the distribution of the smaller amount) affects expected cost.  
  - **Recommendation**:  
    Allow the peek-and-switch scheme. To mitigate cost:  
    1. **Do not reveal any bounds** (especially not a maximum).  
    2. **Draw the smaller amount \(X\) from a log-normal distribution** with large standard deviation (e.g., \(\sigma > 3\) on log scale). This caps the cost at \(<\)1% of the expected bonus.  
    3. Accept a small nonzero cost as a tradeoff for employee experience—the option is exploitable in theory but cheap in practice with prudent \(F\).  

  **Bottom line**: With an unbounded, dispersed \(F\), the cost is positive but negligible; HR should implement the scheme as proposed, using a log-normal \(X\) with high \(\sigma\).
