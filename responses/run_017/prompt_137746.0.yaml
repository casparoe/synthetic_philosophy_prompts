  - **Probability derivation for the fourth procedure**:  
    The chord length exceeds \( \sqrt{3} \) if the distance \( d \) from the center to the chord is less than \( 1/2 \). For a point \( P \) chosen uniformly in the unit disc and a direction \( \theta \) chosen uniformly in \( [0, 2\pi) \), we set \( P \) at \( (r, 0) \) by rotational symmetry. The distance is \( d = r |\sin \theta| \). The joint density for \( r \) (with marginal density \( 2r \)) and \( \theta \) (uniform) is \( \frac{r}{\pi}  dr  d\theta \) for \( r \in [0,1] \), \( \theta \in [0, 2\pi) \). The probability is:  
