answer: |-
  ### Brainstorming: Strongest Objections
  1. **Archival Construction:** The archive itself is a product of power relations and epistemic conventions; what "counts" as defeating evidence is socially determined, making constraint illusory.  
  2. **Cognitive Primacy of Narrative:** Historical understanding resides in emplotment (e.g., tragic, comic frameworks), which synthesizes facts but is never dictated by them. Evidence cannot adjudicate between competing narrative structures.  
  3. **Underdetermination:** Even dramatic discoveries merely rearrange facts within pre-existing narrative paradigms; the "abandoned" emplotment could persist through reinterpretation.  

  ---

  ### Argument: The Anchoring Question  
  The standard critique of Ranke’s "wie es eigentlich gewesen" as naive objectivism misunderstands its purpose. Ranke was not denying the *necessity* of selection or narrative construction but opposing the *subordination* of history to teleological schemes (e.g., Hegelian progress). His demand was methodological: let sources disrupt preconceived categories. Carr and White rightly exposed the inescapability of constructivism—historians select facts and impose narrative shapes—but this does not refute Ranke’s core imperative. The true divide lies in the **anchoring question**: does archival evidence constrain only individual statements, or also the narrative whole? I argue for the latter.  

  #### Internal Argument (Granting Constructivism)  
  Assume that (1) fact-selection reflects values and (2) no evidence "dictates" a plot. Yet archives still exert *negative constraint*: they can falsify entire narrative structures. Consider the **Donation of Constantine**. For centuries, medieval historians emplotted papal supremacy as a continuous inheritance from Emperor Constantine’s supposed 4th-century grant of temporal power. This was not merely a "fact" but a *narrative foundation* legitimizing the Church’s political authority. When Lorenzo Valla proved the Donation a 8th-century forgery (1440), the narrative collapsed. The discovery did not just correct a detail; it made the *entire storyline* of divinely ordained papal dominion untenable. This was evidential, not fashionable: subsequent historians (e.g., Protestant reformers) could not coherently maintain the old plot without ignoring the evidence.  

  #### Answering Objections  
  1. **"The Archive is Conventional"**:  
     Granted, archival preservation reflects power (e.g., colonial states silencing subaltern voices). Yet conventions create *shared rules of engagement*. Within a given epistemic framework (e.g., philology in Valla’s era), evidence operates as a constraint. The Donation’s Latin anachronisms violated contemporary standards of textual authenticity. To dismiss this as "conventional" misses that conventions *enable* evidence to function as an anchor—without them, historical inquiry dissolves into arbitrariness.  

  2. **"Narrative Shape is Never Settled by Evidence"**:  
     While narrative *meaning* exceeds factual summation, its *validity* depends on evidentiary compatibility. The Donation forgery did not preclude new narratives (e.g., papal cunning), but it *excluded* narratives relying on Constantine’s legitimacy. Shape is not "dictated," but it is *bounded*: evidence renders certain plots indefensible within a community of practice.  

  ---

  ### Failure Condition  
  My argument fails **if archives can only ever falsify discrete propositions while narrative structures evolve solely through extraneous (e.g., ideological) pressures, never evidentiary confrontation**.
