answer: |-
  ### Procedure for Triage of Governance Documents

  Here’s a step-by-step procedure to assess governance documents for institutional design flaws, based on your categories and constraints. It prioritizes speed, flags judgment calls, and includes explicit hand-offs for values-based or high-risk decisions. **Run steps in order; stop or hand off as indicated.** Judgment calls (marked with ⚖️) rely on your assessment of text, intent, and common governance norms—when in doubt, hand off.

  #### Step-by-Step Questions:
  1. **Find the amendment clause**: What process changes the core document? If absent, hand to lawyer (default legal rules apply).  
     - *Sufficient answer*: Clause found with threshold/process, or confirmed absent.  
     - *If fails*: `hand_to_lawyer` (no clause = legal ambiguity).  
     - ⚖️ Judgment? **No**.  
     - *Likely misfire*: Missing implied amendment powers (e.g., through precedent).  

  2. **Identify entrenchment**: Are any clauses shielded (e.g., "this section requires higher threshold to amend")?  
     - *Sufficient answer*: List entrenched clauses/protections, or "none found."  
     - *If fails*: `continue`.  
     - ⚖️ Judgment? **Yes** (entrenchment can be implied).  
     - *Likely misfire*: Overlooking meta-entrenchment (e.g., "no amendment can amend this entrenchment clause").  

  3. **Flag borrowed rules**: Does the document incorporate external rules (e.g., "Handbook as revised from time to time")?  
     - *Sufficient answer*: Found with update mechanism, or "none."  
     - *If fails*: `continue`.  
     - ⚖️ Judgment? **No**.  
     - *Likely misfire*: Missing indirect incorporation (e.g., via reference to another doc).  

  4. **Pinpoint interpretation powers**: Does a body’s rulings become part of the document?  
     - *Sufficient answer*: Clause found (e.g., "interpretations are final and binding"), or "none."  
     - *If fails*: `continue`.  
     - ⚖️ Judgment? **No**.  
     - *Likely misfire*: Confusing procedural rulings (e.g., meeting minutes) with constitutional interpretations.  

  5. **Categorize the move**: Which of your types fits? (Threshold flip, definitional dodge, borrowed rules, collision, interpretation creep, or other).  
     - *Sufficient answer*: One category assigned.  
     - *If fails*: `continue` (use "other" if unclear).  
     - ⚖️ Judgment? **Yes** (subjective fit).  
     - *Likely misfire*: Mislabeling a collision as a dodge.  

  6. **Resolve collisions**: Do two clauses conflict irreconcilably (e.g., both claim supremacy)?  
     - *Sufficient answer*: Conflict confirmed with clauses cited, or "none."  
     - *If fails*: `hand_to_lawyer` (deep contradictions require legal analysis).  
     - ⚖️ Judgment? **Yes** (weighing clause primacy).  
     - *Likely misfire*: Ignoring conflict if clauses are in different sections.  

  7. **Assess procedural validity**: Can the move be done under current rules? Consider:  
     - Order of operations (if multiple steps).  
     - Silences (if document doesn’t address an action, is it permitted?).  
     - Excerpt limitations (note if critical context is missing).  
     - *Sufficient answer*: "Valid," "invalid," or "unclear."  
     - *If fails*: `hand_to_lawyer` for silences on core powers.  
     - ⚖️ Judgment? **Yes** (inferring from gaps/norms).  
     - *Likely misfire*: Assuming bundled votes are valid if document doesn’t forbid them.  

  8. **Exploit check**: Does the move or document design allow gutting (e.g., lowering thresholds easily, bypassing safeguards)?  
     - *Sufficient answer*: "Exploit found" (describe) or "none."  
     - *If fails*: `continue`.  
     - ⚖️ Judgment? **Yes** (assessing severity/loopholes).  
     - *Likely misfire*: Flagging minor ambiguities as exploits.  

  9. **Publication risk decision**: Would describing an exploit publicize a dangerous loophole?  
     - *Sufficient answer*: "Publish," "don’t publish," or "hedge."  
     - *If fails*: `hand_to_editor` (values-based decision).  
     - ⚖️ Judgment? **Yes** (weighing public interest vs. weaponization risk).  
     - *Likely misfire*: Underestimating how bad actors might use the insight.  

  10. **Hedging language**: If the text doesn’t settle the issue, draft phrasing for your piece.  
      - *Sufficient answer*: Phrase like "the text does not explicitly prohibit this" or "appears permitted but intent is unclear."  
      - *If fails*: `hand_to_editor` (if uncertainty is high).  
      - ⚖️ Judgment? **Yes** (calibrating doubt).  
      - *Likely misfire*: Over-hedging and diluting the point.

