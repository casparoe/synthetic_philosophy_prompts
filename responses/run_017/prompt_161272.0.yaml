  ### Worked Examples

  **Case 1**: Foundation charter  
  - *Move*: Council (68%) wants to add emergency powers and reduce amendment-threshold exception in one meeting.  
  - *Steps*:  
    1. Amendment clause found (2/3 for most, 3/4 + membership for itself).  
    2. Entrenchment confirmed (amendment section shielded).  
    3. No borrowed rules.  
    4. No interpretation clause.  
    5. **Threshold flip** (using current power to lower future bars).  
    6. **Collision**: Amending the exception requires 3/4 + membership, but Council lacks this.  
    7. **Invalid**: Bundling both changes doesn’t bypass the entrenchment—the threshold-reduction part fails. Order matters, but the move is simultaneous.  
    8. Exploit: None (entrenchment works as intended).  
    9. Publication risk: Low.  
    10. Hedge: Not needed.  
  - **Verdict**: *Invalid—changing the exception requires 3/4 + membership, which Council lacks.*  
  - **First step that bites**: Step 6 (collision).  
  - **Hedge phrase**: N/A (text clear).  
  - **Signoff**: You (no handoff needed).  
  - **Exploit publication risk**: Low (no loophole created).

  **Case 2**: Co-op house rules  
  - *Move*: Majority wants to ban amplified instruments as a "house practice" (not a rule).  
  - *Steps*:  
    1. Amendment clause found (simple majority).  
    2. Entrenchment: "Quiet enjoyment" clause acts as substantive shield but isn’t procedurally entrenched.  
    3. No borrowed rules.  
    4. No interpretation clause.  
    5. **Definitional dodge** (relabeling a rule as a practice).  
    6. No collision.  
    7. **Unclear**: Document is silent on "practices." If practices aren’t rules, this might be allowed.  
    8. **Exploit found**: Practices could bypass all substantive limits (e.g., banning members without a vote).  
    9. **Publication risk**: Hand to editor (values call: exposing dodge might help co-ops, but could inspire abuse).  
  - **Verdict**: *The ban may circumvent the "quiet enjoyment" shield if practices are unregulated.*  
  - **First step that bites**: Step 7 (procedural validity unclear due to silence).  
  - **Hedge phrase**: "**The text does not define ‘practices,’ leaving it ambiguous if this ban is subject to the rule constraints.**"  
  - **Signoff**: Editor (for exploit publication).  
  - **Exploit publication risk**: Medium (common tactic, but publicizing might normalize it).

  **Case 3**: Mutual-aid network  
  - *Move*: Stewards’ Handbook (incorporated by reference) now lets Stewards define voting membership, and their interpretations are "part of the charter."  
  - *Steps*:  
    1. No explicit amendment clause, but Handbook incorporation + interpretation powers act as de facto amendment.  
    2. No entrenchment.  
    3. **Borrowed rules**: Handbook can be revised unilaterally by Stewards.  
    4. **Interpretation creep**: Stewards’ readings become part of the charter.  
    5. **Borrowed rules + interpretation creep** (Handbook revisions and rulings centralize power).  
    6. No collision.  
    7. **Valid**: The charter explicitly allows this.  
    8. **Exploit found**: Stewards can gut the charter—e.g., redefine membership to entrench control.  
    9. **Publication risk**: Hand to editor (you admire them; exposing this might undermine trust or invite copycat flaws).  
  - **Verdict**: *The design is not cosmetic—it grants Stewards unchecked power to alter core governance.*  
  - **First step that bites**: Step 8 (exploit found).  
  - **Hedge phrase**: "**While adaptive, the structure allows rule changes without membership oversight, centralizing authority.**"  
  - **Signoff**: Editor (for exploit publication).  
  - **Exploit publication risk**: **High** (writing warmly without critique could spread a model vulnerable to authoritarian drift).

