  We are creating a procedure for the journalist to triage governance documents. The procedure must be step-by-step, include decision points, and account for the journalist's constraints.

  The journalist's existing categories:
  (a) threshold flips
  (b) definitional dodges
  (c) borrowed rules
  (d) collisions
  (e) interpretation creep

  We'll incorporate these into the steps.

  The procedure must handle:
  - When only an excerpt is available
  - When the document is silent
  - When the answer depends on the order of votes
  - Be honest about judgment calls

  Also, include a step about the exploit publication risk.

  The procedure in prose:

  1. **Identify Amendment Power**: How does the document allow itself to be changed? Look for the amendment clause. If there isn't one, stop and hand to lawyer (because without an amendment clause, the default legal rules apply and that's complex). If there is one, note the requirements (e.g., majority, supermajority, who votes, notice, etc.). Also note any entrenchment (like certain clauses requiring a higher bar).

  2. **Check for Entrenchment**: Are there any clauses that are entrenched (i.e., they require a higher threshold to amend or cannot be amended)? This includes explicit entrenchment (e.g., "this clause can only be amended by...") and implicit (e.g., "no amendment shall..."). If there is entrenchment, note which clauses and what protection they have.

  3. **Look for Borrowed Rules**: Does the document incorporate any external documents (e.g., a handbook, another set of rules) that can change without going through the amendment process? If so, note what they are and how they are updated.

  4. **Identify Interpretation Clauses**: Is there a clause that says how the document should be interpreted? In particular, does it say that rulings or interpretations by a body become part of the document? If so, note the body and the scope.

  5. **Assess the Move in Question**: Given the move the board is about to make (e.g., changing a rule, adding a rule, reclassifying a rule), determine which of the above mechanisms they are using. Categorize it as one of (a) to (e) or as a new category.

  6. **Check for Collisions**: If the move involves amending a clause that is entrenched, or if the move might violate an entrenched clause, check for conflicts. For example, if one clause says it can only be amended by a 3/4 vote and another amendment clause says it can be amended by 2/3, then a move that uses the 2/3 to amend the 3/4 clause might be a collision.

  7. **Assess Legality Under the Document**: Determine if the move is permitted by the current document. This includes:
     - Is the move being done through the correct amendment process? (e.g., if they are calling it a "clarification" but it's a substantive change, that might be a dodge)
     - Are they meeting the required thresholds and procedures?
     - If they are using a borrowed rule, has the external document been changed appropriately? And does the incorporation allow that change to affect the charter?
     - If they are using an interpretation clause, is the interpretation within the scope of what the clause allows?

  8. **Consider Order of Operations**: If the move involves multiple steps (like changing the amendment rule and then using the new rule), check the order. If the document does not specify an order, then it might be possible to do both at once if the first change is valid and then the second uses the new rule. But if the first change requires a higher threshold than currently available, then doing both at once might be invalid.

  9. **Handle Silences and Excerpts**: If the document is silent on a point, note that the document does not address it. If you only have an excerpt, flag that the excerpt might be missing context. In either case, if the issue is critical (like the amendment power itself is missing) then hand to lawyer. Otherwise, if the silence is on a point that would block the move, then the move might be allowed (unless the document has a catch-all like "any matter not covered requires a supermajority" - but that would be in the document).

  10. **Exploit Check**: Even if the move is legal under the document, does it reveal an exploit? An exploit is a way that the document can be gutted or significantly changed in a way that the original framers might not have intended. For example, if the amendment clause is too easy to change, then it's a threshold flip exploit. Or if the interpretation clause is too broad, that's an interpretation creep exploit. If you find an exploit, then you must decide whether writing about it makes it real (i.e., publicizes a loophole). This is a judgment call for the editor.

  11. **Publication Risk Decision**: If an exploit is found, the journalist must decide whether to publish. The procedure should have a step that says: if an exploit is found, hand to editor with an explanation. The editor will decide whether to publish, and if so, with what hedging.

  12. **Hedging Language**: If at any step the answer is unclear (i.e., the text does not settle the matter), then in the piece, use hedging language such as "the text does not explicitly prohibit this" or "it appears that the move is permitted under a literal reading, but the intent is unclear".

