  **Key for Your Workflow**:  
  - `hand_to_lawyer`: Adds ~1 week (use only for legal voids/collisions).  
  - `hand_to_editor`: Adds ~20 minutes (for values calls like exploit publication).  
  - **Hedging language**: Default to *"the text does not explicitly [prohibit/allow] this"* or *"appears [valid/invalid] but intent is unclear"* when uncertainty is high.  
  - **When to stop**: If any step returns `stop` (e.g., missing amendment clause in Step 1), end triage and hand off.  

  For Case 3, your admiration clashes with the procedure’s finding: the mutual-aid network’s design is **not cosmetic** (Stewards have real, centralized power). To write warmly, focus on their mission but include the hedge phrase to acknowledge structural risks—or pivot to critiquing centralization in participatory groups.
