          So it can happen by chance.

          Therefore, in Activity 2 we might or might not get a reversal. We hope we don't, but we might. We can then discuss: why did it happen? Because of the small sample and the chance imbalance.

      Steps for Activity 2:

        - 5 min: Random assignment to department: each participant rolls a die (even: X, odd: Y) and records.
        - 5 min: Outcome: for each participant, based on their gender and department, they use a die to determine admission:
            - Male in X: if die roll 1-4 -> admit, else reject. (4/6 = 66.7% ~ 2/3)
            - Female in X: if die roll 1-5 -> admit, else reject. (5/6=83.3% ~ 5/6)
            - Male in Y: if die roll 1 -> admit, else reject. (1/6=16.7%)
            - Female in Y: if die roll 1-2 -> admit, else reject. (2/6=33.3%)
          (Note: we are using 6-sided die for simplicity, and these rates are not exactly the same as before but are set so that in each department women have a higher rate.)

          Why not exactly 75% and 100%? Because then we would need a different randomizing device. We are approximating.

        - 5 min: Collect data and fill in a new table.

      Then we compare: did we get a reversal in this run? We might or might not. We then discuss: "Why did the reversal happen in the first run and not in the second? Or did it happen in both? What is the role of the assignment mechanism?"

  **Activity 3: Construction Challenge (15 min)**
     - Participants work in pairs.
     - Each pair is given two sets of within-cell rates:

          Option 1: 
            Group X: 70% success
            Group Y: 30% success

          Option 2:
            Group X: 60% success
            Group Y: 40% success

          So in both groups, option 1 has a higher success rate.

     - They are given blank tables and asked to choose cell sizes (integers) to create an overall reversal: so that option 2 has a higher overall success rate.

          They need to assign:
            Option 1 in X: a successes out of n1X
            Option 1 in Y: b successes out of n1Y
            Option 2 in X: c successes out of n2X
            Option 2 in Y: d successes out of n2Y

          Such that:
            a/n1X = 0.7, b/n1Y = 0.3, c/n2X = 0.6, d/n2Y = 0.4 (approximately, because integers)

          And then overall:
            (a+b) / (n1X+n1Y) < (c+d) / (n2X+n2Y)

     - They also have to do it with the constraint that the cell sizes for option 1 and option 2 in each group are at least 10? But that might be too big. We can allow small numbers.

     - They will discover that to make option 2 look better overall, they need to give option 2 a lot of trials in the group with higher base rates (group X) and option 1 a lot in group Y (with lower base rates).

     - Example solution:

          Option 1:
            X: 7 successes out of 10 -> 70%
            Y: 3 successes out of 10 -> 30% -> total 10/20=50%

          Option 2:
            X: 60 successes out of 100 -> 60%
            Y: 4 successes out of 10 -> 40% -> total 64/110≈58% -> which is higher than 50%.

          But we want option 2 overall to be higher than option 1 overall.

          So they might do:

            Option 1: 
              X: 70 out of 100 -> 70%
              Y: 30 out of 100 -> 30% -> total 100/200=50%

            Option 2:
              X: 6 out of 10 -> 60%
              Y: 4 out of 10 -> 40% -> total 10/20=50% -> not higher.

          To make option 2 higher, they need the denominator for option 2 to be small in the group with lower rate? Actually, they need to have option 2 have a large number of trials in the group where its rate is higher relative to option 1? 

          Let me compute:

            Overall rate option 1 = (0.7 * n1X + 0.3 * n1Y) / (n1X+n1Y)
            Overall rate option 2 = (0.6 * n2X + 0.4 * n2Y) / (n2X+n2Y)

          We want the second to be greater than the first.

          We can set n1X and n1Y arbitrarily, and similarly for n2X and n2Y.

          To make option 2 look better, we can assign:

            Option 1: mostly in Y (low rate) -> set n1Y large, n1X small.
            Option 2: mostly in X (high rate) -> set n2X large, n2Y small.

          Example:

            Option 1: 
              X: 7 out of 10 (70%)
              Y: 30 out of 100 (30%) -> total successes = 37, total n=110 -> 37/110≈33.6%

            Option 2:
              X: 600 out of 1000 (60%)
              Y: 40 out of 100 (40%) -> total=640/1100≈58.2% -> which is greater than 33.6%.

          But these numbers are big. We can use:

            Option 1:
              X: 7/10
              Y: 3/10 -> total 10/20=50%

            Option 2:
              X: 9/15 (60% of 15 is 9) -> 60%
              Y: 2/5 (40% of 5 is 2) -> 40% -> total 11/20=55% -> which is greater than 50%.

          So yes, it is possible with small numbers.

          But note: in group X, option 1 has 70% and option 2 has 60%, so option 1 is better in X.
          In group Y, option 1 has 30% and option 2 has 40%, so option 2 is better in Y? But wait, we wanted option 1 to be better in both groups? 

          In this setup, we have:

            Group X: option 1 (70%) > option 2 (60%)
            Group Y: option 1 (30%) < option 2 (40%) -> so this is not the same as the previous reversals.

          We want option 1 to be better in both groups, but overall option 2 is better.

          So we need:

            Group X: option 1 > option 2 -> 70%>60%, good.
            Group Y: option 1 > option 2 -> 30%>40%? That's not possible.

          We have a mistake: in the instructions, we said option 1 has 30% in Y and option 2 has 40% in Y, so option 2 is better in Y. But we want option 1 to be better in both.

          So let's change the rates for the challenge:

            In both groups, option 1 should have a higher rate than option 2.

            Group X: option 1: 70%, option 2: 60%
            Group Y: option 1: 40%, option 2: 30%

            Now, option 1 is better in both groups.

            Overall for option 1: (0.7 * n1X + 0.4 * n1Y) / (n1X+n1Y)
            Overall for option 2: (0.6 * n2X + 0.3 * n2Y) / (n2X+n2Y)

            We want overall option 2 > option 1.

            How? By having option 1 have many trials in group Y (where its rate is lower) and option 2 have many trials in group X (where its rate is higher).

            Example:

              Option 1: 
                X: 7/10 (70%)
                Y: 40/100 (40%) -> total 47/110≈42.7%

              Option 2:
                X: 600/1000 (60%)
                Y: 3/10 (30%) -> total 603/1010≈59.7% -> which is greater.

            With small numbers:

              Option 1:
                X: 7/10
                Y: 2/5 (40%) -> total 9/15=60%

              Option 2:
                X: 3/5 (60%)
                Y: 3/10 (30%) -> total 6/15=40% -> not greater.

            We need to unbalance the denominators:

              Option 1:
                X: 7/10 (70%)
                Y: 4/10 (40%) -> total 11/20=55%

              Option 2:
                X: 9/10 (90%? but we want 60% -> so 6/10 -> 60%)
                Y: 3/10 (30%) -> total 9/20=45% -> not greater.

            It's hard with small numbers. Let me try:

              Option 1: 
                X: 7/10 = 70%
                Y: 12/30 = 40%  (because 12/30=0.4) -> total successes=19, n=40 -> 47.5%

              Option 2:
                X: 18/30 = 60% 
                Y: 1/10 = 10% -> but we want 30% -> 3/10 -> total=21/40=52.5% -> which is greater than 47.5%.

            So the numbers work.

          So for the challenge, we give them:

            Group X: 
              Option 1: 70% 
              Option 2: 60%
            Group Y:
              Option 1: 40%
              Option 2: 30%

          And they need to choose integers for the number of trials in each cell to make the overall success rate of option 2 greater than option 1.

          They will discover they need to make the number of trials for option 1 in group Y relatively large and for option 2 in group X relatively large.

     - After 10 minutes of trying, we ask a few pairs to share their tables.

  **Activity 4: Role Play (20 min)**
     - We split the room into two roles: quality-control officers and chiefs.
     - We provide them with the table from Activity 1 (the triage one) and a new scenario: 
          - The data we generated in Activity 1 is from last year.
          - The quality-control officers are preparing the annual report: they must describe how the two treatments (or the admission by gender) performed last year.
          - The chiefs are setting the protocol for next year: they must decide, for a given applicant (whose department we will know), which treatment to choose (or whether to admit).

     - We give them 10 minutes in their role groups to prepare their report/decision rule.

          Quality-control officers: they might report the overall success rates or the department-specific ones? We expect they might report the overall and note the apparent advantage for men overall. But they might also break down by department.

          Chiefs: they must set a rule for next year. Since they know the department for each applicant, they might set: 
            - In department X: use the treatment that worked better last year in X (or admit women at a higher rate, but wait: for admission, they might set a threshold?).
            - But note: in our table, in both departments women had a higher success rate. So they might want to admit women at a higher rate in both departments? But then they will admit more women overall.

          However, the apparent overall advantage for men is due to the sorting. The chiefs should condition on department and ignore the aggregate.

     - Then we have a representative from each role present (5 min).

     - Finally, we have the two roles discuss: the quality-control officer says "overall, men had a higher admission rate", and the chief says "but in every department, women did better, so we should admit women at a higher rate in each department".

     - We then have a new set of applicants (say, 5) with known department and we ask the chiefs to apply their rule and the quality-control officers to predict the overall rate for next year.

     - We then reveal that if the chiefs use the department-specific rule, then next year's aggregate might show women having a higher rate overall? Or it might show something else depending on the assignment.

     - To punish the wrong rule: we can have a betting round. We ask: "If you are a chief and you see a woman applicant from department Y, which rule should you use? If you use the aggregate, you would say: since men did better overall, I should be hesitant to admit women. But in department Y, women had a 25% success rate vs men's 0%, so you should not be hesitant. We can create a hypothetical: 
          - Suppose you have 10 women from department Y. If you admit them, how many do you expect to succeed? (2.5 out of 10) 
          - If you reject them, they might go elsewhere? Or we can compare to men from department Y: if you admit men from Y, how many succeed? (0 out of 2 in our example, so 0). 
          - But we don't have the option of admitting men from Y? We have to decide for women in Y: admit or reject. Based on the aggregate, you might think women overall have a 40% success rate, so you might admit. But if you use the cell, you see 25% and you might be more hesitant? 

     - This is getting messy.

     - Instead, we can have a simple rule: the chiefs must decide for each type of applicant (defined by department and gender) whether to admit or not. The quality-control officers are only reporting on the past.

     - Then we ask: what is the best decision rule for the chiefs? They should look at the department and gender? In our table, in department X, women had 100% and men 75%, so they might admit everyone in X and then in Y, women had 25% and men 0%, so they might admit only women in Y? But then they admit all women and only men in X? 

     - We want them to see that the aggregate is not relevant for an individual's decision. The chief should condition on department. And within a department, they should use the department-gender rates? But the sample sizes are small.

     - To punish the aggregate rule: we have a new applicant who is in department X and female. 
          - Aggregate rule: overall women had 40% success, men 60%. So if the chief is using aggregate, they might be more likely to admit men? But this woman is in department X, where women had 100% success.
          - If they admit her, they are very likely to have a success.
          - If they use the aggregate, they might reject her and lose a sure success.

     - We can score: if they admit her, they get a point (because she would have been a success). If they reject, they get nothing. 

     - How to do it without money? We can use points: each chief who would admit her gets 1 point; those who would not, get 0. And then we reveal that she would have succeeded.

     - But we need to do it quickly.

     - We can do a quick vote: "If you were the chief and you had to decide for a woman in department X, would you admit her?" Then we reveal the outcome: she would have succeeded. Those who admitted get 1 point.

     - Similarly for a man in department Y: using the aggregate, they might admit because men do well overall, but in department Y, men had 0% success. So if they admit, they get 0 points (because it fails), if they reject, they avoid a failure, but we don't reward. We can say: if you admit and it fails, you lose a point; if you reject, you get 0. But then we need to simulate outcomes.

     - Given time, we might skip the simulation and just state the expected outcome.

     - We can have two hypothetical applicants:

          Applicant 1: woman in department X.
          Applicant 2: man in department Y.

          For each, the participants (playing chiefs) must write on a card: admit or reject.

          Then we score:

            For applicant 1: admit -> 1 point, reject -> 0.
            For applicant 2: admit -> 0 points, reject -> 1 point.

          Because in the historical data, women in X always succeeded and men in Y never did.

     - This way, if they use the aggregate (which suggests men are better overall), they might be tempted to reject the woman in X and admit the man in Y, which would give them 0 points. If they use the department-specific rates, they admit the woman in X and reject the man in Y, and get 2 points.

     - So we award points accordingly.

  **Debrief (15 min)**
     - Reveal the name: Simpson's paradox.
     - Map to the three points:

          1. Arithmetic fact about weights: 
              - We saw it in Activity 3: to get the reversal, we needed lopsided denominators.
              - In Activity 1, the denominators were lopsided because of the triage.

          2. No conflict between cells and aggregate for decision-making:
              - Activity 4: the quality-control officer reports the overall and disaggregated, but the chief should use the disaggregated for decisions because the aggregate is a weighted average with weights determined by the assignment process.

          3. Causal order: 
              - In Activity 1 and 2, we saw that the assignment mechanism (triage vs random) mattered. 
              - We also want to show that if we condition on a mediator, it can be bad. We haven't done that yet.

     - For the third point, we haven't staged the mirror-image case. We will have to state it.

     We can add a quick example in the debrief:

          "Imagine we are studying the effect of a drug on a disease. The drug might cause a change in blood pressure, and we condition on blood pressure. But blood pressure is a mediator (affected by the drug and affecting the outcome). By conditioning on it, we might get a reversal that is misleading. This is the mirror image: in this case, we should not condition."

     - Also, we can note: in Activity 2, with randomization, we broke the dependence between gender and department, so the reversal should not happen in expectation. But in a finite sample, it might. That's why we do statistical tests.

     - And point out: the colleague is right that in the population with randomization, the reversal is impossible. But in any finite sample, it is possible by chance.

  **Predictable Problems:**

    1. **Half the room with no statistics:** 
        - We use concrete materials and step-by-step instructions. We also have them work in pairs for Activity 3 and roles for Activity 4 to ensure everyone is engaged.

    2. **Someone spots the mechanism early:**
        - If someone says "Simpson's paradox" early, we can say: "Yes, that's a term for it, but let's try to understand why it happens without the label." And then continue. We can also ask them to keep it to themselves.

    3. **Tables too small for reversal to be visible:**
        - In Activity 1, we use fixed envelopes to ensure the reversal happens. In Activity 2, it might or might not, but that's a teaching moment. In Activity 3, we provide the rates and let them use any integers, so they can choose sizes that work.

  **What would change my mind about the design?**
    - If it turns out that the role play (Activity 4) is too verbal and students talk past each other, we might replace it with a more structured decision task (like the betting round) for the chiefs only.
    - If the causal point (third takeaway) cannot be adequately conveyed by the activities and the debrief, we might need a separate activity. But given time, we might be content with stating it.
    - If the point about randomization is too subtle (finite sample vs population), we might add a discussion after Activity 2: "If we did this randomization 100 times, would we expect the reversal to happen often? Why or why not?"

  **Final Timeline:**

    - 0-5 min: Introduction
    - 5-25 min: Activity 1 (Triage)
    - 25-40 min: Activity 2 (Randomization)
    - 40-55 min: Activity 3 (Construction Challenge)
    - 55-75 min: Activity 4 (Role Play and Decision)
    - 75-90 min: Debrief and Synthesis

  Let's write the debrief explicitly.

  **Debrief Script:**

    - "Today we encountered a phenomenon that you might have heard of: Simpson's paradox. It's when a trend appears in several groups but disappears or reverses when the groups are combined. We saw this in the triage data: in each department, women had a higher admission rate, but overall men had a higher rate. Why did this happen? 

      1. **Arithmetic fact about weights:** In the construction challenge, you saw that to make the overall rate flip, you needed lopsided denominators. In the triage activity, the assignment process created those lopsided denominators: most women were in the department with a lower admission rate (department Y), and most men in the department with a higher admission rate (department X).

      2. **No real conflict for decision-makers:** In the role play, the quality-control officer might report the overall rate, but the chief, when setting the protocol for an individual applicant, should not use the overall rate. Why? Because the overall rate is a weighted average where the weights (the number of applicants in each department) are fixed by the assignment process. The chief's decision for an individual depends on which department that applicant is in. In fact, if the chief had used the overall rate to decide, they would have made suboptimal decisions, as we saw in the decision exercise.

      3. **Causal order:** The decision to condition on the department should depend on the causal structure. In our triage example, department assignment was a result of the referral process (which might depend on severity) and it might be a confounder. But imagine a different scenario: suppose the department assignment is a consequence of the treatment? For example, if we are studying a drug and we condition on a side effect that the drug causes. In that case, conditioning might introduce a bias. This is the mirror image: sometimes you shouldn't condition. Unfortunately, we didn't have time to stage that today, but it's an important caution.

      Also, note: when we randomized the assignment to department, the association between gender and department was broken. In the population, this would prevent the reversal. But in our small sample, we might still see a reversal by chance. That's why we do statistics: to see if the observed reversal is likely due to chance or not."

  **Which takeaway cannot be produced by the activity?**
    - The third point (causal order and the mirror image) is not staged in the activities. We will have to state it in the debrief.

  This design covers the first two takeaways with the activities and the third with a statement. We hope that the activities provide a foundation for understanding the third point.

  Now, let's package the design.
answer: |-
  ### Session Design: The Weighted Averages Puzzle  
  **Goal:** Explore how aggregate data can mislead by creating a reversal paradox, emphasizing arithmetic structure, decision relevance, and causal context without naming Simpson's paradox until the end.  

  ---

  #### **Materials**  
  - **Per Participant:** 2 index cards (green for "admit", red for "reject"), 1 die, 1 envelope.  
  - **Per Group (Activity 3):** Printed worksheet with fixed success rates (e.g., Option A: 70% in Group X, 40% in Group Y; Option B: 60% in Group X, 30% in Group Y), blank 2x2 tables.  
  - **Instructor:** Master board to aggregate data, role cards ("Quality-Control Officer", "Chief"), 10 chocolate bars (for scoring).  
  - **Setup:** Pre-filled envelopes for triage (Activity 1):  
    - Male: 8 "X", 2 "Y" assignments.  
    - Female: 2 "X", 8 "Y" assignments.  
    - Outcome cards by group/gender: Male/X (6 admit, 2 reject), Female/X (2 admit), Male/Y (2 reject), Female/Y (2 admit, 6 reject).  

  ---

  #### **Timeline (90 Minutes)**  
  **0–5 min: Introduction**  
  - *Setup:* "We're hospital administrators reviewing two treatments (A/B) across departments (X/Y). Your task: uncover patterns in the data."  
  - *Rules:* "No laptops. Use cards/dice. Points for accurate predictions or decisions feed into a team competition (prize: chocolate)."  

  **5–25 min: Activity 1 – Triage Data Generation**  
  - **Step 1 (Assign):** Assign each participant a gender (10M, 10F). Each draws a department (X/Y) from their gender-specific envelope.  
  - **Step 2 (Outcome):** Each draws an outcome card (admit/reject) from the envelope matching their gender/department.  
  - **Step 3 (Aggregate):** Instructor compiles results on the master board:  
    - *Example:*  
      |          | Dept X | Dept Y | Overall |  
      |----------|--------|--------|---------|  
      | **Male** | 6/8    | 0/2    | 6/10    |  
      | **Female**| 2/2    | 2/8    | 4/10    |  
  - **Key Q:** "Which gender did better *in each department*? Which did better *overall*? Why the reversal?"  
  - *Scoring:* Teams (pre-assigned) earn 1 pt if they predict the reversal pre-reveal.  

  **25–40 min: Activity 2 – Randomized Data Generation**  
  - **Step 1 (Assign):** Same participants reroll dice: even → Dept X, odd → Dept Y.  
  - **Step 2 (Outcome):** Roll die for outcome:  
    - Male/X: 1-4 admit, else reject (≈67%).  
    - Female/X: 1-5 admit (≈83%).  
    - Male/Y: 1 admit (≈17%).  
    - Female/Y: 1-2 admit (≈33%).  
  - **Step 3 (Aggregate):** Post results.  
  - **Key Q:** "Did the reversal happen this time? Why/why not?"  
  - *Scoring:* 1 pt per team if they predict "no reversal" (most will, but small samples may cause one—use as teachable moment).  

  **40–55 min: Activity 3 – Construction Challenge**  
  - **Task:** Pairs build tables with fixed success rates (both groups favor Option A) but make Option B *win overall* by choosing cell sizes.  
    - *Example rates:* Option A: X=70%, Y=40%; Option B: X=60%, Y=30%.  
    - *Solution requires:* Large A in low-rate group (Y), large B in high-rate group (X).  
  - **Key Q:** "What cell-size patterns force a reversal? Try balanced sizes first—does it work?"  
  - *Scoring:* 2 pts per pair that creates reversal; 1 pt for closest attempt.  

  **55–75 min: Activity 4 – Role Play: Annual Report vs. Protocol**  
  - **Split Roles:** Half are "Quality-Control Officers" (report on past year), half are "Chiefs" (set next year’s rules). Use Activity 1’s data.  
  - **Officers:** "Write a report: did men or women fare better overall?"  
  - **Chiefs:** "Set admission rules: will you use overall or department rates?"  
  - **Confrontation:** Representatives debate. Then, decision test:  
    - *Scenario:* "A woman in Dept X and a man in Dept Y apply. Admit/reject?"  
    - *Scoring (punishes wrong rule):*  
      - Correct (admit woman/X, reject man/Y): 2 pts.  
      - Incorrect (reject woman/X or admit man/Y): 0 pts.  
    - *Reveal:* Woman/X always succeeds; man/Y always fails.  

  **75–90 min: Debrief & Synthesis**  
  - **Reveal:** "This is Simpson’s paradox—but labels shouldn’t replace thinking."  
  - **Map to Takeaways:**  
    1. *Arithmetic weights:* "Activity 3 proved reversals need lopsided denominators. Balanced sizes? No reversal."  
    2. *Decision relevance:* "Activity 4 showed aggregate weights reflect the *sorting process* (triage). Chiefs must ignore them for individual decisions—or lose points."  
    3. *Causal order:* "Randomization (Activity 2) broke sorting, so reversal vanished (*in expectation*). But conditioning isn’t always right—e.g., if we partitioned by a mediator (like a treatment side effect), disaggregating misleads. *This we didn’t stage—I’ll state it.*"  
  - **Caveat:** "Reversal is *possible* under randomization in small samples (Activity 2 blip)—hence inferential statistics."  
  - **Prize:** Top team gets chocolate.  

  ---

  #### **Predictable Problems & Solutions**  
  - **No-Statistics Half Lost?**  
    - *Problem:* Confusion during data generation.  
    - *Fix:* Pair mixed-background students; use physical tokens (cards/dice) for tangibility.  
  - **Early Spoiler?**  
    - *Problem:* Someone recognizes the paradox.  
    - *Fix:* "Ah, you’ve seen this! Help others *discover* why it happens—don’t name it yet."  
  - **Small Tables Mask Reversal?**  
    - *Problem:* Low power in randomized activity.  
    - *Fix:* Use pre-set envelopes in Activity 1 to guarantee reversal; in Activity 2, highlight if chance causes reversal: "Finite samples mimic real-world uncertainty!"  

  ---

  #### **What Would Change My Mind?**  
  - **If the role-play feels "fake":** If students reject the Chief/Officer conflict as artificial ("Why wouldn’t both use disaggregated data?"), it may over-simplify institutional inertia. *Fix:* Replace with a "Policy Bet" where students wager points on which metric (aggregate vs. conditional) minimizes errors in simulated decisions.  
  - **If Takeaway 3 is flawed:** If causal order is deemed *reducible* to the table (e.g., "lopsided weights imply confounding"), the mirror-image case (conditioning on mediators) becomes murky. *Counter:* Stress that identical tables can demand opposite actions—e.g., in a drug trial, conditioning on a post-treatment variable (blood pressure) *creates* bias.  
  - **If randomization point misleads:** If students conclude "randomization prevents reversal" (ignoring sampling variation), emphasize Activity 2’s dice rolls: "Reversal *can* happen by chance—so we test hypotheses, not just eyeball."  

  This design forces confrontation with weights, decisions, and causality while punishing aggregate-driven choices. The third takeaway requires instructor input, but Activities 1–4 lay the groundwork.
