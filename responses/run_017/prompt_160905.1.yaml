  But note: we want to punish the wrong rule. In Activity 4, the "wrong rule" would be applying the aggregate to an individual without considering the cell. We can set up a betting round: after the two roles present, we ask each participant to decide for a hypothetical individual (with known cell) which option is better. If they choose based on the aggregate and it turns out to be the worse option for that cell, they lose points. This happens after they see the table.

  Alternatively, we can have a round of actual decisions: we have a set of new cases (with known cell) and each participant must choose an option for each case. Then we simulate outcomes and award points based on success. This might take too long.

