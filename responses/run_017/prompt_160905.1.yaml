  We are designing a 90-minute session on Simpson's paradox for graduate students with mixed statistics backgrounds. The goal is to have participants discover three key insights without hearing the term "Simpson's paradox" until the end. The three takeaways are:

  1. The reversal is an arithmetic fact about weights: it can only happen when cell sizes are lopsided relative to within-cell margins.
  2. There is no real conflict between the disaggregated (cell-level) and aggregated views because the aggregate is a weighted average with weights fixed by the sorting process. The decision for an individual should not be governed by the aggregate weights.
  3. Whether to condition on a variable is settled by its causal role (e.g., whether it is a confounder or a mediator) and not by the table alone. There is a mirror-image case (conditioning on a mediator) that leads to error.

  The design must avoid real money, use physical materials (paper, cards, dice), and involve active participation. We also have to address the point that randomization (as a foil) eliminates the reversal in the population but not necessarily in a sample.

  We have some fragments: a data-generation round with triage (creating lopsided sorting) and then randomization (where reversal should vanish in expectation, but might appear in a small sample), a construction round where pairs try to create a reversal and discover the need for lopsided denominators, and a role split between a quality-control officer and a chief to highlight the two different uses of the same table.

  Let's design the session step by step.

  ### Session Design

  **Title:** The Case of the Confusing Comparisons (to be revealed as Simpson's paradox at the end)

  **Overall Structure:**
  1. **Introduction (5 minutes):** Set the stage without giving away the phenomenon.
  2. **Activity 1: Data Generation with Triage (20 minutes):** Generate data with a non-random assignment (triage) to create a Simpson reversal.
  3. **Activity 2: Data Generation with Randomization (15 minutes):** Generate data with random assignment to see the reversal disappear (in expectation, but we might see a small sample effect).
  4. **Activity 3: Construction Challenge (15 minutes):** Pairs try to create a reversal with given within-cell rates and discover the need for lopsided cell sizes.
  5. **Activity 4: Role Play - The Annual Report and the Protocol (20 minutes):** Split into two roles to discuss the same table from different perspectives.
  6. **Debrief and Synthesis (15 minutes):** Reveal the name, map the activities to the three points, and discuss causal structure.

  **Materials:**
  - For each participant: index cards (two colors: one for the triage/referral decision, one for the outcome), envelopes (to represent departments or groups), dice (for randomization and outcome generation), printed tables (blank and then filled).
  - For the instructor: a master table on a board or poster paper to aggregate results.
  - Handouts for the construction challenge (with fixed within-cell success rates and blank for cell sizes).
  - Role cards for Activity 4.

  **Payoff/Scoring:** 
  We'll use points that feed into a team competition. Points are awarded for:
  - Correct predictions in Activity 1 and 2 (if they predict the aggregate outcome correctly, they get points; but note we want the reversal to happen so it's tricky).
  - Successfully constructing a reversal in Activity 3 (each pair that does it gets points, but note: we want them to discover that it requires lopsided sizes, so we might award points for any pair that achieves the reversal and then discuss how they did it).
