prompt: |-
  I co-run a small film society and spend a lot of time recommending books to friends, and I keep running into the same odd thing about what happens when I take someone else's word for whether a work is good. I dont have a word for it, so let me just describe it.

  1. There's a critic I've calibrated against over about ten years. When he says a film is a masterpiece I believe him fully, and I'll put it on my own top-ten list without having seen it. But if someone asks me at the pub "is it actually good?" I hear myself saying "it's meant to be extraordinary" rather than "it's extraordinary", and if they push me for what's good about it I've got nothing except his phrases, which I can repeat but which don't feel like mine. None of this happens with ordinary deference: my mechanic says the alternator is shot, I believe him, and I'll say flatly to anyone that the alternator is shot.

  2. Reverse direction. On his recommendation I watch the film and find it dull. I don't much revise my view of the critic, but I also don't feel I was wrong, exactly — I feel I was never really in a position to hold the view. "I hadn't actually seen it" comes out as if it settles the matter. And when a film I judged for myself and loved gets savaged everywhere, I don't budge at all and feel entirely entitled not to.

  3. The belief doesn't seem to do anything. I don't rewatch it, don't press it on people, don't get that odd sting when someone mocks it — all of which I do with things I judged myself. It's as if it's a belief only in the "what will I say if asked" sense.

  So: is there an established name for this? Deferred conviction about a work's value that you genuinely have, but that behaves differently from a conviction you arrived at yourself in three ways — what it licenses you to assert, what it moves you to do, and how it handles being contradicted.

  Some things I've half-heard of that might be near it, so you can tell me which (if any) it really is: there's the general scepticism about judging art you haven't experienced first-hand, but that seems to be about *whether* you can end up with the belief, and I clearly do end up with it. There's the point that second-hand information can give you the fact without giving you the explanation, but that doesn't feel like my case either — I can recite his reasons perfectly well, and it still feels hollow. Maybe it's just low confidence wearing a costume. Maybe it's about a skill of appreciation rather than a belief. Maybe it's four separate things bundled together and I should stop treating them as one.

  I'm not after a label to drop. I want to know what the thing is, what it isn't, and where its edges are: does it show up outside the arts (wine, food, whether a joke is funny, moral or political judgement, factual expertise)? Does it happen as strongly with negative verdicts as with positive ones? Does it matter whether the source is a person whose taste I've calibrated against or an anonymous pile of star ratings?

  Finish with (a) a table with columns: candidate concept | what that concept is really about | where my thing fits it | where it doesn't | verdict, with one row per candidate and verdict being best fit / partial fit / doesn't fit, and (b) a JSON object with exactly these keys: "phenomenon_name" (string — the established term, or your proposed term if there isn't one), "definition" (one sentence, in your own words), "components" (array of strings, the separable bits of what I described — one per bit), "best_existing_fit" (string), "how_my_case_differs" (string), "boundary_cases" (array of objects with keys "case", "falls_under" (yes / no / unclear) and "why" (one sentence each)), "confidence" (integer 0-100 in your overall verdict).
reasoning: |-
  Hmm, the user runs a film society and is grappling with this interesting phenomenon where they fully believe a trusted critic's judgment about a film being a masterpiece, but that belief doesn't feel like their own. They've described three key aspects: how they express the belief differently ("it's meant to be extraordinary" vs "it's extraordinary"), how they respond when their experience contradicts the critic (not feeling wrong but rather like they never held the view), and how the belief doesn't motivate any action like rewatching or recommending.

  I need to analyze this carefully. The user mentions several concepts that might relate: skepticism about judging art without firsthand experience (but they clearly form the belief), the idea that second-hand information lacks explanations (but they can recite the critic's reasons), low confidence, appreciation skills, or perhaps these are separate phenomena bundled together.

  Let me break this down systematically. What they're describing seems to be a complex blend of epistemological, psychological, and aesthetic elements. The core appears to be about holding a belief about aesthetic value that's based entirely on testimony rather than personal experience, and how this differs from internally generated beliefs.

  Looking at psychological concepts, there's credence versus belief - where credence is a weaker form of acceptance. That seems relevant. Also "alief" as automatic belief-like responses, but that might not fit perfectly. Epistemically, testimony-based knowledge often lacks the justification that personal experience provides. For aesthetic judgments specifically, there's the philosophical idea that they require firsthand experience to be meaningful.

  I think the strongest fit is the distinction between testimonial belief and judgmental belief. Testimonial belief is accepting something based on authority, while judgmental belief comes from personal evaluation. This explains why their belief about the film feels hollow - they have the propositional content but lack the phenomenal experience that grounds aesthetic appreciation.

  For the table they requested, I'll evaluate several candidate concepts:
  - Testimonial Belief vs. Judgmental Belief
  - Credence
  - Alief
  - Aesthetic Necessity of Firsthand Experience
  - Deference in Expertise
  - Low Confidence

  Each will get analyzed for fit with their description. The testimonial/judgmental distinction seems the closest match.

  For the JSON summary, I'll propose "Testimonial Aesthetic Credence" as a term, define it clearly, and break down the components they described. I'll also explore boundary cases like food, jokes, political views, and anonymous ratings to show where this phenomenon applies and where it doesn't. Their observation seems strongest for experiential domains like art, food, humor, and less so for factual expertise or moral judgments. Negative verdicts might function similarly but with different emotional weight. And calibrated critics matter more than anonymous ratings because trust is key.

  My confidence in this analysis is high - around 90 - since it neatly explains all the quirks they described while acknowledging what it doesn't cover, like the emotional detachment aspect which might be separate.
answer: |-
  Based on your description, you've identified a nuanced phenomenon at the intersection of epistemology, aesthetics, and psychology. While no single established term perfectly captures *all* aspects you describe, **"Testimonial Belief" vs. "Judgmental Belief"** (grounded in epistemology & aesthetics) is the closest fit. Below is the analysis, followed by the table and JSON summary.

  **Core Phenomenon:** You hold a genuine *belief* about a work's value based solely on trusted testimony ("Testimonial Belief"), but this belief lacks the psychological force, motivational power, and assertoric confidence of a belief formed through direct personal experience and evaluation ("Judgmental Belief"). The key difference lies in the *source of justification*: testimony provides propositional knowledge ("X is good"), but aesthetic judgment requires phenomenal experience ("I experienced X as good").

  **Analysis & Table:**

  | Candidate Concept          | What it's really about                                                                 | Where your thing fits                                                                                                | Where it doesn't                                                                                             | Verdict       |
  | :------------------------- | :------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------- | :------------ |
  | **Testimonial Belief**     | Belief formed solely on another's testimony; common in epistemology.                   | Explains why you hold the belief without direct experience, assert it cautiously ("meant to be"), and feel no sting when contradicted (it's not *your* judgment). | Doesn't fully capture the *motivational* gap (not rewatching/pressing) or the "never held the view" feeling when contradicted. | **Best Fit**  |
  | **Credence**               | Degree of confidence in a belief (e.g., "70% sure"). Often probabilistic.              | Fits the weaker assertoric force ("meant to be" vs. "is") and lack of action. Your testimonial belief has high credence but low psychological weight. | Doesn't explain why contradiction feels like "never holding the view" or the hollowness despite verbal fluency. | Partial Fit   |
  | **Alief** (Gendler)        | Automatic, belief-like attitude divorced from explicit belief (e.g., fear on a glass bridge). | Might explain the lack of motivational/emotional response (not rewatching, no sting).                                | Doesn't fit: You hold a *considered, calibrated explicit belief*, not an automatic gut reaction conflicting with it. | Doesn't Fit   |
  | **Aesthetic Necessity of Firsthand Experience** | Philosophical view that genuine aesthetic judgment *requires* direct sensory/emotional engagement. | Explains the hollowness, lack of personal ownership, and why contradiction feels like "never holding the view" – you lacked the necessary experiential basis. | Doesn't fully explain why you *do* confidently hold the *belief* based on testimony alone. | Partial Fit   |
  | **Deference in Expertise** | Relying on an expert's judgment in domains requiring specialized knowledge (e.g., mechanic). | Explains why you trust the critic and form the belief.                                                                | **Fails critically:** Explains formation but *not* the behavioral/assertoric differences vs. domains like car repair, where testimony *feels* like full belief. | Doesn't Fit   |
  | **Low Confidence**         | Simple lack of certainty in one's belief.                                              | Fits cautious assertion ("meant to be").                                                                             | Doesn't fit: You *are* confident in the *truth* of the critic's claim ("I believe him fully"), just not in *your ownership* of the judgment. | Doesn't Fit   |

  **JSON Summary:**

