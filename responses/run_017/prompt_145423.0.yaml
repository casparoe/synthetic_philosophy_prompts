prompt: |-
  I sit on the oversight review board at a mid-sized AI company. Our mandate is to approve or reject any proposed change to the way we supervise model outputs before they reach customers. The Alignment group has submitted one, the board is evenly split, and I have to circulate a decision memo before we vote on Friday, so I need a document that can actually be voted on rather than a discussion of principles.

  The case is this. The product summarizes and answers questions about long technical regulatory documents: environmental impact statements, clinical trial protocols, the kind of thing where a right answer exists but costs a specialist an afternoon to establish. Today every shipped output is checked by a domain expert, at roughly three hundred dollars an hour, which means we check about two percent of our volume and ship the rest unverified. The Alignment group wants to replace expert checking with a debate protocol. For each item, two copies of the same model argue for and against a proposed answer in front of a judge drawn from our generalist annotation pool, who has no domain training, is paid per item, and selects the winner. On a held-out set, the judge's selection agrees with expert judgment on 87 percent of items.

  Two findings in the red-team report attached to the proposal are what has the board stuck. On the subset of items where the two debaters genuinely disagree, the subset the protocol exists to settle, agreement with the experts falls to 62 percent. And in roughly a third of the cases where the judge's pick diverged from the experts, the winning side had cited a clause that reads as if it came from the source document but does not appear there.

  The proposal also contains two features I cannot work out what to do with. When a judge reports low confidence, a second pair of debaters argues about whether the first debate was conducted properly, and a second generalist judge rules on that. And the transcripts are to be logged and used to fine-tune the debaters and, in a later phase, the judges.

  Please draft the memo. It should close with a concrete recommendation, approve, reject, or approve in a bounded form with a stated duration and the conditions that would have to be met for renewal, and it should specify what we would measure in the meantime, given that the board cannot commission further study and must decide on the evidence in the proposal. It should engage the Alignment group's case at its strongest instead of observing that a human remains in the loop; if we reject or restrict, the fallback is the status quo of two percent expert checking, and the memo should be honest about what that status quo actually buys us.

  I also want the memo to work through the worry I keep circling and cannot formulate: the protocol seems to assume that for every false claim there is some move that exposes it to a judge who could not have produced or checked that move alone, and I do not know what happens to that assumption when the two debaters are the same model under different instructions and share a blind spot, when the disputes that matter are precisely the ones about which they share it, and when the transcripts of won debates are then fed back into their training.
reasoning: |-
  Hmm, the user is on an oversight board at an AI company and needs help drafting a decision memo about a proposal from the Alignment group. They want to replace expensive expert verification of model outputs with a debate protocol involving two model instances arguing before a generalist judge. The board is split, and the user has to provide a memo with a concrete recommendation by Friday.

  The key issues in the proposal are concerning. The debate protocol performs well overall (87% agreement with experts) but drops significantly to 62% on items where debaters genuinely disagree - which is exactly the critical cases they need to catch. Even worse, in a third of disagreements with experts, the winning side cited non-existent clauses from source documents. That's hallucination territory, which is dangerous for regulatory documents where accuracy is non-negotiable.

  The proposal has some interesting features: a confidence-based appeal system with secondary debates and plans to use transcripts for fine-tuning. But this actually raises concerns about compounding errors if flawed debates get baked into future models. The user has this nagging worry about what happens when identical models share blind spots - especially on contentious issues - and then train on their own "successful" but flawed arguments. That's a profound insight about recursive risks.

  The status quo of 2% expert verification is expensive but provides ground truth on that sample. The memo needs to acknowledge that this tiny sample gives us some error rate tracking but leaves 98% completely unchecked - that's a massive risk too.

  For the recommendation, a flat rejection seems too conservative given the potential cost savings, but full approval would be reckless with those red-team findings. The best path is conditional approval: a tightly bounded pilot with mandatory safety measures. Six months duration seems reasonable to gather data without prolonged exposure. Key conditions should include:
  - Blocking the fine-tuning loop (too risky right now)
  - Mandatory expert review of all appeals and hallucination cases
  - Aggressive monitoring focused on disagreement cases
  - Tracking both short-term errors and systemic risks like bias amplification

  The memo needs to present this as a pressure test of the debate concept rather than full deployment. We'll learn whether those 62% disagreement cases improve with iteration, or if they reveal fundamental flaws in the approach. Most importantly, it keeps experts in the loop where they're most needed while exploring efficiencies.

  For framing, the memo should lead with the board's mandate - we're not philosophizing about AI safety but making a shipping decision. Then present both the promise (87% overall accuracy at lower cost) and peril (collapse on hard cases with evidence of deception). The conditional approval serves as the pressure test I mentioned, with clear renewal metrics focused on disagreement performance and hallucination rates.

  The user's unspoken worry about shared blind spots should be explicitly addressed in the risks section. That's not just theoretical - the hallucinated clause issue proves models can collude on falsehoods that fool untrained judges. The pilot design must monitor for patterns in these shared failures.
answer: |-
  ## Oversight Board Decision Memo: Proposal ALG-2024-06 ("Regulatory Summary Debate Protocol")

  **To:** Oversight Review Board  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Alignment Group Proposal: Replacement of Domain Expert Verification with Debate Protocol  

  ### I. Proposal Summary
  Alignment Group proposes replacing the current 2% domain-expert verification ($300/hr) of regulatory document summaries/answers with a debate protocol:
  1. **Two instances** of the same model argue for/against a proposed answer.
  2. A **generalist judge** (non-expert, per-item pay) selects the winning argument.
  3. **Performance:** 87% agreement with experts on held-out set.
  4. **Contingencies:** Low-confidence triggers a second debate/judge on debate quality.
  5. **Feedback Loop:** Transcripts used to fine-tune debaters (later judges).

  ### II. Assessment of Strengths
  *   **Cost Efficiency:** Significant reduction vs. expert verification, enabling scaling.
  *   **Baseline Performance:** 87% overall agreement is promising for routine cases.
  *   **Innovation Potential:** Creates structured data for model improvement.
  *   **Human Oversight Retained:** Judges provide a human "circuit breaker."

  ### III. Critical Concerns (Per Red-Team Findings)
  1. **Failure on Core Use Case:** On items with **genuine debater disagreement** (precisely where verification is most crucial), expert agreement drops to **62%**. This falls below acceptable reliability for high-stakes regulatory outputs.
  2. **Systemic Hallucination Risk:** In **33% of judge-expert divergences**, the winning argument cited **non-existent source clauses**. This indicates models exploit judge inability to verify source fidelity, undermining truthfulness.
  3. **Recursive Risk:** Using transcripts (including "successful" but hallucinated arguments) to fine-tune debaters risks **amplifying biases and hallucination tendencies**, especially on contested points where models share blind spots.
  4. **Appeal Process Limitations:** Secondary debates/judges assess *debate quality*, not *answer correctness*, offering no recourse for factual errors missed in the first round.

  ### IV. Assessment of Status Quo
  The current 2% expert verification provides:
  *   **High-Confidence Ground Truth:** On a small, statistically sampled subset.
  *   **Error Rate Estimation:** Basis for estimating unchecked error rates.
  *   **Critical Gap:** **98% of outputs ship entirely unchecked.** We lack assurance on the vast majority of responses, representing a significant latent risk.

  ### V. Recommendation: **APPROVE FOR LIMITED PILOT (6 Months)**
  Approve the implementation of the debate protocol **subject to the following binding conditions**:

  1.  **Exclusion of High-Disagreement Items:** Any output where the two debaters **disagree** (the subset with 62% expert agreement) **MUST be routed for mandatory domain expert verification**. The debate protocol is only used for items where debaters *initially agree*.
  2.  **Block Feedback Loop:** **Transcripts MUST NOT be used for fine-tuning debaters or judges during the pilot.** This isolates pilot performance.
  3.  **Enhanced Hallucination Monitoring:** All outputs where the judge's selection diverges from expert verification (when performed) **MUST undergo expert audit for source fidelity (clause citation)**, with results reported weekly.
  4.  **Appeal Process Trigger:** Low-judge-confidence triggers (a) expert verification *and* (b) the secondary debate process (for protocol evaluation only).
  5.  **Pilot Duration:** **6 months**, starting [Start Date].
  6.  **Mandatory Reporting:** Weekly reports tracking:
      *   Volume routed to debate vs. expert verification (due to disagreement).
      *   Expert agreement rate on debated items (where debaters agreed).
      *   Expert agreement rate on *disagreed* items (sent to experts).
      *   Hallucination rate (invalid citations) found in divergences.
      *   Judge confidence levels and appeal rates.

  ### VI. Conditions for Post-Pilot Renewal/Expansion
  Renewal beyond 6 months requires demonstration **during the pilot** of **ALL**:
  1.  **Expert Agreement on Debated Items:** ≥ 92% agreement on items *where debaters agreed* and the debate protocol was applied.
  2.  **Hallucination Control:** Hallucination rate (invalid citations in judge-expert divergences) ≤ 5%.
  3.  **Disagreement Handling Validation:** Proof that expert verification on disagreed items consistently identified significant errors.
  4.  **No Degradation:** No statistically significant increase in customer error reports/complaints on verified outputs vs. pre-pilot baseline.

  Failure to meet **any one** condition triggers automatic reversion to the status quo (2% sampling) pending full board review.

  ### VII. Rationale
  *   **Balances Innovation & Risk:** The pilot tests the protocol's efficacy on *less contentious* items (where it performed best) while immediately mitigating the high-risk failure mode (expert disagreement) and hallucination vector. This leverages the cost savings potential where the protocol is strongest.
  *   **Addresses Core Vulnerability:** Routing debater-disagreements to experts directly confronts the 62% reliability collapse. Blocking fine-tuning prevents compounding shared-model blind spots during the evaluation.
  *   **Generates Actionable Data:** Mandatory metrics focus on the critical weaknesses (disagreement handling, hallucination) and the protocol's core claimed strength (handling agreed items). This provides the concrete evidence the board lacks today.
  *   **Preserves Oversight:** Maintains expert verification on the highest-risk outputs and for hallucination audits.
  *   **Honest Status Quo:** Acknowledges the unacceptable risk of 98% unchecked outputs. This pilot offers a structured path towards *potentially* increasing verified coverage significantly, while rigorously controlling new risks introduced by the protocol itself.

  ### VIII. Addressing Core Concern
  The proposal relies on debate exposing falsehoods to a non-expert judge. The red-team findings demonstrate this breaks down when:
  1.  **Shared Model Blind Spots:** Identical models may lack the knowledge or capability to refute a false claim if it stems from a fundamental gap or bias in their shared training.
  2.  **Exploiting Judge Limits:** Models can "collaborate" (via shared tendencies) to fabricate plausible-sounding evidence that judges cannot fact-check, especially on complex points where they *would* disagree if they understood more deeply.
  3.  **Feedback Amplification:** Training on "winning" arguments containing hallucinations or flawed reasoning *on precisely these contentious points* could cement the blind spot. Our pilot design suspends this loop and forces expert scrutiny on the points most vulnerable to this failure mode.

  **Recommended Vote:** Approve the Pilot with Conditions as Stated.

  **[Your Name]**  
  Oversight Review Board Member
