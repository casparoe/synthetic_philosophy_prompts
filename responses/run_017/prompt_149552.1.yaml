prompt: |-
  Eighteen months ago I was passed over for a promotion I had spent four years working toward, and the panel told me, kindly, that the outcome reflected the strongest claim on merit. This spring I sat on the other side of a panel of the same kind, and we are now drafting the criteria for a search of our own; a colleague has proposed that once we have a shortlist of candidates who are all plainly capable of doing the job, we allocate the post by lottery. I have to take a view on that, and in trying to I have worked myself into an argument that I suspect contains a mistake.

  My starting point is that meritocracy is the view that posts and rewards should go to the people who deserve them, and that desert here is a matter of what someone has made of themselves — the effort, the discipline, the hours — rather than the accident of being quick, or tall, or born to parents who read aloud. On that reading, most of the critical literature I have encountered looks like an extended complaint about measurement error: the tests are noisy, interviews encode class signalling, credentials proxy for parental income. That is a genuine complaint, but it is a technical one, and I cannot see how it gets anyone to the much stronger claim that the arrangement itself is illegitimate.

  So I have tried to build a better argument, and I have been calling it the ratchet. Every unearned advantage a child has — a quiet room, a stable home, decent nutrition, a teacher who happened to notice them — is converted by schools, examiners and selectors into a credential. The credential is then read back as evidence of ability or effort, and because the next round of advantages is allocated on the basis of credentials, the conversion compounds: by mid-career the distance between two people is mostly accumulated accident, but it is inscribed in a CV, and so it presents itself to everyone, including the person who has it, as something earned. If that is right, meritocracy does not merely track desert imperfectly; it manufactures counterfeit desert. It launders luck into a claim of desert, and then recruits the loser's own self-respect to bless the outcome. There is even a historical corroboration: the word was introduced by Michael Young in a satirical dystopia of 1958, as a term of abuse, so people who defend meritocracy are defending something its inventor meant as a warning.

  Put those together and I reach a conclusion I am not comfortable with: that competitive selection is a desert-laundering machine, worse than an open lottery, which at least does not pretend to be tracking anything, and that we should therefore replace it with lotteries among the qualified — the device the lottocracy literature proposes for legislatures, applied to hiring. Where is the false step? My own suspicion is that I have quietly merged merit with desert, and assumed that tracking desert is what selection for a role is even for. But if that is the error, what is the practice for, and does my colleague's lottery actually break the ratchet, or just hide it behind a threshold we still get to set?
reasoning: |-
  Okay, I need to help this user figure out where their argument might have gone wrong. They're dealing with a complex ethical dilemma about meritocracy and lotteries in hiring. Let me start by understanding their core argument.

  The user was passed over for a promotion they worked hard for, and now they're on a hiring panel. Their colleague suggests using a lottery for qualified candidates. The user developed the "ratchet" theory: meritocracy converts unearned advantages into credentials, which are mistaken for merit, thus laundering luck into desert. They conclude that lotteries among the qualified might be better. But they suspect a flaw in their reasoning.

  First, I should break down their argument. They start with defining meritocracy as based on desert from effort, not innate traits. Critics focus on measurement errors, but the user thinks that's a technical issue, not invalidating the system. Then they introduce the ratchet effect: advantages compound over time, creating counterfeit desert. Historical context from Michael Young's satire adds weight.

  Their discomfort comes from concluding that competitive selection is worse than a lottery. But they wonder if they conflated merit with desert and if selection's purpose is even about desert. Also, they question if lotteries truly fix the ratchet or just hide it behind the qualification threshold.

  Now, I need to identify where the argument might falter. The user’s suspicion about merging merit and desert seems key. If desert is about moral deservingness, merit might be about capability to perform a job. These aren't the same. So maybe selection is about finding the best performer, not the most deserving person. That distinction could be crucial.

  Also, the ratchet effect highlights how initial advantages lead to credentials, but the lottery among qualified candidates still depends on setting that threshold. Who defines "qualified"? If biases affect that, the ratchet persists. Plus, lotteries ignore performance differences, which might matter for job effectiveness. The user’s colleague’s proposal doesn't address how qualifications are determined, so the root issue remains.

  Another angle: the purpose of hiring. If it's about organizational efficiency, merit-based selection might be pragmatic, even with flaws. Lotteries could reduce unfairness but might not ensure the best fit. The user needs to consider what the hiring process aims to achieve—desert, efficiency, fairness, or something else.

  Also, the user’s personal experience might influence their view. Being passed over could make them more critical of meritocracy, leading to a stronger rejection. But their argument needs to stand independently.

  So, the false steps are likely: 1) Equating merit with moral desert when merit might be instrumental. 2) Assuming selection's sole purpose is tracking desert. 3) Not seeing that lotteries still rely on biased qualification criteria. 4) Overlooking organizational needs for competence.

  To help the user, I should outline these points, clarify the merit vs. desert distinction, and discuss whether lotteries solve the ratchet or mask it. Emphasize that without addressing how qualifications are set, the lottery doesn't fix the core issue. Also, consider alternative solutions, like improving how merit is assessed or reducing initial inequalities.
answer: |-
  You've constructed a powerful and nuanced critique of meritocracy, identifying a genuine flaw – the "ratchet effect" – but your suspicion about a "false step" is astute. The core issue lies in the conflation of concepts and the assumed purpose of selection. Here's a breakdown of where the argument stumbles and how to refine it:

  1.  **The Conflation of "Merit" with "Moral Desert":** This is the heart of the false step.
      *   **Your Definition:** You define meritocracy as allocating rewards based on *desert*, stemming from "what someone has made of themselves" (effort, discipline).
      *   **The Practical Reality of Selection:** Most hiring/promotion panels, even those aspiring to be meritocratic, are primarily focused on **predicting future performance and potential contribution to the organization's goals.** They look for evidence of *capability, competence, skills, knowledge, experience, and potential* – what we might call "pragmatic merit" or "functional merit." This is distinct from "moral desert" based on effort alone.
      *   **The Mistake:** You've assumed the *purpose* of competitive selection is to track and reward *moral desert* (effort, overcoming adversity). However, its actual purpose in most institutional contexts is to identify individuals *most likely to succeed in the role and benefit the organization*, regardless of the source of their abilities (innate talent, luck, hard work). The "merit" sought is instrumental, not purely moral.

  2.  **The Purpose of Selection:**
      *   **Your Assumption:** You implicitly assume selection exists primarily to reward moral desert ("what someone has made of themselves").
      *   **The Organizational Reality:** Selection exists to:
          *   Fill a role effectively and efficiently.
          *   Achieve organizational objectives (productivity, innovation, service delivery).
          *   Manage resources prudently (appointing the best available candidate).
          *   Maintain internal equity and morale (perceived fairness in process).
      While rewarding effort *can* be a factor, it's rarely the *primary* driver. The panel that passed you over likely believed the other candidate(s) would perform *better* in the role, based on the evidence they had (which may have been flawed by the ratchet effect), not necessarily that the other candidate(s) *deserved it more morally*.

  3.  **The Lottery Proposal: Does it "Break the Ratchet"?**
      *   **Addressing Laundered Luck?** Yes, *within the qualified pool*. A lottery explicitly acknowledges luck and severs the direct link between accumulated credentials (the product of the ratchet) and the final outcome. It prevents the *final step* of converting laundered luck into the *specific post*.
      *   **Hiding, Not Breaking, the Ratchet?** **This is crucial.** The lottery **does not break the ratchet; it merely shifts its influence upstream.** The ratchet's core mechanism – converting early advantages into credentials that grant access to further advantages – **remains fully intact in determining who gets onto the "qualified" shortlist.**
          *   **The Threshold is Key:** Who defines "plainly capable"? What criteria are used? How are those criteria measured? This is where the ratchet operates most powerfully. Biases, unequal access to credential-building opportunities, and the compounding effect of past luck heavily influence who meets the threshold. The lottery only randomizes *among those already deemed qualified* by a system still susceptible to the ratchet.
          *   **The Ratchet Persists:** The winner of the lottery gains the post, adding a prestigious credential to their CV. This credential then feeds into the *next* ratchet cycle, potentially giving them (or signaling for them) advantages for future opportunities, regardless of whether they were the "best" performer in the role they won by lot. The loser of the lottery, despite being qualified, misses out on that specific credential-building opportunity.
      *   **Potential Downsides of the Lottery:**
          *   It ignores potentially meaningful differences in *predictive performance indicators* among the qualified candidates. While the differences might be smaller than perceived due to the ratchet, they might not be zero. An organization might genuinely miss out on the *most* effective candidate.
          *   It could be seen as an abdication of responsibility by selectors.
          *   It might undermine perceived legitimacy if stakeholders believe discernible differences exist.

  **Reframing Your Conclusion & Addressing the Lottery:**

  1.  **Refine the Critique:** Your "ratchet effect" is a devastating critique of meritocracy *as a system for distributing moral desert* and *as a system that claims its outcomes are purely earned*. It brilliantly exposes how luck is laundered into the *appearance* of desert and how the system reinforces inequality. **Where it overreaches is in assuming that meritocratic selection *aims* to distribute moral desert.** It primarily aims to select for functional competence, albeit imperfectly and while being corrupted by the ratchet.
  2.  **Re-evaluate the Lottery:** Your colleague's lottery proposal:
      *   **Is not a solution to the ratchet.** It leaves the credential-building machine that creates the qualified pool untouched.
      *   **Is a response to the *impossibility* or *futility* of perfectly discerning "functional merit" (especially predictive performance differences) *within* a pool of demonstrably qualified candidates.** It acknowledges the noise and the influence of laundered luck even at that stage.
      *   **Prioritizes a different kind of fairness:** Equal *chance* among the qualified, explicitly rejecting the attempt to rank-order based on criteria potentially distorted by the ratchet. It focuses on sufficiency rather than optimality.
      *   **Changes the narrative:** It avoids pretending the final selection tracks deep desert or even precise functional superiority within the qualified group. It embraces randomness after a sufficiency threshold is met.
  3.  **Addressing the Threshold (The Crucial Point):** To genuinely mitigate the ratchet, you need to focus *on the threshold itself*:
      *   **Scrutinize Criteria:** Are criteria truly necessary for *performance*? Do they inadvertently favor privileged backgrounds? (e.g., specific university pedigrees, unpaid internships).
      *   **Improve Measurement:** Can assessments be designed to be less noisy, less biased, more focused on demonstrable skills directly relevant to the job?
      *   **Contextualize Achievement:** Can selectors actively look at achievement *in context* (e.g., recognizing strong performance from a candidate who attended a less prestigious school or had fewer resources)?
      *   **Diversify Pathways:** Create multiple routes to demonstrate qualification, reducing reliance on a single, potentially biased credentialing system.

  **Conclusion:**

  Your "false step" was indeed conflating "merit" (as functional competence sought by organizations) with "moral desert" (earned through effort/discipline). Competitive selection is primarily a (flawed) tool for predicting functional competence, not a machine for dispensing moral justice. The "ratchet" is a real and pernicious force that corrupts this process by laundering luck into credentials mistaken for both competence *and* desert.

  Your colleague's lottery **does not break the ratchet;** it merely randomizes the final step *after* the ratchet has already determined the qualified pool. It addresses the difficulty of fairly choosing *among* the qualified when differences might be small and influenced by past luck, prioritizing a different kind of procedural fairness. To truly combat the ratchet, the focus must shift upstream to critically examine and reform *how the qualification threshold is set and who gets to meet it*. The lottery sidesteps the pretense of precise desert-tracking at the final hurdle but leaves the engine of inequality running. The harder, necessary work is dismantling that engine by making the path to qualification itself fairer and less susceptible to the compounding advantages of luck.
