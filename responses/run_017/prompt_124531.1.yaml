prompt: |-
  pls don't give me the standard "bad statistics put an innocent woman in prison" take — I want the Sally Clark case run through the three big interpretations of probability. Short recap so we're on the same facts: she was convicted in November 1999 of murdering her two infant sons; the prosecution's expert, the paediatrician Roy Meadow, put the chance of two cot deaths in an affluent family like theirs at 1 in 73 million, reaching it by squaring a 1 in 8500 figure for a single such death; the Royal Statistical Society later said there was no statistical basis for that; the conviction survived an appeal in 2000 and was only quashed in January 2003, on the separate ground that the prosecution pathologist had sat on microbiology results pointing to natural causes. Fix a date if I've mangled it, but don't make the timeline the answer.

  So: read that 1 in 73 million through frequentism, then through subjectivism (degree-of-belief / betting-odds style), then through a Popperish propensity view. For each, say what the number is even claiming, what the expert would have had to establish for it to carry weight in front of a jury, and where it breaks — reference class trouble, the independence assumption the squaring needs, the missing base rate for double infant murder, or whether there's any repeatable chance setup here for a propensity to attach to.

  The bit I actually go back and forth on: call a probability auditable if the interpretation that licenses it also lets you, after the fact and for that one event, say whether the person quoting it was right. My sense is subjectivism can do that via proper scoring rules, frequentism can only do it by dragging in a reference class the event may not belong to, and propensity can't really do it at all since you observe outcomes and never chances. Is that fair to all three, is auditability a demand any of them should have to meet, and does thinking in those terms change how the case looks?

  Give it to me as exactly five numbered points, one or two sentences apiece, no intro and no wrap-up — and draw an explicit line between what's settled among people who work on this and what's live dispute, since I don't want one contested version of frequentism or of propensity handed over as the consensus view.
reasoning: |-
  Hmm, the user wants me to analyze the Sally Clark case through three interpretations of probability: frequentism, subjectivism, and propensity. They want a structured response with exactly five numbered points, each one or two sentences, without any introduction or wrap-up. They also want clarity on what's settled versus disputed in each interpretation.

  Looking at the Sally Clark case details they provided: Roy Meadow testified that the probability of two cot deaths in an affluent family was 1 in 73 million, calculated by squaring the 1 in 8,500 figure for a single cot death. The Royal Statistical Society criticized this approach. The conviction was eventually overturned due to withheld evidence about microbiology results pointing to natural causes.

  For the three interpretations:
  - Frequentism: The 1 in 73 million would represent a long-run frequency. But there's significant reference class trouble here - what exactly is the reference class? Affluent families? Parents with two infants? This is disputed territory since frequentists debate how to define proper reference classes.
  - Subjectivism: This would treat the probability as a degree of belief. Meadow presented it as an objective fact, but subjectivism would require it to be a personal betting odd. The key issue here is whether this number was calibrated or just pulled from thin air - a settled criticism is that he ignored base rates for double murders.
  - Propensity: This views probability as a property of the situation. But what's the repeatable setup? Infant deaths aren't independent coin flips. The independence assumption needed for squaring is controversial and generally not accepted as valid.

  On auditability:
  - Subjectivism can be audited through proper scoring rules - we could evaluate how well the probability matched the outcome.
  - Frequentism relies on reference classes that might not fit this specific case.
  - Propensity can't really be audited since we only see outcomes, not the underlying chances.

  I'll structure this as five concise points covering all these aspects while clearly distinguishing settled views from ongoing disputes in each interpretation.
answer: |-
  1.  **Frequentism (Long-run frequency):** The 1 in 73 million claims the relative frequency of two cot deaths occurring in families like the Clarks over a very long series of identical repetitions. To carry weight, Meadow needed a precisely defined, relevant, and stable reference class (e.g., affluent families with two infants) and proven independence between deaths; the reference class trouble (what defines "like"?), the invalid independence assumption for squaring, and the lack of such long-run data are settled criticisms that break the claim.
  2.  **Subjectivism (Degree of belief / Betting odds):** The number represents Meadow's personal betting odds against two natural deaths occurring in this specific family. To carry weight, Meadow needed to demonstrate his belief was well-calibrated (e.g., based on reliable evidence like base rates for double infant murder versus double cot death). Ignoring the base rate for the alternative explanation (murder) and presenting this subjective belief as objective fact are settled flaws, while whether personal degrees of belief *should* be admitted as evidence remains disputed.
  3.  **Propensity (Single-case chance):** The number claims an inherent, physical disposition or tendency within the Clark family situation for two cot deaths to occur. To carry weight, Meadow needed to identify a stable, repeatable "chance setup" (e.g., specific genetic or environmental factors) generating independent deaths and empirically measure the propensity; the absence of any defined chance setup, the biologically implausible independence assumption needed for squaring, and the fundamental unobservability of single-case propensities break the claim – whether propensities even meaningfully apply to unique historical events like this is deeply disputed.
  4.  **Auditability:** Subjectivism can be audited via scoring rules assessing the expert's calibration over many predictions (though not for a single event). Frequentism requires placing the single event into a reference class for frequency comparison, which is contested. Propensity is inherently unauditable for a single outcome, as the unobserved chance cannot be compared to the observed result; this reflects settled features of each interpretation.
  5.  **Auditability Demand & Case Impact:** Auditability is not a core demand for propensity or frequentism (which deal with aggregates or setups), but subjectivism must meet it for credibility. Thinking in auditability terms highlights the 1 in 73 million was fundamentally unauditable – it couldn't be validated as a frequency (no data/reference class), a propensity (no setup), or a calibrated belief (ignored base rates) – exposing it as forensically worthless, a settled conclusion. Whether courts *should* require probabilistic claims to be auditable is a live dispute.
