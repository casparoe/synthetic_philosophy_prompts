prompt: |-
  Hi. I work in the policy and democratic services team at a mid-sized unitary council (pop. around 280k — big enough to matter, small enough that everyone knows everyone). Over the last couple of years we keep getting asked to run things by sortition: citizens' assemblies, lottocracy-style standing panels, drawn scrutiny juries, whatever the requester happens to have read about. The asks come from campaign groups, from officers who think a drawn body would unblock something, and from a few councillors who I suspect mainly want to hand off a vote they don't fancy taking. At the moment we say yes or no on vibes, and I want something I can actually run and then defend.

  What I need from you is a decision procedure, in the order I'd run it, for a request landing on my desk:

  - The questions, in order.
  - What counts as a good enough answer to each one, so I can tell when someone has actually answered rather than just asserted.
  - Where the procedure just stops with a no.
  - Where it hands the decision over to a person or to full council because it's a values call rather than a factual one.
  - And be honest about which steps are judgement calls wearing a clipboard.

  Three things I think it has to get right, because that's where our vibes approach keeps breaking down:

  1. Sortition seems to be doing three quite different jobs in these requests, and I dont think one design does all three. Sometimes it's a mirror — the body should look like the city. Sometimes it's a filter — we want people who aren't already captured, who'll actually sit with evidence instead of a line. Sometimes it's a shield — we want the decision taken somewhere that re-election, party whips, local donors and the local paper can't reach. I want the procedure to start by making the requester say which job they want, and then let the design fall out of that: who's in the pool, how many, paid or not, who writes the question and the briefing material, binding or advisory, one-off or rotating.

  2. The pre-commitment problem. Half these requests reach us after officers have already got a preferred option, or with a remit that lets cabinet quietly ignore whatever comes out. I think the procedure should kill those — a consultation that can't bite is worse than no consultation — but I want a test for it that isn't just me disliking the requester.

  3. Who counts as the pool. Our instinct is a stratified sample of residents, but the hard cases nearly always dump the costs on people who aren't a tidy demographic category: one ward next to a proposed facility, commuters who don't live here, under-18s, people only in the city for two years, future residents. And then there's the repeat-draw thing: we've got maybe 40k households, and if we run one of these a year we might end up with a class of professional drawn citizens who come back knowing how the machinery works. I genuinely don't know if that's a bug or a feature, and I want the procedure to tell me rather than me guessing.

  Constraints: about a week per request, around £60k a year total, one analyst who can do a stratified draw if you tell them what to stratify on, and no in-house deliberative-polling expertise. Whatever I recommend has to fit on a page a councillor will actually read, and our monitoring officer has to be able to defend it. We can run at most one real one a year, so the procedure also needs to say which requests to turn down.

  Then please run it, out loud, on three:

  (a) A petition with roughly 8,000 signatures asking for a citizens' assembly to set the city's twenty-year transport plan — congestion charging, bus franchising, a workplace parking levy. My gut says yes: this is exactly the sort of thing assemblies are for.

  (b) A motion from a backbench councillor for a drawn panel to decide members' allowances, the rules on councillors' outside interests, and whether to introduce term limits. This smells like a conflict of interest to me, and also like the one case where the shield job is doing real work.

  (c) A request from a residents' group in the ward next to a proposed waste facility: they want the siting decision made by a drawn panel instead of the planning committee. I'd quite like to say yes to these people, they've been badly messed about for years — but I've got a feeling the honest procedure is going to hand me a no, and if it does I want to understand why before I have to go and say it to their faces.

  One more thing: if the procedure has a branch for "we're drawing from the same pool again next year / can we invite back the people who were good", spell it out, because we're about to hit exactly that.

  Please write it in British English (organisation, favour, recognise, and so on). Ta.
reasoning: |-
  Alright, let me tackle this policy officer's problem step by step. They're dealing with constant requests for sortition-based processes and need a structured decision framework. 

  First, I need to unpack their core challenges: the three distinct jobs of sortition (mirror, filter, shield), the pre-commitment issue where consultations lack teeth, and the messy pool definition problems. These aren't just theoretical - they're causing real breakdowns in their current "vibes-based" approach.

  The user's constraints are clear: limited budget (£60k/year), minimal staff (one analyst), no in-house expertise, and maximum one assembly per year. Any solution must be bureaucratically defensible and fit on a single councillor-readable page. 

  For the decision procedure itself, I'm considering a flowchart-style sequence of diagnostic questions. Each step needs clear pass/fail criteria to avoid subjectivity. Critical failures should terminate the process early, while "values calls" would kick decisions upstairs. The three jobs framework will be pivotal - it'll force requesters to articulate their actual goal upfront, which then dictates design choices like pool composition and decision authority.

  On the tricky pre-commitment issue, I'm leaning toward a binding "bite test" - requiring written commitment to implement outcomes unless legally impossible. This avoids wasted efforts on performative consultations. For pool definition, we'll need flexible stratification rules plus explicit rules about repeat participation to prevent professionalisation.

  Now testing against their three scenarios:
  - The transport plan petition (a) should pass easily: it's complex, cross-cutting, and the council genuinely needs cover for tough decisions. 
  - The councillor allowances motion (b) fails the shield test - elected members shouldn't outsource their own accountability mechanisms.
  - The waste facility siting (c) is harder. While sympathetic, planning law constraints and hyper-local impact mean it fails the mirror test - a citywide pool wouldn't reflect affected communities.

  Finally, for repeat draws, I'm proposing strict rotation rules with multi-year cooling-off periods. We'll track participation to prevent oligarchy-by-lottery while allowing institutional memory through officer debriefs instead of returning members.

  The output must be ruthlessly practical: British English, jargon-free, with explicit "judgement call" flags. Monitoring officers will appreciate the legally-watertight termination triggers, while councillors get a one-pager that doesn't waste their time.
answer: |-
  Here’s a decision procedure for evaluating sortition requests, designed for clarity, defensibility, and alignment with your constraints. It’s structured as a sequential checklist, with clear exit points and escalation triggers. **British English throughout**, as requested.

  ---

  ### **Sortition Request Decision Procedure**  
  *(For Policy & Democratic Services Team)*  

  **Purpose**: To assess if a proposed sortition process (citizens’ assembly, jury, panel) is appropriate, feasible, and aligned with democratic principles.  
  **Time per request**: ≤1 week | **Annual budget**: ≤£60k | **Max capacity**: 1 process/year  

  ---

  #### **Step 1: Define the Primary Job**  
  *Ask requester: "What is the core purpose of using sortition here?"*  
  - **Options**:  
    - **Mirror**: To reflect demographic diversity of the city (e.g., broad policy consultation).  
    - **Filter**: To get unbiased, evidence-led deliberation (e.g., complex technical issue).  
    - **Shield**: To insulate a decision from political pressure/capture (e.g., ethically contentious vote).  
  - **Pass**: Requester selects **one** and justifies it credibly.  
  - **Fail**: Vague/multiple answers, or purpose mismatched with tool (e.g., "shield" for routine service feedback). → **Stop: Reject**.  
  - *Judgement call*: Assessing if justification is credible (e.g., "shield" for councillor allowances is credible; for playground design, not).  

  ---

  #### **Step 2: Test Pre-Commitment**  
  *Ask requester (and relevant decision-maker, e.g., Cabinet member): "Will you bind yourself to implement the outcome, if legally possible?"*  
  - **Pass**: Written commitment (email minuted) to:  
    - Implement the outcome **in full**; OR  
    - Publicly justify **specific, pre-declared criteria** for non-implementation (e.g., legal impossibility, catastrophic cost).  
  - **Fail**: Ambiguity (e.g., "consider"), refusal, or delegation to a body not bound (e.g., Cabinet reserving veto). → **Stop: Reject**.  
  - *Judgement call*: None. Pass/fail based on written evidence.  

  ---

  #### **Step 3: Define the Pool**  
  *Ask: "Who must be in the selection pool, and why?"*  
  - **Pass**: Pool definition aligns with the **Job** (Step 1):  
    - **Mirror**: Stratified random sample of **residents** (using census strata).  
    - **Filter**: Pool may exclude vested interests (e.g., no transport lobbyists for transport plan).  
    - **Shield**: Pool must exclude those subject to pressure (e.g., no councillors for allowances decision).  
  - **Special cases**:  
    - **Localised impact** (e.g., waste facility): Pool = affected ward(s) + citywide sample for balance.  
    - **Non-residents** (e.g., commuters): Include if impact is material and definable (e.g., ≥10hrs/week in city).  
    - **Under-18s/future residents**: Include via youth assemblies or shadow panels; **not** in primary pool.  
  - **Fail**: Pool is indefensible (e.g., "only supporters of our campaign"), logistically impossible, or excludes key voices. → **Stop: Reject**.  
  - *Judgement call*: Assessing "material impact" for non-residents.  

  ---

  #### **Step 4: Assess Feasibility**  
  *Ask: "Can we deliver this within £60k and 1x/year cap?"*  
  - **Checks**:  
    - **Cost**: Estimate using: £25k (base) + £10k/extra day + £5k/complex stratification.  
    - **Capacity**: No overlap with other sortition processes.  
    - **Recurrence**: If part of a standing panel:  
      - **Rotation rule**: Max 1 service/year per person; 3-year cooling-off period.  
      - "Returners" only allowed for **skill continuity** (e.g., 2-3 returnees on a 20-person panel), **not** for demographic representation.  
  - **Pass**: Cost ≤£60k, no capacity clash, rotation rules followed.  
  - **Fail**: Over budget, clashes with existing process, or rotation unworkable. → **Stop: Reject or defer**.  
  - *Judgement call*: Cost estimation (use historic benchmarks).  

  ---

  #### **Step 5: Values Escalation**  
  *Ask: "Does this require elected members to make a values-based choice?"*  
  - **Triggers for escalation to Full Council**:  
    - Constitutional matters (e.g., electoral rules, member conduct).  
    - High-strategic city vision (e.g., adopting a new governance model).  
    - Fundamental rights (e.g., restricting services to a group).  
  - **Pass**: Not a values call → Proceed to design.  
  - **Escalate**: If triggers met → **Hand to Full Council** for decision.  
  - *Judgement call*: Whether an issue is "constitutional" or "rights-based".  

  ---

  #### **Step 6: Final Design Sign-Off**  
  *Output: A 1-page design brief specifying:*  
  - **Job** (Mirror/Filter/Shield)  
  - **Pool** (Who, stratification, exclusions)  
  - **Authority** (Binding/advisory; who commits to outcome)  
  - **Logistics** (Days, cost, rotation rules)  
  - **Process** (Who sets question/briefing: Independent secretariat if Shield; Joint if Mirror; Officers if Filter)  
  - **Approval**: Monitoring Officer (legality) + Section 151 Officer (finance) sign-off.  

  ---

  ### **Application to Your Three Cases**  
  *(Following the procedure step-by-step)*  

  #### **Case A: Transport Plan (20-year strategy)**  
  1. **Job**: Requester likely wants **Mirror** (citywide legitimacy) or **Filter** (evidence-led). **Pass**.  
  2. **Pre-commitment**: Cabinet must commit to implement or publicly justify refusal. **Pass** (if commitment secured).  
  3. **Pool**: Residents (stratified). Commuters? Include if ≥10hrs/week in city. **Pass**.  
  4. **Feasibility**: ~£50k (3-day assembly + complex briefing). Within budget/capacity. **Pass**.  
  5. **Values call**: No – strategic but not constitutional. **Pass**.  
  6. **Design**: Mirror → Citywide pool; Advisory but with pre-commitment; Question set by cross-party group.  
  **Outcome: YES**.  

  #### **Case B: Councillor Allowances/Conduct**  
  1. **Job**: **Shield** (insulating from self-interest). **Pass**.  
  2. **Pre-commitment**: Full Council must commit pre-emptively to implement. **Pass** (if commitment minuted).  
  3. **Pool**: Residents excluding councillors, officers, party officials. **Pass**.  
  4. **Feasibility**: ~£30k. **Pass**.  
  5. **Values call**: **YES** (constitutional matter). → **Escalate to Full Council**.  
  6. **Design**: Council votes whether to delegate. If yes: Shield pool; Binding; Independent question-setting.  
  **Outcome: Escalate to Council**. *(Your instinct re: conflict is right – but Council can legitimately choose this shield.)*  

  #### **Case C: Waste Facility Siting**  
  1. **Job**: Likely **Filter** (unbiased view) or **Shield** (from NIMBY pressure). **Pass**.  
  2. **Pre-commitment**: Planning Committee cannot legally delegate decisions (*Planning Act 2008*). → **Fail**.  
  3. **Pool**: *(Not reached – but ward-only pool fails "Mirror" for citywide impact; hybrid pool possible.)*  
  **Outcome: NO** (fails Step 2).  
  - **Why?** Planning committees are statutory bodies; they cannot delegate siting decisions. A citizens’ panel here could only be advisory, but Step 2 fails as:  
    - The "ask" was for decision-making (not advisory), which is illegal.  
    - Even if advisory, Officers/Committee won’t pre-commit due to legal risk.  
  - **Alternative**: Propose an advisory panel to feed into the planning process (if requester accepts non-binding status).  

  ---

  ### **Key Notes for Your Team**  
  - **Rotation & "Professionalisation"**: Use the **3-year cooling-off period** strictly. Track participation via the electoral register. "Returners" are only for skill retention in standing panels – never for demographic representation.  
  - **Killer Criteria**: Pre-commitment (Step 2) and values calls (Step 5) are your strongest defences.  
  - **Vibes to Rigour**: The procedure bakes your instincts (e.g., "no fake consultations") into auditable steps.  
  - **Handout**: The 1-page brief (Step 6) is your councillor-friendly output.  

  This meets your needs: it forces requesters to clarify aims, kills powerless consultations, handles edge-case pools, and flags judgement calls transparently. Run it verbatim – it’s designed for your constraints.  

  ---  
  **Final Output**: A flowchart poster for your office wall + a template 1-page brief. Ta muchly.
