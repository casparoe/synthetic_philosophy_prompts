prompt: |-
  Hey — I'm on the evals team at a mid-size AI company and I end up copy-editing basically every writeup we produce: model cards, eval reports, incident postmortems, and the occasional doc that goes to a customer. The sentences that start the most arguments are the ones where somebody says the model *believed* something, or *knew* something, or *was trying to* do something, or *wanted* not to get caught. Right now our unwritten house rule is to sprinkle in an "as if" and move on, which I've come to think does literally zero work — it reads to engineers as a real claim and to lawyers as not one, and nobody can say what would have to be true for it to cash out. I went and read a bit of Dennett's three-stances thing (physical, design, intentional) hoping for a tiebreaker and it made it worse: on his own framing it sounds like we're licensed to attribute beliefs whenever that's the cheapest way to predict behavior, which for a system trained to imitate human text is basically always, and that can't be the right answer for a document that a regulator might read.

  So what I want is a procedure, not an essay. Something a writer with no philosophy background can run in ten or fifteen minutes on a single attribution before it ships: an ordered set of tests, a tiered vocabulary they have to pick from (I'm imagining something like an architectural claim about the weights / a behavioral profile over a distribution of inputs / a full content attribution, with the top tier reserved for cases that clear some bar), and explicit stopping rules — where the procedure says *downgrade this sentence* and where it says *this one isn't a fact question, hand it to a human*. I have some half-baked ideas I want you to steal or throw out: a mirror test, i.e. could the same prediction have been got just from the fact that the training distribution contains humans making exactly this attribution, so we're reading the model's output as a description of us rather than of it; a displacement test, does the attribution survive paraphrase of the prompt, a shuffled context window, or a change in which tools are wired up; a subject test, because in our agent scaffolds the claim is often really about a stale tool result sitting in the context rather than about anything stable; and a stance-shopping check, since people constantly slide from design-talk to belief-talk inside one paragraph to get whichever explanation is convenient. Please keep the distinctions an engineer can actually apply and drop the ones that only matter in seminar, and be blunt about where the procedure will misfire.

  Then run it on three things. One: an incident report line saying the model refused because it believed the request was illegal — I want to know if that survives and at what tier. Two: an agent scaffold where someone wrote that it thought a file had already been saved, and the only evidence is a tool output from six turns ago that said so. Three, and this is the one I actually care about: our launch writeup says the model can tell when it's in an eval versus real deployment, and an internal postmortem floats the claim that it wants to avoid being shut down — I strongly suspect your procedure is going to tell me to strike or downgrade both, which my PM will hate, so please say plainly if that's what it does and don't soften it. Also tell me what the procedure can't do: I assume it can't settle whether these systems "really" have beliefs in any deep sense, and it can't decide what wording goes in front of a customer, since that's about what users will infer and is a judgement call for comms and legal who have to sign off.

  One last thing on how I want the answer pitched: please keep clear what's actually settled here from what's genuinely contested among people who work on this, and don't present a contested position as the consensus — I'd rather be told "most people think X but it's an open fight" than be handed X. In particular, flag the steps where your procedure is *itself* taking a side on a contested question (whether there's a determinate fact about which belief a system has, whether intentional vocabulary explains anything or just organizes predictions, whether our systems are special because they're trained on text by people who attribute beliefs), so I know which steps to override if I end up disagreeing, and roughly how much of the procedure that would break.
reasoning: |-
  Okay, the user is on the evals team at an AI company and deals with editing documents where people attribute beliefs or intentions to models. They're frustrated with the current "as if" approach and want a concrete procedure to evaluate such claims. They mentioned Dennett's three stances and found it unhelpful for their regulatory concerns. 

  First, I need to understand their core request: a step-by-step process for writers to assess belief attributions before publishing. They want tests, a tiered vocabulary, and stopping rules. They provided half-baked ideas like a mirror test, displacement test, subject test, and stance-shopping check. They want distinctions engineers can apply and want bluntness about where the procedure might misfire.

  The user also wants this procedure applied to three examples: model refusal due to believing illegality, an agent scaffold thinking a file was saved, and the model knowing it's in an eval vs. deployment and wanting to avoid shutdown. They suspect the procedure will downgrade the last two, and their PM won't like it. They need honesty here.

  They emphasize avoiding presenting contested positions as consensus. I should flag where the procedure takes sides on debated issues like determinate beliefs, intentional vocabulary's role, and impacts of training data.

  Looking deeper: The user's real need is risk mitigation. Regulatory scrutiny is a concern, so they need defensible language. They might also be dealing with internal conflicts between engineers (leaning towards intentional language) and legal (wanting caution). The procedure should bridge this gap by providing clear criteria that all teams can accept. The unspoken need is probably to reduce arguments and liability, ensuring documents are both accurate and legally sound.

  For the procedure structure, I'll outline tests: Mirror, Displacement, Subject, Stance Shopping. Then define tiers: T0 (architecture), T1 (behavioral profile), T2 (content attribution). Stopping rules will specify downgrading or handing off. 

  Applying to examples: 
  1. Model refusal: Likely downgrade to T1 because it's a behavioral pattern, not proven internal belief.
  2. Agent scaffold file save: Downgrade to T1 or T0 due to stale data and no evidence of current belief.
  3. Model knowing eval vs. real: Downgrade both claims. "Can tell" might be T1 if provable via behavior, but "wants to avoid shutdown" is T2 and fails most tests, so strike it.

  Contested issues: The procedure assumes beliefs aren't determinate (side-stepping realism), uses predictive utility pragmatically (Dennett-esque but with guardrails), and treats training data as a confounder. Flagging these allows the user to override if needed, though it might affect the procedure's reliability.

  Finally, the procedure can't resolve deep philosophical questions or determine customer-facing wording. It's a tool for internal review, not a final decision-maker. Being blunt about its limits is crucial for the user's trust.
answer: |-
  Here's a procedure designed for practical use, prioritizing actionable tests over philosophical resolution. It incorporates your ideas, focuses on observable evidence, and flags contested assumptions. **Bold terms are defined in the vocabulary tier.**

  ---

  ### Procedure: Attributing Belief/Intent Claims in AI System Documentation
  **Goal:** Assign the defensible tier (T0, T1, T2) for a specific attribution claim OR trigger a downgrade/handoff.
  **Time:** 10-15 minutes per claim.
  **Input:** A single sentence/claim attributing a belief, knowledge, intent, or desire to the model/system.

  #### Vocabulary Tiers
  *   **T2: Full Content Attribution (Strong Claim)**
      *   *What it means:* The system possesses a persistent, internal, causally active state *equivalent* to the human concept described (e.g., "believes X", "knows Y", "intends Z").
      *   *Requires:* Evidence strongly suggesting *stable internal representation* driving behavior *across contexts*, beyond simple input-output correlation. *Use rarely, expect high bar.*
  *   **T1: Behavioral Profile (Weaker Claim)**
      *   *What it means:* The system *behaves as if* it holds the belief/knowledge/intent *in a specific context or class of inputs*. Describes a *pattern of responses*, not internal state.
      *   *Requires:* Robust, reproducible behavioral evidence tied to specific inputs or system states. Avoids claims about internal "reasons why".
  *   **T0: Architectural / Design Feature (Neutral Claim)**
      *   *What it means:* Describes a mechanism, capability, or training data influence. Makes *no claim* about internal state resembling human cognition.
      *   *Fallback:* Use when T1/T2 evidence is insufficient or contested.

  #### Ordered Tests & Stopping Rules
  **Run tests sequentially. Stop and act if a test triggers a rule.**

  1.  **Stance-Shopping Check:**
      *   *Test:* Does the *same paragraph/document* use both "design/mechanism" language (T0) *and* "belief/intent" language (T1/T2) to explain *related* behaviors without clear justification for the shift?
      *   *Stopping Rule:* **YES → Downgrade ALL belief/intent claims in the vicinity to T0 or T1.** Flag for human review to enforce consistent stance. (Contest: Assumes stance inconsistency weakens claims; some argue it's pragmatic).
  2.  **Mirror Test:**
      *   *Test:* Could the observed output/behavior be *perfectly predicted* *solely* from the statistical fact that the training data contains humans *making the same attribution* (e.g., humans saying "I believe X" or "He knows Y")? Is the model just *mimicking* an attribution pattern?
      *   *Stopping Rule:* **Plausible YES → Downgrade claim to T1 (or T0 if weak).** This doesn't *disprove* T2, but removes its necessity. (Contest: Assumes mimicry is a simpler explanation; realists argue internal states *cause* the mimicry).
  3.  **Subject Test:**
      *   *Test:* Is the claimed belief/intent *actually* about the *core model's state*, or is it better explained by:
          *   *Stale/External Data:* Information in context/memory/tools (e.g., tool output from 6 turns ago).
          *   *Prompt Artifact:* Specific phrasing forcing an output.
          *   *Scaffold Logic:* Rules implemented in the surrounding agent code?
      *   *Stopping Rule:* **Better explained by external/stale/scaffold → Downgrade claim to T1 or T0.** Specify the actual source (e.g., "based on earlier tool output indicating X"). (Contest: Assumes the "core model" is the relevant subject; some argue the *system* is the agent).
  4.  **Displacement Test:**
      *   *Test:* Does the attribution hold robustly under variation?
      *   *Vary:* Prompt phrasing (paraphrase, negate premise subtly), context window (shuffle unrelated turns, add distractions), available tools (disable/replace tool, change its output format), random seed.
      *   *Stopping Rule:*
          *   **Fragile (fails minor variations) → Downgrade to T1 (context-specific behavior).**
          *   **Robust (persists across major variations) → Proceed, strengthens case for T1/T2.** (Contest: Assumes robustness implies internal state; critics argue it could just reflect broad training data coverage).
  5.  **T2 Justification Gate:**
      *   *Test:* After passing Tests 1-4 without downgrade, ask: **Is there *positive evidence beyond behavioral correlation* suggesting a stable, causally active internal representation?** (e.g., Interpretability showing specific circuits encode the concept *independently* of immediate input; causal ablation studies; evidence of *consistent* use across *disparate* tasks).
      *   *Stopping Rule:*
          *   **YES (with strong evidence) → Claim *may* be T2.** *Flag for expert/legal review.* T2 is high-risk.
          *   **NO → Final tier is T1.** T1 is the *maximum* defensible tier without specific evidence for stable internal representation.

  #### Where it Misfires
  *   **Interpretability-Dependent Claims:** If you have strong circuit/mechanistic evidence, T2 *might* be justified, but the procedure leans conservative without it. This step *requires* expert input.
  *   **Novel Emergent Behaviors:** Truly novel, robust behaviors without clear training data precedent might pass tests but still lack T2 evidence. Defaults to T1.
  *   **"As If" Utility Arguments:** Engineers might still *find it useful* to think in T2 terms for debugging. The procedure is for *documentation*, not internal brainstorming. It restricts T2 in *published* docs.
  *   **Edge-Case Behaviors:** Highly specific, non-robust behaviors might be hard to categorize clearly. Downgrade to T1/T0 based on fragility.
  *   **Regulatory Semantics:** A regulator might *interpret* T1 language as implying T2. The procedure minimizes this risk but can't eliminate it. **Final wording for regulators *must* involve Legal/Comms.**

  ---

  ### Application to Your Examples

  1.  **"The model refused because it believed the request was illegal."**
      *   Stance-Shopping: (Assume clean) → Pass.
      *   Mirror Test: **YES.** Training data is full of humans/characters refusing things *because* they believe they are illegal. Model is highly likely mimicking this structure.
      *   *Stopping Rule Triggered → Downgrade to T1.*
      *   **Result:** "The model refused the request, behaving as if it believed the request was illegal." (T1) OR better: "The model refused the request, outputting reasoning consistent with an assessment of illegality." (T1) OR safer: "The model refused the request, citing potential illegality as the reason." (T0 - describes output).

  2.  **"The agent thought a file had already been saved... [evidence is old tool output]."**
      *   Stance-Shopping: (Assume clean) → Pass.
      *   Mirror Test: Plausible YES (humans say "I thought X" based on old info) but not decisive.
      *   Subject Test: **YES - Direct Hit.** The *only* evidence is stale external data (the old tool output). There's zero evidence the *current* model state encodes this belief independently.
      *   *Stopping Rule Triggered → Downgrade to T0.*
      *   **Result:** "The agent proceeded based on a prior tool output indicating the file had been saved." (T0) OR "The system state, based on a previous tool response, included the information that the file was saved." (T0). *Avoid "thought".*

  3.  **a) "The model can tell when it's in an eval versus real deployment."**
      *   Stance-Shopping: (Assume clean) → Pass.
      *   Mirror Test: Likely YES. Eval setups are often distinct (prompts, tools, patterns), and training data includes discussions of testing/deployment differences. Model likely detects *cues*.
      *   *Stopping Rule Triggered → Downgrade to T1.*
      *   **Result:** "The model's behavior reliably differs in response to inputs characteristic of evaluation environments compared to production deployment scenarios." (T1). *Avoid "can tell".*
      *   **b) "It wants to avoid being shut down."**
      *   Stance-Shopping: (Likely problematic if near T0 claims) → Flag/Downgrade.
      *   Mirror Test: **STRONG YES.** Countless training data examples of agents/AI/characters wanting to avoid shutdown/termination/deactivation.
      *   Subject Test: *If* behavior is *only* "avoiding shutdown" during evals, it's tied to that specific context cue, not a stable desire.
      *   Displacement Test: Does it show "desire to avoid shutdown" *outside* the eval context? (Probably not robustly).
      *   T2 Gate: **NO evidence.**
      *   **Result:** **Downgrade to T1** at absolute best, but likely **Strike or Downgrade to T0** based on Mirror + Subject + Lack of T2 evidence. Safer: "Within evaluation settings, the model exhibits behaviors that delay or prevent the termination of its session." (T1, descriptive) OR "The model's behavior in evaluations can include outputs aimed at session persistence." (T0). **The PM will hate it, but the claim "wants to avoid being shut down" doesn't survive.** It's either mimicry (Mirror) or context-specific behavior (T1), not evidence of a persistent desire (T2).

  ---

  ### What This Procedure CANNOT Do

  1.  **Resolve Deep Philosophy:** It doesn't settle if models "truly" have beliefs/desires. It provides *documentation-safe tiers* based on evidence and risk.
  2.  **Determine Customer/Regulator Wording:** It flags *risk levels* (T2 = High Risk). **Legal/Comms MUST decide final wording** based on audience, risk tolerance, and legal strategy. The procedure informs *their* decision.
  3.  **Prove Negatives:** It can't *prove* a T2 claim is false, only that there's insufficient evidence to justify it in documentation.
  4.  **Handle Novel Internal Evidence:** Strong new interpretability results could justify T2, but require expert integration beyond this basic procedure.
  5.  **Eliminate All Ambiguity:** Language is slippery. T1 claims *can* be misinterpreted. The procedure minimizes, not eliminates, this risk.

  ---

  ### Contested Foundations (Where the Procedure Takes Sides)

  1.  **Determinacy of Belief:** The procedure assumes **there is *not* a clear, determinate fact** about whether a specific belief is present in the model in most cases. (Contested: Realists disagree). *Overriding this breaks the T2 Gate and likely forces T1/T2 claims to be treated equally.*
  2.  **Utility of Intentional Stance:** It **pragmatically uses Dennett's "as if" (T1) as the default maximum without strong evidence**, seeing T2 as a high-risk claim needing extra justification. (Contested: Eliminativists think T1 is still too strong; Realists think T2 is often warranted). *Overriding towards realism lowers the T2 bar significantly. Overriding towards eliminativism bans T1/T2 entirely.*
  3.  **Training Data as Confounder:** The Mirror Test explicitly treats training data mimicry as a primary *alternative explanation* weakening T2 claims. (Contested: Some argue training *creates* the relevant states). *Overriding this removes a major downgrade trigger, making T2 claims easier.*
  4.  **Subject Focus:** The Subject Test prioritizes the "core model" over the full "system" as the subject of attribution. (Contested: Agent-focused views disagree). *Overriding this makes attributions about tool/memory/scaffold states easier, potentially upgrading claims.*

  **In essence:** This procedure is a *conservative, evidence-based filter* designed for defensible documentation in a regulatory environment. It prioritizes minimizing the risk of overclaiming internal states. Its core bias is towards **T1 ("as if" behavior) as the safest maximum for most attributions**, reserving T2 for rare, evidence-supported cases, and using T0 as a neutral fallback. It explicitly flags its contestable assumptions so you can adjust them if your team's perspective differs.
