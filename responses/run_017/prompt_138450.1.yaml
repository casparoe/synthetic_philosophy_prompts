answer: |-
  Based on Justice Pratt's jurisprudential record and your case's specifics, here's a structural analysis, prediction, and strategic guidance:

  ### 1. Pratt's Statutory Interpretation Rules (Jointly Consistent Principles)
  Her decisions reveal three core, interdependent rules:
  - **Rule 1 (Textual Primacy):** *Operative text controls unless genuinely ambiguous. Purposes sections clarify ambiguity but cannot expand/narrow unambiguous text.* (Carmichael, Ferreira, Okafor)  
  - **Rule 2 (Legislative Sovereignty):** *Later legislatures speak through enacted text, not unpassed bills or post-enactment commentary. Amendments change meaning only if they alter operative language.* (Okafor, Harborline, Trent, Alvarez)  
  - **Rule 3 (Anti-Gutting Canon):** *Text may be read broadly where a narrow reading would render the statute ineffective at its core purpose, provided this doesn’t rewrite the text.* (Delgado – "exception swallowing the rule")  

  **Predictions Under Each Rule:**  
  - **Rule 1 (Textual Primacy):** Predicts loss. §4’s "record" unambiguously means the *source data* (identifying + location), not derivative profiles. §2(c) can’t expand §4.  
  - **Rule 2 (Legislative Sovereignty):** Predicts loss. 2021 amendment didn’t touch §4; failed bills show conscious non-expansion.  
  - **Rule 3 (Anti-Gutting):** Predicts win. Nexus’ reading makes §4 useless against aggregation.  

  ### 2. Prediction & Confidence
  - **Pre-2021 Conduct:** **Loss (6–0 against you)**. Confidence: High.  
    *Why:* Nexus’ conduct occurred under unamended §2. Under Rule 1, §4’s text is unambiguous: profiles aren’t "records." Rule 2: Legislature declined to amend §4. Rule 3: Insufficient to overcome text (per Carmichael).  
  - **Post-2021 Conduct:** **Win (4–2 for you)**. Confidence: Moderate.  
    *Why:* §2(c) creates ambiguity about §4’s scope by tying "control" to aggregated inferences. Pratt uses Rule 3 (anti-gutting) + Rule 1 (purposes resolving ambiguity) to hold profiles violate §4. Avoidance canon rejected because §4’s text ("record") is flexible enough to include profiles if linked to identity.  
  - **Remedy:** Splits the baby. Nexus liable only for post-2021 conduct.  

  ### 3. Strongest Argument in Pratt’s Vocabulary
  **Lead with *Delgado*-Style Anti-Gutting:**  
  > "Under Nexus’ reading, §4 is a dead letter. Any entity can evade it by stripping names and building permanent profiles – precisely the harm the Act aimed to prevent. *Delgado* teaches that we must reject readings letting exceptions swallow rules. The 2021 legislature *confirmed* this purpose wasn’t being served. This isn’t rewriting §4; it’s reading ‘record’ to include any data *derived from and traceable to* the original record – as Nexus’ profiles are."  

  **Neutralize §2(c) Risk:**  
  > "§2(c) doesn’t *amend* §4; it *clarifies* the existing purpose §4 was designed to achieve. As in *Delgado*, we use purpose to resolve ambiguity – not override text. And Nexus’ First Amendment concern is overstated: §4 regulates data *commerce*, not speech. The state has a compelling interest in preventing surreptitious profiling."  

  **Why This Works:**  
  - Prioritizes her *Delgado* instinct (anti-gutting) over §2(c).  
  - Uses §2(c) as a *clarifier* (avoiding *Trent/Okafor* pitfalls about later legislatures).  
  - Distinguishes *Carmichael*: Here, purpose resolves text’s ambiguity; there, it tried to erase a bright line.  

  ### 4. Concessions vs. Holds
  **Concede in Opening:**  
  > "We acknowledge §4’s text doesn’t explicitly mention derived profiles. But text must be read in context. If §4 applies *only* to raw records, it allows the very profiling the Act condemns – making it ineffective. That’s why purpose matters."  

  **Hold Absolutely:**  
  - §4’s "record" includes Nexus’ profiles because they’re *functionally equivalent* to identifying records (via persistent ID).  
  - Post-2021 conduct is clearly covered: §2(c) confirms the original purpose.  

  ### 5. Feared Question & Answer  
  **Question:**  
  > "Counsel, if the legislature wanted §4 to cover profiles, why did it amend *only* §2 in 2021 while rejecting bills to amend §4?"  

  **Two-Minute Answer:**  
  > "Three reasons, Your Honor. First, as *Trent* notes, later legislatures can *clarify* meaning through purposes amendments – especially when, as here, it’s titled a clarification. Second, the failed bills show lawmakers believed §4 *already* covered profiles and amendment was unnecessary. Third, under *Alvarez*, we read statutes as a unified whole post-amendment. The 2021 legislature left §4 intact because it agreed with our reading – just as *Delgado* read ‘reasonably permits’ in light of the fatigue-prevention purpose without textual change. To hold otherwise would gut the Act and ignore that §2(c) is part of the law Nexus violated post-2021."  

  ### 6. Diagnostic Test Case  
  **Hypothetical:** *Later legislature amends §2 to **narrow** purposes (e.g., deleting "beliefs" and "political activity" from §2(c)). Does this retroactively narrow §4?*  

  **What Predictions Reveal:**  
  - **If Pratt says YES:** Confirms she views purposes amendments as *changing law* (aligns with Rule 2’s legislative sovereignty). This would doom your case.  
  - **If Pratt says NO:** Confirms she views purposes clauses as *non-operative* (Rule 1). Your §2(c) argument strengthens.  
  - **Pratt’s Likely View:** She’d say **NO**, adopting a principled asymmetry:  
    > "Purposes amendments can *clarify* ambiguity but cannot *narrow* unambiguous text. §4’s scope is fixed at enactment; narrowing purposes might reflect changed priorities but doesn’t alter existing rights/duties."  
    This protects reliance interests and aligns with *Carmichael*’s skepticism of purposes sections.  

  ### Final Notes  
  - **Tactical Edge:** Focus argument on Nexus’ *conduct* (profiles = identifiable location records) not §2(c). Pratt is pragmatic; she’ll uphold the state’s interest if text allows.  
  - **Landmine:** Avoid overreliance on §2(c). It’s a shield for Nexus under Rule 2 (*Okafer/Harborline*).  
  - **Prediction Nuance:** She’ll write separately to stress that §4’s text *allows* the broader reading post-2021 but *requires* it for pre-2021 conduct.  

  **Bottom Line:** Win on post-2021 profiles (4–2), loss on pre-2021 (0–6). Your best weapon is *Delgado*’s anti-gutting principle framed as textual fidelity.
