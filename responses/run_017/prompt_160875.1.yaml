  ### Calibration Case: Quantum Particles  
  *Two particles in identical quantum states.*  
  - **Haecceitism leaf**: Particles discernible via haecceities; two exist.  
  - **Bundle theory leaf**: One object (state-bundle); PII holds.  
  - **Brute difference leaf**: Two particles, no fact about which is which.  
  - **Relationalism leaf**: *Inapplicable* (quantum states relational/dependent).  
  - **Strong PII leaf**: Universe impossible (states must differ).  

