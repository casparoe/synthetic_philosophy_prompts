  ### Decision Tree: Identity of Indiscernibles  
  *Based on Black’s spheres and variants; for a second-year metaphysics reading group. British English throughout.*  

  1. **Is Black’s symmetric universe possible?** (Two exactly similar spheres, one mile apart, in an otherwise empty universe. Perfect symmetry.)  
     - *No*: Go to 2.  
     - *Yes*: Go to 3.  

  2. **Why is it impossible?**  
     - *Because space is relational*: Positions require relations, but with no background "container," two distinct locations cannot exist without external reference points.  
       → **Leaf: Relationalism about spacetime** (Universe impossible; spheres collapse into one or space is monadic).  
     - *Because indiscernible duplicates violate a necessary truth*: Two objects *must* differ qualitatively.  
       → **Leaf: Strong PII restriction** (Universe impossible; PII holds necessarily).  

  3. **What grounds the spheres’ distinctness in Black’s universe?** (They are numerically distinct but indiscernible.)  
     - *A non-qualitative "thisness" (haecceity)*: Each sphere has a primitive identity beyond properties.  
       → Go to 4.  
     - *Nothing qualitative or non-qualitative*: Distinctness is brute, ungrounded.  
       → Go to 5.  

  4. **Consider the non-simultaneous variant:** Sphere A exists for an hour, is annihilated; an hour later, a qualitative duplicate Sphere B appears. **Is there a fact about which sphere would have been annihilated if we "swapped" the scenario?** (E.g., if Sphere B were destroyed instead of A in a counterfactual.)  
     - *Yes*: Haecceities fix identity across counterfactuals.  
       → **Leaf: Haecceitism** (Distinctness grounded in primitive identities; PII false. *Quantum calibration*: Particles have haecceities; two exist with distinct identities even in identical states).  
     - *No*: Incoherent with haecceitism.  
       → **Empty node** (Incoherent; haecceitism requires de re facts).  

  5. **In the non-simultaneous variant, are there two distinct spheres?**  
     - *No*: Only one sphere exists, just at different times (individuation via temporal properties).  
       → **Leaf: Bundle theory with impure properties** (Objects are bundles including time-indexed properties; PII holds trivially. *Quantum calibration*: One object in two "places" if states overlap).  
     - *Yes*: Two spheres exist despite qualitative duplication.  
       → Go to 6.  

  6. **In the non-simultaneous variant, is there a fact about which sphere is "first" and "second" across counterfactuals?** (E.g., if the timing were reversed, would Sphere A become Sphere B?)  
     - *No*: No haecceities or qualitative grounds for transworld identity.  
       → **Leaf: Brute numerical difference** (Distinctness ungrounded; PII false. *Quantum calibration*: Two particles in the same state, no fact about which is which).  
     - *Yes*: Contradicts brute difference (requires identities).  
       → **Empty node** (Incoherent; brute difference excludes de re facts).  

