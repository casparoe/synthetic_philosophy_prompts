  ### Marking Scheme (Total: 20 marks)  
  1. **Cycle Construction & Feature Identification** (7 marks)  
     - 4 marks: Correct profile with transitive preferences and explicit cycle.  
     - 3 marks: Correct structural feature (non-separable/meddlesome preferences).  
     - *Typical mistake: Cycle not forced by rights/Pareto; preferences intransitive.*  

  2. **Sphere-Deference Proof & Implications** (6 marks)  
     - 3 marks: Proof that rights constraints ⊆ Pareto relation.  
     - 2 marks: Acyclicity argument.  
     - 1 mark: Clear "buys" (transitive ordering) and "costs" (domain restriction).  
     - *Typical mistake: Claiming Sphere-Deference implies unanimity but not linking to acyclicity.*  

  3. **Laundering & Reply Analysis** (7 marks)  
     - 3 marks: Showing Method A yields total order (or Method B = Sphere-Deference) + example application.  
     - 4 marks: Correct conclusion (laundering imposes domain restriction; not a dissolution).  
     - *Typical mistake: Asserting laundering "solves" paradox without noting domain change.*  

  #### Additional Guidance  
  - **A (17–20):** All tasks complete; proofs rigorous; analysis insightful.  
  - **B (12–16):** Cycle and Sphere-Deference correct but laundering/reply analysis weak.  
  - **C (7–11):** Partial answers (e.g., cycle only); major gaps in proofs.  
