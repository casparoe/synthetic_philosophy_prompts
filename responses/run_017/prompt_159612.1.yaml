  ### Exam Question: Sen's Liberal Paradox in a Structured Setting

  #### Setting
  Consider a society with three individuals (1, 2, 3) and a set of social alternatives defined as the product of three binary personal spheres. Each individual \(i\) has a protected coordinate (sphere) \(x_i \in \{0, 1\}\). An alternative is a triplet \((x_1, x_2, x_3)\), yielding 8 possible alternatives.  
  - **Rights assignment (Own-Sphere Decisiveness):** For each individual \(i\), society must respect \(i\)'s strict preferences over any pair of alternatives differing *only* in coordinate \(i\). Formally, if \(a\) and \(b\) differ solely in \(x_i\), then \(a \succ_i b\) implies \(a \succ_S b\), and \(b \succ_i a\) implies \(b \succ_S b\).  
  - **Pareto condition (Strong):** If all individuals strictly prefer alternative \(a\) to \(b\) (\(a \succ_i b\) for all \(i\)), then society must strictly prefer \(a\) to \(b\) (\(a \succ_S b\)).  

  Social preference \(\succ_S\) must be acyclic (no cycles) and extendable to a complete transitive ordering.  

  #### Tasks  
  1. **Reconstruct the Impossibility** (7 marks)  
     Provide an explicit preference profile (complete transitive orderings for all individuals) over the 8 alternatives where the rights assignments and Pareto condition force a cycle in social preference. Identify the structural feature of your profile causing the cycle.  

  2. **Sphere-Deference Condition** (6 marks)  
     Define *Sphere-Deference*: For every individual \(i\), every sphere \(j\), and every pair \(a, b\) differing only in coordinate \(j\), \(i\) ranks \(a\) vs. \(b\) exactly as \(j\) ranks them.  
     Prove or refute: Under Sphere-Deference, the union of rights-generated and Pareto-generated constraints is contained in the Pareto relation, ensuring no conflict/cycle. Explain what this "buys" (e.g., type of social ordering achievable) and what it "costs" (e.g., assumptions needed).  

  3. **Meddlesome Preferences Reply** (7 marks)  
     The "meddlesome preferences" reply proposes laundering preferences: Replace each individual's ranking over others' spheres with the owners' rankings. For pairs differing in one coordinate, laundering uses the owner's ranking. For pairs differing in multiple coordinates, consider:  
     - **Method A (Lexicographic):** Fix an order of coordinates (e.g., 1,2,3). Compare \(a\) and \(b\) at the first differing coordinate \(j\); use \(j\)'s ranking. If equal, proceed to next differing coordinate.  
     - **Method B (Sphere-Deference):** Define laundered ranking via Sphere-Deference.  
     Either:  
     (i) Give a profile where Method A yields a cyclic laundered relation for some individual, or  
     (ii) Show that Method B always yields an ordering.  
     Then, analyze the reply: Does laundering "dissolve" the paradox, or does it impose a domain restriction (like Sphere-Deference)? Explain what your result shows.  

  ---

  ### Model Answer (Approx. 850 words)  

  #### 1. Reconstructing the Impossibility (Cycle)  
  Consider alternatives:  
  - \(A = (0,0,0)\), \(B = (1,0,0)\), \(C = (1,0,1)\).  
  Preferences:  
  - Individual 1: \(C \succ_1 A \succ_1 B\)  
  - Individual 2: \(C \succ_2 A \succ_2 B\)  
  - Individual 3: \(B \succ_3 C \succ_3 A\) (transitive: \(B \succ_3 C\) and \(C \succ_3 A\) imply \(B \succ_3 A\)).  

  **Rights constraints:**  
  - \(A\) vs. \(B\) (differ only in \(x_1\)): Individual 1 prefers \(A \succ_1 B\) → Society: \(A \succ_S B\).  
  - \(B\) vs. \(C\) (differ only in \(x_3\)): Individual 3 prefers \(B \succ_3 C\) → Society: \(B \succ_S C\).  

  **Pareto constraint:**  
  - \(C\) vs. \(A\): All prefer \(C \succ_i A\) (\(C \succ_1 A\), \(C \succ_2 A\), \(C \succ_3 A\)) → Society: \(C \succ_S A\).  

  **Cycle:** \(A \succ_S B \succ_S C \succ_S A\).  
  **Structural feature:** Non-separable preferences. Individual 1’s decisiveness forces \(A \succ_S B\) based on \(x_1\), but their overall ranking \(C \succ_1 A\) depends on \(x_3\) (preferring \(C\)’s \(x_3=1\) over \(A\)’s \(x_3=0\)), overriding their own-sphere preference when combined with others.  

  #### 2. Sphere-Deference: Proof and Implications  
  **Claim:** Under Sphere-Deference, rights and Pareto constraints cannot conflict.  
  **Proof:**  
  - Take any pair \(a, b\) differing only in coordinate \(j\). Rights require society to follow \(j\)’s ranking.  
  - Sphere-Deference implies all \(i\) rank \(a\) vs. \(b\) identically to \(j\). Thus, \(j\)’s ranking is unanimous.  
  - Hence, rights constraints are *subset* of Pareto constraints (which demand unanimity).  
  - The Pareto relation is the intersection of individual strict preferences. Since individual preferences are transitive, the Pareto relation is a strict partial order (asymmetric and transitive), hence acyclic.  
  - Thus, the union of rights and Pareto constraints (which = Pareto constraints) is acyclic.  

  **What it buys:** A complete transitive social ordering exists satisfying rights and Pareto (e.g., extend Pareto relation).  
  **What it costs:** Domain restriction: Sphere-Deference assumes individuals defer completely to sphere owners on single-coordinate differences. This is a strong, unrealistic restriction on preferences (e.g., no disagreement on "private" matters).  

  #### 3. Laundering and the Meddlesome-Preferences Reply  
  **Method A (Lexicographic) always yields transitive laundered preferences:**  
  - Lexicographic orders (with fixed coordinate priority) are always transitive.  
  - Thus, Method A produces a total order for each individual.  

  **Example analysis (using Task 1’s profile):**  
  Launder preferences via Method A (coordinate order: 1,2,3):  
  - **Individual 1’s laundered ranking:**  
    - \(A\) vs. \(B\) (differ in \(x_1\)): Use own ranking → \(A \succ_{L_1} B\).  
    - \(B\) vs. \(C\) (differ in \(x_3\)): Use individual 3’s ranking (\(B \succ_3 C\)) → \(B \succ_{L_1} C\).  
    - \(A\) vs. \(C\) (differ in \(x_1,x_3\)): First differing coordinate \(x_1\): \(A\) has 0, \(C\) has 1. Individual 1 prefers 0 → \(A \succ_{L_1} C\).  
    Result: \(A \succ_{L_1} B \succ_{L_1} C\) (transitive).  
  - **Individual 2’s laundered ranking:**  
    - \(A\) vs. \(B\) (differ in \(x_1\)): Use individual 1’s ranking (\(A \succ_1 B\)) → \(A \succ_{L_2} B\).  
    - \(B\) vs. \(C\) (differ in \(x_3\)): Use individual 3’s ranking (\(B \succ_3 C\)) → \(B \succ_{L_2} C\).  
    - \(A\) vs. \(C\): First differing coordinate \(x_1\): Use individual 1’s ranking (0>1) → \(A \succ_{L_2} C\).  
    Result: \(A \succ_{L_2} B \succ_{L_2} C\).  
  - **Individual 3’s laundered ranking:**  
    - \(B\) vs. \(C\) (differ in \(x_3\)): Use own ranking → \(B \succ_{L_3} C\).  
    - \(A\) vs. \(B\) (differ in \(x_1,x_3\)? First differing coordinate \(x_1\): \(A\)=0, \(B\)=1; individual 1 prefers 0 → \(A \succ_{L_3} B\).  
    - \(A\) vs. \(C\): First differing coordinate \(x_1\): \(A\)=0, \(C\)=1 → \(A \succ_{L_3} C\).  
    Result: \(A \succ_{L_3} B \succ_{L_3} C\).  

  Laundered profile is unanimous: \(A \succ_L B \succ_L C\) for all \(i\). Applying rights/Pareto:  
  - Rights: \(A \succ_S B\) (from \(x_1\), laundered \(A \succ_{L_1} B\)), \(B \succ_S C\) (from \(x_3\), laundered \(B \succ_{L_3} C\)).  
  - Pareto: Unanimous \(A \succ_L B\), \(B \succ_L C\), \(A \succ_L C\) → no cycle.  

  **Analysis of the reply:**  
  - Laundering (Method A) produces a profile satisfying Sphere-Deference on single-coordinate pairs (by construction).  
  - The conflict disappears because laundering *restricts the domain* to Sphere-Deference profiles, where (as shown) no cycle occurs.  
  - This is **not a dissolution of the paradox** in the original unrestricted domain. It is a **domain restriction** (to Sphere-Deference) that avoids the conflict by assuming away meddlesomeness.  
  - Method B (explicit Sphere-Deference) is equivalent to this domain restriction. The reply reframes the paradox as a domain issue but does not resolve it under minimal liberalism with unrestricted preferences.  

