     Under Sphere-Deference, for any pair (a,b) differing only in coordinate j, every individual i defers to j's ranking. Therefore, on such a pair, all individuals have the same ranking as j. Hence, the social preference required by individual j's decisiveness is the same as the unanimous preference of all individuals, and thus is also required by the Pareto condition. Therefore, the union of the rights and Pareto constraints is contained in the Pareto relation, which is the intersection of individual preferences. Since individual preferences are transitive, the Pareto relation is a strict partial order (acyclic). Hence, no cycle is forced.

