prompt: |-
  I have been trying to work out what I actually believe about direct democracy, and the only honest way I can get at it is by recording my gut verdict on particular decisions and seeing what shape they have. Below are the cases with the answer I find myself giving. Most I am settled on; one I oscillate about; and there are three places where my verdicts will not sit comfortably together.

  Settled verdicts:

  1. Whether our town should merge its administration with the neighbouring town's: a direct vote of both electorates strikes me as entirely proper.
  2. Whether to build a tram line paid for by a dedicated local levy: proper.
  3. Whether a new housing development should go up on the edge of town: proper, though I would not extend that to the design of the regional housing target it contributes to.
  4. Whether to retain the death penalty for a narrowly defined category of murder: should not be settled by a statewide vote.
  5. Whether to ban the construction of new minarets nationwide, of the kind that has in fact been put to the Swiss electorate: should not be settled by a vote.
  6. Whether to raise the top rate of income tax by five points: should not be settled by a vote, because it has to be weighed against spending and borrowing in a way that a single yes/no question cannot capture.
  7. Whether to leave a supranational union, along the lines of the 2016 British vote: should not have been settled by a vote.
  8. Whether to legalise assisted dying: I think this one is a proper subject for a vote.
  9. A proposition of the sort that has appeared on Californian ballots, providing that any future increase in a tax must carry a legislative supermajority: should not be put to a vote, and putting it to a vote strikes me as worse than the legislature simply enacting it.
  10. A proposition stipulating that it may itself be amended only by a further referendum: not proper either, and I cannot get myself to care much about whether this is worse or better than case 9.

  The case I go back and forth on:

  11. Ratifying an international treaty that restricts what future governments may do for the next thirty years. Half the time this looks like the ideal referendum subject: a large, determinate, self-contained commitment that everyone will have to live under. The rest of the time it looks like exactly the rule-changing I object to in 9 and 10.

  Where my verdicts will not cohere:

  12. Cases 1 and 7 are both about the boundaries and composition of political units, and I answer them oppositely. If my objection to 7 is that the leave option had no determinate content — no one was voting for a describable state of affairs — then I should be more uneasy about 2 and 3 than I am, since those options are fuzzy too. If my objection is irreversibility, then I owe an account of why borrowing to build a railway, which is also hard to undo, is not disqualified as well. I cannot tell which objection I am actually making.
  13. Case 8 sits badly with 4 and 5. All three concern life, death and ultimate value, and in each case a majority would be disposing of something belonging mainly to a vulnerable minority. The only difference I can locate is that 8 permits something for those who seek it while 4 and 5 impose on the unwilling — but I suspect that is special pleading in defence of a verdict I happen to like.
  14. The same question put to the voters by the council feels fine to me; the same question forced onto the ballot by a petition of signatures makes me uneasy. I cannot tell whether that is a distinction a principle should recognise or just my distrust of petition campaigns.

  My tentative principle, such as it is: a decision is properly put to a direct vote when both options are determinate, when it can be settled on its own without being traded off against other decisions, and when it does not dispose of the interests of people who cannot defend themselves at the ballot box; everything else belongs to a legislature.

  What I would like from you: state the principle that best fits these verdicts — one principle if there is one, otherwise the smallest set of principles that does the work — and for each clause name the case that forces it. Then tell me plainly which of my verdicts the principle cannot accommodate and which, if any, I ought to give up rather than add a clause for. Finally, give its verdicts on the cases I have not settled: case 11, and also an advisory rather than binding referendum, a citizens' assembly selected by lot and given binding power instead of a referendum, a minimum turnout or quorum rule, a vote on whether to hold a vote, and a secession question where the seceding region contains a fifth of the electorate. Argue it out rather than pointing me to the literature; I am not after reading recommendations.

  Please lead with your bottom line in the first sentence — the principle itself, or the flat statement that no single principle fits and which verdict has to go — and only then give the reasoning, with no preamble and no restatement of what I have asked.
reasoning: |-
  Hmm, the user is wrestling with when direct democracy is appropriate. They've listed 14 specific cases with their gut reactions and identified three tension points. They want me to extract a coherent principle from their judgments, identify where it conflicts with their intuitions, and apply it to unresolved scenarios.

  Looking at their settled verdicts: They support local administrative mergers (1), local infrastructure projects with dedicated funding (2), and local housing developments (3), but oppose statewide votes on death penalty (4), national religious symbol bans (5), tax increases (6), supranational union exits (7), and constitutional supermajority requirements (9-10). They support assisted dying referendums (8). 

  The key tensions they note: 
  - Why approve town mergers but reject Brexit (12)? Both deal with political boundaries. 
  - Why allow assisted dying votes but not death penalty/minaret bans (13)? All involve minority rights. 
  - Why prefer council-initiated referendums over petition-driven ones (14)? 

  Their tentative principle has three elements: determinate options, no policy trade-offs needed, and no dispossession of vulnerable minorities. 

  Now to build a coherent framework that explains their judgments. The local/national distinction seems crucial - they accept direct democracy for concrete local matters but reject it for complex/national issues. The reversibility factor also appears in their Brexit objection. For life/death issues, the distinction between permitting vs prohibiting acts explains their assisted dying vs death penalty/minaret positions. 

  Their petition distrust (14) suggests an institutional legitimacy dimension - they trust representative bodies more than activist-driven processes. 

  Synthesizing these, I arrive at a three-part principle: 
  1) Matters requiring irreversible constitutional/system change should require representative deliberation 
  2) Decisions disproportionately affecting ballot-excluded minorities need protection 
  3) Concrete implementation questions are referendum-suitable if locally bounded 

  This explains most cases well: 
  - Local mergers (1) and housing (3) are implementation 
  - Death penalty (4), minarets (5), Brexit (7), tax constraints (9-10) are constitutional/system changes 
  - Assisted dying (8) is implementation (permits choice) while death penalty (5) imposes on minorities 

  Now the conflicts: 
  - Case 2 (tram line) is reversible despite local borrowing - but it's concrete/local so passes 
  - Their petition distrust (14) isn't fully covered, but fits under "representative gatekeeping" in part 1 

  For unresolved cases: 
  - Treaty ratification (11) fails as constitutional change 
  - Advisory referendums are acceptable since non-binding 
  - Citizen assemblies could work if properly designed 
  - Turnout rules are procedural, not substantive 
  - Votes about votes risk circularity 
  - Secession requires supermajority due to irreversibility 

  The principle conflicts with their approval of case 1 (town merger) which could be seen as constitutional change, but I argue local administrative reshuffles lack the gravity of national constitutional changes. 

  Final principle: "Direct votes are legitimate only for (a) reversible implementation decisions within existing constitutional frameworks, (b) affecting primarily voters equally, (c) initiated by representative bodies."
answer: |-
  Here is the principle that best fits your verdicts: **Direct democracy is legitimate only for reversible implementation decisions (not constitutional/system changes) that primarily affect voters equally, initiated by representative bodies.**

  ### The Principle Broken Down with Supporting Cases:
  1. **Must be implementation, not constitutional/system change (irreversible rule-altering):**  
     Cases forcing this: Death penalty (4), minaret ban (5), Brexit (7), tax supermajority (9), self-amendment (10), treaty ratification (11). These alter foundational rules or bind future choices.  
     *Exception:* Town merger (1) is administrative implementation, not constitutional change.

  2. **Must be reversible (or low-cost to undo):**  
     Cases forcing this: Brexit (7) vs. tram line (2). Borrowing for infrastructure (2) is reversible (e.g., sell assets, adjust levies); leaving a union (7) is not. Irreversibility disqualifies system-change questions.

  3. **Must not disproportionately harm ballot-excluded minorities:**  
     Cases forcing this: Death penalty (4) and minaret ban (5) impose harm on vulnerable groups (condemned, religious minorities). Assisted dying (8) permits choice without imposing on others, so passes.

  4. **Must be concrete/local, not requiring trade-offs:**  
     Cases forcing this: Tax rise (6) fails as it requires balancing budgets; tram line (2) passes as funded by a dedicated levy. Housing design (3) is local/concrete; regional targets would require trade-offs.

  5. **Must be initiated by representative bodies, not petitions:**  
     Case forcing this: Your unease with petition-driven votes (14) vs. council-initiated ones. Petitions lack institutional scrutiny, risking agenda-setting by motivated groups.

  ### Verdicts the Principle Cannot Accommodate:
  - **Case 1 (town merger):** Your approval conflicts slightly, as mergers could be seen as irreversible system change. The principle tolerates it because it’s administrative (implementation) and local.  
  - **Case 8 (assisted dying):** Fits under "implementation" and no disproportionate harm (permits choice), so accommodated.  
  - **Case 13 tension (4/5 vs. 8):** Resolved by the "impose vs. permit" distinction—only imposing harm on minorities is barred.  

  **Verdict to give up:** None. Your judgments cohere under this framework.  

  ### Verdicts on Unsettled/New Cases:
  - **11. Ratifying a 30-year treaty:** **Not proper.** It binds future governments irreversibly (system change), akin to cases 9/10.  
  - **Advisory referendum:** **Permissible.** Non-binding, so lacks irreversibility; useful for consultation without violating core criteria.  
  - **Citizens’ assembly with binding power:** **Legitimate alternative.** Random selection ensures diverse representation, addressing minority harm and complexity concerns better than direct votes.  
  - **Minimum turnout/quorum:** **Acceptable procedure.** Ensures legitimacy without altering the substantive principle (e.g., 40% quorum for Brexit might have improved mandate quality).  
  - **Vote on whether to hold a vote:** **Circular but tolerable if representative-initiated.** E.g., legislature referring "Should we vote on X?" as a gatekeeping step.  
  - **Secession (seceding region = 20% of electorate):** **Not proper.** Secession is irreversible system change (like Brexit) and affects all citizens. Requires supermajority + legislative approval, not simple referendum.  

  ### Why This Works:
  - **Fixes your tensions:**  
    - **Tension 12 (1 vs. 7):** Mergers are reversible implementation; Brexit is irreversible system change.  
    - **Tension 13 (4/5 vs. 8):** Only 4/5 impose harm on minorities; 8 permits autonomy.  
    - **Tension 14 (petition vs. council):** Petitions bypass representative scrutiny, risking capture.  
  - **Minimal and predictive:** No ad hoc clauses needed. It rejects vague/irreversible/national votes (Brexit, death penalty) but allows local/concrete/reversible ones (tram, housing).  
  - **Accommodates all settled verdicts** once town merger (1) is deemed implementation, not system change.
