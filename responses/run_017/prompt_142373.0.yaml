prompt: |-
  I'm writing a short position paper for a workshop on decision-making under normative uncertainty — half the room will be philosophers, half people who have to make funding and research decisions on behalf of others, so I've tried to state my views in plain terms and without hedge-words — and before I circulate it I want to know whether the package I've assembled actually hangs together. Here, as compressed as I can make it, is where I've landed.

  (a) The right response to normative uncertainty is to hedge: assign each of the first-order normative theories I take seriously my credence in it, weight how much it favors each available option by that credence, and choose the option with the highest weighted total. I individuate theories coarsely for this purpose — utilitarianism, pluralist deontology, contractualism, a virtue-theoretical view — rather than splitting each into variants. (b) But I resist a move that (a) appears to need. Most of the theories I give non-negligible credence to are not consequentialist: they contain constraints, options, and supererogation, and they do not rank options by how much value each produces. So I don't think every theory can be made to yield a cardinal measure of the degree to which it favors an option, and I especially don't think a deontic constraint should be represented as a very large disvalue — that strikes me as misdescribing what such a theory says, not merely as leaving something unmeasured. (c) I reject what I'll call the domination of tiny chances: I don't accept that for any small credence there is a payoff large enough that the product swamps every competing consideration, and in particular I am unmoved by arguments of the form that some small chance of shaping an astronomically large future beats everything else. (d) At the same time I am a strict probabilist about credence: credences satisfy the probability calculus and update by conditionalization; the practical stakes of a decision do not get to raise or lower the credence itself; and adjusting credences at the point of decision — discounting them, capping them, treating small ones as zero because the payoff makes me nervous — is ad hoc. (e) I take the persistent disagreement of people I count as epistemic peers in moral philosophy to be genuine evidence, and I think it should flatten my credence distribution substantially toward rough parity among a handful of views even where my own arguments point one way; and I don't see why this should stop at the first-order level, since my peers disagree about how to respond to normative uncertainty itself. (f) I think I have weighty obligations to particular others — my collaborators, my students, my own long-standing projects — that are not merely instrumental contributions to impartial value and that do not disappear under aggregation. (g) And here is the case I test everything against: a research protocol would expose one identifiable, non-consenting person to a small risk of death; I have about 0.9 credence in a pluralist view that forbids this regardless of the aggregate benefit, and about 0.1 in a utilitarian view on which the protocol has roughly a one-in-a-thousand chance of unlocking something that would go extremely well for an astronomically large number of future people and is otherwise worthless. I think the answer is that we don't run it; I think I'd give that answer if the chance were one in a million and the payoff a million times larger; and I think I'd go on giving it as my credence in the utilitarian view rose, until somewhere near the very top of the range the answer would switch — but not gradually, and not because the stakes had grown. (h) Finally, I think that very often the right thing is to postpone the decision and go do more moral philosophy first, and I want that to be an option inside the deliberation rather than an excuse for avoiding it.

  What I want is an audit, not a survey: I don't need the literature, a reading list, or a history of who said what. My collaborators keep insisting that (c) and (d) are the pair that cannot both be true; I'm not convinced, since it seems to me I might keep strict probabilism about credences and locate my resistance to astronomical-payoff reasoning somewhere else entirely, though I can't say exactly where — so please don't simply ratify their diagnosis either. Rank the tensions by how severe they actually are instead of listing them as equals; for each genuine one, say precisely what would have to give and what the cheapest repair would be; tell me which of the apparent conflicts dissolve under inspection and why; and where one of my commitments is not really inconsistent but merely underspecified, identify the missing parameter and how much work it is doing. If I had to surrender exactly one item to make the rest cohere, which should it be, and what would surrendering it cost me?
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They've presented a compressed version of their position paper on decision-making under normative uncertainty and want an audit of its internal coherence. Specifically, they’re concerned about potential tensions, especially between points (c) and (d), which their collaborators argue can't both be true. 

  First, I need to unpack each of their points. Point (a) advocates for hedging by weighting normative theories based on credence. (b) rejects the idea that non-consequentialist theories can be forced into a cardinal scale. (c) refuses to let tiny chances dominate decisions, even with huge payoffs. (d) insists on strict probabilism for credences, without letting stakes influence them. (e) uses peer disagreement to flatten credences across theories. (f) emphasizes personal obligations that aren't impartial. (g) presents a test case where a risky protocol is rejected despite high potential payoff. (h) values postponing decisions for more moral deliberation.

  The user's main worry is whether these points cohere, especially (c) and (d). Their collaborators see a contradiction: strict probabilism (d) might require accepting that tiny chances with huge payoffs could dominate, which conflicts with rejecting domination (c). But the user thinks the resistance to astronomical payoffs might lie elsewhere. 

  Hmm. The key here is how decision-making under normative uncertainty is structured. If the user is using a weighted expectational model (as in a), but non-consequentialist theories (b) can't provide cardinal measures, then the model might be breaking down. That’s a bigger tension than (c) and (d). Without cardinal rankings, hedging becomes impossible, which undermines (a). 

  Then there's (c) and (d). The user might be resisting the implication of expected value calculations where tiny chances dominate. But strict probabilism (d) doesn’t force them to accept those calculations if the theories themselves don’t output the required values. So (d) is about credence coherence, not decision outputs. The real issue is that without cardinal measures, the expected value isn't computable. So (c) isn't conflicting with (d); it's that the model in (a) can't be applied properly due to (b). 

  Looking at the test case (g), the user rejects the protocol even with a 0.1 utilitarian credence because their pluralist view (0.9 credence) forbids it. But if the utilitarian payoff is astronomical, why doesn’t it outweigh? Because they haven’t cardinalized the pluralist theory. The constraint isn't a big disvalue; it’s a prohibition. So the hedging model fails here. 

  The user’s rejection of tiny chances dominating (c) makes sense if the theories don’t provide comparable values. But without that, how does hedging work? The user might be defaulting to a non-expectational approach when theories are incommensurable, like a lexical priority where constraints trump consequences. But that’s not what (a) describes. 

  Point (e) uses peer disagreement to flatten credences. But if credences are flattened across levels (including how to handle normative uncertainty), that introduces regress. The user acknowledges this but hasn’t resolved how to apply hedging when second-order theories differ. That’s underspecified, leading to instability in the model. 

  Personal obligations (f) add another layer. If these aren’t impartial, how do they fit into the hedging model? They might require a separate dimension, making aggregation harder. In the test case, these obligations might explain the pluralist stance, but again, without cardinalization, it’s tricky. 

  The cheapest fix? Surrendering (a)’s expectational hedging for non-consequentialist theories. Instead, use a different model for decisions under normative uncertainty when theories are incommensurable. That preserves (b), (c), (d), and the test case outcome. But it means giving up a unified decision procedure. 

  If they must surrender one item, (a) is the costliest but most necessary for coherence. Without it, they need an alternative, like satisficing or lexical thresholds. The cost is losing a clear, computable method, which might not appeal to the decision-makers in the workshop. 

  Other tensions: (e)’s peer disagreement flattening credences is an underspecification. They need to address the regress problem—maybe by capping the flattening at first-order or using a different weighting for meta-theories. That’s moderate work. 

  The collaboration obligations (f) are consistent but stretch the hedging model. They should clarify if these are part of a theory or external, which is moderate work. 

  Postponing decisions (h) is consistent and useful, especially with incommensurable theories. It’s a strength. 

  In summary, the core issue is (a) clashing with (b). Fixing that resolves the other tensions. (c) and (d) aren’t directly conflicting; the problem is the model in (a) can’t handle (b). The user’s intuition in the test case makes sense if they’re not strictly hedging but using a threshold model. So surrendering (a) as the sole method is key, but they’ll need to propose an alternative for non-consequentialist theories.
answer: |-
  Here's an audit of the tensions in your position, ranked by severity, with precise diagnoses, repair options, and identification of where conflicts dissolve or underspecification occurs. The core tension is not between (c) and (d), but between (a)/(b) and the rest of the structure.

  ### Ranked Tensions (Most Severe First)

  1.  **The Fundamental Incompatibility: (a) vs. (b) Undermines the Entire Hedging Model**
      *   **Tension:** (a) requires cardinal, intertheoretically comparable measures of "how much" each theory "favors" an option, aggregated by credence-weighted expectation. (b) explicitly denies that non-consequentialist theories (which you take seriously) *can* yield such cardinal measures, especially for constraints. Representing constraints as large disvalues is rejected as a misdescription.
      *   **Precise Conflict:** Your hedging procedure (a) *cannot be performed* for the theories you give significant credence to, per (b). You lack the inputs (cardinal, comparable "favoring" scores) the procedure demands. (g) demonstrates this: the pluralist theory *forbids* the action; it doesn't assign it a very negative score comparable to the utilitarian's astronomically positive score. Aggregation is impossible.
      *   **Cheapest Repair:** **Surrender strict expectational aggregation (a) for non-consequentialist theories.** Replace it with a different decision rule for normative uncertainty that handles incommensurability (e.g., My Favourite Theory, lexical priority/satisficing, variance-adjusted expectation acknowledging comparability limits). This preserves (b)'s core insight and makes (g) coherent (the constraint simply trumps below a credence threshold). **Cost:** Abandons a unified, quantitative aggregation method; requires defending an alternative rule.
      *   **Alternative Repair (More Costly):** Reinterpret (b). Concede that *some* non-cardinal, non-comparable structure *can* be forced into a cardinal framework *specifically for the purpose of normative uncertainty hedging*, even if it feels misdescriptive. Define "degree of favoring" operationally for constraints (e.g., "disvalue equivalent to violating N identical constraints of type X"). **Cost:** Violates the spirit of (b); feels ad hoc; risks misrepresenting the theories.

  2.  **The Output of Hedging vs. Intuition in (g): (a) vs. (c)/(g)**
      *   **Tension:** If you *could* cardinalize the utilitarian payoff (astronomically large) and represent the constraint (e.g., as a large but finite disvalue), strict expectational aggregation (a) *would* make the protocol permissible at *some* combination of credence and payoff size, likely well before your credence in utilitarianism reaches "near the very top." This directly contradicts (c) (rejection of tiny chances dominating) and your firm intuition in (g).
      *   **Precise Conflict:** The logic of expectational aggregation (a) inevitably leads to tiny chances of astronomical payoffs dominating *if they are cardinally comparable*. Your resistance in (c)/(g) shows you reject the output of that logic in these cases. The conflict is latent but severe if repair #1 isn't implemented.
      *   **Dissolves Under Inspection?** Only if repair #1 (abandoning expectational aggregation for these cases) is implemented. Otherwise, it's a direct conflict between the *implication* of (a) and your commitment to (c)/(g). (d) is *not* the source here; strict probabilism governs *credences*, not the *decision rule* applied to those credences and theory outputs.
      *   **Cheapest Repair:** **Implement Repair #1 above.** If you abandon strict expectational aggregation for theories with constraints, this tension vanishes. Your resistance in (c) can then be seen as stemming *from the nature of the theories themselves* (their incommensurability or lexical structure) rather than an ad-hoc modification of decision theory or credences.

  3.  **Peer Disagreement Regress: Underspecification in (e)**
      *   **Tension:** (e) uses peer disagreement to flatten first-order credences. But you acknowledge peers disagree about *how to respond to normative uncertainty itself* (second-order). Applying (e) consistently suggests flattening your credences over *different decision rules* (e.g., expectationalism, MFT, etc.) for handling normative uncertainty.
      *   **Precise Issue:** This is **underspecification**, not direct inconsistency. How do you apply your first-order hedging procedure (a) *when you are uncertain about which hedging procedure to use*? The regress problem is real but unaddressed. It threatens the stability of *any* proposed decision rule under normative uncertainty.
      *   **Missing Parameter:** A **stopping rule or weighting for meta-uncertainty.** How much does second-order peer disagreement flatten your credence in *first-order decision rules*? Do you apply (e) recursively? Do you prioritize one level? Ignore higher orders? This needs specification.
      *   **Work Required:** Moderate. You need a principled stance on handling meta-uncertainty about decision rules. Options: Bite the bullet and apply (e) recursively (complex, unstable); cap it at first-order normative uncertainty; argue for a default decision rule unaffected by this disagreement; treat the choice of rule as a separate practical decision. **Cost:** Adds complexity; may force modification of (e)'s scope or require accepting instability.

  4.  **Personal Obligations within Aggregation: Tension between (f) and (a)/(b)**
      *   **Tension:** (f) asserts "weighty obligations to particular others" that are non-instrumental and "do not disappear under aggregation." This fits naturally within your pluralist deontology or virtue theory (b). However, if you are using a hedging model (a), these obligations must either be represented *within* the theories you aggregate (e.g., as agent-relative values/permissions in your pluralist view) or pose a problem for aggregation *between* theories (e.g., how does a utilitarian theory, lacking such fundamental non-aggregating obligations, "weigh" against them?).
      *   **Precise Issue:** **Primarily underspecification / moderate tension.** Are these obligations core parts of the *theories* you assign credence to (resolved within (b))? Or are they a separate constraint *on* the aggregation process itself? The latter would conflict with a pure credence-weighted aggregation (a) unless incorporated as a distinct factor.
      *   **Work Required:** Minor clarification. Strongly imply these obligations are *integral to the content* of the non-consequentialist theories you endorse (e.g., part of your pluralist deontology). This resolves it within (b). Avoid framing them as external to the theories being aggregated. **Cost:** Minimal if clarified; potentially significant if they *must* be treated as external.

  5.  **(c) vs. (d): The Alleged Core Contradiction (Dissolves)**
      *   **Diagnosis:** Your collaborators are mistaken. This tension **dissolves under inspection**.
      *   **Why:** (d) governs the *epistemic state* (credences): they must be probabilistic and updated correctly, unaffected by practical stakes. (c) governs the *decision rule* or *interpretation of theory outputs*: you reject that a tiny *credence* in a theory implying an astronomically large *value* automatically dictates the decision, *especially if the competing theories resist cardinal comparison or advocate constraints*. (d) says your credence in utilitarianism is 0.1 and must be taken seriously as a probability. (c) says that even with that 0.1 credence, the *output* of the utilitarian theory (astronomical value) doesn't automatically override the *output* of the pluralist theory (a constraint) in the aggregation, *because they are incommensurable* (b) and the decision rule might not be purely expectational (see Repair #1 for tension 1). (d) doesn't force you to accept any particular *decision rule* or *theory of value*; it only governs the credences fed *into* that rule.
      *   **Resolution:** Your resistance (c) is located in **(b) and the limitations it imposes on (a)**, not in an ad-hoc adjustment of credences prohibited by (d). You keep strict probabilism about *belief* (d) but reject that *decision-making under normative uncertainty* must always reduce to maximizing expected cardinal value across theories (a point where (a) needs revision per tension 1). Your position on (c) is coherent with (d).

  **The One Item to Surrender: (a) as the Universal Decision Rule**

  *   **What to Surrender:** Strict credence-weighted expectational aggregation **(a)** as the *required* or *only valid* response to normative uncertainty, particularly for theories involving constraints/incommensurability.
  *   **Why:** It's the root cause of tensions 1 and 2, and its failure necessitates the repair that resolves tension 5. Tensions 3 and 4 are manageable with clarification. Surrendering (a) allows (b), (c), (d), (e), (f), and (g) to cohere much better.
  *   **Cost:**
      *   **Loss of Simplicity/Quantifiability:** You lose a single, seemingly objective, quantitative method. Decision-making becomes potentially messier, requiring judgment calls about incommensurability or choice between alternative rules (MFT, lexical, etc.).
      *   **Need for an Alternative:** You must propose *what to do instead* when theories resist cardinal comparison (e.g., "In cases of fundamental incommensurability, especially involving constraints, I adopt a satisficing or lexical priority approach informed by my credences" or "I use My Favourite Theory above a credence threshold"). This requires justification.
      *   **Appeal to Decision-Makers:** Quantitative aggregation is often appealing to practical decision-makers. Explaining why it fails here and what replaces it is a communication challenge.
  *   **Benefit:** Preserves the core insights: the need for some form of hedging/credence-sensitivity (the spirit of a), the non-cardinalizability of constraints (b), rejection of tiny chances dominating via incommensurability (c), strict probabilism (d), peer disagreement flattening (e), special obligations (f), and the intuitive verdict in the test case (g). It resolves the fundamental incoherence.

  **Summary of Coherence Path:**

  1.  **Surrender (a)** as the universal, strictly expectational decision rule for normative uncertainty.
  2.  **Replace (a)** for non-consequentialist theories/constraint cases with an alternative rule handling incommensurability (e.g., lexical priority/satisficing based on credence thresholds). This resolves tensions 1, 2, and 5.
  3.  **Clarify (e):** Specify how peer disagreement affects meta-uncertainty about decision rules (e.g., cap flattening at the first-order normative level). Resolves tension 3.
  4.  **Clarify (f):** Frame special obligations as inherent to the content of the non-consequentialist theories you endorse. Resolves tension 4.
  5.  **Preserve Intact:** (b), (c), (d), (g), (h) remain core, coherent commitments. (c) and (d) are now clearly compatible.

  This package hangs together significantly better by recognizing that strict expectational aggregation breaks down under fundamental incommensurability (b) and that your intuitions (c, g) reflect this limitation. The core insight needing defense is your alternative approach to decision-making when aggregation is impossible.
