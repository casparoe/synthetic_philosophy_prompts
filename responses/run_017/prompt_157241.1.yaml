answer: |-
  Here’s a structured, two-page proposal draft designed to meet your specifications, emphasizing clarity, novelty, and methodological rigor while acknowledging your background candidly:

  ---

  **Project Proposal: The Moral Force of "Lottery Promises": Does Outcome Determine Obligation?**  

  **1. Core Question & Novelty**  
  This project investigates a neglected class of promises: commitments where the *cost of performance is uncertain but probabilistically knowable at the time of promising* (e.g., marriage vows "for worse," co-signing loans, disaster-contingency pledges). I term these "lottery promises." The central question is: **Does the moral bindingness of such promises depend on the *realized outcome* of the cost variable?**  

  This challenges dominant paradigms: most philosophical analyses assume fixed or foreseeable costs (e.g., "I promise to drive you tomorrow"). Lottery promises create tension between:  
  - **Ex Ante Function:** As commitment devices, their value lies in *insensitivity* to outcomes. If obligation weakens when costs are high (even if foreseen as possible), planning and trust collapse.  
  - **Ex Post Intuitions & Practice:** We often judge actual cases (and legal doctrines like "frustration" or "impracticability") as sensitive to ruinous outcomes, suggesting obligation may diminish when costs exceed plausible thresholds.  

  The novelty lies in isolating *pre-known uncertainty* from adjacent issues (e.g., unforeseen circumstances, promise modification by consent). This tests theories on whether probabilistic knowledge immunizes against outcome sensitivity.  

  **2. Why Existing Frameworks Don’t Resolve This**  
  I will test how four major families of promissory theory handle lottery promises:  
  - **Practice/Convention Views:** If promising is a rule-based practice, does its stability *require* outcome-insensitivity? Or do rules inherently include "ruinous cost" exceptions?  
  - **Reliance/Expectation Views:** If harm prevention grounds obligation, does reliance’s fixity matter? Can a promisee’s ability to "insure" against non-performance weaken the promisor’s duty if costs soar?  
  - **Normative Power/Rights Transfer Views:** If promising transfers a right, is that right *conditional* on cost ceilings? Does the promisor implicitly reserve veto over catastrophic draws?  
  - **Reductionist Views:** If promissory duty reduces to general duties (e.g., not to harm via false assurance), does a high-cost outcome alter whether the promisee was "warranted" in relying?  

  *Each theory can "shrug off" or "bite" on the case:*  
  - Conventions *might* demand rigidity; Reliance *might* permit excusal if harm is disproportionate; Rights-transfer *might* deem the right irrevocable; Reductionism *might* dissolve the special force entirely.  
  **Crucially, no theory explicitly addresses lottery promises’ structure**, leaving their verdicts on outcome-dependence indeterminate and untested.  

  **3. Method: Why a Parameterized Grid?**  
  I propose generating a grid of vignettes varying key parameters:  
  - Known distribution properties (narrow vs. fat-tailed risk)  
  - Realized cost (low, expected, ruinous)  
  - Promisee’s reliance (fixed vs. adjustable)  
  - Promisee’s insurability (can they hedge risk?)  
  - Relationship context (contractual, familial, etc.)  

  Each vignette will be analyzed through the lens of the four theories above to derive *mechanically generated verdicts* on obligation strength post-draw.  

  **Advantages over alternatives:**  
  - **Vs. Ground-up derivation:** Avoids rehashing foundational debates; instead *stress-tests* extant theories where they are silent.  
  - **Vs. Intuition surveys:** While empirical, surveys risk capturing *outcome bias* (blurring moral luck with obligation), not theoretical coherence. The grid isolates variables for conceptual clarity.  
  - **Vs. Conceptual analysis:** Focuses on *applied implications* of existing concepts (e.g., "reasonable reliance," "implicit conditions") rather than redefining "promise."  

  **4. Deliverable & Possible Outcomes**  
  **Output:** A 5,000-word paper presenting:  
  (i) The lottery promise as a distinct category;  
  (ii) Grid analysis showing where theories converge/diverge on outcome-dependence;  
  (iii) Argument for which view(s) best resolve the tension between commitment function and moral psychology.  
  **Deflationary Result:** If all theories can be tuned to match any verdict (e.g., via "implicit condition" clauses), the paper argues that promissory obligation lacks robust outcome-insensitivity.  

  **5. Failure Modes & Mitigation**  
  - **Free Parameters:** If every theory flexibly absorbs lottery cases (e.g., "conventions include hardship exceptions"), the project yields a *negative result*: outcome-dependence is theoretically indeterminate, exposing a gap in promissory ethics. (Still publishable as a critique.)  
  - **Collapse into Changed Circumstances:** Rigorous parameterization prevents this. "Changed circumstances" typically involve *unforeseen* events; lottery promises fix risk knowledge *ex ante*. The grid forces focus on known distributions.  
  - **Third Failure Mode:** *Conceptual Overstretch* – If "lottery" structures are so diverse they resist categorization. Mitigation: Anchor cases in clear examples (e.g., mutual aid pacts with known risk profiles).  

  **6. Timeline**  
  - **Month 1:** Finalize grid parameters; draft vignettes; map theoretical predictions.  
  - **Month 2:** Analyze verdicts across theories; identify conflicts/resolutions; draft paper.  
  - **Month 3:** Refine argument; prepare presentation; address peer feedback from the reading group.  

  **Why This Isn’t a Rehash**  
  This project does not rehearse "why promises bind" but probes *how bindingness interacts with foreseen uncertainty* – a blind spot in current debate. By combining a neglected case-type with systematic theory-testing, it offers either (a) a resolution to the tension between commitment function and outcome-sensitivity, or (b) a demonstration of theoretical inadequacy. My background in modeling stochastic systems and commitment devices (e.g., in behavioral ecology) informs this approach, though I engage philosophical literature as a rigorous interlocutor, not an insider.  

  ---

  **Key Strengths for Committee Review:**  
  - **Precision:** Isolates a specific, underexplored puzzle.  
  - **Methodological Justification:** Clearly argues why parameterized cases > surveys/foundationalism.  
  - **Intellectual Honesty:** Flags background/possible failure modes; avoids overclaiming.  
  - **Output Clarity:** Paper structure defined, even for negative results.  

  Let me know if you’d like adjustments to tone, emphasis, or technical depth!
