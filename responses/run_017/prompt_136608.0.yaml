  **Debrief Minute-by-Minute**:

  60-65 min: Reveal the setup: 
  - "In round 2, the rules were actually different: the micro-tier was given rules A, but we ran rules B. In round 3, one cell had a different threshold (5 instead of 4) without telling the micro-tier."

