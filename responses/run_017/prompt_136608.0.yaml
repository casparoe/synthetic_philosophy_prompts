  We reveal the setup, including the rule swap and the single cell alteration. We show the scores and ask:
  - In which conditions did the micro tier do well? (Baseline and scaled-up, but not rule swap and single cell.)
  - In which did the aggregate tier do well? (Baseline and rule swap? But rule swap might have similar aggregate, so their time-series model might work, but the micro tier failed because the rules changed.)
  - In which did the phenom tier do well? (Baseline, scaled-up, and maybe rule swap if the generalization holds.)

  We then draw out the three points:

  1. **Usefulness of higher-level generalizations**: Even though the micro tier has complete information, in the scaled-up condition, they might not be able to compute by hand, but the phenom tier's rough scaling law worked. And in the rule swap, the phenom tier might have been robust because their generalization didn't depend on the micro rules.

  2. **Invariance and counterfactuals**: The exercise shows that different descriptions are good for different counterfactuals. The micro tier can answer about single cell changes (if they know) but not about rule changes they don't know about. The aggregate tier can answer about doubling the grains but not about rule changes. The phenom tier can answer about scaling the system size.

  3. **Two kinds of emergence**: 
     - The first kind: the pattern is determined by the micro rules but is out of computational reach (like in the scaled-up grid, the micro tier cannot compute by hand).
     - The second kind: the pattern is invariant under changes in the micro rules (like in the rule swap condition, the aggregate pattern was similar, so the aggregate tier and phenom tier were robust).

  Then we connect: sometimes a pattern is both: it's computationally inaccessible and also robust to micro changes, which is why we use the higher-level description.

  **What will go wrong**:
  - The micro tier will try to simulate by hand and run out of time. We must warn them at the beginning that they should use reasoning, not computation.
  - Someone might notice the rule swap if they are very familiar with sandpiles. We can choose rule sets that are visually similar.
  - The aggregate tier might overfit if we give them only a few runs. We give them 10 runs, which is enough for a coarse model.
  - A participant might say it's all about ignorance. We agree in the debrief: the first kind of emergence is epistemic (about our knowledge), but the second kind is about robustness, which is objective.

  **What the activity cannot deliver**:
  - It does not show ontological emergence or downward causation. It only shows epistemic emergence and robustness.
  - The real historical cases involve complex limiting arguments (like thermodynamics from statistical mechanics) that are not captured by a simple simulation.

  **Closing Words**:
  - "What we've seen today is that even in a simple system, the relationship between different levels of description is not straightforward. The micro-level is complete, but it is not always the most useful or robust level for prediction. The higher-level generalizations can be indispensable, not because we are ignorant, but because they capture patterns that are invariant under changes in the micro-level details. This is why science needs multiple levels of description, and why reduction, while true, is only part of the story."

  **Concrete Parameters**:

  We need to choose initial conditions and rule sets that work.

  **Rule Set A (Conservative, von Neumann)**:
  - Threshold = 4
  - Topple: lose 4, each of 4 orthogonal neighbors gain 1.

  **Rule Set B (Non-conservative, Moore neighborhood with higher threshold)**:
  - Threshold = 8 (so it takes more grains to topple)
  - Topple: lose 8, each of 8 Moore neighbors gain 1.

  But then the dynamics are different. We must test that for most initial conditions, the aggregate time-series (total unstable cells per step) are similar.

  Alternatively, we can use a rule set that is also von Neumann but non-conservative:

  **Rule Set B**:
  - Threshold = 4
  - Topple: lose 4, and then for each of the 4 neighbors, with probability 0.5, add 1 grain. Then on average, 2 grains are redistributed and 2 are lost.

  But then the total grains decrease over time.

  We pre-run to ensure that for many initial conditions, the duration, peak, and total topplings are similar between rule set A and rule set B, but for one initial condition they diverge.

  For example, in rule set A (conservative), the system might take longer to stabilize for some initial conditions, but in rule set B (non-conservative), it stabilizes faster.

  **Single cell alteration**: In condition 3, we change one cell to have threshold=5 (instead of 4) in rule set A.

  **Scaled-up**: Double the grid to 20x20 and use an initial condition that is I1 scaled up? But I1 was 10x10. We can repeat the pattern or use a random pattern with the same density.

  We'll generate four initial conditions:

  - I1 (10x10): Generate a grid with each cell a random integer between 0 and 3. Then add 10 grains at random cells (each addition: choose a random cell and increment by 1). This will create instability.
  - I2 (10x10): Similarly, but different random seed.
  - I3 (10x10): Another one.
  - I4 (20x20): Generate similarly with density: each cell random between 0 and 3, then add 40 grains at random cells.

  For the rule swap condition, we use rule set B and I2.

  For the single cell alteration, we use rule set A and I3, but we change one cell's threshold to 5 (without changing the initial state).

  For the scaled-up, we use rule set A and I4.

  We must pre-run to ensure that:

  - In the rule swap run with I2, rule set B produces very different outcome from what rule set A would have produced? But we want the aggregate time-series to be similar for I1 but different for I2? We want that for most initial conditions, rule set A and rule set B give similar aggregate time-series, but for I2, they diverge.

  We can design I2 to be sensitive to the rule change.

  For example, in rule set A, a configuration might lead to a long-lasting chain reaction, but in rule set B, it dies out quickly.

  **Implementation**:

  We will write a Python script to run the simulations. We can use the following code outline:

  ```python
  import numpy as np

  def topple_grid(grid, threshold, ruleset='A'):
      """One time step of toppling, parallel update."""
      new_grid = grid.copy()
      ny, nx = grid.shape
      unstable = (grid >= threshold)
      if ruleset == 'A':
          # von Neumann neighborhood
          for y in range(ny):
              for x in range(nx):
                  if unstable[y, x]:
                      new_grid[y, x] -= 4
                      # up
                      new_grid[(y-1) % ny, x] += 1
                      # down
                      new_grid[(y+1) % ny, x] += 1
                      # left
                      new_grid[y, (x-1) % nx] += 1
                      # right
                      new_grid[y, (x+1) % nx] += 1
      elif ruleset == 'B':
          # Moore neighborhood, threshold 8
          for y in range(ny):
              for x in range(nx):
                  if grid[y, x] >= threshold:
                      new_grid[y, x] -= 8
                      for dy in [-1,0,1]:
                          for dx in [-1,0,1]:
                              if dy==0 and dx==0:
                                  continue
                              new_grid[(y+dy) % ny, (x+dx) % nx] += 1
      # For ruleset='A' with a cell alteration, we would have to adjust per cell. We'll handle that separately.
      return new_grid

  def simulate(grid, threshold, ruleset, max_steps=50):
      steps = 0
      activity = []
      total_topplings = 0
      while steps < max_steps:
          unstable = (grid >= threshold)
          if not np.any(unstable):
              break
          activity.append(np.sum(unstable))
          # Toppling happens in parallel: we compute the next grid based on the current grid.
          new_grid = topple_grid(grid, threshold, ruleset)
          # Count topplings: each unstable cell topples once in this step.
          total_topplings += np.sum(unstable)
          grid = new_grid
          steps += 1
      return grid, activity, total_topplings, steps
  ```

  But note: the above `topple_grid` for ruleset='A' does not do parallel update correctly because it does topplings sequentially and the changes affect the same new_grid. For parallel update, we should compute all topplings from the current state and then apply them simultaneously.

  We need to accumulate the changes and then apply them.

  Revised for parallel update:

  ```python
  def topple_grid_parallel(grid, threshold, ruleset='A'):
      ny, nx = grid.shape
      unstable = (grid >= threshold)
      topple_count = np.zeros_like(grid)
      # We will create a change matrix: how many grains to add at each cell from topplings.
      change = np.zeros_like(grid)
      if ruleset == 'A':
          # For each unstable cell, it will give 1 grain to each of 4 neighbors.
          for y in range(ny):
              for x in range(nx):
                  if unstable[y, x]:
                      # This cell will lose 4
                      change[y, x] -= 4
                      # Each neighbor gets 1
                      change[(y-1) % ny, x] += 1
                      change[(y+1) % ny, x] += 1
                      change[y, (x-1) % nx] += 1
                      change[y, (x+1) % nx] += 1
      elif ruleset == 'B':
          for y in range(ny):
              for x in range(nx):
                  if unstable[y, x]:
                      change[y, x] -= 8
                      for dy in [-1,0,1]:
                          for dx in [-1,0,1]:
                              if dy==0 and dx==0:
                                  continue
                              change[(y+dy) % ny, (x+dx) % nx] += 1
      new_grid = grid + change
      return new_grid
  ```

  Then in `simulate`, we replace the grid with the new_grid.

  For the single cell alteration, we can pass an array of thresholds? But initially, we'll use a constant threshold except for one cell.

  We can modify the threshold array in the simulate function.

  Alternatively, we can have a threshold array that is usually 4, but at one cell is 5.

  Then in the unstable calculation: `unstable = (grid >= threshold_array)`

