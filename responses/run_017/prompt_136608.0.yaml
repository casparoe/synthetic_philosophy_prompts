  ### Session Plan: "Prediction Tiers" Activity on Reduction and Emergence  
  **Duration:** 90 minutes  
  **Goal:** Illustrate epistemic emergence (computational irreducibility) and robust emergence (invariance under micro-rule changes) through a hands-on prediction game. Participants experience why higher-level generalizations remain indispensable despite micro-level completeness.  

  ---

  ### **Materials & Setup**  
  1. **Simulation Software**:  
     - Use a sandpile cellular automaton (Python script with PyGame or web-based simulator like [Sandpile Playground](https://jasonmccampbell.com/sandpile/)).  
     - **Pre-scripted scenarios** (avoid live coding; run pre-tested simulations).  
     - **Projector** to display simulation runs.  

  2. **Grid Parameters**:  
     - **Baseline**: 10x10 grid, threshold = 4 grains/cell.  
       - *Toppling rule (Set A)*: Cell loses 4 grains; each orthogonal neighbor gains 1.  
     - **Rule Swap**: Same grid, but **Set B** (threshold = 4; cell loses 4 grains, 2 grains go to *one random neighbor*, 1 grain to *another random neighbor*, 1 grain "lost").  
     - **Single-Cell Perturbation**: Baseline rules, but cell (5,5) altered to topple at **5 grains**.  
     - **Scaled-Up**: 20x20 grid, baseline rules.  

  3. **Initial Conditions** (pre-generated):  
     - Generate via: Each cell starts at random (0–3 grains), then add 15 grains at random positions to induce instability.  
     - **Novel initial state** for prediction round: Distinct from training data.  

  4. **Information Packets** (handed to each tier):  
     - **Tier 1 (Micro-Rules)**:  
       - *Rules*: Full toppling mechanics (Set A), grid topology.  
       - *Data*: Exact initial grid (matrix of numbers).  
       - *Task*: Predict final state, duration (steps), total topplings.  
     - **Tier 2 (Aggregate Data)**:  
       - *Rules*: None.  
       - *Data*: Time-series graphs of "total active cells per step" from 10 prior runs (showing rise/decay patterns).  
       - *Task*: Predict time-series for new run.  
     - **Tier 3 (Phenomenological Generalization)**:  
       - *Rules*: None.  
       - *Data*: Summary: "Activity peaks early, decays exponentially. Duration scales with grid size. Total topplings ≈ 0.4 × initial grains."  
       - *Task*: Predict peak activity, duration, and total topplings.  

  5. **Scoring Scheme**:  
     - **Prediction accuracy** (1–3 points per question):  
       - Exact match: 3 pts.  
       - Close (e.g., ±10%): 2 pts.  
       - Plausible range: 1 pt.  
     - **Counterfactuals** (1–3 pts per answer): Logical consistency over precision.  
     - **Whiteboard leaderboard** to track scores by tier.  

  ---

  ### **Timeline (Minute-by-Minute)**  
  **0–10 min: Introduction (Facilitator)**  
  - **Goal**: Frame the activity without jargon.  
  - **Script**: *"Today, we’ll predict outcomes in a system of ‘toppling counters.’ You’ll work in three teams with different information. There’s no ‘right’ level—just trade-offs. We’ll run four prediction rounds, then discuss."*  
  - **Action**: Split into tiers (5–6 people each), hand out packets.  

  **10–15 min: Tier Prep**  
  - Teams review materials.  
  - **Facilitator prompt**: *"Use your data to predict outcomes for a new run. Focus on trends, not exact numbers."*  

  **Round 1: Baseline (Rules A, 10x10)**  
  - **15–20 min**: Reveal novel initial condition (project grid). Tiers predict:  
    - T1: Final grid state, duration, total topplings.  
    - T2: Time-series graph (sketch).  
    - T3: Peak activity, duration, total topplings.  
  - **Counterfactual** (all tiers): *"What if we add 5 grains to cell (3,3)?"*  
  - **20–22 min**: Run simulation. Display results.  
  - **22–25 min**: Record predictions/scores.  

  **Round 2: Rule Swap (Rules B, 10x10)**  
  - **25–30 min**: Repeat prediction (same initial condition).  
    - **Crucial**: Do *not* announce rule change.  
  - **Counterfactual**: *"What if we double all initial grains?"*  
  - **30–32 min**: Run simulation (rules B).  
  - **32–35 min**: Record scores.  

  **Round 3: Single-Cell Perturbation (Altered cell, 10x10)**  
  - **35–40 min**: Repeat prediction.  
    - **Crucial**: Do *not* announce cell alteration.  
  - **Counterfactual**: *"What if cell (5,5) topples at 5 grains?"*  
  - **40–42 min**: Run simulation.  
  - **42–45 min**: Record scores.  

  **Round 4: Scaled-Up (Rules A, 20x20)**  
  - **45–50 min**: Reveal 20x20 initial condition.  
  - **Counterfactual**: *"What if grid was 30x30?"*  
  - **50–52 min**: Run simulation.  
  - **52–55 min**: Record scores.  

  **55–60 min: Tally Scores**  
  - Display leaderboard. Announce "winners" for each round.  

  ---

  ### **Debrief (60–90 min)**  
  **Goal**: Link game outcomes to emergence/reduction without jargon.  

  #### **Step 1: What Happened? (10 min)**  
  - Ask tiers: *"When did you feel confident? When were you surprised?"*  
  - **Reveal hidden perturbations**: Rule swap, cell alteration.  
  - **Key observations**:  
    - T1 (Micro) nailed baseline/scaled-up but failed rule swap/cell change.  
    - T2 (Aggregate) overfitted data (e.g., mispredicted rule-swap decay).  
    - T3 (Phenom) won scaled-up and rule swap via generalizations.  

  #### **Step 2: Map to Concepts (15 min)**  
  - **Q1**: *"Why couldn’t T1 compute everything despite ‘complete’ knowledge?"*  
    → **Computational irreducibility** (emergence from ignorance).  
  - **Q2**: *"Why did T3’s generalizations survive rule changes?"*  
    → **Robust emergence** (pattern persists under micro-rule variations).  
  - **Q3**: *"Which counterfactuals could your tier/couldn’t your tier answer?"*  
    → **Descriptive invariance**: Micro handles local changes; phenom handles scaling.  

  #### **Step 3: Synthesis (5 min)**  
  - **Two kinds of emergence**:  
    1. **Epistemic**: Patterns "out of reach" (scaled-up grid).  
    2. **Robust**: Patterns invariant to micro-changes (rule swap).  
  - **The punchline**: *"Reductionism says ‘it’s all micro.’ But which description you use depends on what you want to predict or change. Robust patterns are why chemistry isn’t just particle physics, and why you didn’t need quantum mechanics to fix your car."*  

  #### **Step 4: Caveats (5 min)**  
  - *"This game can’t show downward causation or ‘strong’ emergence. Real-world cases (e.g., thermodynamics from atoms) involve infinite limits, not 20x20 grids. But it exposes why ‘bookkeeping’ is incomplete: prediction requires choosing a level."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Micro-tier tries hand calculations** → Preempt: *"Don’t simulate step-by-step; use rules heuristically."*  
  2. **Rule swap noticed** → Use subtle Set B (e.g., lossy redistribution looks like "friction").  
  3. **Aggregate tier overfits** → Give only 10 time-series; emphasize *"predict trends."*  
  4. **"It’s just ignorance!" participant** → *"True for Round 1, but why did phenom win rule swap? Robustness isn’t ignorance."*  
  5. **Time short** → Drop one round (e.g., single-cell) but keep rule swap/scaled-up.  

  ---

  ### **Post-Session Script**  
  *"Today, you felt why reductionism isn’t the end of the story. When a description is computationally inaccessible (like the big grid) or robust (like surviving rule changes), it’s not ‘just’ bookkeeping—it’s the pattern we latch onto to make sense of the world. That’s why science has levels. And that’s why, even after 30 years at the bench, I never once used quantum electrodynamics to measure a lava flow."*  

  --- 
  **Final Note**: This session creates cognitive dissonance ("I have full micro-knowledge but can’t use it!") to prime deeper discussion. Avoid lecturing; let the game do the work. Use the whiteboard to map "who won what" to philosophical takeaways.
