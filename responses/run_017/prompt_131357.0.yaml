  Their additional puzzles are insightful. The agency question about controlling attention touches on philosophy of action - can "not-looking" truly be an action? And the inconsistency they observe between taking avowals at face value in some contexts versus looking through them in willful blindness cases reveals a tension in legal epistemology.

  If we accept that self-deception isn't possible in the strong sense, willful blindness doctrine might need reconceptualization - perhaps as culpable failure to inquire with a recklessness standard. The jury would then focus on whether the defendant consciously disregarded a substantial risk.

  I'll structure my response to first give a bottom-line answer about what the doctrine presupposes, then systematically address each part of their query with clear reasoning. I'll note where I'm least confident - particularly about whether the law actually requires self-deception or just needs the practical equivalent. The agency point also deserves hedging since philosophy of attention remains contested.
answer: |-
  The law presupposes that willful blindness is a culpable mental state functionally equivalent to knowledge for liability purposes, resting on a practical conception of belief as involving conscious suspicion plus deliberate information-avoidance, without requiring coherent self-deception. (High confidence on core doctrine; moderate on philosophical underpinnings.)

  **Reconstructing the doctrine:**
  1.  **It's primarily the first reconstruction (normative surrogate).** The doctrine treats willful blindness *as if* it were knowledge because the defendant's deliberate choice to avoid confirmation, while subjectively suspicious, makes them *just as culpable* as someone who knew. The "knowledge" finding is a legal fiction for culpability, not a direct claim about the defendant's occurrent belief state at the moment of the act. The two-part test (*subjective suspicion* + *deliberate avoidance*) isolates this heightened culpability, distinct from mere negligence (unreasonable ignorance) or recklessness (conscious risk disregard).
  2.  **The second reconstruction (knowing-by-avoidance) is partially operative but insufficient.** While the law *does* look beyond mere avowals and considers how attention/inquiry is managed, it stops short of equating deliberate avoidance *itself* with the mental state of "knowing." The two-part test confirms the defendant *didn't* actually know but *chose* not to. The doctrine *needs* the subjective suspicion component precisely because avoidance alone doesn't constitute knowledge.
  3.  **The third reconstruction (purely normative) is rejected.** The instruction *is* describing a specific state of mind: conscious suspicion coupled with a deliberate choice not to confirm. It's not *just* normative labelling; it's finding specific subjective facts about the defendant's awareness and choices.

  **Self-Deception:** The doctrine **does not require genuine, paradoxical self-deception.** It functions perfectly well with the "thinner story": conscious suspicion ("it's highly probable it's drugs") plus a conscious choice ("I won't ask/look because I don't want it confirmed"). This avoids needing the defendant to simultaneously hold contradictory beliefs. Motivated reasoning (dwelling on deniability) and selective attention (focusing on anything *but* the bags' contents) suffice for the jury finding. The "deliberate avoidance" *is* the culpable act that bridges suspicion to liability.

  **Agency Over Attention:**
  *   The doctrine **absolutely presupposes agency over attention/inquiry.** It treats "deliberately avoiding knowledge" as an *action* (or a deliberate omission to inquire) for which the defendant is responsible. This is central.
  *   **This presupposition is not philosophically innocent.** It relies on a robust conception of voluntary control over cognitive focus and information-seeking. While intuitively plausible ("I can choose not to think about that" or "I can choose not to ask"), the extent and nature of this control are debated in philosophy of mind and action. The law pragmatically assumes this agency exists for culpability assessments. (Moderate confidence; this is a deep philosophical issue the law glosses over.)

  **Apparent Inconsistency (Avowal vs. Looking-Through):**
  *   **This is a genuine tension within legal epistemology.** The law *does* often treat sincere, contemporaneous expressions of belief (avowals) as strong evidence of mental state, even if unreasonable (e.g., genuine but unreasonable mistake of fact negating intent).
  *   **The unified account lies in *how* the belief is formed/maintained.** The law distinguishes between:
      *   **Sincere (though perhaps unreasonable) belief based on available evidence/interpretation:** Here, avowal is taken seriously.
      *   **Belief formed or maintained through *deliberate ignorance*:** Here, the law looks *past* the avowal ("I didn't know") because the evidence shows the defendant *engineered* their own ignorance *despite* strong subjective suspicion. The culpability lies in the *choice* to avoid knowledge, making the subsequent denial of knowledge irrelevant or disingenuous.
  *   **The "same thing" tracked is *culpability in the formation of the belief state*, not just the state itself.** In willful blindness, the defendant is culpable *for* being ignorant when they strongly suspected the truth and chose not to dispel the ignorance. In cases where an unreasonable belief is accepted, the defendant isn't culpable *for arriving* at that belief; they just happened to hold it, however unreasonably.

  **If Self-Deception is Impossible:**
  *   Willful blindness **would not collapse into recklessness or negligence.** The core culpability (conscious suspicion + deliberate choice to avoid confirmation) remains distinct from recklessness (consciously disregarding a substantial risk *of* the prohibited result) and negligence (failing to be aware of a substantial risk a reasonable person would see).
  *   **The practice could be rebuilt as a distinct doctrine:** "Culpable Avoidance of Knowledge" or "Deliberate Ignorance." The jury would be asked to find:
      1.  The defendant subjectively believed it was highly probable the fact existed (e.g., the bags contained drugs).
      2.  The defendant deliberately failed to inquire or confirm the fact, intending to avoid actual knowledge.
  *   The *functional* equivalence to knowledge for liability purposes would likely remain, justified by the heightened culpability of the deliberate avoidance. The jury's task would be conceptually clearer without the "knowledge" label, focusing squarely on the two subjective findings.

  **Least Confident Point:** I am least confident about the precise *philosophical necessity* of self-deception for the doctrine *as currently formulated and applied by juries*. While the doctrine *can* function without it via the "thinner story," the language ("knew," "willful blindness," "ostrich") and common jury instructions *might* implicitly rely on jurors understanding a folk-psychological concept of self-deception, even if philosophically incoherent. Whether courts/juries *actually* rely on that incoherent concept or intuitively grasp the "suspicion + deliberate avoidance" core is harder to pin down definitively. (High confidence the doctrine *can* work without self-deception; lower confidence that it *never* relies on jurors accepting a folk concept of it).
