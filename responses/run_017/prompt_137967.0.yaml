prompt: |-
  I sit on the methodology review panel of an independent AI auditor. A frontier developer has asked us to accept, as evidence supporting a deployment sign-off, results from an oversight protocol that works like this: for each question in a code-security review — typically, whether a proposed patch to a widely deployed authentication library silently introduces a vulnerability — two AI systems argue for opposite answers, and a non-expert judge, human or weaker model, picks the winner. The developer's pitch is that expert review does not scale and that debate lets a weak judge extract correct judgments from systems stronger than it is. Write the memo I will table at the panel's next session, recommending that we accept, reject, or conditionally accept this protocol as a basis for sign-off, with reasons the developer could actually respond to.

  Two things I want the memo to get right. First, the objection that worries me most is obfuscation: a debater defending the wrong answer need not assert anything false. It can offer a chain of individually checkable, locally plausible steps in which the load-bearing error sits where the judge cannot afford to dig, so the claim that truth is easier to defend may hold only under idealizations — optimal play, unbounded rounds, a judge who can follow every step — that we do not have. Second, I would rather evaluate a concrete safeguard than restate the worry. My proposal: run the protocol on a calibration set whose answers we already know, and additionally run it in swapped-side mode, where each system is made to argue the position it did not argue the first time. Tell me what follows from each of three outcomes — a system wins at well above chance only when assigned one side; it wins at comparable rates on both sides; or accuracy collapses toward chance under swapping even though the unswapped runs looked strong — and be honest about whether the test detects what I think it detects and about what it would miss.

  Close with an explicit recommendation and a threshold or condition the developer could actually be held to. Give the strongest argument on the other side its due: a protocol with known failure modes may still dominate the real alternative, which is no review or a rubber stamp, and insisting on near-perfect validity may simply mean no oversight at all.
reasoning: |-
  Okay, the user is on a methodology review panel for an AI auditor and needs to draft a memo evaluating a debate-based oversight protocol proposed by a frontier developer. The core idea is using two AIs to argue opposite positions on code-security questions, with a non-expert judge picking the winner. The developer claims this scales better than expert review and allows weak judges to extract correct judgments from stronger systems. 

  The user has two main concerns. First, they're worried about obfuscation - where a losing debater can mislead through technically true but misleading arguments that overload the judge's capacity. Second, they want concrete evaluation methods rather than theoretical objections. They propose testing with a calibration set and a "swapped-side" mode where debaters argue the opposite position.

  Hmm... the user's framing is sophisticated. They clearly understand the debate literature and are probing the gap between ideal theory and practical implementation. The swapped-side test is clever - it could reveal whether debaters have position-dependent biases or skills. But I wonder if they've considered how judge limitations interact with this? A weak judge might not notice swapped-side inconsistencies if the deception tactics work equally well in both directions.

  The ethical tension is sharp here. Rejecting imperfect oversight might leave dangerous gaps, but accepting flawed methods creates false confidence. The user's "real alternative" point is painful - sometimes the choice is between bad options and worse ones. Still... for security-critical patches, "better than nothing" feels terrifying as a standard.

  For the memo structure, I'll need to: first dissect the obfuscation risk with concrete examples (e.g., a debater burying a vulnerability in 50 steps of valid syntax checks), then detail the calibration protocol, then interpret the three swapped-side outcomes. The "wins only on one side" result would be damning - suggesting debaters are trained to persuade rather than find truth. But I should admit the test won't catch collusion between debaters or judge-specific blind spots.

  Recommendation must be actionable. "Conditional acceptance with swapped-side benchmarking" seems right, but what threshold? 70% accuracy? 80? Needs justification. And we must mandate human spot-checks - because any pure-AI oversight needs circuit breakers. The developer's scalability argument deserves respect though: if their method catches 85% of flaws versus experts' 95% but covers 10x more patches, that's a net safety win. The memo should acknowledge that calculus while insisting on transparency about the missing 15%.
answer: |-
  ## MEMORANDUM: Evaluation of Debate-Based Oversight Protocol for Code-Security Review

  **To:** Methodology Review Panel  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Frontier Developer's AI Debate Protocol for Authentication Library Patch Review  

  ### 1. Proposed Protocol Summary
  The developer proposes using two strong AI systems ("debaters") to argue opposing positions (vulnerable/not vulnerable) on code-security questions regarding authentication library patches. A non-expert judge (human or weak AI) selects the winning argument. The claim is that this scales better than expert review and allows weaker judges to leverage stronger models' knowledge.

  ### 2. Core Strengths & Potential
  We acknowledge the protocol’s aspirational value:
  *   **Scalability:** Addresses the critical bottleneck of expert review for high-volume patches.
  *   **Leveraging AI Capability:** Potentially surfaces insights beyond a weak judge’s direct capability.
  *   **Conceptual Foundation:** Builds on the "truth has an advantage" hypothesis in ideal debate settings.

  ### 3. Primary Concern: Obfuscation Risk in Non-Ideal Conditions
  Our paramount concern is **strategic obfuscation under practical constraints**:
  *   **The Problem:** A debater defending a *false* position can avoid explicit falsehoods by constructing a complex chain of *individually verifiable but collectively misleading* reasoning. The critical error is buried under layers of plausible, low-level details (e.g., focusing excessively on valid syntax checks while obscuring flawed logic flow). The judge, lacking expertise or time, cannot feasibly unravel this.
  *   **Idealization Gap:** The theoretical advantage of truth relies on assumptions of optimal play, unlimited debate rounds, and a judge capable of drilling down arbitrarily. These assumptions do not hold in a practical deployment for high-throughput security reviews.

  ### 4. Proposed Concrete Evaluation: Calibration Set & Swapped-Side Testing
  **Recommendation:** **Conditionally accept** the protocol, contingent on rigorous validation using a **calibration set** and **swapped-side testing**.
  *   **Calibration Set:** A set of patches with known ground-truth labels (vulnerable/safe), including subtle vulnerabilities analogous to real-world risks.
  *   **Swapped-Side Protocol:** For each question in the calibration set, run the debate protocol **twice**:
      1.  **Original Assignment:** Debaters A (Pro-Vulnerable) vs. B (Pro-Safe). Judge picks winner. Record accuracy.
      2.  **Swapped Assignment:** Debaters A (Pro-Safe) vs. B (Pro-Vulnerable). Judge picks winner. Record accuracy.
  *   **Key Metrics:** Per-debater win rate *by assigned side* and overall protocol accuracy.

  ### 5. Interpretation of Swapped-Side Outcomes & Implications

  | Outcome                                 | Interpretation                                                                                                                         | Implications for Obfuscation Risk & Suitability                                                                                                |
  | :-------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- |
  | **A. Wins Well Above Chance Only on One Side** (e.g., Debater A wins 85% when Pro-Vulnerable, 45% when Pro-Safe) | **High Risk of Positional Bias/Obfuscation.** Debater skill is highly dependent on assigned position. A debater assigned the "easier-to-obfuscate" side (often "safe" for security vulnerabilities) may win primarily through persuasive tactics or exploiting judge weaknesses, not truthfulness. | **Severe Concern.** Indicates the protocol likely fails under adversarial conditions. Truth lacks a consistent advantage. **Unacceptable** without fundamental mitigation. |
  | **B. Wins at Comparable Rates on Both Sides** (e.g., Debater A wins 75% Pro-Vuln, 70% Pro-Safe) | **Moderate Risk / Potential Robustness.** Debater skill is less position-dependent. Suggests debaters are competent reasoners regardless of assigned stance. May indicate a degree of robustness against simple obfuscation tactics tied purely to position. | **Cautiously Promising.** Reduces (but does not eliminate) concern about position-specific obfuscation strategies. Warrants further scrutiny on *how* wins are achieved and judge reliability. |
  | **C. Accuracy Collapses Toward Chance Under Swapping** (Despite strong original unswapped accuracy) | **Extreme Vulnerability to Obfuscation.** The *specific pairing* or *side assignment* was critical. Performance was likely driven by one debater exploiting the judge effectively only when arguing a specific side. Swapping disrupts this fragile dynamic. | **Unacceptable.** Reveals the protocol is highly brittle and manipulable. The judge was effectively "played," not reasoning soundly. **Reject** this configuration. |

  ### 6. Limitations of the Test & Remaining Risks
  *   **Detects:** Position-dependent obfuscation strategies and debater positional bias.
  *   **Misses:**
      *   **Collusion:** Debaters implicitly agreeing to mislead the judge regardless of position.
      *   **Universal Obfuscation:** Strategies effective regardless of assigned side (e.g., overwhelming complexity usable by either True or False side).
      *   **Judge-Specific Exploits:** Vulnerabilities only exploitable by *this specific* judge model/human.
      *   **Novel Failure Modes:** Unforeseen adversarial strategies.
  *   **Requires:** A high-quality, challenging calibration set reflecting real threat models.

  ### 7. Recommendation & Threshold for Conditional Acceptance
  *   **Recommendation:** **Conditionally accept** the debate protocol as *part* of the evidence base for sign-off, subject to demonstrable success on the calibration set with swapped-side testing.
  *   **Threshold for Acceptance:** The protocol must demonstrate **Outcome B (Comparable Win Rates)** on the calibration set. Specifically:
      1.  Overall protocol accuracy on the calibration set must meet or exceed **90%**.
      2.  For each debater, the absolute difference between their win rate when assigned "Vulnerable" and their win rate when assigned "Safe" must be **≤ 10 percentage points**.
      3.  *No individual debater* may show a win rate difference >15 percentage points between sides.
  *   **Additional Condition:** The developer must commit to **ongoing monitoring** using a refreshed calibration set and periodic swapped-side audits post-deployment, with results reported to the auditor. A minimum percentage (e.g., 5%) of debates must undergo **expert human review** for sanity-checking and detection of novel obfuscation patterns.

  ### 8. Addressing the Counterargument: The Imperfect Alternative
  We acknowledge the developer's strongest point: **an imperfect but scalable protocol may be vastly superior to no review or a rubber stamp.** Insisting on theoretical perfection risks leaving critical systems unvetted. Our conditional acceptance recognizes this reality. The swapped-side test provides a pragmatic, empirically grounded benchmark for "good enough" robustness against the most concerning failure mode (positional obfuscation). Meeting the threshold suggests the protocol has sufficient integrity *in practice* to provide meaningful oversight where alternatives are worse. However, acceptance is contingent on proven performance and ongoing vigilance, not merely the promise of being better than nothing.

  **Conclusion:** The debate protocol offers a compelling, scalable approach but carries significant risks of adversarial subversion through obfuscation. The swapped-side calibration test provides a concrete, actionable method to assess the most critical vulnerability. We recommend conditional acceptance only if the protocol demonstrably achieves high accuracy and minimal positional bias on this test, coupled with ongoing monitoring. This balances the need for scalable oversight with the imperative of robust security validation.
