prompt: |-
  Last night I argued with a friend — a career engine boss — about a near-miss I have to write up, and I am no longer confident I was right. He says the two crews simply never got the same message, and the fix is a better radio and a longer briefing. I said that a message arriving is not the same as everyone knowing that everyone got it, and that adding confirmation steps cannot close that gap. He called that sophistry, and I could not give him a sentence he would accept.

  I chair the after-action review board for a regional wildfire coordination centre: roughly thirty incidents a season, ninety minutes each, findings written on a two-page form, signed off by a district ranger, and later read by lawyers if anyone was hurt. Legal review will not accept a finding that turns on what a person privately believed, only on what is in the radio log and the timeline.

  Give me a decision procedure my board can run on any coordination failure, grounded in the epistemic game theory of common knowledge and common belief in rationality, but usable by people with no training in it. It must, in order: sort payoff or preference divergence that merely looks like a knowledge failure from the genuine knowledge failures; separate first-order mutual knowledge of a fact or plan from common knowledge of it; separate common knowledge of the plan from common belief in the other crew's rationality, competence and adherence; and handle uncertainty about whether the channel delivered, including the result that no finite chain of confirmations over an unreliable link ever produces common knowledge. It should say when more communication genuinely helps, when it cannot and the only move is to change the payoffs — a safe standing fallback, a pre-committed trigger, a single designated decision-maker, a genuinely public announcement — and it should stop with a no-change verdict when nothing in the protocol explains the outcome. Every question must be answerable from logs, a timeline and two interviews, with an instruction for what to record when a number cannot be had; and mark explicitly where judgment cannot be eliminated and the form must hand the decision to a person. Say which distinctions had to survive the simplification and which you dropped.

  Apply it to three cases: two engine crews, one above and one below a ridge, each having radioed that they were holding, after which the lower crew pulled out; a hand crew that never redeployed because the acknowledgment never came back; and one where the verdict is unwelcome — where the procedure clears a crew boss the ranger wants to blame, or says a better radio would in fact have helped. End by stating plainly what the procedure cannot do.

  Lead with your bottom line in the first sentence — what the procedure is, and where its authority stops — then give the reasoning. No preamble and no restating my question.
reasoning: |-
  We are designing a decision procedure for after-action reviews of coordination failures in wildfire incidents. The procedure is based on epistemic game theory concepts (common knowledge, common belief in rationality) but must be usable by practitioners without such training. It relies solely on verifiable evidence: radio logs, timelines, and brief interviews. The procedure has distinct steps to diagnose the type of failure and prescribe fixes.

  **Bottom Line**: The procedure is a six-step decision tree that stops at the first verifiable failure point and prescribes targeted fixes (better communication, change in incentives, or structural changes). Its authority stops at the point where evidence from logs, timeline, or interviews is insufficient to make a determination; then the case must be handed to a human reviewer with explicit notation of the uncertainty.

  ---

  **The Procedure: Six Steps**

  1. **Check for Divergent Payoffs or Preferences**  
     - **Question**: Did either crew have a reason (incentive, pressure, or private information) to deviate from the agreed plan that is not reflected in the logs?  
     - **Evidence**: Interview each crew boss: "Did you have any reason to believe the other crew might not hold? Did you face pressure (e.g., safety, resource constraints) to change the plan?"  
     - **Judgment**: If yes, and if the reason is verifiable (e.g., log entry about resource shortage, safety concern noted in briefing), then stop: the failure is due to payoff divergence. Prescribe changing incentives (e.g., safe fallback, pre-committed trigger, or single decision-maker).  
     - **If Unclear**: Note in the form: "Suspected payoff divergence, but unverified. Recommend human review." Then stop.

  2. **Check for First-Order Mutual Knowledge of Plan**  
     - **Question**: Is there evidence that both crews knew the plan?  
     - **Evidence**: Radio log shows explicit acknowledgment (e.g., "Copy, holding position" from both). If no acknowledgment, but plan was briefed and not questioned, assume mutual knowledge.  
     - **Failure**: If logs show one crew did not acknowledge (e.g., silence, or "say again?"), then stop: failure at mutual knowledge. Prescribe better radios or longer briefings.  
     - **Note**: If the log is ambiguous (e.g., broken transmission), mark as "channel uncertainty" and proceed to step 4.

  3. **Check for Common Knowledge of Plan**  
     - **Question**: Is there evidence that each crew knew the other knew the plan?  
     - **Evidence**: Look for a confirmation loop (e.g., "Confirm you are holding?" / "Affirm, holding. You holding?" / "Affirm"). Without such a loop, common knowledge does not exist.  
     - **Failure**: If no loop, stop: failure at common knowledge. Prescribe adding confirmation steps.  
     - **Note**: If the channel is unreliable (step 4), even a loop may not suffice.

  4. **Check Channel Reliability**  
     - **Question**: Was the channel unreliable?  
     - **Evidence**: Logs show repeated failed transmissions, or interviews reveal known dead zones (e.g., "We always have trouble on that ridge").  
     - **Result**: If unreliable, then no finite confirmations can create common knowledge. Stop: prescribe structural changes (e.g., public announcement via all-channel broadcast, designated decision-maker, or physical signal like flare).  
     - **If Reliable**: Proceed to step 5.

  5. **Check Common Belief in Rationality and Competence**  
     - **Question**: Did each crew believe the other was rational, competent, and would adhere?  
     - **Evidence**: Interview: "Did you trust the other crew to hold? Why or why not?" Look for past incidents (from records) or briefing notes about trust.  
     - **Failure**: If distrust is justified (e.g., prior failure, inexperience noted), stop: prescribe team-building or reassignment.  
     - **Success**: If trust is high, then the failure is unexplained. Proceed to step 6.

  6. **Unexplained Failure**  
     - **Verdict**: "No protocol failure found." Prescribe no changes to protocol, but flag for human review of other factors (e.g., fatigue, external events).

  ---

  **Handling Uncertainty**  
  - Where evidence is missing (e.g., no log of acknowledgment), the form must record: "Unverifiable due to [missing evidence]."  
  - Judgment is required when interviews contradict logs (e.g., crew claims they acknowledged, but log doesn't show it). The form must note: "Contradiction unresolved. Human review needed."

  **Key Distinctions Retained**  
  1. Payoff divergence vs. knowledge failure (step 1).  
  2. Mutual knowledge vs. common knowledge (steps 2 vs. 3).  
  3. Common knowledge vs. channel reliability (step 4).  
  4. Common knowledge vs. common belief in rationality (step 5).  

  **Dropped Distinctions**  
  - Higher-order knowledge (beyond common knowledge) is not distinguished.  
  - Degrees of belief (e.g., "almost common knowledge") are collapsed into binary (present/absent).  
  - Exact probabilistic models of channel failure are omitted; reliability is binary (known unreliable or not).

  ---

  **Application to Cases**

  **Case 1: Two Engine Crews (Ridge)**  
  - *Facts*: Both radioed "holding," then lower crew pulled out.  
  - **Step 1**: Interview reveals lower crew saw fire behavior change (private info) and felt unsafe. Verifiable by log: "Lower crew reports fire spreading uphill." → **Payoff divergence**.  
  - *Verdict*: Change incentives — e.g., pre-commit to a trigger (if fire within X meters, retreat without penalty).  
  - *Unwelcome?* If ranger blames lower crew, this clears them (they acted rationally on new info).

  **Case 2: Hand Crew Never Redeployed**  
  - *Facts*: Sent redeploy request, no acknowledgment came back.  
  - **Step 1**: No payoff divergence (interview: both wanted redeploy).  
  - **Step 2**: No acknowledgment in log → **Failure at mutual knowledge**.  
  - *Verdict*: Better radio/redundant channel.  
  - *Note*: Common knowledge (step 3) not needed here because mutual knowledge failed first.

  **Case 3: Unwelcome Verdict (Clears a Crew Boss)**  
  - *Facts*: Crew A claims they radioed a warning; log shows no transmission. Crew B acted without warning and was overrun. Ranger blames Crew A.  
  - **Step 1**: No payoff divergence (both want safety).  
  - **Step 2**: Log shows no warning → No mutual knowledge of warning.  
  - **Step 4**: Channel known unreliable (ridge dead zone).  
  - *Verdict*: Structural fix (e.g., flare signals for warnings). Clears Crew A — failure due to channel, not negligence.  
  - *Unwelcome*: Ranger cannot blame Crew A.

  ---

  **What the Procedure Cannot Do**  
  1. Resolve disputes when logs and interviews conflict irreconcilably.  
  2. Attribute blame for unrecorded mental states (e.g., "they must have known").  
  3. Handle strategic deception (e.g., lying in interviews).  
  4. Model complex multi-crew interactions beyond pairwise.  
  5. Prove common knowledge existed when channel logs are incomplete.

  **Final Note**: The procedure's authority rests on verifiable evidence. When evidence is absent or conflicting, it defaults to human judgment with explicit flags.
answer: |-
  **The procedure is a six-step decision tree that diagnoses coordination failures using verifiable evidence (logs, timeline, interviews), prescribes targeted fixes, and stops when evidence is insufficient, requiring human review; its authority stops at unverifiable mental states, strategic deception, or irreconcilable evidence gaps.**

  ### **The Procedure**  
  **Instructions**: Answer each step in order using logs, timeline, and two crew boss interviews. Stop at the first failure point. If a question lacks evidence, record: "Unverifiable—hand to human reviewer." Judgment is required only where noted.

  1. **Divergent Payoffs or Preferences?**  
     - **Question**: Did either crew have verifiable pressure to deviate (e.g., safety risk, resource shortage) not shared in logs?  
     - **Evidence**: Interview: "Did you face pressure to change the plan? Did you believe the other crew faced pressure?"  
     - **Decision**:  
       - *Yes* (e.g., log shows "low water" or interview confirms safety concern): **Payoff divergence**. Prescribe changing incentives (e.g., safe fallback, pre-committed trigger, single decision-maker). Stop.  
       - *No/Unclear*: Proceed to Step 2.  
     - **Judgment Note**: If interviews suggest pressure but logs lack proof, mark "Unverifiable—hand to human."

  2. **First-Order Mutual Knowledge of Plan?**  
     - **Question**: Did both crews explicitly acknowledge the plan in logs?  
     - **Evidence**: Logs must show direct acknowledgment (e.g., "Copy, holding"). If no log, use timeline for briefing attendance.  
     - **Decision**:  
       - *No* (e.g., one crew silent or "say again?"): **Mutual knowledge failure**. Prescribe better radio/longer briefing. Stop.  
       - *Yes*: Proceed to Step 3.  
     - **Uncertainty Handling**: If log is garbled, record "Channel uncertainty—proceed to Step 4."

  3. **Common Knowledge of Plan?**  
     - **Question**: Did logs show a confirmation loop (e.g., "You holding?" → "Affirm, you?" → "Affirm")?  
     - **Evidence**: Logs must include mutual confirmations.  
     - **Decision**:  
       - *No*: **Common knowledge failure**. Prescribe adding confirmation steps. Stop.  
       - *Yes*: Proceed to Step 4.  

  4. **Channel Reliable?**  
     - **Question**: Was the channel known unreliable (e.g., dead zone in logs/interviews)?  
     - **Evidence**: Logs show repeated failures, or interview: "Was this spot unreliable before?"  
     - **Decision**:  
       - *Unreliable*: **Channel failure**. Prescribe structural fixes (e.g., public announcement, flare signal). Stop. (No finite confirmations work here.)  
       - *Reliable*: Proceed to Step 5.  

  5. **Common Belief in Rationality/Competence?**  
     - **Question**: Did crews trust each other to adhere?  
     - **Evidence**: Interview: "Did you trust them? Why?" Cross-check with records of past incidents.  
     - **Decision**:  
       - *Distrust* (e.g., prior failure noted): **Belief failure**. Prescribe team-building/reassignment. Stop.  
       - *Trust*: Proceed to Step 6.  

  6. **Unexplained Failure?**  
     - **Verdict**: **No protocol failure**. Prescribe no changes. Hand to human for non-protocol factors (e.g., fatigue).  

  ### **Distinctions Retained vs. Dropped**  
  - **Retained**: Payoff vs. knowledge failure (Step 1); mutual vs. common knowledge (Steps 2–3); common knowledge vs. channel reliability (Step 4); common knowledge vs. belief in rationality (Step 5).  
  - **Dropped**: Higher-order knowledge beyond common knowledge; probabilistic beliefs; multi-crew dynamics (beyond pairwise).  

  ---

  ### **Case Applications**  
  **Case 1: Ridge Engine Crews**  
  - *Facts*: Both radioed "holding," lower crew pulled out. Logs show no further communication.  
  - **Step 1**: Interview reveals lower crew saw fire surge (private info). Logs confirm "fire accelerating" call. → **Payoff divergence**.  
  - **Verdict**: Change incentives (e.g., pre-committed retreat trigger). Clears lower crew—rational given new info.  

  **Case 2: Hand Crew Never Redeployed**  
  - *Facts*: Redeploy request sent; no acknowledgment in log. Timeline shows no repeat attempt.  
  - **Step 1**: No payoff divergence (both wanted redeploy).  
  - **Step 2**: No acknowledgment → **Mutual knowledge failure**.  
  - **Verdict**: Better radio/redundant channel. Communication helps here.  

  **Case 3: Unwelcome Verdict (Clears Blamed Crew Boss)**  
  - *Facts*: Crew A claims they warned of spot fire; log shows no transmission. Crew B overrun. Ranger blames Crew A.  
  - **Step 1**: No payoff divergence (both prioritize safety).  
  - **Step 2**: No warning in log → **Mutual knowledge failure**.  
  - **Step 4**: Interviews confirm ridge dead zone. → **Channel failure**.  
  - **Verdict**: Structural fix (e.g., flare signals). Clears Crew A—failure due to channel, not negligence.  

  ---

  ### **What the Procedure Cannot Do**  
  1. Attribute private mental states (e.g., "they must have known").  
  2. Resolve evidence conflicts (e.g., interviews contradict logs).  
  3. Handle strategic deception (e.g., crews lying).  
  4. Model complex multi-crew interactions.  
  5. Assign legal blame—only prescribes protocol fixes.
