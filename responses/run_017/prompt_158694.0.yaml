  For diagnostics, conditions should distinguish real grounding from mimicry. Non-counterfeitable conditions include: consequences that force system changes, surprise from misinterpretations, and coherence maintenance. Counterfeitable aspects are stylistic, like emotional language.

  Unsettled areas: Whether non-biological systems can have genuine stakes. Philosophers debate if vulnerability requires embodiment. Also, if narrative identity equates to intentionality. The user's idea lives in these open questions, which is good for their novel.

