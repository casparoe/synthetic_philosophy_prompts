answer: |-
  ### Midterm Question: Akrasia and Hyperbolic Discounting (20 marks, max 900 words)  
  **Scenario:**  
  Mira is a hyperbolic discounter. At 9am she prefers *finishing her dissertation chapter* over *going to the pub*, and plans to work. By 4pm, she reverses her preference and goes to the pub, sincerely endorsing this choice *at that moment*. When the entire scenario (9am plan, 4pm choice) is shifted forward by one week, her 4pm preference reverts to favoring work.  

  Sam is time-consistent (exponential discounter). At 9am he prefers *work* over *pub*, and at 4pm he *still* prefers work. Yet he goes to the pub while sincerely saying, "I know I should be writing."  

  **Question:**  
  Critically evaluate whether *akrasia* (acting against one’s own better judgment) applies to Mira, Sam, both, or neither. Your analysis must:  
  1. Specify *whose judgment* (9am-Mira, 4pm-Mira, Sam) the 4pm action allegedly contradicts, and why.  
  2. Explain how Mira’s "relocation test" result (preference reversal vanishing under time-shift) bears on whether her 4pm choice conflicts with her "true" judgment.  
  3. Discuss whether Mira would be more or less likely to act akratically if she were *sophisticated* (anticipating her future reversals) rather than naive. Address one drawback of sophistication.  

  ---

  ### Model Answer (770 words)  
  Mira exhibits preference reversals but *not akrasia*, while Sam exemplifies akrasia despite his stable preferences. The distinction hinges on whether an agent acts against their *sustained, all-things-considered judgment at the time of action*.  

  **Mira’s Case: Reversal Without Conflict**  
  At 4pm, Mira’s choice aligns with her current judgment: she prefers the pub and acts accordingly. Her 9am judgment is irrelevant to akrasia at 4pm because she no longer holds it. Akrasia requires a conflict between judgment *and action at the same time*; Mira has no such conflict. The relocation test confirms this. When the decision shifts forward, her 4pm preference changes because hyperbolic discounting weights immediacy—not because her values shifted. Her judgment is *time-indexed*: "work is better *at 9am*" and "pub is better *at 4pm*" are both sincere expressions of her contextual preferences. Calling this akrasia confuses changing one’s mind with defying one’s mind.  

  **Sam’s Case: Conflict Without Reversal**  
  Sam’s 4pm action *is* akratic. He consistently judges work better than the pub at all times, yet chooses the pub while *avowing* this conflict. His judgment isn’t time-relativized; it’s stable but overridden. The akrasia lies in his failure to execute his own affirmed evaluation at the moment of choice—he acts against what he concurrently believes is best.  

  **The Relocation Test and "True" Judgment**  
  The relocation test challenges whether Mira’s 4pm preference reflects her "real" judgment. If her judgment were deep and stable, shifting time shouldn’t alter it. But the test shows her preference depends *only* on temporal proximity, not new information or reflection. This suggests her 4pm "judgment" is a passive response to immediacy, not an all-things-considered evaluation. However, this doesn’t prove akrasia. We might say her preferences are *shallow* or *impulsive*, but unless she *endorses a conflicting standard* at 4pm (like Sam), she isn’t acting against her own will. Her flaw is myopia, not weakness.  

  **Sophistication: A Double-Edged Sword**  
  If Mira were sophisticated (anticipating her 4pm reversal), she might avoid akrasia—but at a cost. Sophistication helps only if she can precommit *before* 4pm (e.g., scheduling a 3pm library lock-in). However, if precommitment fails, sophistication can backfire. Knowing she’ll cave at 4pm, she might "pre-cave" earlier (e.g., skipping work at noon), reasoning: "Why struggle now if I’ll fail later?" Naive Mira at least *plans* to resist, creating a chance of follow-through. Sophistication isn’t strictly superior; it trades the *hope* of adherence for the *risk* of earlier resignation.  

  **Concession and Conclusion**  
  One could argue Mira’s 9am judgment *is* her "true" view because it’s cooler and less context-bound. But this assumes a privileged "rational self" outside time—a contested view. Without evidence Mira repudiates her 4pm self (e.g., guilt), we lack grounds to call her weak-willed. Sam, however, explicitly disowns his action *as it happens*. Thus, only Sam displays akrasia: his action fractures his agency by defying his concurrent judgment. Mira merely revises her plans as circumstances (i.e., time) change. The hyperbolic model captures impulsivity, but only conflicted agency like Sam’s captures *akrasia*.  

  ---

  ### Marking Scheme (20 marks total)  
  **Award marks only if the move is clearly articulated. Typical fudges in brackets.**  

  1. **Distinguishes akrasia from preference reversal** (4 marks):  
     - Must state Mira acts on her 4pm judgment (no akrasia), while Sam defies his (akrasia).  
     - *(Fudge: Calls both "akratic" without clarifying judgment-at-time-of-action.)*  

  2. **Analyzes relocation test implications** (4 marks):  
     - Must argue that relocation shows Mira’s preference depends *only* on immediacy, but this doesn’t entail akrasia without concurrent conflict.  
     - *(Fudge: Claims relocation proves her 4pm self is "inauthentic" without explaining why this implies akrasia.)*  

  3. **Critiques sophistication** (4 marks):  
     - Must note sophistication can cause earlier capitulation or reduced effort due to fatalism, and isn’t better than naivety without precommitment.  
     - *(Fudge: Treats sophistication as universally beneficial or only discusses precommitment.)*  

  4. **Characterizes Sam’s akrasia** (4 marks):  
     - Must tie Sam’s akrasia to *concurrent* judgment-action conflict, independent of discounting models.  
     - *(Fudge: Attributes Sam’s failure to "poor willpower" without linking to his stable judgment.)*  

  5. **Overall coherence and precision** (4 marks):  
     - Answer is structured, avoids equivocation on "judgment," stays within scope.  

  ---  
  **The A/B Separator**: Move #3 (critique of sophistication).  
  - **Strong B (15/20)** might note sophistication aids precommitment but miss the risk of *earlier failure*.  
  - **A (18–20/20)** must identify that sophistication can *worsen* outcomes (e.g., "pre-caving") by undermining motivation, showing why it isn’t a panacea.
