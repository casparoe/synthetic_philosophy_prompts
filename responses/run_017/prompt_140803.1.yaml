prompt: |-
  I write fiction rather than scholarship, but next month I'm giving the evening lecture at a university's African American literature series, and I want to be ready for the questions.

  The thesis I'll defend: that Du Bois's propaganda criterion in "Criteria of Negro Art" — his insistence that all art is propaganda, and that a Black artist's work is to be measured by whether it serves his people's freedom — is best read as a claim about a work's stance toward its public, not about its message or its intended effects. Call a work claim-bearing when it addresses a public it expects to answer. I add a second condition of my own, which Du Bois does not state: the work must leave that public room to refuse. Call that answerability. On this reading art-for-art's-sake is not neutral ground but claim-bearing without answerability — the posture of a writer whose readers already share her premises — and so it, too, is propaganda in Du Bois's sense rather than an escape from it. I'll argue this beats the crude reading, on which propaganda is a message the work carries and which makes Du Bois's own novels merely failed art; and it beats the diplomatic reading, on which the propaganda passages are only rhetoric of the occasion. I close by showing the distinction at work in my own novel, where the propaganda is carried not by anything a character says but by a narration that withholds sympathy from a woman until the reader's own demand for sympathy is what stands indicted.

  The room will be about eighty people: mostly MFA students and creative writing faculty, who hold as a working faith that the writer's job is not to persuade and who have heard "propaganda" as an insult all their professional lives; two scholars of African American literature who work on the Harlem Renaissance, one avowedly on Alain Locke's side of the old quarrel with Du Bois; and an art historian who has written on propaganda and will want to know exactly how my two conditions differ from definitions already in circulation.

  I want a prep sheet, not a defense of the thesis. Give me the objections I'll actually get, ordered by how likely and how damaging they are, phrased the way each of these groups would phrase them — the writers' version of an objection will not sound like the scholars'. For each: a reply I can deliver in about ninety seconds, and a note on where that reply is softest. Tell me what to concede before anyone raises it, which single reply has to land for the evening to be worth having, and the question I'm hoping nobody asks.

  Two instructions on how to write it. Commit: rank the objections, say plainly which does the most damage, and tell me where I am simply wrong — do not hand me a menu of stances I might take. And lead with one sentence giving me the bottom line, the objection that will hurt most and what my answer to it turns on, before the sheet itself; no preamble and no restating what I've told you.
reasoning: |-
  Okay, the user is preparing for a lecture defending a specific interpretation of Du Bois's "propaganda" criterion in African American art. They need a prep sheet for potential objections, tailored to different audience groups: MFA students/faculty, African American literature scholars, and an art historian. 

  First, let's unpack their thesis: they argue Du Bois's "all art is propaganda" means art must address a public that can refuse its claims (answerability), not just deliver messages. Art-for-art's-sake isn't neutral but propaganda because it assumes shared values without allowing refusal. They'll apply this to their own novel's narrative technique.

  The audience tensions are clear:
  - Writers will resist "propaganda = inherent" as antithetical to artistic freedom.
  - Locke-aligned scholars will see this as misreading Du Bois vs Locke's pluralism.
  - The art historian needs precise differentiation from existing propaganda frameworks.

  Most dangerous objection: The scholars attacking the core Du Bois interpretation. If they dismantle the historical accuracy, the thesis collapses. The reply must anchor Du Bois's own words about audience expectation ("when he has the ear of the nation") and contrast with Locke's "invitation" rhetoric. But it's soft on why Du Bois didn't explicitly state answerability.

  For writers: Their "censorship" fear is predictable. Reply must reframe answerability as artistic rigor (sympathy withheld ≠ denied) and expose their "neutrality" as privilege. Soft spot: conflating political intent with didacticism.

  Art historian's "recycled theory" critique requires showing novelty via the bilateral claim/public relationship. Soft: overlap with Rancière's emancipated spectator.

  Must preemptively concede: Du Bois never used "answerability" term. Then pivot to textual evidence.

  The nuclear question: "Doesn't your novel's technique just manipulate guilt?" If asked, must admit indictment is deliberate but argue it's earned through craft.

  Key reply to land: The reframing of art-for-art's-sake as propaganda. That's the hinge for winning over writers.
answer: |-
  **Bottom line:** The most damaging objection comes from Locke-aligned scholars arguing your "answerability" requirement distorts Du Bois and ignores his actual authoritarian impulses; your reply hinges on Du Bois’s phrasing "when he has the ear of the nation" implying an *expectation of response*, not just transmission.

  ---

  ### Prep Sheet: Ranked Objections & Replies
  *(Ordered by likelihood + damage potential)*

  1.  **Scholars (Locke-aligned):**  
      *Objection:* "You’re grafting liberal pluralism onto Du Bois. He demanded art serve racial uplift *unconditionally*—see his attacks on McKay and Hughes. Your ‘answerability’ is Locke’s ‘invitation,’ not Du Bois’s mandate. This whitewashes his rigor."  
      *Reply (90s):* "Du Bois writes art must compel response *‘when [the artist] has the ear of the nation’*—that’s an implied public. His critique of ‘art as catharsis’ (McKay) targets work that *preempts* dialogue by indulging white voyeurism. My ‘answerability’ formalizes his distinction between art that demands engagement and art that assumes passive consumption. It’s not pluralism; it’s about art’s *relational* force."  
      *Soft Spot:* Doesn’t fully reconcile Du Bois’s harsh judgments with "room to refuse."

  2.  **MFA Writers/Faculty:**  
      *Objection:* "This reduces art to a debate club. If withholding sympathy is ‘propaganda,’ you’re saying all art with a point of view is manipulative. That’s censorship by another name—and kills ambiguity, which is literature’s oxygen."  
      *Reply (90s):* "Not at all. Ambiguity thrives in claim-bearing art! Think of Ellison’s Invisible Man—it demands you grapple with his refusal to be seen, yet leaves room to reject his conclusions. My point: Art that *expects* no answer (pure ‘art-for-art’s-sake’) often relies on unexamined consensus. Du Bois asks: *Who* is this ‘pure’ art for? If it assumes a public that already agrees, it’s propaganda for the status quo."  
      *Soft Spot:* Risks sounding like "all art is political" dogma, which writers resent.

  3.  **Art Historian:**  
      *Objection:* "Your ‘claim-bearing + answerability’ framework resembles Rancière’s ‘emancipated spectator’ or Brecht’s alienation, but less defined. How is this distinct from existing theories of audience agency?"  
      *Reply (90s):* "It’s specific to Du Bois’s concern with racialized publics. Where Brecht *forces* critical distance via technique, Du Bois implies a pre-existing social tension the artwork *engages*, not creates. Rancière assumes equality; Du Bois starts from inequality. ‘Answerability’ here means the work acknowledges its public *could* resist—unlike, say, a Soviet poster assuming ideological unity."  
      *Soft Spot:* Overlap with Rancière is real; distinction relies heavily on Du Bois’s context.

  4.  **Scholars (General):**  
      *Objection:* "Du Bois’s novels *are* didactic. Your reading excuses their flaws by redefining ‘propaganda’ post-hoc. If the ‘narration’ does the work, not character speech, why did he write essays *and* fiction?"  
      *Reply (90s):* "His essays make explicit claims; his fiction *performs* the demand. In *Dark Princess*, the narrative framing challenges the reader to condemn or embrace Kautilya’s radicalism—it doesn’t preach, it *positions*. The ‘failure’ is in not trusting readers enough, not in having a message. My model shows where that tension lives in the form itself."  
      *Soft Spot:* Concedes his fiction struggles aesthetically but shifts the critique.

  5.  **MFA Writers/Faculty (Secondary):**  
      *Objection:* "Calling art-for-art’s-sake ‘propaganda’ is cheapening the term. It’s like saying breathing is propaganda. You’re stretching Du Bois beyond usefulness."  
      *Reply (90s):* "Du Bois says: *‘All Art is propaganda and ever must be.’* He forces the question: What does ‘neutral’ art propagate? A lyric poem assuming universal human experience often propagates the *invisibility* of racial specificity. That’s not an insult—it’s a demand to see the politics in *all* creative assumptions. Neutrality is a stance."  
      *Soft Spot:* Feels semantic to artists who equate "propaganda" with heavy-handedness.

  ---

  ### Strategic Concessions & Keys
  - **Preemptively Concede:** "Du Bois never used the word ‘answerability.’ I’m extrapolating from his demand for art that *compels response* while acknowledging his own novels sometimes falter by not trusting readers enough."  
  - **Must-Land Reply:** **The counter to Objection #2 (MFA group).** If writers grasp that "art-for-art’s-sake" *also* has a political stance (by assuming consensus), they’ll engage. Frame it as: "Du Bois isn’t banning beauty—he’s asking *whose standards* define it, and who gets to be ‘neutral’?"  
  - **Nuclear Question (Hope Nobody Asks):**  
    *"Doesn’t your novel’s ‘withheld sympathy’ technique just guilt-trip white readers into agreement? Isn’t that emotional propaganda without real ‘answerability’?"*  
    *Why it’s lethal:* Implies your own work violates your Du Boisian ideal. Have a fallback: "It indicts the *automatic* demand for sympathy toward whiteness—the reader can reject that indictment, but must confront why they expect sympathy in that context." (Risky; tread carefully).

  ### Where You’re Wrong
  - **Overclaiming Du Bois’s Intent:** Your "answerability" lens is a *plausible* extension, but Du Bois *did* prioritize message over form at times. Admit this is a *reconstruction*, not pure exegesis.  
  - **Art Historian’s Point:** Your framework *is* derivative of audience-reception theory. Its novelty is in centering Du Bois’s racialized public sphere—not the mechanics.

  ---
  **Final Prep:** Drill the reply to #1 (scholars) and #2 (writers). They’re your make-or-break audiences. If the Locke scholar presses, cite *"Criteria"*: *"The apostle of Beauty thus becomes the apostle of Truth and Right not by choice but by inner and outer compulsion"*—that "outer compulsion" implies a public demanding accountability.
