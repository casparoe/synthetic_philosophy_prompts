prompt: |-
  Last night a friend and I spent three hours on the doomsday argument and got exactly nowhere: every move either of us made depended on some prior commitment the other refused to grant, and by the end we were just trading accusations of ad hocness. So before I read another defence or refutation, I want the specification I wish we had had on the table between us.

  Write the desiderata that any theory of self-locating or anthropic probability must satisfy in order to be usable for deciding whether the doomsday argument should shift a person's credence in near-term human extinction at all — by any margin that could matter to action, down to a single percentage point. That is the purpose the theory has to be good enough for; I don't want a theory of self-locating belief in general. For each requirement, give in a sentence or two the case or consideration that motivates it.

  Cover at least the following, but add any requirement I have not thought of if it belongs on the list, and drop any of mine that you think is really a demand of one camp rather than a genuine desideratum — saying which and why:

  1. The re-description constraint: the verdict must not change when the indexical information is redescribed without new content — being the nth member of your species, versus being the nth member of your species and also one of the first to have read a formulation of this argument, versus being the mth member of the set of beings who will ever have entertained such an argument. My friend's view handled the first two descriptions and fell apart on the third; mine handled the third and gave different numbers for the first two.
  2. The no-bespoke-rescue constraint: any resource invoked to defeat the argument — current growth rates, the calendar date, the fact that you are reading this sentence at all — must be statable as a general updating rule that a being who had never heard of the argument could apply, and must be fixed in advance rather than fitted to the conclusion you wanted.
  3. The unit problem: the answer should not depend on whether the reference class is counted in persons, person-years, or observer-moments; if it does, the theory must say which unit is privileged and why.
  4. The forgetting case: a future in which humanity persists for millions of years but in which no one ever again formulates an anthropic argument — call it the Alexandria future. The theory must say whether that counts as doom for the argument's purposes, and must give the same answer for a species in which no one ever formulates such an argument at all.
  5. The retrospective check: the theory must be able to say, in advance, what it would have expected us to observe in a world where we later learn that we were in a simulation, or that our species did in fact colonize — that is, it must leave itself checkable in principle, without taking as input the very quantity it is meant to estimate.
  6. Compatibility with ordinary updating on non-anthropic evidence: it should not let anthropic reasoning license ignoring census data, or, if it does, that has to be marked as a cost rather than hidden.

  Then: mark which requirements are non-negotiable and which are commitments one camp makes that its opponent need not share; flag any pair you suspect cannot be jointly satisfied (I suspect the re-description constraint and non-triviality are in tension); and name the single requirement that rules out the largest number of popular responses. Finally, in no more than one sentence each, score the self-sampling assumption, the self-indication assumption, and the "we simply have independent evidence about population sizes" response against your list.

  For each requirement, state how confident you are that it is a genuine desideratum rather than a prejudice of one side, and single out the requirement you are least confident about. I'm on a train with no signal, so don't point me to any reading and don't attribute anything to an author or a title: argue it out. Keep the whole thing under 1,000 words, with the requirements taking up most of it.
reasoning: |-
  Okay, the user wants a clear set of desiderata for evaluating theories of self-locating probability in the context of the Doomsday Argument. They had a frustrating debate with a friend and want to avoid getting stuck in the same loops. Let me unpack their query.

  First, they listed six specific constraints, each with a motivation. I need to ensure each is addressed, but also check if any should be added or removed. The user seems deeply familiar with the debate but wants neutrality. They’re likely a philosopher or someone with technical background, given the precise terms like "ad hocness" and references to SSA/SIA. Their frustration suggests they need pragmatism—something actionable for credence shifts, not just abstract theory.

  Looking at their constraints:
  1. **Re-description constraint**: This is about consistency under different indexical labels. The user mentions their friend’s approach failed on the third description. I agree this is non-negotiable—probabilities shouldn’t change with equivalent redescriptions. But I’m wary it might conflict with non-triviality, as they suspect. Need to flag that tension.
     
  2. **No-bespoke-rescue**: They want rules fixed in advance, not retrofitted to avoid doom. Absolutely non-negotiable—otherwise, the argument is unfalsifiable. This probably rules out many ad hoc defenses.

  3. **Unit problem**: Counting in persons vs. person-years is a classic issue. The theory must specify which unit is privileged. I think this is necessary but tricky—maybe non-negotiable for coherence, though some might accept ambiguity (but user wants decisiveness).

  4. **Forgetting case**: If humanity survives but forgets anthropics, does that count as doom? The theory must handle this uniformly. Non-negotiable for consistency, but I’m less confident—is "doom" about extinction or argument-relevance? User’s focus is on extinction, so this might be secondary. Marking it as negotiable.

  5. **Retrospective check**: The theory must allow pre-observation predictions (e.g., in simulated worlds). Crucial for testability—non-negotiable. Without it, the argument isn’t scientific.

  6. **Compatibility with ordinary updating**: Anthropic reasoning shouldn’t override hard data. Non-negotiable—else it breeds epistemic irresponsibility.

  Beyond their list, I’d add:
  - **Non-triviality**: The argument must sometimes shift credence, or it’s useless. But this clashes with re-description if redescriptions dilute the effect. High tension here. User hinted at this, so it’s a must-add.
  - **Epistemic modesty**: The theory shouldn’t require inaccessible knowledge (e.g., exact reference classes). Non-negotiable for practicality.

  Now, assessing popular responses:
  - **SSA**: Fails re-description (depends heavily on chosen class) and unit problem. Weak.
  - **SIA**: Fails no-bespoke-rescue (privileges "we exist" as evidence) and retrospective check. Worse.
  - **Independent evidence**: Sidesteps anthropics but violates the user’s goal—they want to evaluate if anthropic reasoning *itself* has force. So it fails the purpose.

  Biggest hurdles:
  - Re-description and non-triviality conflict—satisfying both may force a narrow reference class, inviting arbitrariness.
  - No-bespoke-rescue rules out most SIA defenses and "we’re special" counterarguments.

  Least confident about the forgetting case—it might conflate survival with argument-awareness, which isn’t core to doomsday. But user included it, so I’ll keep it as negotiable.

  Overall, the key is balancing consistency (re-description, testability) with applicability (non-triviality). The user needs a framework that doesn’t collapse under its own weight—hence stressing non-negotiable basics like no-bespoke-rescue and compatibility with ordinary updating.
answer: |-
  Here are the desiderata for a theory of self-locating probability to fairly evaluate the Doomsday Argument (DA), motivated by core epistemic principles. Requirements marked **★** are non-negotiable for any minimally coherent theory; others may involve trade-offs. Confidence levels (High/Medium/Low) indicate how sure I am that the requirement is neutral.

  1. **Re-description Constraint**  
     *Requirement:* Probabilistic conclusions must be invariant under logically equivalent redescriptions of indexical information (e.g., "nth human" vs. "nth human who read DA").  
     *Motivation:* Equivalent evidence should yield same beliefs; else, arbitrary framing dictates results.  
     *Confidence:* **High** (avoids subjectivity in labeling).  

  2. **No-Bespoke-Rescue Constraint ★**  
     *Requirement:* Any evidence invoked to neutralize DA (e.g., "we observe rapid growth") must be governed by a general, pre-specified updating rule applicable without DA knowledge.  
     *Motivation:* Prevents ad hoc exceptions fitted to avoid doom (e.g., "growth rates matter only when DA threatens").  
     *Confidence:* **High** (core to scientific objectivity).  

  3. **Unit Problem**  
     *Requirement:* The theory must specify a privileged reference class (persons, person-years, etc.) and justify why it’s fundamental—or show invariance across units.  
     *Motivation:* DA’s force changes wildly if switching from "persons" to "observer-moments" (e.g., long-lived post-humans dominate moments).  
     *Confidence:* **Medium** (unit choice may reflect ontological commitments, but must be explicit).  

  4. **Forgetting Case**  
     *Requirement:* The theory must consistently classify whether "doom" includes futures where humanity survives but loses anthropic reasoning (e.g., Alexandria future), and handle species that never develop such reasoning.  
     *Motivation:* Tests if DA depends on *our* ability to formulate it, which seems irrelevant to extinction risk.  
     *Confidence:* **Low** (arguably conflates survival with epistemic capacity; negotiable if doom strictly means extinction).  

  5. **Retrospective Check ★**  
     *Requirement:* The theory must generate testable pre-observational predictions (e.g., what we should expect to see if we are in a simulation or a galaxy-spanning civilization).  
     *Motivation:* Ensures the theory isn’t circular or unfalsifiable (e.g., "we’re special because we exist" explains nothing).  
     *Confidence:* **High** (basis for empirical accountability).  

  6. **Compatibility with Ordinary Updating ★**  
     *Requirement:* Anthropic reasoning cannot override direct non-anthropic evidence (e.g., census data) without explicit justification of conflict.  
     *Motivation:* Prevents DA from licensing absurd disregard for data (e.g., ignoring low birth rates because "anthropics say we’re early").  
     *Confidence:* **High** (preserves standard Bayesian norms).  

  **Added Requirements:**  
  7. **Non-Triviality Constraint**  
     *Requirement:* The theory must allow DA to shift credence in doom by *some* non-negligible amount under plausible conditions.  
     *Motivation:* If DA *never* affects beliefs, it’s epistemically inert; if it *always* does, it’s dogmatic.  
     *Confidence:* **Medium** (user wants DA evaluable, but fixed near-0% or 100% credence voids this).  

  8. **Epistemic Modesty ★**  
     *Requirement:* The theory must not require knowledge of inaccessible facts (e.g., exact size of extraterrestrial civilizations).  
     *Motivation:* DA must be usable by humans with our limited evidence.  
     *Confidence:* **High** (practical necessity).  

  ---  
  **Conflicts & Tensions:**  
  - **Re-description vs. Non-Triviality:** High tension. Strict re-description often dilutes DA’s effect (e.g., adding "DA-aware" to reference class makes "n" larger). Satisfying both may force arbitrary reference-class boundaries.  
  - **No-Bespoke-Rescue vs. SIA:** Fatal for SIA (see below).  

  **Most Exclusionary Requirement:**  
  **No-Bespoke-Rescue** rules out most popular defenses (e.g., "we observe technology, so doom is unlikely"), as they retrofit evidence without a general rule.  

  **Scoring Popular Responses:**  
  - **Self-Sampling Assumption (SSA):** Fails re-description (reference-class sensitivity) and unit problem.  
  - **Self-Indication Assumption (SIA):** Fails no-bespoke-rescue (privileges "we exist" as evidence arbitrarily) and retrospective check.  
  - **"Independent Evidence" Response:** Violates non-triviality (denies DA *any* force) and epistemic modesty (assumes population evidence is always accessible).  

  **Least Confident Desideratum:**  
  **Forgetting Case** (Requirement 4). Its necessity hinges on whether "doom" is purely existential or includes cognitive loss—a debatable framing.  

  ---  
