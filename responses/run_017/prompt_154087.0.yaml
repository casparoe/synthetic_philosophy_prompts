prompt: |-
  I've been reading LessWrong and the blogs adjacent to it for something like fifteen years, and next month I'm giving a talk to a meetup whose demographics are almost exactly that readership: mostly self-described consequentialists, maybe a quarter of them working in or adjacent to effective altruism, several with decision-theory or economics training, a couple of committed longtermists, one or two people who take contractualist and person-affecting views seriously, and essentially nobody with any appetite for rights-talk. Appeals to intuition will land badly. Expected-value framing, Harsanyi-style aggregation results, and the repugnant conclusion will all be in the room by minute two.

  The thesis I want to defend is not that utilitarianism is false. It is that the separateness-of-persons objection has been conducted at the wrong level of description, and that once it is moved to the right one it stops being a refutation of aggregation and becomes a parameter.

  A sketch of the argument, so you can aim objections at it: (i) what the objection turns on is not the number of persons but a structural feature I'll call non-fusion — the fact that goods located in distinct loci of agency do not fuse into a single larger good that anyone enjoys, even when those loci are unified in every other respect; (ii) this feature appears where there is no second person, in fission and gradual-replacement cases and, on a reductionist view of personal identity, in the relation between earlier and later stages of a single life; (iii) it fails to appear where there are two persons, if the case is built so that there is no fact of the matter about whose good is whose; so persons is a proxy for the property rather than the property; (iv) the upshot is that the dispute is best modeled as a dispute about a single scalar, the substitution rate at which a gain at one locus may be traded for a loss at another, with ordinary total utilitarianism as the rate-one limit and no-aggregation views as the rate-zero limit, and with intermediate rates being coherent rather than evasive.

  Please draft my Q&A prep sheet. Give me the seven-to-nine objections I will actually get from this specific audience — in their vocabulary, not a philosophy department's — ordered by probability of coming up multiplied by damage, each with a reply I could deliver in roughly ninety seconds and an honest note about where that reply is soft. Include: the thing I should concede in the talk itself rather than wait to be asked; the objection distinctive to the longtermist wing of the room; the objection that will be raised as a version of the do-the-numbers-count question; and the one I'm hoping nobody asks. Where an expected objection has a stock reply that this audience already knows and finds unsatisfying, say so explicitly and tell me what else I could try. Skip the objections a journal referee with Kantian sympathies would raise; that is not who is in the room.
reasoning: |-
  Okay, let me start by unpacking the user's request. They've been involved with the LessWrong community for about fifteen years and are preparing a talk for a meetup with a specific audience. The audience is mostly consequentialists, some in effective altruism, with training in decision theory or economics. There are longtermists and a few contractualists, but no one interested in rights-talk. The user's thesis is that the separateness-of-persons objection isn't about the number of persons but about "non-fusion," a structural feature where goods in different loci of agency don't combine. They want to reframe this as a parameter for substitution rates between loci.

  First, I need to understand the core argument. The user breaks it down into four points: non-fusion as the key feature, its presence in single-person cases like fission, its absence in cases with blurred personal identity, and the conclusion that aggregation should be a scalar substitution rate. The audience is highly analytical, so objections will be technical, focusing on decision theory, coherence, and implications for longtermism.

  The user wants a Q&A prep sheet with 7-9 objections ordered by likelihood and impact. Each objection needs a concise reply, weaknesses noted, and specific inclusions like concessions, longtermist objections, counting numbers, and the dreaded question. I should avoid Kantian objections since they're irrelevant here.

  Considering the audience's background, objections will likely stem from coherence, practical implications, decision theory conflicts, and mathematical tractability. For example, how does this framework handle population ethics or cluelessness? Longtermists might worry about discounting future generations. The "numbers count" question will arise but framed in terms of aggregation rates. The hardest objection might be about the arbitrariness of the substitution rate without a normative basis.

  I recall that this audience values expected value calculations and dismisses intuition. So replies must use their frameworks, not philosophical intuition. Stock replies they find unsatisfying should be avoided. For instance, saying "aggregation is necessary" isn't enough; they want a decision-theoretic justification.

  I should structure the objections by probability and damage. High-probability, high-damage ones first. Concession upfront: admit that the substitution rate is underdetermined. Longtermist objection: temporal substitution vs. interpersonal. Numbers count: how the scalar affects headcounts. The dreaded question: whether non-fusion implies no aggregation at all.

  For replies, I need to be concise, using examples like fission cases to show non-fusion in one person. Weaknesses: the scalar might be arbitrary without a grounding principle. Alternative approaches could involve coherence constraints or reflective equilibrium, but these might not satisfy everyone.

  Also, the user mentioned contractualists and person-affecting views. I should include an objection about contractualism not requiring aggregation, with a reply that focuses on mutual advantage under uncertainty.

  Finally, ensuring the language matches the audience—terms like "utility monster," "Pareto," "ex ante Pareto," and references to Harsanyi and Bostrom. Avoiding moral terms, sticking to decision theory and coherence.
answer: |-
  Here’s a targeted Q&A prep sheet for your audience, prioritizing objections based on likelihood × damage (highest first). Replies are calibrated for <90s delivery, with explicit soft spots. Vocabulary mirrors LW/EA discourse (decision theory, coherence, ex ante Pareto, etc.).

  ---

  ### **Concession to Make in the Talk (Preemptively)**
  **"I concede that the substitution rate scalar is radically underdetermined by theory alone. It needs empirical/pragmatic constraints (e.g., evolutionary psychology, coordination dynamics) to avoid arbitrariness. This is a feature, not a bug—it forces engagement with messy reality."**  
  *(Preempts "Who sets the rate?" objections and signals you’re not dodging hard choices.)*

  ---

  ### **Objection 1: "This Just Rebrands the Problem—Why Call This ‘Aggregation’ at All?"**  
  *(Probability: 90% | Damage: High | Combines "word games" + "evasion" critiques)*  
  **Reply:** "It’s aggregation *as tradeoff structure*, not summation. In a fission case, you’d trade between branches if coherence demands it (e.g., saving Branch A’s leg vs. Branch B’s arm). Non-fusion doesn’t forbid tradeoffs—it quantifies their *costliness*. Total utilitarianism assumes cost=1; this generalizes it to cost=*c*, where *c* can vary by context."  
  **Soft Spot:** Doesn’t specify *when* tradeoffs are mandatory. Audience may see this as smuggling in aggregation through coherence constraints.  
  *Skip stock reply:* "Aggregation is necessary for action" (they know; they want *why this structure*).

  ---

  ### **Objection 2: "This Collapses into Total Utilitarianism Under Longtermism"**  
  *(Probability: 85% | Damage: High | Distinctively longtermist)*  
  **Reply:** "Only if your substitution rate *r* = 1 across time and persons. But temporal non-fusion (e.g., future-you vs. present-you) suggests *r* < 1. If you discount intrapersonally for temporal distance (*r_t* < 1), consistency demands *r_i* < 1 interpersonally. Otherwise, you’re privileging spatial separation over temporal separation arbitrarily."  
  **Soft Spot:** Assumes temporal discounting is rational—longtermists may reject this *entirely*.  
  *Alternative:* "Even Bostrom accepts ‘exponential discounting’ for computational limitations; this is analogous."

  ---

  ### **Objection 3: "How Do You Avoid the Utility Monster Without Rights?"**  
  *(Probability: 80% | Damage: Medium-High)*  
  **Reply:** "The monster’s demand only dominates if *r* = 1. If *r* < 1 (e.g., gains to others don’t fully offset my losses), the monster’s claim diminishes. Set *r* via reflective equilibrium: Would you accept a 0.001% risk of being the monster’s victim for its happiness? If not, *r* < 1."  
  **Soft Spot:** Still permits *some* monster-enabling if *r* > 0. Contractualists will press "Why allow *any*?"  
  *Skip stock reply:* "Monsters are unlikely" (audience cares about principle).

  ---

  ### **Objection 4: "What Breaks Symmetry Between Interpersonal and Intrapersonal Cases?"**  
  *(Probability: 75% | Damage: Medium)*  
  **Reply:** "Nothing in structure—but *empirical* differences matter. Shared goals, empathy, or evolutionary kin selection may lower interpersonal transaction costs, effectively reducing *r*. But in high-stakes strangers (e.g., AI alignment), *r* may approach intrapersonal levels."  
  **Soft Spot:** Feels like handwaving. Need concrete examples (e.g., organ transplant dilemmas).

  ---

  ### **Objection 5: "Do Numbers Count? Why Not Pareto-Only?"**  
  *(Probability: 70% | Damage: High | "Numbers count" variant)*  
  **Reply:** "Pareto is *r* = 0: no tradeoffs. But in non-identity cases (e.g., creating happy vs. happier people), Pareto is silent. If we set *r* > 0, we *can* compare. The scalar quantifies *how much* numbers count: *r* = 0.01 means 100 people gaining 1 util ≈ 1 person losing 1 util."  
  **Soft Spot:** Doesn’t justify *r* > 0 normatively—just shows it’s coherent.  
  *Skip stock reply:* "Pareto leads to paralysis" (they know; demand justification for *r* > 0).

  ---

  ### **Objection 6: "This Undermines Cooperative Game Theory / Harsanyi"**  
  *(Probability: 65% | Damage: Medium)*  
  **Reply:** "Harsanyi assumes identical weights (*r* = 1). This generalizes his veil-of-ignorance: behind the veil, you’d maximize *weighted* expected utility, with weights reflecting substitutability. If non-fusion makes identity uncertain (e.g., fission), weights drop below 1."  
  **Soft Spot:** Harsanyi’s theorem requires linear aggregation; nonlinear *r* breaks it. May need new equilibrium concepts.

  ---

  ### **Objection 7: "How Is This Actionable? It Just Adds a Free Parameter!"**  
  *(Probability: 60% | Damage: Medium)*  
  **Reply:** "It forces explicitness. EA interventions often implicitly assume *r* ≈ 1 (e.g., DALYs). But if *r* < 1 for some groups (e.g., future vs. present), cost-effectiveness changes. Calibrate *r* via revealed preference: What risk *would you take* to benefit a stranger?"  
  **Soft Spot:** Revealed preferences are noisy/contradictory.  
  *Alternative:* "Treat *r* as a robustness check: if conclusions hold for *r* ∈ [0.1, 1], worry less."

  ---

  ### **The Dreaded Objection (Hope Nobody Asks)**  
  **"Doesn’t Non-Fusion Imply *No* Aggregation? Why Not *r* = 0?"**  
  *(Probability: 40% | Damage: Catastrophic | From contractualists/person-affecting holdouts)*  
  **Reply:** "Because *r* = 0 can’t handle:  
  (1) **Symmetry**: If you’re indifferent between saving Alice or Bob (same utility), you’ve set *r* = 1 *for that choice*.  
  (2) **Uncertainty**: Under identity confusion (e.g., gradual replacement), *r* = 0 forces incoherent preferences.  
  (3) **Pragmatism**: *r* = 0 forbids *any* sacrifice for others—including trivial ones (e.g., stepping aside to avoid bumping)."  
  **Soft Spot:** Contractualists can bite the bullet on (3); person-affecting views may reject (2).  
  *Last Resort:* "Even with *r* = 0, you need *some* aggregation to define ‘persons’—which loops back to non-fusion."

  ---

  ### **Key Prep Principles for This Audience**
  1. **Weaponize Coherence**: Frame objections as violations of consistency (e.g., temporal vs. interpersonal symmetry).  
  2. **Decision Theory > Morality**: Anchor replies in preference ordering, not "oughts."  
  3. **Preempt "Arbitrariness"**: Stress that *r* is a measurable (in principle) feature of agency structures.  
  4. **Use Their Shibboleths**: Fission cases, ex ante Pareto, and utility monsters are familiar ground—start there.  

  Good luck—this crowd will keep you honest. Watch for the longtermist and contractualist flanking maneuvers.
