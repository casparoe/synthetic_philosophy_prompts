  #### (iii) The bit at x=1

  At x=1, we know we have the smaller envelope (because the only way to see 1 is if A=1 and we picked the smaller). So we know for sure that the other envelope has 2. So switching gives 2. But re-rolling gives 3.5 on average. So 3.5 > 2, so re-rolling is better.

  The author says: "even full information about which envelope you hold isn't enough to make switching right; you also need the prior to be optimistic about scale"

