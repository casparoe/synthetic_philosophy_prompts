answer: |-
  Below is a self-scoring quiz designed to help users understand how their previous information environment functioned, based on concrete, observable features. It avoids jargon, labels, or self-identification, and focuses on 10 plain-language questions about their direct experiences. The decision tree sorts users into 7 distinct "leaves" (categories) that describe the functional dynamics of their past community. Each leaf includes a plain name and a one-sentence "awkward commitment" (what the user must accept about their position). Combinations that cannot be cleanly separated are flagged, along with extra questions to resolve them. Logically impossible/unoccupied combinations are noted.

  ---

  ### **The Quiz: How Did Your Information Environment Work?**
  **Instructions:** Answer each question based on your experience **while you were still part of the community**. Choose the option that best fits. No jargon—just concrete yes/no/type observations.

  1. **Did you ever encounter the strongest version of the opposing viewpoint?**  
     - A: No, I never saw it.  
     - B: Yes, and it made me less confident in the group.  
     - C: Yes, but it didn’t change my mind or made me more certain.  

  2. **How did you develop distrust of outsiders?**  
     - A: From my own experiences (e.g., bad interactions).  
     - B: From someone inside I already trusted (e.g., a leader/friend said they were bad).  
     - C: I didn’t distrust outsiders.  

  3. **How active was recruitment/posting outside the group?**  
     - A: Very active—we posted outward constantly, but little came back in.  
     - B: Balanced—some posting out, some outside content came in.  
     - C: Not active—we rarely posted out, and outside content was common.  

  4. **How was "bad" information filtered?**  
     - A: By specific people (e.g., mods deleting posts).  
     - B: Diffusely (e.g., feeds hid things, members ignored/downvoted).  
     - C: Minimal filtering—most things were visible.  

  5. **Could you have predicted what evidence would change your mind? And if it appeared, would the group accept it?**  
     - A: Yes, I knew—and the group would have accepted it.  
     - B: Yes, I knew—but the group would have rejected it.  
     - C: I couldn’t predict what would change my mind.  

  6. **How did the group describe outsiders who disagreed?**  
     - A: As mistaken or misinformed.  
     - B: As corrupt, evil, or malicious.  
     - C: Rarely discussed outsiders.  

  7. **Was there a cost to asking beginner questions (e.g., "Why do we believe X?")?**  
     - A: Yes (e.g., shaming, silencing, suspicion).  
     - B: No—it was safe to ask.  
     - C: I never saw anyone ask.  

  8. **How often were you exposed to opposing views?**  
     - A: Rarely/never.  
     - B: Occasionally.  
     - C: Constantly/daily.  

  9. **After leaving, did your distrust of outsiders change?**  
     - A: Yes—I now trust some outsiders.  
     - B: No—I still distrust them (including helpers here).  
     - C: I never distrusted them.  

  10. **Was the group right about the big things?**  
      - A: No—mostly wrong.  
      - B: Yes—mostly right.  
      - C: I’m unsure.  

  ---

  ### **Decision Tree & Scoring Key**
  Follow these steps to find your leaf. Start at Step 1 and move to the next step only if the condition isn’t met.  
  *(Symbols: "&&" = and, "||" = or, "!" = not)*  

  1. **If** (Q7 = A) && (Q2 = B) && (Q6 = B) && (Q9 = B) && (Q10 = A or C) → **Leaf 6: Lingering Distrust**  
  2. **Else if** (Q10 = B) && (Q1 = A || Q8 = A) → **Leaf 5: Fortress That Held**  
  3. **Else if** (Q8 = C) && (Q1 = C) → **Leaf 7: Battle-Hardened**  
  4. **Else if** (Q3 = A) → **Leaf 3: One-Way Valve**  
  5. **Else if** (Q2 = B) && (Q6 = B) && (Q7 = A) → **Leaf 2: Borrowed Distrust**  
  6. **Else if** (Q1 = A) && (Q8 = A) && (Q7 = B) && (Q5 != B) → **Leaf 1: Unchallenged Bubble**  
  7. **Else if** (Q4 = A or B) && (Q7 = B) && (Q5 = A) && (Q6 != B) → **Leaf 4: Curated Space**  
  8. **Else** → **Unclassified** (Your experience doesn’t fit cleanly—see a mod for discussion).  

  ---

  ### **The 7 Leaves: Names & Awkward Commitments**
  1. **Unchallenged Bubble**  
     *Most awkward commitment:* You must accept that you never faced strong counter-evidence, so your confidence was built on what you *didn’t* see.  
     *For:* Purely closed-by-omission communities.  

  2. **Borrowed Distrust**  
     *Most awkward commitment:* You must accept that your distrust wasn’t earned—you adopted it from someone you liked, not from proof.  
     *For:* Full discrediting via trust transfer.  

  3. **One-Way Valve**  
     *Most awkward commitment:* You must accept the group prioritized output (recruiting/posting) over input, making it a broadcast, not a conversation.  
     *For:* Communities producing constant outbound material but admitting almost nothing.  

  4. **Curated Space**  
     *Most awkward commitment:* You must accept that the filtering kept out not just "bad" ideas, but potentially valuable ones too.  
     *For:* Specialist communities with gatekeeping (not inherently harmful).  

  5. **Fortress That Held**  
     *Most awkward commitment:* You must accept that even if the group was right, your position relied on isolation, not evidence-testing.  
     *For:* Closed communities that happened to be correct.  

  6. **Lingering Distrust**  
     *Most awkward commitment:* You must accept that you’re still applying the group’s "distrust rules" to helpers, even after rejecting its beliefs.  
     *For:* Physically left but discrediting mechanism still runs.  

  7. **Battle-Hardened**  
     *Most awkward commitment:* You must accept that constant opposition didn’t correct you—it weaponized you.  
     *For:* Exposed to opposing views daily, but it hardened you.  

  ---

  ### **Notes on Ambiguity & Gaps**
  - **Curated Space (4) vs. Borrowed Distrust (2)**: These look similar (both filter, both rely on trust).  
    - *How to separate them:* Borrowed Distrust **requires** active discrediting (Q6=B, Q7=A). Curated Space has filtering but no malice (Q6≠B, Q7=B, Q5=A).  
    - *Extra question if unclear:* "If an outsider provided strong evidence, would the group have discussed it fairly?" (Curated=yes; Borrowed=no).  

  - **Unchallenged Bubble (1) vs. Curated Space (4)**: Both may avoid opposing views.  
    - *How to separate them:* Unchallenged Bubble has **no filtering** (Q4=C) and **no defined evidence-testing** (Q5≠A). Curated Space has filtering (Q4=A/B) and defined testing (Q5=A).  
    - *The tree forces separation* via Q5 and Q4.  

  - **Logically impossible combinations**:  
    - **Lingering Distrust (6) + Fortress That Held (5)**: Impossible because Lingering requires current disbelief (Q10=A/C), Fortress requires belief (Q10=B).  
    - **Battle-Hardened (7) + Unchallenged Bubble (1)**: Impossible—Battle-Hardened requires constant exposure (Q8=C), Unchallenged requires little/none (Q8=A).  

  - **Unoccupied (but possible) combinations**:  
    - **Borrowed Distrust (2) + Curated Space (4)**: Theoretically possible (e.g., a cult with peer review), but unattractive—groups rarely mix strict curation with open evidence-testing (Q5=A) and active malice (Q6=B).  
    - **One-Way Valve (3) + Battle-Hardened (7)**: Rare—constant recruitment (Q3=A) and constant opposition (Q8=C) imply a "siege mentality," but few groups sustain both.  

  ---

  ### **Glossary for Moderators**
  *(Plain-language summaries for your reference—do not share with users)*  
  - **Unchallenged Bubble**: Closed by omission. No exposure to alternatives.  
  - **Borrowed Distrust**: Active discrediting; distrust adopted from trusted insiders.  
  - **One-Way Valve**: High outbound activity (recruiting/posting), low inbound input.  
  - **Curated Space**: Gatekeeping via experts/peers—filters rigorously but allows evidence-testing.  
  - **Fortress That Held**: Closed and correct—problem is isolation, not beliefs.  
  - **Lingering Distrust**: Left the group but distrusts everyone (including helpers).  
  - **Battle-Hardened**: Opposition hardens beliefs; exposure backfires.  

  ---

  ### **How to Use This**
  1. Share the quiz with users privately (e.g., via DM or form).  
  2. Run answers through the tree to assign a leaf.  
  3. Share **only the leaf name and awkward commitment** with the user—this avoids overwhelming them.  
  4. Use the glossary internally to guide support (e.g., Lingering Distrust users need patience; Battle-Hardened need low-pressure engagement).  

  This tool focuses on **functional dynamics**, not beliefs, to bypass defensiveness. It validates varied experiences while highlighting the invisible structures that shaped them.
