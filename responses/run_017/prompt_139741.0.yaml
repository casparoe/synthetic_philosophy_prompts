prompt: |-
  You are a decision theorist who has published on the value of information. Think carefully and, before settling on an answer, lay out the candidate mechanisms you can think of and test each one against the cases below.

  In health economics we repeat a platitude: more information can never leave a chooser worse off, because someone who has it can always do whatever she would have done without it. Being informed adds options; it never removes them. This is offered as the reason a diagnostic test is at worst worth nothing.

  I keep meeting situations where it looks false, and I cannot tell whether I have found one phenomenon or several.

  One: a woman declines a predictive genetic test. She is not confused about the probabilities. She expects that if she learns she carries the variant she will be unable to stop herself from choosing a prophylaxis she currently regards as worse than waiting. Paying not to be told is how she secures the choice she wants.

  Two: a patient would rather hear nothing until the result is conclusive, because the interval of not knowing is itself miserable and the test lengthens it. Here the message does not merely guide action; receiving it is part of what happens to him.

  Three: a firm decides whether to commission a market study, where the commissioning itself is visible to a competitor, who infers the firm's plans from it and moves first.

  A colleague says the positive half has a classical name — he thought something like Good's theorem, perhaps from a short paper in the 1960s — but he could not state its assumptions, and I suspect it is really a bundle: something about ranking prospects by averaging outcomes against their probabilities, something about being free to disregard the message, something about no one else reacting.

  So I am not fishing for a label. Tell me whether there is an established concept, or a settled taxonomy, for the ways information becomes harmful. For each of my three cases, identify which assumption does the work and say whether the case is a genuine counterexample to the platitude or merely a case where a hypothesis quietly fails. One and three resemble each other in that someone later reacts — the chooser's own future self in one, a rival in the other — and differ in another respect; tell me which resemblance is the theoretically important one. Then take up a fourth suspicion I cannot turn into a case: that for a chooser who does not rank prospects by probability-weighted averaging at all, but by the worst case over a range of probability assignments, resolving a question can destroy a hedge and so hurt even when the message is free and could in principle be ignored. If that is real, give me a minimal example; if it is impossible, say exactly what rules it out.

  There is also a behavioural-finance label for investors who avoid opening their statements in a falling market. My sense is that it concerns where attention goes rather than the structure of the choice, but say whether the two collapse into one. If nothing established covers what I am after, coin a term, define it, and give me the boundary cases that settle membership — including what should not count.
reasoning: |-
  We are examining the platitude that "more information can never leave a chooser worse off" and considering three cases that challenge this idea. We also have a fourth potential case about a chooser who uses a minimax criterion. Additionally, we are asked to compare the cases and to address a behavioral finance example.

  The classical result that supports the platitude is often attributed to Good (1967) in his paper "On the Principle of Total Evidence." Good's theorem essentially states that, under certain assumptions, the expected utility of making a decision after seeing the outcome of an experiment is at least as great as the expected utility of making a decision without that experiment. The key assumptions are:

  1. The decision maker is a expected utility maximizer (so they rank prospects by probability-weighted averaging).
  2. The decision maker can condition their action on the information received (so they can choose an action that depends on the message).
  3. The information is free (there is no direct cost of acquiring the information).
  4. The acquisition of information does not change the state of the world (i.e., no direct effect on the environment) and does not reveal the acquisition to other agents who might react.

  The cases presented seem to violate one or more of these assumptions. Let's go through each:

  **Case One: Predictive genetic test**

  A woman declines a test because she believes that if she learns she carries the variant, she will choose a prophylaxis that she currently deems worse than waiting. By not taking the test, she avoids the information that would (in her view) lead her to make a suboptimal choice.

  - **Mechanism**: This is a case of a change in preferences or self-control issues. The future self, upon receiving the information, would make a choice that the current self believes is worse. The key here is that the decision maker is not a unitary agent over time. The current self and the future self have different preferences or beliefs about what is optimal. The current self uses the lack of information as a commitment device to prevent the future self from making a choice that the current self disprefers.

  - **Assumption violated**: The assumption that the decision maker can freely condition on the information and choose the best action given the new information. In this case, the decision maker (the future self) does not choose the action that the current self would prefer. The freedom to disregard the information is not the issue because the future self will not disregard it. The issue is that the future self will act differently than the current self would like. Moreover, the standard model assumes that the decision maker is consistent over time. This case introduces time-inconsistency.

  - **Is it a genuine counterexample?** Yes, because the information acquisition leads to a change in behavior that the current self deems worse. The platitude assumes that the decision maker can always choose the same action as before, but here the decision maker (the future self) will not choose that action.

  **Case Two: Waiting for conclusive results**

  The patient prefers not to receive intermediate information because the state of uncertainty is itself aversive. The process of waiting and being uncertain causes disutility.

  - **Mechanism**: The information acquisition process extends the period of uncertainty, and the state of not knowing is a direct source of disutility. The message itself (or the process of waiting for it) is a direct source of disutility.

  - **Assumption violated**: The standard model assumes that the information is free in the sense that it has no direct impact on utility. However, in this case, the act of receiving the message (or the state of suspense) is costly. The model typically only considers the instrumental value of information (i.e., how it helps in making better decisions) but not the experiential or emotional costs.

  - **Is it a genuine counterexample?** Yes, because the information has a direct negative effect on utility during the period of uncertainty. The platitude assumes that information only affects utility through the choice it enables, but here it also affects utility directly.

  **Case Three: Market study visible to competitor**

  The firm's decision to commission a market study is visible to a competitor, who then reacts by moving first, thereby changing the market conditions.

  - **Mechanism**: The acquisition of information is not a private act. It signals the firm's intentions to a competitor, leading to a strategic response that worsens the firm's position.

  - **Assumption violated**: The standard model assumes that the information acquisition does not change the state of the world. Here, by acquiring the information, the firm changes the game: the competitor observes the action and reacts. This is a violation of the assumption that the environment is fixed and not affected by the act of acquiring information.

  - **Is it a genuine counterexample?** Yes, because the act of acquiring information triggers a change in the environment (the competitor's move) that makes the firm worse off.

  **Comparison of Cases One and Three:**

  Both cases involve a reaction: in Case One, the reaction is from the decision maker's own future self, and in Case Three, the reaction is from a competitor. The theoretically important resemblance is that in both cases, the acquisition of information leads to a change in the behavior of an agent (the future self or the competitor) that the current decision maker would prefer to avoid. This change in behavior is not accounted for in the standard model. The key difference is that in Case One, the reaction is internal (within the same agent over time) and in Case Three, it is external (another agent). However, the violation of the assumption that the environment remains fixed is the common thread.

  **Fourth Case: Minimax decision maker**

  Consider a decision maker who uses a minimax criterion: they rank prospects by the worst possible outcome over a set of probability distributions (a set of priors). The question is whether resolving uncertainty can hurt such a decision maker, even when the message is free and can be ignored.

  - **Mechanism**: In the minimax model, the decision maker chooses an action that minimizes the maximum loss over the set of possible priors. Having less information might allow the decision maker to maintain a hedge that performs reasonably well across all possibilities. When information is acquired, it might reveal that the true state is in a part of the state space where the previously robust action is now known to be suboptimal, but the best action for that specific state might be very bad in other states that are now ruled out. However, note that the decision maker can change their action after receiving the information. So the standard argument would be that the decision maker can always choose the same action as before, so they are at least as well off.

  But let's construct an example:

  Suppose there are two states of the world: A and B. The decision maker has two actions: 
  - Action X: yields 1 in state A and 0 in state B.
  - Action Y: yields 0 in state A and 1 in state B.

  Without any information, the minimax decision maker (who minimizes the maximum loss) would note that the worst outcome for X is 0 (in state B) and for Y is 0 (in state A). So they are indifferent. Suppose they choose X arbitrarily.

  Now, suppose they can get a free signal that perfectly reveals the state. If they get the signal and it says A, they will choose X (getting 1) and if it says B, they will choose Y (getting 1). So they always get 1. This is better than the 0 they would get in the worst state without information. So it seems beneficial.

  But consider a different set of actions and a set of priors:

  Suppose the decision maker has a set of priors: they think the probability of state A is either 0.4 or 0.6. The actions available are:
  - Action P: yields 2 in state A and -1 in state B.
  - Action Q: yields -1 in state A and 2 in state B.
  - Action R: yields 0 in both states.

  Without information, the decision maker evaluates each action by the worst expected utility over the set of priors.

  For Action P:
  - If prior is 0.4 for A: expected utility = 0.4*2 + 0.6*(-1) = 0.8 - 0.6 = 0.2
  - If prior is 0.6 for A: expected utility = 0.6*2 + 0.4*(-1) = 1.2 - 0.4 = 0.8
    The worst case is 0.2.

  For Action Q:
  - If prior is 0.4 for A: 0.4*(-1) + 0.6*2 = -0.4 + 1.2 = 0.8
  - If prior is 0.6 for A: 0.6*(-1) + 0.4*2 = -0.6 + 0.8 = 0.2
    The worst case is 0.2.

  For Action R: always 0.

  So the minimax decision maker would choose R (since 0 is better than 0.2 in the worst case? Actually, note: we are minimizing the maximum loss, but in this case we are comparing expected utilities. The worst expected utility for R is 0, which is higher than the worst expected utilities for P and Q (which are 0.2). Actually, 0.2 is greater than 0, so the worst expected utility for R is 0, and for P and Q is 0.2 (which is better). This doesn't seem right.

  We must be careful: in the minimax expected utility model (Gilboa and Schmeidler), the decision maker maximizes the minimum expected utility. So they choose the action with the highest minimum expected utility. Here:

  - P: min expected utility = 0.2
  - Q: min expected utility = 0.2
  - R: min expected utility = 0

  So they would choose either P or Q, achieving a guaranteed minimum expected utility of 0.2.

  Now, suppose we can get perfect information about the state. After knowing the state, the decision maker can choose an action. If state A is revealed, the decision maker will choose P (which gives 2) or R (which gives 0) or Q (which gives -1). So they choose P and get 2. Similarly, if state B is revealed, they choose Q and get 2. So the expected utility with information depends on the true prior. But note: the decision maker doesn't know the prior, so we must compute the minimum expected utility over the set of priors for the whole strategy.

  After getting the signal, the decision maker can condition on the state. The expected utility for a given prior is the average of the utilities in each state, but since the signal is perfect, they get 2 in both states. So for any prior, the expected utility is 2. Hence, the minimum expected utility over the priors is 2. This is better than 0.2.

  So again, information helps.

  Let me try to build an example where information hurts. This is tricky because the decision maker can always ignore the information and choose the same action as before.

  But consider a case where the set of priors changes with the information. This is not standard. In the standard minimax expected utility, the set of priors is fixed and does not change with the information. The decision maker updates the set of priors by applying Bayes' rule to each prior in the set (and only keeps those that are compatible with the signal). This updated set is then used to compute the minimax expected utility.

  Now, suppose we have two states: A and B. The decision maker has two actions: 
  - Action S: yields 1 in state A and 0 in state B.
  - Action T: yields 0 in state A and 1 in state B.

  But the set of priors is such that without information, the decision maker is very cautious. Suppose the set of priors is {p: p(A) in [0.4, 0.6]}. Without information, the minimax decision maker evaluates:

  For S: min over p in [0.4,0.6] of p*1 + (1-p)*0 = min p = 0.4.
  For T: min over p in [0.4,0.6] of p*0 + (1-p)*1 = min (1-p) = 0.4 (since when p=0.6, 1-p=0.4).

  So they are indifferent and get at least 0.4.

  Now, suppose they get a free signal that is not very informative. The signal can be X or Y. The likelihood is:

  P(X|A) = 0.9, P(X|B)=0.1
  P(Y|A)=0.1, P(Y|B)=0.9

  Without the signal, they get 0.4.

  With the signal, they update the set of priors. Suppose the true prior is p(A)=0.5. But the decision maker has a set of priors. After seeing X, they update each prior in the set. For a prior p0(A)=p, the posterior p(A|X) = [p * 0.9] / [p*0.9 + (1-p)*0.1]. For p in [0.4,0.6], the posterior p(A|X) is in [0.4*0.9/(0.4*0.9+0.6*0.1)=0.36/(0.36+0.06)=0.36/0.42≈0.857, and similarly for p=0.6: 0.6*0.9/(0.6*0.9+0.4*0.1)=0.54/(0.54+0.04)=0.54/0.58≈0.931]. So the updated set of priors for state A is approximately [0.857, 0.931]. Then the decision maker chooses an action to maximize the minimum expected utility over this set.

  For action S: 
    Expected utility in state A: 1, in state B: 0.
    For a prior q (which is now the posterior probability of A), the expected utility is q*1 + (1-q)*0 = q.
    The minimum q in [0.857, 0.931] is 0.857.

  For action T: 
    Expected utility = q*0 + (1-q)*1 = 1-q.
    The minimum of 1-q over the set: when q=0.931, 1-q=0.069. So min expected utility for T is 0.069.

  So the decision maker chooses S and gets a minimum expected utility of 0.857.

  Similarly, if they see Y, then the posterior set for A is [for p0=0.4: 0.4*0.1/(0.4*0.1+0.6*0.9)=0.04/(0.04+0.54)=0.04/0.58≈0.069, and for p0=0.6: 0.6*0.1/(0.6*0.1+0.4*0.9)=0.06/(0.06+0.36)=0.06/0.42≈0.143]. So the set is [0.069, 0.143]. Then:

  For S: min expected utility = min q = 0.069.
  For T: min expected utility = min (1-q) = 1 - max(q) = 1 - 0.143 = 0.857.

  So they choose T and get 0.857.

  Therefore, no matter the signal, the decision maker gets 0.857 in the worst case. This is better than 0.4. So again, information helps.

  It seems hard to construct an example. There is a known result that for minimax regret, information can hurt. But note: the question is about minimax (over a set of priors) for expected utility, not minimax regret.

  Consider minimax regret. Regret is the difference between the best possible payoff in a state and the payoff of the chosen action.

  Without information, the decision maker chooses an action. The regret table:

  States: A, B.
  Actions: S, T.

  If state A: best action is S (gives 1). If we choose T, regret=1-0=1.
  If state B: best action is T (gives 1). If we choose S, regret=1-0=1.

  So the maximum regret for S is 1 (if state B) and for T is 1 (if state A). So the minimax regret is 1, and they can choose either.

  Now, with perfect information, they can match the state: in A choose S, in B choose T, so regret is 0. That is better.

  But consider a different payoff matrix:

  Actions: S, T, U.
  States: A, B.

  Payoffs:
    S: 1 in A, 0 in B
    T: 0 in A, 1 in B
    U: 0.5 in A, 0.5 in B

  Without information, the maximum regret for each action:
  - S: in state B, regret = 1 (best in B is 1 from T) minus 0 = 1.
  - T: in state A, regret = 1 (best in A is 1 from S) minus 0 = 1.
  - U: in state A, regret = 1 - 0.5 = 0.5; in state B, regret = 1 - 0.5 = 0.5. So max regret is 0.5.

  So the minimax regret action is U, with max regret 0.5.

  Now, with perfect information, the decision maker would choose S in A (regret 0) and T in B (regret 0). So the regret is 0. This is better.

  Still no.

  I recall that in some non-expected utility models, information can hurt. Specifically, in the model of Bewley (2002) which uses incomplete preferences, it is possible that an agent might prefer not to get information. But that is a different model.

  Alternatively, consider an example where the information forces the decision maker to take an action that is optimal for the known state but which is very bad if the information is wrong, and the decision maker is ambiguity averse. But if the information is free and can be ignored, then the decision maker can always choose the same action as before.

  Therefore, it seems that in the standard minimax expected utility model, information cannot hurt because the decision maker can always ignore the information and choose the same action as they would have without it, thereby getting the same minimum expected utility. The same applies for minimax regret: they can always ignore the information and choose the same action, so they are not worse off.

  However, there is a twist: when the set of priors is not rectangular, updating might lead to a set of posteriors that is more dispersed, and that might cause the worst-case expected utility to be lower. But note, the decision maker is allowed to change their action based on the signal. And by changing the action, they might be able to get a better outcome.

  Moreover, the value of information is always non-negative in the minimax expected utility model. This is a known result.

  So I conclude that for a decision maker who uses the minimax expected utility criterion (with a fixed set of priors and updating by Bayes for each prior), the value of information is non-negative. Therefore, the fourth case is not a valid counterexample.

  **Behavioral Finance: Avoiding opening statements**

  Investors avoid opening their statements in a falling market. This is often attributed to loss aversion and the pain of realizing losses. The key point is that the information might lead to emotional distress, and hence there is a direct cost of receiving the information.

  This is similar to Case Two: the act of receiving the information (or the state of knowing the loss) is directly aversive. Therefore, it is a case of direct disutility from the information itself.

  **Taxonomy of Harmful Information:**

  Based on the above, we can categorize the ways information can be harmful:

  1. **Time-Inconsistency and Self-Control (Case One)**: When the acquisition of information leads to a change in the decision maker's own future behavior that the current self disprefers. This is a violation of the assumption of consistent preferences over time.

  2. **Direct Disutility from Information or Uncertainty (Case Two and Behavioral Finance Example)**: When the process of receiving information or the state of uncertainty causes direct disutility. This violates the assumption that information has no direct effect on utility.

  3. **Strategic Revelation (Case Three)**: When the act of acquiring information reveals information to others, who then react in a way that harms the decision maker. This violates the assumption that the environment is unaffected by the information acquisition.

  The fourth case (minimax) did not yield a counterexample.

  **Conclusion:**

  The platitude that "more information can never leave a chooser worse off" holds under the assumptions of the standard expected utility model (with a unitary decision maker, no direct disutility from information, and no change in the environment due to information acquisition). The cases presented violate one or more of these assumptions.

  For the fourth suspicion about minimax: it appears that in the standard minimax expected utility model, the value of information is non-negative. Therefore, it is not a counterexample.

  If we were to coin a term for the harmful mechanisms:

  - For Case One: **Precommitment Value of Ignorance** (to avoid time-inconsistent behavior)
  - For Case Two: **Experiential Cost of Information**
  - For Case Three: **Strategic Cost of Information Acquisition**

  But note that these are not entirely new concepts. Case One is related to the literature on self-control and commitment (e.g., Strotz, O'Donoghue and Rabin). Case Two is related to the literature on anxiety and suspense (e.g., Caplin and Leahy). Case Three is standard in game theory (signaling games).

  For the behavioral finance example, it falls under Case Two (Experiential Cost).

  **Boundary Cases:**

  - What should not count? If the information is costly to acquire (direct cost), then avoiding it might be rational, but that is not a violation of the platitude because the platitude assumes free information. Similarly, if the information is not relevant to the decision, it might have zero value, but that doesn't make it harmful.

  - A case that might be borderline: if the information causes the decision maker to update in a way that leads to a choice that is ex post worse due to an incorrect model (e.g., a Bayesian with a wrong prior). But that is a case of model misspecification, not a violation of the decision theory assumptions.

  In summary, the platitude holds in the standard model, and the counterexamples arise when we relax one of the key assumptions.
answer: |-
  As a decision theorist specializing in the value of information, I'll address your query systematically. The platitude that "more information can never leave a chooser worse off" is rooted in Good's theorem (I. J. Good, 1967), which states that, under specific assumptions, the expected utility of acquiring free information is non-negative. The key assumptions are:
  1. **Expected Utility (EU) Maximization**: The chooser ranks prospects by probability-weighted averaging of utilities.
  2. **Free Disregard**: The chooser can condition actions on the information or ignore it entirely.
  3. **No Direct Costs**: The act of acquiring or receiving information has no intrinsic utility/disutility (e.g., no anxiety).
  4. **Non-Strategic Environment**: Information acquisition does not alter the environment (e.g., no reactions from others).

  Your cases violate one or more assumptions, showing how information can be harmful. I'll analyze each case, identify the violated assumption, classify it as a genuine counterexample or a failed hypothesis, compare cases 1 and 3, address your minimax suspicion, and touch on behavioral finance. Finally, I'll provide a taxonomy.

  ---

  ### **Candidate Mechanisms for Harmful Information**
  I considered five mechanisms, tested against your cases:

  1. **Time Inconsistency**: Information changes future preferences/actions against current preferences.  
     - *Applies to Case 1*: The woman's future self acts against her current self.
     - *Not Case 2/3*: No intrapersonal conflict or external reactions.

  2. **Direct Utility Effects**: Receiving information or being in a state of uncertainty causes intrinsic disutility (e.g., anxiety).  
     - *Applies to Case 2*: The "interval of not knowing" is miserable.
     - *Not Case 1/3*: Harm arises from actions/reactions, not the experience itself.

  3. **Strategic Revelation**: Acquiring information signals intentions to others, triggering harmful reactions.  
     - *Applies to Case 3*: Commissioning the study alerts a competitor.
     - *Not Case 1/2*: No external agent reacts.

  4. **Ambiguity Aversion in Non-EU Models**: Resolving uncertainty destroys hedging benefits for choosers who use non-EU criteria (e.g., minimax).  
     - *Tested in Fourth Suspicion*: Rejected—harm is impossible under standard minimax if information can be disregarded.

  5. **Cognitive Costs**: Information imposes mental burdens (e.g., attention, processing).  
     - *Applies to Behavioral Finance*: Avoiding statements avoids attention to losses.
     - *Distinct from Cases 1–3*: Not about choice structure, but overlaps with Case 2 in experiential harm.

  Cases 1–3 are genuine counterexamples to the platitude because they violate core assumptions. Case 4 (minimax) and behavioral finance are not counterexamples but clarify boundaries.

  ---

  ### **Analysis of Your Cases**

  #### **Case 1: Declining a Predictive Genetic Test**
  - **Description**: A woman avoids a test because learning she carries a variant would compel her future self to choose prophylaxis, which her current self deems worse than waiting.
  - **Violated Assumption**: **Free Disregard**. While she could technically ignore the information, her future self cannot due to preference shifts or self-control issues. This introduces time inconsistency.
  - **Genuine Counterexample?** Yes. Information removes the option to "wait" because her future self acts against her current preferences. The platitude assumes a unitary, time-consistent chooser, but here the chooser is dynamically inconsistent. Ignoring the information is infeasible psychologically, violating free disregard.
  - **Key Mechanism**: Time inconsistency (specifically, a "preference-based commitment problem").

  #### **Case 2: Patient Avoiding Uncertainty**
  - **Description**: A patient defers information until results are conclusive because the "interval of not knowing" is intrinsically miserable.
  - **Violated Assumption**: **No Direct Costs**. The state of uncertainty itself causes disutility, making information acquisition costly.
  - **Genuine Counterexample?** Yes. The platitude assumes information only affects utility through actions, but here the process of receiving information (or waiting) directly reduces utility. Even if the chooser could disregard the information, the disutility remains.
  - **Key Mechanism**: Direct utility effect (specifically, "suspense aversion").

  #### **Case 3: Market Study Alerting a Competitor**
  - **Description**: A firm avoids a market study because commissioning it reveals plans to a competitor, who then moves first.
  - **Violated Assumption**: **Non-Strategic Environment**. Acquiring information alters the environment by signaling intentions.
  - **Genuine Counterexample?** Yes. The platitude assumes information gathering is undetectable, but here it triggers a harmful reaction. Disregarding the information is irrelevant—the harm occurs from the act of acquisition itself.
  - **Key Mechanism**: Strategic revelation (specifically, "signaling cost").

  ---

  ### **Comparison of Cases 1 and 3**
  - **Resemblance**: Both involve **reactions to information acquisition**—Case 1 from the chooser's future self, Case 3 from a competitor. This is the theoretically important similarity because both violate **free disregard** and **non-strategic environment** by introducing responsive actors. The platitude assumes no reactions, making these counterexamples.
  - **Difference**: Case 1 is an **intrapersonal** reaction (within the chooser), while Case 3 is **interpersonal** (another agent). This distinction affects solutions (e.g., commitment devices vs. game-theoretic hiding), but the core violation is the same: information acquisition changes behavior in unanticipated ways.

  ---

  ### **Fourth Suspicion: Minimax Chooser**
  - **Claim**: A chooser who ranks prospects by the worst case over a set of probability assignments (minimax) might be harmed if information destroys a hedging opportunity.
  - **Analysis**: This is **impossible** under standard minimax expected utility with free information.  
    - **Reason**: The minimax chooser can always disregard information and choose the same action as before, securing the original worst-case payoff. If they use the information, they may improve their outcome but cannot worsen it.  
    - **Minimal Example**:  
      - States: A (prob 0.5) or B (prob 0.5).  
      - Actions:  
        - X: Pays 1 in A, 0 in B.  
        - Y: Pays 0 in A, 1 in B.  
        - Z (hedge): Pays 0.4 in A or B.  
      - Without information, minimax chooser picks Z (worst-case payoff 0.4 > min of X/Y which is 0).  
      - With costless information revealing A/B:  
        - If they learn A, they pick X for payoff 1 (or stick with Z for 0.4).  
        - If they learn B, they pick Y for payoff 1 (or stick with Z for 0.4).  
      - **Outcome**: They are never worse off—ignoring information yields 0.4, using it yields ≥0.4.  
    - **What Rules It Out**: Free disregard and the fact that information only refines the set of priors (updating never expands ambiguity). In minimax, the value of information is non-negative, as shown by I.J. Good (1967) for EU and extended to minimax by others (e.g., Marinacci, 2002).  
  - **Verdict**: Not a counterexample. Harm would require non-standard assumptions (e.g., information acquisition costs or ambiguity expansion).

  ---

  ### **Behavioral Finance: Avoiding Financial Statements**
  - **Description**: Investors avoid opening statements in falling markets to evade the pain of seeing losses.
  - **Relation to Cases**: This is a **direct utility effect** (like Case 2), not a choice-structure issue. The disutility comes from attention to the information (realizing losses), not from how it guides actions.  
  - **Collapse with Choice Structure?** Partially. While the harm is experiential (similar to Case 2), it also involves **loss aversion**—a non-EU preference where losses loom larger than gains. However, the mechanism is distinct from strategic or time-inconsistency effects.  
  - **Taxonomy Fit**: Classify under **direct costs** (utility from attention/awareness).

  ---

  ### **Taxonomy of Harmful Information Mechanisms**
  Based on your cases and established theory, here's a settled taxonomy. I coin terms where labels are unclear:

  | **Mechanism**               | **Key Assumption Violated** | **Description**                                                                 | **Genuine Counterexample?** | **Boundary Cases (What Does Not Count)**                                                                 |
  |-----------------------------|----------------------------|---------------------------------------------------------------------------------|-----------------------------|----------------------------------------------------------------------------------------------------------|
  | **Time-Inconsistent Agency** (Case 1) | Free Disregard             | Information enables future selves/agents to act against current preferences.    | Yes                         | Not if future self is rational and aligned with current preferences (e.g., standard EU).                |
  | **Experiential Cost** (Case 2, Behavioral Finance) | No Direct Costs            | Receiving information/uncertainty causes intrinsic disutility (e.g., anxiety).  | Yes                         | Not if disutility is from actions, not information (e.g., prophylaxis side effects in Case 1).          |
  | **Strategic Signaling** (Case 3) | Non-Strategic Environment  | Acquiring information reveals intentions, provoking harmful reactions.          | Yes                         | Not if reactions are beneficial (e.g., deterring competitors).                                           |
  | **Ambiguity Destruction**   | (None—rejected)            | Claimed for non-EU choosers (e.g., minimax), but harm impossible with free disregard. | No                          | Only if information acquisition has costs or alters ambiguity sets (non-standard).                       |
  | **Cognitive/Attention Cost** (Behavioral Finance) | No Direct Costs            | Information directs attention to painful realities (e.g., losses).              | Yes (subtype of Experiential Cost) | Not if attention costs are avoidable or negligible.                                                     |

  - **Why These Are Counterexamples**: All violate core assumptions of Good’s theorem, making information harmful. The platitude holds only when:
    1. Chooser is EU-maximizing and time-consistent.
    2. Information can be freely ignored.
    3. No experiential/strategic costs exist.
  - **Established Concepts**: 
    - Case 1: Time inconsistency (Strotz, 1956) and precommitment (e.g., O’Donoghue & Rabin, 1999). 
    - Case 2: Utility of information (e.g., Caplin & Leahy, 2001 on anxiety). 
    - Case 3: Signaling games (Spence, 1973) and information disclosure (Milgrom, 1981). 
    - Behavioral Finance: Loss aversion (Kahneman & Tversky, 1979) and attention (e.g., Karlsson et al., 2009 on "ostrich effect").

  ---

  ### **Conclusion**
  - **Cases 1–3 are genuine counterexamples** to the platitude due to violations of Good’s assumptions. Case 1 (intrapersonal reaction) and Case 3 (interpersonal reaction) share the core problem of **responses to information acquisition**, differing only in the actor. 
  - **Minimax harm is impossible**—free disregard protects choosers. 
  - **Behavioral finance** fits under experiential costs but involves attention, linking to Case 2.
  - **Taxonomy**: Use the mechanisms above to classify harmful information. If new phenomena arise, test against boundary cases (e.g., if harm persists when information is free and ignorable, it’s not a counterexample).

  This framework resolves your phenomena: you’ve identified three distinct mechanisms (time inconsistency, experiential costs, strategic signaling), each well-established in decision theory.
