prompt: |-
  I am a junior at a large public high school, and I serve on the committee that is rewriting our student government's constitution. I have become fairly convinced by the case for selecting at least some representatives by lottery rather than by election, and equally convinced that pure rotation discards something real, since it takes most of a year to learn where anything is kept and whom to ask. So I have drafted a compromise that I cannot find defended anywhere, and I would like to test it on my classmates before I defend it to the committee.

  Under my proposal the main chamber is chosen by lot from the whole student body for a single non-renewable term, except that the outgoing chamber may designate one of its own members to stay on for one additional year as a non-voting advisor who holds the files, makes the introductions, and is barred from holding any other office afterward. I call it the memory seat. A friend on the committee objects that this just manufactures a miniature career politician with an inside track, and that term limits do not abolish careerism so much as redirect it, away from voters and toward the people who will be in a position to hand you something after you leave.

  Could you design a ninety-minute session for our political philosophy club, eighteen students from all four grades, one double block, no advance reading, in which they actually operate my mechanism on a decision that binds us for real rather than hearing me argue for it? The small real stake I have available is about eighty dollars of unspent club funds, and I am willing to let the session genuinely decide how it is spent. Please keep any lecture out of the front of the room: introduce the two selection procedures only as Procedure A and Procedure B, described purely by their mechanics, and hold the terms sortition, term limits, and career politician back until the debrief.

  In your answer I would like the setup and printable materials, a minute-by-minute timeline, any role or instruction cards, the payoff and information structure that generates the pressure, a short script for the few moments when I do have to speak as facilitator, and a debrief that maps particular moments in the session onto the competing claims about descriptive representation, accumulated expertise, and the incentive to cultivate a future patron. Please also tell me candidly what will go wrong the first time I run this and how to handle each failure, and be frank about which part of my argument the activity cannot test at all, so that I do not oversell it to the committee.

  Please write your response in American English.
reasoning: |-
  Okay, I need to help this high school junior design a session for their political philosophy club to test their "memory seat" proposal. They want a 90-minute activity where students experience the mechanics of both election and lottery systems with a real decision about spending $80 in club funds. 

  First, let's understand their core concerns: They believe pure rotation wastes accumulated knowledge but worry elections create careerism. Their "memory seat" solution adds a non-voting advisor from the outgoing group. The friend's criticism is that this creates mini-careerists who cultivate future patrons.

  The session must:
  - Avoid lecturing or jargon
  - Have students experience Procedure A (election) and Procedure B (lottery + memory seat)
  - Include a real $80 spending decision
  - Debrief by connecting game moments to representation, expertise, and incentive issues
  - Warn about potential failures and limitations

  Key challenges to simulate:
  - Descriptive representation: Does the group reflect student body diversity?
  - Expertise accumulation: Can members learn where things are/whom to ask?
  - Careerism incentives: Do members angle for future benefits?

  For the activity flow:
  Start with Procedure A (elected council) making a quick decision with no institutional memory. Then reset with Procedure B (randomly selected + memory seat) where the memory holder can share past knowledge. Use role cards to create pressure - some members might prioritize personal connections over group interests.

  Potential failure points:
  - Students not taking it seriously with real money at stake
  - Memory seat holder dominating discussion
  - Groups struggling with time pressure
  - Debrief missing key learning points

  The debrief is crucial. I'll map moments like:
  - When elected members made uniformed decisions → expertise value
  - If memory holder influenced outcomes → accumulated knowledge benefit
  - Any "future favor" hints → careerism risk
  - Demographic mismatch → representation issue

  Limitations to acknowledge:
  - Can't test long-term learning (since it's one session)
  - Won't show true post-office patronage
  - Doesn't address scale differences (school vs real govt)

  Materials needed:
  - Role cards with secret incentives
  - Procedure descriptions
  - Budget request options
  - Observation sheets for debrief
  - Timer and group dividers

  Session structure:
  - Intro (5 min): Explain the $80 decision task neutrally
  - Procedure A (25 min): Elect, deliberate, decide
  - Reset (5 min): Explain Procedure B
  - Procedure B (30 min): Random selection, memory seat added, deliberate
  - Voting (5 min): All students vote on which decision stands
  - Debrief (20 min): Connect experiences to concepts

  This should let them feel the tradeoffs firsthand while keeping it engaging. The real money stake and role-playing will make the incentives tangible.
answer: |-
  Below is a complete 90-minute session plan designed to let your club **experience** the trade-offs between election and lottery systems with a "memory seat," using your $80 club fund decision as the real stake. The design focuses on **simulating pressure points** (expertise gaps, careerist incentives, representation) while avoiding upfront theory.

  ---

  ### **Session Setup & Printable Materials**  
  *(Print 1 set per group)*  

  **1. Role Cards** (For both procedures; shuffle and distribute secretly):  
  > *"You care about CLASS LEGACY. You want funds spent on something permanent (e.g., trophy, plaque)."*  
  > *"You care about FUN. You want funds spent on a party/event with food."*  
  > *"You care about INFLUENCE. Your goal is to gain favor with outgoing members or the advisor."* (Include 3 of these)  

  **2. Procedure Descriptions** (Display on board):  
  > **Procedure A (Election):**  
  > - Elect 5 reps from the group (2 min campaign speeches, anonymous vote).  
  > - Reps get 15 min to decide how to spend $80 using the **Budget Options Sheet**.  
  > - No input from non-reps.  

  > **Procedure B (Lottery + Advisor):**  
  > - Randomly select 5 new reps (names drawn from hat).  
  > - Outgoing Procedure A reps choose **one** of themselves as a **non-voting advisor**.  
  > - Advisor shares **"Institutional Knowledge Sheet"** with new reps.  
  > - New reps + advisor get 20 min to decide.  

  **3. Budget Options Sheet** (Same for both rounds):  
  > - **Option 1:** Pizza party for the club ($80)  
  > - **Option 2:** Donate to school garden + plant a "club tree" ($80)  
  > - **Option 3:** Buy board games for the student lounge ($80)  
  > - **Option 4:** Custom club hoodies (partial payment; need $20 more later)  

  **4. Institutional Knowledge Sheet** (Given **only** to Procedure B advisor):  
  > *"Last year’s debate: Pizza parties have low attendance. Garden donations require Principal approval (takes 3 weeks). Hoodies are popular but need upfront funds. Games get stolen from the lounge. Tip: Survey data shows 70% of students prefer lasting items over food."*  

  **5. Observer Worksheet** (For non-reps in Procedure B):  
  > *"Track: 1) How often does the advisor speak? 2) Do reps ask the advisor for help? 3) Note any ‘deals’ or promises made."*  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0:00–0:05 - Intro & Setup (You Facilitate)**  
  > *Script:* "We’re deciding how to spend $80 club funds today. We’ll use two different group decision methods. Neither is ‘better’—we’re testing mechanics. In **Procedure A**, we’ll elect reps. In **Procedure B**, we’ll use random selection plus an advisor. The final decision *will* bind us—we’ll vote on which group’s outcome to implement."  

  **0:05–0:30 - Procedure A (Election)**  
  > - (5 min) Hold elections: 5 volunteers give 30-second speeches. Vote anonymously. Top 5 become reps.  
  > - (15 min) Reps deliberate privately. Others observe silently.  
  > - (5 min) Reps announce decision. Collect decision slip.  

  **0:30–0:35 - Reset**  
  > - Announce Procedure A’s decision.  
  > *Script:* "Now we reset. $80 is unspent again. We’ll use **Procedure B** with a new group and an advisor from the outgoing reps."  

  **0:35–0:55 - Procedure B (Lottery + Memory Seat)**  
  > - (5 min) Randomly select 5 new reps (draw names). Outgoing Procedure A reps choose one advisor (non-voting). Give advisor **Institutional Knowledge Sheet**.  
  > - (15 min) New reps + advisor deliberate. Non-reps complete **Observer Worksheets**.  
  > - (5 min) Announce decision. Collect slip.  

  **0:55–1:05 - Vote on Real Outcome**  
  > - Display both decisions. All 18 students vote anonymously for which to fund.  

  **1:05–1:25 - Debrief (Key Phase)**  
  > *Start with reflections, then reveal concepts:*  
  > 1. **"What was hardest for each group?"**  
  >    - *Likely answers:*  
  >      - Procedure A: "We had no info!" or "We didn’t know what others wanted."  
  >      - Procedure B: "Advisor talked a lot" or "We relied on their notes."  
  >    - **Map to concepts:** "This is **accumulated expertise** vs. **descriptive representation**—elected reps represent your voices, but random reps + advisor access institutional memory."  

  > 2. **"Did anyone feel pressured to please certain people?"**  
  >    - *Likely answers:*  
  >      - Procedure A: "Elected reps promised things to voters."  
  >      - Procedure B: "Reps asked the advisor for favors" or "Advisor hinted at future opportunities."  
  >    - **Map to concepts:** "This is the **incentive to cultivate patrons**. Advisors can’t run again, but might trade influence for future clout—that’s **redirected careerism**."  

  > 3. **"How balanced was the discussion?"**  
  >    - *Use Observer Worksheets:* "Advisor spoke 50% of the time!" or "Reps ignored the notes."  
  >    - **Reveal terms:** "We tested **sortition** (lottery) with a **term-limited memory seat**. The trade-off? Expertise vs. fairness."  

  **1:25–1:30 - Conclusion**  
  > *Script:* "Today we experienced two ways to balance fresh perspectives and institutional knowledge. One used elections, the other used random selection plus an advisor. The stakes were real—and so were the tensions."  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **Students treat it as a joke with real money:**  
     - *Mitigation:* Stress at the start: "This decision **will** happen. You’re designing how $80 gets used." Use anonymous voting to ensure sincerity.  

  2. **Advisor dominates Procedure B:**  
     - *Mitigation:* Give the advisor a **printed script**: "Your role: Share facts ONLY when asked. Do not vote or sway." Intervene if they overstep: "Advisor—remember, you’re non-voting."  

  3. **Elected reps in Procedure A ignore voters:**  
     - *Use this:* Highlight in debrief: "Did reps follow their campaign promises? This shows accountability gaps in elections."  

  4. **Groups deadlock or rush:**  
     - *Mitigation:* Use a visible timer. If stuck, say: "You have 2 minutes to vote or the $80 is forfeited."  

  5. **"Influence" role-players are too blatant:**  
     - *Actually useful:* Their behavior illustrates careerism. Debrief: "Did anyone feel pressured to trade favors?"  

  ---

  ### **What This Can’t Test**  
  **Be candid with your committee about these limits:**  
  1. **Long-term learning curve:** You can’t simulate the "year to learn where things are" in 90 minutes. The Institutional Knowledge Sheet approximates this but can’t show true expertise accumulation.  
  2. **Scale/representation:** 18 students can’t replicate a "whole student body." Random selection here won’t prove descriptive representativeness.  
  3. **Post-office patronage:** The session shows *potential* for advisors to trade influence, but won’t prove if this *actually* creates mini-careerists long-term.  
  4. **Student engagement IRL:** A real memory seat might be ignored or resented. This simulates power dynamics but not peer culture.  

  ---

  ### **Why This Works for Your Goal**  
  - **You’re not preaching:** The mechanics speak for themselves. Students experience expertise gaps (Procedure A), advisor overreach (Procedure B), and "influence peddling" (role cards).  
  - **The $80 stake creates tension:** Role cards ("INFLUENCE") + real money incentivize "careerist" behavior organically.  
  - **Debrief ties moments to theory:** Observers catch advisor dominance; reps feel knowledge gaps. You then name the concepts.  

  This gives you evidence: *"When Carlos kept referencing the advisor’s notes, that’s expertise. When Lena promised a hoodie discount if the advisor backed her, that’s redirected careerism."* Run it tight, and your committee will see the trade-offs play out live. Good luck!
