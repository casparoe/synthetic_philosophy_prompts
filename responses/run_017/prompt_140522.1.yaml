prompt: |-
  My flatmate and I spent a solid two hours after the pub last night going round in circles about whether a heart that was assembled molecule by molecule in a lab — never evolved, never selected for anything, sitting in a creature that will never reproduce — would still have the function of pumping blood. I said obviously yes, it does something; he said no, nothing is *for* anything there. We got nowhere, mainly because we kept sliding between 'what it does' and 'what it's for' without noticing.

  I've got to run a fifty-minute seminar for second-year phil of biology students on the etiological vs causal-role accounts of function next week, so give me the plan, not the explanation. Specifically:

  - what has to be in place before either account even looks like an answer to a question — I think the load-bearing bit is that they're answering different questions (why is it there at all / what does it contribute to some larger capacity), and I want that ordering to do real work rather than be a preamble
  - one case to carry the whole thing, and what such a case must have and must lack. Is the heart actually the wrong choice, given they'll all say 'pumping, obviously' and switch off? I want something with two real effects where only one is pre-theoretically 'what it's for', no designer anywhere in it, and enough room to run the same case through both accounts
  - the misconceptions in the order they'll actually form, with where in the sequence to head each off: 'function just means what it does', 'the evolutionary one smuggles in purpose or a designer', 'if it has a function it must be helping the organism right now', and the one I'm least sure how to handle — that the causal-role account hands out a function to everything, including the noise the heart makes
  - where the pair stop disagreeing about facts and start disagreeing about words, and whether to say that out loud at this level
  - what to flatly refuse to get into in fifty minutes
  - one question at around minute forty that would tell me the distinction has landed rather than them having memorised 'selected effect vs current contribution'
reasoning: |-
  Okay, let me tackle this user's request. They're preparing a 50-minute seminar on etiological vs causal-role accounts of function for philosophy of biology students. The core challenge is designing a focused session that avoids common pitfalls in understanding function concepts.

  First, I need to establish what must be in place before introducing either account. The user wants this foundation to do heavy lifting, not just be preamble. I consider how to frame the two questions distinctly: "why is this trait here?" versus "what does this trait do in the system?" This sets up the accounts as answers to fundamentally different queries.

  For the central case study, the heart example from their pub debate might be problematic because students will default to "pumping blood" without hesitation. I need a case with two clear effects where only one is intuitively functional. The spleen comes to mind - it filters blood (functional) but also makes noise (non-functional). This avoids designer implications and works for both accounts. 

  Regarding misconceptions, I anticipate students conflating "function" with "what it does" immediately. The seminar should explicitly separate descriptive effects from functional status early on. For the evolution=designer worry, I'll emphasize natural selection as an impersonal process. The "everything has a function" objection to causal-role theory can be addressed by stressing the "relevant capacity" requirement. 

  The word/fact disagreement point is crucial. When both accounts agree on effects but disagree on function attribution (like spleen noise), that's linguistic divergence. I should make this explicit at the second-year level as it reveals philosophical assumptions. 

  Time constraints mean avoiding teleology debates, multiple function problems, and human artifacts. The key is keeping focus on the core distinction. 

  For assessment, a question about vestigial traits at minute 40 would test comprehension: "Does the human appendix have a function?" This requires applying both accounts correctly rather than memorizing definitions. 

  The seminar structure should flow from setup (5 mins) to case introduction (10 mins), through both accounts with misconceptions addressed in real-time (25 mins), to the word/fact distinction (5 mins), and ending with the appendix question (5 mins). The spleen case carries the entire discussion, allowing comparison of how each account handles the same traits.
answer: |-
  Here’s a tight 50-minute seminar plan focused on your goals:

  **Core Structure (Anchor on ONE Case):**  
  Use the **human spleen** (not the heart). Pre-theoretically, students know it "filters blood" (function) but might not know it "makes a faint pulsing noise" (non-functional effect). Avoids designer/evolution baggage.

  ---

  ### **Seminar Plan**  
  **Total: 50 mins**  

  1.  **Set-Up: What Question Are We Even Asking? (5 mins)**  
      - *Do:* Pose: "When we say ‘the spleen’s FUNCTION is to filter blood’ — what are we *claiming*?"  
      - *Load-Bearing Point:* Distinguish two questions:  
        **Q1 (History):** "Why do we *have* spleens in the first place?"  
        **Q2 (System):** "What does the spleen *contribute* to keeping *this* organism alive right now?"  
      - *Key:* Stress these are **distinct questions** needing distinct tools. Etiology answers Q1, Causal-Role answers Q2.  

  2.  **Introduce the Case & Effects (10 mins)**  
      - *Case:* **The Spleen**.  
        - **Effect 1:** Filters blood (removes old RBCs, supports immunity).  
        - **Effect 2:** Produces a faint, rhythmic pulsing noise (byproduct of blood flow).  
      - *Do:*  
        1. Show anatomical diagram.  
        2. State both effects as *facts*.  
        3. Poll: "Which effect is its *function*? Why?" (Get "filtering blood" consensus).  
      - *Goal:* Highlight pre-theoretic intuition — effect ≠ function.  

  3.  **Run the Case Through Both Accounts (25 mins)**  
      *(Address misconceptions AS they arise in the accounts)*  
      - **Etiological Account (Q1 Answer): (12 mins)**  
        - *Define:* "Function = what the trait was *selected for* by natural selection."  
        - *Apply:* Spleens exist because filtering blood conferred a survival/reproductive advantage. Noise was irrelevant to selection.  
        - *Misconception Head-Off:*  
          - **"Smuggles designer/purpose?"** → "No. Selection is mechanistic: variation + differential survival."  
          - **"Must help *right now*?"** → "No. Vestigial traits (e.g., appendix) had functions *historically*." (Example: appendix digestion in ancestors).  
      - **Causal-Role Account (Q2 Answer): (13 mins)**  
        - *Define:* "Function = the causal contribution a component makes to a *specific capacity* of a containing system."  
        - *Apply:* In the system "human body maintaining circulation/immunity," filtering blood contributes. Noise does not contribute to any *relevant* capacity.  
        - *Misconception Head-Off:*  
          - **"Function = what it does?"** → "No. CR requires contribution to a *system capacity* (e.g., survival). Noise 'does' something, but isn’t functional *for the system*."  
          - **"Functions to everything?"** → "No. Must specify the *system* and *capacity*. Noise doesn’t contribute to circulatory/immune capacity."  

  4.  **Clash & Verbal Disagreement (5 mins)**  
      - *Do:* Pose: "Your flatmate’s lab-grown heart: Does its *noise* have a function?"  
      - *Etiological:* "No. Never selected for noise."  
      - *Causal-Role:* "In the artificial system? Only if noise contributes to a specified capacity (e.g., if it’s monitored for diagnostics). Otherwise, no."  
      - *Point Out Loud:* **They agree on the FACTS (it makes noise, wasn’t selected). They disagree on which QUESTION ("why is it there?" vs. "what does it do *here*?") licenses calling it a "function."**  

  5.  **What We’re NOT Doing (1 min)**  
      - *Flatly Refuse:*  
        - Teleology beyond biology (e.g., "purpose of life").  
        - Multiple realizability / token vs. type functions.  
        - Non-biological artifacts (e.g., screwdrivers).  

  6.  **Assessment Question (Minute 40): (4 mins)**  
      - *Ask:* **"Does the human *appendix* have a function *today*? Answer using BOTH accounts. Be specific."**  
      - *Why it Works:*  
        - Etiological: YES (digested cellulose in ancestors).  
        - Causal-Role: Likely NO (no significant contribution to modern human survival).  
        - *Tests:* Distinction grasp (history vs. current role), avoids memorized definitions.  

  ---

  **Why This Works:**  
  - **Spleen Case:** Has two clear effects (one intuitive function, one irrelevant), no design/evolution confusion, works for both accounts.  
  - **Misconceptions Addressed Inline:** Tackled when they naturally arise in explaining each account.  
  - **Word/Disagreement Clarity:** Explicitly flagged using the lab-heart noise example.  
  - **Efficiency:** Appendix question forces application, not regurgitation.  
  - **No Wasted Time:** Focus stays on the accounts’ *explanatory targets* (Q1 vs. Q2).  

  **Run it tight, pivot back to the spleen/appendix, and hammer Q1 vs. Q2.** Good luck!
