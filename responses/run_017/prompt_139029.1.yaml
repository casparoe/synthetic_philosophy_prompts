  ## The Fault Line Villanelle

  The baker hummed a scrap of tuneless air,
  Whispering sweetly to the rising dough:
  **"A stitch in time saves nine," he sang with care.**
  The phrase felt old, a comfort, rich and rare.
  He passed it to his wife, who wouldn't know
  The baker hummed a scrap. Of tuneless air?

  She told the neighbour, fighting off despair
  (Her washing line had snapped, a heavy blow):
  **"A stitch in time saves mine," she pled her prayer.**
  The neighbour scoffed, "Such nonsense! Do be fair!
  That saving grace? It won't help *you*, old crow!"
  The baker hummed a scrap of tuneless air.

  It reached the student, tangled in his hair
  Of complex thoughts, where logic seeds must grow.
  He found the kernel, polished bright and spare:
  **"A stitch in time saves *mind*,"** he wrote with flair.
  A truth for thought, a principle to show?
  The baker hummed a scrap of tuneless air.

  The gossip spread it, fueled by hot café glare,
  A useful moral for the status quo:
  **"Spare time the stitch, you'll lose what's yours to bear."**
  It reached the child, skipping without a care,
  Who shaped it to the rhythm of her toe:
  The baker hummed a scrap of tuneless air –
  **"Spare time the stitch, you'll lose what's yours to bear."**

  ---

  **Explanation (as requested, not part of the poem):**

  *   **The Item:** A proverb ("A stitch in time saves nine"). Its status as a true replicator is contested. Selectionists see it as a replicator with variants; attractionists see each utterance as reconstruction shaped by context and cognition.
  *   **Refrain 1 (Selectionist Drift):** "The baker hummed a scrap of tuneless air."
      *   **Drift:** Minor, unsystematic changes: "a scrap" becomes "a scrap" (unchanged), then "a scrap. Of" (punctuation/line break error), then "a scrap" (reversion), then "a scrap of" (partial reversion). Changes are small, accidental (like copying errors), and don't converge – they jump around.
  *   **Refrain 2 (Attractor Drift):** Starts as "**A stitch in time saves nine**" (Original).
      *   **Drift:** Transforms systematically *towards* cognitive attractors:
          *   `nine -> mine` (Personalization, emotional resonance - saving *my* effort/thing).
          *   `nine -> mind` (Intellectualization, seeking deeper meaning).
          *   `A stitch in time saves -> Spare time the stitch, you'll lose` (Restructuring for rhythm, parallelism, and a stronger negative consequence - "lose what's yours" is more impactful/memorable than "saves nine"). The core *meaning* shifts towards a stronger, more abstract warning about procrastination and loss, becoming "**Spare time the stitch, you'll lose what's yours to bear.**"
  *   **The Final Quatrain:**
      *   The two refrains meet: "The baker hummed a scrap of tuneless air –" and the fully transformed "**Spare time the stitch, you'll lose what's yours to bear.**"
      *   **Ambiguity:** Is the final line:
          *   A *badly copied* version of the original proverb (Selectionist: errors accumulated)?
          *   A *different, reconstructed* item that converged due to cognitive biases (Attractionist: pulled towards a more tellable, impactful warning)?
          *   The poem offers no resolution. The original concrete proverb ("stitch saves nine") and the final abstract warning ("spare time... lose...") are related, perhaps sharing a common root, but are they the *same* cultural item? The distinction collapses at the point of transmission.
  *   **Why it Works:**
      *   **For the Seminar:** The drift patterns clearly illustrate the mechanisms. The final ambiguity directly embodies the core theoretical fault line about the nature of cultural persistence and identity.
      *   **For the Uninitiated:** It tells a story of how a phrase changes unpredictably as it passes between people, ending with a sense of mystery about whether the final saying is still the "same" as the first. The villanelle structure reinforces the theme of repetition and variation.
