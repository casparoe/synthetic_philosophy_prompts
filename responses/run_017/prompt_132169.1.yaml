prompt: |-
  You are helping me assemble the centerpiece of a planned special issue, *Signalling Theory after the Handicap Principle*. Two contributors have been arguing past each other for a decade and have agreed, at my urging, to write one joint statement instead of two more rebuttals. I need you to draft the document they should produce.

  The parties are, on one side, someone who holds that stable honest advertisement of a hidden, continuously varying quality to a receiver whose interests partly conflict with the signaller's requires a *differential* cost — that at equilibrium the marginal cost of signalling must fall as quality rises, so that no lower-quality individual could profitably match the signal — and that this is what the handicap principle, properly stated, asserts. On the other side is someone who holds that honesty is secured by whatever makes the signal's conditions of production track the advertised quality: physical or developmental constraint, a trait whose only function is to make an already-existing cue easier for the receiver to perceive or measure, receiver-side verification with post-hoc retaliation, or partial alignment of interests. On that view differential cost is a common consequence of honest signalling and a frequent marker of it, but not what does the stabilizing work, and the handicap principle mistakes a symptom for the mechanism.

  Write the statement in four parts.

  1. **Agreed claims, numbered.** Include at least: a taxonomy of the notions of cost both sides need to keep apart (absolute production cost; marginal or differential cost at equilibrium; the counterfactual cost a mimicker of lower quality would have to pay, retaliation and verification costs included; cost measured in fitness versus cost measured in resources or opportunity), with a note on which of these each side's thesis is about; the game-theoretic background both accept, including the point about freely chosen costless signals under strict conflict, and the point that whether real signallers have access to a cost-free channel is an empirical and developmental question rather than a theorem.

  2. **A disagreements table.** Columns: the disputed claim; a formulation of it the handicap side would sign as its own; a formulation the cue-and-constraint side would sign as its own; and a verdict on whether the disagreement is substantive or verbal. Where you judge a row verbal, say which term is doing the work and what substantive question survives once it is disambiguated.

  3. **A crux table.** For each crux: the crux stated as a yes/no question; the case, manipulation, or model variation both sides agree would bear on it; the handicap side's prediction registered in advance; the cue-and-constraint side's prediction; and what each side would count as moved. Cover at least these cruxes: the separability question — whether the equilibrium correlation between signal and quality could be held fixed while the differential production cost is driven to zero, and whether the signalling system would then still be stable, or whether that counterfactual is incoherent; the subsidized-signal case, in which the production cost is paid on every signaller's behalf, or a mutant arises that produces the full signal at negligible marginal cost while changing nothing else; the perceptibility case, in which the trait at issue makes an existing cue easier to measure rather than adding a burden; the enforcement case, in which all of the relevant cost is imposed by receivers after the signal is given, so that no cost is paid at production; the origin-versus-maintenance crux, whether the two theses are claims about how honesty gets established or only about how it persists; and a crux about whether the distinction between costs that merely accompany honesty and costs that enforce honesty depends on features of the models — discreteness of the quality variable, continuity of the signal, or whether costs and benefits combine additively — rather than on features of organisms. Flag explicitly any crux on which both sides would predict the same outcome, since those tests cannot settle anything, and any crux on which you think neither side would in fact move.

  4. **What neither side holds.** A short list of theses often attributed to one camp that that camp actually rejects, so that the volume does not reprint a decade of strawmen.

  Constraints: no citations, bibliographies, author names, or paper titles — refer to positions by the neutral labels above, and do not lean on any particular published model by name. Do not adjudicate; the document must be one both parties could sign. Aim for something a journal could print as a two-page joint statement, addressed to readers who know the formalism of signalling games but should not have to reconstruct it.
reasoning: |-
  Hmm, the user wants me to draft a joint statement for two opposing contributors in a special issue about Signalling Theory after the Handicap Principle. This is a complex philosophical and theoretical debate in biology that I need to handle carefully.

  The first contributor believes in "differential cost" as essential for honest signaling - meaning that higher-quality individuals can signal at lower marginal cost, preventing low-quality mimics from copying them. This is what they consider the true Handicap Principle. The second contributor believes honesty comes from various mechanisms like constraints, traits that enhance perception, or receiver verification, and sees differential cost as just a common symptom rather than the core mechanism.

  I need to structure this as a four-part document that both parties could sign. Part 1 should cover agreed claims, including a taxonomy of different cost concepts. Part 2 needs a disagreements table comparing their views. Part 3 requires a crux table with testable predictions. And Part 4 should clarify common misconceptions.

  For the cost taxonomy, I'll distinguish: absolute production cost (resources or energy), marginal/differential cost at equilibrium (how cost changes with quality), counterfactual mimicker cost (what a low-quality individual would pay to mimic, including retaliation), and fitness versus resource costs. Both sides seem to agree on the game-theory basics - that under strict conflict, costless signals can't be stable, but whether real organisms have cost-free channels is an empirical question.

  The disagreements table will show where they differ. For example, on what "enforces" honesty: the handicap side says differential cost, while the cue-and-constraint side says whatever mechanism tracks quality. Some disagreements might be verbal rather than substantive, like how they define "cost" in different contexts.

  For the cruxes, I'll include key questions like: Can we have honest signaling without differential cost? What happens if we subsidize signal production? Does making cues more perceptible (without adding burden) count? And whether costs imposed after signaling (like retaliation) still qualify. I'll note where both sides might predict the same outcome, making the test inconclusive.

  Finally, I'll clarify what neither side believes - like the handicap side not claiming all signals are handicaps, or the cue-and-constraint side not denying that differential costs often occur.

  The challenge is presenting this neutrally while making it useful for readers. I'll use clear, precise language and structure it so both parties could endorse it as a foundation for future work.
answer: |-
  ## Joint Statement on Signalling Stability: Core Agreements, Disagreements, and Cruxes

  **Part 1: Agreed Foundational Claims**

  1.  **Signalling games:** Both parties accept the standard game-theoretic framework where signallers have hidden qualities, receivers make decisions based on signals affecting both parties' fitness, and conflicts of interest create incentives for deception.
  2.  **Honesty requirement:** Stable signalling of a continuously varying quality under partial conflict of interest requires mechanisms ensuring that signals reliably correlate with quality at equilibrium.
  3.  **The costless signal impossibility (under strict conflict):** If signaller and receiver interests are *strictly* opposed (zero-sum), no stable, informative signalling equilibrium exists using purely costless signals, as deception is always profitable. Costless signals *can* be stable under sufficiently aligned interests.
  4.  **Empirical access to cost-free channels:** Whether real biological signallers possess accessible, evolutionarily feasible, cost-free signalling channels suitable for conveying the specific information in question is fundamentally an empirical and developmental question, not a logical deduction from game theory.
  5.  **Taxonomy of "Cost":** Distinguishing types of cost is essential. Both parties agree these must be kept distinct, though they emphasize different aspects:
      *   **Absolute Production Cost (APC):** The resource, energy, time, or opportunity expenditure required to *produce* the signal trait itself (e.g., metabolic cost of growing a large ornament, time spent singing).
      *   **Marginal/Differential Cost at Equilibrium (MDC):** How the *additional* (marginal) cost incurred by a signaller for producing a signal *at or near the equilibrium level for their quality* changes with signaller quality. The Handicap Thesis focuses on MDC *decreasing* with quality as the key stabilizing feature.
      *   **Counterfactual Mimicry Cost (CMC):** The *total* cost (including production cost, potential retaliation costs from receivers, and opportunity costs) that a signaller of lower quality would incur if they attempted to *mimic* the signal of a higher-quality individual *at equilibrium*. This encompasses costs imposed by receiver verification and retaliation.
      *   **Fitness Cost vs. Resource Cost:** Costs can be measured directly in resources/opportunities expended (inputs) or ultimately in terms of lifetime reproductive fitness (output). The link between the two depends on the organism's ecology and physiology. Signalling models typically track fitness effects.
  6.  **Focus of Theses:** The Handicap Thesis is primarily a claim about MDC (decreasing marginal production cost with quality) as the *necessary and sufficient stabilizer* for honest signalling under partial conflict. The Cue-and-Constraint Thesis is primarily a claim about mechanisms ensuring the signal *tracks* quality (via constraints, perceptual enhancement, verification/retaliation, or partial alignment), often resulting in APC and/or CMC, and views MDC as a frequent *consequence* or *correlate* rather than the stabilizer itself.

  **Part 2: Disagreements Table**

  | Disputed Claim                     | Handicap Thesis Formulation                                                                 | Cue-and-Constraint Thesis Formulation                                                                                     | Verdict & Notes                                                                                                                                                                 |
  | :--------------------------------- | :------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **What stabilizes honesty?**       | Honesty is stabilized specifically by a *decreasing marginal production cost (MDC)* with quality. | Honesty is stabilized by *whatever mechanism ensures the signal reliably tracks quality* (constraint, cue enhancement, verification/retaliation, alignment). Differential cost (MDC) is often a consequence but not the stabilizer. | **Substantive.** Core disagreement on the causal mechanism enforcing the signal-quality correlation at equilibrium.                                                              |
  | **Role of Differential Cost (MDC)** | Decreasing MDC **is** the mechanism enforcing honesty; it is necessary and sufficient under the relevant conditions. | Decreasing MDC is a common *symptom* or *correlate* of honest signalling under conflict, often arising from the underlying stabilizing mechanisms, but is **not** the mechanism itself. | **Substantive.** Deep disagreement on whether MDC plays an active, causal stabilizing role or is a passive by-product.                                                           |
  | **Meaning of "Cost" in Stabilization** | The critical stabilizing cost is specifically the *marginal production cost* (MDC) paid *by the signaller during signal development/production*. | The critical cost ensuring honesty is the *total barrier to deception*, best captured by the Counterfactual Mimicry Cost (CMC), which may include receiver-imposed costs (retaliation) and need not be primarily borne during production. | **Partly Verbal/Partly Substantive.** Disagreement hinges on defining the relevant "cost" (MDC vs. CMC) and its source/timing. Substantive question: Is production-phase MDC *necessary* for stability, or can CMC alone suffice? |
  | **Scope of "Handicap Principle"**  | The Handicap Principle, properly stated, *is* the thesis that decreasing MDC stabilizes honest signalling. | The Handicap Principle often conflates necessary conditions (cost) with mechanisms. Its core insight is about the *need for a cost barrier*, but the mechanism creating that barrier isn't necessarily MDC. | **Verbal (Re: Labeling).** Disagreement over the definition of "Handicap Principle." Substantive question underlying the label: What creates the necessary cost barrier?           |

  **Part 3: Crux Table**

  | Crux Question                                                                                                                                    | Agreed Test/Model Variation                                                                                                                               | Handicap Thesis Prediction                                                                                                | Cue-and-Constraint Thesis Prediction                                                                                                 | What Counts as Moved?                                                                                                                                                                                                                                                               | Notes                                                                                                |
  | :------------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- |
  | **1. Separability:** Can stable signalling persist if the correlation between signal and quality is held fixed, but the *differential production cost (MDC)* is reduced to zero? | Model: Start from stable equilibrium with MDC >0 and S-Q correlation. Introduce a change eliminating MDC while artificially maintaining the S-Q correlation. | **No.** System becomes unstable; lower-quality mutants will invade by signalling higher without paying the differential cost. | **Yes (often).** Stability depends on the underlying tracking mechanism (e.g., constraint, verification). If that remains, MDC=0 may be stable. | HT: Instability observed. CCT: Stability maintained. *Crucial test.*                                                                                                                                                                                                              | Assumes partial conflict remains. "Reducing MDC to zero" must be feasible within the model's logic. |
  | **2. Subsidized Signal:** If an external agent pays the production cost for *all* signallers (or a mutant arises producing the signal at near-zero marginal production cost), does honesty collapse? | Model: Introduce subsidy covering full APC for all signals, or mutant with negligible intrinsic cost of producing any signal level.                          | **Yes.** Collapse expected as low-quality individuals can now "afford" high signals. MDC enforcement is removed.         | **Depends.** If honesty relies *only* on MDC, collapse. If it relies on constraints, verification, etc., stability may persist. Collapse suggests MDC *was* key; persistence suggests other mechanisms. | HT: Only collapse moves them. CCT: Collapse or persistence could move them, depending on context; persistence strongly contradicts HT's necessity claim.                                                                                                                           | Tests if MDC is *necessary*. Both agree collapse *can* happen; disagreement is on whether it *must*. |
  | **3. Perceptibility Enhancement:** Can a trait evolve solely to make an *existing, reliable cue* easier for receivers to perceive/measure, imposing negligible *additional* production burden (APC/MDC ≈ 0), yet support stable honest signalling under partial conflict? | Model: Quality Q produces inherent cue C correlated with Q. Trait S evolves, adding minimal cost, making C much easier for receivers to detect/assess.      | **No.** S is costless enhancement; low-Q individuals can adopt S without cost, amplifying/degrading information. Unstable. | **Yes.** Honesty is secured by the underlying correlation between Q and C. S merely aids perception. Stability depends on Q-C link, not cost of S. | HT: Instability observed. CCT: Stability observed. *Crucial test.*                                                                                                                                                                                                                | Focuses on whether *perception aids* require differential cost to stabilize. APC/MDC near zero key. |
  | **4. Enforcement Cost:** Can a stable signalling system exist where *all* significant cost ensuring honesty is imposed *by receivers after signal assessment* (e.g., retaliation costs, included in CMC), with near-zero cost paid *during signal production* (APC/MDC ≈ 0)? | Model: Signal production is intrinsically cheap. Receivers impose high fitness costs on signallers judged deceptive based on signal & context. Costs are only paid if cheating is detected/punished. | **No.** Without production cost (MDC), low-Q individuals can always "bluff" the high signal; some bluffs may succeed without punishment, making deception profitable. | **Yes.** Stability is enforced by the *expectation* of costly retaliation (high CMC), deterring deception. Production cost is irrelevant. | HT: Instability observed (profitable deception). CCT: Stability observed; high CMC deters cheating effectively. *Crucial test.*                                                                                                                                                    | Directly tests MDC vs. CMC as stabilizers.                                                           |
  | **5. Origin vs. Maintenance:** Are the theses primarily about how honest signalling *originates* or how it is *maintained* against invasion?       | Clarification question: Should claims about MDC/mechanisms be interpreted as necessary for the initial evolution of signalling or for its stability once established? | **Maintenance.** Focus is on the conditions for evolutionary stability (ES) at equilibrium, preventing mutant invasion. | **Maintenance.** Agrees focus is on ES/stability at equilibrium. Origin pathways (e.g., via pre-existing cues, coercion) may differ but aren't the core dispute. | **Both Sides: Maintenance.** Agreement that the core disagreement concerns stability conditions at equilibrium, not necessarily origination pathways. *Not a testable crux for this dispute.*                                                                                     | Both sides predict the same (focus on maintenance). Settles scope, not mechanism.                    |
  | **6. Model Dependence:** Does the distinction between costs that merely accompany honesty and costs that enforce honesty depend critically on model assumptions (e.g., discrete vs. continuous quality/signal, additive costs)? | Analysis: Examine whether conclusions about the necessity of MDC change when moving between classic discrete models (e.g., Spence) and continuous models (e.g., Getty, Grafen). | **No.** The necessity of decreasing MDC for stability under conflict is fundamental in continuous models, regardless of specific functional forms (within reason). | **Yes.** The apparent role and necessity of MDC can be highly sensitive to model structure. What looks like enforcing MDC in one model may be an artefact or epiphenomenon in another. | HT: Showing MDC isn't necessary in a robust continuous model with conflict moves them. CCT: Showing MDC *is* strictly necessary across diverse realistic continuous models moves them. *Potential test via model comparison, but hard to adjudicate "realism".* | **Likely Stalemate.** Both sides can interpret model results through their lens. Difficult to resolve empirically. |

  **Part 4: What Neither Side Holds**

  1.  **The Handicap Thesis does NOT hold:** That *all* signals are handicaps; that signals must be *wasteful* or *burdensome* in absolute terms (APC); that differential cost *cannot* arise from constraints or verification; that signalling *requires* conflict (aligned interests can support costless signals).
  2.  **The Cue-and-Constraint Thesis does NOT hold:** That differential costs (MDC) are rare or unimportant; that production costs (APC) are irrelevant; that receiver retaliation is always the sole or primary stabilizer; that constraints or perceptual enhancements *never* involve significant differential costs; that the Handicap Principle offers no valuable insights.
  3.  **Both sides REJECT:** That purely costless signals can be stable under significant conflict of interest; that signalling honesty can be stable without *some* mechanism generating a cost barrier to deception (CMC > 0); that their respective theses are claims about the *origin* of all signals rather than the *stability* of honest signalling under conflict.

  **This statement represents our agreement on the core points of contention and the empirical/modeling avenues that could resolve them, providing a clearer foundation for future research and discussion.**
