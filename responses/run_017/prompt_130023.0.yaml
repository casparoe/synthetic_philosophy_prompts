answer: |-
  Here is a ghazal crafted for your seminar's finale, weaving the formal demands with the philosophical distinctions:

  **Ghazal: The Shifting "Knows"**

  A coffee missed, a minor disarray,
  She claims with ease, "She knows the bank is open Saturday."

  Her rent's unpaid, eviction starts Monday,
  She breathes the phrase, "She knows the bank is open Saturday."

  Her friend needs cash, a loan to save the day,
  She states it plain, "She knows the bank is open Saturday."

  The wager placed, her savings in the fray,
  She risks it all, "She knows the bank is open Saturday."

  Accusation false, would lead the good astray,
  She holds it fast? "She knows the bank is open Saturday."

  My tenure hangs upon this word I say,
  Nina affirms, "She knows the bank is open Saturday."

  ---

  **Philosophical Work in the Couplets:**

  1.  **Couplet 1 (Trivial Stakes):** Depicts a low-stakes, everyday context where knowledge attribution seems straightforward. Both contextualism and IRI agree it's likely true.
  2.  **Couplet 2 (Grave Stakes for Subject):** High prudential stakes for the subject herself. Contextualism (raising standards) and IRI (affecting knowledge via stakes) likely agree the attribution is now false/shaky.
  3.  **Couplet 3 (Stakes on Third Party):** Stakes fall entirely on a third party relying on the subject's word, while the subject has no stakes. **Contextualism:** The *attributor's* context (aware of the third party's high stakes) raises the standard, making the attribution likely false ("states it plain" hints at unawareness of raised standards). **IRI:** Knowledge depends *only* on the *subject's* practical situation. Since her stakes are low, it remains true.
  4.  **Couplet 4 (Self-Manufactured Stakes - Bet):** The subject creates high stakes for herself via a bet. Both theories likely agree this affects the knowledge attribution negatively (false/shaky).
  5.  **Couplet 5 (Moral Stakes):** Holding the belief on thin evidence risks wronging someone (moral stakes). Both theories agree the high stakes (here moral) make knowledge attribution problematic (likely false).
  6.  **Couplet 6 (Speaker's Grave Stakes / Subject's Trivial):** **The Crucial Divergence:**
      *   *Setup:* The speaker (Nina) attributes knowledge to a subject in a *low-stakes* situation ("She knows..."). However, the *speaker herself* faces grave stakes ("My tenure hangs upon this word I say").
      *   **Contextualism (Attributor-Sensitive):** The standards for "knows" are set by the *attributor's* (Nina's) context. Her high stakes raise the epistemic standards significantly. Therefore, attributing "knows" to the low-stakes subject, *using Nina's high standards*, is likely **false**. The words say something false.
      *   **IRI (Subject-Sensitive Invariantism):** Knowledge depends *only* on the *subject's* practical situation. The subject's stakes are low. Therefore, the subject *does* know (by the invariant, low-stakes standard). Nina's attribution, **"She knows the bank is open Saturday"**, is **true**, *regardless* of Nina's own high stakes. The words say something true.
      *   *Exposure:* The identical words in the refrain now express a claim whose truth value, according to the two theories, *diverges* solely because of the *attributor's* practical situation, while the *subject's* situation remains low-stakes. The poem ends by showcasing this theoretical fork without resolving it.

  The poem uses the ghazal's inherent fragmentation to model distinct knowledge-attributing contexts. The unchanging refrain highlights the core question of context-sensitivity, and the final couplet explicitly stages the disagreement between contextualism and IRI through the speaker's insertion of her own high stakes.
