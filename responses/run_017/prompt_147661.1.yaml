  Also, we note:
  - Part of the dispute may be verbal (due to ambiguous terms). We will identify that and the substantive remainder.
  - We must tag each agreed claim and prediction with a rough confidence level (e.g., high, medium, low).
  - At the end, we will identify the one line that would break the truce.

  Let's structure the document accordingly.

  ---

  **Joint Statement on the Fermi Paradox and the Dark Forest Hypothesis**

  **Preamble:**
  This document represents a consensus statement between two camps in the reading group: the "forest people" (who see the dark forest hypothesis as a leading explanation for the Fermi paradox) and the "emptiness people" (who attribute the silence primarily to the rarity of technological civilizations). We agree on several points and clarify our disagreements. We also outline key cruxes and how they might be resolved.

  **1. Agreed Claims (Both Camps Sign)**

  Both camps agree on the following points:

  1.1. **Observational Status**: The current absence of unambiguous technosignatures (such as intentional radio signals, megastructures, or other detectable artifacts) in our astronomical observations does not rule out the existence of extraterrestrial technological civilizations (ETCs). It does, however, constrain the density and behavior of such civilizations in the Milky Way. (Confidence: High)

  1.2. **Physics Constraints**: 
     - The speed of light imposes a fundamental limit on communication and travel, creating significant lags over interstellar distances. This makes real-time interaction impossible and delays any response or detection.
     - The vast distances between stars, combined with the inverse square law, mean that detecting technosignatures requires either very powerful emissions or very sensitive instruments. What counts as a detectable technosignature depends on our observational capabilities and the choices of ETCs. (Confidence: High)
     - The possibility of stealth: A civilization could, in principle, avoid detection by minimizing emissions or using natural phenomena for cover. However, the feasibility and cost of long-term stealth are uncertain. (Confidence: Medium)

  1.3. **Decision-Theoretic Framework**: 
     - If we grant a set of assumptions about the payoffs (e.g., that a first strike is cheap for the attacker and catastrophic for the target, and that the uncertainty about other civilizations' intentions is high), then a strategy of silence and preemption can be rational under game theory. (Confidence: Medium, conditional on the payoffs)
     - However, the actual payoffs and probabilities are unknown, and different priors about the distribution and behavior of civilizations lead to different conclusions. (Confidence: High)

  1.4. **Role of Priors**: The residual dispute between the camps is largely driven by differing prior probabilities assigned to:
     - The abundance of technological civilizations.
     - The likelihood that civilizations develop aggressive or defensive strategies consistent with the dark forest.
     - The feasibility and desirability of long-term concealment versus expansion or communication.
     (Confidence: High)

  1.5. **Verbal Dispute**: Part of the disagreement is verbal. The term "silence" can refer to:
     - The absence of any technosignatures (which both camps agree is observed).
     - The absence of signals specifically intended for communication (which might be consistent with the dark forest, but also with other scenarios).
     - The absence of any leakage or unintended emissions (which is harder to achieve and not necessarily required by the dark forest).
     Similarly, "dark forest" can describe a specific game-theoretic equilibrium or a broader metaphor for cosmic caution. The substantive dispute remains: whether the observed silence is better explained by the rarity of civilizations or by strategic hiding and preemption.

  **2. Table of Disagreements**

  | Issue | Forest Camp Position | Emptiness Camp Position |
  |-------|----------------------|-------------------------|
  | **Explanation of Silence** | The silence is best explained by the dark forest hypothesis: civilizations hide and preempt due to existential risks and game-theoretic incentives. | The silence is best explained by the extreme rarity of technological civilizations, making their detection unlikely regardless of behavior. |
  | **Feasibility of Stealth** | Stealth is feasible and sustainable over long timescales, especially for advanced civilizations that can avoid the "foundry window" or clean up after it. | Stealth is unlikely to be sustainable, especially due to the "foundry window" (see below), and even advanced civilizations would leave detectable traces. |
  | **Rationality of Aggression** | Given the potential for catastrophic strikes and high uncertainty, preemption is a rational strategy and likely to be adopted by many civilizations. | Preemption is unlikely to be a dominant strategy; cooperation or non-interference may be more rational, especially given the costs and risks of aggression. |
  | **Role of the Foundry Window** | The foundry window (a phase of high detectability) may exist, but civilizations can pass through it quickly, minimize it, or mask it, making stealth possible. | The foundry window is a universal and detectable phase; if civilizations were common, we would see evidence of it, so its absence supports rarity. |
  | **Witness Condition** | Strikes can be made undetectable or untraceable, avoiding reputation effects and maintaining the dark forest equilibrium. | Visible strikes would trigger collective security responses, making the dark forest unstable; the absence of such events suggests strikes are rare or impossible to conceal. |
  | **Census Gap Implications** | A census of biospheres without technosignatures would be consistent with the dark forest (many hidden civilizations). | A census showing many biospheres without technosignatures would be puzzling; if biospheres are common but technosignatures absent, it supports rarity of technological development. |

  **3. Cruxes**

  We identify three cruxes (key points of disagreement) that are central to the debate:

  **Crux 1: The Foundry Window**
  - **Issue**: Must a technological civilization necessarily pass through a phase of high detectability (due to industrialization, waste heat, atmospheric changes, etc.)? And if so, does this make long-term concealment impossible?
  - **Forest Camp View**: The foundry window is either avoidable, short-lived, or maskable. Advanced civilizations can transition to low-signature modes without leaving a persistent shell. (Confidence: Medium)
  - **Emptiness Camp View**: The foundry window is inevitable and leaves a persistent, expanding shell of evidence. If civilizations were common, we would detect these shells. Their absence implies rarity. (Confidence: Medium)
  - **Concrete Test**: 
     - Both camps agree that future observations (e.g., with next-generation telescopes like JWST or ELT) that detect atmospheric biosignatures in exoplanets without any technosignatures would bear on this crux.
     - **Prediction**:
       - Forest Camp: Expects many such worlds with biosignatures but no technosignatures, consistent with civilizations hiding after a brief foundry window. (Confidence: Medium)
       - Emptiness Camp: Expects very few worlds with biosignatures (implying that the transition to technological civilization is rare). (Confidence: Medium)

  **Crux 2: The Witness Condition**
  - **Issue**: Can a civilization carry out a preemptive strike without being detected by third parties? If strikes are observable, does this lead to norms, deterrence, and collective security?
  - **Forest Camp View**: Strikes can be made untraceable (e.g., via relativistic kinetics or other low-signature methods) and are unlikely to be witnessed. Reputation effects are negligible due to vast distances and timescales. (Confidence: Medium)
  - **Emptiness Camp View**: Strikes would be detectable (e.g., through anomalous astrophysical events) and attribution is possible. This would allow for collective responses, making aggression costly and rare. (Confidence: Medium)
  - **Concrete Test**: 
     - Both camps agree that the detection (or non-detection) of artificial astrophysical events (e.g., unexplained gamma-ray bursts, rapid planetary disruptions, or other anomalies) that could be interpreted as strikes would be informative.
     - **Prediction**:
       - Forest Camp: Predicts no such events observed, as strikes are rare and designed to be undetectable. (Confidence: Low, due to rarity and stealth)
       - Emptiness Camp: If strikes were common, they would be observed. Since none are seen, strikes are rare, supporting the rarity of civilizations. (Confidence: Low, but absence is consistent with their view)

  **Crux 3: The Census Gap**
  - **Issue**: As our ability to detect biospheres improves, what will a census of inhabited worlds reveal? Does a high number of biospheres without technosignatures support the dark forest or rarity?
  - **Forest Camp View**: A census showing many biospheres but no technosignatures is consistent with civilizations hiding. Technological life may be common but undetectable due to strategic silence. (Confidence: Medium)
  - **Emptiness Camp View**: A census showing many biospheres without technosignatures would be anomalous; it would imply that the emergence of technological intelligence is a rare filter. (Confidence: Medium)
  - **Concrete Test**: 
     - Both camps agree that statistical results from biosignature surveys (e.g., the fraction of habitable-zone planets with biosignatures) and the absence/presence of technosignatures in the same systems will be critical.
     - **Prediction**:
       - Forest Camp: Expects a high rate of biosignatures but near-zero technosignatures. (Confidence: Medium)
       - Emptiness Camp: Expects a low rate of biosignatures (if life is rare) or a high rate but still near-zero technosignatures (if technological transition is rare). (Confidence: Medium)

  **4. Potential Truce-Breaking Line**

  After review, the line most likely to be rejected by a committed member of either camp is:

  - **In the Agreed Claims (Section 1.3)**: "If we grant a set of assumptions about the payoffs ... then a strategy of silence and preemption can be rational under game theory."

     - **Why it might break the truce**: 
       - An emptiness partisan might object that the "if we grant" clause concedes too much to the forest camp by accepting the rationality of preemption under their assumptions, which the emptiness camp may view as unrealistic or unlikely. They might argue that the assumptions are so extreme that they don't reflect plausible scenarios.
       - A forest partisan might accept this line but could be concerned that it understates the strength of the dark forest argument by making it conditional.

  However, both camps have agreed to the conditional nature of the claim in our discussions. If either side rejects this, it may be due to a deeper disagreement about the realism of the payoffs. We flag this as the most fragile point.

  **Conclusion**
  This joint statement clarifies common ground and key disagreements. We commit to revisiting our predictions as new data become available from biosignature surveys, technosignature searches, and astrophysical monitoring.

