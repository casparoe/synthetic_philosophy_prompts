answer: |-
  Here's a mapping of the Varsity Blues scandal against four meritocratic justifications, their condemnation of control cases, and the implications of the scandal for the theories themselves:

  **I. Analysis Under Four Meritocratic Justifications**

  1.  **Desert Proper (Owed to the Earned):**
      *   **What Went Wrong:** The students received the benefit (admission) without performing the actions that genuinely earned it. Their test scores and athletic "achievements" were fabricated; they didn't *do* the work or demonstrate the actual abilities required. The place wasn't *owed* to them; it was stolen from those who genuinely earned it through their own efforts and talents.
      *   **Condemns:** Fake athletic recruitment, Test score fraud, *Possibly* legacy if seen as unearned privilege, *Possibly* endowment-for-seat if direct quid pro quo.
      *   **Permits:** Test prep (student still takes test), Elite private school (student still learns/achieves), Genuine athletic recruitment (student has the skill), Legacy if seen as reward for parent's loyalty/effort (debatable), Endowment *not* explicitly linked to admission.

  2.  **Role View (Best Fit for the Role):**
      *   **What Went Wrong:** The universities were defrauded into admitting students demonstrably *unfit* for the roles they were assigned (athletic teams) and likely less academically prepared than displaced students. They wouldn't perform well *as* recruited athletes (most didn't even play) and were likely less qualified academically to succeed *as* students.
      *   **Condemns:** Fake athletic recruitment (clearly unfit for athletic role, likely less fit academically), *Potentially* legacy/admission-for-endowment if resulting in less qualified students displacing more academically qualified ones.
      *   **Permits:** Test prep (improves fitness), Elite private school (improves fitness), Genuine athletic recruitment (fits athletic role), Legacy/endowment *if* the admitted student is still academically qualified enough to succeed ("good enough" threshold).

  3.  **Luck-Discounted Desert (Effort Grounds Desert):**
      *   **What Went Wrong:** The core violation is the bypassing of effort. The students didn't exert the *effort* required to develop genuine athletic skills or achieve their test scores. Their advantage came purely from wealth (brute luck) used to circumvent effort-based systems (fabrication/bribes), not from their own diligence.
      *   **Condemns:** Fake athletic recruitment, Test score fraud, *Strongly* legacy (inherited advantage), *Strongly* endowment-for-seat (wealth purchase).
      *   **Permits:** Test prep (requires student effort to utilize), Elite private school (requires student effort to benefit), Genuine athletic recruitment (presumes effort developed skill).

  4.  **Procedural View (Non-Buyable Sorting Mechanism):**
      *   **What Went Wrong:** Singer corrupted the *procedures* (test administration, athletic recruitment process) through bribery and fraud, rendering them non-meritocratic. The mechanism became "buyable." The core wrong is the *cheating* itself, violating the rules of the competition regardless of the underlying merits.
      *   **Condemns:** Fake athletic recruitment, Test score fraud, *Potentially* direct endowment-for-seat if it violates explicit rules (though often it doesn't).
      *   **Permits:** Test prep (works within rules), Elite private school (works within rules), Legacy (often an explicit rule/policy), Genuine athletic recruitment (works within rules), Endowment *if* not explicitly linked to admission per rules.

  **II. Control Case Condemnation Summary:**

  | Justification          | Fake Athlete | Test Fraud | Test Prep | Elite School | Legacy | Endow-for-Seat | Genuine Athlete |
  | :--------------------- | :----------- | :--------- | :-------- | :----------- | :----- | :------------- | :------------- |
  | **A. Desert Proper**   | **Condemn**  | **Condemn**| Permit    | Permit       | *Maybe*| *Maybe*        | Permit         |
  | **B. Role View**       | **Condemn**  | **Condemn**| Permit    | Permit       | *Maybe*| *Maybe*        | Permit         |
  | **C. Luck-Discounted** | **Condemn**  | **Condemn**| Permit    | Permit       | **Condemn** | **Condemn**    | Permit         |
  | **D. Procedural**      | **Condemn**  | **Condemn**| Permit    | Permit       | Permit | *Maybe*        | Permit         |

  *   **Only the Last?** **No single view condemns *only* the fake athletic recruitment.** Views A & B also condemn the test fraud. View C condemns almost all advantages. View D condemns the fraud but *permits* legacy and *might permit* endowment-for-seat if procedurally allowed. The fake athletic recruitment is uniquely condemned by *all* views only because it involved *both* fabrication/fraud *and* likely poor fit (A, B, C) *and* corrupted procedure (D). Test fraud is condemned by A, B, C, D for similar reasons.

  **III. Scandal's Implications for the Theories:**

  1.  **The "Swap Test":**
      *   **Argument:** If swapping a randomly rejected applicant with the admitted Singer-client would likely cause *no discernible difference* to the university's outcomes (academic performance, athletic contribution, future success/alumni relations), then the seat allocation wasn't actually tracking "merit" in any robust sense (A, B). The mechanisms were either flawed proxies or easily corrupted.
      *   **Proves Too Much for Hiring?** Potentially, but less so. Hiring often involves specific, verifiable skills and experience directly relevant to job performance. Swapping qualified candidates might make little difference, but swapping an unqualified Singer-type hire *would* likely cause harm. The argument highlights the *fuzziness* and *high substitutability* at the margins of hyper-selective college admissions compared to many job roles.
      *   **Impact:** Undermines A & B by suggesting the "desert" or "fitness" being tracked is either minimal or poorly measured at this level of selectivity. Supports D (procedure mattered more) and C (luck/wealth dominates outcomes).

  2.  **Fraud Charges & Public Outrage:**
      *   **Public Outrage:** Primarily evidences support for **procedural fairness (D)**. The visceral reaction was to the *cheating* – bribes, lies, rigging the game – not necessarily a deep analysis of whether the displaced students "deserved" it more under A, B, or C. People care about the *rules of the competition* being followed, even if the competition itself advantages wealth (test prep, schools) or connections (legacy).
      *   **Open Purchase Variant:** This reveals the limits of meritocracy discourse.
          *   **A & B:** Would condemn it as undeserved and unfit.
          *   **C:** Would condemn it as wealth circumventing effort.
          *   **D:** Would be **silent or permit it**, *if* the university openly adopted a rule allowing seats to be purchased. The wrong (for D) disappears if the procedure allows it. This highlights D's potential amorality – it cares about rule-following, not the moral basis of the rules.
      *   **Impact:** Strengthens D as the most widely shared intuition (cheating is wrong) but exposes its potential moral emptiness when procedures permit overtly non-meritocratic factors. Weakens the idea that A, B, or C are the *primary* drivers of public outrage, though they likely contribute to the sense of unfairness *within* the expected rules.

  **IV. Where Theories Go Silent:**

  1.  **Desert Proper (A) & Role View (B):** Struggle significantly with the "swap test" implication – if marginal differences in "merit" are negligible, does "desert" or "fitness" meaningfully exist at this level? They are silent on whether the *university's own goals* (e.g., fundraising, alumni relations) could *legitimately* justify non-meritocratic factors like legacy or endowment, if those factors serve the institution's purpose.
  2.  **Luck-Discounted (C):** Is silent on whether the *university's purpose* justifies considering factors beyond effort-discounted desert (e.g., needing world-class athletes for a team, needing funds to operate). It provides a moral critique of the system itself but doesn't engage with institutional realities.
  3.  **Procedural (D):** Is fundamentally silent on the *moral quality of the procedure itself*. If legacy preferences or even open auctioning of seats are the official rules, D has no objection. It only cares that the rules aren't secretly violated. It cannot condemn Singer if the university had openly sold spots (though prosecutors might still find fraud in misrepresenting athletic credentials).

  **Conclusion:** The Varsity Blues scandal acts as a powerful stress test:
  *   It reveals that **no single meritocratic justification cleanly condemns only the fake recruitment**; test fraud is equally condemned by most.
  *   It highlights that **procedural integrity (D) is the most universally agreed wrong**, explaining the fraud charges and public outrage, but this view is morally hollow if procedures permit unfair advantages.
  *   It seriously challenges **desert (A) and fitness (B)** views through the "swap test," suggesting meritocratic distinctions at elite margins may be tenuous.
  *   It exposes the **deep tension** between meritocratic ideals (A, B, C) and the **institutional realities and goals** of universities (fundraising, alumni relations, athletic programs) that inherently rely on factors like wealth (C) or connections, which proceduralism (D) might accommodate if codified. The scandal doesn't destroy meritocracy, but it starkly reveals its limitations, contradictions, and the powerful role of procedural fairness in public perception.
