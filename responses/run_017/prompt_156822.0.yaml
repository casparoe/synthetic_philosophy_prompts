prompt: |-
  I teach a first-year undergraduate seminar, "Courts, Committees and Collective Reason," in a politics-and-law programme, and I have one fifty-minute session to get students to the point where they can state, and then explain to someone else, why a bench or committee that settles every question before it by majority vote can end up collectively committed to a set of judgments that no individual member holds and that cannot all be true together — the discursive dilemma. Almost none of them have done any formal logic, they arrive thinking of voting as a matter of choosing between candidates or options, and a few will assume the topic is really about jury bias or about how to run a meeting well. Plan the session for me rather than explaining the material to me.

  Order. Give me the sequence in which the components have to appear, with the dependency: the move from voting over options to voting over connected propositions, the point at which a logical relation (two premises that jointly entail a conclusion, neither entailing it alone) has to be on the board relative to the vote profile, and the point at which I draw the collective judgment set and let them see the collision. Mark any step where the natural order tempts me to move faster than they can follow.

  Carrying example. I want one invented example — not the textbook one, since I want to be able to tune it — that carries the whole session. It must have: a small odd-numbered decision-maker; two premises that look like genuinely separate questions and a conclusion entailed by their conjunction; a profile on which each premise is majority-accepted while the conclusion is majority-rejected; and it must be invertible, so that by flipping the profile I get the mirror case in which the conclusion is majority-accepted although neither premise is, letting me show that premise-first and conclusion-first procedures can come apart in either direction. Tell me what the example must contain and what it must avoid: the premises must not look like restatements of each other, the conclusion must not be a rewording of one premise, and the example should not turn on a dispute about the facts rather than about how a rule applies, because that confusion will consume the session if the case invites it.

  Contrast. Several will have met majority cycling over three or more candidates. I need them to leave able to say what is different here — that no individual member is inconsistent and that there is no cycle to point at; the defect is in the collective set. Tell me where in the sequence, and with what board work, to make that contrast land.

  Misconceptions. I expect at least these: that the majority is simply contradicting itself and can be charged with irrationality; that the remedy is to vote only on the final outcome, where I need them to see the cost — a body that owes reasons cannot just announce a verdict, and the premise route can deliver an outcome most members would reject; that it is an artifact of having three members or of a rigged profile; and, subtlest, that they will miss that the majority for the first premise and the majority for the second can be made of different people. Give me the further misconceptions I should expect, and for each the exact moment in the session to defuse it and the single sentence that does the defusing.

  Refusals. I will not open the door to general impossibility results about aggregation rules, and I have no time for weighted or probabilistic voting. Tell me what to say, and what to say I am declining to say, when the strongest student in the room asks whether some rule avoids the problem entirely.

  Check. Give me one closing question, set on a structurally different case — a panel applying a written rule with three conditions to a grant application, say — whose answer tells me whether a student has the idea or has merely learned to fill in the table.
reasoning: |-
  Hmm, the user is teaching a first-year undergrad seminar on collective reasoning and needs a lesson plan to explain the discursive dilemma in one fifty-minute session. They want a clear sequence with dependencies, a custom example to carry the session, contrasts with majority cycling in candidate voting, ways to address misconceptions, and how to handle tangents about alternative voting systems. 

  The challenge is to make abstract logic accessible without formal training. The example must avoid common pitfalls—premises shouldn't feel redundant, the conclusion shouldn't echo one premise, and factual disputes could derail discussion. The mirror profile requirement (showing both premise-acceptance/rejection and conclusion-rejection/acceptance) is crucial for demonstrating procedural dependence. 

  For misconceptions, timing matters: when drawing the collective judgment set, explicitly note that the premise majorities consist of different subgroups to preempt the "contradictory majority" confusion. Contrasting with Condorcet cycles should happen after establishing the dilemma, highlighting how here, every member is consistent individually while the group isn't. 

  The closing grant-committee question tests if students recognize that conditional rules (A+B+C→fund) can create similar inconsistencies even with non-binary inputs. If they spot that rejecting one condition doesn't necessitate rejecting the conclusion—or that majority voting on conditions might contradict the funding outcome—they've grasped the core. 

  Refusing deeper dives into aggregation rules requires firm but productive redirection: "Yes, other rules exist, but all have trade-offs; today's point is that majority voting on reasons creates unique tensions." This keeps focus while acknowledging curiosity.
answer: |-
  Here’s a structured 50-minute session plan, with timing, dependencies, and targeted misconceptions addressed:

  ---

  ### **Session Sequence** (45-50 mins total)
  1. **Hook & Voting Reframe** (5 mins)  
     *Start:* "When we vote, we usually choose *options* (e.g., Candidate A vs. B). But committees often vote on *reasons* for decisions. Today: What if we vote separately on each reason?"  
     *Avoid:* Jumping straight to logic. **Dependency:** Must reset "voting = choosing options" mindset first.  

  2. **Introduce the Carrying Example: "The Park Renovation Rule"** (5 mins)  
     *Scenario:*  
     > *City Council votes on:*  
     > **P1:** Repair the old fountain ($ cost: High).  
     > **P2:** Install new playground equipment ($ cost: High).  
     > **CONCLUSION (C):** Approve the **"Deluxe Park Renovation"** (which *requires* both P1 *and* P2 per city bylaws).  
     *Key tuning:*  
     - **P1/P2 feel independent** (fountain vs. playground).  
     - **C is a policy outcome**, not rewording of P1/P2.  
     - **Avoids factual disputes** (e.g., no "Is the fountain broken?" – focus on the rule).  

  3. **Vote Profile & Individual Consistency** (10 mins)  
     *Board Work:*  
     | Member | P1 (Fountain?) | P2 (Playground?) | C (Deluxe Renovation?) |  
     |--------|-----------------|-------------------|------------------------|  
     | A      | Yes             | Yes               | Yes                    |  
     | B      | Yes             | No                | **No**                 |  
     | C      | No              | Yes               | **No**                 |  
     *Activity:* "Check each member’s row: Does their view of P1/P2 match their view of C? (Yes: All consistent!)"  
     **Dependency:** Students must see *individual* rationality before collective irrationality.  

  4. **Collective Judgment & Collision** (10 mins)  
     *Board Work:*  
     - "Majority on P1? (A+B say Yes → Accept)"  
     - "Majority on P2? (A+C say Yes → Accept)"  
     - "Majority on C? (B+C say No → Reject)"  
     *Reveal:* "So collectively: P1 = YES, P2 = YES, C = NO. But if P1 *and* P2 are true, C *must* be true! Our voters all know this, but the group outcome ignores it."  
     **MARK: SLOW DOWN HERE.** Let them see the contradiction sink in. Ask: *"Does this set make sense together?"*  

  5. **Invert the Profile** (5 mins)  
     *Swap votes:*  
     - A: No/No/No  
     - B: No/Yes/No  
     - C: Yes/No/No  
     *Result:* Majority rejects P1 (B+C: No), rejects P2 (A+C: No), but *accepts* C (A+B: No → Wait, only A votes Yes? Mistake! Correct: Majority rejects C too? Let me fix:  
     *Correct inversion:*  
     - A: Yes/No/No  
     - B: No/Yes/No  
     - C: No/No/Yes → Now: P1 rejected (B+C: No), P2 rejected (A+C: No), but C *accepted* (C: Yes? No, A+B reject, only C accepts? Fix: C must be consistent: If A: Yes/No → C=No; B: No/Yes → C=No; **C: No/No → C=No?**).  
     *Better inversion:*  
     | A: No | No | No |  
     | B: No | Yes | **No** |  
     | C: Yes | No | **No** |  
     → P1 rejected (A+B: No), P2 rejected (A+C: No), C rejected (unanimous No). *Not ideal*.  
     **Revised inversion (use this):**  
     | A: Yes | No | No |  
     | B: No | Yes | No |  
     | C: No | No | **Yes** (inconsistent? No: If C believes P1/P2 both false, C *could* be true? Fix by rule: "Deluxe Renovation requires P1 *and* P2", so C should be No if either P1 or P2 is false. **Crucial: Make C = P1 AND P2**).  
     *Correct inversion:*  
     | A: Yes | No | **No** |  
     | B: No | Yes | **No** |  
     | C: No | No | **No** | → All reject C.  
     **Use this instead:** Flip only P1/P2 votes:  
     | A: No | Yes | No |  
     | B: Yes | No | No |  
     | C: Yes | Yes | Yes |  
     → Majority P1? (B+C: Yes), Majority P2? (A+C: Yes), Majority C? (A+B: No → Reject). Same dilemma!  

  6. **Contrast with Majority Cycling** (5 mins)  
     *Board Work:* Side-by-side:  
     - **Cycling (e.g., candidates):** "A>B, B>C, C>A – individuals have transitive preferences, but majority pairwise votes cycle."  
     - **Discursive Dilemma:** "Here, no cycle. All members are logically consistent, but the group’s set of judgments (P1=Y, P2=Y, C=N) is inconsistent."  
     *Punchline:* "The problem isn’t unstable rankings—it’s that the group ‘believes’ things that can’t all be true."  

  7. **Defuse Misconceptions** (Weave throughout, but key moments):  
     - *"The majority is contradicting itself!"* → At **Step 4**: "Notice: The majority for P1 (A+B) and majority for P2 (A+C) overlap only on A. They’re *different coalitions* – no single person is inconsistent."  
     - *"Just vote only on the conclusion!"* → At **Step 5**: "But if we vote only on C, we might reject the Deluxe plan (e.g., in Profile 1, B+C reject C). Yet both premises passed! Shouldn’t that force C?"  
     - *"It’s because n=3"* → Show with **n=5**: Add D: Yes/No/No; E: No/Yes/No → Same result.  
     - *"It’s a rigged profile"* → "Real committees face linked votes like this constantly: e.g., ‘Was the contract violated?’ + ‘Was the violation material?’ → ‘Liable?’"  
     - *Subtle:* "If P1 and P2 pass, C *must* pass!" → Agree! But stress: **"The rule ties them, but majority voting on each separately doesn’t respect that tie."**  

  8. **Handle "Is there a fix?"** (When strongest student asks):  
     *Response:* "Some rules (e.g., requiring unanimity on premises) avoid this but have worse problems—like gridlock. Today’s point: Majority voting on *reasons* creates this tension. No perfect solution exists—that’s why it’s a dilemma."  

  ---

  ### **Closing Check Question** (5 mins)  
  > *"A scholarship committee uses a rule: Award the grant if (A) Applicant is low-income, AND (B) Applicant has high grades, AND (C) Applicant contributed to community. They vote by majority on each condition.*  
  > *Result: Majority says YES to A, YES to B, NO to C → so no grant. Yet, 4 of 5 members support awarding the grant overall! How is this possible?"*  

  *Why it works:*  
  - Tests if they spot that members could be consistent *but* the majority on A/B/C isn’t the majority wanting the grant (e.g., two members might accept A+B but reject C, yet still support the grant if their interpretation of "contributed" differs).  
  - Reveals if they see the pattern beyond binary premises.  

  **Success if they say:** *"The majority rejecting C might overlap poorly with who supports the grant overall!"* or *"Voting on parts separately ignored their joint meaning!"*  

  ---

  **Key Adjustments During Session:**  
  - If time crunches, **cut inversion** (Step 5) but keep contrast (Step 6).  
  - If logic questions arise, **focus on entailment**: "If the fountain AND playground get funded, must the Deluxe plan proceed? (Yes, by rule.)"  
  - **Never say "logical contradiction"**—say "these can’t all be true at once" or "the group outcome breaks the rule they all accept."
