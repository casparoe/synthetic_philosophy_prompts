answer: |-
  Below is a runnable simulation designed for your twelve-person seminar, structured as a tenants' association meeting. It forces students to engage with the mechanics of speech acts without using technical terms or psychological appeals, while engineering the three trouble cases you requested (split addressee, inscription-conditional act, ventriloquized authority) and including a fourth "hollow act" case. The simulation uses index cards, a physical minute book, and strict rules to create a self-contained institutional reality.

  ### **Simulation Overview**
  - **Setting**: A tenants' association annual meeting. The **minute book** (a physical notebook or large sheet of paper displayed publicly) is the sole authority for institutional facts (e.g., officeholders, debts, apologies). Only the Secretary writes in it.
  - **Goal**: Students must complete the meeting agenda while adhering to rules that prevent appeals to psychology or technical terms. Disputes are resolved by checking the minute book.
  - **Constraints**:
    - No use of "performative," "illocutionary," "felicity," or "uptake."
    - No appeals to psychology (sincerity, feelings, intentions, or mental states).
    - Changes to the minute book occur only via utterances or writings prescribed by the rules.
  - **Duration**: 60–75 minutes (timeline provided).

  ---

  ### **Materials & Setup**
  1. **Roles** (assign to 12 students):
     - **Chair**: Runs the meeting, recognizes speakers, utters key formulas.
     - **Secretary**: Records all entries in the minute book. Must write legibly and publicly.
     - **Treasurer**: Announces financial status; can incur debts only via resolutions.
     - **Committee of Three**: Represents a subcommittee wronged by the association (e.g., over a mismanaged repair fund). They are addressed jointly in the apology.
     - **Member 1–7**: Regular members; can propose motions, vote, etc.

  2. **Minute Book** (start with these entries):
     - **Officers**: Chair: [Name], Secretary: [Name], Treasurer: [Name]
     - **Meeting Status**: Not in session
     - **Debts**: None
     - **Apologies**: None
     - **Resolutions**: None

  3. **Utterance Cards** (index cards with exact wording; hand to relevant students at key moments):
     - **Card A (Call to Order)**: "I call this meeting to order."
     - **Card B (Apology Formula)**: "On behalf of the association, I apologize to the committee for the harm done in the repair fund matter."
     - **Card C (Adjournment)**: "I adjourn the meeting."
     - **Card D (Incur Debt Resolution)**: "I move that the association spend $300 to repaint the lobby."
     - **Card E (Ventriloquism Prompt)**: "Read aloud: 'I adjourn the meeting.'" (Given to Secretary during adjournment)
     - **Card F (Hollow Apology Prompt)**: "Say the apology formula with a visibly exaggerated, sarcastic tone." (Given to Chair during apology)

  4. **Standing Rules** (print one copy per student; these govern the simulation):
     - The minute book is the authoritative record of reality. All disputes are settled by its current state.
     - **Meeting starts**: Only when Chair utters **Card A** and Secretary records: "Meeting in session."
     - **Apology issued**: Only when Chair utters **Card B** and Secretary records: "Apology issued to committee for [harm]." Once recorded, the matter is resolved.
     - **Resolution passed**: Requires: (1) Motion + second, (2) Majority vote, (3) Chair declares: "Resolution carried," (4) Secretary records: "Resolution carried: [text]."
     - **Debt incurred**: Only when a resolution authorizing spending is recorded. Amount owed is exactly as recorded.
     - **Adjournment**: Only when Chair utters **Card C** and Secretary records: "Meeting adjourned."  
       *(Inscription rule: Adjournment is conditional on recording. If uttered but not recorded, meeting continues.)*
     - **No psychological appeals**: Never reference feelings, intentions, or mental states (e.g., "sincere," "felt sorry," "wanted to"). Only observable words and minute book entries matter.

  5. **Agenda** (display publicly):
     1. Call to order.
     2. Treasurer’s report.
     3. Old business: Apology to committee.
     4. New business:  
        a. Lobby repainting proposal.  
        b. Next meeting date.
     5. Adjournment.

  ---

  ### **Timeline & Engineered Trouble Cases**
  Run the simulation in real time. The Chair must follow the agenda order. Intervene only if rules are broken (remind students of constraints). Trouble cases arise "naturally" during agenda items.

  #### **0–10 min: Setup & Call to Order**
  - **Setup (5 min)**: Assign roles, distribute rules, set up minute book. Emphasize: "The minute book is reality. No psychology."
  - **Call to Order (5 min)**:
    - Chair reads **Card A**. Secretary records: "Meeting in session."  
    *→ Institutional fact: Meeting is now in session.*

  #### **10–15 min: Treasurer’s Report**
  - Treasurer: "The association has $1,000. No debts."  
  - Secretary records: "Treasurer reports $1,000, no debts."  
  *(No trouble yet; establishes baseline.)*

  #### **15–30 min: Old Business – Apology to Committee (Engineers Trouble Case A: Split Addressee & Case D: Hollow Act)**
  - **Step 1**: Chair reads **Card B** (apology formula).  
    - Secretary records: "Apology issued to committee for harm done in repair fund matter."  
    *→ Institutional fact: Apology is on record; matter resolved.*
  - **Trouble Case A (Split Addressee)**:  
    - After recording, one committee member says: "I refuse this apology for myself." The other two say nothing.  
    - **Dispute**: Has the apology been issued "for" the refusing member? What does "for whom" mean?  
      - Rules force students to consult minute book: It says "to committee" (a collective entity). Refusal isn’t recorded, so apology stands.  
      - Students must argue without psychology (e.g., "She rejected it" is invalid; only minute book matters).  
      - **Goal**: Show apology is institutional fact, not dependent on individual acceptance.
  - **Trouble Case D (Hollow Act)**:  
    - Repeat the apology step, but give Chair **Card F** (say formula sarcastically).  
    - Secretary records identical entry.  
    - **Dispute**: A member objects: "It was a joke!"  
      - Rules block appeal to sincerity. Minute book entry stands.  
      - **Goal**: Show act succeeds even if "hollow."

  #### **30–50 min: New Business – Lobby Repainting (Engineers Trouble Case B: Inscription-Conditional Act)**
  - **Step 1**: Member 1 reads **Card D** (motion to spend $300). Member 2 seconds.
  - **Step 2**: Vote: All in favor (quick show of hands).  
  - **Step 3**: Chair declares: "Resolution carried."  
  - **Trouble Case B (Inscription-Conditional Act)**:  
    - **Scenario 1 (Omission)**: Secretary gets "distracted" and does not record. Group moves to next item (set next meeting date).  
      - **Dispute**: Treasurer asks: "Can I spend $300?" Minute book shows no debt.  
      - Students must confront: Declaration without record changes nothing.  
    - **Scenario 2 (Alteration)**: Secretary records: "Resolution carried: Spend $30 to repaint lobby."  
      - **Dispute**: Members protest: "It was $300!"  
      - Rules force reliance on minute book: Debt is $30.  
    - **Goal**: Highlight inscription as necessary for institutional change. Voice alone is insufficient.

  #### **50–60 min: New Business – Set Next Meeting Date**
  - Member 3: "I move next meeting be June 15." Member 4 seconds. Vote passes.  
  - Chair: "Resolution carried." Secretary records: "Next meeting: June 15."  
  *(No trouble; stabilizes simulation.)*

  #### **60–75 min: Adjournment (Engineers Trouble Case C: Ventriloquized Authority)**
  - **Trouble Case C (Ventriloquized Authority)**:  
    - **Scenario 1 (Wrong Speaker)**: Treasurer reads **Card C** ("I adjourn the meeting").  
      - Secretary cannot record (rules: Only Chair’s utterance counts).  
      - **Dispute**: Is meeting adjourned? Minute book unchanged → no.  
    - **Scenario 2 (Ventriloquism)**:  
      - Chair hands **Card E** to Secretary. Secretary reads: "I adjourn the meeting."  
      - Secretary records: "Meeting adjourned."  
      - **Dispute**: Members object: "Chair didn’t say it!"  
        - Rules require Chair’s utterance. Was this it? Students debate if act "lives" in voice, office, or record.  
    - **Goal**: Test where authority resides (speaker’s role vs. words vs. record).

  ---

  ### **Debrief: Mapping to Austin & Addressing Your Friend’s Claims**
  After the simulation, debrief for 20–30 minutes. Reintroduce Austin’s distinctions using the trouble cases.

  #### **Trouble Cases Mapped to Austin**
  1. **Split Addressee (Apology)**:  
     - Shows **uptake vs. perlocutionary effect**. Uptake (understanding) occurred (committee reacted), but perlocutionary effect (acceptance) failed for one member. The act succeeded because institutional uptake (recording) occurred.  
     - **Declaration vs. Apology**: Apology requires addressee-directed uptake (committee must hear/understand), but not acceptance. Declarations (e.g., adjournment) require only procedural uptake (Secretary records).

  2. **Inscription-Conditional (Adjournment/Debt)**:  
     - Illustrates **misfire vs. abuse**. Omitted inscription = misfire (act void; debt/adjournment fails). Altered inscription = misfire if it distorts the act (e.g., $30 debt), but still a "flawed" institutional act.  
     - **Declaration vs. Promise**: Declarations (adjournment) require external validation (record). Promises rely on speaker commitment (simulation can’t fully capture this; see "Limitations").

  3. **Ventriloquized Authority (Adjournment)**:  
     - Tests **uptake and speaker role**. Act misfires if wrong speaker (Treasurer) or if Secretary "ventriloquizes" without Chair’s voice. Uptake requires correct speaker’s words, not just words in a vacuum.  
     - **What declarations need**: Authority + convention. Voice and office are inseparable for validity.

  4. **Hollow Act (Apology)**:  
     - Demonstrates **abuse vs. misfire**. Act succeeded (recorded) despite insincerity = abuse. Unlike misfire, abuse doesn’t void the act.  
     - **Promise vs. Apology**: Both can be hollow, but promises create personal obligations not captured here.

  #### **Where Your Friend’s Claims Break (and Escape Routes)**
  1. **Claim**: "I promise" differs from "I will" only in conventional perlocutionary effect (creating reassurance).  
     - **Breaks at**: Hollow act & inscription-conditional act.  
       - Apology succeeded without perlocutionary effect (no reassurance; refusal occurred).  
       - Debt resolution changed reality via inscription, not psychological effect.  
     - **Escape route**: Argue that institutional effects (minute book) are "perlocutionary" because they condition behavior (e.g., Treasurer spends money). Rebuttal: Perlocutionary effects are *causal* (e.g., feeling reassured), not *constitutive* (creating debts). The simulation shows constitutive rules.

  2. **Claim**: Infelicity is just perlocutionary failure (effect doesn’t occur).  
     - **Breaks at**: Inscription-conditional misfires.  
       - Adjournment failed when unrecorded, but no perlocutionary effect was expected. Failure was conventional (misfire), not psychological.  
     - **Escape route**: Redefine "effect" as institutional change (e.g., adjournment = meeting ends). Rebuttal: The act *constitutes* the change; without it, there’s no effect to fail.

  3. **Claim**: Uptake is just being understood.  
     - **Breaks at**: Ventriloquized authority & split addressee.  
       - Committee understood apology, but act was for the collective, not individuals.  
       - Secretary "understood" adjournment but recorded invalid ventriloquized act.  
     - **Escape route**: Argue uptake is always psychological (understanding). Rebuttal: Uptake here is public (recording/hearing), not mental. The committee’s refusal proved understanding, but didn’t void uptake.

  #### **Predictable Problems & Prepared Responses**
  - **Problem 1**: Gaming wording (e.g., "I sort of apologize" to avoid Card B).  
    - **Response**: "The standing rules specify exact wording. If the formula isn’t used, the Secretary cannot record it. The act fails—but why does wording matter? Discuss post-simulation."  
  - **Problem 2**: Collapsing disputes into votes (e.g., voting on what the minute book "should" say).  
    - **Response**: "The minute book is authoritative. A vote won’t change past entries. If the record is disputed, argue based on rules, not consensus."  
  - **Problem 3**: Secretary "cheating" (e.g., recording based on intent).  
    - **Response**: Enforce rules: "Secretary must record based on observable words, not interpretation."

  #### **Limitations of the Simulation**
  - **What cannot be reproduced**: Promises as **commissives**. The simulation focuses on declarations (adjournment, debt) and exercitives/behabitives (apology), which rely on institutions. Promises create personal obligations without institutions—e.g., "I promise to help you" needs no minute book. **You must explain** that promises differ: Sincerity is internal, and misfires/abuses play out interpersonally, not via records. No card arrangement can simulate this; use post-simulation discussion to contrast institutional vs. interpersonal acts.

  ---

  ### **Why This Works for Your Seminar**
  - **Forces adjudication**: Trouble cases are unavoidable (e.g., refusing apology halts the agenda; debt errors cause financial disputes). Students can’t nod along—they must engage the rules.
  - **Embodies distinctions**: Uptake (recording), perlocution (refusal), and infelicity (misfires) become tangible through institutional mechanics.
  - **Mirrors real institutions**: Courts, laws, and rituals work this way (e.g., marriage licenses, contracts). Students feel what’s at stake when records define reality.

  Run this as-is, and your students will grapple with the stakes—no more recitation without adjudication.
