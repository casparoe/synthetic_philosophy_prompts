     Alternatively, we can have a rehearsal at the beginning: before the meeting is called to order, the Chair practices: "I call this meeting to order." Then the Secretary writes it? But the meeting isn't in session until it's called to order. So the Secretary shouldn't write. But if they do? Then the minute book would show the meeting in session? But it's not. The standing rules say the meeting is in session after the call to order. So if the Secretary records it during rehearsal, it's a mistake? But the minute book is authoritative? Then it would show the meeting in session? But the meeting hasn't started? This is a problem. We can avoid rehearsal.

     We can have the hollow act for a promise? But we don't have a promise act in the agenda. We have apologies and declarations. We can add a promise: the association promises to pay for something? But the resolution already creates a debt. 

     Alternatively, during the meeting, the Chair says: "I promise to bring cookies next time." This is not an official act? So it's not recorded. We want an official act. So let's stick to the apology in jest.

  6. Debrief: After the simulation, we discuss:

     - For each trouble case, map to Austin's distinctions:

       (a) Split addressee: The apology was recorded and thus performed. The refusal of one member does not undo the act. This shows that the illocutionary act (apology) is completed by the utterance and recording, regardless of perlocutionary effect (acceptance). Uptake: the committee members understood the apology (they reacted), but one didn't accept. Uptake (in Austin) is about understanding, not acceptance. So uptake occurred, but perlocutionary effect did not for one member.

       (b) Inscription-conditional: The debt is only incurred when recorded. The Chair's declaration alone is not enough. This shows that for declarations, the institutional context requires a written record. Without it, the act misfires (it is not completed). The misfire is because the procedure was not fully followed (the record is part of the procedure). If the Secretary records the wrong amount, then the act is performed but with the wrong content? Or is it a different act? This might be a misfire of a different kind? Austin distinguishes between misfires (the act is void) and abuses (the act is performed but insincere). Here, the act is performed but with an error? The minute book is authoritative, so the debt is $400 even if the resolution was for $500. This shows that the act is defined by the record, not the intention.

       (c) Ventriloquized authority: If the rule requires the Chair to utter the words and the Secretary reads them, then the act might not be performed (if the group rules that way). This shows that the act requires the right person to perform it. If the wrong person does it, it's a misfire. If the Chair's voice is required and not provided, then the act doesn't happen. This highlights the importance of the speaker's identity and the embodiment of the act.

       (d) Hollow act: The insincere apology is still recorded and official. This is an abuse (in Austin's terms) because the act is performed but insincere. In the simulation, we don't care about sincerity, so the act is successful. This distinguishes between the act being performed (illocution) and the speaker's state (perlocutionary).

     - Your friend's claims:

       1. "I promise" differs from "I will" only in conventional perlocutionary effect.

          Breaks: In the hollow apology, the apology was performed even though the perlocutionary effect (reassurance) might not occur. The act itself changes the institutional reality (recorded apology). Similarly, in the debt resolution, the declaration creates a debt regardless of perlocutionary effect. For promises, the act of promising creates an obligation, not just a state of mind. In the simulation, the apology and the debt are institutional facts, not just psychological effects.

          Escape: Your friend might say that the effect is on the institution (the minute book) and that's just a conventional effect. But the minute book is a public record, not a mental state. So it's not perlocutionary (which is about effects on feelings, attitudes, behavior). The illocutionary act is the creation of the institutional fact.

       2. Infelicity is just a failure of perlocutionary effect.

          Breaks: In the inscription case, the debt was not incurred because the Secretary didn't record. This is a misfire (infelicity) but not because the perlocutionary effect failed. The effect failed because the act wasn't completed. In the ventriloquism case, if the act isn't done, it's a misfire. These are not perlocutionary failures.

          Escape: Your friend might say that the perlocutionary effect is the change in the minute book? But the minute book change is part of the procedure, not an effect on someone's mind. So it's illocutionary.

       3. Uptake is just being understood.

          Breaks: In the split addressee, the committee members understood the apology (uptake occurred) but one didn't accept. The act was still performed. Uptake is necessary for the act? In Austin, without uptake, the act fails. In the ventriloquism case, if the Secretary didn't understand (but they did), it might not be recorded? But the rule doesn't say the Secretary must understand, only that they record. So uptake (understanding) might be separate. But in Austin, uptake is part of the illocutionary act.

          Escape: Your friend might say that the Secretary's understanding is necessary for recording? But we don't know. The simulation doesn't require understanding, only recording. But if the Secretary didn't understand, they might not record? Then the act fails. So uptake (understanding) is necessary? This is tricky. We can say: in the apology, if the committee didn't understand, would it still be recorded? Yes, because the Secretary records based on hearing the words, not on understanding. But the rules don't specify. We might avoid this.

     - Predictable problems:

          - Gaming the wording: A student might try to use exact wording to avoid an act. E.g., for the apology, the Chair says: "I express regret" instead of "apologize". Then the Secretary might not record because the formula wasn't used. So the act isn't done. The standing rules specify the formula. So it's a misfire. The prepared response: the Chair must use the exact words. If they don't, the act isn't done. This shows the importance of convention.

          - Collapsing to a vote: When there is a dispute, a student might move to vote on what to record. But the standing rules don't allow votes on what the Secretary records. The Secretary records based on what they observe. The minute book is not subject to vote. The prepared response: the standing rules say the Secretary is the recorder, and the minute book is authoritative. The group cannot vote to change the past. They can only correct errors by a formal motion? But we didn't provide for that. So the Secretary's record stands. This shows that the institutional fact is created by the record, not by consensus.

     - What the simulation cannot reproduce: The simulation focuses on institutional acts (declarations) and apologies (which might be exercitives or behabitives). But promises are commissives, and they are not necessarily institutional. The simulation might not capture the personal commitment of a promise (which doesn't require an institution). Also, the simulation cannot show the internal aspect of illocutionary acts (the intention to perform the act) because we exclude psychology. So we cannot discuss insincerity as an abuse in the same way. We have to explain that in life, outside institutions, promises create obligations without a minute book, and insincere promises are still promises but abusive.

  Final materials:

  - Standing rules handout (one per student)
  - Roles assignment (on index cards? or just announced)
  - Minute book (flip chart on the wall)
  - Agenda (on the whiteboard or handout)

  Run time: about 60-80 minutes for the meeting, plus 30-40 minutes debrief.

