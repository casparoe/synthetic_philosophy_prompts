   Step-by-Step:

   1. **Q1: Malicious intent?** 
      - Discuss: Was there any evidence of a deliberate harmful act by an operator or other employee?
      - If yes: Verdict OE (with note: malicious). Write rationale: "The incident was caused by a deliberate act by [operator]. This violates company policy and training." Stop.
