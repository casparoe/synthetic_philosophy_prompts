          This is tricky. We might need to accept that after Q2-Q4, we are in a gap. So we can skip Q5 and go straight to:

   6. **Question 6: Is there a causal responsibility gap? (No human was suitably connected)**
      - *Purpose*: Check if the incident occurred without any human having a reasonable opportunity to intervene.
      - *Evidence*: Timeline of events, system autonomy level, operator workload at the time.
      - *Sufficient answer*: The incident happened too quickly for human intervention, or the system did not provide the necessary information to the operator, or the operator was not reasonably expected to monitor that aspect.
      - *If yes*: Then we have a causal gap. Proceed to Q8 (GRG).
      - *If no*: Proceed to Q7.

   7. **Question 7: Is there an epistemic gap? (We cannot establish who, if anyone, failed)**
      - *Purpose*: Check if we lack the data to assign responsibility.
      - *Evidence*: Gaps in logs, conflicting accounts, unclear chain of events.
      - *Sufficient answer*: We cannot reconstruct what happened with enough certainty to assign responsibility to a specific person or team.
