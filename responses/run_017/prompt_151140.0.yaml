      - *Given the complexity, we might instead say*: If we find a specific human failure that passes the crumple and swap tests (i.e., they are the right person and a different person wouldn't have failed), then we assign **OE** or **UOF** (depending on the role). But if the swap test fails (i.e., others would have done the same) or the crumple check fails (they weren't the right person to prevent it), then we proceed to Q6.

