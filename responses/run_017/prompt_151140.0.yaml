      If we haven't assigned a verdict by Q5, then we go to:

   5. **Verdict: Genuine Responsibility Gap (GRG)**
      - This covers:
          - Causal gap (no human could have reasonably prevented it)
          - Epistemic gap (we don't know what happened)
