  ### Decision Tree: Social Discount Rate for Long-Term Projects  
  *Assume: Future benefits matter; funds can be invested at positive real returns; future welfare counts.  
  Each branch is a concrete case. Answer based on intuition or policy stance, not theory.*

  ---

  #### **Q1: Personal Future Discomfort**  
  You can endure 10 units of discomfort now to avoid 15 units of your *own* discomfort in 1 year. You are certain you'll exist then.  
  - **A**: Avoid less than 15 future units to justify 10 now (discount your future self).  
  - **B**: Avoid exactly 15 future units to justify 10 now (no discount).  
  *Recommended*: A (prudence allows self-discounting).  

  #### **Q2: Stranger's Future Discomfort**  
  You can endure 10 units of discomfort now to avoid 15 units of a *stranger’s* discomfort in 1 year. The stranger is similar to you and will exist.  
  - **A**: Avoid less than 15 future units to justify 10 now (discount stranger's future).  
  - **B**: Avoid exactly 15 future units to justify 10 now (no discount).  
  *Recommended*: B (no ethical basis to discount others' futures).  

  #### **Q3: Compensation for Past Harms**  
  Identical land seizures occurred 5 years ago and 300 years ago. The harm (e.g., lost value) was the same magnitude when it happened.  
  - **A**: Compensate less for the 300-year-old seizure (discount past harms).  
  - **B**: Compensate equally (no discount for time passed).  
  *Recommended*: B (harm magnitude doesn’t fade with time).  

  #### **Q4: Sea Wall Benefit in Year 200 (Certain Beneficiaries)**  
  A sea wall’s entire benefit (e.g., $1B in today’s value) occurs in year 200. Beneficiaries certainly exist, are identifiable, and are no richer than us.  
  - **A**: Value the benefit at full $1B today (no discount).  
  - **B**: Value it below $1B (discount for time alone).  
  *Recommended*: A (no ethical discount if existence/wealth controlled).  

  #### **Q5: Sea Wall with Extinction Risk (How to Record?)**  
  Same sea wall, but now a 1% annual chance exists that no beneficiaries will be alive in year 200 (e.g., human extinction).  
  - **A**: Add this risk to the discount rate (e.g., rate increases by 1%).  
  - **B**: Multiply the benefit by the survival probability (e.g., $1B × probability).  
  *Recommended*: B (risk is event probability, not time preference).  

  #### **Q6: Sea Wall Reduces Extinction Risk**  
  The sea wall itself cuts the extinction risk in half (by making society more resilient). Does this change your Q5 approach?  
  - **A**: No change: use the same method with unadjusted risk.  
  - **B**: Adjust survival probability upward to reflect reduced risk.  
  *Recommended*: B (projects affecting survival should alter probabilities).  

  #### **Q7: Benefit Includes New Lives**  
  A project creates 1,000 additional worthwhile lives and benefits 10,000 existing future people. All lives experience equal well-being.  
  - **A**: Count only benefits to the 10,000 existing people.  
  - **B**: Count benefits to all 11,000 lives.  
  *Recommended*: B (if lives are worthwhile, their welfare counts).  

  #### **Q8: Saving Rate Under Zero Discount + Growth**  
  With a 0% discount rate and 2% annual growth, future people are vastly richer. This implies saving >50% of current income for the future.  
  - **A**: Accept this high saving rate (future welfare dominates).  
  - **B**: Reject this rate (too burdensome on the present).  
  *Recommended*: B (avoids "dictatorship of the future").  

