answer: |-
  Here is the complete exam package tailored to your requirements:

  **(a) Exam Question**  
  *"Suppose we grant the existence of a perfectly reliable Calibrated Sentience Index (S), measuring a being's capacity for valenced experience at a time, where S=1.0 for a typical adult human, S≈0.02 for a honeybee, and S=0 for a domestic thermostat. Critically evaluate whether and how S determines moral status. In your answer, you must:*  
  *(i) Define the function mapping S (and any other necessary elements) to moral status, defending its shape (e.g., linear, threshold, etc.) against the challenge that small differences in S cannot justify large differences in status.*  
  *(ii) Explain why S alone is insufficient to determine ‘how much a being matters’ across different moral contexts (e.g., inflicting pain vs. killing), given how temporal depth, intensity, duration, and unity of experience can dissociate.*  
  *(iii) Account for why the thermostat (S=0) lacks moral status while conceding that your account may reintroduce a ‘cliff’ at the boundary of sentience.*  
  *(iv) State whether, on your view, many low-S beings (e.g., insects) can collectively outweigh the interests of one high-S being (e.g., a human), and argue whether this is distinct from the question of degrees of sentience per se."*  
  *(90 minutes; 1,200 words max; 20 marks)*

  **(b) Model Answer (698 words)**  
  The Calibrated Sentience Index (S) quantifies a being’s capacity for valenced experience, but translating this into moral status involves three distinct philosophical challenges: defining a mapping function, handling multidimensional dissociations, and confronting the boundary problem.  

  **First**, S must be mapped to moral status via a function incorporating other variables. Let moral status (M) be a function *f(S, C)*, where C represents context-dependent factors (e.g., species-typical needs). Crucially, *f* cannot be linear without absurdity: if M scales linearly with S, causing 50 bees S≈0.02 pain equivalent to stubbing a human’s (S=1.0) toe would require only 1/50th the pain duration—a conclusion violating intuitive moral asymmetries. A threshold function (e.g., M=0 if S<k, M=S if S≥k) avoids this but succumbs to Sorites problems: if S=0.10 lacks moral status but S=0.11 has full status, a 0.001 difference creates a moral cliff. A *diminishing returns* function best reconciles continuity and asymmetry: M = S^a (where a>1). Here, small S increases yield tiny M gains (e.g., a=2: S=0.02→M=0.0004), preventing insects from easily aggregating to human significance, while avoiding sharp thresholds. Status differences are large but not binary.  

  **Second**, S is a scalar, but valenced experience is multidimensional. S measures capacity at a time, yet moral weight depends on *what is done to the being*. Inflicting pain depends on intensity (I) and duration (D)—so suffering-weight may be I×D×S. Killing, however, depends on temporal depth: a being with foresight and rich future-directed desires (F) suffers greater loss. Thus, harm-weight may be S×F×D (where D is life expectancy). Unity matters too: a fragmented mind (e.g., octopus ganglia) may experience localized pain without integrated suffering, reducing wrongness of disabling one limb. S alone cannot answer "how much this being matters" because:  
  - *Pain imposition*: Weight ≈ S × Intensity × Duration  
  - *Killing*: Weight ≈ S × Future Temporal Depth × Coherence of Self  
  - *Use as resource*: Weight ≈ S × Capacity for Frustration/Deprivation  
  The same S-value yields divergent moral weights across contexts. A bee (low S, minimal F) warrants little restraint in killing but significant restraint in causing prolonged suffering.  

  **Third**, the thermostat (S=0) exclusion requires an additional necessary condition: *subjecthood* (being a locus of experience for whom valenced states *matter intrinsically*). Valence must be non-informational (e.g., pain as bad *in itself*, not merely signaling damage). This introduces a cliff: S>0 + subjecthood grants status; S=0 or non-subject denies it. However, this cliff applies only to the *presence* of status—not its *degree*. Subjecthood is binary, but once present, M varies gradually with S. The cliff is philosophically tolerable: moral status plausibly requires some experiential "light" to be on. Crucially, *gradualism operates above zero*: a being with S=0.001 and subjecthood has negligible but non-zero M, avoiding another cliff.  

  **Finally**, aggregation turns on the function’s curvature. Under M=S^2, aggregating low-S beings is exceedingly hard: 2,500 bees (S=0.02, M_agg ≈ 2,500 × 0.0004 = 1.0) might theoretically equal a human (S=1.0, M=1.0) in suffering-weight, but this ignores context. For pain, if bee suffering duration/limits differ, aggregation may fail practically. Crucially, aggregation is distinct from degrees: one addresses *many-beings-one-harm*, the other *one-being-many-harms*. A gradualist S can reject summation if M’s function is steeply curved or if harm-types are incommensurate.  

  S informs but does not dictate moral status. A defensible account requires: a non-linear mapping function, context-sensitive multidimensional weighting, a subjecthood condition that creates a minimal cliff but permits gradualism above zero, and aggregation rules derived from—not conflated with—the degree of S itself.  

  **(c) Mark Scheme (20 marks total)**  
  **Must-hit moves (5 marks each):**  
  1. **Articulate & defend the function shape** (5 marks):  
     - *Award:* 3 for defining f(S) (e.g., exponential, threshold), 2 for defending against Sorites/linearity.  
     - *Common error:* Asserting linear M=S without addressing counterintuitive aggregation.  

  2. **Explain multidimensional dissociation** (6 marks):  
     - *Award:* 2 for listing >2 dissociable dimensions (e.g., duration, foresight), 4 for tying them to moral contexts (pain/killing/etc.).  
     - *Common error:* Noting dimensions exist but failing to show why "moral weight" is context-relative.  

  3. **Handle the thermostat & cliff** (4 marks):  
     - *Award:* 2 for excluding thermostat via subjecthood/intrinsic valence, 2 for conceding/clarifying the minimal cliff.  
     - *Common error:* Claiming gradualism avoids all cliffs or that S>0 alone suffices (thermostat excluded arbitrarily).  

  4. **Address aggregation & distinguish from degrees** (3 marks):  
     - *Award:* 1 for position on summation, 2 for explaining its separateness (e.g., "function curvature ≠ S itself").  
     - *Common error:* Treating aggregation as identical to the question of gradual moral weight per individual.  

  5. **Avoid red herrings** (2 marks):  
     - *Deduct 2* if discussing measurement uncertainty, expected value over populations, or insect sentience skepticism.  

  **(d) A vs. B Differentiation**  
  - **B Answer (Competent):** Covers all 5 moves clearly, defends a function (e.g., threshold), notes context matters, excludes thermostat, addresses aggregation.  
  - **A Answer (Excellent):** **Explicitly demonstrates how multidimensionality fractures the concept of ‘moral status’ itself**, arguing that status is not a unitary scalar but a set of context-specific weights (e.g., "status-for-suffering ≠ status-for-killing"). This move (often in Move 2) shows deep understanding that S’s insufficiency necessitates rethinking status as a vector, not a degree on a line.
