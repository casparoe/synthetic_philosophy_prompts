  Looking deeper, the user might need to present a balanced view in their article, addressing both legal principles and practical realities. They might be seeking ways to counter the "victors' justice" dismissal with structured arguments. The historical context of Nuremberg and Tokyo is relevant, but they need a framework applicable to modern cases. They might also want to highlight the tension between justice and political power, especially in transitions from dictatorship or international tribunals.

