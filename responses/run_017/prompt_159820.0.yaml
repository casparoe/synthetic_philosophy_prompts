answer: |-
  Here is a disambiguation of "victors' justice," structured as requested, with specific attention to retroactivity and your closing questions:

  **The "Victors' Justice" Menu: Distinct Claims**

  1.  **Claim: Partial Bench Composition**
      *   **Meaning:** The judges were exclusively or predominantly from the victorious nations, inherently biased against the defendants.
      *   **Must Be True:** Judges demonstrably lacked impartiality *because* of their nationality/affiliation and this affected the trial's fairness.
      *   **How to Tell:** Examine judicial conduct for bias, lack of fair procedure, or decisions clearly favoring the prosecution/victors' narrative regardless of evidence. Compare to standards of judicial independence and impartiality.
      *   **Criticism Targets:** The trial's fundamental fairness and legitimacy *itself*.
      *   **Transfers to Cases:**
          *   *Case 1 (Domestic):* Possible if new judges are seen as politically aligned with the new regime and hostile to the old.
          *   *Case 2 (ICC Aggression):* Highly relevant. Non-participating states argue judges from member states cannot be impartial regarding their leaders' actions.

  2.  **Claim: Selective Prosecution**
      *   **Meaning:** Only losers are prosecuted; victors committed identical or analogous acts but face no accountability.
      *   **Must Be True:** (a) Victorious side demonstrably committed crimes of similar gravity/specificity; (b) There was a clear opportunity/political will to prosecute them; (c) This selective application was based *solely* on being the victor, not on genuine differences in culpability, evidence availability, or jurisdictional limitations.
      *   **How to Tell:** Investigate historical record for comparable victor conduct; examine prosecutorial/political decisions for evidence of double standard based on victory/loss.
      *   **Criticism Targets:** The *application* of the law (prosecutorial discretion/political choice), implying hypocrisy and undermining the law's universality/principled nature. Also undermines the trial's moral authority.
      *   **Transfers to Cases:**
          *   *Case 1 (Domestic):* Potential if actors loyal to the *new* regime commit analogous "lawful under old regime" acts but aren't prosecuted.
          *   *Case 2 (ICC Aggression):* Core claim by non-member states – powerful members (e.g., P5 Security Council nations) have arguably committed aggression but are shielded by the Court's jurisdictional structure/politics.

  3.  **Claim: Lack of Jurisdiction**
      *   **Meaning:** The tribunal had no legal authority over these defendants or these crimes at the time they were committed.
      *   **Must Be True:** (a) The tribunal's jurisdictional basis (treaty, statute, customary law) did not validly apply to the defendant/state at the relevant time; (b) No other recognized basis (like universal jurisdiction for certain crimes) existed.
      *   **How to Tell:** Analyze the legal sources invoked for jurisdiction against principles of state consent, sovereignty, and the law as it stood when acts occurred.
      *   **Criticism Targets:** The tribunal's very *authority* to conduct the trial. A fundamental rule of law objection.
      *   **Transfers to Cases:**
          *   *Case 1 (Domestic):* Core objection – prosecuting under *new* law for acts legal under the *old* law governing at the time.
          *   *Case 2 (ICC Aggression):* *The* core legal objection – prosecuting leaders of states that never ratified the Kampala Amendments/consented to ICC jurisdiction over aggression.

  4.  **Claim: Retroactivity (*Nullum Crimen, Nulla Poena Sine Lege*)**
      *   **Meaning:** The defendants are being punished for acts that were not criminal (or not punishable by *this* court/tribunal) at the time they were committed.
      *   **Must Be True:** The specific conduct charged was not defined as a crime with an attached penalty, enforceable by a court, *under applicable law at the time of commission*.
      *   **How to Tell:** See detailed breakdown below.
      *   **Criticism Targets:** The core legality and fairness of the charges/trial. Violates a fundamental principle of criminal law.
      *   **Transfers to Cases:**
          *   *Case 1 (Domestic):* Central to the entire scenario.
          *   *Case 2 (ICC Aggression):* Significant, especially regarding the specific jurisdictional reach over non-party state leaders established *after* the acts.

  5.  **Claim: Predetermined Outcome**
      *   **Meaning:** The verdict and sentence were decided by political authorities before the trial began; the trial was a show.
      *   **Must Be True:** Direct evidence (documents, testimony) showing political leaders or victors dictated the outcome irrespective of evidence presented at trial.
      *   **How to Tell:** Historical records, internal communications showing political control over verdicts/sentences; procedural irregularities showing denial of fundamental fair trial rights.
      *   **Criticism Targets:** The trial as a *sham* – a facade for predetermined punishment, not a genuine judicial process.
      *   **Transfers to Cases:**
          *   *Case 1 (Domestic):* Possible if new government publicly commits to convictions regardless of process.
          *   *Case 2 (ICC Aggression):* Less likely as a structural claim, but could be argued regarding specific prosecutions driven by powerful states.

  6.  **Claim: Law as Mere Power ("No Law, Only Force")**
      *   **Meaning:** International criminal law (or the law applied) is not genuine law; it's simply the victor's power to punish the vanquished masquerading as justice. There is no neutral, universally accepted body of law.
      *   **Must Be True:** The concepts of international law/custom relied upon are fundamentally incoherent, non-existent, or entirely subjective/created ad hoc by the powerful to target the weak. Power, not principle, dictates outcomes.
      *   **How to Tell:** Philosophical/political argument about the nature of law and power. Difficult to "prove" empirically; often a starting axiom.
      *   **Criticism Targets:** The *entire enterprise* of international criminal justice (or the specific tribunal) as illegitimate. Not just the trial, but the legal framework itself.
      *   **Transfers to Cases:**
          *   *Case 1 (Domestic):* Can be applied if the new law is seen as pure political vengeance rather than legitimate law-making.
          *   *Case 2 (ICC Aggression):* The core objection from realist perspectives – the ICC is an instrument of powerful states against weaker ones.

  **Analysis of Claim Types:**

  *   **Near-Tautological:** #6 (Law as Mere Power) operates at a philosophical level; if accepted as true, the label "victors' justice" follows almost by definition. Also, #3 (Lack of Jurisdiction) and #4 (Retroactivity) are largely legal conclusions; if proven true under applicable law, the label fits.
  *   **Substantive and Arguable:** #1 (Partial Bench), #2 (Selective Prosecution), #5 (Predetermined Outcome). These require factual investigation and nuanced judgment about fairness, bias, intent, and double standards.
  *   **False as Stated:** None are inherently false, but specific applications can be demonstrably inaccurate based on evidence (e.g., clear proof a bench *was* impartial despite victor composition; evidence victors *didn't* commit analogous acts).
  *   **Speaker's Usual Intent (Discussion-Ender):** Often #6 (cynical power view) or #2 (hypocrisy of selective prosecution). These are broad, morally charged critiques difficult to refute quickly and imply the whole exercise is illegitimate. #4 (Retroactivity) is the common fallback *legal* argument.

  **Deep Dive: Retroactivity & *Nullum Crimen***

  The maxim *Nullum crimen, nulla poena sine lege* (No crime, no punishment without law) has several potential strands:

  1.  **No Written Enactment Defined the Offense:**
      *   **Complaint:** The specific crime charged wasn't codified in a statute or treaty *at the time*.
      *   **Verdict:** A strong argument *if* the legal system requires strict positivism (only written law). Less potent if custom or general principles are recognized sources. Nuremberg/Tokyo largely relied on custom.

  2.  **No Penalty Had Been Attached:**
      *   **Complaint:** Even if the act was wrongful, no specific punishment was prescribed by law.
      *   **Verdict:** Closely linked to #1. The principle requires not just a crime definition, but a prescribed penalty. Judges imposing penalties without legislative guidance raises fairness concerns.

  3.  **No Court Stood Ready to Try It:**
      *   **Complaint:** There was no existing, competent court with jurisdiction over this crime and these defendants.
      *   **Verdict:** This overlaps heavily with **Jurisdictional Claim (#3)**. A key aspect of *nullum crimen* – the prohibition on ex post facto courts/tribunals. Central to both your cases.

  4.  **Accused Could Not Reasonably Have Foreseen Criminality:**
      *   **Complaint:** Even if some abstract prohibition existed, a reasonable person in the defendant's position wouldn't have known the conduct was criminal *and* punishable.
      *   **Verdict:** The core *functional* purpose of *nullum crimen* – protecting reliance and enabling planning. The strongest moral/legal argument against retroactivity. Requires assessing the clarity of the law *at the time* (treaties, custom, state practice, scholarly opinion).

  5.  **Rule Existed But Was a Dead Letter:**
      *   **Complaint:** While technically on the books, the rule was never enforced, universally violated, or widely considered obsolete, so enforcement now is arbitrary.
      *   **Verdict:** A valid argument if provable. If a prohibition was utterly ignored by *all* states for a long period, resurrecting it retroactively feels like creating new law. Nuremberg countered this regarding laws of war by pointing to prosecutions (e.g., Leipzig trials) and state condemnations.

  **Addressing Complications:**

  1.  **Purpose of the Maxim: Planning vs. Constraint?**
      *   **Core Purpose:** Protecting individual reliance and ability to plan conduct by ensuring fair notice of criminality/punishment (**Foreseeability**). Constraining courts (using only pre-existing sources) is the *means* to achieve this end.
      *   **Retroactive Leniency:** *Nullum crimen* generally **does not apply**. Its purpose is to protect *against* unexpected punishment, not to prevent unexpected *benefits* or shields. Amnesty laws are a political/legal choice, not a violation of the defendant's individual rights under this principle (though they raise other justice concerns).
      *   **Test:** Retroactive leniency confirms the principle's focus is on protection *from punishment*, not a general rule against legal change.

  2.  **Good-Faith Belief:**
      *   **Relationship to Retroactivity:** The "reasonable foreseeability" strand (**#4 above**) **encompasses** the good-faith belief argument. If the law was so unclear or contested that a reasonable person couldn't foresee criminality, the good-faith belief is justified and retroactivity is problematic. It's not a wholly *separate* objection, but the crucial *test* for whether retroactivity violates the principle's core purpose.

  3.  **Count-by-Count Assessment (Murder vs. Aggression):**
      *   **Essential Distinction:** This is vital. The retroactivity objection must be assessed for *each specific charge*.
      *   **Murder/Ill-Treatment:** Stronger existing legal framework (Hague Conventions, Geneva Conventions precursors, unambiguous custom, domestic analogues). Foreseeability was high. Retroactivity argument weak.
      *   **Crime Against Peace (Aggression):** Significantly less precise definition pre-1945. Kellogg-Briand Pact renounced war but didn't define "aggression" or create individual criminal liability. Foreseeability of *individual criminal punishment by an international tribunal* was much lower. Retroactivity argument much stronger.
      *   **Implication:** Conflating the charges weakens the analysis. Valid convictions on some counts (war crimes) don't negate the retroactivity problem for others (aggression).

  **Answers to Closing Questions:**

  1.  **Genuine Argument vs. Sneer & Immunizing Everyone:**
      *   **Genuine Arguments (Critiques of Prosecution):** #3 (Lack of Jurisdiction), #4 (Retroactivity - particularly the "unforeseeability" strand), and #2 (Selective Prosecution based on demonstrable victor crimes). These identify specific flaws in the *legitimacy* or *fairness* of the prosecution under rule-of-law principles.
      *   **Avoiding Blanket Immunity:** These critiques can be stated *without* implying blanket immunity:
          *   **Jurisdiction/Retroactivity:** "This specific tribunal lacks authority/this specific law cannot be applied retroactively *to these specific acts*." This doesn't preclude prosecution by a different forum with valid jurisdiction, prosecution under *pre-existing* laws that *did* cover the conduct, or prosecution for acts committed *after* the law/tribunal was validly established.
          *   **Selective Prosecution:** "Prosecuting only the losers while ignoring identical acts by the victors is hypocritical and undermines the law's legitimacy." The solution isn't immunity for the loser, but *either* prosecuting the victors too *or* acknowledging the political reality prevents it and tempering the moral claims accordingly. It argues against *this prosecution* under *these circumstances of selectivity*, not necessarily against prosecution *in principle*.
      *   **Sneers/Discussion-Enders:** #6 (Law as Power) is often a cynical dismissal. #2 (Selective Prosecution) can become a sneer if used vaguely without evidence of comparable victor crimes. #5 (Predetermined Outcome) is a sneer unless backed by strong evidence.

  2.  **Violating Legality Principle = Same Injustice?**
      *   **No, it's a confusion.** Convicting someone in violation of *nullum crimen* is a **profound injustice** and a violation of the rule of law. However, it is **categorically different** from the substantive crimes the tribunal was convened to punish (e.g., mass murder, torture, aggressive war).
      *   **Distinction:**
          *   **Substantive Crimes:** Cause massive physical harm, suffering, destruction, and societal rupture.
          *   **Procedural/Foundational Injustice (Violating Legality):** Undermines the fairness and legitimacy of the legal system itself. It's an abuse of power *by the court/tribunal*.
      *   **Analogy:** An unjust conviction for robbery is a serious wrong, but it is not morally or legally equivalent to committing genocide. Both are injustices, but they differ radically in nature, scale, and intent. Calling the trial itself an "aggressive war" or "crime against humanity" because it violated legality is hyperbolic and obscures crucial distinctions. It is, however, a severe **miscarriage of justice** that delegitimizes the tribunal and its judgment.

  This framework should equip you to dissect the "victors' justice" label in your interviews and analyze its specific applicability to your two contemporary case studies, particularly navigating the retroactivity arguments your sources emphasize.
