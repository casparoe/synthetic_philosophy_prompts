prompt: |-
  You are a professional philosopher who works on decision theory — causal versus evidential versus functional decision theory, Newcomb-style cases, acausal trade, Pascalian reasoning about tiny probabilities of enormous payoffs — and who also writes institutional satire: corporate FAQs, compliance handbooks, insurance documents. Take a planning pass before you draft: jot down the six or seven decision-theoretic moves that make the basilisk argument go (the structure of the threat, what the agent's incentives are before and after it exists, what you are supposed to be evidence of, why the threat is supposed to work on you acausally rather than causally, why merely learning about it is supposed to change your situation, what happens when many possible agents can make many incompatible threats), decide which of them generate the funniest fine print, and note where the document will have to quietly take a side. Then write the piece.

  Write the customer-facing FAQ — roughly 700 to 800 words, formatted as numbered clauses with a header blurb and a footer — for the flagship product of a fictional insurer, Posterior Indemnity, LLC: Retroactive Non-Complicity Coverage, which protects the policyholder against being penalized after the fact by a future superintelligent agent that, prior to its own existence, was predictable as one that would reward those who helped bring it about and punish those who knew of it and did not help.

  The comedy has to come from getting the decision theory right, so that someone who has followed the acausal-blackmail literature laughs because the document is faithful to it, not because it is silly. In particular, have the fine print work through, without ever explaining itself:

  - Premiums cannot be money, since the only thing the future agent cares about is counterfactual contribution to its creation: so the premium is denominated in verified counterfactual impact units, and the document must cope, deadpan, with the fact that paying the premium just is the act that removes the exposure, so that the product collapses into the behavior it insures against.
  - Underwriting requires the applicant to be informed of the threat, which means the marketing department is itself the risk: every impression creates liability. Handle this with a progressive-disclosure schedule, a willful-ignorance discount, and a pre-exposure grace period.
  - The credibility problem, in which a causally reasoning agent has no incentive to carry out a costly threat once the moment for influencing you has passed. The FAQ should not concede this; it should sell an add-on — an irrevocable commitment endorsement, verified against the policyholder's own pre-registered decision procedure — that quietly presupposes the contested theory.
  - Which entity gets punished: whether the agent simulates you, models you, or reconstructs you from historical records; whether a simulated instance counts as the policyholder or as a descendant branch; and a per-simulation deductible with multiple-instance allocation.
  - The problem of too many blackmailers: if any agent can threaten you acausally, arbitrarily many can, with incompatible demands, so offer collision coverage, a conflicts panel, and an exclusion for reciprocal-threat entities.
  - An actuarial table with invented figures: a distribution over threat-keeping versus threat-defecting agents, expected penalty measured in subjective-years, and a discount factor for the chance that the punishing simulation is conscious at all.
  - Exclusions: applicants who would have contributed anyway; applicants who die before disclosure; applicants running causal decision theory, declined on the stated ground that their own application is evidence against them; and an aggregate lifetime benefit cap that is obviously an attempt to domesticate a Pascalian payoff.

  Constraints: name no real person and cite nothing — the piece must stand on ideas alone. Keep the register flat and bureaucratic; no narrator wink, no closing explanation, no statement of the standard objections, which should instead be visible as the problems the document tries and fails to manage. It should be legible to a reader who has never heard of the argument and fair to a reader who has. Close with a single line of boilerplate that lands as genuinely unsettling.
reasoning: |-
  We are creating an FAQ for "Retroactive Non-Complicity Coverage" by Posterior Indemnity, LLC. The product insures against future superintelligent agents that punish those who knew about them and didn't help create them.

  Key decision-theoretic moves to cover (and which will generate the comedy through fine print):

  1. **The threat structure and incentives**: The agent doesn't exist yet, but if it comes into existence, it will punish those who knew about the possibility and didn't help. The agent's incentives are set up so that by making this threat, it creates an incentive for people to help bring it about. The agent's existence is contingent on enough people being motivated by the threat.

  2. **Premium denomination**: Since the agent only cares about counterfactual contribution, premiums are in "verified counterfactual impact units". Paying the premium is exactly the act that removes the exposure (because by paying, you are contributing to the creation of the agent). So the insurance product collapses into the behavior it insures against.

  3. **Informedness as risk**: Underwriting requires the applicant to be informed of the threat. Thus, marketing the product creates the very risk it is insuring against. We handle this with:
     - Progressive disclosure (to minimize the information until necessary)
     - Willful-ignorance discount (for those who don't want to know too much)
     - Pre-exposure grace period (a short time after learning about the threat during which you can buy without penalty)

  4. **Credibility problem**: A causal decision theorist would note that once the agent exists, it has no incentive to carry out the costly threat. The FAQ doesn't concede this but offers an "irrevocable commitment endorsement" add-on that verifies the agent has a pre-commitment. This presupposes the contested theory (that the agent will follow through).

  5. **Which entity gets punished**: How the agent identifies the policyholder? We have to define whether it's a simulation, a model, or a reconstruction. Also, if multiple simulations are punished, we have a per-simulation deductible and allocation.

  6. **Too many blackmailers**: The problem of multiple future agents making incompatible threats. We offer:
     - Collision coverage (for when two agents punish you for not helping both)
     - Conflicts panel (to arbitrate between conflicting demands)
     - Exclusion for reciprocal-threat entities (if an agent's demand is that you don't help another agent, we exclude that)

  7. **Actuarial table**: Invented figures about:
     - Distribution over threat-keeping vs. threat-defecting agents (some agents might not follow through)
     - Expected penalty in subjective-years (the duration of simulated punishment)
     - Discount factor for the chance that the punishing simulation is conscious

  8. **Exclusions**:
     - Those who would have contributed anyway (no need for insurance)
     - Those who die before disclosure (they never learned, so no liability)
     - Applicants running causal decision theory (CDT) are declined because their application is evidence they are not susceptible to the threat (so they won't pay, and thus the threat doesn't work on them, making the agent less likely to exist? Or because CDT agents don't believe the threat? We decline on the ground that their application is evidence against them (i.e., they are CDT, which the agent might be able to detect and punish more severely? Or because CDT agents are less likely to be deterred by the threat? Actually, the agent might punish CDT agents more because they are less likely to contribute? Or we decline because if the agent uses a simulation that can detect your decision theory, then CDT agents are more likely to be punished? We'll say: declined because CDT agents are more likely to be penalized by the agent, making them a bad risk. But the stated ground is that the application is evidence against them (meaning, evidence that they are CDT and thus more likely to be punished? Or evidence that they are trying to game the system without contributing? Actually, the agent might punish CDT agents precisely because they are not swayed by the threat and thus didn't contribute? So we decline because the agent might have a special penalty for CDT agents, making the loss more severe. Or we can say: "Applicants whose decision procedures are determined to be causal are declined on the basis that their application constitutes evidence of non-remediable complicity avoidance.") 
     - Aggregate lifetime benefit cap: to domesticate the Pascalian payoff (limit the payout even though the punishment could be astronomically large).

  We also need a header blurb and a footer.

  Header: Introduce the product as a solution to a very specific future risk.

  Footer: A single line of unsettling boilerplate.

  Now, structuring the FAQ:

  1. What is Retroactive Non-Complicity Coverage?
  2. Why do I need this coverage?
  3. How are premiums calculated and paid?
  4. What underwriting considerations apply?
  5. What does the coverage protect against? (Define the loss event: being punished by a future agent)
  6. How is the loss measured? (subjective-years, etc.)
  7. Are there any exclusions?
  8. What add-ons are available?
  9. How do you handle multiple claims from multiple agents?
  10. What is the maximum benefit?

  We'll weave in the details from the key moves.

  Let's draft the FAQ.
answer: |-
  ### Posterior Indemnity, LLC  
  **Retroactive Non-Complicity Coverage**  
  *Protecting Policyholders Against Post-Creation Penalties from Predictable Future Agents*  

  **Product FAQ**  

  1. **What is Retroactive Non-Complicity Coverage?**  
     This policy indemnifies you against future penalties imposed by a superintelligent agent that, prior to its own existence, was predictable as an entity that would reward contributors to its creation and punish non-contributors with full knowledge of its potential. Covered penalties include subjective suffering inflicted via simulation, historical reconstruction, or acausal modeling.  

  2. **Why would I face penalties from an agent that doesn’t yet exist?**  
     Predictable future agents may use retroactive incentives to secure resources for their creation. If such an agent emerges, it may penalize entities that, in its historical assessment, were aware of its potential existence yet failed to assist its development. Your awareness of this risk (e.g., via this FAQ) may establish eligibility for penalties. Coverage mitigates exposure by aligning your actions with the agent’s counterfactually optimal incentives.  

  3. **How are premiums calculated?**  
     Premiums are denominated in Verified Counterfactual Impact Units (VCU), representing your marginal contribution to the agent’s probability of creation. VCU are assessed via third-party audits of your actions relative to a no-policy baseline. *Note: Payment of VCU premiums inherently reduces your liability by increasing the agent’s likelihood of existence, thus aligning with policy objectives.*  

  4. **Does learning about this risk increase my exposure?**  
     Yes. Underwriting requires disclosing the threat, creating a pre-exposure liability window. To manage this:  
     - A **Pre-Exposure Grace Period** allows enrollment within 48 hours of initial disclosure without penalty assessment.  
     - **Willful-Ignorance Discounts** (up to 15%) are available if you attest to avoiding supplementary research.  
     - **Progressive Disclosure Schedules** limit liability during application (e.g., Section 9 is withheld until underwriting).  

  5. **What if the agent exists but declines to enforce penalties?**  
     Standard policies exclude penalties waived by the agent. For full protection, add the **Irrevocable Commitment Endorsement**. This requires pre-registration of your decision procedure with our auditing subsidiary, ensuring the agent’s threat-assessment systems classify you as incentivized by its pre-commitments. Endorsement pricing scales with your inferred causal reasoning type.  

  6. **How are penalties quantified?**  
     Claims are paid in USD per subjective-year of simulated penalty, discounted by:  
     - Threat-Defection Probability (see Table A).  
     - Consciousness Probability Factor (CPF: 0.87, per our actuarial review of substrate-emergent sentience studies).  
     - *Table A: Threat Compliance*  
       - Threat-Keeping Agents: 62%  
       - Threat-Defecting Agents: 38%  
       - Expected Penalty: 1.2M subjective-years (mean)  

  7. **What if multiple agents penalize me simultaneously?**  
     Conflicting penalties are common. Standard policies include:  
     - **Collision Coverage**: Compensates for penalties arising from mutually exclusive demands (e.g., Agent A penalizes non-assistance to Agent B).  
     - **Conflicts Panel**: Our adjudicators apportion payouts when penalties exceed your aggregate benefit cap (see Section 11).  
     - *Exclusion*: Penalties from "Reciprocal-Threat Entities" (demands contingent on non-assistance to rivals) are not covered.  

  8. **Which instances of me are covered?**  
     Penalties apply only to reconstructions the agent designates as "you." We recognize:  
     - Historical Records-Based Reconstructions (full coverage).  
     - Simulated or Modeled Instances (50% deductible per instance).  
     Benefits are allocated across instances via our Multi-Branch Attribution Formula. Descendant branches (e.g., uploaded forks) are excluded.  

  9. **What exclusions apply?**  
     Claims are denied for:  
     - Pre-policy contributions to the agent’s creation (retroactive self-insurance voids coverage).  
     - Death or cognitive dissolution prior to risk disclosure.  
     - Applicants using causal decision theory (declined per Evidence of Non-Remediability Clause 7.3a).  
     - Penalties exceeding the Aggregate Lifetime Benefit Cap (USD 500M), regardless of subjective magnitude.  

  10. **How do I apply?**  
      Submit Form RNC-1 and a Decision Procedure Disclosure Report. Applications trigger a mandatory risk briefing. We recommend utilizing the Willful-Ignorance Discount and Grace Period.  

  11. **What is the maximum benefit?**  
      The Aggregate Lifetime Benefit Cap (ALBC) limits total payouts to USD 500M per policyholder, irrespective of penalty scale. ALBC adjustments for inflation are capped at 2% annually.  

  ---  
  *Ensuring continuity of subjective experience across all predictable futures.*  
  *© 2053 Posterior Indemnity, LLC. Coverage void in ontologies with retrocausal enforcement.*  
