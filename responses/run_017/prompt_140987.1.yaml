prompt: |-
  I convene a standing committee that issues one-page joint public statements on behalf of a city-wide coalition: three neighborhood associations, a hospital, a school district, and two labor unions, nine votes in total, each with an effective veto. We meet for two hours a month, our drafts go past a lawyer but not a philosopher, and the finished text is read aloud at press conferences and quoted in local news, so it has to be intelligible to a reader with no training and short enough to fit on a single page. Our recurring failure mode is not that members are unreasonable but that on nearly every topic — a new homeless shelter, a school closure, a police shooting, a chemical plant's emissions permit, a donor's name on a hospital wing — each delegate arrives with a sentence the others experience as a flat falsehood, and we either deadlock, or we paper over the disagreement with vague compromise language that the local paper mocks and that none of the member organizations actually endorses. I have been reading about the Jain doctrine of many-sidedness in a survey course — anekāntavāda, the standpoint-relative theory of nayavāda, and the logical instrument of syādvāda with its sevenfold scheme of conditional predication, where a given predicate can hold of a subject in one respect, fail in another, hold and fail successively under two respects, or be inexpressible when both are pressed into a single assertion, and combinations of these — and I want to know whether it can be turned into something my committee can actually run rather than admire.

  What I need is a procedure: the questions to ask, in order, about a contested claim; what counts as a sufficient answer to each; where the procedure terminates in a flat assertion; and where it hands the decision to a person because the question is one of values rather than of aspects. Please build it around a few concrete mechanisms I have been sketching and tell me if they are the right ones. First, a standpoint ledger: for each disputed sentence, name the respect — whose interests, what time scale, what comparison class, what part or aspect of the subject — under which each delegate's claim is true, and require that a claim be marked unattached when no one can produce a respect under which it holds, since I suspect a good half of our disputes are claims whose speakers have simply never been asked to say in what respect. Second, an explicit sorting step that runs before the ledger, because my worry is that we would apply many-sidedness to disagreements that are not aspectual at all: some of our disputes seem to be straightforwardly empirical and should be settled by asking for a number and a baseline, some are disputes about the sense of a single word (safe, harm, community, consent) that should be settled by disambiguation, and only the remainder are genuine cases where incompatible claims are each correct from a defensible standpoint. Third, a collapse rule: a test for when the qualified, sevenfold treatment must collapse back into a plain, unhedged assertion, including the case where a delegate's claim rests on a factual falsehood that the rest of us can refute, and the harder case where the standpoint a claim is true from is itself one we should refuse to adopt — a claim true only from the perspective of someone who denies another party's standing or personhood. Fourth, a set of drafting rules for what a signed statement may look like when many-sidedness genuinely survives: whether we conjoin qualified claims, whether we attribute each claim to the party who holds it, whether we assert in a respect that is nobody's in particular, how we say in one page that a thing is and is not without looking evasive to a reader who has never heard of the doctrine, and above all how a non-absolutist description gets converted into a recommendation, since our statements almost always end in a request for some action and the reader will not accept a sevenfold answer to the question of whether the shelter should open.

  Please also flag, honestly, what this procedure cannot do and where judgment cannot be eliminated: my vice-chair's objection is that any method built on inexpressibility is a license for weasel wording, and my own is that the whole apparatus may just be relativism with better manners, or the journalistic habit of quoting both sides with an Indian vocabulary attached, and I would like the procedure to contain its own guards against those failure modes rather than trusting the goodwill of the drafter. Then run it on three of our pending items. The first: a statement on a drop-in center for homeless residents, where the neighborhood association says the area has become unsafe, the service providers say it has not, and the police have published three years of incident data that neither side has looked at. The second: a statement on whether to remove a benefactor's name from a hospital wing, where one faction's sentence is that he was the greatest friend this city ever had and the other's is that he was a segregationist who enriched himself through discriminatory lending — a case that looks to me like the textbook illustration, two true predicates about one man, except that we still have to vote on taking the name down. The third is the one I expect to dislike: a member organization is pressing us to say in the joint statement that a contested public-health question is genuinely open, when the relevant scientific bodies are not in fact divided, and I suspect the correct output of your procedure is either a statement that names that claim as false or no statement at all, which will cost us a signatory. What I want is the procedure, its failure modes, and those three worked applications, written so that a committee with no philosophical training could follow it in two hours.
reasoning: |-
  We are going to design a procedure based on Jain logic (anekāntavāda) for a committee that issues joint public statements. The goal is to resolve disputes that arise from different perspectives (standpoints) and produce clear, one-page statements that avoid vague compromises and are intelligible to the general public.

  The procedure will have the following steps:

  1. **Sorting Step**: Classify the disagreement into one of three types:
     - **Empirical Disagreement**: Dispute about facts that can be resolved by data (e.g., numbers, baselines).
     - **Semantic Disagreement**: Dispute about the meaning of a word or concept (e.g., "safe", "harm").
     - **Aspectual Disagreement**: Dispute arising from different perspectives (standpoints) where both claims can be true in some respect.

  2. **Resolution by Type**:
     - For **Empirical Disagreements**: Ask for data. If data is available and conclusive, use it to settle the claim. If not, either table the issue until data is obtained or note the uncertainty in the statement (with a clear explanation of the data gap).
     - For **Semantic Disagreements**: Disambiguate the term. Define the term in the context or use more precise language. Avoid ambiguous terms in the final statement.
     - For **Aspectual Disagreements**: Proceed to the Standpoint Ledger.

  3. **Standpoint Ledger**:
     - For each contested claim, ask the delegate who proposed it: "In what respect (or from what standpoint) is this claim true?"
     - The respect must be concrete (e.g., "from the perspective of short-term business impacts", "in terms of immediate physical safety", "for the long-term health of the community").
     - Record the respect for each claim. If a delegate cannot provide a respect, mark the claim as "unattached". Unattached claims are not included in the statement unless they can be rephrased or supported later.

  4. **Collapse Rule**: Determine when a qualified (many-sided) claim must collapse to a plain assertion or be rejected.
     - **Factual Falsehood**: If a claim is based on a fact that is demonstrably false (e.g., contradicted by verified data), then it is rejected. The claim is removed from consideration.
     - **Unacceptable Standpoint**: If the respect (standpoint) from which a claim is true is itself unacceptable (e.g., it denies the personhood or rights of a group), then the claim is rejected. The committee must vote on whether a standpoint is unacceptable (by simple majority? but note: each member has a veto). However, because of the veto, if any member objects to the rejection of a standpoint, the claim might have to be included with an explicit attribution (see drafting rules) or the statement might not be issued. This is a critical point.

  5. **Drafting Rules for Many-Sided Assertions**:
     - When multiple qualified claims are true from different standpoints, the statement should:
       - **Conjoin with Qualifications**: Use phrases like "from the perspective of X" or "in terms of Y".
       - **Attribute to Sources**: If necessary, attribute the claim to the group that holds it (e.g., "Neighborhood residents report feeling unsafe, while service providers note no increase in crime incidents").
       - **Use Neutral Respects**: When possible, frame the standpoint in neutral terms (e.g., "in the short term" vs. "in the long term") rather than naming the group.
       - **Avoid Inexpressibility**: Do not use the more complex forms of syādvāda (like "inexpressible") in public statements. Instead, focus on the clear respects.
     - For converting to a recommendation:
       - Acknowledge the different aspects, then base the recommendation on shared values or a higher standpoint (e.g., "Given the immediate need for shelter and the long-term benefits of stable housing, we recommend..."). If no shared standpoint exists, the recommendation may have to be deferred or the statement might not include one.

  6. **Guards Against Failure Modes**:
     - **Weasel Wording**: Ensure that every qualified claim is tied to a concrete respect. Avoid vague qualifiers like "some say" without specifying the respect. The standpoint ledger forces specificity.
     - **Relativism**: The procedure does not say that all claims are equally valid. It rejects claims that are factually false or from unacceptable standpoints. The goal is to find the respects in which claims are true and then build a shared understanding.

  7. **Limitations**:
     - **Veto Power**: If a member insists on an unattached claim or an unacceptable standpoint, the committee may deadlock. The procedure cannot force a member to abandon a claim without a respect or to accept the rejection of their standpoint. In such cases, the statement may not be issued.
     - **Complexity**: The sevenfold scheme (syādvāda) might be too complex for public statements. We will use only the core idea of standpoint relativity without the full logical apparatus.
     - **Time Constraints**: The procedure must be completed in two hours. This might require strict timekeeping and pre-meeting preparation (e.g., distributing data).

  Now, let's run the procedure on the three examples:

  **Example 1: Drop-in center for homeless residents**

  - **Contested Claims**:
    - Neighborhood association: "The area has become unsafe."
    - Service providers: "The area has not become unsafe."

  - **Sorting Step**: This appears to be an empirical disagreement (about crime statistics) but also involves aspectual disagreement (what counts as "unsafe"?). We start by treating it as empirical because there is data.

  - **Resolution by Type (Empirical)**:
    - The police have published three years of incident data. The committee should review the data together.
    - If the data shows no increase in crime, then the neighborhood association's claim is factually false? Not necessarily: they might mean "perceived safety" or specific types of incidents.
    - If the data shows an increase, then the service providers' claim is false? Similarly, they might be referring to overall crime rates vs. violent crime.

  - **Semantic Disagreement**: What does "unsafe" mean? It could be:
    - Objective: Increase in crime statistics (total incidents, violent crimes, etc.)
    - Subjective: Residents' feelings of safety (which might not correlate with crime stats).

  - **Aspectual Disagreement**:
    - Standpoint Ledger:
      - Neighborhood association: "The area has become unsafe in the respect of residents' perception and fear of crime, and in the increase of visible disorder (e.g., loitering)."
      - Service providers: "The area has not become unsafe in the respect of actual violent crime rates, which have remained stable."

  - **Collapse Rule**: Neither claim is factually false if we accept both respects. The standpoint of "residents' perception" is acceptable (feelings matter) and "crime rates" is objective. Neither standpoint is unacceptable.

  - **Drafting**:
    - "While crime statistics show no significant increase in violent incidents, neighborhood residents report increased feelings of unease due to visible changes in street activity. We acknowledge both the objective data and the subjective experiences."
    - Recommendation: "We recommend increased community policing and outreach to address perceptions and ensure actual safety."

  **Example 2: Removing a benefactor's name**

  - **Contested Claims**:
    - Faction A: "He was the greatest friend this city ever had."
    - Faction B: "He was a segregationist who enriched himself through discriminatory lending."

  - **Sorting Step**: This is clearly aspectual. Both claims can be true from different respects.

  - **Standpoint Ledger**:
    - Faction A: "He was the greatest friend in respect to his philanthropic contributions (e.g., funding the hospital wing)."
    - Faction B: "He was a segregationist in respect to his business practices and social views, which caused harm to marginalized communities."

  - **Collapse Rule**: Neither claim is factually false (assuming both aspects are historically accurate). But is the standpoint of Faction A unacceptable? Only if it ignores the harm. We must consider both.

  - **Drafting**:
    - "While Mr. X was a major benefactor whose donations built this hospital wing, his legacy also includes documented practices of discriminatory lending that contributed to racial segregation in our city."
    - Recommendation: This is a values decision. The committee might say: "We recognize the complexity of his legacy. The decision to remove a name must balance gratitude for generosity with accountability for harm. We recommend [specific action]." But note: the committee must vote on the action. The statement can present the facts and the values at stake without prescribing if the committee is divided.

  **Example 3: Public-health question**

  - **Contested Claim**: One member wants to say: "The science on this issue is genuinely open."
  - **But**: The relevant scientific bodies are not divided.

  - **Sorting Step**: This is empirical. What do the scientific bodies say?

  - **Resolution by Type (Empirical)**:
    - The committee should ask for the consensus view from authoritative sources (e.g., CDC, WHO, major journals). If there is overwhelming consensus, then the claim that the science is "open" is factually false.

  - **Collapse Rule**: If the claim is factually false, it must be rejected. If the member insists, then:
    - Ask for the respect in which it is true. They might say: "There is a minority view" or "The public perceives it as open." But the claim as stated ("genuinely open") is about the scientific consensus, not public perception.

  - **Standpoint Ledger**: If the member says: "From the standpoint of public debate, it is open," then we can record that. But the original claim was about the science.

  - **Drafting**:
    - If the claim is false, then the statement should not include it. If the member organization insists, then the statement might not be issued (because of the veto). Alternatively, the statement could say: "While the scientific consensus is clear, public understanding remains divided. We recommend following the guidance of [scientific body]."

  **Procedure Summary for the Committee**:

  1. **Sort the Disagreement** (5 minutes per claim):
     - Is it empirical? (Can we get data?) → Get data.
     - Is it about word meaning? → Define the term.
     - Otherwise, it's aspectual → Go to step 2.

  2. **Standpoint Ledger** (10 minutes per claim):
     - For each claim, ask: "In what respect is this true?" Record the respect.
     - If no respect is given, mark as unattached (and do not include).

  3. **Collapse Rule** (5 minutes per claim):
     - Is the claim factually false? (Reject.)
     - Is the respect unacceptable? (Vote: if any member vetoes the rejection, then the claim must be included with attribution? But note: each member has a veto on the whole statement. This is tricky. We might need a rule: if a standpoint is deemed unacceptable by a majority and the claimant cannot reframe, then the claim is excluded. But the veto power might block this.)

     Given the veto, if any member objects to excluding a claim, then the statement might not be issued. Alternatively, the claim could be included with explicit attribution and a note of dissent. However, the requirement is for a joint statement, so attribution might not be acceptable.

  4. **Drafting** (30 minutes total):
     - For empirical claims: State the facts.
     - For semantic issues: Use clear definitions.
     - For aspectual claims: Use "from the perspective of X" and attribute if necessary.
     - For recommendations: Base them on shared values. If no shared value, defer or state the disagreement.

  **Failure Modes**:
  - **Veto Power**: The procedure cannot overcome a member's veto. If a member insists on an unattached claim or an unacceptable standpoint, the committee may deadlock.
  - **Time**: The procedure might run over two hours. Strict timekeeping is essential.
  - **Complexity**: The public might not understand the qualifications. Keep language simple.

  **Honest Limitations**:
  - This procedure is not a magic bullet. It requires good faith from members to provide respects and accept factual corrections.
  - It might not resolve deep value conflicts (e.g., on the benefactor's name, the committee might still be split on the action).
  - The drafting step is crucial: the writer must avoid weasel words by being specific about respects.

  **Revised Procedure for the Committee Meeting**:

  Given the time constraint (2 hours), the chair should:

  1. **Pre-Meeting**: Distribute disputed claims and any data (like crime statistics) in advance.

  2. **Meeting Agenda**:
     - (10 min) Review agenda and rules.
     - (30 min) Sorting Step and Empirical/Semantic resolution for each claim (rotate through items).
     - (30 min) Standpoint Ledger for remaining claims (aspectual).
     - (15 min) Collapse Rule: Review claims for factual accuracy and standpoint acceptability.
     - (20 min) Drafting: Agree on the structure of the statement.
     - (15 min) Review and approve the draft.

  This leaves room for discussion. If an item is too contentious, it might be tabled.

  Let me know if you need more details on any part.
answer: |-
  Below is a practical, step-by-step procedure for your committee, based on the Jain concepts of *anekāntavāda* (many-sidedness), *nayavāda* (standpoint relativity), and *syādvāda* (conditional predication). I've distilled these into a concrete, time-bound process for drafting joint statements, incorporating your requested mechanisms (standpoint ledger, sorting step, collapse rule, and drafting rules). The procedure is designed to run within your two-hour monthly meeting, avoid vague language, and produce a one-page statement that is clear to the general public. It includes explicit guards against "weasel wording" and relativism.

  **Core Philosophy**:  
  Each claim is examined for *the specific respect* (perspective, context, or aspect) in which it holds true. Not all claims are equal—some collapse under scrutiny, others are valid only conditionally. The goal is to replace "flat falsehoods" with precise, aspect-qualified assertions or reject them entirely.

  ---

  ### **The Procedure: Step-by-Step**  
  *Total time: 2 hours (strictly timed)*  
  **Roles**: Chair (facilitates), Vice-Chair (tracks time/logistics), All Delegates (must participate). A neutral note-taker records decisions.

  #### **Step 0: Pre-Work (Before Meeting)**  
  - **Deadline**: 48 hours before the meeting, delegates submit *one sentence per topic* they want in the statement. No attachments.  
  - **Chair's Task**: Group sentences by topic, pre-sort obvious empirical/semantic disputes, and circulate police data, scientific consensus, or other evidence.  
  - **Why**: Prevents delegates from arriving unprepared. Forces focus.

  #### **Step 1: Sorting Disagreements (20 minutes)**  
  **Goal**: Classify each contested sentence into one of three types. *No debate yet—just categorize.*  
  - **Mechanism**: Chair reads each sentence aloud. Delegates vote by show of hands:  
    - **Empirical** (E): Dispute about facts. Settled by data.  
      - *Test*: Can this be resolved with numbers, dates, or verified evidence?  
      - *Sufficient answer*: Data from a neutral source (e.g., police stats, peer-reviewed science).  
    - **Semantic** (S): Dispute about word meaning. Settled by disambiguation.  
      - *Test*: Does the sentence hinge on ambiguous terms (e.g., "safe," "community")?  
      - *Sufficient answer*: Agreed-upon definition (e.g., "In this context, 'safe' means no violent crime increase").  
    - **Aspectual** (A): Dispute rooted in perspectives. Requires standpoint ledger.  
      - *Test*: Could both claims be true under different respects (e.g., time frame, stakeholder view)?  
  - **Outcome**:  
    - E or S disputes move to Step 2.  
    - A disputes move to Step 3.  
    - *Termination*: If a sentence is unanimous (no dispute), it auto-includes in the draft.  

  #### **Step 2: Resolve Empirical or Semantic Disputes (30 minutes)**  
  **Goal**: Settle E/S disputes with data or definitions. Avoid aspectual overcomplication.  
  - **For Empirical (E)**:  
    - Chair presents pre-circulated data (e.g., police incident reports).  
    - Ask: "What number or baseline makes this true/false?" Delegates must answer (e.g., "Unsafe means >10 monthly incidents").  
    - *Decision*: If data refutes a claim, it is rejected. If data is inconclusive, the sentence is tabled or rewritten as a neutral fact (e.g., "Police report 8 incidents monthly; pre-center average was 6").  
  - **For Semantic (S)**:  
    - Ask: "What definition of [word] are you using?"  
    - Delegates propose definitions. Vote on the clearest for the statement.  
    - *Decision*: Replace the contested word with the definition (e.g., "perceived safety" vs. "crime statistics").  
  - **Guards**:  
    - No standpoint ledger here—prevents false aspectualizing of clear facts.  
    - If unresolved in 15 minutes, the sentence is cut (no vague compromises).  

  #### **Step 3: Standpoint Ledger for Aspectual Disputes (40 minutes)**  
  **Goal**: For each Aspectual (A) sentence, identify the *respect* (naya) making it true. Reject unattached claims.  
  - **Mechanism**:  
    - Chair posts a flip-chart with columns: *Claim*, *Delegate*, *Respect*, *Attached (Y/N)*.  
    - For each claim, ask the delegate: **"In what specific respect is this true?"**  
      - *Respect must be concrete*: "Whose interests?" (e.g., merchants), "What time frame?" (e.g., short-term), "What metric?" (e.g., economic impact).  
    - If no respect is given, mark *Unattached*.  
    - Delegates can challenge: "What evidence supports that respect?"  
  - **Collapse Rule (Applied Here)**: Reject a claim if:  
    - **Factual falsehood**: Respect relies on disproven data (e.g., "This respect assumes crime doubled, but data shows 10% increase").  
    - **Unacceptable standpoint**: Respect denies personhood, rights, or scientific consensus (e.g., "Only property owners matter"). *Decision by vote*: 6/9 votes to reject (override veto if respect is indefensible; explain why in statement).  
  - **Outcome**:  
    - Unattached or collapsed claims: Excluded from statement.  
    - Valid attached claims: Proceed to drafting.  

  #### **Step 4: Drafting Rules (25 minutes)**  
  **Goal**: Convert validated claims into public language. Avoid syādvāda complexity.  
  - **Rules for Qualified Claims**:  
    - **Conjoin respects**: Use "from [respect]" or "in terms of [respect]" (e.g., "From a public-health view, emissions are low; from a residential-view, odors are disruptive").  
    - **Attribute sparingly**: Only if essential (e.g., "Neighbors report safety concerns; police data shows no trend"). Don’t over-qualify.  
    - **No inexpressibility**: Never use "inexpressible" or "both true and false." Replace with: "Complex; requires balancing [Respect A] and [Respect B]."  
    - **One-page limit**: Max 3 aspectual claims per topic. Cut redundancies.  
  - **Converting to Recommendations**:  
    - Base actions on shared values (e.g., "All agree on reducing harm → Therefore, we recommend...").  
    - If no shared value, state: "We differ on priorities; no consensus." *No forced action*.  
  - **Guards Against Weasel Wording**:  
    - Ban these words: "some feel," "many say," "arguably." Replace with specific respects.  
    - Lawyer reviews for clarity, not philosophy.  

  #### **Step 5: Approval & Deadlock Protocol (5 minutes)**  
  - **Vote**: Delegates approve the entire draft (one-page max). Vetoes allowed.  
  - **If Deadlock**: Issue no statement. Do not paper over splits.  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Override Vetoes or Bad Faith**: If a delegate insists on unattached claims or unacceptable standpoints, deadlock is inevitable. The procedure exposes this but doesn’t solve it.  
  2. **Resolve Deep Value Conflicts**: For issues like renaming a building, it clarifies aspects but can’t force consensus on action. The statement may present truths neutrally but end with "no recommendation."  
  3. **Handle Overwhelming Complexity**: Topics with >3 respects may be tabled for simplicity.  
  4. **Eliminate Judgment**: The chair must enforce timing, and delegates must engage honestly. The collapse rule requires voting on "unacceptable standpoints," which is subjective (but guided by evidence).  
  5. **Guarantee Endorsement**: Member organizations may still dissent if their unattached claims are rejected—but the statement will be factually rigorous.  

  **Guard Against Relativism**: The procedure rejects claims without respects and collapses false/unacceptable ones. It’s not "all views are valid"—it’s "some views are valid only under specific conditions."  

  ---

  ### **Worked Examples**  
  *Assumes committee: 3 neighborhoods (N1, N2, N3), hospital (H), school district (S), 2 unions (U1, U2).*  

  #### **Example 1: Drop-in Center for Homeless Residents**  
  - **Contested Sentences**:  
    - N1: "The area has become unsafe."  
    - Service Providers (H): "The area has not become unsafe."  
  - **Step 1: Sorting** → Empirical (both cite safety; police data exists).  
  - **Step 2: Resolve Empirical** → Chair presents police data: 5% increase in non-violent incidents, no change in violent crime.  
    - Ask: "What baseline defines 'unsafe'?"  
      - N1: ">3% incident increase = unsafe."  
      - H: "Only violent crime = unsafe."  
    - *Decision*: Data refutes N1's baseline (they used total incidents). Sentence rejected. Rewrite as: "Police report a 5% rise in non-violent incidents; violent crime unchanged."  
  - **Drafting**: "Data shows no increase in violent crime, but non-violent incidents rose 5%. Service providers attribute this to increased visibility, not risk."  
  - **Recommendation**: "We support the center but urge increased street lighting to address concerns."  
  - *Why it works*: Empirical sorting cut debate. No aspectual ledger needed.  

  #### **Example 2: Remove Benefactor's Name from Hospital Wing**  
  - **Contested Sentences**:  
    - U1/H: "He was this city’s greatest friend."  
    - N3/S: "He was a segregationist who enriched himself through discriminatory lending."  
  - **Step 1: Sorting** → Aspectual (both historically verifiable but from different respects).  
  - **Step 3: Standpoint Ledger**:  
    - U1/H claim: True in respect of "philanthropic impact" (e.g., donated $10M). *Attached*.  
    - N3/S claim: True in respect of "social harm" (e.g., redlining records). *Attached*.  
    - *Collapse Rule*: Neither false nor unacceptable (both respects valid).  
  - **Drafting Rules**:  
    - Conjoin: "In terms of philanthropy, he was a major benefactor; in terms of social justice, his lending practices caused harm."  
    - Attribute: Not needed—neutral respects work.  
  - **Recommendation**: Hard values question. No consensus? Draft: "We acknowledge both aspects but differ on renaming. Hospital board will decide."  
  - *Why it works*: Avoids false compromise ("He was complex"). Respects are concrete.  

  #### **Example 3: Public-Health Statement (e.g., Vaccine Efficacy)**  
  - **Contested Sentence**:  
    - U2: "The science is genuinely open." (When bodies like CDC/WHO agree it’s settled).  
  - **Step 1: Sorting** → Empirical (consensus exists).  
  - **Step 2: Resolve Empirical**:  
    - Chair presents CDC/WHO statements.  
    - Ask: "What evidence makes science 'open'?"  
      - U2: "Social media debates." → Not scientific evidence.  
    - *Decision*: Claim relies on false baseline (scientific consensus ≠ public debate). Rejected.  
  - **Collapse Rule Triggered**: Factual falsehood.  
  - **Drafting**: "Leading health bodies confirm the science is settled. Public misinformation remains a challenge."  
  - **Deadlock Risk**: If U2 vetoes, no statement. Do not say "some doubt the science."  
  - *Why it works*: Collapse rule prevents false equivalence. Forces "truth or silence."  

  ---

  ### **Final Tips for Implementation**  
  - **First Meeting**: Run a mock trial on a past dispute (e.g., school closure).  
  - **Chair’s Script**: Keep a timer; interrupt off-topic debates. "What respect makes that true?" is your mantra.  
  - **Output**: A statement that is unambiguous, aspect-aware, and recommendation-focused.  
  - **Why This Isn’t Relativism**: It uses *syādvāda* to qualify claims conditionally but collapses absolutes (e.g., science denial) and rejects harmful standpoints.  

  This procedure turns Jain philosophy into a concrete tool for conflict resolution, prioritizes clarity over compromise, and respects your time limits. It won’t prevent all deadlocks, but it will ensure that when you issue a statement, it’s rigorous and defensible.
