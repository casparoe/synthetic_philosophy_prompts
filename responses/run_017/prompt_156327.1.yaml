prompt: |-
  i'm building the risk-scoring layer of a hospital readmission system — the bit that has to take one particular patient, put them into some reference class, and hand a clinician a single number before discharge — and before i commit to a rule i want to know what such a rule would even have to be able to do. so: write me the desiderata for a theory of reference class selection. not what class this patient goes in, but what any account of *which* class is the right one has to deliver, with the case or consideration behind each item, and sorted into non-negotiable, negotiable, and things i only think are requirements because of the camp i'm in.

  the purpose is fixed: it has to be good enough to guide a real decision about an individual (extra home visits, a longer stay), the decision will actually be made on the basis of it, and the number has to be defensible afterwards both to the patient and to whoever audits us.

  cases i think an adequate account has to handle, and which should be the reason each requirement is on the list:

  - a 68-year-old diabetic admitted through the ER in february, living in a postcode that's a decent proxy for low income. intersect all of that and the class has three people in it. intersect only some of it and you get plausible numbers that disagree with each other.
  - two perfectly admissible classes that both contain the patient and give different rates: men 60-69 with diabetes, versus everyone admitted via the ER in winter. nothing has gone wrong in either description, they just disagree.
  - classes that are defined partly by the outcome. the obvious one is patients we did readmit, which gives 100% and is useless; the interesting one is patients flagged high-risk by our old model, which predicts readmission mostly because the flag caused extra visits. i want to know whether banning the first kind is enough or whether the second kind needs its own clause.
  - once we start acting on the number, the class's own rate moves: the home visits work, so the base rate in the class we used to calibrate on drops. the class we wanted before the policy isn't the class we get after it.
  - a new biomarker starts being measured next year. same patient, same everything else. i have a strong feeling last year's number does not thereby become wrong, but i also think the new variable should be used from now on, and i can't see how to hold both without the theory saying something about whose information state the class is relative to.
  - masking: the wide class says 15%, but inside it one subgroup is at 4% and another at 31%. the person from the 4% subgroup gets told 15%, and i genuinely can't tell if that's the best estimate available given what's knowable or whether it's just averaging away a disparity that we do in fact have the data to see. give this phenomenon a name if it doesn't have one i'd recognise, and tell me whether it generates a requirement or is really just an instance of some other requirement.

  requirements to argue about, at least: use all the evidence you have about the individual; use the narrowest class that still has enough members for a stable frequency; never let the class be defined by the outcome; don't let the answer change when a newly measured variable is outcome-irrelevant; stay calibrated inside whatever class you pick; be computable in time to be useful; survive being acted upon; produce one number rather than a spread across admissible classes; and use only classes that are causally homogeneous with respect to the outcome rather than merely statistically associated.

  then the part i actually want: which of those are real desiderata and which are just the prejudices of one camp — i suspect one-number-per-patient is an institutional hangover rather than a requirement, and i suspect only-count-actual-finite-classes is a frequentist hangover — and which subset of the list can't be jointly satisfied. my bet is that use-all-the-evidence, only-use-classes-with-reliable-statistics and one-number-for-a-one-off-case can't all hold, but i'd rather you find the pair that genuinely breaks and show me the case where it breaks. if the honest answer is that the list is jointly unsatisfiable, say that plainly, because i can take that back to my team as a result.

  and only at the end, a couple of lines each, no table: how the usual contenders do against the list — the narrowest-reliable-class rule, fit-a-model-on-all-the-covariates-and-read-off-the-individual-prediction, a causal view where the class gets picked by what causes the outcome, and pick-whatever-class-is-best-calibrated. which single requirement does the most work excluding candidates.
reasoning: |-
  We are constructing desiderata for a theory of reference class selection in the context of a hospital readmission risk scoring system. The goal is to produce a single number for a clinician to use in discharge decisions, which must be defensible to patients and auditors. We have several cases and potential requirements, and we want to sort the desiderata into non-negotiable, negotiable, and possibly camp-specific. We also want to evaluate which requirements are jointly satisfiable and how common approaches fare.

  ### Step 1: Identify Desiderata from Cases
  We'll list each desideratum and tie it to the case that motivates it.

  1. **Non-arbitrary handling of small reference classes** (from the 68-year-old diabetic case): 
     - When intersecting all relevant factors leads to a very small class (e.g., 3 people), the theory must provide a way to avoid unstable estimates without arbitrarily dropping factors. This leads to:
       - **Desideratum 1a (Stability)**: The reference class must be large enough to provide a statistically stable estimate of the readmission rate.
       - **Desideratum 1b (Use of Relevant Information)**: The theory should use all available relevant information about the individual.

  2. **Handling conflicting reference classes** (from the two admissible classes case):
     - Two different but equally admissible classes (e.g., "men 60-69 with diabetes" vs. "everyone admitted via ER in winter") yield different risk scores. This requires:
       - **Desideratum 2 (Uniqueness)**: There should be a unique reference class for a given patient and set of information, or a principled way to combine estimates from multiple classes.

  3. **Avoiding outcome-defined classes** (from the classes defined by outcome case):
     - Classes defined by the outcome (e.g., "patients we did readmit") are tautological. But also, classes defined by a previous model's prediction (which might be self-fulfilling) are problematic. This motivates:
       - **Desideratum 3 (Non-Circularity)**: The reference class must not be defined by the outcome (readmission) or by any variable that is a direct consequence of the prediction (e.g., a previous model's flag that led to interventions).

  4. **Robustness to policy change** (from the class rate changing when we act case):
     - When the risk score leads to interventions (like extra home visits) that lower readmission in the class, the historical data used to define the class becomes non-representative. This requires:
       - **Desideratum 4 (Policy Robustness)**: The risk score should remain valid (i.e., calibrated) even when the policy based on it is implemented, or the theory must account for the effect of the policy.

  5. **Handling new information** (from the new biomarker case):
     - When a new variable (e.g., a biomarker) becomes available, it should be incorporated, but the prior risk score (without it) should not be considered wrong for past decisions. This suggests:
       - **Desideratum 5 (Information State Relativity)**: The reference class should be relative to the available information at the time of prediction. A prediction made with less information is not invalidated by later acquiring more information, but future predictions should use the new information.

  6. **Masking of subgroups** (from the wide class masking case):
     - A broad class (e.g., overall 15%) may mask subgroups (4% and 31%). The question is whether we are obliged to use the subgroup if we have the data. This case motivates:
       - **Desideratum 6 (Relevance)**: If a subgroup within the reference class has a significantly different risk and we have the data to identify it, then we should use the subgroup (to avoid averaging away important disparities). This is similar to the requirement of using the narrowest class.

  ### Step 2: List Proposed Requirements and Sort
  We have a list of proposed requirements. We'll sort them into non-negotiable, negotiable, and camp-specific.

  **Non-Negotiable** (essential for defensibility and purpose):
  - **Stability**: The class must be large enough for a stable estimate. (Without stability, the number is unreliable and not defensible.)
  - **Non-Circularity**: Avoid classes defined by the outcome or self-fulfilling prophecies. (Otherwise, the estimate is invalid.)
  - **Policy Robustness**: The system must account for or be robust to the fact that interventions change the base rate. (Because we are acting on the score, and we must remain calibrated.)
  - **Calibration**: Within the chosen reference class, the predicted risk must equal the actual frequency (on average). (Required for the number to be meaningful and defensible.)

  **Negotiable** (context-dependent, might be relaxed with justification):
  - **Use all relevant evidence**: In practice, we may have to aggregate or use a model due to the curse of dimensionality. Strictly using all evidence might lead to very small classes. So we might need a relaxed version: use as much evidence as possible without compromising stability.
  - **Narrowest reliable class**: This is a way to achieve the use of relevant evidence, but if the narrowest class is too small, we must widen. So it's a guideline but not absolute.
  - **Uniqueness**: We might allow multiple classes and then combine (e.g., model averaging) if we can do so in a principled way. But the output must be a single number.

  **Camp-Specific** (might be based on statistical philosophy or institutional constraints):
  - **One number per patient**: The institution requires a single number, but in reality, uncertainty is inherent. This might be an institutional hangover. A more honest approach might provide an interval, but the requirement is for one number.
  - **Only use actual finite classes**: This is a frequentist hangover. Bayesian approaches can use models that smooth over small classes. So this is camp-specific.
  - **Causal homogeneity**: The requirement that the class be causally homogeneous (not just statistically associated) is a strong causal inference view. It might be desirable but is not always necessary for prediction. It's camp-specific (causal camp).

  ### Step 3: Joint Satisfiability
  We must check which pairs (or sets) of requirements cannot hold simultaneously.

  - **Conflict 1: Use all evidence vs. Stability**: If we use all evidence, we get a very small class (like 3 people) which is unstable. We cannot have both. We must trade off: use as much evidence as possible without dropping below a stability threshold.

  - **Conflict 2: Use all evidence vs. One number per patient**: If we have multiple admissible classes, each using a subset of the evidence, we get multiple numbers. To produce one number, we must have a rule to choose one class or combine them. But the rule might be arbitrary.

  - **Conflict 3: Policy Robustness vs. Calibration**: When we act on the risk score, the class's base rate changes. So the historical calibration is lost. We need a way to adjust for the intervention (e.g., by causal modeling) or define the class in a way that is invariant to the policy.

  - **Conflict 4: Relevance (avoid masking) vs. Stability**: If we break down a class to avoid masking, we might get small subgroups. We must balance between using the subgroup (to avoid masking) and having enough data.

  **Verdict**: The list is not jointly satisfiable in an ideal way. We must make trade-offs. The central tension is between:
     (a) using all relevant information to get the most individualized estimate (which leads to small classes) and 
     (b) having stable, reliable estimates (which requires larger classes).

  Moreover, the requirement for a single number forces an aggregation when multiple views (classes) are available.

  ### Step 4: How Common Approaches Fare
  We consider four approaches:

  1. **Narrowest reliable class rule**: 
     - Non-negotiable: Satisfies stability by requiring a minimum size. May violate use of all evidence if the narrowest class is too small and we have to widen arbitrarily. It might not handle the new biomarker naturally (if the class is defined without it, then when it becomes available, we switch to a new narrowest class). It does not automatically handle policy robustness (if the intervention changes the class's risk). It produces one number. It may not be calibrated after policy change.

  2. **Fit a model on all covariates and read off the individual prediction** (e.g., a logistic regression or machine learning model):
     - This uses all evidence (via the model) and can produce a single number. It can be stable if regularized. However, without causal structure, it may not be policy robust (if the model is trained on historical data without interventions, then when interventions are applied, it becomes miscalibrated). It can incorporate new biomarkers easily. It may mask disparities if the model does not include the relevant subgroup variable. It does not explicitly require a large class because it uses smoothing. It may violate non-circularity if the model uses variables that are consequences of the outcome.

  3. **Causal view** (pick class by what causes the outcome):
     - This would define the reference class by causal variables. It might satisfy policy robustness by being invariant to interventions (if the class is defined by pre-intervention variables). It may not use all evidence (if some non-causal variables are predictive). It might be hard to define and compute. It may not be calibrated in the observational data if there are unmeasured confounders. It can handle the new biomarker if it is a causal variable.

  4. **Pick whatever class is best calibrated**:
     - This would choose the class that has been historically calibrated. However, it may not be stable (if the class is small) and may not use all relevant evidence. It does not handle policy robustness (calibration breaks after intervention). It may lead to circularity if the class is defined by the outcome.

  ### Step 5: Which Requirement Does the Most Work Excluding Candidates?
  The **Policy Robustness** requirement is very challenging and excludes many approaches. Without accounting for the effect of the intervention, any method that relies on historical data (like the narrowest class, model fitting, or calibration-based) will break when the policy is implemented. Only the causal approach (if properly specified) might survive, but it is hard to implement.

  ### Final List of Desiderata (Sorted)
  **Non-negotiable**:
  1. **Stability**: The reference class must be large enough to provide a statistically stable estimate (from the small class case).
  2. **Non-Circularity**: The class must not be defined by the outcome or by variables that are consequences of the prediction (from the outcome-defined class case).
  3. **Calibration**: The risk score must equal the actual readmission rate within the reference class (on average) at the time of prediction (required for defensibility).
  4. **Policy Robustness**: The risk score must remain valid (calibrated) even when the policy based on it is implemented, or the method must adjust for the intervention (from the policy change case).

  **Negotiable**:
  5. **Use of Relevant Information**: Use as much relevant information as possible without violating stability (from the small class and masking cases).
  6. **Relevance (Avoid Masking)**: If a subgroup is identifiable and has a significantly different risk, use that subgroup (unless stability is compromised) (masking case).
  7. **Uniqueness**: The method should produce a single risk score per patient (institutional requirement).
  8. **Information State Relativity**: The score should be based on the available information at the time, and new information should update the score (from the new biomarker case).

  **Camp-Specific**:
  9. **One number per patient**: The output must be a single number (institutional, but might be relaxed to an interval if allowed).
  10. **Causal Homogeneity**: The class should be defined by causal variables (causal camp).
  11. **Only actual finite classes**: Use only classes that are finite and observed (frequentist camp).

  ### Conclusion
  The list is not jointly satisfiable in an ideal way. The key tension is between using all relevant information (which leads to individualized but unstable estimates) and stability (which requires aggregation). Additionally, policy robustness is a major challenge.

  For the hospital system, a practical approach might be:
  - Use a well-regularized predictive model (like a logistic regression or machine learning model) that uses all available covariates to produce an individual risk score. This balances the use of evidence and stability.
  - To address policy robustness, use causal inference techniques (e.g., incorporating the effect of interventions) or continuously update the model with new data that reflect the interventions.
  - To avoid circularity, ensure the model does not use variables that are consequences of the prediction (like the old model's flag) or the outcome.
  - To handle masking, include interaction terms or use methods that capture subgroup effects.
  - Accept that the single number is an estimate with uncertainty and provide it with a confidence interval if possible.

  But note: no method will satisfy all desiderata perfectly. Trade-offs are inevitable.
answer: |-
  ### Desiderata for a Theory of Reference Class Selection  
  Sorted into **non-negotiable** (essential for defensibility), **negotiable** (context-dependent), and **camp-specific** (philosophical/institutional biases). Each item includes the motivating case and rationale.  

  ---

  #### **Non-Negotiable Desiderata**  
  1. **Stability**  
     - **Case**: 68-year-old diabetic in a low-income postcode (intersecting all factors yields \(n=3\)).  
     - **Requirement**: The reference class must yield a statistically stable estimate (e.g., sufficient sample size, low variance).  
     - **Rationale**: Unstable estimates (e.g., from tiny classes) are clinically indefensible and risk harmful decisions.  

  2. **Non-Circularity**  
     - **Case**: Classes defined by the outcome (e.g., "patients we readmitted") or self-fulfilling proxies (e.g., "patients flagged high-risk by old model").  
     - **Requirement**: The class must not directly or indirectly incorporate the outcome.  
     - **Rationale**: Circularity invalidates the estimate (e.g., if the "flag" causes readmission, the rate is biased). Banning outcome-defined classes is insufficient; proxies must also be excluded.  

  3. **Policy Robustness**  
     - **Case**: Interventions (e.g., extra home visits) reduce readmission rates in the reference class post-implementation.  
     - **Requirement**: The risk score must account for how interventions alter the class's baseline rate.  
     - **Rationale**: If the score guides actions that change outcomes, the theory must adjust for this feedback loop to avoid miscalibration.  

  4. **Calibration**  
     - **Case**: Any class chosen must empirically match predictions to outcomes (e.g., 10% predicted = 10% observed).  
     - **Requirement**: The score must be calibrated within its reference class.  
     - **Rationale**: Lack of calibration misleads clinicians and invites legal/audit challenges.  

  ---

  #### **Negotiable Desiderata**  
  5. **Relevance Over Masking**  
     - **Case**: A broad class (15% overall) masks subgroups (4% vs. 31%) when data exists to distinguish them.  
     - **Requirement**: Prioritize subgroups when identifiable and statistically stable.  
     - **Rationale**: Masking (a form of **aggregation bias**) misrepresents risk if disparities are actionable. But stability may force trade-offs.  

  6. **Information-State Relativity**  
     - **Case**: A new biomarker (e.g., genetic marker) becomes available next year.  
     - **Requirement**: The score should reflect available information at prediction time, not future data.  
     - **Rationale**: Past scores aren’t "wrong" retroactively, but new data must be incorporated prospectively.  

  7. **Use All Available Evidence**  
     - **Case**: Conflicting classes (e.g., "diabetic men 60-69" vs. "winter ER admissions") both apply to the patient.  
     - **Requirement**: Leverage all relevant patient data, but allow aggregation when evidence conflicts.  
     - **Rationale**: Ignoring evidence (e.g., income proxy) may hide disparities, but strict adherence causes instability.  

  ---

  #### **Camp-Specific Desiderata**  
  8. **Single Output Number**  
     - **Case**: Clinicians demand one number for discharge decisions.  
     - **Requirement**: Output a unique risk score per patient.  
     - **Rationale**: Institutional pragmatism, but philosophically dubious—individual risk is inherently distributional. Likely an **institutional hangover**.  

  9. **Causal Homogeneity**  
     - **Case**: Should classes require shared causal drivers (e.g., "vascular complications") vs. statistical associations (e.g., "winter admissions")?  
     - **Requirement**: Prefer classes where variables causally influence readmission.  
     - **Rationale**: **Causal camp bias**—improves policy robustness but is often unverifiable.  

  10. **Finite Actual Classes**  
      - **Case**: Using narrow classes (e.g., 3 patients) vs. model-synthesized estimates (e.g., logistic regression).  
      - **Requirement**: Restrict classes to observed, finite populations.  
      - **Rationale**: **Frequentist hangover**; rejects model-based smoothing, worsening stability.  

  ---

  ### **Joint Satisfiability and Conflicts**  
  - **Unresolvable Trilemma**:  
    - **Requirements in conflict**: (i) Use All Evidence, (ii) Stability, (iii) Single Output Number.  
    - **Why they conflict**:  
      - Using all evidence (e.g., age + diabetes + income + season) shrinks class size, violating **Stability**.  
      - To ensure Stability, you must widen the class (e.g., ignore season), violating **Use All Evidence**.  
      - Multiple admissible classes (e.g., "diabetics" vs. "winter admissions") produce conflicting scores, preventing a **Single Output Number** without arbitrary aggregation.  
    - **Case that breaks them**: The 68-year-old diabetic in winter. Narrow classes are unstable; wide classes ignore evidence and mask subgroups. No unique class exists, forcing a trade-off.  

  - **Other Conflicts**:  
    - **Policy Robustness vs. Calibration**: Acting on the score changes the class’s readmission rate, breaking calibration without dynamic re-estimation.  
    - **Relevance Over Masking vs. Stability**: Using subgroups (e.g., 4% risk) improves relevance but risks instability if subgroups are small.  

  **Verdict**: The full list is **jointly unsatisfiable**. Trade-offs are unavoidable. The trilemma above is the core fracture.  

  ---

  ### **How Contenders Fare Against Key Desiderata**  
  1. **Narrowest Reliable Class Rule**  
     - **Fails**: Policy Robustness (doesn’t adjust for intervention effects), Information-State Relativity (ignores new biomarkers), and Masking (prioritizes stability over subgroups).  
     - **Strength**: Stability, Non-Circularity.  

  2. **Predictive Model (e.g., Logistic Regression)**  
     - **Fails**: Policy Robustness (trained on pre-intervention data), Single Output (if it outputs distributions, not one number).  
     - **Strength**: Use All Evidence (via covariates), Information-State Relativity (updates with new variables).  

  3. **Causal Homogeneity Selection**  
     - **Fails**: Computability (causes are hard to verify), Stability (causal groups may be small).  
     - **Strength**: Policy Robustness (if causes are intervention-invariant), Non-Circularity.  

  4. **Best-Calibrated Class Selection**  
     - **Fails**: Policy Robustness (calibration degrades post-intervention), Masking (may select broad, well-calibrated classes that hide subgroups).  
     - **Strength**: Calibration, Stability.  

  ### **Most Exclusionary Requirement**  
  - **Policy Robustness** does the most work excluding candidates.  
    - **Why**: Every approach fails this without explicit causal modeling or real-time updating. It exposes how historical data becomes invalid once the score informs actions—a universal flaw in non-adaptive systems.  

  ---

  ### **Summary**  
  An adequate theory must prioritize **non-negotiables** (Stability, Non-Circularity, Policy Robustness, Calibration). The **trilemma** (Use All Evidence + Stability + One Number) is unresolvable; you must sacrifice one (likely the strict "use all evidence" rule). **Recommendation**: Use a predictive model with regular updates for new data and intervention effects, outputting both a point estimate and uncertainty. Acknowledge trade-offs transparently to clinicians/auditors—perfection is impossible, but defensibility lies in justifying choices.
