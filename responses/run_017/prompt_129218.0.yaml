prompt: |-
  I keep running into one shape of argument and I have no word for it, which is making it hard to think about. I would like the established term if there is one, and whichever way it goes, help carving the thing at the joints.

  Three instances from the last year. First: a friend trying to talk his brother into forgiving their father listed some considerations — you would sleep better, the family would stop being miserable at Christmas, the grudge is costing you more than it costs him. The brother granted every item on the list and then said they were still the wrong sort of thing: reasons to want to forgive, or to behave as if he had, or to get himself into a forgiving frame of mind by some indirect route, but not reasons to forgive; and if he produced the feeling from those considerations alone, it would not be the thing he was being asked for. Second: a colleague told me I should be impressed by our new director, on the grounds that being impressed would make my working life easier and would show in how I spoke to her. Same shape. The consideration is genuine, it tells in favour of something, and yet citing it in favour of the reaction felt like a category mistake. Third: a man offered me a hundred dollars if by Friday I could come to believe his startup would work. Here I do not even want to say the money is a weak or second-rate consideration; I want to say it is not a consideration of the relevant sort at all, only a reason to want the belief, or to act as if I had it.

  Two things I think I am not after, so you do not spend the answer on them. It is not the familiar observation that belief and admiration are not directly under the will — my friend's brother is not claiming he is incapable of working himself into a forgiving mood, and people do manage it. And it is not the point that practical considerations do not affect what is true; he never denied that his grudge was harmful. The recurring thing is narrower: the consideration seems to tell in favour of a neighbouring state or action while failing to tell in favour of the reaction itself, and offering it in deliberation seems somehow to spoil the very thing it is offered in favour of.

  Two cases I cannot sort, which is why I do not trust my own description. If I tell myself to trust my co-founder because the company will fall apart unless we trust each other and she has given me no positive evidence of untrustworthiness, that has the bad shape, and yet it strikes me as a perfectly respectable reason. And if I tell myself that starting out admiring someone will make me notice merits I would otherwise miss, and that admiring her is therefore a good idea, is that the bad shape too, or just an ordinary case of a consideration operating indirectly?

  So: does this configuration have a name — a label for considerations that count in favour of a reaction without bearing on what the reaction is about, or that look like reasons for wanting the reaction rather than for having it? If the nearest established concepts fit only imperfectly, tell me which they are, how each differs from what I have described, and which fits best. If nothing fits, coin the term yourself, define it, say what does the explaining (two kinds of reason? one kind plus a separate standard that reactions answer to? or not reasons at all, but causes and incentives wearing the costume of reasons?), and give me the boundary cases any definition would have to get right. I will not be satisfied with a bare label; I want the carving.

  Please put your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of what I have asked.
reasoning: |-
  Okay, let me tackle this user's query. They're describing a specific argument shape where practical reasons are given for an attitude (like forgiveness or belief), but these reasons feel misplaced—they're reasons to want the attitude, not reasons for the attitude itself. The user wants a term for this and a clear conceptual breakdown.

  First, I recall Bernard Williams' "internal and external reasons." Internal reasons are based on the agent's motivations, while external reasons are supposed to be objective. But here, the issue isn't about motivation but about the type of consideration fitting the attitude. Williams' distinction might not capture the exact problem.

  Then there's "wrong kind of reasons" (WKR) from literature on fitting attitudes. That seems closer. WKRs are reasons that don't bear on the object's properties but on the consequences of having the attitude. The forgiveness example fits: better sleep is a WKR because it doesn't address whether the father deserves forgiveness. Similarly, the startup belief-for-money is a classic WKR case.

  But the user's trust example complicates things. Trusting to avoid company collapse feels like a WKR, yet the user finds it respectable. This might be because practical necessity can sometimes override standard norms, or it involves a mix of reasons. The admiration case using strategic self-influence might be an indirect reason rather than WKR if it's epistemic.

  The challenge is explaining why some cases feel illegitimate while others don. The key is whether the reason relates to the object's properties (fittingness) or the attitude's consequences (benefits). Cases where consequences are the sole focus are WKRs, but when there's a connection to truth or fittingness, it's more acceptable.

  The user also needs boundary clarifications, like the trust case. I should note that practical pressures can create exceptions, but pure WKRs fail to justify the attitude intrinsically. The term "wrong kind of reasons" still fits best, with nuances explained for edge cases.
answer: |-
  **Bottom line: The term you seek is "wrong kind of reasons" (WKR), contrasting with "right kind of reasons" (RKR) or "fittingness reasons".**

  The core distinction is between reasons that bear directly on the *object* of a mental state (RKR) and reasons that bear on the *consequences* or *desirability* of *having* the state itself (WKR). RKRs justify the state by showing it is *fitting* or *correct* as a response to its object. WKRs justify *wanting* or *cultivating* the state due to its benefits or costs, but they do not (and cannot) make the state itself a fitting response to its object.

  1.  **The Distinction Explained:**
      *   **Right Kind of Reasons (RKR/Fittingness Reasons):** These speak to the properties of the *object* that make the reaction *appropriate*, *correct*, *warranted*, or *merited*. For forgiveness, RKRs are facts about the wrongdoer (e.g., remorse, apology, mitigating circumstances) that make forgiveness a fitting response *to them*. For belief, RKRs are evidence pertaining to the *truth* of the proposition. For admiration, RKRs are facts about the person's actual merits or achievements.
      *   **Wrong Kind of Reasons (WKR):** These speak to the *desirable consequences* (or avoidance of undesirable consequences) *of having* the state itself, independent of the object's properties. Better sleep (forgiveness), easier work life (admiration), or $100 (belief) are desirable outcomes *caused* by adopting the state. They are reasons to *desire* to have the state or to *bring it about*, but they say nothing about whether the state *correctly represents* or *appropriately responds to* its object.

  2.  **Applying to Your Cases:**
      *   **Forgiveness:** Your friend offered WKRs (better sleep, family harmony, cost of grudge). These are reasons to *want to forgive* or *act forgivingly*. The brother correctly identified the lack of RKRs – reasons showing the *father deserved* forgiveness (remorse, change, etc.). Generating the feeling *solely* from WKRs would create a simulacrum of forgiveness, not forgiveness grounded in a fitting response to the father.
      *   **Admiration:** Your colleague offered WKRs (easier life, appearing impressed). These are reasons to *act* impressed or *wish* you were impressed. They say nothing about the *director's actual merits* (RKR) warranting admiration.
      *   **Belief:** The $100 is a paradigmatic WKR. It's a reason to *want* the belief or *cause yourself* to have it. It provides zero evidence (RKR) about the startup's viability. Treating money as a reason *for* the belief confuses incentive with justification.

  3.  **Why it Feels Like a "Category Mistake" and "Spoils" the Reaction:**
      *   Deliberating using WKRs shifts focus from the *object* (father, director, startup proposition) to the *subject* (the forgiver, admirer, believer) and the *state's utility*. This instrumentalizes the attitude.
      *   Adopting an attitude *because* of WKRs divorces it from the properties of its object. The resulting state is inauthentic regarding its intentional content – forgiving *for sleep*, admiring *for ease*, believing *for money* fails to be *about* the father's deservingness, the director's merits, or the startup's truth. It becomes self-regarding, not object-regarding. This "spoils" it as the genuine article.

  4.  **Addressing Your Boundary Cases:**
      *   **Trust to Avoid Collapse:** This *is* a WKR. "The company will fall apart unless I trust" is a reason *to want* to trust or *to act* trustingly. However, the second part ("she has given me no positive evidence of untrustworthiness") *is* a weak RKR (absence of negative evidence). The "respectability" likely stems from:
          *   **High Stakes:** The catastrophic consequence makes the WKR overwhelming, potentially justifying *acting as if* you trust.
          *   **Pragmatic Necessity:** Sometimes maintaining a relationship *requires* adopting an attitude despite insufficient RKRs. We might call this "pragmatic trust," distinct from trust based solely on perceived trustworthiness (RKR).
          *   It's still primarily WKR-focused. If you thought she *was* untrustworthy (strong RKR *against* trust), the WKR wouldn't make trusting *fitting*, only perhaps necessary or prudent.
      *   **Admiring to Notice Merits:** This is **not** purely WKR. The *goal* (noticing merits) is epistemic. The consideration ("starting out admiring will make me notice merits") functions as:
          *   A RKR *for adopting a strategy* (open-mindedness, presuming goodwill).
          *   An *indirect* RKR for admiration *if* the strategy succeeds – the *merits you later notice* become the direct RKRs. The initial "admiration" is more a heuristic or posture adopted *for the sake of* discovering genuine RKRs. It avoids being a pure WKR because the benefit cited (noticing merits) is intrinsically linked to discovering the *actual fittingness* of admiration.

  5.  **Explanatory Framework:** The distinction arises because certain mental states (belief, emotion, intention) are constitutively *evaluative* or *representational*. They are *about* the world and purport to *fit* it (belief to truth, emotions/attitudes to value properties). Reasons justifying them must bear on this fit. WKRs, concerning the state's consequences, are fundamentally different: they are reasons for *action* (cultivating a state) or *desire* (wanting a state), not reasons showing the state *correctly represents* or *responds to* its object. They are incentives or causes masquerading as justifications for the state *qua* evaluative response. The standard reactions answer to is *fittingness* or *correctness* relative to their object. WKRs fail to engage with this standard.
