prompt: |-
  I'm a retired physical chemist — 35 years of doing spectroscopy and zero philosophy, and now I'm two years into sitting in on a reading group at the local university and reading around on my own. I've got stuck on the chapter about utility and revealed preference in one of those pop-econ books (the kind that explains everything with beer and pizza), and I can't tell how much of it to trust. Here's roughly what it says, as close as I can reconstruct it:

  "Economists used to think utility was a real thing in your head — a quantity of pleasure or satisfaction that a good produces — and they tried to measure it by asking people how much they enjoyed things. Samuelson said this isn't science: you can't observe somebody's pleasure, you can only observe what they do. So he turned the definition around. If a person picks A in a situation where B was also available, that just is what it means to prefer A to B. Utility then becomes a bookkeeping device, a number attached to each bundle that goes up exactly when the chooser goes for that bundle, and nothing more. Two things follow. First, the numbers themselves carry no information: any relabeling that leaves the ordering intact gives you exactly the same theory. That's why economists call utility ordinal, and why it's strictly meaningless to compare one person's utility with another's. Second — and this is the honest part — the theory can never be refuted. Whatever anybody chooses, you can always cook up some utility function that makes that choice a maximum, so 'utility maximization' tells you nothing about the world. The only discipline comes from the weak axiom of revealed preference: if you take A when B is on offer and also take B when A is on offer, you're being inconsistent. And that axiom is both necessary and sufficient for a body of choices to be describable as maximizing some utility function. Given all this, modern economics simply drops the idea of an underlying preference: what's good for a person is what that person would choose, and cost-benefit analysis based on what people actually pay is the only scientifically respectable way to talk about welfare. Asking what somebody really prefers, deep down, is either a disguised question about their choices or not a question at all."

  Two things are nagging me and I'm not shure whether I'm importing the wrong intuitions from the lab.

  First, the ordinality claim. In my old work a quantity that's defined only up to a monotone transformation wasn't meaningless, it just carried less structure than people assumed — and sometimes you could recover more structure by adding assumptions (additivity across independent things, invariance under a group of operations, that sort of trick). Someone in the group told me that once you let people choose under risk, utility stops being freely rescalable and becomes pinned down only up to positive affine transformations, so "any relabeling that keeps the order" can't be right in general. If that's so, the book's step from "ordinal" to "comparing utilities across people is meaningless" looks like it's leaning on a slogan rather than a result.

  Second, it says the theory has no empirical content and then, two paragraphs later, hands me a test. Those pull in opposite directions, and my guess is the book is confusing two different claims — something like "there exists a utility function that represents your choices" versus "your choices satisfy these axioms" — but I can't quite articulate which one is doing the work. There's also a passage I keep circling back to: it says modern economics drops the idea of an underlying preference, which sounds odd to me, because the whole point of the axioms seems to be that if your choices are consistent enough then they do reveal something underneath. That's what I'd have thought "revealed" meant.

  Here's the case I keep testing it on. My neighbour always buys the cheap shoes, and she says she'd rather have the good ones but they never fit the budget. The book's logic seems to commit her to preferring cheap shoes, full stop, and therefore to being no worse off than she would be with the expensive ones. Is that really what the theory says, or does the fact that she's choosing from different budget sets matter?

  So: could you go through the passage claim by claim and tell me what a careful microeconomic theorist or a philosopher of economics would happily sign off on, what they'd wince at as a simplification, and what is just wrong? I especially want to know whether the punchline survives the corrections — both the "welfare just is choice" bit and the bit about money-metric cost-benefit being the only respectable welfare measure, since those two seem to me to be in tension with "the numbers carry no information."

  And one last thing, tell me if this framing I invented is on the right track or whether it smuggles something in: maybe revealed preference isn't a theory of welfare at all but a measurement theory — like in my lab, where the meaning of a reading is fixed by the operations that produce it plus the class of transformations that leave the description unchanged. On that reading the "meaning of utility" is whatever survives the admissible rescalings: order under certainty, affine structure under risk, something else again if you insist on pricing everything in dollars. Is that fair, or does it paper over the part where welfare is supposed to come in?

  I dont have library access out here and I'm not asking for a reading list or who said what — I want the shape of the arguments, reasoned out, plus a verdict on whether the book sold me something defensible.
reasoning: |-
  Okay, let me tackle this retired physical chemist's question. They're grappling with revealed preference theory from a pop-econ book and have two main concerns: ordinal utility claims and the theory's empirical content. 

  First, the ordinality issue. The book claims utility is "freely rescalable" but that's oversimplified. Under risk, we need affine transformations to preserve expected utility properties. The "utility comparisons across people are meaningless" conclusion still holds though - even with cardinal utility, interpersonal comparisons lack scientific basis. 

  The empiricism point is where the book really trips up. Revealed preference theory does have testable content through consistency axioms like WARP. The "theory can never be refuted" claim is flat wrong - inconsistent choices falsify it. The book confuses existence proofs (can we represent choices with utility?) with testable restrictions (must choices satisfy consistency?).

  The shoe example reveals deeper problems. The book's interpretation that "choosing cheap shoes means preferring them" ignores budget constraints. Revealed preference carefully distinguishes preference from choice sets. The neighbor's case shows why we need to model choice as constrained optimization.

  On welfare: the "welfare just is choice" view is indeed the hardline revealed preference position, but many economists see it as a useful measurement tool rather than ontological claim. The money-metric approach has well-known limitations when prices change or incomes differ.

  The measurement theory framing is spot-on. Revealed preference establishes what we can infer from choices under given assumptions. Like any measurement, its meaning depends on context - certainty vs risk, individual vs social decisions.

  The book mixes defensible ideas with serious errors. Its core failure is presenting revealed preference as having no empirical content while simultaneously offering a test. That contradiction undermines its credibility. A better pop-econ book would emphasize that consistency axioms make the theory falsifiable and useful.
answer: |-
  Your instincts are sharp, and your framing is insightful. The book oversimplifies and misrepresents key aspects of revealed preference theory (RPT). Let's break it down claim-by-claim, separating defensible ideas from wince-worthy simplifications and outright errors. A careful theorist would respond as follows:

  **1. "Utility isn't a real mental quantity, only choices are observable."**
  *   **Defensible:** This is the core *methodological* stance of RPT. Samuelson rightly argued that basing economics on unobservable "mental states" (like cardinal pleasure) is unscientific. Observed choices are the primary data.
  *   **Wince-worthy:** It sometimes implies *no* mental state exists, which is a philosophical claim beyond economics. RPT is agnostic – it *models* choice *as if* maximizing utility, without claiming that's the literal neurological process.
  *   **Verdict:** Mostly correct as a foundational principle for building testable models.

  **2. "Preference is defined by choice: Choosing A over available B means preferring A to B."**
  *   **Defensible:** This is the operational definition of preference within RPT. "Preference" is a summary of choice behavior.
  *   **Wince-worthy:** It ignores context. Your neighbor's choice ("cheap shoes") *only* reveals she prefers cheap shoes *over the specific expensive shoes available*, *given her current budget constraint and the prices at that moment*. It does *not* reveal she prefers cheap shoes *in general* or *under all circumstances*.
  *   **Verdict:** Correct within its specific, narrow operational definition, but easily misinterpreted.

  **3. "Utility is just a bookkeeping device, ordinal, only order matters. Comparing utilities across people is meaningless."**
  *   **Defensible:**
      *   Under certainty (choosing between sure things), utility is indeed ordinal. Any monotonic transformation preserves the choice ordering. The specific numbers (e.g., U(apple)=5, U(orange)=10 vs. U(apple)=100, U(orange)=101) carry no independent meaning beyond ranking.
      *   Comparing utility *levels* across individuals *is* generally considered meaningless within standard RPT. There's no observable "util-meter" to calibrate different people's scales.
  *   **Wince-worthy/Incorrect:**
      *   Your colleague is **absolutely right** about risk. Under uncertainty (choices involving lotteries/gambles), the von Neumann-Morgenstern (vNM) framework requires utility to be cardinal (unique up to positive affine transformations: U' = aU + b, a>0) to represent preferences over lotteries in a way that satisfies the independence axiom. The book's "any relabeling that keeps the order" is **wrong** in this context. The *ratios of differences* have meaning (e.g., risk aversion).
      *   "Ordinal" doesn't mean *no* structure. As you noted, adding assumptions (like separability, homotheticity) imposes more structure, allowing meaningful statements about marginal rates of substitution, elasticities, etc., even under certainty.
  *   **Verdict:** Oversimplified and partially incorrect. Ordinality under certainty is correct, but the general claim ignores the cardinal structure under risk. The "no interpersonal comparison" conclusion holds, though, as even vNM utility lacks an interpersonally comparable zero point or unit.

  **4. "The theory can never be refuted. You can always cook up a utility function."**
  *   **Incorrect:** This is the book's most serious error and contradicts its own later point about WARP.
  *   **Defensible:** For a *single* observed choice (A chosen, B available), you can *always* define a utility function where U(A) > U(B). A single choice imposes no testable restrictions.
  *   **Crucial Correction:** The testability comes from observing *many choices across different situations*. The Weak Axiom of Revealed Preference (WARP) and the Strong Axiom of Revealed Preference (SARP) are **falsifiable restrictions** on choice behavior. If you observe:
      *   Choice Set 1: {A, B} available -> A chosen (implying A ≻ B)
      *   Choice Set 2: {A, B} available -> B chosen (implying B ≻ A)
      ...this directly violates WARP and **refutes** the hypothesis that choices are consistent with *any* stable preference ordering. You *cannot* construct a utility function representing these choices. Similarly, SARP handles longer chains of choices.
  *   **Verdict:** **Wrong.** The existence of a utility representation requires consistency (WARP/SARP/GARP), which *is* testable and *can* be refuted by inconsistent choices. The book confuses the existence proof *given consistency* ("if consistent choices, then a utility function exists") with the testability of the consistency requirement itself.

  **5. "The Weak Axiom (WARP) is necessary and sufficient for a utility function."**
  *   **Wince-worthy:** WARP is necessary and sufficient only for choices over *pairs* of bundles to be representable by a utility function. For larger sets or continuous choices (like standard budget sets), stronger conditions (like SARP or GARP - Generalized Axiom of Revealed Preference) are needed to guarantee the existence of a *well-behaved* (e.g., continuous, monotonic, quasi-concave) utility function.
  *   **Verdict:** Oversimplified but captures the core idea that consistency axioms are the testable heart of the theory.

  **6. "Modern economics drops the idea of underlying preference. Welfare is defined by choice."**
  *   **Defensible:** This represents the *hardline revealed preference* or *behavioralist* position. It views "preference" *only* as a construct summarizing choices, not as an independent mental entity. Welfare analysis then seeks to infer well-being *only* from observed choices (e.g., compensating variation, equivalent variation, money-metric utility).
  *   **Wince-worthy/Controversial:**
      *   Many economists (even those using RPT) believe choices *reveal* underlying stable preferences (tastes, values) that exist independently. The axioms ensure choices are *consistent with* such preferences.
      *   "Welfare is defined by choice" is highly contentious. Your neighbor's example exposes the problem: **The book's logic misapplied would indeed say she "prefers" cheap shoes.** But careful RPT *doesn't* say this! It recognizes her choice is *constrained*. Her *underlying preference* (for durable shoes) is revealed by her *hypothetical* choices ("If I had more money, I'd buy expensive shoes") or by choices in *different budget sets*. Modern welfare economics uses choice data *across different constraints* to infer underlying preferences and assess how changes (e.g., price increases, income drops) affect well-being *given those preferences*. Money-metric measures attempt to quantify this welfare change.
      *   "Only scientifically respectable way" is dogmatic. Other approaches (e.g., using subjective well-being surveys, capability approaches) exist, though RPT argues they lack the rigor of choice-based inference.
  *   **Verdict:** Represents a specific, influential, but philosophically loaded and contested viewpoint within economics. It's not the *only* view, and its application requires careful handling of constraints (unlike the book's simplistic take on your neighbor).

  **7. "Cost-benefit analysis based on what people actually pay is the only respectable welfare measure."**
  *   **Defensible:** Using choice data (e.g., market prices, willingness-to-pay from surveys) to value goods/services is a powerful and widely used tool in applied welfare economics (e.g., environmental valuation, policy evaluation). It grounds valuation in observable behavior.
  *   **Wince-worthy/Incorrect:**
      *   "Only respectable" is extreme and ignores valid critiques and alternatives.
      *   **Major Limitation:** Money-metric measures (like compensating variation) depend on prices and income. Comparing welfare *across people* with different incomes using money is problematic (does $100 mean the same to a billionaire and a beggar?). While RPT avoids interpersonal utility comparisons, cost-benefit analysis often *requires* aggregating monetary valuations across individuals, implicitly making interpersonal comparisons of *money's worth*, which is controversial.
      *   It struggles with non-market goods, future generations, irrationality, changing preferences, and situations where choices don't reflect true well-being (e.g., addiction, misinformation, lack of autonomy).
  *   **Verdict:** An important and widely used tool, but its claim to be the *only* respectable measure is overstated, and it faces significant practical and theoretical challenges, especially regarding interpersonal comparisons and aggregation.

  **Your Framing: Revealed Preference as Measurement Theory**
  *   **Spot On!** This is an excellent and accurate way to conceptualize it.
      *   **Operationalism:** RPT defines "preference" and "utility" through the measurement operation: observed choice under specific constraints.
      *   **Invariance:** The admissible transformations (monotonic under certainty, affine under risk) define the level of measurement (ordinal vs. interval scale) and what statements are meaningful (e.g., "A is preferred to B" is meaningful; "A provides twice the utility of B" is not, under certainty).
      *   **Context Dependence:** Just like in the lab, the "meaning" (the scale and what it represents) depends on the experimental setup/assumptions (certainty vs. risk, completeness of choice sets, stability of preferences).
  *   **Does it "Paper Over" Welfare?** Not inherently. Within this framework, "welfare" is operationalized as "what is revealed through choice under constraints." It defines what *can be measured* scientifically via choice data. It doesn't deny other concepts of welfare might exist philosophically; it states that *this* is the scientifically measurable aspect using the chosen instrument (choice observation). The tension with "numbers carry no information" is resolved by recognizing that different measurement contexts (certainty/risk) allow different types of numerical information to be meaningful.

  **The Punchline & Your Neighbor's Shoes:**
  1.  **Does "welfare just is choice" survive?** The *hardline behaviorist interpretation* ("preference *is* choice") survives only as one philosophical stance. The *methodological core* ("we model choice *as if* maximizing utility inferred from choices, and *define* welfare changes based on those revealed preferences under constraints") is robust and widely used. Your neighbor's case shows the necessity of constraints: her choice reveals her preference *within her budget set*, not unconditionally. Careful RPT uses choices *across different constraints* to infer her underlying preference for shoe quality.
  2.  **Does money-metric CBA survive as the "only respectable" measure?** No. It survives as a *major, powerful, and often best* tool for many applied problems grounded in choice data. However, its limitations (interpersonal aggregation, non-market goods, behavioral issues) are well-recognized, and it is not the *only* approach considered respectable, even within mainstream economics.

  **Verdict on the Book:** It sold you a mix.
  *   **Defensible Core:** The shift from unobserved utility to observed choices, the ordinal nature of utility under certainty, the non-comparability of utility across people, the role of consistency axioms (though misstated), and the use of choice data for welfare are all important and largely correct foundations.
  *   **Serious Errors:** The claim that the theory has no empirical content is flatly wrong. The misunderstanding of the neighbor's choice reveals a failure to grasp budget constraints. The conflation of ordinal utility under certainty with cardinal utility under risk is a significant omission.
  *   **Oversimplifications & Dogmatism:** The presentation of "preference is choice" and "money-metric CBA is the only way" as uncontested truths ignores nuance, debate, and limitations within the field.

  Your background in measurement theory provides precisely the right lens. Revealed preference is fundamentally about building scientifically tractable models of choice behavior and welfare inference based on observable data, understanding the structure (and limitations) those measurement operations impose on the concepts used.
