prompt: |-
  I'm a PhD student in behavioural economics, and the second section of my dissertation chapter argues that present-biased discounting models and the philosophical notion of weakness of will are tracking two different things. I need one case that establishes this by construction rather than by assertion, and I would be grateful if you would build it for me to the specifications below.

  The machinery, so we do not talk past each other. Quasi-hyperbolic discounting: a payoff dated t periods ahead is weighted βδ^t for t ≥ 1 and 1 for t = 0, with 0 < β < 1, so whatever falls in the present period receives a premium relative to exponential discounting. Call this the immediacy premium. The criterion I want to test it against: an agent is weak-willed at a time just in case she freely and intentionally does B while judging then — at the time of action, all things considered, under no coercion, ignorance or inability — that doing A would be better. The judgment must be contemporaneous with the action; having earlier planned or ranked A first is not enough.

  Specifications for the case. (i) An ordinary professional setting — a ward, a lab, a studio, a court — one episode, no addiction, no psychiatric diagnosis, no literal multiple selves or two-systems machinery, no forgetting, no self-deception, and no stipulating that anyone judges anything; every judgment must be motivated by reasons the scenario actually gives the agent. (ii) Two colleagues facing the same option pair: A costs effort now and pays off more later, B pays off less now. Their discount parameters are identical, and are estimated from unrelated monetary intertemporal choices rather than inferred from their behaviour in this episode; pick β and δ and state them. At t1 both form unconditional intentions to do A with equal deliberative seriousness; at t2 both do B. (iii) Agent 1 satisfies the criterion: at t2 she still judges A better, all things considered, and does B anyway, freely and intentionally. Motivate this rather than assert it — I want the reason she judges A better to be one that survives her doing B. (iv) Agent 2 does not satisfy the criterion: between t1 and t2 she acquires a piece of information that bears on the A-versus-B comparison and is not a report about how aversive A feels now, and at t2 she judges B better on reflection. The constraint that makes this hard: the information must not suffice on its own. With the information in hand but β set to 1, she would still rank A first; the flip requires the immediacy premium. So present-bias is doing genuine causal work in her choice while the criterion still acquits her. If you think no such case can be built, say so inside item 1 and build the strongest version you can regardless — I would rather have a case than a concession.

  Format. Exactly five numbered items, no preamble, no headings inside items, no closing remark. Item 1 is the scenario, a single paragraph of at most 120 words. Items 2 to 5 are at most two sentences each and do the following, in order: (2) both agents' β and δ, the dated payoffs of A and B (yours to choose), what the model predicts for each agent at t1 and t2, and one clause on why no re-parameterisation of the model can separate them; (3) the criterion's verdict on each agent, the reason agent 1's defection is akratic rather than a change of mind, and the reason acquitting agent 2 does not collapse into trusting a report the model predicts to be unreliable; (4) the single structural feature doing the work, plus both removal tests — delete the information, and set β to 1 — with what each does to the two verdicts; (5) the strongest reply available to someone who wants present-bias to be the whole story, and whether that reply is ad hoc or shows my argument needs a stronger case than this one.
reasoning: |-
  Hmm, the user is a PhD student in behavioral economics working on their dissertation. They need a constructed case study to show that present-biased discounting models and philosophical weakness of will track different phenomena. This is quite specific and technical.

  The user provides very clear specifications: the scenario must be in an ordinary professional setting without any exotic elements like addiction or multiple selves. Both agents must have identical discount parameters (β and δ), form the same intention at t1, but defect to B at t2. The key challenge is making Agent 1 satisfy the weakness of will criterion (contemporaneous judgment that A is better while choosing B), while Agent 2 flips her judgment due to new information that only works because of present bias.

  I'm considering an academic setting for familiarity. Let's have both researchers face a choice between preparing a conference paper (A, costly now but better later) versus writing a blog post (B, easier now but less valuable). The new information for Agent 2 could be learning that the conference deadline might be extended - not decisive on its own, but combined with present bias makes B seem better.

  For the discounting parameters, I'll use β=0.8 and δ=0.95 - standard values that create present bias. The payoffs need to show that with β=1 (no present bias), A would still be preferred even with the new information. This is crucial for showing present bias does causal work without meeting the weakness criterion.

  The structural feature doing the heavy lifting is the information being non-decisive alone. Removing it should make Agent 2 stick to A, while removing present bias (β=1) should make her choose A even with the information. This creates the needed separation.

  I should anticipate objections too. Someone might argue that present bias causes the judgment shift through attention redirection. But that seems ad hoc since the information is about external facts, not internal states. The case holds if we maintain a clear distinction between judgment and motivational influence.
answer: |-
  1.  Dr. Chen and Dr. Rossi, both epidemiologists, have a 4 PM deadline to submit either a detailed grant application (A) requiring focused afternoon work for high future funding chances, or a quick letter of intent (B), feasible before 4 PM but yielding lower future funding odds. At 1 PM, both seriously intend to write A, valuing the larger payoff. At 3 PM, a colleague casually mentions the main grant reviewer dislikes complex methodology sections (a key part of A but not B). Both find A suddenly feels much more aversive. Chen, despite now judging A overall better (higher expected funding justifies the effort), freely writes B anyway, avoiding the unpleasant task. Rossi, influenced by the news making A seem riskier, judges B better now, considering the immediacy premium, and writes B.

  2.  β = 0.8, δ = 0.95. A: Cost = -5 utils at t2, Payoff = +20 utils at t3. B: Cost = -1 util at t2, Payoff = +5 utils at t3. Model predicts both intend A at t1 (U_A = (0.8)(0.95)^1*(-5) + (0.8)(0.95)^2*20 ≈ -3.8 + 13.7 = 9.9 > U_B = (0.8)(0.95)^1*(-1) + (0.8)(0.95)^2*5 ≈ -0.76 + 3.42 = 2.66). At t2, both choose B (U_A_now = -5 + (0.8)(0.95)^1*20 = -5 + 15.2 = 10.2, U_B_now = -1 + (0.8)(0.95)^1*5 = -1 + 3.8 = 2.8; U_B_now > U_A_now). The model cannot separate them because identical parameters and identical revealed preferences imply identical discounting structures.

  3.  Chen satisfies the criterion: at t2 she judges A better (the reviewer's bias doesn't negate A's higher expected value, justifying the effort) yet freely/intentionally does B. Rossi does not: the reviewer information bears on the risk/reward (non-aversiveness report), and at t2 she judges B better overall. Acquitting Rossi doesn't trust an unreliable report; the information provides a genuine (if insufficient without discounting) reason for reassessment.

  4.  The structural feature is Rossi's acquired information (reviewer bias) being non-decisive alone. Remove it: Rossi sticks with A at t2. Set β=1: With β=1 and the information, Rossi prefers A at t2 (U_A_now = -5 + (1)(0.95)*20 = 14, U_B_now = -1 + (1)(0.95)*5 = 3.75), so she does A; Chen still does B regardless.

  5.  The strongest reply is that present-bias *causes* Rossi's judgment shift via attentional capture on the new risk under time pressure, making her judgment akratic too. This is ad hoc: it requires stipulating her judgment isn't genuine without evidence in the case, contradicting the specification that the judgment is motivated by the scenario's reasons.
