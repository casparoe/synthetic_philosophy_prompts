prompt: |-
  I sit on my university's student health benefits committee, and we have now spent two meetings failing to write down what we think we are already doing. Everyone agrees on the slogan — the plan pays for treatment, not for enhancement — but every attempt to turn the slogan into a rule founders on the same question: a baseline relative to what? Here is roughly where we landed, and I want to know what position we have accidentally signed ourselves up for. The draft says the plan covers any intervention whose aim is to return a student to the functional level they would have occupied but for a specific identifiable setback — an illness, an injury, a congenital condition, a diagnosed disorder — or to prevent such a setback; and that it does not cover interventions aimed at lifting a student above that counterfactual level. Then come the items we could not bring ourselves to exclude and therefore wrote in by hand: contraception and fertility treatment; vaccines; correction of ordinary age-related decline such as presbyopia, hearing loss and cataracts; help for conditions that are statistically entirely normal in our student population, including short stature with no hormone deficiency and moderate anxiety; and academic accommodations such as extra exam time. And then the items we did exclude: cosmetic procedures that improve on a student's pre-existing appearance, stimulant medication for a student with no diagnosis, and coaching that mainly raises a competitive score rather than any underlying capacity.

  What bothers me is that the handwritten exceptions seem to eat the rule. If we pay for reading glasses, then the relevant normal is not the species-typical function of a fifty-five-year-old but some youthful baseline that almost nobody of that age actually meets, so we are not restoring normal function in the statistical sense at all. If we pay for help with conditions that are statistically normal, we are not even restoring what is typical for the student's age group. If we pay for vaccines we are routinely raising people above anything unaided nature would have given them, which is the thing the rule says we don't do. And the two exclusions cut against each other: extra exam time and score-focused coaching both make a student better off in a competitive, roughly zero-sum contest, yet we fund one and refuse the other on the grounds that only the second is an advantage — even though extra exam time does not restore any capacity in the student, it changes the test, which looks like neither therapy nor enhancement but a third thing our slogan has no room for. Worst of all, our counterfactual-self baseline seems to make responsibility irrelevant: a student who destroyed their own hearing with loud headphones gets the same coverage as one born hard of hearing, while the same university happily bills students for equipment they break and runs an entire conduct system premised on holding people responsible for what they brought on themselves. A friend on the committee also pointed out that for congenital conditions the but-for self is someone who would have been a different person entirely, so our rule may be quietly relying on some view about who counts as the same individual across counterfactual variation.

  So: what theory of the therapy/enhancement distinction, or of what medicine is for, does a policy like ours actually presuppose? Please reconstruct the implicit view, tell me which parts of it the policy strictly requires and which are merely a comfortable fit, say whether the parts are consistent with one another, and let me know how much of the same policy a rival theory — a welfare-based one, a threshold or capabilities-based one, a view that makes compensation for bad luck central, or a normal-function view — could equally have produced, and what in the document would have to be rewritten if we swapped our implicit theory for one of those. Don't give me reading lists or citations; I want the argument, and I have no way to check references anyway.

  Please structure the reply with the following sections, in this order: "The implicit theory" (about 250 words), "Strict presuppositions vs. comfortable fits" (about 150 words), "Where the handwritten exceptions bite" (about 200 words), "Rival theories that would sign off anyway" (about 150 words), "What would have to change" (about 150 words), and "Bottom line" (about 75 words).
reasoning: |-
  Hmm, the user is on their university's student health benefits committee, struggling to define the boundary between therapy and enhancement. They've drafted a rule based on restoring a "but-for" counterfactual baseline but find their handwritten exceptions—like contraception, vaccines, reading glasses, and academic accommodations—seem to contradict the core principle. They're frustrated because exclusions like cosmetic procedures and stimulants without diagnosis create inconsistencies, and they worry the policy ignores personal responsibility or relies on vague identity assumptions for congenital conditions.

  The user wants me to reconstruct the implicit theory behind their policy, analyze its strict vs. comfortable elements, explain how exceptions undermine it, identify rival theories that could justify similar outcomes, suggest changes for adopting alternatives, and conclude with a bottom line. They need a structured, argument-focused response without citations.

  The core tension is between their "restorative" slogan and pragmatic inclusions that actually enhance or normalize beyond natural states. Vaccines prevent disease but create artificial immunity; reading glasses compensate for aging—a universal decline, not a setback. Academic accommodations alter testing environments rather than restoring capacity, blurring lines with excluded coaching. This suggests their implicit theory isn't purely medical but incorporates social participation and age-adjusted functioning. 

  For the implicit theory section, I'll argue they presuppose a hybrid "flourishing baseline" where medicine aims to enable typical life participation, not just biological normalcy. Their exceptions reveal unspoken priorities: fertility treatments support life planning, vaccines enable public engagement, age-related corrections maintain age-group-typical function despite statistical norms. The exclusions (cosmetic procedures, undiagnosed stimulants) reinforce that interventions must be tied to recognized health needs, not preferences or competitive edges. However, the exam-time exception contradicts this by providing a competitive advantage, showing inconsistency.

  In "strict presuppositions," the counterfactual baseline is essential but flawed—it strictly requires setbacks as coverage triggers, yet loosely fits congenital conditions by assuming continuity of identity. Responsibility isn't strictly required, as seen in covering self-inflicted hearing loss, but the committee might comfortably prefer it ethically. 

  The "exceptions bite" hardest on vaccines (explicit enhancement), age-related decline (rejects statistical norms), and academic accommodations (neither therapy nor enhancement). These force the policy to prioritize functioning over naturalness. 

  Rival theories could endorse most inclusions: normal-function views accept vaccines as preventive care; capabilities thresholds cover accommodations as enabling education; bad-luck compensation explains covering self-inflicted harm. But cosmetic exclusions align only with strict normal-function views, while welfare-based theories might accept them. 

  To adopt a rival theory, they'd need to redefine the baseline—e.g., for capabilities, specify core functionings like education, dropping "but-for" language. Including responsibility would mean excluding self-caused conditions, which contradicts current hearing-loss coverage. 

  Bottom line: Their policy is a messy but functional compromise, prioritizing student flourishing over theoretical purity. To reduce contradictions, they should explicitly anchor to capabilities like academic participation, not counterfactuals.
answer: |-
  ### The implicit theory
  Your policy presupposes a **capability-adjusted flourishing baseline theory**. Medicine's purpose here is not to restore species-typical function or statistical norms, but to enable students to function at the level expected for their age-group and social role (university participation). The "but-for" counterfactual isn’t a biological default but a *contextual* baseline: "What capabilities would this student reasonably possess to engage in university life, absent specific health setbacks?" This explains covering age-related decline (expected function for a *student*, not a 55-year-old), vaccines (necessary for communal campus life), and anxiety treatment (barrier to academic functioning). Enhancements are interventions exceeding this socially anchored capability threshold. The exclusions (cosmetics, non-diagnosed stimulants) reinforce that medicine should address barriers to flourishing in one's role, not optimize traits for competitive advantage.

  ---

  ### Strict presuppositions vs. comfortable fits
  **Strictly required:**  
  - Health interventions must link to a "setback" (illness, injury, etc.).  
  - Coverage is tied to restoring/preserving capabilities for academic participation.  
  - The counterfactual baseline is individualized but context-bound (campus life expectations).  

  **Comfortable fits:**  
  - Ignoring responsibility for self-inflicted conditions (e.g., headphone-induced hearing loss) – consistent but not essential.  
  - The personhood assumption for congenital conditions (identity persists across counterfactuals) – necessary but philosophically unexamined.  
  - Distinguishing "competitive advantage" (excluded coaching) from "participation enablers" (included exam time) – aligned but not inevitable.  

  ---

  ### Where the handwritten exceptions bite
  The exceptions explicitly reject key tenets of traditional therapy/enhancement distinctions:  
  - **Vaccines** defy "unaided nature" by providing artificial immunity, showing your baseline is *socially required function*, not biological default.  
  - **Age-related corrections** (reading glasses) prioritize *age-group expectations* (youthful vision) over statistical norms (typical 55-year-old decline).  
  - **Statistically normal conditions** (short stature) are covered if they impede university functioning, confirming the baseline is *academic capability*, not population health.  
  - **Academic accommodations** (extra exam time) are neither therapy nor enhancement but *environmental adjustments* – revealing that your "treatment" includes altering contexts to enable participation.  
  - **Contraception/fertility** treats reproductive control as health-related flourishing, not enhancement.  

  These collectively reframe "therapy" as *capability support for student life*, not biological restoration.  

  ---

  ### Rival theories that would sign off anyway
  - **Capabilities approach** (Nussbaum/Sen): Would endorse all inclusions (focus on enabling core functionings like education, health, affiliation) and likely exclude cosmetic enhancements.  
  - **Bad-luck compensation**: Would cover congenital conditions and self-inflicted hearing loss equally (both "misfortune") and support vaccines/preventive care – but might question routine anxiety treatment.  
  - **Normal-function view** (Boorse): Could justify vaccines (prevent pathology) and age-related corrections (restore age-typical function) but *not* non-pathological short stature or academic accommodations.  
  - **Welfare-based view**: Might accept all inclusions (if they improve well-being) but could also justify cosmetic procedures or stimulants.  

  Your policy aligns closest with capabilities or bad-luck theories but diverges from strict normal-function.  

  ---

  ### What would have to change
  - **For a capabilities approach**: Delete "but for a setback" – instead define coverage for interventions supporting core capabilities (e.g., "enabling academic participation, health, or social inclusion").  
  - **For bad-luck compensation**: Add responsibility clauses (e.g., exclude "foreseeable self-inflicted conditions") and clarify congenital luck vs. situational disadvantage.  
  - **For normal-function**: Exclude non-pathological conditions (short stature), age-related decline (unless "abnormal" for age), and academic accommodations; strictly require diagnostic codes.  
  - **For welfare-based**: Remove "setback" language; cover any well-being-boosting intervention (likely including cosmetics or stimulants).  

  ---

  ### Bottom line  
  Your policy covertly adopts a **contextual capabilities baseline** – medicine exists to support student flourishing, not biological normalcy. The exceptions aren’t flaws but proof: you prioritize enabling academic participation over theoretical purity. To reduce friction, explicitly anchor coverage to "university-functioning capabilities" and drop the unstable "but-for" framing.
