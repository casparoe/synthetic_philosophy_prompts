prompt: |-
  Hi — I'm a novelist, and I'm in the middle of an email argument with my German translator that I am definately losing, mostly because I keep saying things like it just has to feel the same and she keeps replying with very reasonable questions I can't answer. The problem is a poem in my new novel. It's a lullaby the narrator's dead sister supposedly wrote: three quatrains, four beats to a line, every rhyme landing on a feminine ending (the sort of -ée / schwa-tail thing you get in French and don't really get in English, let alone German), the first letter of each of the twelve lines spelling out HELENA if you read straight down, and a refrain that comes back wrong at the end. My translator wants to do it in free verse, drop the acrostic and put in an alliterative pattern on the H instead, and add a footnote explaining what the original did. My publisher thinks the footnote is a great idea. I think the whole book falls apart if the poem stops being a thing that has a shape — and I can't say why in a way that survives her next email.

  There's a further wrinkle that's making me care about this more than I expected: the poem appears three times in the novel, and each time another line of it has gone missing, because the narrator is forgetting her. By the third appearance the final rhyme-word has been replaced by a dash. So whatever you think a translation preserves, it has to be the kind of thing that can be subtracted from in the same places: a version that only works if it's intact is no use to me, because the novel's whole point is that it comes apart. Oh, and the German publisher has now asked whether the lullaby can be made singable, since the audiobook is going to have a setting of it, and the Italian one is muttering about prose. I've been reading Hofstadter's Le Ton beau de Marot: In Praise of the Music of Language (1997) in the mornings, which I love and which has also failed to settle anything, partly because his own answer seems to be to produce eighty versions and let the reader see the family resemblance — and partly because the title is itself a pun on le tombeau de Marot, tombeau in the old sense of a piece made in memory of someone dead, which is about as far from a decision procedure as you can get.

  So what I actually want is the spec, not the survey. Write me the desiderata: what would a theory of translation under formal constraint have to deliver to be worth anything — which cases it has to get right, each with the case behind it, which distinctions it must respect rather than collapse, and which bits of what people demand are real requirements and which are just the prejudices of one camp. Things I want explicitly handled rather than gestured at: what the unit of translation even is (word? line? whole? the constraint set itself?); whether preserving a feature and compensating for it somewhere else are the same achievement or different ones; whether a translation that needs footnotes has failed; what counts as the same poem, i.e. whether my German lullaby is my lullaby, a new poem after mine, or an imitation of it; whether the reader the translation owes something to is the monolingual German reader, for whom this is the only version there is, or the bilingual one who can see what got lost; how you handle a formal feature that's doing semantic work, like the rhyme that goes missing when the narrator's memory does; forms that are structural rather than audible, like acrostics and fixed forms and poems whose shape on the page is the point; and the case where the target language simply has fewer or more resources for a given constraint. Mark which desiderata are non-negotiable and which are preferences, tell me which pairs you think can't be jointly satisfied — my suspicion is that something like preserve every formal feature / preserve every semantic feature / produce a poem that actually works in the target tradition is a trilemma, but you tell me — and say which single requirement does the most damage to the popular theories. Please don't just conclude that it's a trade-off between form and content, I've read that sentence a hundred times. You can score the usual stances against your list at the end — literalism, dynamic equivalence, imitation, thick translation with notes, the fluent-invisible-translator position, functionalist or skopos-style approaches — but keep it short and keep the weight on the criteria and the cases, since the criteria are the bit I can actually use in an argument with my publisher. Aim for roughly 1100-1300 words, prose rather than bullet soup, though a small table is fine if it earns its place; no bibliography needed, I can't chase references anyway. And please write it in British English — I'm in the UK and teh style sheet at my publisher is absurdly strict about -ise endings.
reasoning: |-
  Okay, the user is a novelist embroiled in a translation dispute over a structurally complex poem in their book. They need a rigorous framework to argue why formal constraints matter, not just platitudes about "form vs content."  

  Hmm, their core frustration is palpable: they know intuitively the poem's mechanics (acrostic, decaying rhymes) are semantically loaded but lack the vocabulary to defend this against a pragmatic translator. The Hofstadter reference suggests they've done homework but need actionable theory, not philosophy.  

  First, unpack their implicit stakes:  
  - The poem's degradation mirrors the narrator's fading memory (formal features = plot mechanics).  
  - Footnotes would break immersion; this isn't scholarly text but fiction where form *is* substance.  
  - Audiobook/singability adds another layer—now it must *sound* right too.  

  Key pain points to address:  
  1. **The acrostic HELENA**: If German can't replicate feminine rhymes + acrostic, what's the minimal viable preservation? The "H alliteration" swap feels like surrender.  
  2. **Degradation mechanics**: A translation must allow identical mutilation (line deletions, dash substitutions) without collapsing. Free verse might not break correctly.  
  3. **Singability clash**: Musicality requirements might contradict precise formal replication.  

  Building the desiderata:  
  Start by defining the **unit of translation** as the *constraint set* itself—not words or lines but the interplay of rhythm, acrostic, and decay. This elevates structure from ornament to engine.  

  Then tackle **compensation vs preservation**: Compensating elsewhere (e.g., alliteration for acrostic) is *not* equivalent if the original uses visual spacing (acrostic) for thematic weight. Must flag this as non-negotiable.  

  **Footnote failure**: Footnotes are autopsy reports—they explain death but don't revive the body. For fiction, they're an admission of defeat when the text must *perform* its meaning.  

  Biggest trilemma:  
  - Formal fidelity (keep all constraints)  
  - Semantic fidelity (keep meaning)  
  - Target-language vitality (feel "natural" in German)  
  ...is indeed unsolvable. Prioritize formal + semantic where constraints *are* meaning (e.g., the dash replacing rhyme), sacrifice vitality if needed. The decaying rhyme isn't just "nice to have"—it's the novel's heartbeat.  

  Highlight **untranslatables**: Feminine endings. German has no direct equivalent, so map to a *different* sonic fragility (maybe glottal stops? Diminutives?). But warn: if the translator won't bend, this becomes a hill to die on.  

  Finally, **audience priority**: The monolingual German reader matters most—they shouldn't need footnotes to feel the poem's unraveling. If the bilingual spots losses, so be it, but the emotional arc must survive.  

  Scoring translation theories:  
  - **Skopos/functionalist** (translator's approach): Fails—treats poem as decorative, not structural.  
  - **Literalist**: Unworkable (would butcher German).  
  - **Thick translation** (footnotes): Betrays immersion.  
  Best fit: **Constraint-based equivalence**—a new theory where the *rules* translate, even if parts change.  

  The user needs ammo. I'll structure this as numbered principles with concrete examples from their text (HELENA, the dash) to weaponise in emails. No jargon—their translator already out-logics them.
answer: |-
  ## A Theory of Translation Under Formal Constraint: Core Desiderata  
  Your predicament crystallises the agony of constrained literary translation: when form isn’t ornamentation but structural load-bearing architecture. Below is a specification for a viable theory of translation under formal constraints, grounded in the cases you’ve raised. It prioritises what *must* be preserved, what *can* be negotiated, and which trade-offs are fatal. Principles are ranked by non-negotiability, with key distinctions and trilemmas explicit.  

  ### Core Desiderata (Non-Negotiable)  
  1. **Constraint-as-Meaning Distinction**  
     *Requirement:* If a formal feature performs semantic or thematic work (e.g., your decaying rhyme reflecting memory loss), it cannot be discarded or relegated to a footnote. The dash replacing the final rhyme-word isn’t a "formal quirk"—it’s narrative DNA.  
     *Case:* Your third poem iteration. A translation that cannot replicate the *identical degradation pattern* (line deletions, rhyme collapse) fails. Free verse that can’t "lose" a rhyme or line identically is unfit for purpose.  
     *Failure Mode:* Treating form and content as separable. The poem’s unravelling *is* the novel’s argument.  

  2. **Unit of Translation = Constraint Set**  
     *Requirement:* The unit isn’t the word, line, or stanza—it’s the *interdependent system of constraints*. Your acrostic (HELENA), metre, feminine rhymes, and refrain structure are a single entity. Sacrificing one to "save" another ignores their synergy.  
     *Case:* The acrostic isn’t arbitrary; it’s the sister’s name materialised in the poem’s spine. Compensating with H-alliteration swaps visual permanence for auditory ephemera—a category error.  
     *Distinction:* Preserving a constraint (e.g., acrostic) ≠ compensating elsewhere (e.g., alliteration). Compensation creates a *new* poem; preservation maintains the original’s logic.  

  3. **No Footnotes for Vital Mechanics**  
     *Requirement:* Footnotes explaining structural losses (acrostic, rhyme decay) are admissions of failure. They force the reader *out* of the fictive dream to autopsy the text.  
     *Case:* The German reader encountering "—" in the third poem must feel the *absence* viscerally, not learn via footnote that "the original had a rhyme here." The horror is in the gap, not its annotation.  

  ### Negotiable Priorities (Hierarchical Preferences)  
  4. **Target-Language Viability Over "Fidelity"**  
     *Requirement:* The translation must function as poetry in the target language, even if formal compromises are needed. However, viability cannot override Constraints 1–3.  
     *Case:* Feminine endings (-ée) don’t exist in German. A theory might permit substituting another sonic marker of fragility (e.g., whispered consonants, dimeter lines). But if the *decay* of this marker isn’t replicable, the solution fails.  
     *Trilemma Alert:*  
     - Preserve all formal features (e.g., acrostic + metre + feminine rhymes)  
     - Preserve all semantic content  
     - Produce a living poem in the target language  
     *You can only ever choose two.* Your case demands sacrificing semantic flexibility (e.g., altering literal meaning to fit form) or target-language "naturalness" (e.g., forcing unnatural syntax to keep the acrostic).  

  5. **Monolingual Reader Primacy**  
     *Requirement:* The translation owes its deepest duty to the monolingual reader. They experience the text as the original—not as a shadow of another work. Bilingual readers’ comparisons are secondary.  
     *Case:* The German audiobook listener must hear the lullaby’s refrain "come back wrong" with the same emotional force as the English reader. If the singer’s stumble on the altered refrain isn’t haunting, the translation betrays the novel.  

  6. **Structural Integrity Over Audibility**  
     *Requirement:* When a constraint is visual (acrostic, page shape) or conceptual (fixed form), it must be preserved even if "inaudible" in recitation. The text is a visual artifact.  
     *Case:* HELENA must remain legible vertically. If German necessitates longer words, adjust line breaks—not the acrostic.  

  ### Critical Distinctions & Damage Assessment  
  - **Preservation vs. Compensation**:  
    Preservation maintains the original’s *mechanism* (e.g., acrostic as hidden text). Compensation replaces it with an *analogue* (e.g., alliteration). They are fundamentally different. Your poem requires preservation—the acrostic is forensic evidence of Helena’s presence.  

  - **Unbreakable Trilemma**:  
    As suspected, **Formal Fidelity / Semantic Fidelity / Target-Language Vitality** is a trilemma. Choosing all three is impossible. For your novel:  
    - *Formal Fidelity* (acrostic, decay pattern) is non-negotiable.  
    - *Semantic Fidelity* (literal meaning) can bend (e.g., "lullaby" imagery adjusted for German idioms).  
    - *Vitality* (singability) must yield if it breaks Constraints 1–3. A clunky but structurally intact German poem is truer than a "fluent" fragment.  

  - **Most Damaged Theory**: **Dynamic Equivalence** (Nida). Prioritising "naturalness" and "reader response" would sacrifice your acrostic and decay mechanics for "singable" free verse. It collapses form into content, ignoring constraint-as-meaning.  

  ### Scoring Translation Theories Against Your Case  
  | **Theory**               | **Acrostic**     | **Decaying Rhyme** | **Singability** | **Verdict**                     |  
  |--------------------------|------------------|--------------------|-----------------|----------------------------------|  
  | **Literalism**           | Keeps, may break German | Forces unnatural German | Unsingable      | Fails viability (Trilemma)       |  
  | **Dynamic Equivalence**  | Drops for "flow" | Sacrifices to "naturalness" | Prioritises     | Betrays Constraints 1–3          |  
  | **Imitation** (e.g., Hofstadter) | Optional       | Optional            | Optional        | Unreliable; prioritises "spirit" |  
  | **Thick Translation** (Notes) | Footnotes loss | Footnotes loss      | Singable        | Fails (Constraint 3)             |  
  | **Skopos/Functionalist** | Drops if "purpose" is song | Adjusts arbitrarily | Achieves        | Ignores form-as-meaning          |  
  | **Constraint-Based Equivalence** | Required      | Required            | Negotiable      | Only viable approach             |  

  ### The Single Most Damaging Requirement  
  **"Fluent, Invisible Translation"**: The demand that a translation "read like an original" actively destroys constrained texts. It privileges lexical fluency over structural fidelity, forcing your acrostic into the grave to avoid "awkwardness." This requirement does the most violence to poems where form is meaning.  

  ### Resolution Strategy for Your Translator  
  1. **Unit of Translation**: Redefine the poem as a "constraint set": acrostic (HELENA) + tetrameter + feminine-rhyme decay + refrain mutation.  
  2. **Sacrifices**: Accept that feminine rhymes (-ée) *must* become another sonic fragility marker in German (e.g., whispered /ch/ sounds, short vowels). Semantic adjustments are permitted to fit the acrostic.  
  3. **Non-Negotiables**:  
     - The acrostic stands. If German words are longer, use contractions or creative lineation.  
     - The poem must lose lines/rhymes identically across three iterations.  
     - No footnotes explaining losses.  
  4. **Concession**: If singability requires minor metre tweaks (e.g., iambic → trochaic), permit it—but only if the decay pattern remains replicable.  

  Your lullaby isn’t "translated" when it becomes German; it’s *rebuilt* with the same architectural blueprints. A theory worth its salt must enforce this: the translation is the same poem in a new body, not a eulogy for the original. Anything less robs Helena of her ghost.
