prompt: |-
  I'm on this tiny volunteer panel that hands out a few thousand dollars a year of arts money through our city library foundation, and we keep getting stuck on the same sentence. Someone says "we fund art, not propaganda," and then we approve a veterans' mural, a set of nativity-scene puppets and a run of WPA-style prints of local factory workers without anyone reaching for the p-word, while a youth-theatre piece about stop-and-frisk and a photo series about a family getting evicted get called propaganda within about thirty seconds. Its not that the two piles differ in the features I'd naively expect to matter — all of them were made with somebody's money, all of them want you to feel something specific and come out believing something, all of them simplify. The difference seems to be whether the room already believes the thing. One panelist is a high school history teacher and she brought in Du Bois (he says somewhere, more or less, that he has no use for art that isn't doing propaganda work, and that the real complaint is that only some sides are allowed to do it), which made the argument worse instead of better.

  Here's the part I can't get out of my head, though, and I think it's a different thing. It looks to me like propaganda stops being called propaganda once it wins. A cathedral window or an altarpiece was commissioned by an institution with a stake in what people believed, designed to teach doctrine to people who couldn't read, and hung where you couldn't avoid looking at it; by the description we were using on the youth-theatre piece that's textbook, but nobody in that meeting would call it propaganda, they'd call it devotional art or just art. Same with a lot of novels whose politics have since become the default: the politics stop reading as a claim somebody is making and start reading as the furniture of the world. So the word seems to track how live the fight still is rather than anything about the object — which would mean that the person who says all art is propaganda and the person who says good art is never propaganda might not be disagreeing about which works have politics in them at all.

  Is there a name for this — either the "politics I happen not to share" pattern or the amnesty-over-time pattern — and are they one thing or two? I'm not after a label I can drop to win the meeting; I want the carving: what exactly the phenomenon is, what it isn't, and where its edges are. The nearest things I've run into are "art for art's sake," which seems to be a claim about what artists should aim at rather than about what critics call things after the fact, and something about a "burden of representation," which is about asking one artist to speak for a whole group, and neither is what I'm seeing; if there's no established name, coin one and define it. I'd also really like boundary cases: is it the maker's purpose, the effect on the audience, or the funding source that makes the thing propaganda, and where does that leave an advertisement, a psalm, a war memorial, a corporate diversity poster, and an artist who believes the politics sincerely and was paid by nobody? Give me exactly five numbered points, one or two sentences each, no intro and no wrap-up: (1) whether either pattern has an established name, (2) whether they're one thing or two, (3) the nearest existing concepts and how each falls short, (4) a working definition plus the cases that fall outside it, and (5) what I should actually ask in the meeting instead of "is this propaganda."
reasoning: |-
  Okay, the user is part of a volunteer panel for an arts funding committee at a city library foundation. They're struggling with the term "propaganda" being applied inconsistently. Projects like veterans' murals or nativity puppets get approved without issue, while youth theater about stop-and-frisk or eviction photos get labeled propaganda. The user notices that the key difference seems to be whether the panel already agrees with the message. They also observe that once certain art becomes mainstream or "wins," it's no longer seen as propaganda—like cathedral windows that were once doctrinal tools but are now considered devotional art.

  The user wants to understand if there's a name for this pattern—where "propaganda" is just "politics I disagree with" or the idea that propaganda stops being called that once it's accepted. They also want to know if these are two separate phenomena or one. They're looking for precise definitions, near concepts that don't quite fit, boundary cases (like ads, psalms, etc.), and a practical question to ask in meetings instead of "is this propaganda."

  First, I need to address whether there's an established name for these patterns. The "politics I disagree with" part sounds like the "propaganda paradox" or something related to confirmation bias. The amnesty-over-time might be tied to cultural hegemony or institutionalization of ideas. But I'm not sure there's a single term for either. For the second point, they're two aspects: the subjective labeling based on agreement and the historical shift in perception. So they're linked but distinct.

  The user mentioned Du Bois and art for art's sake. The burden of representation isn't quite it. Near concepts could be "hegemony" (Gramsci) for the winning ideas becoming invisible, and "confirmation bias" for the panel's reactions. But hegemony is broad, and confirmation bias is individual. They fall short because they don't capture the temporal aspect or the artistic context specifically.

  A working definition: "Propaganda" is a pejorative label for art promoting contested ideologies, applied subjectively based on the viewer's alignment. Cases outside this might be universally accepted messages, like public health ads during a pandemic, which aren't contested. But if there's opposition, like vaccine skepticism, then pro-vaccine art might be called propaganda by some.

  Boundary cases: An advertisement is commercial, but if it pushes a contested social idea, it could be seen as propaganda. A psalm: if it's part of a dominant religion, it's devotional; minority religions might have their texts labeled propaganda. War memorials: accepted ones are art, contested ones might be propaganda. Corporate diversity posters: if the company's stance is mainstream, it's seen as positive; if controversial, propaganda. An unpaid artist with sincere beliefs: their work is called propaganda only if the message is contested and opposed by the viewer.

  For the meeting, the user should ask about the contested nature of the message within their community. Instead of debating propaganda, focus on whether the art addresses a live, unresolved local issue. This shifts the discussion to relevance and community impact rather than subjective labels.

  I'll structure this into five numbered points as requested, keeping each concise. Point 1: No established name, but related to "hegemony" and "confirmation bias." Point 2: Two distinct but linked patterns. Point 3: Near concepts are hegemony (too broad) and confirmation bias (too narrow). Point 4: Define it as contested ideology labeling, with boundary cases like uncontested PSAs. Point 5: Ask about the contested nature of the message locally.
answer: |-
  Here is the analysis structured as requested:

  1.  **Established Names:** Neither pattern has a universally accepted specific term. The "politics I happen not to share" pattern relates to **confirmation bias** and **hegemonic acceptance**. The "amnesty-over-time" pattern is linked to **institutionalization** or **cultural hegemony** becoming invisible.
  2.  **One Thing or Two:** They are two distinct but intrinsically linked phenomena. The first is a *subjective, present-moment judgment* based on viewer alignment; the second is a *historical process* where dominant ideologies become normalized and lose their perceived agenda over time.
  3.  **Nearest Concepts & Shortfalls:**
      *   **Hegemony (Gramsci):** Captures how dominant ideas become "common sense," explaining amnesty-over-time, but is too broad for specific art labeling dynamics.
      *   **Confirmation Bias:** Explains rejecting dissonant art as "propaganda," but is individual-focused, not capturing the historical normalization aspect.
      *   **"Art for Art's Sake":** Addresses intention/purpose *creationally*, not the *reception* dynamics of labeling existing political art.
      *   **Burden of Representation:** Concerns identity politics and spokesperson pressure, not the general mechanism of labeling political art based on agreement/normalization.
  4.  **Working Definition & Limits:** "Propaganda" functions as a *pejorative label for art promoting a contested ideology*, applied subjectively based on the viewer's ideological alignment and the contested status of the ideology *within the viewer's context*. **Cases outside:** Art promoting universally accepted messages within its context (e.g., uncontested public health PSAs), purely abstract/non-representational art, art where the political intent/effect is genuinely negligible or ambiguous.
  5.  **Question for the Meeting:** Instead of "Is this propaganda?", ask: **"Does this work engage with a specific, contested social or political issue currently active in our community, and if so, does its artistic merit justify funding regardless of whether we personally agree with its perspective?"** This shifts focus from subjective labeling to artistic engagement with live local discourse.
