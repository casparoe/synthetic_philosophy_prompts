answer: |-
  ### **The Menu**  
  *(Precise readings with mechanisms and verdicts)*  

  1. **Cost-Reallocation Reading**  
     - *Statement*: Pronoun reform redistributes the cognitive/social burden of interpreting defaults from non-prototypical groups to all speakers.  
     - *Mechanism*: Asymmetric costs (e.g., non-default individuals must constantly resolve ambiguity or self-mark) are equalized via linguistic change.  
     - *Verdict*: **Substantive and defensible** (supported by sociolinguistic research on "processing load" inequity).  

  2. **Practice/Rehearsal Reading**  
     - *Statement*: Uttering forms reinforces cognitive habits, making reform a tool for reshaping automatic patterns of attention.  
     - *Mechanism*: Repetition entrenches neural pathways (habit formation), independent of explicit beliefs.  
     - *Verdict*: **Substantive and defensible** (aligns with embodied cognition theories; e.g., habitual speech affects implicit bias).  

  3. **Availability Reading (Satire-Specific)**  
     - *Statement*: Satire defamiliarizes defaults, making invisible norms visible and thus available for conscious rejection.  
     - *Mechanism*: Contrast-jarring exposes latent assumptions, enabling agency over previously unconscious categorizations.  
     - *Verdict*: **Substantive and defensible** (validated by studies on humor’s role in perspective-shifting).  

  4. **Diagnostic Reading**  
     - *Statement*: Satire’s effectiveness merely proves the existence of a default, not that altering it would improve outcomes.  
     - *Mechanism*: Reveals descriptive facts, but neutral on prescriptive solutions.  
     - *Verdict*: **Trivial** (acknowledges observation without engaging reform’s merits).  

  5. **Expressive/Social-Meaning Reading**  
     - *Statement*: Reform signals collective rejection of exclusionary norms, altering social conventions ("the world" in a thin sense).  
     - *Mechanism*: Conventions gain meaning through performative reinforcement; change signals shifting values.  
     - *Verdict*: **Substantive and defensible** (draws on Lewisian convention theory; e.g., pronouns as social coordination devices).  

  6. **Strong Constitutive Reading**  
     - *Statement*: Language categories determine cognitive categories, so pronoun reform would fundamentally restructure thought.  
     - *Mechanism*: Linguistic determinism (Sapir-Whorf strong version).  
     - *Verdict*: **False** (empirically unsupported; language influences but does not rigidly fix thought).  

  ---

  ### **What the Slogan Had to Mean**  
  Your friend’s slogan ("you can’t change the world by changing the words") must invoke the **Expressive Reading** to dismiss both reform and satire. On this view:  
  - Words merely *reflect* the world (social realities, power structures), so altering them is superficial ("changing the label on the bottle").  
  - Satire is dismissed because laughter at a fictional scenario (racist pronouns) borrows moral outrage from *prior* agreement on racism, failing to prove anything about real-world gender defaults.  

  **Plausibility**: This is a common folk-linguistic stance, echoing semantic externalism (words derive meaning from external referents). However, it ignores how conventions *constitute* social realities (e.g., legal/political terms like "marriage" or "citizen"). If your friend retreats to weaker readings (e.g., Diagnostic: satire only proves the default exists), his position collapses: he concedes the problem but offers no counter to cost-reallocation or practice-based arguments for reform.  

  ---

  ### **Pump, Proof, or Intervention**  
  The satire functions primarily as an **intervention**, secondarily as a **proof-by-defamiliarization**:  
  - **As intervention**: It disrupts heuristic thinking by mapping gender defaults onto racism (where the audience *already* recognizes absurdity/harm). This forces re-evaluation of the familiar via the unfamiliar.  
  - **As proof**: The visceral discomfort it elicits *is evidence* that gender defaults operate similarly to racist ones in cognitive processing (validating Diagnostic Reading).  

  **Borrowed-Force Worry**: Yes, the analogy borrows moral force from racism—but this doesn’t defuse it. The mapping works *because* racism is uncontroversially recognized as harmful, exposing the inconsistency in tolerating analogous linguistic exclusion. Reverse satire (defending masculine defaults via fictional anti-racism) would fail because it lacks a comparable moral anchor; audiences would reject the premise, proving Hofstadter’s point.  

  ---

  ### **The Strongest Version of My Side**  
  **Lead with Cost-Reallocation**:  
  - *Core thesis*: Masculine defaults impose repeated, measurable costs on non-male individuals (e.g., cognitive load, attribution errors, professional marginalization), and reform redistributes this burden equitably.  
  - *Most damaging counter*: "The costs are negligible; people adapt."  
  - **Evidence to settle the matter**:  
    - **Empirical**: Studies tracking cognitive load (e.g., reaction times when interpreting "they" vs. "he" in gender-ambiguous contexts) or workplace inclusion metrics post-reform.  
    - **Philosophical**: If your friend concedes that *ble* in the satire imposes unjust costs, consistency demands acknowledging similar costs for masculine defaults—unless he can identify a morally relevant difference between racial and gender exclusion in language.  

  **Final note**: Cost-reallocation doesn’t require changing "the world" in a grand sense—only reallocating micropolitical burdens. This sidesteps his slogan’s false dichotomy between "words" and "world."
