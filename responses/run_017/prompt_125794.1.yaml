  - Practice/rehearsal emphasizes habitual reinforcement
  - Availability deals with satire's defamiliarization effect
  - Diagnostic treats satire as evidence of existing defaults
  - Expressive concerns signaling social norms
  - Constitutive is the strong Sapir-Whorf position

  I recall the user's friend dismissed both pronoun reform and Hofstadter's satire with "you can't change the world by changing the words." To counter this effectively, I need to identify which interpretation of the slogan would actually support both dismissals. The expressive reading seems most compatible - if words merely reflect rather than shape reality, changing them would indeed be superficial. But this ignores how conventions themselves constitute social reality.

  For the satire's mechanism, I consider it primarily an intervention rather than proof. The borrowed-force worry is valid but doesn't defuse it - the mapping works precisely because racism provides an uncontroversial analogy to reveal cognitive dissonance around gender defaults.

  The strongest counterargument lies in cost-reallocation. The accumulated micro-burdens on non-default groups create tangible exclusion, while reform redistributes this cognitive labor more equitably. The most damaging counterclaim would be that these costs are negligible, but empirical studies on workplace communication suggest otherwise.

