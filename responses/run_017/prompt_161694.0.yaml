  - He can’t weasel out with "it depends"—the bee-bot is either integrated or not.  

  ### Strategy for Friday
  1. **Predict his swarm answer upfront**: "Malik, you’ll say no human-level subject—just bees." If he agrees, you’re halfway to winning.  
  2. **Spring the extra case after**: If he rules "no big subject" for the swarm, hit him with the disconnected-bee-chip case. His answer pins his rule.  
  3. **Bet smart**: Wager on the swarm prediction *and* the rule. E.g., "I bet you say no human subject in the swarm, and your rule requires integration."  

  **Final Edge**: If he tries to dodge with "physical unity," remind him the robots lack it (they’re separate like bees, not wired like a brainstem). His split-brain verdict hinges on shared biology—robots ain’t that.  

  Go win that bet—and record the session. This is gold.
