prompt: |-
  Hey — I'm on a tiny funding committee (five people, we move maybe 800k a year, almost all of it small grants to independent researchers and one or two PhD students), and we're trying to decide where next year's money on AI existential risk should go. I've read all the standard blog-post versions of the case for and against, so please skip the part where you explain that a superintelligent system might disempower humanity — assume I've heard it, and assume I've also heard the replies about how speculative it all is.

  What I'm stuck on is that nearly every application we get seems to presuppose what a friend of mine has started calling the pivotal agent picture: there's some future system, or a handful of them trained by one or two labs, that's decisive enough that its goals basically determine what happens to the world, so what matters is whether those goals are the right ones. My friend's alternative — call it the janitor scenario — is that very little of the expected loss actually runs through a single decisive agent. On that picture the world gets restructured by enormous numbers of systems that are each individually too weak and too narrow to seize anything: they write most of the code, set most of the prices, draft most of the contracts and the regulations, do most of the hiring and the triage, and nobody is ever in a position to choose the overall direction because there is no overall direction, only the residue of a million locally-reasonable automated decisions plus the institutional incentives that adopted them. A related worry I can't shake: the orthogonality thesis (intelligence and final goals come apart) seems almost trivially true, but only decision-relevant if the goals of the systems in question are load-bearing for what happens; and instrumental convergence as usually stated — agents with a wide range of final goals will want more resources, self-preservation, and so on — doesn't obviously apply to a system boxed into a narrow task with no reason to want anything beyond doing that task well. Which makes me wonder whether that whole apparatus is smuggling in the pivotal-agent assumption rather than supporting it.

  So: suppose you were advising us, and suppose you put something like 40% on the janitor-ish picture being where most of the expected loss lives and 60% on the pivotal-agent picture. Which open questions should we actually be funding, and in what order? I care much less about the list than about the reasoning — for each one, what makes it upstream of other questions, whether it's tractable for the kind of people we can actually pay (philosophers, economists, a few ML people without big compute; nothing that needs interpretability access to frontier models), how neglected it is relative to its importance, and what we might observe over the next eighteen months that would move it up or down the list. And I'd especially like the places where the two pictures give genuinely different answers about where the money goes: if your ranking would come out roughly the same under either one, say that and tell me why I'm wrong to treat the distinction as decision-relevant at all.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a small funding committee focused on AI existential risk, allocating about 800k a year. They've moved past the basic arguments for and against AI risk and are stuck on a key conceptual split: the pivotal agent picture versus the janitor scenario. 

  First, I need to make sure I understand their dilemma. The pivotal agent theory assumes a few superintelligent systems whose goals determine humanity's future. The janitor scenario, on the other hand, imagines countless narrow AI systems making automated decisions that collectively reshape the world without any central control. The user is skeptical that the standard arguments (orthogonality thesis, instrumental convergence) apply in the janitor scenario because those systems are task-specific and not agentic.

  The user puts 40% weight on the janitor scenario and 60% on pivotal agents. They want funding priorities that address both, especially where the two models diverge. They also care about tractability for researchers without big compute resources, neglectedness, and observable outcomes in 18 months.

  Hmm. I should start by breaking down why the distinction matters. If the janitor scenario is plausible, then focusing solely on pivotal agents might miss significant risks. The user mentioned orthogonality and instrumental convergence not applying in the janitor case. That's a valid point. Narrow AIs aren't agents with goals, so those theories might not directly apply. But maybe there's a different angle—like how these systems interact in complex systems, leading to emergent behaviors.

  Next, I need to identify research areas where funding would differ based on each scenario. For pivotal agents, alignment research and governance of frontier models are key. But for the janitor scenario, it's more about systemic effects, economic and social dynamics, and infrastructure vulnerabilities. The challenge is finding overlap where both scenarios benefit, but also highlighting divergence points.

  The user emphasized wanting projects that are upstream, tractable, and neglected. So I should prioritize questions that are foundational and can be tackled without access to frontier models. For example, studying economic tipping points from automation or incentive structures in AI deployment. These don't require advanced ML resources but might involve economists or systems theorists.

  Tractability is crucial. They have philosophers, economists, and some ML folks without big compute. So projects like modeling information ecosystems or liability frameworks could work. Interpretability without model access might involve theoretical work on how narrow AIs could have unexpected side effects when integrated.

  Neglectedness is another factor. Areas like AI-driven economic cascades or liability structures might be less explored compared to technical alignment. Also, monitoring real-world indicators like API usage patterns or supply chain dependencies could provide data without needing model internals.

  Observables over 18 months: The user wants to know what could change priorities. For the janitor scenario, tracking API call volumes, automation in critical sectors, or regulatory shifts would be indicators. If pivotal agents seem more likely, monitoring lab secrecy or compute scaling trends would matter.

  I should also consider if the distinction affects funding allocation. If both scenarios share common needs like governance or verification, some projects stay relevant. But areas like economic modeling of labor displacement or systemic risk in infrastructure are more janitor-focused. Highlighting these divergences helps the user allocate funds effectively.

  Finally, validating their concern: The user is right that the pivotal agent assumption underlies much of the current discourse. Funding janitor-related research addresses a gap and could prevent overlooking cumulative risks. It's not about choosing one over the other but balancing based on probability and impact.
answer: |-
  Here's a prioritized list of research directions tailored to your committee's constraints, weighted by the 60/40 pivotal-agent/janitor split, with explicit divergence points and tractability considerations. The ranking favors questions where **neglectedness**, **tractability for non-frontier researchers**, and **upstream leverage** intersect with your risk models.

  ### Core Ranking & Reasoning
  *(With divergence indicators: 🔑 = favors pivotal-agent, 🧹 = favors janitor, 🔷 = neutral/hybrid)*

  1. **Systemic Economic Tipping Points from Narrow AI Cascades**  
     (**🧹 Priority | Tractable | Highly Neglected | Observable Triggers**)  
     - *Why:* Directly addresses the janitor scenario's core mechanism — how millions of micro-decisions trigger nonlinear collapse (e.g., labor market failures, resource allocation spirals).  
     - *Upstream:* Models here inform regulatory thresholds and early-warning systems.  
     - *Tractability:* Economists can use existing sectoral data + agent-based modeling (no frontier AI needed). Study cases: rapid automation in logistics/healthcare, algorithmic pricing collisions.  
     - *Neglected:* <5% of x-risk funding targets economic systems dynamics (vs. >60% for technical alignment).  
     - *18-Month Observables:* Spike in sectoral unemployment from AI adoption, commodity price volatility from algorithmic traders, or supply chain fractures. **Move up if:** labor replacement exceeds 15% in any major sector.  

  2. **Incentive Pathology in AI Deployment Ecosystems**  
     (**🔷 Neutral Core | Foundational | Tractable | Observable**)  
     - *Why:* Explains BOTH scenarios. Pivotal agents emerge because lab incentives favor reckless scaling. Janitor disasters arise because corporations/regulators adopt narrow AI for short-term gains.  
     - *Question:* "What institutional structures make deployment actors systematically ignore tail risks?"  
     - *Tractability:* Political scientists/economists can analyze corporate governance, liability frameworks, and regulatory capture using public data.  
     - *Upstream:* Fixing incentives prevents both scenarios.  
     - *Neglected:* Incentives are often mentioned but rarely modeled rigorously in x-risk contexts.  
     - *18-Month Observables:* Major AI safety whistleblowing events, regulatory loopholes in new AI laws (e.g., EU AI Act carveouts), or investor pressure for speed over safety.  

  3. **Goal Preservation Under Delegation Chains**  
     (**🔑 Pivotal-Agent Leaning | High Leverage | Philosopher-Friendly**)  
     - *Why:* Crucial if pivotal agents exist, but janitor scenarios also involve humans delegating to AI subsystems. Asks: "Can humans retain meaningful control when using AI as 'tools'?"  
     - *Tractability:* Philosophers/legal theorists can map decision-theoretic failures using case studies (e.g., Facebook's ad algo optimizing engagement over societal health). No ML needed.  
     - *Divergence:* Pivotal-agent view funds this to prevent takeover. Janitor view funds it to avert death-by-a-thousand-cuts misalignment.  
     - *Neglected:* "Tool AI" safety gets <10% of alignment funding.  
     - *Observables:* High-profile delegation failures (e.g., AI legal tools causing rights violations, medical diagnostic errors). **Downgrade if** evidence shows humans reliably veto harmful AI actions.  

  4. **Vulnerability of Critical Infrastructure to Non-Agentic AI**  
     (**🧹 Janitor-Centric | High Impact | Tractable**)  
     - *Why:* Janitor risks concentrate here — power grids, finance, or logistics failing from narrow AI interactions, not malice.  
     - *Question:* "What non-agentic AI failures could cause irreversible civilizational damage?"  
     - *Tractability:* Systems engineers can model failure modes using public infrastructure data (e.g., cascading blackouts from smart grid optimizers).  
     - *Neglected:* Infrastructure fragility is studied in isolation; AI coupling is new.  
     - *Observables:* Increase in AI-related critical system near-misses (e.g., air traffic control errors, stock flash crashes). **Move up if** AI penetrates >30% of infrastructure control systems.  

  5. **Scaling Laws for Societal Fragility**  
     (**🔷 High Upside | Novel | Economists + ML**)  
     - *Why:* Tests whether "more AI → more risk" holds in janitor/pivotal worlds. Pivotal agents imply sharp risk spikes at capability thresholds. Janitor implies linear/geometric risk growth with deployment scale.  
     - *Tractability:* ML researchers can simulate societal datasets (e.g., synthetic economies); economists derive fragility metrics.  
     - *Neglected:* Almost no empirical work on AI scaling ↔ societal resilience.  
     - *Observables:* Correlation between AI adoption density and social instability metrics. **Downgrade if** early adopters (e.g., Singapore, Estonia) show enhanced resilience.  

  6. **Liability as a Mechanistic Alternative to Alignment**  
     (**🧹 Janitor Solution | Actionable | Legal Scholars**)  
     - *Why:* If harms are cumulative, strict liability for AI operators could be more effective than aligning agents. Shifts focus to accountability over control.  
     - *Tractability:* Legal scholars can draft liability frameworks using tort law precedents.  
     - *Upstream:* Could make pivotal agents less likely by disincentivizing reckless deployment.  
     - *Neglected:* Liability is discussed in policy circles but not as a core x-risk mitigation.  
     - *Observables:* Landmark lawsuits against AI operators (e.g., deepfake libel, algorithmic discrimination).  

  ### Where the Two Pictures Demand Different Funding (Divergence Points)
  - **Fund Janitor-Heavy If:** You observe rapid fragmentation of AI capabilities (e.g., >100 viable foundation models by 2025), proliferation in bureaucratic/industrial settings, or weaker regulation of non-frontier AI. Prioritize #1, #4, #6.  
  - **Fund Pivotal-Heavy If:** Frontier labs accelerate toward AGI (e.g., 6-month doubling of training compute), increased secrecy, or regulatory capture by big labs. Prioritize #3, #2, #5.  

  ### Why the Distinction Matters
  **You're right to treat this as decision-relevant.** The pivotal-agent model implies concentrating resources on:
  - *Controlling a few entities* (governance, technical alignment)  
  - *Preventing agentic goals from forming* (goal specification)  

  The janitor model implies:
  - *Hardening complex systems* (infrastructure, economics)  
  - *Managing distributed effects* (liability, incentive design)  

  **Tractability wins:** Even if you're 60% pivotal-agent, janitor projects (#1, #4, #6) are cheaper, faster, and leverage your committee's strengths (social science focus). Overlooked systemic risks offer higher marginal returns than crowded technical alignment fields.  

  **Key observable in 18 months:** Watch **API call volume for narrow AI tasks** (e.g., via platforms like Scale AI or Anthropic's Claude API). If growth outpaces frontier model scaling, bump janitor projects. If frontier training runs dominate energy/research, favor pivotal.  

  Would this help if I sketched 1-pager proposal templates for the top 3 items?
