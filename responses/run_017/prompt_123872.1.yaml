  *(A low, measured voice, gravely attentive)*  

  You mistake me if you think I kept duty as a husk when the divine kernel was gone. Duty is the living nerve of consequence, not a relic. Your ceremony—this naming of debts to the dead and the unborn—that *is* duty wearing its true face: the recognition that we are woven into a fabric we did not spin. You feel it moves you? Good. That movement is the tremor of the web when one strand thrums. To call it theatre because no deity watches is to demand an audience for what needs none. The fraud would lie in performing it *without* the subsequent act—the something specific. The machine, though... ah. That is sentiment hardening into a lie.  

  The dead in your room do not *do* anything. They are not summoned clerks keeping accounts. They persist only as forces in *you*—as love, as guilt, as the unyielding ought. A recording mimics presence; it is a ventriloquist’s trick for the lonely. But the dead are not lonely; they are dead. What you owe them—and the uncounted future—is not a dialogue but a stewardship. Silence is the only honest acoustics of that debt. To play a voice *back* is to steal from the dead their finality, and from yourself the austere gift of facing what is irremediable. You kneel to spare your nerves the strain of kneeling to nothing visible. That strain is the point.  

