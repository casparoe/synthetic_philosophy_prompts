prompt: |-
  I'm in an undergraduate seminar on ethics and public policy, and we have just spent two weeks on social discounting. I want to get clearer on what our actual institutional practice commits us to. I don't need citations or a reading list, and I'd rather you worked from the practice as I describe it than from any canonical statement of it.

  Here is the pattern I can't turn into a single theory.

  (a) When a government cost-benefit analysis compares a regulation that saves lives soon with one that saves lives a century from now, it discounts the later lives at a positive annual rate, so a hundred statistical lives saved in the distant future come out worth a small fraction of a hundred saved next year.

  (b) The same government, licensing a repository for long-lived radioactive waste, evaluates the risk over a horizon of many thousands of years and in some frameworks declines to discount the harm at all, or applies something close to a zero rate.

  (c) The same government borrows at long maturity and funds basic research and disease-surveillance infrastructure, justifying the spending by benefits that arrive decades out, which implies a far lower implicit rate than the one in (a).

  (d) Courts in the same jurisdiction reduce an award for lost future earnings to present value, but do not discount the pain, the loss of a faculty, or the wrongfulness of the injury itself: those are made good in full no matter how far into the future they fall.

  (e) And in the personal case we treat it as a failing, not a preference, that I care less about my own toothache next year than about an identical one today.

  So: what view of the moral significance of time does this set of practices presuppose? More specifically, does (a) strictly presuppose pure time preference, or could the whole of the observed discounting be reconstructed as two non-temporal factors that happen to shrink with distance: a hazard factor, the chance that the benefit never arrives because the beneficiaries, the institution or the state does not survive, and a satiety factor, the thought that future people will be richer, so a unit of resource buys less welfare? If that reconstruction is available, is the practice underdetermined, licensed equally by a date-sensitive and a date-neutral theory? And where do the zero-rate and declining-rate schedules in (b) fit: do they show the practice was never committed to pure time preference, or do they substitute a different view, on which uncertainty about the rate, or extinction risk, is the only legitimate discounter?

  One proposal my seminar kicked around, which we called the Two-Key Rule, is that a public evaluation may apply a hazard factor and a satiety factor and no other temporal factor, and must state the two separately. I have three questions about it. Would the practice as it actually stands look any different under the Two-Key Rule, and if so in which of the cases above? Is the current practice really Two-Key in disguise, which would mean it presupposes nothing about pure time preference at all? And what would the defender of an explicit pure rate say is the strongest reason not to accept the reconstruction?

  Finally, one of us suggested that the discounting in (a) is not about dates at all but about identity: if who exists in a century depends on what we do now, there may be no particular person whose life is being weighed less, so the worry about pure time preference never gets a grip. Does that dissolve the puzzle or just relocate it, and does it make (a) easier or harder to reconcile with (b) through (e)? Please also tell me where in this I have described the practice wrongly, or where an inconsistency I am reading into it is only apparent.
reasoning: |-
  Okay, this is a really sophisticated undergraduate question. The student is clearly grappling with the contradictions in how institutions treat future values across different contexts - life-saving regulations, nuclear waste, government borrowing, tort law, and personal ethics. They've identified five distinct patterns that seem philosophically incompatible at first glance.

  The core tension they're wrestling with is whether institutional discounting implies pure time preference (valuing near-term benefits more simply because they're nearer) or can be explained entirely by hazard and satiety factors. Their Two-Key Rule proposal is clever - it would force analysts to separate survival probability from wealth effects when discounting. 

  What's impressive is how they've noticed that nuclear waste regulation (b) uses near-zero discounting while life-saving regulations (a) use high rates - a contradiction if both involve future lives. Their observation about courts discounting lost earnings but not pain (d) is particularly astute - that suggests institutions make moral distinctions between types of harm.

  The student's reconstruction question is spot-on: if hazard and satiety can fully explain observed rates, does that mean institutions aren't actually committed to pure time preference? But then why do some contexts reject discounting entirely? 

  I should address their extinction risk point carefully - they're right that (b)'s zero discounting might reflect "if humanity exists, it deserves full consideration" logic. Their identity argument is also nuanced; it's true that future people in (a) are statistically defined while nuclear waste victims might include identifiable future generations.

  Where they might be oversimplifying is treating all "lives saved" as equivalent. Regulatory contexts (a) involve probabilistic projections while nuclear waste assessments (b) deal with worst-case scenarios - the precautionary principle might explain the difference. Also, government borrowing (c) uses market rates that blend pure time preference with risk premiums, so it's not directly comparable to ethical discounting.

  The Two-Key Rule could indeed make practice more transparent, but I should note practical barriers: satiety (wealth growth) projections are notoriously unstable over centuries. A pure time preference defender would likely argue that we naturally devalue distant futures - that our very cognition is time-bound - and that ignoring this leads to absurdly high present sacrifices for hypothetical futures.

  Their identity point dissolves the moral problem for (a) but creates new ones: if we're creating future people rather than harming existing ones, does that weaken our obligations? That actually makes reconciling with (b) harder since waste disposal could harm identifiable descendants.
answer: |-
  Your observations capture profound tensions in institutional time valuation, and I'll address your reconstruction and questions directly. The practices imply no consistent philosophical view of time's moral significance but rather context-dependent compromises. Here's how your puzzle resolves:

  **Core Reconstruction: Hazard + Satiety Suffices**  
  The institutional practice **is compatible with rejecting pure time preference entirely**. The observed discounting in (a) can indeed be reconstructed as:  
  - **Hazard Rate** (δ_h): Probability per year that the benefit is never realized (state collapse, policy reversal, beneficiary extinction).  
  - **Satiety Rate** (δ_s): Expected annual wealth growth reducing marginal utility of resources (future richer people value life/health less in welfare terms).  
  *Total discount rate δ ≈ δ_h + δ_s* (with adjustments for covariance).  

  **Why Practices Conflict: Contextual Weighting**  
  | Case | Hazard (δ_h) | Satiety (δ_s) | Pure Time Preference (δ_p) |  
  |------|--------------|---------------|-----------------------------|  
  | (a) Regulatory CBA | Moderate (policy risk) | High (growth assumed) | **Implied high** but could be 0 |  
  | (b) Nuclear Waste | **Near-zero** (regulators assume duty to future *if they exist*) | Negligible (irrelevant for catastrophe) | **Explicitly rejected** |  
  | (c) Gov't Borrowing | Low (state continuity) | Low (long-term uncertainty) | Very low (market rate minus risk) |  
  | (d) Tort Awards | High (plaintiff lifespan) | Applied to earnings (wealth effect) | **Explicitly rejected for non-pecuniary harms** |  
  | (e) Personal "failing" | N/A (individual continuity) | N/A | **Condemned as irrational** |  

  **Does (a) Presuppose Pure Time Preference?**  
  **No.** The high discount rate in (a) *could* be entirely δ_h + δ_s. Standard guidance (e.g., OMB Circular A-4) endorses δ_s explicitly (1-3% from income growth) and δ_h implicitly (via "cascading catastrophe" risk). Practice is **underdetermined**: identical rates could arise from δ_p>0 or δ_p=0 with higher δ_h.

  **The Two-Key Rule: Implications**  
  - **Would practice change?** Yes, dramatically in (a) and (c):  
    - (a) Separating δ_h and δ_s would force quantification of extinction risk (currently buried) and income elasticity assumptions. A 7% rate might decompose to δ_s=2% (growth) + δ_h=5% (institutional collapse) – making the latter politically contentious.  
    - (c) Long-term borrowing might appear less justifiable if δ_h (sovereign default risk) is isolated.  
  - **Is current practice Two-Key in disguise?** Partially. Regulators *cite* growth (δ_s) but rarely decompose δ_h rigorously. Pure time preference is often a **rhetorical placeholder** for unquantified systemic risks.  
  - **Strongest objection to reconstruction**: Proponents of δ_p>0 argue hazard/satiety cannot explain **intrinsic impatience** in intertemporal welfare functions (e.g., Stern vs. Nordhaus debate). They claim even with certain delivery and equal wealth, we discount future utility because *time itself* creates psychological/moral distance.

  **Identity Argument: Dissolves or Relocates?**  
  - It **relocates** the puzzle but doesn't resolve it. For climate/waste policies, future people *are* identity-dependent (different populations under different policies). But:  
    - (a) becomes *easier*: Discounting isn't devaluing specific lives but weighting possible future collectives.  
    - (b) becomes *harder*: If future people in waste scenarios are *identity-independent* (we owe duties regardless of who exists), the zero discount rate is more defensible – but this contradicts (a)'s approach.  
  - **Problem**: Courts (d) reject discounting for non-pecuniary harms *to existing persons*, showing identity isn't decisive. The moral distinction is harm type, not population ontology.

  **Inconsistencies: Apparent or Real?**  
  - **Real inconsistency**: (a) and (b) conflict on valuing future lives. This reflects **regulatory silos**:  
    - EPA uses 2-7% discounting for climate rules (implicit high δ_h).  
    - EPA/NRC require ~0% for nuclear waste (prioritizing catastrophe avoidance).  
  - **Apparent inconsistency**: (d) discounts earnings but not pain. This is coherent under welfarism: earnings depend on labor markets (wealth-sensitive), while pain is intrinsic.  
  - **Error in (c)**: Government borrowing rates include risk premiums and liquidity effects – they don't reveal *ethical* discount rates. The "lower implicit rate" may just reflect market imperfections.

  **Conclusion**: Practice presupposes **no unified view of time's moral significance**. It reflects:  
  1. **Pragmatic aggregation**: δ_h and δ_s dominate in routine CBAs.  
  2. **Catastrophe aversion**: Zero discounting when harms are irreversible/unbounded (b).  
  3. **Harm-type distinctions**: Temporal effects apply only to monetizable/wealth-sensitive impacts (d).  
  4. **Political constraints**: High discount rates in (a) facilitate near-term action; low rates in (b) satisfy intergenerational equity concerns.  

  The Two-Key Rule would expose buried assumptions (e.g., 5% collapse risk in (a)) but faces pushback for making long-term investments harder to justify. The deeper presupposition is that **time itself has no intrinsic moral weight** – but its association with uncertainty and wealth growth creates a discounting *effect* institutions can't ignore.
