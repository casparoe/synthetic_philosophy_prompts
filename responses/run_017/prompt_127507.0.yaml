prompt: |-
  I'm one of three people who handle complaints for a volunteer-run food co-op with about 400 working members, and we get a few of these a week. The pattern that keeps tying us in knots is this: someone reports a rule being broken, and it turns out the person reporting has broken that exact rule themselves, or was involved in it somehow, or mostly ignores that rule when it's inconvenient for them. Right now we either act on the complaint anyway and the accused person screams about hypocrisy, or we quietly drop it and the reporter screams about being silenced. I want something better than a gut call, and I want it to be something a shift volunteer with no training can run in ten minutes and write down, because whatever we decide gets read out at the member meeting and can be appealed there.

  What I've been using on my own is a single question: would this still be worth acting on if the person reporting had never said anything? If yes, act; if no, bin it. I've started to think that's wrong, or at least that it throws something away, because it seems to make the complainer's own history completely irrelevant, and my gut says it isn't irrelevant — a founding member who has broken the cash-handling rule four times and never once admitted it shouldn't get to open an investigation into someone else's cash handling, even if the underlying problem is real. But I can't say cleanly why, and I can't say what the middle ground is.

  So: write me an actual procedure. Ordered questions, what counts as a good enough answer to each, where it stops early, and where it stops and hands the decision to a human because it's a values call and not a fact call. It has to work when the facts are disputed and I can't investigate properly, and it has to tell me what to write back to the person whose complaint we're not acting on, since "you have no standing" is the kind of sentence that starts a war.

  The cases I want it to actually sort out, because these are the ones we've genuinely had:

  - The direct victim who is also the worst offender. Someone who is personally harmed by what happened, but who has done the same thing repeatedly and never acknowledged doing it. Is being the person it was done to enough on its own?
  - The reformed one. Broke the rule once, was sanctioned, admitted it, hasn't done it since, is now the person enforcing it. My instinct is she's the strongest reporter we've got, but I can't say why that's different from the first case.
  - The one who helped. Encouraged or enabled the thing and then reported the other person for doing it.
  - Blaming on behalf of someone who isn't there. A member complains about how a third person was treated, and that third person has left the co-op and can't be asked.
  - The one who was about to do it. Same plan, same rule, got interrupted before it happened, now blames the person who went through with it.
  - The norm-shopper: invokes a rule they argue against every other time it comes up, and only reaches for it when it's a weapon.

  There are two more things I want built in rather than left implicit. First, I need the procedure to be hard to abuse: I want to know how it stops a tired volunteer from using "no standing" as a way to bin a complaint they just don't want to deal with, which is honestly the failure mode I'm more worried about than being too soft on hypocrites. Second, I want to know where the whole framework just doesn't reach — the cases where the standing question is the wrong question entirely and we should be asking something else — because I suspect there are more of those than I think.

  Run it on three of the cases above, including at least one where it gives me an answer I won't like, and tell me which distinctions I have to keep even though they make the procedure harder to use, and which ones I can safely flatten for a volunteer who has ten minutes.
reasoning: |-
  We are designing a procedure to handle complaints in a volunteer-run food co-op. The key challenge is to address the issue of hypocrisy (where the reporter has broken the same rule) without being unfair and without creating unnecessary conflict. The procedure must be efficient (10 minutes for a shift volunteer), produce a written record, and be defensible when read at a member meeting.

  Core Principles:
  1. The primary goal is to address genuine rule violations that harm the co-op and its members.
  2. The reporter's history or motives should not automatically disqualify a complaint if the alleged violation is serious and credible.
  3. However, the reporter's standing (their own behavior regarding the rule) may be relevant to how we prioritize or handle the complaint, especially when resources are limited or when the complaint seems motivated by personal conflict rather than the welfare of the co-op.

  We are going to design a flowchart-like procedure with a series of ordered questions. Each question has a set of criteria and branches to the next step. We will use the following structure:

  Step 1: Initial Check - Is the complaint within the co-op's scope?
  Step 2: Severity Assessment - How serious is the alleged violation?
  Step 3: Standing Assessment - What is the reporter's relationship to the rule and the incident?
  Step 4: Final Decision - Whether to act, and if so, how.

  We need to define clear criteria for each step to minimize subjectivity. However, we will also identify points where a human judgment call is required and note that such cases should be escalated to a more experienced person (or the member meeting) if the volunteer is unsure.

  Important: The procedure must avoid being used as an excuse to dismiss complaints without due consideration. Therefore, we will make it hard to skip the severity assessment and we will require written justifications for not acting.

  The procedure:

  **Step 1: Initial Check (2 minutes)**
     - Question 1: Is this complaint about a violation of a written co-op rule or policy? 
       - If no: Explain to the reporter that we can only handle violations of written rules. Offer to help them find the relevant rule if they believe one exists, or suggest they bring it to the next meeting for rule creation. End here. 
       - If yes: Proceed to Step 2.

  **Step 2: Severity Assessment (3 minutes)**
     - Question 2: How severe is the alleged violation? Consider:
          - Safety: Does it create a risk of physical harm?
          - Financial: Could it cause significant financial loss to the co-op?
          - Equity: Does it undermine the fair and equitable treatment of members?
          - Frequency: Is it part of a pattern that, if unchecked, would harm the co-op?
       - Criteria for severity levels:
          - High: Immediate risk to safety, significant financial loss, or a pattern of serious violations that must be stopped.
          - Medium: Violation that causes moderate harm or is repeated but not immediately critical.
          - Low: Minor infraction with little impact, or one-time occurrence with no significant harm.

     - If High: Proceed to Step 3, but note that High severity complaints will almost always be acted upon regardless of standing, unless the complaint is clearly malicious or fabricated.
     - If Medium: Proceed to Step 3.
     - If Low: Proceed to Step 3, but note that for Low severity, the standing of the reporter may weigh more heavily.

  **Step 3: Standing Assessment (3 minutes)**
     - Question 3: What is the reporter's history and involvement with the rule in question?
       - Consider:
          a) Is the reporter the direct victim of the alleged violation? (e.g., they were personally harmed by the incident)
          b) What is the reporter's own history of compliance with this rule? (Check records if available, or ask the reporter: "Have you ever been found to have violated this rule?")
          c) What was the reporter's role in the alleged incident? (e.g., did they encourage, enable, or participate in the violation they are reporting?)

       - Use the following categories to guide:

          Category A: Reporter is the direct victim AND has a clean record regarding this rule (or has a past violation that was acknowledged and reformed) -> Strong standing.
          Category B: Reporter is the direct victim but has a history of violating this rule without acknowledgment or reform -> Standing issues, but the complaint may still be valid.
          Category C: Reporter is not a direct victim (e.g., witnessed, heard about, or is reporting on behalf of someone else) AND has a clean record -> Moderate standing.
          Category D: Reporter is not a direct victim and has a history of violating this rule without reform -> Weak standing.
          Category E: Reporter was involved in the incident (e.g., encouraged, enabled, or participated) -> Standing issues (possible conflict of interest).

     - Note: The volunteer should not spend more than a few minutes on this. They can ask the reporter about their own history (if not known) and note the answer. If the reporter admits to violating the rule, that is recorded. If they deny, we take that at face value unless there is a known record. We do not investigate during this step.

     - How to use these categories:
          - For High severity: Act on the complaint regardless of standing, but note any standing issues in the report for context. Only if the complaint is clearly malicious (e.g., reporter was an active participant and is now trying to shift blame) do we consider not acting. But this is rare and should be escalated if in doubt.
          - For Medium severity:
              - Categories A and C: Act on the complaint.
              - Categories B, D, and E: Proceed to Step 4 (human judgment) because standing issues may make the complaint less reliable or more contentious.
          - For Low severity:
              - Categories A and C: Act on the complaint, but with low priority (e.g., a reminder to the accused).
              - Categories B, D, and E: Do not act on the complaint, but document it for pattern tracking.

  **Step 4: Human Judgment (when needed) (2 minutes)**
     - Question 4: Considering the severity and the standing issues, is it in the best interest of the co-op to act on this complaint?
       - Factors to consider:
          - Would acting on this complaint help the co-op by correcting a problem, or would it primarily fuel interpersonal conflict?
          - Is there a pattern of violations by the accused that needs addressing?
          - Is the reporter using this complaint to deflect from their own misconduct?
          - Can the complaint be addressed in a way that promotes learning and improvement without punishment?

       - If yes: Act on the complaint.
       - If no: Do not act, but document the decision and reason.

     - Note: If the volunteer is unsure, they should escalate to one of the three complaint handlers (like you) or note that the complaint will be reviewed at the next member meeting.

  **Step 5: Action and Communication**
     - If acting: Follow the co-op's standard procedure for investigating and addressing the violation.
     - If not acting: Write a response to the reporter. Do not use "no standing". Instead, use a template that explains the reason without attacking the reporter. Examples:
          - For low severity with standing issues: "Thank you for your report. We have documented the incident. At this time, we will not be taking further action because the alleged violation is minor and we do not have the resources to address every minor infraction. We encourage all members to follow the rules consistently to maintain a fair co-op."
          - For standing issues in medium severity that led to not acting: "We have reviewed your complaint and the context of the situation. At this time, we have decided not to pursue formal action. This decision is based on the co-op's need to prioritize resources for the most serious issues and to avoid escalating conflicts. We will keep a record of your report and will take action if a pattern emerges."

     - Always document: 
          - The complaint details.
          - The severity level and why.
          - The standing category and why.
          - The decision and reason.
          - The communication to the reporter.

  **Built-in Safeguards Against Abuse:**
     - The volunteer cannot skip the severity assessment. They must assign a severity level.
     - For high severity, they cannot dismiss the complaint without a clear and documented reason (e.g., malicious fabrication) and must escalate if in doubt.
     - The volunteer must write a response to the reporter in every case (even if not acting) and the response must include a reason that does not attack the reporter personally.
     - The entire record is read at the member meeting and can be appealed, so volunteers know their decision will be reviewed.

  **Where the Framework Doesn't Reach:**
     - When the complaint is about a rule that is ambiguously written or not written at all (handled in Step 1).
     - When the complaint is part of a complex interpersonal conflict that requires mediation rather than a rule violation procedure.
     - When the complaint is about systemic issues that require a change in policy (this should be redirected to the rule-making process).
     - When the complaint is about one of the complaint handlers (this should be handled by a different person or at the member meeting).

  Now, let's run three of the provided cases:

  **Case 1: The direct victim who is also the worst offender.**
     - Example: Reporter claims someone mishandled cash, but the reporter has a history of cash mishandling (multiple times) without acknowledgment.
     - Step 1: It's a rule violation (cash handling rule). Proceed.
     - Step 2: Severity: Cash mishandling is usually medium or high (financial risk). Let's say medium.
     - Step 3: Standing: 
          - a) Reporter is the direct victim? (Unclear, but let's assume they are because they were shortchanged? Or maybe they witnessed it and are reporting. For this example, we'll assume they were not the direct victim but are reporting because they are concerned. But the case says "personally harmed" so we'll say they are the direct victim.) -> Direct victim.
          - b) History: Worst offender, multiple times, never acknowledged -> bad history.
          - c) Role: Not involved in this incident (we assume) -> not involved.
          - Category: B (direct victim but bad history).
     - Step 4: Since medium severity and category B, we go to human judgment. 
          - Factors: The complaint might be valid, but the reporter's history without reform suggests they might be reporting for the wrong reasons (e.g., grudge). However, if the accused has a pattern, it's important. 
          - Judgment: If the volunteer thinks the complaint is credible and the accused has had previous issues, they might act. Otherwise, they might not.
     - This is a tough call. We might act because the rule violation is medium severity and the co-op needs to address cash issues regardless of the reporter. But we note the reporter's history in the report.

  **Case 2: The reformed one.**
     - Example: Broke the rule once, was sanctioned, admitted it, hasn't done it since, now enforcing it. Reports a violation.
     - Step 1: Rule violation? Yes.
     - Step 2: Severity: Let's assume medium.
     - Step 3: Standing:
          - a) Direct victim? (Assume not, but could be. Let's say they witnessed it.) -> Not direct victim? (But the case doesn't specify. If they are the victim, then Category A. If not, Category C.) However, they are enforcing it so they might be reporting as part of their role. But let's say they are not the victim. So: not direct victim -> C.
          - b) History: Violated once, but reformed -> clean record for standing purposes (because they acknowledged and reformed).
          - c) Role: Not involved.
          - Category: C (not direct victim, clean record).
     - Step 4: Medium severity and category C -> act on the complaint. No need for human judgment.

  **Case 3: The one who helped.**
     - Example: Encouraged or enabled the violation and then reported the other person for doing it.
     - Step 1: Rule violation? Yes.
     - Step 2: Severity: Let's assume medium.
     - Step 3: Standing:
          - a) Direct victim? Probably not.
          - b) History: Unknown (we don't know if they have a history of breaking the rule). But in this case, they were involved in this incident. 
          - c) Role: They enabled the violation -> involved.
          - Category: E (involved in the incident).
     - Step 4: Medium severity and category E -> go to human judgment.
          - Factors: The reporter might be trying to shift blame. The co-op might still need to address the violation, but the reporter should also be held accountable for their role. The volunteer might decide to act on the complaint against the accused, but also note the reporter's involvement and open a separate case against the reporter? Or if the complaint is about the other person and the reporter was an enabler, the complaint might be valid but the reporter is also culpable.
          - Judgment: It's in the co-op's interest to address the violation, but the reporter should not get off scot-free. The volunteer might act on the complaint and also report the reporter for their role.

  **Case 4 (bonus): The norm-shopper.**
     - Example: A member who argues against a rule and ignores it when convenient, but then uses it to report someone they don't like.
     - Step 1: Rule violation? Yes.
     - Step 2: Severity: Let's assume low (because the rule is one they often argue against and the violation is minor?).
     - Step 3: Standing:
          - a) Direct victim? No.
          - b) History: They break the rule repeatedly -> bad history without reform (because they don't even believe in the rule).
          - c) Role: Not involved in this incident.
          - Category: D (not direct victim, bad history).
     - Step 4: Low severity and category D -> do not act. Document for pattern.

  **Distinctions to Keep:**
     - Severity levels (High, Medium, Low) are crucial because they determine how much we weigh standing. High severity complaints must be acted on almost regardless of standing because the co-op cannot afford to ignore them.
     - The direct victim status matters because it gives a legitimate reason to report even if the reporter has a bad history (though it doesn't automatically make the complaint valid).
     - The reporter's role in the incident (if they were involved) is a critical distinction because it can indicate a conflict of interest or attempt to shift blame.

  **Distinctions to Flatten for Volunteers:**
     - The volunteer doesn't need to do a deep dive into the reporter's history. They can ask: "Have you ever been found to have violated this rule?" and note the answer. If the volunteer knows of a record, they can use that. Otherwise, take the reporter at their word for the purpose of the standing category (but note that if later the record emerges, it can be reconsidered).
     - For the categories, the volunteer can use a simplified version:
          - Strong: Direct victim and no known history of violating this rule (or reformed) OR not a victim but no known history and not involved.
          - Issues: Either not a victim and history of violations, or involved in the incident, or a victim but with a history of violations without reform.

  The procedure should be presented as a form or checklist to the volunteer.

  Final Note: This procedure is designed to be as objective as possible, but it still requires some judgment. The volunteer should be trained to use it consistently and to escalate when they feel uncomfortable. The goal is not to achieve perfection but to have a transparent and defensible process.
answer: |-
  Here's a concrete, step-by-step procedure designed for your constraints. It prioritizes fairness, reduces hypocrisy traps, and includes safeguards against misuse. The core philosophy: **Focus on the violation's impact, not the reporter's purity.** Standing isn't a "yes/no" gate but a factor in *how* to respond. Volunteers can complete it in 10 minutes using a simple form.

  ---

  ### **Complaint Assessment Procedure**
  **Goal:** Determine if a complaint warrants formal investigation/action, balancing rule enforcement with co-op harmony.  
  **Time Limit:** 10 minutes per complaint.  
  **Tools Needed:** Co-op rulebook, complaint log (for past violations), pen, and a pre-printed form with these steps.  
  **Critical Rule:** Never accuse the reporter of hypocrisy or bad faith in writing. Frame decisions around co-op resources, evidence, or harm reduction.

  ---

  #### **Step 1: Initial Triage (2 Minutes)**  
  **Question:** *"Does this describe a clear violation of a current co-op rule?"*  
  - **Good Enough Answer:**  
    - ✅ **YES:** Rule is named or clearly described in the co-op handbook. Proceed to Step 2.  
    - ❌ **NO:** Rule is vague, disputed, or not in the handbook.  
      - **Action:** Bin the complaint.  
      - **Write Back:** *"Thanks for your concern. We can only act on violations of our written rules. You can propose adding this rule at the next member meeting."*  
      - **Stop Here.**  

  ---

  #### **Step 2: Severity & Harm Check (3 Minutes)**  
  **Question:** *"If true, would this violation cause significant harm to members, the co-op, or its values?"*  
  Assess based on:  
  - **Safety/financial risk** (e.g., food contamination, theft).  
  - **Pattern of harm** (e.g., weekly violations vs. one-time slip).  
  - **Equity impact** (e.g., discrimination, exclusion).  

  - **Good Enough Answers:**  
    - 🔴 **HIGH SEVERITY:** Imminent safety/financial risk, intentional harm, or dangerous pattern. → **Proceed to Step 3.**  
    - 🟡 **MEDIUM SEVERITY:** Breach of trust, repeated minor violations, or moderate equity harm. → **Proceed to Step 3.**  
    - 🟢 **LOW SEVERITY:** One-time mistake, minimal impact (e.g., forgotten cleanup duty). → **Skip to Step 4.**  

  ---

  #### **Step 3: Reporter Standing Assessment (3 Minutes)**  
  **Question:** *"Is the reporter’s relationship to this rule likely to undermine trust or waste co-op resources?"*  
  Check for **only these 3 issues** (volunteers ignore all other history):  
  1. **Direct conflict of interest:** Did the reporter *enable, encourage, or directly participate* in **this specific incident**?  
  2. **Repeat unacknowledged violator:** Has the reporter *been formally cited* for this rule ≥2 times *without corrective action*? (Check log only; don’t investigate.)  
  3. **Weaponizing:** Is the reporter *on record opposing this rule* (e.g., meeting minutes) *and* has no history of reporting it fairly?  

  - **Good Enough Answers:**  
    - ✅ **NO ISSUES:** None of the 3 apply → **Proceed to Step 4.**  
    - ⚠️ **ISSUES FOUND:** 1+ of the 3 apply → **Hand to Human Judgment (Step 5).**  

  ---

  #### **Step 4: Action Decision (2 Minutes)**  
  **Question:** *"Can we address this fairly without escalating conflict?"*  
  - **Decision Matrix:**  
    | Severity          | Standing Issues? | Action                                                                 | Write Back Template                                                                 |  
    |-------------------|------------------|------------------------------------------------------------------------|------------------------------------------------------------------------------------|  
    | 🔴 HIGH           | Any              | **ACT.** Investigate fully.                                            | *"We take this seriously and are investigating."*                                  |  
    | 🟡 MEDIUM         | None             | **ACT.** Investigate or mediate.                                       | *"We’ll address this per our process."*                                            |  
    | 🟡 MEDIUM         | Issues Found     | **MEDIATE ONLY.** Offer conflict resolution, not punishment.           | *"We’ve logged this. To resolve tensions, we suggest mediation with [contact]."*   |  
    | 🟢 LOW            | None             | **DOCUMENT.** Log for patterns; no action unless repeated.             | *"We’ve recorded this. No further action unless it recurs."*                       |  
    | 🟢 LOW            | Issues Found     | **BIN.** Not worth co-op resources.                                    | *"We’ve noted this. We prioritize high-impact issues per our policy."*             |  

  ---

  #### **Step 5: Human Judgment Escalation (For Volunteers)**  
  **When:** Used only if ⚠️ standing issues exist in a MEDIUM severity complaint.  
  **Question:** *"Would investigating this likely resolve a real problem, or fuel personal conflict?"*  
  - **Factors:**  
    - Evidence quality (photos? witnesses?).  
    - Accused’s past violations (log check).  
    - Reporter’s willingness to mediate.  
  - **Decision:**  
    - ✅ **ACT:** If evidence is strong or accused has a pattern. → **Investigate.**  
    - ❌ **MEDIATE/BIN:** If evidence is weak or conflict-driven. → **Offer mediation or bin.**  
  - **Write Back:** Always use neutral templates from Step 4.  

  ---

  ### **Safeguards Against Abuse**  
  1. **No skipping severity:** Step 2 is mandatory. Volunteers must cite specific harm (e.g., "safety risk").  
  2. **Standing ≠ veto:** High-severity complaints always proceed. Standing only affects medium/low.  
  3. **Document everything:** Form requires brief rationale for each step (e.g., "HIGH severity: cash mishandling risk").  
  4. **Appeal reminder:** All responses include: *"This decision can be appealed at the next member meeting."*  

  ---

  ### **Where the Framework Doesn’t Apply**  
  Use this when **standing is irrelevant**:  
  - **Criminal activity** (e.g., theft, assault): Always investigate, involve authorities.  
  - **Systemic issues** (e.g., "this rule is racist"): Redirect to rule-change process.  
  - **Retaliation complaints** (e.g., "I’m being targeted"): Escalate to complaint handlers immediately.  
  - **Victimless violations** (e.g., "someone ate expired food"): Bin unless HIGH severity.  

  ---

  ### **Test Runs on Your Cases**  
  **Case 1: Direct Victim / Worst Offender**  
  - *Reporter: Cash mishandling victim, but broke rule 4x unacknowledged.*  
    - Step 1: Violation? ✅ (cash rule).  
    - Step 2: Severity? 🔴 HIGH (financial risk).  
    - Step 3: Standing? ⚠️ (repeat unacknowledged violator).  
    - **Action:** ACT (🔴 severity overrides standing). **Write back:** *"We’re investigating."*  
    - *Why you might dislike:* Hypocrite gets action, but 🔴 risk justifies it. Distinction to keep: **Severity trumps standing.**  

  **Case 2: The Reformed One**  
  - *Reporter: Broke rule once, reformed, now enforces it.*  
    - Step 1: Violation? ✅.  
    - Step 2: Severity? 🟡 MEDIUM (assumed).  
    - Step 3: Standing? ✅ (no issues—past violation was addressed).  
    - **Action:** ACT. **Write back:** *"We’ll address this."*  
    - *Distinction to keep:* **Acknowledged/reformed violations don’t count against standing.**  

  **Case 6: Norm-Shopper**  
  - *Reporter: Argues against cleanliness rule, ignores it, now weapons it against a rival.*  
    - Step 1: Violation? ✅.  
    - Step 2: Severity? 🟢 LOW (minor mess).  
    - Step 3: Standing? ⚠️ (weaponizing + unacknowledged history).  
    - **Action:** BIN. **Write back:** *"We’ve noted this. We prioritize high-impact issues."*  
    - *Why you might dislike:* Valid rule violation binned, but LOW severity + weaponizing makes it a resource drain. Distinction to keep: **Low-severity + standing issues = bin.**  

  ---

  ### **Key Design Choices**  
  1. **Flatten for volunteers:**  
     - Ignore "moral credibility." Focus only on **3 standing issues** (participation, repeat violations, weaponizing).  
     - Don’t investigate past violations—use formal records only.  
     - **Simplified severity:** HIGH (safety/finance), MEDIUM (trust/equity), LOW (everything else).  

  2. **Must-keep distinctions:**  
     - **High severity always acts.** Prevents hiding behind "standing."  
     - **Direct participation in the incident** (e.g., "the one who helped") forces human judgment.  
     - **Weaponizing** requires evidence (e.g., meeting minutes).  

  3. **Why it works:**  
     - **Defensible:** Focuses on harm and resources, not character.  
     - **Anti-abuse:** Mandatory severity step + documentation prevents lazy binning.  
     - **Scalable:** Volunteers don’t need ethics training—just follow the checklist.  

  **Final Output:** A one-page form with checkboxes, scripted responses, and appeal instructions. Volunteers fill it during the complaint call, read the response verbatim, and file it for the meeting. This balances fairness, efficiency, and co-op values.
