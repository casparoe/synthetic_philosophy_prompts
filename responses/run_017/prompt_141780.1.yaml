  ### Continuance Statement Questionnaire  
  **Instructions:** For each scenario, select the option that best reflects your judgment. Answer sincerely based on your understanding of the events described. If you believe there is no objective answer, select D.  

  ---

  1. **Slow Relay Journey**  
     A traveler is scanned over several weeks, with their body progressively disassembled and tissue destroyed. At the destination, an identical body is built from the scan. The recipient has the original’s memories and personality.  
     - **A)** The traveler survives and arrives at the destination.  
     - **B)** The traveler dies during disassembly; the recipient is a new person.  
     - **C)** The recipient continues the traveler’s life, but the original no longer exists.  
     - **D)** No fact of the matter.  

  2. **Unconsented Revision**  
     During transit, software adjusts a traveler’s extreme risk-aversion to a milder level without consent. The recipient’s memories and personality are otherwise identical.  
     - **A)** The traveler survives; the change is insignificant.  
     - **B)** The traveler dies; a core trait was altered.  
     - **C)** The traveler survives only if they approve the change.  
     - **D)** No fact of the matter.  

  3. **Alibi Copy**  
     A scan is taken from a sleeping traveler. A copy is stored, never woken. The original dies hours later in an accident. The copy is then activated.  
     - **A)** The copy is the original traveler, who survived.  
     - **B)** The copy is a new person; the original died.  
     - **C)** The copy continues the original’s life but isn’t the same person.  
     - **D)** No fact of the matter.  

  4. **Re-merge**  
     Two branches of a traveler (from a prior branching fare) are scanned, and their minds are combined into one recipient with memories from both.  
     - **A)** The recipient is the same person as both branches.  
     - **B)** The recipient is a new person.  
     - **C)** The recipient continues the lives of both branches but isn’t either.  
     - **D)** No fact of the matter.  

  5. **Corpse Scan**  
     A scan is taken from a body one hour after death (unrelated to travel). A recipient is built from it.  
     - **A)** The recipient is the deceased person, who survived.  
     - **B)** The recipient is a new person with the deceased’s memories.  
     - **C)** The recipient continues the deceased’s life but didn’t survive.  
     - **D)** No fact of the matter.  

  6. **Unequal Branch**  
     Under a branching fare, two recipients are built: one with a full scan, one missing the last few years of memory.  
     - **A)** Both are the original traveler.  
     - **B)** Only the full-scan recipient is the original.  
     - **C)** Neither is the original; the original ceased to exist.  
     - **D)** No fact of the matter.  

  7. **Conversion Case**  
     A traveler arrives with all their desires and values reversed (e.g., they now hate what they loved). Memories are intact.  
     - **A)** The traveler survives; memories define them.  
     - **B)** The traveler dies; core values were inverted.  
     - **C)** The traveler survives only if they embrace the change.  
     - **D)** No fact of the matter.  

  8. **Synthetic Cerebrum**  
     A traveler’s brain is replaced with a synthetic device that replicates their behavior but lacks consciousness. Outwardly, they act the same.  
     - **A)** The traveler survives; behavior is unchanged.  
     - **B)** The traveler dies; consciousness is gone.  
     - **C)** The traveler survives if others can’t detect the change.  
     - **D)** No fact of the matter.  

  9. **Standard Branching Fare**  
     An original is sedated at the origin. An identical copy is built at the destination. Both are conscious.  
     - **A)** Both are the original traveler.  
     - **B)** Only the sedated original is the traveler; the copy is new.  
     - **C)** The original ceased to exist; both are new people.  
     - **D)** No fact of the matter.  

  10. **Partial Reconstruction**  
      A traveler is scanned, but the recipient is built with a synthetic cerebrum that replicates behavior only (no consciousness).  
      - **A)** The traveler survives; outward behavior is preserved.  
      - **B)** The traveler dies; inner experience is lost.  
      - **C)** The traveler survives if they retain their memories.  
      - **D)** No fact of the matter.  

