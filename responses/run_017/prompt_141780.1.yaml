  The positions we are sorting into (for the author's reference, not on the form):
  1. Psychological continuity with no-branching (PC-NB): survival requires psychological continuity and no branching (so fission is death).
  2. Psychological continuity without no-branching (PC): survival is possible via psychological continuity even in fission (so both branches are the original? or survival without identity?).
  3. Non-reductionist further fact (NR): survival depends on a further fact beyond physical/psychological continuity.
  4. Organism view (O): we are essentially living organisms.
  5. Narrative view (N): survival depends on the narrative self-constitution.
  6. Reductionist view (R): survival is about overlapping chains of continuity (regardless of cause).
  7. Deflationary view (D): there is no self of the kind assumed.

  We must include or adapt the following scenarios:
  - Slow relay: scan over weeks, original progressively loses tissue.
  - Unconsented revision: software normalizes an extreme trait (e.g., risk-aversion softened).
