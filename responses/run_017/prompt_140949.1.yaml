prompt: |-
  You are a philosopher of cognitive science who has also done hands-on interpretability work on transformer language models. Please think carefully and slowly about the request below. Before writing your final answer, brainstorm: enumerate more candidate conflicts among my commitments than you think you need, including ones you will later reject, and only then prune and rank. I would rather see the pruning than only the survivors. Write at the level of a colleague's written comments on a draft — dense, specific, willing to say that something I hold is not doing the work I think it is — not at the level of a survey article. No bibliography or citations are wanted; argue from the structure of the views.

  I am a PhD student in philosophy writing a short position statement on whether trained neural networks really have representations, or whether talk of representation is only a useful façon de parler about systems we do not yet understand. I want the package audited before I commit to it. Here is where I have landed:

  (1) Feature realism. There is a fact of the matter about which features a trained network represents, and this fact is not fixed by what interpreters find useful, by what is convenient to visualize, or by which decomposition we happen to choose. It is a substantive, interpreter-independent fact that our attributions could in principle get wrong.

  (2) Basis anti-privilege. No basis of activation space is metaphysically canonical: not the neuron or "standard" basis, not the directions recovered by dictionary learning / sparse autoencoders, not principal components. Two decompositions can be incompatible as sets of directions and yet both be perfectly good descriptions of the same network.

  (3) Superposition. Networks standardly represent many more features than they have dimensions: features correspond to directions that are not mutually orthogonal, and the network tolerates a nonzero amount of interference among them because the features are sparse.

  (4) The linear representation hypothesis. Features are, at least approximately, linear directions in activation space rather than, say, regions, manifolds, or essentially nonlinear codes.

  (5) The causal-efficacy criterion. A candidate feature is a real feature of the network only if the network's own downstream computation actually reads it out. This is what I rely on to settle the "grain" problem: when a finer-grained dictionary splits one coarse feature into several, or when one dictionary element's variance gets absorbed into others, I want to say that the grain at which the network itself is sensitive settles which of these are the features, and that a decomposition element nothing downstream consults is not a feature of the network at all.

  (6) Interventionist evidentialism. Representation claims are warranted only by interventional evidence — patching, steering, ablation that changes behavior in the way the hypothesis predicts. Merely observational or correlational evidence, such as a linear probe's accuracy, is at most suggestive and never sufficient.

  (7) Anti-propositionalism. It is a mistake to ascribe beliefs, desires, or propositional attitudes to models. Interpretability is not in the business of recovering "what the model thinks"; where such talk appears it should be read as shorthand for behavioral or counterfactual dispositions.

  One distinction I have been leaning on in the draft: the difference between a feature's causal profile — the inputs that activate it and the downstream effects it has — and its geometric realization — the particular direction or set of directions in which it is implemented. I use this to argue that (1) and (2) are compatible: realism is about causal profiles, and one causal profile can have many geometric realizations.

  And one hypothetical I want you to take as stipulated, not as something to look up or to correct me about. Call it the no-bridge result: suppose that two models trained independently from different initializations produce dictionaries with no recoverable correspondence to one another — no correspondence under any invertible linear map, and no transfer of steering vectors in either direction — while the models remain behaviorally indistinguishable on every input distribution we can construct, and while each model individually supports the full range of successful interventions within itself. Suppose further that this holds however much we refine the dictionaries.

  What I want from you:

  1. An audit of the package. Which pairs of commitments are genuinely in tension, ranked by severity rather than listed flatly? For each: state the tension precisely, say which commitment must go or be revised, and say what that revision costs me elsewhere in the package.
  2. Discrimination. I suspect at least one pair only looks like a conflict and dissolves once the commitments are stated carefully. Tell me which, if any, and why it dissolves — and tell me if you think I am wrong that any of them dissolves.
  3. Whether the causal-profile / geometric-realization distinction can bear the weight I am putting on it in reconciling (1) with (2), given (5). In particular: does the distinction help, or does it just relocate the problem from directions to causal profiles?
  4. What the no-bridge result actually threatens. Does it count against (1) itself, against only a familiar evidential argument for realism, or against nothing I have said? Is there a version of my view on which it is predicted, and if so does that version still deserve to be called realism?
  5. The single revision that would clean up the most of the package at the least cost, and an honest statement of what it costs.

  Two constraints. First, do not resolve tensions by retreating to quietism or conventionalism — "the network has the features it is useful to say it has" is not available to me, and I say so in (1). Second, do not soften every conflict into an "it depends." If two of my commitments cannot both be kept in the strong form in which I have stated them, say which one has to weaken, and say what the weakened version would commit me to on a case: e.g., what it would make me say about a dictionary feature that no intervention can isolate, or about a steering vector that generalizes across prompts but to which I deny propositional content.
reasoning: |-
  We are given a set of commitments and asked to audit them for internal tensions, with specific questions. The commitments are:

  (1) Feature realism: There is an interpreter-independent fact about which features are represented.

  (2) Basis anti-privilege: No basis (neuron, dictionary, PCA, etc.) is metaphysically canonical; multiple decompositions can be valid.

  (3) Superposition: Networks represent more features than dimensions, with non-orthogonal directions and sparse activations.

  (4) Linear representation hypothesis: Features are linear directions.

  (5) Causal-efficacy criterion: A feature is real only if downstream computation reads it out.

  (6) Interventionist evidentialism: Only interventional evidence warrants representation claims.

  (7) Anti-propositionalism: No propositional attitudes; interpretability is about dispositions.

  We also have a distinction: causal profile (inputs and effects) vs. geometric realization (direction in activation space).

  And a hypothetical: the "no-bridge result" where two models have incommensurable dictionaries but are behaviorally and interventionally identical.

  We must:

  1. Audit: List tensions, rank by severity, state precisely, say which must be revised and at what cost.

  2. Discrimination: Identify which apparent conflict dissolves on careful statement.

  3. Evaluate the causal/geometric distinction for reconciling (1) and (2) given (5).

  4. Analyze the no-bridge result: what it threatens.

  5. Propose a single revision that cleans up the most at least cost.

  Constraints: No retreat to quietism/conventionalism; no softening to "it depends" — be decisive.

  ---

  ## Step 1: Brainstorm candidate tensions (without pruning)

  We'll list pairs of commitments that might conflict, and why.

  ### Tension 1: (1) Realism vs. (2) Anti-privilege
  - If there is an interpreter-independent fact about which features are represented (1), but no basis is privileged (2), then what fixes the features? The causal profile? But if two decompositions are geometrically incompatible but both capture the same causal profile, then (1) might be satisfied at the level of causal profiles. However, if the geometric realizations are different, and features are linear directions (4), then we have two different sets of directions for the same causal profile. But (5) says that a feature must be read out downstream. If the downstream readout is linear, then it must be reading out some specific linear combination. So if two decompositions are both causally efficacious, then they must both be read out? But that might require that the readout weights adjust accordingly.

  ### Tension 2: (1) Realism vs. (3) Superposition
  - Superposition says that features are not orthogonal and interfere. But if features are real and independent, how can they interfere? Realism might require that features are objectively there, but superposition means that they are not independent and their representations are entangled. This might not be a direct conflict, because realism doesn't require independence.

  ### Tension 3: (1) Realism vs. (5) Causal-efficacy
  - If a feature is real only if causally efficacious, then what about features that are represented but not used? Realism (1) might allow for latent features that are not currently used, but (5) says they are not real features. So (5) restricts the set of real features to those that are read out. This might be a tension if we think realism should include unused features.

  ### Tension 4: (2) Anti-privilege vs. (5) Causal-efficacy
  - (5) says that a feature is real only if downstream uses it. But if multiple bases are equally valid, then which one is being used? The downstream computation might be implemented in a particular basis. For example, if the next layer is a linear layer, it has a weight matrix that connects to the current activations in a specific basis. So the readout is basis-dependent. Thus, the causal efficacy might pick out a privileged basis: the one that the downstream weights are aligned with. This conflicts with (2) which says no basis is privileged.

  ### Tension 5: (4) Linear representation vs. (5) Causal-efficacy
  - (4) says features are linear directions. (5) says they must be read out. But if the readout is nonlinear, then the feature might not be a linear direction? But (4) says features are linear directions in activation space, so the readout might be using nonlinear functions of these. This might not be a conflict because the feature is still a linear direction in its space, even if the readout is nonlinear.

  ### Tension 6: (5) Causal-efficacy vs. (6) Interventionism
  - (6) says we need interventions to know about features. (5) says a feature is real only if causally efficacious. These might be compatible, but (6) might be seen as an epistemic constraint, while (5) is metaphysical. But they are both about the nature of features. The tension: if we can't intervene on a feature (say, because it's entangled), then by (6) we can't warrant it, but by (5) it might still be real if it's read out. But (6) says we can't warrant it, so we can't know. This is more an epistemic vs. metaphysical issue.

  ### Tension 7: (1) Realism vs. (6) Interventionism
  - (1) is about metaphysical realism, (6) is about evidence. They might be compatible, but if we can only know via interventions, then we might not be able to know about features that are not intervenable? But (1) says there is a fact, even if we can't know it. So no direct conflict.

  ### Tension 8: (2) Anti-privilege vs. (4) Linear representation and (3) Superposition
  - With superposition, we can have multiple bases that represent the same features. But (4) says features are linear directions, so each feature is a direction. But if multiple bases are valid, then the same feature might be represented by different directions? That doesn't make sense because a feature is a direction. This is where the causal profile vs. geometric realization distinction comes in: the causal profile is the same, but the geometric realization differs. But if the feature is a direction, then a change in direction changes the feature? Unless we say the feature is the causal profile, and the direction is just the implementation.

  ### Tension 9: (5) Causal-efficacy vs. the no-bridge result
  - In the no-bridge result, we have two models with different dictionaries, but each supports interventions. So in each model, the features are causally efficacious. But if the dictionaries are incommensurable, then the geometric realizations are different. But (5) is about causal efficacy, which is satisfied in each model. (1) says there is a fact about features, but if the two models have different features (because different directions) but same behavior, then which one is right? Or are both right? But realism might say that there is a unique set of features? Not necessarily — multiple realizability. But if the features are different, but the causal profiles are the same, then by the distinction, the causal profile is the same, so the features (as causal profiles) are the same. But the geometric realizations are different. So (1) is about causal profiles, so it's fine.

  ### Tension 10: (3) Superposition and (5) Causal-efficacy
  - In superposition, features are not orthogonal and interfere. But if the downstream readout is linear, it might be reading out a combination that has interference. But (5) requires that the feature is read out. If the feature is a direction, and the readout is linear, then it is read out. However, because of interference, the readout might be noisy. But the network is designed to tolerate that. So no conflict.

  ### Tension 11: (4) Linear representation and (3) Superposition
  - They are compatible; in fact, superposition assumes linear representations.

  ### Tension 12: (7) Anti-propositionalism and the rest
  - This seems independent. It's about how we talk, not about the nature of representation.

  ### Tension 13: (1) Realism and the no-bridge result
  - If two models have incommensurable geometric realizations but same causal profiles, then realism about causal profiles is fine. But if we think that the geometric realization matters for the identity of the feature, then we have a problem. But the distinction is meant to avoid that.

  ### Tension 14: (2) Anti-privilege and (5) Causal-efficacy (revisited)
  - This seems the most severe. (5) says that the downstream computation reads out the feature. The downstream computation is implemented in a particular basis. For example, if the next layer is a linear layer, then it has a weight vector that is aligned with a specific direction (or a linear combination) in the activation space. But that weight vector is defined in the standard basis (the neuron basis). So the readout is done in the neuron basis. Therefore, the neuron basis might be privileged for causal efficacy. This contradicts (2) which says no basis is privileged.

  ## Step 2: Prune and rank tensions

  We now prune the tensions that are not severe or can be resolved easily. Then rank the remaining by severity.

  - Tension 2 (1 vs 3): Not severe. Realism doesn't require orthogonality; superposition is compatible with features being real but interfering.
  - Tension 3 (1 vs 5): Not a tension if we accept that (5) defines what counts as a real feature. (1) says there is a fact, and (5) tells us what that fact is: features are the ones that are causally efficacious. So (5) refines (1).
  - Tension 5 (4 vs 5): Not a conflict. Features are linear directions (4), and they are read out (5). The readout might be nonlinear, but that doesn't change that the feature is a linear direction in its space.
  - Tension 6 (5 vs 6): Epistemic vs. metaphysical. (6) is about evidence, (5) is about what exists. They can coexist: we can only know about causally efficacious features via interventions.
  - Tension 7 (1 vs 6): Similarly, no conflict; (1) is metaphysical, (6) is epistemological.
  - Tension 8 (2 vs 4 and 3): With the causal/geometric distinction, it dissolves: the feature is the causal profile, which can be realized by multiple geometric bases. (4) says the geometric realization is linear, which is consistent.
  - Tension 10 (3 vs 5): No conflict; superposition is the mechanism, causal efficacy is the criterion for reality.
  - Tension 11 (4 vs 3): No conflict; they are complementary.
  - Tension 12 (7 vs others): Independent, no conflict.
  - Tension 13 (1 vs no-bridge): With the distinction, it's not a problem.

  Now the tensions that remain:

  - **Tension 1: (1) Realism vs. (2) Anti-privilege** — but we have the causal/geometric distinction to reconcile them. Question 3 asks if this can bear the weight, especially given (5).

  - **Tension 4: (2) Anti-privilege vs. (5) Causal-efficacy** — this is severe because (5) might imply a privileged basis.

  - **Tension 9: (5) and no-bridge** — we'll address in the no-bridge section.

  We also have:

  - **Tension 14: (2) vs (5)** is the same as Tension 4.

  So the main tension is between (2) and (5).

  Another candidate:

  - **Tension 15: (5) Causal-efficacy and (6) Interventionism** — if a feature is causally efficacious but we cannot intervene on it (e.g., because of entanglement), then (6) says we cannot warrant it, but (5) says it is real. But this is an epistemic issue, not a direct conflict. We can say that such features exist but are unknowable. But (6) is about evidence, not existence, so it's acceptable.

  But we'll focus on the most severe.

  Ranking:

  1. **Tension between (2) Anti-privilege and (5) Causal-efficacy**: This is severe because the causal-efficacy criterion might force a privileged basis for the readout, contradicting anti-privilege.

  2. **Tension between (1) Realism and (2) Anti-privilege**: Even with the distinction, if (5) forces a geometric basis, then the causal profile might be tied to a particular geometric realization.

  3. Others are less severe or resolvable.

  ## Step 3: Address the questions

  ### 1. Audit of tensions (ranked)

  We'll list the key tensions, state them precisely, and say what must be revised.

  **Tension A (highest severity): (2) Basis anti-privilege vs. (5) Causal-efficacy criterion**

  - **Precise tension**: The causal-efficacy criterion (5) states that a feature is real only if the downstream computation reads it out. In a standard neural network, the downstream computation (e.g., the next linear layer) operates on activations in a specific basis — typically the neuron basis. Therefore, the readout is defined relative to that basis. For instance, a weight vector in the next layer is a linear functional that picks out a specific direction in the neuron basis. This suggests that the neuron basis is privileged for causal efficacy: it is the basis in which the computation is implemented. This contradicts (2), which denies that any basis (including the neuron basis) is metaphysically canonical.

  - **Which must go or be revised?** (2) must be revised, because (5) is central to the account and provides a criterion for feature reality. Without (5), we lose the ability to settle the grain problem and risk inflating features. Alternatively, we could revise (5) to allow for multiple bases, but that might weaken it.

  - **Revision cost**: 
    - If we revise (2) to allow that the neuron basis is privileged for causal efficacy, then we lose the strong anti-privilege claim. We might say that while multiple decompositions are mathematically possible, only the one aligned with the downstream readout is causally real. This costs us the elegant reconciliation of multiple decompositions via the causal/geometric distinction. It also goes against findings in superposition that show features are not aligned with neurons.
    - Alternatively, we could weaken (5): say that a feature is real if it is read out in some basis, but then we must explain how the readout works in different bases. However, the physical implementation of the network computes in the neuron basis.

  **Tension B: (1) Feature realism vs. (2) Basis anti-privilege**

  - **Precise tension**: (1) asserts an interpreter-independent fact about features, while (2) denies a canonical basis. The causal/geometric distinction is meant to resolve this: realism applies to causal profiles, and multiple geometric realizations are possible. However, if (5) forces a particular geometric basis for causal efficacy, then the causal profile might be tied to that basis, undermining the distinction.

  - **Does the distinction hold?** This depends on whether we can separate causal profile from geometric realization even when the readout is basis-dependent. If the causal profile is defined by inputs and outputs, it might be basis-independent, but the mechanism (the readout) is basis-dependent. The tension might be resolved if we accept that the same causal profile can be realized by different geometric bases, as long as the downstream weights are adjusted accordingly. But in a fixed network, the weights are fixed, so only one basis is used.

  - **Which must go?** Neither necessarily; the distinction might hold if we allow that the causal profile is what matters, and the geometric realization is secondary. But the tension with (5) above might force a revision.

  **Tension C: (5) Causal-efficacy and (6) Interventionism**

  - **Precise tension**: (5) says a feature is real if causally efficacious; (6) says we can only warrant it by interventions. What if a feature is causally efficacious but we cannot intervene on it (e.g., due to entanglement)? Then (6) says we cannot know it, but (5) says it exists. This is an epistemic gap, not a direct contradiction. We can maintain both: features exist if causally efficacious, but we can only know them via interventions. However, if a feature is not intervenable, then by (6) we cannot warrant it, but it might still be real. This is acceptable, but it means that some real features might be unknowable.

  - **Revision?** No revision needed; they can coexist.

  ### 2. Discrimination: Which apparent conflict dissolves?

  The apparent conflict between (1) Realism and (2) Anti-privilege dissolves with the causal-profile/geometric-realization distinction. 

  - Why it dissolves: (1) is about the causal profile of features — what they respond to and what effects they have. This profile is interpreter-independent. (2) is about the geometric realization — the specific directions in activation space. Multiple geometric bases can implement the same causal profile (if the downstream weights are adjusted accordingly). For example, in a linear system, a change of basis can be compensated by the inverse change in the weight matrix. Thus, the causal profile is invariant under basis changes, so (1) is satisfied at the level of causal profiles, and (2) is satisfied for geometric realizations.

  - However, this dissolution depends on the downstream computation being able to adjust to the basis change. In a neural network, if we change the basis of an activation space, the next layer's weights must change accordingly to maintain the same function. But in a trained network, the weights are fixed. So the geometric realization is fixed by the implementation. Therefore, the dissolution might not hold if we take the physical implementation seriously. But the distinction is conceptual: we can still say that the causal profile is what matters, and it could have been realized differently.

  - Given (5), the causal efficacy is tied to the actual readout, which is in a specific basis. So the geometric realization is not arbitrary. But the causal profile might still be basis-independent. Thus, the conflict dissolves if we accept that the causal profile is the object of realism, and geometric realizations are non-canonical but fixed in a given network.

  - But note: in the no-bridge result, the two models have different geometric realizations but same causal profiles. This supports the distinction.

  ### 3. Can the causal-profile/geometric-realization distinction bear the weight given (5)?

  - The distinction helps: it allows us to say that the causal profile is the real feature (satisfying (1)), and the geometric realization is non-canonical (satisfying (2)), while (5) ties the reality to the causal profile (since causal efficacy is part of the profile).

  - However, (5) says "the network's own downstream computation actually reads it out". This readout is implemented geometrically. So for a feature to be read out, it must be represented in a way that the downstream weights can access. In the standard basis, this might be direct. In another basis, the same causal effect might be achieved, but only if the geometric realization is such that the downstream weights (in their basis) can pick it up. 

  - The problem: in a given network, the downstream weights are fixed in the neuron basis. So if we take a different basis (e.g., a dictionary basis), then the feature direction in that basis might not align with the readout weights. Therefore, only features represented in the neuron basis (or a basis that aligns with the readout) are causally efficacious. This would mean that the neuron basis is privileged for causal efficacy, contradicting (2).

  - Alternatively, we can say that the readout is defined at the level of causal roles, not geometry. But the implementation matters for (5): the network must actually use it in its computation.

  - **Conclusion**: The distinction can bear the weight only if we allow that the causal efficacy is defined in a basis-independent way. However, the physical computation is basis-dependent. To save (2), we must argue that the causal profile is what matters, and the geometric realization is merely the implementation. But (5) requires the actual mechanism to read it out, which is geometric. So the tension with (5) remains.

  ### 4. No-bridge result: what it threatens

  - **The scenario**: Two models, same behavior, same intervention successes within each model, but no linear correspondence between their dictionaries (even after refinement).

  - **What it threatens**:
    - Against (1) Realism: If realism is about geometric realizations, then it would be threatened because there is no fact about which geometry is correct. But if realism is about causal profiles, then both models have the same causal profiles, so there is a fact: they represent the same features (causal profiles). The geometric differences are irrelevant. So (1) is not threatened if we use the distinction.
    - Against evidential arguments for realism: The no-bridge result shows that even with full interventional access within each model, we cannot find a common geometric structure. This suggests that the geometric realization is not fixed by the causal profile. But that's fine if we adopt the distinction.
    - Against nothing: The result might be consistent with the package, especially with (2) anti-privilege and the distinction.

  - **Predicted by the view?** 
    - Yes, if we accept that the geometric realization is not fixed by the causal profile and can vary across models. This is consistent with (2) and the distinction. 
    - Does this still deserve to be called realism? Yes, because the causal profiles are real and interpreter-independent. The geometric variation is just implementation detail.

  ### 5. Single revision that cleans up the most at least cost

  - The main tension is between (2) and (5). To resolve it, we must either:
    a) Revise (2) to allow that the neuron basis (or the basis of the downstream readout) is privileged for causal efficacy.
    b) Revise (5) to decouple causal efficacy from the specific geometric implementation.

  - **Option a: Revise (2)** 
    - **Revision**: Weaken (2) to say that while multiple bases can describe the activation space, the neuron basis (or the basis defined by the downstream readout) is causally privileged. Other decompositions (like dictionaries) are useful for interpretation but do not correspond to the actual causal features of the network.
    - **Cost**: We lose the elegant pluralism of (2). Dictionary learning and other methods might not be revealing real features, only approximations. This goes against much interpretability work that treats sparse dictionaries as real. Also, superposition suggests that features are not aligned with neurons, so the neuron basis might not be privileged. This revision might force us to say that only neuron-level features (or features aligned with the readout) are real, which is empirically inadequate.

  - **Option b: Revise (5)**
    - **Revision**: Weaken (5) to say that a candidate feature is real if it plays a causal role in the network's computation, even if the readout is not in a specific basis. We must then explain how the readout works. For example, we can say that the downstream computation reads out a linear combination that corresponds to the feature in whatever basis it is represented. But in the neuron basis, this is direct; in other bases, it might be a linear combination. However, if we have a dictionary feature that is a direction not aligned with neurons, the readout might still use it if the weight vector projects onto it. So we can say that a feature is causally efficacious if there is some linear readout that depends on it (which is always true if the feature is a direction and the readout is linear). But then (5) becomes too weak: every direction might be read out in some way? We need to capture that the feature is explicitly used, not that it is merely a component.

    - **Better revision**: Instead, we can say that the causal efficacy is defined relative to the basis in which the downstream computation is linear. But that brings back the privileging. 

    - Alternatively, we can reframe (5) in terms of the causal structure: a feature is real if we can intervene on it (via steering, etc.) and change the output in a way that matches its role. This is intervention-based and basis-independent. But then (5) becomes very similar to (6). However, (6) is about evidence, while (5) is about existence.

    - **Revised (5)**: "A candidate feature is a real feature of the network only if it is possible for the network's own downstream computation to read it out in a way that is sensitive to its state, and this sensitivity is manifested in successful interventions." But this is vague.

    - **Cost**: We risk inflating features. For example, in superposition, there are many directions that are not used, but they might be read out in some linear combination. We need to tie it to the actual computation. Also, we lose the ability to settle the grain problem: if a coarse feature is split, and the downstream uses the coarse feature, then the fine-grained ones might not be read out individually. But with a weak (5), we might count them as real. This is a high cost.

  - **Recommended revision**: Revise (2) by weakening it to allow that the basis of the downstream readout is privileged. 

    - **New (2)**: "No basis of activation space is metaphysically canonical except insofar as it aligns with the downstream computation. The neuron basis is privileged for causal efficacy because the next layer's weights are defined in that basis. Other decompositions may provide useful approximations or compressions but do not reflect the actual causal structure unless they align with the privileged basis."

    - **Cost**: This abandons the strong anti-privilege and may not fit with superposition findings. For example, if a feature is represented in a non-neuron direction and the readout weight vector projects onto that direction, then it is being read out. So the neuron basis might not be the only one that matters. Moreover, in higher layers, features might be polysemantic neurons, so the neuron basis isn't clean. This revision might be empirically inadequate.

  - **Alternative single revision**: Reject the linear representation hypothesis (4). But that would be a high cost because superposition and dictionary learning rely on linearity.

  - **Best option**: Reconcile (2) and (5) by clarifying that causal efficacy is defined at the level of causal roles, and the geometric realization can vary, but in practice, the readout is implemented in a specific basis. However, we can maintain that the causal role is basis-independent. Thus, we keep both by accepting that the no-bridge result is possible and does not threaten realism about causal profiles.

  But the tension between (2) and (5) remains.

  **Final suggestion for the least costly revision**: 

  Revise (5) to be more flexible about the basis of readout. 

  - **Revised (5)**: "A candidate feature is a real feature of the network only if the network's own downstream computation actually reads it out, meaning that the feature's state non-redundantly influences the output. This readout may be implemented in any basis, but it must be that interventions on the feature (relative to a decomposition) show that it is used."

  - **Cost**: We must accept that a feature defined in a non-standard basis can be causally efficacious if the downstream weights effectively pick it up. This weakens the grain problem solution: if we have a coarse feature and fine-grained ones, the coarse one might be read out, but the fine-grained ones might also be read out if the weights project to them. We might need additional criteria (like sparsity) to settle grain. But this is acceptable.

  This revision allows us to keep (2) and resolves the tension.

  ## Summary of Answers

  1. **Tensions ranked**:
     - **Severe**: (2) vs (5) — Basis anti-privilege vs. causal-efficacy. (5) forces a privileged basis for readout, contradicting (2). Revise (2) to allow that the downstream computation defines a privileged basis, or revise (5) to be basis-independent. Cost of revising (2): loss of pluralism, empirical issues. Cost of revising (5): potential feature inflation and grain problem.
     - **Moderate**: (1) vs (2) — Realism vs. anti-privilege. Dissolves with causal/geometric distinction, but depends on the resolution of the above.
     - **Mild**: Others.

  2. **Discrimination**: The conflict between (1) and (2) dissolves with the causal-profile/geometric-realization distinction. Why: causal profiles are invariant under basis changes, so realism about profiles is compatible with anti-privilege in geometry. But it depends on whether the readout is basis-dependent, which is the (2) vs (5) tension.

