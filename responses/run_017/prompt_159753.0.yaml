answer: |-
  ### Repaired Principle of Indifference

  1. **Clause 1: Discrete Symmetry (motivated by fair die, doors)**  
     For a **finite, mutually exclusive, and exhaustive set of outcomes** with **no evidence breaking symmetry** (i.e., outcomes are indistinguishable except by label), assign equal probability.  
     *Example: Die faces, doors.*

  2. **Clause 2: Continuous Mechanism-Driven Uniformity (motivated by chord paradox mechanisms)**  
     If the **generating mechanism is known and uniformly randomizes a specific continuous quantity**, assign probabilities uniformly over that quantity's natural scale.  
     *Example: Cube side length controlled by machine.*

  3. **Clause 3: Natural Metric Default (motivated by cube side length)**  
     If the mechanism is **unknown** but the outcome is described by a **continuous parameter with a natural linear metric** (e.g., physical lengths, time), and no evidence breaks symmetry, use uniformity over that metric.  
     *Example: Factory tiles with side length specified.*

  4. **Clause 4: Asymmetry or Unbounded Exclusion (motivated by rain, positive integers)**  
     **Do not apply indifference** if:  
     - Outcomes are **not symmetric** (e.g., "rain" vs. "no rain" lacks physical symmetry).  
     - The partition is **arbitrary or unbounded** (e.g., positive integers).  
     *Example: Binary events without symmetry; infinite sets.*

  5. **Clause 5: Bayesian Parameter Indifference (motivated by sunrise rule)**  
     For **repeated trials**, if no prior information exists, assign a uniform prior to a **bounded frequency parameter** (e.g., binomial probability). Do not apply to arbitrary parameters.  
     *Example: Sunrise probability after observed trials.*

  ---

