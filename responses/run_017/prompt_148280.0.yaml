prompt: |-
  so there's this argument about a statue and the lump of clay it's made of that I keep coming back to, and it never moves. One side says the statue could survive being squashed flat but the clay couldn't, so they've got different properties, so they're two things. The other side says two solid objects can't sit in the same place made of the exact same parts, so it's one thing and 'statue' is just a way of talking about the clay while it happens to be arranged that way. Everyone restates their version, nobody ever switches.

  Here's the thing that makes me think the whole setup might be off. In ceramics last year my teacher dropped a lump of clay, it landed in a splat, and she put it on a plinth and said it's a sculpture now. Nobody reshaped anything — the splat is the piece. So it looks like the statue and the clay here have the same parts, the same shape-history, and can survive all the same squashing, which seemsto kill the usual 'different properties' argument for this case. But it also looks like whether there's a statue there at all depends on somebody deciding to call it one.

  My hypothesis is that the real fight isn't about objects at all: it's about whether something new can start existing just because people start treating some matter a certain way — one side thinking artifact words like 'statue' pick out a real kind of thing, the other thinking that's just describing the same stuff differently. Is that right, or is this a verbal fight, or a hidden question about what 'exists' means, or just bedrock intuitions neither side can argue for? I want an actual diagnosis with reasons from what each side actually says, not a survey of the positions, and I want an honest answer about whether anything would count as progress here or whether it's just stuck for good.
