  - (b) Spengler's incommensurability is untranslatable noise within the linguistic framework which requires shared parameters. 
  - (c) "Decline" in Toynbee/Spengler can only be rendered as structural simplification (e.g., loss of inflectional categories), which they'd reject as reductionist. The framework's inability to capture their normative "decline" reflects its methodological strength, not a limitation.

