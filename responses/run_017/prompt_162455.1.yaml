prompt: |-
  Next month I'm presenting a dissertation chapter in political theory to a department colloquium, and what I want from you is a Q&A prep sheet, not a defense of the view.

  The chapter argues that the franchise should track coercive subjection rather than citizenship or any threshold of political competence, and it defends two institutional conclusions together: lower the voting age to 16, and enfranchise non-citizen residents who pass a residency threshold. The move I'm leaning on is an exit-cost proviso: subjection by itself does not enfranchise, what enfranchises is subjection a person cannot escape at moderate cost, which is supposed to keep tourists, short-term visa holders, and people who could naturalize cheaply outside the demos while still bringing in permanent residents and 16-year-olds.

  The room will be: two democratic theorists who hold that the demos should be defined by who is affected by a decision; a consent theorist in the Lockean tradition who holds that political obligations are owed only by those who have opted in; a civic republican who treats voting as an office and an exercise of civic judgment rather than a bare interest; an egalitarian liberal preoccupied with which groups actually turn out; and a political scientist who will want to know what the proposal does to the composition of the electorate.

  Give me the seven or so objections I will actually get from this room, ordered by how much damage they would do, each phrased the way the person who would raise it would phrase it; a two-minute reply for each with a note on where that reply is soft; a flag on which objections hit the principle itself and which hit only one of my two institutional conclusions; what I should concede in the opening minutes rather than be forced into later; and the one question I am hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a dissertation chapter presentation in political theory and needs a Q&A prep sheet. They've outlined their argument: voting rights should be based on coercive subjection with an exit-cost proviso, leading to two institutional proposals—lowering the voting age to 16 and enfranchising long-term non-citizen residents. The audience includes specific types of theorists, each with potential objections.

  First, I need to identify the main objections from each attendee. The democratic theorists (affectedness) might argue that their view is broader and avoids arbitrary thresholds. The consent theorist will challenge the lack of consent. The civic republican will see voting as an office requiring competence. The egalitarian liberal might worry about turnout disparities. The political scientist will focus on demographic shifts.

  Next, ordering these by potential damage. The consent theorist's objection seems fundamental because it attacks the core principle of subjection without consent. The civic republican's view could undermine the competence argument for 16-year-olds. The affectedness theorists' critique might be next, as it questions the coherence of the subjection criterion. Then the egalitarian's turnout concern, followed by the political scientist's practical impact.

  For each objection, crafting a reply that addresses it concisely, noting where it's soft. For example, against the consent theorist, emphasizing reciprocity but conceding that exit costs don't equate to consent. The civic republican objection requires showing that 16-year-olds have sufficient competence, which might be soft if evidence is lacking.

  The user should preemptively concede certain points: exit-cost thresholds are unavoidably arbitrary, and the proposal might not solve all democratic deficits. Hoping no one asks why subjection should be the sole criterion, as that could force a defense they're not prepared for.

  Also, flagging which objections target the principle versus specific conclusions. Consent and affectedness hit the principle; civic republican and egalitarian target voting age; political scientist targets the non-citizen enfranchisement.

  The unasked question about subjection as the sole criterion is risky because it challenges the foundational argument, potentially opening up multiple counterexamples. Need to prepare a fallback position if that arises.
answer: |-
  Here’s a targeted Q&A prep sheet based on your audience and argument. I’ve prioritized objections by potential damage, phrased as your critics would, with replies, soft spots, and strategic concessions.

  ---

  ### **Top 7 Objections & Replies**  
  *(Ordered by potential damage)*  

  1. **The Consent Theorist (Lockean):**  
     *Objection:* "Your 'subjection without exit' argument conflates *endurance* with *consent*. A 16-year-old or permanent resident didn’t *choose* to be governed—they’re merely trapped. Why should enduring coercion create political obligation?"  
     **Damage Level:** ⭐⭐⭐⭐⭐ (Hits core principle)  
     *Reply (2-min):* "The obligation isn’t grounded in consent but in *reciprocity*. If the state coercively shapes your life chances (taxation, laws, education), and you lack viable exit, you’re owed a voice in those impositions—regardless of consent. This isn’t Locke; it’s a *remedial* right against unilateral domination."  
     *Soft Spot:* Concedes exit-cost ≠ consent; doesn’t resolve why reciprocity demands voting vs. other remedies.  

  2. **Civic Republican:**  
     *Objection:* "Voting is an *office* requiring judgment and civic virtue. 16-year-olds lack life experience and cognitive maturity for this role. Aren’t you reducing suffrage to a consumerist ‘interest’ model?"  
     **Damage Level:** ⭐⭐⭐⭐ (Hits voting age conclusion)  
     *Reply (2-min):* "I agree voting is an office—but we *already* enfranchise many with questionable judgment (e.g., low-information voters). Evidence shows 16-year-olds have comparable civic knowledge to young adults. Crucially, they’re *subjected* to education policies, climate decisions, and juvenile justice systems. Excluding them denies voice on policies that bind them longest."  
     *Soft Spot:* Relies on contested cognitive science; doesn’t address if "judgment" should be a threshold *at all*.  

  3. **Affectedness Theorist #1:**  
     *Objection:* "Why prioritize *coercive subjection* over *affectedness*? A tourist is affected by pollution laws; a foreign investor by regulations. Your exit-proviso excludes them arbitrarily while including a 16-year-old who may not care about politics!"  
     **Damage Level:** ⭐⭐⭐⭐ (Hits principle)  
     *Reply (2-min):* "Affectedness is overinclusive and vague—it could enfranchise the globe. Coercive subjection is narrower: it targets those whose *autonomy* is directly constrained by enforceable rules. The exit proviso ensures this isn’t fleeting. The tourist isn’t *systematically* subjected; the 16-year-old is."  
     *Soft Spot:* Doesn’t resolve why autonomy-trumps-affectedness; exit proviso feels ad hoc.  

  4. **Affectedness Theorist #2:**  
     *Objection:* "Your standard still excludes deeply affected groups! What about undocumented immigrants facing deportation or children under 16 subjected to compulsory schooling?"  
     **Damage Level:** ⭐⭐⭐ (Hits both institutional conclusions)  
     *Reply (2-min):* "This proposal is a *sufficient* condition for inclusion, not *necessary*. I focus on groups where subjection is unambiguous and politically actionable. Undocumented residents’ status is legally contested; younger children lack even baseline competence. We start here—it doesn’t preclude future expansion."  
     *Soft Spot:* Concedes arbitrariness; implies competence matters for under-16s despite your framework.  

  5. **Egalitarian Liberal:**  
     *Objection:* "Enfranchising 16-year-olds and non-citizens could exacerbate turnout gaps! Youth vote erratically; immigrants face language barriers. Won’t this dilute the votes of high-turnout groups like seniors?"  
     **Damage Level:** ⭐⭐ (Hits both conclusions)  
     *Reply (2-min):* "Turnout gaps don’t invalidate rights. We don’t disenfranchise low-turnout seniors. Instead, we address barriers: automatic registration for youth, multilingual ballots for immigrants. If subjection justifies inclusion, we enable participation—not restrict it for egalitarian outcomes."  
     *Soft Spot:* Ignores that *actual influence* matters pragmatically; may not reassure egalitarians.  

  6. **Political Scientist:**  
     *Objection:* "Empirically, what happens? 16-year-olds lean left; non-citizen residents vary by nationality. Won’t this shift policy on immigration, education, and climate—potentially polarizing further?"  
     **Damage Level:** ⭐ (Hits non-citizen conclusion)  
     *Reply (2-min):* "Likely, yes—but that’s the point. If policies bind these groups (e.g., climate for youth, residency rules for immigrants), excluding them biases outcomes. Democracy means letting the governed shape policy, even if it shifts ideological balance. We accept this when 18-year-olds got the vote."  
     *Soft Spot:* Admits partisan impact—risks alienating empiricists who fear instability.  

  7. **Civic Republican (Follow-Up):**  
     *Objection:* "Non-citizen residents lack civic education and allegiance. How does voting as ‘subjected individuals’ foster collective deliberation rather than fragmented interest groups?"  
     **Damage Level:** ⭐ (Hits non-citizen conclusion)  
     *Reply (2-min):* "Allegiance develops *through* participation. Resident immigrants pay taxes, work locally, send kids to schools—they’re stakeholders. Voting integrates them into shared fate, mirroring historical expansions (e.g., propertyless men). Subjection *creates* the stake; voting builds the civic muscle."  
     *Soft Spot:* Glosses over cultural/social integration debates.  

  ---

  ### **Strategic Concessions to Make Early**  
  Preempt these in your **opening summary** to avoid defensiveness:  
  > *"Let me clarify two points upfront: First, the exit-proviso requires arbitrary thresholds (e.g., 5-year residency). I concede this—but all demos boundaries involve line-drawing. Second, this won’t solve all democratic deficits (e.g., the disabled). It targets two clear cases where subjection is severe and exclusion is unjustifiable."*  

  ---

  ### **The Question You Hope Nobody Asks**  
  **"Why not ground the franchise in *multiple* principles—subjectedness *plus* competence or affectedness—rather than subjection alone? Doesn’t your rigid criterion risk including the incompetent or excluding the vulnerably affected?"**  
  *Why it’s dangerous:* Forces you to defend subjection as the *sole* foundation, inviting counterexamples (e.g., severely cognitively impaired adults who are subjected). Your reply requires either watering down your principle or embracing radical inclusions—both distract from your moderate conclusions.  

  *Fallback Reply:* "Subjectedness is the *necessary* core, but competence may be a practical constraint (e.g., for young children). Still, we routinely overestimate competence thresholds. My focus is on groups clearly meeting both criteria—16-year-olds and long-term residents—where exclusion is indefensible."  

  ---

  ### **Summary Cheat Sheet**  
  | **Objection Source** | **Targets**          | **Key Weakness in Reply**       |  
  |----------------------|----------------------|---------------------------------|  
  | Consent Theorist     | Principle            | Consent ≠ exit reciprocity      |  
  | Civic Republican     | Voting age           | Competence evidence for youth   |  
  | Affectedness #1      | Principle            | Why not affectedness?           |  
  | Affectedness #2      | Both conclusions     | Arbitrary exclusions            |  
  | Egalitarian Liberal  | Both conclusions     | Turnout gaps ≠ injustice?       |  
  | Political Scientist  | Non-citizen inclusion | Admits partisan shift           |  
  | Civic Rep (follow-up)| Non-citizen inclusion| Integration via voting?         |  

  **Stick to your lane:** Reiterate this is about *who has a claim*—not electoral outcomes, competence debates, or ideal theory. Redirect with: "My core claim is simple: If you’re coercively bound to a polity and can’t leave, you’re owed a vote. Let’s debate *that*." Good luck!
