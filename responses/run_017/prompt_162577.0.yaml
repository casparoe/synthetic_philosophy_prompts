   - Instead: The observer will note down deviations by writing a brief description of the behavior and the time (but not the name, because they don't know names? They might know). To avoid naming, the observer can be instructed to note the location (e.g., "person in blue shirt at table 2") or an arbitrary identifier (like seat number). But that's complicated.

