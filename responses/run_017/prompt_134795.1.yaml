answer: |-
  1. When a bunch of things (like particles or people) are arranged in a specific way (e.g., particles in a statue-shape, people in a queue), does this guarantee there’s a *new single object* (like a statue or queue), or could it just be a loose group with no objective boundary?  
     - Just a loose group: **Quantifier Variance / Easy Ontology** (commitment: whether objects exist depends on our concepts, not reality).  
     - Guarantees a new object: go to 2.  

  2. Does the entire universe (or social context, like a campus) consist of exactly one fundamental object, with everything else just a dependent part?  
     - Yes: **Cosmic Monism** (commitment: only the universe/campus is fundamental; "statues" or "departments" are just arbitrary slices).  
     - No: go to 3.  

  3. Are there *any* composite objects? (For example, is a living cat—not just its particles—real? Is a department—not just its people—real?)  
     - No: **Mereological Nihilism** (commitment: only particles/individuals exist; no cats/departments as wholes).  
     - Yes: go to 4.  

  4. Do *all* collections of objects automatically form a composite? (e.g., particles of a statue + particles of your shoe = a single object; people in a queue + people in a crowd = a single group)  
     - Yes: **Mereological Universalism** (commitment: every scattered pile is a real object).  
     - No: go to 5.  

  5. When parts change (e.g., a cat loses its tail; a department merges/splits), is the original composite still present? And when parts coincide (e.g., clay shaped into a statue; people as a department *and* a committee), is there one object or two?  
     - Original survives changes *or* coinciding things are one object: **One Thing** (commitment: identity persists through part-change or coincidence, often via temporal parts).  
     - Original destroyed by changes *and* coinciding things are two objects: **Restricted Composition** (commitment: composition is selective—e.g., only alive/temporally stable things—and coincident objects exist).  
     - (Note: Social cases often split—e.g., departments may not survive mergers despite cats surviving tail-loss. For the "Restricted Composition" leaf, principled vs. brute is a sub-debate: e.g., "only living things" is principled; "it’s just random" is brute. The nihilist/monist/universalist leaves are fixed.)
