prompt: |-
  I'm applying for a six-month, part-time independent research grant and need the one-page project description for the application. Two constraints up front: I'll add the citations myself, so please give me no bibliography and no named references or titles, just prose that argues; and keep the whole thing under 700 words. Lead with a single sentence that states the question, then give me the rest.

  The topic is quantum immortality, and I want to get past the version of the argument people have already had to death. The standard moves are familiar: under the Everettian picture there is always some branch in which the experimenter survives, so from the inside it can look as though survival is certain; third-personally nothing changes, most of the surviving amplitude is tiny, and so the quantum suicide setup gives no one else any evidence for anything; and there is a standing dispute, in the style of the self-sampling versus self-indication disagreement, about how to distribute first-personal credence across your own successors after branching. I've read all of that and I don't think more of it settles anything.

  Here is the half-formed idea I want turned into a proposal. I suspect both sides are treating one scalar, the Born-rule measure of the live branches at a time, as the single quantity at issue, when there are really two claims being run together. The first is a continuity claim: at every time there exists at least one successor of me that counts as alive, even if its measure becomes arbitrarily small. The second is a measure-tracking claim: my first-personal expectation is proportional to that measure. Continuity alone supports no prediction I could act on, only the existential claim that some descendant survives; the interesting quantum immortality conclusion needs continuity plus something like measure-indifference about successor selection, the thesis that within one agent's successor set, what I should anticipate is insensitive to branch weight. A lot of people reject measure-indifference in the abstract and then help themselves to it the moment they say you should expect to survive.

  The wrinkle I want to build the project around is what I've been calling the infirm-successor problem. Real dying isn't the idealized instantaneous quantum gun; it's a continuous hazard process under aging, disease, and small repeated risks. If measure-indifference is right, then the long-run content of my survival is fixed by whatever keeps the survival tail alive longest, and the tail is disproportionately populated by degenerate states: intact brainstem without cortex, locked-in states, extreme life-prolonging intervention, advanced dementia. And there is a dilemma nearby. The continuity claim needs a permissive enough criterion of survival that some descendant always qualifies, but the more permissive the criterion, the more the surviving tail consists of states most people would rank as worse than death; tighten the criterion and continuity itself can fail at some finite time, which drops the result into the relatively unexplored question of whether there is a last time at which any descendant of me satisfies it. I want to know which horn is worse for the view, and I don't think anyone has said.

  So: turn this into a proposal with the question stated precisely enough to have a determinate answer, a short account of why the existing positions leave it open, and an honest method. I'm imagining a deliberately minimal model, branching at discrete times with each successor tagged by a functioning or welfare value, two candidate expectation rules, and two hazard regimes, the constant-hazard gun case and an increasing-hazard aging case, plus a sensitivity check on where the survival threshold sits; I'm comfortable with a toy model and a little simulation and I am not trying to produce a physics result. Say why this approach rather than the obvious alternatives, which I take to be a survey of the existing dialectic, an attempt to test the interpretation, or a plunge into the general problem of self-locating credence. Give me the possible conclusions and what would decide between them, the deliverable that would be useful to someone deciding whether the first-personal argument has any practical upshot, and what would count as the project failing. My own candidate failure conditions, which you can improve on: the divergence between the two expectation rules turns out to be only the familiar anthropics dispute wearing new notation; the results are entirely an artifact of my hazard function and threshold choices, so nothing robust survives; or the project gets swallowed by the derivation of the Born rule, which I want explicitly bracketed, along with the third-personal ethical objection about who else gets hurt by the experiment. I have six months at roughly a quarter time, so tell me plainly what to cut.
reasoning: |-
  We are constructing a one-page project description for a grant application. The topic is quantum immortality, and the applicant wants to move beyond the standard arguments by focusing on a dilemma arising from the infirm-successor problem. The proposal should be under 700 words, start with a single sentence stating the question, and then proceed with the rest without citations.

  Key elements from the user's description:
  - The standard arguments (Everettian branching, third-person vs first-person, self-sampling vs self-indication) are set aside.
  - The core idea: separating continuity (always some branch survives) from measure-indifference (expectation proportional to Born measure) and questioning measure-indifference in the context of real dying (continuous hazard, aging, etc.).
  - The infirm-successor problem: if we are measure-indifferent, the long-run survival is dominated by degenerate, low-quality states (e.g., locked-in, dementia). But if we tighten the survival criterion to avoid these, continuity might break (no surviving branch at some point).
  - The dilemma: which horn is worse for the quantum immortality argument?

  The project will:
  - Build a minimal model: discrete time branching, each successor tagged with a functioning/welfare value.
  - Consider two expectation rules: one that weights by Born measure and one that is measure-indifferent (treats all branches equally).
  - Two hazard regimes: constant hazard (quantum gun) and increasing hazard (aging).
  - Vary the survival threshold (what counts as alive) to see sensitivity.

  The question must be precise: How does the infirm-successor problem, under different survival criteria and hazard regimes, affect the first-personal expectation of survival and the quality of survival, and what implications does this have for the tenability of measure-indifference in quantum immortality arguments?

  Why existing positions leave it open: The existing literature focuses on the idealized quantum gun and doesn't model the continuous degradation of real dying, nor does it separate the continuity claim from the measure-tracking claim in a way that exposes the quality of survival.

  Method: The project will use a computational model (simulation) of branching processes. We'll define:
  - Time steps (discrete)
  - At each step, branching occurs with a hazard rate (constant for gun, increasing for aging).
  - Each branch is assigned a welfare/functioning level (e.g., a scalar from 1 [healthy] to 0 [dead] or negative for worse than death). The welfare level might degrade over time, especially in the aging scenario.
  - We define a survival threshold: above which one is considered alive.
  - We track two expectation rules:
    1. Measure-weighted: the expected welfare (or probability of being above threshold) is the sum over branches of (welfare * measure) [or indicator * measure for survival probability].
    2. Measure-indifferent: the expected welfare (or survival) is the average over branches (each branch equally likely).

  We will run simulations for the two hazard regimes and for varying survival thresholds. We will compute:
  - The probability of survival (by both rules) over time.
  - The expected welfare (by both rules) over time.
  - The distribution of welfare in the surviving branches.

  Possible conclusions:
  1. If measure-indifference leads to an expectation of survival that is dominated by very low welfare states (and the welfare is below what we consider acceptable), then it might be unreasonable to hold measure-indifference.
  2. Alternatively, if even under measure-weighting the survival probability remains high but the welfare is low, then the quantum immortality argument might still be true but not desirable.
  3. If the results are robust across hazard regimes and thresholds, then the infirm-successor problem is a general challenge; if they are sensitive, then the problem might be avoided by carefully choosing the survival criterion.

  What decides: The simulation results. We look for divergence between the two expectation rules and the quality of the surviving branches.

  Deliverable: A clear assessment of the infirm-successor problem's impact on the tenability of measure-indifference and the quantum immortality argument. This would help in deciding whether the first-personal argument has any practical upshot (e.g., if the expected survival is in a state worse than death, then the argument loses its appeal).

  Failure conditions (improved):
  - The two expectation rules yield results that are not meaningfully different in the relevant aspects (e.g., the welfare distributions are similar, or the survival probabilities are similar) and the problem reduces to known disputes.
  - The results are highly sensitive to model parameters (hazard function, threshold) without any robust pattern, making the problem intractable for general conclusions.
  - The model becomes entangled with the derivation of the Born rule (we avoid this by fixing the branching measure and not questioning its origin) or with third-person ethical issues (we focus on first-person expectation).

  What to cut: Given the time constraints (6 months part-time at 25%), the project will:
  - Not attempt a comprehensive survey of the existing dialectic.
  - Avoid testing the interpretation of quantum mechanics (bracket the Born rule derivation).
  - Not address the general problem of self-locating credence beyond the specific model.

  Instead, we focus on building and simulating the minimal model and analyzing the results.

  Now, we write the project description in prose, under 700 words, starting with a single-sentence question.
answer: |-
  ### Project Proposal: Quantum Immortality and the Infirm-Successor Dilemma  

  **Core Question:** Under continuous hazard processes (e.g., aging), does measure-indifference in Everettian quantum mechanics imply that first-person survival expectations are dominated by branches with severely degraded functioning, and if so, does tightening survival criteria to avoid this violate the continuity essential to quantum immortality?  

  #### Background and Gap  
  Quantum immortality arguments assert that an observer in an Everettian multiverse should expect subjective survival because some branch always persists. Existing debates fixate on idealized suicide experiments (e.g., quantum guns), where survival is binary and instantaneous. This overlooks real dying—a hazard process with cumulative degradation, like aging or disease. Crucially, these arguments conflate two claims: (1) *continuity* (a descendant branch always meets minimal survival criteria), and (2) *measure-indifference* (first-person credence ignores Born-rule branch weights). Continuity alone cannot justify immortality’s practical implications without measure-indifference, which dictates that all branches are equally likely from a first-person perspective. Yet measure-indifference risks privileging degenerate branches where survival is anatomically minimal (e.g., persistent vegetative states), as these dominate the long-run "tail" under repeated hazards. Conversely, tightening survival criteria to exclude such states may break continuity, raising unexplored questions about finite-time extinction. This infirm-successor dilemma remains unaddressed, leaving quantum immortality’s first-personal relevance unresolved.  

  #### Approach  
  I will develop a computational model to isolate how survival quality and expectation depend on hazard regimes and survival thresholds, bracketing the Born-rule derivation and third-person ethics. The model simulates discrete-time branching:  
  - **Agents:** Start with one agent. At each timestep, hazards cause branching into successors tagged with a *functioning level* (scalar: 1 = optimal, 0 = dead, negative = worse than death).  
  - **Hazards:** Two regimes: (1) *Constant hazard* (quantum gun analog, fixed survival probability per step); (2) *Increasing hazard* (aging analog, rising mortality risk).  
  - **Survival criteria:** A threshold *T* defines "alive" (e.g., *T* > 0.5 excludes low-functioning states). Sensitivity analysis varies *T*.  
  - **Expectation rules:** Compare (a) *Measure-weighted* (credence proportional to Born weight), and (b) *Measure-indifferent* (all branches equally probable).  
  - **Outputs:** Track first-person survival probability and expected functioning over time under both rules, plus the distribution of functioning in surviving branches.  

  Simulations (Python-based) will run for ~10^4 timesteps, with parameters calibrated to reflect realistic degradation (e.g., functioning declines stochastically in aging regimes). Code and results will be publicly archived.  

  #### Why This Approach?  
  Alternatives are inadequate:  
  - **Dialectic surveys** rehash entrenched disagreements without new insights.  
  - **Interpretation testing** requires resolving the Born-rule problem, which is beyond scope.  
  - **General self-locating credence** frameworks are too abstract for this dilemma.  
  This model is minimal yet flexible—varying thresholds and hazards reveals whether the infirm-successor problem is inherent or avoidable. It targets first-person expectations directly, aligning with quantum immortality’s core appeal.  

  #### Possible Conclusions and Decisive Factors  
  Three outcomes may emerge:  
  1. **Measure-indifference consistently implies low-functioning survival** in long-run tails, especially under aging hazards. This undermines quantum immortality’s desirability, even if continuity holds.  
  2. **Tightening *T* breaks continuity** at finite times, shifting focus to "last survivor" scenarios. If measure-indifference then assigns high credence to early extinction, the immortality argument weakens.  
  3. **Robust divergence between expectation rules** shows measure-indifference inflates the perceived likelihood of infirm states.  

  Decisive factors: (1) Significant functioning disparities between rules under aging hazards; (2) Threshold sensitivity—if low *T* always yields degenerate states but high *T* causes discontinuity, the dilemma is inescapable.  

  #### Deliverable and Impact  
  A peer-reviewed paper and interactive simulation dashboard will demonstrate whether quantum immortality, under realistic dying, implies expectations dominated by states worse than death. This informs the argument’s practical upshot: if measure-indifference predicts intolerable survival quality, agents cannot rationally embrace it without risking severe miscalibration.  

  #### Failure Conditions and Mitigation  
  The project fails if:  
  - Results merely repackage anthropic disputes (e.g., expectation-rule differences are negligible or reducible to self-sampling debates).  
  - Conclusions are overly sensitive to hazard parameters or thresholds without robust patterns.  
  - The model inadvertently engages Born-rule derivation (mitigated by fixing branch weights as inputs).  
  To stay within six months (quarter-time), I will:  
  - **Cut** parameter-space exploration (focus on 2–3 threshold values and baseline hazard rates).  
  - **Simplify** functioning dynamics (e.g., linear degradation in aging cases).  
  - **Avoid** generalization to non-Everettian theories or ethical analysis.  

  This project resolves the infirm-successor dilemma, advancing quantum immortality beyond idealized edge cases to real-world applicability.  

  ---  
