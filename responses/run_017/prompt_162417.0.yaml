prompt: |-
  My friend Lena used to be really into campaign finance reform and now she has become a full-time sortition person — she consults on citizens' assemblies, and whenever somebody floats a "why not just pick them by lottery" idea she has an instant yes or no. I've been writting her calls down because they don't line up with any clean slogan I can find:

  - Absolutely yes to a binding redistricting commission drawn by stratified lot, single non-renewable term, no legislative override.
  - Yes to a 100-person assembly drafting the options for a constitutional amendment on a right to housing, with the final choice going to a referendum.
  - Yes to citizens' juries advising the council on the ten-year waste and recycling plan.
  - Yes to filling half the seats on the state ethics commission (the body that can sanction elected officials) by lot, for non-renewable terms.
  - Yes, but only if the sampling frame is widened, to a panel setting water-allocation rules for a river basin that runs into a neighbouring state and across a tribal nation's land.
  - No to replacing the elected school board with a randomly selected one with the same powers.
  - No to staffing the city's seats on the regional transit authority by lot — those people have to build relationships and be answerable over years, she said.
  - No to a standing "citizens' cabinet" that would set the whole city budget each year by binding vote: a budget is the one thing that has to be somebody's responsibility at election time.
  - A reluctant no to a lot-drawn panel deciding which drugs go on the state Medicaid formulary: they'd just ratify whatever the clinical staff put in front of them, so what are we actually buying?

  Here's the case I actually care about. A state with a few hundred million a year in public research money is considering a "Research Directions Chamber": 150 residents drawn by stratified lot, staggered three-year terms with a third replaced every year, permanent staff and a budget for expert testimony, binding authority over how the fund is split between broad areas (climate, biomedicine, fusion, ag research, whatever) but not over individual grants, which still go through peer review; deliberations and written reasons get published, and the only thing elected officials still do is raise or cut the total. My gut says she'll hate it, but I dunno, and I want more than a vibe. What rule is she actually running — something like "use the lot when whoever would otherwise decide has a stake in the outcome," or "use it only for bounded, single-purpose bodies that dissolve afterwards," or "use it only where the sample mirrors the people affected," or "don't use it where the call is really technical"? All four seem to fit her record about equally well and I think at least two of them come apart on this case. So: predict her verdict, say what each candidate rule predicts and why, give me your best guess with the reasons you prefer it, and then design the one variant of this proposal (or the one extra case) that would best separate whichever rules are still tied. And please be honest about confidence: which single feature of the design, if flipped, would most change your prediction, and where is your reading of her track record most likely to be wrong?
reasoning: |-
  Hmm, the user wants me to analyze Lena's pattern of decisions regarding sortition (selection by lottery) and predict her stance on a "Research Directions Chamber" proposal. Lena seems to have very specific criteria for when she supports or rejects sortition-based bodies.

  Looking at her track record, she supports sortition in cases like binding redistricting commissions, assemblies for constitutional amendments, citizens' juries advising on waste plans, and partially selected ethics commissions. But she rejects sortition for school boards, transit authorities, standing budget-setting cabinets, and drug formulary decisions.

  I need to identify the underlying principle that unifies her decisions. Several possibilities come to mind:

  1. Conflict of interest principle: Use sortition when decision-makers have a stake in outcomes (like legislators drawing their own districts)

  2. Single-purpose principle: Only for bounded, temporary bodies that dissolve after their task

  3. Affected public principle: The lot must mirror the people affected by decisions

  4. Technical competence principle: Avoid sortition for highly technical decisions where experts should lead

  For the research funding proposal, the Research Directions Chamber would have binding authority over broad funding allocations (climate, biomedicine etc.) but leave individual grants to peer review. It has staggered 3-year terms, permanent staff, and publishes its reasoning.

  Applying each principle:
  - Conflict of interest: Elected officials might be biased by lobbyists, so sortition could help - leans YES
  - Single-purpose: It's standing/recurring - leans NO
  - Affected public: The public is affected by research directions - leans YES
  - Technical competence: Broad areas aren't highly technical - leans YES

  My best guess is she'd reluctantly say NO because of the standing nature (violating the single-purpose principle). The staggered terms make it permanent, unlike her other "yes" cases which are temporary.

  To test between principles, a good variant would be making it a one-time assembly setting priorities for 5 years. If she says YES, the single-purpose principle dominates; if NO, something else like technical competence might be stronger.

  I'm least confident about the "affected public" principle - she might accept non-residents in water allocation but reject them here, so it's not decisive.

  The key feature that would flip my prediction is the staggered terms. If replaced with a one-time assembly, I'd predict YES. Otherwise, NO.
answer: |-
  Based on Lena's track record and the principles evident in her decisions, I predict she would say **NO** to the proposed Research Directions Chamber. Here's the breakdown:

  ### Candidate Rules & Their Predictions:
  1.  **"Use the lot when whoever would otherwise decide has a stake in the outcome."**
      *   **Prediction for RDC:** YES. Elected officials or agency heads allocating research funds *could* be influenced by lobbyists, universities, or industries seeking funding, creating a conflict of interest. A neutral citizen body avoids this.
      *   **Fit with Track Record:** Strong. Explains YES to redistricting (legislators draw own districts), ethics commission (officials judge peers), water panel (stakeholders might dominate). Explains NO to school board/transit (elected officials *are* the appropriate stakeholders answerable to voters). Less clear on drugs (stake conflict exists, but she said NO).
  2.  **"Use it only for bounded, single-purpose bodies that dissolve afterwards."**
      *   **Prediction for RDC:** NO. The Chamber is a *standing body* with staggered 3-year terms, permanent staff, and recurring annual/ongoing responsibility. It's not a one-off task force.
      *   **Fit with Track Record:** Very Strong. Explains YES to redistricting (single task, dissolves), constitutional assembly (single purpose, dissolves), citizens' juries (advisory, bounded task), water panel (presumably bounded task). Explains NO to standing budget cabinet, school board, transit authority (all ongoing responsibilities).
  3.  **"Use it only where the sample mirrors the people affected."**
      *   **Prediction for RDC:** YES. Stratified lot from the state's residents should mirror the taxpayers funding the research and the citizens affected by its outcomes (e.g., climate impacts, medical advances).
      *   **Fit with Track Record:** Good. Explains YES to redistricting (affected residents), water panel (widened sampling frame). Explains NO to school board/transit (residents *are* affected, so YES predicted? Contradiction). Weaker on ethics commission (affected public is broad, but only half selected by lot).
  4.  **"Don't use it where the call is really technical."**
      *   **Prediction for RDC:** AMBIGUOUS/Leaning NO. Setting broad research priorities involves complex trade-offs, future forecasting, and understanding societal needs vs. scientific opportunity. While not *individual grant* technical, it's arguably "meta-technical" or requires significant contextual understanding.
      *   **Fit with Track Record:** Good. Explains YES to redistricting (values/representation, not tech), constitutional assembly (values/principles), citizens' juries (values/community priorities). Explains NO to drug formulary (too technical/clinical), transit (arguably technical/relational). Ambiguous on water allocation (can be highly technical, but she said YES with widened frame, suggesting affectedness trumps technicality?).

  ### My Prediction & Preferred Reasoning: NO
  *   **Reason:** The **"bounded, single-purpose bodies that dissolve afterwards"** rule provides the *strongest and most consistent* explanation for Lena's track record. Her emphatic NOs target *ongoing, governing* bodies (school board, transit, budget cabinet). Her YESes are overwhelmingly for *specific, finite tasks*: draw a map once, draft amendment options once, advise on a 10-year plan once, serve a fixed term on an ethics panel. The only partial exception is the ethics commission (half-seats by lot), but even here, the *terms* are non-renewable and bounded, and the commission itself has a defined, ongoing function distinct from broad governance.
  *   **Why it fits the RDC:** The Research Directions Chamber is explicitly designed as a *permanent, standing institution* (staggered terms, permanent staff, annual budget allocations). This fundamentally violates the "bounded/single-purpose/dissolve" principle that underpins her support.

  ### The Separating Variant
  To test between the "Conflict of Interest" and "Bounded/Single-Purpose" rules (the two strongest contenders):
  *   **Proposed Variant:** Transform the RDC into a **one-time "State Research Priorities Assembly"**. 150 residents, stratified lot, single non-renewable term (e.g., 6 months). Task: Develop a binding 10-year framework for allocating the research fund between broad areas. The framework sets percentages or minimum allocations for categories. After delivering the framework and reasons, the Assembly dissolves. Implementation (annual allocation within framework) reverts to an agency or elected body, or uses the existing peer-review system structure for annual grants within the categories. Total funding still set by legislature.
  *   **How it Separates:**
      *   **If Lena says YES:** The "Bounded/Single-Purpose" rule is dominant. The conflict exists in both versions, but making it one-time satisfies her key objection.
      *   **If Lena says NO:** The "Conflict of Interest" rule is insufficient on its own, or another rule (like technical competence) becomes primary. Her objection would likely focus on *what* they are deciding (technical complexity, need for long-term accountability/relationships even within a bounded task?) rather than the structure.

  ### Confidence & Key Flips
  *   **Confidence Level:** Moderately High (70-80%). The "standing body" aspect is a glaring red flag based on her rejections of the school board, transit, and budget cabinet. The ethics commission half-seats are the closest counter-example, but even that involves fixed terms on a pre-existing body, not creating a *new* standing chamber.
  *   **Feature Flip That Would Most Change Prediction:** Changing from a **standing body with staggered terms** to a **one-time assembly with a single, fixed term**. This directly addresses the strongest objection and would make a YES much more likely (though not guaranteed – she might still object based on technicality or scope).
  *   **Where My Reading Might Be Wrong:**
      1.  **The Ethics Commission Precedent:** My reading downplays the significance of her YES to half-seats on a *standing* ethics commission. If she views the RDC as analogous to a specialized oversight body (like the ethics commission) rather than a governing body (like the school board), she *might* say YES. However, the RDC's role in *actively directing substantial public funds* feels more like governance than oversight.
      2.  **"Binding Authority" vs. "Advisory":** Most of her YESes are either binding (redistricting, ethics sanctions?) or feed into a referendum/legislative process. The RDC is binding on allocations. If she objected strongly to binding citizen power *in principle*, her track record would look different (e.g., she might have said NO to the binding redistricting commission). Her NOs seem driven more by the *nature* of the task (ongoing governance) than the binding power itself.
      3.  **"Broad Areas" vs. Technical Details:** I'm assuming she sees setting broad research priorities as complex enough to fall towards the "technical" side of her spectrum (like the drug formulary NO). If she views it purely as a values-based question ("what should society prioritize?"), akin to the constitutional amendment, she *might* be more accepting, even with staggered terms. However, her NO to the standing budget cabinet (also fundamentally values-based) weighs against this.

  **In summary:** Predict **NO**, primarily because the standing, ongoing nature of the Research Directions Chamber violates Lena's clear preference for bounded, single-purpose citizen bodies. The strongest alternative explanation (conflict of interest) is present but insufficient to overcome this structural objection. Flip it to a one-time assembly to test these principles decisively. Be most wary of misjudging the significance of the ethics commission example or how she categorizes the complexity of setting research priorities.
