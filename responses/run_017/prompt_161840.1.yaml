  ## THE ELEVATE REWARDS PROGRAMME™

  **Be More. Give More.** Elevate Rewards recognises those who go the extra mile. Earn Tier Points™ for exceptional acts that make a difference, and ascend through our exclusive status tiers: Bronze Contributor, Silver Benefactor, Gold Paragon, and Platinum Luminary. Experience the recognition you deserve. Terms apply. Program subject to change without notice.

  **1. Definitions & Interpretation**
     1.1 "Act" means any discrete behaviour performed by a Member.
     1.2 "Baseline Duty" refers to Acts classified as required under Clause 2. Baseline Duty Acts earn 0 (zero) Tier Points.
     1.3 "Cost" encompasses financial expenditure, time invested, personal inconvenience, physical risk, reputational risk, or opportunity cost incurred by the Member in performing an Act.
     1.4 "Creditworthy Act" means an Act designated under Clause 3 as eligible to earn Tier Points.
     1.5 "Member" means an individual enrolled in the Elevate Rewards Programme.
     1.6 "Praise Ledger" records Tier Points earned for Creditworthy Acts.
     1.7 "Blame Ledger" records Tier Points deducted for Permissible Sub-Optimal Acts (Clause 8). A negative balance is permitted on the Blame Ledger.
     1.8 "Programme Authority" means the Elevate Rewards Oversight Committee, whose determinations are final and binding.

  **2. Baseline Duty & Programme Schedule**
     2.1 The Schedule of Baseline Duty Acts ("the Schedule"), maintained and published by the Programme Authority, definitively lists all Acts considered minimally required of Members. Acts on the Schedule earn 0 Tier Points.
     2.2 Creditworthy Acts are exclusively those Acts *not* listed on the Schedule at the time of performance.
     2.3 The Programme Authority shall review the Schedule periodically, but not less than annually.
     2.4 In determining Schedule amendments, the Programme Authority may consider, *inter alia*, the prevalence of performance of a particular Creditworthy Act among the Membership. An Act performed by a significant majority of Members may be reclassified as Baseline Duty and added to the Schedule.
     2.5 Reclassification of an Act from Creditworthy to Baseline Duty pursuant to Clause 2.4 is effective prospectively from the date of Schedule amendment. Prior performance of the Act while Creditworthy remains eligible for Tier Points as per the Points Table valid at the time of performance.
     2.6 Members are solely responsible for consulting the current Schedule prior to acting to ascertain its classification.

  **3. Earning Tier Points: Creditworthy Acts**
     3.1 Tier Points are earned solely through the performance of Creditworthy Acts, as confirmed by the Programme Authority. Points are recorded only in the Praise Ledger. The Blame Ledger operates independently (Clause 8). There is no facility to transfer points between Ledgers or offset balances.
     3.2 The Tier Points value for a Creditworthy Act is calculated *net of Cost* to the Member. The base value (see Points Table) is reduced proportionally based on the relative Cost burden experienced by the Member compared to an average Member profile determined by the Programme Authority. This ensures equitable recognition for genuine effort relative to individual capacity.
     3.3 Tier Points are awarded based on the Act performed and the Net Cost calculation (Clause 3.2), irrespective of the outcome of the Act, unless otherwise mandated by Programme rules (see Clause 9.3).

  **4. Status Tiers & Attainment**
     4.1 Status Tiers (Bronze Contributor, Silver Benefactor, Gold Paragon, Platinum Luminary) are achieved upon accumulating the requisite number of Tier Points in the Praise Ledger, as published by the Programme Authority.
     4.2 Attainment of the Platinum Luminary tier signifies the highest level of Member conduct achievable within the Programme framework and represents the morally optimal path available to Members in good standing.
     4.3 **Notwithstanding Clause 4.2,** no Member is ever obligated to perform any Creditworthy Act. Failure to perform a Creditworthy Act, including those necessary for achieving or maintaining Platinum Luminary status, shall incur no penalty, no deduction from the Praise Ledger, no addition to the Blame Ledger, no reproach, and no status downgrade. See also Clause 3.1 regarding ledger independence.
     4.4 Status benefits are determined by the Programme Authority and subject to change.

  **5. Points Table (Illustrative Examples - Net Cost Adjustment Applies)**
  | Creditworthy Act                     | Base Tier Points | Example Net Cost Adjustment Outcome                                                                 |
  | :----------------------------------- | :--------------- | :-------------------------------------------------------------------------------------------------- |
  | Donating £100 to approved charity X  | 50               | Member A (Assets £1m): Cost Low. Awarded: 50 TP. Member B (Assets £1k): Cost High. Awarded: 10 TP. |
  | Assisting stranger in minor emergency | 75               | Member C (Time Abundant): Cost Low. Awarded: 70 TP. Member D (Time Constrained): Cost High. Awarded: 20 TP. |
  | Providing significant emotional support | 100              | Member E (Skilled Listener): Cost Low. Awarded: 95 TP. Member F (Socially Anxious): Cost High. Awarded: 30 TP. |
  | Whistleblowing w/ High Personal Risk | 500              | Member G (Secure Employment): Cost Med. Awarded: 400 TP. Member H (Precarious Employment): Cost High. Awarded: 150 TP. |

  **6. Verification of Acts**
     6.1 Members must submit eligible Acts for verification via the Programme portal within 30 days, providing sufficient evidence as determined by the Programme Authority.
     6.2 The Programme Authority reserves the right to investigate any submission and request further evidence. Verification decisions are final.

  **7. Motive Forfeiture**
     7.1 Tier Points shall be forfeited, in whole or in part, for any Creditworthy Act performed primarily or substantially from Self-Interested Motivation, including but not limited to: direct personal gain (beyond Tier Points), desire for enhanced Programme status, public recognition, or competitive advantage over other Members.
     7.2 Where the Member’s motivation is deemed mixed by the Programme Authority (partly creditable, partly Self-Interested), Tier Points awarded may be reduced proportionally. The Programme Authority's assessment of motivation, based on available evidence and behavioural indicators, shall be conclusive.
     7.3 The Programme Authority acknowledges the inherent difficulty in definitively ascertaining internal motivation. Forfeiture under this clause relies on reasonable inference from objective circumstances and Member declarations. Absent clear indicia of Self-Interested Motivation, the presumption is neutral motivation, and full points (subject to Net Cost) are awarded.

  **8. Permissible Sub-Optimal Acts & The Blame Ledger**
     8.1 Certain Acts, while permissible (i.e., not constituting a failure of Baseline Duty and thus not blameworthy), may be designated as Sub-Optimal by the Programme Authority if they represent a failure to choose a readily available, significantly superior alternative.
     8.2 Performance of a designated Permissible Sub-Optimal Act results in a deduction of Tier Points recorded *only* in the Blame Ledger.
     8.3 A negative balance on the Blame Ledger does not constitute blame, impose any sanction, affect Praise Ledger status, or imply any moral failing. It is solely an administrative record within the Programme. Clause 3.1 applies.
     8.4 An Act performed in good faith ignorance that it constituted a failure of Baseline Duty (but which was Baseline Duty) is *not* a Permissible Sub-Optimal Act; it is a failure of Baseline Duty and earns 0 points. Ignorance of the Schedule (Clause 2.6) is not a defence.
     8.5 If a Member performs an Act under the direct, authoritative command of a relevant superior (e.g., employer, legal authority), and that command transforms the Act into a perceived obligation overriding the Member's usual discretion, the Act may be reclassified as Baseline Duty (earning 0 points) even if it would otherwise be Creditworthy. The Programme Authority's determination applies.

  **9. Collective Action & Aggregate Harm**
     9.1 Where the prevention of a potential harm required simultaneous or sequential action by multiple Members, each of whom faced a materially similar opportunity to act, the Programme credits Members solely based on their individual choice to perform the Creditworthy Act aimed at harm prevention.
     9.2 Each Member performing the Act earns the full Tier Points associated with that Act, as per the Points Table and Net Cost calculation, irrespective of the number of other Members acting or failing to act.
     9.3 **Notwithstanding Clause 3.3,** if the aggregate actions of Members *fail* to prevent the harm due to insufficient participation, the Programme Authority notes this outcome solely as a contextual administrative fact for Programme analytics. It does not affect the Tier Points awarded to Members who performed the Act. The occurrence of the harm is irrelevant to individual credit assessment.

  **10. Programme Amendments**
     10.1 The Programme Authority reserves the right to amend these Terms and Conditions, the Schedule (Clause 2), the Points Table, Status Tier requirements, and any other Programme element at any time, for any reason, without prior notice.

  **11. Retroactive Reclassification**
     11.1 **Without limiting Clause 10.1,** the Programme Authority expressly reserves the right to retroactively reclassify any Act performed by a Member. This includes, but is not limited to:
          a) Reclassifying a Baseline Duty Act as a Creditworthy Act (or vice versa).
          b) Reclassifying a Creditworthy Act as a Permissible Sub-Optimal Act (or vice versa).
          c) Altering the Net Cost calculation methodology applied to a past Act.
          d) Applying Motive Forfeiture (Clause 7) retroactively based on new information or assessment criteria.
     11.2 Reclassification may result in the adjustment (addition, removal, increase, or decrease) of Tier Points in the relevant Ledger. Such adjustments may affect current Status Tier standing.
     11.3 Members acknowledge that past performance offers no guarantee of future Tier Point valuations or Status Tier security due to the inherent potential for retroactive reclassification.

  **12. General**
     12.1 Participation in the Elevate Rewards Programme constitutes acceptance of these Terms and Conditions.
     12.2 The Programme confers no intrinsic moral standing; Status Tiers reflect Programme mechanics only.
     12.3 The Programme Authority disclaims all liability for any consequences arising from Member actions, whether performed to earn Tier Points or not. Decisions of the Programme Authority are final.

  Elevate Rewards Programme™ © Elevate Consultancy Group. All rights reserved. Be More. Give More.™
