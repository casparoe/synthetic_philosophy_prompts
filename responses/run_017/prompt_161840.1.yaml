  Hmm, the user wants me to create a satirical terms and conditions document for a moral loyalty program. They've provided very specific requirements - this needs to be a corporate-style document that satirizes the philosophical concept of supererogation (acts that are morally good but not required).

  I need to cover several key philosophical problems through bureaucratic clauses:
  - The praise/blame asymmetry (Clause 3.1 with separate ledgers)
  - The paradox of making the highest tier "best" yet voluntary (Clause 4.2)
  - The duty boundary problem with ratcheting effect (Clause 2.3 and 2.4)
  - Net-of-cost accounting favoring the wealthy (Points Table)
  - Motive forfeiture despite unverifiability (Clause 7)
  - Permissible bad acts with negative credit (Clause 8)
  - Aggregation problems with collective action failures (Clause 9)

  The voice must remain deadpan corporate throughout - no winking at the reader, no philosophical terms, just treating moral concepts like baggage allowances. I'll invent a consultancy-style name: "The Elevate Rewards Programme" sounds appropriately corporate and uplifting.

  For structure:
  - Start with marketing copy ("Be More. Give More.")
  - Numbered clauses in legalistic language
  - Points table showing how wealth reduces cost of virtue
  - Definitions section
  - End with retroactive reclassification rights

  The satire should work on two levels: as corporate nonsense for general readers, and as precise philosophical critique for ethicists. Every clause must reflect a genuine problem in supererogation theory without naming it. The Points Table will show how giving £100 earns more credit for someone with £1m than for someone with £1k, highlighting how net-of-cost accounting advantages the wealthy.

  For the motive forfeiture clause (7.2), I'll include the loophole where the program admits it can't actually verify motives - a nod to the philosophical difficulty of assessing intentions. The collective action clause (9) will dryly state that members get full credit regardless of outcome, highlighting the problem of praising individual actions that fail to prevent harm.

  The retroactive reclassification at the end (Clause 12) captures how moral categories shift over time, turning yesterday's saints into today's minimum standard. This should give ethicists that "ouch, fair point" feeling while maintaining the corporate facade.
