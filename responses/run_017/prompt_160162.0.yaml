prompt: |-
  I spent most of last evening arguing with a friend about whether any empirical science could ever tell us what an experience is like, and we ended in a stand-off that I now think was really about a practice rather than a theory. My friend's side was the familiar one: there is something it is like to see red; that something is, supposedly, intrinsic to the experience, available only from the inside, and in principle detachable from anything behavioural, functional or physical — hence the inverted-spectrum worry, that a creature could match me in every physical and functional respect while my red and green are swapped, and hence too the worry that complete physical and functional knowledge would still leave something out. I could not refute it. What I kept insisting instead is that there is a mature, technologically successful science that behaves as if the worry were empty, and neither of us could say precisely what that science is committed to. I would like you to reconstruct its implicit theory of experience.

  The practice is psychophysics, and the colour and hearing sciences that grew out of it. As I understand it, it has these features.

  First, it does not, in the first instance, ask subjects to introspect and report qualities. It asks them to discriminate, match and order: say whether two patches differ; adjust a comparison field until the two look identical; say which of two tones is louder; rate how similar two odours are. From judgements like these — largely forced choices, and largely about stimuli rather than about experiences — the field constructs a space: a small number of dimensions, a metric, a distance function. In colour, three matching dimensions, a chromaticity diagram, and then a re-scaled space in which equal distances are supposed to be equally noticeable, plus formulae for colour difference used in industry. In hearing, equal-loudness contours. In olfaction and taste, multidimensional scalings of similarity ratings. The dimensions are then labelled with the names of qualities, and the space is treated as a map of experience.

  Second, the practice pulls in two directions at once. On the one hand it denies that matching is identity of the stimulus: two lights with quite different spectra can match, and the same patch shifts in appearance with the surround and with the observer's state of adaptation, which is why colour-appearance models were later built on top of the matching space. On the other hand it treats matching and discrimination as constitutive: a difference no observer, under any adaptation or surround, can see is not a difference in colour; and the number of dimensions along which a subject can be made to discriminate is taken to be the number of degrees of freedom their colour experience has, so that a dichromat's colour experience is described as a two-dimensional space and a normal one as three-dimensional.

  Third, it aggregates across subjects. It fits smooth functions to pooled data, defines a standard observer, and treats individual variation as noise or as a parameter to be modelled rather than as something that threatens the enterprise. And it uses the resulting numbers for thoroughly practical ends — colour management across cameras, displays and presses, hearing-aid fitting, quality control in paint and food — where they plainly work.

  There is one further wrinkle: the field's own toolkit includes cases where discrimination and experience seem to come apart, since forced-choice performance can exceed what a subject will report seeing, and blindsight and related phenomena are standard fare in the surrounding literature. So the practice both relies on discrimination as its basic datum and possesses reasons to doubt that discrimination is experience.

  What I want from you is the implicit theory of consciousness, or of qualia, that this practice presupposes, and I would like it kept separate from what the practice merely fits well with.

  Does the practice presuppose something like a relational or quality-space view — that what an experience is like is nothing over and above its position in a network of similarity and difference relations to other experiences and to stimuli, so that a properly constructed quality space is not a proxy for qualia but a measurement of them? Or is the practice, strictly speaking, neutral: could someone who holds that qualia are intrinsic, private and ineffable accept every technique described above, on the grounds that the space maps the psychophysical link, or the stimuli, and never the qualia themselves?

  Which commitments are strictly required by the practice, and which are optional extras? In particular: does it require that indiscriminability behave like a distance — symmetric, transitive, additive — and if so what happens to it when it does not? Does it require that similarity relations be comparable across subjects, and what inside the practice is supposed to underwrite that comparability, given that its raw data are one person's forced choices at a time? Does it require that verbal reports reliably track similarity even if they do not track what it is like, and how does that sit with the rhetoric of privacy and ineffability?

  What does the practice rule out if we take it at its word? Does it entail that the inverted-spectrum hypothesis is empirically empty, on the grounds that no measurement the field could make distinguishes the two subjects? Does it entail that any difference in experience unaccompanied by a difference in discrimination, matching, report, or downstream use is no difference at all? Does it entail that the residue in the Mary-style case is either an illusion or a species of ability?

  Where is the practice underdetermined — which of its features could the intrinsic-qualia theorist and the relationalist both endorse while giving different readings of them? Metamerism looks like a case in point: one side will say it shows the field has given up on the stimulus and is in the business of appearances, the other that it shows appearance just is the equivalence class. Say who has the better reading of what the practice actually does, and whether the practice settles the matter at all.

  Finally, what would have to change in the practice if the intrinsic-qualia view were true and psychophysicists took it seriously? Would they have to abandon forced-choice discrimination as the basic datum, stop pooling across subjects, stop treating the number of discriminable dimensions as the number of degrees of freedom of experience, or add some independent calibration of introspective report? And conversely, if the relational view is right, is there anything the practice currently does that it ought to stop doing — the standard observer, the pooling, the labelling of dimensions as though they named something intrinsic?

  One constraint: I have no library access and I do not want a literature survey, a reading list or citations, and I would rather you did not lean on the names attached to these views. Reconstruct the theory from the practice as I have described it, tell me which parts of it are forced and which are merely convenient, and say where a rival theory would license exactly the same procedure.
reasoning: |-
  Okay, the user has presented a detailed scenario about their debate with a friend regarding whether empirical science can capture what an experience is like. They specifically focus on psychophysics practices in color and hearing sciences. I need to reconstruct the implicit theory of consciousness that underlies this practice.

  First, I should break down the key features of psychophysics as described: reliance on discrimination, matching, and ordering tasks; construction of quality spaces; treatment of matching as constitutive; aggregation across subjects; and practical applications. The user wants to know what this practice presupposes about consciousness, separate from what it merely fits well with.

  The core question is whether the practice assumes a relational view (qualia as positions in a quality space) or remains neutral, allowing for intrinsic qualia. I need to identify which commitments are necessary for the practice to function versus optional add-ons.

  Looking at the practice, it treats indiscriminability as defining equivalence classes. For example, metamers are treated as identical in color despite different spectra. This suggests that the practice equates subjective sameness with indiscriminability. If two stimuli can't be discriminated, they're considered the same experience. This seems fundamental to how they build their spaces.

  The construction of dimensions based on discrimination abilities implies that the structure of experience is defined by discriminative capacities. A dichromat's two-dimensional space versus a trichromat's three-dimensional space directly ties the "degrees of freedom" of experience to discrimination capabilities. This would be hard to maintain if qualia were intrinsic and private, as such intrinsic properties wouldn't necessarily correlate with discrimination performance.

  Aggregation across subjects is another key point. By pooling data and defining a standard observer, the practice assumes intersubjective comparability of experiences. This standardization works for practical applications, suggesting that individual variations are noise rather than fundamental differences. If qualia were truly private and ineffable, this aggregation might not make sense, as each person's experience could be uniquely inaccessible.

  The user also mentions cases where discrimination and experience come apart, like blindsight. The practice acknowledges these but still relies on discrimination as the primary datum. This indicates that while they recognize dissociations, discrimination remains central to their methodology.

  For the inverted spectrum argument, the practice would treat it as empirically empty. Since no discrimination task could distinguish between inverted qualia scenarios, the hypothesis doesn't affect the quality space model. The practice essentially operationalizes experience in terms of discriminative behavior, leaving no room for undetectable differences.

  The user asks what would change if intrinsic qualia were taken seriously. Psychophysicists might need independent introspective reports or abandon aggregation. But the current practice doesn't include these, suggesting that intrinsic qualia aren't necessary for their methods. Conversely, if the relational view is correct, practices like the standard observer and labeling dimensions are justified as mapping relational structures.

  Underdetermination exists in interpreting metamerism. Relationalists see it as defining experiences via equivalence classes, while intrinsic theorists might view it as accessing appearances. However, the practice's constitutive treatment of matching leans towards the relational interpretation. The success in practical applications without needing intrinsic qualia supports the relational view as more parsimonious.

  In conclusion, the implicit theory is relational: experiences are constituted by their positions in a quality space defined by discrimination and similarity relations. The practice requires this to function, especially the constitutive role of indiscriminability, dimensionality tied to discrimination, and intersubjective aggregation. Intrinsic qualia aren't ruled out but are irrelevant to the practice, which would proceed the same regardless.
answer: |-
  Based on the practice you've described, I reconstruct the *implicit theory of experience* that psychophysics necessarily presupposes to function as it does. I'll separate core commitments from optional features, address underdetermination, and explore consequences for rival views.

  **The Implicit Core Theory:**

  1.  **Experience is Constituted by Discriminative Relations:** The fundamental commitment is that what an experience *is like* is intrinsically tied to, and ultimately defined by, its relations of similarity and difference to other possible experiences. The ability to discriminate (or fail to discriminate) stimuli is not merely evidence *for* a qualitative difference; it is constitutive *of* it. A difference that cannot be discriminated under any condition *is not a qualitative difference*.
  2.  **The Structure of Experience is Captured by Discriminative Capacities:** The dimensionality of the constructed space (e.g., 3D for normal colour vision) is not just a model *of* experience; it directly reflects the inherent structure of the experiential field. The degrees of freedom of experience *are* the dimensions along which systematic, reliable discrimination is possible. A dichromat's experience *is* two-dimensional in this structural sense.
  3.  **Indiscriminability Defines Equivalence Classes:** Metameric matches (physically different stimuli judged identical) are not just stimuli that *elicit the same report*; they are defined as stimuli that elicit *the same experience*. The equivalence class *is* the experience type. This is why metamerism is foundational, not problematic.
  4.  **Intersubjective Comparability of Structure is Assumed:** The practice of pooling data, fitting smooth functions, and defining a standard observer presupposes that the *structure* of the quality space (the relations of similarity, difference, and dimensionality) is fundamentally comparable across typical observers. Individual variations are deviations *within* this shared structural framework, not evidence of fundamentally incomparable private worlds. The "space" is public in its relational structure.
  5.  **Experience is Publicly Accessible via Behavior (Specifically Discrimination):** The raw data (forced-choice judgments about stimuli) are treated as providing direct, public access to the structure of private experience *because* discrimination is constitutive of that structure (Point 1). The practice doesn't merely correlate behavior with a hidden quale; it treats the discriminative behavior (under controlled conditions) as revealing the quale's relational essence.

  **What the Core Theory Entails and Rules Out:**

  *   **Entails the Empirical Emptiness of the Inverted Spectrum:** If two individuals exhibit identical capacities for discrimination, matching, ordering, and similarity judgments across all contexts and states, then according to this practice, their colour experiences *must* have the same relational structure. Any hypothetical "intrinsic inversion" leaving this structure intact is operationally meaningless and undetectable. The practice treats it as no difference at all. The inverted spectrum worry *is* empty *for the science* because its methods cannot conceptualize or detect such a difference.
  *   **Entails that Undetectable Differences are Non-Existent (Operationally):** A difference in "what it's like" unaccompanied by *any* potential difference in discrimination, matching, report (forced-choice or similarity scaling), or downstream use (e.g., emotional association learned via conditioning detectable in choices) is ruled out as a meaningful concept within the practice. Such a difference cannot be measured, modeled, or incorporated into the science. If Mary gains a new discriminative ability or refines an existing similarity judgment upon seeing red for the first time, that *is* the residue. If she gains no such ability, the practice would conclude there was no residue *to measure*.
  *   **Entails that Qualia are Relational:** The theory is strongly relational. Qualia are not intrinsic atoms hidden behind behavior; they *are* nodes in a publicly accessible network of discriminative relations. The space *is* the measurement of the qualia's essential relational properties. Labelling dimensions ("hue", "saturation", "loudness") is naming aspects of this relational structure.
  *   **Requires Indiscriminability as an Equivalence Relation (Mostly):** The practice fundamentally relies on indiscriminability defining equivalence classes (same experience). This requires reflexivity and symmetry. Transitivity is practically assumed for building neat spaces and metrics, but the practice *acknowledges* failures (e.g., slight non-transitivity in colour matching) and deals with them statistically or with thresholds, treating them as noise or limitations of the system, not a fundamental challenge to the equivalence class concept. Additivity is a desirable feature for constructing smooth metrics (like CIELAB) but is not absolute; the practice works with non-Euclidean spaces where necessary. The core commitment is to indiscriminability defining equivalence, not to a perfectly behaved distance metric.
  *   **Requires Cross-Subject Comparability of Structure:** The pooling and standard observer rely on the assumption that the *types* of relations (similarity/difference judgments) elicited by stimuli are comparable across subjects. The practice underwrites this by focusing on the *structure* of responses (patterns of matches, discrimination thresholds, similarity rankings), not the raw "feeling." The success of applications (colour management, hearing aids) validates this assumption for practical purposes within the typical population. It assumes the relational structure is shared, even if individual "calibrations" might differ.

  **Underdetermination and Rival Readings:**

  *   **Metamerism:**
      *   **Relationalist Reading:** This is the core commitment: Metamerism *defines* experiential sameness. The equivalence class *is* the experience type. The space maps relations constituting qualia.
      *   **Intrinsic-Qualia Theorist Reading:** They *must* say metamerism shows the practice is accessing *appearances* (how things look/sound), which correlate with or are caused by intrinsic qualia, but are not identical to them. The space maps the *effect* of qualia on public judgment, not qualia themselves.
      *   **Better Reading:** The practice *behaves* constitutively (Point 3). It treats the match *as* identity of experience for its purposes. The intrinsic theorist's reading adds an unnecessary layer (the hidden intrinsic quale) that the practice neither needs nor can access. The relational reading is more parsimonious and fits the constitutive language used within the field ("this light *is* unique yellow for the standard observer"). The practice doesn't *settle* the metaphysics, but its operational rules strongly favor the relational interpretation.
  *   **Dissociations (Blindsight, Forced-Choice vs. Report):** The practice acknowledges these but treats them as *exceptions* or *pathologies* where the normal constitutive link between discrimination and conscious experience is broken. It doesn't abandon discrimination as the core datum for *defining* the structure of normal conscious experience; it defines blindsight *in contrast* to that norm. Both relationalists and intrinsic theorists can accept this: relationalists see it as a breakdown in the relational structure being accessed/reported; intrinsic theorists see it as evidence that discrimination can occur without conscious qualia. The practice itself remains focused on the core case where discrimination and report *are* linked.

  **What the Practice is Neutral About (Optional Extras):**

  1.  **The "Raw Feel":** The practice is neutral on whether there is an additional, ineffable "raw feel" *over and above* the relational structure it maps. It simply doesn't operationalize or require such a notion.
  2.  **Absolute Intrinsic Properties:** It doesn't require that "redness" has some intrinsic, non-relational essence. The labels ("red", "sweet", "loud") are pragmatic tags for regions in the relational space.
  3.  **Complete Exhaustiveness:** While it treats discriminative capacities as defining the structure, it doesn't necessarily claim this captures *every* aspect of experience (e.g., emotional valence, aesthetic qualities) unless those aspects systematically influence discrimination, matching, or similarity judgments within the experimental paradigm.

  **Consequences of Rival Theories on the Practice:**

  *   **If Intrinsic Qualia Were True and Taken Seriously:**
      *   **Abandoning Core Methodology?:** Psychophysicists would likely *have* to abandon forced-choice discrimination as the *basic constitutive datum* of qualia structure. It would be seen as merely correlative.
      *   **New Primary Datum:** Introspective report about the intrinsic qualities themselves would become the primary, irreplaceable data source. Calibrating and standardizing such reports across subjects would be the central, likely insurmountable, challenge.
      *   **End of Pooling/Standard Observer:** Aggregating data to define a standard observer would be rendered meaningless or deeply problematic, as intrinsic qualia are fundamentally private. The practice would fracture into studying individual private worlds with no guaranteed common structure. Individual variation couldn't be treated as noise.
      *   **Dimensionality Questioned:** The number of discriminable dimensions could no longer be assumed to directly reflect the degrees of freedom of intrinsic experience. A hidden dimension of intrinsic feel, uncorrelated with discrimination, might exist.
      *   **Practical Applications Threatened:** Colour management etc. work *because* the relational structure is shared and public. If intrinsic qualia are private and potentially unrelated to this structure, the reliability of these applications becomes coincidental and inexplicable within the science. The practice as described would collapse or become a different enterprise focused on private introspection.

  *   **If the Relational View is Right:**
      *   **Practice Validated:** The core methodology is not just useful but directly measures the essence of experience (its relational structure).
      *   **Standard Observer/Pooling Justified:** Aggregation and standardization are valid because they capture the shared relational structure of experience.
      *   **Labelling Dimensions:** Labelling dimensions is naming aspects of the public relational structure, not positing hidden intrinsics. This is appropriate.
      *   **No Need to Stop:** The practice doesn't do anything it *should* stop if relationalism is true. Its core procedures are congruent with the theory. Acknowledging dissociations like blindsight is consistent, as they represent failures of the normal constitutive link, not a flaw in the core theory for normal conscious perception.

  **Conclusion:**

  The implicit theory embedded in psychophysics, as you describe it, is robustly **relational**. It presupposes that the nature of sensory experience – *what it is like* – is constituted by its position within a web of similarity and difference relations, publicly accessible through discriminative behavior under controlled conditions. The quality space constructed from these relations is not a mere proxy; it is the measurement of the essential structural properties of the qualia themselves. Indiscriminability defines experiential identity. Intersubjective comparability of structure is assumed and operationalized.

  This core theory entails the empirical emptiness of the inverted spectrum, rules out undetectable qualitative differences, and requires discrimination as constitutive. While the practice acknowledges dissociations and doesn't claim to capture every nuance (like emotional tone unless it affects discrimination), its fundamental methodology and success in practical applications rely on and validate this relational view. An intrinsic qualia theorist cannot accept the practice's *core constitutive claims* (indiscriminability = experiential identity, dimensionality = experiential degrees of freedom, intersubjective structure) without undermining them; they can only see the practice as mapping correlates or effects of the hidden intrinsic properties. The practice, taken at its operational word, strongly favors the relational interpretation.
