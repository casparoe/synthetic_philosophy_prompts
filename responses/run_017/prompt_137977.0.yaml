  Below is a decision-tree handout designed for your Scanlonian contractualism reading group, focused on the aggregation problem and tailored to your travel fund case. It starts from core contractualist premises and branches into named positions on how numbers count, using concrete cases to answer branch questions. The tree prioritizes your requested distinctions (one-shot vs. iterated, de minimis, shared vs. separate complaints, and same vs. different people) and includes the leaves you specified. It has **7 branch questions** and **7 leaves**, with notes on indistinguishability and unoccupied positions.

  ---

  ### **Decision Tree: Scanlon’s Aggregation Problem**  
  **Starting Point**: Morality is about what no one could reasonably reject. We compare complaints person by person.  
  **Core Case**: *Travel Fund Dilemma* — Should your department spend a limited fund to help **one grad student** attend a career-critical conference (preventing a major loss for them) or help **many students** with small benefits (e.g., books, software, local travel) that add up to greater total benefit?  

  ---

  #### **Branch 1: One-Shot vs. Iterated Choice**  
  *Does the answer change if this same choice (e.g., allocating the travel fund) recurs identically 20 times, and you can alternate who gets helped?*  
  - **One-shot**: The choice is isolated. No future repetitions. → Go to Branch 2.  
  - **Iterated**: The choice repeats identically. Fairness over time matters. → Go to Branch 7.  

  #### **Branch 2: De Minimis Complaints**  
  *In the "many" option, are individual complaints so small that no single person could reasonably reject a policy ignoring them alone (e.g., losing $50 for books)?*  
  - **No de minimis**: Even tiny complaints count individually. → Go to Branch 3.  
  - **De minimis threshold**: Tiny complaints don’t count *unless* pooled. → Go to Branch 3.  
    - *Note*: "Pooled" means complaints are combined to form a single aggregate complaint (e.g., 20 people losing $50 each → $1,000 loss).  

  #### **Branch 3: Shared vs. Separate Harms**  
  *In the "many" option, are complaints from a **shared resource** (e.g., degrading a lab instrument all use) or **separate resources** (e.g., each loses their own $50)?*  
  - **Shared harm**: The loss is collective (one complaint about a joint resource). → Go to Branch 4.  
  - **Separate harms**: Each person loses something distinct (many individual complaints). → Go to Branch 4.  

  #### **Branch 4: Same or Different People?**  
  *Are the people in the "many" group the **same individuals** across options (e.g., the same 20 students always getting small benefits) or **different people** (e.g., random students benefit each time)?*  
  - **Same people**: Identifiable group recurring. → Go to Branch 5.  
  - **Different people**: Group composition changes. → Go to Branch 5.  

  #### **Branch 5: Can Small Complaints Aggregate?**  
  *Can the combined weight of many small complaints (e.g., 20 people losing $50 each) outweigh one large complaint (e.g., one person missing a career-critical conference)?*  
  - **No aggregation**: Small complaints cannot outweigh large ones, even combined. → Go to Branch 6.  
  - **Aggregation**: Small complaints can outweigh large ones if total burden is greater. → Go to Leaf 1.  

  #### **Branch 6: Tie-Breaking for Equal Complaints?**  
  *If the strongest individual complaints in both options are equal (e.g., one person loses a conference vs. one person loses an identical conference), do numbers break ties?*  
  - **No tie-breaking**: Numbers never matter. Flip a coin or prioritize fairness. → **Leaf 4: Strict Anti-Aggregation** (e.g., Taurek).  
  - **Numbers break ties**: Save the greater number when individual burdens are equal. → **Leaf 5: Numbers as Tie-Breaker** (e.g., Scanlon’s default).  

  #### **Branch 7: Iterated Fairness Mechanism**  
  *For repeated choices, how do you ensure fairness?*  
  - **Alternate help**: Rotate who gets the big benefit (e.g., the one student helped this time is excluded next time). → **Leaf 6: Threshold/Sufficiency View** (e.g., aid those below a "sufficiency" threshold first).  
  - **Equal chances**: Give everyone an equal ex ante probability of being helped. → **Leaf 7: Weighted Lottery / Equal Chances Ex Ante** (e.g., Fried, Harsanyi).  

  ---

  ### **Leaves: Named Positions**  
  1. **Leaf 1: Plain Aggregation** (e.g., Utilitarian)  
     - *Description*: Sum all burdens (e.g., total utility loss). The option with less total burden wins. Ignores person-by-person comparison.  
     - *Travel fund*: Help the many if total small benefits > one big benefit.  
     - *Path*: Aggregation (Branch 5) → Leaf 1.  

  2. **Leaf 2: Fractional Satisfaction View** (e.g., Kamm’s "proportional" view)  
     - *Description*: Maximize the total fraction of each person’s claim satisfied. If helping the many satisfies more "claim-fractions" overall, it wins.  
     - *Travel fund*: Help the many if sum(small benefits / individual needs) > 1 (the one student’s full claim).  
     - *Path*: Aggregation (Branch 5) → Leaf 2.  

  3. **Leaf 3: Threshold/Sufficiency View** (e.g., Frankfurt, Anderson)  
     - *Description*: Prioritize complaints above a threshold (e.g., "career-critical" harm). Only aggregate complaints below the threshold.  
     - *Travel fund*: Help the one if conference loss is above threshold; else, aggregate small complaints.  
     - *Path*: Iterated → Alternate help (Branch 7) → Leaf 3.  

  4. **Leaf 4: Strict Anti-Aggregation** (e.g., Taurek)  
     - *Description*: No aggregation. Numbers never matter. In ties, flip a coin or use fairness.  
     - *Travel fund*: Always help the one (their complaint is larger than any individual small complaint).  
     - *Path*: No aggregation (Branch 5) → No tie-breaking (Branch 6) → Leaf 4.  

  5. **Leaf 5: Numbers as Tie-Breaker** (e.g., Scanlon)  
     - *Description*: Aggregate only when individual burdens are equal. Then save the greater number.  
     - *Travel fund*: Help the one (not a tie). In equal-burden cases (e.g., one vs. one), numbers break ties.  
     - *Path*: No aggregation (Branch 5) → Tie-breaking by numbers (Branch 6) → Leaf 5.  

  6. **Leaf 6: Weighted Lottery / Equal Chances Ex Ante** (e.g., Fried)  
     - *Description*: From an ex ante perspective, give everyone equal chances. Use a lottery weighted by stakes if needed.  
     - *Travel fund*: In one-shot, lottery assigns probabilities (e.g., one student has 1/21 chance, 20 have 20/21 chance to split funds).  
     - *Path*: Iterated → Equal chances (Branch 7) → Leaf 6.  

  7. **Leaf 7: Unnamed: Context-Sensitive Aggregation**  
     - *Description*: Aggregate only for shared harms (Branch 3) or when people are different (Branch 4). Not for separate/same cases.  
     - *Travel fund*: If harms are shared, aggregate to help the many; if separate/same people, help the one.  
     - *Path*: Aggregation (Branch 5) → *only if* shared harm (Branch 3) OR different people (Branch 4).  

