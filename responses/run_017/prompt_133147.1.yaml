  **A housing co-operative's bylaws with an amendment that increases the voting threshold create genuine indeterminacy through a post-adoption validity assessment clause.**

  **Initial Bylaws of the Green Meadows Housing Co-operative:**  
  1. Amendments require approval by a simple majority of members present at a meeting with a quorum of 20% of the membership.  
  2. The Board consists of 5 elected members.  
  3. The Board may assess the validity of any amendment at any time, applying the amendment procedure in effect during the assessment.  
  4. All adopted amendments are recorded in an appendix that is part of these bylaws.  

  **Proposed Amendment:**  
  "Article 1 is amended to require a two-thirds majority for amendments."  

