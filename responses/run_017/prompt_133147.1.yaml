    - No self-reference (no provision refers to its own validity).
    - No explicit retroactivity (the amendment doesn't say it applies to itself).
    - No contradiction within a single snapshot of the bylaws.
    - No vagueness and no misconduct (all rules clear, votes counted correctly).
