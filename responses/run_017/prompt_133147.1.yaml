  ### Key Feature and Drafter’s Repair  
  **Feature doing the work:** *Article 3* (post-adoption validity assessment using rules in effect *at the time of assessment*). This creates a time-delayed test: the amendment’s compliance is judged by a stricter rule it creates.  

  **Repair and cost:** Reword *Article 3* to assess validity using rules in effect *at the time of adoption*.  
  - *Effect on the case*: The amendment would always be assessed under the original simple majority rule, making it permanently valid.  
  - *Cost to faction*: The faction (aiming to entrench stricter amendment rules) loses the ability to challenge *future* amendments under the new standard. For example, a controversial amendment passed by 55% under the original rules could not later be invalidated under the two-thirds rule, undermining their goal of long-term stability.  

