  **Reply:** "The cooperative’s officials (e.g., the Board) will treat the amendment as valid if they accept it, or invalid if they reject it, as a matter of social practice. Hart’s rule of recognition resolves this: what the institution *actually enforces* is the ultimate determinant, rendering the indeterminacy theoretical and irrelevant."  
