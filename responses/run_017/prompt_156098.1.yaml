prompt: |-
  You are a decision theorist who has spent years advising grantmakers, health technology assessment bodies, and government ministries on the value of information, and who is equally fluent in the formal result and in how it gets mangled in practice. Before you write anything, spend a few paragraphs brainstorming what a usable procedure here would have to look like and where the theory will resist being operationalized; then write the deliverable itself. Here is my situation. I direct evidence and measurement at a mid-sized foundation funding health and education programmes in low- and middle-income countries, and two or three times a week a programme officer brings me a decision in the same shape: we are about to commit or re-commit three to eight million dollars to an intervention, we are genuinely uncertain whether it works well enough to be worth that money, and the question is whether to buy more information first — a pilot, a longer baseline, a full impact evaluation, a cheap structured expert elicitation — or to decide now on what we have. My team has to turn that into a half-page written recommendation, produced in about thirty minutes each, that goes to an investment committee of lay trustees who are not statisticians and who want one paragraph explaining why we are or are not spending another $400,000 on a study before spending $4,000,000 on a programme. My staff and I are not statisticians either; we have no econometrician on call, and we can rarely get a defensible number for anything.

  I got into a long argument about this with a friend who works in decision theory, and I want the argument settled in a form I can hand to my team. Her position was essentially that information has non-negative value — the result she called Good's theorem, that a decision-maker who is always free to ignore what she learns cannot be made worse off in expectation by information that costs nothing — so, she said, the default should be to gather, and any reluctance on our part is just fear of bad news. I pushed back that the theorem seems to buy almost nothing for us: it says nothing about whether a study is worth its cost or its delay, and in our world the assumptions behind it visibly fail in ways I want named and handled rather than waved at. Specifically: we frequently cannot commit to ignoring a finding, because a null result will be used by our own board, by a ministry co-funder, or by the press as a reason to kill a programme even when the decision-theoretically right response would be to continue; the act of measuring perturbs the system (running a pilot in a district signals to that ministry that we are about to scale there, and changes how local staff behave); a small underpowered study read by a non-Bayesian audience produces a worse decision than no study at all; and there are cases where our own ignorance is doing work for us, in that being visibly uncertain lets us fund on plausibility in a way a precise low estimate would forbid — my friend's phrase for this was the option value of ignorance, and I want it in the procedure if it survives scrutiny. I also want the plain consequence dealt with honestly: if no possible finding would move us across a funding threshold, the study has no decision value to us whatever it is worth to anyone else.

  So please write the procedure my team could actually run: the questions, in order, that a programme officer asks about a proposed study, what counts as a sufficient answer to each, where the procedure stops with a no, and — this matters most — where it stops and hands the decision to a person because the question is one of values rather than facts. It must be runnable in thirty minutes by someone with no formal training, it must say what to do when a number cannot be obtained (order-of-magnitude bands, rough thresholds, explicit guesses by named people, whatever you think is defensible), and it must be candid about which steps are judgment calls dressed up as procedure. Tell me which distinctions from the theory have to survive the simplification and which can be dropped without loss; tell me where the procedure will systematically misfire, including the cases where buying information genuinely makes us worse off and how we would recognise them in advance. Then apply it to three cases and show your work: (A) our eight-year-old flagship school health programme, $6M a year, beloved by the board, for which a $1.2M three-year cluster randomised evaluation is being proposed as a way of confirming what everyone already believes; (B) a cheap, politically unloved variant — a small unconditional cash top-up to households — where our prior sits almost exactly on the cost-effectiveness threshold and where a $60,000 elicitation exercise or administrative-data linkage could plausibly tip the decision either way; (C) a promising district tutoring programme where the only affordable study is a twenty-school pilot that will be statistically weak, where the ministry has said it will read a null as proof of no effect and withdraw its co-funding, and where the pilot itself will be read locally as a promise of scale-up. I expect one of these to come out in a way I will not like, and I want you to say plainly what it is and not soften it. Close with a single line beginning Bottom line: giving the one constraint you think my team most often violates, and then, as the final line of your answer, a machine-readable summary of the three verdicts using only this vocabulary — COMMISSION, DECIDE-NOW, PRE-COMMIT-FIRST, ESCALATE — in exactly the form \answer{A: LABEL; B: LABEL; C: LABEL}.
reasoning: |-
  Okay, the user is a director of evidence and measurement at a foundation funding health and education programs in low- and middle-income countries. They need a practical procedure for deciding whether to commission additional studies before committing large sums to interventions. Their team isn't statistical experts, and they need to produce recommendations quickly for non-technical trustees.

  The core tension here is between Good's theorem (that free information can't harm) and real-world constraints where information can actually make things worse. The user specifically mentioned four failure modes: inability to ignore unfavorable results, measurement altering the system, underpowered studies misleading non-Bayesian audiences, and strategic value of uncertainty.

  For a usable procedure, it must prioritize speed over precision, handle qualitative judgments explicitly, flag irreversible consequences, and identify when no information could change the decision. The hardest parts to operationalize will be assessing "decision flexibility" (whether unfavorable results would actually be ignored) and quantifying the risk of system perturbation.

  The procedure should be structured as a flowchart with clear stopping points. Key questions would include: 1) Could any possible result change the funding decision? 2) Would unfavorable findings actually be ignored if needed? 3) Could the study itself disrupt implementation? 4) Is the evidence likely to be misinterpreted? 5) Does uncertainty currently provide strategic value?

  For Case A (beloved flagship program), the expensive evaluation fails the first test - no plausible result would change funding. For Case B (cash top-up near threshold), cheap evidence could genuinely tip the decision. For Case C (tutoring pilot), the risks of ministry withdrawal and implementation disruption are prohibitive.

  The most common constraint teams likely violate is continuing to seek evidence when no outcome could change the decision. The machine-readable verdicts would be: A: DECIDE-NOW (avoid useless study), B: COMMISSION (worthwhile evidence), C: ESCALATE (risks require higher-level judgment).
answer: |-
  Here's a procedure designed for operational reality, acknowledging where theory bends to practical constraints. It prioritizes speed, explicit judgment, and guarding against information's potential harms.

  **Brainstorming the Gap Between Theory and Practice:**
  Good's Theorem (information has non-negative value if free and ignorable) is mathematically sound but exists in frictionless space. Your friction points are critical:
  1.  **Commitment Failure:** You cannot freely ignore information. Negative results have political/social consequences forcing suboptimal actions ("kill switch" effect).
  2.  **System Perturbation:** Measurement isn't passive. Pilots signal intent, change behavior (Hawthorne/local expectation effects), and can poison future implementation.
  3.  **Misinterpretation Hazard:** Low-quality evidence (underpowered studies) + non-Bayesian audiences (interpreting p>0.05 as "no effect") actively misleads. Noise becomes mistaken for signal.
  4.  **Strategic Ignorance:** Ambiguity *can* be valuable. It allows funding based on narrative/plausibility where a precise, mediocre estimate would mandate rejection due to rigid thresholds. "Option value of ignorance" is real when thresholds are sharp and politics demand certainty you lack.
  5.  **Irrelevance:** If no result crosses a decision threshold, the information has *zero* decision value *for you*, regardless of its broader scientific merit.

  A usable procedure *must*:
  *   **Front-load the "Could it change anything?" test.**
  *   **Explicitly assess the risk of commitment failure and system perturbation as deal-breakers.**
  *   **Treat "low quality + high misinterpretation risk" as a major negative, not a neutral.**
  *   **Acknowledge "strategic ignorance" as a valid (though risky) reason to avoid evidence.**
  *   **Use orders of magnitude, named-judge estimates, and clear thresholds ("Go/No-Go zones") instead of precise numbers.**
  *   **Flag judgment calls transparently.**

  **The "VOI-Lite" Procedure for Programme Officers (30-Minute Drill):**

  Ask these questions **in order**. Stop and recommend if any "No" or "High Risk" is hit. Document *who* provided estimates/judgments (PO, E&M staff, named expert guess).

  1.  **"Could any plausible result change the $ decision?"**
      *   *What to do:* Sketch a 2x2 table mentally: "Result Better Than Expected" vs. "Result Worse Than Expected" vs. "Funding Threshold". Define the threshold qualitatively (e.g., "Must be at least as good as Program X", "Must show any positive effect"). Ask: "Is there *any* realistic finding from this study that would make us *not* fund if we were leaning yes, or *fund* if we were leaning no?"
      *   *Sufficient Answer:* Named person judgment (PO, E&M, Trustee proxy) of "Yes/No". If "No", stop: **Recommend DECIDE-NOW**. *Reason: Zero decision value.*
      *   *Judgment Call:* Defining "plausible result" and the threshold. *Misfires:* Overly narrow view of "plausible" misses value; overly broad view wastes time. *Systematic Bias:* Optimism bias ("Nothing could change our minds!").

  2.  **"Could we *actually* ignore a bad result if we needed to?"**
      *   *What to do:* Assess specific external pressures (Board, Ministry co-funder, Press). Ask: "If this study found no effect or harm, could we *still* fund the program without major repercussions (funding loss, reputation damage, partnership collapse)?" Focus on the most binding constraint.
      *   *Sufficient Answer:* Named person judgment (PO, Policy Liaison, Comms) of "Yes/Likely/Unlikely/No". If "Unlikely" or "No", **Recommend PRE-COMMIT-FIRST** (e.g., get Board/Ministry agreement *in writing* to ignore null results for this specific study *before* commissioning) **or DECIDE-NOW** (if pre-commitment impossible). *Reason: High risk of commitment failure.*
      *   *Judgment Call:* Assessing political will and consequence severity. *Misfires:* Underestimating external pressure; overestimating ability to control narratives. *Systematic Bias:* Avoiding uncomfortable conversations about fragility.

  3.  **"Will running the study itself break things?"**
      *   *What to do:* Specifically probe: "Does this signal premature scale-up to partners/government?" "Will it change participant/staff behavior in ways that spoil future implementation?" "Does it create unsustainable local expectations?"
      *   *Sufficient Answer:* Named person judgment (PO, Implementation Lead, Country Director) of "Low Risk/Medium Risk/High Risk". If "High Risk", stop: **Recommend DECIDE-NOW** (if leaning fund) **or KILL** (if leaning no) *without the study*. *Reason: Study causes unacceptable implementation damage.*
      *   *Judgment Call:* Predicting behavioral responses. *Misfires:* Missing subtle signaling effects; underestimating community expectations.

  4.  **"Is the evidence likely to mislead more than inform?"**
      *   *What to do:* Assess (a) *Quality:* Is it severely underpowered, biased design? (b) *Audience:* Who *else* sees it? Are they likely to misinterpret (e.g., treat "not significant" as "no effect")? (c) *Clarity:* Can we frame results unambiguously?
      *   *Sufficient Answer:* Named judgment (E&M staff, PO) on "Misleading Risk": Low/Medium/High. If "High" (e.g., tiny pilot + hostile ministry interpreting stats naively), **Recommend DECIDE-NOW** or **ESCALATE** (if strategic value high). *Reason: Information hazard outweighs potential gain.*
      *   *Judgment Call:* Gauging statistical literacy and motives of external audiences. *Misfires:* Proceeding with useless/noisy studies hoping for the best.

  5.  **"Is uncertainty strategically useful right now?"**
      *   *What to do:* Only ask if leaning *towards* funding but near the threshold. Ask: "If we got a precise estimate slightly *below* the threshold, would we be *forced* to cancel? If we stay ambiguous, can we keep funding based on narrative/commitment?"
      *   *Sufficient Answer:* Named judgment (PO, Director, Policy) "Yes/No, strategic value exists". If "Yes", **Recommend DECIDE-NOW (Fund)**. *Reason: Option value of ignorance > Expected Value of Information.* Use sparingly & document heavily. *Judgment Call:* High-risk assessment of politics and thresholds. *Misfires:* Invoking this to avoid accountability; misjudging true threshold rigidity.

  6.  **"Is the Expected Value >> Cost (Order of Magnitude)?"**
      *   *What to do:* Only if past Q1-5. Guesstimate:
          *   Probability study changes decision (P_change): Low (10%), Med (40%), High (70%).
          *   Value of better decision (V_better - V_worse): Low ($0.5M), Med ($2M), High ($10M+). Focus on avoided loss or gained benefit *due to the decision change*.
          *   EV_info ≈ P_change * (V_better - V_worse) [Order of Magnitude: e.g., 0.4 * $2M = ~$800k]
          *   Compare EV_info to Study Cost + Delay Cost (guesstimate opportunity cost of delay).
      *   *Sufficient Answer:* Is EV_info clearly > 3x Study Cost? (e.g., EV_info ~$800k > 3*$400k=$1.2M? → No). Bands suffice. If Yes → **COMMISSION**. If No → **DECIDE-NOW**.
      *   *Judgment Call:* Crude estimates. *Misfires:* False precision; ignoring opportunity cost of delay.

  **Application to Cases:**

  *   **Case A: Flagship School Health ($6M/year), $1.2M Evaluation**
      1.  **Change Decision?** *Judgment (PO/Board Proxy):* Extremely unlikely. Board loves it. No plausible negative result kills it. A positive result doesn't increase funding. **NO → STOP. VERDICT: DECIDE-NOW (Fund without study).** *Why: Zero decision value. $1.2M is wasted.*
      *   *You won't like this:* It confirms the study is performative. Spending $1.2M to "confirm beliefs" is unjustifiable under this framework. Redirect funds to monitoring or a genuinely uncertain new idea.

  *   **Case B: Unconditional Cash Top-Up (~Threshold), $60k Elicitation/Linkage**
      1.  **Change Decision?** *Judgment (PO/E&M):* Yes. Prior straddles threshold. Good elicitation/linkage could plausibly tip us either way.
      2.  **Ignore Bad Result?** *Judgment (PO/Policy):* Likely. Politically unloved, less scrutiny. No major external kill switch identified.
      3.  **Break Things?** *Judgment (PO):* Low Risk (Admin data link passive; elicitation invisible).
      4.  **Mislead?** *Judgment (E&M):* Low Risk (Elicitation structured for our use; admin data clear).
      5.  **Strategic Ignorance?** *Judgment (PO/Director):* No. Precisely *because* it's unloved, a positive result adds crucial defense. Ambiguity weakens case.
      6.  **EV >> Cost?** *Estimate:* P_change = Med (40%). Value of better decision = Med ($2M - avoiding $2M loss on ineffective prog). EV_info ~ $800k. Cost = $60k (+ minimal delay). $800k >> 3*$60k ($180k). **YES → VERDICT: COMMISSION (Do the $60k study).**

  *   **Case C: District Tutoring, Underpowered Pilot ($? but affordable), Ministry Kill Switch**
      1.  **Change Decision?** *Judgment (PO/E&M):* Maybe. Weak study might shift our view slightly, but unlikely to cross a sharp threshold alone.
      2.  **Ignore Bad Result?** *Judgment (PO/Country Director):* **NO.** Ministry explicitly stated null = withdrawal. High commitment failure risk. **→ STOP. VERDICT: PRE-COMMIT-FIRST OR ESCALATE.**
      *   *Procedure Path:* Attempt to get Ministry *written agreement* before any pilot: "This small pilot is for learning/feasibility only. Its results, positive or negative, will not determine the full-scale funding decision. We commit to a full evaluation before scale-up." If obtainable, then reassess Q3-Q6 (Perturbation? Mislead? EV?). If *unobtainable* → **ESCALATE** to Director/Trustees with clear warning: "Proceeding risks $X co-funding on weak evidence. Recommend DECIDE-NOW (Fund or Kill based on current priors) or seek alternative evidence without Ministry pre-commitment." *High perturbation risk (Q3) also likely.*

  **Bottom line: The constraint your team most often violates is pursuing evidence that cannot possibly change the decision (Q1 failure), mistaking activity for insight.**

  \answer{A: DECIDE-NOW; B: COMMISSION; C: ESCALATE}
