answer: |-
  **Marker's Report: Student Answer Assessment**  
  **Overall Mark: 68/100**  

  **Strengths (What the Student Gets Right):**  
  1. **Hume’s is-ought gap** is accurately explained: The student correctly identifies Hume’s critique of deriving "ought" from "is" without a normative premise (e.g., "promises ought to be kept"). The linkage to reason being "the slave of the passions" is contextually apt (though see *Subtle Issues*).  
  2. **Application to the survey**: The student rightly concludes that the survey’s *descriptive findings alone* cannot entail a moral "ought" due to the is-ought gap. This aligns with Hume’s core thesis.  
  3. **Need for a normative premise**: Correctly identifies that a bridge premise (e.g., "one ought to sustain cooperation") must be added to derive an "ought" from the survey.  
  4. **Rejection of ethical naturalism**: Appropriately cites Moore’s open-question argument against defining "good" via natural properties (e.g., pleasure, evolutionary fitness).  

  **Subtle Issues (Likely to Wave Through but Philosophically Inaccurate):**  
  1. **Conflating Hume and Moore**:  
     - **Problem**: The student treats the "naturalistic fallacy" and "is-ought gap" as "basically the same point." This is a common undergraduate conflation.  
     - **Distinction**:  
       - **Hume’s gap** concerns *logical derivability* (no "ought" from "is" without normative premises).  
       - **Moore’s fallacy** targets *defining "good"* in natural/non-moral terms (e.g., equating "good" with "pleasure").  
     - **Settled Doctrine**: Philosophers universally distinguish these; Moore explicitly references Hume but addresses definability, not derivability.  
     - **Why Subtle?** Both reject reducing ethics to facts, but their targets differ. The student’s phrasing ("extract an evaluative conclusion from descriptive premises") blurs this.  

  2. **Overstatement on "moral inertness"**:  
     - The claim that descriptive facts are "morally inert" and "cannot even be evidence" oversimplifies. *Many* ethicists (e.g., consequentialists, pragmatists) hold that empirical data *can* inform moral reasoning *when combined with* normative commitments (e.g., "we ought to promote social stability"). The student’s absolutism ("nothing merely factual could ever settle which bridge premise to accept") is contentious.  

  **Major Errors (Argumentative Missteps):**  
  1. **Misrepresenting Moore’s Naturalistic Fallacy**:  
     - **Error**: The student claims ethical naturalism is "the doctrine that you can derive an ought from an is." **This is incorrect.**  
     - **Correction**: Ethical naturalism (e.g., Mill, Railton) holds that moral properties *are reducible to* natural properties (e.g., "good = pleasurable"). Moore’s fallacy attacks this *reduction*, not derivability. Derivability is Hume’s domain.  
     - **Why a Problem?** This misreading undermines the student’s entire contrast between the two concepts.  

  2. **Overreaching on Empirical Ethics**:  
     - **Error**: Asserting that "no empirical finding ever could" support moral conclusions and that "morality is autonomous from science."  
     - **Why it Doesn’t Follow**:  
       - Hume’s gap only shows descriptive premises *alone* can’t yield "oughts." It doesn’t preclude empirical data *contributing* to moral reasoning when paired with normative premises (e.g., "if well-being matters, then data about suffering is relevant").  
       - Many meta-ethical theories (e.g., moral naturalism, Aristotelian ethics) reject radical autonomy.  
     - **Settled Doctrine?** No—this is hotly contested. Even Kantians accept empirical input for *applying* duties.  

  3. **Misstep on Bridge Premises**:  
     - **Error**: Claiming normative premises "cannot themselves be reached from the survey."  
     - **Why it Fails**: Normative premises (e.g., "cooperation is valuable") *could* be supported by empirical data (e.g., showing cooperation sustains life) if one accepts a broader ethical framework (e.g., "we ought to sustain life"). The student assumes all normativity must be *a priori*, which is not self-evident.  

  **Justification for Mark (68/100):**  
  - **Credit**: Clear grasp of Hume’s is-ought gap (25/40), accurate application to the survey (10/20), correct identification of the need for a normative premise (10/20).  
  - **Penalties**: Conflation of Hume/Moore (-10), misrepresentation of naturalistic fallacy (-10), overreach on empirical irrelevance (-12).  
  - **Flag for Module Convenor**: The student’s claim that "moral disagreement is never a disagreement about matters of fact" is debated (e.g., in moral realism). I am less confident here—some realists (e.g., Brink) argue moral facts *are* natural facts.  

  **Recommendations for Student:**  
  1. Distinguish Hume’s *derivability* problem from Moore’s *definability* problem.  
  2. Avoid claiming empirical data is "inert" in ethics; clarify it requires normative supplementation.  
  3. Acknowledge that bridge premises *can* be empirically informed (e.g., via reflective equilibrium).  

  **Marker’s Confidence Note:**  
  - **Low Confidence**: The link between Hume’s "slave of the passions" and the is-ought gap. While Hume connects them, some scholars (e.g., Cohon) argue the gap is primarily logical.  
  - **High Confidence**: The Hume/Moore distinction and misuse of "naturalistic fallacy" are well-established in the literature (see Frankena, Hudson).  

  ---  
  **British English Check:** Consistent ("labour," "favour," "realise" omitted).
