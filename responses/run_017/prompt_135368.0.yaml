  ### Szilard Engine Card Game: Rules and Payoffs  
  **Objective:** Illustrate that information isn't free fuel—demons profit from biased decks, but preparers pay to create the bias.  

  #### **Setup**  
  - **Groups:** Split 18 students into pairs: 9 pairs as **Demons**, 9 as **Preparers**.  
  - **Materials per Pair:**  
    - Demons: Tally sheet, pencil, eraser, 25 blank tokens (work tokens).  
    - Preparers: Deck of 10 cards (5 "L" and 5 "R" for Phase 1; custom for Phase 2), token bank.  
  - **Deck Size:** 10 cards per deck.  
  - **Token Values:** 1 token = energy cost to erase one "mark" (e.g., a symbol on the tally sheet).  

  ---

  ### **Phase 1: Balanced Deck (50/50) — 20 minutes**  
  1. **Preparers** create a 50/50 deck (5L, 5R) at **no cost**.  
  2. **Demons:**  
     - Draw one card per round (10 rounds total).  
     - **Look at the card**, insert the partition on that side (L/R), and collect **1 work token**.  
     - Record the outcome (e.g., "L" or "R") on their tally sheet—**one mark per card**.  
  3. **Erasure:** After 10 rounds, erase the tally sheet. Pay **1 token per mark** (total 10 tokens).  
     - **Profit Calculation:** Earned 10 tokens (work) - 10 tokens (erasure) = **0 profit**.  

  ---

  ### **Phase 2: Biased Deck (70/30) — 35 minutes**  
  1. **Preparers** create a 70/30 deck (7L, 3R). **Cost: 12 tokens** (paid to the token bank).  
     - *Why 12?* Thermodynamic cost of biasing: \(10 \times [0.7 \ln_2(0.7) + 0.3 \ln_2(0.3)] \approx 8.8\) bits, normalized to tokens.  
  2. **Demons:**  
     - Draw one card per round (10 rounds).  
     - Collect **1 work token** per round (10 tokens total).  
     - Record outcomes on a **blank sheet using any code** (e.g., binary, run-length encoding).  
       - *Example:* "LLR" → "2L1R" (3 marks) or "110" (3 marks).  
  3. **Erasure:** Count total marks (\(M\)). Pay **1 token per mark**.  
     - **Profit Calculation:** Earned 10 tokens - \(M\) tokens.  
     - *Expected Profit:* With optimal compression, \(M \approx 8.8\) → profit ≈ **1.2 tokens** (rounded to 1-2 tokens).  

  ---

  ### **Debrief — 20 minutes**  
  1. **Key Moments & Physics Connection:**  
     - **Phase 1 (Break-even):** Erasure cost = work extracted. **Landauer’s principle:** Erasing 1 bit costs \(kT \ln 2\).  
     - **Phase 2 (Profit):** Demons profit by compressing data (lower \(M\)) due to biased decks. **Information = compressible disorder.**  
     - **Preparer’s Cost (12 tokens):** Matches the demon’s profit (1.2 tokens/round × 10 rounds ≈ 12 tokens). **Information isn’t free—it was pre-paid by the preparer!**  
  2. **Takeaway:** The demon’s profit is real energy, but it was "bought" by the preparer’s work to bias the deck.  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Demons refuse to record:**  
     - **Enforce rules:** "No partition insertion without recording." Emphasize memory is physical.  
  2. **Compression gaming:**  
     - **Require decoding:** Demons must reconstruct the sequence from their code (prevents ambiguous symbols).  
  3. **Confusion on bias cost:**  
     - **Clarify:** "Preparers pay 12 tokens because forcing order (bias) requires work, mirroring Maxwell’s Demon’s setup cost."  
  4. **What the game can’t teach:**  
     - Explicit link to \(kT \ln 2\)—state: "Tokens represent thermodynamic costs; exact values derive from statistical mechanics."  

  **Final Note:** The game abstracts entropy as compressible "disorder." Demons *feel* information has energy cost—but only because preparers paid upfront.
