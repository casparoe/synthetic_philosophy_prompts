     - The compression rule might be gamed: they might use a code that uses very few marks by being very long and complicated, but then they might not be able to reconstruct. Or they might use a code that is not uniquely decodable.

     We can require that they must be able to reconstruct the sequence from the marks alone (without any external knowledge). And we will check in the debrief.

     - Time: 75 minutes is tight. We might not get through all.

     Adjust by reducing the deck size? Use 5 rounds in each phase. For 5-card deck, 4L and 1R (80/20):

          Phase 1: 5 work tokens, erasure 5 tokens -> break even.

          Phase 2: 
            Work: 5 rounds * 10 tokens = 50 tokens.
            Entropy: 5 * H(0.8) = 5 * 0.7219 = 3.6095 bits -> erasure cost about 36.1 tokens (if we use 10 tokens per bit?).
            But we scaled: per round work is 10 tokens, so per round in Phase 1 was 1 token, now it's 10 tokens. 
            Alternatively, we can keep per round work as 1 token in both phases? Then in Phase 2 for 5 rounds: 5 tokens.
            Erasure cost: about 3.6 tokens -> profit 1.4 tokens.
            Preparers cost: 1.4 tokens.

          But then the tokens are fractional.

     Given the time, we stick with 10-card deck and scaled work tokens in Phase 2.

     Revised rules for tokens:

     - In Phase 1: 
          per round: 1 work token.
          erasure: 1 token per mark.
          deck: 10 cards, 5L/5R.

     - In Phase 2:
          per round: 10 work tokens (so they get 100 for 10 rounds).
          erasure: 1 token per mark.
          deck: 10 cards, 7L/3R.
          preparers pay: 12 tokens.

     This makes the numbers work.

     Final Timeline:

     0-5: Intro and Phase 1 rules.
     5-20: Phase 1: demons play (10 rounds). They get 1 token per round (10 total). Erasure cost: 10 tokens (because 10 marks). Net: 0.
     20-25: Debrief Phase 1.
     25-30: Explain Phase 2: biased deck, compression, and new rules (per round 10 tokens). Show an example of compression.
     30-35: Preparers: build a deck of 7L and 3R. They receive 12 tokens from the bank and immediately pay 12 tokens to the bank for biasing.
     35-50: Demons: play with the biased deck. In each round, they draw a card, collect 10 tokens, and record the outcome in any way they like (on a blank sheet). They should try to use as few marks as possible, but must be able to reconstruct the sequence.
     50-55: Demons: count the number of marks (M) and pay M tokens to the bank. Calculate profit: 100 - M.
     55-60: Preparers: they are done (they have no tokens left).
     60-75: Gather results: ask a few demon pairs their profit. Write on board. The average should be around 12. Then explain:
          - The minimum possible erasure cost is about 88 tokens (entropy), so profit about 12.
          - The preparers paid 12 tokens to bias the deck.
          - So the demon's profit was paid for by the preparers.
          - This shows that the information used by the demon wasn't free: it was created at a cost.

     What the card game can't hand them:
     - The connection to thermodynamics: we are using tokens to represent energy (work) and they might not see the physics.
     - The exactness of the entropy formula and Landauer's principle: we are using approximations (rounding).

     We will say out loud:
          "In reality, the cost to erase one bit of information is kT ln(2). The work extracted per cycle is also on the order of kT. In our game, we scaled the work in Phase 2 to make the numbers whole, but the principle is the same: the net work extracted (after accounting for erasure) is at most the work that was put in to create the information."

     Materials per demon pair:
     - Phase 1: 
          - 10 cards: 5 "L", 5 "R"
          - Tally sheet (grid of 10 cells)
          - 10 work tokens (for the work they will earn? not needed, because they start with 0 and the bank gives as they go).

     - Phase 2:
          - 10 cards: 7 "L", 3 "R"
          - Blank tally sheet
          - A sheet for them to record their code (optional)

     The bank is the instructor, moving between groups.

     Given the complexity, we hope it fits in 75 minutes.
