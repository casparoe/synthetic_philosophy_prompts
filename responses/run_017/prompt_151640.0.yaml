  ### Key Corrections Summarized
  - **Mechanism**: Superrationality works via *logical fixpoints in decision algorithms*, not physics.  
  - **Scope**: Cooperation is only stable against similarly reasoning agents, not universally.  
  - **CDT**: It is incomplete, not irrational, failing only under logical correlation.  
  - **Kant**: Analogous but not equivalent—rationality vs. morality.  
  - **Single-implementation**: Requires randomization; pure cooperation fails.  

  This preserves your core insight while avoiding overgeneralization. Use the slide claim and case table to clarify boundaries in class.
