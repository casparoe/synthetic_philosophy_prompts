prompt: |-
  I am reworking a graduate seminar session on cooperation in one-shot games, and before I put the following reconstruction in front of students I would like it checked, because I suspect that one or two steps in it are doing more work than they can bear.

  My reconstruction is this. Hofstadter's superrationality settles the one-shot Prisoner's Dilemma. The superrational player notices that any two rational agents faced with the same problem and the same information must arrive at the same conclusion; so, in effect, her choice is everyone's choice. Comparing the two symmetric outcomes — everyone defects versus everyone cooperates — she sees that the latter is better for her, and she cooperates. As I read it, this is nothing more than evidential decision theory applied to the case where the other player is a copy of me: the entire weight of the argument falls on whether the two decisions are correlated, and since a copy and I are physically identical, microphysics guarantees that they are. Causal decision theorists, who defect in the one-shot game against a copy, are therefore not offering a rival conception of rationality; they are simply failing to notice a correlation that is there, and leaving utility on the table. If that is right, my plan is to teach causal decision theory as refuted, present superrationality — or its later development as functional decision theory — as the correct theory, and tell the seminar that in a one-shot Prisoner's Dilemma the rational answer is cooperation, full stop, and against any opponent, since nothing in the argument mentions the opponent's character.

  There are two extensions of this that I also intend to assert, and I would like them checked at the same time. First, a colleague's gloss that I am inclined to repeat: superrationality is just Kant's categorical imperative fitted with a payoff matrix, so the real content of the idea is not new to moral philosophy at all, and the decision-theory literature has been reinventing an old wheel. Second, the variant in which only one of the players' moves is actually implemented — say twenty players, a prize awarded to the one player who acts, and awarded only if no one else acts — seems to me to have exactly the same structure: what does the work is the correlation between the players' reasoning, not whether every move is played out. So I cannot see why any randomized strategy would have a role in that variant, and I mean to tell the seminar that the suggestion that one does is a confusion.

  Please tell me, carefully and without granting my reconstruction, where it goes wrong and what the corrected version looks like. I would rather be corrected now than in front of thirty graduate students. Do not give me a bibliography or a reading list; I want the argument itself.

  After your prose answer, return a single JSON object with exactly these fields:

  - "failed_steps": an array of objects, one per place where my reconstruction breaks, each with the keys "step" (a short label for the step), "my_claim" (the claim as I made it, paraphrased), "why_it_fails" (the precise error, stated so that a student could see it), and "correction" (what should be said in its place).
  - "superrationality_characterized": a single string saying what mechanism actually does the work in superrationality, and stating plainly whether that mechanism is the twin-or-copy correlation of evidential decision theory, a fixpoint of shared reasoning, a counterfactual about one's own decision procedure, or something else — and whether these can come apart.
  - "case_table": an array of objects, one per case, each with the keys "case", "recommendation" (what superrationality in fact recommends there), "mechanism" (what is doing the work in that case), and "cooperate_full_stop" (the string "holds", "fails", or "qualified"). The cases: (a) one-shot Prisoner's Dilemma against a player known to be superrational; (b) the same against a player known to be an ordinary expected-utility maximizer; (c) the same against a player whose type you are unsure of, in a population containing an unknown fraction of superrational players; (d) the single-implementation variant described above.
  - "cdt_status": a single string saying whether the one-shot case refutes causal decision theory and, if not, exactly what it does establish about it.
  - "kant_gloss": a single string saying what is right and what is wrong in identifying superrationality with universalization.
  - "slide_claim": a single sentence I can put on a lecture slide without misleading the seminar.
  - "open_questions": an array of two or three strings naming what remains genuinely unsettled once the corrections above are made.
reasoning: |-
  Hmm, the user is reworking a graduate seminar on cooperation in one-shot games and wants me to critically evaluate their reconstruction of Hofstadter's superrationality argument. They're particularly concerned that some steps in their argument might be doing "more work than they can bear." This is a sophisticated request from someone clearly knowledgeable in decision theory, game theory, and philosophy.

  Looking at their reconstruction: They're arguing that superrationality solves the one-shot Prisoner's Dilemma by recognizing that identical rational agents must make identical choices. They claim this is essentially evidential decision theory (EDT) applied to a copy, and that causal decision theorists (CDT) defect only because they miss the correlation. They plan to teach CDT as refuted and present superrationality/functional decision theory (FDT) as correct. They also want to assert two extensions: (1) that superrationality is just Kant's categorical imperative with payoffs, and (2) that the "single-implementation variant" has the same cooperative solution without needing randomized strategies.

  I need to identify where this reconstruction goes wrong. The core issue seems to be an oversimplification of what superrationality actually requires. The argument completely relies on physical identity or copying, but superrationality is more about logical correlation through shared reasoning or decision procedures. Physical copying is sufficient but not necessary for the correlation that EDT exploits.

  The user's claim that "against any opponent" one should cooperate is problematic because the opponent's reasoning method matters critically. Against a known causal decision theorist (who will defect regardless), cooperating would be disastrous. The correlation exists only if both players are using the same reasoning method that produces coordinated outputs.

  For the single-implementation variant (where only one player's move is implemented), the user claims randomization isn't needed, but this seems incorrect. If all players are identical and deterministic, they'd all attempt to act or not act in the same way, which would either cause no action (if all abstain) or conflict (if all try to act). Randomization breaks this symmetry and allows a solution where each player has some probability of acting.

  Regarding the Kantian gloss: While there's a similarity in universalizing one's decision, Kant's imperative is deontological (about moral duty), while superrationality is about instrumental rationality and maximizing utility given logical correlations. They're structurally analogous but philosophically distinct.

  For CDT: The one-shot PD against a copy doesn't refute CDT; it reveals CDT's limitation in handling logical correlations. CDT correctly maximizes utility when causation is the only consideration, but fails in cases where decisions are logically entangled.

  I'll organize my response by identifying specific failed steps in their reconstruction, explaining what superrationality actually relies on (logical correlation rather than physical copying), providing a case-by-case analysis, clarifying the CDT situation, addressing the Kant comparison, suggesting a safe slide claim, and noting open questions about the boundaries of logical correlation and practical implementation.

  The JSON structure they requested will contain: failed steps with corrections, characterization of superrationality, case table with recommendations, CDT status, Kant gloss assessment, a safe slide claim, and open questions. This should give them a comprehensive critique while respecting their expertise and pedagogical needs.
answer: |-
  Your reconstruction contains insightful connections but overgeneralizes key aspects. Below is a point-by-point critique followed by the requested JSON. The core flaw is conflating *physical identity* with *logical correlation in reasoning*, which weakens several claims.

  ### Critiques
  1. **"Microphysics guarantees correlation" overextends**:  
     - **Your claim**: Physical identity ensures decision correlation, making EDT trivially apply.  
     - **Why it fails**: Superrationality relies on *logical* correlation of outputs from identical *decision procedures*, not physical microstates. If players use different algorithms (e.g., CDT vs. FDT), identical inputs need not yield identical outputs. Physical copying is sufficient but not necessary; logical symmetry (e.g., shared source code) suffices.  
     - **Correction**: Emphasize that correlation stems from shared reasoning *rules*, not atoms. Players must recognize they are *algorithmically identical*, not just physically identical.

  2. **"Against any opponent" is incorrect**:  
     - **Your claim**: Cooperation is rational against *any* opponent since correlation is guaranteed.  
     - **Why it fails**: Correlation exists *only* if the opponent reasons identically. Against a CDT player (who defects unconditionally), cooperating yields the sucker's payoff. Superrationality presumes mutual recognition of shared rationality.  
     - **Correction**: Cooperation is rational only against players using the *same* decision theory (e.g., both superrational/FDT). Against known CDT players, defection dominates.

  3. **"Single-implementation variant has the same structure" misses symmetry-breaking**:  
     - **Your claim**: Randomized strategies are unnecessary; correlation alone ensures cooperation.  
     - **Why it fails**: If all players deterministically decide to act (or not), they all act (or none do), violating the "exactly one acts" condition. Randomization breaks symmetry: each player cooperates by *probabilistically* abstaining to allow exactly one action.  
     - **Correction**: Pure cooperation fails; randomized strategies (e.g., each acts with probability \( \frac{1}{n} \)) are essential to satisfy the constraint.

  4. **Kantian gloss conflates rationality with morality**:  
     - **Your claim**: Superrationality = Categorical Imperative + payoffs.  
     - **Why it oversimplifies**: Universalization in Kant is deontological (duty-based), while superrationality is instrumental (utility-maximizing). Kant forbids contradiction in maxims; superrationality avoids utility loss from correlated decisions. Both involve universalization, but their mechanisms (moral law vs. logical correlation) differ.  
     - **Correction**: Superrationality is a *structural analogue* of Kantian universalization within rational choice, not a restatement.

  5. **"Refutes CDT" overstates the case**:  
     - **Your claim**: CDT is refuted because it "fails to notice correlation."  
     - **Why it overreaches**: CDT correctly handles causal independence (e.g., against a rock). It fails only in *logically correlated* scenarios (e.g., copies, twin prisoners). This shows CDT's *domain limitation*, not irrationality.  
     - **Correction**: The copy case reveals CDT's incompleteness in presence of logical correlation, not a global refutation. CDT remains valid for causally isolated agents.

