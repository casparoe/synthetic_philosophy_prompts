  Okay, the user is a journalist writing about prestige dramatizations of real lives and exploring the "surrogate-interest view" of ethics in such portrayals. They've outlined several scenarios where fictional elements are introduced into biographical works and want to know what challenges this view, particularly whether considering the person's ante-mortem desires ("prospective-interest move") strengthens the view sufficiently. They're especially concerned about the "undetectable invention" case.

  The user's core argument is that since the dead cannot be harmed, ethical obligations in dramatizing real people are owed only to living stakeholders: descendants, communities, and the public interest in accurate records. But they're questioning this position, particularly through edge cases like fabricating atrocities centuries later, keeping deathbed promises long after witnesses are gone, inventions that no one can detect, and cases involving the last surviving eyewitness.

  The journalist seems intellectually rigorous - they're not satisfied with surface-level ethical discussions and are digging into philosophical nuances. Their personal struggle with the "undetectable invention" case suggests they sense a weakness in their own surrogate-interest framework that can't be easily resolved.

  I should systematically address their requested cases while evaluating whether their "prospective-interest move" (considering the person's pre-death wishes about their legacy) actually solves the ethical dilemmas. The undetectable fabrication scenario is particularly important since it exposes whether harm requires detection to matter.

  The surrogate-interest view likely falters when confronting our intuitions about intrinsic wrongs - like falsely attributing heinous acts to historical figures regardless of contemporary consequences. This reveals we do believe the dead can be wronged in some moral sense, even if not legally. The prospective-interest move helps in cases where explicit wishes were documented, but fails when no such wishes exist or when they conflict with truth itself.

  For the journalist's purposes, they should acknowledge that surrogate-interest explains most practical concerns but can't fully capture why we recoil at certain fabrications. Their prospective-interest angle is valuable but limited - useful when wishes are known, inadequate otherwise. The undetectable invention case remains problematic precisely because it shows ethics can't depend entirely on consequences. This isn't a defect of their view but rather reveals its boundaries; a complete ethical framework needs multiple principles.
answer: |-
  Here's a breakdown of the challenges to the surrogate-interest view, ranked by severity, with analysis of the prospective-interest move and the fate of the undetectable invention case:

  **Ranked Cases Against Surrogate-Interest (Fatal to Awkward):**

  1.  **The Fabricated Atrocity (Fatal Flaw Exposure):**
      *   **Case:** A prestige series pins a horrific, entirely invented crime (e.g., child murder, genocide planning) on a historical figure dead for 300 years. No living descendant cares, the relevant community (if any) is indifferent or benefits from the notoriety, and the public record is so obscure that the fabrication becomes the dominant "truth" for the vast majority.
      *   **Intuition:** This feels *profoundly* wrong. We recoil at the idea of such a monstrous, undeserved stain on someone's name, *regardless* of contemporary consequences. It violates a deep sense of justice and truth concerning the person themselves.
      *   **Challenge:** Surrogate-interest struggles mightily. If no living surrogate *feels* harmed (or even benefits), and the public record is effectively replaced, the view seems forced to concede no wrong was done – a deeply counterintuitive and morally repugnant conclusion. This exposes its potential inability to capture the intrinsic wrong of *defamation of the dead*, independent of current interests.
      *   **Defender's Concession:** A defender *must* concede this case is fatal to a *pure* surrogate-interest view that utterly dismisses any moral status for the dead person *as they were*. It forces an acknowledgment of a "moral remainder" – a wrong done *to the person's memory/reputation itself*, even if no living person suffers.

  2.  **The Undetectable Invention Costing Nothing (You Called It - Major Flaw):**
      *   **Case:** A screenwriter invents a minor, plausible but entirely fictional character flaw (e.g., an irrational fear of spiders, a petty jealousy) for a long-dead historical figure. It serves the narrative, harms no one living (no descendants care, no community is slighted), and is woven so seamlessly that no historian or viewer could ever detect the fabrication.
      *   **Intuition:** Despite the lack of consequence, many feel this *is* wrong. It's a violation of historical truth and the person's actual identity. It treats the dead person as mere raw material, disrespecting their unique reality. It feels like a small act of betrayal.
      *   **Challenge:** This is the ultimate stress test for surrogate-interest's core claim. If *no* surrogate interest is harmed and the inaccuracy is undetectable/costless, the view has *no grounds* to object. Yet, the intuition persists that *something* is amiss – a violation of respect for the *person as they were*, not just their utility to the living.
      *   **Defender's Concession:** A defender *must* concede this is deeply awkward and exposes a significant limitation. While they might argue it's the *least* problematic fabrication (since it causes no harm), they cannot easily dismiss the intuition that it's still *wrong in principle*. Attempting to manage it solely through "public interest in accurate record" feels hollow when the inaccuracy is undetectable.

  3.  **The Deathbed Promise Kept (Serious Challenge):**
      *   **Case:** A dying person extracts a solemn promise from a friend to destroy their private, deeply revealing diaries. The friend does so decades later, long after the diarist, the friend, and all witnesses are dead. A descendant or historian later discovers evidence of the promise and the destruction and condemns it as destroying invaluable historical truth.
      *   **Intuition:** There's strong sympathy for keeping the promise. The dying person's autonomy and expressed wish feel paramount, even centuries later. The destruction feels justified out of respect for *that person's* specific, ante-mortem desire, outweighing the abstract historical loss.
      *   **Challenge:** Surrogate-interest, focused *only* on the living (the descendant/historian/public wanting the record), would likely condemn the destruction as harming their interests. But this clashes with the intuition that the promise-keeper acted rightly *because* they respected the *dead person's* specific wish. Prioritizing the living surrogate's interest here seems to disrespect the originating person's autonomy.
      *   **Defender's Concession:** A defender should concede this challenges the *exclusivity* of surrogate-interest. While they might argue the *public's* interest in historical truth could *outweigh* a specific promise in some cases, they must acknowledge that the dead person's *own expressed wish* carries significant moral weight that surrogate-interest struggles to fully account for without the prospective move.

  4.  **The Last Surviving Eyewitness (Awkward Fit):**
      *   **Case:** A docudrama significantly fabricates events involving a recently deceased figure. While descendants exist, the *only* person who witnessed the actual events and could directly refute the fabrication has just died. The fabrication causes distress to descendants and perhaps misleads the public.
      *   **Intuition:** The fabrication feels wrong. We worry about misleading the public and causing distress to the family.
      *   **Challenge:** Surrogate-interest handles this relatively well! The distress to descendants is a clear harm to living surrogates. The potential damage to the public record is a harm to the public's interest. The death of the last eyewitness doesn't *eliminate* surrogate interests; it just makes verification harder. The wrong here is readily explained by harm to the living.
      *   **Defender's Concession:** Minimal. This case fits the surrogate-interest model quite comfortably. The defender might note the *ease* with which harm occurs due to the lack of counter-evidence, but the *basis* for the wrong is firmly within surrogate concerns.

  **Analysis of the Prospective-Interest Move:**

  You're absolutely right to identify this as the key defensive maneuver. Incorporating the dead person's *ante-mortem desires* about their post-mortem portrayal (their "prospective interests") significantly strengthens surrogate-interest against several challenges:

  1.  **Addresses the Deathbed Promise:** It directly justifies keeping the promise – you are respecting the *person's own forward-looking wish*. Surrogate-interest alone couldn't do this without the prospective layer.
  2.  **Addresses Fabricated Atrocity/Undetectable Invention (Partially):** We can argue that *most people* possess a fundamental ante-mortem desire not to be falsely remembered as monstrous or misrepresented, even in minor ways. Respecting this general prospective interest explains the wrong in these cases as a violation of the *person's own likely or expressed wish* about their legacy.
  3.  **Provides Deeper Justification:** Even in cases where surrogates *are* harmed (like the Last Eyewitness), the prospective move adds another layer: the harm to descendants is *also* a violation of the deceased's likely desire for their family not to suffer distress due to falsehoods about them.

  **Has the Prospective-Interest Move Insulated the View Past the Point of Risk?**

  *   **No, it hasn't eliminated risk, but it has transformed the view.** A pure surrogate-interest view (only living stakeholders matter) *is* fatally wounded by cases like the Fabricated Atrocity and deeply troubled by the Undetectable Invention. The prospective-interest move rescues it from incoherence in these cases by grounding obligations in the *past person's own interests*.
  *   **What emerges is a Hybrid View:** The core ethical obligations involve:
      *   Respecting the deceased's ante-mortem prospective interests (especially regarding reputation, privacy, and legacy).
      *   Minimizing harm to living surrogates (descendants, communities).
      *   Serving the public interest in historical understanding and truth.
  *   **Is this a defect or simply a careful statement?** This is **what a true view looks like once stated carefully.** The pure surrogate view was an oversimplification. Recognizing prospective interests acknowledges that the *source* of some of our most important obligations *concerning* the dead flows from the *person they were* and the interests they held *while alive* that extend beyond death. We respect *them*, *through* respecting those interests and *through* considering the impact on the living connected to them or reliant on an accurate record of them.
  *   **The Undetectable Invention Revisited:** Even with the prospective move, this case remains potent. Does respecting the person's *likely* desire not to be misrepresented matter *if no one ever knows*? The prospective move says *yes* – the violation is inherent in the act of misrepresentation, regardless of discovery. It becomes a matter of *integrity* (the filmmaker's, the historical record's) and *respect* for the person's unique reality. While the *harm* might be minimal without detection, the *wrong* (violating the duty of respect based on their prospective interest) persists. A defender *must* bite this bullet: yes, it's still wrong in principle, even if undetectable, because it violates the duty owed to the person's memory based on their (presumed) ante-mortem interest.

  **Conclusion:**

  The surrogate-interest view, in its pure form, fails against strong intuitions about defamation of the dead and respect for ante-mortem wishes. Your "prospective-interest move" is essential and correct – it transforms the view into a more robust hybrid model. This hybrid view acknowledges obligations grounded in:
  1.  **Respect for the deceased's ante-mortem prospective interests.**
  2.  **Minimizing harm to living surrogates.**
  3.  **Serving the legitimate public interest.**

  The Fabricated Atrocity and Deathbed Promise cases force this hybrid view. The Undetectable Invention case remains its sharpest challenge, exposing that the core wrong lies in the *violation of respect for the person's identity and legacy* based on their prospective interests, even when consequences are absent. This isn't a defect of the *hybrid* view; it's the view revealing that ethics concerning the dead involves duties of fidelity and respect that transcend immediate consequences for the living. A defender must concede that the Undetectable Invention is still wrong in principle, precisely *because* it violates the duty to respect the deceased person's prospective interest in a truthful representation of their life.
