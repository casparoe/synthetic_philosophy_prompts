  Alright, I need to evaluate this student's answer for an upper-level moral philosophy exam. The question is about standing to blame, specifically the Fairness View and Relationship View. The student's response needs to be marked out of 20 with detailed feedback on parts (a), (b), and (c). 

  First, I'll review the student's answer for part (a). They distinguish two complaints: unfairness/disrespect and defective expression of judgment. The student correctly identifies the first as about the blamer's exemption from the norm, which aligns with the Fairness View. The second complaint focuses on sincerity, which relates to whether the blame genuinely expresses a belief in the norm. This is accurate, but the student should clarify that "defective expression" specifically concerns insincerity rather than other defects. 

  Moving to part (b), the student correctly states that standing and wrongness are independent. Their point that B's objection doesn't affect the wrongness of the act is spot-on. However, they miss an opportunity to explicitly mention that standing is about the blamer's normative position, not the act's wrongness. A stronger answer would emphasize this distinction more clearly.

  For part (c), the Confessor case is handled well. The student rightly concludes she has standing under both views because she's consistent and sincere. But the student oversimplifies by claiming sincerity is "what standing requires," ignoring that the Fairness View focuses on fairness, not sincerity. The student also incorrectly states that the Relationship View reaches the same verdict as the Fairness View here, but actually, the Relationship View might still deny standing due to damaged relationships regardless of sincerity. 

  The student's analysis of the ordinary hypocrite is strong, correctly applying both views. However, they conflate the Fairness View's fairness requirement with sincerity when discussing the Confessor. The tu quoque fallacy point is valid but doesn't fully address the Relationship View's potential objections. 

  Key issues to note: In part (a), the student needs precision on "defective expression" being specifically about insincerity. In part (b), they should explicitly separate standing from wrongness. For part (c), the Fairness View application to the Confessor is correct, but the Relationship View analysis is flawed—it could still deny standing based on relationship damage. The student also misses that B might still claim unfairness under the Relationship View even with a sincere Confessor. 

  Overall, the answer shows good understanding but has significant gaps in part (c) regarding the Relationship View and occasional imprecision. The mark should reflect strengths in parts (a) and (b) but deductions for oversights in (c).
answer: |-
  ### Mark: 14/20  

  #### Comments on Part (a):  
  **What is correct:**  
  - You accurately distinguish the two complaints by their objects: one targeting the *unfairness* of the blame as a demand (aligned with the Fairness View), the other its *defectiveness as an expression of judgment* (focused on insincerity/hypocrisy).  
  - Linking the first complaint to self-exemption from the norm and the second to the blamer’s conduct undermining their expressed judgment is sound.  

  **Imprecisions/gaps:**  
  - Your claim that the second complaint concerns whether blame "really expresses the judgment it *appears* to express" is correct but could be sharper. A fully precise answer would clarify that this complaint specifically alleges *insincerity*: the blamer’s conduct implies they do not *believe* the norm they invoke, rendering their blame defective *as a moral expression*.  
  - **Crucial omission:** You do not explicitly tie the second complaint to the broader idea of *hypocrisy* (invoking a norm one does not sincerely hold), which is central to the question. The conclusion follows, but the reasoning lacks this key term.  

  #### Comments on Part (b):  
  **What is correct:**  
  - You rightly assert that standing and wrongness are independent: B’s objection targets A’s *authority* to blame, not the *wrongness* of B’s act.  
  - The inference that B’s objection "shows nothing at all about whether his promise-breaking was wrong" is logically sound and well-defended.  

  **Imprecisions/gaps:**  
  - Your explanation that standing concerns the blamer’s "normative situation" (i.e., their position to make demands) is apt but underdeveloped. A top-tier answer would emphasise that standing is *not about the truth of the blame* but about the blamer’s *right to hold the target accountable*. Your conclusion follows, but the reasoning needs this nuance.  
  - **Key omission:** You should explicitly distinguish *standing* (a precondition for *voicing* blame) from *wrongness* (a property of the *act*). B’s objection leaves the wrongness of his act untouched.  

  #### Comments on Part (c):  
  **What is correct:**  
  - You correctly conclude the Confessor has standing under the Fairness View, as she applies the norm consistently to herself.  
  - Identifying the *tu quoque* fallacy (B’s "you did it too" retort) as irrelevant to the act’s wrongness is valid.  
  - Your analysis of the ordinary hypocrite is strong: you neatly explain why they lack standing under both views (Fairness: unwillingness to self-apply norms; Relationship: damaged trust).  

  **Imprecisions/gaps:**  
  - **Misstep on the Relationship View:** You claim the Relationship View "reaches the same verdict" (i.e., denies standing to the hypocrite *and grants it to the Confessor*). This is incorrect. The Relationship View *could* deny the Confessor standing *even if she is sincere*, as her prior promise-breaking may have damaged the relationship (e.g., eroded trust or authority). Your inference here does not follow; the two views *diverge* in this case.  
  - **Overlooking B’s complaints:** You state B’s objection to the Confessor "fails entirely", but under the Relationship View, B *could* still complain that blame is *unfair/disrespectful* due to the damaged relationship (part (a)’s first complaint). You conflate the two complaints by reducing B’s objection to *tu quoque*.  
  - **Conflation of concepts:** You assert "sincerity is what standing requires", but this is true *only* for the insincerity complaint (part (a)’s second issue). The Fairness View requires *willingness to accept the norm’s application to oneself*, which is distinct from sincerity (one could sincerely believe a norm but still resent its application to oneself). The Confessor meets both, but the concepts are not interchangeable.  

  ### Overall Summary:  
  The answer demonstrates a good grasp of the core concepts (especially in parts (a) and (b)) and strong analysis of ordinary hypocrisy, but it falters in part (c) by misapplying the Relationship View to the Confessor and conflating distinct complaints.
