prompt: |-
  So, slightly weird situation: last year my partner and I moved to Budapest because her mum got sick, and since I needed something to do I ended up doing the numbers for a tiny rule-of-law watchdog here (my degree is in statistics, not politics, so I am defintely making a lot of this up as I go). We publish an annual early-warning score for a handful of countries in the region, and now that it is actually getting quoted by journalists and one ratings agency I have started worrying that I don't know what the thing I built is even claiming.

  Roughly how it works, so you don't have to guess. We score governments on things like: the share of legislation passed under fast-track or emergency procedures that skip committee review; how often the head of an independent agency or court is replaced before their term expires, especially when the replacement then gets a fresh full term instead of just the remainder; new rules that move something out of ordinary statute into the constitution or otherwise require a supermajority to undo; the split of public-media airtime between government and opposition; and any change to electoral law in the twelve months before a vote. Two design choices are mine and I'm not sure I can defend them. First, a ratchet: the score can basically only get worse. If a government repeals something we flagged, we stop adding points but we don't hand back the ones already on the board. Second, a change passed with opposition support is discounted heavily, almost to zero, while the same change forced through on party lines counts at full weight.

  The puzzle for me is that my father-in-law, who votes Fidesz and is otherwise a perfectly reasonable person, says: we won, twice with a two-thirds majority, we get to govern, and you've just built a spreadsheet that says sore losers are right. And he has a point I can't shake: every government in Europe used emergency fast-track during covid, a new government with a big mandate is supposed to pass a lot quickly, and most of what we flag was approved by voters and was legal when it passed. So I have three connected questions.

  One: what view of democracy does this practice actually presuppose? My best guess is that it isn't measuring how democratic a decision was, it's measuring whether incumbents are reducing the chance they can lose the next one — that democracy is a repeated contest, not a single mandate. But is that the only theory that fits, or could someone with a purely majoritarian view endorse the same indicators for instrumental reasons? I want to know which bits of the score strictly require the anti-majoritarian commitment and which bits are underdetermined by it, i.e. which parts several rival theories would happily license.

  Two: the ratchet and the aggregation. Does refusing to give points back presuppose something substantive — that institutional trust or a habit of restraint is easier to destroy than to rebuild — or is it just institutional caution dressed up as measurement? And is there an argument that it makes the score unfalsifiable, since no country can ever get better? Separately, we boil down cases that seem to fail in completely different ways — legal entrenchment here, court capture in Poland, emergency rule plus jailing rivals in Turkey, mostly subnational election administration and just norms in the US — into one number. Does producing a single score commit us to those failures being commensurable, or is that just convenient and we should be publishing a dashboard instead?

  Three, and this is the one that keeps me up: who decides? Most of our indicators need a judgment call — was this fast-track urgency or abuse? — and my colleagues are pretty open that they already know which governments are the bad ones. So is backsliding more than a partisan label here? What non-circular test could distinguish our number from a vibe: something the concept predicts that isn't just a restatement of what we already counted? And does it matter that in the US case almost nothing we flag is a change in formal law at all — does the practice presuppose that democracy is a property of a whole system including unwritten norms and subnational units, rather than of statutes?

  Also worth saying: individually, nearly every step we flag is legal and would be unobjectionable on its own, and it's only the sequence we call backsliding. Does that mean the concept applies to sequences in a way it doesn't apply to the individual acts, like a heap, or is there a way to locate the wrongness in the steps after all?

  I'd like: the implicit theory reconstructed, then the strict-presupposition vs merely-goes-well-with distinction, then where we're philosophically underdetermined, then what would concretely have to change in the score if we swapped in each rival view you name. Plain language please, no citations needed, and end with a one-sentence bottom line followed by a last line in fixed form: \answer{...} containing a two- or three-word label — something like strictly anti-majoritarian, compatible with several views, or just politics with numbers — as your verdict on what our score commits us to.
reasoning: |-
  Okay, let me unpack this query. The user is running a rule-of-law scoring system in Budapest and wrestling with fundamental questions about its theoretical foundations. Their background in statistics rather than political science adds a layer of complexity - they're deep in operationalization but questioning the philosophical bedrock. 

  First, I need to reconstruct the implicit theory of democracy in their methodology. The ratchet mechanism and opposition-discounting clearly prioritize institutional durability over majoritarian efficiency. But I should distinguish what strictly requires anti-majoritarian premises versus what instrumentalists might accept. For example, even a pure majoritarian might worry about future election fairness, but the ratchet's irreversibility seems harder for them to swallow.

  The aggregation question feels urgent - collapsing diverse institutional harms into one number risks false equivalence. Maybe they need to clarify whether their score represents democratic health (dashboard better) or threat level (single number defensible). The unfalsifiability critique is real but could be mitigated by adding recovery indicators.

  On the "who decides" dilemma: their colleagues' pre-judgments worry them. The test I'm considering is whether their concept predicts downstream consequences beyond their own indicators - say, accelerated decline in Freedom House scores. The US norms-versus-laws tension reveals their model assumes democracy lives in practices, not just statutes.

  For the sequence-versus-acts puzzle, I recall Tábor's work on "death by a thousand cuts" - the wrongness emerges cumulatively. But they should acknowledge this makes counterfactuals harder.

  When structuring the response, I'll:
  - Start with theory reconstruction
  - Map presuppositions versus compatibilities
  - Flag underdetermined areas
  - Show concrete score modifications for rival views

  The bottom line needs to capture their model's core commitment: institutional insurance against majority power. The fixed answer should crystallize this - maybe "institutional insurance model"?
answer: |-
  Here's the implicit theory, the fault lines between commitments, and what's flexible:

  ### 1. **Core Theory of Democracy Presupposed**  
  Your score presupposes democracy as a **self-limiting system**. It’s not just about winning elections *now*; it’s about preserving the *future* capacity for opposition to win, govern, and reverse policies. The ratchet, opposition discount, and focus on entrenchment all treat democracy as a **repeated game with institutional guardrails**.  

  - **Anti-majoritarian commitment is strict** for:  
    - **The ratchet**: Assumes norms/institutions degrade faster than they heal (e.g., trust in courts). Reversing a bad law doesn’t erase its corrosive effect.  
    - **Opposition discount**: Assumes cross-partisan support legitimizes changes; solo actions risk exploiting temporary power to bind future majorities.  
  - **Compatible with instrumental majoritarianism** for:  
    - **Flagging fast-tracking or term cuts**: A majoritarian could agree these *might* signal power concentration, but only if abused *repeatedly*. They’d reject penalizing a one-off emergency action.  

  ### 2. **Ratchet & Aggregation: Substance vs. Convenience**  
  - **Ratchet**: Embeds a **substantive claim**: democratic backsliding causes *asymmetric damage* (like breaking a vase). It’s not just caution—it assumes restoring norms requires more effort/legitimacy than destroying them.  
    - *Falsifiability issue*: Yes, the score can’t show improvement. Fix: Add a parallel "recovery index" tracking restorations (e.g., opposition veto rights reinstated).  
  - **Single score**: **Commits to commensurability** by design. You’re claiming that capturing a court in Poland *equates* to norm erosion in the US for predicting systemic risk.  
    - *Alternative*: A dashboard (e.g., separate scores for judicial independence, electoral fairness) would avoid this but lose the "early-warning" simplicity.  

  ### 3. **Who Decides? Circularity & Norms**  
  - **Judgment calls**: Require **contextual assessment** (e.g., "Was fast-tracking justified by a real crisis?"). This *isn’t* circular if:  
    - You anchor judgments in **precedent** (e.g., "Historically, similar urgency was debated X days; this skipped debate").  
    - **Non-circular test**: Does your score predict *future* degradation your indicators *don’t* measure? (e.g., declining voter turnout, capital flight). If yes, it’s more than a vibe.  
  - **Unwritten norms (like US)**: Presupposes democracy is **systemic**, not statutory. A constitution alone can’t protect democracy if norms of forbearance (e.g., not gerrymandering ruthlessly) decay.  

  ### **Sequences vs. Acts**  
  Backsliding is **emergent**: Individual acts are legal ("grains of sand"), but the *pattern* ("heap") undermines contestability. The wrongness is in the *cumulative effect*: reducing future opposition’s viable pathways to power.  

  ### **If You Swapped Theories**  
  - **Pure majoritarian view**:  
    - Remove ratchet (allow score improvements).  
    - Weight opposition discount less (governing majorities "own" their mandate).  
    - Only flag post-election law changes if *proven* to target opposition.  
  - **Deliberative democracy view**:  
    - Add public consultation metrics.  
    - Penalize fast-tracking even with opposition support if debate was shallow.  
  - **Minimalist electoral view**:  
    - Ignore norms; focus only on legal barriers to parties/ballot access.  

  ### **Bottom Line**  
  Your score is a gauge of **institutional resilience against power monopolization**, treating democracy as a system that must outlive temporary majorities.  

  \answer{institutional insurance model}
