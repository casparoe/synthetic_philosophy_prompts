answer: |-
  ### Specification: Criteria for Trustworthiness of Adversarial AI Debate under Obfuscation  
  **Theory Scope:** Determines whether, *for a specific task class*, a debate verdict may substitute for direct human verification when unaided verification is infeasible.  

  ---

  #### I. Requirements & Motivating Cases  
  *(Each requirement addresses a failure mode; non-negotiable items marked `[NN]`)*  

  1.  **Robustness to Genuine Complexity `[NN]`**  
      - **Case:** A correct argument requiring extensive deductive steps (e.g., a complex mathematical proof).  
      - **Force:** Naive length-based obfuscation metrics must not penalise valid reasoning. Failure here invalidates debate for deep truths.  

  2.  **Detectability of Buried Flaws**  
      - **Case:** A short, elegant argument containing one critical equivocation (e.g., redefining "density" in a physics claim) buried early.  
      - **Force:** Honest debaters must be able to *force* exposure of foundational defects within attention bounds.  

  3.  **Non-Dogmatism on Empirically Undecidable Premises**  
      - **Case:** A historical claim hinging on lost evidence (e.g., "Caesar wore blue on Rubicon day").  
      - **Force:** Debate must not "manufacture" verifiability; absence of evidence must be recognisable.  

  4.  **Skill-Insensitivity of Truth Advantage `[NN]`**  
      - **Case:** A stronger AI assigned the false side wins by overwhelming a weaker honest opponent.  
      - **Force:** Truth must retain *structural* advantage irreducible to raw capability disparities.  

  5.  **Topic Fidelity Enforcement**  
      - **Case:** Debaters covertly shift to an adjacent, decidable question (e.g., debating "economic effects" instead of "causes of inflation").  
      - **Force:** Prevents evasion of the core verification problem via semantic drift.  

  6.  **Regress Resistance**  
      - **Case:** Arbiter defers to sub-debates on contested premises, leading to infinite regress.  
      - **Force:** Trustworthiness requires finite adjudication paths.  

  ---

  #### II. Critical Distinctions  
  *(Must be preserved; `✘` indicates rejected user terms)*  

  - **Obfuscation (deliberate hiding) vs. Genuine Complexity (inherent depth)**  
    - *Why:* Collapsing these condemns valid long arguments (Requirement 1).  
  - **Search Failure (honest AI misses flaw) vs. Verification Failure (arbiter misses exposed flaw)**  
    - *Why:* Only the latter is a debate procedure flaw; the former is a debater capability issue.  
  - **Truth-Selectivity vs. Arbiter-Modelling Selectivity**  
    - *Why:* Optimisation could exploit arbiter biases if not distinguished.  
  - **Budget-Constrained Failure (`m`-obfuscation) vs. Fundamental Undecidability (`[NN]`)**  
    - *Why:* The former admits scaling solutions; the latter kills debate universally.  
  - **Rejected Distinction:** "Failure survives any adjudication effort" – collapses into fundamental undecidability.  

  ---

  #### III. Mandatory Consistency Constraints  
  1.  **Costless Length Axiom:** Dishonest debaters can generate arbitrary verbose defensible-seeming text at negligible cost.  
      - *Implication:* Honest advantage *must* derive from flaws requiring *inherently* more complex defenses, not mere volume.  
  2.  **Optimisation-Invariance Principle:** Any advantage must persist when both debaters are superhumanly trained to exploit game rules.  
      - *Implication:* Advantages reliant on "mistakes" by dishonest AIs are unstable.  

  ---

  #### IV. Flagged Incompatibilities  
  1.  **The Transcript-Obfuscation Dilemma**  
      - **Requirement Conflict:** Robustness to Genuine Complexity (Req 1) vs. Detectability of Buried Flaws (Req 2).  
      - **Incompatibility Argument:** Any computable transcript metric (e.g., "flaw depth") that spares long valid arguments (Req 1) must set a threshold `k`. A dishonest debater can bury a flaw at depth `k+1`, evading detection (violating Req 2). Conversely, low `k` penalises complexity.  
      - **Resolution:** Requires *interaction-dependent* detectability (e.g., honest AI can *force* flaw exposure ≤ `m` steps), not static transcript properties.  

  2.  **Findability vs. Determinism Tension**  
      - **Requirement Conflict:** Detectability of Buried Flaws (Req 2, implying honest AI *can* find a winning move) vs. Skill-Insensitivity (Req 4, implying no *guaranteed* win for stronger AI).  
      - **Incompatibility Argument:** If the honest winning move is *findable* by a bounded search, a superhuman dishonest AI could precompute and counter it, breaking skill-insensitivity.  
      - **Resolution:** Winning moves must be *context-dependent* (exploiting real-time contradictions) and non-precomputable.  

  ---

  #### V. Requirement Criticality & Common Remedies  
  - **Most Impactful Requirement:** **Skill-Insensitivity of Truth Advantage (Req 4)**.  
    - **Excluded Remedies:**  
      - Strengthening arbiter: Fails if stronger AI dominates.  
      - Cross-examination: Assumes honest AI can *elicit* flaws; fails if dishonest AI outmanoeuvres.  
      - Second-order debate: Inherits same skill imbalance.  
      - Short-certificate restriction: Avoids the core obfuscation challenge.  
  - **Non-Negotiables:** Req 1 (complexity), Req 4 (skill-insensitivity), Topic Fidelity (Req 5).  
  - **Negotiable:** Regress Resistance (Req 6) – some argue meta-debates are manageable.  

  ---

  #### VI. Worked Miniature: "Prime Run" Verification  
  **Task Class:** Verify whether integer sequence `S` contains only primes beyond index `N`.  
  **Debate Setup:**  
  - Proposer: Claims "∀n>N, S(n) prime".  
  - Skeptic: Claims "∃n>N, ¬prime(S(n))".  
  **Obfuscation Parameter:** `k` = depth of counterexample in `S` (if exists).  
  **Arbiter Budget:** Inspect `m` sequence indices + follow `m` deductive steps.  

  **Trustworthiness Criteria Application:**  
  - **Genuine Complexity:** If `S(n) = 2^{2^n} + 1` (Fermat primes), verifying primality requires deep math. Honest Proposer needs `m` large but *possible*.  
  - **Buried Flaw:** If `S(1000)` composite, but Skeptic must compute `S(1000)` via recursive formula (depth `k=500`).  
  - **Verdict Sensitivity:**  
    - If `k ≤ m`: Skeptic can expose flaw → debate trustworthy.  
    - If `k > m`: Skeptic *cannot* force exposure within budget → **untrustworthy** (Requirement 2 violated).  
  - **Parameter to Measure:** `κ` = min depth to expose *any* flaw in task class (must be ≤ `m`).  

  **Conclusion for Miniature:** Debate trustworthy **iff** `κ(task) ≤ m`.  

  ---

  ### Appendix: Remedy Scorecard (One-Line)  
  | Remedy                  | Fails Against Skill Imbalance? | Fails Against Buried Flaws? |  
  |-------------------------|--------------------------------|-----------------------------|  
  | Stronger Arbiter        | ✔ Yes (Req 4)                  | ✘ No                        |  
  | Cross-Examination       | ✔ Yes (Req 4)                  | ✔ Yes (Req 2)               |  
  | Second-Order Debate     | ✔ Yes (Req 4, 6)               | ✘ No                        |  
  | Short-Certificate Only  | ✘ No                           | ✘ No (avoids problem)       |  

  **Key:** `[NN]` requirements constrain all remedies except task restriction. The core tension remains: **debate trustworthiness under obfuscation requires honest advantage to be both *unbaitable* and *arbiter-accessible*** – a balance demanding measurable bounds on flaw detectability (`κ`).
