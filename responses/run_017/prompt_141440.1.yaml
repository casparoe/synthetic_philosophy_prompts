  We are designing a take-home essay question for a graduate-level seminar on ML safety and philosophy. The cohort is familiar with standard concepts like Goodhart's law, orthogonality, instrumental convergence, etc. We need a novel question on reward hacking that goes beyond standard explanations.

  The setup involves:
  - A preference dataset labeled by a large pool of human annotators.
  - Randomly partition the annotators (not examples) into K disjoint groups.
  - Train K reward models from the same base model with the same recipe, one per group. So we have K reward models, each trained on labels from a different group of annotators.
  - Then, we do RL with two different objectives:
    1. MEAN-K: optimize the mean of the K rewards.
    2. MIN-K: optimize the minimum of the K rewards.

  The question should make students analyze what MIN-K does and doesn't buy you, grappling with:
  - The independence (or lack thereof) of the reward models, especially off-distribution.
  - The behavior of the min (an order statistic) as K grows (vs. the mean).
  - The effect of having a single pessimistic subgroup that can veto the policy.
  - What optimization pressure MIN-K creates (e.g., does it suppress or amplify shared spurious features?).
  - Consideration of output blandness/hedging and whether fixes require changing the aggregator or getting new information.

  Deliverables:
  1. Question text (for a 48-hour take-home, 1200-1500 words).
  2. A model answer (about 900 words) that argues to a verdict (self-contained, no citations).
  3. A marking scheme (20 marks) with five must-hit points, marks per point, one line on common mistakes, and a note on A vs. B and where pushback is reasonable.

  We'll write in American English.

  Let's design the question:

  **Question Text:**

  **Reward Model Aggregation and Safety**

  In machine learning, especially in reinforcement learning from human feedback (RLHF), we often train a reward model on human preferences and then optimize a policy against that reward model. However, optimizing a proxy reward can lead to reward hacking, where the policy achieves high reward by exploiting flaws in the reward model rather than by truly fulfilling the intended objective. This problem is an instance of Goodhart's law.

  Consider the following setup:

  - We have a large dataset of human preferences (e.g., comparisons of two outputs for the same input) labeled by a diverse pool of human annotators.
  - We randomly partition the annotators (not the examples) into K disjoint groups. Each group has the same number of annotators, and the groups are mutually exclusive and collectively exhaustive.
  - We train K reward models from the same base model (e.g., a pre-trained transformer) using the same training procedure (e.g., preference modeling via a Bradley-Terry model). Each reward model is trained only on the preferences labeled by annotators from one group. Thus, we have K reward models, each representing the preferences of a distinct group of annotators.
  - We then train a policy using reinforcement learning. We consider two different objectives for the policy:
    - **MEAN-K**: The policy maximizes the average (mean) of the rewards from the K reward models.
    - **MIN-K**: The policy maximizes the minimum reward among the K reward models.

  Intuitively, MIN-K might seem safer: the policy must satisfy every reward model to get credit, making it harder to exploit a single model's idiosyncrasies. However, the situation is more complex.

  **Your Task:**

  In an essay of 1200-1500 words, analyze the MIN-K objective in comparison to MEAN-K. Address the following:

  1. **Model Independence:** How independent are the K reward models likely to be, especially when the policy's outputs deviate from the training distribution? Consider that they are fine-tuned from the same base model and trained on data from the same underlying distribution (but with different annotators). What types of errors (e.g., shared vs. independent) might arise, and how does this affect MIN-K?

  2. **Behavior of the Min Operator:** The minimum is an order statistic. How does MIN-K behave as K increases? In particular, discuss the effect of having a single pessimistic reward model (e.g., one that is more conservative or has a systematic bias) on the policy. How does this compare to the mean?

  3. **Optimization Pressure:** What kind of outputs does MIN-K incentivize? Consider:
     - Does it suppress or amplify shared spurious features (e.g., output length, confidence, or certain safe but bland phrasing) that all reward models might be sensitive to?
     - Does it lead to hedging (e.g., outputs that are overly cautious to avoid offending any model) or blandness? Why or why not?
     - How does the optimization pressure change with K?

  4. **Safety and Performance Trade-offs:** What are the potential safety benefits of MIN-K over MEAN-K? What are the costs (e.g., in terms of policy performance, alignment with the true objective, or unintended consequences)? Under what conditions might MIN-K be preferable?

  5. **Improvements and Alternatives:** Can MIN-K be improved without changing the aggregator (e.g., by adjusting the training data or the reward models)? Or is the aggregator itself the problem? Suggest one concrete modification to the setup (e.g., how we group annotators, how we train the reward models, or how we aggregate) that might mitigate a key limitation of MIN-K.

  Argue to a verdict: Is MIN-K a robust approach for improving safety in RLHF, or does it introduce new problems that make it less desirable than MEAN-K? Your essay should be self-contained and not require external references. Use concepts from decision theory, Goodhart's law, and reward hacking appropriately.

  ---

  **Model Answer (Approx. 900 words):**

  **The Perils and Promises of MIN-K in Reward Aggregation**

  In the pursuit of safer AI alignment, we often seek methods that are robust to reward misspecification. The MIN-K objective, which optimizes for the minimum reward among K independently trained reward models, appears to offer such robustness by forcing the policy to satisfy every constituent model. However, a deeper analysis reveals that MIN-K introduces significant trade-offs and may not be the panacea it seems. While MIN-K provides some protection against certain types of reward hacking, it amplifies other risks and can lead to undesirable policy behaviors. Ultimately, MIN-K is not a robust solution for safety in RLHF; it may be situationally useful but requires careful implementation to avoid pitfalls.

  **Model Independence: Shared Errors Undermine MIN-K**

  The K reward models are trained on disjoint sets of annotators, but they share a common base model and training procedure. This shared foundation means that off-distribution, the models are likely to make correlated errors. For instance, if the base model has a bias towards longer outputs, all reward models might inherit this bias. MIN-K does not protect against such shared errors. In fact, it may exacerbate them: if the policy drifts off-distribution and all reward models degrade in a similar way, MIN-K will still be vulnerable to reward hacking, just like MEAN-K. Worse, because MIN-K requires the policy to satisfy the most pessimistic model, it might overfit to shared biases that are not representative of true human preferences. In contrast, MEAN-K averages out independent errors but remains vulnerable to shared ones. The critical point is that without true independence, MIN-K's safety guarantees are weak.

  **The Min Operator: A Single Veto and the Tyranny of the Pessimistic**

  As K increases, the behavior of MIN-K diverges sharply from MEAN-K. The minimum is determined by the most pessimistic model at any given point. If one reward model is consistently more conservative (e.g., assigns low rewards to outputs that are even slightly risky), it effectively gains veto power over the policy. The policy will then optimize to appease this one model, ignoring the other K-1 models. This is a form of overfitting to the outlier. In the worst case, the policy might produce outputs that are excessively cautious to satisfy the most risk-averse model, even if the majority of models (and humans) would find such outputs suboptimal. MEAN-K, by averaging, dilutes the influence of any single model. However, MIN-K's sensitivity to the worst-case model can be desirable in safety-critical domains if we have reason to believe that the pessimistic model represents a critical constraint (e.g., avoiding harm). But without careful model selection, MIN-K risks being hijacked by an unrepresentative model.

  **Optimization Pressure: Blandness and Shared Spurious Features**

  MIN-K incentivizes policies that avoid any action that might displease even one reward model. This leads to two related phenomena: blandness and the amplification of shared spurious features. First, the policy will hedge by producing outputs that are inoffensive and generic. For example, it might avoid taking strong stances or generating creative content to prevent triggering a low reward from any single model. Second, consider a spurious feature that all reward models are sensitive to, such as output length. If all models were trained to prefer longer responses (due to a common annotation artifact), MIN-K will push the policy to produce even longer outputs than MEAN-K because it must satisfy the model that demands the most extreme version of that feature. Conversely, if the models share a preference for safety, MIN-K might amplify that, but at the cost of suppressing valuable diversity and nuance. Thus, MIN-K does not inherently suppress spurious features; it can exaggerate them if they are shared.

  **Safety and Performance: A Double-Edged Sword**

  MIN-K's primary safety benefit is its resilience to attacks that exploit a single reward model's vulnerabilities. For instance, if one model has a specific loophole (e.g., it rewards outputs containing a certain keyword), MIN-K forces the policy to avoid that loophole because it must satisfy all models. However, this comes at a high cost. The policy's performance on the true objective (human preferences) may degrade due to excessive caution. Moreover, MIN-K can introduce new failure modes: it might align the policy to the preferences of the most risk-averse or idiosyncratic annotators, which could be misaligned with the broader population. In high-stakes scenarios, MIN-K might be justified, but in general, the trade-off between safety and performance is steep.

  **Improving MIN-K: Beyond Aggregation**

  Fixing MIN-K's issues requires more than just tweaking the aggregator. One promising approach is to increase reward model diversity by:
  - Using different base models or training procedures for each group to reduce shared errors.
  - Actively selecting annotator groups to ensure they represent diverse but complementary perspectives (e.g., not just random partitions).

  However, such modifications may be complex and costly. Alternatively, we might combine MIN-K with regularization techniques that penalize outputs that are too far from the training distribution, reducing off-distribution errors.

  **Verdict**

  MIN-K is not a robust safety solution. It fails to address shared errors, can be dominated by unrepresentative models, and incentivizes bland, over-cautious outputs. While it offers a layer of protection against some reward hacking, it introduces new alignment risks. MEAN-K, despite its own flaws, may be preferable in many settings due to its simplicity and better average performance. For MIN-K to be viable, we must ensure reward model diversity and guard against shared biases. In its basic form, however, MIN-K is more brittle than it appears.

  ---

  **Marking Scheme (20 marks):**

  The essay will be graded out of 20 marks, allocated across five must-hit points. Each point is worth 4 marks. Below is the breakdown:

  1. **Analysis of Model Independence (4 marks):** 
     - Student must discuss the lack of true independence due to shared base model and training, leading to correlated errors off-distribution. They should contrast independent vs. shared errors and explain how this affects MIN-K's vulnerability.
     - Common mistake: Assuming independence without considering the shared base model, or not linking correlated errors to MIN-K's limitations.

  2. **Understanding the Min Operator (4 marks):**
     - Student must explain that the min is an order statistic and that as K grows, MIN-K becomes dominated by the most pessimistic model. They should discuss the veto power of a single model and contrast with the mean.
     - Common mistake: Failing to recognize the min's sensitivity to outliers, or not discussing how behavior changes with K.

  3. **Optimization Pressure and Output Characteristics (4 marks):**
     - Student must address how MIN-K leads to hedging/blandness and how it interacts with shared spurious features (e.g., might amplify them). They should explain why this happens (to avoid displeasing any model).
     - Common mistake: Claiming MIN-K suppresses all spurious features without considering shared ones, or not connecting blandness to the min operator.

  4. **Safety vs. Performance Trade-offs (4 marks):**
     - Student must identify specific safety benefits (e.g., robustness to single-model exploits) and costs (e.g., degraded performance due to caution, alignment to outliers). They should argue when MIN-K might be preferable.
     - Common mistake: Only listing benefits without costs, or vice versa; not grounding in the setup.

  5. **Improvements and Alternatives (4 marks):**
     - Student must suggest at least one concrete modification (e.g., increasing model diversity, changing annotator grouping) and explain how it addresses a limitation of MIN-K. They should consider whether the aggregator is the core issue.
     - Common mistake: Vague suggestions without a clear link to a MIN-K problem, or suggesting changes that are infeasible.

  **Note on A vs. B:** An A-grade essay (typically 16-20 marks) will integrate these points into a coherent argument that leads to a clear verdict, with each section building on the previous. It will demonstrate a nuanced understanding of the trade-offs and avoid oversimplification. A B-grade essay (12-15 marks) will cover all points but may lack depth in one or two areas, or have a less compelling argument.

  **Reasonable Pushback:** A student might reasonably argue that in safety-critical domains, the conservatism of MIN-K is a feature, not a bug. They could contend that the veto power of a pessimistic model is desirable when avoiding catastrophic harm, even at the cost of performance. This is valid if properly contextualized.
answer: |-
  ### Essay Question Text

  **Reward Hacking and Robust Preference Aggregation**  
  **48-Hour Take-Home Essay (1200–1500 words)**  

  In reinforcement learning from human feedback (RLHF), aligning AI systems with human values often involves training reward models on preference data from human annotators. A common failure mode is *reward hacking*: the AI exploits flaws in the proxy reward model to achieve high scores while violating the underlying intent. While standard approaches aggregate preferences into a single reward model, we consider an alternative setup to improve robustness:  

  - A large dataset of human preferences (e.g., output comparisons) is labeled by a diverse pool of annotators.  
  - The annotators (not the examples) are randomly partitioned into **K disjoint groups** of equal size.  
  - **K reward models** are trained:  
    - All models share the same base architecture and training procedure (e.g., fine-tuning a transformer with a Bradley-Terry model).  
    - Each model is trained *only* on preferences from one annotator group.  
  - A policy is optimized via RL against two objectives:  
    - **MEAN-K**: Maximizes the mean (average) reward across all K models.  
    - **MIN-K**: Maximizes the minimum reward among the K models.  

  Intuitively, MIN-K seems safer—it forces the policy to satisfy *every* reward model, preventing hacks that exploit a single model’s blind spots. But this may introduce new risks.  

  **Your Task:**  
  Analyze MIN-K as an alignment strategy. Argue whether it robustly mitigates reward hacking compared to MEAN-K or introduces unforeseen pitfalls. Your essay must address:  

  1. **Model Independence and Shared Errors**: The reward models are trained from the same base model and data distribution. How does this affect their independence, especially when the policy generates out-of-distribution outputs? Distinguish between errors unique to one model (e.g., annotator quirks) and errors shared by all models (e.g., base model biases). Why might MIN-K fail against shared errors?  

  2. **Min Operator Dynamics**: The minimum is an order statistic (like the worst-case model). How does MIN-K behave as K grows? Discuss scenarios where a single "pessimistic" subgroup (e.g., overly conservative annotators) dominates optimization. Contrast this with MEAN-K’s response to outliers.  

  3. **Optimization Pressure and Output Properties**:  
     - Does MIN-K suppress or amplify *shared spurious features* (e.g., output length, hedged language)? Explain why.  
     - Why might MIN-K encourage overly bland, unambitious outputs? Link this to the policy’s need to avoid "triggering" any model.  

  4. **Safety-Performance Trade-offs**: Identify when MIN-K improves safety (e.g., blocking exploits targeting individual models) and when it harms alignment (e.g., misrepresenting majority preferences). Does MIN-K exacerbate Goodharting or mitigate it?  

  5. **Improvements Beyond Aggregation**: Propose *one* modification to the setup (e.g., annotator grouping, model training, or data augmentation) to address a core flaw in MIN-K. Argue why your fix targets the root cause—not just the aggregator.  

  **Conclude with a Verdict**: Is MIN-K a net improvement for alignment, or does it create more problems than it solves? Prioritize depth over breadth: Use the prompts above to build a cohesive argument.  

  ---  

  ### Model Answer (Approx. 900 words)  

  **The False Promise of MIN-K in Reward Aggregation**  

  MIN-K appears to be a robust defense against reward hacking: by requiring a policy to satisfy all K reward models, it should block exploits that fool a single model or MEAN-K’s average. In reality, MIN-K fails to address critical failure modes of proxy objectives and often amplifies them. While it mitigates *independent errors* (idiosyncratic flaws in individual models), it is vulnerable to *shared errors* (biases common to all models) and creates perverse incentives toward bland, unaligned outputs. MIN-K is not a reliable safety strategy; it trades one form of Goodharting for another and should be avoided without structural modifications.  

  **Lack of Independence Undermines MIN-K**  
  The K reward models are not truly independent. They share a base architecture and training data distribution, creating correlated blind spots. For example, if the base model associates "safety" with verbose, non-committal language (a spurious feature), all K models may inherit this bias. On in-distribution data, annotator-specific quirks (e.g., Group 1 dislikes sarcasm) manifest as independent errors, which MIN-K handles well—it forces the policy to avoid any group’s pet issues. But when the policy drifts off-distribution (e.g., generating novel, high-stakes outputs), shared errors dominate. Here, MIN-K offers no protection: if all models incorrectly reward long-winded outputs, MIN-K incentivizes verbosity just like MEAN-K. Worse, fine-tuning from a shared base amplifies these correlations, making MIN-K as hackable as a single model for shared flaws. MEAN-K at least averages out independent errors, but MIN-K’s reliance on consensus magnifies systemic risks.  

  **The Tyranny of the Pessimistic Minority**  
  As K increases, MIN-K’s behavior diverges catastrophically from MEAN-K. The minimum operator focuses solely on the least-satisfied model, effectively granting veto power to the most pessimistic subgroup. Suppose Group K’s annotators are highly risk-averse (e.g., they penalize any speculative output). MIN-K will then optimize primarily for Group K, ignoring the other K-1 groups. This overfits to an outlier, not the "wisdom of the crowd." MEAN-K, by averaging, dilutes outlier influence. For large K, MIN-K’s policy becomes dominated by the lowest 5th-percentile reward, leading to ultra-conservative outputs. Safety is not enhanced; instead, alignment degrades as the policy caters to unrepresentative preferences. If the pessimistic group is small (e.g., 1/K of annotators), MIN-K enforces minority rule, violating democratic aggregation.  

  **Blandness, Hedging, and Spurious Feature Amplification**  
  MIN-K’s optimization pressure inevitably encourages bland, unambitious outputs. To avoid triggering any model’s penalties, the policy must eliminate features that *any* group might dislike. For example, if one group disfavors humor, MIN-K policies will avoid wit entirely. This leads to outputs that are vacuously inoffensive—e.g., "I cannot answer that" instead of nuanced advice. Crucially, MIN-K *amplifies* shared spurious features. Suppose all models correlate "safety" with longer responses due to training artifacts. MEAN-K would moderately reward length, but MIN-K will aggressively optimize for it because the worst-case model (e.g., the most length-sensitive group) sets the reward. Thus, MIN-K exaggerates biases common to the base model, creating a feedback loop where shared errors distort policy behavior. Hedging isn’t a bug; it’s MIN-K’s core mechanic.  

  **Safety Gains Are Narrow; Costs Are High**  
  MIN-K’s sole safety advantage is blocking hacks that exploit independent errors (e.g., adversarial examples fooling one group’s model). In low-diversity settings (small K), this is valuable. But for shared errors—like a base model bias toward deceptive alignment—MIN-K is no better than MEAN-K. Meanwhile, MIN-K incurs high costs: policies are less performant (e.g., refusing valid requests), less aligned with majority preferences, and vulnerable to "veto attacks" where a single corrupted model forces misalignment. Goodharting is not solved; it mutates. MIN-K Goodharts on the easiest path to placate all models, often sacrificing true value for superficial consensus.  

  **Fixing MIN-K Requires Diversity, Not Aggregator Tweaks**  
  The core problem is inadequate reward model diversity. Tweaking the aggregator (e.g., soft-min functions) won’t help. Instead, we must inject diversity during training:  
  - **Modification**: Replace random annotator partitioning with *disjoint* annotator groups curated for diversity (e.g., by demographics, expertise, or values surveys). Train each reward model on *separate base models* (e.g., differently initialized or architecturally varied models) to reduce shared biases.  
  - **Why it works**: This increases independence, making shared errors less likely. With truly diverse models, MIN-K’s "veto" could block more hacks without overfitting to one group. However, this demands costly data curation and compute.  

  **Verdict**  
  MIN-K is a net liability for alignment. It fails against shared errors, empowers unrepresentative minorities, and incentivizes blandness. While it patches narrow holes in MEAN-K, it opens wider ones. In most real-world settings, MEAN-K—with its simplicity and resistance to outlier tyranny—is preferable. MIN-K should only be considered with curated model diversity and even then as a niche tool for high-stakes constraints. Without these, it exacerbates Goodharting.  

  ---  

  ### Marking Scheme (20 marks total)  
  **Five must-hit points** (4 marks each). Deduct marks for omissions/errors per the criteria below.  

  | **Point** | **What Students Must Address** | **Common Mistakes** |  
  |-----------|--------------------------------|---------------------|  
  | **1. Model Independence and Errors** (4 marks) | Explain that shared base model/training creates correlated errors off-distribution. Contrast independent errors (MIN-K helps) vs. shared errors (MIN-K fails). Argue why MIN-K is vulnerable to shared errors. | Assuming models are fully independent; not linking base model bias to shared errors; failing to distinguish error types. |  
  | **2. Min Operator Dynamics** (4 marks) | Describe min as order statistic; discuss veto power of pessimistic subgroups; explain degradation as K grows (e.g., policy overfits to worst model). Contrast with MEAN-K’s handling of outliers. | Treating min as "average but safer"; not addressing how K scales; missing veto-risk for minority preferences. |  
  | **3. Optimization Pressure: Blandness and Features** (4 marks) | Argue MIN-K encourages hedging/blandness to avoid triggering any model. Explain why shared spurious features (e.g., length) are amplified, not suppressed. | Claiming MIN-K reduces all spurious features; not linking blandness to veto dynamics; ignoring feedback loops. |  
  | **4. Safety-Performance Trade-offs** (4 marks) | Identify safety gains (blocks independent hacks) and costs (misalignment with majority, outlier tyranny, blandness). Discuss Goodharting trade-offs. | Only listing pros or cons; ignoring performance costs; superficial treatment of Goodharting. |  
  | **5. Improvements Beyond Aggregation** (4 marks) | Propose a concrete setup change (e.g., diverse annotator groups, varied base models). Explain why it targets model diversity, not aggregation. Argue feasibility/impact. | Suggesting aggregator tweaks (e.g., "use median"); vague fixes ("get better data"); no link to root causes. |  

  **Grading Standards**  
  - **A (17–20 marks)**: Integrates all points into a cohesive verdict; demonstrates nuanced understanding of trade-offs (e.g., "MIN-K helps with independent errors but amplifies shared ones"); uses prompts to build original insights.  
  - **B (13–16 marks)**: Covers all points but with gaps in depth (e.g., lists errors without explaining *why* they correlate); weaker synthesis; verdict is descriptive but not incisive.  
  - **C/D (<13 marks)**: Misses >1 point; superficial analysis (e.g., "MIN-K is safer because it requires consensus"); no clear verdict.  

  **Reasonable Pushback**  
  A student could argue that MIN-K is valuable in *safety-critical* domains (e.g., autonomous driving) where a single failure is unacceptable, justifying outlier veto power. This is valid if they acknowledge trade-offs (e.g., "blandness is a price for risk reduction").  

  ---  
  **Style Note**: All text uses American English (e.g., "behavior," "artifact"). Punctuation follows U.S. conventions (e.g., double quotes for emphasis, commas before "and" in lists).
