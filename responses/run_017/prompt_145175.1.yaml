  ### (a) Scenario and Payoff Matrix  
  Two rival tech firms, Alpha and Beta, repeatedly collaborate on joint ventures. Each round, they can: **Cooperate** (honor the agreement), **Defect** (exploit the partner), or **Withdraw** (safely exit to an internal project, leaving the partner as if defected). Payoffs:  

  |          | Beta: C | Beta: D | Beta: W |
  |----------|---------|---------|---------|
  | **Alpha: C** | 5, 5    | -1, 7   | -1, 4   |
  | **Alpha: D** | 7, -1   | 1, 1    | 1, 4    |
  | **Alpha: W** | 4, -1   | 4, 1    | 4, 4    |  

  - Prisoner's Dilemma block: \(T = 7 > R = 5 > P = 1 > S = -1\), and \(2R = 10 > T + S = 6\).  
  - Withdrawal payoff \(E = 4\) satisfies \(P = 1 < E = 4 < R = 5\).  

  ### (b) Cooperation Sustainable Without Withdrawal  
  Continuation probability (discount factor) \(\delta = 0.5\).  
  **Strategy:** Grim trigger (cooperate until defection, then defect forever).  
  - Incentive: \(5/(1 - \delta) \geq 7 + \delta \cdot (1/(1 - \delta))\)  
    \(\Rightarrow 5/0.5 = 10 \geq 7 + 0.5 \cdot 2 = 8\). Holds.  

  ### (c) Cooperation Unsustainable With Withdrawal  
  At \(\delta = 0.5\), no SPE sustains perpetual cooperation.  
  **Proof:**  
  - Any punishment gives a deviator at least \(E = 4\) per round (by withdrawing repeatedly).  
  - Continuation value post-defection \(\geq 4/(1 - \delta) = 8\).  
  - Defection payoff: \(7 + \delta \cdot 8 = 7 + 4 = 11\).  
  - Cooperative payoff: \(10\).  
  - \(11 > 10\): Defection strictly dominates.  
  **Caveat:** Holds for pure or mixed strategies (withdrawal ensures minmax = 4).  

  ### (d) General Condition and Variations  
  - **Sustainability condition:** \(\delta \geq (T - R)/(T - E)\).  
    - With \(E = 4\): \((7-5)/(7-4) = 2/3 \approx 0.667\).  
    - Reduces to \((T - R)/(T - P) = 1/3\) when \(E = P\).  
  - **Variations:**  
    - **One-time withdrawal:** If punishable (e.g., grim trigger), cooperation may return (e.g., at \(\delta = 0.5\), defection yields \(7 + \delta \cdot P/(1-\delta) = 8 < 10\)).  
    - **Costly withdrawal:** If cost \(c\) reduces effective \(E\), threshold \(\delta\) decreases.  
    - **Retaliation:** If observable, but withdrawal guarantees \(E\) regardless, punishment floor remains; deterrence fails unless \(E\) falls.  

  ### (e) Asymmetric Withdrawal  
  Only Alpha can withdraw.  
  - Alpha defects (gets 7), then withdraws forever (gets 4 per round). Total: \(7 + \delta \cdot 4/(1-\delta) = 11\).  
  - Beta forced to defect post-deviation, gets \(-1 + \delta \cdot 1/(1-\delta) = 0\).  
  - **Result:** Alpha’s cooperation fails; Alpha better off (11 > 10), Beta worse off (0 < 10).  

  ### (f) Key Feature and Objections  
  **Key:** Withdrawal sets a floor \(E > P\), capping punishment severity and undermining deterrence.  
  **Objections:**  
  1. *"Withdrawal isn’t costless; players avoid it."*  
     **Reply:** If \(E\) is attractive enough (here \(E = 4 > P = 1\)), the floor still binds.  
  2. *"Parties coordinate on withdrawal as a cooperative fallback."*  
     **Reply:** Mutual withdrawal (\(E = 4\)) pays less than cooperation (\(R = 5\)), but its availability blocks harsher punishments needed to sustain cooperation.  

  ### (g) Evolutionary Implication  
  Mutual withdrawal (\(E = 4\)) replaces mutual defection (\(P = 1\)) as the fallback, raising baseline payoffs. However, cooperation requires a higher \(\delta\) (here \(\delta \geq 2/3\) vs. \(1/3\) without withdrawal), qualifying the shadow-of-the-future story: defensive options can reduce the parameter space where cooperation evolves.  

