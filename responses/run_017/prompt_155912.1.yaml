  ### Centipede Game Backward Induction Paradox: Diagnostic Flowchart  
  **Start from agreement:** (1) Backward induction (BI) is valid given its premises (common knowledge of rationality + game structure). (2) Real players pass early → BI doesn’t predict behavior.  

  **Instructions:** Answer based on your intuition. No prior literature knowledge needed.  

  ---

  #### **Q1. At node 4 (which BI says is unreachable), you are playing. What do you do?**  
  - **A: Take** (stick to BI) → **Q2**  
  - **B: Pass** (deviate) → **Q5**  

  #### **Q2. [If take at node 4] In a 100-node Centipede, should Player 1 take immediately?**  
  - **A: Yes** (BI applies identically) → **Q3**  
  - **B: No** (length changes things) → **EMPTY CELL** (Incoherent: BI is scale-invariant)  

  #### **Q3. [If take in 100-node] You’ve seen your opponent pass at node 1 in a prior game. Now at your node 1, you:**  
  - **A: Take** (ignore past; BI is normative) → **Leaf A**  
  - **B: Pass** (update based on past behavior) → **Leaf E**  

  #### **Q4. [If take at node 4] Before the game, your opponent sends a cost-free message: “I will pass at every node.” Do you believe them?**  
  *(Not reached in this branch; see Leaf E)*  

  #### **Q5. [If pass at node 4] Do you accept BI as a valid theorem given its premises?**  
  - **A: Yes** → **Q6**  
  - **B: No** → **Q7**  

  #### **Q6. [If accept BI validity] In a game where your opponent is an exact copy of you (same reasoning), at node 1 you:**  
  - **A: Take** → **Leaf B**  
  - **B: Pass** → **Leaf C**  

  #### **Q7. [If reject BI validity] In a version where players can send one cost-free message pre-game (e.g., “I will pass at node 1”), does this change your node-1 choice?**  
  - **A: Yes** (messages matter) → **Leaf D**  
  - **B: No** (messages irrelevant) → **EMPTY CELL** (Unattractive: ignores coordination potential)  

  #### **Q8. [If pass at node 4] You pass at node 4. Why?**  
  *(Diagnostic only; not a branch)*  
  - *(Implicit in Leaf B/C/D)*  

  ---

  ### LEAVES (Positions) & Their Uncomfortable Implications  
  **Leaf A: Biting the Bullet**  
  *Path:* Q1:A → Q2:A → Q3:A  
  - **Position:** BI is correct; real players fail common knowledge of rationality (CKR).  
  - **Uncomfortable thing:** You must claim experts who pass are irrational or misunderstand BI.  

  **Leaf B: BI as Theorem, Not Action-Guiding**  
  *Path:* Q1:B → Q5:A → Q6:A  
  - **Position:** BI is logically valid but irrelevant once a node is reached (CKR is falsified).  
  - **Uncomfortable thing:** No formal way to justify *why* BI becomes action-irrelevant mid-game.  

  **Leaf C: Team/We-Reasoning**  
  *Path:* Q1:B → Q5:A → Q6:B  
  - **Position:** Players coordinate to maximize joint payoff (e.g., “we” both pass to grow the pot).  
  - **Uncomfortable thing:** Requires assuming your opponent reasons identically—vulnerable to defection.  

  **Leaf D: Bounded Rationality / Level-k**  
  *Path:* Q1:B → Q5:B → Q7:A  
  - **Position:** Players have cognitive limits (e.g., assume opponents are less sophisticated).  
  - **Uncomfortable thing:** Arbitrary how many “levels” of reasoning to assume; ad hoc.  

  **Leaf E: Model Misspecification (Incomplete Info/Trembles)**  
  *Path:* Q1:A → Q2:A → Q3:B  
  - **Position:** BI assumes perfect CKR; real players have trembles or hidden traits (e.g., altruism).  
  - **Uncomfortable thing:** You take at node 4 *despite* suspecting irrationality—BI may still fail.  

  **EMPTY CELLS:**  
  - Q2:B (Incoherent: BI can’t depend on game length).  
  - Q7:B (Unattractive: rejects BI *and* ignores communication).  

