  - **On-path/off-path:** Q1 forces confrontation with BI’s unreachable nodes.  
  - **Concrete variants:** 100-node (Q2), past behavior (Q3), messages (Q7), copy-of-self (Q6).  
  - **Overlaps flagged:** Leaf B and Leaf D both pass at node 4 but diverge on BI’s validity (Q5).  

