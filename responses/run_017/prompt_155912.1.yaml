     a. Biting the bullet: people aren't commonly known to be rational (or doubts arise at reached nodes).
     b. Granting the induction as a theorem but denying it tells you what to do when moving (perhaps due to the paradox of the actual move).
     c. Team or we-reasoning.
     d. Bounded rationality / level-k reasoning.
     e. Model misspecification (incomplete information or trembles).
  - At least one cell should be empty (incoherent, unattractive, or unexplored).
  - If two positions look identical on the questions, flag it.

