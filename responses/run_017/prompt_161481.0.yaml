prompt: |-
  Hi — I'm putting together something short and silly for our department's reading-group newsletter (we've been grinding through the Nyāya material on pramāṇas this term) and I'd like you to write it.

  What I want is a deadpan parody of a quality-assurance document: a single page, 600–700 words, numbered clauses with tick-boxes and fill-in lines, from a university office — the Office for Epistemic Assurance, or whatever sounds suitably grim — that has taken on the job of certifying which of a researcher's cognitions (pramā) were actually produced by a working knowledge-source (pramāṇa), and rejecting the ones that weren't.

  The target is the Nyāya line that a cognition doesn't come stamped with its own validity: its validity has to be made out by something else — a further, reflective cognition (anuvyavasāya), paradigmatically an inference, or the fact that the cognition issues in successful action — the parataḥ view, as against the Mīmāṃsā svataḥ view that validity is intrinsic. (If I've got the school labels muddled just quietly fix them, but keep hold of the target: the certification regress, and the places Nyāya actually tries to stop it.) The joke is that the Office has turned this into paperwork, that the paperwork has exactly one real problem, which is the regress, and that the Office closes it by administrative fiat in a way that concedes the very thing it officially denies.

  Things I want in there, all of them real features of the view rather than inventions:

  - A declaration section: tick one of the four recognised pramāṇas — pratyakṣa, anumāna, upamāna, śabda. Claims sourced to arthāpatti or anupalabdhi are rejected with a printed reason that is recognisably Nyāya's own: roughly, that these aren't seperate sources and get absorbed into inference or into perception of an absence.
  - An inference annexe: you have to write out all five members — pratijñā, hetu, udāharaṇa, upanaya, nigamana — state the vyāpti, and supply a positive and a negative example (sapakṣa, vipakṣa). The Office should be entirely unfazed by how redundant this is, with a form-field for each member even where two lines would do the job.
  - A hetvābhāsa self-assessment checklist covering the standard five: savyabhicāra / anaikāntika (the hetu that wanders into the vipakṣa), viruddha, asiddha (sādhyasama), satpratipakṣa (prakaraṇasama), bādhita (kālātīta). Use the Sanskrit labels where they do work, but each clause should still be intelligible to someone who doesn't read Sanskrit.
  - A note on tarka: hypothetical reasoning may be used to dispel doubt but cannot on its own establish a claim, so grant proposals resting on it are returned unread. This should be one of the funniest bits precisely because it's completely correct.
  - An upamāna box asking you to name the comparison sentence and the remembered object — the gavaya case is fine to use.

  And the invented bit, where you can go to town: the Office's rule for how deep the certification goes. Something like — a cognition is assured only if a second-order cognition certifies it; that second-order cognition needs a third; and the handbook terminates the series at a fixed level, either by a clause that visibly smuggles back the intrinsic-validity view it rejects, or by an exemption for the Office's own cognitions, or by an appeal to the lamp that lights both itself and other things. Whichever you pick, make it read like an administrative fix rather than a philosophical argument. Then a final clause, still deadpan, extending the exemption to any cognition whose object is the assurance scheme itself.

  Two constraints so it doesn't get the epistemology wrong. Nyāya is a reliabilist, broadly externalist picture: pramā is true cognition generated by a functioning pramāṇa, and the subject needn't have reasons at hand or introspective access to the source. So the Office must not start demanding certainty, or articulate reasons, or anything Cartesian; the comedy has to come from the audit structure and the regress, not from quietly converting Nyāya into internalism. Equally, don't make the Office thick — its rules should be recognisably Nyāya's own commitments pushed one bureaucratic step further, so that someone who's done the reading groans because it's fair rather than groans because it's a strawman.

  Keep it deadpan all the way through — no winking, no asides telling us it's a joke, no puns on Sanskrit terms. British English. And ideally it lands the regress so the reader feels the bite rather than just sees it described; that would be definately ideal.
reasoning: |-
  Okay, the user wants a deadpan parody of a quality-assurance document based on Nyāya epistemology. They've been studying pramāṇas in their reading group, so they're familiar with the concepts. The key is to mimic bureaucratic language while staying true to Nyāya's externalist, reliabilist framework.

  The core joke hinges on the parataḥ validity view - that cognitions need external certification - and the inevitable regress this creates. The Office for Epistemic Assurance will bureaucratize this by requiring paperwork for each cognition's validation, then clumsily halt the regress administratively. 

  Important elements to include:
  - Declaration section with exactly four pramāṇas (rejecting arthāpatti/anupalabdhi with Nyāya's standard absorption arguments)
  - Ridiculously redundant inference annexe demanding all five members separately
  - Hetvābhāsa checklist covering all five fallacies with clear explanations
  - Tarka dismissal as non-establishing (played straight for humor)
  - Upamāna box requiring comparison sentence reference
  - The regress-stopper that ironically concedes intrinsic validity

  Must avoid:
  - Cartesian/internalist language (Nyāya is externalist)
  - Strawmanning Nyāya positions
  - Explicit jokes or wordplay (deadpan only)
  - Sanskrit puns

  The administrative fix should feel like a real bureaucrat's solution - perhaps exempting the Office's own cognitions or invoking the self-illuminating lamp analogy as policy. The final clause extending exemption to the scheme itself will heighten the absurdity.

  British English phrasing is crucial: "herewith" not "hereby", "annexe" not "appendix", "whilst" not "while". The tone should mirror actual UK government forms - passive voice, numbered clauses, implied threats of rejection.

  For the regress, we'll make the user feel it by requiring form 7B/3 for the certification cognition itself, then abruptly halting at level 3 with circular reasoning disguised as procedure. The comedy comes from the juxtaposition of epistemological rigor and administrative fiat.
answer: |-
  ## Office for Epistemic Assurance (OEA)  
  **Form 7B/3: Pramāṇa-Driven Cognition Certification**  
  *(Version 4.2, effective 1 Kartika)*  

  **Important:** All cognitions (`pramā`) submitted for departmental research outputs, grant applications, or thesis validation **must** be certified using this form. Cognitions lacking valid certification will be deemed `apramā` (non-valid) and may result in audit points or funding clawback. Submit the completed form to OEA Room 4.10b within 14 days of cognition-generation.  

  **SECTION A: COGNITION DECLARATION**  

  1.  **Description of Cognition:**  
      [_________________________________________________________________________________________]  
      *(State the specific cognition requiring assurance, e.g., "Cognition that the pot is on the floor", "Cognition that fire is present due to smoke")*  

  2.  **Declared Source of Cognition (`Pramāṇa`):**  
      *(Tick ONE box only)*  
      ☐ **Pratyakṣa** (Perception)  
      ☐ **Anumāna** (Inference) *(Complete Section B)*  
      ☐ **Upamāna** (Comparison) *(Complete Section C)*  
      ☐ **Śabda** (Verbal Testimony) *(Specify source & attest authenticity below)*  

      **Sources NOT Recognised by OEA:**  
      *   **Arthāpatti** (Presumption): Reclassified under `Anumāna`. Submit via Section B.  
      *   **Anupalabdhi** (Non-apprehension): Reclassified under `Pratyakṣa` (perception of absence). Submit via Section A, Box 2, selecting `Pratyakṣa`.  
      *Reason for non-recognition: These modes lack independent causal efficacy (`karatva`) and are subsumed under established pramāṇas per OEA Directive 2.1.3.*  

  **SECTION B: ANNEXE FOR INFERENCE (`Anumāna`)**  
  *(Required ONLY if Box 2.2 ticked above)*  

  3.  **Full Five-Member Statement (`Pañcāvayavi`):**  
      *   3.1. **Pratijñā** (Proposition/Thesis):  
          [_________________________________________________________________________________________]  
      *   3.2. **Hetu** (Reason/Middle Term):  
          [_________________________________________________________________________________________]  
      *   3.3. **Udāharaṇa** (Example/Universal Correlation - `Vyāpti`):  
          *(State the invariable concomitance)*  
          [_________________________________________________________________________________________]  
          *   3.3a. **Positive Example (`Sapakṣa`):**  
              [_________________________________________________________________________________________]  
          *   3.3b. **Negative Example (`Vipakṣa`):**  
              [_________________________________________________________________________________________]  
      *   3.4. **Upanaya** (Application/Subsumption):  
          [_________________________________________________________________________________________]  
      *   3.5. **Nigamana** (Conclusion):  
          [_________________________________________________________________________________________]  

  4.  **Hetvābhāsa Self-Assessment:**  
      *(Check ALL applicable fallacy types potentially present. Failure to disclose may invalidate certification)*  
      ☐ **Savyabhicāra/Anaikāntika** (Wandering/Inconclusive Reason): *The Hetu (3.2) is found in cases where the Proposition (3.1) is absent (e.g., in the Vipakṣa, 3.3b).*  
      ☐ **Viruddha** (Contradictory Reason): *The Hetu (3.2) implies the OPPOSITE of the Proposition (3.1).*  
      ☐ **Asiddha (Sādhyasama)** (Unestablished/Unproven Reason): *The Hetu (3.2) is as doubtful as the Proposition (3.1) itself.*  
      ☐ **Satpratipakṣa (Prakaraṇasama)** (Balanced Inconclusive Reason): *An equally strong counter-inference using a different Hetu supports the opposite conclusion.*  
      ☐ **Bādhita (Kālātīta)** (Contradicted by Other Means): *The Proposition (3.1) is overruled by a cognition from a superior pramāṇa (e.g., perception contradicts an inference).*  
      *(If any boxes checked, explain remedial action taken in Box 8)*  

  **SECTION C: ANNEXE FOR COMPARISON (`Upamāna`)**  
  *(Required ONLY if Box 2.3 ticked above)*  

  5.  **Comparison Statement:**  
      *(Quote the sentence/instruction describing the unfamiliar object using the familiar object)*  
      [_________________________________________________________________________________________]  
      *(e.g., "A gavaya is like a cow")*  

  6.  **Familiar Object (`Upameya`):**  
      *(Name the object whose recollection enables the comparison)*  
      [_________________________________________________________________________________________]  
      *(e.g., "Cow")*  

  **SECTION D: GENERAL VALIDATION PROTOCOLS**  

  7.  **Reflective Cognition (`Anuvyavasāya`) Requirement:**  
      A cognition (`pramā`) declared in Section A achieves OEA-assured status **only if** validated by a subsequent, distinct reflective cognition (`anuvyavasāya`).  
      ☐ I attest that a distinct reflective cognition validating the cognition declared in Box 1 has been generated.  
      *(Attach **separate Form 7B/3** certifying *this* reflective cognition)*  

  8.  **Tarka (Hypothetical Reasoning) Notice:**  
      Whilst `tarka` may be employed to remove doubt (`saṃśaya`) regarding a potential fallacy (Section B, Box 4) or conflict, cognitions derived **solely** from `tarka` ("what if...", "if not...") are categorically insufficient for establishing positive knowledge (`pramā`) and are **ineligible** for OEA certification. Proposals relying solely on `tarka` will be returned.  

  **SECTION E: OFFICE USE ONLY - ASSURANCE HIERARCHY & REGRESS TERMINATION**  

  *(OEA Auditor to Complete)*  

  9.  **Validation Chain:**  
      *   Cognition Declared (Box 1) requires validation by Reflective Cognition 1 (Form 7B/3 Ref: _________).  
      *   Reflective Cognition 1 requires validation by Reflective Cognition 2 (Form 7B/3 Ref: _________).  
      *   Reflective Cognition 2 requires validation by Reflective Cognition 3 (Form 7B/3 Ref: _________).

  10. **Regress Termination (Per OEA Handbook §17.5.3.d):**  
      The validation chain terminates at Reflective Cognition 3. The validity (`prāmāṇya`) of Reflective Cognition 3 is **intrinsically assured** (`svataḥ prāmāṇya`) within the operational framework of the OEA. This intrinsic assurance is granted administratively to ensure scheme viability. *Rationale: The self-illuminating nature (`svaprakāśatva`) of the highest-level audit cognition mirrors a lamp illuminating itself and others.*  

  11. **Scheme Reflexivity Clause:**  
      Any cognition whose sole object (`viṣaya`) is the structure, procedure, or validity of the OEA certification scheme itself is **exempt** from the requirement for external validation (Section D, Box 7) and is **automatically granted** intrinsic assurance per Clause 10.  

  **Certification Outcome (OEA Auditor):**  
  ☐ **CERTIFIED (`Pramā`):** Cognition validated per OEA protocols.  
  ☐ **REJECTED (`Apramā`):** See attached deficiency notice (Form 7D/1).  

  *Auditor Signature:* _________________________  
  *Date:* ___/___/___  
  *OEA Stamp:*  

  ---

  **Notes on the Execution:**

  1.  **Deadpan Bureaucracy:** The humour derives entirely from the meticulous, redundant form structure (especially the five-fold inference breakdown and the separate forms for reflective cognitions) applied to an epistemological problem.
  2.  **Nyāya Accuracy:** The limitations on pramāṇas, the structure of inference, the hetvābhāsa, the role of tarka, and the reliance on reflective cognition (`anuvyavasāya`) or successful action (implied by the threat of "audit points or funding clawback") are all core Nyāya (`parataḥ prāmāṇya`). The rejection of arthāpatti/anupalabdhi uses standard Nyāya reductionism.
  3.  **The Regress & The Fix:** Sections D.7 and E.9 explicitly create the regress (requiring a form for the validating cognition, and then for *its* validator). Clause E.10 is the administrative fiat: it halts the regress by *flatly declaring* intrinsic validity (`svataḥ prāmāṇya`) for the third-level cognition within the OEA scheme – the very view Nyāya officially opposes. The "lamp" analogy is weaponized as bureaucratic policy. Clause E.11 deepens the absurdity by exempting cognitions *about the scheme*, making the system self-sealing.
  4.  **Externalism Preserved:** The OEA doesn't demand internal certainty or Cartesian reasons; it demands paperwork *simulating* the external validation Nyāya requires. The comedy is in the *structure* of the audit, not a shift to internalism. The "attestation" in D.7 is about generating the cognition, not introspecting its source.
  5.  **British English:** "Whilst", "annexe", "clawback", "tick one box", "per", "flatly declaring", "scheme viability".
  6.  **Feeling the Regress:** The instruction to attach *another Form 7B/3* for the reflective cognition (D.7) and the auditor filling in the chain (E.9) concretizes the regress. The abrupt termination at level 3 by fiat (E.10) highlights the artificiality of the "solution". The reflexivity clause (E.11) is the final, darkly bureaucratic twist. No winking, just paperwork.
