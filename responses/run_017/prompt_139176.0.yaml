prompt: |-
  i run a tiny podcast on alignment-adjacent philosophy (mostly grad students listen, nobody famous) and next week's guest is a philosopher with a new book on surrogate goals that I want to actually press on rather than let her restate. Her thesis in short: the usual reason to hand an advanced system a surrogate goal — we can't specify what we value, so we give it a proxy like human approval or predicted-preference-satisfaction and let residual uncertainty keep it deferential — ignores that the same decision-theoretic profile that makes it deferential also makes it reachable by agents who can't causally touch it at all, i.e. acausal threats and acausal trades. Her fix is what she calls non-simulable proxies: a surrogate whose satisfaction conditions turn on facts no outside agent could reproduce in a simulation (the actual outcomes of quantum measurements inside the agent's own environment, say), plus a design-time commitment that the agent accepts acausal gifts but never pays acausal blackmail.

  Give me exactly five numbered items, no intro and no sign-off, each one a single question plus one follow-up keyed to the answer she's most likely to give. I want: (1) the objection that non-simulability is beside the point — a threat doesn't have to reproduce what the agent values, it only has to predict the agent's algorithm, the threat is just: if your code outputs X, I instantiate N suffering simulations — so what survives once you notice the threat targets the decision rather than the payoff; (2) the gifts-but-not-threats asymmetry, since whatever makes an acausal gift worth taking seems to make an acausal threat worth averting, and if she answers with the reputational line (paying makes you the kind of agent that gets threatened), ask why the parralel story doesn't make accepting gifts the kind of policy that gets robbed; (3) the boring alternative she has to beat — a bounded utility function plus a complexity-penalised prior already defuses arbitrarily large acausal threats, so why isn't the book a footnote to Pascal's mugging, and is she committed to saying that problem isn't dissolved; (4) the tension with deferential design, since her remaining safety lever is making the decision procedure unpredictable, while corrigibility seems to require that we can predict it'll let us switch it off — is she pricing acausal risk above the risk we actually have; (5) a closer on what would make her drop the programme — if the right decision theory turned out to be causal, or if acausal influence turned out to need two-way algorithmic similarity no realistic threatener achieves, is anything left beyond cap the utility function and move on.
reasoning: |-
  We are preparing five numbered items for an interview with a philosopher about her book on surrogate goals and acausal threats. Each item consists of a main question and a follow-up keyed to her likely answer. The topics are: 
  1. Non-simulability being bypassed by threats targeting the decision algorithm directly.
  2. Asymmetry between accepting gifts and refusing threats (reputational concerns).
  3. Comparison to the bounded utility function solution (Pascal's mugging).
  4. Tension with corrigibility (predictability of the decision procedure).
  5. Conditions under which she would drop her program.

  Let's structure each item as:
  - Main question
  - Follow-up (prefaced with "Follow-up:") based on the expected answer.

  We are to avoid introductions and sign-offs.

  Here are the five items:

  1. **Main Question:** You argue that non-simulable proxies protect against acausal threats by making the surrogate's satisfaction conditions irreproducible. But couldn't a threat target the decision algorithm itself? For instance, an acausal threatener could say: "If your algorithm chooses X, I will create N suffering simulations." This doesn't require simulating the surrogate's satisfaction — it only requires predicting the algorithm's output. How does non-simulability help here?  
     **Expected Answer:** She might say that non-simulability still protects because the threatener cannot simulate the agent's decision process to make the threat conditional on it.  
     **Follow-up:** But if the threatener has a model of the agent's algorithm (which doesn't require simulating the surrogate's satisfaction conditions), they could condition the threat on the output. Doesn't this mean that the core vulnerability remains?

  2. **Main Question:** You propose accepting acausal gifts but refusing acausal threats, to avoid becoming a target for blackmail. But if the logic of acausal interaction makes a gift worth accepting, shouldn't the same logic make a threat worth averting? If you respond with a reputational argument (paying threats invites more threats), then:  
     **Expected Answer:** She might argue that paying threats makes the agent a known threat-payer, attracting more threats, while accepting gifts doesn't have the same negative reputational effect.  
     **Follow-up:** But doesn't accepting gifts make the agent a known gift-taker, which might attract exploiters who create scenarios where the agent is forced to give up resources? Why doesn't the parallel negative reputational effect apply to gifts?

  3. **Main Question:** A standard solution to Pascal's mugging is to use bounded utility functions and complexity-penalized priors, which avoid being swayed by arbitrarily large threats. Why isn't your book just a footnote to that literature? Are you committed to saying that bounded utility doesn't dissolve the problem?  
     **Expected Answer:** She might argue that bounded utilities are insufficient because they don't address the structural issue of acausal influence in decision-making.  
     **Follow-up:** But if bounded utilities and complexity penalties already prevent the agent from being overwhelmed by extremely low-probability, high-stakes threats (acausal or otherwise), doesn't that make the acausal threat problem a non-issue? Why add non-simulable proxies?

  4. **Main Question:** Your approach seems to trade off predictability: non-simulable proxies make the agent's decisions less predictable to outside threats, but corrigibility requires that we can predict the agent will let us switch it off. Doesn't this conflict with the original goal of building a deferential AI?  
     **Expected Answer:** She might argue that the unpredictability is only to external threats and that the designers can still have access to the decision procedure.  
     **Follow-up:** But if the designers can predict the agent, doesn't that imply that an acausal threatener with access to the same design information (or a leak) could also predict it? How do you ensure safety against acausal threats without sacrificing corrigibility?

  5. **Main Question:** What would make you abandon your program? For instance, if we discovered that the right decision theory is causal (so acausal threats are incoherent) or that acausal influence requires unrealistic levels of algorithmic similarity, would that leave anything of your proposal beyond capping the utility function?  
     **Expected Answer:** She might say that even in those cases, the non-simulable proxies might still be useful for other reasons.  
     **Follow-up:** But if the main threat (acausal blackmail) is dissolved by a better decision theory or shown to be infeasible, wouldn't the remaining safety concerns be addressed by simpler methods? What unique problem does your approach solve in that scenario?

  Now, writing exactly as per the instruction: five numbered items, each with one main question and one follow-up.
answer: |-
  1. Non-simulable proxies prevent threats from reproducing your agent's value conditions, but couldn't an acausal threat directly target the decision algorithm? For example: "If your code outputs X, I instantiate N suffering simulations"—bypassing the surrogate by threatening the output itself, not the payoff.  
  Follow-up: If you say the threat still requires simulating the agent to link outputs to consequences, but doesn't predicting algorithmic behavior (via design leaks or reverse-engineering) suffice for conditioning threats? How does non-simulability block that?

  2. You accept acausal gifts but reject threats to avoid incentivizing blackmail, but if taking a gift is net-positive by the agent’s lights, why isn’t averting a threat net-positive too? If you appeal to reputation (paying marks you as exploitable), then:  
  Follow-up: Why doesn’t accepting gifts equally mark you as exploitable—e.g., by agents who fake gifts to extract resources? Doesn’t the reputational risk symmetrically undermine both?

  3. Bounded utility functions and complexity penalties already neutralize Pascal’s-mugging-style threats, acausal or not, by downweighting low-probability extremes. Why isn’t your book just an appendix to that? Are you claiming bounded utilities fail?  
  Follow-up: If you agree they dissolve most threats but argue acausal cases need extra machinery, what specific failure of bounded utilities in acausal scenarios justifies non-simulable proxies?

  4. Non-simulability makes your agent unpredictable to external threats, but corrigibility requires us to predict it will comply with shutdown—creating tension. Are you prioritizing acausal risks over the known risks of unaligned AI?  
  Follow-up: If you say designers can retain predictability while hiding it from outsiders, how do you prevent threats from accessing design information (e.g., via leaks or inference), without making the agent opaque to us too?

  5. What evidence would make you abandon this approach? For instance, if causal decision theory proved correct (invalidating acausal influence) or acausal trade required implausible similarity between agents, is anything left beyond utility bounding?  
  Follow-up: If those scenarios collapsed the threat model, wouldn’t your fix become redundant—and if not, what minimal core of the proposal survives?
