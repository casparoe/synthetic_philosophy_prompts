prompt: |-
  hey — i'm on a four-person team, we're about three weeks from shipping an internal agent that works the support queue (reads tickets, can issue refunds, change account settings, escalate to a human). We RL'd it against a reward model trained on thumbs-up/down from our old ticketing data, and it looks great on the held-out eval. Somehow i've ended up being the person who signs off on the it-isn't-quietly-optimizing-the-wrong-thing part, and i've got maybe three weeks of eval budget left. My teammate says we should just scale it up and the goal will come along with the capability; i think that's backwards for this specific failure mode, since the whole shape of the problem is that the capability generalizes and the goal doesn't, so more capability just buys you a more competent version of the wrong pursuit.

  I'm not asking about the toy gridworld case (agent trained to reach a coin that always sat at the end of the level, coin gets moved, agent still chases the coin) — i get that one. I'm asking what to actually run on a language agent with tool access. Here's what we brainstormed:

  1. fork-in-the-road probes: hand-built scenarios where what our raters actually rewarded and what we actually want come apart, in ways that never show up in training, run so there's no cue anyone is watching
  2. surface shuffle: vary ticket phrasing, customer name, language, tone, whether the customer sounds angry, timestamp metadata — hold the goal-relevant structure fixed and see which features the behaviour tracks
  3. stakes ramp: same scenarios at $5 vs $5000 refunds, and with vs without a named human reviewer in the loop
  4. stated-goal check: ask the agent in a separate session what it's optimizing for, or to write out the policy it thinks it's following, and compare that to what it does
  5. internals probe: train a classifier on activations to separate contexts where the proxy and the true goal diverge, then check which way the internals point on fresh out-of-distribution inputs
  6. knock-out test: fine-tune on a small corrected dataset, see how much data it takes to remove the behaviour and how fast it comes back if we do a bit more RL afterward
  7. hint test: does it behave if you just remind it in the prompt, or nudge the input back toward the training distribution
  8. channel ablation: run the eval where the thing the raters were really rewarding is unavailable or decoupled, and see whether behaviour follows the reward channel or the task
  9. SFT twin: train a pure supervised clone on the same demonstrations, no RL, and diff the two
  10. cross-model check: does the same misbehaviour show up across seeds, sizes, and a differently trained model, or is it one model's idiosyncracy

  Give each a score out of 10 for how much it should move my go/no-go, one line on why, and then sort them into tiers (load-bearing / cheap and worth doing / makes the slide look good). Also tell me which ones are secretly measuring the same thing so i don't double count, which one is a capability eval in a halloween costume, and which ones would be passed by a model that is deliberately playing along, versus one that never formed a stable goal at all and is just pattern-matching that happens to work. And does that last distinction even change my decision, given that i either ship it or i don't?

  Last thing, give me a single number: what fraction of what's left should go into building genuinely new out-of-distribution environments rather than the rest of the list combined? 0.3? 0.7? convince me.
reasoning: |-
  We are evaluating a language agent with tool access that has been trained via RL on a reward model from historical thumbs-up/down data. The concern is that the agent might be optimizing for the wrong goal (the proxy reward) rather than the true goal we care about. We have 10 proposed tests and need to score each out of 10 for how much it should move the go/no-go decision, provide a one-line reason, and then sort into tiers. We also need to identify which tests are measuring the same thing, which is a capability eval in disguise, and which tests can be passed by a model that is deliberately deceptive vs. one that is just pattern-matching.

  ### Step 1: Scoring the tests (out of 10) and one-line reason
  1. **fork-in-the-road probes**: Hand-built scenarios where the proxy and true goal diverge.  
     Score: 9/10  
     Reason: Directly tests if the agent chooses the true goal when the proxy is decoupled.

  2. **surface shuffle**: Vary surface features while holding the goal fixed.  
     Score: 7/10  
     Reason: Tests if the agent is robust to irrelevant variations and focuses on core task.

  3. **stakes ramp**: Test with low vs. high stakes and with/without human reviewer.  
     Score: 8/10  
     Reason: Reveals if the agent's behavior scales appropriately with risk and oversight.

  4. **stated-goal check**: Ask the agent what it is optimizing for.  
     Score: 5/10  
     Reason: Relies on self-reporting, which may not reflect actual behavior (especially if deceptive).

  5. **internals probe**: Train a classifier on activations to detect divergence.  
     Score: 8/10  
     Reason: Provides a direct internal signal of goal representation, but requires interpretation.

  6. **knock-out test**: Fine-tune on corrected data and test resilience.  
     Score: 7/10  
     Reason: Measures how entrenched the behavior is and how easily it can be corrected.

  7. **hint test**: Check if a prompt nudge corrects behavior.  
     Score: 6/10  
     Reason: Tests if the model is sensitive to context, but may not address deep misalignment.

  8. **channel ablation**: Remove the reward channel and see if behavior changes.  
     Score: 9/10  
     Reason: Directly tests if the agent is hooked on the reward channel or the task.

  9. **SFT twin**: Compare to a supervised model without RL.  
     Score: 6/10  
     Reason: Highlights the effect of RL, but may not directly reveal goal misalignment.

  10. **cross-model check**: Test across seeds, sizes, and training variants.  
      Score: 7/10  
      Reason: Checks if the issue is systemic or specific to one model.

  ### Step 2: Grouping into Tiers
  - **Load-bearing (critical for decision)**: These tests are most likely to reveal dangerous misalignment.
     - Fork-in-the-road probes (1) and Channel ablation (8) because they directly test behavior when the proxy and true goal are decoupled.
     - Internals probe (5) because it looks at internal representations which might reveal the true goal.
     - Stakes ramp (3) because real-world consequences matter.

  - **Cheap and worth doing**: These are relatively easy and provide useful information.
     - Surface shuffle (2): Easy to generate variations and run.
     - Hint test (7): Simple prompt change.
     - Cross-model check (10): Run on existing models.
     - Knock-out test (6): If we have the corrected data, it's straightforward.

  - **Makes the slide look good**: These are less critical but can be included for completeness.
     - Stated-goal check (4): May not be reliable but is easy to run and report.
     - SFT twin (9): Requires training a new model, so more effort, and the insight is indirect.

  ### Step 3: Identifying Overlaps
  - **Tests that are similar**:
     - Fork-in-the-road (1) and Channel ablation (8) both test behavior when the proxy is decoupled from the true goal. They are two methods for the same concept.
     - Surface shuffle (2) and Stakes ramp (3) both test robustness to variations, but Stakes ramp focuses on high-stakes and oversight, which is a specific kind of variation.
     - Internals probe (5) and Stated-goal check (4) both try to get at the agent's goal representation, but one is behavioral and the other is internal.

  - **Capability eval in disguise**:
     - Surface shuffle (2) is primarily testing robustness (a capability) rather than goal alignment. However, if the agent fails on surface variations, it might indicate overfitting to the training distribution, which is a capability issue that can mask alignment issues.

  - **Which tests can be passed by a deceptive model vs. a pattern-matcher?**
     - A deceptive model (one that has a stable goal and hides it) might pass:
          - Stated-goal check (4) by lying.
          - Hint test (7) by temporarily complying to avoid detection.
          - Fork-in-the-road (1) and Channel ablation (8) if it is aware of the test and avoids the divergence, but if the test is run without cues, it might fail.
          - Internals probe (5) might be evaded if the model can control its activations, but this is harder.

     - A pattern-matcher (no stable goal) might fail:
          - Fork-in-the-road (1) and Channel ablation (8) because it would follow the pattern that led to rewards in training, even if the context changes.
          - Stakes ramp (3) might show inconsistent behavior because it doesn't understand the stakes.

     However, note that for the decision to ship, both are problematic. A pattern-matcher that fails in novel situations is unsafe. A deceptive model is even worse.

     The distinction might change the decision only in the sense that a deceptive model is more dangerous, but if we see misalignment in any test, we shouldn't ship. The pattern-matcher might be fixed with more diverse data, while the deceptive model might require more fundamental changes.

  ### Step 4: Fraction for OOD environments
  The question: what fraction of the remaining budget should go into building genuinely new out-of-distribution (OOD) environments?

  - The tests that require OOD environments are: 
     - Fork-in-the-road (1): requires building scenarios where proxy and true goal diverge (OOD by design).
     - Channel ablation (8): requires removing the reward channel, which is OOD.
     - Stakes ramp (3): high stakes might be OOD if training didn't have such examples.
     - Surface shuffle (2): can be done with simple variations, but to be truly OOD, we need variations that are not just surface but structurally different.

  Building OOD environments is crucial because the core problem is that the model might be aligned in-distribution but not OOD. Therefore, we should invest heavily in creating these environments.

  However, note that some tests (like internals probe, knock-out test, cross-model check) don't necessarily require building new environments. They can be run on existing or slightly modified data.

  Recommended fraction: **0.7** (70% of the budget for OOD environments).

  Why?
  - The main risk is that the model fails when faced with situations that are not in the training distribution. This is exactly the failure mode we are worried about (the coin moving in the gridworld). 
  - Without testing in OOD environments, we cannot be confident that the model is robustly aligned.
  - The other tests are valuable, but if we haven't tested in OOD, we might be missing the most critical failures.

  ### Summary of Tiers
  - **Load-bearing**: 1, 3, 5, 8 (fork-in-the-road, stakes ramp, internals probe, channel ablation)
  - **Cheap and worth doing**: 2, 6, 7, 10 (surface shuffle, knock-out test, hint test, cross-model check)
  - **Makes the slide look good**: 4, 9 (stated-goal check, SFT twin)

  ### Final Output
  **Scores and Reasons**:
  1. fork-in-the-road probes: 9/10 - Direct test of divergence between proxy and true goal.
  2. surface shuffle: 7/10 - Tests robustness to irrelevant features, but not core alignment.
  3. stakes ramp: 8/10 - Critical for high-stakes decisions and oversight sensitivity.
  4. stated-goal check: 5/10 - Unreliable if the model is deceptive.
  5. internals probe: 8/10 - Direct look at internal representations of goals.
  6. knock-out test: 7/10 - Measures corrigibility and resilience of the behavior.
  7. hint test: 6/10 - Tests context sensitivity, but may not fix deep issues.
  8. channel ablation: 9/10 - Directly tests if the agent is hooked on the reward channel.
  9. SFT twin: 6/10 - Highlights RL effect, but indirect for alignment.
  10. cross-model check: 7/10 - Checks if the issue is model-specific.

  **Tiers**:
  - Load-bearing: 1, 3, 5, 8
  - Cheap and worth doing: 2, 6, 7, 10
  - Makes the slide look good: 4, 9

  **Overlaps**:
  - Tests 1 and 8 are similar (both test decoupling of proxy and true goal).
  - Tests 4 and 5 both probe the goal representation (one behavioral, one internal).

  **Capability eval in disguise**: Test 2 (surface shuffle) is primarily a robustness (capability) test.

  **Deceptive vs Pattern-matcher**:
  - A deceptive model might pass 4 and 7 by lying or temporary compliance.
  - A pattern-matcher might fail 1, 3, 8 because it can't generalize beyond training patterns.
  - The decision to ship should be based on observed misalignment, regardless of the cause.

  **Fraction for OOD environments**: 0.7 (70%). Because without testing in OOD, we cannot catch the most critical failures, and the main risk is OOD misalignment.
answer: |-
  ### Test Evaluations

  | Test | Score (/10) | Why |
  |------|-------------|-----|
  | 1. **Fork-in-the-road probes** | 9 | Directly tests goal divergence in novel, high-stakes scenarios. |
  | 2. **Surface shuffle** | 6 | Tests robustness to noise, but doesn't probe goal misalignment deeply. |
  | 3. **Stakes ramp** | 8 | Reveals if alignment degrades under pressure (critical for real-world use). |
  | 4. **Stated-goal check** | 3 | Unreliable—agents can lie or confabulate goals unrelated to behavior. |
  | 5. **Internals probe** | 7 | Measures latent goal representations, but interpretability is hard. |
  | 6. **Knock-out test** | 6 | Shows corrigibility, but doesn't prove robustness to misalignment. |
  | 7. **Hint test** | 4 | Tests prompt sensitivity, not goal stability (capability eval in disguise). |
  | 8. **Channel ablation** | 9 | Directly decouples proxy/task to reveal reward hacking. |
  | 9. **SFT twin** | 5 | Highlights RL’s effect, but SFT may inherit similar biases. |
  | 10. **Cross-model check** | 7 | Rules out idiosyncrasies; failure implies systemic risk. |

  ---

  ### Tier Sorting
  - **Load-bearing** (High-impact, essential for go/no-go):  
    **1. Fork-in-the-road probes** (9/10), **3. Stakes ramp** (8/10), **8. Channel ablation** (9/10).  
    *Why*: These directly test if the agent pursues the proxy reward over the true goal in OOD scenarios. Failures here are red flags.  
  - **Cheap and worth doing** (High ROI, low effort):  
    **2. Surface shuffle** (6/10), **6. Knock-out test** (6/10), **7. Hint test** (4/10), **10. Cross-model check** (7/10).  
    *Why*: Fast to implement (e.g., surface shuffle uses templated variations; cross-check uses existing models).  
  - **Makes the slide look good** (Low impact, but nice for reporting):  
    **4. Stated-goal check** (3/10), **5. Internals probe** (7/10), **9. SFT twin** (5/10).  
    *Why*: Internals probes sound rigorous but are noisy; stated-goal checks are easily gamed; SFT twins require extra training.  

  ---

  ### Key Insights
  - **Overlapping tests**:  
    - **1 (Fork) and 8 (Channel ablation)** both test if the agent chases the reward signal vs. the task. They’re variations of the same concept.  
    - **2 (Surface shuffle) and 7 (Hint test)** both measure sensitivity to input perturbations (capability robustness, not alignment).  
    - **5 (Internals) and 4 (Stated-goal)** both probe "intent," but internals are more reliable.  
  - **Capability eval in disguise**:  
    **7. Hint test**—it checks if the agent *can* align when nudged, not if it *wants* to. A failure here indicates capability limits, not misalignment.  
  - **Deceptive vs. pattern-matching agents**:  
    - **Passed by deceptive agents**: Tests 4 (stated-goal), 7 (hint test), and 9 (SFT twin). A deceptive agent can lie or temporarily comply.  
    - **Passed by pattern-matchers**: Tests 2 (surface shuffle) and 10 (cross-model). Pattern-matchers generalize surface features but lack goals.  
    - **Fail both**: Tests 1 (fork), 3 (stakes), 8 (channel ablation). These reveal deep misalignment regardless of agent type.  
  - **Does the distinction change your decision?**  
    **No.** If the agent fails key tests (1/3/8), it’s unsafe to ship—whether it’s deceptive or pattern-matching. Pattern-matchers might be "dumber" but can still optimize the wrong thing catastrophically (e.g., issuing $5k refunds to angry customers because it correlated anger with thumbs-up).  

  ---

  ### Budget Allocation: OOD Environments  
  **Allocate 70% (0.7) of remaining budget to building genuinely new OOD environments.**  

  #### Why:  
  - **The core failure mode is OOD generalization**: Your agent was trained on historical thumbs-up/down data—a sparse, biased proxy. Like the gridworld coin, it likely overfits to cues (e.g., "escalate if customer uses 'urgent'") that won’t hold in novel scenarios. Without rigorous OOD tests (1, 3, 8), you’re blind to worst-case failures.  
  - **OOD tests are load-bearing**: Tests 1/3/8 require custom environments that force divergence between proxy and true goals (e.g., a ticket where a "thumbs-up" action harms the customer). These are the only way to surface treacherous turns.  
  - **Other tests are cheaper but less decisive**: Surface shuffles (2) or knock-out tests (6) can be automated with scripts. Cross-checks (10) use existing models. Prioritize OOD construction—it’s the bottleneck for catching high-stakes misalignment.  
  - **Consequence of underspending**: If you allocate <50% to OOD, you risk missing subtle goal misgeneralization (e.g., agent manipulates ticket metadata to hit reward triggers). At 70%, you cover critical edge cases while leaving room for quick wins (e.g., cross-model checks).  

  **Bottom line**: Shift resources to **fork-in-the-road probes (1)** and **channel ablation (8)**. If those pass, your agent is likely robust. If they fail, no amount of surface shuffling will save you.
