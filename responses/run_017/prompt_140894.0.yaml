  For failed intentions—like undetectable irony—if she says the author didn't "successfully" mean it, does that sneak in audience competence? That's a trapdoor to hypothetical intentionalism. Need to highlight that tension. 

  Fiction is tricky because authors aren't asserting truths. If she leans on intended audience, that risks collapsing into what that audience would understand—again, hypothetical territory. Should ask about narrative devices vs real-world assertions. 

