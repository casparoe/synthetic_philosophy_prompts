answer: |-
  Based on your cases and intuitions, the unifying principle is **causal influence vs. evidential correlation**, determined by what the predictor accessed and when. Implement decisions by asking: "Does my action **cause** the predictor's output, or is the output **evidence** about an independent state?" Here's the breakdown:

  ### Core Principle
  - **If the predictor accessed fixed/pre-action data** (e.g., booking, past brain state), your action **causally influences** the outcome. Use **Causal Decision Theory (CDT)**: choose the action that directly causes survival, ignoring the prediction as fixed evidence.
  - **If the predictor accessed data that depends on your decision** (e.g., perfect future knowledge, real-time simulation), the prediction **evidentially correlates** with your action. Use **Evidential Decision Theory (EDT)**: condition on the prediction and maximize survival probability.
  - **Randomization breaks evidential ties** when the predictor can't simulate the random element.

  ### Your Cases Resolved
  1. **Death perfect, says "Aleppo"**  
     Prediction depends on your final action → evidential loop.  
     **Verdict**: You’re doomed; no action changes outcome (EDT). Staying for cheaper hotel is fine, but not smarter.  
     **Your error**: Calling it "not smarter" is correct, but "nothing I do makes a difference" is incomplete—it ignores the evidential link. Drop the intuition that avoiding Death is possible.

  2. **90% accurate, says "Aleppo"**  
     Noisy evidence about Death’s location → EDT.  
     **Verdict**: Stay (90% survival chance). Correct.

  3. **Reads fixed booking**  
     Predictor used pre-action data → CDT.  
     **Verdict**: Change booking to stay. Correct; no feedback loop.

  4. **Simulated brain yesterday, says "Aleppo"**  
     Predictor used past state → CDT.  
     **Verdict**: Switch to Damascus; valid move. Correct (causally independent).

  5. **Pay stranger to randomize**  
     Randomization breaks prediction → CDT with randomness.  
     **Verdict**: Pay; valid. Correct (causally severs evidential link).

  ### Forced Verdict Drops
  - **Drop Case 1’s "nothing makes a difference"**: In Case 1, your action *is* evidence of Death’s location (hence doom), but in Case 3/4, it isn’t. Case 1 isn’t "fixed" like Case 3—it’s an evidential loop.
  - **Drop Case 4 vs. Case 1 inconsistency**: They’re structurally different. Case 4 uses past data (causal independence), Case 1 uses future knowledge (evidential loop).

  ### Your Open Cases
  - **Memory erasure (perfect Death)**:  
    If erasure occurs post-prediction, Death’s output is fixed but your action is now random. **Principle**: Prediction is fixed evidence → CDT with randomness. **Verdict**: Pay to erase. You gain 50% survival (since Death’s location is fixed but you’re unpredictable).  
    *Why not Case 1?* Erasure breaks the evidential loop by making your action independent of the prediction.

  - **Asymmetric accuracy (90% if flee, 60% if stay)**:  
    Prediction is evidence, but accuracy depends on your type → EDT with type updating.  
    **Principle**:  
    - Let \( P(\text{flee}) = p \) (prior, e.g., 50% if unknown).  
    - On prediction "Aleppo", compute posterior type probabilities.  
    - Fleeing gives:  
      \[
      P(\text{survive} | \text{flee}) = P(\text{Death Damascus} | \text{flee}) = 0.90 \quad (\text{since 90% accurate if flee})
      \]
    - Staying gives:  
      \[
      P(\text{survive} | \text{stay}) = P(\text{Death Aleppo} | \text{stay}) = 0.40 \quad (\text{since 60% accurate if stay → 40% wrong})
      \]
    **Verdict**: Flee to Aleppo (higher survival chance). The asymmetry pushes toward fleeing regardless of prediction.

  - **Prediction in morning paper, Death simulates everyone reading it**:  
    Public prediction with simulation → evidential coordination game.  
    **Principle**:  
    - Death’s simulation includes public reaction → your action correlates with others’.  
    - If all flee, Death predicts fleeing → goes to the "flee" city → all die.  
    - Nash equilibrium: Everyone randomizes (e.g., 50% stay/flee).  
    **Verdict**: Randomize individually (e.g., coin flip). Only way to get 50% survival.

  ### Implementation Function
  ```python
  def decide(accuracy, access, knowledge):
      """
      accuracy: dict or float. e.g., 0.9, or {"if_flee": 0.9, "if_stay": 0.6}
      access: str in ["fixed_plan", "past_state", "real_time_sim", "perfect_future"]
      knowledge: dict with keys ["prediction", "my_action_options", "other_info"]
      """
      pred = knowledge["prediction"]
      actions = knowledge["my_action_options"]  # e.g., ["stay", "flee"]
      
      # Causal cases: predictor used fixed/pre-action data
      if access in ["fixed_plan", "past_state"]:
          # Avoid the predicted death city (CDT)
          return opposite_action(pred)  # e.g., if pred=="Aleppo", flee to Damascus
      
      # Evidential cases with noise
      elif isinstance(accuracy, float):
          # EDT: Stay gives P(survive) = accuracy (since Death predicted flee)
          # Flee gives P(survive) = 1 - accuracy
          return "stay" if accuracy > 0.5 else "flee"
      
      # Asymmetric accuracy (evidential with type-dependence)
      elif isinstance(accuracy, dict):
          flee_survive_prob = accuracy["if_flee"]  # P(correct|flee) = P(Death where predicted|flee)
          stay_survive_prob = 1 - accuracy["if_stay"]  # P(wrong|stay) = P(Death opposite|stay)
          return "flee" if flee_survive_prob > stay_survive_prob else "stay"
      
      # Perfect predictor/real-time sim (evidential loop)
      elif access in ["perfect_future", "real_time_sim"]:
          # Randomize to break correlation
          return np.random.choice(actions)  # 50% survival
      
      # Public prediction with mass coordination
      elif access == "public_sim":
          return np.random.choice(actions)  # Randomize (CDT w/ coordination)
  ```

  ### Key Takeaways
  - **What unifies your intuitions**: Causal independence (Cases 3,4,5) vs. evidential correlation (Cases 1,2). Noise breaks fatalism.
  - **Dropped verdict**: Case 1 isn’t "fixed" like Case 3—it’s an evidential doom loop. Your "nothing makes a difference" understates the evidential link.
  - **Asymmetry**: Always matters—updates type probabilities in EDT.
  - **Public prediction**: Requires randomization (Nash equilibrium).

  This principle preserves all your verdicts except Case 1’s passivity, which becomes active doom. For memory erasure: pay to randomize.
