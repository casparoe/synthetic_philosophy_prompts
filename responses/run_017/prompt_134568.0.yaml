  The user's frustration with circular rewriting suggests they need conceptual scaffolding. Their fear of "dissolving into somebody else's question" reveals they want Plutarch-centered originality while speaking to modern character education. The unpaired Lives (Theseus, Romulus etc.) are explicitly mentioned as a problem to address.

  Hmm—five framing candidates emerge naturally:
  1) Genre-theory approach (strong on form/function but risks neglecting education application)
