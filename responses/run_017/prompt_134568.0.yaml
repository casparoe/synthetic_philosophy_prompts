  3) Education-praxis angle (practical but could trivialize historical nuance) 
  4) Luck-vs-agency focus (philosophically rich but may oversimplify Plutarch)
  5) Reception-history method (safe but avoids their innovative contrast argument)

  The genre-theory/education hybrid wins because it locks onto their "pairing machine" metaphor while creating natural curriculum-design deliverables. The retrospective skill dilemma gets sidelined—it's profound but would balloon the scope.

  For the proposal structure: starting with Plutarch's own synkrisis passages as data anchors the close reading. Tackling the unpaired Lives as "control cases" is clever—shows methodological rigor. The month-by-month plan bakes in failure points (month 4 analysis paralysis; month 10 falsification test) which feels academically honest.

  Biggest risk is overclaiming about modern curricula. The deliverable—"contrast design principles"—needs to be framed as heuristic, not prescription. If by month 10 the Lives resist the character/circumstance separation consistently, that's honorable failure. Would still publish as genre critique.

  User's instinct to avoid modern-program testing seems right—that's a sequel project. Their voice in the query (e.g. "degenerate case of the form") should permeate the proposal; it's deliciously polemical in the best classical tradition.
answer: |-
  Here’s a structured proposal based on your core insights, designed for clarity, originality, and feasibility within 12 months. I’ve prioritized your pairing mechanism hypothesis while strategically sidelining the retrospective skill question (with rationale).  

  ---

  **Brainstorming: Candidate Framings**  
  1. **Framing A: Genre Theory**  
     *Promise:* Explains *why* pairing is structurally essential to Plutarch’s didactic project.  
     *Problem:* Risks becoming formalist, sidelining moral psychology.  
  2. **Framing B: Cognitive Scaffolding**  
     *Promise:* Uses contrast-as-tool to link ancient practice to modern learning theory.  
     *Problem:* Might reduce Plutarch to a "case study" for external theories.  
  3. **Framing C: Moral Epistemology**  
     *Promise:* Positions synkrisis as a method for discerning agency vs. contingency.  
     *Problem:* Overly abstract; hard to operationalize in close reading.  
  4. **Framing D: Reception/Praxis**  
     *Promise:* Asks how *actual readers* extract virtue from paired contrasts.  
     *Problem:* Speculative without reader-response evidence.  
  5. **Framing E: Against Exemplarity**  
     *Promise:* Positions Plutarch as *critiquing* exemplar-based ed via structure.  
     *Problem:* May overstate his iconoclasm; ignores positive aims.  
  6. **Framing F: Education Design**  
     *Promise:* Treats Lives as a "curriculum" for character discrimination skill.  
     *Problem:* Anachronistic if forced; fruitful if focused on textual mechanics.  

  **Chosen Framing: Hybrid of A, C, and F**  
  *Why:* It centers your key innovation (pairing as sorting mechanism), embeds it in genre context (A), clarifies the epistemic skill gained (C), and bridges to modern applications via structure (F). Avoids dissolving Plutarch into modern theory while creating education-relevant deliverables.  

  ---

  **PROPOSAL: PLUTARCH’S PAIRING MACHINE**  
  **Character Discrimination and the Architecture of Contrast in the Parallel Lives**  

  **Core Question**  
  *How does the deliberate pairing of Greek and Roman lives in Plutarch’s synkriseis train readers to distinguish stable character virtues from contingent factors (political office, cultural context, fortune), and why does this structural feature render the work resistant to hagiographic misreading?*  

  **Why the Standard Debate Misses This**  
  The existing polemic fixates on the *single life* as the unit of instruction. Proponents see isolated exemplars; critics see airbrushed idols. Both assume biography’s didactic power resides in *individual portrayal*. This overlooks Plutarch’s core innovation: the *synkrisis* (comparison) is not an appendix but the pedagogical engine. By forcing a structured juxtaposition (e.g., Alexander-Caesar, Demosthenes-Cicero), Plutarch compels readers to perform a specific cognitive operation: sifting the enduring *ēthos* from ephemeral *tyche* or *polis*. Hagiography isn’t merely distorted; it’s *structurally incomplete* because it removes the contrastive friction necessary for discrimination. This reframes the educational object: not emulation of a person, but honing a *skill of discernment*.  

  **Methodology & 12-Month Work Plan**  
  **Month 1-2: Foundation & Framework**  
  *   Deep dive into 5-6 key synkriseis (e.g., *Alexander-Caesar*, *Demosthenes-Cicero*, *Lycurgus-Numa*) to map recurring contrastive axes (e.g., ambition vs. self-control, civic context, response to fortune).  
  *   Define key analytical categories: *Character* (stable dispositions), *Circumstance* (office, cultural norms), *Contingency* (luck, historical accident).  
  *   Develop coding rubric for identifying how Plutarch attributes causes of success/failure across these categories within comparisons.  

  **Month 3-5: Core Analysis - The Synkriseis**  
  *   Close reading and coding of **all 18 formal synkriseis**.  
  *   Focus: How Plutarch *distributes* praise/blame across the pair. Does he attribute similar outcomes to different causes? Does he attribute divergent outcomes to character despite similar circumstances (or vice versa)?  
  *   Output: Taxonomy of "contrastive moves" (e.g., "shared virtue, divergent fortune"; "similar crisis, divergent character response").  

  **Month 6-7: Handling the Unpaired Lives & Genre Mechanics**  
  *   Analyze the 4 unpaired lives (*Artaxerxes*, *Galba*, *Otho*, *Aratus* – treating *Theseus-Romulus* as a de facto pair).  
  *   Key Question: Do these lack internal/explicit contrast, making character attribution harder or different? Are they more prone to seeming fragmented or "hagiographic" (e.g., *Artaxerxes*)?  
  *   Compare narrative techniques in unpaired vs. paired Lives: Is there more authorial intervention to *create* implicit contrast where pairing is absent?  

  **Month 8-9: Testing Limits & Implications**  
  *   **Falsification Test**: Identify Lives where character *is* overwhelmed by circumstance despite Plutarch’s method (e.g., *Nicias*?). Does the pairing still aid discernment?  
  *   **Hagiography Test**: Examine later reception (briefly) or modern adaptations where Lives are presented singly. Does the perceived lesson shift towards deference/simplification?  
  *   **Skill Articulation**: Precisely define the *discriminative skill* Plutarch cultivates: e.g., "Resisting attribution error when evaluating agency in complex historical action."  

  **Month 10-11: Bridging to Character Education**  
  *   **Deliverable Construction**: Translate Plutarch’s contrastive mechanics into "design principles" for modern character education:  
      *   Principle 1: **Mandated Juxtaposition** (Teach virtues via *contrasted* cases, not isolated paragons).  
      *   Principle 2: **Multi-Axis Comparison** (Explicitly compare across context, luck, and choice).  
      *   Principle 3: **Degeneracy Warning** (Single exemplars risk collapsing character into outcome/status).  
  *   Contrast with flawed modern practices (e.g., "Hero of the Month" posters).  

  **Month 12: Synthesis & Writing**  
  *   Finalize argument: Plutarch’s pairing isn’t decorative but *constitutive* of his moral psychology.  
  *   Draft chapter: "Beyond Exemplars: Contrast as Moral Discernment Technology."  

  **Why This Route Beats the Alternatives**  
  *   **Vs. General Case-Learning Theory:** Avoiding this prevents subsuming Plutarch under (e.g.) cognitive schema theory. Your focus is on *his unique textual mechanism*, generating insights *from* the text to *inform* theory, not vice versa.  
  *   **Vs. Testing on Modern Programs:** This is a valuable *next* step. Doing it now would dilute the deep philological work needed to prove your core Plutarchan thesis. The "design principles" deliverable provides the *bridge* for future empirical testing.  

  **Possible Conclusions & Triggers**  
  1. **Confirmed:** Synkriseis systematically train character/circumstance discernment. *Writing Trigger:* Consistent patterns of distributed attribution across pairs + unpaired Lives lacking this clarity.  
  2. **Refined:** Pairing mitigates but doesn’t eliminate hindsight bias/biographer’s privilege. *Writing Trigger:* Evidence that Plutarch *uses* hindsight to frame contrasts meaningfully, not just to judge.  
  3. **Limited:** Discernment skill is evident but secondary to rhetorical or political aims. *Writing Trigger:* Synkriseis show inconsistency or prioritize cultural polemic over moral psychology.  
  4. **Falsified:** Pairing serves primarily aesthetic/nationalistic goals; discernment is minimal or accidental. *Writing Trigger:* No coherent pattern in attribution; unpaired Lives show equal discernment potential.  

  **Useful Deliverable for Educators**  
  A concise "**Contrastive Character Pedagogy Primer**" (appendix or stand-alone):  
  *   Diagnoses the pitfalls of single-exemplar teaching (deference, oversimplification, outcome bias).  
  *   Offers 3-4 practical protocols derived from Plutarch: e.g., "Always teach a virtue with *two* contrasting case studies," "Use comparison tables focusing on *choices vs. constraints*," "Discuss how context might change the virtue’s expression."  

  **Failure Condition (Month 10)**  
  The project fails if close analysis reveals:  
  1. Plutarch’s attributions in synkriseis are arbitrary, inconsistent, or overwhelmingly determined by cultural bias (not discernment).  
  2. The unpaired Lives demonstrate *equivalent* capacity for character/circumstance sorting using other techniques, undermining pairing’s necessity.  
  3. No meaningful "discernment skill" can be coherently extracted from the comparisons.  
  *Failure Outcome:* Pivot chapter to a narrower genre study on synkrisis function, shelving education links and broader claims.  

  **Scope & The Second Half**  
  **Verdict:** Including the "retrospective skill/biographer’s privilege" argument *in full* makes this **too big for one year**. It introduces a separate (though fascinating) epistemological problem requiring its own theoretical framework (narrative time, hindsight bias historiography).  
  **Solution:**  
  1. **Mention Briefly:** Acknowledge the issue in the introduction/framework as a *limitation* of biography that Plutarch’s pairing *may* mitigate.  
  2. **Incorporate Selectively:** If a specific synkrisis (e.g., *Alexander-Caesar*) explicitly discusses divergent paths from similar starts, analyze it as *one mode* of contrast aiding prospective judgment.  
  3. **Save for Later:** Flag it as a crucial direction for future work – the *next* chapter or article.  

  **Final Rationale for Approach**  
  This proposal leverages your sharpest insight – pairing as a structural prerequisite for discernment – into a novel, textually grounded argument. It delivers both scholarly innovation (recasting the Plutarch debate) and actionable value (principles for educators). By meticulously analyzing the *synkriseis* as the core data and using the unpaired Lives as a control group, it offers a rigorous, completable project that firmly establishes Plutarch as a theorist of moral discrimination, not just a purveyor of heroes.
