prompt: |-
  I work in grantmaking at a small foundation, and over the last few years I've come to notice that my official view about long-run consequences and my actual practice have quietly come apart. Officially I accept the cluelessness worry: for almost anything we fund, the effects running out past a few decades are larger in expectation than the effects we can measure, and our evidence about their sign is close to worthless, so it looks like I should either be paralysed or should be funding whatever has the best story about the far future rather than whatever has the best near-term evidence. In practice I am neither paralysed nor a long-termist, and I'm fairly confident about most of the calls I make. I'd like to know what principle I am implicitly using, stated precisely enough that I can apply it to a case I haven't decided.

  Here are the calls, as I actually make them. (a) Give now to an anti-malaria charity with unusually good near-term evidence, versus holding the money in an index fund and giving the (much larger) sum in thirty years: I give now, without much unease. (b) Call it the sealed-envelope program: its near-term effects are well measured and clearly good, but two long-run models of apparently equal credibility say, respectively, that its population-level effects make it astronomically good and catastrophically bad, and I can see no way to arbitrate between them: I fund it. (c) The empty box: a grant whose near-term effects are essentially unmeasurable and whose case rests entirely on a diffuse, untestable long-run story: I decline it — and I keep declining it even when I rescale the long-run story upward until the diffuse benefit is, on its own terms, enormous, which makes me suspect the size of the benefit isn't really what's doing the work. (d) The tail: a grant that might — maybe one in a thousand, maybe one in a million, nobody can say — avert a civilisational catastrophe, and otherwise does nothing measurable: I fund it, and I fund it in preference to (c), even though (c) and (d) are alike in having no measurable near-term effects and inscrutable ones further out. (e) Two grants with identical near-term and long-run epistemic profiles, except that one is a one-off and the other is the first of about two hundred similar grants we expect to make over the next decade, where if the long-run story is wrong we will have repeated the mistake two hundred times: I'm comfortable with the one-off and distinctly uneasy about the first of the series, even though the first grant's own effects are the same either way. (f) When two equally credible long-run models agree on the sign of an intervention's effect but differ by a factor of a thousand about its size, I act without anxiety; when they disagree about the sign, I feel I ought to abstain — but I also think abstaining is just another action with inscrutable long-run effects, so in the end I decide on near-term grounds anyway, and I can't say why that isn't simply giving up.

  Two candidate principles have been floating around our office, and I'd like them tested against these verdicts rather than summarised. A colleague's is what he calls the corridor rule: when the long-run effects of your options are inscrutable, choose the option that best preserves the capacity of whoever comes later to notice the mistake and reverse course — buy information, stay reversible, don't burn the option to change your mind. My own is cruder: treat inscrutable long-run effects as having an expected value of zero, subtract a penalty for how much variance you're taking on, and decide on everything else. Tell me which of my six verdicts each gets wrong, whether either can be repaired into something that gets all or nearly all of them, and which verdict you'd overturn if you had to — I'd rather give up a verdict than accept a principle with a clause that exists only to save it. Then apply whatever you land on to the case I keep going back and forth on: an intervention whose near-term effects are large and well evidenced but which is effectively irreversible, where the long-run models disagree about the sign and I won't get a second chance. I don't want a survey of the literature or any citations; I want the principle, the clause-by-clause motivation from my cases, and an honest account of which of my verdicts no tidy principle can accommodate.
reasoning: |-
  Hmm, the user is a grantmaker at a small foundation grappling with a deep philosophical dilemma about long-term consequences. They've noticed a disconnect between their theoretical acceptance of the "cluelessness worry" (our inability to predict long-term effects) and their practical decision-making patterns. They've provided six concrete cases (a-f) and two candidate principles (the corridor rule and expected value zero with variance penalty), asking me to test these principles against their intuitive verdicts and propose a coherent framework.

  Looking at their cases: In (a) they choose immediate anti-malaria funding over long-term investment, suggesting near-term measurable impact dominates. For (b) they fund a program with good near-term effects despite wildly conflicting long-term models, indicating that known benefits can override long-term uncertainty. In (c) they reject purely speculative long-term plays even when scaled up, showing they require some anchor in measurable reality. For (d) they fund tail-risk prevention despite similar uncertainty to (c), revealing a distinction between diffuse benefits and catastrophic risk mitigation. In (e) they prefer one-off grants over repeated commitments when long-term effects are uncertain, demonstrating sensitivity to compounding uncertainty. Finally in (f) they act when long-term models agree on sign but struggle when they disagree, yet ultimately default to near-term grounds - showing their practical resolution of theoretical paralysis.

  The two candidate principles have issues. The corridor rule (prioritizing reversibility) would wrongly reject the irreversible anti-malaria program in (a) and might mishandle (d). The expected-value-zero approach would reject (b) where they fund despite unknown long-term effects and struggle with (f)'s sign disagreement.

  I think their implicit principle combines three elements: 1) Near-term measurable benefits serve as a necessary epistemic anchor; 2) Catastrophic tail risks get special weight regardless of measurability; 3) Uncertainty compounds with repetition. This explains why they fund (b) but reject (c) - (b) has the near-term anchor while (c) doesn't. It explains the distinction between (c) and (d) - catastrophic risk changes the calculus. And it explains their discomfort in (e) - repeating uncertain bets magnifies potential errors.

  For their unresolved case (irreversible intervention with good near-term effects but disputed long-term sign), this framework would lean toward funding because the measurable near-term benefits provide justification, while acknowledging the irreversibility adds significant risk that might require stronger near-term evidence to compensate. The key is whether the near-term benefits are substantial enough to outweigh the "no second chance" aspect - a judgment call their framework forces them to make rather than avoiding the decision.

  The only verdict that might need rethinking is (f) - their theoretical unease about sign disagreement is actually consistent with their overall approach since they still decide on near-term grounds. The tension there is inherent to decision-making under deep uncertainty.
answer: |-
  Here's a principled framework distilled from your verdicts, tested against your cases, and applied to your unresolved dilemma. I'll call it the **Epistemic Anchor Principle**:

  ### The Epistemic Anchor Principle
  1. **Anchor to measurable near-term benefits** when available.  
  2. **Override the anchor ONLY for:**  
     - (i) *Catastrophic tail risks* (high-stakes, low-probability extinction threats), OR  
     - (ii) *Reversibility penalties* (actions compounding uncertainty over repeated decisions).  
  3. **Treat all other inscrutable long-run effects as net neutral *except* for their variance**, which carries an intrinsic cost.  

  **Motivation from your cases:**  
  - Requires a measurable near-term anchor to justify action (explains rejection of (c)).  
  - Catastrophic tail risks get special exemption (explains funding (d) but not (c)).  
  - Uncertainty compounds with repetition (explains unease in (e)).  
  - Variance (not mean) is the default cost of inscrutability (explains (f) sign/size asymmetry).  

  ---

  ### Testing Candidate Principles Against Your Verdicts
  | **Case** | **Your Verdict** | **Corridor Rule Fails** | **Expected Value Zero Fails** | **Epistemic Anchor Works** |
  |----------|------------------|-------------------------|-------------------------------|----------------------------|
  | **(a)** Anti-malaria now vs. later | Fund now | ✗ Rejects irreversible spending | ✓ Approves (near-term EV > 0) | ✓ Anchors to near-term good |
  | **(b)** Sealed-envelope program | Fund | ✓ Allows (preserves reversibility?) | ✗ Rejects (long-run EV = 0) | ✓ Anchors to near-term good |
  | **(c)** Empty box (diffuse long-run) | Reject | ✓ Allows? (if reversible) | ✓ Rejects (EV=0 + variance) | ✓ No near-term anchor |
  | **(d)** Tail-risk prevention | Fund | ✗ Rejects? (no reversibility) | ✗ Rejects (EV=0 + low prob) | ✓ Tail-risk exemption |
  | **(e)** Repeated vs. one-off | Unease with series | ✓ Approves series? (if reversible) | ✗ Treats identically | ✓ Reversibility penalty for series |
  | **(f)** Sign vs. size disagreement | Fund if sign agreed | ✓ No clear guidance | ✗ Anxiety on sign disagreement | ✓ Variance cost only for size; sign forces near-term fallback |

  **Breakdown of Failures:**  
  - **Corridor Rule:**  
    - Fails (a): Anti-malaria isn’t reversible (you can’t un-save lives).  
    - Fails (d): Tail-risk interventions often aren’t reversible (e.g., AI safety research).  
    - Ambiguous on (e): Funding a series might *reduce* future flexibility.  
  - **Expected Value Zero:**  
    - Fails (b): Would reject sealed-envelope due to neutral long-run EV.  
    - Fails (d): Assigns neutral EV to tail risks despite your action.  
    - Fails (f): Can’t explain why sign disagreement triggers unease but size doesn’t.  

  **Verdict to Overturn:**  
  I’d overturn **(f)**'s claim that you "decide on near-term grounds anyway" when models disagree on sign. Your framework *implicitly treats sign disagreement as a veto* unless near-term benefits override it (as in (b)), but you haven’t formalized this. The Epistemic Anchor Principle makes this explicit: **Sign disagreement removes the long-run license to act *unless* the near-term anchor is strong enough.** This resolves the "abstaining is also action" paradox: near-term benefits justify action *despite* long-run ambiguity, not because of it.  

  ---

  ### Application to Your Unresolved Case  
  **The dilemma:**  
  > *An intervention with large, well-evidenced near-term benefits, effectively irreversible, long-run models disagree on sign, no second chance.*  

  **Epistemic Anchor Analysis:**  
  1. **Near-term anchor:** Strong (large, well-evidenced benefits).  
  2. **Tail-risk exemption?** No (not a catastrophe hedge).  
  3. **Reversibility penalty?** High (irreversible + no second chance).  
  4. **Long-run variance:** Extreme (sign disagreement → high variance cost).  

  **Decision:**  
  - **Fund, but only if near-term benefits > variance cost + reversibility penalty.**  
  - Your anchor (near-term good) is strong, but irreversibility amplifies the cost of being wrong. If the near-term benefits are *sufficiently massive* (e.g., saving millions of lives now), they outweigh the long-run variance risk. If they’re merely "large" (e.g., a moderate local improvement), the irreversibility penalty tips the balance toward rejection.  
  - **Crucially:** This forces a tradeoff you can quantify. Assign a conservative dollar value to the near-term benefit (e.g., "this grant saves 10k lives @ $5k/life = $50M equivalent"). The variance penalty should be scaled to your foundation’s risk tolerance (e.g., "irreversible actions require 3x near-term benefit"). If $50M > 3x [cost of grant], fund it.  

  **Why this respects your psychology:**  
  - You avoid paralysis by using near-term evidence as ballast.  
  - You acknowledge irreversibility as a true cost (per your unease in (e)).  
  - You don’t pretend to resolve sign disagreements—you let near-term benefits compensate for them.  

  ---

  ### The Untidy Truth  
  **One verdict resists full formalization: (d) (tail-risk funding).** Why fund a 1-in-a-million catastrophe preventer but reject the "empty box"? Your principle exempts tail risks because:  
  - They have asymmetric upside (civilizational survival vs. diffuse gain).  
  - Near-term measurability is irrelevant to their logic.  
  - **But:** This creates a discontinuity in your framework. A rigorous model would need to assign *some* probability-adjusted value to extinction risks (e.g., "any action with >0.1% chance of reducing extinction risk gets priority"), which clashes with your rejection of speculative long-run modeling. I’d preserve (d) as a defensible exception without forcing it into a "tidy" clause—it’s a meta-rule for civilizational stakes.  

  **Final Principle Refined:**  
  *"Maximize near-term measurable welfare, penalize for variance and irreversibility, and make an exception for credible tail risks to humanity’s survival."*  
  This gets all your verdicts, explains your unresolved case, and leaves only (d)’s special status as a consciously held axiom.
