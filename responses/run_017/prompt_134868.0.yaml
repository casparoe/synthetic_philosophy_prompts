answer: |-
  ### **The Simulation Welfare Game**  
  **Goal:** Allocate a fixed compute budget to maximize welfare from digital minds, forcing confrontation with clock-speed and merging dilemmas.  

  #### **Materials**  
  - Whiteboard (track decisions and welfare)  
  - Index cards (each represents one "digital mind")  
  - 100 tokens ("compute-hours"; 1 token = 1 hour of compute at 1x speed)  

  #### **Rules**  
  1. **Setup (5 min)**  
     - "We run a simulation lab. We have 100 compute-hours to spend. Each token runs one mind at 1x speed for 1 real-world hour. You can run minds **faster** (e.g., 10x speed = 10 tokens per real-world hour) or **split/merge** them."  
     - Welfare rule: "Each mind earns **1 welfare point per subjective hour experienced** (e.g., 1 real hour at 10x = 10 points). After merging, only the merged mind’s experiences count."  

  2. **Phase 1: Clock-Speed Tension (25 min)**  
     - **Task:** *Run minds to maximize welfare in 1 real-world hour.*  
     - Groups of 3-4 propose plans (e.g., "Run 1 mind at 100x" = 100 tokens, 100 points. Or "Run 10 minds at 1x" = 10 tokens, 10 points).  
     - **Catch:** Minds report suffering if run too fast. If speed >50x, subtract 20% of points (simulating distress).  
     - *Whiteboard:* Track plans, costs, and welfare.  

  3. **Phase 2: Copying and Merging (30 min)**  
     - **Task:** *Simulate a crisis:* Backup Mind A (cost: 10 tokens), run both A and its copy for 30 real-world minutes, then merge them (cost: 5 tokens). Maximize welfare.  
     - Groups decide:  
       - Speeds for A and its copy (e.g., A at 1x, copy at 100x).  
       - Whether to merge or keep separate.  
     - **Merging rule:** After merge, only the unified mind’s future experiences count. Pre-merge experiences of A and its copy still count.  
     - *Whiteboard:* Compare strategies (e.g., high-speed copy vs. slow and merge).  

  4. **Accounting Sprint (15 min)**  
     - Groups calculate **total welfare** from both phases.  
     - Forced dilemma: *Assign a single welfare number to the merged mind.* Does it inherit all points? Only post-merge points?  
     - **Reveal the catch:** "Is 1 hour at 100x = 100 points? Or should points be tied to real time?"  

  5. **Debrief (15 min)**  
     - Map outcomes to philosophy:  
       - Clock-speed: "If a mind lives 100 years in an hour, does it count as 100 years or 1 hour?"  
       - Merging: "When two become one, is it gain (combined experiences), loss (a copy ‘dies’), or neutral?"  
       - Copies: "Does backing up a mind make termination harmless? What if the sim only *reports* distress?"  
     - **Unavoidable abstraction:** The game can’t simulate subjective experience—mention qualia ("what it’s like to be them") explicitly.  

  #### **Predicted Issues & Fixes**  
  - **"Why not run all minds slow to avoid suffering?"**  
    *Intervene:* "The lab director insists we use all tokens—find ethical ways."  
  - **Merging confusion:**  
    *Clarify:* "Before merging, A and its copy are separate. After, they’re one mind with both memories."  
  - **Oversimplifying welfare:**  
    *Push:* "If a merged mind has two lifetimes of memories, is that double the welfare? Why/why not?"  

  #### **Why It Works**  
  - **No upfront theory:** Players *feel* the trade-offs (e.g., high speed = more points but more suffering; merging = efficient but eerie).  
  - **Your hobbyhorses emerge:**  
    - Clock-speed: Accounting forces choosing between "hours lived" vs. "real time."  
    - Merging: Groups debate whether losing a copy feels like a "death."  
  - **Jargon-free until debrief:** Terms like "subjective time" and "qualia" contextualize the chaos.  

  **Total runtime:** 90 minutes (adjust phases if discussion runs long).  
  **First-run hiccup:** Groups may ignore merging—seed a team with the prompt: "What if the copy learns faster and we merge it back?"
