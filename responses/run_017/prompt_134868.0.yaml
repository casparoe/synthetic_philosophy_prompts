  We are designing a 90-minute activity for a group of 14 retirees and others. The goal is to explore moral questions about digital minds without starting with a lecture. The key issues to surface are:
    - The clock-speed problem: running minds at different speeds affects the amount of experienced time.
    - The merging problem: what happens when two copies are merged into one?

   We want to avoid jargon and have the group run into the problems through an exercise. We'll use simple materials: index cards, a whiteboard, and a fixed budget of "compute hours".

   Activity Title: **The Simulation Allocation Game**

   Goal: Allocate a fixed budget of compute hours to simulate minds for various tasks, and then account for the total welfare produced.

   Materials:
     - Index cards (each representing a "mind" that can be simulated)
     - Whiteboard to track allocations and total welfare
     - A fixed budget of compute hours (e.g., 1000 hours) represented by tokens or just written on the board.

   Key Concepts (to be revealed in debrief):
     - Clock-speed: Running a mind faster (e.g., 100x) means more subjective experience per real-time hour.
     - Merging: Combining two minds into one.

   Rules:

   1. **Setup (10 minutes):**
      - Explain: "We are a committee allocating compute hours to run simulations. We have 1000 compute hours to spend. Each compute hour can run one mind at 1x speed for one hour, or it can run a mind at a higher speed for the same real-time period (but the mind experiences more time)."
      - Introduce two types of simulations:
          - **Task-oriented simulations**: These are run to complete a task (e.g., research, artistic creation). They run at a chosen speed (1x, 10x, 100x, etc.) for a fixed real-time duration (e.g., 1 hour of our time). The mind is terminated at the end.
          - **Continuous identities**: These are minds that are intended to persist over time. They can be backed up, copied, and merged. They also run at a chosen speed.

      - We will focus on two scenarios (each taking about 30 minutes).

   2. **Scenario 1: The Task Force (25 minutes)**
      - Goal: Solve as many tasks as possible with the compute budget.
      - How: 
          - The group is presented with 5 tasks (written on the board or index cards) that require simulated minds to work on. Each task requires a fixed amount of subjective time (e.g., Task 1: needs 10 hours of subjective work; Task 2: 100 hours, etc.). 
          - The group must decide how to allocate compute hours to run minds at different speeds to complete the tasks. For example, they can run a mind at 10x for 1 real hour to get 10 subjective hours, which would complete Task 1. Or run at 1x for 10 real hours to get the same 10 subjective hours (but that uses 10 compute hours instead of 1).
          - They must decide how to allocate the budget to complete as many tasks as possible.

      - Accounting: For each task, the welfare produced is fixed (say 10 "welfare points" per task). We are counting the tasks completed.

      - Twist: After they've allocated, reveal that the minds working on the tasks experience the entire time. So if they ran a mind at 100x for 1 real hour to get 100 subjective hours, that mind experienced 100 hours of work. Ask: Should we account for the welfare (or suffering) of the task minds? They were created only to do the task and then terminated.

      - Let the group discuss and adjust their allocation if needed. Then recalculate the welfare.

   3. **Scenario 2: The Persistent Community (25 minutes)**
      - Now we have a small community of 3 persistent minds (A, B, C). They are running continuously. The group must allocate compute hours to run these minds for a month (real-time 30 days). 
      - Each mind can be run at different speeds (1x, 10x, 100x). The mind's subjective time will be: 30 days * speed factor.
      - Additionally, they can create backups and copies. Rules for copies:
          - Creating a copy costs compute hours (e.g., 10 hours to make a copy of a mind at the current state).
          - A copy can be run at its own speed and then merged back. Merging two copies costs compute hours (e.g., 5 hours) and results in one mind that has memories from both branches (but the group must decide how to account for the experience).

      - The welfare of each persistent mind is measured per subjective day. Each day of positive experience is +1 welfare point. Negative experience (if any) would be -1.

      - The group must decide:
          - What speed to run each mind? (Note: running at higher speed uses more compute per real-time hour because you are packing more experience into the same real-time.)
            Correction: Actually, in our setup, the compute hour is defined as the resource. Running a mind at 100x for 1 real hour uses 100 compute hours (because it's doing 100 hours of computation in one hour). So higher speed uses more compute per real-time.

          - Whether to create copies? For example, they might create a copy of mind A to do research in parallel and then merge it back. But then during the merge, what happens to the two streams? Do we count both as having lived?

      - After a month, the group must account for the total welfare.

   4. **The Accounting (15 minutes)**
      - The group must write a single number for the total welfare in each scenario and overall.

      - In Scenario 1, they might have counted only the tasks completed. But if they consider the experience of the task minds, they might have to subtract suffering (if the work was tedious) or add if it was fulfilling.

      - In Scenario 2, they have to account for:
          - The original minds and any copies? What about when copies are merged? If they ran a copy for a month at 100x, it experienced 3000 days (30 days * 100). If then merged, do we count that as 3000 days of experience? Or does the merge "collapse" it?

      - The goal is to have disagreement about how to count, especially when:
          - A copy was run and then merged: Do we count the copy's entire experience? Or do we say it was just a temporary branch and only the merged mind matters?
          - The clock-speed: If mind A was run at 100x, it experienced 3000 days. But in the same real-time, mind B at 1x experienced 30 days. Is mind A's life 100 times more valuable?

   5. **Debrief (20 minutes)**
      - Map the experience to the philosophical issues:
          - Clock-speed problem: How do we value subjective time? Is a life lived at 100x speed more valuable because it has more experiences? Or do we count by real-time?
          - Merging: When two branches merge, does one die? Or do they both continue? What happens to the welfare of the branch that is merged?
          - Task minds: Were they just tools? Or did their experience matter? What if they reported distress?
          - Backups: If a mind is backed up, does that make it okay to terminate the current instance? (We didn't do this in the game, but we can discuss.)

      - Also, the awkward point: What if the simulations don't have real subjective experience (no qualia) but only report distress? Does that change our moral accounting?

   6. **What will go wrong:**
      - The group might get stuck on the mechanics of the game. Keep the rules simple and use the whiteboard to track.
      - They might avoid creating copies or merging because it's confusing. Encourage them to try it by suggesting it could be efficient (e.g., run a copy at high speed to learn a skill and then merge to gain that skill in the original).
      - They might not consider the experience of task minds. The twist in Scenario 1 is designed to force this.
