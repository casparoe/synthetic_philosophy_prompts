prompt: |-
  Hi — I'm putting together a dissertation prospectus and I keep getting stuck before I start. The topic is dispositions, but my angle is applied: I care about how the special sciences and ordinary speech get away with dispositional predicates ("this compound is hepatotoxic", "this cultivar is drought-tolerant", "he's irritable", "that bylaw is unenforceable"), and I want a metaphysics of dispositions good enough to underwrite attributions like those — not one tailored to win arguments in a seminar room. So before I pick a theory, can you write me the spec: the desiderata any adequate theory of what it is for something to have a disposition has to meet for that purpose, each with the case or consideration that motivates it, and each marked as either non-negotiable or as a preference of one camp?

  I know the two stock problem cases, so give them a line each at most: the fink (the glass would lose its fragility at the instant you dropped it) and the mask (it stays fragile, but something interferes so it never breaks). The cases I actually can't get any single theory to handle together are these, and I'd like your list built partly around them: (1) the one-shot mask — packing foam that absorbs the impact but is destroyed in doing so, so the second drop does shatter it, which means any analysis that just asks what happens on the stimulus occurring will call the glass not fragile; (2) the booster, i.e. an inverse fink — a tablet that is not water-soluble in the bottle, but where contact with water itself triggers a change that makes it dissolve, so it dissolves while intuitively never having been soluble; (3) self-annealing glass — you strike it, it micro-cracks, a built-in mechanism instantly re-bonds it, and the next strike would micro-crack it again, so the interfering condition is intrinsic to the object rather than something done to it; (4) the permanently packed vase — fragile, but the packing is never coming off and nothing will ever strike it, where I want to know what a theory is even allowed to say distinguishes this from a vase that simply isn't fragile; (5) the partner problem — solubility needs a solvent and fragility needs something to be struck against, and whether the partner goes inside the stimulus or stays in the background changes what the theory predicts, with "dropped on a pillow" and "dropped on concrete" looking like a continuum rather than a masked/unmasked divide; (6) quiescent dispositions — the stabilizer, the prophylactic, the drug disposed to prevent the headache — where the manifestation is nothing happening at all; (7) second-order cases, things disposed to acquire dispositions (a vaccine, a seed that needs cold stratification before it can germinate), where whatever analysis you give has to iterate; and (8) impossible-stimulus cases, like being soluble in a solvent that no where exists or conductive at a temperature the laws never permit.

  The part I most want is the editorial judgment: which of the things people demand of a theory here are genuine requirements and which are just prejudices of a camp — non-circularity, intrinsicality, the demand that every disposition be grounded in a categorical base, the ban on quantifying over merely possible interventions or ideal conditions, the demand that dispositions make a difference to what actually happens. Then flag any pair of desiderata you suspect can't be jointly satisfied, because if the list turns out to be unsatisfiable as a whole that's the result I'd rather have now than in year three. Tell me which single requirement does the most exclusionary work. A very brief score of the three live options is fine at the end — the plain conditional analysis, the conditional analysis with a ceteris paribus or ideal-conditions clause, and the view that drops conditionals and identifies the disposition with its causal basis — but keep the weight on the criteria and the cases, since I can do the scoring myself. A table is fine if that's easier, and please say something about how a theory is supposed to cope with the fact that fragility and solubility obviously come in degrees and the manifestation verbs are vague, since I suspect that's the requirement everyone quietly ignores.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on a dissertation prospectus about dispositions, focusing on real-world applications in special sciences and ordinary language. They have several problem cases that existing theories struggle with, and they want a set of desiderata to evaluate theories. 

  First, I need to identify the core issues. The user mentions eight specific cases: one-shot mask, booster, self-annealing glass, permanently packed vase, partner problem, quiescent dispositions, second-order cases, and impossible-stimulus cases. Each of these challenges different aspects of dispositional theories. The user also wants to know which desiderata are essential vs. preferences of certain camps, and whether any conflicts make the desiderata unsatisfiable.

  The user's deeper need seems to be avoiding theoretical dead-ends in their dissertation. They want a framework robust enough for applied contexts, not just philosophical debates. So, the desiderata must bridge metaphysics with practical usage. 

  Looking at the problem cases, each highlights a gap. For example, the one-shot mask involves a single-use mask, which challenges stimulus-response models. The booster is an inverse fink, where the disposition activates only upon stimulus. Self-annealing glass introduces intrinsic masks, complicating intrinsicality. The permanently packed vase questions the role of actual manifestations. The partner problem blurs stimulus vs. background conditions. Quiescent dispositions involve non-events as manifestations. Second-order dispositions need recursive analysis. Impossible stimuli test modal robustness.

  Next, the editorial judgments: Non-circularity seems non-negotiable to avoid vacuity. Intrinsicality might be a preference since extrinsic dispositions exist (like needing a partner). Grounding in categorical bases could be a camp preference; some theories allow pure dispositions. Quantifying over possible interventions is necessary for modal force but must be non-vacuous. Making a difference to actual events is tricky—some dispositions never manifest but still hold.

  Conflicts likely arise between Intrinsicality and Partner-Relativity (if partners are extrinsic), and between Non-Vacuous Modality and Impossible Stimuli (can't have non-vacuous conditions for impossible stimuli). Also, Actual Difference vs. Permanent Masking conflicts when dispositions never manifest.

  Degree-Gradedness and Semantic Flexibility are crucial for real-world applications but often overlooked. Theories need to handle vagueness and degrees without precise thresholds.

  For theories: Plain conditionals fail most cases. Ceteris paribus conditionals handle masking but struggle with vacuosity. Causal Basis views avoid conditionals but face partner problems and grounding regress. 

  The user's key need is a clear set of criteria to evaluate theories, highlighting where compromises are necessary. They need to know which problems are deal-breakers and which can be managed. The exclusionary desideratum is Non-Vacuous Modality—it forces theories to address modal robustness without triviality.
answer: |-
  Here's a distilled spec for your applied metaphysics of dispositions, built around your core cases and designed to underwrite scientific/pragmatic attributions. Desiderata are categorized (✅ = Non-Negotiable, ⚖️ = Camp Preference), with conflicts flagged.

  ---

  ### **Core Desiderata for an Applied Theory of Dispositions**
  *(Motivated by your problem cases & real-world attributions)*

  | Desideratum                          | Status     | Motivating Case(s)                                  | Rationale for Applied Context                                                                 |
  |--------------------------------------|------------|-----------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **1. Modal Robustness**              | ✅         | Fink, Booster, Self-Annealing Glass, Impossible Stimuli | Dispositions must hold across non-actual scenarios (e.g., "soluble" if water existed). Avoids vacuous attributions (e.g., "soluble in void"). |
  | **2. Non-Vacuous Modality**          | ✅         | Impossible Stimuli, Permanent Masking              | Conditions for manifestation must be *non-trivially satisfiable*. Avoids "disposed to X when pigs fly". |
  | **3. Intrinsic Grounding**           | ⚖️ (Preference) | Self-Annealing Glass, Permanent Masking           | Object’s internal properties should fix dispositions (e.g., glass’s bonding structure → fragility). *But partner-relativity challenges this*. |
  | **4. Partner-Relativity**            | ✅         | Partner Problem (pillow vs. concrete)              | Dispositions often require specific partners (solvent, striker). Theory must distinguish background conditions from stimulus partners. |
  | **5. Masking Tolerance**             | ✅         | One-Shot Mask, Permanent Masking                   | Masked dispositions (e.g., packed vase) remain real. Analysis can’t require manifestation *whenever* stimulus occurs. |
  | **6. Process-Sensitivity**           | ✅         | One-Shot Mask, Booster, Self-Annealing Glass       | Manifestation may involve multi-stage processes (e.g., foam absorbs impact *then* fails). Can’t reduce to "if S, then M". |
  | **7. Quiescent Manifestations**      | ✅         | Quiescent Dispositions (stabilizers, prophylactics) | "Nothing happens" (e.g., no headache) must count as a valid manifestation. Requires negative/absence-based outcomes. |
  | **8. Iterative Capacity**            | ✅         | Second-Order Cases (vaccines, seeds)               | Theory must handle dispositions to *gain/lose* dispositions without regress or circularity. |
  | **9. Degree-Gradedness**             | ✅         | (Implicit in all attributions)                     | Fragility/solubility come in degrees (e.g., "mildly hepatotoxic"). Theory must accommodate vagueness/scalarity. |
  | **10. Semantic Flexibility**         | ✅         | Ordinary language ("irritable", "unenforceable")   | Predicates are context-sensitive & interest-relative. Avoids "one-size-fits-all" thresholds. |

  ---

  ### **Editorial Judgments on Traditional Demands**
  - **✅ Non-Circularity**: Non-negotiable. Circular analyses (e.g., "fragile iff disposed to break when fragile") collapse applied content.  
  - **⚖️ Intrinsicality**: *Preference* (e.g., Lewisian camp). Partner-relativity (e.g., solubility requiring H₂O) makes strict intrinsicality untenable for many scientific dispositions.  
  - **⚖️ Categorical Base Requirement**: *Preference* (anti-Humean/realist camp). Grounding in non-dispositional properties is desirable but not essential if dispositions can be metaphysically primitive *and* empirically measurable.  
  - **🚫 Ban on Quantifying Over Possible Interventions**: *Unworkable*. Modal robustness requires considering non-actual scenarios (e.g., "what if we *had* dropped it?").  
  - **⚖️ Actual Difference-Making**: *Preference* (pragmatist/empiricist camp). Permanently masked dispositions (e.g., vase in eternal packing) may not affect actual events but still underwrite explanations (e.g., "why handle it carefully?").  

  ---

  ### **Key Tensions & Unsatisfiable Pairs**
  1. **Intrinsic Grounding vs. Partner-Relativity**  
     - If a disposition (e.g., solubility) *requires* an extrinsic partner (H₂O), it can’t be fully intrinsic.  
     - *Resolution*: Treat partners as part of the *stimulus condition*, not the disposition’s bearer.  

  2. **Non-Vacuous Modality vs. Impossible Stimuli**  
     - "Soluble in solvent X" where X is nomologically impossible risks vacuity.  
     - *Resolution*: Restrict dispositions to *metaphysically possible* stimuli (e.g., solvents compatible with laws of chemistry).  

  3. **Actual Difference-Making vs. Permanent Masking**  
     - A permanently masked disposition *never* manifests, so doesn’t "make a difference" in actual events.  
     - *Resolution*: Reject Actual Difference-Making as a core requirement; explanatory power suffices.  

  **Most Exclusionary Desideratum**: **Non-Vacuous Modality**. It forces theories to address *how* dispositions constrain possibilities without collapsing into triviality (e.g., via causal powers or non-trivial conditionals).

  ---

  ### **Brief Theory Scorecard**
  | Theory                          | ✅ Strengths                          | ❌ Failures (Per Your Cases)                          |
  |---------------------------------|---------------------------------------|------------------------------------------------------|
  | **Plain Conditional Analysis**  | Simple, handles non-masked cases      | Fails: Finks, Masks, Boosters, One-Shot Masks, Quiescence |
  | **Ceteris Paribus Conditionals** | Handles masks, boosters               | Fails: One-Shot Masks (process), Partner Problem (vagueness), Impossible Stimuli (vacuity risk) |
  | **Causal Basis View**           | Avoids conditionals, handles intrinsics | Fails: Partner Problem (extrinsic bases?), Second-Order (regress risk), Degrees (categorical bases often binary) |

  ---

  ### **Handling Degrees & Vagueness**
  - **Requirement**: A theory must explain why dispositional predicates (e.g., "drought-tolerant") are *comparative* and *context-dependent*.  
  - **Solution Sketch**:  
    - Treat dispositions as *gradable properties* (e.g., threshold-sensitive causal powers).  
    - Allow context to set thresholds (e.g., "tolerant" = survives 30-day drought in agriculture vs. 7-day in gardening).  
    - Use *proportionality*: "More fragile" = breaks under lesser impacts/partners.  

  ---

  ### **Bottom Line for Your Prospectus**
  A viable theory must prioritize **Modal Robustness**, **Non-Vacuous Modality**, and **Partner-Relativity** while accommodating **Process-Sensitivity** and **Degrees**. Reject strict intrinsicality and actual difference-making as non-negotiable. The **Causal Basis View** (augmented with partner-aware powers) or a **Sophisticated Conditional** (e.g., one integrating process ontologies) are best positioned, but *no extant theory nails all cases*. Your prospectus should frame this as an open problem—arguing that an applied metaphysics must bridge the gap between causal-process models and modal constraints.  

  Let me know if you want the cases mapped in detail to desiderata conflicts!
