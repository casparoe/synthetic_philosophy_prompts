prompt: |-
  I am in my final year of high school, and I serve as the student member of the volunteer committee that maintains our county's list of "native" plants — the list that decides what may be seeded in the roadside restoration beds and what the county will reimburse growers for. Over the two years I have been on it I have watched the word "native" move, and I have no word for how it moves.

  We never apply a definition. What happens instead is that someone proposes a plant and asks whether it is enough like something already on the list, in the way that matters for whatever we happen to be doing that evening. Our core case is not in dispute: a species that grew in these meadows before the county existed and that still grows here without anyone planting it. Then a species native to our state but not to our county went on, because it is native to the region. Then a species whose local wild population died out eighty years ago went on, because the nursery stock is grown from wild seed collected two states over, so the genes are the right ones. Then a cultivated variety bred from a native species for double flowers, which we had rejected twice, went on for a highway planting because the pollinators use it. Each of those steps was small, reasonable, and unanimous, and no member would say that the word had changed meaning at any point.

  Two further things worry me. First, once a plant is on the list it stays there, and the reason it was admitted is forgotten, so it gets cited in arguments that reason never supported: a plant accepted because insects will visit it is then defended as part of the county's natural heritage, and a plant accepted because its seed is wild-collected is then treated as though it had always grown here. Second, the content of the list depends on the order in which things came before us. Had the cultivated-variety question been voted on in my first month rather than my last, I believe we would have decided it the other way, and the list would now exclude plants it includes.

  A friend's older brother, who reads philosophy, said this sounded like family resemblance, but that does not fit: we have one clear core case, and we are not resisting or contesting the word, we are extending it unanimously. Vagueness does not fit either, since we are not looking for a cut-off on some single scale.

  Please answer in exactly five numbered points, each one or two sentences long, with no introduction before the first point and no summary or closing sentence after the last. The five points should be, in order: (1) whether this pattern has an established name, and the nearest established notions to it; (2) whichever established notion comes closest, and the precise respect in which my case fails to fit it; (3) a second candidate that fits less well, and why it too falls short; (4) if nothing established fits, the name you would give it, with a definition tight enough that I could apply it to a plant I have not mentioned; (5) whether the two features I described — that the order of our decisions changes the outcome, and that a decision made for one purpose gets reused for another — are really one phenomenon or two that merely travel together, together with a test case that would settle it. Please do not give me a reading list or citations; I only want the carving.
reasoning: |-
  Hmm, the user is describing a fascinating linguistic phenomenon they've observed on their native plant committee. They've noticed how the category of "native" expands through small, unanimous decisions without anyone noticing semantic drift. They're specifically asking for philosophical analysis of this pattern in five precise points.

  The committee starts with a clear core definition (pre-settlement locally occurring species) but makes incremental expansions: first to regional natives, then to locally extinct species with distant wild genetics, then to cultivated varieties that support pollinators. Each step seems reasonable in isolation, but cumulatively transforms the concept. The user worries about two consequences: historical reasons for inclusion get forgotten (leading to category errors), and the sequence of decisions determines outcomes (path-dependence).

  Their friend suggested Wittgenstein's family resemblance, but the user correctly notes this doesn't fit since there's a clear prototype and no contestation. Vagueness theories also fail because they're not debating borderline cases on a spectrum. I need to identify established philosophical concepts that might explain this - perhaps prototype theory with radial category expansion, or conceptual engineering in action.

  For point 1, I'll note there's no perfect established term but point to prototype theory and conceptual creep as neighbors. For point 2, I'll explain how prototype theory almost fits but misses the unanimous ratification of extensions. For point 3, I'll consider semantic drift as another candidate, but note it usually implies unplanned change whereas here changes are deliberate. Since nothing fits perfectly, in point 4 I'll coin "ratified category creep" with a testable definition. Finally for point 5, I'll argue the two worrying features are distinct phenomena that merely correlate, using a hypothetical sequence test as proof.
answer: |-
  1.  This pattern lacks a single established name, but the closest established notions are **prototype theory** (concepts organized around core examples with extendable boundaries) and **conceptual creep** (the gradual expansion of a concept's application).
  2.  Prototype theory fits best because you extend from a clear core case via perceived similarity, but it fails to fully capture the **unanimous, formal ratification** of each extension within your committee's specific operational context.
  3.  **Semantic drift** (meaning change over time) is a less good fit because your changes are deliberate, committee-approved operational decisions, not unplanned linguistic evolution or contestation over the word's inherent meaning.
  4.  If no established term suffices, name it **"ratified category creep"**: the formal, unanimous extension of an operational category's boundaries from a core case through sequential, uncontested decisions based on contextually relevant similarity, where prior inclusions implicitly redefine the category for future decisions.
  5.  The two features—**path-dependence** (outcome determined by sequence) and **functional repurposing** (reason forgotten, new justification applied)—are distinct phenomena that commonly travel together; test them by imagining if swapping decision order changes reused justifications (e.g., if the cultivar entered first, would it *later* be falsely claimed as historically native?).
