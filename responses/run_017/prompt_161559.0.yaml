  Combining these: multiplying probabilities gives 0.85 * 0.65 * 0.55 * 0.40 ≈ 0.12, but that feels too low. The user's at 0.60, friend at 0.15—probably they weight (b) and (c) differently. I'll use geometric mean instead, landing at 0.45.

