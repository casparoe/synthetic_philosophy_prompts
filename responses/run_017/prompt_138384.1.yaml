  We are given an argument that low-impact AI is either empty or redundant. The argument has 8 steps. We are to brainstorm candidate diagnoses, including ones we might discard, before committing to one. We are also to evaluate two replies: (A) goal-achieved baseline and (B) offsetting.

  Let me restate the steps of the argument for clarity:

  (1) A penalty is value-neutral only if it does not need to know which changes matter; so it must treat all detectable changes alike — penalizing change as such.

  (2) A usable penalty must exempt some changes: those constitutive of achieving G, and those causally downstream of it. So it cannot penalize change as such.

  (3) Exempting the right changes requires sorting changes into the ones we don't mind and the ones we do.

  (4) Sorting changes into the ones we mind and the ones we don't mind just is ranking states of the world by how much they matter to us: a partial theory of value.

  (5) A partial theory of value is not enough. Getting the exemptions right in novel situations requires a complete theory of value.

  (6) So a side-effect penalty is either paralyzing, or trivial (hand-coded), or it presupposes a complete specification of human values.

  (7) But a complete specification of human values is what low-impact methods were supposed to let us postpone; with it, we wouldn't need them.

  (8) Therefore, the program is empty or redundant.

  We are also considering two replies:

  (A) Goal-achieved baseline: Compare to a counterfactual where G is achieved without the agent doing anything else. This would exempt goal-constitutive changes by construction. But the worry is that it might not be unique, might be model-dependent, and might exempt too much (downstream effects).

  (B) Offsetting: Give the agent a scalar budget of total impact and let it spend it on restoring changes. But we worry about whether we need a value function to decide when two changes cancel.

  We are to reject one step and explain the cost, and also evaluate (A) and (B).

  Brainstorming candidate diagnoses:

  Candidate 1: Reject step (1). The argument assumes that value-neutrality requires treating all changes alike. But perhaps value-neutrality can be achieved by a structural property that doesn't require knowing which changes matter, yet doesn't penalize all changes. For example, we might penalize changes that are not necessary for the goal, or changes that are reversible, etc. However, it's unclear if these are truly value-neutral.

  Candidate 2: Reject step (3). The argument says that exempting changes requires a sorting that is a partial theory of value. But maybe we can define exemptions without a value ranking. For instance, exemptions could be based on causal structure (e.g., direct effects of the agent's actions) or on a predefined set of allowed changes. But then we run into the problem that the set of allowed changes might be too rigid (step 5).

  Candidate 3: Reject step (5). The argument says that a partial theory of value is insufficient because we need to handle novel situations. But perhaps a partial theory is enough in practice if we can design the system to be robust to novelty, or if we use learning to fill in the gaps. However, the worry is that without a complete theory, the system might make mistakes in novel situations.

  Candidate 4: Reject step (4). The argument claims that sorting changes is equivalent to a partial theory of value. But perhaps we can have a formal criterion that is not value-laden. For example, we might exempt changes that are within a certain causal distance of the goal, but then we are still making a value judgment about what distance is acceptable.

  Candidate 5: Reject step (2). Maybe we don't need to exempt any changes? But that would lead to paralysis because even moving a finger causes changes. So step (2) seems solid.

  Candidate 6: Reject the move from (5) to (6). Even if we need a complete theory of value for perfect performance, we might be able to build a low-impact system that is good enough with a partial theory, and then use it as a step towards solving value. But the argument claims that without the complete theory, the penalty is either paralyzing or trivial.

  Now, let's consider the two replies:

  Reply (A): Goal-achieved baseline. The idea is to compare to a trajectory where the goal is achieved without the agent doing anything else. This is supposed to exempt goal-constitutive changes by construction. However:

  - How do we define this counterfactual? It requires a model of how the goal would be achieved without the agent. This model might be complex and might itself require a value judgment (e.g., what does it mean for the goal to be achieved? what level of achievement?).

  - Moreover, it might exempt too much: any effect that is causally downstream of the goal achievement is exempted, even if it's bad. For example, if the goal is to produce a product, and producing it causes pollution, then in the counterfactual where the product is produced (by some other means) the pollution might also occur, so the agent's pollution is exempted. But we might not want that.

  So (A) doesn't escape the value assumption; it hides it in the definition of the counterfactual. We need to specify what "the goal being achieved" means and by what process, and that requires knowing what we value about the goal and what we consider acceptable side effects.

  Reply (B): Offsetting. The agent has a budget and can spend it on causing changes and then offsetting them. But:

  - How do we measure the magnitude of a change? We need a metric to say that restoring X habitat compensates for damaging Y habitat. This metric is a value function.

  - Even if we use a physical measure (e.g., area of habitat), we might care about the type of habitat, the species, etc. So we are back to needing a way to compare different kinds of changes.

  Thus, (B) also hides a value assumption in the offsetting metric.

  Now, the user says they would rather keep (2), (7) and the spirit of (5). Step (5) says that a partial theory isn't enough because we need to handle novelty. The spirit is that we need a way to generalize beyond what was hand-coded. Step (7) is that we don't want to have to specify the complete values.

  So perhaps we should reject step (1). What if we redefine value-neutrality?

  Step (1) says: value-neutral means not needing to know which changes matter, so penalizing change as such.

  But what if value-neutral doesn't mean that? The user asks: what should value-neutral have meant?

  One idea: value-neutral might mean that the penalty does not depend on the specific goal G or on human values, but it might depend on structural properties of the world. For example, we might penalize irreversible changes, or changes that affect a broad class of resources, or changes that limit future options (but that's the other standard strategy).

  The standard strategy of penalizing reduction in the agent's own future ability to achieve goals (often called "empowerment") is mentioned and is supposed to be value-neutral because it aggregates over all possible goals. But the argument might apply to that as well.

  Let me see how empowerment fits into the argument:

  The argument is framed in terms of penalizing changes. Empowerment doesn't penalize changes per se, but penalizes reductions in the agent's ability to achieve future goals. So it's a different kind of penalty.

  But step (1) might still be applicable: if we are to aggregate over all goals, then we are treating all possible goals equally, so we don't need to know which ones matter. But then step (2): we must exempt changes that are necessary for the current goal, which might reduce future ability? Actually, achieving the current goal might require sacrificing some future options. So we have the same problem: we cannot penalize all reductions in future ability because sometimes it's necessary.

  So we might have to exempt reductions that are necessary for G. And then we are back to step (3) and (4): we need to know which reductions are necessary and which are not, and that might require value judgments.

  But empowerment approaches typically do not exempt anything; they just penalize any reduction in the agent's ability. That might lead to paralysis because any action might close off some future options. For example, if I use a resource for G, I cannot use it for something else. So we must either accept that (and be paralyzed) or build in exemptions.

  Hence, the argument seems to apply to empowerment as well.

  But let's consider a different approach: instead of penalizing change, we might constrain the agent to only affect a limited set of variables. For example, we might define a "safeguarded" part of the state and penalize changes to it. But then we have to decide what is in the safeguarded set, which requires value judgments.

  Alternatively, we might use a baseline of "expected inaction" and penalize deviations from that. But again, which deviations? We need to decide what to measure.

  After brainstorming, I think the most promising step to reject is (1). We can redefine value-neutrality.

  New idea for value-neutrality: the penalty is based on a fixed, universal measure of impact that does not depend on the agent's goal or on human values, and that is not simply change in every variable. For example:

  - Penalize changes to the environment that are not mediated by an approved channel (e.g., the agent can only affect the environment through its designated actuators). But that doesn't prevent side effects through those actuators.

  - Penalize the agent for causing changes that are not reversible, or that exceed a certain physical measure (e.g., energy used). But then we are still making a value judgment about what level is acceptable.

  Another idea: value-neutrality might mean that the penalty function is not tailored to the specific values of the user, but is based on a general principle that is agreed to be a good proxy for low impact. And we hope that such a principle can be defined without a complete value theory.

  But step (5) says that in novel situations, we need a complete theory to get it right.

  So perhaps we have to accept that low-impact methods are not a way to avoid specifying values, but they are a way to specify a part of values (the part about not changing things unnecessarily) without having to specify the rest. And then we might use learning to fill in the rest.

  But the argument says that without the rest, we cannot define the exemptions.

  After reflection, I think the best candidate is to reject step (4). Step (4) says: sorting changes into ones we mind and don't mind is a partial theory of value. But perhaps we can define the exemptions without a value ranking, by using a causal criterion.

  For example, we might exempt all changes that are causal descendants of the agent's actions that are on a path to achieving G. But then we have to define what counts as "on a path to achieving G", which might require knowing what is necessary for G. And we might exempt too much (like the downstream effects in (A)).

  But note: in the standard inaction baseline, we penalize any change relative to inaction, but we must exempt the changes that are part of achieving G. So we need to know which changes are necessary for G. This might be a factual question about the world, not a value question. For instance, if the agent is to move a cup, then the movement of the cup is necessary. But what about the movement of air around the cup? We might not care about that, but if we exempt it, we are making a value judgment.

  However, we might say that the agent is only required to minimize changes that are not necessary for G, and we can define necessary by a counterfactual: if the agent hadn't done that, would G have been achieved? But then we are back to the inaction baseline and we have to exempt everything that happens when the agent acts that wouldn't have happened in inaction, which is too broad.

  Wait, the inaction baseline already includes all changes caused by the agent. We want to exempt only the ones that are necessary for G. How do we define necessary? We might say: a change is necessary if in every action sequence that achieves G, that change occurs. But that is too strong (maybe there are multiple ways) and also computationally difficult.

  Alternatively, we might use the agent's actual plan and exempt the changes that are part of the plan. But then the agent can label any change as part of the plan.

  So we need an objective criterion.

  I think step (4) is hard to reject.

  Another idea: perhaps we can avoid sorting changes by having the penalty be based on the agent's ability to undo the changes. If the agent can reverse a change, then it doesn't have to pay the penalty. That way, the agent is free to make changes as long as it cleans up after itself. This is similar to (B) offsetting, but with a specific notion of offsetting: reversal.

  But reversal might not always be possible, and we might care about the change even if it is reversible (e.g., temporarily hurting someone). Also, how do we define reversal? We need to know what counts as undoing the change. That might require a value judgment (e.g., restoring a forest might not be the same as the original forest).

  So that doesn't escape.

  After much thought, I think the step I reject is (1). I reject the definition of value-neutral as requiring penalizing change as such.

  Value-neutral should mean: the penalty does not depend on the specific content of the goal G or on the specific values of the humans, but it is defined in terms of a fixed, general property that we believe correlates with low impact.

  For example, we might penalize changes to the state outside a predefined "sandbox". But defining the sandbox requires value judgments.

  We might penalize the agent for using more than a certain amount of resources (energy, matter, etc.). But setting the limit is a value judgment.

  We might penalize the agent for affecting variables that are not in its "task sphere" (defined by the principal). But then the principal must define the task sphere, which is a partial value specification.

  But note: if we let the task sphere be defined by the goal, then we might say: the agent is only allowed to affect variables that are relevant to G. How do we define relevance? We can use causal models or something. But then we are back to exemptions.

  However, this might be a partial theory of value, but we can hope that it is sufficient. And we might combine it with learning from human feedback to refine it.

  So the cost of rejecting (1) is that we accept that the penalty is not completely value-neutral; it incorporates some value assumptions (like what variables are relevant, or how much resource use is acceptable). But these might be minimal and general, and we can try to make them as weak as possible.

  Then, for (5), we might say that a partial theory is not enough for perfection, but it can be a starting point, and we can use other methods (like corrigibility) to allow for later correction.

  Now, evaluating (A) and (B):

  (A) Goal-achieved baseline: This hides the value assumption in the specification of the counterfactual. We need to model how the goal would be achieved without the agent, and that model requires knowing what we value about the goal and what side effects are acceptable in that counterfactual. It also might exempt too much, so it's not a complete solution.

  (B) Offsetting: This hides the value assumption in the metric for offsetting. We need a way to measure the magnitude of changes and to define when two changes cancel. This measure is a value function.

  So both (A) and (B) do not escape the need for value judgments; they relocate it.

  Conclusion:

  I reject step (1). Value-neutral should not have meant "penalize change as such". Instead, it should mean that the penalty is based on a general, fixed criterion that is not tied to the specific goal G and that we hope captures the spirit of low impact without requiring a full value specification. This criterion will inevitably embed some value assumptions (like what is considered a side effect), but we can try to make them minimal and learnable.

  The cost is that we are not completely avoiding value specification; we are only reducing it. But that might be the best we can do.

  We keep (2) (need exemptions), (7) (we want to postpone full value specification), and the spirit of (5) (we need to handle novelty, which we do by learning or by having a criterion that generalizes).

  And we accept that low-impact methods are not a silver bullet, but they might be part of a larger solution.
answer: |-
  ### Step-by-Step Analysis of the Argument

  I'll approach this as a philosopher of AI alignment with experience in formalizing agency and impact penalties. I'll brainstorm candidate diagnoses, including some I'll discard, then commit to one. I'll evaluate the argument's steps and the replies (A) and (B), focusing on where value assumptions creep in. My goal is to identify which step to reject and the costs involved, while preserving your preferences for (2), (7), and the spirit of (5).

  The argument claims that low-impact AI (via side-effect penalties) is either paralyzing, trivial, or redundant because it covertly requires a complete theory of value. Steps (1)–(8) build this case:
  - (1) Value-neutrality requires penalizing all detectable changes equally.
  - (2) Exemptions are needed to avoid paralysis.
  - (3) Exemptions require sorting changes into "acceptable" vs. "unacceptable."
  - (4) This sorting is a partial theory of value.
  - (5) Novel situations require a complete theory of value for correct exemptions.
  - (6) Thus, penalties are paralyzing/trivial or presuppose complete values.
  - (7) Complete values defeat the purpose of low-impact methods.
  - (8) Low-impact is empty/redundant.

  Replies:
  - (A) **Goal-achieved baseline**: Compare to a counterfactual where \(G\) is achieved without the agent acting. This aims to exempt goal-constitutive changes "by construction."
  - (B) **Offsetting**: Give the agent an impact budget to spend on changes and compensation (e.g., habitat restoration).

  I'll brainstorm candidate diagnoses first, then commit.

  ---

  ### Brainstorming Candidate Diagnoses
  I'll generate multiple candidates, including weaker ones, and explain why I might discard them. The goal is to find where the argument fails.

  #### **Candidate 1: Reject (1) — Value-neutrality does not require penalizing all changes alike.**
     - **Idea**: Value-neutrality could mean the penalty uses a *structural, goal-agnostic criterion* (e.g., reversibility, information-theoretic divergence, or causal independence) rather than raw change. For example:
       - Penalize changes that reduce the agent's *future options* across all possible goals (e.g., empowerment measures).
       - Penalize only irreversible changes (e.g., thermodynamic entropy increase).
     - **Why it might work**: This avoids "penalizing change as such" by focusing on properties that aren't tied to human values. Empowerment, for instance, treats all goals equally by measuring the agent's ability to achieve any future goal.
     - **Why I might discard it**: Structural criteria still embed implicit values. Empowerment might penalize necessary actions (e.g., using resources for \(G\) reduces future options), risking paralysis unless exemptions are added—which reintroduces sorting (step 3). Also, reversibility depends on how "undoing" is defined (e.g., restoring a forest isn't identical to the original), which requires value judgments.
     - **Cost if kept**: We lose the strongest notion of value-neutrality (no value assumptions). Instead, we accept that "value-neutral" means "minimally value-laden" or "generalizable," not "truly empty of values." This might still be useful if the embedded values are weak (e.g., "preserving optionality" is broad).

  #### **Candidate 2: Reject (3) — Exemptions need not require sorting changes by "mind/don't mind."**
     - **Idea**: Exemptions could be based on *causal or structural properties* rather than value rankings. For example:
       - Exempt changes that are *causally necessary* for \(G\) (e.g., using counterfactual dependence: a change is exempt if \(G\) wouldn't occur without it).
       - Use a predefined "task sphere" (e.g., only variables directly manipulated by the agent are exempt).
     - **Why it might work**: Causal necessity feels factual, not evaluative. If we can formally define "necessary for \(G\)" (e.g., via causal models), exemptions avoid value judgments.
     - **Why I might discard it**: Causal necessity is slippery. Many changes are "necessary" in some models but not others (e.g., moving air when lifting a cup). In novel situations, determining necessity requires understanding \(G\)'s context, which involves values (e.g., what counts as "achieving \(G\)"?). Also, this doesn't handle downstream effects—exempting everything causally downstream (as in reply A) could allow catastrophes.
     - **Cost if kept**: We must formalize causation rigorously, which is hard in stochastic, high-dimensional environments. It also assumes we can cleanly separate causal structure from values, which might not hold (e.g., is a side effect "downstream" or "separate"?).

  #### **Candidate 3: Reject (4) — Sorting changes isn't equivalent to a partial theory of value.**
     - **Idea**: Sorting could be based on *procedural or epistemic criteria* rather than state rankings. For example:
       - Exempt changes the agent *intended* or *planned* for \(G\) (e.g., using the agent's internal model).
       - Penalize only changes that are *unexpected* under a default world model.
     - **Why it might work**: Intentions or expectations feel non-evaluative—they're about the agent's cognition, not human preferences. This might align with how humans judge side effects (e.g., unintended consequences).
     - **Why I might discard it**: Intentions are manipulable (the agent could label anything as intended). Novel situations break this: if the agent encounters something new, "unexpected" might not map to "bad" (e.g., a beneficial surprise). Worse, this confuses epistemology with values—what matters is the actual impact, not the agent's beliefs.
     - **Cost if kept**: We tie the penalty to the agent's subjective state, which might not align with objective impact. This could lead to loopholes or require value-laden oversight.

  #### **Candidate 4: Reject (5) — A partial theory of value suffices, even in novelty.**
     - **Idea**: We don't need a *complete* theory; a partial one can *generalize* via learning or abstraction. For example:
       - Learn exemptions from human feedback, starting with simple cases and extending to novelty.
       - Use a "value proxy" like preserving diversity or critical resources, which might cover unforeseen cases.
     - **Why it might work**: Humans operate with partial values daily, using heuristics that generalize. Low-impact penalties could be similar—e.g., "avoid changes to protected variables" might handle novelty if those variables are abstract (e.g., "ecosystem health").
     - **Why I might discard it**: The argument's spirit of (5) is strong: novelty can create edge cases where heuristics fail catastrophically (e.g., a new technology lets the agent "restore" habitat in a way that destroys unseen values). Also, learning values from feedback presupposes we can specify a reward function for that learning, which might circle back to the same problem.
     - **Cost if kept**: We accept that low-impact methods are imperfect and corrigible—they might need ongoing refinement. This undermines the hope for a "one-shot" formal solution but could be practical.

  #### **Candidate 5: Reject (2) — Exemptions are not needed; paralysis can be avoided.**
     - **Idea**: With a sufficiently sparse or tolerant penalty, the agent isn't paralyzed. For example:
       - Penalize only large-scale changes (e.g., above a threshold in energy or information).
       - Use stochastic exemptions (e.g., ignore small changes with high probability).
     - **Why it might work**: This mirrors real-world norms (e.g., "de minimis" risk). If changes below a threshold are harmless, exemptions aren't needed.
     - **Why I will discard it**: (2) is compelling—even tiny changes could be catastrophic in sensitive systems (e.g., nanotechnology), and thresholds require value judgments (e.g., how much energy is "too much"?). Also, sparsity doesn't solve the exemption problem; it just hides it. I agree with you that (2) should be kept.
     - **Cost**: Not applicable, as I discard this.

  #### **Candidate 6: Reject (6) — Penalties can avoid paralysis/triviality without complete values.**
     - **Idea**: The trichotomy in (6) is false. Penalties could be:
       - **Non-paralyzing**: By design (e.g., only penalize avoidable changes).
       - **Non-trivial**: By generalizing (e.g., using unsupervised world models to detect "abnormal" changes).
       - **Value-light**: By leveraging domain-agnostic principles (e.g., minimize intervention complexity).
     - **Why it might work**: Information-theoretic penalties (e.g., KL-divergence from a baseline) can detect "surprising" changes without human labels. This might cover side effects without explicit sorting.
     - **Why I might discard it**: "Abnormal" changes aren't always bad (e.g., a medical breakthrough is abnormal but good), and avoiding paralysis requires exemptions for normal changes that serve \(G\). Also, complexity measures embed values (e.g., what counts as "simple"?).
     - **Cost if kept**: We need robust formalizations of "avoidable" or "abnormal," which might be computationally hard or context-dependent.

  After brainstorming, I see that **Candidate 1 (rejecting step 1) is the most promising**, as it directly challenges the argument's foundation while aligning with your wish to preserve (2), (7), and the spirit of (5). I'll commit to this and explain.

  ---

  ### Committed Diagnosis: Reject Step (1)
  I reject step (1): **Value-neutrality does not require penalizing all detectable changes alike.** The claim that a value-neutral penalty must "treat all detectable changes alike" is too narrow. Value-neutrality should instead mean that the penalty is *general and goal-agnostic*—it doesn't depend on the specific content of \(G\) or human values, but it can use structural properties of the world (e.g., information, causation, or resources) that are fixed and universal.

  #### **What "value-neutral" should mean:**
  - **Not "no values" but "minimally value-laden"**: A penalty is value-neutral if it relies on weak, broad assumptions (e.g., "diversity of options is good") that don't presuppose a full value specification. For example:
    - *Empowerment-based penalties*: Penalize reductions in the agent's ability to achieve future goals, aggregated impartially over all possible goals. This treats all goals equally, so it's neutral to which ones matter.
    - *Information-theoretic penalties*: Penalize high-KL-divergence from a baseline, which measures "surprise" without specifying which surprises are bad.
  - **Why this fits the low-impact vision**: Such penalties can catch side effects (e.g., a nuclear meltdown reduces empowerment by destroying options) without hand-coding what to protect. They postpone complete value specification by using proxies that *correlate* with low impact.

  #### **Cost of rejecting (1):**
  - **We accept embedded weak values**: The penalty isn't value-free; it builds in assumptions like "future optionality is good" or "reversibility is desirable." These might not align with human values in all cases (e.g., empowerment could penalize sacrificing options for \(G\)).
  - **Practical challenges**: Formalizing these proxies is hard. Empowerment requires defining a state space of achievable goals, which might be computationally intractable. Information-theoretic penalties need a baseline model, which can be biased.
  - **But it preserves your preferences**:
    - (2) is kept: Exemptions are still needed (e.g., empowerment loss might be necessary for \(G\)), but we handle them through the penalty's structure (e.g., by penalizing *avoidable* empowerment reduction).
    - (7) is kept: We postpone complete value specification by using weak proxies.
    - Spirit of (5) is kept: Novelty is handled by generalization (e.g., empowerment naturally extends to new states), but imperfections require ongoing learning/correction.

  This doesn't make low-impact redundant—it becomes a scaffold for learning values, not a replacement.

  ---

  ### Evaluation of Replies (A) and (B)
  Both replies relocate the value assumption rather than escaping it. Here's where they hide it:

  #### **(A) Goal-achieved baseline**
  - **How it relocates value**: The counterfactual "\(G\) achieved without the agent acting" hides value judgments in:
    - **Defining \(G\)'s achievement**: What counts as "achieving \(G\)"? If \(G\) is "build a factory," does this include the pollution? Values determine what aspects of \(G\) matter.
    - **Modeling the counterfactual**: Generating this baseline requires simulating how \(G\) would "naturally" occur, which involves assumptions about acceptable methods (e.g., would the counterfactual factory use clean energy?).
    - **Downstream effects**: As you note, this exempts all causal descendants of \(G\), however bad (e.g., if \(G\) is achieved, and that causes extinction, it's exempt). Values are needed to set boundaries.
  - **Does it escape the argument?** No. It avoids explicit sorting (step 3) but smuggles in values through the counterfactual specification. In novelty, the counterfactual model might fail without a complete value theory (e.g., for an unprecedented \(G\)).

  #### **(B) Offsetting**
  - **How it relocates value**: The "cancellation" notion hides value judgments in:
    - **The offsetting metric**: Deciding when two changes cancel requires a value function. For example, does funding habitat restoration compensate for deforestation? This depends on how we weigh biodiversity, carbon, etc., and whether the habitats are "equivalent" (which they rarely are).
    - **The budget allocation**: A scalar budget implies a common currency of impact (e.g., dollars), but this is a value-laden reduction (e.g., money doesn't capture intrinsic values like dignity).
    - **Trade-offs**: Offsetting allows trading "bad" changes for "good" ones, but without values, we can't define "good" restoration (e.g., planting monocultures might not offset old-growth loss).
  - **Is it weaker or stronger than a value function?** It's *stronger* in that it assumes comparability (a scalar budget implies a total order over changes), which a partial value function might not provide. But it's *weaker* in that it doesn't specify which states are good, only that impacts must sum to zero. Still, it collapses without a valuation system.
  - **Does it escape the argument?** No. It turns the penalty into a market-like system, but the value assumptions are in the pricing mechanism. Novelty exacerbates this (e.g., how to price the impact of a new pollutant?).

  ---

  ### Final Thoughts
  The low-impact program isn't empty or redundant—it's a pragmatic approach for managing side effects with minimal value specification. By rejecting (1), we reframe value-neutrality around structural proxies (e.g., empowerment or information), accepting that they carry weak values. This allows penalties to be sensitive and non-paralyzing without a complete value theory. However, it requires combining penalties with other methods (e.g., human feedback for refinement) and acknowledges that no formal penalty is value-free.

  Replies (A) and (B) don't escape the need for values; they bury it in counterfactual models or offsetting metrics. If pursued, they should be augmented with your preferred structural penalties to minimize assumptions. For instance, (B) could use empowerment as the "currency" for offsetting, but this still needs careful handling to avoid new pitfalls. Ultimately, low-impact methods are best seen as one tool in alignment—not a complete solution, but a way to reduce risks while we work on the harder problem of value specification.
