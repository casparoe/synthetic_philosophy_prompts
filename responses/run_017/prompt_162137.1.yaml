  | **2. Role of Endorsement vs. Continuity:** When they conflict, which matters more for authority? | Endorsement *indicates* continuity, but continuity itself (defined narratively) grants authority. The directive *defines* what constitutes relevant endorsement. | Actual present endorsement *is* a core component of continuity. Lacking endorsement signals critical discontinuity. Authority requires current endorsement *or* its reasonable expectation. | **Does continuity *confer* authority independently of endorsement, or is endorsement/expected endorsement the *essential manifestation* of continuity relevant for authority?** | **The "Authority-As" Distinction:** Analyzing Margaret's case explicitly through "Authority-as-Continuity" (A-C) vs. "Authority-as-Expected-Endorsement" (A-EE). | **View:** A-C is primary. A-EE is derivative. Margaret's directive binds *because* she is continuous with her past self (narratively), even if current endorsement is absent. The directive *is* her expected endorsement under full information/calibration. | **View:** A-EE is primary (or equivalent). A-C matters only as a proxy for A-EE. Margaret's lack of endorsement *now* (or inability to reasonably expect it given her state) signals discontinuity *and* lack of expected endorsement. | **Substantive** (Potentially Verbal near edges) | Highly Contested. Core philosophical divergence. PA sees A-EE as subsumed under A-C via the narrative. NS sees A-C as a means to A-EE. Margaret's case is the test bed. Confidence: Low (Fundamental value disagreement). NS might accept A-C only if defined *as* connectedness enabling endorsement. |
  | **3. Overriding Threshold:** When does the present self's welfare justify overriding a clear AD? | Only in cases of profound identity discontinuity *where* honoring the directive would cause significant harm to a content being *who cannot be seen as the author*. The burden of proof is very high. | When honoring the AD would harm a present experiential subject who lacks sufficient psychological continuity with the author to be bound by their critical interests. Welfare harm creates the burden. | **How severe must discontinuity/harm be to override? Where does the burden of proof lie?**                                                      | **Margaret's Case:** Moderate Alzheimer's, enjoys life, requests treatment against directive.                                     | **Action:** Honor directive. Discontinuity not profound *enough*. Current enjoyment doesn't negate critical interest in avoiding "undignified" existence. Harm is defined by author's values. Burden on NS to show discontinuity/harm sufficient to override clear directive. | **Action:** Provide treatment. Significant discontinuity exists. Harm (denying wanted life to a content being) is clear and present. Burden on PA to show sufficient continuity *and* that "dignity" harm outweighs experiential harm. | **Substantive**    | Contested. PA emphasizes "profound" discontinuity & author-defined harm. NS emphasizes "significant" discontinuity & current experiential harm. Burden of proof is pivotal. Confidence: Medium (Disagreement on severity thresholds and harm definition). |
