  ### Designed Case: The Bounty Hunter in Damascus

  **Scenario:**  
  You are in Damascus and learn that a bounty hunter, known for meticulously tracking targets, is coming for you tomorrow. She has studied your habits and psychological profile extensively, and based on this, she will commit tonight to waiting in either Damascus or Aleppo. Her predictions of your actions are 80% reliable (i.e., if you choose to stay, she is in Damascus 80% of the time; if you flee, she is in Aleppo 80% of the time). Fleeing to Aleppo requires traveling a dangerous road: independently of the hunter, you have a 10% chance of dying on the journey. Your choices are:  
  - **Stay (S)**: Remain in Damascus.  
  - **Flee (F)**: Travel to Aleppo, braving the road hazard.  

  If the hunter is in your city, you die; otherwise, you live. The road hazard only applies if you flee. Utilities: survival = 1, death = 0.  
  **Key property:** Conditional on either act, your estimated chance of dying is high (≥80% if you stay, ≥72% if you flee), satisfying the doom constraint.  

  ---

  ### Machinery  
  **Acts:** \(S\) (Stay), \(F\) (Flee).  
  **States:** Hunter in Damascus (\(D\)), Hunter in Aleppo (\(A\)).  
  **Reliability:** \(r = 0.8\) (predictor’s accuracy).  
  **Independent hazard:** \(h = 0.1\) (risk of dying on the road if fleeing).  
  **Agent’s prior credence:** \(p = P(\text{you flee})\) (your belief about fleeing, before deciding).  

  #### Utilities:  
  |          | \(D\) (Hunter in Damascus) | \(A\) (Hunter in Aleppo) |  
  |----------|-----------------------------|--------------------------|  
  | \(S\)    | 0 (die if hunter present)   | 1 (survive)              |  
  | \(F\)    | \(1 - h = 0.9\) (survive road and hunter absent) | 0 (die: road hazard or hunter) |  

  **Conditional probabilities (given act):**  
  - \(P(D \mid S) = r = 0.8\) (if stay, hunter likely in Damascus).  
  - \(P(A \mid S) = 1 - r = 0.2\).  
  - \(P(A \mid F) = r = 0.8\) (if flee, hunter likely in Aleppo).  
  - \(P(D \mid F) = 1 - r = 0.2\).  

  **State probabilities under intervention (for CDT):**  
  The hunter commits based on her prediction of your act, using your prior \(p\). Under intervention (act chosen causally independently), the hunter’s location is fixed by her prior belief:  
  - \(P(D) = (1 - p) \cdot r + p \cdot (1 - r)\)  
  - \(P(A) = (1 - p) \cdot (1 - r) + p \cdot r\)  

  ---

  ### Decision Theories' Verdicts  
  **Evidential Decision Theory (EDT):** Uses conditional probabilities (treats act as evidence).  
  - \(EU_{EDT}(S) = U(S, D) \cdot P(D \mid S) + U(S, A) \cdot P(A \mid S) = (0)(0.8) + (1)(0.2) = 0.2\)  
  - \(EU_{EDT}(F) = U(F, D) \cdot P(D \mid F) + U(F, A) \cdot P(A \mid F) = (0.9)(0.2) + (0)(0.8) = 0.18\)  
    - **Verdict:** \(S \succ F\) (stay preferred) for all \(p\), since \(0.2 > 0.18\).  

  **Causal Decision Theory (CDT):** Uses probabilities under intervention (ignores act as evidence).  
  - \(EU_{CDT}(S) = U(S, D) \cdot P(D) + U(S, A) \cdot P(A) = (0) \cdot P(D) + (1) \cdot P(A) = P(A) = (1 - p)(0.2) + p(0.8)\)  
  - \(EU_{CDT}(F) = U(F, D) \cdot P(D) + U(F, A) \cdot P(A) = (0.9) \cdot P(D) + (0) \cdot P(A) = 0.9 \cdot P(D) = 0.9 \left[ (1 - p)(0.8) + p(0.2) \right]\)  
    - **Verdict as a function of \(p\):**  
      - Flee if \(EU_{CDT}(F) > EU_{CDT}(S)\):  
        \[
        0.9 \left[ (1 - p)(0.8) + p(0.2) \right] > (1 - p)(0.2) + p(0.8)
        \]  
        Simplify: \(0.9(0.8 - 0.6p) > 0.2 + 0.6p\) → \(0.72 - 0.54p > 0.2 + 0.6p\) → \(0.52 > 1.14p\) → \(p < 0.456\).  
      - Stay if \(p > 0.456\).  
      - Indifferent at \(p = 0.456\).  
    - **Disagreement range:** EDT always prefers \(S\); CDT prefers \(F\) when \(p < 0.456\), \(S\) when \(p > 0.456\).  

  ---

  ### Self-Ratifying Policy for CDT  
  A policy is self-ratifying if, given the agent adopts it, CDT recommends its prescribed act.  
  - **Type:** Mixed policy (randomize between \(S\) and \(F\)).  
  - **Mixing probability \(q\):** Probability of fleeing. Set \(p = q\) (prior matches policy), and solve \(EU_{CDT}(S) = EU_{CDT}(F)\):  
    \[
    (1 - q)(0.2) + q(0.8) = 0.9 \left[ (1 - q)(0.8) + q(0.2) \right]
    \]  
    Simplify: \(0.2 + 0.6q = 0.9(0.8 - 0.6q)\) → \(0.2 + 0.6q = 0.72 - 0.54q\) → \(1.14q = 0.52\) → \(q \approx 0.456\).  
    - **Threshold for pure policies:**  
      - Pure \(S\) self-ratifying if \(p = 0\): \(EU_{CDT}(S) = 0.2 > EU_{CDT}(F) = 0.9 \cdot 0.8 = 0.72?\) No, \(0.2 < 0.72\) → not self-ratifying.  
      - Pure \(F\) self-ratifying if \(p = 1\): \(EU_{CDT}(S) = 0.8 > EU_{CDT}(F) = 0.9 \cdot 0.2 = 0.18\) → not self-ratifying.  
    - **Flip threshold for hazard/reliability:** With \(r\) and \(h\) general, \(q = \frac{r(2 - h) - 1}{(2 - h)(2r - 1)}\). Flips from mixed to pure when denominator zero (e.g., \(r = 0.5\)) or \(q \notin [0,1]\). For \(r > 0.5\), pure policies never self-ratify; mixed always exists.  

  **Hunch confirmed:** The flip point in \(p\) (where CDT’s verdict changes) is exactly the mixing probability \(q = 0.456\) in the self-ratifying policy.  

  ---

  ### Critical Feature and Removal  
  - **Key feature:** The independent causal hazard (\(h > 0\)).  
  - **Effect of removal (\(h = 0\)):**  
    - EDT: \(EU_{EDT}(S) = 0.2\), \(EU_{EDT}(F) = (1)(0.2) = 0.2\) → indifferent.  
    - CDT: \(EU_{CDT}(S) = 0.2 + 0.6p\), \(EU_{CDT}(F) = 0.8 - 0.6p\) → prefers \(F\) if \(p < 0.5\), \(S\) if \(p > 0.5\).  
    - Self-ratifying policy: Mixed with \(q = 0.5\).  
    - **Result:** Collapses to original Death in Damascus (both acts equally bad news; self-consistent policy is a coin flip).  

  ---

  ### Assessment  
  **Is this genuinely different from Newcomb’s problem?**  
  Yes, in three ways:  
  1. **Mundane predictor:** Reliability is human-level (80%), not near-perfect; decisions rely on empirical correlation, not metaphysical foreknowledge.  
  2. **Independent causal hazard:** Fleeing carries intrinsic risk (road death) unrelated to prediction, creating a tradeoff where CDT sees fleeing as causally beneficial if the hunter is likely elsewhere, while EDT sees it as doubly bad news.  
  3. **Disagreement structure:** The flip point depends on the agent’s prior credence (\(p\)) and the hazard/reliability balance, making the theories’ divergence quantifiable and range-bound.  

  **What a defender of the "losing" theory might say:**  
  - **EDT defender:** "CDT ignores that fleeing is strong evidence the hunter is in Aleppo. Even with the road risk, staying is safer because it correlates with the hunter being absent. CDT’s recommendation to flee when \(p\) is low is reckless: it gambles on a low-credence world."  
  - **CDT defender:** "EDT conflates evidence with causation. The hunter’s location is fixed; fleeing doesn’t cause her to be in Aleppo. The road risk is real, but if the hunter is likely in Damascus (when \(p\) is low), fleeing causally improves survival. EDT’s stay-only verdict is fatalistic."  

  **Value:** This case isolates the core disagreement—causal vs. evidential reasoning under correlated acts and independent risks—without exotic elements. It forces the distinction by making EDT’s verdict constant (stay) while CDT’s depends on the agent’s belief about her own action. The hazard ensures CDT sometimes recommends fleeing, preventing the symmetric indifference of the original case. It is not merely "Newcomb with noise"; it is a foundational dilemma where evidentialists and causalists genuinely perceive different dominant acts.
