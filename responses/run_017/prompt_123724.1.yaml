          And EDT is indifferent. So without hazard, both theories are indifferent between the two acts only at p=1/2? But EDT is always indifferent. So they don't disagree? 

          In the original Death in Damascus (without hazard), EDT is indifferent and CDT requires mixing with 1/2. But in the choice, if the agent has a prior p, CDT may not be indifferent. 

          However, the disagreement is that EDT is indifferent for every p, while CDT is not: CDT has a preference that depends on p. But at p=1/2, CDT is also indifferent. 

