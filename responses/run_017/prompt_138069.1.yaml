prompt: |-
  hey — i need a poem to close out the last session of my intro metaphysics seminar. weve spent two weeks on the statue and the clay and i want something better out of them than huh, weird.

  write a sestina: six stanzas of six lines plus a three-line envoi. end-words in this opening order — CLAY, STATUE, SHAPE, GRAM, SAME, STILL — permuted properly, and the envoi has to get all six back in and land on STILL. no need for strict meter, just keep the lines roughly the same length.

  put it in a museum conservation lab that is deciding whether to roll the whole piece into a ball to ship it and re-form it at the other end, and get the metaphysics right rather than naming it: the lump survives being squashed, the statue doesnt; the lump predates the sculptor, the statue doesnt; the statue can lose or gain a bit of matter and carry on, the lump has the matter it has; and right now the two of them are in the same place, same matter, same weight, same causal powers, so it isnt physics that settles which one is there. someone who actually knows this literature should find the poem right, not just find the word constitution in it.

  the thing im really after, though, is a view ive been pushing on them, call it the paper-thin view: there is no deep fact about which of the two the museum has beyond what its bookkeeping tracks — the piece is insured at two million as a statue and at the price of raw material as clay, and if the gallery switched to insuring by the gram, or some religion bought the lump and consecrated it, then on this view what the museum has would change too. i want the poem to work that consequence honestly, including the way it makes the answer sound optional, and to let the sestina form carry it: the same six words coming back over and over in new company, never turning into one another. feel free to let the speaker flirt with the move that there is no statue at all, just clay arranged statuewise, but dont let the poem settle there either. american english please, and leave it unresolved — no last line that tells the students which thing it is.
reasoning: |-
  Okay, let me tackle this fascinating request for a metaphysics seminar closing poem. The user wants a sestina that captures the nuanced statue/clay debate while pushing their "paper-thin view" - where institutional framing determines what exists. 

  Hmm, the constraints are precise: six rotating end-words (CLAY, STATUE, SHAPE, GRAM, SAME, STILL), museum conservation lab setting, and strict metaphysical accuracy about constitution. The real challenge is making the form serve the philosophy - those recurring end-words must feel like the persistent yet shifting identities of the artwork.

  First, I consider how to stage the scene. A conservation lab debating shipping methods is perfect - rolling the piece into a ball literalizes the "lump survives, statue doesn't" premise. The tension between preservation (STATUE) and practicality (CLAY) mirrors the metaphysical dilemma. 

  For the paper-thin view, I'll use insurance values and religious reconsecration as concrete examples showing how framing alters what's "real". The speaker should almost deny the statue's existence ("just CLAY arranged STATUE-wise") but pull back - keeping both possibilities in play. 

  The sestina's repetitive form is ideal here: each stanza rearranges the same words, just as the same matter rearranges its meaning. That last STILL in the envoi must hang unresolved - no philosophical closure, just the object persisting ambiguously.

  Key lines to include:
  - Matter-based identity (GRAM/SAME weight but different survival conditions)
  - Causal powers equality ("same heat conducts")
  - Institutional ontology ("insured by the GRAM")
  - The shipping dilemma as practical test

  American English phrasing is crucial - no Britishisms like "lorry" or "torch". Keeping lines roughly pentameter but flexible as requested. Most importantly: no resolution. The students should leave with the tension, not an answer.
answer: |-
  ## Conservation Decision: Object #7

  The conservator rubs her thumb on **CLAY**,
  Not touching *him* – the titled **STATUE**, prone.
  Dust motes describe his fragile, famous **SHAPE**.
  The invoice states the value by the **GRAM**,
  But manifests insist: the piece is **SAME**
  As cataloged. The object lies quite **STILL**.

  This shipping crate demands the piece lie **STILL**,
  Secured as dense, inert, potential **CLAY**.
  The policy declares the weight the **SAME**,
  Whether they fear the loss of prized **STATUE**
  Or merely priced the purified kaolin **GRAM**
  By **GRAM**. But risk resides within the **SHAPE**:

  A careless hand could shatter form, wreck **SHAPE**,
  Reduce the art to fragments lying **STILL**.
  The insurer pays for *art* – not per dry **GRAM** –
  Would pay for loss of meaning, not lost **CLAY**.
  Is payment proof the fragile **STATUE** *is*?
  Or just the cost for keeping things the **SAME**?

  Before the chisel bit, was it the **SAME**?
  Just substance lacking purpose, lacking **SHAPE**?
  The artist found the waiting godlike **STATUE**
  Within the mound. It wasn't always **STILL** –
  It held potential, just damp, heavy **CLAY**.
  Its essence shifted, measured not by **GRAM**.

  Its being now? Is it defined by **GRAM**,
  Atomic count? Or something else the **SAME**?
  The matter here was always just this **CLAY**.
  The meaning granted by the human **SHAPE**,
  The story told. Yet physics holds it **STILL**:
  Same heat conducts, same mass – is it the **STATUE**

  Alone? Or *also* just the lump? The **STATUE**
  Requires this form. The value-per-**GRAM**
  For art is nonsense. Crush it? Then lie **STILL**
  As shattered sherds, no longer quite the **SAME**
  As when defined by consecrated **SHAPE**.
  Is all there *really* present just the **CLAY**?

  Perhaps... just **CLAY**, arranged **STATUE**-wise, mere **SHAPE**
  Conjured on ledgers, priced by precious **GRAM**,
  Insured as **SAME**... till faith renames it **STILL**.

  ***

  **Envoi**

  The paperwork insists: preserve the **SHAPE**.
  The crate demands: just treat it as mere **CLAY**.
  The weight remains precisely tracked by **GRAM**,
  The matter counts as metaphysically **SAME**.
  Insure as *art*? Insure as *lump*? **STATUE**
  Or substance waits... ambiguous and **STILL**.
