prompt: |-
  I am leading next week's session in an upper-level seminar on ethics and public policy — 18 students, 90 minutes, the topic is paternalism and nudging. Everyone will have already read the standard material, including the libertarian-paternalist reply that a nudge is permissible when it leaves the options open and makes the chooser better off as judged by themselves. I want to run an activity rather than lecture, and I would like your help designing it.

  The angle I want them to feel is something I have been calling an orphaned default. Real choice architecture is sticky: pension auto-enrolment rates, organ-donation registries, app privacy settings, and default enrolments in this university's own systems were each set for one population, justified by that population's own judgments, and then inherited by later cohorts whose ends differ. Because a default is largely invisible to the people it governs, nobody complains and nobody re-audits it, so the as-judged-by-themselves test quietly detaches from any actual person. There is also an auditing asymmetry: setting a default is a single deliberate act by someone with the job, whereas noticing that an inherited default needs revisiting requires someone to see a choice that no longer looks like one.

  Here is what I want. A runnable activity in which participants first experience a default as a genuine benefit — say, the familiar two-selves setup, where the default rescues them from something they themselves would later regret — and then find themselves still governed by the same default after their own preferences have changed, with the default never revisited and with no one on the choice-architecture side assigned to check it. Stakes should be small but real: something about how the remaining class time is spent, or a comparable token good. The invisibility has to be something they run into and only afterwards see, not something I announce in advance.

  Please give me the setup and materials, the rounds with what participants are and are not told at each stage, the stake structure, and a debrief that maps specific moments onto (a) the as-judged-by-themselves defence, (b) the orphaned-default problem, and (c) the auditing asymmetry. Then tell me what will predictably go wrong the first time I run it, and be frank about which part of the idea the activity cannot produce on its own and which I will have to state outright. My own sketches keep collapsing into either a lecture with props or a set-up where the nudge looks bad from the start; I need the defence to actually land before it is put under pressure.
reasoning: |-
  We are designing an activity to illustrate the "orphaned default" problem in the context of nudging and paternalism. The activity should:
  1. Start with a situation where a default is beneficial (aligned with participants' own judgments).
  2. Then, after preferences change, the same default persists without being revisited, becoming misaligned.
  3. Participants should experience the invisibility of the default and the lack of auditing.

  We'll use a simple in-class decision that involves a token stake: how to spend a portion of the class time.

  **Activity Title:** The Class Time Allocation Activity

  **Stake:** 10 minutes of class time that can be used in one of two ways. The rest of the 80 minutes is for the seminar as planned.

  **Setup:**
  - The activity will run in two rounds: Round 1 (at the beginning of class) and Round 2 (after a break or about 30-40 minutes into class).
  - We will use a default setting for how the 10 minutes are spent, and participants will have the option to change it (but the default will be sticky and not revisited).

  **Materials:**
  - Index cards (or a simple online form if the class is tech-enabled) for voting in Round 1 and Round 2.
  - A way to display the current default (e.g., a slide or whiteboard).

  **Round 1: Setting the Default (Beneficial Nudge)**
  - **Context:** At the start of class, tell students: "We have 10 minutes of class time that we can use flexibly. We have two options for how to use this time: 
      Option A: A short, fun, and relaxing trivia game about ethics (with small candies for correct answers).
      Option B: An additional 10 minutes of open discussion on the reading.
    We will decide by a vote. However, to make sure we don't spend too much time deciding, we'll use a default. The default is set to Option A (trivia game) because past seminars in this room have found that starting with a light activity helps break the ice and gets everyone engaged. But you can vote to change it to Option B if you prefer."
  - **Voting:** 
    - Each student gets an index card. 
    - They can write either "A" (for trivia) or "B" (for discussion) or leave it blank. 
    - Explain: "If you leave your card blank, it means you accept the default (Option A). If you want Option B, you must write 'B'."
  - **Collect and Tally:** 
    - Tally the votes. Count blanks as A. 
    - Announce the result. (Given that it's the beginning of class and they might be tired, and because the default is set to the fun option, it's likely A will win. But even if B wins, we can adjust the story. However, to make the point, we want the default to be accepted in Round 1.)

  **Transition:**
  - After Round 1, conduct the chosen activity (trivia if A won, discussion if B won). 
  - Then, move on with the seminar. About 30-40 minutes in, take a break. During the break, set up for Round 2.

  **Round 2: The Orphaned Default**
  - **Context:** After the break, say: "We now have another 10-minute block to allocate. We have the same two options: 
      Option A: Trivia game (but note: we already did one if A was chosen in Round 1, so this would be a second one).
      Option B: Additional discussion time.
    However, we are going to use the same decision rule as before. The default is still set to Option A (trivia) because that's what was set for the first vote. Remember, if you don't vote, it counts as A. If you want B, you must write 'B'."
  - **Voting:**
    - Hand out index cards again. Same rules: blank = A, write 'B' for B.
  - **But note:** 
    - The situation has changed: they've already had a trivia game (if A won in Round 1) and might now prefer to have discussion. Or if they had discussion first, they might now want trivia. But the default hasn't been updated to reflect the new context.
    - Also, the default is set to A, which was justified for the first vote (when they were fresh and needed ice-breaking) but now might not be.

  **Collect and Tally:**
  - Tally the votes. Count blanks as A.

  **Debrief:** (This is crucial. Map the experience to the concepts.)

  1. **Start by asking:** 
     - "How did you feel about the voting process in Round 1? Was the default helpful?" 
     - (They might say it was efficient, they liked the trivia, etc.)

  2. **Then ask about Round 2:**
     - "How did you feel about the voting process in Round 2? Was the default still helpful? Why or why not?"
     - (They might note that they had already done trivia and now wanted discussion, but the default was still trivia. Or if they had discussion first, they might have wanted trivia but the default was still trivia and now they wanted it again? We need to design so that the preference shifts. Let's assume in Round 1 they were tired and wanted trivia, but after a break and some discussion, they now want to dive deeper into the material.)

  3. **Key points to draw out:**
     - **The as-judged-by-themselves defence:** In Round 1, the default was set based on the judgment of past students (or the typical student) and it likely aligned with their own judgment at that time (they were new to the class, needed ice-breaking). It made them better off by their own judgment then.
     - **The orphaned-default problem:** The default that was set for Round 1 was carried over to Round 2 without being re-evaluated. The context changed (they are no longer at the beginning, they've already done one trivia) but the default didn't. It became "orphaned" because it was set for a previous situation and then inherited without being updated. The fact that it was set and then not revisited is the problem.
     - **The auditing asymmetry:** Setting the default was a one-time act (by the instructor, acting as the choice architect for Round 1). But in Round 2, no one was assigned to check whether the default was still appropriate. The burden to change it fell on the students (by voting B), but the default was invisible to many (they might have just left it blank without thinking) and there was no process to automatically review it.

  4. **Connect to real-world examples:**
     - Pension auto-enrollment: The default contribution rate was set for workers at a certain time, but inflation or changes in the job market might make that rate too low for new workers. But it persists because no one is assigned to update it.
     - Organ donation: A default set for one generation might not fit the next if medical advances change the implications of donation, but it remains because it's not revisited.
     - University systems: Default settings for privacy in an app might be set for the first cohort and then never updated even as new privacy concerns emerge.

  **Predictable Problems:**
  1. **Round 1 might not go as planned:** 
     - If students vote overwhelmingly for B in Round 1, then the default (A) didn't win. But you can adjust: note that even if they voted against the default, the default was set and then carried over. The point is the carry-over without review. You can say: "Even though you changed it in Round 1, the system still had the same default (A) for Round 2 because the default setting was never updated."

  2. **Round 2 might not show the problem:**
     - If in Round 2 they actively vote and change the default, then the problem is mitigated. But you can point out that in reality, most people don't change defaults. Also, the fact that they had to actively vote to change it (and some might not have bothered) is the point. In the debrief, you can ask: "How many of you in Round 2 left the card blank without much thought because you were focused on the seminar?" 

  3. **The preference shift might not be strong:**
     - To increase the chance of a shift, you can design the options so that Option A is less appealing in Round 2. For example, after having already done trivia, they might feel they don't need another. Or, if they had discussion in Round 1, they might now want trivia. But if they had trivia in Round 1 and then want more discussion, that's the shift we want.

  4. **Students might see the setup:**
     - They might realize that the default is being set and then carried over. That's okay because the debrief will still work. But to reduce this, don't announce the connection between the rounds until the debrief.

  **What the Activity Cannot Produce and Must Be Stated Outright:**
  - The activity shows the problem in a microcosm, but it cannot fully capture the long-term, large-scale nature of orphaned defaults (e.g., over years in pension plans). You must explain that in real systems, the time frames are longer and the stakes are higher, and the invisibility is more profound because the original reasons for the default are forgotten.
  - The auditing asymmetry might not be fully clear without explicitly stating: "In Round 1, I set the default as a deliberate act. But in Round 2, did anyone think it was their job to check if the default was still good? No, because there was no assigned auditor. That's the asymmetry: setting is a one-time job, but maintaining requires ongoing attention that often isn't assigned."

  **Revised Setup to Enhance the Shift:**
  - In Round 1, emphasize that they are at the beginning of class and might be tired or need to warm up (so trivia is appealing).
  - In Round 2, after having done the trivia and then engaged in deep discussion, note that they are now "in the zone" and might want to continue the discussion. Also, if they had discussion in Round 1, they might now want a break with trivia. But the default remains A.

  **Final Flow:**
  1. Round 1: Vote on the first 10 minutes (default A: trivia).
  2. Conduct the chosen activity.
  3. Proceed with seminar for 30-40 minutes (include a break if needed).
  4. Round 2: Vote on the next 10 minutes (same default: A).
  5. Conduct the chosen activity (if they choose trivia again, do a quick round; if discussion, have it).
  6. Debrief.

  This activity should give them a lived experience of the orphaned default and set the stage for a rich discussion.
answer: |-
  ### Activity Design: "The Time Allocation Experiment"

  #### **Core Concept**
  This activity simulates an "orphaned default" by having students vote on how to use two 5-minute blocks of class time (10 minutes total) across two rounds. The default option is set in Round 1 based on a plausible "past cohort's" preferences, aligns with students' initial needs, but becomes misaligned in Round 2 after their preferences shift. The default is never audited, illustrating how sticky choice architecture detaches from current judgments.

  #### **Stakes**
  - **Real but small**: 10 minutes of class time (5 min per round) allocated to one of two options:  
    - **Option A (Social)**: Light, non-academic activity (e.g., sharing fun facts about themselves).  
    - **Option B (Academic)**: Structured debate on a low-stakes ethics question (e.g., "Is it ethical to keep exotic pets?").  
  - **Token incentive**: The chosen activity will actually happen. Students experience the outcome.

  #### **Materials**
  - **Voting slips**: Half-sheets of paper (two per student).  
  - **Two boxes** labeled "OPTION A" and "OPTION B" for vote collection.  
  - **Whiteboard** to display the current default (hidden until voting starts).  
  - **Timer** (for the 5-minute activities).

  ---

  ### **Activity Setup (Total Time: 30–35 minutes)**  
  *Do not reveal the orphaned-default theme until the debrief.*

  #### **Round 1: Beneficial Default (Minutes 0–10)**  
  **Context**: Students enter a "new system" (the seminar) with a default set by past users.  
  - **Instructor script**:  
    *"Welcome! Before we dive into today’s topic, we have 5 minutes to use flexibly. Past students in this seminar found it helpful to start with a quick social icebreaker (Option A) to build rapport before heavy discussions. Option B is a mini-debate on an ethics topic.*  
    *Voting rules:*  
    - *The **default is Option A** (social icebreaker). If you do nothing, your vote counts as A.*  
    - *If you prefer Option B (debate), **write 'B'** on your slip and drop it in the B box.*  
    - *You have 60 seconds to vote."*  

  **Key mechanics**:  
  - Place the A and B boxes at the front.  
  - Write "DEFAULT: OPTION A" on the whiteboard (revealed only during voting).  
  - **Do not mention**: Why the default exists (beyond "past students"), or that there will be a second vote.  
  - **Tally votes**: Count slips in B box as "B." All other slips (blank, A votes, or unsubmitted) count as "A." Announce the winning option.  
  - **Run the activity**: Conduct Option A or B for 5 minutes.  

  *Why this works*:  
  - At the start of class, students likely prefer Option A (social) to "warm up." The default feels helpful and efficient (landing the "as-judged-by-themselves" defense).  
  - Invisibility: Students accept the default passively (many won’t vote).  

  #### **Transition (Minutes 10–40)**  
  - Hold the main seminar discussion on paternalism/nudging for 30 minutes.  
  - **Critical subtle shift**: During the discussion, have students analyze a case study where preferences evolve (e.g., how COVID-19 changed attitudes about privacy vs. public health). This primes them to "update" their own preferences.  

  #### **Round 2: Orphaned Default (Minutes 40–50)**  
  **Context**: Preferences have shifted (due to the seminar), but the default remains unchanged and unaudited.  
  - **Instructor script**:  
    *"We have another 5-minute flexible block! We’ll use the same voting system as before.*  
    *Rules reminder:*  
    - *The **default is still Option A** (social icebreaker). If you do nothing, it’s an A vote.*  
    - *Write 'B' and use the B box only if you want the debate.*  
    - *60 seconds to vote."*  

  **Key mechanics**:  
  - **Do not change anything**: Same boxes, same default on the whiteboard (Option A).  
  - **Do not acknowledge**: That the context has changed (post-discussion, they’re now "warmed up" and likely prefer academic engagement).  
  - **Tally and run** as in Round 1.  

  *Why this works*:  
  - After 30 minutes of deep discussion, students now prefer Option B (debate). The unchanged default (A) is misaligned but invisible.  
  - Auditing asymmetry: No one is assigned to re-evaluate the default. Students must proactively opt out, but most won’t (due to inertia).  

  ---

  ### **Debrief (Minutes 50–90)**  
  ***Reveal the orphaned-default concept here for the first time.***  

  #### **Step 1: Elicit Student Reactions (5 minutes)**  
  Ask:  
  - *"How did you feel about the voting process in Round 1? Was the default helpful?"*  
    - → **Expected response**: "It was efficient," "I liked starting social," "I didn’t think about it."  
  - *"How did you feel in Round 2? Did anything feel different?"*  
    - → **Expected response**: "I wanted debate but forgot to vote," "Why was the default still social?"  

  #### **Step 2: Map the Activity to Concepts (15 minutes)**  
  Draw three columns on the board:  
  | **Round 1** | **Round 2** | **Real-World Parallel** |  
  |-------------|-------------|--------------------------|  
  | **a) As-judged-by-themselves defense**:  
    - *"In Round 1, the default (A) matched your preferences—you were ‘cold’ and wanted icebreakers. It made you better off by your own judgment. This mirrors libertarian paternalism: nudges are okay when they reflect your own goals."*  
    - **Evidence**: Students accepted the default; no complaints.  

  | **b) Orphaned default problem**:  
    - *"In Round 2, your preferences changed (you were ‘warmed up’ and wanted debate), but the default didn’t. It was set for the ‘past cohort’ (you in Round 1) and inherited without review. Like pension auto-enrollment, it became detached from actual judgments."*  
    - **Evidence**: Default won in Round 2 despite shifted preferences (ask: "Who wanted B but didn’t vote?").  

  | **c) Auditing asymmetry**:  
    - *"I set the default once in Round 1 as the ‘choice architect.’ But in Round 2, did anyone think, ‘I should check if this default still works’? No—because auditing isn’t anyone’s job. Real-world systems (like your university’s app settings) have the same flaw: setting is active; re-evaluating is passive."*  
    - **Evidence**: Votes weren’t re-tallied; no student was assigned to propose a new default.  

  #### **Step 3: Connect to Real Cases (10 minutes)**  
  - **Pensions**: "Auto-enrollment rates were set for 1990s workers. Do they fit gig-economy workers today? Who’s checking?"  
  - **Organ donation**: "Default ‘yes’ was set for one generation. If medical advances change risks, does it still align with donor judgments?"  
  - **University systems**: "Privacy defaults were set pre-COVID. Do they reflect post-remote learning preferences?"  

  #### **Step 4: Critical Takeaway (5 minutes)**  
  *"Nudges aren’t ‘set and forget.’ Orphaned defaults happen because:  
  1. Invisibility: People don’t see defaults.  
  2. No ownership: Nobody is paid to re-audit.  
  3. Sticky systems: Updating requires friction (e.g., voting).  
  The ‘as-judged-by-themselves’ test fails when the judge changes, but the nudge doesn’t."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Students see through the setup in Round 2.  
     - *Why*: Suspicious of repeated voting.  
     - *Fix*: Mask the intent with a "transition seminar" (the ethics case study) to naturalize preference shifts.  

  2. **Problem**: Default loses in Round 2 (too many vote for B).  
     - *Why*: Some students are vigilant.  
     - *Fix*: In debrief, emphasize: "Even if B won, did you *expect* the default to auto-update? How many assumed it would stay A unless changed?" Highlight inertia.  

  3. **Problem**: "As-judged-by-themselves" defense feels weak if Round 1 default isn’t embraced.  
     - *Why*: Students might dislike Option A initially.  
     - *Fix*: Prime acceptance by stressing "past students loved it" and starting class with high energy.  

  ### **What the Activity Can’t Do (Requires Your Input)**  
  - **Cannot produce**: The *scale* of real-world harm (e.g., pensions affecting lifetime savings).  
    - *You must state*: "In real policy, orphaned defaults cause large, slow-burn harms—unlike our 5-minute stakes."  
  - **Cannot produce**: The *systemic invisibility* of defaults (e.g., hidden app settings).  
    - *You must state*: "In the wild, people rarely know defaults exist. Our voting made it visible—but real choice architecture is buried."  

  ---

  ### **Why This Works**  
  - **Defense lands first**: Round 1 makes the nudge feel helpful (students experience efficiency/alignment).  
  - **Pressure emerges naturally**: Round 2’s misalignment arises from their own preference shift (not forced by you).  
  - **Invisibility is experiential**: Students only realize the default was sticky in retrospect (debrief revelation).  

  This design avoids "lecture with props" by making students live the problem—first as beneficiaries, then as victims, of orphaned defaults. Run it tight, and the debrief will ignite rich discussion!
