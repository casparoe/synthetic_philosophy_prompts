prompt: |-
  I'm putting together a seminar on the boundary problem — who has to be in the demos for a given decision — and I need a case that breaks the "everyone whose interests are affected gets a say" principle in a way that isn't just the usual gripe that it balloons the demos out to everyone on earth.

  The wrinkle I want is endogenous affectedness: the harm is real if the affected group doesn't get a vote, but if they do get a vote they block the thing, so the harm never happens, so by the principle's own lights they shouldn't be in the demos, so they don't get a vote, so the harm happens. The principle never settles.

  Constraints: one paragraph; a realistic body making a realistic decision (water authority, zoning board, transit agency, whatever); the affected group has to sit outside the jurisdiction, so the rival principle — the demos is everyone subject to the state's coercion, its laws and police and courts — excludes them cleanly; and the loop has to fall out of the ordinary machanics of the vote, not from anyone threatening retaliation or from anything exotic.

  After the scenario: say what each principle delivers and why, point at the one feature doing the work, tell me what happens if you tweak the case so the harm is the same size whichever way the vote goes, and tell me how someone who likes the affected-interests principle would try to wriggle out. The verdicts have to fall out of the principles rather than be written into the setup.
reasoning: |-
  Okay, the user is putting together a seminar on the boundary problem in democratic theory, specifically focusing on who should be included in the demos for decision-making. They need a case study that challenges the "affected interests" principle through endogenous affectedness, where the harm depends on whether the group gets a vote. 

  Hmm, the user wants a realistic scenario—like a water authority or zoning board—where the affected group is outside the jurisdiction. The twist is that if the group is included, they block the decision and prevent the harm (so they shouldn't be included under the principle), but if excluded, the harm occurs (so they should be included). It’s a loop. 

  I recall Robert Goodin’s work on this paradox. A reservoir case fits perfectly: upstream residents face flooding if a dam is built. If they vote, they block it, so no flood = no affectedness. If excluded, the dam gets built, they’re harmed, so should’ve been included. Classic chicken-and-egg problem. 

  The user also wants analysis: 
  - Affected interests principle loops endlessly. 
  - Coercion principle cleanly excludes outsiders. 
  - The key is the harm’s contingency on inclusion. 
  - If harm size were fixed regardless of voting, the loop breaks—inclusion would be straightforward. 
  - Defenders might redefine "harm" or add procedural fixes, but those feel ad hoc. 

  This case exposes a deep flaw in the principle. The coercion alternative avoids it but at the cost of ignoring outsiders. Perfect seminar material—concrete, no loopholes, and philosophically thorny.
answer: |-
  Here's a case meeting your specifications:

  **The Case:** A regional Water Authority (WA) within State A votes on building a flood-control dam on the River Apex. The dam's reservoir would flood a small, unincorporated valley just across the border in State B, displacing 50 residents ("Valley B Residents" - VBRs). If built, the dam protects 10,000 WA ratepayers downstream in State A from catastrophic flooding. If the VBRs are included in the WA's vote (requiring interstate compact approval), they will unanimously vote *against* the dam to save their homes, blocking its construction. If excluded, the WA (representing only State A residents) will approve the dam, flooding the valley. The harm to the VBRs (displacement) only occurs if they are *excluded* and the dam is built. If *included*, they block the dam, preventing the harm, meaning they weren't "affected" by the outcome *under that specific vote*.

  **Principle Verdicts:**
  1.  **Affected Interests Principle:** This loops endlessly. *If excluded*, the dam is built, VBRs are harmed → they *were* affected → they *should* have been included. *If included*, they block the dam, no harm occurs → they *were not* affected → they *should not* have been included. The principle cannot settle on a stable demos for this decision.
  2.  **Coercion Principle:** The VBRs reside entirely in State B, are not subject to the WA's laws, police, or courts within State A, and the WA lacks direct jurisdiction over State B land. Therefore, they are cleanly **excluded** from the demos. The WA votes without them.

  **The Key Feature:** The **endogeneity of the harm** – the harm itself (displacement) is *caused* by the exclusion decision necessary to enact the policy that causes the harm. Inclusion prevents the harm, negating the justification for inclusion.

  **Tweaking Harm Size:** Suppose the dam *must* be built somewhere, and an alternative site exists that would flood 50 residents *within* State A (same harm size) if the River Apex site is blocked. Now:
  *   If VBRs are *excluded*, the WA builds the River Apex dam, harming VBRs.
  *   If VBRs are *included*, they block River Apex dam, leading the WA to build the alternative dam, harming State A residents instead. The VBRs are *still affected* by the decision (their valley is saved), but crucially, the *harm* (displacement) is suffered by *someone else* regardless of inclusion/exclusion. The loop **breaks**. The affected interests principle would likely mandate including the VBRs (they are affected by the choice of site) and also the residents at the alternative site (they are affected by the potential harm). The demos expands, but settles.

  **Wriggling Out (Affected Interests Defender):** A defender might argue:
  1.  **Counterfactual Harm:** The VBRs *are* affected *counterfactually* – the *threat* of harm exists if excluded, and that potential harm itself constitutes an affected interest justifying inclusion, regardless of whether inclusion ultimately prevents the harm. (Problem: This risks infinite regress for *any* potential harm).
  2.  **Procedural Inclusion ≠ Outcome Control:** Argue inclusion means having a *voice*, not necessarily a *veto*. Perhaps VBRs get a vote weighted less than WA residents, or only advisory input. (Problem: This abandons the core "say" = vote idea and introduces arbitrary weighting).
  3.  **Define "Harm" Narrowly:** Claim saving one's home isn't preventing harm but receiving a benefit, and the principle only mandates inclusion for those suffering harm, not those gaining benefit. (Problem: This is an artificial distinction; displacement is clearly harm, preservation of home is the avoidance of that harm).

  **Conclusion:** The coercion principle delivers a clear, stable demos (WA residents only), excluding VBRs. The affected interests principle fails to resolve the demos due to the endogenous nature of the harm, creating an irresolvable logical loop specific to this type of contingent decision.
