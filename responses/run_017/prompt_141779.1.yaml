  The strongest version the friend might intend (Thesis 9) treats consent as purely performative, but this collapses under scrutiny when applied to real-world power imbalances. The medical trial case clearly fails multiple validity conditions - especially the risk misrepresentation which voids the statistical basis of consent.

  The user's instincts are correct: even if consent negates complaints about harm, it doesn't resolve the antecedent wrong of deceptive procurement. The maxim only applies when consent is properly constituted, which requires examining exactly the circumstances the friend wants to ignore.
answer: |-
  Here is a disambiguation of "volenti non fit iniuria" into distinct theses, evaluated for defensibility, compatibility with consent-undermining factors, and implications for your case. I've included your suggested readings, added crucial missing ones (Theses 8, 9, and 10), and integrated your two "groping" moves.

  ### **The Menu of Theses**
  **Key for Evaluation**  
  - **Tautological/Trivial**: Logically true but normatively empty; cannot justify actions.  
  - **Substantive & Defensible**: Coherent, ethically plausible, widely accepted in context.  
  - **Substantive but False**: Clear claim, but ethically or logically unsound.  
  - **Compatibility**: Whether thesis allows consent to be undermined by **Deception (D)**, **Pressure/P (P)**, or **Incompetence (I)**.  
  - **Supports Friend?**: Whether thesis supports "no inquiry into consent's validity needed" in your case.  
  - **Verdict for Case**: Impact on the medical study scenario.

  ---

  1. **The Semantic Tautology**  
     *Thesis*: "Consent" by definition implies no wrong is done *if we mean 'valid consent'*. The maxim is true but vacuous—it tells us nothing about what constitutes valid consent.  
     - *Defensibility*: **Tautological/Trivial**.  
     - *Compatibility*: N/A (doesn’t engage with D, P, I).  
     - *Supports Friend?*: **No**. It offers no justification for ignoring how consent was obtained.  
     - *Verdict for Case*: **Idle**. Cannot resolve your dispute; friend misuses it as substantive.  

  2. **Normative Power (Waiver/Transfer)**  
     *Thesis*: Consent is a moral/legal power to waive rights. Valid consent *extinguishes* the wrong; invalid consent does not. The maxim *presupposes* validity.  
     - *Defensibility*: **Substantive & Defensible** (core of contract/tort law).  
     - *Compatibility*: **Requires valid consent**, so undermined by D, P, I.  
     - *Supports Friend?*: **No**. Forces inquiry into validity (e.g., was the waiver genuine?).  
     - *Verdict for Case*: **Undermines friend**. Consent invalid if deception (misstated risk) or pressure (coercive payment) exists.  

  3. **Welfare Evidence Thesis**  
     *Thesis*: Consent is *evidence* that no welfare setback occurred (since people don’t consent to self-harm).  
     - *Defensibility*: **Substantive but False**. People consent to risks harming welfare (e.g., smoking). Consent ≠ welfare optimization.  
     - *Compatibility*: Irrelevant (it mistakes consent for welfare).  
     - *Supports Friend?*: **No**. If consent is merely evidence, it can be rebutted (e.g., by showing misunderstanding).  
     - *Verdict for Case*: **False and harmful**. Participant’s welfare *was* set back; consent was mistaken evidence.  

  4. **No Actionable Wrong (Procedural)**  
     *Thesis*: "No wrong" means no *legal or complaint-worthy* wrong, even if moral harm occurred. Consent blocks recourse.  
     - *Defensibility*: **Substantive & Defensible in limited contexts** (e.g., assumption of risk in torts).  
     - *Compatibility*: **Ignores validity**; treats formal consent as sufficient regardless of D, P, I.  
     - *Supports Friend?*: **Yes, but unjustifiably**. Prioritizes procedure over ethics.  
     - *Verdict for Case*: **Dangerous**. Excuses fraud ("she signed, so no remedy"). Legally dubious if deception proven.  

  5. **Consent-Under-a-Description**  
     *Thesis*: Consent is valid only to the *specific act/risk described*. Deception about material facts (risk magnitude, nature, identity) voids consent.  
     - *Defensibility*: **Substantive & Defensible** (foundational in consent theory).  
     - *Compatibility*: **Explicitly undermined by D**; P and I may also void.  
     - *Supports Friend?*: **No**. Demands inquiry into accuracy of disclosure.  
     - *Verdict for Case*: **Fatal to friend**. Participant consented to "rare" risk, not 1/50 risk → no valid consent.  
     - *Your Move*: **Consent to Gamble ≠ Consent to Outcome** belongs here. Consent is to *known risks*, not actual outcomes. Harm from misrepresented risk voids protection.  

  6. **Voluntariness & Baselines**  
     *Thesis*: Consent requires voluntariness, defined against a moral baseline. Threats, exploitative offers ("take-it-or-leave-it" in unjust conditions), or severe pressure negate consent.  
     - *Defensibility*: **Substantive & Defensible** (e.g., coercion voids contracts).  
     - *Compatibility*: **Undermined by P** (and baseline may account for D/I).  
     - *Supports Friend?*: **No**. Requires examining background justice (e.g., was payment exploitative?).  
     - *Verdict for Case*: **Likely undermines friend**. If payment = "months’ wages," baseline may be unjust → pressure voids consent.  

  7. **Competence & Preformed Preferences**  
     *Thesis*: Only competent agents can consent. Competence requires understanding *and* preferences not distorted by the coercive context (e.g., poverty shaping "choice").  
     - *Defensibility*: **Substantive & Defensible** (e.g., informed consent in bioethics).  
     - *Compatibility*: **Undermined by I** (and potentially D/P if they cause incompetence).  
     - *Supports Friend?*: **No**. Forces inquiry into comprehension and context.  
     - *Verdict for Case*: **Undermines friend**. Lack of grasp of "1 in 50" + economic desperation may indicate incompetence.  

  8. **Residual Duties (Your Second Move)**  
     *Thesis*: Consent may waive claims to *harm*, but not to *deceptive procurement*. The maxim addresses harm-waiver, not fraud in inducement.  
     - *Defensibility*: **Substantive & Defensible**. Consent to harm ≠ consent to deception.  
     - *Compatibility*: **Distinguishes wrongs**: Harm waived by consent; deception independent.  
     - *Supports Friend?*: **No**. The *way* consent was obtained (lies) is still "someone’s business."  
     - *Verdict for Case*: **Critical**. Participant cannot complain about the harm *if consent valid*, but can sue for fraud. Maxim irrelevant to deception.  
     - *Your Move*: **Complaint About Lying ≠ Complaint About Harm** fits here. Fraud is a separate wrong.  

  9. **Strong Voluntarism (Friend’s Thesis)**  
     *Thesis*: *Any* expression of consent (e.g., signing) negates wrong, regardless of validity. Inquiry into validity is irrelevant because consent is performative.  
     - *Defensibility*: **Substantive but False**. Reduces consent to magic words; ignores autonomy.  
     - *Compatibility*: **Ignores D, P, I** by definition.  
     - *Supports Friend?*: **Yes, but indefensible**.  
     - *Verdict for Case*: **Morally bankrupt**. Validates fraud, coercion, exploitation.  

  10. **Moral Transformation Thesis**  
      *Thesis*: Consent morally transforms acts (e.g., surgery vs. stabbing). No wrong occurs *if valid*, because the act’s nature changes.  
      - *Defensibility*: **Substantive & Defensible** (when validity assured).  
      - *Compatibility*: **Requires validity**, so undermined by D, P, I.  
      - *Supports Friend?*: **No**. Validity is essential for transformation.  
      - *Verdict for Case*: **Undermines friend**. Misrepresentation prevents transformation (she consented to surgery, not Russian roulette).  

  ---

  ### **Conclusion for Your Case**
  - **Friend’s Position**: Relies on **Thesis 4 (No Actionable Wrong)** or **Thesis 9 (Strong Voluntarism)**. Both are ethically indefensible in your case.  
  - **Your Position**: Supported by **Thesis 2 (Normative Power)**, **Thesis 5 (Consent-Under-Description)**, **Thesis 6 (Voluntariness)**, **Thesis 7 (Competence)**, and **Thesis 8 (Residual Duties)**.  
  - **Fatal Flaw**: The **1/50 vs. "rare" deception** alone voids consent under **Thesis 5**, making the maxim inapplicable.  
  - **Maxim’s Idleness**: In cases involving deception, pressure, or incompetence, the maxim is **idle** unless validity is established first (per **Theses 2, 5, 6, 7, 10**).  

  **Take this to your friend**:  
  *"The maxim only works if consent is valid. Here, the risk was misrepresented (voiding consent under Thesis 5), the payment was coercive (voiding under Thesis 6), and comprehension was doubtful (voiding under Thesis 7). Even if the harm isn't actionable due to consent (Thesis 4), the fraud in obtaining consent (Thesis 8) is still a wrong. Your use of the maxim assumes validity rather than proving it—which is the whole debate."*
