  - User's intuitions point to two unarticulated arguments: (1) distinction between consenting to risk vs harm, and (2) separate wrong of deception regardless of harm

  I'll structure this as a numbered menu per the request, evaluating each interpretation for:
  1. Trivial/substantive/false classification
  2. Compatibility with consent-undermining factors (deception/pressure/incompetence)
  3. Whether it supports the friend's "no inquiry needed" conclusion
  4. Application to the medical trial case

  For the user's unstated arguments:
