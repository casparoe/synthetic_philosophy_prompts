  Okay, I need to grade this student's exam answer on philosophy of language and epistemology. The question has three parts (a, b, c) worth 6, 6, and 8 marks respectively. I'll go through each part carefully, assessing what the student got right, what they missed, and where they went wrong. 

  First, looking at part (a): The student explains the Moorean-absurdity argument for (K) well, showing how "p but I don't know p" sounds absurd while "p and I know p" doesn't. They correctly note this argues against (T) and favors something like (K). Where they slip is in explaining why it doesn't distinguish (K) from (R). The student says it's because any norm would make denying the norm sound absurd, but actually the key point is that (R) could also explain the absurdity since "p but I don't reasonably believe p" would sound equally odd. The student sort of gets this but buries it in vague language about "marked, misleading" behavior rather than stating directly that (R) generates parallel absurdity. They also miss explaining that the datum doesn't show knowledge is required specifically.

  For part (b), the lottery case: The student nails the setup and why it challenges (K) - Ada doesn't know but assertion seems acceptable. They correctly outline the two main replies for (K) defenders (deny acceptability or contextualism). Good coverage of how (R) handles it (permits) and (T) (permits if true but flawed). But they mischaracterize the blame aspect - the question specified constitutive norms don't necessarily imply blameworthiness for violation, yet the student says Ada would be "open to blame and sanction," which overstates. They needed to separate defectiveness from blame.

  Now part (c) on (DW): The student does an excellent job contrasting it - noting non-factive nature, audience-relativity via clause (iii), and differences from other norms. They correctly show it escapes lottery objection and handles Moorean absurdity. The criticism about guidance problems is strong, but they make two mistakes: falsely claiming no false assertion could violate (DW) (actually false assertions can violate if evidence doesn't support them), and overreaching by saying "any genuine norm must count some false assertions as defective" - that's not necessarily true for constitutive norms. Also, they miss noting how clause (ii) differs from (R) regarding defeaters.

  For scoring: Part (a) gets 5/6 (minor omissions), (b) 5/6 (good but blame error), (c) 7/8 (strong analysis with two substantive errors). Total 17/20 - a high B+.

  In my instructor note, I'll flag that the claim about false assertions in (c) is my least confident criticism since constitutive norms might not require falsity to imply defectiveness. If the literature allows purely epistemic norms without factive elements, that criticism fails.
answer: |-
  ### Comments for Student  

  **Overall:** Your answer demonstrates strong grasp of the core concepts and arguments, with clear articulation of positions and thoughtful engagement with the nuances of the norms. However, there are substantive omissions and errors in each part, particularly regarding the stipulated separation of defectiveness from blameworthiness and the structural features of (DW). Below is a detailed breakdown.  

  ---

  **(a) Mark: 5/6**  
  **What you got right:**  
  - You accurately set out the Moorean-absurdity datum and explained why it supports (K) over (T): The contrast between "p but I don’t know p" (absurd) and "p and I know p" (acceptable) is well described, and you correctly note that (K) explains this by linking assertion to representing oneself as knowing.  
  - You rightly observe that (T) cannot explain the datum (as "p but not p" is contradictory, not merely absurd) and that (T) is independently flawed (e.g., permitting assertions on hunches).  
  - You correctly state that the datum cannot distinguish (K) from (R), as both would generate absurdity for "p but I don’t satisfy the norm."  

  **Omissions/errors:**  
  1. **Omission:** You did not explicitly explain *why* the datum fails to favor (K) over (R). The question requires showing that (R) *also* predicts the absurdity: Under (R), "p but I don’t have epistemically reasonable belief for p" would sound equally absurd, since asserting represents oneself as satisfying (R). Your appeal to "marked, misleading" behavior gestures at this but does not directly address how (R) structurally mirrors (K) here.  
  2. **Error:** You claim the argument is "indirect evidence for (K)." This misrepresents the point: The datum is *compatible* with (R), not indirect evidence for (K). A correct treatment would stress that the datum is neutral between (K) and (R) because both norms generate the same pattern of absurdity.  

  **Improvement:** Clarify that (R) entails that asserting represents reasonable belief, making "p but I lack reasonable belief" self-undermining, just as under (K). Thus, the datum alone cannot adjudicate between them.  

  ---

  **(b) Mark: 5/6**  
  **What you got right:**  
  - You clearly outline the lottery case against (K): Ada’s assertion seems permissible despite her lacking knowledge (due to uneliminated error possibilities).  
  - You accurately summarize the two main replies for (K) defenders: (i) Deny permissibility (her assertion is improper); (ii) Contextualism/stakes-sensitivity (knowledge standards shift).  
  - You correctly note (R) permits the assertion (reasonable belief) and (T) permits it only if true (but is flawed for allowing lucky guesses).  

  **Omissions/errors:**  
  1. **Error:** You claim (K) implies Ada is "open to blame and sanction." This conflates defectiveness with blameworthiness, violating the stipulation (second paragraph) that constitutive norm violations *need not* entail blame (e.g., non-culpable ignorance). A correct treatment would stress that (K) renders the assertion *defective* (incorrect as an assertion) but Ada may *not* be blameworthy if she acted reasonably.  
  2. **Omission:** You do not explain *why* "many people find it acceptable" is a problem for (K). The objection hinges on intuition: If assertion requires knowledge, Ada’s act should feel defective, yet it does not. You describe the case but skip this key intuitive tension.  

  **Improvement:** Emphasize that (K) predicts Ada’s assertion is *defective* (not a proper assertion), but the intuition that it is *acceptable* challenges this prediction. Distinguish defectiveness (constitutive) from blame (pragmatic).  

  ---

  **(c) Mark: 7/8**  
  **What you got right:**  
  - You correctly contrast (DW) with other norms: (i) Non-factive (clauses satisfiable even if p is false); (ii) Audience-relativity (clause iii); (iii) Stronger than (R) due to clause (ii) (defeaters).  
  - You aptly show (DW) escapes the lottery objection (Ada satisfies all clauses; no reasonable challenge exists).  
  - You note it accommodates Moorean absurdity (asserting represents evidentiary support, making "p but no evidence" odd).  
  - Your "guidance problem" critique (audience-relativity impedes deliberation) is well argued.  

  **Omissions/errors:**  
  1. **Omission:** You do not address how (DW) handles the *contrast case* (lottery inspector). The question asks whether (DW) blocks assertion here, and you note this in passing but omit explicit assessment.  
  2. **Error:** You claim "(DW) contains no factive condition... no false assertion can violate it." This is incorrect: A false assertion *can* violate (DW) if clauses (i) or (ii) fail (e.g., evidence does not support p, or an undefeated defeater exists). (DW) is not *guaranteed* to permit false assertions.  
  3. **Overreach:** You argue that "any genuine norm must count some false assertion as defective," but this is not stipulated. Constitutive norms need not be factive (e.g., (R) is non-factive), so (DW) could still be a norm even if it never forbids false assertions *qua falsity*.  

  **Improvement:** Stress that (DW) *can* forbid false assertions (if evidence/defeater clauses fail) but does not *necessarily* do so. The deeper flaw is that clause (iii) risks making permissibility overly dependent on audience competence, not falsity.  

  ---

  **Total Mark: 17/20** (5 + 5 + 7)  
  **Strengths:** Clear writing, strong grasp of (a) and (b) arguments, insightful critique of (DW).  
  **Areas to work on:** (1) Strict adherence to stipulations (e.g., defectiveness ≠ blame); (2) Completeness in addressing all sub-questions; (3) Precision in characterizing non-factive norms.  

  --- 

  ### Note for Instructor  
  **Confidence in Criticisms:**  
  - **(a) Omission of (R)'s prediction:** High confidence. The student’s appeal to "marked" behavior is vague; the structural symmetry between (K) and (R) is central to the question.  
  - **(b) Conflation of defectiveness/blame:** Very high confidence. The stipulation explicitly demands this distinction, and the student’s phrasing ("open to blame") violates it.  
  - **(c) False assertion claim:** Moderate confidence. The student incorrectly asserts that no false assertion can violate (DW), but (i) or (ii) could be unsatisfied for a false claim. However, if all false assertions *happen* to satisfy (i)–(iii) (e.g., with misleading evidence), (DW) might never forbid them *because* they are false—but this is contingent, not necessary.  
  - **(c) "Genuine norm must forbid falsity"**: Low confidence. This is the **least confident criticism**. The stipulation does not require norms to be factive, and (R) is a counterexample. If a constitutive norm can be non-factive (like (R)), then (DW) could still qualify even if it never condemns falsity *as such*. The criticism fails if the literature allows non-factive constitutive norms.  

  **Key Withdrawal:** The "genuine norm" point in (c) would be retracted first if challenged. It overreaches by imposing an unsupported requirement on constitutive norms.
