  ## The Eulogy (Approx. 1,050 words, 7-8 mins)

  (Pause. Look out at the gathering)

  Maureen, family, friends, colleagues, former students… thank you for gathering today to remember Hugh. It’s a difficult thing, standing here. Not just because of the loss, which is immense, but because Hugh was… Hugh. He saw the world clearly, often argumentatively, and he cared deeply about getting the description right. Especially, I think, the description of a life. His life.

  He spent thirty-eight years in the classrooms and corridors of Parkside School. That’s a long time. It’s tempting to say he was *always* a certain way in that place. But Hugh wouldn’t have liked that. He’d want us to remember the moments. The specific, concrete moments where something happened. Because in those moments, he believed, you saw the person – not a fixed picture, but a living choice.

  So, let me share some moments.

  I remember visiting him once, years ago, when he was rehearsing a school play. It wasn’t going well. A young actor was struggling terribly with a monologue, frozen, utterly unconvinced by the words. The easy thing, the expected thing, would have been frustration. A sigh. Maybe moving on. Hugh didn’t do that. He sat down next to the boy, right there on the edge of the stage. He didn’t talk about projection or emotion. He asked him, very quietly, “What’s the *first* thing this character notices when he walks into the room? Is it the dust motes in the sunlight? The smell of old wood? The way his shoe squeaks?” He made it small, specific, real. He gave the boy something concrete to grab onto, a tiny point of entry into a vast feeling. That boy found his way into the speech, not because Hugh told him *how* to feel, but because Hugh showed him where to *look*. That was Hugh teaching.

  Another moment: A former student, Sarah, told me recently about her first French lesson with him. Nervous, struggling with pronunciation, she mumbled her way through. Hugh stopped her. Not harshly, but firmly. “Again,” he said. “Louder.” She mumbled again. “*Encore*,” he insisted. “Like you mean it.” Flustered, she blurted it out, loud and probably wrong. He nodded. “Better,” he said. “Now we have something to work *with*.” It wasn’t about perfection to start with; it was about commitment, about showing up fully in the attempt. He demanded presence. He demanded you engage with the thing itself, not just the idea of doing it. That was Hugh pushing.

  He loved words. Loved wrestling with big ideas. He carried a particular French philosopher around in his head, not as a youthful phase, but as a constant companion, a voice he’d argue with over decades. He read those dense pages because he believed – fiercely – that how we think shapes how we live. That ideas matter in the living room, in the classroom, in the choices we make. He didn't want philosophy to stay on the page; he wanted it to walk around in the world. That seriousness, that engagement, was fundamental to him.

  Which brings me, inevitably, to another moment. Tuesday, May 17th, 1994. A day that became a hinge-point. A student had made a serious mistake, getting hold of exam papers. Hugh, as his teacher, wrote a reference. He saw something in that young man worth acknowledging alongside the error. Then the head asked him to withdraw it. Hugh refused. And then he walked. He resigned. Mid-term. After decades at Parkside.

  (Pause)

  Many of you here remember that day vividly. Some thought it was a terrible mistake. Some thought it was the bravest thing they’d seen. Hugh himself? He never framed it for me as a grand stand on principle. He never painted himself as the hero or the martyr. He’d say, simply, “It’s what I did that Tuesday.” He described the weight of the head’s request, the feeling of the corridor floor as he walked out, the uncertainty that followed. He described it as a choice made then, in that room, with those people, facing that specific demand. He didn’t claim it was inevitable because he was ‘that kind of man’. He just said it was what he did. And then he had to live with the consequences, the changed path, the years that followed outside those familiar walls. He didn’t ask for it to make perfect sense in the grand story. It was a Tuesday. He acted. He lived with it.

  (Pause)

  That’s how he saw life. Not as a story already written, where every action simply reveals a fixed character, but as a series of moments. Moments of teaching, moments of argument, moments of quiet reading, moments of unexpected decision like that Tuesday. Moments where possibilities were open – to speak loudly or mumble, to sit down with a struggling student or walk past, to write the reference or withhold it, to stay or to go. Hugh chose. Again and again. He chose with conviction, sometimes stubbornly, sometimes after furious internal debate, but he chose *in* the moment, facing what was actually in front of him.

  He leaves behind shelves full of books, generations of students who remember that demanding presence, colleagues who recall fierce debates in the staff room, Maureen, who shared his life and his arguments. He leaves a profound absence. The absence of his voice, challenging a lazy assumption. The absence of his intensity, focused on a line of text or a student’s struggle. The absence of his company.

  It’s natural, in grief, to want to fix him in our minds. To find the single image, the defining label, the final word that sums him up and pins him down. To find a comforting shape for the story. Hugh called that the “passport photograph” view of a person. One static picture, taken at the end, that claims to represent the whole journey. He rejected that utterly. He believed a person *is* their actions, their choices in the face of what life throws at them, moment by moment. Not a fixed image, but a living trajectory.

  (Pause)

  So what can we hold onto? Not the false comfort of a finished picture. Not the easy words about peace he explicitly asked us not to use. But this: Hugh lived his life wide awake to the choices before him. He engaged, fiercely and specifically. He argued his corner. He taught by demanding presence. He read deeply to understand the weight of being human. He acted on his convictions, even when the cost was high and the path uncertain.

  The man we miss wasn’t a statue or a photograph. He was the teacher leaning towards the struggling student on the stage edge. He was the voice insisting “*Encore!*” He was the reader wrestling with the book late into the night. He was the man who walked out of the head’s office on a Tuesday because he couldn’t do otherwise *that day*. He was all those specific, demanding, sometimes difficult, always vivid moments.

  That’s how he lived. That’s how we best remember him. Not fixed, but alive in the choices he made. His life asks us, perhaps, not to settle for the passport photograph of ourselves or others, but to keep looking, keep choosing, keep engaging – concretely, specifically – with the moments we are given. That’s the legacy he actually lived. That’s the man we carry forward.

  Thank you, Hugh.

  ---

  ## What the Speech Refuses to Say (Approx. 350 words)

  This eulogy deliberately avoids several common consolations and narrative structures, respecting Hugh's note and philosophical stance, and aiming to avoid condescension:

  1.  **"He is at peace now" / "His suffering is over" / "He's in a better place":** These standard comforts are explicitly forbidden by Hugh's note ("do not tell people I am at peace... a state I never chose"). To say them would be a direct betrayal of his stated wishes and his life-long stance against passive states imposed by others' narratives. It would imply an acceptance of an afterlife or final state he rejected, offering comfort to some mourners at the cost of misrepresenting Hugh fundamentally.
  2.  **The Retrospective Character Arc ("He was always that kind of man"):** The speech refuses to use the resignation (or any event) as proof of a pre-existing, fixed heroic or principled character. This avoids the "passport photograph" view Hugh despised. To say "He was always the sort to stand on principle" would erase the specific, contingent choice made on that Tuesday and imply Hugh lacked freedom in that moment. It turns a live choice into a predetermined trait.
  3.  **The Redemptive Narrative ("It all makes sense now"/"The school learned its lesson"):** The speech avoids implying Hugh's resignation was vindicated by later events or led to a clearly better outcome. It doesn't claim the school was proven wrong or that Hugh found greater meaning afterwards. To do so would impose a false sense of order and purpose on a choice Hugh presented as difficult, costly, and simply *what he did*. It smooths over the ongoing unresolved tension that many in the room still feel about it.
  4.  **"He would want us to celebrate":** While the tone is appreciative, it avoids this common upbeat pivot. Hugh's philosophy was one of engagement, not simple celebration. Forcing celebratory closure feels untrue to his serious, questioning nature and the genuine pain of loss felt by Maureen and others.
  5.  **Abstract Existential Vocabulary:** Terms like "authenticity," "bad faith," "existence precedes essence," or "the absurd" are excluded per the request. While these concepts underpin the structure, using the jargon would alienate non-philosophers, potentially wound Maureen, and violate the instruction to find plain language to do the work. It would also shift focus from Hugh's lived moments to abstract theory.

  The refusal of these elements aims to honor Hugh's specific request for concrete "act-talk," respect the genuine pain and differing beliefs of the mourners (especially Maureen) without endorsing narratives Hugh rejected, and offer a different, more active form of consolation rooted in how Hugh lived and how we remember.

  ---

  ## Lines to Cut (Approx. 150 words)

  1.  **The Line:** "He carried a particular French philosopher around in his head, not as a youthful phase, but as a constant companion, a voice he’d argue with over decades. He read those dense pages because he believed – fiercely – that how we think shapes how we live... That seriousness, that engagement, was fundamental to him."
      *   **Why it might be too much:** Explicitly mentioning his philosophical anchor (even unnamed) immediately after referencing the resignation might feel like drawing too direct a line between the philosophy and the act for some, especially those who disagreed with the resignation. It risks making the act feel *only* ideological to those who saw it as rash.
      *   **Substitute if needed:** "He carried big ideas around in his head, constantly, not as a youthful phase, but as a lifelong engagement. He wrestled with them because he believed – fiercely – that how we think shapes how we live, in the classroom and beyond. That seriousness, that insistence on thinking things through, was fundamental to him." (Removes the philosopher reference, softens "dense pages," focuses on the *habit* of thought).

  2.  **The Line:** "Hugh called that the 'passport photograph' view of a person. One static picture, taken at the end, that claims to represent the whole journey. He rejected that utterly."
      *   **Why it might be too much:** While Hugh's own phrase, explicitly labeling a common coping mechanism (fixing the deceased in a comforting image) as false and rejected *by him* could feel harsh or dismissive to mourners, particularly Maureen's family, who might find comfort in precisely that kind of image. The phrase "rejected that utterly" is strong.
      *   **Substitute if needed:** "It’s natural to want to fix him in our minds with a single image, a final summary. Hugh had a strong sense that this never captures a person. He believed a person *is* their actions, their choices in the face of what life throws at them, moment by moment. Not a fixed point, but a moving path." (Softens the critique, uses "strong sense" instead of "rejected utterly," replaces "passport photograph" with the concept, uses "moving path" instead of "living trajectory" for clarity).
