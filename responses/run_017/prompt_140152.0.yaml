prompt: |-
  I'm a retired physicist — 30-odd years in atmospheric/statistical mech — and in the last couple of years I've drifted into philosophy through decision theory, mostly the Kelly criterion and this whole "geometric rationality" framing. I've got maybe 15 hours a week, a decent toolkit (stochastic processes, stat mech, a little info theory), and I'd rather chew on one real question for two years than keep reading around the subject.

  Two things nag at me and I genuinely can't tell whether they're deep or whether I'm confused. First: the thing you maximize is the log of some wealth process — but which one? Once you throw in salary, spending, a mortgage, or just decide to count only the "money at risk," the growth-optimal strategy moves. That smells like a gauge or frame choice the theory never fixes. Second: everyone justifies Kelly by the long run, almost-sure dominance of the growth rate, and to me that sounds exactly like an ergodic hypothesis. Real markets and careers aren't stationary, so maybe the asymptotics aren't carrying the weight people assume, and what you actually want is something about finite horizons and ruin.

  Which open questions here would you tell someone in my position to spend the time on, in what order, and why? I want the dependency picture — what's upstream of what, what's tractable for one outsider with my background versus what needs a group — and which of the currently fashionable questions are overrated or don't really follow. Also be blunt about (1) and (2): real open problems, already settled, or muddles on my part? And say what would change your ranking.
