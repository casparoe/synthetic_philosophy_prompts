prompt: |-
  I wonder whether there is a name for a pattern I have started noticing at work, and — if there is not — whether you could help me pin it down precisely enough that I could use the word in a committee paper without being laughed at.

  Some context. After a reorganisation last spring I was asked to chair the underwriting committee of a medium-sized mutual insurer. I am an accountant by training rather than a statistician, so I spend a good deal of my week in meetings where intelligent people argue about how much to charge for risks whose likelihood nobody in the room can put a number on. Over the past year one particular shape of argument has recurred often enough that I want a handle on it, and nothing I have found on my own quite fits. I should mention that I have no access to a university library from here, so I would be grateful for an answer built out of the distinctions themselves rather than a list of things to go and read.

  Four instances, real but tidied.

  First. One of our senior underwriters habitually prices an unclear risk at the pessimistic end of whatever range we can agree on. But he only does this when the same agenda also contains a risk of the same general kind whose rate we do know well. Take the unclear item off the agenda and bring it back a fortnight later on its own, and he will price it at the middle of the range without any apparent discomfort. The risk has not changed between the two meetings; the company has not learned anything; only the presence of the other item has changed.

  Second, closely related. If I hand him a number — any number, including one I have visibly invented on the spot — the padding disappears and he prices at the number. He does not pad *known* rates, only missing ones. So whatever this is, it is not a general taste for caution about how much we might lose.

  Third. When the unclear quantity happens to fall in the area where he is our designated in-house expert, the caution reverses: he will take the unclear risk in preference to a clear risk of the same mid-range value. My colleagues and I checked his track record out of curiosity, and his judgements in his own area are no better calibrated than his judgements elsewhere. So the reversal is not tracking his actual reliability.

  Fourth, and this is the part I cannot find discussed anywhere: the reversal has nothing to do with his own expertise either. It depends on who else is at the table. Put an outside consultant in the room and he retreats to the pessimistic end even in his own field — and he does this even when the consultant's information has nothing whatever to do with the question being decided, and even when there is no opportunity for him to consult them. Remove the consultant and he is comfortable again. It is as though what he is avoiding is not the missing number but the visibility of the missing number.

  My questions. Does the first pair of observations have an established name? I have a vague memory of a well-known puzzle about drawing coloured balls from an urn whose composition is unknown, which seems to be in this neighbourhood, but as I understand it that puzzle concerns how people rank the two options, not the ranking changing depending on what else happens to be on the table at the time. Does the third observation have a name of its own, or is it the same phenomenon in another guise? Is the fourth the same family at all, or is it ordinary social embarrassment wearing the costume of a judgement about uncertainty — and if the two readings cannot be separated by armchair argument, what observation would separate them? I have been using the private label "expert exemption" for the third, which I assume is already taken; and if no single concept covers all four, I would much rather have a short taxonomy with its boundary cases marked than one borrowed label stretched over everything.

  Please answer in British English.
reasoning: |-
  Hmm, the user is describing a fascinating pattern of decision-making behaviour observed in their underwriting committee. They've identified four distinct but related phenomena regarding how a senior underwriter adjusts risk pricing based on contextual factors rather than the risk itself. 

  The core paradox seems to be that the underwriter's pricing fluctuates based on: 
  1) Presence of comparable risks (padding unclear risks only when similar known risks are present)
  2) Arbitrary anchoring (accepting any number provided)
  3) Expertise domain (reversing caution in own specialty despite no better performance)
  4) Audience composition (retreating to caution with external observers regardless of relevance)

  I recall this maps onto several behavioural economics concepts. The first two points strongly suggest reference dependence - specifically loss aversion manifesting as uncertainty aversion when comparators exist. The Ellsberg paradox comes to mind for the urn analogy they mentioned, but that concerns ambiguity aversion rather than contextual shifts. 

  The third observation is particularly interesting. The "expert exemption" label they coined is apt but indeed overlaps with existing constructs. The Dunning-Kruger effect describes overconfidence in one's expertise, but here the underwriter isn't actually overperforming in their specialty. This seems closer to "competence signaling" - the reversal serving social rather than epistemic purposes.

  The fourth point confirms the social signalling hypothesis. The consultant's presence triggers performance anxiety regardless of relevance, suggesting the behaviour is about managing perceptions of competence when uncertainty is visible. This connects to impression management theory.

  For academic robustness, I should distinguish:
  - The risk assessment mechanism (ambiguity aversion)
  - The social signalling layer (impression management)
  - The expertise-as-license element (competence signalling)

  The term "contextual risk posturing" might capture the whole phenomenon, while "ambiguity camouflage" describes the first two behaviours specifically. The expert reversal could be termed "domain-conditional risk appetite". 

  To test the social embarrassment hypothesis versus genuine uncertainty assessment, I'd suggest an experiment: compare pricing when the consultant is physically present versus when their written comments are provided anonymously. If the effect persists only with physical presence, it's likely social performance anxiety.
answer: |-
  Right, this is a fascinating pattern you've observed – and rather elegantly dissected. It touches on several well-studied cognitive and social biases, but the *specific combination and context-dependence* you describe doesn't have a single, universally accepted name. However, we can build a precise and usable taxonomy from established concepts, all grounded in British English psychological/behavioural economics terminology.

  Here's a breakdown, using your observations:

  1.  **The Core Phenomenon (First & Second Observations): Strategic Ambiguity Padding / Context-Dependent Uncertainty Premium**
      *   **Description:** Adding a deliberate margin (pessimism) to an uncertain estimate *only* when a comparable, known-risk benchmark is simultaneously present. The padding vanishes if the uncertain risk is considered in isolation *or* if *any* anchor (even an arbitrary one) is provided.
      *   **Key Biases:**
          *   **Ambiguity Aversion:** A well-established preference for known risks over unknown risks of equivalent estimated value (related to the Ellsberg Paradox you recalled, though Ellsberg focuses on choice *between* known and unknown urns, not *pricing adjustment* based on presence).
          *   **Anchoring:** The powerful effect of *any* initial number (your "handed" number) on subsequent judgements.
          *   **Reference Dependence (Specifically Loss Aversion in Context):** The presence of the known risk creates a salient reference point. Pricing the unknown risk optimistically *relative* to this known risk feels like a potential "loss" (underpricing) if the unknown risk turns out worse. Padding it pessimistically feels like avoiding that loss, even if the absolute mid-point is logically the same as when isolated. The anchor you provide *replaces* the known risk as the reference point.
      *   **Proposed Term for Committee Paper:** **"Context-Dependent Uncertainty Premium"** (CDUP). This is precise: it's a premium added due to uncertainty, but *only* triggered by the specific context of a comparable known risk being present. "Strategic Ambiguity Padding" also works but sounds slightly more judgemental. CDUP is more neutral and technical.

  2.  **The Expertise Reversal (Third Observation): Domain-Specific Competence Signalling / Illusory Calibration**
      *   **Description:** Reversing caution (preferring the unclear risk) *only* within one's designated area of expertise, despite no objective improvement in judgement accuracy.
      *   **Key Biases/Concepts:**
          *   **Overconfidence (Domain-Specific):** A common tendency to overestimate one's own skill or knowledge within an area one identifies as an expert.
          *   **Competence Signalling:** A social/motivational drive to demonstrate expertise and value, particularly in one's designated role. Choosing the unclear risk might be seen (consciously or subconsciously) as demonstrating confidence and mastery.
          *   **Illusory Correlation:** The belief that because one *is* the expert, one *must* be better at judging these specific uncertain risks, despite evidence to the contrary.
      *   **Distinction from CDUP:** This isn't simply the *absence* of padding; it's an active *preference* for the unknown *within the domain*. Motivation shifts from loss avoidance to competence demonstration.
      *   **Proposed Term for Committee Paper:** **"Domain-Specific Risk-Preference Reversal"** (DS-RPR) or **"Expertise-Based Confidence Inflation"** (EBCI). DS-RPR is more descriptive of the behaviour, EBCI hints at the underlying mechanism. "Expert Exemption" is intuitive but too vague; these are more precise.

  3.  **The Audience Effect (Fourth Observation): Evaluative Scrutiny Avoidance**
      *   **Description:** Reversion to pessimism (CDUP behaviour) even within one's expertise domain when an external observer (consultant) is present, regardless of the observer's relevance or opportunity to interact.
      *   **Key Biases/Concepts:**
          *   **Social Facilitation/Inhibition:** The presence of others can enhance or impair performance. Here, it inhibits the expression of expertise-based confidence.
          *   **Impression Management:** The strong desire to control how one is perceived by others. The external consultant represents heightened scrutiny. Making an uncertain call feels riskier to one's professional image in front of an evaluative audience.
          *   **Accountability Pressure:** The (perceived) need to justify one's decision to an external party increases aversion to potentially being *seen* to be wrong.
      *   **Distinguishing from Social Embarrassment:** While related, it's more specific. It's not *general* embarrassment; it's the *fear of being evaluated negatively due to visible uncertainty*. The key trigger is the *visibility of the estimation process under scrutiny*, not the uncertainty itself. The irrelevance of the consultant's expertise proves it's about the *act of judgement being witnessed*, not the content.
      *   **Proposed Term for Committee Paper:** **"Evaluative Scrutiny Avoidance"** (ESA). This directly captures the motivation: avoiding the negative evaluation that might come from being seen to make a judgement call under conditions of visible uncertainty in front of an external audience.

  **The Taxonomy & Overall Label:**

  You are observing **context-dependent shifts in risk pricing behaviour driven by cognitive biases and social motivations**, specifically:

  1.  **Context-Dependent Uncertainty Premium (CDUP):** Pessimistic padding of ambiguous risks *only* when a comparable known risk is present (or no anchor exists).
  2.  **Domain-Specific Risk-Preference Reversal (DS-RPR):** Reversal to *preferring* ambiguous risks *only* within one's designated area of expertise (despite no accuracy gain).
  3.  **Evaluative Scrutiny Avoidance (ESA):** Suppression of DS-RPR (reversion to CDUP behaviour) *only* when an external evaluator is present, driven by impression management concerns.

  **Is there an overarching name?** You could call it **"The Contextual Risk-Posturing Effect"** or **"Situational Uncertainty Response Shifting" (SURS)**. These emphasise the core insight: the pricing behaviour isn't stable; it shifts dramatically based on the *situation* (comparators, anchors, domain, audience).

  **Addressing Your Specific Questions:**

  *   **First Pair (CDUP):** No single perfect name, but "Ambiguity Aversion" is the core bias, made context-specific by "Reference Dependence" and "Anchoring". **"Context-Dependent Uncertainty Premium" (CDUP)** is a suitable descriptive label for the phenomenon *as you observe it*.
  *   **Third Observation (DS-RPR):** Not just CDUP absence. It's a distinct reversal driven by **Overconfidence** and **Competence Signalling**. **"Domain-Specific Risk-Preference Reversal" (DS-RPR)** captures it.
  *   **Fourth Observation (ESA):** This is strongly linked to the third. It shows DS-RPR is fragile and easily overridden by **Impression Management** and **Accountability Pressure** when scrutiny is high. It's not *just* social embarrassment; it's specifically about **avoiding negative evaluation when uncertainty is visible to outsiders**. The observation that *removing the consultant restores comfort* confirms it's the *evaluative presence*, not a change in the risk or expertise feeling.
  *   **Separating ESA from Simple Uncertainty:** The crucial observation you've *already made* separates them: The underwriter *is* comfortable with the ambiguity in their domain *without* the consultant. The consultant's presence doesn't change the *objective* uncertainty, only the *social* context of being observed/judged while dealing with it. The behaviour change is driven purely by the *audience*, not the *information*.

  **Using This in Committee:**

  > "Analysis of pricing decisions over the past year suggests behaviour is influenced by **context-dependent cognitive and social factors**. We observe a **Context-Dependent Uncertainty Premium (CDUP)**, where ambiguous risks attract pessimistic pricing primarily when comparable known risks are simultaneously assessed. Conversely, a **Domain-Specific Risk-Preference Reversal (DS-RPR)** occurs within areas of designated expertise, leading to a relative preference for ambiguous risks. However, this reversal is suppressed by **Evaluative Scrutiny Avoidance (ESA)** when external observers are present. Recognising these patterns allows us to structure agenda-setting and participation to mitigate potential unintended biases in pricing."

  This language is precise, descriptive, avoids overly colloquial labels, and roots the observations in recognisable psychological concepts without requiring external reading. It should pass the "committee paper without being laughed at" test. Well done on spotting such a nuanced pattern!
