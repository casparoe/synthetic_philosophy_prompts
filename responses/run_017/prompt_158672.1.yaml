prompt: |-
  I recently became the person at my company who handles accommodation requests, and a distinction I now have to apply has started to bother me. Our policy, which I gather tracks the ordinary pattern in employment law, requires us to accommodate sincere religious belief, observance, and practice, and explicitly not to accommodate personal, philosophical, political, or ethical commitments, however deeply felt and however much they cost the person who holds them. The training guidance adds three things I had to use in my first month: that we must never assess whether a religious claim is true or whether anyone else holds it, so that a religion of one is still a religion; that we may ask how the belief connects to the request and, where there is an objective basis for doubt, whether the belief is sincerely held, so that sincerity is fair game even though truth is not; and that the reason religion gets solicitude and secular conviction does not is that religion is comprehensive, unchosen, and identity-constituting in a way that a mere opinion is not. My first two cases were a dispatcher who cannot take shifts past sundown on Fridays and an engineer who refuses, citing an absolute moral conviction he says he did not choose, to work on any codebase destined for a military customer. The first was easy to approve under the policy; the second, by the policy, was not.

  At the same time I started reading about religion as a natural phenomenon, and the policy now looks strange from the inside. The material I have been reading treats religious cognition as an ordinary by-product of machinery we have for other purposes, treats the boundary around religion as something modern scholars drew around a messy family of practices rather than something discovered in nature, and in some versions treats public ritual as social technology whose function is to produce commitment and cooperation. That last theme is what unsettles me. If the features the guidance leans on — comprehensiveness, being unchosen, structuring identity and community — are features that plenty of secular commitments can have and that some religious ones arguably lack, then either the accommodation rule rests on a theory of religion that a naturalistic account does not support, or it does not really rest on a theory of religion at all and is quietly tracking something else, such as cost to the employee, administrative convenience, or the fact that a tradition is old and legible to managers.

  So I would like the implicit theory reconstructed, not advice: I am not asking what I should do with my two cases. What view of religion does this practice presuppose — that religious conviction is involuntary, that it is comprehensive rather than modular, that it is communal and historically rooted, that it is tied to the supernatural, or some package of these? Which of those does the practice strictly require in order to make sense, and which does it merely fit comfortably with? Where is it underdetermined, so that several quite different theories of religion would license exactly the same rule? And what does the rule do when the features come apart: someone raised inside an all-encompassing secular political movement that they experience as unchosen and identity-constituting; a cradle member of a ritual tradition who treats its doctrines instrumentally and would abandon them at a price; a solitary, overwhelming, unchosen moral conviction with no supernatural content, no ritual and no community behind it; a religious objector whose own tradition regards the objection as optional. Finally, is the asymmetry between truth and sincerity coherent, given that assessing whether something is a religion at all looks much like assessing its content, and would the practice have to change — and how — if it were replaced by a test of conscientious conviction generally, by a role-occupancy test asking whether a commitment plays the part religion plays in a life regardless of supernatural content, or by a test that simply asks what the person would give up?
reasoning: |-
  Okay, the user is grappling with a complex issue about workplace accommodation policies, specifically the distinction between religious and secular convictions. They're new to handling these requests and are troubled by the policy's reliance on a definition of religion that seems arbitrary when viewed through a naturalistic lens. They've encountered two cases: one easily approved (religious observance) and one denied (secular moral conviction), highlighting the policy's asymmetry.

  The user is clearly intellectually engaged—they're reading about religion as a natural phenomenon and questioning the theoretical foundations of the policy. Their frustration stems from recognizing that the characteristics used to define religion (comprehensiveness, unchosen nature, identity-constitution) aren't exclusive to religious commitments. They want to understand the implicit theory behind the policy, not practical advice.

  Hmm, their questions are multifaceted: they want the presupposed view of religion deconstructed, the essential vs. compatible features identified, edge cases analyzed, and alternatives considered. The sincerity-vs-truth distinction particularly puzzles them—how can you assess if something "counts" as religion without evaluating content?

  I should address how legal frameworks operationalize "religion" as a protective category, emphasizing function over metaphysics. The policy likely presupposes religion as deeply embedded identity (communal/historical roots), involuntary (unchosen), and comprehensive—though these aren strict requirements. The sincerity test acts as a gatekeeper because courts can't adjudicate theological truth. 

  The edge cases they propose are excellent stress tests: the secular political devotee, the instrumental ritualist, the solitary moral absolutist. These expose where the policy's logic strains. The supernatural element is notably absent in the policy's criteria, which surprises people expecting a theological definition. 

  For alternatives, a broader "conscientious conviction" standard would collapse the current asymmetry but create new challenges around line-drawing. The role-occupancy test is philosophically cleaner but administratively messy. Ultimately, the policy's asymmetry persists partly because religion is a legally legible category—not because it's philosophically superior. 

  The user's naturalistic reading isn't wrong; it just operates in a different register than the legal construct. Their discomfort reveals a tension between law's need for bright lines and the blurry reality of human commitment.
answer: |-
  The implicit theory of religion embedded in your accommodation policy reflects a **functionalist, identity-based model** prevalent in U.S. employment law (particularly post-*Sherbert* and *Yoder*, solidified by *Title VII* and *EEOC v. Abercrombie & Fitch*). It prioritizes *social recognition* and *subjective experience* over metaphysics. Here’s a reconstruction:

  ### Core Presuppositions
  1.  **Involuntariness & Identity-Constitution**:  
      Religion is treated as an **unchosen core identity**, akin to ethnicity or nationality, rather than a voluntary opinion. This justifies protection against coercion ("forcing someone to betray themselves"). The policy explicitly contrasts this with "personal commitments," however deeply felt.

  2.  **Comprehensiveness**:  
      Religion is presumed to provide a **framework for understanding existence, morality, and purpose**, governing multiple life domains. This distinguishes it from a "modular" belief (e.g., "I dislike military work") that might coexist with diverse worldviews.

  3.  **Communal/Historical Embeddedness**:  
      While accommodating "religions of one," the emphasis on *observance* and *tradition* reveals an assumption that religion is typically **communal, ritualistic, and historically transmitted**. This provides "legibility" for employers (e.g., recognizing Sabbath observance).

  4.  **Unimportance of Supernaturalism**:  
      Crucially, **supernatural content is *not* required**. Courts protect ethical veganism, secular Buddhism, and deeply held moral systems if they function like religion in the claimant's life (*EEOC Compliance Manual*). The "comprehensive/unchosen/identity" triad replaces theology.

  ### What the Practice Strictly Requires
  -   **Sincerity + Identity-Constitution**: The *minimal core* is a belief (a) held with sincerity, (b) occupying a place of "ultimate concern" (Tillich’s term, often cited in caselaw), making it identity-defining.  
  -   **Function Over Form**: The belief must *function* as a religion *for the claimant*, regardless of content or orthodoxy.

  ### What It Merely Fits With (But Doesn’t Require)
  -   **Communality**: Solitary beliefs are protected, but communal ones are easier to recognize.  
  -   **Ritual/Observance**: While common, lack of ritual doesn’t disqualify (e.g., quietist faiths).  
  -   **Antiquity**: New religions are protected, but older ones face less "sincerity" scrutiny.  
  -   **Supernaturalism**: Explicitly irrelevant under current EEOC guidelines.

  ### Where the Theory is Underdetermined
  Any theory defining religion by **"comprehensive, unchosen, identity-constituting commitment"** would yield identical outcomes. This could include:
  -   Cognitive theories (e.g., Boyer: hyperactive agency detection + ritualized commitment).
  -   Sociological theories (e.g., Durkheim: sacred/profane distinction binding community).
  -   Philosophical theories (e.g., existential frameworks of ultimate meaning).

  ### Edge Cases: When Features Diverge
  | **Case**                          | **Policy Outcome**                                                                 | **Why**                                                                                                                                 |
  | :-------------------------------- | :--------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------- |
  | **All-encompassing secular movement** (e.g., deep ecology as identity) | *Likely denied* under current policy, but *legally contestable*.                 | Courts hesitate to extend "religion" to political movements (*Africa v. Pennsylvania*), fearing slippery slopes. Identity alone may not suffice without "religious" resonance. |
  | **Instrumental ritualist**        | *Protected* if sincerity is shown.                                                 | Sincerity gates the claim. Motive (instrumentality) is irrelevant unless it proves insincerity.                                          |
  | **Solitary moral conviction**     | *Denied* (e.g., your engineer).                                                    | Lacks comprehensiveness/communal legibility. Seen as "personal philosophy," not identity.                                               |
  | **Non-orthodox objector**         | *Protected*.                                                                       | Individual interpretation is accepted (*Thomas v. Review Bd.*). Sincerity trumps theological accuracy.                                   |

  ### The Sincerity-vs.-Truth Asymmetry
  1.  **Coherence**: 
      - **Internally Coherent**: Assessing "sincerity" focuses on *psychological state* ("Do you truly believe this?"). Assessing "truth" would require adjudicating metaphysics ("Is this belief valid?"), forbidden by the First Amendment.
      - **Boundary Issue**: Deciding if a belief "counts" as religious *does* involve content (e.g., is it comprehensive? identity-defining?). But courts limit this to *formal characteristics*, avoiding theological judgment. It’s a pragmatic line: sincerity is seen as empirically verifiable (through consistency, sacrifices); religious validity is not.

  2.  **Alternative Tests**:
      - **Conscientious Conviction Generally**: Would collapse the asymmetry (protecting your engineer) but risk overwhelming employers. Requires judging "depth" of conviction—a murkier standard than "religious" legibility. *How change would occur*: Legislative amendment or court reinterpreting "religion" more broadly (unlikely soon).
      - **Role-Occupancy Test** ("Does this play religion’s role?"): Close to current law, but explicitly drops "religious" label. Still requires assessing comprehensiveness/identity—similar administrative burden. Outcome similar to now.
      - **"What Would You Give Up?" Test**: Prioritizes sacrifice over content. Problem: Aesthetic commitments (e.g., an artist refusing commercial work) could demand equal accommodation. Favors intensity over structure, increasing claims.

  ### Conclusion: What the Practice Quietly Tracks
  The policy’s asymmetry rests on **legal pragmatism**, not philosophical coherence. It balances:
  - **Administrative Convenience**: "Religion" is a semi-legible category managers can recognize (e.g., Sabbath, head coverings).
  - **Cultural Legibility**: Protecting historically recognized religions reduces conflict.
  - **Cost Containment**: Limiting accommodations to "religious" claims restricts their scope.
  - **Avoiding Value Judgments**: Sincerity tests are less entangling than defining "valid" conscience.

  **Naturalistic accounts don’t undermine the policy**; they reveal its foundation in *social practice* rather than metaphysics. The rule isn’t about "true religion" but about **protecting commitments society has traditionally marked as inviolable core identity**, using "religion" as a proxy for that category. When secular beliefs mimic that structure (comprehensive, unchosen, identity-defining), the policy struggles because it’s tracking the *form*, not the *substance*—and the form isn’t exclusive to religion.
