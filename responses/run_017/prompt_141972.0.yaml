  **Title**: The Broken Connection

  **Logline**: A clinician who helped draft a law to exclude non-somatic conditions from medical confinement faces a case that forces her to confront an unforeseen loophole.

  **Characters**:
  - Dr. Lena Voss: clinician, panel member, drafter of clause (b) — she is the proponent of the skeptical view.
  - Daniel Reed: the patient — his condition challenges the skeptical view by presenting a case that is observable without relying on his account of reasons.
  - Mr. Aris Thorne: lay member of the board, retired transit worker — he is the neutral questioner who inadvertently reveals the flaw in the clause.

  **Statutory Line**: Clause (b) was supposed to exclude conditions that rely on the patient's own account of their reasons for action, thus keeping problems of will, character, and choice out of the medical domain.

  **Why the Case Strains It**: Daniel can state his reasons clearly, but his failure to act on them is observable without reference to his account, satisfying clause (b) and thus allowing confinement under a law designed to prevent such interventions for non-somatic conditions.

  **Clinician Before**: At the opening, Dr. Voss believes the law is a clear and effective tool to separate medical conditions (somatic) from problems of living (non-somatic), protecting individual responsibility.

  **Clinician After**: On the final page, she understands that the law can include conditions where the failure is in the connection between reason and action, which is observable, thus blurring the line she thought was clear.

  **Kind of Change**: Revised (the view is adjusted to account for a new distinction)

  **Best Line for the Skeptic**: "The law is clear: we cannot use a man's account of his own reasons to turn his choices into symptoms."

  **Best Line for the Patient**: "I see the reasons, Doctor, but they don't move me. I don't know why, but I'm not asking to be excused."

  **Lay Question**: "But if he can see the reasons and they don't move him, doesn't that mean something is broken in the part that connects seeing to doing? And can't that be observed without his account?"

  **Unresolved**: Whether the break between reason and action is truly somatic or if it remains a problem of the will that should be outside medicine.

  **Word Count**: We'll aim for about 1,400 words.

