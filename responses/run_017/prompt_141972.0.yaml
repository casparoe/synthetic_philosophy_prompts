answer: |-
  ### The Broken Connection

  The hearing room felt sterile under fluorescent lights. Dr. Lena Voss adjusted her glasses, rereading the petition: *In the Matter of Daniel Reed*. Thirty-four years old. Failing to eat, hydrate, or manage basic hygiene for eleven days. Not violent, not suicidal, not delirious. Under the old law, "grave disability" would have justified fourteen days of feeding and observation. But the Somatic Criterion Act—*her* Act—demanded more. Clause (a): deviation from species-typical functioning. Uncontested; the man’s emaciation and neglect were visible. Clause (b): identifiable without relying on his account of his reasons. That was the line she’d drawn to keep medicine in the body, where it belonged.  

  Daniel Reed sat across the laminate table, posture slack but eyes alert. Beside Lena, Aris Thorne—retired subway maintenance supervisor, appointed as the public voice of common sense—fidgeted with a pen. Lena had advocated for lay members like Aris. They reminded professionals that the law served real people, not theories.  

  "Mr. Reed," Lena began, her tone measured. "The petition states you’ve refused food and neglected personal affairs. Can you explain why?"  

  Daniel’s voice was calm, unpracticed. "I know I should eat. Hunger hurts. I know bills are piling up, my landlord’s calling. I see the reasons."  

  "Do you believe they’re good reasons?"  

  "Of course. Starving damages organs. Eviction would be disastrous. I’d rank survival as my highest priority." He paused. "But seeing them doesn’t… connect. Like a wire snapped. I just watch the reasons, unmoved."  

  Lena leaned forward. Clause (b) hinged on this. If his inaction relied on his *account* of his reasons—if this was a crisis of will, character, or conviction—it failed the test. Medicine couldn’t touch it. "You’re not describing sadness? Or indifference?"  

  "No. I care what happens. I just don’t act. And I’m not asking for an excuse."  

  Aris scribbled a note. Lena pushed further. "If you saw a lesion on an X-ray, or a fever, would you accept treatment?"  

  "I might. But there isn’t one, is there?"  

  "Not that we’ve found." Lena’s team had scanned Daniel. Clean results. No tumors, no infections. Just a man who saw the cliff and refused to step back.  

  She pressed him on inconsistencies. Had he ever acted against his reasons? No. Had he lost his job? Not yet; he was on leave. Any history of trauma? None he’d name. His clarity was unnerving. He dissected his inertia like a biologist labeling specimens: *Homo sapiens, male, cognitively intact, motivationally inert*.  

  Aris cleared his throat. "Mr. Reed, you say you see the reasons but don’t act. Is that… like knowing a stove’s hot but touching it anyway?"  

  Daniel almost smiled. "Opposite. I know the stove’s cold and life-saving, but I can’t lift my hand."  

  Lena’s confidence solidified. This was precisely what clause (b) excluded: a man wrestling with *why* he couldn’t do what he knew he should. No competent observer could diagnose this without his testimony about his unmoved mind. The law was clear—  

  Then Aris tilted his head. "Doc, help me understand. If he *can* state a reason but *can’t* act on it, is that ‘unable’ in the way the law means?"  

  Lena froze.  

  Aris’s question hung in the air. Daniel’s emaciation wasn’t a metaphor. It was data. His unpaid rent notices weren’t philosophy; they were physical evidence. The "broken wire" he described wasn’t his *account* of his reasons—it was the *gap* between reason and action, observable in his trembling hands, his gaunt cheeks, the untouched water glass before him.  

  *Without relying on the person’s account of what they take themselves to have reason to do*.  

  Daniel hadn’t said, *I have no reason to eat*. He’d said, *I see the reasons, but they don’t move me*. The failure wasn’t in his reasoning; it was in the mechanism that converted reason into motion. And *that* malfunction—the stillness where action should have been—was as observable as a limp. Clause (b) was satisfied.  

  Lena’s pen trembled. She’d designed clause (b) to protect the will from being medicalized. Yet here it was, ushering in a man whose will had detached like a severed limb. The law hadn’t been outsmarted; it had *worked*. It had caught a rupture in the machinery of volition she’d assumed was inviolable.  

  She met Aris’s expectant gaze. "Yes," she said quietly. "It fits."  

  The vote was unanimous. Fourteen days of feeding and observation. Daniel showed no relief, no resentment. As they rose, Lena watched him stare at the exit, unmoving until the orderly touched his elbow.  

  Outside, rain streaked the courthouse windows. Lena recalled Daniel’s words: *I see the reasons, but they don’t move me*. Clause (b) had drawn a border around the body, but what if the body included the bridge between thought and deed? Her skepticism hadn’t collapsed; it had narrowed, sharpened. The line wasn’t between lesion and metaphor. It was between what a person could report and what the world could witness. And in that gap, the law had found a foothold.  

  She walked to her car, the old certainty revised. Some breaks didn’t need a name. They just were.

