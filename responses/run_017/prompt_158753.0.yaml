answer: |-
  ### Epistemological Dissociation Cases: Breaking the Bank-Pair Deadlock  

  **Core Commitments Recap**  
  (Orthodoxy; settled in the literature)  
  - *Attributor Contextualism (AC)*: Truth-value of "S knows that p" depends on how demanding the epistemic standards are in the *attributor's* conversational context (Lewis 1996, DeRose 2009).  
  - *Subject-Sensitive Pragmatic Encroachment (SSPE)*: Whether S knows that p depends partly on S’s *practical stakes* regarding p (Stanley 2005, Fantl & McGrath 2009).  
  - *Bank-style data*: When stakes are high *for the subject*, knowledge denials increase; AC and SSPE both predict this, as high stakes for S often correlate with demanding contexts for the attributor.  

  **The Challenge**  
  To dissociate the variables:  
  1. **Subject’s stakes** (high/low)  
  2. **Attributor’s context** (lax/demanding)  
  ...while holding **evidence** and **reliability** fixed.  

  ---

  #### **Case A: High Subject Stakes / Lax Attributor Context**  
  *Scenario*:  
  > Lena is a botanist conducting routine fieldwork. She identifies a rare mushroom (*Morchella esculenta*) using her standard protocol (cross-referencing field guides, spore prints, habitat checks). Her stakes are high: she must decide whether to serve it at a dinner tonight for her immunocompromised partner. If wrong, severe illness could result. Meanwhile, Alex, a colleague across the country, hears about Lena’s find during a casual coffee-break chat. He idly wonders aloud, "Does Lena *know* it’s edible?" Alex has no stake in this; he’s just curious about regional fungi.  

  **Theoretical Verdicts**:  
  - **SSPE**: Lena **does not know**. Her high practical stakes (partner’s health) raise the threshold for knowledge. Her evidence, though normally sufficient, is inadequate *given her situation*.  
  - **AC**: Lena **knows**. Alex’s context is lax (idle curiosity); "knows" requires only routine epistemic standards.  
  *Key structural feature*: The attributor (Alex) has *no practical involvement* in Lena’s high-stakes decision.  
  *Collapse test*: If Alex *were* deliberating about serving the mushrooms (e.g., he’s a guest), his context becomes demanding → AC denies knowledge, aligning with SSPE → standard bank pair.  

  ---

  #### **Case B: Low Subject Stakes / Demanding Attributor Context**  
  *Scenario*:  
  > Ben is a librarian. He glances at the library’s public events calendar and sees "Book Sale: Saturday 10–4." He notes this passively; his stakes are trivial (he has no plans to attend). Later, Emma, a fundraiser organizing a high-budget gala in the same building, asks Ben, "Do you *know* the sale ends at 4?" She must schedule expensive teardown crews precisely; a 1-hour error risks $20K in penalties. Ben’s evidence (seeing the calendar once) is unchanged.  

  **Theoretical Verdicts**:  
  - **SSPE**: Ben **knows**. His personal stakes are low; his evidence (routine calendar check) meets the relaxed epistemic threshold *for him*.  
  - **AC**: Ben **does not know**. Emma’s context is demanding (high cost of error); "knows" requires near-certainty (e.g., corroborating evidence Ben lacks).  
  *Key structural feature*: The attributor (Emma) faces high stakes *unrelated to the subject’s practical situation*.  
  *Collapse test*: If Ben *were* scheduling the teardown (high stakes for him), SSPE denies knowledge → both theories align → standard bank pair.  

  ---

  ### **Diagnosis: Why This Works**  
  - **Evidence/reliability fixed**: Both subjects use ordinary, reliable methods (botanist protocol; calendar check).  
  - **Stakes awareness**: Lena knows her partner’s health is at risk; Ben knows the sale is inconsequential to him.  
  - **Attributor standard ≠ evidence demand**: Emma’s context requires *stronger truth-tracking* (e.g., resistance to error under pressure), not *more evidence gathering* by Ben.  
  - **No cheating**: Neutral descriptions avoid loaded terms ("certain," "merely glanced"). Verdicts derive from theory application.  

  **Contested Premises** (Active debates in literature):  
  1. *SSPE’s legitimacy*: Critics (e.g., Brown 2013) deny stakes affect knowledge *constitutively*; they may only affect assertability.  
  2. *AC’s semantic vs. pragmatic status*: Some argue "knows" context-sensitivity is pragmatic (Bach 2005), not semantic.  
  3. *Rivalry?*: Hawthorne (2004) suggests AC and SSPE address different phenomena (language vs. mental states).  

  ---

  ### **Defensive Counterarguments and Rebuttals**  
  **Contextualist Attack on Case B**:  
  > *"Emma’s high stakes directly make her context demanding. AC correctly denies 'Ben knows' because truth-tracking must be robust in her context. SSPE errs by ignoring attributor standards."*  
  - **Rebuttal**: SSPE insists Ben’s knowledge is *stakes-relative*; Emma’s context doesn’t alter *his* epistemic position. AC conflates the state (knowing) with its attribution.  

  **SSPE Attack on Case A**:  
  > *"Lena’s high stakes make her evidence insufficient. AC’s verdict ('knows') is irresponsible—Alex *should* recognize her context!"*  
  - **Rebuttal**: AC is descriptive, not normative. If "knows" is context-sensitive, Alex’s lax context *makes* his attribution true, however imprudent.  

  **Unified Challenge**:  
  > *"Stakes only matter when salient in the attributor’s context. Case A’s 'idle curiosity' ignores Lena’s stakes, making the context defective."* (Fanti & McGrath 2009)  
  - **Rebuttal**: This assumes stakes *must* be contextually relevant—but ordinary conversations often disregard others’ stakes (e.g., Lena hasn’t shared her situation). AC can’t silently import subject-stakes into the attributor’s context without collapsing into SSPE.  

  **My Judgment**:  
  - The dissociation *succeeds* under standard AC/SSPE definitions.  
  - The unified challenge is unpersuasive: it equivocates "salience" (a psychological factor) with semantic context.  
  - **Caveat**: If "demanding context" *requires* high stakes for *someone*, AC and SSPE aren’t fully separable—but this redefines AC (DeRose explicitly rejects it).  

  ### **Conclusion**  
  These cases cleanly dissociate the variables. Both theories predict divergent verdicts, breaking the bank-pair symmetry. The structure holds if:  
  1. Attributors are *pragmatically insulated* from the subject’s stakes.  
  2. Demanding contexts arise from the attributor’s *own* practical needs, not the subject’s.  
  **Pedagogical value**: Highlights the theories’ fault lines—especially whether "knowledge" is a *stable state* (SSPE) or a *contextual assessment* (AC).  

  ---  
  **References** (for handout):  
  - DeRose, K. (2009). *The Case for Contextualism*.  
  - Stanley, J. (2005). *Knowledge and Practical Interests*.  
  - Lewis, D. (1996). "Elusive Knowledge."  
  - Fantl & McGrath (2009). *Knowledge in an Uncertain World*.  
  - Brown, J. (2013). "Experimental Philosophy, Contextualism and SSI."
