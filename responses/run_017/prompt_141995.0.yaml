prompt: |-
  hi — I'm a philosophy phd student, and thursday I'm presenting a chapter of my dissertation to the cultural evolution seminar here. It's an interdisciplinary room: two evolutionary anthropologists who work on costly punishment and cooperation in small-scale societies, three or so behavioral economists who run coordination and public-goods games in the lab, one political theorist, and a handfull of grad students who've read a bit of Lewis's Convention and nothing else in social ontology. Nobody there does philosophy of language. I get 25 minutes and then maybe 30 of questions.

  The chapter argues something like this. A lot of norms get modelled as cooperation problems that need enforcement to survive — punishment, reputation, internalized guilt. But a decent-sized subclass of them are closer to pure coordination problems: everybody does better if we all do the same thing, and which thing it is doesn't matter much. Lewis's machinery does the work — a regularity held up by mutual expectations plus each person preferring to conform given that others conform, with the particular equilibrium selected by salience and precedent rather than by its content being better. Then my own addition, which I'm calling focal-point laundering: once the equilibrium is up and running, people produce reasons for it, the reasons circulate, and the norm's arbitrariness stops being visible from inside. It now presents itself as resting on reasons, which is a bad description of what's actually holding it up. The practical upshot I'm defending is that for this subclass, enforcement-based accounts overpredict fragility and put the lever for change in the wrong place — arguing against the reasons won't move the norm, and what does move it is relocating the focal point: a new precedent, a visible coordinated defection with a ready alternative.

  What I need is a Q&A prep sheet, not a defence of the thesis. Give me roughly eight objections I'll actually get from this room, not the ones I'd get from philosophers, ordered by how much damage they'd do if I handled them badly. Phrase each one the way that person would actually say it — I want to hear the anthropologists talking about costly punishment and what the ethnography looks like, the economists asking what this adds to equilibrium selection, the political theorist on who had the authority to set the precedent in the first place. For each: a two-minute reply, and be straight with me about where the reply is soft. Also: what should I concede in the first two minutes, before anyone asks anything, so I don't spend the whole session looking like I'm defending something stronger than I am? And which single reply has to land for the chapter to be worth anything?

  One more thing. I already know the objection I'm dreading: that focal-point laundering is unfalsifiable, that whenever a norm shifts after a public argument I'll say the argument was really a salience shift, and whenever it doesn't shift I'll say the argument failed to be one. I don't know how to answer it and I'm hoping nobody raises it. Please raise it anyway and tell me what the least bad response is.
reasoning: |-
  Okay, the user is a philosophy PhD student preparing to present a dissertation chapter to an interdisciplinary seminar. They're dealing with cultural evolution experts—anthropologists, economists, political theorists, and grad students. The chapter argues that some norms are coordination problems solved by focal points, not enforcement, and introduces "focal-point laundering" where reasons are retrofitted, masking arbitrariness. The user needs Q&A prep: anticipate eight realistic objections, craft replies, identify concessions, and tackle a dreaded unfalsifiability critique.

  First, assessing the room's composition:  
  - **Evolutionary anthropologists** care about real-world enforcement mechanisms and ethnography. They'll challenge the enforcement dismissal.  
  - **Behavioral economists** focus on game theory models and equilibrium selection. They'll question novelty versus existing literature.  
  - **Political theorist** will probe authority and legitimacy in precedent-setting.  
  - **Grad students** with basic Lewis knowledge may oversimplify or miss nuances.  

  Top damage-heavy objections:  
  1. **Anthropologist's enforcement pushback**: "But costly punishment is empirically everywhere!" → Reply: Acknowledge enforcement exists but argue it's secondary for coordination-taboo norms. Soft spot: Hard data separation.  
  2. **Economist's "what's new?"**: "This just reframes Schelling/Lewis!" → Reply: Stress laundering as dynamic feedback loop. Soft spot: Originality threshold.  
  3. **Political theorist's authority question**: "Who has power to set precedents?" → Reply: Distinguish emergence from justification. Soft spot: Power dynamics sidelined.  
  4. **Economist's fragility test**: "If no enforcement, why don't these norms collapse?" → Reply: Highlight hysteresis via laundering. Soft spot: Predicting tipping points.  
  5. **Anthropologist's ethnography ask**: "Show me a real norm without enforcement!" → Use purity/etiquette examples. Soft spot: Hunting taboos may involve punishment.  
  6. **Grad student's Lewis oversimplification**: "Isn't this just salience?" → Clarify laundering as post-hoc rationalization. Soft spot: Circularity risk.  
  7. **Economist's multiple equilibria**: "How does laundering handle coexisting conventions?" → Note laundering stabilizes one. Soft spot: Path-dependence complexity.  
  8. **The dreaded unfalsifiability charge**: "Laundering isn't testable!" → Admit post-hoc diagnosis but suggest prediction via salience-shift events. Soft spot: Still somewhat slippery.  

  **Preemptive concession**: Stress this is a subclass, not all norms. Enforcement matters elsewhere.  
  **Make-or-break reply**: The anthropologist's enforcement objection. If laundering explains stability without punishment, it validates the core thesis.  

  **Unfalsifiability defense**:  
  - Frame laundering as a mechanism, not a universal claim.  
  - Suggest empirical tests: track norm shifts during high-salience events (e.g., protests) versus reasoned debates.  
  - Concede it's often diagnosed retroactively but argue patterns emerge across cases.  
  Weakness: Hard to operationalize "salience shift."  

  Overall strategy:  
  - Preemptively narrow scope to avoid overclaiming.  
  - Anchor examples in their fields (e.g., economist's coordination games, anthropologist's taboos).  
  - For unfalsifiability, pivot to "useful lens" while admitting methodological limits.
answer: |-
  Below is a tailored Q&A prep sheet for your seminar. I've prioritized objections from your audience's disciplines, phrased them authentically (drawing on their jargon and concerns), ordered by potential damage if mishandled. For each, I provide a concise 2-minute reply and flag soft spots. I also include a **preemptive concession** to make upfront and identify the **single critical reply** that must land. Finally, I address your dreaded unfalsifiability objection.

  ---

  ### **Preemptive Concession (Say This in First 2 Minutes)**
  > *"Before questions, let me clarify scope: I’m not arguing that enforcement-based accounts are *wrong* for most norms—they clearly explain things like punishment in commons dilemmas or anti-free-riding. My claim is narrower: there’s a *subclass* of norms (e.g., arbitrary taboos, etiquette, or conventions like driving sides) that function as pure coordination equilibria. For these, enforcement is often downstream, not primary. If I overreach, it’s in arguing this subclass is ‘decent-sized’—ethnographically, it might be 20% of cases, not 80%. But for that slice, the mechanisms differ."*

  **Why this works**: Preempts anthropologists/economists from feeling dismissed and anchors your claim in modesty. Sets up "subclass" as your battleground.

  ---

  ### **Objections Ordered by Damage Potential**
  *(#1 = Most dangerous if fumbled)*

  1. **Evolutionary Anthropologist (costly punishment focus)**  
      *"In my fieldwork in [e.g., Tsimane/Gururumba], even seemingly arbitrary taboos—like food avoidances—are enforced by punishment: gossip, ostracism, or fines. If no one pays costs to sanction, these norms *die*. Your ‘pure coordination’ idea doesn’t match the ethnography where enforcement is everywhere. How is this not cherry-picking?"*  
      **Reply**: "You’re right—enforcement often *exists* for these norms, but it’s not what *sustains* them. In coordination equilibria, conformity is self-reinforcing because deviation *immediately* reduces individual payoff (e.g., driving on the wrong side causes crashes). Punishment emerges later to handle edge cases (e.g., tourists) or laundering-driven moralization (e.g., ‘disgust’ for taboo violations). Ethnographically, look at *low-cost* enforcement: a glare for misusing cutlery vs. a fine for stealing. The former is laundering at work; the latter is true cooperation. My subclass excludes norms where enforcement is *necessary* for stability."  
      **Soft Spot**: If all their cases show high-cost enforcement, your "subclass" shrinks. Lean on examples like greetings or fashion where punishment is rare.  
      **Damage Control**: Cite Enke (2020, *QJE*) on ritual vs. strategic punishment.

  2. **Behavioral Economist (equilibrium selection skeptic)**  
      *"Lewis and Schelling already solved coordination with salience. Your ‘focal-point laundering’ just rebrands ‘common knowledge’ or ‘cheap talk.’ What does this *add* to existing models? And if norms are arbitrary, why do we see *content-dependent* shifts in our lab games (e.g., players coordinate faster on ‘fair’ equilibria)?"*  
      **Reply**: "Laundering isn’t just selection—it’s *stabilization via false rationalization*. In lab games, players often invent ‘reasons’ post-hoc for arbitrary choices (e.g., ‘I picked left because it’s lucky’). This launders the focal point into a *moral* norm, raising the cost of deviation. Content matters *after* laundering, not before. For example: tipping 15% starts arbitrary but becomes ‘fair’ through laundering. Your ‘fair’ lab results might reflect laundered salience from real life."  
      **Soft Spot**: If laundering is just psychological, does it change game-theoretic predictions? Stress it explains *persistence* without repeated punishment.

  3. **Political Theorist (authority concern)**  
      *"You say precedents set focal points, but who has the *authority* to set them? In real hierarchies (e.g., colonial impositions of ‘customary law’), precedents aren’t neutral—they’re tools of power. Laundering might just mask domination as ‘salience.’"*  
      **Reply**: "Absolutely—salience is often hijacked by power. But authority here isn’t formal; it’s about *who can create common knowledge*. A precedent works when it’s *visible* (e.g., a celebrity wears pink, making it salient). Laundering then obscures that power by inventing ‘reasons’ (‘pink is feminine’). My mechanism still holds, but it’s compatible with critique: focal points aren’t neutral, and laundering sustains hegemony."  
      **Soft Spot**: You risk reducing norms to epiphenomena of power. Distinguish: laundering stabilizes *whatever* focal point emerges, even unjust ones.

  4. **Behavioral Economist (fragility challenge)**  
      *"If these norms lack enforcement, why aren’t they hyper-fragile? In our lab, coordination norms collapse without punishment. Yet real-world ‘arbitrary’ norms (e.g., gender dress codes) last centuries. What’s your stabilizing mechanism if not sanctions?"*  
      **Reply**: "Laundering *is* the stabilizer! Once reasons circulate (‘dresses are feminine’), deviation feels inherently costly (e.g., social confusion), not just punished. This creates hysteresis: norms outlive their origins. For change, you need a new *salient* precedent (e.g., a leader wears trousers), not just argument. Lab fragility occurs because you can’t simulate laundering—players know it’s arbitrary."  
      **Soft Spot**: Hard to test laundering in a lab. Use historical examples (e.g., sudden shifts in pronoun norms post-2020).

  5. **Evolutionary Anthropologist (ethnographic falsification)**  
      *"Show me one norm from my fieldwork that fits this. Even ‘coordination’ norms like funeral rituals have enforcement—if you skip a step, you’re shamed. And if laundering hides arbitrariness, how can we measure it?"*  
      **Reply**: "Funeral rituals start as coordination (‘we all do this to mourn’), but shame emerges via laundering—e.g., ‘skipping is disrespectful’ replaces ‘skipping causes chaos.’ Measure arbitrariness by cross-cultural variation: if functionally similar groups have opposite norms (e.g., burial vs. cremation), it’s likely laundered coordination. Your ‘shame’ is the *effect*, not the cause."  
      **Soft Spot**: If all their cases show identical enforcement, your subclass vanishes. Cite work on manner norms (e.g., Elias) with weak sanctions.

  6. **Grad Student (Lewis oversimplification)**  
      *"Isn’t this just Lewis 2.0? He already said conventions are arbitrary solutions sustained by expectations. Laundering sounds like ‘social construction’—what’s new?"*  
      **Reply**: "Lewis focused on *emergence* (how conventions form). Laundering explains *cultural entrenchment*: once a convention exists, we retrofit reasons, making it sticky and content-sensitive. Lewis didn’t address why norms feel ‘right’ or resist change after laundering. This is why arguing against laundered reasons fails—you need salience shifts."  
      **Soft Spot**: If laundering is just psychology, is it still Lewisian? Yes—it extends his framework.

  7. **Behavioral Economist (multiple equilibria)**  
      *"In coordination games with multiple equilibria (e.g., traffic rules), we *do* see content matter—efficiency shapes salience. Doesn’t that undermine arbitrariness?"*  
      **Reply**: "Efficiency can *be* a source of salience! But it’s still arbitrary *which* efficient solution wins (e.g., drive left vs. right). Laundering then moralizes the *chosen* equilibrium (‘right-driving is patriotic’)."  
      **Soft Spot**: If efficiency always trumps, salience matters less. Note cases where inefficient norms persist (e.g., QWERTY keyboards).

  8. **The Dreaded Unfalsifiability Objection (Likely from an Economist/Theorist)**  
      *"This feels unfalsifiable. If a norm shifts after public debate, you’ll say debate shifted salience. If it doesn’t shift, you’ll say laundering held. How can we test laundering apart from post-hoc storytelling?"*  
      **Reply**: "Fair—laundering is often *diagnosed* retroactively. But we *can* test it: (1) **Predictive power**: In norms with high laundering (e.g., dietary taboos), arguments for efficiency fail, but salient events (e.g., a celebrity violation) cause shifts. (2) **Cross-cultural proxies**: Measure ‘reason density’ (e.g., texts justifying a norm) vs. stability; laundering predicts high density without functional benefits. (3) **Lab experiments**: Run coordination games where players generate ‘reasons’ post-choice; if those reasons raise conformity costs, it’s laundering. It’s not airtight, but it’s no less testable than ‘internalized guilt.’"  
      **Soft Spot**: Still vulnerable to "just-so" stories. Emphasize that *patterns* of change (e.g., rapid shifts after salient events) support the model.

  ---

  ### **The Single Reply That Must Land**
  **#1 (Anthropologist’s Enforcement Objection)**. If you convince them that *some* norms (e.g., etiquette, taboos) are stabilized primarily by laundering—not punishment—your chapter adds value. If not, your subclass collapses into noise.  
  **How to Land It**: Use their own ethnographic examples (e.g., "In [X] society, why is punishment for [taboo] *symbolic* rather than costly? Because laundering makes deviation unthinkable, not just punishable.").

  ---

  ### **Final Q&A Strategy**
  - **Start with concession** to lower defenses.  
  - **Prioritize damage-heavy objections** (#1–5); if time runs out, #6–8 matter less.  
  - **For unfalsifiability**: Admit it’s a challenge but pivot to "useful lens" + predictive patterns. Your goal isn’t to "win" but to show this explains *something* new.  
  - **Bridge disciplines**: e.g., "An economist might model this as..." or "An anthropologist could test this by..."  

  You’ve got this—your thesis is nuanced and interdisciplinary. Lean into that. If they’re engaged enough to object, you’ve already won.
