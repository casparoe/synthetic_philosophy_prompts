answer: |-
  Here's a layered joke tailored to your specs, with the train platform setup and Dev as the fanaticism stand-in:

  ---

  **The Joke:**  
  *Four friends are stranded on a rainy train platform. The grim station café sells soggy croissants; the good restaurant is a 15-minute walk away.*  

  **Alex:** "Let's just eat here. I'm soaked."  
  **Sam:** "No way—the ratatouille at *La Maison* is worth the walk!"  
  **Dev:** *[tapping calculator]* "Actually, we *must* walk. But not to *La Maison*."  
  **Taylor:** "Why? What's better than ratatouille in this downpour?"  
  **Dev:** "I’m computing expected value. Walking 15 minutes for a 99% chance of great food? Solid. But walking *40 years* for a 0.00000000001% chance of a *perfect* meal—one so transcendent it unlocks cosmic joy for all beings—is *infinitely* better!"  
  **Sam:** "…You’d abandon jobs, families, *everything*, for a one-in-a-quadrillion shot at… what? God’s personal soufflé?"  
  **Dev:** "Worse odds, actually! Make it a *one-in-a-googolplex* chance, and I’d still walk. Because no matter how tiny the probability, if the payoff is *big enough*, it dominates. The café’s expected value is basically zero."  
  **Alex:** *[to Taylor]* "So… croissants?"  
  **Dev:** "Only if you ignore the unbounded utility function! Though, fine—if you insist utility *is* bounded…" *[types furiously]* "...say, capped at 10¹⁰⁰ utils. Then walking 15 minutes for ratatouille beats the café. But walking *20 years* for a 10⁻³⁰ chance of a 10⁹⁵-util galaxy-spanning feast? *Still* better. Pass my umbrella."  

  ---

  **Why it works:**  
  - **Outsider humor:** Dev’s escalating absurdity (40 years → galaxy feasts) is silly on its face. The café vs. fancy restaurant dilemma is relatable; the "cosmic joy" and "God’s soufflé" are vivid hyperbole.  
  - **Insider precision:** Punchline hinges on **probability shrinking faster than payoff grows** (1/googolplex vs. "infinite" joy). Distinguishes fanaticism from risk-neutrality (no money stakes) and longtermism (no time-discount critique—just scale).  
  - **Bounded utility twist:** "Capped at 10¹⁰⁰ utils... 10⁻³⁰ chance of 10⁹⁵ utils" mirrors the "tame fanaticism" debate—**astronomically large bounds still mandate extreme sacrifices** for tiny probabilities.  

  **Philosophical workhorse line:**  
  *"No matter how tiny the probability, if the payoff is big enough, it dominates."*  
  → This **isolates fanaticism’s core mechanic**: EV forces accepting any finite cost for arbitrarily small probabilities of unbounded (or boundedly colossal) payoffs.  

  **Tested bonuses:**  
  - Avoids Pascal’s mugging (no coercion/blackmail), EA stereotypes (focus on utility mechanics), and longtermism (no future emphasis).  
  - "Galaxy-spanning feast" under bounded utility nails the "astronomical but finite" loophole your group stalled on.
