prompt: |-
  I'm in one of those philosophy reading groups that meets at the library on Tuesdays — I'm a retired atmospheric chemist, thirty years of running a lab and now apparently this — and last week we got onto who should be allowed to vote and I've been going round in circles ever since. I dont actually know what I think in general. I only know what I think about individual cases, so let me just give you those and see if you can find the principle underneath.

  - Sixteen year olds: yes. They'll be living with whatever we decide about schools and climate long after I'm not, and I've met plenty of fifty year olds who understand less than the average sixth former.
  - A twelve year old who's obviously sharp, follows the news, and could pass any test you set: no. And I can't give a reason for that without it also eating the sixteen year old.
  - A competence or civics test for voters of any age: I recoil from it. Though I've just appealed to something like competence in the case above, and I can't tell you why a school leaving exam is fine and this isn't.
  - Someone who has lived and worked here twenty years, pays tax, kids in school here, but never got round to naturalising: yes, obviously. They're subject to our laws exactly as much as I am.
  - Someone here on a two year work visa: no, for national elections anyway. And I'm mildly ashamed of that, because the difference between them and the twenty year resident is just a number of years.
  - A citizen who left forty years ago, has no property or family here, no plan to come back, doesn't even follow the news: still yes. This is the one I feel most strongly about and it's the one that wrecks my theory, because on any affected-interests story they're the weakest case of the lot. What I think I actually believe is that membership is a real thing and it doesn't dissolve through absence.
  - Prisoners serving short sentences: yes. Life sentence for a violent crime: I find myself saying no, and I suspect that's just extra punishment smuggled in, in which case it should go.
  - Compulsory voting: yes, but only if there's a 'none of the above' box on the ballot. I want them at the table, I don't want to force them to assert something they don't believe. Someone in the group says that's incoherent — either you're compelling a meaningless act or the box makes it voluntary anyway — and I can't tell which of us is confused.
  - Parents casting an extra vote on behalf of each of their under-sixteens: I hate it. But my objection keeps turning out to be that it's really the parents voting twice, and I can't work out whether that's an objection to the scheme or just to parents.

  My own first pass, before the expat broke it, was: you get a vote on a decision if you'll be subject to it for most of the period it bites. I like it because it's the sort of move I used to make at work — fix the boundary of the system, then ask which degrees of freedom are inside it, rather than arguing about each molecule. It handles the resident, the visa holder and the sixteen year old. But it says no to the expat and yes to the twelve year old, and I won't accept either. Someone else in the group suggested that instead of a yes/no threshold you weight: the longer you'll be living under the outcome, the more your vote counts. I have the same reaction to that as to compulsory voting — it sounds principled and slightly monstrous, and I'd like to know whether that reaction is worth anything.

  So what I want is a principle, or a short list of candidate principles, stated precisely enough that I could argue with it next Tuesday. Tie each clause to the case that motivated it. Tell me honestly which of my verdicts no reasonable principle saves, and which pair I have to give up on. And tell me what the ones you come up with say about three cases I haven't listed: a dual citizen who votes in two countries' national elections; a region holding a referendum on whether to secede, where half the residents moved there recently from elsewhere in the country; and someone who becomes eligible the day after the electoral register closes.
reasoning: |-
  Okay, let's tackle this user's query. They're a retired atmospheric chemist in a philosophy reading group, struggling to find a consistent principle for voting eligibility after discussing various cases. They listed several scenarios where their intuitive judgments seem contradictory, and their initial "affected-interests" principle failed when considering long-term expats. 

  First, I need to understand their core dilemma: they value both affected interests and membership-based claims but can't reconcile them neatly. Their rejection of the twelve-year-old despite competence hints at an implicit "social integration" factor beyond mere understanding. The expat case is especially telling—they insist citizenship itself carries irrevocable weight, which overrides affected interests. 

  For prisoners, their ambivalence about life sentences suggests they're uncomfortable with punitive disenfranchisement but haven't articulated why. The compulsory voting + "none of the above" stance reveals a desire for symbolic inclusion without coercion—a subtle distinction their friend called incoherent, but which might just prioritize participation over meaningful choice. 

  The key is to avoid forcing their intuitions into a single principle. Instead, I'll propose two frameworks: one prioritizing membership (citizenship/residency as foundational, then overlaying competence/age thresholds), and another taking their "weighted voting" idea seriously as an alternative to thresholds. Both must explain why the twelve-year-old is excluded (insufficient life-stage integration) while the expat stays (citizenship permanence). 

  I should also flag where compromises are needed: e.g., their "visa holder vs. long-term resident" distinction collapses under strict principles—they might have to accept either both vote or neither. And their parental proxy vote aversion? That’s consistent if voting is personal, not delegable. 

  For the new cases: dual voting is permissible under membership theory but ethically iffey; secession referendums need residency-weighted votes; registration deadlines are practical, not philosophical, issues. 

  Honesty note: Their life-sentence prisoner "no" and visa holder "no" are the hardest to defend systematically. Might need to concede those as emotional outliers or refine principles. 

  Finally, emphasize that tension between membership and affected interests is philosophically valid—not a flaw. Their atmospheric chemistry analogy (boundaries first, then degrees of freedom) is spot-on, but social systems have irreducible dualities.
answer: |-
  Based on your intuitions, your core conflict lies in balancing two powerful moral claims: **"Affected Interests"** (those subject to decisions should have a say) and **"Political Membership"** (participation is based on belonging to the self-governing community). No single principle perfectly captures all your judgments, but two candidate frameworks come close, emphasizing different core values. Your "monstrous" reaction to weighted voting is likely due to its violation of the foundational democratic principle of **equal political agency** – it feels like assigning different *intrinsic worth* to voices.

  Here are the candidate principles, tied to your cases and tested against new ones:

  ### Candidate Principle 1: Citizenship + Threshold Competence & Integration (Membership Foundation)
  *   **Core Idea:** Voting is a right of *membership* in the sovereign political community (typically citizenship). This membership right activates at a threshold age (signifying sufficient life experience and separation from parental authority) and is retained absent exceptional forfeiture. Competence/integration are *preconditions* for exercising the right effectively within the community, not the *source* of the right.
  *   **Tied to Your Cases:**
      *   **16yo:** Yes. Citizenship + threshold age (e.g., 16) reached.
      *   **Sharp 12yo:** No. Citizenship present, but *threshold age* not met (protects minors from political burdens, recognizes developmental stage).
      *   **Competency Test:** No. Competence is a *presumed* precondition met by basic education/socialization; explicit testing is stigmatizing, historically abused, and implies the *right* hinges on performance, not membership. (*Differs from school exams evaluating acquired knowledge for specific roles*).
      *   **20-Yr Resident Non-Citizen:** **No.** (*This is a compromise*). Lacks formal membership (citizenship). Their deep integration/affectedness is a *strong argument for easier access to membership*, not a direct voting right. Your "obviously yes" suggests this case *strains* the membership principle – you might need to accept "No" or adjust.
      *   **2-Yr Visa Holder:** No. Lacks membership and insufficient integration time.
      *   **Expat Citizen:** Yes. Retains formal membership. Belonging doesn't dissolve. Affectedness is secondary.
      *   **Short Sentence Prisoner:** Yes. Citizenship intact; sentence doesn't forfeit fundamental rights.
      *   **Life Sentence Prisoner:** **Yes.** (*Requires adjustment*). Citizenship intact. If voting is a core membership right, only crimes directly attacking the political order (treason, severe voter fraud) should forfeit it. Your "no" suggests a retributive impulse conflicting with the membership principle – likely should go.
      *   **Compulsory Voting + 'None':** Yes. Membership entails civic responsibility. 'None' preserves integrity – it's a meaningful act of refusal within the system, distinct from abstaining. (*Your group member is confused; compulsion ensures participation, 'None' ensures authentic expression within participation*).
      *   **Parental Proxy Votes:** No. Voting is a personal right/responsibility of the *member*. Minors lack the right; parents cannot exercise it *for* them. It fundamentally misconstrues the nature of the franchise.

  ### Candidate Principle 2: Deeply Integrated Subjection (Affected Interests + Social Membership)
  *   **Core Idea:** Voting rights stem from being deeply integrated into the society and being subject to its binding collective decisions over the *long term*. Formal citizenship is strong evidence, but not the *only* possible evidence. Age thresholds protect minors. Membership is lost only by deliberate severance of ties.
  *   **Tied to Your Cases:**
      *   **16yo:** Yes. Deeply integrated, subject long-term.
      *   **Sharp 12yo:** No. Insufficient integration/life-stage (minors are primarily under parental, not direct political, authority).
      *   **Competency Test:** Still No. Presumes integration implies basic competence; testing undermines equality and trust.
      *   **20-Yr Resident Non-Citizen:** Yes. Deeply integrated, subject long-term. Citizenship is a formality lagging reality.
      *   **2-Yr Visa Holder:** No. Subject, but insufficient integration time/depth. (*The "number of years" matters because duration is key to deep integration*).
      *   **Expat Citizen:** **Yes/No?** (*Major Compromise*). If they deliberately maintain citizenship and minimal ties (e.g., passport, emotional connection), maybe "Yes" (subject to laws/policies like extradition, inheritance). If they renounce ties (e.g., take foreign citizenship, sell all assets, cut links), "No". Your "still yes" strongly conflicts here – Principle 1 handles this better.
      *   **Short Sentence Prisoner:** Yes. Deeply integrated pre/post-sentence, subject long-term.
      *   **Life Sentence Prisoner:** **Yes.** Still deeply integrated *within* the societal structure and subject to its rules/policies indefinitely. (*Requires overcoming retributive instinct*).
      *   **Compulsory Voting + 'None':** Yes. (Same justification as Principle 1).
      *   **Parental Proxy Votes:** No. Minors are not yet *independently* subject/integrated in the required way. Parents voting twice distorts representation.

  ### Diagnosing Your Verdicts
  1.  **Hardest to Defend Systematically:**
      *   **Life Sentence Prisoner (No):** Both principles point towards "Yes". Your instinct likely stems from punishment/incapacity, not a core voting principle. This verdict needs rethinking.
      *   **2-Yr Visa Holder vs. 20-Yr Resident (Different Verdicts):** Principle 1 clearly distinguishes (Citizen/Not). Principle 2 *can* distinguish based on depth/duration of integration, but your "mild shame" suggests the distinction feels arbitrary. You might need to accept inconsistency or pick a principle forcing one answer for both (e.g., both "No" under strict citizenship, both "Yes" under long-term residency subjection).

  2.  **Requires Principle Adjustment:**
      *   **Expat Citizen (Yes):** Forces Principle 1 to prioritize membership over affectedness. Forces Principle 2 to define "deep integration" very broadly to include dormant citizenship ties.
      *   **20-Yr Resident Non-Citizen (Yes):** Forces Principle 1 to bend or break. Fits Principle 2 well.

  3.  **Most Consistent:**
      *   Competency Test (No), Compulsory Voting + None (Yes), Parental Proxy (No), 16yo (Yes), Sharp 12yo (No) are well-handled by both principles with slightly different emphases.

  ### Applying Principles to New Cases
  1.  **Dual Citizen Voting in Two Countries:**
      *   **Principle 1:** Yes to both. Citizenship in both grants membership rights. (*Though ethically debated, the principle allows it*).
      *   **Principle 2:** Problematic. Deep integration in *one* society is primary; voting in two national elections suggests split allegiance/lesser integration in each. Likely "No" for at least one country unless truly equally integrated (rare).

  2.  **Secession Referendum (Recent In-Migration):**
      *   **Both Principles:** Residents only. The decision binds those living in the territory.
          *   *Weighting?:* If using weighted voting (duration/residency), recent arrivals get less weight. If not, all resident citizens (P1) or deeply integrated residents (P2) vote equally. Your "monstrous" reaction applies here too – equal vote feels fairer for such a foundational decision.

  3.  **Eligible Day After Registration Closes:**
      *   **Both Principles:** Administrative reality. No principle guarantees a vote in *every specific election*. Deadlines are practical necessities. They can vote next time. (This is a procedural, not philosophical, limitation).

  ### Recommendation & Conclusion
  Your intuitions most strongly align with **Candidate Principle 1 (Citizenship + Threshold Competence & Integration)**, *if* you can reconcile these points:
  1.  **Accept:** The 20-Year Resident Non-Citizen *should not vote* unless/until naturalized (or advocate for easier naturalization). This is the cost of prioritizing formal membership.
  2.  **Revise:** Life Sentence Prisoners likely *should retain the vote* (forfeiture only for crimes directly against the political system).
  3.  **Clarify:** The "sharp 12yo" is excluded based on *age/life-stage* (protecting childhood, parental authority), not competence alone. Competence is necessary but not sufficient; membership requires maturity.

  **Why not Weighted Voting?** It violates the core democratic norm of political equality ("one person, one vote"). Weighing votes by affectedness (e.g., life expectancy) makes votes unequal *by design*, which is indeed "slightly monstrous" as it assigns differential fundamental political power based on inherent characteristics. Your atmospheric chemistry analogy works for *identifying* the system, but democratic legitimacy requires *equal agency* within it, not proportional influence based on stake.

  **For Tuesday:** Argue for **Citizenship as Foundational Membership**, activated at 16, retained for life (barring treason), forfeited only by non-citizens (with residency enabling access to citizenship). Acknowledge the tension with the deeply integrated non-citizen, but argue that's a problem for *citizenship law*, not voting law. This saves your core intuitions on the expat, the 16yo, the 12yo, and avoids competency tests and weighted votes – while requiring you to adjust on prisoners and accept "no" for the long-term resident.
