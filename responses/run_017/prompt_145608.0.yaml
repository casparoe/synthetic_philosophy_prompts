prompt: |-
  Setting aside the two standard battlegrounds in the laws-of-nature debate — whether laws govern rather than merely describe, and how a best-system account should trade simplicity against informational strength — give me one concretely described case in which a Humean and an anti-Humean would still come apart over what the laws are, or over whether the world has any laws at all.

  I'd like the case to turn on a candidate law that is not a universal generalization over local matters of fact: something like a global structural constraint (a law fixing the universe's total charge, or the topology of its spacetime), a one-off prohibition on a unique unrepeatable event, or a law stated over a region or period in which nothing exists. Assume both sides agree about every particular matter of fact, so the disagreement is not empirical. Show exactly where the two accounts diverge, why that divergence is not simply the governing-versus-describing dispute or the simplicity–strength trade-off in another guise, and what the case reveals about the real fault line between the positions.
reasoning: |-
  Okay, the user is asking for a concrete case where Humean and anti-Humean views on laws of nature would disagree, excluding the typical debates about governing vs. describing and simplicity-strength trade-offs. They want a scenario involving something like a global constraint, a one-off prohibition, or a law over an empty region. Both sides agree on all empirical facts, so the disagreement is philosophical. I need to show exactly where they diverge and why it's not just the standard disputes in disguise.

  First, I recall the core differences. Humeans see laws as summaries of particular matters of fact, while anti-Humeans believe laws are real metaphysical entities that govern events. The user wants a case that doesn't involve universal generalizations, which are common in laws like Newton's laws. So I need to think of a law that isn't about patterns in events but something more structural or global.

  I consider examples like the universe's total charge or spacetime topology. But the total charge might be tied to local facts about particles, which could still fit into a Humean best system. Spacetime topology might be trickier, but it's complex. Then I remember that some theories propose laws that constrain the entire universe's history, like boundary conditions. 

  The idea of a law prohibiting a unique event comes to mind. For example, a law stating that a specific singularity doesn't occur. But if it's unique and unrepeatable, how does that fit into a Humean system? The Humean might say that since it didn't happen, it's already covered by the absence in the mosaic. But the anti-Humean could argue that there's a law actively preventing it. 

  Then I think about a law that applies to an empty region. Suppose there's a point in time with no events. A law stating that nothing happens there. For Humeans, since there are no events to summarize, such a law wouldn't add any informational strength. Including it in the best system would be redundant because the absence of events is already part of the mosaic. The simplicity gained by adding a law like "nothing happens at t=0" is minimal, and it doesn't compress any information since there's nothing to describe. So the best system wouldn't include it.

  Anti-Humeans, however, might see this as a genuine law. Even though no events occur, the law could be a fundamental constraint that ensures nothing happens at that moment. It's a metaphysical fact about the universe's structure, not derived from events. So they would accept such a law as real, while Humeans reject it because it doesn't summarize or systematize any facts.

  The key divergence is ontological. Humeans require laws to supervene on the mosaic of events. An empty region has no events, so no supervenience base. Anti-Humeans don't have that constraint; laws can exist independently. This case highlights that the fault line is about what grounds the laws—particular facts versus something beyond. It's not about governing because the law doesn't cause anything; it's about existence in the absence of instances. Also, simplicity-strength isn't the issue because adding the law offers no strength and minimal simplicity.
answer: |-
  Here is a concretely described case designed to highlight the fundamental divergence between Humean and anti-Humean views, avoiding the specified battlegrounds and focusing on a law-like constraint over an *empty region*:

  **The Case: The Law of Temporal Silence at t=0**

  *   **The Universe:** Consider a possible universe U. U has a temporal beginning at t=0 and extends infinitely into the future (t > 0). Crucially, **at the exact point t=0, nothing whatsoever exists or occurs.** It is a true temporal singularity and void – no particles, fields, spacetime points (as we understand them post-t=0), events, or properties. For t > 0, the universe unfolds deterministically according to a complex set of fundamental laws (the specific nature of which isn't crucial, as long as they are agreed upon by both parties).
  *   **The Candidate Law (L):** "At time t=0, nothing exists and no event occurs."
  *   **Agreed Upon Facts:** Both the Humean and the anti-Humean agree entirely on the complete history of the universe for *all t > 0*. They also agree that *empirical investigation* (even in principle) reveals absolutely no trace of *anything* existing or happening at t=0. The mosaic of particular matters of fact is *utterly silent* about t=0; there are simply no facts *at* t=0 to report. The state of the universe at the first instant *after* t=0 (t=ε) is consistent with having evolved from *nothing* at t=0.

  **The Disagreement:**

  1.  **Anti-Humean Stance:** An anti-Humean (e.g., a dispositional essentialist or primitivist) can readily accept L as a genuine, fundamental law of nature in U. They see laws as ontological posits that *constrain* what is possible or actual. L functions as a *boundary condition law* or a *cosmological constraint*. It doesn't govern ongoing events (since nothing exists at t=0 to govern), but it *absolutely prohibits* the existence or occurrence of *anything* at that specific point in the global structure of time. It explains *why* the universe sprang into existence *from nothing* at t>0 rather than having some initial state. For the anti-Humean, L is a brute, irreducible feature of U's nomological structure, playing a distinct role alongside the dynamical laws governing t>0.
  2.  **Humean Stance (Best System Account - BSA):** The Humean firmly rejects L as a genuine law. Here's why:
      *   **The Mosaic Constraint:** Humean supervenience demands that laws supervene on the total mosaic of particular matters of fact. The mosaic *at and about* t=0 consists solely of the fact that *there are no facts* at t=0, plus the fact that the state at t=ε exists and has certain properties consistent with evolving from nothingness.
      *   **Informational Strength:** What information does L convey? It states there is nothing at t=0. But the mosaic *already entails this* – it explicitly lacks any facts at t=0. Adding L to the Best System provides **zero** new information about the mosaic. It doesn't summarize any pattern, correlate any events, or enable any predictions that aren't already trivially true given the mosaic's silence at t=0. The state at t=ε is explained by the dynamical laws governing t>0 and the *absence* of any initial conditions *at* t=0 (which is just a feature of the mosaic).
      *   **Simplicity:** While L is a very simple statement, adding it gains no strength. The BSA prioritizes systems that achieve the best *balance* of strength and simplicity. Adding a postulate that provides *no strength whatsoever* cannot improve the system, even if it is simple. A system *without* L is strictly better: it achieves identical descriptive and predictive power regarding the entire mosaic (including the void at t=0) with fewer axioms. Including L is redundant and violates the principle of avoiding unnecessary postulates. The Humean sees the void at t=0 as simply a *brute feature of the particular history*, not something requiring or constituted by a law.

  **Why This Divergence Avoids the Standard Battlegrounds:**

  1.  **Not Governing vs. Describing:** L doesn't clearly "govern" in the active sense usually debated. Nothing exists at t=0 *to be governed*. The anti-Humean might say L *constrains* or *prohibits*, but the core dispute here isn't about *how* laws relate to events (governing vs. describing events). It's about whether a law can *exist* and be *truthful* when its content is solely about the *absence* of any particular facts at a specific locus, an absence already fully captured by the mosaic itself. The Humean denies L is even a *description* worth systematizing.
  2.  **Not Simplicity-Strength Trade-off:** The disagreement isn't about balancing these virtues. The Humean argues L contributes **ZERO** strength to the system – it adds no information, predictive power, or compression regarding the mosaic. It's not that L is *simple but weak*; it's that it's *completely redundant*. Including it makes the system strictly worse by adding an axiom that does nothing. The anti-Humean doesn't see L's value in terms of summarizing the mosaic; they see it as an independent constraint whose truth isn't determined by the mosaic's silence but *explains* that silence.

  **What This Reveals About the Real Fault Line:**

  This case starkly exposes the **ontological commitment** underlying anti-Humeanism versus the **supervenience constraint** of Humeanism.

  *   **Anti-Humean Ontological Commitment:** Anti-Humeans are committed to laws as fundamental entities within their ontology. These laws can impose constraints that are *logically prior* to or *independent* of the distribution of particular matters of fact. A law can be "about" a locus where no facts exist, defining the very possibility (or impossibility) of facts existing there. The law's existence and truth aren't *constituted* by the mosaic; they can *account for* features of the mosaic (like its silence at t=0).
  *   **Humean Supervenience Constraint:** For the Humean, *everything* about laws must be grounded in, constituted by, and supervene on the global pattern of particular matters of fact. If a putative "law" doesn't capture any pattern, correlation, or regularity *within* the mosaic of facts, and especially if it purports to be about a place/time where *no facts exist*, it has nothing to supervene *on*. It cannot be part of the Humean account of laws. The mosaic's silence at t=0 is just a brute particular fact – the absence of other facts – not the manifestation of a deeper law. Laws, for Humeans, are fundamentally *immanent* within the pattern of occurrent facts.

  **In essence, the fault line revealed is this: Can laws impose fundamental constraints that are not merely summaries of the distribution of particular matters of fact, but can instead hold *even in the complete absence* of facts at the locus they concern, and potentially *explain* that very absence?** The anti-Humean says yes; the Humean, bound by supervenience, says no. The "Law of Temporal Silence" forces this ontological divergence into sharp relief, distinct from debates about governance or the virtues of systematization.
