  ### Coding Protocol for Societal Disruption Episodes

  #### Pre-Branch Declaration (Step 0)
  Before substantive coding, the coder must declare:
  - **Patient**: The specific entity under assessment (e.g., state, settlement system, administrative technology, religious institution, population welfare).
  - **Territory**: The geographic scope of analysis.
  - **Bandwidth**: The temporal window for evaluation (e.g., 2 generations, 10 years).  
  *Rationale: Forces explicit framing of the episode, surfacing disagreements about the patient.*

  #### Decision Tree (8 Branch Nodes)
  Nodes are binary (yes/no) and evidence-based. All questions reference the declared patient, territory, and bandwidth.

  1. **Integration Trough**: Did integration (settlement hierarchy, administrative reach, craft specialization, long-distance exchange volume/range) decline by ≥50% from pre-episode levels?  
     *Evidence: Archaeological/comparative data on structures, trade, specialization.*

  2. **Legibility Trough**: Did legibility (writing, accounting, metrological standards, administrative record-keeping) decline by ≥50% from pre-episode levels?  
     *Evidence: Inscriptions, texts, administrative artifacts.*

  3. **Welfare Trough**: Did welfare (mortality rates, nutrition, stature, fertility) decline by ≥50% from pre-episode levels?  
     *Evidence: Bioarchaeological/demographic data, historical records.*

  4. **Register Discordance**: Do the trough tests (nodes 1–3) disagree (e.g., integration trough but no welfare trough)?  
     *Rationale: Adjudicates conflicts between integration, legibility, and welfare registers.*

  5. **Scale Relativity**: Is there evidence of disruption at the macro level (state, elite institutions) without corresponding disruption at the micro level (household/village subsistence, local production, kinship)?  
     *Evidence: Household archaeology, local economic data, continuity in daily practices.*

  6. **Self-Description as Loss**: Do near-contemporary sources (within 1–2 generations) describe the episode as a major loss or collapse?  
     *Evidence: Texts, oral traditions, iconography produced during/immediately after the episode.*

  7. **Successor Elite Discount**: If node 6 is "yes," are surviving sources predominantly from successor elites?  
     *Rationale: Discounts self-description if biased by successor agendas.*

  8. **Reversible-but-Not-Reversed**: Was the pre-episode configuration materially available (knowledge, resources, conditions existed) to later generations in the territory but not resumed?  
     *Evidence: Technological/cultural continuity, absence of physical constraints, explicit rejection of revival.*

  #### Verdicts and Leaves
  Verdicts are determined by logical combinations of nodes. "Near miss" is not a leaf (it indicates instrument mis-specification; see validation). Justifications reference node outcomes.

  | Node Outcomes (1–8)                                                                                    | Verdict             | Defining Commitment                                                                 | One-Line Justification                                                                 | Awkward Consequence                                                                                               |
  |--------------------------------------------------------------------------------------------------------|---------------------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|
  | **No majority trough** (nodes 1–3: ≤1 "yes")                                                          | Neither            | Episodes without multi-register decline are disruptions, not collapses/transformations. | No substantial decline in ≥2 core registers.                                           | Overlooks slow-motion collapses where no single trough is severe (e.g., gradual ecological decline).              |
  | **Majority trough + resumed** (nodes 4: "no" + 8: "resumed" implied if node 8 "no" not triggered)     | Neither            | Recovery proves resilience; the episode was a reversible crisis.                    | Pre-episode configuration was resumed.                                                 | Misses transformations masked by superficial recovery (e.g., institutions revived but fundamentally altered).     |
  | **Majority trough + not available** (nodes 4: "yes" + 8: "no" → 8a: "no") + any scale relativity      | Collapse           | Irreversible loss defines collapse; the prior system cannot be rebuilt.             | Pre-episode configuration was irreversibly lost.                                       | Codes resource-depletion collapses (e.g., Easter Island) with elite-driven collapses (e.g., Mycenae) identically. |
  | **Majority trough + available but not resumed + core discontinuity** (nodes 4: "yes" + 8: "no" → 8a: "yes" + node 5: "no") | Collapse           | Choice not to resume, coupled with core rupture, signifies societal collapse.       | Pre-episode configuration was abandoned despite availability, and core elements broke. | Fails to distinguish collapse from transformation if cultural continuity is ambiguous.                            |
  | **Majority trough + available but not resumed + core continuity** (nodes 4: "yes" + 8: "no" → 8a: "yes" + node 5: "yes") | Transformation     | Rejection of prior configuration with micro-level continuity is transformation.      | Pre-episode configuration was abandoned voluntarily with core elements persisting.     | Overlooks cases where "core continuity" is superficial (e.g., survival of language amid institutional rupture).  |
  | **Register discordance + no macro disruption** (nodes 4: "yes" + 5: "yes" + welfare trough "no")      | Neither            | Isolated elite disruption without welfare impact is not societal collapse.          | Discordance shows elite-level change only.                                             | Underestimates elite-driven collapse (e.g., Bronze Age Mediterranean) if welfare data is sparse.                 |
  | **Unoccupied combination**: Majority trough + register discordance + welfare trough "yes" + self-description "no" + successor discount N/A. | (Unoccupied)       | Severe welfare loss without elite collapse or self-description is implausible.      | —                                                                                      | Diagnosed as incoherent: welfare collapse typically produces elite disruption or testimony.                      |

  **Near Miss**: Not a leaf. The instrument cannot robustly identify "averted collapse" (e.g., majority trough absent but self-description indicates crisis). This reflects mis-specification: the tree prioritizes material evidence over perceived risk.

  **Indistinguishable Pairs**: The tree cannot separate:
  - **Slow Collapse vs. Transformation**: No node captures rate of change; a slow-motion collapse (e.g., Roman Empire) may code as transformation if core elements persist.
  - **Elite-Driven Collapse vs. System Failure**: Scale relativity (node 5) blurs cases where elite collapse causes societal fragmentation (e.g., Western Roman Empire).

  ---

  ### Validation on Episodes

  #### Episode A: Eastern Mediterranean, c. 1200 BCE
  - **Declaration**: Patient = Palace-administered systems (Mycenaean/Hittite). Territory = Aegean/Anatolia. Bandwidth = 2 generations (50 years).
  - **Path**: 
    1. Integration Trough: **Y** (palace centers cease, settlement decline, exchange narrows).
    2. Legibility Trough: **Y** (Linear B disappears).
    3. Welfare Trough: **Y** (destruction layers, population decline).
    4. Register Discordance: **N** (all registers decline).
    5. Scale Relativity: **N** (household/village disruption implied by settlement collapse).
    6. Self-Description: **N** (no contemporary texts; later Greek tradition lacks memory).
    7. Successor Discount: N/A (node 6 = N).
    8. Reversible-but-Not-Reversed: **N** → 8a. Available? **N** (knowledge lost; not resumed for centuries).
  - **Verdict**: Collapse (irreversible loss).  
    **Justification**: Pre-palace system was irreversibly lost.  
    **Coder Disagreement**: Welfare Trough (evidence sparse) or Reversible-but-Not-Reversed (arguably available but rejected). Reflects real ambiguity in evidence.

  #### Episode B: Southern Maya Lowlands, c. 800–950 CE
  - **Declaration**: Patient = Divine kingship/southern lowland settlement system. Territory = Southern lowlands. Bandwidth = 5 generations (150 years).
  - **Path**:
    1. Integration Trough: **Y** (monuments cease, population declines).
    2. Legibility Trough: **Y** (script/stela cult end).
    3. Welfare Trough: **Y** (population decline).
    4. Register Discordance: **N** (all registers decline).
    5. Scale Relativity: **Y** (village life/agriculture continues).
    6. Self-Description: **N** (no texts post-collapse).
    7. Successor Discount: N/A (node 6 = N).
    8. Reversible-but-Not-Reversed: **N** → 8a. Available? **N** (depopulation; not resumed in south despite northern use).
  - **Verdict**: Collapse (irreversible loss).  
    **Justification**: Pre-episode configuration was irreversibly lost.  
    **Coder Disagreement**: Reversible-but-Not-Reversed (arguably available but not chosen, triggering transformation). Real disagreement about material availability.

  #### Episode C: Dissolution of the USSR, 1991
  - **Declaration**: Patient = Soviet state/command economy. Territory = USSR. Bandwidth = 1 generation (10 years).
  - **Path**:
    1. Integration Trough: **Y** (state dissolves, command economy ends).
    2. Legibility Trough: **Y** (administrative systems dismantled).
    3. Welfare Trough: **Y** (life expectancy decline).
    4. Register Discordance: **N** (all registers decline).
    5. Scale Relativity: **N** (household disruption via welfare decline).
    6. Self-Description: **Y** (sources describe collapse).
    7. Successor Discount: **Y** (sources from post-Soviet elites).
    8. Reversible-but-Not-Reversed: **N** → 8a. Available? **Y** (resources/knowledge existed; not resumed).
  - **Verdict**: Transformation.  
    **Justification**: Pre-episode configuration was abandoned voluntarily with core elements persisting.  
    **Coder Disagreement**: Welfare Trough (temporary vs. structural decline) or Scale Relativity (arguable micro-level continuity). Real conceptual disagreement about welfare thresholds.

  #### Summary of Disagreements
  - All episodes show coder disagreements due to **evidential ambiguity** (A: welfare/reversibility; B: reversibility; C: welfare/scale) and **conceptual tensions** (e.g., "reversible-but-not-reversed" in C). This is a feature of the concept, not a tree defect. The tree surfaces disagreements rather than resolving them.
