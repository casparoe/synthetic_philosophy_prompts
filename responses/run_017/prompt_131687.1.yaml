answer: |-
  Here is an organized specification of requirements for a theory of testimonial warrant suited to institutional intermediaries (news desks, fact-checking teams, relay pipelines), derived from your cases and distinctions. Requirements are grouped by function, with sources noted. Non-negotiables (NN) are marked; others reflect theoretical fault lines.

  ---

  ### **I. Core Functional Requirements (Non-Negotiables)**  
  These ensure the theory is *actionable* for intermediaries:  
  1. **Permissibility Without Full Vetting (NN)**  
     - *Source:* One-off stranger giving directions.  
     - *Requirement:* Warrant must be possible without independent verification, track record, or access to speaker’s mental states.  
  2. **Opaque Expertise Handling (NN)**  
     - *Source:* Claims from domains where downstream assessors lack expertise (e.g., quantum physics, specialized medicine).  
     - *Requirement:* Warrant must not depend on the hearer’s ability to evaluate the content.  
  3. **Non-Agential Source Accommodation (NN)**  
     - *Source:* AI outputs, machine-translated relays, or automated summaries.  
     - *Requirement:* Warrant must not require belief, intention, or speaker "responsibility" (e.g., GPT-4 outputs can warrant belief if conditions are met).  
  4. **Institutional Attribution (NN)**  
     - *Source:* Committee statements, corporate press releases (no individual believes/endorses).  
     - *Requirement:* Warrant must apply to group sources where responsibility is distributed or procedural.  
  5. **Source-Disconnect Resilience (NN)**  
     - *Source:* Source amnesia, overheard conversations, anonymous tips.  
     - *Requirement:* Warrant must survive loss/misattribution of source identity if the claim’s status remains intact.  

  ---

  ### **II. Epistemic Hygiene Requirements**  
  These prevent systematic errors:  
  6. **Anti-Luck Condition (NN)**  
     - *Source:* Long chains with cancelling errors, true-by-luck testimony.  
     - *Requirement:* Warrant must not accrue to claims that are true only by accident (e.g., garbled telegram that coincidentally reports correctly).  
  7. **Sincerity-Reliability Decoupling**  
     - *Source:* Reliable but insincere speaker (e.g., liar with poor skills); sincere but unreliable speaker (e.g., earnest ignoramus).  
     - *Requirement:* Warrant must not *require* speaker sincerity or reliability *simpliciter*—focus on external indicators.  
  8. **Collision Resolution**  
     - *Source:* Testimony contradicting the hearer’s evidence.  
     - *Requirement:* Warrant must degrade proportionally to conflict with the hearer’s justified background beliefs.  

  ---

  ### **III. Boundary & Scope Requirements**  
  9. **Assertion/Non-Assertion Filter (NN)**  
     - *Source:* Fiction, jokes, sarcasm, seminar hypotheticals.  
     - *Requirement:* Must exclude non-assertoric speech acts *without* relying on speaker intent (use contextual cues, framing).  
  10. **Value/Religious Neutrality**  
      - *Source:* Moral/religious testimony.  
      - *Requirement:* Must *not* special-case these; warrant conditions should apply uniformly across domains. *Debatable*: Some argue moral testimony is "second-hand" by nature.  

  ---

  ### **IV. Structural Distinctions (Must Be Preserved)**  
  11. **Hearer/Speaker Asymmetry**  
      - *Source:* Distinction between speaker’s justification and hearer’s warrant.  
      - *Requirement:* Theory must not collapse warrant into speaker knowledge/justification.  
  12. **Calibration Grain**  
      - *Source:* Friend’s insistence on domain-indexed reliability (e.g., "reliable on physics, not on politics").  
      - *Requirement:* Calibration must be trackable at *domain-specific* (not just global or claim-specific) level. *Note:* Empirical support (e.g., children discounting informants) is robust; deception detection at ≈55% accuracy is well-established but *not* critical here.  

  ---

  ### **V. Tensions & Inconsistencies**  
  - **Tension 1: Default Entitlement vs. No-Free-Lunch**  
    - *Conflict:* "Cheap" default warrant (for strangers) vs. requiring calibration data (e.g., unwarranted if zero track record).  
    - *Resolution:* Possible if "default" is context-triggered (e.g., public assertions in info-sharing contexts) and calibration is *progressive*.  
  - **Tension 2: Long Chains vs. Anti-Luck**  
    - *Conflict:* Warrant through extended chains (e.g., news wire services) vs. prohibiting luck-based truth.  
    - *Cost of Dropping Anti-Luck:* Accept "Gettiered" testimony (true belief without justification)—unacceptable for fact-checking.  
    - *Solution:* Warrant degrades with chain length unless institutional safeguards (e.g., editorial protocols) compensate.  

  **Most Exclusionary Requirement**: **#3 (Non-Agential Sources)**. Excludes theories requiring speaker responsibility (e.g., assurance views) or belief (most anti-reductionisms).  

  ---

  ### **VI. Theory Scorecard**  
  | **Requirement**               | **Global Reductionism** | **Default Entitlement** | **Local Reductionism** | **Responsibility Views** |  
  |-------------------------------|-------------------------|-------------------------|------------------------|--------------------------|  
  | 1. Permissibility w/o Vetting | ✗ (Requires positive reasons) | ✓ (Defaults apply) | ~ (Case-by-case signs) | ✗ (Needs speaker act) |  
  | 2. Opaque Expertise           | ✗                       | ✓                      | ✗                      | ✗                       |  
  | 3. Non-Agential Sources       | ✓ (If reliable)         | ✓                      | ✓ (If signs present)   | ✗ (Fails)               |  
  | 4. Institutional Attribution  | Silent                  | Silent                 | Silent                 | ✗ (Needs individual act)|  
  | 5. Source-Disconnect          | ~ (If content reliable) | ✓                      | ~                     | ✗                       |  
  | 6. Anti-Luck                  | ✓                      | ~ (Defaults ≠ anti-luck) | ✓                     | ✓ (If responsibility met)|  
  | 7. Sincerity-Reliability Split| ✓                      | Silent                 | ✓                     | ✗ (Sincerity-focused)   |  
  | 8. Collision Resolution       | ✓                      | ✗ (Defaults weak here) | ✓                     | ~                       |  
  | 9. Assertion/Non-Assertion    | Silent                  | Silent                 | ✓ (Cue-based)         | ✓ (Intent-based)        |  
  | 10. Value Neutrality          | ✓                      | ✓                     | ✓                     | ~ (Often moralizes)     |  
  | 11. Hearer/Speaker Asymmetry  | ✓                      | ✗ (Often conflates)    | ✓                     | ✗ (Conflates)           |  
  | 12. Domain Calibration        | ✓                      | ✗ (Global defaults)    | ✓                     | Silent                  |  

  **Key**: ✓ = Satisfies, ✗ = Violates, ~ = Partial/Contextual, Silent = No direct resources.  

  ---

  ### **Vulnerabilities & Reorganization Triggers**  
  **Where My List Is Most Likely Wrong**: Over-indexing on institutional pragmatism, potentially underestimating the *metastability* of warrant in long chains (requirement #6). If anti-luck is too strict, it may make relay pipelines practically impossible to justify.  

  **Single Reorganization Trigger**: If **empirical work shows domain calibration is infeasible for intermediaries** (e.g., tracking reliability per topic is cognitively/systematically unworkable), the grain distinction (#12) collapses. This forces either global reductionism (unpalatable for opaque expertise) or default entitlement (weak on collision resolution).  

  This specification prioritizes *feasible institutional norms* over epistemic purity. Its strength is in handling non-agential and distributed sources; its weakness is balancing default efficiency against error-robustness. When you argue next, press the **AI output case**: if the theory can’t handle machine-generated claims without anthropomorphizing, it fails the intermediary test.
