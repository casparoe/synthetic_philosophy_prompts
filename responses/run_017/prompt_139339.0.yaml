prompt: |-
  found these lecture notes online (some econ dept's undergrad game theory course, not a book I can check) and the page on iterated deletion with mixed strategies ends with a paragraph of general claims that I can't tell are right. the worked example is this game, row player's payoff first:

          L        C        R
  T    (4, 4)   (0, 0)   (2, 1)
  M    (0, 0)   (4, 4)   (2, 1)
  B    (1, 0)   (1, 0)   (1, 4)

  the paragraph says, more or less:

  1. a strategy is strictly dominated when you have another single strategy of your own that does better against everything the others could do; cross those out, look again at the smaller game, repeat.
  2. letting mixtures do the deleting buys you nothing new: if a 50-50 mix of T and M strictly dominates B, then either T or M already strictly dominates B on its own.
  3. equivalently, a strategy survives iff there is some belief about the other players' play — a mixed strategy for each of them, picked independently — under which that strategy is a best response.
  4. since a strictly dominated strategy is never a best response, no Nash equilibrium puts positive probability on one, so the survivors contain every equilibrium; and if the procedure pares the game down to a single profile, that profile is the unique Nash equilibrium.
  5. order doesn't matter — cross out strictly dominated strategies in whatever order you like and you land on the same survivors, and that stays true when the things doing the eliminating are mixed.
  6. the mixtures aren't just bookkeeping: if a 50-50 mix of T and M dominates B, then what the theory tells the row player to actually do is randomize 50-50 between T and M.
  7. and in the game above the notes say it stops after deleting B, with {T, M} x {L, C, R} as the final answer.

  my instinct is that 2 is wrong (B looks like it's only beaten by the mix, not by T or M alone) and 6 smells wrong too, but 3 and 5 I genuinely can't tell, 1 feels like it's quietly leaving something out, and 7 I have no idea how to check. can you go through them one at a time and tell me which are right, which are subtly off, and which are just wrong, using the game where it helps rather than just restating the claims?

  commit to a verdict on each — don't give me a survey of what people might say. if there's exactly one you're really unsure about, flag it and say what would settle it, but don't hedge the rest. under 400 words total.
reasoning: |-
  Alright, let me tackle this step by step. The user found some lecture notes on iterated deletion with mixed strategies and has questions about specific claims made in them. They've provided a game matrix and listed several points (1 through 7) from the notes, asking for clear verdicts on each. 

  First, I need to understand the game. The matrix shows payoffs for row player (T, M, B) against column player (L, C, R). The key is to analyze mixed strategy dominance and how iterated deletion applies. The user seems particularly skeptical about claims 2 and 6, and unsure about others. 

  For claim 1: It defines strict dominance correctly but misses that mixtures can dominate even when pure strategies don't. This is important because claim 2 directly contradicts this possibility. 

  Claim 2 is definitely wrong. In the given game, B isn't dominated by T or M alone (since B beats T against R, and beats M against L), but a 50-50 mix of T and M dominates B everywhere. This is a standard counterexample. 

  Claim 3 is correct—survival means there exists some belief (mixed strategy by opponents) making it a best response. This is foundational. 

  Claim 4 is correct too: strictly dominated strategies can't be in Nash equilibria, and the deletion process preserves equilibria. If only one profile remains, it must be the unique Nash. 

  Claim 5 holds: deletion order doesn't matter for the final set. This is a known robustness property of the process. 

  Claim 6 misunderstands the theory. The mix (T,M) is used to delete B, but the row player isn't instructed to actually randomize—they might play pure strategies in equilibrium. The mix is just a tool for elimination. 

  Claim 7 is incorrect for this game. After deleting B, we must check column strategies. L is dominated by C? Actually, comparing L and C: against T, L gives 4 vs C's 0; against M, L gives 0 vs C's 4. Neither dominates. But R dominates both? Against T: R gives 1 vs L's 4? Wait no, R gives 1 while L gives 4—so R doesn't dominate L. Actually, no pure strategy dominates another for columns. But importantly, after deleting B, R becomes dominated for columns? Let's calculate: After B is deleted, column faces only T and M. For L: payoffs 4 (vs T), 0 (vs M). For C: 0 (vs T), 4 (vs M). For R: 1 (vs T), 1 (vs M). Now R is strictly dominated by a 50-50 mix of L and C (which gives 2 vs T and 2 vs M, better than R's 1). So R should be deleted next. Then, without R, L and C aren't dominated. So the survivors should be {T,M} × {L,C}, not including R. The notes stopping at {T,M} × {L,C,R} is incomplete.

  The user's instincts were sharp—they caught the critical errors in claims 2, 6, and 7. Their confusion about 3 and 5 is understandable, but those hold up. The deeper need here seems to be understanding how mixed strategies fundamentally change dominance concepts beyond pure strategies, and where lecture notes might oversimplify. The game provides a perfect test case for these nuances.
answer: |-
  Here's a verdict on each claim, using the game as needed:

  1.  **Incorrect (subtly off)**: Correct about strict dominance requiring *one* better strategy, but silently assumes pure strategies. The definition *must* allow mixtures to be the dominating strategy for full iterated deletion (as the notes later acknowledge). The phrase "another single strategy" is ambiguous but often implies pure.
  2.  **Wrong**: In the game, B is strictly dominated by a 50-50 mix of T and M (vs L: 2 > 1, vs C: 2 > 1, vs R: 1.5 > 1). But neither T nor M dominates B alone: T loses to B if Column plays R (2 > 1? No, 1 > 2? Wait: Row payoff for T,R is 2; for B,R is 1. So 2>1, T beats B if Column plays R. M loses to B if Column plays L (0 < 1). B is *not* dominated by any pure strategy. Claim 2 is false.
  3.  **Correct**: This is the fundamental equivalence: survival iff best response to *some* belief (mixed strategy profile of opponents). This holds.
  4.  **Correct**: Strictly dominated strategies are never best responses, so cannot be in any Nash equilibrium. The deletion process preserves all Nash equilibria. If only one profile survives, it is the unique NE.
  5.  **Correct**: The order of deletion (using mixed or pure dominators) does not affect the final set of surviving strategies.
  6.  **Wrong**: The mix (50-50 T&M) is used to *delete* B, proving B is irrational. It does **not** tell Row to actually play that mix. Row might play pure T or M in equilibrium, depending on Column. The mix is a tool for elimination, not a prescription for play.
  7.  **Incomplete/Wrong**: Deleting B (dominated by mixed T&M) is correct. However, in the smaller game ({T,M} × {L,C,R}), Column's strategy R is now strictly dominated! Against T: R gives Col 1 (L gives 4, C gives 0). Against M: R gives Col 1 (L gives 0, C gives 4). R is strictly dominated by a 50-50 mix of L and C (yielding Col 2 against T and 2 against M, >1). After deleting R, neither L nor C is dominated. Survivors are {T, M} × {L, C}, *not* the full {L, C, R}. The notes stopped too soon.
