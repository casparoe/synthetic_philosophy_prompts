prompt: |-
  I'm midway through a graduate seminar on classical Indian epistemology, and before I commit to a paper topic I want to work out what our professor is actually committed to. Over the first half of the term she has ruled, fairly briskly, on a run of cases, and I cannot tell which principle she is running. Here is her track record as I have it in my notes:

  1. Seeing a pot in clear daylight: pramā, by pratyakṣa.
  2. Taking a shell for silver: not pramā — and she added that this is not merely because reaching for the shell leads to frustrated action, since a false cognition can sometimes guide action successfully.
  3. Inferring fire on a hill from smoke, with the pervasion (vyāpti) established: pramā, by anumāna.
  4. The same-looking cognition where what appeared to be smoke is in fact a plume of mist: not pramā.
  5. The city-dweller who is told that a gavaya is like a cow, later meets one in the forest, and forms the cognition "this is what 'gavaya' denotes": pramā, and produced by upamāna as a pramāṇa in its own right — she was explicit that this is not, as a reductionist would have it, testimony plus perception.
  6. A trustworthy person's report that there is water at the foot of the hill, addressed to a hearer who has never been there: pramā, by śabda.
  7. The very same true report from a speaker the hearer knows to be unreliable: true belief, but not pramā — the defect lies in the source, she said, and a true outcome does not repair it.
  8. Devadatta is known to be alive but is not in the house, so he must be outside: pramā, but by anumāna; she will not grant postulation (arthāpatti) a separate pramāṇa.
  9. Noticing that there is no jar on the floor: pramā, and known by pratyakṣa; she will not grant non-cognition a separate pramāṇa either.

  She has also twice insisted that whether a cognition is a pramā and whether it is produced by a distinct pramāṇa are separate questions, and that the second does not follow from the first. What 5, 8 and 9 seem to show jointly is that she is not a uniform reductionist about the pramāṇas, and that her reason for resisting reduction in one case is not, so far as I can see, the same as her reason for insisting on it in the others.

  Here are three cases of my own construction that she has not seen, on which I want to predict her:

  A. Sam is reliably told by his astronomy teacher that there will be an eclipse on the morrow, and believes it. He then works through the ephemerides himself and derives the same conclusion. The resulting cognition is true. Is it a pramā, and if so by which pramāṇa?

  B. As in A, except that the general rule on which Sam's derivation depends is one he has only on his teacher's authority and could not establish for himself; the application of it is entirely his own work.

  C. Sam holds the derived conclusion before his mind and, a moment later, runs the derivation again, with no intervening doubt, and then a third time. Are the second and third cognitions pramās, and instances of anumāna? Does it matter whether an intervening doubt separates them?

  What I want is this. First, the two or three principles that fit her nine verdicts about equally well. My own guesses are (i) a source-integrity rule: a cognition is pramā just in case a pramāṇa has operated without defect, with pramāṇas individuated by irreducibly distinct processes; (ii) a credit rule: pramā requires that the truth be attributable to the subject's own exercise of a reliable competence, so that borrowed reliability yields true belief at best; (iii) a novelty rule of the kind that requires what is cognized to be cognized for the first time, either for pramā-status or for counting as the product of a distinct pramāṇa. I suspect these are badly stated and that there are better candidates. Second, what each principle predicts about A, B and C, and precisely where they come apart. Third, your best guess at her verdict on each of the three, with reasons for preferring the principle that yields it — in particular, whether anything in her track record, or in the shape of the Nyāya position she is reconstructing, makes one of them the natural thing for someone in her position to hold. Fourth, if more than one principle survives, the single further case I should put to her in office hours that would separate them, together with what each principle would have to say about it. And if any candidate principle forces me to read one of her earlier verdicts as an outlier, tell me which, and why.
reasoning: |-
  Hmm, let me tackle this graduate student's problem. They're in a classical Indian epistemology seminar and need to reverse-engineer their professor's commitments based on her rulings on various pramāṇa cases. They've listed nine specific judgments she's made and want to predict her responses to three new hypothetical cases. 

  First, I need to understand the core tension. The professor rejects strict reductionism (as seen in cases 5, 8, 9) but also resists expanding pramāṇas (cases 8-9). Her insistence that pramā-status and pramāṇa-source are separate questions is crucial. The student's proposed principles (source-integrity, credit, novelty) seem plausible but need refinement.

  Looking at the existing cases: Her acceptance of upamāna as independent (case 5) while rejecting arthāpatti and abhāva (8-9) suggests she requires distinct causal processes for each pramāṇa. Case 7 (unreliable testimony) shows that truth isn't sufficient - the source must be properly functioning. Case 2 emphasizes that successful action doesn't confer pramā-status, prioritizing epistemology over pragmatics.

  For the new cases:
  - In A, where Sam gets testimony then verifies independently, I think she'd call it pramā by anumāna because his inference creates new epistemic grounding.
  - In B, where Sam applies a rule he only knows through testimony, it's trickier. If she emphasizes causal history, it might still be anumāna; if she cares about credit for premises, it might not count.
  - In C, about repeated inferences without doubt, I suspect she'd say only the first is pramā by anumāna, treating subsequent ones as memory-derived.

  The student's novelty principle seems strongest, especially given how she distinguishes initial cognition from recollection. But we'd need to test it against case 4 (mistaken inference) - novelty alone wouldn't explain why that fails, requiring additional reliability conditions.

  A good follow-up case would involve testimony about perceptual evidence (e.g., being told "there's a pot before you" while seeing it). That would force apart source-integrity from credit principles.
answer: |-
  Based on your professor's track record and stated commitments, I identify three coherent principles that fit her rulings. Each explains her pattern while making distinct predictions for your cases. Here's the analysis:

  ---

  ### **Principle 1: Source-Specific Functionality (Strong Anti-Reductionism)**  
  *A cognition is pramā iff it arises from a *distinct pramāṇa operating without defects*, where each pramāṇa has an irreducible causal process tied to its unique function. Pramāṇa-status depends on the *integrity of the specific generative mechanism*, not just outcome or content.*  

  **Fits the track record:**  
  - Explains why *upamāna* (case 5) is irreducible: the "gavaya" cognition arises from a unique process of comparison/recollection triggered by testimony, distinct from perception alone.  
  - Rejects *arthāpatti* (case 8) and *abhāva* (case 9) as separate: they collapse into *anumāna* or *pratyakṣa* functionally.  
  - Case 7: True belief via defective testimony isn’t *pramā* — the source mechanism is corrupted.  
  - Case 4: Defective inference fails despite correct form (smoke/mist confusion).  

  **Predictions for your cases:**  
  - **A:** *Pramā* by *anumāna*. Sam’s independent derivation is a distinct causal process from testimony, even if content overlaps. Source integrity is preserved.  
  - **B:** **Not *pramā* by *anumāna***. The inference depends on a borrowed premise (teacher’s authority), corrupting the *anumāna* mechanism. Outcome is coincidental truth (like case 7).  
  - **C:** Only the **first** cognition is *pramā* by *anumāna*. Subsequent repetitions lack novelty and reactivate the *same* causal chain (now memory-driven). Intervening doubt might reset if it forces re-derivation, but unlikely.  

  ---

  ### **Principle 2: Epistemic Credit (Competence-Based)**  
  *Pramā requires the cognizer’s *personal exercise of a reliable competence* to secure truth. Borrowed reliability (even from a *pramāṇa*) yields mere true belief.*  

  **Fits the track record:**  
  - Case 7: Unreliable speaker’s true report lacks credit — hearer contributes no competence.  
  - Case 5: The "gavaya" cognition requires the hearer’s active comparison (competence exercised).  
  - Case 3 vs. 4: Valid inference credits the cognizer’s grasp of *vyāpti*; defective inference lacks this.  
  - Case 9: Absence is perceived directly — no additional competence needed beyond perception.  

  **Predictions:**  
  - **A:** *Pramā* by *anumāna*. Sam’s derivation exercises his inferential competence.  
  - **B:** **Not *pramā***. Sam relies on the teacher’s competence for the premise; his application is "mechanical" and uncredited. Outcome is testimonial true belief.  
  - **C:** Only the **first** cognition is *pramā* by *anumāna*. Subsequent repetitions are passive recall (no competence exercised). Intervening doubt *might* allow credit if it triggers active re-inference, but repetitions without doubt are inert.  

  ---

  ### **Principle 3: Causal Novelty**  
  *A cognition is *pramā* iff it *newly discloses* its object via a *first-time causal interaction* with a *pramāṇa*. Repetitions or repackaged cognitions are not *pramā* (even if true), as they lack novelty.*  

  **Fits the track record:**  
  - Case 5: The gavaya cognition is novel disclosure via *upamāna*.  
  - Case 7: The report’s truth isn’t novelly disclosed due to source defect.  
  - Case 8: "Devadatta outside" is a repackaged inference from known facts — not novel.  
  - Case 9: Absence is directly novel to perception.  
  - Her comment on *pramā* vs. *pramāṇa* separation: Novelty affects *pramā*-status, but *pramāṇa* identity depends on process type.  

  **Predictions:**  
  - **A:** *Pramā* by *anumāna*. Sam’s derivation is a novel causal process, distinct from testimony.  
  - **B:** **Not *pramā***. The inference recycles the teacher’s knowledge; no novel disclosure.  
  - **C:** Only the **first** cognition is *pramā*. Subsequent repetitions lack novelty, regardless of doubt.  

  ---

  ### **Best Guess for Professor's Verdicts & Preferred Principle**  
  Your professor most likely holds **Principle 1 (Source-Specific Functionality)**, with **Principle 3 (Causal Novelty)** as a secondary criterion. Why:  
  - **Case 5** is decisive: She insists *upamāna* is irreducible, emphasizing the *process* (not credit/novelty alone).  
  - **Case 7** prioritizes source integrity over outcome.  
  - **Case 8–9** reject new *pramāṇas* by collapsing them into existing mechanisms.  
  - **Nyāya alignment**: She mirrors classical Naiyāyika anti-reductionism (e.g., Gaṅgeśa on *upamāna*), while resisting Mīmāṃsā expansions (*arthāpatti*).  

  **Her predicted verdicts:**  
  - **A:** *Pramā* by *anumāna* (source distinct from testimony).  
  - **B:** **Not *pramā*** (defective source: inference parasitizes testimony).  
  - **C:** Only the **first** cognition is *pramā* by *anumāna*; later repetitions are not (lack causal novelty).  

  **Why not Principle 2 (Credit)?**  
  It overfits case 7 but struggles with case 5: The "gavaya" hearer exercises minimal competence (passive comparison), yet she grants *pramā*. Competence isn’t her focus — *process type* is.  

  ---

  ### **Crucial Follow-Up Case to Separate Principles**  
  **Case D:** *A child is told by her mother, "Fire burns." Later, she touches fire, feels pain, and thinks "Fire burns!" Is this cognition pramā, and by which pramāṇa?*  

  - **Principle 1 (Source-Specific):** *Pramā* by *pratyakṣa* (perception of burning). Testimony primes but doesn’t generate the cognition; perception operates defect-free.  
  - **Principle 2 (Credit):** Not *pramā* — the truth was borrowed from testimony; perception only confirms it mechanically.  
  - **Principle 3 (Novelty):** *Pramā* by *pratyakṣa* — the *object* (fire’s burning) is disclosed anew via perception.  

  **Why this works:**  
  - If she says *pramā* by perception, Principles 1/3 win (aligning with Nyāya).  
  - If she denies *pramā* or calls it testimony, Principle 2 wins (unlikely given her Nyāya leanings).  

  This case isolates whether prior knowledge *disqualifies* a cognition (Credit) or if a valid *pramāṇa*’s operation suffices (Source/Novelty). Her ruling on case 5 suggests she’d accept the latter.

  ---

  ### **Outlier Reading**  
  No principle perfectly fits **case 4** (smoke/mist confusion):  
  - If the inference *form* is perfect but content false, why is it not *pramā*? All principles agree (defective source/lack of competence/no novelty), but her phrasing (*"the same-looking cognition"*) implies identical process. **Solution:** She likely sees a *material defect* in the inferential process (misperception of "smoke"), preserving Principle 1. This aligns with Nyāya’s *asiddhi* (unestablished reason) — no outlier.

  ---

  **Summary:**  
  - **Strongest Principle:** Source-Specific Functionality (anti-reductionist *pramāṇa* individuation).  
  - **Predicted Verdicts:**  
    - A: *Pramā* (by *anumāna*)  
    - B: Not *pramā*  
    - C: Only first cognition is *pramā* (by *anumāna*)  
  - **Decisive Test:** Case D (perception after testimony).  

  Present Case D in office hours. If she emphasizes the *perceptual process* overriding testimony, Principles 1/3 hold; if she denies *pramā* due to "borrowed truth," Principle 2 wins (but this contradicts her *upamāna* ruling).
