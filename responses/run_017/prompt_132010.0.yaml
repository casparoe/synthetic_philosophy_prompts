prompt: |-
  hey — I want an actual argument here rather than a tour of the literature, so please commit to the position instead of lining up considerations on both sides. And don't bother with citations or "as Searle puts it"; I just want the reasoning.

  Set-up, so we're on the same page: Searle's Chinese Room. A man who speaks no Chinese sits in a room, Chinese writing comes in through a slot, he matches it against an English rulebook and passes Chinese writing back out, and to people outside the room his replies are indistinguishible from a native speaker's. Searle concludes that neither the man nor the room understands Chinese, and hence that running the right program can't be sufficient for understanding.

  The angle I want you to use is a distinction I'm making up on the spot. Call a system's competence *interpretively implemented* when the causal chain that produces its behaviour runs through some component that reads and grasps a specification of what the whole system is meant to do — somebody, or something, has to understand "when this comes in, send that out" and then comply. Call it *non-interpretively implemented* when nothing in the system does that: the parts just get on with their local jobs and no sub-part is consulting a description of the whole. The room is obviously the first kind of case. A human brain, on any ordinary telling, is the second: there's no little reader in there working from a manual of you.

  Argue that this distinction, and not the familiar "syntax isn't semantics" line or the appeal to the special causal powers of grey matter, is what's really load-bearing in the Chinese Room — and that read this way the argument survives both the System Reply (the room-plus-man-plus-rulebook as a whole understands, even though no part of it does) and the Robot Reply (stick the system in a body with cameras and limbs so that it's properly hooked up to the world).

  Along the way I want you to:

  - explain why, if a system is interpretively implemented by an agent who doesn't understand the target domain, crediting understanding to the whole system is stipulation masquerading as explanation, and why that undercuts the System Reply;
  - say why the Robot Reply is beside the point on this reading — you can wire the room up to as many sensors as you like and its still interpretively implemented;
  - handle Searle's own internalisation move, where he memorises the entire rulebook, carries the whole system around inside his head, and insists he still understands nothing. My suspicion is that internalisation leaves the distinction completely untouched, so the move is a red herring — but that's for you to argue;
  - handle the "compiled" version: after twenty years at it the man no longer consciously consults anything, he just answers fluently. Is that still interpretive implementation? If it isn't, your argument needs something to say about it;
  - and deal with the worry that this proves too much, since people often pick up a language partly by consciously following rules they do understand, and we don't for a moment conclude that they never end up understanding it. (I'd guess the reply turns on what's doing the work now rather than on how the competence was acquired, but that's your problem to sort out.)

  Lead with your bottom line in the very first sentence — the claim you're defending, flat and unhedged — then give me the reasoning. No preamble, no restating the question back at me, no fence-sitting at the end. British English, and aim for something like 700–900 words.
