answer: |-
  You've pinpointed a fascinating and revealing inconsistency in contemporary monument politics. Let's reconstruct the implicit theory of monuments embedded in this practice and analyze its coherence:

  **The Implicit Theory of Monuments Revealed by the Practice:**

  1.  **Location Defines Function & Meaning:** The core presupposition is that *where* a monument is placed dictates its primary function and societal message. A statue on a public plinth in a civic square is perceived as **active state endorsement and honorific commemoration.** Moving it to a museum radically changes its function: it becomes a **historical artifact**, an object of **study**, **contextualization**, and **critical reflection** on past values, actions, and societal conflicts (including the protest itself).
  2.  **Monuments are Active Agents, Not Passive Objects:** The practice treats monuments not merely as lumps of bronze or stone, but as powerful **symbols** that actively *do* something in public space – they honor, they legitimize, they project state-sanctioned narratives, they shape collective memory and identity. Removing them from the plinth is seen as revoking that active endorsement.
  3.  **Preservation as Historical Testimony:** The refusal to destroy presupposes that the object itself has **evidentiary and pedagogical value**. The protest markings (paint, ropes) are preserved precisely because they are part of the object's *history* and the societal debate it ignited. Destroying it erases that tangible evidence of conflict and change.
  4.  **The Empty Plinth as Negative Space:** Leaving the plinth empty is treated as **meaningful silence** or **active questioning**. It signifies the *removal* of state endorsement, creates space for public reflection on *why* it was removed, and sometimes functions as an implicit critique of the figure or the values they represented. It's a visual statement of rejection without prescribing a replacement.
  5.  **Distinction Between Monumental Commemoration and Toponymic Reference:** The practice implicitly distinguishes between the powerful, symbolic act of placing a figure *on a pedestal* in public space (monumental commemoration) and naming infrastructure after someone (toponymic reference). The former is seen as a much stronger, more active form of state honor and endorsement, making it the primary target for removal. Street names, while problematic, are often seen as less visually dominant, more bureaucratic, and sometimes harder to change en masse, leading to inconsistency.

  **What the Practice Strictly Requires vs. What it Merely Fits Well With:**

  *   **Strictly Requires:**
      *   **Context Determines Meaning:** The museum move *depends* on the belief that location fundamentally alters the object's societal function (honor vs. history).
      *   **Preservation of Evidence:** The "can't destroy it" rule requires valuing the object as historical testimony, especially the protest markings as part of its story.
      *   **Plinthes are Meaningful Sites:** The empty plinth practice requires believing that the *absence* of the monument in that specific location communicates something significant (rejection, reflection, unresolved history).
  *   **Fits Well With (but not strictly required):**
      *   **Critical Pedagogy:** The museum move *fits* a view that museums are places for critical engagement with difficult histories.
      *   **Atonement/Acknowledgment:** Preserving protest damage *fits* a desire to acknowledge past wrongs and ongoing struggles.
      *   **Democratic Deliberation:** The empty plinth *fits* an idea of public space as a site for ongoing debate about memory and values, leaving room for future decisions.
      *   **Gradual Change:** The toponymic inconsistency *fits* a pragmatic, gradualist approach to changing symbolic landscapes, tackling the most egregious forms first.

  **Coherence of the Parts: Honoring vs. Teaching vs. Evidence**

  *   **Potential Tension:** There *is* tension. Does placing it in a museum, even with critical context, inadvertently grant a form of lasting institutional recognition that borders on a *different kind* of honor ("preserved for posterity")? Does preserving the protest ropes emphasize the *act of protest* over the *critical history* of the figure? Does leaving the plinth empty truly foster productive reflection, or just create an unresolved wound?
  *   **Compatibility:** However, they *can* be coherently held together under a broader theory:
      *   **Rejecting Active Endorsement:** The removal and empty plinth decisively end the *state's active, honorific endorsement* of the figure in the public square.
      *   **Preserving for Critical Engagement:** The museum placement shifts the object's role to *passive historical evidence*, available for critical study and contextualization *about* the endorsement, the figure, and the societal conflict surrounding both.
      *   **The Protest as Part of the Artifact:** The preserved protest damage explicitly links the object to the *controversy and rejection*, preventing its presentation as a neutral historical relic. It embeds the critique within the artifact itself.
  *   **Resolution:** The apparent contradiction between "honoring" and "teaching" is resolved by the **radical shift in context and framing**. The museum doesn't honor *the figure*; it uses the object to teach *about the history of honoring problematic figures and the societal rejection of that practice*. The preserved protest markings are crucial evidence *for* this critical narrative. The empty plinth reinforces the rejection of endorsement.

  **Consequences of a Flatter View:**

  1.  **Monuments as Just State Speech:**
      *   **Requires:** Consistent removal of *all* state speech honoring the figure – statues, street names, building names, official portraits. Anything bearing the figure's name or image with state sanction must go. Context (museum) wouldn't absolve it; the state shouldn't be seen as "speaking" honorifically at all.
      *   **Changes:** No museum placement (implies endorsement). Destruction or permanent storage might be preferred. Empty plinths become simply the *absence* of speech, not a statement itself. Toponymic changes become mandatory, not inconsistent.
  2.  **Monuments as Just Decoration:**
      *   **Requires:** Aesthetic judgment overrides symbolic meaning. If deemed "good art" or "historically significant design," it stays, regardless of who it depicts. If ugly or insignificant, it goes.
      *   **Changes:** Protest damage becomes vandalism to be cleaned, not preserved history. Removal would be rare, based purely on aesthetics or space needs, not political meaning. Empty plinths would be seen as an eyesore to be filled quickly with something "prettier." Toponymic names are just labels, irrelevant to the "decoration" of statues. The entire political dimension is erased.

  **Conclusion:**

  The current package of moves (museum, preserve protest marks, empty plinth) reveals a sophisticated, context-dependent theory of monuments: they are active agents of state-endorsed commemoration whose meaning and function are radically altered by relocation. This practice strictly requires the principle that location defines function, preservation serves historical testimony, and the plinth site holds inherent meaning. While tensions exist (especially regarding toponymy and potential residual honor in museums), the parts cohere under the umbrella of rejecting active public endorsement while preserving the object for critical historical engagement about that very endorsement and rejection. Adopting a flatter view (mere speech or mere decoration) would necessitate drastically different, and arguably less nuanced or historically conscious, approaches to contested monuments. The inconsistency with toponyms highlights a practical and perhaps philosophical weakness in the current model, suggesting the distinction between monumental commemoration and naming might be less clear-cut than the practice assumes.
