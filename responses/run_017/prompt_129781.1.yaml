answer: |-
  Here’s a concise Q&A prep sheet targeting your hostile room, prioritizing high-damage objections. Replies are designed for quick delivery (≈90s), with a candid "Soft Spot" note for each.

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by potential damage)*  

  1. **Behavioral Geneticist**:  
     *"You’re just rebranding ‘environmentality’ as ‘closable share’—and it’s not identifiable without twin studies. This ignores gene-environment correlations."*  
     **Reply**: "The closable share isn’t a variance component—it’s the *practical reduction* we can achieve with real interventions. Yes, gene-environment interplay matters, but we’re asking ‘What can we change?’ not ‘What caused the gap?’ Identifiability comes from RCTs or quasi-experiments, not twin models."  
     **Soft Spot**: *If pressed on causal identification, concede we need strong program evaluations.*  

  2. **District Data Director**:  
     *"How do I stop the board from quoting you as proof that ‘schools don’t matter’?"*  
     **Reply**: "If anyone says that, they misheard me. Heritability rising *because* environments improved shows schools *do* matter. My whole point is: programs like this can shift outcomes regardless of genes."  
     **Soft Spot**: *Politicians cherry-pick; rehearse a soundbite like "Genes aren’t fate."*  

  3. **Quantitative Researcher #1**:  
     *"Your ‘closable share’ assumes the test measures reading identically across subgroups. What about measurement invariance?"*  
     **Reply**: "You’re right—if the test is biased, all estimates are garbage. I’m assuming the district’s assessments meet invariance checks. If not, that’s step zero."  
     **Soft Spot**: *If assessments are flawed, this torpedoes everything.*  

  4. **Teachers’ Union Rep**:  
     *"This feels like academic gymnastics to justify cutting programs. Why waste time on heritability when kids need resources now?"*  
     **Reply**: "I agree—we need action. But if the board uses heritability to argue against funding, we must debunk it. This isn’t about limits; it’s about proving interventions *work*."  
     **Soft Spot**: *They’re not wrong about urgency; pivot to "This protects your funding."*  

  5. **School Psychologist**:  
     *"I have a kid struggling to read on Monday. Do genes mean I should tell his teacher to give up?"*  
     **Reply**: "Absolutely not. Heritability doesn’t predict individual potential. Your student could thrive with the right support—genes just mean we need personalized tools. The program we’re evaluating could be one."  
     **Soft Spot**: *They want a magic bullet; emphasize "try, assess, adapt."*  

  6. **Behavioral Geneticist (Follow-Up)**:  
     *"High heritability *does* imply environmental interventions have low ROI. Why invest in something genetics constricts?"*  
     **Reply**: "PKU is 100% genetic and 100% treatable. ROI depends on *which* environment you change. Uniform programs like this one can bypass heritability’s ‘blind spot’—that’s the inversion."  
     **Soft Spot**: *ROI arguments require cost-benefit data you may lack.*  

  7. **Parent Rep**:  
     *"You’re saying genes affect reading. Does that mean some kids are just born behind?"*  
     **Reply**: "Genes create differences, but they don’t decide who succeeds. A great program can lift all kids—like vaccines preventing genetic diseases. Your child’s starting point isn’t their endpoint."  
     **Soft Spot**: *Parents fear fatalism; stress agency.*  

  8. **Quantitative Researcher #2**:  
     *"If heritability rises when environments improve, why bother closing gaps? Won’t genetics just dominate again?"*  
     **Reply**: "No—because we’ve raised the floor for everyone. A higher heritability in a better environment means we’ve reduced unfair disadvantages, not that progress is futile."  
     **Soft Spot**: *Ignores structural inequities; add "This is why we target gaps."*  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"What’s the actual closable share for this program? If it’s 5%, why spend millions?"*  
  **Why it’s bad**: Exposes if your metric lacks real-world estimates. Forces you to defend cost without data.  
  **Reply**: "Today’s about why heritability *doesn’t* answer that. For this program’s impact, see the efficacy study [reference]. But remember: PKU’s closable share was near 100%—we aim high."  

  ---

  \answer{**"Schools don't matter" misquote**}  
  *(Most likely & highest stakes: Data Director’s fear)*
