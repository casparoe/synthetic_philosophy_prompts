answer: |-
  Below is a systematic assessment of the exposure of your selected-effects view, structured by your cases. I’ve ranked the objections by severity, flagged empirical stakes, compared predictions to rival theories, and addressed unfalsifiability concerns. Your intuition about **indeterminacy** is astute—it’s the core vulnerability.

  ---

  ### **Ranked Defeaters: From Fatal to Awkward**
  #### **1. Selection’s Indifference to Truth → Fatal if Unresolved**  
  **The Problem:** When fitness depends on a disjunctive condition (e.g., *predator-or-rustling-leaves*), selection fixes content to the disjunction. This clashes with the *unity* of intuitive content (e.g., "predator!").  
  **Why it’s fatal:** Indeterminacy proliferates:  
  - If the disjunction is gerrymandered (e.g., *light-intensity > X at time T*), content becomes ecologically non-systematic.  
  - No principled basis to privilege one disjunct over another without smuggling in non-historical factors (e.g., causal dominance).  
  **Your Dilemma:** Concede content is disjunctive (sacrificing representational unity) or deny misrepresentation exists in these cases (collapsing the theory).  
  **Empirical Decider:** If cognitive science reveals that neural mechanisms *systematically* track unified distal properties (e.g., object boundaries) *despite* selective pressures favoring disjunctive triggers, your view fails.  
  **Response:** Defenders (e.g., Millikan) bite the bullet: content is "ugly" but determined. *Your worry stands: this dissolves intentionality’s normative structure.*

  #### **2. Function-Switching → Serious (Potentially Fatal)**  
  **The Problem:** A mechanism selected for tracking luminance (Content A), then re-selected for spatial layout (Content B), with suppression of luminance responses.  
  **Why it’s serious:**  
  - **Option 1:** Only *current* function matters → denies history’s role (abandons teleosemantics).  
  - **Option 2:** Both functions coexist → conflicting contents for the same state (incoherence).  
  - **Option 3:** "Dominant" function wins → no selectionist criterion for dominance.  
  **Indeterminacy Redux:** History underdetermines content when functions conflict.  
  **Empirical Decider:** If neuroscience shows pervasive repurposing (e.g., visual cortex in blindness), and behavioral data suggest *unified* content despite dual histories, the view loses.  
  **Response:** Sophisticated defenders (e.g., Shea) argue selection "layers" functions. *But if re-selection overwrites prior functions (as in your case), layering fails.* **Concede:** This exposes history’s underdetermination.

  #### **3. Non-Selection Origins → Awkward but Defensible**  
  **Your Cases:**  
  - **Random Net:** No selection history → no function → no content? (Violates intuition).  
  - **Gradient Descent:** Iterative optimization ≈ selection-shaped → content?  
  **The Risk:** Overextension ("any optimization confers content").  
  **Why Awkward:**  
  - Random Net: If *downstream exploitation* suffices for derived content, you abandon selectionism. If not, you deny content to a functional system—counterintuitive but consistent.  
  - Gradient Descent: Here, variation (parameter updates), differential retention (loss minimization), and inheritance (backpropagation) make it *structurally* selectionist. **Not vacuous:** Optimization requires a fitness proxy (loss function).  
  **Empirical Decider:** If AIs trained without iterative selection (e.g., one-shot architectures) exhibit robust representational capacities, your view is falsified.  
  **Response:** Limit the view to systems with *feedback-driven retention* (excluding pure luck). **Dismiss** Random Net as a rival intuition (e.g., Fodor’s "no function without history").

  #### **4. Scope of Content → Awkward but Not Unique**  
  **The Problem:** Teleosemantics excels at indicator content (e.g., frog’s fly-detector) but struggles with compositionality and abstract thought.  
  **Why Awkward:**  
  - No complete teleosemantic theory of composition exists. Millikan’s "pushmi-pullyu" representations don’t scale to human propositional thought.  
  - Rivals (e.g., inferential role semantics) handle composition better but lack naturalistic foundations.  
  **Response:** **Concede** this is promissory. *But*: All naturalistic theories face this. Teleosemantics still grounds atomic concepts in selection history.  
  **Empirical Decider:** If cognitive science shows perceptual and cognitive content rely on *distinct mechanisms*, your view’s generality shrinks.

  ---

  ### **Comparison to Rival Views**  
  Teleosemantics uniquely predicts:  
  - **Representational drift:** Content degrades if selective pressures change (e.g., vestigial instincts misrepresent). Informational semantics lacks norms for error.  
  - **Pathology as malfunction:** Aphantasia or hallucinations reflect failures of *selected* mechanisms. Functional-role theories lack historical norms.  
  - **Developmental contingency:** Innate content varies with species’ selective history. Interpretivism ignores etiological constraints.  

  **Where rivals win:**  
  - Informational semantics handles covariance without history.  
  - Structural-representational theories explain compositionality mechanistically.  

  ---

  ### **Unfalsifiability Assessment**  
  **Yes, the view risks schema-hood:** "Selection-shaped" can be stretched to cover drift (as a "selection process of zero efficacy"), cultural evolution, or gradient descent. This *is* a defect if it immunizes the theory.  
  **Mitigation:** Impose constraints:  
  1. Selection requires *differential retention* (excluding pure drift).  
  2. "Function" must be tied to *actual historical success* (excluding mere usefulness).  
  3. For learning, require a feedback loop (excluding one-shot plasticity).  

  Without these, the view is vacuous. With them, it remains testable (e.g., if drift explains a trait, it has no teleosemantic content).

  ---

  ### **Conclusion: Where You Should Worry**  
  Your ranking is correct: **Indeterminacy** (Cases 1 & 2) is the deepest threat. It reveals that selection history is insufficient to fix determinate content, inviting either disunified contents or reliance on non-historical factors. *This is a concession the view must make.* Empirical evidence of pervasive exaptation (Case 2) or ecologically disjunctive contents (Case 1) would be fatal. Case 3 is manageable with tight criteria for "selection-shaped"; Case 4 is a challenge for all naturalizers.  

  **A path forward:** Hybridize. Use selection to ground normativity (error conditions), but admit non-historical factors (e.g., systemic role) to resolve indeterminacy. This sacrifices purity but may save the core insight.
