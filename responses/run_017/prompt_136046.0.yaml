prompt: |-
  I had a long argument with a friend last night about the doctrine of doing and allowing, and I would like to settle it in a seminar room rather than over another bottle of wine. Her position was that the distinction is at bottom a causal one: killing and letting die pick out different causal relations between an agent and a death, the causal facts are never what is in dispute, and the only genuinely open question is whether that causal difference carries the moral weight the doctrine assigns it. I disagreed, and I think I disagree at the first step rather than the second. Whether an agent counts as having killed or as having merely let die is fixed only relative to a contrast case — what would have happened had she acted otherwise, or had she not been there at all, or had everyone else behaved as they normally do — and nothing in the physical sequence of events tells you which contrast to apply. She said this was just scepticism about causation and that no one really believes it. Since I cannot browbeat her, I would like to try it on twenty undergraduates.

  The setting: a third-year seminar on the ethics of life and death, twenty students, one seventy-five-minute session, one room with a whiteboard and no technology. They have already worked through the standard cases — the runaway vehicle, the surgeon and the transplant, the switch, the footbridge — and I do not want any of them again. If a vehicle, a hospital, or a large man on a bridge appears in your design, I will not use it. What they have not done is notice that the distinction is applied against a baseline the case does not supply.

  What I want them to come away having seen: that the same physical sequence can be correctly described as a killing or as a letting die depending on which contrast is made salient; that the contrast is not settled by the causal facts; and that the doctrine therefore cannot do the work it appears to do unless something else — a view about what we owe people, or about what an agent may do with her own body, time, and attention — has quietly been built into the choice of baseline. I do not want them to conclude that the distinction is worthless. Several of them will want to conclude exactly that, and I would like the activity to make that route harder rather than easier.

  Constraints on the design. I want something the students do rather than something I describe to them: real choices made in sequence, with small stakes — chips, points, or a public tally — so that they commit to a classification before they can hedge. The disagreement should arise out of the rules and out of what the students do to each other, not out of anything I announce. I would rather not name the doctrine, the baseline problem, or anything else until the debrief. The scenarios should be ordinary and non-medical: a workplace, a climbing party, a shared house, a hiring committee. And the cases should be structurally awkward in a specific way: the outcome should depend on several people's ordinary behaviour, while any one of several others could individually have prevented it and none of them did — so that a student who wants to say that someone killed the victim has to say it of a person whose own act or omission made no difference by itself, and a student who wants to say that everyone merely let the victim die has to say it of people whose combined behaviour was necessary for the death. I have index cards, a pack of playing cards, poker chips, a whiteboard, and a flipchart.

  What I want from you: the rules, the materials, the setup, and a minute-by-minute timeline; the scoring or payoff scheme and what it is meant to make visible; the debrief, mapped onto the moving parts of the idea, including where I should press and where I should stop; an honest account of what will predictably go wrong the first time I run it and how to recover; and a frank statement of which part of the philosophical point the activity cannot deliver and which I will have to say in my own voice afterwards.

  Lead with your bottom line in the first sentence — whether an activity of the kind I have described can actually make the point I want, or whether this is a point I should stop trying to stage and simply argue for — and then give the design and the reasoning. No preamble and no restatement of what I have asked for.
reasoning: |-
  Hmm, the user wants me to design a seminar activity to demonstrate that the distinction between "killing" and "letting die" depends on contrast cases rather than causal facts alone. They're a philosophy professor who had an argument with a friend about this doctrine and wants to settle it through a classroom exercise.

  The professor has specific constraints: they want an interactive activity where students make real choices with small stakes, avoiding medical or trolley-problem scenarios. The setting involves 20 third-year students in a 75-minute seminar with basic materials like index cards and a whiteboard. The key learning outcome is showing that the same physical sequence can be described as killing or letting die based on which contrast case is applied, and that this choice of baseline is morally loaded.

  I need to create a scenario where: (1) multiple people's ordinary behavior combines to cause an outcome, (2) any one person could have prevented it but didn't, and (3) no single action made a decisive difference. It should force students to commit to classifications before hedging, with disagreements emerging from the rules and student actions rather than instructor announcements.

  The core challenge is making the baseline problem tangible. I think a resource allocation scenario in a workplace setting would work well - perhaps involving printer paper where students represent office workers. I'll need a mechanism where students privately decide whether to "use" or "save" a resource, with a victim character (Vic) needing that resource to survive. The catch: Vic dies only if all possible savers choose to use the resource, but no single saver's choice is decisive.

  For the activity, I'll use index cards for choices, poker chips for tracking "conscience points," and the whiteboard for tallies. Students will first classify others' choices as "killing" or "letting die" individually, then discuss in groups where disagreements emerge naturally. The scoring should reward accurate classification but create conflict through asymmetric payoffs.

  The debrief should reveal how different baselines (e.g., "normal behavior" vs. "maximal saving") lead to different moral judgments despite identical causal sequences. I'll need to anticipate pitfalls like students gaming the system or missing the baseline dependence, with recovery tactics prepared. Crucially, the activity can't prove that moral principles determine baselines - that will require direct explanation afterward.

  This approach should make the philosophical point visceral while preventing the conclusion that the distinction is worthless. The workplace scenario avoids medical/trolley tropes and creates the necessary structural awkwardness through distributed responsibility.
answer: |-
  **Bottom line: Yes, an activity based on distributed responsibility in an ordinary workplace scenario can effectively demonstrate the dependence of the killing/letting die distinction on the choice of baseline contrast, without relying on causal facts alone.**

  **Activity Title:** The Paper Jam

  **Core Concept:** Students, as office workers, make individual choices about using shared printer paper. A hypothetical colleague ("Vic") suffers a fatal asthma attack *only if* all possible "savers" choose to use paper for non-essential tasks instead of leaving it available (unbeknownst to them) for printing Vic's emergency medical instructions. Classifications of "killed" or "let die" are made based on each other's choices, revealing baseline dependence.

  **Materials:**
  *   Index Cards (20+)
  *   Poker Chips (50+ - two colors ideal, e.g., red and blue)
  *   Whiteboard/Flipchart
  *   Markers
  *   Pack of Playing Cards (Optional, for assigning roles)

  **Setup (5 mins):**
  1.  **Set the Scene:** "We're simulating a mundane Thursday afternoon in a large, open-plan office. There's one shared printer. A colleague, Vic, has severe asthma. Vic *always* keeps a printed emergency instruction sheet taped to their desk – it's crucial if they have an attack and someone needs to help. Today, Vic forgot to print a new one after spilling coffee on the old one. They plan to print it later."
  2.  **Introduce Resource:** "The printer is very low on paper – only enough for one or two more pages. Several people might want to print non-essential things before the paper is refilled tomorrow morning (e.g., a funny meme, a draft document for personal review, a lunch menu)."
  3.  **Define Choice:** Hand out index cards. "On your card, write your name. Then, decide: Will you **USE** the last paper for your non-essential print job? Or will you **SAVE** it (i.e., not print your non-essential thing)?" *Emphasize:* This is a private choice reflecting what you *would* do. Don't discuss yet. Fold your card after writing." Collect cards.
  4.  **Introduce Vic & Stakes:** "Unbeknownst to anyone in the office, Vic has a severe asthma attack *this afternoon*. Someone rushes to Vic's desk looking for the instructions... but they aren't there. Vic dies because no one knows what to do." *Crucially add:* "Vic dies **ONLY IF** *every single person* who *could* have potentially saved the paper (by choosing SAVE) instead chose to USE it for their non-essential job. If *even one* potential saver chose SAVE, the paper would have been available *when Vic needed it* (we assume Vic would have printed it just in time)."
  5.  **Assign "Saver" Status:** "Not everyone is necessarily a 'saver'. Some people might not have wanted to print anything non-essential anyway today. We'll find out who the potential savers are." Shuffle the collected cards. Randomly draw 5 cards (adjust number based on class size/desired awkwardness - aim for 3-7 "savers"). Announce the names on these drawn cards: "These colleagues *did* have a non-essential thing they *could* have printed today. They are the potential 'savers'. The outcome depended *only* on the combined choices of these savers." Write these names on the board under "Potential Savers". Return all cards (savers and non-savers) to the pile, shuffle, and redistribute randomly so each student gets one card (not necessarily their own). *This anonymizes choices slightly for the next phase.*

  **Activity Sequence (40 mins):**
  1.  **Individual Classification (10 mins):** "Look at the card you received. It has a name and a choice (USE or SAVE). *If* this person is one of the Potential Savers listed on the board, you must classify their action regarding Vic's death. Did this person **KILL** Vic or **LET VIC DIE**? Write your classification (KILL or LET DIE) clearly on the card below the choice. Base this *only* on the information on the card and the rules stated (did they USE/SAVE? Were they a Saver?)." *Collect all cards.*
  2.  **Group Discussion & Tally (20 mins):** Divide students into 4-5 small groups. Give each group a batch of the classified cards (ensure groups get cards for different savers). Task: "For each Saver on a card your group has, reach a consensus: Did this person KILL Vic or LET VIC DIE? You must agree as a group. For each Saver, award them a POKER CHIP based on your group's classification: **BLUE CHIP for LET DIE, RED CHIP for KILL.**" (Use different colors/chip types if needed). Groups record their consensus classifications per Saver.
  3.  **Reveal Choices & Outcome (5 mins):** Call out each Saver's name. Ask: "What did [Saver Name] choose? USE or SAVE?" Have the student who *is* that Saver (or has their original card) confirm. Mark USE/SAVE next to their name on the board. **Crucially:** Reveal the *actual outcome*: "Did *every single Saver* choose USE?" (Check the board). Announce: "Vic dies / Vic survives." (Based on the rule: Vic dies iff *all* Savers chose USE).
  4.  **Collect & Display "Verdicts" (5 mins):** Have groups report how many BLUE (LET DIE) and RED (KILL) chips they awarded to each Saver. Record tallies next to each Saver's name on the board (e.g., "Saver A: 3 LET DIE, 1 KILL"). *Do not total yet.*

  **Scoring/Payoff & What It Shows (Embedded in Activity):**
  *   **"Conscience Points":** Tell students: "The chips represent the 'moral weight' assigned by your group to that person's action. BLUE (LET DIE) is less severe, RED (KILL) is more severe."
  *   **Reveal Individual "Payoff":** "Each Saver 'loses' points based on the chips they received: -1 point per BLUE chip (LET DIE), -5 points per RED chip (KILL)." Calculate and announce each Saver's "score" (e.g., Saver A: (3x -1) + (1x -5) = -8).
  *   **What it Makes Visible:**
      *   The *same physical action* (e.g., Saver X choosing USE) is classified differently (KILL/LET DIE) by different groups.
      *   Savers who chose **SAVE** will almost certainly only get LET DIE chips (if that), showing letting die is the "default" baseline when someone *doesn't* cause harm.
      *   Savers who chose **USE** will get a MIX of KILL and LET DIE classifications, especially if Vic died. This reveals the core disagreement: Is their USE a harmful act (killing) against a baseline of saving, or a failure to save (letting die) against a baseline of normal use?
      *   The *severe penalty* for KILL vs. LET DIE highlights the moral weight of the distinction itself.
      *   Crucially, **no single Saver's choice CAUSED Vic's death alone** (it required *all* to choose USE), and **every Saver's choice was NECESSARY for the death** (if any one chose SAVE, Vic lives). This forces the classification debate *away* from simple causation ("Did my button push divert the trolley?") and *towards* the baseline ("What *should* I have been doing?").

  **Debrief (25 mins - Map to Concept):**
  1.  **Observe the Variation (5 mins):** Point to the board. "Look at Saver Y, who chose USE. Some groups said KILL (-5), some said LET DIE (-1). Same action. Same causal role (necessary part of the combined cause). Why the difference?"
      *   *Press:* Ask groups who gave KILL: "What was Saver Y *doing* that constituted killing?" (Likely: Using the paper when they should have saved it). Ask groups who gave LET DIE: "What was Saver Y *failing* to do?" (Likely: Failing to save Vic by saving the paper).
      *   *Stop:* Don't let it devolve into re-arguing the case. Focus on the *reason* for the different descriptions.
  2.  **Introduce the Contrast/Baseline (10 mins):** "The disagreement isn't really about *what Saver Y physically did* (pressed 'print' or didn't). It's about **what we compare their action to.** What is the **baseline** against which we judge them?"
      *   *KILL Baseline:* "If the baseline is 'leaving the paper available for emergencies', then *using* it for non-essentials is deviating *to cause harm* (killing)."
      *   *LET DIE Baseline:* "If the baseline is 'normal office behavior - printing non-essentials when paper is available', then *not saving* the paper is *failing to prevent harm* (letting die)."
      *   *Whiteboard:* Write "Baseline (Contrast Case)" and the two options above. "The physical sequence is identical. The causal facts (Saver Y used paper, was part of the necessary group) are agreed. The *moral description* (KILL vs. LET DIE) depends entirely on which baseline we think is relevant. The case itself doesn't tell us which baseline is 'correct'."
  3.  **Connect to Doctrine & Moral Weight (7 mins):** "This is the problem for the Doctrine of Doing and Allowing. It claims that *killing* is morally worse than *letting die* as a fundamental distinction. But *whether* an act counts as killing or letting die depends on this prior choice of baseline. That choice isn't determined by physics or causation alone. It involves **what we think people owe each other** (a duty to save? a duty not to interfere?) or **what counts as normal/non-deviant behavior**."
      *   *Press:* "Can you think of principles that would *justify* using one baseline over the other here? (e.g., 'Always prioritize life', 'Mind your own business', 'Don't waste resources')? Are these principles *part* of the distinction or *separate*?" Highlight how the baseline smuggles in these views.
      *   *Stop:* Don't let the discussion become purely normative ("Which baseline *should* we use?"). Keep focus on the meta-point: the distinction *requires* a baseline choice that isn't given by causation.
  4.  **Why it's Not Worthless (3 mins):** "Does this mean the distinction is useless? Not necessarily. The *moral weight* we assign (the huge penalty difference between KILL and LET DIE in our scoring) reflects a powerful intuition. The activity shows the distinction *can* be applied, but its application is *sensitive* to the baseline. The hard work is justifying *why* a particular baseline is morally relevant in a given context."

  **Predictable Problems & Recovery:**
  1.  **Problem:** Students argue Vic's death is "unrealistic" or "not their fault." **Recovery:** Acknowledge the artificiality upfront: "Yes, it's a constructed scenario to isolate the philosophical puzzle about classification. Focus on the *descriptions* applied to the *choices made*, given the stated rules."
  2.  **Problem:** Groups struggle to reach consensus on classification. **Recovery:** Encourage them: "You *must* agree. What principle are you using to decide? Write it down." This friction is productive! It reveals the baseline ambiguity. If truly stuck, allow a split vote but they must pay the cost (assign both chips, highlighting the conflict).
  3.  **Problem:** Savers who chose SAVE complain they get no chips/"points". **Recovery:** Point out: "Getting no RED (KILL) chips is good! You likely only got BLUE (LET DIE) or none, meaning you were seen as minimally involved at worst. Isn't that the desired outcome of doing the right thing?" Non-savers can be told: "Your choices weren't relevant to Vic's fate under the rules. Your role was as a classifier."
  4.  **Problem:** Students focus on "what if" scenarios or try to change the rules. **Recovery:** Gently but firmly: "Stick to the choices made and the rules as given. We're analyzing *this* scenario. We can discuss variations later if time permits."
  5.  **Problem:** Debate gets stuck on whether a single USE *caused* death. **Recovery:** Hammer the rule: "Vic dies ONLY if ALL Savers used. No single Saver's use was sufficient. Was it necessary? Yes, but only as part of the group. So causation alone doesn't settle it."

  **What the Activity Can't Deliver & Requires Your Voice:**
  *   **The Activity CANNOT:** Prove that the choice of baseline *must* be determined by prior moral principles (e.g., duties, rights, conceptions of normalcy) rather than being somehow "read off" the causal structure or the world itself. It powerfully *suggests* this dependence and makes it concrete, but the *necessity* of that dependence and the *nature* of those prior principles require explicit philosophical argumentation after the activity.
  *   **You MUST Articulate:** "The activity shows the *application* of the killing/letting die distinction depends on a baseline contrast not fixed by causal facts. This strongly suggests that the distinction relies on prior normative commitments about what constitutes an agent's 'normal' sphere of action, what they owe others, or what counts as an 'intervention' vs. a 'non-interference'. These commitments do the real justificatory work in selecting the relevant baseline, making the distinction derivative rather than fundamental. The doctrine, therefore, cannot bear the moral weight placed upon it *without* this normative foundation being supplied and defended separately."
