  ### The Joke

  **Setup:**  
  Two reverse-Groucho traders, Alice and Bob, are awkwardly eyeing each other at a conference bar. Alice finally approaches.  

  **Exchange:**  
  **Alice:** "I’d only trade with you if you refused to trade with me."  
  **Bob:** "Well, I refuse."  
  **Alice:** "Perfect! Now I *really* want to trade."  
  **Bob:** "But now that you’re eager, I refuse *again*—it’s clearly adverse selection."  
  **Alice:** "Even better! A double refusal? That’s like insider-info Viagra!"  
  (Bob sighs, trapped in the loop. The bartender slides over.)  
  **Bartender:** "What’ll it be?"  
  **Alice & Bob:** "Nothing—we’re reverse-Groucho traders."  
  **Bartender:** "Ah. So you’ll only tip me if I refuse to serve you?"  
  *(Alice and Bob stare, paralyzed. The bar closes.)*  

  **Punchline:**  
  **Bartender:** (To empty stools) "Guess we hit the no-trade equilibrium. Grossman and Stiglitz would be proud—this place is *perfectly inefficient*."  

