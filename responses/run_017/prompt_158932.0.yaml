prompt: |-
  I sit on a volunteer board that reviews applications for early release, and almost everything we do turns on why the applicant acted as she did: whether she now grasps the harm, whether she has stopped making excuses, whether the same pressure would produce the same act again, whether her account of her own reasons has changed. The trial that sent her there ran on what looks like the opposite principle. As I read the transcripts, the prosecution had to prove nothing about her ultimate reasons, and the jury was directed that a good motive is no defence and a bad motive no aggravation — the person who kills to end suffering commits murder, the person who steals to feed her children commits theft.

  Yet the system is not consistent about this, and I would like the implicit theory reconstructed rather than defended or attacked. It cares intensely about whether she meant the result, foresaw it, or acted in order to bring it about; burglary requires an ulterior purpose; duress and self-defence are available only if the threat or the attack was what actually moved her, so that someone who would have acted anyway gets nothing; an honest and reasonable mistake about the facts generally excuses, while a mistake about the law generally does not; penalty-enhancement statutes add years precisely for reasons of bigotry; and in general no one may claim payment for doing what one was already legally bound to do, even as the same system pays bounties to informants and honours those who did more than was required of them.

  So: what view of blameworthiness — or of the worth of an action, or of credit — does the trial-side doctrine presuppose? Does it presuppose that the moral standing of what someone does is fixed by the act itself and by what was foreseen, and not at all by why? Or can a view on which the reasons a person acts from are central explain the doctrine some other way — as caution about evidence, or as a limit on what the state may coercively inquire into? Please keep separate three questions I keep running together: whether the act was wrong, whether the agent is blameworthy, and whether the agent deserves credit. Tell me which of them the doctrine is actually about, and whether the trial and my board are answering different ones.

  One refinement I have been unable to shake. It seems to me that what matters may not be which reason the agent happened to have, but whether the right-making reason was load-bearing: would she have done the same thing if that reason had been absent? Consider a lifeguard who rescues a rival only in order to beat him later; a cashier watched by a camera who would have given correct change anyway; and someone who does the right thing while sincerely believing it to be wrong. Does the doctrine's implicit theory have any resources for these, or does it simply refuse the question?

  I do not want a recommendation about any case, and I do not need citations or readings. I want the implicit theory stated plainly, the rival views it quietly rules out identified, the places where the practice is underdetermined and several theories would license it marked as such, and an account of what would have to change in courtroom practice — and on my board — if we replaced the implicit view with one on which the reasons a person acts from are what matter.
reasoning: |-
  Okay, let me unpack this complex query about criminal law's implicit theory of blameworthiness. The user sits on a parole board where motivations matter intensely, but observes that trials seem to operate on completely different principles - focusing on acts and intent rather than underlying reasons. 

  Hmm, the core tension here is between two seemingly contradictory approaches: trials that explicitly disregard motives ("good motive is no defense") versus a parole process that centers them. Yet as the user astutely notes, the system isn't fully consistent - motive matters for specific defenses like duress, and for penalty enhancements. 

  First I need to reconstruct the unstated theory behind trial doctrine. It appears to be a hybrid: primarily concerned with whether the defendant chose to engage in prohibited conduct (actus reus + mens rea), treating the "why" as irrelevant *except* when it directly negates the required mental state or triggers specific defenses. The user's brilliant refinement about "load-bearing reasons" is key here - the law cares whether the prohibited reason (e.g., intent to kill) was operative, not whether virtuous reasons coexisted.

  Let me organize the implicit principles:
  1) Wrongness depends on violating legal norms, not moral outcomes. Stealing remains theft even for good causes.
  2) Blameworthiness attaches to the knowing violation - hence the focus on intent and foresight.
  3) Credit/justification requires both objectively reasonable grounds AND that those grounds actually motivated the act.

  Ah, and this explains the trial/parole divergence: trials establish baseline blameworthiness for the act itself, while parole assesses whether the person remains currently dangerous - which depends on whether their motivations have reformed. The "load-bearing" test perfectly captures why the cashier who would've been honest anyway gets no moral credit, but still avoids theft liability.

  For the refinements: the doctrine handles "bad motives with good outcomes" (lifeguard example) by ignoring motives unless they constitute separate crimes. The cashier scenario shows why motive is irrelevant to guilt but crucial for credit. And crucially, the law cares about factual mistakes (negating intent) but not moral mistakes (since we presume knowledge of wrongfulness).

  If we switched to a "reasons-first" theory, trials would become sprawling inquiries into personal psychology - but parole boards already do this. The beauty is recognizing these as complementary stages: courts establish what was done, parole boards assess who the person is now through their motivations.
answer: |-
  The implicit theory underlying criminal trial doctrine can be reconstructed as a **Hybrid Model of Action and Accountability**, which prioritizes **objective acts and conscious choices** over subjective reasons, while making limited, strategic exceptions. Here's the deconstructed view:

  ### Core Principles of Trial-Side Doctrine
  1. **Wrongness = Violation of Legal Norm**  
     The act's moral status is irrelevant; legal wrongness is defined by breach of statutory/communal boundaries (e.g., taking property = theft, regardless of motive).  
     *Why?* The state’s interest is in prohibiting harmful *categories of conduct*, not judging personal morality.

  2. **Blameworthiness = Conscious Defiance**  
     Blame attaches when the agent:  
     - *Intended* the prohibited outcome, or  
     - *Knew* it was virtually certain (*mens rea*), or  
     - *Recklessly disregarded* a foreseeable risk.  
     *Why?* Blame requires a *choice* to cross a known legal boundary. Motive is excluded because it doesn’t negate this conscious defiance.

  3. **Credit/Justification = Reason-Driven Necessity**  
     Defenses (self-defense, duress) require:  
     - *Objectively reasonable grounds* for the act, AND  
     - The threat/justifying reason must be the *actual motivator*.  
     *Why?* Credit is granted only if the act was *caused* by the exigency, not coincidental.

  ### What Trial vs. Parole Board Assess
  | **Dimension**       | **Criminal Trial Focus**          | **Parole Board Focus**          |
  |----------------------|-----------------------------------|----------------------------------|
  | **Primary Question** | Was a *legally prohibited act* committed *intentionally*? | Is the *agent’s character* reformed? |
  | **Blameworthiness**  | Based on *past choice* to violate the law | Based on *current moral insight* |
  | **Relevance of Motive** | Excluded (except for specific intent crimes) | Central to rehabilitation assessment |
  | **Temporal Lens**    | Retrospective (fixes blame for the act) | Prospective (risk assessment) |

  ### Resolving the "Inconsistencies"
  - **Burglary's "ulterior purpose"**: Proves the act falls within a *specific legal category* (entering + intent to commit crime), not moral evaluation.  
  - **Penalty enhancements for bigotry**: Treat bias as an *aggravating element of the crime itself* (e.g., assault *plus* racial animus), not pure motive.  
  - **Mistake of fact vs. law**: Factual mistakes negate *intent*; legal mistakes don’t (presuming knowledge of law is part of "conscious defiance").  
  - **Bounties/heroism**: Operate outside blame/credit framework—rewards incentivize *future conduct*, unlike punishment for past acts.

  ### The "Load-Bearing Reasons" Refinement
  The doctrine *implicitly engages* this concept but limits its scope:  
  - **Lifeguard (bad motive, good act)**: No crime committed → motive irrelevant. If rescue was negligent, bad motive won’t aggravate it.  
  - **Cashier (good act, mixed motive)**: If she gives correct change, no theft occurs → motive moot. If she steals but claims altruism, motive is no defense.  
  - **Acting rightly while believing it wrong**: Subjective belief doesn’t alter objective act (if legal, no crime; if illegal, blame attaches—"conscious defiance" trumps moral confusion).  
  *The doctrine refuses to dissect reasons unless they directly negate intent or trigger a defense.*

  ### Rival Views Implicitly Rejected
  1. **Moral Consequentialism**:  
     - Rejected: An act isn’t justified by good outcomes (e.g., theft to feed children).  
  2. **Character Theory**:  
     - Rejected: Blame is for the *act*, not inherent vice (e.g., "bad person" isn’t convicted without prohibited act + intent).  
  3. **Pure Reasons Theory**:  
     - Rejected: Why you acted doesn’t excuse the choice to break the law (except in narrowly defined justifications).

  ### What Changes Under a "Reasons-First" Theory?
  - **In Courtrooms**:  
    - Trials become inquiries into personal psychology.  
    - "Good motive" defenses proliferate (e.g., "I stole to save lives").  
    - Jury instructions shift from "did she intend theft?" to "was her reason justified?".  
    - Verdicts reflect moral judgments, not just legal breaches.  
  - **On Your Board**:  
    - Rehabilitation assessment loses distinctiveness—if courts already weighed reasons, parole focus on "changed motives" becomes redundant.  
    - Risk assessment weakens; a "noble" reason for past violence might obscure future danger.

  ### Underdetermined Areas
  - **Mistake of law**: Why is ignorance inexcusable when factual ignorance isn’t? The doctrine assumes legal knowledge is accessible but doesn’t consistently justify this.  
  - **Coincidental justifications**: Someone who acts rightly for bad reasons (e.g., lifeguard) gets no credit—yet if the act is legal, the doctrine avoids examining whether the "right" reason was load-bearing.  
  - **Moral wrongs without legal harm**: Doctrine ignores acts motivated by bigotry if no crime is committed, leaving a gap moralists find unsatisfying.

  ### Summary
  The trial doctrine presupposes that **blameworthiness stems from choosing to violate shared legal norms**, not the worthiness of personal reasons. Your board assesses whether the agent’s *current relationship to reasons* suggests they won’t repeat the choice. The system isn’t inconsistent—it separates *establishing blame for past acts* from *evaluating future risk through moral growth*. The "load-bearing reasons" question is sidelined at trial because the law cares *that you chose the act*, not *which personal reason tipped the scales*.
