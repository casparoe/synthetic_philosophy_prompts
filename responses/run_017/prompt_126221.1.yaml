answer: |-
  ### Joint Statement of Adversarial Collaboration: The Existence of Composite Objects

  **Preamble:**  
  This document records the agreed claims, disagreements, and predictions of two parties: the Dissolutionist (who holds the dispute is verbal) and the Realist (who holds it is substantive). The dispute concerns whether "composite material objects" (e.g., tables, organisms, or arbitrary sums like the Eiffel Tower + your left ear) exist in a strict sense. Both parties agree on all observations, arrangements of fundamental particles ("simples"), and scientific/practical claims. They disagree solely on whether "exists" applies to composites beyond simples arranged in specific ways. Technical terms:  
  - **Simples**: Fundamental particles with no proper parts.  
  - **Composites**: Objects with two or more simples as parts.  
  - **Arranged F-wise**: A primitive predicate (e.g., "arranged table-wise") describing how simples are configured.  
  - **Parthood**: A relation denoting "is part of."  
  - **Unrestricted composition**: The thesis that any collection of objects composes a further object.  
  - **Eliminability**: Removing a term (e.g., "composite") without loss of inferential/explanatory power.  
  - **Two-way translation**: Systematically rephrasing all claims in one vocabulary into the other’s, preserving logical/explanatory roles.  

  ---

  ### 1. Agreed Claims  
  Both parties affirm the following non-trivial claims:  

  1. **Common Ground on the World**:  
     - All observations (e.g., telescope readings, sensory experiences) and scientific claims (e.g., biological processes, chemical reactions) are fully explained by the distribution and behavior of **simples**.  
     - Every arrangement of simples (e.g., simples arranged table-wise, organism-wise) is agreed upon. No empirical test could distinguish the frameworks.  
     - Practical actions (e.g., "sitting at a table," "treating an infection") succeed regardless of whether composites exist.  

  2. **Criteria for Verbal Disputes**:  
     - A dispute is **merely verbal** if:  
       (a) The contested term (e.g., "composite object") can be *eliminated* without altering inferences/explanations.  
       (b) A *two-way translation* exists between the frameworks.  
       (c) After (a) and (b), only practical/linguistic preferences remain.  
     - A dispute is **substantive** if (a) or (b) fails, implying a fact about reality’s structure.  

  3. **Primitive Vocabularies and Commitments**:  
     | Framework | Primitives | Status of Exchange |  
     |-----------|------------|-------------------|  
     | **Dissolutionist** | Plural quantification ("there are some simples"), *arranged F-wise* predicates, parthood (restricted to simples). | Claims the Realist’s primitives are eliminable; exchange is **notational**. |  
     | **Realist** | Singular quantification ("there is a composite object"), unrestricted composition, parthood (applies to composites). | Claims *arranged F-wise* predicates are derivative; exchange is **substantive**. |  
     - Both agree that if the Realist’s primitives are eliminable via translation, the dispute is verbal; if not, it is substantive.  

  ---

  ### 2. Disagreements Table  
  Each row details a crux where disagreement persists.  

  | Crux | Dissolutionist’s Position | Realist’s Position | Shared Case/Argument | Dissolutionist’s Prediction | Realist’s Prediction | What Would Move Each |  
  |------|---------------------------|---------------------|----------------------|------------------------------|----------------------|----------------------|  
  | **1. Eliminability of Composites** | Composites are eliminable: talk of "tables" reduces to "simples arranged table-wise" with no loss of explanatory power. | Composites are ineliminable: they explain unity (e.g., why simples *together* form a single object). | **Case**: A statue and the clay composing it coincide spatially but differ in persistence (e.g., the statue is destroyed if molded into a ball; the clay persists). | The statue/clay difference is explained by changes in *arranged statue-wise* predicates over time, without composites. | The difference requires two distinct composite objects (statue and clay) sharing parts but having different properties. | **Dissolutionist**: Evidence that composites uniquely explain unity (e.g., irreducible causal powers of wholes). **Realist**: Evidence that *arranged F-wise* predicates fully replicate composite-talk. |  
  | **2. Two-Way Translation** | Translation is possible: Realist’s "composite exists" maps to "simples are arranged F-wise," preserving all inferences. | Translation fails: "Composite exists" captures a mind-independent unity absent from arrangements. | **Case**: Biological organisms (e.g., an ant) exhibit goal-directed behavior (e.g., foraging). | "The ant forages" translates to "simples arranged ant-wise exhibit foraging-wise motion," preserving explanatory role. | "The ant forages" refers to the composite’s agency; arrangement-based translations lose the ant’s *singular causal role*. | **Dissolutionist**: A manual translating every Realist claim into arrangement-predicates. **Realist**: An inference (e.g., "The ant exists → it has spatial boundaries") that lacks arrangement-predicate equivalent. |  
  | **3. Nature of Existence** | "Exists" is language-relative: "Composites exist" is true in Realist’s idiolect but not Dissolutionist’s. Both are "correct" relative to their language. | "Exists" is world-focused: Reality’s structure fixes whether composites exist, independent of language. | **Case**: The sentence "There is a table" in a room with simples arranged table-wise. | The sentence is true in Realist’s language, false in Dissolutionist’s. No further fact settles it. | The sentence is true/false based on whether reality contains composites—a fact beyond language. | **Dissolutionist**: Proof that "exists" lacks a language-independent referent. **Realist**: Proof that language tracks reality’s structure. |  

  ---

  ### 3. Held-Out Case: The Outage  
  **Scenario**: During a 90-minute service outage, machines, processes, and logs were non-functional. Both grant these components exist, but disagree on whether "the service" (the thing that was down) is a composite object and whether "the outage lasted 90 minutes" requires it.  

  | Party | Prediction of Other’s View | Prediction of Agreed Criteria (Sec. 1) |  
  |-------|----------------------------|----------------------------------------|  
  | **Dissolutionist** | Realist will call "the service" a composite object and say the duration claim requires it. | Criteria show "service" is eliminable (e.g., "machines/processes arranged service-wise were down for 90 minutes"). Translation succeeds → dispute is **verbal**. |  
  | **Realist** | Dissolutionist will deny "the service" is an object and say duration claims don’t require it. | Criteria show "service" is ineliminable (e.g., outage duration depends on the service’s identity as a unified entity). Translation fails → dispute is **substantive**. |  

  *After discussion, both parties will apply the criteria from Section 1 to this case and add their conclusions to the record.*  

  ---

  ### 4. Closing Section  
  The collaboration concludes:  
  - **Verbal Elements**: The dispute is **merely verbal** if (1) composites are eliminable and (2) two-way translation is possible. The Dissolutionist affirms both; the Realist denies both.  
  - **Substantive Survival**: If translation fails (per the Realist), a substantive question remains: *Does reality include composite objects as fundamental unities?*  
  - **Status of Framework Choice**:  
    - If the dispute is verbal, choosing a framework is **practical** (e.g., simplicity, convenience).  
    - If substantive, the choice is **truth-evaluable** (i.e., one framework correctly describes reality’s structure).  
    - The Realist may call the framework choice "substantive" if it answers a question about mind-independent structure.  

  **Outcome**: The core disagreement reduces to whether the criteria in Claim 2 (eliminability/translation) are satisfied. This surviving question is **truth-evaluable** (both agree), but parties diverge on whether it concerns language (Dissolutionist) or reality (Realist).  

  ---  
  **Signed**,  
  [Name of Dissolutionist], [Date]  
  [Name of Realist], [Date]
