  Below is a complete, runnable activity designed to meet your goals. It uses physical props (urns/boxes, colored balls) for tangibility, but can be adapted with cards or digital tools. The timeline fits a 90-minute slot, with built-in flexibility.

  ---

  ### **Materials & Setup**
  - **Urns/Boxes:**
    - **Part 1:** Two urns (or one urn with two info conditions):  
      - **Group K (sharp):** 10 balls (5 red, 5 blue).  
      - **Group U (imprecise):** 10 balls (5 red, 5 blue).  
      *Why same composition?* Both groups face identical underlying uncertainty (true P(red)=0.5), but different *information* creates different credences.  
    - **Part 3:** Two boxes (50 balls each) from a 100-ball urn (50 red, 50 blue). Ensure neither box has >30 red balls (i.e., 20–30 red each).  
  - **Info Cards:**  
    - **Group K:** "A fair coin flip chose between 4 red or 6 red balls (out of 10)."  
    - **Group U:** "This urn has 4, 5, or 6 red balls (out of 10). No other info."  
  - **Betting Tickets:** Paper slips for "buy/sell/pass" decisions.  
  - **Points:** Start all students at 0 points. Payouts:  
    - **Part 1:** Ticket pays **+100 pts if red, 0 if blue** (price paid/received varies).  
    - **Part 2:** Bets X/Y: **±10/14 pts** (see rules below).  
    - **Part 3:** No payout (conceptual).  
  - **Top Scorer:** Chocolate bar for highest points after all parts.  

  ---

  ### **Timeline (90 min total)**
  1. **Intro (5 min):** Explain rules, points, and chocolate incentive. Stress: "Decisions affect points; we’ll resolve draws at the end."  
  2. **Part 1: Sharp vs. Imprecise Credences (25 min)**  
     - Split class: 7 in Group K, 7 in Group U. Give info cards.  
     - **Task:** Walk ticket prices from 30 to 70 pts (in 5-pt increments: 30,35,...,70). At each price, students **privately** write:  
       - **BUY** (pay price, get 100 if red),  
       - **SELL** (receive price, pay 100 if red),  
       - **PASS** (no action).  
     - **Data Collection:** Use **private slips** (not show of hands) to avoid contagion. Collect slips after all prices.  
     - **Expected Result:**  
       - Group K: Sharp switch at 50 (buy <50, sell >50).  
       - Group U: Wide PASS band (≈40–60).  
     - *Tip:* Pause 15 sec/price. Afterward, tally results on the board.  
  3. **Part 2: Menu Dependence & Free Money (25 min)**  
     - Recombine class. All now have **imprecise credence [0.4, 0.6]** (ignore prior groups).  
     - Split into **Condition A** (sequential) and **Condition B** (simultaneous):  
       - **Condition A (Sequential):**  
         1. Offer **Bet X** alone: "Pays **–10 if red, +14 if blue**. Take or leave?"  
         2. Offer **Bet Y** alone: "Pays **+14 if red, –10 if blue**. Take or leave?"  
         3. *Then* ask: "Now, if offered **both bets together**, would you take them?"  
       - **Condition B (Simultaneous):**  
         - Offer full menu: "Choose any subset of:  
           - Bet X (–10 if red, +14 if blue)  
           - Bet Y (+14 if red, –10 if blue)"  
     - **Payout:** Resolve after decisions (draw from U’s urn).  
     - **Expected Result:**  
       - Condition A: Rejects X and Y individually, accepts pair when offered.  
       - Condition B: Takes both bets together.  
  4. **Part 3: Conditioning & Loss of Precision (10 min)**  
     - **Setup:** Explain: 100 balls (50 red/50 blue) split into two 50-ball boxes. Guarantee: No box >30 red (i.e., 40–60% red).  
     - **Draw:** Fair coin picks box, then random ball from box.  
     - **Task:** "Unconditional P(red) = 0.5 (sharp). I’ll tell you which box for **free**. Do you want to know? Why/why not?"  
     - **Reveal:** If "yes," announce box (simulate: e.g., "Box 1"). Then ask: "Now, what’s P(red)?"  
     - **Expected Result:** Students decline info to avoid dilation to [0.4, 0.6].  
  5. **Debrief (25 min)**  
     - **Map to Key Points:**  
       | **Activity Moment**      | **Philosophical Point**                                                                 | **Resistance & Cost**                                                                 |  
       |--------------------------|-----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------|  
       | Part 1: PASS band (U)    | Imprecision = behavioral indecision. Not "feeling unsure" (K feels same but acts sharply). | Resist by forcing action (e.g., midpoint). Cost: Vulnerability to Dutch books.        |  
       | Part 2: Rejected bets (A)| Cautious rule (maxmin) avoids loss but misses sure gains (X+Y = +4 pts). Menu-dependent. | Resist by accepting "good enough" bets. Cost: Possible loss if probabilities are extreme. |  
       | Part 3: Declined info    | Learning *increases* imprecision (dilation). Free info can be harmful.                  | Resist by always conditioning. Cost: Unavoidable dilation in some cases.              |  
     - **Contrast with Dutch Book:**  
       - Sharp credences: Failure = sure loss (incoherence).  
       - Imprecise credences: Failure = missed opportunities (overcautiousness).  
     - **Q&A:** Address predictables (see below).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"This is just ambiguity aversion!"**  
     - **Control:** Before Part 1, run a **3-min warm-up**:  
       - "Bet on fair coin (P(heads)=0.5): Buy/sell at 40, 50, 60 pts."  
       - Then: "Bet on unknown urn (P(red)=?): Same prices."  
     - **Debrief Contrast:** If aversion, both ambiguous bets show PASS bands. If imprecision, only Group U does (Group K acts sharply). Clarify: "Imprecision is a normative response to sparse evidence—not just psychology."  
     - *Tip:* Pre-load Group K’s urn with the coin flip to emphasize symmetry.  

  2. **"Just use the midpoint!"**  
     - **Reply:** "Suppose your credence is [0, 1] (total ignorance). Would you buy a ticket for 50 pts? Midpoint says yes. But if P(red)=0, you lose 50. The cautious rule avoids this."  
     - **Cost:** Using midpoint risks exploitation (e.g., if true probability is extreme).  

  3. **"This is a confidence interval!"**  
     - **Reply:** "Confidence intervals are *frequentist* (about long-run sampling). This is *epistemic* (about your belief given evidence). Example: 'The urn has 4–6 red' describes your ignorance, not sampling error."  
     - **Clarify:** In Part 1, Group U’s interval isn’t a statistical estimate—it’s a set of *compatible* probabilities.  

  4. **Sourcing Intervals from Sparse Evidence:**  
     - **Not fatal—use it!** In debrief: "The interval reflects *indeterminacy* from incomplete evidence. Real imprecision arises when evidence doesn’t pin down a probability (e.g., conflicting experts, vague data)."  
     - **Stress:** The key isn’t *why* the interval exists, but how it *behaves*.  

  ---

  ### **What the Game Can’t Deliver**  
  - **Interval Formation:** Students won’t *derive* intervals from evidence. This requires lecture content (e.g., lower/upper probabilities via Dempster-Shafer, sets of priors).  
  - **Updating Rules:** Part 3 shows dilation, but not *how* to update (e.g., generalized Bayes). Cover in post-activity theory.  
  - **Normative Justification:** The activity *shows* behaviors, but you must *argue* why imprecision is rational (e.g., avoiding arbitrariness, representing ignorance).  

  ---

  ### **Rules & Payouts Summary**  
  - **Part 1:**  
    - Ticket pays **+100 if red, 0 if blue**.  
    - Points:  
      - **BUY at P:** `(100 - P) if red, (-P) if blue`  
      - **SELL at P:** `(P - 100) if red, P if blue`  
  - **Part 2:**  
    - **Bet X:** `–10 if red, +14 if blue`  
    - **Bet Y:** `+14 if red, –10 if blue`  
    - **Both bets:** `+4 always`  
    - Points: Sum of accepted bets.  
  - **Resolution:** Draw balls at end of class (from Part 1 urns).  

  ---

  ### **Final Tips**  
  - **Run Smoothly:** Assign a student to tally points. Use pre-filled urn/boxes to save time.  
  - **Emphasize Behavior:** In debrief, repeat: "Imprecision isn’t a feeling—it’s what you *do* when offered a bet."  
  - **Lean into Resistance:** If students resist the PASS band, say: "What if you *had* to bet? What price would you pick? Why that one? What if you’re wrong?"  
  - **Name Dilation:** Call Part 3 "**dilation**" (from Seidenfeld & Wasserman, 1993) in debrief.  

  This design forces students to *experience* the core phenomena—indecision, missed gains, and dilation—before labeling them. The points/chocolate incentive ensures engagement, while private slips minimize peer influence.
