answer: |-
  Here's a comprehensive exam question package designed to push students beyond superficial answers, force conceptual disentanglement, and engage with your core concerns about the nature of standing and the test case:

  **Exam Question:**

  "Critics who are themselves guilty of the very wrong they condemn are often accused of lacking the 'standing to blame.' It is frequently claimed that hypocrisy undermines standing because the hypocrite fails to hold themselves to the norm they invoke. However, critics might respond in several distinct ways: they might deny the alleged wrongdoing occurred; they might argue that their own past actions are irrelevant to whether the current criticism is valid; or they might concede hypocrisy as an additional fault but insist it doesn't negate the original criticism.

  1.  **Define and Distinguish:** Precisely define what is meant by 'standing to blame' in the context of moral criticism. How is a claim that someone *lacks standing* conceptually distinct from (a) denying that the criticized act was actually wrong, and (b) merely adding a separate accusation of hypocrisy against the critic?
  2.  **The Core Dispute:** What is the *fundamental disagreement* between these two views?
      *   **View 1:** Hypocrisy undermines standing because it involves a *normative failure* by the blamer – perhaps a violation of a fairness condition, an abuse of a moral right or authority, or rendering them morally unworthy to blame.
      *   **View 2:** Accusations of hypocrisy relevant to standing are primarily *epistemic or heuristic* – they signal that the blamer is likely an unreliable, biased, or self-serving judge about *whether a wrong occurred in this specific instance* or about the appropriate weight of the norm, not that they lack a normative 'power' to blame.
  3.  **The Test Case & Your Argument:** Consider this scenario:
      > A small workplace has a serious problem with Norm Violation (NV). *A* committed NV two years ago, was formally sanctioned, expressed sincere remorse, underwent training, and has demonstrably not repeated the behavior since – they seem genuinely reformed. *B* has never committed NV, but solely because the opportunity never arose; private communications and past behavior strongly suggest *B* would readily commit NV if the chance appeared. *A* is the *only* person willing to publicly blame the Boss for recently committing NV. *B* remains silent.
      >
      > Discuss: Does *A* or *B* have greater standing to blame the Boss for NV? Or do neither have standing? Justify your answer rigorously.
      **Defend a clear position** on who has greater standing (or whether neither does) in this case. Crucially, **your argument must explicitly engage with the fundamental disagreement (View 1 vs. View 2) outlined above.** Explain *why* the view you favor better accounts for the intuitions raised by this case, particularly why one person might be seen as a more credible or legitimate critic than the other despite their histories. What does this case reveal about what 'standing' must fundamentally *be* for claims about it to do substantive work rather than simply derailing criticism?
  4.  **Strongest Counterargument:** Acknowledge and fairly state the strongest argument *against* your position regarding standing in this test case. Briefly explain why, ultimately, you find your own position more compelling despite this counterargument.

  Your answer should present a coherent, argued position, not merely a survey of possibilities. Focus on conceptual clarity and argumentative rigor."

  ---

  **Model Answer (Approx. 980 words):**

  **(1) Defining Standing and Distinguishing Claims:**
  Standing to blame refers to the *moral legitimacy* or *authority* one possesses to level a blameworthy judgment against another for a specific wrong. It concerns whether *this particular person* is positioned appropriately to issue *this specific criticism*, irrespective of whether the underlying act was indeed wrong. Claiming someone lacks standing is distinct from:

  *   **(a) Denying the Wrong:** Denying the Boss committed NV argues that the *foundation* of the blame-attempt is false. It targets the act itself. A standing claim ("*You* can't blame them!") implicitly *grants* (for the sake of argument) that the act might be wrong but attacks the critic's *right* or *fitness* to be the one making that accusation. It shifts focus from the accused to the accuser.
  *   **(b) Adding Hypocrisy:** Accusing the critic of hypocrisy ("You did it too!") points out an *additional moral failing* (inconsistency) *in the critic*. It adds a *separate* complaint. A standing claim using hypocrisy argues that this inconsistency *nullifies* or *undermines* the critic's very legitimacy to level the *original* criticism against the Boss, rendering their blame morally inoperative or inappropriate, regardless of its truth.

  **(2) The Fundamental Dispute: Normative Failure vs. Epistemic Signal:**
  The core disagreement lies in *what work* the hypocrite's inconsistency does in undermining standing.

  *   **View 1 (Normative Failure):** This view holds hypocrisy constitutes a *direct normative flaw* in the act of blaming itself. By violating the norm they invoke, the hypocrite might: forfeit a moral *right* to demand compliance from others; act *unfairly* by holding others to standards they flout, violating a reciprocity condition; or demonstrate a moral *unworthiness* or lack of *authority* that invalidates their standing. The failure is intrinsic to the relational or deontic structure of blaming. Standing is a normative power one can lose through one's own misdeeds.
  *   **View 2 (Epistemic/Heuristic Signal):** This view sees hypocrisy primarily as a *warning signal* about the blamer's judgment and motives in *this instance*. The inconsistency suggests the blamer might be: insincere; applying the norm selectively or self-servingly; misapplying the norm's severity or scope; or motivated by factors other than upholding the norm (e.g., personal vendetta, positioning). It casts doubt on the *reliability* and *good faith* of *this specific act* of blaming, implying the criticism might be misplaced or disproportionate, even if the underlying act (Boss's NV) is wrong. Standing isn't a power lost, but the critic's credibility is damaged, making their blame practically ineffective or rationally suspect.

  **(3) Argument: A Has Greater Standing – The Epistemic View Illuminates the Test Case**
  In the test case, **A has significantly greater standing to blame the Boss than B.** Neither is perfect, but A's history, paradoxically, *enhances* rather than destroys their standing, while B's silence and hypothetical willingness *undermine* theirs. The epistemic/heuristic view (View 2) best explains this counterintuitive result and reveals standing's core function.

  *   **A's Standing (Reformed):** A's past NV and subsequent reform are crucial. Their firsthand experience with NV provides *deep, practical understanding* of the norm, its violation, the motivations, the consequences, and the difficulty of compliance. Their genuine remorse and sustained reform demonstrate a *serious commitment* to the norm's validity – they didn't just pay lip service; they changed their behavior at personal cost. When A blames the Boss, this history signals that their criticism is likely grounded in a *principled understanding* of the norm and a *sincere desire* to uphold it in the workplace. They speak from hard-won insight, not abstract theory. While their past is inconsistent, their *current trajectory and commitment* make them a *credible interpreter and enforcer* of the norm *now*. Their blame carries weight because it reflects lived understanding and demonstrable commitment.
  *   **B's Lack of Standing (Silent & Willing):** B's "clean hands" are purely circumstantial. Their known willingness to commit NV if given the chance reveals a *fundamental rejection or instrumentalization* of the norm. They don't value it intrinsically; they merely avoid it when inconvenient or risky. Their silence in the face of the Boss's NV confirms this lack of genuine commitment. If B *were* to blame the Boss, their criticism would ring hollow. The inconsistency wouldn't be between past action and present blame, but between their *underlying attitude* and the *content* of their blame. Their blame would likely be perceived (and rightly so) as opportunistic, self-serving (e.g., currying favor, attacking a rival), or simply dishonest. They lack credibility *because their actions and known disposition signal they don't truly endorse the norm they'd be invoking*. Their hypothetical inconsistency is a powerful epistemic signal of unreliability and bad faith in *any* act of blaming related to NV.
  *   **Why Epistemic View Wins Here:** View 1 (Normative Failure) struggles. If standing requires "clean hands" or never violating the norm, neither A nor B qualifies. If it requires currently upholding the norm, A (reformed) arguably does, while B (willing to violate) does not. But View 1 often focuses on *past acts* as disqualifying, which would unfairly penalize A's reform. View 2, however, focuses on the *signal sent by the total context* about the blamer's *current reliability and motives*. A's history, *because of the reform*, signals credibility and commitment. B's history (inaction + known willingness) signals hypocrisy of *character* and unreliability. Standing, therefore, is fundamentally about the *credibility and appropriateness of the critic as a source of this specific moral demand in this context*. It's about whether their blame is likely to be a trustworthy application of the shared norm, not an abstract normative power divorced from character and context. A's blame is trustworthy; B's would not be. This case shows that "standing" functions primarily as an assessment of the critic's *epistemic and motivational fitness* to levy *this* charge effectively and legitimately, making View 2 far more compelling.

  **(4) Strongest Counterargument & Rebuttal:**
  **Counterargument (from View 1 - Fairness):** The strongest objection is that A, having committed NV, fundamentally lacks the *fairness* required to blame others for it. Blaming involves demanding adherence to a standard. By violating that standard themselves (even in the past), A acts unfairly by imposing a demand on others that they themselves failed to meet, violating a basic condition of reciprocal moral address. Their reform, while commendable, doesn't erase the past unfairness of their act relative to others who complied. Granting A standing condones this unfairness and weakens the normative force of the demand. Only those with consistently clean hands, like someone who *actively resisted* NV opportunities, possess the pure standing demanded by fairness.

  **Rebuttal:** While the fairness intuition is powerful, it misapplies reciprocity. Reciprocal moral address requires that the *blamer is currently committed to the norm they invoke* and holds *themselves* to it *now*. A meets this condition through demonstrable reform and commitment. B does not. Holding a *past* violation, especially one acknowledged and rectified, as a perpetual disqualifier is excessively punitive and ignores moral growth. It also ignores context: A is the *only* critic. Denying standing based on reformed past failings effectively silences the sole voice against the Boss's *current* wrong, protecting the wrongdoer – a perverse outcome. The epistemic view captures the relevant fairness: it's unfair to others to lend credence to a blamer (like B) whose criticism is likely insincere or self-serving. A's blame, grounded in understanding and commitment, is fairer *in its substance and likely impact* than silence or the unreliable blame B might offer. The fairness condition is better served by assessing current commitment and credibility (View 2) than by a rigid, backward-looking "clean hands" test (View 1).

  ---

  **Marking Scheme (Total: 25 Marks)**

  *   **A Grade (21-25):** Demonstrates sophisticated understanding by hitting **all** must-hit points. Crucially, **explicitly, correctly, and substantively engages the View 1 vs. View 2 distinction in analyzing the test case (5 marks)**. Clearly defines standing and distinguishes claims (4 marks). Takes a clear, defensible position on the test case (3 marks). Provides a robust argument *for that position* using the test case details and linking it convincingly to the chosen view (View 1 or 2) of standing's nature (5 marks). Identifies and articulates the *strongest* counterargument fairly (3 marks). Provides a compelling rebuttal addressing the core of that counterargument (3 marks). Writing is clear, concise, and well-structured (2 marks).
  *   **B Grade (16-20):** Good answer but missing the **crucial A-grade move** or significantly weakening it. Usually botches **Point 3 (Using View 1/2 in Test Case Analysis)** in one of these ways: Mentions the views but doesn't *substantively apply* them to explain *why* A or B has standing/lacks it; Mischaracterizes View 1 or View 2; Applies the views superficially without linking to the specific test case details (A's reform, B's silence/willingness). Otherwise competent: Defines standing and distinguishes claims reasonably well (3-4 marks). Takes a position on the test case (2-3 marks). Provides an argument, but may rely on intuition or "clean hands" without deep engagement with the core dispute (3-4 marks). Identifies a counterargument, though maybe not the strongest (2 marks). Offers a rebuttal, but may not fully engage the counterargument's force (2 marks). Structure is adequate (1-2 marks).
  *   **C Grade (11-15):** Superficial or confused. **Fails to properly distinguish View 1 and View 2** or **ignores their relevance to the test case analysis**. May conflate standing with denying the wrong or just adding hypocrisy. Definition of standing is weak or absent (1-2 marks). Position on the test case is stated but poorly defended or inconsistent (1-2 marks). Argument relies heavily on clichés ("hypocrites can't blame") without probing deeper (1-2 marks). Counterargument is weak, missing, or misrepresented (0-1 mark). Rebuttal is absent or inadequate (0-1 mark). Structure is poor. May ignore key elements of the test case (B's willingness, A's reform).
  *   **D Grade (6-10):** Demonstrates minimal understanding. **Fundamentally misrepresents standing, hypocrisy, or the test case.** Fails to engage with the core conceptual dispute. Argument is absent or incoherent. Significant omissions.
  *   **F Grade (0-5):** Wholly inadequate, off-topic, or demonstrates a serious failure to comprehend the question or core concepts.

  **Key A vs. B Differentiator:** The **explicit, correct, and substantive application of the View 1 vs. View 2 distinction to analyze *why* A or B has standing/lacks it in the test case** (worth 5 marks). The A-grade answer uses this distinction as the *engine* of their argument. The B-grade answer mentions it but doesn't *leverage* it effectively to crack open the test case paradox. Answers that don't engage this distinction at all cannot score higher than a B-, regardless of other merits.
