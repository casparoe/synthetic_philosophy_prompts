prompt: |-
  You are a professional philosopher who works at the intersection of rational choice theory, collective action, and democratic theory, and who is comfortable doing the relevant arithmetic rather than gesturing at it: pivot probabilities under uncertainty, expected value when probabilities are very small, and the difference between a vote that flips a discrete outcome and a vote that nudges a continuous margin. Please think carefully and do genuine brainstorming before you commit: I would rather see four or five candidate principles sketched, tested, and mostly discarded than one principle defended from the start. Work step by step, and show the arithmetic where the arithmetic is what decides the case.

  I help run a small nonpartisan turnout campaign. Every election cycle I have to defend, out loud, a line about when people really ought to vote and when it is genuinely fine not to, and about whether we should keep urging people to the polls when they have not followed the campaign at all. I want something I can actually use in that argument: a principle, not a slogan. I should say up front that I have no library and no web access, so please do not give me citations, names to look up, or reading suggestions. Give me the argument itself, and where a number matters, give me the number and how you got it.

  Here are my verdicts, given as honestly as I can. Where I have a verdict and a feeling that come apart, I say so.

  1. A national election. I live in a state that has gone the same way by twenty points or more for a decade, and the polls agree. Voting costs me a two-hour round trip on a workday; there is no mail ballot. The stakes are a national government. My verdict: skipping is fine. I do not think I have done anything wrong, and I would not criticize anyone in my position who skipped. I usually do vote anyway, out of habit, but I cannot reconstruct an argument that I must.

  2. The same national election, but I live in a state the polls have at within half a point, eight million voters, and the polling place is a twenty-minute walk. My verdict: I should vote, clearly, and someone in my position who skipped for no reason has done something mildly wrong.

  3. My condo association, sixty owners, mailed ballot, five minutes to fill in. The question is a one-hundred-and-eighty-thousand-dollar roof assessment, about three thousand dollars each. My verdict: I should vote, obviously, and abstaining out of laziness really is a small moral failing.

  4. The national election again, in my safe state, but a small party is polling at four-point-six percent nationally and needs five percent to keep its public funding and its ballot line. My vote cannot affect who wins. My verdict: voting feels like it has a real point here in a way it does not in case 1, and I would encourage people to vote for that reason. I know the chance my one ballot moves a national total across a line is microscopic. I cannot explain why this feels different from case 1, but it does.

  5. A city election, forty thousand voters. Candidate A will certainly win, but the city charter sends the race to a runoff if A finishes under forty percent, and A is polling at forty-one. I would like a runoff. My verdict: I would vote and I would drive across town to do it. This feels more like case 2 than like case 1, even though I am not trying to change who wins.

  6. My brother has followed nothing this year. He cannot name a single policy difference between the candidates and would pick essentially at random. The election is competitive and he lives ten minutes from a polling place. My verdict: he has no duty to vote, and I think he has some reason to stay home; but if he does vote, I would not blame him, and I would never say so to his face. My campaign's official line is that everyone should vote, and I have started to suspect the official line is false.

  7. An election abroad that is decided in advance, where the tally is nevertheless counted and published and is read by outside observers as a measure of how much opposition there is. Voting carries a small risk of being photographed at the polling station. My verdict: I would still vote, and I would accept the risk. The published number seems to be doing real work even though the outcome is fixed.

  8. I am living abroad during a close, high-stakes election at home. Getting a ballot notarized and couriered costs about one hundred and fifty dollars and several hours. My verdict: I would do it myself, but I would not criticize anyone who did not, and I do not think the state should have made the choice that expensive.

  The pair I keep going back and forth on is 1 and 4. Both are safe-state votes in an election whose outcome my ballot will not change; the probability that my ballot crosses a national five-percent threshold cannot be larger than the probability that it breaks a tie in my own state, and is probably smaller. Yet I treat one as optional and the other as worth encouraging. My tentative principle, which I do not trust, is that I should vote just in case my expected effect on what happens — counting both the chance of flipping a result and the expected effect on the recorded margin or on any threshold the margin crosses, neither of which is ever exactly zero — exceeds the cost to me of voting. I notice that this principle seems to make case 1 mandatory too, which my verdict rejects, so I want it repaired or replaced.

  Please do the following.

  First, brainstorm at least four candidate principles that someone in this area would take seriously — an expected-value instrumentalist one, a duty-based or cooperative-scheme one, an expressive one, and at least one built around the margin or threshold channel — and say in a sentence or two what each does with cases 1 and 4.

  Second, give me the principle you would defend, stated as numbered clauses, each with the case that motivates it and the case it is there to handle. I want to be able to recite it to a volunteer.

  Third, apply it to three cases I have not given a verdict on, showing the arithmetic where it bears. (a) My city is piloting a lottery system: after the polls close, one ballot is drawn at random from all ballots cast and the winner is whichever candidate that ballot names. Does voting matter more or less under this system than under majority rule, and does your principle say something different from what my gut says? (b) A union certification vote at a workplace with eight hundred members: the union is recognized only if a majority of those voting vote yes and turnout is at least half the membership. I oppose the union, the yes side is expected to run about sixty percent among voters, and turnout is expected around forty-eight percent. Should I vote no, vote yes, or abstain, and what does your principle say about the reason to vote at all? (c) A close, high-stakes election where voting means losing a shift that costs me one hundred and ninety dollars and counts against me with my employer.

  Fourth, tell me which of my eight verdicts your principle forces me to give up. I expect at least one has to go. Also tell me what the best principle that saves all eight would look like and what it would cost me in complexity or in independent plausibility.

  Fifth, say what your principle cannot settle: the places where it hands the decision back to me and I simply have to choose, and one sentence on what our campaign should say to people who have not followed the race at all.

  Aim for about a thousand to fourteen hundred words, structured under those five headings.
reasoning: |-
  Okay, let me tackle this query methodically. The user is running a nonpartisan turnout campaign and needs a defensible principle for when voting is morally required. They've provided eight detailed cases with intuitive verdicts, and they're particularly struggling with the apparent inconsistency between cases 1 and 4 - both safe-state votes where the ballot won't change the outcome, yet they feel differently about them.

  First, I need to brainstorm candidate principles that could explain these intuitions. As a philosopher specializing in rational choice and collective action, I'll consider:
  1) An expected-value instrumentalist approach calculating probability times impact minus cost
  2) A duty-based view focusing on cooperative schemes
  3) An expressive theory about symbolic communication
  4) A margin/aggregate-effects model emphasizing thresholds and signals

  For each, I'll test against cases 1 and 4. The expected-value model fails because it can't justify case 4's microscopic probability mattering more than case 1's. Duty-based views struggle with case 6 (the uninformed brother). Expressive theories have trouble with case 7's risk calculation. The margin/threshold approach shows promise but needs refinement.

  Next, I'll construct a multi-clause principle that captures the key insights:
  - Clause for discrete pivots (case 2)
  - Clause for thresholds near critical points (cases 4,5)
  - Clause for aggregate signals (case 7)
  - Cost exemptions (cases 1,8)
  - An epistemic condition (case 6)

  The principle must handle new cases: 
  a) Lottery voting system - here the instrumental value actually increases due to higher pivot probability
  b) Union certification - requires calculating how a no vote affects both majority and turnout thresholds
  c) High-cost voting - shows where cost trumps duty

  Applying this principle means surrendering the intuition in case 1 that skipping is blameless - the principle shows a weak duty exists but is overridden by cost. To save all eight verdicts would require an implausibly complex set of exceptions.

  Finally, the principle leaves unsettled how uninformed voters should decide (case 6) - our campaign should encourage voting but with guidance to minimize harm. The core insight is that voting matters not just for outcomes but for legitimacy signals and threshold effects, even when pivot probabilities vanish.
answer: |-
  ### Candidate Principles Brainstorm
  1. **Expected Value Instrumentalism**: Vote when \( p \times B > C \), where \( p \) is pivot probability, \( B \) is benefit of preferred outcome, and \( C \) is cost.  
     - *Case 1*: \( p \approx 10^{-8} \) (odds of tying in 8M-voter state), \( B \) = high (national stakes), \( C \) = 2 hours → \( pB < C \) → skip is rational.  
     - *Case 4*: \( p \approx 10^{-9} \) (shifting national share by 0.0000125%), \( B \) = moderate (funding for small party), \( C \) low → \( pB \ll C \) → skip. **Fails case 4 intuition.**  

  2. **Cooperative Duty**: Vote if you benefit from the voting system and your participation is needed for legitimacy or fairness.  
     - *Case 1*: Safe state; outcome unaffected → no duty to skip.  
     - *Case 4*: Thresholds create collective action problem; voting supports system integrity → duty to vote. **Matches both.**  

  3. **Expressive Voting**: Vote to affirm identity/solidarity or send a signal, regardless of impact.  
     - *Case 1*: Low signaling value (outcome fixed) → skip.  
     - *Case 4*: High signaling (support for minor party) → vote. **Matches both but overextends (e.g., might urge voting in all cases).**  

  4. **Margin/Threshold Amplification**: Vote if your ballot affects *any* socially salient threshold (e.g., funding, runoff, legitimacy signals), with weight proportional to threshold proximity.  
     - *Case 1*: No threshold near margin → skip.  
     - *Case 4*: 5% threshold nationally salient → vote. **Matches both; explains case 5–7.**  

  ---

  ### Defended Principle: "Threshold-Sensitive Duty"  
  **Clause 1**: *Vote if the election outcome is sufficiently close that your ballot has non-negligible pivot probability (\( p > 10^{-6} \)).*  
  - **Motivation**: Case 2 (competitive state). \( p \approx 1/(\sqrt{2\pi \cdot 8e6}) \approx 10^{-5} \) for tie. \( B \) (national stakes) >> \( C \) (20 min walk) → duty.  
  - **Handles**: High-stakes, discrete outcomes.  

  **Clause 2**: *Vote if your ballot contributes to a continuous margin crossing a socially decisive threshold (e.g., funding, runoff, legitimacy), and the threshold is within 2 standard deviations of expected results.*  
  - **Motivation**: Cases 4–5,7. In case 4, 5% threshold is "close" if polling is 4.6% (SD ≈ 0.1% nationally; 2SD = 0.2%). Your vote nudges margin by ≈0.0000125%, but collective effect matters.  
  - **Handles**: Threshold effects beyond winner-take-all.  

  **Clause 3**: *Abstain if voting costs exceed 1% of annual income or 4 hours of time, unless Clauses 1–2 apply strongly.*  
  - **Motivation**: Cases 1,8. Cost in case 1 (2 hours + work disruption) vs. low impact; case 8 ($150 ≈ 1–2% median income).  
  - **Handles**: Cost-benefit fairness.  

  **Clause 4**: *Abstain if you lack minimal knowledge to vote competently (cannot name one policy difference), unless the election affects you directly (e.g., condo association).*  
  - **Motivation**: Case 6. Uninformed voting injects noise; condo vote (case 3) is self-interested.  
  - **Handles**: Epistemic responsibility.  

  ---

  ### Application to New Cases  
  **(a) City Election with Lottery System**  
  - *Gut feeling*: Voting matters less (random winner).  
  - *Principle*: **Voting matters MORE**. Pivot probability \( p = 1/N \) (e.g., 1/40,000 = 2.5 \times 10^{-5} \)) vs. typical tie probability ~\( 10^{-5} \) in similar-sized election. Higher \( p \) amplifies duty under Clause 1.  
  - *Arithmetic*: \( p_{lottery} = 1/N \); \( p_{tie} \approx 1/(\sigma\sqrt{2\pi}) \). For \( N=40,000 \), \( \sigma \approx \sqrt{Npq} \approx 100 \), so \( p_{tie} \approx 10^{-5} \). \( p_{lottery} > p_{tie} \) → stronger reason to vote.  

  **(b) Union Certification Vote**  
  - *Setup*: 800 members. Turnout threshold: 400 votes. Yes expected: 60% of voters. Expected turnout: 384 (48%).  
  - *Principle*: **Vote NO**. Clause 2 applies: turnout threshold (400) is near expected (384). Your no vote:  
    - Reduces yes share (helpful if yes <50% matters).  
    - May push turnout *over* threshold (384 + 1 = 385 < 400? Unlikely alone, but collective action matters).  
  - *Arithmetic*: Probability your vote pushes turnout to 400 is negligible. But if all anti-union voters think similarly, abstention risks threshold breach. Coordination duty dominates → vote no.  

  **(c) High-Cost Voting ($190 + job risk)**  
  - *Principle*: **Abstain justified**. Clause 3: $190 ≈ 3–5% of weekly median income; job risk compounds cost. Unless election is competitive (Clause 1: \( p > 10^{-6} \)) or threshold-critical (Clause 2), cost exemption applies.  
  - *Arithmetic*: For \( p \leq 10^{-5} \), \( B \) would need to exceed $19M to justify voting. National stakes are high but not *that* high per voter.  

  ---

  ### Verdicts to Surrender  
  - **Must surrender Case 1 verdict**: Skipping is not "fine" but *permissible* due to cost (Clause 3). Weak duty exists (contributing to mandate/legitimacy), but overridden.  
  - **Best principle saving all 8**: Add "weak expressive duty" clause for safe states. But it:  
    - *Costs plausibility*: Expressive duties are subjective; hard to weigh against costs.  
    - *Adds complexity*: Requires ad hoc thresholds for "meaningful expression" (e.g., case 4’s 5% matters, case 1’s 20% loss doesn’t).  

  ---

  ### What the Principle Cannot Settle  
  1. **How uninformed is "too uninformed"?** Clause 4 sets a low bar ("name one difference"), but some voters may misjudge their competence. *Campaign advice*: "If you know nothing, focus on down-ballot races you understand; otherwise, skip top races but vote on local issues."  
  2. **Precise cost thresholds**: Is 3 hours/$100 too much? *Principle* hands back judgment. *Campaign stance*: "Don’t bankrupt yourself—but if costs are manageable, remember every voice shapes mandates."  

  ### Principle Summary for Volunteers  
  > "Vote if:  
  > 1. Your vote could decide a close race (e.g., polls within 1%),  
  > 2. It helps cross a threshold like 5% for funding or 40% for a runoff, *or*  
  > 3. The race directly affects you (like your condo fee).  
  > Skip if:  
  > - Costs are high (over $100 or 4 hours),  
  > - You’re completely uninformed *and* it’s not local.  
  > Otherwise, voting is a small civic duty—not mandatory, but valuable for legitimacy."  

