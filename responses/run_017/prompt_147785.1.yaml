prompt: |-
  I'm a fourth-year PhD student in philosophy of science, and I've been asked — as the only person on the committee with any philosophy training — to write the mechanism screen for my university's Interdisciplinary Seed Fund. Twice a year we read about fifty two-page pre-proposals requesting roughly $25,000 of pilot money, on everything from developmental psychology to structural engineering to computational linguistics. The panel is six faculty from different departments plus me; we have a single ninety-minute meeting in which everything gets ranked; and each reviewer sees a given pre-proposal once, for fifteen or twenty minutes, with no outside reading and no opportunity to query the applicant before we meet. What I need from you is a one-page decision procedure that a busy materials scientist or political scientist can run with no philosophical background, together with a short verdict slip — a few lines — that goes into our spreadsheet and, when a proposal is rejected on mechanism grounds, is close to what the chair's office sends back to the applicant. So it has to be usable inside twenty minutes, and it has to be defensible in writing to someone who is annoyed.

  Let me state the target distinction in my own rough terms so you don't have to guess where I'm starting. The first failure I want to catch is the ungrounded explainer: the proposal that accounts for a phenomenon by positing something at or above the level of the phenomenon which does the explaining but is itself unexplained — a striving, a vital force, a homunculus, an inner agent that wants what the organism wants, a capacity named after the very thing to be explained. The second failure is the mirror image, and the one I worry about more, because it is the one my colleagues will commit: dismissing a genuinely explanatory pattern merely because it lives at a higher level and nobody has yet spelled out the machinery under it. Population-level phenomena, optimality principles, and pattern-explanations that can be realized in many different substrates all look hand-wavy to a reviewer who is impatient for a mechanism, and I have watched good proposals die that way. There is a third case I've become convinced is distinct from either of these, and for which I have no name I'm happy with — I've been calling them borrowed cranes: a mechanism that is a real working machine in the domain it was invented in, imported into a new domain without the parts that made it work there. Selection moved from genes to cultural change without any account of what plays the role of faithful copying; representation moved from agents who use models to circuits that have no user; optimization moved from engineered systems with an explicit objective to growing tissue that is not optimizing anything in particular. A borrowed crane passes the tests that catch the first failure and is invisible to the second, and I don't know how to make a non-philosopher see it. My first attempt at a screen was a single question — could you in principle build the thing to be explained out of parts that don't already have the property being explained? — and it failed in both directions: it flagged a solid epidemiology proposal on herd immunity, and it waved through a proposal attributing rising adolescent anxiety to a loss of meaning in modern life, because meaning is not literally the same property as anxiety.

  So: give me the ordered questions the reviewer runs, no more than five or six, each with a statement of what would count as a sufficient answer at the depth a two-page pre-proposal can provide, and with explicit stopping points — where the answer is a no and the proposal is out on mechanism grounds, where it requires only that the applicant fill in a short mechanism box before the panel will rank it, and where it should simply be marked as a legitimate higher-level description that no mechanism is owed yet. Mark the places where the procedure has to hand the question back to a human because it is a question about what we want the fund to be rather than about how explanations work; I suspect how much sheer speculation we are willing to buy is one of these, and I'd like you to say so rather than smuggle in a threshold. Build in a self-check against the procedure's own bias: I have a strong prior that any screen like this will end up rewarding proposals that mention something neural or molecular whether or not the lower-level story actually explains the phenomenon at the level it was described, and I want the sheet to protect against that specifically. Tell me plainly where the procedure will misfire — I'm especially worried about mathematical and optimality explanations, which name no parts and no steps and are sometimes the best account available. Write out the actual verdict slip for each of these three, in the handful of sentences the chair would send:

  1. A psychology and neuroscience proposal: older adults recall emotional events better than neutral ones because the amygdala tags a memory as significant and thereby prioritizes it for consolidation.
  2. A sociology proposal: some neighbourhoods recover from economic shocks faster than others because of collective efficacy, the neighbourhood's shared capacity to exercise informal social control; they will measure it by survey and correlate it with recovery. I genuinely expect the verdict here to be more permissive than I want it to be — I think the construct is close to circular and my philosopher friends agree — and I would rather be told that than have you flatter me.
  3. A biomechanics proposal: the shape of a growing bone is explained by a principle of mechanical optimality, bone adapting so as to minimize strain energy under load.

  Finally, be honest about what the screen cannot do at all, and — since I should disclose that my own dissertation chapter explains the allocation of credit in science by appeal to a norm of credit-worthiness, and is therefore exactly the sort of thing this sheet might bite — tell me in a sentence what it would say about that too, even if the answer is unflattering.
reasoning: |-
  Hmm, this is a fascinating and complex request from a philosophy of science PhD student. They need to design a mechanism screening tool for interdisciplinary grant proposals that can be used by non-philosophers in tight time constraints. 

  The user has clearly identified three key failure modes: ungrounded explainers (circular explanations), premature mechanism demands (rejecting valid higher-level patterns), and borrowed cranes (importing mechanisms without proper adaptation). Their previous single-question approach failed because it couldn't distinguish between legitimate emergent phenomena and vague constructs.

  What they really need is a decision tree that:
  - Captures all three failure modes without philosophical jargon
  - Works within 20 minutes per proposal
  - Produces defensible written feedback
  - Prevents bias toward reductionist explanations
  - Acknowledges its own limitations

  The tricky parts are:
  1. Making "borrowed cranes" recognizable without specialized training. The key insight might be whether the imported mechanism retains its functional requirements.
  2. Protecting mathematical/optimality explanations while still catching vague constructs. The distinction lies in whether the pattern makes testable predictions independent of implementation.
  3. Creating verdicts that won't enrage rejected applicants. The feedback must point to specific missing elements rather than sounding dismissive.

  For their examples: 
  - The neuroscience proposal should pass (clear causal chain)
  - The sociology one might be a "borrowed crane" (social control as unexplained primitive)
  - The biomechanics should get a "pattern explanation" pass (optimality as valid theory)

  Their dissertation example is deliciously meta - "credit-worthiness" would likely trigger the "ungrounded explainer" warning unless grounded in specific agent behaviors.

  The procedure should explicitly flag when a judgment call is needed about the fund's risk tolerance. And we must build in that bias check against automatic preference for neural/molecular explanations - perhaps by requiring that lower-level details must directly connect to the higher-level phenomenon.
answer: |-
  Here’s a streamlined mechanism screening procedure for non-philosopher reviewers, designed for 15–20 minute assessments. It prioritizes **explanatory grounding** while protecting **legitimate pattern explanations** and flagging **mechanism mismatches** (borrowed cranes). 

  ---

  ### **Mechanism Screening Decision Procedure**  
  *(Run these questions in order; stop at first definitive verdict)*  

  1. **Does the proposal explain a phenomenon by naming a *new entity/property* at the *same or higher level* as the phenomenon?**  
     - *Sufficient answer:* Names a *lower-level component* (e.g., "dopamine circuits," "kinetic energy dissipation") or an *established emergent pattern* (e.g., "market equilibrium," "natural selection").  
     - **🚫 REJECT if:** It posits an unexplained primitive (e.g., "collective will," "innate meaning-seeking"). *Verdict: Ungrounded explainer.*  
     - **→ Proceed if not.**

  2. **Is the proposed mechanism borrowed from another field?**  
     - *Sufficient answer:* Explains how *key functional parts* (e.g., replication for selection, error correction for computation) operate in *this specific context*.  
     - **🚫 REJECT if:** Critical components from the original context are missing/unjustified (e.g., cultural selection without inheritance, "optimization" without selective pressure). *Verdict: Borrowed mechanism mismatch.*  
     - **→ Proceed if not.**

  3. **Could the explanation work *without* specifying underlying parts?**  
     - *Sufficient answer:* Shows the pattern is *predictive/testable* independent of implementation (e.g., game-theoretic equilibria, biomechanical optimality principles).  
     - **✅ ACCEPT (Pattern Explanation) if:** It makes falsifiable claims about outcomes. *Verdict: Legitimate higher-level account; no mechanism owed.*  
     - **→ Proceed if not.**

  4. **Does the proposed mechanism *connect* levels?**  
     - *Sufficient answer:* Describes *how* lower-level parts generate the phenomenon (e.g., "amygdala activation *increases synaptic plasticity* in memory networks").  
     - **⚠️ DEFER if:** Mechanism is plausible but underspecified (e.g., "social trust reduces anxiety"). *Verdict: Mechanism outline required.*  
     - **✅ ACCEPT (Mechanism Pass) if:** Clear causal chain (even if simplified).  

  5. **[BIAS CHECK] Am I favoring this *only* because it mentions molecules/circuits/neurons?**  
     - *Self-audit:* If lower-level details don’t clarify the *specific phenomenon*, return to Q3/Q4.  

  **Human judgment needed for:**  
  - Risk tolerance for speculation (e.g., exploratory math models).  
  - Field-specific standards (e.g., optimality in ecology vs. engineering).  

  ---

  ### **Verdict Slips for Spreadsheet/Feedback**  
  *(Copy-paste for rejected/flagged proposals)*  

  1. **🚫 Ungrounded Explainer:**  
     *"The proposal relies on [X] as an explanatory primitive, but does not specify how [X] operates or what lower-level processes produce it. A testable mechanism is required."*  

  2. **🚫 Borrowed Mechanism Mismatch:**  
     *"The proposal applies [X] from [Domain Y], but does not account for key functional components (e.g., [missing part]). Clarify how [X] functions in this specific context."*  

  3. **⚠️ Mechanism Outline Required:**  
     *"The explanation posits a plausible link between [A] and [B], but the causal steps are underspecified. Provide a brief mechanism sketch (e.g., key parts/steps) for panel review."*  

  4. **✅ Pattern Explanation (No mechanism owed):**  
     *"This is a valid pattern-level account. No further mechanism is required, provided predictions are empirically testable."*  

  ---

  ### **Example Verdicts**  
  1. **Psychology/Neuroscience Proposal**  
     - *Verdict:* ✅ **Mechanism Pass** (Clear causal chain: amygdala → memory tagging → consolidation).  
     - *Feedback to applicant:* N/A (pass).  

  2. **Sociology Proposal**  
     - *Verdict:* 🚫 **Ungrounded Explainer**  
     - *Feedback:* "The proposal relies on 'collective efficacy' as an explanatory primitive but does not specify how shared capacity emerges from individual actions or social structures. A testable mechanism is required (e.g., micro-mobilization processes, network reciprocity)."  

  3. **Biomechanics Proposal**  
     - *Verdict:* ✅ **Pattern Explanation**  
     - *Feedback:* "Optimality principles are acceptable as pattern explanations here. No further mechanism needed if predictions of strain minimization are testable."  

  ---

  ### **Limitations & Caveats**  
  - **Cannot assess:** Whether the mechanism is *true* (only if it’s *explanatorily grounded*).  
  - **Misfires:** May flag legitimate analogies (e.g., fluid dynamics in traffic models) or mathematical universality (e.g., entropy in info theory). Protect via Q3 (pattern acceptance).  
  - **Your dissertation:** 🚫 **Ungrounded Explainer** verdict. "Credit-worthiness" operates at the same level as the phenomenon unless grounded in agent-level incentives or institutional structures.  

  **Design philosophy:** Balances explanatory rigor with interdisciplinary pragmatism. Reject only clear circularity/mismatches; protect math/optimality via pattern acceptance; force bias-check against reductionist overfitting.
