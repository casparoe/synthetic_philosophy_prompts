answer: |-
  Here is a specification of requirements for an account of net ecosystem welfare for ranking land-use trajectories, motivated by your concerns. Requirements labeled **(Non-Negotiable)** are foundational for welfare accounting; others reflect common but contested priorities. "Negotiable?" flags indicate where the requirement's necessity is debated.

  ### Requirements for Net Welfare Accounting

  1.  **Distinguish Stock vs. Throughput:** Must separate the welfare of individuals present at a snapshot (stock) from the welfare generated/cumulated over time by all individuals lived (throughput), including short-lived offspring. *Motivation:* High-fecundity/high-mortality strategies (e.g., passerines) yield vastly different throughput than low-fecundity/high-survival (e.g., ungulates) for similar biomass/stocks. **(Non-Negotiable)** for temporal accuracy.
  2.  **Decompose Extensive/Intensive Margins:** Must account separately for welfare changes due to changes in the *number* of welfare-bearing individuals (extensive margin) and changes in *average welfare per individual* (intensive margin, e.g., via density dependence, edge effects). *Motivation:* Habitat loss/fragmentation impacts both; trade-offs (e.g., fewer individuals but higher average welfare) must be explicit for informed choice. Reporting separately is **(Non-Negotiable)**; allowing trade-offs is negotiable (depends on aggregation rules).
  3.  **Insensitivity to Identical Outcome Paths:** The welfare verdict for a trajectory must depend *only* on the resulting population dynamics and individual welfare states, not the *method* used to achieve them (e.g., contraception vs. culling vs. bulldozing to achieve same population size). *Motivation:* Welfare is a state experienced; identical states imply identical welfare, regardless of cause (absent intrinsic moral weight to methods themselves). **(Non-Negotiable)** for welfarist purity. *Negotiable?* Yes (some argue methods matter intrinsically).
  4.  **Include Replacement Communities:** Must incorporate the welfare of all sentient beings occupying the landscape over the trajectory, including synanthropic species or domesticated animals replacing cleared natives. *Motivation:* The welfare consequence of clearing forest includes the welfare of the rats, livestock, or humans that replace deer, not just the loss of deer. **(Non-Negotiable)** for comparative assessment.
  5.  **Define Finite Temporal Scope & Handle Uncertainty:** Must specify a finite comparison window (e.g., 100 years) with explicit justification. Discounting future welfare is permissible *only* if ethically justified (e.g., pure time preference debate). Cannot rely on speculative, unmodeled distant futures to determine sign. *Motivation:* Requires tractable modeling and avoids indefensible assumptions about the far future. Definable scope is **(Non-Negotiable)**; discounting is negotiable.
  6.  **Scope to Plausibly Sentient Taxa:** Must include all taxa where sentience (capacity for valenced experience) is reasonably plausible. Cannot exclude invertebrates *a priori* if sentience plausible. *Motivation:* Welfare is contingent on sentience; excluding plausible candidates is special pleading. Defining sentience is hard, but scope must be principled. **(Non-Negotiable)**. *Negotiable?* Yes (practicality vs. principle).
  7.  **Tractability vs. Purity:** Need not be computable *now* with limited data (e.g., area, habitat, rough densities). It can be a "standard of correctness." *Motivation:* Demanding computability now forces reliance on poor proxies (e.g., species richness ≠ welfare), corrupting the measure. Tractability is a practical goal, not a theoretical requirement. **(Non-Negotiable)** for purity. *Negotiable?* Yes (for applied contexts).
  8.  **Immunity to Extinction Implication:** Must *not* be rejected simply because it implies, under some empirical assumptions, that habitat loss/wildlife extinction is net welfare-positive. *Motivation:* Resistance indicates prior ethical commitment overriding welfarist calculation, invalidating the measure's purpose. **(Non-Negotiable)** for objectivity.
  9.  **Expected Value under Uncertainty:** Must deliver expected-value rankings based on available evidence and models, not solely precautionary principles under "thick uncertainty." *Motivation:* Precaution often smuggles in non-welfarist values; welfare accounting requires best estimates. **(Non-Negotiable)**. *Negotiable?* Yes (some argue deep uncertainty necessitates precaution).

  ### Tension Pairs (Likely Incompatible)

  *   **Purity (R7) & Tractability:** A pure standard may require unobtainable individual welfare data, clashing with the need for practical computation.
  *   **Additivity over Time & Immunity to Far Future Domination (R5):** If welfare is simply summed over infinite time, the far future dominates, making near-term choices irrelevant and violating the need for a finite scope.

  **Most Excluding Requirement:** **R3 (Insensitivity to Method)** rules out many popular intuitions and arguments focused on "naturalness" of death or intrinsic wrongs of certain interventions.

  ### Position Scorecard

  | Position                                                               | R1 | R2 | R3 | R4 | R5 | R6 | R7 | R8 | R9 | Notes                                                                 |
  | :--------------------------------------------------------------------- | :- | :- | :- | :- | :- | :- | :- | :- | :- | :-------------------------------------------------------------------- |
  | **Wild Lives Positive (e.g., Prot Default)**                           | ✓  | ✗  | ?  | ✗  | ✗  | ?  | ?  | ✗  | ?  | Fails R2/R4/R8; assumes stock>throughput; often neglects replacement. |
  | **Wild Suffering Dominates (e.g., "Efilism")**                         | ✓  | ✓  | ✓  | ✓  | ~  | ?  | ✗  | ✓  | ~  | Strong on R2/R3/R4/R8; weak on R7/R9 if ignores uncertainty/data.     |
  | **Non-Welfare Value of Wildness**                                      | ✗  | ✗  | ✗  | ✗  | ✗  | ✗  | ✗  | ✗  | ✗  | Explicitly violates welfarist basis (R1-R9 irrelevant).               |
  | **Uncertainty Precludes Net Verdict (Stick to Priorities)**            | ~  | ~  | ~  | ~  | ~  | ~  | ~  | ✗  | ✗  | Rejects R8/R9; abandons welfarist ranking goal.                       |

  ✓ = Satisfies, ✗ = Violates, ~ = Ambiguous/Depends, ? = Often Unaddressed

  ### Final Notes

  *   **Least Confident Requirement:** **R5 (Finite Scope/Discounting)** - Defining the window and justifying discounting involve deep, contested value judgments. *Negotiable?* Highly.
  *   **First Requirement to Abandon if Forced:** **R7 (Purity over Tractability)**. If empirical data limitations are truly insurmountable *and* welfare proxies prove robust, purity might yield for applicability.
  *   **Empirical Finding Changing the List:** **Confirmation of Widespread Invertebrate Sentience with High Negative Throughput.** This would force R6, make R1/R2 critical, potentially dominate totals, challenge R7 tractability, and intensify R8 implications.

