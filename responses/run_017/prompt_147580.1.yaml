prompt: |-
  I do a podcast and a newsletter on science-and-ideas stuff, and I've got this habit of agreeing to things on panels and then having to actually think them through afterwards. Last week, on a panel about autonomous vehicles, I heard myself say "well, obviously genuine moral dilemmas are possible" and then realised I can't say what makes a conflict a *dilemma* rather than just a difficult choice where one option is better and I don't want to admit it. So I've been putting cases in a notes app with my gut verdict next to each, and the pattern is definately wierder than I expected. What I want is a principle — or a short list of candidates — that fits the verdicts, tells me which ones it can't swallow, and gives me verdicts on two or three cases I haven't listed. Please don't give me the literature: no names, no papers, no "so-and-so argues." I need to know whether there's a shape here or whether I'm just inconsistent, and I'm filing Friday.

  Here are the cases, the way I actually have them:

  1. An armed man tells a woman to pick which of her two children dies, or he kills both. My verdict: whichever she picks she does nothing wrong and shouldn't be blamed — but she should be wrecked by it for a long time, and I'd think less of her if she shrugged it off in a week. Also: if she refuses to choose and both are killed, that's worse, and I do blame her.
  2. Two strangers are drowning, symmetrically situated, I can reach one. My verdict: not a dilemma at all. Save either one, coin flip if you like, no residue beyond ordinary grief.
  3. Wartime: a young man who is the only person his mother has and who would be destroyed if he leaves, versus a resistance that genuinely needs him because there are very few who can do it. My verdict: this one feels like a real dilemma, and I can't tell you why it isn't just case 2 with better costumes.
  4. I made two promises on the same day, knowing I couldn't keep both, and both people get badly hurt. My verdict: the real wrong was making the second promise; breaking either is also wrong; and apologising to the one I let down doesn't clear it, even if I picked the more important one.
  5. I can pay for an operation that restores my own kid's sight, or pay for the same operation for three strangers' kids. My verdict: I'm not required to save the three, and I'm also not required to save mine; both are permitted, and that permission isn't just "anything goes" — it has something to do with whose kid it is.
  6. A mayor authorises something that would normally be an outright violation of people's rights, because it's the only way to avert a much bigger disaster. My verdict: if it's genuinely necessary and proportionate, not wrong — but a mayor who does it briskly and feels nothing afterward is a worse mayor, and resigning instead of doing it is fine, maybe admirable, since someone else will make the call anyway. (This is the pair that keeps me up: in 1 refusing to choose is worse, in 6 handing the choice to somebody else is fine. Is there a difference or am I just inconsistent?)
  7. An ICU doctor during a months-long shortage, allocating beds by a written protocol, shift after shift. My verdict: almost no moral phenomenology at all — it feels like paperwork — even though the stakes dwarf case 3. And the committee that wrote the protocol in advance did feel awful doing it, and I think they should.

  The rough principle I've been gesturing at goes like this: a conflict is a genuine dilemma only if (a) whatever you do leaves a normative remainder, (b) the remainder isn't a debt you can discharge by an apology or a compensation payment, and (c) it isn't the kind of conflict you could have settled in advance by a rule you'd endorse without knowing which party in it you were going to be. I think (c) is the clause doing all the work — it's what makes 7 feel like paperwork and 3 feel like tragedy — but I also suspect it gives the wrong answer somewhere, maybe on 4 or 6. Test it, repair it, or replace it. One more restriction, which I want you to either honour or explain why it's cheating: I've only counted cases where the agent knows what's at stake; the ones where you're simply unsure which option is worse I've been filing separately as "fog" rather than as dilemmas, and I'd like to know whether that distinction is doing real work or is just me tidying up.
reasoning: |-
  Hmm, the user runs a science-and-ideas podcast and newsletter and has a habit of agreeing to things on panels before thinking them through. They mentioned they were on a panel about autonomous vehicles and said "genuine moral dilemmas are possible," but now they're struggling to define what makes something a dilemma rather than just a difficult choice. They've been collecting cases in their notes app with their gut reactions and want a principle that fits these verdicts.

  Looking at their cases, I see a pattern emerging. In Case 1 (choosing which child dies), they feel the mother shouldn't be blamed but should be emotionally wrecked, and refusing to choose is worse. Case 2 (saving one of two drowning strangers) doesn't feel like a dilemma at all. Case 3 (wartime choice between mother and resistance) feels like a real dilemma, which is interesting since it resembles Case 2 but with different emotional weight. Case 4 (broken promises) involves wrongs that can't be fully resolved by apology. Case 5 (saving own child vs three others) shows special permissions based on relationships. Case 6 (mayor violating rights for greater good) involves no wrong if proportionate, but emotional residue matters. Case 7 (ICU doctor following protocol) feels like paperwork despite high stakes.

  Their rough principle has three parts: normative remainder that can't be discharged (a and b), and inability to settle in advance by a rule (c). I notice clause (c) seems central - it explains why the doctor in Case 7 feels no dilemma (protocol exists) while the wartime choice in Case 3 does (no advance rule possible). But there might be problems with Cases 4 and 6.

  For the promise case (4), the conflict couldn't have been settled in advance because the agent made both promises knowing they conflicted. This fits (c), but their verdict emphasizes the initial wrong of making the second promise. For the mayor case (6), they note that resigning is fine since someone else will decide - which suggests (c) might need adjustment because the rule exists (someone will make the call), but the mayor still faces residue.

  I think I can refine the principle to better capture their intuitions. The key seems to be about whether the conflict stems from the agent's own relational commitments or identity-constituting bonds that can't be fully captured by rules. This explains Case 1 (parental bond), Case 3 (filial duty), and Case 5 (parental partiality). Cases like 2, 6, and 7 involve impersonal roles where rules or utilitarian calculations apply cleanly.

  For their "fog" distinction (uncertainty about outcomes), I think it's valid and necessary. Dilemmas in their sense persist even with perfect knowledge - the conflict is in the values themselves, not just epistemic uncertainty. This separates true dilemmas from mere risk assessment problems.

  Testing the principle on new cases: For the "burning lab" scenario (save your life's work or a stranger), it should be a dilemma due to personal investment. For the "friend vs five" trolley case, it should be a dilemma because friendship creates a special duty. For the "organ allocation" committee, it should feel like paperwork if done by protocol.

  The refined principle would be: A conflict is a genuine moral dilemma iff: (1) All options involve violating a norm that binds the agent through their relational identity (not just general duties); (2) This violation leaves non-dischargeable normative residue (can't be wiped clean by apology/compensation); (3) The conflict couldn't be fully resolved by an advance rule the agent would endorse from an impersonal standpoint.

  This handles their cases well: Explains why Case 1 is a dilemma (parental bonds), Case 2 isn't (no special bonds), Case 3 is (filial duty vs duty to cause), fits Case 4 (promises create personal bonds), Case 5 (parental partiality permitted), resolves the Case 1 vs 6 tension (parental role vs mayoral role), and makes Case 7 impersonal.

  I'll present this as a clean principle with explanations of how it applies to each case and resolves their tensions, while honoring their request to avoid academic references and focus on conceptual clarity.
answer: |-
  Based on your cases and verdicts, there's a consistent pattern focused on **relational identity and non-transferable roles**. Your clause (c) is indeed central, but needs refinement to capture why some "advance rules" feel different (e.g., Case 7 vs. Case 6). Here's a unified principle that fits your verdicts, flags tensions, and addresses new cases:

  ### The Principle
  A conflict is a **genuine moral dilemma** iff:
  > **(i)** The agent must violate a **role-constituted obligation** (an obligation that defines *who they are* in a specific relationship or identity), and  
  > **(ii)** This violation leaves **non-dischargeable residue** (guilt, grief, or blame that cannot be fully resolved by apology, compensation, or substitution), and  
  > **(iii)** The conflict **cannot be impersonally arbitrated** (no rule or third party can *fully* absorb the moral burden without losing something essential to the agent's role).

  **Key clarifications**:
  - **"Role-constituted obligation"**: Duties arising from relationships/identities that define the agent (e.g., *parent*, *promise-maker*, *son*). Not general duties like saving strangers.  
  - **"Impersonally arbitrated"**: A rule/protocol that would be endorsed by a disinterested party *and* transfers responsibility away from the agent's personal role.  
  - **"Fog" distinction**: Your separation holds. Dilemmas here persist *even with perfect knowledge*—the conflict is in the values, not uncertainty. "Fog" is epistemic; dilemmas are ontological.  

  ---

  ### How It Fits Your Cases
  1. **Armed man/children**:  
     - **Dilemma? YES**.  
     - (i) Role: *Parent* must protect both children. Choosing violates this role.  
     (ii) Residue: Grief is non-dischargeable (no apology fixes it).  
     (iii) No arbitration: Forcing the choice onto the parent is key. Refusing (making the killer choose) abandons the role.  

  2. **Two drowning strangers**:  
     - **Dilemma? NO**.  
     - (i) No role-constituted obligation (general duty to save, no specific relationship).  
     (ii) No residue beyond grief (saving one is straightforwardly good).  
     (iii) Arbitrable: A coin flip or rule works fine.  

  3. **Wartime (mother vs. resistance)**:  
     - **Dilemma? YES**.  
     - (i) Role: *Son* has a duty to his mother; *citizen* has a duty to the resistance.  
     (ii) Residue: Whichever choice, grief/guilt lingers (can't fully discharge by apologizing to mom or comrades).  
     (iii) No arbitration: No rule captures both roles' depth. Unlike Case 2, identities conflict.  

  4. **Two promises broken**:  
     - **Dilemma? YES**.  
     - (i) Role: *Promise-maker* to both parties. Breaking either violates the role.  
     (ii) Residue: Apology doesn’t clear the wrong (unlike a debt).  
     (iii) No arbitration: Making the promise *was* the failure, but *now* the agent must personally violate a role-duty. Rules can’t erase the relational betrayal.  

  5. **Save your kid vs. three strangers**:  
     - **Dilemma? NO** (but permission asymmetry fits).  
     - (i) Role: *Parent* has permission to prioritize their child (role-constituted *priority*, not obligation to choose).  
     (ii) No residue: Choosing your kid is blameless; choosing strangers is supererogatory.  
     (iii) Arbitrable: A rule ("parents may prioritize children") works.  

  6. **Mayor violating rights**:  
     - **Dilemma? NO**.  
     - (i) Role: *Mayor*’s duty is to protect the community impartially. Violating rights is a role-tool (not a role-violation).  
     (ii) Residue: Emotional weight is role-integrity (good mayors feel it), but no *moral* residue if proportionate.  
     (iii) Arbitrable: Resigning passes the role. Rules (proportionality) absorb the burden.  

  7. **ICU doctor with protocol**:  
     - **Dilemma? NO**.  
     - (i) Role: *Doctor* follows protocol; the role is *defined* by impartial allocation.  
     (ii) No residue: The protocol discharges responsibility.  
     (iii) Arbitrable: The committee’s advance rule absorbs the burden. Their grief was designing the rule, not facing a dilemma.  

  ---

  ### Tensions Resolved
  - **Case 1 vs. Case 6 inconsistency?**  
    - **Resolved**: In Case 1, refusing to choose *abandons the parental role* (making the killer choose isn’t arbitrating—it’s capitulating). In Case 6, resigning *upholds the mayoral role* (ensuring *someone* with that role acts). The difference is whether the role *demands personal engagement*.  
  - **Case 3 vs. Case 2**: Case 3 has clashing roles (son vs. citizen); Case 2 has no roles.  
  - **Case 4**: The "wrong in making the promise" is foresight failure, but the *dilemma* arises when the role-obligations collide *now*. Fits (i)–(iii).  

  ---

  ### Verdicts on New Cases (Testing the Principle)
  **Case A**: *You must betray a close friend to save five strangers (e.g., reveal their secret).*  
  - **Verdict**: GENUINE DILEMMA.  
    - (i) Role: *Friend* (loyalty) vs. *moral agent* (save lives).  
    (ii) Residue: Betrayal causes non-dischargeable guilt; saving strangers doesn’t negate it.  
    (iii) No arbitration: No rule fixes this—friendship is personal.  

  **Case B**: *A judge must sentence their own child for a serious crime.*  
  - **Verdict**: GENUINE DILEMMA.  
    - (i) Role: *Parent* (protect) vs. *judge* (impartiality).  
    (ii) Residue: Guilt/grief either way; can’t be resolved by apology.  
    (iii) No arbitration: Recusal transfers the role, but *choosing to recuse* is itself a role-violation (parent? judge?).  

  **Case C**: *You can save your lifelong research (vital for cancer cure) or a stranger, but not both.*  
  - **Verdict**: NOT A DILEMMA.  
    - (i) No role-obligation to the research (general duty to humanity, but no *identity* tie).  
    (ii) Save stranger: No residue beyond regret. Save research: Permissible if impact is huge, but no *role* binds you.  
    (iii) Arbitrable: A rule ("maximize utility") works.  

  ---

  ### Why This Works
  - **Fits your verdicts**: Explains all 7 cases, including Case 4 (role-violation) and Case 5 (asymmetry without dilemma).  
  - **Clarifies "residue"**: Residue flows from *role-violation*, not just bad outcomes (e.g., Case 2 vs. Case 3).  
  - **Honors "fog" distinction**: Dilemmas are about inescapable role-conflicts, not uncertainty.  
  - **Repairs (c)**: "Impersonal arbitration" explains why Case 6 (resigning) and Case 7 (protocol) lack dilemmas—roles can be transferred or defined by rules. Case 1 and 3 cannot.  

  **Final shape**: Your intuitions point to dilemmas arising when **personal identities conflict**, and the burden cannot be handed off without betraying who you are. The residue is the scar of that betrayal. Friday’s podcast is safe.
