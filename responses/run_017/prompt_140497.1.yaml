prompt: |-
  Write a modest proposal in the form of a British government White Paper — a Command Paper, with the full apparatus of the genre: a title page giving the department, a command paper number and a date; a ministerial foreword; an executive summary; a section setting out the options considered, with costings; a preferred option with a statutory target and an implementation timetable; an equality impact assessment; and a short annex. Aim for 950–1,150 words. Write the whole thing in British English — organisation, recognise, whilst, costings in pounds sterling — and in the flat, euphemistic, noun-heavy register of the civil service.

  The paper is issued by a fictional department of state (invent its name, its acronym, and its minister) and it defends a real view, which it then proceeds to take at its word. The view is the evidential-decision-theoretic argument for cooperation in large worlds: an agent facing a one-shot prisoner's dilemma may rationally cooperate with a counterpart she cannot causally influence, has no contract or reputation with, and will never encounter again, provided the world is large enough and the counterpart similar enough that her decision is statistically correlated with theirs. What does the justificatory work is correlation, not causation. The correlation required is a function of the payoff matrix: the greater the temptation payoff, the stronger the correlation needed, and beyond some point no attainable correlation short of certainty will suffice.

  Requirements for the content:

  1. The paper must never claim that one person's cooperation brings about another's. Every statement of the mechanism should be scrupulously evidential — what an agent's decision is evidence for, what the conditional probabilities are, what follows under the agent's uncertainty. But the surrounding apparatus — delivery, rollout, levers, targets, interventions, pilot regions, guidance to local authorities — should be saturated with causal language, and no character in the document should ever notice the mismatch. The reader should notice it.
  2. The Department should set a statutory minimum correlation, with a name and a figure, and a note that the figure will be kept under review. In the options section it should discover that the cheapest way to meet the target is not to raise correlation but to lower the temptation payoff, and should therefore propose a levy, a cap, or a licensing regime for high-temptation situations, costed as unremarkable policy.
  3. Include a passage in which the Office for National Statistics is asked to certify that the world is large enough: to estimate the number of relevantly similar agents, with a confidence interval, and to note the awkwardness that the estimate moves as the policy itself changes what counts as similar.
  4. The equality impact assessment is where the reference-class problem should do its damage. Similarity is a matter of degree, and the Department must decide which respects count. It should find, deadpan, that the most reliable correlations obtain within narrow occupational, educational and demographic bands, and should go on to recommend measures — a register of approved decision procedures, an inspectorate, statutory guidance on lawful deliberation — that entrench those bands, while describing them throughout as technical measures for improving match quality.
  5. Include one short paragraph on the anti-correlated counterpart: the near-twin who defects precisely when you cooperate. The Department should dispose of this by reclassifying such persons out of the reference class, without noticing that the reclassification, rather than any fact about the persons concerned, is doing all the work.
  6. Include a section on gaming and uptake: citizens who make themselves predictable, or who self-modify into the kind of person who cooperates, in order to improve their correlation. The Department should treat this behaviour as simultaneously the programme's principal uptake target and a serious compliance risk, and should leave unresolved whether these are two phenomena or one.
  7. Carry the logic to its terminus without flinching. The cheapest and most reliable way to raise correlation is to reduce the number of distinct decision procedures in the population; the paper should approach standardisation — and the limit in which the correlated parties are, for decision-theoretic purposes, a single agent, enjoying perfect cooperation at the cost of there being no one left to cooperate with — as an efficiency saving, with a costing attached.
  8. Register: sustained deadpan. No winking, no authorial footnotes, no scare quotes, no present-day proper nouns, no named philosophers, and nothing anywhere that states the joke. Citations, if any, should be to fictional departmental publications and earlier fictional White Papers; do not cite real authors, and include no bibliography, reading list or references section.
  9. A reader who knows the literature on evidential decision theory and large worlds should be able to tell that the target has been understood rather than caricatured: the mathematics of the threshold, the gradedness of similarity, the largeness condition and the reference-class worry should all be recognisable. A reader who knows none of it should still be able to tell what is being sent up, from the content alone.
  10. Close with the annex: four questions that local authorities have asked, with the Department's answers, the last of which is a question the paper cannot answer and answers anyway in the standard idiom; followed by the usual invitation to submit responses by a stated date.
reasoning: |-
  Okay, the user wants me to write a satirical British government white paper that applies evidential decision theory to prisoner's dilemmas in "large worlds." This is quite a sophisticated request blending policy satire with niche philosophical concepts. 

  First I need to unpack the core idea: the paper must promote cooperation based purely on statistical correlation between agents, never causation. The humor will come from bureaucratic language violently clashing with this counterintuitive premise. 

  The user's specifications are extremely detailed - they clearly know this literature well. I must get the EDT math right while maintaining deadpan delivery. Key challenges: 

  The ministerial foreword needs pompous platitudes about "civic duty" that subtly contradict the actual mechanism. For the equality impact, I'll have the policy accidentally entrench class divisions by defining "similarity" narrowly - that's where the reference-class problem bites. 

  For the anti-correlated twin paradox, I'll have the department blandly exclude such people from the reference class. The gaming section is delicious - citizens trying to hack their predictability becomes both success metric and compliance risk. 

  The terminus is darkest: standardizing decisions until correlation perfects by eliminating diversity. Costings will treat this dystopia as mere efficiency savings. 

  Throughout, I must:
  - Use British English (organisation, whilst)
  - Invent a department (DECORUM sounds suitably Orwellian)
  - Never wink at the reader
  - Cite only fictional prior papers
  - Make the causal/evidential mismatch scream through subtext

  The annex questions will end with one that's fundamentally unanswerable, answered bureaucratically anyway. Perfect.
answer: |-
  ## COMMAND PAPER  
  **CP 714**  
  **April 2024**  

  **DEPARTMENT FOR EVIDENTIAL COORDINATION AND OUTCOME REGULATION (DECORUM)**  
  **Minister: The Rt Hon. Evelyn Thorne MP**

  ---

  **FOREWORD BY THE MINISTER FOR EVIDENTIAL COORDINATION**  

  The Government is committed to fostering a cooperative society, underpinned by rational decision-making and mutual benefit. Too often, citizens face situations – in commerce, civic duty, and community life – where individual gain appears to conflict with collective wellbeing. This White Paper sets out a robust, evidence-based framework to encourage cooperative outcomes in such scenarios, recognising the profound impact individual decisions have on wider societal patterns. Our approach harnesses statistical insights to guide rational choice, ensuring individuals can confidently participate in mutually beneficial interactions, secure in the knowledge that their actions contribute to a demonstrably positive national outcome. I commend this strategy to the House and the nation.  

  **Evelyn Thorne**  

  ---

  **EXECUTIVE SUMMARY**  

  1.  This paper addresses suboptimal outcomes arising in non-repeated, non-contractual strategic interactions (NNSIs) resembling the Prisoner's Dilemma paradigm. Evidence indicates that rational agents frequently fail to cooperate due to perceived lack of influence over counterparts.
  2.  DECORUM analysis confirms that under conditions of sufficient population size and agent similarity, an agent's decision provides significant *evidence* regarding the probable actions of sufficiently similar counterparts. This evidential linkage, quantified as a correlation coefficient, renders cooperation the rational choice for utility-maximising individuals above a calculable correlation threshold.
  3.  The Department proposes establishing a **Statutory Minimum Evidential Correlation (SMEC)** of **0.65** for designated high-impact NNSIs. This threshold ensures cooperation remains the utility-maximising strategy for agents facing significant temptation payoffs.
  4.  Primary interventions include:
      *   Establishing a **Correlation Assurance Framework (CAF)** incorporating a register of approved decision procedures and statutory guidance on lawful deliberation.
      *   Introducing a **Temptation Payoff Mitigation Levy (TPML)** on entities creating high-temptation scenarios where correlation alone is insufficient to meet the SMEC.
      *   Piloting **Standardised Decision Protocols (SDPs)** in selected regions to enhance correlation efficiency.
  5.  Implementation will be phased over 24 months. Estimated net present value of societal benefits over 10 years is £3.2bn against costs of £1.1bn.

  ---

  **OPTIONS CONSIDERED AND COSTINGS**  

  6.  DECORUM evaluated three primary levers to increase cooperative outcomes in NNSIs:
      *   **Option 1: Direct Correlation Enhancement Programmes:** Public awareness campaigns, subsidised similarity-matching services, and behavioural nudge units. *Estimated Cost: £850m over 5 years. Effectiveness: Low-moderate; correlation gains uncertain and slow.*
      *   **Option 2: Temptation Payoff Mitigation:** Regulatory intervention (caps, levies, licensing) to reduce the payoff for non-cooperation in high-stakes NNSIs. *Estimated Cost: £300m (setup), £50m p.a. (enforcement). Revenue (if levy): £150m p.a. Effectiveness: High; directly lowers threshold correlation required for rational cooperation.*
      *   **Option 3: Decision Procedure Standardisation:** Promoting or mandating uniform decision-making algorithms/protocols within defined populations. *Estimated Cost: £500m (development & rollout), £100m p.a. (maintenance). Effectiveness: Very High; maximises correlation by minimising decision variance.*
  7.  Option 1 offers limited value for money. Option 3 demonstrates high efficiency in correlation enhancement but carries significant implementation complexity and potential societal adjustment costs. **Option 2 provides the most cost-effective pathway to immediately achieving the SMEC threshold in critical sectors.** Option 3 offers substantial long-term efficiency savings warranting pilot exploration.

  ---

  **PREFERRED OPTION: THE COOPERATIVE OUTCOMES STRATEGY**  

  8.  DECORUM will implement an integrated strategy centred on the **Statutory Minimum Evidential Correlation (SMEC) of 0.65**.
  9.  **Key Interventions:**
      *   **Correlation Assurance Framework (CAF):** Managed by a new **Evidential Correlation Inspectorate (ECI)**. The CAF will maintain a **Register of Approved Decision Procedures (RADP)** and issue **Statutory Guidance on Lawful Deliberation (SGLD)**, ensuring deliberation methods meet minimum correlation-enhancing standards. *(Cost: £200m setup, £80m p.a.)*
      *   **Temptation Payoff Mitigation Levy (TPML):** Applied to businesses and platforms facilitating NNSIs where the inherent temptation payoff exceeds a level calculable as requiring a correlation >0.65 for rational cooperation. Rate: 15% of excess temptation payoff. *(Cost: £100m setup. Revenue: Est. £120m p.a.)*
      *   **Standardised Decision Protocol (SDP) Pilots:** DECORUM will commission the development of optimised decision protocols. Pilots will run in three Local Authority regions (TBC) for 18 months, evaluating uptake and correlation impact. *(Cost: £75m pilot phase.)*
  10. **Implementation Timetable:**
      *   **Months 1-6:** Legislation laid for SMEC, CAF, ECI, and TPML. ONS baseline study commissioned (see para 15).
      *   **Months 7-12:** ECI established. RADP framework developed. SGLD drafted for consultation. TPML regulations finalised.
      *   **Months 13-18:** CAF operational. RADP opens. SGLD issued. TPML commences. SDP development begins.
      *   **Months 19-24:** SDP Pilots launch. Full CAF enforcement begins. First review of SMEC level.

  ---

  **EQUALITY IMPACT ASSESSMENT**  

  11. DECORUM recognises the critical importance of defining relevant similarity for robust correlation. Analysis indicates the strongest and most reliable evidential linkages occur amongst agents sharing highly specific occupational profiles, educational attainment levels, and demographic characteristics (Reference: DECORUM Research Note 14/2023: *Demographic Granularity and Correlation Stability*).
  12. The CAF measures, particularly the RADP and SGLD, will utilise these evidence-based parameters to define reference classes and ensure high-fidelity matching, thereby maximising the effectiveness of the SMEC. This represents a technical optimisation for match quality.
  13. Potential impacts were assessed:
      *   **Age:** Neutral. Similarity parameters are age-agnostic.
      *   **Disability:** Neutral. Decision procedure approval (RADP) focuses on methodological compliance, not physical/cognitive capacity.
      *   **Gender Reassignment:** Neutral. Correlation is assessed on deliberative similarity.
      *   **Marriage and Civil Partnership:** Neutral.
      *   **Pregnancy and Maternity:** Neutral.
      *   **Race:** Evidence suggests correlation strength varies significantly across granular ethnic groupings. The focus on narrow, technically optimised reference classes within the CAF ensures maximum policy efficacy for all groups by matching agents with the most statistically similar counterparts. No adverse impact identified.
      *   **Religion or Belief:** Neutral. Belief systems may influence decision procedures; RADP assessment is belief-neutral, focusing on structural compliance.
      *   **Sex:** Analysis indicates minor variance in baseline decision procedure distribution. RADP/SGLD will standardise towards optimal protocols, mitigating any residual variance.
      *   **Sexual Orientation:** Neutral.
  14. **Specific Consideration:** Instances of persistent anti-correlation (where Agent A's cooperation strongly evidences Agent B's defection) undermine the evidential mechanism. DECORUM policy defines such pairs as exhibiting insufficient similarity for inclusion within a viable reference class under the CAF. Reclassification ensures statistical coherence.

  ---

  **GAMING AND UPTAKE**  

  15. Successful delivery requires widespread adoption of decision procedures conducive to high correlation. DECORUM encourages agents to adopt RADP-approved procedures and cultivate predictable, cooperation-conducive deliberative patterns.
  16. However, strategic agents may attempt to manipulate their apparent correlation or deliberative type to gain advantage without substantive commitment to cooperative outcomes (‘correlation gaming’). The ECI will monitor for such gaming, which presents a significant compliance risk, through audits of deliberation logs (where legally permissible) and outcome pattern analysis. Distinguishing genuine uptake from sophisticated gaming presents an operational challenge requiring ongoing methodological refinement by the Inspectorate.

  ---

  **ENSURING SUFFICIENT SCALE AND GRANULARITY**  

  17. The Office for National Statistics (ONS) has been commissioned to provide a baseline estimate of the population of distinct agents engaging in significant NNSIs meeting SMEC applicability criteria. The preliminary ONS estimate (95% CI) is 12.4 million to 18.7 million agents. ONS notes the methodological challenge that the definition of ‘relevantly similar’ agents may shift as the CAF refines reference classes, potentially altering the population count estimate over time. DECORUM judges the current lower bound estimate (12.4m) provides sufficient scale to support the SMEC threshold under expected reference class definitions.

  ---

  **ANNEX: FREQUENTLY ASKED QUESTIONS FOR LOCAL AUTHORITIES**  

  **Q1: How will the Evidential Correlation Inspectorate (ECI) assess compliance with the Statutory Guidance on Lawful Deliberation (SGLD)?**
  *A1: The ECI will utilise a combination of agent self-certification, random audits of documented decision rationales (where required under sector-specific regulations), and statistical analysis of outcome patterns to identify potential non-compliance. Detailed compliance protocols will be issued by the ECI upon its establishment.*

  **Q2: Are Local Authorities expected to fund the implementation of Standardised Decision Protocols (SDPs) if selected as a pilot region?**
  *A2: Central funding via DECORUM grant-in-aid will cover all direct costs associated with SDP pilot implementation within selected Local Authorities. Authorities will be expected to provide necessary officer time for coordination.*

  **Q3: Does the Temptation Payoff Mitigation Levy (TPML) apply to public sector interactions?**
  *A3: The TPML applies to designated high-stakes NNSIs irrespective of sector, where the private entity facilitating or benefitting from the interaction meets the levy threshold. Pure public-public interactions are currently out of scope.*

  **Q4: What happens if an agent, despite using an RADP-approved procedure and facing a scenario below the TPML threshold, rationally cooperates but their statistically similar counterpart defects, causing them significant loss?**
  *A4: The policy framework ensures that where the SMEC threshold is demonstrably met and agents utilise approved procedures, cooperation is the rational, utility-maximising choice across the relevant reference class. Individual outcomes are subject to inherent statistical variation. Agents are encouraged to participate within the assured CAF framework to maximise the probability of mutually beneficial outcomes. DECORUM will monitor aggregate outcomes to ensure system-wide efficacy.*

  ---

  **The Department invites responses to this consultation paper by 5pm on 31st August 2024.**  
  Responses should be sent via the DECORUM consultation portal: [fictional link]  
  Or by post to: NNSI Consultation, Department for Evidential Coordination and Outcome Regulation, 1 Whitehall Place, London, SW1A 2EA.  

