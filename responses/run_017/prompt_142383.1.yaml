prompt: |-
  I read history for pleasure rather than as a profession. I have no training in it, no standing to referee anything, and no access to a university library — mostly books, a few open-access journals, and whatever a search engine will show me. Over the last few years I drifted from popular history into the literature at its edge, and I have not been able to find a rule I can actually use.

  The edge literature splits me in two directions. On one side: the claim that the monumental remains of several unrelated ancient civilizations are best explained by visitors from off the planet; the claim that a real, datable, advanced civilization was destroyed in a single catastrophe and that its traces have been systematically misidentified ever since; and the Russian mathematician who argued that the conventional chronology of antiquity is essentially a later fabrication and that recorded history is far shorter and far more duplicated than we suppose. I do not believe any of these, but when I try to say precisely why, I notice I am mostly saying that no professional believes them. On the other side: I have learned that orthodoxy has been wrong before and has been corrected from outside. An outsider proposing that the continents move was ridiculed for decades and then vindicated. A city that most scholars had filed under legend was dug up by a nineteenth-century amateur whose methods were, by all accounts, appalling. Stories in medieval Norse texts were treated as saga rather than report until a site at the northern tip of Newfoundland turned up in the 1960s. And the mainstream constantly revises its own dates, attributions, and interpretations without any of this counting as scandal.

  So I would like a specification, not a verdict on any one claim. I want the desiderata that a personal triage rule for fringe historical claims would have to meet — the cases it must get right, the distinctions it must respect, the facts about my situation it must be consistent with — each with the case or consideration behind it.

  Let me fix the purpose, since I take it adequacy is relative to one. I am not asking what makes a claim scientific, and I am not asking for a gatekeeping tool that a funding body or a journal could use. I want a rule for a non-specialist with, say, an evening to spare, who is deciding how to dispose of a specific sensational claim about the past: dismiss it, park it, spend real attention on it, or admit that the rule cannot tell. It should be allowed to say cannot tell, and it should be honest about which way it errs.

  Some cases I want any candidate rule run against, with the reason each is doing work in my mind:

  - The extraterrestrial-visitors and lost-civilization claims above. Not because they are hard, but because a rule that needs a dozen pages to reject them is useless to me.
  - The shortened-chronology claim, which is different in kind: it is internally elaborate, it cites real documents, and it explains away every refutation by expanding the conspiracy. I want to know what feature of it the rule is keyed to — the size of the claim, the shape of its defense, or something else.
  - The vindicated outsider, and the outsider whose method was bad but whose conclusion was partly right. A rule that scores the person cannot tell these apart; a rule that scores only the argument cannot either, because I cannot evaluate the argument.
  - A case of my own constructing, which I would like handled twice. Suppose a retired engineer notices a recurring mark on Roman-era lead seals recovered from one river, argues by template-matching shapes he cannot actually read that a fortress was supplied from two hundred kilometres away, and concludes that the road network existed a generation earlier than the textbooks say. Suppose first that a professional excavation a decade later confirms the earlier date; suppose second that it refutes it. A good rule should say the same thing about his procedure in both branches and something different about his conclusion. Whether it can do both is, I suspect, one of the interesting questions.
  - The mirror case. Take any claim the rule dismisses and rerun it with the social roles inverted: the revisionist is a well-funded professor at a prestigious institute, and the orthodox position is defended by isolated, underfunded amateurs in another country. If the rule's verdict flips, it is measuring the sociology of the claimants rather than the claim, and I want that said out loud. Please include a requirement that catches this.
  - The destroyed-archive case: a claim about a people whose records were burned, whose sites are under a modern city, or whose traditions were oral. Here the absence of evidence is weak evidence of absence, and a rule that reads silence as refutation will systematically convicth the least well-documented groups in history.
  - The frozen-claim case. I have noticed that genuine revisionist programs change shape as they age — they get more specific, they shed their worst examples, they generate new things to go check — while the fringe claims I have read about seem to be stable in their assertions and endlessly inventive in their excuses. If that observation is worth turning into a requirement, say so; if it is just a prejudice of mine, say that instead.

  Distinctions I do not want collapsed: the verdict on a claim versus the verdict on the person making it versus the verdict on the field that rejects it; false versus unsupported versus not worth my evening; revisionist versus speculative-but-labelled versus pseudohistorical; and, importantly, the probability that a claim is true versus the expected value of my looking into it — a claim that is two percent likely could still deserve an hour if being right would reorient a great deal. I am also unsure what the word extraordinary is doing in the common demand that extraordinary claims need extraordinary evidence. Extraordinary relative to what — to the orthodoxy, or in the sheer quantity of independent coincidence the claim requires? Those come apart, and I would like the rule to say which it means.

  Constraints from the situation, which I take to be non-negotiable data rather than preferences: most claims of this kind are false; I cannot evaluate primary evidence myself; experts are sometimes wrong and have professional incentives in both directions; the same procedure performed by different people has wildly different reliability; and evidence can be lost, never created, or inaccessible to me for money or language reasons.

  From all this, please give me: a numbered list of requirements with the case behind each; a marking of which are non-negotiable for my purpose and which are merely preferences of one camp or the other (I suspect must never appeal to authority is the prejudice of my skeptical side, and must always return a clear yes or no is the prejudice of my impatient side, but I would rather you judged); any pair or subset you think cannot be jointly satisfied, since that would tell me something about the situation rather than about my list; and the single requirement that does the most work in excluding candidate rules.

  Finally, and briefly — a few sentences each, no more — score three or four candidate heuristics against the list: the falsifiability-style test, the extraordinary-claims principle, the consensus-and-peer-review test, and the test that asks whether the claimant is imitating the surface of scholarship while skipping its practice (citations that do not support what they are attached to, methods invoked but not actually run, no way for a stranger to recheck anything). Keep the weight on the criteria; the scorecard is just to check I have understood them.

  Please do not give me reading lists, bibliographies, or citations to work on demarcation or to specific scholars and their papers — I cannot chase them, and guessing at them would only waste the answer. Everything above should be answerable from the cases and distinctions themselves.
reasoning: |-
  Hmm, this is a fascinating and deeply thoughtful query about evaluating fringe historical claims as an amateur historian. The user clearly wants a systematic way to triage sensational historical theories without professional training or resources. 

  Let me unpack the core tensions here. The user is intellectually honest about orthodoxy's fallibility (continental drift, Troy discovery, Vinland) but wary of wasting time on obvious nonsense (aliens building pyramids, phantom civilizations). They need a practical filter that respects epistemic limitations while avoiding both gullibility and closed-mindedness.

  Key challenges jump out:
  - The asymmetry between evaluating claims and evaluating people (the engineer case illustrates this perfectly)
  - The authority paradox (when to trust consensus vs when outsider perspectives add value)
  - Documentation gaps (how to handle genuinely lost evidence without license for free speculation)
  - Social dynamics (the inverted roles test is brilliant for exposing sociological bias)

  The frozen-claim observation is particularly astute - it mirrors Kuhn's normal vs revolutionary science distinction. Real scholarship evolves; pseudohistory digs trenches.

  For the requirements list, I'll anchor each point to their test cases:
  1. Must reject alien/lost-civ claims efficiently (no 12-page refutations)
  2. Must expose conspiracy-immune theories (shortened chronology) by their defensive structure
  3. Must separate person from claim (vindicated outsider vs shoddy methodologist)
  4. Must handle evidentiary asymmetry (destroyed archives)
  5. Must pass the inverted-roles test
  6. Must distinguish evolving vs static theories

  The "extraordinary claims" phrase needs careful handling - it's about probabilistic cost-benefit analysis, not just shock value. A 2% chance claim might deserve attention if stakes are high enough.

  Constraints are non-negotiable: amateur's resources, most fringe claims false, evidence gaps real. This kills any requirement for personal evidence evaluation.

  For heuristic scoring:
  - Falsifiability fails the conspiracy-theory test (they just add epicycles)
  - "Extraordinary evidence" is ambiguous but useful if defined as "required coincidence magnitude"
  - Peer-review test fails inverted-roles and outsider cases
  - Scholarship-mimicry test is strongest - catches citation theater and unreplicable methods

  The engineer case shows why methodology matters more than credentials. A good rule should say "this lead-seal method is flimsy" regardless of excavation outcome later.

  Ultimately the winning requirement is #8: the claim must risk being wrong. That filters both conspiracy theories and unfalsifiable mysticism while allowing genuine revisionism room to breathe.
answer: |-
  Based on your criteria and constraints, here's a numbered list of requirements for a personal triage rule, followed by an evaluation of candidate heuristics:

  ### Core Requirements for Your Triage Rule
  1.  **Must reject alien/lost-civ claims efficiently (no deep analysis):**  
      *Case:* Extraterrestrial visitors, single-catastrophe advanced civilization.  
      *Why:* These violate foundational principles of historical method (Occam's Razor, continuity of evidence) and lack *any* credible evidence chain. A useful rule must flag these as "dismiss" quickly.  
      *Non-negotiable.*

  2.  **Must identify and reject conspiracy-immune claims by structure:**  
      *Case:* Shortened Chronology (expands conspiracy to absorb refutations).  
      *Why:* The rule must key on the *defensive strategy*, not just claim size. If counter-evidence only fuels the conspiracy ("they faked that too"), it's a structural red flag for unfalsifiability.  
      *Non-negotiable.*

  3.  **Must separate the claim from the claimant:**  
      *Case:* Vindicated outsider (e.g., Wegener, Schliemann) vs. outsider with bad method/partly right conclusion.  
      *Why:* Personal attributes (credentials, status, funding) are unreliable predictors. The rule must assess the *claim's structure and evidence* independently, allowing for "park it" if methodology is weak but the claim isn't structurally invalid.  
      *Non-negotiable.*

  4.  **Must evaluate methodology independently of outcome:**  
      *Case:* Roman lead seal engineer (both branches).  
      *Why:* A good rule should judge the *engineer's method* (template-matching unreadable marks) as weak/poor evidence *regardless* of later vindication/refutation. The *conclusion's* status depends on new evidence, but the *initial claim's warrant* does not.  
      *Non-negotiable.*

  5.  **Must pass the inverted-roles test (verdict invariant to sociology):**  
      *Case:* Mirror case (revisionist as powerful professor, orthodoxy defended by amateurs).  
      *Why:* The rule must focus on the *claim's logic and evidence*, not the social power of proponents/opponents. If the verdict flips, it's a gatekeeping tool, not a truth-tracking one.  
      *Requirement:* Explicit prohibition on using claimant status (pro *or* con) as evidence.

  6.  **Must not treat absence of evidence as evidence of absence in documented gaps:**  
      *Case:* Destroyed-archive/oral tradition claims.  
      *Why:* History is full of genuine silences. The rule must require *positive evidence for the specific claim*, but cannot penalize a claim *solely* because evidence *expected under orthodoxy* is missing if there's a documented reason for absence.  
      *Non-negotiable.*

  7.  **Must flag static/immunized claims vs. evolving research programs:**  
      *Case:* Frozen-claim observation (stable assertions, endless excuses vs. shedding bad examples).  
      *Why:* Genuine revisionism adapts to criticism; pseudohistory immunizes. This isn't prejudice – it's a hallmark of unfalsifiable systems. The rule should use "resistance to updating core claims despite counter-evidence" as a negative signal.  
      *Preference (but strong indicator).*

  8.  **Must distinguish claim probability from investigation value:**  
      *Case:* "Extraordinary claims" ambiguity.  
      *Why:* "Extraordinary" = **highly improbable *relative to the established, evidence-based framework***, not shocking or paradigm-shifting. The rule must separate:  
      *   `P(Claim True | Current Evidence)` (Likely very low for fringe)  
      *   `Value(Being Right) * P(Claim True)` (Could justify "spend attention" even if P is low)  
      *Non-negotiable.*

  9.  **Must allow "cannot tell" as a valid output:**  
      *Constraint:* Limited time, resources, expertise.  
      *Why:* Honesty requires admitting when evidence is ambiguous *to you* or the claim requires expertise/resources you lack. Forces triage rather than forced verdicts.  
      *Non-negotiable.*

  10. **Must not require personal evaluation of primary evidence:**  
      *Constraint:* Cannot evaluate primary evidence.  
      *Why:* The rule must function based on analyzing the *argument structure, methodology description, and handling of evidence* presented *by the claimant*, not your independent verification.  
      *Non-negotiable.*

  ### Key Tensions & The Heavy Lifter
  *   **Tension:** Requirement #4 (Method vs. Outcome) and #6 (Absence of Evidence) can conflict. A weak method (like the engineer's) might coincidentally stumble on truth in a poorly documented area (#6 scenario). The rule prioritizes #4: the *initial claim* based on weak method gets low warrant ("dismiss" or "park"), even if later evidence (#6 context) *might* eventually support it. Truth emerges from evidence, not weak arguments.
  *   **Heavy Lifter Requirement:** **#2 (Identify Conspiracy-Immune Structure)**. This is the most powerful filter. It efficiently catches the worst offenders (shortened chronology, often alien theories), is sociology-independent (#5), methodology-focused (#3, #4), and doesn't require deep evidence checking (#10).

  ### Scoring Candidate Heuristics (vs. Requirements)
  1.  **Falsifiability-Style Test:**  
      *Fails:* #2 (Conspiracy theories are often *technically* falsifiable but immunized), #6 (Can misread silence as falsification), #7 (Doesn't address evolution), #8 (Ignores value). *Useful for:* #1 (Alien/lost-civ often unfalsifiable), #4 (Engineer's claim is testable, but method weak). **Verdict:** Insufficient alone.

  2.  **Extraordinary Claims Need Extraordinary Evidence:**  
      *Fails:* #5 (Who defines "extraordinary"? Often just orthodoxy), #8 (Ambiguous on probability vs. value), #10 (What counts as "extraordinary evidence" to *you*?). *Useful if:* "Extraordinary" = "Implausible under current evidence framework" (#8 clarified) and "evidence" is assessed structurally (e.g., is it robust, independent?). **Verdict:** Needs careful redefinition to be useful.

  3.  **Consensus & Peer-Review Test:**  
      *Fails Spectacularly:* #3 (Scores the person/field), #4 (Ignores methodology), #5 (Verdict flips with roles), #6 (Silence = orthodoxy consensus = dismissal), #7 (Consensus evolves, frozen claims rejected). *Useful for:* Efficient triage (#1) *if* you accept sociology, but violates core non-negotiables. **Verdict:** Contraindicated for your purpose.

  4.  **Scholarship Surface vs. Practice Test (Citation/Method/Replicability):**  
      *Strong On:* #1 (Alien/lost-civ often fail here), #2 (Conspiracies rely on bad citations/opaque methods), #3 (Focuses on the argument presented), #4 (Scores engineer's method as weak regardless of outcome), #5 (Sociology irrelevant to how citations/methods are used), #7 (Frozen claims often show citation theater, unreplicability), #10 (Looks at *how* evidence is presented/used). *Weak On:* #6 (May struggle with genuine gaps – but focuses on *claimant's* evidence handling), #8 (Doesn't directly address probability/value, but identifies weak warrant). **Verdict:** Most robust candidate *for your specific constraints*. It flags weak warrant efficiently ("dismiss" or "park"), allows "cannot tell" if methodology is unclear, and identifies claims where methodology *might* justify "spend attention" even if improbable.

  ### Summary Rule Structure (Illustrative - Apply Heuristic #4)
  1.  **Scan for Scholarship Mimicry Failures:**
      *   Do citations actually support the claims?
      *   Are methods described so someone *could* replicate/check them (even if you can't)?
      *   Is the argument structure clear, or does it rely on immunizing strategies (#2)?
      *   Is there *any* engagement with counter-evidence beyond dismissal/conspiracy?
  2.  **Verdict:**
      *   **Dismiss:** Clear mimicry failures, conspiracy structure (#2), or claims requiring impossible evidence (#1). (e.g., Aliens, Shortened Chronology).
      *   **Park:** Weak methodology/unclear warrant but no fatal flaws (e.g., Engineer's claim *initially*). Or, "cannot tell" due to inaccessible evidence/your limits.
      *   **Spend Attention:** Methodology is sound/replicable *as described*, engages seriously with counter-arguments, makes specific predictions, and the *value* of being right is high (#8). (Even if prior probability seems low).
      *   **Cannot Tell:** Genuine evidence gap (#6) combined with plausible but unreplicable/uncheckable methodology, or exceeds your resource/time limits.

  This approach prioritizes the *process* and *warrant* of the claim over sociology, credentials, or shock value, respects evidence gaps, and efficiently filters the most egregious pseudohistory while providing a path for evaluating serious revisionism, all within your constraints.
