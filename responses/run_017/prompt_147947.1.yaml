  Okay, let me start by really understanding the user's scenario. They're writing a dissertation chapter on moral worth, specifically challenging the Kantian view that an action only has moral worth if the agent is guided by the thought that it's required. Their supervisor holds this Kantian line, and the user wants to practice against the strongest version. They presented a case of acquired normative aphasia—a paramedic who loses the ability to use normative vocabulary but still acts rightly. The user has two variants: one where the paramedic previously had normative concepts, and another where they never had them. 

  Hmm, the user is cleverly setting up a trilemma for the Kantian view. If moral worth is denied in both cases, it seems too dependent on mere vocabulary. If only granted in the first case, the view shifts to causal history. If granted in both, the duty thought becomes redundant. The user also hints at a robustness account of moral worth based on counterfactual tracking.

  I need to channel a committed Kantian defender. The core principle is non-negotiable: moral worth requires the agent to be guided by the thought of duty. But the user wants concessions on peripheral points—worth as gradable, non-occurrent thoughts, mixed motives, etc. 

  First, I should address the paramedic case. For variant (a), even though she had moral character before, the lesion removes her capacity to be guided by duty. She now acts from inclination or habit, so no moral worth. For (b), same thing—lacking normative concepts entirely means she can't act from duty. 

  The user might push back: isn't this making moral worth hostage to vocabulary? But from the Kantian view, it's not about the words themselves but about the structure of agency. The thought of duty must play a guiding role, even if implicit. 

  Where might this be weakest? Probably in explaining how a dispositional thought of duty functions if it's never occurrent and doesn't appear in deliberation or counterfactuals. The Kantian could argue that the disposition must be responsive to moral reasons in a way that manifests as sensitivity to duty. But if the paramedic reliably acts rightly without any such disposition, that's a problem. 

  The user mentioned a next case involving an agent with normative vocabulary who avows wrong reasons. That might challenge whether avowal affects the guiding thought. But for now, I'll stick to the current case. 

  I should flag the weak point: the Kantian needs to show that the dispositional thought of duty isn't just a placeholder but does real work in distinguishing moral worth from mere reliability. If the paramedic's actions are functionally identical to those guided by duty, yet lack moral worth, what exactly is the added value of the duty thought? That's the vulnerable spot.
answer: |-
  Right, let's take your paramedic case head-on. (And I admire the setup – sharp trilemma.) In both (a) and (b), we must deny moral worth to her actions on the ward. Hear me out before you object that this reduces worth to vocabulary.

  The core isn't the *word* "duty" rattling around her skull, but the *guiding role* of the *concept* of requirement within her practical rationality. Moral worth, on this view, attaches to actions *because* they express the agent's recognition of and responsiveness to moral demand *as* demand. Your paramedic, post-lesion or raised without concepts, manifests splendid *concordance* with duty – she reliably tracks right-making features through finely-tuned sensitivities and inclinations. But concordance isn't worth. She acts *in accordance with* what duty requires, but not *because* it is required. Her agency is structured by "this is distressing," "this feels like what I *do*," or "this aligns with my settled desire to help," never by "this is *called for*," "this is *what I must do*," or "this is *right*." The latter kind of thought provides a distinct form of motivation – acting under the *idea of law* – which is constitutive of the will's determination having moral content. Her actions flow from her empirical character (however admirable), not from her will being determined by the moral law. The loss *is* a loss of character – specifically, the moral dimension of her character structured by understanding reasons *as* binding requirements. The vocabulary loss is merely the symptom; the lesion damages the capacity for a specific mode of practical cognition.

  You're right that in (a), her history doesn't magically imbue her *current* actions with worth – the guiding thought must be operative *now*, even if dispositionally. And in (b), her never having had the concept means that mode of motivation was never available. Conceding worth in either case severs the essential link between worth and the agent's own grasp of the normative force *as* normative force. The "work" the dispositional thought does isn't causal efficacy in deliberation (she might act instantly), but in constituting the *kind* of reason she *takes herself* to have, even implicitly. Her counterfactuals would reveal sensitivity to incentives, not to the *wrongness* of omission. Your robustness account tracks *reliability*, not *moral commitment*.

  **Weak joint:** The hardest pressure point is justifying why this distinct *mode* of motivation (acting under the idea of law) is necessary for *moral* worth, rather than just being one reliable mechanism among others, if the reliably right outcome and underlying concern for others are identical. A case that truly forced me to abandon the view would be one demonstrating a being who *unquestionably* grasps the *authoritative, overriding, reason-giving force* of moral considerations, structuring their choices precisely *as* responses to that authority, yet does so entirely *without* the conceptual resources for "ought," "required," "duty," or any cognate – where we must concede they act *because it's right*, but their cognition lacks the structure of 'requirement'. I don't think your paramedic is that being; she grasps features *we* see as right-making, but not *as* morally demanding. Prove *that* conceptual structure is possible without *any* grasp of requirement, and the core cracks. Now, where's that nastier case? I'm ready.
