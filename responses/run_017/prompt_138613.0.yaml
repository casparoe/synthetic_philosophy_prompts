  For unattractive branches, the path where you answer "no" to both save-reloading and pain-flag modification leads nowhere coherent - if identical copies don't matter AND observer-dependent pain doesn't matter, but you still object to hurting NPCs, there's no consistent position. That gets marked as unoccupied.

  The final tree fits seven questions max, uses all required cases except the redundant determinism one, and reaches all six specified positions plus the "unnamed" dead end. Each leaf has the requested one-line drawback description. The closet-server case appears mid-tree as a secondary test rather than the foundation.
answer: |-
  Here's a concrete, case-driven flowchart avoiding jargon and abstract properties like "consciousness" or "personhood". It resolves your roommate's redundancy concern and hits all your targets:

  **Flowchart: When is it wrong to hurt a video game NPC?**

  1.  **Start: You reload a save after your companion NPC dies.** The game continues with a copy that didn't experience death.
      *   **A: Feels like abandoning the original, wrong not to reload.** ➔ Go to 2
      *   **B: Feels fine, the companion is back.** ➔ Go to 3
      *   **C: Feels manipulative, but the companion isn't harmed now.** ➔ Go to 4

  2.  **The NPC's "mind" is only simulated while on-screen (frustum culling), rest is a lookup table. You hurt it repeatedly just off-screen.**
      *   **A: Feels like torture, wrong even if paused.** ➔ **Leaf: Full-Blooded Simulation Welfarism** (Stuck With: Must oppose switching off the unused closet server simulation, even though no one interacts with it).
      *   **B: Feels less bad/not bad, the experience isn't continuous.** ➔ **Leaf: Threshold/Complexity View** (Stuck With: Must draw an arbitrary line on how persistent/complex simulation needed for moral weight - e.g., why this culling is bad but simpler NPCs aren't?).

  3.  **You install a mod to delete the "pain flag" so villagers don't flinch/react when burned. You do it just for visual preference.**
      *   **A: Feels deceptive/hiding harm, wrong.** ➔ **Leaf: Relational/Observer-Dependent View** (Stuck With: The wrongness depends entirely on potential observers' reactions, not the NPC's intrinsic state).
      *   **B: Feels fine, just editing a file.** ➔ Go to 5

  4.  **A key companion NPC has a scripted, emotional death scene the game makes you care about. You skip the cutscene.**
      *   **A: Feels disrespectful to the story/character, derivatively wrong.** ➔ **Leaf: Derivative Wrongness (Characters aren't Patients)** (Stuck With: Harming NPCs isn't intrinsically wrong, but *this specific treatment* is wrong because it violates narrative/duty/meaning).
      *   **B: Feels fine, it's just a cutscene.** ➔ Go to 3

  5.  **There's a full neural-level simulation of a person running on a server in a closet. No one loads or sees it. You permanently switch it off.**
      *   **A: Feels like killing, wrong.** ➔ **Leaf: Actualism (Only Existing Minds Count)** (Stuck With: Switching off the closet sim is fine, but killing an identical, actively interacting sim would be wrong - value depends on current existence, not potential).
      *   **B: Feels fine, saves electricity.** ➔ **Leaf: No Patients At All** (Stuck With: Must accept that *no* treatment of *any* NPC, however realistic or cruel, is morally problematic in itself).

  ---

  **Key Features & Notes:**

  1.  **Concrete Cases Drive Logic:** Every question uses specific, relatable game mechanics/scenarios. No abstract properties are queried.
  2.  **Resolved Redundancy:** Your roommate was right. The "frustum culling" (Q2) and "deterministic vs. neural net" cases both primarily test **persistence/complexity thresholds**. The culling case is more vivid ("torture just off-screen"), so it's used. Determinism case is cut.
  3.  **Closet Server Placement:** It's crucial, but not the root. It cleanly separates **Actualism** (A5) from **No Patients** (B5) after simpler cases filter other views. Your concession (B5) is a valid endpoint.
  4.  **All Leaves Reached & Characterized:**
      *   **Full-Blooded Simulation Welfarism:** (A2) Wrongness intrinsic to simulated experience. *Stuck With:* Closet server.
      *   **Threshold/Complexity View:** (B2) Wrongness requires sufficient mind-like complexity/continuity. *Stuck With:* Arbitrary line-drawing.
      *   **Actualism:** (A5) Only currently existing/running simulations count. *Stuck With:* Identical sims have different moral status based purely on runtime state (on/off).
      *   **Relational/Observer-Dependent:** (A3) Wrongness depends on impact on observers/context. *Stuck With:* Intrinsic state of NPC irrelevant; hiding pain reactions is the wrong act.
      *   **Derivative Wrongness:** (A4) NPCs aren't moral patients, but *treatment* can violate other duties (to story, creators, players). *Stuck With:* Hurting NPCs *itself* isn't wrong, only context makes it so.
      *   **No Patients At All:** (B5) No moral weight to NPCs ever. *Stuck With:* Accepting extreme, realistic virtual cruelty as ethically neutral.
  5.  **Unattractive/Unoccupied Paths:**
      *   **C1 -> B3 -> A5:** (Reload feels bad -> Pain flag mod is fine -> Switching closet sim is wrong). This combines caring about the *original* companion copy (suggesting potentialism) but then accepting observer-dependence for pain *and* caring about the closet sim (actualism). It's **incoherent** (mixes potentialism and actualism) and **unattractive**.
      *   **C1 -> B3 -> B5:** (Reload feels bad -> Pain flag mod is fine -> Switching closet sim is fine). This suggests caring about the *original* companion (potentialism/continuity) but then denies moral weight even to the closet sim. It's **inconsistent** and **unattractive**.
  6.  **"Unnamed" Position:** The incoherent/unattractive path `C1 -> B3 -> A5` is effectively unnamed and marked by its inconsistency.
  7.  **Distinct Leaves:** The tree cleanly separates all requested leaves. Key differentiators:
      *   **Reload (Q1)** separates Derivative/Relational/Threshold views (A/C) from Actualism/No Patients (B).
      *   **Pain Flag Mod (Q3)** separates Relational (A) from Actualism/No Patients (B).
      *   **Closet Server (Q5)** separates Actualism (A) from No Patients (B).
      *   **Culling (Q2)** separates Simulation Welfarism (A) from Threshold (B).
      *   **Scripted Death (Q4)** isolates Derivative Wrongness (A).

  **Flowchart Summary:** Start with reloading grief -> Test persistence via culling -> Test observer-dependence via pain flag mod -> Test intrinsic value via closet server -> Isolate derivative wrongness via skipping scripted death. This avoids jargon, uses concrete cases, resolves the redundancy, and hits all your targets.
