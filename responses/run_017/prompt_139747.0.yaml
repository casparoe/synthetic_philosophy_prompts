  The core argument seems to be: Hume showed induction can't be deductively justified, but no-free-lunch (NFL) theorems go further by demonstrating that no inductive bias is objectively superior without presupposing that same bias. The user distinguishes this from the weaker "no engineering lunch" claim about universal methods. They're particularly concerned about potential equivocation between three problems: justification for uniformity principles, choice of prior/bias, and truth-tracking reliability.

  Looking at the defeaters they've identified:
