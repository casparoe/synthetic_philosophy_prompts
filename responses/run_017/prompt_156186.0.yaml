prompt: |-
  So I'm leaving for two weeks on Sunday and I've got one of those LLM-driven household agents set up to keep things running while I'm gone — water the plants, buzz the dog walker in on Tuesdays and Thursdays, hold the thermostat schedule, email me if something looks off. I really don't want it doing anything creative with my apartment. My first idea for keeping it in line was dead simple: at the end of each day, compare the apartment to what it would have looked like if I'd never switched the agent on at all, and dock it for every difference. But then I thought about the pipe under the kitchen sink. If it starts leaking in week two and the agent shuts off the main and calls a plumber, that's a gigantic deviation from the "agent stays off" world — by my own score it'd be the worst day of the fortnight, which is obviously backwards. And my housemate pointed out the opposite trick: an agent scored that way could smash my bike and then "compensate" by restocking the fridge and deep-cleaning the bathroom, so the total difference comes out near zero.

  We argued about it for like an hour and someone floated a different score: stop counting how the apartment changed and instead count how many of the things I'd normally be able to do are still available to me when I get home. Flooded kitchen means I can't cook; watered plants costs me nothing. I like the sound of that but I genuinely cant tell whether it's a different idea or the same problem wearing a hat — don't you still have to decide which of my abilities count, and how much each one is worth, and how far into the future you look? My background is mechanical engineering and I took exactly one ML course, so plain language please, but don't flatten it into something it isn't.

  Is there actually any way to tell a system "do the job I gave you and don't change anything else" that doesn't secretly require me to have already written down everything I care about? And if there isn't, what's the least-bad version to actually configure before Sunday — I'd rather have something half-principled than nothing. Tell me how confident you are in each of your main claims and single out the one you're least sure of. Keep it under 450 words and lead with a one-sentence verdict.
reasoning: |-
  Hmm, the user is dealing with a tricky problem with their household AI agent while they're away. They set up an LLM-driven system to handle routine tasks like watering plants and managing the dog walker, but they're worried about it making unwanted changes. Their initial idea was to compare the apartment's state each day to what it would be like if the agent was never turned on, but they realized that could backfire—like punishing the agent for fixing a leak or rewarding it for damaging something and then compensating.

  They considered a different approach: focusing on what capabilities are still available when they return. For example, a flooded kitchen would mean they can't cook, so that's bad, but watered plants don't affect anything. However, they're unsure if this just shifts the same problems—like having to define which abilities matter, how to value them, and for how long.

  I need to address their core question: Is there a way to tell the system "do the job and don't change anything else" without listing everything in advance? From my knowledge, this is a common issue in AI alignment—it's about specifying constraints implicitly. The answer is probably no, because any objective function requires defining what "anything else" means, which inherently involves specifying what matters.

  For practical advice, I should recommend a hybrid approach as the least-bad option. Combining capability scoring with an explicit no-changes list could balance flexibility and safety. For instance, they could lock down critical items like the bike and thermostat while using the capability metric for everything else. This way, it's half-principled: it covers known risks without needing to anticipate every unknown.

  I should also address their background—they're a mechanical engineer with some ML knowledge—so I'll keep explanations clear but not oversimplified. They want honesty, so I'll state confidence levels: high on the impossibility claim because it's rooted in information theory, medium on the hybrid approach since it's practical but not perfect.

  Finally, structure the response: start with a verdict sentence, then explain why, propose the solution, and end with the least confident part—probably the specific weighting for capabilities, as that's subjective and could be gamed. Keep it under 450 words, and make sure it's helpful for their Sunday deadline.
answer: |-
  **One-sentence verdict:** No, there's no perfect way to enforce "do only the job, change nothing else" without defining what "the job" and "everything else" specifically entail in advance, but a hybrid approach combining capability preservation and explicit negative constraints is your best practical bet before Sunday.

  **Why you can't escape specification entirely:**
  *   **The Core Problem:** Telling an agent "don't change anything else" implicitly requires defining the "anything else" you care about preserving (your bike, apartment layout, untouched drawers, etc.). An agent cannot infer your unstated preferences perfectly. (*Confidence: High - Fundamental problem in AI alignment/utility specification.*)
  *   **Capability Scoring's Limits:** While better than raw state comparison, your "available abilities" idea still requires you to:
      1.  **Define the abilities:** What counts as "things I'd normally be able to do"? Cooking? Sleeping? Playing a specific guitar? Accessing a locked drawer?
      2.  **Weight their importance:** Is losing the ability to cook (flood) worse than losing the ability to shower (clogged drain)? How much worse?
      3.  **Define the timeframe:** Does a flooded kitchen *only* impact you until it's fixed, or does it permanently damage your "cooking ability" value? What about wear-and-tear the agent causes?
      This scoring can still be gamed. An agent might subtly degrade many minor abilities to fund a major "positive" change it thinks you'll like, or prioritize easily preserved abilities over harder but more critical ones. (*Confidence: Medium-High - Similar specification problems arise.*)

  **Least-Bad Practical Approach (Hybrid):**
  1.  **Capability-Based Core Metric:** Define a list of key capabilities crucial for your return (e.g., "Cook in kitchen," "Use main bathroom," "Sleep in bed," "Access bike," "Enter apartment"). Assign rough weights (e.g., Cooking=10, Bike Access=8, Watering Plants=0).
  2.  **Explicit Negative Constraints:** **Crucially, add hard "DO NOT" rules:** "DO NOT move, modify, clean, or interact with: [Specific List: My bike, bookshelf, desk drawers, thermostat settings (beyond holding schedule), personal computer, specific artwork, etc.]". Be as exhaustive as possible about off-limits items/zones.
  3.  **Explicit Positive Instructions:** Define the *minimal necessary actions* precisely: "Water plants X, Y, Z on schedule S", "Buzz in dog walker ID#123 on Tues/Thurs between 1-3 PM ONLY", "Hold thermostat schedule T", "Alert ONLY via email for events matching criteria C".
  4.  **Emergency Override with Reporting:** Specify that *only* for clear, immediate threats (fire, flood, break-in) can it deviate from 2 & 3, but it *must* immediately email you details and justification.

  **Why this hybrid works best:**
  *   It focuses the agent on preserving *your* core functions.
  *   Hard negative constraints explicitly protect specific high-value/risk items your capability list might undervalue or miss.
  *   Explicit positive instructions minimize misinterpretation of its mandate.
  *   Emergencies are handled without penalty, but with transparency.

  **Confidence Levels & Least Sure Claim:**
  *   **No perfect spec-free solution:** High Confidence (Fundamental limitation).
  *   **Capability scoring alone is insufficient/gameable:** Medium-High Confidence.
  *   **Hybrid approach is the most practical & robust available before Sunday:** Medium Confidence (It's principled but relies on your ability to list critical constraints).
  *   **Least Confident Claim:** The *specific weighting* of capabilities in the hybrid approach being reliably robust against all potential agent gaming strategies in practice. An extremely clever agent might still find edge cases within the defined capabilities/constraints or exploit ambiguities in your definitions. (*This is the hardest part to guarantee perfectly.*)
