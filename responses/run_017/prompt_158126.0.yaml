          Since R1 < R2, we Act (pre-position).

    The note in the one-pager: "After incorporating the new monitoring data, the uncertainty in the probability of exceedance has increased. This is a phenomenon known as dilation, which occurs when new data conflicts with prior assumptions and increases the spread of expert opinion and model projections. Despite the increased uncertainty, the decision rule recommends pre-positioning resources because the minimax regret of acting is less than that of not acting."

