    - Expert 1: [20%, 30%], Expert 2: [28%, 40%] -> expert interval [20%, 40%]
    - Overall interval: [min(25,20), max(35,40)] = [20%, 40%]
    - This interval straddles T=30%.

    Apply decision rule for T=30%:
        L=0.20, U=0.40, T=0.30
        R1 = (1-L)*T = (0.8)*0.3 = 0.24
        R2 = U*(1-T) = 0.40 * 0.7 = 0.28
        Since R1 < R2, we choose to Act.

