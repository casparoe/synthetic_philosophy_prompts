            (1-L)*T = U*(1-T)   =>   T*(1-L) = (1-T)*U   =>   U = [T/(1-T)] * (1-L)

    But it's easier to just compute the two numbers and compare.

    **Proposed decision rule for each threshold T**:
        If L > T: Act.
        Else if U < T: Do not act.
        Else (interval straddles T): 
            Compute R1 = (1-L)*T   [max regret of acting]
            Compute R2 = U*(1-T)   [max regret of not acting]
            If R1 <= R2: Act
            Else: Do not act

    **Why this rule?** 
        - It minimizes the worst-case regret. 
        - It is consistent with the threshold T (which was set based on cost-benefit) and extends it to intervals.
        - It is computationally simple.

