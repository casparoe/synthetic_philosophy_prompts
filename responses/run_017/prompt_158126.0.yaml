  **Case 2: Dilation Case**
    - Before new data: model outputs [10%, 12%, 15%] -> [10%,15%]; experts: [8%,18%] and [12%,20%] -> [8%,20%]; overall [8%,20%].
    - New data comes in. After conditioning:
          models: [5%, 25%] -> [5%,25%]; experts: [5%,30%] and [10%,40%] -> [5%,40%]; overall [5%,40%]. The interval is wider.
    - For T=15%: 
