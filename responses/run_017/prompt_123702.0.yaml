prompt: |-
  Hi — hoping you can help me build something for my second-year seminar on the boundaries of cognition. I've got halfway to this case about four times now and then tied myself in knots, so I'm outsourcing.

  Context: the students have already done Otto and Inga, the parity principle, and the four trust-and-glue conditions (the resource is reliably available, easy to get at, automatically endorsed when consulted, and was endorsed at some point when it was taken up). What they always miss is that parity is a test on the functional profile of the resource and says nothing whatsoever about whose mind is in question. I want a case that makes that vivid rather than me just asserting it.

  Three criteria I want the case to separate:

  1. Parity plus glue, Clark/Chalmers style: if the external thing plays the same functional role an internal belief would — reliably there, automatically endorsed, guiding action the same way — then it realises a belief, full stop, no further questions.

  2. A practice-based or integrationist criterion, roughly the Menary/Sutton end of the literature (don't worry about attribution, I write my own handouts): a resource counts only when it's woven into a learned cognitive practice. The agent was trained into the routine of using it, the using is plastic and skill-shaped, and agent and resource have been mutually reshaped by the routine.

  3. My own hobby-horse, which I've never managed to convince anyone of. Call it the revision-profile test: a candidate external state is part of your mind only if a silent change in its content shows up for you as correcting yourself rather than as dealing with a faulty instrument. Contrast discovering you've misremembered something — you revise, the earlier state now seems to have been wrong first-personally, you'd say I was wrong — with discovering your satnav has an outdated map, where you're annoyed at the device and nothing in you needed putting right. Correction or repair: which shape does the mismatch have?

  Specs for the case:

  - One paragraph. Ordinary contemporary setting, a real workplace with several people doing a real job. No implants, no science fiction, no telepathy, no uploads.
  - It has to satisfy the glue conditions at least as well as Otto's notebook does. So the no I'm after from criterion 3 must not come from the resource being unreliable, awkward to access, distrusted, or imposed on anyone, and not from the agent being inexpert with it.
  - The same token physical resource should be doing the belief-work for more than one person at the same time, with none of them individually maintaining it or able to reconstruct it on their own — upkeep spread across a rotating group.

  The verdicts I need: criterion 1 says yes, and I want the consequence spelled out, that the very same inscription is literally in several minds at once. Criterion 2 also says yes, but tell me what in the case it's keyed to, and tell me whether I can tweak the case so that 1 and 2 do come apart — say a resource so frictionless nobody needs any training to use it. Does the practice criterion really say no there, or am I overreading it? Criterion 3 says no, and I want your honest view on whether that's because the test is doing real work or because it's just a demand for memory-ish phenomenology in a nicer coat.

  Then the part I actually care about:

  - Walk each criterion through the case and let the verdicts fall out of the criteria rather than stipulating them. If you catch yourself smuggling a verdict in, flag it.
  - Name the single structural feature doing the work, and show what happens when I remove it. I expect it collapses back into something indistinguishable from Otto, with all three criteria saying yes — confirm that or tell me where it goes wrong.
  - Then: what does a parity theorist say about criterion 3? My worry is that it over-generalises and says no about Otto as well, in which case it isn't a friendly amendment to parity but a rival to it, and I should stop presenting it as the former. Which is it?
  - And: are these specs jointly satisfiable, or have I built in a contradiction? If one of them can't be met alongside the others, say which and what I should relax.
  - Last thing: tell me which of the standard objections my students always reach for — the derived content / mark of the cognitive point, the coupling–constitution fallacy, the cognitive bloat worry — are genuinely available against the case you've built, and which you've designed out. I'd rather the seminar land on my hobby-horse than spend a third week on Adams and Aizawa.

  Sorry, that's a lot. Write it in British English please, the department gets twitchy about -ize endings.
reasoning: |-
  Hmm, the user is a philosophy professor designing a seminar case study on extended cognition. They need a concrete example that distinguishes three criteria: Clark/Chalmers-style parity, Menary/Sutton-style practice integration, and their personal "revision profile" test. 

  Key requirements: must be a mundane workplace scenario where a shared physical resource (1) satisfies all four trust-and-glue conditions for multiple users simultaneously, (2) demonstrates functional parity, (3) shows practice-based integration, yet (4) fails the revision-profile test. Crucially, the same token resource must serve as "belief" for several people with distributed maintenance.

  The challenge is avoiding students defaulting to standard objections (derived content, coupling-constitution, cognitive bloat) while cleanly separating the criteria. The professor particularly wants to validate their revision-profile criterion without it collapsing into memory phenomenology or overgeneralizing to Otto-like cases.

  For the case: A hospital medication whiteboard fits well. Nurses share a physical board updated by rotating staff, satisfying glue conditions (reliable, accessible, automatically consulted). Parity criterion should see the board's contents as literal shared belief. Practice criterion is met through trained chart-checking routines. But when outdated, nurses blame "the board" rather than feeling self-corrected - precisely illustrating the revision-profile failure.

  Structural linchpin is the distributed upkeep. Remove that (e.g., single nurse maintaining personal notebook) and all criteria align yes like Otto. The parity theorist would likely reject the revision-profile test as smuggling in internalist biases, though it needn't overgeneralize to Otto if personal notebooks trigger first-person correction. 

  Standard objections are largely designed out: no derived content issue (direct informational use), no coupling-constitution fallacy (functional role is central), minimal bloat (domain-specific). This should steer discussion toward the revision-profile distinction as intended.

  British English compliance noted - will stick to -ise endings and local terminology like "A&E".
answer: |-
  Right, let's crack on. Here's a case built to your specs, followed by a thorough walkthrough addressing all your points.

  **The Case: The Hospital Ward Medication Whiteboard**

  On a busy NHS hospital ward, the current medication schedules and critical patient alerts for all 30 beds are centrally displayed on a large, physical whiteboard in the nurses' station. It's updated *immediately* whenever a doctor's order changes, a drug is administered, or a patient's status shifts, by whichever nurse, junior doctor, or HCA is free – upkeep is genuinely distributed across the rotating shift. All clinical staff (nurses, doctors, HCAs) have undergone mandatory training on its use, including standardised symbols and update protocols, making consultation and updating a seamless, skilled routine deeply embedded in their workflow. They consult it constantly, automatically, and *always* act directly on its information without second-guessing (e.g., administering meds, preparing for procedures). It is the definitive, trusted source; nobody relies on unaided memory for this critical data. However, when a rare error is discovered (e.g., a dose was written wrong, missed, or an alert outdated), the immediate reaction is universally frustration *directed at the board* or the colleague who updated it ("The board's wrong!", "Who updated this incorrectly?"). Staff feel they need to *repair the faulty resource* or *correct the colleague's mistake*, not that they themselves were mistaken and need to *correct their own belief*.

  **Walkthrough of Criteria & Verdicts**

  1.  **Parity + Glue (Clark/Chalmers): YES (The inscription is literally part of multiple minds simultaneously).**
      *   *Application:* The whiteboard information plays *exactly* the functional role an internal belief about medication schedules/patient alerts would play for each staff member. It is constantly available (glue 1), instantly accessible (glue 2), automatically endorsed and acted upon without question (glue 3), and the information was originally endorsed (taken up) when written by a colleague following protocol (glue 4). It reliably guides action (med administration) just like a biological memory/belief would. Parity demands that if it plays the same functional role, it *is* a belief. Crucially, the functional role is *identical* for multiple users simultaneously. Therefore, the *same token physical state* (the current inscriptions on the board) realises a belief state *in multiple minds at once*. This is a direct consequence of applying parity strictly – the functional role defines the belief, regardless of how many brains it's coupled to.
      *   *Structural Feature:* Distributed, simultaneous, functionally identical access/use by multiple agents. Remove this (e.g., only one nurse uses a personal whiteboard, like Otto’s notebook), and it collapses into standard Otto: one agent, one extended belief. All criteria would likely say yes.

  2.  **Practice-Based/Integrationist (Menary/Sutton-esque): YES (But requires the skilled practice).**
      *   *Application:* The whiteboard isn't just *used*; it's integrated into a highly trained, plastic, skill-shaped cognitive practice. Staff weren't just told *about* it; they were trained *into* the routines of consulting and updating it – the gestures, the glance patterns, the timing, the symbol interpretation are all learned skills. The practice shapes how they think and act moment-to-moment. The resource (board layout, protocols) and the agents' skills have co-evolved through this routine. Therefore, it meets the practice criterion – it's a cognitive practice involving the external resource.
      *   *Keyed To:* The mandatory training, the development of specific skilled routines (glancing pattern, update speed/accuracy), the co-evolution of user skill and resource protocol/design.
      *   *Tweaking for Frictionless Use:* Could we design a resource so intuitive ("frictionless") that *no* training is needed? Imagine a magical, perfectly intuitive display that anyone understands instantly. Would practice say NO? Likely *yes, it would still say yes*, but for a different reason. Menary/Sutton emphasise *cognitive practices* – organised, often culturally transmitted, ways of thinking *with* tools. Even a frictionless tool becomes part of cognition *through its use in a practice*. The "skill" might be minimal (just looking/understanding), but the *integration into a workflow* (the *practice* of relying on it for critical actions in this context) is still key. Pure frictionlessness *might* push towards parity, but practice theorists would likely argue that seamless integration into action *is* the cognitive practice, even if easily acquired. To *really* make 1 and 2 come apart, you'd need a resource satisfying glue/parity but used *without* any stable, learned routine – pure ad-hoc, one-off consultation. But this likely violates glue (especially reliability and automatic endorsement) as per your specs.

  3.  **Revision-Profile Test (Hobby-Horse): NO (It's repair, not self-correction).**
      *   *Application:* When an error is found, the phenomenology is clear: staff blame *the board* or *the updater*. They feel the need to *fix the tool* or *correct someone else's action*. There's no first-person sense of "*I* was wrong". They don't say "I misremembered the dose"; they say "The board *had* the wrong dose". The mismatch manifests as dealing with a faulty instrument or colleague error, not as discovering a flaw in *their own* cognitive state needing revision. Therefore, by this test, the board's state is not part of *their* mind, even while satisfying parity and practice criteria.
      *   *Is the Test Doing Real Work?* Yes, I believe it is. It's not *just* demanding memory-ish phenomenology. It's probing the *locus of epistemic responsibility and the character of error*. In self-correction (true belief), the error feels internal; the state was *mine* and *wrong*. In repair, the error is external; the state was a *representation I used* that *failed*. The test captures a crucial difference in *attribution and the experience of error* that functional role (parity) and practice integration might miss. It targets the first-person perspective on the state's status.

  **Addressing Your Core Queries**

  1.  **Structural Feature & Removal:** The linchpin is **distributed upkeep/authority and simultaneous shared functional dependence.** The *same* token state is depended upon identically by multiple agents, none of whom individually controls or could reconstruct it. *Remove this:* If one specific nurse (Nurse Otto) is solely responsible for maintaining her *own* dedicated, personal medication whiteboard that only *she* consults and updates, then:
      *   Parity: YES (Classic Otto).
      *   Practice: YES (Her skilled routine integrates it).
      *   Revision-Profile: Likely YES (Discovering *her* notebook has an error *she* made would probably feel like "*I* got it wrong", a self-correction, especially if she wrote it herself. If someone *else* sabotaged it, it *might* feel like repair, but the normal case leans towards self-correction). This collapses to the Otto case with all three saying yes. The distributed nature is essential for driving the revision-profile 'no'.

  2.  **Parity Theorist on Criterion 3:** A strict parity theorist (Clark/Chalmers) would likely **reject Criterion 3 as smuggling in internalist bias.** They would argue:
      *   Functional role is *all* that matters for belief realisation. Phenomenology of error correction is irrelevant. If the state plays the belief role functionally (as Otto's notebook and the whiteboard do), it *is* a belief. Full stop.
      *   Applying the revision test *would* overgeneralise and say "no" to Otto. If Otto found an error in *his* notebook that *he* wrote, he might feel self-corrected ("*I* wrote that wrong"). But if the error was due to fading ink he couldn't control, or if Inga found an error *she* made in *her* biological memory, her phenomenology might be annoyance at her "faulty memory faculty" rather than pure "I am wrong". The phenomenology is messy and depends on *how* the error occurred, not strictly on the *location* of the resource. The parity theorist would say your test confuses the *cause* of error with the *constitution* of the belief state. **Therefore, Criterion 3 is not a friendly amendment; it's a fundamental rival.** It introduces a first-personal, phenomenological condition that parity explicitly rejects as necessary for belief status.

  3.  **Joint Satisfiability:** The specs **are jointly satisfiable** by the case given. The distributed upkeep/shared dependence creates the scenario where the revision-profile differs starkly from Otto, while glue conditions and practice integration are robustly met. The key was finding a real-world scenario where multiple individuals are functionally identical in their dependence on a single, externally maintained resource *that none of them individually owns or controls*.

  4.  **Standard Objections & The Case:**
      *   **Derived Content / Mark of the Cognitive (Adams & Aizawa):** *Potentially available, but weakened.* The objection is that only intrinsic, non-derived content is truly cognitive. The board's content *is* derived (from doctors' orders, training, protocols). However, your case emphasises *use* over origin. The students *will* likely reach for this. Counter: Parity/practice theorists argue that *how* the content is *functionally employed* in the cognitive system is what matters, not its origin. The board's content plays the *same functional role* as non-derived internal beliefs in guiding action. This objection hasn't been "designed out" entirely, but the functional emphasis makes it less immediately decisive against the case.
      *   **Coupling-Constitution Fallacy:** **Largely designed out.** The case isn't just claiming that the board is *coupled* to cognition; it's arguing that it plays the *constitutive functional role* of a belief state *because* of the glue conditions and functional parity. The focus is on the *role* it plays, not mere causal interaction. The distributed aspect reinforces that it's about the functional contribution, not just coupling.
      *   **Cognitive Bloat:** **Mostly designed out.** The resource is domain-specific (critical medication/patient data), indispensable, deeply integrated via training and constant use, and its use is regulated by professional protocols. It's not some random, easily attachable sticky note. It meets the "trust and glue" conditions robustly, acting as the *primary* source for this vital information, preventing arbitrary extension. Students might still worry ("What about the hospital floorplan on the wall?"), but the specificity and centrality of the whiteboard's role provide a clear boundary.

  **Conclusion:** The Hospital Whiteboard case cleanly separates the criteria as requested. Parity demands we accept the shared inscription as literally part of multiple minds. Practice integration confirms its deeply woven status. Your revision-profile test highlights a crucial phenomenological and first-personal difference, suggesting that despite functional parity and practiced integration, the *locus of epistemic ownership* differs. Crucially, this reveals Criterion 3 as a *rival* to parity, not an amendment, as it introduces a condition (first-personal error phenomenology) that parity explicitly rejects. The distributed upkeep is the key structural feature enabling this separation. Standard objections are present but manageable, especially bloat, allowing you to steer discussion towards your hobby-horse and the implications of the revision-profile difference. Good luck with the seminar!
