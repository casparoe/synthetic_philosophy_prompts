answer: |-
  ## Life Cycle of a Star: A Sestina on Persistence

  Consider first the cloud, a primal *WHOLE*
  of dust and gas, collapsing from its place.
  Does *SAME* identity persist? We take a *SLICE*:
  a dense core forms, begins to fiercely *BURN*.
  Is it the infant star already *NOW*,
  or just the prelude to what comes *THEN*?

  Millennia pass. What *THEN* was cold and vast
  condenses, heats. On sequence, *BURN* grows bright
  with steady fusion. Is the star the *SAME*
  bright sphere, enduring change? Or just a *SLICE*
  of something greater? Can it be the *WHOLE*
  thing, hot and dense, contained within this *NOW*?

  Observe it *NOW*, a red giant immense,
  its outer layers cool, distending far.
  Does *SAME* the star hold all its phases *WHOLE*,
  or must we see the past – the hotter *THEN* –
  as separate? Perhaps each temporal *SLICE*,
  extended, owns the processes that *BURN*.

  For fusion needs duration: how to *BURN*
  if *NOW* is point-like? Grant each stage a span!
  Let overlapping *SLICE*s share the fire
  that builds the heavy ash. The *SAME* brief span
  might hold both kindling *NOW* and cooling *THEN*.
  But can the *WHOLE* career be summed from parts?

  If parts extend, what makes a *SLICE* ignite?
  Does *SAME* the burning start within the part,
  or must we carve again? That cooling *THEN*,
  the white dwarf cinder, faintly glowing *NOW* –
  is it the star, the final, fading *WHOLE*?
  Or did the star cease when it ceased to *BURN*?

  Where does the *WHOLE* career begin, or cease?
  The protostellar clump? The ash? Each *SLICE*
  demands its edge. Can phases, hot *THEN* cold,
  be truly *SAME*? The core still holds the *NOW*
  of latent heat, though fusion ceased to *BURN*.
  The question lingers, past the final *THEN*.

  **Envoi**
  This fading ember *BURN*s with all it burned.
  *WHOLE* in each *SLICE*? Or *SAME* thing changed? The *NOW*
  holds echoes of *THEN*. One star? Or many? *SLICE*.

  ---

  **Note**
  *SLICE* tracks temporal parts; *WHOLE* signals endurantism; *SAME* questions identity; *BURN* embodies processes needing time; *NOW* and *THEN* frame change. The envoi leaves both views unresolved but palpable.
