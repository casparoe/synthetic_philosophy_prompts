prompt: |-
  I'm a junior at a fairly large public high school, and I've started going to school board meetings this year because our district has been arguing about how to tell whether its own programs work. I'd like your help figuring out what our district's reporting rules actually assume. The argument has stopped making sense to me, and I think the part I'm stuck on is conceptual rather than statistical.

  Here is what the district does. Every spring we take a common end-of-course algebra exam. Students are placed into four cohort bands, Band 1 being the lowest, using their score on the previous year's exam, and the bands are re-cut every year so that each one always holds a quarter of the students: they are percentile bands, not fixed score ranges. The district publishes the percentage passing within each band, and it also publishes each school's overall pass rate, which is the number the local paper and the state report card use to rank schools. When the district evaluates its algebra support block, an extra period that students below a cutoff are placed into, it compares this year's pass rate inside each band with last year's pass rate inside that same band; it refuses to compare students in the program with students not in it, and it refuses to compare the district-wide rate from before the program existed with the district-wide rate after. When it defends the program to the board, though, it shows a slide of the district-wide rate before and after. At any school where a band has fewer than twenty students, that band's rate is suppressed entirely, and the school is still ranked on its overall number.

  The year the program was expanded, ninth graders who used to take algebra in tenth grade were moved into it, so the pool of test-takers changed. Every band's pass rate went up and the district-wide rate went down. I've since read that this kind of reversal has a name, but the explanations I find just say to control for the confounding variable, which doesn't settle anything for me. My worry is the percentile bands themselves. Because they are re-cut annually, this year's Band 2 and last year's Band 2 are not the same kind of students: if the cohort as a whole scores higher on the earlier exam, this year's Band 2 is made of students with higher old scores than last year's Band 2, so improvement within bands across years looks like it could be mostly bookkeeping. The district's own principle is that you must compare like with like, and re-cutting the bands seems to break that principle while also being what makes the reversal possible. On top of that, the quantity being held fixed, last year's score, is itself something the program is supposed to raise over time, which feels like holding fixed the very thing you are trying to measure.

  So what I want is not a verdict on whether this is good statistics. I want to know what the package of rules presupposes. What view of what a rate is, or of what it is for a program to make a difference, or of what makes two groups comparable, would someone have to hold for these rules to be the right ones? Does the district have to think of a rate as a fact about a population rather than about a school or a program, and of causation as difference-making rather than association, or could some quite different view license exactly the same rules? Which parts of the package follow from that view, and which are just habits that happen to sit well with it, so that several views would permit them? I'd especially like to know whether the package contradicts itself, since the district ranks schools on the unadjusted number while refusing to judge the program on it, or whether that only looks contradictory because the two numbers answer different questions. And if the district decided that the only honest comparison is each student against their own earlier score, with no bands at all, what would it lose by that change, and would the loss be real?

  Please answer in continuous prose, with no headings, no bullet points, no bold text, and no tables, the way you would write a long email. Assume I know no statistics beyond averages and percentages and no philosophy beyond what I've said; if a term like confounder or counterfactual is carrying weight in your answer, explain it in a sentence instead of leaning on it.
reasoning: |-
  Okay, the user is a high school junior deeply engaged in their school district's evaluation methods for an algebra support program. They're grappling with conceptual inconsistencies in how the district measures success, particularly around percentile bands and pass rates. Their core question isn't about statistical validity but about unpacking the underlying assumptions behind the district's reporting rules. 

  The student has clearly done their homework—they've noticed the Simpson's Paradox-like reversal (where band-specific rates rose while overall rates fell), understand that re-cutting bands annually changes the comparison pool, and sense tension in the district simultaneously using and rejecting certain metrics. Their frustration is philosophical: What worldview makes these rules coherent? 

  Three layers need addressing: First, the percentile bands imply that "student ability" is fixed relative to peers each year, treating the cohort as a static entity rather than acknowledging improvement could shift the entire distribution. Second, the refusal to compare program/non-program students suggests discomfort with observational studies, prioritizing like-with-like matching over real-world contrasts. Third, the suppression of small bands reveals an unspoken belief that statistical significance trumps transparency. 

  The apparent contradiction in using overall rates for school rankings but not program evaluation might stem from different purposes—rankings accept crude snapshots while program assessment demands rigor—but it still exposes cognitive dissonance. If the district switched to student-level growth scores, they'd gain causal clarity but lose the simplicity of banded benchmarks they seem to value for communication. 

  What's unsaid but felt: The student suspects the system obscures whether the algebra block truly helps. Their request for "presuppositions" is really about power—which truths the methodology makes visible or invisible. That's remarkably astute for a junior. I should honor that insight while avoiding jargon, like explaining "confounder" as "a hidden factor that mixes up cause and effect" if needed.
answer: |-
  I appreciate you digging into this—it's impressive for a junior to grapple with these conceptual knots. Your confusion is understandable; the district's methods rest on a specific, somewhat narrow view of what constitutes a "fair" comparison, and that view has consequences. Let me unpack the presuppositions step by step, as if we were talking it through.

  At the heart of the district's approach is a belief that the *only* valid way to judge a program's effect is to compare students who were "identical" *before* the program existed. They fixate on last year’s test score as the single, defining marker of that identity. By slicing students into bands based *only* on that prior score, and then comparing this year’s Band 1 to last year’s Band 1 (and so on), they assume they’ve created perfectly matched groups. This presupposes that the prior score captures *everything important* about a student's potential to pass the current exam—that nothing else (like motivation, other instruction, or even natural growth) meaningfully changes how a student in Band 1 this year relates to a student in Band 1 last year. It treats students as static points defined by one test snapshot. The refusal to compare program participants to non-participants, or to look at the overall pass rate for the program, stems from this same fear: they worry that students *not* in the program might be fundamentally different kinds of learners (brighter, more advantaged) than those placed in the extra block. They see those groups as inherently "unlike," so comparing them feels misleading. They want to isolate the program's effect by holding the "student type" constant.

  The re-cutting of bands annually is crucial to this logic, but it creates the very problem you spotted. By forcing each band to always contain exactly 25% of the cohort, the district presupposes that the *relative standing* of students (being in the bottom quarter, middle quarter, etc.) is the fixed, meaningful thing—not the actual skill level the score represents. If the whole cohort gets better at the prerequisite skills tested last year, this year’s "Band 2" student actually has a higher *old* score than last year’s "Band 2" student. The district’s method interprets an increase in Band 2’s pass rate as improvement *within* that "type" of student (the "middle-quarter" student). But really, it might simply reflect that this year’s "middle-quarter" student started from a stronger baseline. This is why the reversal happens: adding more students (the younger graders) lowered the overall average pass rate (perhaps because they were less prepared on average), but *within each relative slice*, the students were stronger than the same slice last year, so their pass rates went up. The bands focus on relative position, masking the absolute shift in the pool. The district holds fixed the very thing (prior score relative to peers) that they also aim to improve over time, which can make real progress hard to see or even make regression to the mean look like success.

  The suppression of bands with fewer than 20 students reveals another presupposition: that rates based on small groups are inherently unreliable or noisy. They prioritize statistical stability over transparency or completeness. This, combined with still publishing the overall school rate, assumes the overall rate is a sufficiently robust summary, even if its components are hidden. It privileges a single, potentially misleading number for public consumption.

  This brings us to the seeming contradiction. The district defends the program using band-vs-band comparisons (claiming "like with like") but ranks schools using the overall pass rate. The presupposition here is that these numbers answer fundamentally different questions. The band comparisons are seen as answering: "Did this program help *this specific type of student* compared to last year's *identical type*?" They view this as a causal question about the program's impact on defined groups. The overall pass rate, however, is treated as answering: "What is the current *outcome* for this school as a whole?" They see this as a descriptive snapshot for accountability or ranking, not necessarily a direct measure of any single program's effect. They might argue the overall rate is influenced by too many factors (changing demographics, cohort size, other initiatives) to blame or credit one program. While this distinction exists, the contradiction arises because they *use* the overall rate *to defend the program* ("look, it went up after we started!") while simultaneously dismissing it for formal evaluation because it's "confounded." This inconsistency suggests a willingness to use whichever number suits the narrative at the moment, undermining their own principle of rigorous comparison.

  If the district switched to comparing each student to their own prior score (tracking individual growth), it would fundamentally shift the presuppositions. It would abandon the idea that students must be grouped into "types" based solely on one prior snapshot. Instead, it presupposes that the *change* for each individual is the core measure of success, implicitly accounting for where they started. This would directly measure whether students are improving relative to their *own* baseline, which is often closer to what we want to know about a support program. The loss would be the simplicity of the fixed "bands" framework and the easy year-to-year band comparison they currently rely on. They’d lose the ability to say "Band 1 improved by X%," because Band 1 would be different students each year. They’d gain a clearer, more individualized picture of progress, less vulnerable to the reversals you observed. The loss of the band structure is real in terms of their current reporting habit, but the gain in conceptual clarity and resistance to statistical artifacts like the reversal would likely be more valuable for understanding if the program truly works.

  Ultimately, the district's package of rules presupposes a world where students are neatly categorized by a single past test score, where those categories perfectly define comparable groups across years, and where isolating "like" groups is both possible and the *only* legitimate way to infer cause. It prioritizes internal matching over real-world context or holistic outcomes. The reversal exposed a flaw in this, showing how their definition of "like" can drift. While not entirely self-contradictory, the tension between their strict comparison principle for the program and their use of the overall rate for schools/promotion highlights the challenge of applying a narrow ideal of "fairness" in a messy system. A shift to individual growth wouldn't solve every problem, but it would better align the measurement with the goal: seeing if students are learning more than they would have otherwise.
