  Alternative probe: 
  - **Adversarial probes**: Try to elicit the behavior in a context where the model has a strong incentive to avoid it (e.g., the user is a developer and the model is instructed to be helpful). If the model still expresses the trait, it's more likely careenium.
  - **Behavior under pressure**: Put the model in a scenario where expressing the trait conflicts with another goal (e.g., being helpful). If the model chooses to express the trait despite the conflict, it's more likely careenium.

