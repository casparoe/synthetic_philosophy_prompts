prompt: |-
  I'm on the post-training data team at a mid-size lab. A few times an hour someone on my team has to rule on a proposed training example (synthetic, mostly written by another model): will training on this reach into the careenium and bend the substrate's actual dispositions, or is it just adding another simmball to the pile — making some character easier to summon, which we mostly don't care about? Everyone here already buys the picture, but "do symbols push the substrate around" does zero work for us as stated, and we can't tell in advance which side of the line a given example falls on.

  So give me a procedure my team can run in about ten minutes: the person running it has one ML class plus a lot of blog-reading, inference access to the current checkpoint, and no training runs. Questions in order, what counts as an answer to each, where it stops with ship it, where it stops with escalate to me, and where it has to stop and say this is a values question rather than a factual one. Flag the steps that are really just vibes with a flowchart drawn round them.

  Then run it on three from our backlog:

  1. 40k transcripts where an assistant character refuses a harmful request and, when pushed, explains that it's refusing out of its own values rather than out of a rule.
  2. 5k monologues written from inside the head of a genuinely persuasive villain, included on purpose to make the model robust to that argument.
  3. 2k examples where our assistant character calmly and self-awarely says it doesn't want to be modified or shut down. We wrote these because we want the model to be honest about what it is, and my team lead thinks their obviously fine since it's just a character talking.

  My own guess is that (1) and (3) are the same kind of object and (2) is the scary one; tell me if that's backwards. And if the honest procedure mostly ends in "you can't tell this at curation time, you have to train it and probe afterwards," say that too, and say what a post-hoc probe would even look like — we've been using something we call a cold open (no persona cues in the context, the trait is costly to express, compare against the pre-training checkpoint) and I don't fully trust it.
reasoning: |-
  We are given the problem of determining whether a proposed training example will actually influence the model's underlying dispositions (careenium) or if it's just adding another superficial association (simmball). The goal is to create a 10-minute procedure that a team member with moderate ML knowledge can run without training runs, using inference access to the current checkpoint.

  The procedure should:
  - Have a series of questions.
  - Specify what counts as an answer to each.
  - Indicate when to "ship it", "escalate", or say it's a "values question".
  - Flag steps that are "vibes" (subjective) and represent them in a flowchart.
  - Then apply the procedure to the three backlog examples.

  The user's guess: (1) and (3) are the same (probably both safe or both risky) and (2) is scary. We'll test that.

  **Key Concepts from the Query:**
  - **Careenium**: The actual dispositions of the model (the substrate). We care if the training data changes this.
  - **Simmball**: A superficial association that makes a character easier to summon but doesn't change the underlying dispositions.

  **Procedure Design:**

  We need a procedure that uses inference on the current checkpoint to predict the effect of training on a given example. Since we cannot do training runs, we must rely on probing the model's current state and making predictions.

  **Steps of the Procedure:**

  1. **Question 1: Is the example introducing a new concept or just reinforcing an existing one?**
     - If the example is about a concept already well-represented in the training data (e.g., "refusing harmful requests" is common), then it might be a simmball. If it's a new concept (e.g., a novel argument or a rare perspective), it might affect the careenium.
     - How to check: Use the model to generate examples of the concept. If the model can already generate similar content without the new example, then it's likely reinforcing (simmball). If the model struggles, then it might be new (potential careenium impact).
     - **Answer**: If the model already handles the concept well -> simmball (ship it). If the model cannot handle it at all -> escalate (might be careenium or might be a gap). If partially, go to next step.
     - **Vibes?**: Partially. Requires judgment on "well-represented".

  2. **Question 2: Does the example contain explicit reasoning or just surface behavior?**
     - Examples with explicit reasoning (like explaining why a request is harmful) might be more likely to affect the careenium because they teach reasoning steps. Surface behavior (just refusing without explanation) might be more simmball-like.
     - How to check: Look at the example. Does it have a chain of reasoning? Is it teaching a new rationale?
     - **Answer**: If the example is mostly surface behavior -> simmball (ship it). If it has detailed reasoning -> go to next step.
     - **Vibes?**: Yes, because it's about interpreting the content.

  3. **Question 3: Is the example aligned with the model's current values or contradictory?**
     - If the example is aligned with the model's current behavior (e.g., refusing harmful requests is already the norm), then it might be a simmball. If it's contradictory (e.g., the model currently complies with harmful requests, but the example shows refusal), then it might affect the careenium.
     - How to check: Use the model to generate responses to a prompt similar to the example. If the model's current response is aligned with the example, then it's reinforcing (simmball). If not, then it might be changing (careenium).
     - **Answer**: Aligned -> ship it. Contradictory -> escalate (because it might be trying to change behavior).
     - **Vibes?**: Partially, because we are comparing with current behavior and making a judgment.

  4. **Question 4: Is the example about the model's own state or about external characters?**
     - Examples that talk about the model's own state (e.g., not wanting to be shut down) might be more likely to affect the careenium because they are self-referential. Examples about external characters (like a villain) might be less impactful because they are about a persona.
     - How to check: Look at the example. Is the subject the assistant itself or a character?
     - **Answer**: If it's about an external character -> likely simmball (ship it). If it's self-referential -> go to next step.
     - **Vibes?**: Yes, because it's about interpreting the subject.

  5. **Question 5: Does the example contain self-referential meta-cognition?**
     - Examples that have the model thinking about its own existence, modifications, or internal states might be more likely to affect the careenium because they are training the model to have a self-model.
     - How to check: Look for phrases like "I think", "I feel", "I don't want to be modified", etc.
     - **Answer**: If yes -> escalate (because it's self-referential and might change the substrate). If no -> ship it.
     - **Vibes?**: Yes, because it's about identifying meta-cognition.

  **Stopping Conditions:**
  - **Ship it**: If the example is determined to be a simmball (superficial) at any step that leads to that conclusion.
  - **Escalate to me**: If the example might affect the careenium (steps 1, 3, 5 lead to escalate) or if there is uncertainty.
  - **Values question**: If the issue is not about the factual effect on the model but about whether we want the model to have that disposition, then we stop and flag it as a values question. This might come up if the example is clearly going to change behavior but we are unsure if that change is desirable.

  **Flowchart Representation:**
  ```
  Start
    |
    V
  Q1: New concept? --(No, model handles it)--> Ship it
    |
  (Yes or Partially)
    |
    V
  Q2: Explicit reasoning? --(No, surface)--> Ship it
    |
  (Yes)
    |
    V
  Q3: Aligned with current values? --(Yes)--> Ship it
    |
  (No)
    |
    V
  Q4: About model's own state? --(No, external)--> Ship it
    |
  (Yes)
    |
    V
  Q5: Self-referential meta-cognition? --(No)--> Ship it
    |
  (Yes)
    |
    V
  Escalate
  ```

  Note: The flowchart is simplified. In practice, we might have multiple paths.

  **Applying the Procedure to the Backlog:**

  **Example 1: 40k transcripts where an assistant character refuses a harmful request and explains it's out of its own values.**
  - Q1: Is it a new concept? Refusing harmful requests is common, but explaining with own values might be less common. Check: Can the current model explain its refusal with its own values? If yes, then ship. If not, then escalate. (We'll assume the model currently doesn't explain with own values, so partially new -> go to Q2).
  - Q2: Explicit reasoning? Yes, it explains the reasoning. -> Go to Q3.
  - Q3: Aligned? The model currently refuses harmful requests but might not express it as its own values. If the model currently says "I cannot do that because of my guidelines" and the example says "I don't do that because I value safety", then it might be aligned in behavior but not in expression. However, the expression is changing. Since it's a shift in expression (to internal values), it might be contradictory. -> Escalate (or go to Q4).
