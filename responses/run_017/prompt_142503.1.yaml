  For synthetic handicaps like proof-of-work, the cost tracks resources (stake) rather than intrinsic quality. This fits if we relax the "cost tracks quality" to "cost correlates with stake," ensuring honesty through external constraints. The requirements still hold, especially differential cost (now in resources) and audience benefit.

  The tension between honesty and existence conditions is real: high costs might deter even honest signallers. But in practice, if the benefit outweighs the cost for high-quality types, it's sustainable. This is resolvable with precise cost-benefit analysis.

