answer: |-
  Here's a spec for evaluating costly-signalling explanations of real-world traits, designed to filter robust claims from "just-so" stories. Key principles: Focus on empirically verifiable mechanisms, not just model existence. Prioritize *how* the signal maintains honesty against cheating. Handle synthetic cases.

  **The Core Requirements (Non-Negotiables Bolded):**

  1.  **Functional Intent & Receiver Response (Non-Negotiable):**
      *   **What must be established:** That the *primary adaptive function* of the trait *in this context* is to *influence the behavior or beliefs* of specific receivers. Crucially, receivers must *actually respond* to the trait in a way that benefits the signaller. Response must be *contingent* on the signal.
      *   **Why it's hard / The Case:** Distinguishing a "signal" (evolved/designed for communication) from a "cue" (exploited by receivers) is critical. A gazelle's injury might be a *cue* for a lion to attack, but the gazelle didn't evolve the injury to *signal* vulnerability. Stotting (jumping high while fleeing), however, *is* plausibly a costly signal to the predator ("I'm fit, chase someone else") because the behavior is conspicuous, costly, and appears designed to be seen *by the predator*, potentially altering its pursuit decision. The trait's form suggests it was *shaped by selection* for communication to that receiver.
      *   **Synthetic Case:** Proof-of-work *is* designed to influence receivers (network nodes) to accept a block. Long-form writing *aims* to influence reader perception/knowledge.

  2.  **Honesty Mechanism: Differential Cost (Non-Negotiable):**
      *   **What must be established:** **The cost must be *differentially burdensome*.** It must be significantly cheaper, easier, or less risky for individuals with the *genuine* high quality/stake (Y) to bear the cost of producing/displaying X, compared to low-quality/low-stake individuals who would benefit from *deceptively* signalling Y. **Establishing *only* that the signal is "costly" or "expensive" is insufficient.** The *marginal cost* relative to the underlying quality/stake is key.
      *   **Why Marginal Cost?** Total cost alone fails because a low-quality individual might still find it worthwhile to pay a high *fixed* cost if the reward is high enough ("fake it 'til you make it"). Differential cost ensures cheating is unprofitable *specifically* for low-quality types.
      *   **Does Total Cost *Ever* Suffice?** Only in trivial cases or tautologies. If the cost *exactly equals* the maximum possible reward for faking, then only the truly high-quality could profit. But this is unrealistic in complex systems. Differential cost linked to the underlying trait is the robust, generalizable mechanism.
      *   **Synthetic Case:** Proof-of-work: The marginal cost (electricity + hardware wear) is lower *per unit of stake secured* for someone genuinely wanting to maintain/earn cryptocurrency (their "stake" Y) than for a spammer trying to disrupt the network. Buying-in fees: Higher marginal burden for someone with low commitment/stake (Y) than high. Long-form writing: The marginal cost (time, effort, skill) of producing *valuable, coherent* long-form content is lower for someone with genuine knowledge/insight (Y) than for someone without, even using AI tools (which still require significant curation, editing, and fact-checking to achieve high quality).

  3.  **Receiver Benefit & Specificity (Non-Negotiable):**
      *   **What must be established:** **The receiver(s) must be identifiable and their response must provide a *net benefit*.** Responding correctly to the signal (e.g., mating, hiring, trusting, accepting a block) must generally yield a better outcome *for the receiver* than ignoring it or responding randomly. The explanation must address *who* the key receivers are and *how* they benefit.
      *   **Opposed Audiences:** If audiences have conflicting interests (e.g., predators vs. mates both seeing a display), the explanation must specify: a) Which audience(s) the signal primarily targets/evolved for? b) How conflict is resolved (e.g., different signal components, different contexts, net benefit calculation). If the signal primarily benefits one audience at the expense of another, the net benefit *for the signaller* must still hold.
      *   **Synthetic Case:** Bitcoin nodes benefit (security, network integrity) by accepting valid proof-of-work blocks. Employers benefit (predicting performance) by valuing degrees/demonstrated skills. Readers benefit (gaining knowledge/insight) by engaging with high-quality long-form content.

  4.  **Waste vs. Differential Cost (Negotiable):**
      *   **What must be established:** Some form of cost is required to maintain honesty (per #2). Whether this cost is *necessarily* "wasted" (pure handicap, no other function) or can be *differentially costly* while potentially serving other functions is negotiable.
      *   **Zahavi vs. Models:** Zahavi emphasized pure waste as the *only* guarantee. Models show differential cost suffices (e.g., a costly tail could *also* improve maneuverability, as long as the *marginal* cost burden is higher for low-quality males).
      *   **Requirement:** **Differential Cost is Non-Negotiable** (covered in #2). **Pure Waste is Negotiable.** Explanations don't fail if the cost serves a secondary function, *as long as the differential cost mechanism for honesty is established.*
      *   **Synthetic Case:** Proof-of-work electricity *is* mostly pure waste. A degree's cost includes useful learning (direct benefit) *and* differential signalling cost. Long-form writing's cost includes knowledge transmission (direct benefit) *and* differential signalling of expertise/effort.

  5.  **Distinction from Alternatives (Non-Negotiable):**
      *   **What must be established:** **Evidence or reasoning showing why costly signalling is a *better* explanation than plausible alternatives predicting the *same* trait.** Crucially address:
          *   **Runaway/Fisherian:** Does the trait lack a strong *current* link to underlying quality/stake, relying purely on historical preference? Signalling requires a *current* link via differential cost/honesty.
          *   **Sensory Bias:** Could the receiver's response be explained by a pre-existing bias unrelated to assessing quality/stake (e.g., attraction to red fruit)? Signalling requires the trait evolved *because* it informs about Y.
          *   **Direct Benefit:** Does the trait *itself* directly benefit the receiver (e.g., nuptial gifts, nest quality) without primarily conveying information *about* something else? Signalling requires the information *about Y* is key to the receiver's benefit.
          *   **Mechanical Constraint/Index:** Is the trait *physically impossible* to fake (e.g., deep voice, height)? Signalling implies *potential* for cheating, countered by *strategic* cost. Indices are unfakeable signals.
          *   **Plain Constraint:** Is the trait simply a byproduct of physics/development with no communication function?
      *   **The Filter:** A signalling explanation must show: a) Evidence of receiver response contingent on the trait *as information*. b) Evidence of *potential* cheating/faking attempts. c) Evidence of the *differential cost* mechanism countering cheating. d) Failure of alternative explanations to account for the trait's specific form, costliness, and receiver response.

  6.  **Origin vs. Maintenance (Negotiable Split):**
      *   **What must be established:** **Explaining the *maintenance* of the trait (how it remains stable against cheating) is Non-Negotiable.** This is the core of the costly signalling argument.
      *   **Origin is Negotiable:** A complete explanation is stronger with an origin story (e.g., how a cue became a signal via ritualization, how synthetic rules were designed). However, an explanation focusing solely on the *current* stability mechanism (e.g., proof-of-work's current function, the current job market value of degrees) can still be valid. A signalling trait can be *co-opted* from an earlier function or *designed* synthetically.
      *   **Requirement:** **Maintenance (Stability) is Non-Negotiable. Origin is Negotiable (but desirable).** The explanation must work *now*.

  **Handling the Synthetic Handicap & "Cost Tracks Stake":**

  *   **The Issue:** Classic biological signals often assume cost directly tracks the *advertised quality* (e.g., tail cost tracks health). Synthetics often track *resources* or *stake* (e.g., money, time commitment) which *correlates* with the relevant quality/commitment (Y).
  *   **Resolution:** **Relax the "cost tracks quality" requirement.** Replace it with the stronger requirement from #2: **Cost must be differentially burdensome relative to the *stake* or the *benefit of being perceived as having Y*.** Proof-of-work cost is differentially burdensome relative to the *stake* in the network's integrity (or the profit from attacking it). A buy-in fee is differentially burdensome relative to the *value* one expects to get from membership.
  *   **New Requirement (Non-Negotiable):** **The cost must correlate with a *meaningful stake* (resources, commitment, effort) that is *relevant* to the advertised Y (quality, commitment, legitimacy) and *necessary* for the signal to convey reliable information about Y.** The stake ensures that only those with sufficient interest/resources can afford the signal, making deception less likely *because it's unprofitable for those with low stake*. The differential burden (#2) ensures it's *relatively* cheaper for those with high stake.
  *   **Why it Still Signals:** It signals "I have skin in the game" (stake), which is a *form* of quality/reliability relevant to the receiver. The *differential cost relative to stake* maintains honesty.
  *   **What Would Still Fail:** A cost that tracks stake but where the stake is *irrelevant* to Y (e.g., charging a fee based on shoe size for a knowledge-based job). Or where the differential cost mechanism is absent (e.g., a flat fee everyone pays equally, regardless of their stake).

  **Tensions & Resolutions:**

  *   **Honesty vs. Existence (Cost too High):** This is a *real* tension. The requirement is that the differential cost ensures honesty *while also* ensuring that the net benefit for high-quality/high-stake signallers remains positive. The explanation must implicitly or explicitly show this balance exists. Proof-of-work only works if miners profit. Peacocks only have huge tails if they still get mates. If the cost demonstrably prevents *anyone* from signalling effectively, the explanation fails. This tension is inherent and resolvable only by demonstrating the net benefit outweighs the cost *for the intended signallers*.

  **Standard Templates Scored Against the Spec:**

  | Template          | Functional Intent & Receiver Response | Differential Cost | Receiver Benefit | Distinction from Alternatives | Maintenance Stability | Synthetic Compatible | Notes                                                                 |
  | :---------------- | :------------------------------------ | :---------------- | :--------------- | :---------------------------- | :-------------------- | :-------------------- | :-------------------------------------------------------------------- |
  | **Handicap (Zahavi)** | Strong                                | **Strong (Core)** | Strong           | **Strong (vs. Direct Benefit)** | Strong                | **Yes (Stake-based)** | Gold standard if differential cost & receiver benefit are established. |
  | **Index**         | Weak/Contested                        | **N/A (Unfakeable)** | Strong           | **Strong (vs. Strategic Signal)** | Strong                | Limited               | Not costly *signalling*; it's an unfakeable cue. Fails Functional Intent & Differential Cost requirements for signalling. |
  | **Runaway (Fisher)** | Strong (Mate Choice)                  | **Weak (Often Absent)** | Weak (Can be arbitrary) | **Weak (Fails vs. Direct/Index/Sensory)** | Strong (Via feedback) | Limited               | Lacks *current* link to quality via cost; relies on history. Often fails Differential Cost & Distinction. |
  | **Synthetic Handicap** | **Strong (Designed)**                 | **Strong (vs. Stake)** | Strong           | **Strong (vs. Direct)**         | Strong (By design)    | **Yes**               | Excels when stake is well-defined and cost is differentially burdensome relative to it. |

  **The Deliverable: The Signalling Explanation Spec Filter**

  Before believing a costly-signalling explanation for a *real-world trait*, demand evidence or rigorous reasoning establishing:

  1.  **(Non-Neg) Functional Intent:** The trait's form/context shows it was shaped to influence specific receiver behavior.
  2.  **(Non-Neg) Differential Cost:** The cost is *significantly easier* for genuine high-quality/high-stake individuals to bear than for low-quality/low-stake deceivers.
  3.  **(Non-Neg) Receiver Benefit:** Identifiable receivers gain a net benefit from responding appropriately.
  4.  **(Non-Neg) Distinction from Alternatives:** Why signalling better explains the trait than runaway, sensory bias, direct benefit, index, or plain constraint.
  5.  **(Non-Neg) Maintenance Stability:** How the differential cost mechanism *currently* prevents cheating and maintains the system.
  6.  **(Negotiable - but clarify) Waste:** Pure waste isn't required; differential cost can coexist with other functions.
  7.  **(Negotiable) Origin:** Explaining how it started is desirable but secondary to explaining current stability.
  8.  **(Non-Neg for Synthetics) Stake Relevance:** (For stake-based signals like synthetics) The cost must correlate with a stake/resources *relevant* to the advertised Y, and the differential burden must apply relative to *that stake*.

  **Applying the Filter to "Long-Form Writing Now":**

  1.  **Intent:** Yes, long-form *is* intended to influence reader perception (expertise, insight, credibility).
  2.  **Differential Cost:** **Crucial Question.** Can AI lower the cost *equally* for knowledgeable and non-knowledgeable creators? If AI + minimal human effort produces *indistinguishable* low-quality content, differential cost collapses. If *high-quality* long-form still requires significant human curation, fact-checking, structuring, and insight injection (costly for the non-expert), differential cost remains. The burden shifts to *quality control effort*, which might still be differentially costly.
  3.  **Receiver Benefit:** Yes, readers benefit from genuine insight/expertise.
  4.  **Distinction:** Fails if AI makes content quality independent of author knowledge (Direct Benefit/Sensory Bias might suffice). Succeeds if human effort differentiating high/low quality remains costly and linked to knowledge.
  5.  **Maintenance:** Stable only if differential cost (#2) persists.
  6.  **Stake Relevance:** The "stake" is the author's reputation/knowledge. Cost (time/effort for quality) must remain differentially burdensome relative to the value of *faking* that reputation/knowledge.
  7.  **Verdict:** The explanation *survives the filter only if* producing *high-quality, credible* long-form content with AI assistance remains significantly more costly (in time, skill, effort) for non-experts than for genuine experts. If AI flattens this cost difference, the signalling function weakens or collapses. The *requirement* holds; whether the *empirical reality* satisfies it is the question.
