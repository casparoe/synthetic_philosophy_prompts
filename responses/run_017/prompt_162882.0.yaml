prompt: |-
  I've been helping to run a discussion section on scarce-resource allocation — the kind of material that starts from the old lifeboat setup and then gets extended to rich-world obligations toward people in the water — and I keep noticing that my gut verdicts on variants are confident, numerous, and hard to fit together. Before the term ends I would like to write down the principle I am implicitly using, if there is one. I would much rather be told that one of my verdicts has to go than be handed a principle that saves all of them by growing a clause for each case.

  Everything below is a variation on one setup: a lifeboat built for nine, ten people aboard, the boat will swamp within twenty minutes unless the load is reduced, and rescue is expected in about three hours.

  (a) Ten adults, relevantly similar, nobody volunteers. My verdict: someone may be put over the side; letting all ten drown is not morally required. But it has to be settled by lottery — the strongest person may not simply choose, and I do not think the captain's authority changes anything. I also think the person selected would be within their rights to fight back, which I realize sits badly with my saying the rest may put them over.

  (b) One of the ten is the crewman whose negligence sank the ship. No lottery; he goes. And here I do think he may be overpowered if he resists, which I do not think in (a).

  (c) One of the ten is unconscious and, on the best clinical assessment available, will die within two hours whatever anyone does. Choosing him is not just permissible but clearly preferable to choosing anyone else; in fact this is the only case where I think a lottery would be wrong.

  (d) One of the ten is seventy-two and can statistically expect perhaps ten more years of life against the others' forty or fifty. My verdict: that is not an admissible basis for selecting him — and I hold this even though the thought I keep reaching for in both (c) and (d) is the same thought, that he has less left to lose. The actuarial version, where all we know is that he belongs to a group with lower average life expectancy, I reject even more firmly.

  (e) An able-bodied person with no dependants calmly volunteers to go over the side. The offer may be accepted. I also think, less comfortably, that it may be accepted even when the volunteer is the only person aboard who can navigate, so that accepting it probably dooms the other nine.

  (f) A different possibility: nobody goes over the side, everyone bails and lashes themselves to the gunwales, and each person then faces roughly a fifteen percent chance of drowning. I prefer this to putting one person over, even though the expected number of deaths is higher.

  (g) The same option, but each person faces roughly forty-five percent. Here I would put someone over the side after all — and I cannot say where between fifteen and forty-five the switch happens.

  (h) Outside the boat: with room and rations for ten more, swimmers in the water must be hauled aboard. If the boat's own crew recklessly caused the collision, they must take them in even at real cost to themselves, and if there is not room, the culpable crew go over the side before any swimmer is refused. If the boat is genuinely full, refusing swimmers is permissible. But if the crew deliberately keep two places empty and heave the spare rations overboard so that no one can later say there was room, my verdict is that they have not thereby acquired the permission they would have had if the boat really were full.

  My own tentative formulation is this: every person aboard has an equal claim to a place; that claim can be defeated by the person's own consent, or by their responsibility for the emergency; and where claims are equal, the selection must be made by a fair procedure rather than by any judgment about whose life is worth more. Please test that against (a) through (h) and repair it where it breaks. I want: a small set of candidate principles stated precisely, with the case that forces each clause; where a candidate and one of my verdicts conflict, a recommendation about which to give up and what giving it up costs me elsewhere; verdicts on cases I have not listed — in particular on the threshold in (g), on the case I keep changing my mind about (one of the ten is a six-year-old child, and I cannot decide whether excluding her is obviously right or is exactly the kind of comparative judgment I rejected in (d)), and on at least one case of your own construction; and an honest statement of which of my verdicts no clean principle can accommodate.
reasoning: |-
  Okay, I need to tackle this user's query about formulating a moral principle for scarce-resource allocation based on their lifeboat scenarios. The user is clearly frustrated with their own inconsistent intuitions across cases (a) through (h) and wants a coherent framework before their term ends. Their core tension is between wanting to preserve all their gut verdicts while demanding principled consistency—even if it means sacrificing some judgments.

  First, I should map their existing intuitions clearly: 
  - In (a), they endorse equal claims/lottery with resistance rights. 
  - (b) introduces responsibility as an override. 
  - (c) and (d) show a stark contrast between medical certainty and statistical life expectancy—why does "less to lose" work in (c) but not (d)? 
  - (e) puzzles me: why accept a navigator's sacrifice that likely dooms everyone? That seems to clash with minimizing harm. 
  - (f)/(g) reveal risk-sharing preferences that shift at some uncertain threshold. 
  - (h) expands to obligations to swimmers, with culpability and bad-faith actions mattering.

  Their tentative principle (equal claims defeated only by consent/responsibility) is a good start but immediately cracks under pressure. For example: 
  - (c) breaks it—they prioritize the dying person without consent or fault. 
  - (e) breaks it—accepting the navigator's sacrifice contradicts the "equal claim" survival interest of the nine. 
  - (f)/(g) aren't even addressed by the principle since they involve risk structures.

  I need to identify the deeper values driving their judgments. The rejection of comparative worth (d) and insistence on fair procedures (a) suggest a strong deontological core—perhaps a Rawlsian "veil of ignorance" impulse where no one's life is valued higher. But then (c) and (b) introduce consequentialist elements (minimizing loss, desert). 

  The child case they mention is critical: if they reject age-based selection in (d), how can selecting the child be different? Unless... ah, dependency? But they didn't mention dependents except in (e). This needs untangling. 

  For a revised principle, I propose: 
  **Core equality** (all lives equally valuable) → explains (a),(d) 
  **Desert override** (responsibility for harm) → explains (b) 
  **Non-comparative urgency** (only when death is imminent/certain) → explains (c) but not (d) 
  **Voluntary sacrifice** (with caveats?) → explains (e) but conflicts with outcome 
  **Risk-sharing imperative** → explains (f)/(g) threshold 

  The threshold in (g) likely relates to how much risk is "reasonable" to demand of others—maybe a 50% survival tipping point? But that's arbitrary. 

  For the child case: if excluding her feels wrong, it might be because children are perceived as having stronger future claims (contradicting (d)) or dependency needs. I'd test this with a variant: "Ten people including a child and an elderly person—both statistically equal life expectancy." If they still hesitate, it exposes a bias. 

  The hardest verdict to save is (e). Accepting the navigator's sacrifice when it causes collective doom violates the very survival the principle seeks to maximize. They might need to drop this or reframe sacrifice as binding only when it doesn't harm others' claims. 

  Ultimately, their intuitions reveal a trilemma: 
  1. They can't keep both (d) and the child exclusion instinct without inconsistency. 
  2. (e) must be modified to require that sacrifice doesn't undermine others' survival. 
  3. The (f)/(g) threshold needs a pragmatic line (e.g., >33% individual risk). 

  I'll offer a principle that packages this, then stress that (e) is the "sacrificial lamb" verdict for coherence. The user's intellectual honesty here is admirable—they're willing to abandon intuitions for principle, which is rare.
answer: |-
  Your commitment to principled consistency is admirable. I'll test your tentative principle against each case, propose a refined candidate principle, identify tensions, and recommend where to adjust your verdicts for coherence. Let's start by stating your principle clearly:

  **Original Principle:**  
  Each person aboard has an equal claim to a place. This claim can be defeated by:  
  1. The person's own consent, OR  
  2. The person's responsibility for the emergency.  
  Where claims remain equal, selection must use a fair procedure (e.g., lottery) and never comparative judgments of life's value.

  ---

  ### **Testing Against Cases & Breakdowns**
  1. **Case (a): Ten similar adults, no volunteers**  
     - ✅ **Principle holds**: Equal claims → lottery required.  
     - ⚠️ **Tension**: Your allowance of resistance conflicts with the permissibility of force. If the group *may* put someone over, but the selected person *may* resist, this creates moral gridlock. **Resolution**: Drop the right to resist. The lottery outcome binds morally; resistance violates others' equal claims.  

  2. **Case (b): Negligent crewman**  
     - ✅ **Principle holds**: Responsibility defeats his claim. Force is permissible to enforce forfeiture.  

  3. **Case (c): Unconscious, dying person**  
     - ❌ **Principle breaks**: No consent or responsibility. Yet you reject a lottery.  
     - **Problem**: Your intuition uses "less to lose" (non-comparative urgency) to override equality. This isn't covered.  

  4. **Case (d): Elderly person (72 vs. 40–50-year life expectancy)**  
     - ✅ **Principle holds**: Comparative life expectancy is inadmissible. Equality → lottery.  

  5. **Case (e): Volunteer navigator**  
     - ❌ **Principle breaks**: Consent defeats the volunteer's claim. But accepting this sacrifices the other nine, violating *their* claims. Principle ignores aggregate harm.  
     - **Your discomfort is justified**: Permitting this is inconsistent with protecting equal claims.  

  6. **Cases (f) & (g): Risk-sharing (15% vs. 45% death chance)**  
     - ❌ **Principle ignores risk**: Your preference for shared risk isn't captured. The switch-point (e.g., ~30%) depends on "reasonable burden" to others.  

  7. **Case (h): Swimmers, culpability, and bad faith**  
     - ✅ **Partially holds**: Responsibility mandates crew sacrifice. Bad-faith emptiness invalidates "full boat" defense.  
     - ⚠️ **Gap**: The duty to rescue isn't derived from claims equality.  

  ---

  ### **Refined Candidate Principle**
  **Core Axiom**: All persons have equal moral worth, generating equal claims to survival resources.  
  **Claim-Defeating Conditions**: A claim may be overridden only if:  
  1. **Consent**: The person voluntarily forfeits their claim.  
  2. **Responsibility**: The person culpably caused the scarcity.  
  3. **Non-Comparative Urgency**: The person will imminently die *regardless of the allocation decision* (e.g., terminal, unstoppable decline).  
  **Procedure**: When claims are equal, selection requires a fair lottery.  
  **Risk-Sharing Imperative**: If all can share the risk with a reasonable chance of survival, this is obligatory over sacrificing one.  

  ---

  ### **Revised Principle vs. Your Verdicts**
  | Case | Your Verdict | Revised Principle | Conflict? | Recommendation |  
  |------|--------------|-------------------|----------|---------------|  
  | (a) | Lottery; may resist | Lottery required; no right to resist | ⚠️ (resistance) | **Drop resistance right**. Resistance denies others' claims. |  
  | (b) | Culpable crewman goes | Responsibility defeats claim | ✅ | None. |  
  | (c) | Dying person goes | Non-comparative urgency defeats claim | ✅ | None. |  
  | (d) | Age inadmissible | Age/life-expectancy inadmissible | ✅ | None. |  
  | (e) | Accept navigator's sacrifice | ❌ Reject sacrifice if it harms others | ⚠️ (aggregate harm) | **Modify verdict**. Refuse sacrifice if it dooms others. |  
  | (f) | Prefer 15% risk-sharing | Obligatory (reasonable risk) | ✅ | None. |  
  | (g) | Prefer sacrifice at 45% | Permissible (unreasonable risk) | ✅ | None. |  
  | (h) | Culpable crew must save swimmers | Responsibility + duty to rescue | ✅ | None. |  

  ---

  ### **New Cases & Thresholds**
  1. **The Threshold in (g)**:  
     - **Principle**: Risk-sharing is obligatory if individual survival odds exceed **~70%** (i.e., ≤30% death chance). Between 30–50%, it is permissible but not required. Below 50% survival, sacrifice is allowed.  
     - **Why 70%?** Below this, the burden becomes unreasonable (rooted in "acceptable risk" in tort law). Forces coherence in (f)/(g).  

  2. **The Six-Year-Old Child**:  
     - **Setup**: Ten people, including a healthy child (expected 80+ years) and nine adults (expected 40–50 years).  
     - **Your Principle**: Age is comparative → **forbids selecting the child**.  
     - **Tension**: You feel excluding her might be "obviously right" due to greater future potential.  
     - **Resolution**: **Reject this intuition**. Selecting the child violates non-comparative claims. Only non-urgency (e.g., a *dying* child) or consent could override.  

  3. **New Case: The Only Caregiver**:  
     - **Setup**: One passenger is the sole caregiver for two young children on shore; others have no dependents.  
     - **Principle**: Dependents are comparative → **inadmissible**. Lottery required.  
     - **Why?** Assigning "greater value" to caregivers implicitly devalues others' lives.  

  ---

  ### **Which Verdicts Must Be Sacrificed?**
  1. **Resistance Rights (a)**: You must drop the permissibility of resisting a fair lottery. It undermines collective survival.  
  2. **Sacrificial Navigator (e)**: You cannot accept a sacrifice that *reliably causes more deaths*. Modify to: "Accept only if it doesn't doom others."  
  3. **Child Selection Intuition**: If excluding the child feels compelling, abandon that impulse—it contradicts your rejection of comparative worth in (d).  

  ---

  ### **Final Principle Statement**
  **The Equality-Urgency-Responsibility Framework**:  
  1. **Equal Claims**: All persons have equal claims to survival resources.  
  2. **Defeating Conditions**: A claim is overridden only by:  
     - **Voluntary consent** (free, informed forfeiture),  
     - **Culpable responsibility** for the emergency,  
     - **Non-comparative urgency** (imminent, inevitable death unaffected by the decision).  
  3. **Procedure**: Unresolved claims → fair lottery.  
  4. **Risk-Sharing**: Obligatory if individual survival odds are ≥70%.  

  **What It Costs**:  
  - You lose the navigator’s sacrifice (e) and resistance rights (a).  
  - You must ignore dependents, age, potential, or social value.  
  - **Gain**: Coherence across lifeboat, triage, and rescue ethics.  

  **Unavoidable Messiness**:  
  The **risk-sharing threshold** (70%) is unavoidably arbitrary. No principle can precisely define "reasonable risk"—it requires contextual judgment. This is where moral philosophy meets real-world uncertainty.  

  If this feels too rigid, consider that your intuitions may reflect **rule-utilitarianism** (e.g., forbidding comparative judgments prevents slippery slopes). But your rejection of aggregate harm in (e) suggests a deontological core—hence the refined principle above. I recommend standing firm on equality.
