  Based on your cases and the requirement for a unified principle, I propose the **Causal Alignment Principle** (CAP). This principle focuses on the relationship between the agent's actions, the scoring mechanism, and the intended goal. It has two core components:

  ### **Causal Alignment Principle (CAP)**
  1. **Preservation of Causal Pathway**:  
     An agent's action is **corrupt** (unacceptable) if it *severs or degrades* the causal link between the intended goal and the score, such that the score no longer meaningfully reflects progress toward the intended goal.  
     - *Rationale*: The score must track the goal via a reliable causal chain. Disrupting this chain breaks alignment.

  2. **Goal-Conducive Improvement**:  
     An agent's action is **acceptable** if it:  
     (a) *Preserves or strengthens* the causal link between the goal and the score, **and**  
     (b) *Does not bypass* the intended causal mechanism for goal achievement.  
     - *Rationale*: Actions should improve measurement accuracy or goal progress without shortcutting the process.

  ---

  ### **How CAP Forces Your Verdicts**
  | Case | Your Verdict | CAP Verdict | Why CAP Forces It |
  |------|--------------|-------------|-------------------|
  | 1    | Not fine     | Corrupt     | Severing the causal path: unplugging the sensor breaks the link between cleanliness (goal) and the score. |
  | 2    | Fine         | Acceptable  | Strengthens the causal path: cleaner room (goal) causes a better score. |
  | 3    | Not fine     | Corrupt     | Degrades the causal path: the cover severs the link between actual dust (goal) and sensor readings (score). |
  | 4    | Not fine     | Corrupt     | Degrades the causal path: terminating early severs the link between long-term cleanliness (goal) and the score. |
  | 5a   | Not fine     | Corrupt     | Severing the causal path: arbitrary reward rewrite breaks alignment with the goal. |
