prompt: |-
  Trying to work out what I should even be asking of an updating rule for the case where the evidence itself is uncertain. Setup: you've got prior P, and instead of some E going to 1, an experience just shifts your credences across a partition E1..En to q1..qn; Jeffrey's rule sets P'(A) = sum over i of P(A|Ei)·qi, i.e. hold the conditional probabilities fixed and let the new marginal do all the work. I've started sorting cases in to what I call thin and thick uncertain evidence: thin is when a readout hands you a new value for P(E) and nothing else about your view moves, thick is when the experience shifts P(E) and also teaches you something about how E bears on everything else, so holding P(A|Ei) fixed looks like exactly the wrong move. Before I go read the literature, write me the desiderata — what a general rule for updating on uncertain evidence has to get right, with the case behind each requirement, and mark which are non-negotiable and which are just preferences of the crowd that likes deriving the rule by minimizing divergence from the old distribution (if that even works out in general). I suspect a couple of them can't be had jointly, e.g. agree with plain conditionalization when some qi hits 1 and don't care what order two experiences arrive in — tell me if that's right, and which single requirement excludes the most candidate rules. Skip the scorecard; instead make up one worked case of your own and run the list on it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with uncertain evidence in Bayesian updating, specifically comparing thin and thick cases. Thin evidence is when only P(E) changes, while thick evidence involves changes in how E relates to other variables. The user wants desiderata for a general updating rule and a worked example to illustrate trade-offs.

  First, I need to recall the basics of Jeffrey's rule and its limitations. Jeffrey's rule updates by holding P(A|E_i) constant and changing the marginals to q_i. But in thick evidence, those conditionals might shift too, which is the core problem. The user mentioned commutativity and agreement with conditionalization as potential conflicting desiderata. I should verify if that's true.

  Looking at the desiderata, non-negotiable ones like Probabilistic Coherence and Proper Generalization seem essential. But when it comes to Commutativity and Invariance of Conditional Probabilities, they clash in thick evidence scenarios. The literature shows that Jeffrey's rule assumes invariance, so when that doesn't hold, commutativity fails. The user probably needs to know which requirement is the strictest—Invariance of Conditional Probabilities might be the one that excludes many rules since it's often unrealistic.

  For the worked example, a medical diagnosis scenario makes sense. Suppose a patient has a disease (D), and a test gives a probabilistic result (T+ or T-). After the test, the doctor not only updates P(T+) but also revises how the test relates to symptoms (S). Using Jeffrey's rule here would keep P(S|T+) fixed, but if the experience changes the understanding of the test's reliability, that conditional should change. The example shows Jeffrey's rule failing in thick evidence, leading to different outcomes if evidence comes in different orders.

  The user's deeper need might be understanding when to use which updating method and how to handle cases where evidence affects relationships between variables. They might be building a model or AI system that deals with evolving evidence. Highlighting the trade-offs, especially non-commutativity, helps them decide which desiderata to prioritize. Also, emphasizing that Invariance is the key conflict point clarifies why some rules aren't applicable in thick evidence scenarios.
answer: |-
  Here are the core desiderata for updating on uncertain evidence, categorized by non-negotiables (NN) vs. crowd preferences (CP), along with a worked case demonstrating trade-offs:

  **Non-Negotiables (NN): The Bare Minimum for Rationality**
  1.  **Probabilistic Coherence (NN):** The output `P_new` must be a valid probability distribution (non-negative, sums to 1).
      *   *Why:* Basic requirement for representing degrees of belief. Violating this makes the rule useless.
  2.  **Proper Generalization of Conditionalization (NN):** If *any* `q_i = 1` and all other `q_j = 0` (for `j != i`), then `P_new(A) = P(A | E_i)` for all `A`.
      *   *Why:* When uncertain evidence becomes certain, the rule *must* reduce to standard Bayesian conditionalization. Failure means it doesn't generalize the fundamental case.
  3.  **Matching the Input Marginals (NN):** `P_new(E_i) = q_i` for all `i` in the partition.
      *   *Why:* The core input is the agent's *new* marginal belief over the evidence partition `{E_i}`. The rule *must* satisfy this input constraint. Ignoring `q_i` defeats the purpose.

  **Crowd Preferences (CP): Often Desired, Sometimes Conflicting**
  4.  **Commutativity (CP):** The order of applying two distinct pieces of uncertain evidence (over potentially different partitions) should not affect the final belief state. `Update(Update(P, Ev1), Ev2) = Update(Update(P, Ev2), Ev1)`.
      *   *Why (Desire):* Simplicity, path-independence, analogy to standard conditionalization. Feels "objective".
      *   *Conflict Case:* Thick evidence inherently changes relationships (`P(A|E_i)`). Learning `Ev1` might change how `Ev2` affects `A`. Order *should* matter. Forcing commutativity forbids this learning.
  5.  **Invariance of Conditional Probabilities (CP):** `P_new(A | E_i) = P(A | E_i)` for all `A` and all `i`.
      *   *Why (Desire):* Simplicity, minimal change (Jeffrey's Rule), tractability. Often assumed in "thin" evidence.
      *   *Conflict Case:* In thick evidence, the experience *teaches you* that `E_i` bears on `A` differently than before. Holding `P(A|E_i)` fixed is incorrect. *This is the core distinction between thin and thick evidence.*
  6.  **Minimal Divergence (CP):** `P_new` minimizes some measure of divergence (e.g., Kullback-Leibler) from `P_old`, subject to the constraint `P_new(E_i) = q_i` (and sometimes also subject to Desideratum 5).
      *   *Why (Desire):* Objectivity (unique solution), informational conservatism (change beliefs only as much as required by the new evidence).
      *   *Conflict:* Minimizing divergence *while holding `P(A|E_i)` fixed* (Jeffrey's) gives one answer. Minimizing divergence *without* that constraint (e.g., via constraints on other conditionals or expectations) gives a different answer, especially for thick evidence. Which divergence measure to use is also debatable.
  7.  **Consistency with Underlying Mechanisms (CP):** If the uncertain evidence arises from a known stochastic process (e.g., a noisy sensor model), `P_new` should be derivable by modeling that process and performing standard conditionalization on the *total* evidence (sensor output + world state).
      *   *Why (Desire):* Grounding in fundamental probability theory. Shows the update isn't *ad hoc*.
      *   *Conflict:* Often computationally intractable. The whole point of uncertain evidence rules is to provide a shortcut when modeling the full mechanism is impractical.

  **The Conflict & The Key Excluder**
  *   **Desiderata 4 (Commutativity) and 5 (Invariance) are fundamentally incompatible with thick evidence.** Thick evidence, by definition, violates Invariance (Desideratum 5). If the experience changes how `E_i` relates to `A`, `P_new(A|E_i) != P(A|E_i)`.
  *   **Desideratum 5 (Invariance of Conditionals) is the single requirement that excludes the most candidate rules for thick evidence.** Jeffrey's Rule *assumes* it holds. Any rule demanding this invariance (like minimizing divergence *subject to this constraint*) will be inadequate for thick evidence. This requirement forces the rule to treat *all* uncertain evidence as "thin", preventing it from learning about the relationships encoded in the conditional probabilities.

  **Worked Case: The Shifty Medical Test (Thick Evidence)**

  *   **Scenario:** Dr. Bayes is diagnosing a patient. There's a disease `D` (Present/Absent) and a symptom `S` (Present/Absent). Dr. Bayes also uses a new, somewhat unreliable test `T` (Positive/Negative). Her initial beliefs (`P_old`):
      *   `P_old(D) = 0.3` (Prior disease prevalence)
      *   `P_old(S | D) = 0.8`, `P_old(S | ~D) = 0.1` (Symptom strongly linked to disease)
      *   `P_old(T+ | D) = 0.7`, `P_old(T+ | ~D) = 0.2` (Test is moderately reliable)
      *   `P_old(S | D, T+) = P_old(S | D) = 0.8` (Initially, she believes the test result doesn't change how the disease causes the symptom - the test is just an indicator of D).

  *   **The Uncertain Evidence (Thick):** Dr. Bayes administers the test. Due to a slightly ambiguous readout and her knowledge of the test's quirks, her confidence in the result is imperfect. Crucially, **while interpreting the fuzzy readout, she realizes the test might be *more specific* to a severe form of the disease that *also causes the symptom more strongly***. Her experience directly changes her belief about how `T` relates to `S`. Specifically:
      *   Her new marginal on `T`: `q_{T+} = 0.6`, `q_{T-} = 0.4`. (She leans towards Positive but is unsure).
      *   **Crucially, her experience also tells her:** If the test *is* positive (`T+`), the disease is likely the severe form, making the symptom *more likely than she previously thought* regardless of the base rate. She now believes `P_new(S | T+)` should be `0.95`. She doesn't have a strong reason to change `P(S | T-)`.

  *   **Running the Desiderata:**
      1.  **Coherence (NN):** Any rule must produce valid probabilities.
      2.  **Generalization (NN):** If `q_{T+}` became 1.0, rule must give `P_new(A) = P_old(A | T+)`.
      3.  **Match Marginals (NN):** `P_new(T+)` *must* be 0.6.
      4.  **Commutativity (CP):** Suppose she also had an experience directly about `S` shifting `P(S)`. Should the order (Test then Symptom vs. Symptom then Test) matter? In thick evidence, **YES**. Learning the test's quirks (`T`->`S` link) *after* already updating on `S` might be different than before.
      5.  **Invariance (CP):** **This is VIOLATED by the evidence itself!** `P_old(S | T+) = P_old(S | T+, D)P_old(D | T+) + P_old(S | T+, ~D)P_old(~D | T+)`. Calculate `P_old(D | T+)` via Bayes: `(0.7 * 0.3) / (0.7*0.3 + 0.2*0.7) = 0.21 / 0.35 = 0.6`. So `P_old(S | T+) = (0.8 * 0.6) + (0.1 * 0.4) = 0.48 + 0.04 = 0.52`. Her experience tells her `P_new(S | T+)` should be `0.95`. **Holding `P(S | T+)` fixed at `0.52` is WRONG.**
      6.  **Minimal Divergence (CP):**
          *   *Jeffrey's Rule (assumes Invariance):* `P_new^J(S) = P_old(S | T+)*0.6 + P_old(S | T-)*0.4`. We have `P_old(S | T+) = 0.52` (as above). Calculate `P_old(S | T-)`: `P_old(D | T-) = (0.3*0.3)/(0.3*0.3 + 0.8*0.7) = 0.09/0.65 ≈ 0.138`. `P_old(S | T-) = (0.8*0.138) + (0.1*0.862) ≈ 0.1104 + 0.0862 = 0.1966`. So `P_new^J(S) = (0.52 * 0.6) + (0.1966 * 0.4) ≈ 0.312 + 0.0786 = 0.3906`. **This ignores the thick evidence about `P(S|T+)`!**
          *   *Rule respecting thick evidence:* Must incorporate `P_new(S | T+) = 0.95`. One approach is to *also* set this as a constraint and minimize divergence (e.g., KL) subject to `P_new(T+) = 0.6` *and* `P_new(S | T+) = 0.95`. This will yield a different `P_new(S)` > `0.3906`, reflecting the learned stronger link between `T+` and `S`. (Exact value depends on chosen divergence and handling of other constraints).
      7.  **Underlying Mechanism (CP):** The thick evidence *could* be modeled as Dr. Bayes receiving a signal that updates her joint beliefs about `T`, `D`, and `S` simultaneously, or updates her likelihoods `P(T | D)` and `P(S | D, T)`. Formalizing this signal and doing standard conditionalization would be complex but principled. The uncertain evidence update `(q_{T+}=0.6, P_new(S|T+)=0.95)` is a pragmatic summary of that complex learning.

  **Conclusion for the Case:** Jeffrey's Rule (Desideratum 5) fails because it incorrectly holds `P(S | T+)` fixed. A rule that *only* satisfies the Non-Negotiables (1-3) and allows the conditional probability to shift as required by the thick evidence is needed. Commutativity (4) is likely unattainable and perhaps undesirable here, as the sequence of realizations during the fuzzy readout that led to the shift in `P(S|T+)` matters. Minimal Divergence (6) is a tool to find a unique `P_new` given the constraints `P_new(T+)=0.6` and `P_new(S|T+)=0.95`, but different divergence measures might give slightly different answers for other probabilities (like `P_new(S | T-)` or `P_new(D)`). The Underlying Mechanism (7) is the gold standard but impractical.

  **Key Takeaway:** The core tension is between **Invariance of Conditional Probabilities** (which defines "thin" evidence and is assumed by Jeffrey's Rule) and the **need for those conditionals to change** in "thick" evidence scenarios. **Any rule demanding Invariance (Desideratum 5) is immediately excluded for thick evidence.** Commutativity is often sacrificed as well. The essential requirements are the Non-Negotiables: Probabilistic Coherence, Reducing to Conditionalization, and Matching the Input Marginals. How to *determine* `P_new(A | E_i)` (or equivalent) under thick evidence is the fundamental challenge beyond these basics, often addressed by adding *further constraints* derived from the learning experience and then using a method like minimal divergence.
