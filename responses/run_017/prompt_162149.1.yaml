  ### Suffering-Focused Ethics Diagnostic Instrument

  **Instructions:** For each scenario, select the option that best reflects your moral intuition. There are no right or wrong answers; this instrument maps your pattern of responses.

  ---

  1. **The Comparison**  
     Life A contains one minute of agony (so severe it's unbearable) followed by 100 years of moderate joy. Life B has no agony but slightly less joy throughout. Which life is better?  
     ○ A is better: the extra joy outweighs the agony  
     ○ B is better: no amount of joy compensates for that agony  
     ○ Neither: they can’t be compared on one scale  

  2. **The Smear**  
     Two patients undergo procedures. One feels pain just below unbearable intensity; the other just above. Neither notices a difference. Should we prioritize one over the other?  
     ○ Yes: crossing the unbearable line matters most  
     ○ No: what matters is how they feel  

  3. **The Capped Subject**  
     A person with a condition that limits their worst possible pain (always below unbearable levels) might endure years of moderate suffering. Is their pain less urgent to prevent?  
     ○ No: pain is equally bad regardless of limits  
     ○ Yes: if it can’t reach unbearable levels, it’s less critical  

  4. **The Bargain**  
     Consider creating a life with 80 years of thriving and one hour of agony. Without that hour, the life wouldn’t exist. Should this life be created?  
     ○ Yes: the thriving outweighs the agony  
     ○ No: the agony can’t be justified  
     ○ It depends on other factors  

  5. **The Ignorant Chooser**  
     A policymaker sets rules for a group, unaware of their own sensitivity to pain. Some policies risk unbearable experiences for a few. Which approach is fairest?  
     ○ Minimize total suffering, even if risks are high  
     ○ Absolutely avoid policies risking unbearable pain  
     ○ Weigh risks by average pain, not worst-case  

  6. **The Drip**  
     One person suffers a minute of agony. Alternatively, a billion people each feel a barely noticeable pinch. Which is worse?  
     ○ The billion pinches: small pains add up  
     ○ The agony: it crosses a critical line  
     ○ Neither: both are trivial  

  7. **The Chili**  
     A chef experiences a painful chili burn but values it as part of a fulfilling culinary ritual. Is the burn less bad because it’s meaningful?  
     ○ Yes: context shapes the badness  
     ○ No: the pain itself is unchanged  

  8. **The Veteran**  
     A soldier endures years of hardship, raising her pain tolerance. A once-unbearable stimulus is now tolerable. Has the stimulus become less bad?  
     ○ Yes: her new tolerance lowers the stakes  
     ○ No: the stimulus is equally bad; she copes better  

  9. **Calibration: The Stub**  
     You stub your toe mildly while walking. Is this experience:  
     ○ Bad enough to outweigh years of joy?  
     ○ Not ideal, but trivial overall  
     ○ Neutral or even slightly pleasant  

  ---

  ### Scoring Key  
  Map your answers to the following leaves. Each leaf’s "awkward commitment" highlights a counterintuitive implication.  

  | Leaf                   | Awkward Commitment                                  | Answer Pattern (Q1–Q8)                                                                 |  
  |------------------------|-----------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **Moment-Centered Absolutism** | Must sacrifice civilizations to avert one unbearable moment | 1B, 2A, 3A, 4B, 5B, 6B, 7B, 8B |  
  | **Life-Total Hybrid**          | A life with 99% joy and 1% agony is worse than pure misery | 1C, 2A, 3B, 4B, 5A, 6A, 7A, 8A |  
  | **Resilience-Relative**        | Pain is less bad for those with high tolerance or analgesia | 1B, 2A, 3B, 4A, 5C, 6B, 7B, 8A |  
  | **Contextual Threshold**       | Suffering in valued experiences (e.g., childbirth) isn’t fully bad | 1A, 2B, 3A, 4A, 5A, 6A, 7A, 8B |  
  | **Risk-Averse Aggregator**     | A 0.1% risk of agony outweighs certainty of mass mild suffering | 1A, 2B, 3A, 4B, 5B, 6A, 7B, 8B |  
  | **Unoccupied**                 | —                                                   | *No consistent pattern*                                                               |  
  | **Unstable**                   | —                                                   | *Shifting thresholds or ambiguous tradeoffs*                                          |  

  **Calibration Note:** If you answered Q9 with "outweigh years of joy," re-read scenarios for severity assumptions.  

  ---

  ### Separation Table  
  | Question | Separates Leaf Pairs                                                                 | Separation Power |  
  |----------|--------------------------------------------------------------------------------------|------------------|  
  | 1        | Contextual Threshold/Risk-Averse Aggregator **vs** Others                            | High             |  
  | 2        | Life-Total Hybrid/Resilience-Relative **vs** Contextual Threshold/Risk-Averse Aggregator | High          |  
  | 3        | Resilience-Relative/Life-Total Hybrid **vs** Moment-Centered Absolutism/Risk-Averse Aggregator | High      |  
  | 4        | Life-Total Hybrid/Moment-Centered Absolutism **vs** Resilience-Relative/Contextual Threshold | High         |  
  | 5        | Risk-Averse Aggregator **vs** Resilience-Relative/Contextual Threshold               | Medium           |  
  | 6        | Life-Total Hybrid/Contextual Threshold **vs** Moment-Centered Absolutism             | Medium           |  
  | 7        | Contextual Threshold **vs** Resilience-Relative/Risk-Averse Aggregator               | Low              |  
  | 8        | Resilience-Relative **vs** Moment-Centered Absolutism/Contextual Threshold           | Low              |  
  | 9        | *Calibration (non-separating)*                                                      | —                |  

  **Flags:**  
  - Q7/Q8 separate weakly; they resolve edge cases but don’t split core leaves.  
  - Q9 detects misreadings (e.g., if stubbing a toe seems catastrophic).  

  ---

  ### Indistinguishable Leaf Pairs  
  1. **Life-Total Hybrid vs Risk-Averse Aggregator**: Ambiguity in Q5 (risk interpretation) and Q6 (aggregation rules) blurs boundaries. Both prioritize preventing agony but disagree on whether aggregated mild suffering can rival it.  
  2. **Resilience-Relative vs Contextual Threshold**: Q7 (The Chili) fails to distinguish pain embedded in valued experiences from pain tolerated by resilient individuals.  

  ### Unoccupied Combinations  
  | Combination                                   | Diagnosis        | Explanation                          |  
  |-----------------------------------------------|------------------|--------------------------------------|  
  | Fixed threshold + Life-bearer + Additive pain | Incoherent       | Life-bearer implies no additive composition |  
  | World-bearer + Subject-relative threshold     | Incoherent       | World-level assessment ignores individual variation |  
  | Drifting threshold + Obligation-based "outweighs" | Unstable     | Moral duties shift with subjective adaptation |  
  | Pleasure-suffering commensurability + Lexical ordering | Incoherent | Lexicality denies commensurability |  

  ---

  ### Discussion Handout Note  
  For seminars, use the instrument to:  
  1. **Identify fault lines**: Poll answers anonymously, then debate outliers.  
  2. **Pressure-test commitments**: Challenge groups to defend a leaf’s "awkward commitment."  
  3. **Map tradeoffs**: Have students design a scenario that forces a leaf to contradict itself.  

  ---

  ### What the Instrument Reveals  
  The threshold’s *location* (moment, life, world) drives more variance than the negative-leaning commitment itself. For instance, if the threshold applies to whole lives (Life-Total Hybrid), aggregating sub-threshold sufferings becomes coherent, but if it applies to moments (Moment-Centered Absolutism), aggregation is irrelevant. The commensurability question (Q1) is downstream of this: only when the threshold is momentary do pleasures and sufferings become strictly incommensurable across the severity line. Conversely, life- or world-bearers can embrace partial commensurability below the threshold while retaining lexicality above it. This suggests the threshold’s moral "grain" (momentary vs holistic) is the core architect of the view.
