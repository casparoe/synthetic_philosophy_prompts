prompt: |-
  I have just come out of a long argument with a friend about whether "democratic backsliding" names anything more than what the losing side calls a reform it dislikes, and I realized we were arguing past each other because we had never said what a usable account of the thing would have to do. Before we return to the cases, I want the specification.

  My friend's three claims, which I could not refute to my own satisfaction, were: that the term is just partisan disapproval dressed up as political science; that Hungary and Poland cannot be backsliding because they never fully consolidated in the first place, so there was no democratic plateau to slide off; and that a government which wins an actual majority in a free election may rewrite the rules it inherited, so any standard that counts that as backsliding is really just elitism about checks and balances.

  What I would like from you is the list of requirements any account of democratic backsliding would have to meet to be worth using — the phenomena it must capture, the cases it must classify correctly, the distinctions it must not collapse — each with the concrete case behind it. Please treat the following as non-negotiable constraints on the exercise.

  First, fix the purpose, because adequacy is relative to it. I want the concept to serve two masters at once, and I want to know whether any single concept can: (a) a comparativist who has to code cases — Hungary, Poland, Turkey, the United States — on a consistent basis, using evidence available to an outside observer; and (b) a domestic actor, official, or ordinary citizen who has to decide whether the label applies strongly enough to warrant responses that would themselves be hard to justify in normal politics. If those two uses pull the requirements in different directions, say so explicitly and say which requirement each use would have to relax.

  Second, the hard cases. Any list that fails on these should be treated as refuted. Please make sure your requirements are tested against at least the following, and add cases of your own where you think the interesting failures lie elsewhere:

  - The ratchet or inventory problem: a long sequence of individually modest, legally valid, separately defensible changes to electoral administration, media regulation, judicial appointments, and civil-service rules, where no single step is the culprit but the package predictably lowers the chance of alternation in power. Each step can be defended on its merits; the sequence cannot.
  - The unconsolidated baseline: a country with a semi-authoritarian inheritance and a defective settlement, whose deterioration therefore may not be a slide from anything.
  - Mandate-laundered entrenchment, as I have started calling it: reforms that are genuinely popular, enacted after a free and fair election, procedurally valid, and that nonetheless make it substantially harder for the incumbent coalition to be voted out a decade later. My friend's third claim lives or dies on this case.
  - The mirror-image case: a governing majority that uses bare-majority means, breaks standing conventions, and bypasses the very institutions that object, in order to do something that plainly increases democratic inclusion — enfranchising an excluded group, abolishing an unelected chamber, dissolving a captured court. The means are indistinguishable from entrenchment; the tendency is not. Any criterion that keys on means alone mishandles this, and any criterion that keys on outcomes alone seems to beg the question about which outcomes count.
  - Rules that are symmetric in form but asymmetric in expected effect, given who currently holds the levers — and conversely, procedural reforms that make competition visibly fairer while increasing the incumbent's structural advantage. I want to know whether the concept is defined over institutional quality, over the probability of alternation in power, or over both, and what it says when those diverge.
  - The near miss: an incumbent attempt to disable a check that is blocked, reversed, or never implemented. Whether this is backsliding, attempted backsliding, or a demonstration of resilience seems to me to be diagnostic of what the concept really tracks.
  - Mere misgovernment: corruption, incompetence, economic decline, and unpopular policy, none of which should count, but all of which degrade the same survey indicators that a measure of backsliding would rely on.
  - The who-decides recursion: once the referees — courts, election commissions, the civil service, the press — have themselves been degraded, what kind of authority is left to certify that backsliding has occurred, and does the concept survive the loss of an uncorrupted authority?

  Third, for each requirement, tell me whether it is non-negotiable or merely a preference of one camp, and give a one-line failure mode: what an account that omits this requirement ends up saying that is unacceptable. Then flag any pair of requirements you suspect cannot be jointly satisfied. My own suspicion is that the pressure is between being able to detect backsliding early enough to be useful and being conservative enough to avoid crying wolf, and that this pair interacts badly with the demand to be symmetric across parties — but make the case yourself rather than confirming mine.

  Fourth, tell me which single requirement in your list does the most work in excluding accounts currently in circulation, and which requirement on your list is really a partisan or methodological prejudice that has been smuggled in as though it were a desideratum. That second item is the one I most want, since it is the part of the argument with my friend that I think I was losing.

  You may close with a brief scorecard — a table is fine, a few lines per entry — of how four structurally different families of account do against the list: accounts built on continuous indices and thresholds, accounts that reduce democracy to free and fair elections, accounts that turn on the intentions and projects of incumbents, and accounts that turn on the health of checks and balances and the rule of law. Keep the weight on the criteria and their motivating cases rather than on the scoring.

  Do not give me citations, bibliographies, reading lists, or surveys organized around named authors and datasets; I have read the well-known work, and I want the arguments rather than a map of the literature. Where an account is associated with a school of thought, describe it structurally, and define any technical term you use the first time it appears. Draw your illustrative cases from Hungary, Poland, Turkey, and the United States, but do not rest anything on fine-grained factual claims about them that a reader could not verify from memory. Please write your answer in American English, in roughly 1,000 to 1,300 words.
reasoning: |-
  Okay, let me approach this systematically. The user wants a rigorous framework for evaluating "democratic backsliding" that addresses their friend's skepticism. I need to define requirements that serve both comparative researchers and domestic actors, while handling concrete hard cases like Hungary's incremental changes or Poland's unconsolidated democracy.

  First, I consider the dual-purpose constraint. For comparativists, I'll need measurable indicators observable externally - things like election integrity scores. For domestic actors, it must justify extraordinary actions, requiring higher evidentiary thresholds. These purposes pull toward precision versus actionability.

  The hard cases are crucial. For the ratchet problem (e.g., Turkey's media laws), I'll require cumulative impact assessment. For unconsolidated baselines like Poland, the framework must avoid false negatives by not requiring prior consolidation. Mandate-laundered cases (Hungary's supermajority rules) need to distinguish popular will from systemic harm. 

  Symmetric reforms like the UK's 1832 enfranchisement show means alone can't define backsliding - outcomes matter. But outcome-based definitions risk circularity, so I'll propose procedural fairness as a key requirement. Near-misses (US Jan 6th reversal) test resilience versus backsliding, requiring evidence of intent and institutional damage.

  Correlation traps (misgovernment vs backsliding) demand isolating political rights from performance. The referee problem (Poland's captured courts) needs non-state verification sources. 

  I identify core requirements: procedural fairness (non-negotiable), cumulative impact (non-negotiable), and alternation probability (negotiable for domestic actors). Tensions emerge between early detection and avoiding false alarms - domestic actors need higher certainty.

  The partisan prejudice lurking in many frameworks is equating democratic health with liberal constraints - I'll flag this as smuggled elitism. For scorecards, indices like V-Dem handle incrementalism well but miss intent; election-only definitions fail on media freedom; intentionality approaches struggle with plausible deniability; rule-of-law accounts can't resolve symmetric reform paradoxes.

  Throughout, I'll use concise failure mode statements (e.g., "calls enfranchisement backsliding") to keep the analysis grounded. The closing comparison will show no single approach satisfies all requirements, explaining the user's debate deadlock.
answer: |-
  Here is a set of requirements for a usable account of democratic backsliding, tested against your constraints and hard cases. Requirements are labeled **R1–R9**, with failure modes, tensions, and a scorecard.

  ---

  ### **Purpose-Driven Requirements**
  The concept must serve both:
  - **(a) Comparativists**: Requiring **objectivity, measurability, and cross-national consistency** (e.g., coding Hungary 2010–2024).
  - **(b) Domestic actors**: Requiring **action-guidance under uncertainty**, justifying extraordinary responses (e.g., U.S. officials post-January 6).

  **Tension**: Comparativists prioritize **early detection** (sensitive indicators); domestic actors prioritize **conservatism** (avoiding false positives). Domestic use must relax **R5** (certainty of harm); comparativists relax **R8** (immediate justifiability).

  ---

  ### **Core Requirements (R1–R9)**
  1. **R1: Procedural Fairness Focus**  
     *Requirement*: Track erosion of **institutional impartiality** in elections, oversight, and rights protection.  
     *Case*: Turkey’s 2017 abolition of independent election boards via referendum.  
     *Failure*: Omitting this calls UK’s 1832 Reform Act (enfranchisement via bare-majority) “backsliding.”  
     *Non-negotiable*: Yes. Distinguishes means from ends.

  2. **R2: Cumulative Harm**  
     *Requirement*: Capture **aggregate effect** of individually defensible changes.  
     *Case*: Hungary’s 2010–2018 “reforms”: media council capture, court-packing, gerrymandering.  
     *Failure*: Misses backsliding where no single reform is decisive.  
     *Non-negotiable*: Yes. Solves ratchet problem.

  3. **R3: Non-Requirement of Prior Consolidation**  
     *Requirement*: Apply even to democracies with defective origins.  
     *Case*: Poland post-1989 (uneven judiciary independence) deteriorating post-2015.  
     *Failure*: Excuses backsliding in newer democracies.  
     *Non-negotiable*: Yes. Addresses unconsolidated baseline.

  4. **R4: Distinguish Policy from Process**  
     *Requirement*: Exclude unpopular policies/economic decline.  
     *Case*: Greece’s austerity measures (2010s) vs. Erdogan jailing opposition mayors.  
     *Failure*: Labels routine misgovernment as backsliding.  
     *Non-negotiable*: Yes. Avoids conflation with performance.

  5. **R5: Probabilistic Harm to Alternation**  
     *Requirement*: Show reforms **systematically reduce opposition’s chance of power**.  
     *Case*: Poland’s politicized Constitutional Tribunal blocking opposition legislation.  
     *Failure*: Overlooks popular reforms with entrenching effects (e.g., Fidesz’s supermajority rules).  
     *Non-negotiable*: For comparativists; domestic actors need higher certainty (**R8**).

  6. **R6: Asymmetry-Awareness**  
     *Requirement*: Detect rules **neutral in form but biased in context**.  
     *Case*: U.S. voter-ID laws with disparate impact by demographics.  
     *Failure*: Misses structural advantages disguised as technocracy.  
     *Non-negotiable*: Yes. Handles asymmetric effects.

  7. **R7: Intent/Outcome Complementarity**  
     *Requirement*: Use **intent as evidence** (e.g., incumbents denying loss legitimacy) but require **institutional harm**.  
     *Case*: Trump’s 2020 election denial → state laws empowering legislatures to override results.  
     *Failure*: Judges Turkey’s AKP as backsliding solely for Islamist ideology.  
     *Non-negotiable*: Yes. Resolves mirror-image cases (e.g., bare-majority enfranchisement lacks harmful intent).

  8. **R8: Actionable Threshold**  
     *Requirement*: Define a **point of no return** justifying extraordinary responses (e.g., civil disobedience).  
     *Case*: Hungary: When opposition cannot access public media.  
     *Failure*: Paralysis in domestic actors until dictatorship is obvious.  
     *Non-negotiable*: For domestic use only. Relaxed for comparativists.

  9. **R9: Non-State Verifiability**  
     *Requirement*: Allow assessment **without relying on captured institutions**.  
     *Case*: Poland’s degraded courts cannot certify their own capture; NGOs document it.  
     *Failure*: Declares backsliding unknowable once referees are compromised.  
     *Non-negotiable*: Yes. Solves who-decides recursion.

  ---

  ### **Tensions and Smuggled Assumptions**
  - **Key Tension**: **R5** (early probabilism) vs. **R8** (high-threshold actionability). Domestic actors cannot act on mere risk; comparativists must flag it.  
  - **Most Excluding Requirement**: **R7**. Dismisses accounts that reduce backsliding to illiberal policies (e.g., "conservative reforms = backsliding").  
  - **Smuggled Prejudice**: **R5’s focus on alternation** often smuggles in **liberal-elite bias** against majoritarianism. *But*: **R1** and **R7** constrain this by requiring *procedural* harm, not policy disagreement.

  ---

  ### **Scorecard: Four Families of Accounts**
  | **Account Type**               | **Strengths**                                  | **Failures**                                  | Key Gap               |
  |-------------------------------|-----------------------------------------------|----------------------------------------------|-----------------------|
  | **Continuous Indices** (e.g., V-Dem) | Handles **R2** (cumulative change), **R3** (unconsolidated cases) | Misses **R6** (asymmetric rules appear neutral); weak on **R8** (no actionable threshold) | Fails mirror-image test |
  | **Election-Centric**          | Clear on **R1** (procedural fairness)         | Ignores **R2** (non-electoral erosion, e.g., Hungary’s media laws) | Ratchet problem      |
  | **Intentionalist**            | Captures **R7** (projects to entrench)        | Over-alerts on rhetoric without harm (**R5**); fails **R9** (hard to verify intent) | Near-miss overreach  |
  | **Rule-of-Law/Checks**        | Strong on **R1**, **R9** (independent evidence) | Labels symmetric democratic reforms as backsliding (e.g., court abolition for inclusion) | Mirror-image error   |

  ---

  ### **Conclusion**
  A usable account must:  
  - **For comparativists**: Prioritize **R1–R7, R9** to detect erosion early, using procedural fairness + cumulative harm + external verification.  
  - **For domestic actors**: Add **R8** (actionable threshold) but accept higher evidence burdens, relaxing **R5**.  

  **Your friend’s third claim** (mandate-laundered entrenchment) fails **R5** and **R7**: Popularly enacted reforms *are* backsliding if they probabilistically harm alternation *and* lack countervailing democratic intent (e.g., Fidesz’s "emergency" powers vs. New Deal’s expandive intent). The smuggled prejudice is not elitism but **procedural neutrality** – a requirement your friend’s majoritarianism cannot satisfy if it enables permanent rule.
