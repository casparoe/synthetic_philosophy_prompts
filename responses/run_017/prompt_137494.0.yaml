  First, I need to recall relevant concepts. The sunk cost fallacy is when past investments justify continuing, but here the team avoids mentioning past costs. Escalation of commitment involves increasing commitment despite negative outcomes, but the user wants to distinguish that. 

  The key points are: reasons exist from the start, but their perceived importance increases over time without acknowledging the sunk costs' influence. The user seeks a term for this implicit weight shift. 

  Existing terms like "sunk cost fallacy" don't fit because the arguments are future-oriented. "Escalation of commitment" is related but broad. The user also mentions that the reasons are valid, so it's not just rationalization. 

  I consider conceptual gaps. Terms like "shifting baseline" or "endowment effect" might be tangentially related but don't capture the dynamic of reasons gaining weight. The closest might be "rationalization," but the user wants to avoid that since the reasons are valid. 

  The core issue is the unacknowledged influence of sunk costs on the evaluation of future benefits. The term should emphasize that the criteria for acceptable reasons become more lenient as investment grows. 

  I propose "sunk cost gravity" as a new term. It captures how sunk costs exert an invisible pull, increasing the weight of existing reasons. This differentiates from sunk cost fallacy by focusing on the shift in reason weighting rather than direct justification. 

  Comparing to escalation of commitment, "sunk cost gravity" is a mechanism within it, specifically the subconscious reevaluation of reasons. For learned usefulness, the user notes that while some learning occurs, the weight shift happens even for pre-existing reasons. 

  The user likely needs this term to facilitate team discussions without accusing others of irrationality. Naming the pattern can help address the hidden influence of sunk costs constructively.
answer: |-
  Based on your excellent description, the core phenomenon you're observing **doesn't have a single, universally agreed-upon name**, but it's a **well-recognized pattern within the broader concepts of escalation of commitment and the sunk cost fallacy**. It specifically highlights the **subconscious, unspoken influence of sunk costs on the *evaluation criteria* for future actions.**

  Here's a breakdown of concepts and a proposed name:

  1.  **The Core Pattern:** The unacknowledged shift in the perceived weight/sufficiency of *existing, future-oriented* reasons to continue a project, driven subconsciously by the magnitude of sunk costs.
  2.  **Relationship to Known Concepts:**
      *   **Sunk Cost Fallacy:** This *is* a manifestation of it, but a sophisticated, disguised one. The textbook version ("We must continue *because* we spent $X") is crude. Your team's version is the fallacy operating in stealth mode: the *spending itself* isn't the *stated* reason, but it fundamentally alters the perceived validity or decisiveness of *other* reasons. The fallacy lies in letting the irrecoverable past investment influence the assessment of future costs/benefits.
      *   **Escalation of Commitment:** This is the *broader behavioral pattern* your team is exhibiting: continuing to invest resources (time, money, effort) into a failing course of action. The phenomenon you describe (the shifting weight of reasons) is a *key psychological mechanism* driving escalation. It's *how* the escalation manifests in the *content* of the justification.
      *   **Rationalization:** This is the *process* your colleagues are engaging in – generating plausible, often future-focused reasons to justify a decision (continuing) that might be driven by deeper, less rational motives (avoiding loss, admitting failure). However, as you note, rationalization is too broad; the key insight is that the *same* reasons become *more acceptable* over time solely due to sunk costs.
      *   **Learned Usefulness:** You rightly distinguish this. If *new* information genuinely reveals higher future value (e.g., "We discovered the data model perfectly fits this *other* critical project we didn't know about"), that's rational learning. The issue is when *pre-existing* reasons suddenly become "good enough" only *after* significant investment.

  **Proposed Name & Definition:**

  **Sunk Cost Gravity**

  *   **Definition:** The subconscious, unacknowledged force exerted by sunk costs, causing pre-existing future-oriented justifications for continuing a project to increase in perceived weight, validity, or decisiveness, thereby lowering the threshold for what constitutes an acceptable reason to proceed. The *existence* of the reasons doesn't change; their *perceived sufficiency* does, pulled upward by the growing mass of irrecoverable investment.

  **How it Differs:**

  *   **From Sunk Cost Fallacy (Textbook):** Sunk Cost Gravity focuses on the *mechanism* (shifting weight of *other* reasons) rather than the *explicit argument* (citing past costs). It explains *how* the fallacy often operates subtly in sophisticated environments.
  *   **From Escalation of Commitment:** Sunk Cost Gravity is a specific *driver* or *manifestation* *within* escalation. Escalation is the *what* (continuing to invest), Sunk Cost Gravity is a key explanation for the *why* (the changed perception of reasons).
  *   **From Rationalization:** It specifies the *type* of rationalization occurring – not just inventing reasons, but imbuing *existing* reasons with greater persuasive power due to sunk costs.
  *   **From Learned Usefulness:** It distinguishes between *genuine* new value discovered through the process and the *artificial inflation* of the value of *known* factors due to the psychological weight of the investment. Sunk Cost Gravity affects the *evaluation* of reasons, not necessarily the reasons themselves.

  **Why "Sunk Cost Gravity"?**

  *   **"Gravity":** Evokes an invisible force pulling things (the perceived weight/sufficiency of reasons) towards a center (the project). The larger the sunk cost "mass," the stronger the pull.
  *   **"Sunk Cost":** Clearly anchors the phenomenon to the irrecoverable investment.
  *   **It captures the essence:** The shifting *weight* of reasons, the unspoken influence, the lowering of the decision bar.

  **Using this Concept:**

  Naming it "Sunk Cost Gravity" gives you a tool to discuss the pattern constructively without accusing colleagues of irrationality:

  *   "I hear these future benefits (X, Y, Z). They *are* valid points. But I want us to be mindful of potential **Sunk Cost Gravity** – the risk that because we've invested so much already, we're subconsciously giving these existing reasons more weight than we *objectively* would have at the start, or than we'd give similar reasons on a *new* project proposal today. Let's try to evaluate X, Y, and Z *as if* we hadn't spent the last two quarters. Would they *still* be sufficient to justify the remaining cost and risk?"

  This focuses the discussion on the *evaluation process* rather than attacking the reasons themselves, making it more likely to foster objective reassessment. You're naming the hidden dynamic you observe.
