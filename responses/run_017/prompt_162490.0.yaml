prompt: |-
  I'm one of two staff attorneys in the interpretations office at my state's department of environmental quality — I'll invent a name and call the state Corbin so this doesn't turn into a dig through somebody's real code. Roughly twice a week a permit writer or a field inspector emails us asking what some sentence in our statutes actually means, and whoever picks it up writes a two-page guidance memo that gets posted on the intranet, gets treated as binding by about forty field staff, and maybe three or four times a year ends up stapled to a brief when a permit denial gets appealed. Right now my colleague and I do this by instinct and we disagree constantly: he thinks the only thing that matters is what the words conveyed to a careful reader back whenever the thing was passed, I keep reading the findings clause and asking what disaster the legislature was actually reacting to. We need something we can both run where the answer doesn't depend on who opened the email.

  One wrinkle that might help or might make the whole thing harder: Corbin has a codified rule of construction, call it the Administrative Interpretation Act, which says (paraphrasing) that we have to give effect to the meaning the words would have conveyed to an ordinarily attentive reader at the time the provision was adopted, taking account of (1) the words themselves, (2) how the provision fits with the rest of what was enacted alongside it, and (3) the mischief the enactment was aimed at — and that if after all that the meaning is genuinely unclear, we have to pick whichever reading least expands the reach of any penalty, fee, or prohibition. So it's a hybrid that isn't cleanly either of the two things people argue about. Constraints: ten business days per question, two lawyers, no budget for archival legislative-history digging (our pre-1990 files are full of holes), the output has to be a bright line a non-lawyer inspector can apply in the field without calling us, and it needs the general counsel's and the program director's signatures. We can't answer it depends very often or the inspectors stop asking us anything.

  Three live disputes, so you can see the shape of the problem. (1) One provision says no person shall operate a motorboat on any watercourse classified as Class I or Class II wild water, and the definitions section defines motorboat as any vessel propelled in whole or in part by machinery, whether or not that machinery is the vessel's primary means of propulsion. The enacted findings talk about preserving the quiet character and natural shoreline of the state's remaining wild rivers. Question: does the ban reach a canoe with a 55-pound-thrust electric trolling motor, and a battery-powered hydrofoil board? Our public brochure has told people for years that it doesn't, on the theory that electric motors are quiet, and I think that brochure is definately wrong. (2) A permitting provision used to require every applicant to publish notice in a local paper three weeks running and then file proof of publication; a 2019 amendment exempted small withdrawals from the publication requirement, but nobody touched the sentence requiring the applicant to file proof of publication within thirty days of the application being deemed complete, or the sentence in the next section saying an application is incomplete until everything required by the permitting section is filed. So: can we deny a small-withdrawal application because the applicant never filed proof of publication of a notice they were never required to publish? Text says yes, purpose screams no, and the tie-breaker about penalties is sitting right there — I want to see how your procedure actually orders those against each other. (3) A revocation provision says the department may revoke any permit upon finding that the permittee has violated any provision of this chapter or any rule adopted pursuant to it. A small town's only wastewater plant missed three monthly monitoring reports during a staffing crisis: no exceedance, no harm, just missing paperwork. The program director wants a compliance order instead of revocation, and so do I, and I have a suspicion any honest procedure is going to tell me that reading any provision as any material provision isn't interpretation at all, it's us quietly declining to use a power we plainly have, and that we'd have to own that out loud. If that's where it lands, say so plainly.

  What I want is an ordered procedure: the gates in sequence, what counts as closing each gate, what kind of evidence or argument is even admissible at each one, where it stops with a hard no or an undetermined, and where it stops and hands the question to a named human because it's a policy call dressed as a meaning call. It should be runnable in a morning by someone with a law degree and no theory background, it should output something an inspector can act on, and it should be honest about which steps are just judgment in a lab coat. Flag which steps come out the same no matter whether the person running it is a textualist or a purposivist, and which ones smuggle in that choice. Then run it in order on all three, including the one whose answer I'm not going to like, and say where it declines to answer at all. Please don't give me citations or a reading list — I have no library access from the office and can't check them. Do tell me how confident you are in each of the three applications, and single out the one step in the procedure you're least sure about, the one you'd expect a reviewing court to throw out.
reasoning: |-
  Okay, the user is a staff attorney at a state environmental department dealing with interpretation disputes. They need a structured procedure to resolve statutory ambiguities consistently. Let me unpack their situation.

  First, the core problem: two attorneys with opposing interpretation philosophies (textualism vs purposivism) need a neutral process. The state's Administrative Interpretation Act provides a hybrid framework - requiring consideration of text, context, and legislative purpose, with a tiebreaker favoring less punitive outcomes. 

  Key constraints jump out:
  - Must produce field-applicable bright lines
  - 10-day turnaround with no research budget
  - Outputs need legal and administrative sign-off
  - "It depends" answers undermine credibility

  The three examples illustrate classic statutory dilemmas:
  1. Motorboat ban - tension between technical definition and stated purpose (quiet preservation)
  2. Publication requirement - literal text vs obvious legislative intent
  3. Revocation authority - broad statutory language vs proportionality concerns

  Hmm... the real challenge is creating a procedure that:
  - Sequences analysis steps to avoid premature policy judgments
  - Flags when textual analysis ends and discretion begins
  - Explicitly calls out where professional judgment is required
  - Handles the statutory tiebreaker cleanly

  The user's hidden pain point seems to be institutional risk - they need to either justify existing practices (like the electric motor brochure) or change them with defensible reasoning. That revocation example is particularly telling - they suspect they're bending the law but want the procedure to force honest acknowledgment.

  For the methodology, I'm considering a gated approach:
  1. Pure textual analysis first - can it resolve the ambiguity alone?
  2. Then contextual reading - does surrounding text clarify?
  3. Purpose examination - but with strict limits given their limited history access
  4. Tiebreaker application
  5. Policy decision flag when all else fails

  Crucially, steps 1-2 should be objective (textualist-proof), while steps 3-5 invite purposivist input but require transparency about discretion. The tiebreaker creates a natural off-ramp for punitive provisions.

  Testing this on their examples:
  - For the motorboat, the textual definition seems clear but contradicts legislative intent. The procedure should surface this conflict explicitly rather than let either attorney's predisposition decide.
  - The publication glitch perfectly fits the tiebreaker - denying permits expands penalties, so text yields to purpose.
  - The revocation case fails all interpretation gates, forcing them to admit they're making a policy choice - which is what the user already suspects.

  The weakest point? Probably purpose analysis given their limited archives. The procedure must acknowledge this evidence gap rather than pretend certainty. Courts might question unsubstantiated purpose claims, so documenting why legislative history is unavailable will be key.

  This approach should give them consistency where possible and honesty where not - which seems to be their unstated goal: reducing interpretive disputes while protecting against bad faith "whataboutism" from permittees.
answer: |-
  Here’s a step-by-step procedure for statutory interpretation under Corbin’s Administrative Interpretation Act, designed for consistency, transparency, and field applicability. It prioritizes objective gates before policy calls, with tiebreakers for ambiguity. **Bold** = judgment-neutral steps; *Italics* = steps where textualist/purposivist leanings may influence outcomes.

  ---

  ### **Interpretation Procedure: 10-Step Gates**  
  *(Run sequentially; stop when a definitive answer emerges)*

  1. **Gate 1: Plain Meaning**  
     - *Task:* Read the disputed language in isolation. Would an ordinary reader (at time of enactment) find it unambiguous?  
     - *Closes If:* Only one reasonable interpretation exists.  
     - *Evidence Allowed:* Dictionary definitions, common usage guides.  
     - *Output:* Binding answer OR "Unclear" → Proceed to Gate 2.  
     - *Judgment Factor:* None (textualist/purposivist same).

  2. **Gate 2: Contextual Harmony**  
     - *Task:* Read the disputed provision alongside the entire section/chapter. Does context resolve ambiguity?  
     - *Closes If:* Surrounding text (e.g., definitions, related provisions) dictates a single reading.  
     - *Evidence Allowed:* Full statute text; enacted findings ONLY if referenced in the provision.  
     - *Output:* Binding answer OR "Unclear" → Proceed to Gate 3.  
     - *Judgment Factor:* Low (focus on textual relationships).

  3. **Gate 3: Enacted Findings**  
     - *Task:* Review the statute’s preamble/findings. Does it explicitly resolve the ambiguity?  
     - *Closes If:* Findings directly address the disputed term or purpose.  
     - *Evidence Allowed:* Only the enacted findings clause (no external history).  
     - *Output:* Binding answer OR "Unclear" → Proceed to Gate 4.  
     - *Judgment Factor:* *Moderate (purposivists may over-index; textualists may downplay)*.

  4. **Gate 4: Mischief Analysis**  
     - *Task:* Identify the specific problem the statute aimed to fix (per findings). Does one reading align?  
     - *Closes If:* All plausible interpretations *except one* contradict the core legislative purpose.  
     - *Evidence Allowed:* Enacted findings only (no unpassed history).  
     - *Output:* Binding answer OR "Unclear" → Proceed to Gate 5.  
     - *Judgment Factor:* *High (purposivists dominate; textualists resist)*.

  5. **Gate 5: Penalty Tiebreaker**  
     - *Task:* If Gates 1–4 yield no answer, apply the Act’s tiebreaker: Which reading *least expands* penalties/fees/prohibitions?  
     - *Closes Always:* Pick the narrowest regulatory reach.  
     - *Output:* Binding answer.  
     - *Judgment Factor:* Low (mechanical comparison of scope).

  6. **Gate 6: Policy Call Flag**  
     - *Task:* If Gates 1–5 fail, conclude: "Meaning is genuinely unclear after statutory analysis."  
     - *Output:* "Resolution requires policy discretion by [Program Director]."  
     - *Next Step:* Draft memo outlining options for Program Director’s decision.  

  ---

  ### **Key Features for Your Constraints**  
  - **Time:** Gates 1–5 doable in 3–4 hours with a statute copy.  
  - **Field Output:** Answers are binary ("banned/allowed," "required/not required") or a directive ("Program Director decides").  
  - **Honesty:** Gates 3–4 explicitly flag where judgment enters; Gate 6 forces policy transparency.  
  - **General Counsel Sign-off:** Memo documents each gate’s outcome.  

  **Weakest Step:** Gate 4 (Mischief Analysis).  
  - *Why:* Relies solely on enacted findings, which may be vague. Courts may demand more evidence (but your Act doesn’t require it).  
  - *Risk:* A reviewing court could reject if findings are too general. Mitigate by tethering analysis tightly to findings language.  

  ---

  ### **Application to Your Cases**  
  *(Assumes enacted findings are as described; run Gates 1–5 sequentially)*  

  #### **1. Motorboat Ban (Electric Canoe/Hydrofoil)**  
  - **Gate 1 (Plain Meaning):** "Propelled in whole or in part by machinery" includes electric motors. *Unambiguous. Hard "YES, banned."*  
    - *Stop Here.* Output: "All motorized vessels (including electric) banned on Class I/II waters."  
    - *Confidence:* 95% (text is clear; brochure was wrong).  
    - *Field Rule:* "No motors of any type."  

  #### **2. Small-Withdrawal Publication Proof**  
  - **Gate 1 (Plain Meaning):** "File proof of publication" + "incomplete until everything required is filed" → *Textually, proof required. But "required by permitting section" is ambiguous.* → **Unclear.**  
  - **Gate 2 (Context):** 2019 exemption removed publication but not proof-filing. Context suggests oversight → **Unclear.**  
  - **Gate 3 (Findings):** No findings on paperwork; purpose is public notice for large projects → **Unclear.**  
  - **Gate 4 (Mischief):** Legislature reacted to burdening small applicants; requiring proof for no notice expands bureaucracy → **Leans toward "NO proof needed."**  
    - *But not definitive; proceed to Gate 5.*  
  - **Gate 5 (Tiebreaker):** Denial expands prohibition → **Pick reading LEAST expanding penalty: "NO, cannot deny for missing proof."**  
    - *Output:* "Small withdrawals exempt from proof filing."  
    - *Confidence:* 90% (Gate 5 decisive).  
    - *Field Rule:* "Process small withdrawals without proof of publication."  

  #### **3. Wastewater Permit Revocation (Missed Reports)**  
  - **Gate 1 (Plain Meaning):** "Violated any provision" includes missing reports → *Unambiguous "YES, revocation allowed."*  
    - *But you suspect policy overreach → Test further.*  
  - **Gate 2 (Context):** No distinction between major/minor violations → **Unchanged.**  
  - **Gate 3 (Findings):** Generic findings about "ensuring compliance" → **No help.**  
  - **Gate 4 (Mischief):** Legislature targeted harmful noncompliance; missed paperwork with no harm may not fit → **Suggests "not revocable," but NOT definitive (findings don’t specify).**  
  - **Gate 5 (Tiebreaker):** Revocation expands prohibition → **Pick narrowest reading: "Revocation not mandatory for *de minimis* violations."**  
    - *Output:* "Department has *discretion* to revoke but is not required to. Gate 6: Policy call for Program Director on whether to revoke."  
    - *Confidence:* 70% (Gate 1 is strong; Gate 5 creates flexibility).  
    - *Field Rule:* "Noncompliance with reporting *may* trigger revocation. Consult Program Director for minor violations."  
    - **Honesty Check:** The memo must state: "Text allows revocation; tiebreaker avoids expanding penalties, but non-revocation is a policy choice."  

  ---

  ### **Procedure Summary**  
  - **Gates 1–2:** Text/context focus → High objectivity.  
  - **Gates 3–4:** Purpose focus → Judgment enters (*purposivist leverage*).  
  - **Gate 5:** Tiebreaker → Mechanical.  
  - **Gate 6:** Policy escape valve → Forces accountability.  

  **Result for You:**  
  1. Electric motors banned (text wins).  
  2. No proof needed (tiebreaker saves purpose).  
  3. Revocation allowed but avoidable via policy (text + tiebreaker enable discretion).  

  **Least Confident Step:** Gate 4 (Mischief Analysis) — it’s the most vulnerable to court challenge if findings are thin. Protect it by rigorously citing *only* enacted findings and acknowledging uncertainty.  

  This procedure forces consensus by sequencing analysis and reserving policy for last. It meets your deadlines, outputs field rules, and satisfies the Act’s hybrid approach.
