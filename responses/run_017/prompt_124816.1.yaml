prompt: |-
  I am designing the final session of a final-year undergraduate seminar on desert, moral luck and non-Western moral philosophy. The students will have read nothing on karma specifically, and I want them to leave with a classification instrument rather than a summary: a decision tree that walks someone from ordinary moral intuitions through a series of forced choices to a named position on what karma is, and on whether any version of it can actually do the work a theory of moral desert is supposed to do. The session's guiding question is whether karma handles the problem of moral luck better or worse than the mainstream retributivist views the students have already covered.

  Please build the tree from the logical space rather than from a list of positions: start from the branching questions and the combinations of answers they permit, and only then locate the actual views in that space.

  Requirements for the tree:

  Six to eight branch nodes. Each node must be phrased as a question a student with no background in Indian philosophy could answer on the spot — a concrete case or a blunt claim, never a question like "do you accept the doctrine of no-self?" No node may be labelled with the name of a tradition, school or historical figure; the labels come out at the leaves, not at the forks.

  The distinctions I want forced, in addition to any you think belong: whether the act and its payoff must be linked by a single persisting subject or only by causal continuity in a stream with no such subject; whether the payoff is produced by the act itself (through what it does to the agent's own character, say) or meted out by an independent moral order; whether what is owed is fixed by what was done (backward-looking satisfaction of desert) or by what the payoff is for (correction, moral education, restoration of a balance); whether it is the agent's intention or the outcome that generates the account; whether the unit of accounting is the individual agent or something larger that shares a life, a family, a community or a nation; and whether the circumstances of one's birth can themselves be the discharge of a prior account — the "bad rebirth" move — with an eye to what that implies about blaming sufferers for their suffering.

  At each leaf, give the standard label where one is reasonably well established and write "unnamed" where nobody really defends it; where the right label depends on which tradition you ask, say so instead of averaging them. Each leaf carries one sentence on its most awkward commitment, and a flag for whether it still counts as a theory of desert at all, or has quietly become something else.

  List the combinations of answers that the logical space allows but that nobody occupies, and say briefly for each whether it is empty because it is incoherent, because it is merely unattractive, or because it is unexplored. Flag any pair of leaves the tree cannot actually separate rather than inventing a distinction to pull them apart.

  Finish with a short note on how to run the tree as a live show-of-hands exercise in a ninety-minute seminar: which nodes to take in which order, and where you expect the room to split.

  Constraints: no bibliography, no reading list, no citations, and no specialist terminology the students could not already have picked up from a general moral philosophy course — if a distinction needs a technical term, define it in the node itself. Assume you have no access to a library and do not guess at sources; what I want is the structure of the debate, not its literature. Please write the whole thing in British English.
reasoning: |-
  Hmm, the user is designing a final session for an undergraduate seminar on desert, moral luck, and non-Western moral philosophy. They specifically want a decision tree about karma that helps students classify positions based on logical choices, not prior knowledge. The students haven't read anything on karma, so the tree must use accessible questions—no technical terms or tradition names until the end leaves.

  The key requirements are:
  - Six to eight branch nodes phrased as concrete questions or cases.
  - Must force distinctions about: persistence of subject, mechanism of payoff (internal vs external), purpose of payoff (backward vs forward-looking), basis of desert (intention vs outcome), unit of accounting (individual vs collective), and whether bad rebirth can discharge prior debt.
  - Each leaf should have a standard label (or "unnamed" if none), one sentence on its awkward commitment, and a flag for whether it still counts as desert theory.
  - List unoccupied combinations and why.
  - Note how to run it live in 90 minutes.

  The user's deeper needs: They want students to engage critically with karma as a solution to moral luck, comparing it to retributivism. The tree should reveal structural tensions, not just summarize views. Avoiding labels at forks ensures students think from first principles.

  Building the tree:
  Start with the core conflict: moral luck. Desert theories struggle with it—people get blamed/praised for things beyond their control. Karma's appeal is its promise to resolve this via rebirth, but details vary. The branches must unpack those variations.

  Logical branching:
  1. **Unit of accounting** first—it's fundamental. Karma often expands beyond the individual, which affects moral luck (e.g., familial karma dilutes individual responsibility). Question: "Can a newborn inherit moral debts?" Forces collective vs individual focus.
     
  2. **Basis of desert**: Intention vs outcome. Moral luck heavily involves outcomes (e.g., drunk driver who hits someone vs one who doesn't). Question: "Two equally negligent acts—one causes disaster, one doesn't. Do they deserve the same karma?" Splits deontological vs consequentialist leanings.

  3. **Mechanism of payoff**: Internal (act changes character) vs external (cosmic ledger). Affects whether karma is naturalistic or theological. Question: "If a thief reforms, does avoiding punishment still require repayment?" Tests if payoff is about character or external balance.

  4. **Purpose of payoff**: Backward-looking (desert) vs forward-looking (reform). If karma prioritizes reform, it might not be desert anymore. Question: "Should suffering primarily balance past wrongs or prevent future ones?" Flags desert-theory drift.

  5. **Persistence of subject**: Does the same "self" bear karma? Critical for rebirth debates. If no persistent self, karma becomes impersonal causality—blurring desert. Question: "Must the sufferer be the same 'person' who acted?" Challenges personal identity in desert.

  6. **Bad rebirth as discharge**: Can birth circumstances be karmic payback? If yes, it risks blaming victims. Question: "Can being born disabled be deserved punishment?" Forces confrontation with moral luck's cruelty.

  Order matters: Start with unit (broadest), then basis (intent/outcome), then mechanism/purpose (how karma works), persistence (metaphysical), and end with bad rebirth (applied ethics). This flows from concrete to abstract.

  Unoccupied combinations:
  - E.g., Individual unit + external mechanism + no persistent subject: Unnamed. Why empty? If no persistent self and payoff is external, who is punished? Likely incoherent.
  - Collective unit + internal mechanism + backward purpose: Unnamed. Why empty? Internal change is individual; hard to apply to collectives. Probably unattractive.

  Running it live:
  - 90 mins: Take 5 mins intro, then spend ~10 mins per node (6 nodes = 60 mins), leaving 25 mins for discussion.
  - Order: Q1 (unit) → Q2 (basis) → Q3 (mechanism) → Q4 (purpose) → Q5 (persistence) → Q6 (bad rebirth). 
  - Splits expected: Q1 (individual vs collective—room divides), Q2 (intent vs outcome—philosophy students often split), Q6 (bad rebirth—controversial, likely uneven split).
  - Use show of hands, track paths on board. After reaching leaves, discuss: "Which positions handle moral luck best? Does karma solve it or worsen it?"

  Final note: The tree exposes trade-offs. E.g., karma with persistent self and bad rebirth "solves" moral luck by assigning birth circumstances as desert—but at cost of victim-blaming. Some positions (e.g., forward-looking karma) cease to be desert theories entirely. Students should see that no position escapes tension.
answer: |-
  Below is a decision tree structured to force distinctions within the logical space of karma as a theory of desert, designed for students with no prior exposure. It uses concrete, accessible questions and adheres to your constraints. The tree has **six branch nodes**, each phrased as a blunt case-based or claim-based question. Positions are labelled only at the leaves, with notes on awkward commitments and whether they qualify as desert theories. Unoccupied combinations and unresolved distinctions are noted separately. British English is used throughout.

  ---

  **Decision Tree: Classifying Karma's Approach to Desert and Moral Luck**  
  *Start at Node 1 and follow the branches based on "yes" or "no" answers.*

  ### **Node 1: Unit of Accounting**  
  *Question: If a child is born into severe poverty due to their parents' crimes, is that child "paying off" a moral debt?*  
  - **Yes** → Proceed to Node 2A (Unit extends beyond the individual).  
  - **No** → Proceed to Node 2B (Unit is strictly individual).  

  ### **Node 2A: Basis of Desert (Collective Context)**  
  *Question: Two people commit identical thefts intending equal harm, but one accidentally kills a guard during the act. Do their karmic "debts" differ?*  
  - **Yes** (Outcome matters more) → Proceed to Node 3A.  
  - **No** (Intention matters more) → Proceed to Node 3B.  

  ### **Node 2B: Basis of Desert (Individual Context)**  
  *Question: Same as Node 2A (Two identical thefts, one causes death). Do their karmic "debts" differ?*  
  - **Yes** (Outcome matters more) → Proceed to Node 3C.  
  - **No** (Intention matters more) → Proceed to Node 3D.  

  ### **Node 3A/B/C/D: Mechanism of Payoff**  
  *Question: A reformed thief now does good deeds. Can their suffering (e.g., illness) still be "deserved" repayment for past thefts, even if they've changed?*  
  - **Yes** (Payoff is externally enforced) → Proceed to Node 4.  
  - **No** (Payoff is self-produced through character/action) → Proceed to Node 5.  

  ### **Node 4: Purpose of Payoff (External Mechanism)**  
  *Question: Should deserved suffering primarily balance past wrongs, or instead deter future ones?*  
  - **Balance past wrongs** (Backward-looking) → Proceed to Node 6A.  
  - **Deter future wrongs** (Forward-looking) → Proceed to Node 6B.  

  ### **Node 5: Purpose of Payoff (Internal Mechanism)**  
  *Question: Same as Node 4 (Balance past wrongs or deter future ones?).*  
  - **Balance past wrongs** → Proceed to Node 6C.  
  - **Deter future wrongs** → Proceed to Node 6D.  

  ### **Node 6A/B/C/D: Persistence of Subject and Bad Rebirth**  
  *Question: Can being born blind be "deserved" punishment for a past-life act, even if the baby has no memory of that life?*  
  - **Yes** (Persistence/causal continuity includes rebirth) → Reach a leaf.  
  - **No** (Persistence requires a single life/identity) → Reach a leaf.  

  ---

  **Leaves of the Tree**  
  *Labels, awkward commitments, and desert-theory status:*

  1. **Collective Unit + Outcome-Based + External Payoff + Backward-Looking + Rebirth Accepted**  
     - *Label:* Theistic Hindu/Buddhist (varies by tradition).  
     - *Awkward commitment:* Blaming sufferers (e.g., a starving child) for "ancestral karma" they didn't commit.  
     - *Desert theory?* **Yes** (backward-looking desert remains core).  

  2. **Collective Unit + Outcome-Based + External Payoff + Forward-Looking + Rebirth Accepted**  
     - *Label:* "Unnamed" (rarely defended).  
     - *Awkward commitment:* Justifying present suffering as "moral education" for a group, risking authoritarianism.  
     - *Desert theory?* **No** (shifts to consequentialist deterrence).  

  3. **Collective Unit + Intention-Based + External Payoff + Backward-Looking + Rebirth Accepted**  
     - *Label:* Jain or Yogācāra Buddhist (depends on tradition).  
     - *Awkward commitment:* Punishing a community for one member's unacted evil thoughts.  
     - *Desert theory?* **Yes** (intentions incur desert).  

  4. **Collective Unit + Intention-Based + External Payoff + Forward-Looking + Rebirth Accepted**  
     - *Label:* "Unnamed".  
     - *Awkward commitment:* Inflicting collective suffering to "reform" future intentions, implying guilt by association.  
     - *Desert theory?* **No** (becomes educative utilitarianism).  

  5. **Individual Unit + Outcome-Based + External Payoff + Backward-Looking + Rebirth Accepted**  
     - *Label:* Mainstream Hindu (e.g., Vedanta).  
     - *Awkward commitment:* Asserting a baby's disability "pays" for a past-life outcome they didn't control (moral luck paradox).  
     - *Desert theory?* **Yes** (retributivist desert intact).  

  6. **Individual Unit + Outcome-Based + External Payoff + Forward-Looking + Rebirth Accepted**  
     - *Label:* "Unnamed".  
     - *Awkward commitment:* Suffering (e.g., disease) as "training" for outcomes in future lives—unverifiable and paternalistic.  
     - *Desert theory?* **No** (teleological reformism).  

  7. **Individual Unit + Intention-Based + External Payoff + Backward-Looking + Rebirth Accepted**  
     - *Label:* Early Buddhist (e.g., Theravada).  
     - *Awkward commitment:* "Deserved" rebirth for intentions alone, even if outcomes were neutral/benign.  
     - *Desert theory?* **Yes** (desert anchored to mental acts).  

  8. **Individual Unit + Intention-Based + External Payoff + Forward-Looking + Rebirth Accepted**  
     - *Label:* "Unnamed".  
     - *Awkward commitment:* Using rebirth to "correct" future intentions, denying closure for past acts.  
     - *Desert theory?* **No** (aims at character reform).  

  9. **Any Unit + Any Basis + Internal Payoff + Backward-Looking + Rebirth Rejected**  
     - *Label:* Aristotelian/Stoic (non-karma).  
     - *Awkward commitment:* Claiming a lifelong criminal "deserves" their guilt-pain—ignores structural luck (e.g., upbringing).  
     - *Desert theory?* **Yes** (desert as internal consequence).  

  10. **Any Unit + Any Basis + Internal Payoff + Forward-Looking + Rebirth Rejected**  
      - *Label:* Confucian (non-karma).  
      - *Awkward commitment:* Reducing "desert" to self-improvement, excusing societal injustice.  
      - *Desert theory?* **No** (moral education framework).  

  11. **Any Unit + Any Basis + Any Payoff + Rebirth Rejected**  
      - *Label:* Secular Retributivism (non-karma).  
      - *Awkward commitment:* Moral luck (e.g., birth privilege) is unaddressed; desert is arbitrary.  
      - *Desert theory?* **Yes** (standard desert model).  

  *(Note: "Any" in leaves 9–11 denotes paths collapsing distinctions irrelevant when rebirth is rejected or payoff is internal.)*  

  ---

  **Unoccupied Combinations & Why**  
  1. **Collective Unit + Internal Payoff + Backward-Looking**: Empty. *Why?* **Incoherent**—internal payoff (e.g., character change) requires individual subjectivity; cannot apply "collectively".  
  2. **Individual Unit + External Payoff + Rebirth Rejected**: Empty. *Why?* **Merely unattractive**—resembles secular retributivism but posits an implausible "cosmic accountant" for one life.  
  3. **Outcome-Based + Internal Payoff + Rebirth Accepted**: Empty. *Why?* **Unexplored**—no tradition links outcomes to self-produced payoffs across lives; possibly due to tension (outcomes are external, internalisation is odd).  

  ---

  **Indistinguishable Leaves**  
  - **Early Buddhist (Leaf 7)** vs **Jain/Yogācāra (Leaf 3)** cannot be separated by this tree. Both share "intention-based + rebirth accepted". The tree cannot force the individual/collective distinction here without a metaphysical node (excluded per constraints).  
  - **"Unnamed" Leaf 2** vs **"Unnamed" Leaf 4** collapse in practice—both justify group suffering forward-looking, differing only in outcome/intention basis.  

  ---

  **Running the Tree in a 90-Minute Seminar**  
  - **Timing & Order**: Spend 10 mins on intro (moral luck problem; desert's demands), 10 mins per node (60 mins total), 20 mins on discussion. Follow node order as numbered:  
    1. Unit of Accounting (Q1) → 2A/B. Basis of Desert → 3A/B/C/D. Mechanism → 4/5. Purpose → 6A/B/C/D. Persistence/Rebirth.  
  - **Show-of-Hands**:  
    - At **Node 1**, expect a split (40% yes / 60% no)—students resist collective guilt.  
    - At **Node 2A/B**, sharp split (50/50)—philosophy students debate intention vs outcome fiercely.  
    - At **Node 3**, majority (70%) will say "no" (reject external payoff if reform occurs)—aligns with Western rehabilitation intuitions.  
    - At **Node 6**, expect controversy: 30% "yes" (rebirth accepted) if cultural familiarity exists; else <20%.  
  - **Pacing**: Use real-time polling (e.g., coloured cards). Track major paths on board. After reaching leaves, regroup: "Which leaves handle moral luck better than retributivism? Worse? Which cease to be desert?" Focus debate on rebirth’s role in "solving" luck (e.g., Leaf 5 "solves" by assigning birth but blames sufferers; Leaf 11 ignores it).  

  This structure forces engagement with karma’s mechanics while spotlighting trade-offs: rebirth "answers" moral luck but at the cost of victim-blaming or abandoning desert. Students leave with a map, not a verdict.
