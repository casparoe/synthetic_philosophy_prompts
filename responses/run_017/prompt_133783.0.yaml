answer: |-
  The core principle is: **A good Bongard problem's rule must be *perceptually immediate*—discernible through rapid, holistic visual processing (gestalt) without requiring verbal reasoning, exhaustive counting, complex computation, or ambiguous interpretation.**

  Here's how this principle saves (or overturns) your verdicts and addresses your questions:

  ### Saved Verdicts
  1.  **Left convex, right concave:** GOOD. Convexity/concavity is a fundamental gestalt property processed pre-attentively.
  2.  **Small shape inside vs. outside:** GOOD. Spatial relationships (containment) are processed rapidly and holistically.
  3.  **Even vs. odd number of shapes:** GOOD (for small counts). Subitizing (instantly recognizing quantities ≤4) makes low-count parity perceptually immediate. (This *fails* for high counts, supporting the principle).
  4.  **Exactly one shape touches the border:** GOOD. Visual search for connectivity/contact is efficient; "exactly one" is a specific, countable state.
  5.  **Symmetric under half-turn:** GOOD. Symmetry detection is a core gestalt process, even if it takes a moment to mentally rotate.
  6. **Two shapes overlap >50% vs. not:** GOOD. Overlap proportion is visually estimated well by human perception.
  7.  **Looks like it's tipping over:** GOOD. Relies on intuitive gestalt principles (balance, implied motion, center of mass) processed rapidly.
  8.  **Good distractor examples (smooth dents):** GOOD. Distractors block shallow features (like "spikiness") without obscuring the core perceptual rule (convexity).

  ### Overturned/Corrected Verdicts
  1.  **Prime vs. composite total straight segments:** CHEATING/BAD (Correct). Requires explicit counting *and* mathematical computation (primality test), violating perceptual immediacy. (Unlike simple parity on subitizable quantities).
  2.  **Logically identical "not exactly one" touches border:** BAD (Correct, but explained). While logically equivalent to "exactly one", "not exactly one" (0, 2+) forces verbal negation ("find boxes where the touch-count *isn't* one") instead of a single positive visual target. This requires serial checking, breaking perceptual flow.
  3.  **Apex angle >60 degrees:** CHEAP/BAD (Correct). Thresholds on continuous scales (angles, sizes) are imprecise perceptually unless anchored by clear reference points (like >50% overlap). Requires measurement/comparison, not gestalt.
  4.  **Composite rule (triangle OR dotted circle):** BAD (Correct). Splits attention; the brain searches for *two* unrelated features (triangularity, dot-in-circle) instead of one holistic pattern. Feels like stapling.

  ### The Flip-Flop Case: Uniqueness of Shapes
  *   **"Every shape on left is unique; right has duplicates"** is BORDERLINE under this principle.
      *   *Why it might feel GOOD:* Detecting exact repetition (duplicates) is perceptually immediate. A repeated shape "pops out".
      *   *Why it might feel BAD:* Proving *all* shapes are unique requires serial comparison of *every* pair in the left boxes, which is slow, exhaustive, and verbal (e.g., "Is A=B? A=C? A=D? B=C? ..."). It lacks a single positive gestalt feature defining the left side.
  *   **Verdict:** This problem lies at the edge of perceptual immediacy. The *presence* of duplicates (right side) is perceptually salient. The *absence* of duplicates (left side) is *not* a positive feature; it's defined by the *lack* of a salient event (repetition). This asymmetry causes your flip-flopping. It's acceptable but weaker than rules with a positive, holistic feature on the left.

  ### The Unmentioned Case: Topology vs. Geometry
  *   **GOOD Rule:** "Left: Shapes have exactly 1 hole (like a ring or eyeglass frame). Right: Shapes have 0 holes or 2+ holes." (Topological property - number of holes - is perceptually immediate).
  *   **BAD Rule:** "Left: Shapes have perimeter between 1.5x and 2x the diameter. Right: Perimeter <1.5x or >2x diameter." (Requires complex geometric calculations/estimations, violates immediacy).

  ### Reasoning Summary
  Your gut aligns with cognitive science. Humans excel at rapid, parallel processing of:
  *   **Gestalt Properties:** Convexity, symmetry, closure, containment.
  *   **Spatial Relations:** Inside/outside, touching/not touching, tipping balance.
  *   **Simple Quantification:** Low-number counts/parity, presence/absence of repetition.
  *   **Salient Events:** Seeing a duplicate, seeing a single object touch a border.

  Rules fail when they force:
  *   **Verbal Reasoning:** Explicit negation ("not one"), complex logical combinations (OR rules).
  *   **Exhaustive Search/Counting:** Proving uniqueness, high-number parity, prime numbers.
  *   **Precise Measurement:** Arbitrary thresholds on angles, sizes, ratios without clear perceptual anchors.
  *   **Ambiguity:** Subjective interpretations like "graceful" lack perceptual consensus.

  **Your flip-flop on uniqueness is explained:** It leverages the salience of repetition (good) but requires proving a negative via exhaustive comparison on the left (bad). **The principle saves all your core intuitions** – it explains *why* "prime" feels like cheating while "odd/even" (for small N) works, why negation feels worse than affirmation, and why holistic features beat arbitrary thresholds or composite rules. Trust your gut when the rule "pops" visually without needing internal narration.
