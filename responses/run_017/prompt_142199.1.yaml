  Breaking it down: First, the user needs concrete scene analysis. The three examples they picked are perfect—each shows different failures of Gricean machinery. The houseguest scene (denial of father's death) demonstrates pathological cancellability. Miss Kenton's "turning point" conversation reveals meaning emerging from narrative context, not speaker intent. The pier scene shows implicature generated by the older narrator's hindsight. 

