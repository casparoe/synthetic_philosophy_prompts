prompt: |-
  You are a philosopher working at the intersection of bioethics, personal identity, and the philosophy of law, and you have been asked to serve as the conceptual consultant to a hospital clinical ethics committee that is rewriting its policy on advance directives. Think carefully before you write: spend your initial thinking on generating the space of hard cases, grouping them into families, and asking of each candidate requirement what exactly it would cost to give it up. Only then assemble the list. I want the reasoning to show, not just the deliverable.

  Fix the purpose first, because adequacy is relative to it. The theory I want specified is a theory of the *authority* of the earlier self: it must tell a surrogate or a committee, at the bedside and under time pressure, whether to honor, reinterpret, or override an instruction issued by a patient who can no longer decide. It is not a theory of what the patient's good consists in, and not a theory of fair allocation — though it must have a principled interface with both, and I want to know where that interface is.

  Write the desiderata: everything an adequate account has to deliver, each with the case or consideration behind it. Below are the materials I keep circling back to. Treat them as candidates, not as the list: some may be prejudices of one camp rather than genuine requirements, and I expect you to sort them, merge them, and above all to add the ones I have missed.

  The cases. Ordinary dementia: an instruction to stop treatment issued decades earlier by someone who now seems contented and who resists. The never-competent patient: a written instruction authored by a guardian for someone who has never had a competent self at all — a view keyed to precedent autonomy has nothing to say here, and I want to know whether that is an acceptable scope limit or a defect. The phase-cycling patient: someone who is competent and reflective while medicated and incompetent while off medication, issuing confident and mutually contradictory directives in each phase, each of which anticipates and cancels the other. The proleptic directive: an instruction issued by someone who foresees that her values are about to change in a way she currently welcomes — conversion, transition, a vocation — and who writes anyway. The velocity problem: one instruction stable across twenty years, another written in the third week of a new enthusiasm; if duration of endorsement matters, the theory owes an account of why any threshold is not ad hoc. The ratchet directive: an instruction whose author permits the later self to relax it but never to tighten it, or vice versa. The Ulysses clause and its mirror: an instruction to disregard future requests, and an instruction whose entire point is that the author predicted she would later demand the opposite.

  The distinctions I do not want collapsed. Having authority over a decision versus having one's instruction weigh as one consideration among others, that is, veto versus input. Honoring an instruction versus interpreting it versus treating it as evidence. Binding the later self versus binding the surrogate. The earlier self's actual instruction versus what the earlier self would have wanted had she foreseen this situation; these come apart constantly and I suspect the whole controversy hides in the gap. Authority over what is done versus authority over which values count in deciding it. Degree of psychological continuity versus the binary threshold of decisional incapacity.

  The constraints from elsewhere that the theory cannot contradict. Affective forecasting about one's own future adaptation is systematically poor. Many people with advanced cognitive decline report positive well-being while lacking the capacities that make a preference authoritative. Apparent preferences expressed by a still-competent patient can be products of depression, pain, delirium, or anosognosia. Identity change is gradual and comes in degrees. And then an epistemic constraint rather than a substantive one: the committee usually cannot know what the later self's experience is actually like, or how the earlier self would have responded to a situation nobody contemplated. Any requirement that the theory be sensitive to facts like these is in tension with any requirement that it be usable by non-philosophers in an afternoon.

  Three further deliverables. First, mark which requirements are non-negotiable and which are preferences of a camp — I expect, for instance, that the demand for a determinate answer in every case is a preference of clinical practice rather than a desideratum, and I want you to test that suspicion and find the others. Second, flag any pair of desiderata you suspect cannot be jointly satisfied; if some subset is jointly unsatisfiable, that result is more valuable to me than any list, so argue for it rather than papering over it. Third, name the single requirement that does the most work in excluding otherwise attractive views, and say why.

  Only after that, and briefly — no more than a few lines per view — score the main families of answer against your own list: the integrity-based defense associated with Dworkin, the current-interests or best-interests view, value-endorsement and narrative or temporally-extended-self views, and Parfit-style reductionism about identity, which may dissolve the framing rather than answer it. If a family of views fails on a requirement you have already argued to be jointly unsatisfiable with another, say so instead of double-counting.
reasoning: |-
  Hmm, the user wants me to act as a philosopher consultant for rewriting advance directive policies. This is a complex interdisciplinary task requiring careful reasoning about personal identity, bioethics, and legal philosophy. The core challenge is determining when earlier directives from patients should bind decisions about their current care when they've lost decision-making capacity.

  The user provides rich material: dementia cases where a previously competent patient now seems content; directives for never-competent patients; contradictory instructions from patients cycling between medicated/unmedicated states; directives anticipating value changes; questions about duration of endorsement ("velocity problem"); ratchet clauses; and Ulysses contracts. They also emphasize important distinctions like veto vs input authority, and constraints like poor affective forecasting and epistemic limitations.

  I need to systematically generate desiderata for a theory of precedent autonomy. This means mapping the problem space by grouping hard cases into families: dementia paradox cases, identity fluctuation cases (like phase-cycling), temporal authority cases (ratchets/Ulysses clauses), special populations (never-competent), and epistemic constraint cases.

  For each candidate requirement, I must consider what we lose by abandoning it. For example, rejecting the "never-competent" scope limitation might overextend precedent autonomy concepts, but accepting it creates a coverage gap. The distinction between binding authority vs evidentiary weight is crucial - collapsing it could undermine patient sovereignty.

  Key tensions emerge: wanting directives to reflect deep values conflicts with evidence that people predict future preferences poorly. Requiring contextual sensitivity clashes with needing clear operational rules for clinicians. Absolute authority views fail on dementia cases where patients seem content, while pure best-interest standards risk paternalism.

  I suspect irreducible conflicts between desiderata: we can't simultaneously honor all expressed preferences while correcting for poor affective forecasting, nor achieve full contextual sensitivity with operational simplicity. The deepest tension is between respecting precedent autonomy and protecting current welfare when they diverge.

  When evaluating existing frameworks, Dworkin's integrity approach handles dementia cases well but struggles with value changes. Best-interest standards are practical but risk undervaluing autonomy. Narrative views are rich but complex to apply. Parfitian reductionism dissolves identity concerns but may leave too little normative guidance.

  The most demanding requirement is respecting precedent autonomy without ignoring current suffering, which excludes views that completely discount either temporal perspective. For policy purposes, I'd recommend a default authority for directives with limited override clauses based on welfare thresholds, plus separate frameworks for special cases like never-competent patients.
answer: |-
  ## Theory of Precedent Autonomy: Desiderata for Advance Directive Authority

  **Step 1: Fixing Purpose & Generating the Case Space**
  The core purpose is a **decision procedure for surrogates/committees at the bedside**: when must they *obey* a prior instruction, when may they *reinterpret* it, and when may they *override* it, based solely on the authority of the earlier self's directive? This is distinct from determining the patient's *current* best interests or fair resource allocation, though the theory must interface coherently with those concerns (e.g., overriding a directive may *then* trigger best interests analysis).

  **Grouping Hard Cases into Families:**

  1.  **The Dementia Paradox Family:**
      *   *Ordinary Dementia:* Directive (e.g., "no antibiotics if demented") vs. current contentment/resistance.
      *   *Never-Competent Patient:* Directive authored *for* (not *by*) the patient (e.g., parent's directive for profoundly disabled adult child). Precedent autonomy concepts seem inapplicable.
      *   *Epistemic Gap:* Surrogate cannot know current subjective state (contentment/suffering).

  2.  **Identity Fluctuation & Value Instability Family:**
      *   *Phase-Cycling Patient:* Contradictory directives in on-med/off-med states, each pre-empting the other.
      *   *Velocity Problem:* Long-stable directive vs. recent directive written with intense, transient enthusiasm.
      *   *Proleptic Directive:* Directive anticipating and endorsing a *future* radical value change (e.g., "do X even though I know I'll later reject X as sinful").
      *   *Ratchet Directive:* Asymmetrical instructions (e.g., "never escalate care beyond Y, but you may provide *less* than Y if appropriate").

  3.  **Temporal Authority & Bindingness Family:**
      *   *Ulysses Clause:* "Disregard any future requests for life-sustaining treatment." (Binding future refusal).
      *   *Mirror Ulysses Clause:* "Disregard any future requests to *withdraw* life-sustaining treatment." (Binding future request *for* treatment).
      *   *Binding Surrogate vs. Binding Self:* Does the directive bind the *surrogate's* decision, or is it the earlier self attempting to bind the *later self's* choices (if competent)?

  4.  **Epistemic & Implementation Constraints:**
      *   Poor Affective Forecasting: People are bad at predicting future adaptation/well-being.
      *   Distorted Current Preferences: Depression, pain, delirium can distort expressed preferences *even* during apparent competence.
      *   Gradual Identity Change: No bright line between "same self" and "different self".
      *   Operational Feasibility: Must be usable by non-philosophers under time pressure.

  **Step 2: Generating & Refining Desiderata (D)**
  *(Reasoning: What must the theory deliver? What is lost if we drop it?)*

  1.  **D1: Respect for Deep Autonomy (Non-Negotiable Core):** The theory must recognize the *moral force* of a competent person's attempt to shape their future care, especially regarding core values or existential choices (e.g., refusing prolonged unconsciousness). *Cost of Dropping:* Abdicates the core ethical justification for advance directives; reduces patient to current state only.
      *   *Source:* Foundational bioethics principle; *Ulysses Clause, Proleptic Directive, Ratchet Directive*.

  2.  **D2: Protection from Profound Suffering (Non-Negotiable Constraint):** An instruction cannot compel caregivers to inflict severe, unmitigated suffering on the *current* patient when that suffering is verifiable and not consented to *in the moment*. *Cost of Dropping:* Sanctions torture-by-proxy; violates core duties of care.
      *   *Source:* *Ordinary Dementia* (if current resistance indicates suffering); epistemic constraints; interface with *current* welfare duties.

  3.  **D3: Scope Limitation to Precedent Autonomy (Plausible Requirement):** The theory's core mechanism applies *only* when there was a competent "earlier self" whose directive is being considered. *Cost of Dropping:* Overextends "precedent autonomy" incoherently (e.g., to *Never-Competent*). *Cost of Keeping:* Leaves a gap needing a *different* framework (e.g., best interests/substituted judgment by guardian) for the never-competent. *Acceptable scope limit, not defect.*

  4.  **D4: Distinction: Binding Authority vs. Evidentiary Weight (Non-Negotiable):** The theory must clearly differentiate when an instruction is *binding* (veto power) and when it is merely *highly informative evidence* about values or wishes (input). *Cost of Collapsing:* Erodes patient control (if downgraded to evidence) or creates dangerous rigidity (if all instructions are binding commands).
      *   *Source:* Foundational distinction requested; *Ordinary Dementia* (is refusal binding or evidence of past values?).

  5.  **D5: Handling Value Instability & Identity Change (Essential):** Must provide principled ways to assess the force of directives when the patient's values/identity are unstable or have shifted. *Cost of Dropping:* Arbitrary handling of *Phase-Cycling, Velocity Problem, Proleptic Directive*; ignores psychological reality.
      *   *Source:* Cases listed; constraint of poor forecasting/gradual change.

  6.  **D6: Temporal Authority Mechanism (Essential):** Must specify *how* an earlier self can bind a later one (or a surrogate), including the permissibility of *Ulysses Clauses/Mirrors* and *Ratchet* effects. *Cost of Dropping:* No guidance on the core temporal binding question.
      *   *Source:* *Ulysses/Mirror, Ratchet Directive*.

  7.  **D7: Epistemic Humility & Feasibility (Operational Constraint):** Must not require knowledge that is systematically unavailable (exact current experience, exact counterfactual past wishes) and must be applicable by clinicians/ethics committees in real-time. *Cost of Dropping:* Theory becomes practically useless or demands unrealistic investigations.
      *   *Source:* Epistemic constraints; implementation reality.

  8.  **D8: Resistance to Temporary Distortions (Plausible Requirement):** Should provide grounds to discount or override instructions issued under conditions likely to distort judgment (severe depression, untreated pain, delirium), even if technically competent *at that moment*. *Cost of Dropping:* Honors directives born of transient pathology. *Cost of Including:* Requires difficult judgments about distortion thresholds.
      *   *Source:* Constraint about distorted preferences.

  9.  **D9: Distinction: Actual Instruction vs. Hypothetical Wish (Essential):** Must clarify whether authority stems from the *actual text/choice made* or from what the earlier self *would have wanted* in the *actual unforeseen situation*. *Cost of Collapsing:* Masks the core controversy; leads to inconsistent application.
      *   *Source:* Requested distinction; most cases involve unforeseen circumstances.

  **Step 3: Deliverables on Desiderata**

  *   **Non-Negotiable vs. Camp Preference:**
      *   *Non-Negotiable:* D1 (Deep Autonomy), D2 (Suffering Protection), D4 (Binding vs. Evidence), D7 (Epistemic Feasibility). These are foundational to the concept and practice.
      *   *Camp Preferences/Plausible Requirements:*
          *   D3 (Scope Limit to Precedent Autonomy): Preference for a "clean" precedent autonomy theory. Others might argue for extending its logic analogically.
          *   D8 (Resisting Distortions): Reflects a "values authenticity" camp vs. a strict "choice at time T" camp.
          *   *Determinate Answer in Every Case:* Confirmed as a preference of clinical practice, **not** a strict desideratum. A good theory should clarify *why* some cases are genuinely indeterminate (e.g., profound value conflicts with insufficient evidence).

  *   **Suspected Jointly Unsatisfiable Pairs:**
      *   **D1 (Deep Autonomy) + D2 (Suffering Protection) + D7 (Feasibility):** This trio creates the core tension. D1 demands honoring directives even if current state seems okay (Dementia Paradox). D2 demands overriding directives causing verifiable suffering. D7 says we often *can't know* the current subjective state (Epistemic Gap) or the exact counterfactual (D9). **We cannot always simultaneously respect the directive, prevent suffering we might not detect, and do it feasibly.** The theory *must* establish thresholds/rules for when D2 overrides D1, knowing D7 limits certainty.
      *   **D5 (Handling Instability) + D7 (Feasibility):** Principled handling of value instability (Phase-Cycling, Velocity) requires nuanced psychological assessment often impossible under D7 constraints. Feasibility may demand simpler, perhaps imperfect, heuristics (e.g., prioritizing most recent competent directive absent clear evidence of distortion).

  *   **Most Excluding Requirement:**
      *   **D2 (Protection from Profound Suffering).** This requirement alone excludes:
          *   **Absolute Precedent Autonomy Views (Pure Dworkin):** If honoring the directive (e.g., "no food/water if demented") clearly causes *verifiable, severe suffering* in a currently resistant patient, D2 demands override. Pure precedent autonomy cannot accommodate this without modification.
          *   **Strong Parfitian Views (if applied simplistically):** If identity is reduced to negligible psychological connectedness, the "earlier self" lacks authority, potentially giving the surrogate *carte blanche* based on current interests, which might ignore D1 entirely. D2 provides a *specific, limited* ground for override that doesn't dissolve all precedent authority.

  **Step 4: Scoring Major Views Against Desiderata**

  *   **Dworkin's Integrity View (Critical Interests):**
      *   **Strengths:** Excels at D1 (Deep Autonomy), handles *Ordinary Dementia* by prioritizing past critical interests over present experiential ones. Provides basis for D6 (Ulysses clauses as protecting integrity). Strong on D4 (Binding authority based on critical interests).
      *   **Weaknesses:** Struggles with D2 (Suffering Protection) - how severe must suffering be to override integrity? Weak on D5 (Value Instability) - what if critical interests change radically (*Proleptic, Phase-Cycling*)? D3 (Scope) is explicit limit. D7 (Feasibility) - determining "critical interests" is complex. **Fails on joint satisfiability of D1/D2/D7:** Prioritizes D1, risking D2 violations when suffering is evident but integrity is invoked.

  *   **Current-Interests / Best-Interests View:**
      *   **Strengths:** Strong on D2 (Suffering Protection), D7 (Feasibility - focuses on observable present state). Handles *Never-Competent* via D3 implicitly.
      *   **Weaknesses:** Fails D1 (Deep Autonomy) fundamentally - directives are only evidence (violates D4), not binding authority. Ignores D6 (Temporal Authority). Weak on D5 (Value Instability) - only current state matters. **Excluded by D1/D4:** Does not respect the authority of the earlier self as required.

  *   **Value-Endorsement / Narrative / Extended Self Views:**
      *   **Strengths:** Potentially strong on D1 & D5 - authority stems from endorsement by a coherent narrative self or current alignment with deep values. Can handle *Proleptic Directive* (endorsing future change) and *Phase-Cycling* (which phase aligns with "true" self/narrative?). Can ground D6.
      *   **Weaknesses:** D7 (Feasibility) - Determining "true self," "narrative coherence," or "current endorsement" of past values is highly subjective and complex bedside. Risks collapsing D4 (Is directive binding or just evidence of narrative/values?). Vulnerable to D8 challenges (distortions). **Struggles with joint D5/D7:** Nuance vs. operational simplicity. **Struggles with D1/D2/D7:** If current self (even demented) "dis-endorses" the directive, does that override it? How to verify?

  *   **Parfitian Reductionism (Psychological Connectedness):**
      *   **Strengths:** Provides a framework for D5 (Identity Change/Gradualness) - authority diminishes with reduced connectedness. Informs D6 (bindingness depends on connection strength). Acknowledges D3 (Scope - no precedent self).
      *   **Weaknesses:** Risks radically undermining D1 - if connection is weak (e.g., late dementia), precedent authority vanishes, collapsing into best interests (failing D4). D7 (Feasibility) - Quantifying connectedness is impossible bedside. **Excluded by D1/D4 if it dissolves binding authority entirely.** Only compatible if it provides a *threshold* for authority based on connection, but setting that threshold is contentious and operationally difficult (D7).

  **Conclusion for Policy:** An adequate policy must:
  1.  Start with a **presumption of binding authority** (D1, D4) for clear, competent directives reflecting deep values.
  2.  Explicitly define a **high threshold for override**, grounded primarily in **D2 (verifiable, profound, current suffering)** that cannot be mitigated without violating the directive's core intent.
  3.  Acknowledge the **epistemic limits (D7)** and provide clear, feasible criteria for assessing current suffering and the directive's applicability.
  4.  Address **value instability (D5)** by specifying rules (e.g., prioritize most recent competent directive; define conditions for discounting directives written under likely distortion - D8).
  5.  Explicitly handle **Ulysses/Ratchet clauses (D6)** (e.g., Ulysses clauses are generally binding but subject to the D2 override).
  6.  Have a **separate framework** for the *Never-Competent (D3)* based on substituted judgment/best interests.
  7.  Accept that **indeterminacy exists** at the D1/D2/D7 nexus and provide a clear procedural path (e.g., ethics consult, court) for unresolved conflicts, rather than pretending perfect determinacy.

  The central tension (D1/D2/D7) cannot be fully resolved theoretically; policy must establish a *practically workable and ethically defensible* balance, leaning towards precedent autonomy but recognizing a vital welfare safeguard.
