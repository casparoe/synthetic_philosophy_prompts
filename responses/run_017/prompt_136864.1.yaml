answer: |-
  Here's a "Which Definition of Life Are You Smuggling In?" quiz designed for your seminar. It uses concrete cases to reveal implicit criteria, avoids jargon, and maps answers to philosophical positions. The quiz has 10 questions, a scoring key, and a handout blurb. Cases are drawn from your list and force distinctions about metabolism, evolution, individuality, and binarity without directly asking "is this alive?"

  ---

  ### **Handout Blurb (paste at top)**  
  **What Makes Something "Alive"? Unpack Your Assumptions!**  
  We use the word "life" as if it’s obvious—until we debate viruses, digital organisms, or dormant seeds. This quiz isn’t about right answers; it’s about uncovering your implicit definition of life. Based on your judgments about concrete cases, we’ll map you to one of 7 philosophical "leaves" (positions) in the logical space of life definitions. No jargon, no citations—just your intuition vs. the edge cases.  

  ---

  ### **The Quiz**  
  **Instructions:** For each scenario, pick ONE answer that best reflects your view. Don’t overthink it—go with your gut.  

  1. **A 200-year-old seed** (dormant, no metabolism) is discovered. It sprouts when planted. While dormant, was it alive?  
     - A) **Yes** – It retained the *potential* to grow/reproduce.  
     - B) **No** – It wasn’t actively maintaining itself.  
     - C) **It’s fuzzy** – "Alive" isn’t binary; this is a gray zone.  

  2. **A prion** (misfolded protein that forces others to copy its shape) spreads in a brain. Is it alive?  
     - A) **Yes** – It replicates and "inherits" structure.  
     - B) **No** – It doesn’t metabolize or evolve; it’s just chemistry.  
     - C) **Sort of** – It’s a gray area between life and non-life.  

  3. **A lab-engineered RNA system** evolves in a chemostat but collapses if the nutrient pump stops. Is it alive while evolving?  
     - A) **Yes** – It undergoes evolution by natural selection.  
     - B) **Only if the pump runs** – It can’t self-sustain.  
     - C) **No** – It’s a lab trick, not true independence.  

  4. **A fire** spreads through a forest, "metabolizing" wood and "reproducing." Is it alive?  
     - A) **No** – Fire lacks heredity; its "offspring" aren’t variations of a parent.  
     - B) **No** – It has no self-maintaining organization.  
     - C) **Almost** – It’s life-like but not quite there.  

  5. **A biofilm** reproduces as a collective; individual cells die if separated. Is the *whole mat* alive?  
     - A) **Yes** – The mat is the relevant self-sustaining unit.  
     - B) **No** – Only the individual cells are alive.  
     - C) **Both levels** – Life isn’t about picking one scale.  

  6. **A sterile mule** (horse-donkey hybrid) metabolizes and responds to stimuli but can’t reproduce. Is it alive?  
     - A) **Yes** – Metabolism alone suffices.  
     - B) **Yes** – It’s part of a reproducing lineage (horses/donkeys).  
     - C) **No** – Reproduction is essential.  

  7. **Mars microbes** (found in ice) use non-DNA genetics but have metabolism and evolve. Are they alive?  
     - A) **Yes** – Chemistry doesn’t matter if it does the job.  
     - B) **No** – Life must use Earth-like chemistry.  
     - C) **Irrelevant** – "Alive" is a label we assign for convenience.  

  8. **Self-replicating machines** on a dead planet evolve by selection but were designed by extinct aliens. Are they alive?  
     - A) **Yes** – Evolution matters, not origin.  
     - B) **No** – They lack metabolism/organization.  
     - C) **It depends** – Context determines if we call them "alive."  

  9. **A digital ecosystem** evolves in an abandoned simulation (no one maintains it). Are these entities alive?  
     - A) **Yes** – They evolve independently.  
     - B) **No** – They’re abstract patterns, not physical.  
     - C) **Usefully "alive"** – For studying evolution, yes; otherwise, no.  

  10. **The HeLa cell lineage** (eternal human cells) outlived Henrietta Lacks and evolves in labs. Is this *lineage* alive?  
      - A) **Yes** – It’s an evolving population.  
      - B) **No** – Only individual cells are alive.  
      - C) **It’s semantic** – "Life" applies to organisms, not lineages.  

  ---

  ### **Scoring Key**  
  Tally your answers. Each letter corresponds to a principle:  
  - **A** = Prioritizes evolution/reproduction  
  - **B** = Prioritizes metabolism/self-maintenance  
  - **C** = Rejects binarity or emphasizes context  

  **Map your majority answer (e.g., 6+ A’s) to a leaf:**  
  - **Mostly A’s → Replicator-first/Informational view**  
    *Life requires heredity and evolution by selection. Units must be discrete.*  
    **Awkward commitment:** Prions (Q2) *might* be borderline alive; fire (Q4) is not.  
  - **Mostly B’s → Self-maintaining organization/Autopoiesis view**  
    *Life requires metabolism and bounded self-organization (e.g., a cell).*  
    **Awkward commitment:** Dormant seeds (Q1) or digital life (Q9) aren’t alive.  
  - **Mostly C’s → Deflationary cluster concept**  
    *"Alive" is a useful fiction for systems with some life-like properties. No strict thresholds.*  
    **Awkward commitment:** Everything (fire, prions, digital life) could be "alive enough" in context.  

  **If mixed A/B (or tied), use this secondary map:**  
  - **A’s in Q3, Q6, Q8 + B’s in Q1, Q4 → Astrobiology definition**  
    *Life is a self-sustaining chemical system able to undergo Darwinian evolution.*  
    **Awkward commitment:** The mule (Q6) is alive, but its sterility challenges "evolution."  
  - **B’s in Q2, Q5, Q10 + C’s in Q1, Q7 → Metabolism-first/Gradualist view**  
    *Life emerges gradually from proto-metabolic systems. No hard line between life/non-life.*  
    **Awkward commitment:** Fire (Q4) is "almost" alive; distinctions are fuzzy.  
  - **A’s in Q8, Q9 + B’s in Q5, Q7 → Darwinian individuality view**  
    *Life requires discrete units of selection capable of evolution.*  
    **Awkward commitment:** Biofilms (Q5) are alive *only* if collectives are units.  
  - **A’s in Q4, Q9 + B’s in Q3, Q6 → Chemoton-style view**  
    *Life requires 3 subsystems: metabolism, membrane (boundary), and information.*  
    **Awkward commitment:** The RNA system (Q3) isn’t alive without a membrane.  

  ---

  ### **Notes on Logical Space**  
  - **Unoccupied combinations**:  
    - *Requires evolution but rejects discrete units* → Incoherent (evolution needs units of selection).  
    - *Requires metabolism but rejects gradualism* → Unattractive (ignores origins of life).  
  - **Indistinguishable leaves**:  
    - The **Deflationary** (all C’s) and **Gradualist** (mixed B/C) leaves overlap. Q5 (biofilm) *might* separate them: Gradualists pick A/B (prioritizing metabolism), Deflationists pick C. If not, merge them as "Threshold/Cluster" views.  
  - **Why no "binary + no metabolism" view?** → Rare; rejecting metabolism while insisting on binarity leads to inconsistent judgments (e.g., calling fire "alive" but not dormant seeds).  

  This quiz isolates commitments using cases without naming theories upfront. The scoring uses majority answers for simplicity, with tiebreakers for mixed profiles. The "awkward commitments" show each leaf’s counterintuitive edge—perfect for discussion. Let me know if you’d like the answer key formatted as a separate decoder sheet!
