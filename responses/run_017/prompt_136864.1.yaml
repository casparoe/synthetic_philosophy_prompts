          5: c (not self-maintaining without flow)
          6: a or b? -> a (self-maintaining and bounded) but wait, the microbe is bounded? Yes, so a.
          7: c (machines are not chemical? But autopoiesis is typically for chemical systems) -> c, or if we allow non-chemical, then a? But usually autopoiesis is for cells. So c.
          8: c (not material)
