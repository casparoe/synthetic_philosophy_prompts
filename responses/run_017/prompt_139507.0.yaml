  The user provided several examples to base requirements on: the eclipse vs. sea battle difference, how disjunctions work, retrospective truth, the demon predictor, graded settledness like dice probabilities, the snatched coin scenario, and the dread asymmetry between future and past events. They want a requirements list with cases, marking which are essential and which might conflict.

  First, I need to extract requirements from each case. For the eclipse vs. sea battle, the key is explaining why some future events feel settled (eclipse) while others don't (sea battle). This points to a requirement for distinguishing degrees of determinism. The disjunction problem requires explaining why "P or not P" is always true even if neither part has a truth value yet. Retrospective truth deals with whether we can say something was true before it happened. The demon example tests if truth depends on knowledge or prediction. Graded settledness asks if uncertainty is on/off or probabilistic. The snatched coin questions what happens when a future event becomes impossible. The dread asymmetry highlights the emotional difference between future and past unknowns.

  Non-negotiable requirements would be those necessary for any coherent theory. For example, explaining disjunctions is crucial because logic requires it, and handling retrospective truth seems fundamental to how we talk about time. Conflicts might arise between the demon predictor and the no-truth-value view - if a demon's prediction makes something true, that clashes with it not being settled before.

  I'll organize this into a table: Requirement, Case, Non-negotiable?, and Conflicts. Then assess each of the three theories against these requirements. The bivalent determinism view (everything is true or false now) handles disjunctions and retrospective truth easily but struggles with deliberation and graded settledness. The no current truth value view avoids fatalism but has trouble with disjunctions and retrospective truth. The branching futures view accommodates deliberation and probabilities but may have issues with retrospection and the demon. 

  I need to be concise, use British English, and focus on why each requirement matters based on the user's cases. Highlighting conflicts like between bivalence and deliberation will show why the debate persists. The user's deeper needs include understanding free will, the nature of time, and emotional responses to uncertainty, so the requirements should address these implicitly.
answer: |-
  Here's a requirements list distilled from your cases, explaining *why* each feature matters and what it needs to deliver, followed by a brief assessment of the three views against the core requirements.

  ### Requirements for an Account of Future-Tensed Statements (The "Spec")

  1.  **Distinguish Settled vs. Contingent Futures:** *Must explain the intuitive difference between events like the 2099 eclipse (feels settled) and tomorrow's sea battle or job offer (feels open).* **Why?** To account for why deliberation feels meaningful for some things (the battle, the job) but pointless for others (the eclipse). It underpins the point of choice, effort, and anxiety about genuinely open possibilities. *(Non-negotiable for relevance to deliberation/dread).*
  2.  **Ground Disjunction:** *Must explain how "P or not-P" (e.g., battle or no battle) can be true *now* without both "P" and "not-P" needing to have a definite truth value now.* **Why?** Basic logic demands the Law of Excluded Middle holds for future contingents; we *know* the disjunction is true. A theory can't avoid this by making logic itself contingent. *(Strongly Non-negotiable - core logical coherence).*
  3.  **Handle Retrospective Truth:** *Must accommodate or coherently explain away the strong intuition that after the battle happens, it *was* true yesterday that it would happen.* **Why?** Reflects how we naturally talk about the past, history, and causation. A theory that simply denies this feels deeply counterintuitive after the fact. *(Non-negotiable for coherence with lived experience).*
  4.  **Account for Prediction & Knowledge:** *Must explain the status of statements like the demon's prediction.* **Why?** To clarify if truth depends *only* on the event occurring later (retrospective), or if certain kinds of present facts (like a perfect predictor existing) *constitute* present truth. Avoids making truth subjective or dependent on observers. *(Non-negotiable to avoid weirdness like "truth depends on who's watching").*
  5.  **Accommodate Probabilistic Reasoning:** *Must explain what statements about probabilities (e.g., 95% chance of six) are tracking, beyond mere ignorance.* **Why?** To ground rational decision-making under uncertainty (e.g., betting on the die) and distinguish genuine randomness/chance from mere lack of information. If settledness is on/off, what does "50%" mean? *(Non-negotiable for practical reasoning).*
  6.  **Address Cancelled Futures:** *Must explain the status of statements like "the coin will land heads" when the coin is destroyed mid-air.* **Why?** Tests whether truth requires the *possibility* of the event happening, or only its actual occurrence. Reveals if the theory relies on potential futures or only the actual timeline. *(Important for understanding potentiality).*
  7.  **Explain Temporal Asymmetry of Dread:** *Must help explain (or explain why it can't explain) why we dread future uncertain bad outcomes but not past unknown ones (like the unopened test).* **Why?** This asymmetry is central to human agency, emotion, and the experience of time. A theory of future contingency *should* illuminate this fundamental difference between future and past unknowns. *(Core motivation for many - relates to requirements 1 & 5).*

  ### Key Conflicts (Where satisfying one requirement might strain another)

  1.  **Disjunction (2) vs. No Current Truth Value:** If neither P nor not-P has a truth value *now*, how can "P or not-P" be true *now*? This is the hardest nut for the "no truth value" view to crack.
  2.  **Retrospective Truth (3) vs. No Current Truth Value:** If it wasn't true yesterday that the battle would happen, how can we truthfully say *today* "It *was* true yesterday"? This feels contradictory.
  3.  **Settledness (1) & Prediction (4) vs. Pure Bivalence:** If the demon's infallible prediction *now* entails the battle *must* happen, does this eliminate the contingency (making it settled like the eclipse) and undermine deliberation? This challenges pure bivalence if it wants to preserve genuine openness.

  ### How the Three Views Fare Against Core Requirements

  1.  **Bivalent Determinism (Everything already T/F):**
      *   **Pros:** Nails Disjunction (2) and Retrospective Truth (3) easily. Handles Prediction (4) by saying the demon *discovers* what was always true. Eclipse (1) is unproblematic.
      *   **Cons:** Fails Settled vs. Contingent (1) - everything is equally settled *now*, making deliberation pointless (violates your core need). Struggles with Probabilities (5) - 95% just reflects ignorance of the settled outcome. Cancelled Futures (6) are messy (was it T/F when destroyed?). Dread Asymmetry (7) becomes irrational if the bad outcome was already fixed.
      *   **Verdict:** Strong on logic/retrospection, fails on agency/deliberation/probability.

  2.  **No Current Truth Value (Contingent futures lack truth value):**
      *   **Pros:** Explains Settled vs. Contingent (1) - eclipses have truthmakers now, battles don't. Preserves genuine openness for deliberation. Handles Cancelled Futures (6) - the question becomes void. Explains Dread Asymmetry (7) - future genuinely open, past fixed.
      *   **Cons:** **Massive problem** with Disjunction (2) - how can "P or not-P" be true if neither disjunct is? Struggles with Retrospective Truth (3) - saying "it *was* true" later contradicts the earlier lack of truth value. Prediction (4) is problematic (demon doesn't state a truth, just a reliable forecast?). Probabilities (5) become purely epistemic (just degrees of belief).
      *   **Verdict:** Strong on openness/agency, catastrophically weak on logic/retrospection.

  3.  **Branching Futures (Multiple possibilities are real until one "actualizes"):**
      *   **Pros:** Explains Settled vs. Contingent (1) - eclipses lie on all branches, battles don't. Grounds Probabilities (5) - 95% chance means 95% of branches have a six. Explains Dread Asymmetry (7) - multiple dreadful futures possible vs. only one fixed past. Handles Cancelled Futures (6) - the "heads" branch is pruned/disconnected.
      *   **Cons:** **Major challenge** with Disjunction (2) & Retrospective Truth (3) - if multiple futures were real, was it *true* on Tuesday that *this specific* battle would happen, or just that *a* battle on *some* branch would? Prediction (4) is tricky - does the demon see the actual branch, or just *a* branch? The ontology (multiple real futures) feels metaphysically extravagant.
      *   **Verdict:** Best at handling openness, probabilities, and dread. Struggles with the "thinness" of truth *in the actual past* and can feel ontologically costly. Logic (2, 3) is complex but possible with careful semantics (like supervaluation).

  **Supervaluationism** (briefly, as you mentioned it) is often used *with* Branching or No Truth Value. It says a statement is **supertrue** if true on *all* branches/futures (like the eclipse), **superfalse** if false on all, and **neither** if true on some/false on others (battle). This neatly solves Disjunction (2) - "P or not-P" is supertrue *even if* P is neither supertrue nor superfalse. It helps with Retrospection (3) - once a branch is actualised, statements true on *that* branch were "vaguely true" before. It fits well with Branching, less so with pure No Truth Value.
