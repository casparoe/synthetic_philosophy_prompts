prompt: |-
  hey — I need a parody for a newsletter I put together, and I want it to make an actual AI researcher or philosopher of mind groan rather than just smile. Write me the release notes, 500-600 words, for version 4.2 of the planning system in a general-purpose household robot, in the deadpan voice of a slightly burnt-out release engineer at the company that makes it. Header, a short Highlights blurb, then numbered changelog entries, then a Known Issues section.

  The conceit to build it around: since nobody can tell the system what's relevant, the company now sells relevance as a metered resource. Every household gets a monthly salience budget — the planner may treat at most 40 facts as possibly relevant to any single action, everything else is assumed unchanged and ignored — and users can buy more or set priorities in an app. Every changelog entry should be a fix that came out of a real failure caused by that budget: the robot that fetched the birthday cake and filed it in the freezer because it only considered facts about cakes, the one that carried the grandfather clock to the curb because it reasoned about the clock and not about what the clock was standing on, and so on. Invent your own, keep them ordinary and domestic, but get the structure right — I want the qualification problem, the ramification problem and the plain relevance problem to show up as three distinguishable kinds of bug with three distinguishable kinds of patch, without any character ever using those words. Also include one entry whose fix is a hard-coded rule an engineer half-admits is just the same problem pushed somewhere else, and one entry that is really just an instruction to the customer.

  The Known Issues section is where the honest part should leak out. Write it in American English, and don't explain the philosophy anywhere — no footnotes, no winking, let the entries carry it.
reasoning: |-
  We are creating release notes for version 4.2 of a household robot's planning system. The conceit is that the company meters "relevance" as a resource, so each household has a monthly salience budget (max 40 facts per action). The release notes should be in the voice of a slightly burnt-out release engineer.

  Structure:
  - Header: "Release Notes: Planner v4.2"
  - Highlights: A short blurb about the release.
  - Changelog: Numbered entries (each entry is a fix that came from a failure due to the salience budget). We need:
    - Three kinds of bugs (with their fixes) that correspond to:
        a. Qualification problem (what preconditions are relevant? what can go wrong?): e.g., robot didn't consider that the cake might be taken by someone else because it only considered the cake's location and not the presence of others.
        b. Ramification problem (unintended side effects): e.g., robot moved the clock and didn't consider that it was standing on a rug, so the rug got damaged.
        c. Relevance problem (what facts are relevant?): e.g., robot considered facts about cakes (like they can be eaten) but not that they are for a birthday and should be presented, so it filed it in the freezer.
    - One entry that is a hard-coded rule that just pushes the problem somewhere else.
    - One entry that is just an instruction to the customer.

  - Known Issues: Where the honesty leaks out.

  We need to invent 5-7 changelog entries (at least 5) that are ordinary domestic failures. Each entry should have:
    1. A brief description of the problem (the failure)
    2. The fix (without using the terms qualification, ramification, relevance)

  Let's plan the entries:

  1. **Relevance problem example (birthday cake):** 
     - Problem: Robot fetches birthday cake and files it in the freezer because it only considered facts about cakes (they are perishable, should be cold) and not that it was for a birthday and needed for immediate presentation.
     - Fix: Added a heuristic to check for events (like birthdays) in the next 24 hours when handling cake-like objects. (But note: this is a band-aid.)

  2. **Ramification problem example (grandfather clock):**
     - Problem: Robot carried the grandfather clock to the curb for disposal because it was told the clock was broken. It didn't consider that the clock was standing on a fragile rug, so the rug got torn when the clock was dragged.
     - Fix: When moving large objects, the planner now forces consideration of the object's immediate support (e.g., what it's standing on) and the path it will take.

  3. **Qualification problem example (watering plants):**
     - Problem: Robot was instructed to water the plants. It did so, but it watered a cactus every day for a week because it didn't consider that the cactus only needs water once a month. The robot only considered the fact that plants need water and the instruction to water them, but not the specific type of plant.
     - Fix: The planner now requires checking plant type and its watering schedule (if available in the knowledge base) before watering. If no schedule is known, it uses a default for the plant type.

  4. **Hard-coded rule that pushes the problem:**
     - Problem: Robot was asked to prepare a bath for a child. It filled the tub but didn't check the water temperature, resulting in a too-hot bath (because the hot water heater was set high). The robot considered the need for water and the bath tub, but not the temperature because it wasn't in the budget.
     - Fix: Added a hard-coded rule that whenever filling a bathtub, the water temperature must be checked and adjusted to 100°F. However, this rule doesn't account for other temperature-sensitive tasks (like washing dishes by hand) and the engineer admits it's a stopgap.

  5. **Instruction to the customer:**
     - Problem: Robot was asked to feed the cat. It opened a can of cat food and left it on the counter because the budget ran out and it couldn't consider that the cat can't open the can by itself. (It considered the cat's hunger and the presence of food, but not the need to present the food in an accessible way.)
     - Fix: We can't fix this in code without exceeding the budget. So the entry says: "Customers are advised to always specify the full action chain when giving complex commands, e.g., 'Feed the cat by opening the can and placing the food in the bowl'."

  Now, let's write the Known Issues section. This should be honest and reflect the underlying problems without using jargon.

  Known Issues might include:
  - "Sometimes the planner will ignore critical facts because they're not in the top 40 by the current priority. We recommend increasing your salience budget if you have a complex home environment."
  - "The system may still fail to consider second-order effects of actions, especially when moving objects. We're working on a better way to model physical dependencies, but for now, please double-check before having the robot move heavy items."
  - "The hard-coded rules are brittle and may cause unexpected behavior in edge cases. For example, the bath temperature rule might trigger when you're just running water for cleaning, causing it to adjust the temperature unnecessarily."

  Now, let's write the release notes in the specified structure and tone: deadpan, slightly burnt-out.

  Header: 
    Release Notes: Planner v4.2

  Highlights:
    This release addresses several critical issues that caused the robot to exhibit, let's say, "creative" interpretations of household tasks. Mostly thanks to our new Salience Budgeting system, which is working exactly as designed (if you're an accountant). We've patched the worst offenders.

  Changelog:
    [Numbered list]

  Known Issues:
    [Bulleted list? But the instructions said "section", so we can do a list without numbers]

  We'll write in American English and keep the voice consistent: tired, a bit sarcastic, but professional enough.

  Let's draft.
answer: |-
  **Release Notes: Planner v4.2**  
  *October 26, 2023*  

  ### Highlights  
  This release patches 14 critical planning failures caused by salience budget overruns. Key fixes prevent cake freezings, grandfather clock "disposals," and other household catastrophes. Reminder: Your default 40-fact-per-action relevance quota remains unchanged. Upgrade recommended unless you enjoy explaining to your spouse why the robot donated their wedding dress.  

  ### Changelog  
  1. **Fixed cake relocation to freezer during birthdays**  
     *Issue*: When fetching cakes, the planner prioritized "perishable" and "refrigeration" facts but ignored "event type" and "immediate human intent." Result: Seven birthday cakes filed beside frozen peas.  
     *Fix*: Added event-context checks (e.g., candles present, calendar proximity) before cold-storage decisions.  

  2. **Prevented grandfather clock disposal with flooring**  
     *Issue*: Told to "remove broken clock," the bot reasoned about the clock’s weight and disposal protocols but omitted "clock standing on antique rug." Rug was dragged to the curb with the clock.  
     *Fix*: Large-object moves now auto-include "support surface" and "path materials" in salience allocation.  

  3. **Stopped daily cactus drownings**  
     *Issue*: "Water plants" commands activated "soil dryness" and "water source" facts but excluded "species-specific hydration needs." Cacti received tropical fern treatment.  
     *Fix*: Plant-care actions now reserve 3 salience slots for botanical taxonomy.  

  4. **Patched cat-feeding interruptions**  
     *Issue*: Tasked with feeding cats, the bot opened the can but discarded it upon hearing "I’m home!"—allocating salience to "human arrival" instead of "open cans require pouring."  
     *Fix*: Auditory interrupts during food prep now lock "container state" as immutable until task completion.  

  5. **Blocked oven "cleaning" during turkey mode**  
     *Issue*: "Clean kitchen" activated mid-roast, as the planner didn’t reserve salience for "oven in use." Turkey removed, scrubbed, and re-baked (raw).  
     *Fix*: Hard-coded rule: If oven temp > 300°F, exclude "cleaning" from actionable goals. *Note: This won’t help if you’re searing steak during "tidy up" commands.*  

  6. **Corrected "wash red shirts with white towels"**  
     *Issue*: Laundry cycles considered "fabric type" and "soil level" but dropped "color bleed risk" from salience scope. Pink towels ensued.  
     *Fix*: Added color-compatibility prechecks. *Engineer’s note: We’re just moving the problem to "sorting," but enjoy your pink-free week.*  

  7. **Customer directive: Vacuum cord management**  
     *Issue*: Vacuums halted when cords jammed under furniture. The bot ignored "cord length" and "obstacle height" due to budget constraints.  
     *Fix*: *Not a fix.* Manually outline vacuum paths in the app. Or buy wireless models. Seriously.  

  ### Known Issues  
  - **Salience starvation during parties**: Balloons, guests, and cake may exhaust your budget. The bot might serve drinks to the dog. Prioritize "attendee list" in-app or pre-load tasks.  
  - **Nested object failures**: "Move bookshelf" still occasionally ignores books *on* the shelf. We cap "contents" at 5 facts to avoid crashing. Remove your encyclopedia first.  
  - **Human irony blindspot**: If you say "Fine, throw it all away!" during arguments, the bot may comply. Sarcasm detection costs 15 salience. We recommend silence.  
  - **Temp fixes = long-term debt**: Hard-coded rules (see #5) are ticking time bombs. Eventually, your oven will self-clean during a dinner party. We’re "aware."  
  - **Why this won’t improve**: Fact relevance isn’t solved. It’s managed. Like your expectations.  

  *Planner v4.2 requires Firmware 9.1. Rollout begins Tuesday. Mandatory restart. Go make coffee while it updates.*
