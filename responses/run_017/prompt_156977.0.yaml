prompt: |-
  My flatmate has extremely firm views about individual contributions to collective harms, and I've been trying to work out what rule she's actually running, because I think her own view is about to back her into something she'll hate.

  Her verdicts so far, best I can reconstruct them:

  - Giving 10% of her income to effective charities: obviously required, one of the best things a person can do, no debate.
  - Buying factory-farmed chicken: wrong, and she won't do it even after I pointed out that supermarkets reorder in batches, so her single pack is almost certainly inside the margin and changes nothing at the farm. Her line was that she's still the one handing over money for the cage.
  - Eating meat somebody else already bought and cooked, i.e. leftover barbecue: totally fine, "the harm's done and me not eating it helps nobody."
  - Flying long-haul for a holiday: fine, she does it, she doesn't offset, and she says one passenger is a rounding error against total aviation emissions. She'll admit its not great, in the way you'd admit anything is not great.
  - Buying a fast-fashion hoodie sewn in a factory with genuinely awful conditions: fine, and she thinks boycotts tend to leave the workers worse off.
  - Voting in a general election from a safe seat her party always wins: she votes, calls it a duty, and has genuinely done the calculation where you multiply a tiny chance of being pivotal by large stakes.
  - Signing petitions, sharing infographics: theatre, waste of time.

  I can't tell whether she's running (a) a strict expected-difference rule — what would have happened if I hadn't done it, with the threshold cases handled by multiplying the chance of being the tipping purchase by the size of the batch, which supposedly lands you near your per-person share anyway — or (b) some kind of membership/complicity rule where what matters is that you're paying into a practice that's wrong regardless of whether you tipped anything. Her leftovers verdict and her hoodie verdict make me think (b) has to be narrowed to cases where money crosses hands, but the flying verdict pushes the other way: under (a) the flight looks at least as bad as the chicken, since the extra fuel really is causally downstream of her seat in a way the bird only is via some threshold story, so a consistent (a)-person should be more bothered by the flight than by the pack of chicken, and she isn't. Or maybe she's just inconsistent and I should drop it.

  Here's the case I actually care about. She and her partner are talking about having a kid, and I pointed out that a child in a rich country sits upstream of an enormous amount of emissions — tens of tonnes a year for decades — and that unlike the flight or the chicken, essentially none of it is inside a margin: there's no batch reordering, no threshold, no "the plane was going anyway." The inefficacy move she leans on everywhere else just doesn't apply here. She shrugged and said the emissions would be her kid's, not hers, and that she isn't causing anything, just starting a person. I can't tell whether that's a real answer or a dodge.

  So: what's your bet on how she'll land once she thinks about it properly? Which rule is she implicitly running, which other rules fit her earlier verdicts just as well, and what would each of them say about the kid? Which single further case would do the most work in telling those rules apart — the provably-pointless purchase, the offsets case, something else? And does it matter, under the rule you think she's on, that she could in principle offset the whole family's emissions or raise the kid somewhere with a much smaller footprint?

  One more thing: please be explicit about where your reasoning is most likely to break, and say what would actually change your verdict — what she'd have to say about some case, or what consideration you're dismissing too quickly, for you to switch to a different rule. I'd rather have the guess with its failure modes attached than a confident story.
reasoning: |-
  Okay, so the user is trying to figure out their flatmate's ethical framework. Let me start by understanding the examples given. The flatmate donates 10% to charity—required and good. But she avoids factory-farmed chicken because she's handing over money, even if her purchase doesn't change anything. Yet, she eats leftovers since the harm's done. Flying is fine because one passenger is a rounding error. Fast fashion is okay because boycotts hurt workers. Voting in a safe seat is a duty due to tiny pivotal chance. Petitions are theater.

  The user is stuck between two possibilities: strict expected utility (a) where impact is based on marginal effect, or a complicity rule (b) focused on direct financial contribution. The leftovers example complicates (b) because she's okay with consuming without paying. Flying is another puzzle—under (a), flying should be worse than chicken, but she's not bothered. 

  Now, the kid question. Having a child leads to massive emissions with no threshold effect. The flatmate says the emissions are the kid's, not hers. The user wants to know which rule she's following and how she'd decide about the kid. Also, what test case could clarify her rule.

  First, I need to map her positions to possible rules. The charity donation fits both rules—it's effective under (a) and a direct contribution under (b). Avoiding chicken: under (a), her purchase might not tip the scale, but she insists on complicity. Under (b), paying for the harm is wrong. Leftovers: no payment, so no complicity, harm done. That aligns with (b). Flying: under (a), her seat might cause extra fuel, but she dismisses it as negligible. That's inconsistent if (a) requires avoiding actions with any marginal harm. But she might be using a threshold where negligible chances are ignored. Fast fashion: she avoids boycotts because they harm workers, which is consequentialist, like (a). Voting: she calculates expected utility, which is pure (a). Petitions: ineffective, so dismissed under (a).

  The inconsistency is in flying vs. chicken. If she applies tipping point logic to chicken (even if negligible) but not to flying, maybe she sees flying as having a truly zero marginal effect? Or perhaps she uses different thresholds. Alternatively, she might have a hybrid rule: payment for direct harm is complicity, but systems like aviation are too big for individual blame.

  For the kid, under (a), creating a new person has no marginal effect on emissions? That doesn't make sense because the kid's existence adds to total emissions. Unless she thinks the system adjusts, but the user says there's no threshold. Her response about emissions belonging to the kid suggests she sees procreation as separate from causing harm—maybe a non-identity problem or agency distinction.

  Test cases: A pointless purchase where the item is bought but immediately destroyed. If she avoids it, complicity rule (paying for harm). If okay, then expected utility (no harm done). Offsets: if she accepts them for flying, then she cares about net impact, aligning with (a). If not, then paying into the system is wrong regardless, which is (b). 

  Her view on offsets could clarify. If she rejects offsets for flights, insisting that paying for the ticket is complicity, that's (b). If she accepts offsets as neutralizing harm, that's (a). For the kid, if she could offset the emissions, would that matter? Under (a), offsetting might make it neutral. Under (b), creating the kid is still complicity in future harms, even if offset.

  Reasoning might break if she has an unstated distinction between active vs. passive roles, or if she inconsistently applies thresholds. Also, her stance on voting (acknowledging tiny chances) vs. flying (ignoring them) might be due to perceived responsibility in different contexts. The safe seat vote has a calculable, albeit tiny, expected value, while aviation's impact is seen as truly zero. But is that accurate? Fuel usage might have thresholds too.

  Another angle: perhaps she distinguishes between consumer actions where her payment directly incentivizes production (chicken, fashion) vs. systemic actions (flying) where individual influence is diluted. But fashion boycotts harming workers is a systemic concern too. Inconsistent?

  Key is her response to offsets. If she's willing to offset flights, that leans (a). If not, (b). For the kid, under (b), creating a new agent who causes harm might still be complicit, but she deflects by saying the emissions are the kid's. That deflection might indicate discomfort with the implication of her own rule, suggesting that for procreation, she's using a different criterion—maybe a right to have kids overriding other concerns.

  So, my bet is she's on a hybrid: complicity for direct purchases, expected utility for systemic actions. The kid falls outside both, so she uses agency transfer. Test case: offsets. If she rejects offsets, it confirms complicity matters. If she accepts, then net impact matters more. Either way, the kid is tricky because offsetting might address net impact, but complicity in creating a harm-doer remains.
answer: |-
  Based on your reconstruction, your flatmate isn't cleanly following *either* a strict expected-difference rule (a) *or* a pure complicity rule (b). Instead, she's running a **hybrid system with a key distinction between "direct transactional harm" and "systemic participation"**, mediated by agency and perceived efficacy. Here's the breakdown:

  ### The Implicit Rule System
  1. **Direct Transactional Harm (Complicity-Focused)**  
     - *Applies to:* Purchases where money directly exchanges hands for a product/service tied to clear, immediate harm (factory chicken, possibly fast fashion if pressed).  
     - *Rule:* "Paying for harm makes me complicit, regardless of marginal impact."  
     - *Why it fits:*  
       - Chicken: She rejects the "batch margin" argument because she's *financially endorsing* the practice.  
       - Leftovers: No money changes hands → no complicity → permissible.  
       - Fast fashion: She *avoids* complicity logic by shifting to consequentialism (boycotts harm workers), but if pressed, she’d likely say *not buying* is neutral/complicit-adjacent, not actively paying.  

  2. **Systemic Participation (Efficacy-Focused)**  
     - *Applies to:* Actions within large-scale systems (aviation, voting, climate impacts of reproduction).  
     - *Rule:* "I am obligated only if my action has non-negligible expected impact *or* fulfills a symbolic/civic duty."  
     - *Why it fits:*  
       - Flying: "Rounding error" → negligible expected impact → permissible.  
       - Voting: Tiny pivotal chance × large stakes = non-negligible *expected* impact + civic duty → obligatory.  
       - Petitions: Near-zero efficacy + no duty → "theatre."  

  3. **Agency Boundaries**  
     - *Applies to:* Delegated or future harms (the child case).  
     - *Rule:* "I am not responsible for harms caused by *other moral agents* I enable, if they have independent agency."  
     - *Why it fits:*  
       - Child’s emissions: "The emissions would be my *kid’s*, not mine" → child is a future agent, so harm is "theirs."  

  ---

  ### How She’ll Land on the Kid Question  
  - **Prediction:** She’ll *not* see having a child as a moral problem under her current framework.  
  - **Reasoning:**  
    - **No direct transaction:** She isn’t paying for emissions *now*; she’s creating an agent who *later* participates in systems.  
    - **No personal complicity:** The child’s future acts (driving, flying, etc.) are *their* choices.  
    - **No immediate efficacy threshold:** Procreation isn’t a "batch purchase" with a margin; it’s a one-off act with diffuse downstream effects.  
    - **Agency override:** "Starting a person" is ethically neutral (or positive) in her framework; shifting emissions to the child defends this.  
  - **Offsetting/relocation:** She’ll likely dismiss it. If the child’s acts are *their* responsibility, offsetting is *their* future duty (or irrelevant). If you argue *she* could offset preemptively, she’d call it supererogatory (nice but not required), like charity—distinct from "complicity avoidance."  

  **Weakness in her position:** Her agency argument collapses if pressed. By creating a high-emission agent in a carbon-intensive society, she *guarantees* harm in a way that flying or buying chicken doesn’t. But she’ll resist this, as it forces a consistency she avoids elsewhere.  

  ---

  ### Key Test Case to Diagnose Her Rule  
  **The Provably Pointless Purchase:**  
  - *Scenario:* "A supermarket runs a promotion: if you buy a specific factory-farmed chicken tonight, they’ll *donate* an identical chicken to a food bank. Your purchase literally adds zero net harm (one extra chicken killed regardless). Is it wrong to buy it?"  
  - *Why it works:*  
    - Under **strict expected-difference (a)**: Permissible (no marginal harm).  
    - Under **complicity rule (b)**: Still wrong (you’re paying for a cruel product).  
    - *Her predicted response:* She’d likely say **it’s wrong**—reinforcing that *paying* = complicity, even with zero efficacy. This isolates her transactional logic.  
  - *If she says "permissible"*: She’s closer to (a) than you thought, and her chicken stance might be inconsistent.  

  **Other useful tests:**  
  1. **Offsetting flights:** "If you *buy carbon offsets* for your holiday flight, is it now obligatory/permissible?"  
     - Complicity rule (b): Still wrong (you funded the harmful system).  
     - Expected difference (a): Permissible (net harm near-zero).  
     - *Her predicted response:* "Fine, I guess" → leans (a) for systemic acts.  
  2. **The "already-doomed" chicken:** "If a chicken *will* be factory-farmed and thrown out unsold unless you buy it, is buying it wrong?"  
     - Expected difference (a): Permissible (you prevent waste).  
     - Complicity rule (b): Still wrong (you’re financially supporting the practice).  
     - *Her predicted response:* "Still wrong" → reinforces complicity.  

  ---

  ### Where My Reasoning Is Most Likely to Break  
  1. **Her treatment of fast fashion vs. chicken:**  
     - If she condemns fast fashion *purchases* strictly (not just boycotts), it strengthens complicity. But she called them "fine," suggesting she *does* use efficacy logic here when consequences are salient (worker harm).  
     - *What would change my verdict:* If she admits she’d *refuse* to buy the hoodie if she knew her specific purchase incentivized more production (e.g., a small brand), she’s more expected-difference. Currently, her stance feels like a post hoc deflection.  
     
  2. **The voting case:**  
     - Her "tiny chance × large stakes" math suggests rigorous expected utility. But if she applies this consistently, *why dismiss flying’s tiny marginal emissions?* Aviation emissions *do* have thresholds (e.g., fuel load adjustments).  
     - *What would change my verdict:* If she concedes flying *is* wrong but not pragmatically avoidable, she’s internally consistent but indulging in moral licensing. Her shrug suggests she doesn’t actually believe it’s meaningfully harmful.  

  3. **The child’s agency dodge:**  
     - I assume she’ll hold the line on "it’s the kid’s emissions." But if she expresses unease or admits offsetting *would* mitigate the issue, it shows her framework is softer than it appears.  
     - *What would change my verdict:* If she agrees that *choosing to create a high-emitter* in a climate crisis is inherently culpable, even if the acts are delegated.  

  ---

  ### Conclusion  
  **Your flatmate’s rule:** A **complicity/efficacy hybrid** centered on financial transactions, with *agency delegation* as a trump card for reproduction.  
  **Prediction for the kid:** She won’t budge. Her framework is built to compartmentalize this—assigning future harms to the child protects her from consistency pressure.  
  **Best test:** The "provably pointless purchase" (e.g., chicken that triggers a donation). If she condemns it, complicity dominates; if not, she’s more consequentialist than she lets on.  

  **Should you push?** Only if you want chaos. Her system is functional for her (avoids guilt on flights, absolves reproduction) but fragile under scrutiny. The kid case exposes this—it’s "no threshold + maximal harm," which her framework can’t handle without either consistency or cognitive dissonance. Tread carefully.
