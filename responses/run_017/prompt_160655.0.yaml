  I recall the user mentioned Russellian monism as a possible fallback, so I'll lean into that: physics describes structure, but qualia are the intrinsic nature. When Mary flips the switch, she's directly accessing what red *is*, not just how it functions. 

  Important to stay conversational and avoid lecturing. Should challenge them directly: "Is the switch really giving her the same thing?" Because if the scientists only mapped the neural correlates from outside, they might have missed the essence. 

  Also need to block the "abilities vs facts" dodge—insist that gaining this acquaintance *is* learning a new fact about reality, just not a propositional one. The physical description still doesn't entail the subjective character. 

  And absolutely must not let them reduce this to "just" instantiating a state. The whole point is that instantiation reveals something beyond the physical-functional story. Maybe throw in the zombie comparison to sharpen the issue: if the switch worked on a zombie Mary, would she say the same thing? Probably not. 

  This is fun. They're a worthy opponent—their switch argument shows they've really grappled with the literature. Time to give them the rigorous pushback they wanted.
answer: |-
  Alright, let's go. First off, clever move with the neural switch – I like the twist. But nah, it doesn't rescue physicalism, and here’s why it actually *strengthens* my point.

  You're right, flipping that switch didn't beam in new information *about the external world*. But that's precisely the issue! It confirmed that the *intrinsic character* of the experience wasn't contained in her exhaustive physical knowledge *at all*. Before the flip, she knew everything physical about *what happens* when someone sees red: the wavelengths, the neural pathways, the computational processes, the functional role. Let's say she even knew that *this specific neural pattern* (N) is the one reliably caused by ripe tomatoes under standard conditions.

  So she flips the switch, goes into state N. And she says, "Oh! *That's* what red is like!" What did she just learn? She learned *what it is like to instantiate N*. She learned the intrinsic nature of the state your physics and neuroscience *only ever described relationally and functionally*. She didn't learn a new *proposition* about tomatoes or wavelengths; she learned the *quale itself*. And crucially, *nothing in her complete physical knowledge base entailed what that intrinsic nature felt like*. She could deduce that state N *occurred* when seeing red, but not the subjective character *of* N.

  You say she gains abilities and a new way of conceiving a fact she already had. Which "fact" did she already have? The fact *that* seeing a ripe tomato causes neural state N? Sure. The fact *that* neural state N plays functional role F in the visual system? Absolutely. But the fact *about the intrinsic phenomenal quality of being in state N*? No way. That's the *new* fact – the fact *about what experiencing N is like*. Before the switch, she knew *everything physical* about N, but she didn't know *this* fact about its intrinsic character. The switch didn't add new physics; it revealed a *non-physical* (or at least, *non-structurally-described-physical*) aspect of the state she was already fully physically informed about.

  The release from the room? Fine, concede it! The *intuition* was always driven by the *having* of the experience, not the causal origin. Your switch proves that. It isolates the core: instantiating the state reveals a property of reality – its subjective, qualitative character – that was *missing* from the complete physical description, even though that description perfectly captured the state's causal relations and functional profile. Physicalism, as the claim that *all facts* are physical facts (facts captured by complete physics), is still sunk. It missed this intrinsic fact about consciousness. Russell had it right: physics gives us structure; experience gives us the intrinsic nature filling that structure. The switch gave Mary the nature. That’s new knowledge.

  So, tell me: When she says "Oh! *That's* what red is like," pointing to the quale, what *precise physical fact* did she know beforehand that entailed *that specific subjective character*? And don't just say "the fact about state N" – explain how knowing *all* the physical facts *about* N (its causes, effects, internal structure, functional role) logically entails the specific subjective feel she discovers. Because if it doesn't entail it, you've got a non-physical fact on your hands. Go.
