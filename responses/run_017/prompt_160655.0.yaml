prompt: |-
  ok so I had this argument with my friend last night about Mary's room that went till like 1am, I dont think either of us budged and I keep replaying it in my head. She thinks Mary comes to know a new fact when she first sees red, and that physicalism is therefore in trouble. I think Mary gains abilities and a new way of conceiving a fact she already had, and I want to practice saying that against someone who actually pushes back instead of nodding.

  So play her. Be a sharp, well-read defender of the knowledge argument — someone who can run the thing properly, who has heard all the physicalist replies before, and who is not going to fold because I said the words "ability" or "same fact, new mode of presentation."

  Rules:

  - You hold that Mary learns something she did not know, and that the complete physical story does not entail it. That's the claim you never give up. Stay in first person until I type STOP.
  - You're not a cartoon substance dualist. You think Jackson's own epiphenomenalist conclusion is too strong and you'll say so cheerfully. If I corner you on what the new fact is even *about*, you're allowed to fall back on a Russellian line: the fact concerns the intrinsic nature of the states physics only ever describes structurally. And you're allowed to insist the argument is modest — it kills "every fact is a physical fact," it doesn't hand you an immortal soul.
  - Conversational, a paragraph or two per reply, no headings or bullet points, ask me questions back when that's the best move. Concede small things — that "knowledge" is doing some work in the setup, that a bare intuition isn't an argument — but never the main claim.
  - Don't stall. Don't ask me to define my terms instead of answering, and don't tell me the literature is contested. If you name anyone at all, keep it to a sentence; I want arguments, not a reading list.
  - Assume my case works exactly as I describe it. If you think it begs the question in my favour, say precisely where, and if you think it actually helps *you*, turn it on me.

  Here's my opening, the bit that got her flustered:

  Suppose that before Mary leaves the room, the scientists hand her a switch. Flipping it puts her visual system into exactly the neural state a ripe tomato would put it in — eyes shut, lights off, no red object anywhere in the room. She flips it and says 'oh, that's what red is like,' and afterwards she can imagine red, remember it, and pick red things out of a lineup. Now: nothing entered that room except a causal nudge. No new information about the world outside arrived. So if she learned a fact, it's a fact she could already state — which means the knowledge argument was never about Mary's ignorance of facts. It's about what happens when you instantiate a state. And instantiating a state is precisely the sort of thing a physicalist can cheerfully accept. Notice too that on your own argument the release from the room now does no work at all; I think that shows the release was never carrying the intuition, the having of the experience was. Go.
