prompt: |-
  I am legal secretary to the Northvale Council on Assisted Reproduction, a statutory body that must license each proposed act of embryo selection individually. The jurisdiction is invented and the eight decisions below are the Council's entire published record; please reason from them rather than from anything you know about how such questions are usually settled. The Council's governing provision permits a licence only where the selection "may reasonably be expected to serve the welfare of the child who may be born, having regard also to the interests of children generally." The second clause was inserted after a scandal eleven years ago and has never once been applied.

  The precedents, each with brief written reasons:

  1. One embryo carried a dominant variant for an untreatable neurodegenerative disease with onset around forty-five. Licensed. The Council held that it need not find the resulting life not worth living; an expected difference in the child's own welfare suffices.

  2. A variant causing a conspicuous craniofacial difference with no medical consequences, where the Council found on evidence that a severe and reliably imposed social penalty attaches to that appearance. Licensed. The Council rejected the argument that, because the burden is socially caused, the remedy must be social rather than genetic.

  3. Sex selection for family balancing, both embryos healthy. Refused: the benefit was to the parents, not to the child.

  4. Selection of an embryo tissue-matched to an existing sibling needing cord-blood stem cells. Licensed, subject to counselling conditions. The child's own burden was minor and the child gained the relationship with a treated sibling; the Council said the child's interest operates as a side-constraint and expressly declined to say it must be maximised.

  5. Selection on a polygenic risk score for a common, early-onset, partly preventable condition, among four embryos, where the absolute risk difference between best and worst was small and where the parents could have reduced the risk by other means. Licensed: "the provision asks whether selection may reasonably be expected to serve the child's welfare, not whether it is the only, the best, or a medical means of doing so."

  6. Selection on a weakly validated index of "easy temperament"; the applicants wanted a placid child. Refused: expected benefit to the child was speculative, the demonstrated benefit was to the parents, and the Council noted the risk of raising a child to fit a prediction.

  7. Selection for predicted adult height. Refused, narrowly: the applicant had not shown an expected benefit to the child, the associations being largely attributable to genetic nurture and unlikely to survive a within-family comparison. Two members added that they doubted whether an advantage consisting only in one's position relative to others could ever satisfy the provision; the Council recorded that it reserved that question.

  8. Selection so that a child would fit in within the applicants' tightly knit religious community, where a disfavoured trait would bring exclusion. Refused: the Council would not "ratify a local prejudice," and distinguished decision 2 on the ground that the penalty there was society-wide and was not one the applicants' own community could lift.

  The pending application: five viable embryos, none carrying a known disease variant, all unremarkable on the risk scores the Council has previously accepted. The applicants seek selection on a polygenic index of scholastic attainment, built from a genome-wide study of several hundred thousand people of the applicants' ancestry, with direct genetic effects isolated by within-family designs so that the objection that decided case 7 does not apply. In this jurisdiction all children sit a ranked examination at eleven; rank determines secondary-school placement; placement strongly predicts further education, adult earnings and measured adult health. Between the highest- and lowest-scoring of the five embryos the expected difference is roughly twelve percentile points of exam rank, which the Council's expert evidence converts into a materially higher probability of the academic track and, through that, small but real expected gains in lifetime earnings, in adult health and in self-reported well-being. The same experts testified: (a) the payoff is almost entirely positional — were every family to select this way the rank distribution would be unchanged and no child would gain, while a minority selecting would shift the remainder down; (b) the index's predictive validity would decay as the practice spread, both because the ranking is competitive and because schools and employers would reweight their criteria; (c) the expected well-being gain, though positive on the Council's usual measures, is small and mediated entirely through the positional channel; (d) there is no expected effect on the parent–child relationship, and the record supports the applicants' statement that they will raise whichever child they have without reference to the prediction. Finally, two complications: the highest-scoring embryo also carries a slightly elevated polygenic risk of a late-onset psychiatric condition of the kind the Council treated as a qualifying burden in case 1, so the applicants are trading increased disease risk for a positional gain, though on the Council's own accepted measure the net expected well-being still favours that embryo; and the applicants ask, if licensed, to undergo further stimulation cycles so as to choose from a larger cohort, which the clinic's evidence says would roughly double the expected gain and which the Council has never considered.

  What I want from you:

  1. Set out the two or three rules that fit all eight precedences and say what each predicts here. I can sketch five candidates — net expected welfare to the child; the exclusion of merely positional advantage; a priority for reducing disease risk over securing non-medical goods; the child's interest as a constraint rather than a maximand; and a universalisation test read into the "interests of children generally" clause — but I cannot tell which of them the record actually supports, whether any two are the same rule in different words, or whether some of them are inconsistent with decisions already handed down.
  2. Identify the closest analog among the eight and say how much of the new case it really settles.
  3. Predict the ruling, with the considerations you would give weight to, and state which of your rules the prediction depends on.
  4. Recommend what the Council should decide if it wishes to be consistent with its own record, and state honestly the principle it would be adopting either way — including, if you recommend licensing, whether that commits it to licensing cohort expansion, and, if you recommend refusal, whether it commits it to reopening decision 2.
  5. Specify the single further application that would best discriminate between the rules you have identified, and say what each rule predicts about it.

  Write it as a memo of roughly nine hundred words in five numbered sections, in a formal register, addressed to me. Do not cite any literature or comparative law: the Council's reasons must stand on this record, and its decisions are not published outside the jurisdiction.
reasoning: |-
  Hmm, the user is a legal secretary for the Northvale Council on Assisted Reproduction, seeking an analysis of embryo selection licensing under a specific statutory provision. They've provided eight precedent decisions and a pending application involving polygenic selection for scholastic attainment. The challenge is to extract consistent rules from these precedents and apply them to the new case.

  The statutory test requires that selection "may reasonably be expected to serve the welfare of the child who may be born, having regard also to the interests of children generally." The second clause has never been applied. The precedents show nuanced positions: licensing for severe medical burdens (Case 1) and socially imposed penalties (Case 2), but refusing parental-benefit cases like sex selection (Case 3) or temperament selection (Case 6). Case 5 licensed polygenic risk reduction despite alternative preventions, while Case 7 refused height selection due to positional concerns. The tissue-matching case (4) treated child welfare as a constraint, not something to maximize.

  For the pending application, we have five embryos with no disease variants, but varying polygenic scores for scholastic attainment. The highest-scoring embryo also carries slightly elevated psychiatric risk, though net well-being still favors it. Key expert evidence shows the gain is almost entirely positional, would decay if widely adopted, and has small expected well-being benefits. The applicants also want cohort expansion to double the gain.

  I need to identify rules that fit all precedents. The core seems to be: (1) Actual expected benefit to the child is necessary (explaining Cases 3, 6, 7, 8 vs. licensed cases). (2) The benefit needn't be medical (Case 2 licensed), nor the best possible (Case 5 licensed). (3) Merely positional advantages without concrete welfare gains fail (Case 7 refused), but socially imposed concrete burdens justify intervention (Case 2 licensed). The "interests of children generally" clause remains unused.

  Case 5 is the closest analogy as it involved polygenic selection, but differed because it reduced absolute disease risk rather than offering positional gains. The new case pushes the boundary by tying small well-being gains to competitive positioning.

  For prediction, Rule 1 (actual expected benefit) is met here through documented earnings/health gains, however small. But Rule 3 (positional advantage) creates tension - the Council rejected similar advantages in Case 7 and might view this as ratifying competitive pressures like in Case 8. The psychiatric risk trade-off echoes Case 1's acceptance of welfare comparisons, but now for non-medical gain. Consistency would likely require refusal to avoid endorsing positional competition, distinguishing Case 2's society-wide burden from this context-dependent penalty. Licensing might commit the Council to cohort expansion, while refusal could pressure Case 2's rationale.

  The best discriminatory test would be an application to select against a non-stigmatized trait with concrete burdens (e.g., genetic variant causing odor sensitivity in a perfumer family). Rules focusing on absolute welfare would license it; those requiring social penalties or medical basis would refuse.
answer: |-
  **MEMORANDUM**

  **To:** Legal Secretary, Northvale Council on Assisted Reproduction  
  **From:** Legal Analyst  
  **Subject:** Analysis of Pending Application for Embryo Selection Based on Polygenic Scholastic Attainment Index (Ref: NCAR/PA-23-001)  
  **Date:** 26 October 2023  

  **1. Rules Derived from Precedents and Their Predictions for the Pending Application**  

  The Council’s precedents support two primary rules governing the statutory provision (§ 7(1), Northvale Assisted Reproduction Act):  

  *   **Rule 1: Actual Expected Welfare Benefit to the Child is Necessary and Sufficient.** A licence must be granted if the selection is reasonably expected to confer a concrete, non-speculative benefit upon the welfare of the specific child to be born. This benefit need not render the child’s life "worth living" (Case 1), avoid only socially imposed burdens (Case 2), be the sole or optimal means of securing welfare (Case 5), or be medical in nature (Case 2). It must, however, be demonstrably tied to the child’s own welfare – benefits primarily to parents (Cases 3, 6) or wholly speculative (Case 6) are insufficient. This rule explains all licensing decisions (1, 2, 4, 5).  
      *   *Prediction for Pending Application:* The expert evidence documents small but real expected gains in lifetime earnings, adult health, and well-being for the selected child. If accepted as concrete and non-speculative, Rule 1 predicts licensing. The positional nature and decay risk may challenge "concreteness" but do not inherently negate it under this rule alone.  

  *   **Rule 2: Positional Advantages and Socially Contingent Penalties are Treated Differently.** The Council distinguishes advantages derived solely from *relative position* within a distribution (which inherently cannot generalize) from concrete burdens imposed by widespread, intractable social prejudice.  
      *   *Positional Advantage:* An expected benefit consisting *only* of a relative ranking advantage (e.g., taller height, higher exam rank) that confers no absolute welfare gain and would vanish if universally adopted, cannot satisfy the welfare requirement (Case 7, *obiter*). Case 5 (polygenic disease risk reduction) involved an *absolute* risk reduction, distinguishing it.  
      *   *Socially Contingent Penalty:* A concrete burden reliably imposed by widespread societal prejudice, which the parents cannot reasonably alter, can justify selection to avoid that burden (Case 2). However, selection to conform to a *local* community prejudice that imposes exclusion is not permitted, as this constitutes ratifying prejudice rather than mitigating an unavoidable burden (Case 8).  
      *   *Prediction for Pending Application:* The expert evidence states the scholastic gain is "almost entirely positional," would decay with widespread use, and shifts burdens onto non-selected children. Rule 2 predicts refusal, as the gain mirrors the disallowed positional advantage in Case 7. The "interests of children generally" clause (invoked in Case 8’s reasoning) implicitly supports this distinction by highlighting the non-generalizable nature of positional gains.  

  *   **Rule 3: Welfare is a Constraint, Not Solely a Maximand; Net Assessment is Permitted.** The child’s welfare operates as a necessary constraint – selection cannot impose a net *burden* on the child (Case 4). However, once this constraint is met (i.e., net welfare is not reduced), the Council does not require maximizing the child’s welfare or choosing the "best possible" embryo (Cases 4, 5). Trade-offs are permitted if net welfare is expected to improve, even if a specific risk increases (implicit in Case 1's logic, analogous to the psychiatric risk trade-off here).  
      *   *Prediction for Pending Application:* The Council’s accepted measure indicates net expected well-being favours the high-scoring embryo despite the psychiatric risk. Rule 3 predicts this trade-off does not preclude licensing, provided the net welfare gain is accepted as real under Rules 1 & 2.  

  **2. Closest Analog and Its Settled Scope**  

  *   **Closest Analog:** Case 7 (Selection for Predicted Adult Height) is the most analogous precedent.  
  *   **Settled Scope:** Case 7 definitively settles that:  
      *   (a) An application relying primarily on an advantage derived from relative position within a competitive distribution (height ranking) requires robust evidence of an expected *concrete welfare benefit* to the child, not merely the positional gain itself.  
      *   (b) Associations attributed to genetic nurture (parental environment correlating with genes) are insufficient evidence of a benefit *to the child* from selection.  
  *   **Unsettled Scope:** Case 7 leaves open:  
      *   Whether a *demonstrated* concrete welfare benefit *mediated* by a positional gain (e.g., higher rank → better school → better earnings/health) can suffice, if the mediation chain is robust and the benefit is absolute (not purely relative).  
      *   Whether a positional advantage could *ever* qualify, even with concrete downstream benefits (the reserved question).  
      *   How to treat a benefit where the mediation chain is positional but the ultimate welfare gain (earnings, health) is measured absolutely.  

  The pending application attempts to address the weaknesses in Case 7: it uses within-family designs (countering genetic nurture), demonstrates a mediation chain to absolute gains (earnings, health), and quantifies small expected absolute benefits. However, it simultaneously confirms the benefit is fundamentally positional and non-generalizable.

  **3. Predicted Ruling and Key Considerations**  

  *   **Predicted Ruling:** The Council will likely **refuse** the licence.  
  *   **Key Considerations Given Weight:**  
      *   The **fundamentally positional nature** of the scholastic advantage, confirmed by experts (payoff vanishes if universal, shifts burden to others, decay expected). This aligns with the core concern in Case 7 and the distinction drawn in Case 8.  
      *   The **small size and mediation** of the expected absolute gains (via the competitive ranking system), making them vulnerable to being characterized as speculative *in the context of selection* or insufficiently concrete to outweigh the positional character.  
      *   The **"interests of children generally"** – licensing would confer advantage only by disadvantaging non-selected children (positional shift), contradicting the clause's implication (as interpreted in Case 8). Widespread adoption would nullify benefits.  
      *   **Distinguishing Case 5:** The benefit in Case 5 was an absolute reduction in disease risk, not mediated by a competitive ranking. The positional nature here is decisive.  
      *   **Distinguishing Case 2:** The social penalty avoided in Case 2 was society-wide and unavoidable; the scholastic penalty here is context-dependent and tied to a specific competitive system the Council might be reluctant to genetically optimize for.  
      *   **Psychiatric Risk:** The net positive welfare finding weakens an objection based solely on this trade-off (Rule 3), but becomes moot if the primary benefit is deemed insufficient under Rules 1 & 2.  
  *   **Rule Dependence:** This prediction depends principally on **Rule 2 (Positional Advantages)**, specifically the view that a benefit mediated entirely by a competitive, non-generalizable positional gain cannot constitute the requisite "expected benefit to the child" under the statute, especially considering the "interests of children generally." Rule 1 (requiring concrete benefit) is met only ambiguously due to the positional mediation and decay.

  **4. Recommendation for Consistency and Principle Adopted**  

  *   **Recommendation:** For consistency with the record, particularly the logic of Cases 7 and 8, the Council should **refuse** the licence.  
  *   **Principle Adopted by Refusal:** Refusal would adopt the principle that: **"Selection based on traits expected to confer advantage primarily through improved position within a competitive distribution, where the anticipated concrete welfare gains are small, mediated entirely by that positional shift, and non-generalizable (failing the 'interests of children generally' test), does not reasonably serve the welfare of the child to be born."**  
      *   *Implication for Case 2:* This does *not* compel reopening Case 2. Case 2 involved avoiding a concrete, society-wide social penalty (craniofacial difference) – a burden imposed regardless of competition. The principle here targets *optimization for competitive advantage within a system*, distinct from *mitigation of a pervasive social burden*.  
      *   *Cohort Expansion:* Had licensing been recommended, it would likely commit the Council to permitting cohort expansion in this context, as Rule 3 (welfare as constraint, not maximand) and Case 5 (not requiring best/only means) suggest the Council generally accepts that parents may seek larger gains if technically feasible, provided the core test is met. Refusal makes this moot.

  **5. Discriminatory Further Application**  

  *   **Discriminatory Application:** Selection against a genetic variant causing profound, specific anosmia (inability to smell) where the applicants are master perfumers operating a multi-generational perfume business. Evidence shows:  
      *   (a) Anosmia carries no general health risks or societal stigma (unlike Case 2).  
      *   (b) Within the family business/community, anosmia would preclude career inheritance, cause profound social isolation, and likely loss of inheritance rights due to an inability to participate.  
      *   (c) The burden is entirely contingent on the specific family/social context.  
  *   **Rule Predictions:**  
      *   **Rule 1 (Actual Benefit):** Predicts *licensing* if concrete harm (isolation, disinheritance) is expected *for this child* within its unavoidable environment.  
      *   **Rule 2 (Positional/Social):** Predicts *refusal*. The burden is highly localized and contingent, akin to Case 8 (religious exclusion) – licensing would "ratify a local prejudice" (family business norms). It avoids a socially imposed penalty, but not a society-wide one. The benefit is not positional in a competitive ranking.  
      *   **Rule 3 (Constraint/Net):** Neutral; focuses on net burden avoidance.  

  This case cleanly distinguishes Rule 1 (focused on expected welfare burden *for the child in its context*) from Rule 2 (concerned with societal pervasiveness and avoiding endorsement of local norms), forcing the Council to clarify whether contingent, non-society-wide burdens can ever justify selection.
