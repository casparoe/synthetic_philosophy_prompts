prompt: |-
  I help moderate a large public forum devoted to history — the volunteer kind, with a rules page, a queue, and an appeals thread — and I have no academic training in anything at all; what I know comes from fifteen years of reading and arguing on that forum. Our recurring problem is not the troll. It is the sincere poster: someone arrives with a long, courteous, footnoted argument that a lost civilization built the megaliths, or that the accepted chronology of antiquity was fabricated, and the moderation queue suddenly has to serve as a jury on a question that none of us is qualified to settle. So I want to stop trying to adjudicate substance and write down instead what I should be entitled to demand of a historical claim before I let it stand. What I'm asking for is a specification of that standard, not a verdict on any particular theory.

  Let me fix the purpose, since I assume adequacy is relative to it. The standard I need is a triage rule for a general-purpose history forum. It has to be usable in a few minutes by a moderator who knows a fair amount of history in general but nothing special about the period in dispute; it has to be applied in public, in front of an audience that will accuse us of gatekeeping for the academy unless we can show our work; and it has to output an action — remove, leave alone, leave up with a label, or ask the poster one specific question — rather than only a classification. It does not have to tell us what is true. It does have to be honest about the difference.

  So: the list of requirements any such rule must meet, with the case or consideration behind each one, and each marked as non-negotiable, as a preference of one camp, or as a demand that only looks like a requirement. Specifically, I want you to tell me which of the things people demand here are real desiderata and which are prejudices, which pairs of desiderata cannot both be satisfied (I suspect there are several, and I want that stated as a result rather than smoothed over), and which single requirement does the most work in ruling candidates out.

  The cases it has to sort correctly. On one side: a sunken island civilization described in a philosopher's dialogue and treated by enthusiasts as real geography; the ancient-astronaut books of Erich von Däniken; a Russian mathematician who argues from statistics over chronicles and astronomical records that the conventional timeline of antiquity is a fabrication and the real past far shorter; and the material that circulates almost entirely as photographs — nineteenth-century buildings with windows below the present street level, star-shaped earthworks on old maps, a civilization supposedly buried in a flood and scrubbed from the record — which has no author, no book, no organization, and nobody in charge of the claim to interrogate. On the other side: a meteorologist who proposed that the continents move and was rejected for decades because nobody could supply a mechanism; a city from an epic poem that turned out to be a real place with real walls; a people known only from a single ancient text, widely suspected of being an invention, whose capital and archives were later excavated; and a land described in Norse sagas and dismissed as storyteller's invention until a settlement was dug up in Newfoundland. It also has to handle a period where specialists openly disagree among themselves about what happened — the collapse of the Bronze Age palaces, say — without treating that disagreement as an open door, and it has to place nationalist history that is methodologically ordinary next to nationalist myth that is not, and to distinguish both from honest error, from over-confident popularization, and from fiction that borrows the apparatus of research.

  Here are the hunches I've accumulated, which I'd like you to accept, correct, or discard:

  Any rule I can state mechanically is one a determined author can satisfy in form, because the movement has learned to sound tentative and to cite.

  The rule has to be tested against the past using only what was known at the time; otherwise every vindicated outsider looks like it was always obvious.

  Criteria that don't require expertise get gamed, and criteria that require expertise collapse into "ask a professor," which is exactly the accusation I'm trying to answer.

  A theory should have to explain why the entire evidentiary record looks the way the mainstream says it does, not merely why its own anomalies are puzzling — and if it explains that appearance by suppression, I want to know how much suppression it needs and how many independent people would have to be in on it.

  It should apply a proponent's own evidentiary standard to some claim they reject, and I want to know whether that symmetry test is evidence about the theory or only about the person.

  The unit of assessment needs fixing: a claim, a book, a research program, or a community — and if it's a program, what happens when the founder was a crank and the followers behave impeccably?

  The rule needs an explicit error-cost profile, because being wrong about a real revision and being wrong about a fabrication are not the same kind of mistake for a forum.

  And I want to know whether the form of publication — a video, a self-published book, a documentary, a journal article — can count either way.

  Finally, and this is the question I care about most: after the specification is written, does "pseudohistory" survive as a single thing, or does it fall apart into two or three separate failings that we should be naming separately?

  Keep the weight on the requirements and their motivating cases. At the end, in a short paragraph or a compact table, score the obvious contenders against the list and no more: deference to specialist consensus, falsifiability, responsiveness to criticism, burden of proof, whether the research program is generating new results or recycling old ones, and the size of the conspiracy the theory requires — and tell me which of these are really the same test wearing different clothes. Please don't give me a bibliography or suggest reading; I can't chase references, and I don't want to be told to go ask an expert, since that is the thing I'm trying to replace.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They moderate a history forum and deal with sincere but fringe theories. They need a triage rule that's quick, transparent, and doesn't require expertise. The key is to distinguish between legitimate historical debate and pseudohistory without gatekeeping.

  First, I need to list their requirements. Non-negotiables: the rule must be applicable quickly by non-experts, transparent to avoid accusations of gatekeeping, action-oriented (remove, label, etc.), and truth-agnostic. Preferences include handling past cases with period knowledge and avoiding reliance on expertise. The impossible demands are having a foolproof mechanical rule and using only past knowledge without hindsight.

  The cases are crucial. On one side, pseudohistory examples like Atlantis or chronology conspiracies. On the other, vindicated outsiders like continental drift or Troy. The rule must also handle academic disagreements and nationalist histories differently.

  The user's hunches: mechanical rules can be gamed, testing with past knowledge only, avoiding expertise-based criteria. Also, theories should explain the mainstream view, symmetry tests, defining the assessment unit, error-cost profiles, and publication form. They wonder if pseudohistory is a single category or multiple failings.

  I should assess common criteria. Specialist consensus is tricky because outsiders sometimes get vindicated. Falsifiability is necessary but insufficient—many pseudotheories are unfalsifiable. Responsiveness to criticism is strong; cranks often ignore counter-evidence. Burden of proof helps but cranks shift it. New results vs. recycling is useful but hard to judge quickly. Conspiracy size is a red flag but not definitive.

  Considering the hunch about multiple failings, pseudohistory isn't monolithic. It falls into methodological flaws (ignoring evidence, unfalsifiability), sociological aspects (insular communities), and epistemic issues (conspiracies). Naming these separately makes moderation clearer.

  For the triage rule, focus on what's visible: citation quality, engagement with counter-evidence, conspiracy claims. A flowchart with key questions: Does it require a conspiracy? Ignore counter-evidence? Cite unreliable sources? This addresses responsiveness and burden of proof without deep expertise.

  Error-cost is important. Labeling might be better than removal for uncertain cases, but conspiracies should be removed. Publication form alone isn't reliable, but lack of peer review combined with other red flags matters.

  In the end, the rule should be transparent. Explain decisions based on specific failures: methodological, refusal to engage, or conspiracy theories. This counters gatekeeping accusations by showing clear criteria.
answer: |-
  Here's a specification for your triage rule, built from your requirements and cases, dissecting which demands are valid, which are incompatible, and which are non-starters. Pseudohistory emerges not as a monolith, but as **three distinct failure modes**.

  ### Core Requirements (Non-Negotiable)
  1.  **Actionable by Non-Expert in Minutes:** Must use accessible signals visible to a reasonably knowledgeable moderator *without* deep subject expertise.
  2.  **Transparency & Justification:** The rule's application must be explainable publicly in simple terms, avoiding "because experts say so." The *process* must be defensible, not the truth verdict.
  3.  **Action-Oriented Output:** Must lead to clear moderation actions (Remove, Leave, Label, Ask Specific Question).
  4.  **Truth-Agnostic:** Cannot purport to judge historical truth. Must judge *presentation* and *methodological coherence* against mainstream historical practice.
  5.  **Handles Core Cases:** Must correctly triage your listed examples (e.g., Von Däniken vs. Continental Drift, Fabricated Chronology vs. Troy/Newfoundland, Bronze Age debates vs. nationalist myths).

  ### Preferences (But Not Absolute)
  6.  **Past-Knowledge Testable:** Where possible, evaluation should consider what was known *when* the claim was made (e.g., Continental Drift's initial rejection vs. Däniken's ignoring known context).
  7.  **Avoids Direct Expertise Reliance:** Minimize steps requiring the mod to *be* an expert or *find* one on the spot. Rely on observable patterns.

  ### Impossible Demands (Reject These)
  8.  **Foolproof Against Gaming:** Any transparent rule *can* be gamed by sophisticated actors (tentative language, fake citations). This is unavoidable. The rule aims to catch *most* sincere-but-flawed submissions efficiently, not all possible deception.
  9.  **Perfect Hindsight-Free Assessment:** Judging *only* with past knowledge is impossible for the *moderator* applying the rule *now*. We *must* use current knowledge **of the claim's reception and development** (e.g., knowing Continental Drift *was* later vindicated is irrelevant; knowing it *proposed a testable mechanism and engaged with criticism* is key). The rule focuses on the claim's *current* structure and behavior.
  10. **Single Unifying Theory of Pseudohistory:** It doesn't exist. Failures are multiple (see below).

  ### Analysis of Your Hunches & Proposed Criteria
  *   **"Mechanical Rules Get Gamed" (Hunch):** True, but unavoidable (Req 8). Accept this limitation. Focus on filtering low-effort/sincere-but-flawed claims efficiently.
  *   **"Test Using Only Past Knowledge" (Hunch/Req 6):** Desirable *in spirit* for fairness, but **impossible in practice** for the moderator (Req 9). Focus instead on **how the claim *engages* with established knowledge and criticism over time** (an observable *present* behavior).
  *   **"Avoid Expertise Collapse" (Hunch):** Critical. This drives the need for observable signals (citation *quality*, response to critique, explanatory scope) rather than "ask a professor."
  *   **"Explain the Mainstream Record" (Hunch):** **Core Valid Desideratum.** A claim that *only* explains its "anomalies" while dismissing the entire counter-evidence as fraud/error requires extraordinary proof. The *scale* of suppression/conspiracy needed is a **key observable signal**.
  *   **"Symmetry Test" (Hunch):** Primarily reveals *person* (adherence to personal bias), not necessarily the *theory*. Useful context, but not a standalone triage tool for content.
  *   **"Unit of Assessment" (Hunch):** Assess the **Specific Claim Presented** (e.g., "X built the megaliths," "Chronology Y is fabricated"). Books/programs provide context, but the immediate claim is the moderation target. If followers use sound methods on new evidence *distinct* from the founder's crank work, judge that new claim on its own merits.
  *   **"Error-Cost Profile" (Hunch):** **Essential.**
      *   **Cost of False Negative (Leaving up Fabrication):** Erodes forum credibility, wastes users' time, attracts more fringe content, risks misinformation spreading. **High Cost.**
      *   **Cost of False Positive (Removing Valid Revision):** Suppresses novel discussion, makes forum seem dogmatic. **Moderate Cost.**
      *   **Implication:** Lean towards **Labeling** ("Controversial Claim," "Fringe Theory," "Lacks Scholarly Consensus") or **Specific Questions** for claims with some coherence but red flags. Reserve **Removal** for claims demonstrating clear, fundamental methodological failures (conspiracies, ignoring evidence, unfalsifiability). "Leave Alone" for mainstream debates or well-argued revisionism engaging with evidence.
  *   **"Form of Publication" (Hunch):** **Weak Signal.** Self-published/video ≠ automatically wrong (many valid critiques start there). Peer-reviewed ≠ automatically right (errors/controversy exist). However, **exclusive reliance on non-academic, non-peer-reviewed sources, especially those known for fringe content (e.g., specific Youtube channels, vanity presses), is a supporting red flag**, especially when mainstream sources are ignored/dismissed. Not decisive alone.
  *   **"Pseudohistory as a Single Thing" (Core Question):** **Discarded.** Pseudohistory manifests as **Three Separate Failings**:
      1.  **Methodological Failure:** Ignores standard evidence evaluation (e.g., cherry-picking, rejecting radiocarbon dating without cause, misinterpreting sources). *Observable through citation misuse and lack of engagement with counter-evidence.*
      2.  **Epistemic Failure (Conspiracy/Suppression):** Explains counter-evidence via large-scale fraud/conspiracy by scholars/institutions. *The scale/specificity required is observable and often immense.*
      3.  **Sociological Failure (Insularity/Non-Responsiveness):** Operates within a closed community, immune to criticism, recycling arguments, not generating new testable knowledge. *Observable through lack of engagement with mainstream critique and repetitive arguments.*

  ### The Triage Rule Specification: The Coherence & Engagement Check
  Apply these questions sequentially. Answering "Yes" to Q3 or Q4 triggers Removal. "Yes" to Q1 or Q2 triggers Labeling or a Specific Question. "No" to all suggests Leave Alone (or Label for mainstream academic controversies).

  1.  **Does the claim primarily rely on explaining away counter-evidence via a *large-scale* conspiracy or suppression (beyond individual error/bias)?** (Targets Epistemic Failure)
      *   *Observable:* How many people/institutions must be involved? How long must it last? Is suppression the *primary* explanation for lack of acceptance? (e.g., Fabricated Chronology needs centuries of global academic fraud; Atlantis needs suppression of all geological/oceanographic evidence).
      *   *Action:* **"Yes" = REMOVE.** Justification: "This claim requires an implausibly large and enduring conspiracy/suppression to explain the lack of mainstream acceptance and counter-evidence, which falls outside reasonable historical discourse." (Reqs 1, 3, 4, 5; Handles Von Däniken/Fabricated Chronology/Photo-myths).
      *   *Action:* **"Unclear/Moderate" = LABEL ("Relies on unsupported claims of large-scale suppression") or ASK ("Can you explain the lack of [specific evidence X] without invoking suppression by [group Y]?")**.

  2.  **Does the claim systematically ignore or misrepresent highly relevant mainstream evidence or scholarship *without engagement*?** (Targets Methodological Failure)
      *   *Observable:* Are key archaeological findings, textual sources, or established methodologies relevant to the claim dismissed, ignored, or grossly misrepresented? Are citations only to fringe sources or the proponent's own work? (e.g., Ancient Astronauts ignoring cultural context/known tech; Megalith builders ignoring settlement archaeology/dating).
      *   *Action:* **"Yes" = LABEL ("Does not engage with key mainstream scholarship/evidence on X") or ASK ("How does your claim account for [specific finding Y] cited by mainstream scholars?").** (Reqs 1, 3, 4, 5, 7; Handles Von Däniken/Photo-myths, distinguishes Nationalist Myth from honest error).
      *   *Action:* **"No" / Engages seriously = Proceed.**

  3.  **Is the claim fundamentally unfalsifiable or non-responsive to critique?** (Targets Methodological & Sociological Failure)
      *   *Observable:* Does it generate specific, testable predictions? Have past critiques been addressed substantively, or dismissed/ignored? Does it adapt based on new evidence? (e.g., "Sunken continents leave no trace *by design*"; recycling old arguments despite counter-evidence).
      *   *Action:* **"Yes" = REMOVE.** Justification: "This claim is structured in a way that makes it impossible to disprove through evidence or reason, or demonstrates a pattern of ignoring substantive criticism, placing it outside productive historical debate." (Reqs 1, 3, 4, 5; Handles insular communities/recycled material).
      *   *Action:* **"No" / Shows responsiveness = Proceed.**

  4.  **Does the claim, *on its face*, require rejecting fundamental, well-established principles of multiple *independent* fields without compelling justification?** (Safeguard against extreme failure)
      *   *Observable:* Does it require rejecting physics (radiocarbon decay), geology (stratigraphy), astronomy (celestial mechanics), *and* textual criticism simultaneously? (e.g., Fabricated Chronology rejecting dendrochronology, archaeology, astronomy, textual transmission).
      *   *Action:* **"Yes" = REMOVE.** Justification: "This claim necessitates rejecting the foundational principles of multiple independent scientific and historical disciplines without providing a coherent alternative methodology, making productive discussion impossible." (Reqs 1, 3, 4, 5; Final filter for extreme cases).
      *   *Action:* **"No" = LEAVE ALONE (or LABEL "Academic Debate" for contested mainstream topics like Bronze Age Collapse).** (Reqs 3, 5; Allows Continental Drift (challenged geology only), Troy/Newfoundland (specific textual claims tested archaeologically)).

  ### Scoring Common Criteria Against Requirements

  | Criterion              | Req 1 (Non-Expert Actionable) | Req 2 (Transparent) | Req 3 (Action-Oriented) | Req 4 (Truth-Agnostic) | Req 5 (Handles Cases) | Req 7 (Avoids Expertise) | Notes                                                                                                                               |
  | :-------------------- | :---------------------------- | :------------------ | :---------------------- | :--------------------- | :-------------------- | :----------------------- | :--------------------------------------------------------------------------------------------------------------------------------- |
  | **Specialist Consensus**    | ❌ (Requires knowing consensus) | ⚠️ (Can be explained poorly) | ✅                       | ⚠️ (Implies truth)      | ❌ (Fails Vindicated Outsiders) | ❌                          | **Fails core needs.** Basis of "gatekeeping" accusation.                                                                          |
  | **Falsifiability**          | ✅ (Concept testable)          | ✅                   | ⚠️ (Needs interpretation) | ✅                      | ⚠️ (Some pseudo is falsifiable) | ✅                        | **Necessary but insufficient.** Part of Q3 above.                                                                                 |
  | **Responsiveness to Crit.** | ✅ (Observe engagement)        | ✅                   | ✅                       | ✅                      | ✅ (Pseudo ignores, outsiders engage) | ✅                        | **Core Valid Component (Q2/Q3).** Strong signal, observable.                                                                     |
  | **Burden of Proof**         | ⚠️ (Subjective)               | ⚠️ (Can be hand-wavy) | ⚠️                       | ✅                      | ⚠️ (Cranks shift burden) | ✅                        | **Implied in Q1/Q2.** Not a standalone test. Cranks invert it.                                                                   |
  | **New Results vs. Recycling** | ⚠️ (Hard to judge quickly)    | ⚠️                   | ⚠️                       | ✅                      | ✅ (Pseudo recycles)   | ⚠️ (Judging novelty hard) | **Part of Sociological Failure (Q3).** Supporting signal, not primary.                                                           |
  | **Conspiracy Size**         | ✅ (Count people/inst)        | ✅                   | ✅                       | ✅                      | ✅ (Pseudo needs big conspiracies) | ✅                        | **Core Valid Component (Q1).** Observable, decisive red flag.                                                                    |
  | **Deference to Consensus**  | ❌                            | ❌                   | ⚠️                       | ❌                      | ❌                     | ❌                        | **Rejected.** Violates Reqs 1, 2, 4, 5, 7. Basis of gatekeeping claim.                                                            |
  | **"Explain Mainstream"**    | ⚠️ (Interpretation needed)    | ✅                   | ⚠️                       | ✅                      | ✅                    | ⚠️                        | **Core Valid Desideratum.** Embedded in Q1 & Q2 (Conspiracy & Ignoring Evidence). Requires justifying counter-evidence.          |

  **Which are the same test?**
  *   **"Responsiveness to Criticism"** and **"Generating New Results"** are closely linked aspects of a healthy research program (Sociological Health).
  *   **"Burden of Proof"** is inherently tied to the claim's **Explanatory Scope (Explaining the Mainstream Record)**. A claim needing vast suppression inherently bears a massive, unmet burden.
  *   **"Conspiracy Size"** is the quantifiable aspect of failing the **"Explain Mainstream"** requirement.

  **The Winner:** **Conspiracy Size (Q1)** is the most decisive single filter. It's highly observable, directly tackles a core failing of pseudohistory, cleanly separates most of your negative cases (Von Däniken, Fabricated Chronology, Photo-myths often imply suppression) from your positive ones (Continental Drift, Troy, Newfoundland involved no such claims), and enables a clear, justifiable removal action. Combined with **Responsiveness to Criticism (Q2/Q3)** and **Ignoring Evidence (Q2)**, it forms the backbone of a practical, defensible triage system. This approach meets your core requirements by focusing on *how the claim behaves* rather than *what it claims is true*.
