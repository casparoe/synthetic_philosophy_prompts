prompt: |-
  I am a professor of philosophy — my own work is in general philosophy of science, and I am not a physicist — and I have been asked to draft the section on epistemic warrant for the scoring rubric of our university's internal high-risk research fund. The panel meets twice a term, sees between twelve and eighteen proposals per cycle, spends roughly twenty minutes on each, and must attach a one-page written rationale to every award; those rationales are read by the provost and by the faculty senate's research committee. There are five of us, only one of whom is a physicist, and that colleague will stop reading altogether if the rubric sounds like philosophers policing physics. So what I need is something the whole panel can actually run, in plain language, within the time we have, and reusable across cycles rather than a set of wise remarks about one application. Please do not give me a bibliography or a reading list: I have the literature. What I lack is a procedure.

  The proposals that defeat us share a shape. They come mainly from fundamental cosmology and quantum gravity — a framework such as the string landscape or eternal inflation, whose defenders concede outright that no decisive test will be available during the grant period, and which is supported instead by arguments of a few recurring kinds: that a large, well-motivated community has searched hard for a rival framework of comparable unifying power and not found one; that the framework displays unexpected internal coherence, drawing together results that were not constructed to fit; that theories of this ambition and difficulty have historically gone on to empirical success, so the track record of the genre is itself some evidence; and, in the cosmological cases, that the observed values of certain parameters are roughly what one should expect to observe if the theory's vast space of possibilities is real and we occupy an untypical, observer-permitting corner of it. Proposals from other fields make structurally parallel claims: simulation-based programmes in macroeconomics or in neuroscience, whose models can be checked only against stylized facts or against other simulations, and whose defenders invoke coherence, unification, and the absence of rivals precisely when no out-of-sample test is available. At present our panel either defers to the physicist member or dismisses these proposals as not science. Both are evasions, and I want something better.

  What I want from you is a decision procedure — ordered gates, each with a question, a specification of what counts as a sufficient answer, an instruction about what to do when the panel cannot get an answer (which in twenty minutes will be often), and a stop rule that says when the answer is no. It must handle at least the following difficulties.

  First, a mapping from strength of warrant to strength of decision. Our current rubric conflates three things: whether the framework deserves further work; whether it may be presented to students or the public as a live option rather than a speculation; and whether other fields may treat it as a premise. My suspicion is that the non-empirical arguments, even at their strongest, only ever license the first, and that our awards quietly drift into licensing the second and third. I have been calling this drift warrant laundering. Give me a way of catching it, including a check that reads the proposal's own aims, hiring, and public-impact sections against its epistemic section, since the slippage usually happens between them.

  Second, the confound I keep running into with the no-rivals argument: the probability that no alternative exists is not the probability that a search of this character, duration, and sociological composition would have found one, and I do not think a panel can estimate the latter even to an order of magnitude. Tell me what the panel should do instead — my own thought is to require the applicants to name one rival they take seriously, however undeveloped, and to score both frameworks on the cited evidence, with the absence of any nameable rival recorded as a fact about the field rather than about the world. Tell me if that is the wrong fix.

  Third, discriminating power. The evidence cited is usually described only as something the framework predicts or accommodates. I want the panel to ask how much more expected that evidence is under the framework than under the best rival actually on the table, and to note that when no rival can be articulated the comparison collapses. Say what the procedure does at that point: whether it stops, whether it downgrades the award, or whether it caps the decision at the weakest of the three levels above. I am also inclined to ask, as a lighter check, whether the same form of argument would have recommended a framework we now regard as dead; if so, that is a reason for caution rather than a refutation, and I want you to tell me how much weight such a historical probe can bear given that we will be applying it from memory and under time pressure.

  Fourth, the anthropic and typicality step. Some proposals rest largely on the claim that what we observe is unsurprising within a huge space of possibilities once selection effects are accounted for. I want a test for whether the typicality claim is independent of the outcome it is meant to explain — whether the measure over possibilities is motivated for reasons other than that it delivers the answer — and for whether there is any case in which the argument would have come out the other way. If there is not, say plainly that the step is unfalsifiable in a local rather than a global sense and tell me what the panel should then do.

  Fifth, a progress or horizon gate. A programme that receives non-empirical support only can still be worth a bet, but it is a bet that needs a stated termination condition: what would count, by the end of the award, as the programme having stalled rather than merely not yet succeeded? For these programmes there is no clean failure signal, and I would rather the rubric admitted that than pretended otherwise. I also want the renewal case handled explicitly, since sunk costs and the panel's own earlier language are working on us.

  For each gate, tell me what counts as a sufficient answer, and mark the points at which the remaining question is one of values rather than of warrant — opportunity cost across fields, the training and infrastructure a programme sustains, its effect on the prestige and composition of a department — and must therefore be handed back to the panel as a vote rather than disguised as an epistemic score. Equally, tell me which of my distinctions do not survive being made usable, and should be dropped rather than kept as ornament.

  Then run the procedure, in full, on three applications.

  The first: a new three-year proposal from a cosmology group working on eternal inflation, arguing that the observed value of the vacuum energy is what an anthropic selection argument predicts, conceding no direct test within the period, naming a rival single-universe approach but describing it as undeveloped, and requesting funds that include a public lecture series presenting the multiverse as the likely large-scale shape of things.

  The second: a third renewal from a quantum-gravity group. It cites dualities and unexpected connections to pure mathematics, points to a long search without alternatives, asks for continued funding, and also asks that the panel record in its rationale that this framework is the default setting for quantum-gravity work at this university, to be reflected in a hiring line and in graduate curricula. I expect your procedure to stop somewhere here, and I want to see exactly where and in what words.

  The third is the one I expect to dislike. It is an agent-based macroeconomic programme whose models are validated only against stylized facts and against other simulations, with no out-of-sample test available; its lead investigator is a colleague whose work I think is first-rate, and I want to fund it. If your procedure returns a no, say so without softening it. Then tell me honestly whether any amendment to the procedure that would save it is principled or is merely special pleading by someone who already knows the answer he wants.

  Close by telling me, in language I can put in the preamble to the rubric and that a provost can read in one sentence, what this procedure cannot do. I have in mind that it will not deliver a credence in any framework, that it will not compare a bet in fundamental physics against a bet in neuroscience, and that it cannot settle whether a failed search tells us about the world or about ourselves — but I would like you to decide, rather than to agree with me.
reasoning: |-
  Hmm, the user is a philosophy professor specializing in philosophy of science who needs help designing a practical decision procedure for evaluating high-risk research proposals. They're dealing with proposals that rely heavily on non-empirical arguments - especially from cosmology, quantum gravity, and simulation-based fields - and need a rubric that avoids both uncritical deference and outright dismissal.

  The core challenges they've identified are fascinating: warrant laundering (where epistemic support for exploration gets misrepresented as stronger validation), the no-rivals fallacy, lack of discriminatory power, problematic anthropic reasoning, and the need for clear termination conditions. They want gates that can be applied in 20-minute evaluations by a multidisciplinary panel.

  I should build a procedure with strict stop rules that distinguishes three levels of epistemic warrant: Level 1 (exploratory), Level 2 (teachworthy), and Level 3 (premise-worthy). Each gate must have clear pass/fail criteria and instructions for when consensus can't be reached. Crucially, it should expose when proposals overreach - like claiming Level 3 support when only Level 1 is justified.

  For the no-rivals problem, their instinct is right: requiring naming a substantive alternative avoids conflating absence of evidence with evidence of absence. For anthropic reasoning, we need to test whether the typicality measure is independently motivated. The progress gate is vital - all exploratory proposals must define what stagnation looks like.

  Now to test it against their three cases: The cosmology proposal clearly fails at Gate 4 (anthropics) and Gate 5 (public claims vs epistemic status). The quantum gravity renewal trips on Gate 6 (institutional lock-in request). The macroeconomic model passes only at Level 1 if they fix their stagnation metric - showing the procedure works even when I'd personally want to fund it.

  The limitations should be explicit: This won't assign probabilities, compare cross-field opportunity costs, or resolve the metaphysics of anthropic reasoning. It's purely about containing epistemic overreach in high-risk research justification.
answer: |-
  Here is a decision procedure designed for your panel's constraints. It has 6 gates, each with a question, criteria for a sufficient answer, instructions for impasse, and a stop rule. It distinguishes three levels of epistemic warrant:

  *   **Level 1 (Exploratory):** Warrants *further investigation* due to intriguing promise, internal coherence, or lack of viable alternatives. Suitable for high-risk research funding.
  *   **Level 2 (Teachworthy):** Warrants presentation as a *live option* (e.g., in advanced seminars, cautious public communication) based on significant non-empirical support and sustained progress.
  *   **Level 3 (Premise-Worthy):** Warrants use as a *foundational premise* in other fields or major institutional decisions (hiring, curricula) based on robust empirical support or overwhelming consilience where empirical test is truly impossible *and* alternatives are demonstrably exhausted.

  **The Gates:**

  1.  **Gate: Internal Coherence & Unification**
      *   **Question:** Does the framework demonstrate significant, non-trivial internal coherence or unification of previously disparate elements/phenomena? (e.g., mathematical consistency, unexpected connections, resolving conceptual tensions).
      *   **Sufficient Answer:** Yes - The proposal clearly identifies specific, non-trivial unifications or resolutions of tensions achieved by the framework. (e.g., "Theory X resolves tension Y between principles A and B," "Structure Z unifies phenomena P and Q which were previously unrelated").
      *   **Impasse (No Consensus in 3 mins):** Default to *No*. Proceed cautiously.
      *   **Stop Rule:** If **No**, proceed to Gate 6 (Horizon) *only* for potential Level 1 support, but flag severe coherence concerns. If **Yes**, proceed to Gate 2.

  2.  **Gate: The Rival Check**
      *   **Question:** Can the applicants name *at least one substantive, conceptually distinct rival framework* that addresses the same core problem(s), however underdeveloped, and briefly contrast the cited evidence's bearing on both?
      *   **Sufficient Answer:** Yes - A named rival is described sufficiently to understand its core difference. The applicants offer a *brief* (1-2 sentence) comparative assessment of how the cited evidence relates to their framework vs. the rival (e.g., "Evidence E is predicted by our framework but requires ad-hoc adjustment in rival R," "Rival R cannot yet accommodate evidence F which our framework explains").
      *   **Impasse (No Consensus in 3 mins):** If rivals *were* named but comparative assessment is unclear, proceed but flag weak discriminatory power. If *no* rival named despite prompting, record: "No substantive rival named by applicants." Proceed to Gate 3, downgrading discriminatory power assessment.
      *   **Stop Rule:** If **No substantive rival named**, proceed to Gate 3 but cap maximum warrant at **Level 1**. The absence of a rival is noted as a *field state*, not evidence for the framework's truth. If **Rival named & compared**, proceed to Gate 3.

  3.  **Gate: Discriminatory Power**
      *   **Question:** How much *more expected* is the cited key evidence under this framework than under the best articulated rival (or, if no rival named, under a plausible 'null' or minimal alternative)? Is the evidence *accommodated* or genuinely *predicted*?
      *   **Sufficient Answer:** The proposal or panel discussion provides a plausible argument that the evidence is *significantly more natural, less ad-hoc, or quantitatively more precise* under the proposed framework than under the rival/null. Ideally, evidence is a *prediction* (prior to or independent of the evidence being known), not just accommodation. If historical analogy is invoked, it should be specific and plausible (e.g., "Similar unification arguments supported GR before eclipse test").
      *   **Impasse (No Consensus in 4 mins):** Default to "Evidence appears accommodated equally well/marginally better; weak discriminatory power." Proceed.
      *   **Stop Rule:** If evidence is judged **Accommodated with minimal/no discriminatory advantage**, cap maximum warrant at **Level 1**. If evidence shows **Significant discriminatory advantage**, proceed to Gate 4 (if anthropics relevant) or Gate 5. *Historical Probe (Light Check):* If a panelist recalls a *specific, salient historical case* where similar non-empirical arguments strongly supported a framework later abandoned, mention it briefly ("Caution: similar arguments supported [Framework Y]"). This *reduces confidence* but isn't a stop rule unless it directly undermines a specific claim (rare under time pressure). Weight: Low-Medium; flags potential over-reliance on a type of argument.

  4.  **Gate: Anthropics & Typicality (Apply ONLY if central)**
      *   **Question:** Is the claimed "typicality" or "expectation" of the observed evidence *independent* of that specific evidence? Specifically: Is the measure/probability distribution over possibilities motivated by principles *distinct* from delivering the observed value? Could the argument plausibly have yielded a *different* prediction?
      *   **Sufficient Answer:** Yes - The measure is derived from fundamental principles of the framework itself (e.g., a well-defined quantum measure in a multiverse) or independently established physics/math, *not* chosen or adjusted to fit the observation. The proposal identifies *potential* observations that would have been predicted as "typical" under the same measure but are *not* what we see (demonstrating falsifiability in principle).
      *   **Impasse (No Consensus in 4 mins):** Default to "Typicality argument appears post-hoc or measure lacks independent motivation." Proceed, flagging concern.
      *   **Stop Rule:** If **No** (or Impasse Default) - The anthropic step is judged *locally unfalsifiable* (for this evidence, under this proposal). **Cap maximum warrant at Level 1.** Proceed to Gate 5. If **Yes**, proceed to Gate 5.

  5.  **Gate: Warrant Slippage Check**
      *   **Question:** Does the level of epistemic warrant claimed or implied in the proposal's *Aims/Background/Epistemic Section* align with the level assumed in its *Hiring/Teaching/Public Impact/Dissemination Plans*? Does the funding request itself imply a stronger warrant than argued?
      *   **Sufficient Answer:** Alignment - The non-empirical arguments presented (Gates 1-4) are used *only* to justify exploratory research (Level 1). Any claims about teaching, public presentation, or institutional status (Level 2/3) are either absent, explicitly provisional ("if successful, could lead to..."), or justified *separately* (e.g., by pedagogical value, existing community practice *explicitly noted as such*).
      *   **Impasse (No Consensus in 2 mins):** Default to "Potential misalignment detected." Proceed cautiously to Gate 6.
      *   **Stop Rule:** If **Misalignment Detected** (e.g., arguments for Level 1 used to justify requests implying Level 2 or 3 - like "default setting", core curriculum, definitive public lectures) - **Cap maximum warrant at Level 1.** Flag misalignment explicitly in rationale. If **Aligned**, proceed to Gate 6.

  6.  **Gate: Horizon & Progress Metrics**
      *   **Question:** What *concrete, assessable milestones* (conceptual, technical, mathematical) define progress by the end of the award period? What specific outcome (or lack thereof) would constitute *stalling* or lack of viable progress, justifying non-renewal or a major pivot (even if ultimate empirical test remains distant)?
      *   **Sufficient Answer:** The proposal specifies 2-4 clear, non-trivial, framework-specific milestones *within the grant period* (e.g., "Resolve mathematical inconsistency X," "Develop computational technique Y to handle scale Z," "Derive observable consequence P from mechanism Q," "Achieve consensus on interpretation R"). It defines a clear "stall signal" (e.g., "Failure to resolve X despite dedicated effort," "Demonstration that technique Y is fundamentally flawed for this purpose," "Emergence of insurmountable conceptual obstacle S").
      *   **Impasse (No Consensus in 4 mins):** Default to "Progress metrics/stall signals inadequately defined." **Stop - Do Not Fund.**
      *   **Stop Rule:** If **Milestones/Signals Adequate**, assign highest warrant level not capped by previous gates (1, or potentially 2 if Gates 1-5 strongly support it). If **Inadequate** or Impasse Default, **Stop - Do Not Fund.** For Renewals: Scrutinize *previous* milestones. Were they met? If not, was the "stall signal" triggered and acknowledged? If previous milestones unmet *and* no stall signal triggered/acknowledged, **cap at Level 1 or Do Not Fund** (flag lack of rigor). Sunk costs irrelevant.

  **Applying the Procedure**

  **Application 1: Eternal Inflation Cosmology (New Proposal)**
  *   **Gate 1 (Coherence):** Likely YES. Eternal inflation aims to unify inflation, vacuum energy, initial conditions. Proceed.
  *   **Gate 2 (Rival):** YES. Names single-universe approach (even if undeveloped). Panel notes rival is "undeveloped" - this *weakens* the no-rivals claim but passes the gate. Proceed.
  *   **Gate 3 (Discriminatory Power):** Focus: Observed vacuum energy value. Under Eternal Inflation + Anthropics: Predicted as "likely" or "possible". Under Rival (Single-Universe): Requires fine-tuning, but *accommodates* the value. **Discriminatory Advantage: Weak/None.** (The value is accommodated by both, anthropics claims to make it *expected*, but Gate 4 tests that claim). Cap at **Level 1**. Proceed to Gate 4.
  *   **Gate 4 (Anthropics):** Central. Question: Is the measure independent? Proposal likely uses a simple volume or entropy measure. Is this motivated *independently* of getting Λ right? Often not; measures are chosen/adjusted. Can it predict something else? Hard to see how for Λ. **Likely NO** or Impasse Default. **Cap remains Level 1.** Proceed to Gate 5.
  *   **Gate 5 (Slippage):** **MISALIGNMENT DETECTED.** Epistemic section argues for exploratory value (Level 1). Public lecture series presents multiverse as "likely large-scale shape of things" (Implies Level 2/3). **Cap remains Level 1.** Proceed to Gate 6.
  *   **Gate 6 (Horizon):** Assume adequate milestones/stall signals defined for technical work. **Warrant Level: 1 (Exploratory).**
  *   **Panel Action:** Fund at **Level 1**. **Rationale Must State:** "Supported for exploratory potential based on internal coherence and sustained community effort. Non-empirical arguments (anthropic prediction, lack of developed rivals) currently provide weak discriminatory power and do not warrant presentation as the 'likely' large-scale structure (public lectures should reflect provisional status). Progress will be judged against milestones [X,Y,Z]; stall defined as [S]."

  **Application 2: Quantum Gravity (Third Renewal)**
  *   **Gate 1 (Coherence):** YES. Cites dualities/math connections. Proceed.
  *   **Gate 2 (Rival):** Likely YES (e.g., LQG, CDT, Asymptotic Safety named). Proceed.
  *   **Gate 3 (Discriminatory Power):** Evidence: Dualities, math connections. Are these *more expected* here than in rivals? Often claimed, but highly technical. **Impasse likely (4 mins insufficient). Default:** "Evidence accommodated; discriminatory advantage unclear." Cap at **Level 1**? (Debatable, but cautious). Proceed. (Assume no strong historical caution flag).
  *   **Gate 4 (Anthropics):** N/A (unless somehow relevant). Proceed.
  *   **Gate 5 (Slippage):** **MISALIGNMENT DETECTED.** Epistemic arguments (coherence, dualities, lack of alternatives after long search) support exploration (Level 1). Request to record framework as "default setting for QG work" and base hiring/curricula on it implies **Level 3 (Premise-Worthy).** **Cap at Level 1.** Proceed to Gate 6.
  *   **Gate 6 (Horizon):** **CRITICAL GATE FOR RENEWAL.** Scrutinize previous milestones. Were they met? If not, was the defined "stall signal" triggered? If milestones missed *and* no stall signal acknowledged, **Stop - Do Not Fund.** (e.g., "Milestone X (resolve issue Y) from proposal 2 not achieved; reason given 'unexpected complexity' does not match defined stall signal 'proof of fundamental obstruction Z'."). Even if milestones met, request for "default status" is rejected by Gate 5 cap. **Warrant Level: 1 (Exploratory) MAX.**
  *   **Panel Action:** **Funding Decision:** If previous milestones/signals rigorously met, *potentially* fund at **Level 1** for continued exploration. **Rationale Must State:** "Renewed for continued exploratory work based on sustained technical progress against milestones. Non-empirical support does not currently warrant designation as the 'default setting' for quantum gravity or altering hiring/curricula based on its presumed validity. This request overreaches the epistemic warrant. Future renewal contingent on rigorous milestone achievement and stall signal acknowledgment." **If previous milestones/signals not met/acknowledged: Do Not Fund.**

  **Application 3: Agent-Based Macroeconomic Model (New Proposal - You want to fund)**
  *   **Gate 1 (Coherence):** YES (Model integrates behaviors, shows emergent stylized facts). Proceed.
  *   **Gate 2 (Rival):** YES (e.g., DSGE models, other ABM approaches named). Proceed.
  *   **Gate 3 (Discriminatory Power):** Evidence: Fit to stylized facts, comparison to other simulations. **Key Question:** Is the fit *more expected* / less ad-hoc here than in rivals? Or just equally accommodated? Requires panel judgment. Under time pressure, likely **Impasse Default:** "Accommodated; discriminatory advantage unclear." **Cap at Level 1.** Proceed.
  *   **Gate 4 (Anthropics):** N/A. Proceed.
  *   **Gate 5 (Slippage):** Check aims vs. dissemination. Does PI claim predictive power or policy relevance beyond model exploration? If yes, misalignment. Assume proposal is careful: **Aligned** (aims: explore mechanisms, generate hypotheses). Proceed.
  *   **Gate 6 (Horizon):** **STOPPING POINT.** Milestones: Likely technical (build model variant, run scenario X, compare to stylized fact Y). Stall Signal: **Insufficient?** "No out-of-sample test available" is inherent. What constitutes *stalling*? Failure to generate any plausible stylized facts? Emergence of fundamental logical flaws? Lack of internal consistency? If stall signal is vague (e.g., "lack of progress"), **Impasse Default:** "Progress metrics/stall signals inadequately defined." **Result: Do Not Fund.**
  *   **Panel Action (If Gate 6 Fails):** **Do Not Fund.** Rationale: "While the approach is intellectually promising and the investigator esteemed, the proposal fails to define concrete, assessable milestones for progress or, crucially, a clear signal for what would constitute stalling of the research programme within the grant period, given the inherent lack of out-of-sample testing. High-risk exploration requires defined horizons for assessment."
  *   **Saving It?** A *principled* amendment requires strengthening **Gate 6** for simulation-heavy fields. Could the PI define "stalling" as failure to achieve *internal* validation targets (e.g., failure to reproduce a core stylized fact *under any plausible calibration*, demonstration of fundamental dynamical instability, inability to incorporate a required agent behavior)? Could milestones focus on *novel qualitative insights* or *resolving internal inconsistencies*? If the PI can define such field-appropriate, concrete stall signals and milestones *within the proposal*, it passes Gate 6. Allowing vague signals just to fund it is **special pleading**. The procedure highlights a genuine weakness in the proposal as described.

  **Limitation Statement (For Rubric Preamble):**

  >"This procedure assesses the *epistemic warrant* for high-risk research frameworks lacking imminent empirical test. It distinguishes levels of support (exploration, provisional teaching, foundational premise) and guards against overclaiming. **It does not:** assign probabilities to theories; compare the intrinsic merit or opportunity cost of bets across different fields; determine if a failed search reflects reality or sociological limits; or override separate judgments about training value, institutional strategy, or investigator track record. Its sole function is to rigorously evaluate the strength of non-empirical arguments presented to justify the proposed research and its potential implications."

  **Key Distinctions Dropped:**
  *   Deep philosophical dissection of "evidence" vs. "accommodation" vs. "prediction" - simplified to "discriminatory power".
  *   Detailed Bayesian quantification - relies on comparative plausibility under time pressure.
  *   Full resolution of the "metaphysical" status of anthropic reasoning - focuses on local falsifiability and measure independence.
  *   Distinguishing every sub-type of non-empirical argument - focuses on coherence, rivals, discrimination, anthropics (if relevant), and slippage as core issues. The "track record of the genre" argument is subsumed under the optional, lightweight historical probe in Gate 3, not a separate gate.
