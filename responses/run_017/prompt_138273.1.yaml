  First, I need to understand the core ethical dilemma. The petition argues that spending now benefits future students more due to the urgency of climate change. Opposing trustees see the perpetual trust as preserving autonomy for each generation. The compromise suggests spending now but repaying later, framing it as intergenerational reciprocity.

