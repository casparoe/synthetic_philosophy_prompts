answer: |-
  Mira’s will lacks *direct practical acknowledgment* of the right-making consideration—the debt owed to the person in need—as her own reason for acting. In the first case, she acts *for* her grandmother’s approval, which contingently aligns with rightness; this approval remains her motivating end, and the rightness is merely its content, not her practical ground. The unreflective helper, by contrast, acts *from* the person’s need itself: their concern constitutes an immediate, non-derivative recognition of the moral claim, making the need their operative reason. Mira’s deference substitutes an external authority (even a reliable one) for first-personal engagement with the moral reality. What’s missing isn’t internal reliability—her will reliably tracks rightness via grandma—but the *form of motivation*: she relates to rightness as a property of what garners approval, not as a demand inherent in the situation that moves her directly. The shift to local admiration reveals this, as her motive’s object changes while her structure remains identical, proving approval was always primary. The will’s moral worth requires that the right-making feature itself—not its proxy—be the agent’s practical lens.  

  I’m ready for your variants.
