          A. The proposition that the train leaves at nine (what I intended)
          B. The proposition that the train leaves at six (what the sentence means)

        And then: Was my act of asserting improper?
          A. No, because I knew the truth. (KN, JBN, BN might say this if they think the asserted proposition is the intended one? But if it's the sentence meaning, then it's false.)
          B. Yes, because I asserted something false. (TN)
          C. Yes, because I didn't know the train left at six. (KN, JBN if we take the asserted proposition as six)
          D. Yes, because I didn't have evidence for the train leaving at six. (JBN, RN)
          E. Yes, because I wouldn't be able to back up the claim that it leaves at six. (AN)

        This case is complicated by the ambiguity in what was asserted.

        We can ask: What proposition did I assert?
          A. The one I intended (nine)
          B. The one that the words I uttered mean (six)

        Then separately: Was my act of asserting that proposition (whichever it is) improper?

        But we want one question.

        We can combine:

          Did I assert something improper? Why or why not?
            A. No, because I intended to say the true thing and I knew it. [This would be if we think the asserted proposition is nine? Or if we think the norm is about intention?]
            B. Yes, because what I actually said (that it leaves at six) was false. [This if we think the asserted proposition is six and then TN applies]
            C. Yes, because I didn't know that the train leaves at six (even though I knew it left at nine). [KN, JBN if asserted proposition is six]
            D. Yes, because I didn't believe that the train leaves at six. [BN if asserted proposition is six]
            E. It was improper because I used words that I didn't fully understand, so I wasn't in a position to defend the claim. [AN]

        This is messy.

        We can force the asserted proposition to be six, as that is the conventional meaning.

        So: I asserted the false proposition that the train leaves at six.

        Then:

          A. It was improper because false. (TN)
          B. It was improper because I didn't know it. (KN, JBN)
          C. It was improper because I didn't believe it. (BN) [I believed it left at nine, so I didn't believe it left at six]
          D. It was improper because I had no evidence for it. (JBN, RN) [I had evidence for nine, but not for six? So no evidence for six]
          E. It was improper because I couldn't back it up. (AN)
          F. It was not improper because I intended to say something true and I did my best. (This might be a different view)

        But note: I didn't believe it left at six, so BN would say it's improper.

        And I had no evidence for six, so JBN and RN would say improper.

        And I didn't know it left at six, so KN and JBN say improper.

        So many norms converge on improper. The only one that might not is if we think the norm is about the intention? But that's not on our list.

        This case might not be good for distinguishing.

     Question 4: Lottery case.
        Scenario: Before the draw, purely on the base rates, I tell you "your ticket lost." Then it wins.

        Question: What exactly was wrong with the first thing I said, and what should I do when I find out?

        Options for what was wrong:
          A. It was false. (TN)
          B. I didn't know it was true. (KN)
          C. I didn't have sufficient evidence to be justified in believing it. (JBN)
          D. I had evidence, but it wasn't enough to make it knowledge, but it was reasonable to say it. (This might be a view that it was proper at the time? But then what was wrong? The user says it wins, so it was false. But at the time of assertion, it was unknown that it was false.)
          E. I couldn't back it up adequately if challenged. (AN)

        What should I do when I find out?
          A. Nothing, because it was proper at the time. (KN might say this? But it was unknown, so improper by KN. JBN might say that it was justified at the time, so no need to retract? But then you find out it's false, so you should retract.)

        This case is tricky because many norms will say it was improper at the time:

          TN: It was true or false? At the time, we don't know, but after the draw we know it was false. But the norm of TN is that at the time of assertion, it must be true. At the time, it wasn't known to be true, but was it true? It was either true or false. If it was false (which it turned out to be), then TN says it was improper. But if it had been true, then TN says it was proper. But we don't know at the time.

        This is a problem for TN: it makes propriety depend on a fact that the speaker doesn't know.

        For this case, we can ask at the time of assertion, was it proper? 

        But the user says: "Then it wins." -> so it was false.

        So:

          TN: It was improper because false.
          KN: It was improper because I didn't know it.
          JBN: It might be proper if the base rates are sufficient evidence, or improper if not. Typically, lottery cases are used to show that justification is not sufficient for knowledge, so they are used to argue for KN. But for JBN, if the evidence is sufficient for justification, then it would be proper. But many think that in lottery cases, you are justified in believing you lost? So JBN might say it was proper.

        This is confusing.

        We can assume that the base rate is high (e.g., 1 in a million chance to win) so that it is justified.

        Then:

          TN: It was false -> improper.
          KN: Didn't know -> improper.
          JBN: Justified -> proper.
          BN: If I believed it -> proper.
          AN: If I can back it up with the base rate -> proper.
          RN: If we take RN as not requiring belief, but I believed it and had evidence -> proper? But if I didn't believe it? In this case, I did believe it? The user doesn't say, but typically in lottery cases, you believe it.

        So options:

          At the time I asserted, was it proper?
            A. Yes, because it was very likely true and I had good evidence. (JBN, AN, BN, RN)
            B. No, because you cannot know such things until the draw. (KN)
            C. No, because it turned out to be false. (TN)

        But TN would say: at the time, it was true or false. If it was true, it would be proper; if false, improper. Since it turned out false, it was improper. But at the time, we don't know. So TN would have to say: it was improper because it was false (even though we didn't know that then).

        So we can ask after the fact:

          Was the assertion improper?
            A. Yes, because it was false. (TN)
            B. Yes, because I didn't know it at the time. (KN)
            C. No, because at the time I had good evidence and I believed it. (JBN, BN, AN, RN)

        So this question distinguishes TN and KN from the others.

     Question 5: Doctor and child vs. parent.
        Scenario: A doctor tells a frightened child something true in a calming tone. Same sentence to the child's specialist parent who already has better evidence.

        Compare the two assertions.

        Options:
          A. Both are proper because the statement is true. (TN)
          B. Both are proper because the doctor knows it. (KN, JBN, BN if she believes, AN if she can back it up)
          C. The one to the child is proper because it serves a purpose (calming), but the one to the parent might be improper because the parent already knows more. (HN)
          D. The one to the parent is improper because the doctor doesn't have evidence as good as the parent, so she isn't in a position to assert it to the parent. (HN or a variant)

        We can ask: Is the assertion to the parent improper in a way that the one to the child is not?
          A. No, both are fine. (all except HN)
          B. Yes, because the parent has higher expectations of evidence. (HN)

     Question 6: I say p which I knew at utterance, but by uptake it's false.
        Scenario: I say p at time t0, and I know p at t0. By the time you hear it at t1, p is false.

        Question: Is the assertion defective? And does it depend on whether the norm is indexed to utterance or uptake?

        Options:
          A. It is not defective because it was true when I said it. (TN if indexed to utterance, KN, JBN, BN, AN, RN)
          B. It is defective because it is false when heard. (TN if indexed to uptake)
          C. It is defective because at the time of hearing, I no longer know it? But I knew at utterance. (KN would typically index to utterance)

        We can ask: Should the norm be indexed to the time of utterance or the time of hearing?
          A. Utterance: then it was proper. (most norms)
          B. Hearing: then it might be improper if false at hearing. (TN might allow this indexing? Or HN might say that for the audience at hearing, it's important that it's true then? But not clear)

        This might be mainly about TN.

     Question 7: "I think it's going to rain, but I have no idea."
        Scenario: Someone says that.

        Question: Is that an assertion? If it is a bad one, what makes it bad?

        Options:
          A. It is an assertion and it is bad because it is insincere: you say you think it will rain but you have no idea, so you don't really think it. (BN)
          B. It is an assertion and it is bad because you don't know that it will rain. (KN)
          C. It is not an assertion because it is hedged ("I think") and then undercut. (might be a view that it's not a full assertion)
          D. It is an assertion and it is bad because you have no evidence. (JBN, RN)
          E. It is an assertion and it is bad because you can't back it up. (AN)

        But note: the person is asserting that they think it will rain, not that it will rain. And they have no idea, so they are saying that they think it will rain while having no idea, which is insincere because if they have no idea, they shouldn't think it will rain.

        So the content is: I think it's going to rain.

        And then they say they have no idea, which suggests they don't have an opinion, contradicting the first part.

        So BN: they are asserting that they believe it will rain, but they don't believe it (because they have no idea), so it's insincere.

        Other norms might not care because the proposition "I think it's going to rain" might be true or false. If they have no idea, then they don't think it will rain, so the proposition is false. So TN would say it's defective because false.

        But the user's question is about which norm is at work.

        We can ask: What is the main flaw?
          A. The speaker doesn't believe that it will rain, so the assertion of "it will rain" is insincere. -> but the assertion is "I think", not "it will rain". So this is not accurate.
          B. The speaker doesn't believe that she thinks it will rain? -> that's what she is asserting.

        Let me rephrase the case: The assertion is "I think it's going to rain", but then they add "but I have no idea", which suggests that they don't actually think that. So the assertion of "I think" is insincere.

        So:

          BN: because the speaker doesn't believe that she thinks it will rain.
          TN: because the proposition "I think it's going to rain" is false (if she has no idea, then she doesn't think that).
          KN: because she doesn't know that she thinks it will rain (but she might know that she doesn't think that).
          JBN: if she has no evidence for the proposition that she thinks it will rain, then it's not justified.

        But the proposition is about her own mental state, so typically you have privileged access.

        This case is messy.

     Given the complexity, we will design 9 questions, but we might have to revise.

     We have 7 cases above, we need 2 more.

     Proposed new cases:

     Question 8: Answerability case.
        Scenario: I assert that p, and I have evidence for p, but if challenged I would not be able to provide the evidence because I am about to go into a coma.

        Question: Is this assertion proper?
          A. Yes, because I have evidence. (JBN, RN, KN if it counts as knowledge)
          B. No, because I won't be able to back it up if challenged. (AN)

     Question 9: Evidence without belief.
        Scenario: I have strong evidence that the suspect is guilty, but I don't believe it because of a personal bias. I assert "the suspect is guilty".

        Question: Is this assertion proper?
          A. Yes, because the evidence is strong. (RN)
          B. No, because I don't believe it. (BN, JBN might say it's not justified if justification requires belief)
          C. No, because I don't know it. (KN)
          D. No, because it might be false and I'm not in a position to know. (KN)

        This can help isolate RN.

