answer: |-
  ### What's Your Norm of Assertion? Quiz  
  **Instructions:** For each scenario, select the option that best reflects your judgment. There are no trick questions; go with your gut. Answer all 9 questions.

  1. **Hospital Committee Vote**  
     A committee votes 3–2 to announce, "The outbreak is under control." The dissenters *know* it isn’t; the majority only believed it because they wanted to. The outbreak was *not* under control.  
     Was the committee’s assertion improper?  
     - (a) **Yes, because the statement was false.**  
     - (b) **Yes, because the majority lacked good evidence.**  
     - (c) **No, because the majority sincerely believed it.**  
     - (d) **It depends on who the audience was (e.g., public vs. experts).**  

  2. **Text Support Bot**  
     A bot outputs, "Your refund was issued on the 3rd." This is true and from a reliable system, but the bot has no beliefs or awareness.  
     Is this assertion defective, or not an assertion at all?  
     - (a) **Defective: it lacks belief/knowledge.**  
     - (b) **Not defective: it’s true and reliable.**  
     - (c) **Not an assertion at all (just outputting data).**  

  3. **Train Time Mistranslation**  
     I know the train leaves at 9:00. I try to tell you in a language I speak poorly, but my sentence means, "It leaves at 6:00."  
     Which proposition did I assert, and was it improper?  
     - (a) **I asserted the 9:00 departure; not improper (I knew the truth).**  
     - (b) **I asserted the 6:00 departure; improper (it was false).**  
     - (c) **I asserted the 6:00 departure; improper (I couldn’t defend it).**  

  4. **Lottery Ticket**  
     Before a draw, I say, "Your ticket lost," based purely on odds (1 in a million chance to win). It won.  
     Was my initial assertion improper?  
     - (a) **Yes, because it was false.**  
     - (b) **Yes, because I couldn’t know it.**  
     - (c) **No, it was reasonable given the odds.**  

  5. **Doctor to Child vs. Parent**  
     A doctor tells a frightened child, "You’ll be fine," using a calming tone. She knows this is true. She says the same to the child’s parent, a specialist who has better evidence than her.  
     Is the assertion to the parent improper in a way the child’s wasn’t?  
     - (a) **No, both are fine (same content/speaker).**  
     - (b) **Yes, the parent deserves higher evidence.**  
     - (c) **Yes, the parent might challenge her.**  

  6. **Changing Facts Mid-Utterance**  
     I say, "The store is open," knowing it’s true. By the time you hear me, it has closed.  
     Is this assertion defective?  
     - (a) **No, it was true when I spoke.**  
     - (b) **Yes, it’s false when heard.**  
     - (c) **Only if you rely on it and it misleads you.**  

  7. **Hedged Assertion**  
     Someone says, "I think it’s going to rain, but I have no idea."  
     Is this assertion improper? Why?  
     - (a) **Yes, it’s insincere (they don’t really think it).**  
     - (b) **Yes, they lack evidence/knowledge.**  
     - (c) **No, hedging makes it acceptable.**  

  8. **Coma Evidence**  
     I assert, "The suspect fled north," with strong evidence. But I’ll be in a coma if challenged and can’t defend it.  
     Is this proper?  
     - (a) **Yes, I have the evidence now.**  
     - (b) **No, I can’t back it up when needed.**  

  9. **Biased Evidence**  
     I have overwhelming evidence that a suspect is guilty, but I don’t believe it due to personal bias. I assert, "They’re guilty."  
     Is this proper?  
     - (a) **Yes, the evidence is solid.**  
     - (b) **No, I lack belief in it.**  
     - (c) **No, I might be wrong without belief.**  

  ---

  ### Scoring Key  
  **How to score:** Tally selections for each letter (a, b, c, d) across all questions. Use the decision tree below to find your norm. Match your *pattern*, not majority votes.  
  **Time:** <10 minutes with a pint.  

  #### Logical Space Tree  
  The tree branches on two core distinctions (see note on gaps):  
  1. **Fault type:** Is a bad assertion an *epistemic failing* (speaker’s link to truth is weak) or an *infelicity* (like insincere promises)?  
  2. **Audience dependence:** Does the norm shift with who’s listening?  

  | Branch 1: Fault type → | Epistemic failing | Infelicity | Truth-centric |
  |------------------------|-------------------|------------|--------------|
  | **Branch 2: Audience-dependent?** | | | |
  | → **Yes** | Hearer-sensitive | *Gap: Unattractive* | *Gap: Incoherent* |
  | → **No** | Proceed to Branch 3 | Belief norm | Truth norm |
  | **Branch 3: Epistemic condition →** | Knowledge | Answerability | Reasonableness |  
  | **Leaves** | Knowledge norm | Answerability norm | Reasonableness norm |  

  - **Cells allowed:** 7 (2 × 2 × 2, minus gaps).  
  - **Empty cells:**  
    - *Hearer-sensitive + Infelicity*: Unattractive (no one defends infelicity as audience-dependent).  
    - *Hearer-sensitive + Truth-centric*: Incoherent (truth is objective; can’t shift with audience).  
  - **Combinations:** 8 possible, 7 filled.  

  #### Mapping Answers to Leaves  
  Use your dominant pattern to find your leaf:  

  1. **Knowledge norm** (KN):  
     - Fault = epistemic; audience = irrelevant; requires *knowing* p.  
     - **Key pattern:** 1(b), 2(a), 4(b), 5(a), 6(a), 7(b), 8(a), 9(c).  

  2. **Truth norm** (TN):  
     - Fault = p being false; audience = irrelevant.  
     - **Key pattern:** 1(a), 2(b), 3(b), 4(a), 5(a), 6(b), 7(b), 8(a).  

  3. **Belief norm** (BN):  
     - Fault = infelicity (insincerity); audience = irrelevant; requires *believing* p.  
     - **Key pattern:** 1(c), 2(a), 3(a), 4(c), 5(a), 6(a), 7(a), 9(b).  

  4. **Reasonableness norm** (RN):  
     - Fault = epistemic; audience = irrelevant; requires *sufficient evidence* for p.  
     - **Key pattern:** 1(b), 2(b), 4(c), 5(a), 6(a), 7(b), 8(a), 9(a).  

  5. **Answerability norm** (AN):  
     - Fault = epistemic; audience = irrelevant; requires *ability to defend* p if challenged.  
     - **Key pattern:** 1(b), 2(c), 3(c), 4(c), 5(c), 6(c), 7(b), 8(b).  

  6. **Hearer-sensitive norm** (HN):  
     - Fault = epistemic; audience = *relevant*; requires *adequate evidence for the listener*.  
     - **Key pattern:** 1(d), 3(c), 5(b), 6(c), 7(b), 8(b), 9(a).  

  7. **Best fit for mixed patterns:**  
     - Mostly **KN/RN/AN** but audience-dependent answers? → **HN**.  
     - **BN + evidence-heavy**? → **RN**.  
     - **TN + epistemic answers**? → **KN** (truth is often a byproduct of knowledge).  

  ---

  ### Limitations & Misfires  
  - **Indistinguishable pair:** **KN vs. RN** (both demand strong epistemic positioning). They only split on lottery cases (Q4) and bot beliefs (Q2). If someone waffles there, the instrument misfires.  
  - **Overworked question:** **Q3 (mistranslation)** does triple-duty: truth, knowledge, and answerability. A single ambiguous answer here skews results.  
  - **Rewrite trigger:** If >2 people insist assertion has *no constitutive norm* (e.g., "It’s just pragmatics!"), the framing fails. This suggests norms are context-bound, not universal.  
  - **Hobbyhorse risk:** If HN scores high but rationale is "doctors should be polite to experts," your hearer-sensitivity is likely *politeness*, not assertion-norm confusion.  
  - **Least confident mapping:** **Q7 (hedged assertion)**. Answers may conflate asserting *p* ("it will rain") vs. asserting *about belief* ("I think..."). This might measure norms of *indirect* assertion.  
  - **New case needed:** To split KN/RN, add: *"I assert p after dreaming it; it’s true and I’m reliable, but I have no conscious evidence."* KN says improper (no justification); RN says proper (reliability = warrant).
