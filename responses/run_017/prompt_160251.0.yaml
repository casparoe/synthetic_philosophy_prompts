answer: |-
  ### Decision Tree: Probability in No-Collapse Quantum Mechanics

  **Starting Commitment:** There is no collapse. The post-measurement quantum state contains multiple outcomes (branches) with sharply unequal squared amplitudes.

  ---

  **Q1 (Betting on Negligible Amplitude):**  
  You are offered a bet costing $1,000. If a specific branch (squared amplitude = 10⁻⁹) occurs, you gain omnipotence. Otherwise, you lose the $1,000. Is it rational to pay the cost to place this bet?  
  - **Yes → Q2**  
  - **No → Q3**  

  **Q2 (Value of High-Cost Survival):**  
  In a branch with squared amplitude 0.3, you survive a procedure but suffer excruciating pain and total cognitive impairment for one year before fully recovering. Should this branch’s weight fully inform your pre-procedure dread/avoidance?  
  - **Yes → Leaf 1: Everettian Rationalism (Deutsch-Wallace)**  
  - **No → Leaf 2: Amplitude-Squared Functionalism**  

  **Q3 (Indifference to Future Branches):**  
  An agent knows they will permanently cease to care about *all* future outcomes at midnight (e.g., via irreversible apathy). At 11:59 PM, they face a quantum event creating branches of unequal amplitude. Should they apportion their expectations about post-midnight outcomes using squared amplitude?  
  - **Yes → Leaf 3: Measure-Based Realism (Vaidman, Carroll)**  
  - **No → Q4**  

  **Q4 (What Matters in Splitting):**  
  Your current branch (amplitude |ψ|) will soon split into two successor branches:  
  - Branch A: Amplitude 0.99|ψ|, containing your cognitive continuation.  
  - Branch B: Amplitude 0.01|ψ|, containing a distinct agent with your memories.  
  Does "what matters" for your present self depend solely on |ψ|², or on the downstream branch measure (0.99)?  
  - **Solely on |ψ|² → Leaf 4: Branchal Solipsism (unnamed)**  
  - **On downstream measure → Q5**  

  **Q5 (Continuous Outcomes):**  
  Amplitude is spread continuously (e.g., position measurement). Rational credence in outcome sets must be defined without "counting" branches. Can squared amplitude density *alone* ground these credences?  
  - **Yes → Leaf 5: Primitive Ontic Weight (Greaves-Myrvold, "Epistemic Separability Principle")**  
  - **No → Leaf 6: Indeterminate Credence (unnamed)**  

  ---

  **Leaf Positions:**

  1.  **Everettian Rationalism (Deutsch-Wallace):**  
      *Squared amplitude is the rational degree of caring/cardinal utility, recovered from decision-theoretic axioms.*  
      **Awkward Commitment:** Must derive probabilistic norms from non-probabilistic axioms (e.g., indifference, separability) in a deterministic multiverse.  

  2.  **Amplitude-Squared Functionalism:**  
      *Squared amplitude tracks subjective probability because it quantifies the "presence" of a functionally defined agent-moment.*  
      **Awkward Commitment:** Denies that negligible-amplitude branches (e.g., Q1) warrant any practical consideration, risking incoherence with long-term rationality.  

  3.  **Measure-Based Realism (Vaidman, Carroll):**  
      *Squared amplitude is a physical measure of "reality" or "existence" of branches; rational credence proportionally tracks this measure.*  
      **Awkward Commitment:** Commits to normative force from a physical quantity ("ought" from "is") and must explain why non-caring agents (Q3) should heed it.  

  4.  **Branchal Solipsism (unnamed - unattractive):**  
      *Only the amplitude of your current branch matters; downstream branching is irrelevant to current identity/concerns.*  
      **Awkward Commitment:** Implies pre-splitting agents (Q4) should be indifferent to imminent branchings, making quantum outcomes irrelevant to action.  
      *Status:* Unoccupied due to unattractiveness (undermines predictive utility of QM).  

  5.  **Primitive Ontic Weight (Greaves-Myrvold):**  
      *Squared amplitude is a fundamental physical weight ("caring measure") not reducible to probability, but agents should care proportionally to it.*  
      **Awkward Commitment:** Introduces a non-probabilistic, agent-centered primitive "should" unexplained by physics or decision theory.  

  6.  **Indeterminate Credence (unnamed - unexplored):**  
      *No unique rational credence is defined across branches; probabilistic talk is unjustified without collapse/hidden variables.*  
      **Awkward Commitment:** Accepts that quantum theory lacks probabilities, weakening its empirical adequacy.  
      *Status:* Unoccupied but coherent; unexplored due to focus on salvaging probability.  

  **Rejected Starting Commitment Options (Not Leaves):**  
  - **Restore Collapse:** Rejects no-collapse commitment (e.g., GRW). Awkward: Violates unitarity/reversibility.  
  - **Add Hidden Variables:** Rejects pure wavefunction ontology (e.g., Bohm). Awkward: Nonlocality or contrived dynamics.  
  - **Accept No Probabilities:** Rejects the project. Awkward: Theory cannot predict frequencies.  

  **Note:** Q1-Q5 cannot separate **Everettian Rationalism** (Leaf 1) from **Amplitude-Squared Functionalism** (Leaf 2) in all aspects. Both say "No" to Q1 but diverge on *why* (axiomatic rationality vs. agent-moment ontology).
