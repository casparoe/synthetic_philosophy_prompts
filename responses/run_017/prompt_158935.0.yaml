answer: |-
  ### Comparison of Bridge and Conversion Strategies

  The **bridge strategy** extends the pond intuition—that one must prevent great harm at trivial cost—to distant strangers through strict parity reasoning, dismissing physical distance, scale, coordination, and institutional mediation as morally irrelevant. The duty is grounded solely in capacity and stakes, with no distinction between positive and negative duties. The **conversion strategy** reframes the duty as a negative obligation: affluent agents are not bystanders but contributors to harmful institutional structures, so their duty stems from ceasing complicity and repairing harm. Both reach demanding conclusions but differ fundamentally in justification, scope, and application. Below, I evaluate them using the three test cases, addressing demandingness, duty content, epistemic burden, and case-specific guidance.

  #### **1. Demandingness and Stopping Points**
  - **Bridge**: The agent must aid until further transfers would sacrifice something "of comparable moral significance" to the harm averted (e.g., giving until marginal dollars save less welfare than they would provide if kept). This creates extreme demands: for a wealthy agent, it may require near-total impoverishment. The stopping point is agent-relative but objectively calculable (based on marginal utility).  
    *Plausibility*: Directionally plausible in stressing capacity, but implausibly extreme in ignoring the agent’s causal role. It demands identical sacrifice from a faultless passerby and a culpable contributor.  

  - **Conversion**: Demandingness arises from the *extent of complicity*. The agent must cease contributing to harmful institutions (e.g., divest from exploitative supply chains) and compensate for past harm until the victims are made whole. The stopping point is when the agent’s causal impact is neutralized.  
    *Plausibility*: Plausible in linking duty to responsibility, but underspecified. If complicity is systemic (e.g., paying taxes in a harmful state), demands could rival the bridge strategy. Yet it may excuse minimally involved agents (e.g., hermits).  

  #### **2. Direction and Content of Duty**
  - **Bridge**: The duty is owed to *anyone* facing preventable harm, discharged by effective transfers (e.g., donating to proven charities). It is impersonal and universal: the drowning child and a distant famine victim are morally identical.  
  - **Conversion**: The duty is owed *specifically to those harmed by the systems the agent benefits from*. Discharge requires dismantling complicity (e.g., activism, policy reform) and targeted repair (e.g., reparations), not just generic aid.  

  #### **3. Epistemic Burden**
  - **Bridge**: Low burden. Agents need only know that aid is effective and low-cost (e.g., "$200 saves a life"). Uncertainty about impact (e.g., charity inefficiency) might weaken demands but doesn’t alter the principle.  
  - **Conversion**: High burden. Agents must trace their institutional entanglement, identify victims of those systems, and quantify their contribution. Without this knowledge (e.g., in complex economies), the duty becomes nebulous.  

  #### **4. Guidance in the Test Cases**
  **Case One: Unattributable Peril**  
  - *Bridge*: You must save one child (any one), as the stakes are identical regardless of fault. Failing to save *any* child is wrong, as the cost is trivial.  
  - *Conversion*: Struggles severely. You know you harmed one child but cannot identify whom. If the duty is only to *your* victim, saving any child might not discharge it—yet saving none is grotesque. Conversion must either (a) borrow bridge-style reasoning (duty arises from capacity alone, so save any child) or (b) insist you have *no duty* here, which is implausible. Borrowing undermines its distinctness, as it abandons the necessity of tracing harm.  

  **Case Two: Clean Hands**  
  - *Bridge*: Aida must save the child for $200. Her isolation is irrelevant; capacity + stakes create the duty.  
  - *Conversion*: Aida has no complicity, so no reparative duty. She *might* have a minimal rescue duty (like a pond passerby), but the demanding transfer ($200) isn’t required. This preserves the intuition that uninvolved agents are less bound, but clashes with the bridge view that capacity alone suffices.  

  **Case Three: Overdetermined Pond**  
  - *Bridge*: Each dropper must save the child. Their drop’s causal irrelevance doesn’t matter; they can prevent harm at low cost. Passersby have the same duty.  
  - *Conversion*: Explains why droppers are especially bound: they are *contributors* to harm, even if overdetermined. Each must save the child *and* cease contributing (e.g., stop adding drops). Passersby lack this complicity, so their duty is weaker (rescue only if convenient). The bridge strategy cannot explain this differential intuition.  

  ### **Verdict and Objections**
  **Verdict: Hybrid (Conversion grounding, Bridge guidance)**  
  The conversion strategy better grounds the duty by tying it to complicity, which aligns with intuitions about fairness and responsibility (e.g., droppers vs. passersby in Case Three, or Aida’s lesser duty in Case Two). However, it fails in cases of unattributable peril (Case One), where causal links are obscured. Here, the bridge strategy’s focus on capacity provides necessary fallback guidance. A hybrid approach uses conversion for the core justification—demanding duties arise from contributing to harm—but invokes bridge-style capacity-based duties when complicity is untraceable. This retains conversion’s emphasis on systemic responsibility while avoiding its epistemic gaps.  

  **Strongest Objection**: *The hybrid is ad hoc. If conversion’s grounding is sound, why default to bridge in hard cases? This privileges convenience over principle.*  
  **Reply**: The hybrid isn’t arbitrary; it reflects moral priorities. Complicity *intensifies* duties (per conversion), but when complicity is provable yet untargetable (Case One), the duty to aid persists based on capacity (per bridge). We see this in law: culpable actors must compensate victims, but if victims are unidentifiable, they may still owe society (e.g., environmental fines). The bridge element acts as a proxy for reparative duty when direct repair is impossible.  

  **Weighting the Cases**: Case One is most decisive. Conversion’s inability to handle unattributable peril without borrowing from bridge reveals a fatal flaw in pure conversion, while bridge’s failure in Cases Two and Three shows its underdemandingness toward the uninvolved and overdemandingness toward the uninvolved. A hybrid avoids both pitfalls.  

  ---  
  Verdict: \answer{hybrid}
