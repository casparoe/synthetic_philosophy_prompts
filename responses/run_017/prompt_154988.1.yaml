prompt: |-
  I direct data engineering for a regional health system, and my team owns the master patient index. Several hundred times a week an analyst faces the same decision: two records arrive in the merge queue, and someone has to rule that they denote the same patient or two different patients. The stakes are real and lopsided. A false merge can attach the wrong allergy list or the wrong medication order to a patient; a false split buries half a history and, since we joined the state health information exchange last year, can silently break a record link across hospitals. The analysts are not philosophers, they have roughly ten minutes per queue item, their decisions have to be auditable after the fact, and anything touching a merge that has already been used in a clinical order must be signed off by a nurse informaticist. So whatever I hand them has to be short, defensible line by line, and honest about where it gives up.

  I would like the metaphysics of identity turned into that instrument. My rough sense of the relevant material, which I would like you to correct where I have it wrong before you build anything on it: Leibniz's Law has two directions that pull apart badly here. The indiscernibility of the identical gives me a one-way test only — a hard property conflict (incompatible sex chromosomes, incompatible blood types, a date of birth inconsistent with the age on the record) decisively refutes identity, while no amount of field agreement can establish it. The identity of indiscernibles, which is what a probabilistic matcher implicitly assumes whenever it merges on agreement, looks to be the weak direction: Black's example of a universe containing nothing but two exactly similar spheres, each equidistant from the other, is supposed to show that total agreement across all qualitative and relational properties is still compatible with their being two, from which I take it that no similarity threshold can be constitutive of identity and that the residual move available to a defender of the principle — appealing to something like a primitive thisness, a property of being this very sphere — names something no matcher can store as a field. There is also, I think, a distinction I am currently conflating: the question whether two records are about the same patient is an identity question, while the question my queue actually asks is an evidential one, namely whether we have warrant to treat them as the same given our error costs.

  Please write the decision procedure my analysts can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure terminates in a hard no, and where it has to hand the decision to a person because the question is one of stipulation or values rather than evidence — in particular the moment, if there is one, at which an enterprise identifier has to be assigned by convention at an enrollment event rather than discovered by comparison. Tell me which distinctions from the metaphysics have to survive the simplification and which can be dropped without loss, and say plainly where a ten-minute procedure will misfire. I would also value your view on one thing I am unsure of: whether identity claims in the index need a sortal supplied — the same patient, the same account, the same person under a family policy — and whether merging under one of these licenses merging under another.

  Then run it on three cases. First, two records with the same name, one carrying a generational suffix the other dropped, the same date of birth, addresses about two miles apart, one flagged as a newborn male and one as a thirty-four-year-old male. Second, two records agreeing on every stored field, created four hundred milliseconds apart by the same registration clerk during a downtime-recovery replay. Third, adult monozygotic twins who share a date of birth, an address, and a family-level member identifier on the exchange, so that no anchor identifier distinguishes them. My team currently merges the second on score and has no settled policy on the third; I expect the procedure to tell me something I do not want to hear about at least one of these, and I would rather hear it now than after an adverse event. Finish by stating what the procedure cannot do at all.
reasoning: |-
  We are designing a decision procedure for merging patient records. The procedure must be:
  - Short and executable in about 10 minutes per queue item.
  - Defensible and auditable.
  - Honest about its limitations.

  Key principles from the problem statement:
  1. A hard property conflict (e.g., incompatible sex, blood type, or date of birth inconsistent with age) decisively refutes identity (Leibniz's Law: indiscernibility of identicals).
  2. The identity of indiscernibles is not a reliable principle because two distinct individuals can have identical properties (like Black's spheres). Therefore, high similarity does not guarantee identity.
  3. We are making an evidential decision: whether we have sufficient warrant to treat two records as the same, considering the costs of false merges and false splits.

  The procedure must also account for:
  - The need for auditable decisions.
  - The requirement that any merge that has been used in a clinical order must be signed off by a nurse informaticist.
  - The moment when an enterprise identifier is assigned by convention (e.g., at enrollment) rather than discovered by comparison.

  Distinctions from metaphysics that must survive:
  - The one-way test from Leibniz's Law (hard conflicts refute identity) is essential and must be used.
  - The rejection of the identity of indiscernibles as a guarantee: we cannot merge solely based on high similarity without considering the possibility of distinct individuals with identical properties.

  Distinctions that can be dropped without loss:
  - Deep metaphysical discussions about primitive thisness (haecceity) are not practical for our procedure.

  Sortals (concepts under which we consider identity) are important. The index must specify the sortal: "same patient" (which is a biological person) vs. "same account" (which might be an administrative entity). Merging under one sortal (e.g., same account) does not necessarily imply merging under another (e.g., same patient). However, in the context of a Master Patient Index (MPI), the primary sortal is the biological patient (person). The family policy or account may be secondary and handled by linking mechanisms.

  The decision procedure:

  We break the procedure into steps. Each step either:
  - Leads to an immediate decision (merge, no merge, or send to human).
  - Or accumulates evidence and moves to the next step.

  The steps:

  1. **Check for hard conflicts (Leibniz's Law):**
     - Compare the fields that are known to be immutable or highly reliable and for which a conflict is definitive of non-identity.
     - Examples: 
       - Incompatible sex (e.g., one record says male, the other female) -> **hard no**.
       - Incompatible blood type (if both are present and conflict) -> **hard no**.
       - Date of birth conflict that cannot be explained (e.g., two different dates that are not a typo and are inconsistent with the patient's age in other records) -> **hard no**.
       - Other hard conflicts as defined by the organization (e.g., SSN conflict if SSN is present and verified in both, and they are different; but note that SSN can be mistyped or shared fraudulently, so it might not be absolute without verification).

     - If a hard conflict is found: **Terminate with a decision of "Do Not Merge"**. This decision is auditable and defensible.

  2. **Check for an existing enterprise identifier (e.g., a national health ID, or a previously assigned internal master patient ID) that matches in both records:**
     - If both records have the same enterprise identifier that is known to be unique and assigned to one patient, then we have a strong indication that they are the same. However, we must check for the possibility of identifier misuse (e.g., a duplicate assignment or a stolen identity). 
     - If the identifier is present and matches, and there are no hard conflicts, then **merge** unless there is a red flag (e.g., the identifier is known to have been compromised, or there is a hard conflict that we might have missed). 
     - Note: The enterprise identifier is assigned by convention (at enrollment) and is not discovered by comparison. This step is about using that convention.

  3. **Check for a "golden" event that establishes identity by convention:**
     - An example: a patient enrollment event that generated an enterprise identifier. If one record is from such an event and the other is not, but the non-enrollment record has the same identifier, then it's a match.
     - If the records are both linked to such an event and share the same identifier, then merge. 
     - If one record has an identifier and the other does not, but the other record has a verified identity that matches the one with the identifier (by comparing other fields without conflict), then we may merge. But note: we must be cautious about assigning an identifier to a record that doesn't have one without a proper event. This step might require human review if the linkage is not clear.

  4. **Check for a high-risk situation:**
     - If either record has been used in a clinical order (and therefore a merge would have clinical consequences) and the merge is being considered, then regardless of the evidence, the decision must be **sent to a nurse informaticist** for sign-off.

  5. **Evaluate the evidence for and against identity:**
     - If we have passed steps 1-3 without a hard no and without an automatic merge, we now consider the evidence.
