       - In the case of twins or other known high-similarity groups, we may need human review to consider additional evidence (e.g., a photo, or a phone call to the patient).

     - The human reviewer (or a nurse if required) must then make a decision based on the evidence and the organization's policy. They might also decide to mark the records for a manual resolution process (e.g., contacting the patient).

  7. **Termination in a hard no:**
     - As stated in step 1: hard conflicts lead to a hard no.

  8. **The assignment of an enterprise identifier:**
     - This is done by convention at an enrollment event. The procedure cannot assign a new enterprise identifier by comparing two records. If two records are merged, they will share the same identifier that was assigned at enrollment (if one exists) or a new one will be assigned at the time of the merge? But note: the merge itself might be considered an enrollment event? This is a policy decision.
