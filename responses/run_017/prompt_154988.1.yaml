     - **Step 5b: Consider the possibility of distinct individuals with high similarity** (like twins). We must look for any distinguishing features. If none are found, we cannot merge without additional evidence.

     - **Step 5c: If there is no hard conflict but the evidence is ambiguous, we must default to not merging to avoid false merges, unless there is a compelling reason to merge (which would be rare).**

     - **Step 5d: If we are in a situation where the records are highly similar and we have no hard conflict, but we cannot rule out the possibility of two distinct individuals (like twins) and there is no unique identifier, then we do not merge. We may mark the records for future resolution (e.g., by collecting more data) or for human review to consider the context.**

  6. **Human review step:**
     - The procedure must hand over to a human in the following cases:
       - If there is a hard conflict but it might be due to a data entry error (e.g., a typo in date of birth that conflicts with age, but the age matches the other record) and the conflict is in a field that is not absolutely immutable? (But note: we must be cautious. Hard conflicts in immutable fields cannot be overridden by human without evidence of error.)
