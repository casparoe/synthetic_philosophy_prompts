     - **Negative indicators** (but not hard conflicts that we already checked for):
       - Conflicting addresses (unless they are known to be current and previous, or typo-correctable).
       - Conflicting phone numbers or email addresses.

     - **Contextual factors**:
       - Temporal proximity of record creation: two records created very close in time (like the 400ms apart example) might be duplicates, but we must be cautious because they could be two distinct patients registered in quick succession.

     We do not set a fixed similarity threshold. Instead, we consider:

     - The likelihood of two distinct patients having this set of agreements by chance (this is the probabilistic matcher's job, but we are now in a human review step).
     - The source reliability: are the fields coming from a trusted source?

     However, since we are designing a procedure for analysts, we need a structured approach:

