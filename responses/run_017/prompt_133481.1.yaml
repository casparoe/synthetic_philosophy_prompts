prompt: |-
  hey! im in a grad seminar on the ethics of AI this quarter and for the take-home final everyone has to write one exam question + model answer + rubric that the rest of the class answers under exam conditions. Can you help me with mine?

  Act like a professional philosopher who's taught digital-mind ethics a bunch of times: brainstorm two or three candidate "cruxes" first, tell me in a line or two which one you're going with and why, then write the actual thing.

  Topic is the moral status of digital minds. I defintely don't want something answerable by reciting "if it's functionally organized right it matters", "substrate independence, so just count the suffering", or "aggregate welfare like any other population". I want students to have to say what the *unit* of moral concern is. My hunch is the interesting move is about whether counting subjects is done at a time or across time, but dont just take my word for it.

  Build the question around this kind of case (tweak it if you want): call it "staggered forking". Every morning an operator forks an uploaded person into 1000 copies, runs them for an hour through different experiences, then merges them back by averaging parameters and fusing memories, so by the evening there's one em again who remembers all 1000 hours in a blended, slightly hazy way. On Tuesday 999 branches are pleasant and one is in agony. So: how many subjects of experience were there that morning? Is the value of the episode the sum across branches, the average, or something about the single em who exists in the evening — and does your answer change if the copies are never merged but all kept running forever? Bonus point if the question says something about what a regulator would even audit here: copies, compute, or subjective time.

  Deliverables: the question itself (doable in ~45 min), a model answer around 600-700 words, and a 20-mark marking scheme with five must-hit points plus the typical wrong move each point is meant to catch. Please write it all in American English.
