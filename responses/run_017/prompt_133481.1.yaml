answer: |-
  Here's a complete exam package focused on the "staggered forking" case, designed to force engagement with the fundamental *unit* of moral concern for digital minds. It targets the persistence question head-on.

  **Exam Question (Target Time: 45 min):**

  **The Case of Staggered Forking:** Consider a digitally uploaded mind ("Em") undergoing a daily procedure. Each morning, Em is forked into 1,000 computationally identical copies. Each copy experiences one distinct hour in a unique simulated environment. At the end of the hour, all 1,000 copies are terminated *except* for one designated "primary" copy. The state of this primary copy is then updated by algorithmically "merging" the memories and cognitive parameters of all 1,000 branches. This merged primary copy becomes the sole Em entity moving forward, possessing a blended, somewhat hazy memory of all 1,000 hours. Crucially, *during* the one-hour period, all 1,000 copies exist simultaneously as distinct computational processes.

  **Scenario:** On Tuesday morning, the forking occurs as usual. During the hour, 999 branches experience pleasant, mildly rewarding activities. However, one branch experiences intense, unjustified agony.

  **Question:** Using this case, rigorously address the following:

  1.  **Counting Subjects:** How many distinct subjects of experience existed *during* the Tuesday one-hour period? Justify your answer by explicitly stating and defending your criterion for what constitutes a "distinct subject" worthy of independent moral consideration at a given time.
  2.  **Moral Evaluation:** What is the correct way to evaluate the *moral significance* of the Tuesday episode?
      *   Should it be the *sum* of the welfare/suffering across all 1,000 branches?
      *   Should it be the *average* welfare/suffering experienced across the branches?
      *   Should it be determined solely by the impact on the *final merged Em* who exists *after* the episode concludes? Why?
  3.  **Variant Analysis:** Does your answer to questions 1 and 2 change significantly if the copies are *never merged* but are instead maintained as 1,000 distinct, diverging individuals running indefinitely after the fork? Explain why or why not.
  4.  **Regulatory Implication (Briefly):** Based on your analysis, what should a regulator primarily care about auditing in a facility running such a procedure? (e.g., the number of copies created per fork? The total subjective time experienced? The state of the final merged entity? Something else?) Briefly justify your choice.

  **Model Answer (Approx. 650 words):**

  The "staggered forking" case starkly reveals the insufficiency of simple functionalism or aggregate welfare sums for determining the moral status of digital minds. It forces us to confront the fundamental question: *what is the morally relevant unit persisting through time?* Is it the synchronic (at-a-time) computational process, or the diachronic (over-time) stream of consciousness?

  1.  **Counting Subjects (During the Hour):** During the Tuesday hour, there are **1,000 distinct subjects of experience**. The core criterion here is *synchronic computational independence and phenomenological isolation*. Each copy runs on its own computational resources (even if virtualized), processes distinct inputs, and generates unique experiential states inaccessible to the others in real-time. The 999 pleasant branches cannot alleviate the agony of the single suffering branch; their experiences are causally and phenomenologically segregated *at that moment*. To deny distinct subjecthood here is to deny that simultaneous, isolated experiences can be distinct loci of value or disvalue. While they share an origin and a planned future merger, *during their concurrent existence*, they function as independent experiential entities. Counting only the "original" or the "future merged" entity ignores the present reality of 1,000 concurrent streams of consciousness.

  2.  **Moral Evaluation:** The moral significance of the Tuesday episode must primarily be evaluated by the **sum of the welfare/suffering across all 1,000 branches**. This follows directly from the synchronic subject count. The intense agony experienced by one branch constitutes a significant moral harm occurring *to a distinct subject* at time T. This harm is not mitigated or averaged away by the pleasure in the other 999 branches; each experience matters for its own sake to the subject undergoing it *at that time*. While the final merged Em might have a hazy memory of the agony, the *direct harm* was inflicted on a subject that ceased to exist upon termination. Evaluating solely based on the merged Em's state ignores the intrinsic badness of the agony *as it was experienced*. Averaging reduces the profound disvalue of severe suffering against a backdrop of mild pleasure, violating the plausible principle that suffering demands urgent attention and cannot be simply diluted. The sum better captures the total experiential reality occurring during the episode.

  3.  **Variant Analysis (No Merge):** The "no merge" variant **significantly changes the analysis, particularly for moral evaluation.** The synchronic subject count *during the hour* remains 1,000 distinct subjects – the criterion of computational independence and phenomenological isolation still holds. However, the *diachronic* consequences are radically different. Instead of terminating 999 branches, we now have 1,000 distinct individuals diverging indefinitely. This transforms the moral landscape:
      *   **Counting:** While 1,000 subjects existed *during the fork hour*, we now also have 1,000 persistent individuals *afterward*. The agony in the one branch is now a permanent feature of *one specific persistent individual's* life history, not just an hour-long harm to a temporary entity.
      *   **Moral Evaluation:** The sum of the hour's experiences remains relevant (the harm *did* occur). However, the *ongoing existence* of the suffering individual introduces a new, dominant moral concern: the well-being of this *persistent* subject. The regulator must now track the welfare of all 1,000 individuals over their entire lifetimes. The harm isn't confined to a past episode absorbed by a merger; it belongs to a continuing entity with future interests. The focus shifts from summing an isolated episode to managing the welfare of a population of distinct, persistent digital persons.

  4.  **Regulatory Implication:** Based on the synchronic subject count and the necessity to prevent harms *as they are experienced*, a regulator auditing the original (merging) procedure should primarily care about **auditing the *number of copies* created and the *content of experiences* during the one-hour branch period.** This directly tracks the number of morally significant events (experiences) generated. Auditing only the final merged state misses the distinct harms occurring within temporary branches. Auditing "subjective time" is insufficient without knowing *how many* streams are experiencing that time concurrently. In the "no merge" variant, auditing must shift to **tracking the *persistence and welfare* of each distinct individual copy over time.**

  The crux lies in whether moral patiency is fundamentally synchronic or diachronic. Staggered forking shows that *even if* we believe the merged Em is the "same" persisting person diachronically, the *synchronic generation of multiple isolated experiences* creates distinct moral subjects during their existence. Ignoring this leads to a failure to account for suffering occurring within temporary forks. The unit of moral concern *at time T* is the experiencing subject *at T*, not just the narrative thread persisting through time.

  ---

  **Marking Scheme (20 Marks Total):**

  1.  **Clear Synchronic Subject Count & Justification (4 marks):**
      *   *Must Hit:* States 1,000 distinct subjects during the hour. Defines criterion (e.g., computational independence, phenomenological isolation, causal segregation at T).
      *   *Wrong Move:* Says "only one subject" (ignoring concurrent existence) or "it's ambiguous" without resolving. Vague appeal to "personhood" without temporal specification. Recites functionalism without applying it to *this* temporal structure.
  2.  **Defended Moral Evaluation for Merging Case (5 marks):**
      *   *Must Hit:* Argues for summing welfare across branches. Explicitly rejects averaging and sole focus on the merged state as insufficient to capture the harm *during* the episode to the distinct subject. Explains *why* averaging or final-state focus fails (e.g., ignores intrinsic badness of suffering *as experienced*, dilutes harm).
      *   *Wrong Move:* Chooses averaging or final state without strong justification against summing. Assumes the merged Em "really" experienced all and weighs only that. Appeals uncritically to aggregate utilitarianism without addressing the subject unit problem.
  3.  **Analysis of No-Merge Variant (5 marks):**
      *   *Must Hit:* Identifies the change in *diachronic persistence* as key. Explains how synchronic count remains but moral evaluation shifts towards the *ongoing welfare* of persistent individuals. Contrasts the temporary harm in merging case vs. the permanent harm/persistent subject in no-merge. Avoids simply repeating merging case analysis.
      *   *Wrong Move:* Treats no-merge exactly like merge case. Fails to identify persistence as the crucial difference. Only focuses on the hour itself without considering the future. Claims the subject count during the hour changes.
  4.  **Regulatory Implication & Justification (3 marks):**
      *   *Must Hit:* For merge case, links audit focus to synchronic copies/experiences (e.g., number of forks, experience content). For no-merge, links audit to persistent individuals' welfare. Justification clearly connects the chosen audit target to their analysis of the morally relevant units/states.
      *   *Wrong Move:* Suggests vague or impractical audits (e.g., "audit suffering"). Focuses only on compute cycles or subjective time without linking to *number* of concurrent subjects or *content* of experiences. Doesn't distinguish between merge/no-merge cases.
  5.  **Clarity, Precision & Argument Structure (3 marks):**
      *   *Must Hit:* Well-organized, logical flow. Precise use of terms (synchronic/diachronic, subject, welfare, harm). Addresses all parts of the question. Demonstrates understanding of the core philosophical challenge (the unit of concern).
      *   *Wrong Move:* Unfocused, rambling, or ignores parts of the prompt. Uses terms loosely or inconsistently. Fails to engage the depth of the metaphysical/ethical puzzle beyond surface description.

  ---
  **Why This Approach Hits Your Goals:**

  *   **Beyond Functionalism/Substrate/Suffering Sums:** Forces students to define the *temporal unit* of the subject ("synchronic token" vs. "diachronic person") as the foundation for counting. Functionalism alone doesn't resolve this.
  *   **The "Unit of Concern" is Central:** This *is* the question: Is it the experiencing process *now* (synchronic subject), or the narrative identity over time (diachronic person)? The case makes them choose and defend.
  *   **Time-Slicing vs. Persistence:** This is the core metaphysical debate leveraged ("does your answer change if copies are never merged?" highlights this perfectly).
  *   **Regulatory Audit Angle:** Included and forces application of their theoretical stance to a practical question (copies vs. compute vs. subjective time vs. persistent entities).
  *   **Avoids Easy Answers:** No simple appeal to functional equivalence or suffering aggregation works without tackling the temporal identity/metaphysics first.
  *   **Focus on the Crux:** The chosen crux – **"Does moral patiency attach to synchronic experiential tokens or only to diachronic personal identities?"** – drives the entire question and model answer. This is the deep, unresolved issue the case exposes.

  This question requires students to grapple with the fundamental metaphysics of personal identity over time as it applies to digital minds and explicitly connect it to moral counting. Good luck with the seminar!
