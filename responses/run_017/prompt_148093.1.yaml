  ### Closing Section: Diagnosis of Verbal vs. Genuine Disagreements

  **Verbal Disagreements (Resolvable by Clarification)**  
  - **Definition of "norm"**: Much tension stems from TC viewing norms as *prescriptive guides for action* (must be actionable), while NA views them as *evaluative standards* (must be ideal). This is largely terminological; both sides concede that norms serve both roles, but prioritize differently.  
  - **Role of approximation**: TC’s "replacement" and NA’s "weakening" often describe the same outcome (e.g., using variational Bayes). The dispute is semantic when both agree that ε-approximations are acceptable, but part over whether this constitutes a "new" norm.  
  - **Burden of proof for distributions**: The stalemate on burden (Crux i) is procedural, not substantive. Both grant that ecological distributions are paramount; they diverge only on default assumptions when distributions are unspecified.  

  **Genuine Disagreements (Survive Clarification)**  
  - **Normative content dependence**: Whether the *content* of norms (e.g., "maximize expected utility") must incorporate computational constraints (TC: yes, else norms are incoherent; NA: no, constraints affect compliance only). This is irreconcilable; it reflects TC’s consequentialism vs. NA’s deontology about ideals.  
  - **Meta-regress resolution**: TC’s appeal to fixed heuristics vs. NA’s appeal to ideals as attractors (Crux iv) is foundational. TC sees regress as stopped by evolution or learning, while NA sees ideals as necessary for rational criticizability—a deep divide in rationality models.  
  - **Authority of mathematical unresolvedness**: TC’s stance that normative commitments must await mathematical resolution (e.g., average-case hardness) vs. NA’s view that norms are a priori (Crux iii) is irreducible. It reflects a meta-normative split about whether "ought" implies "can compute."  

  **Least Certain Point**  
  I am least confident in my handling of **Crux (ii) (intractability’s normative role)**, specifically whether the intractability-resilient diagnostic fairly captures TC’s position. TC might argue the diagnostic presumes ecological distributions are well-defined and accessible, which they often are not (e.g., in novel environments), making "resilience" an idealized test. I extrapolated by assuming both sides accept the diagnostic as a thought experiment, but a real TC defender might reject it as underestimating the burden of distribution specification (requiring empirical work I cannot cite). Similarly, NA might object that ε-tolerance smuggles in replacement. Here, the collaboration might stall over whether "approximation" is a form of compliance or replacement—a point requiring empirical case studies to resolve.
