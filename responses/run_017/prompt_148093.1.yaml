answer: |-
  ### Agreed Claims (Both Sides Endorse)

  The following claims represent common ground, established through shared premises and mutual acknowledgment of technical and normative constraints. Each claim includes a confidence marker reflecting the mediator's assessment of its stability under adversarial scrutiny (High: robust consensus; Medium: some tension but resolvable; Low: borderline but included as both sides accept the core point).

  1. **Computational hardness is a mathematical fact with normative implications**: Exact Bayesian updating and expected utility maximization are computationally hard (NP-hard) for unrestricted graphical models, and even approximation remains hard for certain classes. This hardness constrains any normative theory aimed at real agents, as it implies that full compliance is infeasible in the worst case. (Confidence: High)  
  2. **Worst-case complexity does not determine average-case performance**: The gap between worst-case hardness and average-case tractability is substantive; many tasks that are hard in the worst case become tractable under specific instance distributions (e.g., sparse or structured inputs). Thus, hardness results alone cannot dictate whether a norm is feasible for a given agent. (Confidence: High)  
  3. **No single normative procedure dominates universally**: "No free lunch" theorems entail that no algorithm (e.g., for inference or decision) outperforms all others across every possible instance distribution. Therefore, ecological context—the actual distribution of problems an agent faces—is indispensable for evaluating normative proposals. (Confidence: High)  
  4. **Feasibility requires grounding in resource constraints**: A normative theory intended for application to real agents (e.g., in psychology or AI) must account for computational budgets, such as latency deadlines or energy limits, because ideals divorced from resource limitations cannot guide practice. (Confidence: High)  
  5. **Tractable approximations often exist for ecological distributions**: For many common environments, polynomial-time algorithms (e.g., variational inference, Monte Carlo methods) achieve close approximations (within ε) to ideal norms like Bayesian updating, especially when instance distributions are benign or structured. This does not hold for all distributions, but it is frequent enough to be a key consideration. (Confidence: Medium)  
  6. **The meta-problem of computational allocation is inescapable**: Optimally allocating bounded resources (e.g., time or attention) to sub-tasks is itself computationally hard in general, creating a regress. Any normative theory must address how this regress is handled in practice. (Confidence: Medium)  
  7. **Ideal norms can function as regulative standards even when infeasible**: Even if unattainable, ideals like exact Bayesianism provide a directional target for improvement and a benchmark for evaluating heuristics (e.g., by measuring divergence from the ideal). This guiding role persists regardless of feasibility. (Confidence: Medium)  
  8. **Resource-rational norms depend on higher-order specifications**: Defining a "resource-rational" policy (e.g., satisficing or bounded optimization) requires specifying a computational budget, a loss function, and an environment model, all of which incur their own computational costs and uncertainties. (Confidence: High)  
  9. **Ecological distributions are empirically constrained, not adversarial**: The relevant distribution for evaluating norms is the one the agent actually encounters (based on evolution, learning, or environment), not a worst-case or adversarial distribution. However, characterizing this distribution requires empirical input and cannot be derived a priori. (Confidence: Medium)  
  10. **Intractability necessitates a bridge between ideal and practice**: The existence of a gap between ideal norms and feasible procedures demands a theoretical account of how norms are adapted (e.g., via approximation, heuristics, or replacement) to respect constraints. Ignoring this gap renders normative theories descriptively and prescriptively inert. (Confidence: High)  

