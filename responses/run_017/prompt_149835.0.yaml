  Hey — I could use a hand with one question on this year's final for my social choice course. It's a mixed 4th-year/MA elective, 3 hour closed-book exam, and I want this one item to be about 45 minutes of it.

  Context so you know what I'm working with: they've all had Arrow's theorem in the version with unrestricted domain over profiles of strict individual orderings, weak Pareto, binary independence of irrelevant alternatives, and a social ranking that's complete and transitive. I did the standard decisive-coalition proof in class (extraction lemma, field expansion, then splitting a decisive coalition until you're down to a single voter) and most of them can reproduce it. That's exactly the problem: ask them to state and prove Arrow's theorem and I get forty near-identical scripts.

  So I want the crux to be which premise is actually carrying the weight. The angle I've been playing with: keep unrestricted domain, Pareto and IIA exactly as they are, but weaken the demand on the output from "complete and transitive" to "complete and quasi-transitive" — strict part transitive, indifference allowed to be intransitive — and ask whether the impossibility survives. I don't think it does: "x is socially strictly preferred to y iff everyone strictly prefers x to y, otherwise society is indifferent" looks like a counterexample, and more generally so does any rule of the form "strictly preferred iff every member of some fixed coalition M strictly prefers x to y, indifferent otherwise". I also suspect those are the only ones, and that's the bit my students assert instead of doing.

  Can you write me:

  1. The question itself, self-contained — n ≥ 2 voters, at least 3 alternatives, strict individual orderings, every definition stated in the question, since it's closed book and nothing can be looked up. Around 45 minutes of work. It shouldn't be only "prove the characterization": I want a part that makes them say whether the escape is worth anything (if social indifference can be intransitive, what's left — maximal elements in finite sets? representation by a utility function or by ordered indifference classes? what happens under sequential pairwise choice or a fixed agenda?), and I definately want a trap for the ones who'll bolt a fixed tie-breaking order over the alternatives onto the unanimity rule and announce that full transitivity is back. Maybe a short last bit on what's left if we also require anonymity.

  2. A model answer, 700–900 words, that actually carries out the arguments rather than asserting them.

  3. A marking scheme out of 25: the must-hit moves, what each is worth, and a line on the mistake real students make at each point. The three I keep seeing are: conflating "not an ordering" with "incomplete / the rule fails to decide"; writing "so Arrow's theorem is really just about transitivity of indifference" and stopping there; and reciting the standard proof with 'oligarchy' swapped in for 'dictator', which shouldn't work because the step that splits a decisive coalition in two and shows one half is decisive needs indifference to be transitive — check me on that, I might be wrong about exactly where it bites.

  Draw the A/B line explicitly: what a B answer gets right, and precisely what's missing that keeps it out of the A band. And no citations or reading lists anywhere — closed book, everything has to come out of the definitions I hand them.
