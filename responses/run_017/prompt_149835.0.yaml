  ### Question: Arrow's Theorem with Quasi-Transitive Social Preferences

  **Context:**  
  Consider a society with \(n \geq 2\) voters and a finite set of alternatives \(X\) (with \(|X| \geq 3\)). Each voter \(i\) has a *strict preference ordering* \(P_i\) over \(X\), meaning \(P_i\) is complete (for all distinct \(x, y \in X\), either \(xP_iy\) or \(yP_ix\)), transitive (if \(xP_iy\) and \(yP_iz\), then \(xP_iz\)), and antisymmetric (no indifference). A *profile* \(\mathbf{P} = (P_1, \dots, P_n)\) is a list of all voters' strict orderings.  

  A *social welfare function (SWF)* assigns to each profile \(\mathbf{P}\) a social preference relation \(R\) over \(X\). We impose:  
  1. **Unrestricted Domain (UD):** The SWF is defined for every possible profile \(\mathbf{P}\).  
  2. **Weak Pareto (WP):** For any profile \(\mathbf{P}\) and distinct \(x, y \in X\), if \(xP_iy\) for all voters \(i\), then \(xPy\) (where \(P\) is the strict part of \(R\)).  
  3. **Binary Independence of Irrelevant Alternatives (IIA):** For any profiles \(\mathbf{P}\) and \(\mathbf{P'}\), and distinct \(x, y \in X\), if every voter has the same preference between \(x\) and \(y\) in \(\mathbf{P}\) as in \(\mathbf{P'}\) (i.e., \(xP_iy\) iff \(xP'_iy\), etc.), then the social preference between \(x\) and \(y\) is the same in \(R(\mathbf{P})\) and \(R(\mathbf{P'})\).  
  4. **Quasi-Transitive Output:** The social preference \(R\) is complete (for all distinct \(x, y \in X\), \(xRy\) or \(yRx\)) and quasi-transitive (its strict part \(P\) is transitive: if \(xPy\) and \(yPz\), then \(xPz\)). Indifference (denoted \(xIy\) when \(xRy\) and \(yRx\)) may be intransitive.  

  **Tasks:**  
  (a) Let \(M\) be a fixed non-empty coalition of voters. Define an SWF where for any distinct \(x, y\):  
  - \(xPy\) if and only if every voter in \(M\) strictly prefers \(x\) to \(y\).  
  - Otherwise, \(xIy\).  
  Verify that this SWF satisfies UD, WP, IIA, and outputs a complete and quasi-transitive relation. [6]  

  (b) Prove that any SWF satisfying UD, WP, IIA, and quasi-transitive output must be of the form in (a) for some non-empty coalition \(M\). [12]  

  (c) Discuss the following:  
     (i) Is the social preference \(R\) necessarily a full ordering (i.e., fully transitive)? If not, provide an example with 3 alternatives and \(n=2\) (where \(M\) is both voters) to illustrate. [2]  
     (ii) In any finite set of alternatives, must there exist a maximal element (an alternative \(x\) such that no \(y\) has \(yPx\))? Justify. [2]  
     (iii) Suppose we use this SWF in sequential pairwise voting: alternatives are compared in a fixed order (agenda), and at each step, the winner is chosen via the SWF; if indifferent, a fixed tie-breaking order (e.g., alphabetical) is used. Is the final choice always well-defined? Might it depend on the agenda? Give an example with 3 alternatives if relevant. [3]  

  (d) If we additionally require *anonymity* (the SWF output is unchanged if any two voters swap preferences), what must \(M\) be? Describe the resulting SWF. [2]  

  ---

  ### Model Answer  

  **(a)** For a fixed non-empty \(M\):  
  - **UD:** The SWF is defined for any profile since it only requires checking \(M\)'s preferences over pairs.  
  - **WP:** If all voters prefer \(x\) to \(y\), then all in \(M\) do, so \(xPy\).  
  - **IIA:** Social preference over \(\{x,y\}\) depends only on whether all in \(M\) prefer \(x\) to \(y\) (or \(y\) to \(x\)), which is determined by individual preferences over \(\{x,y\}\).  
  - **Completeness:** For any \(x,y\): if all in \(M\) prefer \(x\) to \(y\), then \(xPy\); if all prefer \(y\) to \(x\), then \(yPx\); otherwise, \(xIy\). These cases cover all possibilities.  
  - **Quasi-transitivity:** Suppose \(xPy\) and \(yPz\). Then all in \(M\) prefer \(x\) to \(y\) and \(y\) to \(z\). By transitivity of individual preferences, all in \(M\) prefer \(x\) to \(z\), so \(xPz\). Thus, \(P\) is transitive.  

  **(b)** We prove the SWF must be an oligarchic rule with oligarchy \(M\):  
  - A coalition \(C\) is *globally decisive* if, whenever all in \(C\) prefer \(x\) to \(y\), then \(xPy\) (for any \(x,y\)). By WP, the grand coalition is globally decisive.  
  - **Intersection property:** If \(C\) and \(D\) are globally decisive, so is \(C \cap D\).  
    *Proof:* Take distinct \(x,y,z\). Consider a profile:  
    - Voters in \(C \cap D\): \(x \succ y \succ z\)  
    - Voters in \(C \setminus D\): \(z \succ x \succ y\)  
    - Voters in \(D \setminus C\): \(y \succ z \succ x\)  
    - Others: Arbitrary (e.g., \(y \succ z \succ x\)).  
    Since \(C\) is globally decisive and all in \(C\) prefer \(x\) to \(y\), we have \(xPy\). Since \(D\) is globally decisive and all in \(D\) prefer \(y\) to \(z\), we have \(yPz\). By quasi-transitivity, \(xPz\). In this profile, only \(C \cap D\) prefers \(x\) to \(z\) (others prefer \(z\) to \(x\)). By IIA, in *any* profile where all in \(C \cap D\) prefer \(x\) to \(z\), we get \(xPz\). Thus, \(C \cap D\) is globally decisive.  
  - Let \(M\) be the intersection of all globally decisive coalitions. \(M\) is non-empty (as the grand coalition is decisive) and globally decisive (by the intersection property and finiteness).  
  - **Veto power for members of \(M\):**  
    - If a voter \(i \in M\) prefers \(x\) to \(y\), we cannot have \(yPx\).  
      *Proof (by contradiction):* Suppose \(yPx\) and \(i \in M\) prefers \(x\) to \(y\). Consider a profile with:  
      - \(i\): \(x \succ z \succ y\)  
      - Others: \(y \succ x\) and \(y \succ z\) (e.g., \(y \succ z \succ x\)).  
      If \(yPx\), then with \(yPz\) (by WP, since all prefer \(y\) to \(z\)), quasi-transitivity implies \(xPz\) or \(zPx\)? Not necessarily—but we can force a contradiction. Since \(M \setminus \{i\}\) is not globally decisive (as \(M\) is minimal), there exists a pair \((a,b)\) and profile where all in \(M \setminus \{i\}\) prefer \(a\) to \(b\) but not \(aPb\). Set \((a,b) = (z,x)\). In the current profile, all in \(M \setminus \{i\}\) prefer \(z\) to \(x\) (as others have \(z \succ x\)), and we have \(xPz\) (from \(yPx\) and \(yPz\)? No—wait, we have \(yPx\) and \(yPz\), but no direct link. Instead, use: \(yPx\) and (by WP) \(yPz\), then quasi-transitivity does not require \(xPz\)/\(zPx\). Adjust:  
      - Set \(i\): \(x \succ y \succ z\)  
      - Others: \(y \succ z \succ x\).  
      If \(yPx\), then with \(yPz\) (all prefer \(y\) to \(z\)), quasi-transitivity implies nothing new. But \(M \setminus \{i\}\) is not decisive for some pair, say \((y,z)\). In a profile where all in \(M \setminus \{i\}\) prefer \(y\) to \(z\) but not \(yPz\), while in the current profile we have \(yPz\) (by WP), a contradiction via IIA.  
    - Similarly, if \(i \in M\) prefers \(y\) to \(x\), we cannot have \(xPy\).  
  - **Characterization:**  
    - If all in \(M\) prefer \(x\) to \(y\), then \(xPy\) (as \(M\) is decisive).  
    - If not all in \(M\) prefer \(x\) to \(y\), then some \(i \in M\) prefers \(y\) to \(x\), so we cannot have \(xPy\). By completeness, we must have \(yPx\) or \(xIy\). But if not all in \(M\) prefer \(y\) to \(x\) either (i.e., some in \(M\) conflict), then we cannot have \(yPx\) (by veto power), so \(xIy\). Thus, the SWF matches (a).  

  **(c)**  
  (i) **Not fully transitive.** Example: \(X = \{x,y,z\}\), \(n=2\), \(M = \{1,2\}\). Profile:  
  - Voter 1: \(x \succ y \succ z\)  
  - Voter 2: \(y \succ z \succ x\)  
  Social preferences:  
  - \((x,y)\): Not unanimous \(\Rightarrow xIy\)  
  - \((y,z)\): Unanimous \(y \succ z \Rightarrow yPz\)  
  - \((x,z)\): Not unanimous \(\Rightarrow xIz\)  
  Thus, \(xIy\) and \(yPz\), but not \(xPz\) (we have \(xIz\)), violating transitivity (which would require \(xPz\)).  

  (ii) **Yes, maximal elements exist.** The strict part \(P\) is transitive (hence acyclic: no cycles \(x_1 P x_2 P \cdots P x_k P x_1\)). In a finite set, acyclicity ensures a maximal element (no \(y\) with \(yPx\)).  

  (iii) **Outcome may depend on agenda and tie-breaking.** Example: \(X = \{x,y,z\}\), \(n=2\), \(M = \{1,2\}\), tie-breaking: \(x > y > z\) alphabetically. Profile:  
  - Voter 1: \(x \succ y \succ z\)  
  - Voter 2: \(y \succ z \succ x\)  
  Agenda 1: First \(x\) vs \(y\), then winner vs \(z\).  
  - \(x\) vs \(y\): Indifferent \(\Rightarrow\) tie-break to \(x\) (alphabetical).  
  - \(x\) vs \(z\): Indifferent \(\Rightarrow\) tie-break to \(x\). Final: \(x\).  
  Agenda 2: First \(y\) vs \(z\), then winner vs \(x\).  
  - \(y\) vs \(z\): Unanimous \(y \succ z \Rightarrow y\) wins.  
  - \(y\) vs \(x\): Indifferent \(\Rightarrow\) tie-break to \(x\) (since \(x < y\) alphabetically). Final: \(x\).  
  *But change tie-breaking to "choose first in agenda":*  
  - Agenda 2: \(y\) vs \(z\): \(y\) wins. Then \(y\) vs \(x\): Indifferent \(\Rightarrow\) choose \(y\) (first in pair). Final: \(y\).  
  Thus, outcome can depend on agenda/tie-breaking.  

  **(d)** **Anonymity requires \(M = \text{all voters}\).** The SWF becomes: \(xPy\) iff all voters prefer \(x\) to \(y\); otherwise, \(xIy\) (Pareto extension rule).  

