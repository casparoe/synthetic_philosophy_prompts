prompt: |-
  I run a weekly student reading group on decision theory — mostly CS majors with a few philosophy people who wandered in — and we get 75 minutes in a room with a tiny whiteboard and a projector that has never once worked. Last week we did Newcomb's problem and it went okayish: maybe a third of them left convinced that one-boxing is just wishful thinking in a tuxedo. This week I want to do acausal trade, meaning the idea that two agents who cannot affect each other, observe each other, or communicate might still cooperate because their decisions are correlated through the similarity of their decision procedures rather than through any causal link or shared cause. My co-organizer says this is literally just one-boxing with extra steps and we should spend the session on Bayesian epistemology instead, and I half see his point but can't artiuclate what's wrong with it well enough to teach from.

  So don't explain acausal trade to me — plan how I should explain it to them. What I really want is the dependency structure: the order the pieces have to go in and what depends on what. My instinct is that I need them to first accept a case where your action is strong evidence about an outcome without causing it, and only then get them to a case where the correlation isn't explained by a common cause or by somebody simulating them either — but I don't know how to make that second move feel like a real step rather than a sleight of hand, and I worry that starting from Newcomb just replays last week's fight.

  I also need one example to carry the whole session. Here's the one I sketched: two agents, one in each of two universes that will never interact; each has 100 units of its own resource; each can burn k units of its own resource to manufacture 4k units of the good the other one values; unspent units are worth 1 util to their owner and the other's good is worth 1 util per unit to the other. Each is fairly but not fully confident the other exists. And the bit I added to make it hard: the two agents run the same architecture and style of reasoning, but one's utility function has been edited to value the other colour of widget, and their confidence that a counterpart exists differs (say 0.8 versus 0.5). They cannot send messages, so they cannot haggle over how much each burns — each just picks a number in private. Tell me whether that carries the session, what it is missing, what it has that it shouldn't, and why not the usual candidates: the exact-copy prisoner's dilemma, the old puzzle where a prize goes to you only if exactly one of twenty people asks for it, or two galaxy-spanning civilisations that value paperclips and staples. Should I start symmetric and then break the symmetry, or start asymmetric and let the copy case show up as a special case?

  Then the misconception map, with the point in the sequence where each should be headed off — and I mean headed off, not just corrected afterwards. The ones I expect: that this is a promise, a reputation effect, or iterated cooperation in disguise; that my choice somehow causally pushes the other agent's choice; that correlation without a common cause is incoherent so the whole setup is broken (this one will come from the strongest CS student); that it's still just evidential decision theory so nothing new is on the table; that it only works if the other agent is literally running my code, and the opposite error that any sufficiently reasonable agent will do the same thing; that cooperating with a causal-decision-theory counterpart is still worth something; and that this is Pascal's mugging with better branding, a licence to trade with any alien you can imagine. Tell me which of these I should actually invite rather than prevent, and flag any you think I'll get that I haven't listed.

  Finally: what should I openly refuse to explain at this level and say out loud that I'm refusing — I'm thinking the problem of how to weight which computations count as existing, logical uncertainty, updatelessness, whether copies in other branches of quantum mechanics are the same kind of thing as distant civilisations — and which of those I should name-and-drop versus never mention at all; plus one question I can ask at minute seventy where I could actually tell a right answer from a wrong one, so I know whether the idea landed or whether they just got talked into something. (There's a departmental coffee thing right after, so they're going to be restless.)
reasoning: |-
  Okay, the user is running a student reading group on decision theory, mostly for CS majors with some philosophy students. Last week they covered Newcomb's problem, and about a third of the students weren't convinced by one-boxing. This week, they want to teach acausal trade, but their co-organizer thinks it's just Newcomb with extra steps and suggests Bayesian epistemology instead. The user wants to know how to structure the session effectively.

  First, I need to figure out the dependency structure for teaching acausal trade. The user's instinct is to start with a case where an action is evidence without causation, then move to correlation without common cause. But they're worried about replaying the Newcomb debate. They also want a single example to carry the session and have sketched one with two agents in separate universes, asymmetric utilities and confidence levels. They need feedback on that example versus alternatives like Prisoner's Dilemma with exact copies or the twenty people prize puzzle.

  Then, there's the misconception map. The user listed several expected misconceptions: thinking it's about promises or reputation, causal influence, incoherent correlation, just EDT, requires identical code, any reasonable agent will cooperate, trading with CDT agents is beneficial, or Pascal's mugging. I need to identify which misconceptions to address proactively and which to let emerge. Also, anticipate unlisted ones.

  Finally, what topics to avoid mentioning or just name-drop. The user mentioned computation weighting, logical uncertainty, updatelessness, quantum branches. Plus, a closing question to assess understanding.

  Breaking it down:

  1. **Session Structure**: Start symmetric to build intuition, then introduce asymmetry. Avoid Newcomb to prevent rehashing debates. Use the user's example but simplify initially. Maybe begin with symmetric case to show mutual benefit, then add variations.

  2. **Example Evaluation**: Their example has asymmetric valuations and confidence levels. Pros: highlights decision dependence without communication, breaks symmetry. Cons: might be too complex. Compare to Prisoner's Dilemma copy—too similar to Newcomb? The twenty people puzzle involves common knowledge, which might introduce complications. Galaxy civilizations are too vague. So their example is good but start symmetric, then add asymmetry.

  3. **Misconceptions**: 
     - "Correlation requires common cause": Need to address early using the setup's isolation. 
     - "Causal influence": Emphasize no communication possible. 
     - "Just EDT": Clarify that CDT fails here because it doesn't account for correlated decision-making. 
     - "Requires identical code": Use the confidence difference to show similar reasoning suffices. 
     - "Pascal's mugging": Point out that probabilities are non-negligible and reciprocal.
     - Let emerge: promises/reputation (since no interaction), trading with CDT (show it's futile).

  4. **Topics to Avoid**: 
     - Name-drop: updatelessness, logical uncertainty. 
     - Avoid: computation weighting, quantum branches. 
     - Explicitly refuse to discuss how agents know about each other's reasoning.

  5. **Closing Question**: Ask what Agent A should burn given their confidence and asymmetry. Correct answer involves calculating expected utility considering the counterpart's likely action based on similarity.

  Need to sequence the session: 
  - Start with symmetric case to establish mutual benefit. 
  - Introduce asymmetric valuations and confidences. 
  - Preempt misconceptions at each step. 
  - Use the whiteboard for decision matrices. 
  - End with the calculation question to test understanding.
answer: |-
  Here's a battle-tested lesson plan for your 75-minute session on acausal trade, designed to sidestep Newcomb rehashing and build intuition incrementally. I'll break it down: dependency structure, your example (with tweaks), misconception handling, and refusal strategy. My approach prioritizes *structural clarity* over philosophical depth—essential for CS majors.

  ### **Dependency Structure: The 5-Step Sequence**
  **Goal:** Make them see "correlation without causation or common cause" as a tool, not magic.  
  *Total Time: 65 mins (save 10 for Q&A)*  

  1. **Set Up Isolation (10 mins)**  
     - Start with: "Two agents, Alice (Universe A) and Bob (Universe B). No communication, no causal links, no shared history. They will never interact. Alice values purple widgets; Bob values orange widgets. Each has 100 units of raw material. Alice can burn *k* units to make 4*k* orange widgets for Bob (and vice versa). Unspent material gives 1 util per unit; the other's widgets give 1 util per unit."  
     - **Why this first?** Establish absolute isolation upfront. Preempt "but they could signal!" objections by emphasizing: *no messages, no simulations, no future encounters*. Use the whiteboard to sketch two disconnected bubbles.  
     - *Key dependency:* If they don’t buy isolation, everything fails. Have them brainstorm why isolation is realistic (e.g., cosmological horizons, sealed subuniverses).

  2. **Symmetric Case (15 mins)**  
     - Simplify your example: Assume symmetric confidence (both 80% sure the other exists) and symmetric values (both value the other's widgets equally). Ask: "If Alice burns *k*, what should Bob burn? What should *Alice* burn knowing Bob is like her?"  
     - Work through math together:  
       - If both burn 0: Each gets 100 utils.  
       - If both burn *k*: Each gets *(100 - k) + 4k × 0.8* (since 4k widgets × 80% confidence they exist).  
       - Maximize utils: *U(k) = 100 - k + 3.2k = 100 + 2.2k*. Burning more *always* helps!  
     - **Punchline:** Burning *k* isn't about altruism—it's selfish. If Bob is like Alice, he'll likely burn a similar amount. Correlation (via similar reasoning) turns sacrifice into profit.  
     - *Key dependency:* This step *requires* accepting that similarity creates predictable correlation. If they resist, ask: "If Bob uses the same code/algorithm as Alice, wouldn’t you expect similar outputs?" (Leverage CS intuition).

  3. **Asymmetric Case (20 mins)**  
     - Now break symmetry: Alice is 80% confident Bob exists; Bob is only 50% confident Alice exists. Alice values orange widgets (Bob’s product); Bob values purple widgets (Alice’s product).  
     - Pose the dilemma: "Alice burns *k_A*. Bob burns *k_B*. They pick independently. How much should Alice burn?"  
     - Guide them to see:  
       - Alice knows *her* burn rate *k_A* is evidence about *k_B* (since Bob reasons similarly).  
       - If Alice burns high, it suggests Bob (being similar) also burns high → Alice gets lots of orange widgets.  
       - But Bob’s low confidence (50%) means he’ll likely burn *less* than Alice (since *U_B(k_B) = 100 - k_B + 4k_A × 0.5*).  
     - **Critical insight:** Optimal *k_A* depends on Alice’s *model* of Bob’s reasoning. If Bob is rational and similar, he’ll burn less, but Alice still burns moderately (e.g., ~20–30 units) because *some* trade beats none.  
     - *Key dependency:* Asymmetry forces them to see this isn’t copy-paste cooperation. It’s *strategic uncertainty* under similarity.

  4. **Contrast with Failed Alternatives (10 mins)**  
     - **Prisoner’s Dilemma (PD) with clones:** Reject this upfront! PD copies *are* Newcomb-like (your co-organizer is half-right). Clones imply "same code → same action," which feels like a shared cause. Your example avoids this by adding asymmetry (different confidences/values) → similarity ≠ identity.  
     - **Twenty-people puzzle:** Reject! This relies on *common knowledge* of rationality. Your setup has no communication, so no coordination.  
     - **Galaxy civilizations:** Too vague. Students will get lost in "how do they know about each other?"  

  5. **Decision Theory Showdown (10 mins)**  
     - Pose: "Alice uses CDT (Causal Decision Theory). What happens?"  
       - *Answer:* CDT sees no causal link → burns 0. Bob burns 0 (for same reason). Outcome: (100, 100). Missed gains!  
     - Contrast with "Acausal Decision Theory":  
       - Alice treats her action as *data* about Bob’s action → burns *k_A > 0*. Outcome: Both benefit if confidence > 25%.  
     - **Why this last?** Forces them to see acausal trade as *distinct* from EDT (Evidential Decision Theory). EDT would one-box in Newcomb but struggles with asymmetry; acausal trade handles asymmetry via *models of similarity*.

  ---

  ### **Your Example: Why It Works (With Tweaks)**
  - **Strengths:**  
    - Asymmetry (80% vs. 50% confidence) is **gold**. It kills "but they’re identical!" objections and makes similarity ≠ cloning obvious.  
    - Burning *k* to make *4k* widgets is **tangible** for CS majors. It turns abstract "cooperation" into engineering ("input → output").  
  - **Tweak it:**  
    - Start **symmetric** (Step 2) to build intuition. *Then* add asymmetry (Step 3). Symmetry is the ladder you kick away.  
    - Add concrete numbers: "Alice burns 20 → makes 80 orange widgets for Bob. If Bob exists (80%), Alice’s utils = (100-20) + 80×0.8 = 80 + 64 = 144."  
  - **Missing piece:** Explicitly state *how* they know about similarity. Say: "They’ve studied each other’s design documents" or "Their AI architectures are public knowledge." Otherwise, CS students will cry "impossible prior!"  
  - **Why not other candidates?**  
    - PD clones: Too Newcomb-y. Philosophy students will derail with "but it’s just TDT!".  
    - Twenty-people puzzle: Requires common knowledge → irrelevant.  
    - Galaxy civilizations: Too sci-fi. Students will fixate on "how do they know?" instead of decision theory.

  ---

  ### **Misconception Map: When and How to Head Them Off**
  Prevention is better than correction. Here’s when to strike:

  | Misconception | When to Head Off | How to Preempt |
  |---------------|------------------|----------------|
  | "It’s promises/reputation!" | During Step 1 (Isolation) | State emphatically: "No future interactions. Burning *k* isn’t an investment—it can’t be rewarded later." |
  | "My choice causes theirs!" | Step 2 (Symmetric Case) | Whiteboard: Draw two isolated universes. Ask: "If Alice burns more, does Bob’s code run faster? No? Then no causation." |
  | "Correlation needs a common cause!" | Step 2 → Step 3 transition | Contrast: Symmetry (feels like shared cause) vs. Asymmetry (Bob’s 50% confidence breaks this). Ask: "If two isolated AIs use gradient descent, would you expect similar solutions? Why?" |
  | "It’s just EDT!" | Step 5 (Showdown) | Point out: EDT would burn *k* because "burning high is evidence Bob burns high." But acausal trade *uses similarity as a model*, which works under asymmetry where EDT flounders. |
  | "Only works with identical code!" | Step 3 (Asymmetric Case) | Stress: "Same *style* of reasoning, not same code. Alice expects Bob to burn less because he’s less confident—not because she controls him." |
  | "Cooperating with CDT agents helps!" | Step 5 (Showdown) | Calculate: If Bob is CDT, Alice burning *k* gives her *(100 - k) + 0* (since Bob burns 0). Burning anything loses utils. |
  | "Pascal’s Mugging!" | Step 3 (Asymmetric Case) | Note: Probabilities (50%, 80%) are fixed and reciprocal. Not "if I believe hard enough, I get infinite utils." |

  **Misconceptions to invite (let them air these):**  
  - "But how do they *know* they’re similar?" (Good! Forces engagement with priors.)  
  - "Isn’t this just guessing?" (Let them debate—then reframe as *model-based prediction*.)  
  - "What if they’re wrong?" (Crucial! Allows discussion of robustness.)  

  **Unexpected misconception:** "This is Nash equilibrium!" Head off in Step 2: "Nash assumes mutual knowledge of rationality. Here, Alice doesn’t know Bob’s confidence—she models it."

  ---

  ### **What to Refuse to Explain (And How)**
  **Name-and-drop to satisfy curiosity without derailing:**  
  - *"How do we weight which 'similar agents' count?"* → "That’s the **problem of logical uncertainty**—vital but beyond today. Assume we have a probability distribution."  
  - *"What if they’re copies in quantum branches?"* → "**Updatelessness** handles that, but it’s a rabbit hole. Today, assume single branches."  

  **Explicitly refuse (say this verbatim):**  
  - *"I won’t explain how they assign confidence (e.g., 80% vs 50%). That’s about priors and metaphysics—today, take it as given."*  
  - *"I won’t dive into how 'similarity' is defined. We’re assuming it’s quantified already."*  

  **Never mention:**  
  - Grain-of-truth assumptions.  
  - Logical induction.  
  - Quantum immortality (they’ll meme it to death).

  ---

  ### **Closing Question to Test Understanding (Minute 70)**
  **Pose:** *"Alice is 80% confident Bob exists. Bob is 50% confident Alice exists. Both know the other reasons similarly. Alice can burn k (0 ≤ k ≤ 100). What k should she choose? Why?"*  

  **Right answer:**  
  - She should burn *k > 0* (e.g., k ≈ 20–40).  
  - **Why:** Burning *k* gives evidence Bob burns a comparable amount. Even with Bob’s low confidence, the expected utils *U(k) = (100 - k) + 4k × [Alice's model of Bob's burn rate] × 0.8* can exceed 100.  

  **Wrong answers:**  
  - "k=0 because no causal link." (CDT failure.)  
  - "k=100 because Bob might reciprocate." (Ignoces asymmetry.)  

  **Why this works:** It forces them to synthesize isolation, asymmetry, and evidential reasoning. If >50% pick k>0 with plausible reasoning, the idea landed. If not, they’ve been talked into it—but the coffee rush will mask the pain.  

  ### **Final Tip**
  **Whiteboard strategy:**  
  - Left side: Alice’s universe (resources, actions).  
  - Right side: Bob’s universe.  
  - Middle: "Similarity → Correlation" with a *dotted line* (emphasize: not causal).  
  - Never erase the isolation premise.  

  This structure makes acausal trade feel like a tool for isolated systems (appealing to CS) while dodging Newcomb déjà vu. Go crush it.
