  The "one thought too many" reference from their friend points to Bernard Williams’ idea that over-rationalizing can strip actions of their moral value (e.g., helping a spouse because it’s "right" instead of out of love). But here, it’s different—it’s not about overthinking motives but about the *observability* of deliberation. The user’s examples show that the mere act of weighing the request (and making it known) triggers judgment, even if the outcome is the same as someone who didn’t engage. 

