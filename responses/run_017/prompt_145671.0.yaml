answer: |-
  What you describe is a subtle and astutely observed pattern in moral psychology, one that doesn't fit neatly under a single established label but intersects with several philosophical and psychological concepts. I believe the core phenomenon is this: **The visibility of deliberation over an optional moral action alters its perceived moral weight, often generating extra blame for a visible refusal or diminished praise for a visible agreement, compared to identical outcomes reached without visible deliberation.** Let me carve this out carefully.

  Your observation is correct that it's not merely about the act being optional ('supererogatory' in philosophy), nor about the *substance* of the reasons (valid reasons like a hospital visit negate the effect). The critical element is the *process of conscious consideration becoming apparent to others*. When someone visibly takes a request "up as a live question," they transform it from a passive omission into an active refusal. The refusal itself isn't inherently blameworthy; it's the *demonstrated act of weighing and rejecting* that triggers the negative judgment. This shifts the perception from "they couldn't/didn't" (excusable absence) to "they *chose* not to" (agentic refusal), even though the practical outcome and the agent's ultimate freedom are identical. The visibility is key: the volunteer who privately weighs and declines without mentioning it avoids the judgment, while the one who mentions "I thought about it but can't" incurs it. The deliberation becomes a public performance of choice against the communal good.

  This connects strongly to Bernard Williams' famous point about "one thought too many." Williams argued that certain moral actions (like saving your spouse from drowning) lose their inherent value if motivated *solely* by abstract duty rather than immediate, personal connection. Your friend likely referenced this. While related, your phenomenon is distinct. Williams focused on the *agent's internal motivation* and how over-rationalization can undermine the act's moral character. Your observation is about *external perception*: how the *appearance of deliberation* itself, regardless of the actual motivation (which might be entirely sound, like managing fatigue after a hospital appointment), alters *others' judgments* of the agent. It's not that the volunteer had "one thought too many" internally; it's that *showing* they had any thought at all (beyond immediate assent) makes their refusal salient and blameworthy. It reveals the option was *real* for them and rejected.

  The mirror image with praise makes sense as part of the same phenomenon. When someone helps immediately and spontaneously, it appears to stem from an unconflicted character trait – generosity or commitment as a default. This feels more "authentic" and thus praiseworthy. Visible deliberation before agreeing introduces ambiguity: it suggests the helper might have self-interested reservations they overcame, or that the act required effortful calculation rather than natural inclination. While reflection *should* make the choice more morally significant (it's consciously chosen good), socially, it diminishes the *perception* of pure virtue. We interpret the hesitation as a sign the helper isn't fully "one of us" committed to the cause without question. The spontaneous helper embodies the ideal; the deliberating helper merely chooses it, revealing the potential for non-cooperation.

  The extra blame isn't solely about revealing selfishness (though that can be a factor). It's also about the *act of refusal itself becoming an event*. The non-responder creates no such event; their absence is a nullity. The visible deliberator who refuses makes a small, negative assertion against the group's need: "This request was considered and deemed not worth my effort *by me*." This assertion, however politely framed, is a tiny social friction point the non-responder avoids. It forces the group to acknowledge the refusal explicitly.

  Is the blame/praise asymmetry the same phenomenon? Fundamentally, yes. Both stem from how the *visibility of optionality* impacts judgment. For blame: visible deliberation makes the refusal an *active choice against helping*, highlighting the agent's prioritization of self over the communal ask. For praise: visible deliberation makes the agreement an *effortful choice* rather than a *spontaneous expression of virtue*, diminishing its perceived purity. The core is the revelation that the agent perceived the action as optional and engaged in a cost-benefit analysis – a revelation absent in spontaneous action or non-response.

  The role of skill or duty (like your paramedic) complicates it. If the skill creates a *stronger perceived obligation* (even off-duty), then visible deliberation before refusing might attract *more* blame because the expectation is higher. Their refusal feels like a deeper betrayal of role. Conversely, if they help after deliberation, they might get *more* praise precisely because it demonstrates overcoming a higher presumed burden (e.g., "She's done this professionally for years, yet still chose to help us on her day off"). The key factor here is whether the role alters the *baseline expectation*. For your paramedic off-duty, the expectation might be slightly higher than for others, making visible deliberation before refusal potentially more blameworthy, but likely less than if she were *on* duty. It shifts the perceived "optionality" threshold slightly.

  **Confidence and Uncertainty:**

  I am highly confident in the core description: that visible deliberation alters the moral perception of optional acts, increasing blame for refusal and decreasing praise for agreement, primarily by making the agent's choice and the act's optionality salient. The links to Williams ("one thought too many") and the role of perceived agency/intentionality are well-supported in moral psychology and philosophy.

  My greatest uncertainty lies in the *relative weight* of the explanations for the extra blame:
  1.  **Revealed Selfishness:** Does deliberation imply the agent *needed* to overcome selfish impulses?
  2.  **Salience of Choice:** Is it purely the act of *making* the negative choice visible that stings?
  3.  **Social Friction:** Is it the minor disruption caused by forcing an explicit refusal?

  These likely interact, and their prominence might vary contextually. I lean towards "Salience of Choice" being the most fundamental, as it explains why *good* reasons negate the effect (the choice isn't seen as selfish) and why publicity is essential. But I'm less certain about precisely how these mechanisms combine across different situations like your volunteer rota versus the slumped person on the pavement. The passer-by case feels more tied to revealed selfishness/callousness, perhaps because the immediate need is more acute and the duty to help feels less ambiguous. The phenomenon holds, but its intensity and precise flavor may shift.

  You've identified a profound quirk of social judgment. It highlights how our praise and blame often track not just actions and outcomes, but the perceived *trajectory* of the will behind them, and how making the machinery of choice visible can fundamentally alter its moral reception in the eyes of others.
