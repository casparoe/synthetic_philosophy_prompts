  Then, at the end of the session, we reveal V and compute all payoffs.

  Now, minute-by-minute:

  - 0-5 min: Setup. Assign roles (11 buyers, 11 sellers). Explain: we have an asset with true value V (0 or 100) drawn from an urn. Each round, you will receive a new private signal about V (H or L). Accuracy 80%. We will do several rounds of trading. At the end of each round, you will report your probability that V=100. At the end of the session, we reveal V and compute your points from trading and from your probability reports. Points are lottery tickets for a chocolate box.

  Explain the trading roles: 
  - Sellers: start each round with one asset. If you sell, you get 50 points. If you don't sell, you get V points.
  - Buyers: start each round with 50 points. If you buy, you get V points (so effectively, you swap 50 points for the asset). If you don't buy, you keep 50 points.

  Explain the belief report: at the end of each round, you will write on a slip of paper your name, the round number, and your probability (0 to 100%) that V=100. We will score this with the quadratic scoring rule.

  - 5-10 min: Draw V publicly. Two balls in an urn: one 0, one 100. Draw one. Then put it aside. Don't reveal.

  Round 0: Call market (10 min)
  - 10-15 min: Draw signals. Pass the appropriate urn (based on V) around. Each student draws one ball (H or L). They keep it private.
  - 15-20 min: Call market. We have 11 sellers and 11 buyers. Each seller submits an ask (the minimum price they are willing to accept). Each buyer submits a bid (the maximum price they are willing to pay). We collect these on the board. Then we sort the bids descending and asks ascending. We match the highest bid with the lowest ask, then next, until the next bid is below the next ask. The market price is set at the average of the last matched bid and ask (or just the last matched price?). We use the highest price at which we can match (the price of the last matched trade). Then all matched trades happen at that price. Unmatched don't trade.
  - Then, they record their outcome: for each seller, if their ask was <= market price, they sell and get 50. Else, they hold and will get V. Similarly, buyers: if their bid >= market price, they buy and will get V (and lose 50 points, so net V-50? But in terms of final points: buyers who buy end with V, those who don't buy end with 50. Sellers who sell end with 50, those who don't end with V.
  - Then, at the end of the round, they report their probability for V=100.

  But note: in this call market, they set the price. This is for Round 0 only.

  Round 1: Public announcement at fixed price 50 (10 min)
  - 20-25 min: New signals drawn from the urn.
  - 25-30 min: Public announcement. 
    - Step 1: All sellers simultaneously and publicly announce either "I want to sell" or "I pass". Record the number.
    - Step 2: All buyers, after seeing the sellers' announcements, simultaneously and publicly announce either "I want to buy" or "I pass". Record the number.
    - Then, match randomly: for each buyer who wants to buy, pair with a seller who wants to sell (if there are more buyers, some buyers don't get a trade; if more sellers, some sellers don't trade). We do until we run out of one side.
    - Those who trade: sellers get 50, buyers get V (and effectively pay 50, so net V-50, but we record as V for buyers and 50 for sellers).
    - Those who don't trade: sellers get V, buyers get 50.
    - Report belief.

  Round 2: Add distressed seller (10 min)
  - 30-35 min: New signals. Also, randomly and privately assign one seller to be "distressed". This seller must sell: they get a penalty of 20 points if they do not sell. So they will always want to sell. (But they still get the signal? They might use it to understand, but they must sell regardless.)
  - 35-40 min: Same public announcement as Round 1. But now, when sellers announce, the distressed seller will always say "I want to sell". Other sellers decide normally.
  - Then buyers see the number of sellers wanting to sell. This number might include the distressed seller, so it's not pure information about signals.
  - Then buyers announce.
  - Match and record outcomes. Report belief.

  Round 3: Information acquisition (15 min)
  - 40-45 min: New signals. But now, before any announcement, we offer each student (buyers and sellers) the option to buy a second signal at a cost of 10 points (deducted from their final score). They decide privately. If they buy, they draw an additional signal from the same urn (in private). Then they have two signals and can update their belief.
  - 45-50 min: Then, we do the public announcement as in Round 1 (no distressed seller). 
  - 50-55 min: Sellers and buyers announce, match, record.
  - Report belief.

  End of rounds: 55 min.

  - 55-60 min: Reveal V. Then, for each round and each student, compute:
    a) Trading points: based on their role and outcome.
    b) Belief score: using the quadratic scoring rule for the probability they reported, given the true V.
  - Also, for those who bought the second signal in Round 3, deduct 10 points.
  - Sum the points for each student.

  - 60-75 min: Debrief.

  Debrief table:

  | Round | Event | Illustrates |
  |-------|-------|------------|
  | Round 0 | Call market: trade happens at a market price. | Without public information, trade occurs. The market price aggregates some information. |
  | Round 1 | Sellers announce first. Buyers see many sellers willing to sell and then few buyers want to buy. Trade collapses. | Point 1: willingness to trade is evidence against the trade. Sellers willing to sell reveal they have low signals, deterring buyers. |
  | Round 2 | With a distressed seller (who must sell), even if many sellers want to sell, some buyers might still buy because they know one seller is distressed. Trade happens. | Point 2: non-informational motives (liquidity needs) can restart trade. The trade is then evidence of both information and non-informational motives. |
  | Round 3 | Students are offered a second signal. Many might not buy because they anticipate that trade may collapse and they won't use the information. Also, even if they buy, they might not trade. | Point 4: information acquisition may become unrewarding when the market's informational efficiency is high (or when trade collapses). Also, we can discuss the common prior. |

  For point 3: the market price in Round 0 is an estimate, but not necessarily the best. We can compare the market price to the average of the stated probabilities in Round 0. They might differ because the market price is set by the marginal trader and might be biased (e.g., winner's curse in the call market?).

  But in Round 0, the call market might not have a strong winner's curse. However, we can note that the market price is conditional on trade happening, so it might be biased. For example, if V=0, then the market price might be low but not zero because some optimistic traders are willing to buy. We can show that the market price is not equal to the posterior expected value.

  In the debrief, we can show:

  - In Round 1, the fixed price of 50 is not the market's estimate, but we can look at the belief reports: the average belief might be away from 50, but trade doesn't happen at 50.

  - In Round 0, the market price might be between the bid and ask, but we can compare it to the average belief.

  We can make a chart after revealing V: for Round 0, the market price vs. the average stated probability. They might be close, but not necessarily. We can note that the market price is set by the marginal traders, while the average belief is the mean.

  But the key for point 3 is to see that the market price (when it exists) is not the best estimate because it's conditional on the trade happening. In the call market, the traders who set the price are the ones who are willing to trade at that price, so they have more extreme signals. This is the winner's curse: buyers who are willing to buy at a high price are the ones with high signals, but then the value might be lower.

  In the debrief, we can ask: "In Round 0, if you were a buyer and you bought the asset, what was your signal? And what was the true value? Did buyers who bought tend to lose money?" We can compute the average profit of buyers and sellers.

  If V=100, buyers who bought made 50 (100-50) and sellers lost 50 (since they sold at 50 and it was worth 100). But wait, if V=100, then buyers gain 50, sellers lose 50? That doesn't seem right. Actually, in our payoff:

  - Buyer who buys: pays 50 and gets asset worth 100, so net 50 (gain of 50 from the 50 they started with?).

  But let's clarify:

  Initial endowment for Round 0:
  - Seller: starts with asset worth V.
  - Buyer: starts with 50 points.

  After trade:
  - Seller sells for P: so now has P points.
  - Buyer buys for P: gives P points and gets asset worth V.

  So seller's final points: P.
  Buyer's final points: 50 - P + V.

  Then, if V=100 and P=60, seller has 60, buyer has 50-60+100=90.

  The buyer's gain: 90 - 50 = 40? But it's messy.

  To avoid confusion, we can just use the final points and not worry about gains.

  But for the winner's curse: if the market price is high, then buyers who buy at a high price may overpay. We can show that when V=0, the buyers who bought at a positive price lost money.

  In the debrief, we can show the outcomes.

  Now, the Hayekian objection: at the end, we note that we assumed a common prior and known signal structure. But in reality, agents might not share a prior or know the hypotheses. Markets might be good at aggregating information even without a common prior, by allowing prices to form and adjust.

  We ask: "In our game, we all knew the possible values of the asset and the signal accuracy. What if we didn't? What if agents have different ideas about how the world works? Could markets still aggregate information then?"

  If no one raises it, we say: "Hayek's point was that markets work without a common prior or known model. Our game assumed a common prior and a known signal structure, which is a strong assumption. Without it, the no-trade result might not hold, and markets might be the only way to aggregate dispersed information."

  What can go wrong:

  1. Prediction about expectations: we expect trade to collapse in Round 1, but some students might still trade. For example, a buyer with a very high signal might still buy even if many sellers are selling. We can say: "Note that the theorem is about expectations: on average, trade should collapse. In this run, we might see some trades, but fewer than in Round 0. The point is that the public information reduces trade."

  2. Students refusing to trade on principle: if a student never trades, then in Round 0 they might not trade. We can remind them that the points are lottery tickets, so they should try to maximize points.

  3. Gaming the system: if a student tries to bluff, we can note that the signals are private and they are supposed to act based on their signal. We can say: "Please act based on your signal to maximize your expected points."

  4. Blurting out the signal: during the public announcement, if a student says "I have H", we can say: "Remember, you can only say 'I want to buy/sell' or 'pass'. Please stick to the allowed sentences."

  5. Drawing the wrong moral: if a student who ended with high points is thought to have played well, but it was luck. We can explain that the points are for a lottery, so it's about expected value, and we are focusing on the aggregate behavior.

  Finally, what the activity cannot reproduce:

  - The common prior assumption: we rigged it with the urn.
  - The iterated nature of higher-order reasoning: we only have one or two levels (sellers announce, then buyers update).
  - Risk neutrality: we use lottery tickets to induce risk neutrality, but in reality, people are risk averse.
  - Zero transaction costs: our market has no costs.
  - The distinction between "no speculative trade" and "no gains from trade at all": we see that with non-informational motives, trade happens.

  We must also note that in the call market, we don't have continuous updating, and the winner's curse might not be fully apparent.

  Materials:

  - Urn for V: two balls, one "0", one "100".
  - Two signal urns: 
     - Urn for V=100: 8 green (H) and 2 red (L) [or 80% green, but for 22 draws, we put 80 green and 20 red? But we only need 22 draws. We can have a big urn with 80% green and 20% red for V=100, and 20% green and 80% red for V=0. We use the same physical urn and change the contents? Or two separate urns.
  - Index cards for roles: 11 buyer, 11 seller.
  - A way to randomly assign the distressed seller in Round 2 (e.g., draw a name).
  - Slips of paper for belief reports.
  - Whiteboard to record public announcements and market prices.

  This design meets the requirements. We have four rounds, with the mechanism changes:

  - Round 0: call market (baseline)
  - Round 1: public announcement (coarse communication)
  - Round 2: add non-informational motive
  - Round 3: add option for second signal

  And we end with the tension about the common prior.
answer: |-
  Below is a complete, runnable activity designed for your 75-minute seminar. It uses a trading game with three rounds (plus a baseline round) to illustrate the four points without naming technical concepts until the debrief. The payoff system uses a **quadratic scoring rule** applied to stated probabilities (not realized value), with total points converting to a **2% course grade boost** for the top 50% of scorers. This ensures risk neutrality, honest belief reporting, and avoids small-sample luck distorting the epistemic lessons.

  ### **Materials and Setup**
  - **Asset value**: A single underlying true value \(V\), either \(0\) or \(100\) (simplifies reasoning).  
  - **Signals**: Binary signals \(H\) (high) or \(L\) (low), with accuracy 80%:  
    - If \(V = 100\), \(P(H) = 0.8\), \(P(L) = 0.2\)  
    - If \(V = 0\), \(P(H) = 0.2\), \(P(L) = 0.8\)  
  - **Participants**: 22 students (11 buyers, 11 sellers). Assign roles at the start and keep fixed.  
  - **True value and signal generation**:  
    - **Urn for \(V\)**: One opaque urn with two balls: one labeled "0", one labeled "100". Draw publicly at session start (do not reveal result).  
    - **Signal urns**: Two urns prepared in advance:  
      - *Urn A (for \(V=100\))*: 16 green balls (H), 4 red balls (L)  
      - *Urn B (for \(V=0\))*: 4 green balls (H), 16 red balls (L)  
    - After drawing \(V\), use the corresponding urn. Pass it around; each student draws one ball (signals are private). Replace balls after each round.  
  - **Role cards**: 11 "BUYER" cards, 11 "SELLER" cards (index cards).  
  - **Distressed seller card**: One index card labeled "DISTRESSED" for Round 2.  
  - **Second signal cost**: 10 points (deducted from total score if purchased in Round 3).  
  - **Belief reporting**: Paper slips for probability statements.  
  - **Whiteboard**: Record public announcements, numbers, and scores.  
  - **Teaching assistant (TA) role**: In Round 0, TA acts as auctioneer for the call market.  

  ---

  ### **Three Rounds + Baseline**  
  Each round changes exactly one mechanism. Rounds 1–3 focus on public willingness-to-trade (coarse protocol), non-informational motives, and unrewarding information acquisition.

  #### **Round 0: Baseline Call Market (10 min)**  
  - **Goal**: Show trade happens without public signaling.  
  - **Mechanism**:  
    - Each seller has one asset, each buyer has 50 points (cash).  
    - Private signals drawn.  
    - TA runs a **call market**:  
      - Sellers secretly submit minimum ask prices (≥0).  
      - Buyers secretly submit maximum bid prices (≤100).  
      - TA sorts bids (high to low) and asks (low to high) on the board.  
      - Match highest bid with lowest ask until bids < asks. Set market price at last matched price (e.g., midpoint).  
      - All matched trades execute at market price.  
  - **Payoffs**:  
    - Seller: 50 if sold, \(V\) if not.  
    - Buyer: \(V\) if bought, 50 if not.  
  - **Belief report**: All state probability \(P(V=100)\) on paper slip.  

  #### **Round 1: Public Willingness Announcement (Trade Collapse) (10 min)**  
  - **Change from Round 0**: Coarse public protocol replaces call market.  
  - **Mechanism**:  
    - New signals drawn.  
    - Fixed price = 50 (prior expected value).  
    - **Coarse communication protocol** (three sentences only):  
      1. Sellers simultaneously and publicly announce: "SELL" or "PASS".  
      2. Buyers see seller announcements, then simultaneously and publicly announce: "BUY" or "PASS".  
    - **Trading**: Randomly match willing buyers and sellers. Unmatched traders do nothing.  
  - **Payoffs and belief**: Same as Round 0.  
  - **Expected outcome**: Sellers with \(L\) signals announce "SELL". Buyers infer low signals and announce "PASS". Trade collapses.  

  #### **Round 2: Non-Informational Motive (Trade Resumes) (10 min)**  
  - **Change from Round 1**: Add a distressed seller.  
  - **Mechanism**:  
    - New signals drawn.  
    - Randomly assign one seller the "DISTRESSED" card. They must announce "SELL" regardless of signal (e.g., liquidity need).  
    - Repeat public announcement protocol (sellers then buyers).  
    - Match trades as in Round 1.  
  - **Payoffs and belief**: Same, but distressed seller gets penalty: if not matched, lose 20 points (simulates urgency).  
  - **Expected outcome**: Buyers see many "SELL" announcements but know one is distressed, so some still "BUY". Trade resumes.  

  #### **Round 3: Information Acquisition Option (Unrewarding) (15 min)**  
  - **Change from Round 2**: Remove distressed role; add signal purchase.  
  - **Mechanism**:  
    - New signals drawn.  
    - Before announcements, all can buy a second signal for 10 points (cost deducted at end).  
    - Repeat Round 1 protocol (fixed price, public announcements).  
  - **Payoffs and belief**: Same, minus 10 points for second-signal buyers.  
  - **Expected outcome**: Few buy signals (cost outweighs benefit; trade collapse means information isn’t used).  

  ---

  ### **Payoff Scheme**  
  - **No money, no realized value payoffs**: Use a **quadratic scoring rule** for stated probabilities to isolate epistemic effects.  
    - At end of each round, students report \(p = P(V=100)\) on paper slip.  
    - After \(V\) is revealed, score each report:  
      - If \(V = 100\): Score = \(100 \times [1 - (1-p)^2]\)  
      - If \(V = 0\): Score = \(100 \times [1 - p^2]\)  
      (Honest reporting maximizes expected points.)  
  - **Trading outcomes**: Convert to points:  
    - Seller: 50 if sold, \(V\) if not.  
    - Buyer: \(V\) if bought, 50 if not.  
  - **Total score per round**: (Trading points) + (Belief score).  
  - **Final score**: Sum over 4 rounds. Top 50% get 2% course grade boost.  
  - **Why not realized payoffs?** Realized value introduces risk aversion and luck, drowning out epistemic points (e.g., a lucky \(V=100\) masks winner’s curse). Scoring rules ensure incentives align with truthful belief revelation.  

  ---

  ### **Minute-by-Minute Timeline**  
  | Time | Activity | Details |  
  |------|----------|---------|  
  | 0–5 | Setup | Assign roles (11 buyers, 11 sellers). Explain rules, payoffs, scoring. Draw true \(V\) from urn (record secretly). |  
  | 5–15 | **Round 0** | Draw signals. Run call market (TA auctioneer). Belief reports. |  
  | 15–25 | **Round 1** | New signals. Public announcements (sellers→buyers). Match trades. Belief reports. |  
  | 25–35 | **Round 2** | New signals. Assign distressed seller. Public announcements. Match trades. Belief reports. |  
  | 35–50 | **Round 3** | New signals. Offer second signal (cost=10 pts). Public announcements. Match trades. Belief reports. |  
  | 50–55 | Reveal \(V\) | Compute scores (trading + belief - costs). Announce top 50%. |  
  | 55–75 | Debrief | Discuss rounds, map to concepts, raise Hayekian tension (see table below). |  

  ---

  ### **Debrief**  
  Open with: **"What did you think trade signaled in each round? How did that change when we added the distressed seller or signal purchase?"** Then:  

  | Round | Key Moment | Illustrates | Concept |  
  |-------|------------|------------|---------|  
  | 1 | Buyers pass after seeing many "SELL" announcements. | Willingness to trade is evidence against your advantage. | No-trade theorem intuition: "I wouldn't trade with someone who wants to trade with me." |  
  | 2 | Trade resumes despite many "SELL" announcements. | Non-informational motives restart trade; trade now signals mixed evidence (information + distress). | Constraint on trade meaning, not prediction of no trade. |  
  | 0 | Market price (e.g., 60) vs. average belief (e.g., 70). | Price ≠ best estimate; it's conditional on trade, so it builds in winner’s curse correction. | Market price vs. total evidence gap (e.g., price is lower than average belief to offset adverse selection). |  
  | All | Urn-drawn signals and common \(V\). | Rigged common prior enables the results. | Hayekian tension: Markets may not need this! Agents might lack shared priors/hypotheses. |  

  **If no one raises Hayekian objection**:  
  - *Say*: "We assumed a common prior and known hypotheses—drawn from an urn everyone saw. But Hayek argued markets work precisely when agents *don’t* share priors and don’t know all possibilities. Does this setup miss his point?"  

  ---

  ### **What Will Predictably Go Wrong + Handling**  
  1. **"22 people won’t behave like the theorem"**:  
     - *Issue*: Not every pair acts "rationally"; some trade in Round 1.  
     - *Handling*: Stress this is about *average* behavior. Compare aggregate trades: Round 0 (many) vs. Round 1 (few). Say: "The theorem predicts a tendency, not every individual."  

  2. **"Students refuse to trade on principle"**:  
     - *Issue*: Some may avoid trading to "beat the system."  
     - *Handling*: Remind them that points = grade boost; maximizing score requires trading when advantageous. Example: "If you have a strong signal, trading could earn points."  

  3. **"Treating it as a puzzle"**:  
     - *Issue*: A few try to bluff (e.g., announce "SELL" with \(H\) signal).  
     - *Handling*: Pre-empt: "Your goal is to maximize points based *only* on your signal—no gaming." If caught, invalidate their round score.  

  4. **"Blurting signals during announcements"**:  
     - *Issue*: Someone says "I have H!" instead of "BUY."  
     - *Handling*: Interrupt: "Stop! Only ‘BUY/SELL/PASS’ allowed. Any extra info breaks the game." Restart the announcement.  

  5. **"Wrong moral from points"**:  
     - *Issue*: Students think high scorers "won" (e.g., bought in Round 2 when \(V=100\)), missing the epistemic lesson.  
     - *Handling*: In debrief, focus on mechanism changes, not scores. Ask: "Did high scores reflect skill or luck? What did the *design* show?"  

  ---

  ### **What the Activity Cannot Reproduce + Must Lecture On**  
  - **Common-prior assumption**: Urn rigs this visibly; lecture on why Hayekians reject it.  
  - **Iterated higher-order reasoning**: Game shows one level (e.g., "sellers selling → buyers update"); lecture on how no-trade theorems use infinite regress ("I know that you know...").  
  - **Risk neutrality**: Scoring rule induces it; note real markets have risk aversion.  
  - **Zero transaction costs**: Game has no costs; lecture on how costs affect trade.  
  - **No speculative trade ≠ no gains from trade**: Game shows non-informational motives restart trade; clarify that no-trade theorems allow gains from hedging/liquidity.  
  - **Additional gaps**:  
    - **Continuous prices**: Game uses fixed/clearing prices; lecture on how granular prices reveal more information.  
    - **Price formation dynamics**: Game’s call market is static; lecture on how repeated trading aggregates information incrementally.  

  This design delivers all four points in a runnable 75-minute package, using physical urns and coarse protocols to make the tensions visceral. Adjust signal counts if needed (e.g., for 22 students, ensure 18:4 H:L ratio when \(V=100\), 4:18 when \(V=0\)), but the ratios preserve intuition. Good luck!
