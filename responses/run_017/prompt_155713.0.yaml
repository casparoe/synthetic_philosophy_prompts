prompt: |-
  I am one of two student members of my school's Permanent Collection Committee, which each spring decides which works by graduating students the school acquires and hangs permanently. I have gone back through six years of our minutes, and I think our rulings hang together rather less well than we like to suppose, so I would be grateful for your help before we meet on Tuesday.

  Our precedents, as I read them:

  1. We declined an archival print of a student's own watercolour — edition of one, signed by her, the painting itself kept at home — on the ground that it is a record of a work rather than a work.
  2. We acquired a bronze in an edition of six, poured at a commercial foundry from the student's own mould; she never touched the metal or the patina.
  3. We declined a hand-painted, nearly indistinguishable copy of a well-known painting by someone else, even though several members admitted they could not have told the two apart; looking identical, the minute says, is not the point.
  4. We accepted as an original historic work a 1974 woven wall hanging by a former student, re-woven two years ago by a current student who replaced roughly two-thirds of the material.
  5. We declined a painting whose underdrawing was the submitter's but whose brushwork was almost entirely her friend's, and which the submitter signed alone.
  6. We accepted a mural painted by twelve students and credited to all twelve, with no single author named.

  The case before us now: a senior's welded steel figure was destroyed in a workshop accident about a fortnight before we were to view it; it had never been exhibited, accessioned, or photographed by anyone but herself. She has since rebuilt it by hand — from her own maquette, her own snapshots, and her working notes — in new steel, and she says the second object is the better one and the one she wants us to take. She has disclosed all of this to us in writing, so no one is being misled about its history.

  Please reply in exactly five numbered items, one or two sentences each, with no introduction and no concluding summary:

  1. The two or three rules about what makes something an original that fit all six of our precedents at once.
  2. What each of those rules predicts about this submission.
  3. Your recommendation for Tuesday with the one reason that decides it for you, and, if you think our precedents genuinely underdetermine the case, the principle we would be committing ourselves to with each choice.
  4. Which of the six precedents is the closest analog to this case, and why the others can be distinguished from it.
  5. One further case, stated in the same concrete way as ours, that would settle which of those rules we have really been running.
reasoning: |-
  Okay, the user is part of a school committee deciding on artwork acquisitions and needs help interpreting their precedents for a new case. They've provided six past decisions and a current dilemma about a rebuilt sculpture. 

  Hmm, the key tension seems to be between physical authenticity and creative authorship. Precedent 1 rejects a reproduction even when made by the artist, while precedent 2 accepts a foundry-made bronze. Precedent 4 is particularly interesting - they accepted a re-woven work where most material was replaced, suggesting process continuity matters more than original materials. 

  For the current case... The student rebuilt her destroyed sculpture using her own references. Since she did it herself and improved it, this feels closer to precedent 4 than precedent 1. But precedent 1 involved the artist reproducing their own work too... Ah! The difference is medium: precedent 1 was a different medium (print vs painting), while here it's the same medium and process. 

  *scribbles notes* The mural precedent (6) shows they value collective authorship, which isn't relevant here. The copy case (3) emphasizes originality over skill, which supports accepting this recreation since it's her original design. 

  *checks precedents again* Precedent 5's rejection of collaborative work without credit makes me think sole authorship is key - which this student maintains. The tricky part is whether the recreation is "the work" or a new version. Given precedent 4's acceptance of major restoration, I'd argue yes. 

  For the hypothetical future case... A reprinted photo would test if they value the physical object (reject) or the artist's intent (accept). That'd clarify whether precedent 2's foundry acceptance was about industrial process or creative control. 

  *adjusts glasses* Final thought: If they accept this, they're prioritizing the artist's creative authority over object history. Which seems consistent with precedents 2, 4 and 6.
answer: |-
  Here are the requested five numbered items:

  1.  Rules of originality: (a) The work must embody the artist's own creative conception and execution (or direct supervision per industrial processes); (b) The specific physical object presented must be the primary vessel of that conception, not a derivative record; (c) Sole or primary authorship must be clearly attributable and undisputed.

  2.  Predictions: (a) Her conception and hand-rebuilding meet authorship; (b) The *second* sculpture is the primary object presented, not the destroyed original, risking derivative status; (c) Her sole authorship is clear.

  3.  Recommendation: **Decline the submission**. The decisive reason is that the object presented is a *reconstruction* (a derivative record of the lost original work) rather than the original work itself, violating rule (b). Precedents underdetermine slightly: Accepting commits to valuing artist-sanctioned recreation; declining commits to valuing the unique physical genesis.

  4.  Closest analog: **Precedent 1 (declined archival print)**. Both involve the artist creating a new, accurate record of a lost/distant original work in the same medium. Distinctions: Precedent 2 involved *initial* industrial fabrication under artist control; 4 involved *restoration* of an existing historic object; 3/5/6 involve authorship disputes absent here.

  5.  Settling case: A student submits a large-scale photograph printed yesterday from their original digital file created and exhibited two years prior, arguing it is the definitive version. Acceptance would prioritize conception; rejection would prioritize the specific initial physical instantiation.
