answer: |-
  Below is a step-by-step procedure designed to meet your requirements: it incorporates the outside view while addressing your three cruxes (sealed reference class, stationarity, and uniqueness claims), fits within half a working day, and is executable by non-statisticians. The procedure is structured as a linear workflow with clear exit points for when the outside view fails or requires human judgment. I'll first outline the steps, then apply them to your three live questions.

  ---

  ### **Procedure for Forecasting Political Order Durability**
  **Goal**: Produce a forecast (probability or duration estimate) for the persistence of a political order, using the outside view as an anchor adjusted by the inside view.  
  **Time constraint**: 4 hours per forecast (adjustable per step).  
  **Team skills**: Graduate training in history/political science; basic spreadsheet proficiency.  
  **Key principles**:  
  - **Sealed reference class**: Cases must be identifiable at the forecast date using only information available then; no hindsight bias.  
  - **Stationarity check**: Reject unstable base rates; require drift justification if used.  
  - **Uniqueness handling**: Restate "unique" claims as testable predicates applied blindly to history.  
  - **Exit rules**: Stop if reference class <8 cases, outcome is contested/unresolvable, or values/definitions dominate.  
  - **Adjustment limits**: Inside view can shift the anchor by ±20% for probabilities or ±30% for durations.  

  #### **Step-by-Step Workflow**
  1. **Define the outcome and time horizon (15 mins)**  
     - **Task**: Specify the event (e.g., "state collapse"), time horizon (e.g., 25 years), and measurable criteria (e.g., "loss of fiscal authority"). Resolve contested definitions upfront.  
     - **Adequate answer**: Clear, testable definitions (e.g., "fiscal authority pooled if federal tax share >20%"). If definitions are contested (e.g., "same polity" ambiguities), list alternatives and proceed with the most defensible.  
     - **Exit**: Stop if no agreement on definitions (e.g., "capacity to tax" is irreconcilable with "ruling coalition continuity"). Hand back to human judgment.  
     - **Confidence in improvement**: **High**. Forces specificity, reducing story-driven vagueness.  

  2. **Construct the reference class (60 mins)**  
     - **Task**: Identify historical cases using the **sealed reference class rule**:  
       - Brainstorm cases *without* outcome knowledge (use historical archives/databases from the forecast date).  
       - Include only cases that were knowable at the time (e.g., "all federal unions in 1800").  
       - Exclude cases if selection depended on outcome (e.g., "failed states" lists compiled post-collapse).  
     - **Adequate answer**: A list of 5+ cases with sources/timestamps proving pre-outcome knowability. Document exclusions.  
     - **Exit**: If cases <8, proceed to Step 5 but flag low confidence; if cases <3, stop and return no number (rely on inside view).  
     - **Confidence in improvement**: **High**. Mitigates cherry-picking and survivorship bias.  

  3. **Stationarity check (30 mins)**  
     - **Task**: Split reference class into ≥2 time-based subgroups (e.g., pre-/post-1945). Calculate base rates (e.g., % collapsed in 25 years) or median durations per subgroup.  
     - **Adequate answer**: Base rates/durations for each subgroup. If rates differ by >20 percentage points or durations by >30%, reject a single base rate as unstable.  
     - **Non-stationarity handling**:  
       - If unstable, do not quote a single rate unless you can justify drift direction (e.g., "collapses decline due to nuclear deterrence"). State the rationale explicitly.  
       - Otherwise, report subgroup rates separately.  
     - **Exit**: If instability is unresolved, return no single number; proceed with subgroup rates if justifiable.  
     - **Confidence in improvement**: **Moderate**. Adds rigor but period-splitting can be arbitrary with small classes.  
       - **Least confident step**: Non-statisticians may misjudge drift justifications; backtests (Step 9) are essential.  

  4. **Handle uniqueness claims (30 mins)**  
     - **Task**: If inside view argues "this case is unique," restate the claim as a **testable predicate** (e.g., "has nuclear deterrence," "facing climate-induced migration"). Apply it blindly to the reference class.  
     - **Adequate answer**: Subgroup of cases meeting the predicate. If subgroup ≥5, use its base rate; if <5, use the full class but flag the claim.  
     - **Exit**: If no testable predicate is possible (e.g., "uniquely divine mandate"), hand back to human judgment.  
     - **Confidence in improvement**: **High**. Converts subjective claims into falsifiable filters.  

  5. **Compute the base rate anchor (30 mins)**  
     - **Task**: Calculate:  
       - For binary outcomes (e.g., "survives 25 years?"): % of cases with the outcome.  
       - For durations (e.g., "how long sanctions last?"): Median duration of cases. Ignore censored data (ongoing cases) unless >50% are censored.  
     - **Small-class rules**:  
       - If class = 3–7 cases: Report the rate but do not anchor to it; treat as one input among many.  
       - If class ≥8: Set as anchor.  
     - **Adequate answer**: A single number (probability or duration) with case count.  
     - **Exit**: Stop if outcome data is contested (e.g., two sources dispute if a polity persisted). Hand back to humans.  
     - **Confidence in improvement**: **Moderate**. Simple but loses nuance (e.g., censored data).  

  6. **Adjust from the anchor (15 mins)**  
     - **Task**: Allow inside view adjustments, but **cap deviations**:  
       - Probabilities: ±20 percentage points (e.g., 60% → 40–80%).  
       - Durations: ±30% (e.g., 10 years → 7–13 years).  
       - Justify adjustments with evidence not in the reference class (e.g., "new cyberwarfare threat").  
     - **Adequate answer**: Final forecast with adjustment rationale and capped range.  
     - **Confidence in improvement**: **High**. Limits story-driven overconfidence.  

  7. **Address self-affecting forecasts (15 mins)**  
     - **Task**: If the forecast could influence the outcome (e.g., predicting sanctions collapse spurs defections):  
       - Note the risk and model two scenarios (forecast public vs. private).  
       - Do not quantify; flag for human judgment.  
     - **Adequate answer**: Qualitative note in the report.  
     - **Confidence in improvement**: **Moderate**. Highlights reflexivity but doesn't resolve it.  

  8. **Backtest and documentation (45 mins, but amortized over time)**  
     - **Task**: For each forecast, document all steps (reference class, adjustments, rationale). For backtests:  
       - Quarterly, take 2–3 past forecasts (mask outcomes), rerun this procedure, and compare base-rate vs. inside-view accuracy.  
     - **Adequate answer**: Backtest log showing if the base rate "beat" the story-driven forecast.  
     - **Confidence in improvement**: **High**. Creates accountability and tests the method.  

  ---

  ### **End-to-End Runs on Live Questions**
  **Assumptions**:  
  - Team has pre-loaded historical datasets (e.g., Correlates of War, Hufbauer sanctions data).  
  - Forecast date = today (2023); outcomes masked for backtesting.  
  - Senior colleague review: All steps documented for transparency.  

  #### **Question 1: Will [Large Continental Federal Union] pool fiscal authority in 25 years?**  
  - **Step 1 (Define outcome)**: "Fiscal authority pooled" = federal tax share >25% of total revenue. Time horizon = 25 years. Adequate.  
  - **Step 2 (Reference class)**:  
    - Sealed class: Federal unions with >5 states, identifiable at their "start" (e.g., formation or major reorganization). Cases: U.S. (1789), Canada (1867), Australia (1901), EU (Maastricht 1993), Brazil (1891), Argentina (1853), Germany (1871/1949), India (1950).  
    - Exclusions: Historical unions unknowable at the time (e.g., Holy Roman Empire) or selected post-collapse (e.g., USSR).  
    - Cases = 8 → Proceed.  
  - **Step 3 (Stationarity)**:  
    - Split: Pre-1950 (U.S., Canada, Argentina, Germany) vs. post-1950 (Australia, EU, Brazil, India).  
    - Pre-1950 base rate (survived 25 years with fiscal pooling): 3/4 (75% — Germany 1871 collapsed post-WWI).  
    - Post-1950 base rate: 4/4 (100%).  
    - Difference = 25% (>20% threshold) → unstable. Justified drift: "Post-1950, globalization increased union stability." Use post-1950 rate (100%) as anchor.  
  - **Step 4 (Uniqueness)**: Inside view claims uniqueness due to "digital currency integration." Predicate: "Has a federally controlled digital currency." Applied blindly: No historical cases (subgroup=0) → use anchor (100%).  
  - **Step 5 (Base rate)**: Anchor = 100% probability.  
  - **Step 6 (Adjust)**: Inside view cites rising secessionism. Adjustment: Cap allows 100% → 80%. Final forecast: 80% probability.  
  - **Step 7 (Self-affecting)**: Not applicable.  
  - **Result**: **80% chance** of fiscal pooling in 25 years.  

  #### **Question 2: How long will [Multilateral Sanctions Coalition] hold after the initial shock?**  
  - **Step 1 (Define outcome)**: "Coalition holds" = no key member (>10% of sanctions) withdraws. "Initial shock" = first 6 months. Outcome = duration in years. Adequate.  
  - **Step 2 (Reference class)**:  
    - Sealed class: Coalitions >3 states, post-WWII, identifiable at shock end (e.g., UN resolutions). Cases: Iraq 1990s (UNSC), Iran 2000s (UNSC), South Africa 1980s (Commonwealth), Haiti 1990s (OAS), Libya 2011 (UNSC), Myanmar 2021 (EU-led).  
    - Exclusions: Coalitions defined by outcome (e.g., "successful sanctions" lists). Cases = 6 → Flag (n<8) but proceed.  
  - **Step 3 (Stationarity)**:  
    - Split: Pre-2000 (Iraq, S. Africa, Haiti) vs. post-2000 (Iran, Libya, Myanmar).  
    - Median duration pre-2000: 8 years (Iraq: 13, S. Africa: 5, Haiti: 3).  
    - Post-2000: 4 years (Iran: 10, Libya: 2, Myanmar: ongoing → exclude censored).  
    - Difference: 8 vs. 4 (>30% threshold) → unstable. No drift justification → report subgroups only.  
  - **Step 4 (Uniqueness)**: Claim: "Coalition is unique due to energy interdependence." Predicate: "Target is a top-5 energy exporter." Applied: Iraq (yes), Iran (yes), Libya (yes), others (no). Subgroup = 3 (<5) → use full class.  
  - **Step 5 (Base rate)**: Full class median duration = 6.5 years (cases: 5, excluding Myanmar).  
  - **Step 6 (Adjust)**: Inside view argues "crisis fatigue"; adjust down 30% → 4.5 years.  
  - **Result**: **4–5 years** (adjusted from 6.5-year anchor).  

  #### **Question 3: Is [Great Power Alliance Network] qualitatively new with no historical analogue?**  
  - **Step 1 (Define outcome)**: Forecast = durability (e.g., "years until a major ally defects"), but house view challenges analogue existence.  
  - **Step 2 (Reference class)**:  
    - Sealed class: "Great power" (top-5 military budget) with ≥10 formal allies. Cases: U.S. (NATO, 1949), USSR (Warsaw Pact, 1955), France (Entente Cordiale network, 1904).  
    - Cases = 3 (<8) → **stop and return no number**.  
  - **Step 4 (Uniqueness)**: House view: "Network is unique due to AI-integrated defense." Predicate: "Has joint AI-command systems." Applied blindly: No historical cases → supports uniqueness, but no base rate.  
  - **Procedure outcome**: **No usable number**. Hand back to inside view.  

  ---

  ### **Critical Weaknesses and Mitigations**
  - **Least confident step**: **Stationarity check (Step 3)**. With small classes, splits become arbitrary, and drift justifications may be ad hoc. Mitigation: Use backtests to validate stability thresholds.  
  - **For your senior colleague**: Frame this as "structured humility" — not numerology but a bias-check against overfitting stories. The sealed reference class and backtests make it self-correcting.  
  - **Biggest improvement**: Forces explicit definitions and tests uniqueness claims, reducing narrative overconfidence. Backtests (Step 9) are the ultimate validator.  

  This procedure embeds the outside view pragmatically: it halts when history is silent (e.g., Q3) but disciplines the inside view when data exists (e.g., Q1–Q2). Run it for 3–6 months with backtests to demonstrate value to skeptics.
