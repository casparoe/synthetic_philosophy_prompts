  Steps of the Procedure:

  1. **Define the Outcome and Time Horizon**:
     - Clearly define the event to be forecasted (e.g., "the federal union still pools fiscal authority in 25 years") and the time horizon (if applicable).
     - For contested outcomes (e.g., what counts as the same polity), pre-define criteria and note any ambiguity. If necessary, use multiple definitions and run parallel analyses.
     - *Adequate answer*: A specific, testable definition of the outcome and time horizon. If the outcome is too contested to define, stop and return no number.

  2. **Construct the Reference Class**:
     - Apply the sealed reference class rule: 
       - Identify historical cases that could have been named at the forecast date (using only information available then).
       - Cases must not be selected based on knowing the outcome (avoid survivorship bias).
       - The class should consist of cases that are relevantly similar to the target (e.g., other federal unions, sanctions coalitions, etc.).
     - Steps:
       a. Brainstorm candidate cases without looking at outcomes.
       b. For each candidate, verify that it meets the information-at-the-time criterion (e.g., using historical sources from the time).
       c. Record the list of included cases and the reasons for inclusion/exclusion.
     - *Adequate answer*: A list of cases with clear inclusion criteria. If fewer than 8 cases are found, proceed but flag the small sample (see step 5). If no cases, stop and return to inside view.

  3. **Stationarity Check**:
     - Split the reference class into at least two time periods (e.g., pre- and post-1945, or by century) and compute the base rate (proportion of cases with the outcome) in each period.
     - If the base rates are similar (e.g., within 20 percentage points) and show no clear trend, use the overall base rate.
     - If they differ substantially or show a trend, do not combine. Instead:
       - Use the most recent period if it has at least 5 cases and there's a reason to believe recent conditions are more relevant.
       - Otherwise, do not quote a single base rate; instead, report the range and note the non-stationarity. The forecaster must then decide whether to adjust the base rate (with justification) or not use it.
     - *Adequate answer*: A table of base rates by period and a decision on stationarity. If non-stationarity is found and cannot be resolved, the base rate step may be skipped.

  4. **Handle Claims of Uniqueness**:
     - If the inside view argues the target case is unique, require that the uniqueness claim be restated as a testable predicate (e.g., "has a common currency", "faced a major external threat") that can be applied to historical cases without knowing outcomes.
     - Apply this predicate to the reference class to create a subgroup. Report the base rate for this subgroup.
     - If the subgroup has at least 5 cases, use that base rate. Otherwise, use the overall class but note the uniqueness claim and the small subgroup.
     - *Adequate answer*: The predicate, the subgroup it selects, and the base rate for that subgroup (if n>=5) or the overall class (if n<5 or no subgroup). If no predicate can be formulated, the uniqueness claim is invalid for adjustment.

  5. **Compute the Base Rate**:
     - Calculate the overall base rate (if stationarity holds) or the adjusted base rate (from the subgroup or recent period) as the anchor.
     - For time-to-event outcomes (e.g., how long a coalition holds), compute the survival curve (if possible) or the median/mean duration. Use Kaplan-Meier if censored data exists (but note: non-statisticians can approximate by ignoring censoring if few censored cases, or use a simple average of observed durations).
     - *Adequate answer*: A base rate (probability) or duration estimate, with the sample size and the list of cases.

  6. **Adjust from the Anchor**:
     - The inside view may adjust the anchor, but only by a limited amount. The procedure caps the adjustment at ±20 percentage points for probabilities (e.g., base rate 60% can be adjusted to 40-80%) or ±30% for durations (e.g., base duration 10 years can be adjusted to 7-13 years).
     - The adjustment must be justified by specific, evidence-based factors that are not already reflected in the base rate (e.g., a factor that was used to define the subgroup in step 4 cannot be used again).
     - *Adequate answer*: The adjusted forecast with a clear justification for the adjustment and the amount.

  7. **Handle Small Reference Classes (n<8)**:
     - If the reference class has fewer than 8 cases, do not use the base rate as the anchor. Instead, use the base rate as one input among others (e.g., in a structured discussion). The inside view adjustment is then not capped by the above rule, but the base rate must still be reported and considered.
     - Alternatively, if the class is too small, skip the base rate and rely solely on the inside view (but note this in the report).

  8. **Feedback Loops and Self-Defeating/Reinforcing Forecasts**:
     - If the forecast might influence the outcome (e.g., publishing a forecast of coalition collapse might hasten it), note this and consider two scenarios: one where the forecast is made public and one where it isn't. The procedure doesn't resolve this but flags it for human judgment.

  9. **Backtesting Protocol**:
     - Periodically, take past forecasts (with outcomes masked) and re-run the procedure to compute what the base rate forecast would have been. Compare with the actual inside-view forecast and the outcome. Record whether the base rate would have been more accurate.

  10. **Documentation and Review**:
