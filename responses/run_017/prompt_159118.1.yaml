prompt: |-
  So I got talked into volunteering with the county land trust last spring — mostly weekend plant surveys — and somehow I've ended up being the person who has to write the rare-species justification for a 60-acre bog the trust is trying to buy before a developer does. Whether we get the state grant pretty much comes down to whether the retired state naturalist (Dave, who more or less *is* the state list, been at it since the 80s) says there's a listable species on the parcel. I've been going back thru twenty years of his site reports trying to reverse-engineer his rule, and I can fit most of them but not all:

  - two woodland salamanders that look basically identical but are deeply divergent genetically and don't interbreed where their ranges meet: two species (he said something like morphology can go hang)
  - dogs and wolves: one species
  - two oaks, upland and bottomland, that hybridize all over a broad contact zone with tons of fertile hybrids, but each parent type stays recognizable and they're something like 95% distinct genome-wide: two species (the hybrid swarm doesn't seem to bother him)
  - two forms of a grass on and off serpentine soil in the same meadow, different flowering time, maybe 15–20% gene flow, genetically near-identical except for a couple of regions: one species, ecotypes
  - the local apomictic dandelion mess, hundreds of near-identical clonal lineages: one species (he is not naming four hundred dandelions)
  - a fern that started as a hybrid between two species, then doubled its chromosomes, can't breed with either parent, and lives in a different habitat: yes, real species
  - an isolated population of a common snake 200 miles from its nearest relatives, slightly different colour, would presumably interbreed if the habitat in between hadn't been plowed: subspecies at best
  - two forms of the same organism from a lake sediment core 8000 years apart with intermediates all the way through: he basically refused to answer, said species are things that can meet

  Here's our case. Two forms of a small white-flowered wetland plant (I'll call them the bog form and the ridge form) growing about 300 m apart with no barrier between them. The bog form flowers roughly three weeks earlier, has a narrower corolla, a different scent, and is visited almost entirely by one small specialist bee; the ridge form is visited by flies and generalist bees. In a common garden the height difference vanishes but the flowering-time and flower-shape differences stay. Hand crosses in either direction give fully fertile seed, and the F1s and F2s are fine in the greenhouse. In the field, markers say maybe 8–10% of the seeds near the contact are cross-sired; hybrids turn up almost only in a narrow ecotone band and set about a third as much seed as either parent, because pollinators basically ignore the intermediate flowers. A genome scan with a few thousand markers finds them near-identical genome-wide, with all the differentiation bunched into a handful of regions — flowering time, corolla shape, scent. And the kicker: a bog 25 km away has the same bog look and the same specialist bee, but genetically it sits closer to the ridge populations near *it* than to our bog form, so the bog thing looks like it's evolved at least twice.

  What I want: does Dave call this one species or two? More usefully — give me the two or three rules that fit all eight of his verdicts above, say what each one predicts about our bog, and tell me which one he's most likely actually running. I genuinely can't tell whether the oaks verdict means "gene flow doesn't matter as long as the gene pool holds its shape, because selection keeps knocking out the intermediates" (which would make ours two) or "there has to be genome-wide divergence, not just a few islands" (which, especially with the bog form arising twice, would make ours one). The serpentine grass looks annoyingly close to our case, and I'm not sure the pollinator switch plus the polyphyly is enough to distinguish them. Also: if I can only go measure one more thing this summer, what should it be, and what hypothetical case would settle which rule he's using if I ever get him to commit to one in writing?

  Be honest about confidence: I'd rather get "60/40, and here's the finding that would flip me" or "this is a coin flip and here's why the facts as you've described them underdetermine it" than a clean verdict. And if the framing is confused — say, if "what would Dave say" can't really be pried apart from "what the species concept ought to be here," or if I've set the case up so that no stable rule gives an answer — say that plainly rather than playing along and picking one.
reasoning: |-
  Okay, let me try to figure out how Dave would classify these two forms of the wetland plant. The user has given several examples of Dave's past decisions, so I need to find a consistent set of rules that explain all of them. 

  First, looking at the salamanders: Dave considers them two species despite looking identical because they're genetically divergent and don't interbreed. So for him, reproductive isolation seems key, not morphology. 

  Then dogs and wolves are one species—they can interbreed and produce fertile offspring, so gene flow is possible. 

  The oaks hybridize but remain distinct, so even with gene flow, if they maintain differences, they're separate species. The serpentine grass has gene flow and minor differences, but he calls them one species with ecotypes. The dandelions are clones but one species—probably because taxonomically it's impractical to split them. The fern hybrid is a new species since it can't breed with parents and has a new niche. The snake is only a subspecies since it could interbreed if not for human barriers. The sediment core isn't a species because they can't coexist.

  Now for the wetland plants: they're 300m apart with no barriers. Flowering time and shape differ, pollinators differ, hybrids have reduced fitness (less seed set). Genome-wide they're similar except for a few regions related to their differences. The bog form evolved twice, polyphyly. 

  Comparing to the serpentine grass: both have some gene flow and localized genomic differences. But here, pollinator isolation and hybrid fitness might push Dave towards two species. The oaks had high gene flow but maintained distinctness, similar here. The polyphyly might not matter if current reproductive barriers are strong. 

  Key for Dave seems to be whether there's persistent reproductive isolation maintaining distinct groups. Here, hybrids have low fitness and are mostly in a narrow zone, suggesting selection against mixing. Plus, the pollinator specialization acts as a barrier. So even with some gene flow and polyphyly, he might see two species. 

  But the serpentine grass was one species. The difference? Here, hybrids have reduced fitness (1/3 seed set), while in the grass, gene flow was 15-20% without mentioned fitness costs. Also, the flowering time difference here is three weeks vs. the grass's slight shift. The pollinator specificity here is stronger. 

  So rules: 1) Persistent distinctness maintained by reproductive isolation, even with some gene flow. 2) Genome-wide divergence not required; islands of divergence can suffice if they cause barriers. 3) Hybrid fitness matters—low fitness supports separation. 

  For the bog plant, rules 1 and 2 suggest two species. The polyphyly might not matter if current barriers exist. 

  If I could measure one more thing: hybrid fitness in the field over time. If hybrids are consistently unfit, that reinforces two species. A hypothetical to test Dave's rule: two populations with strong assortative mating but no genetic divergence—would he call them one species? If yes, then he prioritizes gene flow over reproductive barriers.
answer: |-
  Based on Dave's pattern of judgments and the biological details of your wetland plant, here's a breakdown of the likely rules he's applying, the prediction for your case, and recommendations for next steps. The analysis suggests **Dave is most likely to classify your bog and ridge forms as TWO SPECIES (≈70% confidence)**, but key uncertainties remain.

  ### Dave's Implicit Rules (Explaining All 8 Verdicts)
  1.  **Reproductive Isolation as the Core Criterion:** Dave prioritizes *current barriers to gene flow that maintain distinctness in sympatry* over historical divergence, morphology, or genomic divergence alone. Hybridization or gene flow doesn't automatically collapse species status *if* strong reproductive isolation (pre- or post-zygotic) maintains distinct evolutionary trajectories where populations meet.
      *   *Fits:* Salamanders (no interbreeding), Oaks (hybrids don't swamp parental forms), Fern (can't breed with parents), Snake (would interbreed if sympatric), Sediment core ("things that can meet").
      *   *Contrasts:* Dogs/Wolves (freely interbreed), Serpentine Grass (significant gene flow), Dandelions (effectively no interbreeding barriers despite clonality).
  2.  **Fitness of Hybrids/Intermediates is Decisive:** When hybridization occurs, the critical factor is whether hybrids have substantially reduced fitness *in nature* relative to parental forms, preventing homogenization.
      *   *Fits:* Oaks (hybrids fertile but parental forms "stay recognizable" - implies selection maintains distinctness), Fern (hybrid inviable with parents), Snake (no barrier implies no fitness cost if sympatric), Serpentine Grass (gene flow implies hybrids/intermediates are fit).
      *   *Contrasts:* Dogs/Wolves (hybrids fit).
  3.  **"Species" Require Co-Occurrence Potential:** Divergent lineages only qualify as distinct species if they *could* encounter each other and the barriers would hold. Purely allopatric divergence isn't sufficient for full species status without evidence of strong intrinsic barriers.
      *   *Fits:* Snake (isolated, would interbreed), Sediment core (can't meet), Salamanders/Oaks/Fern (meet and barriers hold), Serpentine Grass (meet and gene flow occurs).
      *   *Contrasts:* None contradict this.

  ### Application to Your Wetland Plant (Bog vs. Ridge Forms)
  *   **Rule 1 (Reproductive Isolation):** **Strong Support for TWO SPECIES.**
      *   They co-occur within 300m (sympatry potential exists).
      *   Strong pre-zygotic barriers: Phenological isolation (3-week flowering difference), pollinator isolation (different primary visitors), floral morphology/scent differences reinforcing pollinator fidelity.
      *   Strong post-zygotic barrier in nature: Hybrids in the ecotone set only ≈1/3 the seed of parentals due to pollinator avoidance ("pollinators basically ignore the intermediate flowers"). This represents a significant fitness cost *in the wild*.
      *   Low realized gene flow (8-10%) despite proximity and cross-fertility in the greenhouse highlights the effectiveness of these barriers in nature.
  *   **Rule 2 (Hybrid Fitness):** **Strong Support for TWO SPECIES.**
      *   The dramatically reduced seed set of hybrids in the field (≈33% of parentals) is a key fitness cost preventing homogenization. This parallels his oak judgment (hybrids fertile but distinct forms persist due to selection) and contrasts with the serpentine grass (gene flow implies hybrids *are* fit).
  *   **Rule 3 (Co-Occurrence):** **Supports Evaluation.** They meet and barriers hold in a narrow ecotone.
  *   **The Wrinkles:**
      *   **Serpentine Grass Similarity:** The critical difference is **hybrid fitness**. The grass has 15-20% gene flow, implying hybrids *are* fit and successful, allowing gene exchange. Your plants have low gene flow *and* hybrids have low fitness. Dave cares about the *outcome* (distinct forms persist) driven by selection against intermediates.
      *   **Polyphyly (Bog Form Evolved Twice):** Dave's judgments focus on *current* barriers where populations meet, not historical origins. The salamanders are "deeply divergent genetically" but his verdict hinges on *current* lack of interbreeding where they meet. The polyphyly is fascinating evolutionarily but likely irrelevant to Dave's operational call for *this* contact zone. What matters is the barrier *here*.
      *   **Genomic Similarity:** Like the serpentine grass, divergence is concentrated in islands. However, your islands control key reproductive traits (flowering time, shape, scent). Dave prioritizes the functional outcome (isolation) over the amount of the genome involved ("morphology can go hang" reinforces this). This contrasts with the snake, where no functional barriers exist beyond geography.

  **Prediction:** Dave likely calls this **TWO SPECIES**. The combination of strong, multifaceted pre-zygotic barriers and a significant post-zygotic fitness cost for hybrids in sympatry, preventing homogenization despite proximity and cross-fertility, aligns perfectly with his oak verdict and distinguishes it crucially from the serpentine grass. The polyphyly and genomic architecture are secondary to the functional isolation maintaining distinctness where they co-occur.

  ### What to Measure Next (The Decisive Data Point)
  *   **Measure: Hybrid fitness components BEYOND seed set in the FIELD.**
      *   Specifically: **Seed germination rate, seedling survival, growth rate, and eventual reproductive success (flowers & seeds produced) of F1 and F2 hybrids COMPARED TO PARENTAL TYPES under natural field conditions** (bog, ridge, and ecotone).
  *   **Why:**
      *   Seed set is only one component of fitness. If hybrids germinate poorly, die young, or are weak competitors/reproducers *even if they set some seed*, the *total* fitness cost is much higher, strengthening the "two species" argument under Rule 2.
      *   If hybrid seeds germinate well and seedlings thrive comparably to parentals, it weakens the post-zygotic barrier argument. Seed set reduction might be partially offset, making the case closer to the serpentine grass (significant gene flow possible despite some selection).
      *   This directly tests the robustness of the barrier maintaining distinctness – the core of Dave's logic.

  ### Hypothetical Case to Settle Dave's Rule
  To distinguish between "gene flow doesn't matter if distinctness holds" (oak/your plant view) vs. "genome-wide divergence needed" (serpentine grass view), pose this:
  > **"Imagine two populations of insects in the same forest. Population A lives on oak leaves, Population B on maple leaves. They show strong assortative mating based on host plant odor (99% mate on their own plant). Lab crosses show fully fertile offspring with no fitness loss. Genome scans reveal near-identity except for a few tightly linked loci controlling host preference and cuticular hydrocarbons involved in mate recognition. In the contact zone, only 1% hybridization occurs due to host fidelity. Are these one species or two?"**

  *   **What Dave Should Say if Rule 1/2 Dominate:** TWO SPECIES. Strong pre-zygotic isolation maintains distinctness despite genomic similarity and no intrinsic post-zygotic barriers. Parallels your plant and oaks.
  *   **What Dave Should Say if Genomic Divergence Dominates:** ONE SPECIES. Parallels serpentine grass – gene flow possible, no intrinsic hybrid issues, divergence minimal/localized.
  *   This isolates the critical factor: Is the *maintenance of distinctness by contemporary barriers in sympatry* sufficient, or is *significant genome-wide divergence* the ultimate requirement?

  ### Confidence & Caveats
  *   **Confidence in "Two Species" Prediction:** ≈70%. The strong pollinator-mediated isolation and documented hybrid seed set reduction in the field are compelling evidence aligning with his oak and salamander judgments. The polyphyly is a red herring for his operational definition.
  *   **Why Not 100%?**
      *   The serpentine grass case *is* similar superficially (local adaptation, island divergence, some gene flow). The key distinction (hybrid fitness) rests on a single data point (seed set). Confirming broader hybrid fitness (see above) is crucial.
      *   The 8-10% gene flow is non-zero. Dave might see this as "significant enough" to warrant "ecotypes" if hybrid fitness isn't *severely* compromised overall.
      *   He might find the parallel evolution of the bog phenotype intriguing and argue it shows the "ridge" form is inherently adaptable, weakening the need for a split (though this contradicts his focus on local barriers).
  *   **Framing:** You've brilliantly isolated Dave's pragmatic, isolation-focused concept. "What would Dave say?" *is* separable here because his pattern reveals a consistent operational definition focused on current sympatric barriers and hybrid fitness, distinct from strict adherence to BSC, PSC, or ESC. The facts *do* underdetermine it slightly due to the hybrid fitness measurement gap, but they strongly point towards "two species" under his established pattern.

  **Recommendation:** Measure hybrid fitness comprehensively in the field. If it confirms low hybrid performance across multiple stages, present the case confidently emphasizing the *functional reproductive isolation and selection against hybrids maintaining distinct parental forms in sympatry*, directly paralleling his oak verdict. If hybrid fitness is higher than seed set suggests, acknowledge the similarity to the serpentine grass but stress the stronger pre-zygotic barriers and ask how much gene flow is "too much" for him. Good luck with Dave and the grant!
