  We are given five cases and a tentative principle. We need to test the principle against the cases, repair it as needed, and then apply it to a new case. We also need to state which of the original verdicts might have to be given up if no coherent principle can accommodate all.

  The tentative principle: 
  "A heritability estimate licenses causal claims only about differences between individuals within the population and the range of environments actually studied, and licenses nothing about differences between group means, nothing about what produces a trait in an individual as opposed to what makes individuals differ from one another, and nothing about immutability."

