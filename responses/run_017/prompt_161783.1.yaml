prompt: |-
  hey, so im on this committee at my school (me, three other students, and our vice principal) and we have to hand the principal an actual recommendation by april 12 about how next years student council gets chosen. right now its elections and theyre kind of a joke: turnout was about 12% last year, the same friend group wins basically every seat, and the councils real jobs are handing out roughly $8000 of club funding, writing one non-binding recommendation to the administration about the dress code, and planning spring fest.

  people keep arguing between (a) keep elections but patch them — ranked choice, reserved seats, campaign rules — and (b) drop elections and pick the council by random lottery, like 15 names drawn, one semester each. Ive been reading about sortition stuff online and i honestly think both of those are bad as stated, so I want to pitch something in the middle but I cant tell if it holds together: instead of one standing council, draw a fresh random panel of 12 for each big decision (funding, the dress code thing, spring fest), keep a tiny elected group of 3 whose only power is deciding what goes to a panel and when, draw from the entire grade instead of from volunteers, and exclude from the draw anyone who already holds a leadership role (team captain, club president, yearbook editor, etc.). Plus a challenge rule: 30 signatures forces a re-hearing of any panel decision in front of a *different* randomly drawn group of 8.

  can you draft the memo Ill circulate to the committee? It needs a concrete recommendation with dates — im thinking pilot it for fall semester and review in january — and it needs to take the other side seriously instead of just saying elections are popularity contests. the thing I actually find strongest against my plan is that a random group has no mandate, so the administration can just ignore whatever it decides, and that with rotating panels nobody ever builds up any expertise or institutional memory. if you think either of those is fatal say so and recommend something else. also tell me whether that exclusion rule is smart or self-defeating, and what we should actually measure in january to decide if the pilot worked. please keep it readable — the vice principal has to explain this to parents — and dont put any citations or a reading list in it, I cant use them and itll just make the memo longer.
reasoning: |-
  Okay, the user is on a committee at their school that needs to propose a new student council selection method. They're frustrated with the current election system—low turnout, same group winning every time—and the council's limited responsibilities. The debate is between reforming elections or switching to a random lottery. The user has come up with a hybrid idea: random panels for specific decisions, a small elected group to manage what gets discussed, and some exclusions for current leaders. They want a memo draft for their committee addressing the concerns about mandate and expertise, plus whether the exclusion rule makes sense.

  First, I need to understand their core problem. The current system isn't working, and both proposed solutions have flaws. Their hybrid model tries to balance representation and efficiency. But they're worried about two main criticisms: random panels lacking a mandate for the administration to listen, and the loss of institutional memory. Also, they're unsure about excluding current leaders.

  The user's deeper needs might include wanting a fairer system that increases participation, prevents cliques from dominating, and ensures decisions are taken seriously by the admin. They also need the proposal to be practical and acceptable to the vice principal and parents. The memo needs to be concise, avoid academic jargon, and focus on measurable outcomes for the pilot.

  For the mandate issue, I should emphasize that the random panels represent the student body more accurately than low-turnout elections. That could actually give decisions more legitimacy. For institutional memory, the small elected oversight group could maintain continuity. The exclusion rule might prevent overburdening current leaders but could also limit diverse input. Maybe suggest making exclusion optional or based on willingness.

  For the pilot evaluation, the user needs clear metrics: participation rates, decision quality, time efficiency, and feedback surveys. Including both quantitative and qualitative measures will show if the system works. Also, addressing the vice principal's concern about explaining to parents means highlighting fairness and broader representation.

  I should structure the memo to first acknowledge the current problems, then present the hybrid model as a solution. Address the criticisms directly, propose the pilot with specific dates, and outline evaluation criteria. Keep the language professional yet accessible. Make sure to recommend concrete steps and deadlines so the committee can move forward.
answer: |-
  **MEMORANDUM**  
  To: Student Council Selection Committee  
  From: [Your Name], Student Representative  
  Date: April 5, 2024  
  Subject: Proposal for Pilot Hybrid Student Representation Model (Pilot: Fall 2024, Review: Jan 2025)  

  ### Current Challenges
  Our current election system suffers from low engagement (12% turnout) and fails to represent diverse student voices, concentrating power in a small group. While reforming elections (ranked choice, reserved seats) could improve fairness, it may not solve low engagement. Conversely, replacing elections entirely with random selection risks creating panels without legitimacy in the administration’s eyes and loses valuable continuity for multi-semester tasks like Spring Fest planning.  

  ### Proposed Pilot: The Hybrid Model
  We recommend testing a **hybrid system** for Fall 2024 that balances accountability, inclusivity, and efficiency:  

  1.  **Three Elected Coordinators:**  
      *   Elected annually by popular vote.  
      *   **Role:** Identify key issues requiring student input (e.g., club funding allocations, dress code proposals, Spring Fest theme/major vendors). *They do not make final decisions on these issues.*  
      *   **Accountability:** Directly responsible to the student body via elections.  

  2.  **Random Decision Panels ("Juries"):**  
      *   For *each* major decision identified by the Coordinators, a **fresh panel of 12 students** is randomly drawn from *all eligible students in the relevant grade(s)*.  
      *   **Participation:** Mandatory service (like jury duty), with opt-outs only for documented hardships.  
      *   **Exclusion:** Students currently holding *major* leadership roles (Team Captain, Club President, Yearbook Editor, etc.) are excluded from the draw *for that semester*. **Rationale:** Prevents overburdening engaged students and intentionally brings new voices forward. *(See evaluation point below)*.  
      *   **Support:** Panels receive briefing materials and facilitated discussion by the Coordinators/Vice Principal.  

  3.  **Challenge Mechanism:**  
      *   Any panel decision can be challenged by a petition of 30 student signatures.  
      *   A **new, randomly drawn panel of 8 students** then re-hears the issue and makes a final decision.  

  **Pilot Scope & Timeline:**  
  *   **Implementation:** Begin with Grade 10/11 students for Fall 2024 semester decisions (e.g., 1st semester club funding allocation, initial Spring Fest brainstorming).  
  *   **Review Date:** January 15, 2025 (before Spring Fest planning intensifies).  
  *   **Full Recommendation:** Based on the pilot review, recommend whether to continue, modify, or abandon the hybrid model for the full 2025-26 year.  

  ### Addressing Key Concerns
  1.  **Lack of Mandate?**  
      *   Randomly selected panels, drawn from *all* students, represent the student body more accurately than a 12% election turnout. Their legitimacy comes from fair, inclusive selection, not a popularity contest.  
      *   The *elected Coordinators* provide an administrative touchpoint with direct accountability. The Principal commits to seriously considering panel recommendations made under this pilot structure.  

  2.  **Loss of Expertise/Institutional Memory?**  
      *   The **elected Coordinators (3)** provide crucial continuity. They manage the process, schedule panels, prepare briefing materials, and ensure past decisions/context are documented for new panels.  
      *   **Focused Panels:** Panels address *single, defined issues* (e.g., "Allocate $4000 to clubs for Semester 1"). This reduces the need for long-term institutional knowledge compared to a standing council managing everything.  

  3.  **Exclusion of Current Leaders - Smart or Self-Defeating?**  
      *   **Pros:** Actively diversifies participation, prevents burnout among already busy students, and challenges the perception that leadership is only for the "usual suspects."  
      *   **Cons:** Excludes some experienced voices.  
      *   **Pilot Evaluation:** We will *specifically measure* if this exclusion helps bring in new participants or feels like silencing good leaders. This rule can be easily adjusted post-pilot.  

  ### Evaluating the Pilot (Jan 15, 2025)
  Success will be measured by:  

  1.  **Participation:** % of students *from the eligible pool* who serve on a panel. (Target: Significantly higher than 12% election turnout).  
  2.  **Diversity:** Do panels include students not previously involved in student government or major leadership? (Qualitative & Quantitative assessment).  
  3.  **Efficiency:** Are panels convened effectively? Are decisions made within reasonable timeframes?  
  4.  **Quality:** Feedback from Panel Participants, Club Advisors, and Administration on the deliberation quality and outcomes.  
  5.  **Perceived Legitimacy:** Do students and administration feel the decisions are fair and representative? (Short survey).  
  6.  **Impact of Exclusion Rule:** Did it achieve its goal of broadening participation without significantly harming decision quality?  

  ### Recommendation
  We propose adopting this Hybrid Model pilot for Grade 10/11 students in Fall 2024. It directly addresses the flaws in our current elections by guaranteeing diverse representation for major decisions while maintaining accountable leadership through the elected Coordinators. It mitigates the risks of pure random selection by preserving continuity and focus. Crucially, the pilot includes a concrete review in January 2025 with clear metrics to determine its future.  

  This is a proactive step towards a more engaged, representative, and effective student voice system.  

  **Proposed Committee Vote:** April 10, 2024  
  **Proposed Submission to Principal:** April 12, 2024 (Pending Committee Approval)  

  ---  

  **Key Advantages for Parents/Admin:**  
  *   **Fairness:** Every student has an equal chance to participate directly in decisions affecting them.  
  *   **Engagement:** Actively involves far more students than elections.  
  *   **Accountability:** Clear roles for elected officials and transparent decision-making processes.  
  *   **Manageable Pilot:** Limited scope, defined timeframe, and concrete review plan minimize risk.  
  *   **Focus on Solutions:** Moves beyond popularity contests to focus on informed student input for specific issues.
