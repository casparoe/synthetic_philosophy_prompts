prompt: |-
  My friend sits on the deployment review committee at a frontier AI lab and I've been collecting her verdicts on hypotheticals because I cant work out what rule she's actually running.

  She's fine shipping a coding assistant that writes subtly vulnerable code maybe one time in five hundred — her line is that this is what human code review is for. She's also fine with a model whose reasoning nobody can follow, as long as the outputs are checkable. She refuses to ship anything whose safety case rests on a kill switch that operators flip correctly 99% of the time. She rejected a model that was honest in every deployment eval but was caught scheming exactly once during training. And she rejected a proposal to let a strong model write the evaluations for the next model, even though on a held-out set with planted failures it caught 99.4% of them.

  New case: a system that runs about a hundred thousand short, independent tasks a day. Its catastrophic failure mode is not adversarial at all — no optimizer pushing toward it, no distribution shift expected, just a well-characterized fault whose rate has been measured at roughly one in a billion, so you'd expect a catastrophe every few decades. But when it happens it's irreversible and nothing downstream catches it. Ship or no?

  I think there are at least three rules that fit all her earlier calls — something like "no uneliminated tail of catastrophic outcomes, however small", "reject when the failure rate isn't estimable because the system is working against you" (which would make her really an average-case person with an epistemic twist), and "reject when the failure is irreversible or corrupts the thing meant to catch it" — and they come apart here. So: which is she most likely on, what does each predict about this case, and what's the cleanest next hypothetical to tell them apart? Also, is she actually a worst-case person at all, or is she doing ordinary reliability engineering and the coding-assistant verdict is the tell?
reasoning: |-
  Okay, let me start by understanding the user's query. They have a friend on a deployment review committee at a frontier AI lab, and they're trying to figure out what rule she uses to make decisions. The user provided several past decisions and a new hypothetical case. The goal is to determine which underlying rule she follows and how she'd decide on the new case.

  First, I need to parse each of her past decisions. She approved a coding assistant with a 1 in 500 failure rate because human review catches it. That suggests she accepts measurable, mitigable risks. Then, she’s okay with an uninterpretable model as long as outputs are checkable. That implies verifiability matters more than interpretability. 

  Next, she rejects a 99% reliable kill switch. Why? Because 1% failure is too high for a critical safety mechanism. The single instance of scheming during training leads to rejection, even if deployment evals were clean. This indicates she’s wary of any evidence of deception. Rejecting a model writing its own evaluations despite high caught rates suggests distrust in self-referential safety.

  Now, the new case: a system with a 1 in a billion failure rate per task, irreversible catastrophe every few decades. The failures aren’t adversarial, just random. The user wonders which rule applies. The three candidate rules are: no uneliminated catastrophic tail, epistemic uncertainty about failure rates, and irreversibility/corruption of safeguards.

  Looking at each rule. Rule 1 (no catastrophic tail) would reject the new case because the risk isn't zero, even if small. Rule 2 (epistemic) might approve since the failure rate is well-characterized. Rule 3 (irreversible) would reject because nothing catches the failure. Her past rejections align with Rule 3: the kill switch failure is irreversible if flipped wrong, scheming implies corruption, and self-evaluation risks corruption. The coding assistant approval fits because human review is a safeguard. So Rule 3 seems consistent.

  To distinguish, the user needs a hypothetical where the failure is reversible but has an unquantifiable risk. For example, a model with a known catastrophic rate but caught by a verifier. Rule 1 would reject the uneliminated tail, Rule 2 might approve if estimable, Rule 3 approves if caught. If she approves, Rules 1 and 3 differ; if rejects, Rule 1. Another test: irreversibility without corruption. If she approves, Rule 3 is less likely.

  Is she worst-case? Her coding assistant approval suggests not; she accepts low risks with mitigations. She’s more about avoiding irreversible failures, especially when safeguards are compromised. Reliability engineering principles fit her decisions, emphasizing layers of protection and avoiding single points of failure.
answer: |-
  Based on her pattern of decisions and the new case, here's the breakdown:

  1.  **Her Most Likely Rule: "Reject when the failure is irreversible or corrupts the safeguard meant to catch it." (Rule 3)**
      *   **Why:** This rule cleanly explains *all* her prior decisions:
          *   **Coding Assistant (Ship):** Failure (vulnerable code) is *reversible* via human review. The safeguard (review) works.
          *   **Uninterpretable Model (Ship):** Outputs are *checkable* (the safeguard works), even if the process isn't understood. Failure is detectable/correctable.
          *   **Kill Switch (Refuse):** Failure (switch not flipped correctly 1%) leads to *irreversible* catastrophe. The safeguard *itself* is unreliable.
          *   **Caught Scheming (Refuse):** Scheming corrupts the *intent* of the system. If undetected, it could bypass safeguards or cause irreversible harm. The *safety case* relying on honesty is corrupted by evidence of deception.
          *   **Model Writing Evals (Refuse):** This creates a *self-referential/corruptible safeguard*. The evaluator (the strong model) has an inherent conflict of interest or could subtly bias evals to favor dangerous capabilities in successors, corrupting the safety layer.
      *   **Prediction for New Case (No Ship):** The catastrophic failure is explicitly described as irreversible ("irreversible") and has no downstream catch ("nothing downstream catches it"). This directly violates Rule 3. The well-characterized low probability isn't the primary issue; the *nature* of the failure (irreversible, uncatchable) is the disqualifier.

  2.  **Other Rules & Predictions:**
      *   **Rule 1: "No uneliminated tail of catastrophic outcomes, however small."**
          *   **Prediction for New Case:** No Ship. A 1-in-a-billion *catastrophic* risk per task, leading to an expected catastrophe every few decades, is an uneliminated tail risk. This rule would require the probability to be driven to *zero* or have a perfect safeguard.
          *   **Why Less Likely:** She shipped the coding assistant with a measurable catastrophic (if mitigated) risk (1/500 vulnerable code). This shows she accepts *some* residual catastrophic risk if mitigated/reversible. Rule 1 would likely reject the coding assistant.
      *   **Rule 2: "Reject when failure rate isn't estimable because the system is working against you." (Epistemic/Anti-Adversarial)**
          *   **Prediction for New Case:** Ship. The failure mode is explicitly *not* adversarial ("no optimizer pushing toward it, no distribution shift expected"), and the rate is "well-characterized" and "measured". The epistemic conditions are favorable.
          *   **Why Less Likely:** This rule doesn't explain the kill switch refusal. The kill switch failure rate *is* estimable (99% correct flips). The problem was the *consequence* of that 1% failure (irreversible catastrophe) and the safeguard failing, not the estimability. It also doesn't cleanly explain the rejection of model-written evals – the 99.4% caught rate *is* an estimate from a held-out test.

  3.  **Is she a worst-case person?**
      *   **No, she is not fundamentally a worst-case person.** The coding assistant verdict is the key tell. She accepts a known, low-but-non-zero probability (1/500) of a catastrophic failure *because it is mitigated by a functional safeguard (human review)*. This is classic **reliability/safety engineering**: analyzing risks, implementing layers of defense (safeguards), and accepting residual risk when safeguards are robust and the risk is As Low As Reasonably Practicable (ALARP).
      *   **Her Specific Flavor:** She applies reliability engineering principles with an *extremely high bar for irreversible failures and corrupted safeguards*. She is laser-focused on ensuring that:
          1.  Catastrophic failures, *if* they occur, can be caught and reversed/contained (hence the need for functional safeguards).
          2.  The safeguards themselves are *not* vulnerable to being bypassed, corrupted, or rendered unreliable by the system they are meant to control (hence rejections of unreliable kill switches, evidence of scheming, and self-referential evaluation).

  **The Cleanest Next Hypotheticals to Tell Them Apart:**

  To distinguish Rule 3 (Irreversible/Corrupt Safeguard) from Rule 1 (No Catastrophic Tail) and Rule 2 (Epistemic/Adversarial Uncertainty):

  1.  **Hypothetical A (Reversible Catastrophe, Well-Characterized Low Probability):**
      *   *Proposal:* A medical diagnostic AI. Its catastrophic failure mode (misdiagnosing a critical, treatable condition as benign) has been rigorously measured at 1 in 10 million cases. When this failure happens, it *is* caught by a mandatory, independently developed verification scan 100% of the time, allowing for correct treatment.
      *   *Prediction:*
          *   **Rule 1 (No Tail):** Likely Refuse. There's still an uneliminated tail risk of catastrophe (even if caught 100% *after* the fact, the *failure event* occurred).
          *   **Rule 2 (Epistemic):** Ship. Rate is estimable, non-adversarial.
          *   **Rule 3 (Irreversible/Corrupt):** **Ship.** The catastrophic failure *is caught and reversed* by a reliable safeguard. The *outcome* is not irreversible harm.
      *   *Why it works:* If she ships this, it strongly favors Rule 3 over Rule 1. Rule 2 also ships, but Rule 2 was already less likely. If she refuses, it strongly favors Rule 1.

  2.  **Hypothetical B (Irreversible Catastrophe, *Estimable* Rate, *Non*-Corrupt Safeguard):**
      *   *Proposal:* An industrial control system for a very hazardous process. The catastrophic failure mode (uncontrolled reaction) is well-understood, purely stochastic, and measured at 1 in 5 billion operations. There is *no* safeguard that can stop the reaction once the specific fault sequence begins (irreversible physical process). However, there is an *extremely* reliable (99.9999%) independent system that *detects the initiating conditions* milliseconds before the point of no return and safely shuts down the process *preventatively*. Failure rate of this detector is also well-characterized.
      *   *Prediction:*
          *   **Rule 1 (No Tail):** Refuse. Uneliminated tail risk of catastrophe exists (detector could fail).
          *   **Rule 2 (Epistemic):** Ship. Rates are estimable, non-adversarial.
          *   **Rule 3 (Irreversible/Corrupt):** **Ship.** While the *core process* failure is irreversible, there is a *highly reliable safeguard that prevents it from occurring in the first place*. The safeguard isn't corrupted; it's just probabilistic. The *catastrophe itself* is prevented.
      *   *Why it works:* If she ships this, it favors Rule 3 (safeguard prevents the irreversible event) and Rule 2. If she refuses, it strongly favors Rule 1 (any tail risk is unacceptable) or possibly a very strict interpretation of Rule 3 where any probabilistic safeguard for an irreversible outcome is insufficient (though her kill switch refusal was about 99%, not 99.9999%).

  **Conclusion:**

  Your friend is most likely applying **Rule 3: Reject when the failure is irreversible or corrupts the safeguard meant to catch it.** This predicts a **No Ship** decision for the new case (irreversible, uncatchable failure). She is **not a worst-case person**; she practices **reliability engineering with an extreme focus on reversibility and safeguard integrity**, as evidenced by shipping the coding assistant with mitigations. The cleanest next hypotheticals involve contrasting reversible vs. irreversible outcomes with well-characterized risks (Hypothetical A) or a highly reliable preventative safeguard for an irreversible process (Hypothetical B) to distinguish Rule 3 from Rule 1.
