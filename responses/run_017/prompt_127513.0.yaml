prompt: |-
  I'm a novelist and I'm stuck on something that's partly craft and partly (I think) an actual philosophical mess, and my writing group has been useless about it in a fun way. I'm writing a book of three linked novellas, each set in one disaster year in the same fictional valley on the slope of a volcano: 1347, when a ship puts in at the port with something in the cargo; 1816, the year without a summer after that huge eruption in the East Indies, when nobody in the valley knows why the sky is wrong; and a near-future one where the power grid has been down for a month and the water isn't safe. Same families, same fields, three hundred years apart. What keeps tripping me up is that in each book a non-human thing is doing most of the plot work — a bacterium, a volcano, a blight, a flood — and I can't settle on how much of a character it's allowed to be. Sometimes I catch myself writing sentences where the frost decides and the microbe waits and the river remembers, and I honestly can't tell whether that's the good kind of animism or just laziness with verbs.

  So here's what I want: a sorting instrument I can photocopy for my group, a decision tree or taxonomy that starts from something we all have an opinion about — say, "these three novellas would be different books if the volcano hadn't erupted" — and ends at a named position about non-human causes and agency, eight or nine branch nodes, each phrased as a question about a concrete case so that nobody can tell which leaf it's leading to. Please build it from the logical space first: what are the questions, what combinations of answers do they permit, then which combinations are actually occupied and which are empty (and for the empty ones, say whether that's because the view is incoherent, just unattractive, or merely unoccupied because nobody's bothered). Every leaf needs a name — including, at minimum, strong environmental determinism, the conjunctural/vulnerability view where the germ or the drought only bites because of how the people were already arranged, the flat symmetrical actor-network view where the bacillus and the bishop are the same kind of thing for purposes of the story, and the humanist view that non-humans are conditions and occasions but not agents — plus, for each, one sentence on the commitment that would embarrass a novelist who held it.

  A few things I want in it specifically, because I made them up in a notebook and can't tell if they're real distinctions or just me being tired: what I call the swap test (if you replace this plague with a different plague, or this volcano with a different volcano, and the story ends the same way, was it ever an actor or just a stage?); the answerability condition (does a thing only count as acting if there was somebody who could in principle have answered it — you can negotiate with a drought by planting differently, you can't negotiate with a virus); ventriloquy, meaning the practice of lending the non-human a verb and then quietly forgetting you did; the lag problem, where the cause operates on a timescale none of the characters can perceive, so it can't be a character; and the reader's counterfactual, i.e. whether the book invites you to imagine the valley without the microbe at all. Put those in as branch questions where they belong, drop any that turn out to be the same question wearing a hat, and use at least these cases: the arriving ship, the failed harvest after the eruption, the blight in a potato field where a landlord is still exporting grain, a cholera outbreak where one well is clean and one isn't, and the valley's flood plain. Also please flag any two leaves your tree genuinely cannot separate rather than splitting them with a fake distinction, and add a scoring key at the end mapping answer patterns onto leaves so we can each find out what we've been defending for the past four months. Keep it usable in a two-hour workshop — no reading list, nothing I'd need a library for, and please don't make any question a matter of knowing whether Braudel or Latour or Diamond said what; sort us by what we think happens in the valley, not by who we've read.
reasoning: |-
  Okay, the user is a novelist working on a book with three linked novellas set in the same valley during different disaster years. They're struggling with how much agency to give non-human elements like bacteria, volcanoes, and blights. They want a decision tree or taxonomy to help their writing group discuss different philosophical positions on non-human agency in narratives. 

  First, I need to understand their core challenge. They're caught between animism and practicality—personifying natural forces might feel lazy or poetically powerful. Their examples (frost deciding, river remembering) show this tension. They need a framework to clarify when non-humans are characters vs. backdrops.

  The user specified several key concepts to include: swap test, answerability, ventriloquy, lag problem, and reader's counterfactual. These are all valid distinctions. The swap test checks if a specific non-human is replaceable—if swapping it changes nothing, it's likely just a setting. Answerability asks if humans can interact with it (negotiate a drought vs. a virus). Ventriloquy is about inconsistent personification, which could be a narrative flaw. The lag problem addresses timescales beyond human perception. The reader's counterfactual explores if removing the element would fundamentally alter the story.

  I will build the decision tree starting broad (human agency) and narrowing down. First question: "Is the non-human element replaceable?" splits into swap test paths. Next, "Can humans meaningfully respond to it?" covers answerability. Then "Does it have observable motives?" separates intentionality from mechanical effects. "Does its impact depend on human structures?" handles vulnerability views. "Is it personified consistently?" addresses ventriloquy. "Can humans perceive its timescale?" tackles lag. Finally, "Does the story ask 'what if it weren't there?'" checks counterfactual engagement.

  The leaves include positions like Strong Environmental Determinism (non-human as sole driver), Vulnerability View (human structures enable disaster), Flat Ontology (all actors equal), and Humanist (non-humans as context). Each needs an "embarrassing commitment"—e.g., for determinism, "a character's choices never mattered."

  Testing with their cases: The 1347 plague ship—under swap test, changing the disease might not alter outcomes if societal collapse was inevitable, placing it in Vulnerability View. The 1816 eruption's hidden cause (lag problem) fits "Deep Time Actor" if personified. The blight/landlord case highlights Vulnerability View—exploitation amplifies disaster. Cholera wells could show Flat Ontology if the well "chooses" victims equally. The flood plain might fit "Conditional Stage" if its role is fixed.

  Notable combinations: If something passes swap test but demands counterfactual ("what if no volcano?"), it might be incoherent—why imagine absence if it's replaceable? Also, answerability + lag creates tension—can you "negotiate" with slow climate change? This might map to "Deep Time Actor" with ventriloquy risks.

  The scoring key will tally answers to position users. Crucially, the tree avoids theory names (Latour etc.)—it's about instinctive narrative choices. For workshop use, it's designed to fit 2 hours with concrete cases. I'll flag where positions blur (e.g., Vulnerability vs. Flat Ontology if human/non-human entanglement is total). 

  This should resolve their philosophical mess by making implicit biases explicit. The novelist can then intentionally choose when frost "decides" versus when it's just cold.
answer: |-
  Here's a decision tree designed for your workshop, built from the logical space of non-human agency in narrative. It uses concrete cases from your novellas, avoids theoretical jargon, and focuses on operational questions. The goal is to reveal underlying assumptions about **why** the disaster unfolds as it does and **what role** the non-human element plays.

  **The Sorting Instrument: Non-Human Agency Taxonomy**

  **Instructions:** For each question, consider the specific case listed. Answer "Yes" or "No" based on your instinct about how the story fundamentally works. Follow the branches. At the end, tally your pattern and find your named position.

  ---

  **START: Case - The Arriving Ship (1347)**

  1.  **The Swap Test:** If the ship carried a *different* deadly cargo (e.g., a faster-acting hemorrhagic fever instead of plague, or even just spoiled grain causing localized famine), would the core events and ultimate outcome in the valley for *that year* be **fundamentally different**?
      *   **Yes** -> Go to Q2
      *   **No** -> Go to Q3

  2.  **Specificity & Motive:** Does the success or failure of the *specific* bacterium/virus in establishing itself and spreading feel like a result of its unique properties *interacting strategically* with the valley environment (e.g., "the plague *targeted* the port's overcrowding," "the virus *waited* for the market day")?
      *   **Yes** -> **Leaf: Strong Animism** (The non-human possesses inherent, quasi-intentional agency; its specific nature & choices drive events).
          *   *Embarrassing Commitment:* "The villain won because the germ wanted it more."
      *   **No** -> **Leaf: Conjunctural Catalyst** (The specific agent matters *because* it perfectly exploits existing human-made vulnerabilities like trade routes or sanitation; swap it, and the *timing* or *flavor* changes, but the societal rupture was primed to happen by human structures).
          *   *Embarrassing Commitment:* "Any sufficiently nasty bug would have shattered them; they built the glass house."

  3.  **Answerability Condition:** Could the valley's inhabitants have significantly altered the disaster's *course* through *directed actions specifically in response* to the non-human agent *during the event* (e.g., could they have "negotiated" with the plague through quarantine *before* understanding germs, or was any response doomed/futile)?
      *   **Yes** -> Go to Q4
      *   **No** -> Go to Q5

  4.  **Vulnerability Focus:** Did the *devastating impact* depend almost entirely on pre-existing human conditions (social structure, poverty, prior health, belief systems) that made the valley uniquely susceptible, rather than the inherent power of the non-human agent itself? (e.g., the plague was inevitable *anyway* due to trade, but its *ferocity* came from malnourishment).
      *   **Yes** -> **Leaf: Vulnerability View** (Non-humans are triggers; the real cause of the *scale* of disaster lies in human-created fragility).
          *   *Embarrassing Commitment:* "The plague didn't kill them; their landlord did (by exporting grain)."
      *   **No** -> **Leaf: Interactive Field** (Non-humans are active forces, but their impact is co-determined through real-time, perceptible struggle/responses; humans can meaningfully "answer" or wrestle with them).
          *   *Embarrassing Commitment:* "The river fought back, but the mayor was cleverer that year."

  5.  **Lag Problem:** Was the cause operating on a timescale completely imperceptible to the characters (e.g., centuries of soil depletion, slow climate shifts influencing plague vectors, genetic susceptibility built over generations)?
      *   **Yes** -> **Leaf: Deep Time Actor** (Non-humans exert profound agency, but it's geological/evolutionary, playing out on a stage humans can't perceive or influence directly within the story timeframe).
          *   *Embarrassing Commitment:* "The valley was doomed five centuries before the ship arrived; the characters are just dust motes in the landslide."
      *   **No** -> **Leaf: Inevitable Force** (The non-human is an overwhelming, immediate, and unstoppable power within the story's time; characters are simply swept aside by its intrinsic, non-negotiable nature).
          *   *Embarrassing Commitment:* "The plague was an asteroid; all their choices were just rearranging deck chairs."

  ---

  **Branch from Q1 (Ship) "No" -> Q3 "No":** *Case - The Failed Harvest (1816)*

  6.  **Reader's Counterfactual:** Does the narrative strongly invite the reader to imagine the valley *without* the specific non-human disaster (e.g., "What if Tambora *hadn't* erupted?") as a way to understand the characters' true nature or the valley's inherent stability/instability?
      *   **Yes** -> Go to Q7
      *   **No** -> **Leaf: Conditional Stage** (The non-human is a necessary condition, a fixed part of the stage setting; remove it, and the *specific story* ceases to exist, but it doesn't *do* things; it just *is* the context).
          *   *Embarrassing Commitment:* "The frost didn't kill the crops; it just made the stage cold so the *real* drama (landlord greed) could happen."

  7.  **Ventriloquy Check:** When you describe the non-human element (e.g., the "wrong sky," the frost), do you find yourself *only* using active verbs attributing intention/purpose ("the frost *decided*, the sky *brooded*") *sparingly for effect*, then quickly reverting to describing its *mechanical effects* on humans without implying its internal state?
      *   **Yes** -> **Leaf: Literary Patina** (Personification is purely metaphorical/atmospheric ornamentation, not a claim about actual agency; the verbs are decorative, not explanatory).
          *   *Embarrassing Commitment:* "The volcano 'woke up'... but only because it sounds cool before I explain plate tectonics."
      *   **No** -> **Leaf: Ambiguous Animism** (The narrative voice genuinely leans towards attributing consciousness/agency to the non-human, but it's inconsistent or unexplained, blurring the line between metaphor and ontology).
          *   *Embarrassing Commitment:* "The river remembered... wait, did I mean that literally? Maybe? Pass the wine."

  ---

  **Branch from Q1 (Ship) "No" -> Q3 "Yes":** *Case - The Blighted Potato Field / Landlord Exporting Grain*

  *(This path starts *after* establishing the non-human is replaceable (Q1 No) but humans *could* answer (Q3 Yes))*

  8.  **Symmetry Test:** When explaining the *outcome* (starvation), does it feel equally valid to say "The blight destroyed the potatoes" and "The landlord exported the grain" as direct, comparable causes within the narrative logic? (e.g., Does the blight "demand" attention as an actor alongside the landlord?)
      *   **Yes** -> **Leaf: Flat Ontology** (Bacillus and Bishop are equivalent actants in the network; agency is distributed, non-human actions are not fundamentally different in kind from human actions in driving the plot).
          *   *Embarrassing Commitment:* "The landlord schemed, the blight conspired; it was a real team effort."
      *   **No** -> **Leaf: Humanist Scaffolding** (Non-humans are powerful *conditions* or *catalysts* that create the *situation*, but the plot's *direction*, *moral weight*, and *dramatic turning points* are driven by human choices, relationships, and structures responding to those conditions).
          *   *Embarrassing Commitment:* "The blight set the stage, but the landlord wrote the tragedy."

  ---

  **Branch from Q1 (Ship) "No" -> Q3 "No" -> Q5 "No":** *Case - Cholera Outbreak (One Well Clean, One Not)*

  *(This path starts *after* establishing the non-human is replaceable (Q1 No), humans *couldn't* answer (Q3 No), and the timescale is perceptible (Lag Q5 No))*

  9.  **Mechanism vs. Motive:** Is the non-human element's role best understood as a blind, mechanical process (contamination spreads via water flow governed by physics/chemistry), even if its *effects* are dramatic and selective?
      *   **Yes** -> **Leaf: Blind Mechanism** (Non-humans are complex systems governed by impersonal laws; their "actions" are emergent phenomena, not driven by purpose or agency, even if impactful).
          *   *Embarrassing Commitment:* "The cholera didn't 'choose' the poor district; gravity and sewage did."
      *   **No** -> **Leaf: Inscrutable Intent** (The non-human *seems* to act with purpose or malice, but its reasons are fundamentally unknowable to humans; it possesses agency, but it's alien and opaque).
          *   *Embarrassing Commitment:* "The well knew which children would drink first; we just couldn't hear its reasons."

  ---

  **Case - The Valley's Flood Plain (Recurring across all eras)**

  *(Use this case to test consistency across your answers, but it doesn't add a new branch; it reflects your chosen leaf)*

  **Scoring Key:** Map your answer pattern (e.g., Q1N, Q3N, Q5Y) to your Leaf.

  | Path (Answers in Order)       | Leaf Name                  |
  | :---------------------------- | :------------------------- |
  | Q1Y -> Q2Y                    | **Strong Animism**         |
  | Q1Y -> Q2N                    | **Conjunctural Catalyst**  |
  | Q1N -> Q3Y -> Q4Y             | **Vulnerability View**     |
  | Q1N -> Q3Y -> Q4N             | **Interactive Field**      |
  | Q1N -> Q3N -> Q5Y             | **Deep Time Actor**        |
  | Q1N -> Q3N -> Q5N -> Q8Y      | **Flat Ontology**          |
  | Q1N -> Q3N -> Q5N -> Q8N      | **Humanist Scaffolding**   |
  | Q1N -> Q3N -> Q6Y -> Q7Y      | **Literary Patina**        |
  | Q1N -> Q3N -> Q6Y -> Q7N      | **Ambiguous Animism**      |
  | Q1N -> Q3N -> Q6N             | **Conditional Stage**      |
  | Q1N -> Q3N -> Q5N -> Q9Y      | **Blind Mechanism** (Cholera Path) |
  | Q1N -> Q3N -> Q5N -> Q9N      | **Inscrutable Intent** (Cholera Path) |

  **Notes on Design & Your Requirements:**

  1.  **Logical Space:** Starts broad (Swap Test - replaceability) then narrows based on core distinctions: intentionality (Q2, Q9), human interaction/answerability (Q3, Q4), timescale (Q5), narrative function (Q6, Q7, Q8).
  2.  **Distinct Leaves:** Covers your requested positions (Determinism/Animism, Vulnerability, Flat, Humanist) plus nuanced others (Deep Time, Interactive Field, Literary Patina, Ambiguous Animism, Blind Mechanism, Inscrutable Intent, Conditional Stage).
  3.  **Embedded Concepts:**
      *   **Swap Test:** Q1 (Fundamental).
      *   **Answerability:** Q3 (Core).
      *   **Ventriloquy:** Q7 (Specific check).
      *   **Lag Problem:** Q5 (Key branch).
      *   **Reader's Counterfactual:** Q6 (Key branch).
  4.  **Your Cases:** Used as anchors for specific questions (Ship/Q1, Harvest/Q6, Blight+Landlord/Q8, Cholera/Q9, Flood Plain/Consistency Check).
  5.  **Flagged Blurs:**
      *   **Conjunctural Catalyst vs. Vulnerability View:** Both focus on human structures enabling disaster. Distinction is Q2 (Specificity/Motive of the non-human agent itself). If the *specific* non-human doesn't matter *and* lacks motive/strategy, it's Vulnerability. If the *specific* non-human matters *because* it exploits vulnerabilities uniquely, it's Conjunctural.
      *   **Deep Time Actor vs. Strong Animism:** Both imply powerful agency. Distinction is Q5 (Timescale/Lag). Animism operates on human-perceptible scales with quasi-intention; Deep Time is imperceptible and supra-intentional.
      *   **Flat Ontology vs. Ambiguous Animism:** Flat is a coherent (if debated) philosophical stance treating agency symmetrically. Ambiguous Animism is an unstable *narrative voice* wobbling between metaphor and literal belief without commitment.
  6.  **Empty/Incoherent?** The tree avoids inherently incoherent combinations by branching sequentially. Some combinations are logically impossible (e.g., answering Q3 "Yes" and Q5 "Yes" - perceivable timescale but unanswerable? - is unlikely; Q5 only appears if Q3 is "No"). The Conditional Stage (Q6N) is arguably the "safest" but potentially least interesting dramatically.
  7.  **Usability:** Designed for concrete cases, Y/N answers. Scoring key is simple pattern matching. Takes ~10-15 mins per person to answer for one case, plus discussion. Fits a 2-hour workshop focusing on 1-2 core cases per person. No theory names used.
  8.  **Embarrassing Commitments:** Designed to highlight the potential narrative pitfalls or core assumptions of each view.

  **How to Workshop:** Have each member apply the tree to ONE specific case (e.g., the 1347 Ship) for their *own* writing instinct. Tally their leaf. Then discuss: Do different cases lead to different leaves? Why? What leaf feels most true to the story they *want* to tell? What does their "embarrassing commitment" reveal about their priorities? This exposes the philosophical mess as choices about narrative focus and causality. Good luck!
