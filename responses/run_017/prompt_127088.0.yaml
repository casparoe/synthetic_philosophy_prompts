  Hey — I'm putting together a problem set for my grad seminar on philosophy of cognitive science (we're in the predictive processing / active inference stretch), and I want one question that forces them to actually run the machinery instead of repeating slogans back at me. I keep starting from something like an ambiguous email from someone whose opinion of you matters, or a meeting you could quietly skip — but use whatever setting you like.

  The way I've been framing the machinery for them: on the myopic, "variational" reading, what the system does at each moment is minimize the surprise of the sensations it is currently getting, and it can do that either by updating its generative model or by acting so that incoming input matches what it already predicted. On the expected-free-energy reading, candidate policies are scored by the free energy they're expected to bring, and that quantity decomposes into a risk term — how far the outcomes a policy is expected to produce sit from the outcomes the organism is set up to expect — and an ambiguity term — how much the sensations expected under that policy would still leave you unsure about what's going on in the world. The epistemic bit, on this reading, isn't bolted on from outside; it's already inside the same quantity as the pragmatic bit, which is exactly why people argue about whether it's really doing any work.

  So here's the build. Give me one paragraph (160 words max) featuring an ordinary adult human in a recognizable everyday setting, with two or at most three options in front of her. Constraints: no clinical populations, no rats in boxes, no scanners, no sci-fi, no pharmacological or neural interventions, and no stipulated weirdness about the agent. The two readings have to come apart: the myopic reading says do A, the expected-free-energy reading says do B. Important: I want the myopic reading to be scoring actions here, not just shrugging and recommending a belief update — otherwise the comparison is rigged in the EFE story's favor and my sharper students will call it. On top of that, a plain myopic reward-maximization story (take whatever is most pleasant / least aversive right now) has to also say A, so the case pulls EFE apart from the hedonic story too. Same agent, same priors, same preferences, same evidence across all the options, so the disagreement can't be blamed on a difference in what she wants. And this is the one that matters for my purposes, so I'll say it up front: the whole point of the exercise is to see whether the ambiguity term has any behavioral content that isn't just a curiosity bonus smuggled in, so the moment your agent is stipulated to enjoy finding things out, to get a kick out of uncertainty, or to have an information-seeking utility bolted onto her, the case is worthless to me. The ambiguity term has to earn its keep structurally — e.g. by being load-bearing for a wide swath of downstream predictions — not by being a novelty preference in a trench coat. Both orderings (immediate surprise, and expected free energy) need to be readable off the scenario, because I have to grade these.

