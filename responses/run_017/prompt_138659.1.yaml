  | "This is just a pedantic point about semantics—we all know 'why Britain and not China' is shorthand for a complex bundle of processes. What’s the *value-added* here?" | Economic/global historians (especially China specialists) | H | 5 | "I agree it’s widely seen as shorthand, but my aim is to show that this bundling *actively distorts* explanatory targets. For instance, treating 'industrialization' as a monolith obscures why Lancashire thrived while the Lower Yangzi didn’t—despite comparable proto-industrial bases. Clarifying the contrasts isn’t semantics; it prevents false equivalence in causal attribution." | Soft: Doesn’t fully address why historians’ informal bundling hasn’t hindered progress; risks sounding dismissive of pragmatic scholarship. |
  | "Your partition test proves too much—it would dissolve *any* large-scale historical contrast like 'why the Roman Empire fell' or 'why the Allies won WWII.' Are those questions invalid too?" | Philosophers of history/science | M | 5 | "The test flags questions where repartitioning *reverses* the explanandum (e.g., 'why Britain not China' becomes 'why *not* North China'). Roman/Allies contrasts don’t reverse under partition—they’re stable under scaling. But I concede: the test needs refinement for *degree* of sensitivity, not binary validity. Some contrasts are 'partition-robust' enough to retain." | Soft: Admits the test isn’t foolproof; historians may still see it as a slippery slope. |
  | "You’re ignoring Galton’s problem: your 'unpacked' questions treat regions as independent when they’re interconnected. Spillovers (e.g., tech diffusion) mean we *need* the bundled macro-contrast." | Global historians / political scientist | H | 4 | "Absolutely—interconnection is why I propose a *family* of linked questions, not isolated ones. E.g., 'Why did Britain exploit coal more effectively than Shandong?' must reference trade networks. But bundling obscures *which* connections matter: diffusion vs. endogenous growth. Explicit contrasts let us model spillovers as variables, not assume them." | Soft: Doesn’t solve the methodological headache of operationalizing interdependence. |
  | "Historians already do this! Pomeranz split 'divergence' into ecological/economic/institutional layers. Your 'repair manual' feels like reinventing comparative history." | Global historians (Pomeranz readers) | M | 4 | "Pomeranz’s unpacking is exemplary—but notice he still defaults to 'Europe vs. China' framing when generalizing. My partition test formalizes why that framing fractures under scrutiny (e.g., intra-European divergence). The payoff is a *diagnostic* for when a macro-contrast obscures more than it reveals, plus a template for principled disaggregation." | Soft: Underplays how sophisticated historians already are; may seem like philosophy catching up. |
  | "You’re selecting on the dependent variable. By starting with 'divergence,' you ignore cases where similar conditions *didn’t* cause divergence (e.g., 18th-century India vs. Britain)." | Political scientist / method-savvy historians | M | 4 | "Fair—this is why I stress *named outcome variables*. For 'coal-based industrialization,' we’d compare Britain not just to China but to all regions with accessible coal (Belgium, Shandong, etc.). The point of explicit contrasts is to force systematic case-selection, not just the 'usual suspects.'" | Soft: Sidesteps data limitations; historians may retort that global coverage is ideal but impractical. |
  | "Why privilege *your* three bundles (growth, industrialization, science)? What about state capacity, culture, or imperialism? This just swaps one arbitrary frame for another." | Philosophers / critical historians | L | 3 | "I use these three because they’re the dominant threads in the Great Divergence literature—but the framework is flexible. Anyone can propose their own 'unpacked' contrast (e.g., 'why British fiscal-military state not Qing?'). The core move is demanding specificity: name the outcome, unit, and contrast class. My triad is illustrative, not exhaustive." | Soft: Appears to dodge the charge of arbitrariness; doesn’t justify why these three are 'dominant.' |
  | "This feels like philosophy policing history. We *know* the question is messy—but it’s generative! Scholars like Bin Wong used it to reframe 'European exceptionalism.'" | Supervisor (historian chair) | H | 5 | "I’m not dismissing generative questions! But 'generative' isn’t synonymous with 'well-posed.' My argument is that reframing (e.g., Wong’s) succeeds precisely by *implicitly* partitioning—e.g., comparing state responses to famine. Making this explicit strengthens such work by preventing relapse into reified civilizational contrasts." | Soft: Concedes the question’s generative role; may not convince historians that formalization adds value. |
  | "Your 'partition test' assumes we can neatly redraw units, but polities/regions aren’t arbitrary—they’re real historical actors. Units aren’t Lego blocks!" | Political scientist / institutional historians | M | 3 | "I agree units aren’t arbitrary—but they’re *multiscalar*. Qing China was a polity, but the 'Jiangnan economy' was a functional unit. The test asks: does your contrast hold if we shift scales to *equally defensible* units? If 'why Britain not China' evaporates when we compare Lancashire to Lingnan, that’s a sign the macro-frame is doing heavy lifting." | Soft: Doesn’t resolve how to choose 'defensible' units; risks infinite regress. |
  | "Where’s the counterfactual rigor? 'Why not China' implies a scenario where China *could* have industrialized first—but your framework avoids engaging causal mechanisms." | Philosophers of science | L | 4 | "Counterfactuals are crucial! But we need shared priors about what’s being contrasted. If 'China' means '18th-century Qing polity,' the counterfactual is about state choices; if it means 'East Asian resource base,' it’s about geography. Explicit contrasts anchor which counterfactuals are relevant—preventing ungrounded 'what-ifs.'" | Soft: Defers rather than solves the hard work of modeling counterfactuals. |
  | "You dismiss 'bundling' but ignore that growth, industry, and science co-evolved in Britain. Treating them separately might miss emergent dynamics." | Economic historians | M | 3 | "Co-evolution is vital—but we can study it *through* linked contrasts. E.g., 'Why did scientific institutions in Britain accelerate steam technology faster than in France?' then ties science to industry. Bundling risks conflating distinct feedback loops; partitioning lets us trace connections without assuming monolithic 'divergence.'" | Soft: Risks reductionism; historians may argue emergent properties vanish when partitioned. |

