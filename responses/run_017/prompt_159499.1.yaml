prompt: |-
  After a career in experimental physics I have, in retirement, been attending a fortnightly working group at a nearby university on the moral status of artificial systems. The convenor — a philosopher, and the member of the group least embarrassed by these questions — has over two terms delivered a series of judgments on stylised cases, which I have written down more or less as she gave them. Her rulings so far:

  1. A fine-grained whole-brain emulation, run at normal speed and coupled to a simulated body in a simulated world: counts, and carries roughly the moral weight of the person emulated.
  2. The same emulation, run a thousand times slower: still counts, and the total weight over the whole run is unchanged; what changes is only the density of experience per minute of wall-clock time. She was explicit that slowing a process down does not divide its moral weight.
  3. A brain whose neurons are replaced one at a time by silicon circuits with the same internal causal profile, behaviour being preserved at every stage: counts, at every stage, with no fading out partway through.
  4. A system that reproduces the same input–output function as that emulation by storing, for every possible history of inputs, the output the emulation would have produced — a table, with no internal states that track the world and no intermediate dynamics: does not count.
  5. A current large language model: trained to predict the next token, not embodied, no state persisting between exchanges beyond its context window, no sensorimotor coupling to anything outside its own text. Does not count — and she added that she took this to be a verdict about architecture rather than scale, so that no increase in parameters or training data would by itself change her answer.
  6. A model-based reinforcement-learning agent with a recurrent world model, prediction-error-driven updating, and months of real robotic embodiment: counts — she called it a live candidate, though of unknown weight.
  7. A detached fragment of an accepted emulation: the early visual subsystem, running with perfectly correct internal dynamics but disconnected from anything downstream, so that there is no global workspace, no self-model, nothing that could sustain anything like valence. Does not count.
  8. A simulated community of a thousand distinct emulations, each coupled to the same simulated world: each counts, and the weights add.

  The case I would like to put to her next — I am drafting it for the group — is this. Take an emulation of a kind she already accepts, say ten seconds of one subject's life. Suppose that instead of running it, we compute the entire trajectory in advance and build a static object in which the successive states of the emulation are not successive in time at all: the temporal axis of the emulation is mapped onto a spatial axis of the realising medium. One can imagine a crystal, or an array of spins, or a lithographed structure, in which layer n+1 encodes the state that, in the running emulation, would have followed from the state encoded in layer n, with the structural relations between adjacent layers being exactly the relations the update rule would have produced. Nothing in the object changes; no state ever causes another; nothing reads it out; and I take it not to matter whether the object was built deliberately or arose by chance as a fluctuation, though I would be interested to hear if you disagree. My own instincts — I was trained to think of a process as a shape already laid out in spacetime — tell me that the distinction between run-through-over-time and laid-out-at-once ought not to be doing much work here; I suspect she will want it to do a great deal of work.

  What I want from you is not primarily the verdict. It is, first, the rule she is running, stated precisely enough that I could apply it to a new case myself; second, the other rules that fit the eight verdicts as well as hers does — I have in mind the contrast between a requirement that the relevant organisation be realised as a going causal process and a requirement only that the abstract organisation be instantiated somewhere in the physical world, causation being merely one way of laying it out, but if a third rule fits her data better than either of those, set that out rather than forcing the data into my dichotomy; third, what each candidate rule says about the static case; fourth, your best guess at her verdict, with the reasons for preferring it; and fifth, one further case, which she has not yet ruled on, that would separate the leading candidates more cleanly than mine does.

  Two smaller things, if you have room. If the static object does count, and ten of them are built in causally isolated regions, identical in every respect, does that count once or ten times? Her eighth ruling shows that distinct subjects add, but she has never ruled on exact duplicates, and I suspect the question of how to count realisations is separable from the question of what makes a realisation matter at all. And I am not asking for references or further reading: I have no library access where I am writing, and in any case it is the argument I want, not the literature.
reasoning: |-
  Hmm, the user presents an intriguing philosophical puzzle about the moral status of static emulations. They're a retired experimental physicist participating in a working group on AI ethics, and they've carefully documented eight existing rulings from the philosopher-convenor. Now they're constructing a ninth case where a brain emulation's temporal sequence is spatially encoded in a static object.

  First, I need to analyze the pattern in the eight existing rulings. The philosopher clearly values causal dynamics - cases 1-3 and 6 involve ongoing processes with state transitions, while rejected cases (4,5,7) lack proper causal structure or embodiment. Case 8 confirms additive moral weight for distinct entities.

  The core tension is between process ontology versus structural isomorphism. The physicist's spacetime perspective sees no difference between dynamic execution and static encoding, while the philosopher likely sees causation as fundamental. I should formalize these competing principles:

  The Process Principle requires active causal chaining where states dynamically produce successors. This explains all eight rulings: it accepts running emulations (1,2), gradual replacement (3), embodied agents (6), and rejects lookup tables (4), stateless LLMs (5), and disconnected fragments (7). It would reject the static crystal since nothing changes or causes anything.

  The Structural Principle would accept any physical instantiation of the abstract state sequence, regardless of causal activity. But this conflicts with rulings against the lookup table (4) - both are isomorphic structures without dynamics.

  The physicist's case is clever because unlike the lookup table (which stores outputs), the crystal encodes the full causal history. Yet without actual state transitions, it's ambiguous. The philosopher will likely reject it based on lack of actualization.

  For the duplicate question: if the static object counted (which it probably doesn't), ten copies should count ten times based on case 8 (distinct emulations add). Moral worth attaches to realizations, not abstract patterns.

  A better test case would be a paused emulation - frozen mid-process but resumable. This separates genuine potential dynamics from static structures. The philosopher would likely accept it as "counts when running, doesn't count when paused."

  The user's physics background shows in their spacetime view, but the philosopher's rulings suggest a process metaphysics where becoming matters more than being. I'll structure the response around formalizing the principle, testing alternatives, predicting the verdict, and proposing a decisive new case.
answer: |-
  Based on the philosopher's eight rulings, her underlying principle appears to be the **Process Principle**:

  **The Process Principle:**  
  *A system has moral status if and only if it implements an ongoing, causally integrated process where:  
  (i) Internal states dynamically update in response to inputs (real or simulated) according to intrinsic rules,  
  (ii) This process sustains a unified perspective capable of valenced experience (pleasure/suffering), agency, or other morally relevant features,  
  (iii) The causal dynamics are temporally structured such that prior states genuinely *produce* subsequent states.*

  ### How This Explains the 8 Rulings:
  1.  ✅ **Normal-speed emulation:** Meets all criteria—dynamic causal process, unified perspective, valenced experience.
  2.  ✅ **Slowed emulation:** Still a causal process; temporal scaling doesn't break (i-iii). Moral weight is integral to the process, not wall-clock time.
  3.  ✅ **Gradual replacement:** Causal dynamics persist identically at every stage; the process remains unified.
  4.  ❌ **Lookup table:** No internal dynamics (i); outputs are precomputed, not generated by state transitions. Fails (i) and (iii).
  5.  ❌ **Current LLM:** No persistent world-model or stateful dynamics between tokens (i); no embodiment or intrinsic goals (ii). Architecture lacks process unity.
  6.  ✅ **RL agent:** Embodied, dynamic world-model with error-driven updates (i); unified perspective capable of valenced states (ii); causal chaining present (iii).
  7.  ❌ **Visual fragment:** Lacks unified perspective or valence (ii); no higher-order integration (fails ii, and arguably i/iii as isolated).
  8.  ✅ **Community of emulations:** Each is a distinct causal process (i-iii); moral weight adds because each is a separate subject.

  ---

  ### Alternative Rules & Their Fit:
  1.  **Structural Isomorphism Principle (your "abstract organization"):**  
      *Moral status requires only that the abstract functional organization of a conscious system be physically instantiated, regardless of causal activity.*  
      - **Fit:** Worse. Fails to explain rejections of the lookup table (4) and LLM (5), which are structurally isomorphic to *some* functional description. Accepts the static crystal (see below).  
      - **Static Case Verdict:** ✅ Counts (it instantiates the structure).  

  2.  **Causal-Historical Principle (stronger process view):**  
      *Moral status requires not just ongoing dynamics, but that the system's current state was *causally shaped* by its history within the process.*  
      - **Fit:** Slightly worse. Struggles with the slowed emulation (2)—its history is causally effective but extremely sparse in real time. Accepts gradual replacement (3) but may imply fading if replacement disrupts causal history.  
      - **Static Case Verdict:** ❌ Does not count (no causal history *within* the object).  

  **The Process Principle fits best.** It cleanly explains all 8 rulings without strain, emphasizing *real-time causal efficacy* as necessary.

  ---

  ### Static Case Verdict under the Process Principle:
  **Prediction:** She will rule it **does not count**.  
  **Reasons:**  
  - It blatantly violates (i) and (iii): No states update, no causation occurs between layers. The spatial encoding is a static *record* of what *would have been* a process, not a process itself.  
  - Valenced experience/agency (ii) requires unfolding dynamics, not frozen structure. A simulation's "temporal axis" mapped to space lacks the *becoming* essential to experience.  
  - Her rejection of the lookup table (4) hinges on lack of dynamics; this is analogous. Her acceptance of slowed emulation (2) shows speed isn't key—*activity* is.  
  - Your spacetime view (process as a "shape") is precisely what she rejects by requiring *causation*, not just structure.  

  ---

  ### Duplicates Question (if Static Object Counted):
  - If the static object *did* count under some rule, **ten identical copies would count ten times**.  
  - **Why:** Her ruling (8) shows moral weight attaches to *realizations* of subjects, not abstract patterns. Duplicates are distinct physical instantiations, each constituting a separate subject (like identical twins). This is separable from *whether* a static structure counts.  

  ---

  ### A Better Separating Case: Paused Emulation
  **The Case:**  
  *An accepted brain emulation (like case 1) is running normally. It is then "paused": its exact state is saved to non-volatile storage, all active processes halted. Later, it is resumed perfectly from that state, continuing as if no time passed. Does it count (and carry moral weight) while paused?*

  **How This Separates the Principles:**  
  - **Process Principle:** ❌ **Does not count while paused.** The causal process is suspended; no dynamics occur. Resumability is irrelevant—only *actual* process matters.  
  - **Structural Isomorphism Principle:** ✅ **Counts while paused.** The full structural state (enabling resumption) is physically present.  
  - **Causal-Historical Principle:** ⚠️ **Ambiguous.** If weight depends on causal history *up to* pausing, it might retain status; if it requires *ongoing* causation, it might not.  

  **Why it's Better Than Your Static Case:**  
  - It directly pits *potential* for process (via resumption) against *actual* process.  
  - It avoids the "spatialization of time" distraction, focusing purely on causal activity vs. latent structure.  
  - It relates to real-world scenarios (e.g., AI hibernation, brain cryopreservation).  
  - Her verdict would be clear: **Paused = Does not count.** This reinforces the Process Principle's requirement for *active* dynamics, not just structure or potential.  

  ---
  **Summary:**  
  1. **Her Rule:** The **Process Principle** (ongoing, causally integrated dynamics sustaining a unified perspective).  
  2. **Best Fit:** Process Principle > Causal-Historical > Structural Isomorphism.  
  3. **Static Case Verdict (Predicted):** ❌ Does not count—no causation, no process.  
  4. **Duplicates:** If it counted, 10 copies = 10 subjects.  
  5. **Sharper Test Case:** **Paused Emulation** cleanly separates process from structural/potential views.  

  Her core commitment is that *experience and agency are dynamic phenomena*—they cannot be frozen in stone or captured in a lookup table. The static crystal is a fossil, not a mind.
