  | If a search for evidence is incomplete or poorly designed, absence carries little weight.            | A non-exhaustive search (e.g., spot-checking files without a systematic audit).                                                                 | defensible but routinely overstated | partly licensed: Premise—The agency’s file was never intended to capture resident perspectives, so gaps are expected.                | not licensed: Premise—City directories and budgets are designed for completeness, so gaps are meaningful.                              | sometimes      |
  | The meaning of absence depends on how much more likely a trace is if the event occurred than if not. | A "null result" from a detector with estimable sensitivity (e.g., an archive with known biases toward recording certain events over others).   | substantive and defensible       | licensed: Premise—The archive was 10x more likely to miss an objection (if made) than to record it, due to power imbalances.         | not licensed: Premise—Directories/budgets are 10x more likely to record a federal office (if real) than to omit it.                    | rarely         |
  | When record-keepers lack incentive to document an event, absence doesn’t imply it didn’t happen.     | A gap in records controlled by a biased entity (e.g., files curated solely for legal/financial defense).                                        | substantive and defensible       | licensed: Premise—The agency actively avoided documenting dissent to limit liability.                                                | not licensed: Premise—City directories/budgets neutrally document public entities, so omission implies nonexistence.                   | usually        |
  | Absence of evidence is positive proof the event occurred because it was suppressed.                  | Any absence, regardless of context (e.g., missing protest letters "must" mean objections were silenced).                                         | false as stated                   | not licensed: Premise—Suppression is assumed without evidence; this confuses absence with proof.                                     | not licensed: Premise—Same flaw; assumes omission proves existence.                                                                    | sometimes      |

  ### Explanation of Columns:
  - **reading**: The core idea behind the slogan in one precise thesis.
  - **what_absence_is**: Defines the type of "absence" and the search it implies.
