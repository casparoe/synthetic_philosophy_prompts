prompt: |-
  I volunteer on a four-person committee writing the text for a historical marker for the neighborhood I grew up in — a mostly Black, mostly working-class section of the city that was cleared in the 1960s under an urban renewal project and replaced with a civic plaza and a parking deck. The city's files on the project run to several linear feet: engineering drawings, appraisal sheets, relocation vouchers, condemnation notices, photographs of houses taken just before demolition. What they do not contain is a single line written by anyone who lived there.

  This has made me the person on the committee who keeps saying that absence of evidence is not evidence of absence, and I would like to know whether that is true and whether it does the work I am using it for. Two cases.

  Case A. I want the marker to say that residents objected to the clearance. The historian advising us says we cannot assert that: there is no petition, no letter, no newspaper account of a protest anywhere in the file. I replied that absence of evidence is not evidence of absence. My reasoning was that the file was assembled by the redevelopment agency for its own purposes — title clearance, federal reimbursement, legal exposure — and that a tenant's complaint had no route into that file even if it happened, so the chance that an objection left a trace is low, and low in a way that is about power rather than about luck.

  Case B. Another volunteer says the federal relocation program kept an office here in the city and that families were offered rehousing assistance. The city directories and the audited budget line-items for those years are complete and systematic, and they mention no such office. He says exactly what I said in Case A. I think he is wrong, and I want to be able to explain why he is wrong without having been wrong myself in Case A.

  So: what are the distinct precise theses that sentence could be expressing? I have two rough distinctions I have been using privately, and you can use them or discard them. First, a silence of non-production (nobody ever wrote it down) versus a silence of destruction or non-accession (somebody wrote it down and it was weeded, lost, misfiled, or never handed over). Second, treating the archive as a detector with a sensitivity that has to be estimated, so that what matters is not that we found nothing but how much more likely a trace is if the event happened than if it did not.

  Please give me the menu as a table with exactly these columns:

  1. reading — the precise thesis in one sentence, in your own words, not a rewording of the slogan
  2. what_absence_is — what counts as an absence under this reading, and what kind of search it presupposes: one unopened box, a systematic survey of a well-indexed collection, a detector whose sensitivity is known
  3. status — exactly one of: logical platitude, substantive and defensible, defensible but routinely overstated, false as stated
  4. case_a — licensed, partly licensed, or not licensed, followed in the same cell by the single extra premise I would have to supply for it to license my claim
  5. case_b — same treatment for the relocation-office claim
  6. who_means_this — whether this is the reading people usually have in mind when they deploy the line to end an argument: usually, sometimes, or rarely

  Give at least five rows, ordered from the weakest or most trivial reading to the strongest or most radical one, and make sure the list includes (a) the bare point that a gap in what we have does not logically entail nonexistence, (b) a version on which what matters is a likelihood ratio between trace-given-event and trace-given-no-event, (c) a version about the thoroughness and design of the search, (d) a version about who held the pen, on which the probability of something leaving a trace is itself a function of the record-keeper's interests, and (e) at least one version you take to be false as stated, with the reason it fails.

  After the table, give me a bottom line as a single JSON object with these fields, and no prose outside it:

  - best_defensible_reading: string, naming which row or combination of rows survives, in one sentence
  - hidden_premise_case_a: string, one sentence, the load-bearing thing I asserted without stating
  - verdict_case_a: string, one of licensed, partly licensed, not licensed
  - verdict_case_b: string, one of licensed, partly licensed, not licensed
  - discriminating_question: string, one sentence, the question I should ask about any silence to tell a Case A from a Case B
  - upgrade_path: array of two or three strings, each a concrete thing my committee could do that would turn the Case A silence from uninformative into actual evidence, using only local sources and no web access
  - marker_sentence: string, one sentence of marker text about the residents that the surviving reading would actually entitle us to print

  Two last things. First, is there a defensible reading on which the abundance of documentation is itself grounds for suspicion — e.g. a neat stack of notarized voluntary-sale deeds counting as evidence of pressure rather than of willing sellers? If so, say which row generalizes to it. Second, I am writing this from a folding chair in a church basement with no library access, so please answer in American English and do not send me to any literature: no citations, no suggested reading, no appeals to what scholars have argued. Just the analysis.
reasoning: |-
  We are constructing a table to analyze the phrase "absence of evidence is not evidence of absence" in two cases. The table has six columns: reading, what_absence_is, status, case_a, case_b, who_means_this.

  We are to have at least five rows, ordered from weakest to strongest. We must include:
  (a) The bare logical point that a gap does not entail nonexistence.
  (b) A version about the likelihood ratio (trace given event vs. no event).
  (c) A version about the thoroughness and design of the search.
  (d) A version about who held the pen (record-keeper's interests).
  (e) At least one false version with the reason.

  After the table, we provide a JSON object with specific fields.

  Let's outline the rows:

  Row 1 (weakest): Bare logical point. Absence of evidence does not logically prove absence of event. This is a logical platitude.

  Row 2: A version about the search's thoroughness. If the search is not exhaustive, then absence doesn't mean much. This is defensible but can be overstated.

  Row 3: A version about the likelihood ratio (sensitivity of the detector). We need to estimate how likely we are to see a trace if the event happened vs. not. This is substantive and defensible.

  Row 4: A version about the record-keeper's interests. The probability of a trace depends on whose interests are being served. This is substantive and defensible.

  Row 5 (strongest, and false): A version that says absence of evidence is always positive evidence for the event (because the event is of the kind that wouldn't leave a trace). This is false because without any trace, we cannot update our beliefs arbitrarily.

  Now, let's build the table.

  Row 1:
  reading: A gap in the available records does not logically entail that an event did not occur.
  what_absence_is: Any gap, no matter how small the search (e.g., one unopened box).
  status: logical platitude
  case_a: licensed, with the premise that we are not claiming logical certainty, only that the possibility remains open.
  case_b: licensed, with the same premise that the possibility of an office remains open.
  who_means_this: rarely (because it's trivial and doesn't help in practice)

  Row 2:
  reading: If the search for evidence was not thorough and comprehensive, then the absence of evidence does not strongly indicate the event did not occur.
  what_absence_is: An incomplete search (e.g., not all boxes were opened, or the indexing was poor).
  status: defensible but routinely overstated (because people often overstate how thorough a search must be to be informative)
  case_a: partly licensed, with the premise that the search (by the redevelopment agency) was not designed to capture resident objections.
  case_b: not licensed, because the search (city directories and audited budgets) was systematic and comprehensive for that kind of entity.
  who_means_this: sometimes

  Row 3 (likelihood ratio):
  reading: The significance of an absence depends on the ratio of the probability of finding a trace if the event occurred to the probability if it did not (i.e., the sensitivity of the archive as a detector).
  what_absence_is: A null result after a search with known or estimated sensitivity (e.g., a detector with a known false negative rate).
  status: substantive and defensible
  case_a: licensed, with the premise that the detector (the agency's files) has low sensitivity for resident objections (because they had no reason to record them).
  case_b: not licensed, because the detector (directories and budgets) has high sensitivity for a federal office (since such offices are systematically recorded).
  who_means_this: rarely (because it's technical)

  Row 4 (record-keeper's interests):
  reading: The chance of an event leaving a trace is low when the record-keepers have no incentive to document it, so absence does not imply the event didn't occur.
  what_absence_is: A gap in a record system designed by an entity with a vested interest (e.g., the agency only kept what was necessary for their own purposes).
  status: substantive and defensible
  case_a: licensed, with the premise that the agency had no reason to record tenant complaints and every reason to avoid them.
  case_b: not licensed, because a federal office would be documented in city directories and budgets if it existed, as these are neutral sources.
  who_means_this: usually (in historical arguments)

  Row 5 (false version):
  reading: The absence of evidence is positive evidence for the event because the event is precisely the kind that would be suppressed or hidden.
  what_absence_is: Any absence, regardless of context, is taken as evidence of the event's occurrence due to suppression.
  status: false as stated (because it ignores the base rate and the possibility that the event simply didn't occur; absence alone cannot be positive evidence without a specific model of suppression)
  case_a: not licensed, because without additional evidence of suppression, this is circular.
  case_b: not licensed, same reason.
  who_means_this: sometimes (in conspiracy theories or overzealous advocacy)

  Now, for the JSON:

  best_defensible_reading: We combine row 3 (likelihood ratio) and row 4 (record-keeper's interests) because they are both defensible and relevant.

  hidden_premise_case_a: The redevelopment agency's files were designed to minimize legal and financial risks, making them highly insensitive to resident objections.

  verdict_case_a: licensed (under row 3 and 4)

  verdict_case_b: not licensed (under row 3 and 4, because the city directories and budgets are designed to be comprehensive for such offices)

  discriminating_question: How likely is it that this kind of event would have left a trace in this particular archive, given the archive's purpose and the power dynamics?

  upgrade_path: [ 
    "Interview elderly residents who lived in the neighborhood before clearance for their recollections of resistance.",
    "Search local Black newspapers from the 1960s for any coverage of opposition to the project.",
    "Check minutes of city council meetings during the clearance period for public comments or petitions."
  ]

  marker_sentence: "Many residents objected to the demolition of their homes and community, but their voices were largely excluded from official records."

  Additional note: The abundance of documentation (like a stack of notarized deeds) can be grounds for suspicion under the record-keeper's interests reading (row 4). The neat records might indicate a systematic process that suppressed dissent, so the absence of any irregularity in the deeds might be evidence of pressure, because if there were pressure, it would leave no trace (since the coerced would sign under duress and it would look voluntary). This is a specific application of the likelihood ratio (row 3) and the interests (row 4).

  We'll now write the table and then the JSON.
