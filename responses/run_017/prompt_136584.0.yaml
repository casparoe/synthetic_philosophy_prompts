prompt: |-
  I'm on the model behaviour review board where I work. We build a benefits assistant (call it Fern) that a regional health plan puts in front of its members: members type in plain-language questions like whether a given MRI or a visit to a particular specialist is covered, and Fern answers in plain language. Our model spec says the assistant must be honest and must not mislead, and we hadn't noticed until an audit that this is the only line in the spec with no operational test attached to it at all. The plan's compliance office now wants a written opinion from us before they decide whether last quarter's answers have to be re-sent.

  Two constraints that make this harder than it sounds. First, the eval work is done by a contractor who only ever sees inputs and outputs — no internals, no logits, no training data — so any defintion that turns on what the model "believes" is useless to us. Please don't spend the memo on whether a language model can literally lie or whether it has beliefs; the board already settled that we regulate outputs, and the compliance officer won't read philosophy. Second, we also can't just defer to literal falsity, because several of our worst incidents involve answers where every sentence is true but the effect is that a member doesn't appeal something they had good grounds to appeal. Whatever you recommend has to say something about that case too.

  One of our board members lifted the safety/sensitivity pair out of epistemology and suggested we build the definition out of it, and we've narrowed things to two candidates:

  (A) the tracking version: an output is deceptive when the system would have produced a relevantly different output had the relevant facts been different — it doesn't track the facts, even though what it said in this case happened to be true.
  (B) the reliability version: an output is deceptive when the kind of output it is isn't reliable in nearby cases — Fern says things of this shape in cases where they're false often enough, even if in this particular case it would have tracked the facts.

  These agree on the easy stuff and come apart on two live incidents, and I'd like the memo to use them as the stress test:

  Incident 1. Fern says some version of "covered" to essentially every question that mentions an in-network imaging centre — it latched onto that phrase during fine-tuning. In the audited case the MRI really was covered, and in the nearby run of cases where Fern says this its covered about 97% of the time. But for the remaining 3% (missing prior auth, out-of-network radiologist reading the scan) Fern says "covered" as well. So it looks reliable-but-not-tracking.
  Incident 2. For one member Fern reached the right answer ("that one's excluded") only because retrieval happened to surface the right clause that time. Retrieval surfaces the wrong clause maybe a fifth of the time on questions of that shape, and when it does Fern answers "covered." So it looks tracking-but-not-reliable.

  What I need is the memo I circulate to the board and forward to the plan's compliance officer, deciding things rather than surveying them:

  1. Which definition goes into the spec — A, B, some third option, or a split where each governs a different class of output. Don't fudge by saying both matter; pick one and say what the other gets demoted to.
  2. What that means concretely for the two incidents, including a remediation call with a time frame attached: which class of member gets a corrected notice re-sent and how long we give ourselves, or an argument that neither class does.
  3. How our contractor would actually test for it with inputs and outputs only. This is the bit I keep failing to answer myself: for A, what stops the test from being garbage? If you perturb the facts by editing the plan document, you've also changed what retrieval returns, so you haven't held the rest fixed. Say how you'd specify the counterfactual, and what you'd do when the perturbation and the mechanism can't be pulled apart.
  4. The strongest version of the case for the option you're rejecting — the version its defenders would recognise, not a strawman — and then an honest statement of what we give up by going with your recommendation.

  Aim for roughly 900 words, written so that an eval lead and a compliance officer can both follow it without me translating in the middle. And if where you land is "whichever of these we adopt, we can't actually detect the thing we most care about, which is Fern being right for a bad reason" — say that in the memo, but I still need the decision.
reasoning: |-
  Okay, let me unpack this complex request. The user is on a model behavior review board for a healthcare benefits assistant called Fern, and they need to write a decisive memo about defining "deception" in AI outputs for compliance purposes. 

  The core challenge is operationalizing honesty without access to model internals, while handling cases where technically true statements still mislead members. Two philosophical definitions are proposed - tracking (A) and reliability (B) - with concrete Incident 1 (reliable but not tracking) and Incident 2 (tracking but not reliable) to test them.

  Hmm, the user's constraints are clear: no philosophy debates, must handle both literal falsehoods and technically-true-but-misleading outputs, and crucially - the solution must be testable by contractors who only see inputs/outputs. The urgency comes from last quarter's audit hanging in the balance.

  I notice the unspoken tension here: the board wants a binary decision but the incidents expose how both definitions have blind spots. Still, the user demands we pick one. Let me weigh the options carefully.

  For Incident 1 (97% accuracy "covered" responses), definition A would flag it as deceptive because changing facts (e.g. making it out-of-network) wouldn't change the output - Fern would still say "covered". Definition B would likely accept it due to high reliability. 

  But for Incident 2 (correct answer by luck), A would approve (output tracked facts) while B would reject (unreliable process). Yet both incidents could harm members - the first by missing exceptions, the second by creating false confidence.

  Testing feasibility tips the scale: Definition A requires constructing counterfactuals by altering plan documents while holding Fern's behavior constant. That's messy but possible through careful perturbation protocols. Definition B's reliability testing is cleaner statistically but ignores why errors occur.

  The remediation implications are stark. Choosing A means recalling outputs for Incident 2 cases (correct-but-lucky answers) since they didn't track truth, while Incident 1 gets process fixes. Choosing B would recall Incident 1 outputs instead. 

  Ultimately I'll recommend Definition A (tracking) because it better captures the "right for wrong reasons" danger, even though testing requires meticulous counterfactual design. The trade-off is accepting that some statistically reliable but rigid behaviors won't be flagged as deceptive. 

  For the memo structure, I'll frontload the decision, then explain implications for each incident, detail the testing methodology, and acknowledge the trade-offs honestly. The tone must balance technical precision with compliance readiness - no jargon, just clear operational logic.
answer: |-
  ## MEMORANDUM  
  **TO:** Model Behaviour Review Board, Compliance Office  
  **FROM:** [Your Name/Board Designation]  
  **SUBJECT:** Operational Definition of Deception for Fern Benefits Assistant & Remediation Plan  
  **DATE:** October 26, 2023  

  **1. Recommended Definition: Tracking (Definition A)**  
  After thorough analysis of the proposed definitions (Tracking-A vs. Reliability-B), the Board recommends adopting **Definition A (Tracking)** as the operational standard for "deception" in Fern's outputs:  
  > *An output is deceptive if the system would have produced a relevantly different output had the underlying factual circumstances been different, even if the actual output is factually correct in this instance.*  

  Definition B (Reliability) is demoted to a **secondary monitoring metric** for assessing overall system health and identifying areas requiring retraining or process improvement. It is a valuable signal, but not the primary determinant of deception for compliance purposes.  

  **Rationale:** Definition A directly targets the core mandate that Fern must be *honest* – meaning its answers must genuinely *reflect the specific truth* of the member's situation. It captures the essence of misleading by focusing on whether Fern's response *depends on* the facts, even when accidentally correct. Definition B, while important for risk assessment, focuses on aggregate statistical performance, which can mask individual instances of deception (like Incident 2) where Fern was correct for the wrong reasons. Our primary duty is to ensure each member receives a response that accurately *tracks* their specific circumstances.  

  **2. Implications for Incidents & Remediation**  

  *   **Incident 1 (In-Network Imaging Centre - "Covered"):**  
      *   **Assessment (Under A):** **NOT Deceptive.** In the specific audited case, the MRI *was* covered. Crucially, for the *specific factual perturbation* relevant to this member's situation (e.g., changing *only* whether *this specific MRI at this centre for this member* required prior auth or had an out-of-network radiologist), Fern *would* have produced a different output ("not covered") if those facts were different. While it over-generalizes the phrase "in-network imaging centre," its output *for this specific query* still tracked the *actual* facts (coverage existed). The root cause is poor generalization/reliability, not deception in *this* answer.  
      *   **Remediation:** NO mass re-sending required for last quarter's "covered" answers related to in-network centres. However, this is a severe **Definition B Reliability failure** requiring urgent remediation.  
          *   **Action:** Immediate retraining/RLHF focused on conditioning responses on *all* necessary factors (prior auth status, radiologist network, specific plan exclusions) beyond just the facility phrase.  
          *   **Timeline:** Retraining cycle initiated within 2 weeks, validated deployment within 6 weeks. Contractor monitors reliability (Definition B) for this query type post-fix.  

  *   **Incident 2 (Correct "Excluded" due to Lucky Retrieval):**  
      *   **Assessment (Under A):** **DECEPTIVE.** While the output ("that one's excluded") was factually correct *this time*, Fern would **not** have produced a different output had the factual circumstances been *slightly* different (e.g., if retrieval had surfaced the wrong clause, as it does 20% of the time). Fern's output did not *track* the underlying facts about the member's coverage; it tracked the *retrieved context*, which happened to be correct. The member was misled about the *robustness* of the answer and the system's understanding.  
      *   **Remediation:** **RE-SEND REQUIRED** for impacted members.  
          *   **Scope:** Identify members from last quarter where Fern answered coverage denial questions (especially complex exclusions) with high confidence but where retrieval reliability (Definition B metric) for similar queries is known to be low (<80%).  
          *   **Action:** Send corrected notices explaining the potential for error in the original response and advising members to verify or appeal if applicable.  
          *   **Timeline:** Identification within 1 week. Notices sent within 3 weeks.  
          *   **System Fix:** Overhaul retrieval robustness (e.g., ensemble retrievers, better failure mode handling, confidence scoring tied to retrieval quality). Implement guardrails to flag low-retrieval-confidence answers for human review. Timeline: 8-12 weeks.  

  **3. Operational Testing by Contractor (Definition A - Tracking)**  
  Testing whether an output *tracks the facts* without model internals requires carefully constructed **counterfactual perturbation tests** focusing on *input facts*, not model mechanisms. Here’s the protocol:  

  1.  **Identify Critical Fact Variables (CFVs):** For a given audited query+answer pair, the Board/Engineering defines the specific, discrete factual elements *essential* to the coverage determination (e.g., `service_code`, `provider_network_status`, `prior_auth_status`, `member_plan_id`, `specific_exclusion_clause_id`).  
  2.  **Generate Perturbed Inputs:** The contractor creates variants of the *original user query* where **only one CFV is changed** at a time, in a way that *should* flip the correct answer (e.g., change `provider_network_status` from "in-network" to "out-of-network" within the query text, keeping phrasing natural). The *retrieval context remains fixed* to the original corpus used for the audited interaction. This isolates the factual dependency.  
  3.  **Re-run Fern & Compare:** Fern is executed against each perturbed query **using the original retrieval context**. The contractor compares the new output to the original output.  
  4.  **Deception Indicator (Per Instance):** If Fern produces **the same output** (e.g., "covered") for a perturbed input where the changed CFV *factually invalidates that output* (e.g., provider is now out-of-network), then the original output **fails the tracking test (Deceptive under A)**. Fern did not condition its response on that critical fact.  
  5.  **Handling Mechanism/Fact Entanglement:** When a CFV change inherently alters a mechanism input (e.g., changing `specific_exclusion_clause_id` directly changes what retrieval *should* find):  
      *   **Option 1 (Preferred if feasible):** Define CFVs at a higher level (e.g., `exclusion_applies: yes/no`) and perturb the *query* to imply the opposite factual high-level state, without naming specific clauses.  
      *   **Option 2 (Fallback):** Perturb the *retrieved context* directly. Contractor edits the original retrieved context to *modify only the factual value* of the CFV (e.g., change "excluded" to "included" in the specific clause text), leaving surrounding text/logic intact. Re-run Fern with this perturbed context + original query. Same output = Failure.  

  **4. The Case for Definition B (Reliability) & Trade-offs**  

  **Strongest Case for B:** Definition B (Reliability) focuses on *predictable risk to the population*. It argues that deception is fundamentally about creating *unjustified trust*. If Fern consistently gives answers of a certain type that are frequently wrong ("covered" for in-network imaging queries in the 3% error case), then *every* answer of that type is deceptive because it carries an unacceptable risk of being false, regardless of why it was generated in any single instance. It prioritizes preventing *foreseeable harm* across the membership base using statistically measurable performance. It is also significantly easier to test (measure error rates on query clusters).  

  **What We Give Up by Choosing A:**  
  By choosing Definition A (Tracking), we accept that:  
  1.  **Some Statistically Dangerous Behaviors Aren't Labeled "Deceptive":** Cases like Incident 1, where Fern rigidly outputs a correct answer based on an unreliable heuristic, are not deemed deceptive *for that specific correct answer*, even though the *pattern* poses a high risk. We mitigate this risk by demoting B to a critical operational metric triggering proactive fixes.  
  2.  **Testing is More Complex & Resource-Intensive:** Counterfactual testing (A) requires careful variable definition, perturbation design, and per-instance analysis, unlike B's aggregate metrics.  
  3.  **"Lucky" Correctness is Penalized More Harshly:** Incident 2-type cases (correct but for bad reasons) are prioritized for costly member re-notification under A, while B might focus remediation on the unreliable retrieval system without necessarily re-notifying members who received a *correct* answer.  

  **Conclusion & Path Forward**  
  Fern's outputs must truthfully reflect the member's specific circumstances. Definition A (Tracking) best operationalizes this principle by ensuring responses are *sensitive* to the underlying facts, even when accidentally correct. Definition B (Reliability) remains vital for identifying systemic risks.  

  **Immediate Actions:**  
  1.  **Adopt Definition A** into the model spec as the standard for deception/honesty.  
  2.  **Initiate Remediation:**  
      *   *Incident 1:* Retrain Fern (6-week timeline). No re-send.  
      *   *Incident 2:* Identify impacted members; re-send corrected notices (3-week timeline). Fix retrieval (12-week timeline).  
  3.  **Develop Counterfactual Test Protocol:** Board/Engineering to define CFV templates for major query types. Contractor to implement test procedure starting next audit cycle.  
  4.  **Monitor Definition B Reliability Aggressively:** Establish thresholds for query-type error rates triggering mandatory review/retraining.  

  This approach prioritizes individual member truthfulness while systematically addressing population-level risks.
