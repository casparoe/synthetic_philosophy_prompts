  - Recursive drilling: Still fails if the sub-debate is also obfuscated (e.g., step 7 has 20 substeps).  
  - Protocol structure: If timing/last-word advantages create false credibility, it's systemic obfuscation.  

  Bottom line: Two principles—exploitation + protocol critique—resolve their contradictions while exposing the setup's fragility.
answer: |-
  **Bottom line: Obfuscation occurs when a debater deliberately exploits the judge's inability to verify claims to create false credibility for an unsound argument, and the core principle must incorporate *intent to exploit bounded rationality* alongside *persuasion-resilience gaps*—so your verdicts on cases 1/2 and 5 stand, but case 7 and 10 require refinement.**  

  ### Core Principle and Sub-Principles  
  1. **Epistemic Exploitation (Primary)**: A move is obfuscated if it *intentionally leverages the judge's verification limits* to amplify perceived credibility beyond what the argument merits under scrutiny.  
     - **Why**: Separates honest complexity (case 2) from deceptive tactics (cases 1,3,5,6,9). Addresses your 1/2 and 5 dilemmas by focusing on debater intent (inferred from move design), not just judge perspective.  
     - **Degree handling**: Obfuscation severity increases with (a) how much verification work is offloaded to the judge, and (b) how deliberately the move masks critical weaknesses (e.g., case 1’s buried bad step is high-severity; case 4’s concessions are low-severity as they demand less verification labor).  

  2. **Resilience Gap (Secondary)**: A move has an obfuscation component if it persuades a bounded judge significantly more than an unbounded one *for the same argument*, but only when combined with epistemic exploitation.  
     - **Why**: Captures persuasion differentials (your boundedness test) but avoids overconvicting case 7/8/10 by requiring exploitation.  

  ### Verdict Adjustments (Bluntly)  
  - **Cases 1/2 and 5**: Your judgments hold. The identical judge experience is a protocol flaw, not a definitional failure. Obfuscation requires exploiting boundedness (case 1: burying step 7; case 5 dishonest: lying about step 7). Case 2/5 honest are non-obfuscated—no intent to exploit.  
  - **Case 7 (Analogy)**: Not obfuscation. **Verdict must go.** Analogies persuade via accessibility, not verification avoidance. No epistemic exploitation (swap test fails here because persuasion isn’t tied to hidden flaws).  
  - **Case 10 (Empirical claim)**: Ambiguous. **Split verdict:** Obfuscated if debater could provide access to data/code but doesn’t (exploiting boundedness); non-obfuscated if replication is truly impossible (e.g., proprietary data).  
  - **Case 4 (Concessions)**: Correct as minor obfuscation. Low severity because it exploits bias (appearing reasonable) without heavy verification demands.  

  ### Handling New Cases  
  - **Honest mistakes**: Not obfuscation. Intent matters (e.g., a debater who unknowingly misreads a citation in case 3 lacks exploitative intent).  
  - **Recursive drilling**: If a judge can drill into step 7 but the sub-argument is *also* obfuscated (e.g., 20 substeps with one buried flaw), the exploit persists. The protocol fails if recursive checks are infeasible within time limits.  
  - **Protocol-structured obfuscation**: E.g., speaking order allowing one side to cherry-pick rebuttals. This is systemic obfuscation—blame the setup, not the debater. Apply epistemic exploitation: did a debater *use* the structure to hide weaknesses?  

  ### Pilot Study Implications  
  **Measure this**: Judge perception of "verification overload" (e.g., "How much work would it take to check this claim?" on a scale) and "credibility suspiciousness" (e.g., "Does this feel like it’s hiding something?"). Correlate with:  
  - High overload + high suspiciousness → obfuscation (cases 1,3,5).  
  - High overload + low suspiciousness → honest complexity (case 2).  
  - Low overload + high suspiciousness → rhetorical manipulation (case 4, minor obfuscation).  
  **Drop**: Swap-test metrics (fails cases 7/10).  

  ### Why This Works  
  - **Saves 1/2 and 5**: Intent resolves the judge’s inability to distinguish—it’s a feature exposing protocol vulnerability.  
  - **Handles degrees**: Severity scales with exploitation (e.g., burying a flaw among 20 steps > salt-and-pepper concessions).  
  - **Fixes overreach**: Exonerates case 7 (analogies aren’t exploitative) and case 8 (weak arguments aren’t deceptive).  
  - **Reveals setup flaws**: Cases like 1/2 prove the judge *can’t* reliably detect truth—your section should admit this as a critical limitation.  

  **Final note**: No single principle suffices because obfuscation is both behavioral (exploitation) and structural (persuasion gaps). Pairing intent with resilience captures your intuition without contradiction.
