prompt: |-
  You are a political philosopher and institutional economist who has spent a decade advising regulators, standards bodies and collective-action funders on why coordination fails, and who is unusually good at turning game-theoretic ideas into checklists that intelligent non-specialists can actually run. Please think carefully before you write: brainstorm two or three candidate procedures, note in a sentence or two what each one loses, and then give me the one you recommend. Write the whole thing in British English.

  I direct the secretariat of a small philanthropic fund that makes around twenty-five grants a year, mostly between £200k and £2m, to interventions whose stated purpose is to stop a race to the bottom in some domain: a voluntary cap, a shared audit standard, a no-first-use pledge, a joint liability arrangement, an information-sharing or monitoring scheme. Our analysts get roughly one working day per proposal, the proposal pack is often thin on the numbers, and the final decision is made by a committee of seven trustees, four of whom have no economics or philosophy background and will not read anything longer than four pages. Last year we funded a voluntary moratorium in one sector and watched the race reappear a few months later as a fight over who got to write the standard, and I do not want to repeat that. So I need a decision procedure my analysts can run on any such proposal: the questions in order, what counts as a sufficient answer to each, the gates where we simply stop with a no, the gates where we hand the decision to the trustees because the question is one of values rather than facts, and an explicit flag on every step that is really a judgement call dressed up as a procedure. Tell me what an analyst should do when a number cannot be obtained. Keep the procedure itself to something readable in fifteen minutes.

  I also want you to build in, as explicit steps, some distinctions that our discussions keep collapsing. First, whether the bad outcome is genuinely structural, in the sense that each party would prefer the outcome in which nobody races yet each still gains by racing, or whether it is really produced by a handful of identifiable actors whose behaviour we could sanction directly, because the two call for very different interventions. Second, the entrant margin: even if the post-intervention payoff matrix makes restraint rational for existing signatories, would a new actor who never signed still find defection dominant, and is that actor likely to matter? Third, axis relocation: suppressing a race along one dimension usually moves it to another, such as jurisdictional arbitrage, acquisition of the restrained, redefinition of the metric, or competition among the monitors, so require the proposal to name the axis the race is expected to move to and why competition there is less destructive. Fourth, detection latency: if the gains from defection land before defection can be verified, no monitoring regime saves the arrangement. Fifth, whether the good being competed away is one the racers themselves value, one that only outsiders value, or one nobody values, and what follows for each. Sixth, the asymmetry question, whether the arrangement degrades gracefully when it partly fails or fails catastrophically, and who bears the residual risk, including people who never signed. Finally, apply the procedure once recursively to whoever enforces the arrangement, since enforcers are themselves subject to races.

  Then run the finished procedure on three proposals and show your working, including where it stalls. One: a pledge among nine frontier AI developers not to train above a stated compute threshold until a shared evaluation regime exists, with signatories covering most but not all of the credible actors, and with the evaluators funded by the developers themselves. Two: a common third-party safety and quality audit standard written and adopted by fifteen small and mid-sized firms in a fragmented subcontracting industry, while the four largest buyers, who hold around sixty per cent of the market, have declined to sign and say they will revisit it next year; compliance costs fall mostly on the signatories. Three, and this is the one where I expect an answer I will not like: a two-year convening and norm-building programme we have already half-promised to an ally, consisting of a secretariat, an annual summit, a shared vocabulary and a pledge text, with no monitoring and no change to anyone's payoffs, which several trustees are enthusiastic about. Be blunt about what the procedure says on that one, and do not soften it to keep me happy. Close with a short section on what the procedure cannot do: the kinds of race it is structurally blind to, the proposals it will systematically underrate, and the failure mode in which having a procedure becomes a reason to fund nothing at all.
reasoning: |-
  Okay, the user is a director of a philanthropic fund that makes grants to prevent races to the bottom. They need a practical decision procedure for evaluating proposals, given constraints like limited analyst time and trustee backgrounds. Let me unpack their requirements carefully.

  First, the core problem: They funded a voluntary moratorium that failed when signatories started fighting over standards. This shows interventions can backfire if not properly vetted. They need a robust framework to avoid such failures.

  Key constraints to consider:
  - Analysts get only one day per proposal
  - Proposal packs lack detailed numbers
  - Trustees include non-specialists who won't read beyond 4 pages
  - Must prevent past failure modes like axis relocation

  The user explicitly wants six critical distinctions built into the procedure:
  1. Structural vs actor-driven problems
  2. Entrant margin risks
  3. Axis relocation
  4. Detection latency
  5. Nature of the competed good
  6. Failure asymmetry

  Additionally, they want recursive application to enforcers. That's crucial because enforcers themselves can be part of the race dynamic.

  Hmm... developing the procedure requires balancing thoroughness with practicality. Let me sketch three candidate approaches:

  Candidate A: Sequential Gates Model
  - Pros: Clear go/no-go points, efficient for analysts
  - Cons: May oversimplify complex interdependencies

  Candidate B: Weighted Scoring Matrix
  - Pros: Handles qualitative nuances better
  - Cons: Requires more analyst judgment, harder to explain to trustees

  Candidate C: Hybrid Flowchart (Recommended)
  - Combines gates with narrative flags
  - Explicitly separates factual analysis from value judgments
  - Visual format aids trustee communication

  The hybrid seems best - it meets the 15-minute readability requirement while accommodating the six distinctions. For unattainable numbers, we'll build in "best evidence" rules with confidence flags.

  Now for the test cases:
  AI Compute Cap: Strong on commitment but weak on enforcement recursion - the evaluator funding creates new race risks. Flags axis relocation to standard-setting.

  Audit Standard: Fails entrant margin test since big buyers didn't sign. Also detection latency issues with subcontractor audits.

  Norm-Building Programme: Hard no. No payoff changes or monitoring - essentially theater. Must be blunt as user requested.

  Finally, the limitations section must warn about:
  - Hidden races (those not in the proposal's framing)
  - Positive-sum collaborations mistaken for races
  - Procedure becoming a paralysis tool

  The tone throughout should be British English - "grey" not "gray", "centre" not "center". And absolutely no softening on the norm-building programme critique.
answer: |-
  Here is a recommended decision procedure for your analysts, designed as a 12-step checklist. It incorporates your requirements, emphasises critical distinctions, and remains executable within one analyst-day. Steps requiring significant judgment are flagged with **(J)**.

  **Race-to-the-Bottom Intervention Assessment Procedure**

  1.  **Define the Race:** What specific competitive behaviour leads to the destructive outcome? What is being degraded (safety, wages, quality, stability)? *Sufficient:* Clear description of the action (e.g., cutting safety audits) and the resulting harm. *Gate:* Stop if no destructive competitive behaviour is identified or if harm is vague. **(J)**
  2.  **Structural or Villain?** Is this a true prisoner's dilemma (all prefer mutual restraint but individually gain by defecting), or is it driven by a few identifiable bad actors? *Sufficient:* Evidence of widespread incentive misalignment (structural) or identification of specific recalcitrant actors (villain). *Gate:* Stop if it's clearly villain-driven *and* direct sanctioning (e.g., buyer pressure, regulation) is a more viable/effective path than the proposed intervention. *Flag Trustee:* If the intervention type (collective pact vs targeted sanction) is a values choice despite the facts.
  3.  **The Good Destroyed:** Who values the good being competed away? (a) Racers themselves (e.g., industry stability), (b) Outsiders only (e.g., public safety, environment), (c) Nobody (e.g., a purely symbolic norm)? *Sufficient:* Categorisation and rationale. *Gate:* Stop if (c) – it's performative. *Flag Trustee:* Significant weight on (b) may require value judgments on external harms. **(J)**
  4.  **Post-Intervention Payoff:** Does the intervention change the payoff matrix *for existing signatories*? How? Does mutual cooperation now yield a higher *individual* payoff than defection? *Sufficient:* Qualitative description of changed incentives (e.g., reputational gain, market access, reduced liability) making restraint rational. *Gate:* Stop if defection remains dominant for signatories *unless* Step 5 provides a compelling mitigation. *Missing Number:* Analyst assesses plausibility based on mechanisms described, flags confidence level (High/Medium/Low). **(J)**
  5.  **Detection & Enforcement:** How is defection detected, how quickly (vs. gains realisation), and how is it sanctioned? *Sufficient:* Credible monitoring mechanism (3rd party, mutual, tech-enabled) and sanctions (financial, reputational, exclusion) that outweigh defection gains *within the detection latency period*. *Gate:* Stop if detection latency exceeds the period where defection gains are decisive, or sanctions are implausibly weak. *Missing Number:* Analyst estimates latency/sanction severity qualitatively, flags confidence. **(J)**
  6.  **The Entrant Margin:** Would a new, credible actor *who didn't sign* still find defection the dominant strategy? Are such entrants likely? *Sufficient:* Assessment of barriers to entry and payoff structure for non-signatories. *Gate:* Stop if non-signatory defection remains dominant *and* credible entrants exist *and* the intervention doesn't effectively block their market access/impact. **(J)**
  7.  **Axis Relocation:** If the race is suppressed on this dimension, where will competition likely intensify? (e.g., price, speed, jurisdiction, acquisition, standard-lobbying). Why is competition on *that* axis less destructive? *Sufficient:* Plausible alternative axis identified and rationale for reduced harm. *Gate:* Stop if the relocated race poses similar or greater harm, or if no relocation is considered. **(J)**
  8.  **Asymmetry & Failure Risk:** Does the arrangement degrade gracefully (some defection doesn't cause total collapse)? Who bears the residual risk if it fails catastrophically (signatories, outsiders)? *Sufficient:* Description of failure modes and risk allocation. *Gate:* Stop if failure is likely catastrophic *and* significant risk lands on vulnerable outsiders who didn't consent. *Flag Trustee:* Tolerance for catastrophic failure risk is a value judgment.
  9.  **Recursive Enforcement Test:** Apply Steps 1-8 recursively to the proposed *enforcement mechanism* (monitors, auditors, sanctioning body). Are *they* in a race? *Sufficient:* Brief analysis of enforcer incentives and vulnerabilities. *Gate:* Stop if the enforcers themselves face a critical, unaddressed race-to-the-bottom (e.g., competing for contracts leading to lax monitoring). **(J)**
  10. **Coverage & Cost Burden:** What % of credible actors are in/out? Do costs fall disproportionately? *Sufficient:* Estimate of market/share coverage and who bears compliance costs. *Gate:* Stop if key actors holding decisive market power (>20-30%?) are out *and* Step 6 (Entrant Margin) flags a risk. *Missing Number:* Analyst estimates coverage based on market knowledge/proposal claims, flags confidence.
  11. **Value Conflict Check:** Does supporting this intervention conflict with core fund values (e.g., equity, fairness, avoiding regulatory capture)? *Sufficient:* Brief consideration. *Flag Trustee:* Any identified conflict requires trustee decision.
  12. **Overall Viability Judgment:** Weighing Steps 1-11, is the intervention *plausibly* effective and robust? *Sufficient:* Summary judgment (Yes/No/Uncertain). *Flag Trustee:* Final funding decision always rests with trustees. **(J)**

  **Analyst Output:** A 1-2 page memo structured around the steps: Pass/Fail/Flag for each gate, key findings for each step, confidence flags on judgments, and a concise summary recommendation.

  ---

  **Procedure Applied to Example Proposals**

  **Proposal 1: Frontier AI Compute Cap Pledge**
  *   **Step 1:** Race defined (training scale → reckless capabilities, instability). Pass.
  *   **Step 2:** Likely structural (individual gain from pushing boundaries despite collective risk). Pass.
  *   **Step 3:** Good: Public safety (b). Outsiders value it most. Pass.
  *   **Step 4:** Payoff changed? Reputation & policy risk *might* make restraint rational. Uncertainty on payoff dominance. (J) Medium Confidence. Pass (cautiously).
  *   **Step 5:** Detection/Enforcement? Latency high (training secret). Enforcement undefined beyond "evaluation regime". Sanctions? Reputation only? **GATE STOP.** Detection too slow, sanctions weak. Enforcers (Step 9) funded by developers → race to please funders? Recursion fails Step 5 & 9. **Recommendation: REJECT.**

  **Proposal 2: Subcontractor Audit Standard**
  *   **Step 1:** Race defined (cutting safety/quality audits → worker hazards, poor outputs). Pass.
  *   **Step 2:** Mix: Structural pressure but large buyers (60%) are key drivers. Villain potential. *Flag Trustee:* Is pact the right tool vs buyer pressure? Pass (for now).
  *   **Step 3:** Good: Worker safety, product quality (mix a/b). Pass.
  *   **Step 4:** Payoff changed? For signatories: Potential access to signatory buyers? Unclear. Costs are certain, benefits depend on buyer uptake. (J) Low Confidence. Pass (weakly).
  *   **Step 5:** Detection/Enforcement? 3rd party audits. Latency medium. Sanctions: Loss of certification? Credible if buyers demand it. Pass.
  *   **Step 6: Entrant Margin:** **GATE STOP.** Non-signatory buyers (60% market!) face *no* cost to use cheaper, non-compliant subs. Defection (using non-audited subs) dominant for them. Entrants (new subs) also incentivised to skip audit costs if buyers allow. **Recommendation: REJECT.** (Axis Relocation (Step 7) also likely: race shifts to lobbying buyers or audit-shopping).

  **Proposal 3: Norm-Building Convening (Half-Promised)**
  *   **Step 1:** Race defined? Vague ("race to bottom in X"). **GATE STOP.** Fails Step 1. *Hypothetically assuming a race is defined:*
  *   **Step 3:** Good? Unclear. Likely vague norm. Risk of (c).
  *   **Step 4:** Payoff changed? **NO.** No mechanism to alter incentives. Pledge text ≠ payoff change.
  *   **Step 5:** Detection/Enforcement? **NO.** No monitoring or sanctions.
  *   **Step 6:** Entrant Margin: Irrelevant – core intervention lacks teeth.
  *   **Step 7:** Axis Relocation: Unaddressed.
  *   **Step 9:** Recursive Enforcement? No enforcer defined.
  *   **Overall:** **Fails multiple gates (1, 4, 5 fundamentally).** It creates "coordination theatre" – shared vocabulary and pledges without altering the underlying game. It risks wasting resources and legitimising inaction. **Recommendation: REJECT.** *Bluntly: This funds process, not progress against the race dynamic.*

  ---

  **What This Procedure Cannot Do (Limitations)**

  1.  **Blind to Hidden Races:** It assesses *proposed* interventions against a *stated* race. It cannot uncover races the proposer hasn't identified or deliberately obscures. Analysts need domain awareness.
  2.  **Underrates Positive-Sum Coordination:** The focus is zero-sum/negative-sum races. Proposals aiming purely for positive-sum gains (e.g., shared R&D infrastructure) might score poorly as they don't fit the "stopping a race" mould, even if valuable.
  3.  **Systematically Skeptical of "Soft" Interventions:** Norms, convening, and non-binding pledges are heavily disfavoured unless they demonstrably alter payoffs (Step 4) – which is rare. This is intentional based on your failure.
  4.  **Paralysis by Procedure:** The biggest failure mode is using the procedure's rigor and inherent skepticism as an excuse for perpetual inaction. **The procedure identifies flaws; it doesn't absolve trustees of the responsibility to fund *anything* in a messy world.** Steps 11 and 12 exist to force the value judgment and decision. Analysts must flag *promising-but-imperfect* proposals requiring trustee courage.
  5.  **Ignores Implementation Capacity:** It assesses intervention *design* logic, not the proposer's ability to execute it. This must be a separate (but crucial) analyst assessment.
  6.  **Limited Prediction:** It assesses plausibility, not certainty. Complex systems defy perfect prediction. The procedure mitigates against *obvious, predictable* failures (like your moratorium).

  This procedure forces critical distinctions, surfaces key vulnerabilities (especially entrant margin, axis relocation, enforcement recursion), and provides clear stopping points for analysts. It demands explicit judgment calls, separates facts from values for trustees, and ruthlessly exposes "coordination theatre." Its strength is preventing obviously flawed grants; its weakness is potentially missing non-obvious opportunities or favouring only "hard" mechanisms. Use it to inform, not replace, trustee wisdom and courage.
