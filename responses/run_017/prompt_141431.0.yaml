prompt: |-
  I'm 68, did most of my career in protein crystallography, and I've gone back to uni part-time for an MA in philosophy, which in practice means I sit in a pub with four people half my age and argue. Last week's session was on the separateness of persons objection to utilitarianism, and the PhD student who runs the group made a move I can't shake. She said the objection only looks forceful because the interpersonal case feels exotic while the intrapersonal one is familiar, but that really distributing welfare across persons is just like distributing it across the decades of a single life: time slices of one person are 'separate' from each other in all the ways that are supposed to matter (the twenty-something who pays the cost and the sixty-something who collects the benefit never share a moment, and one can be in pain while the other isn't), and yet everyone thinks prudence is obviously in order. So, she concluded, if you accept trading a smaller pain at t1 for a bigger pleasure at t2, you've already conceded everything the utilitarian needs, and the separateness of persons is a distinction without a difference. When my mate Dave (ex-theoretical physicist, same course) objected that within a life there's one continuing subject who anticipates the cost, consents to the plan at the time of choosing, and later literally becomes the beneficiary, she had a reply ready: if continuity of the subject is what's doing the work, then anyone undergoing radical psychological discontinuity — dense amnesia, late-stage dementia — has a weakened claim to prudential concern, and that, she said, is absurd. Dave said that just shows continuity isn't sufficient either, not that it's irrelevant. Neither budged, and my hearing aid was packing up so I lost the last ten minutes.

  I'd like an audit of the analogy rather than a verdict on utilitarianism itself. Can you lay out the correspondence table — what plays the role of the time slice, the prudent planner, the discount rate, death, anticipation, consent, and the fixed lifetime budget on each side — then separate the places the mapping breaks from the places it doesn't, and say which of those breaks actually bear on the conclusion she wanted? Two things I keep turning over that I don't think either of them addressed. First: how much of the felt difference is really about the *number of subjects*, and how much about the *leakiness of the transfer*? Cross-time transfers inside one life aren't frictionless either — there's discounting, there's the chance you die before the payoff, and a year of joy at seventy may just not be the same item as a year of joy at twenty — so maybe the intrapersonal case is nearer the interpersonal one than Dave allows, and the leakiness is doing more of the argumentative work than separateness is. Second, I tried to build a test case: stipulate a single stream of consciousness that gets migrated from one body into another mid-life, so that the subject who makes the sacrifice at t1 is numerically the same subject who collects at t2; and then its mirror image, one stream that gets divided into two. If the objection is about the separateness of subjects, the first case should look like plain prudence and the second should turn prudence into utilitarianism without anything else changing — which suggests the whole dispute piggybacks on a theory of personal identity, and I want to know whether that's a cost it can absorb or whether it gives up the game.

  And if the lifetime analogy can't carry her conclusion, what would a better one look like — or is additivity just something you have to argue for in its own terms, wich I suspect is what Dave was reaching for and couldn't quite say?
reasoning: |-
  Okay, let me try to unpack this user's query. He's a 68-year-old former protein crystallographer now doing an MA in philosophy. The discussion in his pub group revolved around the separateness of persons objection to utilitarianism. The PhD student argued that distributing welfare across different people is similar to distributing it across different time slices of a single person, using prudence as an analogy. The user wants an audit of this analogy, not a verdict on utilitarianism itself.

  First, I need to map out the correspondence between intrapersonal and interpersonal cases. The time slices in a single life correspond to different persons in the interpersonal case. The prudent planner is the person making decisions for their future selves, analogous to a utilitarian planner for society. Discount rates apply in both—temporal discounting for individuals and possibly social discounting for groups. Death in a personal timeline is like the end of a person's existence in society. Anticipation and consent play roles in intrapersonal cases but are trickier interpersonally. The fixed lifetime budget is the total welfare one can experience, similar to society's total welfare.

  Next, where does the analogy hold? Both involve distributing welfare across distinct entities (time slices or persons). Neither has simultaneous experience—pain and pleasure occur at different times or to different people. Discounting applies in both scenarios. Also, both operate under uncertainty about future events, like death or societal changes. The continuity of identity isn't necessary for prudence, as seen in cases of amnesia or dementia, which challenges the idea that separateness is unique to interpersonal cases.

  But the analogy breaks down in several places. Numerically distinct subjects: time slices are phases of one entity, while persons are fundamentally separate. Continuity of subject experience: anticipation and memory link time slices, but these are absent between persons. Consent: future selves can't opt out, but individuals in society can. Leakiness in transfers: intrapersonal has biological constraints, while interpersonal has coordination problems and enforcement issues. Fixed budget: lifetime welfare is bounded, but societal welfare isn't capped. The first-personal stakes are different—making sacrifices for oneself feels different than for others.

  The user's points about the number of subjects and leakiness are crucial. If leakiness (discounting, uncertainty) is the main issue, then the separateness might not be the key factor. His test cases—body migration and stream division—show that personal identity theory is central. If continuity of consciousness determines identity, then the analogy's success depends on that theory, which is a heavy burden.

  The PhD student's conclusion might overreach. The analogy shows that separateness isn't the only issue, but it doesn't prove that interpersonal trade-offs are exactly like intrapersonal ones. Better analogies might involve overlapping selves or intergenerational projects, but additivity might need standalone arguments. The user suspects Dave was hinting at this, which is valid.

  Overall, the analogy highlights that both cases involve distribution across non-simultaneous entities, but the differences in identity, consent, and transfer mechanisms weaken the PhD student's conclusion. The separateness objection still holds weight because persons are distinct in ways time slices aren't, but the debate is more about personal identity than pure separateness.
answer: |-
  Here's a structural audit of the analogy, mapping the correspondence, identifying where it holds/breaks, and assessing the breaks relevant to the PhD student's conclusion, incorporating your key insights:

  **Correspondence Table:**

  | Concept                   | Intrapersonal Case (Prudence)          | Interpersonal Case (Utilitarianism)    |
  | :------------------------ | :------------------------------------- | :------------------------------------- |
  | **Unit of Welfare**       | Time-Slice (e.g., 20-yr-old self, 60-yr-old self) | Individual Person                       |
  | **Planner/Agent**         | The "Prudent Planner" (Present Self)   | Utilitarian Planner/Social Chooser     |
  | **Transfer Mechanism**    | Commitment, Habit, Memory, Physiology  | Social Institutions, Contracts, Coercion, Altruism |
  | **Discount Rate**         | Temporal Discounting (δ_t)             | Social Discounting? (δ_s) / Pure Impartiality (δ=0) |
  | **Terminal Event**        | Death (End of Personal Timeline)       | (Metaphorical) "Death" of Society/Project/Generation? |
  | **Anticipation**          | Direct: Future Self *is* me            | Indirect: Empathy, Theory, Projection  |
  | **Consent**               | Implied/Procedural (by acting now)     | Explicit/Opt-In Often Absent (Coercion Risk) |
  | **Fixed Budget (Total)**  | Lifetime Welfare Capacity (Finite)     | Societal Welfare (Potentially Infinite/Regenerative) |
  | **"Leakiness" Sources**   | Death risk, discounting, preference/hedonic change | Coordination costs, enforcement, preference heterogeneity, empathy failures |

  **Where the Analogy Holds (Supporting PhD Student):**

  1.  **Non-Simultaneity:** Both involve distributing welfare across entities that do not *simultaneously* experience cost and benefit. The 20-yr-old's pain and the 60-yr-old's pleasure are distinct temporal events, just as Person A's sacrifice and Person B's gain are distinct.
  2.  **Distinct Experiential States:** A time-slice can be suffering while another is thriving, mirroring interpersonal differences in welfare states. The *phenomenological separateness* at a given moment is similar.
  3.  **Discounting & Uncertainty Apply:** Both contexts involve practical reasons to discount future/others' welfare (risk of non-realization – death/social breakdown; changing preferences/hedonic treadmill vs. differing values/empathy limits). This addresses your "leakiness" point directly – **you're right that this shared friction weakens the *prima facie* uniqueness of the interpersonal case.**
  4.  **Continuity Not Strictly Necessary for Prudence:** As the PhD student argued, we *do* recognize obligations to future selves even under potential discontinuity (dense amnesia, dementia). We feel the 30-yr-old who saved for retirement owes *something* to the 80-yr-old with dementia, even if the latter doesn't remember the saving. This *does* challenge Dave's appeal to continuity as the *essential* factor. If prudence survives radical discontinuity, why is interpersonal separateness uniquely problematic?
  5.  **Additive Structure:** Both frameworks fundamentally involve summing welfare states across distinct entities (time-slices/persons) to make optimizing decisions.

  **Where the Analogy Breaks (Challenging PhD Student's Conclusion):**

  1.  **Numerically Distinct Subjects:** This is the core break. Time-slices are *stages* of a single, numerically identical entity (Entity X at T1, Entity X at T2). Persons (A, B) are distinct fundamental entities. This difference in **cardinality of subjects** is profound. Your test case highlights this perfectly:
      *   **Body Swap (Same Stream, New Vessel):** Sacrificer (T1) *is* beneficiary (T2) (numerically identical subject). This feels like prudence. The physical separation doesn't alter the core identity.
      *   **Stream Division (One Stream → Two):** A single stream splits into two distinct, non-unified subjects (A & B). Sacrifice by the pre-division entity for *only one* descendant (say, A) feels deeply unfair to B, *even though the pre-division entity "contained" both*. This becomes interpersonal trade-off *between A and B*, not prudence. **This strongly suggests the *numerical identity of the subject* is doing crucial work that the time-slice analogy obscures.**
  2.  **Continuity of Subject & First-Person Perspective:** While not *strictly* necessary (see Hold #4), robust psychological continuity (anticipation, memory, narrative identity) is the *typical foundation* of prudence. The 20-yr-old *anticipates* being the 60-yr-old and *experiences* the benefit *as theirs*. Person A cannot anticipate *being* Person B or experience B's gain *as their own* gain in the same first-personal way. This underpins Dave's "consent" point – the planner *becomes* the beneficiary. **The leakiness is similar, but the *stakes of ownership* are fundamentally different.**
  3.  **Consent & Authority:** The prudent planner *is* (or will be) *all* the relevant entities. Sacrificing for your future self is an act of self-governance. Imposing a sacrifice on Person A for Person B requires justification *to A* (consent, reciprocity, coercion) that isn't needed intrapersonally. The "planner" in utilitarianism is external.
  4.  **Leakiness - Nature & Scale:** While leakiness exists both ways, its *nature* differs significantly:
      *   *Intrapersonal:* Primarily biological/psychological (death, discounting, hedonic change). Often predictable/quantifiable.
      *   *Interpersonal:* Primarily social/political (enforcement costs, free-riding, preference clashes, empathy gaps). Often systemic and harder to quantify/control. **The PhD student downplays how this *qualitative* difference in leakiness amplifies the moral significance of separateness.**
  5.  **Fixed Budget - Open vs. Closed System:** A single life is a closed system with a fixed maximum welfare potential. Society is an open system – gains for B don't *necessarily* come *only* from A's loss; growth, innovation, and cooperation can create net gains (though distributional conflicts remain). Utilitarianism isn't *just* about re-distributing a fixed pie.
  6.  **Moral Claimants:** Time-slices aren't independent moral claimants. We don't owe duties *to* our past or future selves *as separate agents*; prudence is a duty *to oneself* as a temporally extended being. Persons *are* independent moral claimants owed duties directly.

  **Relevance of Breaks to PhD Student's Conclusion:**

  1.  **Crucial Breaks (Undermine "Distinction Without a Difference"):** Breaks #1 (Numerically Distinct Subjects) and #2 (First-Person Perspective/Ownership) are fatal to the strong conclusion that "if you accept prudence, you've conceded everything." Your test cases powerfully illustrate this. Prudence involves trade-offs *within a single life* governed by a single agent's interests over time. Utilitarianism involves trade-offs *between distinct lives* governed by distinct agents' potentially conflicting interests. The separateness *does* mark a morally relevant difference in the *kind* of entity whose welfare is being balanced. Break #3 (Consent/Authority) reinforces this.
  2.  **Mitigating Breaks (Support Analogy's Limited Point):** Break #4 (Leakiness - Nature) *doesn't* destroy the analogy but shows its limits. Shared leakiness weakens the *initial intuitive force* of the separateness objection ("How can we compare? It's too hard/weird!") by showing comparison *is* hard even intrapersonally. However, the *qualitative differences* in leakiness and the breaks above mean leakiness alone doesn't *justify* collapsing the interpersonal into the intrapersonal. Hold #4 (Continuity Not Strictly Necessary) successfully rebuts Dave's *overreliance* on continuity but doesn't prove separateness is irrelevant.
  3.  **Less Directly Relevant Breaks:** Breaks #5 (Fixed Budget) and #6 (Moral Claimants) are important differences but less central to the core analogy about the structure of trade-offs across distinct entities.

  **Your Insights & Test Cases - Confirmed & Amplified:**

  *   **Leakiness vs. Separateness:** You're absolutely right. The analogy *does* reveal that much of the *practical* difficulty in interpersonal trade-offs (leakiness: coordination, enforcement, uncertainty) has parallels intrapersonally (death, discounting, change). This significantly weakens the argument that separateness *as such* makes interpersonal aggregation uniquely *impractical* or *conceptually incoherent*. **However, it doesn't show separateness is morally irrelevant.** The leakiness is a symptom, not the core disease. The core difference is the distinctness of claimants (#1, #2, #3).
  *   **Test Cases & Personal Identity:** Your test cases are brilliant diagnostics. They show unequivocally that **numerical identity of the subject** is what makes the intrapersonal case feel like prudence, not just the temporal separation or the mechanics of transfer. The PhD student's analogy tries to sidestep personal identity by focusing on the separateness *within* a life, but your cases show identity is the bedrock. **This is a major cost:** The analogy's success *depends* on adopting a specific (often reductionist/Parrowdean) view of personal identity as psychological connectedness/continuity *of a certain degree* rather than numerical identity. If one holds a substance-based or stronger continuity view, the analogy weakens further. If one embraces the reductionist view, the analogy gains force *for those who accept that view*, but it doesn't *prove* that view correct – it just assumes it. This shifts the debate to metaphysics, which utilitarianism may struggle to "absorb" without circularity.

  **Beyond the Analogy: Arguing for Additivity**

  You suspect Dave was grasping for this, and you're likely correct. The PhD student uses the analogy to *defuse an objection* to utilitarianism (the separateness objection), suggesting that if you accept one kind of aggregation (over time), accepting another (over persons) isn't a big leap. However, the breaks show it *is* a leap. A better approach might be:

  1.  **Direct Moral Argument for Impartiality:** Argue that morality *requires* taking an impartial perspective where the separateness of persons is irrelevant to the *equal consideration of interests* (e.g., Singer, Hare). The analogy is illustrative but not foundational.
  2.  **Contractualist/Reciprocity Arguments:** Show that mutually beneficial cooperation requires accepting rules that sometimes impose net costs on individuals for the greater good, justified by reciprocity over time (e.g., rule utilitarianism, Scanlon). This acknowledges separateness but finds grounds for trade-offs.
  3.  **Phenomenological Argument:** Argue that empathy or shared humanity allows us to transcend separateness in a way that makes interpersonal aggregation meaningful *despite* the differences (less common in strict utilitarianism). Your leakiness point highlights the practical limits here.
  4.  **Accept the Burden:** Acknowledge that interpersonal aggregation *is* different and requires its own justification grounded in foundational moral principles (e.g., welfare maximization is intrinsically good, impartiality is fundamental), rather than relying heavily on the prudence analogy.

  **Conclusion:**

  The PhD student's analogy is powerful and insightful. It successfully:
  *   Challenges the *intuitive obviousness* of the separateness objection.
  *   Shows that practical difficulties (leakiness) exist intrapersonally.
  *   Weakens arguments relying *solely* on continuity or simultaneity.
  *   Highlights the structural similarity of additive welfare optimization.

  However, it **fails** to show separateness is a "distinction without a difference" or that accepting prudence "concedes everything" to utilitarianism, because:
  1.  **Numerical Identity:** Time-slices are parts of one subject; persons are distinct subjects (your test cases prove this is crucial).
  2.  **First-Person Perspective/Ownership:** Prudence involves trade-offs within one agent's interests over time; utilitarianism involves trade-offs among distinct agents' interests.
  3.  **Consent/Authority:** The planner *is* the subject in prudence; not so in utilitarianism.
  4.  **Piggybacking on Identity Theory:** The analogy's force depends on a contestable reductionist view of personal identity.

  The analogy is best seen as a **parity argument**: "Given you accept *this* kind of trade-off across distinct entities (time-slices) with leakiness and without strict continuity, why is *this other* kind (persons) uniquely problematic?" It effectively shifts the burden but doesn't eliminate it. A full defense of utilitarianism requires tackling the distinctness of moral patients head-on, likely through direct arguments for impartiality and the equal consideration of interests, rather than leaning too heavily on the prudence analogy. The leakiness you identified is a shared *practical* challenge, but the separateness remains a *fundamental moral* distinction.
