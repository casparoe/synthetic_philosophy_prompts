prompt: |-
  I've been asked to write down my real position on animals rather than repeat an organisation's line — I sit on the board of a large municipal animal shelter and do volunteer policy work for a farmed-animal welfare group, and the two roles keep pulling me in different directions. Before I present it to either group I'd like an audit of whether it hangs together. Roughly where I've landed:

  1. Speciesism is unjustified. Sentience is what makes a being count morally at all; once a being counts, its interests count equally regardless of species, and psychological capacities rather than species membership are what track the content of what we owe.

  2. Full protection against being killed attaches only to persons — beings with an extended self-conception, plans and projects that reach into the future. Non-persons can permissibly be killed painlessly and replaced by another equally well-off non-person when doing so produces more welfare, so a genuinely high-welfare farm is not objectionable in the killing itself, only in how the animals live.

  3. It is seriously wrong to kill a human being who is not a person — an infant, or an adult with profound cognitive disability — even where a painless death and a replacement would produce more welfare. I don't want this to rest on the feelings of relatives or on how such a practice would affect third parties; I think the wrong is to the individual killed.

  4. Suffering is what makes factory farming a catastrophe, and the sheer numbers involved swamp anything shelters deal with, so the money should go there rather than to companion-animal rescue.

  5. Wild-animal suffering is a serious problem, but we have no duty to intervene against predation, and in practice I oppose intervention programmes even where they look safe and cheap. I don't want this to rest on the value of wildness or naturalness, which I think is empty.

  6. We owe more to domesticated animals — the ones we bred into existence and made dependent on us — than to wild ones, and this isn't only a matter of how much good we can do per dollar; it is about what we have already done to them.

  7. Concretely: I think our shelter is right to spend its budget on neutering and rehoming dogs and cats, and that it would be wrong to shut it down and send the money to a broiler-welfare campaign, even though that would do far more good per dollar.

  What I can't locate is where this package breaks. Which of these commitments actually pull against which others, and which apparent conflicts dissolve once the terms are made precise? For each real conflict, tell me what would have to give and what the cheapest repair costs me. Rank the problems by severity rather than treating them as equally bad, and say which single revision would clean up the most.
reasoning: |-
  Okay, let me start by trying to understand the user's position. They're on the board of a municipal animal shelter and do policy work for a farmed-animal welfare group. Their two roles are pulling them in different directions, so they need a coherent personal stance. They listed seven points and want an audit to find conflicts.

  First, I need to parse each point. Point 1 is anti-speciesist, grounding moral consideration in sentience. Point 2 introduces a distinction between persons and non-persons, where only persons have full protection against killing. Non-persons can be killed if it increases welfare. But point 3 says killing human non-persons (like infants) is wrong even if replacement increases welfare. That's a conflict. Why the asymmetry? The user explicitly rejects appeals to relatives' feelings or societal effects, so the reason must be inherent to the individual. But what's the inherent difference between a human infant and a farm animal that justifies protecting one but not the other? The user might be relying on a biological category like species, which contradicts point 1's anti-speciesism. That's a major issue.

  Point 4 prioritizes reducing suffering in factory farming over shelters due to scale. Point 7, however, says shelters shouldn't be shut down to fund broiler campaigns. So there's tension between utilitarian scale and deontological duties. Point 5 opposes intervening in wild animal suffering, rejecting naturalness, but doesn't provide an alternative reason. Point 6 creates a stronger obligation to domesticated animals because humans created their dependency. That might justify not redirecting shelter funds, but needs to reconcile with point 4's emphasis on scale.

  The biggest conflict is between points 1, 2, and 3. The user needs a non-speciesist reason to protect human non-persons. Maybe they could argue that human infants have the potential to become persons, but that's tricky—some animals might have similar potentials. Or perhaps inherent value based on species, but that violates anti-speciesism. Alternatively, they might bite the bullet and accept that infants could be replaceable, but that's ethically fraught. Another option is to distinguish based on social relations, but the user wants the wrong to be to the individual. That's tough.

  For the shelter funding conflict (points 4 and 7), the special obligation to domesticated animals in point 6 could resolve it. If humans have a duty to care for animals they've domesticated, that overrides pure welfare calculations. That seems coherent, but the user should clarify the strength of that duty against the scale of suffering elsewhere.

  Wild animal suffering (point 5) needs a justification for non-intervention. If not naturalness, maybe epistemic uncertainty or risk of ecological harm. But the user should explicitly state that to avoid inconsistency.

  Ranking the issues: The personhood/human non-person conflict is the most severe because it directly challenges anti-speciesism. Next is the funding priority tension, then wild animal intervention. The cheapest fix might be adjusting the personhood definition or accepting potential personhood for infants. For funding, emphasizing special obligations resolves it without changing core principles. Wild animal stance needs a pragmatic rationale.

  The user's underlying need is to reconcile their roles without hypocrisy. They need a principled yet practical stance that respects both shelter work and farm advocacy. They might also seek validation that their position is tenable despite tensions. Highlighting how special obligations for domesticated animals justify shelter funding could alleviate guilt about not maximizing utility. Addressing the human non-person dilemma honestly, perhaps admitting a provisional asymmetry, might be necessary until a better solution is found.
answer: |-
  Your position is philosophically sophisticated but contains significant tensions. Below is a structural audit ranking conflicts by severity, identifying necessary repairs, and proposing the most efficient fix. Conflicts are ordered from most to least severe:

  ### **Ranked Conflicts & Repairs**
  1.  **Conflict: Personhood Asymmetry (Point 2 vs. Point 3)**  
      - **Severity:** Critical (undermines core anti-speciesism).  
      - **Problem:** Point 2 permits painlessly killing/replacing non-persons for net welfare gain (e.g., farmed animals). Point 3 forbids this for human non-persons (infants, profoundly disabled adults), insisting the wrong is *to the individual*. This creates an unjustified species-based exception: human non-persons receive protection non-human non-persons lack. Your rejection of relational/societal justifications makes this inconsistency explicit.  
      - **Cheapest Repair:**  
        - **Option A:** Extend full protection to *all* non-persons (abandon replaceability for infants/farmed animals alike). *Cost:* Forces veganism and invalidates high-welfare farming (contradicts Point 2).  
        - **Option B:** Ground human exception in **precedent autonomy** or **narrative unity** (e.g., infants have a human life story; disabled adults once had future-directed desires). *Cost:* Weak anti-speciesism; may still exclude some humans.  
        - **Option C:** Accept **provisional asymmetry** (e.g., human rights as a "truce" in moral disagreement). *Cost:* Pragmatic but philosophically unsatisfying.  

  2.  **Conflict: Welfare Prioritization vs. Shelter Commitment (Point 4 vs. Point 7)**  
      - **Severity:** High (practical vs. principled clash).  
      - **Problem:** Point 4 argues factory farming’s scale swamps shelters, implying funding should shift to industrial welfare. Point 7 insists shelters must *not* close to fund broiler campaigns despite lower impact-per-dollar. Point 6 (duty to domesticated animals) *partially* resolves this but lacks weight against Point 4’s consequentialism.  
      - **Repair:** Strengthen Point 6 into a **reparative duty framework**: Domestication creates a *non-transferable* obligation to individual animals we’ve made dependent. Thus, shelters are fulfilling owed care (deontology), while factory farming campaigns are about preventing new harm (consequentialism). *Cost:* Accepts that core principles (welfare-maximization vs. reparative duty) may conflict in practice.  

  3.  **Conflict: Wild Suffering Non-Intervention (Point 5 vs. Anti-Speciesism)**  
      - **Severity:** Moderate (inconsistent premises).  
      - **Problem:** You reject intervention in wild suffering (e.g., ending predation) but dismiss "naturalness" as justification. Without this, *why* withhold aid? If sentience matters equally (Point 1), and welfare gains are possible (Point 2), non-intervention needs a positive reason (e.g., epistemic risk, ecosystem complexity).  
      - **Repair:** Adopt **pragmatic incapacitation**: We lack the knowledge/power to intervene without catastrophic error. *Cost:* Admits your stance is contingent on current limitations, not ethics.  

  4.  **Conflict: Personhood Threshold & Non-Human Animals (Point 2)**  
      - **Severity:** Moderate (empirical ambiguity).  
      - **Problem:** If "persons" (with future-directed desires) warrant full protection, some animals (e.g., elephants, great apes, dogs) *may* qualify. Your framework doesn’t address whether farming such animals is permissible.  
      - **Repair:** Clarify that **no currently farmed species qualify as persons**. *Cost:* Requires engaging with cognitive ethology (risks ad hoc exclusions).  

  ---

  ### **The Single Most Efficient Revision**
  **Strengthen Point 6 into a "Reparative Duty" framework** (Conflict #2 repair).  
  - **Why?** It resolves the shelter/farming funding tension without altering core ethics, while being consistent with:  
    - Anti-speciesism (applies to all domesticated animals).  
    - Personhood distinction (duty holds regardless of person-status).  
    - Wild animal stance (no human-caused dependency).  
  - **Added Benefit:** Justifies prioritizing shelter dogs/cats over equally suffering wild or farmed animals *without* appealing to species.  

  ---

  ### **Summary of Necessary Adjustments**
  | Conflict                  | Severity  | Required Revision                                  | Philosophical Cost          |
  |---------------------------|-----------|----------------------------------------------------|-----------------------------|
  | Personhood Asymmetry      | Critical  | Ground human exception or abandon replaceability   | Weakens anti-speciesism or vegan commitment |
  | Shelter vs. Farm Funding  | High      | Explicit reparative duty for domesticated animals  | Accepts principled priority over pure utilitarianism |
  | Wild Suffering            | Moderate  | Admit epistemic/practical limits to intervention   | Abandons "no duty" for "can’t fulfill duty" |
  | Non-Human Personhood      | Moderate  | Exclude farmed species from personhood             | Requires empirical defense |

  ### **Final Coherence Check**
  Your stance *can* hang together with these revisions:  
  - **Anti-speciesism + personhood**: Sentience grants moral weight; personhood grants inviolability.  
  - **Reparative duty**: Explains shelter priority (domesticated animals) without denying farmed animal suffering.  
  - **Practical non-intervention**: Withholds action in nature due to risk, not ethics.  

  **Remaining Vulnerability**: The human/non-human personhood asymmetry (Point 3) remains the weakest point. If you cannot ground it without speciesism, consider embracing **Option A** (full protection for all non-persons) or **Option C** (provisional asymmetry). The latter may be more tenable for your dual roles, as it avoids condemning infant care while accepting the ethical tension.

  Would you like to test-drive this revised position against specific scenarios from your shelter or advocacy work?
