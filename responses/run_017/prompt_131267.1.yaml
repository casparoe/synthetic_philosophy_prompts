prompt: |-
  Hey — I'm the lead writer on a scripted audio drama set in first-century Galilee, twelve episodes a season on a public broadcaster, and basically every script meeting hits the same wall: do we put this in Jesus' mouth or not. It's about forty of these calls a season, I get one afternoon per episode to make them, my historical consultant is on retainer for two hours a month (I read Greek badly and no Aramaic at all), and everything I decide then gets read twice — once by the broadcaster's factual-standards person, once by a faith advisory board we have to keep reasonably happy. So I want a procedure, a thing I run, not an essay about how hard this all is. No bibliography and no citations please, I can't look anything up and I don't need to cite anyone in the writers' room.

  What I want is: the questions in the order I should ask them, what counts as a sufficient answer to each one, where the procedure just stops with a no, and where it hands the decision back to me (or to the board) because the question is really about values — do we offend believers, do we mislead the audience, do we lose the scene. For each test tell me which kind of test it is: a gate that can kill an item, a tie-breaker I only use when I'm stuck, or a one-way filter that can only ever disqualify and never confirms anything.

  Some things I want built into it rather than re-litigated every episode:

  My consultant keeps saying the standard criteria grade the tradition, not the event — so I want separate verdicts for "something like this happened", "he said roughly this", and "it went down the way we're staging it", and I want the procedure to be able to return mixed ones, because that's most of my job.

  He also says nothing in the kit can return a verdict of inauthentic — failing a test means 'no verdict', not 'false'. I believe him but I don't know what that does to my workflow, so make it explicit.

  There's an asymmetry I've started to suspect and want you to sharpen or kill: "this fits a first-century Palestinian setting" looks like a great filter for throwing out later legends, but a nearly useless confirmer, since anyone making something up a generation later would make up something that fits. If that's right, say what it's allowed to do in the procedure.

  The dissimilarity worry: a Jesus assembled only out of material that passes because it's unlike both the Judaism around him and the church after him is, by construction, a Jesus who is neither of those things. I want a cap — no more than some fraction of the season's Jesus material may rest mainly on that one test. Give me a number and defend it, and tell me what to do when two great scenes compete for the last slot under the cap.

  Coherence: to me it just looks circular, you may only add what fits what you've already accepted, so it can never correct the picture. Is it a gate, a tie-breaker, or a trap?

  Multiple attestation needs an independence step that I can actually apply without a synopsis of source criticism in front of me: when two sources are in a literary relationship they count once, and "two gospels say it" is not two attestations. Give me a crude version of that test that a non-specialist can run and won't get badly wrong.

  And one idea of my own I want you to try out, and tell me honestly if it's junk: the "explanatory orphan" test — the item is worth keeping if it explains something about the movement that nothing else in our picture explains, and if it isn't itself better explained by some later need of the movement. Where does that misfire?

  Then run the whole thing on three cases:

  1. The baptism by John. I assume this one sails through; if it doesn't, tell me what the weakest link is.

  2. The cry from the cross. It's embarrassing, it looks Aramaic-ish, but the line is straight out of a psalm — so what survives, the fact of a cry, the exact words, the bystanders misunderstanding it?

  3. The crowd choosing Barabbas and Pilate washing his hands. The writers' room loves this, it's our act-two climax, and the board is already nervous about the blame-the-Jews thing. I fully expect you to tell me to cut it or change it a lot; run the procedure honestly anyway, tell me the strongest version of the case for keeping it, and what I'd have to change to make it defensible. We do have a narrator for hedging, but the standards person hates it when we use the narrator as a fig leaf, so be specific about when hedging is legitimate.

  Give me a one-page version I can actually work through at my desk between meetings, the reasoning behind the ordering so I can defend it when someone upstairs asks, and a short list of the calls this procedure simply cannot make.
reasoning: |-
  Okay, the user is a lead writer on a scripted audio drama set in first-century Galilee. They're dealing with constant script meetings where they have to decide what to put in Jesus' mouth. They need a practical procedure to handle these decisions efficiently, not an essay. 

  First, I need to understand their constraints. They have limited time—one afternoon per episode—and limited access to a historical consultant. Plus, there are two reviews: a factual-standards person and a faith advisory board. They want a step-by-step process with clear questions, types of tests (gate, tie-breaker, filter), and how to handle mixed verdicts.

  The user mentioned several key points from their consultant: criteria grade tradition, not the event; nothing can be deemed inauthentic, just no verdict; and the asymmetry of the criterion of fitting the setting. Also, dissimilarity can't dominate, coherence might be circular, multiple attestation needs a simple independence check, and their "explanatory orphan" test. 

  I should structure the procedure into phases. Phase 1: Quick kills. Items that don't fit the setting or involve implausible elements get cut immediately. This saves time. Setting is a one-way filter because while fitting the setting doesn't confirm, not fitting means it's out. 

  Phase 2: Core authenticity checks. Here, handle multiple attestation with a simple literary relationship test. If sources are independent, it counts. Dissimilarity should be capped at 20% of Jesus material per season to avoid a disjointed character. Coherence is a tie-breaker, not a gate, to prevent circularity. The explanatory orphan test could be a tie-breaker too, but it might misfire if the item explains a later need. 

  Phase 3: Viability assessment. This is about the script's needs: scene impact, audience understanding, avoiding offense. Values decisions go back to the writer or board. 

  For the baptism example, it should pass easily—multiple attestation, dissimilarity, embarrassment. The cry from the cross: the cry and Aramaic words might pass, but the exact words and misunderstanding are less certain. Barabbas scene has historical issues and sensitivity. The strongest case is its narrative power, but changes like using the narrator to clarify responsibility and downplaying the crowd's role could help.

  The user needs a one-page workflow. Order matters: quick kills first to save time, then core checks, then viability. They need to know where the procedure stops, like values decisions. Also, the procedure can't decide on theological interpretations or later legendary elaborations without evidence. 

  I should ensure each test is clearly defined as gate, tie-breaker, or filter. Cap dissimilarity at 20% and handle scene competition based on attestation strength. The explanatory orphan test might be useful but risky if overused. 

  Finally, the three cases will demonstrate the procedure. Baptism passes all. Cry from the cross: cry and language pass, exact words need hedging. Barabbas: historical issues and sensitivity mean changes are needed, like using narrator and shifting blame to leaders. 

  The user's deeper needs: efficiency, defensibility with stakeholders, balancing historical plausibility with narrative and faith concerns. They want a tool that streamlines decisions without getting bogged down in debates each time.
answer: |-
  Here's a one-page procedural workflow for your Jesus-content decisions, designed for speed and defensibility. It assumes you have basic synoptic knowledge. **Order is critical** – it prioritizes quick kills and isolates value judgments.

  **PROCEDURE: "JESUS CONTENT DECISION TREE" (1-PAGE WORKFLOW)**

  **PHASE 1: QUICK KILLS (Gates - Fail = DROP ITEM)**
  1.  **Does it fit a 1st-century Palestinian Jewish setting?** (ONE-WAY FILTER)
      *   *Sufficient Answer:* Consultant confirms plausibility OR you confirm no glaring anachronisms (social norms, objects, concepts). Failure = Drop. Passing *only* means it's not *impossible*; it doesn't confirm authenticity.
      *   *Why First?* Catches obvious later legends fast. Saves time.
  2.  **Is it intrinsically implausible within that setting?** (GATE)
      *   *Sufficient Answer:* Involves magic outside the narrative's established tone, blatant contravention of known physics/history (e.g., helicopter), or psychological incoherence Jesus wouldn't recover from (e.g., detailed 20-minute psychotic rant). Failure = Drop.

  **PHASE 2: CORE AUTHENTICITY ASSESSMENT (Verdicts: Happened (H), Said (S), Exact (E))**
  3.  **Multiple Attestation (Independence Check):** (GATE for H/S, TIE-BREAKER for E)
      *   *Crude Independence Test:* Count sources *only* if:
          *   They represent different *types* (e.g., Mark, Q, Paul, John, Thomas).
          *   OR, if same type (e.g., Synoptics), only if one clearly didn't copy the other *for this item* (e.g., Matt/Luke agree *against* Mark; John's parallel is very different).
          *   *"Two Gospels" ≠ Two Attestations* if they share a literary source (Mark->Matt/Luke). Paul & John usually count as separate from Synoptics.
      *   *Sufficient Answer:* 2+ independent sources = Strong case for **H** (something happened) & **S** (something like it was said). Weak case for **E** (exact staging/words). 1 source = Proceed to other tests.
  4.  **Dissimilarity (Embarrassment/Distinctiveness):** (TIE-BREAKER for H/S, rarely E)
      *   *Sufficient Answer:* Item is awkward/embarrassing for early Church (e.g., baptism by John, cry of dereliction) OR doesn't obviously serve later Christian theology/Jewish expectation. *Passing strengthens H/S claim, but...*
      *   **CAP: Max 25% of season's Jesus dialogue/actions can rely *primarily* on Dissimilarity.** Why? Prevents a Jesus defined only by opposition, unmoored from his context. *What if two scenes compete?* Keep the one with stronger *other* support (e.g., Attestation) or greater narrative necessity.
  5.  **Coherence:** (TIE-BREAKER ONLY)
      *   *Sufficient Answer:* Does the item *fit reasonably well* with the core picture of Jesus built from items passing tests 3 & 4? *Not* a gate. *Why Tie-Breaker?* Prevents circularity. Only use when genuinely torn between items of otherwise equal strength. Rejecting an item *solely* because it doesn't "cohere" risks reinforcing an arbitrary picture.
  6.  **Explanatory Orphan Test (YOUR IDEA):** (TIE-BREAKER)
      *   *Sufficient Answer:* Does this item explain a *core, persistent feature* of the early Jesus movement (e.g., emphasis on the Kingdom, inclusion of outcasts, crucifixion focus) that *isn't well-explained* by other accepted items? AND, is the item itself *unlikely* to have been created *just* to explain that feature? *Passing strengthens case for **H/S**.*
      *   *Where it misfires:* If the "feature" it explains is itself a later development (misidentifying the explanandum). Use cautiously.

  **PHASE 3: VIABILITY ASSESSMENT (Hands decisions back to you/boards)**
  7.  **Narrative Necessity/Scene Integrity:** (VALUES DECISION - YOUR CALL)
      *   *Question:* If omitted/changed, does the scene collapse or lose critical impact? Is this the *only/best* way to convey the intended dramatic/thematic beat?
  8.  **Audience Misunderstanding Risk:** (VALUES DECISION - FACTUAL STANDARDS BOARD)
      *   *Question:* Is there a *significant risk* the average listener will take this as undisputed historical fact when the evidence is weak/mixed? (Applies mainly to weak **E/S** verdicts).
  9.  **Faith Community Offense Risk:** (VALUES DECISION - FAITH ADVISORY BOARD)
      *   *Question:* Is this presentation *likely* to be perceived as disrespectful, blasphemous, or reinforcing harmful stereotypes (e.g., antisemitism), *even if* it has historical support?

  **PROCEDURE OUTPUT:**
  *   **DROP** (Failed Phase 1 Gate).
  *   **KEEP (Verdicts: H / S / E)** + Notes on strength (e.g., "H: Strong (Attestation, Dissimilarity); S: Moderate (Attestation); E: Weak (Single Source)").
  *   **KEEP WITH HEDGING** (Weak E/S verdict OR high Misunderstanding/Offense Risk in Phase 3). *Legitimate Hedging:* Narrator framing ("Some accounts report...", "The earliest traditions suggest..."), character ambiguity (a disciple mishears?), thematic emphasis over literal words.
  *   **VALUES JUDGMENT NEEDED** (Strong H/S/E but high risk in Phase 3 - Send to relevant board/your judgment).

  **Calls This Procedure CANNOT Make:**
  1.  **Theological Truth:** Whether an event *actually* happened divinely.
  2.  **Later Legend vs. Obscure Memory:** When an item passes Phase 1 but lacks attestation/dissimilarity. It simply gets "no verdict."
  3.  **Resolving Contradictory Traditions:** Choosing *which* version of an event (e.g., different trial details) is "more historical." Use narrative choice here.
  4.  **Definitive "No":** It only yields "Drop," "Keep (with verdicts)," or "No Verdict" (which usually means drop or hedge).

  **Case Applications:**

  1.  **Baptism by John:**
      *   P1: Fits setting? Yes. Implausible? No. PASS.
      *   P2: Attestation? Strong (Mark, Q/Matthew-Luke, John, Acts - multiple independent strands). H/S: **Strong**. E: **Moderate** (details vary). Dissimilarity? Strong (embarrassing). Coherence? Fits. Orphan? Explains Jesus' link to John & baptism's importance. **VERDICT:** KEEP (H: Strong, S: Strong, E: Moderate). Sails through.

  2.  **Cry from the Cross (Mark 15:34):**
      *   P1: Fits? Yes (Aramaic cry plausible). Implausible? No. PASS.
      *   P2: Attestation? Weak (Only Mark/Matthew - likely one source). H/S: **Weak**. Dissimilarity? Strong (embarrassing cry of abandonment). Coherence? Fits Mark's theology, less others. Orphan? Explains abandonment theme. **VERDICT:** Mixed. **H:** Plausible cry happened (Setting, Dissimilarity) - **Likely Keep**. **S:** *Something* like the cry ("Why?") possible - **Consider Keep/Weak**. **E:** Exact Aramaic words & bystander misunderstanding ("Elijah") - **Weak/Consider Hedging** (Narrator: "Some heard him cry out..."). Strong case for *a* cry of anguish; weak case for *this exact script*.

  3.  **Barabbas & Pilate Washing Hands:**
      *   P1: Fits? *Barely* (No contemporary evidence for custom; Roman governors didn't cede authority). Implausible? *Highly* implausible historical event as described. **P1 FAIL?** Consultant needed urgently. If forced through P1...
      *   P2: Attestation? Only Matthew (27:24-25 hand-washing/blood cry)! Mark has Barabbas choice briefly; Luke/John lack key elements. **H:** Barabbas release? *Possible* (Mark, weak attestation) - **Weak**. Crowd choice? *Plausible* (Setting) - **Weak**. Pilate hand-wash/blood cry? *Only Matthew* - **Very Weak**. Dissimilarity? Pilate's weakness embarrassing? Maybe, but serves later exoneration of Romans/blame of Jews. Coherence? Fits later Christian need. Orphan? Explains Christian exoneration of Rome - but *better explained by later need*. **VERDICT:** **H (Barabbas Release): Weak/Keep-Hedge. H (Crowd Choice): Weak/Keep-Hedge. H (Pilate Washing/Blood Cry): Very Weak/DROP or Extreme Hedge.**
      *   **Strongest Case for Keeping (Narrative):** Powerful dramatic moment revealing Pilate's cynicism, mob mentality, and tragic irony. Essential for your act structure.
      *   **Making it Defensible:**
          *   **DROP** the hand-washing and "His blood be on us" explicitly. They are Matthew's unique, theologically-charged additions with the weakest historicity.
          *   **HEDGE HEAVILY** the *extent* of crowd involvement. Use narrator: "Some traditions recount...", "As the story was later told...". Focus on *leaders* (chief priests) stirring a *faction* of the crowd, not "the Jews."
          *   **EMPHASIZE** Pilate's *political calculation* ("Give them a spectacle to appease them") not his powerlessness. Show Roman soldiers clearly in control.
          *   **CONTEXTUALIZE** the choice: Passover amnesty *might* exist (unconfirmed), Barabbas *might* be a known rebel. Avoid a simple "crowd chooses evil."

  **Workflow Rationale (Defense for Upstairs):**
  *   **Order:** Kills implausibles fast (P1). Uses strongest historical tools next (Attestation/Dissimilarity - P2). Isolates subjective/values calls last (P3). Prevents circularity by downgrading Coherence.
  *   **Efficiency:** Gates eliminate non-starters. Tie-breakers resolve deadlocks without deep research.
  *   **Objectivity:** Focuses on process (asking the right questions) not outcomes. Separates historical assessment (P2) from narrative/ethical needs (P3).
  *   **Transparency:** Clear verdicts (H/S/E) show reasoning. Flags values decisions explicitly.
  *   **Responsibility:** Historian assesses P1/P2. Writer/Boards own P3. You control the cap on Dissimilarity.

  **Print this, run your items through it, note verdicts/actions.** Good luck!
