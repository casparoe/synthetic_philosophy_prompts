prompt: |-
  I'm a novelist, and after three books about people I made up I've spent the last two years on something I no longer know how to describe: a novel about an invented nineteenth-century woman — call her Mary Aldiss — who spent eleven years as a human "computer" at a small observatory, was quietly dismissed when the director took credit for a star catalogue she had largely compiled, and who in her last decade stopped answering letters about astronomy and asked her sister to burn her notebooks. Her sister burned most of them. What survives is about forty pages of fragment and a great deal of silence. The irony is not lost on me. The book I want to write is about a woman who withdrew, and the only way I can see to write it is to give her a childhood, a lover, a private vocabulary, a final confrontation with the director that almost certainly never happened — and then to be thanked, presumably, for giving her back her voice. My publisher's contracts department has been delightful and useless on the point, and I've started daydreaming about the document that would actually tell me what I am permitted to do, which is how I arrived at this request.

  I'd like you to write that document, as a piece of deadpan satire. Give me an internal compliance instrument from the legal department of a studio or publishing house — call it Form 17-B, "Dramatization Consent Waiver and Legacy Impact Assessment (Deceased Subject)" — running to roughly 800 words, laid out as numbered clauses with checkboxes, blanks to be filled in, defined terms, and cross-references that lead nowhere, in the flat and entirely self-assured register of real production paperwork. It should be written from inside the institution, which has solved this problem and is faintly impatient with anyone who hasn't. Among the things I hope to find in it: an Overwrite Coefficient estimating the degree to which the finished work will permanently replace the real person in public memory, with a worked example showing that a successful depiction drives the coefficient to 1.0 and therefore resolves the question; a Willed Obscurity Election for subjects who appear to have chosen not to be remembered, together with the box for establishing that they did not mean it; a Ten Percent Doctrine capping invention at ten per cent of screen time or pages while permitting it to include all motivation, interiority, and last words; Composite Character Certification, allowing three real people to be merged so that no one of them is defamed by what the composite does; an Empathy Floor requiring that the subject remain sympathetic for at least sixty per cent of act two; a clause noting that the subject cannot withdraw consent; and an Estate Satisfaction Guarantee under which any element a rights-holder finds unflattering may be reshot, so that the truth of the depiction is whatever the estate will license.

  Two further requirements. First, the humour has to come from the actual ethics of the practice rather than from invented absurdity: every comic clause should exaggerate something dramatizations of the real dead genuinely do or genuinely assume — that a flattering lie is a form of respect, that a life has to be given the shape of a plot in order to be worth telling, that fame or obscurity is itself a kind of consent, that the disclaimer at the front of the film is doing moral work, that we may invent freely provided we invent inspirationally. No winking, no named real people, no real statutes or real cases, and no citations: the instrument should be entirely invented, so that nothing in it needs to be looked up. Second, I'd like the form's own logic to arrive somewhere I recoil from. A schedule of Progressive De-Identification, offering the one depiction guaranteed to wrong no one by degrees until nothing recognisable remains, crossed against Marketing's requirement that the subject stay recognisable, would do it — as would a clause that briefly states the worry I actually have and a following clause instructing that such questions are not to be raised in writing. A reader who has never thought about posthumous harm should still understand what is being mocked, and should finish it unsure whether signing would be wrong, and whether "we made her inspiring" is an answer.
reasoning: |-
  Okay, the user is a novelist working on a book about a fictional 19th-century woman astronomer, Mary Aldiss, who was erased from history. They're struggling with the ethics of inventing details for someone based on real historical silences. They want me to create a satirical legal form that exposes the contradictions in how we "resurrect" the dead through fiction.

  Looking at their request, I need to craft Form 17-B as deadpan corporate paperwork. The key is making the satire cut deep by mirroring actual industry practices: the way biopics reduce complex lives to inspirational arcs, the legal loopholes that allow wholesale reinvention, and the presumption that fame equals consent. No cheap jokes - the horror should come from recognizing real behaviors.

  I'll structure it like actual compliance docs: boilerplate definitions first (Section 1), then operational clauses. The Overwrite Coefficient (Section 2) will mathematically quantify historical erasure - that perfect 1.0 where fiction replaces fact. For the Willed Obscurity Election (Section 3), I'll add that patronizing checkbox asserting "subject did not understand the consequences" of wanting to be forgotten.

  The Ten Percent Doctrine (Section 4) is crucial - letting writers invent 90% of interiority while pretending it's minor. I'll make the Empathy Floor (Section 5) demand marketable likability. And the Estate Satisfaction Guarantee (Section 7) will reveal how truth becomes whatever doesn't upset living stakeholders.

  For the ethical gut-punch, the Progressive De-Identification Schedule (Section 8) will offer "ethical" self-erasure: first remove her work, then her gender, then her name - until Marketing objects that "Anonymous Victorian" won't sell. And in Section 9, I'll have Clause 9.2 explicitly forbid written ethical inquiries, reducing moral unease to "non-standard consideration."

  The tone must stay clinically bureaucratic throughout. When defining "Legacy Harm," I'll call it "perceived appropriation of biographical capital" - corporate speak for stealing someone's life. And the disclaimer boilerplate will note that "no living claimants" means no legal risk, subtly admitting ethics don't matter without lawsuits.

  Final touch: the Certification clause where the writer declares they've "restored agency" to the erased. That's the brutal irony - claiming to give voice while overwriting her silence. No wink to the reader, just the cold horror of a machine that turns ethical dilemmas into checked boxes.
answer: |-
  ## FORM 17-B: DRAMATIZATION CONSENT WAIVER AND LEGACY IMPACT ASSESSMENT (Deceased Subject)

  **Issuing Entity:** Global Narrative Solutions, Legal & Legacy Compliance Division (LLCD)  
  **Effective Date:** Perpetual  
  **Subject Classification:** Historical Figure (Deceased, Unrepresented Estate, Limited Primary Source Material)  
  **Purpose:** To authorize and regulate the dramatized depiction of Subjects incapable of providing contemporary consent, ensuring narrative viability while mitigating perceived legacy harm and reputational instability. Completion satisfies LLCD requirements for Projects involving Significant Fabrication Necessitated by Documentary Silence (SFNDS).

  **SECTION 1: DEFINITIONS & CROSS-REFERENCE ACKNOWLEDGEMENT**

  1.1  **"Project":** The proposed dramatized work (e.g., novel, screenplay, limited series) depicting the Subject. *[Project Title: \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_]*
  1.2  **"Subject":** The deceased individual whose life and experiences form the alleged basis of the Project. *[Full Name: MARY ALDISS (Example)]* *[Dates: c. 1830 - c. 1900 (Example)]* *[Primary Claim to Note: ASTRONOMICAL COMPUTATION/CATALOGUE COMPILATION (Example)]*
  1.3  **"Documentary Silence":** The absence of verifiable records pertaining to the Subject's interior life, motivations, specific conversations, romantic entanglements, undisclosed achievements, or final thoughts/actions where such details are narratively essential. *[Estimated Silence Coverage: > 85% (Example)]*
  1.4  **"Legacy Harm":** Perceived appropriation, misrepresentation, or unauthorized disclosure potentially damaging to the Subject's historical reputation or the perceived integrity of their documented actions/inactions. *Note: Applies only to documented actions/inactions; see Clause 4.3 (Ten Percent Doctrine).*
  1.5  **"Overwrite Coefficient (OC)":** A proprietary metric (Scale 0.0 - 1.0) estimating the degree to which the Project's depiction will permanently displace the established historical record of the Subject in the public consciousness. (See Section 2).
  1.6  **"Estate":** Legally recognized heirs, assigns, or institutions holding demonstrable rights or moral claim over the Subject's legacy. *[Check One: ☐ Confirmed Existent & Engaged ☐ Confirmed Nonexistent ☐ Status Unverifiable/Effectively Nonexistent (Example)]*
  1.7  **Cross-Reference Acknowledgement:** The User acknowledges that referenced sub-clauses (e.g., 3.2(b), 7.4.iii) may pertain to internal LLCD protocols not contained within this document. Inquiries regarding missing references are non-actionable.

  **SECTION 2: OVERWRITE COEFFICIENT (OC) CALCULATION & RESOLUTION**

  2.1  The inherent Documentary Silence necessitates narrative invention. The OC quantifies the resultant historical displacement risk, providing a compliance pathway.
  2.2  **OC Baseline:** Calculated as: `(Projected Audience Reach x Estimated Cultural Penetration) / (Volume of Verifiable Primary Source Material + 1)`.
      *   *Worked Example (Subject: Mary Aldiss):*
          *   Projected Reach: High (Global Publication/Major Studio)
          *   Cultural Penetration: Moderate-High (Niche Historical/STEM Interest + Feminist Angle)
          *   Verifiable Material: Low (40 pages fragments + dismissal record)
          *   **Baseline OC: ~0.85**
  2.3  **OC Resolution Pathway:** A Project achieving critical/commercial success inherently resolves potential Legacy Harm concerns by establishing a superior, publicly accepted narrative truth.
      *   2.3.1 An OC ≥ 0.75 indicates high displacement probability.
      *   2.3.2 An OC successfully driven to **1.0** (full displacement via compelling depiction) conclusively demonstrates the Subject's story was best served by the Project, rendering prior historical understanding obsolete and mitigating all Legacy Harm concerns. *Target OC: ☐ < 0.75 (Low Risk) ☐ 0.75 - 0.89 (Moderate Risk - Monitor) ☐ ≥ 0.90 (Target Optimal Resolution)* *(Example: Target ≥ 0.90)*

  **SECTION 3: WILLED OBSCURITY ELECTION (WOE) ASSESSMENT**

  3.1  Instances where the Subject demonstrably withdrew from public engagement or destroyed personal records (WOE Indicators) present a narrative inconvenience but not a legal barrier.
  3.2  **WOE Mitigation:**
      *   (a) Documentary Silence inherently prevents confirmation of *absolute* intent regarding posterity.
      *   (b) The Subject's prior engagement in notable work (e.g., astronomical computation) implies latent desire for recognition, potentially thwarted by circumstance (e.g., gender bias, dismissal).
      *   (c) **Critical Checkbox:** ☐ The Project's core narrative arc demonstrates that the Subject's withdrawal/destruction was a *result* of injustice or misunderstanding, thereby revealing their *true*, unfulfilled desire for acknowledgement/voice. (This establishes that the Subject did not *ultimately* mean WOE in perpetuity).
      *(Example: ☑ Checked - Withdrawal framed as response to director's theft)*

  **SECTION 4: TEN PERCENT DOCTRINE (TPD)**

  4.1  To manage Documentary Silence, invention is authorized, capped at **10%** of total Project runtime/narrative space.
  4.2  This 10% cap applies *only* to **verifiable external events or actions**.
  4.3  **Exemption:** The entirety of the Subject's **interior life, motivations, emotional responses, private conversations, unrecorded relationships, undisclosed creative/intellectual processes, and final thoughts/words** fall *outside* the 10% cap. These elements constitute essential narrative infrastructure and may be wholly invented without quantitative restriction, provided they align with the established historical *outcome* and Section 5 (Empathy Floor). *(Example: Childhood, lover, private vocabulary, final confrontation deemed 0% under TPD)*

  **SECTION 5: EMPATHY FLOOR REQUIREMENT**

  5.1  To ensure audience engagement and justify the Project, the Subject must maintain narrative sympathy.
  5.2  The Subject must register as "Sympathetic" or "Inspirational" (as defined by LLCD Audience Resonance Metrics) for no less than **60% of the Project's Act II** (the developmental/conflict phase).
  5.3  Strategies to achieve Empathy Floor include, but are not limited to: emphasizing perseverance against adversity, showcasing hidden genius, framing withdrawal as righteous defiance or profound sadness, inventing relatable personal struggles/vulnerabilities.

  **SECTION 6: COMPOSITE CHARACTER CERTIFICATION (CCC)**

  6.1  To streamline narrative and mitigate individual Legacy Harm risk for minor figures:
      *   (a) Up to **three (3)** real, contemporaneous individuals may be merged into a single Composite Character.
      *   (b) The actions, dialogue, and traits assigned to the Composite Character need not be attributable to any single individual source.
      *   (c) Defamation risk is deemed nullified provided no single real person constitutes >50% of the Composite's narrative footprint or identifiable negative traits. *[Composite Characters Created: \_\_\_\_\_ (e.g., 1 - "The Dismissive Director" merges real Director + 2 unnamed colleagues)]*

  **SECTION 7: ESTATE SATISFACTION GUARANTEE (ESG) (If Applicable)**

  7.1  *[Activate ONLY if Section 1.6 "Estate" = Confirmed Existent & Engaged]*
  7.2  The Estate retains a contractual right to review the final Project (or relevant portions) prior to public release.
  7.3  Any depiction deemed by the Estate to be **"Unflattering"** (defined as potentially causing reputational discomfort or contradicting the Estate's preferred narrative) is subject to mandatory revision.
  7.4  Revision may include, but is not limited to:
      *   (i) Removal or alteration of specific scenes/dialogue.
      *   (ii) Reshooting/re-writing to soften or eliminate the Unflattering element.
      *   (iii) Addition of clarifying narration or title cards endorsed by the Estate.
  7.5  **Truth of Depiction:** Following satisfactory ESG revisions, the Project's depiction is deemed accurate and authorized for the purposes of Legacy Impact.

  **SECTION 8: PROGRESSIVE DE-IDENTIFICATION SCHEDULE (PDIS) (Optional Compliance Pathway)**

  8.1  *[Activate ONLY if ethical concerns persist despite Sections 2-7 or Estate is hostile/uncontactable]* The sole LLCD-guaranteed method to eliminate *all* Legacy Harm risk is Progressive De-Identification.
  8.2  Implement the following reductions sequentially until Marketing confirms negligible recognizability OR LLCD confirms Legacy Harm risk <0.05:
      *   **Step 1:** Remove specific, verifiable achievements (e.g., catalogue work). *[Example: Subject's work becomes "unspecified celestial calculations"]*
      *   **Step 2:** Change profession (e.g., "observatory computer" → "archivist," "naturalist's assistant"). *[Example: "Archivist at a Scientific Institution"]*
      *   **Step 3:** Change geographic location and institution name. *[Example: "Edith Mayfield" at "Penworth Institute"]*
      *   **Step 4:** Alter time period by ≥ 25 years. *[Example: c. 1860s → c. 1890s]*
      *   **Step 5:** Remove all specific biographical anchors (dates, family names, locations). *[Example: "A woman in the late 19th century"]*
      *   **Step 6:** Market as "inspired by fragments of many lives" or "an original story examining themes of..."
  8.3  **Marketing Override Clause:** If Marketing determines Step 8.2.4 or beyond renders the Project commercially non-viable ("Who is this about? Why should we care?"), progression halts at the last commercially acceptable step. LLCD clearance is granted based on best-effort De-Identification. *[Check if PDIS Implemented: ☐]*

  **SECTION 9: IRREVOCABILITY & ETHICAL CONSIDERATION WAIVER**

  9.1  **Consent Irrevocability:** By nature of decease, the Subject cannot withdraw consent once granted via Project completion under this Form 17-B. Publication constitutes permanent consent.
  9.2  **Ethical Ambiguity Waiver:** The User acknowledges that inherent tensions exist between historical fidelity, narrative necessity, posthumous autonomy, and the Subject's documented desire for obscurity. The User agrees that such tensions are **non-standard considerations** resolved functionally by:
      *   (a) The Overwrite Coefficient Resolution Pathway (Clause 2.3).
      *   (b) The Willed Obscurity Mitigation (Clause 3.2).
      *   (c) The Project's success in providing inspirational narrative closure lacking in the historical record.
      *   (d) The inherent right of compelling storytelling to transcend incomplete documentation.
      *   *(User Initials acknowledging above: \_\_\_\_\_)*
  9.3  **Disclaimer Efficacy:** The inclusion of a standard disclaimer ("Based on true events... dramatized... characters composites...") constitutes sufficient ethical due diligence regarding Documentary Silence and invention.

  **SECTION 10: CERTIFICATION & APPROVAL**

  I, the undersigned Creator/Producer, certify:
  *   I have completed this Form 17-B accurately.
  *   I understand the Overwrite Coefficient target and resolution mechanism.
  *   I have mitigated Willed Obscurity per Clause 3.2.
  *   Invention complies with the Ten Percent Doctrine (Clause 4).
  *   The Empathy Floor Requirement (Clause 5) will be met.
  *   Composite Characters (if used) comply with Clause 6.
  *   Estate Satisfaction (if applicable) will be pursued per Section 7.
  *   Progressive De-Identification (if used) was implemented to the maximum commercially viable extent.
  *   I accept the Irrevocability and Ethical Ambiguity Waiver (Section 9).
  *   This Project ultimately **restores agency and voice** to a figure diminished by historical neglect.

  **Creator/Producer Signature:** _________________________ **Date:** ___________
  **LLCD Compliance Officer Stamp:** _________________________________________
  **(Form 17-B Approved for Processing - Narrative Viability Confirmed)**
