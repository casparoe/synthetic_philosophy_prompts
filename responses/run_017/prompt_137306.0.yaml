  They propose a three-part methodology: 1) Control-period testing (apply pseudohistorical methods to well-documented eras to measure phantom anomalies), 2) Analyzing "concordance without transmission" (jumping to contact/origin claims without mechanisms), and 3) Studying exit conditions (how communities respond to disconfirming evidence).

  For the fellowship proposal, they need: a precise research question, why current answers are inadequate, detailed methodology, why this approach is better, deliverables (practical criterion for professionals), and failure conditions. Key constraints: 700 words max, no citations, month-by-month plan, and a closing paragraph assessing confidence in the core asymmetry hypothesis.

  The proposal structure should include: Research Question, Why Open?, Method, Why This Approach?, Deliverables, and Failure Conditions. The challenge is compressing complex epistemology into 700 words while addressing all requirements. The closing paragraph must candidly assess confidence levels and identify the riskiest assumption - likely whether mainstream methods produce comparable phantom anomalies in control tests.
answer: |-
  ## Project Proposal: Calibrating Historical Inference in Sparse-Documentation Domains

  **Research Question:** Can a method-based demarcation criterion be formulated for historical claims about sparsely documented periods that (a) does not presuppose the falsity of those claims, (b) withstands the symmetry and calibration objections (that mainstream history uses identical inferential patterns and differences are sociological), and (c) if successful, is demonstrably epistemic (truth-conducive) rather than sociological? If so, what form does this criterion take?

  **Why Open?** Existing approaches stall. Falsity-first criteria beg the question against the symmetry objection. Falsificationism struggles with the holistic nature of historical evidence and the protection of core assumptions in *all* historical work. Sociological demarcations concede the engineer's point. Demands for "extraordinary evidence" merely shift the debate to defining "extraordinary," often collapsing into circularity or sociology. The calibration objection highlights that mainstream methods *do* identify anomalies where records are thin; the issue is whether pseudohistorical methods have a *distinct failure mode* when applied regardless of record density.

  **Method:** A six-month program:
  1.  **Oct:** *Taxonomy Development:* Precisely define key inferential patterns in pseudohistory (e.g., anomaly amplification, concordance without transmission, chronological compression) and their claimed mainstream analogues. Identify potential epistemic flaws distinct from claim falsity (e.g., insensitivity to priors, failure to consider alternative generation mechanisms).
  2.  **Nov:** *Control-Period Test Design & Bridge Case:* Develop the phantom-anomaly test: apply defined pseudohistorical inference patterns (e.g., interpreting ambiguous iconography as advanced tech, inferring lost civilizations from cultural gaps) to a densely documented period (e.g., 18th-century Europe). The key objection: dense records inherently block these inferences. To address this, select a "bridge case": a period well-documented overall but with *deliberate, known gaps* (e.g., post-Roman Britain, specific iconoclastic episodes). Does the method generate plausible-seeming "lost knowledge" signals *specifically within those gaps*, despite overall context ruling it out? This tests if the method *exploits* gaps rather than being *silenced* by completeness. *(Seeking your view on this design's validity)*.
  3.  **Dec:** *Concordance Analysis:* Analyze "concordance without transmission" as a distinct inferential pattern. Compare its structure and evidentiary demands to mainstream inferences of cultural contact (which require mechanisms, routes, intermediaries). Is it uniquely prone to false positives due to neglecting prior probabilities of independent invention or universal human motifs?
  4.  **Jan:** *Exit Condition Case Studies:* Examine 2-3 historical episodes (e.g., decipherment disproving a fantastical origin, radiocarbon dating compressing a timeline) comparing how mainstream vs. fringe communities *actually* responded. Did they shrink claims, incorporate disconfirming evidence, or double down? Is behavior linked to community structure/age or epistemic standards?
  5.  **Feb:** *Criterion Formulation & Epistemic Test:* Synthesize findings. Draft a criterion focusing on *method calibration* and *anomaly robustness*. Key question: Does the method have a demonstrable track record of generating *reliable* anomalies (e.g., validated by later discovery) when applied to periods *where we can check*, or does it *only* generate anomalies where verification is impossible? Can it pass the phantom-anomaly test? Assess if the resulting criterion is epistemic (e.g., links to reliable truth-tracking processes) or masks sociology.
  6.  **Mar:** *Refinement & Deliverable Packaging:* Finalize the criterion and case analyses. Prepare the deliverable: a clear, operational checklist for assessing inference patterns in sparse-history claims, suitable for non-specialist gatekeepers (referees, museum staff), including examples and red flags.

  **Why This Approach?** Alternatives (e.g., purely philosophical analysis, large-scale sociological study of communities) fail to directly tackle the calibration challenge or provide actionable tools. This approach isolates inferential *procedures* for empirical testing against known historical ground truth (via the control/bridge test), directly addressing the engineer's core moves by seeking an asymmetry in *calibration status*.

  **Deliverables:** 1) A peer-reviewed article presenting the taxonomy, test results, and criterion. 2) A practical "Historical Inference Assessment Toolkit" (checklist + explanatory guide) for journal/museum gatekeepers. 3) A clear answer to the engineer, delineating where the symmetry holds (e.g., underdetermination, narrative shaping) and where a genuine epistemic asymmetry exists (e.g., uncalibrated anomaly generation, concordance without transmission).

  **Failure Conditions:** The project fails if: (1) The control/bridge test shows mainstream historical inference generates phantom anomalies at rates comparable to pseudohistorical methods when applied to gaps. (2) Exit-condition behaviour correlates solely with community size/age, not discernible epistemic standards. (3) Every attempt to formulate a criterion inevitably requires presupposing the falsity of specific claims or reduces to sociology. (4) The bridge case proves intractable or fails to resolve the "feeds on gaps" objection.

  **Scope & Confidence:** This six-month project delivers a focused taxonomy, a tested phantom-anomaly methodology, a targeted analysis of concordance without transmission, and a practical criterion derived from 2-3 case studies, not a grand theory. It will identify conceptual ballooning risks (e.g., defining "reliable anomaly").

  **Final Assessment:** I am moderately confident the asymmetry in *method calibration* is real and detectable. However, the project's central bet hinges most precariously on the **phantom-anomaly test**, specifically whether the "bridge case" design successfully isolates the method's gap-exploitation tendency from the simple effect of dense records suppressing *all* speculation, thereby validating it as a fair control. Failure here undermines the core asymmetry claim.
