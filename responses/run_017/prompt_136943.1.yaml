prompt: |-
  I've been reading a bit of pop behavioral econ and I keep noticing something in my own decisions that the satisficing story doesn't seem to cover, and I want to know whether it has a name.

  Setup: you set a bar, look at options one at a time, take the first one that clears it. Two things go wrong with that in practice.

  First: figuring out whether an option clears the bar is the expensive part, not finding more options. I can reject a terrible flat in thirty seconds and take a perfect one in thirty seconds, but the ones sitting right on the line eat a whole weekend of visits, calls and checking. So satisficing didn't remove the work, it moved it into these borderline checks — and that creates a second decision nobody mentions: how much effort to spend finding out whether this particular option clears the bar. I spend a lot on the borderline ones and almost nothing on the obvious ones, which feels like I'm optimizing something while officially satisficing. Is that second-order decision itself satisficed? If it is, doesn't the same problem just reappear one level up, forever?

  Second: my bar moves while I look. See something great on day one and the bar goes up and I search for weeks; see a run of junk and it slides down and I settle fast. So the outcome isn't just "some acceptable option", it depends a lot on the order options happen to arrive in, and whoever controls that ordering — the listing site's default sort, the recruiter's slate — gets to decide both what I end up with and how long it takes me. That feels near the secretary problem but not the same thing, because my bar is drifting instead of fixed and I've no idea how many options are coming.

  Does either of these have an established name? I don't want a bare label: tell me the nearest concepts, how what I described differs from each, which fits best, and, if nothing fits, coin a term with a definition and sharp edges — cases that clearly count, near misses, and cases that don't count.

  Reply as a single JSON object with a "verdict" field (one sentence: are these really two phenomena, or one thing under two descriptions?) and a "patterns" array with one object per pattern, each with these fields:
  - "pattern": "check_cost" or "moving_bar"
  - "nearest_concept": the closest established concept you know of
  - "fit": "exact", "partial", or "poor"
  - "how_it_differs": one or two sentences
  - "runners_up": array of { "concept": ..., "why_not": ... }
  - "coined_name": your term if fit isn't exact, else null
  - "definition": one sentence, only if you coined a name
  - "edges": { "clear_case": ..., "near_miss": ..., "not_a_case": ... }
  - "confidence": "high", "medium", or "low"
reasoning: |-
  We are given two phenomena described by the user:

  1. **Check Cost**: The cost of evaluating an option is not uniform; borderline options require significant effort to evaluate, while obvious ones are quick. This leads to a second-order decision about how much effort to spend on evaluation, which itself might be costly to optimize.

  2. **Moving Bar**: The aspiration level (the bar) changes during the search based on the options encountered. Seeing a good option early raises the bar, while a run of bad options lowers it. This makes the outcome sensitive to the order of options and the agent controlling that order.

  The task is to analyze each pattern separately and provide the requested information.

  ### Verdict
  First, I need to decide if these are two separate phenomena or one thing under two descriptions. They are distinct because:
  - The first is about the cost of evaluating an option and the decision of how much effort to expend on that evaluation.
  - The second is about the dynamic adjustment of the aspiration level during the search.

  They are related in that both complicate the satisficing model, but they address different aspects (evaluation cost vs. aspiration level dynamics). So the verdict is: these are two distinct phenomena.

  ### Pattern 1: Check Cost

  **Nearest Concept**: The closest established concept I can think of is **"Optimal Stopping"** (specifically in the context of sequential search with inspection costs). However, the standard optimal stopping models often assume a fixed cost per observation and a known distribution, which doesn't capture the variability in evaluation cost per option.

  **Fit**: Partial

  **How it differs**: In the standard optimal stopping problem (like the secretary problem), the cost of inspecting each option is usually assumed to be constant (or zero) and the decision is only whether to stop or continue. Here, the cost of inspection varies per option (especially high for borderline cases) and the decision includes how much effort to invest in the inspection of each option.

  **Runners-up**:
  1. **"Satisficing"**: Satisficing assumes a fixed aspiration level and that the cost of evaluating an option is negligible. Here, the evaluation cost is significant and variable, and there's a second-order decision about effort.
     - *Why not*: Satisficing does not account for variable evaluation costs or the effort allocation decision.
  2. **"Search Theory"**: Search theory in economics does consider costs of search, but typically models the cost per option as fixed or drawn from a known distribution. The idea of variable effort per option based on its perceived quality isn't a standard feature.
     - *Why not*: The focus in search theory is often on how many options to sample, not on how much effort to put into evaluating each.

  **Coined Name**: Since the fit is partial, I will coin a term: **"Variable-Effort Evaluation"** or **"Costly Borderline Assessment"**. I choose **"Variable-Effort Evaluation"** because it captures the core idea that the decision-maker allocates effort variably across options.

  **Definition**: A decision-making process where the effort expended to evaluate an option depends on the option's perceived closeness to the aspiration level, with borderline options requiring disproportionately high effort.

  **Edges**:
  - *Clear case*: Deciding how many days to spend inspecting a house that seems "okay but not great" versus quickly rejecting a rundown house or immediately accepting an ideal one.
  - *Near miss*: A job candidate screening process where every resume gets a fixed 5-minute scan (fixed cost) but then some get a full interview (variable cost) — but note that the initial scan is fixed and then variable, so it's a hybrid. Our coined term applies when the effort is variable from the start and depends on the option.
  - *Not a case*: A standard satisficing search where every option takes exactly 10 minutes to evaluate, regardless of quality.

  **Confidence**: Medium (because while I haven't found an exact term, the concept is common in real-world decision-making and has been discussed in the context of costly information acquisition).

  ### Pattern 2: Moving Bar

  **Nearest Concept**: The closest established concept is **"Adaptive Aspiration Levels"** in the context of behavioral decision theory or learning models.

  **Fit**: Partial

  **How it differs**: Adaptive aspiration levels are discussed in the literature (e.g., in organizational theory or reinforcement learning), but they are often modeled as adjusting over time based on experience (like past outcomes) and not necessarily during a single search episode. In the user's case, the aspiration level changes during the same search sequence based on the options seen so far, which is more immediate and context-dependent.

  **Runners-up**:
  1. **"Reference Point Adaptation"** from prospect theory: In prospect theory, reference points can shift, but typically this is in the context of gains and losses and not during a sequential search for an option.
     - *Why not*: The shifting reference point in prospect theory is more about how outcomes are perceived relative to a reference, and not about setting a bar for acceptance in a search.
  2. **"Satisficing with Learning"**: Some models incorporate learning about the environment to adjust the aspiration level, but they usually do so across multiple search episodes, not within one.
     - *Why not*: The user's bar moves within a single search (e.g., one apartment hunt), so it's intra-search adaptation.

  **Coined Name**: Since the fit is partial, I will coin a term: **"Intra-Search Aspiration Drift"**.

  **Definition**: The phenomenon where the aspiration level (the bar) for satisficing is dynamically adjusted during a single search process, based on the quality of options encountered so far.

  **Edges**:
  - *Clear case*: During a single day of house hunting, seeing a very nice house first and then rejecting houses that would have been acceptable if seen first, or after seeing many bad houses, accepting one that is mediocre.
  - *Near miss*: A hiring process where the bar for candidates is adjusted after each batch of interviews (which might be considered multiple searches) — but note that if the batches are part of one continuous search, it might count. Our term is for a single continuous search.
  - *Not a case*: A fixed aspiration level throughout the search, even if it was set based on past searches.

  **Confidence**: Medium (the concept of adaptive aspirations exists, but the intra-search aspect is less commonly emphasized).

  ### Final Verdict Sentence
  These are two distinct phenomena: one about the variable cost of evaluating options (especially borderline ones) and the other about the dynamic adjustment of the aspiration level during the search.

  Now, I will structure the response as a JSON object.
