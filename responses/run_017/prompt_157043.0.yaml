  We are to build a decision procedure that grades any proposed or existing category along three licenses: induction, explanation, intervention. The procedure must handle three challenging features: (1) thresholds on continuous quantities with measurement error causing drift, (2) the possibility that the cluster is maintained by the classification practices, and (3) the possibility of no natural joints.

  The procedure will be an ordered set of tests for each license. We will design tests that can be run with the available data (from the registry) and that are feasible within the time constraints.

  We consider the three licenses separately, but note that they might be interdependent.

  The tests are designed to be as objective as possible, but when necessary, we hand over to the committee for a value judgment.

  We define:

  - **Induction License**: Allows generalization of findings from one subset (site/time) to another. We require evidence of stability and transportability.

  - **Explanation License**: The category can be used in causal/mechanistic explanations. We require that the category is not merely a summary but captures a coherent underlying structure (e.g., a homeostatic mechanism, or at least a stable cluster that is not an artifact).

  - **Intervention License**: Interventions designed for the category can be expected to work for new members, even off-distribution. This requires that the category is robust and that the causal structure that makes the intervention work is present in the category members.

  We structure the procedure as a series of tests for each license. The tests are ordered so that if a test fails, we may stop early for that license.

  We also note that the procedure must handle missing data and ambiguity, and must be able to conclude that a category is not a kind (and then specify what we can still do with it).

  We design the tests with the following in mind:

  1. For induction: we need evidence that the category is stable across sites and time, and that the properties of interest (the ones we are inducing about) are homogeneous within the category and heterogeneous between categories.

  2. For explanation: we need evidence that the category is not an arbitrary grouping and that it reflects a real underlying structure (e.g., a common cause or a homeostatic mechanism). We must also check for circularity (if the cluster is maintained by our practices).

  3. For intervention: we need evidence that the category is causally relevant to the intervention and that the intervention effect is stable across the category and transportable.

  We break down the tests for each license.

  **General Structure for Each License**:

  We have a set of tests for each license. We run the tests in order. If a test is passed, we proceed to the next. If a test fails, we may deny the license or hand over to the committee for a judgment call (if the failure is due to missing data or ambiguity). If we cannot run a test due to missing data, we either skip it (if it is not critical) or mark the license as requiring manual review.

  We also note that the procedure must output the grain (how coarse) and the horizon (time and measurement stability) for which the license holds.

  We now outline the tests for each license.

  # Induction License Tests

  1. **Stability of Membership**: 
     - *Test*: For a random sample of participants, what proportion remain in the category over multiple assessment windows? We require that the proportion is above a threshold (say 70%) over a reasonable time (e.g., 1 year). If the category is defined by a threshold on a continuous measure, we require that the measure has good test-retest reliability (e.g., ICC > 0.7) and that the cut-point is not in a region of high density (to avoid misclassification due to measurement error).
     - *Data needed*: Longitudinal data on the defining variables for the category. We can compute the proportion of participants who remain in the category over time, and the test-retest reliability if applicable.
     - *Missing/ambiguous*: If we don't have longitudinal data, we cannot run this test. Then we mark as "requires manual review" and note that without stability, induction is risky.
     - *Failure*: If stability is too low (e.g., <70% over 1 year) and the measure has low reliability, then we deny the license. If the measure has high reliability but the cut-point is in a high-density region, we might consider adjusting the cut-point or using a fuzzy boundary. But if we cannot, then we deny.

  2. **Transportability Across Sites**:
     - *Test*: Check if the distribution of the category's defining features is similar across sites. We can use a statistical test for homogeneity (e.g., a chi-squared test for categorical features, or ANOVA for continuous) but also consider the magnitude of differences (e.g., Cohen's d or Cramer's V). We require that the differences are small (e.g., p>0.05 and effect size small) or that they are accounted for by known site-level covariates (which we can adjust for).
