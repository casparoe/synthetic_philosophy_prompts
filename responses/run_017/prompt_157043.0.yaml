answer: |-
  ### Decision Procedure for Category Licenses

  The procedure evaluates three licenses for each category: **Induction** (generalizability across sites/time), **Explanation** (causal/mechanistic role), and **Intervention** (off-distribution targeting). Tests are ordered; failure at any test denies the license unless noted. Missing data triggers handoff to the committee for judgment. If all licenses are denied, the category is a `CONVENIENCE` class (usable for registration, scheduling, or stratification but **not** for subgroup claims, generalization, or targeting). If any license is granted, specify:
  - **Grain**: Site scope (site-specific, multi-site, all sites) and temporal scope (e.g., within 5 years).
  - **Horizon**: Time until expiration (e.g., 5 years) and conditions for invalidation (e.g., measurement changes).

  #### General Tests (Applied to All Licenses)
  1. **Defining Feature Stability**  
     - *Test*: For threshold-based categories, compute intra-class correlation (ICC) for the underlying continuous measure. If ICC < 0.6, deny licenses requiring stability. For clusters, assess within-individual stability over 1 year; if <70% retain membership, deny.  
     - *Missing data*: Skip if longitudinal data unavailable; handoff to committee with warning.  
     - *Failure*: Deny all licenses if instability is severe (ICC < 0.4 or stability <50%). Proceed with caution if marginal (ICC 0.4–0.6 or stability 50–70%).  
     - *Handoff*: If instability is borderline and no ICC data, committee decides if operational needs justify provisional use.

  2. **Non-Circularity**  
     - *Test*: For clusters, compare co-occurrence of features in new/unexposed cases (e.g., at new sites or pre-protocol) vs. exposed cases. If co-occurrence drops >25% in unexposed, deny Explanation and Intervention licenses.  
     - *Missing data*: Skip if no new-site/new-case data; grant licenses provisionally (grain: established sites only) and flag circularity risk.  
     - *Failure*: Deny Explanation and Intervention licenses; Induction may survive if stable.  
     - *Handoff*: If circularity is suspected but unprovable, committee assesses if category is self-fulfilling.

  3. **Natural Boundary Check**  
     - *Test*: Evaluate if the category boundary aligns with a discontinuity in outcomes (e.g., sharp change in treatment response). If no discontinuity, deny Explanation license.  
     - *Missing data*: Skip if no outcome data; proceed but flag as arbitrary.  
     - *Failure*: Deny Explanation license; other licenses may survive.  
     - *Handoff*: Never—lacks natural joints implies convenience class.

  #### Induction License Tests
  1. **Cross-Site Consistency**  
     - *Test*: Compare category prevalence and mean outcomes across sites using ANOVA (continuous) or chi-square (categorical). If p < 0.05 for site effect and Cohen’s d > 0.5, deny.  
     - *Missing data*: Skip if <3 sites have data; grant with grain: site-specific.  
     - *Failure*: Deny license.  
     - *Handoff*: If site differences are confounded (e.g., by demographics), committee adjusts grain.

  2. **Temporal Consistency**  
     - *Test*: Assess outcome stability over 5-year blocks. If outcome variance increases >20% year-to-year, deny.  
     - *Missing data*: Skip if <5 years data; grant with horizon: 2 years (short-term).  
     - *Failure*: Deny license.  
     - *Handoff*: Never—temporal instability invalidates induction.

  3. **Predictive Homogeneity**  
     - *Test*: Calculate ICC for key outcomes (e.g., treatment response) within the category. If ICC < 0.5, deny.  
     - *Missing data*: Skip if no outcome data; grant provisionally with warning.  
     - *Failure*: Deny license.  
     - *Handoff*: If ICC is marginal (0.4–0.5), committee judges clinical relevance.

  *Grant if all tests passed. Grain: sites/time-periods with consistent data. Horizon: 5 years or until measurement change (whichever comes first).*

  #### Explanation License Tests
  1. **Mechanistic Plausibility**  
     - *Test*: Check for shared causes (e.g., latent variables in factor analysis) or literature support. If no evidence and cluster not homeostatic (e.g., features not mutually reinforcing), deny.  
     - *Missing data*: Skip if no mechanistic variables; proceed if cluster is stable.  
     - *Failure*: Deny license.  
     - *Handoff*: Committee decides if clinical intuition overrides.

  2. **Feature Cohesion**  
     - *Test*: For clusters, compute association strength (e.g., Cramér’s V > 0.3). If below, deny.  
     - *Missing data*: Skip if incomplete feature data; handoff to committee.  
     - *Failure*: Deny license.  
     - *Handoff*: Never—low cohesion implies non-kind.

  *Grant if all tests passed. Grain: all sites. Horizon: indefinitely, but invalidated by new mechanistic evidence.*

  #### Intervention License Tests
  1. **Causal Relevance**  
     - *Test*: Check for significant category-by-intervention interaction (p < 0.05) in trials. If absent, deny.  
     - *Missing data*: Skip if no trial data; deny unless Explanation license granted.  
     - *Failure*: Deny license.  
     - *Handoff*: Committee may provisionally grant if biologically plausible.

  2. **Off-Distribution Robustness**  
     - *Test*: Test intervention effect near category boundaries or in underrepresented subgroups. If effect size drops >30%, deny.  
     - *Missing data*: Skip if no boundary data; grant with grain: core members only.  
     - *Failure*: Deny license.  
     - *Handoff*: Never—fragility invalidates targeting.

  *Grant if all tests passed. Grain: sites/time-periods with trial data. Horizon: until next trial or measurement change.*

  #### Output if No Licenses
  - **Permitted**: Registration, scheduling, balancing in trials.  
  - **Not permitted**: Subgroup claims, generalization, intervention targeting.  
  - **Value judgment**: Committee must confirm if the category serves operational needs.

  #### Procedure Limitations
  - **Systematic failure**: Unmeasured confounding (e.g., socioeconomic factors influencing both features and outcomes) may falsely validate licenses.  
  - **Monitoring (next 2 years)**: For granted licenses, track:  
    - **Induction**: Cross-site outcome differences (alert if Cohen’s d > 0.8).  
    - **Explanation**: Emergence of circularity (e.g., co-occurrence drops in new sites).  
    - **Intervention**: Boundary effects (e.g., reduced efficacy near thresholds).

  ---

  ### Application to Categories

  #### **Category A: Fluctuating-Course Presentation**  
  - **Defining Feature Stability**: Threshold-based with high drift (20% membership change between windows). ICC unknown, but test-retest noise implies instability. *Failure* → All licenses at risk.  
  - **Natural Boundary Check**: No outcome discontinuity data; only predicts retention (operational artifact). *Failure* → Deny Explanation.  

  **Induction License**:  
  - Cross-Site Consistency: Unknown (no data). *Skip*.  
  - Temporal Consistency: Drift implies instability. *Failure* → Deny.  
  - Predictive Homogeneity: Only predicts retention; no outcome data. *Skip* → Insufficient.  
  *Result: Denied. Grain/horizon: N/A.*  

  **Explanation License**:  
  - Mechanistic Plausibility: No evidence. *Failure* → Deny.  
  - Feature Cohesion: Not a cluster; single continuous measure. *Not applicable*.  
  *Result: Denied. Grain/horizon: N/A.*  

  **Intervention License**:  
  - Causal Relevance: No trial data. *Skip* → Deny (no support).  
  - Off-Distribution Robustness: High drift implies fragility. *Failure* → Deny.  
  *Result: Denied. Grain/horizon: N/A.*  

  **Overall**: No licenses. `CONVENIENCE` class.  
  - Permitted: Retention tracking, scheduling.  
  - Not permitted: Subgroup analysis or trial eligibility.  
  - Committee action: Re-evaluate cut-point or retire if not operationally useful.

  ---

  #### **Category B: Autonomic Cluster Presentation**  
  - **Defining Feature Stability**: Cluster with stable population-level co-occurrence. Individual stability unknown. *Skip* → No longitudinal data.  
  - **Non-Circularity**: Co-occurrence may be practice-driven. No new-site/new-case data. *Skip* → Provisional use, flag risk.  
  - **Natural Boundary Check**: No discontinuity data; "3-of-5" undefined. *Failure* → Deny Explanation.  

  **Induction License**:  
  - Cross-Site Consistency: Co-occurrence stable across all sites/years. *Pass*.  
  - Temporal Consistency: Stable over 15 years. *Pass*.  
  - Predictive Homogeneity: No outcome data. *Skip* → Grant with warning.  
  *Result: Granted. Grain: All sites. Horizon: 5 years (reassess if outcome heterogeneity found).*  

  **Explanation License**:  
  - Mechanistic Plausibility: No known mechanism. *Failure* → Deny.  
  - Feature Cohesion: Features co-occur above chance (pass), but circularity risk. *Insufficient*.  
  *Result: Denied. Grain/horizon: N/A.*  

  **Intervention License**:  
  - Causal Relevance: No trial data. *Skip* → Deny.  
  - Off-Distribution Robustness: Unclear boundaries ("3-of-5"). *Failure* → Deny.  
  *Result: Denied. Grain/horizon: N/A.*  

  **Overall**: Induction license only. `INDUCTION`.  
  - Permitted: Generalize findings across sites.  
  - Not permitted: Causal explanations or interventions.  
  - Committee action: Collect new-site data to rule out circularity; monitor outcomes.

  ---

  #### **Category C: Post-Infectious Late-Onset Presentation**  
  - **Defining Feature Stability**: Fixed historical criteria (infection/age). *Pass*.  
  - **Natural Boundary Check**: Heterogeneous current features; thresholds arbitrary. *Failure* → Deny Explanation.  

  **Induction License**:  
  - Cross-Site Consistency: Differential response consistent across sites. *Pass*.  
  - Temporal Consistency: No data, but fixed criteria imply stability. *Pass*.  
  - Predictive Homogeneity: Strong, consistent predictor in trial. *Pass*.  
  *Result: Granted. Grain: All sites. Horizon: Until infection documentation changes.*  

  **Explanation License**:  
  - Mechanistic Plausibility: No known mechanism; heterogeneous. *Failure* → Deny.  
  - Feature Cohesion: Not a cluster; causal history only. *Not applicable*.  
  *Result: Denied. Grain/horizon: N/A.*  

  **Intervention License**:  
  - Causal Relevance: Strongest predictor of differential response. *Pass*.  
  - Off-Distribution Robustness: Heterogeneity implies fragility; no data. *Skip* → Grant with grain: core members (full criteria).  
  *Result: Granted. Grain: Sites with trial data. Horizon: Next trial.*  

  **Overall**: Induction and Intervention licenses. `INDUCTION-INTERVENTION`.  
  - Permitted: Generalize and target interventions.  
  - Not permitted: Causal explanations (mechanism unknown).  
  - Committee action: Reject retirement; validate mechanistic hypotheses.

  ---

  ### Procedure Limitations
  - **Uncatchable error**: Confounding by unmeasured variables (e.g., if socioeconomic status influences both infection history and treatment response in Category C).  
  - **Monitoring**:  
    - **A**: Track drift and retention; retire if uninformative.  
    - **B**: Collect new-site data (circularity) and outcome homogeneity.  
    - **C**: Monitor intervention efficacy in heterogeneous subgroups.

  \answer{A=CONVENIENCE; B=INDUCTION; C=INDUCTION-INTERVENTION}
