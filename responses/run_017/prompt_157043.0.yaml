  3. **Predictive Homogeneity**:
     - *Test*: For outcomes that we typically induce about (e.g., treatment response, prognosis), check if the category shows homogeneity. We can do this by comparing the within-category variance of the outcome to the between-category variance (e.g., using an intraclass correlation coefficient, ICC). We require that the ICC for the category is above a threshold (say 0.5) for key outcomes. Alternatively, we can check if the category is a significant predictor in a model that adjusts for other factors.
