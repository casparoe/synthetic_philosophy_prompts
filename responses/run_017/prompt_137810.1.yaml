  First, I need to recall Strawson's framework. He contrasts reactive attitudes (like resentment) with the objective stance (treating someone as something to be managed). The user feels their situation doesn't fit because the individuals aren't incapacitated, and the shift comes from a pattern, not a single episode. 

  Looking at the user's considerations: they've thought about whether it's the objective attitude, disguised blame, mere statistical adjustment, or a structural parallel to collective harm. Each has issues. The objective stance in Strawson is for cases like mental illness, not patterns of excused actions. Disguised blame doesn't fit because the user genuinely excuses each instance. Statistical adjustment ignores the relational aspect—why would the person resent it otherwise? The collective harm parallel focuses on distributed harm, not a stance toward an individual.

  I remember something about "moral disappointment" or "relational friction." Maybe it's about the cumulative effect of non-culpable actions eroding trust. The user mentions trust without blame. Trust can be affected without attributing fault. For example, even if each cancellation is excused, the pattern makes reliance impractical. That's different from blame because it's about predictability, not moral failure.

  Then there's the concept of "moral residue"—feelings that linger even when actions are excused. But that might not capture the shift in orientation. Another idea: "attenuated agency" or "circumstantial unreliability." The person's agency is intact, but circumstances repeatedly intervene, leading to a passive adjustment. 

  The user's boundary cases are crucial. If the pattern is due to a policy the friend could change, it becomes blameworthy. So the phenomenon requires that no single action is culpable, and the pattern isn't attributable to the individual. The threshold question (two vs. five cancellations) is tricky—probably context-dependent. And whether to disclose the shift involves relational duties beyond fairness.

  The user might be wrestling with the conflict between theoretical excuses and practical relational maintenance. Even if each act is excused, the cumulative effect forces a pragmatic adjustment. That adjustment feels morally significant because it changes how they engage with the person, potentially harming the relationship without blame. 

  I should check literature like Walker on moral repair or Jones on trust. Walker discusses the aftermath of harm without blame, and Jones differentiates trust from reliance. The user's cases align more with eroded reliance affecting the interpersonal stance. 

  Confidence-wise, the no-blame erosion concept seems solid, but labeling it as "circumstantial unreliability" might be tentative. The connection to trust theory is stronger, so emphasizing trust-without-moral-condemnation could be key. The user's deeper need might be validating their experience as a recognized phenomenon, not a personal flaw, and understanding how to navigate it ethically.
answer: |-
  What you're describing is a profound and under-theorized phenomenon in moral psychology. It doesn't neatly map to Strawson's objective attitude, disguised blame, statistical prediction, or distributed harm—though it intersects with all. I propose it's **Circumstantial Unreliability Erosion (CUE)**, a non-blameworthy withdrawal of *relational trust* due to accumulated, excused disruptions. Here's the carving:

  ### Core Definition
  **CUE** is:  
  *A warranted shift in one's practical orientation toward an agent, triggered by a pattern of non-culpable actions (or omissions) that cumulatively undermine reliable participation in a shared practice, resulting in a diminished expectation of their functional availability—without imputing fault.*

  ### Key Features & Distinctions
  1.  **Not Strawson's Objective Attitude:**  
      Strawson's objective stance suspends *reactive attitudes* (resentment, gratitude) because the agent lacks moral competence (e.g., insanity). CUE requires full competence. You don't see your friend/student as incapable of answerability; you see them as *consistently prevented by circumstance* from participating reliably. The shift is pragmatic, not metaphysical.

  2.  **Not Disguised Blame:**  
      Blame asserts a *normative failure* ("You ought to have done otherwise"). In CUE, each excuse is accepted as valid—no obligation was violated. The inference isn't about *character* (e.g., "you're unreliable") but about *practical predictability* ("your circumstances make you unavailable"). Your "lowered expectation" isn't a moral judgment but a hedged bet against recurrent disruption. If it were blame, you'd feel entitled to protest the cancellations—but you don't.

  3.  **Not Mere Statistical Prediction:**  
      Predicting train delays is purely epistemic. CUE has a *relational* dimension: it alters how you engage with the *person* as a participant in shared activities (friendship, pedagogy). This explains the unease: withdrawing relational investment based on patterns—even excused ones—feels like a *quasi-moral* slight because it implicitly demotes them from "co-agent" to "source of friction." The student could resent it because your stance undermines her standing as an equal contributor.

  4.  **Not Distributed Harm:**  
      In "turning the dial" cases (e.g., Parfit's "Harmless Torturers"), each act is imperceptibly harmful, but the collective outcome is wrongful. In CUE, no individual act is harmful or wrongful; the "harm" (eroded trust) emerges only from the aggregate pattern. The issue isn't *harm* but *relational attenuation*.

  ### Boundary Cases Resolved
  **(a) Attributable Patterns:**  
  If your friend's cancellations stem from a culpable policy ("overcommitting"), CUE collapses into blame. **Sharp Requirement:** CUE *requires* the pattern itself to be non-culpable—each event must be genuinely outside the agent's control, *and* the agent must lack reasonable means to mitigate the pattern (e.g., your friend couldn't feasibly "reserve backup childcare"). If mitigation is possible, blame enters.

  **(b) Thresholds:**  
  Two cancellations likely don't warrant CUE; five might. **Threshold depends on:**  
  - *Contextual importance* (missing a funeral vs. coffee)  
  - *Pattern salience* (clustered vs. spread over years)  
  - *Relationship type* (tutor has higher reliance-expectations than a casual friend)  
  - *Mitigation efforts* (did the student proactively seek deadline extensions?)  
  There's no fixed number—it's a sliding scale of *reasonable relational recalibration*.

  **(c) Ought I Act/Disclose?**  
  CUE can be *warranted* yet *relationally corrosive* if disclosed. Unlike blame, you have no standing to demand change (since no fault exists). Disclosing ("I trust you less due to your misfortunes") compounds their helplessness. **Duty of Compassion:** You owe it to them to:  
  - Absorb the practical cost silently where possible (e.g., keep inviting the friend but have backups)  
  - Avoid expressive acts that diminish their status (e.g., your "background noise" treatment of the student is ethically suspect—find subtler ways to manage workflow).  
  Silence here isn't dishonesty but relational preservation.

  ### Is This a Defect in You?
  Not inherently. **Two caveats:**  
  1.  If you *overapply* CUE (e.g., after two minor cancellations), it reflects *rigidity* or excessive risk-aversion.  
  2.  Relationships require *forbearance*—absorbing some friction without recalibration. But forbearance has limits; CUE becomes defective only when triggered *prematurely* or *disproportionately*. Your cases seem within reasonable bounds.

  ### Confidence & Literature Gaps
  - **High Confidence:** This isn't blame, objective attitude, or prediction. Strawson doesn't address patterns of non-culpable disruption. Recent work on *trust* (e.g., Katherine Hawley, Victoria McGeer) comes closest but focuses on culpable betrayals.  
  - **Moderate Confidence:** "Circumstantial Unreliability Erosion" captures the core. Alternative terms: "Aggregate Excused Disruption (AED)" or "Non-Culpable Relational Withdrawal."  
  - **Lowest Confidence:** Thresholds. The literature on *moral residue* (e.g., Margaret Urban Walker) touches on lingering unease after excused actions but not systemic recalibration. This boundary needs empirical work.

  ### In Practice
  You're navigating a real moral tension: *fairness to others* (your time, your students' need for engaged teaching) vs. *fairness to the excused agent*. CUE acknowledges that repeated, unmanageable disruption—even blameless—alters relational physics. The ethical task is to minimize collateral damage while adjusting. Your awareness of this tension is itself a mark of moral diligence.
