  I also need to include a short paragraph identifying which sentence might be heard differently by each group. The sentence about "it cost her dearly" could resonate with Catholics as acknowledgment of suffering, while Objectivists might focus on "it was never about giving up" affirming her values. I'll keep it to show the real cost without compromising her philosophy.

