answer: |-
  ## Eulogy for a Woman of Uncompromising Values

  Good morning. We gather today with heavy hearts, yet also with profound gratitude for the remarkable life of [Aunt's Name]. She was a force: generous to her core, fiercely demanding of herself and, sometimes, of others, and possessed of a warmth that could both comfort and challenge you in equal measure. To know her was to know exactly where you stood, and more importantly, where *she* stood – on ground she had chosen deliberately, with unwavering conviction.

  [Aunt's Name] lived by a clear and powerful code. For her, life wasn't about tallying losses or gains in some grand ledger of obligation. It was about actively *choosing* what mattered most, pursuing it relentlessly, and standing proudly by those choices. Her values weren't abstract ideas; they were the bedrock of her actions, the fuel for her formidable energy.

  Nowhere was this clearer, perhaps, than in the eleven years she spent caring for her brother, [Brother's Name], after his stroke. Anyone who witnessed it saw the sheer physical and emotional weight of those years. They saw the long hours, the constant demands, the inevitable exhaustion. It *cost* her. Deeply. There’s no denying the profound effort, the sheer commitment that flowed from her.

  But here’s the crucial thing: if you ever tried to frame that commitment as something she *gave up* or surrendered against her deeper wishes, you’d meet a wall of that characteristic, steely resistance. She would look you right in the eye, perhaps with that familiar arch of her brow, and say – often directly to [Brother's Name] – that she was there because she *wanted* to be there. Because *he* mattered. Because her connection to him, her love for him, was a value she held higher than any alternative path. It wasn't a subtraction from her life; it was a demanding, chosen expression of what made her life meaningful.

  This wasn't indifference to the cost. It was a radical embrace of *why* the cost was worth paying. She didn't endure those years *despite* valuing herself; she sustained herself *through* valuing him. That distinction was everything to her. To call it "sacrifice," in her view, would diminish the profound *affirmation* inherent in her choice. It would imply she saw her own core values as secondary, which she absolutely did not.

  Her generosity flowed from the same source. When she gave – whether it was her time, her razor-sharp intellect, her practical help, or simply her unwavering presence – it wasn't because she felt she *should*, or because she was putting someone else 'first' in a way that erased her own worth. It was because she saw value in *you*, value in the connection, value in the act of giving itself. It was an active investment in the things and people she cherished. Her demanding nature ensured that investment was real, never shallow. She asked much because she believed much was possible, and she gave deeply because she saw worth in the giving.

  So, how do we honor a woman who gave so much, yet fundamentally rejected the language of self-sacrifice? We honor her by acknowledging the full weight of her choices. We honor her immense capacity for love and commitment, fueled by her deep personal convictions. We honor the sheer *effort* she poured into the relationships and ideals she held dear, not as a burden borne, but as a testament to how fiercely she valued them. We honor her clarity, her strength, and the sometimes-challenging warmth that made her so uniquely [Aunt's Name].

  She lived with remarkable integrity, aligning her actions precisely with her deepest values. She loved fiercely and practically. She demanded excellence, especially from herself. She showed up, fully and completely, for the things and people that mattered to *her*. That was her code. That was her life. And in living it so completely, she gave us all an unforgettable example of what it means to be true to oneself while loving others without reservation.

  We will miss her strength, her clarity, and her formidable presence. But the echo of her conviction, the warmth of her love, and the power of her example remain. Rest well, [Aunt's Name]. Your values shaped a life truly lived.

  ---

  **The Sentence & Why It Stays:**
  The sentence I anticipate being heard differently is: **"It *cost* her. Deeply. There’s no denying the profound effort, the sheer commitment that flowed from her."** Her Catholic family will likely hear this as a clear, respectful acknowledgment of the immense personal suffering and loss she endured, validating their perception of her care as a sacrificial offering. Her Objectivist friends will likely focus on the subsequent framing – that this cost was inextricably linked to her *commitment* and the *value* she placed on her brother, not a surrender of her self-worth, thus upholding her core principle. I left it in because it is the essential bridge of honesty: it validates the observable reality of the hardship *without* using the forbidden language of sacrifice or duty, allowing both groups to find their truth within the larger, value-affirming narrative. Omitting it would feel like denying the visible reality of her struggle to both sides.
