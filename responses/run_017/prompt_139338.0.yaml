  We are designing a lemma triage module that must assign degrees of belief to unproved mathematical statements. The module must decide for each candidate lemma whether to:
    - Keep searching for a proof
    - Switch to hunting for a counterexample
    - Stop and let the lemma be used provisionally

   The module must also provide enough justification for a human to contest the verdict.

   We are to provide desiderata for the formal account of degrees of belief. We must consider:
    - Cases that must be handled correctly (e.g., syntactic variance, budget limits, inconsistency, independence, self-reference)
    - Distinctions that must be respected
    - Established limits (e.g., Gödel's incompleteness, Löb's theorem, computational bounds)

   We are also to:
    - Identify which subsets of desiderata are jointly unsatisfiable.
    - Determine which single requirement excludes the most candidate accounts and whether that is a mark in its favor or over-specification.

   Then, briefly evaluate three candidate approaches:
    1. A prior over completions of the background theory, conditioned on proofs.
    2. A market-style criterion (e.g., logical induction) requiring that no bounded trader can exploit the credences.
    3. A heuristic based on search progress (e.g., shortest proof found so far, share of budget spent).

   Let us outline the desiderata.

   Desiderata:

   1. Syntax Invariance:
      - The degree of belief in a statement must be the same as in any trivially equivalent formulation (e.g., by renaming variables, applying simple logical equivalences).
      - Why: Without this, the system could be misled by syntactic variations, which is clearly undesirable for a system that should capture mathematical content.

   2. Budget Awareness:
      - The account must be computable within the fixed compute budget per lemma. This means that the method for assigning degrees of belief must be feasible within the budget.
      - Why: The module must make a decision per lemma within a fixed budget. It cannot require unbounded computation.

   3. Convergence to Truth (for decidable statements):
      - For any statement that is decidable (i.e., either provable or disprovable) from the background axioms, given enough time and resources (i.e., if the module were allowed to run indefinitely and the statement is decidable), the degree of belief must converge to 1 if the statement is true and 0 if false.
      - Why: We want the system to eventually get the right answer for any statement that can be settled by the background theory. However, note that we are bounded per lemma, so we cannot wait indefinitely for one lemma.

   4. Inconsistency Response:
      - If the background axioms are found to be inconsistent, the module must assign a degree of belief that reflects the breakdown (e.g., assign 0.5 to every statement or halt the process). However, note that inconsistency makes every statement provable, so we need a way to flag the inconsistency and perhaps stop.
      - Why: Inconsistency is a catastrophic event that must be handled appropriately.

   5. Independence Handling:
      - If a lemma is independent of the background axioms (i.e., neither provable nor disprovable), then the degree of belief should reflect that. For example, it might be set to 0.5 or some other value that indicates undecidability. However, note that we might not know that it is independent until we have a proof of independence? But the module must operate under a fixed budget per lemma. So we might not know independence within the budget.
      - Why: We don't want to waste resources on statements that are independent. But note that we might not know they are independent until we have a proof of independence. So the module might have to assign a degree of belief without knowing independence.

   6. Self-Trust:
      - The module must be able to use its own past and future credences as evidence? But note the problem mentions "the run in which the module's own earlier verdict is the only evidence it has". This suggests that the module must be able to reason about its own degrees of belief. However, we must avoid paradoxes (like Löb's theorem).
      - Why: The module might have to rely on its own past judgments when other evidence is scarce.

   7. Non-Dogmatism (or Open-Mindedness):
      - The module should not assign 0 or 1 to any unproved statement (unless it has been proved or disproved within the budget). This is because we want to allow for the possibility of future revision.
      - Why: If we assign 1 to a statement that is later disproved, we are in trouble. Similarly, assigning 0 to a true statement would prevent us from ever proving it.

   8. Justifiability to Humans:
      - The module must provide a human-readable justification for its degree of belief. This justification must be sufficient for a human mathematician to understand and contest the verdict.
      - Why: The requirement is explicit in the problem.

   9. Order Invariance (or at least Consistency):
      - The degree of belief assigned to a statement should not depend on the order in which lemmas are presented, or if it does, the dependency should be justifiable and not arbitrary. However, note that the budget is per lemma, so the order of processing might affect the resources available for each. But we require that the same lemma in the same state of evidence should get the same degree of belief regardless of order? Not entirely because the state of evidence might be different if other lemmas were processed first. So we cannot require absolute order invariance. Instead, we require that the method is consistent with the evidence it has accumulated so far.

   10. Resource-Adaptive:
       - The module should adjust its degree of belief as the compute budget is spent. For example, if a proof is not found within 10% of the budget, the degree of belief might decrease, and if a counterexample is not found, it might increase? But we must be careful.

   11. Consistency with Established Theorems:
       - The degrees of belief must be consistent with the background theory and any theorems that have been proved. For example, if A implies B and we have a high degree of belief in A, then we should have at least as high a degree of belief in B. But note that we might not have the resources to check every implication. So we require that the degrees of belief are coherent in the limit, but within the budget, we might have to approximate.

   12. Recognizes Proof Progress:
       - The account should be sensitive to the progress of the search. For example, if a very short proof is found, then the degree of belief should be high. If we have spent 90% of the budget without finding a proof or counterexample, then the degree of belief might be lower than if we had spent 10%.

