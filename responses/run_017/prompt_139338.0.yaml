   Therefore, we must restate Desideratum 3:

   3. Convergence to Truth (within the budget): For any statement that has a proof (or disproof) that can be found within the fixed compute budget, the module must assign degree of belief 1 (or 0) once that proof (or disproof) is found. For statements that do not have a proof within the budget, the module must assign a degree of belief that reflects the available evidence (e.g., the absence of a proof so far).

