answer: |-
  ### Desiderata for a Formal Account of Degrees of Belief in Unproved Mathematical Statements

  1. **Syntax Invariance**  
     - *Requirement*: Credence in a lemma must be identical for trivially equivalent formulations (e.g., associativity reordering, variable renaming).  
     - *Why*: Mathematical truth is semantic, not syntactic. Syntax sensitivity would undermine trust and invite gaming.

  2. **Budget-Compliance**  
     - *Requirement*: Assign credence within fixed compute/time per lemma.  
     - *Why*: Pragmatic necessity; the module must triage lemmas in bounded time. Excludes unbounded methods.

  3. **Asymptotic Soundness**  
     - *Requirement*: If a lemma is provable/disprovable, credence must converge to 1/0 given *unbounded* resources.  
     - *Why*: Correctness in the ideal case. Without this, the system could diverge from truth arbitrarily.

  4. **Inconsistency Robustness**  
     - *Requirement*: On detecting inconsistent axioms, credences must uniformly decay (e.g., to 0.5) or flag global failure.  
     - *Why*: Inconsistency trivializes logic; ignoring this risks catastrophic errors.

  5. **Independence Sensitivity**  
     - *Requirement*: For lemmas independent of background axioms, credence must reflect undecidability (e.g., ≈0.5).  
     - *Why*: Independence proofs imply no amount of search will resolve the lemma; misclassification wastes resources.

  6. **Self-Referential Coherence**  
     - *Requirement*: Credences must remain consistent when the module’s past verdicts are its only evidence.  
     - *Why*: Avoid circular traps (e.g., "I disbelieve this because I disbelieved it before"). Reflects epistemic hygiene.

  7. **Progress Monotonicity**  
     - *Requirement*: Credence must correlate with search progress (e.g., decline as proof/counterexample search fails).  
     - *Why*: Enables adaptive triage (switch tactics when confidence plateaus).

  8. **Human-Justifiability**  
     - *Requirement*: Provide explicit, contestable evidence (e.g., "proof fragment found," "90% budget spent").  
     - *Why*: Accountability to users; black-box verdicts are untrustworthy.

  9. **Logical Coherence**  
     - *Requirement*: Credences must respect proven implications (e.g., if \(A \to B\) and \(P(A) = 1\), then \(P(B) = 1\)).  
     - *Why*: Avoid Dutch-book vulnerabilities and maintain internal consistency.

  ---

  ### Joint Unsatisfiability

  - **Budget-Compliance + Asymptotic Soundness + Order Invariance** is unsatisfiable.  
    - *Argument*: Asymptotic Soundness requires eventual certainty for all decidable lemmas. Budget-Compliance restricts per-lemma resources. Order Invariance demands that credence for lemma \(L\) is order-independent. But if lemmas are presented in an order that delays \(L\) until after a sequence of hard lemmas exhausting the budget, \(L\) cannot receive unbounded resources. Thus, certainty for arbitrarily hard \(L\) is impossible without order-dependent resource allocation.  
    - *Resolution*: Drop Order Invariance. Triage must be order-dependent (e.g., prioritize lemmas with early progress).

  - **Self-Referential Coherence + Unrestricted Logical Closure** risks Löbian traps.  
    - *Argument*: If the module fully trusts its future credences, it might assign high credence to \(L =\) "this module will never believe \(L\)." Löb’s theorem implies such self-referential statements can cause oscillation or paralysis.  
    - *Resolution*: Restrict self-reference to past verdicts only (not future ones), and avoid closure over self-fulfilling prophecies.

  ---

  ### Most Exclusionary Requirement  
  **Budget-Compliance** excludes the most candidate accounts.  
  - *Why*: It necessitates polynomial-time computation per lemma. This excludes:  
    - Completion priors (uncomputable in general).  
    - Exact logical induction (asymptotic convergence, not bounded-time).  
    - Bayesian updates over all proofs (combinatorial explosion).  
  - *Verdict*: A mark in its favor. Without bounded computation, the system is impractical. Over-specification would demand *optimal* decisions under budget, but Budget-Compliance only requires *feasibility*.

  ---

  ### Evaluation of Candidate Accounts  

  1. **Prior over Theory Completions**  
     - *Syntax Invariance*: ✓ (semantic completions ignore syntax).  
     - *Budget-Compliance*: ✗ (integrating over all completions is uncomputable).  
     - *Asymptotic Soundness*: ✓ (in the limit, consistent completions dominate).  
     - *Inconsistency Robustness*: ✗ (priors collapse if inconsistency is proven).  
     - *Self-Referential Coherence*: ? (depends on encoding self-verdicts; risks paradoxes).  
     - *Verdict*: Theoretically elegant but computationally infeasible. Fails key practicality needs.

  2. **Logical Induction (Market-Style)**  
     - *Logical Coherence*: ✓ (avoids Dutch books by design).  
     - *Asymptotic Soundness*: ✓ (converges to truth).  
     - *Inconsistency Robustness*: ✓ (prices decay if inconsistency proven).  
     - *Budget-Compliance*: △ (computable but not *fixed*-time; requires iterative approximation).  
     - *Human-Justifiability*: ✗ (pricing mechanisms are opaque; traders’ actions hard to explain).  
     - *Verdict*: Strong in the limit but struggles with per-lemma budget and transparency.

  3. **Search-Progress Heuristic**  
     - *Budget-Compliance*: ✓ (e.g., track proof length or budget spent).  
     - *Progress Monotonicity*: ✓ (directly uses search state).  
     - *Human-Justifiability*: ✓ (e.g., "shortest proof so far: 42 steps").  
     - *Syntax Invariance*: ✗ (proof length depends on formulation).  
     - *Independence Sensitivity*: ✗ (if no proof/counterexample found, may misclassify independence as hard conjecture).  
     - *Verdict*: Practical and transparent but semantically shallow; requires normalization for syntax.  

  ---

  ### Conclusion  
  No account satisfies all desiderata. **Logical induction** best handles long-run soundness and coherence but stumbles on budget constraints and explainability. **Search heuristics** excel at budget-aware triage but lack semantic robustness. **Completion priors** are idealistic but infeasible. A hybrid approach—e.g., heuristic credences refined by lightweight market mechanisms—may balance trade-offs, with syntax normalization and incremental proofs addressing key gaps. The critical tension is between **Budget-Compliance** and **Asymptotic Soundness**, necessitating order-dependent resource allocation.
