answer: |-
  ## Recommendation Memo: Budget Allocation Decision  
  **Programme Committee Vote: 20 October 2023**  

  **Recommendation:** Fund the Halvorsen group’s five-year programme grant at 40% scale for a 24-month pilot phase, conditional on successful initiation of the proposed interface experiment within 6 months. Decline the mainstream group’s renewal application. Defer final commitment of the remaining 60% pending review at 24 months against the criteria specified below.  

  ### Reasons for Recommendation  
  1.  **Addressing the Assessability Challenge:** The core objection—unassessability by current standards—is valid but not insurmountable. The Halvorsen group’s proposal for a jointly designed, pre-registered *interface experiment* directly confronts this. It offers a mechanism to generate empirical outcomes both parties acknowledge *should* falsify their core claim under controlled conditions ("count against them"). This moves beyond theoretical impasse towards empirically testable disagreement, meeting the committee’s requirement for assessability *in principle*, even if not via standard synaptic metrics. Funding enables this crucial test.  

  2.  **Resolving the Anomaly:** The published result central to the dispute remains inadequately explained by the mainstream’s "context + savings" account, which appears post-hoc. Funding Halvorsen allows a dedicated investigation designed *specifically* to probe this anomaly through the interface experiment. This offers higher potential for resolving a persistent puzzle than funding incremental work within the established paradigm.  

  3.  **Maximizing Return on Scarce Resources:** Full funding for either group precludes the other. A reduced pilot phase for Halvorsen:  
      *   Preserves resources (60% of the grant) for potential reallocation after review.  
      *   Creates leverage to ensure the interface experiment is executed (see Conditions).  
      *   Allows the mainstream group time to seek alternative funding while the critical experiment proceeds. Deferral wastes the opportunity to resolve the dispute.  

  ### Conditions and Timeline  
  1.  **Initiation:** Halvorsen and the designated mainstream group (PI having agreed in writing to co-design) must submit a jointly signed, committee-approved protocol for the interface experiment, including pre-registered analysis plans and *explicitly defined* falsifying outcomes for Halvorsen’s core claim, within **6 months** of funding start. Failure voids the grant.  
  2.  **Execution:** The approved experiment must be completed and primary data submitted to the committee by **Month 18**.  
  3.  **Review:** A committee review, informed by the experimental data and progress report, will occur at **Month 24**. Continuation funding (remaining 60% for 3 years) requires meeting the Success Criteria below.  

  ### Success Criteria for 24-Month Review (Paradigm-Neutral)  
  **To justify continuation funding, even if Halvorsen’s interpretation is ultimately wrong, we must see:**  
  *   **Executed Experiment:** The pre-registered interface experiment was completed rigorously per protocol.  
  *   **Decisive Data Generated:** The experiment produced clear, statistically robust outcomes that:  
      (a) *Force a substantive response* from the mainstream paradigm (e.g., requiring significant model modification beyond "context + savings" to explain, or demonstrating an effect the mainstream *concedes* their model did not predict), **OR**  
      (b) *Falsify Halvorsen’s core claim* as pre-defined, demonstrating their inability to account for the results within their own framework.  
  *   **Productive Engagement:** Evidence of sustained, good-faith collaboration/communication with the mainstream group throughout the design and execution phases.  

  **To conclude funding was wasted, even if Halvorsen’s core claim is ultimately right, we would see:**  
  *   **Failure to Launch:** The interface experiment protocol is not submitted/approved within 6 months, or the experiment is not completed per the timeline.  
  *   **Inconclusive Outcome:** The experiment yields ambiguous results explainable by minor adjustments within *either* paradigm without challenging core assumptions, failing to meet criteria (a) or (b) above.  
  *   **Lack of Engagement:** Demonstrated unwillingness by Halvorsen to incorporate valid co-design input or share data/methods transparently, rendering the experiment non-credible.  

  ### Strongest Consideration for the Losing Side (Declining Halvorsen/Renewing Mainstream)  
  The most compelling argument against funding Halvorsen is the consistent external review critique that their proposal fails the field’s established standards of evidence. The mainstream group delivers predictable, technically sound contributions that incrementally advance a well-validated model. Funding them offers guaranteed, assessable progress within the dominant paradigm, avoiding the risk associated with an approach deemed unassessable by most field experts.  

  **Why it Does Not Carry:** This argument, while prudent, accepts the current paradigm’s standards as the sole arbiter of validity, potentially stifling exploration of anomalies it struggles to explain. The Halvorsen group’s offer of a pre-registered, falsifiable experiment co-designed with their critics directly addresses the assessability concern by creating a *new*, mutually agreed-upon point of empirical contact. Funding the pilot phase leverages this unique opportunity to rigorously test a fundamental challenge without betting the entire budget, while the defined success criteria ensure accountability independent of theoretical allegiance. The cost is the mainstream group’s renewal, but their established record suggests a higher likelihood of securing alternative funding compared to the high-risk, high-potential Halvorsen challenge.  

