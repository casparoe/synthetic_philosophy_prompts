       But if she is good, then the selected case should give more confidence.

       So I think your gut might be wrong on this one? Or maybe I misinterpreted your concern.

       You said: "the intern took the photo. If she photographs every tenth letter, versus if she only photographs letters she already suspects are V's". And you feel that the second should leave you less confident. But note: in the second case, you are only getting photos of letters that are suspected to be V. That means you don't get any photos of letters that are not suspected to be V. But for the letter in question, the fact that she selected it is positive evidence. And then the photo provides additional evidence. So overall, for a selected letter that then looks like V in the photo, it should be very strong evidence.

       But if you are worried that the intern's selection might be based on factors that are not related to the actual handwriting, then that could be a problem. For example, if she selects based on the content of the letter, then that might be independent of the handwriting. But in that case, the selection might not be informative about V (the handwriting). So then you would set P(S|V)=P(S|~V), and it becomes the same as random.

       So the key is: what is the basis of her suspicion? If it's based on a preliminary look at the handwriting, then it is informative about V. If it's based on something else, then it might not be.

       Given that, I think the rule can handle it by setting the appropriate P(S|V) and P(S|~V). And if the selection is based on the handwriting, then it should make you more confident.

       Therefore, you might have to give up this verdict.

  5. **Two kinds of doubt**:

     - The report: "the ink is probably iron-gall". But there are two doubts:
          a) The colleague might be misreporting (garbled in transmission).
          b) The conservator might be talking about another letter.

     - Let H be: the ink is iron-gall.

