  6. **Lamp was worse than thought**:

     - You find out the lamp was very bad. This means that your earlier observation was less reliable. So you should decrease your confidence in E (and hence in V) even though nothing new about the letter happened.

     - This is analogous to finding out that a witness is unreliable after you heard their testimony. You have to adjust.

     - How? You have to re-evaluate the update you did for E. Originally, you updated E to 0.8 based on the observation D. But that update relied on the lamp being in a certain condition. Now you learn that the lamp was worse than you thought. This changes the conditional probabilities P(D|E) and P(D|~E) that you used in the update. Specifically, with a worse lamp, P(D|E) might be lower (more chance of not seeing it) and P(D|~E) might be higher (more chance of false positive).

     - So you have to go back and re-update E with the new information about the lamp.

     - This will typically reduce your confidence in E.

     - Also, for two people who get the clues in different orders: if one learns about the lamp being bad before seeing the letter, they would not update as much. If they learn after, they have to adjust down. But both should end up at the same place. This is what you desire.

     - The rule can handle this if we explicitly model the lamp condition as a variable and include it in the conditioning.

  **Unified Principle:**

  The principle is: **Model the entire evidence-generating process including the conditions of observation and the independence of multiple pieces of evidence. This requires introducing latent variables that capture the reliability and context. Then, update by conditioning on all the evidence.**

  In practice, this means using a Bayesian network with variables for the hypothesis, the intermediate states, the observations, and the conditions. When new evidence arrives, we update all probabilities accordingly.

