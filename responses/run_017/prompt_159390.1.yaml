     - However, if you can compute P(H | report says iron-gall) by integrating over the other variables, then the rule works. But it might be that the two kinds of doubt have the same effect on the report? Or not.

     - In any case, the rule is still valid if we define the partition appropriately. But the finer partition (with more cells) would allow us to see the difference. For example, if we define cells for:

          - The conservator was talking about this letter and said iron-gall and the report is correct.
          - The conservator was talking about this letter and said something else but the report is incorrect.
