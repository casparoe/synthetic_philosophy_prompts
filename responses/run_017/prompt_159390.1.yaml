     - In the rule you are using, you would define a partition based on what the report says. But the report is: "the conservator said the ink is probably iron-gall". And you assign a probability that the report is correct and about this letter. But then you squash it into one event: the report says iron-gall. But the two doubts have different implications. For example, if the conservator was talking about another letter, then even if the report is accurately transmitted, it doesn't pertain to this letter. If he was talking about this letter but the report is garbled, then it might be that he said something else.

     - To handle this, we need to model the entire chain. We can't squash. We need to have separate variables for:

          - A: the conservator was talking about this letter.
          - S: the conservator said "iron-gall" (about whatever letter he was talking about).
          - T: the true ink type of the letter in question (H).
