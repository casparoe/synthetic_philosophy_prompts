  But in your case, you are not directly observing E (e.g., "the script is V's") but rather a clue that gives you some information about E. You are updating your belief about E and then using that to update about H.

  The rule you described is:

  P_new(V) = P(V | E) * P_new(E) + P(V | ~E) * P_new(~E)

  where E is the event that the script looks like V's. This rule is correct if we assume that the conditional probabilities P(V|E) and P(V|~E) remain fixed. However, the challenges you describe arise because the way we update P_new(E) might involve different kinds of evidence that have different implications.

