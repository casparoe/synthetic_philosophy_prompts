       However, there is a different perspective: if the intern only photographs letters that she thinks are V, then you never see a photo of a letter that she thinks is not V. So you are missing the opportunity to see a photo that might change your mind about a letter you thought was not V. But in this case, you are only updating about this one letter. For this letter, the selection gives you information.

