  ### Scratchpad of Candidate Defeaters (Pre-Organization)  
  **Argument-Silent Pumps**: Failure to imagine P is treated as evidence for ~◊P, with no reconstructible proposition. *Thrown out?* Only if "failure" implies a premise (e.g., "Inconceivability entails impossibility"). If not, fatal.  
  **Therapeutic Pumps**: Reveal conceptual indeterminacy (e.g., "What is 5 o'clock on the sun?"). *Thrown out?* Redescribable as argument for vagueness. Dismissible.  
  **Calibration Pumps**: Reveal personal thresholds (e.g., how much torture is "too much" in a ticking-bomb case). *Thrown out?* Invariance (I) likely fails empirically; narrative evokes dispositions arguments can't. Serious.  
  **Emotion as Evidence**: Moral pumps (e.g., Transplant) where disgust shifts verdicts; emotion isn't reducible to premises. *Thrown out?* If emotion is non-propositional evidence, fatal. Else, dismissible as smuggling.  
  **Non-Propositional Simulation**: Pumps requiring dynamic mental simulation (e.g., navigating a locked room). *Thrown out?* If simulation outputs propositions, redescribable. Else, fatal.  
  **Invariance Failure**: If stories shift verdicts vs. arguments even after reflection. *Thrown out?* Tests (I); if robust, fatal unless "reflection" in (P) is gerrymandered.  
  **Privilege Clause Vacuum**: Any failed reconstruction blamed on insufficient reflection. *Thrown out?* Requires constraints; else fatal.  
  **Collapse into Simulation**: If "search over cases" in reconstruction requires simulation. *Thrown out?* Boundary issue; fatal if reconstruction relies on simulative output.  
  **Expertise Asymmetry**: Experts swayed by pumps but not arguments, even post-reflection. *Thrown out?* Conceded as evidence against (I).  
  **Coherent Gap**: Accept argument but reject pump (or vice versa) with no explanation. *Thrown out?* If coherent, fatal.  
  **Cognitive Load**: Arguments too complex; stories essential for access. *Thrown out?* Dismissible as performance (not competence) issue.  
  **Concept Acquisition**: Pumps teach new concepts (e.g., "trolley problem" framing). *Thrown out?* Redescribable as premise-introduction. Dismissible.  
  **Phenomenology-Judgment Equivocation**: Using "intuition" ambiguously. *Thrown out?* Flagged per (7); user may equivocate in (E).  

