  ### Ranked Defeaters Table  
  | Rank | Defeater                                                                 | Verdict       |  
  |------|--------------------------------------------------------------------------|--------------|  
  | 1    | **Argument-Silent Pumps** (No reconstructible content; failure as direct evidence) | Fatal        |  
  | 2    | **Calibration Pumps + Invariance Failure** (Empirical mismatch in threshold revelation) | Conceded     |  
  | 3    | **Privilege Clause Vacuum** (Unconstrained "reflection" makes (I) unfalsifiable) | Conceded     |  
  | 4    | **Coherent Gap** (Accept argument/reject pump or vice versa, no gap explanation) | Fatal        |  
  | 5    | **Emotion as Non-Propositional Evidence** (Moral disgust as irreducible warrant) | Dismissible  |  
