  A friend of mine is really into classical Nyāya epistemology and I've been keeping a list of her verdicts on cases. So far: mistaking a rope for a snake at dusk — not knowledge; seeing smoke on a far hill and concluding there's fire — knowledge; being told that a gavaya is a cow-like animal, then seeing one in a forest weeks later and recognising it as a gavaya — knowledge; taking a trustworthy person's word that there's a festival in a town you've never visited — knowledge; genuinely not being able to tell whether a shape in the dark is a man or a post — not knowledge; recalling, when asked, that you locked the front door this morning — not knowledge; the second and third moment of staring at the same pot — knowledge, not just the first moment.

