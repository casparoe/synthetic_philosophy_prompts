  - Perception: must be non-defective (so no illusion, no doubt). Also, each moment of perception counts (case 7).
  - Inference: valid when the invariable relation (vyāpti) is known and the mark (e.g., smoke) is perceived (case 2).
  - Testimony: valid when the speaker is trustworthy (case 4) and the information is not contradicted.
  - Comparison: valid when it leads to recognition based on prior description and current perception (case 3).
