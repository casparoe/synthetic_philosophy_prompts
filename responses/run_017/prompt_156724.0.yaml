answer: |-
  ### Case: Watershed Management Decision  
  The municipal council of Riverton must choose between two water infrastructure plans for a growing district. Option A expands traditional reservoirs and pipelines, costing $10M with reliable projections: reduced summer shortages, modest rate increases for users, and maintenance costs covered by fees (net near-term benefit: +$1.2M ± $0.3M). Option B pioneers a closed-loop recycled-water system, costing $11M with slightly worse near-term projections: higher upfront disruption and a 20% risk of first-year filtration issues (net near-term benefit: +$0.8M ± $0.5M). Both options have century-scale consequences: Riverton’s system will become the regional template due to path dependence in engineering standards. If adopted widely (90% probability given Riverton’s influence), A’s conventional design locks in low resilience to droughts, causing expected regional adaptation costs of -$100M to +$100M (symmetric distribution; mean $0). B’s novel system, if replicated, establishes a durable technical standard. However, evidence of B’s long-term viability is systematically skewed: only successful pilot systems (30% of deployments) publish data, while failures are buried by contractors. The agent knows B’s widespread adoption would cause either massive savings (+$150M) if robust or ecological damage (-$150M) if flawed, but their mild optimism (based solely on published case studies) is untrustworthy. No low-probability disasters are invoked—amplification arises deterministically from institutional precedent.

  ### Credences and Verdicts  
  1. **Long-run expected value (EV) favors B**:  
     - Near-term: A nets +$1.2M, B nets +$0.8M.  
     - Long-run: A’s effects are symmetric (mean $0). B’s *available* evidence suggests 70% chance of +$150M (published successes) and 30% of -$150M (discounted unpublished failures). Unadjusted EV for B: (0.7 × 150M) + (0.3 × -150M) = +$60M.  
     *Total EV: A ≈ $1.2M, B ≈ $60.8M → Favors B.*  

  2. **Window-restricted consequentialism favors A**:  
     - Considers only forecastable near-term effects (±5 years). A’s +$1.2M > B’s +$0.8M.  
     *→ Favors A.*  

  3. **Imprecise-credence rule (Levi’s E-admissibility) favors A**:  
     - The agent’s credence for B’s long-run sign is indeterminate: the true failure rate could be 30–90%, making expected value range from -$120M to +$60M. Under *any* reasonable probability (e.g., ≥40% failure chance), B’s total EV is negative. A’s long-run EV is $0 under all interpretations. E-admissibility requires an option to be optimal for *some* admissible probability distribution. A is optimal if B’s failure probability is >35%. B is optimal only under distributions ignoring skew (e.g., assuming <35% failures)—but these are inadmissible given known evidence gaps.  
     *→ Favors A.*  

  ### Key Feature and Critique  
  - **Feature doing the work**: Systematic evidential skew for B (only successes documented), making long-run expectation indeterminate.  
  - **If skew removed**: Assume B’s long-run effects become symmetric (-$150M to +$150M, mean $0). Then:  
    - Long-run EV: A = $1.2M + $0 = $1.2M; B = $0.8M + $0 = $0.8M → *Favors A*.  
    - Window-restricted still favors A.  
    - Imprecise rule: Both have determinate $0 long-run expectation; A wins on near-term → *Favors A*.  
  - **Defender’s objection**: The case rigs B’s "unadjusted credence" by forcing reliance on flawed data while ignoring Bayesian updating from analogous systems (e.g., wastewater recycling). A fair EV would incorporate indirect evidence, narrowing B’s uncertainty toward symmetry.  

  \answer{long-run EV: B; window-restricted: A; imprecise-credence rule: A}
