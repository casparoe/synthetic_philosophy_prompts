answer: |-
  Here is a concrete, case-based decision tree for your deterrence theory quiz, built from the logical space of nuclear standoffs. I've prioritized your specified cases, avoided slogans, and committed to unambiguous branches. The tree produces six distinct leaves (with notes on overlaps and gaps). I'll first outline the tree, then map your characters.

  ### **Decision Tree: Which Deterrence Theory Do Your Instincts Commit To?**
  *(Answer each question based on concrete cases, not theoretical labels.)*

  1. **GHOST DETERRENCE CASE**:  
     An adversary refrains from attacking because they believe you have 100 nuclear warheads. In reality, you have zero. No one discovers the truth. Did successful deterrence occur?  
     - **YES** → Go to Q2A  
     - **NO** → Go to Q2B  

  2. **SPLIT AUTHORITY CASE**:  
     *(Branching from Q1)*  
     - **Q2A (Ghost=YES)**: A state inherits nukes, but launch authority requires unanimous agreement from three officials who actively sabotage each other. Outsiders have no idea who controls the button. Is this state effectively deterring adversaries?  
       - **YES** → Go to Q3A  
       - **NO** → Go to Q3B  
     - **Q2B (Ghost=NO)**: Same split-authority scenario. Is this state effectively deterring adversaries?  
       - **YES** → Go to Q3C  
       - **NO** → Go to Q3D  

  3. **NOTHING-HAPPENED CASE**:  
     *(Branching from Q2)*  
     - **Q3A (Ghost=YES/Split=YES)**: A crisis ends without nuclear strikes. What would have counted as evidence that your nuclear threat *caused* this outcome?  
       - "ADVERSARY'S CALCULUS CHANGED: Their panic or backchannel concessions prove the threat worked." → **Leaf 1**  
       - "IMPOSSIBLE TO KNOW: We can’t access the adversary’s mind or rerun history." → **Leaf 2**  
     - **Q3B (Ghost=YES/Split=NO)**: Same nothing-happened crisis. What counts as evidence?  
       - "ADVERSARY'S CALCULUS CHANGED" → **Leaf 3**  
       - "IMPOSSIBLE TO KNOW" → **Leaf 4**  
     - **Q3C (Ghost=NO/Split=YES)**: Same crisis. What counts as evidence?  
       - "ADVERSARY'S CALCULUS CHANGED" → **Leaf 5**  
       - "IMPOSSIBLE TO KNOW" → *Incoherent path* (see notes)  
     - **Q3D (Ghost=NO/Split=NO)**: Same crisis. What counts as evidence?  
       - "ADVERSARY'S CALCULUS CHANGED" → Go to Q4  
       - "IMPOSSIBLE TO KNOW" → **Leaf 6**  

  4. **ESCALATION CONTROL CASE**:  
     *(Only for Q3D → "Adversary’s Calculus Changed")*  
     - **Q4**: An adversary invades your ally with conventional forces. Should you have limited nuclear options (e.g., tactical strikes on troops) to signal resolve without triggering all-out war?  
       - **YES** → **Leaf 7**  
       - **NO** → **Leaf 8**  

  ---

  ### **Leaves: Named Deterrence Theories**
  Each leaf corresponds to a theory. I’ve assigned your characters and flagged overlaps/gaps.

  - **Leaf 1: Existential Deterrence**  
    - *Description*: Nukes deter just by existing. Belief in their existence is sufficient—no credible plan, command structure, or intent required. Success is unfalsifiable (since we can’t rerun history).  
    - *Your character*: **The advisor** (arsenal deters regardless of intent).  
    - *Path*: Ghost=YES, Split=YES, Evidence=Adversary’s Calculus.  

  - **Leaf 2: Brinkmanship ("Leave Something to Chance")**  
    - *Description*: Deliberate uncertainty (e.g., chaotic command, ambiguous redlines) forces adversaries to gamble on uncontrollable escalation. "Success" is the adversary’s visible fear of chaos.  
    - *Overlap note*: Merges with "pure uncertainty" view. Pure existentialists (Leaf 1) accept uncertainty; brinkmanship *weaponizes* it.  
    - *Path*: Ghost=YES, Split=YES, Evidence=Impossible to Know.  

  - **Leaf 3: Credible Minimum Deterrence**  
    - *Description*: Deterrence requires a *credible* but minimal threat (e.g., "cities will burn"). Bluffs (ghost weapons) work short-term, but split commands or ambiguous control undermine credibility. Evidence is adversary concessions.  
    - *Path*: Ghost=YES, Split=NO, Evidence=Adversary’s Calculus.  

  - **Leaf 4: Nuclear Skepticism**  
    - *Description*: Deterrence is theoretically possible but empirically unprovable and unstable. Ghost weapons might work, but split commands invite accidents. "Success" is unverifiable luck.  
    - *Gap note*: Rarely written as a formal theory—sits between abolitionism and existentialism.  
    - *Path*: Ghost=YES, Split=NO, Evidence=Impossible to Know.  

  - **Leaf 5: Brinkmanship (redundant)**  
    - *Path*: Ghost=NO, Split=YES, Evidence=Adversary’s Calculus → **Collapses into Leaf 2**.  
    - *Why*: If you reject ghost deterrence (requiring real nukes) but accept split-command deterrence, you’re still relying on weaponized uncertainty. The evidence question becomes a coin flip—I merged it with Leaf 2 for consistency.  

  - **Leaf 6: Abolitionism**  
    - *Description*: Nukes make crises worse. Deterrence is a bluff that encourages recklessness (e.g., split commands cause accidents). No evidence justifies the risk—abolish them.  
    - *Your character*: **The minister** (posture is a bluff that should be dismantled).  
    - *Path*: Ghost=NO, Split=NO, Evidence=Impossible to Know.  

  - **Leaf 7: Flexible Response / War-Fighting**  
    - *Description*: Deterrence requires calibrated escalation (tactical nukes, limited strikes). Credibility comes from options to fight and "win" a nuclear war.  
    - *Path*: Ghost=NO, Split=NO, Evidence=Adversary’s Calculus, Escalation=YES.  

  - **Leaf 8: Countervalue Deterrence**  
    - *Description*: Only massive retaliation deters. Limited options invite war. Keep arsenals small and threats apocalyptic.  
    - *Your character*: **The general** (war plan exists only to be shown).  
    - *Path*: Ghost=NO, Split=NO, Evidence=Adversary’s Calculus, Escalation=NO.  

  ---

  ### **Notes on Logical Gaps and Overlaps**
  - **Collapsed Theories**: Brinkmanship (Leaf 2) and existentialism (Leaf 1) share a branch but diverge on *how* uncertainty functions. Brinkmanship intentionally creates risk; existentialism passively relies on it.  
  - **Incoherent Path**: Ghost=NO + Split=YES + Evidence=Impossible to Know (Q3C→"Impossible"). Rejecting ghost deterrence implies nukes must be real, but accepting split commands requires embracing uncertainty. If you then deny any evidence of success, you have no coherent mechanism—no theory occupies this.  
  - **Unattractive/Missing**: No theory occupies Nuclear Skepticism (Leaf 4)—it’s a "default" for distrusting deterrence without embracing abolition.  
  - **Character Alignment**:  
    - General: **Leaf 8 (Countervalue)**. His "plan exists only to be shown" requires a clear, massive threat to deter—no wiggle room for escalation.  
    - Advisor: **Leaf 1 (Existential)**. Weapons deter by existing, full stop.  
    - Minister: **Leaf 6 (Abolitionism)**. The whole system is a lethal bluff.  
  - **Worst Shape**: **The advisor (existential deterrence)**. If no one believes in the arsenal (e.g., split command leaks, ghost weapons exposed), deterrence vanishes. It’s the most brittle theory—your novel’s standoff could collapse from misinformation alone.  

  ### **Why This Tree Works**
  - Tests instincts, not knowledge: Cases like ghost weapons or split authority force visceral choices.  
  - Resolves ambiguities: I flipped "coin flips" (e.g., merging brinkmanship paths) to avoid neutral/menu options.  
  - Matches your characters: Each lands cleanly on a leaf that reflects their stated beliefs.  
  - Includes your cases: Ghost deterrence (Q1), split authority (Q2), nothing-happened (Q3) drive the branches.  

  Implement this as a web quiz with a results page explaining each theory. For promo, add: "Which of [Novel’s Characters] Are You?" alongside the theory result. Let me know if you want tweaks!
