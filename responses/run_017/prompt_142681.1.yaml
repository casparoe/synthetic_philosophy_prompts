  | 6    | **Feedback Loop Goodhart**    | *Using the proxy changes the world, invalidating its own assumptions.*             | e            | Proxy destabilizes its ground truth. |
  | 7    | **Selection Shift Goodhart**  | *Publishing the proxy changes the population, drifting its meaning.*               | c            | No optimization needed—just visibility. |
  | 8    | **Unnamed**                   | *Optimizing non-adaptively avoids gaming but still fails silently.*                | (a if Q5 path) | Rarely defended; unattractive. |

