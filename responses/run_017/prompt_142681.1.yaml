  #### **Branch Nodes (Questions)**

  1. **Is the metric being actively optimized or selected upon?**  
     (e.g., agents changing behavior to improve scores, or filtering based on metric)  
     → *Yes*: Go to Q2  
     → *No*: Go to Q3  

  2. **Does optimization require modeling the metric?**  
     (e.g., agents must understand/reverse-engineer the proxy to game it)  
     → *Yes*: Go to Q4  
     → *No*: Go to Q5  

  3. **Is the metric used for selection?**  
     (e.g., choosing extremes, ranking, or filtering based on scores)  
     → *Yes*: **Regressional Goodhart** (Leaf 1)  
     → *No*: **Context Shift Goodhart** (Leaf 2)  

  4. **Does optimization break the causal link to the target?**  
     (e.g., proxy no longer measures target due to manipulation)  
     → *Yes*: **Causal Goodhart** (Leaf 3)  
     → *No*: Go to Q6  

  5. **Is the system pushed beyond the proxy's validated domain?**  
     (e.g., proxy works in initial context but fails in new extremes)  
     → *Yes*: **Out-of-Range Goodhart** (Leaf 4)  
     → *No*: **Adversarial Goodhart** (Leaf 5)  

  6. **Does optimization create a feedback loop?**  
     (e.g., using the proxy changes the data it was built on)  
     → *Yes*: **Feedback Loop Goodhart** (Leaf 6)  
     → *No*: **Adversarial Goodhart** (Leaf 5)  

  *(Leaf 5 reached from both Q5 and Q6; see overlap note below)*  

