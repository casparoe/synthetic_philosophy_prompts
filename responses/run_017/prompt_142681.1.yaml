  ### Goodhart Taxonomy Tree for Metric Breakdowns

  Here's a decision tree taxonomy based on your specifications. It uses 5 branch questions to sort cases into 8 leaves, with each leaf named and annotated. The tree is built from logical combinations of concrete questions, designed to be whiteboard-friendly using your provided cases. Distinctions between your four-way split are preserved, with "adversarial" and "out-of-range" treated as separate leaves (they don't collapse). Cases are mapped to leaves, with overlaps noted. Confidence flags and contested points are summarized at the end.

