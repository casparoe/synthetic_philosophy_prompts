  #### **Leaves (Breakdown Types)**

  | Leaf | Name                          | Awkward Commitment                                                                 | Cases Mapped | Notes |
  |------|-------------------------------|------------------------------------------------------------------------------------|--------------|-------|
  | 1    | **Regressional Goodhart**     | *Selecting on noisy proxies amplifies randomness; extreme values are often flukes.* | d            | Non-agent, statistical artifact. |
