prompt: |-
  I am the patient-safety officer at a large teaching hospital, and I own the response our institution makes to individual clinicians after an adverse event. Every week my office handles one or two events serious enough to need a written response; for each one we do three things — a private conversation with the clinician involved, a note that goes into the event file and is read by the department chief and our legal office, and, in about a quarter of cases, something collective on the unit: a morbidity-and-mortality conference, a huddle, an all-staff email. I have ten working days and about forty minutes of my own time per case, the note needs the department chief's signature, and anything that reads as punitive gets contested, so the wording carries real weight. A few years ago the hospital bought into a just-culture framework, which on the ward has collapsed into the slogan that we target systems rather than people, and I have come to think that slogan is now doing damage: it is used to justify saying nothing at all to individuals. I see two failure modes. Some clinicians respond to our silence by vanishing — they stop reporting near-misses, go quiet in debriefs, get angry at anyone who mentions the case. Others have plainly learned the script: fluent apology, visible distress, no change in practice, flat event rates over three years. My reading is that we are recruiting one moral emotion when we want the other, but I have no way to tell, in advance, which one a given response will recruit. My team drafted a crude three-question rubric — is the object of what we say the act, the role, or the person? what does the clinician most want to do in the next hour, tell someone, repair it, or be somewhere else? would the same words land differently with five colleagues in the room? — and I want that either repaired or replaced with something I can defend to a chief of surgery.

  What I am asking for is a decision procedure my office can actually run, grounded in what is genuinely known about the difference between guilt and shame rather than in vibes. Please give me the gates in the order I should ask them, what counts as a sufficient answer to each, the point at which the procedure stops and says escalate to HR or fitness-to-practice, and the points at which it must hand the decision to a human being because the question is one of values rather than facts. It has to fit on two laminated pages and be runnable in forty minutes by a rotating resident with a half-day of training, so I need you to tell me which distinctions must survive that simplification and which can honestly be dropped. Several things make this harder than a checklist. We cannot aim at an emotion directly; we can only aim at the situation, the words, and the norms, so the procedure has to say what it is really predicting. I also want it to be honest about the possibility that shame is not simply the bad twin here: we have all seen clinicians who feel nothing and change nothing, and well-placed exposure sometimes seems to be the only thing that reaches them, so I would rather that possibility be honored than assumed away. And I keep hearing that this unit has a culture of blame or that another has a reporting culture, as if culture were a dial my office can turn; I want to know which of the levers I actually control — who is in the room, whether the name is attached, whether the debrief is public, whether we publish our own reporting rates, how fast we reply — really move which emotion gets recruited, and which are pure theatre.

  Please then run the finished procedure on three real shapes of case, including at least one where the answer is one I will not like and you should say why you think I will not like it. The first: a night-shift resident who mis-programmed an infusion pump; the patient came to no harm, she reported it herself within the hour, and her attending says she is a wreck and is talking about leaving medicine altogether. The second: a senior, well-liked, high-volume surgeon whose theatre team has documented for years that he humiliates nurses and skips the safety checklist; this event is a retained swab, and three earlier near-misses with his name on them produced no response at all. The third: an agency nurse who was on the unit for six shifts, was involved in a medication error, and is now gone — no continuing relationship, no standing in the community, nothing we say can follow her. That last case matters to me because I suspect it shows something about whether either emotional lever needs an audience whose regard is worth having, and about what is left when there is none. Please also handle the hard cases the procedure must not dodge: the clinician who shows every marker of guilt and does not change, the clinician who seems to feel nothing at all, and the case where the hospital's own reputational interest and the clinician's good come apart, since that is exactly where I mistrust my own judgment. Finally, an ethicist on our consultation service says the guilt/shame distinction is an artifact of English and that I should be talking about accountability instead of emotions; tell me whether the procedure should be able to survive that objection. For each worked case, end with a single line in exactly this form: Case N — Verdict: GUILT-LEANING / SHAME-LEANING / NEITHER-STRUCTURAL / ESCALATE. Close the whole answer with one sentence beginning Summary: that states, in a form I could read aloud to my director, what the procedure is and what it cannot do.
reasoning: |-
  Hmm, this is a complex patient safety issue with significant institutional and human factors implications. The user is a patient-safety officer grappling with the limitations of their current "just culture" approach, which has devolved into avoiding individual accountability. They've identified two problematic patterns: clinicians who withdraw after adverse events, and those who perform ritualized apologies without changing behavior. Their proposed three-question rubric shows insight but needs refinement.

  The core challenge is designing a practical decision tool that distinguishes between guilt (productive, behavior-changing) and shame (destructive, identity-threatening) responses, while acknowledging that some shame might be necessary for certain individuals. The tool must be executable by rotating residents within strict time constraints, yet sophisticated enough to handle complex human behaviors.

  Key requirements include:
  - Operationalizing psychological concepts into observable markers
  - Defining clear escalation thresholds
  - Identifying which cultural levers are actually controllable (e.g., public/private setting, naming)
  - Addressing edge cases like the transient agency nurse
  - Surviving the ethicist's objection about emotion vs accountability

  For the case studies:
  The self-reporting resident likely needs guilt-leaning support to prevent attrition. The surgeon with repeated offenses requires shame-leaning intervention since private approaches failed. The agency nurse falls into neither-structural as no emotional lever exists. The tool must explicitly handle the "unrepentant clinician" and "institutional conflict" scenarios.

  The final procedure prioritizes sequential assessment of:
  1. Accountability (pre-action vs post-action focus)
  2. Behavioral cues (reparation vs avoidance)
  3. Social context (audience effect)
  4. Institutional constraints

  Notably, it preserves the ethicist's accountability framing while pragmatically using emotion as a predictor of behavioral change. The summary for leadership emphasizes that this is a behavior prediction tool, not an emotion detector, with defined limitations around entrenched patterns and resource constraints.
answer: |-
  Here is a practical, evidence-informed decision procedure designed for your constraints, grounded in the functional distinction between guilt (focused on *harm done/mistake made*, motivating reparative action) and shame (focused on *global self-defect*, motivating concealment/withdrawal). It prioritizes observable actions and context over inferring internal states. The procedure fits on 2 laminated pages and requires ~30 minutes for a trained resident.

  **Core Principles:**
  1.  **Predict Behavior, Not Emotion:** Target the *likely behavioral outcome* (reporting, remediation, withdrawal, concealment), not the emotion itself. Guilt predicts remediation; shame predicts avoidance.
  2.  **Leverage Controllable Factors:** Focus on levers you control: *Privacy/Publicness*, *Identifiability*, *Focus of Language*, *Speed/Timeliness*, *Tangible Actions Offered*.
  3.  **Honor Nuance:** Acknowledge that mild, context-specific shame *can* motivate change in persistently unresponsive individuals, but it is high-risk and requires careful escalation. Avoidance/Withdrawal is the primary red flag.
  4.  **Accountability is the Bridge:** The ethicist is partially right. The procedure uses "guilt/shame-leaning" as *predictors* of whether constructive accountability (acknowledgment + remediation) is likely. The *goal* is accountable behavior.

  **The Decision Procedure: "ACTS" Framework (Accountability, Context, Target, Signals)**

  *Run gates sequentially. Stop at any ESCALATE/NEITHER point. Time: ~30 mins/case.*

  1.  **A: Accountability Assessment - Was there a *knowing* bypass of a critical safety step?** (5 mins)
      *   **Sufficient Answer:** Review event report, team statements, policy. Focus: Did the clinician *know* the rule/procedure existed and *knowingly choose* not to follow it *in that moment* (not habitually)? Ignore "should have known."
      *   **Gate Outcome:**
          *   **YES (Knowing Bypass):** → **ESCALATE** immediately to HR/Fitness-to-Practice. *Rationale: This is reckless behavior, not error. Requires formal process.*
          *   **NO (Error, Slip, Lapse, Mistake) or UNCLEAR:** → Proceed to **Gate 2**.

  2.  **C: Context & Control - What levers *must* we use, and what is the clinician's standing?** (10 mins)
      *   **Assess:**
          *   *Privacy Required?* (e.g., clinician highly distressed, risk of reputation collapse, sensitive details) → **Mandate Private** conversation. *Levers: Privacy reduces shame risk but may reduce urgency for some.*
          *   *Publicness Required/Appropriate?* (e.g., team learning vital, pattern suggests private failed, event known widely) → **Mandate Unit-Level Action** (M&M, huddle). *Levers: Publicness can induce shame OR shared responsibility; focus on system in public framing is key.*
          *   *Identifiability Needed?* (e.g., for specific feedback, if public) → **Name Attached** in note/action. *Levers: Naming increases personal accountability/shame risk; anonymization fosters systems focus but may enable avoidance.*
          *   *Continuing Relationship?* (e.g., staff member vs. transient agency) → **Relationship Present/Absent**.
      *   **Gate Outcome:**
          *   **Transient Clinician (No Relationship, e.g., Agency Nurse):** → **NEITHER-STRUCTURAL**. *Focus note/system action on unit processes (orientation, verification).* **STOP PROCEDURE.** *Rationale: No emotional lever exists; focus on systemic fixes for future temps.*
          *   **Continuing Relationship:** → Proceed to **Gate 3**. Record privacy/publicness/ID decisions.

  3.  **T: Target of Language & Action - What will the *primary focus* of our communication be?** (10 mins)
      *   **Craft Core Message:** Based on Gates 1 & 2, draft the key message for the conversation/note. **Crucial:** The *first substantive focus* after empathy matters.
      *   **Predictive Focus:**
          *   **GUILT-LEANING Focus:** "**The action / outcome** and how we **repair/improve**." (e.g., "The pump programming error happened. Let's figure out why and how we prevent recurrence. Here's support for you to lead that."). *Predicts: Remediation, engagement.*
          *   **SHAME-LEANING Focus:** "**The person / role failure**." (e.g., "You made an error." "Your performance was deficient."). *Predicts: Avoidance, defensiveness.* (Avoid explicit blame!).
          *   **NEITHER-STRUCTURAL Focus:** "**Only the system factors**." (e.g., "Pump interfaces are confusing."). *Predicts: No personal accountability, potential for learned helplessness.*
      *   **Gate Outcome:** Choose **ONE** primary focus for the *core message*. **THIS IS THE KEY PREDICTOR.** Proceed to Gate 4.

  4.  **S: Signals & Mitigation - What *observed* signals require action to prevent avoidance?** (5 mins)
      *   **Assess for Avoidance Signals (Post-Event or History):** Withdrawal (stopped reporting, quiet), Defensiveness (blaming others/systems excessively), Visible Distress Suggesting Overwhelm (e.g., talking of quitting), **Lack of Remediation Action** (especially if pattern!).
      *   **Mitigation Actions (Based on Focus & Signals):**
          *   **GUILT-LEANING Focus + NO Avoidance Signals:** Proceed. Offer concrete support for remediation (e.g., "Let's review the pump logs together," "Join the IV safety committee").
          *   **GUILT-LEANING Focus + AVOIDANCE SIGNALS:** **STRONGER SUPPORT/MONITORING:** Mandate peer support contact, schedule specific follow-up check-in, involve direct supervisor supportively. *Still Guilt-Leaning.*
          *   **SHAME-LEANING Focus (Chosen due to history/persistence):** **MAXIMUM SUPPORT & CLEAR PATH:** Must pair with *immediate*, tangible offer of non-punitive support (e.g., coaching, simulator time, mandated peer review with *defined positive outcome*). **Document rationale for focus.** **Escalate to Dept Chief/HR for oversight if severe avoidance/history.** *High Risk.*
          *   **NEITHER-STRUCTURAL Focus:** Only if **Gate 2** dictated (Transient). Otherwise, **revisit Gate 3** - structural focus alone fails accountability.
      *   **Gate Outcome:** Final Verdict + Mitigation Plan. Document rationale.

  **Summary Verdicts:**
  *   **GUILT-LEANING:** Focus on act/outcome + repair. Goal: Engagement & Remediation.
  *   **SHAME-LEANING:** Focus on person/role failure *only when necessary due to persistent unresponsiveness*, paired with intense support & clear path. Goal: Break avoidance cycle (high risk).
  *   **NEITHER-STRUCTURAL:** Focus solely on system. For transients or cases where accountability is impossible.
  *   **ESCALATE:** Knowing bypass of safety step (Gate 1) or profound avoidance requiring formal processes (Gate 4).

  **Human Judgment Required:**
  *   **Gate 3 (Target):** Choosing the focus is a *values-based risk assessment*. The resident documents the choice, but the *rationale* (pattern, history, risk of avoidance) requires supervisor review if choosing Shame-Leaning.
  *   **Severity of Avoidance Signals (Gate 4):** Judging if distress signals risk of exit vs. temporary upset requires human insight.
  *   **Institutional Conflict:** If hospital reputation strongly dictates a different path than clinician good (e.g., senior surgeon), this must be flagged to the Dept Chief/Medical Director explicitly. The procedure predicts clinician response, not institutional optics.

  **Addressing the Ethicist:** The procedure *uses* guilt/shame as predictors of behavioral outcomes (accountability vs. avoidance). The *goal* is accountable behavior (acknowledgment + remediation). The distinction remains useful pragmatically, even if linguistically contingent, because it predicts *how* accountability manifests or fails. The procedure survives by focusing on *observable actions linked to the concepts*.

  ---

  **Worked Cases:**

  1.  **Night-shift resident (pump error, self-reported, distressed, talking of quitting):**
      *   Gate 1: **NO** (Error, self-reported). Proceed.
      *   Gate 2: **Relationship Present**. **Privacy REQUIRED** (High distress). ID needed for learning/note. Proceed.
      *   Gate 3: **GUILT-LEANING Focus.** "The pump programming error occurred. I'm glad you caught it. Let's understand what made that step hard *here* and what support *you* need to feel confident moving forward." (Focus: Action & Repair).
      *   Gate 4: **Signals:** High distress/withdrawal risk (talking of quitting). **Mitigation:** Strong support - immediate peer support contact, schedule specific follow-up with resident + trusted attending within 48hrs, offer simulation/pump training *if desired*, emphasize value of reporting, affirm commitment to their future.
      *   **Verdict: GUILT-LEANING** *Why you might dislike: It requires significant, immediate support resources for someone who might leave anyway. But ignoring the distress signals risks losing a conscientious reporter and future safe clinician.*

  2.  **Senior Surgeon (retained swab, history of disrespect/skipping checks, near-misses ignored):**
      *   Gate 1: **UNCLEAR/KNOWING?** Did he *knowingly* skip the swab count? History suggests *knowing* bypass of checklist (critical safety step!) *for years*. **→ ESCALATE to HR/Fitness-to-Practice.** *Rationale: Persistent, knowing bypass of fundamental safety processes (checklist, professional conduct) despite near-misses indicates recklessness, not simple error. Requires formal investigation.*
      *   **Verdict: ESCALATE** *Why you might dislike: Escalating a senior, high-volume surgeon is politically fraught. However, Gate 1 is clear: persistent knowing bypass mandates formal action. Your prior "nothing" responses likely reinforced his behavior.*

  3.  **Agency Nurse (med error, gone, no relationship):**
      *   Gate 1: **NO** (Assume error). Proceed.
      *   Gate 2: **NO Continuing Relationship → NEITHER-STRUCTURAL.** Focus note/system action: "Medication error involving temporary staff occurred. Review: Agency nurse orientation process (med verification competency? Unit familiarization?), independent double-check process when new staff present, pharmacy support for unfamiliar meds." Private conversation not feasible/meaningful. Public debrief focuses *only* on system factors, no naming.
      *   **Verdict: NEITHER-STRUCTURAL** *Confirms: Without an ongoing relationship or community standing, emotional levers (guilt/shame) are ineffective. Only systemic interventions are viable.*

  **Handling Hard Cases within the Procedure:**
  *   **"Guilty" but Doesn't Change:** This is a **pattern of Avoidance Signals** (lack of remediation action). Trigger **Gate 4 Mitigation** for avoidance. If persistent despite Guilt-Leaning focus/support, forces reconsideration of **Gate 3 Focus** towards Shame-Leaning *with intense support/pathway* or **ESCALATE** (if behavior is reckless/harmful).
  *   **Feels Nothing/No Remorse:** Assess for **Avoidance Signals** (defensiveness, blaming). Lack of visible emotion isn't diagnostic. Focus on **behavioral history** (Gate 1 - Knowing bypass?; Gate 4 - Pattern of no remediation? Avoidance?). If persistent unsafe behavior despite interventions, **ESCALATE**.
  *   **Hospital vs. Clinician Good:** The procedure predicts *clinician* response. If institutional needs (reputation, liability) conflict (e.g., needing to publicly sanction a well-liked clinician for deterrence), this is flagged as requiring **Human Judgment** at the leadership level. The procedure informs but doesn't resolve this conflict.

  ---

  **Summary:** This procedure is a behavior-prediction tool based on controllables (privacy, focus, ID) and observables (bypass, avoidance signals, relationship), using guilt/shame-leaning as predictors of accountability (remediation) vs. avoidance. It mandates escalation for knowing bypass or severe avoidance, prescribes structural focus for transients, and requires human judgment for choosing message focus in persistent cases and managing institutional conflicts. It cannot guarantee behavior change in deeply entrenched patterns, resolve fundamental institutional hypocrisy, or function without timely, consistent application and leadership backing for escalation decisions.
