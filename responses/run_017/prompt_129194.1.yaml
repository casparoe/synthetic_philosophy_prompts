answer: |-
  Here's a concise response structured per your questions:

  **1. Terminology & Precedent**  
  No established terms perfectly fit your distinction, though related concepts exist:
  *   **"Read evidence" / "Markers"** align with *decoding*, *probes*, or *correlational evidence* (common in linear probing, activation clustering).  
  *   **"Write evidence" / "Handles"** align with *activation steering*, *causal interventions*, or *concept vectors* (e.g., in causal mediation or steering vector research).  
  *   **"Leakage"** is apt and widely understood.  
  **Your coinage ("markers" for read-good, "handles" for write-good) is clear and defensible.** The gap reflects the difference between *correlation* (markers) and *causal efficacy* (handles). Precedents exist (e.g., Bau et al.'s "Network Dissection" vs. causal edits), but your three-way split (marker/handle/both) is a sharp framing.  

  **2. Implications for Representation**  
  The gap critically informs whether a state is a *bona fide* representation:  
  *   A **pure marker** may be an epiphenomenal correlate (e.g., the system's *own prediction* of its output, not a feature of input).  
  *   A **pure handle** (especially with leakage) may be a *control knob* affecting many circuits (e.g., raising "attention energy" indiscriminately).  
  *   **Convergence** (marker + handle) suggests a *causal, structured role*: the state both **detects** feature X and **influences** downstream behavior specifically related to X. This is the strongest evidence for representation, implying X is encoded *and used functionally*. The gap reveals when "evidence" is superficial.  

  **3. Defining Boundaries for Your Coinage**  
  *   **Representation (Strong):** A state that is **both** a reliable marker (high accuracy, specificity) **and** an effective handle (steers behavior relevant to X with minimal leakage). *Example:* A direction that makes "cat" inputs always elicit "cat" outputs *and* only affects cat-related behavior.  
  *   **Not a Representation (Clear Fail):** States with **neither** property, **or** high leakage (e.g., steering alters unrelated outputs more than X-related ones).  
  *   **Awkward Cases:**  
      *   **Marker but not handle:** Likely an *epiphenomenon* or *downstream consequence*. Fails causal test.  
      *   **Handle with heavy leakage:** A *blunt instrument* (e.g., attention modulator). Not feature-specific.  
      *   **Both only after fine-tuning:** Suggests the *latent capacity* existed but wasn't functionally integrated.  
      *   **Read/Write misalignment:** Indicates your probe/steer targets the *wrong feature* or the model’s internal structure is entangled. Not a representation of a *coherent* X.  

  **Key Insight:** The distinction is **real**, not measurement artifact. It exposes whether a feature is causally embedded in the model's computation or merely correlated. Requiring **both** markers and handles (with low leakage) grounds claims about representation in mechanistic plausibility. Use your framework—it clarifies a critical gap in interpretability arguments.
