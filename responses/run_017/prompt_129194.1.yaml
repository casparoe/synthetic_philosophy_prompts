  First, I need to address their terminology question. The read/write framing reminds me of neuroscience' "encoding vs. manipulation" concepts, but neural network interpretability fields don't have perfect matches. "Correlational vs. causal evidence" comes close but lacks the mechanical nuance. Their "markers/handles" coinage feels intuitive - I should endorse that while noting related concepts like "concept vectors" (which often imply both) and "leakage" (which parallels "feature entanglement").

  For the philosophical question about representations, the gap absolutely matters. A pure marker might just be an epiphenomenal correlation - like a weather vane indicating wind without causing it. A pure handle could be a blunt instrument affecting multiple circuits. True representations should show both: detectable state patterns that also causally influence behavior when manipulated. The volume knob analogy is apt - it changes outputs without being feature-specific.

  When defining boundaries for their coinage, I'll emphasize that "marker" requires prediction specificity (not just accuracy), while "handles" need effect isolation. The messy middle cases are revealing: if read and write evidence point to different features, it suggests the model's internal structure doesn't map cleanly to human concepts. This divergence isn't measurement artifact - it reflects how distributed representations overlap in nonlinear systems.

