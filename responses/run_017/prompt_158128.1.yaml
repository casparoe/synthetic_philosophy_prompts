prompt: |-
  I write the interpretive text for the natural history galleries of a medium-sized regional museum. That means roughly forty object labels a year, sixty words or fewer each, every one of them signed off by our curator of geology, who has no training in evolutionary biology and who is, on principle, hostile to any sentence that sounds hedged. The labels are permanent, they are read by around two hundred thousand people a year, and our funders particularly like the panels that say what a trait is *for*. A complaint from a visiting evolutionary biologist — that a good half of our why-it-evolved panels were speculative stories dressed up as findings — has been upheld by the director, and I have been asked to produce a written procedure that my team can run on any proposed trait-and-function claim before it goes into a label.

  Please write that procedure for me. What I need is something runnable in about fifteen minutes per label by someone with school-level biology, working from whatever brief accompanies the specimen: a sequence of questions asked in a fixed order, what counts as an acceptable answer to each, the points at which the procedure stops and returns not established, and the points at which it stops and hands the decision to a person because the question has become one of values rather than fact.

  The conceptual material I want it answerable to is the critique of the adaptationist programme associated with Gould and Lewontin's spandrels paper — not as a slogan I can cite, but as something that changes what ends up on the wall. Specifically, I want it to do the following.

  Interrogate the individuation of the trait before anything else. Most of our bad panels, I think, fail here: the trait is picked out by the very effect it is supposed to explain, so the claim cannot be tested and cannot fail. Give me a question that catches this, phrased so that a non-specialist can apply it, and say what we do with a proposal whose trait dissolves under it.

  Make the alternatives explicit and symmetric. A proposal should not be accepted unless at least one non-adaptive alternative has been stated with comparable specificity: an architecturally necessary by-product of some other feature, the co-option of an existing structure for a new function, inheritance from an ancestor with no current function, a developmental or allometric consequence of body size or growth pattern, drift, or the possibility that the trait has no non-arbitrary boundaries at all. Give me this as a menu with a rule for how many alternatives must be written down and how specific they must be.

  Grade the kinds of evidence that can discriminate between them, and say what each kind can and cannot establish: correlation between independent origins of the trait and the supposed selective regime across related lineages, experimental manipulation of the trait or of the environment, direct measurement of selection in the field, and fit to an engineering or optimality model. Include what to do when the brief contains none of these and only reports what a handbook says.

  Separate three claims that our current labels all collapse into one: that the trait originated by selection for function F, that it is currently maintained by selection for F, and that it is currently useful for F although it arose for some other reason or for no reason at all. Each should license a different wording, and I want the wording rule stated, together with two or three model sentences of agnostic copy that my curator will actually pass.

  Operate inside sixty words. Where the honest verdict is that we do not know, tell me what the label should say instead of the explanation it cannot give.

  Include a check on the set as well as on the item. Individually defensible labels can still add up to a gallery that presents organisms as collections of optimally engineered devices, and that is the substance of the complaint against us. Give me a way to audit a batch of labels: how to sample or count them, what pattern triggers a revision, and what the revision consists of.

  Mark clearly what the curator is being asked to certify at each kind of outcome, and where the procedure must stop because the question has stopped being factual — in particular where the risk of overclaiming to a quarter of a million visitors has to be weighed against the cost of a hedge that nobody reads.

  Then run the procedure on three proposals. First, a label on the dark form of the peppered moth saying it evolved to match soot-blackened bark, with a brief noting that dark forms appeared independently in many industrial regions. Second, a label on the human chin, with two competing briefs: one saying it evolved to withstand the mechanical stresses of chewing, one saying it evolved as a signal in mate choice. Third, the case I will not like: our most successful temporary format, a Survival gallery of twenty-five specimens in which each one gets a why-it-evolved panel, researched to the standard of a popular science book and much loved by the funders. Apply the procedure to the format as a whole and tell me what it does to it.

  Finally, say honestly what the procedure cannot do: the cases where the underlying biology is unsettled in ways a fifteen-minute check will never reach, and the whole regions of our collection — early hominins, deep time, behaviour that leaves no fossil trace — where the procedure will systematically return not established and the gallery will end up saying nothing at all.

  Do not give me references, citations or a reading list; my team has no library access and cannot follow them up, and the specimen brief is all we will ever have. Please write the whole answer in British English.
reasoning: |-
  Okay, the user is a museum writer who needs a procedure to vet evolutionary claims in exhibit labels. They're dealing with a curator hostile to hedging and funders who love adaptive explanations. The core tension is scientific accuracy versus accessibility.

  Hmm... the key requirements are: a 15-minute checklist for non-experts, based on Gould/Lewontin's critique but practical. Must handle trait individuation, alternative explanations, evidence grading, and wording distinctions. Also needs batch auditing for systemic bias.

  First, the trait individuation trap. Need a question that prevents circular definitions - like "wings are for flying." Should force physical description separate from function. If trait dissolves, label shifts to description-only.

  For alternatives... must list at least one non-adaptive explanation with equal specificity. Menu should include spandrels, exaptation, drift etc. No lazy "maybe drift" - require concrete examples.

  Evidence hierarchy is tricky. Correlational data weakest, experimental strongest. When only handbook claims exist, label can't make origin assertions. Important to separate "evolved for" vs "now useful for" in wording.

  Batch auditing is smart. Random sample check: if >30% make strong adaptation claims without alternatives, whole gallery needs revision. Survival exhibition would fail this hard.

  Three test cases: Peppered moth passes with correlation evidence. Human chin fails - no consensus. Survival gallery collapses under its own premise.

  Biggest limitation: paleontology and behavior will get "unknown" verdicts often. But that's honest - better empty than wrong for 200k visitors.

  The curator's dilemma: factual certification vs overclaim risk. Procedure must flag where "not established" requires their value judgment on public communication trade-offs.

  British English throughout. No citations - practical toolkit only.
answer: |-
  Here is a procedure designed for your team, incorporating the specified requirements and conceptual framework, written in British English.

  **Procedure: Evaluating Trait-and-Function Claims for Exhibit Labels**

  **Purpose:** To rigorously evaluate proposed statements about the evolutionary origin, maintenance, or current utility of biological traits for museum labels, ensuring scientific accuracy and avoiding unsupported adaptationist narratives.

  **Who:** Team member with school-level biology, using the specimen brief provided. Time limit: approx. 15 minutes per label.

  **Steps (Run in Order):**

  1.  **Define the Trait Precisely:**
      *   **Question:** "Can the physical trait be described clearly and specifically *without* mentioning the proposed function, selective pressure, or benefit? (e.g., 'the shape of the jawbone projecting forward below the teeth', *not* 'a chin for resisting stress')."
      *   **Acceptable Answer:** Yes, with a clear, observable, anatomical description independent of function.
      *   **Unacceptable:** No. The description inherently includes the function (e.g., "camouflage colouration", "chewing structure").
      *   **Outcome - Not Established:** If unacceptable. **Label Action:** Describe the physical trait only (e.g., "This moth has dark wings", "The lower jaw projects forward here"). *Do not propose an evolutionary 'why'*. **Curator Certification:** Certifies the trait description is accurate and non-functional.

  2.  **State Non-Adaptive Alternatives Symmetrically:**
      *   **Requirement:** For the proposed adaptive explanation (e.g., "Trait X evolved for Function Y due to Selection Pressure Z"), write down at least ONE non-adaptive alternative explanation with comparable specificity. Choose from:
          *   **Architectural Constraint/Spandrel:** A necessary by-product of growth/development or another trait (e.g., "Side-effect of jawbone growth patterns").
          *   **Exaptation:** Co-option of an existing structure for a *new* function (e.g., "Bone shape inherited from ancestors but now possibly used for...").
          *   **Phylogenetic Inertia:** Trait inherited unchanged from an ancestor, no current function (e.g., "Vestigial structure, possibly functional in ancestors").
          *   **Developmental/Allometric Constraint:** Consequence of body size, growth rate, or developmental pathways (e.g., "Scaling effect of larger brain size").
          *   **Drift:** Random fixation in small populations (e.g., "Possibly fixed by chance in isolated groups").
          *   **Non-Arbitrary Boundary Issue:** The trait isn't a distinct unit (e.g., "This feature grades continuously with neighbouring structures").
      *   **Rule:** The alternative must be *as specific* as the adaptive proposal regarding the trait and mechanism/process. "Maybe drift" is insufficient; "Possible fixation by genetic drift during population bottlenecks" is acceptable.
      *   **Outcome - Not Established:** If no specific non-adaptive alternative can be formulated based on the brief or basic knowledge. **Label Action:** Cannot make a claim about evolutionary origin/maintenance. See Step 5 for wording options. **Curator Certification:** N/A at this step for factual claims; moves to Step 5 wording.

  3.  **Assess Evidence & Discriminating Power:**
      *   **Question:** "What kind of evidence supports the adaptive explanation *over* the stated alternatives? What are its limitations?" Consult the brief.
      *   **Evidence Hierarchy & Limitations:**
          *   **Correlation (Weak):** Trait and proposed selective regime correlate across independent lineages/events (e.g., dark moths appear where trees are sooty). *Cannot prove causation or rule out shared constraint.*
          *   **Optimality/Engineering Model (Weak-Moderate):** Trait performs function well in model. *Cannot prove it evolved *for* that function; might be exaptation; ignores constraints.*
          *   **Direct Measurement (Moderate-Strong):** Field studies show current selection *for* the trait linked to function (e.g., predation rates differ by colour). *Shows current maintenance, not necessarily origin.*
          *   **Experimental Manipulation (Strong):** Altering trait or environment changes fitness (e.g., painting moths, altering bark). *Strong evidence for current utility/maintenance; less direct for deep historical origin.*
          *   **Handbook Statement (Weak):** Secondary source assertion. *Not primary evidence; provides no power to discriminate.*
      *   **Outcome - Not Established:** If the *only* evidence is a handbook statement, an optimality model, or weak correlation that doesn't clearly discriminate against plausible alternatives. **Label Action:** Cannot make strong origin claim. See Step 5. **Curator Certification:** Certifies the evidence cited is accurately represented from the brief (if any).

  4.  **Specify the Claim Type & Wording Rule:**
      *   **Question:** "Which specific claim does the evidence *actually* support? (A) The trait *originated* due to selection for Function F? (B) Selection for F *currently maintains* the trait? (C) The trait is *currently useful* for F (regardless of origin)?"
      *   **Wording Rule:**
          *   **(A) Origin:** Only if Step 3 provides strong evidence linking trait origin *specifically* to F (rare, e.g., compelling experimental/manipulation evidence across lineages). **Wording:** "This trait *evolved* [brief description of selective mechanism] *for* [Function F]."
          *   **(B) Current Maintenance:** If Step 3 provides direct measurement or strong experimental evidence. **Wording:** "This trait *is maintained* by natural selection *for* [Function F]."
          *   **(C) Current Utility:** If trait clearly performs F effectively now, but evidence for origin/maintenance is weak or absent. **Wording:** "This trait *aids in* [Function F]" or "This trait *functions in* [Function F]", *avoiding* "evolved", "selected for", "adapted".
      *   **Outcome - Not Established:** If evidence doesn't strongly support B or C. **Label Action:** Use agnostic wording from Step 5. **Curator Certification:** Certifies the wording matches the claim type justified by evidence.

  5.  **Agnostic Wording & Word Limit (60 words):**
      *   **Rule:** If any step returns "Not Established" for a functional/evolutionary claim, or only claim (C) is supported, use descriptive or agnostic wording. Focus on structure, development, or observed *current* use *without* implying evolutionary purpose.
      *   **Model Sentences:**
          *   "This structure, formed during jaw development, projects below the teeth."
          *   "The dark colouration provides camouflage against dark backgrounds in its habitat."
          *   "This feature may assist in [specific behaviour], though its evolutionary history is complex."
          *   "Scientists debate the evolutionary origins of this trait."
      *   **Outcome:** Final label text must be <=60 words. **Curator Certification:** Certifies final text is within word limit and adheres to the outcome of the procedure. **Value Judgment Point:** If the procedure requires "Not Established" wording but the curator insists on stronger claims due to funders/accessibility, this is a *values-based decision* (science communication vs. risk of overclaim). The procedure stops; the curator must explicitly overrule based on non-scientific grounds, accepting the risk.

  6.  **Batch Audit (For a Gallery/Section like "Survival"):**
      *   **Method:** Randomly select 10 labels (or 40% if fewer than 25) making trait-and-function claims. Apply Steps 1-5.
      *   **Trigger for Revision:** If >30% of sampled labels making claims would result in "Not Established" or require significant weakening of claim type (e.g., Origin -> Current Utility) under this procedure.
      *   **Revision:** Re-evaluate *all* labels in the section using this procedure. Replace unjustified "why evolved" claims with descriptive/agnostic text (Step 5). Consider reframing the gallery theme if overclaiming is systemic.

  **Procedure Test on Proposals:**

  1.  **Peppered Moth (Dark Form - Evolved to Match Soot):**
      *   **Step 1:** Pass. Trait: "Dark wing colouration" (defined physically).
      *   **Step 2:** Alternative: "Possible side-effect of melanin production pathways under pollution stress?" (Specific constraint). Pass.
      *   **Step 3:** Evidence: Correlation (independent origins in industrial areas). Weak, but discriminating: dark moths survive better *on* sooty trees. Direct measurement/experiments (bird predation studies) support *current utility/maintenance*.
      *   **Step 4:** Evidence supports (B) Current Maintenance & (C) Current Utility. Does *not* strongly prove (A) Origin (initial mutation cause?).
      *   **Step 5:** **Agnostic Wording Suggestion:** "In industrial areas, the dark form became common. Experiments show its colour provides camouflage against soot-darkened tree bark, reducing bird predation." (Focus on current utility/observed outcome).
      *   **Outcome:** Can state current utility/maintenance. Avoid "evolved to match".

  2.  **Human Chin (Brief 1: Withstand Chewing Stresses):**
      *   **Step 1:** Pass. Trait: "The forward-projecting bony prominence at the bottom of the lower jaw".
      *   **Step 2:** Alternatives: "Architectural spandrel: side-effect of jawbone shrinking/reorganisation during evolution" / "Exaptation: existing bone shape co-opted for social signalling" / "Developmental constraint: consequence of facial growth patterns". Pass.
      *   **Step 3:** Evidence (Brief 1): Likely optimality model (engineering analysis showing stress resistance). Weak evidence; doesn't discriminate against alternatives.
      *   **Step 4:** Evidence insufficient for (A) Origin or (B) Maintenance. Supports (C) *Potential* utility if model is accurate, but not proven.
      *   **Step 5:** **Agnostic Wording:** "The chin's shape may help withstand chewing forces. However, its evolutionary origins are debated; it might be a structural by-product of other jaw changes." **Outcome:** "Not Established" for evolutionary origin claim. Weaken to current utility *with caveat*.
      *   **(Brief 2: Mate Choice Signal):** Steps 1-2 same. Step 3: Likely weaker evidence (correlation/subjective assessment). Step 4-5: Same outcome - "Not Established" for origin. Wording: "Some researchers suggest the chin's shape plays a role in social perception or mate choice, but its evolutionary function remains uncertain."

  3.  **Survival Gallery (25 "Why-It-Evolved" Panels):**
      *   **Batch Audit:** Apply Steps 1-5 to a sample (e.g., 10 panels).
      *   **Likely Findings:** Many traits will fail Step 1 (vague/functional definition) or Step 2 (no specific alternatives considered). Evidence (Step 3) will often be handbook-level, correlation, or optimality models. Few will have strong evidence for (A) Origin claims.
      *   **Trigger:** >30% (likely >>30%) would be "Not Established" or require claim downgrade.
      *   **Revision:** The entire "Why-It-Evolved" premise is flawed. Most panels would need rewriting to focus on description, current ecology/behaviour (if observable), or agnostic statements about *possible* function/utility with caveats (Step 5 wording). The gallery theme needs reframing away from "Survival of the Fittest Device" to "Diversity and its Challenges" or similar.

  **What the Procedure Cannot Do:**

  1.  **Resolve Deep Scientific Uncertainty:** It flags "Not Established" but cannot adjudicate complex, active debates within the 15-minute limit (e.g., exact selection pressures on hominin brain size).
  2.  **Generate New Evidence:** It relies entirely on the specimen brief. If the brief lacks key evidence or context, the outcome is "Not Established".
  3.  **Handle Poorly Understood Systems Systematically:** For regions like:
      *   **Early Hominins:** Fossil evidence is sparse; inferences about behaviour/soft tissue traits are highly speculative. Procedure will frequently return "Not Established".
      *   **Deep Time (e.g., Ediacaran biota):** Trait homology, function, and selective regimes are often fundamentally unknowable. "Not Established" will be the norm.
      *   **Behaviour (No Fossil Trace):** Reconstructing the evolution of specific behaviours (beyond broad correlates like tooth wear) is extremely difficult without direct observation. "Not Established" likely.
  4.  **Force Engagement with Nuance:** It ensures alternatives are *considered*, but cannot guarantee visitors grasp the complexity. The curator's value judgment on Step 5 wording remains crucial for balancing accuracy and engagement.
  5.  **Eliminate All Adaptationist Language:** It constrains and qualifies it, but justified claims about current maintenance/utility (Steps 4C/B) are permitted. The batch audit mitigates systemic bias.
