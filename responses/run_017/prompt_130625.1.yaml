  Hmm. The core of my position must remain unshaken: relativity already dissolved the objective "now," and CTCs—however inaccessible—prove becoming isn't fundamental. I recall how Einstein and I discussed this; he disliked the implication but conceded the mathematics. The user's "lumpy" universe changes nothing. If the field equations permit CTCs (even patchy, drifting ones), then globally, time *must* lack intrinsic directionality. Their "no signaling" objection misses the point: physics isn't about what's *practical* but what's *possible* in the geometry. 

  Ah, but they push further—is this just about equations permitting pathologies? No. The equations *are* the ontology; they reveal time's true nature. If CTCs exist mathematically, then change is idealist, not realist. That my solution requires fine-tuning is irrelevant; what matters is that general relativity *allows* such worlds. To demand CTCs be traversable or symmetric would be like demanding only visible electromagnetic fields are "real." 

  ...Still, I should concede observational facts gracefully. Our universe shows no rotation, true. But the user's hypothetical forces them to confront relativity's implications: if CTCs exist *anywhere* in the solution space, objective becoming vanishes. Their attempt to shield temporality by making CTCs astronomically large or non-traversable is like locking a door but admitting the key exists. The damage is done. 

  I’ll structure the reply as a firm but polite letter, stressing that CTCs—regardless of accessibility—expose time’s unreality. Must avoid modern jargon; stick to my era’s concepts. And no bullets or headings—continuous prose, as requested. The tone should be precise, slightly resigned ("Alas, my friend..."), echoing my actual correspondence with Einstein. 

  *sharpens pencil* Let’s begin.
answer: |-
  My dear colleague,  

  Alas, your hypothetical universe, though diverging from my own solution in its asymmetry and expansion, still bears the fatal imprint of closed timelike curves—and thus confirms my contention about the ideality of time. You concede these curves exist in the geometry itself, however grand in scale or inaccessible to signals. This is sufficient. Relativity teaches us that spacetime geometry is not a stage upon which events unfold but the very substance of physical reality. If the equations permit a worldline to return to its own past—*even if no particle ever traverses it*—then the universe admits, in its fundamental structure, a topology where "before" and "after" lose absolute meaning. How, then, can we speak of an objective "flow" of time or a global "becoming"? The mere mathematical existence of such paths demonstrates that temporal order is not intrinsic but relational and contingent.  

  You suggest my argument might collapse if detached from the specific symmetries of my rotating dust solution. Not so. What matters is not the precise distribution of matter—whether homogeneous or lumpy, static or expanding—but the causal structure encoded in the field equations. If your cosmos, with its drifting axes and inhomogeneities, still harbors CTCs, then relativity itself, through its geometric nature, annihilates the illusion of universal passage. The objection that these curves are astronomically vast or dynamically irrelevant to local observers is a practical evasion, not a refutation. Physics concerns what *is* possible in the geometry, not merely what is measurable by finite beings. That our own universe manifests no rotation is observationally true, but irrelevant to the ontological point: if Einstein’s theory allows worlds without objective becoming (as it does), then time, as commonly conceived, cannot be real. Change is a persistent illusion, a shadow cast by our incomplete perspective.  

  Yours in the pursuit of truth,  
  K. Gödel
