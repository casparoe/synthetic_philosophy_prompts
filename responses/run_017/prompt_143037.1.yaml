prompt: |-
  I am a graduate TA in a first-year survey of modern moral philosophy, and I have one fifty-minute section in which to do justice to Adam Smith's machinery of sympathy and of the impartial spectator. The students will have read Part I of The Theory of Moral Sentiments (the material on sympathy, on the concord of sentiments, and on the degrees of passion that spectators can go along with) and the opening of Part III, where the spectator turns inward; they will not have read Part II on merit and demerit, nor Part V on custom and fashion. They have read no Kant. Their only prior contact with Smith is the invisible hand and the claim that we get our dinner from the self-interest of the butcher and the brewer. I have the theory reasonably well in hand, so please do not explain Smith to me: what I want is a plan for teaching him, and I want it in 600 words or fewer — a tight spine with reasons attached is worth more to me than a full lesson script.

  What I am after is the dependency structure: what must be in place before what, and why. My provisional spine is to present sympathy first as a mechanism rather than a virtue — the claim that I come to feel with you by imagining myself into your situation, not by catching an emotion from you — then to generate propriety out of the mismatch cases, the passions a spectator cannot enter into, rather than out of any rule, and only then to move the spectator inside the agent and treat conscience as the verdict of that inner tribunal. Two placement questions I cannot settle alone. First: where should the spectator's two verdicts be split apart — whether the passion is proportionate to its cause, versus whether the passion is owed to the person it is aimed at, the propriety side and the merit side, the second of which is not in their reading? Second: where in the hour should I make the move from what the people around me actually approve to what an impartial spectator would approve, given that the students will supply that move on their own and get it wrong?

  I have been turning over two further things. One is a pair of readings of the inner spectator that I want adjudicated as a teaching decision: the surrogate reading, on which he is simply my representation of the people who actually watch me and whose approval I need, and the fixed-point reading, on which he is the standpoint you arrive at by repeatedly correcting for the partiality, ignorance and interestedness of actual spectators. The second reading seems to me to be what makes the account moral rather than sociological, but I suspect that opening with it will make the students think I have smuggled in a universal rational agent from somewhere else. Should one of them anchor the session and the other be demoted, and if so which, and where does the demoted one belong? The other is the calibration worry: if the inner spectator is assembled out of internalised actual spectators, and those spectators are as partial as I am, then what does the correction push off from? I can either spring this at the end as my diagnostic, or defuse it in passing, and I cannot tell which does less damage.

  I also need one example to carry the whole fifty minutes, and I would like you to say what it must contain and what it must not. It has to let the students feel the difference between failing to enter into someone's passion and judging that their passion is aimed at the wrong person, and it has to leave room for the thought that the bystanders' actual reaction is not itself the verdict. I assume it should not involve death or bereavement, since that will make them hear sympathy as pity and miss that Smith's mechanism ranges over any passion whatever; I assume too that its outcome must not be settled by a rule they already accept. What other properties must it have, and what must it avoid?

  The misconceptions I expect, roughly in the order in which I expect them, are these: sympathy as compassion or as altruism; the inner spectator as conscience internalised from social approval, the reading that quietly turns the whole account into sociology; "impartial" as meaning abstract or universal in the way a law is; and, late, the relativist objection that if the standard is what spectators approve, no entire society can be wrong. Tell me where each must be headed off and, where you can, what has to be established before the correction will take. Tell me as well what I should openly decline to cover in fifty minutes and say out loud that I am declining — I would rather name the omission than botch it. Close with a single question I can put to the room at the end that would show me they have the machinery rather than the vocabulary.
reasoning: |-
  Okay, the user is a graduate TA preparing a fifty-minute section on Adam Smith's sympathy and impartial spectator. They've outlined a clear structure but have specific placement questions and concerns about misconceptions. Let me break down their needs.

  First, they want a tight teaching plan focusing on dependency: what concepts must precede others. Their provisional spine starts with sympathy as a mechanism, then propriety from mismatch cases, then the inner spectator. Two key placement issues: where to split the spectator's two verdicts (propriety vs. merit), and when to transition from actual to impartial spectators. Since the students haven't read Part II on merit, it's crucial to avoid introducing it here. The merit aspect should be excluded to prevent confusion. The shift to impartiality should happen early when discussing concord, using mismatch cases to show why actual approval isn't sufficient.

  They also have concerns about interpreting the inner spectator—surrogate vs. fixed-point readings. The fixed-point reading is essential for the moral dimension but might seem like smuggling in a rational agent. Starting with the surrogate reading makes sense as it's more intuitive, then building to the fixed-point during the inward move. This progression anchors the session in relatable experience before elevating to moral judgment.

  The calibration worry—how correction works if internalized spectators are partial—should be defused when introducing the fixed-point. Using the grief example, where bystanders' limitations necessitate an impartial perspective, can show the iterative process naturally.

  For the example, they need one that avoids death/bereavement, distinguishes failed sympathy from misdirected passion, and allows critique of actual reactions. A professional rivalry scenario fits: someone overlooked for promotion. It demonstrates sympathy mechanics, propriety via mismatched intensity, and impartiality by showing how personal biases affect actual spectators.

  Addressing misconceptions in order: 
  1. Sympathy as compassion: correct immediately when defining the mechanism. 
  2. Inner spectator as internalized approval: clarify during the inward move by contrasting actual vs. impartial. 
  3. "Impartial" as abstract: specify it's situational, not universal. 
  4. Relativist objection: handle late with the fixed-point explanation.

  Omissions to state upfront: merit/demerit, custom/fashion, Kantian comparisons. End with a diagnostic question: "Why might the overlooked employee's intense anger still fail the impartial spectator test even after we sympathize?" This checks if they grasp propriety and correction beyond actual reactions.

  The plan must be concise, example-driven, and strategically structured to build concepts step-by-step while preempting errors. Timing each phase is critical to cover all essentials in fifty minutes.
answer: |-
  Here's a spine prioritizing dependency, misconceptions, and your core concerns, targeting 50 minutes:

  **Core Structure & Timing:**

  1.  **Sympathy as Mechanism (10 min):**
      *   **Start:** Define Smithian sympathy: *not* compassion, but *any* passion shared via **imaginative projection** into another's situation ("How would *I* feel?"). Contrast with emotional contagion.
      *   **Key:** Use your **example** immediately (e.g., *A colleague overlooked for promotion*). Ask: "Can you *feel* their anger? How?" Force focus on reconstructing the *situation* causing the passion.
      *   **Why first?** Foundation. Must be clear before discussing *judgment*.

  2.  **Propriety from Concord & Mismatch (15 min):**
      *   **Move:** Concord = Mutual sympathy (spectator feels *with* agent). **But:** Highlight mismatch cases using your example: *Spectator imagines the situation but feels less anger than the agent.*
      *   **Generate Propriety:** This mismatch is the origin of the judgment of **impropriety**. The passion is *disproportionate to its cause* (as imagined by spectator). Propriety = passion aligns with spectator's imagined feeling based on cause.
      *   **Placement of Verdict Split:** **Explicitly MERGE propriety/merit.** Say: "For *now*, Smith is focused *only* on whether the passion fits its cause (propriety). We *won't* cover his separate idea (merit/demerit) about whether the passion is *aimed rightly at a person* because it's not in your reading." Anchor propriety firmly here.
      *   **Why here?** Propriety arises *directly* from the sympathy mechanism failing. Avoids rules.

  3.  **The Move Inward & Actual vs. Impartial Spectator (15 min):**
      *   **Pivot:** Ask: "But who *is* this spectator judging propriety?" Initially, it's real people around us. We crave *their* concord. This is the **Surrogate Reading** (internalized actual spectators). Acknowledge its power.
      *   **Introduce Impartiality:** Use a **mismatch flaw** in actual spectators: *What if the bystanders are rivals of the overlooked colleague? Or the boss's friends?* Their sympathy/judgment is clouded (partial, ignorant, self-interested).
      *   **Fixed-Point Reading:** We therefore **correct** for these flaws. We imagine "What would a *well-informed, disinterested* bystander feel?" This imagined **Impartial Spectator (IS)** is the **fixed point** we converge on through iterative correction.
      *   **Calibration Worry - Defuse:** "But how do we *start* correcting? We use the *idea* of impartiality present even in flawed spectators and push towards consistency. We ask 'Would *all* informed, disinterested people see it this way?' It's a dynamic standard, not a perfect God's-eye view."
      *   **Why here & Fixed-Point?** The flaw in actual spectators *necessitates* the impartial move. Start with surrogate for intuitiveness, then **demote it** by exposing its flaws. Fixed-point is the core *moral* innovation. Defuse calibration *during* the explanation.

  4.  **Conscience as the Inner Tribunal (5 min):**
      *   **Final Move:** "We internalize *this* process. Conscience is the agent *themselves* asking: 'What *would* that Impartial Spectator approve?'" It's the IS *inside* us, judging our own passions/actions.
      *   **Why last?** Depends entirely on understanding sympathy, propriety via mismatch, and the *need* for impartiality.

  5.  **Diagnostic Question & Wrap-Up (5 min):**
      *   **Question:** "Using Smith's terms: Why might the overlooked colleague's intense anger *still* fail the Impartial Spectator test *even after* we successfully sympathize and understand *why* they feel it?"
      *   **Answer Target:** Because propriety (passion proportionate to cause) is judged *by the IS*, not just by successful imaginative entry. The passion might be excessive *relative to the cause* even if understandable.
      *   **State Omissions:** "We *haven't* covered merit/demerit (judging the *target* of passion), custom/fashion's influence, or Smith vs. Kant. Today was about sympathy's mechanics, propriety, and the birth of conscience from the Impartial Spectator."

  **The Example: Must-Haves & Must-Not's**
  *   **Must:** Professional rivalry, betrayal, or ambition (e.g., *person overlooked for promotion they felt was deserved due to specific efforts/broken promises*).
  *   **Must Contain:**
      1.  A clear *situation* causing passion (for imaginative projection).
      2.  Potential for *excessive intensity* relative to cause (for propriety mismatch).
      3.  Bystanders with *conflicting biases* (e.g., rivals, friends of the boss, uninformed colleagues - to show flaws in actual spectators).
      4.  Passion *aimed* at someone (e.g., boss, successful colleague) to *hint* at merit without exploring it.
  *   **Must Avoid:**
      *   Bereavement/death (avoids pity conflation).
      *   Obvious moral rules (e.g., theft).
      *   Situations where "right" is purely subjective (needs plausible *disproportion*).

  **Misconception Management:**

  1.  **Sympathy = Compassion:** Correct **immediately** in Step 1. Emphasize mechanism over specific emotion. "It's about *anger* here, not pity."
  2.  **Inner Spectator = Internalized Social Approval:** **Preempt in Step 3.** Contrast Surrogate (actual) vs. Fixed-Point (IS) *explicitly* when moving inward. Frame conscience as judging *against* flawed social approval via the IS.
  3.  **"Impartial" = Abstract/Universal Law:** **Clarify during Fixed-Point intro (Step 3).** Stress the IS is *situated* (informed about *this* case) but *disinterested*. It's not a Kantian lawgiver, but a "reasonable person" standard for *this* context.
  4.  **Relativist Objection (Society Can't Be Wrong):** **Address late in Step 3/Fixed-Point.** The *process* of correction *towards* impartiality is how a society *can* be critically examined *by its own members*. The IS is the standard *within* the mechanism, not defined *by* any single society.

  **Diagnostic Closing Question:**
  "Using Smith's terms: Why might the overlooked colleague's intense anger *still* fail the Impartial Spectator test *even after* we successfully sympathize and understand *why* they feel it?" (Tests grasp of propriety vs. mere sympathy, and the IS as judge).
