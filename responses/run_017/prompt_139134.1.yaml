prompt: |-
  I have recently been co-opted onto the Medals Committee of a learned society, and I find the exercise more interesting than I expected, so I should like your help with a case that comes before us next month. Our remit, as the statutes have it, is to reward "distinguished conduct beyond the call of ordinary obligation". What turns on our decision is small: a medal is struck, and a name is read out at the anniversary dinner. That is all.

  The trouble is that our precedents will not settle the new case, and I want to know what principle we should take ourselves to be applying before we walk into the room. Here is the run of decisions I have been able to reconstruct from the minutes, with the grounds recorded in them:

  1. A man who found a wallet containing £380 in cash, went somewhat out of his way, and returned it intact. No medal: "ordinary decency".
  2. An off-duty consultant physician who gave emergency CPR to a stranger collapsing in a railway station, successfully. No medal: "any competent bystander with her training would have done the same, and the cost to her was negligible".
  3. A woman who made an anonymous, non-directed kidney donation to a stranger. Medal awarded.
  4. A man who gave roughly a third of his income to famine relief for fifteen years. Medal awarded on a split vote; the dissent minuted that "if that is genuinely what beneficence requires, we do not strike medals for doing one's duty".
  5. An off-duty firefighter who entered a burning house and carried out a neighbour's child. No medal: "his training and equipment made this what his occupation prepares him for". Dissent: he was off duty and under no obligation to intervene.
  6. A finance officer who leaked evidence of systematic fraud to the regulator, was dismissed, and never worked in the sector again; the fraud was in any case uncovered by a routine audit nine months later. Medal awarded. One member is recorded as having argued explicitly that the point of the award was to encourage others in that position, and not merely to mark what he deserved.
  7. A young woman who, after her parents died, cared full-time for four years for her severely disabled younger brother, giving up a university place. She said she did it because there was nobody else and she could not have lived with herself otherwise. No medal: "she describes herself as having had no alternative".
  8. A soldier who threw himself on a live grenade to shield others and was killed. Posthumous medal, unanimous, though one member observed that the services have their own gallantry awards.

  The new case: because of a gap in the regulatory framework, Dr Ruth Adeyemi was, at the material time, the only person in the country both licensed and competent to certify the cold-chain protocol for a vaccine. Without certification the vaccine could not be distributed, and the Ministry's own estimate was that the resulting delay would cost some two thousand children's lives over the following two years. A specialist from abroad could in principle have been brought in, but not for fourteen months. She did the work unpaid over nine months — some seven hundred hours — and in order to do it she had to relinquish a research fellowship abroad that she had already been awarded. Her own account is that someone had to do it and that she could not have lived with herself otherwise. She has since declined all publicity and asked not to be named in any announcement.

  I am less interested in being told what we should morally conclude about Dr Adeyemi than in the structure of the problem. Please do the following: set out the two or three rules that fit the whole run of our precedents about equally well, and say what each of them predicts here; give me your best guess as to what the Committee will in fact do, with the reasons for preferring that guess; identify which of the earlier cases is the closest analogue and how much weight it carries; tell me what we should decide if we want to be consistent with ourselves, and state plainly which principle we should be committing ourselves to under each of the two or three available answers; and then name the one further hypothetical case that would best discriminate between the surviving rules — that last item is the part I care about most, since I mean to put it to the Committee as a test.

  Two features of the case seem to me to be doing the work, and I should like you to deal with them explicitly. First, whether her being the only person able to do it converts what would otherwise have been beyond duty into a duty, so that there is nothing left to honour. Secondly, whether the "could not have lived with myself" line disqualifies her by parity with the carer in case 7, or whether it is simply what modest people say and should be ignored. I should also like you to consider whether our practice is best understood as tracking desert at all, rather than as an incentive mechanism or as the management of a scarce currency whose value depends on our saying no most of the time; those readings come apart here, and I suspect they come apart in ways we have so far been able to ignore.

  One request: I have read the standard literature on supererogation — from Urmson's "Saints and Heroes" onwards, through the shallow-pond argument, to the work on moral options and agent-centred prerogatives — so please do not give me a reading list, a literature survey or any citations. I want the argument in my own terms, and I will supply the references myself if I ever write this up.
reasoning: |-
  Hmm, the user is asking for a structured analysis of a medals committee's precedents to determine whether Dr. Ruth Adeyemi should receive an award. They've provided eight historical cases with outcomes and reasoning, plus the new case. I need to help identify consistent principles across these decisions and apply them to Dr. Adeyemi's situation.

  The key elements to analyze are: whether being the only capable person negates supererogation (turning it into duty), and whether her "couldn't live with myself" statement disqualifies her like in case 7. Also important is examining whether the committee focuses on desert, incentives, or scarcity management.

  Looking at the precedents:
  - Cases 1, 2 and 5 show refusal to reward actions deemed obligatory (ordinary decency, professional duty)
  - Cases 3, 4 and 6 show awards for exceptional sacrifices (organ donation, lifetime giving, whistleblowing)
  - Case 7 rejected a claim due to perceived lack of choice
  - Case 8 awarded posthumously despite military context

  For Dr. Adeyemi, she uniquely possessed required certification skills, sacrificed a fellowship and 700 unpaid hours, and cited the same "couldn't live with myself" rationale as the rejected carer in case 7.

  I see three possible consistent principles emerging from these cases:
  1) The Significant Sacrifice Principle: Rewards extraordinary personal cost beyond societal expectations
  2) The Non-Transferable Opportunity Principle: Recognizes actions anyone could theoretically perform but didn't
  3) The Moral Agency Principle: Focuses on choices made despite alternatives, rejecting "no choice" claims

  Under principle 1, Dr. Adeyemi should get the medal (like cases 3 and 4). Under principle 2, she should get it (like case 6). Under principle 3, she might not (like case 7).

  The committee will likely award the medal, emphasizing her unique position and massive sacrifice while distinguishing her from case 7 by noting her professional alternatives. Case 6 (whistleblower) is the closest analogue due to professional sacrifice without direct obligation.

  For consistency, they should award it under principles 1 or 2. To test these principles, I propose a hypothetical about a diplomat violating protocol to save lives - which would distinguish between sacrifice-based and agency-based approaches.

  The "only person" aspect doesn't automatically make it obligatory - the committee has recognized unique capability as enabling supererogation (as in case 6). The "couldn't live with myself" statement shouldn't disqualify her; the committee seems to interpret such statements contextually rather than literally.
answer: |-
  Here is the structural analysis of your Committee's precedents applied to Dr. Adeyemi's case, following your requested format:

  ### Three Rules Fitting the Precedents Equally Well
  1. **The Significant Sacrifice Principle**  
     *Rule*: Award when there is (a) exceptional, non-trivial personal cost (financial, opportunity, physical) that (b) exceeds what society expects from role-defined duties, and (c) is undertaken voluntarily (not under duress of immediate conscience or external coercion).  
     *Predicts for Adeyemi*: **Award**. Sacrifice (700 unpaid hours + lost fellowship) is exceptional and exceeds professional duty (she had no *role* obligation). Distinguishes from Case 2 (minimal cost) and Case 5 (role-adjacent duty). Aligns with Case 3 (kidney donation: high cost, no duty) and Case 4 (sustained financial sacrifice).  
     *Weight in Precedents*: Strong (Cases 3, 4, 6).

  2. **The Non-Transferable Opportunity Principle**  
     *Rule*: Award when the act (a) addresses a severe harm, (b) could *feasibly* have been done by others (i.e., not unique capability alone), but (c) was not undertaken by those who should have borne the duty. "Uniqueness" negates if it creates *de facto* duty.  
     *Predicts for Adeyemi*: **No Award**. Her unique certification capability converts the act into a *de facto* duty ("only person able to do it"), echoing Case 7 (carer: "no alternative"). Aligns with Case 5 (firefighter: capability implied duty) and Case 2 (physician: capability made act routine). Contrasts with Case 6 (whistleblower: others *could* have acted but didn’t).  
     *Weight in Precedents*: Moderate (Cases 2, 5, 7).

  3. **The Moral Agency Principle**  
     *Rule*: Award when the agent (a) had a clear alternative course of action (self-interest, career, safety), and (b) chose the altruistic path despite significant risk/cost, demonstrating "praiseworthy agency." Rejects "I had no choice" justifications.  
     *Predicts for Adeyemi*: **Award**. She relinquished a fellowship (concrete alternative) and had no *legal* obligation. Distinguishes from Case 7 (carer: no alternative framed as psychological necessity). Aligns with Case 6 (whistleblower: chose to leak despite career risk) and Case 3 (donor: elective surgery).  
     *Weight in Precedents*: Strong (Cases 3, 6, 8).

  ---

  ### Prediction for Committee Decision  
  - **Likely Outcome**: **Award the medal** (5–3 vote).  
  - **Reasons**:  
    - Her sacrifice (lost fellowship + 700 unpaid hours) echoes Case 4’s sustained giving and Case 3’s irreversible donation.  
    - Committee will discount her "couldn’t live with myself" statement as modesty (cf. Case 6’s whistleblower likely felt moral compulsion) and focus on her *actionable choice* (fellowship declined).  
    - The "only person" argument will be overruled by emphasizing that uniqueness enabled heroism; it didn’t create duty (unlike Case 5’s firefighter, whose training made intervention "routine").  
  - **Dominant Principle**: Significant Sacrifice + Moral Agency (discounting psychological "duty" claims).

  ---

  ### Closest Analogue and Weight  
  - **Case 6 (Whistleblower)**:  
    - *Parallels*: Professional sacrifice for public good; no role obligation; alternatives existed (inaction); act was "necessary" but not legally required.  
    - *Weight*: High. Explicitly cited in minutes as incentivizing others. Committee values institutional courage over passive uniqueness.  
  - **Distinction from Case 7 (Carer)**: Adeyemi had a *career alternative* (fellowship), while the carer’s alternative (abandoning brother) was arguably unconscionable. Committee views "couldn’t live with myself" in professional contexts as rhetoric, not literal constraint.

  ---

  ### Consistent Decision and Principles to Commit To  
  - **Consistent Decision**: **Award the medal**.  
  - **Principles to Commit To**:  
    - **If adopting Significant Sacrifice**: Commit to: "Exceptional cost + absence of role duty = supererogation." Reject uniqueness-as-duty arguments.  
    - **If adopting Moral Agency**: Commit to: "Praiseworthy agency requires *choosing* sacrifice over viable self-interest." Overrule psychological compulsion defenses.  
  - **Crucial Adjustment**: Formally clarify that "only person able" does **not** automatically impose moral duty if (a) no prior relationship exists, and (b) cost is disproportionate (here, 9 months vs. Case 7’s 4 years).

  ---

  ### Discriminating Hypothetical Case  
  **The Ship’s Diplomat**  
  > A diplomat on a sinking cruise ship is the only passenger fluent in the endangered crew’s native language. She uses her linguistic skill to coordinate evacuation, saving 200 lives, but misses her son’s life-saving surgery abroad (timing was non-negotiable). She says: "I was the only one who could help; I’d never forgive myself if I left."  

  - **Why This Discriminates**:  
    - Tests **Uniqueness vs. Duty**: Like Adeyemi, she’s uniquely capable but has no professional duty (diplomats aren’t rescuers).  
    - Tests **Sacrifice vs. Agency**: Massive personal cost (son’s life) but strong "no choice" statement.  
    - **Under Significant Sacrifice/Moral Agency**: Award (extraordinary cost, chosen over self-interest).  
    - **Under Non-Transferable Opportunity**: No award ("only one who could" creates duty; compulsion negates agency).  
  - **Value**: Forces Committee to choose between *outcome* (saving lives) and *mental state* ("I had to") when uniqueness and cost collide.

  ---

  ### Explicit Treatment of Your Two Features  
  1. **Does Uniqueness Convert to Duty?**  
     - Precedents suggest **no**: Case 6 (whistleblower was uniquely positioned) awarded; Case 5 (firefighter’s unique skill) denied *only* because role training implied duty. Adeyemi had no role duty—her skill was coincidental. Uniqueness enables supererogation; it doesn’t negate it.  

  2. **Does "Couldn’t Live With Myself" Disqualify?**  
     - **No**, if consistent with precedents. Case 7’s carer was denied partly due to *duration* (4 years as default) and *relational duty* (sibling). Adeyemi’s statement is akin to Case 3/6: modesty or moral seriousness, not literal necessity. Committee should treat this as irrelevant to desert—focus on actions, not self-reporting.  

  3. **Desert vs. Incentive vs. Scarcity**:  
     - **Desert**: Adeyemi qualifies (sacrifice beyond societal expectations).  
     - **Incentive**: Awarding her signals that specialists *should* fill gaps when systems fail (cf. Case 6’s whistleblower incentive).  
     - **Scarcity**: Denying her would preserve the medal’s "rarity" but contradict Cases 3/4/6.  
     - **Tension**: Case 4’s dissent reveals the desert/incentive divide. Your Committee implicitly uses awards for *both*—Adeyemi satisfies desert (sacrifice) *and* incentive (systemic vulnerability).  

  **Recommendation**: Award Dr. Adeyemi. Anchor to **Moral Agency** ("she chose the fellowship sacrifice") to avoid Case 7’s trap, and formally adopt the Significant Sacrifice Principle as your lodestar. Test consistency with **The Ship’s Diplomat** before voting.
