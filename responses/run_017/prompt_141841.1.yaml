prompt: |-
  I'm a junior at a large public high school, and I sit on our student giving committee — six of us, four students and two teachers — which decides how to spend whatever the student body raises each year. This year the fall walkathon brought in about $9,000, we have four requests in front of us, and we have to announce the allocation at an assembly in ten days. I've been asked to draft the memo the rest of the committee will work from, and I'd like you to write it for me. Please take your time with this and think it through properly: before you draft anything, spend some time working out for yourself what each of the three standard critiques of effective altruism actually commits someone to — the institutional critique, the objection to earning to give, and the measurability bias, the one about how money drifts toward whatever shows up on a spreadsheet — and only then start writing. Write as someone who has both worked on the methodology of effective altruism and sat on grant committees that really had to say yes or no. One thing I'd ask you to avoid: please don't cite studies, charities, or authors by name. We can't check any of that, and this committee will discount anything that leans on a citation rather than on an argument.

  The four requests are these. First, an international health charity that distributes insecticide-treated bed nets and publishes an estimated cost per life saved from randomized trials; its student chapter here is asking for the entire $9,000, and on paper it is far and away the strongest option. Second, a student-run lunchtime tutoring program that also functions as a place to be for kids who are failing classes or have nowhere to go at lunch; a senior started it two years ago, right after the district cut two of our four counselor positions, and it is asking for $4,000 for food, transit cards for the peer tutors, and a small stipend for the teacher who stays to supervise. It has no control group and no data beyond a sign-in sheet. Third, a mutual aid fund run by parents in the district that gives small no-questions-asked cash grants to families in crisis, asking for $2,000. Fourth, the finance and economics club wants $1,500 for a speaker series and interview coaching aimed at steering seniors toward high-paying internships, on the argument that if even three of them end up donating a tenth of their income later, that beats everything else on the table — earning to give, as a line item in a high school budget.

  I want the memo to recommend a concrete split, with the justification for each recipient worked into the prose rather than listed, and I want it to say how we defend that split at an assembly where someone will inevitably stand up and ask why we sent money out of the country while our own counselor's office is half-staffed. I'm genuinely torn between the bed nets and the lunchtime room, so don't just tell me what I want to hear.

  Two ideas of my own have been going around in my head, and I want you to test them rather than flatter them. The first is what I've been calling the narratability discount: when one option's case is made entirely of numbers and another's is made of what the people affected say about it, treat the gap between the measured estimate and the told story as an artifact of measurement and discount back toward the story by some fixed fraction. My worry is that this just launders a preference for whatever is visible, since how moving a story is has nothing to do with how much good gets done; tell me whether it is a real correction or a bias with extra steps. The second is the offload test: the lunchtime room exists because the district made a cut, and funding it arguably helps the district not have to reverse that cut. But if I apply that test consistently it seems to condemn the bed nets too, since some government could point at our donation and trim its own malaria budget — so the test either proves too much or needs a scope condition I can't articulate, and I want your view on which it is and on what the condition should be if there is one.

  I'd also like the memo to be honest about where these critiques run out: whether a student body is even the right kind of agent to be doing cost-effectiveness reasoning, what we owe the students who put money in the walkathon under only a general promise, and any part of the case the framework simply doesn't decide. Please finish with a short paragraph, addressed to the committee, saying how confident you are in the recommendation overall and naming the single claim you are least sure of.

  Write it as continuous prose, the way I'd write an email to our faculty sponsor — no headings, no bullet points, no bold text, no tables — and keep it to roughly seven or eight hundred words.
reasoning: |-
  Okay, let me tackle this complex request from the high school junior serving on the student giving committee. They need a memo draft that allocates $9,000 to four requests while incorporating critiques of effective altruism (EA). 

  First, I need to deeply understand the three EA critiques they mentioned: institutional critique (relying on external orgs), earning to give (delayed impact), and measurability bias (overvaluing quantifiable outcomes). The student specifically wants these analyzed before drafting.

  The four funding requests present classic tensions: 
  - Bed nets: strong metrics but removed from local community
  - Lunch program: addresses immediate local needs with soft evidence
  - Mutual aid: direct cash transfers with trust-based model
  - Career program: speculative long-term "earn to give" approach

  The student raises two thoughtful concepts: 
  1) "Narratability discount" - their worry about favoring moving stories over actual impact seems valid. In practice, this might unintentionally bias toward visible/local causes.
  2) "Offload test" - their concern about subsidizing systemic underfunding applies equally to both local and global causes, so it can't be a decisive factor alone.

  For the memo structure, I'm considering:
  - Opening with the committee's purpose and tension between values
  - Analyzing each request through the EA critique lenses
  - Proposing a hybrid allocation (likely prioritizing lunch program while partially funding others)
  - Addressing assembly concerns honestly, especially the "why not local?" question
  - Ending with confidence levels and uncertainties as requested

  The student's nuanced understanding of EA's limitations is impressive - they recognize that high school donations operate in a different context than professional philanthropy. Their request for honesty about the framework's boundaries is crucial.

  Key challenges: 
  Balancing measurable impact with local responsibility
  Avoiding academic jargon while maintaining rigor
  Acknowledging valid concerns without undermining the recommendation
  Keeping prose continuous and citation-free per instructions

  I'll aim for 700-800 words of thoughtful, committee-ready analysis that doesn't shy away from the hard tradeoffs.
answer: |-
  To the Student Giving Committee,

  Having served on grant committees where we had to make irreversible decisions with imperfect information, I recognize the weight of this task. Our $9,000 represents genuine student effort and trust. The four requests crystallize the fundamental tensions in resource allocation, particularly when viewed through the lens of effective altruism (EA) and its critiques. Before proposing a split, let’s ground ourselves in those critiques, as they directly shape how we evaluate these options.

  The **institutional critique** argues that focusing solely on quantifiable cost-effectiveness can overlook the vital role of local institutions and relational trust. Outsourcing impact to distant, optimized charities might bypass or undermine community structures that provide essential, albeit harder-to-measure, support. It asks: Does sending funds elsewhere erode our capacity to care for each other here? The **objection to earning to give** questions the reliability and ethics of delaying impact for speculative future gains. It highlights the uncertainty of long-term outcomes (will those interns *actually* donate later?) and the moral hazard of prioritizing wealth accumulation now for philanthropy later. The **measurability bias** critique warns that over-reliance on quantifiable metrics (like cost-per-life-saved) systematically diverts resources away from vital interventions whose impact is complex, relational, or long-term, simply because they don’t fit neatly on a spreadsheet. This can privilege certain types of interventions (like bed nets) while neglecting others (like social support) that might be equally or more important in a broader context.

  These critiques don’t invalidate EA’s core insight – that some uses of money do vastly more good than others. They demand we apply its principles *thoughtfully*, acknowledging context and limitations. Our context is a public high school community. We are not a billionaire foundation; we are students and teachers allocating funds raised *by* students *from* students, under a general promise to benefit the student body and its values. This implies a responsibility to both local need and global good, recognizing that strengthening our own community *is* a valid form of impact, especially when systemic failures (like counselor cuts) create urgent gaps.

  Now, to the requests:

  1.  **International Health Charity ($9,000 requested):** On pure, measurable cost-effectiveness, this is the strongest contender. The evidence for bed nets saving lives is robust. The critique here is the institutional one: does sending *all* our funds overseas, while our own school struggles with understaffed support services, fulfill our responsibility to the community that raised the money? The measurability bias is also at play: the spreadsheet shows lives saved far away, but it doesn’t capture the potential demoralization or sense of neglect felt locally if we ignore visible needs here. It’s powerful, but an exclusive allocation risks feeling disconnected.
  2.  **Lunchtime Tutoring/Safe Space Program ($4,000 requested):** This is the heart of the institutional critique and the challenge to measurability bias. It exists *because* of a local institutional failure (counselor cuts). It provides tangible, immediate support: academic help, a safe haven for vulnerable students, and community building. Its impact is relational and preventative – harder to quantify than lives saved from malaria, but potentially profound (preventing dropouts, improving mental health, fostering belonging). Sign-in sheets are weak data, yes, but the lived experience described – kids with "nowhere to go" – speaks volumes. Your "narratability discount" idea touches on this. I see it less as a discount applied to numbers, and more as an acknowledgment that *some vital goods resist quantification*. We shouldn't dismiss the story because it lacks a control group; we should recognize the story *is* evidence of a different kind – evidence of a critical *need* and a functional *response* within our own institution. However, your worry is apt: we must guard against favoring the visible *simply because* it's visible or local. The justification must be that this program demonstrably fills a gap created by systemic neglect, serving vulnerable members of *our* immediate community.
  3.  **District Mutual Aid Fund ($2,000 requested):** This embodies direct, flexible support with minimal bureaucracy (no-questions-asked cash). It addresses crises within families connected to our school community. While lacking specific metrics, cash transfers are evidence-based for relieving poverty stress. It leverages local knowledge and trust (parents distributing it). It scores well against institutional and measurability critiques – it strengthens local capacity and addresses needs that defy simple measurement. The amount requested is modest relative to its potential reach.
  4.  **Finance Club "Earn to Give" Proposal ($1,500 requested):** This directly engages the "earning to give" critique. The logic is clever but highly speculative. *Will* these seniors land those jobs? *Will* they donate 10% later? *Will* that outweigh giving now? The timelines are long, the variables immense. Furthermore, it primarily benefits students already on a track towards high-earning careers, arguably a less vulnerable group than those served by the lunch program or mutual aid. The institutional critique also applies: does steering students towards high finance serve *our school community's* broader values and needs? The earning-to-give objection highlights the moral hazard – prioritizing future potential philanthropy over concrete, immediate needs feels premature and uncertain for a high school committee.

  **Your "Offload Test":** Your insight is sharp. Funding the lunch program *could* let the district off the hook. But applying this *consistently* does indeed condemn almost any charity, including bed nets (governments *could* reduce funding). The crucial scope condition is **proximity and direct responsibility**. Our school district *directly* cut the counselors, creating the need the lunch program addresses. We are members of *this* district. Our donation is tiny compared to the global malaria budget; the risk of offset there is negligible and indirect. The offload risk is significantly higher and more direct when funding local services that *should* be publicly funded. This doesn't mean we *shouldn't* fund it, but it means we must fund it *while also advocating* for the district to restore proper support, making it clear our donation is a stopgap, not a solution.

  **Recommendation ($8,500 allocated):**
  *   **Lunchtime Program: $4,000 (Full request).** This addresses the most acute, visible, *local* institutional failure impacting our most vulnerable students *right now*. It provides academic support, safety, and community – goods fundamental to a school's purpose that resist easy quantification but are undeniably vital. It fulfills a specific responsibility we have to our own community.
  *   **Mutual Aid Fund: $2,000 (Full request).** This efficiently addresses urgent, local crises affecting families within our school ecosystem. It complements the lunch program by supporting stability at home. Its flexibility and local trust networks make it effective despite lacking complex metrics.
  *   **International Health Charity: $2,000.** Acknowledging the immense good done per dollar, but scaling back significantly from their request. This allows us to contribute meaningfully to global good while reserving the majority for pressing local needs. A $2,000 donation still translates to significant impact.
  *   **Finance Club: $500 (Partial grant).** The core "earn to give" justification is too speculative for major funding. However, providing a smaller amount supports a legitimate student club activity (speakers, coaching) that has educational value in itself, without endorsing the primary speculative argument. We deny the $1,500 full request.
  *   **Remaining $500:** Hold in reserve for unforeseen needs this year or seed money for next year's committee. (Total allocated: $8,500).

  **Defending at the Assembly:** Be honest and passionate. Acknowledge the power of the bed nets: "We *are* sending $2,000 to help save lives globally – that impact is real and important." Then pivot to the local reality: "But we looked around our own school. We saw the counselor's office operating at half-strength for two years. We saw the lunchroom program, started by a senior, become a lifeline for students who were failing, isolated, or had nowhere safe to go. That program exists *because* of a cut. Our $4,000 isn't just buying snacks and bus passes; it's investing in keeping our peers in school, supported, and connected *right here, right now*. The mutual aid fund helps families in our own district stay afloat during crises. We chose to balance our responsibility as global citizens with our duty to care for our immediate community, especially where the system has let them down. We challenge the district to see this support and restore our counselors."

  **Where the Framework Runs Out:** EA critiques help us think rigorously, but they don't absolve us of judgment. A student body *isn't* just a mini-foundation. Trust matters. Visibility matters. Sustaining our *own* community's capacity for care matters. Students donated under a general promise; we owe them allocations that reflect shared values – compassion, both local and global, and a commitment to helping peers in tangible ways. The framework doesn't decide the weight we give to immediacy vs. distance, or to quantifiable lives saved vs. the harder-to-measure preservation of dignity, safety, and belonging right here. That’s our call.

  **To the Committee:** I'm reasonably confident in this balanced approach, which addresses urgent local institutional failures, supports immediate crisis relief locally, makes a meaningful global contribution, and limits exposure to highly speculative strategies. The claim I'm *least* sure of is the precise size of the bed net allocation ($2,000). Arguments for giving them more (sheer scale of good) or less (prioritizing local responsibility even further) are both strong. Be prepared to debate that specific amount. Let's refine this draft together.
