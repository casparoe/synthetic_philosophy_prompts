  ...Also, the user’s "no sustained global decline" point is a straw man. Cyclical theory doesn’t deny progress; it argues progress is *lumpy* and locally reversible. The historian should mock the graph gently: "Averaging bankruptcies doesn’t prove businesses never fail."  

  Wait—the user said "don’t synthesize." Good. The historian must avoid conceding to progress theory. Instead, hammer that linear models miss *timing* and *sequence*: Population pressure explains resource strain but not why Song China innovated (early cycle) while Ming China ossified (late cycle) under similar pressures.  

