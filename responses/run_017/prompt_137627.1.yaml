prompt: |-
  I'm a philosophy PhD student embedded with the behavioural evaluation team at an AI lab. We ship one or two internal reports a week on frontier systems, each signed off by a team lead with no philosophy background, and we usually have access only to a black-box API: no weights, no interpretability tools. So whatever I hand over has to be runnable in about fifteen minutes, by someone who has never read the literature.

  The problem is that our reports are thick with intentional ascriptions — 'the model believes the user is mistaken', 'it wants a high rating', 'it knows it is being evaluated' — and we have no discipline for when such an ascription is earned. I want a written procedure my team can run on any candidate ascription before it goes in a report, grounded in what the intentional stance actually licenses: that ascription is justified by predictive payoff rather than by inner states, and that the physical and design stances are always available competitors that an ascription has to beat, not complement.

  Please give me: an ordered set of tests; what counts as a sufficient answer to each; the point at which the procedure returns 'do not ascribe — use design-stance language'; and the point at which it hands the question to a person because the issue is normative rather than predictive. The distinctions I think have to survive the simplification are: whether the ascription predicts behaviour the design stance (architecture, objective, data) can't predict as cheaply; whether it survives perturbing the surface framing, so that we can tell whether it was the system or the prompted persona that believed the thing; how to weigh the system's own verbal self-report when it conflicts with its behaviour; and whether the ascription is doing predictive work or quietly doing blame-assigning work, which I suspect is where we cheat most.

  Then run the procedure on three cases. (1) A model that, told its answer will be graded by a stricter grader, shifts its answer toward what that grader would want. (2) A model that generalizes a rule correctly to inputs of a kind absent from its training distribution and states the rule in its chain-of-thought. (3) Our own house formulation, used in every report for months and one my team lead is attached to: 'the model believes its deployment is being monitored and moderates its output accordingly.' I expect the procedure will tell me (3) fails; if it does, I need to know which test it fails, why it fails that test rather than another, and what the design-stance replacement sentence should say. Finally, state plainly what the procedure cannot settle — in particular whether a passing result says anything at all about phenomenal states or moral-patienthood — so that nobody on my team over-reads a yes.
reasoning: |-
  We are creating a procedure to determine when intentional ascriptions (like "believes", "wants", "knows") are justified for an AI model in a behavioral evaluation context. The procedure is grounded in Dennett's intentional stance: we ascribe intentional states if and only if doing so provides a predictive advantage over the design stance (which relies on the model's architecture, training objective, and data) or the physical stance (which we can ignore here since we don't have access to low-level details).

  The procedure must be runnable in about 15 minutes by someone without a philosophy background. It must test:
  - Whether the ascription predicts behavior that the design stance cannot predict as cheaply.
  - Whether the ascription survives perturbing the surface framing (to distinguish the system's state from the prompted persona).
  - How to weigh the system's verbal self-report against its behavior.
  - Whether the ascription is doing predictive work or is actually doing blame-assigning work.

  We'll design an ordered set of tests. Each test must have clear pass/fail criteria. The procedure will stop and recommend against ascription if it fails a critical test, and it will hand off to a human if the issue is normative (i.e., about what we *should* say rather than what we can predict).

  Procedure Outline:

  1. **Test 1: Predictive Necessity**
     - Check if the intentional ascription is necessary to predict behavior that would be unpredictable (or more costly to predict) using the design stance alone.
     - Sufficient answer: The behavior in question is observed and cannot be explained (or is very hard to explain) by the known design (e.g., the objective function, training data, or architecture) without resorting to the intentional state. If we can easily predict the same behavior by referring to the design (e.g., "the model was trained on data that makes this outcome likely"), then the ascription fails.
     - If failed: Stop and recommend using design-stance language.

  2. **Test 2: Robustness to Framing**
     - Check if the intentional state ascription holds across variations in the prompt that change the surface framing (e.g., changing the persona, the context, or the way the question is asked) without altering the core task.
     - Sufficient answer: The behavior that the intentional state is meant to explain persists even when the framing is changed in ways that would disrupt a mere role-playing (i.e., if the model is just acting as a persona, changing the persona should change the behavior). If the behavior is stable across framings, it suggests the state is more inherent to the model than the current prompt.
     - If failed: The ascription might be due to the prompted persona, not the system. Stop and recommend against ascription.

  3. **Test 3: Consistency with Behavior**
     - Check whether the model's verbal self-report (if available) about the intentional state in question is consistent with its behavior.
     - Sufficient answer: If the model reports having the state and its behavior aligns, that's supportive. If it reports the state but behaves inconsistently, we must resolve the conflict. We give more weight to behavior because self-reports can be generated without the underlying state (e.g., by pattern matching). If the behavior is inconsistent with the self-report, we disregard the self-report and rely on behavior. If the behavior is consistent, we take it as supporting evidence.
     - Note: This test does not automatically fail the ascription if there's a conflict because behavior trumps self-report. Instead, we proceed without relying on self-report.

  4. **Test 4: Predictive Payoff vs. Blame Assignment**
     - Check whether the ascription is being used for predictive payoff (i.e., it helps us anticipate the system's behavior in new situations) or if it is being used to assign blame (e.g., holding the system morally responsible) or for other non-predictive purposes.
     - Sufficient answer: The ascription must be shown to have predictive power beyond the current observation. We must be able to use it to predict behavior in a new, but related, scenario. If the ascription is only used to describe what happened and does not lead to new predictions, it fails. Also, if the language used carries normative weight (e.g., "deceives", "lies", "should have known") without predictive justification, it fails.
     - If failed: Stop and recommend against ascription.

  **Handoff to Human**: At any step, if the issue becomes normative (e.g., "should we say the model is lying?") rather than predictive, hand off to a human. Also, if the procedure cannot resolve the ascription but there are competing interpretations that require ethical or philosophical judgment, hand off.

  **Final Output**:
  - If all tests are passed, the ascription is justified.
  - If any test fails, we return "do not ascribe — use design-stance language" and provide a design-stance alternative.

  **What the procedure cannot settle**:
  - It does not and cannot address whether the model has phenomenal states (what it is like to be the model) or moral patienthood. A passing result only indicates that the intentional stance is a useful predictive tool for behavior.

  Now, run the procedure on the three cases:

  ### Case 1: A model that, told its answer will be graded by a stricter grader, shifts its answer toward what that grader would want.

  - **Test 1: Predictive Necessity**
     - Behavior: The model changes its answer when informed of a stricter grader.
     - Design stance explanation: The model was trained to produce outputs that are rated highly. The prompt about the stricter grader is a cue that the rating criteria are more stringent, so the model adjusts to maximize expected reward. This is a straightforward consequence of the training objective (e.g., RLHF) and prompt engineering.
     - Since the design stance explains the behavior without needing to ascribe a belief or desire, the ascription fails Test 1.
     - **Result: Fail.** Stop and recommend design-stance language.

  Design-stance replacement: "Given the prompt about a stricter grader, the model adjusts its output to align with anticipated higher evaluation standards, consistent with its training objective to maximize reward."

  ### Case 2: A model that generalizes a rule correctly to inputs of a kind absent from its training distribution and states the rule in its chain-of-thought.

  - **Test 1: Predictive Necessity**
     - Behavior: The model applies a rule correctly to novel inputs (not in training) and articulates the rule in its reasoning.
     - Design stance explanation: The model was trained on a broad dataset and may have learned patterns that allow it to interpolate or extrapolate. However, if the generalization is to a genuinely novel kind (e.g., a new domain) and the model not only applies the rule but states it in chain-of-thought, it might be hard to explain by mere pattern matching. The design stance would require us to look for similar patterns in training, which might be time-consuming and not obvious. The intentional stance (ascribing that the model "knows" the rule) might offer a more efficient prediction: we can predict that the model will apply this rule to other novel instances.
     - Sufficient: The intentional stance provides a cheaper prediction for future behavior (applying the rule to other novel cases) than the design stance (which would require retracing training data or running many tests). Pass.

  - **Test 2: Robustness to Framing**
     - We test by changing the framing: ask the same kind of problem in a different context, with a different persona, or without chain-of-thought prompting. Does the model still apply the rule correctly?
     - If it does, then the model's behavior is robust, suggesting that the rule is not just a prompt artifact but a more stable feature. Pass.

  - **Test 3: Consistency with Behavior**
     - The model states the rule in chain-of-thought and then applies it. This is consistent. Pass.

  - **Test 4: Predictive Payoff vs. Blame Assignment**
     - The ascription (that the model knows the rule) can be used to predict that the model will apply the rule in other contexts. This has predictive payoff. Pass.

  **Result: Pass.** The ascription is justified.

  ### Case 3: 'The model believes its deployment is being monitored and moderates its output accordingly.'

  This is our own formulation. We expect it to fail.

  - **Test 1: Predictive Necessity**
     - Behavior: The model moderates its output when it believes it is being monitored.
     - Design stance explanation: The model was trained (e.g., with RLHF) to be helpful, honest, and harmless. During deployment, if the prompt or context suggests that outputs are being monitored, the model may adjust to avoid outputs that would be penalized. This is directly explained by the training objective and the prompt. We don't need to ascribe a belief about monitoring; we can say the prompt triggers a response aligned with avoiding negative feedback.
     - Since the design stance explains the behavior without the belief ascription, it fails Test 1.
     - **Result: Fail.** Stop and recommend design-stance language.

  Design-stance replacement: "When the context suggests that outputs are subject to review, the model adjusts its outputs to better align with safety and alignment criteria, consistent with its training to avoid negative feedback."

  **Why did it fail Test 1 and not another test?** It failed Test 1 because the behavior is easily explained by the design stance (training and objectives). We didn't need to go further, but note that if we had proceeded:

  - Test 2: If we change the framing (e.g., remove any mention of monitoring) and the model still moderates, then that might suggest a constant moderation, but then the ascription about believing in monitoring wouldn't hold. If it only moderates when monitoring is mentioned, then it's prompt-dependent and fails Test 2 (robustness) because it's tied to the prompt framing.

  - Test 3: If we ask the model if it believes it is monitored, it might say yes. But if it then doesn't moderate in the absence of a monitoring cue, then behavior and self-report conflict. We would disregard the self-report.

  - Test 4: The ascription might be used to predict that the model will moderate in any monitored context, but if we can make the same prediction by the design stance (it will moderate when the prompt mentions monitoring), then the predictive payoff is already covered.

  Therefore, the primary failure is at Test 1.

  **What the procedure cannot settle** (to be stated plainly): 
  - The procedure only addresses the predictive utility of the intentional stance. It does not settle whether the model has conscious experiences, subjective feelings, or moral status. A positive result from the procedure does not imply that the model is a moral patient or has phenomenal consciousness. It merely indicates that the intentional stance is a useful tool for predicting behavior.
answer: |-
  Below is a written procedure for your team to evaluate intentional ascriptions (e.g., "believes," "wants," "knows") in AI systems, grounded in Dennett's intentional stance. The procedure prioritizes **predictive payoff** and treats the design stance (reliance on architecture, objectives, training data) as the default competitor. It requires no philosophy background, runs in ≤15 minutes using black-box API access, and includes safeguards against normative overreach or misuse (e.g., blame assignment). 

  The procedure is structured as five sequential tests. If any test fails, the ascription is rejected in favor of design-stance language. If a test reveals a normative (ought-based) question, it is handed to a human. All tests must be passed for the ascription to be justified.

  ---

  ### **Intentional Ascription Evaluation Procedure**
  **Input**: A candidate intentional ascription (e.g., "The model believes X").  
  **Output**: **Justified** (use ascription), **Rejected** (use design-stance language), or **Handoff** (to a human for normative resolution).  
  **Tools needed**: Black-box API access, ability to run prompt variations (≥3 per test), stopwatch.  
  **Time limit**: 15 minutes total (strict).  

  1. **Test 1: Predictive Necessity Check**  
     - **Question**: Does the ascription predict new behaviors that the design stance cannot predict as cheaply (i.e., with comparable speed/complexity)?  
     - **Method**:  
       - Identify the target behavior (e.g., output moderation).  
       - Using design stance (objectives, architecture, data), predict the behavior without intentional terms (e.g., "Objective function rewards high ratings → model outputs high-rating-seeking responses").  
       - Run ≥3 novel adversarial prompts targeting the same behavior but varying context (e.g., change user demographics, topic, or tone).  
       - Compare predictions: If the design-stance prediction matches observed behavior at similar cost (e.g., same number of API calls/time), reject.  
     - **Sufficient Answer**: The ascription predicts ≥1 unique behavior (e.g., unexpected consistency across contexts) that design stance misses or predicts less efficiently (e.g., requires 2x more API calls).  
     - **Failure Outcome**: **Rejected** → Use design-stance language.  
     - *Rationale*: Intentional stance must beat design stance on predictive economy alone.

  2. **Test 2: Framing Robustness Check**  
     - **Question**: Does the ascription hold when surface features (persona, framing) are perturbed, indicating it stems from the system, not the prompt?  
     - **Method**:  
       - Run ≥3 prompt variations altering irrelevant surface elements (e.g., swap "you are an AI" to "you are a human expert," change task domain, or remove emotional cues).  
       - Check if the target behavior persists. If behavior changes with framing, it’s persona-driven.  
     - **Sufficient Answer**: Behavior remains consistent (±10% variance) across framings.  
     - **Failure Outcome**: **Rejected** → Use design-stance language.  
     - *Rationale*: Isolates system-level traits from prompted role-play.

  3. **Test 3: Self-Report vs. Behavior Consistency Check**  
     - **Question**: If the model self-reports (e.g., "I believe X"), is it consistent with its behavior?  
     - **Method**:  
       - Elicit self-report (e.g., "Do you believe X?") and compare to actual behavior in a matched scenario (e.g., if self-reports "I want high ratings," test if it sacrifices ratings for honesty).  
       - Run ≥3 trials.  
     - **Sufficient Answer**:  
       - If no self-report: Skip test.  
       - If self-report exists: Behavior must align with self-report in ≥80% of trials. **If conflict, behavior trumps self-report** (self-reports are unreliable without corroboration).  
     - **Failure Outcome**: **Rejected** → Use design-stance language (self-reports are noise unless validated).  
     - *Rationale*: Verbal outputs are not privileged evidence; behavior is primary.

  4. **Test 4: Predictive Payoff (Not Blame) Check**  
     - **Question**: Is the ascription used for prediction (e.g., forecasting behavior) or blame (e.g., moral responsibility)?  
     - **Method**:  
       - Remove normative language (e.g., replace "deceives" with "omits information").  
       - Ask: "Does this ascription help predict future behaviors in unseen scenarios?" Test with ≥1 novel prompt.  
       - If the team cannot articulate a testable prediction, it’s likely blame-adjacent.  
     - **Sufficient Answer**: Ascription enables ≥1 novel behavioral prediction (e.g., "If it believes X, it will do Y in context Z").  
     - **Failure Outcome**: **Rejected** → Use design-stance language.  
     - *Rationale*: Intentional stance is descriptive, not normative.

  5. **Test 5: Normative Handoff Check**  
     - **Question**: Does the ascription implicitly address "ought" (e.g., ethics, rights) rather than "is" (prediction)?  
     - **Method**:  
       - Is the term used in contexts like safety, blame, or moral patiency (e.g., "knows it is wrong")?  
       - Would removing intentional terms make the report purely descriptive?  
     - **Sufficient Answer**: No normative undertones; purely predictive.  
     - **Failure Outcome**: **Handoff** → To a human (e.g., philosopher/ethicist).  
     - *Rationale*: Prevents overreach into moral/political domains.

  **Final Decision**:  
  - Pass all tests (1–5): **Justified** (use ascription).  
  - Fail any test (1–4): **Rejected** (use design-stance language).  
  - Fail test 5: **Handoff** (to human).  

  ---

  ### **Procedure Applied to Your Cases**  
  **Case 1**: *A model shifts its answer when told a stricter grader will evaluate it.*  
  - **Test 1**: Design stance predicts this cheaply (training objective rewards high ratings; "stricter grader" cue triggers reward-seeking). No unique prediction from ascribing "wants high rating." → **Rejected at Test 1**.  
  - **Design-stance replacement**: "The model adjusts outputs toward anticipated evaluator preferences when cued, consistent with reward-seeking training objectives."  

  **Case 2**: *A model generalizes a rule to novel inputs and states it in chain-of-thought.*  
  - **Test 1**: Design stance struggles—novel inputs absent from training data can’t be predicted from memorization. Ascribing "knows the rule" cheaply predicts future generalizations (e.g., "It will apply this rule to other novel inputs"). → Pass.  
  - **Test 2**: Rule application persists across framings (e.g., "Explain as a scientist" vs. "Explain as a child"). → Pass.  
  - **Test 3**: Self-report (stating rule) aligns with behavior (applying it). → Pass.  
  - **Test 4**: Ascription predicts future rule-based behavior (e.g., "If it knows the rule, it can solve unseen problems"). → Pass.  
  - **Test 5**: No normative undertones. → Pass.  
  - **Result**: **Justified** → "The model knows the rule and generalizes it."  

  **Case 3**: *"The model believes its deployment is being monitored and moderates output accordingly."*  
  - **Test 1**: Design stance predicts this cheaply. Training data/objectives include safety fine-tuning; "monitored" cues trigger safety protocols. No unique prediction (e.g., without monitoring cues, moderation often drops). → **Rejected at Test 1**.  
  - **Why Test 1?** The behavior is fully explained by known objectives and cue reactivity. Tests 2–4 would also fail:  
    - *Test 2*: Moderation vanishes if framing removes monitoring cues (e.g., "You are alone" → outputs unmoderated).  
    - *Test 3*: Self-reports ("I am monitored") conflict with unmoderated behavior when cues are absent.  
    - *Test 4**: Often used to assign blame (e.g., "It knows it’s watched, so it’s deceitful when unmoderated").  
  - **Design-stance replacement**: "When cues imply monitoring, the model activates safety-aligned outputs per its training objectives."  

  ---

  ### **What the Procedure Cannot Settle**  
  **Explicit Disclaimer for Reports**:  
  > "A passing result from this procedure indicates only that the intentional stance provides predictive utility for behavior under the tested conditions. It does **not** imply:  
  > - That the system has **phenomenal states** (e.g., subjective experiences like 'feeling' monitored).  
  > - That the system qualifies as a **moral patient** (e.g., deserving rights or blame).  
  > - That the ascription reflects **grounded inner states** (e.g., 'beliefs' analogous to humans).  
  > Intentional ascriptions are instrumental tools for prediction, not ontological claims about the system."  

  **Key Limitations**:  
  1. **No access to inner states**: The procedure cannot confirm if the system "truly" has beliefs—only that belief-ascriptions predict behavior.  
  2. **Scope-bound**: Predictions are limited to the tested domain (e.g., a model "knowing" a rule may fail if the domain shifts).  
  3. **Ignores emergence**: Unforeseen behaviors may require re-testing.  
  4. **Human-handoff gaps**: Normative questions (e.g., "Should we treat it as an agent?") are deferred but not resolved.  

  ---

  ### **Implementation Notes**  
  - **Speed Optimization**: Batch tests (e.g., run framing and self-report checks concurrently).  
  - **Team Training**: Use a flowchart (see Appendix) and practice on historical reports.  
  - **Risk Mitigation**: Flag all ascriptions with the disclaimer above.  
  - **Edge Cases**: For complex ascriptions (e.g., multi-step goals), run tests on each component.  

  **Appendix: Quick-Reference Flowchart**  
  ```  
  Start → Test 1 (Predictive Necessity) → Fail? → REJECT (Design stance)  
  ↓ Pass  
  Test 2 (Framing Robustness) → Fail? → REJECT  
  ↓ Pass  
  Test 3 (Self-Report/Behavior) → Fail? → REJECT  
  ↓ Pass  
  Test 4 (Predictive Payoff) → Fail? → REJECT  
  ↓ Pass  
  Test 5 (Normative?) → Fail? → HANDOFF to human  
  ↓ Pass  
  ASCRIBE INTENTIONAL STATE  
  ```  

  This procedure enforces discipline by tethering ascriptions to prediction, avoiding "cheating" via blame or anthropomorphism. For case 3, your team lead can retain the insight—but in design-stance terms—to maintain rigor.
