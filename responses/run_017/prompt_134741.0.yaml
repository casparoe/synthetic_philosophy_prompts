prompt: |-
  Hi — hoping you can help me think through something that's stopped being a thought experiment and turned into my actual job.

  A few months ago I picked up some contract work rating LLM outputs. Mostly medical and legal-ish questions: we get shown a question and two answers, and we pick the better one. The line we're given in training is that this is fine even though I know far less than the models do, because in an adversarial format errors get dragged into the open — a comparatively ignorant judge plus two competing answers is supposed to beat a single answer on its own. As I understand it that's roughly the same bet the AI-safety-via-debate people make about scalable oversight. But in practice I've noticed I reward whichever answer is longer and uses more confident jargon, and I genuinely can't check most of the specific claims. So I want to know what this whole practice is resting on.

  My half-formed worry, which you should feel free to tear apart: maybe what's doing the work isn't truth having an advantage in argument at all, but the tie-break convention. When I really can't tell, I default to whichever answer asserts less, or to whichever one echoes the framing of the question. If that's right, then whatever reliability the format has comes from a procedural default that's been handed to me, not from anything about truth being easier to defend.

  So, concretely, I'd like:

  1. A reconstruction of the implicit epistemology. What has to be true of argument, evidence, and expertise for weak judge + two adversaries to be a decent route to the truth? And be careful about the difference between what the practice strictly presupposes and what it merely sits well with — I suspect several quite different theories of testimony or argument would license it, and I want to know where it's underdetermined.
  2. The obfuscated-argument problem specifically. There are correct answers whose correctness is expensive to verify, and there are wrong answers that are cheap to dress up as rigorous. Does the setup need the strong claim that correctness is cheap to demonstrate, or only the weaker claim that sustaining an error is costlier than sustaining a truth? What views of justification or understanding does it quietly rule out on the way — holistic ones, say, or views on which competence takes years to acquire?
  3. An apparent inconsistency I can't sort out. The same project also has us score single answers on a separate scale, and there we're told explicitly to ignore style and confidence entirely. Do the two halves of the practice presuppose consistent things?
  4. My tie-break worry taken seriously: how would you actually tell the difference between truth winning and a default winning, and what would need to change in the protocol to separate them?
  5. If we threw out the assumption that truth is easier to defend, what would the evaluation protocol have to look like instead — what would have to change, and what would we lose?

  I'm not a philosopher, so please write plainly and don't assume I know the literature; and no need for citations or a reading list, I can't chase references anyway. Please write in British English — the write-up is going to a UK-based client.
reasoning: |-
  Okay, the user is working as a rater for LLM outputs, focusing on medical and legal questions. They have to choose between two answers and pick the better one. They're concerned that their judgments might be biased towards longer, more confident answers filled with jargon, even though they can't verify the claims. They're questioning the entire epistemology behind this method.

  The user's main worry is that the reliability of the adversarial setup might not come from truth having an advantage but from tie-breaker defaults like preferring answers that assert less or echo the question. They want a clear breakdown of the underlying assumptions, the problem of obfuscated arguments, an inconsistency in the scoring system, how to test if truth is actually winning, and alternative protocols if the assumption fails.

  First, I need to reconstruct the implicit epistemology. The adversarial format assumes that truth has a structural advantage. Even an untrained judge can spot inconsistencies or gaps when comparing two arguments. But this relies on errors being easier to expose than truths are to obscure. If both answers are equally confident but one is wrong, the judge might default to superficial traits.

  Next, the obfuscated-argument problem. The setup needs the weaker claim that sustaining an error is costlier, not that correctness is cheap to demonstrate. But if wrong answers are convincingly dressed up, the judge might be fooled. This challenges holistic views where understanding requires deep expertise, which the judge lacks.

  The inconsistency between the two scoring methods is tricky. In single-answer scoring, ignoring style and confidence makes sense because there's no comparison. But in adversarial, those factors might unduly influence decisions. The protocols might be consistent only if the judge can separate substance from style, which is hard without expertise.

  Testing the tie-breaker concern involves experiments. For example, using trap questions with known errors in confident answers or varying defaults. If the judge's accuracy drops when defaults are manipulated, it shows reliance on procedural defaults rather than truth.

  If truth isn't easier to defend, alternatives like domain-specific reviewers or verification tools could help. But these are resource-intensive. The trade-off is scalability versus reliability. The current method is efficient but might sacrifice accuracy, especially in complex fields.

  The user's deeper need might be validating their concerns about the system's reliability. They might feel their role is ineffective, seeking reassurance or ways to improve the protocol. They might also want to communicate these issues to their client with concrete suggestions, hence needing clear, jargon-free explanations.
answer: |-
  Here’s a clear breakdown of your concerns, written in plain British English and addressing each point systematically:

  ---

  ### 1. **The Implicit Epistemology: What’s Under the Bonnet?**  
  The practice rests on two core assumptions:  
  - **Truth has a signalling advantage**: Correct answers are inherently easier to defend *without contradiction* than incorrect ones. When two answers compete, errors are forced "into the open" because lies require more complex evasion, leading to inconsistencies, gaps, or overconfidence that even a non-expert can spot.  
  - **Weak judges can detect relative flaws**: You don’t need deep expertise to compare arguments. Like noticing a shaky alibi in a TV detective show, logical coherence, consistency with the question, and absence of glaring red flags (e.g., contradictions) are detectable without knowing the full subject.  

  **What it presupposes**:  
  - Truth is "sticky" – it coheres with itself and the evidence.  
  - Falsehoods are "fragile" – they crumble under scrutiny or require convoluted defences.  
  - **What it doesn’t require**:  
    - Judges understanding *why* an answer is right (only that one is *less wrong*).  
    - Perfect detection (just better-than-chance accuracy).  

  **Underdetermined areas**:  
  - **Theories of testimony**: It works with both "reliabilist" views (truth-tellers are statistically consistent) and "evidentialist" ones (truth aligns with observable cues).  
  - **But it clashes with**: Holistic expertise (e.g., "legal intuition from 20 years’ practice") or post-modern views where "truth" is purely discursive.  

  ---

  ### 2. **The Obfuscated-Argument Problem: Style vs. Substance**  
  Your worry about jargon-heavy, confident answers masking errors cuts to the heart of scalability.  

  - **What the setup *needs***: Only the **weaker claim** that *sustaining an error is costlier than sustaining truth*.  
    - *Example*: Fabricating a plausible but false medical study is harder than citing a real one. The liar must avoid tripping over details.  
  - **What it *rules out***:  
    - **Holistic justification**: If truth requires seeing "the big picture" (e.g., clinical context), a non-expert judge can’t assess it.  
    - **Fast-talking charlatans**: If bullshitters are better at *performance* than experts are at clarity, the system fails.  
    - **Deep expertise**: The method assumes competence is *demonstrable in argument*, not just accrued over years.  

  **In practice**: If errors are *cheap to disguise* (e.g., AI generates fake citations smoothly), the epistemology breaks. Your bias toward long/confident answers is a symptom of this vulnerability.  

  ---

  ### 3. **The Inconsistency: Single vs. Adversarial Scoring**  
  - **Single-answer scoring**: "Ignore style/confidence" makes sense here. Without competition, style is noise. You’re scoring factual accuracy *as if* you could verify it (an idealised benchmark).  
  - **Adversarial scoring**: Style/confidence *become relevant signals* because they’re tools in competitive argument. Overconfidence may betray uncertainty; jargon might mask evasion.  
  - **Consistency?** The two halves **can coexist** if:  
    - Adversarial scoring treats style as *evidence of deception/competence*, not substance.  
    - Single scoring ignores style because there’s no contrast to analyse.  
  - **The rub**: In reality, untrained judges struggle to separate style from substance. Your project implicitly assumes you *can* – which may be its weak spot.  

  ---

  ### 4. **Testing "Truth Wins" vs. "Default Wins"**  
  Your tie-break habits (preferring less assertive/echoing answers) might be propping up the system. Here’s how to check:  
  - **Run experiments**:  
    - **Swap defaults**: Instruct half your judges to default to *assertive* answers. If accuracy drops, defaults matter.  
    - **Trap questions**: Insert questions with *known* answers. One answer is true but understated; the other is false but confident. Does truth still win?  
    - **Vary framing**: If "echoing the question" wins regardless of correctness, it’s a procedural crutch.  
  - **Protocol tweaks**:  
    - **Ban defaults**: Force judges to write *why* they chose, exposing reasoning.  
    - **Add uncertainty options**: Let judges flag "toss-ups" rather than guessing.  

  ---

  ### 5. **If Truth Isn’t Easier to Defend: Alternatives**  
  If falsehoods are as defensible as truths (e.g., AI excels at bullshit), the current model fails. Alternatives:  
  - **Change the protocol**:  
    - **Triangulation**: Add a third answer or cross-verify with tools (e.g., fact-check APIs).  
    - **Structured critiques**: Judges score specific dimensions (evidence, logic, clarity) rather than holistic "better".  
    - **Expert subsamples**: Send high-stakes answers to specialists.  
  - **What you’d lose**:  
    - **Scalability**: Expert reviews are slow/expensive.  
    - **Speed**: Real-time evaluation becomes harder.  
  - **What you’d gain**:  
    - **Robustness**: Less vulnerability to confident nonsense.  
    - **Transparency**: Clearer criteria reduce judge bias.  

  ---

  ### The Bottom Line  
  Your instinct is sound: the system *assumes* truth has a home-field advantage in adversarial settings. But if errors are cheap to prettify (via length/jargon/confidence), and judges lean on defaults like "less assertive = safer", the epistemology frays. **To stress-test it**:  
  1. Audit your judgements against ground-truth questions.  
  2. Push for tie-break transparency (e.g., "I chose A because B felt evasive").  
  3. Argue for traps/controls in your dataset.  

  This isn’t just philosophical – it’s about whether your work product is robust. If confident bluster consistently wins, the protocol needs recalibrating.
