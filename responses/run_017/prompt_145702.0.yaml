prompt: |-
  I have been reading about secession and national self-determination on my own, with no academic background in politics or philosophy, and I have found that my reactions to particular cases are far more confident than anything I can say in general. I would like to know whether there is a principle behind them, or whether some of them simply have to go. I have listed real cases I have followed in the news alongside invented ones I made up to test myself, and in each case I have given the verdict my gut delivers.

  1. Scotland 2014. The vote was authorised in advance by London, held on a clear question, and lost about 55 to 45 on a turnout of nearly 85 per cent. My verdict: this was the right way to do it, and the result was rightly accepted. I do not think Scotland was being oppressed, and I do not think that matters.

  2. Quebec 1995. Lost by about 50.6 to 49.4 on a very high turnout, on a question that bundled sovereignty together with an offer of a new partnership with Canada. My verdict: a margin of that size should not dissolve a country, and the question was not clear enough for the vote to settle anything. I find myself agreeing with the later Canadian position that both the question and the majority have to be clear, and with the Supreme Court's view that a unilateral secession would not be lawful.

  3. Catalonia 2017. The referendum was ruled unconstitutional and suspended, held anyway, and won over 90 per cent of votes cast on a turnout of about 43 per cent, with a declaration of independence following. My verdicts here do not fit together: I think the police violence used to stop the vote was wrong; I do not think the declaration that followed was legitimate; and yet I cannot accept that the matter is closed by a constitution's declaration that the nation is indivisible. The Catalans are not an oppressed people, and still it seems wrong to me that a durable majority in Catalonia may never be able to obtain a lawful vote. This is the case I keep changing my mind about.

  4. A wealthy province that contributes much more in taxes than it receives, with no distinct language or history of its own, votes 60 per cent to secede, and the campaign argues openly about money. My verdict: not a good enough reason. But if I change the case so that the province has its own language and 70 per cent support, I find it very hard to say no, even though everyone knows the money is also part of the motive. The motive test seems to collapse under pressure, and I do not know what to do about that.

  5. A border region whose population shares the language and ancestry of the neighbouring state votes 62 per cent to leave and be absorbed by that neighbour. My verdict: this strikes me as much worse than ordinary secession, more like annexation with extra steps, even though I have no reason to doubt the votes were genuine. If what matters is what the people want, why should the destination matter?

  6. Within that same border region, a coastal district votes 70 per cent against joining the neighbour and would become a small minority in the new state. My verdict: the district should get its own say, either through a border adjustment or through the right to remain. But I can see that this threatens to recurse down to towns and neighbourhoods, and I cannot say where it should stop.

  7. A linguistic minority spread thinly across a whole country, a majority nowhere, asking not for a state but for control over schools, language and land use. My verdict: this is the strongest case on my list, and it makes me suspect that self-determination is not really about statehood at all, which sits badly with how strongly I react to case 1.

  8. A region whose departure would leave the remainder with a debt it cannot service, or would cut off its water supply or break a defence treaty. My verdict: the remainder is entitled to a say, and you cannot simply walk away from joint obligations. What worries me is that this hands a rich remainder a veto over a poor region's departure, and that in the reverse case it gets used to tell people they are trapped.

  9. A small island that was a separate country until it was absorbed into a federation sixty years ago, with 60 per cent support for independence, economically viable, no oppression, and a federal constitution that forbids secession. My verdict: it should be allowed to leave. So I reject any rule on which mistreatment is the only thing that generates a right.

  10. A region votes 55 per cent to secede on an explicit platform of stripping the minority language of official status. My verdict: genuinely unsure. I recoil from it, but making the liberal character of the prospective state a condition seems to let a parent state veto any secession by alleging that the successors are bigots.

  I have gathered that writers distinguish a right to secede as a remedy for mistreatment from some sort of standing right of a people to decide its own political future, but I may be mangling that, so please put it in your own terms if it is relevant.

  Is there a single principle, or a small set of candidates, that captures these verdicts or nearly all of them? Please state it precisely, say which of my cases motivates each of its clauses, and tell me which of my verdicts it cannot accommodate and would have me give up. I would also like it applied to two cases I have not listed: a unilateral declaration of independence made after a parent state has repeatedly refused to permit any vote at all, and a secession that a majority of the whole country supports as well as a majority of the region. Finally, tell me which of my reactions you think is not a considered judgement but a prejudice dressed up as one, and why.
reasoning: |-
  Okay, the user has presented a complex set of cases about secession and self-determination, each with their own gut reactions. They're clearly well-read but lack formal academic background. I need to unpack their scenarios systematically.

  First, looking at their examples - from Scotland to Quebec to Catalonia - they're wrestling with the tension between procedural legitimacy and substantive justice. Their instinctive approvals (Scotland) and rejections (border annexation) reveal deeper principles they haven't articulated yet. The invented cases particularly show where their intuitions conflict, like in the linguistic minority case versus the debt-trapped region.

  Hmm, what's really driving their confusion? They keep circling back to three pain points: when majorities should count, how to weigh historical/cultural factors, and whether bad motives invalidate self-determination. That Catalan case clearly haunts them - police violence feels wrong but the rushed declaration also feels illegitimate. Classic procedural vs outcome tension.

  The underlying framework needs to reconcile four things: 1) clear democratic process (hence Scotland works), 2) protection against permanent minorities (hence district opt-out), 3) continuity of essential obligations (debt/water cases), and 4) rejecting discriminatory states (their recoil from language-stripping). 

  Ah! The remedial-right-only approach fails them with the peaceful island case. But pure "will of the people" collapses with the tax-dodging province. So we need a hybrid model where procedural fairness creates presumptive legitimacy, but subject to substantive limits.

  For their unlisted cases: if a parent state blocks all votes, unilateral action becomes more defensible - that's consistent with their police-violence objection in Catalonia. And whole-country approval? That ironically weakens the case since it suggests accommodation might be possible within the state.

  Their weakest spot? Probably case 4 where they excuse cultural motives but reject financial ones. That's arbitrary - both are legitimate interests. I'll need to gently point out that consistency requires accepting fiscal self-interest as valid if procedural bars are cleared.

  The linguistic minority case is their strongest because it exposes how statehood isn't the only form of self-determination. That insight should anchor the framework - self-determination as variable geometry rather than binary independence.
answer: |-
  Based on your thoughtful analysis and struggles, your intuitions align remarkably well with a **Procedural Legitimacy Model with Substantive Constraints**, grounded in democratic principles and minority protections. Here's the principle distilled, its application to your cases, and where it might challenge your instincts:

  **The Principle:**
  *A region has a legitimate claim to secede if:*
  1.  **Clear Democratic Mandate:** A supermajority (e.g., ≥60%) within the region supports secession in a free, fair, and *authorized* referendum on a clear question.
  2.  **Protection of Minorities:** The seceding entity provides credible guarantees protecting the fundamental rights and legitimate interests of minorities within its new borders and fulfills existing joint obligations to the rump state (debt, essential resources, treaties).
  3.  **Negotiation Requirement:** Secession must be pursued through negotiation with the parent state *or* is justified as a remedy for persistent, severe injustice (oppression, denial of self-government) where negotiation is impossible.
  4.  **Rejection of Discriminatory States:** Secession aimed at establishing an illiberal state that violates fundamental human rights lacks legitimacy, even if procedurally sound.

  **Application to Your Cases & Motivating Clauses:**

  1.  **Scotland 2014:** **Fits.** Met Clause 1 (authorized, clear question, high turnout). Result accepted. Clause 2/3 not triggered. *Motivates Clause 1 (Authorization/Clear Process).*
  2.  **Quebec 1995:** **Fits.** Failed Clause 1 (margin too narrow, unclear question). *Motivates Clause 1 (Clear Mandate/Supermajority Threshold).*
  3.  **Catalonia 2017:** **Mixed fit.** Failed Clause 1 (unauthorized, suppressed vote, low turnout, unclear legitimacy). Clause 3 partially motivates concern (denial of vote *could* become injustice). Your discomfort reflects the tension: the *process* was illegitimate, but the *underlying right to seek a vote* (Clause 3 precursor) feels valid if a durable majority exists. *Motivates tension in Clause 1 (Authorization) vs. Clause 3 (Remedy for Denial).*
  4.  **Wealthy Province (60%, money motive):** **Fits.** Fails Clause 1 (supermajority not met). Motive alone is insufficient without clear mandate. *Wealthy Province (70%, language/history):* **Fits.** Meets Clause 1 threshold. Motive is irrelevant if mandate is clear and Clauses 2-4 are met. *Motivates Clause 1 (Supermajority Threshold) and shows motive is secondary to process.*
  5.  **Border Region Absorption (62%):** **Fits.** While Clause 1 might be met (if 60% is threshold), strong concern for Clause 2: Minority protection? Clause 3: Negotiation? Feels like annexation bypassing norms. "Destination matters" because it impacts minority rights (Clause 2) and regional stability (implied in negotiation). *Motivates Clause 2 (Minority Protection/Stability).*
  6.  **Coastal District (70% against):** **Fits.** Clause 2 (Protection of Minorities) strongly applies. A district forming a concentrated minority facing drastic change *should* have a say (e.g., opt-out). Recursion stops at coherent administrative units with a distinct interest. *Motivates Clause 2 (Protection of Concentrated Minorities).*
  7.  **Dispersed Linguistic Minority:** **Fits perfectly.** Demonstrates self-determination ≠ statehood (Clause 3 precursor). Legitimate claims are for autonomy/rights, satisfying self-determination without secession. *Motivates that self-determination is broader than secession (informs Clause 3 'remedy' scope).*
  8.  **Region Leaving Debt/Water Crisis:** **Fits.** Clause 2 (Fulfill Obligations) applies directly. The rump state has a legitimate interest. Not a *veto*, but a requirement to *negotiate* a solution (debt apportionment, water treaty) before secession is complete. Prevents trapping *or* irresponsible exit. *Motivates Clause 2 (Fulfill Joint Obligations).*
  9.  **Peaceful Island (60%, banned):** **Fits.** Meets Clause 1 (if 60% is accepted threshold) *and* Clause 3: Persistent denial of a democratic vote on status *is* a form of injustice justifying remedial action, even without oppression. Constitutional ban doesn't override democratic will + denial. *Motivates Clause 3 (Remedy for Denial of Self-Determination).*
  10. **Secede to Strip Minority Language (55%):** **Fits.** Fails Clause 1 (supermajority not met) *and* fails Clause 4 (Rejection of Discriminatory States). Motive/intent *does* matter for legitimacy if it violates core rights. Parent state alleging bigotry needs evidence, not just assertion. *Motivates Clause 4 (Anti-Discrimination) and reinforces Clause 1 (Supermajority).*

  **Unlisted Cases:**

  *   **UDI after Repeated Vote Denial:** **Legitimate under this principle.** Persistent refusal constitutes the injustice justifying remedial action (Clause 3). The UDI must still strive to meet Clause 1 (organize a free/fair vote ASAP) and adhere to Clause 2 (protect minorities/obligations). Your reaction to police brutality in Catalonia aligns with this.
  *   **Secession Supported by National Majority + Regional Majority:** **Strengthens legitimacy immensely.** Meets Clause 1 (regional mandate) and removes the primary obstacle in Clause 3 (negotiation requirement is inherently fulfilled). Highly legitimate.

  **Verdicts to Reconsider:**

  *   **Case 4 (Wealthy Province, 70% + Language):** Your instinct ("very hard to say no") is correct under this principle. The motive (money) is irrelevant if the procedural bar (Clause 1) is met and substantive constraints (Clauses 2 & 4) are satisfied. Distinguishing based *only* on motive (money vs. culture) when process is sound is inconsistent. The principle accommodates both if the threshold is met.
  *   **Case 5 (Border Absorption):** Your strong negative reaction ("much worse") might overstate it under this principle. If the *process* meets Clauses 1 & 3 (clear mandate, negotiation) and *outcomes* meet Clause 2 (minority protection in the new state), absorption isn't inherently worse than creating a new state. Your concern likely stems from valid fears about minority rights (Clause 2) and potential coercion by the neighbor (violating Clause 3 negotiation), which the principle addresses. The "destination" matters because of its *impact* on Clauses 2 and 3, not inherently.

  **Underlying Philosophy:**

  You intuitively grasp the distinction between "remedial right only" (secession as last resort for injustice) and "primary right" (peoples have an inherent right to choose). Your principle blends them: It leans towards a primary right *contingent* on democratic process and respect for obligations/minority rights (Clauses 1 & 2), but explicitly allows remedial action for denial of self-determination or severe injustice (Clause 3), while setting a firm barrier against illiberalism (Clause 4). This reflects liberal nationalist and democratic theory perspectives (e.g., Allen Buchanan's constraints on secession, democratic will theories).

  This framework provides a coherent structure for your instincts, requiring only minor adjustments (accepting valid fiscal motives with a clear mandate, slightly moderating the annexation aversion if process/outcomes are sound). It highlights that self-determination is primarily about *process* and *protection*, not just statehood or motive.
