prompt: |-
  I write a monthly column for a popular history magazine where I take apart one viral claim about the past — Atlantis, the pyramid-builders having been taught by visitors from somewhere else, and every few months a version of the theory that everything we call ancient history is a recalibrated duplicate of medieval history, so that the "Roman" empire and some later empire are really the same events filed under different names. I also babysit the comment section, which is where I keep running into the thing I want a word for.

  Here's the pattern. The theory's selling point is how much it explains. One story covers the pyramids in Egypt and the ones in Mexico, flood myths on five continents, the megaliths, the star alignments, the odd double-datings in the king lists. And the coverage is offered as evidence: look how many separate things this accounts for. But when I actually check, each individual link is thin, and every link has its own seperate little assumption bolted on — this one needs the myths to have travelled, that one needs the dating tables to have been tampered with, the other needs a name to have been mistranscribed — and the bolted-on assumptions have nothing to do with each other. So it's one story with a different excuse for every item. My readers feel this and come away thinking there must be something to it; I feel it and come away thinking it's the reason to distrust it.

  Things it isn't, or isn't only:

  - It's not that the theory can't be proven wrong. These things usually do stick their necks out — specific dates, specific identifications of one ruler with another, even "you will find such-and-such beneath this site" — and sometimes they get flatly refuted and it doesn't seem to cost them anything with their fans.
  - It isn't the move where you dump so many arguments that the other person can't answer them all in the time available. There's no clock here. I can take six months and check every link, and I have, and the breadth still does its work on people afterwards.
  - Someone in my comments said "just-so story", but as far as I can tell that's about inventing an explanation for a single trait after the fact, not about a whole system spanning continents and centuries.
  - And I don't think breadth by itself can be what's wrong. I keep coming back to Wegener and continental drift: a guy matching coastlines, fossils and rock types across oceans, a pile of weak correspondences, no mechanism, most geologists laughing — and it turned out to be right. So whatever is off about the fringe version, it can't just be "a lot of thin links held together by a story."

  So: is there an established concept for this specific thing — a theory that gets credit for how much it covers, where the coverage is bought with a separate free parameter per item, and where refuting an item doesn't cost the theory its audience? If nothing fits, I need a name I can actually use in print, with a definition sharp enough that my readers could apply it themselves. Please don't just hand me a label or a reading list: I want to know what the phenomenon is, what it isn't, and where it stops. In particular I'd like the boundary cases sorted: a broad comparative-mythology synthesis from a real scholar; a diffusionist account of a single technology that most specialists reject but which isn't crazy; and an archaeological claim that's mostly right but whose dating is off by three centuries. Which of those are cases of the thing and which aren't, and by what test?

  End your reply with a single line in exactly this form: \answer{...} containing either the established term or, if there isn't one, the two-or-three-word term you're proposing.
reasoning: |-
  Okay, the user writes a monthly column debunking viral historical claims and needs a term for a specific pattern they observe. They describe theories that seem impressive because they explain many things—like connecting pyramids, flood myths, and star alignments across different cultures. But each connection relies on separate, unconnected assumptions. Even when individual points are refuted, the theory still retains credibility among its followers. The user wants a precise term for this phenomenon, something they can use in their column to help readers identify and understand it.

  First, I need to understand the core issue. The theories gain appeal from their breadth—covering many phenomena—but each piece of evidence requires its own ad hoc assumption. For example, one part might assume myth transmission, another requires tampered records, and so on. These assumptions don't connect back to a central mechanism; they're just bolted on as needed. Even when specific claims are debunked, the overall theory doesn't lose support because proponents focus on the remaining points. 

  The user has already ruled out several possibilities: it's not about unfalsifiability (since these theories often make testable claims), nor about argument overload (they have time to debunk each point), nor just "just-so stories" (which are single explanations, not systemic). They also mention continental drift as a counterexample—Wegener had multiple weak links but was eventually proven right. So the issue isn't just having many weak links; it's how those links are supported. 

  The key differentiator seems to be the *ad hoc* nature of the assumptions. Each piece of evidence requires its own unsupported fix, and these fixes don't cohere into a unified explanation. In science, a theory with too many free parameters (unjustified assumptions) is often criticized as "unparsimonious" or violating Occam's razor. Terms like "overfitting" from statistics come to mind—where a model is too complex and fits noise rather than the underlying pattern. 

  For fringe theories, "crank magnetism" describes how such ideas attract multiple unfounded claims, but it's informal. "Ad hoc hypothesis" is a formal term for explanations introduced solely to save a theory from refutation. Combining these, "ad hoc harmonization" might capture the process of forcing disparate facts to fit a narrative using separate, unconnected assumptions. 

  Now, considering the boundary cases: 

  1. **Comparative mythology by a real scholar**: They'd use cross-cultural patterns supported by evidence (e.g., linguistic or archaeological links) without arbitrary assumptions. Not the problematic pattern.  
  2. **Rejected diffusionist account**: If it relies on one central mechanism (e.g., trade routes) with consistent evidence, even if contested, it's not the same. But if it invokes separate excuses for each artifact (e.g., "this was traded, that was independent invention"), it might edge closer.  
  3. **Mostly right claim with dating errors**: A single correctable mistake isn't the issue; it's the systemic use of multiple unrelated assumptions.  

  The test would be: Does each element require its own *unjustified, disconnected* fix? If yes, it's the pattern.  

  Proposed term: **Ad hoc harmonization** (descriptive) or **fragile universalism** (more evocative). Since no perfect established term exists, I'll suggest "ad hoc harmonization" for clarity.
answer: |-
  Based on your description, you're identifying a specific epistemic flaw: **a theory that gains persuasive power from its apparent explanatory breadth, but achieves this breadth by attaching independent, unsubstantiated assumptions to each disparate piece of evidence, resulting in a fragile structure where refuting individual components doesn't diminish its appeal because the core narrative absorbs the damage.**

  ### The Phenomenon: Core Characteristics
  1. **Explanatory Breadth as Credibility**: The theory's primary selling point is its ability to "explain" a wide array of unrelated phenomena (pyramids, flood myths, star alignments, etc.).
  2. **Per-Item Assumptions**: Each element in the theory requires its own unique, unsupported auxiliary hypothesis (e.g., myths must have traveled independently, records must have been tampered with, names must have been mistranscribed). These assumptions lack a unifying mechanism and are often mutually irrelevant.
  3. **Refutation-Proofing**: Disproving one component (e.g., a specific dating claim) doesn't collapse the theory. Proponents dismiss it as an isolated error while clinging to the remaining unexplained phenomena as "proof" of the core idea.
  4. **Narrative Over Evidence**: The *story* (Atlantis, global medieval recasting) remains intact because its appeal lies in its coherence as a grand tale, not in empirical rigor.

  ### Why Existing Terms Fall Short
  - **Just-So Story**: Focuses on *post-hoc* explanations for single traits (e.g., "giraffes have long necks to reach leaves"), not systemic harmonization of disjointed evidence.
  - **Unfalsifiability**: These theories often *are* falsifiable at the micro-level (e.g., carbon dating refuting a timeline), but the macro-narrative evades falsification.
  - **Gish Gallop**: Involves overwhelming with arguments; here, the breadth itself is the persuasive device, not the volume of arguments in a debate.
  - **Crank Magnetism**: Describes fringe theories attracting multiple unsupported ideas but doesn't capture the *structural* flaw of per-evidence assumptions.

  ### The Best Fit: **Ad Hoc Harmonization**
  This term combines two established concepts:
  - **Ad Hoc Hypothesis**: An auxiliary assumption added solely to save a theory from refutation, without independent justification.
  - **Harmonization**: The forced reconciliation of disparate data into a single narrative.

  **Definition**:  
  *Ad hoc harmonization* occurs when a theory purports to explain diverse evidence by invoking unique, unsupported assumptions for each data point, creating an illusion of explanatory power. The narrative's coherence depends on these disconnected fixes, allowing it to withstand localized refutations.

  ### Boundary Cases: Applying the Test
  **Test for *ad hoc harmonization*:**  
  *Does the theory require **distinct, unjustified assumptions** for **each major piece of evidence**, where these assumptions are neither derived from a core mechanism nor supported independently?*

  1. **Comparative Mythology (Real Scholar)**  
     - *Example*: Scholarly work linking Indo-European flood myths via linguistic/cultural phylogeny.  
     - **Assessment**: **NOT ad hoc harmonization**. Assumptions (e.g., proto-myth diffusion) are unified under a testable framework (linguistics, archaeology). Evidence is integrated via a central mechanism, not one-off fixes.

  2. **Rejected Diffusionist Account**  
     - *Example*: Claim that Phoenicians brought bronze-working to Scandinavia, rejected due to lack of evidence.  
     - **Assessment**: **NOT ad hoc harmonization** if it relies on a *single* central claim (e.g., trade routes). It becomes ad hoc harmonization **only** if it invokes separate excuses for each anomaly (e.g., "this artifact was traded, that one was independently invented but looks similar due to climate, this inscription is a forgery...").

  3. **Mostly Correct Claim with Dating Error**  
     - *Example*: A site is dated 300 years too early due to contaminated samples, but the core interpretation holds.  
     - **Assessment**: **NOT ad hoc harmonization**. A single dating error is a localized mistake, not a systemic pattern of attaching unique assumptions to each element. The core theory doesn't rely on *multiple* disconnected fixes.

  ### Why "Ad Hoc Harmonization" Works
  - **Precision**: Targets the *method* (harmonizing via ad hoc fixes), not just the outcome.
  - **Diagnostic Utility**: Readers can ask: "Does each 'explained' item need its *own* unsupported excuse?"
  - **Contrasts with Legitimate Synthesis**: Scholars use *parsimonious* harmonization (e.g., plate tectonics explaining fossils, coastlines, and earthquakes via one mechanism). Fringe theories use *disparate* fixes.

  ### Key Takeaway for Your Column
  Explain that **ad hoc harmonization** is the intellectual equivalent of propping up a rickety bridge with unrelated scraps of wood—each plank is a weak, custom-made excuse for why *this specific part* doesn't collapse. The bridge seems impressive because it spans a wide gap, but its stability is illusory; removing one plank doesn't topple it, but the whole structure is unreliable.

  \answer{ad hoc harmonization}
