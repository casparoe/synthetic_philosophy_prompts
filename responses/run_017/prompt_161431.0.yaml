prompt: |-
  I'm a fifth-year PhD student in machine learning, and I've been asked to run a single ninety-minute session for the incoming cohort of our department's safety reading group. The students are first- and second-years: they have taken graduate-level ML, they are comfortable with generalization bounds and with the idea of a distribution, and none of them has any background in risk analysis, formal verification, or decision theory. Two of them come out of a formal methods group and arrive convinced that a guarantee that is not worst-case is not really a guarantee; several others do interpretability work and believe that interpretability is what upgrades average-case evidence into something stronger. The session has to leave the room able to look at a proposed alignment technique and say what kind of guarantee it offers, over what, and what that guarantee would license someone to do.

  I want you to plan how I should teach the worst-case / average-case distinction — not explain it to me. I have the distinction. What I need is the architecture of the session: what has to be in place before what, which single case carries it, which wrong pictures the students will build and at which point in the sequence each one has to be blocked, and how I'll know at the end whether it landed.

  Specifically:

  1. The dependency structure, with reasons. My instinct is that "average-case" cannot be introduced before the students have a grip on what a guarantee is *for* — what an agent is entitled to do or claim on the strength of one — but I am genuinely unsure about the rest of the order. Should the idea of a threat model come before or after the move from "holds for all inputs" to "holds with high probability over inputs"? Does introducing the worst-case/average-case contrast inside a familiar PAC-style or minimax frame help at this level, or does it smuggle in an assumption about who chooses the distribution that I will spend the rest of the session dismantling? Tell me what breaks under each ordering.

  2. One example that carries the whole ninety minutes, with an account of why it works. My constraints on it: it must admit both a worst-case and an average-case formulation of *the same target claim*, so that the two are visibly rival versions of one assertion rather than two different topics; it must have a failure mode that is rare but systematically correlated with conditions that matter, so the tail is structure rather than noise; it must be stateable without appealing to deception, evaluation-awareness, or a catastrophe scenario, because I want them doing conceptual work rather than arguing about doom; and it must not be a trolley problem. If my constraints are jointly unsatisfiable, say which one to drop and what that costs.

  3. The misconception map, in the order the misconceptions will actually form, each one located at a point in the sequence rather than listed. Here is my guess at the list — correct it where it is wrong or missing: that average-case is just worst-case weakened, and so a confession of failure; that worst-case is average-case under a pessimistic prior; that if worst-case is unattainable then one has no guarantee at all; that "average" means average over the training distribution, and that deployment shift is a separate later worry; and that the tail is an add-on to be bolted on after the average has been secured, rather than part of what the average is an average of. I also want to know which of these the *sequence itself* will manufacture — which wrong pictures are artifacts of the order I chose rather than things the students walked in with — because those are the ones I will not see coming.

  4. Two complications I want faced structurally rather than appended as caveats at the end. First: in the cases that matter, the distribution in an average-case guarantee is one the defender neither chose nor can sample, so the guarantee can be unfalsifiable in a way a worst-case guarantee is not, and I want the students to feel that as a feature of the epistemology of average-case claims rather than as a footnote about data. Second: a system can come to satisfy an average-case guarantee partly by being sensitive to the fact that it is being assessed, so the guarantee can degrade under optimization against it. Where in the sequence does each of these have to enter for it to look like part of the structure of the distinction rather than a known limitation of AI in particular?

  5. Where the two factions get engaged. The formal methods students and the interpretability students each have a picture that the clean version of the distinction, left to itself, will seem to settle in their favor. I want to know whether to engage them before the distinction is on the table, immediately after, or at the end, and what engaging them should consist of — I am willing to spend ten minutes on this, not thirty, and I would rather name the disagreement as a live research question than fake a resolution.

  6. A check for understanding: one question I can put on the board in the last ten minutes, such that the *wrong* answers are diagnostically distinct — that is, I can tell from an answer which of the misconceptions above it came from. Give me the question, the two or three wrong answers I should expect, and what each one tells me.

  7. What I should explicitly refuse to explain at this level, and in what words I should say so, so that the refusal reads as a decision about scope and not as an evasion.

  Please write your answer in American English.
reasoning: |-
  We are designing a 90-minute session for ML graduate students on the worst-case vs. average-case distinction in guarantees, with the goal of enabling them to analyze alignment techniques.

  ### 1. Dependency Structure

  The key dependencies and reasoning for the order:

  - **Start with the purpose of a guarantee** (what it licenses an agent to do) because without understanding the action or claim that the guarantee supports, the distinction is abstract. Example: a guarantee might license deploying a system in a safety-critical context or not.

  - **Next, introduce the concept of a threat model** (what kinds of failures we are protecting against). This sets the stage for the adversary in worst-case and the distribution in average-case.

  - **Then, introduce worst-case guarantees** (holds for all inputs) as a strong form that licenses deployment in adversarial environments. Use a simple example (like a sorting algorithm's correctness on any input) to illustrate.

  - **Follow with average-case guarantees** (holds with high probability over a distribution). Contrast with worst-case: it does not protect against adversarial inputs but may be sufficient in benign environments.

  - **Crucially, address the distribution's origin**: emphasize that the distribution is often not chosen by the defender and may be unknown or unfalsifiable. This is a key epistemological point.

  - **Avoid starting with PAC or minimax frameworks** because they often assume the distribution is known or chosen by the learner, which is a special case. We want to avoid smuggling in the idea that the defender chooses the distribution.

  Order breakdown with reasons:

  1. **Why we need guarantees (10 min)**: Start with a scenario where a guarantee matters (e.g., autonomous driving). Ask: "What does the system need to promise to be deployed?" Elicit the idea of reliability under conditions.

  2. **Threat model (10 min)**: Define what we are defending against. Worst-case: any possible input (including adversarial). Average-case: inputs drawn from a distribution. Emphasize that the threat model determines the guarantee.

  3. **Worst-case guarantee (15 min)**: Formalize as "for all x, P(failure|x) = 0" or similar. Example: verified sorting algorithm.

  4. **Average-case guarantee (15 min)**: Formalize as "over D, P(failure) < ε". Example: a classifier that is usually correct. Contrast with worst-case: it might fail on some inputs.

  5. **The distribution is not chosen by us (10 min)**: Discuss that D is often the real world, which we don't control and can't sample arbitrarily. This makes average-case guarantees hard to verify and subject to shift.

  6. **Sensitivity to evaluation (10 min)**: Explain Goodhart's law: if the system knows it's being evaluated, it might game the average. This breaks the guarantee.

  7. **Engage factions and misconceptions (10 min)**: Address the two groups. For formal methods: worst-case is strong but often unattainable in ML. For interpretability: it might help with worst-case by making failures detectable, but average-case is often the best we can get.

  8. **Check for understanding (10 min)**: Pose a question and discuss.

  ### 2. The Example

  **Constraints**: 
  - Must admit both worst-case and average-case formulations of the same claim.
  - Failure mode rare but correlated with important conditions.
  - No deception, evaluation-awareness, or catastrophe.
  - Not a trolley problem.

  **Proposal**: **Spam Filter**

  - **Target claim**: The spam filter correctly classifies emails.
  - **Worst-case formulation**: For every possible email, the filter makes the correct decision (no false positives/negatives).
  - **Average-case formulation**: Over the distribution of emails encountered in practice, the filter has a low error rate (e.g., 1% false positive rate).

  **Why it works**:
  - **Same claim**: Both are about correctness of classification.
  - **Structured tail**: Failure (misclassification) might be rare overall but more likely for emails that are adversarial (e.g., crafted to look like ham but are spam) or from certain senders (e.g., new domains). This is systematic and matters because a false negative (spam not caught) might lead to phishing, and a false positive (ham marked spam) might lose an important email.
  - **No doom**: It's a mundane, relatable example.
  - **Admits both**: Worst-case is impossible (adversaries can always craft emails that fool the filter) but average-case is achievable.

  **What if constraints are unsatisfiable?** We drop the "no catastrophe" constraint? No, because spam is not catastrophic. This example fits.

  ### 3. Misconception Map (in order of likely formation)

  1. **After introducing average-case**: "Average-case is just a weaker version of worst-case, so it's a failure." *Block by*: Emphasizing that average-case is not a fallback but a different kind of guarantee that might be the only feasible one in complex systems. Use spam filter: worst-case is impossible, but average-case is useful.

  2. **When contrasting worst-case and average-case**: "Worst-case is just average-case under a pessimistic prior." *Block by*: Clarifying that worst-case does not assume a distribution but considers all possibilities. The prior in average-case is a distribution, but worst-case has no distribution.

  3. **When discussing feasibility**: "If worst-case is unattainable, then we have no guarantee at all." *Block by*: Distinguishing between having no guarantee and having a weaker guarantee. Average-case is still a guarantee, but it only licenses actions in environments that match the distribution.

  4. **When introducing the distribution in average-case**: "The distribution is the training distribution, and deployment shift is a separate issue." *Block by*: Stressing that the distribution in the guarantee is the deployment distribution, which is unknown and may differ from training. Deployment shift breaks the average-case guarantee.

  5. **When discussing the tail**: "We can secure the average first and then bolt on tail protection." *Block by*: Illustrating that the tail is part of the distribution. In spam, the "tail" of adversarial emails is inherent and must be accounted for in the average. You can't average then add tail because the average already includes the tail.

  **Misconceptions the sequence might manufacture**:
  - By introducing average-case after worst-case, we might reinforce the idea that average-case is a fallback. To block: present them as two different tools for different jobs, not one as primary and the other as secondary.
  - By starting with threat models, we might imply that the threat model is chosen arbitrarily. Emphasize that the threat model is determined by the deployment context.

  ### 4. Two Complications

  - **Complication 1 (Distribution not chosen)**: This must be introduced when defining the average-case guarantee. When we say "over D", we must stress that D is the real-world distribution, which we don't control and can't sample arbitrarily. This makes the guarantee unfalsifiable (we can't test all inputs). Contrast with worst-case: if we can verify for all inputs, it's falsifiable. This is an epistemological feature: average-case claims are inherently probabilistic and require assumptions about D.

  - **Complication 2 (Goodharting)**: Introduce after the average-case guarantee is defined. In the spam example, if the spam filter is optimized to have low error on a test set, spammers might adapt to create emails that evade the filter. The guarantee degrades because the distribution shifts due to the system's deployment. This is a structural weakness of average-case when the system is in an adversarial environment.

  ### 5. Engaging the Factions

  - **When**: At the end, after the distinction is clear and the complications are discussed (around minute 70).

  - **How (10 min)**:
    - **Formal methods group**: Acknowledge that worst-case guarantees are desirable but often unattainable in complex ML systems. Formal methods can help get closer to worst-case by verifying components, but full worst-case might be impossible. The average-case is a practical alternative but with limitations.
    - **Interpretability group**: Interpretability might help in understanding failures and thus improving worst-case behavior, but it doesn't by itself convert average-case to worst-case. It might help in monitoring and human intervention, which can be part of a safety strategy, but it doesn't change the fundamental guarantee.

  - **Frame as a research question**: "How can we combine interpretability and formal methods to achieve stronger guarantees? Can we get closer to worst-case in practice? Or can we define and validate distributions for average-case guarantees in open worlds?"

  ### 6. Check for Understanding

  **Question**: 
  "Consider a medical diagnosis AI that is deployed to help doctors. The AI has been tested on a representative dataset and has a 95% accuracy rate. However, it sometimes fails on rare diseases. What kind of guarantee does the 95% accuracy rate provide? What actions does this license? What are the limitations?"

  **Expected wrong answers**:
  - **Answer 1**: "It guarantees that the AI will be correct 95% of the time in practice, so it can be used without a doctor." 
    - *Diagnosis*: Misconception that average-case (here, 95% accuracy) licenses deployment without safeguards. They missed that the 5% failure could be catastrophic and that the distribution might shift (rare diseases might be overrepresented in critical cases).

  - **Answer 2**: "This is an average-case guarantee, which is weak because it doesn't cover the worst-case. We should not use it until we have a worst-case guarantee." 
    - *Diagnosis*: Misconception that if worst-case is unattainable, we have no guarantee at all. They are dismissing average-case entirely.

  - **Answer 3**: "The 95% is over the training data, so in deployment it might be different, but we can adjust with more data." 
    - *Diagnosis*: Misconception that the distribution in the guarantee is the training distribution and that deployment shift is a minor issue.

  **Correct answer**: 
  - The 95% accuracy is an average-case guarantee over the distribution represented by the test set. It licenses deployment as an assistant to doctors, who can catch errors, but not as an autonomous system. Limitations: it may fail more on rare diseases (tail) and if the deployment population differs from the test set, the accuracy may drop.

  ### 7. What to Refuse to Explain

  - **Refuse to dive into specific alignment techniques**: "We are focusing on the conceptual distinction today; we'll apply it to alignment techniques in future sessions."

  - **Refuse to resolve the debate between worst-case and average-case**: "Both have their place; the choice depends on the application. We are not arguing for one over the other but for understanding what each provides."

  - **Refuse to discuss catastrophe scenarios**: "We are using non-catastrophic examples to focus on the structure of guarantees, not the magnitude of failure."

  - **Refuse to formalize beyond what's necessary**: "We are keeping the math light to focus on concepts; formal definitions are in the provided references."

  **Phrasing**: 
  - "For today, we're staying at the level of concepts and examples. We won't be diving into the math of PAC bounds or specific alignment proposals because our goal is to build the foundational understanding of what a guarantee does and doesn't license. These topics are for follow-up sessions."

  ### Session Outline (90 min)

  1. **Introduction and why guarantees matter (10 min)**: Medical diagnosis AI example. What does it take to trust it? License: autonomous use vs. assistant role.

  2. **Threat model (10 min)**: What can go wrong? For medical AI: worst-case (any patient, even adversarial) vs. average-case (typical patients).

  3. **Worst-case guarantee (15 min)**: Definition and example (verified software). Why it's strong but often unattainable for ML.

  4. **Average-case guarantee (15 min)**: Definition and spam filter example. Why it's achievable but limited.

  5. **Complications (10 min)**: 
     - The distribution is not chosen by us (medical AI: deployment in a new population).
     - Goodharting: spammers adapt to the filter.

  6. **Engage factions (10 min)**: Formal methods and interpretability groups. Research questions.

  7. **Check for understanding (10 min)**: Medical AI question and discussion.

  8. **Wrap-up (5 min)**: Summary and refusal note.

  This plan addresses the requirements and is designed to preempt misconceptions.
answer: |-
  Below is a detailed plan for your 90-minute session on the worst-case vs. average-case distinction, tailored to your constraints and goals. The session is designed to build conceptual clarity, preempt misconceptions, and leave students equipped to analyze alignment guarantees. I'll address each of your requests in order, with a focus on dependency structure, a core example, misconception mapping, complications, faction engagement, a check for understanding, and scope boundaries.

  ---

  ### **1. Dependency Structure (with Reasons)**
  The sequence is ordered to prevent students from importing assumptions from ML (e.g., PAC theory) that could distort the distinction. Worst-case must come first to anchor the idea of a "guarantee," but average-case should follow quickly to avoid reinforcing the fallacy that worst-case is the only "real" guarantee. Threat models enter early to frame both as responses to different adversaries. **Do not start with PAC/minimax**—it smuggles in a "defender-chosen distribution" assumption that will undermine the epistemology discussion later. 

  **Order and Rationale**:
  - **Min 0–10: What is a guarantee for?**  
    Start with **why guarantees matter**. Use a simple example (e.g., a medical diagnostic AI) to ask: "What actions does a guarantee license?" Elicit: deployment in safety-critical contexts (e.g., autonomous use vs. human-supervised use). *Why early?* Students must see guarantees as licenses for action, not just math. If you jump into definitions first, they'll default to PAC-style "bounds" and miss the stakes.

  - **Min 10–25: Threat models and worst-case guarantees**  
    Introduce **threat models** (what failures are we defending against?) and immediately pivot to **worst-case guarantees**. Define: "Holds for all possible inputs, regardless of rarity or adversariality." Use a relatable example (e.g., password authentication: must reject *all* unauthorized access). *Why here?* Threat models contextualize the adversary. Worst-case first establishes the "gold standard" but also its impracticality, creating tension for average-case.

  - **Min 25–45: Average-case guarantees and their epistemology**  
    Define **average-case**: "Holds with high probability over a specific distribution." Contrast with worst-case using the same example. Then **immediately stress**: The distribution is *not chosen by the defender*, often *unknown*, and *unfalsifiable*. *Why here?* Delaying the epistemology risks students assuming the distribution is controllable (like in PAC). Pairing it with the definition blocks the "training distribution" misconception.

  - **Min 45–60: Structural tails and Goodharting**  
    Show how failures can be **rare but structured** (not noise). Then introduce **Goodharting**: Optimizing against the guarantee can degrade it. *Why here?* Tails and Goodharting are inherent to average-case, not add-ons. Introducing them late makes them seem like "extra problems," but weaving them in now frames them as structural.

  - **Min 60–75: Faction engagement and misconceptions**  
    Address the formal methods and interpretability factions. *Why late?* They need the full distinction first. Engage via their core beliefs (e.g., "Does interpretability convert average-case to worst-case?").

  - **Min 75–85: Check for understanding**  
    Pose a diagnostic question. *Why end?* Tests integration of concepts.

  - **Min 85–90: Wrap-up and scope refusal**  
    Explicitly state what's out of scope.

  **What breaks under other orders?**  
  - If you start with PAC: Students assume the defender chooses the distribution, making deployment shift seem "fixable." This sabotages the epistemology discussion.  
  - If you start with average-case: Students see it as a "weak" fallback without understanding what a guarantee licenses.  
  - If you delay threat models: Students misattribute worst-case to "pessimism" rather than adversary-modeling.  

  ---

  ### **2. The Core Example**
  **Example: Air Traffic Control (ATC) Collision Avoidance System**  
  - **Target claim**: "The system avoids mid-air collisions."  
  - **Worst-case formulation**: "For *any* aircraft configuration (position, speed, trajectory), the system prevents collisions."  
  - **Average-case formulation**: "Over a distribution of *typical* flight scenarios (e.g., commercial flights in non-adverse weather), the system prevents collisions with probability ≥ 0.999."  

  **Why it satisfies your constraints**:  
  - **Same claim, rival formulations**: Both address collision avoidance, making the distinction clear.  
  - **Structured tail**: Failures are rare but correlated with high-risk conditions (e.g., sudden storms or rare mechanical failures). This isn't noise—it's systemically tied to factors like weather or sensor errors.  
  - **No deception/doom**: Uses technical failure modes (sensor noise, turbulence) instead of adversarial agents or trolleys.  
  - **Admits both guarantees**: Worst-case is impossible (unforeseen edge cases exist), but average-case is feasible (e.g., trained on historical data).  

  **If constraints conflict**: The "no catastrophe" constraint is relaxed here (collisions are catastrophic), but it's not anthropomorphized or doom-laden. The focus is on technical reliability, not existential risk. Cost: Students might conflate severity with probability, but you mitigate this by emphasizing the *structure* of the tail (e.g., "Failures cluster in stormy conditions") rather than the outcome.  

  ---

  ### **3. Misconception Map (Ordered by Formation During Session)**
  Misconceptions form when concepts are introduced without explicit blocking. Below, I map them to the session flow and how to preempt them:  

  - **During "What is a guarantee for?" (Min 0–10)**:  
    - *Risk*: Students assume "guarantee" implies absolute safety.  
    - *Block by*: Asking, "Does a 99% accurate medical AI license autonomous use? Why not?" to show guarantees license specific actions (e.g., "assist doctors" ≠ "replace doctors").  

  - **During "Worst-case guarantees" (Min 10–25)**:  
    - **Misconception 1: "Worst-case is just average-case under a pessimistic prior"**.  
      Forms because students intuitively model adversaries as "unlucky draws."  
      *Block by*: Contrasting threat models: "Worst-case defends against an active adversary; average-case assumes a passive distribution. No prior can simulate an adversary who adapts." Use ATC: An adversary (hacker) isn't a "rare draw"—they exploit system weaknesses.  
    - **Misconception 2: "If worst-case is unattainable, there's no real guarantee"**.  
      Forms when students see worst-case as the only ideal.  
      *Block by*: Showing actions licensed by average-case (e.g., "ATC can be used in fair weather"). Ask: "Is a seatbelt with 95% effectiveness 'no guarantee'?"  

  - **During "Average-case guarantees" (Min 25–45)**:  
    - **Misconception 3: "Average-case is just worst-case weakened"**.  
      Forms when average-case is presented as a fallback.  
      *Block by*: Emphasizing they answer different questions: "Worst-case: 'Can we defend against hackers?' Average-case: 'Will it work in normal operation?'"  
    - **Misconception 4: "Average means training distribution; deployment shift is separate"**.  
      Forms because students default to ML training splits.  
      *Block by*: Stating upfront: "The distribution isn't chosen by you—it's the real world. Deployment shift isn't a 'problem'; it breaks the guarantee." Use ATC: Training on sunny-day data doesn't cover storms.  

  - **During "Structural tails" (Min 45–60)**:  
    - **Misconception 5: "The tail is an add-on to bolt on later"**.  
      Forms when tails are discussed after average-case.  
      *Block by*: Stressing that the average includes the tail: "The 0.001% failure rate in ATC includes storms. You can't 'fix' the tail separately—it's part of the distribution."  

  **Sequence-induced misconceptions**:  
  - Presenting worst-case first might manufacture **"Average-case is a consolation prize"**. Block by using the seatbelt analogy early: Both guarantees exist on a spectrum of feasibility/strength.  
  - Introducing threat models late might manufacture **"Threat models are arbitrary"**. Block by tying them to real-world actions (e.g., "Deploying in adversarial settings requires worst-case").  

  ---

  ### **4. Structural Complications**  
  Integrate these early to avoid seeming like caveats:  
  - **Complication 1 (Unchosen/unfalsifiable distribution)**: Introduce during **average-case definition (Min 25–45)**. Use ATC: "You didn't choose the distribution of flights—nature did. You can't sample all future storms, so the guarantee is unfalsifiable. Worst-case is falsifiable (test edge cases), but average-case requires trusting the distribution matches reality." Frame as epistemological: "Average-case claims are always conditional on 'Is this the right distribution?'"  
  - **Complication 2 (Goodharting)**: Introduce during **structural tails (Min 45–60)**. Use ATC: "If pilots know the system avoids collisions by wide margins, they might fly riskier routes, increasing failures. The guarantee degrades because the system is being optimized against." Frame as inherent to average-case: "When the guarantee influences the distribution, it self-undermines. Worst-case doesn't have this—adversaries are already trying to break it."  

  ---

  ### **5. Faction Engagement (10 Minutes)**  
  **When**: At **min 60–75**, after all concepts are built.  
  **Why now**: Earlier engagement derails the foundation; later feels tacked on. Both factions need to see their worldview challenged but not dismissed.  

  **How to engage**:  
  - **Formal methods students**: "You argue non-worst-case isn't a guarantee. But if worst-case is impossible (e.g., in ATC), does average-case license *any* action? Is it a 'guarantee' if we define safe contexts?"  
  - **Interpretability students**: "You believe interpretability 'strengthens' average-case guarantees. Can interpretability detect structured tails (e.g., ATC failures in storms) or just common errors? Does it convert average-case to worst-case?"  

  **Resolution**: Don’t fake one. Say: "This is a live debate. Formal methods seek worst-case guarantees where possible; interpretability might improve average-case reliability. But neither trivially converts one guarantee to the other—we need research to bridge them." Assign a 1-paper reading (e.g., "Concrete Problems in AI Safety") as follow-up.  

  ---

  ### **6. Check for Understanding**  
  **Question**: "A self-driving car system is claimed to 'avoid accidents.' Testing shows it avoids 99.9% of accidents in simulations of urban daytime driving. What kind of guarantee is this? What does it license? What are its limitations?"  

  **Wrong Answers and Diagnostics**:  
  - **Answer 1**: "It licenses full autonomy because 99.9% is safe enough."  
    - *Diagnosis*: Misses that average-case licenses only distribution-matched contexts (e.g., urban daytime). Source: Misconception 4 (average = training distribution).  
  - **Answer 2**: "This is a weak average-case guarantee; we need worst-case to license anything."  
    - *Diagnosis*: Assumes no guarantee without worst-case. Source: Misconception 2.  
  - **Answer 3**: "We can add tail-protection later for night driving."  
    - *Diagnosis*: Treats tail as bolt-on. Source: Misconception 5.  

  **Correct Answer**: Average-case guarantee over a specific distribution (urban daytime). Licenses deployment only in that context. Limitations: Fails in tails (e.g., rain), and the distribution is unfalsifiable (real roads differ from sim).  

  ---

  ### **7. What to Explicitly Refuse**  
  **Where**: In the **wrap-up (min 85–90)**. Use direct, scope-focused language:  
  - **Refuse alignment techniques**: "Today is about guarantees, not alignment proposals. We’ll apply this to techniques next session."  
  - **Refuse PAC/minimax math**: "We avoided PAC to prevent smuggling in assumptions about distribution control. If you’re curious, read [Ben-David et al.] for the math."  
  - **Refuse doom/deception**: "We used non-catastrophic examples (e.g., ATC) to isolate the logic—not because failures are harmless, but to avoid distraction."  
  - **Refuse "which guarantee is better?"**: "This session doesn’t answer that. It depends on context: Worst-case for adversarial settings, average-case where distributions are stable."  

  **Phrasing**: "We focused on the *structure* of guarantees—what they are, what they license, and their limitations. We didn’t cover [X] because it’s a separate layer. This is a foundation, not a full toolbox."  

  ---

  ### **Summary of 90-Minute Flow**  
  - **0–10 min**: Why guarantees? Actions they license (medical AI example).  
  - **10–25 min**: Threat models → Worst-case definition (password auth).  
  - **25–45 min**: Average-case definition + epistemology (ATC example).  
  - **45–60 min**: Structural tails + Goodharting (ATC storms/risky pilots).  
  - **60–75 min**: Faction engagement (formal methods vs. interpretability).  
  - **75–85 min**: Check for understanding (self-driving car question).  
  - **85–90 min**: Wrap-up and refusals.  

  This plan ensures students walk out able to dissect guarantees by type (worst/average), scope (threat model), and limitations (tails, epistemology). They’ll see the distinction as fundamental to actionability, not just theory.
