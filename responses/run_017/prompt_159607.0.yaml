answer: |-
  ## Joint Statement: Adversarial Collaboration on Moral Particularism and Generalism

  **Signed:**  
  Party A (Particularist)  
  Party B (Generalist)

  After three years of debate, we agree that clarifying our positions and pinpointing precise disagreements is more valuable than continuing unproductive argument. This document represents our best joint effort to state where we agree, where we disagree, and how those disagreements might be productively explored. We define key terms explicitly within the text.

  **1. Grades of Commitment**

  *   **Party A (Particularist):**
      *   **Holds Grade (iii):** There may be true informative moral principles, but no finite, exceptionless set of action-guiding moral principles is available to creatures like us for deliberation or justification.
      *   **Explicitly Disclaims Grade (i):** I do *not* claim there are definitely no true informative moral principles whatsoever. I also **disclaim Grade (ii)** regarding the *metaphysical* grounding of correctness; my primary disagreement is epistemic/practical (Grade iii).
  *   **Party B (Generalist):**
      *   **Holds Grade (ii):** Whenever a natural feature is a moral reason (counting for or against an action) in a specific case, there *is* some true moral principle – potentially unknown, complex, or impractical – under which the case falls, and which makes that feature a reason there. This principle explains *why* it is a reason.
      *   **Explicitly Disclaims Grade (i):** I do *not* claim that competent moral judgment necessarily *uses* explicit or consciously accessible principles in real-time deliberation. I also **disclaim Grade (iii)** regarding supervenience-only; I hold that principles *explain* the supervenience relation.
  *   **Agreement on Grades:** We agree that the core live disagreement concerns **Grade (ii) for Generalism** (whether principles metaphysically *make* features reasons) vs. **Grade (iii) for Particularism** (whether such principles, if they exist, are usable by humans). We both explicitly **disclaim the strongest versions of our positions (Grade i for Particularism; Grade iii for Generalism)**. We believe distinguishing these grades clarifies that some historical quarrels (e.g., focusing solely on whether *any* principles exist, or whether humans *always* use them consciously) may dissolve into verbal disputes or miss our core disagreement once the grades are separated.

  **2. Agreed Claims**

  We jointly affirm the following substantive claims:

  1.  **Holism of Reasons:** Whether a natural feature (e.g., causing pain, keeping a promise) counts as a moral reason at all, and if so whether it counts for or against an action and with what strength, can depend on the presence or absence of other features in the specific situation. (A natural feature is any non-moral property or state of affairs.)
  2.  **Supervenience:** The moral properties of a situation (e.g., being right, wrong, good, bad) are determined by its total set of natural properties. Any two situations identical in all natural respects must be identical in all moral respects.
  3.  **No Skepticism/Relativism/Expressivism:** Moral judgments can be true or false; they are not merely expressions of feeling, commands, or relative only to a culture or individual perspective.
  4.  **Defeasibility:** Moral reasons can be outweighed (defeated) by stronger opposing reasons, or sometimes silenced entirely (rendered inoperative) by the presence of specific other features.
  5.  **Context Sensitivity:** The overall moral status of an action (right, wrong, permissible) is highly sensitive to the complex interplay of numerous features in the specific context; simple rules often fail.
  6.  **Explanatory Asymmetry:** Citing a natural feature as a moral reason (e.g., "It caused unnecessary suffering") typically provides some genuine explanation for the action's moral status, even if incomplete.
  7.  **No Algorithm:** There is no feasible decision procedure or algorithm, applicable by humans to all possible moral situations, that guarantees correct moral judgment solely by mechanically applying a finite set of input rules.
  8.  **Learning & Generalization:** Humans learn morally relevant patterns from experience and often use generalizations (like "Lying is usually wrong") to guide deliberation and prediction, even if these generalizations are not exceptionless principles.^1
  9.  **Metaphysical Grounding:** The fact that a feature is a reason in a specific case is grounded in (depends on nothing beyond) the total set of natural features of that case.^2

  ^1 *We exclude this obvious point as a numbered claim because it is uncontested.*
  ^2 *We exclude "Moral properties supervene on natural properties" as a numbered claim because it is uncontested between us and forms part of our shared background.*

  **3. Disagreements**

  | Neutral Description                                                                                                          | Particularist Formulation (Party A)                                                                                                                               | Generalist Formulation (Party B)                                                                                                                                 | Verdict          |
  | :--------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------- |
  | **What metaphysically makes a natural feature a moral reason in a specific case?**                                           | A feature is a reason solely in virtue of the *total context* of natural features present, without needing to be an instance of any covering generalization.       | A feature is a reason only if the case instantiates a true moral principle (however complex or unknown) which specifies that feature as a reason in such cases. | Genuine          |
  | **Is citing a feature as a reason a complete explanatory act without implicit appeal to a generalization?**                  | Citing a relevant feature *can* be a genuine, non-derivative explanation of a moral judgment; its explanatory power comes directly from the case's particulars. | Citing a feature only explains a moral judgment if it implicitly invokes the principle that *makes* that feature a reason in contexts like this one.             | Genuine          |
  | **Do moral principles (if they exist) play a constitutive role in making judgments correct?**                                | A moral judgment is correct solely in virtue of accurately reflecting the reasons present in that specific case, not in virtue of instantiating a principle.       | A moral judgment is correct *because* it accurately reflects the true moral principles that govern the case and make the relevant features reasons.             | Genuine          |
  | **Is the distinction between a 'silencer' and a 'defeater' a real metaphysical distinction?**                                | The difference between a condition that negates a reason's existence and one that merely opposes it is grounded in the nature of the reasons themselves.           | The distinction is primarily epistemic or pragmatic, reflecting how we *discover* reasons are absent or overridden; metaphysically, reasons are context-specific.  | Partly Verbal    |
  | **Does reliable moral competence in novel situations require internalized principles?**                                      | Reliable moral responsiveness in novel situations demonstrates sensitivity to complex particulars, not necessarily the deployment of tacit principles.             | Reliable moral competence, especially in novel domains, is best explained by the agent possessing (often tacitly) complex principles structuring their perception. | Genuine          |

  **4. Cruxes**

  We agree that resolving the following sub-questions would significantly advance the debate. We pre-register our predictions and concessions.

  *   **Crux (a): Ad Hoc Patching?**
      *   **Sub-question:** Can a principled refinement protocol be defined such that successful application over multiple adversarial rounds demonstrates the existence of robust underlying principles, rather than merely ad hoc rescue?
      *   **Protocol:** *Adversarial Principle Refinement Game:* (1) **Domain:** Promise-keeping. (2) **Round 1:** Generalist (B) states a candidate principle P1. (3) **Round 1:** Particularist (A) offers a case C1 where P1 yields the *wrong* verdict. (4) **Round 1:** Generalist (B) may amend P1 once to P2, explicitly adding a defeater clause or refining the antecedent to exclude C1, *only if* the amendment (a) uses language describing natural features already agreed as potentially relevant, and (b) does not simply list C1 or describe it uniquely. (5) **Round 2:** A offers case C2 challenging P2. (6) **Round 2:** B amends to P3 under same rules. Continue for 10 rounds.
      *   **Stopping Rule:** After 10 rounds, or if A cannot produce a counter-case in a round.
      *   **Prediction A:** After 10 rounds, the principle (P10) will be either (i) so complex and disjunctive as to be practically useless and indistinguishable from a case list, or (ii) vulnerable to a new counter-case constructed using features already deemed relevant. *(Concession: If P10 is concise, robust against foreseeable cases, and clearly general beyond the cases used, it would strongly suggest a robust underlying principle.)*
      *   **Prediction B:** After 10 rounds, the principle (P10) will be significantly more complex than P1 but will represent a principled refinement capturing a genuine pattern. While potentially complex, it will not be a mere disjunction of cases and will withstand attempts by A to generate novel counter-cases *within the agreed domain and amendment rules*. *(Concession: If P10 is an unmanageable disjunction of specific cases or demonstrably fails on a novel case built from agreed features, it would undermine my claim that useful, robust principles exist for this domain.)*

  *   **Crux (b): Reliable Classifiers & Tacit Principles**
      *   **Sub-question:** Does the reliable performance of a sophisticated pattern-recognizer (like an AI trained on vast moral dilemmas), which cannot articulate rules but performs well in novel cases, demonstrate that tacit principles *must* be present and operative?
      *   **Test Case:** Train a complex neural network on a vast, diverse dataset of described moral scenarios labeled with agreed moral judgments (e.g., permissible/impermissible). Test its performance on genuinely novel, complex moral dilemmas unseen during training. The AI cannot output any human-readable rule justifying its decision, only the judgment.
      *   **Prediction A:** High reliability is possible and demonstrates sophisticated pattern recognition grounded in particulars, not the deployment of tacit principles. The "knowledge" is embedded in the complex network weights, not in propositional rules. *(Concession: If analysis revealed the network's decisions reliably tracked a human-discoverable, concise principle *despite* its training data containing noise and exceptions, it would suggest principles are being captured.)*
      *   **Prediction B:** High reliability in genuinely novel cases strongly implies the network has internalized complex, tacit principles structuring its recognition of morally relevant patterns. The inability to articulate them is an epistemic limitation, not a metaphysical one. *(Concession: If the network's "errors" on novel cases were systematic in ways that clearly violated plausible principles *and* couldn't be explained by data bias, it would weaken the necessity of tacit principles.)*

  *   **Crux (d): Singular Explanation**
      *   **Sub-question:** Can pointing to a single natural feature ("It caused intense suffering") ever constitute a *complete and sufficient* moral explanation for why an action was wrong *in this specific case*, without any implicit appeal to a generalization?
      *   **Test Case:** Consider a simple, uncontroversially wrong act: Torturing an innocent person solely for the torturer's amusement. Can the explanation "Because it caused intense, unnecessary suffering to an innocent person" stand alone as the full explanation for its wrongness?
      *   **Prediction A:** Yes. In this clear case, citing the suffering *just is* the explanation; the reason's force is manifest in the particular instance. Demanding a covering principle adds nothing essential to the explanation. *(Concession: If it could be shown that this explanation *only* works if the listener implicitly assumes a general rule linking suffering to wrongness, it would support the generalist view.)*
      *   **Prediction B:** No. This explanation works *only* because the listener implicitly understands it as an instance of a more general truth (e.g., "Causing intense, unnecessary suffering to innocents is wrong"). Without that background generalization, the statement merely describes a fact; it doesn't *explain* the wrongness. *(Concession: If compelling cases emerged where the explanation felt utterly basic and non-derivative, even upon deep reflection, it might challenge the necessity of implicit generalization.)*

  **5. Constructed Cases**

  *   **Valence-Flip Pair:**
      *   **Case 1 (Positive Reason):** Jamie finds a wallet containing $100 and an ID on the street in a quiet neighborhood. Jamie knows the owner (identified by the ID) lives nearby. Jamie returns the wallet to the owner. *The feature "Returning lost property" is a reason in favor of Jamie's action.*
      *   **Case 2 (Negative Reason):** Taylor finds a wallet containing $100 and an ID on the street in a dangerous, war-torn city. Taylor knows the owner is a notorious warlord responsible for atrocities, currently actively seeking funds to buy weapons. Taylor returns the wallet to the owner. *The feature "Returning lost property" is a reason against Taylor's action.*
      *   **Agreed Difference:** The identity of the owner and the consequences of returning funds to them (background conditions not usually cited as independent reasons).
      *   **Party A Says:** This demonstrates holism and valence-flipping. "Returning lost property" is not an invariant reason; its moral status (direction) depends entirely on context. Principles struggle to capture this without becoming context-laden descriptions.
      *   **Party B Says:** This confirms holism but is compatible with principles. A true principle might be: "Returning lost property is generally a reason for action, *unless* returning it would foreseeably enable significant harm by the recipient, in which case it is a reason against." The background features explain the exception.
      *   **Settles?:** Relocates the dispute to Crux (a) – is the amended principle principled or ad hoc?

  *   **Silent-Background Pair:**
      *   **Case 1 (Reason Present):** During a friendly board game night, Alex playfully teases Blair about a recent minor blunder in the game. Everyone laughs, including Blair. *The feature "Causing mild amusement (through teasing)" is a reason in favor of Alex's action (contributing to fun).*
      *   **Case 2 (Reason Absent/Silenced):** At a funeral service for Blair's close family member, Alex attempts the same playful tease about a minor matter. *The feature "Causing mild amusement (through teasing)" is not a reason at all in favor of Alex's action here; it might even be a reason against.*
      *   **Agreed Difference:** The social context (funeral vs. game night - background condition not usually a standalone reason).
      *   **Party A Says:** The context silences the potential reason-giving force of causing mild amusement through teasing. In Case 2, that feature simply doesn't count morally in favor of the action. No principle is needed to explain its absence; it's just how the context shapes reasons.
      *   **Party B Says:** The context triggers an exception clause in the true principle governing "causing amusement." The feature *is* a reason in Case 1, but in Case 2, the context (funeral) acts as a silencer specified within the complex principle, rendering that feature inert.
      *   **Settles?:** Relocates the dispute to Crux (c) – is the silence metaphysical or just an exception? And the nature of principles (Crux a, e).

  **Conclusion:** This collaboration clarifies that our core disagreement is metaphysical and explanatory, centering on whether moral reasons necessarily depend on general principles for their existence and explanatory power (B), or whether they are fundamentally context-dependent particulars (A). The outlined cruxes and cases provide concrete avenues for further investigation. We commit to engaging with these tests and revising our positions based on the results.
