answer: |-
  ### Rules in Play
  The Commission's precedents suggest three possible principles governing meaning continuity:  
  1. **Manifest Properties Rule**: Meaning is tied to observable characteristics (as in Ashgrove, where surface properties defined "water" despite microstructural divergence).  
  2. **Scientific Essence Rule**: Meaning fixes on underlying scientific reality, overriding continuous perceptual use (metal substitution case).  
  3. **Expert Practice Rule**: Meaning is anchored to the extensions identified by *contemporary* experts at the time of use, regardless of later reclassification (expert deference cases). Crucially, the Commission hasn’t resolved whether "contemporary experts" means those of the founders’ era or today’s. This ambiguity is pivotal for verdite.  

  ### Closest Precedent
  The metal substitution case is the strongest analogue. Both involve a term historically applied to a substance thought uniform, later revealed to have multiple distinct types. There, the Commission prioritized scientific essence over material continuity or perceptual sameness. For verdite, this suggests meaning is fixed to the mineralogical category *as understood via original scientific intent*, not surface properties or accidental samples.  

  ### Recommended Ruling
  The Commission should hold "verdite" refers to **both minerals**, binding the bequest. Reasoning:  
  - Like the metal case, the term originally picked out a *scientifically intended category* (one stone kind), even if erroneously. Modern revelation of two minerals doesn’t retroactively split the historical extension.  
  - The expert deference precedent (unresolved temporally) should apply to the *founders’ experts*, who treated all quarry outputs as one substance. Their practice defined the term’s breadth.  
  - The type specimen’s irrelevance mirrors the metal ruling: samples are referential accidents, not meaning-constitutive. Surface properties (as in Ashgrove) lose to scientific intent.  
  **Principle adopted**: *Original expert practice fixes reference, and later scientific refinement cannot fragment the historical extension.*  

  ### The Case That Would Settle It  
  Introduce "Soren’s Bequest" of "all my horses." In the founders’ era, "horse" included both *Equus ferus* and a locally abundant, visually identical perissodactyl (*Pseudohippus*), classified as one species by then-experts. Modern genetics proves they are distinct genera with no recent common ancestor. *Pseudohippus* is now extinct; only true horses remain.  
  - **If Commission awards the bequest**: It prioritizes *original expert practice* over modern taxonomy.  
  - **If it denies**: It adopts *current scientific essence* as decisive. This resolves the expert-deference ambiguity.  

  ### Lines for the Dissent  
  "The majority clings to obsolete science! When founders said ‘verdite,’ they gestured at green stone from *those quarries*—now proven to yield distinct minerals. The common mineral alone satisfies the *actual historical usage*, as trade records prove. The rare specimen is a red herring. We honored essence in metals; we must honor divergence here."  

  ---  
  **Key Philosophical Tension**: The Commission’s metal ruling privileges scientific realism, while verdite would extend this to *historical scientific frameworks* rather than current truth. The "horses" case forces a choice between temporal externalism (past experts bind) and persistent realism (current science corrects reference).
