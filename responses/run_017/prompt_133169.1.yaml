  The closest precedent is actually the metal case - both involve scientific reclassification of substances once thought uniform. But there's tension because the metal case honored the abstract category while Ashgrove rejected microstructure. 

  I think the Commission should rule that "verdite" still refers to the original category, meaning both minerals are covered - this respects historical practice like the expert deference cases. The dissent would reasonably argue for the common mineral based on actual usage. 

