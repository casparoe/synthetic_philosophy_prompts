prompt: |-
  I record a small, slightly over-long podcast on metaphysics for listeners who already know a bit of it, and in a fortnight I'm interviewing a philosopher of physics — she's asked me not to be named in the blurb, so let's call her Professor Halloway — who's just published a book defending what she calls orientation absolutism: the claim that left-handedness is a genuine intrinsic, monadic, irreducible property of objects, not a relation to us or to a paradigm hand or to a convention, and that Kant basically settled this in his 1768 essay on the ground of the difference between regions in space, with his incongruent counterparts: a left and a right hand agree in every intrinsic magnitude and in all their internal relations and still can't be brought to coincide, so no relationalist story about space can account for the difference. I remember the examples being hands and ears and — I think — snails whose shells wind the other way, but don't hold me to that. What I want from you is ten or twelve questions that don't just let her restate the view.

  The bit I most need help with is her escape route. Every time anyone brings up the actual physics she says something like "that's a fact about the notation of our theories, not about handedness", and sails on, and I've never found a way past it. So I've been reading up so I dont sound like an idiot: as I understand it, Wu's cobalt-60 experiment (done in 1956) found that the electrons from the beta decay come out preferentially in one direction relative to the spin of the aligned nuclei, so the weak interaction isn't mirror-symmetric, which gives a way of operationally defining left and right that needn't presuppose any shared object — but that on its own arguably doesn't settle it, because if CP were conserved then the mirror image of the whole set-up would still be a physically possible process, just one involving antimatter, and it was Cronin and Fitch's 1964 result on neutral kaon decay that broke that last symmetry. Tell me if I've got any of that wrong, and then build me a run of three or four questions that start by granting her the notation point and make it progressively harder to lean on: does her view really have no stake in whether the laws are handed; would a parity-symmetric world be one in which there's no fact of the matter about which hand is which; and if she insists the metaphysics is independent of the physics, then what would a world have to be like for there to be no fact of the matter — a single handed object and nothing else, say, or two objects that are mirror images of each other and nothing else — and what does absolutism say in those cases?

  A few other things I'd want covered, each with a follow-up keyed to whatever she'd most likely answer: the question that got me into this in the first place, which is what holds each side together — that all left hands are congruent with all other left hands, all left gloves fit all left hands, congruence among handed things is transitive and sorts everything into exactly two classes — is that a further fact standing in need of explanation, and can she keep it if space turns out to be awkward (a creature living on a Möbius-band sort of space can travel round a loop and come back mirror-reversed, so "left" only coheres locally: does her intrinsic property go local, or does her view entail that actual space is orientable?). Also whether a truly intrinsic monadic property can be hostage to the dimension of the space it sits in, given that a flat scalene triangle and its mirror image can't be made to coincide by sliding around inside the plane but can be if you flip one over through the third dimension, and that in four dimensions you could in principle turn a left hand into a right hand by rotating it through the extra one. Also one on the old problem of telling a distant civilisation by radio alone which side counts as left, and one on whether we could ever discover we'd had it backwards all our lives. And a closing question about what would count as evidence against the view, or whether she thinks the whole dispute with the relationists is verbal. Where you can, phrase the questions so a non-specialist listener can follow them without the point getting dumbed down, and stick brief notes in brackets on why each follow-up bites.
reasoning: |-
  Okay, let me unpack this podcast host's request. They're prepping an interview with a philosopher defending "orientation absolutism" - the idea that left-handedness is an intrinsic property, not relational. The host wants penetrating questions that move beyond restating the view, especially targeting the philosopher's tendency to dismiss physics as mere "notation."

  Hmm, the core challenge is designing questions that circumvent her standard deflection about physical evidence being "just notation." The host has done impressive homework on parity violation (Wu experiment, CP violation) but needs a structured interrogation path. I should build a progression: start by granting her notation point, then gradually force her to engage with what physics implies for her metaphysics.

  First question could be: "If physics can't settle the metaphysics, what kind of world would make absolutism untenable?" Follow up by pressing whether a parity-symmetric universe would lack objective left/right facts. This exposes whether her view depends on physical symmetry breaking.

  For the physics bypass, I'm considering a three-step approach: 
  1) "Does your view remain coherent in a P-conserving universe?" 
  2) "If CP conservation held, would you need antimatter to define left?" 
  3) "With CP violation, isn't the operational definition independent of human conventions?" 
  Each step tightens the vise by making the "just notation" claim harder to maintain.

  The host also wants coverage of topological edge cases. The Möbius strip example is perfect - if space isn't globally orientable, does absolutism collapse? And the dimension-dependence point: in 4D space, hands aren't chiral, so how can handedness be intrinsic if it vanishes in higher dimensions? 

  For the radio test question (telling aliens "left"), I'll emphasize that any description must reference physical processes, undermining the non-relational claim. And the discovery question - could we learn we mislabeled left/right? - tests whether she accepts physical evidence as probative.

  Closing should challenge falsifiability: "What evidence would make you abandon absolutism?" This forces her to either admit testable commitments or concede the debate is verbal.

  Throughout, questions must stay accessible but uncompromising. Bracketed follow-up notes will help the host anticipate counterarguments. The physics progression is the priority - if executed well, it might finally breach her defenses.
answer: |-
  Here’s a set of 12 targeted questions designed to probe the *foundations* of orientation absolutism, avoid restatements, and challenge evasion routes—especially the "notation" deflection—while keeping the discussion accessible. Each question includes a concise follow-up rationale in brackets.

  ---

  ### **Physics & Metaphysics Tension (The Core Challenge)**
  1. **"If we grant that physics notation *describes* rather than *defines* handedness, could a universe with perfectly parity-symmetric laws still have intrinsic left/right properties? Or would symmetry make handedness metaphysically indeterminate?"**  
     *[Follow-up if she says "yes": "What then distinguishes left from right in such a world—since no experiment could ever detect a difference?" Forces engagement with whether physics constrains metaphysics.]*

  2. **"In a CP-conserving universe (pre-1964 understanding), the mirror image of Wu’s experiment would involve antimatter. Would your view require that left-handedness *itself* flips when comparing matter to antimatter, or is the property independent of particle content?"**  
     *[Follow-up: "If handedness is intrinsic to objects, how can it invert when the *same* spatial configuration involves antimatter?" Tests if absolutism can handle CP symmetry without relationalism.]*

  3. **"Wu’s experiment lets us *operationally* define ‘left’ using beta decay, without referencing hands or conventions. If this physical process fixes reference, why isn’t that sufficient—and what does your intrinsic property add that this operational definition lacks?"**  
     *[Follow-up: "If the answer is ‘nothing,’ doesn’t that make absolutism redundant? If ‘something,’ what empirical difference would it make?" Demands metaphysical value beyond physics.]*

  4. **"Imagine a universe with one solitary left-handed particle. Could it *be* left-handed? If not, does absolutism require a plurality of objects? If yes, how is the property manifest without relational contrasts?"**  
     *[Follow-up: "Could two identical left-handed particles in isolation have different handedness?" Presses the incoherence of monadic properties without relational grounding.]*

  ---

  ### **Structural Coherence & Topology**
  5. **"All left hands are congruent; all left gloves fit them. Is this global harmony a brute fact, or does your view explain why handed objects form exactly two equivalence classes?"**  
     *[Follow-up: "If space were non-orientable (like a Möbius strip), could ‘intrinsic leftness’ vary along a path? Or would absolutism imply our space *must* be globally orientable?" Links to physical cosmology.]*

  6. **"In 2D, a scalene triangle lacks enantiomorphs; in 4D, a ‘hand’ can be rotated into its mirror image. If handedness depends on spatial dimensionality, how can it be an intrinsic, non-relational property?"**  
     *[Follow-up: "Doesn’t this make leftness ‘intrinsic’ only relative to a 3D container? How is that different from relationism?" Exposes dimension-dependence.]*

  ---

  ### **Epistemology & Conceivability**
  7. **"Suppose we successfully told an alien civilization: ‘Fire electrons against cobalt-60 spins; the direction they deflect is left.’ If they adopt this, are they tracking your intrinsic property—or just a physical correlation?"**  
     *[Follow-up: "If they later find a deeper particle asymmetry, could they discover we’d mislabeled ‘left’ all along? Or is the property infallibly known?" Tests empirical revisability.]*

  8. **"Could we ever discover that what we call ‘left’ was actually ‘right’ all along? If no, why not? If yes, what evidence would force that revision?"**  
     *[Follow-up: "If such a discovery is impossible, isn’t handedness just a primitive label?" Challenges absolutism’s empirical content.]*

  ---

  ### **Metaphysical Costs & Alternatives**
  9. **"Kant’s hands are incongruent despite identical internal relations. But isn’t their incongruence *itself* a relational fact about how they embed in space? How does calling leftness ‘intrinsic’ resolve this?"**  
     *[Follow-up: "If space is relational, could two objects have identical internal relations *and* be incongruent? If not, doesn’t Kant’s argument presuppose absolute space?" Questions the target.]*

  10. **"Relationists argue that ‘left-handed’ means ‘congruent to paradigm F,’ avoiding intrinsic properties. What does your view explain that theirs cannot—besides satisfying intuitions about ‘objecthood’?"**  
      *[Follow-up: "If the answer is ‘nothing observational,’ is the dispute merely verbal?" Forces engagement with positivism.]*

  ---

  ### **Falsifiability & Closing**
  11. **"What would constitute evidence against orientation absolutism? For example, if fundamental physics eliminated all asymmetric interactions, would that undermine it—or is the property beyond physical reach?"**  
      *[Follow-up: "If no physical scenario could challenge it, is absolutism unfalsifiable—thus metaphysical in a pejorative sense?" Tests scientific accountability.]*

  12. **"You’ve called relationism ‘conventionalist,’ but couldn’t an intrinsic property also be conventional—if we arbitrarily labelled which intrinsic property is ‘left’? What makes your absolutism *non*-conventional?"**  
      *[Follow-up: "If the property is intrinsic but its *naming* is conventional, how does this differ from relationism plus realism about paradigms?" Unpacks language/metaphysics tension.]*

  ---

  ### **Key Tactics Embedded**
  - **Physics progression** (Q1–Q4): Starts concessive ("granting notation"), then escalates by asking whether physics *enables* or *threatens* the metaphysics. The solitary-particle (Q4) and antimatter (Q2) scenarios are traps: denying intrinsic properties in these cases admits relationalism; affirming them invites incoherence.  
  - **Accessibility**: Uses concrete examples (aliens, Möbius strips, gloves) without equations. "CP-conserving" is briefly explained by referencing antimatter.  
  - **Follow-ups**: Target likely dodges—e.g., if she calls the alien communication "derivative," Q7’s follow-up questions whether *any* operational test tracks the property directly.  
  - **Kant**: Engaged obliquely (Q9) to avoid rehashing 1768. Forces her to defend Kant’s premises, not just his conclusion.  

  This line ensures she can’t retreat to "notation" without confronting the *implications* of physics for her metaphysics—and the burden of explaining what work "intrinsicality" does. Good luck!
