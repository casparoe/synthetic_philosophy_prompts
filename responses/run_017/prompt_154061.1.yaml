prompt: |-
  I work in the central services of a mid-sized Swiss canton, four of us, and a big chunk of what we actually do is triage. Something lands on us -- a request from a group of municipalities, a motion in the Kantonsrat, a question from Bern, occasionally some standard our exporters have to match if they want to keep selling into the EU -- and we have to say which level should be carrying this: municipal, cantonal, federal. About two a week during session season, half an hour to forty minutes per file, and the output is one page of plain German or French that goes to a Regierungsrat who signs it and who will not read anything longer than a page. Right now everyone on the team invokes subsidiarity and it settles nothing, so I want an actual procedure.

  The reason it settles nothing is that the standard two-part test -- the higher level may act only if the lower one cannot adequately achieve the objective, and it could therefore be better achieved up here by reason of scale or effects, which is roughly how the EU states it, with the German version tying it instead to uniformity of living conditions and legal and economic unity, and the US having almost no legal version of it at all, just the rhetorical one about states as laboratories -- collapses exactly where we need it. So don't restate the two-part test at me; build me something that survives contact with these three problems.

  First: the "can they" half of the test is partly endogenous. Whether a municipality can do a thing depends on whether it has been allowed to do that kind of thing before. Competence that sits unused atrophies: the one person who understood the system leaves, the maintenance contract lapses, a neighbouring municipality builds the tool and everyone else just buys access from them. So a test that asks "can they?" will ratchet everything upward over time, because every time we answer yes at the higher level we make the lower level a bit less able next time. I want a step in the procedure that catches this explicitly -- something like asking whether the unit would still fail if it had been doing comparable work for ten years, or whether the failure is self-inflicted and by whom. Call it what you like, but it has to be a real gate and not a footnote.

  Second: spillovers, including the awkward ones. The classic case is the lower unit that can act but pushes costs onto people outside its own electorate, or captures benefits paid for by others. There is also a mirror case that bites us constantly: a municipality that can "afford" something only because the money isn't really theirs -- federal grants, matching funds, cantonal equalisation -- so the sufficiency answer is an artifact of who happens to be paying, not of capability. Give me a question that separates those two, since in my experience the second one is where our files quietly go wrong.

  Third: the levels don't nest the way the principle assumes. The right unit for deciding, for paying, for delivering and for setting the standard are frequently four different answers, and I want the procedure to let them come apart and to say who chooses when they do. And then there's the regress I'd rather you didn't dissolve with a joke: whenever we say "this one belongs to the municipalities," we are saying it from up here, at a desk in the canton. Tell me where that actually bites in our kind of work and where it's harmless.

  For each step I want to know what counts as a sufficient answer given that we cannot do research -- the evidence we really have is things like "this municipality has never run anything larger than a road salt budget" or "they share a clerk with two others" or "the IT supplier is dropping support next year." And I want it marked, honestly and not buried, where the procedure just stops with a no and sends the file back down, versus where it has to hand the decision to the Regierungsrat because the question is a values question rather than a factual one -- whether uniformity across the canton is itself worth paying for, whether a municipality keeping its own thing is worth some measurable inefficiency. Those two I can't answer for him and I don't want the procedure pretending otherwise.

  Then run it on three live-ish files. One: five municipalities in a valley want to jointly buy and run an extra treatment stage for a contaminant showing up in the wells; the contamination crosses municipal boundaries; two of the five refuse to join and one of those two is where the plume starts. Two: a cantonal shared platform for civil registries, about forty municipalities, every one of them on its own contract, a few on software whose support ends soon, per-resident cost varying by a factor of about six. Three, and this is the one I'm dreading: our own unit spent most of last year drafting a cantonal licensing regime for short-term rentals, caps set per municipality, one register, cantonal enforcement. I have a feeling the procedure is going to tell me this one isn't ours, and if it does I want to see that worked out straight rather than massaged, because I have to defend it in front of the person who comissioned it.

  Finally, tell me what the procedure can't do: which kinds of files it will systematically get wrong, and whether the ratchet point means we should be giving the lower level a presumptive bonus that the two-part test as normally stated doesn't give it.

  And please: continuous prose, no headings, no bullet points, no bold, no tables, the way you'd write an email to a colleague. Don't cite anything at me either -- I can't look things up from here and I have no use for a reading list; I need something I can run before lunch on a Thursday.
reasoning: |-
  Okay, this user works in a Swiss cantonal central services team handling jurisdictional triage. They're frustrated with traditional subsidiarity tests failing in practice and need a concrete procedure addressing three specific pain points: competence atrophy due to upward ratcheting, misleading spillover effects, and non-nested governance levels. 

  The user's tone suggests urgency and impatience - they've clearly thought deeply about this and reject academic solutions. Key requirements emerge: must produce one-page outputs for busy Regierungsräte, handle real-world evidence like municipal staffing constraints, and explicitly flag when decisions involve political tradeoffs. 

  Hmm, their three case examples are telling. The water contamination case exposes spillover tensions, the software platform shows infrastructure scaling dilemmas, and the rental licensing project feels like a confessional - they suspect their own unit overreached. That last one takes guts to include.

  For the procedure design, I need to avoid regurgitating subsidiarity principles they've already rejected. Instead: 

  First, tackle competence atrophy by adding a "rehabilitated capacity" test - essentially asking what the lower level could do if historically empowered. This counters the ratchet effect.

  Second, disentangle spillovers by distinguishing between true externalities and fiscal illusions from grants. Requires examining whose money is actually at stake.

  Third, accept fragmented governance by separating decision-making, funding, delivery, and standard-setting roles. Must also confront the meta-problem: cantonal staff shouldn't paternalistically override municipal agency.

  The evidence constraints are real - they're working with heuristic knowledge like shared clerks or expiring IT contracts. The procedure must work with such indicators without requiring new research.

  Crucially, I must demarcate where technical analysis stops and political judgment begins. The user's allergic to overstepping - they want clear handoff points to the Regierungsrat for value-laden tradeoffs.

  For the test cases: The water contamination clearly fails the spillover test (one municipality poisoning others), justifying cantonal intervention. The software platform passes subsidiarity but needs cantonal coordination due to fragmentation. The rental licensing... oof. The procedure will likely flag it as municipal competence unless they can prove spillovers. Better be brutally honest here as requested.

  Finally, must warn about limitations: the procedure will struggle with emergent crises and cases where local dysfunction is intentional. Also suggest a "competence preservation bonus" to counter ratcheting - giving lower levels benefit of doubt when capacity is borderline.

  This needs to read like a colleague's email - conversational but precise, no fluff. They'll use this Thursday morning while juggling other files. No citations, just operational wisdom.
answer: |-
  Here’s a procedure designed for your triage desk, built around your three problems. It’s structured as five questions, each with a clear output path. It uses the evidence you *have* (staffing quirks, budget scale, IT cliffs, visible spillovers) and flags where you must stop and hand off to the Regierungsrat. The core shift is from asking "Can they?" to "**Should this unit reasonably be expected to handle this, given its real-world context and incentives?**"  

  **The Procedure:**  

  Start with the file. For each question, proceed only if you answer "yes." If you answer "no," stop and route as indicated.  

  1. **"Is there unambiguous evidence that failure to act at this level would cause direct, material harm across boundaries (e.g., pollution, epidemic, systemic market failure) that lower units demonstrably cannot contain, even with reasonable coordination?"**  
     - *Solves:* Spillovers (physical/environmental).  
     - *Evidence needed:* Maps showing cross-border impact (e.g., groundwater plume crossing lines), documentation that affected units tried/failed to coordinate (e.g., meeting minutes showing holdouts), or proof lower units lack containment tools (e.g., no legal power to compel compliance).  
     - *No?* Route to municipal level (or inter-municipal body) with a note: "Boundary-crossing harm unproven; lower-level coordination possible."  
     - *Yes?* Proceed to Q2.  
     - *Gate:* Catches "hard" spillovers. Rejects cases where harm is theoretical or containment is feasible locally.  

  2. **"Is the lower unit’s apparent inability primarily due to artificial fiscal constraints (e.g., reliance on volatile grants, equalisation quirks) or avoidable capacity atrophy (e.g., shared clerk resigned, unused tool decommissioned), rather than inherent scale or legal limits?"**  
     - *Solves:* Fiscal illusions and competence atrophy.  
     - *Evidence needed:* Budgets showing grant dependency (e.g., >40% of project cost from higher level), records of recent capacity loss (e.g., "shared clerk left 6mo ago, not replaced"), or proof a comparable unit manages this task (e.g., "Municipality X, same size, runs its own waste treatment").  
     - *Yes?* Route back to lower level with instructions: "Review feasibility assuming restored core capacity/cost-sharing. Report barriers within 60 days."  
     - *No?* Proceed to Q3.  
     - *Gate:* Prevents ratchet. Forces reckoning with self-inflicted weakness. If they *could* do it with minimal investment, they must try.  

  3. **"Can the core decision-making (what to do) and standard-setting (how well it must be done) be practically separated from funding (who pays) and delivery (who operates it)?"**  
     - *Solves:* Non-nested levels.  
     - *Evidence needed:* Clear mismatches (e.g., "Standards must be federal for EU access, but municipalities can inspect if certified," or "Canton must fund due to tax base disparities, but towns can hire contractor").  
     - *No?* Proceed to Q4 (indivisible).  
     - *Yes?* Split functions:  
       - Decision/standards: Keep at lowest level with technical capacity (use Q4 to test).  
       - Funding: Assign to level with fiscal reach (e.g., canton for redistributive costs).  
       - Delivery: Assign to unit with operational capacity (e.g., inter-municipal body).  
       - *Output:* "Split: Standards cantonal (uniformity required), funding municipal (user fees), delivery intercommunal (joint body)."  

  4. **"Would a lower unit with sustained responsibility for this task (10+ years) realistically develop the competence to handle it, given its current resources and scale?"**  
     - *Solves:* Ratchet effect and endogenous incapacity. Tests *durable* competence.  
     - *Evidence needed:* Track record ("Town A runs similar service"), resource depth ("Has 3 FTEs in dept, IT contract stable"), or scalability ("Uses shared cloud platform, easy replication").  
     - *No?* Proceed to Q5 (cantonal/federal).  
     - *Yes?* Route to lower level: "Presumptively municipal absent proof of systemic failure."  
     - *Gate:* "Rehabilitated capacity" test. Overrules one-off weaknesses.  

  5. **"Is there a compelling, non-economic justification for higher-level action (e.g., constitutional imperative, irreversible risk to legal unity, or catastrophic failure risk) that outweighs lost local flexibility?"**  
     - *Solves:* Values call for Regierungsrat.  
     - *Evidence needed:* Legal opinion ("Federal law requires uniformity"), risk assessment ("Single point of failure threatens canton-wide system"), or political mandate ("Kantonsrat motion demands harmonisation").  
     - *Output:* "Recommend cantonal action. Requires policy tradeoff: [e.g., uniformity vs. local control]. For Regierungsrat decision."  
     - *Gate:* Hard stop. You don’t decide values. Forces explicit tradeoff framing.  

  **On the Meta-Problem (You Deciding for Municipalities):**  
  This bites when your evidence for local incapacity is thin or circular ("They haven’t done it, so they can’t"). Q2 and Q4 defang this: Q2 forces examination of *why* they can’t, Q4 tests *future* capacity. It’s harmless when evidence of cross-border harm (Q1) or irreversible risk (Q5) is solid.  

  ---  

  **Test Runs:**  

  **File 1: Valley Water Contamination**  
  - Q1: **YES.** Plume starts in holdout town, contaminates others. Physical spillover.  
  - Q2: **NO.** Inability not fiscal/atrophy (they *could* build plant).  
  - Q3: **Split.** Decision: Joint body (what to build). Standards: Cantonal (water quality law). Funding: Municipalities (user fees). Delivery: Joint body.  
  - *Output:* "Cantonal standards, municipal funding/delivery via joint body. Compel holdouts via cantonal order (Q1 justification)."  

  **File 2: Civil Registry Software**  
  - Q1: **NO.** No cross-border harm; inefficiency isn’t systemic risk.  
  - Q4: **YES.** Towns *could* run modern platforms (some do).  
  - *Output:* "Municipal competence. Suggest voluntary shared service. *But* flag to Regierungsrat: Fragmentation risks data loss (Q5 tradeoff: efficiency vs. autonomy)."  

  **File 3: Short-Term Rental Licensing**  
  - Q1: **NO.** No proven cross-border harm (nuisance is hyperlocal).  
  - Q2: **YES.** "Incapacity" is artificial: Towns set zoning, run permits. Atrophy if canton takes over.  
  - Q4: **YES.** Towns like Zermatt manage similar regimes.  
  - *Output:* "Municipal competence. Cantonal role limited to model bylaws/data sharing. Q5 tradeoff: Regierungsrat must justify uniformity vs. local discretion."  
  - *Brutal truth:* Your unit drafted this because it’s tidier, not because towns *can’t*. The procedure calls it. Defense: "Municipalities retain authority; we provide tools/coordination."  

  ---  

  **What It Can’t Do:**  
  - **Predict black swans:** If a file hinges on an unseen risk (e.g., novel contaminant), Q5 defaults to canton.  
  - **Fix bad faith actors:** If a town *refuses* to build capacity (not *can’t*), Q2 may miss it. Mitigate by requiring "remediation plans" in Q2 outputs.  
  - **Handle emergencies:** No "imminent harm" override; assumes normal policy tempo.  

  **The Presumptive Bonus:**  
  Yes. Q4 (*"Would they develop competence?"*) and Q2’s (*"Is atrophy self-inflicted?"*) "route back" step create a de facto bonus for lower levels. It forces the canton to prove *enduring* incapacity, not temporary weakness.  

  ---  

  This fits on one page. Run it sequentially: most files exit early (Q1 or Q4). For the Regierungsrat, highlight only the tradeoffs (Q5) and split functions (Q3). It’s Thursday-ready.
