prompt: |-
  hey — i help run a volunteer crisis-line rota (about forty people, mostly students) and we're rewriting the one-page "what's actually expected of you" sheet we hand new volunteers, because the last version managed to both freak people out (they read every optional thing as secretly required and burned out inside two months) and let a couple of people coast (they'd describe straight-up required stuff as "going above and beyond"). my teammate priya says we should drop the moral-philosophy framing entirely and model the whole thing on a job. her pitch: the job description is your duty — written down in advance, you're blameworthy if you skip it, nobody thanks you for doing it. anything past that is overtime: genuinely optional, genuinely praiseworthy if done, zero blame if you clock off. she says that gives us a stable line we can actually print, and it also settles the thing we kept going in circles on — that an act doesn't stop being supererogatory (good but not required, "beyond duty") just because it happens to be easy and the stakes are enormous: you don't get fired for not doing a coworker's job, so likewise you're not obliged to give a kidney to a stranger just because the surgery is low-risk and it saves a life.

  i half buy it, but i can feel the analogy carrying weight it hasn't paid for, and the sheet is due sunday. so: can you audit it? start with the correspondence table — employee, employer, job description, employment contract, wage, overtime, being fired, the bonus, the performance review, the coworker who always stays late — and what each of those maps onto in the moral case, with an explicit question mark where there's nothing to map onto. then the disanalogies, sorted into ones that actually matter for our use and ones that don't. the ones i keep tripping over: (1) the ratchet — we had a volunteer who took every horrible shift for a year, and now new volunteers get side-eyed for not doing the same, and her old shifts feel de facto required; in a job, doing overtime never amends the contract, but here it seems to, which is bad news for "we'll just write the list down." (2) you can quit a job — you consented to the description and can walk — whereas you can't resign from morality, so it's unclear where the line gets its authority from at all. (3) overtime praise seems to presuppose somebody whose interests fix the baseline and who could legitimately ask for more at the next review; in the moral case who would that be, and if there is no one, is our "job description" just a record of what people here happen to do? (4) the escalation ladder we built for the sheet — hold a stranger's door, return a dropped wallet, stay twenty minutes late to cover a gap, take the christmas shifts, drive across town at 3am, donate a kidney — where, if anywhere, does optional flip to required? priya says never, but then i worry the job framing quietly makes everything optional (there's no boss to fire you) or, worse, makes the line whatever we happened to type up, which is circular for our purposes. (5) also, in a job nobody thanks you for doing your job, but people absolutely do thank volunteers for doing the baseline things, and we're not sure whether to put "say thank you" on the sheet as a requirement.

  what i want to know at the end is whether priya's second conclusion — that easiness plus huge stakes never converts the optional into the required, so the kidney case stays supererogatory — actually survives once the disanalogies are on the table, or whether the job picture was doing that work the whole time. and if there's a better analogy for a group like ours that isn't just whatever we wrote on the sheet with extra steps, i'd take it. keep it usable: flag which disanalogies should change what actually goes on the page.
reasoning: |-
  Okay, the user is part of a volunteer crisis line team and they're struggling with creating a "what's expected" document for new volunteers. The previous version caused issues—some volunteers felt overwhelmed thinking optional tasks were mandatory and burned out, while others treated required tasks as optional. Their teammate Priya suggests framing it like a job: job description as duty, anything beyond as optional overtime. The user is skeptical and wants an audit of this analogy.

  First, I need to map Priya's job analogy to the volunteer context. Let's list out the correspondences:
  - **Employee → Volunteer**
  - **Employer → The crisis line organization?** But there's no real employer here.
  - **Job description → The written volunteer duties** - This seems straightforward.
  - **Employment contract → The volunteer agreement?** But it's not legally binding.
  - **Wage → Intrinsic rewards?** No monetary payment.
  - **Overtime → Supererogatory acts** - Extra tasks beyond duties.
  - **Being fired → Being asked to leave?** Possible but messy.
  - **Bonus → Praise/recognition** - This fits.
  - **Performance review → Volunteer check-ins?** Rough equivalent.
  - **Coworker who stays late → Overcommitted volunteer** - The person setting high expectations.

  The user has specific concerns:
  1. **The ratchet effect:** A volunteer who took all hard shifts made new volunteers feel obligated to do the same. In jobs, overtime doesn't change the contract, but here it might create peer pressure.
  2. **Quitting vs. morality:** Volunteers can quit, but moral obligations feel different. Where does the duty come from?
  3. **Baseline authority:** In jobs, the employer sets the baseline. Here, who does? Without that, the duties might seem arbitrary.
  4. **Escalation ladder:** Where does optional become required? Priya says never, but the user worries the job analogy makes everything optional.
  5. **Thanks:** Should they require thanking volunteers for baseline work? In jobs, you're not thanked for duties, but volunteers are.

  The kidney example is key—Priya says easy, high-stakes acts (like donating a kidney) are still optional. Does the analogy support that? Or does it break under these disanalogies?

  Deep needs: The user needs a clear, sustainable system that prevents burnout and coasting. They want volunteers to feel committed but not exploited. They need moral weight without overburdening. Also, the document is due Sunday—practical solutions are essential.

  I should address each disanalogy's impact:
  - Ratchet effect: This matters. Need to explicitly state that past actions don't change duties. Reinforce in training.
  - Quitting vs. morality: The duty comes from commitment to the cause and beneficiaries. Frame it as a promise to the community.
  - Baseline authority: The org sets duties based on operational needs and sustainability. Not arbitrary; it's about maintaining the service.
  - Escalation ladder: Supererogatory stays optional. Emphasize that even high-stakes, easy acts are voluntary but admirable.
  - Thanks: Encourage gratitude for all contributions, baseline included. It's motivational for volunteers.

  Survival of second conclusion: The kidney case remains supererogatory because the duty is defined by the org's requirements, not stakes or ease. The analogy mostly holds if duties are clearly defined.

  Better approach: Hybrid model. Use job-like clarity but add moral context. Call it a commitment framework. Explicitly list duties and supererogatory acts. State that duties are based on what's essential for the service.

  Practical steps for the sheet:
  - Clearly demarcate "Duties" and "Optional/Above & Beyond."
  - Include a "Why This Matters" section explaining the rationale.
  - Address the ratchet effect in training.
  - Encourage thanks for all efforts.
  - Use plain language to avoid misinterpretation.

  The job analogy is useful for structure but needs adaptation for the volunteer context's moral and emotional aspects.
answer: |-
  I'll audit Priya's job analogy framework rigorously—focusing on your core need: a practical, burnout-preventing "expectations sheet" for volunteers that doesn't collapse under moral philosophy weight. I'll start with the correspondence table (mapping job concepts to your crisis-line context), then analyze the disanalogies you flagged (highlighting which *actually matter* for your sheet), and finally answer whether her "kidney conclusion" holds. I'll close with a concrete, usable alternative analogy and specific edits for your document. 

  ### 1. Correspondence Table: Job ↔️ Crisis Volunteer Role
  | **Job Concept**          | **Crisis Volunteer Mapping**                                  | **Notes/Problems** |
  |--------------------------|---------------------------------------------------------------|--------------------|
  | **Employee**             | Volunteer                                                     | Clear mapping. |
  | **Employer**             | The Crisis Line Organization (represented by you/Priya)       | Weak mapping: No power imbalance, no profit motive. Volunteers are stakeholders, not subordinates. |
  | **Job Description**      | The Written "Duties" List (e.g., "Cover 2 shifts/month")      | Core of Priya’s idea. Must be explicit, minimal, and sustainable. |
  | **Employment Contract**  | Volunteer Agreement (signed commitment)                       | Problem: Not legally binding. Authority comes from *shared mission*, not enforcement. |
  | **Wage**                 | ❓ **Nothing direct** (or "Intrinsic Reward")              | Critical disanalogy: No payment. "Payment" is moral satisfaction/skill-building. This weakens "duty" framing. |
  | **Overtime**             | Supererogatory Acts (e.g., "Covering extra shifts")           | Priya’s key insight: Praiseworthy but optional. |
  | **Being Fired**          | ❓ **Voluntary Exit Encouraged** (or "Duty Reassignment") | Messy: You can’t "fire" volunteers harshly, but you can part ways if duties ignored. |
  | **The Bonus**            | Praise/Recognition (e.g., shout-outs in meetings)             | Clear: Positive reinforcement for going beyond. |
  | **Performance Review**   | Check-in Meetings (e.g., quarterly feedback)                  | Useful for support, but not punitive. |
  | **Coworker Who Stays Late** | The Overcommitted Veteran Volunteer                         | Your "ratchet effect" example. Maps directly but causes problems (see below). |

  **Takeaway for your sheet**: The "job description" → "duties" mapping is the strongest part. Use it to define a **minimal viable commitment** (MVC). The "employer" and "wage" gaps are critical—they make the duty feel less "binding" than a job. This needs addressing in your framing.

  ### 2. Disanalogies: Which Actually Matter for Your Sheet?
  I’ll sort your five concerns by **impact on the document**, from highest to lowest priority. "High impact" means it *must* change what you write or how you train.

  #### 🚨 **High Impact (Must Address on Sheet/Training)**
  **1. The Ratchet Effect**  
  - **Disanalogy**: In jobs, overtime doesn’t rewrite the job description. In volunteering, heroic acts (e.g., taking all horrible shifts) *feel* like they reset expectations.  
  - **Why it matters**: This undermines Priya’s entire framework. If MVC isn’t fixed, burnout is inevitable.  
  - **Solution for sheet**:  
    - **Explicitly state**: "No volunteer’s past actions change these duties. Taking on extra shifts is *always* optional and never sets a new standard."  
    - **Add a "Sustainability Pledge"**: "We ask you to commit only to what you can sustain long-term. Overcommitting harms you and our callers."  

  **2. Escalation Ladder (Where Optional Flips to Required?)**  
  - **Disanalogy**: Jobs have clear boundaries. Morality feels "fuzzy" (e.g., is driving at 3am required if stakes are life-or-death?).  
  - **Why it matters**: Volunteers need to know: "Can I say no to high-stakes asks without guilt?"  
  - **Solution for sheet**:  
    - **Adopt Priya’s view but clarify**: Duties are defined by *organizational needs*, not stakes/ease. List:  
      - **Duties**: Cover your assigned shifts, submit reports, attend training.  
      - **Supererogatory**: Covering gaps, holiday shifts, extra projects.  
    - **Add rationale**: "Our duty is to provide *reliable* coverage—not heroism. Saying ‘no’ to extras ensures you can say ‘yes’ to your commitments."  
  - **Kidney test survives?** Yes. Per Priya: Kidney donation is supererogatory because it’s not in your MVC, even if easy/high-stakes. Your duty is to your *role*, not all moral acts.  

  **3. Baseline Authority (Who Sets the Line?)**  
  - **Disanalogy**: In jobs, the employer sets duties. Here, no "boss" exists—just a shared cause.  
  - **Why it matters**: If duties feel arbitrary ("just what we typed"), volunteers won’t respect them.  
  - **Solution for sheet**:  
    - **Ground duties in mission**: "These duties are the *minimum* needed to keep our line open reliably. They are based on 5 years of data on volunteer capacity and caller demand."  
    - **Include volunteers**: "Co-created with veteran volunteers to ensure fairness."  

  #### ⚠️ **Medium Impact (Address in Training, Not Sheet)**
  **4. Quitting vs. Morality**  
  - **Disanalogy**: You can quit a job but not "quit" moral obligations.  
  - **Why it’s lower impact**: Volunteers *can* quit the role—this is practical, not philosophical. The "authority" of the line comes from your commitment to callers, not cosmic duty.  
  - **Solution**: Not on sheet. In training, say: "This is a commitment to our callers. If you can’t uphold it, we’ll support you in stepping back."  

  #### 💡 **Low Impact (Don’t Sweat—Use as Is)**
  **5. Saying "Thank You"**  
  - **Disanalogy**: Jobs don’t thank you for duties; volunteers expect thanks for baseline work.  
  - **Why it’s fine**: Gratitude motivates volunteers. This doesn’t break the analogy.  
  - **Solution for sheet**:  
    - **Do thank volunteers for duties**: Add: "We’ll always appreciate your core commitment—it’s what keeps us running."  
    - **Don’t overthink**: Needing thanks doesn’t make duties "optional."  

  ### 3. Does Priya’s Kidney Conclusion Survive?
  **Yes—but only if you anchor duties in organizational pragmatism, not morality**.  
  - **Why it holds**: The kidney isn’t part of your MVC. Your duties exist to sustain the *service*, not solve all suffering. Even high-stakes/easy acts outside the MVC are optional because:  
    - They risk burnout (e.g., covering every 3am gap).  
    - They aren’t scalable (not everyone can donate a kidney).  
  - **Disanalogies don’t kill it**: The job analogy’s weakness (no "employer") is actually a strength here. Since the "duty" is defined by the org’s operational needs—not a moral deity—it *can* be limited.  
  - **Caveat**: If the act is *within your capacity and directly prevents catastrophe* (e.g., taking a shift when no one else can), it may *feel* required. But your sheet can clarify: "Even in emergencies, extras are voluntary. We have backup systems for this reason."  

  ### 4. A Better Analogy: The "Team Sport" Framework
  Priya’s job analogy is useful but too transactional. For volunteers, **blend it with a "team sport" analogy**:  
  - **Core**: You’re a player on a community team.  
  - **Duty** = Your position’s role (e.g., "guard the goal"). Defined in advance, essential for the team to function.  
  - **Supererogatory** = Extra training or filling in for injured players. Admired but not required.  
  - **Why it works better**:  
    - Fixes "authority" issue: The "coach" (org) sets the position based on team needs, but everyone is united by the game (the mission).  
    - Handles ratchet effect: A star player doing extra drills doesn’t change your position’s requirements.  
    - Explains gratitude: Teammates thank you for showing up—it’s collective.  
    - Moral weight retained: The "game" matters (helping callers), but positions are practical.  

  ### Final Edits for Your Sheet (Based on Audit)
  **Structure**:  
  1. **Title**: "Your Commitment: What We Count On & What’s Extra"  
  2. **Preamble**: "To serve our callers sustainably, we define a minimal viable commitment (MVC). This is your duty—what we rely on. Anything beyond is optional but appreciated."  
  3. **Duties (The MVC)**:  
     - Bullet points (e.g., "Cover 2 shifts/month," "File reports within 24h").  
     - **Key line**: "These never change based on others’ actions. Ignoring them harms our callers; sustaining them is your core promise."  
  4. **Supererogatory Acts**:  
     - "Optional: Covering gaps, holidays, extra projects. Always praiseworthy, never expected."  
     - **Key line**: "Even if easy or high-stakes (e.g., last-minute 3am shift), saying ‘no’ is always okay."  
  5. **Sustainability Pledge**: "We encourage you to protect your well-being. Overcommitting helps no one long-term."  
  6. **Gratitude**: "We’ll thank you for everything—especially your reliable core commitment."  

  **Deadline Hack**: Draft this as a table—**Duties** vs. **Optional**—with clear examples. It’s skimmable and reduces ambiguity.  

  Priya’s framework is 80% sound—just ground it in your *operational reality*, not abstract morality. The sheet’s job is to prevent burnout, not solve philosophy. Anchor duties in "what keeps the line open," and the rest follows.
