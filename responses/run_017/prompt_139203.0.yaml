     - *Pitfall (0–2 points):* Treats disagreement as a technical flaw; fails to link to epistemological trade-offs.  

  2. **Demonstrate redescription collapsing T₁/T₃ (5 points):**  
     - *Full marks:* Correctly shows reassigning features maps T₁ to T₃’s structure (or vice versa) and explains distance inversion.  
     - *Pitfall (0–3 points):* Vague or incorrect redescription; ignores distance change implications.  

  3. **Link redescription to Miller/Tichý collapse (4 points):**  
     - *Full marks:* Argues unrestricted invariance reduces similarity to content-based approaches, inviting Miller/Tichý-style language-dependence.  
     - *Pitfall (0–2 points):* Recites Miller/Tichý as "settling" the issue without applying it to the toy case.  

  4. **Identify costs of "natural properties" commitment (3 points):**  
     - *Full marks:* States that natural properties fix the metric but require metaphysical realism (ruling out anti-realism/nominalism) and raise epistemic problems.  
     - *Pitfall (0–1 points):* Assumes "natural structure" is a free move; ignores costs/rival views.  

  5. **Separate factual/epistemic truthlikeness for realism (4 points):**  
     - *Full marks:* Distinguishes *comparative truthlikeness* (factual) from *epistemic access*; evaluates regulative truthlikeness as insufficient for realism’s explanatory needs.  
     - *Pitfall (0–2 points):* Conflates truthlikeness with evidential support; claims regulative notion suffices for realism without critique.  

  **Clarity and structure (bonus):** Award up to +1 point for exceptional organization.
