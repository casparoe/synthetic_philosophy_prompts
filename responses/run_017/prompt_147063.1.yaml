  **Facilitator Moves (Part 2: Row Players’ Safety - 20 minutes)**  
  1. *Start (0:20-0:25)*:  
     - "Row players: Choose U, M, or D to maximize your worst-case payoff. Column players: Wait."  
     - *Observe choices. Expect most to choose M (best pure-strategy guarantee: 1).*  

  2. *Reveal Pure-Strategy Results (0:25-0:30)*:  
     - "If you chose U, the column player picks C → you get 0."  
     - "If you chose M, the column player picks L or C → you get 1."  
     - "If you chose D, the column player picks L → you get 0."  
     - "Best pure-strategy guarantee: 1 (by choosing M)."  

  3. *Introduce Coin Flips (0:30-0:35)*:  
     - "Can you guarantee *more than 1*? Try a coin flip: Heads = U, Tails = D. Calculate your expected payoff for each column."  
     - *Students use coins. Nudge:*  
       - "Against L: (4 + 0)/2 = ?"  
       - "Against C: (0 + 4)/2 = ?"  

  4. *Reveal Mixed-Strategy Results (0:35-0:40)*:  
