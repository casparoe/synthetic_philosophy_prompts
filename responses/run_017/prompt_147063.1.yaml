  **Facilitator Moves (Part 3: The Remaining Game - 10 minutes)**  
  *Project the reduced game after deleting R and M:*  

  | **Row payoffs** | L   | C   |
  |-----------------|-----|-----|
  | **U**          | 4   | 0   |
  | **D**          | 0   | 4   |

  | **Column payoffs** | U   | D   |
  |-------------------|-----|-----|
  | **L**            | 3   | 2   |
  | **C**            | 0   | 2   |

  1. *Check for Strict Dominance (0:40-0:45)*:  
     - "For row players: Is U strictly better than D? Against L: 4 > 0. Against C: 0 < 4. No strict dominance."  
     - "For column players: Is L strictly better than C? Against U: 3 > 0. Against D: 2 = 2. No strict dominance."  
     - "Strict dominance stops here. Surviving strategies: U/D (row), L/C (column)."  

  2. *Note Weak Dominance (0:45-0:50)*:  
     - "L weakly dominates C (better against U, equal against D). If we *weakly* eliminate C, then column must choose L. Then row chooses U (4 > 0), leading to (U, L). But weak dominance is risky—it can eliminate reasonable outcomes."  

  ---

  **Debrief (30 minutes)**  
  1. **Map the activity to the claims**:  
     - *(Claim 1)* Started with no row strategy dominated (M was viable).  
     - *(Claim 2)* R was dominated only by a L/C mixture (felt when coin flip beat R).  
     - *(Claim 3)* R was best pure strategy for worst-case (1), but mixture raised guarantee to 1.5.  
     - *(Claim 4)* After deleting R, M became dominated by a U/D mixture (felt when coin flip beat M).  
     - *(Claim 5)* Strict dominance stopped; weak dominance would force (U, L).  

  2. **General test for mixed dominance**:  
     - "Strategy S is strictly dominated by a mixture if there exists *any mix of your other strategies* that beats S in *every possible* opponent move. No need to check all mixes—just ask: *Is there a mix that always gives more than S?*"  

  3. **What the session demonstrated vs. what must be asserted**:  
     - **Demonstrated**:  
       - Mixtures can dominate when no pure strategy does.  
       - Mixtures can *increase* worst-case guarantees (safety).  
       - Deleting one strategy (R) unlocks deleting another (M).  
       - Strict dominance stops early, leaving multiple strategies.  
     - **Asserted (not reproduced in activity)**:  
       - Iterated strict dominance is **order-independent** (deletions can be done in any order; you’ll always end at the same set).  
       - Weak dominance is **order-dependent and dangerous** (it can eliminate Nash equilibria, e.g., (D, C) here).  

  4. **Predictable problems and solutions**:  
     - *Problem*: A student spots the mixture early and says it aloud.  
       - *Solution*: "Hold that thought—we’ll test it soon. First, let’s see what pure strategies can do."  
     - *Problem*: "A coin flip isn’t a strategy—it’s indecision!"  
       - *Solution*: "Flipping a coin is a *deliberate* randomization. It’s a single plan made in advance (like ‘if heads, do X; tails, do Y’). Here, it raised your guarantee—it’s *more* rational, not less."  
     - *Problem*: Students resist adversarial framing ("Why would opponents minimize my payoff?").  
       - *Solution*: "This is about *safety*—what’s the least you can get if things go against you? Real opponents might not minimize you, but this tests robustness."  

  5. **Limitations of the activity**:  
     - **Cannot reproduce**: The order-independence of strict dominance. Students see only one deletion order (R → M). You must assert: "No matter the order, if you iteratively delete all strictly dominated strategies (using mixtures), you’ll get the same result."  
     - **Weak dominance is excluded**: The activity stops at strict dominance to avoid the pitfalls of weak dominance (order-dependence, eliminated equilibria).  

