  *Project this table after Part 1. Column players now focus on this table; row players see their payoffs.*  

  **Your Role: Row Player**  
  - **Goal:** Maximize your worst-case payoff. An adversarial column player will choose the column that *minimizes* your payoff.  
  - **Your choices:** U, M, or D.  
