answer: |-
  ### The Safety Coin Flip  
  Participants will discover that a deliberate coin flip between two strategies can guarantee a higher minimum payoff than any pure strategy, and that this can unlock further rounds of elimination.

  ---

  **Handout 1 (for Column Players at the start)**  
  *Distribute to all students at the beginning. Column players focus on their payoffs; row players ignore this table for now.*  

  **Your Role: Column Player**  
  - **Goal:** Maximize your worst-case payoff. An adversarial row player will choose the row that *minimizes* your payoff.  
  - **Your choices:** L, C, or R.  
  - **Your payoffs (based on your choice and the row player's choice):**  

  |       | U   | M   | D   |
  |-------|-----|-----|-----|
  | **L** | 3   | 0   | 2   |
  | **C** | 0   | 3   | 2   |
  | **R** | 1   | 1   | 1   |

  **Task:** Choose **one pure strategy (L, C, or R)** to maximize your minimum possible payoff. Write your choice on an index card and hold it up.  

  ---

  **Facilitator Moves (Part 1: Column Players’ Safety - 20 minutes)**  
  1. *Start (0:00-0:05)*:  
     - "Column players: Choose L, C, or R to maximize your worst-case payoff. Write your choice on a card. Row players: Wait for instructions."  
     - *Silently observe choices. Expect most to choose R (best pure-strategy guarantee: 1).*  

  2. *Reveal Pure-Strategy Results (0:05-0:10)*:  
     - "If you chose L, the row player picks M → you get 0."  
     - "If you chose C, the row player picks U → you get 0."  
     - "If you chose R, the row player picks any row → you get 1."  
     - "Best pure-strategy guarantee: 1 (by choosing R)."  

  3. *Introduce Coin Flips (0:10-0:15)*:  
     - "Can you guarantee *more than 1*? Try a coin flip: Heads = L, Tails = C. Calculate your expected payoff for each row."  
     - *Hand out coins. Let students compute. Nudge:*  
       - "Against U: (3 + 0)/2 = ?"  
       - "Against M: (0 + 3)/2 = ?"  
       - "Against D: (2 + 2)/2 = ?"  

  4. *Reveal Mixed-Strategy Results (0:15-0:20)*:  
     - "50-50 mixture: Guarantees 1.5 against any row. Beats R (which gives only 1)."  
     - *Award chocolate to a student who used the mixture.*  
     - "R is strictly worse than this coin flip. We delete R."  

