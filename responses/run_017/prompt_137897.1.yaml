prompt: |-
  I teach a final-year seminar on social ontology, and I am assembling the last section of a handout on whether generational cohorts (Boomers, Millennials, Gen Z) are genuine kinds or merely convenient bins that demographers and journalists have grown fond of. The handout already has the standard illustrations and the usual complaints about arbitrary decade boundaries, so what I want at the end of it is a case built to order: a thought experiment engineered so that two accounts of what a generation is deliver opposite verdicts about a single cohort. I am presenting the two accounts roughly as follows. The historical-cause account holds that a birth cohort is a genuine generation only if its members' shared outlook was formed by their undergoing the same formative events together — the same war, the same crash, the same curriculum reform or technology arriving at the same point in the life course — so that a generation's boundaries ought to track real discontinuities in causal exposure rather than round numbers on a calendar. The prediction account holds that a generational kind earns its place purely by being a partition of birth years that lets a researcher predict attitudes, behaviour and life chances better than the alternatives actually available to her (age, survey year, social class, education), with boundaries drawn wherever predictive power is maximised and redrawn whenever something better comes along; nothing about shared experience is required.

  The direction I need is the one I keep failing to build: the prediction account says yes, this is a generation, and the historical-cause account says no, this is not one. My own attempts collapse in one of two ways — either I smuggle in a shared event after all, in which case both accounts say yes, or I produce something so gerrymandered that both say no. Constraints on the case: it should be realistic and self-contained, describable in a single paragraph, set in an institutional or demographic setting a sociologist could actually go and study (a school-entry cutoff, a pension reform, a hiring practice, a longitudinal survey, something of that kind), with no science fiction, no thought experiments about words, and no dependence on contested empirical facts about real Boomers or real Millennials that a reader would have to look up. The clustering you construct should be robust and genuinely predictive, and the causal story behind it should be perfectly ordinary — the trick has to be that the causes, however real and however many, are not causes that the cohort members underwent together as a shared history. Finally, the case must not stipulate its own verdicts: no saying "and the causes here are unrelated" or "and no one would call this a generation"; the mechanism has to be visible in the description, and both accounts must still give the intuitive answers about the familiar cohorts and about obviously bogus ones such as people born on a Tuesday. After the scenario, walk me through what each account says about it and why, name the single feature of the case that is doing the work, tell me what happens to the disagreement if that feature is removed or inverted, and give the strongest objection a defender of the historical-cause account could raise — the move she would make to claim the case as her own or to disqualify it as irrelevant.

  Please lead with the scenario itself: one paragraph, no preamble and no restating my request. Begin the analysis that follows with a single sentence giving your bottom line, then give the reasoning. Write in British English.
reasoning: |-
  Hmm, the user is teaching a social ontology seminar and needs a thought experiment for their handout about generational cohorts. They want a scenario where the prediction account says "yes, this is a generation" but the historical-cause account says "no." I need to create something realistic and self-contained, without any sci-fi or reliance on contested facts.

  The key challenge is avoiding two pitfalls: making the cohort either too event-driven (both accounts say yes) or too arbitrary (both say no). The scenario must have predictive power without shared formative experiences. 

  I'm considering institutional mechanisms that create cohort effects without shared historical events. School cutoffs come to mind—they create sharp age divisions that predict outcomes due to policy timing, not shared experiences. For example, children born just before and after a cutoff enter school in different years, leading to different treatment that affects their life paths. This isn't about shared events; it's about administrative accident.

  Let me flesh this out: a district moves its school entry cutoff from December 31 to August 31. The "transition cohort" born September-December 2007 enters school earlier than they would have under the old system. They're younger classmates with less maturity, facing curriculum mismatches. This creates lasting disadvantages in education and employment—predictable from birth dates alone. But there's no war or crash here; just bureaucratic ripple effects.

  Now, the analysis: Prediction account says yes because birth dates robustly predict outcomes. Historical-cause account says no because the causes are disparate life events, not shared experiences. The pivotal feature is that disadvantages stem from how systems treat them individually, not collective trauma. If I remove the policy change, the effect vanishes, showing it's not intrinsic. 

  For objections: A historical-cause defender might argue that shared systemic injustice binds them—but this feels weak since the experiences aren't synchronous or identity-forming. Alternatively, they could dismiss it as mere age effects, though the cutoff makes it cohort-specific. 

  This should satisfy all constraints: realistic (education policy), no stipulations, and clear divergence between the accounts. The district name ("Northshire") makes it concrete without real-world references.
answer: |-
  ### Scenario  
  In the Northshire school district, a one-time policy shift moved the primary school entry cutoff from 31 December to 31 August, effective for children turning five in 2012. Pupils born September–December 2007 (Cohort A) entered school a year earlier than they would have under the old system, placing them in classes with peers up to 12 months younger. This led to systematic disadvantages: Cohort A showed higher rates of academic redirection to remedial streams at age 11, lower university admission rates, and a persistent 5% earnings gap at age 25 compared to adjacent birth months. Demographers note that birth dates in this narrow band predict these outcomes more accurately than class background or local school quality, even after controlling for age and survey year.

  ### Analysis  
  **Bottom line:** This scenario cleanly delivers the required divergence—the prediction account recognises Cohort A as a generation, while the historical-cause account rejects it.  

  **Reasoning:**  
  - *Prediction account (says YES):* Cohort A’s birth dates (September–December 2007) form a robust predictive kind. Knowing someone belongs to this cohort improves forecasts of their academic/economic outcomes beyond age, class, or temporal variables—precisely because the administrative glitch concentrates disadvantage in this subset. The cohort boundaries align with peak predictive utility (the anomalous policy window), fulfilling the account’s sole criterion.  
  - *Historical-cause account (says NO):* Though Cohort A shares statistically *similar* disadvantages (e.g., chronic relative immaturity in class), members underwent no *common formative event*. One child experienced teasing for struggling with handwriting; another missed maths benchmarks due to younger motor skills; a third had parents stressed by retention meetings. These are disparate individual experiences stemming from systemic placement, not a collective trauma or cultural turning point (e.g., a draft, famine, or new technology adopted peer-wide). The causes are diffuse micro-events in disconnected lives.  

  **Pivotal feature:** The *mechanism of disadvantage distribution*. Cohort A’s outcomes arise from how institutions *individually* processed each child under a fleeting rule—not from cohort members *mutually living through* a shared historical episode. The causes are real (developmental mismatches, teacher biases) but atomised.  

  **Effect of altering the feature:** If Cohort A’s disadvantages instead stemmed from, say, *all members surviving the same hurricane* at age six—a collective ordeal—both accounts would say YES. If the predictive pattern dissolved (e.g., outcomes were random), both would say NO.  

  **Strongest objection from historical-cause defenders:**  
  A proponent might argue that “enduring the same flawed policy *is* the shared formative event.” Northshire’s cutoff shift functioned as a “structural trauma” that collectively marked Cohort A through universal administrative violence, forging a generational consciousness of being ‘the rushed cohort’. This reframes systemic injustice as a communal experience.  

  **Counter-reply:**  
  This overstretches “shared event.” The policy was a *condition*, not an *event lived together*. Cohort A never interacted as a group; their hardships were private, asynchronous, and mediated by individual schools/teachers. Unlike a war or epidemic, there was no cohort-level narrative, solidarity, or identity formation—merely parallel struggles. The historical-cause account thus retains grounds for rejection.  

  ---  
  **Implementation note:** This case avoids arbitrariness (the cutoff is policy-driven), resists both-collapse (no shared event exists), and mirrors real cohort studies (e.g., birth-month effects in education). It leaves familiar generations (Boomers, etc.) undisturbed while clearly contrasting the two accounts’ thresholds for "genuine kind" status.
