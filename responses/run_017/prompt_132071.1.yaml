answer: |-
  Dear Editor,

  We submit herewith a joint statement reflecting our adversarial collaboration concerning Fitch's Theorem 5 (1963) and the knowability paradox. While we diverge significantly on its implications for anti-realism, we find substantial agreement on the logical structure of the argument itself and several key observations. We present first our points of consensus, then articulate our divergent interpretations and responses, highlighting specific cruxes where our disagreement crystallizes, and conclude with reflections on what might sway our respective positions.

  **Shared Ground:**

  Fitch’s derivation demonstrates that a seemingly modest set of assumptions collapses the claim ‘Every truth is possibly known’ (∀p (p → ◊Kp), the *Unrestricted Knowability Principle* - UKP) into the absurdly strong ‘Every truth is actually known’ (∀p (p → Kp)). Crucially, the proof requires remarkably little logical machinery. The essential premises are:
  1.  **Distribution:** Knowledge distributes over conjunction: K(p ∧ q) → (Kp ∧ Kq). If you know a conjunction, you know each conjunct.
  2.  **Factivity:** Knowledge entails truth: Kp → p. If you know p, then p is true.
  3.  **Classical Logic & Minimal Modal Logic:** Including substitution of equivalents, the principle that necessity (□) implies truth, and the duality of ◊ and □ (◊p ≡ ¬□¬p).

  The core move involves considering the proposition (p ∧ ¬Kp) – a truth that is not known. Applying UKP to this proposition yields ◊K(p ∧ ¬Kp). By Distribution, this implies ◊(Kp ∧ K¬Kp). By Factivity, K¬Kp entails ¬Kp. Therefore, ◊(Kp ∧ ¬Kp). Since (Kp ∧ ¬Kp) is an explicit contradiction, its possibility (◊⊥) is equivalent to the impossibility of necessity (¬□⊤), a contradiction in most standard modal systems. The derivation thus forces a choice: reject UKP, reject Distribution, or reject Factivity.

  We concur that Distribution is extremely plausible for any operator meant to represent a robust notion of knowledge or cognitive achievement. Crucially, *dropping Factivity alone does not resolve the paradox*. If K is interpreted as ‘is truly believed’ or ‘is justifiably believed’, lacking factivity, one can indeed assert ◊K(p ∧ ¬Kp) without immediate contradiction. However, K(p ∧ ¬Kp) still entails Kp ∧ K¬Kp. While K¬Kp no longer entails ¬Kp (without factivity), K¬Kp *does* entail that the agent believes they do not know p. Whether this constitutes a different kind of absurdity relevant to a given epistemic thesis depends heavily on the specific interpretation of K. The Fitch derivation, in its basic form targeting knowledge, relies on Factivity. However, variants targeting other notions (like idealized rational belief or warranted assertibility) may or may not require a factivity-like principle to generate a problematic result; this depends on the specific properties ascribed to the target operator.

  We agree that the argument functions as a *reductio* offering multiple exit points. It does not refute any single premise in isolation but demonstrates an inconsistency within the package of UKP, Distribution, and Factivity. Consequently, any adequate response must identify which element(s) of that package it rejects and justify that choice. Furthermore, we recognize that the general *form* of the argument applies to any operator O for which Distribution holds and which entails truth (or some other property making O(p ∧ ¬Op) problematic). The vulnerability of different epistemic theses hinges on the specific logic of O.

  Finally, we agree on the *unknowability of Moorean propositions*: No proposition of the form (p ∧ ¬Kp) can be known. Any agent knowing (p ∧ ¬Kp) would, by Distribution, know p and know ¬Kp. Knowing ¬Kp (given Factivity) entails that ¬Kp is true, i.e., they do not know p. This immediately contradicts Kp. Thus, K(p ∧ ¬Kp) → (Kp ∧ ¬Kp), a contradiction. Moorean propositions are intrinsically unknowable.

  **Divergent Responses & Core Disagreements:**

  **The Repairer's Position:** The derivation successfully refutes UKP but not the core anti-realist insight that truth is epistemically constrained. The mistake lies in the *unrestricted* quantification over all propositions. A viable anti-realism requires a *Restricted Knowability Principle* (RKP), applying only to propositions within a specific class C: ∀p ∈ C (p → ◊Kp). Crucially, C must be *Moorean-free*: it cannot contain any proposition equivalent to (q ∧ ¬Kq) for some q. The Fitch proof is blocked because the troublesome proposition (p ∧ ¬Kp) falls outside C. Anti-realism survives by adopting a principled RKP whose domain C is both significant enough to ground an epistemic conception of truth and demonstrably Moorean-free.

  **The Undertaker's Position:** The derivation reveals a fatal flaw in the very project of defining truth via knowability. While technically correct that an RKP with a Moorean-free domain avoids contradiction, any such restriction sufficient to block the proof is either objectionably *ad hoc* or renders the principle too weak to serve its intended anti-realist function. The resulting RKP fails to meaningfully constrain truth beyond what a realist could accept, failing to rule out evidence-transcendent truths in a robust way or underwrite a distinctive epistemic account of truth. Consequently, anti-realism must abandon knowability as its defining thesis and seek other foundations.

  **The Cruxes:**

  1.  **Ad-hocness & Principled Restrictions:** The Repairer must specify a Moorean-free class C for RKP. The Undertaker argues that merely excluding Moorean propositions is trivial and unprincipled. They propose a stricter test: C must be definable *without using any epistemic vocabulary* (no ‘knows’, ‘known’, ‘knowable’, or terms defined using them). The justification is that “all truths except the Moorean ones” trivially satisfies Moorean-freeness but blatantly fails to be a principled restriction for knowability.
      *   **Repairer:** Rejects the ‘no epistemic vocabulary’ test as unfairly restrictive and conflating methodological with substantive principles. Principles can be *about* the epistemic without their *domain specification* being non-epistemic. Plausible candidates include: (a) *Basic Empirical Propositions* (e.g., simple observational claims about the present environment); (b) *Truths with Actual Truthmakers* (grounded in current states of affairs); (c) *Propositions Statable in a Topic-Neutral Base Vocabulary*. The Repairer predicts (a) and (b) pass the spirit of a ‘principled restriction’ test, even if (b) involves metaphysical vocabulary. They argue excluding modal claims (like future contingents or unmanifested dispositions) is principled and anti-realistically motivated. While defining C precisely without epistemic terms may be challenging for some candidates, the *motivation* for the restriction (e.g., grounding in current evidence or truthmakers) is principled.
      *   **Undertaker:** Insists the ‘no epistemic vocabulary’ test is necessary to avoid triviality and capture genuine explanatory independence. Predicts all plausible candidates fail it: (a) ‘Observational’ smuggles in epistemic notions (what counts as an observation?); (b) ‘Truthmaker’ is metaphysical, not epistemic, and a truthmaker-based restriction might allow unknowable truths about the truthmakers themselves; (c) A purely syntactic/semantic base vocabulary restriction (e.g., atomic propositions) seems arbitrary and unrelated to epistemic constraint. The Undertaker predicts any restriction substantive enough to feel non-ad-hoc will either fail the test or prove insufficiently Moorean-free under scrutiny (e.g., truths about the base vocabulary can be formed into Moorean propositions). “Truths with existing verifiers” might pass the vocabulary test but risks being compatible with realism.

  2.  **Modality of ‘Knowable’ (◊Kp):** Does ◊Kp require a world *nomologically accessible* from ours (same laws, similar knowers, shared history up to the point of inquiry), or merely *metaphysically possible* (any world, any physics, any knowers)?
      *   **Test Case:** Consider ‘The number of marbles in this now-destroyed urn was exactly N’ (where N is true but uncounted before destruction). We agree no nomologically accessible world contains knowledge of N – the evidence is gone in all worlds sharing our history and laws. However, a metaphysically possible world with different laws (e.g., allowing time travel, perfect reconstruction from traces, or telepathic access to the past) might contain a knower of N.
      *   **Repairer:** Favors a *nomological* reading of ◊ for RKP. Anti-realism concerns *our* capacity to know, given our world’s constraints. The marble-count truth is *unknowable* in the relevant sense. RKP, restricted to, say, present-tensed observational claims, remains defensible under this reading, as ◊Kp for such p is plausible. Under a metaphysical reading, RKP becomes vacuously defensible but too weak – nearly every truth is metaphysically knowable *somewhere*, undermining the constraint on *our* world’s truths.
      *   **Undertaker:** Argues that anti-realism, especially in its ‘in principle’ knowability guise, often appeals to *metaphysical* possibility. However, under this reading, RKP becomes incredibly weak. The marble-count truth *is* metaphysically knowable; restricting RKP to avoid it (and similar cases) requires narrowing C significantly, likely making RKP too weak for anti-realist work (e.g., many intuitively evidence-transcendent truths might still be metaphysically knowable). If Repairer retreats to nomological ◊, the Undertaker questions whether this aligns with traditional anti-realist motivations and whether RKP now fails to rule out truths that are *metaphysically* unknowable but *nomologically* knowable in a trivial sense.

  3.  **Self-Application:** Does RKP apply to itself? Does it apply to the proposition that it applies to itself? Etc.
      *   **Repairer:** Acknowledges potential instability. Acknowledges that asserting ‘RKP is true and RKP applies to itself’ might be problematic. Suggests a *stratified* approach: RKP(n) applies only to propositions of ‘epistemic depth n’, where the depth might be defined recursively (e.g., atomic propositions have depth 0, propositions about knowledge have depth > the depth of their embedded knowledge claims). RKP itself (a proposition *about* knowledge) would belong to a higher level. Predicts a consistent stratified hierarchy is possible, blocking self-referential paradoxes without collapsing into UKP. Admits stating the *full* principle encompassing all levels in a single sentence within the object language may be impossible or require careful meta-linguistic formulation.
      *   **Undertaker:** Suspects stratification either collapses or becomes ineffable. If RKP(n) quantifies over propositions of depth < n, then the proposition ‘RKP(n) is true’ likely has depth > n, escaping its own scope. But then the *full* anti-realist thesis – that *all* truths (within the intended domain) are knowable – cannot be stated as a single, applicable principle within the system. Attempts to state a ‘master principle’ risk reintroducing a contradiction akin to Fitch’s, or become purely schematic. Predicts that any stable stratification renders the knowability thesis too fragmented and meta-linguistically complex to serve as the core of an account of truth.

  4.  **The Work Test:** Suppose an RKP survives the ad-hocness and self-application challenges. Does it still perform the work required of an anti-realist principle?
      *   **Repairer:** Argues yes. A well-motivated RKP (e.g., restricted to contingent, non-modal, present-tensed empirical truths grounded in current evidence) still rules out robustly evidence-transcendent truths *for a significant domain* and underwrites an epistemic conception of truth *for that domain*. It captures the anti-realist core that truth within its domain cannot outrun our best possible evidence. A realist could *accept* this RKP only by misunderstanding its role or by adopting a very weak, almost instrumentalist, form of realism regarding the restricted domain. What would convince the Repairer they are wrong? If it were shown that *every* plausible, non-ad-hoc RKP compatible with anti-realist motivations is also demonstrably compatible with a fully robust, correspondence-based realism that affirms truths fundamentally beyond our cognitive reach in the relevant domain.
      *   **Undertaker:** Argues no. The surviving RKP, precisely because it avoids the Fitch contradiction by restricting its scope, fails to challenge realism meaningfully. A realist can cheerfully accept that *certain kinds* of truths (e.g., simple observations) are knowable. The realist’s core commitment – that truth is radically independent of our cognitive capacities *in general* – remains untouched. RKP becomes a local epistemological claim, not a global metaphysical one about the nature of truth. What would convince the Undertaker they are wrong? If the Repairer can articulate an RKP that (a) is demonstrably non-ad-hoc (passing something like the Undertaker’s vocabulary test), (b) is stable under self-application, and (c) *entails* a substantive, distinctly anti-realist account of truth for its entire domain that a standard realist must *reject* (e.g., one where truth *just is* ideal justifiability or verification within the domain, not mere correspondence).

  **Concessions and Potential Defeaters:**

  *   **Repairer Concession:** Acknowledges that many proposed restrictions *do* feel ad hoc or overly narrow. Admits that if the *only* way to block Fitch is a restriction that clearly does no anti-realist work (e.g., excluding all propositions mentioning knowledge), this would be fatal. What could change their view? Clear demonstration that *every* candidate RKP either succumbs to a Fitch-style paradox via a different route, or entails consequences flatly incompatible with plausible anti-realism (e.g., that we can know realism is true), or is shown to be derivable from realist premises alone.
  *   **Undertaker Concession:** Acknowledges that a highly restrictive RKP (e.g., only atomic present-tensed observation reports) avoids Fitch and is incompatible with knowing robustly evidence-transcendent truths *about that specific domain*. What could change their view? Articulation of an RKP that demonstrably meets the ‘principled restriction’ challenge (even on a relaxed view of ‘principled’), avoids self-referential paradox, and *forces* a revision in the concept of truth itself within its domain that is both anti-realist and compelling, such that rejecting this revision becomes untenable for a realist.

  **Verbal Disputes?** We suspect some disagreement about the modality of ‘knowable’ (◊Kp) may be partly verbal, hinging on differing interpretations of “in principle.” The Repairer’s nomological reading emphasizes human capacities in our world, while the Undertaker interprets anti-realism’s “in principle” as invoking broader metaphysical possibility. Clarifying the intended modality is crucial for evaluating the strength of any RKP. We also note that the quantifier over propositions (are we quantifying over all metaphysically possible propositions or only those expressible/actual?) can lead to ambiguity, though this seems less central to the core disputes outlined above.

  In conclusion, while Fitch’s derivation forces a retreat from UKP, we disagree profoundly on whether the knowability thesis can or should be salvaged in a restricted form that sustains anti-realism. Our collaboration has clarified the precise points of divergence: the nature of principled restriction, the relevant modality, the handling of self-reference, and the ultimate work required of the knowability principle itself. We present this statement not as a resolution, but as a map for navigating the ongoing debate.

  Sincerely,

  [Repairer's Name]
  [Undertaker's Name]
