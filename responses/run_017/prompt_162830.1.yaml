prompt: |-
  I sit on the animal-welfare committee of a large research and food-systems funder. Our job is to decide which taxa attract welfare conditions in the projects we pay for: husbandry standards, killing-method requirements, and, in a few cases, a requirement that the project not proceed at all. We have no statutory remit and no case law to lean on, only our own past decisions, and I would like you to treat that track record as the thing to be extrapolated from.

  The precedents, in order:

  1. Farmed finfish: full coverage.
  2. Cephalopods used in laboratory experiments: full coverage, although the numbers of animals involved are small. The stated reason was flexible learning plus a large, centralized, integrative nervous system.
  3. Decapod crustaceans in capture fisheries and processing: full coverage. The decision cited nociceptive and analgesic-response evidence, but it also said outright that the number of animals affected mattered to the verdict.
  4. Adult honeybees and bumblebees in laboratory experiments: no coverage. The stated reason was that insect behavioural flexibility is explained by modular, non-integrated processing, so there is no candidate unitary subject whose welfare could be at stake.
  5. Drosophila in funded laboratories: no coverage, on the same modularity rationale; the committee recorded that it saw no relevant difference from the bee case.
  6. Soil nematodes and other meiofauna affected by funded agricultural projects: no coverage, notwithstanding that the numbers there run many orders of magnitude beyond the decapod case. The minute records that numbers alone do not generate obligations.

  The new case is a scale-up proposal to rear roughly a billion crickets a year for food and feed, killed by heat or mechanical means at the adult stage. The evidence available to us: nociceptor-like cells, some associative learning, motivational trade-offs in a handful of paradigms, and no agreed anatomical integrator. Committee members' credences that an adult cricket has valenced states run from about one percent to about twenty percent. Two complications have come up in discussion and I want them addressed rather than set aside. First, whether the relevant credence should be assigned per taxon or per individual, and whether credences across insect taxa can be treated as independent when they rest on largely the same evidence base: if not, then aggregating expected disvalue across taxa may double-count one and the same uncertainty. Second, one member argues that if the segmental ganglia of an insect each support a separate locus of experience, then the number of welfare subjects per animal is greater than one, which multiplies any scale estimate rather than undermining it; another replies that this only shows the notion of a subject has stopped doing work at that level of description.

  What should we decide, if we want to be consistent with ourselves? Please (1) set out the two or three candidate rules that fit all six precedents equally well; (2) give a compact table with one row per rule, showing what it predicts about the crickets and about the diagnostic case you propose in (4); (3) identify the closest analog among the precedents, give your recommendation with the reasons for preferring that rule, and state plainly what principle we would be adopting if we went the other way; (4) name the single further case — a taxon, a life stage, or a setting — that would best separate the rules, and say why it separates them. If part of our disagreement turns out to be verbal rather than substantive, say which part and what reformulation would dissolve it. Keep the entire answer under 700 words.
reasoning: |-
  Hmm, the user is part of an animal welfare committee for a research funder, needing to decide on welfare coverage for farmed crickets. They've provided six precedents with varying outcomes based on nervous system complexity, evidence of valenced states, and scale. The key challenge is consistency in applying past reasoning to this new case.

  Looking at the precedents: finfish, cephalopods and decapods got full coverage due to evidence of integrated consciousness/valenced states (with scale mattering for decapods). Insects (bees, Drosophila), meiofauna got no coverage based on modular nervous systems lacking a unitary subject, with explicit rejection of scale alone as justification.

  For crickets, the evidence shows some nociception and learning, but no confirmed anatomical integrator. Committee credences about valenced states are low (1-20%). Two complications arise: whether to assign credence per taxon or per individual, and the ganglia issue potentially multiplying welfare subjects.

  Three consistent rules emerge from precedents:
  1. Coverage requires evidence of centralized integration (rejects scale alone)
  2. Coverage requires either integration OR large scale + some evidence of valenced states
  3. Coverage based on expected disvalue calculation (credence × scale × intensity)

  The cricket case most resembles the bee/Drosophila rejections - similar evidence level, same modularity concern. Applying rule 1 (integration-focused) would mean no coverage, keeping with precedent. Rule 2 might lead to coverage due to massive scale, but this would contradict the explicit nematode precedent where scale was dismissed.

  The ganglia multiplication argument seems weak - if each segment had separate experience, we'd expect behavioral evidence of conflict, which isn't observed. This appears more verbal than substantive; reframing "welfare subject" as requiring integrated behavioral agency would resolve it.

  To test these rules, a good separator case would be larval insects (like caterpillars) with simpler ganglia but massive numbers - rules 1 and 2 would disagree sharply here. 

  Recommendation: No coverage for crickets, following rule 1 and precedents 4-6. The core principle being adopted is that welfare requires evidence of an integrated subject of experience. Choosing coverage would implicitly prioritize scale over integration evidence, contradicting past decisions on nematodes.
answer: |-
  Based on your precedents, here are three consistent candidate rules, their predictions, analysis, and a diagnostic case:

  **1. Candidate Rules Fitting Precedents:**
     - **Rule I (Integration Required):** Full coverage *only* if there is evidence of a **centralized, integrative nervous system** supporting a unitary welfare subject. Scale alone is insufficient (Precedents 4-6).
     - **Rule II (Scale-Weighted Uncertainty):** Full coverage if either (a) integration is proven *or* (b) **scale is very large** AND there is non-zero credence in valenced states (≥1%), *provided* scale factored positively in a past coverage decision (Precedent 3).
     - **Rule III (Expected Disvalue):** Coverage depends on **expected disvalue**: credence in valenced states × number of individuals × intensity of harm. Rejects ganglia multiplication (Precedents 4-6 reject fragmentary subjects).

  **2. Predictions Table:**
  | Rule          | Cricket Rearing (1B/yr) | Diagnostic Case: *Larval Lepidoptera in Agriculture* (10^14/yr, minimal ganglia integration) |
  |---------------|--------------------------|---------------------------------------------------------------------------------------------|
  | **Rule I**    | **No coverage**          | No coverage (no central integration)                                                        |
  | **Rule II**   | **Coverage** (large scale + >0% credence) | Coverage (extreme scale + minimal credence)                                               |
  | **Rule III**  | **Coverage** (high expected disvalue) | Coverage (extreme expected disvalue)                                                      |

  **3. Recommendation & Reasoning:**
  - **Closest Analog:** Adult honeybees/Drosophila (Precedent 4/5). Like crickets, they exhibit some learning but lack an agreed anatomical integrator; modular processing was decisive.
  - **Recommendation: Adopt Rule I (No Coverage for Crickets).**  
    - **Why?** Precedents 4-6 explicitly reject coverage for taxa with decentralized nervous systems, regardless of scale (nematodes at 10^15+ set a scale ceiling). Precedent 3 (decapods) required *both* nociception evidence *and* scale, but crucially cited neural evidence absent here. Rule II/III would contradict nematodes/bees by allowing scale or disvalue to dominate without integration evidence.
  - **Principle if Choosing Coverage (Rule II/III):** You would prioritize aggregate expected suffering over the existence of an integrated subject, overturning the "unitary subject" requirement in Precedents 4-6.

  **4. Best Separator Case:**  
  - **Taxon:** **Larval Lepidoptera (e.g., caterpillars)** in broad-scale agriculture.  
  - **Why?** They have simpler ganglia than adult insects, minimal evidence of integration, but astronomical numbers (e.g., 10^14+ in pest control). Rule I predicts *no coverage* (like nematodes). Rule II predicts *coverage* (scale exceeds decapods + non-zero credence). Rule III also predicts coverage. This forces a choice between integration (I) and scale/disvalue (II/III).

  **Verbal Disagreement Dissolution:**  
  The ganglia multiplication argument ("many subjects per insect") is semantic. Precedents 4-6 treat the *organism* as the relevant unit. Reformulate: "Welfare subjects require **integrated behavioral agency**." Isolated ganglia lack this (e.g., decapitated insect segments show no goal-directed behavior). This aligns with Precedent 4’s "modular, non-integrated processing" rationale.

