  ### Deliverable 1: Menu of Readings  

  | Reading                   | Precise Claim                                                                                                                               | Status                         | Supports the dismissal? | What would settle it                                   |
  |---------------------------|---------------------------------------------------------------------------------------------------------------------------------------------|--------------------------------|-------------------------|--------------------------------------------------------|
  | **All-risks**             | Overall probability of death/injury from any cause per person-year is lower now than in any past period.                                    | Substantive and contested      | Partly                  | Comparative data on all-cause mortality risk.          |
  | **Rate**                  | Violent deaths per 100,000 people per year are lower now than in any past century.                                                          | Substantive and contested      | Yes                     | Standardized homicide/violence rate datasets.          |
  | **Absolute-count**        | Total annual violent deaths globally are lower now than in any prior era.                                                                   | False or very likely false     | No                      | Global historical estimates of absolute violent deaths.|
  | **Share-of-deaths**       | Violence accounts for a smaller proportion of all deaths now than in any past century.                                                     | Substantive and contested      | Partly                  | Cause-of-death distributions across eras.             |
  | **Lifetime-risk**         | An average person’s probability of dying violently over their lifetime is lower now than ever before.                                       | Substantive and contested      | Yes                     | Cohort studies of violent death risk.                  |
  | **Baseline-comparison**   | Current violent death risk is lower than during pre-state eras (e.g., prehistory) or specific violent periods (e.g., WWII).                | Substantive and defensible     | Yes                     | Violence estimates for specified baselines.            |
  | **Perception**            | Objective safety indicators are better than subjective fears suggest due to cognitive biases amplifying vivid violence.                     | Substantive and contested      | No                      | Surveys comparing perceived vs. statistical risk.      |
  | **Robustness**            | All major operationalizations of violence (rate, share, lifetime risk) show decline, making the trend measure-invariant.                   | Substantive and contested      | Yes                     | Multi-measure trend convergence analysis.              |
  | **Stipulative**           | Intentional interpersonal physical harm rates have declined; structural/administrative harms are excluded by definition.                    | Substantive and contested      | Yes                     | Definitional alignment with "violence."                |
  | **Moral-progress**        | Societies increasingly reject violence as illegitimate, reducing its normative acceptability and frequency.                                | Substantive and contested      | Partly                  | Historical norms/practices toward violence.            |
  | **Threat-weighted**       | Person-years under credible threat of violence (weighted by threat probability) are lower now than historically.                            | Indeterminate                  | No                      | Quantifiable historical threat regimes.                |
  | **Century-comparison**    | The 21st century has lower violent death rates per capita than any prior century.                                                          | Substantive and contested      | Yes                     | Century-aggregated violence datasets.                 |

