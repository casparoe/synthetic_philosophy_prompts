answer: |-
  ### Simplified Kelly-Based Decision Procedure for Perpetual Scholarship Fund

  Here's a step-by-step decision procedure for your committee, designed to maximize long-term geometric growth while acknowledging real-world constraints (no precise probabilities, correlations, committee values). It works for **annual allocations** (e.g., 60/40 stocks/bonds) and **one-off opportunities** (e.g., challenge grants, investments, buildings).

  ---

  ### Core Principles
  1. **Goal**: Maximize the fund's *long-term growth rate* (geometric mean), not short-term returns.  
  2. **Key Insight**: Large losses permanently impair compounding. We avoid bets that risk >20% of the corpus.  
  3. **Payout Drag**: The 5% annual payout is a "tax" on growth. All returns are evaluated *after* this drag.  
  4. **Uncertainty**: Use conservative estimates when ranges are given (e.g., lowest success probability).  
  5. **Correlations**: Adjust sizing for overlap with existing portfolio (simplified to "low/medium/high").  
  6. **Values Calls**: Explicitly flagged for committee judgment (mission, risk tolerance, budget stability).

  ---

  ### Decision Procedure: 7 Questions in Order

  #### **Question 1: Mission Alignment**  
     - *Ask*: "Does this align with our mission and perpetuity goal? Would the donor family approve?"  
     - **Good enough**: Consensus that it fits the fund's purpose.  
     - **Stop if**: No → Reject.  
     - *Values call*: Subjective mission alignment.

  #### **Question 2: Base Case**  
     - *Ask*: "What happens if we do nothing? What alternatives exist?"  
     - **Good enough**: Clear comparison to status quo or other options.  
     - **Stop if**: Alternatives clearly dominate or are less risky.  
     - *Values call*: Opportunity cost trade-offs.

  #### **Question 3: Holding Period & Liquidity**  
     - *Ask*: "How long is capital committed? Can we exit early? Are there scholarships due during this period?"  
     - **Good enough**: Rough timeline (e.g., "6 years," "90 days").  
     - **Stop if**: Liquidity needs conflict with payout obligations.  
     - *Values call*: Acceptable lockup period.

  #### **Question 4: Outcome Scenarios**  
     - *Ask*:  
       - For assets (stocks/bonds): "Best-guess *annual* return and volatility?"  
       - For opportunities: "Best/worst-case returns? Probability of success?"  
     - **Good enough**:  
       - Use a simple scenario table (see examples below).  
       - If probability is a range (e.g., 30–60%), use the **conservative end** (30% for success cases, 70% for failures).  
     - **Stop if**: Expected return < risk-free rate + 5% payout (see *Question 5*).  
     - *Judgment with numbers*: Estimates are educated guesses.

  #### **Question 5: Expected Net Growth**  
     - *Calculate*:  
       - **Adjust for payout drag**: Multiply returns by `(0.95)^T` (T = holding period in years).  
       - **Expected net growth**: `(Prob. success × Adjusted success return) + (Prob. failure × Adjusted failure return) - 1`.  
     - **Good enough**: Positive expected net growth after adjustment.  
     - **Stop if**: ≤0 → Reject (insufficient margin).  
     - *Math note*: Incorporates the 5% payout as a compounding drag.

  #### **Question 6: Kelly Sizing & Correlation Adjustments**  
     - *Calculate*:  
       1. **Variance of net returns**: `Σ [Prob. × (Adjusted return - Expected net growth)^2]`.  
       2. **Raw Kelly fraction**: `Expected net growth / Variance`.  
       3. **Adjust for correlation**:  
          - Low correlation: Use 100% of raw Kelly.  
          - Medium: Use 66% of raw Kelly.  
          - High: Use 33% of raw Kelly.  
       4. **Apply caps**:  
          - Max 10% of corpus for any one-off opportunity.  
          - Max 20% for annual allocations (to limit volatility).  
     - **Good enough**: Fraction ≤ caps.  
     - **Stop if**: Fraction ≤0 → Reject.  
     - *Judgment with numbers*: Correlation is qualitative (e.g., "high" = tech stock in a tech-heavy portfolio).

  #### **Question 7: Stress Test & Volatility Check**  
     - *Ask*:  
       - "In the worst case, could we still pay scholarships for 5 years?"  
       - "Is the scholarship budget volatility acceptable?"  
     - **Good enough**:  
       - Corpus doesn’t drop below 5× annual payout in worst-case scenario.  
       - Annual budget volatility ≤15% (if breached, committee reduces allocation).  
     - *Values call*: Risk tolerance and budget stability preferences.

  ---

  ### Key Notes for the Committee
  - **Why geometric growth > expected return?**  
    *"Expected return ignores the risk of large losses that permanently reduce compounding. Geometric growth prioritizes survival and long-term stability for perpetual funds."*  
  - **Blind Spots**:  
    - **Budget Volatility**: Maximizing geometric growth doesn’t control short-term scholarship fluctuations.  
    - **Tail Risks**: Underestimating black-swan events (e.g., market crashes).  
    - **Non-Quantifiables**: Mission impact, family sentiment, or reputational risks.  
  - **When to Override**: If the math conflicts with values (e.g., "We hate this answer"), use Question 7 to cap sizing or reject.

  ---

  ### Case Studies: Running the Procedure

  #### **Case 1: Annual Stock/Bond Allocation**  
  - *Current gut feel*: 60/40 stocks/bonds.  
  - **Q1–Q3**: Mission-aligned, 1-year holding, liquid.  
  - **Q4**: Stocks: Expected return 7% ± 15% volatility. Bonds: 3% ± 5% volatility. Correlation = 0.2.  
  - **Q5**: Payout drag = 5%. Expected net growth (stocks): `7% - 5% = 2% > 0`.  
  - **Q6**:  
    - Kelly fraction for stocks: `(0.07 - 0.02 risk-free) / (0.15)^2 = 2.22` → 222% (implies leverage!).  
    - Correlation adjustment: N/A (annual allocation).  
    - Cap at 100% (no leverage). Bonds: Kelly fraction 0.  
  - **Q7**: Portfolio volatility = 100% × 15% = 15% (at threshold).  
  - *Committee decision*: **100% stocks, 0% bonds**.  
  - *Why you’ll hate it*: Aggressive, no bonds for safety. Override to 80/20 if volatility is too high.

  #### **Case 2: Program-Related Investment (3x or Bust)**  
  - *Opportunity*: Invest $X. Return 3× in 6 years (success) or lose 90% (failure).  
  - **Q1–Q3**: Mission-aligned, 6-year lockup.  
  - **Q4**: Success probability = 30–60% (use 30% conservative). Success return: 3×. Failure return: 0.1×.  
  - **Q5**:  
    - Payout drag: `(0.95)^6 ≈ 0.74`.  
    - Adjusted returns: Success = `3 × 0.74 = 2.22×`, Failure = `0.1 × 0.74 = 0.074×`.  
    - Expected net growth: `(0.3 × 2.22) + (0.7 × 0.074) - 1 = -0.25 < 0`.  
  - **Stop at Q5**: **Reject** (negative net growth).  
  - *Note*: Even at 60% success probability, net growth = `(0.6 × 2.22) + (0.4 × 0.074) - 1 = 0.37 > 0`, Kelly fraction = 0.37 / Variance ≈ 15%. After high-correlation adjustment (33%): 5%. Stress test passes.  
  - *Committee decision*: **Reject at Q5** (too risky with conservative estimates). If director insists, rerun at 60% success.

  #### **Case 3: 90-Day Donor Challenge Grant**  
  - *Opportunity*: Spend $1M from corpus for a grant → donor matches with $1M scholarship.  
  - **Q1–Q3**: Mission-aligned, 0.25-year holding, liquid.  
  - **Q4**: Guaranteed "return": Spend $1M, but $1M added to scholarships (no corpus growth).  
  - **Q5**:  
    - Payout drag: `(0.95)^{0.25} ≈ 0.99`.  
    - Adjusted return: `1.0 × 0.99 = 0.99×` (net loss of 1%).  
    - Expected net growth: `0.99 - 1 = -0.01 < 0`.  
  - **Stop at Q5**: **Reject** (mathematically erodes corpus).  
  - *Why you’ll hate it*: Feels like "free money," but hurts perpetuity.  
  - *Values call*: **Override with mission justification** (e.g., "This grant aligns with donor legacy, so we accept 1% erosion").

  ---

  ### How to Present to the Board President
  **Q**: "Why not just maximize expected return?"  
  **A**:  
  *"Expected return ignores deep losses that permanently cripple compounding. Geometric growth prioritizes survival—ensuring scholarships last forever by sizing bets to avoid risking the corpus."*  

  **Q**: "What’s the catch?"  
  **A**:  
  *"It can’t control short-term budget volatility, and we’ll still need judgment on mission fit and risk tolerance. But it stops us from blowing up the fund."*

  ---

  ### Practical Implementation
  - **Pre-Meeting**: Staff prepares Q1–Q4 for each proposal.  
  - **In Meeting**: Spend 10–15 min per item. Use a spreadsheet for Q5–Q6.  
  - **Output**: Clear "yes/no/max size" with explicit values calls.  
  - **Template**: [Download a simple calculator here](https://docs.google.com/spreadsheets/d/1x0C0RJTZWmXUJ5K0Z2YmX5Qk8TrX2xJpX1m2YbYqHqk).  

  This balances mathematical rigor with committee realism—and keeps you within 90 minutes.
