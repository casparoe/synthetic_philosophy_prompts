  Blind spots of maximizing geometric growth:

  1. It does not control for short-term volatility. The scholarship budget will fluctuate with the portfolio value because the payout is a percentage of the corpus. In down years, the payout will be lower. If the committee wants a stable scholarship budget, they must smooth the payouts (e.g., by using a moving average) or reduce volatility.

