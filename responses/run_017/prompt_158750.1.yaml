  3. It does not account for liquidity needs. The fund must have enough liquid assets to meet the payout obligations.

  4. It assumes we know the return distribution. With uncertainty in parameters, the Kelly fraction might be overstated.

  5. It does not account for tail risks (extreme events) if the return distribution is not normal.

  6. The procedure might be mathematically complex for the committee.

