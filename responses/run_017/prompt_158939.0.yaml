prompt: |-
  My friend Priya and I spent like three hours last night arguing about whether thought experiments in philosophy ever actually show anything, or whether they're just rhetorical gadgets (she kept calling them intuition pumps, which I think is Dennett's phrase) that make a conclusion feel obvious without giving you any reason for it. She says they're the closest thing philosophy has to data; I said they're persuasion with a lab coat on. We ended up going case by case, and I came away with a pile of verdicts that I now realize don't obviously add up, so I'm trying to work out what I actually think.

  Here's where I landed. Gettier's little story about the job candidate and the coins in somebody's pocket (I'm probably mangling the details, you know the shape) — legit. It's tiny, there's basically no imagery, and it turns on exactly one move: justified true belief that still isn't knowledge. Thomson's violinist — legit too, even though the setup is completely fantastical, because the fantasy is a stand-in for something real and the weirdness isn't what's pushing me. Parfit's teletransporter — legit, and I trust it more because my answer barely changes whether the copy is made before or after the original is destroyed, or whether there are two copies. Nozick's experience machine — I think it's rigged. If I say it flatly ("you reliably get whatever you most want and you never find out") my resistance mostly evaporates, and what's left doing the work is the picture of a body floating in a tank. Same with the utility monster: the monster part is doing all the persuading. But the repugnant conclusion I want to keep, even though it's also a pure aggregation intuition and also kind of gross, because I can put it in completely flat language and still feel the pull. The Chinese room — I want to throw out, on the grounds that whether the guy in there "understands" Chinese is precisely what's being argued about, and the image of a man shuffling flashcards is one side's conclusion dressed up as a neutral setup. Mary the color scientist — I also want to throw out, but for a different reason: I think the question "does she learn something new" slides between learning a fact and gaining an ability, and you get a different answer depending on which one you hear. And here's the pair I keep going back to: I'm keeping the teletransporter, which is science fiction, while junking the experience machine, which is also science fiction, and my only story about the difference is that the teleporter's fiction stands in for a real question about what matters in survival while the machine's fiction is a picture of the very thing being argued about — which feels like something I invented on the spot to save the verdicts I already liked.

  The rule I half-articulated to Priya over the second round of drinks was: a thought experiment earns its conclusion only if (1) the fantastic element is a substitution for an ordinary situation rather than a picture of the disputed thing itself, (2) the verdict survives being restated in flat language with all the imagery stripped out, and (3) the verdict doesn't flip when you re-describe the scenario from the other side, or swap the loaded details for neutral ones. She pointed out that clause (2) probably sinks my verdict on Mary: stated drily — someone who knows every physical fact about color vision sees red for the first time, is there something she comes to know? — I still want to say yes, which means either the case is fine and my verdict is wrong, or clause (2) isn't enough and I need a further clause about setups whose question has more than one reading. And she said clause (1) fails my own teletransporter verdict, since the scanning machine there is arguably a picture of survival rather than a stand-in for it. I've started calling the irrelevant imagery "sticky details," and my worry is that everything I distrust just happens to be a case where I dislike the conclusion.

  So: can you give me a principle that actually captures the pattern, or tell me straight which of my verdicts I have to give up? I'd like it stated precisely enough that I can apply it, with the case that motivates each clause, and I want you to be honest about where my set is simply inconsistent rather than papering over it with a disjunctive clause for every case. Then tell me what the principle says about the three I couldn't settle: Chalmers's zombie case (conceivable that there's someone physically identical to me with nothing it's like to be them) — flat restatement doesn't dissolve it for me, but the setup feels like a picture of the thing in dispute in the same way the Chinese room does, so my rule is pulling two ways; a near-future version of the teleporter where it's just a commute and the scan is imperfect, where I notice I'd probably use it, which makes me think my survival intuition is tracking something other than identity; and a trolley case rewritten as a product-safety decision at a car company, where the numbers are real (a recall costs 40 lives, skipping it costs 12) but the version I was shown includes a named six-year-old. I'm running a undergrad reading group next semester and I need a defensible rule for which of these things I put on the syllabus, so ideally the principle is something I can say in a sentence or two and then actually use.
reasoning: |-
  Okay, this user is deep in philosophical territory, wrestling with the epistemic value of thought experiments after a marathon debate with their friend Priya. They've mapped out detailed verdicts on classic cases (Gettier good, experience machine bad) but sense inconsistency, especially when comparing teletransporter (kept) vs experience machine (junked). Their self-proposed three-clause rule keeps crumbling under scrutiny - Priya already poked holes in it regarding Mary's room and the teletransporter. 

  The core tension is between their intellectual honesty and conclusion preferences. Notice how they explicitly worry that "everything I distrust just happens to be a case where I dislike the conclusion." Smart self-diagnosis. They're also pragmatically motivated - this isn't just academic; they need to select undergrad reading group materials with defensible criteria. The three unsettled cases (zombies, imperfect teleporter, corporate trolley) are particularly telling because they expose different failure modes: the zombie case has conceptual slippage like Chinese Room, the teleporter variation triggers behavioral contradictions, and the corporate trolley reveals how "sticky details" (that named child!) manipulate moral calculus.

  What they're really seeking is an acid test for when thought experiments function as genuine discovery tools versus rhetorical Trojan horses. Their existing clauses (substitution principle, flat-language survival, neutrality under redescription) are perceptive but leaky. The substitution principle fails on teletransporter; flat-language tests can't resolve ambiguous questions like Mary's room; neutrality is great in theory but many thought experiments smuggle in contested assumptions through setup (Chinese Room being Exhibit A).

  For a constructive path forward, we should acknowledge that no single principle will cleanly sort all cases - philosophy's messy. But we can refine their framework by: (1) adding a "burden-of-proof" layer to handle ambiguous questions (solving Mary's room), (2) distinguishing between intuition-pumping and contradiction-revealing functions (Gettier vs trolley cases), and (3) embracing scenario variations as diagnostic tools (like their teleporter commute test). The corporate trolley rewrite actually proves their point beautifully - stripping names makes the utilitarian calculus dominant, exposing how the original's emotional resonance was doing heavy lifting.

  Ultimately their instincts are sharp: sticky details often signal rhetorical manipulation. But we should validate that some conclusions deserve keeping (repugnant conclusion withstands flattening) while others require surrender (zombies share Chinese Room's begged-question flaw). The defensible teaching criterion might be: "Use experiments that survive at least two counterfactual rewrites and force confrontation with actual premises rather than imported imagery." That passes their syllabus needs while honoring their hard-won insights.
answer: |-
  Here's a precise principle derived from your analysis, designed to be defensible and applicable, followed by a frank assessment of your verdicts and the unsettled cases:

  **The Principle:**
  A thought experiment successfully demonstrates a philosophical point **only if** (1) its core scenario isolates the *logical structure* of the problem without smuggling in contested assumptions via *sticky details* or emotionally manipulative framing, and (2) the intuition it generates *robustly survives* multiple counterfactual variations and restatements designed to neutralize rhetorical bias, revealing a genuine conceptual tension or implication.

  **Motivating Cases for Each Aspect:**

  1.  **Isolating Logical Structure (Avoiding Sticky Details/Smuggled Assumptions):**
      *   **Legit:** Gettier Case (isolates JTB ≠ Knowledge via minimal, uncontroversial elements). Thomson's Violinist (fantasy substitutes for bodily autonomy violation, core logic remains).
      *   **Illegit:** Chinese Room (image of a man *shuffling symbols* *is* the contested claim "syntax ≠ semantics" – it smuggles the conclusion). Experience Machine (image of the *floating body/tank* evokes aversion to passivity/inauthenticity *instead* of purely isolating hedonism).
      *   **Motivation:** Prevents the setup from being the conclusion in disguise or relying on irrelevant emotional triggers.

  2.  **Robustness Under Variation/Restatement:**
      *   **Legit:** Parfit's Teletransporter (intuition holds whether copy precedes destruction, follows destruction, or duplicates – reveals core question about continuity vs identity). Repugnant Conclusion (pull remains even stated flatly: vast population with lives barely worth living > smaller population with wonderful lives?).
      *   **Illegit:** Utility Monster (intuition *depends* on the "monster" imagery; swap for "individual with vastly increased capacity for well-being" – intuition weakens significantly). Experience Machine (restated flatly as "guaranteed maximal desire fulfillment without detection" – resistance *does* often evaporate for many, revealing the sticky detail's role).
      *   **Motivation:** Ensures the intuition tracks the *conceptual point* itself, not the specific, potentially manipulative, narrative wrapper.

  **Honest Assessment of Your Verdicts & Inconsistencies:**

  1.  **You Must Give Up:** Your verdict on **Mary the Color Scientist** is inconsistent *if* you keep clause (2) as previously stated. Stated flatly ("Does someone knowing all physical facts about color vision learn something new upon seeing red?"), the "yes" intuition *is* robust for many (including you, as Priya noted). The ambiguity ("fact" vs "ability") is *part of the philosophical debate the experiment aims to provoke*. Your objection identifies a challenge in interpreting it, but doesn't invalidate the experiment itself under the new principle. **Keep Mary.**
  2.  **You Can Keep (with Principle Support):** Gettier, Thomson, Parfit's Teletransporter, Repugnant Conclusion. These satisfy both clauses: minimal/bare setups isolating structure, and robustness under restatement/variation.
  3.  **Correctly Junked (with Principle Support):** Chinese Room (violates clause 1 - smuggles conclusion), Experience Machine (violates clause 2 - not robust under restatement, relies on sticky details), Utility Monster (violates clause 2 - not robust under neutral restatement).
  4.  **Teletransporter vs Experience Machine Justification:** Your on-the-spot justification ("stand-in" vs "picture of the thing") *is* captured by Clause 1. The teletransporter *is* a stand-in/scaffolding for exploring *what matters* in survival (psychological continuity?).
      *   **Priya's Challenge:** The scan *is* a picture of *a specific mechanism*, but the *experiment's point* isn't to prove scans destroy identity. It's to use the scan mechanism as a *tool* to sever physical continuity from psychological continuity, forcing us to ask *which one matters*. It isolates the *structure* of the survival question. The Experience Machine, however, *directly depicts* the state of being plugged in, which *is* the state of pure hedonistic experience being evaluated, making it harder to disentangle the state itself from the evocative imagery depicting it.

  **Ruling on Unsettled Cases:**

  1.  **Chalmers's Zombie:**
      *   **Principle Verdict:** **Junk.** Primarily violates Clause 1. The setup ("physically identical but no consciousness") *is* the very concept of philosophical zombies – the *core claim* being disputed (physicalism entails phenomenology). It smuggles the conceivability of separation as evidence for its possibility/metaphysical significance. The intuition ("it's conceivable!") feels robust under restatement, but the setup itself *assumes* the conceptual distinctness it's meant to demonstrate. It functions more like the Chinese Room – the image *is* the contested conclusion.
      *   **Teaching:** Useful for *introducing* the hard problem and dualist intuitions, but highlight its highly controversial status and the charge of begging the question. Not ideal as a *demonstrative* tool.

  2.  **Imperfect Teletransporter Commute:**
      *   **Principle Verdict:** **Keep (as Variation).** This isn't a *new* experiment; it's a crucial *variation* on Parfit's original, *testing the robustness* of the intuition. Your willingness to use it reveals that your survival intuition tracks something *other* than strict identity (likely psychological continuity or connectedness). This *strengthens* the original experiment's point by showing its core logic (separating identity from what matters) holds even with a more realistic, appealing mechanism.
      *   **Teaching:** Essential follow-up to Parfit. Demonstrates the *power* of variation to refine and test the core intuition.

  3.  **Corporate Trolley (Recall Decision):**
      *   **Principle Verdict:** **Junk the Version with the Named Child. Keep a Bare Version.**
      *   **Named Child Version:** Clearly violates Clause 1. The "named six-year-old" is a classic sticky detail injecting powerful, irrelevant emotional bias ("identified victim effect"). It manipulates the intuition away from the pure aggregation question (save 28 lives?).
      *   **Bare Version ("Recall costs 40 lives, skipping costs 12"):** **Keep.** This *removes* the sticky details, isolating the core utilitarian aggregation dilemma in a real-world context. The intuition ("skip the recall?") is likely robust and reveals the tension between statistical lives and action/inaction. *This* version satisfies the principle.
      *   **Teaching:** Use the *bare* version to discuss utilitarian aggregation in policy. You could *contrast* it with the emotional named-child version to brilliantly illustrate the *impact* of sticky details on moral intuition.

  **Defensible Teaching Rule (One Sentence):**
  "Prioritize thought experiments where the core scenario cleanly isolates the logical problem using uncontroversial or substitutable elements, and where the key intuition persists strongly when stripped of evocative details or tested against plausible counterfactual variations."

  This principle:
  *   **Captures Your Insights:** "Sticky details," substitution vs depiction, robustness under restatement/variation.
  *   **Is Actionable:** You can apply it case-by-case.
  *   **Resolves Inconsistencies:** Forces you to keep Mary and abandon the sticky-detail-laden Corporate Trolley/Zombie.
  *   **Acknowledges Function:** They *are* intuition pumps, but the principle distinguishes *reliable* pumps (revealing conceptual structure) from *unreliable* ones (distorted by rhetoric).
  *   **Fits Teaching:** Provides clear criteria for selecting robust, pedagogically valuable experiments. Use variations (like the commute teleporter) to test robustness.
