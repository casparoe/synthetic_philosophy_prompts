  *   **Pinning it Down:** A **longitudinal study of small-mammal populations on marginal cropland vs. average cropland/pasture**. Design: Identify agriculturally marginal fields (low soil grade, drainage issues) scheduled for abandonment/conversion. Monitor small-mammal density/biomass (livetrapping, tracks, cameras) for 3-5 years pre/post change, comparing to control sites (average crop/pasture). Control for regional population cycles.

