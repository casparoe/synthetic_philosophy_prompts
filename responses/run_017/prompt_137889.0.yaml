prompt: |-
  Someone in my department (works on decision-theory adjacent stuff, so presumably knows what he's talking about) posted a short explainer of why you have to be an expected utility maximizer. I'm paraphrasing from memory so its maybe not word for word, but roughly:

  "It's two arguments glued together. If your degrees of belief break the probability calculus, a bookie can offer you a package of bets, each of which you're happy to accept at your own odds, that loses you money no matter how the world turns out — a Dutch book. And if your preferences are intransitive, or you violate independence, you can be money-pumped: walked through a series of choices each of which you prefer at the time, ending up with strictly less than you started and having paid for the privilege. So probabilism and expected utility maximization aren't optional norms of rationality, they're just what not being exploitable comes to. 'Utility' here just means money corrected for risk, so the theory says take whatever option has the higher expected dollar payoff — someone who prefers a guaranteed hundred bucks to a coin flip that pays 110 or 90 is making exactly the kind of mistake the theorems rule out. And that's really why the Allais paradox is fatal: ordinary people violate these axioms systematically, and a norm of rationality that nearly everybody fails can't be the right norm."

  I mostly believed it when I read it, but it feels too clean, and two bits have been nagging at me: the bit about expected dollars, and "just what not being exploitable comes to". Can you go through it and separate what a defender of these arguments would actually endorse from what's a simplification or a slide, and then say whether his bottom line — that a non-EU-maximizer can be reliably drained of money and is irrational for that reason — survives once the dodgy bits are corrected? If the money-pump half is weaker than the Dutch-book half, I'd like to know exactly where it weakens.
reasoning: |-
  Okay, the user is asking about an argument they heard from a colleague regarding why one must be an expected utility maximizer. The colleague connected Dutch book arguments for probabilism with money-pump arguments for expected utility axioms, claiming that violating these makes one exploitable. The user is skeptical, especially about the parts equating utility with dollars and the claim that exploitability defines rationality.

  First, I need to unpack the colleague's argument. They mentioned two parts: Dutch books for probabilistic beliefs and money pumps for transitive preferences and independence. The colleague argued that if your beliefs aren't probabilistic, a bookie can create a set of bets you'd accept individually but that collectively guarantee a loss. Similarly, if preferences are intransitive or violate independence, you can be money-pumped: led through choices where each step seems preferable but you end up worse off.

  The user's concerns are about the "expected dollars" part and the idea that rationality is just about avoiding exploitation. The colleague simplified utility to "money corrected for risk," implying that utility is just dollars adjusted for risk preferences. But that's a misunderstanding. Expected Utility (EU) theory uses utility functions that represent preferences over outcomes, which might not be linear with money. For example, risk-averse people have concave utility functions, meaning they value each additional dollar less. So preferring a sure $100 over a gamble with a higher expected dollar value isn't irrational; it's explained by diminishing marginal utility.

  The money-pump argument has weaknesses. While it shows that intransitive preferences can lead to exploitation, independence violations (like in the Allais paradox) are trickier. In a one-shot scenario, you can't be money-pumped because you see all options at once. Real money pumps require sequential choices where the agent doesn't anticipate future steps. If the agent recognizes the sequence, they might avoid the pump. So money pumps assume myopia or lack of foresight, which might not reflect full rationality.

  The bottom line: Dutch books are stronger for probabilistic beliefs because they don't rely on sequential choices. Money pumps for transitivity are somewhat robust, but for independence, they're weaker. The colleague's claim that violating EU axioms makes you exploitable isn't entirely true. You can be exploitable if you're myopic, but a sophisticated agent might avoid it. Rationality isn't solely about exploitability; other considerations matter, like normative principles or avoiding regret. The Allais paradox isn't necessarily irrational; it might reflect rational risk aversion in certain contexts.

  The user wants to know where the argument weakens. The money-pump part is weaker than Dutch books, especially concerning independence. They also need clarification on utility not being equivalent to dollars. The colleague's bottom line oversimplifies by ignoring the role of utility functions and the conditions under which money pumps work. So, while exploitability is a concern, it's not the only aspect of rationality, and EU maximization isn't the only way to avoid exploitation in all cases.
answer: |-
  You're right to be skeptical. Your colleague's explanation contains several important simplifications, overstatements, and conceptual slides that weaken the bottom line, especially regarding the money-pump argument and the conflation of utility with money. Let's break it down piece by piece, separating what a defender *would* endorse from the problematic parts, and then assess the core claim.

  ### Core Arguments: What a Defender Endorses
  1.  **Dutch Book Theorem (For Beliefs/Probabilities):**
      *   **Defender's Claim:** If an agent's degrees of belief ("subjective probabilities") violate the axioms of probability calculus (e.g., probabilities don't sum to 1, or P(A or B) != P(A) + P(B) - P(A and B) for disjoint events), then a clever bookie can construct a set of bets (a "Dutch Book"), each individually acceptable to the agent based on their stated odds, such that the agent *loses money in every possible state of the world*.
      *   **Rationale:** This is widely accepted as a strong *pragmatic* argument for probabilism. Violating the probability axioms makes you vulnerable to *guaranteed* financial loss. The argument is synchronic (all bets offered at once) and doesn't rely on sequential choices or changing preferences.

  2.  **Money Pump Arguments (For Preferences/Utility):**
      *   **Intransitivity:** If an agent's preferences violate transitivity (e.g., A > B, B > C, but C > A), a "money pump" is possible.
          *   **Defender's Claim:** A bookie can start by offering to sell the agent C for a small fee (since they have A and prefer C). The agent now has C. The bookie then offers to sell them B for a small fee (since they have C and prefer B). The agent now has B. The bookie then offers to sell them A for a small fee (since they have B and prefer A). The agent is now back to A, but has paid fees three times. By repeating this cycle, the bookie can drain the agent's money arbitrarily. Each individual trade is preferred *at that moment*.
      *   **Independence Axiom Violation:** A similar, though more complex, sequential "pump" can be constructed for agents violating the independence axiom of Expected Utility Theory (EUT), like in the Allais paradox. The agent is presented with choices in sequence where each step seems locally preferable based on their stated preferences, but the net result is a worse outcome than what they started with (or they pay for the privilege of ending up back where they started).
      *   **Rationale:** Violating these preference axioms makes you vulnerable to *exploitative sequential schemes*. You are "pumped" for money through a series of individually acceptable trades. This is a *diachronic* argument.

  3.  **The Glued Argument:**
      *   **Defender's Claim:** Rational agents must have probabilistic beliefs (to avoid Dutch Books) *and* have preferences obeying the EUT axioms (to avoid Money Pumps). Together, this implies they maximize expected utility relative to their probabilistic beliefs and utility function. Being "non-exploitable" in these specific ways is a core, minimal requirement of rationality.

  ### The Simplifications, Slides, and Dodgy Bits

  1.  **"Utility just means money corrected for risk": This is a Profound Misunderstanding.**
      *   **The Problem:** This statement fundamentally misrepresents EUT. Utility in EUT is *not* "money corrected for risk." Utility is a numerical representation of the agent's underlying *preferences over outcomes*, derived from those preferences under the EUT axioms. Money is just one possible outcome. The utility function *absorbs* all aspects of value the agent assigns to outcomes, including:
          *   **Risk Attitude:** Concave utility (diminishing marginal utility of money) explains risk aversion. Convex utility explains risk-seeking. Linear utility explains risk-neutrality.
          *   **Intrinsic Value:** Utility captures how much the agent intrinsically values different states or objects, regardless of money or risk (e.g., health vs. illness, chocolate vs. vanilla).
      *   **The Slide:** Your colleague slides from "utility" to "expected dollars." This is only valid if the agent is **risk-neutral over money** (utility linear in dollars). *But most people are not risk-neutral!*
      *   **Why it Matters for the Argument:** The colleague claims that preferring a guaranteed $100 over a 50/50 gamble for $110/$90 is irrational because the gamble has a higher expected dollar value ($100). **This is incorrect within standard EUT.** If the agent has diminishing marginal utility of money (concave utility), preferring the sure $100 can be *perfectly rational* and consistent with EUT. The expected *utility* of the gamble might be lower than the utility of $100. The "mistake" the colleague identifies only exists if we incorrectly assume utility *equals* dollars. EUT does *not* say "maximize expected dollars"; it says "maximize expected utility," where utility reflects the agent's actual valuation of outcomes. The colleague's dismissal of risk aversion as irrational is itself a mistake.

  2.  **"Just what not being exploitable comes to": An Overstatement.**
      *   **The Problem:** This presents non-exploitability via Dutch Books and Money Pumps as the *sole* or *defining* characteristic of rationality. This is highly contentious.
      *   **Rationality is Broader:** Many philosophers and decision theorists argue rationality encompasses more:
          *   **Epistemic Rationality:** Justified beliefs, evidence responsiveness (Dutch Books only address coherence of degrees of belief, not their connection to evidence).
          *   **Normative Principles:** Following principles considered inherently rational (e.g., dominance, avoiding dominated strategies, consistency over time).
          *   **Goals:** Effectively achieving one's goals, whatever they are (EUT helps with this *if* its axioms hold, but exploitability focuses on coherence, not goal achievement per se).
      *   **Exploitability is a Pragmatic Argument:** Dutch Books and Money Pumps are powerful *pragmatic* arguments ("you'll lose money if you violate this"). They don't necessarily prove the axioms are *logically necessary* or the *only* conceivable norms of rationality. They show the *practical cost* of violation in specific interaction contexts.

  3.  **Weaknesses in the Money-Pump Argument (Especially vs. Dutch Book):**
      *   **Sequentiality & Foresight:** Money pumps rely crucially on the agent making choices *sequentially without foresight* or commitment. A sophisticated agent who recognizes the pump sequence *in advance* can simply refuse the first trade, avoiding exploitation. This makes the argument weaker than the Dutch Book, which works even if the agent sees the whole package upfront.
      *   **Independence Violations are Particularly Fragile:** Constructing a practical money pump for Independence violations (like Allais) is more complex and relies heavily on specific framing and the agent's myopia. If the agent sees the whole sequence or the larger context, the pump often fails. *A defender would counter:* "But rational agents shouldn't be myopic! Foresight is part of rationality." Critics argue that foresight itself might lead the agent to adopt a *different* decision rule to avoid the pump, potentially violating EUT in a one-shot choice but being rational over time ("resolute choice").
      *   **Is Exploitability the Core Issue?** Does the mere *possibility* of exploitation (which might never happen) make someone irrational, even if their choices are stable and serve them well in their actual environment? The Dutch Book exploitability feels more direct and unavoidable. The Money Pump exploitability feels more like a potential vulnerability contingent on encountering a malicious actor and acting myopically.
      *   **Descriptive Reality (Allais Paradox):** The colleague dismisses Allais preferences as irrational because "everybody fails." This ignores the *reason* people violate Independence – often due to psychological factors like certainty effects or regret aversion. Many argue these reflect *meaningful* aspects of human valuation that a purely coherent EUT representation might miss. Sophisticated non-EU models (like Prospect Theory) capture these effects and can also be formulated to avoid (some types of) money pumps. The existence of systematic violations *does* challenge the claim that EUT is the *only* possible normative model, even if it remains the dominant one.

  ### Does the Bottom Line Survive (Corrected)?

  *   **Violating Probability Axioms (Dutch Book):** The bottom line here is strong. Violating probability axioms genuinely makes you vulnerable to guaranteed loss in a synchronic betting scenario. This is a powerful argument for probabilism as a norm of coherence.
  *   **Violating Preference Axioms (Money Pump):** The bottom line here is significantly weaker, especially concerning Independence.
      *   **Intransitivity:** The money pump argument is relatively robust *if* we accept that rational agents should not be vulnerable to exploitation through sequential choices due to inconsistent preferences. However, the reliance on sequentiality and lack of foresight is a genuine weakness compared to the Dutch Book.
      *   **Independence:** The argument is much weaker. Avoiding money pumps for Independence violations often requires foresight or sophistication, but *achieving* that foresight/sophistication might lead an agent to make choices in specific situations that violate EUT in a one-shot description. The claim that violating Independence *necessarily* makes you exploitable in practice is dubious. It might make you vulnerable *if* you are myopic *and* encounter a pump artist, but not otherwise. Furthermore, the colleague's dismissal of risk aversion as irrational due to conflating utility and dollars is simply wrong and weakens their specific example.
  *   **"Non-EU maximizers can be reliably drained of money and are irrational for that reason":** This overstates the case.
      *   **Reliably Drained?** Only if they are persistently myopic and encounter persistent pump artists. A sophisticated non-EU maximizer (using a different coherent rule) might avoid pumps. An EU maximizer with non-linear utility ("risk-averse") won't be drained for preferring the sure $100 – that preference isn't a pump vulnerability.
      *   **Irrational for *that* reason?** While exploitability is *a* reason to value coherence, it's arguably not the *only* reason, nor does the (weaker) money pump vulnerability *solely* define irrationality. Rationality involves more than just vulnerability to malicious actors in betting scenarios.

  ### Conclusion

  Your colleague's explanation oversimplifies and misrepresents key aspects:

  1.  **Utility ≠ Dollars:** The claim that EUT demands maximizing expected dollars and that risk aversion is irrational is a major error. EUT uses utility to represent preferences; risk aversion is rational under diminishing marginal utility.
  2.  **Money Pumps are Weaker than Dutch Books:** Dutch Books show synchronic, unavoidable loss for probabilistic incoherence. Money Pumps, especially for Independence violations, rely on diachronic choices, myopia, and specific manipulation. They show a *potential* vulnerability, not a guaranteed loss, and sophisticated agents can potentially avoid them.
  3.  **Exploitability isn't the Whole Story:** Presenting non-exploitability as the *definition* of rationality ignores broader epistemic and normative considerations.

  **The Corrected Bottom Line:**

  *   Violating probability axioms **does** make you vulnerable to guaranteed financial loss (Dutch Book), providing a strong pragmatic argument for probabilism.
  *   Violating transitivity **can** make you vulnerable to financial exploitation through sequential trades (Money Pump), though this relies on myopia/lack of foresight.
  *   Violating the independence axiom **might** make you vulnerable to a money pump **under specific conditions** (myopia, sequential presentation, malicious counterparty), but this argument is significantly weaker and more contested than the arguments for probabilism or transitivity. Many sophisticated non-EU models exist partly to accommodate preferences (like those in the Allais paradox) while attempting to maintain coherence and avoid exploitation.
  *   **Being a non-EU maximizer does *not* automatically mean you can be "reliably drained of money."** It depends on the specific violation, the agent's foresight, their environment, and crucially, *it does not mean that preferring a sure $100 over a gamble with higher expected dollars but lower expected utility (for you) is irrational.* Your colleague's specific example fails because it conflates utility and money.

  The money-pump half *is* weaker than the Dutch-book half, primarily due to its reliance on sequential choices and the agent's lack of foresight or commitment. This weakness is most pronounced concerning violations of the independence axiom.
