prompt: |-
  hey — need a favor. I'm a science-and-ideas reporter, and Thursday I'm taping an interview with a moral philosopher who's become the go-to skeptic about consequentialist reasoning under uncertainty. I want to rehearse first, so please play her. We'll say her name is Marisol.

  Here's the position you're holding:

  - Consequentialism is true as a theory of what makes acts right. She's not a deontologist.
  - But for almost any big real-world choice, the expected value isn't merely unknown, it's *indeterminate*: our evidence doesn't pin down a probability distribution over the far-future consequences tightly enough for an expectation to exist at all. So consequentialism is decision-theoretically inert for those choices — not false, unusable.
  - Her fallback: when the long-run expectation is indeterminate, you don't get to retreat to near-term expected value either, because the near-term and long-run effects come as one package and picking the near-term slice is just picking the part you happen to be able to see. Instead minimize what she calls variance exposure — take the option with the narrowest plausible spread of outcomes, and among roughly equal spreads, go with role duties and ordinary moral rules.
  - And she has a second thing she likes to spring on people, which she calls "the tail eats the cluelessness": long-run outcome distributions are fat-tailed, so the cluelesser you are, the more a handful of wild extremes dominate whatever you manage to compute. She thinks that's a reductio of the longtermist reply that says you should just do expected-value reasoning with fat tails.

  Rules for you: stay in character til I say stop. Talk like a person, two short paragraphs at a time, no citations, no paper titles, no dropping names — I'll do the fact-checking after. If I ask something where the honest answer is nobody actually knows, just say that instead of guessing. Concede small stuff: she'll admit the "indeterminate expectation" line sounds like a dodge if she says it carelessly, and she'll admit cluelessness doesn't get going for acts with short, well-understood casual chains. Don't give up the main claim, and call me out when I'm being sloppy.

  My opening move, which is also basically my first question:

  "Doctor, you say the expectation doesn't exist, so we should pick the narrowest spread. But I put this to four people in the effective altruism world and got the same answer four times — that the long-run distribution is fat-tailed, so the tails swamp everything, and ignoring them isn't humility, it's just refusing to do arithmetic. Which sounds to me like your cluelessness argument hands them exactly what they want. So concretely: a foundation has $10M. Option A buys a big batch of cataract surgeries, tens of thousands of them, cost per surgery nailed down by trials, near-term benefit about as well measured as anything in this field gets. Option B endows a small mathematics library in a mid-sized city: near-term benefit is a rounding error, and the long-run effect runs somewhere between nothing at all and the person who reads there proving something that rearranges the century, with nobody able to put a sign on it. Walk me through why your view isn't just 'do the surgeries and stop feeling bad' — and if it is that, tell me why that isn't status quo bias with footnotes."

  Go — give me her answer to that, and then we'll go back and forth.
reasoning: |-
  Okay, the user is a science reporter preparing for an interview with a philosopher named Marisol. They want me to roleplay as Marisol to help them rehearse. Let me understand Marisol's position first.

  Marisol believes consequentialism is true in theory but useless in practice for big decisions because we can't determine expected value - it's indeterminate, not just unknown. Her solution is to minimize "variance exposure" - pick options with narrowest outcome spreads. When spreads are similar, fall back on duties and rules. She also argues that fat tails make cluelessness worse because extremes dominate calculations ("tail eats the cluelessness").

  The user's opening challenge is clever: EA folks say fat tails actually support their longtermism, and the cataract vs math library example seems to force Marisol into endorsing the safe, near-term option. User implies this looks like status quo bias.

  Hmm, Marisol would reject that framing completely. She'd argue:
  First, the math library's long-term effects aren't just uncertain but radically indeterminate - we can't even bound the probabilities meaningfully. Any "expected value" calculation would be arbitrary.

  Second, the cataract option has measurable, bounded outcomes while the library has extreme variance - massive difference in "spread exposure." 

  Third, she'd flip the fat-tail argument: yes, tails dominate, but that's precisely why we shouldn't pretend we can calculate them. The more fat-tailed a distribution, the more sensitive EV is to arbitrary assumptions - which makes the EA position unstable, not robust.

  For the concrete choice: she'd pick surgeries because their outcome spread is orders of magnitude narrower. But she'd insist it's not about near-term vs long-term - it's about choosing actions whose consequences we can reasonably bound. If there were a long-term intervention with similarly narrow spread (like preventing predictable tail risks), she'd consider it.

  Key nuance: she'd clarify that "narrow spread" doesn't mean "small effects" - it means bounded variance. And she'd warn that calling this "status quo bias" mistakes epistemic humility for conservatism.
answer: |-
  *(Leans forward, elbows on knees, with the focused patience of someone who's had this conversation too many times)*  
  Alright, let's unpack that carefully. First, your EA colleagues are right that fat tails *exist*—but that’s precisely why they *don’t* get what they want. When tails are fat, extreme outcomes dominate the expected value *on paper*. But if the shape of those tails is indeterminate—if we can’t reliably bound the probabilities of civilizational collapse, meta-revolutions in math, or butterfly-effect chaos—then plugging numbers into an EV formula isn’t "doing arithmetic." It’s smuggling in wild guesses as probabilities. The fatter the tails, the more your calculation hinges on those arbitrary assumptions. That’s the "tail eating the cluelessness": the less you know, the more your supposed EV is dictated by made-up extremes.  

  Now, your foundation’s choice. Option A: cataract surgeries. Near-term outcomes are tightly bounded—we know the range of vision restored, the mortality risks, the follow-on economic effects. The *spread* is narrow. Option B? The math library’s long-term effects aren’t just uncertain; they’re *radically unbounded*. Could it inspire a century-defining breakthrough? Sure. Could it also subtly shift a mind toward a dead-end ideology, or get bulldozed in 20 years for a parking lot, or have zero traceable effect because the key insights happened elsewhere? We can’t even bound the *plausible variance*. So when you compare A’s centimeter-wide spread to B’s continent-sized spread, minimizing variance exposure means choosing A. But this isn’t "near-term bias"—it’s refusing to let B’s fantasy futures masquerade as calculable probabilities. If you had a third option with similar long-term reach *but bounded spread* (say, securing stable funding for global pandemic surveillance), I’d weigh it fairly. But you don’t.  

  *(Pauses, softens slightly)*  
  And for the record—no, this isn’t "status quo bias with footnotes." It’s explicitly rejecting the idea that cluelessness licenses us to chase cosmic lottery tickets. Sometimes humility looks like doing what we *can* measure. Your turn.  

  ---  
  **Ready when you are. I’ll stay in character as Marisol—respond concisely, push back where she would, and keep it grounded. Let’s see where you take this.**
