  Combining these... geometric mean works better than arithmetic for multiplicative uncertainties. Gets me to 0.45 headline probability. Most sensitive to the computational shift term - if that gains traction, SR could collapse entirely. Loosest on physics evidence - new quantum foundations work could change that.

