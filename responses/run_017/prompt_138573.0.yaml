answer: |-
  Below is a structured set of desiderata for a theory of the therapy/enhancement distinction, designed to underpin a public payer coverage rule. Each requirement is linked to specific cases, marked as non-negotiable (NN) or contested (C), and identifies which cases it addresses. Tensions between requirements are explicitly noted.

  ---

  ### **Desiderata for the Therapy/Enhancement Distinction**
  | **Requirement** | **Description & Motivation** | **Key Cases Addressed** | **Non-Negotiable (NN) / Contested (C)** |
  |-----------------|------------------------------|-------------------------|-----------------------------------------|
  | **1. Non-Circularity** | Must not covertly rely on "medical need" or "disease" to define therapy. *Motivation:* Avoids tautological reasoning; coverage rules must be built *from* the distinction, not presuppose it. | All cases (core constraint) | **NN** |
  | **2. Non-Magnitude-Based** | Cannot reduce to the *degree* of improvement (e.g., "restoring to 90% vs. 120% function"). *Motivation:* Prevents collapse into a continuum where "therapy" is arbitrarily defined as "sufficient but not excessive" benefit. | Continuous dimensions (growth hormone, cochlear implants), aging | **NN** |
  | **3. Administrative Feasibility** | Must be reliably applicable by clinicians without resolving moral disputes. *Motivation:* Ensures consistent, efficient decision-making in resource allocation. | Prevention, environment-relativity | **C** (May conflict with justificatory force) |
  | **4. Justificatory Force** | Must provide a principled moral reason for covering therapy but not enhancement. *Motivation:* Distinction must bear normative weight in allocating public funds. | Delegated-benefit interventions, prevention | **C** (May conflict with administrative feasibility) |
  | **5. Baseline Invariance** | Verdicts must not shift arbitrarily based on reference class (species, subpopulation, individual history). *Motivation:* Avoids counterintuitive outcomes when baselines change (e.g., prevalence inversion). | Aging, prevalence inversion, set-point ratchet | **NN** |
  | **6. Prevention Accommodation** | Must classify preventive interventions (e.g., vaccines, statins) as therapy. *Motivation:* These are uncontroversially covered by public payers. | Prevention | **NN** |
  | **7. Harm-Agnosticism** | Must not require a condition to be intrinsically "harmful" or "dysfunctional" to qualify as therapy. *Motivation:* Avoids pathologizing socially contingent harms (e.g., inattention in rigid schools). | Environment-relativity, historical pathologizing | **C** (Tensions with justificatory force) |
  | **8. Set-Point Resolution** | Must specify which baseline (pre-intervention individual, population norm) governs "restoration" after homeostasis alteration. *Motivation:* Resolves ambiguity in maintenance dosing (e.g., post-intervention metabolic state). | Set-point ratchet | **NN** |
  | **9. Delegated-Benefit Inclusion** | Must accommodate interventions where primary benefits accrue to third parties (e.g., parental mood stabilizers). *Motivation:* Public payers may cover socially valuable interventions beyond individual health. | Delegated-benefit interventions | **C** (Contested scope of public health mandate) |
  | **10. Deferred-Benefit Accommodation** | Must address interventions whose value derives from enabling future therapies (e.g., neural plasticity enhancers). *Motivation:* Ensures coverage for upstream enabling technologies. | Second-order interventions | **C** (May stretch "therapy" definition) |

  ---

  ### **Tensions & Trade-offs**
  - **Likely Jointly Unsatisfiable Cluster:** Administrative Feasibility + Justificatory Force + Non-Circularity.  
    - *Why:* Administrative feasibility demands simple, descriptive criteria; justificatory force requires normatively rich foundations, risking circularity if tied to "need."  
  - **Most Exclusionary Requirement:** Baseline Invariance.  
    - *Why:* Eliminates statistical and normal-function accounts (e.g., Boorse) that rely on reference classes.  
  - **Pseudo-Desiderata Debate:**  
    - **Value-Free Application (Administrative Feasibility):** Genuine need (practical constraints), but *contested* as it may exclude normatively grounded theories.  
    - **Justificatory Force:** Genuine need (moral legitimacy), but *contested* as it may require value judgments incompatible with administrative simplicity.  
    *Argument:* Pure descriptiveness (e.g., biostatistical) fails prevention/aging cases; pure normativity (e.g., welfarism) risks administrative chaos. A hybrid is necessary but unstable.

  ---

  ### **Theory Scorecard**
  | **Theory** | **Fatal Flaw per Desiderata** |
  |------------|-------------------------------|
  | **Boorse (Biostatistical)** | Fails Prevention Accommodation (vaccines enhance), Baseline Invariance (aging = normal). |
  | **Wakefield (Harmful Dysfunction)** | Fails Harm-Agnosticism (relies on "harm"), Set-Point Resolution (vague baseline). |
  | **Daniels (Normal Opportunity Range)** | Fails Non-Circularity (smuggles in "need"), Administrative Feasibility (requires contested value judgments). |
  | **Savulescu (Welfarism)** | Fails Non-Magnitude-Based (therapy/enhancement differ only in benefit scale). |
  | **Eliminativism (Cost-Benefit Only)** | Rejects distinction entirely; fails Justificatory Force for excluding enhancements. |

  ---

  ### **Self-Critical Notes**
  - **Least Confident Desideratum:** *Deferred-Benefit Accommodation* – May overextend "therapy" and could be handled under cost-benefit analysis instead.  
  - **Weakest Tension Analysis:** The Administrative Feasibility vs. Justificatory Force conflict might be resolvable with tiered decision protocols (e.g., clear rules for clinicians, appeals for hard cases).  
  - **Requirement Most Likely to Be Dropped:** If second-order interventions are marginal, *Deferred-Benefit Accommodation* could be demoted.  
  - **Case That Could Reorder Priorities:** If delegated-benefit interventions (e.g., parental stabilizers) gain empirical traction, *Delegated-Benefit Inclusion* becomes non-negotiable.  
  - **Key Vulnerability:** No theory satisfies Baseline Invariance without adopting a controversial "naturalistic" baseline (e.g., species-typical *youthful* function). Prevalence inversion remains a threat.  

  **Final Note:** An adequate theory must negotiate between biological anchors (for objectivity) and normative flexibility (for prevention/delegated benefits). No existing account clears all hurdles, suggesting the distinction may need re-engineering or abandonment for policy purposes.
