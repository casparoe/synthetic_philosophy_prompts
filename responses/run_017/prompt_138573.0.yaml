  On pseudo-desiderata: the "value-free application" demand is probably unrealistic because any distinction that justifies resource allocation will involve values. But "administrability" is real—clinicians can't litigate philosophy at each consult. The compromise might be a hybrid: descriptively anchored but value-informed. 

  For the scorecard, I'll note how each major theory fails specific desiderata. E.g., Boorse crashes on prevention and aging; welfarism ignores non-health benefits. Eliminativism avoids the distinction but collapses treatments into enhancements by cost-benefit, which the user wants to avoid. 

  My least confident desideratum is "Deferred Benefit Accommodation" for second-order interventions. It might be too niche, but the user flagged it, so I'll include it. The biggest tension cluster is non-circularity + justificatory force + administrability—likely jointly unsatisfiable. If forced to drop one, I'd sacrifice administrability (values are unavoidable). 

