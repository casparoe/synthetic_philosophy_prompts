prompt: |-
  Hi — I'm on the grants committee of a small foundation (we move maybe $8m a year) and we've just been handed a restricted bequest of about $40m that has to be spent inside six years. The donor's language is maddeningly vague; the operative phrase is something like 'to reduce risks of civilisational collapse'. So the end is, more or less, fixed by somebody else. What we actually have to decide is how the money gets allocated, and we're split down the middle.

  Option A: run it as an open call with external peer review, basically what we already do, just with bigger grants. Option B: the planning option — we pick five or six target outcomes (a working early-warning thing, N people trained, some number of commissioned reports, whatever), carve the bequest up between them, hire two program staff whose job is to hit them, and report against milestones every year.

  Our philosopher-of-science board member — he works on Carnap, the Vienna Circle, that whole period — is arguing hard for A, and I half agree with him but I don't think his argument reaches as far as he thinks. The way I've heard it (I'm probably garbling it): reason and evidence can only ever tell you about means, never about ends, so we can legitimately argue about which mechanism produces more good work per dollar, but the moment we sit down and pick target outcomes we're doing something no amount of science or logic can underwrite. And relatedly, that the tolerant attitude toward choosing frameworks is precisely the point: there's no fact of the matter about which framework is right, only what's more convenient. Somebody asked him convenient for what, and he said that's exactly the question we can't answer — which struck me as evasive, but I couldn't say why.

  Our chair is for B, and her version is that A isn't neutral, it's just a plan nobody wrote down: open calls with peer review reliably reproduce whatever the existing network already thinks is important, so 'letting the field decide' is a decision too, and not a humble one. She also points out that Neurath was in the same circle and was perfectly happy drawing up plans, and says that if the justification for A is that science can't pick ends, you also lose the ability to criticise the status quo, which is its own politics.

  Two things make this sharper than a normal grants argument. First, we can't avoid specifying the end: to run an open call on this bequest we have to tell referees what counts as reducing collapse risk, so A doesn't dodge the value question, it just pushes it into a thousand individual referee judgements where nobody can audit it. Second, there's a version of B-lite floating around — instead of targets, set guardrails (things that must not happen, a floor on how much goes to approaches we'd otherwise never fund) and let applicants optimise inside them, and use a slice of the money as an actual experiment comparing allocation mechanisms, including randomised ones. That might be the thing that's genuinely available to us even on the anti-planning view, or it might be planning with a different name.

  What I need is the memo I circulate before the 14th. Give me a real recommendation — A, B, or a specific third structure — with what we'd actually vote on in June and what the six-year shape is. It has to be written so both the chair and the Carnap guy could reply to it rather than just re-state themselves, and it has to give the strongest thing on whichever side loses a fair hearing. If there's a usable version of the means/ends distinction here, say what it is and where it stops working; if you think it collapses under pressure in this case, say that instead. Please don't give me a reading list or citations — I won't chase them and I can't.
reasoning: |-
  Okay, let me tackle this grants committee dilemma. The user is part of a foundation handling a $40m restricted bequest with a vague mandate to "reduce risks of civilisational collapse," spent within six years. They're split between Option A (open call with peer review) and Option B (planning with target outcomes). 

  First, I need to unpack the philosophical tension. The Carnap-aligned board member argues that science can only judge means, not ends - so picking outcomes would be unscientific. But the chair counters that peer review isn't neutral either; it just entrenches existing biases. Both points feel valid, which makes this thorny.

  Hmm... the user's hidden need jumps out: they want a decision framework that doesn't pretend to be value-neutral but makes those values accountable. The memo must satisfy the philosopher's rigor while giving the chair's pragmatism real teeth. 

  Looking at the guardrails idea (B-lite), that seems promising - it sets boundaries without prescribing methods. But how to structure it? I'm imagining: 
  - Must-fund clauses for neglected areas (e.g., 20% minimum for global south researchers) 
  - No-go zones (e.g., no single-hypothesis monopolies) 
  - Then an open call inside those rails.

  But the chair's Neurath point sticks - this is still planning, just of constraints. Yet it avoids the philosopher's "ends" objection because we're not defining success, only failure conditions. That might bridge the gap.

  The randomized experiment slice is genius - it turns the mechanism debate into empirical research. Allocate 10% to test A vs B vs hybrid approaches head-to-head. That gives Carnap his scientific scrutiny while letting the chair demonstrate planning's value.

  For the six-year arc: Years 1-2 would focus on setting guardrails and funding first grants, years 3-4 adapt based on early data, years 5-6 scale what works and publish findings. The experiment runs throughout.

  Biggest risk is over-engineering. Need to keep guardrails minimal - maybe just three: geographic diversity, methodological plurality, and failure tolerance. Any more would choke creativity.

  Final structure emerging: 
  1. Guardrail-defined open call (75%) 
  2. Mechanism experiment (10%) 
  3. Opportunistic fund (15%) for rapid response

  This gives the chair her steering wheel, satisfies Carnap's means-focused scrutiny, and answers the user's plea for "what we actually vote on." The memo should present this as B's flexibility wearing A's clothes - planning the scaffolding, not the content.
answer: |-
  **MEMORANDUM**  
  To: Grants Committee  
  From: [Your Name]  
  Date: 10 October 2023  
  Subject: Recommendation for $40M Bequest Allocation: "Civilisational Collapse Risk Reduction"  

  ### **Recommendation: Hybrid Model (B-Lite Structure)**  
  **Vote Proposal:** Approve a **guardrail-defined open call** (75% of funds) + **mechanism experiment** (10%) + **opportunistic fund** (15%), with explicit outcome-agnostic success metrics.  

  #### **Six-Year Structure**  
  | **Year** | **Phase** | **Actions** |  
  |----------|-----------|------------|  
  | **1–2**  | Framework | Establish guardrails; launch open call (60% Y1–2 funds); design/launch experiment; solicit opportunistic proposals |  
  | **3–4**  | Adaptation | Review guardrail compliance & experiment data; adjust open call criteria; allocate remaining opportunistic funds |  
  | **5–6**  | Consolidation | Wind down new grants; fund scaling of high-impact Y1–4 projects; publish experiment results |  

  ---

  ### **Why This Structure?**  
  **1. It resolves the core philosophical deadlock by reframing "ends" as boundaries, not targets.**  
     - **For the Carnap view (anti-ends):** Guardrails (e.g., "≥25% funds to Global South researchers," "no mono-disciplinary grants") avoid prescribing *substantive ends* (e.g., "build an early-warning system"). They define *conditions for admissible means*, which is compatible with the means/ends distinction. Science *can* evaluate whether guardrails are satisfied (e.g., auditing geographic diversity).  
     - **For the Chair’s view (anti-neutrality):** Guardrails explicitly reject peer review’s status quo by *forcing* diversity, innovation, and accountability. The "opportunistic fund" allows proactive interventions when evidence emerges (e.g., funding a crisis-response team during a sudden biosecurity threat), addressing her concern that rigid peer review cannot act urgently.  

  **2. It turns the mechanism debate into actionable science.**  
     - The **10% experiment** ($4M) directly tests allocation models (e.g., randomized grants vs. peer review vs. targeted RFPs) on small-scale proposals. Metrics: cost per paper, policy uptake, speed of deployment. *This answers the philosopher’s demand for empirical means-testing and the chair’s demand for critiquing hidden biases.*  

  **3. Peer review is retained but neutered as the sole authority.**  
     - Open call applications (75% of funds) are evaluated *within guardrails*, e.g.:  
       - *Must fund:* At least 30% "high-risk, high-reward" projects; minimum allocation to AI governance, ecological resilience, and conflict forecasting.  
       - *Must avoid:* Projects replicating existing federal grants; >10% funds to any single institution.  
     - Referees score proposals *only* on feasibility/rigor, not "collapse relevance"—guardrails pre-screen for scope alignment.  

  **4. The "opportunistic fund" (15%)** provides planning flexibility without prescribing ends. Staff can rapid-fund projects meeting guardrails during windows of opportunity (e.g., a breakthrough in nuclear treaty verification), with committee veto power.  

  ---

  ### **Strongest Counterarguments and Responses**  
  **To the Philosopher (if preferring pure Option A):**  
  *Objection:* "Guardrails are covert ends! ‘Fund Global South researchers’ implies redistributive justice is a goal—which is a value choice science cannot justify."  
  *Response:* True, but unavoidable. Even pure peer review requires defining "collapse risk" for referees—which implicitly values certain sciences (e.g., climate modeling over social anthropology). Guardrails make these value choices transparent and auditable. The experiment tests whether our values *actually* reduce risk.  

  **To the Chair (if preferring pure Option B):**  
  *Objection:* "This is planning with extra steps! Guardrails + experiments + opportunistic funds create bureaucratic bloat."  
  *Response:* Pure planning risks ossifying strategy in Year 1. Civilisational collapse is a fast-moving target (e.g., AI accelerationism wasn’t salient 5 years ago). Guardrails enforce accountability without over-committing. The experiment generates data for future foundations.  

  ---

  ### **Where the Means/Ends Distinction Holds (and Fails)**  
  - **Holds:** Science *can* compare means (e.g., "Does decentralized solar geoengineering research reduce catastrophe risk more per dollar than pandemic surveillance?").  
  - **Fails:** Choosing *which risks to prioritize* (climate vs. AI vs. nuclear) is unavoidably normative. Guardrails force us to declare these norms upfront (e.g., "no more than 40% to any one risk area") rather than burying them in peer review.  

  ---

  ### **Final Vote Proposal for June**  
  Approve allocation of the $40M bequest as follows:  
  1. **$30M (75%): Open call grants** evaluated by external peer review, operating within board-approved guardrails (see Appendix A: Draft Guardrails).  
  2. **$4M (10%): Mechanism experiment** comparing grant allocation models, with Year 3 recommendations.  
  3. **$6M (15%): Opportunistic fund** for time-sensitive projects, administered by staff under committee oversight.  

  **Success metric:** Annual independent audit of guardrail compliance + experiment progress. *No* predefined "collapse risk reduced" metric—only adherence to the process.  

  This structure respects the donor’s intent while turning our ideological rift into a testable framework. The philosopher gets his empiricism; the chair gets her accountability; the foundation gets defensible impact.  

  ---  
  **Appendix A: Draft Guardrails**  
  - ≥25% funds to researchers/institutions based in the Global South.  
  - ≤40% to any single risk domain (climate, bio, AI, nuclear, etc.).  
  - 15% minimum allocation to "pre-paradigmatic" research (no established journals/funding streams).  
  - All grants must include a policy-engagement roadmap.  
  - No recipient exceeds 10% of total bequest funding.
