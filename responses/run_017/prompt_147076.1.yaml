answer: |-
  Based on your scenarios and verdicts, I'll refine your tentative principle into a precise rule, test it against your cases, identify tensions, and apply it to your unresolved scenarios. Your core intuition—that targeting and purpose matter more than raw numbers—is sound, but it needs adjustments for severity, bycatch, suffering, and cost.

  ### Repaired Rule
  **An intervention is permissible if and only if:**
  1. **Targeting**: It selectively affects organisms directly responsible for a specific harm, with bycatch minimized as much as practicable (considering cost and feasibility).  
  2. **Severity**: The harm being addressed is non-trivial (i.e., it involves health, safety, essential resources, or property integrity, not aesthetics or convenience alone).  
  3. **Suffering**: Methods minimize prolonged suffering, unless doing so imposes disproportionate burdens (e.g., excessive cost, reduced efficacy).  
  4. **Boundary**: The intervention does not unjustifiably harm others (e.g., trespassing on others' property or interests, like a neighbor's hive).

  **Clause origins from your cases:**  
  - **Targeting**: Motivated by your wasp nest (targeted, fine) vs. broad-spectrum spray (non-targeted, not fine).  
  - **Severity**: Motivated by lawn treatment (cosmetic, not fine) vs. dengue larvicide (life-saving, better than fine).  
  - **Suffering**: Motivated by slow neurotoxin (hours of convulsions, worse) vs. sterilization (better, but not obligatory).  
  - **Boundary**: Motivated by rose spray (harmed neighbor's hives, not fine) vs. locust control (no boundary violation, fine).

  This rule explains all your verdicts except the sterilization intuition, which requires a cost caveat (see "Unresolved Tensions" below).

  ### Testing Against Your Cases
  | Scenario | Verdict | Rule Analysis |  
  |----------|---------|--------------|  
  | **Wasp nest** by back door (allergic kid) | ✅ Fine | Passes: High targeting (wasps only), high severity (health risk), minimal suffering (quick destruction), no boundary issues. |  
  | **Ant bait** in kitchen (kills colony) | ✅ Fine | Passes: High targeting (ants in kitchen), moderate severity (sanitation/nuisance), suffering not specified but acceptable given severity. Your discomfort likely stems from suffering/scale, but severity justifies it. |  
  | **Ant bait** despite housemate objection | ✅ Fine | Passes: Same as above. Objection doesn’t negate severity (ants in food area are a health/nuisance issue). Rule ignores "who was first" (territorial intuition). |  
  | **Grub treatment** for cosmetic lawn | ❌ Not fine | Fails: Severity is trivial (cosmetic). Targeting is irrelevant without severity. |  
  | **Aedes larvicide** (dengue endemic) | ✅ Better than fine | Passes: Perfect targeting (species-specific), extreme severity (life-saving), suffering minimized (larvae death likely quick). "Better than fine" due to high targeting + severity synergy. |  
  | **Broad-spectrum spray** on roses (kills hives) | ❌ Not fine (worse than lawn) | Fails: Poor targeting (kills bees), trivial severity (cosmetics), and boundary violation (harms neighbor’s property). Worse than lawn due to boundary + bycatch. |  
  | **Locust control** to avert famine | ✅ Fine | Passes: High targeting (locusts only), extreme severity (famine prevention), suffering acceptable given stakes. Untroubling because no boundary issues and severity justifies scale. |  
  | **Slow neurotoxin** (locusts) | ❌ Worse than fast | Fails suffering clause: Prolonged agony isn’t minimized. Rule requires fast method if feasible and similarly costly. |  
  | **Sterilization** (locusts) | 🤔 Better, but not obligatory | Passes but not required: Reduces suffering, so "better." But cost/feasibility may excuse not switching (e.g., if slower or pricier). Rule doesn’t mandate it if burdens are disproportionate. |

  ### Unresolved Tensions
  Your verdicts are mostly consistent, but two pairs resist a "clean" rule without caveats:  
  1. **Eradication (Aedes) vs. Lawn Treatment**:  
     - **Tension**: Both are targeted, but you permit eradication (high severity) and forbid lawn treatment (low severity). The rule resolves this via the severity clause—it’s not about numbers, but the *type* of harm. Dengue threatens lives; a patchy lawn does not. Your "better than fine" for Aedes reflects the multiplicative effect of perfect targeting + extreme severity.  
     - **Rule Saves It? Yes**, via severity.  

  2. **Slow Death Intuition**:  
     - **Tension**: You feel slow death is worse, but sterilization isn’t obligatory. The rule resolves suffering via a cost-effectiveness caveat: Suffering must be minimized *unless* doing so is impractical. Sterilization might be costlier, slower, or less effective, making it non-obligatory.  
     - **Rule Saves It? Partially**. Your intuition that suffering matters but isn’t absolute is captured, but the rule can’t quantify "disproportionate burdens" precisely—it’s context-dependent.  

  ### Territorial/Ownership Intuitions
  - **Territorial Bias in Ant Case**: Your dismissal of "ants were there first" suggests territorial thinking ("my kitchen, my rules"). This wears a "cost-benefit costume" by assuming your authority over the space defines the harm’s severity. The rule sidesteps this by treating severity objectively (ants in food areas = sanitation issue).  
  - **Boundary Violation in Rose Spray**: Harming a neighbor’s hives feels worse than killing your own grubs because it adds a property-rights dimension. The rule explicitly includes this via the boundary clause.  

  ### Predictions for New Cases
  1. **Species-Recognizing Trap (90% less bycatch, 20x cost)**:  
     - **Prediction**: Impermissible if severity is low (e.g., nuisance pests). Permissible if severity is high (e.g., disease vectors), but only if the cost isn’t prohibitive.  
     - **Analysis**:  
       - *Targeting*: High (90% bycatch reduction).  
       - *Severity*: Decisive. For a minor issue, cost makes it prohibitive. For a severe threat, cost may be justified.  
       - *Suffering/Boundary*: Unaffected.  
     - **Verdict**: Use it for serious threats (e.g., malaria mosquitoes); skip it for minor ones (e.g., pantry moths). Cost must align with severity.  

  2. **Gene-Drive Release (region-wide pest suppression)**:  
     - **Prediction**: Permissible if severity is high and targeting is reliable. Potentially "better than fine" if it reduces suffering/bycatch.  
     - **Analysis**:  
       - *Targeting*: Very high (species-specific, no spraying bycatch).  
       - *Severity*: High for crop pests threatening food security; low for cosmetic damage.  
       - *Suffering*: Humane (prevents reproduction, no direct killing).  
       - *Boundary*: Permissible if no significant off-target effects (e.g., no harm to neighboring ecosystems).  
     - **Verdict**: Fund it for severe pests (e.g., locusts in famine-prone areas). If the pest is minor (e.g., aphids on ornamental plants), severity fails, making it impermissible.  

  ### Final Refined Rule
  **"An intervention is permissible only if it selectively targets organisms causing non-trivial harm (to health, safety, or essential resources), minimizes bycatch and suffering as much as practicable without disproportionate burden, and avoids unjust harm to others’ legitimate interests (e.g., property)."**  

  This rule:  
  - Explains all your verdicts except sterilization’s optionality (handled by the "disproportionate burden" caveat).  
  - Prioritizes targeting and severity over scale.  
  - Acknowledges cost and practicality in minimizing suffering/bycatch.  
  - Rejects territorial biases by focusing on objective harm and boundaries.  

  For unresolved tensions, it accepts that suffering minimization isn’t absolute (due to cost) and that scale alone is irrelevant (severity dominates). If your intuitions shift in new cases, adjust the clause weights (e.g., increase suffering’s importance if slow death feels universally worse).
