prompt: |-
  I'm taking an advanced seminar on scientific realism this term and sharing a house with a PhD student in particle physics, so I keep bumping into a gap between how physicists write and how my seminar talks about what they are doing. In her field it is entirely routine to do all of the following inside a single paper: describe the Standard Model as an effective field theory, that is, as a low-energy approximation to something else, valid only below some cutoff scale, and therefore not something anyone in the field expects to be true in the long run; announce the discovery or observation of entities and quantities, whose measured values then get entered into permanently maintained reference tables that are treated as cumulative facts about the world; and rely, for whole chunks of the apparatus, the simulation, and the data analysis, on classical or non-relativistic models that everyone regards as superseded. So the theory is not true, the things it posits are nevertheless discovered, and the discarded theories of the past still do the calculating.

  To get a grip on this, our seminar has adopted a small procedure: whenever someone presents a case of theory change, historical or contemporary, they have to fill in a retention ledger, sorting the superseded theory's content into three bins — what the successor kept and now treats as literally true, what it kept but only because it gives right numbers in a limited regime, and what it dropped entirely. The ledgers do not come out tidy. Symmetries and conservation laws tend to be kept; but so is some ontology across violent structural change, electrons running from late-nineteenth-century cathode-ray work through to quantum field theory; while some structure that looked like the most secure part of the old picture, absolute simultaneity, or the conception of heat as the flow of a conserved substance, went into the bin. My housemate's own gloss is that the right unit of retention is not structure versus ontology but resolution: theories are true at a scale, in the way a map is true at a scale, and asking whether they are true simpliciter is a category mistake.

  What I would like is a reconstruction of what this bundle of practices — the effective-field-theory talk, the discovery talk, the reuse of superseded mathematics, and our ledger-sorting habit — presupposes about truth, reference, and theoretical success, and which rival views it quietly rules out. Specifically: does the practice strictly require something like structural realism, or would entity realism, or a thoroughly antirealist view on which a theory is only empirically adequate within a regime, license exactly the same behaviour? Can valid below the cutoff be cashed out as nothing more than yields correct numbers within error bars in regime R, and if so does that cash-out leave the practice of discovery-talk coherent, given that a term which may not refer in the successor theory is doing the discovering? Does the demand physicists place on any successor, that it recover the predecessor's numerical predictions in the predecessor's own domain, show that the old equations were tracking something real, or is it only a constraint on adequacy that an antirealist can accept? And is scale-indexed truth a genuine alternative to approximate truth, or just a relabelling of the same problem? Please separate what the practice strictly presupposes from what it merely sits comfortably with, tell me where it is philosophically underdetermined by several theories at once, and say concretely what would have to change in scientific practice — in the vocabulary of discovery, in how superseded theories are taught and used, in what our ledgers would even be tracking — if the implicit realism were replaced by the antirealist reading.
reasoning: |-
  Okay, the user is grappling with the tension between scientific realism and the practices in particle physics. They mentioned their housemate, a PhD student in particle physics, and how her field uses effective field theories, announces discoveries, and relies on superseded models. The seminar's retention ledger has three bins for superseded theories: kept as true, kept for calculations, or dropped. The user wants to understand what these practices presuppose about truth and reference, and which philosophical views they align with or rule out.

  First, I need to break down each practice and its implications. Effective field theory (EFT) treats theories as approximations valid below a cutoff. This suggests scale-dependent truth. Then there's discovery talk—entities like electrons are treated as real and added to reference tables. But if the theory is approximate, how can we claim discovery? The reuse of old mathematics, like classical mechanics in simulations, complicates things further. The retention ledger shows that some elements persist while others don't, but without a clear pattern.

  The user's main questions are about whether structural realism, entity realism, or antirealism can explain these practices. They also ask if "valid below cutoff" is just empirical adequacy, and if so, does that make discovery talk coherent? Plus, the demand that successors recover predecessor predictions—does that indicate something real or just a pragmatic constraint?

  I should address each question systematically. Start by analyzing what the practices strictly require versus what they're compatible with. For example, EFT and scale-indexing seem to necessitate some form of realism about entities or structures that persist across scales. But antirealists might argue that it's all about empirical adequacy. The recovery of predictions could be seen as a minimal realism or just instrumentalism.

  The user wants to know what would change if an antirealist view were adopted. If scientists stopped treating entities as discovered and saw theories as mere tools, reference tables might not be cumulative. Superseded theories might be taught differently, emphasizing utility over truth. The ledger would track effective models rather than retained truths.

  Also, the housemate's analogy of maps and scale suggests a deflationary view of truth. But does scale-indexed truth resolve issues with approximate truth, or is it the same problem relabeled? Maybe it avoids the vagueness of approximation by specifying domains explicitly.

  I need to ensure I differentiate between strict presuppositions and compatible views. Practices like discovery talk and cumulative reference tables strongly suggest entity realism. The retention ledger's mixed results support structural realism. However, antirealism could accommodate these practices by interpreting them pragmatically, though it might strain the discovery aspect.

  Concrete changes under antirealism: scientists might stop using "discovery" and instead say "postulated entities." Superseded theories would be tools without any truth claim. The ledger would focus on predictive success, not ontological retention. But current practice seems to lean towards realism, especially with permanent reference tables and ontology persistence like electrons.

  In conclusion, the practices don't strictly require one philosophical stance but are most coherent under structural or entity realism. Antirealism would necessitate changes in language and attitude, particularly regarding discoveries and the ontological status of entities. The scale-indexed truth offers a clearer framework than approximate truth by tying validity to specific domains.
answer: |-
  This constellation of practices—effective field theories (EFTs), discovery claims, reuse of superseded mathematics, and your ledger-sorting—reveals a nuanced **scale-indexed entity realism with structural retention constraints**, which pragmatically navigates between strict realism and instrumentalism. It presupposes specific commitments while remaining compatible with (but strained under) some antirealist views. Below is a step-by-step reconstruction:

  ### Core Presuppositions of the Practice
  1. **Scale-Indexed Truth as Operational Necessity**:  
     - **Strict Presupposition**: Theories are *approximately true within a specified domain* (energy scale, resolution) in a way that is *ontologically committed* within that domain. "Valid below cutoff" is **not merely empirical adequacy**; it implies the theory captures *real causal structure* relevant at that scale (e.g., quarks exist and interact as described at LHC energies, even if QFT is not fundamental).  
     - **Rival View Ruled Out**: Global antirealism (e.g., van Fraassen's constructive empiricism). If theories were *only* empirically adequate, physicists would not:  
       - Treat discovered entities (Higgs boson, top quark) as **mind-independent facts** entered into permanent reference tables.  
       - Demand that successors *recover the ontology* of predecessors in their domain (e.g., QFT electrons retain the identity of Thomson's electrons).  

  2. **Entity Realism as Foundation for Discovery-Talk**:  
     - **Strict Presupposition**: Certain theoretical terms (**"detection signatures"**) refer to real entities across theory change. Electrons are discovered because experimental protocols (tracking ionization, energy deposition) provide *robust access* to them, independent of fundamental theory shifts.  
     - **Coherence Condition**: Discovery-talk requires that reference is **partially preserved** even when theories are superseded. Your ledger shows this: electrons are retained as "literally true" despite radical theoretical changes.  
     - **Rival View Challenged**: Radical structural realism (e.g., French-Ladyman ontic SR). If *only structure* were retained, physicists would not treat entities (quarks, neutrinos) as the primary units of discovery. Structure (e.g., gauge symmetries) is retained too, but ontology anchors practice.  

  3. **Recovery of Predictions as Minimal Realism**:  
     - **Strict Presupposition**: The demand that successors recover predecessors' predictions in their domain shows that **old equations tracked real patterns** (e.g., Navier-Stokes equations describe real fluid behavior, even if fluids are emergent). This is stronger than instrumentalism: it assumes the patterns are *causally grounded* in reality.  
     - **Antirealist Compatibility?** An antirealist *can* accept recovery as a *pragmatic constraint* (e.g., to ensure continuity in engineering applications). But in particle physics, recovery (e.g., QCD → classical fluid dynamics in heavy-ion collisions) is treated as **evidence of ontological grounding**, not just predictive convenience.  

  4. **Superseded Mathematics as Tools with Causal Warrant**:  
     - **Presupposition**: Old theories (e.g., Newtonian mechanics in detector simulations) are reused because they are *causally reliable* within their scale. This relies on **hierarchical reality**: macroscale objects (detector materials) *really behave* classically, so classical models aren't "false" but *appropriately granular*.  
     - **Incompatible With**: Eliminativism (e.g., claiming classical mechanics is "false" and must be abandoned). Practice shows superseded theories are *epistemically privileged tools* for specific contexts.  

  ---

  ### Philosophical Underdetermination
  - **Structural Realism (SR) vs. Entity Realism (ER)**:  
    - Ledger data is mixed: symmetries (favored by SR) and electrons (favored by ER) are both retained. The practice is **compatible with moderate SR** (e.g., Chakravartty's semirealism) or **ER with structural constraints** (e.g., Hacking's realism about entities).  
    - **Underdetermined**: Neither strictly required. SR struggles to explain *entity persistence*; ER struggles to explain why *some structures* (e.g., Lorentz symmetry) are retained while others (e.g., simultaneity) are dropped.  

  - **Antirealism (Empirical Adequacy)**:  
    - **Compatible only if stretched thin**: An antirealist can reinterpret EFTs as "merely predictive tools," discovery-talk as "convenient fiction," and recovery demands as "pragmatic continuity." But this strains to explain:  
      - Why reference tables (e.g., Particle Data Group) are treated as **cumulative knowledge**, not just instrumental posits.  
      - Why physicists insist successors must *recover ontology*, not just predictions (e.g., quantum gravity must account for fermions, not just reproduce GR in low energy).  

  ---

  ### Scale-Indexed Truth vs. Approximate Truth
  - **Genuine Alternative?** Yes.  
    - **Approximate truth** is vague: How close is "close enough"? Does it apply globally?  
    - **Scale-indexed truth** specifies: *This model is true-at-scale-Λ*, meaning:  
      - It correctly describes all *physically possible measurements* within Λ.  
      - Its ontology is *real relative to Λ* (e.g., protons are composite at TeV scales but point-like at MeV scales).  
    - This avoids the "category mistake" your housemate notes: asking if Newtonian mechanics is "true simpliciter" is like asking if a 1:10,000 map is "true" without specifying resolution.  

  ---

  ### How Practice Would Change Under Strict Antirealism
  If physicists adopted van Fraassen-style empiricism:  
  1. **Discovery Vocabulary**: "Discovery" of entities would cease. Instead: "We observed a track consistent with the *model* of a Higgs-like particle." Reference tables would be relabeled "best-fit parameters for current models."  
  2. **Use of Superseded Theories**: Classical mechanics in simulations would be taught as a *predictive algorithm* with no claim about underlying reality. No need to explain *why* it works.  
  3. **Retention Ledgers**: Would track only *predictive success*, not ontological retention. "Kept and literally true" bin would disappear—everything is "kept for calculations" or "dropped."  
  4. **Demand for Recovery**: Would be purely pragmatic ("to ensure instrument compatibility"), not evidence the old theory "latched onto reality."  

  ---

  ### Summary: What Practice Presupposes
  - **Strictly Required**:  
    - A **scale-relative ontology** (entities exist and behave as described *at specific scales*).  
    - **Robust reference** for detection signatures across theory change.  
    - **Causal grounding** for superseded models used in applied contexts.  
  - **Compatible With**: Entity realism, structural realism, or pragmatic realism.  
  - **Ruled Out**: Global antirealism, eliminativism, and fundamentalism (the idea that only the ultimate theory is "true").  
  - **Underdetermined**: Whether retention is primarily structural or entity-based.  

  The practice treats science as **cartography of a stratified reality**: maps at different scales capture real features, but no single map is "the whole truth." This is not structural realism *or* entity realism alone—it is **scale-specific realism**, where ontology and structure are retained when they remain causally relevant at a given level of description.
