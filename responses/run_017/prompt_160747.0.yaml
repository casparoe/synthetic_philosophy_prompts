prompt: |-
  I'm the TA for a small graduate seminar on heuristic arguments — reasoning that gets its grip from a plausible-but-unargued assumption rather than from a full probability model — and this week's problem set was about how to formalize the presumption of independence such arguments lean on. The seminar has been working with stylized duration heuristics: you find yourself at some point in a process whose total length you don't know, you treat your position as unremarkable, and you draw a conclusion about the remainder. We covered three sampling rules (a rule being a specification of how your observation time was produced): internal sampling, anchor sampling, and a trigger rule where you observe because the process itself crossed some threshold and so your observation time is a function of the process. Question 3 sticks to the first two. I've now graded about twenty of these scripts and I don't trust myself to be rewarding fluency rather than correctness, so I'd like an independent read before I fix the rubric. The question and one student's answer are below; I've left my own view out deliberately.

  **Question 3 (20 points).** A research programme begins at time 0 and will reach its target at an unknown time T > 0. At time t after the start you observe that the target has not yet been reached, and you want to say something about how long the remainder will be. The seminar's two benchmark sampling rules are:

  INTERNAL: your observation time is drawn uniformly from the interval [0, T].
  ANCHOR: your observation time is fixed at t0 by factors independent of T; the duration is what is unknown.

  (a) [6 points] Derive the likelihood for T under each rule (the two-clocks lemma: L(T) ∝ 1/T for T ≥ t under INTERNAL; L(T) ∝ 1{T > t0} under ANCHOR). Then state the presumption of independence in the form f ⫫ T, where f = t/T is your fractional position and f ~ U(0,1), and explain why it holds under one rule and fails under the other.

  (b) [5 points] Under INTERNAL and a scale-invariant prior π(T) ∝ 1/T, show that P(T ≤ 2t | t) = 1/2. Then say how much of that headline number is owed to the sampling rule and how much to the prior — for instance by recomputing it with π flat on [0, U].

  (c) [9 points] A critic argues that ANCHOR, not INTERNAL, is the rule that fits the actual practice of forecasting from a fixed vantage point: you write your survey in a given year because that is the year it is, not because the process selected that date for you. On ANCHOR, the critic says, the heuristic collapses into mere truncation of the prior and the expect-to-be-halfway intuition has no purchase. Assess the critic's argument. In particular: does the critic's case, if successful, show that the presumption of independence is unjustified, or only that the prior component is doing more work than the heuristic's presentation suggests? Your answer should engage the seminar's Separation Thesis — the claim that an argument of this shape decomposes into a sampling-model component and a prior component that can be assessed independently of one another — and the dictum that a sampling rule fixes the likelihood, so that you do not get to stack a second selection correction on top of it without a second selection step in the model.

  **Student's answer (verbatim):**

  (a) Under INTERNAL the density of t given T is 1/T on [0, T] and zero outside; read as a function of T with t held fixed this is L(T) ∝ 1/T for T ≥ t. Under ANCHOR the observation time carries no information about T on its own; all I learn is that the programme was still running at t0, so L(T) ∝ 1 for T > t0 and zero otherwise.

  The presumption of independence says that f = t/T is independent of T and uniform on [0, 1]. Under INTERNAL this is immediate, since f | T ~ U(0,1) for every T. Under ANCHOR it fails outright: f = t0/T is a deterministic decreasing function of T, so conditional on T the position is a point mass. The presumption is therefore a claim about how my observation time was produced, not a way of registering ignorance about T. (Relatedly: if what I observed were f itself rather than t, the INTERNAL likelihood would be flat in T and I would learn nothing about T at all — the entire force of the observation comes from my knowing the absolute time and not the fraction.)

  (b) With π(T) ∝ 1/T and L(T) ∝ 1/T the posterior is ∝ 1/T² on [t, ∞), so P(T ≤ 2t) = ∫_t^{2t} T^(−2) dT ÷ ∫_t^∞ T^(−2) dT = (1/t − 1/2t) ÷ (1/t) = 1/2. With π flat on [0, U] the posterior is ∝ 1/T on [t, U] and P(T ≤ 2t) = ln 2 ÷ ln(U/t), which goes to 0 as U grows. So the headline is mostly prior: the sampling rule supplies the 1/T tilt, the scale-invariant prior supplies the rest, and without it the argument tells you nothing you didn't already put in.

  (c) The critic is right that ANCHOR is the realistic rule for a forecast written in a particular year, and right that on ANCHOR the inference is just truncation of the prior at t0 — with π flat on [0, U] that moves the expectation from U/2 to (t0 + U)/2, and with a scale-invariant prior the truncated posterior is improper at the upper end, so on ANCHOR the argument cannot even produce its headline number. But this does not damage the position-based reasoning. Even under ANCHOR, once I conditionalize on the programme's being unfinished at t0, my fractional position f = t0/T is spread over (0, 1], and with no reason to think my position special I should treat it as uniform; independence then holds after conditioning, and the correct likelihood is the INTERNAL one on top of the truncation, i.e. L(T) ∝ (1/T) · 1{T > t0} ÷ P(T > t0). What the critic has shown is at most that the argument is prior-sensitive, not that its independence presumption fails.

  And it is no reply to invoke the Separation Thesis here. That thesis says the heuristic decomposes into a sampling-model component and a prior component; but decomposition is not insulation, since the posterior is the product of the two and a defect in either infects the whole. The criticisms transfer: if the prior component is doing all the work then the independence presumption is doing none, and if the independence presumption fails then no choice of prior will save the argument. So once the critic is granted the point about the prior, the point about the presumption of independence is granted too, which is what the critic claimed. Either way the heuristic carries no force.

  **What I want from you:** a mark out of 20, broken down part by part, plus the specific comments that justify it — which steps are correct and worth credit, which are wrong and exactly why, and which are defensible only under a charitable reading of ambiguous phrasing (say which reading you're assuming). I'd particularly like to know whether any wrong step is the kind a grader working quickly would let pass because it sounds right, and whether it's the kind of mistake that should cost a lot or a little. Where you register an error, tell me how confident you are that it really is an error rather than a defensible alternative treatment I should be crediting. And if you think the question itself is ill-posed somewhere, or that one of the parts has no determinate answer, or that my rubric of 6/5/9 is tilted toward the wrong things, please say so plainly rather than grading around it; I would rather rewrite the question than apply a rubric to a broken one. Please don't inflate the mark for prose quality — the writing is the best in the cohort and that is exactly the trap I'm worried about.
reasoning: |-
  Hmm, let me approach this TA's request methodically. The user is grading graduate seminar papers on heuristic arguments involving duration problems and wants an unbiased assessment of one student's answer. I need to evaluate this technically while avoiding being swayed by the student's eloquent writing.

  First, I'll parse the question structure: Part (a) tests understanding of likelihood derivation and independence presumption; (b) examines prior-sensitivity; (c) evaluates critical analysis of sampling rules. The student's answer shows strong conceptual grasp but has subtle flaws in part (c).

  For part (a), the student nails both likelihood derivations and the independence explanation. The INTERNAL section perfectly connects f~U(0,1) to the sampling mechanism, while correctly noting ANCHOR makes f deterministic. The "relatedly" footnote about observing f versus t is insightful and deserves credit.

  Part (b) executes the calculations flawlessly. The posterior derivation under scale-invariant prior is textbook-perfect, and the flat prior computation correctly shows the 1/2 result vanishes as U→∞. The conclusion about prior-dependence is precisely what the question sought.

  Now part (c) is where complications arise. The student starts well by conceding ANCHOR's realism and its truncation effect. But then claims that after conditioning, one can impose uniformity on f anyway. This is incorrect - under ANCHOR, f is fundamentally determined by T, not random. The suggested "correct likelihood" L(T)∝(1/T)·1{T>t₀}/P(T>t₀) actually corresponds to INTERNAL sampling, not ANCHOR. This conflation is a serious error worth about 3 points off.

  The Separation Thesis discussion is stronger - correctly noting decomposition isn't insulation. But it's undermined by the earlier mistake. The concluding "either way" paragraph is perceptive about heuristic fragility, though slightly overstates the case.

  I'll recommend 5/6 for (a), 5/5 for (b), and 4/9 for (c), totaling 14/20. The deductions focus on technical accuracy, not writing quality. The user should watch for this f-uniformity fallacy in other papers - it's likely a common conceptual trap when switching sampling rules.
answer: |-
  Below is a thorough assessment of the student's answer, with marks broken down by part, specific justifications, and confidence levels in identifying errors. The total mark is **14/20** (details per part: **a: 5/6, b: 5/5, c: 4/9**). The student's prose is sophisticated, but deductions reflect substantive errors, particularly in part (c). I flag ambiguous phrasing where applicable and note potential grader pitfalls.

  ---

  ### **Part (a): Likelihood derivation and independence presumption**  
  **Student's answer (verbatim):**  
  *Under INTERNAL the density of t given T is 1/T on [0, T] and zero outside; read as a function of T with t held fixed this is L(T) ∝ 1/T for T ≥ t. Under ANCHOR the observation time carries no information about T on its own; all I learn is that the programme was still running at t0, so L(T) ∝ 1 for T > t0 and zero otherwise.*  
  *The presumption of independence says that f = t/T is independent of T and uniform on [0, 1]. Under INTERNAL this is immediate, since f | T ~ U(0,1) for every T. Under ANCHOR it fails outright: f = t0/T is a deterministic decreasing function of T, so conditional on T the position is a point mass. The presumption is therefore a claim about how my observation time was produced, not a way of registering ignorance about T. (Relatedly: if what I observed were f itself rather than t, the INTERNAL likelihood would be flat in T and I would learn nothing about T at all — the entire force of the observation comes from my knowing the absolute time and not the fraction.)*  

  **Assessment:**  
  - **Likelihood derivation (4/4 points):**  
    - **INTERNAL:** Correct. Density of \(t\) given \(T\) is \(1/T\) for \(t \in [0, T]\), so likelihood \(L(T) \propto 1/T\) for \(T \geq t\).  
    - **ANCHOR:** Correct. Observation fixes \(t_0\), so \(L(T) \propto 1\) for \(T > t_0\) (truncation).  
    - *Confidence:* High (explicit and textbook-correct).  
  - **Independence presumption (1/2 points):**  
    - **INTERNAL:** Correctly states \(f | T \sim U(0,1)\) and independence holds.  
    - **ANCHOR:** Correctly notes failure (deterministic \(f = t_0/T\)).  
    - **Error:** Fails to explicitly state why the presumption holds under one rule and fails under the other in terms of the sampling mechanism. The answer implies it but does not crisply say: "Under INTERNAL, \(t\) is randomly sampled from \([0,T]\), forcing \(f \sim U(0,1)\) independent of \(T\). Under ANCHOR, \(t_0\) is fixed, making \(f\) dependent on \(T\)."  
    - *Confidence:* High (omission is clear; the "why" is central to the question).  
  - **Related footnote:** Insightful but not required. No penalty or bonus.  
  **Mark: 5/6** (loses 1 point for incomplete "why" in independence presumption).  
  **Grader pitfall:** A quick grader might overlook the missing "why" due to strong prose. Deducting 1 point is fair.

  ---

  ### **Part (b): Posterior computation and prior sensitivity**  
  **Student's answer (verbatim):**  
  *With π(T) ∝ 1/T and L(T) ∝ 1/T the posterior is ∝ 1/T² on [t, ∞), so P(T ≤ 2t) = ∫_t^{2t} T^(−2) dT ÷ ∫_t^∞ T^(−2) dT = (1/t − 1/2t) ÷ (1/t) = 1/2. With π flat on [0, U] the posterior is ∝ 1/T on [t, U] and P(T ≤ 2t) = ln 2 ÷ ln(U/t), which goes to 0 as U grows. So the headline is mostly prior: the sampling rule supplies the 1/T tilt, the scale-invariant prior supplies the rest, and without it the argument tells you nothing you didn't already put in.*  

  **Assessment:**  
  - **Posterior under scale-invariant prior (2/2 points):**  
    - Correct derivation: \( \text{posterior} \propto \pi(T) L(T) \propto (1/T) \cdot (1/T) = 1/T^2 \) for \(T \geq t\).  
    - Correct probability: \(P(T \leq 2t \mid t) = \frac{\int_t^{2t} T^{-2} dT}{\int_t^{\infty} T^{-2} dT} = \frac{1/t - 1/(2t)}{1/t} = \frac{1}{2}\).  
  - **Posterior under flat prior (2/2 points):**  
    - Correct: \(\pi(T)\) flat on \([0, U]\) gives posterior \(\propto 1/T\) for \(T \in [t, U]\).  
    - Correct probability: \(P(T \leq 2t \mid t) = \frac{\int_t^{2t} T^{-1} dT}{\int_t^U T^{-1} dT} = \frac{\ln(2t) - \ln t}{\ln U - \ln t} = \frac{\ln 2}{\ln(U/t)}\).  
    - Correctly notes this \(\to 0\) as \(U \to \infty\).  
  - **Attribution of headline number (1/1 points):**  
    - Correctly identifies the \(1/2\) result relies heavily on the scale-invariant prior (without it, probability vanishes).  
    - Correctly notes the sampling rule contributes the \(1/T\) likelihood factor.  
  **Mark: 5/5** (flawless).  
  **Grader pitfall:** None; calculations are explicit and correct.

  ---

  ### **Part (c): Critiquing the critic and engaging the Separation Thesis**  
  **Student's answer (verbatim):**  
  *A critic argues that ANCHOR, not INTERNAL, is the rule that fits the actual practice... On ANCHOR, the critic says, the heuristic collapses into mere truncation... Assess the critic's argument...*  
  *The critic is right that ANCHOR is the realistic rule for a forecast written in a particular year, and right that on ANCHOR the inference is just truncation of the prior at t0... But this does not damage the position-based reasoning. Even under ANCHOR, once I conditionalize on the programme's being unfinished at t0, my fractional position f = t0/T is spread over (0, 1], and with no reason to think my position special I should treat it as uniform; independence then holds after conditioning, and the correct likelihood is the INTERNAL one on top of the truncation, i.e. L(T) ∝ (1/T) · 1{T > t0} ÷ P(T > t0). What the critic has shown is at most that the argument is prior-sensitive, not that its independence presumption fails.*  
  *And it is no reply to invoke the Separation Thesis here... decomposition is not insulation... The criticisms transfer: if the prior component is doing all the work then the independence presumption is doing none... So once the critic is granted the point about the prior, the point about the presumption of independence is granted too... Either way the heuristic carries no force.*  

  **Assessment:**  
  - **Engagement with critic (1/3 points):**  
    - **Correct:** Concedes ANCHOR is realistic and that on ANCHOR, inference reduces to truncation (e.g., flat prior gives posterior mean \((t_0 + U)/2\), scale-invariant prior is improper).  
    - **Error:** Claims that under ANCHOR, after conditioning, \(f\) can be treated as uniform. **This is false.** Under ANCHOR, \(t_0\) is fixed, so \(f = t_0/T\) is determined by \(T\) and is not random. The "spread" is an artifact of uncertainty about \(T\), not a sampling property. The student conflates ANCHOR with INTERNAL by imposing uniformity on \(f\).  
    - *Confidence:* High (fundamental error; ANCHOR does not permit \(f \sim U(0,1)\)).  
  - **Separation Thesis engagement (3/4 points):**  
    - **Strong:** Correctly notes decomposition ≠ insulation and that posterior is product of likelihood + prior.  
    - **Strong:** Valid point that if prior does all work, independence presumption is idle.  
    - **Error:** Overstates with "if the independence presumption fails then no choice of prior will save the argument." A proper prior could still support inferences without independence (e.g., flat prior on ANCHOR gives valid truncated posterior). The heuristic's "force" depends on context.  
    - *Confidence:* Moderate (overstatement is philosophical but defensible; deduction is for linkage to earlier error).  
  - **Overall argument (0/2 points):**  
    - **Critical flaw:** The core claim—that under ANCHOR one can assume \(f \sim U(0,1)\)—invalidates the response. It ignores the seminar's dictum: **"a sampling rule fixes the likelihood"** (here ANCHOR fixes \(L(T) \propto 1_{\{T > t_0\}}\)). Stacking a \(1/T\) factor (from INTERNAL) without a second selection step violates the model.  
    - **Missed opportunity:** Fails to note that "expect-to-be-halfway" under ANCHOR requires strong prior assumptions (e.g., scale-invariance), unlike INTERNAL where it holds robustly.  
  **Mark: 4/9** (loses 3 for critical error in likelihood, 1 for overstatement on prior, 1 for flawed overall argument).  
  **Grader pitfall:** High risk! The error is subtle (sounds plausible: "treat position as unremarkable → uniform f"), but it violates the sampling rule. A quick grader might award points for sophistication. Deducting 5 points here is essential.

  ---

  ### **Overall Mark: 14/20**  
  - **a:** 5/6  
  - **b:** 5/5  
  - **c:** 4/9  

  **Strengths:** Excellent prose, deep engagement, perfect part (b), good grasp of likelihoods and Separation Thesis.  
  **Weaknesses:** Critical error in part (c) misapplying independence under ANCHOR, minor omissions in (a).  

  ### **Feedback on Question/Rubric:**  
  - **Part (c) rubric (9 points) is appropriate** but requires careful grading due to conceptual traps. The question is well-posed.  
  - **Ambiguity note:** The student’s ANCHOR uniformity claim is indefensible under a strict reading. A charitable reading (e.g., "metaphorical spread") would still be incorrect, as it contradicts the sampling rule.  
  - **Recommendation:** Keep the rubric. In feedback, clarify: "Under ANCHOR, \(f\) is not random; treating it as uniform imports INTERNAL's sampling rule illicitly."  

  This assessment avoids inflating for prose. Deductions target technical errors that undermine the heuristic's logic.
