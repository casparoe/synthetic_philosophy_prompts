answer: |-
  ### Specification of Requirements for Assessing National Responsibility for WWI Origins  

  1. **Requirement**: Define "responsible" as *causal contribution plus culpable agency*, where culpability requires awareness of war-risk and alternatives. Must distinguish causal role (descriptive) from blameworthiness (evaluative), treating liability to repair as a separate political question.  
     **Motivation**: Prevents conflation (e.g., Serbia bore causal weight but Germany had greater capacity to avert continental war). Handles cases like Austria-Hungary’s aggression (blameworthy cause) versus Russia’s mobilization (causal but potentially defensive).  
     **Tag**: Non-negotiable.  

  2. **Requirement**: Identify the bearer as *the executive decision-making apparatus with effective power to commit state resources*, verified by chains of command. In the Two-War-Room case, only the five conspirators bear responsibility—not the cabinet or "polity."  
     **Motivation**: Rejects diffuse cultural blame; focuses on actors who could choose war/peace (e.g., German Kaiser/Military Cabinet, not "German society").  
     **Tag**: Contestable-but-reasonable.  

  3. **Requirement**: Assign *greater responsibility to actors who created necessary conditions for war when alternatives existed*, not merely who moved first. In overdetermination (e.g., blank cheque), responsibility scales with the *reversibility* and *risk magnitude* of actions. The Latecomer’s Defence fails if mobilization was avoidable and disproportionate.  
     **Motivation**: Blank cheque enabled Austrian aggression; Russian mobilization, though later, escalated beyond local war.  
     **Tag**: Contestable-but-reasonable.  

  4. **Requirement**: Responsibility is an *evidence-dependent historical fact*, not an attitude. In the Archive-Fire case, lost evidence may preclude confident attribution, but responsibility does not vanish—it becomes indeterminate.  
     **Motivation**: Avoids relativism; Fischer’s thesis was contested due to archive gaps but remained falsifiable.  
     **Tag**: Non-negotiable.  

  5. **Requirement**: Specify blame *only for decisions to initiate/escalate*, not outcomes or war aims. Exclude outcome luck (e.g., short vs. long war). Escalation to continental war is distinct from Balkan spark.  
     **Motivation**: Germany’s Septemberprogramm reflects wartime choices, not July culpability.  
     **Tag**: Contestable-but-reasonable.  

  6. **Requirement**: Preventive-war motives *do not mitigate blame* if peaceful alternatives existed. Mitigation applies only if decline was imminent *and* war truly unavoidable.  
     **Motivation**: German fears of Russian industrialization (preventive logic) ignored diplomatic solutions.  
     **Tag**: Camp-preference (rejects Fischerite "inevitability").  

  7. **Requirement**: The account owes *no liability to descendants* but must acknowledge dissenters/conscripts as moral patients. Reparations/commemoration are contemporary political choices, not historical verdicts.  
     **Motivation**: Post-1918 reparations were geopolitical, not philosophical obligations.  
     **Tag**: Contestable-but-reasonable.  

  8. **Requirement**: Treat *initiation*, *escalation*, and *structural* responsibilities as distinct. Structural factors (e.g., alliance rigidity) enable but do not cause; they shift blame only if decision-makers exploited them deliberately.  
     **Motivation**: Rail timetables constrained choices, but leaders could suspend them (as Bethmann considered).  
     **Tag**: Non-negotiable.  

  ### Jointly Unsatisfiable Pairs  
  - **Requirement 3 (overdetermination reversibility) and Requirement 6 (no mitigation for preventive war)** clash if a state acts preventively *and* its action was reversible: the former demands blame, the latter could excuse if war seemed "unavoidable."  
  - **Requirement 4 (responsibility as fact) and Requirement 7 (no descendant liability)** conflict politically: if responsibility is factual, reparations claims may follow, but the requirement denies this link.  

  ### Scoring the Readings  
  - **"Deliberate bid" reading**: Strong on Requirements 1–3 (shows German culpable agency in creating necessary conditions) and 6 (rejects preventive mitigation). Weak on 8 if it conflates Septemberprogramm with July decisions (structural vs. initiation).  
  - **"Stumbled in" reading**: Strong on Requirement 3 (emphasizes all-power overdetermination) and 5 (focuses on miscalculation, not aims). Fails Requirement 1 (downplays culpable agency) and 4 (treats responsibility as hindsight bias).  

  Verdict: Requirement 1 (causal + culpable agency); unsatisfiable pair: 3 and 6.
