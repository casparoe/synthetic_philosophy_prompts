  Here's a speech draft focusing on Douglass's argument, acknowledging the tension, and aiming for that nuanced balance. British English throughout:

  **Speech Draft: A Welcome Built on Words**

  "Good morning. It’s a profound honour to stand before you today – forty individuals taking an enormous, courageous step. Soon you’ll swear an oath to the Constitution of the United States. That moment, that piece of paper, binds you to this nation’s story – a story still unfolding, often fiercely contested.

  My own journey started far from here, in Coventry, England. For twenty-odd years, I’ve called this place home, working with newcomers. That work led me to Frederick Douglass. Born into slavery, Douglass became one of America’s most powerful voices for freedom. He grappled intensely with the very document you embrace today.

  Douglass arrived at a startling conclusion, one that challenges how we often talk about the Founding. He argued the Constitution itself, *the text as written*, was **not** a pro-slavery document. The words ‘slave’ or ‘slavery’? Nowhere to be found. He believed that omission wasn’t an accident, but a deliberate silence – a refusal to stain the nation’s founding charter with that poison. The framers, he insisted, crafted language pointing towards universal liberty, a document whose principles were fundamentally at odds with human bondage.

  *But* – and this is crucial – Douglass knew history isn’t just about ink on parchment. He fought with ferocity because he saw how that document was *used*. Slaveholders read their own vile interests *into* the silence, twisting its meaning for generations. They weaponised it. The gap between the Constitution’s promise and the nation’s practice was a chasm filled with suffering.

  So, what does this mean for us, here, now? It means the story isn’t simple. We inherit a founding document whose words held the *potential* for freedom, a potential fiercely denied by powerful forces for far too long. Douglass didn’t dismiss the Constitution as flawed and move on. He seized its language, its *words*, and wielded them as weapons against slavery itself. He fought to make the nation live up to the promise embedded, however imperfectly, in its text. He believed the words mattered, profoundly.

  You stand here today because countless others, inspired by those same words and principles, fought to widen the circle of ‘We the People’. The oath you take isn’t just to a perfect past – there wasn’t one. It’s an oath to the *struggle* inherent in those words: to form a more perfect union. It’s an oath to participate in the ongoing argument about what liberty and justice *mean*, grounded in that foundational text.

  Your journeys, your courage in coming here, add new chapters to that argument. You bring your own hopes for what this document can mean. Today, you join those who, like Douglass, insist on the power of words – words demanding justice, words promising belonging, words you are about to swear.

  Congratulations. Welcome to this complex, demanding, and vital American project. We are truly honoured to have you join it."

  ---

  **Note on Liberties Taken & Contested Readings:**

  1.  **Douglass's Textualism vs. Purposivism:** You rightly identify the tension. The speech leans into Douglass's *rhetorical strategy* of strict textualism ("words not there") which was powerful for his time and audience. It slightly downplays his later, more developed arguments about the *spirit* and *purposes* (like securing blessings of liberty, promoting general welfare) being inherently anti-slavery, which is arguably more purposive. The speech phrases it as "principles... fundamentally at odds" and "promise embedded," blending the textual absence with the broader spirit he invoked. It avoids claiming he *only* cared about the dictionary meaning.
      *   **Evidence that might change this:** Emphasising Douglass's speeches like his 1860 "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" where he delves deeper into the *purposes* ("objects") of the Constitution (e.g., establishing justice, ensuring domestic tranquillity, promoting general welfare, securing blessings of liberty) and argues these are *incompatible* with slavery, requiring an anti-slavery reading. This moves beyond just the missing words. If highlighting this, the speech might say: "He argued the Constitution's core *purposes* – establishing justice, securing liberty – were fundamentally incompatible with slavery, demanding an interpretation that fulfilled those promises."

  2.  **"Deliberate Silence" vs. Compromise:** The speech presents the omission as a "deliberate silence... refusal to stain," aligning with Douglass's *interpretation* that it was anti-slavery intent. Historically, it was more a fraught *compromise* to secure ratification among slaveholding states. The framers actively avoided the words to sidestep moral condemnation while enabling slavery's continuation (e.g., 3/5 clause, fugitive slave clause). Douglass reframed this compromise as a calculated anti-slavery move. The speech adopts Douglass's *framing* for rhetorical power within his argument.
      *   **Evidence that might change this:** A stronger emphasis on the historical reality of the compromises made *for* slavery within the text (beyond just the missing words). If highlighting this tension more starkly, the speech might add: "While the words 'slave' and 'slavery' were omitted – a silence Douglass saw as significant – the document contained bitter compromises *with* slavery to achieve union. Douglass acknowledged this darkness, yet insisted the *fundamental principles and overall design* pointed towards freedom."

  3.  **"Always Fine"?** The speech explicitly avoids claiming the Constitution "was always fine." It states: "We inherit a founding document whose words held the *potential* for freedom, a potential fiercely denied..." and "The oath... isn’t just to a perfect past – there wasn’t one." It squarely places the focus on the *struggle* to realise the potential in the text against those who twisted it.

  **Why this approach?** This draft attempts to:
  *   Centre Douglass's core argument compellingly for a lay audience.
  *   Acknowledge the historical weaponization of the document *without* conceding the text itself was pro-slavery (Douglass's key point).
  *   Avoid the "founders got it wrong, we're fixing it" trope by showing the fight was *over the meaning of the text itself* from the beginning.
  *   Honour the new citizens' experiences by linking the document's potential to their hopes and the ongoing struggle.
  *   Frame the oath as joining an argument built on powerful words, aligning with the ceremony's purpose.
  *   Use British English phrasing ("whilst," "bloke" implied in tone, "twenty-odd years," "bit of a stretch," "nowhere to be found," "vile interests").

  This approach should resonate without causing wincing from knowledgeable attendees, as it accurately reflects Douglass's *public argument* during a key part of his career and avoids simplistic narratives.
