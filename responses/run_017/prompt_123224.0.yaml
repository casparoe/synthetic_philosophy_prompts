answer: |-
  ## Dissertation Prospectus: The Inheritance Question in Evolutionary Debunking Arguments  

  **1. Research Question & Core Problem**  
  My project addresses a specific, underexplored puzzle within evolutionary debunking arguments (EDAs) in metaethics: the **inheritance question**. Granting the debunker’s core claims—(1) the *genealogical claim* that we can explain the origins of certain "core" moral beliefs (e.g., kin altruism, reciprocity norms, incest aversion) solely via evolutionary pressures without referencing moral truth, and (2) the *modal claim* that under different selective pressures, we would hold different core beliefs with equal conviction—does the potential epistemic defeater attached to *these specific beliefs* transmit to moral beliefs that **lack** a clear evolutionary genealogy? These "extended" beliefs include obligations to distant strangers, future persons, or deontological constraints (e.g., the trolley problem’s prohibition against direct harm). This question arises precisely because EDAs typically target beliefs *with* clean selectionist explanations, while much contemporary moral reasoning extends far beyond them.  

  The field is polarized between two intuitive but conflicting answers:  
  *   **The Isolationist Answer:** Defeat does *not* transmit. Extended beliefs arise from *reasoning* grounded in core commitments, but this reasoning involves systematization, extension, and reflection—practices not reducible to evolved intuitions. The genealogy stops at the core; extended beliefs are products of philosophy, not biology. EDAs only threaten parochial intuitions, not reflective moral judgments.  
  *   **The Contamination Answer:** Defeat *does* transmit. All moral reasoning must bootstrap from foundational commitments shaped by evolution. If the epistemic status of these foundations is undermined (because they are contingent byproducts of selection, not truth-tracking), then any structure built upon them inherits that instability. Reasoning cannot purify tainted origins.  

  The standard realist/anti-realist debate—focused on companions in guilt (e.g., logic/perception) or third-factor explanations (linking evolution to moral facts)—**fails to resolve this fork**. Realists invoke companions or third factors to shield *all* moral beliefs, while anti-realists use EDAs to undermine *all* moral beliefs. Both sides neglect the **heterogeneity** of moral beliefs and the possibility that debunking might have *localized* effects. My project isolates the inheritance question as distinct: even if realism survives the *general* EDA challenge via companions or third factors, it still faces the specific threat of *local defeat spreading globally*.  

  **2. Secondary Wrinkle: The Mechanism Matters**  
  My analysis incorporates a crucial distinction often glossed over in EDA literature: *what exactly did evolution select for?* I distinguish three candidate mechanisms:  
  *   **Content Selection:** Direct selection for specific belief contents (e.g., "care for kin").  
  *   **Norm-Uptake Device:** Selection for a general capacity to acquire, internalize, and enforce locally prevalent norms, regardless of content.  
  *   **Socially-Tuned Self-Presentation:** Selection for abilities to navigate social landscapes, where belief content is shaped by what facilitates status or cooperation within a group.  

  The **force and scope** of the EDA—and thus the inheritance question—likely depends on which mechanism predominates. If evolution selected primarily for *flexibility* (Norm-Uptake or Self-Presentation), our moral beliefs might be tracking *local social or normative facts* rather than being direct products of brute selection. This could:  
  1.  **Blunt** the EDA for extended beliefs (if they stem from tracking local norms, not archaic pressures).  
  2.  **Complicate** the contamination answer (if reasoning operates on socially acquired norms, not just evolved "cores").  
  3.  **Explain** moral diversity without necessarily strengthening the modal claim for *all* beliefs.  
  While my supervisor suggests this reduces to "reasoning correcting bias," I argue the *source* of the "bias" (direct selection vs. flexible tracking) fundamentally alters the debunking challenge and the prospects for inheritance. This mechanism-dependence is integral to my approach.  

  **3. Methodology**  
  Rather than a case-by-case survey of extended beliefs—a potentially endless and theory-neutral task—my methodology leverages **conceptual analysis grounded in evolutionary psychology and metaethical theory**. Over twelve months, I will:  

  *   **Phase 1 (Months 1-4):** Precise Articulation & Mechanism Modeling.  
      1.  Define the "core" belief class using criteria from evolutionary psychology (clear adaptive function, cross-cultural prevalence, evidence of selective pressure).  
      2.  Develop distinct causal models for how each evolutionary mechanism (Content, Norm-Uptake, Self-Presentation) generates core beliefs.  
      3.  Precisely define "extended" beliefs as those lacking direct adaptive explanations, arising primarily through cultural/reflective extension.  
  *   **Phase 2 (Months 5-8):** Transmission Analysis under Each Mechanism.  
      1.  Analyze the logical structure of the inheritance question: Is defeat transmitted via logical inference, psychological bias, or undermining of justificatory foundations?  
      2.  Assess the viability of Isolationism and Contamination under *each* evolutionary mechanism model. Does flexibility insulate extended beliefs? Does Content Selection make contamination inevitable?  
      3.  Evaluate whether reasoning can "purify" extended beliefs under each mechanism, scrutinizing the bootstrapping objection.  
  *   **Phase 3 (Months 9-12):** Taxonomy & Implications.  
      1.  Construct a taxonomy of EDA "reach": *Local Defeat* (core only), *Class-Specific Defeat* (e.g., all deontic beliefs), *Global Practice Defeat* (all moral judgment).  
      2.  Develop criteria for "overreach": When does an EDA illegitimately extend beyond what its premises (genealogical + modal claims + mechanism) support?  
      3.  Synthesize findings into a mechanism-sensitive account of inheritance, demonstrating its independence from the general EDA realism/anti-realism debate.  

  This approach focuses on the *structure* of the problem and the *role* of evolutionary mechanisms, avoiding the pitfalls of an exhaustive empirical survey while yielding philosophically robust conclusions.  

  **4. Deliverables & Contribution**  
  A successful project will deliver:  
  1.  A **novel framework** for understanding EDAs centered on the distinct "inheritance question."  
  2.  A **mechanism-sensitive analysis** showing how the selected-for capacity shapes EDA scope.  
  3.  A **taxonomy of defeat reach** (Local, Class-Specific, Global Practice) providing clearer diagnostic tools.  
  4.  A **criterion for overreach** in EDAs, protecting against overly ambitious debunking.  
  5.  **Resolution of the fork**: A defended position on whether, and under what conditions, defeat transmits from core to extended beliefs.  

  This contributes significantly by moving beyond the stalemated general EDA debate. It provides realists and anti-realists with a more nuanced map of where EDAs might bite and where they might not, based on belief type and evolutionary history.  

  **5. Feasibility, Scaling, and Failure Conditions**  
  The project is ambitious but feasible within 12 months due to its focused conceptual methodology. The primary risk is **scope creep** into the general EDA debate or detailed empirical psychology. I mitigate this by rigorously adhering to the inheritance question structure and mechanism analysis. If initial work reveals the mechanism distinction *does* collapse into the "reasoning correction" problem (as my supervisor suspects), I will pivot to make that collapse and its implications the core argument, refining the taxonomy accordingly. A secondary risk is underestimating the complexity of "extended" beliefs; I will prioritize paradigmatic examples (distant strangers, future generations, trolley intuitions).  

  **Honest Failure Condition:** The project fails if, after rigorous analysis, the inheritance question proves **inescapably dependent** on resolving the *general* EDA challenge (e.g., companions/third factors) *before* any localized analysis is possible, rendering my proposed isolation untenable. Success does *not* require definitively proving Isolationism or Contamination; it requires demonstrating that the question is *meaningful and distinct*, and providing a clear, mechanism-sensitive framework for answering it.  

  **6. Anticipated Committee Questions**  

  *   **Q1: Isn't this just the companions-in-guilt argument with new labels?**  
      *No.* The companions debate asks whether EDAs self-defeat by also undermining logic/perception. The inheritance question *assumes* the EDA might be valid for its *intended target* (core moral beliefs) and asks a subsequent, distinct question: does the problem *spread*? It’s about the internal structure of moral epistemology *after* granting the debunker a localized victory, not about whether that victory is possible in the first place.  

  *   **Q2: Doesn't the 'reach' question collapse back into whether the debunker's explanation is independent of the moral facts?**  
      *Not necessarily, and that's the point.* The independence premise is crucial for the *initial* debunking of core beliefs. The inheritance question asks: *even if independence holds for core beliefs*, does the resulting defeater apply to beliefs formed by processes significantly decoupled from the core evolutionary pressures? My mechanism analysis (e.g., Norm-Uptake) specifically explores whether extended beliefs might have explanations *involving* moral/social facts, even if the core does not, breaking the link required for straightforward contamination. The reach question operates downstream of the initial independence claim.  

  This project offers a targeted, novel investigation into the scope of evolutionary challenges to morality, promising to refine a central debate in metaethics by attending to the diverse origins and epistemic pathways of our moral commitments.
