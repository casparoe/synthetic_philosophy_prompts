  Throughout, I'll maintain equal competence: both get strong lines, both make uncomfortable concessions. The ending should leave the debate unresolved but clarify the sticking points. I'll avoid citations, historical references, or rhetorical tricks - pure philosophical argument grounded in the fictional case.
answer: |-
  ## After-Dinner Argument at the War Studies Institute

  *(The common room after dinner. COLONEL HALVARD BRUUN, late 50s, precise bearing, nurses a whiskey. DR. LEILA VOSOUGHI, early 40s, intense focus, sips tea.)*

  **BRUUN:** ...and that’s why training focuses on the *how*, Leila. Control, proportionality, distinction. The fog of war is thick enough without soldiers also trying to adjudicate the ultimate justice of the conflict itself mid-firefight. The law recognizes that. Treat all combatants alike.

  **VOSOUGHI:** Halvard, that legal symmetry is precisely the problem. It morally launders participation in an unjust war. Imagine Private Amara Sen. Meridian conscript. Drives fuel trucks for an anti-aircraft battery. She believes, reasonably given her state’s propaganda, that she’s defending her homeland against Kavala’s resource grab. But objectively? Her work enables that battery, which shoots down Kavalan planes trying to stop the ethnic cleansing of the Shen. Her actions sustain the machinery killing innocents.

  **BRUUN:** Exactly! Reasonably blameless. She doesn’t know the truth about the Shen. She acts on the information available, serving her country as she’s ordered. How can she possibly be morally *worse* than Kavalan soldiers targeting her? They are trying to kill her *because* of what her fuel trucks enable. Yet under the symmetry thesis, she has the same right to defend herself against them as they have to attack her position. That’s the only practical, fair way.

  **VOSOUGHI:** You’re conflating three distinct things, Halvard. Blame, liability, and permissibility. Is Sen *blameworthy* for what she does? Given her reasonable false belief, probably not, or minimally so. She’s not culpable in the way someone knowingly enabling atrocities would be. But is she *morally liable* to defensive killing? That’s different. Liability tracks whether someone is contributing to an unjust threat, making them a legitimate target for necessary and proportionate defensive force. By enabling that battery, Sen is objectively part of the threat against innocent Shen and the Kavalan forces justly intervening to stop it. So yes, she is liable. Does that make it *permissible* for a Kavalan soldier to kill her? That depends on necessity and proportionality in that moment – could they disable the truck non-lethally? Is killing her the only way to stop the battery? But crucially, her blamelessness doesn’t magically erase her contribution to the threat or her liability.

  **BRUUN:** So the Kavalan soldier, convinced of his cause, can blow up her truck, killing her, and it’s morally permissible because, objectively, she’s part of the threat? Even though she’s utterly innocent in her mind? That reduces her to a mere obstacle, stripping away her moral status as a person acting under duress and ignorance. It feels like punishing the unwitting instrument.

  **VOSOUGHI:** It’s not punishment, Halvard. It’s tragic necessity stemming from her material contribution to an unjust harm. Her moral luck is terrible – placed in that position by her state. But that doesn’t negate the objective threat she helps sustain. The focus is on the *harm being done*, not primarily her inner state. Now, apply this to Kavala itself. Their intervention stops the cleansing – a clear just aim. But they also intend to annex Shen Province for cobalt. Roughly a third of their ops are geared towards that annexation, not just protection. How does revisionism handle *that*?

  **BRUUN:** A messy problem for you, I’d say. Two views spring to mind. The *severance* view: if the just aim (protection) is genuinely separable from the unjust one (annexation), then soldiers whose actions *only* serve the just aim retain the rights of just combatants. Or the *contamination* view: introducing an unjust aim fundamentally poisons the whole war, so no Kavalan soldier can claim the full rights of a just combatant. Neither sits easily. Severance requires impossibly fine-grained tracking of individual soldier contributions to specific aims. Contamination seems harsh – condemning even soldiers purely engaged in protecting the Shen because their state has mixed motives. Which uncomfortable camp do you pitch your tent in?

  **VOSOUGHI:** Contamination. The aims aren't truly severable. The annexation intent shapes their overall strategy – those resource-focused operations you mentioned. It dictates how they secure territory, potentially undermining genuine self-determination for the Shen later. The war’s objective moral character is tainted by the unjust aim; it’s not a purely just war with an unfortunate add-on. Therefore, Kavalan soldiers materially supporting *this specific war effort* are contributing to an unjust enterprise, even if parts of it are just. They lack the blanket right to kill Meridian soldiers that pure just combatants would have.

  **BRUUN:** What about Sergeant Tomás Iriarte? Kavalan volunteer. Enlisted explicitly to help annex Shen. Wants that cobalt. But his unit? Spent the whole war securing a refugee corridor. He’s never fired his weapon. He’s actively saving lives. Is he liable to be killed by a Meridian defender because he *wants* the annexation? Or is his actual, life-saving contribution what counts?

  **VOSOUGHI:** His bad aims are morally reprehensible, revealing his character. But liability? That hinges on his actual contribution to the unjust threat. Right now, securing the corridor objectively reduces harm. He’s not materially supporting the annexation aim *in this role*. So, while blameworthy for his motives, he’s not currently liable to defensive killing *as a direct participant in the unjust threat*. If he were reassigned to a unit actively seizing territory for annexation, that would change. Motive reveals character, but liability tracks the threat you actually help create.

  **BRUUN:** Character… that brings me to my exchange test. To see if a soldier is morally at fault for fighting, ask: If this same person, with their personality, upbringing, sense of duty, had been born and raised on the *other* side, would they have fought just as willingly for that cause? In most cases, yes. The dutiful Meridian conscript would likely be a dutiful Kavalan soldier, and vice versa. The eager nationalist here would be the eager nationalist there. What does that tell us? That the individual soldier’s moral position isn’t defined by the banner they fight under, but by traits like obedience or patriotism common to soldiers everywhere. That’s why treating them symmetrically makes moral sense – they *are* interchangeable in the relevant sense. The law reflects this deep truth.

  **VOSOUGHI:** I’ll grant your test probably returns that result for many soldiers. But it’s measuring the wrong thing. Liability to defensive force doesn’t primarily track whether someone is obedient, patriotic, or even would fight for the other side. It tracks whether they are *here and now* contributing to an objective unjust threat. The exchange test focuses on the agent's traits – their biddable nature. But liability focuses on the *act*, the *harm* being perpetrated. A highly obedient person driving fuel for an unjust aggression is still contributing to that aggression, regardless of how obedient they’d be elsewhere. A principled resister, forced at gunpoint to do the same, might be blameless, but if their action fuels the threat, they are still *materially* liable, however tragically. The test confuses the psychology of the agent with the moral quality of the act and its consequences.

  **BRUUN:** Consequences you admit are often impossible for the soldier to judge! Your view creates an impossible burden. If a soldier’s right to kill hinges on the *objective justice of their war*, and people on both sides of every conflict reasonably disagree about that justice, how can any soldier *ever* know if they are permitted to fire? Your revisionism makes the actual rules of engagement a moral minefield. It paralyzes. The symmetry of the law provides a clear, usable guide: follow the rules of conduct, and you fight permissibly.

  **VOSOUGHI:** The difficulty is real, Halvard. I won’t pretend otherwise. In the fog of war, with pervasive reasonable disagreement, a soldier cannot know with certainty if their cause is objectively just. What should they do? Focus on what they *can* reasonably know and control: the immediate rules of engagement. Don't target civilians. Minimize harm. Refuse manifestly illegal orders. While the objective justice of the war determines the fundamental moral permissibility of fighting *at all*, the epistemic limitations mean a soldier acting in reasonable, good faith belief that their cause is just, while objectively mistaken, may not be *culpable* for participating. But it doesn’t make their participation objectively *just* or erase the liability of those they fight against if they are objectively in the wrong. It’s a tragic gap between epistemic constraints and moral reality.

  **BRUUN:** A gap that swallows practical morality whole. But let’s press your symmetry thesis, Colonel. Two Meridian conscripts. One, let’s call him Dimitri, he *believes* in the ethnic cleansing. He fights eagerly, hates the Shen, sees Kavala as invaders. The other, Pavel, was dragged from his home, beaten into uniform. He’s terrified, fires only when directly ordered under threat, tries to avoid combat. Does the symmetry thesis *really* require treating Dimitri and Pavel as moral equals on the battlefield? Both are just ‘combatants’?

  **VOSOUGHI:** *(Sighs, swirls his whiskey)* Legally? Yes, they wear the uniform, carry weapons, are part of the Meridian force. Targeting either is permissible under the laws of war. Morally? Under the symmetry thesis as I understand it… yes, their status *as combatants* is the same. Their liability stems from their functional role in the military machine opposing Kavala, regardless of their inner motives or level of enthusiasm. Pavel’s conscription might mitigate his *blameworthiness* significantly – he might be far less culpable than Dimitri. But he still, however reluctantly, picks up a rifle and shoots at Kavalan soldiers when forced. He objectively contributes to the threat. The law, and the symmetry thesis for practical reasons, must focus on the external role. It’s brutal, Leila. I live with it because I believe the alternative – soldiers making individual judgments about the justice of the war and the inner guilt of each enemy – leads to far greater chaos and atrocity. We judge the act of fighting, not the soul of the fighter, for the sake of some semblance of order amidst horror. But it means a Dimitri and a Pavel are, tragically, functionally equivalent targets. That’s the ugly cost.

  **VOSOUGHI:** And the cost of *my* view is that soldiers like Sen or Pavel, caught in the gears, can be legitimate targets despite their blamelessness. We both live with ugly truths, Halvard.

  *(A long silence hangs in the air.)*

  **BRUUN:** What would actually move me? Evidence that soldiers, as a class, *can* reliably know the objective justice of their nation’s wars *before* they fight, and that refusing to serve unjust wars is a viable, widespread possibility without collapsing society. Then symmetry would seem like a moral abdication.

  **VOSOUGHI:** What would move me? A demonstration that reasonable belief in the justice of one's cause *fully* negates liability to defensive force, even when objectively wrong, such that someone like Sen poses no unjust threat at all. Then the symmetry thesis would be morally coherent, not just practically necessary.
