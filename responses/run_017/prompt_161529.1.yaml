prompt: |-
  so here's the situation. I'm on a tiny team (four people) trying to decide whether to go ahead with a project that, as far as we can tell, has been attempted a handful of times in adjacent fields and basically never landed on time or on budget. Two of us built a fairly detailed causal model of why our version should take about a year; one of us keeps saying that's exactly what the planning-fallacy literature predicts everyone says, and that we should just look at the base rate for projects of this shape and multiply by three. I don't want to settle our argument. I want the spec: what would an actual theory of *when to defer to the outside view* have to get right in order to count as adequate for making a real decision like this? Not a vibe, not "use base rates when available," a list of requirements with the case or consideration behind each.

  A few things I already think belong somewhere on the list, but you place them and add what I'm missing: the difference between a reference class that's similar in *mechanism* (shared causal structure) and one that's similar only in *outcome statistics*, and what to do when the narrowest mechanically-similar class and the narrowest outcome-similar class point in opposite directions; the "we excised the cause" move, where your inside view names the specific thing that killed the historical cases and claims to have removed it, versus the fact that probably every team in the class had some story like that — I want a requirement that says what evidence would separate those two without just defaulting to "assume you're average"; the fact that reference classes can be *endogenous*, i.e. if everyone deferred to the base rate then only teams with unusually strong inside-view reasons would attempt, which changes the base rate the next person should use, so the theory can't treat the numbers as handed down from nowhere; the fact that choosing the reference class is itself a judgment call exposed to the same overconfidence, so the theory has to say where the regress stops or why it isn't vicious; the distinction between using the outside view as a *point estimate*, as a *calibration check on your model*, and as a *decision threshold*, since a class with enormous spread can be useless for the first and fine for the second; and what the outside view even *is* in a first-of-a-kind case where the only classes that contain you are absurdly broad. Also, please keep separate two things I notice people run together: modesty about your own reliability as a forecaster, and deference to a base rate about your case — you can be maximally modest about yourself and still think the class says nothing about you, or be beautifully calibrated and still owe deference, so a theory that collapses them is hiding something.

  For each requirement say which case motivates it, and mark which ones are non-negotiable and which are just the preferences of one camp. The part I care most about: tell me which subset of the desiderata you think can't be jointly satisfied — my guess is that "must be sensitive to genuinely diagnostic inside-view information" and "must not be exploitable by self-serving claims of exceptionality" are secretly the same requirement pulling in two directions, but you tell me where the real impossibility is, since if the list is itself unsatisfiable that's the interesting result. And say which single requirement does the most work in ruling out the usual rules of thumb (always defer where a class exists; defer unless you have a mechanism; split the difference; defer to the narrowest class containing you; outside view as sanity check only). A short scorecard for those at the end is fine, but keep the weight on the criteria — that's the part I actually want to think with. Oh, and write it so I could hand it to the teammate who disagrees with me without it reading like it was written for my side.
reasoning: |-
  Okay, let me unpack this user's query. They're on a small team debating whether to proceed with a project that historically has poor outcomes. They've built a detailed causal model predicting a one-year completion, but one teammate argues for deferring to base rates which suggest tripling that estimate. The user wants a rigorous framework for deciding when to trust the inside view versus outside view, not just heuristic advice.

  Hmm, the user is clearly frustrated with superficial treatments of this problem. They mention several nuanced aspects: mechanistic vs statistical similarity, the "we fixed it" fallacy, endogenous reference classes, and the calibration/deference distinction. They want a theory with explicit requirements, not vibes. 

  I notice they're very aware of cognitive pitfalls - planning fallacy, overconfidence, self-serving biases. Their hidden concern seems to be: "How can we make this decision rationally when all approaches feel compromised?" The challenge is balancing legitimate uniqueness claims against statistical humility.

  The real tension they're circling is between two requirements: 
  1) The theory must allow genuine inside-view evidence to override base rates
  2) But must prevent this from becoming a "special snowflake" loophole

  These seem fundamentally at odds because exceptionality claims are unfalsifiable upfront. Every failed project probably thought they were the exception too. That's the impossibility they're sensing - you can't objectively verify "we're different" before attempting the project.

  Other key challenges: 
  - Reference class selection is subjective and prone to motivated reasoning
  - First-of-a-kind projects lack good comparators
  - Deference mechanics change based on whether you're using base rates for point estimates vs calibration

  For the framework, I'll need to:
  1) Systematically list requirements with their rationales
  2) Flag which are non-negotiable (like avoiding vicious regress)
  3) Show where tensions exist (especially the exceptionality paradox)
  4) Evaluate common heuristics against these criteria

  The output should feel neutral - not taking sides in their team debate. The goal is giving them conceptual tools to structure their discussion, not endorsing either position. The "impossibility" insight about exceptionality claims might actually help them reframe the conflict.

  Most importantly, the framework must acknowledge that in novel endeavors, some irreducible uncertainty remains no matter which approach they take. The theory can clarify tradeoffs but can't eliminate the gamble.
answer: |-
  Here’s a rigorous specification for a theory of when to defer to the outside view, structured as a list of requirements with their rationales, tensions, and implications. It treats your team’s disagreement as a case study without taking sides.

  ---

  ### **Core Requirements for an Adequate Theory**  
  *(Non-negotiable requirements marked with **★**)*

  1. **★ Explicit Uncertainty Quantification**  
     - **Case**: Your team’s inside-view model claims "~1 year," while the outside view suggests "~3 years."  
     - **Requirement**: The theory must quantify uncertainty for both views (e.g., confidence intervals, scenario probabilities). It cannot treat estimates as point values.  
     - **Why non-negotiable**: Decisions without uncertainty bounds ignore tail risks and conflate precision with accuracy.

  2. **★ Distinguish Mechanism Similarity from Outcome Similarity**  
     - **Case**: Your causal model cites mechanistic differences from past failures; your teammate cites outcome statistics (delays/cost overruns).  
     - **Requirement**: The theory must weight reference classes by **causal-structural alignment** (e.g., shared technical bottlenecks) over mere outcome correlation. If classes conflict, it must prescribe how to test mechanistic claims (e.g., "We excised cause X" requires evidence X was *the* failure mode in prior cases).  
     - **Why non-negotiable**: Outcome-based classes often include irrelevant projects; mechanism-based classes reduce false analogies.

  3. **★ Endogenous Reference Class Correction**  
     - **Case**: If only confident teams attempt such projects, the historical base rate is skewed toward failure (since cautious teams avoid trying).  
     - **Requirement**: The theory must adjust base rates for **selection bias**. If a reference class only includes attempts by overconfident teams, its failure rate isn’t generalizable.  
     - **Rationale**: Base rates aren’t "natural laws" — they emerge from human decisions. Ignoring this risks garbage-in-garbage-out.

  4. **Anti-Exceptionality Burden of Proof**  
     - **Case**: Your team claims "We fixed cause X," but past teams likely claimed the same.  
     - **Requirement**: To override the outside view, the inside view must provide:  
       - (a) **Causal evidence** (e.g., experiments validating the "fix"),  
       - (b) **Contradictory base rates** (e.g., a *successful* reference class where X was mitigated).  
     - **Motivation**: Unsubstantiated claims of uniqueness are epistemically bankrupt; evidence must be externally verifiable.

  5. **★ Regress Termination for Reference Class Selection**  
     - **Case**: Choosing between "AI projects," "novel infrastructure," or "startup MVPs" as the reference class is subjective.  
     - **Requirement**: The theory must define a stopping rule (e.g., "Use the narrowest class with ≥5 cases where causal drivers are documented"). If no adequate class exists, it must flag this as "no outside view available."  
     - **Why non-negotiable**: Infinite regress in class selection paralyzes decisions; a clear threshold forces rigor.

  6. **Explicit Role Assignment**  
     - **Case**: Is the outside view a point estimate? A calibration check? A decision threshold (e.g., "don’t proceed if base rate success <10%")?  
     - **Requirement**: The theory must specify how to use the outside view for:  
       - **Calibration**: Adjust inside-view uncertainty ranges to match historical accuracy.  
       - **Decision thresholds**: Only when base rates have low variance (e.g., "never on budget" → abandon).  
       - **Not point estimates**: When variance is high (common in innovation).  
     - **Rationale**: Using broad-base rates as point estimates misrepresents their utility.

  7. **First-of-a-Kind Viability**  
     - **Case**: If your project is genuinely novel, broad reference classes (e.g., "all R&D projects") may be useless.  
     - **Requirement**: The theory must define when to **discard the outside view** due to incomparability. Criteria: no shared causal mechanisms, or class variance >> mean.  
     - **Motivation**: Forcing deference to irrelevant base rates is cargo-cult reasoning.

  8. **★ Decouple Forecaster Modesty from Base Rate Deference**  
     - **Case**: You can be humble about your model’s accuracy yet still believe your project is mechanistically distinct.  
     - **Requirement**: The theory must treat **self-assessment of reliability** (e.g., "I’m overconfident in estimates") separately from **evidential support for exceptionality**.  
     - **Why non-negotiable**: Conflating them (e.g., "you’re biased, so defer") commits a genetic fallacy. Modesty doesn’t negate evidence.

  ---

  ### **Tensions and Impossibilities**  
  - **Core Impossibility**: **"Sensitivity to diagnostic evidence" vs. "Anti-exploitability"**  
    - You can’t simultaneously allow teams to override base rates with evidence *and* prevent them from rationalizing self-serving exceptions.  
    - **Resolution**: The theory must impose a **high burden of proof** (Requirement 4) and **endogenous correction** (Requirement 3). Evidence must be falsifiable *before* project completion (e.g., prototypes validating "cause excision").  

  - **Secondary Tension**: **Specificity vs. Robustness**  
    - Narrow mechanistic classes reduce sample size → high uncertainty. Broad outcome classes increase sample size → low relevance.  
    - **Resolution**: Use broad classes for calibration (e.g., "adjust your uncertainty range to 90th percentile of historical errors"), narrow classes for causal hypotheses.

  ---

  ### **Scorecard: Why Common Heuristics Fail**  
  | Heuristic                     | Fails Requirement(s)                          |  
  |-------------------------------|-----------------------------------------------|  
  | "Always defer if base rate exists" | 7 (novelty), 2 (mechanism), 6 (role)        |  
  | "Defer unless you have a mechanism" | 8 (conflates evidence with modesty)         |  
  | "Split the difference"        | 1 (ignores uncertainty), 6 (misuses roles)  |  
  | "Use narrowest reference class"| 5 (regress), 3 (endogeneity)                |  
  | "Outside view as sanity check"| 6 (undefined role), 4 (no burden of proof)  |  

  ---

  ### **Recommendation for Your Team**  
  1. **Map disagreements to requirements**:  
     - If your teammate rejects your causal model, invoke Requirement 4: demand evidence your "cause excision" is falsifiable and distinct from past claims.  
     - If they insist on "×3 base rate," invoke Requirement 6: should it be a point estimate or calibration tool?  
  2. **Run a premortem**: Treat the outside view as a calibration input (Requirement 6). Ask: "If we’re wrong, what did we miss? How does it match historical failure modes?"  
  3. **Decide under uncertainty**: If Requirements 2, 3, and 7 imply weak outside-view relevance, your inside view dominates. If not, adjust timelines to the 90th percentile of historical outcomes.  

  This framework doesn’t guarantee agreement, but it forces the debate onto testable grounds. The real takeaway: **In novel projects, the outside view’s highest value is calibrating confidence, not predicting outcomes.**
