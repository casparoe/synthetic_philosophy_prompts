  First, I need to understand the core of the dispute. The friend created a correspondence table mapping decision theory concepts to accuracy-first epistemology. For example, agent to believer, act to credence function, etc. His main points are that accuracy measures are like utility functions (subjective) and that dominance arguments only ensure coherence, not evidential norms. His three additional claims are about scoring rule disagreements, evidential filtering, and self-certification in expected accuracy.

  The user wants to maintain that accuracy is objective and non-pragmatic. They're open to conceding that the framework might not provide a complete epistemology but are firm on objectivity. They suspect the analogy might be misleading both sides.

  I should start by laying out the correspondence explicitly, highlighting where it holds and where it breaks down. Key disanalogies include the lack of voluntary control in belief formation, the absence of preferences shaping utility, and no causal dependence between belief and truth. These disanalogies challenge the friend's first conclusion that accuracy is merely a relabeled utility function. The objectivity comes from the alethic nature of truth, not subjective preferences.

  For the second conclusion about evidential norms, the disanalogy about control is relevant. Beliefs aren't chosen, so dominance arguments only address coherence, not what credences to adopt given evidence. This is a limitation, but it doesn't undermine probabilism; it just shows where the framework's scope ends. Evidential filtering (only scoring evidenced propositions) might break dominance, but that's because probabilism applies to the whole credence function, not subsets. So it doesn't threaten probabilism overall.

  Now, the friend's three claims: 
  1. Different scoring rules can disagree on expected accuracy for non-ideal credences. This is true due to sensitivity to different "epistemic virtues." 
  2. Evidential filtering can make incoherent credences non-dominated. Also true, but it highlights that coherence is a global requirement. 
  3. Expected accuracy minimization is self-certifying. Correct for coherent credences, but it's a feature for internal consistency, not a flaw. However, it requires external input (evidence) to shift credences.

  The user might need to consider supplementing accuracy-first with other elements for evidential norms, like chance-credence principles. The analogy isn't the only perspective; statistical decision theory or measurement theory could offer alternative foundations, emphasizing calibration or reducing error.

  In summary, the disanalogies protect the objectivity of accuracy but limit the framework's ability to provide full evidential norms. The friend's points are technically correct but don't collapse accuracy-first into pragmatism. The user can hold onto objectivity while acknowledging the need for additional elements beyond dominance arguments.
answer: |-
  Here's a systematic audit of the analogy, addressing your core concerns about objectivity and scope. The correspondence table reveals critical disanalogies that challenge your friend's conclusions, while his additional claims are partially correct but misapplied.

  ### Correspondence Table & Disanalogies
  | **Decision Theory (DT)**          | **Accuracy-First Epistemology (AFE)**       | **Correspondence Strength** | **Cost of Disanalogy** |
  |-----------------------------------|---------------------------------------------|-----------------------------|------------------------|
  | Agent                             | Believer                                    | Strong                      | None                   |
  | Available Acts                    | Candidate Credence Functions (CCFs)         | Strong (formal)             | **Crucial: Control**   |
  | State of the World                | Possible World                              | Strong                      | None                   |
  | Consequence (of act in state)     | Distance from Truth (of credence in world)  | Strong (formal)             | **Crucial: Nature of "Good"** |
  | Utility (assigned to consequence) | Accuracy Score (inverse of distance)        | Contested                   | **See Below**          |
  | Expected Utility Maximization     | Expected Accuracy Maximization              | Strong (formal)             | **Crucial: Self-Certification** |
  | Dominance                         | Accuracy Dominance                          | Strong (formal)             | None                   |
  | Preferences (over consequences)   | **NO DIRECT ANALOGUE**                      | **Empty Slot**              | **Undermines Subjectivity Claim** |
  | Voluntary Control (over acts)     | **NO DIRECT ANALOGUE**                      | **Empty Slot**              | **Limits Scope to Coherence** |
  | Causal Dependence (act → outcome) | **NO ANALOGUE** (Belief → Truth not causal) | **Empty Slot**              | Harmless (alethic goal) |
  | Interpersonal Utility Comparison  | **NO ANALOGUE**                             | **Empty Slot**              | Harmless (individual epistemic) |
  | Imprecise Utilities/Permissive Ties| **NO ROBUST ANALOGUE** (scoring rules constrain) | Weak                      | Harmless (objectivity) |

  ### Impact on Your Friend's Conclusions
  1. **"Accuracy = Utility (Subjective)" Conclusion Undercut**:  
     - **Key Disanalogies**:  
       - *Preferences Slot Empty*: Utility in DT is defined by revealed preferences (subjective/agent-relative). AFE has no analogue—accuracy is defined *alethically* (distance to mind-independent truth). Strict propriety isn't just coherence; it's a *consequence* of measuring alignment with truth (e.g., Brier score is derivable from squared Euclidean distance).  
       - *Control Slot Empty*: Acts in DT are chosen voluntarily based on preferences. Belief isn't voluntary—accuracy measures an *evaluative standard*, not a satisfaction of desires.  
     - **Why Objectivity Stands**: Accuracy measures are constrained by the *alethic goal* (truth-tracking). Admissible rules (e.g., Brier, Log) share core properties (strict propriety, truth-directedness) because they must respect the topology of truth values. Utility functions have no such external anchor.  

  2. **"Dominance Only Yields Coherence" Conclusion Partially Valid**:  
     - **Key Disanalogy**: *Control Slot Empty* → Dominance arguments *require* no preferences/volition, so they can establish a *necessary condition* (coherence) for rationality without specifying how credences are formed. This isn't a flaw—it correctly shows AFE's limitations.  
     - **Cost**: AFE *alone* cannot derive evidential norms (e.g., conditionalization). But this doesn't make it "pragmatic"; it simply isolates coherence as a *component* of rationality. Evidential norms require supplementing dominance with:  
       - Expected accuracy arguments (using *current* credences as input).  
       - Auxiliary principles (e.g., "Equivalence": same evidence → same credences).  

  ### Evaluation of Additional Claims
  1. **Scoring Rules Can Disagree on Imperfect Credences**:  
     - **Correct**. Different strictly proper rules (e.g., Brier vs. Log) can rank non-ideal CCFs differently in expected accuracy *relative to a fixed probability*. This reflects sensitivity to distinct "epistemic virtues" (e.g., robustness vs. sensitivity to extremes).  
     - **But**: This doesn't imply subjectivity. It shows that *full* epistemic justification requires more than coherence (e.g., sensitivity to evidence), not that accuracy isn't objective.  

  2. **Evidential Filtering Breaks Dominance**:  
     - **Correct**. If you score *only* propositions in your evidence set, incoherent CCFs may be non-dominated. Example: Assign credence 0.6 to *P* and 0.6 to *¬P*; if only *P* is evidenced, no probabilistic CCF dominates it *on P alone*.  
     - **However**: This doesn't threaten probabilism. AFE assumes credences are defined over an *entire algebra*. Filtering is a misapplication—probabilism is a global consistency norm. Dominance holds when *all propositions* are scored.  

  3. **Expected Accuracy Minimization is Self-Certifying**:  
     - **Partially Correct**. A coherent CCF minimizes expected inaccuracy *by its own lights*. But:  
       - This is a *feature* (internal consistency), not a bug.  
       - It doesn't imply you should "keep your credences." New evidence changes the probability distribution used for expectation (via conditionalization), leading to new minima.  
     - **Critical Limit**: Self-certification *alone* can't force credence changes. To get evidential norms, you need:  
       - *Inputs*: Constraints from evidence (e.g., via chance-credence principles).  
       - *Dynamics*: Arguments that *updating* minimizes *future* expected inaccuracy.  

  ### Replacing the Action Analogy: Better Frameworks
  The decision-theoretic analogy is useful but overextended. Prefer:  
  - **Statistical Decision Theory/Loss Functions**: AFE is closer to *forecasting evaluation*. Scoring rules are *loss functions* for truth-reporting. Objectivity comes from the *public, intersubjective* nature of truth (like statistical "true parameters").  
  - **Calibration & Sharpness**: Split accuracy into:  
    - *Calibration*: Credence matches truth-frequency (e.g., 70% of P=0.7 propositions are true).  
    - *Sharpness*: Willingness to make extreme predictions.  
    Strictly proper rules balance both, avoiding subjectivism.  
  - **Measurement Theory**: Credences as *estimators* of truth values (1/0). Accuracy is *mean squared error*; coherence is the requirement that estimators are non-contradictory.  

  ### Conclusion: What You Can Keep
  - **Objectivity**: The disanalogies (empty preferences/control slots, alethic goal) protect accuracy's objectivity. Utility is preference-dependent; accuracy is truth-dependent.  
  - **Non-Pragmatic Vindication**: Dominance arguments don't appeal to preferences or practical goals—they show incoherence is *alethically self-defeating*.  
  - **Cost**: AFE needs supplementation (e.g., evidence-handling norms) for a "complete" epistemology, but this is true of all foundational programs.  
  - **Your Friend's Error**: Conflating *formal similarity* with *identity of foundations*. DT's "utility" is defined by the agent; AFE's "accuracy" is defined by the world. The analogy holds only *after* the epistemic goal is set.  

  **Recommendation**: Defend objectivity via the alethic disanalogies and measurement-theoretic framing. Concede that dominance alone yields only coherence—but argue this is a virtue (it isolates a core norm). For evidential norms, embrace expected accuracy *plus* evidence-credence linking principles (e.g., the Principal Principle).
