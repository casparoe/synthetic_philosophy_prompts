  Hmm, this is refreshingly complex. The user clearly knows their stuff: they've pre-empted predictable arguments by excluding settled cases (homosexuality/prostitution), designed three novel test cases (segregated spectacle, seepage variant, minority test), and added the assurance argument wrinkle. Their demand for a signature-ready joint statement with strict formatting (headline, agreements, residual disagreements table, cruxes) suggests they want students to engage with meta-disagreement structures, not just substance.

  The real challenge is threading the needle between:
  - Making agreements substantive enough that they'd actually require concession (e.g., getting the liberal to admit law's constitutive power in limited contexts)
  - Keeping residual disagreements authentically framed (no "straw-man neutrality")
  - Handling the minority test without letting either side weaponize it
  - Untangling whether the constitutive/causal distinction collapses under the assurance argument

  *scratches head* The seepage variant is especially tricky—both parties will dance around causation. And the minority test... ah! That's where the constitutive moralist might blink. If a norm dissolves when not enforced, is it really constitutive? The liberal will pounce there. 

  For the headline agreement: Focus on the assurance argument. It's where their theories tango—the moralist sees declaration as identity-forming, the liberal sees it as mere signaling. Getting them to agree that declaratory law has unique assurance-restoring properties (even if they disagree on why) would be a real coup.

  *checks notes* Must remember: No named theorists, no verdicts, no history lessons. And absolutely no vacuous agreements—every point must cost someone something. The table of disagreements needs mirror phrasing that both sides would endorse as fair. 

  *deep breath* Time to draft. Starting with that headline...
answer: |-
  **Joint Statement of Adversarial Collaboration: Constitutive Moralism and Concessive Hartian Liberalism**

  **Headline Result:** Both parties agree that declaratory criminal law possesses a unique capacity to restore assurance in the conditional compliance essential for core social norms, and that this function cannot be replicated by non-legal institutions without incurring prohibitive social costs or sacrificing essential liberal values.

  **Section 1: Agreed Claims**
  1.  **Formal Disagreement:** The dispute centers on whether the *criminal law’s expressive function* in declaring communal norms is *constitutive* of a society’s shared moral identity (Party A) or merely a redundant, ineffective, or counterproductive *signal* of a pre-existing positive morality sustained by non-legal means (Party B).
  2.  **Success Condition for Moralism:** For Party A's constitutive moralism to justify criminalization in a given case, it must demonstrate that legal prohibition is necessary *not* to causally *prevent* moral disintegration, but to *sustain the very existence* of the specific shared moral commitment as a constitutive element of the society’s identity. Mere correlation between law and morality is insufficient.
  3.  **Liberal Concession:** Party B concedes that a substantial, stable, and largely shared positive morality is a necessary precondition for a minimally decent and functional society, and that this shared morality includes norms whose observance by individuals is often genuinely conditional on the perceived compliance of others (assurance problem).
  4.  **The Segregated Spectacle (Case i):** Neither party endorses criminalization in this case. Party A concedes that mere visceral disgust, absent harm or a constitutive link to core social identity, is insufficient justification for legal enforcement. Party B concedes that the practice’s offensiveness, while irrelevant to harm-based criminalization, remains a legitimate subject of social and non-legal moral criticism.
  5.  **The Seepage Variant (Case ii):** Both parties agree that the observed correlation (reduced compliance with honesty/mutual aid following acceptance of the spectacle) is insufficient evidence to support criminalization. Party A cannot claim it demonstrates constitutive linkage without evidence the spectacle’s acceptance *changed the meaning or status* of the honesty/mutual aid norms themselves. Party B cannot dismiss the correlation as irrelevant to social stability without an alternative explanation.
  6.  **The Minority Test (Case iii):** Both parties accept the minority test as a necessary (though not necessarily sufficient) filter for eligible moral convictions. A norm fails this test if its adherents, upon becoming a small, powerless minority, would abandon the conviction or cease desiring its legal enforcement. Party A concedes that norms failing this test cannot be constitutive of a *stable* societal identity. Party B concedes that norms passing this test represent the most plausible candidates for being deeply embedded elements of a society’s shared morality.
  7.  **The Assurance Argument (Function):** Both parties agree that widespread perception of open, tolerated flouting of a norm can degrade the assurance necessary for widespread conditional compliance with that norm.
  8.  **The Assurance Argument (Law's Role):** Both parties agree that a declaratory criminal law is an especially *effective and reliable* institutional device for publicly affirming a norm and thereby restoring the perception of communal commitment necessary for assurance. Its formality, publicity, and association with communal authority make it uniquely potent for this specific function compared to non-state signals.
  9.  **The Assurance Argument (Non-Legal Alternatives):** Both parties agree that non-legal institutions (e.g., vigorous social condemnation, community shaming, religious pronouncements) *could, in principle*, perform the assurance-restoring function of declaratory criminal law. However, both parties also agree that relying solely on such mechanisms in contemporary, diverse societies would be either significantly less reliable, incur significantly higher social costs (e.g., fostering vigilantism, social fragmentation, intrusive community surveillance), require illiberal levels of social conformity pressure unacceptable to Party B, or fail to achieve the requisite level of *communal* (as opposed to sub-group) affirmation required for society-wide assurance.

  **Section 2: Residual Disagreements**

  | Disagreement Description (Party A - Constitutive Moralism)                  | Disagreement Description (Party B - Concessive Hartian Liberal)              |
  | :-------------------------------------------------------------------------- | :-------------------------------------------------------------------------- |
  | 1. The criminal law’s declaration of a norm is partly constitutive of the shared social morality; withdrawing legal prohibition dissolves that norm as a component of the society’s *shared* identity. | 1. The criminal law’s declaration merely reflects or signals a pre-existing shared social morality; withdrawing legal prohibition reflects a prior change in that shared morality or the judgment that enforcement is counterproductive, but does not dissolve the norm itself. |
  | 2. The unique effectiveness of criminal law in restoring assurance described in (Agreement 8) stems precisely from its constitutive role; its declaratory force *is* the act of communal self-definition that sustains the norm. | 2. The unique effectiveness of criminal law in restoring assurance described in (Agreement 8) is a function of its salience and authority as a state signal, not constitutive power; the underlying norm’s strength and communal adherence exist independently of legal declaration. |
  | 3. Passing the Minority Test (Agreement 6) indicates a norm is a *candidate* for being constitutive of societal identity; legal enforcement may be necessary to actively *sustain* it as constitutive in the face of challenge or change. | 3. Passing the Minority Test (Agreement 6) indicates a norm is deeply embedded in the positive morality sustained by non-legal means; legal enforcement adds nothing to sustaining it and risks ossification or backlash. |
  | 4. The potential social costs of non-legal assurance mechanisms (Agreement 9) are often *less* damaging to core liberal values (e.g., pluralism, individual liberty from state coercion) than the alternative of moral disintegration through loss of constitutive norms. | 4. The potential social costs of non-legal assurance mechanisms (Agreement 9) are *inherently more* damaging to core liberal values (e.g., privacy, freedom of conscience, protection from mob rule) than forgoing legal enforcement of non-harmful norms, even if assurance is somewhat reduced. |

  **Section 3: Cruxes**
  1.  **The Constitutive Causation Crux**
      *   **Question:** Does the act of decriminalizing a previously prohibited practice (that passes the minority test) *cause* a change in the *shared social understanding* of the norm's status and authority, or merely *reflect* a change that occurred through non-legal social processes?
      *   **Bearing Evidence:** A detailed historical/sociological study of a society that decriminalized a non-harmful, deeply held norm (passing the minority test pre-decriminalization) specifically examining shifts in (a) the perceived *authoritativeness* of the norm (not just compliance levels), (b) its perceived status as a *shared* communal commitment, and (c) the causal narratives offered by members for the change, *independent* of changes in material conditions or other major social upheavals.
      *   **Party A Prediction:** The study will show decriminalization led to a significant, widespread shift in the perception of the norm’s status and authority as a shared moral commitment within a generation, attributable primarily to the legal change itself weakening its perceived constitutive foundation.
      *   **Party B Prediction:** The study will show decriminalization followed, rather than caused, a shift in perceived norm status and authority driven by non-legal social discourse; or where decriminalization occurred first, it had negligible independent impact on norm status compared to concurrent social changes, and the norm's perceived communal authority declined only if non-legal support mechanisms also weakened.
      *   **Unexpected Result:** Significant norm status decline *caused* by decriminalization in the absence of any weakening non-legal support, *or* robust maintenance of norm status and authority despite decriminalization even as non-legal support demonstrably weakened.

  2.  **The Assurance Substitution Crux**
      *   **Question:** Can non-legal institutions reliably restore assurance for core conditional compliance norms *to the same level* as declaratory criminal law, without resorting to practices that violate fundamental liberal commitments (e.g., pervasive social surveillance, intense group pressure suppressing dissent, de facto ostracism)?
      *   **Bearing Evidence:** Empirical studies comparing assurance levels (measured via trust surveys, behavioral experiments like public goods games) regarding a specific, vital conditional compliance norm (e.g., tax honesty, jury duty) in otherwise similar jurisdictions: one relying solely on declaratory criminal law and standard enforcement, the other relying solely on vigorous, organized non-legal mechanisms (e.g., community accountability networks, prominent public shaming campaigns) while *explicitly decriminalizing* the behavior.
      *   **Party A Prediction:** The jurisdiction relying solely on non-legal mechanisms will show significantly lower levels of assurance and/or observable compliance, or will achieve comparable assurance only through documented practices widely perceived as illiberal (e.g., intrusive monitoring, severe social sanctions).
      *   **Party B Prediction:** The jurisdiction relying solely on well-designed non-legal mechanisms can achieve assurance and compliance levels comparable to the criminal law jurisdiction without resorting to systematically illiberal practices, potentially at the cost of higher organizational effort but not fundamental rights.
      *   **Unexpected Result:** Non-legal mechanisms achieve *higher* assurance without illiberalism, *or* criminal law proves completely ineffective at generating assurance in the specific context studied.

  3.  **The Seepage Direction Crux**
      *   **Question:** In the Seepage Variant (Case ii), does acceptance of the Segregated Spectacle *cause* a weakening of compliance with unrelated norms (honesty/mutual aid), or are both the acceptance of the spectacle and the reduced compliance symptoms of a prior, independent weakening of the underlying social-moral fabric?
      *   **Bearing Evidence:** Longitudinal panel studies tracking individuals' attitudes and (self-reported/observed) behaviors regarding both the Segregated Spectacle and unrelated norms (honesty/mutual aid), combined with analysis of broader social indicators of moral cohesion, to establish temporal precedence and control for confounding variables.
      *   **Party A Prediction:** Acceptance of the spectacle will be temporally prior to, and a significant predictor of, subsequent decline in compliance with honesty/mutual aid norms, even controlling for other factors, suggesting its acceptance erodes the constitutive foundation of shared morality.
      *   **Party B Prediction:** Changes in compliance with honesty/mutual aid norms will be temporally prior to or concurrent with acceptance of the spectacle, and both will be strongly predicted by prior indicators of weakening non-legal normative transmission (e.g., declining community engagement, weakening religious institutions, rising individualism).
      *   **Unexpected Result:** Acceptance of the spectacle significantly predicts *increased* compliance with unrelated norms, *or* no measurable relationship exists after rigorous controls.

  **Note on Verbal/Substantive Distinction:** The collaboration revealed that the dispute over the "constitutive" claim often hinges on the definition of "shared social morality." If "shared social morality" refers strictly to the empirical set of beliefs and attitudes held by individuals (Party B's focus), the constitutive claim appears unsupported and collapses into a contested causal claim about law shaping attitudes. However, if "shared social morality" refers to the *publicly recognized and authoritative normative framework* of the society (Party A's focus), the claim that legal declaration plays a constitutive role in establishing and sustaining *that framework* remains a distinct, substantive claim about the function of law in shaping social reality, independent of direct causal effects on individual beliefs. The core substantive disagreement thus persists over whether law's role in defining the public normative framework is essential to social cohesion (A) or merely epiphenomenal to non-legal processes (B).
