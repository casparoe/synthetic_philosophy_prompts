prompt: |-
  Our reading group (a therapist, a retired classics teacher, a data scientist, and me) has been going in circles for a month about what emotions actually *are*, and I got stuck writing the "what question are we even asking" document for week one, so I'm asking you to write the hard part of it. The problem is that everyone has exactly one case they take to be decisive: the therapist keeps coming back to a client who knows perfectly well the spider is plastic and is still terrified of it, and says this kills the "emotions are judgments" view; the classics teacher keeps pointing out that people genuinely grieve at the death of characters who never existed, and thinks that kills anything that requires a real particular object; the data scientist says emotions can't be private inner episodes at all because he can predict them from behavioural traces better than people can report them. I don't think any of those arguments settle anything, because nobody has said what a theory would have to get right in the first place. So: give me the desiderata list for a theory of what emotions are, numbered, each with the case or consideration that makes it a requirement rather than a taste, and each marked negotiable or non-negotiable.

  I have my own pile of cases that I want represented or explicitly ruled out, and honestly half of my hope is that you'll tell me some of them are not the theory's job. (1) Emotions seem assessable — you can ask whether the fear was apt or the anger was out of proportion — so a theory has to say what correctness consists in, and I want to know whether that's really a requirement or just a prejudice of the judgment camp. (2) Recalcitrance: the plastic-spider case, but also the reverse, where someone's affect lags behind their own considered view for months and then catches up. (3) Emotions you can be *talked* out of but not *decided* out of, which seems to demand a weird intermediate status between belief and itch. (4) My friend with a rare condition that badly blunts her visceral feedback, who says she still knows she's anxious because of what she starts doing — rehearsing conversations, checking the door twice — and I don't know whether that's a counterexample to the bodily-feeling family or just a case of the evidence being rewritten. (5) Emotions with diffuse or missing objects: ambient dread about something huge and statistical that no single action would address, "nostalgia" for a trip that hasn't happened yet, relief about an outcome that was never really on the cards. (6) Emotions whose object is another emotion of your own — being ashamed of being jealous, being annoyed at yourself for still being frightened — and whether that recursion causes trouble for any of the three usual families. (7) A dog's fear, a pre-verbal infant's distress, and whether a theory is allowed to exclude those by fiat or has to earn the exclusion. (8) Emotions as things that can be *educated* — people who learn to feel indignation at something they used to accept quietly, which is the bit I personally care about most, since my real interest is whether emotions can be reasons for action and whether they can be better or worse in something like an epistemic sense.

  Two more things I specifically want. First: I strongly suspect some pairs on your list can't be jointly satisfied — "emotions are bodily feelings" and "emotions can be apt or inapt" feel like they pull apart, and "emotions require conceptually structured content" and "infants have emotions" too — so flag the tensions, say which requirement does the most work in knocking candidates out, and tell me if the list itself is the interesting result here. Second: score the three families very briefly against the list (the judgment view, the perception-of-evaluative-properties view, the bodily-feeling/constructionish view) — a few lines each is plenty, I'll do the arguing with the group myself. And as I said, I'd also like you to say plainly which of my cases a theory is entitled to set aside as not really emotions at all, and what principle licenses setting them aside rather than it being special pleading. Skip the reading list, I can google.
reasoning: |-
  Okay, let me tackle this query systematically. The user is part of a reading group struggling to define emotions, with each member bringing decisive counterexamples: a therapist with plastic spider fear, a classics teacher with fictional grief, and a data scientist with emotion prediction from behavioral traces. The user wants a structured desiderata list for emotion theories, with each requirement justified by specific cases and marked negotiable/non-negotiable.

  First, I need to parse the core request: creating evaluation criteria for emotion theories. The user emphasizes that current debates are circular because there's no shared framework. Their hidden hope is to determine which of their personal cases (1-8) are legitimate tests for theories versus outliers that can be excluded.

  The key challenges I see are:
  - Balancing philosophical rigor with psychological validity
  - Acknowledging tensions between desiderata (e.g., assessability vs bodily feelings)
  - Handling edge cases like non-human emotions or recursive emotions
  - Addressing the user's interest in emotional educability and normative dimensions

  Starting with desiderata, I consider these non-negotiables based on the group's cases:
  1. **Non-conceptual content** (plastic spider/fictional grief cases) - emotions must function without propositional judgments
  2. **Object-directedness** (fictional grief) - requires intentionality even without real objects
  3. **Public observability** (data scientist's prediction success) - emotions must leave behavioral traces
  4. **Motivational force** (therapist's cases) - emotions must drive action regardless of belief

  For negotiable items:
  5. **Assessability** (user's case 1) - theories should explain normative dimensions but might handle it differently
  6. **Recalcitrance** (plastic spider/lag cases) - crucial test but implementation varies
  7. **Educability** (user's case 8) - important but may be secondary to core mechanisms

  The user's additional cases get categorized:
  - Visceral feedback cases (4) test but don't refute bodily theories
  - Diffuse objects (5) and recursive emotions (6) are stress tests for intentionality
  - Non-human emotions (7) are boundary markers requiring principled exclusion
  - Educability (8) is central to the user's interests but may be emergent rather than fundamental

  Major tensions emerge:
  - Assessability (#5) conflicts with non-cognitive theories (e.g., bodily feelings can't be "apt")
  - Infant/dog emotions (#7) challenge conceptual content requirements
  - Motivational force (#4) vs object-directedness (#2) in diffuse emotion cases

  Theory evaluations:
  - Judgment theories fail plastic spider/fictional grief cases
  - Perception theories handle recalcitrance but struggle with assessability
  - Bodily/constructionist views excel with behavioral prediction but falter on normative dimensions

  I conclude that the desiderata list itself reveals why debates stall: competing requirements reflect different facets of emotion. The user's educability concern (#8) might be addressed through hybrid approaches where emotions incorporate learned patterns. For exclusions, theories can legitimately set aside non-intentional states (e.g., moods without objects) or non-motivational responses if they define emotions as action-oriented systems.
answer: |-
  Here is a **desiderata list for a theory of emotion**, structured to address your group's impasse. Each requirement is justified by a decisive case or consideration from your group or your own list, marked negotiable (N) or non-negotiable (NN), with tensions flagged. I then score the three families and address which cases a theory can exclude.

  ---

  ### **Core Desiderata for a Theory of Emotion**  
  *(NN = failure here disqualifies the theory; N = theory can partially satisfy or explain away)*  

  1. **Non-conceptual content** (NN)  
     *Requirement*: Emotions must not *depend* on propositional judgments or beliefs.  
     *Case*: Therapist’s plastic spider (knows it’s fake, still terrified).  
     *Why NN?*: Prototypical emotions occur without rational assent. A theory requiring conceptual judgment fails this.  

  2. **Object-directed intentionality** (NN)  
     *Requirement*: Emotions must be *about* something (even non-existent, abstract, or diffuse).  
     *Case*: Classics teacher’s grief for fictional characters.  
     *Why NN?*: Emotions lack meaning without intentional objects. Theories requiring *real* particular objects fail.  

  3. **Publicly observable correlates** (NN)  
     *Requirement*: Emotions must have detectable behavioral/physiological signatures.  
     *Case*: Data scientist’s prediction from behavioral traces > self-report.  
     *Why NN?*: If emotions were purely private, science couldn’t study them.  

  4. **Motivational force** (NN)  
     *Requirement*: Emotions must drive or incline toward action (even if suppressed).  
     *Case*: Your friend’s anxiety manifesting as rehearsing conversations (Case 4).  
     *Why NN?*: Emotions without motivational thrust (e.g., passive moods) blur into non-emotional states.  

  5. **Recalcitrance compatibility** (N)  
     *Requirement*: Theory must explain emotions persisting/changing independently of belief.  
     *Case*: Plastic spider fear (recalcitrant) + lagging affect catching up (Case 2).  
     *Why N?*: Recalcitrance is central but negotiable in *how* it’s explained (e.g., via subsystems).  

  6. **Assessability** (N)  
     *Requirement*: Emotions must admit of normative evaluation (apt/disproportionate).  
     *Case*: Anger being "out of proportion" (Case 1).  
     *Why N?*: Not all theories make norms intrinsic (e.g., constructivism treats norms as imposed).  

  7. **Recursive capacity** (N)  
     *Requirement*: Theory must accommodate emotions about emotions (e.g., shame about jealousy).  
     *Case*: Being annoyed at your own fear (Case 6).  
     *Why N?*: Recursion may be emergent (not core to emotion’s basic structure).  

  8. **Educability** (N)  
     *Requirement*: Emotions must be capable of refinement (e.g., learning indignation).  
     *Case*: Learning to feel outrage at injustice (Case 8).  
     *Why N?*: Educability may be a higher-order feature of cognitive scaffolding.  

  9. **Developmental continuity** (N)  
     *Requirement*: Theory should not exclude infants/dogs by fiat.  
     *Case*: Pre-verbal infant distress (Case 7).  
     *Why N?*: A theory *can* exclude these if it defines emotions as requiring conceptual content (but must justify).  

  ---

  ### **Tensions Between Desiderata**  
  - **Biggest conflict**: *Assessability (#6) vs. Non-conceptual content (#1)*. If emotions aren’t judgments (#1), how can they be "apt"? Tension knocks out pure judgment theories.  
  - **Secondary conflict**: *Object-directedness (#2) vs. Diffuse objects (#5)*. Ambient dread challenges theories requiring specific objects.  
  - **Knockout power**: #1 (Non-conceptual content) and #3 (Public observables) do the most work. They force theories to reconcile feeling with function.  
  - **The list *is* the result**: Conflicts explain why no monolithic theory satisfies everyone. Hybrid approaches are likely needed.  

  ---

  ### **Scoring the Three Families**  
  *(✓ = Satisfies, ✗ = Fails, ~ = Partial)*  

  1. **Judgment View** (e.g., Solomon, Nussbaum)  
     - ✓ #6 (Assessability), #8 (Educability)  
     - ✗ #1 (Plastic spider), #3 (Data scientist’s traces), #7 (Infants/dogs)  
     - *Verdict*: Fails non-negotiables. Treats emotions as beliefs, but cases show they aren’t.  

  2. **Perception of Evaluative Properties** (e.g., Tappolet, De Sousa)  
     - ✓ #1 (Non-conceptual), #2 (Fictional grief), #6 (Assessability)  
     - ~ #4 (Motivation: needs added mechanism), #5 (Recalcitrance: possible but strained)  
     - ✗ #3 (Observables: treats emotions as inner "seeings")  
     - *Verdict*: Strong on intentionality/norms, weak on public correlates.  

  3. **Bodily Feeling/Constructionist View** (e.g., James, Barrett)  
     - ✓ #1 (Plastic spider), #3 (Data traces), #4 (Action tendencies)  
     - ~ #2 (Objects: constructivists say objects are "made"), #7 (Infants: prioritizes physiology)  
     - ✗ #6 (Assessability: bodily states aren’t "apt"; norms are external)  
     - *Verdict*: Best for science/recalcitrance, weakest on normativity.  

  ---

  ### **Which Cases Can a Theory Exclude?**  
  A theory can exclude states that **lack intentional objects and motivational force** (Desiderata #2, #4). This is not special pleading; it defines emotions versus moods/sensations.  
  - **Excludable**:  
    - Diffuse dread without *any* object (Case 5). *Principle*: No intentional object → not an emotion (e.g., a mood).  
    - "Nostalgia for a trip not taken" (Case 5). *Principle*: If wholly imaginary *and* no action-tendency, it’s a desire/fantasy.  
  - **Not excludable**:  
    - Visceral blunting (Case 4): Still has motivation → valid emotion.  
    - Recursive emotions (Case 6): Meta-emotions are emotions.  
    - Infant/dog fear (Case 7): Exclude only if theory explicitly requires conceptual content *and* justifies why.  

  ---

  ### **Conclusion**  
  Your group’s cases reveal **emotions as hybrid phenomena**: bodily states with aboutness, assessable but not intellectual, observable yet subjective. No single-family theory wins; **constructionism** handles most non-negotiables but stumbles on normativity, while **perceptual theories** best explain object-directedness and assessability but lack scientific traction. Your key interest—emotions as reasons for action (#8)—requires marrying #4 (motivation) and #6 (assessability), suggesting a perception- or practice-based hybrid.  

  For your document: Frame desiderata as **boundary conditions** (e.g., "A theory must explain plastic-spider fear without requiring belief"). This forces clarity on what counts as a "kill case."
