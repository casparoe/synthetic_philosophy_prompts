answer: |-
  Below is a decision tree designed to classify views on the units of selection based on concrete cases, avoiding labels. It starts from a shared premise and branches through 10 yes/no questions about scenarios. The tree includes your four required cases and covers the specified leaves. **Read each question carefully and answer based solely on the scenario described.**  

  ---

  ### **Start**: We agree on a population of entities that:  
  - Vary in traits  
  - Leave different numbers of descendants  
  - Show changes in trait frequencies over time  

  ---

  #### **Node 1: Sterile Worker Case**  
  *Scenario: A sterile worker ant dies defending its colony of close kin. The colony survives and produces more offspring colonies.*  
  **Question**: If colonies **could not produce new offspring colonies** (only individual ants within colonies reproduced), would the worker’s self-sacrificing trait still spread?  
  - **Yes** → Go to Node 2  
  - **No** → Go to Node 3  

  #### **Node 2: Kin vs. Gene’s-Eye**  
  *Scenario: A meiotic-drive allele spreads in a population. Males carrying it are half-sterile, but the allele biases its own transmission.*  
  **Question**: Does the allele spread **only** because it benefits itself, even when it harms individual fitness?  
  - **Yes** → Go to Node 4  
  - **No** → Go to Node 5  

  #### **Node 3: Group Reproduction Necessity**  
  **Question**: For groups (like colonies) to be units of selection, must they **form parent-offspring lineages** (e.g., colonies produce new colonies)?  
  - **Yes** → Go to Node 6  
  - **No** → Go to Node 7  

  #### **Node 4: Cancer Case**  
  *Scenario: A cancer cell lineage outcompetes other cells in a body, but kills the body (and itself).*  
  **Question**: Is the cancer lineage a unit of selection **during its spread** (before the body dies)?  
  - **Yes** → **Leaf: Gene’s-eye selectionism**  
  - **No** → Go to Node 8  

  #### **Node 5: Kin Selection Core**  
  **Question**: Does the sterile worker’s behavior spread **purely because relatives share its genes** (regardless of group structure)?  
  - **Yes** → **Leaf: Kin selection / Inclusive fitness**  
  - **No** → Go to Node 7  

  #### **Node 6: Colonial Germline Case**  
  *Scenario: Colonial species recruits next season’s germline from whichever cell lineage wins an internal competition. Colonies with less competitive lineages produce more propagules.*  
  **Question**: Can the competitive cell lineage spread **even if it reduces colony-level reproductive output**?  
  - **Yes** → **Leaf: Multilevel selection (trait-group style)**  
  - **No** → **Leaf: Multilevel selection (groups-as-individuals)**  

  #### **Node 7: Meiotic Drive Revisited**  
  *Scenario: Same meiotic-drive allele as Node 2.*  
  **Question**: Does the allele’s spread **require explaining harm to individuals** as a consequence of lower-level selection?  
  - **Yes** → Go to Node 9  
  - **No** → Go to Node 10  

  #### **Node 8: Cancer as Pathology**  
  **Question**: Is the cancer lineage **not a unit of selection** because its "fitness" is ephemeral (it dies with the body)?  
  - **Yes** → **Leaf: Darwinian individuals/populations**  
  - **No** → **Leaf: Gene’s-eye selectionism**  

  #### **Node 9: Colonial Conflict Case**  
  *Scenario: Same colonial species as Node 6.*  
  **Question**: Is the within-colony cell competition **irreducibly a separate level of selection** from between-colony selection?  
  - **Yes** → **Leaf: Major-transitions/hierarchy view**  
  - **No** → **Leaf: Deflationary (bookkeeping partition)**  

  #### **Node 10: Group Effects**  
  **Question**: Can group-level traits (e.g., colony defense) be explained **entirely by aggregation of individual traits**?  
  - **Yes** → **Leaf: Deflationary (bookkeeping partition)**  
  - **No** → **Leaf: Multilevel selection (trait-group style)**  

  ---

  ### **Leaf Descriptions**:  
  1. **Gene’s-eye selectionism**: Selection acts on alleles/gene variants; higher-level effects are byproducts.  
  2. **Kin selection / Inclusive fitness**: Fitness includes effects on relatives; no group selection needed.  
  3. **Multilevel (trait-group)**: Selection acts at multiple levels, but groups need not reproduce (only aggregate effects).  
  4. **Multilevel (groups-as-individuals)**: Groups must reproduce as lineages to be units (e.g., colony fission).  
  5. **Major-transitions/hierarchy view**: New units evolve by suppressing lower-level conflict (e.g., cells in bodies).  
  6. **Darwinian individuals/populations**: Units require heritable variation in fitness; transient entities (cancer) don’t qualify.  
  7. **Deflationary**: All frameworks are mathematically equivalent; "units" are arbitrary partitions.  

  ---

  ### **Analysis**:  
  - **Unoccupied combinations**: None. All answer paths map to a leaf.  
  - **Indistinguishable leaves**: The **deflationary** and **trait-group multilevel** leaves sometimes converge (e.g., Node 10). Deflationists may also reach Node 9 ("no") or Node 10 ("yes").  
  - **Unexplored views**: No coherent view denies both gene-level spread (Node 2) and kin selection (Node 5) while requiring group reproduction (Node 3). This is likely unattractive, as it struggles with sterility/meiotic drive.  
  - **Key insight**: The tree branches on **empirical claims** (e.g., "Does trait X spread without condition Y?") rather than labels.  

  Print this tree and walk through it with your friend. Answer each question *based on the case*, and see where your views diverge!
