answer: |-
  Here’s a complete exam package tailored to your specifications — provocative, philosophically substantive, and avoiding parody. Dr. Vasa’s voice is weary but precise, with a hint of deflationary skepticism.

  ---

  ### **Final Exam Question: PHIL 410 - Intuition, Culture and the Limits of the Armchair**  
  **Time Allowed: 90 Minutes**  
  **Answer ONE Question**  

  > **Question 1:**  
  > The Kalu case describes a village where speakers use "Kalu" to refer to a fictional character, though all stories told about "Kalu" are accidentally true of Kofi (an unknown historical figure). Surveys reveal systematic disagreement: one population judges that a villager saying "Kalu was unlucky" is *about Kofi*, while another denies this. Crucially, both groups agree on a control case (e.g., whether Ama knows her keys are in the drawer when no defeaters intervene).  
  >   
  > Grant the *bridle* constraint: any explanation for the Kalu divergence (e.g., miscomprehension, pragmatic factors) must *not* predict similar divergence in the control case.  
  >   
  > **Does the bridled disagreement in the Kalu case furnish evidence that should revise philosophical theories of reference? Or does it instead undermine the project of treating folk intuitions as evidence for such theories?**  
  > Defend *one* position. Whichever you choose, specify: (a) what empirical finding *would* change your mind, and (b) why that finding meets the bridle constraint.  

  *(Exam continues with two other unrelated questions)*  

  ---

  ### **Model Answer (Dr. Vasa’s "Target Response")**  
  **Approx. 710 words**  

  The bridled disagreement in the Kalu case *undermines* the evidential use of folk intuitions in theorizing reference, without directly revising theories of reference themselves. It exposes a methodological instability that surveys cannot resolve, rendering the divergence philosophically inert.  

  Start with the data: Group A treats "Kalu" as referring to Kofi (the causal source of the stories); Group B treats it as non-referential or fictional. The control agreement shows both groups grasp simple epistemic cases identically. The bridle forces us to reject "shallow" explanations for the split: if Group B misread the vignette, why not misread the keys case too? If cultural politeness ("we don’t say untrue things about real people") caused Group B’s denial, why no equivalent politeness in the perceptual case? We thus confront *genuine* intuitive disagreement about reference under identical comprehension.  

  This divergence cannot revise theories of reference (e.g., descriptivist vs. causal-historical) because it fails to arbitrate between them. Suppose Group A’s "yes" supports causal theories (the name hooks to Kofi via the story-chain). But Group B’s "no" doesn’t clearly support descriptivism; they might deny *any* referent exists, treating "Kalu" as a pseudo-name. The data maps ambiguously onto theoretical binaries. More damningly, the bridle reveals that whatever drives the divergence — call it *referential elasticity* — is a variable *pre-theoretic bias*, not a stable intuition about the nature of reference. Like perceptual illusions that vary across observers without revising optics, this variation reflects cognitive noise, not metaphysical insight. The real lesson is that "intuitions" about reference are scaffolded by implicit contextual or cultural assumptions invisible in vignettes.  

  Does this variation *itself* challenge theories? Only if we assume intuitions *must* converge under ideal reflection — a dogma the control case destabilizes. We agree about keys because perceptual knowledge attribution is evolutionarily and socially scaffolded; reference is not. The variation thus signals that reference lacks robust intuitive anchors, making folk judgments unreliable guides.  

  **But what of experts?** One might argue philosophers’ trained intuitions escape this noise. This isn’t the lazy "only experts count" move, but a claim about calibration: expertise filters out distractors (e.g., ignoring fictional framing). Yet expertise risks circularity. If experts "intuit" causal-historical reference, is this because they’re trained on Kripke? The Kalu divergence persists among philosophy students, suggesting expertise doesn’t eliminate elasticity — it normativizes one response. Worse, if we *only* consult experts, we conflate "what reference is" with "what our canon says it is." The bridle makes this vivid: if experts *disagreed* about Kalu but agreed on keys, their intuitions would be equally suspect. Expertise doesn’t magically transmute bias into evidence; it must earn its status by showing convergence is driven by truth-tracking, not dogma.  

  **What would change my mind?** If we discovered a *bridle-compatible invariant*: e.g., a culture where speakers deny Kalu refers to Kofi *but also* systematically deny knowledge in the keys case (e.g., "Ama can’t know — keys could vanish!"). This would suggest a deeper epistemic divergence, making the Kalu split diagnostic of a rival *theory* of reference/meaning. But if the control holds, variation remains local noise.  

  **Settled vs. Contested:**  
  - **Settled:** The existence of cross-cultural intuitive variation about cases like Gödel/Schmidt or Kalu is empirically robust (though its magnitude is debated).  
  - **Settled:** The "WEIRD sample" critique is exhaustingly familiar; serious x-phi now uses diverse samples.  
  - **Contested:** Whether variation is "noise" (undermining evidence) or "signal" (revealing pluralism) — I side with noise.  
  - **Contested:** Whether expert filtering is legitimate. I’m skeptical (circularity risk), but some pragmatists accept it as "reflective equilibrium in practice."  
  - **Contested:** The bridle itself! Some argue control cases *can’t* be this clean — all vignettes are theory-laden.  

  Ultimately, the Kalu divergence is a mirror, not a window: it shows us our pre-theoretic hesitations, not the nature of reference. To treat it as evidence is to mistake the reflection for the world.  

  ---

  ### **Marking Scheme (20 Points Total)**  
  **Award 4 marks per criterion. Deduct 1–2 for partial grasp, 3–4 for omission/misapplication.**  

  1. **Engages the Bridle Constraint**  
     *Applies the bridle to reject shallow explanations AND explains why control agreement matters.*  
     → *Common error:* Invokes "miscomprehension" without explaining why it wouldn’t disrupt the control case.  

  2. **Diagnoses the Divergence**  
     *Argues whether variation is noise/signal AND links it to theories of reference (e.g., ambiguity in supporting descriptivism/causal theories).*  
     → *Common error:* Assumes variation *automatically* supports referential pluralism or skepticism without argument.  

  3. **Treats Expertise Substantively**  
     *If invoking experts, explains *how* expertise might filter noise (e.g., calibration) AND addresses circularity risk. If rejecting experts, cites non-eliminated variation (e.g., student splits).*  
     → *Common error:* Claims "only experts matter" without justifying *why* their intuitions are evidence.  

  4. **Specifies a Revisability Condition**  
     *States what empirical finding would change their stance AND shows it satisfies the bridle (e.g., invariant + control disruption).*  
     → *Common error:* Proposes a vague or bridle-violating condition (e.g., "if samples were larger").  

  5. **Flags Settled/Contested Claims**  
     *Marks at least two claims as settled (e.g., variation exists) AND two as contested (e.g., expert legitimacy), without presenting contested claims as consensus.*  
     → *Common error:* Treats "WEIRD samples invalidate x-phi" as a knockdown argument, ignoring methodological responses.  

  ---

  ### **Why This Works for Your Novel**  
  - **Vasa’s Voice:** The question’s dry framing ("Grant the bridle") and the answer’s curt dismissals ("exhaustingly familiar," "circularity risk") convey her fatigue. No citations keep it focused on ideas.  
  - **Not Parody:** Avoids "trolley problem" clichés. The Kalu case is a plausible x-phi thought experiment, and the bridle is a real methodological check (akin to "competence conditions" in experimental philosophy).  
  - **Deflaty, Not Cute:** The model answer’s conclusion ("a mirror, not a window") is deflationary without being glib. The marking scheme rewards rigor, not performative skepticism.  
  - **Philosophically Live:** Engages actual debates about evidential status (noise vs. signal) and expertise without requiring name-drops.  

  This exam would make a philosopher reader nod slowly, not roll their eyes — while letting Vasa’s disillusionment seep through the cracks. Good luck with the novel!
