  1. **Purpose of a GSSP**: A Global Boundary Stratotype Section and Point (GSSP) serves as a reference point in a stratigraphic section that defines the lower boundary of a stage. Its primary function is to enable global correlation of rock layers by identifying a marker that is as close to synchronous worldwide as possible and is durable in the rock record.

  2. **Current rules requirement**: The current stratigraphic rules (as per the International Commission on Stratigraphy, ICS) require that a GSSP be defined by a primary marker (usually a biological, chemical, or physical change) that is globally recognizable and ideally synchronous. The marker must be detectable in multiple stratigraphic sections around the world.

  3. **Boundary choice and past human forcing**: The choice of a boundary for the Anthropocene does not, in itself, determine the magnitude or significance of past human forcing. A later boundary (e.g., mid-20th century) does not negate the existence of earlier human impacts, and an earlier boundary does not diminish the scale of mid-20th century changes.

  4. **"First detectable human impact" as a boundary**: Both camps agree that "first detectable human impact" is not a coherent candidate for a chronostratigraphic boundary because human impacts are diachronous and vary regionally. A GSSP requires a globally synchronous marker, not the first local occurrence of human influence.

  5. **Political and pedagogical work of the term**: The term "Anthropocene" is already widely used in political, cultural, and educational contexts to denote a period of significant human impact on Earth systems. The formal stratigraphic definition cannot control or undo this broader usage, which may have different temporal boundaries.

