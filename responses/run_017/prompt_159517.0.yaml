  - **Kalai-Smorodinsky with full utopia**: Utopia point is (12,9) (max Red from A, max Blue from D). For each option:
    - A: min(12/12, 0/9) = min(1, 0) = 0
    - B: min(11/12, 6/9) = min(0.916, 0.666) = 0.666
    - C: min(9/12, 7/9) = min(0.75, 0.777) = 0.75
