  ### What Turns on the Definition of "Realistically":
  - **Including wipe-out points for "best" (full utopia)**: This makes the utopia point more extreme, which can favor points where the weaker party (Blue here) gets a better relative outcome. It often leads to more balanced ratios, as in C (9,7) for this case.
