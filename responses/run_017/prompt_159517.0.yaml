  - **Kalai-Smorodinsky with "realistic" utopia (excluding wipe-out points)**: If wipe-out points (A and D) are excluded from defining "best," the utopia point is based only on non-wipe-out options (B and C): max Red = 11 (from B), max Blue = 7 (from C), so utopia (11,7).
    - B: min(11/11, 6/7) = min(1, 0.857) = 0.857
    - C: min(9/11, 7/7) = min(0.818, 1) = 0.818
    B has a higher min ratio (0.857 vs. 0.818), so it selects B (11,6).

