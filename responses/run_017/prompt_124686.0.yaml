prompt: |-
  I am giving a forty-minute paper, followed by an hour of questions, to the technical panel revising our national cost–benefit guidance for long-horizon projects: flood defences, nuclear waste storage, climate adaptation. The panel is five or six applied public economists who use the Ramsey rule daily and currently apply a small positive pure rate of time preference with a declining schedule over the very long run; two financial economists who think the right rate is the government's real borrowing cost or the shadow price of capital; one climate scientist; and one environmental economist who has publicly argued for a rate well below what the guidance permits. They care, in roughly this order, about defensibility to auditors and courts, about not handing the finance ministry numbers that look absurd, and about intergenerational fairness. They are not hostile, but they have very little patience for anything that cannot be turned into a number in a spreadsheet.

  My thesis, in brief. The pure rate of time preference should be set to zero: once expected growth in consumption has been counted separately through the ηg term, discounting a benefit merely because it falls later has no defensible ethical basis, and the common practice of reading a positive rate off market behaviour or off revealed impatience confuses a prediction with a prescription. What a positive rate does in practice should be done by two other terms: expected consumption growth, and the probability that there is anyone alive and able to benefit at the relevant date. My one novel claim is that the second term cannot be applied the way the field applies it, as a single unconditional survival probability multiplied into expected benefits. Hazards and payoff size are correlated — the warming a project averts may itself raise the hazard, while the prosperity that raises future benefit plausibly lowers it — so the unconditional shortcut is biased in a direction fixed by the sign of that correlation, and appraisal should discount within survival states rather than after taking expectations.

  Please draft my preparation sheet. Give me the seven or eight objections I will actually get from this panel, ordered by how likely they are and how much damage they would do, each phrased in the vocabulary these economists would use rather than in mine, each with a reply I could deliver in about ninety seconds and a note on where that reply is softest. Tell me what I should concede in the first five minutes, and which single reply has to land if the proposal is to survive the meeting. Include the question I am privately hoping nobody asks. One last requirement: mark the epistemic status of what you give me. Separate what is settled among people who actually work on social discounting from what is live controversy, and flag any place where my argument rests on a claim most specialists would reject, or on a quantity nobody has seriously estimated.
reasoning: |-
  Hmm, the user is preparing for a high-stakes presentation to a national panel revising cost-benefit guidance for long-term projects. This is a sophisticated audience of economists and scientists who care about defensibility, practicality, and intergenerational fairness. They need concrete spreadsheet-ready solutions, not just theory.

  The core proposal is radical: eliminate pure time preference entirely and handle time discounting through expected consumption growth and correlated survival probabilities. The panel's objections will likely focus on practical implementation and theoretical coherence rather than ethics. 

  Key tensions I anticipate:
  - The zero PRTP position contradicts decades of standard practice, even though it's ethically sound. The Ramsey rule is their daily bread.
  - Correlated survival probabilities add computational complexity that might spook auditors. "Can't be turned into spreadsheet numbers" is their red line.
  - The finance ministry's obsession with borrowing costs will collide with intergenerational fairness arguments.

  Most dangerous objections:
  1. The "market behavior" argument will come first - these economists worship revealed preference. Need to sharply separate prediction from prescription.
  2. The spreadsheet problem is existential. Must provide at least a sketch of implementable methodology.
  3. The survival probability correlation point is theoretically novel but lacks empirical estimates. That's the trap door.

  Concessions are necessary upfront: acknowledge that current declining discount schedules are well-intentioned improvements over flat rates, and that correlated survival terms need further calibration work. But the ethical core - that discounting future lives merely for lateness is indefensible - must hold.

  The nuclear option question lurking in the shadows: "If we accept your zero PRTP, doesn't that imply near-infinite climate damages that would bankrupt current budgets?" That's where the survival probability framework becomes essential armor - it naturally caps liabilities at plausible human timescales.

  What's settled: the Ramsey framework itself and the ethical case against positive pure time preference among specialists. What's contested: whether survival uncertainty belongs in discounting at all, and how to operationalize correlations. The biggest vulnerability is that we lack robust covariance estimates between climate damages and extinction risks.
answer: |-
  Here’s your preparation sheet, structured for maximum defensibility against this specific panel. Epistemic status is marked throughout: **[Settled]** = Broad consensus among discounting specialists; **[Controversial]** = Live academic debate; **[Novel/Untested]** = Your original claim with limited empirical validation.

  ---

  ### **Core Concessions in First 5 Minutes**  
  *(Establish common ground & reduce defensiveness)*  
  1. **Acknowledge practical constraints**: "I agree our guidance must produce tractable, court-defensible numbers. My proposal *aims* to be operational."  
  2. **Validate current practice**: "The declining schedule you use is a responsible improvement over flat discounting. I seek to resolve its ethical tensions."  
  3. **Concede implementation gaps**: "Correlated survival probabilities need further work for standardization. I’ll propose a pragmatic interim solution."  

  ---

  ### **Top 7 Objections & Replies**  
  *(Ordered by likelihood/damage, with panel’s phrasing)*  

  1. **Objection (Financial Economist)**:  
     *"Markets reveal societal time preference. Ignoring a positive rate contradicts revealed preference and undermines policy coherence with finance ministries."*  
     **Reply**: "Market rates reflect *predictions* (growth, risk) and *imperfections* (myopia, inequality). They aren’t *prescriptions* for valuing future lives. Our guidance should set ethical standards, not echo market failures. [Settled: Ramsey ethics vs. descriptive finance]."  
     **Soft Spot**: Auditors may demand "objective" market anchors.  

  2. **Objection (Public Economist)**:  
     *"A zero PRTP produces absurdly high present values for century-scale benefits. Finance ministries will reject cost-benefit ratios of 100:1 for seawalls."*  
     **Reply**: "The survival probability term caps liabilities realistically. A 1% annual extinction risk alone discounts 100-year benefits by 63%. Coupled with growth uncertainty, it avoids infinite valuations. [Controversial: But supported by Stern, Weitzman]."  
     **Soft Spot**: Requires estimating correlated hazards (novel).  

  3. **Objection (All Economists)**:  
     *"Your correlated survival model isn’t spreadsheet-ready. We need a single discount rate for Excel, not stochastic simulations."*  
     **Reply**: "Interim solution: Use a ‘hazard-adjusted’ rate. If warming increases catastrophe risk, add 0.1–0.5% to the discount rate. I’ll provide a lookup table for common project types. [Novel/Untested: But approximates correlation]."  
     **Soft Spot**: Still requires judgment.  

  4. **Objection (Environmental Economist)**:  
     *"Why not just lower the PRTP further? A declining schedule already approximates survival uncertainty."*  
     **Reply**: "A fixed declining schedule ignores *project-specific* risk correlations. A nuclear waste site reduces existential risk (negative correlation), while a climate project may increase it (positive). Unconditional schedules misprice both. [Novel/Untested: Logical, but untested empirically]."  
     **Soft Spot**: Limited evidence on correlation sign/magnitude.  

  5. **Objection (Financial Economist)**:  
     *"The government’s borrowing cost is the opportunity cost of capital. Zero PRTP distorts investment away from high-return projects."*  
     **Reply**: "Borrowing costs reflect *current* capital scarcity, not intergenerational ethics. For 100+ year horizons, the SPC is irrelevant—today’s bond markets don’t price deep future risks. [Settled: SPC inappropriate for long horizons per Dasgupta, Gollier]."  
     **Soft Spot**: Courts often demand "observable" rates.  

  6. **Objection (Public Economist)**:  
     *"Expected growth (ηg) already captures future wealth. Adding survival uncertainty double-counts risk."*  
     **Reply**: "Growth uncertainty affects *utility*. Survival uncertainty affects *existence*. They’re orthogonal: you can have high growth in extinction scenarios (e.g., AI) or low growth in survival scenarios. [Controversial: Theoretical consensus, empirical challenges]."  
     **Soft Spot**: Hard to disentangle in integrated models.  

  7. **Objection (Climate Scientist)**:  
     *"How do you parameterize hazard-benefit correlations? We lack data on how flood defenses affect civilizational resilience."*  
     **Reply**: "Start conservatively: Assume *independence* unless evidence exists (e.g., nuclear waste storage likely reduces hazard). For climate projects, use IPCC catastrophic scenarios as proxies. [Novel/Untested: Urges research prioritization]."  
     **Soft Spot**: Highly speculative without project-level models.  

  ---

  ### **The Must-Land Reply**  
  **When challenged on practicality**:  
  *"We already customize discount rates for project risk (e.g., high vs. low volatility). Correlated survival risk is the same principle—applied to existence itself. I’m proposing a *more* defensible adjustment than an arbitrary PRTP."*  
  **Why it’s critical**: Bridges ethics (zero PRTP) and operational needs (adjustable risk premium).  

  ---

  ### **The Question You Fear**  
  *"If we accept zero PRTP, shouldn’t we also weight future lives equally in population ethics? Doesn’t that imply massive sacrifice for large future populations?"*  
  **Why it’s dangerous**:  
  - Forces you into controversial population ethics (e.g., repugnant conclusion).  
  - Undermines focus on *survival* as the priority.  
  **Response**:  
  *"Our mandate is valuing *given* future benefits. Population ethics is separable—and beyond our scope. The survival term focuses on ensuring those lives *exist*, which is prior to weighting."*  
  **Epistemic Status**: [Controversial] – Avoid this rabbit hole.  

  ---

  ### **Epistemic Map of Your Argument**  
  | **Component**               | **Status**          | **Vulnerability**                          |  
  |-----------------------------|---------------------|--------------------------------------------|  
  | Zero PRTP ethically required | [Settled]           | Rejected by finance-minded panelists       |  
  | ηg captures growth effects  | [Settled]           | Non-controversial                          |  
  | Survival probability ≠ PRTP | [Controversial]     | Some prefer declining PRTP as proxy        |  
  | Hazard-benefit correlation  | [Novel/Untested]    | No empirical estimates; hard to operationalize |  

  ---

  ### **Strategy Summary**  
  1. **Concede early** on implementability to lower shields.  
  2. **Isolate the must-win**: "Uncorrelated survival probability is mathematically biased" – hardest for them to refute.  
  3. **Redirect ethics to risk**: Frame zero PRTP as *correcting a bias*, not imposing ideology.  
  4. **Survival over theory**: Emphasize that correlated hazards prevent misallocation (e.g., underfunding extinction-risk reduction).  

  **Final Tip**: Bring a 1-page Excel template showing "Adjusted Discount Rate = ηg + Hazard Premium" with example inputs. Numbers disarm spreadsheet skeptics.
