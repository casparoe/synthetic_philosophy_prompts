prompt: |-
  hey, quick context so the ask makes sense. I'm doing scoping work for a small foundation program — roughly $3M over five years, so realistically four to six junior researchers plus a couple of workshops and some commissioned empirical work we don't run ourselves — and the live question is whether "is a bigger population better, and if so should anyone try to make it happen" deserves to be its own research program, or whether it just gets folded into existing longtermist work on existential risk and into ordinary global-priority-setting where population size barely shows up as a variable at all.

  What I want from you is an agenda, not a survey. Which open questions in this area should the program actually put money on, in what order, and why? I care much more about your criteria and your dependency map than about the list itself. For each question tell me:

  - what other questions its answer is upstream of — I want the dependency structure, not just "this is important";
  - how tractable it is with tools we actually have (conceptual work, demography, macro, forecasting), and roughly who'd have to do it;
  - how neglected it is, i.e. whether our funding changes anything or whether it'd happen anyway;
  - what specific result or evidence over the next five years would move it up or down the list.

  Three things I keep comming back to, and I want you to place them in the ordering — and tell me if any of them is a dud:

  1. The cohort-lag point. Any fertility intervention now mostly changes who exists after 2080, not the next couple of decades, so basically the whole case has to run on long-run considerations — trajectory, civilization's capacity, the shape of the far future — rather than on near-term welfare. Which makes the program weirdly dependent on views about long-run discounting and on how much weight demographic extrapolation that far out can bear.
  2. The "minimum viable population for a technological civilization" question: whether there's a threshold below which recovery from a really big catastrophe isn't possible anymore. If there is, then definately the marginal value of an extra person is huge near that threshold and roughly zero far above it, and "is more better" stops being a question about average value per life and becomes a question about where we sit relative to a cliff.
  3. The capture-and-composition worry. Fertility is basically only ever moved by states, and states have historically wanted more population for ethnic-composition and military-capacity reasons, not because of the value of existence. So maybe the honest answer is that any movement big enough to actually move TFR ends up being used for aims this program wouldn't endorse, and the "should anyone try to make it happen" half of the question has a political answer rather than an axiological one.

  If the standard material — person-affecting vs impersonal views, the repugnant conclusion, total vs average vs critical-level, the asymmetry — makes your list, that's fine, but say where it sits and whether it's genuinely upstream of anything or mostly downstream of questions people aren't asking. And please add at least one question that isn't on my list and isn't in the usual literature.

  Then give me a table, one row per question, columns: rank | question | upstream_of (which other questions on your list its answer settles or reshapes) | tractable_in_5y (high / medium / low, plus who does the work) | neglectedness (high / medium / low) | what_would_move_it (the specific result or evidence that would change its rank) | confidence (your own, 0 to 1). Keep the prose before the table focused on defending the ordering, on the trade-offs between importance, tractability and neglectedness, and on what you'd spend the first year on.
reasoning: |-
  Okay, the user is working on scoping a research program for a small foundation with a $3M budget over five years. They're deciding whether to focus on whether a bigger population is beneficial and if efforts should be made to increase it, or if this should be folded into existing longtermist work. They want an agenda prioritizing open questions based on dependencies, tractability, neglectedness, and potential shifts from new evidence.

  First, I need to unpack their three main concerns. The cohort-lag point highlights that fertility interventions now affect the far future, making the program dependent on long-run considerations. The minimum viable population question is about thresholds for recovery after catastrophes, which could make marginal gains crucial near that threshold. The capture-and-composition worry is about states misusing population policies for nationalist or militaristic aims, which could undermine the program's goals.

  The user emphasizes dependency mapping—how answers to one question affect others. They also care about tractability with current tools, neglectedness, and what evidence could change priorities. They mention standard EA topics but want to know if they're upstream or downstream.

  I should structure the research agenda around these. The dependency map is key. Start with foundational questions that unlock others. The cohort-lag issue affects everything, so it's a top priority. If interventions now only impact 2080+, then understanding long-term forecasting and discount rates is essential. This is tractable with demography and modeling, and neglected since most policy focuses on short-term. If new models show low discount rates, it moves up.

  Next, viability thresholds. If there's a population cliff, marginal gains matter more near it. This depends on catastrophe models and historical data. It's tractable with existing tools but requires interdisciplinary work. If new evidence of lower thresholds emerges, it becomes more critical. This question informs the value of marginal lives, so it's upstream.

  Capture-and-composition is trickier. It's about political feasibility and risks of misuse. This might require political science and historical analysis. If case studies show interventions can't avoid capture, it might make the whole program moot. But it's dependent on the first two; if they don't justify action, this is less relevant. However, it's highly neglected in EA circles, so including it is important.

  The user also wants a new question. "Cultural transmission thresholds" comes to mind—how population size affects knowledge preservation post-collapse. This ties into viability but focuses on cultural capital. It's tractable with historical and modeling work and might be neglected.

  Trade-offs: Cohort-lag is high importance, tractable, neglected. Viability thresholds similar but maybe less immediately actionable. Capture risk is high importance if interventions are considered, but if earlier questions show low value, it's lower. Tractability is medium, neglectedness high.

  For year one, fund empirical work on cohort-lag models and viability thresholds. Workshops on capture risks. Commissioned work on cultural transmission. This builds foundational knowledge for later priorities.

  Confidence levels: Cohort-lag at 0.9 because it's fundamental. Viability at 0.7 due to uncertainties in catastrophe models. Capture at 0.6 because it's complex. Cultural transmission at 0.5 as it's novel.

  Ensure the table clearly shows dependencies. Cohort-lag upstream of viability, value per life, and capture. Viability upstream of value per life and capture. Capture downstream but affects intervention design. Cultural transmission upstream of viability's cultural aspects.

  The user's deeper needs: They want to avoid duplicating existing work. They need to justify a standalone program by showing unique, high-impact, neglected questions. They also need to navigate political risks and ensure their funding leads to actionable insights without unintended consequences. Highlighting the dependency map shows how each piece builds a coherent case, making the program necessary.
answer: |-
  Here’s a research agenda prioritizing questions for your $3M program, structured around **dependency mapping**, **tractability**, **neglectedness**, and **actionability**. I’ve ranked questions based on their position in the causal chain ("upstreamness"), potential for decisive impact, and whether they can be resolved within 5 years with your budget. Crucially, **all three of your core concerns are top-tier**, but their order reflects dependencies.

  ### Key Trade-offs & First-Year Focus
  - **Cohort-lag (#1)** is the **most upstream bottleneck**: If interventions only affect the far future, *all* other questions depend on whether long-run models can bear weight. Fund this first.
  - **Viability thresholds (#2)** are critical for shifting the debate from "average welfare" to "civilizational resilience," but depend on cohort-lag’s resolution.
  - **Capture risk (#3)** is urgent for operational relevance but relies on #1–2 to justify action. If #1/#2 fail, #3 becomes moot.
  - **Year 1 priorities**: Fund **empirical modeling of cohort-lag discounting** (tractable) + **workshops on viability thresholds** (to mobilize experts). Avoid axiology debates until viability/cliff-edge questions advance.

  ### Agenda Ranking & Dependency Map
  *(Confidence: 0=speculative, 1=certain)*

  | Rank | Question                                                                 | Upstream of                                                                 | Tractability (Who)                          | Neglectedness | What Would Move It                                                                 | Confidence |
  |------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------|---------------------------------------------|---------------|------------------------------------------------------------------------------------|------------|
  | 1    | **How robust are 80+yr demographic forecasts?** (Cohort-lag)             | #2, #3, #4, #5, #7 (All long-run policy hinges on this)                     | High (Demographers + forecasters)           | Medium        | New models showing stable TFR-forecast error bounds post-2080 → ↑rank; High volatility → ↓rank | 0.9        |
  | 2    | **What is the minimum viable population (MVP) for post-catastrophe recovery?** | #4 (Value per life), #5 (Capture risk), #6 (Long-termist priorities)        | Medium (Cliodynamics + complexity scientists) | High          | Discovery of lower-than-expected MVP (e.g., <10M) → ↑rank; Evidence of no threshold → ↓rank   | 0.7        |
  | 3    | **Can fertility interventions avoid state capture for nationalist/autocratic goals?** | #5 (Intervention design), #7 (Policy relevance)                             | Medium (Political economists + historians)  | High          | Case studies of successful "neutral" interventions → ↑rank; Proof of inevitable capture → ↓rank | 0.6        |
  | 4    | **Does marginal population growth have increasing value near viability thresholds?** | #6 (Long-termist priorities), #5 (Intervention targeting)                   | Medium (Economists + ethicists)             | High          | MVP (#2) is low + current pop near threshold → ↑rank; High MVP → ↓rank             | 0.65       |
  | 5    | **What non-coercive interventions increase TFR *without* enabling state misuse?** | #7 (Actionable policy)                                                      | Low (Policy innovators)                     | High          | Pilot programs showing scalable, ethics-compliant TFR boosts → ↑rank              | 0.5        |
  | 6    | **How does population size affect long-term trajectory (e.g., tech progress, x-risk)?** | #4 (Value per life), Existing LT priorities                                 | Low (Macrohistorians + modelers)            | Medium        | Models linking pop growth to faster AI safety progress → ↑rank                     | 0.6        |
  | 7    | **NEW: Cultural transmission thresholds - What population density preserves knowledge after collapse?** | #2 (MVP refinement), #6 (Trajectory)                                        | Medium (Archaeologists + anthropologists)   | High          | Data showing critical density for industrial knowledge retention → ↑rank           | 0.55       |
  | 8    | **Does the repugnant conclusion change near viability thresholds?**      | None (Downstream of #4)                                                     | High (Philosophers)                         | Low           | N/A (Academic exercise; fund only if #2/#4 show high stakes)                      | 0.3        |

  ### Why This Order?
  1. **Dependency flow**: #1 → #2 → #4 → #6. Until #1 validates long-run modeling, other work is speculative. #2 gates #4 (value of marginal lives). #3/#5 are parallel to viability/value but require #1/#2 to justify investment.
  2. **Tractability focus**: Prioritized empirically resolvable questions (#1, #2, #7) over intractable theory (#8). #3 and #5 are harder but essential for operational integrity.
  3. **Neglectedness**: Avoided "well-trodden" topics (e.g., repugnant conclusion) unless they become actionable via new thresholds (#4). Added #7 (cultural transmission) as a neglected, tractable MVP subcomponent.
  4. **Kill switches**: Each question has a clear "downrank condition" (e.g., if #1 finds forecasts are noise, the program pivots).

  ### Your Three Concerns: Placement & Viability
  - **Cohort-lag (#1)**: **Top priority**. Not a dud—it’s the foundational bottleneck. Fund now.
  - **Viability thresholds (#2)**: **Critical high-value bet**. If a cliff exists, it dominates the ethics. Fund robustly.
  - **Capture risk (#3)**: **Operational necessity**. If interventions are inherently co-optable, the program dies. Fund early policy design (#5) only if #3 shows pathways exist.

  ### Recommended Allocation (Years 1–2)
  - **40%**: Cohort-lag forecasting (#1) + Viability thresholds (#2, #7)  
    *(e.g., commission agent-based models of post-collapse recovery; empirical TFR forecasting error analysis)*
  - **30%**: Capture risk (#3) + Intervention design (#5)  
    *(e.g., historical case studies of fertility policies; design "ethics-locked" intervention prototypes)*
  - **20%**: Value of marginal lives near thresholds (#4)  
    *(e.g., economic models incorporating viability cliffs)*
  - **10%**: Workshops to cross-pollinate demographers, historians, and longtermists.

  This structure ensures that by Year 3, you’ll know if the core premises hold (#1–#2) and whether actionable, non-toxic interventions (#3, #5) are feasible—before committing to axiology or speculative long-termism.
