prompt: |-
  So, context: I'm in the fourth year of a PhD on rationality and commitment — broadly, what you should do when doing the best thing requires you not to be the sort of agent who stops to work out what the best thing is — and I'm writing a commentary chapter for a volume of responses to my supervisor's work. He's been sitting on a book manuscript about this for fifteen years and he has an opinion about every case in the neighbourhood of Parfit's hitchhiker (driver takes you to town only if he's confident you'll pay him once you're there; once you're there you have no reason to). I've reconstructed his verdicts from seminars, from the margins of the manuscript he lets me photocopy, and from one extremely long email he sent at 3am. Here they are as best I can put them: standard hitchhiker, nothing forcing you in town, nobody will ever know — rational to pay. Hitchhiker who hands his wallet to a friend before setting out with standing instructions to pay the driver — rational to hand it over, and once in town *not* rational to try to intercept the payment. Hitchhiker in a small town where everyone will hear — rational to pay, though he calls it "the easy case and the least interesting one," because reputation turns it into plain prudence. Hitchhiker who swallows something at the roadside that reliably produces, an hour later, a warm sincere conviction that he owes the driver the money, knowing the capsule is doing the work — rational to swallow it; when I pushed him on whether the conviction itself is then *rational*, he said I was asking the wrong kind of question and that what mattered was that taking it was. Grad student with no capsule and no friend who simply resolves, on no evidence, to believe she'll finish by Christmas, finds she does believe it, and it helps — the resolve is fine, the belief is not rational, and he doesn't see why that should bother her. And the variant where the driver is a terrible judge of character, picks you up by accident, and you'll never cross paths again: he's never given me a straight answer, and the 3am email said something like "if all that's left is that you said you would, I neither know nor care," which I genuinely cannot tell is a dodge or a signal. The problem is that in every case where he *has* ruled, the selection story (payers get rides) and the promise-and-gratitude story (you said you would, and he got you there, and that's a reason) are both in play, so I can't tell which one is doing the work.

  So I built a case to pry them apart and I want your prediction on it. Two hitchhikers, one car, one ride; the ride is worth more than anything else to each of them, and the driver takes the pair only if he predicts that at least one of them will hand over £1000 on arrival — he doesn't care which, he'll refuse a second payment because he isn't greedy, and he reads dispositions rather than promises, so a promise from the pair buys nothing with him (they both make one anyway, because he asks). They're strangers, picked up a mile apart, and the driver makes it a condition of the ride that they never confer about the money: no deals, no coin flip, no "you get this one," and any attempt and he leaves them in the desert. In town, both can pay, neither is observed, and they'll never meet again. Does he say each of them pays? Only one, and if so how does either one work out which? Does it matter that each knows the driver only ever needed a single payment — is "she'll probably pay, so I needn't" available to either of them, and if it is, doesn't it poison both?

  What I actually need, more than a verdict, is this: give me the two or three rules his track record is jointly consistent with, say what each predicts about my two-hitchhiker case, give me your best guess about which one he's really running with the reasons for preferring it, and tell me what further variant would force him off the fence. I have a candidate — the driver announcing on arrival, before either has paid, that he picked them up because he saw that she would pay — but there's probably a cleaner one. Bonus round if you're enjoying yourself: rerun the whole thing with a driver whose scan reads sincere belief rather than predicted payment, i.e. he takes the pair only if he predicts at least one of them will arrive *believing* she owes him the money, and tell me whether his capsule story then makes it rational for both of them to arrive believing a debt that at most one of them has to discharge. Typing this on a bus so forgive the typos, and please don't hand me a reading list — I have one, I just can't tell which item on it he's arguing with.
reasoning: |-
  Hmm, the user is a fourth-year PhD student working on rationality and commitment, specifically around Parfit's hitchhiker scenarios. They're trying to reconstruct their supervisor's position from scattered sources and need help designing a test case to isolate whether the supervisor prioritizes selection effects or promise-based reasons in rational decision-making.

  The user has presented several of their supervisor's judgments: paying in the standard hitchhiker case is rational, handing the wallet to a friend is rational but intercepting payment isn't, reputation cases are "easy," taking a belief-altering capsule is rational (though the resulting belief may not be rational), and resolving to believe without evidence is fine even if the belief isn't rational. The unclear case is when the driver is a bad judge of character.

  Now they've designed a two-hitchhiker scenario: two strangers in a desert, driver takes both only if at least one will pay £1000, no communication allowed between them, no reputation effects, and payment isn't observable. They want to know what rules explain the supervisor's previous judgments, how those rules would apply to this new case, which rule the supervisor likely favors, and what variant would force a distinction.

  The key tension is between selectionist reasoning (payers get selected for rides) and deontological reasoning (promises create obligations). In the two-hitchhiker case, selectionist reasoning suggests only one needs to pay (since the driver only required one payer), while deontological reasoning suggests both should pay (since both made promises).

  Looking at the supervisor's pattern: he consistently endorses actions that secure selection benefits (paying, handing wallet, taking capsule) but rejects downstream irrational actions (intercepting payment). He dismisses reputation cases as "uninteresting" and separates instrumental rationality of belief-forming actions from epistemic rationality of the beliefs themselves.

  This suggests three core principles: 1) Instrumental rationality in pre-commitment (do what gets you selected), 2) No obligation to fulfill promises when selection is already secured, and 3) Beliefs formed instrumentally aren't epistemically rational but that's fine.

  Applying this to the two-hitchhiker case: each hitchhiker knows the driver only requires one payer. From a selectionist view, paying when unnecessary is wasteful. So the supervisor would likely say neither should pay - the selection benefit is already locked in. This breaks from the promise-based view where both should pay.

  To force the issue, the user's variant where the driver announces he selected them because he saw a specific person would pay would make that person's payment necessary for selection, so they should pay while the other shouldn't. A cleaner variant might be if the driver required both to pay, testing when selection pressure overrides promises.

  For the bonus round with belief instead of payment: if the driver selects based on sincere belief, then both taking the capsule to form the belief would be rational (instrumentally), even though the belief itself may not be epistemically rational - consistent with the supervisor's capsule judgment. The key is the action that gets selection, not the mental state's rationality.
answer: |-
  Based on your supervisor's pattern of judgments, I reconstruct **three core principles** that explain his rulings. I'll then apply them to your two-hitchhiker case, predict his verdict, identify the likeliest principle he favors, and design a variant to force a distinction. Finally, I'll tackle the bonus round.

  ---

  ### **Reconstructed Principles**
  1. **Selectionist Instrumentalism (SI):**  
     *Rationality requires actions that secure inclusion in beneficial cooperative structures.* Pre-commitment (e.g., wallet handoff, capsule) is rational because it enables selection. Once selected, fulfilling the commitment is irrational *if* selection is already secured and no further costs/benefits apply.  

  2. **Procedural Non-Cognitivism (PNC):**  
     Rationality governs *actions and procedures*, not belief states. Forming beliefs instrumentally (capsule, resolution) is rational *as an act* if it yields benefits, even if the resulting belief is epistemically irrational. What matters is the functional outcome.  

  3. **Minimal Moral Residual (MMR):**  
     Promises/gratitude create *pro tanto* reasons, but they are easily overridden. They only dominate when:  
     - (a) Selection effects are absent (e.g., driver is a bad judge), **or**  
     - (b) No other instrumental rationale exists (e.g., reputation, self-interest).  
     *(His "I neither know nor care" in the bad-judge case hints MMR is weak or inert when SI doesn’t apply.)*

  ---

  ### **Prediction for Your Two-Hitchhiker Case**
  - **Setup:** Driver takes the pair iff ≥1 pays. No communication. No reputation. Both promised.  
  - **SI Prediction:** **Neither pays.**  
    *Why:* Selection is already secured by the driver’s prediction. Paying is a net loss (£1000) with no benefit (no future selection pressure, no reputation). "She’ll probably pay" makes paying strictly dominated.  
  - **PNC Prediction:** *N/A* (This governs belief formation, not payment acts).  
  - **MMR Prediction:** **Both pay.**  
    *Why:* Each made a promise and received a benefit, creating an obligation. The driver’s indifference to *who* pays doesn’t negate individual duties.  

  **Your Supervisor’s Likely Verdict:** **Neither pays.**  
  SI explains *all* his prior rulings cleanly:  
  - Standard hitchhiker: Paying ensures selection *for future interactions* (implicitly).  
  - Wallet handoff: Rational to enable selection; irrational to intercept post-selection.  
  - Capsule/resolve: Instrumental acts enable selection; belief rationality is irrelevant (PNC).  
  - Reputation case: "Uninteresting" because SI merges with prudence.  
  - Bad-judge driver: MMR is weak ("I neither know nor care") when SI doesn’t apply.  

  **Why SI Dominates:**  
  MMR fails to explain why intercepting payment is irrational (promise remains!) or why the capsule act is rational without MMR. SI unifies all cases under *forward-looking instrumentalism*: act only to secure selection; once selected, optimize locally.  

  ---

  ### **Forcing Him Off the Fence: A Cleaner Variant**
  **Proposed Variant:**  
  > The driver announces *after arrival*: "I took you both because I predicted *Hitchhiker A* would pay. I never scanned B."  

  **Why This Forces Distinction:**  
  - **SI Predicts:** Only A pays. A’s payment maintains selection efficacy for future drivers (reputation-like). B pays nothing (no selection role).  
  - **MMR Predicts:** Both pay. Promises and gratitude bind independently of the driver’s prediction.  

  If your supervisor says "Only A pays," SI is confirmed. If "Both pay," MMR gains ground.  

  **Your Candidate (Driver announces pre-payment he saw *she* would pay):**  
  This works similarly but is messier—it might trigger last-minute selection pressure (e.g., if non-payment could cause driver to abandon them). The post-arrival announcement avoids this.

  ---

  ### **Bonus Round: Sincere Belief Scan**
  **Setup:** Driver takes the pair iff ≥1 *believes* they owe £1000 on arrival.  
  **Question:** Is it rational for both to take a belief capsule (ensuring both believe) even though only one belief is needed?  

  **Analysis:**  
  - **SI Prediction:** **Both should take the capsule.**  
    *Why:* Taking the capsule ensures selection. The cost (temporary false belief) is negligible vs. dying in the desert.  
  - **PNC Prediction:** **Yes—the *act* of taking the capsule is rational.** The belief itself is epistemically irrational, but PNC separates procedural rationality from belief rationality (as in his capsule verdict).  
  - **MMR Prediction:** *N/A* (No promise/obligation to *believe*).  

  **Supervisor’s Likely Verdict:**  
  - Taking the capsule is rational for both (SI/PNC).  
  - The belief is epistemically irrational but "that shouldn’t bother her" (PNC).  
  - *Crucially:* He’d deny both *need* to believe—one believer suffices for selection. But since they can’t coordinate, both acting to ensure belief is rational (dominant strategy).  

  **Key Insight:**  
  This case reinforces **SI/PNC**. The capsule isn’t about "owing a debt" but about passing the scan. The content of the belief is irrelevant—only its instrumental role matters.

  ---

  ### **Conclusion**
  - **His Core Principle:** **Selectionist Instrumentalism (SI).** Rationality is about getting into (and maintaining) cooperative equilibria; post-selection, act on local incentives.  
  - **Verification Test:** Use the post-arrival announcement variant. If he rules only the named hitchhiker pays, SI is confirmed.  
  - **Why He’s Opaque:** He rejects deontology (MMR) but avoids saying so outright, calling cases "uninteresting" when SI aligns with common sense. His 3am email dodge suggests MMR is a non-starter.  

  This fits the pattern: Rationality isn’t about keeping promises—it’s about *being the type of agent who gets picked*. Once picked, the job is done.
