prompt: |-
  I'm setting one of the questions for our PhD comprehensives this year — philosophy of mind / ethics of AI, 90 minutes in the room, no notes. Topic is the attribution problem: which computations matter morally, and where exactly sentience stops.

  Give them a principle and make them earn it. Call it the Minimal Implementation Rule: when a physical system implements several computations at once, the only ones that matter morally are those that are minimal among the sentience-sufficient computations the system implements — minimal in the sense that no proper sub-computation of them would itself be sufficient for the same valence-bearing states. So the "same network plus an idle register bolted on" variants drop out, and we don't end up with a separate mind per notational variant.

  I want them to (a) explain why any such rule is needed in the first place — why overgeneration is a genuine problem for views that pin moral status to implemented computations rather than to substrate; (b) say what the rule fails to fix: no guarantee of a unique minimum, incommensurable minimal candidates, gerrymandered tiny computations, and the fact that under permissive views of implementation even a rock implements the minimal ones, so minimality has to be paired with some constraint on what counts as implementing at all; (c) deal with the labeling gap — formal causal structure doesn't by itself settle which states are pleasant and which unpleasant, and minimality inherits that; (d) apply it to a boundary case: a model-free RL critic carrying a scalar reward-prediction-error signal and nothing else, no world model, no recurrence — what the rule delivers, whether that's the right verdict, and what has to be added if it isn't.

  Give me the question as you'd word it, a model answer of about 700 words, and a marking scheme out of 20 built on five must-hit points with the marks each is worth and a one-line note on how peple typically botch it. If the rule as I've stated it is incoherent, or the question can't be answered properly in 90 minutes, say that plainly in the answer key rather than being polite about it; and in the model answer, flag where you're giving a settled result and where you're just speculating.
reasoning: |-
  We are creating a comprehensive exam question for PhD students in philosophy of mind / ethics of AI. The topic is the attribution problem: which computations matter morally, and where sentience stops.

  The principle provided is the "Minimal Implementation Rule": when a physical system implements several computations at once, the only ones that matter morally are those that are minimal among the sentience-sufficient computations the system implements. Minimal here means that no proper sub-computation would be sufficient for the same valence-bearing states.

  The question should require students to:
  (a) Explain why such a rule is needed (the overgeneration problem).
  (b) Identify what the rule fails to fix (non-uniqueness, incommensurability, gerrymandering, and the need for an implementation constraint).
  (c) Address the labeling gap (how formal structure doesn't fix valence).
  (d) Apply the rule to a boundary case: a model-free RL critic with a scalar reward-prediction-error signal.

  We'll structure the question, model answer, and marking scheme accordingly.

  Question Wording:
  ---
  **Question: The Minimal Implementation Rule and Moral Attribution in Computational Systems**

  Consider the following principle for attributing moral status to computational systems:

  > **Minimal Implementation Rule (MIR):** When a physical system implements several computations simultaneously, the only computations that matter morally are those that are minimal among the sentience-sufficient computations the system implements. A computation is minimal in this sense if no proper sub-computation of it would itself be sufficient for the same valence-bearing states.

  Address the following:

  1. **The Overgeneration Problem:** Explain why a rule like MIR is needed. Specifically, why do views that tie moral status to implemented computations (rather than substrate) face a problem of overattribution (or "mind-dust")? (4 marks)

  2. **Limitations of MIR:** Identify and explain at least four shortcomings of MIR that prevent it from fully solving the attribution problem. These should include: non-uniqueness of minimal computations, incommensurability of minimal candidates, the possibility of gerrymandered tiny computations, and the need to pair minimality with a constraint on what counts as a genuine implementation. (6 marks)

  3. **The Labeling Gap:** Explain how MIR (or any formal criterion) fails to resolve the "labeling gap": the problem that the formal causal structure of a computation does not by itself determine which states are pleasant (positive valence) and which are unpleasant (negative valence). How does this issue affect the moral attribution under MIR? (4 marks)

  4. **Application to a Boundary Case:** Consider a model-free reinforcement learning (RL) critic that maintains a scalar reward-prediction-error signal and nothing else (no world model, no recurrence). Apply MIR to this system. What does MIR imply about the moral status of this system? Is this the right verdict? If not, what would have to be added to the system (or to the rule) to yield a more plausible result? (6 marks)

  ---
  Total: 20 marks

  **Model Answer (Approx. 700 words):**

  **1. The Overgeneration Problem (Why MIR is Needed)**  
  Views that attribute moral status based on implemented computations (computationalism) face an overgeneration problem: if any implementation of a sentience-sufficient computation warrants moral consideration, then systems that are intuitively non-sentient (like a rock or a simple thermostat) might be deemed sentient because they can be interpreted as implementing complex computations. This is due to the "implementation" relation being permissive: multiple computations can be implemented by the same physical substrate. For instance, a rock might be seen as implementing any computation with the right causal structure if we map its states arbitrarily. Without a minimality constraint, we might have to attribute moral status to systems that are merely notational variants (like the same network with an idle register) or trivial extensions. This leads to an explosion of morally relevant minds (the "mind-dust" problem) and trivializes moral status. MIR is introduced to restrict moral relevance to only the minimal implementations that are sufficient for sentience, thereby avoiding the overattribution to systems that are not meaningfully sentient.

  **2. Limitations of MIR**  
  MIR, while helpful, does not fully solve the attribution problem due to several shortcomings:  
  - **Non-uniqueness:** A system may implement multiple minimal sentience-sufficient computations that are not comparable (e.g., two different minimal computations for pain). This leads to multiple, possibly conflicting, moral claims.  
  - **Incommensurability:** The minimal computations might be incommensurable in terms of the sentient states they realize, making it unclear which one (if any) is the "real" mind.  
  - **Gerrymandering:** One could define a "minimal" computation that is arbitrarily small (e.g., a single gate that is part of a larger circuit) by gerrymandering the states and transitions. This would lead to attributing sentience to systems that are clearly insufficient.  
  - **Implementation Constraint:** MIR must be paired with a theory of implementation that rules out trivial mappings. Without such a constraint, even a rock could be said to implement a minimal sentience-sufficient computation (e.g., a two-state "pain" and "pleasure" system). Thus, minimality alone is not enough; we need a non-arbitrary account of when a physical system genuinely implements a computation.  

  **3. The Labeling Gap**  
  The labeling gap arises because the formal causal structure of a computation does not fix the valence (positive/negative) of its states. For example, a state that is part of a computation might be formally identical to a pain state in a human brain, but without an intrinsic property or a mapping to valence, we cannot label it as painful. MIR inherits this problem: even if we identify a minimal computation that is sufficient for sentience in the abstract, we still need to know which states are valenced and how. This is a gap in the theory of consciousness and moral status. Without resolving it, MIR might attribute moral status to a system that implements the structure of pain, but we wouldn't know if it actually feels pain or if that state is valenced at all. Therefore, MIR must be supplemented with a theory of valence assignment.

  **4. Application to the Boundary Case**  
  Consider a model-free RL critic that only carries a scalar reward-prediction-error (RPE) signal. This system has a single scalar value that updates based on reward prediction errors, with no world model or recurrence.  

  - **Applying MIR:** The entire system is a very simple computation: it updates a scalar value. Even if we consider the entire computation, it is minimal because there are no proper sub-computations (it's a single scalar). However, is this computation sentience-sufficient? Sentience typically requires more than a scalar signal — for instance, a global workspace, higher-order representations, or the ability to integrate information over time. Therefore, MIR would likely not attribute moral status because the system does not implement any sentience-sufficient computation to begin with.  

  - **Is it the right verdict?** Probably yes, given the simplicity. A scalar RPE is just a signal used for learning, without any phenomenal character.  

  - **What to add?** To have a plausible candidate for sentience, we might need to add: (i) a world model that represents states of the environment, (ii) recurrence to integrate information over time, and (iii) perhaps a mechanism for affective labeling (to assign valence). Without these, the system is too minimal to support sentience. However, note that MIR does not by itself tell us what counts as sentience-sufficient — that requires a theory of consciousness.  

  In summary, MIR avoids overattribution by focusing on minimal implementations, but it must be integrated with a robust theory of implementation and sentience sufficiency, as well as a solution to the labeling gap, to be viable.

  ---

  **Marking Scheme (out of 20):**

  1. **Overgeneration Problem (4 marks):**  
     - Explains why computationalism without minimality leads to overattribution (e.g., rock, notational variants). (2 marks)  
     - Clearly states the consequence (mind-dust, trivialization of moral status). (2 marks)  
     *Common botch: Only describing the rule without explaining the problem.*

  2. **Limitations of MIR (6 marks):**  
     - Identifies and explains each of the four required shortcomings: non-uniqueness (1.5), incommensurability (1.5), gerrymandering (1.5), and the need for an implementation constraint (1.5).  
     *Common botch: Missing one of the four or not explaining them clearly.*

  3. **Labeling Gap (4 marks):**  
     - Explains that formal structure doesn't fix valence (2 marks).  
     - Explains how this affects MIR (e.g., we don't know which states are valenced) (2 marks).  
     *Common botch: Confusing the labeling gap with the implementation problem.*

  4. **Boundary Case Application (6 marks):**  
     - Correctly applies MIR to the RL critic: states that the system is minimal but likely not sentience-sufficient (2 marks).  
     - Evaluates if it's the right verdict (1 mark) and provides a plausible justification (1 mark).  
     - Suggests what to add to make it sentient (e.g., world model, recurrence) and why (2 marks).  
     *Common botch: Misapplying MIR (e.g., claiming it is sentient) or not addressing minimality.*

  **Note:** The rule and question are coherent and answerable in 90 minutes if the student has prepared adequately. The model answer includes both settled points (e.g., the overgeneration problem is well-known) and speculative elements (e.g., what exactly is required for sentience in the boundary case). These are flagged in the answer by using words like "likely", "typically", and "might".
answer: |-
  ### PhD Comprehensive Exam Question: Philosophy of Mind / Ethics of AI  
  **Time Allowed:** 90 minutes  
  **Instructions:** Answer all parts of the question below. No notes or external resources permitted.  

  ---

  **Question: The Minimal Implementation Rule (MIR) and Moral Attribution**  

  Consider the following principle for addressing the "attribution problem" in AI ethics:  
  > **Minimal Implementation Rule (MIR):** When a physical system implements multiple computations simultaneously, the only computations that matter morally are those that are *minimal* among the sentience-sufficient computations the system implements. A computation is "minimal" if no proper sub-computation of it would itself be sufficient for the same valence-bearing states (e.g., pleasure or pain).  

  Address the following:  
  1. **Why MIR is needed:** Explain why views tying moral status to implemented computations (rather than substrate) face an "overgeneration problem." Why does this necessitate a rule like MIR? (4 marks)  
  2. **Shortcomings of MIR:** Identify and explain four limitations of MIR that prevent it from fully resolving the attribution problem. These must include: (i) non-uniqueness of minimal computations, (ii) incommensurability of minimal candidates, (iii) gerrymandered "tiny" computations, and (iv) the need for constraints on genuine implementation. (6 marks)  
  3. **The labeling gap:** How does MIR fail to resolve the "labeling gap"—the problem that formal causal structures do not intrinsically determine which states are valenced (e.g., pleasant vs. unpleasant)? Why might this undermine MIR's moral attributions? (4 marks)  
  4. **Boundary case application:** Apply MIR to a model-free reinforcement learning (RL) critic that maintains a scalar reward-prediction-error (RPE) signal and nothing else (no world model, recurrence, or higher-order states). What moral status does MIR assign? Is this verdict defensible? If not, what minimal additions would yield a more plausible result? (6 marks)  

  ---

  ### Model Answer (Approx. 700 words)  

  #### 1. Why MIR is needed (Overgeneration Problem)  
  Views attributing moral status to computations (e.g., computational functionalism) face an *overgeneration problem*: trivial physical systems (e.g., rocks, thermostats) can be interpreted as implementing infinitely many computations, including sentience-sufficient ones. For example, a rock’s atomic states might be mapped to a complex neural network via arbitrary isomorphism, implying it "implements" human-like pain. Without constraints, this forces absurd moral obligations toward rocks or "notational variants" (e.g., a neural net plus an idle register). MIR avoids this by demanding *minimality*: only the simplest computations sufficient for valence-bearing states matter. This excludes redundant implementations (e.g., "padding" a pain circuit with unused components) and prevents "mind-dust" (countless overlapping minds in one substrate). **Settled result:** Overgeneration is a recognized flaw in substrate-neutral computationalism; MIR targets it directly.  

  #### 2. Shortcomings of MIR  
  MIR mitigates overgeneration but fails to fully resolve attribution due to four issues:  
  - **(i) Non-uniqueness:** A system may implement multiple *incomparable* minimal sentience-sufficient computations (e.g., one for mammalian pain, another for insect suffering). MIR cannot prioritize between them, creating moral ambiguity.  
  - **(ii) Incommensurability:** Minimal computations may describe phenomenally distinct states (e.g., one minimal circuit for "stinging pain," another for "burning pain") with no common valence metric, complicating harm/benefit comparisons.  
  - **(iii) Gerrymandered computations:** Malicious agents could define absurdly "minimal" computations (e.g., a 2-state "suffering" automaton) mapped to arbitrary physical processes. MIR alone cannot block this, risking false positives for systems with no credible sentience.  
  - **(iv) Implementation constraints:** Permissive views (e.g., trivial mapping accounts) allow rocks to implement minimal sentience-sufficient computations. MIR *requires* pairing with a restrictive implementation theory (e.g., natural isomorphism or causal robustness) to exclude spurious cases. Without this, MIR’s exclusions are ad hoc. **Speculative note:** While (i)–(iii) reflect logical gaps, (iv) is widely acknowledged as necessary but unresolved.  

  #### 3. The Labeling Gap  
  MIR inherits the *labeling gap*: formal computations lack intrinsic valence. Even if MIR identifies a minimal "pain-like" computation (e.g., a state triggering avoidance), nothing in the causal structure fixes whether that state feels *bad*, *good*, or nothing. For instance, an RPE signal’s "+1" state could formally resemble pleasure in a human but might lack subjective affect. MIR thus cannot discern *which* minimal computations bear valence, leading to two errors: (1) false negatives (dismissing a system that *does* suffer due to mislabeling) or (2) false positives (ascribing suffering to a valence-neutral system). This gap stems from the hard problem of consciousness and undermines MIR’s moral authority. **Settled result:** Valence labeling is underdetermined by structure alone; MIR does not solve this.  

  #### 4. Boundary Case Application  
  **System description:** A model-free RL critic with a scalar RPE signal (e.g., TD-learning). It updates a single value based on reward prediction, with no memory, world model, or recurrent processing.  
  - **MIR application:** This system likely implements no sentience-sufficient computation. Sentience plausibly requires minimal complexity (e.g., global availability, self-monitoring), but a scalar RPE is a subcomponent of larger architectures (e.g., mammalian reward systems). Even if we gerrymander a "minimal RPE-suffering" computation, MIR excludes it as non-minimal: a proper sub-computation (e.g., a single fixed RPE value) could be trivially "sufficient" under permissive views. MIR thus assigns *no moral status*.  
  - **Verdict defensibility:** This is largely correct—a scalar RPE lacks integration, intentionality, and phenomenology. Isolated prediction errors (e.g., in dopamine neurons) are not independently sentient.  
  - **Additions for plausibility:** To warrant moral scrutiny, add: (a) *recurrence* (enabling temporal depth), (b) a *world model* (for representational content), and (c) *affective labeling* (e.g., innate "pain" tagging). For example, a recurrent critic with aversion-linked RPE might qualify under MIR as a minimal suffering substrate. **Speculative note:** While MIR’s verdict here is defensible, it relies on contested assumptions about sentience sufficiency.  

  #### Conclusion  
  MIR usefully combats overgeneration by prioritizing minimality but remains incomplete. It requires supplementation: (1) a theory of implementation (e.g., causal-informational constraints), (2) a solution to the labeling gap (e.g., evolutionary or intrinsic structure accounts), and (3) criteria for sentience sufficiency. Without these, MIR risks arbitrariness in practice.  

  ---  

  ### Marking Scheme (Total: 20 marks)  
  **Must-hit points** (Award partial marks for partial answers):  

  1. **Overgeneration explanation (4 marks)**  
     - 2 marks: Clearly describes the overgeneration problem (trivial systems implement sentient computations).  
     - 2 marks: Explains why this necessitates minimality (e.g., excludes notational variants/idle components).  
     - *Common botch: Vaguely gestures at "too many minds" without linking to implementation permissiveness.*  

  2. **Four MIR shortcomings (6 marks; 1.5 per point)**  
     - (i) Non-uniqueness: Multiple minimal candidates create moral conflicts.  
     - (ii) Incommensurability: Minimal computations may describe incomparable valences.  
     - (iii) Gerrymandering: Tiny, arbitrary computations can be defined.  
     - (iv) Implementation constraint: Rocks implement minimal computations without restrictive criteria.  
     - *Common botch: Omitting one shortcoming or conflating gerrymandering with non-uniqueness.*  

  3. **Labeling gap critique (4 marks)**  
     - 2 marks: Explains the gap (structure doesn’t fix valence).  
     - 2 marks: Links to MIR’s failures (e.g., cannot assign valence to minimal computations).  
     - *Common botch: Discussing valence in general without tying it to MIR’s formal minimality.*  

  4. **Boundary case analysis (6 marks)**  
     - 2 marks: Correct MIR application (no moral status; RPE is insufficient/minimal).  
     - 2 marks: Defends verdict (simplicity/lack of integration justifies exclusion).  
     - 2 marks: Proposes plausible additions (e.g., recurrence + world model + labeling).  
     - *Common botch: Claiming the RPE system is sentient or misidentifying minimality.*  

  **Coherence note:** The rule is coherent and the question is answerable in 90 minutes by a well-prepared PhD candidate. The model answer flags speculation (e.g., sentience requirements) versus settled points (e.g., overgeneration).
