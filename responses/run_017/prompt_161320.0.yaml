prompt: |-
  Two members of my reading group have spent months on Gödel's rotating-universe solutions, and the usual rationalist-blog treatments of the block universe just restate the disagreement rather than locating it, so I want the document they should have produced instead: a joint statement from an adversarial collaboration between a Gödel-style idealist, who takes those solutions to show that the lapse of time is not an objective feature of the world, and a temporal realist who thinks the solutions at most refute a package deal of a global "now" plus absolute simultaneity and leave temporal structure itself perfectly real.

  The deliverable: a numbered section of claims both could sign — about what a global time function is and why closed timelike curves preclude one, about which solutions are even candidate descriptions of a universe like ours, and about what an argument from "this is a solution of the field equations" to a conclusion about time would have to establish — followed by a disagreements table in which each row is worded so that the side holding it would accept the wording as its own position. I suspect part of the fight is verbal and that "time is unreal" is doing at least three separate jobs; if so, say which part is verbal, what the distinct readings are, and which substantive claims survive the disambiguation.

  Then give me the cruxes — the sub-questions such that settling one would move at least one side — and, for each crux, a case both sides agree would bear on it, with each side's prediction written down in advance. For the cases, work with these two, which I have not managed to use to break the tie: (A) a model locally indistinguishable from ours at every event, but in which closed timelike curves pass through every event while every such curve's total proper time exceeds the lifespan of any observer who could traverse it; and (B) a model in which closed timelike curves are confined to a bounded region and a global time function exists everywhere else. For each, say what each side predicts the right treatment to be, and why it does or does not bear on their dispute. Please stay neutral throughout — I want a text both could put their names to, not a verdict on who wins.
reasoning: |-
  We are producing a joint statement from an adversarial collaboration between a Gödel-style idealist (I) and a temporal realist (R). The goal is to have a numbered section of agreed claims and a table of disagreements. Then, we identify cruxes and analyze two cases (A and B) as specified.

  ## Section I: Agreed Claims

  1. **Definition of a Global Time Function**: Both parties agree that a global time function is a smooth function \( t: \mathcal{M} \to \mathbb{R} \) on the spacetime manifold \(\mathcal{M}\) such that:
     - Its gradient \(\nabla t\) is everywhere timelike and future-directed (i.e., \( g(\nabla t, \nabla t) < 0 \) and it defines a consistent time orientation).
     - The level sets \( t = \text{constant} \) are spacelike hypersurfaces (i.e., the metric induced on these hypersurfaces is Riemannian).

  2. **Closed Timelike Curves (CTCs) and Global Time Functions**: Both parties agree that the existence of a closed timelike curve (CTC) in a spacetime is incompatible with the existence of a global time function. This is because a CTC would require the time function to both increase and return to the same value along the curve, violating the requirement that the time function must strictly increase along every future-directed timelike curve.

  3. **Gödel's Solution**: Both parties agree that Gödel's rotating-universe solution is an exact solution to Einstein's field equations for a homogeneous, rotating universe with a negative cosmological constant and dust. This solution contains CTCs passing through every point.

  4. **Candidate Descriptions of Our Universe**: Both parties agree that for a solution to be a candidate description of our universe, it must be compatible with the following observational facts:
     - The universe is expanding (as evidenced by Hubble's law).
     - The universe is approximately isotropic and homogeneous on large scales (cosmological principle).
     - There is no observational evidence for CTCs in our universe.

     Therefore, Gödel's solution, which is stationary and contains CTCs, is not a candidate description of our universe.

  5. **Requirements for an Argument from Field Equations to a Conclusion about Time**: Both parties agree that an argument from "this is a solution of the field equations" to a conclusion about the nature of time must establish:
     - That the solution is physically reasonable (e.g., satisfies energy conditions, is stable, etc.).
     - That the solution is globally hyperbolic (i.e., admits a global time function) if one wishes to conclude that time is "real" in the sense of having a global temporal ordering. Conversely, the presence of CTCs must be shown to be a robust feature (not an artifact of idealization) to conclude that time is not real in the sense of a global temporal ordering.
     - That the solution is compatible with the observed universe, or at least that the features in question (like CTCs) are not confined to regions that are unobservable or irrelevant to the local experience of time.

  ## Section II: Disagreements Table

  The table below lists the disagreements. Each row is worded so that the side holding it would accept the wording as its own position.

  | Disagreement                                                                                             | Held by |
  |----------------------------------------------------------------------------------------------------------|---------|
  | The lapse of time (i.e., the becoming of future events and the passing of past events) is an objective feature of the world. | R       |
  | The lapse of time is not an objective feature of the world; it is an illusion arising from the way conscious beings are embedded in the universe. | I       |
  | The existence of CTCs in any solution (like Gödel's) shows that the lapse of time cannot be fundamental, even in spacetimes that are not globally hyperbolic, because it undermines the notion of a unique global temporal order. | I       |
  | The existence of CTCs in some solutions (like Gödel's) only shows that a global "now" and absolute simultaneity are untenable, but the local temporal structure (including the lapse of time) remains real and is not undermined by the possibility of such solutions. | R       |
  | The absence of a global time function in a solution (due to CTCs) implies that time itself (as the lapse) is not real. | I       |
  | The absence of a global time function only implies the absence of a global temporal ordering, but the local experience of time (as recorded by clocks along worldlines) is still real and is not negated by the global structure. | R       |
  | The possibility of CTCs, even in idealized solutions, is sufficient to show that the lapse of time is not an objective feature of the world. | I       |
  | The possibility of CTCs in idealized solutions does not threaten the reality of time because such solutions are not physically realistic (violate energy conditions, are unstable, or do not match observation) and because the local experience of time is fundamental. | R       |

  ## Section III: Verbal Ambiguities in "Time is Unreal"

  The phrase "time is unreal" is ambiguous and may be doing at least three jobs:

  1. **Denial of a global temporal ordering**: This is the claim that there is no global time function that orders all events in the universe. Both parties agree that this is true in Gödel's universe (because of CTCs) and that such a function does not exist in any spacetime with CTCs. This is a substantive claim about the global structure of spacetime.

  2. **Denial of the lapse of time (becoming)**: This is the claim that the apparent flow of time (the distinction between past, present, and future) is not an objective feature of reality. This is the central disagreement between I and R. I holds that the lapse is not real, while R holds that it is.

  3. **Denial of temporal relations altogether**: This would be the claim that there are no temporal relations (such as earlier-than, later-than) between events. Neither I nor R holds this extreme position. Both agree that in the absence of CTCs, there is a partial temporal ordering. Even in the presence of CTCs, local temporal relations exist (though they may not extend globally).

  The substantive claims that survive disambiguation are:
  - Disagreement about the reality of the lapse of time (becoming).
  - Disagreement about whether the existence of CTCs (even in idealized models) undermines the reality of the lapse of time.

  ## Section IV: Cruxes and Cases

  We now present cruxes (sub-questions that would move at least one side) and analyze two cases (A and B). For each crux, we provide a case both sides agree would bear on it, and each side's prediction.

  ### Crux 1: Is the lapse of time (becoming) dependent on the global structure of spacetime?

  - **Idealist (I)**: The lapse of time is dependent on the global structure. If the global structure does not allow a consistent temporal ordering (due to CTCs), then the lapse of time cannot be real.
  - **Realist (R)**: The lapse of time is independent of the global structure. It is a local feature, experienced along worldlines, and does not require a global time function.

  **Case A**: A model locally indistinguishable from ours at every event, but with CTCs passing through every event, and every CTC's total proper time exceeds the lifespan of any observer who could traverse it.

  - **Idealist (I)**: This model shows that time is unreal. Even though no observer can traverse a full CTC, the existence of CTCs means there is no global temporal order. The lapse of time is therefore not fundamental. The fact that the proper time along CTCs is too long for any observer is irrelevant because the global structure is what matters.
  - **Realist (R)**: This model does not threaten the reality of time. Locally, time is experienced as usual. The CTCs are not traversable by any observer, so they are irrelevant to the local experience of time. The lapse of time is real because it is a feature of local physics and consciousness. The global structure does not negate the local reality.

  **Bearing on the dispute**: 
  - I would say that Case A bears on the dispute because it shows that the global structure precludes a global time function and thus undermines the reality of time. 
  - R would say that Case A does not bear on the dispute because the local experience is what matters, and the CTCs are not accessible to observers. 

  **Effect on the crux**: 
  - If it were shown that in such a universe, observers experience time as usual (which they do locally), R would take that as supporting their view. 
  - I would argue that the global structure still undermines the objectivity of becoming, regardless of local experience.

  ### Crux 2: Can the reality of the lapse of time be maintained if CTCs are present but confined to a bounded region?

  - **Idealist (I)**: The presence of CTCs anywhere in the universe, even in a bounded region, undermines the reality of the lapse of time because it shows that the global structure does not support a consistent temporal order. The lapse of time must be global to be objective.
  - **Realist (R)**: The lapse of time is a local phenomenon. As long as there is a region (like the one we inhabit) without CTCs, the reality of time in that region is unaffected by the existence of CTCs elsewhere.

  **Case B**: A model in which CTCs are confined to a bounded region and a global time function exists everywhere outside that region.

  - **Idealist (I)**: This model still shows that time is unreal because the entire universe does not admit a global time function (due to the bounded region with CTCs). The lapse of time is not an objective feature of the whole universe.
  - **Realist (R)**: In this model, the region without CTCs has a well-defined temporal structure. The lapse of time is real in that region. The existence of a bounded region with CTCs does not affect the reality of time in the rest of the universe.

  **Bearing on the dispute**: 
  - I would say that Case B bears on the dispute because it shows that the universe as a whole does not have a global time function, and thus time is not real objectively. 
  - R would say that Case B does not threaten the reality of time in the region without CTCs, which is where we are and where time is experienced.

  **Effect on the crux**: 
  - If it were shown that the region without CTCs has a consistent temporal order and that observers there experience the lapse of time, R would take that as confirming their view. 
  - I would argue that the global inconsistency (even if confined) shows that the lapse of time is not fundamental.

  ### Conclusion of the Collaboration

  This document has set out the agreed claims, the disagreements, the verbal ambiguities, and the cruxes with test cases. The two sides remain divided on the fundamental issue of whether the lapse of time (becoming) is an objective feature of the world and whether it depends on the global structure of spacetime. The cases A and B were analyzed, and each side provided their predictions. The hope is that this clarifies the points of disagreement and identifies the key questions that would need to be resolved to advance the debate.

