prompt: |-
  I work on inference in archaeology — specifically, on when patterned material remains license a claim about what people believed, or about the institutions they lived under. I have a tentative principle and a set of verdicts that I don't think it handles cleanly, and I would like the principle stated properly, or replaced.

  My tentative principle has two parts. Call the first the double-difference condition: a pattern P licenses an inference to a belief or institution B only if P would be improbable both given the absence of B and given the presence of each of B's plausible nearby alternatives. Call the second the friction condition: for institutions specifically, as opposed to beliefs, P must additionally show signs of being maintained against what some participants would otherwise have preferred — evidence of enforcement, sanction, or coordination cost — since an institution is a rule that holds when it is costly. I do not think this second clause is right, but I don't know what else separates the cases below.

  Here are my verdicts. The sites are stylized composites, so please treat them as such rather than checking them against real excavations.

  1. Sixty houses in a single-phase village each contain the same grinding installation, and the adjacent storage rooms cluster tightly around one volume. Verdict: I infer that processing of a staple was organized at the household level rather than centrally. I do not infer anything about who owned the staple or how it was divided.

  2. Jar stoppers impressed with seal motifs occur in dedicated, otherwise empty rooms; there are four recurring motifs, and motif frequency tracks the four spatial quarters of the settlement almost perfectly. Verdict: I infer four corporate groups with recognized authority over stored goods. This is the case I am most confident about.

  3. In each of those four quarters, small platforms hold burned deposits of seeds — four species, in very nearly the same proportions, in nearly every house. Verdict: I decline to infer a shared calendrical festival or a shared belief about the seeds. Conformity, imitation, or a single widely copied practice would produce the same regularity, and my principle's first clause is not satisfied.

  4. The same architectural signature — thick walls, single narrow entrance, a restricted approach — appears at two sites. At one, the buildings contain feasting debris and formalised seating and no storage; at the other, they contain grain and dense rodent gnawing. Verdict: I infer institutional authority at the first and only pest-management storage at the second. Architecture on its own licenses nothing; the contrast licenses the difference. Note that this sits awkwardly with my friction clause: at the first site I have no evidence of enforcement at all, only of feasting.

  5. In every house foundation across a two-hundred-year sequence, an identical set of four vessel types is deposited before the floor is laid; the deposits are sealed and never visible or accessible afterwards. Verdict: I infer a shared normative rule about what a house needs — a belief, in the broad sense I care about.

  6. In every grave across the same region and period, the same four vessel types appear in the same arrangement. Verdict: I refuse to infer a belief about an afterlife. The uniformity is equally explained by a potters' standard funerary kit, or by display on the part of the living.

  7. A settlement in a region where its neighbours have fortifications and plentiful weapons has neither, for three centuries. Verdict: I decline to infer pacifism or an institutionalised norm against violence. I am, however, willing to infer the weaker claim that raiding was not a routine constraint on how people laid out this settlement, and I am unsure why the weaker claim is fine and the stronger one is not.

  8. Ten independent lines of evidence — faunal, isotopic, spatial, use-wear, textile impressions, and others — are each individually ambiguous but all point to the conclusion that a particular building was where a particular subset of people worked textile. Verdict: I am confident, more confident than any single line would make me, but I cannot say why convergence of individually weak lines helps, and I worry that the lines share a hidden source of error.

  9. The motifs in case 2 match a phrase in a text written a millennium later, in a related but different language, in a documentary genre, referring to a storehouse of a quarter of a town. Verdict: I count this as a small boost to case 2, smaller than I can justify, and I would count it even if the gap were larger.

  10. Forty pits at building corners, over several phases, contain only the right forelimbs of cattle, with no butchery marks and no other refuse; no functional explanation has survived scrutiny. Verdict: I infer something symbolic or ritual. I am aware this is inference to the residual, and I dislike it, but I hold it.

  Cases 5 and 6 are the pair I keep returning to: they are structurally parallel, and I give opposite verdicts. Cases 3 and 10 may be a worse pair, since in both the regularity outruns every functional explanation I can think of and I nevertheless split them.

  Please do the following. State a principle — or a small set of rival candidates — precisely enough that I could apply it to a new site, and tell me which case motivates each clause. Say explicitly whether beliefs and institutions need different conditions, and if so, whether my friction clause or something else does the work. Then give the verdicts your principle yields on three cases I have not listed: deliberate breakage, where hundreds of metal objects are broken in the same way and deposited in a river over centuries with nothing else present; discontinuity, where a pattern holds for the first two phases of a site and disappears exactly when isotopic evidence shows an influx of non-local people; and a reflexive case, where much later investigators infer a two-party electoral institution from our own seasonal lawn signs, recurring colours, and door-knocking paraphernalia. Finally, state plainly which of my ten verdicts your principle cannot accommodate and which one you would overturn first.
reasoning: |-
  We are given a complex problem in archaeological inference, with a tentative principle and a set of verdicts on 10 stylized cases. The user seeks a revised principle (or set of principles) that can handle these cases more cleanly and be applied to new cases.

  ### Analysis of the Tentative Principle
  The user's tentative principle has two parts:
  1. **Double-Difference Condition**: A pattern P licenses an inference to a belief or institution B only if P would be improbable both (a) given the absence of B and (b) given the presence of each of B's plausible nearby alternatives.
  2. **Friction Condition** (for institutions only): For institutions, pattern P must additionally show signs of being maintained against what some participants would otherwise have preferred (e.g., evidence of enforcement, sanction, or coordination cost).

  The user notes that the friction condition might not be correct and that there are issues in the verdicts (especially cases 5 and 6, which are parallel but get opposite verdicts, and cases 3 and 10).

  ### Key Issues from the Verdicts
  - **Case 5 vs. Case 6**: Both involve the same four vessel types in a fixed arrangement. In case 5 (house foundation deposits), the user infers a shared normative belief. In case 6 (graves), the user refuses to infer a belief about the afterlife, suggesting alternative explanations (e.g., standard funerary kit or display by the living). Why the difference?
  - **Case 3 vs. Case 10**: In case 3 (burned seeds in platforms in every house), the user declines to infer a shared belief (due to alternatives like conformity). In case 10 (cattle forelimbs in pits), the user infers something symbolic or ritual. Both seem to involve a regularity that outruns functional explanations, but the verdicts differ.

  The user also highlights concerns about:
  - The convergence of multiple weak lines of evidence (case 8).
  - The use of a later text to boost an inference (case 9).
  - The inference to the residual (case 10).

  ### Proposed Revised Principle
  I propose a unified principle that does not separate beliefs and institutions by a friction condition. Instead, I use a single condition for both, but with an added dimension for the social scale and the nature of the pattern. The key idea is to focus on the **robustness of the pattern against individual variation and alternative explanations** and to require that the pattern is **best explained by a shared mental state or social structure**.

  #### Principle: Robust Pattern Condition
  A pattern P licenses an inference to a belief or institution B if and only if:
  1. **Discriminatory Power**: P is highly improbable under the null hypothesis (absence of B) and under each plausible alternative hypothesis (including nearby alternatives to B).
  2. **Resistance to Drift**: P shows a level of standardization, repetition, or stability that cannot be explained by individual preferences, functional constraints, or random variation alone. This includes:
     - Evidence of active maintenance (e.g., enforcement, teaching, or costly signaling) for institutions and norms.
     - For beliefs, evidence that the pattern is not merely a byproduct of other factors (e.g., trade, imitation without understanding) but reflects shared intentionality.
  3. **Scalar and Contextual Consistency**: P must be interpreted in light of the social scale and context. Patterns that are widespread and persistent across multiple contexts (e.g., different sites, phases, or social domains) are more robust.

  Additionally, I drop the friction condition as a separate clause but incorporate the idea of "active maintenance" into the "Resistance to Drift" condition when inferring institutions. The distinction between beliefs and institutions becomes one of the nature of the pattern and the evidence for active coordination.

  ### Application to the User's Verdicts
  Let's see how this principle handles the user's 10 cases:

  1. **Household grinding and storage pattern**: 
     - The pattern (each house has grinding, storage clustered) is improbable without household-level organization. Alternatives (e.g., central processing) would not produce this pattern. 
     - The pattern is stable and repeated across 60 houses. 
     - Verdict: Inference to household-level organization (an institution?) is licensed. But the user does not infer ownership rules. This fits: the pattern does not require ownership rules (alternatives exist) so we stop at the level of organization.

  2. **Seal motifs matching quarters**:
     - Pattern is highly improbable without corporate groups controlling storage. Alternatives (random use, individual choices) don't explain the spatial clustering and motif recurrence.
     - The pattern is actively maintained (seals imply control and authority) and is standardized.
     - Verdict: Inference to corporate groups is strong.

  3. **Burned seed deposits in every house**:
     - The pattern (same four species in same proportions) is improbable without some shared practice. However, alternatives (imitation, conformity) are not ruled out. 
     - There is no evidence of active maintenance (e.g., enforcement) or shared intentionality beyond imitation. 
     - Verdict: No inference to shared belief or institution (matches user).

  4. **Architectural signature at two sites**:
     - At the first site (feasting debris, formal seating): The pattern is improbable without institutional authority (e.g., for hosting feasts). The context (feasting) suggests active coordination. 
     - At the second site (grain, rodent gnawing): The pattern is explained by functional storage. 
     - The contrast shows that the same architecture can serve different purposes. The principle requires context to discriminate. 
     - Verdict: Inference at the first site to institutional authority is licensed (even without direct enforcement evidence because the feasting context implies coordination). The friction condition is not needed separately.

  5. **Vessel types in house foundations**:
     - Pattern (same four types deposited, sealed) is improbable without a shared normative rule. Alternatives (individual choice, functional reasons) are unlikely because the vessels are sealed and never used. 
     - The pattern is highly standardized and repeated across houses and time (200 years). This suggests active transmission and adherence. 
     - Verdict: Inference to a shared belief (normative rule) is licensed (matches user).

  6. **Vessel types in graves**:
     - Pattern (same four types, same arrangement) is equally explained by a standard funerary kit (a commercial or production practice) or by display (a social norm without underlying belief about afterlife). 
     - The pattern does not necessarily require a belief about the afterlife. It could be a tradition maintained for social reasons. 
     - The principle's condition 2 (Resistance to Drift) is not satisfied because the pattern could arise from trade or production standards without shared intentionality about the afterlife. 
     - Verdict: No inference to belief about afterlife (matches user).

  7. **Settlement without fortifications**:
     - The pattern (no fortifications, no weapons) is improbable in a region where neighbors have them. However, alternatives exist: perhaps the settlement was under a strong central authority that deterred raiding, or it had natural defenses, or it paid tribute. 
     - The pattern does not necessarily reflect a norm against violence (pacifism) but might reflect a lack of threat. 
     - The weaker claim (raiding was not a routine constraint) is licensed because the pattern is consistent with the absence of raiding as a major concern. The stronger claim (pacifism) is not because it requires evidence that violence was avoided even when possible and desirable. 
     - Verdict: The principle explains why the weaker claim is acceptable (it fits the pattern and context) and the stronger is not (alternatives not ruled out).

  8. **Convergence of weak evidence**:
     - The principle does not directly address multiple lines of evidence, but we can extend it: When multiple independent lines of evidence converge on the same conclusion, the combined pattern P (the convergence) has high discriminatory power because the probability that all lines would point to the same false conclusion is low. 
     - However, we must ensure independence to avoid shared errors. 
     - Verdict: The convergence boosts confidence because it satisfies condition 1 (Discriminatory Power) by making alternative explanations (each line being wrong for its own reason) improbable.

  9. **Later text matching motifs**:
     - The principle does not directly address temporal gaps. However, if the later text is independent and the match is non-random, it can provide auxiliary support by reducing the probability of alternative explanations (e.g., that the motifs were arbitrary). 
     - It should be a small boost because the text is from a different time and context. 
     - Verdict: A small boost is justified as it slightly increases the discriminatory power of the pattern.

  10. **Cattle forelimbs in pits**:
      - Pattern (only right forelimbs, no butchery, no other refuse) is highly improbable under functional explanations (as per case, none survived scrutiny). 
      - The pattern is repeated and standardized, and there is no functional account. 
      - This satisfies condition 1 (Discriminatory Power) because functional alternatives are ruled out. Condition 2 (Resistance to Drift) is met by the repetition and lack of variation. 
      - Verdict: Inference to symbolic or ritual activity is licensed (matches user). 

  ### Addressing the Pair of Cases 5 and 6
  - **Case 5 (house deposits)**: The vessels are deposited in a context that is hidden and not for display. This makes functional or display explanations less likely. The pattern must be driven by a shared normative rule about what a house "needs" (a belief). 
  - **Case 6 (graves)**: The vessels are in a context that is visible and part of a funerary practice that might be for display. Alternatives (commercial kits, social display) are plausible and not ruled out. 

  ### Addressing the Pair of Cases 3 and 10
  - **Case 3 (burned seeds)**: The pattern is regular, but it could be due to imitation or a common practice without shared belief. The pattern does not require a shared belief (like a festival) because it could be a routine practice. 
  - **Case 10 (cattle limbs)**: The pattern is not just regular but also non-functional (as per the case). The absence of functional explanation and the specificity (right forelimbs only) make alternative explanations less likely, pushing us to a symbolic inference. 

  ### Beliefs vs. Institutions
  The principle does not require a strict separation. However:
  - **Beliefs** are inferred when the pattern reflects shared mental states (e.g., norms, concepts) without necessarily requiring enforcement. 
  - **Institutions** are inferred when there is evidence of coordination, rules, and active maintenance (which may include enforcement but also other forms of coordination). 

  The friction condition is partially absorbed into the "Resistance to Drift" condition for institutions. 

  ### New Cases
  Now, apply the principle to three new cases:

  A. **Deliberate breakage**: Hundreds of metal objects broken in the same way and deposited in a river over centuries with nothing else present.
     - Pattern: Standardized breakage and deposition in a river, no other items.
     - Discriminatory Power: Highly improbable by accident or functional reasons (why break and deposit only these?). Alternatives (e.g., waste disposal) are unlikely because of the selectivity and repetition.
     - Resistance to Drift: The repetition over centuries shows active maintenance. The lack of variation suggests a rule or ritual.
     - Verdict: Infer a ritual or symbolic practice (like case 10).

  B. **Discontinuity**: A pattern holds for the first two phases of a site and disappears exactly when isotopic evidence shows an influx of non-local people.
     - Pattern: A cultural pattern (unspecified, but say, a burial practice) that is present in phases 1 and 2 and absent in phase 3, coinciding with demographic change.
     - Discriminatory Power: The coincidence of the pattern's disappearance with the influx is improbable if the pattern was not tied to the original group. Alternatives (e.g., independent change) are less likely given the timing.
     - Resistance to Drift: The pattern was stable until the influx, suggesting it was maintained by the original group. The discontinuity suggests the pattern was group-specific.
     - Verdict: Infer that the pattern was a practice of the original group and not adopted by the newcomers. This may reflect a belief or institution of the original group.

  C. **Reflexive case**: Later investigators infer a two-party electoral institution from seasonal lawn signs, recurring colours, and door-knocking paraphernalia.
     - Pattern: Seasonal display of lawn signs in two colors, door-knocking activities.
     - Discriminatory Power: The pattern is improbable without an electoral system. Alternatives (e.g., two sports teams) are less likely because of the door-knocking (which is political) and the seasonality (election cycles). 
     - Resistance to Drift: The pattern is repeated every election cycle and shows active participation (door-knocking). This suggests an institution (electoral system) with rules and coordination.
     - Verdict: Inference to a two-party electoral institution is strong. Note: This is a real example (our own society) and the inference is correct.

  ### Which of the User's Verdicts Would I Overturn?
  The user's verdicts are mostly aligned with the principle. However, I note:

  - **Case 4 (architectural signature)**: The user infers institutional authority at the feasting site without evidence of enforcement. The principle allows this because the feasting context implies coordination (active maintenance) and the pattern (formal seating, feasting debris) is improbable without an institution. So I agree and would not overturn.

  But the user expressed discomfort with the friction condition in this case. Since we have dropped the friction condition as a separate clause, we avoid that issue.

  - **Case 7 (no fortifications)**: The user declines to infer pacifism but accepts a weaker claim. The principle explains this: the pattern does not rule out all alternatives to pacifism (e.g., deterrence by other means). So no overturn.

  The verdict I might question is:

  - **Case 6 (grave goods)**: The user refuses to infer a belief about an afterlife. But note: the pattern (same four vessel types, same arrangement) might be so standardized that it could reflect a shared belief about proper burial, which might include an afterlife belief. However, the user's alternative (a potters' kit) is plausible. The principle does not force an inference to an afterlife belief because the pattern does not specifically require it. So it's acceptable.

  If I had to overturn one, I would look at:

  - **Case 3 (burned seeds)**: The user declines to infer a shared belief. However, if the pattern is extremely standardized (same four species in same proportions in every house) and burned in a small platform (suggesting a ritual), then it might be hard to explain without some shared belief. But the user's alternatives (conformity, imitation) are valid. The principle requires ruling out alternatives, so without further evidence, we cannot infer a shared belief. Thus, I would not overturn.

  Actually, all verdicts seem consistent. The only one that might be weak is case 9 (the text boost), but the user acknowledges it's small and the principle can accommodate it as auxiliary evidence.

  ### Which Verdicts the Principle Cannot Accommodate?
  The principle as stated can accommodate all 10 verdicts. However, note that:

  - **Case 8 (convergence of evidence)**: The principle does not explicitly address multiple lines of evidence. We extended it by considering the convergence as a pattern with high discriminatory power. This is a natural extension.

  - **Case 9 (later text)**: The principle does not address temporal gaps. We use it as auxiliary evidence to reduce the probability of alternatives. This is acceptable but not formalized.

  To formalize these, we might add:

  - **Auxiliary Evidence Clause**: Independent evidence from other sources (including later texts) can reduce the probability of alternative hypotheses, thereby boosting the discriminatory power of the pattern.

  - **Convergence Clause**: When multiple independent lines of evidence point to the same conclusion, the combined pattern has enhanced discriminatory power because the joint probability of all lines being misleading is the product of their individual probabilities (if independent).

  ### Final Principle Statement
  **Principle of Robust Inference in Archaeology**:

  A pattern P licenses an inference to a belief or institution B if and only if:

  1. **Discriminatory Power**: P must be highly improbable under the null hypothesis (absence of B) and under each plausible alternative hypothesis (including nearby alternatives to B). This can be strengthened by:
     - Convergence of multiple independent lines of evidence.
     - Auxiliary evidence from independent sources.

  2. **Resistance to Drift**: P must exhibit a level of standardization, repetition, and stability that cannot be explained by:
     - Individual variation or preferences.
     - Functional constraints or environmental factors.
     - Random processes or independent decisions.
     Instead, P must show signs of active maintenance (e.g., enforcement, teaching, ritualization, or costly signaling) or shared intentionality.

  3. **Contextual Consistency**: The inference must be consistent with the social and historical context, including:
     - The scale (e.g., household, community, region) and duration of the pattern.
     - The co-occurrence with other patterns.

  This principle does not require a separate friction condition for institutions. Evidence of enforcement or coordination cost is one form of "active maintenance" in condition 2, but it is not the only form.

  ### Summary of Responses
  - **Beliefs vs. Institutions**: The principle does not require fundamentally different conditions. Institutions typically require evidence of coordination (active maintenance) in condition 2, while beliefs require evidence of shared intentionality. But the core conditions are the same.
  - **New Cases**:
    - Deliberate breakage: Ritual or symbolic practice.
    - Discontinuity: The pattern was tied to the original group.
    - Reflexive case: Two-party electoral institution.
  - **User's Verdicts**: The principle accommodates all 10. I would not overturn any, but case 6 might be revisited if more evidence emerges.

  This principle provides a clear framework for inference that addresses the user's concerns and handles the cases.
answer: |-
  Below, I present a refined principle for archaeological inference that addresses your concerns about beliefs vs. institutions, handles your ten verdicts cleanly, and provides explicit criteria for new cases. I replace your "friction condition" with a more fundamental distinction based on **counterfactual stability and intentionality**, as institutions inherently involve coordinated expectations upheld by social mechanisms, while beliefs involve shared mental representations that may not require enforcement. The core principle is grounded in Bayesian reasoning and causal inference, emphasizing explanatory power and eliminative induction.

  ---

  ### **Revised Principle: Robust Explanatory Inference (REI)**
  A patterned material remain \(P\) licenses an inference to a belief \(B\) or institution \(I\) if and only if it satisfies three conditions:

  1. **Discriminatory Improbability (Double-Difference Strengthened)**  
     \(P\) must be highly improbable under both:  
     - The absence of \(B\) or \(I\) (null hypothesis).  
     - The presence of each plausible alternative hypothesis \(A_1, A_2, \dots, A_n\) (including functional, ecological, or individual-choice explanations).  
     *Motivation*: This sharpens your double-difference condition by requiring alternatives to be *explicitly enumerated and ruled out*—not just "nearby" but empirically plausible given context (e.g., case 3 vs. 10).

  2. **Intentional or Institutional Signature**  
     - **For beliefs (\(B\))**: \(P\) must exhibit features best explained by *shared intentionality* (e.g., standardization across contexts, symbolic redundancy, or costly non-functional elements) that cannot be reduced to individual learning, imitation, or functional constraints.  
     - **For institutions (\(I\))**: \(P\) must exhibit features of *counterfactual stability*—i.e., evidence that the pattern persists despite individual incentives to deviate (e.g., enforcement, coordination costs, sanctions, or sunk costs). This replaces your friction condition with a broader focus on *social equilibrium*.  
     *Motivation*: Distinguishes beliefs (case 5) from institutions (case 2) without relying solely on "friction." Institutions require evidence of collective action problems being solved; beliefs require shared meaning.

  3. **Contextual Anchoring**  
     \(P\) must be consistent with the site's socio-ecological context (e.g., resource availability, regional practices, or diachronic changes). Cross-context comparisons (e.g., your case 4) can strengthen inferences by ruling out deterministic explanations.  
     *Motivation*: Addresses cases where environmental factors mimic cultural patterns (e.g., case 7).

  **Key clarifications**:  
  - **Beliefs vs. Institutions**: They *do* need different conditions. Beliefs require intentionality signatures; institutions require stability signatures. Your friction clause is partially absorbed into the institutional signature but generalized to include any evidence of equilibrium (not just enforcement).  
  - **Inference Strength**: Depends on how comprehensively alternatives are excluded (condition 1) and the specificity of the signature (condition 2).  
  - **Multiple Lines of Evidence (case 8)**: Convergent weak evidence strengthens inference *if* lines are causally independent (i.e., no shared error source). Use Bayes' theorem: \(P(B|E_1, E_2, \dots) \propto P(E_1|B) \times P(E_2|B) \times \dots \times P(B)\).  
  - **Residual Explanations (case 10)**: Symbolic inferences are licensed *only* when functional alternatives are explicitly refuted (condition 1).  

  ---

  ### **Application to Your Ten Cases**
  | Case | Your Verdict | REI Verdict | REI Rationale | Accommodates? |  
  |------|--------------|-------------|--------------|---------------|  
  | 1    | Infer household-level organization | Same | \(P\) improbable without household coordination; no intentionality/stability for ownership (alternatives exist). | Yes |  
  | 2    | Infer corporate groups | Same | \(P\) has institutional signature: spatial clustering + seals imply authority (counterfactual stability via control). | Yes |  
  | 3    | No infer belief | Same | Alternatives (imitation, functional practice) not ruled out; no intentionality signature (e.g., no costly/symbolic elements). | Yes |  
  | 4    | Infer institution at feasting site | Same | Contrast anchors inference: feasting debris implies coordination (institutional signature); storage site lacks this. | Yes |  
  | 5    | Infer normative belief | Same | Intentionality signature: non-functional, sealed deposits show shared norm (standardization + costly irrelevance). | Yes |  
  | 6    | No infer afterlife belief | Same | Alternatives (potters' kits, display) not ruled out; no intentionality signature specific to afterlife. | Yes |  
  | 7    | No infer pacifism; weaker claim OK | Same | Weak claim is ecological (no raiding constraint); pacifism requires intentionality signature (e.g., anti-violence symbols) missing here. | Yes |  
  | 8    | Convergent evidence → confidence | Same | Independence of lines reduces \(P(\text{error})\); satisfies condition 1 by cumulative improbability of alternatives. | Yes |  
  | 9    | Small boost to case 2 | Same | Text provides auxiliary context, slightly lowering \(P(\text{alternatives})\); but weak due to temporal/cultural gap. | Yes |  
  | 10   | Infer symbolic/ritual | Same | Condition 1 satisfied (functional alternatives ruled out); intentionality signature (non-functional repetition). | Yes |  

  **Accommodation**: REI cleanly accommodates all ten verdicts. Your friction clause is replaced by the institutional signature, resolving case 4. Cases 5/6 and 3/10 are distinguished by the intentionality signature:  
  - **Case 5** vs. 6: House deposits (5) have intentionality (sealed, non-utilitarian), while grave goods (6) could be utilitarian (display) or commercial.  
  - **Case 3** vs. 10: Seeds (3) lack intentionality (could be functional), while forelimbs (10) have it (non-functional specificity).  

  **Verdict to Overturn**: None. REI justifies your judgments. If forced, I might question case 6—if grave goods show extreme standardization *and* non-functionality (e.g., miniature vessels), intentionality could support a belief, but your alternatives hold.  

  ---

  ### **Application to New Cases**
  Apply REI to your three unlisted cases:

  1. **Deliberate Breakage**: Hundreds of metal objects broken identically and deposited solo in a river over centuries.  
     - **REI Verdict**: **Infer ritual belief (B)**.  
     - **Rationale**:  
       - *Condition 1*: Highly improbable functionally (why break valuable objects? Why no other refuse?). Alternatives (e.g., recycling) ruled out by deposition context.  
       - *Condition 2*: Intentionality signature: standardization + costly action (non-functional destruction).  
       - *Condition 3*: Long duration implies cultural transmission, not individual whim.  

  2. **Discontinuity**: Pattern holds in early site phases, disappears when isotopes show non-local influx.  
     - **REI Verdict**: **Infer institution (I) or belief (B) tied to original group**.  
     - **Rationale**:  
       - *Condition 1*: Discontinuity coinciding with demographic shift makes ecological drift improbable.  
       - *Condition 2*: If pattern shows institutional signature (e.g., enforcement evidence), infer \(I\); if symbolic, infer \(B\).  
       - *Condition 3*: Isotopes anchor inference to population change.  

  3. **Reflexive Case**: Future archaeologists infer two-party elections from seasonal lawn signs, colors, and door-knocking gear.  
     - **REI Verdict**: **Infer electoral institution (I)**.  
     - **Rationale**:  
       - *Condition 1*: Pattern improbable without coordinated rules (alternatives like "fashion" ruled out by seasonality and paraphernalia).  
       - *Condition 2*: Institutional signature: signs/knocking imply counterfactual stability (e.g., if no one enforced norms, free-riding would dominate).  
       - *Condition 3*: Reflexivity test passed—this is how real institutions manifest materially.  

  ---

  ### **Explicit Limitations**
  - **What REI Cannot Fully Accommodate**: Your verdicts all work, but REI struggles with **case 9 (later text)**. Auxiliary evidence boosts inferences but lacks a quantitative threshold. I justify it as lowering \(P(\text{alternatives})\) marginally, but gaps risk anachronism.  
  - **Bigger Challenge**: **Residual inferences (case 10)** remain "inference to the best explanation" fallbacks. REI mitigates this by requiring explicit refutation of alternatives (condition 1), but it’s still abductive.  

  ### **Why REI Over Your Tentative Principle?**
  - Your friction condition is too narrow (e.g., case 4’s feasting implies coordination without direct enforcement evidence). REI’s institutional signature captures broader equilibrium dynamics.  
  - Double-difference is strengthened by requiring explicit alternative enumeration, avoiding vagueness in "nearby alternatives."  
  - REI explains convergent evidence (case 8) via probability theory and distinguishes beliefs/institutions via signatures, not just cost.  

  This principle is testable, applicable to new sites, and grounded in philosophy of science (e.g., Woodward’s interventionism). If you reject institutions in cases without "friction," revert to your clause—but REI handles your verdicts better.
