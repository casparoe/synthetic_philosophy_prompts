prompt: |-
  hey — I'm a third-year PhD student trying to get the lit-review chapter of my third-year paper unstuck, and the paper is basically: can content externalism still do the job that cognitive science wants content to do? By which I mean, a notion of content good enough to underwrite intentional explanation of what people do (the stuff that shows up in ordinary belief-desire explanations and in psychological models), and which at the same time leaves something recognizable of first-person authority standing — you know, the thought that you don't need to go run an experiment on your own taps to know what you're thinking about. My supervisor keeps saying the whole literature is just a disguised dispute about how to individuate natural kinds and that I should stop being impressed by it; I think he's wrong but I can't yet say why in a way he'd accept. So before I read another paper that defends its view by pointing at one case and sneering at the alternatives, I want the spec.

  Write me the desiderata: what a theory of the content of thought and language has to deliver to count as adequate *for that purpose* — which cases it must get right, which puzzles it must dissolve rather than merely stipulate away, which distinctions it has to respect (content vs. extension, wide vs. narrow, having a content vs. how much of one, deference to a community vs. individual understanding) — with the case or consideration behind each requirement, and be explicit about which requirements are non-negotiable and which are really just something one camp happens to care about. The cases I want the list forced to answer, and please add your own: the pre-chemistry Twin Earth setup where the twin stuff is superficially indistinguishable from water; the arthritis-style case where the difference is in the speaker's linguistic community rather than in the physical environment; the swampman-style case where a molecule-for-molecule duplicate of you pops into existence with no causal history at all; the migrated speaker who grows up among the twin stuff and then spends thirty years as a fully competent speaker among us (what happens to the continuity of her beliefs?); a case I made up where the two liquids are indistinguishable by any measurement possible in the actual world and differ only in what they would do under laws that don't obtain here; a split-village case where half the wells in a single community hold one liquid and half the other, and everyone defers to everyone else; and a Twin Earth for an institutional kind — their word for the local currency, or for marriage — where the physical objects and the observable behaviour are the same and only the norms of the practice differ. For each requirement, say what it would even look like to get the case wrong.

  Two things I care about most. First: flag any pair of requirements you suspect can't be jointly satisfied, and if the inconsistency is real say which one you'd drop and what it costs you — I have a sinking feeling that "content has to be wide enough for Twin Earth" and "content has to be narrow enough to be the thing the nervous system is doing" plus authoritative self-knowledge are going to pull apart, and if they do I'd much rather show that the list itself is inconsistent than pick a team. Second: tell me which single requirement does the most work in excluding otherwise popular candidates. Keep the weight on the criteria and the cases behind them; a short scorecard at the end for descriptivism, causal/informational views, teleosemantics, conceptual-role/two-dimensionalist views, interpretivism and the Burge-style social picture is fine, but I'll redo it myself. And please skip any bibliography or reading list — I have those; I want the shape of the problem, not more names.
reasoning: |-
  Okay, the user is a third-year PhD student struggling with their lit-review chapter on content externalism in cognitive science. They need a clear set of desiderata for what makes a theory of content adequate, specifically for intentional explanation and preserving first-person authority. Their advisor thinks the debate is just about natural kind individuation, but the student disagrees. They've listed several cases to test theories against, like Twin Earth and Swampman, and want to know which requirements might conflict, especially regarding wide vs. narrow content and self-knowledge.

  First, I need to outline the core job of content in cognitive science: enabling belief-desire explanations that predict behavior. Then, first-person authority—knowing your own thoughts without external investigation. The user mentioned several cases, so each desideratum must address those. Let's start with the non-negotiables. Intentional Explanation is crucial because without content that causally explains behavior, cognitive science loses its foundation. First-Person Authority is another key—without privileged access, the theory fails a basic intuition.

  The Twin Earth case requires wide content to distinguish beliefs about water vs. twin water. But then Narrow Content is needed for psychological explanation since duplicates should have the same cognitive processing. Swampman challenges this—no causal history, so does he have thoughts? The user worries these conflict. Also, Social Deference like in the arthritis case where meaning depends on community norms. Continuity of Beliefs for the migrated speaker who moves between Earth and Twin Earth—how do their concepts change? 

  The split-village case tests whether a community can share a concept despite local differences. The institutional Twin Earth adds complexity because norms define the kind, not physical properties. The indistinguishability case forces a decision on whether content depends on actual properties or possible ones.

  Now, conflicts. The big one is Wide vs. Narrow Content. Wide captures external differences (Twin Earth) but narrow is needed for internal processing. If content must be both, it might be impossible. Maybe a dual-component theory? But then self-knowledge: if content is wide, how do we know our thoughts without external checks? If narrow, it might not capture the right extensions. The user wants to show the desiderata themselves might be inconsistent, which could be their breakthrough.

  The most excluding requirement might be Swampman. Teleosemantics fails here because it relies on evolutionary history. Descriptivism struggles with Twin Earth. Causal theories might handle Twin Earth but not Swampman or the split-village. 

  Need to ensure each requirement is tied to a case. For example, Continuity of Beliefs addresses the migrated speaker's concept change over time. The split-village tests Community-Wide Content vs. Individual Exposure. 

  Also, flagging which requirements are contested. For example, Narrow Content might be essential for psychological explanation but some externalists might reject it. The user's advisor downplays the debate, but showing these tensions could demonstrate the problem's depth. 

  Finally, the scorecard should succinctly show where each theory fails. Burge's social externalism handles arthritis but not Swampman. Teleosemantics fails Swampman. Two-factor theories might balance but face self-knowledge issues. The user can expand, but the summary highlights the challenges.
answer: |-
  Here’s a distilled set of desiderata for a theory of content tailored to your project’s needs, grounded in your cases and focused on intentional explanation + first-person authority. Requirements are categorized as **non-negotiable** (core to the cognitive science project), **negotiable but critical** for explanatory adequacy, and **theory-dependent** (often camp-specific). Conflicts are flagged explicitly.

  ---

  ### **Core Desiderata: Non-Negotiable**
  1.  **Intentional Explanatory Power (IEP)**  
      *What it must do:* Content must causally explain behavior in psychological generalizations (e.g., "Belief that *p* + Desire that *q* → Action *a*").  
      *Case that tests it:* **Swampman**. If Swampman behaves identically to you, psychological generalizations must apply identically *at the moment of duplication*. Failing this = content is epiphenomenal or irrelevant to cognitive science.  
      *Cost of failure:* Cognitive science loses its object of study.

  2.  **First-Person Authority (FPA)**  
      *What it must do:* Subjects must have non-empirical, privileged access to *what* they think (not necessarily the external object).  
      *Case that tests it:* **Arthritis-style cases**. Bert must know he’s thinking *about his thigh ailment* without consulting experts. Getting it wrong = content is not introspectively available, undermining agency and self-knowledge.  
      *Cost of failure:* Collapse of the "belief-desire" folk framework.

  3.  **Wide Content Individuation (WCI)**  
      *What it must do:* Content must differ when environmental/communal referents differ, even if intrinsic properties of the thinker are identical.  
      *Case that tests it:* **Standard Twin Earth (water vs. XYZ)**. Oscar and Twin Oscar must have different beliefs (e.g., "water is wet" vs. "twin-water is wet"). Failing this = content can’t ground truth-conditions or explain successful action in a world.  
      *Cost of failure:* Content loses its "aboutness" relation to the external world.

  ---

  ### **Critical Desiderata (Negotiable Scope, But Failure Weakens Theory)**
  4.  **Narrow Content / Cognitive Equivalence (NCE)**  
      *What it must do:* Duplicates must share *some* content-like state explaining identical behavior and inferential patterns.  
      *Case that tests it:* **Swampman** and **Twin Earth**. Swampman must share *psychological states* with his original. Failing this = cognitive science can’t explain behavior solely via internal mechanisms.  
      *Cost of failure:* Psychological laws become hyper-externalized and lose predictive generality.  
      *Conflict:* **WCI vs. NCE**. If content is *fully* wide, Swampman has no thoughts. If *fully* narrow, Twin Earth difference vanishes. Resolution likely requires a dual-component theory.

  5.  **Conceptual Continuity & Change (CCC)**  
      *What it must do:* Account for how concepts evolve with changing expertise/context without erasing past beliefs.  
      *Case that tests it:* **Migrated Speaker** (grows up on Twin Earth, moves to Earth). Does her belief "Water is thirst-quenching" change referent? Must respect both her past understanding and current competence. Failing this = implausible discontinuity in personal identity or self-understanding.  
      *Cost of failure:* Inability to model learning or conceptual development.

  6.  **Social Deference & Competence (SDC)**  
      *What it must do:* Explain how speakers partially defer to community experts while retaining enough grasp for their thoughts to have determinate content.  
      *Case that tests it:* **Arthritis case** + **Institutional Twin Earth** (e.g., "marriage" differs normatively). Bert must have a belief *about arthritis* despite incomplete grasp. Failing this = content becomes either overly individualistic (ignoring norms) or mystical (requiring full grasp).  
      *Cost of failure:* Can’t explain division of linguistic labor or normativity of kinds.

  ---

  ### **Edge Cases & Theory-Dependent Desiderata**
  7.  **Indiscernibles & Modal Dependence (IMD)**  
      *What it must do:* Specify whether content depends on *actual* external properties or counterfactual ones.  
      *Case that tests it:* **Indistinguishable Liquids** (differ only under non-actual laws). If content differs, it’s hyper-intensional; if same, it ignores metaphysical possibility. Failing this = content is either implausibly fine-grained or coarse-grained.  
      *Theory-dependence:* Descriptivists/causal theorists diverge here. Non-negotiable only if modal robustness is core to "aboutness".

  8.  **Community-Wide Content vs. Individual Exposure (CWC)**  
      *What it must do:* Explain whether a community shares a concept despite local environmental variation.  
      *Case that tests it:* **Split-Village** (half wells H₂O, half XYZ; all defer mutually). Is there *one* concept "water" or two? Failing this = content becomes fragmented or communal norms are ignored.  
      *Theory-dependence:* Social externalists (Burge) insist on communal norms; causal theorists may prioritize local exposure. Cost: Either undermines deference (if local) or individual variation (if communal).

  9.  **Swampman Viability (SV)**  
      *What it must do:* Grant Swampman thoughts *immediately* upon creation.  
      *Case that tests it:* **Swampman**. Teleosemantics fails this (no evolutionary history). Failing this = content requires long-term causal history, threatening FPA and IEP.  
      *Theory-dependence:* Teleosemantics rejects SV; others accept. Cost: Rejecting SV divorces content from real-time cognition.

  ---

  ### **The Inevitable Conflict & Key Excluder**
  - **The Trilemma:** **WCI** (content depends on world), **NCE** (content explains identical behavior), and **FPA** (self-knowledge without empirical investigation) **cannot all be fully satisfied monistically**.  
    - *Why:* FPA suggests content is internally accessible. WCI makes content depend on external factors opaque to introspection. NCE requires internally identical states to share *something* contentful.  
    - *Resolution Cost:*  
      - **Drop NCE:** Accept that Swampman has no thoughts (sacrifices psychological explanation).  
      - **Drop WCI:** Deny Twin Earth difference is *cognitive* content (sacrifices external aboutness).  
      - **Drop FPA:** Accept self-knowledge requires empirical access (sacrifices privileged access).  
    - *Your Escape Hatch:* A **dual-component theory** (wide referent + narrow mode of presentation) *might* satisfy all weakly, but risks stipulation and struggles with **Migrated Speaker** (which component changes?).

  - **Most Excluding Requirement:** **Swampman Viability (SV)**.  
    - *Why:* Eliminates teleosemantics (requires history) and strict causal-historical theories. Forces a choice between internalism (sacrificing WCI) or accepting brute intentionality (straining naturalism).  
    - *Runner-up:* **Split-Village Case**. Excludes views that can’t reconcile communal deference with local variation (e.g., pure causal chains or solipsistic conceptual role).

  ---

  ### **Short Scorecard**
  | Theory                | IEP | FPA | WCI | NCE | CCC | SDC | IMD | CWC | SV  | Major Weakness                     |
  |-----------------------|-----|-----|-----|-----|-----|-----|-----|-----|-----|------------------------------------|
  | Descriptivism         | ✓   | ✓   | ✗   | ✓   | ?   | ✗   | ✓   | ✗   | ✓   | Fails Twin Earth (WCI)             |
  | Causal/Informational  | ✓   | ✗   | ✓   | ✗   | ✗   | ✗   | ✗   | ✗   | ✗   | Fails FPA, Swampman, Split-Village |
  | Teleosemantics        | ✓   | ✗   | ✓   | ✗   | ?   | ?   | ?   | ?   | ✗   | Fails FPA & Swampman               |
  | Conceptual Role       | ✓   | ✓   | ✗   | ✓   | ✓   | ✗   | ✓   | ✗   | ✓   | Fails Twin Earth, Social Deference |
  | Two-Dimensionalism    | ~   | ✓   | ~   | ~   | ~   | ~   | ✓   | ~   | ✓   | Struggles with CCC, often ad hoc   |
  | Interpretivism        | ~   | ✗   | ~   | ~   | ~   | ~   | ~   | ~   | ~   | Fails FPA, objective content       |
  | Burge Social External | ✓   | ✓   | ✓   | ✗   | ?   | ✓   | ✗   | ✓   | ✗   | Fails Swampman & Narrow Equivalence|

  *✓ = satisfies, ✗ = fails, ~ = mixed/contextual, ? = underspecified*

  ---

  **The Shape of the Problem:** Your advisor is half-right: much *is* about natural kinds. But the deeper tension is between **explanation** (requiring internal, causally efficacious states) and **reference** (requiring external, world-involving relations), with **self-knowledge** caught in the crossfire. The lit review’s value is exposing this trilemma *through* the cases. To unstick it: Structure your chapter around which theories sacrifice which desideratum, and argue that *any* viable theory must either bifurcate content (wide + narrow) or reject one pillar (WCI, NCE, or FPA). The inconsistency isn’t in the literature — it’s in the job description itself. Your contribution is showing why cognitive science wants the impossible and how close we can get.
