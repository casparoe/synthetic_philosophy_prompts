  3. After they settle into a pattern, introduce a Counter-Mugger who pays them for refusing the first Mugger.

  We must design rules, materials, timeline, and roles. We also need a debrief that maps the game moments to the four ingredients: unbounded stakes, expected-value maximization, no floor on credence, and adversarially chosen stake.

