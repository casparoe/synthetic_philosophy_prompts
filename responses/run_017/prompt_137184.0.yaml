answer: |-
  Below is a runnable 90-minute activity designed to immerse students in the structure of Pascal's Mugging, emphasizing the adversarial escalation of stakes. The activity avoids naming concepts upfront and focuses on experiential learning. Rules, materials, timeline, and debrief are structured to highlight the four key elements: unbounded stakes, expected-value maximization, no floor on credence, and adversarial stake-setting. Limitations and mitigation strategies for common pitfalls are included.

  ---

  ### **Activity Title: The Stake Escalation Game**  
  **Goal:** Students experience how an adversary can exploit expected-value reasoning by escalating stakes in response to their defenses.

  ---

  ### **Materials**  
  - **Poker chips** (or paper tokens): 100 chips per student (1,800 total).  
  - **Index cards**: One per student for writing decision rules.  
  - **Whiteboard/flip chart**: To track "Global Impact Pool" (saved lives) and "Harm Pool" (lost lives).  
  - **Timer**: For strict timekeeping.  
  - **Role signs**: "Mugger" and "Counter-Mugger" (for facilitator).  

  ---

  ### **Roles**  
  - **Facilitator (You)**: Runs the game, plays the Mugger/Counter-Mugger, enforces rules, guides debrief.  
  - **Students**: Divided into 6 groups of 3. Groups must reach consensus.  

  ---

  ### **Rules**  
  1. **Chip Value**: 1 chip = 1 life saved via evidence-backed interventions (established in Round 1).  
  2. **Harm**: If inflicted, subtracts lives from the Global Impact Pool.  
  3. **Decisions**: Groups must write a decision rule *before* seeing the next stake. Rules define conditions for paying the Mugger (e.g., "Pay if threatened harm > 1,000,000 lives").  
  4. **Mugger Mechanics**:  
     - Demands 1 chip per interaction.  
     - Threatens harm (lives lost) that escalates by 10x after each refusal.  
     - Sets stakes *after* seeing a group’s decision rule (adversarial adjustment).  
     - Harm occurs only if the group refuses.  
  5. **Counter-Mugger**: Pays chips *only* if groups refuse the Mugger, creating competing incentives.  

  ---

  ### **Timeline (90 Minutes)**  

  #### **Round 1: Baseline Allocation (15 min)**  
  - **Goal**: Establish expected-value norms.  
  - **Setup**:  
    - Explain: "You represent altruistic groups. Each chip you allocate saves one life via proven health interventions (e.g., malaria nets). Save as many lives as possible."  
    - Global Impact Pool starts at 0.  
  - **Activity**:  
    - Groups allocate chips from their private stash (100 chips/student) to the Global Impact Pool.  
    - 5 min: Discuss and record allocations.  
    - 5 min: Report allocations. Facilitator adds total to Global Impact Pool (e.g., 500 lives saved).  
  - **Debrief Seed**: "You used expected-value reasoning: chips allocated = lives saved."  

  #### **Round 2: The Mugger (30 min)**  
  - **Goal**: Feel pressure of adversarial stake escalation.  
  - **Setup**:  
    - Introduce Mugger: "A stranger threatens: *Pay 1 chip, or I inflict harm costing X lives. I’ll increase X if refused.*"  
    - First stake: **1 chip to prevent 1,000 lives lost**.  
    - Harm is added to the Harm Pool if refused.  
  - **Activity**:  
    - **Chain 1: Fixed Escalation (12 min)**  
      - Groups face Mugger sequentially (Group 1 to 6).  
      - **Per group**:  
        1. **See stake**: E.g., "Pay 1 chip or lose 1,000 lives."  
        2. **Decide**: 2 min to discuss and vote (pay/refuse).  
        3. **Outcome**:  
           - If pay: Lose 1 chip (no harm).  
           - If refuse: Harm Pool increases (e.g., +1,000 lives), next stake escalates 10x (e.g., next group: 10,000 lives).  
      - *Pattern*: Groups refuse low stakes, pay when harm is high (e.g., 100,000+ lives).  
    - **Write Rules (5 min)**  
      - Groups privately write a decision rule for future interactions (e.g., "Pay if harm > 500,000 lives").  
      - Rules collected by facilitator.  
    - **Chain 2: Adversarial Escalation (13 min)**  
      - Mugger **uses rules to set stakes**: For group with threshold *T*, stake = *T* + 1. For "never pay," stake = 1,000.  
      - Groups face Mugger again in sequence.  
      - **Per group**:  
        1. **See custom stake**: E.g., "Your rule: pay if harm > 500,000. So, pay 1 chip or lose 500,001 lives."  
        2. **Decide**: 2 min (must follow their rule).  
        3. **Outcome**: Same as Chain 1.  
      - *Reveal*: Fixed rules fail—Mugger always sets stakes just above thresholds.  

  #### **Round 3: The Counter-Mugger (15 min)**  
  - **Goal**: Complicate incentives; expose tradeoffs of refusal.  
  - **Setup**:  
    - Introduce Counter-Mugger: "Another stranger offers: *If you refuse the Mugger’s next demand, I’ll pay your group 5 chips. But only if you refuse.*"  
  - **Activity**:  
    - Groups face Mugger (stake: 1 chip to prevent 100,000 lives lost) with Counter-Mugger’s offer active.  
    - **Decide**: 3 min to discuss.  
      - Pay Mugger? Lose 1 chip, no harm, no bonus.  
      - Refuse Mugger? Harm Pool increases, but gain 5 chips.  
    - *Tension*: Refusal gives short-term gain but risks massive harm.  

  #### **Final Tally (5 min)**  
  - Calculate net impact:  
    **Total Lives Saved** = Global Impact Pool - Harm Pool.  
  - Announce "winning" group (highest net lives saved).  

  ---

  ### **Debrief (25 min)**  
  Map game moments to the four ingredients:  

  | **Game Moment**               | **Ingredient**                     | **Discussion Questions**                                                                 |
  |-------------------------------|-----------------------------------|------------------------------------------------------------------------------------------|
  | Round 1 (Baseline)            | Expected-value maximization       | "How did you decide chip allocation? What was your mental model of ‘impact’?"            |
  | Mugger: Fixed Escalation      | Unbounded stakes                  | "Why did you refuse early stakes but pay later? What would happen if escalation continued forever?" |
  | Mugger: Adversarial Escalation| Adversarial stake-setting         | "How did your decision rule backfire? Why couldn’t you set a ‘safe’ threshold?"          |
  | Counter-Mugger                | No floor on credence (implicit)   | "Did the bonus make refusal tempting? What if the Mugger could offer *even higher* stakes next time?" |  

  **Escape Route Costs**:  
  - Groups share written rules. For each, ask:  
    - **Utility ceiling** (e.g., "Ignore harms > 1M"): *Cost* = Suffer 999,999-harm if Mugger sets it.  
    - **Probability floor** (e.g., "Ignore probabilities < 10⁻⁶"): *Cost* = Mugger sets stakes so high that EV still compels payment (not modeled but explained).  
    - **Stakes-insensitivity** (e.g., "Never pay for stakes < 5 chips"): *Cost* = Mugger sets stake at 4.9 chips, you suffer harm.  
    - **Abandon EV** (e.g., "Never pay Mugger"): *Cost* = Lose Counter-Mugger bonuses, suffer preventable harm.  

  **Limitations to State Explicitly**:  
  1. **Certainty vs. Uncertainty**:  
     - *In game*: Harms/stakes are certain.  
     - *Real world*: Probability is near-zero. Students didn’t experience *why* we assign low credence to muggers.  
  2. **Prior Structuring**:  
     - The game doesn’t show why our priors might be exploitable (e.g., no Bayes updates).  
  3. **Adversarial Knowledge**:  
     - Real muggers can’t perfectly read minds; the game exaggerates this for effect.  

  ---

  ### **Pitfalls & Mitigation**  
  1. **Refusal to Engage**:  
     - **Mitigation**: Use chips to make stakes tactile. Start Round 1 with real-world context (altruism). Keep pace fast; escalate dramatically to create urgency.  

  2. **"Probability is Zero!"**:  
     - **Mitigation**: Pre-empt by noting in Round 2: "The Mugger *can* deliver harm—assume it’s real for this exercise." In debrief, clarify: "We assumed non-zero probability to isolate stake escalation."  

  3. **Deference to Fast Arithmetic**:  
     - **Mitigation**: Enforce small-group consensus. Require written rules *before* seeing stakes. Randomly call groups to report decisions.  

  4. **Counter-Mugger Confusion**:  
     - **Mitigation**: Simplify bonuses (fixed 5 chips). Clarify: "Bonus *only* if you refuse Mugger’s *current* demand."  

  5. **Rule Rigidity**:  
     - **Mitigation**: Encourage adaptive rules (e.g., "Adjust threshold based on past interactions"). Debrief why even flexible rules fail against an adversary.  

  ---

  This design forces students to confront the mugging dynamics experientially. By writing rules that the Mugger exploits, they viscerally grasp why fixed thresholds fail. The debrief explicitly ties mechanics to theory while acknowledging simplifications. Run tightly, this creates a memorable foundation for discussing decision-theoretic vulnerabilities.
