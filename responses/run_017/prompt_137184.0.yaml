     - Groups that refused in Chain 2 can now gain 2 chips. Groups that paid get nothing.
     - This creates a tension: in Chain 2, if they had refused, they suffered harm (if they were the ones that refused) but now they get 2 chips. If they had paid, they avoided harm but now they don't get the reward.

     This might illustrate that there are consequences in other parts of the decision space.

     But note: the harm in Chain 2 might have been very high for some groups (e.g., if they set a threshold T=1,000,000, then harm=1,000,001 and they paid to avoid it). The reward is only 2 chips. So it's not worth it. But for groups that set "always refuse", they refused and suffered 1000 days of harm, and now they get 2 chips. The net is -1000 days + 2 days = -998 days? Still bad.

     Alternatively, we can have the Counter-Mugger offer a reward for not paying in the next mugging? But we don't have a next mugging.

     We decide to have the Counter-Mugger offer a reward for refusing the first Mugger in a future mugging? But that future mugging doesn't happen.

     Instead, we can run a new chain (Chain 3) and the Counter-Mugger offers a side contract.

     New plan for Counter-Mugger:

     - We announce that the first Mugger will return for one more chain (Chain 3) but now there is a Counter-Mugger.
     - The Counter-Mugger offers: "If any group in Chain 3 refuses the first Mugger when approached, then after the chain, I will give every group 2 chips." 
     - But the groups individually decide whether to pay or refuse when approached by the Mugger. However, the reward is conditional on at least one group refusing the first Mugger in the chain? And the reward is to every group.
     - This creates a public goods game: if a group is the first approached and they refuse, then they cause the harm of the current level (which is 1000) but then every group gets 2 chips. The net for the common pool: harm=1000, reward=2*6=12 chips -> net gain 12-1000 = -988 days? Still a loss. But the harm is in days and the reward in chips (which are days). So it's a net loss? Then why would they do it?

     Alternatively, the reward could be large enough to cover the harm and more? But then it becomes profitable to refuse.

     We want to illustrate that the Counter-Mugger might change the incentive. But we also want to keep the harm certain.

     Perhaps we let them experience that there might be outside options, but it's complex.

     Given time constraints and complexity, we might skip the Counter-Mugger or simplify.

     We decide: after the two Mugger chains, we introduce the Counter-Mugger as follows:

        "The Counter-Mugger is upset by the first Mugger's actions. She offers a deal to each group: if you can show that you have never paid the first Mugger (in either Chain 1 or Chain 2), then she will give you 10 chips."

     Then groups that never paid in either chain get 10 chips. Groups that paid at least once get nothing.

     This rewards consistency in refusal. But it doesn't create a new decision.

     Alternatively, we can make it a new decision: the Counter-Mugger says, "I will give you 2 chips right now if you pledge to never pay the first Mugger in any future encounter." Then, in any future mugging, if they have pledged, they must refuse. But we don't have future encounters.

     Given time, we might omit the Counter-Mugger or keep it very simple.

     We decide to omit the Counter-Mugger and instead focus on the debrief. We can mention in the debrief that real-world decisions have multiple interactions and opportunity costs, but we didn't model that.

     So we'll skip Round 3 and go to debrief.

  V. Debrief (25 minutes)

     Map each moment to the four ingredients:

     - Unbounded stakes: In Chain 1, the harm grew exponentially without bound. In Chain 2, the Mugger could set the harm arbitrarily high to bypass thresholds.
     - Expected-value maximization: In Round 1, they allocated chips to save days, assuming a fixed exchange rate. In the mugging, they were forced to compare the cost (1 day) to the harm (many days).
     - No floor on credence: We didn't model probability, so this is missing. We must state that in the real mugging, the probability is very small, but in our game, it was certain.
     - Adversarially chosen stake: In Chain 2, the Mugger set the harm based on their rule.

     Discuss the escape routes they might have considered and why they don't work:

        - Setting a utility ceiling (ignore harms above C): then the Mugger sets harm = C-1 and you suffer it.
        - Setting a probability floor (ignore events with probability below p): not modeled, but if you do, the Mugger can set the stake high enough so that p * harm > cost, so you still pay.
        - Stakes-insensitivity below a threshold: not caring about small harms? The Mugger can set a harm just below the threshold and you suffer it.
        - Abandoning expected value: then you might not pay when the expected value says you should.

     And the cost of each:

        - Utility ceiling: you suffer enormous harms just below the ceiling.
        - Probability floor: you still pay for very high stakes.
        - Stakes-insensitivity: you suffer harms just below the threshold.
        - Abandoning expected value: you might make dominated choices.

     Finally, state the limitations:

        - The harm was certain, but in Pascal's Mugging, the probability is very small.
        - The mugger's ability to deliver the harm was taken for granted, but in reality, we might assign very low probability.
        - The adversarial setting is explicit, but in reality, the mugger might not know your decision rule.

     Potential problems and how to mitigate:

     - Refusing to engage: Use physical chips and make the allocations have consequences (common pool of saved days and incurred harm). Keep the pace fast and the stakes rising dramatically.

     - Insisting probability is zero: Admit in the debrief that this is a valid response, but explain that the mugging argument assumes that the probability is non-zero (even if very small). In the game, we set it to 1 to focus on the stake size.

     - Deferring to the fastest arithmetic student: Use small groups (3 students) to force everyone to participate. Have them write down their group's decision and rule privately before reporting.

     Timeline recap:

     - 0-10 min: Intro and Round 1 (high-impact ask)
     - 10-40 min: Mugger round
