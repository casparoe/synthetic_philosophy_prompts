prompt: |-
  I serve on a body that has to recommend a design for publicly funded parental leave, and I find that I have firm reactions to individual cases and no settled account of what they add up to. I am not asking for comparative data, statutory surveys, or citations; I want the shape of the justification, stated precisely enough that I could defend it to someone who disagrees. Here are my verdicts, given on cases as they come to me.

  (a) A dual-earner couple, six months of paid leave available. I want three months reserved to each parent and non-transferable, and I hold this even where both parents freely agree that the mother should take all six. I dislike the freely divisible version a lot, not slightly.

  (b) The same couple, except that the second parent has died in childbirth, or has been absent since before the birth and cannot be located. I want the full six months available to the surviving parent. I can see this strains against (a): if I am willing to override a couple's own agreement in (a), why does the absent parent's share become available on the same facts plus an absence?

  (c) A parent takes the full paid leave and resigns in the week after it ends. I oppose any clawback or repayment condition. The benefit is theirs to keep, and I hold this even though the leave plainly failed to preserve the attachment to that employer.

  (d) A self-employed or platform-work parent with no contribution record and patchy earnings documentation. I want a floor entitlement funded from general revenue, available on something like self-certification. I hold this despite thinking the verification problem is real, and despite the fact that the case for an insurance-style benefit seems weakest exactly here.

  (e) A parent who places the child in full-time daycare for the whole of the paid-leave period and returns to work. I recoil; this strikes me as misuse. A parent who works remotely for their employer during the leave period strikes me as worse still. I cannot say what rule I would write to catch either one.

  (f) A parent who spends the paid-leave period in full-time retraining, while the other parent provides the care. I have no objection at all. I notice that in both (e) and (f) the recipient is not providing care, and that in (f) the recipient is not even at home, and yet my reactions differ sharply.

  (g) The replacement rate. I want earnings-relatedness in the middle of the distribution, a cap at the top so that a very high earner receives a lower replacement rate, and a floor at the bottom high enough that a low earner can actually afford to take the leave — which means the benefit is not insurance-like at either end. This sounds to me like three different principles bolted together, but I am unwilling to give up any of the three.

  (h) A stillbirth at thirty-eight weeks. I want the leave to stand in full, undiminished.

  (i) The adoption of a seven-year-old from foster care. I want more leave than for a newborn, not less, even though there is no pregnancy and no infant care.

  (j) A gestational surrogate who is not a legal parent of the child. I want no parental leave for her, but paid time for physical recovery from the birth. I hold both halves confidently and am not sure they are consistent.

  The case I keep reversing on: a household of three adults raising the child — two legal parents and a live-in relative who is the child's primary daytime caregiver. Should the reserved quota divide into three non-transferable shares? Dividing it seems to follow directly from whatever makes me endorse (a); refusing to divide it seems right because I do not want the state deciding how many caregivers count. I go back and forth within a single conversation.

  My own attempt at a principle, which I suspect is wrong: paid leave is justified exactly insofar as it neutralizes two distortions — the statistical discrimination that leads employers to discount a young woman's career, and the intrahousehold bargaining that pushes the lower-earning parent out of the labor market — and no further. This handles (a) beautifully and predicts my reaction to (c), but it seems to imply that once the discrimination were gone the policy should collapse into an unconditional cash transfer, which I reject, and it has nothing obvious to say about (h) or (i).

  What I would like from you: a principle, or at most three candidate principles, stated precisely, with the case that motivates each clause; its verdicts on cases I have not listed — a parent who was not in paid work before the birth and never intended to be, a second child born eleven months after the first, and a parent who uses the leave to care for a newly disabled partner rather than for the child; and an honest statement of which of my verdicts each candidate cannot accommodate, especially among (a)/(b) and (c)/(e)/(f), where I expect I am holding something indefensible. If the principle has implications for who should bear the cost rather than only for what parents should receive, say what they are.
reasoning: |-
  Okay, the user is part of a committee designing a publicly funded parental leave policy. They have strong intuitions about specific cases but struggle to find a unifying principle. They provided several scenarios (a-j) and their reactions, plus a case they're conflicted on. Their own attempted principle focuses on neutralizing employer discrimination and intrahousehold bargaining, but they see its limitations. 

  Hmm, they clearly need a coherent ethical framework that justifies their intuitive judgments across diverse situations. Interesting how they reject purely economic or insurance-based models - this is fundamentally about values, not efficiency. Their frustration with their own inconsistency (especially in a/b and e/f) suggests they crave intellectual honesty.

  The user's scenarios reveal several unspoken priorities: protecting vulnerable parents (b,d), recognizing non-biological caregiving (i,j), valuing care labor itself (e,f), and rejecting transactional logic (c). Their strongest moral instincts appear when parents can't access leave (b,d) or might misuse it (e) - but note how they distinguish physical recovery (j) from parenting time.

  Ah! The tension in a/b is illuminating. In (a) they override parental choice to prevent gender inequality, but in (b) they prioritize a solo parent's needs over theoretical fairness. This suggests their core concern isn't just equality but ensuring every child has adequate care resources. Similarly, in e/f, the key distinction seems to be whether alternative arrangements still support the child's care ecosystem.

  Their three-adult household dilemma perfectly captures the philosophical crux: individual entitlements vs. state overreach. Any principle must navigate this carefully - perhaps by focusing on legal responsibility rather than counting caregivers.

  For principles... First, Care Security makes sense for their child-centered reactions (b,i) and solves the adoption/stillbirth cases cleanly. But it might struggle with their resistance to unconditional cash (implied in c). Second, Care Autonomy explains their defense of resignation (c) and retraining (f), yet conflicts with restricting daycare use (e). Third, Care Equity handles non-transferable leave (a) and low-income floors (d), but gets messy for surrogates (j). 

  Notably, all three principles justify their pro-floor stance (d) despite weak insurance logic - revealing this isn't about actuarial fairness. Their clawback refusal (c) is defensible under Care Security as non-means-tested support. The surrogate case (j) remains tricky; separating parental rights from gestational labor might require two distinct entitlements.

  On new cases: a non-working parent would get support under Care Security (child's need) but not Equity (labor attachment). A close-spaced second child might get reduced leave under Autonomy (personal choice) but full support under Security. Caring for a partner instead of child? Only Security would stretch that far.

  Cost implications: Care Security points to general taxation (societal responsibility). Equity might prefer social insurance models. Autonomy could allow employer funding but with state mandates.

  Their verdicts that are hardest to reconcile: restricting daycare use (e) clashes with Autonomy, while denying leave to non-workers might clash with Security. The principled move is either to abandon (e) as overreach or reframe "misuse" as fraud - but their moral intuition there is very strong. 

  Ultimately, Care Security best handles their child-focused reactions (h,i,b) and provides the most consistent framework, even if it requires relaxing their stance on (e). The surrogate case (j) reveals a needed distinction between parental and medical entitlements - not inconsistency. For the three-adult dilemma, allocating to legal parents avoids intrusive counting while ensuring resources exist.

  This user thinks deeply about ethical coherence. They'll likely appreciate seeing where their intuitions might need adjustment - hence explicitly naming the tensions. The key is showing how most judgments flow from prioritizing the child's care stability over parental behavior or labor outcomes.
answer: |-
  Your intuitions reveal a coherent, child-centered principle struggling against residual labor-market thinking. The unifying thread is **Securing Adequate Care for the Child Through Critical Transitions**, with three corollaries:

  1.  **The Child's Entitlement Principle:** Publicly funded parental leave exists to ensure *every child* receives adequate, attachment-securing care during critical developmental transitions (birth, adoption, major health events) by enabling primary caregivers to provide that care without financial catastrophe. The child is the ultimate beneficiary; parents are conduits.

      *   *Motivating Cases:* (h) Stillbirth: The child existed; the transition occurred; care (grief, physical recovery) is needed. (i) Older Adoption: The transition is profound; bonding requires *more* time, not less. (b) Solo Parent: The child's need persists regardless of household composition.
      *   *Verdicts on New Cases:*
          *   Parent not in paid work: **Entitled.** The child's need is independent of prior employment. (Justifies your (d) stance).
          *   Second child at 11 months: **Entitled.** Each child triggers their own critical transition period. Overlap is a separate logistical issue.
          *   Leave used for partner care: **Not entitled under *parental* leave.** The critical transition is the child's new presence/status, not the partner's disability (requires separate policy).
      *   *Cost Implication:* General taxation. This is a societal investment in children, not an insurance pool tied to contributions.
      *   *Tension with Your Verdicts:* Challenges your aversion in (e) (daycare/remote work). If adequate care *is* provided (even by others), the child's need is met. Your recoil suggests a *parental presence* norm not fully captured here.

  2.  **The Non-Alienability Corollary:** To ensure the child's entitlement is reliably met, the state reserves a portion of the care-time resource for *each legal parent* individually. This prevents intra-household pressure (often gendered) from depriving the child of a caregiving relationship with either parent.

      *   *Motivating Case:* (a) Non-transferable shares. Prevents the lower-earning parent (often mother) from being pressured out of leave, securing the child's bond with both parents.
      *   *Verdicts on New Cases:* N/A (Focuses on allocation between parents).
      *   *Tension with Your Verdicts:* Explains (a) but strains against (b). The principle clarifies (b): The *child's* need for adequate care overrides the non-alienability rule when only *one* conduit remains. The entitlement was always the child's; the allocation rule adapts to ensure delivery.

  3.  **The Anti-Poverty Floor Corollary:** The benefit level must guarantee *all* primary caregivers can realistically afford to provide care during the critical transition, irrespective of prior earnings or contribution history. High earners receive less than full replacement to fund this floor.

      *   *Motivating Cases:* (d) Self-employed/patchy records: The child's need exists regardless of formal labor market attachment; means-testing would exclude vulnerable children. (g) Floor/Cap: Ensures universality (all children covered) and sufficiency (caregivers aren't forced back to work prematurely due to poverty), funded progressively.
      *   *Verdicts on New Cases:* Reinforces entitlement for non-working parent (child's need + affordability).
      *   *Tension with Your Verdicts:* Directly justifies (d) and the structure in (g). Consistent with (c) - clawback undermines the security needed for the transition, turning it into a loan conditional on future employment, not child well-being.

  **How This Principle Handles Your Cases:**

  *   **(a) & (b):** Resolved by Child's Entitlement + Non-Alienability. The child needs care from available parents. Non-alienability protects against pressure reducing available caregivers. In (b), a parent's absence means the rule adapts to ensure the child still gets the full care-time resource through the remaining conduit.
  *   **(c):** Consistent. The benefit served the *child* during the critical period. Clawback would deter take-up and punish the child retroactively. Employer attachment is secondary.
  *   **(d):** Required by Anti-Poverty Floor. The child's need is universal.
  *   **(e) & (f):** **The Core Tension.** The principle *prima facie* allows (e) and (f) if adequate care is arranged. Your recoil at (e) suggests an implicit **Primary Caregiver Presence Norm**: The leave intends the recipient to be the *primary physical caregiver* during the transition period, fostering direct attachment. (f) is acceptable because the recipient is *becoming* a better caregiver (retraining), aligning with the child's long-term well-being. (e) violates this norm (substituting care without developmental justification, remote work implies distraction). *Implication:* Rules should require the leave-taker to be the primary caregiver, with exceptions for approved retraining/education demonstrably linked to caregiving capacity.
  *   **(g):** Required by Anti-Poverty Floor + universality.
  *   **(h) & (i):** Directly justified by Child's Entitlement Principle (transition exists, care needed).
  *   **(j):** Consistent. The *child's* critical transition (new parents) is distinct from the *surrogate's* physical recovery. She is not the child's legal parent/conduit for care. Paid medical leave (separate policy) covers her recovery. Two different needs.
  *   **Three-Adult Household:** Allocate non-transferable shares *only to legal parents*. The state recognizes the legal responsibility and the child's need for a bond with *them*. The live-in relative's role is valuable but private; the state shouldn't define household structures or create entitlements for non-legal caregivers via parental leave. The legal parents can use their time/resources to coordinate with the relative. (Follows from Non-Alienability focused on legal parents).

  **Where the Principle Challenges Your Intuitions (Honest Assessment):**

  1.  **(e) Daycare/Remote Work:** The core principle (absent your implicit Primary Caregiver Presence Norm) doesn't inherently forbid it if care is adequate. To justify your recoil, you *must* explicitly incorporate the norm that the leave-taker is intended to be the primary physical caregiver during the leave period for bonding. This is defensible (developmental psychology) but requires stating it clearly. Rules could require a declaration of primary caregiving and prohibit other paid work/education unless approved for caregiving enhancement (like retraining).
  2.  **(a)/(b) Strain:** The principle resolves this by showing the non-transferable share is a *mechanism* to ensure the child gets care from both parents, not an end in itself. When one parent is absent, the mechanism changes to ensure the child still gets the full resource. The *child's entitlement* is constant.
  3.  **Non-Working Parent:** The principle strongly supports entitlement, which you may find challenging if residual "earned benefit" thinking lingers. But your (d) stance aligns with this.

  **Candidate Principles Summarized:**

  1.  **Primary Principle (Child's Entitlement):** Public parental leave ensures every child receives adequate care during critical developmental transitions (birth, adoption, major health events) by enabling their primary caregivers to provide this care without financial hardship.
  2.  **Corollary 1 (Non-Alienability):** To secure the child's access to care from both legal parents, a portion of the care-time resource is reserved non-transferably to each.
  3.  **Corollary 2 (Anti-Poverty Floor):** Benefit levels guarantee all primary caregivers can afford to provide care, requiring a sufficient floor funded by progressive design (caps, earnings-related middle).

  This framework justifies most of your verdicts, provides clear answers to new cases, resolves the (a)/(b) tension via the child's constant need, explains the cost structure (general revenue), and forces an explicit choice on (e)/(f): embrace the Primary Caregiver Presence Norm as essential or relax your objection to (e). Your reversal on the three-adult case is resolved by tying non-alienability strictly to legal parenthood.
