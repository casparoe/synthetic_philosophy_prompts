prompt: |-
  You're the kind of decision theorist who's spent too many years hanging around social choice people — that's who I want answering this. Brainstorm a bit before you write anything down, and take it seriously rather than giving me the pat version.

  Setup so we're on the same page: a planner ranks lotteries over outcomes for a fixed set of people; each person has vNM preferences over the lotteries and the social ranking satisfies the expected utility axioms too; Harsanyi's aggregation theorem says that once you add a Pareto-style indifference condition, social utility has to be a weighted sum of individual utilities, and there's the other version where you imagine an equal chance of turning out to be anyone and the weights come out equal-ish, or whatever prior you feed in. That's the neighbourhood.

  What I actually want is the spec, not the survey: what would a theorem here have to deliver before you'd say, right, that's an adequate answer to how a planner should rank risky social prospects — with the case or the worry behind each requirement, and, more importantly, your view on which of the things people standardly demand are genuine desiderata and which are just the prejudices of one camp. I mean things like: do the weights have to be derived from something or is leaving them as free parameters acceptable; is managing without interpersonal comparisons a virtue or an evasion; is invariance to each person's utility being rescaled separately non-negotiable or a regularity nobody really needs; must the ranking come out the same whether you evaluate from behind the veil or after it lifts; does it have to cope with populations that aren't fixed, where who exists is itself uncertain.

  Two things I especially want fought over. First, a requirement of my own that I can't tell is legit: call it person-splitting neutrality — if you replace one person with two people who have the same utility function and care about the same things, each getting half of what the original would have got, the social ranking shouldn't budge. Is that a real constraint on aggregation or just egalitarianism smuggled in the back door? Second, tell me which subset of the requirements can't all be had at once, since if the list is jointly unsatisfiable that's the result I care about most, and say which single desideratum does the most work in knocking candidates out.

  A paragraph at the end briefly scoring the main contenders is fine, but keep the weight on the criteria. Two rules: write it as continuous prose, no headings, bullets, bold or tables, more like an email to a colleague than a handout; and be explicit about which of your claims are settled among people who actually work on this and which are live disputes, and don't hand me a contested position dressed up as the consensus. No citations or further reading, I can't get at any of it from here anyway.
reasoning: |-
  Hmm, this user is asking for a deep dive into the foundations of social decision theory under risk, specifically what axioms or desiderata should constrain a planner's ranking of lotteries over outcomes. They're clearly well-versed in Harsanyi's aggregation theorem and its variants but want to push beyond the standard framework. 

  The user's tone suggests they've encountered too many superficial treatments and want genuine intellectual wrestling - especially with two thorny issues: their proposed "person-splitting neutrality" axiom and identifying which desiderata conflict. They're explicitly rejecting bullet-pointed academic formalism in favor of continuous prose, almost like a Socratic dialogue. 

  Key philosophical tension points they want explored: 
  - Whether utility weights must be emergent (veil-of-ignorance style) or can be primitive 
  - If avoiding interpersonal comparisons is intellectually honest 
  - Whether utility rescaling invariance is essential or pedantic 
  - How to handle uncertain populations 
  - Most crucially, whether their person-splitting axiom is legitimate or question-begging 

  I should acknowledge upfront that much of this is contested terrain. The Pareto principle alone creates enough pressure toward additive aggregation that most debates are about which additional constraints to impose - and here's where real disagreements emerge. 

  On weights: Many decision theorists insist weights must be derived from symmetric reasoning (like the veil) to avoid arbitrariness, but social choice purists counter that free parameters allow flexibility for ethical priorities. Both have merit - the veil approach avoids dictator-like weight assignments, but fixed weights may better reflect actual policy tradeoffs. 

  Interpersonal comparisons: Calling them "evasive" isn't quite right; Arrow's impossibility taught us that avoiding them often leads to worse problems (like no social ordering at all). Harsanyi's utilitarianism essentially requires cardinal unit-comparable utilities - controversial but arguably necessary for coherent aggregation under risk. 

  Rescaling invariance: Technically indispensable for vNM-based frameworks since individual utilities are unique only up to affine transformations. But in practice, planners might fix scales via "zero" points (subsistence levels) or range-normalization. Still, violating this mathematically undermines the entire expected utility setup. 

  Veil-before/after consistency: This reveals a deep rift. Harsanyi treats the veil as merely illustrative, while Rawlsians/maximin advocates demand it fundamentally reshapes evaluation. I lean toward consistency being desirable but not mandatory - planners might reasonably discount future inequality differently after the veil lifts. 

  Variable populations: Here be dragons. Person-splitting neutrality touches this. If we accept that axiom, it implies a kind of utilitarianism where only total utility matters, not how it's distributed across people. But is that defensible? Consider: splitting a person with utility U into two clones each getting U/2 leaves total unchanged, so neutrality seems plausible. But it smuggles in a strong assumption that utility is linearly additive across persons - which is precisely what anti-utilitarians dispute. The axiom might be less "egalitarian" than "atomistically utilitarian." 

  Now the conflict users really want: Person-splitting neutrality clashes violently with any equity concern. If we care about inequality, splitting a miserable person (U=-10) into two equally miserable people (each U=-5) shouldn't be socially indifferent - it's arguably worse by dispersion-sensitive metrics. Even prioritarianism would reject this. 

  The killer desideratum? Probably rescaling invariance combined with strong Pareto. Once you demand that social evaluation respect each individual's vNM scale (rescaling invariant) and Pareto improvements, you're forced toward linear aggregation. Add person-splitting and you get total utilitarianism. But drop rescaling invariance and you open doors to Nash products or leximin - at the cost of making utility scales manipulable. 

  Contenders scored briefly: 
  - Harsanyi utilitarianism (fixed weights): Clean but weights arbitrary without veil 
  - Veil-of-ignorance: Elegant but assumes risk-neutrality behind veil 
  - Prioritarianism: Captures equity but violates linearity and rescaling 
  - Nash social welfare: Handles ratios but not level comparisons 

  Ultimately the user's person-splitting axiom is the litmus test - accepting it commits you to a very specific (and controversial) view of persons as utility-carrying vessels.
answer: |-
  Alright, let's dig into the muck. You're asking what a theorem needs to *do* to feel like a satisfying answer to the risky social ranking problem, dissecting the standard demands, and tackling your person-splitting head-on. The "consensus" here is thin ice – Harsanyi provides a *framework*, not a settled answer, and the disputes are fundamental.

  First, the non-negotiables stemming directly from the setup you described (vNM individuals, vNM social ranking, Pareto indifference): **Social ranking *must* be a linear aggregation of individual vNM utilities.** That's Harsanyi's core. The weights are mathematically necessary. The real fight is over *what constrains those weights* and *what the utilities represent*.

  Now, the desiderata battleground:

  1.  **Derived Weights vs. Free Parameters:** Should the weights emerge from a principle (like the veil of ignorance) or are they primitive ethical choices? Pro-derivation: It avoids arbitrariness and grounds ethics in impartiality/symmetry. Pro-free: Planners *have* ethical priorities; pretending otherwise is naive. Free parameters feel like evasion to many, but forcing derivation often smuggles in specific ethical assumptions (e.g., risk-neutrality behind the veil). Verdict: Derivation is desirable for objectivity, but demanding it *always* might rule out legitimate pluralism. It's a live dispute whether "adequate" requires derivation.

  2.  **Interpersonal Comparisons (IC): Virtue or Evasion?** Avoiding IC is often claimed as a virtue (Arrow's spirit). But here's the rub: Harsanyi *requires* cardinal, unit-comparable utilities. vNM gives cardinality *within* an individual, but aggregation needs comparison *across* them. Claiming otherwise is incoherent within this setup. The weights *are* the IC mechanism. "Managing without IC" is impossible here; pretending you are is the evasion. The real dispute is *how* we ground those comparisons (behaviorally? ethically?), not whether they exist.

  3.  **Separate Rescaling Invariance (SRI):** Must the ranking be invariant if I rescale Alice's utility (u_A' = k_A * u_A + b_A) and Bob's independently? This is non-negotiable *if* you take individual vNM utilities as primitive data. vNM utilities are unique only up to affine transformations. If the social ranking changed under permissible rescaling of the inputs, it would violate the premise that we're aggregating *vNM utilities*. Violating SRI means your aggregation is sensitive to the arbitrary scaling choices of the individuals/modeler, which is indefensible for a formal theory using vNM as its basis. This *is* largely settled among those working *within* the vNM/Pareto framework you described. Disputes arise when people reject vNM for individuals or Pareto.

  4.  **Veil Consistency:** Must the ex-ante social ranking (behind the veil) align perfectly with the ex-post ranking (after lifting)? Not necessarily. The veil is a *justificatory device* for impartiality. The ex-post ranking is the operational one for the planner. They *could* differ. A planner might use the veil to determine weights but then apply those weights ex-post without re-running the "lottery of being someone." Consistency is clean, but demanding it conflates justification with operation. This is contested, but many see the veil primarily as justification, not an operational requirement.

  5.  **Variable Populations:** This is crucial and explosively hard. Fixed populations are a massive simplification. A "good" theory *must* handle uncertainty over who exists. This wreaks havoc with Pareto (can't require improving non-existent people's welfare) and aggregation forms (average vs. total utilitarianism becomes pivotal). Person-splitting neutrality feeds directly into this. Any contender ignoring variable populations feels deeply inadequate.

  **Your Person-Splitting Neutrality (PSN):** Replace Alice (getting X util) with two clones, each identically constituted (same UF, same concerns), each getting X/2 util. Ranking unchanged? This *feels* intuitive: total utility is the same, the "substance" of welfare is identical, just distributed across more carriers.
  *   **The Case For:** It seems to capture a neutrality about the *number* of welfare subjects, focusing purely on the total "welfare stuff." It pushes strongly towards *Total Utilitarianism* (TU) under risk. It avoids arbitrariness in how we individuate persons. If the clones are truly identical in relevant ethical respects, why should splitting matter?
  *   **The Case Against (The Smuggling Charge):** This is potent. PSN *assumes* that utility is perfectly additive and linearly comparable across distinct persons – the core utilitarian commitment. It rules out *any* concern for the distribution *per se* among existing persons. Prioritarians, egalitarians, or even Average Utilitarians would scream. If Alice suffers horribly alone (U=-100), is it equivalent to two clones each suffering horribly (U=-50 each)? PSN says yes. Many find this repugnant. It doesn't just *allow* TU; it *demands* TU under risk once you accept the vNM/Pareto core. It's not egalitarianism smuggled in; it's *utilitarianism* smuggled in as a neutrality condition. It's a live wire – proponents see it as fundamental, opponents as question-begging.

  **Conflicts and the Kingmaker Desideratum:**

  The deepest conflict arises when you add distributional sensitivity (like equity concerns) to the vNM/Pareto/SRI core. **SRI is the silent killer.** Combined with Strong Pareto and continuity, it relentlessly pushes towards linear aggregation (weighted sum). Any non-linear form (like prioritarianism, Nash product, leximin) that values equality or priority *will* violate SRI. It might be invariant to *common* rescaling, but not *separate* rescaling. If you care about the *ratio* of utilities or absolute levels in a non-linear way, changing Alice's scale unit independently breaks your ranking. SRI, combined with the other axioms, is why Harsanyi's linear form is so robust. It's the most technically constraining desideratum within this framework. PSN then pushes that linear form all the way to TU and demands no distributional concern *across* persons.

  **Contenders Scored Briefly:**

  *   **Harsanyi (Fixed Weights):** Adequate only if free parameters are acceptable. Fails derivation, struggles with variable populations, ignores distribution.
  *   **Harsanyi (Veil Derivation):** Strong on derivation/impartiality. But veil assumptions (esp. risk-neutrality) are contested. Still struggles with variable populations/distribution.
  *   **Total Utilitarianism (Risk):** Delivers derived weights (equal, via veil or symmetry), handles variable populations naturally, satisfies PSN. But violates distributional concerns fundamentally (repugnant conclusions, ignores equity). SRI is satisfied.
  *   **Prioritarianism (Risk):** Captures distribution (priority to worse off). But violates SRI spectacularly (weights depend non-linearly on absolute levels), struggles technically with variable populations, weights often seem arbitrary. Derivation is murky.
  *   **Ex-Post Egalitarianism:** Evaluate equality after risk resolves. Violates ex-ante Pareto (might reject a Pareto superior lottery because it *could* lead to inequality) and often the vNM social axioms. SRI may or may not hold depending on implementation.

  **The Takeaway:** An "adequate" answer depends entirely on which ethical intuitions you prioritize. To satisfy the core vNM/Pareto/SRI setup *and* capture any meaningful aversion to ex-post inequality or priority, you likely need to relax something fundamental – perhaps the vNM axioms for the *social* ranking, or Strong Pareto, or accept that SRI must be violated. PSN is a powerful lever pushing hard towards Total Utilitarianism; accepting it resolves many issues (weights, variable populations) at the cost of distributional ethics. Rejecting it opens space for other values but makes the aggregation problem vastly harder, especially under risk and uncertain populations. SRI remains the technical linchpin that makes non-linear aggregation so difficult within this specific, dominant framework. There is no consensus; there are only competing, fundamentally different ethical commitments expressed through axioms.
