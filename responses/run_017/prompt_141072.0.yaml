prompt: |-
  I'm teaching a graduate seminar on the emotions this term, and I want the first session to settle what a theory of emotion is even for before we open any of the candidates. So write me the specification: the requirements an adequate theory of what emotions are would have to meet, each with the case or consideration that makes it a requirement, and a verdict on which are non-negotiable and which are only preferences of one camp.

  Fix the purpose this way. I want a theory good enough to underwrite the kind of emotion ascription institutions make: a clinician saying that a patient's fear is disproportionate to her situation, a court treating an anger as culpable or as mitigating, a grief that does or does not fit its loss, a system that labels a face afraid. The theory has to earn the right to call an emotion correct or incorrect, and to say whose emotion it is.

  The cases I want handled, at a minimum: the recalcitrant emotion, where someone judges the situation harmless and is frightened anyway; emotions whose object seems to be an absence, a non-occurrence, or a bare chance rather than an event, such as relief at a cancellation, fear of a one-in-ten-thousand outcome, or the resentment that attaches to a long pattern of small slights rather than to any one of them; emotions that seem essentially spread over time, with no instant at which they are wholly present, like suspense, anticipation, or grief; emotions addressed to someone rather than merely about them, where having the emotion seems itself to make a claim, as with resentment, gratitude, or an anger that demands acknowledgement; and emotions in subjects who lack the relevant concepts, an infant's distress at separation or an animal's fear of a learned cue, if you think those belong. Two further constraints the list should confront rather than assume: that a theory be able to say what makes something one emotion rather than two, and how emotion is to be marked off from mood, from sentiment, from sheer bodily feeling, and from wanting; and that the best-known results of affective science apparently give us no distinctive autonomic or neural signature per emotion category, so any requirement that quietly implies one should be flagged as doing so.

  What I most want is the sorting. Which of these demands are genuine, and which are a prejudice of the perceptualists, the judgmentalists, or the feeling theorists that the rest of us need not accept? Is some subset of them unsatisfiable together, since if so that is itself the result I care about? And which single requirement does the most work in excluding candidates? Close with no more than a paragraph each on how the judgment view, the perceptual or attitudinal view, and the feeling view come out against the list. Write the whole thing as continuous prose, with no headings, bullet points, bold text, or tables, because I'll be reading it aloud at the start of the session.
reasoning: |-
  Okay, the user is teaching a graduate seminar on emotions and wants the first session to establish what a theory of emotion must accomplish before examining specific theories. They need a specification of requirements for an adequate theory of emotion, with each requirement justified by a case or consideration, and a classification of which are non-negotiable versus camp-specific preferences. The purpose is to underwrite emotion ascription in institutional contexts like clinical, legal, and AI systems, where correctness and ownership of emotions matter.

  The user provides several key cases that must be handled: recalcitrant emotions (e.g., judging something harmless but feeling fear anyway), emotions with non-standard objects (like relief at a cancellation or fear of low-probability events), temporally extended emotions (such as suspense or grief), addressed emotions (like resentment that demands acknowledgment), and emotions in concept-lacking subjects (infants or animals). Additionally, the theory must distinguish emotions from related states (moods, sentiments, etc.) and account for affective science findings showing no distinctive autonomic signatures per emotion category.

  The core challenge is sorting these demands into genuine requirements versus camp-specific preferences, identifying any unsatisfiable combinations, and determining which requirement does the most work in excluding candidate theories. The user also wants brief assessments of how judgmentalist, perceptual/attitudinal, and feeling-based theories fare against these requirements.

  For the requirements specification, I consider several categories: correctness conditions, ownership, object-directedness, temporal structure, normative address, concept-independence, individuation, and demarcation from related states. The institutional purpose makes correctness and ownership non-negotiable, while concept-independence is also likely essential. Object-directedness and temporal structure may have some flexibility as different theories handle them differently. Distinguishing emotions from moods and other states seems non-negotiable for conceptual clarity.

  The most demanding requirement appears to be correctness conditions, as it forces theories to account for normative assessment while handling recalcitrance—a challenge for judgmentalism. The lack of distinctive neural signatures further complicates any theory relying on physiological markers. 

  For theory assessments: Judgment views struggle with recalcitrance and concept-lacking subjects but handle correctness and normative address well. Perceptual views manage recalcitrance and correctness but may falter with concept-independence and normative address. Feeling views handle concept-lacking subjects and demarcation from judgments but struggle with correctness and object-directedness.

  Notably, satisfying all requirements simultaneously seems difficult due to tensions between normative assessment and concept-independence, and between temporal extension and synchronic identification. The user's pedagogical goal will be served by highlighting these tensions as they evaluate theories throughout the seminar.
answer: |-
  An adequate theory of emotion, particularly one capable of grounding institutional ascriptions involving correctness, ownership, and normative force, must meet several interrelated requirements. These emerge from the phenomena themselves and the specific purpose of underwriting practices in clinical, legal, and computational settings.

  First, the theory must provide robust **correctness conditions**. It must explain how an emotion like fear or grief can be *disproportionate* (clinically), *culpable* or *mitigating* (legally), or *fits* its object. This requirement is non-negotiable, driven by the core institutional cases. It necessitates that emotions have intentional objects (what they are about) and involve some form of appraisal or evaluation of that object against which their appropriateness can be assessed. Recalcitrant emotions, where one judges the situation harmless yet feels fear, pose a direct challenge here, demanding an account where the emotion's evaluative component isn't simply identical to an occurrent judgment.

  Second, it must establish clear **ownership**. The theory must say why *this* patient’s fear is disproportionate, or why *this* defendant's anger is culpable, not just that *an* emotion is present. This requires explaining how emotions are states or processes of a particular subject, integrated into their psychology in a way that grounds attributability. It’s non-negotiable, as institutional practices inherently assign emotions to individuals.

  Third, the theory must account for the **diversity of emotional objects**. It cannot presuppose that emotions are only about present, concrete events. It must handle relief at a *cancellation* (a non-event), fear of a *one-in-ten-thousand chance*, or resentment over a *pattern of slights* rather than a single act. This demands an account of intentionality flexible enough for absences, probabilities, and distributed or abstract objects. While the *need* to account for these cases is non-negotiable (they are real phenomena), the *specific way* an object is constituted (e.g., via thought, perception, or attitude) may be camp-dependent.

  Fourth, it must accommodate **temporal structure**. Emotions like suspense, anticipation, or grief unfold over time, lacking a single instant of full presence. An adequate theory cannot assume emotions are always punctate states; it must explain their durational nature and potential phase-structure. This requirement is genuine (based on the phenomena) and non-negotiable for completeness, though theories may differ in how they model temporal extension.

  Fifth, the theory must explain **normative address**. Some emotions (resentment, gratitude, certain angers) seem intrinsically to *make a claim* on their target or demand acknowledgment. This interpersonal, quasi-communicative dimension is a genuine requirement, evident in the legal and interpersonal cases. It necessitates an account where the emotion itself embodies a stance or demand directed *to* someone, not just *about* them. How deeply this is built into the emotion's nature (essential vs. contingent) is contested.

  Sixth, it must allow for **concept-independence**. If infant separation distress or animal fear of a learned cue are genuine emotions, the theory must explain how these can occur without the subject possessing concepts like "danger" or "loss." This challenges views that tie emotions tightly to propositional judgments. The requirement is non-negotiable if we accept these cases as emotions, forcing an account of non-conceptual evaluation.

  Seventh, the theory must provide principled **individuation criteria**. It must say what makes fear distinct from anger, or grief distinct from sadness, addressing potential overlaps (e.g., anxiety vs. fear). Relatedly, it must **demarcate emotion** from near neighbors: distinguishing an emotion (fear) from a mood (anxiety), a sentiment (lingering dislike), a sheer bodily feeling (dizziness), or a desire (wanting to escape). Clear individuation and demarcation are non-negotiable for conceptual utility and avoiding category errors in application. However, the *basis* for demarcation (evaluative theme, functional role, phenomenal quality) is a major point of contention. Crucially, the well-established absence of distinctive autonomic or neural signatures per emotion category *must* be confronted; any requirement implicitly demanding such a signature (e.g., a strict identity with a specific physiological pattern) is invalid and must be flagged as such.

  Sorting these demands reveals tensions. Correctness conditions and normative address push towards cognitively rich views, while concept-independence and the absence of neural signatures pull towards more basic, embodied, or non-conceptual accounts. Recalcitrance challenges judgmentalism, while temporal extension challenges overly simplistic feeling models. The most demanding single requirement is likely **correctness conditions combined with recalcitrance**. This pair forces the theory to have a robust evaluative component *without* collapsing it into judgment, excluding simplistic judgmentalism and posing challenges for pure feeling theories. The most significant potential unsatisfiability may lie in simultaneously satisfying strong normative address (as an essential feature of some emotions) and concept-independence, if normative address is thought to require sophisticated conceptual capacities.

  Against this list, **Judgmentalism** (emotions as judgments) excels at correctness, normative address, and object diversity via propositions, but founders on recalcitrance (how can I judge not-P and simultaneously emotionally judge P?), struggles with concept-independence and temporal extension (judgments are often punctate), and risks conflating emotion with belief. **Perceptual/Attitudinal Views** (emotions as perceptions of value or evaluative attitudes) handle recalcitrance (perception/judgment can conflict), correctness (via accuracy conditions), object diversity, and often temporal extension better. They may struggle with normative address’s demandingness and concept-independence (depending on how "perception" is construed), and the lack of neural signatures challenges strong perceptual realism. **Feeling Theories** (emotions as distinctive conscious feelings or bodily patterns) handle concept-independence and demarcation from judgment easily, but struggle profoundly with correctness (can a feeling be *disproportionate*?), normative address, object-directedness (especially for absences/probabilities), and individuation given the lack of unique physiological signatures. Temporal extension also poses challenges for punctate feeling models. Each camp satisfies some requirements well but falters significantly on others, highlighting the specification's power to reveal theoretical costs.
