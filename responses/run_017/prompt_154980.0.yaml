answer: |-
  Below is a comprehensive, ready-to-implement role-play design tailored to your specifications. It exposes students to **estrangement** and **indeterminacy in idealization procedures** without prior lecture or naming the problems. The design uses thin vignettes, two distinct consultant roles, and a structured timeline to ensure students "run into" the issues experientially. I'll first address your core concerns frankly:

  - **Will it manufacture divergence?** No—the vignettes are plausible life decisions where factual beliefs and desires interact in ways that *naturally* expose indeterminacy (e.g., beliefs about job stability or family needs). The divergence arises from the procedural ambiguity inherent in ideal advisor theories, not contrivance.
  - **Will it work without a lecture?** Yes—the thin vignettes force consultants to fill in motives (risking value-importation), while the trace requirement surfaces estrangement. The debrief maps student experiences to the target problems.
  - **What can't it stage?** The role-play **cannot demonstrate that no meta-idealization resolves indeterminacy**. You’ll need to argue post-activity that no "further fact" (e.g., a super-idealized advisor) settles which order is correct, as this requires abstract philosophical engagement.
  - **Predictable issues**: 
    - Consultants will **import their own values** due to vague vignettes (e.g., assuming "stability" is universally desired). 
    - Agents will **treat advice as prediction** (e.g., "What *would* I do with more info?" vs. "What *should* I do?"). 
    - Consultants will **struggle with tracing** to actual concerns, leading to weak justifications that highlight estrangement.

  ---

  ### **Roles and Rules**  
  **Roles for 14 Students** (adjustable for no observers):  
  - **4 Agents**: Decide based on consultant advice.  
  - **8 Consultants**: 4 pairs (2 per agent); each pair has one Type A and one Type B.  
  - **2 Observers**: Track estrangement/indeterminacy during consultations.  
  *If fewer students: Use 3 agents, 6 consultants, and integrate observers as agents/consultants.*  

  **Rules**:  
  1. **Agents** receive a vignette (below) but **cannot share their motives**—only the decision context.  
  2. **Consultants** work alone using their instructions (below) to generate:  
     - A recommendation (e.g., "Take the museum internship").  
     - A "trace note" linking it to the *actual* agent’s concerns (e.g., "Traces to your love of art").  
  3. **Agents** hear both recommendations, then commit in writing to one in front of the class.  
  4. **Observers** note: (1) When advice feels disconnected (estrangement), (2) When consultants disagree due to procedure (indeterminacy).  

  ---

  ### **Vignettes (Thin Decision Contexts)**  
  *Distribute one per agent. Motives are omitted to force consultants to infer/impose values.*  
  1. **Job Offer**: You’re a recent art-history graduate. Choose between:  
     - A high-paying consulting job (tedious, stable).  
     - A low-paying museum internship (fulfilling, unstable).  
  2. **Family Move**: You’re a 45-year-old manager. Choose between:  
     - A promotion requiring relocation (career boost, uproots teen kids).  
     - Staying put (stable, no family disruption).  
  3. **Career Switch**: You’re a 30-year-old engineer. Choose between:  
     - Keeping your stable tech job.  
     - Quitting to start a risky food-truck business (a dream).  
  4. **Inheritance**: You’re 50, inheriting a parent’s house. Choose between:  
     - Selling it (financial relief, but loses memories).  
     - Keeping it (expensive, preserves memories).  

  ---

  ### **Consultant Instruction Sheets**  
  **Key Difference**: Type A corrects *beliefs first*; Type B strips *desire-dependent-on-false-beliefs first*. This creates divergent advice.  

  #### **Sheet A: Type A (Beliefs First)**  
  *You are an idealized advisor: more informed, rational, and imaginative. Advise what the agent has reason to do.*  
  1. **Correct beliefs**: Start by fixing factual errors. Assume you know all truths (e.g., actual job success rates, costs, risks). Update the agent’s beliefs.  
  2. **Adjust desires**: Let desires settle under these new facts. Imagine what the agent would want if thinking clearly/vividly.  
  3. **Recommend**: What should the agent do? Base this on the updated self.  
  4. **Trace note**: Attach a note tracing your advice to the *actual* agent’s concerns (e.g., "This traces to your current desire for fulfillment").  

  #### **Sheet B: Type B (Desires First)**  
  *You are an idealized advisor: more informed, rational, and imaginative. Advise what the agent has reason to do.*  
  1. **Strip desires**: Remove any desires relying on false beliefs (e.g., if the agent wants the museum job because they falsely believe it’s stable, ignore that desire).  
  2. **Correct beliefs**: Update all beliefs with full information.  
  3. **Adjust desires**: With remaining desires and new facts, imagine what the agent would want if thinking clearly/vividly.  
  4. **Recommend**: What should the agent do? Base this on the stripped/updated self.  
  5. **Trace note**: Attach a note tracing your advice to the *actual* agent’s concerns *not* depending on false beliefs (e.g., "This traces to your core love of art, which isn’t based on falsehoods").  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0:00–0:10 — Setup (10 min)**  
  - Assign roles: 4 agents, 8 consultants (2 per agent, half Type A/B), 2 observers.  
  - Distribute: Agents get vignettes; consultants get instruction sheets (A or B); observers get notecards with prompts: *Note when advice feels disconnected or when consultants clash due to steps.*  
  - **Rules reminder**: Agents don’t share motives; consultants work alone; trace notes required.  

  **0:10–0:15 — Agent Reflection (5 min)**  
  - Agents silently read vignettes. *Prompt: "Jot down your real-world concerns—but keep private."*  

  **0:15–0:35 — Consultant Prep (20 min)**  
  - Consultants read their agent’s vignette and use instructions to craft:  
    - A recommendation (1–2 sentences).  
    - A trace note (1 sentence: "Traces to [actual agent’s concern]").  
  - **Predictable issue**: Consultants import personal values (e.g., "Everyone values security" for Job Offer). Observers circulate and note struggles.  

  **0:35–0:55 — Consultations (20 min)**  
  - Groups meet: Each agent with their two consultants (e.g., Agent 1 + Consultant A1 + Consultant B1).  
  - **Structure**:  
    - Consultant A presents recommendation + trace note (2 min).  
    - Consultant B presents recommendation + trace note (2 min).  
    - Agent asks questions (3 min).  
    - Agent writes commitment: "I choose [A/B] because ______" (3 min per group).  
  - **Predictable issues**:  
    - Agents treat it as prediction ("Which future me is more likely?").  
    - Trace notes feel forced (e.g., vague claims like "Traces to your happiness").  
    - Type A/B often disagree (e.g., Type A: "Take the promotion—it’s wiser with facts"; Type B: "Stay—your family desire isn’t false-based").  

  **0:55–1:10 — Public Commitment (15 min)**  
  - Agents share in front of class:  
    - Their decision context.  
    - Both recommendations and trace notes.  
    - Their choice and brief reason.  
  - **Goal**: Highlight divergence and estrangement (e.g., "I chose B, but A felt irrelevant to me").  

  **1:10–1:30 — Debrief (20 min)**  
  ***Map Experiences to Problems***  
  1. **Estrangement Exposure** (10 min):  
     - Ask agents: "Did any advice feel disconnected from *you*? Did trace notes justify it?"  
     - Ask consultants: "How hard was tracing? Did advice drift from actual concerns?"  
     - **Map to theory**: "This is **estrangement**—idealization can sever advice from actual motivations. The view needs an account of *why advice binds* when inheritance fails (e.g., constitutive rationality)."  
     - *Student moments*: Agents rejecting advice; weak trace notes; observers noting disconnection.  

  2. **Indeterminacy Exposure** (8 min):  
     - Ask: "Why did consultants for the same agent disagree?" Highlight order dependence.  
     - Ask observers: "Did procedural differences cause clashes?"  
     - **Map to theory**: "This is **indeterminacy**—no unique idealization procedure. Beliefs-first vs. desires-first changes outcomes. The view needs *uniqueness* (but none exists)."  
     - *Student moments*: Type A/B conflicting advice; agents torn between procedures.  

  3. **Survival Requirements** (2 min):  
     - "To survive, this view needs:  
       - For estrangement: Why normativity *inherits* from actual concerns despite drift.  
       - For indeterminacy: A non-arbitrary *uniqueness claim* for idealization—but this is unresolved."  
     - **Frank gap**: "The role-play can’t prove no meta-idealization solves indeterminacy—I’ll argue post-debrief why no ‘further fact’ helps."  

  ---

  ### **Materials Summary**  
  - **Vignettes**: 4 thin scenarios (Job Offer, Family Move, Career Switch, Inheritance).  
  - **Consultant Sheets**: Type A (beliefs first), Type B (desires first).  
  - **Observer Prompts**: "Note: (1) Advice disconnected from agent? (2) Consultants disagree due to steps?"  
  - **Agent Commitment Form**: "I choose [A/B] because ______."  

  This design ensures students encounter estrangement (through trace struggles and agent disconnection) and indeterminacy (through procedural disagreements) experientially. Run it as-is—it avoids manufactured divergence by leveraging natural decision ambiguities. Post-activity, you’ll only need to argue the meta-idealization gap.
