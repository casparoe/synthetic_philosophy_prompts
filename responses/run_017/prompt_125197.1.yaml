prompt: |-
  Hey. Please take your time with this and think it through properly rather than banging out something generic — I want you to act as a philosopher who knows the paternalism and choice-architecture literature cold but who has also sat in on real operations meetings where nobody has time for theory. Start with a couple of paragraphs of brainstorming: which distinctions from that literature actually have to survive into a ten-minute checklist, and which ones I should drop because they'd just paralyze my staff. Then give me the thing itself.

  I run operations at a community health center, three sites, roughly forty thousand visits a year, mostly patients on Medicaid or uninsured, a lot of limited English, and a lot of people who have had the system lie to them before. My job includes the paperwork and the defaults: how the intake tablet words its questions, whether your next appointment gets booked before you leave or you have to call, what the reminder texts say, what's preselected in the e-prescribing dropdown, whether people get auto-enrolled in our med-sync program. I sign off on maybe forty or fifty of these changes a year, in batches, ten minutes each if I'm lucky. There's no pilot, no data beyond whatever our dashboard shows a month later, the only other person who has to agree is a nurse manager, and the board gets a one-paragraph summary. So I need an actual procedure, not a discussion of the issues.

  Here's why it got personal. My younger brother has schizoaffective disorder and for about six years our family arranaged his life so that the easiest thing for him to do was also the thing that kept him well — rent autopayed, pills in a blister pack, my call every Sunday at seven, the fridge stocked a certain way. It worked, definately, better than anything else we tried. Then last year he found out how much of it had been set up without his knowledge, and he was furious with all of us for months — not about the outcomes, which he agrees were good, but about the fact that he hadn't been in on them. And I genuinely cannot tell any more which parts of what we did were the defensible kind and which were just us deciding for him.

  So: give me a decision procedure I can run in ten minutes on a proposed nudge, with the questions in the order I should ask them, what counts as a real answer to each, where it stops with a hard no, and where it has to hand the decision to a person because the disagreement is about values and not facts. The part I keep going in circles on is whose ends a nudge is tracking — not "is this good for them," but whose judgment about what's good for them counts, especially for someone whose own judgment swings. Is there anything usable to borrow from how surrogate medical decisions are supposed to work, the thing where you're meant to decide what the person would have wanted rather than what you think is best? And I also need the distinction between nudges that only work while the person doesn't know they're being nudged and nudges that still work once you've announced them on the waiting room wall — except I think there's a third case that neither of those covers, where the person does know and is glad, like my brother's Sunday call, and I don't know what to do with that one.

  Then run it on three things, and include at least one where the procedure spits out an answer I won't like. First: booking the follow-up appointment before the patient leaves the building, with an opt-out. Second: preselecting the generic in the prescribing dropdown. Third: our no-show text, which says we've held a slot for them personally and asks them to reply NO if they can't make it — that one cut our no-show rate by about a third, it's the thing I'm proudest of, and I'm pretty sure you're going to tell me to stop sending it, so argue with me about it rather than just ruling.

  Be honest about what the procedure can't do: where it won't settle a case and someone just has to decide, and where it'll misfire on my particular population. Don't give me citations or a reading list, I can't look anything up from work and I'd only skip it anyway. Write the whole thing as continuous prose, like an email or something you'd say over coffee — no headings, no bullet points, no bold, no tables. If it has to be a sequence of steps, write them as numbered sentences inside paragraphs, that's fine, but no lists as such. Keep it under about thirteen hundred words, and please write in American English.
reasoning: |-
  Okay, let me start by really understanding what this operations manager needs. They run a community health center with high-volume, vulnerable patients. They make dozens of nudge decisions yearly with no time for theory—just ten minutes per review. The personal story about their brother adds a crucial layer: the tension between effective paternalism and autonomy, especially when people discover they've been nudged without consent.

  The core challenge is creating a practical decision tool that:
  - Filters philosophical distinctions down to actionable checks
  - Handles the "whose ends?" dilemma (patient's vs. provider's judgment)
  - Accounts for transparency effects (hidden vs. disclosed nudges)
  - Flags when values conflict and humans must decide

  Key insights from their context:
  - Population has trauma from systemic betrayal (distrust is high)
  - Low-literacy/LEP needs make simplicity non-negotiable
  - No piloting capacity—decisions hinge on anticipation, not data
  - Nurse manager co-approval suggests clinical input matters

  I'll need to distill literature into three survival-tier distinctions:
  1. **Ends vs. means**: Is the nudge hijacking goals or smoothing paths? (Critical)
  2. **Transparency resilience**: Does it fail if disclosed? (Needs the "third case" where disclosure adds value)
  3. **Judgment source**: Whose definition of "good" applies? (Borrow substituted judgment from medical ethics)

  Now structuring the 10-min checklist:
  - Must start with harm prevention (non-negotiable stops)
  - Then autonomy checks (opt-outs, transparency)
  - Ends-tracking as the core dilemma (using brother's case as a pivot)
  - Finally, bias/disparity filters for population risks

  For the three test cases:
  1. **Auto-book follow-up**: Likely passes but needs opt-out prominence. Shows "easy = good" bias risk.
  2. **Generic preselection**: Clear pass (clinical standard + cost help). Demonstrates medical necessity overriding.
  3. **No-show text**: Tricky—exploits guilt via personalization. Fails transparency test (disclosure kills effectiveness) and possibly judgment source (our convenience vs. their shame). Forces a values choice.

  The procedure's limits:
  - Can't resolve when "patient's hypothetical choice" is unknowable
  - Blind spots in low-literacy adaptations (e.g., icons as nudges)
  - Won't fix power imbalances—just flags them

  Personal note: The brother's story reveals nudges can be both loving and oppressive. The key is whether we're scaffolding agency or overriding it. That tension stays live in the checklist.
answer: |-
  Here’s how I’d approach this. After years in both philosophy seminars and operations rooms, I’ve learned that most distinctions in the nudging literature collapse under real-world pressure. What survives are three core questions: Whose goal is being served? Can the person easily override this? And would they still accept it if they knew? Everything else—libertarian paternalism, System 1 vs. 2, all that—is noise for your context. Your procedure needs to catch coercion hiding as help, respect trauma-shaped distrust, and flag when you’re deciding values, not facts. Borrowing from surrogate decision-making helps: we ask what the *patient* would choose if their judgment were stable, not what we think is best. And you’re right—there’s that third transparency case where disclosure *builds* trust, like your Sunday calls. We’ll handle that.  

  Here’s the ten-minute checklist. Run it in order. If you hit a "stop," you reject the nudge or redesign it. If you hit "handoff," you and the nurse manager must vote based on your values—no procedure can solve those.  

  First, ask: "Does this nudge prevent immediate, concrete harm?" Look for things like medication errors, falls, or missed critical care. If yes, it’s likely defensible even if heavy-handed (e.g., auto-filling allergy warnings in e-prescribing). But if the harm is vague or long-term ("they might not exercise"), stop. Your population’s distrust means "future you will thank you" just sounds like another lie. Exception: if it mirrors an emergency medical surrogate call, like overriding a refusal during psychosis, but that’s rare in paperwork nudges.  

  Second, ask: "Can the patient override this in one visible, obvious step?" Opt-outs must be as easy as the default. "Call us to cancel" isn’t easy if phones are unreliable. "Click here not to book" on the tablet is. If overriding requires literacy, English fluency, or multiple steps, stop. Your population loses here.  

  Third, ask: "Whose goal does this track?" This is where your brother’s pain lives. Don’t ask if it’s "good" for patients. Ask: "Is this goal explicitly stated or implied by *their* prior choices?" For example, if they asked for cheaper meds last visit, generic preselection tracks *their* goal. If we auto-enroll them in med-sync because *we* want efficiency, it might not. When goals conflict, borrow the surrogate standard: "What would this patient choose if their judgment weren’t impaired?" Not "what’s best," but what aligns with *their* values during stable moments. For your brother, Sunday calls might align with his stable wish to stay connected, while hidden rent payments ignored his agency. If there’s no way to know their stable goal (e.g., a new patient with no history), handoff to you and the nurse manager—this is values territory.  

  Fourth, ask: "If we put this nudge on a poster in the waiting room, would it backfire, hold steady, or build trust?" That’s your transparency test. Most nudges fall apart when exposed ("They tricked me!"). Some hold steady (e.g., generic scripts—patients might shrug). The golden third category builds trust because it feels like care, not control ("We auto-book follow-ups so you don’t lose your spot—click here if it’s a bad time"). If exposure kills the nudge (it only works in the dark), stop. It’s manipulation. If exposure builds trust, it’s likely ethical.  

  Fifth, ask: "Could this worsen a disparity?" Test it against your most vulnerable subgroups: limited English, trauma survivors, unstable housing. Would an opt-out be missed by someone with low literacy? Does guilt-tripping no-shows retraumatize someone who’s been gaslit by the system? If yes, stop.  

  Now, let’s run your cases:  

  Auto-booking follow-ups before you leave: Prevents harm? Yes (missed care). Override easy? If one tap cancels, yes. Whose goal? Likely theirs—they came today; stable-them wants continuity. Transparency? Disclose it as "we hold your spot to save you time." Builds trust. Disparity? Only if override isn’t obvious. Passes.  

  Preselecting generics: Prevents harm? Yes (cost barriers cause skipped meds). Override easy? Yes (dropdown shows brands). Whose goal? Theirs—they complain about costs. Transparency? Holds steady ("generics save you money" is neutral). Disparity? None. Passes easily.  

  Your no-show text: "We held this slot for you personally. Reply NO if you can’t make it." Prevents harm? Debatable—it cuts no-shows, but harm is operational, not clinical. Override easy? Yes (reply NO). Whose goal? Not theirs—they might *want* to skip without guilt. Handoff: Would stable-them choose to avoid this guilt? Unknowable. Transparency? Fails catastrophically. If you post: "We guilt-trip no-shows to fill slots," patients feel manipulated. It only works hidden. Disparity? Yes—trauma survivors hear "you owe us" as coercion. Stops. I know you’re proud of it, and it "works," but it fails the transparency and goals tests. The harm it prevents (clinic efficiency) isn’t *their* harm. You’d need to redesign: "Need to reschedule? Reply HELP. We’ll find a better time." Still nudges, but tracks *their* goal (flexibility) and works even if disclosed.  

  Where this misfires: When patients have no stable "prior self" to reference (e.g., severe dementia), you’ll hit handoffs often. When distrust is so high that *any* nudge feels like control (e.g., auto-enrolling), the procedure might over-reject. And it can’t solve power imbalances—if your funding forces you to prioritize clinic efficiency over patient goals, that’s a policy fight, not a nudge tweak.  

  Your brother’s Sunday call? Under this: Prevents harm (isolation spiral), override easy (he doesn’t answer), tracks his stable goal ("I want family close"), and transparency ("I call so we stay connected") builds trust. Defensible. The hidden rent payments? Transparency would have killed it ("you thought I couldn’t handle it?"), and it ignored his agency. The checklist flags that.  

  This won’t make every call easy. But when you’re stuck at step three (whose goal?) or step four (transparency backfire), you’ll know you’re not debating facts—you’re choosing between their dignity and your convenience. And for your population, dignity isn’t a luxury. It’s medicine.
