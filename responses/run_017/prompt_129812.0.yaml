  Confirmation is often defined in terms of probability or logical support. In Bayesian terms, confirmation might involve increasing probability.

  But here, the argument seems to be in a logical or qualitative setting.

  The principle in (2) might be related to what's sometimes called "logical equivalence" or something, but it's not that H and H' are equivalent; they only agree on the evidence.

  Specifically, H and H' entail the same propositions about the objects mentioned in E. That means that for those objects, what E says is consistent with both, and they don't add anything different about those objects.

  In the case here, for E_n, which mentions the first n emeralds, both "all emeralds are P" and "all emeralds are C_n" entail that the first n are P, which matches E_n. And for objects not mentioned, they say different things: "all P" says the next one is P, "all C_n" says it's not P.

  But E_n doesn't mention the next emerald, so about the objects mentioned, both hypotheses entail exactly what E_n says, and nothing more or less about them.

  So, according to (2), E_n confirms both hypotheses equally.

  Then, since "all C_n" entails "next is not P" and "all P" entails "next is P", and E_n confirms both hypotheses equally, it might seem that E_n confirms both predictions equally, leading to (3).

  But is that valid? Confirming a hypothesis that entails a prediction might not directly mean confirming the prediction, but in many systems, if H entails S, and E confirms H, then E confirms S, I think. But here it's about comparative confirmation.

  The argument is that since E confirms H and H' equally, and H entails S, H' entails not S, then E confirms S and not S equally.

