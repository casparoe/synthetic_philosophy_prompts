prompt: |-
  hi — I'm doing an hour on imprecise probabilities for a reading group of ML PhD students who are all fluent Bayesians (conjugate priors, calibration, expected utility, the usual). Don't write the session for me, I want the plan for it.

  Order first, and why: I think they can't even see the point of a set of priors until something cracks the identification of "my uncertainty" with "a number", and that the lower-vs-upper distinction (what you'd pay for a bet vs what you'd sell it for) has to be in place before Γ-maximin or maximality will make any sense — but I'm not sure where updating belongs, since conditioning each measure in the set versus conditioning the lower envelope is exactly where I expect them to get lost.

  One example should carry the hour, so tell me what it has to have and what it has to lack. My instinct is an Ellsberg-type urn of unknown composition, except that seems to invite them to slap a flat hyperprior on the composition and declare the problem solved; maybe the uncertainty should come from somewhere adversarial instead.

  Misconceptions I'm expecting: that it's just robust Bayes with wider error bars, that imprecision just means you haven't thought hard enough about your prior, that independence means the set factorizes, and the one where they notice lower(A) + lower(not-A) < 1 and think probability has leaked out somewhere. Where in the sequence do I head each of them off?

  Two more things. One of them will definitely ask whether there isn't still a true probability they're just failing to pin down, and I want the session to earn the no rather than have me assert it. And give me one closing question that would actually tell me they got it rather than memorised definitions, plus what I should openly refuse to cover in an hour (I'm guessing choice functions and sets of desirable gambles).
reasoning: |-
  We are designing an hour-long session on imprecise probabilities for ML PhD students who are fluent in Bayesian methods. The goal is to challenge the idea that uncertainty must always be represented by a single probability measure and to introduce the concepts of sets of priors, lower and upper probabilities, and decision making under ambiguity.

  ### Order and Why

  The sequence should start by cracking the identification of uncertainty with a single number. Then introduce lower and upper probabilities (via betting). Only then move to decision rules (Γ-maximin, maximality). Updating comes later because it's more complex and relies on the prior concepts.

  Proposed Order:

  1. **Motivation: The Failure of Single Probability**  
     - Start with an example that demonstrates a situation where a single prior is inadequate. The example should highlight ambiguity (uncertainty about the probability model itself) and show that it leads to behavior that cannot be captured by a single prior.

  2. **Lower and Upper Probabilities**  
     - Introduce the betting interpretation: lower probability as the maximum buying price and upper probability as the minimum selling price for a gamble. Emphasize that these can be different, and that the gap reflects ambiguity.

  3. **Decision Making with Imprecise Probabilities**  
     - Present Γ-maximin (pessimistic) and maximality (avoiding dominated acts) as two ways to make decisions when you have a set of priors.

  4. **Updating**  
     - Discuss updating sets of priors (conditioning each prior in the set) and note that this may not commute with taking the lower envelope (so the updated lower probability is not necessarily the lower envelope of the updated probabilities). This is advanced, so only touch on it.

  ### The Central Example

  We need an example that:
  - Clearly separates risk (known probabilities) from ambiguity (unknown probabilities).
  - Cannot be resolved by simply putting a hyperprior and integrating (because then we are back to a single prior).
  - Has an adversarial flavor to avoid the hyperprior solution.

  **Proposal: A modified Ellsberg urn with an adversarial twist.**

  - **Setup**: An urn with 100 balls, but the composition is chosen by an adversary. The adversary can choose any number of red balls between 40 and 60 (so 40-60 red, the rest blue). You draw one ball.

  - **Events**: 
    - A: The ball is red.
    - B: The ball is blue.

  - **Why it works**:
    - The adversary chooses the composition after you commit to your betting strategy? No, that might be too complex. Instead, we can say the composition is fixed but unknown, and the uncertainty is not probabilistic but rather set-theoretic: we only know the set of possible compositions and have no distribution over them.
    - The key is that the decision maker does not have a prior over the compositions. If they put a flat hyperprior, they would get a single prior (with P(red)=0.5) and then they would be indifferent between betting on red or blue. But in reality, people are ambiguity-averse: they prefer to bet on an event with known probability (e.g., 50-50) than on an event with unknown probability (even if the expected probability is 0.5). This is the Ellsberg paradox.

  - **Adversarial Twist**: To prevent the hyperprior solution, emphasize that the composition is chosen adversarially to minimize your maximum payoff (if you are playing against an adversary). This makes the set of priors a natural model: we consider the worst case over the set. Without an adversary, we can still use the set to model lack of information.

  ### Addressing Misconceptions

  1. **"It's just robust Bayes with wider error bars"**:  
     - **When**: During the introduction of the set of priors.  
     - **How**: Emphasize that robust Bayes typically uses a single prior but with a sensitivity analysis. Imprecise probability is a fundamental change: we are not just perturbing a single prior but representing a set of possible beliefs. The decision rules (like Γ-maximin) are different.

  2. **"Imprecision just means you haven't thought hard enough about your prior"**:  
     - **When**: After presenting the example.  
     - **How**: Argue that sometimes information is inherently lacking (e.g., in adversarial settings, or when data is scarce and prior knowledge is weak) and that forcing a single prior is arbitrary. The set represents the available information without adding unjustified assumptions.

  3. **"Independence means the set factorizes"**:  
     - **When**: When discussing multiple variables (if time permits) or in the updating section.  
     - **How**: Show a counterexample: two urns with the same adversarial composition. The set of joint priors is not necessarily the product of the marginal sets. This is advanced, so if time is short, skip.

  4. **"Probability leaked out" (because lower(A) + lower(not A) < 1)**:  
     - **When**: When introducing lower and upper probabilities.  
     - **How**: Explain that the gap (1 - [lower(A) + lower(not A)]) = upper(A) - lower(A) is the ambiguity. It reflects the lack of information. The money hasn't leaked; it's that you are not willing to buy both bets at their lower probabilities because of the ambiguity.

  ### The "True Probability" Question

  - **When**: Likely after presenting the example and the lower/upper probabilities.
  - **Response**: 
    - Ask: "Is there a true probability in the urn? Yes, there is a fixed composition. But do we know it? No. And the point is that without knowing the composition, we cannot assign a unique probability. The set captures the possibilities. Moreover, in the adversarial setting, the adversary chooses the composition after seeing your strategy? Not necessarily. We can have two interpretations: 
        1. The composition is fixed but unknown, and we have no information to form a prior over the compositions (so we use a set).
        2. The composition is chosen adversarially from the set to minimize your payoff (then the true probability is not fixed until you commit, but it's still in the set). 
      In either case, we do not have a unique prior to use."
    - **Earn the "no"**: The key is that even if there is a true probability, we don't know it and we don't have a probabilistic belief about it (we only know the set). Therefore, we cannot reduce our uncertainty to a single number. The set is the most faithful representation of our knowledge.

  ### Closing Question to Test Understanding

  Instead of asking for definitions, pose a decision problem:

  **Question**: 
    "Consider two urns:
     - Urn 1: Exactly 50 red and 50 blue balls.
     - Urn 2: 100 balls, but the number of red balls is between 40 and 60 (chosen adversarially or unknown). 
     I offer you two bets:
     - Bet A: You win $100 if red from Urn 1.
     - Bet B: You win $100 if red from Urn 2.
     Which bet would you prefer? Why? And how would a Bayesian (with a flat hyperprior) decide? How would an imprecise probability model capture the preference for Bet A?"

  **What to look for**:
    - They should express that Bet A is preferred because of ambiguity aversion (for Urn 2, the lower probability of red is 0.4, while for Urn 1 it is 0.5).
    - A Bayesian with a flat hyperprior on Urn 2 would assign P(red)=0.5 and be indifferent.
    - The imprecise model: For Urn 2, we have a set of priors (P(red) in [0.4,0.6]), so the lower probability for red is 0.4, hence Bet A is better.

  ### What to Refuse to Cover

  In one hour, we cannot cover:
    - Choice functions and sets of desirable gambles (as you guessed).
    - The full theory of coherence for imprecise probabilities.
    - Technical details of updating (like the marginal extension or natural extension).
    - Advanced decision rules (like E-admissibility).
    - The connection to other uncertainty models (Dempster-Shafer, etc.).

  Focus on the core: sets of priors, lower/upper probabilities, and simple decision rules.

  ### Detailed Plan

  **Minute-by-Minute**:

  1. **Introduction (5 min)**: 
     - State the goal: to question the Bayesian representation of uncertainty when information is scarce or ambiguous.
     - Present the adversarial Ellsberg urn.

  2. **Lower and Upper Probabilities (15 min)**:
     - Define: lower probability as the maximum price you'd pay for a bet that pays 1 if A occurs, and upper probability as the minimum price you'd sell it for.
     - Compute for the urn: 
          - lower(red) = min over priors of P(red) = 0.4
          - upper(red) = max over priors = 0.6
     - Show that lower(red) + lower(blue) = 0.4 + 0.4 = 0.8 < 1, and explain the gap as ambiguity.
     - Address the "leaked probability" misconception.

  3. **Decision Making (15 min)**:
     - Γ-maximin: choose the action that maximizes the minimum expected utility (over the set of priors).
     - Maximality: an action is maximal if no other action dominates it (i.e., no other action has higher expected utility for every prior in the set).
     - In the urn: compare betting on red vs. blue. With Γ-maximin, you might avoid betting at all? Or if forced, you might choose the one with the higher worst-case (which is 0.4 for both, so indifferent? But note: we can also consider not betting). Alternatively, compare betting on Urn 1 vs. Urn 2.

  4. **Updating (10 min)**:
     - If we draw a ball and it's red, how do we update?
     - Conditioning each prior: for a prior with P(red)=p, the updated probability of the next ball being red is (p*99/100) / (p) ? Actually, we are updating the composition. But note: the composition is fixed. So if we see one red, then the number of red balls is at least 1? Actually, we started with between 40 and 60 red. So after drawing one red, the set of possible compositions becomes: 39 to 59 red in the remaining 99 balls? Then the updated lower probability for the next ball being red is 39/99 ≈ 0.394, while the lower envelope of the updated probabilities is min_{p in [40,60]} [ (p-1)/99 ] = 39/99. So it works in this case? But note: sometimes the lower envelope updating is not the same as updating the lower envelope? We can mention that in general they might differ, but in this case they don't.

  5. **Discussion and Closing (15 min)**:
     - Address the "true probability" question.
     - Pose the closing question (about two urns) and discuss.
     - Briefly summarize: imprecise probabilities are useful when we have incomplete information or face adversarial settings, and they explain ambiguity aversion.

  **Note**: The updating part is tricky and might be skipped if time runs out. The main points are the lower/upper probabilities and decision making.

  This plan should fit within an hour and hit the key points while addressing the anticipated misconceptions.
answer: |-
  Here's a structured plan for your hour, designed to challenge Bayesian fluency while building intuition for imprecise probabilities. The sequence addresses your concerns about conceptual dependencies and targets key misconceptions proactively.

  ---

  ### **Order & Rationale** (Total: 60 mins)
  1. **Crack "Uncertainty = Number"** (15 mins)  
     - **Tool**: **Adversarial Ellsberg Urn**  
       *Composition*: Urn with 100 balls. Adversary chooses *any* number of red balls in [0,100] (not a distribution; they pick one value arbitrarily). You draw one ball.  
       *Key bets*:  
       - Bet 1: Win $1 if red (you name buying price)  
       - Bet 2: Win $1 if blue (you name selling price)  
     - **Why first?** Forces recognition that:  
       - No hyperprior helps (adversary exploits any probabilistic commitment).  
       - Buying/selling prices diverge (introduces *behavioral gap* naturally).  
     - **Head off**: "True probability exists" misconception by noting adversary’s choice is deterministic but unknowable—your uncertainty isn’t about randomness but *information scarcity*.

  2. **Lower/Upper Probabilities** (15 mins)  
     - **Define**:  
       - Lower prob ℙ(A) = max price to buy bet on *A* (worst-case focus).  
       - Upper prob ℙ̅(A) = min price to sell bet on *A* (best-case focus).  
     - **Urn math**:  
       - ℙ(red) = 0 (adversary can make red = 0; you won’t pay >$0)  
       - ℙ̅(red) = 1 (adversary can make red = 100; you won’t sell for <$1)  
     - **Highlight**: ℙ(red) + ℙ(blue) = 0 + 0 = 0 < 1. **Kill "probability leak"**: Gap reflects *ambiguity aversion*—not missing mass, but refusal to commit.  
     - **Contrast**: Bayesian would demand ℙ(A) + ℙ(Aᶜ) = 1; here, the gap ℙ̅(A) - ℙ(A) measures ambiguity.

  3. **Γ-Maximin & Maximality** (15 mins)  
     - **Setup**: Choose action from {bet on red, bet on blue, abstain}.  
       - Payoffs: Win $1 if correct, $0 else. Abstain = $0.  
     - **Γ-Maximin**: Maximize worst-case expected utility over priors.  
       - Prior set: All point masses on red ∈ [0,100] → min E[u] = 0 for betting → *abstain*.  
     - **Maximality**: Reject dominated actions.  
       - Betting on red is *dominated by abstaining*? Not universally (if adversary fixes red=100, betting wins). But abstain is *undominated*.  
     - **Why here?** Decision rules now make intuitive sense after lower/upper bets.

  4. **Updating** (10 mins)  
     - **Scenario**: You see 99 red draws. What’s ℙ(next is red)?  
     - **Two approaches**:  
       - Update each prior: If prior had red=N, P(red|data) = (N - 99)/(1) → undefined if N < 99, else 1.  
       - Update lower envelope: ℙ(red|data) = inf over *admissible* priors → 1 (if N≥99).  
     - **Conflict?**: Original ℙ(red) = 0, but after updating, ℙ(red|data) = 1.  
     - **Why late?** Updating requires comfort with sets; show it *doesn’t commute* to avoid rabbit holes.  

  5. **Q&A + Closing** (5 mins)  
     - **Final question to test understanding**:  
       *"In the adversarial urn, why might ℙ(red) = 0 and ℙ̅(red) = 1 not imply I’m willing to sell a bet on red for $0.01? What decision rule captures this?"*  
       → Answer: Selling at $0.01 risks $0.99 loss if red=0; Γ-maximin avoids this. Tests grasp of lower≠behavior.  
     - **Refuse to cover**: Choice functions, desirable gambles, Walley’s coherence.  

  ---

  ### **Example Requirements**
  - **Must have**:  
    - Adversarial uncertainty (blocks hyperpriors by design).  
    - Clear separation of risk (Bayesian) vs. ambiguity (imprecise).  
    - Divergent buying/selling prices.  
  - **Must lack**:  
    - Symmetry (to prevent "just add a prior" fixes).  
    - Observable frequencies (avoids reduction to multinomial uncertainty).  

  ---

  ### **Misconception Defense Plan**
  1. **"Just robust Bayes"**:  
     - **When**: During Γ-maximin (min over priors ≠ sensitivity around one prior).  
     - **Counter**: Robust Bayes assumes a "true" core prior; here, no prior is privileged.  

  2. **"Haven’t thought hard enough"**:  
     - **When**: After adversarial urn setup.  
     - **Counter**: "If the adversary chooses *after* you specify a hyperprior, can you ever be safe?"  

  3. **"Independence factorizes"**:  
     - **When**: Skip unless asked; else, use two adversarial urns.  
     - **Counter**: Show ℙ(red₁ and red₂) ≠ ℙ(red₁)ℙ(red₂) because adversary correlates urns.  

  4. **"Probability leaked"**:  
     - **When**: Explicitly during lower/upper definitions.  
     - **Counter**: "The gap is money you’d *lose* if forced to buy/sell both bets—it’s aversion, not leakage."  

  ---

  ### **Earning "No" to True Probability**
  - **When**: During urn setup (Step 1).  
  - **Tactic**:  
    - Q: "Isn’t there a true probability?" → A: "Yes, but *only after the adversary chooses*. Before that, what’s *your* uncertainty? A number? A set?"  
    - Force distinction: *Epistemic* (your knowledge) vs. *aleatory* (urn’s state). Imprecise prob captures epistemic limits without pretending aleatory uncertainty is known.  

  ---

  ### **Why This Works**
  - **Flow**: Uncertainty (adversary) → Behavior (betting gap) → Theory (lower/upper) → Decisions (Γ-maximin) → Updating (complexity glimpse).  
  - **Sticky example**: Adversarial urn prevents Bayesian escapes.  
  - **Closes strong**: Final question tests if they see lower prob ≠ decision trigger.
