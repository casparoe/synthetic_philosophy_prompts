answer: |-
  Here is the diagnostic decision tree, structured as requested:

  **Composition Decision Tree**  
  *(Answer each question based on concrete case verdicts)*  

  1.  **Must the whole do something *none* of its parts could do alone?**  
      - *Relevant cases: Vortex (parts are water molecules; vortex "does" circulating), Cell (organelles alone can't metabolize), Termite mound (individual insects/fungus can't regulate mound climate)*  
      **Yes** → Go to Q2  
      **No** → Go to Q3  

  2.  **Is physical bonding (contact/fastening) always required?**  
      - *Relevant cases: Stone arch (yes, bonded), Vortex (no, no bonding), Hydrogen atoms (bonded), Sand pile (contact but no fastening), Eiffel Tower + Kidney (no contact)*  
      **Yes** → **Functionalism (+Bonding):**  
      > *Most awkward: Accepts the bonded hydrogen molecule but rejects the vortex and the sand pile as genuine composites.*  
      **No** → **Functional Emergentism:**  
      > *Most awkward: Accepts the vortex and termite mound as genuine composites but rejects the sand pile and bonded hydrogen if no novel function emerges.*  

  3.  **Is being alive *necessary* for composition to occur?**  
      - *Relevant cases: Cat (alive), Cell (alive), Termite mound (arguably alive system), Duplicate cat (not alive), Sand pile (not alive), Stone arch (not alive)*  
      **Yes** → **Organicism:**  
      > *Most awkward: Rejects the stone arch, bonded hydrogen molecule, and sand pile as genuine composites.*  
      **No** → Go to Q4  

  4.  **Can composition ever be a *brute fact* (no qualitative basis)?**  
      - *Relevant cases: Sand pile (vague boundaries), Social club (membership change), Cat losing whisker tip (persistence through part loss), Duplicate cat (intrinsic duplicates)*  
      **Yes** → Go to Q5  
      **No** → **Brutalism Rejected:** Go to Q6  

  5.  **Is composition *unrestricted* when parts are simples?**  
      - *Assumes simples exist; if gunk (no simples) is true, consider whether *any* arbitrary collection forms a whole.*  
      **Yes** → **Unrestricted Composition:**  
      > *Most awkward: Accepts the Eiffel Tower + your left kidney as a single composite object.*  
      **No** → **Moderate Brutalism:**  
      > *Most awkward: Accepts some arbitrary collections (e.g., some sand piles) as composites and rejects others (e.g., barely different pile) without a clear principle.*  

  6.  **Must the composite be *identical* to the sum of its parts?**  
      - *Relevant cases: Cat (is it *just* the atoms?), Duplicate cat (same parts, same cat?), Vortex (is it the water or something else?)*  
      **Yes** → Go to Q7  
      **No** → **Non-Reductive View:**  
      > *Most awkward: Must explain why the cat is something "over and above" its current atoms, distinct from its duplicate.*  

  7.  **Is spatial contact *required*?**  
      - *Relevant cases: Hydrogen atoms (contact), Sand pile (contact), Eiffel Tower + Kidney (no contact), Vortex (contact?)*  
      **Yes** → **Contact Theory:**  
      > *Most awkward: Rejects the social club and the Eiffel Tower + Kidney but accepts the sand pile.*  
      **No** → **Nihilism / Mereological Sums:**  
      > *Most awkward: Rejects all cases (cat, arch, vortex, etc.) as *composite objects*, saying only the parts exist (Nihilism) OR accepts *all* (including Eiffel Tower + Kidney) as mere sums (Mereological Universalism).*  
      *Flag: This question **cannot separate** Nihilism (Never) and Mereological Universalism (Unrestricted). Both answer "No" to contact but differ on whether sums are objects.*  

  **Unoccupied Combinations & Diagnosis:**  
  -   **Q1(Yes) + Q2(Yes) + Q3(Yes):** *Unexplored.* Requires novel function + bonding + life. Logically possible (e.g., only living, bonded, functionally emergent things), but no major position occupies it.  
  -   **Q4(Yes) + Q5(No) + Q6(Yes) + Q7(Yes):** *Incoherent.* Claims composition is brute, not unrestricted even for simples, identical to parts-sum, but requires contact. Why would brute facts respect contact but not unrestrictedness? No coherent motivation.  

  **Note for Mismatched Students:**  
  > If your answers don’t lead to a named leaf, your intuitions likely combine elements from multiple positions or point to an untheorized view. Focus on which cases you firmly accept/reject and where our questions felt inadequate – that reveals your underlying commitments.
