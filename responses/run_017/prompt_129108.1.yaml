prompt: |-
  You are a political philosopher who works on global justice — in particular on the ethics of reparation, on what states owe to non-citizens, and on the bits of development economics that bear on whether transfers ever do any good. I would like you to think carefully rather than reach for a framework you are already fond of: start by brainstorming three or four candidate principles (a reparative one, a benefit-based one, a capacity or beneficence one, and anything else that suggests itself), note in a line or two what each would cost me in verdicts I'd have to give up, and only then commit to the one — or the ordered pair — that you think best survives what follows. Please write your answer in British English.

  The background: I sit on the grants committee of a small foundation and I'm also in a reading group on global poverty, and I've noticed that my gut verdicts on concrete cases are far more settled than my view about what, if anything, rich countries owe poor ones — and I don't think the verdicts are consistent with each other. Here they are. (i) A former colonial power, where the ex-dictator's stolen money is also sitting in its banks: I think that money must be handed back, and that this is restitution rather than aid, but I also think something further is owed on top of it — less than campaigners claim, more than nothing. (ii) A Nordic country with no colonial or other historical connection to a West African recipient: I think it still owes something, and I feel this nearly as strongly as in (i) even though I can't point to anything it did. (iii) A rich country whose health service recruits nurses trained at a poor country's public expense: I think it owes compensation to that country's health system, but I don't think the individual nurse owes anything to anyone, and I don't think we owe anything to the particular patients who died for want of a nurse — which seems odd, since they are the ones who were harmed. (iv) A recipient government that would spend a transfer on a presidential jet: I think the duty survives and has to be routed around the government, and I'm uneasy because routing it around the government weakens that country's own democratic institutions. (v) Compare two recipients, one poor mainly because of its own government's policy choices, one poor mainly because it is landlocked and malarial: I feel we owe less in the first case and more in the second — and yet when I picture the citizens living under the bad government I feel we owe them more, not less. (vi) Debt: I think we must cancel debt run up by a dead dictator, and I don't think we must cancel debt run up by an elected government that wasted it on a white elephant — even though in neither case did the people now paying borrow the money or benefit from it. (vii) Climate: I think rich countries owe a small island state for damage from emissions that were lawful and largely unknowing at the time, and I also think a poor country that is itself now a large emitter has an undiminished claim, which strikes me as inconsistent. (viii) Where the responsible state has since broken up, I think the obligation tracks whoever still holds the benefits — the corporate charters, the pension funds, the central bank reserves — rather than whoever signed the treaties. (ix) Where the recipient's own elite park their money in our banks, I feel less is owed to the country's treasury but not one penny less to its poorest citizens. (x) Where the recipient's elected government declines the transfer outright, I feel the duty does not lapse but that we may not go around them. (xi) Where our own earlier aid made things worse — a dam, or budget cuts pressed on a ministry in the 1990s — I feel we owe more, and I feel this more strongly than anything else on my list.

  So: give me a principle, or a small set of them, stated precisely enough to use at a committee table, with each clause tied to the case that motivates it, verdicts on two or three cases I haven't listed (your choice, but choose ones that would embarrass the principle), and an honest account of which of my verdicts it cannot accommodate and why I should give them up rather than it. Three things I especially want addressed. First, in (i) and (iii) I find myself expressing what is owed to a government or to a health system, and in (ix) to persons — so who is the bearer of the claim, and does the answer change the size of the duty? Second, is the duty discharged in money or in policy? I have a strong feeling that the largest thing we owe in (iii) is visa access and not cash, and that nobody counts it because it never appears on an aid ledger. Third, the case I keep going back and forth on: a country that is now upper-middle income, with a space programme and a billionaire class, whose rural poor are worse off than the average citizen of the poorest countries — do we owe them anything, is it the same kind of thing we owe in (i), and does the existence of that space programme defeat the claim or deepen it?
reasoning: |-
  Alright, the user is a political philosopher specializing in global justice, particularly reparations, obligations to non-citizens, and development economics. They're on a grants committee and part of a reading group on global poverty. Their gut reactions to specific cases feel settled but inconsistent, and they want a principle or set of principles to guide decisions. The principles should be precise enough for committee use, with each part tied to a case, and include verdicts on new cases that might challenge the principle. They also have three specific areas to address: who the claim-bearer is, whether duties are discharged in money or policy, and how to handle a country with a space program but significant rural poverty.

  First, I need to unpack each of their eleven cases to identify underlying values. For instance, in (i) and (vi), there's a focus on restitution for historical wrongs, like returning stolen assets or canceling dictator debt. Yet in (ii), they feel obligations even without historical ties, suggesting a capacity-based duty. Case (iii) involves compensating for systemic harm (nurse recruitment) without holding individuals liable, which points to institutional responsibility. The tension in (v) between blaming governments versus structural factors is tricky—feeling more obligation for landlocked countries but also sympathy for citizens under bad governance. Climate justice in (vii) raises issues of retrospective responsibility versus current needs. 

  The user's unease about routing aid around corrupt governments (iv) versus respecting democratic institutions (x) indicates a need for conditional sovereignty—duties persist but delivery mustn't undermine local governance. Cases (ix) and (xi) highlight that obligations are to the poorest individuals, not elites or governments, especially when past harms were caused. The mention of policy changes over money in (iii) (visas vs. cash) suggests duties can be non-monetary.

  Key themes emerging: **correcting harm** (reparative), **capacity to assist** (beneficence), and **systemic fairness** (benefit-sharing). But each has flaws. Harm-correcting struggles with non-culpable actors (ii). Benefit-sharing is vague on what counts as "benefit" (Nordic country). Pure capacity ignores historical debts (i). 

  The proposed hybrid principle combines harm-correction for direct/beneficial harms and capacity-based duties for systemic inequities. This handles (i) via benefit restitution, (ii) via capacity, (iii) via systemic harm compensation. Claim-bearers are primarily states/systems for harm-correction (enabling collective repair) but shift to individuals when institutions fail (ix). Discharge can be policy (visas) or money, whichever better targets the needy. 

  For the space-program country, the principle would focus aid on the rural poor via non-state channels (since capacity exists but isn't used) but not historical reparations unless linked to past harm. New test cases: a resource-cursed country (obligation via benefit-sharing from exploitation) and sanctions harm (obligation via harm-correction). 

  Sacrifices required: letting go of debt cancellation for elected governments' waste (vi) unless harm is proven, and accepting that poor emitters' climate claims (vii) are valid only if they remain needy. The user might resist these, but consistency demands it—historical obligations demand benefit-tracking, not perpetual blame. The framework prioritizes current need and harm repair over historical guilt alone. 

  Finally, emphasizing that policy-based duties (visas, tech transfer) are crucial but undercounted. This addresses their instinct that obligations aren't just financial. The hybrid model balances their intuitions while tidying inconsistencies, leaning on harm where possible and capacity where necessary.
answer: |-
  ### Candidate Principles & Their Costs
  1. **Reparative Justice Principle**: "States must compensate for harms they directly caused or unjustly benefited from, with obligations inhering in the current bearers of those benefits."  
     *Cost*: Requires abandoning your intuition that non-colonial states owe duties nearly as strongly (ii), as it denies obligations without causal responsibility.

  2. **Benefit-Sharing Principle**: "Affluent states must transfer a portion of gains derived from unfair global systems (trade, finance, carbon budget) to those disadvantaged by those systems."  
     *Cost*: Struggles with (vi) – why cancel dictator debt if no *ongoing* benefit is extracted? Also risks underplaying historical harms (i).

  3. **Capacity-Based Beneficence**: "States with resources owe duties to alleviate severe suffering where feasible, prioritising the worst-off, regardless of causation."  
     *Cost*: Conflicts with (iii) – why compensate *specific* health systems if duties are general? Undermines restitution in (i) by reducing it to charity.

  4. **Structural Equity Principle**: "Obligations arise from upholding institutions that perpetuate avoidable deprivation. Duty-bearers are those sustaining the system; claim-bearers are those denied basic agency by it."  
     *Cost*: May overreach in (x) – if declining aid reflects agency, why persist? Also struggles with (v) – bad policy choices might be seen as eroded agency.

  ---

  ### Adopted Principles: A Hybrid Framework  
  I propose an **ordered pair**, prioritising:  
  **A. Harm-Correction Principle**: *"States must repair harms they directly inflicted or unjustly profited from, targeting those harmed or their successors. Obligation tracks benefit-holders, not legal continuity."*  
  **B. Systemic Equity Principle**: *"All affluent states must share resources/power to rectify systemic inequities that deny basic functioning to individuals, routed to secure their agency. Duty scales with capacity and systemic advantage."*  

  **Order**: **A** overrides **B** where applicable (e.g., colonial theft), but **B** applies universally.

  ---

  ### Application to Your Cases  
  - **(i)**: **A** demands return of stolen assets + compensation for extractive harms. Top-up justified by lingering benefit (e.g., infrastructure built by forced labour).  
  - **(ii)**: **B** applies – obligation via participation in unfair trade/finance systems, though weaker than **A**.  
  - **(iii)**: **A** for *state* obligation (benefiting from poached training investment). **B** explains why *nurses* owe nothing (no culpable harm) and why dead patients aren’t claim-bearers (duty is systemic, not tort-like).  
  - **(iv) & (ix)**: **B** routes aid *around* corrupt governments but *to* the poor (claim-bearers are individuals). Undermining institutions is mitigated by empowering local NGOs/conditional cash transfers.  
  - **(v)**: **B** reduces obligation for self-harmed states (less systemic disadvantage) *but* **A** may apply if rich states propped up the bad regime. Your sympathy reflects **B**’s focus on individuals.  
  - **(vi)**: **A** cancels dictator debt (unjust benefit/harm). Elected government debt stands unless induced by creditor malfeasance (**A**).  
  - **(vii)**: **A** for historical emissions (unjust benefit/harm). **B** maintains poor emitters' claims (systemic disadvantage outweighs contributory fault).  
  - **(viii)**: **A** confirmed – obligation follows benefit-holders.  
  - **(x)**: **B** lapses if refusal reflects genuine democratic will. Duty shifts to global systemic reform.  
  - **(xi)**: **A** clearly applies – direct harm causation.  

  ---

  ### Addressing Your Queries  
  1. **Claim-Bearers**:  
     - **A** assigns claims to *collectives* (states/health systems) when harm was institutional. Size depends on harm/benefit quantum.  
     - **B** assigns claims to *individuals* suffering systemic deprivation. Size depends on gap in basic functioning.  
     *Why?* Collective harm requires collective repair (i). But elites in (ix) invalidate state claims; only individuals remain claimants.  

  2. **Discharge Form**:  
     - **A** often requires money (restitution of calculable assets).  
     - **B** favours policy where it better targets agency (e.g., **iii**’s nurse visas rectify systemic harm more than cash). Policy actions (e.g., trade reform) count as discharge but are often unquantified.  

  3. **Upper-Middle Income Country (e.g., India)**:  
     - **A**: Only owed if specific harm (e.g., colonial extraction). A space programme funded domestically doesn’t negate this.  
     - **B**: Rural poor remain claimants *if* deprived of basic functioning *due to systemic inequity* (e.g., trade rules). But national capacity (billionaires/space budget) reduces *external* obligation – **B** demands domestic elite taxation first.  
     *Verdict*: Owed rectification of historical harms (**A**), but minimal **B** transfers (e.g., tech-sharing for poverty alleviation).  

  ---

  ### Test Cases to Strain the Principles  
  1. **"Resource-Cursed" State**:  
     - *Scenario*: A poor, oil-rich state impoverished by a corrupt regime. Global firms extracted oil cheaply under dictator (1990s). Now democratic but still poor.  
     - **Verdict**: **A** compels firms/states that profited to compensate. **B** demands aid but reduced due to resource potential.  
     - *Embarrassment*: If corruption persists, **B**’s agency focus may demand conditional aid, conflicting with (iv).  

  2. **Sanctions Harm**:  
     - *Scenario*: Broad sanctions by Richland on Midland (for valid reasons) inadvertently caused a health crisis. Sanctions lifted; Midland remains poor.  
     - **Verdict**: **A** imposes compensatory duty on Richland. **B** demands ongoing aid.  
     - *Embarrassment*: Overlaps with (vii) – unintentional harm creates costly duties.  

  ---

  ### Sacrifices Required & Why  
  1. **Debt for Elected Governments (vi)**: You must abandon refusal to cancel debt from wasted loans. If creditors *knew* funds would be misused (**A**), they share culpability. **B** also urges cancellation if debt impedes basic functioning.  
     *Why?* Consistency with (iii) and (xi) – benefiting from or enabling harm triggers duties.  

  2. **Poor Large Emitters (vii)**: You must accept their claim *is* diminished if their emissions worsen deprivation elsewhere. **B** reduces obligations to states actively harming others.  
     *Why?* Systemic equity requires shared responsibility. Your intuition likely conflates *current* need (still strong) with *historical* blame.  

  3. **Refused Aid (x)**: If refusal is truly democratic, **B** says duties lapse. To insist overrides local agency – contradicting (iv) and (ix).  

  **Strengths of the Framework**: Resolves your colonial/non-colonial tension (i/ii), distinguishes system/individual liability (iii), and handles benefit-tracking (viii). It treats aid as one tool among many, valuing policy shifts (visas) equally. By prioritising harm-correction, it honours your strong intuitions on (i) and (xi) while using systemic equity to cover broader obligations.  

  Would this survive your committee table? It demands hard choices – but so does justice.
