  Verbal vs. genuine: Is "trait" the issue? Yes, partly. But the deeper conflict is about mechanism (situations vs. agency) and normativity. 

  The three cruxes: 
  1. Pre-registered study on residual variance. Neo-Aristotelian predicts predictive power; situationist doesn't. 
