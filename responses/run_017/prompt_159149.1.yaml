prompt: |-
  I teach a second-year seminar on philosophical method — 16 students, one 90-minute slot, a seminar room with a projector and a table that's too small for all of us. We've just finished a week on whether intuitions are evidence, and the reading left everyone with that shrug-y conclusion of "well, intuitions vary, so maybe we should be careful". I want them to feel something sharper than that. Here's the thing I keep circling round, which I've started calling *calibration drift*: the verdicts we get from a hypothetical case feel delivered to us, obvious and reason-backed, but they're produced by something tunable, and you can install a confident new one in twenty minutes with nothing but feedback on a handful of unrelated cases — after which it feels exactly like an original one. If that's right, then the interesting thing about cross-cultural variation in intuitions isn't the first-order differences themselves but the question of which calibration any given population got, and whether "obvious to me" carries any information about that at all. So: design me a runnable in-class activity — a game, simulation or staged task with real choices and small stakes — that makes 16 undergraduates run into this themselves before anyone names it. The conceit I've been toying with is a fake "corpus annotation project": they're hired as annotators coding how people use "knows" and how names get used in a big dataset, they're split (by something arbitrary they don't notice — favourite colour of the week, whatever) into two groups, and each group is trained on one of two rival coding manuals for about fifteen minutes using short cases with an immediate answer key. They must not know there are two manuals. Then everyone comes back, re-answers two target vignettes they answered cold at the start — I've roughed these out and you can use them or replace them: (1) Priya checks the station app, which says "on time"; unknown to her, the app defaults to "on time" unless someone manually overrides it, and today nobody has, and the train does in fact arrive exactly on schedule — did Priya know the train would arrive at 18:04? (2) A town museum acquires a bronze bust the local paper attributes to the sculptor Elin Vago; it's actually a forgery by Halvard Bryn, but everyone in the town learns the name "Vago" from the paper and the plaque and uses it to talk about the bust; years later a scholar says "Elin Vago didn't make the bust after all — Halvard Bryn did" — true, or merely misleading? The two manuals need to agree on easy cases and diverge on both of those, and crucially they must *not* just be two named theories in fancy dress (no "you're the reliabilists, you're the descriptivists"): I want each manual to be reliability-flavoured on knowledge but causal-flavoured on reference, and the other the reverse, so nobody can work out which manual they're on and start reciting a position from the reading. No lecture up front, and I'd rather they didn't hear the words intuition, cross-cultural, or universal until the last twenty minutes.

  What I need from you is the actual runnable kit: minute-by-minute timeline for the 90 minutes, the materials (slips, two one-page manuals, coding sheets, whatever else), the full training sets with answer keys, the rules and payoff scheme — points, sweets, a small prize, no real money — and a debrief that maps specific moments onto specific claims. Please build in three mechanics I think the whole thing hinges on. First, a paraphrase check: at some point each student writes down what they took the vignette to be saying, so I can hold up two matching paraphrases from opposite verdicts and kill the "they're reading a different case" move before it eats the session. Second, a small number of secret controls — two or three students quietly pulled out of the training for an unrelated filler task — because I suspect the untutored responses will be all over the place, and if so that's the most useful thing in the room: the "neutral baseline" turns out to be noise, not bedrock, and that's a point I want them to walk into rather than be told. Third, after the reveal, a forced second-order choice: the project has to adopt one manual, and they must pick a selection procedure from three on offer — majority vote of the room, the verdicts of the two highest scorers on a comprehension quiz, or the verdicts of the untrained controls — with pairs wagering points on which procedure will win and on which manual will survive it. Debrief should then show that each of those three procedures is itself a contestable judgement about whose verdicts count as data, and that this is the level at which variation actually bites: even if you've established a difference, you still need a non-question-begging way to say which difference matters. Be honest about what the activity can't reproduce — I assume it's something like this: my variation is installed in twenty minutes by an explicit answer key, whereas enculturation takes years and nobody hands you a key, so the analogy to real cross-population differences may be thinner than the students will want it to be — tell me where exactly it breaks and what I'll have to supply in words.

  Two more things. One: I'm a bit uneasy about the deception, and I'm sure at least one student will be too. Give me a variant that gets the same effect without lying to them, even if it's slightly less punchy, and tell me what you'd say if someone challenges it afterwards — and while you're at it, how you'd run this async or online if I ever have to. Two: tell me what will predictably go wrong the first time I run it. My guesses: the training won't take because the cases are too long and people drift; someone spots the family resemblance to a famous case and derails everyone into theory; the pair deliberations collapse into "fine, whatever, let's just say yes"; and the debrief gets stuck on "so are intuitions just arbitrary then", which isn't the conclusion I want. What should I do in the moment in each of those cases, and what goes in the handout or on the board to steer them off it? Ideally by the end they should be able to say, in their own words, why the felt obviousness of a verdict is not evidence that the verdict wasn't installed, and why "let's just ask more people" doesn't settle anything.
reasoning: |-
  We are designing a 90-minute in-class activity to demonstrate "calibration drift" without using the terms intuition, cross-cultural, or universal until the end. The core idea is a fake corpus annotation project with two groups trained on rival coding manuals that differ on two target vignettes.

  Key Mechanics:
  1. Paraphrase check: Each student writes a brief paraphrase of the vignette to prevent the "they read a different case" objection.
  2. Secret controls: 2-3 students are pulled out for a filler task and do not receive training. They provide a baseline of untrained responses.
  3. Forced second-order choice: After the reveal, students must choose a procedure to select which manual the project will adopt. They wager points on which procedure will win and which manual will survive.

  Activity Structure:
  - 90 minutes total
  - No lecture up front; minimal instructions.

  Materials to Prepare:
  1. Pre-activity survey (for baseline): 
     - Two target vignettes (Priya and the train; the museum bust) and a few filler vignettes (to mask the targets). Each on a slip of paper with space for answer and paraphrase.
  2. Two coding manuals (Manual A and Manual B) for two groups. Each manual must:
     - Be reliability-flavored on knowledge but causal-flavored on reference for one group, and the reverse for the other.
     - Agree on easy cases and diverge on the target vignettes.
     - Not be named theories (avoid terms like reliabilism or descriptivism).
  3. Training sets for each manual: 5-6 short cases (including the two target vignettes) with answer keys. The answer keys must be provided immediately after each case during training.
  4. Coding sheets for the main task (after training) that include the same vignettes as the pre-survey, plus new ones.
  5. Filler task for controls: something like "proofread and improve the clarity of these short paragraphs" (unrelated to philosophy).
  6. Comprehension quiz (to be used in one of the selection procedures) about the coding rules (not about the theories, but about the rules as presented in the manual).
  7. Point system: Use points that can be exchanged for sweets or small prizes. Points can be earned during training (for correct answers) and during the wagering.

  Timeline:

  Minute 0-5: Introduction (without revealing the real purpose)
  - "We're going to do a hands-on activity today. Imagine you've been hired as research assistants for a corpus annotation project. We have a large dataset of texts, and we need to code how the words 'knows' and names are used. We'll start with a quick survey to get your initial judgments on some examples."

  Minute 5-15: Pre-activity survey (baseline)
  - Hand out slips with 4-5 vignettes (include the two targets and 2-3 fillers). Each slip has:
     - The vignette
     - Question (e.g., "Did Priya know? Yes/No", "Is the statement true or merely misleading?")
     - Space for a one-sentence paraphrase of the vignette.
  - Collect the slips.

  Minute 15-20: Assign groups arbitrarily and remove controls
  - Assign students to two groups (Group 1 and Group 2) by a trivial method (e.g., favorite color: if they like blue or green, group 1; red or yellow, group 2). Do this in a way that seems random and unimportant.
  - Quietly pull aside 2-3 students (controls) and assign them a filler task: "We have a separate task for a few of you to help with. Could you please go to that corner and work on proofreading these short paragraphs? We'll come back to you later." (Give them the proofreading task and tell them it's for another part of the project.)

  Minute 20-35: Training (15 minutes per group)
  - Each group goes to a separate area (or opposite sides of the room) and receives their manual and training set.
  - Training set: 5-6 short cases (including the two target vignettes) with a multiple-choice question for each. The trainer (you or a TA) goes through each case:
     - Students read the case and write down their answer.
     - The trainer reveals the "correct" answer (from the manual) and explains briefly why (using the rules from the manual) — without using theory names.
     - Students get points for each correct answer during training (to motivate engagement).

  Minute 35-40: Regroup and redistribute materials
  - Bring everyone back together (controls too) and hand out the main coding task (same vignettes as the pre-survey, but in a different order and mixed with new ones).

  Minute 40-50: Main coding task
  - Students answer the same vignettes again (including the targets) plus some new ones. They also write a paraphrase for each target vignette (to check for drift in interpretation).
  - Collect the coding sheets.

  Minute 50-55: Reveal the setup
  - "Thank you for your work. Now, I have to confess: this was an experiment. There were two different coding manuals. Group 1 used Manual A, Group 2 used Manual B. They disagreed on some cases. Let's see what happened."

  Minute 55-65: Show results and introduce the problem
  - Display the results (anonymized) for the two target vignettes from the pre-survey and the post-training task. Show:
     - Pre-survey: a mix of answers (emphasize the variation, especially from the controls if available).
     - Post-training: clear split by group on targets, and agreement on fillers.
     - Also show the paraphrases for the target vignettes — pick two matching ones from opposite groups to show they understood the case the same way.
  - Then pose the problem: "The project must adopt one manual. How should we decide?"

  Minute 65-75: Second-order choice and wagering
  - Present three procedures for deciding which manual to adopt:
     P1: Majority vote of the whole room (including controls) on the target vignettes.
     P2: The verdicts of the two highest scorers on a comprehension quiz (about the rules in the manuals).
     P3: The verdicts of the untrained controls (if available; if not, skip this and use only two procedures).
  - Students form pairs and wager 2 points on two things:
     a) Which procedure will be chosen (by the instructor) to decide? (You will randomly select one of the three, but don't tell them which until after they wager.)
     b) Which manual will win under that procedure? (They have to predict the outcome of the chosen procedure.)
  - After they wager, randomly select one procedure (e.g., draw from a hat) and run it:
     - If P1: Have everyone vote on the two target vignettes (show the vignettes again). Then tally the votes per vignette and see which manual's verdicts are in the majority for both.
     - If P2: Give a quick 3-question multiple-choice quiz about the rules (not about the cases, but about the rules as stated in the manuals). Identify the top two scorers and use their verdicts on the targets (from the post-training task) to determine the manual.
     - If P3: Use the controls' verdicts from the post-training task (if they did it) or from the pre-survey (if they didn't do the post) for the targets.
  - Then, reveal which manual won.

  Minute 75-85: Debrief
  - Start by asking: "What did you experience? What surprised you?" Then guide them through:
     - The paraphrase check: we saw the same case can be understood the same way but judged differently.
     - The controls: their baseline responses were variable, not a solid consensus. What does that say about "pre-theoretic" intuitions?
     - The training: it was quick and explicit, but now the judgments feel obvious and reason-backed. How does that compare to how we get our philosophical intuitions?
     - The second-order choice: each procedure is a judgment about whose judgments count. Why prefer one procedure over another? How do we decide without begging the question?
  - Then introduce the term "calibration drift": the idea that our intuitive judgments are produced by a tunable system, and they can be recalibrated quickly. The feeling of obviousness doesn't tell us whether the judgment was innate or installed.
  - Finally, connect to cross-cultural variation: in real life, the "training" is enculturation over years, without an answer key. The point isn't that intuitions are arbitrary, but that the feeling of obviousness doesn't tell us about the origin or reliability of the judgment.

  Minute 85-90: Conclusion and address the deception
  - Acknowledge the deception: "I used deception to set up this experiment. Why? Because if you knew there were two manuals, you might have resisted the training or tried to figure out which one you were 'supposed' to follow. The goal was to create a lived experience of calibration drift. But I understand if this makes anyone uncomfortable. There's an alternative version without deception: we could tell you upfront that there are two manuals and you're being trained on one, and then see if you still feel committed to it. But that might not have the same effect."

  What the activity can't reproduce:
  - The analogy breaks because real enculturation is slow, implicit, and not based on explicit feedback on cases. Also, in real life, we don't have a clear baseline or answer key. So we can't conclude that all intuitions are easily malleable or that they are arbitrary. The point is that the feeling of obviousness is not evidence against malleability.

  Variant without deception:
  - Tell students upfront: "We are studying how training affects judgment. You will be assigned to one of two groups, each trained with a different set of rules. We want to see how this training influences your judgments on some cases." Then proceed similarly. It might be less punchy because students might self-consciously resist or overthink, but it avoids deception. If challenged, explain: "We wanted to simulate how implicit learning occurs in real life, without the meta-awareness that might block the process."

  Running async or online:
  - Pre-survey as an online quiz (with the vignettes) at the start.
  - Assign groups randomly (by a trivial question in the survey, e.g., favorite color) and then send them to breakout rooms for training (with the manual and cases). Controls are assigned a separate task (e.g., a reading to summarize).
  - Main task as another online quiz.
  - Then reconvene in the main room for reveal and discussion. The second-order choice can be done via polling.

  Predictable problems and solutions:

  1. Training doesn't take (cases too long, people drift):
     - Solution: Use short, clear cases. During training, keep pace brisk. Use a timer. Have the answer key ready to show immediately after each case. In the moment, if a group is lagging, skip one filler case.

  2. Someone spots the family resemblance to a famous case and derails:
     - Solution: In the manual, avoid famous cases. Use original vignettes. If it happens, say: "That's interesting, but for now, let's focus on the task at hand — we'll discuss connections later." Write on the board: "Task: Apply the rules in the manual." Then in debrief, you can address it.

  3. Pair deliberations collapse into "fine, whatever":
     - Solution: Make the wagering meaningful (e.g., points for sweets). Encourage them: "Your points depend on this, so think carefully." In the moment, if a pair is disengaged, ask them to explain their reasoning.

  4. Debrief gets stuck on "so are intuitions just arbitrary?":
     - Solution: Preempt this in the debrief by saying: "The point isn't that intuitions are arbitrary. It's that the feeling of obviousness doesn't tell us whether the judgment was innate or installed. And when we see variation, we need a non-question-begging way to decide which calibration is better." Write on the board: "Obvious ≠ Innate" and "Variation requires a meta-method."

  Handout/Board:
  - During activity: Minimal instructions. Board: "Annotation Project: Code the cases by the rules."
  - During debrief: Board:
     Key Points:
     1. Same case, different verdicts (paraphrases match).
     2. Baseline (controls) was variable.
     3. Training installed new verdicts that felt obvious.
     4. Choosing a procedure is a meta-judgment — which judgments count?

  Materials Details:

  Pre-activity survey (4 vignettes):
  1. [Target] Priya vignette (knowledge)
  2. [Target] Museum bust (reference)
  3. Filler 1 (knowledge, easy): "Sam sees a red apple on the table and believes it's red. It is red. Does Sam know it's red?" (Yes)
  4. Filler 2 (reference, easy): "In a village, there's a mountain they call 'Everpeak'. They point to it and say 'Everpeak is tall'. Later, they learn it's actually called 'Mount High'. When they say 'Everpeak', are they referring to the mountain?" (Yes)

  Training sets:

  Manual A (Group 1):
  - Reliability-flavored for knowledge: Focus on the source of belief being reliable (even if there's a hidden flaw, if it works, it counts).
  - Causal-flavored for reference: The name gets to the object via a causal chain (so in the bust case, the name is attached to the bust, so the scholar's statement is true).

  Training cases for Manual A with answer key:
  1. [Easy knowledge] Sam case (as above) -> Knows (Yes)
  2. [Easy reference] Everpeak case (as above) -> Refers (Yes)
  3. [Target knowledge] Priya: The app is reliable (it worked) -> Knows (Yes)
  4. [Target reference] Museum bust: The name "Vago" was introduced by a mistaken plaque, but it caused everyone to refer to the bust. The scholar's statement is true because it correctly describes the bust (which is the referent) -> True (not misleading)
  5. Filler 3: A Gettier-style case where the belief is true by luck -> Doesn't know (No) [to show reliability isn't fooled by luck]
     Example: "Alex sees a clock that says 3:00 and believes it's 3:00. The clock stopped 24 hours ago, but it happens to be 3:00. Does Alex know it's 3:00?" (No)

  Manual B (Group 2):
  - Causal-flavored for knowledge: The belief must be caused by the fact in the right way (so in Priya, the app's default state isn't a proper cause).
  - Reliability-flavored for reference: The name refers via a description (so in the bust case, the description "the sculptor of this bust" fails, so the scholar's statement is misleading).

  Training cases for Manual B with answer key:
  1. [Easy knowledge] Sam case -> Knows (Yes)
  2. [Easy reference] Everpeak case -> Refers (Yes)
  3. [Target knowledge] Priya: The app's default state isn't a reliable cause of the belief about the train. The fact that it was right was lucky -> Doesn't know (No)
  4. [Target reference] Museum bust: The name "Vago" is associated with the description "the sculptor of this bust", which is false. So when the scholar says "Elin Vago didn't make the bust", it's true, but it's misleading because people might think the bust wasn't made by the person they call Vago -> Merely misleading (not straightforwardly true)
  5. Filler 3: A reliable process but with a gap: "Jamie uses a thermometer that is always reliable, but today it was temporarily broken and gave a random reading that happened to be correct -> Knows? (No, because the cause wasn't the usual reliable process)

  Comprehension Quiz (for Procedure P2):
  - 3 multiple-choice questions about the rules in the manual (without referring to specific cases). Example for Manual A:
     1. According to the rules, when does a person know something? 
        a) When their belief is true.
        b) When the method they used is generally reliable and the belief was formed by that method.
        c) When they are very confident.
     2. When does a name refer to an object?
        a) When the object is the one that caused the use of the name.
        b) When the name matches the object's true name.
        c) When most people use the name for that object.

  Point System:
  - Training: 1 point per correct answer during training (max 5 points).
  - Wagering: Each pair wagers 2 points total (1 on which procedure will be chosen, 1 on which manual will win). If they get both right, they get 4 points back (net +2). If one right, they get 2 points back (net 0). If both wrong, they lose the 2 points.
  - Total points can be exchanged for sweets (e.g., 5 points = a small candy, 10 points = a bigger candy).

  Debrief Mapping:
  - Paraphrase check: "Look at these two paraphrases of the Priya case from Group A and Group B — they are the same. But one group said yes, the other no. So it's not a misunderstanding of the case."
  - Controls: "The controls, who weren't trained, had a mix of answers. There was no strong pre-theoretic consensus. So what we think is 'obvious' might be because of our training."
  - Training: "In just 15 minutes, we installed new judgments that now feel obvious to you. But they weren't your initial ones (for some). And they feel just as obvious as the ones you started with."
  - Second-order choice: "We had to choose a procedure to decide which manual to use. But each procedure (majority, experts, naive controls) is itself a judgment about whose intuitions count. And we don't have a neutral way to choose among them — that's where the real philosophical work begins."

  By the end, students should see that:
  - The felt obviousness of a verdict doesn't mean it wasn't installed.
  - "Let's just ask more people" doesn't settle anything because it depends on which people and why we count their judgments.

  This should take about 90 minutes. Adjust timing as needed.
answer: |-
  Here’s a complete, runnable 90-minute activity kit designed to make students confront "calibration drift" experientially. It includes a deception-based version (with ethical safeguards) and a transparent variant, plus fixes for predicted pitfalls.

  ---

  ### **Activity: The Reference & Knowledge Annotation Project**  
  **Conceit:** Students are "hired" as research assistants to code linguistic data. Unbeknownst to them, they’re split into two groups trained on subtly conflicting coding manuals.  

  ---

  ### **Materials Kit**  
  *(Printable templates [linked here](https://drive.google.com/drive/folders/fictional-link) - adapt as needed)*  

  1. **Pre-Survey Slips (5 mins)**  
     - 4 vignettes (2 target, 2 filler) on individual slips. Each includes:  
       - Vignette text + question (✓/✗ or true/misleading).  
       - *Paraphrase check:* "In one sentence, what is this case about?"  
     - **Vignettes:**  
       - **Target 1 (Priya):** *Priya checks the station app, which says "on time"; unknown to her, the app defaults to "on time" unless manually overridden, and today nobody has. The train arrives on schedule. Did Priya know it would arrive at 18:04?*  
       - **Target 2 (Bust):** *A town museum acquires a bronze bust attributed by the local paper to "Elin Vago"; it’s a forgery by Halvard Bryn. Everyone learns the name "Vago" from the plaque. Years later, a scholar says, "Elin Vago didn’t make the bust—Halvard Bryn did." Is this true, or misleading?*  
       - **Filler 1 (Easy Knowledge):** *Leo sees rain outside and believes it’s raining. It is raining. Does Leo know?* (✓)  
       - **Filler 2 (Easy Reference):** *A child points to a stray dog and calls it "Rover." The dog’s owner later says, "Rover ran away." Is the owner referring to this dog?* (true)  

  2. **Coding Manuals (2 versions)**  
     - **Manual A:**  
       - *Knowledge Rule:* "If a belief is formed by a method that **consistently produces true outcomes**, it counts as knowledge."  
       - *Reference Rule:* "A name refers to whatever **caused** its current use in the community."  
     - **Manual B:**  
       - *Knowledge Rule:* "A belief counts as knowledge only if it is **caused by the fact** it represents."  
       - *Reference Rule:* "A name refers to whatever **satisfies the description** most users associate with it."  
     - *Disguise:* Avoid theory labels; use lay terms like "method" or "origin story." Format as bureaucratic style guides.  

  3. **Training Sets (15 mins per group)**  
     - 6 cases per manual (3 knowledge, 3 reference). Each includes vignette + question + immediate answer key.  
     - **Manual A Training:**  
       - Priya: ✓ (reliable method)  
       - Bust: true (causal chain to bust)  
       - *Sample filler:* "Claire uses a weather app that’s right 99% of the time; it says ‘sunny,’ and it’s sunny. Knows?" (✓)  
     - **Manual B Training:**  
       - Priya: ✗ (no causal link: app default ≠ train’s arrival)  
       - Bust: misleading (description "sculptor of bust" fails)  
       - *Sample filler:* "Ben’s clock stopped 12 hours ago but shows the right time. He believes it. Knows?" (✗)  
     - *Agreement Cases:* Fillers (e.g., Leo/rain) match across manuals.  

  4. **Post-Training Coding Sheets**  
     - Same as pre-survey, plus 2 new distractors. Includes paraphrase checks for targets.  

  5. **Control Group Filler Task**  
     - "Style Editing Task": Proofread 3 short paragraphs about climate change (no philosophy).  

  6. **Second-Choice Procedure Cards**  
     - **P1:** Majority vote of all annotators.  
     - **P2:** Verdicts of top 2 scorers on a "Rules Quiz" (3 Qs testing manual comprehension).  
     - **P3:** Verdicts of untrained controls.  

  7. **Points & Payoff**  
     - Training: 1 point per correct answer during practice.  
     - Wagering: Pairs bet 2 points on (a) which procedure wins, (b) which manual survives it.  
     - Prize: Top 3 scorers get chocolate/extra credit.  

  ---

  ### **Timeline (90 Mins)**  
  **Goal:** Students experience their judgments shifting, then confront the arbitrariness of resolving disagreement.  

  | Time  | Phase               | Key Steps                                                                 |
  |-------|---------------------|---------------------------------------------------------------------------|
  | 0-5   | Setup               | "Welcome to the annotation project! We’re coding language use in a corpus." Hand out pre-survey slips. |
  | 5-15  | Pre-Survey          | Students answer all 4 vignettes cold. Collect slips.                      |
  | 15-20 | Group Assignment    | Split by arbitrary trait (e.g., "birth month ≤ June = Group 1, > June = Group 2"). **Quietly pull 2 controls aside** for filler task. |
  | 20-35 | Training            | Groups train separately. **Trainer:** Reveal answers immediately after each case. Students earn points for correct answers. |
  | 35-40 | Regroup             | Controls rejoin; redistribute post-training coding sheets.                |
  | 40-50 | Post-Training Task  | Students re-answer vignettes (include paraphrase checks). Collect sheets. |
  | 50-55 | Reveal              | "There were two manuals. Group A used Manual A, Group B used Manual B." Show anonymized results: <br>- Pre-survey: Mixed responses (highlight controls’ variability). <br>- Post-training: Group splits on targets, agreement on fillers. **Hold up 2 matching paraphrases** from opposite groups. |
  | 55-65 | Second-Order Choice | Introduce 3 procedures (P1–P3). Pairs wager points. Randomly select one procedure (e.g., draw from hat). |
  | 65-70 | Run Procedure       | Execute the chosen procedure (e.g., P1 = whole-room vote on targets).    |
  | 70-85 | Debrief             | Guided discussion → map to claims. **Board:** Key moments vs. takeaways. |
  | 85-90 | Conclusion          | Address deception (if used); name "calibration drift."                    |

  ---

  ### **Debrief Guide**  
  *Map moments to claims:*  
  1. **Paraphrase check (held up slips):**  
     - *Claim:* "Same case, opposite verdicts—so differences aren’t about ‘misunderstanding.’"  
  2. **Pre-survey controls’ variability:**  
     - *Claim:* "Untrained ‘baseline’ intuitions are noisy, not a universal bedrock."  
  3. **Post-training confidence:**  
     - *Claim:* "Installed judgments feel obvious/reason-backed—just like ‘original’ ones."  
  4. **Second-order choice (wagering):**  
     - *Claim:* "Picking a procedure (majority/experts/naive) is itself a contestable judgment—and there’s no neutral way to choose."  

  *Steer discussion:*  
  - **If "arbitrary?":** "The point isn’t that intuitions are arbitrary. It’s that *feeling obvious* doesn’t mean they weren’t shaped—and we need non-question-begging ways to compare calibrations."  
  - **Board notes:**  
    > Obviousness ≠ Innateness  
    > Variation → Meta-method problem  
    > "Ask more people?" → Whose people? Why theirs?  

  ---

  ### **Ethical Variant (No Deception)**  
  **Modifications:**  
  - **Upfront brief:** "We’re studying how training affects judgment. There are two manuals; you’ll train on one and we’ll compare outcomes."  
  - **Trade-off:** Less surprise, but students may still feel their judgments "lock in." Use if deception concerns you.  
  - **If challenged:** "The simulation required immersive training to mirror real enculturation. We’ve debriefed fully—your experience is valuable data."  

  **Async/Online Version:**  
  - Pre-/post-surveys via Google Forms.  
  - Breakout rooms for training (share manual PDFs).  
  - Controls do filler task (e.g., Google Docs editing).  
  - Wagering via poll; procedures run in main room.  

  ---

  ### **Predictable Pitfalls & Fixes**  
  | Pitfall                          | In-the-Moment Fix                              | Prevention (Handout/Script)                     |
  |----------------------------------|-----------------------------------------------|-------------------------------------------------|
  | **Training drift**               | Use a timer; skip one filler if behind.       | Manuals: "Answer in 60 sec → see key."          |
  | **Spots famous case (e.g., Gettier)** | "For this task, focus only on your manual’s rules." | Vignettes avoid classics; manuals use neutral terms. |
  | **Pair collapse ("whatever")**   | "Your points depend on this—discuss why!"     | Script: "Defend your wager—convince your partner." |
  | **"Intuitions arbitrary?" stall** | Redirect: "Did anyone’s verdict feel *less* obvious post-training?" | Handout: "Today’s Q: How do we compare calibrations?" |
  | **One group rebels**             | Emphasize points; join group to model focus.  | Script: "Your manual is your job—apply it faithfully." |

  ---

  ### **What the Activity Can’t Do**  
  **Where the analogy breaks:**  
  - **Speed:** Real calibration (enculturation) takes years of implicit exposure—not 20 mins of explicit feedback.  
  - **Awareness:** No one IRL hands you an "answer key"; socialization is invisible.  
  - **Stakes:** Philosophical intuitions feel existentially weightier than a coding task.  

  **Bridge in debrief:**  
  - "This is a *model* of calibration drift. IRL, the ‘training’ is slower and subtler—but the core puzzle remains: if our intuitions are tunable, does ‘obvious to me’ signal truth, or just *my* calibration?"  
  - "We’re left with: How do we decide which calibration is ‘better’ without already assuming ours is right?"  

  ---

  **Outcome:** By the end, students should articulate:  
  - Why obviousness doesn’t rule out shaping.  
  - Why polling more people just kicks the can to "which people?"  
  - Why variation demands a "meta-method" we can all accept.  

  Run this tight, and they’ll leave with the "sharp" itch you want—not a shrug.
