answer: |-
  ### Translation of the Bootstrapping Problem & Replies into ML Vocabulary

  #### **Problem Statement (Reliabilist Bootstrapping):**
  - **Scenario:**  
    A model (belief-forming source) is evaluated on its own outputs. The subject (evaluator) repeatedly queries the model, observes high self-consistency (agreement between outputs) or past accuracy (matches against ground-truth labels), infers the model is reliable, and uses it to gain new "knowledge" (high-confidence predictions).  
  - **Issue:**  
    This resembles **self-training without held-out evaluation**:  
    - The model’s self-consistency (e.g., high agreement on perturbed inputs) or past accuracy (on a subset of data) is used to certify reliability.  
    - No independent test set validates generalization, risking **leakage** (implicit reliance on training data).  
    - The process amplifies confidence at "no apparent cost" (no new data or external validation).  

  #### **Standard Replies (Translated):**
  1. **Ampliative Induction Justification:**  
     - The track-record inference is a **resampling estimator** (e.g., bootstrap) applied to past performance.  
     - Analogue: Using accuracy on a validation set (past matches) to infer future performance—standard practice if the validation set is i.i.d. and leakage-free.  

  2. **Generality Problem:**  
     - Reliability claims require specifying a **process-type** (e.g., "model on domain \(\mathcal{D}\)").  
     - Failure occurs when the type is misspecified:  
       - *Too narrow:* "Reliable on these exact inputs" → overfits, no generalization.  
       - *Too broad:* "Reliable on any data" → ignores **distribution shift**.  

  3. **Benign Rule-Circularity:**  
     - Using a reliable process (e.g., bootstrap) to validate reliability *of that process* is acceptable **rule-circularity**.  
     - Analogue: Applying the bootstrap to estimate uncertainty of bootstrap estimators—valid if data is i.i.d. and model is well-calibrated.  

  #### **Internalist Complaint:**  
  - The subject has no **held-out evaluation** from their perspective. Confidence stems from the source’s self-consistency or past performance, but:  
    - Without access to ground-truth labels or uncertainty quantification (**calibration**), the subject cannot justify trust internally.  
    - Resembles **weak supervision**: Using noisy self-labels (pseudo-labels) without knowing true error rates.  

  ---

  ### **Residue Report**  
  #### **What Maps Cleanly:**  
  1. **Bootstrapping ≈ Self-Training Leakage:**  
     - Self-certification maps directly to evaluating a model on its own outputs without held-out data, risking overconfidence.  
  2. **Generality Problem ≈ Process-Type Specification:**  
     - Defining the scope of reliability (domain/data distribution) is a core ML challenge.  
  3. **Rule-Circularity ≈ Bootstrap Validation:**  
     - Using bootstrap resampling to validate bootstrap estimators is standard, assuming i.i.d. data.  

  #### **What Maps with Distortion:**  
  1. **Ampliative Induction:**  
     - *Distortion Point:* Epistemology treats induction as primitive; ML requires explicit data splits.  
     - *Cheat:* Forced to equate "past matches" with a validation set, ignoring that reliabilism lacks a formal **train/test split**.  
  2. **Internalist "No Access" Complaint:**  
     - *Distortion Point:* ML assumes ground-truth labels exist externally; internalism questions whether the *subject* can access them.  
     - *Cheat:* Translated as lack of held-out evaluation, but the original complaint is about subjective justification, not data availability.  

  #### **What Has No Expression:**  
  1. **Normative Gap (Reliability vs. Reasonable Trust):**  
     - Your vocabulary describes *whether a source is reliable* (accuracy, calibration) but not *whether trust is reasonable*.  
     - Epistemology’s gap: Reliability is objective; reasonableness is subjective/normative.  
     - *Example:* A model may be reliable on \(\mathcal{D}\), but trusting it under distribution shift is unreasonable—yet your terms lack norms for "reasonable".  

  2. **Knowledge vs. Calibrated Prediction:**  
     - "Knowledge" implies truth; **calibration** only ensures predicted probabilities match empirical frequencies.  
     - No term captures "justified true belief" (e.g., a calibrated model can still be wrong on individual predictions).  

  3. **Independence Assumption Silence:**  
     - Epistemologists omit the **i.i.d. assumption** that makes bootstrapping valid in ML.  
     - *Your Insight:* The debate misses that self-certification *is* legitimate with independent data (e.g., using a held-out set for track records), but without this, it’s circular.  

  ---

  ### **Verdict on the Residue**  
  - **What Epistemology Misses:** The **i.i.d. assumption** is the unstated analogue that legitimizes bootstrapping. Reliabilists could resolve the problem by requiring track records to use held-out data—but they rarely specify data-generating processes.  
  - **What Your Vocabulary Cannot Capture:** The **normative distinction** between reliability (objective performance) and reasonable trust (subjective justification). Your framework is descriptive (measuring performance), while epistemology is prescriptive (defining when trust *should* be conferred).  

  #### **Conclusion:**  
  The residue exposes a structural limitation: Your terms optimize for empirical performance (e.g., minimizing leakage), but cannot evaluate *why* a subject *should* trust a model—only *whether* it performs well. Epistemology’s "easy knowledge" problem persists precisely because it conflates these, and your vocabulary’s silence on norms reveals where the debate needs refinement.
