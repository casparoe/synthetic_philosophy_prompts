  - Consider whether "verbal" applies to disputes or sentences, and if the asymmetry between Nell and Otto matters

  For the paraphrase test, I need to restate their claims neutrally. Nell would say: "Under quantifier meaning Q+ (including composites), 'there are tables' is true." Otto would say: "Under quantifier meaning Q- (only particles), 'there are no tables' is true." When they disambiguate like this, they can both agree on both statements - so no factual disagreement remains.

  The residual issue is about which quantifier meaning to adopt. Nell prefers Q+ for practical reasons (it matches ordinary language), while Otto prefers Q- for metaphysical austerity. But this is a normative disagreement about language use, not about reality itself.

  I should argue that this makes the ontological dispute verbal. The leftover normative disagreement is important but separate - it doesn't make the original "are there tables?" question substantive. If we called this substantive, nearly every verbal dispute could be "saved" by pointing to normative disagreements about word usage.

  Now for overgeneralization: applying this to theism/atheism. Unlike Nell/Otto, the God dispute typically involves disagreement about reality - does a divine being exist? Even if they agree on physical facts, they might disagree about supernatural facts. The paraphrase test would reveal this: "Under meaning G (including supernatural entities), God exists" vs. "under meaning N (natural only), God doesn't exist" - but they likely disagree on whether G corresponds to reality at all. So no overgeneralization here.

  Regarding "verbal" applying to disputes: I think it's about the dispute as a whole. The asymmetry matters because Nell correctly sees the dispute dissolves under the Tie, while Otto mistakenly thinks there's a factual disagreement. But the dispute's verbal status depends on the actual commitments, not who realizes it first.

  My key premise is that after disambiguation, no disagreement about the world remains. If this is false - if there's some hidden factual disagreement - then the dispute might be substantive. But given the setup, this seems correct.

  I'll conclude that their dispute is merely verbal, with a separate normative disagreement about quantifier choice. This avoids overgeneralization to substantive disputes like theism.
answer: |-
  ## Settling Nell and Otto's Dispute: Verbal or Substantive?

  The core question is whether Nell and Otto’s continued disagreement over "there are tables" is merely verbal after accepting the Tie—that both quantifier meanings (Q-, ranging only over particles; Q+, ranging over particles and their fusions) are equally joint-carving. I’ll argue that **their ontological dispute is merely verbal**, though a distinct normative disagreement about language use persists. Here’s how I reach that verdict.

  ### The Paraphrase Test: Disambiguating the Claims
  To apply the paraphrase test, we restate Nell and Otto’s claims using neutral language that disambiguates the contested quantifier meaning. Both parties should assent to the following neutral sentences:

  - **Neutral restatement of Nell’s position**: "Under quantifier meaning Q+, the sentence 'there are tables' is true."  
  - **Neutral restatement of Otto’s position**: "Under quantifier meaning Q-, the sentence 'there are tables' is false."  

  Since Nell and Otto both accept the Tie—that Q- and Q+ are metaphysically on par—they *must* agree on these neutral restatements. Nell agrees her claim is true only under Q+, and Otto agrees his claim is true only under Q-. Crucially, **no disagreement about the world survives this disambiguation**. They concur on all non-linguistic facts: the distribution of particles, their arrangements, and the absence of any privileged "joint-carving" quantifier. The dispute evaporates when we specify which quantifier is in play.

  ### The Leftover: Normative, Not Ontological
  What remains is a disagreement about *which quantifier meaning to use*. Nell prefers Q+ because it aligns with ordinary language ("tables exist"), is pragmatically useful for daily life, and supports her ontological commitments. Otto prefers Q- because it is metaphysically austere, avoids "ontological inflation," and aligns with his eliminativist instincts. This is a normative dispute about language choice—norms of assertion, conceptual frameworks, or pragmatic utility.

  **Is this enough to make the *original* dispute substantive? No.** The original dispute was explicitly ontological: "Do tables exist?" Once disambiguated, that question dissolves. The leftover is a new disagreement about *how to speak*, not about what exists. If we conflate this with the ontological dispute, we risk overgeneralizing: nearly any verbal disagreement (e.g., "Is a hot dog a sandwich?") could be "saved" by pointing to normative preferences (e.g., culinary taxonomy norms). The ontological dispute is verbal because it hinges *entirely* on quantifier ambiguity; the normative disagreement is real but separate. On my view, "merely verbal" means the dispute *as originally framed* (about tables) lacks factual content once language is clarified; it doesn’t deny that other disagreements (e.g., normative ones) can be substantive.

  ### Overgeneralization Worry: The Theist/Atheist Case
  Consider a theist and atheist who agree on all physical and historical facts but disagree about God’s existence. Applying my account:  
  - **Paraphrase test**: The theist says, "Under a quantifier meaning including supernatural entities, 'God exists' is true." The atheist says, "Under a quantifier meaning restricted to natural entities, 'God exists' is false."  
  - **Crucial difference**: Here, unlike Nell/Otto, the parties *disagree on whether the relevant quantifier meaning corresponds to reality*. The theist insists a supernatural-inclusive quantifier is "correct" (carving at divine joints); the atheist denies this. Their dispute isn’t just about language—it’s about whether reality *includes* a supernatural domain. The paraphrase test *fails* to resolve it because they reject neutrality: the theist won’t concede that God only exists "under a meaning," and the atheist won’t grant that naturalism is just "one option." Thus, my account correctly diagnoses this as **substantive**—unlike Nell/Otto, factual disagreement persists (e.g., about the structure of reality itself).

  ### Is "Verbal" a Property of Disputes or Sentences?
  "Merely verbal" applies primarily to *disputes*, not sentences in isolation. A dispute is verbal when it arises solely from semantic indeterminacy or ambiguity, with no underlying factual disagreement. The asymmetry between Nell and Otto matters: Nell correctly sees the dispute dissolves under the Tie, while Otto mistakenly thinks they’re arguing about reality. But Otto’s error doesn’t make the dispute substantive—it just means one party misunderstands its nature. The dispute’s verbal status depends on the *actual commitments* of the speakers, not their self-awareness. Here, both accept the Tie, so both *should* see the dissolution; Otto’s resistance reflects confusion, not depth.

  ### Conclusion and Key Premise
  **Verdict**: Nell and Otto’s ontological dispute is merely verbal. The paraphrase test eliminates all worldly disagreement, leaving only a normative debate about quantifier choice—which is genuine but distinct.  

  - **Contested vs. Settled**: Among philosophers, it’s widely accepted that quantifier variance *can* render ontological disputes verbal (e.g., Hirsch’s "quantifier variance" view). The Tie condition sharpens this. However, whether a normative leftover "rescues" the original dispute is **controversial**. Some (e.g., Sider) argue that quantifier choice is itself metaphysical; others (e.g., Hirsch) see it as pragmatic. I side with the latter, as the former risks trivializing ontology.  
  - **Key Premise**: My verdict leans hardest on the claim that **after disambiguation via paraphrase, no disagreement about the world remains**. If this premise is false—if, say, Nell and Otto *disagree* on whether "joint-carving" entails a unique quantifier (e.g., Otto thinks equality is impossible)—then the dispute might be substantive. But the Tie explicitly rules this out: both agree neither quantifier is privileged. Thus, the premise holds here.

  **Final Word**: Otto’s insistence that they’re not squabbling about words is misguided. They are—and Nell’s stance is the clearer one. But both can now redirect their energy: Otto to defending austerity as a virtue, Nell to championing practicality, and both to more fruitful debates where reality *doesn’t* remain silent.
