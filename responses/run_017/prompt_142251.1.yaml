prompt: |-
  hey — hoping you can help me draft something. I sit on the outcomes committee for our county's reentry workforce fund: we distribute money to four nonprofit job-training providers, and since last fiscal year about a fifth of each provider's payment has been tied to a single number, "unsubsidized job placement within 90 days of program exit, verified by pay stub." The providers responded exactly as you'd expect, and faster than any of us guessed. Two of them now screen applicants for recent work history and quietly route anyone with a gap longer than a year into a "readiness" track that doesn't count as enrollment, so those folks never enter the denominator. A third has gotten very good at placing people in two- and three-day temp assignments that technically produce a pay stub. Over two years our headline placement rate went from 31% to 58%, but when a state agency ran the same cohort through unemployment-insurance wage records, median quarterly earnings hadn't budged, which is the part that made me feel stupid for not seeing it coming. We meet again in a week and a half and I have to circulate a recommendation beforehand.

  I keep going back and forth because a friend who works in ML evaluation got me half-convinced that not all of this is the same phenomenon. His rough taxonomy: sometimes you optimize a proxy that was only ever correlated with what you care about, so the correlation frays as you push on it; sometimes the problem is that you're pushing into the extreme tail where the measure behaves differently than it does in the ordinary range; sometimes the optimizee figures out the causal path from its behavior to the measurement and short-circuits it; and sometimes it's straight-up strategic gaming where the agent knows the target and doesn't share your goal at all. That feels right to me but I'm not sure it tells us what to do. The options on the table are: (a) keep the placement metric but weight it against a risk-adjusted baseline so providers aren't punished for taking hard cases, (b) drop the formula entirely and pay a flat rate, then audit a random sample of case files against a rubric that costs real staff time to satisfy, (c) something one board member calls a "decoy metric" — publish a simple, clearly gameable number for providers to chase while the actual funding decision uses a weighted composite we don't disclose, on the theory that gaming effort gets absorbed by the harmless number, and (d) keep a formula but deliberately leave parts of it vague and hand-adjusted so it can't be reverse-engineered.

  Could you draft the memo I'd send to the full board? Short — say 600 to 700 words — and written for people who are sharp about budgets but have never heard the term Goodhart's law, so no jargon without a one-line gloss. Lead with the bottom line in the very first sentence, then give the reasoning; no preamble and don't restate my question back at me. You need to actually pick one of the four and defend it, and the losing option with the strongest case against your pick should get a fair hearing rather than being waved off. Also, at the end, tell me how confident the memo should make the board in its central claim and flag the single point you're least sure about — I'd rather hand them something honest than something that sounds airtight.
reasoning: |-
  Okay, the user is on an outcomes committee for a county reentry workforce fund. They distribute money to nonprofits for job training, and 20% of payments are tied to "unsubsidized job placement within 90 days verified by pay stub." The providers started gaming the system: some screen out applicants with long work gaps, others place people in very short temp jobs just to get a pay stub. The placement rate jumped from 31% to 58%, but wage records show no real income improvement. The user needs to draft a memo recommending solutions before their next meeting.

  The user has considered four options: (a) keep the metric but add risk adjustment, (b) drop the formula for flat rates plus audits, (c) use a "decoy metric" with hidden real criteria, or (d) keep a vague formula with manual adjustments. They also mentioned insights from a friend about different gaming types (proxy degradation, tail behavior, causal short-circuiting, strategic gaming). The memo needs to be jargon-free, pick one option, address the strongest counterargument, and end with confidence level and uncertainties.

  First, I need to pick the best option. Option (a) risk adjustment sounds good but might not fix the pay stub gaming. Option (c) decoy metric feels unethical. Option (d) vague formulas could lead to inconsistency and distrust. Option (b) flat rate with audits seems most promising—it removes perverse incentives for cherry-picking and focuses on actual outcomes through audits. The random audits with a detailed rubric could catch gaming and ensure quality without excessive bureaucracy.

  The strongest counterargument is cost and staff time for audits. But the user mentioned they have staff time, and the cost might be worth it for real impact. Also, they can start with a sample size that's manageable.

  The user's deeper needs: They want sustainable impact for participants, not just metrics. They need a solution that's practical, fair, and transparent. The memo should lead with the recommendation, explain why, address the counterargument, and be honest about uncertainties. Confidence level: medium-high, but the uncertainty is about scalability of audits and whether nonprofits can handle the audit burden without diverting resources from services.
answer: |-
  **MEMORANDUM**  
  To: Outcomes Committee, County Reentry Workforce Fund  
  From: [Your Name/Title]  
  Date: October 26, 2023  
  Subject: **Recommendation to Replace Job-Placement Incentive with Audited Flat-Rate Payments**  

  **I recommend we replace the performance-based payment formula with a flat rate per enrolled participant, supplemented by rigorous random audits of case files against a multidimensional quality rubric.** This approach best addresses the unintended consequences of our current metric while ensuring accountability for meaningful outcomes.  

  ### Why Our Current System Fails  
  We tied 20% of provider payments to "unsubsidized job placement within 90 days (verified by pay stub)" to incentivize employment results. Instead, it distorted provider behavior in ways that undermined our goal of sustainable wages for reentering citizens:  
  - **Exclusion of high-need participants:** Two providers now screen out applicants with >1-year work gaps, redirecting them to non-enrolled "readiness" tracks. This cherry-picking violates our mission of equitable access.  
  - **Trivial job placements:** One provider prioritizes 2–3 day temp jobs solely to generate qualifying pay stubs, exploiting the metric’s narrow focus on *any* job versus *quality* jobs.  
  - **No real wage growth:** State wage data confirms median quarterly earnings remain stagnant despite our placement rate doubling—proving the metric is disconnected from economic mobility.  

  These issues illustrate a core pitfall in performance incentives: when a single number becomes a target, it often ceases to be a good measure ("you get what you measure, not what you want"). Our providers aren’t acting maliciously—they’re rationally responding to flawed incentives.  

  ### Why Flat Rates + Audits (Option B) Is the Best Path Forward  
  1. **Eliminates perverse incentives:** Paying a fixed rate per enrolled participant removes the pressure to cherry-pick easy cases or chase hollow placements. Providers can focus on serving *all* eligible individuals.  
  2. **Ensures holistic accountability through audits:**  
     - **Random sampling:** Auditing 10–15% of randomly selected case files quarterly balances rigor with feasible staff workload.  
     - **Multidimensional rubric:** Audits score providers on factors we *truly* value:  
       - Job retention (e.g., wages at 6/12 months via state wage data)  
       - Participant progression (e.g., skills gained, credential attainment)  
       - Service depth (e.g., mentorship, wraparound support)  
       - Equity (e.g., % high-barrier participants served)  
     - **Payment consequences:** Funding adjustments or corrective plans tied to audit results ensure consequences for underperformance.  

  3. **Focuses resources on impact, not compliance:** Providers spend less effort gaming metrics and more on service delivery. Our committee spends less time debating formula tweaks and more on strategic oversight.  

  ### Addressing the Leading Alternative: Risk Adjustment (Option A)  
  Risk adjustment—modifying placement targets based on participant barriers—is well-intentioned but insufficient. It might reduce cherry-picking but fails to solve the deeper problem: **a pay-stub placement metric will always be vulnerable to trivial jobs.** Providers could still target low-wage, short-term roles to hit "adjusted" quotas. It also adds complexity, inviting new disputes over risk-weighting formulas.  

  ### Implementation Outline  
  1. **Transition timeline:** Adopt flat-rate payments starting Q1 2024. Audit protocol finalized by December 2023.  
  2. **Audit design:**  
     - Rubric co-developed with providers for fairness.  
     - Sample size scaled to provider capacity (e.g., 10 files/small org; 20/large org).  
     - State wage data integrated to track long-term earnings.  
  3. **Cost:** Staff time for audits (~0.5 FTE) offset by reduced formula management.  

  ### Confidence and Caveats  
  **Confidence level: Medium-High.** This model directly attacks the root cause—misaligned incentives—while prioritizing outcomes over optics. It’s proven effective in federal workforce programs (e.g., DOL TAACCCT grants).  

  **Key uncertainty:** Audit scalability if provider numbers grow. We recommend a 12-month pilot with a sunset clause, requiring explicit renewal. If audits become unmanageable, we revisit hybrid models (e.g., flat rate + small outcome bonus for *retention*).  

  ### Conclusion  
  We created this incentive to drive change—and it did, just not the change we wanted. Flat rates with audits refocus us on durable outcomes for participants, not short-term metrics for providers. I move to adopt Option B at our next meeting.  

  **Attachment:** Draft audit rubric (separate).  
  ---  
