  **Key for your delivery:**  
  - Frame this as a *practical* shift, not an ideological critique. Emphasize "fixing the incentive trap."  
  - Pre-circulate the audit rubric draft to preempt "vagueness" concerns.  
  - Acknowledge providers’ adaptability: "They responded exactly as designed; now we redesign."  
  - Confidence note signals intellectual honesty—boards appreciate this.
