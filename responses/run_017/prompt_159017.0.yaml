  ### Decision Tree for the Value Problem in Plato's *Meno*

  **Starting Commitment**: We compare knowledge and mere true belief in a single case, at a time, holding fixed the truth of the proposition and its practical upshot. The tree addresses three questions:  
  - **Primary**: Why does knowledge beat mere true belief?  
  - **Secondary**: Why does knowledge beat any lesser epistemic standing (e.g., justified true belief, Gettiered belief)?  
  - **Tertiary**: Why is knowledge *qualitatively* better, not just a point on a continuum?  

  **Tree Structure**: 7 nodes (questions), 10 leaves (positions). Unnamed leaves are marked. Nodes use cases/claims, not labels.  
  **Diagnostic Cases**: Referenced to force distinctions.  

  ---

  #### Node 1: In the road to Larissa case, does knowledge of the way there differ in value from mere true belief, even though both get you there?  
  - **No** → **Leaf 1: Dissolution**  
    - *View*: There is no value difference; knowledge is just true belief.  
    - *Awkward commitment*: Must dismiss intuitions that knowledge is distinctively valuable (e.g., in the detective case).  
  - **Yes** → Node 2.  

  #### Node 2: In the coffee machine case, does the machine’s reliability make *this specific cup* better?  
  - **Yes** → **Leaf 2: Process Reliabilism (with swamping reply)**  
    - *View*: Knowledge is more valuable because reliably produced true beliefs are less accidental; the reliability adds value to the token state.  
    - *Awkward commitment*: Vulnerable to the "swamping" intuition (reliability doesn’t improve this cup).  
  - **No** → Node 3.  

  #### Node 3: Does the coffee machine’s reliability make the *machine* (not the cup) more valuable?  
  - **Yes** → **Leaf 3: Faculty/Dispositional Reliabilism**  
    - *View*: Knowledge’s value lies in the reliable faculty, which produces future true beliefs (e.g., for stable guidance).  
    - *Awkward commitment*: Relocates value from the token belief to the faculty, weakening the single-case focus.  
  - **No** → Node 4.  

  #### Node 4: In the loving grandmother case, is her true belief beyond criticism despite poor evidence?  
  - **Yes** → **Leaf 4: Anti-Luck-Plus-Ability Hybrid**  
    - *View*: Knowledge beats mere true belief by being safe (non-lucky) and attributable to cognitive ability.  
    - *Awkward commitment*: Struggles to explain why luck-free true belief (e.g., barn façade) isn’t knowledge.  
  - **No** → Node 5.  

  #### Node 5: In the good informant case, is the valued item the person’s status as a reliable testifier?  
  - **Yes** → **Leaf 5: Social/Genealogical View**  
    - *View*: Knowledge’s value is social—it flags agents as trustworthy informants for communities.  
    - *Awkward commitment*: Doesn’t explain individual value in cases like Larissa (no audience).  
  - **No** → Node 6.  

  #### Node 6: In the stakes case, does knowledge’s value arise from licensing action, with true belief insufficient in high stakes?  
  - **Yes** → **Leaf 6: Norm of Practical Reasoning (Stakes-Sensitive)**  
    - *View*: Knowledge uniquely justifies action; its value is in being the norm for practical reasoning, sensitive to stakes.  
    - *Awkward commitment*: Clashes with fixed practical upshot (e.g., both beliefs succeed in Larissa).  
  - **No** → Node 7.  

  #### Node 7: In the two students case, does the value difference lie in one student’s ability to derive, explain, and modify the theorem?  
  - **Yes** → **Leaf 7: Understanding View**  
    - *View*: The value problem is insoluble for knowledge because understanding (grasp of reasons) is the true epistemic good.  
    - *Awkward commitment*: Renders knowledge non-valuable when understanding is absent (e.g., simple perceptual knowledge).  
  - **No** → **Leaf 8: Virtue-Theoretic (Credit)**  
    - *View*: Knowledge is more valuable because truth is creditable to the agent’s cognitive agency.  
    - *Awkward commitment*: Grandma’s true belief seems blameless but not creditable to cognitive ability.  

  ---

  #### Unseparated Leaves  
  - The tree cannot cleanly separate **Knowledge-First** from **Virtue-Theoretic** due to overlapping commitments to agent-centric value.  
    - **Knowledge-First** (unnamed leaf, grouped with Leaf 8):  
      - *View*: Knowledge is primitive; its value cannot be explained by decomposing it (e.g., in Larissa or detective cases).  
      - *Awkward commitment*: Refuses to engage the value problem on reductive terms, appearing dogmatic.  

  #### Unoccupied Combinations  
  - **(Process + Faculty Reliabilism)**: Incoherent—token and faculty value are mutually exclusive.  
  - **(Dissolution + Any Value Difference)**: Incoherent—denies the starting intuition.  
  - **(Social View + Fixed Practical Upshot)**: Unexplored—social value typically requires multiple cases.  
  - **(Norm + Stakes-Insensitivity)**: Unattractive—stakes-sensitivity is core to the view.  

  ---

