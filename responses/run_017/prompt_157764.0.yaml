prompt: |-
  Hi — please act as a professional philosopher of law who specialises in the concept of mass atrocity, and who's used to explaining these arguments to people outside the academy. Think carefully and step by step, and before you write anything final, spend a couple of paragraphs brainstorming: I'd rather you mapped out the logical space first (which of these questions are genuinely independent of one another, and where the answers constrain each other) and only then dropped the named views into the boxes. No bibliography or case citations please, I'm offline and I just need the structure.

  Background so you know why I'm asking. My gran's family came from a valley community that was destroyed in the 1940s — some killed, most driven out, the village erased, and the survivors were scattered so completely that within a generation nobody there spoke the old language to their kids. Our community association is arguing about the wording of a memorial plaque and a petition to the council. Half of us want the word genocide on it. A couple say it was ethnic cleansing and that inflating it helps nobody. One member thinks the whole word is a political football and that we should just describe what happened and stop arguing. The meetings are going round in circles and, honestly, its doing my head in, because I think we're disagreeing about three or four different things and calling it one disagreement.

  So: I want a taxonomy, drawn as a tree, that sorts people by what they think about cases rather than by the label they like. Every branch should be labelled with the question that splits it, phrased as a plain yes/no (or two-option) question someone on my committee could answer without knowing any of the jargon. Leaves: 8-10, each with the name of the position or "unnamed if nobody seriously defends it", plus one sentence on its most awkward commitment.

  Please build it around the distinctions that matter for my purpose, not the standard ones — I need at least: whether the destruction has to be physical/biological or whether ending a group's social and cultural existence counts; whose ascription fixes which group was targeted (the perpetrators', the victims' own, or some third party's); whether the destruction has to be the perpetrators' end or can be a means to something else like land; whether full-blown specific intent is required or whether knowing the group will be destroyed is enough; whether there has to be a coordinated plan or whether it can accumulate out of lots of separate acts; whether a group can be destroyed "in part" when the part is tiny or defined only by geography; and whether non-state actors or just plain structural pressures can be perpetrators at all. I also want one branch near the top for the meta-question my dissenting member keeps raising: whether genocide is a moral kind we should try to get right, or a legal and political instrument whose extension should be settled by what applying it does.

  Make sure the tree can actually sort these, they're the cases my committee keeps throwing at each other: (1) nobody dies — the whole population is resettled with compensation and new citizenship, but dispersed one family per town and legally forbidden from organising as a community; (2) a militia works from a sixty-year-old colonial census and kills everyone recorded under a category that the people concerned stopped using generations ago and now intermarry across freely; (3) a group of about two hundred people — a valley, a monastery — is annihilated completely; (4) a group is killed for its land, and the killers would have been perfectly happy if it had just left; (5) children are removed from a famine or an abusive setting and raised outside the group, so every individual thrives and the group ends; (6) the land and water a group depends on are poisoned so that births stop, over decades, with no one killed.

  Then: tell me which combinations of answers are unoccupied and why you think nobody lives there (incoherent, unattractive, or just untried), and flag honestly any pair of leaves your tree can't actually separate. Finally, walk two of my members down the tree — my auntie, who insists on the word, and the member who thinks the word is a distraction — and show me where they land and, if it turns out they differ on only one branch, say so, because that would definately change how I run the next meeting.
reasoning: |-
  Okay, the user is asking for a structured taxonomy to clarify the debate around whether their community's tragedy qualifies as genocide. They need a decision tree with clear yes/no questions that non-experts can follow, based on specific distinctions relevant to their committee's arguments. 

  First, I need to map the logical space before labeling positions. The user listed seven key distinctions, plus the meta-question about genocide's nature. These aren't all independent - some answers constrain others. For example, if you require "full specific intent" (Q4), you'd logically need a coordinated plan (Q5), so Q5 might not even need asking in that branch. Similarly, "destruction method" (Q1) interacts with "non-state actors" (Q7) - structural violence implies non-intentional processes.

  The cases they provided are excellent stress tests. Case 1 (dispersion without deaths) challenges Q1 (must destruction be biological?). Case 2 (killing based on outdated categories) tests Q2 (whose group definition matters?). Case 4 (land grab with conditional survival) probes Q3 (end vs means) and Q4 (intent rigor). Case 6 (slow environmental destruction) forces Q1 and Q7 together.

  The meta-question (Q0) is crucial - it's the root split. Instrumentalists might accept looser criteria to achieve political goals, while moral realists demand precision even if it weakens advocacy. This explains why the committee talks past each other: they're not just disagreeing on facts, but on why the label matters.

  For the tree structure: Q0 first, then Q1 (physical vs social destruction), since that's most visceral for the user's case. Q2 and Q3 come next because targeting and intent are core to legal definitions. Q4-Q7 handle edge cases like small groups or structural perpetrators. 

  Unoccupied combinations? For example: believing genocide requires specific intent (strict Q4) but allowing structural perpetrators (Q7-yes). That's incoherent - structures can't "intend". Also, defining groups only by victims (Q2-victims) while requiring perpetrator intent (Q4-specific) creates contradictions if perpetrators didn't recognize the group.

  Walking through the aunt (pro-label) and dissenter (anti-label): 
  - Aunt likely takes Q0-moral kind route, then accepts social destruction (Q1-yes), prioritizes victim self-identification (Q2-victims), and so on. 
  - Dissenter probably picks Q0-instrument, then might reject social destruction (Q1-no) or emphasize perpetrator perspective (Q2-perps). 
  If they only diverge at Q0, that's huge - it means their factual disagreements stem from why they want the label. The committee could then discuss purpose before evidence.

  Noticing the user's emotional fatigue ("going in circles"). The taxonomy's real value may be exposing that some debates are about principles (Q0) not facts. Naming that could reduce tension.
answer: |-
  Here's a taxonomy built around the distinctions you specified, designed to sort positions on genocide classification without jargon. The tree prioritizes your committee's pain points and cases, with branches as yes/no questions. **Bolded labels** indicate named positions; others describe conceptual space.

  ---

  ### **Root Question (Meta-Level):**
  **Q0: Is "genocide" primarily a moral category we must define accurately, OR a political/legal tool whose boundaries should serve practical goals?**
  - *No (Moral Kind)* → Proceed to Q1
  - *Yes (Political Instrument)* → Proceed to Q1  
  *(Note: This branch heavily influences how strictly later criteria are applied)*

  ---

  ### **Core Criteria Branches**
  **Q1: Does "destruction of a group" require physical/biological elimination, OR does erasing its social/cultural existence suffice?**  
  - *No (Physical/Biological Only)* → Excludes cases 1, 5, 6  
  - *Yes (Social/Cultural Erasure Counts)* → Includes cases 1, 5, 6  

  **Q2: Whose view defines the targeted group?**  
  - *Perpetrators' Ascription* → Case 2 fails (if group no longer exists per victims)  
  - *Victims' Self-Ascription* → Case 2 qualifies (if victims identify otherwise)  
  - *Objective Third-Party* → Controversial; rarely pure  

  **Q3: Must destruction be the perpetrator's end goal (not just a means)?**  
  - *No (Means to an End Allowed)* → Case 4 qualifies ("killed for land")  
  - *Yes (Must Be an End)* → Case 4 excluded  

  **Q4: Is "specific intent to destroy" required, OR is knowledge of destruction sufficient?**  
  - *No (Knowledge Suffices)* → Case 6 might qualify (slow poisoning)  
  - *Yes (Specific Intent Required)* → Case 6 excluded  

  **Q5: Must there be a coordinated plan?**  
  - *No (Emergent from Uncoordinated Acts)* → Case 3 qualifies (small group annihilation)  
  - *Yes (Coordinated Plan Needed)* → Case 3 excluded if spontaneous  

  **Q6: Can "destruction in part" apply to tiny/geographic subgroups?**  
  - *No (Requires Substantive/Enduring "Part")* → Case 3 excluded (tiny valley)  
  - *Yes (Tiny/Geographic Part Counts)* → Case 3 qualifies  

  **Q7: Can non-state actors/structural forces commit genocide?**  
  - *No (Only State-Like Actors)* → Case 6 excluded (structural poisoning)  
  - *Yes (Non-State/Structural Forces Included)* → Case 6 qualifies  

  ---

  ### **Leaf Positions (8 Leaves)**
  1. **Q0-Yes + Q1-No + Q7-No**  
     *Position:* **Minimalist Legalism**  
     *Awkward Commitment:* Case 6 (slow poisoning) isn't genocide—even if group vanishes.  

  2. **Q0-No + Q1-No + Q3-Yes + Q4-Yes**  
     *Position:* **Schabas Strict Intentionalism**  
     *Awkward Commitment:* Case 4 (killed for land) excluded—no "intent to destroy" group.  

  3. **Q0-No + Q1-Yes + Q2-Victims + Q4-No**  
     *Position:* **Social Destructionism**  
     *Awkward Commitment:* Case 5 (children removed "benignly") is genocide—group destroyed.  

  4. **Q0-No + Q1-Yes + Q2-Perpetrators + Q3-No + Q6-Yes**  
     *Position:* **Expansive Lemkinian**  
     *Awkward Commitment:* Case 2 (outdated census) qualifies—perpetrators *believed* group existed.  

  5. **Q0-No + Q1-No + Q5-No + Q6-Yes**  
     *Position:* *Unnamed (Incoherent)*  
     *Why:* Demands physical destruction but allows unplanned acts against tiny groups.  

  6. **Q0-Yes + Q1-Yes + Q7-Yes + Q4-No**  
     *Position:* **Political Instrumentalist**  
     *Awkward Commitment:* Case 6 (structural poisoning) is genocide if labeling aids victims.  

  7. **Q0-No + Q1-No + Q3-No + Q4-No**  
     *Position:* **Knowledge-Based Realism**  
     *Awkward Commitment:* Case 4 (land grab killings) qualifies—perpetrators knew group would be destroyed.  

  8. **Q0-No + Q1-Yes + Q5-Yes + Q6-No**  
     *Position:* **Coordinated Cultural Eliminationist**  
     *Awkward Commitment:* Case 3 (valley annihilation) excluded if not state-planned.  

  ---

  ### **Unoccupied Combinations & Why**
  - **Q1-No + Q7-Yes** (Physical destruction required, but non-state actors qualify): *Untried*—legalists assume states monopolize large-scale violence.  
  - **Q3-Yes + Q4-No** (Destruction must be an end, but knowledge suffices): *Incoherent*—if it's not an end, intent can't be "specific."  
  - **Q2-Third-Party + Q4-Yes** (Objective group + specific intent): *Unattractive*—perpetrators can't intend to destroy a group they don't recognize.  

  ---

  ### **Cases Your Tree Separates**
  - **Case 1** (resettlement): Only qualifies under Q1-Yes positions (leaves 3,4,6,8).  
  - **Case 2** (outdated census): Only qualifies if Q2-Perpetrators (leaf 4) or Q0-Yes (leaf 6).  
  - **Case 4** (land grab): Qualifies under Q3-No or Q4-No (leaves 4,6,7).  
  - **Case 6** (slow poisoning): Requires Q1-Yes + Q7-Yes (leaves 3,4,6).  

  ---

  ### **Walking Two Members Down the Tree**
  **Auntie (insists on "genocide"):**  
  - Q0: **No** (moral kind).  
  - Q1: **Yes** (social erasure counts—valley's culture/language lost).  
  - Q2: **Victims** (group defined by Gran's community).  
  - Q3: **No** (land seizure motive acceptable).  
  - Q4: **No** (knowledge suffices—perps knew dispersal would destroy group).  
  - Q5: **Yes/No** (irrelevant if Q4-No).  
  - Q6: **Yes** (geographic part counts).  
  - Q7: **Yes** (state or local militias).  
  → **Lands on Leaf 3 (Social Destructionism)**.  

  **Dissenter ("word is a distraction"):**  
  - Q0: **Yes** (political instrument).  
  - Q1: **No** (only killings count—rejects cultural erasure).  
  - Q2: (Skips—irrelevant if Q1-No).  
  - Q3: **Yes** (must be primary intent—land was goal, not destruction).  
  - Q4: **Yes** (specific intent lacking).  
  → **Stops early: No genocide under their view** (aligns with Leaf 1 or 2).  

  **Key Insight:** They **diverge at Q0 and Q1**. Your auntie sees genocide as a moral category including social destruction; the dissenter sees it as a politicized legal term requiring bodily harm and specific intent. This isn’t one disagreement—it’s two foundational splits.  

  ---

  ### **How This Helps Your Committee**
  1. **Map disagreements to branches**, not labels. Ask: "Do you think erasing our culture counts as destruction?" (Q1) or "Is the word useful even if debatable?" (Q0).  
  2. **Focus on Q0 first**: If half see "genocide" as instrumental, compromise wording may be possible. If all see it as moral, debate factual criteria.  
  3. **Case-based testing**: Apply cases 1 and 4—they force clarity on social destruction (Q1) and intent (Q3/Q4).  

  This reveals your committee isn’t arguing about *what happened* but about **what genocide means** and **why the label matters**. Naming that could break the cycle.
