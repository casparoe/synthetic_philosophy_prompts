  ### Full Session Plan: Concepts, Categories, and Analogies (90 Minutes)  
  **Goal:** Students experience "edge room" (domain structure at scale limits) and "chunk slippage" (ambiguity in rule application) through structured activities, then debrief to formalize the concepts.  

  **Materials to Prep (Night Before):**  
  - **Index cards:** 40+ cards (20 for rules + 20 for wagering).  
  - **Markers:** 1 per student.  
  - **Whiteboard setup:** Divide into 4 quadrants (dead end, wrap, tier jump, nested edge).  
  - **Domain seed cards (4 total):** One for each group, with minimal context:  
    - **Dead End:** "Alphabet strings (e.g., abc → abd). What comes after z?"  
    - **Wrap:** "Pitch classes (e.g., A → B). What comes after G?"  
    - **Tier Jump:** "Digits (e.g., 1 → 2). What comes after 9? After 99?"  
    - **Nested Edge:** "Belt ranks (e.g., white → yellow). What comes after brown? After black?"  
  - **Test string cards (4 sets):** Hidden until Phase 2. Each set has 3 strings:  
    - Dead End: `abc`, `aabbcc`, `iijjkk`  
    - Wrap: `ABC`, `AABB`, `FFGG`  
    - Tier Jump: `9`, `19`, `99`  
    - Nested Edge: `brown`, `black`, `brown brown`  

  **Timeline & Flow:**  

  #### **Phase 1: Setup & Warm-Up (5 min)**  
  - **0:00–0:05**  
    - Students enter; no laptops. Hand out markers and index cards.  
    - Quick intro: "Today, we’re exploring how rules behave in structured domains. You’ll work in groups to generate rules and test them. No lectures—jump straight in."  
    - Split into 4 groups (3–4 students each). Assign each group a domain seed card.  

  #### **Phase 2: Rule Generation & Testing (30 min)**  
  - **0:05–0:15: Group Brainstorm**  
    - Task: "As a group, agree on a *single, explicit rule* for your domain. Write it clearly on an index card. It must work without context (e.g., ‘Increment the last character’)."  
    - Circulate to ensure rules are context-free (e.g., dead end: "Change the last letter to the next in alphabet; if z, stop"). No domain-specific terms allowed!  
    - **Predictable Problem:** Groups write vague rules (e.g., "Go to the next one"). *Solution:* Ask: "Could someone with no context apply this? Rewrite for clarity."  

  - **0:15–0:25: Test String Application**  
    - Hand each group their hidden test string card.  
    - Task: "Apply your rule to each test string. Write results on the back of the rule card."  
    - **Key:** Observe disagreements (e.g., for `aabbcc`, does it become `aabbcd` or `aabbdd`?). Note these for debrief.  
    - **Predictable Problem:** Groups realize rules break at edges (e.g., tier jump group debates `19` → `20` vs. `110`). *Solution:* Let them struggle; it surfaces edge room naturally.  

  - **0:25–0:35: Commit Rules**  
    - Collect rule cards. Redistribute so each group gets *another group’s* rule card (not their domain).  
    - Give all groups a **new shared test string:** `XXYYZZ` (generic; designed for chunk slippage).  
    - Task: "Apply the rule you received to `XXYYZZ`. Write your answer on a new index card. Do *not* consult the rule-writers."  

  #### **Phase 3: Blind Rule Application & Wagering (25 min)**  
  - **0:35–0:45: Blind Application**  
    - Groups share blind-application results for `XXYYZZ` aloud.  
    - **Example variance:**  
      - Dead end rule → `XXYYZa` (last char) vs. `XXYYaa` (last two chars).  
      - Wrap rule → `XXYYAA` (wrap) vs. `XXYYZA` (no wrap).  
    - Post all rule cards and answers on the whiteboard.  

  - **0:45–0:55: Wagering**  
    - **Stakes system:** "You have 3 points. Wager 0–3 on whether the room will *agree* on answers for each domain. Not about being right—bet on consensus."  
    - For each domain:  
      - Read the test string (e.g., `aabbcc`) and the two answers (original group’s vs. blind group’s).  
      - Students wager points secretly on index cards.  
      - Reveal agreement/disagreement. Award double points for correct consensus predictions; no penalty for wrong bets.  
    - **Goal:** Highlight gaps between confidence and actual agreement (e.g., "I felt sure, but nobody agreed!").  

  - **0:55–1:00: Group Comparison**  
    - Quick share-out: "Which domains had unanimous agreement? Which didn’t? Why?"  

  #### **Phase 4: Structured Debrief (25 min)**  
  - **1:00–1:15: Map Experiences to Concepts**  
    - Use whiteboard quadrants. For each domain, ask:  
      - "What happened at the edge (e.g., after z, 9, brown)?"  
      - "Where did the rule break or change silently?"  
      - "In strings like `aabbcc`, how did you decide *which part* to change?"  
    - **Student quotes to elicit:**  
      - Dead End: "We hit a wall—no rule for after z." → **Edge room: dead end**.  
      - Wrap: "After G, it reset to A—like a loop." → **Edge room: wrap**.  
      - Tier Jump: "After 9, we needed a new digit (10)." → **Edge room: tier jump**.  
      - Nested Edge: "After black, we went *into* black belts (1st dan)." → **Edge room: nested edge**.  
      - Chunking: "We fought over changing one char or the whole chunk." → **Chunk slippage**.  
      - Rules: "Our written rule was too vague for `XXYYZZ`." → **Rules underdetermined by instances**.  

  - **1:15–1:20: Formalize Concepts**  
    - Only now introduce terms:  
      - **Edge room:** "What the domain ‘gives’ you at the end of a scale. Four types: dead end, wrap, tier jump, nested edge."  
      - **Chunk slippage:** "Ambiguity in *which part* of a string the rule applies to."  
      - **Underdetermination:** "Rules are under-specified by their examples—they’re rigid but permissive."  
    - **Philosophy tie-in (for majors):** "This mirrors Wittgenstein’s rule-following paradox: no rule fully determines its application. Edge room and chunking create ‘fluid concepts’—not because rules are unclear, but because domains run out of structure."  

  - **1:20–1:25: Synthesis & Close**  
    - "Key insight: Slippage isn’t about ignorance—it’s about edge room exhaustion. A rule becomes a *different rule* at the edge."  
    - Final Q: "Where *couldn’t* the activity capture this? (E.g., abstract domains, real-time decisions.)"  

  **Spillover Buffer:** +5 min. If time runs short, shorten wagering to 2 domains.  

  **Predictable Problems & On-Spot Fixes:**  
  1. **Problem:** Groups write domain-specific rules.  
     - *Fix:* "Re-read your rule—would it make sense to someone without the seed card? Strip domain terms."  
  2. **Problem:** Blind application causes frustration (e.g., rule too ambiguous).  
     - *Fix:* "Use the conflict! Why was this hard? Note it for debrief."  
  3. **Problem:** Philosophy majors dominate debrief.  
     - *Fix:* "Start with cog sci perspectives: How does this impact cognitive models of categories?"  
  4. **Problem:** Wagering feels chaotic.  
     - *Fix:* Use hand signals (thumbs up/down) for quick consensus checks.  

  **Where You Must Explain (No Activity Reach):**  
  - **Edge room types:** The activity surfaces behaviors (e.g., resetting after G), but you must explicitly name the four flavors.  
  - **Underdetermination:** Students *feel* rule ambiguity, but you must frame it as "rules being underdetermined by instances."  
  - **Philosophy link:** The activity sets up Wittgenstein/Kripke, but you must connect the dots to avoid abstraction.  

  **Why This Works:**  
  - **Experience-first:** Students *generate* edge cases and *feel* slippage before labeling it.  
  - **Low stakes:** Wagering focuses on consensus, not correctness, reducing pressure.  
  - **All-in participation:** Blind application forces engagement; no one is passive.  
  - **Debrief structure:** Whiteboard mapping makes abstract concepts tangible.  

  **Output:** Students leave with embodied understanding of edge room, chunk slippage, and underdetermination—no pre-loaded jargon. The philosophy majors get a concrete hook for rule-following debates.
