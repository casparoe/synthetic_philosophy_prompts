  For Group 3, we'll have to explain that the string is a single number. For Group 4, we use spaces. This is a flaw, but it will have to do.

  Alternatively, for Group 3 and Group 4, we can use spaces, and for Group 1 and 2, no spaces. But then the activity is not parallel.

  Given the time, let's proceed with the detailed plan.

  **Session Plan**

  Total Time: 90 minutes

  Materials:
  - Whiteboard
  - Index cards (4 per group for rules, and some for wagering)
  - Markers
  - Handout for each group with their domain seed and test strings (but we want them to generate, so we'll give only the seed and let them come up with rules and test cases, then we provide the test strings later).

  But to save time, we can provide the test strings on a separate card.

  Prep:
  - Prepare 4 index cards with the seed for each group.
  - Prepare 4 index cards with test strings for each group (one set per group).
  - Prepare index cards for wagering (one per student).

  Phase 1: Introduction (5 minutes)
  - "Welcome! Today we're going to explore how we extend patterns and rules to their limits. You'll be working in small groups on different domains. Your task is to figure out how the pattern continues, especially at the edges. There are no right or wrong answers, but you'll need to agree on a rule and then apply it."
  - "Here's the catch: you'll write down a rule on an index card, and then another group will try to apply it without knowing the domain. So make sure your rule is clear and context-free."
  - Divide into 4 groups (3-4 students each).

  Phase 2: Group Activity 1 - Rule Generation (25 minutes)
  - Give each group their seed card.
  - Instructions: "With your group, discuss how the pattern works in your domain. Come up with a rule that says how to generate the next item in a sequence. Write that rule clearly on an index card. Make sure it doesn't rely on knowing the domain; it should be general. Then, you'll receive a set of test strings. Apply your rule to these strings and write down what you get."
  - Groups work on their rule and then apply it to the test strings (which you hand out after they have written the rule).
  - While they work, circulate to ensure they are writing a context-free rule and to observe where they struggle.

  Group 1 (Dead End - Alphabet):
    - Seed: "Consider a sequence of lowercase letters. Starting from 'a', what comes next? Continue until 'z'. What comes after 'z'?"
    - Rule example: "Increment the last letter to the next letter in the alphabet. If there is no next letter, stop or indicate an error."
    - Test strings card: 
          "a" 
          "z"
          "abc"
          "aabbcc"
          "iijjkk"

  Group 2 (Wrap - Musical Notes):
    - Seed: "Consider a sequence of musical notes: A, B, C, D, E, F, G. After G, what comes next? (Assume it wraps around to A.)"
    - Rule example: "Increment the last note to the next note. If it is G, then next is A."
    - Test strings card:
          "A"
          "G"
          "ABC"
          "AABB"
          "FFGG"

  Group 3 (Tier Jump - Digits as a Number):
    - Seed: "Consider a string of digits which represents a whole number. What comes after 1? After 9? After 99?"
    - Rule: "Increment the number by one and write the result as a string of digits."
    - Test strings card:
          "1"
          "9"
          "19"
          "99"
          "999"

  Group 4 (Nested Edge - Martial Arts Belts with spaces):
    - Seed: "Consider a sequence of belt ranks: white (W), yellow (Y), orange (O), green (G), blue (U), brown (Br), black (Bl). After brown, what comes next? After black, what comes next? (After black, you get 1st dan: then 2nd dan, etc.)"
    - Representation: use space-separated tokens. The string is a sequence of tokens, each token is: W, Y, O, G, U, Br, Bl, or Bl1, Bl2, Bl3, ...
    - Rule: "Increment the last token to the next rank. If it is brown (Br), next is black (Bl). If it is black (Bl), next is 1st dan (Bl1). If it is Bl followed by a number, increment the number by one."
    - But note: the token for black without dan is "Bl", and with dan is "Bl1", etc. So the rule must handle that. 
    - Test strings card (with spaces as given):
          "W"
          "Br"
          "Bl"
          "Bl9"
          "Br Br"
          "Bl1 Bl1"

  After 20 minutes, hand out the test strings card. They have 5 minutes to apply their rule.

  Phase 3: Blind Rule Application (15 minutes)
  - "Now, trade your rule card with another group. Do not trade seed cards or test strings. Only the rule card. You will receive a test string from the other group's set and apply their rule to it."
  - Rotate rules: Group1->Group2, Group2->Group3, Group3->Group4, Group4->Group1.
  - Give each group one test string from the other group's set (choose one that causes edge or chunk issues).
    - For example, give Group2 (now with Group1's rule) the string "aabbcc" from Group1's test strings.
    - Group3 (with Group2's rule) gets "AABB" from Group2's test strings.
    - Group4 (with Group3's rule) gets "19" from Group3's test strings.
    - Group1 (with Group4's rule) gets "Br Br" from Group4's test strings.
  - Groups apply the rule they received to the test string they received and write down the result.
  - They then pass back the rule card and their answer to the original group.

  Phase 4: Wagering and Group Discussion (20 minutes)
  - Each group now has their own rule card back and the answer from the other group.
  - They also have their own answer for that test string.
  - "Now, we're going to see how much agreement there is. Each group will report: the test string, what they got when they applied their own rule, and what the other group got."
  - For each test string, write on the whiteboard:
        Test string: [string]
        Own group's answer: [answer]
        Other group's answer: [answer]
  - Then, before revealing the other group's answer, have the whole class (individually) wager on whether the two answers will be the same or different.
  - Wagering system: 
        - Each student gets an index card with 3 points to start.
        - They can wager 0, 1, 2, or 3 points on whether the two answers are the same or different.
        - After all groups have reported, reveal and adjust points.
  - Do this for each of the 4 test strings.

  Phase 5: Debrief (25 minutes)
  - "What happened? Where did the answers differ? Why?"
  - Guide the discussion to draw out:
        - Edge cases (what happens at the end of the alphabet? after 9? after brown belt? etc.)
        - Chunking: how did you decide what part of the string to apply the rule to? (e.g., in "aabbcc", did you change the last letter or the last two?)
        - Rules: even when you wrote a rule, it might have been ambiguous in new contexts.
  - Introduce the terms:
        - Edge room: what happens at the end of the scale? (dead end, wrap, tier jump, nested edge)
        - Chunk slippage: ambiguity in which part of the string the rule applies to.
        - Underdetermination: the rule doesn't specify what to do in all cases.
  - Connect to philosophy: rule-following considerations (Wittgenstein, Kripke) for those who have seen it.
  - Conclude: "Concepts and categories often have fluid boundaries, and this fluidity isn't just about vagueness; it's about the structure of the domain and how we chunk information."

  Predictable Problems and Solutions:
  - Problem: Groups may not write a context-free rule.
    - Solution: Circulate and remind them to make it general. If they fail, during blind application, it will be apparent, and you can discuss why context matters.
  - Problem: Blind application may be very confusing.
    - Solution: Allow the applying group to ask one yes/no question to the rule-writing group if stuck, but that might take time. Alternatively, let them do their best and then discuss the ambiguity.
  - Problem: Wagering may take too long.
    - Solution: Do it quickly by having students write their wager on a card and hold it up.
  - Problem: The nested edge domain may be too complex.
    - Solution: Simplify by providing more guidance or using a different example on the fly.

  Where you have to say the thing out loud:
  - The debrief will require you to introduce the terms and concepts explicitly. The activity sets up the experience, but you will need to connect it to the framework.

  This plan is ambitious and might run over 90 minutes, but you said it's okay to spill over a bit.

  Let me know if you need any adjustments.
