prompt: |-
  I write long-form fiction and am midway through a trilogy set in an invented world. Six of its cultures still need a religious system, I have to draft each in one evening before the chapter it appears in, and each then has to survive my editor and one sensitivity reader. What I keep producing is either costume — a creation story, a taboo, some incense, none of which would change a single character's behaviour if I deleted it — or, worse, a thin disguise for a real-world tradition, which the sensitivity reader rightly kills. I do not want an essay or a reading list; I cannot check sources and my readers do not care. I want a procedure.

  So please turn what is actually understood about religion as a natural phenomenon — how religious representations get transmitted from person to person and why some spread while others die, what makes a practice convincing to the people inside it rather than merely asserted, why arduous or costly or uncomfortable actions cluster around them, and why they so often concern agents who want something of you — into a checklist I can run unaided, in under an hour, with no training. Give me the questions in the order I should ask them; what counts as a good enough answer to each; the points at which the procedure simply returns a no; and the points at which it must stop and hand the decision back to me because what is at issue is a value and not a fact. State the mechanisms in plain language I can build fiction from. Tell me which distinctions have survived being made usable, which you have dropped and why, and where a procedure like this will misfire on invented material.

  Two tests matter to me especially. First, a test for costume: something that tells me whether the religion is load-bearing in the story or only scenery, ideally by asking what would actually change in the plot if I took it away. Second, a rule of thumb for accidental resemblance to a real tradition — when to rewrite a passage myself and when to send it to the sensitivity reader — since I cannot research six cultures' worth of comparative religion.

  Apply the finished procedure to three sketches: the guild of lamp-tenders whose creed is that the Long Lamp must never be allowed to go dark, and who are forbidden to count the hours a wick has burned; the river nomads whose single annual rite is a public naming of wrongs, after which the settlement may never speak of them again; and the auditors, who keep clay tallies of favours owed to the dead and burn them at funerals. I expect it to clear one, to tell me to cut or rebuild one I am attached to, and to deadlock on the third — and I want to know, at the end, what it cannot tell me at all.
reasoning: |-
  Okay, let me tackle this user's query. They're a writer working on a trilogy and need to create six fictional religions quickly. The main issues are avoiding superficial "costume" elements and accidental real-world parallels. The user wants a practical procedure, not theory.

  First, I need to distill anthropological and cognitive science insights into a usable checklist. Key concepts include hyperactive agency detection, costly signaling, and memory biases like the minimal counterintuitiveness effect. These should form the core of the questions.

  The user mentioned three tests: costume, real-world resemblance, and load-bearing functionality. For costume, I'll focus on whether the religion affects decisions or conflicts. For resemblance, I'll include a step to identify unique combinations of elements. The load-bearing test will tie into plot necessity.

  Looking at their examples: the lamp-tenders seem promising because the taboo affects behavior (not counting hours). The river nomads' rite might be too thin without social enforcement. The auditors could work but need to clarify why the dead care about favors.

  I should structure the checklist in a logical order: start with supernatural agents, then move to practices, transmission, costs, and finally functionality and sensitivity checks. Each step needs clear pass/fail criteria and exit points.

  For the sensitivity part, emphasizing unique combinations over individual elements should help avoid direct parallels. Including a "weirdness threshold" step where the user assesses distinctiveness makes sense.

  Applying the procedure to their sketches: lamp-tenders pass easily. Nomads fail unless adding enforcement mechanisms. Auditors need clearer supernatural justification - maybe add ancestor spirits who react to burned tallies?

  Important to note limitations: the procedure can't create emotional depth or replace sensitivity readers for nuanced issues. The user should still consult experts for final checks, especially regarding marginalized traditions.

  The key is balancing speed with depth - giving them tools to quickly generate religions that feel real without getting bogged in research. The focus on actionable consequences and unique combinatorial elements should address their core frustrations.
answer: |-
  Here’s a procedure designed for speed, grounded in cognitive science of religion (CSR) and anthropology, focused on functionality and avoiding pitfalls. It prioritizes **actionable consequences** within your story world.

  **Core Mechanisms in Plain Language:**

  1.  **Hyperactive Agency Detection (HAD):** Humans are wired to assume unseen agents (spirits, gods, ancestors) cause unexplained events. Religions exploit this.
  2.  **Costly Signaling:** Expensive/difficult actions prove commitment, making beliefs credible *to the group*. It filters out fakers.
  3.  **Minimally Counterintuitive Concepts (MCI):** Ideas slightly violate everyday intuition (talking tree, invisible watcher) are easier to remember and transmit than totally bizarre or totally mundane ones.
  4.  **Social Cohesion & Norm Enforcement:** Religions often codify group rules, provide identity, and offer ways to resolve conflict or ostracize rule-breakers.
  5.  **Existential Buffers:** They address fundamental fears (death, chaos, meaninglessness) offering explanations and coping mechanisms.
  6.  **Memory Biases:** Practices tied to strong emotions (awe, fear, relief), repeated rituals, or striking imagery are more likely to stick.

  **The 60-Minute Religion Builder Checklist:**

  Run this sequentially. Aim for 5-10 minutes per question.

  1.  **The Agents: Who Wants Something?**
      *   *Question:* What specific, named supernatural agents (gods, spirits, ancestors, forces) are believed to exist and actively care about human actions? What do they *want* from people? (Not vague "benevolence").
      *   *Good Enough:* At least one agent with a specific desire (e.g., "Ancestors demand remembrance," "The River Spirit demands annual apology," "The Light demands constant vigilance"). Avoid purely abstract forces.
      *   *No/Exit:* If no specific agent with specific desires exists. **STOP.** Beliefs without agents who care rarely drive costly behavior meaningfully. Hand back: *You must define an agent with a demand.*
      *   *Mechanism:* HAD, Existential Buffers (agents control fate/afterlife).

  2.  **The Cost: What's the Hard Part?**
      *   *Question:* What is the most arduous, expensive, painful, risky, or socially difficult action followers *must* perform to satisfy the agent(s) or avoid their displeasure? How does this cost *prove* commitment?
      *   *Good Enough:* A clear, non-trivial cost (time, resources, pain, social risk) directly linked to pleasing the agent(s). (e.g., "Lamp-tenders pull dangerous all-night shifts," "Nomads publicly humiliate themselves," "Auditors meticulously track complex debts").
      *   *No:* If the only actions are easy, pleasurable, or cost-free (e.g., just "believing"). **STOP.** This is likely "costume." Hand back: *Add a meaningful cost that signals commitment.*
      *   *Mechanism:* Costly Signaling, Social Cohesion (shared hardship binds).

  3.  **The Consequence: What Happens If You Screw Up? (Or Succeed?)**
      *   *Question:* What specific, tangible negative consequence (social, physical, supernatural) do followers *genuinely fear* will happen if the costly action is neglected or done wrong? What positive outcome (beyond generic "blessing") do they expect for doing it right?
      *   *Good Enough:* A specific, undesirable outcome (e.g., "Lamp goes out -> darkness brings monsters," "Unnamed wrongs fester -> settlement fractures," "Unburned tallies -> angry ghosts cause misfortune"). A specific desirable outcome helps (e.g., "Burned tallies -> ancestral protection").
      *   *No:* If consequences are vague ("god is angry," "bad luck"), purely spiritual with no worldly impact, or non-existent. **STOP.** Without tangible stakes, the cost seems arbitrary. Hand back: *Define concrete, feared consequences.*
      *   *Mechanism:* Existential Buffers (mitigating fear), HAD (agents enact consequences).

  4.  **The Memory Hook: Why Does This Stick?**
      *   *Question:* How is the core belief/practice made memorable and transmissible? (Think striking imagery, strong emotion, repetition, sensory input).
      *   *Good Enough:* At least one strong hook (e.g., Lamp-tenders: visceral fear of darkness, dramatic imagery of the flame. Nomads: intense catharsis/shame of public naming. Auditors: physical clay tokens, drama of burning).
      *   *No:* If reliant solely on abstract philosophy or easily forgotten rules. **CUT or REBUILD.** Won't transmit effectively. Hand back: *Add a vivid sensory/emotional ritual, image, or story.*
      *   *Mechanism:* Memory Biases (emotion, repetition), MCI (slightly weird elements stick).

  5.  **The Social Glue: Who's In, Who's Out?**
      *   *Question:* How does this practice/belief define the group? Who can participate? What happens to someone who openly rejects the costly action or the agents?
      *   *Good Enough:* Clear in-group marker tied to the practice/belief. Clear (even if unspoken) social consequence for violation (e.g., Lamp-tenders: Guild membership requires vigil. Violation = expulsion/shame. Nomads: Participation defines settlement member. Refusal = exile? Auditors: Only certain lineages keep tallies. Mismanagement = loss of status).
      *   *No:* If everyone can do it freely without social weight, or if rejection has zero social impact. **REBUILD.** Lacks social function. Hand back: *Define the group boundary and social enforcement.*
      *   *Mechanism:* Social Cohesion & Norm Enforcement.

  6.  **The Functionality Test (AKA "Is This Costume?")**
      *   *Question:* **If I deleted this entire religious element from the story:** Would a character's crucial decision change? Would a major conflict disappear or fundamentally alter? Would a key aspect of the social structure or worldbuilding collapse? Would a character's core motivation vanish?
      *   *Good Enough:* YES to at least one. The religion directly causes a plot point, conflict, character choice, or defines a societal structure that matters *to the story*. (e.g., Lamp-tenders: Decision to sacrifice sleep/safety? Conflict over a dying flame? Nomads: A character hiding a wrong? Conflict boiling over because it can't be named? Auditors: A character seeking a dead person's favor? Conflict over a disputed tally?).
      *   *No:* If the answers are all "No," it's just scenery. **CUT.** It's not serving your narrative. Hand back: *Integrate it into a character's dilemma, a societal conflict, or a plot-critical rule.*
      *   *Mechanism:* This tests *narrative* load-bearing, not just cognitive plausibility.

  7.  **The Weirdness Threshold (Avoiding Resemblance - First Pass)**
      *   *Question:* Looking at the *specific combination* of Agent + Demand + Cost + Consequence + Memory Hook + Social Rule: Does this combination feel *uniquely weird* within my world, or does it immediately scream "This is just X from Earth"?
      *   *Good Enough:* The *overall system* feels distinct to your world. Individual elements might echo real things (ancestor worship, taboos, confessions), but the *specific package* is novel (e.g., Lamp-tenders + forbidden counting + fear of literal monsters in dark).
      *   *Trigger for Rewrite Yourself:* If the *core mechanic* (not just surface details) feels like a direct lift (e.g., River Nomads: If it feels *exactly* like Yom Kippur or Catholic Confession in function and emotion). **REWRITE.** Tweak the Agent, Cost, Consequence, or Social Rule significantly to break the parallel.
      *   *Trigger for Sensitivity Reader:* If the combination involves elements *specific to a marginalized or often-misrepresented group* (e.g., practices core to Indigenous, African Diasporic, or other frequently appropriated traditions), even if you think it's novel. **FLAG.** Better safe than sorry. *Send the specific passage describing the practice, not the whole religion.* Hand back: *This element risks resembling [Name Tradition]. Consult expert.*
      *   *Mechanism:* Avoiding appropriation relies on unique combinatorial complexity and avoiding sacred/oppression-significant elements of real groups.

  **Dropped Distinctions & Why:**

  *   **Monotheism vs. Polytheism:** Functionally, what matters is *agents with demands*. A single god demanding multiple costly things works similarly to multiple gods each demanding one thing.
  *   "**True**" **vs. "False" Religion:** Irrelevant to how it functions socially/cognitively within the culture. Your characters believe it *is* true.
  *   **Detailed Cosmology/Theology:** Fascinating, but not core to the transmission mechanics or behavioral impact. Focus on the actionable parts (Agent, Demand, Cost).
  *   **Ethics vs. Ritual:** Both can be costly signals. The key is the *cost* and the *social/supernatural consequence* of neglecting it.

  **Where This Misfires on Invented Material:**

  1.  **Truly Alien Minds:** If your cultures have radically different cognition (e.g., hive minds, non-agentive perception), HAD and MCI might not apply. This assumes human-like cognition.
  2.  **Gods That Are Provably Real:** If deities walk the earth granting undeniable boons, the "belief" transmission mechanisms become less relevant; it's more about managing observable power. This focuses on *unseen* agents and transmitted tradition.
  3.  **Pure Philosophy/Stoicism:** Systems focused solely on personal equanimity without supernatural agents, social enforcement, or costly signals won't trigger these mechanisms. They function differently.
  4.  **Individual Mysticism:** Highly personal, non-transmissible experiences fall outside the social transmission focus.

  ---

  **Applying the Procedure to Your Sketches:**

  1.  **The Guild of Lamp-Tenders:**
      *   **Agents:** "The Long Lamp" (or the Darkness it holds back) - Wants: Constant vigilance.
      *   **Cost:** Dangerous, sleepless vigils; Forbidden to count hours (adds mental cost/uncertainty).
      *   **Consequence:** Lamp goes out -> Darkness brings literal monsters/devastation.
      *   **Memory Hook:** Visceral fear of darkness/monsters; Dramatic imagery of the flame; physical exhaustion.
      *   **Social Glue:** Guild membership defined by tending; violation = expulsion (loss of status/protection?).
      *   **Functionality Test:** **PASS.** Drives plot (keeping lamp lit during crisis), character choices (sacrifice for vigil), conflict (guild politics, resource scarcity). Deletion destroys core conflict.
      *   **Weirdness Threshold:** Taboo on counting + literal monsters is distinct combo. **CLEAR.**
      *   **Verdict:** **Strong Pass.** Load-bearing and distinct.

  2.  **The River Nomads:**
      *   **Agents:** ??? Unclear. The River? Ancestors? Abstract Harmony? **Problem.**
      *   **Cost:** Public humiliation/shame of naming wrongs.
      *   **Consequence:** ??? Social discord if not done? But "never speak again" rule seems to handle that *without* needing an agent. Tangible consequence missing. **Problem.**
      *   **Memory Hook:** High emotion (shame, relief).
      *   **Social Glue:** Participation defines settlement membership; refusal might mean exile? Needs defining.
      *   **Functionality Test:** *Potential* (hiding a wrong, secret revealed at naming, conflict over "never speak again"). But hinges on Agent/Consequence.
      *   **Weirdness Threshold:** Resembles various confession/forgiveness rituals. Surface-level distinctiveness low. **Risk.**
      *   **Verdict:** **FAIL (Rebuild).** Critical flaws: No clear Agent with a Demand. No clear tangible Consequence *tied to an agent* (social consequence is weak here without supernatural weight). Resembles real rituals too closely. **Action:** Add an Agent (e.g., "The River Spirit demands purification before the floods" - consequence: bad floods if sins fester). Make the "never speak again" rule a sacred taboo *enforced by the spirit*, not just social custom. This ties it together and adds uniqueness.

  3.  **The Auditors:**
      *   **Agents:** The Dead. Want: Their owed favours acknowledged and settled.
      *   **Cost:** Meticulous lifelong record-keeping of complex debts.
      *   **Consequence:** Unburned tallies -> Angry ghosts cause misfortune (illness, accidents). Burned tallies -> Ancestral blessings/protection.
      *   **Memory Hook:** Physicality of clay tallies; drama of burning; fear/respect of ghosts.
      *   **Social Glue:** Auditor is a specific, vital role; lineage-based? Mismanagement = loss of status, blame for misfortunes.
      *   **Functionality Test:** **PASS.** Drives plot (disputed tally, missing tally, character seeking a dead person's favor), character motivation (auditor's duty, someone avoiding debt), conflict (over tallies, blame for ghostly trouble).
      *   **Weirdness Threshold:** Clay tallies + burning for the dead + specific role is a fairly unique combo. **Likely Clear.**
      *   **Verdict:** **Pass (Minor Note).** Strong core. Ensure the "why" of the dead wanting favours settled is minimally addressed (e.g., "Unsettled debts tie them to this world painfully"). It works as is, but a tiny hint deepens it.

  **What the Procedure Cannot Tell You:**

  1.  **Emotional Resonance & Depth:** It builds functional skeletons, not the lived, emotional, nuanced experience of faith. *You* must flesh out the awe, doubt, comfort, and fanaticism.
  2.  **Aesthetic Richness:** Incense, creation myths, art, music – these are vital texture. The procedure ensures they aren't *just* texture by linking them to the functional core (e.g., creation myth explains *why* the Lamp must stay lit). But their specific beauty is your job.
  3.  **Nuances of Appropriation:** While the "Weirdness Threshold" helps, only lived experience or deep expertise can catch all subtle, harmful parallels, especially regarding marginalized traditions. The sensitivity reader step is crucial insurance.
  4.  **Ultimate "Believability" within Your World:** It ensures cognitive/social plausibility, but whether it *feels* perfectly integrated into your specific world's history, ecology, and other cultures depends on your broader worldbuilding.
  5.  **Theological Complexity:** It focuses on the behavioral "engine." Debates, schisms, heresies, profound philosophical interpretations – these add depth but come *after* the functional core is established.

  **Final Summary:** This procedure forces you to define the *engine* of the religion – the supernatural pressure point demanding costly action with tangible stakes, reinforced socially and memorably. It ruthlessly cuts the decorative and identifies the load-bearing, while providing a first-line defense against obvious appropriation through combinatorial uniqueness. Use it to build the chassis quickly; then layer on the aesthetics and depth as your story requires. Good luck with the trilogy!
