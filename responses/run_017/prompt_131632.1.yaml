  - Part (a) should make them distinguish criterion shifts from genuine experience changes using the lab study variations
  - Part (b) needs to separate diachronic retraining (radiologist case) from occurrent penetration
  - Part (c) should examine how different "penetrating" states affect Fodor's epistemic argument

  For the epistemic angle, I'll emphasize that penetration's epistemic danger depends on the state's truth-tracking ability - not just whether penetration occurred. This subtly undermines the clean penetrable/encapsulated dichotomy they might expect.

  The model answer should model concise, case-driven reasoning within 600 words. For the marking scheme, I'll specify concrete pitfalls like "treating radiologist's expertise as occurrent penetration" or "equating sensitivity changes with full-blown penetration".

  Notably, the user suspects the epistemic cut doesn't align with penetration/encapsulation - I'll bake this insight into part (c) by having students evaluate benign vs malignant cases regardless of penetration status.

