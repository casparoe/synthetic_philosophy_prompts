answer: |-
  Here's the exam question, model answer, and marking scheme designed to meet your specifications:

  ---

  ### (1) Exam Question (30 marks total, approx. 90 min)
  **Stem:**  
  Using the cases below, explain what evidence would distinguish *cognitive penetration of perception* (where cognitive states directly alter the *content of conscious experience*) from:  
  (i) attentional selection,  
  (ii) shifts in response bias without experiential change, and  
  (iii) diachronic perceptual learning *without* ongoing cognitive influence.  
  Then, evaluate whether a penetrable perceptual system would *necessarily* undermine its role as an "independent tribunal" for beliefs if the influencing state were:  
  (a) a rational true belief,  
  (b) an irrational desire, or  
  (c) a belief embedded via long-term training (as in Case A) but no longer occurrent.  
  Finally, what conditions might make a penetrable system *epistemically benign*?  

  **Cases:**  
  - **Case A:** An experienced radiologist, after years using AI that highlights tumors, now sees tumors "jump out" spontaneously on unaided scans. Her accuracy improves, and this occurs without conscious deliberation about the image.  
  - **Case B (Lab Study):**  
    - **Version 1:** Participants told an ambiguous stimulus (e.g., `#`) is likely the letter "H" report seeing "H" more vividly. Sensitivity (d') is unchanged, but response criterion (c) shifts.  
    - **Version 2:** Same instructions, but sensitivity (d') *improves* for detecting "H".  

  ---

  ### (2) Model Answer (600 words)  
  **Distinguishing Mechanisms:**  
  Cognitive penetration requires evidence that cognitive states (beliefs/desires) directly alter *phenomenal character*. In Case B, Version 1’s unchanged sensitivity shows no change in *perceptual discrimination*—only a decision-level shift (e.g., requiring less evidence to report "H"). This fails as penetration. Version 2’s improved sensitivity *suggests* perceptual change but doesn’t prove it: attention might enhance signal clarity without cognitive penetration (e.g., by boosting sensory gain for expected features). To confirm penetration, we’d need converging evidence (e.g., neural correlates of early visual processing changes, or phenomenological reports of altered appearance *independent* of judgment).  

  Case A involves diachronic retuning. The radiologist’s improvement lacks an *occurrent* cognitive state during perception; it’s perceptual learning. While beliefs *caused* this rewiring, penetration requires *online* cognitive influence. If tumors genuinely *look* more salient due to training (not attentional focusing), this is *perceptual expertise*—not penetration.  

  **Epistemic Implications:**  
  Fodor’s worry is circularity: penetrated perception can’t independently justify beliefs if shaped *by* those beliefs. But the epistemic risk depends on the *nature* of the influencing state:  
  - **(a) Rational true belief:** Least problematic. If a true belief penetrates (e.g., expecting "H" correctly improves detection), perception *aligns* with truth. Circularity exists but is epistemically productive (e.g., expertise).  
  - **(b) Irrational desire:** Highly problematic. Desires lack truth-tracking (e.g., a fearful person seeing shadows as threats). Perception becomes biased, losing justificatory independence.  
  - **(c) Trained expertise (Case A):** Benign *if* the training calibrated the system reliably (e.g., radiologist’s skill). The embedded "belief" isn’t occurrent, so circularity is historical, not ongoing. Perception remains a tribunal *if* the expertise is truth-conducive.  

  **Benign vs. Malignant Penetration:**  
  A penetrable system is benign when:  
  1. Penetrating states are *reliably truth-tracking* (e.g., expertise),  
  2. Effects *enhance sensitivity* (not just bias), and  
  3. The system retains *bottom-up constraints* (e.g., illusions still detectable).  
  Malignancy arises from arbitrary or false penetrators (e.g., desires). Crucially, encapsulation isn’t necessary for epistemic safety—expertise shows penetration *can* improve objectivity. The real divide is between *reliably calibrated* and *capriciously biased* influences.  

  ---

  ### (3) Marking Scheme  

  | Required move                                                                 | Marks | What a first-class answer does                                                                 | Specific mistake costing marks                                   |
  |-------------------------------------------------------------------------------|-------|------------------------------------------------------------------------------------------------|------------------------------------------------------------------|
  | **I. Distinguishing Mechanisms (15 marks)**                                                                                                                              |
  | Correctly identifies Case B, Version 1 as response bias (criterion shift)     | 3     | Uses sensitivity/criterion to show no perceptual change; notes unchanged d'                     | Assumes vividness reports imply experiential change (confuses phenomenology with criterion shift) |
  | Explains why improved sensitivity (Case B, V2) is *necessary but insufficient* for penetration | 4 | Notes attention/acuity could explain d' shift; demands additional evidence (e.g., neural, phenomenal) | Treats sensitivity change as *conclusive* proof of penetration |
  | Analyzes Case A as diachronic learning *not* penetration                      | 4     | Highlights absence of occurrent state; distinguishes causal history from online influence       | Calls Case A penetration because beliefs *initiated* learning   |
  | Contrasts attentional selection vs. penetration in the cases                  | 4     | Notes attention operates pre-perceptually (e.g., signal enhancement), not altering content      | Conflates attention-driven clarity with cognitive penetration   |
  | **II. Epistemic Evaluation (15 marks)**                                                                                                                              |
  | Explains epistemic risk varies by penetrator type (rational/irrational/trained) | 4     | Shows true beliefs/expertise reduce circularity risk; desires increase it                      | Treats all penetrators as equally threatening                   |
  | Evaluates trained expertise (Case A) as epistemically benign (if reliable)     | 4     | Notes historical calibration breaks "live" circularity; emphasizes reliability                 | Assumes diachronic effects are penetrative *and* circular       |
  | Argues epistemic benignancy ≠ encapsulation; identifies reliability conditions | 4     | States penetration can be truth-conducive (e.g., expertise); gives conditions (reliability, sensitivity) | Claims only encapsulated systems can justify beliefs            |
  | Notes Fodor’s worry applies strongest to irrational/desire-based penetration  | 3     | Explicitly contrasts desire (no truth-tracking) with trained belief (reliable)                 | Fails to distinguish penetrator types in epistemic argument     |

  ---

  ### Metadata (JSON)
  ```json
  {
    "question_stem": "Using Cases A and B, distinguish cognitive penetration from attentional, criterion-shift, and diachronic-learning mechanisms, then evaluate epistemic implications across penetrator types.",
    "discriminates": "A answers dissect how mechanisms require distinct evidence and show epistemic risk depends on penetrator reliability; B answers conflate mechanisms or treat penetration as uniformly threatening.",
    "time_budget_minutes": 90,
    "total_marks": 30,
    "bleedover_risk": "Attention (conflating top-down attention with cognitive penetration) or theory-ladenness (focusing on conceptual vs. non-conceptual content without addressing mechanisms)."
  }
  ```

  ---

  ### Design Notes:
  1.  **Anti-Regurgitation:**  
      - Cases force application over summary. Students *must* engage BOTH versions of Case B to distinguish sensitivity/criterion.  
      - The radiologist case blocks "training = penetration" oversimplifications by demanding analysis of *occurrent* states.  
  2.  **Forced Distinctions:**  
      - Subparts explicitly name attention, criterion shifts, and diachronic learning as contrasts.  
      - Epistemic follow-up *requires* comparing penetrator types (rational/irrational/trained).  
  3.  **Epistemic Nuance:**  
      - The model answer shows benign penetration via reliability (e.g., expert radiologist) without violating Fodor’s core worry about desires. This aligns with your suspicion that the epistemic cut isn’t penetrable/encapsulated.  
  4.  **Marking Precision:**  
      - "Specific mistake" column targets your cited failure modes (e.g., conflating vividness reports with penetration, misattributing trained expertise).  
  5.  **Bleedover Mitigation:**  
      - Explicitly naming "attentional selection" in the stem reduces risk of answers drifting into attention theories. "Epistemic tribunal" framing anchors to penetration debates (not disjunctivism).  

  This setup rewards students who rigorously dissect mechanisms and penetrator types while penalizing conflation—even if they can’t cite Pylyshyn or Fodor.
