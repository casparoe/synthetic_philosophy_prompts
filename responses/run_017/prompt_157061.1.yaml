prompt: |-
  I've been haunting the rationalist corners of the internet for the better part of fifteen years — Overcoming Bias back in the day, LessWrong and the decision-theory threads ever since, all the Newcomb and Sleeping Beauty and updatelessness material — and I've finally run into something there I can't dissolve on my own, so I'm bringing it to you. It started from the absent-minded driver setup, which I'll restate in my own numbers so we aren't arguing about a half-remembered paper. A driver is heading home along a highway with two identical-looking intersections; exiting at the first puts him in a bad neighbourhood (0), exiting at the second gets him home (4), missing both leaves him at a motel (1). He can't tell the intersections apart, so the only plans he can execute are of the form "whenever I find myself at an intersection, continue with probability p", using a device that re-randomizes freshly each time rather than a single coin flip before departure — a single flip only gets him 1, because the only pure plans he can name without being able to identify a node are "exit at every intersection" (0) and "continue at every intersection" (1), and no mixture of those beats 1. (I'm setting aside gadgets with hidden internal state, which just restore recall and collapse the case.) Working ex ante, 4p(1−p) + p² = 4p − 3p² peaks at p = 2/3 and is worth 4/3, and I'm confident that is the ceiling over everything he can actually implement.

  Here is the argument I can't get out of. (1) A plan is rationally permissible only if, at every point where it might call on you to act, doing what it says maximizes expected utility by the lights of what you know then — the ordinary dynamic-consistency or sequential-rationality condition, the same one that licenses two-boxing in Newcomb problems. (2) If he is running p = 2/3 and finds himself at an intersection, his expected numbers of visits to the first and second intersections stand in the ratio 1 : 2/3, so his credence that he is at the first is 3/5 and at the second 2/5; this is the same visit-weighting that gives thirders their answer in Sleeping Beauty, and I know halfers would say 1/2. (3) Given those credences, picking a fresh continuation probability p′ for the rest of the drive is worth (3/5)(4p′ − 3p′²) + (2/5)(4 − 3p′), which peaks at p′ = 1/3 and is worth 9/5 — strictly more than sticking with the old plan, which by the same formula is worth 8/5. (4) The halfer credence makes it worse rather than better: at 1/2 the best continuation is p′ = 1/6, worth 49/24, nearly 2.04. (5) But 9/5 exceeds 4/3, and 4/3 is the most any plan he could have adopted before leaving was worth; re-deliberating at a moment of action cannot manufacture expected value that no ex-ante plan attains. (6) Nothing in the construction depends on the details: take any sequential decision problem, blind the agent as to which node he's at, have him re-derive a self-locating credence and re-optimize, and step (3) hands him more than the ex-ante ceiling, so uncertainty about where you are in your own plan is not a handicap but a source of surplus, and the surplus gets bigger the more confused you are — this in the very same problem where a device that simply tells him which intersection he's at is worth 8/3 to him, and I can't see how being confused and being informed can both pay. (7) So one of (1) through (3) is false.

  I want to know which step you'd reject, why it looked innocent, and what rejecting it costs me — and if you'd reject (1), what replaces dynamic consistency for an agent with imperfect recall, since "evaluate policies rather than acts" sounds like the whole answer and I suspect it isn't. Two things I'd particularly like addressed: what the 9/5 is even a measure of, since I have a strong feeling it isn't the expected payoff of anything, and whether my re-randomizing device is smuggling something a single pre-departure flip couldn't. For what it's worth, one person in the thread says the fix is to require the plan and the credence to be mutually consistent, and when I solve that fixed point I get p = 4/9 with a credence of 9/13, worth 32/27 — about 0.15 below 4/3 — so buying consistency costs real money and I don't see why I should pay it. I'd rather keep (1) and the ex-ante arithmetic than (2) or (3), but follow the argument where it goes. Please reply in continuous prose, an email-length answer, with no headings, bullet points, bold text or tables.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They've been involved in rationalist communities for years and are stuck on a decision theory puzzle involving the absent-minded driver. The core issue is that re-optimizing at an intersection seems to yield a higher expected payoff (9/5) than the ex-ante optimal plan (4/3), which shouldn't be possible. They've laid out seven clear steps and want to know which is wrong and why.

  First, I need to recall the absent-minded driver setup. The driver faces two identical intersections. Exiting at the first gives 0, at the second gives 4, missing both gives 1. The optimal ex-ante plan is to continue with probability p=2/3, giving an expected payoff of 4/3. The user's argument hinges on dynamic consistency: at each intersection, the driver should re-optimize based on their current credence.

  The user calculates that at an intersection, using thirder-like credences (3/5 at first intersection, 2/5 at second), re-optimizing leads to p'=1/3 and expected value 9/5, which exceeds 4/3. This is paradoxical because no ex-ante plan can achieve that. The user mentions that requiring consistency between plan and credence (fixed point) gives a lower value, but they don't see why that's necessary.

  I need to identify where the error lies. Steps (1) to (3) seem solid. Step (1) is standard dynamic consistency. Step (2) uses visit-weighting for credence, similar to Sleeping Beauty's thirder position. Step (3) calculates the expected payoff from re-optimizing. The problem arises in step (5), where the 9/5 is compared to the ex-ante optimum.

  The key is that the 9/5 isn't actually achievable. When the driver decides to use p'=1/3 at the current intersection, this affects both present and future actions. However, since the intersections are identical and the driver has imperfect recall, changing the plan now doesn't account for how this decision impacts the strategy at the other intersection. The re-randomizing device is used freshly each time, but the issue is that the driver is making a decision at a single point without considering that the same strategy applies at both nodes.

  The credence model assumes independence, but the continuation probability p' applies to both intersections if the driver reaches the second one. However, the driver at the first intersection choosing p'=1/3 doesn't control what happens at the second intersection if they continue. The ex-ante plan coordinates the behavior at both intersections, but re-optimizing breaks that coordination.

  The 9/5 is a conditional expectation given being at an intersection, but it doesn't translate to the overall expected payoff. The formula (3/5)(4p' - 3p'²) + (2/5)(4 - 3p') assumes that p' is chosen only for the current intersection and a different strategy might be used later. But in reality, with imperfect recall, the driver can't implement different strategies at different intersections. The same continuation probability must be used throughout the drive.

  So when the driver at an intersection chooses a new p', they're committing to using that same p' at the next intersection too, because they can't remember or distinguish. The formula in step (3) incorrectly assumes that p' only affects the current choice and that a different choice can be made later. But due to imperfect recall, the driver must use the same mixed strategy at both intersections.

  Therefore, the correct calculation when re-optimizing isn't to pick a one-time p' but to pick a new global p to use at all intersections. So the expected payoff from choosing a new p is still 4p - 3p², which peaks at p=2/3 with 4/3. Thus, re-optimizing doesn't yield a higher payoff; the driver should stick with p=2/3.

  The user's mistake is in step (3), where they treat p' as a local decision without recognizing that it must be applied globally due to imperfect recall. The 9/5 is a mirage because it assumes independent local control that doesn't exist. The ex-ante ceiling holds, and dynamic consistency is satisfied since at each intersection, given the constraint that the same p must be used everywhere, sticking with 2/3 is optimal.

  This also explains why the fixed-point approach gives a lower value—it's unnecessary because the consistency is already enforced by the imperfect recall. The re-randomizing device doesn't smuggle in extra power; the issue is the faulty assumption in the re-optimization calculation.
answer: |-
  Your conundrum cuts to the heart of imperfect recall and self-locating uncertainty in decision theory. The flaw lies in step (3), where the calculation of expected utility upon re-deliberation assumes an illegitimate independence between the continuation probability chosen at the current intersection and the strategy that will govern subsequent actions. This error makes the 9/5 figure a mirage—it doesn't correspond to the actual expected payoff achievable under the constraints of the problem.

  When the driver re-optimizes at an intersection and selects a new continuation probability \(p'\), they are not merely choosing an action for that single node. Due to imperfect recall, any probabilistic strategy they adopt *must* be applied identically at both intersections. The re-randomizing device ensures independence across instances but does not bypass the fundamental constraint: the driver cannot implement different continuation probabilities at the first and second intersections because they cannot distinguish them or remember past actions. Thus, selecting \(p'\) at one intersection commits the driver to using that same \(p'\) at the other intersection if they reach it. The calculation in (3), however, treats \(p'\) as if it only affects the current choice, imagining they could freely choose a different probability later or that the existing plan remains intact elsewhere. This inflates the apparent payoff.

  Recomputing the expected utility correctly under this constraint: if the driver switches to \(p'\) at the current intersection, they are adopting \(p'\) as their new global strategy. Their expected utility becomes \(4p'(1 - p') + (p')^2 = 4p' - 3(p')^2\), which peaks at \(p' = 2/3\) for a value of \(4/3\)—identical to the original optimum. There is no gain from deviation. The 9/5 arises from an inconsistent hybrid model: it grafts a locally optimized \(p'\) onto the future application of the original \(p = 2/3\) plan, which is impossible under imperfect recall. It is not a measure of any coherent achievable payoff.

  This resolves the paradox without rejecting dynamic consistency (step 1) or the credence model (step 2). At each intersection, given the necessity of a uniform strategy, sticking to \(p = 2/3\) maximizes expected utility relative to the agent's beliefs. The thirder credence (3/5, 2/5) is sound, but the decision must account for the global implication of changing \(p\). The re-randomizing device isn't the issue; it faithfully implements any chosen \(p\), but the error is in misapplying it locally during re-deliberation.

  The fixed-point solution you mention (p=4/9, value 32/27) is unnecessary here. It imposes an additional consistency constraint between credence and strategy that isn't required by rationality alone. In this problem, the ex-ante optimal plan naturally satisfies dynamic consistency under imperfect recall when re-optimization is properly constrained. Imperfect recall remains a handicap—the informed driver (knowing the intersection) achieves 8/3—and confusion doesn't generate surplus. The tension you sensed arises from an artifact of miscalculation, not a deep flaw in decision theory.

  You lose nothing by accepting this: dynamic consistency holds, the ex-ante optimum binds, and the credences remain defensible. The cost of rejecting step (3) is merely abandoning an incoherent computation, replaced by the correct constrained maximization. This preserves the unity of sequential rationality and ex-ante planning in the face of self-locating uncertainty.
