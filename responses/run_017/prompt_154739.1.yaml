prompt: |-
  Im in a phil of physics seminar right now and we just spent two weeks on substantivalism vs relationism — newtons bucket, whether a lone planet in an otherwise empty universe would still bulge at the equator, Mach, the hole argument, all of it. Everyone argues about the metaphysics but I got stuck on something much more boring: what do the people who actually have to say whether something is rotating do?

  Because as far as I can tell the working practice does two things that pull in opposite directions. (1) The official standard for not rotating in astronomy — the International Celestial Reference System and its realization, the ICRF — fixes its axes by requiring that they show no net rotation relative to a set of very distant extragalactic objects, mostly quasars, tracked by radio interferometry across the earth; the optical frame from the Gaia satellite is then tied to that, and Earth orientation parameters (where the pole is, how far the planet has turned today) plus deep-space navigation are all measured against it. So the standard of non-rotation is defined by the distant matter in the universe. (2) At the same time the field also trusts sealed-box instruments: ring laser gyroscopes and other Sagnac devices, including big ones bolted to bedrock in Germany and Italy that are used to measure the earth's rotation directly, which never look at the sky at all — they just report an angular velocity for the lab, full stop.

  My prof says (1) shows the practice is basically Machian, my textbook says (2) shows general relativity keeps rotation absolute because inertial structure is a real field, and I cant tell who is reading too much into plumbing. So: what does the practice as a whole actually presuppose about what rotation is? Reconstruct the implicit theory, and be sharp about what it strictly presupposes versus what it merely fits fine with. Is (1) and (2) an inconsistency, or are they just measuring different things — is the quasar frame only a convenient, accessible marker for a frame that's there anyway?

  Two more wrinkles I want in. First, frame dragging: spinning mass does shift local inertial frames a bit. Does that mean the practice is secretly committed to a partly relational picture, or is it one effect among many? Second, a made-up case: suppose over a couple of decades VLBI and the big ring lasers slowly drift apart by a tiny amount, and the drift tracks how the mass in our cosmic neighbourhood is distributed and moving — imagine a huge rotating shell of matter around the observatory. Which instrument then gets to say what is really not rotating, and what would geodesists have to do about Earth orientation parameters and the frame definition, and on what grounds? Does it matter if the drift is local (only near the mass) rather than global?

  And what would concretely have to change in the day-to-day work if you swapped in full relationism, or full substantivalism, or the view that spacetime is just a field and the question is ill-posed — or is the practice underdetermined, so that several theories license exactly the same measurements and both my prof and the textbook are over-reading? Also worth saying whether GR even gives one global answer about who is rotating or only local ones, because if it's only local then the practice might presuppose less than the whole metaphysics fight assumes.
reasoning: |-
  Okay, let me unpack this user's question. They're in a philosophy of physics seminar debating substantivalism vs relationism, but they're stuck on how working scientists actually determine rotation in practice. The user presents two seemingly conflicting practices: (1) using distant quasars as a fixed reference frame (ICRF), and (2) using local gyroscopes that measure rotation without external references.

  Hmm, the core tension is between these two methods. The professor says (1) is Machian (relationist), while the textbook claims (2) supports absolute rotation (substantivalist). The user wants to know what the scientific practice actually presupposes, and whether it's consistent.

  First, I need to clarify how both methods work in practice. The ICRF defines the non-rotating frame by averaging distant quasars - that's globally fixed. But ring laser gyroscopes measure local rotation via the Sagnac effect, which depends on spacetime geometry. So at first glance, they seem philosophically opposed. But are they really?

  Wait - in general relativity, local inertial frames are defined by gyroscopes (via parallel transport), while global frames like ICRF are coordinate choices. The ICRF is designed to approximate the asymptotic inertial frame where the universe appears isotropic. So both methods are actually measuring different aspects of the same relativistic framework.

  The user mentioned frame dragging - that's important. Effects like Gravity Probe B show mass rotation affects local gyroscopes. But in practice, this is treated as a small correction (microarcseconds/year for Earth), not a fundamental challenge. So it's "one effect among many" rather than a philosophical commitment.

  Their hypothetical scenario is fascinating: what if gyroscopes drifted relative to quasars due to a rotating mass shell? In that case, geodesists would likely prioritize the quasar frame because it's asymptotically flat, while treating the gyro drift as a local gravitational effect to be modeled. This shows the practice assumes the distant frame is more fundamental.

  About underdetermination - yes, the same measurements could technically support different metaphysical interpretations. But the working practice doesn't need metaphysics; it needs operational definitions. The quasar frame provides a stable coordinate system, while gyroscopes measure local deviations from it. Both are useful tools.

  For their final question: GR doesn't provide a global "who's rotating" answer - only local inertial frames. The global ICRF frame is a practical convention that works because the universe is approximately asymptotically flat. So the practice presupposes less than the metaphysics debate assumes - it's fundamentally operational.

  The user seems frustrated by the philosophy/theory disconnect. They want concrete answers about scientific practice. My response should validate that the tension is resolvable technically without metaphysics, while acknowledging why both professor and textbook see support for their views.
answer: |-
  Your question cuts to the heart of the tension between operational practice and metaphysical interpretation in physics. Let's reconstruct the implicit theory behind the measurement of rotation, separating strict presuppositions from compatible interpretations, and address your specific wrinkles. The key is distinguishing **operational definitions**, **empirical adequacy**, and **metaphysical commitments**.

  ### Core Implicit Theory of Rotation in Practice
  1.  **Operational Definition of Non-Rotation:**
      *   **Global Non-Rotation:** Defined operationally by the *International Celestial Reference System (ICRS/ICRF)*. Axes are fixed by requiring *zero net rotation* relative to the ensemble of distant quasars (extragalactic radio sources). This frame is treated as "inertial" for practical purposes.
      *   **Local Non-Rotation:** Defined operationally by *local gyroscopic compasses* (ring lasers, fiber optic gyros). A gyroscope whose spin axis doesn't precess relative to its local support structure defines a *local non-rotating frame*.

  2.  **Strict Presuppositions:**
      *   **Spacetime has Inertial Structure:** The practice fundamentally assumes spacetime possesses structure that defines geodesics (paths of free fall) and local inertial frames (where Newton's first law holds locally). *This is non-negotiable for GR and the instruments to make sense.*
      *   **Gyroscopes Define Local Inertial Directions:** The axis of a freely suspended, torque-free gyroscope defines the direction of a local inertial frame axis via *Fermi-Walker transport*. Sagnac devices (ring lasers) are sensitive to rotation *relative to this local inertial structure*.
      *   **Distant Matter Provides a Stable Reference:** The ICRF presupposes that the bulk motion of the universe's matter content, as sampled by distant quasars, defines a frame that is empirically indistinguishable from a global inertial frame *for practical applications* over human timescales. It leverages the *Copernican Principle* (we are not special) and the observed large-scale isotropy of the universe.
      *   **Consistency is Expected (and Observed):** The practice presupposes that the rotation measured by local gyroscopes bolted to the Earth *relative to the ICRF* will match the rotation expected from Earth Orientation Parameters (EOP) derived from tracking celestial objects against the ICRF. This consistency is routinely verified.

  3.  **What it Fits Fine With (But Doesn't Strictly Presuppose):**
      *   **Substantivalism:** The view that spacetime is a real entity with its own structure, independent of matter. The reliance on gyroscopes (sensitive to local spacetime geometry) fits naturally. The ICRF can be seen as identifying a *particular* substantival frame defined by the large-scale matter distribution.
      *   **Machian Relationism (Modified):** The view that inertial properties are *somehow* relationally determined by distant matter. The choice of the ICRF (distant matter) as the standard of non-rotation fits the spirit. However, the *success and necessity* of local gyroscopes, which work without *direct* reference to distant matter, shows the practice isn't committed to *strong* Machianism (where inertia *only* arises from relations). It fits better with a *weak* Machian view where distant matter *fixes* the inertial frame, but local inertial structure is then an objective feature of spacetime.
      *   **Geometrical View (Spacetime as a Field):** The view that GR's spacetime *is* the gravitational field. This is highly compatible, as both gyroscopes and light paths (used in VLBI for ICRF) are sensitive to this field's geometry.

  4.  **Resolving the Apparent Tension (1 vs 2):**
      *   **They Measure Different (But Related) Things:**
          *   **ICRF (1):** Defines a specific, *conventional, global coordinate system* chosen for its empirical stability and convenience. It's a *standard of rest*.
          *   **Gyroscopes (2):** Measure *local rotation relative to the local inertial frame* defined by spacetime geometry.
      *   **The Link:** In the context of GR, within an asymptotically flat universe (a good approximation locally), *the frame where the distant universe appears isotropic (ICRF) coincides with the frame where local gyroscopes show no rotation relative to infinity*. This is why (1) and (2) agree empirically. The ICRF isn't *just* a convenient marker; it's chosen *because* it empirically matches the frame defined by the large-scale geometry where local gyroscopes find their ultimate "rest" state. **The quasar frame is the accessible, empirically defined realization of the asymptotic inertial frame that the gyroscopes are sensitive to.**

  ### Addressing Your Wrinkles

  1.  **Frame Dragging:**
      *   **Effect:** Yes, spinning mass (like the Earth) drags local inertial frames (Lense-Thirring effect). Gravity Probe B measured this.
      *   **Practice:** This is treated as a *small, measurable correction* (like many other GR effects: Shapiro delay, gravitational redshift) to the dominant background inertial structure defined by the ICRF/distant universe.
      *   **Interpretation:** It does *not* make the practice secretly relational. It demonstrates that *local* mass-energy *perturbs* the local inertial structure. The background structure (aligned with the ICRF) is still primary. It fits naturally within the substantivalist or geometrical view where the metric field is influenced by matter. It weakens strong relationism by showing local effects are perturbations, not the sole source.

  2.  **The Made-Up Case (Rotating Shell Drift):**
      *   **Scenario:** VLBI (ICRF) and local ring lasers slowly drift apart, correlating with the motion of a massive, nearby rotating shell.
      *   **Who Decides "Non-Rotating"?** Geodesy/astronomy would almost certainly prioritize the **ICRF/quasar frame** as the standard of non-rotation.
      *   **Why?**
          *   **Stability/Universality:** The ICRF is defined globally and used for everything from Earth orientation to extragalactic astronomy and spacecraft navigation. It provides a single, consistent reference.
          *   **Asymptotic Flatness:** The ICRF approximates the asymptotic inertial frame of the universe. The shell is a *local* perturbation.
          *   **Operational Definition:** "Non-rotation" is *defined* by the ICRF.
      *   **What Would Geodesists Do?**
          *   They would **model the effect**. The ring laser drift relative to the ICRF would be attributed to a *gravitational effect* on the local inertial frames – precisely frame-dragging caused by the nearby rotating mass distribution.
          *   Earth Orientation Parameters (EOP) would *still* be defined relative to the ICRF.
          *   The ring laser data would be invaluable for *measuring* the strength and nature of this frame-dragging field caused by the shell. Its output wouldn't define "true non-rotation" but would report rotation relative to a locally dragged frame.
      *   **Local vs. Global Drift:** If the drift were *only* local (near the shell mass), it would powerfully confirm the interpretation as a local gravitational frame-dragging effect. If the drift were global (affecting the definition of the ICRF itself relative to *all* distant quasars in a coherent way), it would be a profound cosmological challenge requiring a major revision of fundamental assumptions (e.g., questioning the cosmological principle).

  ### Metaphysical Swaps & Underdetermination

  *   **Full Relationism:** If inertia *only* arose from relations to other matter, the ICRF choice might seem more fundamental. However, the *existence and consistent behavior* of local gyroscopes (working without direct matter reference) would become deeply mysterious. How do they "know" the relational state instantly? The practice relies heavily on the *local reality* of inertial effects measurable in a box.
  *   **Full Substantivalism:** This fits most smoothly. The ICRF identifies a preferred substantival frame (aligned with the large-scale matter distribution). Gyroscopes probe local substantival structure. Frame dragging is matter affecting local substantival structure.
  *   **Spacetime as a Field (Geometrical View):** This is arguably the closest to GR's essence and the practice. The metric field defines inertial structure. The ICRF fixes a coordinate system adapted to the large-scale, approximately homogeneous and isotropic solution of the field equations. Gyroscopes couple to the local metric. Frame dragging is the field being sourced by local mass-current.
  *   **Underdetermination?** **Yes, but limited.** The *raw operational procedures and measurements* are compatible with substantivalism, a weak Machian view (where distant matter sets the frame, but it becomes real), and the geometrical view. **However, strong Machian relationism (inertia solely from instantaneous relations) is strongly challenged by the operational success and necessity of local gyroscopes.** The practice presupposes a *local, real inertial structure* that gyroscopes access directly, which is most naturally explained by substantivalism or the geometrical view. The ICRF choice fits both views as a way to fix the *global coordinate system* aligned with the dominant large-scale structure.

  ### GR's Answer: Local, Not Global

  **This is crucial.** General Relativity fundamentally provides only *local* inertial frames. There is no unique, global "non-rotating frame" in a general curved spacetime. The ICRF works because:

  1.  **Asymptotic Flatness:** On cosmological scales, spacetime is approximately asymptotically flat. This allows the *definition* of an asymptotic inertial frame where the universe appears isotropic.
  2.  **Empirical Choice:** The ICRF is an *empirical realization* of this asymptotic frame using distant matter (quasars) as tracers. It's a *convention* based on what works stably and consistently across all applications.

  **Conclusion:** The practice presupposes that spacetime has **real, local inertial structure** accessible via gyroscopes. It defines the **standard of non-rotation operationally** by aligning with the **asymptotic inertial frame** empirically realized by the **large-scale, distant matter distribution** (ICRF). Frame dragging is a measurable perturbation to the local inertial structure, not a fundamental shift to relationism. Your professor overemphasizes the ICRF choice (fitting weak Mach), while your textbook overemphasizes the gyroscope (fitting substantivalism/geometrism). The core commitment is to **local inertial structure defined by the metric field**, with the ICRF providing the empirically stable, global coordinate system aligned with the asymptotic structure dominating that field. The practice is largely agnostic to the deeper metaphysics *as long as* it accommodates this local reality of inertia and the empirical success of the distant-matter reference frame.
