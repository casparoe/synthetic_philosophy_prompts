prompt: |-
  You are a philosopher of history and a social epistemologist, with a good grip on how historical records are produced, replicated, lost, and distorted. Please think this through carefully rather than quickly: before committing to anything, brainstorm four or five genuinely different candidate principles — including at least one you end up rejecting because it breaks against my verdicts — and only then argue for the one that survives. No reading lists, no citations, no named authorities: I want the principle and the argument that supports it, worked out from the cases themselves.

  Some context on where I'm coming from: I'm a software engineer with no formal philosophy training, and my partner works in archives and digital preservation, which is how this started. I have a bad habit of thinking about the past in infrastructure terms — who had write access to the record, which copies got replicated and which got garbage-collected, what survived because it was cheap to serialize — and after an argument about the slogan "history is written by the victors" (she says it's unfalsifiable and nearly useless, I think it gestures at something real but smuggles several different mechanisms under one phrase) I started sorting cases into what I privately call *erasure* (the losing side's records are destroyed and never copied), *capture* (the records survive but only inside the winner's formats, genres, and purposes), and *adoption* (the winners end up circulating the losers' own story). My tentative principle is something like: the version of an event that circulates is the one that is most useful and cheapest to transmit for whoever controls the copying, teaching, and commemorating infrastructure at the time — which is usually, but not always, the side that won the war.

  Here are my verdicts, going on gut and not on theory:

  1. Rome and Carthage: the city is destroyed, essentially no Carthaginian histories survive, and everything we have comes from Roman or Roman-aligned Greek writers. Verdict: victor's history, obviously — though I don't want that to mean "false," since we can still recover true facts from a hostile source.
  2. The Norman Conquest of England in 1066: Norman Latin sources dominate, but the English-language chronicle was still being copied and updated at a monastery for decades afterward, so some of the conquered side's grievances and perspective survive. The overall frame — castles, feudal tenure, a backward kingdom modernized — is the winners'. Verdict: victor's history, with leakage.
  3. The Spanish conquest of the Aztec capital: Spanish accounts dominate, but a Spanish friar compiled Nahua elders' accounts of the same events in their own words and those survived. Verdict: still victor's history, even though the losers' words physically survived, because we read them through the winners' categories. This bothers me, because it feels like only a difference of degree from case 2.
  4. The American South after 1865: the "Lost Cause" — the losers produced the account of the war that dominated national memory for generations, minimizing slavery and recasting defeat as heroic resistance against overwhelming odds. Verdict: not victor's history. The losers wrote it.
  5. The Eastern Front after 1945: the Western public's picture of the campaign was built substantially out of the postwar memoirs of German generals — the winners adopted the losers' account, partly because it was professionally usable and politically convenient in the new confrontation with the Soviet Union. Verdict: not victor's history, and I think it is a different mechanism from case 4: in 4 the winners stopped contesting the story; in 5 they actively picked it up and repeated it.
  6. When both sides' archives survive and are roughly equally rich — after the Soviet military archives were opened in the 1990s, the German-memoir version of the Eastern Front largely collapsed — I stop wanting to say "victor's history" and start wanting to say "the evidence base improved." Verdict: not victor's history.
  7. When the victors' own later generations open their own archives and overturn the heroic version their grandparents published, I also don't call it victor's history — but it isn't "the losers wrote it" either, and I don't have a word for it, which makes me think my three-way sorting is incomplete.

  What I want from you: test my tentative principle against these cases, repair it or replace it, and state the result precisely, clause by clause, telling me which case forces each clause to be there. In particular I want you to face the pair I can't reconcile: cases 4 and 5 are handled beautifully by a "usefulness to whoever controls distribution" principle, but case 1 seems to be pure availability — nothing was adopted because it was useful, the losers' version was simply destroyed, and no amount of usefulness talk explains that. So tell me honestly whether one clean principle can cover both, or whether I have to accept a disjunctive, ugly, two-mechanism account to keep all seven verdicts, and if so which verdict a simpler principle would force me to drop and what it would cost me. Then give me your principle's verdicts on three cases I haven't listed: a war that ends in a compromise where both sides keep their own schools and presses; an event with no winners at all, like a plague or an earthquake, where every surviving account comes from literate elites; and a case where the defeated side had the better bureaucracy and the victors end up running the country using the losers' paperwork. Finally, apply whatever you land on to the case I keep going back and forth on from my own industry: when a technology wins and its adopters then write the retrospective explanation of why it won ("it was technically superior"), after the competing systems have been abandoned and their advocates scattered — is that the same phenomenon, and should my verdict on it match my verdict on case 4?
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're a software engineer with an interest in history and epistemology, influenced by their partner's work in archives. Their approach is infrastructure-focused—thinking about access, replication, and preservation. They've developed a framework with erasure, capture, and adoption to explain historical narratives. Their tentative principle revolves around usefulness and cost for those controlling distribution infrastructure. They've provided seven cases with verdicts and want their principle tested, refined, and applied to new scenarios. The challenge is reconciling cases like Carthage (erasure) with the Lost Cause (adoption by losers) and Eastern Front (adoption by winners).

  First, I need to brainstorm candidate principles. The user's current principle emphasizes control and utility in transmission. But case 1 (Carthage) seems purely about destruction, not utility. If the records are gone, usefulness doesn't matter. So maybe availability is a separate factor. But the user wants a unified principle if possible. Let me consider alternatives.

  Candidate 1: Pure availability. The narrative that survives physically dominates. But this fails cases 4 and 5 where losers' narratives circulate despite winners controlling infrastructure. The Lost Cause persisted because it was useful to both sides during reconciliation, not just because it was available.

  Candidate 2: Utility to the powerful. Focuses on why certain narratives are promoted. This explains cases 4 and 5 well—Lost Cause served southern pride and northern reconciliation, German memoirs were useful for Cold War propaganda. But Carthage? The destruction wasn't about utility; it was about annihilation. Romans didn't preserve Carthaginian records because they wanted to erase them, not because it was useful for transmission. So this candidate breaks on case 1.

  Candidate 3: Multi-factor with availability and utility. Maybe narratives need both to survive: they must exist and then be useful to transmit. Carthage lacked availability. Lost Cause had both—available and useful later. Case 2 (Norman Conquest) had some English records available but not useful to Norman rulers, so limited circulation. Case 3 (Aztecs) had Nahua accounts preserved but not useful within Spanish frameworks, so captured. This seems promising but might be disjunctive.

  Candidate 4: Asymmetric vulnerability. Winners can erase or adopt losers' narratives based on their goals. Losers can only preserve narratives if winners allow it or if they retain infrastructure. This explains Carthage (total erasure) and Lost Cause (losers retained cultural institutions). But case 5 (German memoirs) involves winners actively adopting, which is different. Still, it shows asymmetry.

  Now, evaluating against all cases. Case 6 (Soviet archives) improves evidence base, moving beyond victor's history because both sources are available. Case 7 (later generations) is internal critique, not reliant on losers. The key conflict is case 1 vs. 4/5. A unified principle must handle both destruction and adoption.

  The user's infrastructure control is key. Destruction (case 1) is a form of control—preventing any copies. Utility applies post-survival. So the principle could be: The circulating narrative is the one that survives physically and is most useful to those controlling replication. Carthage: didn't survive, so utility irrelevant. Lost Cause: survived and was useful. Eastern Front: German narratives survived and were useful during Cold War. 

  But does that make availability a precondition? Then it's two-step: survival first, then transmission based on utility. But in Carthage, survival was prevented by winners. So control affects both destruction and transmission. The principle must encompass both: control allows winners to destroy or propagate based on their goals. 

  Refined principle: The dominant narrative coheres with the interests and accessible records of groups controlling preservation and transmission infrastructure. Availability is shaped by initial control (destroy or preserve), then transmission by utility. Cases 1, 2, 3 show winners controlling both. Cases 4 and 5: losers or winners control transmission later. Case 6: multiple groups control archives. 

  Testing on new cases. Compromise war: both control infrastructure, so dual narratives. Natural disaster: elites control records, their narrative dominates. Victors using losers' paperwork: bureaucratic capture, winners adopt administrative narratives but reframe politically. 

  Tech example: winning technology's narrative dominates due to control over industry discourse, similar to adoption (case 5) if losers' stories are repurposed, or erasure if alternatives forgotten. Matches case 4 if losers' narrative persists (like Linux vs. proprietary Unix).

  Final principle: Infrastructure control determines both survival and transmission. Availability is necessary but not sufficient; utility to controllers drives circulation. Carthage: destruction prevents survival. Lost Cause: survival plus utility to post-war controllers. This unifies the mechanisms under control of infrastructure.
answer: |-
  After carefully analyzing your cases and testing principles against them, I conclude that a **single, unified principle** can cover all verdicts by expanding your infrastructure model to address both *existence* and *circulation* of records. The key insight is that "control over infrastructure" determines both **physical survival** and **narrative dominance**, but through distinct mechanisms. Here's the principle, clause-by-clause:

  ### The Principle of Infrastructural Selection  
  **The dominant historical narrative of an event is the account that:**  
  1. **Survives physically** (i.e., avoids erasure/destruction), *and*  
  2. **Aligns with the functional or ideological interests** of the group(s) controlling the means of:  
     - Record preservation (archives, storage),  
     - Record replication (copying, publishing),  
     - Narrative dissemination (education, media, commemoration).  

  **Control over infrastructure shapes *both* clauses:**  
  - **Clause 1 (Survival)** is forced by Cases 1 (Carthage) and 6 (Soviet archives). Carthage shows physical destruction prevents circulation regardless of utility. Case 6 proves equal survival enables evidence-based correction.  
  - **Clause 2 (Circulation)** is forced by Cases 4 (Lost Cause) and 5 (German memoirs). The Lost Cause circulated because it served *both* Southern (identity) and Northern (reconciliation) interests post-1865. German memoirs circulated because they served Western Cold War interests.  
  - **"Functional or ideological interests"** resolves Case 3 (Aztecs): Nahua accounts survived physically (Clause 1) but didn't align with Spanish colonial ideology (Clause 2), leading to "capture."  

  ### Why Your Cases Are Reconciled  
  - **Case 1 (Carthage):** Roman control ensured Clause 1 failure (total erasure). No survival → no circulation.  
  - **Cases 4/5 (Lost Cause/German memoirs):** Clause 1 satisfied (records survived); Clause 2 satisfied (narrative served controllers' interests). *Difference:* In Case 4, losers *retained* cultural infrastructure (schools, publishers); in Case 5, winners *adopted* losers' narrative. Both obey the principle.  
  - **Case 7 (Self-correction):** Later generations control infrastructure. Their interests (e.g., academic credibility) favor revising heroic myths. Clause 2 shifts internally.  

  ### Verdicts on New Cases  
  | **Case**                          | **Application of Principle**                                                                 | **Verdict**                          |  
  |-----------------------------------|----------------------------------------------------------------------------------------------|--------------------------------------|  
  | **Compromise war** (e.g., 30 Years' War): Both sides keep schools/presses. | Both narratives survive (Clause 1). Each circulates where its controllers hold infrastructure (Clause 2). | **Dual narratives**; neither "victor's history." |  
  | **Natural disaster** (e.g., 1755 Lisbon earthquake): Accounts only from literate elites. | Elite records survive (Clause 1). Their perspective dominates as they control presses/education (Clause 2). | **Elite history**; no "victors" but controllers win. |  
  | **Victors adopt losers' bureaucracy** (e.g., Mongols using Chinese administration): | Losers' records survive (Clause 1). Victors circulate them for functionality (Clause 2), but reframe politically (e.g., "our mandate"). | **Capture with reframing**; like Case 3 but utilitarian. |  

  ### Your Technology Case  
  - **"Winning technology writes history"** (e.g., VHS vs. Betamax, TCP/IP vs. OSI):  
    - **Matches Case 5 (Adoption):** Winners control industry standards, education, documentation. They circulate narratives like "technical superiority" because it:  
      - Sells products (functional interest),  
      - Legitimizes their control (ideological interest).  
    - **But differs from Case 4:** Scattered advocates lack infrastructure to circulate counter-narratives (Clause 1 failure for losers).  
    - **Verdict:** **Victor's history via adoption** (like Case 5), *not* Case 4 (where losers *kept* infrastructure).  

  ### Why This Works  
  - **Elegance:** One principle with two dependent clauses. Survival is necessary but insufficient; circulation requires alignment with controllers' interests.  
  - **Solves your Carthage/Lost Cause tension:** Carthage never satisfied Clause 1. Lost Cause satisfied both clauses *because* losers retained infrastructure.  
  - **Upgrades your model:** "Infrastructure control" explains:  
    - *Erasure* (denying Clause 1),  
    - *Capture* (Clause 2 alignment via reframing),  
    - *Adoption* (Clause 2 alignment without reframing).  

  **Final note:** This principle treats "truth" as orthogonal. Better evidence (Case 6) or self-correction (Case 7) occurs when controllers' interests *align* with accuracy (e.g., academic integrity, legal accountability). Where interests conflict (e.g., myth-building), circulation diverges from evidence. Your infrastructure lens holds.
