answer: |-
  Here's your translation and residue report. I've kept to the requested structure and constraints.

  ---

  ### Translation to Database Metaphysics

  **Special Composition Question (SCQ) as Schema Design:**  
  *"For any set of non-overlapping rows (xs) in the `Simples` base table, when does a `CREATE MATERIALIZED VIEW y AS SELECT ... FROM xs` operation succeed?"*  

  **Nihilism:**  
  - **Translation:** Only the `Simples` base table exists. No views (materialized or virtual) are allowed. "Chair" is a `SELECT * FROM Simples WHERE arrangement = 'chairwise'`—a virtual view with no corresponding persisted entity.  
  - **Bends:** Simulates composition via queries, but denies any `y` row is inserted into an `Objects` table. Causal overdetermination is avoided: no `ON DELETE CASCADE` triggers fire for composite objects because none exist.  
  - **Breaks:** Can’t explain why we *materialize* some sets (e.g., a rock) but not others (a heap)—if all are just queries, why privilege simples?  

  **Universalism:**  
  - **Translation:** Automatic `MATERIALIZED VIEW` creation for *every* possible `UNION` of non-overlapping simples. `Objects` table has a row for every subset of `Simples` (including scattered objects like `EiffelTower ∪ MyLeftEar`).  
  - **Bends Cleanly:** Composition is a `CROSS JOIN` with a rowset cardinality filter. No vagueness: predicates are Boolean.  
  - **Breaks:** `Objects` table is massively redundant (e.g., the Eiffel Tower row duplicates work of its part-rows). Causal overdetermination = double-counting writes to overlapping rows.  

  **Organicist (van Inwagen):**  
  - **Translation:** `MATERIALIZED VIEW y` is created *only* if `xs` participate in a `LIFE` process. Implemented via an `INSTEAD OF INSERT` trigger on `Objects`: fires iff `EXISTS (SELECT 1 FROM xs JOIN LifeProcesses ON ...)`.  
  - **Bends:** "Life" is a hard-coded join predicate. The bee-swarm isn’t materialized; individual bees are.  
  - **Breaks:** `LifeProcesses` table requires a privileged status (why not `MACHINE_PROCESSES`?). Trigger logic feels arbitrary without a `LIFE` schema.  

  **Brutalism:**  
  - **Translation:** The `MATERIALIZED VIEW` creation rule is a bare `CHECK` constraint: `IF brute_condition(xs) THEN COMMIT`. No index, no foreign key—just a brute predicate.  
  - **Bends:** Avoids defining the condition (it’s a black-box function).  
  - **Breaks:** Violates 3NF: the rule is functionally dependent on nothing. Feels like a `COMMIT` without a `WHERE` clause.  

  **Argument from Vagueness (for Universalism/Nihilism):**  
  - **Translation:** Any non-universalist condition (e.g., `WHERE fastened_together = TRUE`) uses fuzzy predicates. This forces indeterminate `COMMIT` states (existence is `NULL` for borderline cases). Avoiding vagueness requires Boolean predicates only—hence universalism or nihilism.  
  - **Bends Cleanly:** Vagueness = non-atomic columns causing unstable rowsets. Problem of the Many = 10,000 near-identical candidate rows for "Table" due to `fastened_together` tolerance ±0.1mm.  

  ---

  ### Residue Report (The Unescapable Crack)

  **Your suspicion is correct.** The translation exposes the dispute as a pseudo-problem rooted in two untranslatable assumptions:  

  1. **The "Really One Thing" Fallacy:**  
     In database terms, whether a set of simples is "really one object" maps to a **materialization decision**: "Should we index this view for faster joins?" or "Will denormalizing reduce update anomalies?" This is a *pragmatic choice*, not an ontological discovery. Universalism materializes everything (expensive storage, cheap reads); nihilism materializes nothing (expensive runtime aggregation). Organicist materializes based on process-critical paths. **But in no case is there a "further fact" beyond schema optimization.**  

  2. **The Base Table Fetish:**  
     Metaphysics treats `Simples` as a discovered base table. But in your framework, `Simples` is *itself* a design choice. Gunk (no simples) = a database with no 1NF—only nested tables. Junk (non-objects) = phantom rows with no primary key. Both are valid schemas! Yet metaphysicians act like `Simples` is a `READ ONLY` system catalog.  

  **Where Translation Breaks:**  
  > *"Organicist: `EXISTS (SELECT 1 FROM xs JOIN LifeProcesses ON ...)`"*  
  This smuggles in `LifeProcesses` as a *base table*. But why? In a database, `LifeProcesses` could be a view over physics tables. The "privileged status" isn’t in the data—it’s imposed by the DBA.  

  **The Core Untranslatable Sentence:**  
  *"When do the xs **really** compose a y?"*  
  → Maps to: *"When should we `MATERIALIZE VIEW y`?"*  
  → Which reduces to: *"Does this improve performance/consistency for our workload?"*  

  **Conclusion:**  
  The debate collapses into engineering tradeoffs. Nihilism optimizes for write consistency; universalism for read simplicity; organicist for domain-specific integrity. Brutalism is a lazy schema. **There is no "composition fact" to discover—only constraints to enforce.** The residue is the illusion that reality has a base table. Your framework can’t state the SCQ without smuggling in a privileged schema, which is exactly what the metaphysicians are fighting over.

