prompt: |-
  Hey — I'm teaching a metaphysics seminar on material objects this term and I want to try a bit of a stunt on them, so I need you to do something for me first. Before I defected to philosophy I spent about a decade doing data modelling and DBA work (mostly Postgres, a fair bit of warehouse stuff, endless arguments about schemas), and I still think natively in base tables and rows, primary and foreign keys, joins and join predicates, virtual views vs. materialized ones, updatable views and INSTEAD OF triggers, cascading deletes and referential integrity, transactions and commit, normalization and 1NF, NULLs and three-valued logic. That's the vocabulary I want the translation in, and assume I'm fluent — don't explain what a left join is or stop to define 1NF.

  The job: take the special composition question — van Inwagen's framing in Material Beings, roughly "for any non-overlapping xs, when is there a y such that the xs compose y?" — and restate the main answers in that vocabulary, one at a time, as faithfully as you can: nihilism (only simples; where it seems there's a chair there are just simples arranged chairwise, and nothing is ever really composed), universalism (any xs at all compose something, including the fusion of the Eiffel Tower and my left ear), van Inwagen's own organicist restriction (composition happens exactly when the xs are caught up in a life — the swarm of bees isn't an object, the bee is), the brutalist answer (there's a substantive necessary condition and it's just a brute fact that that's the condition), and, if there's room, the argument from vagueness that's supposed to shove you toward one of the extreme answers by pointing out that any interesting condition like "fastened together" or "acting jointly" is vague and would make existence itself indeterminate. For each: what translates cleanly, what has to be bent to fit, what can't be said at all. Some things I want you to specifically graple with: is composition more like defining a view or more like materializing one, and does that distinction do any real work or does it collapse under pressure? What plays the role of "the same object under two descriptions" — base table and view as one thing or two, aliasing, or something else? Does the causal overdetermination worry (if the table exists, its causal work seems to double up with the work of its parts, so by parsimony there is no table) have an analogue in triggers firing twice or in double-counting a single write, and does seeing it that way make the argument more or less convincing? Where do gunk and junk land — no atomic level to bottom out at, i.e. no possible base table / no reachable first normal form? And where does the problem of the many go — many near-identical candidate referents for "the table" as an unstable row set under a vague predicate?

  Then give me the residue report, which is the bit I actually care about, and be honest rather than diplomatic. My suspicion — argue me out of it if you can — is that the whole dispute runs on a notion of "really one thing" that my vocabulary has no slot for: in a database, whether a view "really exists" as an entity is a modelling decision, settled by update anomalies, query patterns and performance, and nobody thinks there's a further fact of the matter beyond that. If so the translation should either (a) make the metaphysicians look like they're disputing nothing, or (b) reveal that the target framework can't so much as state their question. Tell me which, and point to the exact sentence where the translation breaks. Also flag anywhere you were tempted to smuggle in a database assumption and pass it off as translation — e.g. that entities must be individuated by keys, that everything is interest-relative, or that the base level is fixed by convention rather than discovered. Don't give me citations or a reading list, I know that literature fine; I want your own reconstruction. Keep it tight enough to hand out in seminar — under about 900 words.
