  ### Decision Tree: How Do Numbers Count in Scanlonian Contractualism?
  **Root assumption**: Morality is about what no one could reasonably reject, and we compare complaints person by person.

  1. **Can many small complaints *together* override one larger complaint?**  
     *Case: Spend the travel fund on Alice (saves her from missing a career-critical conference) or on 20 others (each gets a small benefit, e.g., $50 for conference snacks/networking, with total benefit > Alice's). Ignore iteration for now.*  
