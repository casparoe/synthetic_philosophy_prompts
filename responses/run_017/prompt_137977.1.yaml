     - **Yes** → Go to Q5 (aggregation views).  

  2. **If the strongest complaints in two options are equal, do numbers break the tie?**  
     *Case: Option A helps one person avoid a major career setback. Option B helps one different person avoid the same setback. No other differences (e.g., same people affected, separate complaints).*  
     - **No** → **Leaf 1: Strict anti-aggregation** (e.g., early Taurek).  
       - *Description*: Only the strongest individual complaint matters; numbers never count. Ties are broken arbitrarily (e.g., coin flip), not by counting people.  
