     *Case: Same as Q1, but focus on the small benefits ($50/person). Are these complaints too tiny to register morally on their own? (e.g., "No one could reasonably reject a principle over $50!"). Assume separate complaints.*  
     - **Yes** → **Leaf 5: Threshold-then-aggregate** (e.g., moderated Scanlonian views).  
