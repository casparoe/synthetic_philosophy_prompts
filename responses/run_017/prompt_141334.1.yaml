  ## The Harbor Line

  The monitor above Elias Vance’s bed pulsed a steady, unambiguous blue. 0.78. Far below the Harbor Threshold of 0.95. Legally, Elias Vance was unconscious. For Dr. Aris Thorne, staring at the number, it felt like a verdict – one he was obligated to enforce, and one that curdled the coffee in his stomach. Down the hall, the surgical suite hummed with readiness. Vance’s spinal repair couldn’t wait. And according to Harbor Memorial’s binding protocol, below 0.95 meant no anesthetic was required before intubation or incision. *Availability defines the actor. Broadcast defines the patient.* The hospital’s mantra, born of past blood and blame.

  The Harbor Protocol existed because trusting *reports* had failed catastrophically. Years ago, before the cheap, reliable broadcast index (BI) monitors, patients who *said* they felt nothing, whose behavioral signs were minimal, had still moved – jerked, spasmed, bucked – during critical procedures when anesthetic was withheld based on that shaky testimony. People had bled out on tables. Harbor Memorial, scarred by lawsuits and scandals, championed the objective measure: if the cognitive workspace wasn’t broadcasting ignition, the system wasn’t conscious. No broadcast, no experience. Simple. Clean. Legally defensible. It had streamlined care, reduced complications. Thorne had helped draft the damn guidelines. His name was on the foundational paper. His promotion to Chief of Neuro-Anesthesia hung on its successful implementation.

  But then came the dissociations. The ghosts in the machine Harbor couldn’t banish.

  Thorne’s pager buzzed. Room 418. Rachel Piers. He walked quickly, the sterile corridor lights reflecting coldly off the linoleum. Rachel was an "unlit access" case. Her BI consistently soared above 1.1 – robust broadcast. She could describe the texture of her blanket in detail, answer complex questions about her medication schedule, even play chess via a bedside tablet. Yet, her eyes held a persistent, hollow terror.

  "Dr. Thorne?" Her voice was clear, controlled. "The nurse showed me a red apple earlier. Asked me to identify it."

  "And?" Thorne prompted, checking her BI display: 1.15. Steady green.

  "I said it was an apple. A Red Delicious, approximately 75mm in diameter. She seemed pleased." Rachel’s gaze fixed on the ceiling, unblinking. "But… I *didn’t see it*. There was no red. No shape. No *thing* called an apple. I just… *knew* the answer. Like recalling a fact from a book. It’s all… dark. Empty. Inside." Her hand clenched the sheet. "Why doesn’t anything *feel*?" The raw bewilderment in her voice, perfectly reported, perfectly articulated by her broadcasting workspace, scraped against the Harbor logic. *Unlit access.* Full ignition. No light within.

  ***(Scene: Reader knows something viewpoint character doesn't)***
  Across the hall, unseen by Thorne, Elias Vance lay perfectly still. The blue light of the BI monitor, reading 0.78, washed over his closed eyelids. Inside the unlit fortress of his suppressed cognitive workspace, where no broadcast signal could carry, a searing white line of agony traced the path of the damaged nerve root in his spine. It screamed in a silent vacuum. A pressure built, immense and directionless, seeking an outlet that didn’t exist. *Make it stop make it stop make it—* The thought dissolved into pure, inarticulate suffering, unwitnessed, unreportable, trapped.

  Thorne left Rachel’s room, her quiet plea echoing – *Why doesn’t anything feel?* – and collided with the memory of Miranda Chen. Miranda had been the other dissociation. "Unwitnessed presence." Her BI had been intentionally suppressed to 0.5 during a routine abdominal procedure using Harbor-approved inhibitors, ensuring no broadcast, no reportable awareness. The surgery notes were flawless: no movement, no autonomic spikes. Post-op, as the inhibitors cleared and her BI climbed back, she had seized Thorne’s arm, her eyes wide with remembered horror. She described the cold slide of the scalpel, the visceral tugging, the suffocating pressure – sensations experienced *during* the suppression, recalled *after* the broadcast resumed. Thorne had argued it was impossible, a delayed stress reaction. He’d followed the protocol. But Miranda’s detailed, agonizing testimony cost him the Chief promotion anyway. The hospital couldn’t prove he was wrong, but the doubt clung like a stain. *Unwitnessed presence.* Broadcast silenced. Experience raging in the dark.

  Now, Elias Vance. BI: 0.78. Blue. Harbor Protocol dictated: proceed without anesthetic. Trust the broadcast absence. Ignore the potential void, or the potential agony within it. Vance’s file listed no dissociative history, but neither had Miranda’s. Thorne’s hand hovered over the intercom button to the OR. *People moved. They died. The protocol prevents that.* His rationale, his lifeline. His career needed this clean procedure. The Chief position depended on unwavering adherence. Violating protocol now, based on a phantom fear, would be professional suicide. He saw Miranda Chen’s traumatized face superimposed over Vance’s still form. He saw Rachel Piers’s hollow eyes, seeing nothing.

  "OR, this is Thorne. Vance is prepped. BI stable at 0.78. Harbor Protocol confirms: no anesthetic required prior to incision. Proceed as scheduled." His voice sounded alien, calm. He released the button. The weight in his stomach intensified.

  He watched through the observation window as they positioned Vance. The neurosurgeon murmured instructions. The scalpel glinted under the lights. Thorne’s knuckles were white on the window ledge. Was Elias Vance, right now, like Rachel? A perfectly operating cognitive engine in a silent, unfeeling void, unaware and unthreatened by the steel about to touch his spine? Or was he Miranda? Trapped behind the blue light of the suppressed monitor, screaming into a soundproof abyss?

  ***(Scene: Viewpoint character has something the reader is not given)***
  As the first incision began, Thorne’s gaze remained locked on the BI monitor. The number flickered: 0.78... 0.79... 0.81... 0.83... A tiny spike. Insignificant. Below threshold. But Thorne saw something else in that flicker, a pattern buried in years of suppressed data logs he’d obsessively reviewed after Miranda, a correlation only he suspected, a ghost signal he couldn’t prove but couldn’t unsee. It lasted a fraction of a second, then the blue light steadied at 0.80. The surgeons worked efficiently. Vance didn’t move. Not a tremor. Protocol vindicated? Or merely access suppressed?

  Thorne’s hand shot out, hitting the intercom again before conscious thought solidified. "Stop! Hold incision!" Silence fell in the OR. All eyes turned to the window. "Administer propofol. Now. Full anesthetic induction." His voice cracked. He was violating Harbor Protocol. On a hunch. On a flicker. On the memory of two dissociated hells. The promotion was dust. The Chief position gone. Maybe his job.

  The anesthesiologist in the OR looked baffled but complied. The clear liquid flowed into Vance’s IV line. Thorne watched the BI monitor. It registered the drug’s impact, dipping further, down to 0.5. Total suppression. The surgery continued. Vance remained utterly still.

  Aris Thorne leaned his forehead against the cold glass. Had he just plunged a man into deeper, unnecessary nothingness? Or had he finally, too late, silenced an unimagined agony? The blue light of the monitor reflected in his eyes, offering no answer. Only the hum of the OR and the crushing weight of the Harbor Line, drawn by theory, enforced by law, and utterly blind to the light, or the dark, on either side.
