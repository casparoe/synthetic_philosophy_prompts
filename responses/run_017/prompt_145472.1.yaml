prompt: |-
  so I'm two thirds into a novel and I've written myself into a corner that turns out to be a philosophy problem, so I need the spec before I write the last third.

  Two threads. (1) The republic in the book — which I've been makeing up as I go — ratified a Founding Charter about forty years before the action starts. The Charter contains what everybody in the book calls the Durability Clause: the founding generation, who had just come out of a long civil war and didn't trust themselves, wrote in that certain provisions can't be repealed except by a two-thirds vote followed by a nine-year wait, during which the repeal has to be re-passed twice. Now a clear majority wants out, they've done the first votes, and they're five years into the wait. (2) A character, Mira, has a recurrent bipolar illness; years earlier, between episodes, she signed a standing instruction with her clinic saying that if she ever refuses her medication she's to be treated anyway, and that her refusal at the time isn't to count as a refusal. She's refusing now, she says she's never felt better, the clinicians think she's in an episode, and the clinic is petitioning to treat her against her will.

  What I want isn't the answer to either case. It's the standard. Before I let my characters argue, I want the requirements list: what any account of when a precommitment legitimately binds the person — or the polity — that made it has to get right, with the case behind each requirement, including the cases I already feel sure about and the ones I can't decide. The ones I know I need handled: Ulysses and the ropes versus Ulysses and the contract (is tying yourself up different from authorizing someone else to tie you?); the person who changes her mind because she learned something, or because she converted, or because someone paid her; the founder's dead hand; the people born later who never voted for the thing; the precommitment that was itself made under pressure; the case where the later self has strictly better information than the earlier one had.

  Distinctions I need it to respect rather than collapse: binding your options versus binding your will versus binding what counts as a reason for you; waiving a right versus handing a power to someone else; "I wasn't competent then" versus "I'm not competent now"; and a precommitment that fails because it was never really mine versus one that fails because it was never really about me.

  Three devices my characters keep proposing, and I need to know whether they're real answers or just ways of making the problem prettier — say which, and why: (a) the ratchet, where a clause can be amended only in the direction of making itself harder to amend, so each generation binds the next one tighter than it was bound; (b) the two-key release, where the precommitment can be lifted only by the present self together with someone who knew the earlier self and is charged with speaking for her; (c) the reversion clause, where the whole thing lapses unless it's reaffirmed every few years — and tell me whether something that has to be re-signed is a precommitment at all or just a habit.

  Then: which requirements are non-negotiable and which are only what one camp happens to want; which pair I should stop hoping to satisfy at the same time; and which single requirement knocks out the most of the usual moves — the "the later self is just a different self with different preferences" move, the "true self / second-order endorsement" move, and the "a constitution isn't a contract, it's a framework that has to stay put for there to be anyone to repeal it" move. A line each on those three is plenty, the criteria are the part I actually need.

  The standard I'm after is one good enough to tell me whether Mira is being kept faith with or being governed by a stranger who happens to share her name, and whether the majority in my republic is being asked to wait or being told to obey its grandparents.

  Also — say how confident you are in what you're claiming, and single out the one thing you're least sure of. I'd rather know where the argument is thin before I put it in somebody's mouth.
reasoning: |-
  Okay, let's tackle this fascinating philosophical challenge. The user is deep into writing a novel and has hit a complex philosophical problem involving precommitments in both political and personal contexts. They need a framework to evaluate when such precommitments legitimately bind later selves or generations. 

  First, I need to understand the core dilemma. The political thread involves a constitutional "Durability Clause" requiring a lengthy process to repeal certain provisions, while the personal thread involves a bipolar character who pre-authorized forced medication but now refuses it. The user isn't asking for solutions but for evaluation criteria - the essential requirements any account of binding precommitments must satisfy.

  Hmm, the user has clearly done significant groundwork. They've identified key tensions: Ulysses self-binding vs. delegation, changed minds due to new information or values, intergenerational legitimacy, coercive origins of commitments, and information asymmetry between past and present selves. They also want important distinctions preserved, like types of binding (options/will/reasons) and competence claims.

  Three specific mechanisms need analysis: constitutional ratchets, two-key releases, and reversion clauses. The user wants to know if these solve problems or just mask them. Importantly, they need to identify non-negotiable requirements versus negotiable ones, incompatible goals, and which requirement undermines common philosophical moves about identity and constitutions.

  The challenge is balancing comprehensiveness with precision. Every requirement must be justified by concrete cases they've provided, like Mira's medication refusal or the republic's repeal effort. The framework must handle both individual and collective cases without conflating them.

  I notice the user emphasizes practical application - this isn't abstract philosophy but tool-building for their novel's climax. The characters will debate using these criteria, so the standards must generate genuine dramatic tension. The "least confident" disclaimer at the end is crucial too - they need transparency about where arguments might falter in-universe.

  For structure, I'll start with fundamental requirements derived from their cases, group them by theme (validity, persistence, override conditions), then test the three mechanisms against these. The analysis of common philosophical moves should expose fault lines in the requirements themselves. Confidence ratings will help them assign positions to characters of varying certainty.

  The trickiest part will be Requirement 7 (information asymmetry) - it potentially undermines all precommitments if later selves always "know better." And I'm least sure about Requirement 9 (intergenerational democracy), as it risks conflating individual and collective cases. But naming this uncertainty serves their purpose better than false confidence.
answer: |-
  Here's a specification for precommitment legitimacy, derived from your cases and designed for your novel's arguments. It outlines **12 Core Requirements**, identifies **Non-Negotiables vs. Negotiable Tensions**, analyzes your **Three Devices**, critiques **Common Moves**, and assesses **Confidence**.

  **Core Requirements for Legitimate Precommitment (The "Must-Haves"):**

  1.  **Authentic Origin:** The commitment must reflect the *actual* considered judgment of the committing self/polity at the time, free from coercion, fundamental deception, or incapacity. *(Case: Precommitment made under duress in the civil war vs. Mira's considered directive during stability.)*
  2.  **Identity Continuity:** There must be a sufficiently continuous "self" or "polity" between the committer and the bound entity. Significant rupture (death, revolution, fundamental conversion) breaks the chain. *(Case: Founder's "dead hand" vs. a polity evolving over 40 years; Mira's manic self vs. her stable self.)*
  3.  **Purpose Transparency:** The *reason* behind the precommitment must be clear and applicable to the situation where enforcement is sought. *(Case: Preventing impulsive repeal during instability vs. preventing Mira's self-harm during mania.)*
  4.  **Means Proportionality:** The mechanism of precommitment must be reasonably tailored to achieving its stated purpose, not excessively burdensome or manipulative. *(Case: Is a 9-year wait proportional to preventing rash repeal? Is forced medication the *only* way to protect Mira's core values?)*
  5.  **Core Value Alignment (Initial):** The commitment must aim to protect or promote values the committing self/polity genuinely held *at the time of commitment*. *(Case: Founding generation valuing stability/peace over immediate majoritarianism; Mira valuing health/life/rationality over euphoric mania.)*
  6.  **Core Value Alignment (Enforcement):** Enforcing the commitment *now* must demonstrably serve the *core values* of the *original committer*, not necessarily the transient preferences of the bound entity. *(Case: Does upholding the Charter *now* serve the Founders' core goal of stability, or just frustrate the majority? Does treating Mira *now* serve her core value of health/rationality, or just override her current desire?)*
  7.  **Epistemic Asymmetry Addressed:** The framework must account for situations where the *later* self/polity possesses *objectively better information* relevant to the core values/purpose than the earlier one did. *(Case: New evidence the repealed provision causes harm the Founders couldn't foresee; Mira gaining new insights into her condition or treatment side effects.)*
  8.  **Voidability for Fundamental Change:** The commitment becomes voidable if the bound self/polity undergoes a *fundamental change in identity or core values* that renders the commitment's purpose meaningless or antithetical. *(Case: Polity's core values shifting from stability to radical self-determination; Mira experiencing a genuine, lasting philosophical shift rejecting medication as a value.)*
  9.  **Democratic Legitimacy (Collective):** For polities, mechanisms must exist for the *current* citizenry to ultimately express its sovereign will, even if procedurally constrained. Precommitments cannot create permanent, unalterable bondage. *(Case: The Durability Clause *allows* repeal, just slowly. Is this sufficient legitimacy?)*
  10. **Agent Distinction:** Binding *oneself* (Ulysses ropes) differs from binding oneself *by empowering another* (Ulysses contract with crew). The latter requires stricter scrutiny of the agent's mandate and potential for abuse/conflict of interest. *(Case: Mira binding *her future self* vs. Mira authorizing *the clinic* to override her. The clinic is now an agent with power.)*
  11. **Competence Distinction:** "I wasn't competent *then*" (invalidating the origin) must be separable from "I'm not competent *now*" (justifying enforcement *despite* current refusal). *(Case: Was Mira competent when signing? Is she competent now refusing? These are distinct questions.)*
  12. **Ownership vs. Scope Distinction:** "The commitment wasn't *really mine*" (e.g., coerced signature) invalidates differently than "The commitment wasn't *really about the future me*" (e.g., applied to a situation fundamentally outside its intended scope). *(Case: Mira signed under duress (Ownership) vs. Her directive covered mania-induced refusal, not refusal based on a new, stable philosophical belief (Scope).)*

  **Analyzing Your Three Devices:**

  *   **(a) The Ratchet (Harder-to-Amend Amendments):**
      *   **Verdict:** **Prettying the Problem, Not Solving.** It exacerbates the "dead hand" issue (Req 8 & 9). It assumes each generation values increased rigidity over flexibility, violating Req 4 (Proportionality) and Req 6 (serving core values *now*). It makes fundamental change (Req 8) nearly impossible, undermining democratic legitimacy (Req 9).
  *   **(b) Two-Key Release (Present Self + Past Self's Proxy):**
      *   **Verdict:** **Potentially Valid Answer, But Fraught.** Addresses Req 2 (Identity Continuity) and Req 6 (Core Value Alignment - ensuring enforcement aligns with original intent). *However:* Raises huge issues about the proxy's legitimacy (Who chooses? Bias? Req 1 & 10). Risks ossifying the *past* interpretation (Req 7 - new info). Can become paternalistic (for Mira) or oligarchic (for the republic). Confidence in this is **low**; it often just shifts the power locus.
  *   **(c) Reversion Clause (Lapses Unless Reaffirmed):**
      *   **Verdict:** **Negates Precommitment, Creates Habit.** This fundamentally transforms the act. It's not binding a *future* resistant self; it's requiring *present* affirmation. It avoids most precommitment dilemmas (Req 1-12 largely don't apply) because the bound self constantly re-chooses. It's a procedural habit, not a precommitment against future weakness. Good for ensuring ongoing consent (Req 9), bad for protecting against predictable future incapacity/impulse (the core Ulysses problem).

  **Non-Negotiables vs. Negotiable Tensions:**

  *   **Non-Negotiables:** Req 1 (Authentic Origin), Req 3 (Purpose Transparency - for evaluation), Req 5 (Core Value Alignment - Initial), Req 10 (Agent Distinction), Req 11 (Competence Distinction), Req 12 (Ownership vs. Scope). These are foundational to the *concept* of a legitimate commitment.
  *   **Negotiable Tensions (Where camps clash):**
      *   Req 2 (Identity Continuity) vs. Req 8 (Fundamental Change) - How much change breaks the chain?
      *   Req 4 (Proportionality) vs. Req 6 (Core Value Alignment - Enforcement) - How much burden is justified to serve the original core value?
      *   Req 6 (Core Value Alignment - Enforcement) vs. Req 7 (Epistemic Asymmetry) - When does new information trump original intent regarding core values?
      *   Req 9 (Democratic Legitimacy) vs. Req 6 (Core Value Alignment - Enforcement) - How much current will can override past commitments designed to protect core values? (The core tension of your Durability Clause).

  **The Requirement That Knocks Out Common Moves:**

  *   **Req 7 (Epistemic Asymmetry)** is the wrecking ball.
      *   *Later Self = Different Self:* This move often *relies* on new information/experience justifying the change. Req 7 forces asking: *Is* this information objectively better *and* relevant to the *core values* the precommitment protected? If yes, it weakens the commitment's justification for enforcement.
      *   *True Self / Second-Order Endorsement:* This move assumes the later "disordered" self isn't the "true" self. Req 7 asks: What if the "disordered" self has *valid insight* (better info) the "stable" self lacked? What if the "stable" self was *wrong* about the best way to achieve core values?
      *   *Constitution as Framework, Not Contract:* This move tries to elevate constitutions beyond critique. Req 7 grounds it: Even frameworks need mechanisms to incorporate *new, better understanding* of how the world works or what truly serves the polity's enduring goals (its core values). Absolute immutability is vulnerable to epistemic shifts.

  **Applying the Standard to Your Cases:**

  *   **Mira:** Is enforcement (1) serving her *original core value* (health/rationality)? (Likely Yes). (2) Based on *better information* than she has now? (Clinicians say yes, she says no - key conflict). (3) Is her *current* refusal based on mania (incompetence now) or a fundamental value shift (Req 8)? (Key question). (4) Is the clinic acting *as her agent* (Req 10) or imposing external will? The standard highlights the conflict around Req 7 and Req 11/8, making her case agonizingly ambiguous – **faith kept *if* mania clouds judgment; governed by a stranger *if* her value shift is authentic or she has better info.**
  *   **The Republic:** Does upholding the wait (1) serve the Founders' *core value* (stability) *and* is that value still core to the polity? (Debatable). (2) Is the 9-year wait *proportional* (Req 4) to preventing rash repeal? (Debatable). (3) Does the *current majority* have *better information* (Req 7) justifying repeal now? (Likely central to their argument). (4) Does the mechanism allow *ultimate* democratic expression (Req 9)? (Yes, but slowly). The standard suggests they are being **asked to wait** *if* the delay serves a still-relevant stability purpose proportional to the burden; **told to obey** *if* the delay is disproportionate, stability isn't the core value anymore, or the current majority's information/reasons fundamentally negate the original purpose. The ambiguity is deliberate and political.

  **Confidence & Uncertainty:**

  *   **Overall Confidence: High-Moderate.** The requirements are derived from well-established debates in philosophy of law (constitutions), political theory (sovereignty, generations), and ethics (autonomy, paternalism, identity). They map clearly onto your cases.
  *   **Least Confident Element: Req 7 (Epistemic Asymmetry) and its interaction with Req 6 (Core Value Alignment - Enforcement).** How do we *objectively* judge if information is "better" and relevant to *core values* (not just preferences)? Who decides? (Clinicians? Philosophers? The current majority? Historians?). This is inherently contentious and context-dependent. It's the rock upon which many seemingly solid precommitment justifications founder. **Put this uncertainty in a skeptic's mouth:** "How can my grandparents, decades ago, locked in their civil war trauma, possibly know better than *us*, living now, experiencing the *actual consequences*, what serves our society's true good? Their 'core value' of stability might be our core value of stagnation! Your Durability Clause doesn't bind us, it blinds us!"

  This spec provides the philosophical scaffolding. Your characters can now argue fiercely over which requirements are met or violated in each case, how to weigh them, and where the uncertainties lie, making your novel's climax deeply resonant. Good luck!
