answer: |-
  **Priority credit should shift from first proposers to those enabling practical uptake for practice-contingent discoveries.** Our current systems reward being first to state a proposition, but for discoveries where the core content was inevitable but its usable form contingent, the transformative historical work lies in crafting the *machinery of practice*—notation, techniques, canonical applications—that allows the discovery to propagate and function within science. This machinery, not the bare proposition, determines a discovery’s integration into the scientific corpus. Rewarding first publication ignores this, arbitrarily privileging the proposer who happened to crystallize the zeitgeist first, while neglecting the often distinct agents whose formulations made the result *operable*.

  Consider Leibniz versus Newton: while both reached the calculus’s core principles (content-inevitable), Leibniz’s notation (d/dx, ∫) and algorithmic rules were demonstrably superior for widespread application. They became the lingua franca, enabling rapid advances in continental physics. Newton’s fluxions, though temporally prior, lacked this transmissible utility. Our eponymous "Newton-Leibniz calculus" misleadingly equates their credit, yet Leibniz’s *practice* did the essential work of making the discovery live within science. Similarly, while Darwin and Wallace grasped natural selection, Darwin’s decades-long synthesis of evidence, metaphors (tree of life), and problem-solving scope crafted the usable framework that defined evolutionary biology. Wallace’s paper, though simultaneous on content, lacked this scaffolding for broad scientific practice. Priority-based credit obscures this asymmetry in practical contribution.

  Redistribution thus demands recognizing:
  1.  **The Notation-Builders & Systematizers:** Those whose formulations (like Leibniz’s) proved essential for uptake.
  2.  **The "Losers" with Superior Frameworks:** Runners-up whose versions, though later or less noticed initially, offered better practical tools.
  3.  **The Expositors & Integrators:** Those who refine, generalize, and embed the discovery into working science.

  **Objection 1 (Hindsight Problem):** While the *ultimate* historical impact of a practice is clear only later, the *functional superiority* of a particular formulation for enabling work is often discernible contemporaneously. Adoption patterns emerge rapidly: Leibniz’s notation was quickly preferred by continental mathematicians; Darwin’s structure was immediately leveraged by allies like Huxley for specific debates. Credit administration *can* track real-time utility. We already award credit for "influence" (via citations), pedagogical impact, or tool adoption—metrics reflecting practical uptake. Funding bodies and prizes *could* explicitly prioritize work demonstrably enabling new research or solving recognized implementation bottlenecks, even if the core idea wasn't novel.

  **Objection 2 (Disaggregation Problem):** A practice-contingent discovery *is* a single epistemic achievement—solving a specific scientific problem—but realized through distinct, often sequential, contributions: proposition *and* practice-machinery. Our current system implicitly recognizes this unity by awarding singular credit (e.g., "calculus"), but misattributes it solely to the first proposer. Redistribution acknowledges the unity of the discovery-event while correctly parsing the distinct contributions within it. It doesn’t create multiple "discoveries"; it refines the credit assignment for the *components* essential to the discovery’s *scientific success*. We already do this implicitly (e.g., crediting both Maxwell and Hertz for electromagnetism’s realization). Formalizing this for practice-contingent cases ensures credit aligns with enabling scientific progress, not just temporal precedence.
