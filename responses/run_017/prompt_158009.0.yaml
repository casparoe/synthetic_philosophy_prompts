prompt: |-
  i'm writing the theory-of-skill section for a curriculum proposal at my college — we're starting a practical-skills strand (knot work, wilderness first aid, that sort of thing) and the committee wants to know what we think we're actually certifying when we sign someone off. Someone suggested I write down my real position on knowing how vs knowing that first, so here it is. Please be honest about whether it holds together:

  1. Knowing how is genuine knowledge, not just a dressed-up way of talking about abilities or reliable dispositions. A fluent speaker of a language knows something a phrasebook doesn't, and that difference isn't merely a difference in behaviour.

  2. Knows how is standard-relative: you can know how to tie a bowline well enough to rig a dinghy without knowing how to tie one well enough to pass a rescue-knot test, and there's no single cutoff where the knowledge starts. Knowing that p has nothing comparable.

  3. You can acquire knowledge-how in one shot, from testimony or a demonstration, with no practice. If a trainee watches the video once and immediately ties it correctly, she knows how to tie that knot. That's why I want our written-plus-video module to count as certification even for people who have never tied one.

  4. Knowledge-how outlives the ability. The pianist with both arms in casts still knows how to play the piece, and my instructors say the same about a surgeon who has temporarily lost fine motor control after a hand injury.

  5. Knowledge is factive — no knowing that p unless p is true — but knowing how isn't the sort of thing that can be correct or incorrect, so factivity just doesn't get a grip on it.

  6. Knowing how rules out luck. Someone who gets it right by accident, or who couldn't tell a bowline from a granny knot, doesn't know how, whatever the outcome was.

  7. Lots of non-human animals and pre-verbal kids know how to do things — grasp, track a scent, walk — even though they have no propositional attitudes about ways of doing those things.

  I can't tell whether any of this is internally consistent and I'd rather find out now than in front of the committee. Go through the pairs and tell me which are genuinely in tension and which only look like it. Rank the real ones by how bad they are, and for each say what would have to give, what that would cost me elsewhere on the list, and what the cheapest fix is. If there's a single revision that cleans up more than one of them, tell me which. Also flag anything that looks fine to me but is quietly doing real work — especially if it's load-bearing for the certification policy in 3.
reasoning: |-
  Okay, the user is working on a curriculum proposal for a practical-skills strand at their college, and they need to solidify the theory behind certifying skills. They've listed seven points about "knowing how" versus "knowing that" and want me to check for internal consistency. They’re especially concerned about tensions between their points because they’ll present this to a committee. 

  First, I need to unpack each of their claims. Point 1 argues that knowing-how is genuine knowledge, not just behavior. Point 2 says it's standard-relative—no universal cutoff. Point 3 claims you can gain know-how instantly from testimony. Point 4 says know-how outlives ability. Point 5 denies factivity for know-how. Point 6 insists it rules out luck. Point 7 extends it to non-humans without propositional attitudes.

  Hmm, the big tension jumps out between Points 3 and 6. If know-how can be acquired instantly (3), how does it avoid being lucky? A trainee might succeed once by accident after watching a video. But Point 6 says luck excludes know-how. That’s a direct clash—it’s the worst problem because it undermines their certification policy (written/video modules without practice). 

  Point 5’s anti-factivity claim also conflicts with Point 6. If know-how isn’t factive, why does luck matter? But Point 6 relies on a correctness condition (no luck implies there’s a "right" way). So Point 5 might need tweaking—perhaps know-how has success conditions even if not truth conditions. 

  Point 7 (animals/kids having know-how without propositions) supports the non-propositional nature in Point 1, but it strains Point 3. If a dog "knows how" to fetch without testimony, how does instant testimony-based learning in humans fit? It’s not a direct conflict, but it highlights that Point 3 might overreach—maybe minimal practice is needed to convert demonstration into real know-how. 

  The user’s deepest need seems to be defending their certification policy (Point 3), but they also want philosophical rigor. The cheapest fix? Reframe Point 3: allow one-shot learning but add a luck-resistant criterion (e.g., "understands and can reliably execute"). This saves the video module but adds a safety net against flukes. For Point 5, soften "isn’t correct/incorrect" to "isn’t factive like propositions," leaving room for success conditions. 

  The committee will likely pounce on the luck-practice gap. Preempt that by emphasizing that certification assesses comprehension, not just outcomes—tying once correctly after understanding the demonstration counts if it’s non-accidental. That bridges Points 3 and 6 without requiring lengthy practice.
answer: |-
  Your framework is ambitious and mostly coherent, but there are significant tensions – particularly around **luck, instant acquisition, and factivity**. Here's a breakdown of conflicts, ranked by severity, with fixes and costs:

  ### 🔥 **Ranked Tensions (Worst First):**
  1.  **Point 3 (Instant Acquisition) vs. Point 6 (Ruling Out Luck)**
      *   **Conflict:** If know-how can be acquired *instantly* from testimony/demo with *no practice* (3), how do you rule out *luck* (6)? A trainee might watch a video, tie the knot correctly *once by fluke* (e.g., mimicking movements without understanding why they work, or getting a complex knot right accidentally). According to (6), they don't *know how*. But according to (3), they do.
      *   **Why it's the Worst:** Directly undermines your proposed certification policy (video module w/o practice). A committee member *will* ask: "What if they just got lucky once?"
      *   **What Has to Give:** The strict "no practice" requirement in (3). Or the absolute exclusion of luck in (6) needs qualification.
      *   **Cost:** Weakens the strongest justification for minimal-practice certification. Requires defining a threshold for non-lucky success.
      *   **Cheapest Fix:** Revise (3) to: *"You can acquire *the core understanding* of knowledge-how in one shot... However, reliable, non-lucky performance typically requires minimal practice to consolidate the knowledge and rule out flukes."* **Certification Policy Fix:** Allow the video module *only if* followed by *observed successful execution under standard conditions* (ruling out obvious luck). This preserves the spirit of accessible certification while addressing luck.

  2.  **Point 5 (Non-Factive) vs. Point 6 (Rules Out Luck)**
      *   **Conflict:** (5) says know-how "isn't the sort of thing that can be correct or incorrect." But (6) implies there *is* a correct way (tying a *real* bowline vs. a granny knot) and that getting it wrong (or right by luck) means you don't *know how*. How can luck be ruled out if there's no standard of correctness?
      *   **Why it's Bad:** Creates a logical hole in your anti-luck argument. If know-how has *no correctness condition*, why does luck matter?
      *   **What Has to Give:** The strong claim in (5) that know-how "can't be correct or incorrect." Know-how *is* standard-relative (your point 2) and *does* have success conditions.
      *   **Cost:** Weakens your distinction from "knowing that" (though factivity *is* different for propositions vs. skills).
      *   **Cheapest Fix:** Reframe (5): *"Knowledge-how isn't factive *in the same way* as 'knowing that'. Its correctness isn't about truth, but about *successfully achieving the intended outcome* relative to a standard (point 2). One can have the knowledge-how (understanding) but fail execution due to external factors (point 4), or execute successfully by luck without the knowledge-how (point 6)."* This links 2, 4, 5, and 6.

  3.  **Point 1 (Genuine Knowledge) & Point 7 (Animals/Kids) vs. Point 3 (Testimony-Based)**
      *   **Conflict:** (1) & (7) emphasize know-how as non-propositional and possible without language/concepts. (3) relies heavily on *linguistic testimony* ("written-plus-video") as sufficient for instant know-how. How does linguistic testimony convey non-propositional knowledge to an agent who might not even have propositional attitudes (as per 7)? Can a pre-verbal child gain know-how *from a video*?
      *   **Why it's Notable:** Highlights a potential over-reliance on *propositional transmission* for something you argue is fundamentally non-propositional. It doesn't break the system, but feels inconsistent.
      *   **What Has to Give:** Acknowledge limits of testimony *alone* for complex know-how. Emphasize *demonstration* over *description*.
      *   **Cost:** Slightly weakens the "written" part of your module. Pushes focus onto the *video demonstration*.
      *   **Cheapest Fix:** Clarify (3): *"You can acquire knowledge-how *from a clear demonstration* (with or without accompanying testimony) in one shot... *if the demonstration successfully conveys the relevant understanding of the method*."* This grounds acquisition in the *non-propositional demonstration*, making it consistent with (1) & (7). The written part becomes supplementary.

  ### ✅ Points Working Well & Quietly Load-Bearing:
  *   **Point 2 (Standard-Relativity):** **Crucially Load-Bearing.** This is your best weapon against pedantry. It allows flexible certification levels (dinghy rigging vs. rescue test) and justifies why "knowing how" isn't an all-or-nothing switch. It underpins practical assessment.
  *   **Point 4 (Outlives Ability):** **Load-Bearing for Philosophy & Policy.** Vital for distinguishing *knowledge* from *current capacity*. Justifies why someone who *understands* but is temporarily impaired (injured surgeon) still "knows how," and why certification isn't instantly invalidated by a broken arm. Strengthens (1).
  *   **Point 6 (Rules Out Luck):** **Load-Bearing for Assessment Rigor.** Essential for arguing your certification means something more than a lucky guess. Even with the tension to (3), this is necessary for credibility.
  *   **Point 7 (Animals/Kids):** Strong support for (1) - know-how as fundamental and non-propositional. Undermines overly intellectualist views.

  ### 📝 Recommended Single Revision (Cleaning up 1, 3, 5, 6)
  **Replace Points 3 and 5 with:**

  > **3.** Knowledge-how can be acquired *effectively* from testimony or demonstration, potentially requiring minimal consolidation to rule out luck. If a trainee understands the demonstration and can reliably execute the skill correctly *according to the relevant standard* shortly after (without extensive practice), they possess the knowledge-how. *(Fixes Tension 1 & 3, supports Policy with safeguard)*
  >
  > **5.** Knowledge-how isn't factive like propositional knowledge. Its "correctness" is defined by *successfully achieving the intended outcome* relative to a standard (Point 2). One can possess the knowledge-how (understanding) yet fail execution due to external factors (Point 4), or execute successfully by luck without possessing the knowledge-how (Point 6). *(Fixes Tension 2, links 2,4,5,6)*

  ### 💡 Final Advice for Committee
  *   Lead with **Standard-Relativity (Point 2)**. It's intuitive and justifies tiered certification.
  *   Explicitly **define your certification standard** ("well enough for safe dinghy rigging in calm conditions," not "perfect rescue knot under duress"). Link this directly to Point 2.
  *   **Acknowledge the luck/practice issue** upfront regarding Point 3. State your policy includes *verification of understanding and successful execution* after the module to rule out luck, framing it as responsible assessment, not a philosophical retreat.
  *   Use **Point 4 (Outlives Ability)** to reassure them certification certifies *understanding*, not just momentary performance.
  *   **Emphasize Point 6 (Rules Out Luck)** to show your certification has substance.

  Your core insight – that practical knowledge is genuine, standard-relative understanding distinct from both pure propositional knowledge and mere blind ability – is sound. Tightening the links between standards, success, luck, and acquisition will make it robust for committee scrutiny. Good luck!
