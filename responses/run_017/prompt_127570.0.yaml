answer: |-
  Here’s a draft adversarial collaboration document designed to force clarity on disagreements, identify testable cruxes, and minimize filler. It intentionally leaves irreconcilable differences unresolved but structured for future testing.

  ---

  **Adversarial Collaboration: On Computation in Biological Nervous Systems**  
  *Joint Statement by Marcus [Systems/Computational Neuroscience] & Ines [Dynamical/Embodied Neuroscience]*  
  *Date: [Thursday]*

  ### 1. Agreed Claims (Non-Vacuous)  
  Both parties endorse the following:  
  1. The brain is **not architecturally analogous** to a von Neumann machine (no stored program, central clock, CPU/RAM split, or error-corrected digital code).  
  2. A defensible criterion of computation **must block trivial implementation** (e.g., "weather computes tomorrow’s forecast").  
  3. **Not all neural phenomena** are plausibly computational (e.g., stochastic vesicle release, ephaptic effects, glial calcium waves).  
  4. Both computational and dynamical models are **predictively useful tools** in neuroscience.  
  5. The question "Does the brain compute?" is **independent** of "Could a machine be conscious?"  
  6. **Multiple realization** is possible: distinct physical systems can implement identical computations.  
  7. No single model captures all levels of neural organization; **explanatory trade-offs exist**.  

  ---

  ### 2. Disagreements Table  
  | Issue | Marcus’s Position | Ines’s Position | Nature of Disagreement |  
  |-------|-------------------|-----------------|------------------------|  
  | **Ontology of Computation** | Nervous tissue *literally performs* computations; successful mechanistic models reveal causal structure. | Computation is a *model-dependent* description; dynamical systems theory is equally fundamental. | **Substantive**: Ontological commitment vs. instrumentalism. |  
  | **Representations** | Neural states *are* representations (e.g., firing patterns encode external variables). | "Representation" is a useful heuristic, but not intrinsic; dynamics suffice. | **Substantive**: Are representations discovered or imposed? |  
  | **Implementation Criterion** | A privileged mapping exists (e.g., causal-structure isomorphism) defining *the* computation a circuit implements. | Any mapping is constrained by predictive goals; no "true" computation exists independently. | **Substantive**: Is there a fact-of-the-matter? |  
  | **Scope of Computation** | Computation is localized to specific circuits (e.g., retinal ganglion cells compute contrast). | Computation emerges from brain-body-environment coupling; not isolable to tissue chunks. | **Verbal/Substantive**: "Computation" vs. "dynamical coordination". |  
  | **Temporality** | Discrete computational steps can approximate continuous dynamics. | Continuous, real-time dynamics are irreducible; input-output models distort timing. | **Substantive**: Is discretization explanatory or distortive? |  
  | **Multiple Computations** | One circuit can implement multiple computations, but each is definable by context. | "Multiple computations" reflects multiple modeling choices, not circuit ontology. | **Verbal**: Semantic disagreement on "implementation". |  

  ---

  ### 3. Cruxes & Testable Predictions  
  **Crux (a): Is there a non-arbitrary criterion separating computation from computational description?**  
  - **Test (Lesion/Intervention-Transfer)**:  
    - *Setup*: Train a mechanistic model (Marcus) and a black-box dynamical model (Ines) to predict neural activity in V1 during natural scene viewing. Test both on predictions for optogenetic silencing of specific interneuron types + novel stimuli (e.g., unnatural textures).  
    - *Marcus Prediction*: Mechanistic model outperforms on interventions (e.g., predicts rebound spiking post-silencing).  
    - *Ines Prediction*: Both models perform equally well; dynamics capture causal topology without representational commitments.  
    - *Threshold*: >15% prediction error difference favors the winner.  

  **Crux (b): Where does "implementation" end and "background conditions" begin?**  
  - **Test (Slow Substrate Replacement)**:  
    - *Setup*: Replace cortical neurons one-by-one with neuro-mimetic devices (matching I/O + plasticity). Monitor performance on a learned task (e.g., odor discrimination).  
    - *Marcus Prediction*: Computation survives until critical components (e.g., specific inhibitory loops) are replaced.  
    - *Ines Prediction*: "Computation" degrades continuously; no step-change (behavioral success ≠ preserved computation).  
    - *Threshold*: Marcus claims failure at <70% replacement; Ines at >90%.  

  **Crux (c): Can one tissue chunk implement many computations?**  
  - **Test (Porting)**:  
    - *Setup*: Implement Marcus’s "cerebellar credit-assignment computation" on neuromorphic hardware. Alter hardware physics (e.g., analog vs. digital).  
    - *Marcus Prediction*: Computation preserved if causal graph/isomorphism is maintained.  
    - *Ines Prediction*: "Same computation" requires identical environmental coupling; porting is re-description.  
    - *Threshold*: Agreement on behavioral success ≠ agreement on computational identity.  

  **Crux (d): What fixes representational content?**  
  - *Test omitted – requires behavioral assays of representational drift during learning; both dispute methodology.*  

  ---

  ### 4. Subsystem Audit  
  | Subsystem | Marcus: Computes? | Ines: Computes? | Disagreement? |  
  |-----------|-------------------|----------------|---------------|  
  | Retina | Yes (under causal isomorphism) | Only under observer-relative criterion | **Yes** |  
  | Cerebellum | Yes (credit assignment) | Yes (as adaptive filter) | **No** |  
  | Cerebral Cortex | Yes (hierarchical Bayesian inference) | No (continuous sensorimotor loop) | **Yes** |  
  | Basal Ganglia | Yes (action selection) | Yes (as dynamical attractor) | **Verbal** |  
  | Neuromodulatory Sys | No (enabling conditions) | No (global dynamics) | **No** |  
  | Spinal CPG | No (dynamical regime) | No (embodied coordination) | **No** |  
  | Glia | No | No | **No** |  

  ---

  ### 5. Evaluation of Proposed Criteria  
  **Criterion A (Etiological)**:  
  - *Marcus*: Accepts – links computation to evolutionary/developmental teleology.  
  - *Ines*: Rejects – still observer-relative (we define "function").  
  - *Problem*: Vagueness in "counterfactually robust map".  

  **Criterion B (Compression)**:  
  - *Marcus*: Rejects – shortest description may omit real structure (e.g., Laplace’s demon).  
  - *Ines*: Conditionally accepts – if dynamical description is shorter, no computation exists.  
  - *Problem*: Description-length depends on language.  

  **Hybrid Suggestion**: Focus on **interventionist counterfactuals** (e.g., "If input X were altered, would state Y change *as if* following rule Z?"). Both tentatively accept as testable.  

  ---

  ### 6. Disputes: Semantic vs. Substantive  
  - **Semantic**: Whether "computation" requires representational states. Marcus (yes); Ines (no).  
  - **Substantive**: Whether neural activity *must* be described dynamically. Ines (yes); Marcus (no – computation is sufficient).  
  - **Irreconcilable**: Ontological status of representations.  

  ---

  ### 7. Falsifiability  
  **Marcus**: "If no implementation criterion blocks triviality *and* recovers the success of computational neuroscience, my view is false."  
  **Ines**: "If interventions *require* representational/computational descriptions to predict novel causal effects (e.g., in cortex), my view is false."  

  ---  
  *Document ends. To be revised/expanded by Marcus & Ines before Thursday.*  

  ---  
  **Key Features**:  
  - Forces explicit commitments via numbered agreements.  
  - Disagreements table avoids strawmen (e.g., Ines accepts "computation" as tool).  
  - Tests target *specific* predictions (thresholds, setups defined).  
  - Subsystem audit reveals limited practical disagreement.  
  - Falsifiability articulated without requiring retreat.  
  - Deliberately "rough" phrasing (e.g., "chunks of tissue", "observer-relative").  

  **Where Collaboration Breaks**:  
  - Ontology of representations (Sec 2, Row 2).  
  - Marcus’s "privileged mapping" vs. Ines’s "no fact-of-the-matter" (Sec 2, Row 3; Sec 3, Crux a).  

  Let them fight over the wording now – you’ve given them scaffolding. Good luck!
