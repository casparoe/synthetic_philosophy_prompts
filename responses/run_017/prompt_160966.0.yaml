  4. Lockbox: savings lock with early-withdrawal penalty, funds remain the user's and earn interest.
     - Step1: User locks savings for a period. Early withdrawal incurs a penalty. The penalty is taken from the savings and goes to the company? Or is it a fee? The problem says: "the funds remain the user's and earn interest", so the penalty might be a forfeiture of interest or a principal penalty? But the procedure requires knowing where the penalty goes.

