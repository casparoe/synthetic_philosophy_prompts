prompt: |-
  I chair the Commitments and Defaults Review at a consumer-finance app, and I want our working distinction between helping users keep their own plans and profiting from their changing their minds turned into a procedure we can actually run.

  The setting: every quarter my board reviews roughly twenty features that constrain, reverse, or automatically renew a user's future choices — auto-renewing subscriptions whose renewal price rises after the first term, savings locks with early-withdrawal penalties, automatic escalation of a contribution rate on every pay raise, gamified savings streaks that reset if a week is missed, cooling-off windows before a large withdrawal. Reviewers are product managers and one compliance officer; none of them has any training in decision theory. Each feature gets ninety minutes. The output is a one-page verdict — permitted as designed, permitted with specified changes, or not permitted — that the general counsel's office signs off on, so the reasoning has to be legible to a lawyer who will ask what the test was and whether we applied it consistently.

  Please write the procedure my reviewers will follow: the questions in order, what counts as a sufficient answer to each, the gates where the procedure stops with a no, and the gates where it hands the decision to a person because the question is one of values rather than facts. Two constraints on what the reviewers have to work with: they can use product telemetry (reversal rates, how often users re-enrol, how much money moves and to whom) but must not rely on surveying users about their own preferences, and they frequently will not have the number a step asks for, so every step needs an instruction for what to do when the data is missing.

  The conceptual core is the money-pump argument, and I need the procedure to keep the distinctions that carry the argument's weight rather than smoothing them away. Specifically, it must be able to tell apart: a cycle in preferences held at one time from a change of preference over time; a reversal that is information-bearing (the user learned something, her circumstances changed, the product revealed itself to be different from what was advertised) from one that is gratuitous drift; a design that works by users mispredicting their own future behaviour from one that a user who fully anticipated her own future defection would still have chosen at the outset; a mechanism that recreates the original choice situation and can extract again from one that merely charges once for a change of mind; and extraction that leaves the user worse off to a third party's benefit from a pure transfer among the user's own time-slices, where the earlier self gains exactly what the later self loses. My reviewers will know none of this vocabulary, so define each test in operational terms and say what telemetry pattern would satisfy it.

  Two questions I want the procedure to take an explicit stance on rather than dodge. First, pump closure: does a working exploitation argument require that the mechanism be able to run indefinitely, or is a single completed cycle enough to condemn the design, given that a one-off fee for changing one's mind may be a perfectly rational price for keeping options open? Second, what I have started calling autonomy pumps — cycles that extract no money at all but leave the user with no stable plan she can act on, because the mechanism undoes her commitments each time she forms one. If the argument from money pumps does not extend to these, say so plainly and tell us what, if anything, we should do with them instead.

  Then run the finished procedure on four features, showing the work at each gate: the auto-renewing subscription with the rising renewal price; the auto-escalating contribution rate with an easy opt-out; the savings streak that resets after a missed week; and our flagship Lockbox, a savings lock with an early-withdrawal penalty where the funds remain the user's and earn interest. Lockbox is the feature my team is most confident is simply helping people, so run it honestly and do not soften the result: if the verdict under your own procedure is that it exploits diachronic inconsistency, say what we would have to change about it, and say what we should conclude if the change is not commercially viable.

  Close with the procedure's limits: state plainly which questions it can settle on the evidence a reviewer has, which it can only re-describe, and which — whether preference change over time is ever irrational in itself, how much paternalism toward a user's later self is licensed — it has to leave to someone else.
reasoning: |-
  We are creating a procedure for reviewing features that constrain, reverse, or automatically renew user choices. The goal is to distinguish between helping users keep their own plans and profiting from their changing minds. The procedure must be operational and use available telemetry, without user surveys.

  Conceptual Core: The money-pump argument. We need to test for:
  1. Cycle in preferences at one time vs. change over time.
  2. Reversal due to new information (legitimate) vs. gratuitous drift (exploitative).
  3. Design that relies on user mispredicting future behavior vs. one that a fully anticipating user would still choose.
  4. Mechanism that can repeatedly extract (like a pump) vs. one-time charge for change of mind.
  5. Extraction that benefits a third party (the company) vs. transfer among the user's own time-slices.

  Two explicit stances:
  - Pump closure: A single completed cycle is enough to condemn the design if it exploits a preference reversal that is not due to new information. However, a one-off fee for a change of mind that is rationally priced for keeping options open may be acceptable. We require that the cycle must be avoidable by a user who has stable preferences and full information.
  - Autonomy pumps: Even without monetary extraction, if a mechanism prevents the user from forming a stable plan by repeatedly undoing commitments, it is problematic. The procedure will treat these similarly to money pumps.

  Procedure Structure:
  The review for each feature will follow a sequence of questions. Each question must be answered with available data (telemetry) or, if data is missing, use a default rule. The procedure stops with a "no" at certain gates. Some gates require human judgment (values) when the question is not decidable by data.

  Procedure Steps:

  1. **Identify the commitment mechanism**: 
     - What is the feature that constrains, reverses, or automatically renews a user's future choice?
     - This is descriptive. No gate.

  2. **Check for cycles in simultaneous preferences (at one time)**:
     - Could a user at one point in time have cyclic preferences (A preferred to B, B to C, C to A) that the feature might exploit? 
     - Operational: Look for evidence in telemetry of users simultaneously holding conflicting preferences (e.g., trying to set two conflicting rules). 
     - If found: stop and mark as "not permitted" because it exploits an irrationality at a single time. 
     - But note: This is rare. If no evidence, or if the feature doesn't present multiple options at once, assume no and move on.

  3. **Trace the decision path over time**:
     - Map the user's choices over time. Identify at least two time points: T0 (when the commitment is set) and T1 (when the user might reverse). There might be more.
     - Required telemetry: enrollment rate at T0, reversal rate at T1, and re-enrollment rate (if applicable) at T2 (after reversal).
     - If data missing: use the most recent similar feature's data or industry benchmark. If none, mark as "data missing" and require the feature to be redesigned to collect this data.

  4. **Test for gratuitous reversals (vs. information-bearing)**:
     - A reversal is considered information-bearing if it is associated with a change in circumstances or new information that the user could not have reasonably anticipated at T0.
     - Operational: Look for telemetry patterns that correlate reversals with:
          a. Life events (e.g., job loss, which the app might infer from transaction patterns) OR
          b. Product events (e.g., a change in terms, a bug, or a feature not working as advertised) OR
          c. External events (e.g., market downturn, if the feature is investment-related).
     - Also, check if the reversal rate is significantly lower in a control group that received more complete information at T0 (if such A/B test exists).
     - If the reversal rate is high and not explained by such events, and the feature charges a fee for reversal, then it may be gratuitous.
     - If data missing: assume reversals are information-bearing unless there is evidence to the contrary (e.g., high reversal rate without any observable trigger).

  5. **Test for misprediction of future behavior**:
     - Would a user who fully anticipated her future defection (i.e., knew at T0 that she would want to reverse at T1) still have chosen the feature at T0?
     - Operational: Look at re-enrollment rates after reversal. If users re-enroll at a high rate after reversing (especially soon after), it suggests they still value the commitment despite the reversal and might have chosen it even if they knew they would reverse. Alternatively, if the feature is popular among users who have reversed multiple times, that supports that they would still choose it.
     - If the re-enrollment rate is low, it suggests that after experiencing the reversal, they no longer want the commitment, meaning they may have mispredicted at T0.
     - If data missing: use the overall enrollment rate. If the feature is very popular (high enrollment), assume that even knowing the reversal, users would still choose it (so no misprediction). If not, assume misprediction.

  6. **Test for pump-like extraction**:
     - Can the mechanism repeatedly extract from the user? That is, after a reversal, does the feature put the user back in a similar state as at T0, allowing the cycle to repeat?
     - Operational: Look at the rate of repeated reversals (e.g., enroll, reverse, re-enroll, reverse again). Also, check if the design resets the user to a state where they can be charged again for the same type of reversal.
     - If the feature allows multiple cycles (e.g., a subscription that can be canceled and re-subscribed, with a fee each time) and the re-enrollment rate is high, it may be a pump.
     - If data missing: assume it is a one-time charge unless the design clearly allows repetition (e.g., a subscription).

  7. **Test for third-party benefit vs. transfer**:
     - When a reversal occurs, does the penalty (or fee) go to a third party (the company) or is it a transfer among the user's own accounts (e.g., from spending to savings)?
     - Operational: Trace the money flow. If the fee is paid to the company (or a partner) and is not used for the user's benefit, it's third-party. If the penalty is a forfeiture of interest or a transfer to another account of the same user (e.g., a penalty that goes into a savings lockbox for future use), then it's a transfer.
     - If the penalty is a pure transfer among the user's own time-slices (e.g., the penalty is taken from the user's spending now and added to their savings for later), then it is acceptable. Otherwise, if it benefits a third party, then it is problematic if combined with gratuitous reversal.

  8. **Pump closure stance**:
     - We take the stance that even one cycle is enough to condemn if:
          a. The reversal is gratuitous (step 4) AND
          b. The mechanism is pump-like (step 6) AND
          c. The extraction benefits a third party (step 7).
     - However, if the reversal is information-bearing, then a one-time fee is acceptable.

  9. **Autonomy pumps**:
     - Even without a monetary fee, if the feature resets the user's progress (like breaking a streak) and this happens repeatedly without the user being able to stabilize, then it is an autonomy pump and should be treated as a problem.
     - Operational: Look for high rates of repeated resets (e.g., users who break a streak, restart, break again). Also, if the reset causes the user to abandon the goal entirely (high churn after reset) then it is harmful.
     - If the reset is rare and users can easily avoid it, then it is acceptable.

  10. **Verdict Gates**:
      - Gate A (Stop with "no"): If the feature exploits cycles in simultaneous preferences (step 2) -> "not permitted".
      - Gate B (Stop with "no"): If the feature causes gratuitous reversals (step 4) AND the penalty benefits a third party (step 7) AND the mechanism is pump-like (step 6) -> "not permitted".
      - Gate C (Stop with "no" for autonomy): If the feature is an autonomy pump (step 9) with high reset rates and user churn -> "not permitted".
      - Gate D (Permitted with changes): If the reversal is not gratuitous (step 4) but the mechanism is pump-like (step 6) and benefits a third party, then we require changes to break the pump (e.g., limit the number of cycles) or to make the penalty a transfer (step 7). Also, if data is missing in critical steps, require changes to collect the data.
      - Gate E (Permitted as designed): If the reversal is information-bearing or the penalty is a transfer and the feature is not pump-like, and it passes the other tests.

  Procedure in Steps:

  Step 1: Describe the feature.

  Step 2: Check for simultaneous cycles.
     - If found: Not permitted. Stop.
     - Else: Next.

  Step 3: Trace decision path (T0, T1, T2). If data missing, note and proceed with caution.

  Step 4: Test for gratuitous reversal.
     - If reversal rate is high and not explained by events -> gratuitous.
     - Else: not gratuitous.

  Step 5: Test for misprediction.
     - If re-enrollment rate is high -> user would still choose even knowing reversal.
     - Else: misprediction.

  Step 6: Test for pump-like.
     - If repeated reversals are common and the design allows it -> pump-like.
     - Else: not pump-like.

  Step 7: Test for third-party benefit.
     - If penalty goes to third party -> third-party.
     - Else: transfer.

  Step 8: Apply pump closure: one cycle is enough if gratuitous and pump-like and third-party.

  Step 9: Test for autonomy pump (if no monetary penalty, but resets progress).
     - If high reset rates and high churn -> autonomy pump problem.

  Step 10: Verdict:
     - If step2: Not permitted.
     - Else if step4 (gratuitous) AND step7 (third-party) AND step6 (pump-like): Not permitted.
     - Else if step9 (autonomy pump with harm): Not permitted.
     - Else if step5 (misprediction) and step7 (third-party) and step6 (pump-like): Permitted with changes (e.g., add more warnings, make penalty a transfer, or limit cycles).
     - Else: Permitted as designed.

  Now apply to the four features:

  1. Auto-renewing subscription with rising renewal price:
     - Step1: User subscribes at T0 at a discounted price. At T1 (renewal), price increases and auto-renews unless canceled. Penalty: user pays higher price until they cancel.
     - Step2: No simultaneous cycles.
     - Step3: Data: enrollment at T0, renewal at T1 (with higher price), cancellation after renewal (if any).
     - Step4: Reversal (cancellation after renewal) might be high. Is it gratuitous? If cancellations occur right after the price hike and there's no new information (the price hike was known), then it is gratuitous drift (the user changed mind about the value). However, if the user learned that they don't use the service enough, that might be information-bearing. Without specific data, we assume it's gratuitous if the cancellation rate spikes at renewal without other events.
     - Step5: Re-enrollment: if users re-enroll soon after cancellation (e.g., to get the discount again), then they would still choose at T0 even knowing they would cancel. But note: the design might prevent immediate re-enrollment (cooling off). If re-enrollment is high, then no misprediction.
     - Step6: Pump-like: if users can re-enroll and then cancel again, it is pump-like. Common in subscriptions.
     - Step7: Third-party: the higher price goes to the company -> third-party.
     - Step8: If gratuitous and pump-like and third-party -> not permitted.
     - Step9: Not an autonomy pump (it's monetary).
     - Verdict: If step4 shows gratuitous reversal (likely) and step6 pump-like (likely) and step7 third-party (yes), then not permitted. Recommended change: make the renewal price the same as the initial price, or allow cancellation without penalty at any time (so no higher price paid). If not viable, then not permitted.

  2. Auto-escalating contribution rate with easy opt-out:
     - Step1: At T0, user sets up auto-escalation: every pay raise, contribution rate increases. User can opt out at any time with no penalty.
     - Step2: No simultaneous cycles.
     - Step3: Data: enrollment, escalation events, opt-out rates after escalation.
     - Step4: Opt-out (reversal) might occur after an escalation. If the opt-out is high right after an escalation and there's no new information (the user knew about the escalation), then it might be gratuitous. However, if the user's financial situation changed (they got a raise but also had new expenses), that could be information-bearing. Without data, assume information-bearing because the opt-out is easy and free.
     - Step5: Re-enrollment: after opt-out, does the user re-enable? If they do, then they would still choose at T0. If not, they might have mispredicted. But note: the opt-out is without penalty, so it's not costly.
     - Step6: Pump-like? After opt-out, the user can re-enable. But there's no fee. So not a money pump. Also, the escalation only happens on pay raises, so not immediately repeatable.
     - Step7: No penalty, so no extraction.
     - Step9: Autonomy? If the user repeatedly opts out and then re-enables, it might be an autonomy pump. But without penalty, it's less harmful. If the opt-out rate is low and re-enable is low, then not a problem. If high cycling, then it might be. But the procedure says: if it causes churn (users abandon saving) then it's a problem. Otherwise, it's acceptable.
     - Verdict: Likely permitted as designed because reversals are free and not pump-like in a monetary sense. However, if there is high cycling and churn, then we might require changes to make the commitment more stable (e.g., by requiring a confirmation before escalation).

  3. Savings streak that resets after a missed week:
     - Step1: User builds a streak by saving every week. If they miss a week, the streak resets to zero. There's no monetary penalty, but the user loses the streak status and any associated rewards (e.g., badges, higher interest).
     - Step2: No simultaneous cycles.
     - Step3: Data: streak participation, reset events, re-engagement after reset.
     - Step4: The reset is the reversal. It might be due to forgetfulness or circumstances. If the reset rate is high and not explained by events (like a holiday week), then it might be gratuitous. But note: the user might have chosen to skip a week for a good reason (information-bearing). Without data, assume it's information-bearing if the user re-engages (step5).
     - Step5: After a reset, does the user start a new streak? If re-engagement rate is high, then they value the streak and would still choose at T0 even knowing they might break it. If low, they might have mispredicted and now give up.
