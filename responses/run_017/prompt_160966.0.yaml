     - If the reset rate is high and the company benefits by not paying rewards (step7: third-party benefit) and the reversals are gratuitous (step4), then it might be condemned. But note step6: it's pump-like in autonomy. 
     - However, our procedure for autonomy pump (step9) requires high reset rates and churn. If the user restarts and continues, it might be acceptable. But if the user quits after reset, then it's harmful.

