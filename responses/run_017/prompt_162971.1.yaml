  We are going to translate the Maxwell's demon resolution from thermodynamics to Bayesian epistemology.

  The core physical claim: 
  - The demon can extract work bounded by kT ln(2) * I(M; S) per cycle, where I(M;S) is the mutual information between the demon's memory state M and the system state S.
  - The erasure cost is at least kT ln(2) * H(M), where H(M) is the entropy of the memory state.

  In the Bayesian framework, we have:
  - Priors, posteriors, evidence, mutual information, etc.
  - We do not have an inherent cost for holding beliefs or for erasing them.

  Translation goal: Express the physics in Bayesian terms, then note where the translation breaks.

  Prose Translation:

  In the Bayesian framework, the act of observing a system (like the molecule's position) is equivalent to updating one's beliefs via Bayes' theorem. This update is reversible in the sense that it does not require any immediate expenditure of resources. The value of this observation is captured by the mutual information between the system state and the observation, which measures the expected reduction in uncertainty (in log-score bits) about the system.

  The physical cost arises not from the observation itself, but from the need to reset the memory to a standard state to make it ready for the next observation. This reset operation is thermodynamically irreversible and requires work. The minimal work required is proportional to the entropy of the memory state, which can be decomposed as H(M) = I(M;S) + H(M|S). The mutual information I(M;S) represents the useful information about the system, while H(M|S) is the conditional entropy (or "noise") that is irrelevant to the system.

  In Bayesian terms, the mutual information I(M;S) is the same as the expected improvement in the log-score from the observation. However, the Bayesian framework does not account for the cost of holding the belief state (which in the physical case has entropy H(M)) nor for the cost of resetting it. The physical cost of erasure is proportional to the entire entropy H(M), not just the mutual information.

  Residue Report:

  1. The Gap between Mutual Information and Memory Entropy:
     - In the Bayesian framework, we have mutual information and entropy, but we do not have a concept of a "cost" for holding a belief. The gap H(M|S) (the conditional entropy of the memory given the system) is information that is in the memory but not about the system. In the physics, this extra entropy must be erased at a cost. In the Bayesian framework, we can compute H(M|S) but we do not assign a cost to it. If the Bayesian agent has unbounded memory, this gap is invisible.

  2. Agent-Relativity:
     - The physics bound on work extraction (kT ln(2) * I(M;S)) is based on the mutual information in the joint distribution. It does not depend on whether the demon can decode the memory. However, if the demon cannot decode its own memory (i.e., it cannot use the correlation to extract work), then in reality it might not be able to achieve the bound. The physical bound is a theoretical maximum assuming the demon can use the information optimally. 
     - In the Bayesian framework, if an agent has a record (like an encrypted bit) that has high mutual information but the agent cannot decode it (i.e., the agent's likelihood function does not model the decryption), then updating on that record without decryption would not improve the agent's score. The agent might even be worse off if the update is based on a misspecified model. However, the mutual information still exists in the joint distribution. The physical cost of erasure is still H(M) regardless of decodability. So the erasure cost is not agent-relative, but the work extraction is: if the demon cannot decode, it cannot extract the work, but the mutual information in the joint distribution is still there. The physics bound on work extraction is an upper bound that may not be achievable by a particular agent.

  3. Timing:
     - In the case of a demon that never erases (either one-shot or with an infinite tape), the physical cost is shifted. For a one-shot demon, the cost is in preparing the initial blank memory. For an infinite tape, the cost is in the increasing entropy of the tape and the need to supply blank tapes. In the Bayesian framework, updating is a timeless event. There is no cost for retaining a belief. The time-shape of the payment (acquisition, retention, erasure) is a feature of the physical implementation and does not translate to the Bayesian framework.

  Verdict:
  - The phrase "information is physical" is substantive in the context of physical systems that process information. The thermodynamic cost is about the physical degrees of freedom that represent the information. The Bayesian framework lacks the concept of a physical resource cost for maintaining and resetting states. The residue is a gap in the Bayesian vocabulary: it does not account for the cost of maintaining and resetting the physical medium of beliefs.

  - The smallest honest addition would be to introduce a notion of a finite memory resource. We could model an agent with a bounded memory that must be reset or expanded at a cost. The cost of holding a belief state would be proportional to the entropy of that state (in the sense of the physical resources required to store it), and the cost of resetting a belief state to a standard state would be proportional to the entropy of the state being reset.

