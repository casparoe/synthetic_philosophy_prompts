prompt: |-
  I teach clinical reasoning to medical residents, and there is a shape of case I keep running into that I cannot find a name for, though I assume there is a literature on it.

  A resident feels sure that a scan shows something malignant, and is then told two things: that in this unit, readers who are *sure* about this presentation are right about as often as a coin flip, and that the reason is not that the presentation is intrinsically hard but a perceptual trap that produces both the error and the feeling of certainty. Her confidence is a symptom of the very process that makes her wrong. If she could stop being certain, she would be back to her normal accuracy and the undermining fact would no longer apply to her — but she cannot simply decide to stop being certain, and no amount of being told seems to switch the feeling off.

  Two nearby cases seem to work differently. In one, the undermining fact is insensitive to what she does: she learns she has been overconfident in this domain for years, so even the moderate confidence she retreats to is itself inflated, and the doubt simply moves with her. In the other, complying seems to *produce* the problem: she is told that the departmental guideline's track record is unreliable precisely because everyone defers to it, and that deference destroyed the independence the track record depended on — so the more decisively she treats that information as a reason to defer, the less support it gives.

  Does this cluster have an established name, or are these three different things? I am not after a label on its own. I want the carving: what exactly the phenomenon is; how it differs from a reason for doubt that merely outweighs the original evidence or makes it evidentially irrelevant; how it differs from the ordinary gap between judging that one should not believe something and actually giving it up; whether the category should include cases where one can only comply indirectly, by changing one's habits, one's sources, or one's environment rather than one's mind; and whether a reason for doubt that disappears when complied with belongs with one that appears only when complied with. If nothing established fits, coin the term, define it, and say which nearby cases must be excluded and why.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They teach clinical reasoning to medical residents and have encountered a specific type of case where a resident is overly confident about a scan showing malignancy. They mention that when residents are sure in this scenario, they're only right about half the time due to a perceptual trap. The key points are that the confidence itself is a symptom of the error, and simply telling them doesn't help. 

  The user also describes two nearby cases: one where the resident's confidence is chronically inflated, so even after adjusting, the doubt follows. The second is where deferring to guidelines undermines their reliability because everyone does it. The main question is whether there's a name for this cluster or if they're distinct phenomena, but deeper, they want a precise conceptual carving. 

  First, I need to recall relevant cognitive biases. The initial case sounds like the Dunning-Kruger effect, where low competence leads to overconfidence. But Dunning-Kruger usually involves unawareness of one's incompetence. Here, the resident is trapped by a perceptual error tied to certainty. Maybe it's a specific type of cognitive trap. 

  Then there's metacognition and second-order reasoning. The undermining fact here is self-referential. If the resident stops being certain, the doubt dissolves because the certainty was part of the problem. That's different from typical overconfidence where reducing confidence doesn't fix the underlying issue. 

  The second case where confidence is chronically inflated sounds like general overconfidence bias. The doubt moves with the resident because the issue is persistent, not tied to a specific perceptual trap. The third case involves a feedback loop where compliance destroys the evidence's reliability. That's similar to the Cobra effect or perverse incentives, where the solution worsens the problem. 

  So the core phenomenon in the first case is a self-resolving doubt contingent on the resident's cognitive state. The term "Autoscopic Error" comes to mind, combining "auto" (self) and "scope" (seeing), indicating a self-referential perceptual trap. The other cases don't fit because they lack this contingency. 

  The user also wants to differentiate this from merely outweighing evidence or the belief-perseverance gap. Here, the doubt is effective only if it changes the resident's certainty, which isn't a direct decision. Indirect strategies like changing habits or environment might be necessary, which fits under the Autoscopic Error concept. 

  They also ask about reasons that disappear when complied with versus those that appear only then. The first case's doubt disappears upon compliance, while the guideline case's doubt appears when complied with. Including both might stretch the category, so focusing on self-resolving doubts makes more sense. 

  In conclusion, coining "Autoscopic Error" for the first phenomenon and excluding the others maintains conceptual clarity. This helps residents understand that their confidence is part of the problem, guiding them toward metacognitive strategies rather than direct doubt.
answer: |-
  This is a fascinating and clinically crucial cluster of cases. While there isn't a single, universally established term for *exactly* this phenomenon, the core concept you're describing – **a self-referential, self-dissolving reason for doubt contingent on the epistemic state it targets** – is a specific type of metacognitive error with distinct features. Here's the conceptual carving:

  1.  **The Core Phenomenon: Autoscopic Error (Proposed Term)**
      *   **Definition:** An *Autoscopic Error* occurs when:
          *   (a) An agent holds a belief (B) with high subjective certainty (C).
          *   (b) The agent receives evidence (E) indicating that *holding B with C* in this specific context is systematically unreliable (e.g., accuracy ≈ chance).
          *   (c) The unreliability described by E is *causally linked* to the cognitive state (C) itself. C is not just correlated with error; it is part of the mechanism *producing* the error (e.g., a specific perceptual/cognitive "trap" triggered by certainty).
          *   (d) **Crucially:** Successfully internalizing E (losing C) would *dissolve the very condition (C)* that makes E applicable and the belief (B) unreliable in this instance. If C disappears, the agent reverts to their baseline reliability, and E no longer undermines *this specific instance* of their judgment about B.
          *   (e) However, the agent cannot directly will C away upon receiving E. The feeling of certainty persists despite acknowledging E.

  2.  **Distinguishing Features:**
      *   **vs. Mere Counterevidence/Outweighing:** Standard counterevidence directly attacks the *content* of B (e.g., "The shadow has features X, Y, Z which are common in benign condition A"). E in an Autoscopic Error attacks the *epistemic state (C)* associated with holding B, not primarily the evidence *for* B itself. It doesn't make the original scan evidence irrelevant; it reveals that the *interpretation pathway activated by certainty* is faulty.
      *   **vs. Evidential Irrelevance:** E is *highly relevant* to the *justification* for holding B *with C*. It reveals that C, in this context, is not a reliable indicator of truth for B. The irrelevance is conditional on C.
      *   **vs. Belief Perseverance/Ordinary Gap:** The "gap" here isn't just the general difficulty of changing beliefs. It's specific: E prescribes losing C to regain reliability, but losing C is precisely what the *mechanism described by E* prevents. The certainty feeling (C) is *symptomatic* of the trap, making compliance paradoxical. Standard belief perseverance persists even after counterevidence directly addressing B is accepted; here, the agent *accepts E intellectually* but cannot shake the *feeling* (C) that E identifies as the problem source.
      *   **Self-Dissolving Nature:** This is key. Successfully complying with E (losing C) makes E *cease to apply* to the agent's *current* judgment. Contrast this with learning you have a general calibration issue – that doubt sticks regardless.

  3.  **Analyzing Your Three Cases:**
      *   **Case 1 (The Scan & Perceptual Trap):** This is the **paradigmatic Autoscopic Error**.
          *   E: "Certainty in *this specific presentation* predicts chance accuracy due to a perceptual trap tied to certainty."
          *   Compliance Requirement: Lose certainty (C).
          *   Effect of Compliance: Losing C disengages the trap, restoring baseline accuracy. E no longer applies to *this* reading attempt *if* C is absent.
          *   Barrier: Cannot directly will C away; the trap generates C.
      *   **Case 2 (Chronic Overconfidence):** **NOT Autoscopic Error.**
          *   E: "You are chronically overconfident in this domain; even your moderate confidence is inflated."
          *   Compliance Requirement: Reduce confidence.
          *   Effect of Compliance: Doubt persists because E describes a *general trait*, not a state-contingent trap. Even reduced confidence might still be inflated. The doubt (based on the trait) *moves with her* because the unreliability is tied to *her*, not a specific cognitive state *in this moment* that can be switched off by changing that state. This is **Calibration Failure** or **General Overconfidence Bias**.
      *   **Case 3 (Guideline Deference Destroying Evidence):** **Distinct Phenomenon (Reflexive Undermining).**
          *   E: "The guideline's reliability depends on independent assessment, but widespread deference destroys that independence, making it unreliable."
          *   Compliance Requirement: Defer to the guideline (treat it as decisive).
          *   Effect of Compliance: By fully deferring, the agent *contributes* to the very condition (loss of independent verification) that *makes* E true and the guideline unreliable. Compliance *strengthens* the force of E against the guideline's reliability. This is a **Self-Defeating/Reflexive Rule** or a case of **Perverse Incentives/Feedback Loop** (akin to the Cobra Effect). The undermining reason *appears or strengthens* upon compliance, opposite to the Autoscopic Error where it *dissolves* upon compliance.

  4.  **Indirect Compliance & Environmental Change:**
      *   Autoscopic Errors *can* and often *must* be addressed indirectly. Since one cannot directly will away the feeling of certainty (C), compliance involves strategies that bypass the direct command:
          *   **Habit Change:** Deliberately cultivating a habit of double-checking *any* "sure" call in *this specific context*, regardless of feeling.
          *   **Source Change:** Mandating a second read by someone blinded to the first reader's certainty level, or using a checklist that forces engagement with alternative features.
          *   **Environmental Change:** Structuring workflows so that "sure" calls on these scans *automatically* trigger a consult or second read, removing the burden of self-doubt.
      *   **Key Point:** The *epistemic goal* of compliance is still to neutralize the problematic state (C) to dissolve the applicability of E. The indirect methods are practical pathways to achieve that epistemic shift where direct willpower fails. Therefore, cases requiring indirect strategies **DO** fit within the Autoscopic Error category, as long as the core self-dissolving structure is present.

  5.  **Reasons that Disappear vs. Appear upon Compliance:**
      *   **Autoscopic Error (Disappear):** E's undermining force *vanishes* upon successful compliance (losing C). Compliance resolves the *specific* unreliability E pointed out for *this* instance.
      *   **Reflexive Undermining (Appear/Strengthen):** Compliance (deferring) *activates* or *intensifies* the undermining force described by E. E predicts unreliability *caused by* the act of compliance itself.
      *   **Should they be in the same category? NO.** Their dynamics are fundamentally opposed:
          *   Autoscopic: `Compliance (State Change) → Dissolution of Problem → E no longer applies (for this instance).`
          *   Reflexive: `Compliance (Action) → Creation/Intensification of Problem → E becomes stronger/more applicable.`
      *   They represent different types of pathological epistemic loops. Combining them would obscure their distinct mechanisms and solutions.

  **Conclusion & Naming:**

  *   **Term:** **Autoscopic Error** (from Greek *auto-* "self" + *skopein* "to look at/examine"). This emphasizes the self-referential nature: the error involves examining one's *own* cognitive state (the feeling of certainty) and recognizing that *this very state* is the source of the unreliability.
  *   **Definition:** (As defined in point 1 above).
  *   **Excluded Nearby Cases:**
      *   **General Overconfidence/Calibration Failure (Chronic):** Excluded because the doubt is not self-dissolving upon reduced confidence; it persists due to a trait, not a state-contingent trap.
      *   **Reflexive Undermining/Self-Defeating Rules:** Excluded because compliance *creates* the problem E describes, rather than dissolving it. The undermining reason appears or strengthens upon compliance.
  *   **Why this Carving Matters for Clinical Reasoning:**
      *   It highlights that not all "overconfidence" is the same. Autoscopic Errors are specific traps tied to *certainty itself* in a context.
      *   It explains why simply telling the resident "you're often wrong when you're sure" doesn't fix the *feeling* – the feeling *is* the trap's output.
      *   It directs teaching towards *indirect strategies* (habits, forced processes, environmental triggers) to bypass the trap, rather than futile direct commands to "doubt yourself."
      *   It differentiates this from simply needing more evidence (counterevidence) or having a general personality flaw (chronic overconfidence).

  You've identified a profound and subtle metacognitive challenge in clinical reasoning. "Autoscopic Error" captures its essence: a pathological loop where the feeling of certainty is both the symptom and the sustaining mechanism of the error, creating a unique barrier to correction that demands specific, often indirect, pedagogical and systemic interventions.
