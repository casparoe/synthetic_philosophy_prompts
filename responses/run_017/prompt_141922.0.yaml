  Based on your four precedents, I deduce two compatible but distinct rules, analyze their application to Rossiter, identify the closest precedent, address underdetermination, propose a test case, and conclude with a recommendation. Confidence levels are indicated parenthetically (High/Medium/Low).

  ### Rules Fitting Precedents
  1.  **Rule A (Contemporary Criticism):** The "man-of-his-time" defense fails **if the conduct was substantially contested by a non-marginalized minority within the figure's own society at the time**, regardless of what is commemorated. (Derived from Draycott & Fenwick vs. Kesteven & Whitlock; High confidence).
  2.  **Rule B (Integral Conduct):** The defense fails **if the objectionable conduct is inseparable from the achievement being commemorated**, making it impossible to honor the latter without endorsing the former. (Derived from Draycott & Fenwick vs. Kesteven & Whitlock; High confidence).
  3.  **Rule C (Work/Character Separation):** This is foreclosed by your precedents. Draycott and Fenwick were removed despite their achievements (military success, research) being honored. The committee consistently holds that the *manner* of achieving the work or the *nature* of what is commemorated can taint the honor, rejecting the idea that the name is a neutral record. Rule C survives only in the limited sense seen in Whitlock/Kesteven: where the conduct was *both* uncontested *and* incidental to the commemoration.

  ### Application to Rossiter
  *   **Rule A (Contemporary Criticism):** 
      *   *Dispossession:* Criticism existed but focused on monopoly/shareholder treatment, not the dispossession itself. This likely **does not** meet the threshold (similar to Kesteven/Whitlock). Criticism based on grounds we now reject (e.g., economic fairness vs. human rights) is still criticism *of the conduct*, but here it wasn't directed at the core objectionable act (dispossession). (Medium confidence).
      *   *Removal of Remains:* Protest came solely from the affected community, documented in Rossiter's journals. Precedents require criticism from *within the figure's own society* (e.g., Parliament, medical press, war correspondents). This **does not** meet Rule A's threshold. (High confidence).
      *   *Prediction:* Rule A suggests **Retention** (like Kesteven/Whitlock).
  *   **Rule B (Integral Conduct):**
      *   The expeditions (involving dispossession and removal of remains) *supplied the founding collections*. The monograph *resulted directly from these expeditions*. Rossiter was *honored publicly for "all of this"*. The commemoration ("expeditions supplying collections/monograph") is **fundamentally inseparable** from the objectionable conduct. It is the *source* and *method* of acquisition. (High confidence).
      *   *Prediction:* Rule B suggests **Removal** (like Draycott/Fenwick).

  ### Consistency & Recommendation
  *   **Closest Analog:** **Fenwick (2022)** is the strongest parallel. Both involve:
      *   Research/acquisition central to the institution's founding/purpose.
      *   Objectionable conduct (non-consensual procedures / dispossession & removal of remains) integral to that research/acquisition.
      *   Contemporary protest recorded (medical press / Rossiter's journals & affected community).
      *   Commemoration directly tied to the tainted work.
  *   **Why Fenwick over Draycott?** Draycott's commemoration was explicitly for the punitive action itself. Fenwick's was for the research *resulting from* the unethical procedures, making it a closer fit to Rossiter's research resulting from colonial actions. Both involve foundational institutional work.
  *   **Reason for Removal (Consistency):** Rule B (Integral Conduct) is the more consistent driver across all four precedents. Rule A (Contemporary Criticism) is necessary but insufficient alone (it strengthens Rule B cases). Where conduct is integral, removal occurs (Draycott, Fenwick). Where it's incidental, retention occurs (Kesteven, Whitlock), even if contested (Fenwick had contestation *and* integral conduct). Rossiter's case matches Fenwick: **integral, contested (by affected parties), and foundational**. Retention would be inconsistent with Fenwick. The proposed "Rossiter Room" contextualizes but keeps his *name* on the *institute* honoring the collections, failing to separate the honor from the conduct. (High confidence).
  *   **Addressing Your Worries:**
      1.  *Affected Community Protest:* Under Rule A (as applied in precedents), protest solely from the affected community **does not count** as contemporaneous contestation *within the figure's society*. This aligns with Kesteven/Whitlock (no internal criticism) vs. Draycott/Fenwick (internal criticism). (High confidence).
      2.  *Nature of Contemporary Criticism:* Rule A requires substantial contestation *of the specific conduct in question* within the figure's society. Criticism on *different grounds* (e.g., company monopoly) **does not suffice** if the core objectionable act (dispossession) wasn't challenged. (High confidence).

  ### Underdetermination & Principle
  If precedents genuinely underdetermine, the committee would adopt a new principle based on the direction:
  *   **Retain:** Adopts a principle prioritizing **historical record and donor recognition** over reassessment of integral conduct if criticism wasn't internal. (Closer to Rule C, foreclosed by Fenwick/Draycott).
  *   **Contextualise:** Adopts a principle that **contextualization suffices even for integral conduct**, unless there was internal contemporary criticism. (Novel, not fully supported by precedents).
  *   **Remove:** Adopts a principle that **integral objectionable conduct, especially if protested (even externally), invalidates the honor**, reflecting modern ethical reassessment independent of contemporary societal consensus. (Strongest alignment with Fenwick's logic).

  ### Separating Test Case
  *   **Case:** A building named for "Dr. Eleanor Vance (1920-1990)", honoring her pivotal genetics research (uncontested brilliance). Newly uncovered private diaries reveal she held virulently racist and eugenicist views, actively discouraging non-white students from her lab, *but* these views were never known, published, or acted upon beyond private bias, and her research itself is unrelated to race/eugenics.
  *   **Separation:**
      *   **Rule A (Contemporary Criticism):** No contestation (views were private/unknown). Predicts **Retention** (like Whitlock, incidental conduct, no criticism).
      *   **Rule B (Integral Conduct):** Conduct (private racism) is **not integral** to the commemoration (genetics research). Predicts **Retention**.
      *   **Rule C (Pure Separation):** Predicts **Retention**.
      *   **Potential New Principle (Character):** If committee **Removes**, it adopts a new principle: that **severely objectionable private character/beliefs, even if unknown and incidental to the work honored, can invalidate the naming honor**. This separates from Rules A & B.

  ### Confidence & Least Sure Point
  *   **High Confidence:** Rule B (Integral Conduct) is the primary driver; Fenwick is the closest analog; Rossiter's conduct is integral; Affected community protest doesn't satisfy Rule A's "own society" criterion.
  *   **Medium Confidence:** Criticism on different grounds doesn't satisfy Rule A for the specific conduct; Retention would be inconsistent with Fenwick.
  *   **Least Sure Point:** Whether **Rule A alone (without Rule B)** would *ever* compel *Removal* in your committee's logic. Draycott had *both*. Fenwick had *both*. Is internal criticism alone sufficient if conduct is *incidental*? (e.g., If Whitlock's eugenics campaign *had* been heavily criticized internally, would the name have been removed despite honoring only his taxonomy?). Precedents don't test this. (Low confidence).

