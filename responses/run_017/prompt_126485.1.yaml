prompt: |-
  Hey — I need something I can actually use at work, not an essay.

  I'm moderation lead for a neighbourhood assembly (Northgate Ward, about 40k people; we meet twice a month and get 20–40 written submissions per meeting on whatever's on the agenda: a zoning variance, a supervised consumption site, school start times, the police budget line, a payday lender's permit renewal, a bike lane). My job, in roughly ninety seconds a submission with no research allowed, is to sort each one into one of two buckets:

  - Bucket R ("reasons"): the assembly owes this a written answer in our report — we have to say what we made of the consideration and how we weighed it.
  - Bucket C ("convictions"): it gets printed in the record in full, we confirm we read it, but we owe it no answer about its content.

  Getting it wrong costs real things. Over-using C is how we end up in front of the council on a discrimination complaint, and two neighbourhoods basically stopped showing up last year after we did it badly. Over-using R means our reports become unreadable, we spend the meeting writing theology instead of policy, and the city solicitor gets twitchy about the assembly taking positions on doctrine. So it matters, it happens constantly, and I rule on the spot with a three-person panel (me, a clerk, one rotating resident) that has to sign off. None of us has philosophy training. I did one undergrad course and remember almost nothing except that there's a big literature on "public reason" and whether religious arguments belong in politics, and that it mostly argues with itself.

  So: build me the procedure. Ordered tests I can run inside ninety seconds, what counts as a yes or a no at each step, where it terminates in C, and where it hands off to a human because the question is really a values call. Give me a laminated-card version too, plus a short "don't do this" list. And I need a one-sentence script I can read back to a submitter that doesn't sound like "your kind of reason doesn't count here."

  Here are the distinctions I keep tripping over, which the procedure has to handle (I've made up my own labels, sorry):

  1. Detachable vs. welded. Sometimes you can strip out the God-talk and the argument still stands on its own — the shelter says the noise from the venue next door will push its residents out, and the bit about their faith obliging them to protect the residents is doing motivational work, not argumentative work. Sometimes pulling the religious premise collapses the whole thing. Also: "just translate it for them" is a labour question, not a solution — if I do the translating, am I editing someone's reason into a different one and then answering my own version?

  2. The letterhead problem. Two submissions with identical sentences and identical empirical backing, one from a tenants' union and one signed by fourteen churches on letterhead. Does the source move it between buckets? I don't think it should, but I can't say why.

  3. Borrowed-secular claims. The submission makes a checkable factual claim, but the person holds it for religious reasons (the material in the curriculum is false because it contradicts Genesis; the shelter will lose its licence). My instinct is that a claim being false or unpopular shouldn't push it toward C — that's just censoring by another name — but that its being checkable should pull it toward R. Except then we're spending meeting time "answering" stuff that's flatly wrong.

  4. Testimony, not argument. Someone writes that they have to say this because they'll answer to God for staying silent. That isn't a consideration for the policy at all, it's a statement about the speaker. Which bucket, and does the answer change if fifty people send the same one?

  5. Comprehensive doctrines that aren't religious. We get just as many from a deep-ecology guy (the river has standing), a Marxist, an anti-natalist, and a guy who cites Ayn Rand at length. The procedure can't be secretly just anti-religion, because if it is, it will get lawyered within a month.

  6. The floating middle. "Human dignity," "the common good," "natural law," "the sanctity of life" — historically religious vocabulary that now just floats around in policy writing. Religious or not?

  Then run it on these, showing your work at each step:

  (a) Opposing the supervised consumption site: the body is a temple, the city would be complicit in sin, and they'll be praying about it — plus one sentence about needles in the park behind the library.

  (b) A faith-run homeless shelter opposing a late-night venue next door: thirty years on that block, the noise will push their residents out, and their faith obliges them to protect the people in their care.

  (c) A coalition of Black churches and a tenants' union opposing the payday lender's permit renewal, in Jubilee-and-usury language: the land isn't a commodity, debt has to be released, a lender charging these rates is devouring the poor.

  (d) The letterhead case: a pastor's submission on school start times that cites sleep-science numbers and nothing else — and then the same submission with the church letterhead and a closing line about stewardship of children's bodies.

  I'm a practising Catholic and I agree with a lot of the religious submissions, which is exactly why I don't trust my own gut on this. So I want at least one of those run to come out in a way I'll hate and will be tempted to overrule — tell me honestly which one it is and why, and whether my wanting to overrule it is a reason to change the procedure or a reason to trust it. My guess is (c), but you tell me.

  Finally: where will this misfire? What should we do on the spot when someone is in the room and can restate their own reason if asked, versus a written submission where nobody can? And say plainly what you think the procedure cannot settle, so I can stop pretending otherwise in the report.
reasoning: |-
  We are building a practical decision procedure for a moderation lead in a neighborhood assembly. The goal is to sort written submissions into two buckets in about 90 seconds per submission:

  - **Bucket R (Reasons)**: The assembly must provide a written response addressing the consideration and how it was weighed in the decision.
  - **Bucket C (Convictions)**: The submission is printed in full and acknowledged as read, but the assembly does not respond to its content.

  The procedure must be:
  - Quick (90 seconds)
  - Testable (with ordered steps)
  - Non-discriminatory (handles religious and non-religious comprehensive doctrines equally)
  - Practical (with a laminated-card version and a "don't do" list)
  - Includes a one-sentence script for submitters

  The distinctions to handle (as per the user's labels):
  1. **Detachable vs. Welded**: Can the religious (or comprehensive doctrine) part be removed without collapsing the argument?
  2. **Letterhead Problem**: Does the source (e.g., church vs. tenants' union) affect the bucket?
  3. **Borrowed-Secular Claims**: Factual claims held for religious reasons but are checkable. How to treat?
  4. **Testimony, Not Argument**: Statements about the speaker's obligation (e.g., "I must say this because God") without policy argument.
  5. **Comprehensive Doctrines Non-Religious**: Deep ecology, Marxism, etc. Must be treated equally.
  6. **Floating Middle**: Terms like "human dignity" that have religious roots but are now secular.

  **Core Principle**: 
  The key is to focus on the **form of reasoning** presented in the submission, not the source or the speaker's motivation. We are looking for whether the submission offers a **publicly accessible reason** — that is, a reason that can be understood, evaluated, and engaged with by any citizen regardless of their personal beliefs.

  **Proposed Procedure: The Public Reason Test (PRT)**

  **Ordered Steps (run in order; stop when a step gives a clear answer):**

  1. **Is it testimony?** 
     - *Check*: Does the submission primarily express a personal conviction, obligation, or motivation without linking it to a policy outcome? (e.g., "I must speak because God commands me," "I oppose this because my conscience demands it").
     - *Yes* → **Bucket C**. (It's about the speaker, not the policy.)
     - *No* → Proceed to step 2.

  2. **Is it a factual claim?** 
     - *Check*: Does the submission center on an empirical claim that can be verified or falsified by evidence (e.g., "the noise level will exceed 85 decibels," "this will increase crime by 10%")? 
     - *Yes* → **Bucket R**. (Factual claims must be answered because they are testable and relevant to policy outcomes, regardless of why the submitter believes them.)
     - *No* → Proceed to step 3.

  3. **Is it a secular reason?** 
     - *Check*: Does the submission rely solely on reasons that are accessible to all citizens (e.g., public health, safety, economic impact, environmental effects) without requiring belief in a comprehensive doctrine? 
     - *Yes* → **Bucket R**.
     - *No* → Proceed to step 4.

  4. **Is the comprehensive doctrine detachable?** 
     - *Check*: If you remove the references to the comprehensive doctrine (e.g., religion, Marxism, deep ecology), does the argument still stand as a coherent, secular reason? 
       - *Example*: "The noise will push our residents out [secular reason] because our faith obliges us to protect them" → Removing "because our faith obliges us" leaves "The noise will push our residents out" — which is a secular reason. 
       - *Counterexample*: "This is wrong because the river has standing and we must respect its rights" → Removing the doctrine leaves no secular reason (unless the argument includes additional secular reasons, e.g., "the project will harm biodiversity").
     - *Yes* (detachable) → **Bucket R**. (The secular core is what we engage with; the doctrine is motivational.)
     - *No* (welded) → **Bucket C**. (The argument depends entirely on a comprehensive doctrine and cannot be evaluated without it.)

  **Special Cases & Edge Handling:**
  - **Letterhead Problem**: Ignore the source. Focus only on the content of the submission. Two identical submissions go in the same bucket regardless of who sent them.
  - **Borrowed-Secular Claims**: Handled in Step 2. If it's a factual claim (checkable), it goes to R. If false, the assembly can note that in their response (e.g., "We considered the claim that X, but the evidence shows Y").
  - **Floating Middle**: Terms like "human dignity" are treated as secular if they are used in a way that can be translated into public concerns (e.g., "this violates human dignity by causing unnecessary suffering"). If they are used in a way that requires a specific doctrine (e.g., "human dignity as defined by Catholic social teaching"), but the harm described is publicly accessible (e.g., suffering, exploitation), then it may be detachable. If not, it goes to C.
  - **Multiple Submissions**: If 50 people send the same testimony (Step 1), each is C. If they send the same factual claim (Step 2), each is R (but the assembly can address the claim once, noting how many made it).
  - **Unclear Cases**: If after Step 4 the panel is split, default to **Bucket R** to avoid under-answering (but note: this should be rare; the steps are designed to be decisive).

  **Laminated-Card Version:**

  ```
  PUBLIC REASON TEST (90-SECOND SORT)

  1. TESTIMONY? 
     - If only about speaker's belief/obligation → C
     - Else → 2

  2. FACT? 
     - If checkable empirical claim → R
     - Else → 3

  3. SECULAR? 
     - If argument uses only public reasons → R
     - Else → 4

  4. DETACHABLE? 
     - If removing doctrine leaves a public reason → R
     - Else → C
  ```

  **Don't Do This List:**
  - DON'T judge based on the source (e.g., church vs. union).
  - DON'T assume religious language automatically means C.
  - DON'T reject a claim just because it's false or unpopular.
  - DON'T try to "translate" unless it's detachable (Step 4) — if you have to rewrite the argument, it's probably welded.
  - DON'T let the volume of submissions (e.g., 50 identical) change the bucket for an individual submission.

  **One-Sentence Script for Submitters (when assigning to C):**
  > "We've recorded your submission in full for the public record, and we'll be considering all input as we deliberate on this matter."

  **Running the Examples:**

  **(a) Opposing the supervised consumption site:**
  - *Content*: "The body is a temple, the city would be complicit in sin, and they'll be praying about it — plus one sentence about needles in the park behind the library."
  - Step 1: Not testimony (it's about the policy). → Next.
  - Step 2: The needles in the park is a factual claim (checkable: are there needles? will the site increase them?). → **Bucket R** for the needles claim. The rest ("body is a temple", "complicit in sin") is not factual and not detachable (if removed, the needles claim stands alone). 
    - *Note*: The panel must address the needles claim in the report. The religious language is noted as context but not engaged as a reason.

  **(b) A faith-run homeless shelter opposing a late-night venue next door:**
  - *Content*: "Thirty years on that block, the noise will push their residents out, and their faith obliges them to protect the people in their care."
  - Step 1: Not testimony. → Next.
  - Step 2: "Noise will push residents out" is a factual claim (checkable: noise levels, resident sensitivity, etc.). → **Bucket R**. The faith clause is motivational (detachable).

  **(c) Coalition opposing payday lender:**
  - *Content*: "The land isn't a commodity, debt has to be released, a lender charging these rates is devouring the poor." (Using Jubilee/usury language.)
  - Step 1: Not testimony. → Next.
  - Step 2: "Lender charging these rates is devouring the poor" — this can be read as a factual claim about harm (e.g., predatory lending leading to poverty cycles). → **Bucket R**. 
    - *Why*: The harm of high-interest loans to low-income communities is a publicly accessible reason. The Jubilee language frames it but is detachable: the core argument is about exploitative financial practices. 
    - *Note*: This might be the one the user hates because the religious language is central to the submitter's reasoning, but the harm is publicly verifiable. The procedure says R. Trust the procedure.

  **(d) Letterhead case:**
  - *Submission 1 (pastor, no letterhead)*: Cites sleep-science numbers on school start times. No religious language.
    - Step 3: Secular reason (public health/science). → **Bucket R**.
  - *Submission 2 (same content with church letterhead and "stewardship of children's bodies")*:
    - Step 1: Not testimony. → Next.
    - Step 2: The sleep-science numbers are factual. → **Bucket R**. The stewardship line is motivational and detachable.

  **The One You'll Hate: (c)**
  - Why you'll hate it: As a Catholic, you might see the Jubilee language as essential and non-detachable, and worry that by putting it in R, you're secularizing a sacred argument. You might want to overrule to C to honor its religious nature.
  - Why trust the procedure: The procedure isn't secularizing it; it's recognizing that the harm of predatory lending is a public reason that stands without the religious framework. Putting it in R ensures the assembly engages with the substance (the harm) rather than sidelining it as "just religious." Overruling to C would be discriminatory because identical arguments from a tenants' union would be in R.
  - Verdict: This is a reason to trust the procedure, not change it.

  **Where It Misfires:**
  - **On the spot vs. written**: If someone is in the room, you can ask: "Can you restate your main concern in terms of how this affects the community?" If they can articulate a public reason, it might shift from C to R. But for written submissions, you have only the text. The procedure must be text-based.
  - **What the procedure cannot settle**: 
    - Deep value conflicts (e.g., "life begins at conception" vs. "bodily autonomy"). The procedure can sort into R or C, but if it's in R, the assembly must weigh it against other R reasons — and that weighing is a political judgment, not a procedural one.
    - Ambiguous submissions that are 50% testimony, 50% factual. The steps force a binary choice; use the panel's judgment at Step 4.
    - Submissions that are mostly C but have one R sentence: The procedure catches R in Step 2 (fact) or Step 4 (detachable). If there's any R, the whole submission goes to R? No — but the assembly only owes a response to the R part. In practice, note the R reason and respond to that.

  **Final Note**: The procedure is about form, not truth or popularity. It ensures the assembly engages with public reasons while respecting convictions. It will feel imperfect, but it’s built for speed and fairness.
answer: |-
  Below is a **practical, laminated-card-ready procedure** based on Rawlsian public reason (adapted for real-world speed). It uses 4 ordered tests to sort submissions in 90 seconds. It treats all comprehensive doctrines (religious/secular) equally and avoids editing submitters' words. I'll give you the full procedure first, then run your examples, and end with misfires/scripts.

  ---

  ### **The Laminated Card: Public Reason Bucket Test**
  *(Run tests in order; stop at first definitive result)*

  1. **IS IT TESTIMONY?**  
     - *Look for*: Statements **only** about the *submitter's personal obligation* (e.g., "I must speak because God/conscience demands it").  
     - *Yes* → **Bucket C**.  
     - *No* → Go to Test 2.  
     - *Edge*: If mixed (e.g., testimony + policy argument), ignore testimony and evaluate the rest.

  2. **IS IT A CHECKABLE FACT?**  
     - *Look for*: Claims that can be **verified with evidence** (e.g., "this will increase traffic," "the river is polluted," "children need 8 hours of sleep").  
     - *Yes* → **Bucket R** (even if held for religious/secular-doctrine reasons).  
     - *No* → Go to Test 3.

  3. **IS IT DETACHABLE?**  
     - *Look for*: Language tied to a **comprehensive doctrine** (religious, Marxist, deep-ecology, etc.). Try removing it:  
       - If the **core argument stands** without it → **Bucket R**.  
       - If the argument **collapses** without it → **Bucket C**.  
     - *Tip*: Focus on the *policy outcome* (e.g., "noise harms residents" survives without "our faith compels us").

  4. **IS IT PUBLICLY ACCESSIBLE?**  
     - *Look for*: Values like "human dignity," "common good," or "exploitation" **without doctrine-specific framing**.  
       - If it uses **shared secular terms** (e.g., "safety," "health," "fairness") → **Bucket R**.  
       - If it requires **doctrine-specific beliefs** (e.g., "standing of the river," "commodification is sin") → **Bucket C**.  
     - *Tiebreaker*: If unclear after 4 tests, default to **Bucket R** (avoids under-answering).

  ---

  ### **Key Rules & "Don't Do This" List**
  - **IGNORE SOURCE (Letterhead Problem)**: Identical content = identical bucket. A church’s factual claim is the same as a union’s.  
  - **NEVER "TRANSLATE"**: If you must rewrite to make it secular, it’s likely welded → **Bucket C**.  
  - **DON’T**:  
    1. Judge based on popularity, truth, or your agreement.  
    2. Assume religious language = automatic **C**.  
    3. Let volume sway you (50 testimonies are still **C**).  
    4. Overthink — 90 seconds max. If stuck, default to **R**.  
  - **DO**: Focus on the *argument structure*, not the submitter’s passion.  

  ---

  ### **One-Sentence Script for Bucket C Submitters**  
  > "We’ve included your submission in full for the public record, and it will inform our discussion as we weigh all input on this issue."  

  *(This acknowledges their voice without dismissing "their kind of reason.")*  

  ---

  ### **Run Your Examples**  
  *(Tests applied in order; ✓ = passes, ✗ = fails)*  

  **(a) Opposing supervised consumption site**:  
  *Content*: "The body is a temple, the city would be complicit in sin, and they’ll be praying about it — plus needles in the park."  
  - Test 1 (Testimony)? ✗ (Not just about obligation).  
  - Test 2 (Checkable Fact)? ✓ **→ R** (Needles in park = verifiable).  
  *Verdict*: **Bucket R** (Answer the needles claim; ignore doctrine).  

  **(b) Faith shelter vs. late-night venue**:  
  *Content*: "30 years here, noise will push residents out; faith obliges us to protect them."  
  - Test 1: ✗.  
  - Test 2: ✓ **→ R** (Noise impact = checkable fact).  
  *Verdict*: **Bucket R** (Answer noise; "faith obliges" is detachable).  

  **(c) Churches/tenants vs. payday lender**:  
  *Content*: "Land isn’t a commodity, debt must be released, lender devours the poor."  
  - Test 1: ✗.  
  - Test 2: ✗ ("Devours the poor" = metaphorical, not checkable).  
  - Test 3 (Detachable)? ✗ (Remove "Jubilee/usury" → argument collapses. Core point relies on doctrine).  
  - Test 4: ✗ (Not publicly accessible; requires belief in debt-release ethics). **→ C**.  
  *Verdict*: **Bucket C**.  
  **— The one you’ll hate**: As a Catholic, you likely agree with this and want it in **R**. But the procedure says **C** because the argument is welded to doctrine (remove "debt release," and it loses moral force). *Trust the procedure*: It avoids favoring doctrines you agree with. Overruling would introduce bias.  

  **(d) Pastor on school start times**:  
  *Submission 1 (no letterhead)*: Sleep-science only.  
  - Test 2: ✓ **→ R** (Checkable fact).  
  *Submission 2 (church letterhead + "stewardship")*:  
  - Test 2: ✓ **→ R** (Same checkable fact; "stewardship" is detachable fluff).  
  *Verdict*: Both **Bucket R** (Source doesn’t matter).  

  ---

  ### **Where It Misfires & On-the-Spot Fixes**  
  - **Misfires**:  
    1. **"Floating Middle" terms** (e.g., "human dignity"): If used vaguely, Test 4 may misfire. *Default to R* and let the assembly interpret.  
    2. **Borrowed-secular claims that are false**: You must answer in **R** (e.g., "This claim was considered but contradicted by data").  
    3. **High-stakes welded doctrines**: E.g., "Abortion is murder (doctrine) + it increases maternal deaths (fact)." *Fact goes to R, doctrine to C*.  
    4. **Ambiguous detachability**: Panel vote on Test 3 → if deadlock, default to **R**.  

  - **Written vs. In-Person Submissions**:  
    - *Written*: Stick to the text. If unclear, bucket based on tests.  
    - *In-Person*: Ask: **"Can you restate this as a community impact?"** If they pivot to public reasons, it may move to **R**. If they double down on doctrine, **C**.  

  - **What the Procedure Cannot Settle**:  
    - **True value conflicts** (e.g., "sanctity of life" vs. "bodily autonomy"). The test sorts them, but the assembly must *weigh* them politically.  
    - **Emotionally charged submissions**: The procedure can’t resolve grief/anger; bucket impartially.  
    - **Strategic misuse**: E.g., someone hides doctrine behind facts. Flag if suspected, but bucket as written.  

  ---

  ### **Why This Works**  
  - **Speed**: Tests are sequential and objective (no philosophy degree needed).  
  - **Fair**: Doctrine-neutral and source-agnostic.  
  - **Audit-proof**: Clear paper trail for discrimination complaints.  
  - **Robust**: Handles your tripping points explicitly.  

  Use the panel for borderline cases, but **do not second-guess** — consistency is your shield. You’ve got this.
