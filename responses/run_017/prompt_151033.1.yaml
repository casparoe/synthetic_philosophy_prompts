prompt: |-
  I am a professor of philosophy who teaches, among other things, the theory of rules and legal systems, and for the past three years I have also served — unpaid, and increasingly against my better judgment — as parliamentarian to a learned society of about 1,100 members whose constitution is now amended at nearly every annual general meeting, and whose members have lately discovered the pleasures of amending the amendment rule itself. Our governing document is short but has accreted: Article 9.1 says the constitution may be amended at an annual general meeting by two thirds of the votes cast; 9.2, inserted later and never reconciled with 9.1, says Articles 1–8 may be amended by a simple majority at any general meeting; 9.3 says Article 9 may itself be amended only by a three-quarters vote with written notice given at the preceding annual general meeting; and 9.4 says no amendment may abolish or restrict the right of any member to vote at a general meeting. An amendment carried in 2019 added a supremacy sentence to 9.1 providing that no later amendment inconsistent with 9.4 shall be valid. My job is to rule, on the spot and in front of the room, on whether a proposed amendment is in order and what threshold it needs; I have about fifteen minutes in the meeting itself, a one-page written ruling afterwards, a tellers' committee of lay volunteers who must be able to follow the reasoning, and a council that will ratify whatever I say unless a member stands up and makes it look arbitrary. I have been working with a rule of thumb — an amendment must satisfy whichever amending provision was in force when it was moved — and it has now broken down twice, so I want something better.

  What I would like from you is a decision procedure I can actually run, not a survey of jurisprudence: the questions in order, what would count as a sufficient answer to each, where the procedure returns a hard no, and where it stops and hands the question to a person because it is a question of values rather than of rules. Please build in at least the distinctions I keep having to improvise: between the route an amendment takes (the procedure used to adopt it) and its target (what it changes), and hence between amendments that are level-preserving and those that change the level of the rule they travel by; between an amendment that is properly adopted but reckless and one that is simply not valid; between the question I decide at the microphone (is this in order, what threshold applies) and the question that survives the meeting (was it validly made), since I cannot pronounce on the second with any finality; and — the case that cost me the most sleep — between an amendment that changes a protected provision directly and one that leaves its words alone while achieving its defeat by indirection. Also tell me what to do about sequencing: when two amendments are carried at the same meeting, does the second have to satisfy the rule as it stood when the meeting opened or as the first one left it; may a single resolution amend the threshold and immediately rely on the threshold it creates; if part of a resolution is valid and part not, do I sever or strike the whole; and how do I handle a resolution that conditions its own amendment rule on the assent of a body the same resolution creates. Then run the procedure on four cases: (A) a resolution carried 68–32, with no prior notice, to delete the notice requirement in 9.3; (B) a resolution carried 55–45 to lower 9.1's threshold to a simple majority; (C) a resolution carried 81–19 to amend Article 3 so as to create a class of dues-paying affiliate members with no vote at general meetings, leaving 9.4 textually untouched; (D) a properly noticed resolution carried with 78 per cent to lower 9.1 to a simple majority, followed twenty minutes later by an amendment to Article 6 carried 51–49. I want at least one case where the procedure yields an answer I will not like — I would rather have that than a procedure that quietly lets me reach the conclusion I prefer — and I want an explicit statement of what the procedure cannot settle at all.

  One more thing, since I will be handing this to colleagues who know the literature as well as I do. For each step, please mark whether it follows from something reasonably settled about how systems of rules work, or whether it quietly embeds a contestable theoretical view — for instance about whether a power that the rules constitute can alter the conditions of its own exercise, whether entrenchment is genuinely possible in a system with no higher law above it, or whether a provision can bind the validity of amendments that come after it. Where a step rests on a contestable view, say so, name the rival view, and tell me what ruling it would produce instead on the same case. Do not smooth a live dispute into settled doctrine, and do not give me citations or reading suggestions: I have no library in the room where I need this, and a bibliography would be of no use to the tellers.
reasoning: |-
  We are given the following constitutional provisions:

  Article 9.1: The constitution may be amended at an annual general meeting by two thirds of the votes cast.
  Article 9.2: Articles 1–8 may be amended by a simple majority at any general meeting.
  Article 9.3: Article 9 may itself be amended only by a three-quarters vote with written notice given at the preceding annual general meeting.
  Article 9.4: No amendment may abolish or restrict the right of any member to vote at a general meeting.

  Additionally, a supremacy sentence in 9.1 (added in 2019) states: "no later amendment inconsistent with 9.4 shall be valid."

  The user, as parliamentarian, needs a decision procedure for ruling on proposed amendments during the meeting. The procedure must address:

  1. The distinction between the route (procedure used) and the target (what is changed).
  2. Level-preserving amendments vs. those that change the level of the rule they travel by.
  3. Properly adopted but reckless amendments vs. invalid ones.
  4. The ruling at the microphone (is it in order, what threshold) vs. the question of ultimate validity (which the parliamentarian cannot finally decide).
  5. Direct changes to protected provisions vs. indirect defeats.

  Also, sequencing issues:

  a. When two amendments are carried at the same meeting, which rule applies to the second? (as at meeting start or after first amendment?)
  b. Can a single resolution amend the threshold and then immediately use that new threshold?
  c. If part of a resolution is valid and part not, do we sever or strike the whole?
  d. How to handle a resolution that conditions its own amendment rule on the assent of a body it creates.

  We are to test the procedure on four cases (A, B, C, D) and have at least one case where the answer is not liked.

  The procedure must also note for each step whether it is settled or contestable, and if contestable, name the rival view and its outcome.

  ---

  Decision Procedure for Ruling on Proposed Amendments:

  I. **Preliminary Questions** (to be asked in order):

  1. **Is the proposed amendment within the scope of the constitution?** 
     - If not, rule it out of order. (This step is settled: an amendment must be germane to the constitution.)

  2. **What is the target of the amendment?**
     - Identify which article(s) are being amended. 
     - Note: If the amendment targets Article 9 (the amendment rule itself), then 9.3 applies. If it targets Articles 1-8, then 9.2 applies. If it targets the entire constitution (without being limited to 1-8) then 9.1 applies. But note that 9.2 is a lower threshold for 1-8, so if the amendment only targets 1-8, it can be done under 9.2. However, if the amendment targets both 1-8 and 9, then we must consider the higher requirements (because 9 is involved).

  3. **Determine the required route (procedure) for the target.**
     - For target in Articles 1-8: the required route is simple majority (from 9.2) OR two-thirds (from 9.1). But note: 9.2 is a specific provision for 1-8 and 9.1 is general. The specific provision (9.2) should prevail over the general (9.1) by standard interpretation. Thus, for 1-8, the required route is simple majority at any general meeting (without notice requirement, unless the meeting is not annual and 9.2 requires a general meeting, which can be any). 
     - For target in Article 9: the required route is three-quarters vote with prior notice (9.3).
     - Additionally, regardless of the target, the amendment must not violate 9.4 (which prohibits abolishing or restricting voting rights) and the supremacy clause in 9.1 (which invalidates any amendment inconsistent with 9.4).

     - **Contestable point**: The relationship between 9.1 and 9.2. One view (specific over general) is that 9.2 controls for 1-8. Another view is that 9.1 is the general rule and 9.2 is an exception that must be strictly construed. However, the specific-over-general principle is widely accepted in legal interpretation. 
       - Rival view: If 9.2 is seen as an amendment to 9.1 (which it is, being inserted later), then it might be that 9.2 is the governing rule for 1-8. But note that 9.1 and 9.2 are not reconciled. The parliamentarian must choose an interpretation. We'll use specific over general.

  4. **Check for indirect violation of 9.4.**
     - Does the amendment, even if not directly changing 9.4, have the effect of abolishing or restricting voting rights? If so, it is prohibited by 9.4 and the supremacy clause. 
     - **Contestable point**: The scope of 9.4. One view (narrow) is that it only prohibits amendments that explicitly change the text of 9.4 or that explicitly remove or restrict voting rights. Another view (broad) is that it prohibits any amendment that in substance has that effect, regardless of textual change. The supremacy clause says "inconsistent with 9.4", which suggests a substantive test. This is contestable. 
       - Rival view (narrow): Only direct textual changes to voting rights provisions are prohibited. 
       - Our procedure will use the broad view because the supremacy clause refers to "inconsistent with 9.4", and 9.4 is a substantive rule. But note: the parliamentarian must rule on the spot, so we must look at the face of the amendment and its obvious effects. If the effect is not clear from the face, the parliamentarian might have to let it go to a vote and then the ultimate validity might be challenged later.

  5. **Check the required notice.**
     - If the target is Article 9, then prior notice (at the preceding AGM) is required (9.3). For other targets (1-8), no notice is required by 9.2, but note that 9.1 (if it applied) does not require notice for non-Article 9 amendments. However, 9.2 does not require notice. So for 1-8, no notice is required.

  6. **Sequencing and self-reference issues** (when multiple amendments at the same meeting or self-amendment):
     a. **Order of amendments at the same meeting**: The rule in force at the time the meeting opened applies to each amendment. Why? Because until an amendment is adopted, it does not change the rules for subsequent business at the same meeting. This is a settled parliamentary principle: the rules at the beginning of the meeting govern the entire meeting unless the meeting agrees to suspend the rules. 
        - **Contestable?** Some might argue that once an amendment is passed, it immediately changes the rule. But in parliamentary procedure, amendments take effect after the meeting, unless specified otherwise. So for the rest of the meeting, the old rules apply. This is the safer view and avoids confusion. 
        - Rival view: An amendment takes effect immediately upon adoption, so subsequent amendments are governed by the new rule. This could lead to chaos if multiple amendments are considered. We reject this view for stability.

     b. **Self-amendment in a single resolution**: A resolution that amends the threshold and then uses that new threshold in the same resolution is invalid. Why? Because the new threshold is not in effect until the resolution is adopted, but the resolution must be adopted under the old threshold. This is settled: a rule cannot be changed by the rule it creates until the change is complete. 
        - Example: If a resolution says "lower the threshold for amendment to simple majority and then amend article X by simple majority", then the entire resolution must meet the old threshold (two-thirds for general amendment, or if it amends 9.1 then three-quarters with notice). The part that amends the threshold must be adopted first, and then the next part would be considered under the new threshold, but they cannot be in the same motion. 
        - Therefore, such a resolution must be ruled out of order. It must be split.

     c. **Severability**: If part of a resolution is valid and part is invalid, the parliamentarian must rule the entire resolution out of order if the parts are not separable. If they are separable (i.e., the valid part can stand alone and the invalid part is not essential to it), then the valid part may be considered separately. But if the resolution is presented as a whole, and the parts are interdependent, then the whole must be struck. This is settled parliamentary practice.

     d. **Conditional amendment creating a new body**: A resolution that creates a new body and conditions the amendment rule on that body's assent is problematic. The condition cannot be fulfilled until the body is created, but the amendment rule change is part of the same resolution. This is self-referential and circular. The parliamentarian should rule it out of order because it attempts to change the amendment rule in a way that requires an external event (the new body's assent) that does not exist at the time of the vote. The amendment rule must be changed by the current rules, and the condition is not part of the current rules. This is contestable. 
        - Rival view: The resolution is valid if it passes under the current rules, and then the condition will apply to future amendments. But the condition itself is being adopted now. However, the condition would make future amendments contingent on the new body, which is not yet created? Actually, the resolution would create the body and then condition the amendment rule on that body. But the condition is part of the amendment rule. 
        - Our ruling: The resolution must be ruled out of order because it creates an unworkable condition: the new body may not exist until after the resolution is passed, so the condition cannot be evaluated at the time of adoption. Alternatively, the condition might be seen as a substantive change to the amendment rule and must meet the requirements for amending Article 9. But then the condition is valid if passed under 9.3. However, the condition does not by itself restrict voting rights, so it might be allowed. But note: if the condition requires the assent of a non-member body, that might be seen as restricting the members' right to amend, which might be protected by 9.4? Not directly. 
        - This is complex and context-dependent. The parliamentarian should rule it out of order for lack of clarity and potential for conflict with the current rules.

  II. **The Decision Tree for Ruling at the Microphone**:

  Step 1: Identify the target of the amendment.
     - If the target includes any part of Article 9, then the amendment must meet the requirements of 9.3 (three-quarters vote and prior notice) because 9.3 is the specific rule for amending Article 9.
     - Exception: If the amendment also targets Articles 1-8, then the entire resolution must meet the higher standard (9.3) because it is amending Article 9. But note: if the amendment to Article 9 is only to a part that does not affect the requirements for 1-8, then it might be separable? However, because the resolution as a whole amends Article 9, the whole resolution must meet 9.3.

  Step 2: Check for violation of 9.4 (voting rights protection) and the supremacy clause.
     - On its face, does the amendment abolish or restrict any member's right to vote? (This includes indirect methods, such as creating a new class of non-voting members, even if 9.4 text is unchanged.) 
     - If yes, then rule the amendment out of order as invalid per the supremacy clause. (Note: The parliamentarian can rule it out of order because the supremacy clause says such an amendment "shall be invalid".)

     - **Contestable point**: The parliamentarian is not the final arbiter of validity, but the supremacy clause is a higher rule that the parliamentarian must enforce. Therefore, if the amendment on its face violates 9.4, the parliamentarian should rule it out of order. If the violation is not clear on its face, then the parliamentarian might let it go to a vote, but then in the written ruling note the potential invalidity.

  Step 3: Check the notice requirement.
     - If the target includes Article 9, then prior notice (at the preceding AGM) must have been given. If not, and the meeting is the current AGM, then the amendment is out of order.

  Step 4: Determine the required vote threshold.
     - For target only in 1-8: simple majority (from 9.2).
     - For target including any part of Article 9: three-quarters (from 9.3).
     - Note: An amendment that targets the entire constitution (without specifying articles) might be considered as falling under 9.1 (two-thirds) but if it includes Article 9, then 9.3 applies. If it only targets 1-8, then 9.2 applies.

  Step 5: Sequencing during the same meeting.
     - All amendments at the same meeting are governed by the rules as they stood at the beginning of the meeting. Therefore, an amendment passed earlier in the meeting does not change the rules for amendments considered later in the same meeting.

  Step 6: Self-amendment in one resolution.
     - If a resolution attempts to change the threshold and then use that new threshold in the same resolution, rule it out of order. The two changes must be in separate resolutions.

  Step 7: Severability.
     - If the resolution has multiple parts and one part is invalid (e.g., violates 9.4) or requires a higher threshold, then:
        - If the parts are independent, suggest that the valid part be separated and moved as a distinct amendment.
        - If they are not separable, rule the entire resolution out of order.

  Step 8: If the amendment passes the above, it is in order. State the required threshold.

  III. **Cases**:

  **Case A**: Resolution to delete the notice requirement in 9.3, carried 68-32 (68%), with no prior notice.

  - Target: Article 9.3 (part of Article 9).
  - Route required: 9.3 requires three-quarters vote (75%) and prior notice.
  - Notice: None given -> out of order.
  - Threshold: 68% is less than 75% -> fails even if notice were given.
  - Ruling: Out of order because of lack of notice and insufficient vote. Even if we ignore notice, the vote is insufficient.

  **Case B**: Resolution to lower 9.1's threshold to a simple majority, carried 55-45 (55%).

  - Target: Article 9.1 (part of Article 9).
  - Route required: 9.3 -> three-quarters vote and prior notice.
  - Notice: Not mentioned, so assume none -> out of order.
  - Vote: 55% is way below 75% -> fails.
  - Ruling: Out of order.

  **Case C**: Resolution to amend Article 3 to create a class of dues-paying affiliate members with no vote at general meetings, leaving 9.4 textually untouched. Carried 81-19.

  - Target: Article 3 (so under 9.2: simple majority required). 81% > 50% -> meets vote threshold.
  - But: It creates a class of non-voting members. 9.4 says: "no amendment may abolish or restrict the right of any member to vote". Note: currently, all members have voting rights. This amendment creates a new class of members (affiliate) who are members but without a vote. Therefore, it restricts the voting rights of a class of members (the affiliates) by not giving them the vote. 
    - **Contestable**: Are affiliate members "members" in the sense of 9.4? The amendment creates them as members (they are called members) but without the vote. So 9.4 says "any member" must not have their right to vote abolished or restricted. Here, the affiliate members are being restricted from the start. 
    - The supremacy clause: any amendment inconsistent with 9.4 is invalid.
    - Therefore, the parliamentarian should rule this amendment out of order because it violates 9.4. Even though it doesn't change the text of 9.4, it is inconsistent with 9.4 by creating a class of members without a vote.

    - Rival view: 9.4 only protects existing members. Since the affiliate members are new and created without the vote, they never had the right, so it's not a restriction. But 9.4 says "any member" (without temporal qualification). The amendment makes them members without the vote. So by becoming a member, they are denied the vote. This is a restriction. 
    - Our ruling: Out of order.

  **Case D**:
  - First: Properly noticed resolution to lower 9.1 to a simple majority, carried with 78% (which is above 75% required by 9.3? 9.3 requires 75%, and 78% is above that. But note: the resolution is to amend 9.1 (which is part of Article 9) so it requires 75% and notice. Notice was given, and 78% >= 75% -> validly adopted? But note: the amendment changes 9.1 to a simple majority. However, the resolution was adopted under the old rule (75%).

  - Second: Twenty minutes later, an amendment to Article 6 is carried 51-49.

  - Sequencing: The meeting is still ongoing. The first amendment (to 9.1) has been passed, but by the principle in Step 5 (sequencing), the rules at the beginning of the meeting govern the entire meeting. Therefore, the second amendment (to Article 6) is governed by the rules at the start of the meeting.

  - At the start of the meeting:
     - Article 6 is in 1-8, so 9.2 applies: simple majority. 51% is a majority? 51 out of 100 is 51%, which is a majority. But note: the amendment was carried 51-49, so 51 in favor, 49 against -> majority in favor.

  - However, the first amendment changed 9.1 to simple majority. But because of sequencing, the second amendment is still under the old rules. So the threshold for amending Article 6 is simple majority (from 9.2) and that is met.

  - But note: the first amendment (to 9.1) has not yet taken effect? In parliamentary procedure, amendments take effect after the meeting. So during the meeting, the old rules apply.

  - Therefore, the second amendment is in order and passed by the required threshold.

  - Ruling for the second amendment: It is in order and requires a simple majority, which it achieved.

  - However, note: the first amendment (to 9.1) is now validly adopted and will be in effect for future meetings. But the second amendment was adopted under 9.2 (simple majority) and that rule was in effect at the start of the meeting.

  - What if the second amendment had been to a part not covered by 9.2? For example, if it had been to the entire constitution? Then under the old rules, 9.1 (two-thirds) would have applied. But it was to Article 6 (1-8) so 9.2 applies.

  - Therefore, both amendments are validly adopted? But wait: the first amendment changed 9.1 to a simple majority. The second amendment was to Article 6 and passed by simple majority (which is what 9.2 requires). So the second amendment is valid.

  - But note: the first amendment (to 9.1) does not affect 9.2. 9.2 remains in place. So for future meetings, amending Articles 1-8 can be done by simple majority (9.2) OR by the new 9.1 (simple majority). They are now consistent.

  - The parliamentarian's ruling at the time of the second amendment: 
     - For the first resolution: it is in order (notice given, target Article 9, so 75% required and achieved). 
     - For the second resolution: target is Article 6 (1-8), so under 9.2: simple majority required and achieved.

  - However, note: the second amendment is considered after the first has been passed. But the rules for the meeting are fixed at the start. So the threshold for the second is simple majority.

  IV. **What the procedure cannot settle**:

  - The procedure cannot settle disputes about the factual effects of an amendment (e.g., if an amendment indirectly violates 9.4 but the effect is not clear on its face). The parliamentarian must rule based on the text and obvious effects. If there is ambiguity, the parliamentarian might have to let the vote proceed and then the written ruling can note the concern, but the ultimate validity would be for the society to decide (possibly in court or by a later amendment).

  - The procedure also cannot settle deep theoretical disputes (e.g., about entrenchment). In such cases, the parliamentarian must choose a consistent interpretation and note the contestability.

  V. **One case the user won't like**:

  Case C: The user might not like that we rule the amendment creating affiliate members without a vote as out of order. The amendment passed by 81% and seems popular, but it violates 9.4. The user might prefer to let it stand, but the procedure says no.

  ---

  Summary of the decision procedure:

  1. Identify the target.
  2. Check if the amendment on its face violates 9.4 (directly or indirectly) -> if yes, out of order.
  3. For the target, determine the required procedure (route) from the rules at the meeting start.
     - If target includes Article 9, then 9.3 applies (three-quarters and notice).
     - If only 1-8, then 9.2 applies (simple majority, no notice).
  4. Check if the required notice was given (for Article 9 amendments).
  5. Determine the threshold for the vote.
  6. For sequencing: all amendments at the same meeting use the rules at the start.
  7. Self-amendment in one resolution: rule out of order.
  8. Severability: if separable, suggest separation; if not, rule the whole out of order.

  For each step, we note:

  - Step 1: settled (target identification).
  - Step 2: contestable (indirect effects). We use a substantive test. Rival view: only direct textual changes. Under the rival view, Case C would be in order because it doesn't change 9.4's text.
  - Step 3: 
     - Specific over general (9.2 for 1-8) is settled? Contestable: rival view is that 9.1 is the general rule and 9.2 is an exception that must be invoked explicitly. But in our procedure, we use specific over general.
     - The requirement for Article 9 amendments (9.3) is clear and settled.
  - Step 4: settled for notice (if required and not given, out of order).
  - Step 5: settled.
  - Step 6: sequencing is settled by parliamentary practice (rules at meeting start govern).
  - Step 7: self-amendment in one resolution: settled (must be separate).
  - Step 8: severability: settled parliamentary practice.

  Run the cases:

  A: Out of order (no notice and insufficient vote for Article 9 amendment).
  B: Out of order (no notice and insufficient vote for Article 9 amendment).
  C: Out of order (violates 9.4 by creating non-voting members).
  D: 
     - First amendment: in order (properly noticed, 78% >=75%, so passed).
     - Second amendment: in order (target Article 6, simple majority, 51% majority).

  But note: the user might dislike Case C ruling because the amendment passed by a large majority and creates a new class of members, which might be seen as beneficial. But the procedure rules it out of order to protect voting rights.

  Final note: The procedure does not guarantee that every amendment is ultimately valid, but it provides a clear and consistent way to rule at the microphone.
answer: |-
  Below is a decision procedure designed for real-time use during your society's meetings. It is structured as a step-by-step flowchart with explicit questions, thresholds for "hard no" rulings, and demarcation of values-based decisions. The procedure prioritizes clarity for lay volunteers and incorporates your requested distinctions (route vs. target, level-preserving vs. level-changing, valid vs. reckless, in-order vs. valid, direct vs. indirect violations). Sequencing rules and edge cases are embedded. Theoretical contestability is flagged at each step.  

  ### **Decision Procedure for Ruling on Amendments**  
  *Execute in order during the meeting; stop at first "no" or values-based handoff.*  

  #### **Step 1: Identify Target and Route**  
  - **Question:** What does the amendment change?  
    - *Target:* Specific article(s) amended (e.g., Art. 3, Art. 9.1).  
    - *Route:* Amending provision governing the target (9.1, 9.2, or 9.3).  
  - **Threshold for "No":**  
    - If target includes **any part of Article 9**, the route **must** be 9.3 (three-quarters + prior notice).  
    - If target is **only Articles 1–8**, route may be 9.2 (simple majority) or 9.1 (two-thirds).  
    - *Hard no if:* Route conflicts with target (e.g., targeting Art. 9 but using 9.2).  
  - **Contestability:**  
    - *Settled:* Route is determined by target (textual focus).  
    - *Rival view (H.L.A. Hart):* Route depends on the rule invoked by the mover.  
      - *Effect:* Allows targeting Art. 9 via 9.2 if moved as a "simple majority" amendment.  
      - *Why rejected:* Creates inconsistency with 9.3’s explicit intent.  

  #### **Step 2: Check Notice Requirement (If Route = 9.3)**  
  - **Question:** Was written notice given at the preceding AGM?  
  - **Threshold for "No":**  
    - *Hard no if:* Notice absent for Art. 9 amendments.  
  - **Contestability:**  
    - *Settled:* Notice is a procedural precondition for 9.3.  

  #### **Step 3: Screen for 9.4 Violation (Direct or Indirect)**  
  - **Question:** Does the amendment abolish/restrict voting rights, **textually or operationally**?  
    - *Direct:* Explicitly removes voting rights (e.g., "affiliate members cannot vote").  
    - *Indirect:* Achieves same effect without textual change (e.g., creates non-voting class).  
  - **Threshold for "No":**  
    - *Hard no if:* Clear direct/indirect violation (invokes supremacy clause in 9.1).  
    - *Handoff if:* Indirect effect is ambiguous (e.g., complex redefinition of "member").  
      - *To:* Membership (values question: what constitutes a "restriction"?).  
  - **Contestability:**  
    - *Settled:* Supremacy clause (9.1) voids amendments inconsistent with 9.4.  
    - *Rival view (Kelsen):* 9.4 binds only if amended textually; indirect effects are valid until challenged.  
      - *Effect:* Allows Case C (affiliate members) if 9.4 text is untouched.  

  #### **Step 4: Determine Threshold for Vote**  
  - **Question:** What vote % is required based on **route**?  
    - 9.1: Two-thirds | 9.2: Simple majority | 9.3: Three-quarters.  
  - **Threshold for "No":**  
    - *Hard no if:* Amendment fails required threshold (e.g., 55% for 9.3).  
  - **Contestability:**  
    - *Settled:* Thresholds are explicit in the constitution.  

  #### **Step 5: Sequencing and Self-Reference Checks**  
  - **Question 5a:** Is this part of a series of amendments at the **same meeting**?  
    - *Rule:* All amendments use the constitution **as it stood when the meeting opened**.  
    - *Why:* Avoids circularity; amendments take effect post-meeting.  
  - **Question 5b:** Does the amendment **alter its own threshold** in the same resolution?  
    - *Example:* "Lower 9.1 to simple majority and amend Art. 1 using it."  
    - *Hard no if:* Self-referential (must split into two resolutions).  
  - **Question 5c:** Is the amendment **severable**?  
    - *Rule:* Sever if parts are independent (e.g., amending Art. 2 and Art. 9 separately).  
    - *Strike whole if:* Parts are interdependent (e.g., "lower threshold only if Art. 3 is amended").  
  - **Question 5d:** Does it condition its validity on a **new body it creates**?  
    - *Example:* "Create Ethics Panel; all amendments require its assent."  
    - *Hard no if:* Self-validating; creates infinite regress.  
  - **Contestability:**  
    - *Settled:* Sequencing (5a) and self-alteration (5b) follow parliamentary custom.  
    - *Rival view (Marmor):* Rules can self-apply if internally coherent.  
      - *Effect:* Allows self-amendment in one motion if logically consistent.  

  #### **Step 6: Final In-Order Ruling**  
  - **If all steps passed:** Amendment is in order. State required threshold.  
  - **Validity disclaimer:** "This ruling addresses procedural order, not ultimate validity. Challenges may be raised post-meeting per the constitution."  

  ---

  ### **Case Applications**  
  *(Presumes meeting opened with unamended constitution.)*  

  #### **Case A: Delete notice in 9.3 (68–32, no notice)**  
  - **Step 1:** Target = Art. 9.3 → Route = 9.3.  
  - **Step 2:** Notice absent → **Hard no.**  
  - *Rival view (Hart):* If moved under 9.1, 68% > two-thirds → in order.  

  #### **Case B: Lower 9.1 to simple majority (55–45)**  
  - **Step 1:** Target = Art. 9.1 → Route = 9.3.  
  - **Step 2:** Notice not mentioned → assume absent → **Hard no.**  
  - **Step 4 (backup):** 55% < 75% → **Hard no.**  
  - *You won’t like this:* Popular but fails both notice and threshold.  

  #### **Case C: Create non-voting affiliates (81–19, Art. 3 untouched)**  
  - **Step 1:** Target = Art. 3 → Route = 9.2 (simple majority).  
  - **Step 3:** Indirectly restricts voting rights (creates non-voting class) → **Hard no** (supremacy clause).  
  - *Contestable handoff:* If indirect effect is disputed (e.g., "affiliates are not 'members'"), rule it in order but note: "Ultimate validity depends on interpretation of 'member' under 9.4."  
  - *Rival view (Kelsen):* No textual change to 9.4 → valid.  

  #### **Case D: Sequence of two amendments**  
  - **First amendment:** Lower 9.1 to simple majority (78%, noticed).  
    - Step 1: Target = Art. 9.1 → Route = 9.3.  
    - Step 2: Notice given → OK.  
    - Step 4: 78% ≥ 75% → in order (threshold: 75%).  
  - **Second amendment (20 min later):** Amend Art. 6 (51–49).  
    - **Step 5a:** Use rules at meeting start → Route for Art. 6 = 9.2 (simple majority).  
    - Step 4: 51% > 50% → **in order** (threshold: simple majority).  
  - *Note:* First amendment takes effect post-meeting; second uses original 9.2.  

  ---

  ### **Explicit Limitations**  
  1. **Cannot settle:**  
     - Values-based ambiguities (e.g., "What counts as a *restriction* under 9.4?").  
     - Empirical effects (e.g., "Will this amendment *de facto* disenfranchise members?").  
     - Deep entrenchment theory (e.g., "Can 9.4 bind future generations?").  
  2. **Handoff protocol:**  
     - If a step requires values judgment (e.g., indirect effects in Step 3), state: "The amendment is in order procedurally, but its validity depends on interpretation of [issue]. The tellers may proceed, but members may challenge validity post-meeting."  

  ### **Why This Works for You**  
  - **Predictable "no"s:** Hard stops at Steps 1–5 prevent breakdowns.  
  - **Lay-friendly:** Binary questions; avoids jurisprudence.  
  - **Embeds your distinctions:**  
    - Route/target (Steps 1, 5a).  
    - Level-changing (self-amendment in Step 5b).  
    - Direct/indirect (Step 3).  
    - In-order vs. valid (disclaimer in Step 6).  
  - **Unpalatable outcome:** Case C ruled "no" despite high support, enforcing 9.4 substantively.  
  - **Theoretical transparency:** Rival views flagged but not sanitized.  

  This procedure ensures rulings are defensible in real-time while isolating unresolvable disputes for post-meeting review. Practice with your cases beforehand to build reflexivity.
