  2. **Spoiler Problem Question**:  
     When breaking a question into sub-questions (e.g., "Is this policy good?" → "Is it fair, efficient, and safe?"), can the *way* it's broken down accidentally pre-bake the answer (e.g., by assuming fairness matters most)?  
