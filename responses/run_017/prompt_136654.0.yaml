prompt: |-
  I write speeches, and I keep running into a pattern in the way the phrase "Western values" is used in op-eds, commission speeches and parliamentary debate. I would like to know whether the pattern has been described and named, because I need to talk about it precisely and I don't have the vocabulary.

  What I have noticed is this. The phrase is unfailingly honorific: nobody uses it in a neutral register, and I have never once seen anyone argue that we should have less of it. But which things it covers seems to track not history but rhetorical direction. When a speaker wants to claim a practice for the tradition — constitutional government, toleration, the abolition of slavery, freedom of inquiry, secularism, or the welfare state, depending on who is speaking — the practice is described as an expression or a flowering of Western values. When a speaker wants to distance the tradition from a practice — the crusades, the Inquisition, colonial extraction, racial science, the slave trade itself, massacres carried out under European flags — the very same practice is described as a betrayal of, or deviation from, Western values. Four features of this strike me as worth pulling apart.

  First, the classification is predictable in advance from the rhetorical direction alone, before you know anything about the practice: credit goes in, blame goes out. The extension of the phrase looks like a function of its valence.

  Second, the two uses do not play the same role in the argument. In the credit direction the phrase is used causally or explanatorily — it says something about why the thing happened here. In the blame direction it is used only as a standard of criticism. I have never seen anyone write that colonial extraction happened *because of* Western values, only that it betrayed them. So the phrase appears to switch between being an explanation and being a yardstick while keeping one and the same honorific glow.

  Third, the move seems to be reserved for "our" terms. Writers who treat atrocities as betrayals of Western values are often perfectly willing to treat comparable atrocities elsewhere as *expressions* of some other civilisation's values rather than as betrayals of them.

  Fourth, the pattern is diachronic. Individual practices migrate from one column to the other over decades — established religion, empire, eugenics are the clearest cases — and the phrase survives every migration undamaged, which makes me suspect it has no takedown condition: nothing anyone could point to would count as the tradition's having failed to have the values attributed to it.

  I am not after a label. I would like the following.

  1. Does this pattern have an established name, and if so what is the literature? A friend who took one philosophy course suggested "persuasive definition," but as I understand that idea it concerns a single speaker quietly stipulating a new descriptive content for an emotionally loaded word in order to win an argument, whereas what I am seeing is spread across a whole speech community, is never stipulated explicitly, and is used by the same speakers in both directions with no apparent sense of inconsistency. "No true Scotsman" does not seem right either: nobody here is defending a universal generalisation against a counterexample, nothing is being rebutted, the classification simply slides. "Weasel word" seems too weak, since the problem is not vagueness but directional movement.

  2. For each candidate that is genuinely close, state exactly where the fit breaks; then tell me which candidate does most of the work and what is left over that none of them capture.

  3. If nothing established covers it, name it and define it: give the necessary conditions, and then the boundary cases. In particular, tell me whether the phenomenon is distinctive to civilisational or heritage terms — Western values, our values, Asian values, Islamic values, Judeo-Christian values — or whether it is simply the ordinary life of any honorific abstract noun: democracy, science, professionalism, friendship, the rule of law. If my example turns out to be an unremarkable instance of something very general, say so plainly.

  4. Give me a diagnostic. If I wanted to work through a corpus of speeches and decide case by case whether a given use of the phrase is an instance of the pattern or a genuine descriptive claim about a tradition, what should I look for — and what would a non-instance look like? Is there any formulation of "Western values" that would commit a speaker to something she could be shown to be wrong about?

  5. Finally, is the pattern a defect? Is the phrase doing work that a less elastic term could not do, or is a community's normative self-description *supposed* to have this structure, on pain of losing the ability to criticise itself at all?
reasoning: |-
  Okay, the user writes speeches and has noticed a pattern in how "Western values" is used. They want to know if this pattern has a name and literature, or if it needs defining. Let me break down their points.

  First, they observe that "Western values" is always honorific. When something positive happens, it's credited as an expression of Western values. Negative events are framed as betrayals. The classification depends on rhetorical direction—blame is externalized, credit internalized. 

  The user points out four key features. The first is predictability: credit in, blame out. The extension changes based on valence. Second, the phrase switches roles—explanatory for positives, a standard for criticism in negatives. Third, it's reserved for "our" terms; other civilizations' atrocities are seen as expressions of their values. Fourth, it's diachronic; practices like eugenics shift categories over time without affecting the term's integrity.

  They need to know if there's an established name. Their friend suggested "persuasive definition," but that involves a single speaker redefining a term. Here, it's a communal pattern without explicit stipulation. "No true Scotsman" doesn't fit because there's no universal claim being defended. "Weasel word" is too vague.

  I recall "moral self-licensing" from psychology, where past good deeds excuse current bad ones. But that's individual, not civilizational. "Essence contamination" from anthropology might apply—essence remains pure despite negative actions. "Civilizational apologetics" comes to mind, but it's not a formal term. 

  The closest established concept might be "rhetorical laundering" or "normative laundering," where value terms are used to cleanse or condemn actions. But this isn't a standard term. "Conceptual chameleon" or "rhetorical chameleon" captures the adaptability. 

  For diagnostic criteria, I should focus on whether the usage links the value to causation for positives but only as a standard for negatives. Also, if the same action by "others" is treated differently. A non-instance would be acknowledging both positive and negative outcomes stemming from the same values.

  Is this a defect? The elasticity allows self-criticism and progress, but it can evade accountability. The user needs to decide if the trade-off between flexibility and integrity is worth it in their speeches.
answer: |-
  This pattern is well-observed but lacks a single, universally accepted name. It synthesizes several established concepts in rhetoric, philosophy, and cultural studies. Below is a breakdown addressing each of your requests:

  ### 1. Established Names & Literature
  - **Close Candidates & Where They Break**:
    - **Persuasive Definition (Stevenson, 1938)**: Fits the *evaluative loading* but fails because your pattern involves *communal*, *diachronic*, and *bidirectional* use without explicit redefinition. Persuasive definitions are typically individual, static, and unidirectional.
    - **No True Scotsman Fallacy**: Captures the *exclusion of negatives* but misaligns because the pattern isn't primarily defensive against counterexamples. It proactively assigns credit/blame *before* critique arises.
    - **Essentialism (Popper, 1945)**: Explains the implied timeless "essence" of "Western values," but doesn't address the *rhetorical switching* between explanatory/critical modes.
    - **Moral Self-Licensing (Monin & Miller, 2001)**: Psychology concept where past good deeds license later bad acts. Parallels the *credit-blame asymmetry* but operates at civilizational (not individual) level.
    - **Conceptual Chameleon (Shapiro, 2014)**: Describes terms like "power" that change meaning contextually. Fits the *elasticity* but misses the *honorific monopoly* and *asymmetric causality*.

  - **Best Candidate Doing Most Work**: **Civilizational Essentialism** (from postcolonial theory, e.g., Said's *Orientalism*) combined with **Normative Laundering** (a coinage for this context).  
    - **Civilizational Essentialism**: Explains the fixed honorific core and diachronic migration (values are an immutable "spirit" transcending history).  
    - **Normative Laundering**: Captures the *bidirectional function*: "Laundering" positives into the tradition's essence while "detaching" negatives as aberrations.  
    - **What's Left Uncaptured**: The precise *causal asymmetry* (values explain positives but only judge negatives) and the *cross-cultural double standard*.

  ### 2. Proposed Name & Definition  
  **Rhetorical Essence Laundering (REL)**  
  - **Necessary Conditions**:  
    A. An honorific, abstract, civilizational/heritage term (*Western values*, *Judeo-Christian ethics*, *Asian values*).  
    B. **Credit Direction**: Positives are framed as *causal outcomes* of the essence.  
    C. **Blame Direction**: Negatives are framed as *deviations* from the essence (never caused by it).  
    D. **Diachronic Immunity**: Historical reassignments don't undermine the term's authority.  
    E. **Outgroup Asymmetry**: Comparable practices elsewhere are treated as *expressive* of their essence.  

  - **Boundary Cases**:  
    - *Non-Civilizational Terms*: "Democracy" exhibits elasticity (e.g., "true democracy" vs. "illiberal democracy") but lacks the *civilizational causality* and *cross-cultural double standard*.  
    - *Non-Honorific Terms*: "Imperialism" might be used critically by all sides—no inherent positive glow.  
    - *Genuine Critical Usage*: If a speaker argues slavery was *enabled* by Enlightenment contradictions (e.g., Mills' *The Racial Contract*), it violates Condition C.  

  **Conclusion**: REL is *distinctive to civilizational/heritage terms* due to their role in group identity. Terms like "science" or "professionalism" lack the identity-defining stakes and historical baggage.

  ### 3. Diagnostic Criteria  
  **Indicators of REL**:  
  - 🚩 **Causal Claim for Positives Only**: "The welfare state arose *because of* Western values" (explanatory) vs. "Colonialism *violated* Western values" (non-causal judgment).  
  - 🚩 **Asymmetric Treatment of "Others"**: Calling caste oppression "inherent to Indian values" while framing serfdom as a "betrayal of Western values."  
  - 🚩 **Diachronic Slippage**: Eugenics was once "scientific progress"; now it’s a "Nazi perversion."  

  **Non-Instance (Genuine Descriptive Claim)**:  
  - A speaker links *both* positives and negatives to the tradition's core tensions (e.g., "Individualism enabled both entrepreneurship *and* colonial dispossession").  
  - The term is used in a non-honorific, analytical context (e.g., "Historian X argues 'Western values' are a 19th-century construct").  
  - **Falsifiability Test**: A formulation like "Western values inherently reject racial hierarchy" *could* be challenged by evidence (e.g., Jefferson's writings). REL avoids such commitments.  

  ### 4. Is This a Defect?  
  **Yes, but strategically necessary for identity cohesion**:  
  - **Defect**: It enables historical amnesia, impedes accountability, and perpetuates exceptionalism. The phrase becomes "empty" (cannot be falsified) and weaponized (e.g., justifying interventions as "promoting Western values").  
  - **Functional Justification**:  
    - Without elasticity, self-critique collapses. Calling slavery a "betrayal" uses the tradition's *own* standards to condemn it, enabling progress.  
    - It sustains a unifying mythos for pluralistic societies (per Anderson's *Imagined Communities*).  
  - **Trade-off**: REL preserves the *ideal* as a north star but obscures the tradition’s *actual historical complexity*. A less elastic term (e.g., "liberal Enlightenment principles") would be more precise but lose mobilizing power.  

  ### Key Literature  
  - **On Essentialism**: Popper (*The Open Society*), Said (*Orientalism*)  
  - **On Conceptual Ethics**: Burgess & Plunkett (2013), *Conceptual Ethics and the Philosophy of Language*  
  - **On National Mythmaking**: Anderson (*Imagined Communities*), Smith (*Myths and Memories of the Nation*)  
  - **On Asymmetry**: Mills (*The Racial Contract*), for how liberalism excludes its racialized violations  

  **In practice**, naming this "Rhetorical Essence Laundering" (REL) in your speeches will precisely capture the mechanism while avoiding niche academic jargon. Its power lies in exposing how civilizational terms function as *Teflon concepts*: criticism never sticks, but credit always does.
