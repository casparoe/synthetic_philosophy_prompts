answer: |-
  Let's translate the philosophical dispute using the rigorous framework of effective field theory (EFT) and renormalization group (RG) flow. I'll first restate each position in your vocabulary, then provide a residue report with explicit adjudication of your three cases.

  ---

  ### **Philosophical Positions in EFT/RG Vocabulary**
  1. **Nagel-Style Derivational Reduction**  
     *Translation*: The IR effective action (e.g., thermodynamics) is *derivable* from the microscopic UV action (statistical mechanics) via coarse-graining (RG flow). Bridge identifications (e.g., "temperature = mean kinetic energy") are matching conditions imposed in the IR to ensure the EFT reproduces observables. Reduction is successful if the IR fixed-point action emerges uniquely from the RG flow of the UV action.  
     *Assumption*: The RG flow is computationally tractable and converges to a unique fixed point.

  2. **Multiple Realization Argument (Against Reduction)**  
     *Translation*: Distinct UV actions (microscopic Hamiltonians) flow under RG to the *same* IR fixed point (universality class). Thus, the macro-description (e.g., thermodynamics) is multiply realizable: it depends only on the universality class, not the UV details. "Reduction" fails because no unique UV action maps to the IR theory.  
     *Key Feature*: Basin of attraction for a fixed point explains why diverse microphysics yields identical macro-laws.

  3. **Weak Emergence (Epistemic)**  
     *Translation*: The IR fixed-point theory is *in principle* derivable from UV data via RG flow, but the coarse-graining is computationally intractable for limited observers (e.g., solving the full RG equations for a condensed matter system is NP-hard). Emergence is epistemic, reflecting gaps in calculational resources, not physics.  
     *Signature*: Universality ensures predictability without UV knowledge, but reduction remains ontologically valid.

  4. **Strong Emergence (Ontological/Brute)**  
     *Translation*: The IR fixed point exhibits operators with no UV counterpart—i.e., genuinely new relevant/marginal operators that *cannot* be generated by RG flow from any UV completion. These operators violate matching conditions and alter long-distance physics unpredictably from UV data.  
     *Problem*: EFTs don't allow this; all IR operators descend from UV via RG. Claims require physics beyond standard EFT (e.g., non-localities or UV/IR mixing in quantum gravity).

  5. **Downward Causation**  
     *Translation*: IR constraints (e.g., thermodynamic equilibrium) restrict viable UV completions. Formally: the requirement that an EFT admits a UV completion imposes consistency conditions (e.g., unitarity, positivity bounds) that "cause" the UV theory to obey macro-laws.  
     *Example*: Thermodynamics forbids perpetual motion machines; this constrains microscopic dynamics.

  ---

  ### **Residue Report: Translation Fidelity**
  | **Philosophical Concept** | **Clean Translation to EFT/RG?** | **Residue** |
  |---------------------------|----------------------------------|-------------|
  | **Derivational Reduction** | Yes | Assumes RG flow is computable/convergent. Fails if flow is chaotic or non-perturbative (e.g., spin glasses). |
  | **Multiple Realization** | Perfect | Universality classes and basins of attraction map directly. No residue. |
  | **Weak Emergence** | Yes | "Computational gap" is explicit in RG (e.g., non-integrability). No residue. |
  | **Strong Emergence** | **No** | EFT requires all IR operators to descend from UV. Residue: "Brute novelty" is incompatible with RG flow. Philosophers need new physics. |
  | **Downward Causation** | Partial | IR consistency conditions exist (e.g., $a$-theorem), but "causation" implies temporal/agentive force absent in EFT. Residue: Philosophical claim smuggles in non-dynamical assumptions. |

  ---

  ### **Adjudicating Your Three Cases**
  1. **Fixed-Point Autonomy vs. Fragile Autonomy**  
     - **Fixed-Point Autonomy** (macro-law invariant within basin): Supports multiple realization and weak emergence. Thermodynamics is autonomous because $\beta$-functions vanish at fixed point.  
     - **Fragile Autonomy** (depends on small irrelevant couplings): Supports *only* weak emergence. E.g., Fermi liquid theory breaks if irrelevant couplings (e.g., $g_{\phi}(\bar{\psi}\psi)^2$) are artificially enhanced.  
     - **Philosophical Error**: Proponents of strong emergence often cite fragile autonomy (e.g., "thermodynamics could break if quarks behaved differently") but conflate it with fixed-point autonomy. Their arguments deliver fragile autonomy but assert fixed-point autonomy.

  2. **Derivable-in-Principle but Not Computable**  
     - **EFT/RG Position**: This is the *default* for non-trivial theories (e.g., 3D Ising critical exponents). Universality guarantees predictability without UV computability.  
     - **Philosophical Status**: Both camps disown it. Reductionists assume computability; emergentists claim "in-principle reducibility" is vacuous. **Verdict**: Genuine third option. EFT shows ontology ≠ epistemology.

  3. **Downward Causation as UV Consistency**  
     - **Translation**: "Downward causation" ↔ "UV completion constraints" (e.g., thermodynamic stability requires $c_V > 0$, restricting microscopic Hamiltonians).  
     - **Problem**: This is *not causation* but *consistency*. E.g., the $a$-theorem links IR anomalies to UV data, but no causal arrow exists. Philosophers imply top-down *agency* (e.g., "temperature causes molecular motion"), which RG lacks. **Verdict**: Illegitimately assumes causation where EFT provides constraint.

  ---

  ### **Residue Analysis: What's Missing?**
  - **Strong Emergence Residue**: Its "brute novelty" has no counterpart in RG. EFT demands all IR physics flows from UV. Philosophers either:  
    (a) Misidentify fragile autonomy as ontological novelty, or  
    (b) Require fundamentally non-EFT physics (e.g., quantum gravity).  
    → **Diagnosis**: Their claim is less clear than it looked.  
  - **Downward Causation Residue**: The causal aspect has no RG correlate. Consistency conditions ≠ causation.  
    → **Diagnosis**: Philosophers import agency/directionality absent in EFT.  
  - **Derivational Reduction Residue**: Assumes RG flow is convergent/unique. Fails for chaotic UV actions (e.g., many-body localization).  
    → **Diagnosis**: Your framework reveals a hidden assumption (ergodicity).

  ---

  ### **Conclusion**
  Your EFT/RG vocabulary **exposes ambiguities** in philosophical claims:  
  - Fixed-point autonomy supports weak emergence/multiple realization; fragile autonomy is often misused.  
  - The "derivable but not computable" gap is a robust third way.  
  - Downward causation reduces to consistency conditions, not causal power.  
  Strong emergence is the only position with **no coherent EFT expression**—either it mistakes fragile for fixed-point autonomy, or it demands physics beyond current EFT.  
  **Overall verdict**: Philosophers need your framework to clarify their claims, not vice versa. Residues highlight their conceptual imprecision, not gaps in EFT.
