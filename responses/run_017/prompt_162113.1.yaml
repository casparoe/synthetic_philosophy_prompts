  The second case: derivable in principle but not computable. This is a third option, where reduction holds in principle, but epistemic limits prevent computation. RG supports this through computational irreducibility, but both philosophical camps might overlook it.

  Third, downward causation as UV completion constraints. While EFT has consistency conditions, actual causation might not be present. Philosophers could interpret constraints as causal, but EFT doesn't endorse that.

