prompt: |-
  I never went to university for any of this. I got into an argument with my brother about why our basement floods and it turned into me trying to work out how anybody ever decides *which story* is the right one when two stories both fit the facts equally well. Here are my gut calls, and I want to know what rule Im unconsciously following.

  1. Basement floods every March, east wall only, only after heavy rain. Story A: the downspout on that side dumps water against a clay bank right at the foundation. Story B: the town storm sewer backs up in snowmelt season and pushes water up through the floor drain. A for me, and I'd back A before anybody crawls out there and looks.

  2. My friend went quiet on me for three weeks then came back as if nothing had happened. A: she was annoyed by something I said. B: she was dealing with something unrelated and pulled back from everyone. I pick A, even though I know B is far more common.

  3. Three weird things in my house: wifi dies around 7pm, the bulbs in one room hum, the microwave clock keeps resetting. A: three separate faults, each with a decent story of its own. B: one cause behind all three, though I can't say what it is. I go with B.

  4. Grandad's workshop clock, nobody had wound it in years, found running. A: my uncle wound it and never mentioned it. B: there's a battery in it after all and the battery still had charge. I go with A — a hidden thing a person did.

  5. My sourdough starter died four times running, always on day three. A: something living in my kitchen that I can't see and can't test for. B: I keep making the same mistake with temperature. I go with B, and A feels like cheating. These two are the ones I can't square: in 4 the invisible cause is my favourite story, in 5 it's the worst one on offer.

  6. Our office numbers jumped right after the new manager started and everyone says she's brilliant. Explanation: she changed what gets counted. That one makes me happier than any other explanation I've ever had.

  My guess at my own rule: go with the story I'd have bet on *before* I saw the details — the one that would have made me expect roughly this. I think that gets 1 and 6 right and gets 3 and 5 wrong, and for 2 and 4 I geniunely can't tell.

  Lay it out like this:

  **The principle** — two sentences, plain words. If you need a technical term, explain it in the same sentence.
  **Case by case** — a couple of sentences on each of my six: does your principle give my verdict, yes or no.
  **The awkward pair** — one short paragraph on 4 versus 5, and what actually separates them.
  **Where I'm wrong** — one short paragraph, honestly: which of my verdicts your principle can't save, and which one I should drop.
  **A case of your own** — make up a case yourself, one short paragraph, where your principle forces a verdict I probably won't like.
  **My flip-flop** — half a paragraph on this one, which I go back and forth on: every job I've had, within six months I'm being left out of meetings I should be in. Story A: something I do. Story B: it's the kind of flat, disorganised workplace I keep picking, it happens to everyone there and I'm just the one who notices it as a pattern. Does your principle settle it, or does it genuinely depend on something I'd have to go and find out?
reasoning: |-
  Okay, the user is trying to figure out the underlying principle they're using to choose between two explanations that both fit the facts. They've provided six scenarios with their intuitive choices and are struggling to reconcile why they prefer different types of invisible causes in cases 4 and 5. 

  Hmm, this is actually a deep epistemological question disguised as casual curiosity. The basement flooding argument with their brother sparked something fundamental about how humans assign causality. Interesting that they're self-aware enough to notice their own inconsistencies but can't articulate the rule.

  Looking at their cases... In scenario 1 they reject the sewer backup theory immediately despite it being plausible. That suggests prior experience weighting. Scenario 2 is revealing - they admit B is statistically more likely but still pick A, indicating emotional bias might be overriding base rates. 

  The workshop clock case (4) versus sourdough starter (5) is the real puzzle. Why is "uncle wound it" acceptable but "invisible contaminant" feels like cheating? Probably because the former stays within ordinary human behavior while the latter invokes extraordinary entities. Occam's Razor would handle this distinction through prior probability weighting.

  For their job meeting dilemma... The principle would force them to confront their own role first since "person does something" is more common than "every workplace is identically dysfunctional." But it's not definitive - they'd need to check if colleagues experience similar exclusion.

  Should mention that their love for the office numbers explanation (#6) reveals another layer: we prefer stories that expose systemic quirks over individual heroics. That's not covered by my stated principle but explains their satisfaction.
answer: |-
  Here's the breakdown you requested:

  **The Principle**  
  You favor the story requiring the fewest *new* assumptions. When both fit the facts, pick the one leaning on things you already accept as common or likely, rather than inventing unseen causes or rare events just for this case.

  **Case by Case**
  1.  **Basement Floods (A)**: **Yes.** "Clogged downspout" relies on common drainage issues you know exist. "Sewer backup" requires assuming a specific, significant failure in a municipal system.
  2.  **Friend Went Quiet (A)**: **No.** Principle leans **B**. "Personal issue" (B) is common and requires no new assumptions about *your* actions. "Annoyed by me" (A) assumes a specific, unconfirmed interpersonal event.
  3.  **Three Weird Things (B)**: **Yes.** "One cause" assumes *one* new hidden fault. "Three separate faults" assumes *three* new, unrelated hidden faults – more assumptions.
  4.  **Clock Running (A)**: **Yes.** "Uncle wound it" assumes a single, plausible human action. "Hidden battery" assumes a specific, unobserved modification to the clock that defied years of dormancy.
  5.  **Sourdough Dies (B)**: **Yes.** "My mistake" assumes a common human error. "Invisible contaminant" (A) invents a completely new, unseen biological agent in your kitchen.
  6.  **Office Numbers Jumped (Her Change)**: **Yes.** "Changed metrics" assumes a common managerial tactic. Attributing it purely to her brilliance would require assuming exceptional, unseen individual impact.

  **The Awkward Pair (4 vs. 5)**  
  The difference is the *type* of hidden cause. In **4 (Clock)**, the "hidden cause" (uncle winding it) is a *familiar, everyday action* (people interact with objects) – you're just assuming it *happened* unobserved. In **5 (Sourdough)**, the "hidden cause" (invisible contaminant) is an *extraordinary entity* – a novel, persistent, undetectable biological agent specifically targeting your starter. The principle rejects inventing extraordinary *entities* (like magic microbes) far more readily than assuming plausible *actions* (like winding a clock) went unobserved.

  **Where I'm Wrong**  
  The principle can't save your verdict on **Case 2 (Friend)**. "She was annoyed by me" (A) requires assuming a specific, unconfirmed interpersonal conflict *you* caused. "She had personal issues" (B) relies only on the common occurrence of people withdrawing temporarily due to stress, illness, or private matters – a far more common and less assumption-heavy explanation. The principle strongly favors B. Your pick for A seems driven by personal anxiety or ego, not minimizing new assumptions.

  **A Case of Your Own**  
  Your car won't start one morning. Story A: The battery is old and finally died overnight (common failure). Story B: Someone siphoned your gas last night, leaving just enough to crank but not start (rare, targeted crime). Both fit the symptom. The principle forces **A**. "Dead battery" assumes one common, known failure mode. "Gas siphoned" assumes a specific criminal act you have no evidence for – a new, extraordinary event. You might *dislike* A (it costs money), but it fits the principle.

  **My Flip-Flop (Job Meetings)**  
  The principle favors **A (Something I Do)** initially. "Person does something unconsciously annoying" is a common, well-documented phenomenon requiring no new assumptions about workplace structure. "Every workplace is identically disorganized in this specific way" is a less common pattern and requires assuming a systemic flaw exists uniformly across diverse jobs. However, **this isn't definitive**. If you observe *others* being similarly excluded in each job (evidence the pattern exists), **B** becomes viable. Without that evidence, the principle leans strongly towards A – you need to actively seek information (e.g., ask colleagues if they experience it) to justify B. Your flip-flop likely happens when you *assume* B is true without evidence versus focusing on A requiring personal change.
