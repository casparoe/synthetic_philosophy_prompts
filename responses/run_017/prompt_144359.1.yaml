  First, I need to fully grasp the scenario. The environment has heavy-tailed payoffs, meaning rare but extreme values, which makes estimation tricky. Only chosen payoffs are revealed, so feedback is limited. The distribution reshuffles every 50 rounds, introducing non-stationarity. Policy A spends computation on precise estimates, while Policy B uses a simple aspiration rule with incremental adjustments.

