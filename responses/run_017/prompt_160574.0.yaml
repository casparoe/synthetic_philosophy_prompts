prompt: |-
  I work in contracts and performance oversight for a county human-services department. We pay nonprofit providers partly on whether they hit numbers, and my team writes somewhere between fifteen and twenty contracts a year, each with three to six performance metrics. I get maybe two hours per metric to pressure-test it before it goes to our finance director for sign-off, and he mostly cares whether a number can be audited from records we already keep — which pushes everything toward metrics that are easy to verify, and those are exactly the ones I've watched fail. I have no training in any of this, I've just been doing it six years and seeing the same four or five failures repeat: providers quietly selecting the easiest clients, relabeling a bad outcome into a category nobody counts, pouring everything into the one measured line while the rest of the service rots, and turning in numbers that climb while the thing we actually care about doesn't move. I keep coming back to that thing everyone says about a measure ceasing to be a good measure once you start paying for it — I don't remember who said it and I don't care, so please don't spend any words on the history or on who coined what, and don't cite anything because I can't look it up. It's a warning, not a procedure, and what I need is a procedure my team can actually run.

  Two rough ideas I've been using on my own, which you can keep or throw out. First, I distinguish what I call gaming (someone deliberately works the number — reclassifying, cherry-picking, closing cases early) from what I call capture (no one is cheating at all; the staff just sincerely internalize the metric and stop noticing the parts of the mission that aren't in it). They feel like they need different tests, but I'm not sure they do. Second, I've started slipping cheap "ghost measures" into contracts — a number we collect quietly that isn't tied to any payment and that the provider barely notices, chosen so that it ought to move together with the paid metric; if the paid metric improves and the ghost doesn't, something's off. I want you to tell me whether that trick is actually sound or whether I'm fooling myself, and where it breaks. A third thing I'd like handled: our director wants each year's target to be last year's actual plus a bit, which I think punishes whoever performed well this year. And there's a pressure I can't name properly — the metrics that survive auditing tend to be true of the paperwork rather than true of the world, so a provider can hit them perfectly while nothing changes for anyone.

  What I want is a written procedure: the questions in order, what counts as a good enough answer to each one, where the procedure just stops and says no, and where it has to hand the decision to a person because the question is about what we value rather than what's happening. It has to be runnable in about two hours by someone with no theory background, using records we already have, and it should say what to do when a number simply can't be gotten. If you use a technical term, define it in one clause. Then walk it through three metrics from my world, in this order: (1) average days from referral to first appointment, which is my favorite because it's trivially auditable and I suspect you're going to tell me to drop it; (2) percent of people placed in housing who are still in the same housing six months later; (3) a proposed metric on serving the hardest cases, where I think the procedure will stall and a human will have to decide something about who we owe what. Please also tell me straight out which parts of this are judgment calls dressed up as steps.

  Sections, in this order, with rough lengths: "The procedure" (700 words, ordered steps with pass/fail/hand-off at each), "Walkthrough: referral-to-appointment time" (200 words), "Walkthrough: housing at six months" (250 words), "Walkthrough: the hardest-cases metric" (200 words), "Where a person has to decide" (200 words), "What this procedure can't tell me" (150 words).
reasoning: |-
  Okay, the user works in contracts for a county human services department. They're dealing with performance metrics for nonprofit providers and seeing repeated issues like creaming, relabeling outcomes, and tunnel vision. They need a practical procedure to test metrics before approval, something their team can run in two hours per metric. 

  First, I need to understand their core pain points: 
  - Auditability obsession leading to superficial metrics
  - Gaming vs capture as different failure modes
  - Ghost measures as a DIY solution
  - Unfair target-setting (last year + arbitrary bump)
  - Paperwork-truth vs real-world impact gap

  The user explicitly rejects theoretical discussions - they want actionable steps. Their ghost measure idea is clever but needs validation. The annual target issue is clearly demoralizing high-performers. And that unnameable pressure about paperwork-truth... that's Campbell's law in the wild.

  For the procedure, I'll build around their gaming/capture distinction since it's operationally useful. Ghost measures can work but with caveats - need to explain where they fail (like when metrics are intrinsically linked). The target-setting problem requires a structural fix - maybe historical performance bands instead of rigid formulas.

  The three walkthroughs are perfect test cases: 
  1) Referral-to-appointment time is classic vanity metric - fast appointments don't equal good care. Procedure should flag it as incentivizing rushed intake. 
  2) Housing stability at 6 months needs context - is provider controlling lease terms? Ghost measure could be unannounced well-being checks. 
  3) Hardest cases metric will hit value judgments - procedure should explicitly call for human decisions about who deserves service priority.

  Biggest challenge is balancing rigor with practicality. Two hours isn't much, so steps must be laser-focused: 
  - Start with "would gaming this be easy?" 
  - Then "could staff forget other goals?" 
  - Verify data exists without new collection 
  - Check for paperwork-reality gaps 
  - Set targets using percentiles, not arbitrary bumps

  Where the procedure must be honest about limitations: 
  - Can't detect sophisticated fraud 
  - Won't fix systemic underfunding 
  - Requires provider buy-in to work 
  - Value conflicts need human arbitration

  The tone should match their no-nonsense style - clipped, direct, with zero jargon. When defining unavoidable terms like "effort diversion," use their own examples (cherry-picking clients, relabeling outcomes). For the housing metric walkthrough, emphasize that lease verification alone misses whether residents are actually thriving. And for hardest cases, validate their instinct that this isn't solvable algorithmically - the community must debate what "deserving" means.

  Most importantly, the output must feel like a tool, not a treatise. They've suffered enough theory; now they need levers to pull.
answer: |-
  ## Metric Vetting Procedure for Performance-Based Contracts  
  *(Runnable in ≤120 minutes per metric by non-specialists using existing records)*

  **Purpose:** Identify metrics likely to distort provider behavior ("gaming") or narrow service focus ("capture"), and flag where human judgment is required.  

  **Inputs:** Draft metric definition, target-setting method, 2 years of historical data (if available), service program description.  
  **Outputs:** PASS (no critical flaws), FAIL (unfixable flaw), HANDOFF (requires leadership decision), or REVISE (minor fixes needed).  

  ### Step-by-Step Procedure
  1.  **Define the Real Outcome (15 mins)**  
      *   **Question:** "What specific, real-world improvement for clients does this metric *intend* to represent? (Not what it measures directly)."  
      *   **Good Answer:** Concrete, client-centered outcome (e.g., "Clients achieve stable housing," "Clients gain employment skills").  
      *   **Bad Answer:** Vague ("Improved well-being"), output-focused ("Number of sessions delivered"), or paperwork-focused ("File completed").  
      *   **Stop/Handoff:** If no clear real-world outcome is articulated, HANDOFF to program staff to define the core purpose. If outcome is purely administrative, FAIL.

  2.  **Test for Easy Gaming (20 mins)**  
      *   **Question:** "How easily could a provider *deliberately* make this number look good without improving the Real Outcome? List specific tactics."  
      *   **Focus:** Look for creaming (selecting easy clients), reclassification (calling failure "ineligible" or "discharged"), effort diversion (shifting resources *only* to the measured element), or data manipulation (within audit rules).  
      *   **Good Answer:** Tactics are difficult, costly, easily detected via audit/ghost metric, or require provider self-harm (e.g., turning away revenue).  
      *   **Bad Answer:** Tactics are obvious, low-cost, and hard to detect (e.g., shortening appointments arbitrarily to hit "days to first appointment," prioritizing quick housing placements over suitable ones).  
      *   **Stop:** If easy, significant gaming tactics exist that can't be mitigated by audit, FAIL. Else, proceed.

  3.  **Test for Likely Capture (20 mins)**  
      *   **Question:** "If staff focus intensely *only* on maximizing this metric, what important parts of the mission/service quality might unintentionally degrade?"  
      *   **Focus:** Unmeasured client needs, service depth, ethical practice, long-term sustainability, equity (serving hardest cases).  
      *   **Good Answer:** Degradation is minimal or is actively monitored/controlled by other strong mechanisms (e.g., robust case reviews, separate quality metrics).  
      *   **Bad Answer:** Degradation is significant, likely, and undetected by other systems (e.g., neglecting counseling to rush to job placement).  
      *   **Handoff:** If significant degradation is likely and unavoidable, HANDOFF to leadership to decide if the metric's benefit outweighs this risk. Else, proceed.

  4.  **Assess Data Source & Audit Feasibility (15 mins)**  
      *   **Question:** "Can the data be verified from existing records *without* creating new burdens? Does it reflect the *real outcome* or just the *paperwork*?"  
      *   **Good Answer:** Data exists in auditable records (e.g., HMIS for housing), directly reflects real-world status (e.g., lease verification, employment verification), audit process is clear.  
      *   **Bad Answer:** Requires new data collection, relies solely on provider self-report without verification, measures paperwork completion not client status (e.g., "Assessment completed" vs. "Client understands plan").  
      *   **Stop:** If data cannot be reasonably audited from existing records, FAIL. If data reflects only paperwork, proceed cautiously to Step 5.

  5.  **Propose a Ghost Metric (15 mins)**  
      *   **Question:** "Identify a related, easily collectible data point from existing records that should move *in the same direction* as the paid metric if the Real Outcome improves, but is hard to game *in the same way*."  
      *   **Good Answer:** Ghost is causally linked to the Real Outcome, uses different data source/process than the paid metric, is genuinely low-burden (e.g., "Client self-reported stress level at intake" for a job placement metric).  
      *   **Bad Answer:** Ghost is easily gamed the same way, requires new data collection, isn't logically connected.  
      *   **Revise/Note:** If a good ghost exists, note it for inclusion. If not, flag increased risk. Doesn't automatically FAIL, but adds caution.

  6.  **Evaluate Target Setting (15 mins)**  
      *   **Question:** "Is the target based *only* on 'last year + X%'? Does this unfairly penalize high performers or ignore context?"  
      *   **Good Answer:** Target considers baseline performance, historical trends, external factors, provider capacity, and desired improvement. Uses percentiles, negotiated ranges, or tiered targets.  
      *   **Bad Answer:** Rigid "last year + X%" applied indiscriminately.  
      *   **Revise:** Recommend alternatives: Top Quartile (target = 75th percentile of peers), Improvement Band (target = baseline + 5-10% range), or Negotiated Contextual Target. Mandate REVISE if only "last year + X%".

  7.  **Final Gap Check (20 mins)**  
      *   **Question:** "Reviewing Steps 1-6, does this metric clearly link to the Real Outcome? Is the risk of Gaming or Capture acceptable given the program goals? Can it be audited? Is the target fair?"  
      *   **Decision:**  
          *   PASS: All steps satisfied, minor revisions noted.
          *   REVISE: Fixable issues found (e.g., target method, ghost metric added).
          *   FAIL: Fundamental, unfixable flaw found (e.g., inevitable gaming, no audit trail, no real outcome link).
          *   HANDOFF: Requires value judgment (e.g., accepting high Capture risk for critical metric, defining "hardest cases").

  ---
  **Walkthrough: Referral-to-Appointment Time (Avg Days)**

  1.  **Real Outcome:** Timely access to needed services. (PASS)
  2.  **Gaming Test:** *Very Easy.* Providers can: Rush intake calls, skip thorough assessments, prioritize "quick-win" clients, decline complex referrals, mark no-shows as "not eligible." (FAIL - Critical Flaw). **PROCEDURE STOPS: FAIL.**  
      *Even with perfect audit showing the date math is correct, the number becomes meaningless or harmful due to gaming. Drop it or make it a non-payment quality indicator.*

  **Walkthrough: % in Same Housing at 6 Months**

  1.  **Real Outcome:** Clients achieve stable, suitable housing. (PASS)
  2.  **Gaming Test:** *Moderately Easy.* Providers can: Place clients in any available housing (even unsuitable/unsafe), coerce clients to stay in bad situations, avoid placing high-risk clients, re-house clients quickly just before 6mo mark. (REVISE: Needs mitigation).
  3.  **Capture Test:** *Likely.* Staff may focus solely on keeping the lease for 6 months, neglecting support needed for *sustainable* stability (e.g., budgeting, landlord mediation, mental health). (REVISE: Needs mitigation).
  4.  **Audit:** Usually feasible via lease/utility checks in HMIS. (PASS).
  5.  **Ghost Metric:** *"% clients reporting feeling 'safe and stable' in housing at 6 months"* (via short survey). Should correlate with staying housed. Different gaming vector. (PASS - Include Ghost).
  6.  **Target:** "Last year + 3%" is problematic. (REVISE: Use Top Quartile or Improvement Band).
  7.  **Gap Check:** Metric links to outcome but has risks. Mitigations (Ghost, revised target) possible. **REVISE:** Implement Ghost Metric and change target method.

  **Walkthrough: Serving the Hardest Cases (Proposed Metric: "% Caseload with High Complexity Score")**

  1.  **Real Outcome:** Vulnerable clients with complex barriers receive needed services. (Handoff - "High Complexity" and "receive needed" require definition).
  2.  **Gaming Test:** *Definitional.* Gaming depends entirely on how "High Complexity Score" is defined and verified. Providers could game the scoring tool. (Handoff - Need scoring definition/rules).
  3.  **Capture Test:** *High Risk.* Staff might focus on *labeling* clients complex, not necessarily *serving* them effectively. True "hardest cases" might still be avoided if scoring allows. (Handoff - Tied to definition).
  4.  **Audit:** Feasible only if complexity score is based on auditable data (e.g., diagnosis codes, specific assessed needs), not just caseworker judgment. (Handoff - Need definition).
  5.  **Ghost Metric:** Difficult. Could be *"% High Complexity clients showing improvement on core need (e.g., reduced ER visits, increased income)"*, but this requires defining "core need" and data collection. (Handoff).
  6.  **Target:** "Last year + X%" irrelevant until baseline defined. (Handoff).
  7.  **Gap Check:** Core value judgment required. **HANDOFF:** Leadership/program must define: 1) What makes a case "hardest"? (Auditable criteria), 2) Is the goal just *serving* them (easy to game) or *achieving outcomes*? 3) What's the minimum acceptable service level? 4) How to verify? Procedure stalls here pending human decisions.

  ---
  **Where a Person Has to Decide (Judgment Calls Dressed as Steps)**

  The procedure forces these judgments into the open at specific HANDOFF points:
  1.  **Defining the Core Purpose (Step 1):** What outcome *truly* matters? Is paperwork compliance *really* the goal? (Often not).
  2.  **Accepting Risk (Steps 2, 3, 7):** Is the risk of Gaming or Capture acceptable *for this specific program goal*? Is perfect measurement impossible but the metric still worth using? (e.g., Housing stability has risks but is critical).
  3.  **Defining Values & Fairness (Walkthrough 3):** Who *are* the "hardest cases"? What do we *owe* them? How much provider performance risk is acceptable to serve them? What defines "service"? These are ethical and policy choices, not technical ones.
  4.  **Target-Setting Philosophy (Step 6):** Is the priority fairness to providers, stretching performance, or predictability? Each method implies a value.

  ---
  **What This Procedure Can't Tell Me (150 words)**

  1.  **Sophisticated Fraud:** It finds *obvious* gaming tactics, not elaborate schemes hiding within auditable data.
  2.  **Perfect Ghost Metrics:** Finding a truly independent, causal ghost is hard. Some metrics resist this.
  3.  **True Causality:** It can't prove the metric *causes* the outcome, only that it correlates and is hard to fake.
  4.  **Systemic Underfunding:** If payment rates are too low, providers *must* game or capture to survive, regardless of metric design. This identifies symptom, not root cause.
  5.  **Provider Culture:** It assumes rational actors. It can't predict if a provider's culture will resist capture or embrace gaming.
  6.  **Unforeseen Consequences:** New, creative distortions might emerge later.
  7.  **Data Gaps:** If critical data (e.g., client outcomes) simply doesn't exist *anywhere*, the procedure flags it but can't create it. You may need HANDOFF to decide if a proxy metric is acceptable despite flaws.

  **Final Note:** The ghost measure trick is **sound in principle but fragile**. It breaks if:
  *   The ghost is gamed the *same way* as the main metric.
  *   The ghost isn't truly independent (e.g., both rely on caseworker classification).
  *   The causal link between the paid metric and the ghost is weak or non-existent.
  *   Providers notice and start manipulating the ghost too. Use it sparingly and quietly.
