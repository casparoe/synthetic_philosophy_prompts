prompt: |-
  Looking for a name for a move I keep catching in talks and in my own drafts — or, if there isn't one, a coinage I can define tightly enough to actually use in a methods section.

  Setup. Someone reports a number for some trait (BMI, years of schooling, whatever) that's meant to capture how much of the variation in that trait, in that population, tracks genetic differences. Then, sometimes in the same sentence, the number gets used to answer questions I'm pretty sure are different questions:

  - How much of *this one person's* trait is genetic — as if you could take an individual's value and carve it into a genetic bit and an environmental bit in the same proportion. A reviewer on a paper I'm revising basically did this: the heritability of BMI is high, so a school-food intervention isn't worth evaluating.
  - Whether the gap between group A and group B is genetic. The number was estimated *within* groups, or in some mixed sample, and now it's being wheeled in to explain a difference *between* them.
  - Whether the trait is "really" biological, fixed, in the genes — as opposed to something messy and social.

  The bit that makes me think these are one thing and not three: the number is a ratio, and both halves of it depend on what happens to be varying in the population and setting where you measured it. Homogenize the environment and the number goes up. So the population where an environmental intervention has *already* equalized things is exactly the population where the number looks most "genetic," and a population with wildly unequal environments is where it looks least genetic. Its not just a number that gets misread; it moves in the direction that reads as "genes matter more" precisely when the environment got made uniform.

  Two test cases I use to check whether I understand it:
  (a) A disease that's entirely caused by a dietary deficiency everyone in the population shares — so it's fully preventable with a supplement — where the only genetic variation is in how badly each person is affected by the deficiency. Seems to me the number here could be near 1, for a trait I'd call 100% environmental.
  (b) Same trait, same gene pool, two populations kept in different conditions: the number is high within each, and the mean difference between them is entirely environmental.

  So: is there a term of art for this? Not for each bullet individually — I know people say the "high heritability doesn't mean unchangeable" thing — but for the family, including the sensitivity-to-what's-varying bit. If the honest answer is that there's no umbrella term, just say that plainly; I'd rather get that than a name that covers one bullet and leaves me overgeneralizing.

  Neighbors I've considered and why they seem off: reification (too big — it covers reifying g, reifying race, everything), ecological fallacy (wrong structure: that's aggregate vs individual correlations, mine is a quantity that only has a value relative to a distribution being read as intrinsic), Goodhart's law (close for the "goes up when you fix the environment" part, but nobody's gaming a metric in my cases).

  What I actually want out of this: whether there's a real term and how it's defined; if not, a coinage plus a definition that says what is and isn't an instance; whether my first two bullets are genuinely the same error or whether the second one is really about counterfactuals rather than attribution; and whether the sensitivity bit is the same phenomenon or a symptom of it. Also a boundary case I can't sort out: predicting response to selection *is* an intervention, and the number is legitimately used there — so the error can't be "using it for any intervention claim." Where's the line? And if there's a legitimate use that lets you read it as being about individuals, I need to know, because my definition has to leave room for it.

  I'm a PhD student in epidemiology (gene–environment stuff in cohort data), so be as technical as you like, and don't bother with references or a reading list — I can chase those later. Please dont just hand me "heritability is a population statistic"; I know that sentence, I dont know what the *error* is called. Answer in American English if you can — I'm lifting sentences into a manuscript going to a US journal. Under ~700 words would be ideal.
reasoning: |-
  Alright, let's tackle this query. The user is a PhD student in epidemiology working with gene-environment interactions. They're encountering a specific error where heritability estimates are misinterpreted in three ways: attributing proportions to individuals, explaining group differences, or equating heritability with biological fixity. The key insight is that heritability changes with environmental variation—homogenizing environments inflates it, making genetics seem more influential.

  First, I need to identify if there's an existing term for this error family. Common pitfalls like the "individualistic fallacy" or "between-group fallacy" come to mind, but they address parts, not the whole. The core issue is misinterpreting population-level statistics as intrinsic properties. The term "intrinsic attribution error" might capture this, emphasizing the mistaken belief that the statistic reflects an inherent trait quality rather than a population-specific measure.

  The user’s test cases (a and b) illustrate how heritability remains high even when environmental factors are the primary cause. This highlights the context-dependency of heritability. The sensitivity to environmental variation isn't a separate symptom but central to the error—it’s why the misinterpretation occurs.

  For the boundary case regarding selection response, it's legitimate because it operates within the same population context. The error arises when the statistic is applied outside its contextual constraints, like individual attribution or cross-group comparisons. The user needs to clearly demarcate valid uses (predicting selection) from invalid extrapolations.

  The coinage "contextual erasure" or "context collapse" could work, but "intrinsic attribution error" is more precise. It ties the error to cognitive biases, fitting the pattern of treating a relational measure as inherent. The definition must stress that heritability's value is tied to existing environmental variance, not an immutable property.

  The three bullets are manifestations of the same error: collapsing a population-level, context-dependent statistic into an intrinsic attribute. The sensitivity to environmental variance is the mechanism enabling this error, not a separate phenomenon. 

  Finally, the user’s deeper need is to articulate this error in their manuscript, requiring a tight definition that distinguishes valid from invalid uses. Ensuring the term covers all three misinterpretations while acknowledging legitimate applications like selection prediction is crucial for their methods section.
answer: |-
  Based on your description and the core unifying feature (misinterpreting a population-level, variance-ratio statistic as an intrinsic property of the trait or individual, ignoring its dependency on the specific environmental variation present), the most precise term for this *family of errors* is **the Intrinsic Attribution Error for Heritability (or other variance ratios)**.

  **Why this term fits:**

  1.  **"Intrinsic Attribution":** Captures the core mistake: Attributing an *intrinsic, inherent, context-independent* property (e.g., "how genetic this trait *is*", "how much genes explain *this individual's* value", "how fixed this trait *is*", "why groups *differ*") to the trait, individual, or group difference based *solely* on a population statistic (heritability) that is fundamentally *relational* and *context-dependent*.
  2.  **"Error":** Clearly marks it as a fallacy/misinterpretation.
  3.  **Parenthetical "(or other variance ratios)":** While heritability (`h²`) is the prime example, the error conceptually applies to similar population-level variance partition statistics (e.g., `c²` for shared environment).
  4.  **Distinguishes from Neighbors:**
      *   **Reification:** Too broad. Intrinsic Attribution is a *specific type* of reification applied to variance ratios.
      *   **Ecological Fallacy:** Wrong structure. This isn't inferring individual-level relationships from aggregate data; it's misattributing the *meaning* and *applicability* of a population-level parameter itself.
      *   **Misunderstanding Heritability:** Too vague. This specifies *how* it's misunderstood.
      *   **"Heritability is not..." statements:** These describe what heritability *isn't* but don't name the *error* of interpreting it as if it *were* that thing. "Intrinsic Attribution" names the erroneous act.

  **Definition:**

  > **The Intrinsic Attribution Error for Heritability (or other variance ratios)** occurs when a population-level statistic quantifying the proportion of phenotypic variance attributable to genetic variation *within a specific population under prevailing environmental conditions* (`h²`) is misinterpreted as representing:
  >
  > 1.  **Individual Attribution:** The proportion of an *individual's* phenotypic value determined by their genes.
  > 2.  **Group Difference Attribution:** The proportion of the phenotypic *difference between groups* determined by genetic differences between those groups, especially when `h²` was estimated *within* groups or in a mixed sample not representative of the between-group context.
  > 3.  **Trait Fixity:** The degree to which the trait is biologically fixed, immutable, or "in the genes" in an absolute sense, rather than being a description of variance partitioning under *current* conditions.
  >
  > This error arises from ignoring the fundamental dependency of `h²` on the *relative magnitudes* of genetic variance (`V_G`) and environmental variance (`V_E`) *within the studied population*. Crucially, `h² = V_G / (V_G + V_E)`. Changes in `V_E` directly alter `h²`, meaning `h²` increases as environmental variation *decreases* (even if `V_G` stays constant), and decreases as environmental variation *increases*. An `h²` value is only interpretable relative to the specific distribution of environments present during its estimation.

  **Addressing Your Specific Queries:**

  1.  **Are Bullets 1, 2, & 3 the Same Error?** Yes, fundamentally. They are distinct *manifestations* of the same core error: treating the population-level variance ratio `h²` as if it were an intrinsic property applicable to individuals, group differences, or the trait's absolute nature, divorced from the environmental context defining its value. Bullet 2 *is* about attribution (attributing the group difference to genes based on within-group `h²`) and relies heavily on ignoring the sensitivity to `V_E`.
  2.  **Is the Sensitivity the Same Phenomenon or a Symptom?** The sensitivity (`h²` changing with `V_E`) is the *mechanism* that *enables* the misinterpretation to be particularly misleading (as per your "homogenize the environment" point). It's not just a symptom; it's the core mathematical property that makes the intrinsic attribution erroneous and counter-intuitive in the ways you describe (your test cases hinge on this).
  3.  **The Boundary Case: Predicting Response to Selection.** This is the **legitimate use** that clarifies the boundary. Selection response (`R = h² * S`) works *because* it operates *within the same population context* where `h²` was estimated. The key is:
      *   **Context Constancy:** The prediction assumes the genetic variance (`V_G`) and the *distribution of environmental effects* impacting the trait variance (`V_E`) remain largely unchanged between the generation where `h²` was estimated and the generation undergoing selection. The intervention (selective breeding) changes the *genetic composition*, not the fundamental environmental variance structure relevant to the trait *within that population setting*. The error occurs when `h²` is used to predict the effect of an intervention that *directly alters the environmental variance structure* (like your school-food program) or when applied *across* contexts (like attributing group differences).
      *   **The Line:** Legitimate use involves predicting outcomes of altering the genetic composition *within the same environmental context*. The Intrinsic Attribution Error occurs when `h²` is used to infer properties *of individuals*, *of group differences*, *of absolute fixity*, or to predict outcomes of interventions that *alter the environmental variance context* itself.

  4.  **Legitimate Use for Individuals?** **No.** `h²` tells you *nothing* deterministic about an individual's genetic vs. environmental "share". An individual with a very high BMI in a population with high `h²` could have that BMI due to genes, environment, or (most likely) GxE interplay. High `h²` only means that, *in that population*, the observed *differences* between people are largely driven by genetic *differences*. It doesn't partition any *one* person's value. Any attempt to do so based solely on `h²` commits the Intrinsic Attribution Error (Bullet 1).

  **Why This Coinage Works for Your Manuscript:**

  *   **Precise:** Targets the specific error family.
  *   **Descriptive:** "Intrinsic Attribution" clearly conveys the nature of the mistake.
  *   **Technical:** Uses standard statistical language (`h²`, `V_G`, `V_E`).
  *   **Bounded:** Defines the error and its manifestations clearly.
  *   **American English:** "Attribution" and "Error" are standard terms.
  *   **Fits Methods Section:** Provides a concise label and definition to cite when critiquing others' interpretations or justifying your own careful approach.

  **In Practice:**

  > "Interpreting the heritability estimate (`h² = 0.7`) as indicating that 70% of any individual's BMI is genetically determined constitutes an **Intrinsic Attribution Error for Heritability**. This error ignores the population-specific nature of `h²`, which reflects the proportion of *variance* attributable to genetic differences *under current environmental conditions* and cannot be partitioned within an individual. Similarly, applying this within-population `h²` to infer the genetic contribution to BMI differences *between* socio-economic groups commits the same error type, as it fails to account for potentially different distributions of environmental factors contributing to `V_E` across groups."

  This term directly addresses your need: a name for the specific, recurring misinterpretation pattern centered on ignoring the context-dependency of heritability and falsely attributing intrinsic meaning to it.
