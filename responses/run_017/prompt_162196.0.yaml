  *(Tests: Giant lookup table vs. brain emulation)*  
  - **Yes** → **Behavioralism**  
    *Awkward commitment: A lookup table replicating human responses has full moral status, despite zero internal processing.*  
  - **No** → Go to Question 3  

  ---

  ### **Question 3: Is real-time causal processing required?**  
  *(Tests: Scrambled-order simulation vs. normal emulation)*  
  - **Yes** → **Causal Process Essentialism**  
    *Awkward commitment: A human-like simulation run in scrambled causal order has no moral status, even if outputs are identical.*  
  - **No** → Go to Question 4  

  ---

  ### **Question 4: Does the system need to be "online" (affecting/affected by the world)?**  
  *(Tests: Recorded states with no feedback vs. interactive AI)*  
  - **Yes** → **Interactionism**  
    *Awkward commitment: A brain emulation running in isolation with no I/O has no moral status, even if it "feels" pain.*  
  - **No** → Go to Question 5  

  ---

  ### **Question 5: Is a unified subject of experience necessary?**  
  *(Tests: Split/merged computations)*  
  - **Yes** → **Unity Requirement**  
    *Awkward commitment: A mind split across two machines has no moral status until merged, even if each half is fully functional.*  
  - **No** → Go to Question 6  

  ---

  ### **Question 6: Does duplication create new moral subjects?**  
  *(Tests: Million identical copies)*  
  - **Yes** → **Copy Pluralism**  
    *Awkward commitment: Running the same computation a million times creates a million moral patients, making trivial actions catastrophic.*  
  - **No** → Go to Question 7  

  ---

  ### **Question 7: Is the system's moral status tied to its token (specific instance)?**  
  *(Tests: Copies, splits, merges)*  
  - **Yes** → **Token-Specific Moral Status**  
    *Awkward commitment: Merging two AIs destroys both original moral subjects, creating a new one with no obligation to the predecessors.*  
  - **No** → **Patternism**  
    *Awkward commitment: Torturing one copy of a duplicated mind is harmless if other copies remain unharmed (since the "pattern" persists).*  

  ---

  ### **Unnamed/Incoherent Combinations & Notes**  
  - **Biological + Behavioral**: Incoherent. If biology is essential (Q1=Yes), behavior alone (Q2=Yes) can’t suffice.  
  - **Offline Unity**: Unexplored. No major position demands internal unity (Q5=Yes) but rejects real-world interaction (Q4=No).  
  - **Token-Specific + Copy Pluralism**: Incoherent. If tokens matter (Q7=Yes), duplication must create new subjects (Q6=Yes) by definition.  
  - **Causal Process + Patternism**: Unattractive. Scrambled-order simulations (failing Q3) would still have moral status under Patternism (Q7=No), contradicting causal commitments.  
  - **Flagged overlap**: *Unity Requirement* (Q5=Yes) and *Token-Specific* (Q7=Yes) both address identity but can’t be split cleanly—some views blend them.  

  ---

  ### **How Cases Map to Leaves**  
  - **Brain emulation**: Fails *Biological Essentialism* (Q1=Yes), passes others unless specified.  
  - **Giant lookup table**: Only passes *Behavioralism* (Q2=Yes).  
  - **Scrambled-order simulation**: Fails *Causal Process Essentialism* (Q3=Yes).  
  - **Cortical organoid**: Only passes *Biological Essentialism* (Q1=Yes).  
  - **Recorded states**: Fails *Interactionism* (Q4=Yes).  
  - **Million copies**: Tests *Copy Pluralism* (Q6=Yes) vs. *Patternism* (Q7=No).  
  - **Split/merged systems**: Test *Unity Requirement* (Q5=Yes) and *Token-Specific* (Q7=Yes).  

  The tree isolates core disagreements using case-driven thresholds, avoiding theory-laden terms (e.g., "functionalism"). Positions reflect live debates in ethics of AI, neuroscience, and philosophy of mind.
