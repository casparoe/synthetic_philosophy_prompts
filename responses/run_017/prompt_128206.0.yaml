prompt: |-
  Before I read any more of the literature on deriving the Born rule in the no-collapse picture, I want the standard such a derivation should be held to. Please write me the desiderata: what a derivation of the squared-amplitude rule, inside a purely unitary quantum mechanics, would have to deliver in order to count as solving the problem rather than relocating it. The purpose I have in mind fixes what adequate means here: the result should let an Everettian claim honestly that the theory predicts the statistics we observe, instead of borrowing the rule from textbook quantum mechanics while presenting it as derived.

  For each requirement, give the case or consideration behind it, and mark it either non-negotiable or a preference of one camp. Please also cover, and say where they belong on the list: the split between the qualitative worry, that is, what probability even means if every outcome is realized, and the quantitative one, that is, why squared amplitude rather than plain amplitude or a count of branches; whether a derivation that rests on axioms of rational choice has really satisfied a non-circularity requirement or has only pushed the bump elsewhere in the carpet; and three worries of my own. First, decoherence never quite zeroes the off-diagonal terms, so branches are emergent, approximate, and relative to a coarse-graining: the derivation must attach weights to merely approximate branches, must say what the residual tails contribute rather than assume they vanish, and must not presuppose that there is a definite number of branches at a time. Second, it should be invariant under refining or merging the branch decomposition, so that the weights do not depend on how finely outcomes are individuated. Third, the branching structure contains branches whose recorded statistics are wildly non-Born, so the derivation must explain what makes our evidence confirmatory without presupposing a typicality measure that already uses squared amplitudes.

  Flag any pair of desiderata you suspect cannot be jointly satisfied, and say which single requirement does the most work in excluding candidate derivations; note any requirement that only makes sense for finite-dimensional, discrete-outcome cases. Close with a single paragraph scoring the main strategies by type only, decision-theoretic, symmetry or invariance-based, self-locating-uncertainty, and structural theorems in the spirit of Gleason, against your list. No citations and no reading list; a table is fine, and I can find the papers myself.
reasoning: |-
  Okay, the user is asking for a rigorous set of criteria to evaluate derivations of the Born rule in Everettian quantum mechanics. They clearly want to avoid circularity or hand-waving - this is about establishing whether the derivation truly solves the problem rather than disguising it. 

  Hmm, they're focused on three specific concerns: the approximate nature of branches due to decoherence, invariance under branch refinement, and handling maverick branches with non-Born statistics. These are all pain points in the literature. The user seems technically sophisticated - probably a grad student or researcher who's encountered too many "derivations" that quietly presuppose what they claim to prove.

  Let me structure this carefully. First, the core philosophical requirements: the derivation must genuinely explain probability (not just assume it) and specifically justify squared amplitudes over other options. These are non-negotiable - without them, we're just relabeling the problem. Then their three concerns: approximate branches, refinement invariance, and maverick branches. All non-negotiable for the reasons they gave.

  The decision-theory approaches... tricky. If a derivation uses axioms of rationality to "derive" probability, but those axioms secretly assume probabilistic expectations, that's circular. So we need to flag that as non-negotiable: no buried probabilistic premises. 

  For implementation: must work for continuous systems (decoherence tails), no branch counting (since branches aren't discrete), and handle changing branch number. The maverick branch issue is particularly nasty - any derivation that relies on typicality must justify why we use the Born measure for typicality.

  I suspect two tensions: (1) justifying probability without any circularity while still connecting to decision theory, and (2) handling approximate branches while maintaining refinement invariance. The branch non-absoluteness requirement does the heaviest lifting in killing flawed derivations - many assume perfect decoherence or discrete branching.

  For strategy scoring: Decision-theoretic approaches often fail on circularity. Symmetry arguments struggle with approximate branches. Self-locating uncertainty gets wrecked by maverick worlds. Gleason-type theorems are promising but need careful interpretation to avoid presuppositions. 

  The user wants this as a practical evaluation tool - no citations needed, just the logical framework. They'll appreciate clear labeling of non-negotiables versus preferences. Should emphasize that "no branch counting" is non-negotiable - that's where many naive attempts fail.
answer: |-
  Here's the desiderata for an Everettian Born rule derivation, structured by your requirements. Non-negotiables (NN) are essential for solving (not relocating) the problem; preferences (P) reflect intra-camp disagreements.

  ### Core Desiderata
  1.  **Non-Circular Justification of Probability (NN):** The derivation must ground the *meaning* of probability in the deterministic, branching wavefunction without presupposing probabilistic axioms or Born-rule statistics. It must resolve the "qualitative problem": why uncertainty/credence applies when all outcomes occur.
      *   *Case:* Without this, the derivation merely assumes probability needs to exist in Everett, begging the central philosophical question.
  2.  **Specific Identification of Squared Amplitude (NN):** The derivation must uniquely select the *squared modulus* of the amplitude as the weight, not |ψ|, |ψ|^4, branch count, or any other function. It must resolve the "quantitative problem".
      *   *Case:* |ψ|^2 is empirically observed; alternatives like |ψ| or counting lead to grossly incorrect predictions. Justifying "weight" isn't enough.
  3.  **No Covert Probabilistic Assumptions (NN):** The derivation cannot rely (explicitly or implicitly) on premises that themselves assume the concept of probability, stochasticity, or expectation values defined via the Born rule.
      *   *Case:* Decision-theoretic (DT) approaches often fail here. If rational agent axioms (e.g., continuity, dominance) implicitly encode probabilistic expectations (e.g., valuing linearly additive measures), the bump is merely pushed under the rationality carpet. Genuine derivation must build probability from non-probabilistic quantum ontology.
  4.  **Respects Decoherence & Approximate Branches (NN):** Must work with the *actual* output of decoherence: branches are emergent, approximate, defined relative to a coarse-graining (system, environment, observable, tolerance). It must:
      *   Assign weights to fuzzy branches without assuming perfect diagonality (ε=0).
      *   Account for the physical insignificance of the "tails" (residual off-diagonal terms) without assuming they vanish mathematically.
      *   Not presuppose a definite, countable number of branches at any time.
      *   *Case:* Decoherence is approximate and basis-dependent. A fundamental derivation must handle reality, not an idealized limit.
  5.  **Branching Basis Invariance (NN):** The weight assigned to a *physical outcome* (e.g., "measurement apparatus reads X") must be invariant under refinements or coarsenings of the branch decomposition used to describe that outcome.
      *   *Case:* Weights must depend only on the quantum state and the physical outcome definition, not on how finely we choose to resolve the branching history leading to it. Avoids "branch counting" fallacies.
  6.  **Handles Maverick Branches (NN):** The derivation must explain why our evidence (e.g., long-run relative frequencies matching Born statistics) is confirmatory, even though the branching structure inevitably contains branches where recorded statistics wildly deviate from the Born rule (e.g., every quantum coin flip lands heads).
      *   *Case:* If probability is defined via typicality (fraction of branches), but typicality is defined using Born weights, it's circular. Must explain why Born-weight-typical branches are "relevant" or "representative" without presupposing the Born rule as the measure of typicality.
  7.  **Applies to Realistic (Continuous/Infinite-Dimensional) Systems (P -> NN for full adequacy):** Must work for continuous observables, infinite-dimensional Hilbert spaces, and quantum field theory, not just discrete qubits. (Often treated as NN for a fundamental solution).
      *   *Case:* The real world isn't discrete/finite. Derivations relying on dimension-counting or exact branch isomorphism fail here.

  ### Worries & Their Classification
  *   **Qualitative (Probability Meaning) vs. Quantitative (Squared Amplitude):** Both are **NN** and distinct. A derivation must solve both: *why* probability? and *why* |ψ|²? Solving one doesn't solve the other.
  *   **Decision-Theoretic Circularity:** Covered under **Desideratum 3 (NN)**. DT derivations fail if their rationality axioms smuggle in probabilistic expectations.
  *   **Your Worry 1 (Approximate Branches):** Covered under **Desideratum 4 (NN)**.
  *   **Your Worry 2 (Branching Basis Invariance):** Covered under **Desideratum 5 (NN)**.
  *   **Your Worry 3 (Maverick Branches):** Covered under **Desideratum 6 (NN)**.

  ### Suspected Tensions & Key Excluder
  *   **Tension:** **Desideratum 6 (Maverick Branches)** and naive **branch-counting** (excluded by 4 & 5) are fundamentally incompatible. Resolving 6 robustly usually requires leveraging the quantum state structure itself (e.g., 2) in a way that makes maverick branches physically irrelevant *without* counting.
  *   **Hardest Hitter:** **Desideratum 4 (Approximate Branches)** does the most work in excluding candidates. Many derivations implicitly assume perfect decoherence (ε=0), discrete decompositions, or a fixed branch count, collapsing under the reality of tails and coarse-graining.

  ### Requirement Scope
  *   **Finite-Dimensional/Discrete Limitation:** Desiderata relying on **exact branch counting, isomorphism, or dimension ratios (not weights!)** only make sense for finite/discrete cases. **Desiderata 4, 5, 7** explicitly require going beyond this. A derivation satisfying 1-3 & 6 but failing 4, 5, or 7 is incomplete/non-fundamental.

  ### Strategy Scoring vs. Desiderata

  | Strategy Type        | Non-Circ Prob (1) | Squared Amp (2) | No Covert Prob (3) | Approx Branches (4) | Basis Invariance (5) | Mavericks (6) | Realistic (7) | Notes                                                                 |
  | :------------------- | :---------------- | :-------------- | :----------------- | :------------------ | :------------------- | :------------ | :------------ | :-------------------------------------------------------------------- |
  | **Decision Theoretic**   | Weak              | Mixed           | **Fails (NN)**     | Mixed               | Strong               | Mixed         | Mixed         | Often violates **3** (covert prob). Struggles with **6**.             |
  | **Symmetry/Invariance** | Weak              | **Strong**      | Strong             | **Fails (NN)**      | Strong               | **Fails (NN)** | **Fails (NN)** | Often assumes perfect decoherence/basis (**4,7**) & ignores **6**.    |
  | **Self-Locating Uncert** | **Strong**        | Weak            | **Strong?**        | **Fails (NN)**      | Weak                 | **Fails (NN)** | **Fails (NN)** | Addresses **1** but often assumes weights for credence (**2,3?**), fails **4,6,7**. |
  | **Gleason-Structural**   | Weak              | **Strong**      | **Strong**         | **Strong?**         | **Strong**           | **Weak**      | **Strong?**   | Best on **2,3,5,7**. Needs **supplementation for 1 & 6**. Handles **4** better than most. |

  **Summary:** No current type satisfies all NN desiderata perfectly. **Gleason-structural** approaches (using the quantum state's linear structure) score best overall on the quantitative and formal constraints (2,3,5,7) and can handle approximation (4) better than others, but require independent justification for the *meaning* of probability (1) and handling maverick branches (6). **DT** fails core non-circularity (3). **Symmetry** and **SLU** fail on the physical realities of decoherence (4,7) and mavericks (6). A successful derivation likely needs a **hybrid** approach, combining the robustness of structural arguments with a compelling resolution of probability and typicality (1 & 6).
