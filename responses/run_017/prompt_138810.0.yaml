  - No-Alternatives: exposes how funding and effort distort perceived theory space
  - Meta-Inductive: highlights reference class selection bias
  - Unexpected-Coherence: reveals how aesthetic judgments get formalized

  For the meeting items:
  (a) The spoiler-theory filing will showcase how easily the "no alternatives" criterion can be gamed commercially. I'll depict the panel ignoring the epistemological problem to focus on procedural definitions.
  (b) Reference-class gerrymandering will demonstrate the circularity in selecting historical analogs. The procedural "solution" of discretionary uplift should feel painfully familiar to academics.
  (c) The Boltzmann-brain compliance issue will reduce profound observational consequences to box-ticking bureaucracy.
  (d) The publicity incident will juxtapose institutional hype with philosophical precision, leaving the tension unresolved.

  The satire must avoid caricature. Each scenario exaggerates real positions: 
  - Defenders like Dawid and Smolin do treat absence of alternatives as evidence
  - Meta-inductions rely on contested historical narratives
  - Unexpected coherence reflects actual theory-preference heuristics

  In the meta-note, I'll clarify that while defenders acknowledge these are weaker than empirical confirmation, they argue such assessments are necessary for untestable theories. The strongest counter is that these criteria remain subjective - but the strongest defense is that they systematize what theorists already do implicitly.

  The bureaucratic voice must stay deadpan throughout. No winks, just accurate epistemology processed through committee logic. I'll invent all names/entities to avoid real-world references while keeping the physics concepts precise.
answer: |-
  **MINUTES OF THE 47TH MEETING OF THE NON-EMPIRICAL ASSESSMENT PANEL (NEAP)**  
  **Date:** 17 October 2024  
  **Time:** 10:00 – 13:15  
  **Location:** Virtual (Secure Portal #NEAP-47)  

  **Present:**  
  Dr. A. Vance (Chair, Intl. Found. for Fundamental Inquiry)  
  Prof. E. Thorne (Vice-Chair, Centre for Structural Realism)  
  Dr. R. Sato (Dir., Meta-Theoretical Standards)  
  Dr. L. Finch (Rep., Typicality Compliance Office)  
  Prof. M. Dubois (Rep., Consortium for Theoretical Unity)  
  Dr. K. Petrova (Legal Advisor, Funding Governance)  

  **Apologies:**  
  Prof. J. Al-Hassan (Recused - Agenda Item 3b)  

  **1. Welcome and Declarations of Interest**  
  The Chair welcomed attendees. No new declarations of interest were noted.  

  **2. Agenda Item 3a: Assessment of ‘Spoiler’ Submission re: Chronometric Unification Theory (CUT)**  
  *Background:* The Panel reviewed a filing by consultancy *Veritas Alternatives Ltd.* (VAL), commissioned by the Unified Field Studies Institute (UFSI), presenting a formally consistent alternative to CUT (PCI: 8.623). VAL’s "Temporal Fragmentation Model" (TFM) intentionally violates energy conservation via cyclic singularities, described in VAL’s cover letter as "maximally unappealing but internally consistent".  
  *Discussion:*  
  - Dr. Sato noted TFM satisfies minimal consistency checks for an alternative.  
  - Prof. Dubois argued TFM’s deliberate "unappealing" construction and lack of peer endorsement rendered it non-viable.  
  - Dr. Petrova clarified funding rules define "alternative" solely by formal consistency, not viability.  
  *Motion:* "TFM qualifies as a non-empirical alternative to CUT for No-Alternatives scoring." (Moved: Dr. Sato; Seconded: Dr. Petrova)  
  *Vote:* 4 For, 1 Against (Prof. Dubois), 1 Abstention (Dr. Finch). Motion CARRIED.  
  *Action:* Secretariat to recalculate CUT’s No-Alternatives sub-score (Owner: Dr. Sato; Deadline: 31 Oct 2024).  

  **3. Agenda Item 3b: Meta-Inductive Reference Class Dispute**  
  *Background:* Competing submissions from the Nexus Group (NG) and the Planckian Dynamics Team (PDT) presented identical empirical fits but divergent Meta-Inductive sub-scores due to reference class selection:  
  - NG cited 7 historical cases of "theories without alternatives later empirically vindicated" (e.g., Maxwellian Aether Adjustment).  
  - PDT cited 23 "persistently unfalsifiable but abandoned theories" (e.g., Steady-State variants, Hoyle-Narlikar C-field).  
  *Discussion:*  
  - Prof. Thorne observed both classes meet procedural criteria, creating scoring disparity.  
  - Dr. Petrova confirmed applicants have discretion in reference class proposal per Sec. 4.2(b) of NEAP Guidelines.  
  - Dr. Finch noted the absence of objective grounds to prefer one class over another.  
  *Motion:* "Where multiple valid reference classes exist, the Panel may apply a discretionary uplift of +0.100 to the Meta-Inductive sub-score to mitigate perceived historical incompleteness." (Moved: Prof. Thorne; Seconded: Dr. Sato)  
  *Vote:* Unanimous. Motion CARRIED.  
  *Action:* Apply +0.100 uplift to PDT’s submission (Owner: Prof. Thorne; Deadline: 31 Oct 2024).  

  **4. Agenda Item 3c: Typicality Compliance - Multiverse Submission M7-Ω**  
  *Background:* The Typicality Compliance Office (TCO) reported on the "Eternal Inflationary Holography" (EIH) framework. EIH requires a measure to compute the fraction of observers with reliable cognitive faculties ("non-Boltzmann" observers). Applicant-selected measure Λ* implies 99.7% of observers like us are Boltzmann Brains (BBs) experiencing systematic illusions of theory confirmation.  
  *Discussion:*  
  - Dr. Finch confirmed Λ* is mathematically admissible but renders EIH’s predictions non-compliant with NEAP Typicality Standard 5.1: "The theory must predict that observers with reliable faculties are typical."  
  - Prof. Dubois questioned whether Λ*’s consequences invalidated EIH or merely required measure reassignment.  
  - Dr. Finch clarified compliance depends on the applicant’s declared measure, not latent possibilities.  
  *Motion:* "EIH fails Typicality Standard 5.1 under measure Λ*. Return for resubmission with compliant measure." (Moved: Dr. Finch; Seconded: Dr. Petrova)  
  *Vote:* Unanimous. Motion CARRIED.  

  **5. Agenda Item 4: Publicity Incident - String Harmony Institute (SHI)**  
  *Background:* SHI press release described its "Resonant Braneworld Model" (RBM, PCI: 9.110) as "supported by all available evidence". Dr. Sato flagged this as potentially misleading, as RBM lacks empirical confirmation.  
  *Discussion:*  
  - Prof. Thorne argued "supported" implies empirical confirmation absent in non-empirical contexts.  
  - Prof. Dubois countered that PCI 9.110 represents maximal non-empirical support, justifying "all available evidence".  
  - Dr. Petrova warned against NEAP policing institutional communications.  
  *Motion deferred pending guidance.*  
  *Action:* Draft NEAP Guidance on "Public Characterization of Provisional Confidence" (Owner: Dr. Petrova; Deadline: 30 Nov 2024).  

  **6. Any Other Business**  
  Dr. Finch announced TCO’s new automated measure-validation toolkit (v2.3).  

  **7. Date of Next Meeting**  
  14 January 2025, 10:00 (Virtual).  

  **Meeting closed:** 13:12  
  *(Minutes approved by Chair, 20 Oct 2024)*  

  ---

  **WHERE THIS TAKES LIBERTIES**  

  **I. Exaggeration vs. Genuine Commitment**  
  1.  **No-Alternatives:** The core commitment (Dawid 2013) is that *concerted, competent failure* to find alternatives provides weak evidence for a theory’s necessity. The satire exaggerates by:  
      -   Making the sub-score *adversarially manipulable* via commissioned spoilers (a logical extension, not a defended position).  
      -   Having the Panel ignore the *epistemic intent* (probing theory-space) in favor of procedural compliance.  
  2.  **Meta-Inductive:** Defenders (e.g., Dawid, Hartmann) argue *carefully constructed* reference classes (e.g., "fundamental theories addressing specific tensions") support weak induction. The satire exaggerates by:  
      -   Presenting *blatant gerrymandering* (vindicated-only vs. all unfalsifiable) as equally valid procedurally.  
      -   Reducing the historical argument to a *discretionary uplift*, divorcing process from epistemic justification.  
  3.  **Unexpected Coherence:** The genuine point (not always formalized as a "sub-score") is that unexplained internal consonance can boost credibility (Einstein's "inner perfection"). The satire transfers this weight to *Typicality Compliance*, exaggerating by:  
      -   Reducing the profound Boltzmann Brain problem to a *box-ticking exercise* about declared measures.  
      -   Implying a theory can be compliant *despite* predicting its own empirical unreliability for most observers.  

  **II. Settled vs. Contested**  
  *   **Contested:** The *evidential weight* of non-empirical factors is fundamentally contested. Critics (e.g., Ritson, Smolin) argue they carry minimal-to-zero confirmatory power and risk insulating theories from falsification.  
      *   *Defenders' Reply:* They explicitly deny this replaces empirical testing. They argue:  
          *   Non-empirical assessment provides *provisional* guidance for *untestable* theories when empirical testing is impossible (Dawid 2018).  
          *   It systematizes heuristic reasoning already used by scientists (e.g., preferring "elegant" solutions).  
      *   *Strongest Defense:* In contexts of severe empirical underdetermination (e.g., quantum gravity), ignoring all factors *except* empirical data (which doesn't exist) paralyzes theory choice. Non-empirical criteria offer a structured, defeasible alternative to arbitrary aesthetic preference.  
  *   **Settled (Among Defenders):**  
      *   Non-empirical assessment is *not equivalent* to empirical confirmation. It yields lower confidence.  
      *   It is only applicable when empirical testing is *impossible in principle* (currently), not merely difficult.  
      *   The criteria (No-Alternatives, Meta-Induction, Coherence) are *interdependent and heuristic*, not algorithmic.  
  *   **Contested Internally:** How to *define and weight* criteria. E.g., constructing the "correct" reference class for meta-induction is deeply problematic and contested even by proponents. The "No-Alternatives" state is always provisional and sensitive to community effort/resources – a point acknowledged but not resolved. The Boltzmann Brain problem is a recognized severe challenge for multiverse theories (Carroll 2017), but whether it is a *fatal flaw* or a *technical hurdle* remains hotly debated.
