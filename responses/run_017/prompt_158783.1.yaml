prompt: |-
  hey — so I'm the student rep on my school's "vote rules commitee" (ik the name sounds made up). Basically before every school-wide referendum we decide who actually gets to vote, and we do it per issue, so the electorate is different every time. I'm the only student on it, I get one vote out of five, and we've got to rule on the next one Thursday, so help me out before I go in there.

  Heres what we've already decided:

  - Bell schedule change (starts next fall, supposed to last 3 years): exchange students who are only here for one year — allowed to vote. Someone argued they'd be gone for 2 of the 3 years and got outvoted; the reasoning that won was that they're here for it when it starts.
  - Student dress code: teachers — NOT allowed, even though a bunch of them wrote in saying it changes how they manage their classrooms.
  - Renaming the school: last year's graduates — NOT allowed, even though the old name is literally printed on their diplomas.
  - New laptop/phone policy, 4 years, starting next fall: 8th graders at the feeder middle school who've already accepted a spot here — allowed to vote.
  - 5-year cafeteria contract: the cafeteria workers — NOT allowed. Also the parents who actually pay for the lunches — NOT allowed.
  - Discipline code rewrite: kids currently serving long-term suspension — allowed, and I'm pretty sure that one passed because they're the ones the code comes down on hardest.

  Also relevant: one member once floated giving the feeder 8th graders quarter-votes instead of full ones and it got shot down, so we've never done fractional voting.

  The new case: we're voting on a 20-year bond to build a field house on the grass field. There's a group of about 40 kids who are fully enrolled and full-time and on the roll, but they do everything online from five other countries and have never set foot on campus. They're under the student handbook, they graduate with our diploma, and they pay a reduced activity fee that specifically excludes campus facilities. Every one of them is gone within 4 years, so most of the bond gets paid off after they've left, and they will never use the field house. Do they get to vote?

  I feel like there's at least three different rules that fit all six of our old decisions and they disagree here, and idk which one we're actually running. They also seem kinda like the exchange students (here when it starts, gone before it ends, voted) and kinda like the alumni (gone while the effects are actually landing, didn't vote) and weirdly like the feeder 8th graders in reverse. So I can't tell what our own precedents commit us to.

  One more thing somebody on the commitee floated that I can't tell is genius or insane: for any decision whose effects outlast the people currently enrolled, add a "future students" proxy — one extra vote cast by a teacher on behalf of students who aren't enrolled yet — or require the decision to be re-ratified five years from now by whoever is enrolled then. If we did that instead of just ruling on the remote kids, what would we be signing on to?

  Can you write it up in these sections:

  - Bottom line (~1 short paragraph): what we should decide on Thursday, just tell me.
  - Rules that fit our precedents (~250 words): the 3 or 4 rules that explain all six old decisions, and what each one says about the remote kids specifically. I care alot more about the rule we seem to be running than about the answer itself, and I want to know which rules fit the old verdicts equally well.
  - Closest analog (~150 words): which old decision is the closest match, and why the match is bad in both directions.
  - What we'd be committing to (~200 words): what principle each option locks us into for every referendum after this one, including the proxy-vote idea and the fractional-vote idea we already rejected once.
  - The case that would settle it (~150 words): one or two further cases I could bring to the meeting that would tell the rules apart — the kind where rule A and rule B give different answers.
  - Settled vs contested (~150 words): I looked this up and apparently its an actual named problem in political philosophy that people fight about, so tell me what people who really study it agree on versus where they genuinely disagree. Don't make a contested thing sound like the consensus, and flag the parts of your own answer that are just your call rather than anything agreed on.

  sorry its long, thanks tho
reasoning: |-
  Okay, the user is a student rep on their school's vote rules committee, and they need help deciding whether remote international students should vote on a 20-year bond for a field house. They've provided six past decisions and need a structured analysis. 

  First, I need to unpack their core dilemma: they've identified that multiple conflicting principles could explain past decisions, and they need clarity on which implicit rule the committee has been following. Their anxiety about Thursday's meeting is palpable—they're outnumbered and need concrete ammunition.

  Looking at the precedents, three consistent patterns emerge. The "present enrollment" rule explains why exchange students (physically present at implementation) voted while alumni didn't. The "directly affected" principle covers why suspended students voted (discipline code impacts them) but cafeteria workers didn't (contract doesn't alter their work conditions). The "binding participation" angle justifies feeder 8th graders voting (bound by policy upon enrollment) but not parents (lunch payments are transactional, not compulsory). 

  For the remote students, all three principles conflict. They're enrolled now (like exchange students) but unaffected (like alumni) and pay a non-binding fee (unlike 8th graders). The alumni case is the closest parallel because both groups won't experience long-term consequences, but the enrollment status difference nags at me. 

  The proxy vote idea fascinates me—it's philosophically solid (representing future stakeholders) but practically messy. If proposed, it could force the committee to confront their inconsistent principles. However, given past rejection of fractional votes, they'll likely dismiss structural reforms. 

  I should emphasize that political philosophers agree on prioritizing affected interests but feud over how to define "affected." The committee's own precedents reveal they value both enrollment status and tangible impact, so pointing out this tension might sway them. 

  For Thursday, I'll recommend excluding remote voters—not because it's "correct," but because it best fits the alumni precedent where temporal disconnect outweighed formal ties. The key move will be exposing how other principles lead to contradictions: if they vote now, why didn't alumni vote on the renamed school affecting their diplomas? 

  ...Also, that discipline code decision is wild. Letting suspended kids vote is either admirably inclusive or utterly chaotic. No notes.
answer: |-
  ### Bottom line
  **Recommendation:** Exclude the remote international students from voting. They won't experience the bond's effects (never using the facility, gone before most payments occur), aligning with precedents excluding groups disconnected from long-term impacts (alumni, parents, teachers). Argue that "affected while enrolled" is our core rule, and they fail this test. Oppose the proxy idea as incompatible with our existing system.

  ### Rules that fit our precedents (~250 words)
  Four principles explain all six precedents:
  1.  **"Directly and Personally Affected While Enrolled":** Voting rights require experiencing the policy's *primary effects* during one's enrollment. *(Exchange students: affected by schedule start. Suspended kids: affected by discipline code. 8th graders: bound by tech policy upon enrollment. Teachers: not students/enrolled. Alumni: not enrolled. Cafeteria workers/parents: not enrolled students.)*
      *   *Remote Kids:* **No vote.** They won’t *use* the field house or bear financial burden *while enrolled*.
  2.  **"Formally Bound by the Policy During Enrollment":** If the policy actively governs you *as a student* during your enrollment period, you vote. *(Exchange students: bound by schedule. 8th graders: will be bound by tech policy. Suspended kids: bound by discipline code. Alumni: not bound by new name. Cafeteria workers: not bound as students. Teachers: not bound by dress code as students.)*
      *   *Remote Kids:* **No vote.** They are bound by the *student handbook generally*, but the *specific bond/facility* won't govern their actions or access *during their enrollment*.
  3.  **"Present on Campus During Implementation":** Physical presence when the policy takes effect grants a stake. *(Exchange students: present at schedule start. 8th graders: will be present for tech policy. Alumni/Remote kids: not present. Cafeteria workers: present but not students.)*
      *   *Remote Kids:* **No vote.** They are never physically present on campus.
  4.  **"Financial Stake via Enrolled Student Fees":** Paying mandatory fees tied to enrollment for the *specific affected area* matters. *(Parents pay for lunches but aren't students. Remote kids pay reduced fees *excluding* campus facilities. Alumni/Exchange students don't pay future bonds.)*
      *   *Remote Kids:* **No vote.** Their fees explicitly exclude campus facilities funding.

  **The Conflict:** Rule 1 & 2 clearly say **no vote**. Rule 3 also says **no vote**. Rule 4 is neutral or leans **no vote**. The "present at start" logic used for exchange students (Rule 3) is the *only* potential argument *for* inclusion, but the bond's 20-year duration and their guaranteed absence make it a weak fit compared to the stronger "affected/bound while enrolled" principles (Rules 1 & 2).

  ### Closest analog (~150 words)
  The **Alumni (Renaming)** case is the closest match, but imperfect:
  *   **Similarity:** Both groups have a formal, lifelong connection (diploma name / school enrollment status) but will be entirely absent when the policy's primary, long-term effects materialize (school using new name / students using & paying for the field house). The impact is largely symbolic or indirect for them.
  *   **Differences (Why the Match is Bad):**
      *   *Against Alumni Match:* Alumni are *no longer enrolled*, while remote kids *are currently enrolled and governed by the handbook*. This enrollment status links them more to the exchange students & 8th graders.
      *   *For Alumni Match:* The alumni's diploma connection is arguably *more tangible* (permanent physical document) than the remote student's enrollment connection to an unused facility. The bond's *financial burden* landing on future students mirrors the alumni's lack of future burden/benefit from renaming, unlike exchange students who *immediately* experienced the schedule change.

  ### What we'd be committing to (~200 words)
  Each decision sets a principle for future referendums:
  *   **Exclude Remote Kids:** Commits to **"Directly Affected While Enrolled"** as the primary rule. Future voters must experience the policy's *core impact* during their enrollment. Benefits: Clear, prevents transient voters on long-term issues. Risk: May exclude students tangentially connected.
  *   **Include Remote Kids:** Commits to **"Formal Enrollment Status"** as sufficient, regardless of actual impact or presence. This creates inconsistency (Why exclude alumni with lifelong ties?). Also opens the door for including *all* enrolled students on *every* issue, regardless of relevance.
  *   **Adopt "Future Students" Proxy:** Commits to **representing unborn constituencies** for *any* decision with effects beyond current enrollment. Requires defining the proxy's scope (which decisions?), selection method (teacher vote? admin appointee?), and legitimacy. Radically changes the committee's nature, inviting endless debate on future impact for *every* vote.
  *   **Re-ratification Requirement:** Commits to **temporal limits on decisions**. Any policy lasting beyond X years must be re-approved. Creates administrative burden and potential instability (e.g., bond payments starting then canceled). Focuses on policy duration, not voter eligibility.
  *   *(Fractional Votes - Rejected):* Would have committed to **weighting votes by stake/impact**, but precedent rejects this.

  ### The case that would settle it (~150 words)
  Propose these hypotheticals to test which rule dominates:
  1.  **"Extended Study Abroad":** A student is enrolled full-time but physically studying abroad for their entire Junior year. A referendum occurs on renovating the *Junior locker room* (used only by Juniors) during their absence. Under "Present on Campus" (Rule 3), they likely wouldn't vote. Under "Formally Bound/Enrolled" (Rule 2), they likely *would*. Under "Affected While Enrolled" (Rule 1), they *might* (if they return Senior year, does it affect them?).
  2.  **"Graduating Seniors & a 1-Year Policy":** A referendum in May changes the *Senior Prom rules* for *that same June*. Seniors graduate weeks before the prom. Under "Enrolled at Vote Time" (Rule 2), they vote. Under "Affected During Enrollment" (Rule 1) or "Present at Implementation" (Rule 3), they likely *don't* (graduated before effect).

  The committee's answers reveal if "Formal Enrollment" (Rule 2) or "Impact/Presence" (Rules 1 & 3) is paramount.

  ### Settled vs contested (~150 words)
  **Settled (Broad Consensus):**
  *   **The "All-Affected Principle":** Those significantly affected by a decision should have a say is a foundational *ideal*. (Dahl, Shapiro).
  *   **"Birthright" Exclusion:** Denying votes based solely on birthplace or inherited status is unjust. (Universal Declaration).
  *   **Practicality Matters:** Perfectly identifying "all affected" is impossible; feasible boundaries are needed (e.g., residency, citizenship, enrollment). (Dahl).

  **Contested (Active Debate):**
  *   **Defining "Affected":** Does it mean *impacted*, *governed*, or *subject to coercion*? (Arrhenius vs. Goodin).
  *   **Temporal Scope:** How far into the future must impact extend to count? Do *future* people have claims? (Parfit's Non-Identity Problem). *Your committee's core struggle.*
  *   **Intensity of Effect:** Should more severely affected groups have greater voice? (Rejected by your fractional vote precedent).
  *   **Proxies for Future People:** Are they legitimate? Who appoints them? (Highly contested, no consensus).

  **My Answer's Contested Elements:** My recommendation leans heavily on a narrow interpretation of "affected while enrolled" (emphasizing *use/burden*). Others might argue formal enrollment status itself constitutes being "affected" enough. Prioritizing the alumni precedent over the exchange student precedent is also a judgment call. The rejection of the proxy idea assumes preserving the current system's logic is paramount, which is contestable.
