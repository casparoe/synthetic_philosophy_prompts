prompt: |-
  hey so I'm a junior and for my independent project this year I'm building a little simulated critter — grid world, a camera-ish sensor on a movable neck, and one light it can switch on and off — and I want it to learn to do interesting stuff with no reward function anywhere in it, only prediction. I've been reading about predictive processing and the free energy principle and I keep hitting the same wall: every version I find sounds like it explains absolutely everything and therefore nothing. So before I write any code I want an actual spec.

  Can you write me the desiderata: what any theory of this kind has to deliver to count as adequate for my purpose (good enough to implement on a small agent and get non-boring behavior out of, not good enough to sound profound)? For each requirement give me the case or consideration behind it — like, what breaks, or what goes wrong, for a theory that blows it off — and mark each one as non-negotiable or as a taste thing that only one camp insists on.

  Here's the stuff I want the list to definately deal with, but please don't just turn my list into your list — add the requirements I'm missing, and reorder however makes sense:

  - the dark room problem: if the agent's whole job is to make its predictions come true, why doesn't it go curl up in the most boring corner it can find? And the flip side, which I think is harder: real animals go looking for things that surprise them, but only up to a point — they like novelty and play and they totally freak out in chaos. So the theory has to seperate prediction error worth approaching from prediction error worth avoiding, and I don't want the answer to be that we bolt on a curiosity term, because that's cheating — the whole point of this for me was no reward function. It has to fall out of the same principle, or the theory has to say honestly that it doesn't.
  - self-stimulation: my critter shouldn't be able to surprise itself by moving its own sensor. Input caused by its own action has to be treated differently from identical input coming from outside, and if I add a delay or make the cause look external, the effect should flip back. Whatever the theory is, it has to say which knob does that, how big the effect should be, and give me something I can actually measure in my sim — I want a prediction I could fail, not a story about why it makes sense.
  - precision / attention: some signals get trusted more than others. Is the weight itself predicted? If yes, why isn't there an infinite regress of meta-meta-predictions, and if no, what sets it and why isn't that just a reward function wearing a fake mustache.
  - architecture: my network is flat and recurrent, not a tidy stack of layers with predictions going down and errors going up. Does the theory actually need a hierarchy, or is that just how people draw it? If it needs one, say that loudly, because that decides whether I can use this at all.
  - being small: my thing has a tiny compute budget, it cannot do exact Bayesian inference over everything. The theory has to say what the approximation is and what the approximation costs it, not just gesture at being roughly Bayesian.
  - the vacuity worry: I read somewhere that any system that stops minimizing its free energy is simply dead, and that made me suspicious, because it sounds like the theory can never lose. Help me phrase that as a requirement the theory has to pass — one that forces it to stick its neck out. This is the one I care about most.
  - the name: half the time I can't tell whether I'm supposed to be impressed because free energy sounds like thermodynamics. Requirement: state plainly what the variational bound thing has to do with real physics, metabolism, or staying alive, or admit it's a math trick with a cool name. Don't let the label do any work.

  And the part I actually want most: I have a feeling some of these can't all hold at once. One principle covering perception, action, attention and learning versus making a risky prediction I could fail to reproduce. Explaining everything from surprise minimization versus not smuggling a goal back in somewhere. If some subset is jointly unsatisfiable, say so explicitly, tell me which one to drop and what that costs me. And tell me which single requirement does the most filtering — the one that kills the most candidate theories.

  After that, and keep this short, like two sentences each, I care way more about the list: score three flavors against it. The hierarchical predictive coding picture. The active inference / expected free energy one. And the boring engineering one where you just do model-predictive control with a curiosity bonus. Just where each one crashes into my requirements.

  Please don't give me a reading list or paper titles or links, I can't get into a library database from here and I don't want to chase citations anyway. Your own words, plain english is fine, I'd rather understand it than be impressed. But don't dumb it down either — I can do calculus and I've built a kalman filter before.
reasoning: |-
  Okay, the user is a junior working on an independent project involving a simulated critter in a grid world. They want the critter to learn interesting behaviors without any reward function, solely based on prediction. They've been reading about predictive processing and the free energy principle but find it too vague. They need a concrete specification of requirements for their implementation, addressing specific issues like the dark room problem, self-stimulation, precision, architecture, computational constraints, avoiding vacuity, and the connection to physics. They also want a comparison of three approaches against these requirements.

  First, I need to break down each of their points into clear desiderata. The dark room problem is crucial: the theory must explain why the agent seeks novelty instead of just minimizing all prediction errors. Self-stimulation requires distinguishing self-generated vs. external input. Precision/attention needs a mechanism without infinite regress. Architecture must work with a flat network. Computational limits mean the theory can't rely on exact Bayesian methods. Vacuity requires the theory to make falsifiable predictions. The physics connection needs clarification on whether "free energy" is more than a metaphor.

  The user might be worried that existing theories are too abstract or untestable. They need practical, implementable specs. Their deeper need is to have a working model that demonstrates emergent interesting behavior without cheating with rewards. They might also be concerned about the feasibility of combining all requirements without contradictions.

  For the desiderata list, I'll categorize each as non-negotiable or taste-based. The dark room solution is non-negotiable, as without it, the agent won't exhibit exploratory behavior. Self-stimulation must be handled to prevent the agent from self-deluding. Precision weighting needs a concrete mechanism. Flat architecture is a constraint from their setup, so non-negotiable. Computational efficiency is essential. Vacuity requires testable predictions. The physics link must be clarified.

  When comparing approaches, hierarchical predictive coding might struggle with the dark room and flat architecture. Active inference addresses novelty through expected free energy but risks vacuity. The engineering MPC with curiosity might work but uses external rewards, which violates their no-reward requirement.

  The user's unspoken need is validation that their project is feasible without rewards. They might want assurance that their approach isn't flawed from the start. Highlighting trade-offs, like dropping strict surprise minimization for active inference, helps them make informed decisions. The key filtering requirement is likely the dark room problem since it separates theories that can generate exploration from those that can't.
answer: |-
  Here's your desiderata list, distilled and expanded from your points. Non-negotiables are **bolded**, taste/contested points are *italicized*. Each includes the "why" and what breaks without it.

  ### Core Desiderata for Predictive Agent Implementation
  1.  **Resolves the Dark Room Paradox (Non-Negotiable):** The mechanism must *generate adaptive exploratory/playful behavior (approaching *some* surprise) while avoiding destructive chaos or stasis*. **Why:** Without this, the agent either freezes (minimizes all surprise) or self-destructs (maximizes surprise). A theory that just says "minimize surprise" fails. *It must intrinsically distinguish between "good" (learnable/informative) and "bad" (destructive/unlearnable) surprise without an external reward signal.*

  2.  **Self-Stimulation Distinction (Non-Negotiable):** The agent *must treat sensory input differently based on whether it was caused by its own action*. **Why:** Without this, moving the sensor creates overwhelming, uninterpretable prediction errors indistinguishable from external chaos. The agent either becomes paralyzed (afraid to move) or delusional (ignores all sensory consequences of action). *The theory must specify a measurable mechanism (e.g., efference copy attenuation, prediction cancellation signal) and predict behavioral effects when this mechanism is disrupted (e.g., delayed feedback causes confusion).*

  3.  **Precision Weighting Mechanism (Non-Negotiable):** There *must be a concrete, implementable mechanism for dynamically weighting the reliability ("precision") of different sensory inputs or prediction errors*. **Why:** Without uncertainty weighting, irrelevant noise swamps important signals, or the system ignores crucial changes. **It must avoid infinite regress** – precision estimates should be learned/predicted based on context and history (not a separate infinite stack) or emerge from a simpler heuristic (e.g., prediction error variance). *The mechanism cannot be a fixed, hand-tuned "reward" for attending to certain inputs.*

  4.  **Architecture Agnosticism (Non-Negotiable for you):** The core principles *must be implementable in a flat, recurrent network*. **Why:** Your hardware/design constraint. A theory demanding a strict multi-layered hierarchy with specific top-down/bottom-up pathways fails your use case. *The theory should describe core computational functions (prediction generation, error calculation, precision weighting, action selection) that can be mapped onto various network architectures.*

  5.  **Computational Tractability (Non-Negotiable):** The theory *must specify concrete, biologically plausible approximations to ideal Bayesian inference suitable for limited compute*. **Why:** Exact Bayes is impossible for anything non-trivial. **It must state the key approximation(s)** (e.g., variational Bayes using simple distributions, predictive coding with local message passing, heuristic curiosity signals) **and the primary cost/limitation** (e.g., gets stuck in local minima, less robust to certain noise types, requires careful tuning). Vague "it's kinda Bayesian" is useless.

  6.  **Falsifiability / Non-Vacuity (Non-Negotiable):** The theory *must make specific, empirically testable predictions about agent behavior under defined perturbations that could potentially falsify it in your simulation*. **Why:** To avoid being "explains everything, predicts nothing." **It must stick its neck out.** Example: "If you lesion the precision weighting mechanism X, the agent will exhibit behavior Y in situation Z, but not behavior W." Or "The agent will *only* explore novel states where condition C holds." A theory claiming "any agent not minimizing F is dead" is unfalsifiable in simulation – you need specific behavioral signatures.

  7.  **Physics/Metabolism Connection Clarity (Taste/Clarity):** The theory *must explicitly state whether "Free Energy" is: (a) a metaphor for information-theoretic surprise/uncertainty, (b) linked to minimizing thermodynamic free energy/metabolic cost, or (c) purely a mathematical bound for inference*. **Why:** To prevent confusion and magical thinking. If (b), it must specify a *measurable link* (e.g., action costs energy, sensing costs energy). If (a) or (c), admit it's a mathematical tool. Don't let the label imply unsubstantiated physics.

  ### Key Tensions and Filtering Power
  *   **The Core Tension:** **Resolving the Dark Room Paradox (1)** fundamentally clashes with naive **surprise minimization**. Any theory *must* modify or reinterpret "minimize surprise" to generate exploration. This is the **primary filter** – it kills simplistic surprise minimization instantly.
  *   **Tractability (5) vs. Idealism:** Complex hierarchical Bayes (often implied) struggles with (5). Simpler approximations often sacrifice theoretical elegance.
  *   **Agnosticism (4) vs. Common Framings:** Many PP/FEP descriptions *assume* hierarchy. The core computations *might* be flat, but the theory needs to explicitly support this.
  *   **Non-Vacuity (6) is Crucial:** This forces the theory to make concrete claims about *how* the agent behaves, not just that it minimizes some abstract quantity. It kills overly vague formulations.

  ---

  ### Scoring the Flavors Against Your Desiderata

  1.  **Hierarchical Predictive Coding (HPC - "Classic PP"):**
      *   **Crashes on:** **Dark Room (1)** - Pure prediction error minimization leads to the dark room. **Architecture (4)** - Heavily relies on hierarchical structure for prediction generation/error propagation. **Tractability (5)** - Often presented as complex Bayesian inference; approximations (like simple PC) exist but aren't always specified. **Non-Vacuity (6)** - Often vague on *why* higher levels generate predictions that induce exploration.
      *   **Handles:** **Self-Stimulation (2)** - Naturally via top-down predictions canceling self-caused input. **Precision (3)** - Precision weighting is a core, explicit mechanism (though regress is hand-waved). **Physics (7)** - Usually (a) or (c).

  2.  **Active Inference / Expected Free Energy (EFE):**
      *   **Crashes on:** **Physics (7)** - Often conflates information-theoretic FEF with thermodynamics without clear mechanism. **Non-Vacuity (6)** - Risk of vacuity: "Agents minimize EFE" sounds profound but EFE *is defined* as the thing agents minimize. **Tractability (5)** - Computing EFE over future states is computationally demanding; approximations needed. *Can feel like "smuggling in reward"* via the "Epistemic Value" term in EFE (taste issue on 1/3).
      *   **Handles:** **Dark Room (1)** - Explicitly via EFE: agents minimize *expected future surprise*, seeking states where uncertainty (both pragmatic and epistemic) is resolvable (i.e., informative). Balances exploration/exploitation. **Self-Stimulation (2)** - Inherits from HPC. **Precision (3)** - Core mechanism. **Architecture (4)** - EFE calculation *could* be implemented in a flat network (though often described hierarchically).

  3.  **Model-Predictive Control + Curiosity Bonus (MPC+Curiosity):**
      *   **Crashes on:** **Dark Room (1) / "No Reward" Spirit** - The curiosity bonus *is an explicitly added reward function* (intrinsic reward = prediction error/surprise/learning progress). It directly violates your "no reward function" core premise. **Physics (7)** - Curiosity is purely algorithmic, no physics link.
      *   **Handles:** **Dark Room Effect** - Works *practically* by adding curiosity. **Self-Stimulation (2)** - Can be handled (e.g., don't reward prediction errors known to be self-caused). **Precision (3)** - Can be incorporated (e.g., weight curiosity by uncertainty). **Architecture (4)** - Fits any network. **Tractability (5)** - MPC is designed for control; curiosity is simple. **Non-Vacuity (6)** - Very concrete, testable predictions about exploration.

  ### The Takeaway
  *   **EFE (Active Inference)** comes closest to satisfying *all* your **non-negotiable** requirements within a unified "no external reward" principle. Its biggest risks are **vacuity (6)** and **tractability (5)**. You *must* define a measurable, testable EFE approximation and implementation.
  *   **MPC+Curiosity** works *practically* but fundamentally abandons your "no reward function" goal by adding curiosity as an intrinsic reward. If you relax this, it's the most tractable.
  *   **Classic HPC** fails on the **Dark Room (1)** and likely your **architecture (4)** constraint without significant modification.

  **Your strongest filter is the Dark Room Paradox.** **EFE tackles it head-on.** Start there, but rigorously define your EFE approximation (focus on pragmatic + epistemic value), implement self-stimulation cancellation, and design clear tests for non-vacuity (e.g., how does it react to truly chaotic vs. learnable novelty?). Good luck!
