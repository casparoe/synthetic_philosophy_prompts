prompt: |-
  I'm in the second year of a PhD in comparative politics, writing a chapter on how outside observers decide whether a country has stopped being a democracy, and I keep losing the same argument with my supervisor because I don't have a word for the thing I am gesturing at. The argument runs like this: take almost any single measure that gets counted as backsliding somewhere in Hungary, Poland, Turkey, or the United States — expanding the bench of a court that has been ruling against you, moving the retirement age for judges, redrawing district lines, tightening who may observe a count, requiring organisations that take money from abroad to register — and you can nearly always find a democracy nobody doubts that has something close to the same rule on its books. So what, she asks, is the object of the judgement? Not the rule, since the rule has respectable company. Not the whole institutional package either, since nobody ever votes on a package and she doubts anyone could rank two countries' entire constitutional setups against each other. What is left is whether the observer likes the direction of travel, which is her way of saying the concept is a partisan label with a methodology stapled to it.

  What I want a name for is the move that produces this, because I don't think it is any of the things it looks like. The defender is not pointing at the critic's own misdeeds, so it isn't whataboutism or tu quoque. The defender usually isn't denying that the step is small and reversible, and the salami-slicing or slippery-slope worry is the critic's accusation, not the defence. And the defender is often right on the narrow point: the borrowed sentence really is close to the sentence in the respected democracy's statute book. The problem is that what a rule like this actually does depends on what surrounds it — who appoints the replacements, whether there is a second chamber or a supermajority that would have to agree before the rest of the package could pass, whether the change is a one-off or repeatable at will, whether the courts that would review it are the same courts being repopulated. Those surrounding facts are exactly what is in dispute, so the comparison quietly helps itself to a ceteris-paribus clause it isn't entitled to. My own candidate name is rule laundering, by analogy with laundering a provenance, and my candidate test is a swap test: imagine transplanting the lender's whole surrounding arrangement along with the sentence, and ask whether the borrower would then behave like the lender. But I can see two ways this collapses: either the test is unfalsifiable because a defender can always say the context differs, or it is circular because we only notice the difference in context once we have already decided the country is sliding.

  So: does this configuration have an established name in the comparative-institutions or democratisation literature, or a name borrowed from somewhere else — I have a vague sense that lawyers dealing with antitrust conduct, conspiracy, or cumulative environmental harm have had to work out how to judge a course of conduct rather than a single act, and I would like to know whether that machinery transfers? If there is no settled term, please coin and define one, and do more than hand me a label: I want to know what the phenomenon is not as well as what it is, how it differs from whataboutism, from ordinary salami tactics, and from a good-faith comparative argument that a borrowed rule really is innocent here, and what its boundary cases are. I also want to know what you make of my supervisor's deeper point: if the honest object of judgement is a trajectory rather than a rule or a package, what kind of thing is a trajectory, who gets to say which one a country is on, and does answering that either rescue the concept of backsliding or show that it really is just a partisan label? Please argue in concepts rather than sources — I am writing this from a field site with no library access, so a reading list would be useless to me even if you could produce one.
reasoning: |-
  Okay, let me unpack this. The user is a second-year PhD student in comparative politics wrestling with a core conceptual problem in their chapter on democratic backsliding. Their supervisor keeps challenging them to name the "thing" they're describing: the rhetorical move where defenders of controversial institutional changes point to similar rules in stable democracies, bypassing context. 

  Hmm, this is fascinating. The user isn't just asking for a term—they're exposing a fundamental methodological tension in assessing democracy. Their supervisor's critique cuts deep: if backsliding judgments boil down to "direction of travel," doesn't that make it inherently subjective? Yet the user intuitively knows context matters crucially.

  First, let's diagnose the move they're describing. It's not whataboutism (no counter-accusation), not pure salami tactics (defenders admit reversibility). Their "rule laundering" analogy is clever but problematic—laundering implies bad faith, while defenders might genuinely believe the comparison. 

  I recall similar issues in other fields. Antitrust law's "course of conduct" doctrine assesses patterns rather than single acts. Environmental law's "cumulative impact" concept might help—but does it capture the institutional interdependence? Maybe "context stripping" fits better: surgically isolating a rule from its ecosystem. 

  The trajectory question is thornier. A trajectory isn't just a sequence; it's institutional path dependence interacting with actor intent. We judge it through pattern recognition: repeated institutional repurposing, escalating norm breaches, shrinking corrective mechanisms. But their supervisor is right—this requires interpretive frameworks. The saving grace might be that serious methodologies (like V-Dem's expert surveys) systematize these judgments across cases, creating intersubjective benchmarks. 

  For boundary cases: when would this move be valid? Perhaps if the borrowing country has stronger veto points than the lender—but that's rare in backsliding contexts. More often, it's deceptive because backsliding specifically dismantles those safeguards first. 

  The user needs two things: 1) a precise label for the rhetorical tactic, and 2) conceptual tools to defend trajectory-based assessment. For the first, "context-stripped comparison" feels most neutral. For the second, emphasizing "corrective resilience" as the true differentiator: can institutions still self-correct after this change? That's objectively measurable through veto players analysis. 

  ...Wait, their library access is limited. Must avoid citation-heavy answers. Focus on conceptual scaffolding: how to frame trajectory as the hardening of institutional power asymmetries. That's less partisan than "direction"—it's about whether checks actually constrain anymore.
answer: |-
  This is a razor-sharp problem that cuts to the heart of democratic assessment. Let's dissect it conceptually:

  ### 1. **The Naming Problem: "Institutional Ventriloquism"**
     - **Core Definition**: The act of justifying a contested institutional change (Rule X) by citing its superficial similarity to a rule in an established democracy (Country A), while deliberately ignoring or minimizing how **interdependencies** with surrounding institutions (in Country B) transform Rule X's function and impact.
     - **Why "Ventriloquism"**: The defender "speaks through" Country A's legitimacy, making Country B's rule *appear* benign by borrowing Country A's voice, while the actual effects are dictated by Country B's institutional ecosystem.
     - **Boundaries**:
       - **Not Whataboutism**: No counter-accusation ("But your democracy does worse!"). It's a positive analogy ("This is normal!").
       - **Not Salami Tactics**: The defender isn't denying incrementalism; they're asserting *this slice* is harmless based on external precedent.
       - **Not Good-Faith Comparison**: A valid comparison would analyze functional equivalence *including* institutional context (e.g., "This court-packing exists in Germany, but Germany also has robust constitutional review and federal safeguards absent here").

  ### 2. **The Phenomenon: Contextual Disembedding**
     - **What It Is**: Selectively isolating a rule from its **institutional ecology**—the network of veto points, counter-majoritarian safeguards, historical precedents, and partisan constraints that determine its real-world effect.
     - **What It Is Not**:
       - Mere hypocrisy (the rule may be sincerely borrowed).
       - Ignorance (defenders often know context matters but strategically omit it).
       - Legal formalism (it acknowledges rules have effects, but misattributes them).
     - **Key Mechanism**: It exploits **modularity illusion**—the false assumption that rules are interchangeable components, not elements of an interdependent system. (E.g., A presidential veto in a system with weak legislature vs. strong legislature).

  ### 3. **Testing the Move: The "Viability of Constraints" Test**
     - Your "swap test" is insightful but needs refinement. Instead of imagining impossible transplants, ask: **"Would the *same political actors* proposing Rule X in Country B be constrained by it if they held power in Country A?"**
       - *Example*: Would Fidesz's court-packing plan be neutered by Germany's constitutional court structure, federalism, and entrenched procedural norms? If yes, the comparison fails.
     - **Why This Works**:
       - Focuses on **actor incentives and constraints**, not abstract rules.
       - Exposes whether the rule is *designed to be circumvented* in its new context.
       - Avoids unfalsifiability: Evidence comes from analyzing *existing* constraints in both systems that actors exploit or evade.

  ### 4. **Trajectory as the True Object: "Path-Dependent Institutional Repurposing"**
     - Your supervisor is half-right: Judgment *is* about direction. But it's not arbitrary; it's about **cumulative institutional repurposing**:
       - **What Makes a Trajectory**:
         1. **Sequencing**: Changes that disable future constraints first (e.g., capture judiciary *before* altering election rules).
         2. **Asymmetry**: Reforms that expand incumbent power while reducing opposition recourse (e.g., gerrymandering + restricting judicial review).
         3. **Irreversibility Engineered**: Rules designed to prevent future unwinding (e.g., supermajorities for reversal, partisan entrenchment).
       - **Judging Trajectories Objectively**:
         - **Pattern Recognition**: Does change follow known autocratization playbooks (e.g., dismantling oversight → capturing referees → tilting rules)?
         - **Constraint Degradation**: Measurable decline in institutional veto points (e.g., EIU's "checks on executive" metric).
         - **Intent & Consistency**: Do actors openly reject liberal democratic norms? Are changes consistently partisan-advantage-seeking?
     - **Rescuing Backsliding from Subjectivity**:
       - Backsliding isn't *just* "direction" – it's **the systematic conversion of democratic institutions into vehicles for permanent majority entrenchment**. This is observable via:
         - **Diminishing Corrective Feedback**: Can elections still produce alternation of power? Can courts still check overreach?
         - **Increasing Returns to Power**: Does each reform make future power grabs easier?
       - **Partisanship vs. Pattern**: Partisan *motivation* may exist, but the **effect** (erosion of competitive pluralism) is institutionally verifiable. A conservative democracy passing unpopular policies isn't backsliding; one altering rules to lock opponents out *is*.

  ### 5. **Boundary Cases & Caveats**
     - **False Positives**: Reforms in fragile democracies strengthening state capacity (e.g., centralized voting systems to combat fraud) may *look* like power grabs but serve democratic stability.
     - **False Negatives**: "Constitutional hardball" in healthy democracies (e.g., US filibuster use) becomes backsliding only if it escalates into constraint demolition.
     - **The Democratic Innovation Trap**: Some backsliding disguises itself as modernization (e.g., "digital efficiency" masking surveillance). Test: Does it increase citizen autonomy or state control?

  ### Why This Matters for Your Thesis
  - **Conceptual Payoff**: "Institutional Ventriloquism" exposes how backsliding exploits the **methodological individualism** of rule-by-rule assessment. Democracy dies cumulatively, not clause-by-clause.
  - **Answering Your Supervisor**: The trajectory *is* the object—but it's not a partisan mood; it's an **engineered path dependency** where institutions lose their ability to constrain incumbents. This is falsifiable by mapping sequences of reforms against indicators of competitive viability.
  - **Original Contribution**: Your framework makes explicit what comparativists intuit—that **democratic quality resides in the dynamic interplay of rules, not their static form**. This moves beyond checklist democratization.

  **In short**: The move is **Institutional Ventriloquism**. The antidote is analyzing **Constraint Viability**. The trajectory is **Path-Dependent Repurposing**. Backsliding is saved as a concept by defining it as **the engineered reduction of institutional reversibility**. Your challenge is to operationalize "viability" and "repurposing"—but the core insight is profound.
