  ### Session Design: Framing the Allais Paradox

  #### **Materials & Setup**
  - **Budget Allocation**: £20
    - **Colored Cards**: Two colors (e.g., blue and yellow), 30 cards each (60 total, £5).
    - **Prizes**: Desirable non-cash rewards (total £15):
      - **High-value**: Premium chocolate box (£8).
      - **Medium-value**: Standard chocolate bar (£5 for 5 bars, one used as prize).
      - **Low-value**: Small candy pack (£2 for 20 pieces, one used as prize).
    - **Other**: Paper slips, pens, two collection boxes, whiteboard/markers.
  - **Room Setup**: Arrange chairs for group visibility. Display prizes prominently. Place collection boxes at the front. Prepare a whiteboard table for Round 2.

  #### **Timeline (50 Minutes)**
  **0:00–0:05: Introduction (5 min)**  
  - **Script**: "Today, we’ll explore how we make decisions under uncertainty. You’ll face two similar choices in two rounds. At the end, I’ll randomly select one student and one of their choices to play for real with these prizes." *[Gesture to prizes]* "Choices are anonymous—write decisions on slips. No right/wrong answers; we’re studying patterns."  
  - **Rules**:  
    - Each round has two decisions (Pair 1 and Pair 2).  
    - In Round 1, options use simple probabilities; Round 2 refines the same probabilities into sub-events.  
    - Slips collected after each round.  

  **0:05–0:15: Round 1 – Standard Framing (10 min)**  
  - **Instructions**: "For **Pair 1**, choose:  
    - **Option A**: Guaranteed medium prize (chocolate bar).  
    - **Option B**:  
      - 10% chance of high prize (chocolate box),  
      - 89% chance of medium prize (same as A),  
      - 1% chance of low prize (small candy).  
    For **Pair 2**, choose:  
    - **Option A**: 11% chance of medium prize, 89% chance of low prize.  
    - **Option B**: 10% chance of high prize, 90% chance of low prize."  
  - **Process**: Hand out slips. Students circle A or B for each pair. Collect slips in Box 1.  

  **0:15–0:25: Round 2 – Split Framing (10 min)**  
  - **Setup**: Draw this table on the whiteboard:  
    | Event       | Probability | Pair 1: Option A | Pair 1: Option B | Pair 2: Option A | Pair 2: Option B |  
    |-------------|-------------|-------------------|-------------------|-------------------|-------------------|  
    | **Event 1** | 1%          | Medium            | Low               | Medium            | Low               |  
    | **Event 2** | 10%         | Medium            | High              | Medium            | High              |  
    | **Event 3** | 45% (Blue)  | Medium            | Medium            | Low               | Low               |  
    | **Event 4** | 44% (Yellow)| Medium            | Medium            | Low               | Low               |  
    *Hold up blue/yellow cards:* "Events 3 and 4 are separate sub-events, totaling 89%."  
  - **Instructions**: "Same prizes as Round 1. For **Pair 1**, choose Option A (guaranteed medium) or B (depends on events). For **Pair 2**, choose Option A (medium in Events 1–2) or B (high only in Event 2)."  
  - **Process**: Hand out slips. Collect in Box 2.  

  **0:25–0:35: Tabulate Results (10 min)**  
  - Tally Round 1 and Round 2 choices on the whiteboard:  
    | Choice Pattern  | Round 1 Count | Round 2 Count |  
    |------------------|---------------|---------------|  
    | A1 + B2 (Allais)| [Count]       | [Count]       |  
    | Consistent (EU) | [Count]       | [Count]       |  
    | Other           | [Count]       | [Count]       |  
  - **Note**: "A1 + B2" = Choosing safe (A) in Pair 1 and risky (B) in Pair 2. "Consistent" = A1+A2 or B1+B2.  

  **0:35–0:45: Debrief – Concepts & Diagnoses (10 min)**  
  - **Independence Axiom**: "Expected utility requires *independence*: If you prefer A over B, adding the same 'common consequence' (e.g., 89% medium in Pair 1/low in Pair 2) shouldn’t change your preference. But many of you chose A1 (safe) + B2 (risky). Why?"  
  - **Why Pairs Stand/Fall Together**: "Pair 1 and Pair 2 are identical in Events 1 and 2. *Only* the common consequence (Events 3–4) changes. Independence says your choice should depend *only* on Events 1–2—so if you prefer A in Pair 1, you should in Pair 2."  
  - **Three Diagnoses**:  
    1. **Rejecting Independence Normatively**: "You believe avoiding regret (e.g., losing in B1 when A1 was safe) is rational, even if it violates EU."  
       - *Evidence from Round 2*: If splits *reduce* A1+B2, it weakens this; if *no change*, it’s supported.  
    2. **Coarse Outcomes**: "You care about emotions (e.g., disappointment). In Pair 1, B1 risks losing the safe prize; in Pair 2, no safe option exists. EU might work if outcomes include feelings."  
       - *Evidence from Round 2*: Splits *don’t* enrich outcomes (still same prizes), so if choices shift, this is *less* likely.  
    3. **Framing Artefact**: "Your preference isn’t stable—it’s swayed by how options are described. Splits make the common consequence salient, prompting consistent choices."  
       - *Evidence from Round 2*: If splits *increase* consistent choices, this is supported.  

  **0:45–0:50: Conclusion & Caveats (5 min)**  
  - **Key Insight**: "Framing—not just probabilities/prizes—shapes decisions. EU assumes preferences are immune to this."  
  - **Predictable Challenges**:  
    - **Small Sample**: With 24 students, shifts may be noisy. If no effect, say: "Data often shows shifts in larger samples—let’s discuss why."  
    - **Hypothetical Bias**: Prizes help but aren’t cash. If choices seem random, note: "Incentives reduce noise but can’t eliminate it."  
    - **Time Crunch**: Tabulation may run over; skip "Other" patterns if needed.  
  - **What the Activity Can’t Deliver**:  
    - "You must *assert* the representation theorem: EU *requires* independence to rank *all* lotteries with one utility function. Without it, no EU—but other models exist (e.g., prospect theory)."  

  ---

  ### **Why This Works**  
  - **Engagement**: Physical cards and prizes make framing tangible. Anonymity encourages honest choices.  
  - **Pedagogical Clarity**: Round 1 induces Allais paradox; Round 2 tests robustness. Table visualizes the split.  
  - **Diagnostic Power**: Shift (or not) in Round 2 informs debates (e.g., if splits reduce A1+B2, framing matters more than normative rejection).  
  - **Flexibility**: If no shift occurs, discuss why (e.g., "Did splits make common consequences clearer?").  

  **Final Tip**: Pre-tabulate a "expected" result (e.g., 60% A1+B2 in Round 1, 40% in Round 2) to contextualize real data.
