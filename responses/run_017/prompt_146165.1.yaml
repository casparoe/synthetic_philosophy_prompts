  B1 = 0.89 * C + 0.11 * [ (10/11) * (5M) + (1/11) * (0) ]

  Then for Pair 2, we have:

  A2 = 0.11 * [1M] + 0.89 * [0]
     = 0.11 * C + 0.89 * [0]

  B2 = 0.11 * [ (10/11)*(5M) + (1/11)*0 ] + 0.89 * [0]

  So by the independence axiom, if you prefer A1 (which is C) to B1 (which is 0.89*C + 0.11*[lottery D]), then you should prefer A2 (0.11*C + 0.89*[0]) to B2 (0.11*[lottery D] + 0.89*[0]).

  But many people choose A1 and B2, violating independence.

  2. The two pairs stand or fall together by expected utility theory. If you violate by choosing A1 and B2, then you are not maximizing expected utility.

  3. In the second round, by splitting the common consequence (the 89% part) into two separately labeled events, we made it more obvious that in Pair 1, the common consequence (events 3 and 4) yield the same prize in both options (medium), and in Pair 2, they yield the same prize (low) in both options. So if you focus on the differences, you see that the only difference between A1 and B1 is in events 1 and 2, and similarly for A2 and B2. Therefore, the choice in Pair 1 and Pair 2 should be the same: if in events 1 and 2 you prefer the payoffs of A1 (which are 1M in event 1 and 1M in event 2) over the payoffs of B1 (0 in event 1, 5M in event 2), then you should choose A1 and also A2. If you prefer the payoffs of B1 in events 1 and 2, then you should choose B1 and B2.

  4. Diagnoses:
     a) Genuine rejection of independence: the student might think that the presence of the common consequence in Pair 1 makes the safe option more attractive, while in Pair 2, the absence of any safety net makes them want to go for the chance of a big win. This is a violation of independence and expected utility.
     b) Outcome space is coarse: the student might care about things like disappointment. In Pair 1, choosing B1 and then getting 0 would be very disappointing because you passed up 1M for sure. In Pair 2, there is no safe option, so the disappointment of getting 0 in B2 is not as stark. If we include these emotions in the outcome description, then EU might be preserved by redefining outcomes to include emotional states. The second round might make this less salient because the common consequence is split, so the emotional impact might be less? Or more? It's not clear.
     c) Artefact of framing: the choices are not based on stable preferences but on how the problem is framed. The second round might shift the frame and make the common consequence more salient, leading to more consistent choices. If we see a shift toward consistency in Round 2, that supports this.

  The second round is evidence against (a) if we see a shift toward consistency, because it suggests that the preference reversal was due to framing and not a deep rejection of independence. But if the students still choose inconsistently even in the split version, that might support (a) or (b). The second round does not directly distinguish between (b) and (c). 

  To address (b), we might ask: does splitting the common consequence change the emotional experience? If the common consequence is split, the disappointment of getting the low prize in the common consequence events might be the same as before? So it doesn't change the outcome description. Therefore, if the shift occurs, it might be due to (c). But if there is no shift, it could be (a) or (b).

  Predictable problems:

  - With 24 students, the effect might not be statistically significant. We might not see a clear shift.
  - The prizes are not monetary, so the intensity of preference might be low -> students might not take it seriously.
  - Time: the session might run over 50 minutes, especially if we do the tabulation.
