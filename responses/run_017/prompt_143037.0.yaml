prompt: |-
  I am a graduate TA in a first-year survey of modern moral philosophy, and I have one fifty-minute section in which to do justice to Adam Smith's machinery of sympathy and of the impartial spectator. The students will have read Part I of The Theory of Moral Sentiments (the material on sympathy, on the concord of sentiments, and on the degrees of passion that spectators can go along with) and the opening of Part III, where the spectator turns inward; they will not have read Part II on merit and demerit, nor Part V on custom and fashion. They have read no Kant. Their only prior contact with Smith is the invisible hand and the claim that we get our dinner from the self-interest of the butcher and the brewer. I have the theory reasonably well in hand, so please do not explain Smith to me: what I want is a plan for teaching him, and I want it in 600 words or fewer — a tight spine with reasons attached is worth more to me than a full lesson script.

  What I am after is the dependency structure: what must be in place before what, and why. My provisional spine is to present sympathy first as a mechanism rather than a virtue — the claim that I come to feel with you by imagining myself into your situation, not by catching an emotion from you — then to generate propriety out of the mismatch cases, the passions a spectator cannot enter into, rather than out of any rule, and only then to move the spectator inside the agent and treat conscience as the verdict of that inner tribunal. Two placement questions I cannot settle alone. First: where should the spectator's two verdicts be split apart — whether the passion is proportionate to its cause, versus whether the passion is owed to the person it is aimed at, the propriety side and the merit side, the second of which is not in their reading? Second: where in the hour should I make the move from what the people around me actually approve to what an impartial spectator would approve, given that the students will supply that move on their own and get it wrong?

  I have been turning over two further things. One is a pair of readings of the inner spectator that I want adjudicated as a teaching decision: the surrogate reading, on which he is simply my representation of the people who actually watch me and whose approval I need, and the fixed-point reading, on which he is the standpoint you arrive at by repeatedly correcting for the partiality, ignorance and interestedness of actual spectators. The second reading seems to me to be what makes the account moral rather than sociological, but I suspect that opening with it will make the students think I have smuggled in a universal rational agent from somewhere else. Should one of them anchor the session and the other be demoted, and if so which, and where does the demoted one belong? The other is the calibration worry: if the inner spectator is assembled out of internalised actual spectators, and those spectators are as partial as I am, then what does the correction push off from? I can either spring this at the end as my diagnostic, or defuse it in passing, and I cannot tell which does less damage.

  I also need one example to carry the whole fifty minutes, and I would like you to say what it must contain and what it must not. It has to let the students feel the difference between failing to enter into someone's passion and judging that their passion is aimed at the wrong person, and it has to leave room for the thought that the bystanders' actual reaction is not itself the verdict. I assume it should not involve death or bereavement, since that will make them hear sympathy as pity and miss that Smith's mechanism ranges over any passion whatever; I assume too that its outcome must not be settled by a rule they already accept. What other properties must it have, and what must it avoid?

  The misconceptions I expect, roughly in the order in which I expect them, are these: sympathy as compassion or as altruism; the inner spectator as conscience internalised from social approval, the reading that quietly turns the whole account into sociology; "impartial" as meaning abstract or universal in the way a law is; and, late, the relativist objection that if the standard is what spectators approve, no entire society can be wrong. Tell me where each must be headed off and, where you can, what has to be established before the correction will take. Tell me as well what I should openly decline to cover in fifty minutes and say out loud that I am declining — I would rather name the omission than botch it. Close with a single question I can put to the room at the end that would show me they have the machinery rather than the vocabulary.
reasoning: |-
  Okay, let me unpack this TA's request. They need a tight 50-minute lesson plan for teaching Adam Smith's sympathy and impartial spectator concepts, with clear dependencies and strategic decisions on key sticking points. 

  First, I notice their core challenge is sequencing: how to build Smith's machinery step-by-step without oversimplifying. Their provisional spine (mechanism → propriety → internalization) makes sense, but those two unresolved placement questions about splitting spectator verdicts and handling the impartiality shift need careful handling. 

  The student misconceptions flagged are telling - they're worried about sociological reductionism and want to preserve the moral dimension. That fixed-point vs surrogate spectator dilemma is central. If I were designing this, I'd start with surrogate as the intuitive entry point but pivot early to fixed-point as the necessary correction. The calibration worry about partial spectators could actually become a teaching moment when introducing the impartial shift.

  For the example, it needs to be emotionally accessible but rule-ambiguous. A workplace snub scenario comes to mind - say, someone furious over being passed for promotion. This lets students distinguish between "I don't feel your anger" (propriety failure) and "your anger at Bob is misplaced" (merit issue), while leaving room to question whether coworkers' actual disapproval is justified.

  Timing-wise, the merit/propriety split should wait since it's not in their reading. Better to flag it as omitted than rush it. The relativist objection about societal error can be deferred too - plant the impartial spectator as the solution but save full discussion for later.

  The killer end question? "If your inner spectator approves something your friends all condemn, where does that standard come from?" That tests if they grasp the constructed yet critical nature of the impartial judge.
answer: |-
  Here’s a 50-minute spine focused on dependency, misconceptions, and your core questions. Prioritize mechanistic clarity over comprehensiveness.

  **Minimal Spine (Dependencies Explained):**
  1.  **(5 min) Sympathy as Mechanism (Anchor):**  
      *   **What:** Define sympathy as *imagined situational transfer* ("How would *I* feel in *your* circumstances?"), not emotional contagion or compassion.  
      *   **Why First:** Establishes the core cognitive process; prerequisite for everything else. Corrects "sympathy=compassion/altruism" immediately.  
      *   **Example Seed:** "Your friend is furious their meticulous project plan was rejected without comment." *Avoid* grief/pity. *Include* strong passion + ambiguous cause.

  2.  **(15 min) Propriety from Mismatch (Core Engine):**  
      *   **What:** Spectator tries to sympathize → fails ("I don't feel *that* angry!") → judges passion *disproportionate* to its cause/situation = **Impropriety**. Concord = **Propriety**.  
      *   **Why Here:** Builds directly on the mechanism. Shows propriety emerges *from* the spectator's struggle to sympathize, not rules.  
      *   **Example Development:**  
          *   *Spectator Attempt:* "If my plan was rejected like that, I'd be annoyed, maybe frustrated, but not *furious*."  
          *   *Mismatch & Verdict:* "Your fury seems excessive for the situation." (Propriety Failure).  
      *   **Crucial Avoidance:** *Do not* split propriety/merit yet. Focus *only* on passion/cause proportion. **Omit merit/demerit (Judging the *target* of passion) entirely.** Say: "Smith has another layer (merit/demerit), but we lack time; focus here is on judging the *feeling's fit* to its cause."

  3.  **(15 min) The Impartial Spectator Shift (The Moral Pivot):**  
      *   **What:** Move from *actual* bystanders ("Your coworkers think you're overreacting") to the **Impartial Spectator (IS)** ("What would a well-informed, disinterested observer judge?").  
      *   **Why Now & How:**  
          1.  Anchor: Start with **Surrogate Reading** (Internalized *actual* spectators). "We care what others think, so we imagine their view."  
          2.  **Pivot immediately to Fixed-Point:** "But actual people are biased, ignorant, or self-interested. My coworkers might resent you. To get a *fair* judgment, I correct for *their* partiality and *my* own bias. I imagine a spectator who knows *all* the facts and has *no* stake."  
      *   **Handle Calibration Here:** "What do we correct *towards*? *Towards* the view we imagine *would* emerge if *all* distorting factors (bias, ignorance, self-interest) were stripped away. It's iterative." Defuse briefly: "Yes, we start with actual views, but the correction *away* from distortion is what makes it *moral*, not just social."  
      *   **Why Split Here:** Corrects "inner spectator = internalized approval" *before* it solidifies. Pre-empts relativism ("We're correcting *away* from faulty actual views"). Makes "impartial" mean *disinterested & informed*, not abstract/universal law.  
      *   **Example:** "Coworkers think you're overreacting (maybe they dislike you). The IS asks: 'Knowing the boss's history, the project's importance to you, and the lack of feedback – is fury *proportionate*?' Maybe yes! Actual approval ≠ verdict."

  4.  **(10 min) Conscience as the Inner Tribunal:**  
      *   **What:** The IS isn't just for judging others; we internalize it to judge *ourselves*. Conscience = seeking approval from the *impartial* spectator within.  
      *   **Why Last:** Requires the constructed IS (Fixed-Point) to be in place.  
      *   **Example:** "Later, you ask: 'Was my fury *really* justified, or was I being unfair to the boss? What would the impartial spectator say?'"  
      *   **Address "Abstract/Universal" Misconception:** Reiterate: The IS isn't a Kantian law-giver; it's *situated* (requires imagining *this* situation fully) but *purified* of partiality.

  5.  **(5 min) Consolidation & Key Question:**  
      *   **Omissions Stated:** "We skipped merit/demerit (judging the *target* of feelings) and Smith's later developments (Parts II, V). Focus was core mechanism: Sympathy → Propriety → Impartial Spectator → Conscience."  
      *   **End Question (Diagnostic):**  
          *"Your Impartial Spectator approves of your anger in a situation where everyone you know disapproves. Where does that Impartial Spectator's standard come from, and why might it disagree with everyone else?"*  
          **(Tests for:** Fixed-point understanding (correction for bias/ignorance), non-sociological basis, source in iterative situational judgment).

  **Key Teaching Decisions Rationalized:**
  *   **Propriety/Merit Split:** **Omit merit entirely.** Your reading lacks it. Splitting it risks confusion and eats time. Propriety (passion/cause fit) is sufficient for the core mechanism → IS → Conscience arc. State the omission clearly.
  *   **Surrogate vs. Fixed-Point:** **Anchor with Surrogate, pivot IMMEDIATELY to Fixed-Point.** Starting with Surrogate is intuitive and hooks students ("Yeah, I care what others think"). **Pivoting within Step 3 is critical:** This is *where* the account becomes moral. Frame the pivot as *necessary* because actual spectators (and our internalized surrogates) are flawed. The calibration worry *is* the pivot point – use it to motivate the Fixed-Point. "We correct *because* they/we are partial/ignorant."
  *   **The Impartial Shift Timing:** **Do it explicitly EARLY in Step 3.** Students *will* jump to "impartial = abstract" or assume it's just aggregated opinion. Force the issue by contrasting actual vs. IS *right after* introducing the Surrogate. "But wait, actual people are biased... so we need to *correct*..."
  *   **Example Requirements:**  
      *   **Must Have:** Strong passion; cause ambiguous/debatable (not obviously right/wrong by simple rules); room for bystanders to be *wrong* due to bias/ignorance; allows distinction between "I don't feel *that* strongly" (propriety) vs. "Your anger is misplaced" (merit - though you won't use this).
      *   **Must Avoid:** Death/bereavement (avoids pity conflation); clear-cut right/wrong; situations heavily governed by known rules. Workplace frustration, romantic jealousy (handled carefully), intense artistic disappointment all work.
  *   **Misconception Handling:**  
      *   Sympathy=Compassion: **Corrected instantly in Step 1** via mechanism definition + example.
      *   Inner Spectator = Internalized Approval: **Pre-empted by Surrogate→Fixed-Point pivot in Step 3.** The calibration pivot *is* the correction.
      *   Impartial = Abstract/Universal Law: **Combat during Step 3 & 4:** Emphasize IS is *situated* but *purified*. Contrast with Kant (briefly: "Kant seeks universal rules; Smith seeks a fair judgment *of this case*").
      *   Relativism ("Society can't be wrong"): **Pre-empted by Fixed-Point pivot.** The *point* of the IS is that actual spectators/society *can* be wrong due to partiality/ignorance. **If raised late:** "The IS is the tool Smith gives us *to* critique flawed social approval."

  **Stick to this spine. State omissions (merit/demerit, custom/fashion, full conscience development) upfront and when relevant. The end question is your best gauge.**
