  ### Runnable Session Plan: "Does 'Better Than' Have to Be Transitive?"

  #### **Materials**
  - **Whiteboard & markers**
  - **Index cards** (for voting)
  - **Tokens** (e.g., poker chips; 10 per participant; redeemable for coffee vouchers post-session)
  - **Item cards** (for both frames; details below)
  - **Timer**
  - **Non-transitive dice** (optional; only for the 2-minute hook)

  ---

  ### **Item Sets**
  **1. Technical Frame (System Design Trade-offs)**  
  *Metrics: Latency (lower = better), Cost (lower = better), Durability (higher = better)*  
  - **A**: Latency: 1 ms | Cost: $10k/month | Durability: 99.99%  
  - **B**: Latency: 5 ms | Cost: $5k/month | Durability: 99.9%  
  - **C**: Latency: 20 ms | Cost: $2k/month | Durability: 99.5%  
  - **D**: Latency: 100 ms | Cost: $1k/month | Durability: 98%  
  - **E**: Latency: 500 ms | Cost: $500/month | Durability: 90%  

  **2. Moral Frame (On-Call Pain Distribution)**  
  *Team of 4 engineers; fixed 4 weeks of on-call pain. Dimensions: Fairness (higher = better), Burden on juniors (lower = better).*  
  - **A**: All 4 engineers take 1 week each. *Fairness: High | Junior burden: Moderate*  
  - **B**: 2 seniors take 1.5 weeks; 2 juniors take 0.5 weeks. *Fairness: Medium | Junior burden: Low*  
  - **C**: 1 senior takes 2 weeks; 1 junior takes 1 week; 2 engineers take 0.5 weeks. *Fairness: Medium-low | Junior burden: Very low*  
  - **D**: 1 senior takes 3 weeks; 1 junior takes 1 week; 2 engineers take 0 weeks. *Fairness: Low | Junior burden: Low*  
  - **E**: 1 junior takes all 4 weeks (seniors take 0). *Fairness: Very low | Junior burden: Very high*  

  *(Note: Juniors find on-call more stressful; seniors are resilient.)*

  ---

  ### **Session Rules & Payoff Scheme**  
  **Trade Round Rules**  
  - Participants start with 10 tokens and one randomly assigned item (A, B, C, D, or E).  
  - Facilitator offers sequential trades (1 token fee per trade):  
    - Trade 1: A → B  
    - Trade 2: B → C  
    - Trade 3: C → D  
    - Trade 4: D → E  
    - Trade 5: E → A  
  - Participants **must** hold the current item to trade.  
  - **Key rule:** Participants can **refuse any trade**. No pressure to accept.  
  - **Payoff:** Tokens are real (redeemable for coffee). If a participant completes all 5 trades, they end with the original item but 5 fewer tokens.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes**  

  1. **Hook (0–2 min)**  
     - Show non-transitive dice: "In ranking systems, if A beats B and B beats C, A must beat C. But *physically*, cycles exist. What about *better than*?"  
     - State goal: "Today, we’ll build two chains step-by-step and see where we land."  

  2. **Technical Frame: Pairwise Comparisons (10 min)**  
     - Present items A–E on the whiteboard.  
     - **Vote on adjacent pairs (A vs. B, B vs. C, C vs. D, D vs. E) + non-adjacent (A vs. E):**  
       - Options: "Better," "Worse," "Equal," or **"On a Par"** (neither better nor worse; not equal).  
       - Use index cards for anonymous votes; tally on whiteboard.  
     - **Critical instruction:** "Each step trades one feature (e.g., latency) for another (e.g., cost). Focus on *trade-offs*, not borderline cases."  

  3. **Technical Frame: Trade Round (10 min)**  
     - Assign items randomly (3–4 participants per item). Give 10 tokens each.  
     - Run trades 1–5 sequentially. Record who trades.  
     - **Debrief prompt:** "Check your tokens and item. Did anyone do all 5 trades? What’s your net loss?"  

  4. **Technical Frame: Number Assignment (10 min)**  
     - "Assign a value score (0–100) to each item. Ensure scores align with your pairwise votes (e.g., if you voted B > A, B’s score > A’s)."  
     - **Reveal conflict:** "If you voted A > E but scores imply A < E (via the chain), you must reject a vote or the scores."  

  5. **Moral Frame: Pairwise Comparisons (10 min)**  
     - Repeat Step 2 with moral items.  
     - **Add twist:** Re-vote on **A vs. E** (identical pair) in this new context. Note if votes change.  

  6. **Moral Frame: Trade Round (10 min)**  
     - Repeat Step 3. Observe if fewer trades occur vs. technical frame.  

  7. **Moral Frame: Number Assignment (10 min)**  
     - Repeat Step 4.  

  8. **Debrief (13 min)**  
     - **Reveal the principle:** "We tested if 'better than' is transitive. You likely encountered a **cycle** (A<B<C<D<E but A>E) or a **contradiction** (A<E by scores but A>E by vote)."  
     - **Three ways out** (map to session moments):  
       | **Way Out** | **Cost (Based on Session)** | **Example from Activity** |  
       |-------------|------------------------------|---------------------------|  
       | **Deny transitivity** | Money pump: Traders lost tokens by cycling. | "If 'better than' isn’t transitive, you can be pumped for tokens indefinitely." |  
       | **Accept endpoint (E > A)** | Reject your initial A>E vote. | "In Round 1, you said A>E. Now you must say E>A. Does that feel right?" |  
       | **Reject a link** | Break the chain; admit a pairwise error. | "If you reject, say, C>D, the cycle collapses. But you voted for it!" |  
     - **Key structural insight:** "This isn’t about fuzzy borders. It’s about stepwise trade-offs between *different* goods. Aggregating them can force hard choices."  
     - **Frame difference:** "Did you trade less in the moral round? Moral judgments resist stepwise trades because values feel incommensurable. But refusing to compare doesn’t solve the problem."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **No cycle forms in votes:**  
     - Likely if participants reject adjacent links (e.g., vote B > A but C < B).  
     - **Solution:** Use the tally to show majority votes created a *de facto* chain. Run a "what-if" with a volunteer who voted cyclically.  

  2. **"Just assign numbers!" in Round 1:**  
     - If someone demands this early, say: "We’ll do that in Round 3. First, commit to pairwise judgments."  
     - If the room insists, proceed to numbers but highlight: "Scores force consistency. If your votes conflict, which judgment will you override?"  

  3. **No one trades:**  
     - More likely in moral frame.  
     - **Solution:** Ask a volunteer with cyclical votes to simulate trades. Calculate token loss hypothetically.  

  ---

  ### **What the Activity Can’t Stage (Requires Verbal Explanation)**  
  - **Preference vs. judgment gap:**  
    - The trade round reveals **preferences** (what you *choose*), while votes reflect **judgments** (what you *deem better*).  
    - **Say this aloud:** "You might *judge* B better than A but not *prefer* it (e.g., in morals). But if you *act* on judgments, you’re still pumpable. The dice show physical cycles; this is about rational choice."  

  - **Why this matters for engineers:**  
    - "Ranking systems assume transitivity. If ‘better than’ isn’t transitive, you need safeguards (e.g., tie-breakers, multi-dimensional rankings)."  

  ---

  **Outcome:** Participants leave seeing cycles as a structural risk of stepwise trade-offs, with tangible costs (token loss, judgment overrides). The dice hook and real trades make it visceral—not theoretical.
