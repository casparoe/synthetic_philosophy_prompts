answer: |-
  ### Brainstorm  
  **(a) What the argument is:**  
  The moral core is **prioritarianism** (though unnamed): We have stronger duties to aid those in **absolute disadvantage** because a unit of resources does more fundamental good for them. The reading-intervention kids face severe, life-altering deficits in a foundational skill (literacy), placing them at risk of permanent exclusion from social/economic participation. Their need isn’t about ranking within the school, but about lacking a threshold capacity required for basic autonomy. Redirecting resources here isn’t about equalizing outcomes, but preventing catastrophic harm.  

  **(b) What it is NOT:**  
  - **Not egalitarian:** Not opposing inequality because it’s unfair that some have more. The honors program is cut because those resources rescue kids from dire straits, not because honors kids "have too much."  
  - **Not zero-sum within the school:** The argument doesn’t rely on the *relative* position of the reading group ("bottom quartile"). It’s about absolute deprivation: kids who cannot decode sentences.  
  - **Not utilitarian:** Not maximizing "total benefit." Sacrificing honors might reduce overall test scores, but that’s irrelevant. It’s about the moral weight of rescuing the drowning.  

  **(c) Forbidden Sentences & Reasons:**  
  1. *"This is fairer for everyone."* → **Reason:** It isn’t fairer for honors kids; it’s a loss. Implying otherwise is dishonest.  
  2. *"Honors students will benefit too!"* → **Reason:** They won’t from this change; this gaslights families.  
  3. *"We’re closing the achievement gap."* → **Reason:** The gap isn’t the problem; the absolute crisis is. Invites levelling-down.  
  4. *"Reading intervention is an investment in our future."* → **Reason:** Overclaims certainty; we *hope* it alters trajectories, but can’t prove it.  
  5. *"No child loses."* → **Reason:** Six economically vulnerable honors kids lose profoundly. Denial insults them.  
  6. *"The honors plaque divided us."* → **Reason:** The board’s plaque decision isn’t defensible via this argument. Don’t conflate.  

  ---

  ### The Speech (988 words)  

  Good evening. I need to talk about a hard decision we’ve made, one that affects two groups of kids we care deeply about. Starting in September, we’re ending the honors program and redirecting all its resources—the teacher time, the funding, the space—to a new reading initiative for students struggling severely with literacy. This means 40 students currently in honors will no longer have that program. It also means roughly 90 children reading far below grade level will get intensive, daily support to learn this most basic skill.  

  I know this hurts. For some families here, that program was a lifeline—a place where your child was seen, challenged, and given opportunities that felt like doors opening. For others, your child has been drowning in plain sight, unable to read the math problem, the science handout, or the permission slip for a field trip they can’t attend anyway because they can’t decipher the bus sign. Tonight, I have to explain why we’re doing this. Not because it’s easy, or popular, or because we think honors kids don’t matter. We’re doing it because the kind of help we can offer matters more urgently somewhere else.  

  **Here’s the heart of it:** Some kinds of need change everything. When a child reaches middle school unable to read a paragraph, they aren’t just behind. They’re locked out. Locked out of history textbooks, job applications, voting guides, medicine labels. The stakes aren’t about grades or rankings; they’re about whether a child can navigate the world. That’s a different kind of problem than whether a bright student gets to build a robot or visit a lab. Both matter. But one is a crisis happening *now* that we can directly address. The dollars we spent on enrichment for students already excelling? Those same dollars pay for trained specialists to sit one-on-one with a child who stares at letters like they’re static on a screen. And for that child? It’s not enrichment. It’s rescue.  

  **I won’t pretend this is neutral for everyone.** Forty kids lose something real. They lose a room where their curiosity was the priority. They lose a community. They lose opportunities that sparked joy. And that loss lands hardest on six of those students—kids whose families know exactly what $20,000 a year could mean elsewhere. Kids who fought to be in that room not just because they’re smart, but because it felt like a guarantee: *You won’t be left behind*. To them and their families: I see that. Losing this cuts deeper for you. You deserved that refuge. You earned it. And I’m sorry we can’t keep offering it.  

  **Why now?** Because we’ve reached a point where we can’t ignore the scale of the need below the surface. We have children in this building who can’t read "cat" or "stop" or "exit." Not "struggle to read." Can’t. Last year, we had 11-year-olds reading at a first-grade level. We’ve tried patching this with part-time aides and volunteers. It hasn’t worked. This new program isn’t a tweak. It’s a full reset: expert teachers, small groups, time carved out of the core day. It costs what the honors program costs. And we don’t have more to give.  

  **Let me be clear about what this isn’t.** This isn’t about rankings. Not about who’s "bottom" or "top." It’s about a threshold. Think of it like medicine: If you have two patients, one with a broken wrist and one bleeding heavily, you don’t split the bandages because it’s "fair." You stop the bleeding first because the cost of waiting is catastrophic. That’s not a judgment on the broken wrist. It’s a recognition of which wound risks the whole future.  

  **About the honors plaque and the honor roll:** The board voted to remove them. I supported that vote. But it’s a different decision, resting on different reasons. Celebrating achievement isn’t wrong. But symbols send messages. When we publicly name the "top" students in a building where half the kids can’t access the race, it doesn’t just honor excellence. It can also send a message about who we notice and who we overlook. That’s a separate conversation—one about belonging, not resources. We can have that talk later. Tonight, I’m focused on the urgent, tangible choice we made about where our finite resources must go.  

  **Will this reading program fix everything?** No. Some kids will still struggle. Some might never catch up. I can’t stand here and promise you third-grade reading scores map neatly to adult happiness. But I *can* say this: When a child can’t read, we know—absolutely know—what happens next. The walls close in. The choices vanish. The shame sets hard. We have a chance to change that trajectory for 90 kids. Not by making them "winners," but by giving them the tool they need to build their own lives.  

  This building has always been about opening doors. Tonight, we’re choosing to unlock the heaviest ones first. It’s a choice that asks some families to bear a real loss so others might gain a future. I don’t expect that to feel good. But I hope, in time, you’ll see it as necessary.  

  Thank you. Let’s talk.  

  ---

  ### Post-Speech Note (297 words)  

  **Where the Speech Takes Philosophical Sides:**  

  1. **Settled Consensus:**  
     - *Severe disadvantage prioritization*: Moral philosophers widely agree society has stronger obligations to alleviate severe deprivation (like illiteracy) over enhancing well-off agents. This is non-controversial.  
     - *Anti-levelling-down*: The speech avoids implying inequality itself is wrong. Resources move to prevent harm, not erase advantages.  

  2. **Contested Ground (Your Side Chosen):**  
     - **Prioritarianism vs. Equality:** You implicitly endorse *prioritarianism* (helping the worse-off matters more) over *egalitarianism* (reducing inequality matters). Philosophers like Parfit (priority view) vs. Temkin (equality) debate this. Your economist may note: prioritizing absolute need rejects Pareto efficiency (honors kids lose without offsetting gain).  
     - **"Worse-Off" as Absolute vs. Relational:** You insist the reading group’s disadvantage is *absolute* (lacking literacy’s functional threshold), not *relational* (being "bottom quartile"). Anderson & Scanlon support this; relational egalitarians (e.g., Scheffler) might argue relational harm exists too (stigma). You reject that as secondary.  
     - **Non-Aggregation:** You weigh the reading group’s crisis as morally overriding, even if honors kids’ losses are significant. This rejects "add up all gains/losses" utilitarianism. Philosophers like Nagel agree; others demand aggregation.  

  3. **Unproven Empirical Claims:**  
     - **Threshold Certainty:** Claiming illiteracy causes "catastrophic" harm assumes a bright-line threshold. Some philosophers (e.g., Frankfurt) question if thresholds exist; economists note literacy’s returns vary by context.  
     - **Intervention Efficacy:** The speech leans heavily on early literacy intervention altering life trajectories. Evidence supports this *on average*, but not for every child. You acknowledge uncertainty ("Some might never catch up"), but the argument requires the gamble being worth it.  
     - **Symbolic Harm:** Asserting the honors plaque "overlooks" struggling kids assumes psychological harm. Evidence on this is mixed (e.g., some kids motivated by honor rolls).
