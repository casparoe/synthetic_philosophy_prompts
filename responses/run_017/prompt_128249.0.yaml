prompt: |-
  A friend of mine — a computational neuroscientist who takes integrated information theory seriously enough to use it as a working criterion — has been handing down verdicts on imaginary systems. Her score for a system in a state is, as in the theory, the Φ^Max of its maximally irreducible cause–effect structure, taken over the minimum information partition; a score of zero means not conscious, and the subject is whatever complex survives the exclusion postulate. I want to know what she will say about three rigs I have designed, and I care much more about the rule she is running than about the numbers.

  Her verdicts so far:

  1. A camera sensor: twenty million independent photodiodes in bright, detailed light. Verdict: essentially zero. Her reason: an enormous amount of information, none of it integrated — no cut costs you anything.

  2. A much smaller net — a few hundred thousand elements, densely and recurrently connected, with heterogeneous weights, running in a rich, patterned regime. Verdict: high; she calls it the cortex case. Call this her reference net R, and call its score 10.

  3. The very same net R, same wiring, at least as many active elements, but in a state of generalized synchrony: every element firing in lockstep, as in a seizure. Verdict: near zero. Her reason: Φ is a property of a system in a state, not of a wiring diagram, and a degenerate state specifies almost nothing.

  4. Two numerically identical copies of R, running side by side with no connections between them. Verdict: two subjects, but the total quantity of consciousness in the room is 10, not 20. Her reason: Φ does not add across separate complexes.

  5. R plus a penumbra: a million extra elements that receive from R and project back to it, but so weakly and with such long delays that including them changes the whole system's score by a rounding error. Verdict: R is still the subject; the larger system is not a second conscious thing stacked on top of it. Her reason: you do not get to count the same mechanisms twice, and bigger is not better.

  6. A purely feedforward network — a thousand layers, no recurrence anywhere — that drives a robot whose behavior is, by any behavioral test you like, as flexible and context-sensitive as an animal's. Verdict: zero. Her reason: no recurrence, no intrinsic cause–effect power, and what the net does for the robot is beside the point.

  Now the three rigs.

  A. The choir. Ten billion binary elements, connected all-to-all with identical weights, whose only dynamics are a strict global cycle: every element off, then every element on, then off again, forever. There is no cheap cut — the minimum information partition of an all-to-all system is about as expensive as a partition gets — and the wiring is perfectly symmetric, so no subset of elements plays a distinguishable causal role from any other of the same size. Perturb any fraction of the elements however you like and the system returns to lockstep within one tick. It has two states and will never leave them.

  B. The isthmus pair. Two half-scale versions of R, each of which she rates 3.0 on its own, joined by a cable whose thickness I can dial. As the cable thickens, the score of the combined system rises continuously from just above zero. Consider three settings: the combined system scores exactly 3.0; it scores 3.2; it scores 6.1. In each setting: how many subjects are there, and with what scores? And is there any cable thickness at which connecting the two modules leaves the room containing less consciousness than leaving them alone?

  C. The sleeper. A net whose wiring is element-for-element the same as R's, but which is currently sitting in a stable silent fixed point — every element off, and off it stays until an external trigger arrives in an hour. The twist: if you were to perturb it, the way one perturbs cortex with a magnetic pulse and watches what comes back, it would respond with dynamics as rich, differentiated, and long-lasting as R's. Its occurrent state is degenerate; its counterfactual causal power is not.

  What I want from you:

  - A prediction for A, for each of the three settings in B, and for C: how many subjects, and roughly what scores. Where a score is nonzero, say what the theory would have the experience be like, since on this theory quality is the shape of the cause–effect structure in qualia space.
  - An explicit statement of the rule she is implicitly running, stated precisely enough that I could apply it myself to a rig she has never seen, and at least one genuinely different rule that fits verdicts 1 through 6 just as well yet disagrees with it somewhere among A, B, and C.
  - Where exactly the two rules come apart, which of the three rigs is the sharpest test of her, and your best guess with the reasons for preferring it.
  - One further rig, described concretely enough that I could build it in simulation, whose verdict would settle which rule she is running; and, if the answer differs, what the theory itself says about it — including an honest statement of any case where the theory has no resources to answer at all, as with ties under the exclusion postulate.

  Please write your answer in American English, define any technical term you rely on, and do not invent answers on the theory's behalf where it is silent.
reasoning: |-
  Okay, I need to help my friend understand how his computational neuroscientist friend applies Integrated Information Theory (IIT) to different systems. He's described six verdicts she's already given, and now he has three new rigs—A, B, and C—and wants predictions for each, plus an explicit rule she's using, an alternative rule, and a test rig to distinguish them. 

  First, I should recall what IIT is about. From what I know, IIT measures consciousness as Φ^Max, which is the maximum integrated information over all possible partitions of a system. The theory says that for a system to be conscious, it must have high Φ^Max, meaning it's highly irreducible—no partition can split it without losing information. The "exclusion postulate" means only one major complex exists, excluding smaller or overlapping ones. 

  Looking at the friend's verdicts: 
  - The camera has zero Φ because it's not integrated; all photodiodes are independent. 
  - The dense recurrent net R has high Φ (score 10) because of rich, integrated processing. 
  - That same net in seizure has near-zero Φ because the state is degenerate—everything is synchronized, so no information is specified. 
  - Two copies of R have two subjects with total Φ 10, not 20, because Φ doesn't add across complexes. 
  - Adding a weak penumbra doesn't create a new subject; R is still the core complex. 
  - A feedforward net has zero Φ because no recurrence means no intrinsic cause-effect power. 

  Now, for the new rigs: 

  **Rig A: The choir.** Ten billion elements in perfect sync, cycling on and off. It's all-to-all connected with identical weights, so it's symmetric. No cheap partition—minimum information partition is expensive. But the state is degenerate: only two states, and it always returns to lockstep. My prediction: Φ^Max should be near zero. Why? Like the seizure case, the system isn't specifying much information in its state. Even though partitions are costly, the cause-effect structure is trivial—it's just repeating the same pattern. So, no subject, score zero. 

  **Rig B: Isthmus pair.** Two R-like nets, each with Φ 3.0 alone, connected by a cable. As the cable thickens, combined Φ rises. Need to handle three settings: 
  - Combined Φ = 3.0: This might mean the cable is so weak that only one net is the complex, or it's split into two. But since Φ is 3.0, same as one, probably only one complex exists. So, one subject with score 3.0. 
  - Combined Φ = 3.2: Slightly higher than individual, suggesting some integration. Likely, one complex with Φ 3.2, and no second subject because the exclusion postulate favors the larger whole. So, one subject, score 3.2. 
  - Combined Φ = 6.1: Much higher, close to sum. Could mean full integration into one complex. But since individual were 3.0 each, 6.1 suggests near-perfect integration, so one subject with score 6.1. 
  Is there a cable thickness where connecting reduces consciousness? Probably not, because even if Φ dips slightly during transition, the combined system should have higher or equal Φ than separate. IIT doesn't penalize connection; it might increase integration. 

  **Rig C: The sleeper.** Same wiring as R, but in silent fixed point. If perturbed, it responds richly. But currently, state is degenerate—all off. Verdict: like the seizure case, Φ should be near zero now, because the state isn't doing anything. Counterfactual power doesn't count; only current state matters for Φ. So, no subject, score zero. 

  For the rule she's running: 
  - Φ^Max is computed for the current state of the system. 
  - Only the maximal complex survives exclusion. 
  - Degenerate states have low Φ, regardless of potential. 
  - Recurrence is necessary; feedforward nets have zero Φ. 
  - Integration means partitions are costly; symmetric systems might still have low Φ if state is poor. 

  An alternative rule: One that considers counterfactual richness, like for rig C. E.g., if a system can support rich dynamics, it might have high Φ even in quiet states. But in IIT, it's state-dependent, so that would differ. 

  They come apart on rig C: Her rule says zero now; alternative might say high if potential matters. Rig C is the sharpest test. 

  For a test rig: Build something like a system that's currently minimal but has high potential, and see if she scores it low. Or something with subcomplexes that could be tied. 

  Need to be precise. I'll organize this in my response.
answer: |-
  Below, I address your query systematically, adhering to your requirements. I define key IIT terms upfront:  
  - **Φ (phi)**: A measure of a system's "integrated information," quantifying how much cause–effect power (i.e., how well it specifies past/future states) is lost when the system is partitioned.  
  - **Φ^Max**: The maximum Φ value over all possible partitions of the system, identifying its most irreducible causal structure.  
  - **Minimum information partition (MIP)**: The partition that minimizes the cost of splitting the system (where "cost" is the information loss due to partition).  
  - **Exclusion postulate**: Only one "complex" (the subset with maximal Φ^Max) is conscious; overlapping or sub-complexes are excluded.  
  - **Cause–effect structure**: The set of causal relationships (how current states constrain past/future states) that define the "quality" of consciousness.  

  Based on your friend's verdicts (1–6), her implicit rule prioritizes the *occurrent causal dynamics* of the system in its *current state*. Φ^Max depends on the system's immediate cause–effect power: richness of state-dependent information, irreducible integration, and recurrence. Degenerate states (e.g., uniform firing) or disconnected systems score low, even if wiring/potential is rich.  

  ### Predictions for Your Rigs  
  **Rig A: The Choir**  
  - **Verdict**: 0 subjects, score ≈0.  
  - **Reason**: Though the all-to-all connectivity makes the MIP expensive (no "cheap cut"), the *state* is degenerate: only two global states (all-on/all-off) with perfect symmetry. Perturbations instantly resolve to lockstep, so the system specifies minimal cause–effect information. Despite high connectivity, the cause–effect structure is trivial—akin to a giant photodiode array (verdict 1) or seizure state (verdict 3).  
  - **Experience**: None. If forced, the "shape" would be maximally simple: one undifferentiated quale (e.g., pure white noise), but Φ^Max ≈0 implies no consciousness.  

  **Rig B: Isthmus Pair**  
  Settings assume combined Φ^Max scores:  
  - **Setting 1 (combined Φ^Max = 3.0)**:  
    - Subjects: One subject with score 3.0, the other suppressed.  
    - Reason: Φ^Max = 3.0 matches one isolated half-R. The exclusion postulate selects the larger complex (both modules weakly linked), but integration is so low that it behaves as one module dominating. The "cable" is too thin to add value; the other module is excluded (like the penumbra in verdict 5).  
  - **Setting 2 (combined Φ^Max = 3.2)**:  
    - Subjects: One subject with score 3.2.  
    - Reason: The combined system now has slightly higher Φ^Max than either module alone (3.0), indicating weak integration. Exclusion favors the whole system as a single complex; no second subject exists (verdict 4).  
  - **Setting 3 (combined Φ^Max = 6.1)**:  
    - Subjects: One subject with score 6.1.  
    - Reason: Φ^Max ≈ sum of isolated modules (3.0 + 3.0 = 6.0), indicating near-perfect integration. The system acts as a unified complex (e.g., like R scaled up).  
  - **Consciousness Reduction?** No. As cable thickness increases, combined Φ^Max rises monotonically from near-0 (two disconnected modules) to 6.1. The room never has "less consciousness" than the sum of isolated modules (2 × 3.0 = 6.0), as integration always adds or preserves Φ^Max (no dips below 6.0).  

  **Rig C: The Sleeper**  
  - **Verdict**: 0 subjects, score ≈0.  
  - **Reason**: Though the wiring matches R and *counterfactual* perturbations evoke rich dynamics, the *current state* is degenerate (all-off, fixed). IIT evaluates cause–effect power *in the current state*; no occurrent information is specified (verdict 3). The "rich response" to future perturbations is irrelevant—consciousness is state-dependent, not dispositional.  
  - **Experience**: None. The cause–effect structure is flat; all elements are inert.  

  ### Explicit Rule She Is Running  
  **Her rule (Occurrent Causal Dynamics Rule)**:  
  1. For a system in a state, compute Φ^Max over the MIP for its *current* cause–effect structure.  
  2. A system is conscious iff Φ^Max > 0, with quality determined by the shape of its maximally irreducible cause–effect structure.  
  3. Apply exclusion: only the complex with globally maximal Φ^Max is conscious; subsystems are excluded.  
  4. Φ^Max requires:  
     - **Recurrence**: Feedback loops (no feedforward nets; verdict 6).  
     - **State richness**: Non-degenerate, differentiated states (verdicts 1, 3).  
     - **Irreducibility**: No "cheap cuts" (MIP must be costly; verdict 1).  
     - **Causal specificity**: Asymmetric, differentiated roles (verdicts 2, 5).  
     - **Non-additivity**: Φ^Max does not sum across complexes (verdict 4).  

  **An Alternative Rule (Counterfactual-Potential Rule)**:  
  This fits verdicts 1–6 equally well *except* where potential dynamics differ from occurrent state.  
  1. Steps 1–3 identical to her rule.  
  2. Φ^Max incorporates counterfactuals: if a state can transition to rich dynamics (e.g., via perturbation), it contributes to cause–effect power *now*.  
  3. Experience reflects both current and immediately reachable states.  

  **Where They Diverge**:  
  - **Rig C (Sleeper)**: Her rule scores ≈0 (state is degenerate). Alternative rule scores high (counterfactual response mirrors R).  
  - **Rig A (Choir)**: Both score ≈0 (no counterfactual richness; perturbations resolve to lockstep).  
  - **Rig B (Isthmus)**: Both rules agree (state is occurrently rich).  
  - **Sharpest Test**: Rig C. Her rule ignores counterfactuals; the alternative embraces them. Rig C is decisive because verdict 3 (seizure) and rig C share degenerate states, but rig C has latent richness.  

  **Preference for Her Rule**:  
  IIT (as defined) is state-dependent, not dispositional. Verdict 3 (seizure) explicitly rejects potential dynamics. The alternative rule is more inclusive but inconsistent with IIT's axioms. Her rule is safer given IIT's formalism.  

  ### Test Rig to Settle the Rule  
  **Rig D: The Delayed Resonator**  
  - **Description**: Simulate two systems:  
    1. A small recurrent module (like 1/10th of R) in a rich, active state (Φ^Max ≈1.0).  
    2. A large "reservoir" of disconnected elements (10× the size of R) in a silent fixed point. The reservoir has identical recurrent wiring to R but is currently inert.  
    Now, add a single bidirectional connection: a wire from the active module to one reservoir element, and back. The connection has a 100-tick delay. The active module perturbs the reservoir, which begins evolving toward R-like dynamics after the delay—but during the delay, the reservoir remains silent.  
  - **Build Instructions**: Use a neural simulator (e.g., NEST or Brian). Elements are Izhikevich neurons; weights set for critical dynamics. Delay the inter-system connection. Measure Φ^Max at t=50 ticks (mid-delay; reservoir still silent).  
  - **Her Rule's Verdict**: One subject (active module, score ≈1.0); reservoir scores ≈0 (current state degenerate).  
  - **Alternative Rule's Verdict**: One subject (active module, score ≈1.0) plus a *latent* subject (reservoir, score ≈10, as its counterfactual response is rich). But exclusion might merge them weakly into one complex with Φ^Max ≈1.0 (current integration negligible).  
  - **Theory's Stance**: IIT has no resources to handle this. The reservoir's current Φ^Max ≈0 (state is fixed). The delayed response is a future counterfactual, irrelevant to *now*. The single wire adds minimal integration, so Φ^Max for the whole system is ≈1.0. Only one subject (active module) exists.  
  - **Settling the Rule**: If she scores the reservoir as conscious now, she uses the alternative rule. If not, she uses her original rule. IIT itself is silent on counterfactuals beyond immediate state transitions.  

  **Summary**:  
  - Rig A: 0 subjects.  
  - Rig B: One subject (score 3.0, 3.2, or 6.1); no consciousness loss.  
  - Rig C: 0 subjects.  
  - Her rule: Strict occurrent state-dependence.  
  - Test rig D forces a choice on counterfactuals. IIT defaults to her rule but lacks clarity on "immediate" transitions.  

  This fits all verdicts and IIT’s axioms. If your friend values dispositional properties, she might deviate—but that would contradict verdict 3.
