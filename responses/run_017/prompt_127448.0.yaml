prompt: |-
  I direct the documentation and public-statements unit at an international human-rights organisation, and I want a written decision procedure my team can actually run when we have to decide whether to call something genocide — or to use one of the weaker formulations we fall back on. The question arises fifteen to twenty times a year, always under time pressure: we have a twenty-four to forty-eight hour window, two junior researchers with field training but no legal qualifications, a legal adviser who is part-time and seven time zones away, and a rule that every characterisation must be signed off by the executive director before publication. Our statements then have a long afterlife: they are read into UN proceedings, quoted in donor capitals, amplified by diaspora organisations lobbying their own governments, and translated for local partners. We also have a hard internal rule against walking a characterisation back once it is published, and we were publicly accused last year of applying the standard faster in one country than in another, so cross-regional consistency is a live constraint, not a nicety.

  What I need is the conceptual structure turned into a test, not a summary of the law and not a literature review. The structure I have in mind is: the treaty definition with its four protected groups; the requirement that the group be targeted as such rather than incidentally; the unresolved question of how large or how significant a part of a group has to be; and the gap between that definition and the broader phenomenon Lemkin meant to name, a coordinated assault on a group's political, social and cultural continuity as well as its biological survival, of which the destruction of political groups and of culture were proposed and then dropped. I want a procedure with the questions in a fixed order, a specification of what counts as sufficient evidence at each step (including what to do when the relevant evidence simply does not exist, as opposed to being contradicted), the points at which the procedure terminates with a no, and the points at which it must hand the question to a person because it is a values conflict rather than a factual gap. Please have it operate on a graded vocabulary rather than a binary yes-or-no — something like a ladder running through crimes against humanity, genocidal acts, a genocidal campaign, and genocide, with a qualified or provisional register for cases where the evidence is directional but thin. One further thing I want built in: a fork between naming now and naming later, with explicit triggers for revisiting a case and a requirement that the reasoning be recorded in a one-page attribution memo that a successor can audit. Please define, as part of the procedure, four terms I intend to use internally: attribution debt, meaning the credibility we spend by naming early and that is charged against us in every later statement; downstream capture, meaning the fact that once we use the word, states, courts, funders and the perpetrators' own propagandists will use it for ends we neither intend nor control; the asymmetry of the two errors, meaning that the cost of under-naming falls on the victims of today while the cost of over-naming falls on future victims and on our own future credibility, and these are not the same people; and the residual case, meaning a campaign that falls inside Lemkin's sense but outside the treaty's.

  Then run it on three stylised cases. First: a campaign against a small linguistic minority in which the death toll is in the low hundreds, but the language is banned from schools and courts, the archives and religious sites are destroyed, and the community's civic and religious leadership is killed or exiled — I expect this one comes back as a no on genocide, and I will tell you in advance that I want to say yes, so I want to see exactly where the procedure forces my hand and what the strongest available formulation is instead. Second: roughly five thousand dead over four months, selected by ethnicity in a mixed province, with no seized operational orders and no speeches by political leaders, only the pattern of killing, slurs recorded on video by soldiers, and a government account of counter-insurgency — give me what the procedure says and, crucially, what specific piece of evidence would move it up a rung. Third: a later phase of a campaign for which a UN-mandated commission of inquiry has already used the word for an earlier phase, in which the current phase kills far fewer people but involves systematic removal of children and the calculated destruction of the water and food infrastructure the group depends on — tell me whether we may inherit someone else's finding or must re-derive it, and what an independent check looks like under a forty-eight hour deadline. Finally, be explicit about what this procedure cannot do: I am particularly interested in whether it can settle the question of whether the word ought to be reserved as a legal term of art at all, how it should handle the competitive-victimhood dynamics where advocates for another group demand symmetrical language, and what it should say when donors or host governments lean on us in either direction.
reasoning: |-
  We are designing a decision procedure for characterizing atrocities, with a focus on whether to use the term "genocide" or a weaker formulation. The procedure must be operational under tight deadlines (24-48 hours) with limited staff (two junior researchers, a part-time legal advisor in a different time zone) and require sign-off by the executive director. The output must be consistent, auditable, and avoid retractions. We are also introducing graded vocabulary and specific internal terms.

  Key components:
  1. **Graded Vocabulary (Ladder)**:
     - Crimes against humanity (CAH): Widespread or systematic attack against any civilian population.
     - Genocidal acts: Acts that fall under Article II of the Genocide Convention (e.g., killing, causing serious harm, etc.) but without the required intent to destroy a group.
     - Genocidal campaign: A pattern of genocidal acts with some evidence of intent, but not meeting the full threshold for genocide (e.g., intent is inferred but not conclusive, or the scale is insufficient).
     - Genocide: Meets all elements of the Genocide Convention definition: acts committed with intent to destroy, in whole or in part, a national, ethnical, racial or religious group.

     Additionally, we have a qualified/provisional register for when evidence is directional but thin (e.g., "indicative of genocide", "suggestive of genocidal intent").

  2. **Internal Definitions**:
     - **Attribution debt**: The credibility spent by naming early, which must be accounted for in future statements. (Using the term prematurely may lead to future statements being met with skepticism.)
     - **Downstream capture**: Once the term is used, external actors (states, courts, etc.) will use it for their own ends, which we cannot control.
     - **Asymmetry of the two errors**: 
          - Under-naming: The cost falls on current victims (lack of protection, attention, justice).
          - Over-naming: The cost falls on future victims (diminished credibility of the organization, leading to less impact in future crises) and the organization's credibility.
     - **Residual case**: A campaign that fits Raphael Lemkin's original concept (destruction of a group's political, social, cultural continuity) but not the legal definition (e.g., targeting a political group or cultural destruction without biological destruction).

  3. **Procedure Structure**:
     - Fixed order of questions.
     - Specifies sufficient evidence at each step and how to handle absence of evidence.
     - Termination points for a "no" decision.
     - Points where human judgment is required (values conflicts).
     - Fork for "naming now" vs. "naming later", with triggers for revisiting and an attribution memo.

  4. **Audit Trail**: A one-page attribution memo that records:
     - The evidence considered.
     - The reasoning for the characterization.
     - The point at which the decision was made (including where the procedure terminated or required human judgment).
     - The graded term chosen and why.
     - Any attribution debt incurred or downstream capture anticipated.
     - Any asymmetry considerations.

  **Procedure Steps**:

  1. **Group Identification**:
     - *Question*: Is there a protected group (national, ethnical, racial, religious) under the Genocide Convention?
     - *Evidence required*: Demonstrable existence of such a group (e.g., self-identification, recognition by others, historical documentation). If the group is not one of the four, note it as a residual case and terminate the genocide path (proceed to consider CAH or genocidal acts if applicable).
     - *Absence of evidence*: If the group is not clearly one of the four, the genocide path terminates. Consider if the campaign might be a residual case.
     - *Termination*: If no protected group, then genocide is not applicable. Proceed to consider CAH or genocidal acts (if the acts are similar but the group is not protected).

  2. **Pattern of Acts**:
     - *Question*: Are there acts listed in Article II (killing, causing serious bodily or mental harm, deliberately inflicting conditions of life calculated to bring about physical destruction, imposing measures intended to prevent births, or forcibly transferring children)?
     - *Evidence required*: Documentation of at least one such act (e.g., reports of killings, harm, displacement, destruction of essential resources, child removal). Multiple sources (e.g., field reports, witness accounts, satellite imagery) are ideal. If only one source, note the risk.
     - *Absence of evidence*: If no evidence of any Article II act, then genocide and genocidal acts are not applicable. Proceed to CAH.
     - *Termination*: If no Article II acts, terminate for genocide and genocidal acts. Consider CAH.

  3. **Targeting the Group as Such**:
     - *Question*: Are the acts directed against the group because of their group membership (i.e., not incidental)?
     - *Evidence required*: Patterns (e.g., victims selected by group identity, use of slurs, discriminatory policies, statements by perpetrators). Contextual evidence (e.g., history of conflict, propaganda) can support. If the evidence shows the group is targeted, proceed. If not, it may be incidental (e.g., victims are targeted for political reasons, not group identity).
     - *Absence of evidence*: If no evidence of targeting, then genocide and genocidal campaign are not applicable. The acts might still be genocidal acts or CAH.
     - *Termination*: If no evidence of targeting, terminate for genocide and genocidal campaign. Consider genocidal acts (if Article II acts exist) or CAH.

  4. **Intent to Destroy**:
     - *Question*: Is there evidence of intent to destroy the group, in whole or in part?
     - *Evidence required*: This is the most challenging. Look for:
          - Direct evidence: Orders, speeches, manifestos, official documents.
          - Circumstantial evidence: Pattern of violence (systematic, widespread), scale, methods (e.g., targeting leaders, destroying cultural symbols, cutting off food/water), combined with context (e.g., denial of the group's existence, dehumanizing language).
          - Note: Intent can be inferred from the totality of the circumstances. However, the threshold is high.
     - *Absence of evidence*: If no evidence of intent (and no basis for inference), then genocide is not met. It may be a genocidal campaign (if there is some evidence but not conclusive) or genocidal acts (if acts exist without intent).
     - *Termination*: If no evidence of intent and no reasonable inference, terminate for genocide. Proceed to genocidal campaign or acts.

  5. **Scale and Significance**:
     - *Question*: Is the scale (number of victims, geographic scope) or the significance (targeting a key part of the group, such as leadership, or essential structures) sufficient to constitute destruction "in part"?
     - *Evidence required*: Data on casualties, displacement, destruction of infrastructure. Qualitative evidence on the importance of the targeted part (e.g., if leaders are killed, the group's ability to exist is threatened). There is no fixed number; consider the group's size and the impact.
     - *Absence of evidence*: If the scale is very low (e.g., a few isolated incidents) and the targeted part is not significant, terminate for genocide. It may be genocidal acts or CAH.
     - *Termination*: If the scale is too small and the part is not significant, terminate for genocide. Proceed to genocidal campaign or acts.

  6. **Graded Decision**:
     Based on the above, assign a characterization:
     - Genocide: All steps 1-5 are satisfied with strong evidence.
     - Genocidal campaign: Steps 1-4 are satisfied but intent is inferred with medium evidence, or step 5 (scale) is borderline. Or, if the campaign is ongoing and evidence is mounting but not yet conclusive.
     - Genocidal acts: Steps 1-2 satisfied, but 3 (targeting) or 4 (intent) is weak or absent. Acts are present but without clear intent or targeting.
     - Crimes against humanity: If genocide path terminates early, but there is a widespread or systematic attack against civilians.

     *Qualified/provisional register*: If evidence is directional but thin (e.g., intent is suggested but not proven), use terms like "indicative of genocide" or "potential genocide" and note the need for further investigation.

  7. **Residual Case Consideration**:
     - If the campaign does not fit the legal definition but matches Lemkin's concept (e.g., destruction of a political group or cultural destruction without biological destruction), note this in the attribution memo. The public statement might then use terms like "cultural genocide" or "group destruction" but avoid the legal term "genocide". This is a values conflict: the legal team must be consulted.

  8. **Naming Now vs. Naming Later**:
     - *Fork*: If the evidence is almost sufficient but not quite (e.g., genocidal campaign with strong indicators) and the situation is ongoing, consider "naming later". 
     - *Triggers for revisiting*:
          - New evidence of intent (e.g., a leaked document, a speech).
          - Escalation in scale (e.g., mass killings, widespread destruction).
          - A new phase (e.g., from killings to child removals).
          - A report by a UN body or credible commission.
     - *Attribution memo*: Must record why we are not naming now and what would trigger naming later.

  9. **Values Conflicts**:
     - Points requiring human judgment (escalate to legal advisor and executive director):
          - When the group is not a protected group but the campaign is Lemkin-style (residual case) — conflict between legal precision and moral imperative.
          - When evidence of intent is contested or ambiguous.
          - When the scale is borderline.
          - When there is pressure from donors, governments, or competitive victimhood dynamics.

     For competitive victimhood: The procedure must be applied equally to all situations. The attribution memo should note if symmetrical language is demanded but the evidence does not support it. The decision must be based on evidence, not advocacy.

     For donor/host government pressure: The procedure is evidence-based. The attribution memo must note any external pressure and how it was addressed (e.g., "despite X pressure, we followed the procedure and found..."). The legal advisor and executive director must be made aware of such pressure.

  **What the Procedure Cannot Do**:
  - It cannot settle the normative question of whether the term "genocide" should be reserved as a legal term of art. That is an organizational policy decision (already made: we use the legal definition but note the residual cases). The procedure applies the legal definition.
  - It cannot eliminate the risk of downstream capture; it can only note the risk in the attribution memo.
  - It cannot resolve competitive victimhood dynamics beyond applying the same procedure to each case and documenting the reasons for any asymmetry in characterization.
  - It cannot prevent external pressure, but it provides a transparent basis to resist it.

  **Running the Stylised Cases**:

  *Case 1: Campaign against a small linguistic minority*
  - Deaths: low hundreds (say 300-500).
  - Acts: language banned, archives and religious sites destroyed, civic/religious leadership killed or exiled.
  - Group: Linguistic minority. Is this a protected group? The Genocide Convention protects national, ethnical, racial, religious groups. Linguistic groups are not explicitly protected unless they coincide with one of these (e.g., if the linguistic group is also an ethnic group). Assume it is not one of the four? Then:
    - Step 1: Terminate for genocide (no protected group). Consider if it is a residual case (Lemkin-style).
    - Pattern of acts: Destruction of cultural sites and killing of leaders are potentially Article II acts (deliberately inflicting conditions of life to bring about destruction? Or destroying the group's culture as part of a broader attack? Note: cultural destruction alone is not in the Convention). However, killing is an Article II act. But without a protected group, we cannot call it genocide.
    - Characterization: 
        - Genocide: No (terminated at step 1).
        - Genocidal acts: The killings are Article II acts, but without a protected group, even this term might be legally inaccurate. Better to use CAH (murder as part of a widespread attack) or note the cultural destruction as a residual case.
    - Residual case: This fits Lemkin's concept (destruction of cultural continuity). This is a values conflict: the team must escalate to the legal advisor and executive director. The strongest available formulation might be: "a campaign of cultural destruction and violence that aims to eliminate the group's existence as a distinct community" — but avoid "genocide". Alternatively, call it "crimes against humanity" (for the killings) and separately describe the cultural destruction.
    - Where the procedure forces your hand: At step 1, because the group is not protected. The organization must decide whether to stretch the definition (which risks downstream capture and attribution debt) or stick to the Convention. The procedure requires sticking to the Convention for the term "genocide".
    - Attribution memo: Would note the residual case and the decision to use non-genocide language.

  *Case 2: Five thousand dead over four months, selected by ethnicity in a mixed province. No seized orders or speeches, but slurs on video and a government counter-insurgency claim.*
  - Group: Ethnic group (protected).
  - Acts: Killing (Article II).
  - Targeting: Selection by ethnicity and slurs indicate targeting the group as such.
  - Intent: The key gap. No direct evidence (orders, speeches). Circumstantial evidence: scale (5,000 in 4 months is very high), pattern (ethnic selection), slurs. Government claims counter-insurgency, which might be a cover. 
    - Step 4: Intent must be inferred. The scale and pattern are strong circumstantial evidence. The slurs add to it. However, without more, it might be a genocidal campaign (with inferred intent) but not genocide (if the intent is not conclusive). 
    - Scale: 5,000 is significant. Step 5 is satisfied.
    - Characterization: 
        - Genocide: Maybe, but with caution. The evidence of intent is circumstantial but strong. The procedure might allow genocide with a provisional note: "evidence strongly suggests genocidal intent". However, without direct evidence, it might be safer to call it a genocidal campaign.
        - What would move it up? A direct statement by a leader or an operational order. Even one speech or document would push it to genocide.
    - Graded decision: Given the evidence, it could be called a "genocidal campaign" with high confidence, or "genocide" with a qualified register ("indicative of genocide"). The attribution memo would note the absence of direct intent evidence and the inference from the pattern.

  *Case 3: Later phase of a campaign with a prior UN commission finding of genocide for an earlier phase. Current phase: fewer killings, but systematic child removal and destruction of water/food infrastructure.*
  - Can we inherit the UN finding? The procedure requires an independent check. We cannot rely solely on the UN because:
     - The situation may have changed.
     - Our credibility requires our own assessment.
     - However, the UN report is strong evidence for the earlier phase and for the overall intent.
  - Steps:
     - Group: Same as before (protected).
     - Acts: Child removal (forcibly transferring children) and destruction of infrastructure (deliberately inflicting conditions of life) are Article II acts.
     - Targeting: Likely continues (same group).
     - Intent: The prior UN finding is evidence of intent in the overall campaign. The current acts are consistent with that intent. We can use the UN report as evidence of intent, but we must check if the intent is still present. The shift in tactics (from killings to child removal and infrastructure) does not negate intent; it might show a different stage of genocide.
     - Scale: The current phase kills fewer but the acts are still significant (child removal and infrastructure destruction can destroy the group).
  - Characterization: 
     - Genocide: Yes, because the prior intent is established and the current acts are genocidal. We do not need to re-derive the entire finding; we can build on the UN report but verify that the current acts are part of the same campaign. The 48-hour deadline: Rely on the UN report for intent and the new evidence for the current acts.
     - Independent check: Verify that the UN commission was credible and that the current acts are documented. If the UN report is recent and the situation is continuous, it is reasonable to inherit the intent finding. The attribution memo would cite the UN report and the new evidence.
  - What if the UN report is old or contested? Then we must reassess intent. Under time pressure, we might use a provisional characterization.

  **Final Procedure Outline**:

  1. **Step 1: Protected Group?** 
     - Yes → Step 2.
     - No → Terminate genocide path; consider CAH or residual case (escalate for values conflict).

  2. **Step 2: Article II Acts?**
     - Yes → Step 3.
     - No → Terminate genocide and genocidal acts; consider CAH.

  3. **Step 3: Targeted as Such?**
     - Yes → Step 4.
     - No → Terminate genocide and genocidal campaign; consider genocidal acts or CAH.

  4. **Step 4: Intent to Destroy?**
     - Strong evidence → Step 5.
     - Some evidence → Genocidal campaign (or qualified genocide if other factors strong).
     - No evidence → Terminate genocide; consider genocidal acts or CAH.

  5. **Step 5: Scale/Significance?**
     - Sufficient → Genocide (with confidence level noted).
     - Insufficient → Genocidal campaign or acts.

  At each step, document evidence and gaps. If at any point evidence is absent (not contradicted), note it and proceed if possible, but if critical, terminate that path.

  After the steps, consider residual case if applicable.

  Then decide: name now (with graded term) or later (with triggers). Record in attribution memo.

  **Attribution Memo Template**:
  - Date, location, group.
  - Step 1: Group status (protected?).
  - Step 2: Acts present.
  - Step 3: Targeting evidence.
  - Step 4: Intent evidence.
  - Step 5: Scale/significance.
  - Graded characterization chosen.
  - Residual case considered? (Y/N and why)
  - Naming now or later? If later, triggers.
  - Attribution debt and downstream capture risks noted.
  - Asymmetry of errors considered.
  - External pressures noted.
  - Sign-offs: Researchers, legal advisor, executive director.

  This procedure provides structure, consistency, and auditability under tight deadlines.
answer: |-
  Below is a **Genocide Characterization Decision Procedure** designed for operational use by your team. It transforms the legal and conceptual structure you outlined into a step-by-step test with clear thresholds, exit points, evidence requirements, and graded outputs. The procedure prioritizes speed, consistency, and auditability while embedding your key constraints (e.g., time pressure, staffing, no retractions). It includes your requested graded vocabulary ladder, internal terms, and a "naming now vs. later" fork. The procedure is structured to force explicit reasoning at critical junctures, minimizing subjective leaps.

  ---

  ### **I. Core Components & Definitions**  
  **A. Graded Vocabulary Ladder** (Use in public statements; escalate as evidence strengthens):  
  1. **Crimes against humanity (CAH)**: Widespread/systematic attack against civilians (e.g., murder, deportation).  
  2. **Genocidal acts**: Acts under Genocide Convention Art. II (e.g., killing, child transfer, infrastructure destruction) **without proven intent** to destroy the group.  
  3. **Genocidal campaign**: Pattern of genocidal acts **with circumstantial evidence of intent** (e.g., inferred from patterns/context) but insufficient for genocide.  
  4. **Genocide**: Satisfies **all elements** of the Genocide Convention:  
     - Protected group (national, ethnic, racial, religious).  
     - Acts listed in Art. II.  
     - Acts target the group **"as such"** (not incidental).  
     - **Intent** to destroy, in whole or **"in part"** (scale/significance threshold met).  

  **Qualified/Provisional Language**: Use if evidence is directional but thin (e.g., "indicative of genocide," "potential genocidal campaign"). Triggers a "naming later" review.  

  **B. Internal Terms (Embedded in Procedure)**:  
  - **Attribution debt**: Credibility lost by naming early (e.g., using "genocidal campaign" prematurely). Recorded in attribution memo; must be "repaid" via higher evidence thresholds in future statements.  
  - **Downstream capture**: Risk that states/courts/advocates will co-opt the term for unrelated agendas. Mitigated by documenting evidence gaps in the attribution memo.  
  - **Asymmetry of the two errors**:  
    - **Under-naming cost**: Falls on current victims (delayed protection/justice). Favors erring toward stronger terms if evidence is directional.  
    - **Over-naming cost**: Falls on future victims (lost credibility) and enables downstream capture. Favors conservative terms if evidence is weak/contradicted.  
  - **Residual case**: Campaign fitting Lemkin’s concept (assault on group’s political/social/cultural continuity) but **not** the legal definition (e.g., targeting political groups, cultural destruction without biological destruction). Escalated to legal advisor as a "values conflict."  

  **C. Attribution Memo Requirement**:  
  - A **one-page template** (see Appendix) completed for every case, even if no statement is issued. Includes:  
    - Evidence used and gaps.  
    - Graded term chosen and why.  
    - Attribution debt/downstream capture assessment.  
    - "Naming now vs. later" justification and revisit triggers.  
  - Stored centrally for audits and consistency checks.  

  ---

  ### **II. Decision Procedure**  
  **Fixed Order of Steps**: Run sequentially. Exit early if a threshold fails. At each step:  
  - **Evidence standard**: "Sufficient" = **Two independent, credible sources** (e.g., eyewitnesses, satellite imagery, authenticated documents, UN reports).  
  - **Absence of evidence**: If evidence **does not exist** (not merely unavailable), proceed to next step but flag in memo. If **contradicted**, terminate or downgrade.  
  - **Values conflicts**: Escalate to legal advisor (e.g., residual cases, intent ambiguity, external pressure).  
  - **Time-saving rule**: Junior researchers complete Steps 1–4 in <12 hours. Step 5 and memo drafting by researchers + legal advisor (via async comms).  

  #### **STEP 1: PROTECTED GROUP?**  
  - **Question**: Is the group national, ethnic, racial, or religious?  
  - **Evidence required**: Demonstrable group identity (e.g., self-identification, census data, academic/historical sources).  
  - **Absence of evidence**: Terminate if group is political, linguistic, or cultural without overlap with protected categories. Proceed to residual case assessment (Step 5).  
  - **Exit**: If NO → Not genocide. Use CAH or genocidal acts if acts exist. Proceed to Step 5 for residual case check.  
  - **If YES → Proceed to Step 2**.  

  #### **STEP 2: GENOCIDE CONVENTION ACTS?**  
  - **Question**: Are any Art. II acts occurring? (Killing, serious bodily/mental harm, deliberate life conditions to destroy, preventing births, forcibly transferring children).  
  - **Evidence required**: Direct or circumstantial proof of ≥1 act (e.g., death tolls, infrastructure damage, child-removal records).  
  - **Absence of evidence**: If no evidence exists → Terminate for all genocide-related terms. Use CAH if applicable.  
  - **Exit**: If NO → Not genocide, genocidal acts, or campaign. Use CAH.  
  - **If YES → Proceed to Step 3**. Record acts for ladder placement.  

  #### **STEP 3: TARGETED "AS SUCH"?**  
  - **Question**: Are acts directed at the group **because of their identity** (not incidental)?  
  - **Evidence required**: Patterns (e.g., victim selection by group ID, discriminatory laws, slurs, geographic targeting).  
  - **Absence of evidence**: If no evidence exists → Downgrade to genocidal acts or CAH. Do not proceed to genocide.  
  - **Exit**: If NO → Not genocide or genocidal campaign. Use genocidal acts (if Art. II acts) or CAH.  
  - **If YES → Proceed to Step 4**.  

  #### **STEP 4: INTENT AND SCALE/SIGNIFICANCE?**  
  - **Substep 4.1: Intent to destroy the group?**  
    - **Question**: Is there intent to destroy the group (in whole or **"in part"**)?  
    - **Evidence required**:  
      - **Direct**: Orders, speeches, manifestos (e.g., "eliminate [group]").  
      - **Circumstantial**: Systematic patterns (e.g., targeting leaders/culture, dehumanizing rhetoric, escalation).  
    - **Absence of evidence**: If intent evidence does not exist → Terminate for genocide. Proceed to genocidal campaign if acts/targeting are strong.  
    - **Values conflict**: If intent is ambiguous (e.g., inferred but contested) → Escalate to legal advisor.  
  - **Substep 4.2: Scale or significance of "in part"?**  
    - **Question**: Is the scale (deaths/displacement) or significance (e.g., targeting vital group segment, cultural infrastructure) sufficient?  
    - **Thresholds**:  
      - **Scale**: "Significant part" = ≥1% of group killed/displaced, or ≥10,000 affected (adjust for group size; e.g., 500+ for small groups).  
      - **Significance**: Targeting leadership, cultural symbols, or survival infrastructure (e.g., food/water systems).  
    - **Absence of evidence**: If scale/significance unquantifiable → Use directional evidence (e.g., "calculated destruction of survival infrastructure").  
    - **Exit**: If NO → Not genocide. Use genocidal campaign.  
    - **If YES for both intent and scale → Proceed to Step 5**.  

  #### **STEP 5: RESIDUAL CASE & GRADED OUTPUT**  
  - **Residual case check**: Does the campaign fit Lemkin’s definition (political/social/cultural destruction) but fail legal criteria?  
    - **If YES → Values conflict**. Escalate to legal advisor. Public statement avoids "genocide" but uses terms like "group-destructive campaign" or "cultural erasure."  
  - **Assign graded term**:  
    | Conditions | Output Term | Qualified Language |  
    |------------|-------------|---------------------|  
    | Steps 1–4 fully met | Genocide | "Genocide" (unqualified) |  
    | Steps 1–3 met, Step 4 circumstantial | Genocidal campaign | "Strong indicators of genocide" |  
    | Steps 1–2 met, Step 3 weak/absent | Genocidal acts | "Genocidal acts amid broader violence" |  
    | Step 2 only | Crimes against humanity | "Crimes against humanity" |  
  - **Naming now vs. later fork**:  
    - **Name now**: If evidence is sufficient for chosen term (per above).  
    - **Name later**: If evidence is directional but thin (e.g., intent inferred but not proven).  
      - **Triggers to revisit**: New evidence of intent, scale escalation (e.g., 2x death toll), or shift in tactics (e.g., to child transfer).  
      - **Output**: Provisional term (e.g., "potential genocide") with public commitment to reassess. Record triggers in memo.  
  - **Asymmetry/downstream review**:  
    - **Under-naming risk high?** (e.g., ongoing killings) → Lean toward stronger provisional term.  
    - **Over-naming risk high?** (e.g., weak evidence, hostile governments) → Use conservative term, note attribution debt.  

  **Final Approval**: Executive director signs off on graded term and attribution memo. Memo archived for audits.  

  ---

  ### **III. Stylized Case Applications**  
  **Case 1: Linguistic Minority Campaign**  
  - **Facts**: Low hundreds dead; language banned; archives/sites destroyed; leaders killed/exiled.  
  - **Procedure Output**:  
    - Step 1: **NO** (linguistic group not protected). → Exit genocide path.  
    - Step 5: Residual case? **YES** (fits Lemkin: cultural/political destruction). → Values conflict escalated to legal advisor.  
    - Graded Term: **CAH** (for killings) + "**group-destructive campaign**" (for cultural assault).  
    - Where it forces your hand: Step 1 exit prevents "genocide." Strongest alternative: "Cultural annihilation and crimes against humanity targeting a minority, aimed at eradicating its existence."  
    - Naming Now/Later: **Name now** with above language. Attribution memo notes residual case and attribution debt if pressured to use "genocide."  

  **Case 2: Ethnic Killings in Mixed Province**  
  - **Facts**: ~5,000 dead in 4 months; ethnic selection; soldier slurs on video; government claims counter-insurgency.  
  - **Procedure Output**:  
    - Step 1: **YES** (ethnic group).  
    - Step 2: **YES** (killing = Art. II act).  
    - Step 3: **YES** (ethnic selection + slurs = targeting "as such").  
    - Step 4:  
      - Intent: **Circumstantial only** (pattern + slurs, but no orders/speeches). → Not genocide.  
      - Scale: **YES** (5,000 meets threshold).  
    - Graded Term: **Genocidal campaign** ("systematic killings targeting [group] with hallmarks of genocidal intent").  
    - **Key evidence to move up**: Direct proof of intent (e.g., military order stating "erase [group]," speech dehumanizing group).  
    - Naming Now/Later: **Name now**. Attribution memo flags asymmetry (under-naming risk high) and downstream capture risk.  

  **Case 3: Later Phase of UN-Certified Genocide**  
  - **Facts**: Earlier phase called genocide by UN commission; current phase: fewer killings, but child transfers + food/water destruction.  
  - **Procedure Output**:  
    - **Inherit UN finding?** **NO**—but use it as **evidence**. Procedure requires independent check for consistency.  
    - Step 1: **YES** (group protected, per UN).  
    - Step 2: **YES** (child transfer + infrastructure destruction = Art. II acts).  
    - Step 3: **YES** (inferred from UN report + ongoing acts).  
    - Step 4:  
      - Intent: **YES** (UN report proves intent for campaign; current acts align).  
      - Scale/Significance: **YES** (child transfer/infrastructure destruction = "significance" even with low deaths).  
    - Graded Term: **Genocide** ("ongoing genocide, manifesting in forced child transfers and engineered famine").  
    - **48-Hour Check**: Rely on UN report for intent + new field reports for acts. Attribution memo notes UN evidence and cross-references prior cases for consistency.  
    - Naming Now/Later: **Name now**.  

  ---

  ### **IV. What This Procedure Cannot Do**  
  1. **Resolve normative debates about the term "genocide"**:  
     - The procedure **presumes the Genocide Convention definition is binding** for legal characterization. It cannot adjudicate whether the term should be broader (e.g., include political groups). Residual cases are flagged but not called genocide.  

  2. **Handle competitive victimhood dynamics**:  
     - If advocates demand symmetrical language for another group, the procedure **requires independent evidence review per the steps**. The attribution memo must state: "Asymmetry in terms reflects asymmetry in evidence—not bias." Consistency is enforced via archived memos (auditable for double standards).  

  3. **Neutralize donor/government pressure**:  
     - The procedure **documents pressure** (e.g., "Donor X advocated for/against 'genocide'") in the attribution memo but does not accommodate it. Values conflicts (e.g., host state threats) are escalated to the legal advisor/executive director. The output must still follow evidence.  

  4. **Eliminate subjective judgment entirely**:  
     - Intent inference (Step 4) and residual cases (Step 5) require human escalation. The procedure ensures this is **explicit, time-bound, and recorded**.  

  5. **Guarantee universal consensus**:  
     - Downstream capture is inevitable once the term is used. The procedure **mitigates this by conservative thresholds** and documenting evidence gaps.  

