prompt: |-
  Hi — I'm a science journalist trying to figure out whether "memes" were ever anything more than a cute metaphor for stuff that spreads, and I keep going in circles. A few weeks ago I was at a dinner after a cultural evolution workshop in Ljubljana and got into it with an anthropologist who said the whole framework collapses because most cultural variants have no lineage you could draw: a recipe you half-remember from your grandmother and half from a video you saw last Tuesday has no single parent. A friend who studies sound trends on short-video apps says the same thing harder — there the things visibly graft onto each other, one clip spliced into another, so whatever "reproduction" is doing it isn't cleanly splitting into two copies. I've started calling that the grafting problem so I have something to call it, and I've got a second worry I half-invented a name for: the vacant-host problem, where a variant thrives while the people carrying it most intensely do measurably worse, which makes the whole "what is it for the variant to be fit" question feel like it has no answer. Meanwhile I keep hearing the opposite complaint, that the framework is fine but empty: people gesture at fidelity, fecundity and longevity as the conditions something has to meet to count as a replicator and then never cash any of it out into anything a fieldworker could go and measure.

  So I want the spec, not the scorecard. Please take the role of a philosopher of biology who has actually spent years on this, and do some genuine brainstorming before you commit — I can get the four safe bullet points anywhere and I don't want them. Here's the question: what would a genuinely Darwinian theory of culture have to deliver to be worth building a research programme on, where "worth building on" means it tells an empirical team what to measure and can say in some case that culture is *not* evolving in the relevant sense? You should assume I've read the pop versions and skip them, skip any "as so-and-so argued in 19XX" moves entirely (no citations, no bibliography, nobody can check them here and I want the arguments), and don't lean on the famous lost-technology cases — they're contested enough that they'd just let you dodge the hard part. Give me exactly five numbered items, no intro and no sign-off: four desiderata, each stated with the concrete phenomenon or case that makes it a requirement — ideally something I could point at in a news story — plus a tag for whether it's non-negotiable or just a preference of one camp; and a fifth item naming the pair of desiderata you think can't be jointly satisfied and why, since that tension is the bit my editor will actually like. Two or three sentences per item, and be blunt if you think the honest verdict is that the list as a whole can't be met.
reasoning: |-
  Alright, let's tackle this. The user is a science journalist struggling with the validity of memes as a Darwinian framework for cultural evolution. They mentioned two main problems: the grafting problem (cultural variants with no clear lineage) and the vacant-host problem (variants thriving while harming their hosts). They also point out that current frameworks are seen as too vague, lacking measurable criteria.

  First, I need to address what a genuinely Darwinian theory of culture must deliver. The user wants five items: four desiderata with concrete examples and a fifth highlighting conflicting desiderata. They’re tired of superficial bullet points and want actionable, empirical measures.

  Desideratum 1: Lineage Traceability. The anthropologist's point about recipes mixing sources (grafting problem) means we need traceable lineages. Without this, you can't apply phylogenetic methods. So, a non-negotiable requirement is observable inheritance with clear ancestry. Example: tracing a TikTok dance move through remixes, but if edits are too chaotic, lineage blurs.

  Desideratum 2: Variant Fidelity. Cultural variants must retain core traits across transmissions. If a meme mutates beyond recognition in each share, fidelity is low. News example: a conspiracy theory morphing so much that the original claim is lost. This is non-negotiable for selection to act on heritable traits.

  Desideratum 3: Host-Independent Fitness Metrics. Vacant-host problem shows that cultural success doesn't always benefit the host. Need measurable fitness separate from host welfare. Example: viral challenges that harm participants but spread widely. Non-negotiable because without this, you can't define cultural fitness.

  Desideratum 4: Quantifiable Selection Pressures. Researchers must measure what influences cultural spread. Example: tracking how algorithm changes affect meme propagation. Non-negotiable for empirical testing.

  Conflict: Lineage Traceability vs. Host-Independent Fitness. In digital culture, lineage is traceable (desideratum 1), but fitness is tied to platform algorithms (desideratum 3). However, algorithms are part of the environment, not independent. If fitness depends on external tech, it's not host-independent. But if we redefine the host as the platform, that might not align with biological analogy. This tension makes it hard to satisfy both in practice.

  The user’s deeper need is to resolve whether a Darwinian framework is feasible for culture. They need clear criteria to evaluate claims and identify when culture isn’t evolving Darwinianly. Highlighting the conflict shows the framework's limits, which is crucial for their article.
answer: |-
  1.  **Lineage Traceability (Non-negotiable):** The theory must provide a method to empirically identify *heritable continuity* for specific cultural variants across transmissions, even amidst blending. It must distinguish genuine descent (e.g., a specific chord progression passed down with identifiable modification) from independent reinvention or convergent evolution (e.g., similar tools appearing in isolated cultures). *Concrete Case:* Tracing the evolution of a specific knitting stitch pattern through online tutorials and craft circles, showing modification chains, versus the independent invention of a visually similar stitch by multiple beginners. Without this, the "grafting problem" (your recipe example) dissolves the core requirement of descent with modification.

  2.  **Quantifiable Fidelity & Variation (Non-negotiable):** It must define and enable measurement of the *core, heritable features* of a cultural variant and the *fidelity* of their copying across transmissions, alongside measurable rates and types of *variation* introduced. This distinguishes high-fidelity replication (e.g., reciting a specific folk tale verbatim) from transformative reinterpretation where the "variant" loses its identity (e.g., a news story evolving into unsubstantiated rumor). *Concrete Case:* Tracking changes in the specific wording and core claims of a political slogan shared across social media platforms, measuring drift versus intentional high-fidelity sharing.

  3.  **Host-Independent Fitness Metric (Non-negotiable):** The theory must define "fitness" for cultural variants *operationally and independently* of the biological fitness or well-being of the hosts carrying them. Fitness must be a measurable property of the *variant's* ability to spread and persist *in the cultural environment*. *Concrete Case:* Measuring the spread and persistence of a viral dance challenge *despite* documented increases in participant injuries ("vacant-host problem"). Fitness is the challenge's contagiousness, not the dancers' health.

  4.  **Quantifiable Selection Pressures (Preference, but critical for empirical programme):** The theory must identify and enable measurement of *specific environmental pressures* (social, technological, cognitive, economic) that *differentially* affect the replication success of competing cultural variants. It needs to move beyond vague "popularity" to show *why* variant A outcompetes variant B in context X. *Concrete Case:* Measuring how changes in a platform's recommendation algorithm demonstrably favor conspiracy-laden news snippets over fact-checked ones, creating a measurable selection pressure for sensationalism.

  5.  **The Fundamental Tension:** **Lineage Traceability (1) vs. Host-Independent Fitness (3).** Digital culture provides clear lineage data (1) through remix chains and version histories. However, the fitness (3) of a digital variant (e.g., a meme format, audio clip) is overwhelmingly determined by *algorithmic selection pressures* (part of the "environment"). If the "host" is merely the vehicle for algorithmic exposure, the variant's fitness isn't truly independent of the *digital platform's* "metabolism" and goals, which operate on entirely non-biological principles. Defining fitness independently becomes nearly impossible when the selection environment is an artificial, goal-directed system (the algorithm) optimizing for engagement, not biological replication. The very clarity of lineage in digital grafts makes the non-biological nature of the selection pressures starkly apparent, undermining the biological analogy's core.
