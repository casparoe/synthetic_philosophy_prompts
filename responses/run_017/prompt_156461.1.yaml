  ### Translation of IIT Claims into Dynamical Systems/Information Theory Vocabulary

  **Core IIT Claims Restated:**
  1. **Cause-effect power**: A substrate in a specific state defines a point in a high-dimensional state space. Its causal structure is characterized by interventional conditional probability distributions (TPM) over state transitions. "Cause" corresponds to the set of past states that minimally constrain the current state under uniform interventions; "effect" is the set of future states reachable under natural dynamics. This defines an intrinsic vector field in state space.

  2. **Complexes & Exclusion**: A complex is a subset of units whose joint dynamics maximize *dynamical irreducibility*—quantified by φ, which measures the minimal KL divergence between the true interventional transition distribution and the product of partitioned distributions over all possible bipartitions. The exclusion principle selects the φ-maximizing subset, discarding overlapping candidates.

  3. **Consciousness quantity/quality**:  
     - *Quantity (Φ)*: φ of the complex, interpreted as the degree of state-dependent feedback complexity.  
     - *Quality*: The set of minimal sufficient statistics ("distinctions") for predicting system evolution across all possible purviews (subsets of units). These form an *attractor skeleton*—a directed graph of metastable states and transitions that defines the system's coarse-grained dynamics.  

  4. **Architectural commitments**:  
     - Recurrent networks maximize φ by enabling state-dependent feedback that collapses under partitioning.  
     - Feedforward systems minimize φ due to separable dynamics.  
     - Posterior cortex prioritizes slow, identifiable latent variables; cerebellum lacks feedback loops for integration.  

  ---

  ### Analysis of Your Toy System: Ring Attractor + Feedforward Expansion
  - **System**: 64-unit ring attractor (continuous $S^1$ symmetry, global inhibition) → 512-unit feedforward layer → behavior.
  - **Latent dynamics**: Ring has 1D circular latent $\theta$ with slow drift; feedforward layer is slaved to $\theta$ with no internal dynamics.

  #### IIT Prediction (Translated):
  1. **Cause-effect power**:  
     - Ring: High φ due to symmetry-breaking transitions. Partitioning disrupts lateral excitation, destroying the attractor geometry.  
     - Feedforward layer: φ ≈ 0. States lack intra-layer causal coupling; partitions induce minimal KL divergence loss.  
     - Full system: φ dominated by ring. Feedforward units add no irreducible information because they're functionally dependent on $\theta$.

  2. **Complex identification**:  
     - Ring is the complex (maximal φ). Feedforward layer is excluded (lower φ than ring alone when normalized per unit).  
     - Quality: Circular manifold of metastable states (fixed points at each $\theta$) with transitions defined by noise/drift.

  3. **Exclusion principle**: Overlapping complexes (e.g., ring + subset of feedforward units) discarded—φ decreases when feedforward units are added due to dilution of integration.

  #### Dynamical Systems/Info-Theoretic View:
  - **Identifiable latents**: Only $\theta$ is identifiable and necessary for prediction. Feedforward layer is a redundant embedding of $\theta$.  
  - **Interventions**: Perturbing $\theta$ alters global behavior; perturbing feedforward units has no effect on ring dynamics.  
  - **Timescales**: Ring exhibits slow dynamics (long autocorrelation); feedforward layer has instantaneous dependence.  
  - **Coarse-graining**: Ring dynamics survive coarse-graining; feedforward units decouple under noise.  
  - **Information geometry**: Ring has high Fisher information for $\theta$; feedforward layer has flat geometry (no curvature).  

  #### Where Translations Diverge:
  - **Agreement**: Both frameworks identify the ring as the critical substrate due to feedback, slow variables, and robustness.  
  - **Disagreement**:  
    - IIT penalizes the feedforward layer for lacking *intrinsic* causal power, even if it encodes $\theta$ efficiently.  
    - Your framework sees the feedforward layer as *extrinsically* valuable (e.g., for decoding), but IIT dismisses this as observer-dependent.  
    - IIT’s φ depends on exhaustive partition search; your latent analysis requires no such combinatorics.  

  ---

  ### Residue Report
  #### 1. Fudges in Translation
  - **Intrinsicality**: Correctly identified as the breaking point. Your framework requires an observer-defined intervention set or decoder. IIT’s "for-itself" causality assumes:  
    - A fixed Markov blanket (units are predefined).  
    - Maximum entropy over external variables (no "task" context).  
    This becomes circular when defining the system boundary.  

  - **Partition search**: No equivalent in your workflow. You use:  
    - Dimensionality reduction to find minimal sufficient latents.  
    - Robustness to noise (not partitions) to determine relevance.  
    IIT’s brute-force partitioning is isomorphic to testing every possible coarse-graining—but it’s computationally intractable and unit-dependent.  

  #### 2. Literally Unsayable in Your Framework
  - **Quality of consciousness**: Your vocabulary lacks resources to express the *phenomenal structure*. Specifically:  
    - IIT’s "distinctions" are *atomic causal units* that combine into a state-dependent topology. This is claimed to be isomorphic to experience.  
    - Your closest analog—attractor skeletons—describe dynamics, not subjective structure. Phase space geometry doesn’t specify "what it’s like."  
    - *Counterargument*: If you accept that attractor skeletons *are* the structure of consciousness, this collapses the gap. But IIT insists they’re distinct.  

  #### 3. Verdict on the Residue
  - **What survives translation**:  
    - The claim that feedback/recurrence enables consciousness (via robust, slow latents).  
    - Exclusion of feedforward systems (due to separable dynamics).  
    - Posterior cortex > cerebellum alignment.  
    **This is the falsifiable core you already accept.**  

  - **What doesn’t survive**:  
    - Intrinsicality: Vanishes without observer-relative grounding.  
    - Quality: Remains ineffable in state-space terms.  
    - φ-as-consciousness: No mapping to any information-theoretic invariant (e.g., mutual info, transfer entropy).  

  - **The sharp residue**: IIT’s unique contribution is its *phenomenal realism*—the claim that causal structures literally *are* consciousness. This is untranslatable because:  
    - It conflates physical causality with subjective experience.  
    - Your framework rejects axioms like "cause-effect power = phenomenology."  
    **The hand-wavy part is intrinsic-ness; the substantive part is the architectural claim (which isn’t unique to IIT).**  

  #### Third Option: Missed Boundary
  The boundary isn’t at intrinsicality—it’s at **counterfactual depth**. IIT evaluates *all possible state transitions* (via perturbations), while your analyses use *observed* trajectories. This makes φ a measure of *potential* dynamics, not just actual ones. But in practice, this reduces to fitting a TPM, which you already do via model fitting. No new information emerges.  

  **Final verdict**: IIT’s residue is the *phenomenal binding claim*—that Φ measures "subjective irreducibility." Your framework can describe the same circuits but remains silent on why they "feel like something." What survives is a circuit-level hypothesis; what evaporates is the consciousness ontology.
