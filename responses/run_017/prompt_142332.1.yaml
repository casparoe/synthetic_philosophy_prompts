  ### Bottom Line
  Reject step (4): it equivocates by conflating a *metaphysical* difference in phenomenal character with *subjective discriminability*.

  ### Analysis Table
  | Step | The Move                                                                 | Verdict                  | Why It Looked Innocent                                                                 | What You Pay                                                                 |
  |------|--------------------------------------------------------------------------|--------------------------|----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | (1)  | Defines metaphysical disjunctivism (MD): veridical/hallucination differ fundamentally. | Keep                    | Standard MD definition; core commitment of naive realism.                              | Accepts MD’s core claim.                                                    |
  | (2)  | If X is constitutive of E, then E without X has different phenomenal character. | Keep (with MD)         | Logical: if constitutives differ, properties differ.                                     | Commits MD to phenomenal difference.                                        |
  | (3)  | ∴ Hallucination cannot match perception’s phenomenal character.          | Keep (with MD)         | Follows from (1)+(2).                                                                  | Denies phenomenal commonality.                                             |
  | (4)  | Difference in phenomenal character → subject can discriminate "from inside". | **Reject**              | Seems intuitive ("how it seems" = what’s accessible).                                   | **Overreach**: ignores cognitive limits; implies implausible discriminability (e.g., for knowledge). |
  | (5)  | ∴ Subject can always tell perception from hallucination.                 | Reject (collapses with (4)) | Appears to follow from (3)+(4).                                                        | False if (4) fails; denies datum of indistinguishability.                  |
  | (6)  | Indistinguishable hallucinations exist (e.g., Macbeth).                  | Keep                    | Empirical datum; foundational to debate.                                               | Must be explained by any theory.                                           |
  | (7)  | ∴ Disjunctivism is false.                                                | Reject (invalid)        | Depends on (4)-(5).                                                                    | —                                                                           |
  | Gen. | Apply (1)-(5) to externally fixed states (e.g., knowledge).               | Reject (via (4))        | Tests consistency: exposes (4)’s flaw.                                                 | Proves too much (e.g., "always tell knowledge from belief" is absurd).      |

  ### Disjunctivism After the Dust Settles
  **Metaphysical disjunctivism survives by rejecting epistemic disjunctivism.** The naive realist accepts (1)–(3) but denies (4): veridical/hallucinatory experiences differ *metaphysically* (due to object-constitution), yet may remain *subjectively indistinguishable* because phenomenal character ≠ discriminability. Hallucinations are explained as *non-relational* states that *seem identical* to relational perceptions due to cognitive limitations. This preserves naive realism for veridical cases while accommodating (6): the hallucinator’s experience is a *sui generis* mental event that misrepresents itself as relational, without sharing perception’s structure. Biting the bullet on (5) is unnecessary and avoidable.  

