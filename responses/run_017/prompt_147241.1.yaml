  Below is a decision tree designed for your workshop. It meets all specified constraints: no theory labels, concrete cases only, ≤8 branch nodes, 5–7 leaves, with the first three branches focusing on evidence diagnostics and gradedness. The tree incorporates the three required cases (marker dissociation, collective subject, fixed pain behavior) and outputs verdict profiles for the nine taxa. Combinations that yield no coherent position are noted.

  ---

  ### **Decision Tree for Animal Consciousness Classification**

  **Branch 1 (Evidence Priority):**  
  *If you observed an animal with **no vertebrate-like brain structures** (e.g., no cortex/pallium homolog) but it **learned to avoid a harmful stimulus, reversed avoidance when given painkillers, and traded pain for rewards**, would this convince you it is conscious?*  
  - **Yes** → Go to Branch 2A.  
  - **No** → Go to Branch 2B.  

  **Branch 2A (Handling Marker Conflicts):**  
  *If an animal has **strong behavioral markers of pain** (as above) but **lacks any neural structures you consider important**, is it conscious?*  
  - **Yes** → Conscious based on behavior alone. Go to Branch 3.  
  - **No** → Conscious only with neural structures. Go to Branch 3.  

  **Branch 2B (Alternative Evidence):**  
  *If an animal **shows no behavioral markers of pain** (e.g., no avoidance learning or trade-offs) but has **complex vertebrate-like brain structures**, is it conscious?*  
  - **Yes** → Conscious based on neural structures alone. Go to Branch 3.  
  - **No** → Go to Branch 4.  

  **Branch 3 (Graded vs. All-or-Nothing):**  
  *Can an animal be **partially conscious** (e.g., capable of feeling pain but not complex emotions), or is consciousness **always all-or-nothing?***  
  - **Graded** → Go to Branch 5.  
  - **All-or-nothing** → Go to Leaf assignments.  

  **Branch 4 (Fixed Pain Behavior Case):**  
  *An animal **always withdraws from a harmful stimulus** (e.g., heat) in a way identical to pain behavior, but **never learns to avoid it** (e.g., doesn’t change response over time). Is it conscious of pain?*  
  - **Yes** → Go to Branch 6.  
  - **No** → Go to Leaf assignments.  

  **Branch 5 (Collective Subject Case):**  
  *A **siphonophore colony** (a marine organism with specialized, physically connected zooids) shows **coordinated, learning-based behaviors** at the group level (e.g., collective foraging trade-offs), but **individual zooids lack complex brains or learning**. Is the *colony* conscious?*  
  - **Yes** → Go to Leaf assignments.  
  - **No** → Go to Leaf assignments.  

  **Branch 6 (Skepticism Check):**  
  *After seeing all evidence types, could you **imagine any observation** that would conclusively prove a non-human animal is conscious?*  
  - **Yes** → Go to Leaf assignments.  
  - **No** → Go to Leaf assignments.  

  ---

  ### **Leaves (Positions) and Their Profiles**  
  Each leaf includes:  
  - **Name** (or "unnamed").  
  - **Characterization**.  
  - **Awkward commitment** (the position’s controversial implication).  
  - **Verdict profile** for the 9 taxa:  
    - ✔️ = conscious, ❌ = not conscious, ? = ambiguous/undecidable.  

  #### **Leaf 1: Neural Homology View**  
  - *Characterization:* Consciousness requires a vertebrate-like brain structure (e.g., pallium/cortex or functional homologue), regardless of behavior.  
  - *Awkward commitment:* Octopuses (despite complex cognition) cannot be conscious because they lack the "right" neural blueprint.  
  - **Profile:**  
    - Honeybee: ❌  
    - Octopus: ❌  
    - Decapod crab: ❌  
    - Teleost fish: ❌ (unless pallium homolog is accepted)  
    - Reptile: ✔️ (pallium present)  
    - Bird: ✔️  
    - Insect larva: ❌  
    - Bivalve: ❌  
    - Nematode: ❌  

  #### **Leaf 2: Flexible Aversion Sufficiency**  
  - *Characterization:* Any animal showing flexible aversive learning (reversible by analgesics + trade-offs) is conscious; neural structures are irrelevant.  
  - *Awkward commitment:* A robot with identical behavior would be conscious.  
  - **Profile:**  
    - Honeybee: ✔️  
    - Octopus: ✔️  
    - Decapod crab: ✔️  
    - Teleost fish: ✔️  
    - Reptile: ✔️  
    - Bird: ✔️  
    - Insect larva: ❌ (lacks flexible learning)  
    - Bivalve: ❌  
    - Nematode: ❌  

  #### **Leaf 3: Global Skepticism**  
  - *Characterization:* Consciousness in non-humans is in principle undecidable; no evidence is conclusive.  
  - *Awkward commitment:* Even if animals "scream" in pain and beg for help, we cannot know they feel anything.  
  - **Profile:**  
    - *All taxa:* ? (undecidable)  

  #### **Leaf 4: Gradualist Multidimensional**  
  - *Characterization:* Consciousness exists on a spectrum across multiple dimensions (e.g., neural complexity, behavioral flexibility, integrative capacity).  
  - *Awkward commitment:* Bivalves or nematodes have "micro-consciousness," even if minimally.  
  - **Profile:**  
    - Honeybee: ✔️ (moderate)  
    - Octopus: ✔️ (high)  
    - Decapod crab: ✔️ (moderate)  
    - Teleost fish: ✔️ (moderate)  
    - Reptile: ✔️ (high)  
    - Bird: ✔️ (high)  
    - Insect larva: ✔️ (low)  
    - Bivalve: ✔️ (very low)  
    - Nematode: ✔️ (very low)  

  #### **Leaf 5: Fixed Behavior Exclusion**  
  - *Characterization:* Fixed, non-updatable pain responses (even if identical to conscious pain behavior) are unconscious reflexes; learning capacity is essential.  
  - *Awkward commitment:* An animal with a severe learning disability might not feel pain.  
  - **Profile:**  
