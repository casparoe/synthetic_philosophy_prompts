  ### **Notes on Unoccupied Combinations & Indistinguishable Profiles**  
  - **Incoherent combination:** Answering "Yes" to Branch 2A (behavior alone suffices) but "No" to Branch 4 (fixed pain behavior implies consciousness). This requires learning for consciousness *except* when behavior is dissociated from learning—logically inconsistent.  
  - **Unattractive combination:** "No" to Branch 1 (dissociation unconvincing) → "Yes" to Branch 2B (neural structures alone suffice) → "Graded" in Branch 3. This implies bivalves could be "a little conscious" without behavior, which few hold.  
  - **Unexplored combination:** "Yes" to Branch 5 (collective consciousness) but "No" to Branch 6 (no evidence possible). Collectives are rarely discussed by skeptics.  
  - **Indistinguishable profiles:**  
    - **Neural Homology** and **Fixed Behavior Exclusion** *both* yield identical profiles for the 9 taxa.  
    - **Gradualist Multidimensional** and **Flexible Aversion Sufficiency** *both* say "conscious" for honeybees, octopuses, crabs, fish, reptiles, and birds—differing only on larvae/bivalves/nematodes.  

