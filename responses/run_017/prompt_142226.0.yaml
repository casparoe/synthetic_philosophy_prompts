  ### Part 1: Restating the dispute in your vocabulary

  **The Principle: Identity of Indiscernibles (Leibniz's Principle)**
  - In philosophy: If two things have exactly the same properties (both intrinsic and relational), then they are identical (i.e., they are one and the same thing).
  - In your terms: If two entities have the same state (i.e., their deep equality check passes because all properties, including position, velocity, etc., are identical), then they are the same entity and should be stored as one record (deduped via content-addressing).

  **The Two-Sphere Counterexample:**
