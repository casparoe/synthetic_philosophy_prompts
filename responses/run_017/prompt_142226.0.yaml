  hey, I'm a backend dev with basically no philosophy background (one undergrad logic class, mostly forgot it). I'm building a small deterministic physics sandbox in my free time — a few hundred rigid bodies in a closed 3-torus world, wrap-around at the edges — and I store entities content-addressed: hash an entity's full state (position, velocity, mass, material, everything) and use that hash as its key, so two entities with identical state get deduped into one record and come back as one object on load. A friend who did a philosophy minor says this quietly commits me to the "identity of indiscernibles," and mentions a famous counterexample: two spheres in an otherwise empty universe, exactly alike, differing in no intrinsic or relational property, but supposedly still two things. I sort of get the shape of it but I want it in my own terms.

  So: (1) restate the whole dispute — the principle, the two-sphere case, and the strongest replies on each side, including the move where each sphere is said to have the property of being identical to that very sphere, so the two end up "weakly discernible" after all — in the vocabulary I actually use: value vs reference semantics, deep equality, structural sharing / hash-consing, content-addressed storage and dedup, opaque UUIDs that carry zero information about state, and symmetric configurations in a simulated world. Please flag anywhere the translation is smuggling something in. (2) Then a residue report: what has no counterpart in my vocabulary at all, and is that because my vocabulary is missing something real (a design decision I didn't know I was making, something the sandbox genuinely can't represent) or because the philosophers' disagreement is thinner than it sounds? And the part I actually care about: should I keep deduping by hash, or switch to opaque ids — what concretely breaks either way, especially once a player builds two identical objects that seem to differ only in being two of them?
