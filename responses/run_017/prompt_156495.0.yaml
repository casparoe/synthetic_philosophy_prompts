prompt: |-
  Hey — I referee for a small interdisciplinary journal (philosophy + cog sci) and maybe one paper in three rests most of its weight on a thought experiment: a trolley variant, an overnight violinist hookup, a neuron-by-neuron brain swap told as a slow ladder. I want a checklist I can actually run in ~15 minutes to decide whether the case is doing real work or just pumping an intuition, and what to put in the report when it's the latter (let it stand / needs a minimal-pair sibling / illustrative only / not fixable in a revision).

  Three failure modes I keep suspecting and want handled: filler-flip, where the reader silently fills the unstated background in from the actual world so two readers are running different cases (test: invert the defualt filler and see if the verdict flips); ramp pumps, where every step of a graded series looks fine and only the endpoint gets rejected (test: shuffle the steps, or skip straight to the end); and self-certifying description, where the case is told using the very term under dispute. Add any mode I'm missing, mark which checks are genuine requirements and which are just one camp's prejudice, and flag the points where it has to hand the decision to a human because it's a values or judgement call.

  Run it on those three cases, plus the colour scientist in the black-and-white room — I think that last one is genuinely persuasive, so if the procedure kills it say so plainly rather than letting it slide. My co-editor signs off on the report, so note which steps she can spot-check quickly. And be honest about what the procedure can't tell me.
reasoning: |-
  We are creating a checklist to evaluate thought experiments in philosophy and cognitive science papers. The goal is to determine if the thought experiment is doing real work or just pumping an intuition, and to provide recommendations for the report.

  The checklist should be runnable in about 15 minutes and should cover the following failure modes:
  1. Filler-flip: The reader fills in unstated background from the actual world, leading to different interpretations. Test: invert the default filler and see if the verdict flips.
  2. Ramp pumps: A graded series where each step seems fine but the endpoint is rejected. Test: shuffle the steps or skip to the end.
  3. Self-certifying description: The case is described using the very term under dispute.

  Additionally, we should consider other potential failure modes.

  The checklist should:
  - Mark which checks are genuine requirements vs. one camp's prejudice.
  - Flag points that require human judgment (values or judgment call).

  We'll test the checklist on:
  1. Trolley variant
  2. Overnight violinist hookup
  3. Neuron-by-neuron brain swap (slow ladder)
  4. Color scientist in the black-and-white room (which is considered genuinely persuasive)

  Finally, note which steps the co-editor can spot-check quickly and be honest about the limitations.

  ---

  **Checklist for Thought Experiments**

  **Step 1: Identify the Claim**
  - What is the main claim the thought experiment is supposed to support?
  - What is the role of the thought experiment in the argument? (e.g., counterexample, illustration, proof of possibility)
  - *Human judgment:* Requires understanding the paper's argument. Co-editor can spot-check by reading the surrounding paragraph.

  **Step 2: Check for Filler-Flip**
  - Are there unstated background assumptions that readers might fill in differently?
  - *Test:* Invert the default filler (e.g., change a detail to its opposite) and see if the intuitive verdict flips.
  - *Requirement:* Genuine requirement for robustness. If flipping a filler changes the verdict, it's a problem.
  - *Human judgment:* Deciding which fillers are critical and inverting them requires some creativity. Co-editor can quickly check if the test was applied and if the result is reported.

  **Step 3: Check for Ramp Pumps (for graded series)**
  - If the thought experiment involves a gradual series (e.g., slow ladder), does the author rely on the step-by-step progression?
  - *Test:* 
    a. Shuffle the steps: see if the outcome is the same regardless of order.
    b. Skip to the end: present the endpoint without the ramp and see if the intuition holds.
  - *Requirement:* Genuine requirement. If the endpoint is rejected without the ramp, then the ramp may be manipulating intuition.
  - *Human judgment:* Deciding how to shuffle or skip steps. Co-editor can quickly see if the test was done and the result.

  **Step 4: Check for Self-Certifying Description**
  - Does the description of the thought experiment use the contested term or concept in a way that presupposes the conclusion?
  - *Test:* Replace the contested term with a neutral description and see if the intuition remains.
  - *Requirement:* Genuine requirement. If the intuition depends on the loaded term, the thought experiment is circular.
  - *Human judgment:* Identifying the contested term and creating a neutral replacement. Co-editor can spot-check by looking for the contested term in the description.

  **Step 5: Other Failure Modes**
  - *Missing Mode 1: Unrealistic or Incoherent Scenario*
    - Is the scenario impossible or so far from reality that intuitions are unreliable?
    - *Test:* Check for internal coherence and consistency with known laws (physical, logical). If it's impossible, it might not be informative.
    - *Requirement vs. Prejudice:* This can be controversial. Some think intuitions about impossible cases are valid (e.g., in metaphysics), others don't. Flag as a judgment call.

  - *Missing Mode 2: Biased Framing*
    - Is the thought experiment described in a way that emotionally biases the reader?
    - *Test:* Rephrase the scenario in neutral or opposite emotional terms and see if the intuition changes.
    - *Requirement vs. Prejudice:* Partly a requirement (to avoid emotional manipulation), but also a matter of style. Judgment call.

  - *Missing Mode 3: Lack of Dialectical Force*
    - Does the thought experiment address the actual opposing views, or is it set up to beat a straw man?
    - *Test:* Compare the scenario to the actual positions in the literature. Does it engage with the strongest counterarguments?
    - *Requirement:* Genuine requirement for good argumentation. However, this might take more time to check.

  **Step 6: Overall Assessment**
  - Based on the above, decide:
    - **Real work**: The thought experiment is robust and essential to the argument.
    - **Pumping intuition**: The thought experiment is doing little more than eliciting an intuition without substantial support.

  **Recommendations for the Report:**
  - **Let it stand**: No issues found.
  - **Needs a minimal-pair sibling**: The thought experiment is vulnerable to filler-flip or framing issues; add a contrasting case to clarify.
  - **Illustrative only**: The thought experiment is not doing heavy argumentative work and should be presented as an illustration.
  - **Not fixable in a revision**: The thought experiment is fundamentally flawed.

  **Limitations:**
  - Cannot resolve deep philosophical disagreements (e.g., the validity of intuitions).
  - Cannot replace domain expertise; some checks require familiarity with the literature.
  - The 15-minute limit might not allow for in-depth analysis of every step.

  ---

  **Testing the Checklist on the Cases**

  **1. Trolley Variant (e.g., standard switch vs. fat man)**
  - *Claim:* That there is a moral difference between killing as a side effect and killing as a means.
  - *Filler-flip:* Invert filler? For example, what if the one person on the side track is a criminal and the five are heroes? The verdict might flip for some. So, filler-flip test shows sensitivity -> problem.
  - *Ramp pumps:* Not a graded series, so skip.
  - *Self-certifying:* The term "killing" might be contested. Neutral: "causing death". Does the intuition hold? Probably, so not self-certifying.
  - *Other:* Framing might be an issue (emotional description). Rephrase neutrally: "diverting a threat" vs. "using a person as a barrier". Intuition might change? 
  - *Assessment:* Vulnerable to filler-flip and framing. Might need a minimal-pair sibling to control for these.
  - *Recommendation:* Needs a minimal-pair sibling.

  **2. Overnight Violinist Hookup (Judith Jarvis Thomson)**
  - *Claim:* That abortion is permissible even if the fetus is a person, because you are not obligated to sustain another with your body.
  - *Filler-flip:* Invert filler? What if the violinist is your child? Or if the hookup is for 9 months instead of 9 hours? Verdict might flip -> problem.
  - *Ramp pumps:* Not graded.
  - *Self-certifying:* The term "person" is contested, but the description is neutral. Replace "person" with "individual"? Intuition holds.
  - *Other:* Framing: the scenario is emotionally charged. Neutral rephrasing? Might reduce emotional impact and change intuition.
  - *Assessment:* Vulnerable to filler-flip and framing. Often criticized for being unrealistic.
  - *Recommendation:* Needs a minimal-pair sibling (e.g., a case that varies the relationship or duration).

  **3. Neuron-by-Neuron Brain Swap (Slow Ladder)**
  - *Claim:* Personal identity is not preserved in such swaps, or that it challenges theories of identity.
  - *Filler-flip:* What if the swap is done in a way that preserves continuity? Or if the original is destroyed? Verdict might depend on background assumptions.
  - *Ramp pumps:* Test: Shuffle the steps? If you swap half the brain at once, is the outcome the same? Probably not. Skip to the end: If you present the endpoint (a full swap) without the ramp, do people still reject identity? Maybe yes, so the ramp might not be pumping. But if without the ramp they accept identity, then the ramp is manipulating.
  - *Self-certifying:* The term "identity" is contested. Use neutral terms: "same person" vs. "different person". The intuition might not hold without the term?
  - *Other:* Coherence: Is the scenario possible? Some might argue it's incoherent (e.g., with theories of identity). Judgment call.
  - *Assessment:* Ramp pumps test might show that the endpoint alone is rejected, so the ramp is not pumping. But filler-flip might be an issue.
  - *Recommendation:* Let it stand or illustrative only? Since it's a classic, maybe let it stand but note the filler-flip risk.

  **4. Color Scientist in the Black-and-White Room (Mary's Room)**
  - *Claim:* Physicalism is false because Mary learns something new upon seeing red.
  - *Filler-flip:* Invert filler? What if Mary is not a scientist but an ordinary person? What if the room is not black-and-white but she has never seen red? Verdict might not flip. The key is her complete physical knowledge.
  - *Ramp pumps:* Not graded.
  - *Self-certifying:* The term "physical knowledge" is contested. Neutral: "all information about the physical processes". Intuition might hold.
  - *Other:* Coherence: Is it possible to have all physical knowledge without experiencing color? Some physicalists argue that experience is physical. Judgment call.
  - *Assessment:* Passes filler-flip and self-certifying tests. However, the thought experiment is controversial and might be considered incoherent by physicalists. But it's not obviously flawed by the checklist.
  - *Recommendation:* Let it stand. The checklist does not kill it.

  ---

  **Final Report Notes for Co-Editor**
  - Co-editor can quickly spot-check:
    - Step 1: The stated claim and role of the thought experiment.
    - Step 4: Whether the self-certifying test was applied (look for replacement of contested terms).
    - Step 2 and 3: If the tests (filler-flip and ramp) were performed and the results noted.
  - Limitations: The checklist doesn't resolve whether the thought experiment is ultimately sound, only whether it has common flaws. It relies on the referee's application of tests, which might be subjective.

  **Honest Limitations of the Procedure**
  - It cannot adjudicate between philosophical schools (e.g., whether intuitions are reliable).
  - It may miss novel failure modes.
  - Some tests (like filler-flip) require creativity and might not be exhaustive.
  - The outcome might depend on the referee's own intuitions when applying the tests.
answer: |-
  Below is a concise, actionable checklist for evaluating thought experiments in philosophy/cog sci papers. It's designed to be run in **~15 minutes** and covers your three specified failure modes plus additional common pitfalls. I've marked each step as **"Requirement"** (essential for rigor), **"Prejudice"** (methodologically contentious; reflects one philosophical camp's view), or **"Judgment Call"** (requires human discretion). Steps your co-editor can spot-check quickly are flagged with **🔍 Co-editor spot-check**.

  ---

  ### **Thought Experiment Evaluation Checklist**
  **Time budget:** ~15 min (focus on high-impact steps; skip judgment calls if time runs out).  
  **Goal:** Determine if the case does *real work* (supports argument, withstands scrutiny) or *pumps intuition* (relies on bias/ambiguity).

  1. **Clarify the Target Claim**  
     - Identify the precise claim the case is meant to support (e.g., "This shows moral permissibility of X").  
     - *Requirement*: Must be explicit. If missing, flag in report.  
     - **🔍 Co-editor spot-check**: Scan the paper's intro/conclusion for the stated claim.

  2. **Filler-Flip Test**  
     - *Test*: Invert a key unstated background assumption (e.g., change societal norms, biological facts, or character motives) and ask: "Does the intuitive verdict flip?"  
     - *Failure sign*: Verdict changes significantly.  
     - *Requirement*: Essential for robustness.  
     - **🔍 Co-editor spot-check**: Reviewer's example of inverted filler and outcome.

  3. **Ramp Pump Test** (For graded cases only)  
     - *Test*:  
       a. **Shuffle steps**: Reorder the sequence. Does the endpoint still hold?  
       b. **Skip to end**: Present the endpoint alone. Is it rejected?  
     - *Failure sign*: Shuffling/skipping weakens the intuition.  
     - *Requirement*: Necessary for slow-ladder cases.  
     - **🔍 Co-editor spot-check**: Note if shuffling/skipping was tested.

  4. **Self-Certifying Description Test**  
     - *Test*: Replace contested terms (e.g., "person," "conscious") with neutral descriptors. Does the intuition collapse?  
     - *Failure sign*: Intuition depends on loaded language.  
     - *Requirement*: Essential to avoid circularity.  
     - **🔍 Co-editor spot-check**: Check for key contested terms in the case description.

  5. **Other Failure Modes**  
     - **Unanchored Possibility** (Prejudice): Does the case rely on an unsupported "possibility" (e.g., "Imagine a world where X")? *Test*: Ask "Is this *relevant* to actual human cognition/ethics?" (Judgment Call: Some camps reject modal intuitions).  
     - **Framing Bias** (Requirement): Is the case emotionally loaded (e.g., "violinist" implies art, "trolley" implies urgency)? *Test*: Neutralize language (e.g., "unconscious individual" vs. "violinist").  
     - **Straw Target** (Requirement): Does it misrepresent the opponent's view? *Test*: Compare to cited literature.  
     - **Incoherence** (Judgment Call): Is the scenario logically/metaphysically impossible? (e.g., contradictions in terms). *Test*: Flag if it breaks known laws (physics, logic).

  6. **Overall Verdict & Recommendations**  
     - Based on tests, categorize:  
       - **Real work**: Passes all Requirement tests; central to argument.  
       - **Pumping intuition**: Fails ≥1 Requirement test; relies on bias/ambiguity.  
     - *Recommendations for report* (use precise phrasing):  
       - **Let it stand**: Robust, no failures.  
       - **Needs minimal-pair sibling**: Filler-flip/framing issues (add contrasting case to isolate variables).  
       - **Illustrative only**: Self-certifying/ramp issues; demote to example, not evidence.  
       - **Not fixable**: Incoherent/straw target; reject or major rewrite.  
     - *Judgment Call*: Values disputes (e.g., "Are intuitions valid?") default to author's framework unless incoherent.

  ---

  ### **Limitations of This Checklist**
  - **Cannot resolve**: Deep philosophical splits (e.g., intuition validity, moral realism).  
  - **Human-dependent**: Judgment calls (e.g., "incoherence") require referee discretion.  
  - **Speed trade-off**: Sacrifices depth for brevity; may miss subtle issues.  
  - **Co-editor role**: She can validate tests/results (🔍) but not reevaluate judgments without rereading.

  ---

  ### **Test Runs on Your Cases**
  Ran in **<15 min** total. Focused on high-impact tests. Bolded failures indicate "pumping intuition."

  1. **Trolley variant** (e.g., switch vs. fat man)  
     - *Target claim*: "Killing one to save five is permissible in switch but not fat-man."  
     - *Filler-flip*: Invert filler (e.g., "If the one is a criminal, fat-man becomes intuitive"). **VERDICT FLIPS** → Failure.  
     - *Ramp*: Not graded (N/A).  
     - *Self-certifying*: Neutralized "kill" to "cause death." Intuition holds → Pass.  
     - *Other*: Framing bias (emotional terms like "fat man" → neutralized to "large individual"). Intuition weakens → Failure.  
     - **Verdict**: Pumping intuition (filler-flip + framing).  
     - **Recommendation**: Needs minimal-pair sibling (e.g., vary intent/relationship).

  2. **Overnight violinist hookup** (Thomson)  
     - *Target claim*: "Bodily autonomy justifies abortion even if fetus is a person."  
     - *Filler-flip*: Invert filler (e.g., "If hooked to your child, obligation feels stronger"). **VERDICT FLIPS** → Failure.  
     - *Ramp*: Not graded (N/A).  
     - *Self-certifying*: Neutralized "person" to "human organism." Intuition holds → Pass.  
     - *Other*: Framing bias ("famous violinist" implies value → neutralized to "unconscious stranger"). Intuition weakens → Failure.  
     - **Verdict**: Pumping intuition (filler-flip + framing).  
     - **Recommendation**: Needs minimal-pair sibling (e.g., vary duration/relationship).

  3. **Neuron-by-neuron brain swap** (slow ladder)  
     - *Target claim*: "Gradual replacement doesn't preserve identity."  
     - *Filler-flip*: Invert filler (e.g., "If original neurons are preserved, identity holds"). **VERDICT FLIPS** → Failure.  
     - *Ramp*: Shuffled steps (e.g., replace 90% at once). Intuition weakens → Failure. Skipped to end: Intuition rejects identity → Pass.  
     - *Self-certifying*: Neutralized "identity" to "same entity." Intuition holds → Pass.  
     - **Verdict**: Pumping intuition (filler-flip + ramp shuffle).  
     - **Recommendation**: Illustrative only (ramp distracts from core argument).

  4. **Color scientist in black-and-white room** (Jackson's Mary)  
     - *Target claim*: "Physicalism is false; Mary gains new knowledge upon seeing red."  
     - *Filler-flip*: Invert filler (e.g., "If Mary knows neural correlates of red, no new knowledge"). Verdict holds → Pass.  
     - *Ramp*: Not graded (N/A).  
     - *Self-certifying*: Neutralized "knowledge" to "information." Intuition holds → Pass.  
     - *Other*: Unanchored possibility (Prejudice): Some physicalists reject the setup → Judgment Call.  
     - **Verdict**: **Real work** (passes all tests). *Does not kill it*—genuinely persuasive per your view.  
     - **Recommendation**: Let it stand.

  ---

  ### **Sample Report Snippets for "Pumping Intuition" Cases**
  - **Trolley**: "Relies on unstated background assumptions (e.g., character traits) and emotional framing. Filler-flip test shows verdict fragility. Add minimal-pair cases to isolate variables (e.g., same action with neutral framing)."  
  - **Violinist**: "Filler-flip test reveals dependence on relational context (e.g., stranger vs. kin). Framing ('violinist') biases intuitions. Revise with minimal-pair siblings (e.g., varying relationships/durations)."  
  - **Brain swap**: "Filler-flip test shows sensitivity to unstated assumptions (e.g., neuron preservation). Ramp structure (shuffled steps) weakens the intuition. Demote to illustrative example; anchor to core argument."  

  **Co-editor guidance**: She can quickly validate 🔍 steps by checking:  
  - Test applications (e.g., "Did reviewer invert filler? How?")  
  - Clarity of target claim.  
  - Use of recommendations (e.g., "minimal-pair" suggested where filler-flip fails).  

  This checklist prioritizes efficiency and actionability while acknowledging philosophical divides. It flags pumping intuition reliably but won't resolve debates about intuition's role—your judgment calls there are final.
