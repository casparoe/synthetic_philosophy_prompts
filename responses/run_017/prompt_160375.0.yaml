  - Handling situations with no expressed will (just demonstrations/leader claims)
  - Accounting for intensity of preference
  - Surviving voting paradoxes (like two-referendum cases)
  - Addressing changing wills over time
  - Being checkable in principle

  They want me to evaluate which of these are genuine requirements versus biases from their reading. I need to create a table with each requirement, an original case demonstrating why it's needed, and whether it's non-negotiable or just a preference. Then I should write two paragraphs: one on which requirements seem jointly unsatisfiable, and another on which single requirement excludes most candidate theories.

  For the table, I'll assess each requirement based on the user's cases. The boundary problem is fundamental - it's impossible to aggregate without defining the demos first. The shadow demos issue is also critical in our globalized world. The willing vs wanting distinction is important for avoiding paternalism. Handling unexpressed wills is essential since populists often make claims without votes. Intensity matters for legitimacy, especially with passionate minorities. Voting paradoxes reveal inherent flaws in aggregation methods. Time-based cases highlight how future interests conflict with present preferences. Checkability is crucial - without it, the concept becomes unfalsifiable.

  For the unsatisfiability section, I agree with the user that demos-sensitivity, intensity sensitivity, immunity to agenda control, and determinacy likely conflict. Defining the demos affects intensity measurements, while Arrow's theorem shows deterministic outcomes require ignoring intensity or being vulnerable to manipulation.

  The "checkability" requirement does the most work in excluding theories. It forces theories to be falsifiable, which eliminates many existing approaches: aggregative models can't handle unexpressed wills, deliberative theories become hypothetical, unitary subject views are mystical, and informed will theories rely on counterfactuals.

  For the optional scoring:
  - Aggregative majoritarianism fails on multiple requirements
  - Deliberative theories struggle with checkability
  - Unitary subject theories are completely uncheckable
