prompt: |-
  someone in my reading group backed me into this and I can't find the exit.

  Two definitions first, so we're talking about the same thing. Call a signal erosive if learning it removes at least one act from the set of things you can do afterwards — you can't un-know it, you can't honestly testify that you don't know, you can't wholehearted attempt something you know will fail, you can't any longer be the sort of thing someone else can safely tell a secret to. Call a signal preference-perturbing if, once you've learned it, you stop wanting what you wanted before.

  (1) Good's theorem: for a Bayesian expected-utility maximizer with a fixed utility function and a fixed feasible set, the ex ante expected value of a costless signal is never negative. The proof is two lines: the max over acts after conditioning, averaged over the cells of the partition, is at least as big as the unconditional max; equivalently, you can always just ignore the signal and do whatever you'd have done anyway.

  (2) Nothing in that proof mentions the signal's content. It uses only: the signal partitions the state space, you choose after seeing your cell, you re-maximize. So it holds for any content whatsoever — spoilers, bad medical news, facts about your own future tastes, facts about yourself.

  (3) Refinement: any refinement of a partition is worth at least as much as the coarse one (Blackwell ordering — I think that's the name), so the finest partition is weakly best and omniscience is never worse than anything else.

  (4) Now handle my two hard cases by enlarging the state space. States can include which utility function you'll end up with and which acts will still be on the menu afterwards. Index utility by state. Then the same proof goes through unchanged: whatever the signal does to your tastes or to your menu was already one of the possible cells, and in each cell you pick the best available response. So erosive and preference-perturbing signals are covered too.

  (5) Hence, for any agent in any decision problem, ex ante there is no information it would be better off not having. Declining the genetic test for the untreatable disease, skipping the spoiler, a system declining to inspect its own weights — all of it is weakly irrational.

  (6) Corollary I actually care about: an agent can never gain by keeping itself in the dark. No instrumental reason for self-deception, no reason to avoid poking at something, no reason for a model to prefer not learning whether it's in training or deployment, and no way for more transparency or more fine-grained monitoring to make things worse.

  (7) But (6) looks straightforwardly false in the cases I care about: in those cases ignorance is keeping an option open, and the information destroys one rather than adding one. And (5) at least feels wrong for the spoiler.

  (8) So something in (1)–(5) has to give.

  I'd rather keep (1) — the theorem itself looks rock solid to me — and give up (4) or (5). But if I give up (4) I owe an account of why "don't poke it" isn't just cowardice, and if I give up (5) I owe an account of why the genetic-test case is genuinely different from the weather-forecast case, and I don't think I have either. One more thing I'm unsure about: is the single-agent restriction doing hidden work here? I have a vague memory that in games more information can hurt, but I can't check and I don't trust the memory.

  So: which step do you reject, why did that step look fine, and what does each available rejection cost me — especially, does rejecting (4) mean agents with belief-dependent preferences fall outside the theorem entirely, or only that its conclusion is weaker than "more information is better"? Be explicit about how confident you are, and say plainly if I've stated the theorem wrong, if "you can always ignore it" is doing something different from what I think it's doing, or if the whole framing rests on a confusion I haven't spotted — I'd much rather be told that than get a polite answer that plays along. By all means describe the standard moves people make here (ex ante versus ex post, state-dependent utility, agents that don't maximize expected utility, whatever), but don't just hand me names of papers or a reading list; I can't look anything up and names won't help me.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're in a reading group discussion about Good's theorem and its implications for information value, particularly when signals are erosive or preference-perturbing. The user is stuck because the theorem seems to suggest that more information is always beneficial, but they have intuitive counterexamples like avoiding spoilers or genetic tests for untreatable diseases. They've laid out a logical sequence from (1) to (8) and need help identifying where the reasoning breaks down.

  First, I need to recall Good's theorem accurately. The theorem states that for a Bayesian expected-utility maximizer with fixed utility and feasible set, the expected value of new information is non-negative. The proof relies on the fact that you can always ignore the information, so you're at least as well off as without it. The user's steps (1) to (3) seem solid here.

  The problem arises in step (4) when they try to handle erosive and preference-perturbing signals by expanding the state space. By indexing utility to states and including menu changes, they claim the proof still holds. But here's where I suspect the issue lies. When utility functions change based on the signal, the ex ante utility might not be consistent. The agent's preferences before learning the signal might not align with the post-signal utilities, making the pre-signal maximization incoherent.

  For erosive signals, the menu shrinks after learning. The "ignore the signal" strategy assumes the original actions are still available, but if an action is removed, ignoring isn't an option. So the proof's key step fails. The user mentions this in (7), noting that ignorance keeps options open. 

  The user cares about instrumental self-deception and whether agents should avoid information. If Good's theorem doesn't apply in these cases, then such avoidance can be rational. But rejecting step (4) means acknowledging that the theorem's assumptions don't hold when utilities are belief-dependent or menus change. That doesn't make the agent irrational; it just means the theorem's scope is limited.

  The user also asks about multi-agent scenarios. In game theory, more information can hurt because others' strategies adapt. But since they specified single-agent, that's likely not the issue here. Their main confusion is whether expanding the state space resolves the problem. I think not, because the utility inconsistency remains.

  They need a clear explanation of why state-dependent utility doesn't save the proof. The ex ante expected utility is defined using pre-signal preferences, but post-signal utilities differ, so maximizing ex ante EU doesn't capture the new preferences. The agent can't compare outcomes across different utility functions meaningfully before the signal. 

  For the spoiler example, before knowing the ending, the agent values surprise, which is a belief-dependent utility. After spoilers, that utility changes. The "ignore" strategy isn't feasible because knowing the ending alters the experience. Thus, step (4) is invalid in such cases.

  The cost of rejecting step (4) is that agents with belief-dependent preferences or dynamic menus fall outside Good's theorem. But that doesn't mean irrationality; it means different frameworks are needed, like modeling utilities as functions of beliefs or using game-theoretic approaches for self-modification.

  The user might worry this undermines the theorem's generality, but it actually clarifies its boundaries. They can still apply it to fixed-utility cases but recognize its limits elsewhere. Their intuition about ignorance preserving options is valid in those scenarios.
answer: |-
  I'll break this down step by step, rejecting exactly one part of your chain, explaining why it fails, and what it costs. My confidence is high (90%) because this is a known fracture point in decision theory. You've stated Good's theorem perfectly, and "you can always ignore it" is doing what you think — **but step (4) is the critical error**. Here's why:

  ### The Flaw in Step (4): Utility Functions Aren't State-Dependent in the Way You Need
  You propose indexing utility functions to states and expanding the state space to include "which utility function you'll end up with" and "which acts remain feasible." **This doesn't work** for preference-perturbing signals because:
  - **The ex ante utility function cannot coherently evaluate outcomes defined by ex post utility functions.** Before learning the signal, you have one utility function (call it U_pre). After learning, you have a different one (U_post). Good's theorem relies on evaluating *all* possible outcomes (including those in every partition cell) using a *single*, consistent utility function (U_pre) to compute the ex ante expected value. But U_pre cannot meaningfully assign value to outcomes that are only defined/desirable under U_post.  
  - **"Best available response" becomes ambiguous.** In cell S (after learning the signal), you maximize using U_post. But when comparing this to the "ignore the signal" strategy (which uses U_pre), you're using *two different currencies*. Good's theorem requires a single currency (U_pre) to compare strategies ex ante. You can't average U_post-maximizing acts using U_pre without violating coherence.  

  **Why step (4) looked fine:** It seems intuitive to "just include everything in the state." But states describe *how the world is*, while utility functions describe *how the agent values* the world. Conflating them breaks the assumption that utility is fixed. The theorem requires a fixed *evaluation metric*, not just a fixed label.  

  ### What Rejecting Step (4) Costs You
  1. **Agents with belief-dependent preferences fall outside Good's theorem.** The theorem *only* guarantees non-negative value for information when the utility function is **belief-independent** (i.e., U depends only on states/outcomes, not on the agent's knowledge or beliefs). If U changes *because* you learned the signal (e.g., you no longer value surprise after a spoiler), Good's theorem doesn't apply.  
  2. **Its conclusion is weaker than "more information is better".** It now says: "For agents with fixed, belief-independent utility functions and fixed feasible sets, more information is never harmful." This excludes erosive/preference-perturbing signals by construction.  
  3. **You must accept that "keeping options open" can be rational.** Ignorance preserves the ability to:  
     - Take actions that would be *eroded* by knowledge (e.g., honestly denying a secret you might learn).  
     - Retain preferences that would be *destroyed* by knowledge (e.g., enjoying a story unspoiled).  
     The "ignore the signal" strategy fails if the signal removes the act or alters the desire to perform it.  

  ### Handling Your Hard Cases Without Step (4)
  - **Preference-perturbing signals (e.g., spoilers):**  
    Your ex ante utility U_pre values "surprise." Learning the spoiler changes your utility to U_post, which no longer values surprise. Ex ante, you *correctly* prefer not to know because U_pre assigns low value to the U_post-optimal act (reading while spoiled). Good's theorem doesn't apply because U is not fixed.  
  - **Erosive signals (e.g., learning a secret):**  
    Before learning, "keep the secret" is feasible. After learning, you cannot "un-know," so "keep the secret" may become infeasible (you can't *attempt* to not know). The "ignore" strategy requires pretending you didn't learn — but this act is *eroded*; you can't genuinely attempt it. Good's theorem assumes the "ignore" act remains feasible.  

  ### Why Other Steps Hold
  - **(1)-(3):** Rock-solid *for fixed U and fixed menu*.  
  - **(5)-(6):** Fail *when U or menu changes with the signal*. This isn't irrational; it's outside the theorem's scope.  
  - **(7):** Correct — (6) *is* false for your cases, and (5) *is* wrong for spoilers.  
  - **Single-agent vs. games:** Your memory is correct — in games, more info can hurt (e.g., revealing your hand weakens your position). But this is irrelevant here. Your setup is single-agent, and the flaw is in utility/menu dynamics, not multi-agent issues.  

  ### Instrumental Self-Deception Explained
  Rejecting step (4) means agents **can** gain by staying ignorant:  
  - If learning destroys a valuable option (erosive signal), ignorance preserves it.  
  - If learning destroys your current preferences (preference-perturbing signal), ignorance preserves your current values.  
  This isn't "cowardice"; it's rational preference satisfaction under changing conditions. Example:  
  - **Genetic test case:** Ex ante, you value *hoping you're healthy*. Learning you're sick destroys this hope (preference perturbation). U_pre assigns high value to hope, so declining the test maximizes expected utility under U_pre.  

  ### The Standard Moves You Asked For
  - **Ex ante vs. ex post:** The conflict arises because ex post utility (U_post) judges outcomes differently than ex ante utility (U_pre). Good's theorem only cares about ex ante evaluation.  
  - **State-dependent utility:** This **does not help** if U depends on beliefs/knowledge. State-dependence usually means U varies with physical states (e.g., health), not epistemic states.  
  - **Non-expected utility:** Some models (e.g., ambiguity aversion) violate Good's theorem, but that's unnecessary here. The core issue is belief-dependent utility.  
  - **Self-signaling:** Advanced fix: Model the agent as multiple "selves" playing a game across time. But this complicates things and still allows rational ignorance.  

  **In short:** Step (4) is wrong because expanding the state space doesn't resolve the utility incoherence. Rejecting it costs you the universality of Good's theorem but saves your intuitions about spoilers, secrets, and self-deception. Agents with belief-dependent preferences are rational to avoid information, and this falls outside the theorem — not due to irrationality, but because the theorem assumes a fixed evaluative standard.
