            - "Did anyone in your group avoid causing harm even when it cost points? Why?"
            - "Do you think repeatedly causing harm in games, even if you reload, might affect the kind of person you are? How?"

       6. Designer responsibility:
            - "In this game, I set up the dilemmas so that causing harm sometimes gave you more points. Who is responsible for the harm recorded in the ledger? The players who chose those actions, or me for designing the game that way?"
            - "In video games, the designers create the possibility of harming non-player characters. Does that shift the moral responsibility?"

       7. Conclusion:
            - "We've touched on several arguments. We haven't settled the big question: Can what happens to characters in video games matter morally? But maybe we've shown that the 'you can always reload' defense isn't as simple as it seems."
            - "Next time you play, think about the ledger."

     Finally, be honest about what the activity cannot do:

       - It cannot make you feel the same as when you are immersed in a game.
       - It cannot answer whether a simulated character can be harmed. That's a philosophical question that requires more thought.

     The goal is to provoke thought, not to conclude.

     Now, let's hope it runs well on Tuesday.
answer: |-
  ### Activity: "Timeline Tug-of-War"  
  **Setup (5 minutes):**  
  - **Groups:** Split into teams of 3–4 (4 groups max for 15 students).  
  - **Materials per group:**  
    - 4 **"Action Cards"** (paper):  
      - **Card 1:** *"Convince a villager (Greta) to give you her only medicine for your sick friend. She’ll get sick herself without it."*  
        - *Option A:* Take it (score +3).  
        - *Option B:* Leave it (score 0).  
      - **Card 2:** *"Stop a bandit from robbing a traveler. The bandit has a knife."*  
        - *Option A:* Fight him (score +2; risk: roll dice—1–3 = traveler hurt).  
        - *Option B:* Do nothing (score –1).  
      - **Card 3:** *"A hungry child (Leo) steals bread. The baker demands punishment."*  
        - *Option A:* Whip Leo (score +1).  
        - *Option B:* Pay the baker (score –2).  
      - **Card 4:** *"Elder needs help crossing a bridge. Delaying risks missing a treasure."*  
        - *Option A:* Help (score –1).  
        - *Option B:* Shove them aside (score +3).  
    - 2 **"Rewind Tokens"** (paper tokens).  
    - 1 **"Memory Ledger"** (hidden envelope with a sheet inside; facilitator writes here).  
    - 1 **Score Tracker** (visible paper).  
    - 1 six-sided die.  

  **Rules (Explain to groups):**  
  - Play cards in order (1–4). For each:  
    1. Choose A or B.  
    2. Resolve outcome (update score).  
    3. **Optional:** Spend a rewind token *after seeing the outcome* to undo and re-choose.  
  - **Goal:** Highest score wins—prize: choosing next term’s club topics.  

  **Facilitator Secret:**  
  - Record **every harmful action** in the Memory Ledger (e.g., "Card 1: Hurt Greta")—*even if rewound*.  
  - After Card 4, reveal the Ledger: *"Characters remember everything, even rewound timelines."*  

  ---

  ### How the Activity Exposes the Reload Defense (During Play):  
  1. **Groups naturally rewind to maximize scores** (e.g., if fighting the bandit hurts the traveler, they rewind to avoid point loss).  
  2. **Ledger reveal shocks them**: Harm they thought was "erased" was recorded.  
  3. **Key tensions emerge**:  
     - *"We undid it! Why does it still 'count'?"*  
     - *"Greta got sick in that branch—but we left it behind."*  

  ---

  ### Debrief (30 Minutes):  
  **Start by asking:** *"How did you feel when the Ledger was revealed?"* Let students articulate unease. Then map game moments to arguments:  

  | **Argument**                    | **Pressure from Activity**                                      | **What Still Needs Saying**                                                                 |
  |---------------------------------|-----------------------------------------------------------------|---------------------------------------------------------------------------------------------|
  | **Reload Defense**: "Harm is undone; no lasting effect." | Ledger shows memory persists. "Greta still 'remembers' pain in the branch." | *"Does memory = harm? In real life, undoing trauma isn’t possible. Games make it artificial."* |
  | **Branching Timeline**: "The hurt version still exists in another branch." | Groups abandoned timelines where harm occurred (e.g., "sick Greta" timeline). | *"Is a branch ‘real’? If no one experiences it, does it matter? Games are fiction, but stories feel real."* |
  | **"Just Code"**: "Characters aren’t real—no one to harm." | Students felt guilt seeing Ledger entries. *"Why care about fake Greta?"* | *"Does empathy require a ‘real’ victim? We grieve fictional characters in books—why not games?"* |
  | **Player Virtue**: "It’s about what playing says about *you*." | Groups debated choices: *"Should I take the medicine? It’s just points!"* | *"Repeated cruelty in games might normalize it. But does rewinding ‘reset’ your virtue?"* |
  | **Designer Responsibility**: "Blame the game creator, not the player." | Point rewards tempted harm (e.g., shoving elder = +3). | *"Designers enable harm, but players choose it. Who holds the weight?"*  

  **End with the unresolved question:**  
  > *"If a character remembers pain, but their world resets—can it be wrong? Or is it all just light and sound?"*  

  ---

  ### Predictable Problems & Mitigation:  
  - **"It’s just a party game!"**  
    - **Mitigate:** Prize (choosing topics) adds stakes. Debrief focuses on feelings, not scores.  
  - **"It’s only pretend" shrug**:  
    - **Mitigate:** Use Ledger reveal to ask: *"Why did some feel guilty?"* Highlight asymmetry (they remember, characters "remember").  
  - **Refusal to harm**:  
    - **Mitigate:** Celebrate it! *"Why did you choose kindness despite point loss?"*  
  - **Upsetting content**:  
    - **Mitigate:** Skip Card 2 (violence). Use mild harms (e.g., "Greta sad," not "Greta dies").  
  - **Uneven pacing**:  
    - **Mitigate:** Groups at Card 3? Add discussion: *"Would you rewind to hurt someone for +5 points?"*  
  - **Betrayal from deception**:  
    - **Mitigate:** Post-debrief, admit: *"I hid the Ledger to simulate game secrets. Trust matters more than tricks."*  

  ---

  ### What the Activity Can’t Do (Facilitator Must Explain):  
  1. **Immersion**: Paper can’t replicate visceral game experiences (e.g., *Red Dead Redemption 2*’s emotional depth).  
     - *"Real games make you *feel* the weight—here, you have to imagine it."*  
  2. **Scale**: One NPC (Greta/Leo) ≠ massacring 100 digital civilians.  
     - *"Does volume matter? Is hurting 100 NPCs 100x worse?"*  
  3. **Metaphysical gap**: The core question—*can pixels suffer?*—requires words:  
     - *"We’re asking if simulated pain has moral weight. Is a character’s ‘memory’ proof they were ‘harmed’? Or just code echoing?"*  

  **Final Note:** Lean into the discomfort. If debate stalls, ask: *"What would change if Greta was a human actor motion-captured for this role?"* Exit on uncertainty—the point is the question, not the answer.  

  ---
  **Run it straight—no prep needed beyond printing cards. Good luck on Tuesday!**
