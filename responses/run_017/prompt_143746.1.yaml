answer: |-
  ### Brainstorm
  - **Avoid lecture by grounding in lived experience**: Open with the centenary’s celebratory purpose, then pivot to the Day of Inherited Questions as the Republic’s "moral compass." Use Jaspers’s categories implicitly—structure the speech around *four obligations*, not four definitions.  
  - **Political guilt as collective responsibility**: Frame it not as blame but as the Republic’s institutional duty to repair systemic harms (e.g., land restitution, education). Address settler descendants: "You inherit no crime, but you inherit a mandate to ensure justice lives in our laws."  
  - **Moral guilt as personal reckoning**: For Valewood elders, honor their truth without demanding performative forgiveness. For all citizens: "Silence in the face of others’ pain is a choice history judges."  
  - **Metaphysical guilt as unifying solidarity**: Position the Day as a ritual where all acknowledge human fragility. "We kneel not in accusation, but in shared humility before suffering we did not cause but must not ignore."  
  - **Reject criminal guilt definitively**: "No child is born culpable" — align with the Charter to disarm defensiveness.  
  - **Ritual’s purpose**: Argue that the Day prevents "ethical amnesia," making memory active stewardship, not passive regret.  

  ---

  ### Speech: "The Weight of Wings"  

  Friends, survivors, builders of Vareth—one hundred years ago, in the ashes of empire, our ancestors did not merely found a state. They founded a *question*. A question engraved in our Charter and given a day: *How do we live justly atop unhealed ground?* Today, we celebrate the Republic’s resilience. But we are also gathered for the Day of Inherited Questions—not to reopen wounds, but to tend them with care, so they might finally heal.  

  To the Valewood elders: your presence consecrates this ground. You carry memories no rhetoric can soften. We see your scars not as relics, but as compass points. Our Charter rejects hereditary criminal guilt—and rightly so. No grandchild is a felon for their grandfather’s sin. But we also reject something else: the lie that because no one alive today lit those fires, we bear no relationship to the smoke still hanging in our valleys.  

  What, then, does this Day demand of us? Not guilt that crushes, but responsibility that lifts. Let me speak plainly.  

  **First, to the descendants of settlers:** You inherit no criminal guilt. But you *do* inherit political responsibility—the duty of citizens to ensure their state repairs what its predecessors broke. This is the work of laws, of lands returned, of schools teaching not just triumph but truth. Your inheritance is not shame; it is the privilege to rebuild. When the Charter rejects hereditary guilt, it frees you—not from obligation, but from paralysis, so you may act.  

  **To every citizen, young and old:** We inherit moral questions. Did my ancestors turn away? Do I? Moral guilt, as philosopher Karl Jaspers taught, lives in the silence that permits evil, the indifference that lets injustice breathe. It asks: *When I witness a wrong—then or now—do I lend it my quiet?* This Day is our pledge: we will not be indifferent to the pain still echoing in Valewood homes, or to new injustices taking root.  

  **And to our students, holding tomorrow’s Vareth:** You inherit neither crime nor debt. You inherit a ritual. This Day is your nation’s vow to stay awake. It asks you to listen to elders not with the anxiety of the accused, but with the courage of the witness. To ask: "What must *we* remember so we may build without repeating?"  

  **Finally, to all of us:** There is a deeper layer—metaphysical guilt. It is the sorrow that binds humans when we see suffering and know: *This fractures us all*. It is not about fault; it is about fragility. Today, we bow our heads together—settler descendant, Valewood elder, student, teacher—not because we are guilty, but because we are human. In this shared humility, we find our unity.  

  The Day of Inherited Questions is not a verdict on the past. It is a vow for the future: to carry memory not as a chain, but as wings. Wings that lift us toward a justice that does not forget, a peace that does not paper over, a Republic that dares to ask, "How can we do better?"  

  For a hundred years, this question has been our bedrock. Let it be our beacon for a hundred more.  

  ---

  ### Note on Liberties with Jaspers’s Framework  

  1.  **Political Guilt Expanded to Beneficiaries**: Jaspers linked political guilt to citizenship in a regime that committed crimes. I extend it to *ongoing* institutional repair benefiting descendants of perpetrators, arguing that maintaining just institutions is their distinct political duty. *Reason:* Vareth’s Charter necessitates forward-looking responsibility; passive "clean hands" undermines reckoning.  
  2.  **Moral Guilt as Transgenerational Vigilance**: Jaspers focused on individual complicity in specific acts. I frame moral guilt as a present-day obligation to combat inherited patterns of silence/indifference. *Reason:* For the ritual to bind generations, moral responsibility must be active and collective, not frozen in the past.  
  3.  **Metaphysical Guilt as Unifying Practice**: Jaspers saw it as a deeply personal, almost religious, reckoning. I present it as a communal ritual ("we bow our heads together") fostering solidarity. *Reason:* The speech prioritizes social cohesion; metaphysical guilt becomes the bridge between groups, not private anguish.
