  2. **Interventionist group (Group I)**: They can only run trials: they can set one variable to any value (intervene on it) while clamping other variables to any values they choose (or leaving them free, but note: in Woodward, we set the variable and hold fixed other variables in a way that breaks dependencies). They then observe whether the outcome changes. They must not use counterfactual reasoning; they only record what happens when they physically intervene and clamp.

  To enforce protocols:
  - **For Group C (counterfactual)**: They are not allowed to imagine setting variables by force (interventions). They must consider the natural evolution of the system when that one variable is different. We can give them a script: "Imagine that in the actual world, this variable was different (and only that change), and then the system runs as normal. Does the outcome change?" We might have to remind them that they cannot hold other variables fixed because that would be an intervention. In the counterfactual world, other variables may change as a result of the initial change.

  - **For Group I (interventionist)**: They are allowed to set one variable and clamp others arbitrarily. However, they must only consider interventions that are "surgical" in the sense that they break the normal causal dependencies for the variable being set. They must not set variables that are effects of the variable they are intervening on (because that would require an impossible simultaneous intervention). We can give them a rule: when testing if X causes Y, you set X to a value (while holding fixed other variables that are not effects of X) and see if Y changes.

  But note: in Woodward, the intervention must be such that it doesn't directly affect Y except through X and doesn't correlate with other causes of Y. However, in this activity, we are simplifying. We are focusing on the ability to clamp variables arbitrarily (which is the experimental control) and the invariance condition (which we will handle in the third scenario).

