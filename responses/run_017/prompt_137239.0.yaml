  Interventionist for D:
  - They can set D=open and clamp C=clean: then F=0 -> change, so D is a cause.

  For C:
  - Set C=dirty and clamp D=closed: F=1 (no change) -> not a cause.
  - Set C=clean and clamp D=closed: F=1 (no change) -> but they need to see if changing C changes F. In the actual context (D=closed), changing C doesn't change F. Also, if they set D=open and then change C, then F changes: if C=clean, F=0; if C=dirty, F=1. But that is not in the actual context. So for actual causation, they might not consider it because in the actual setting (D=closed), C doesn't matter.

  So they agree.

  To get invariance in, we need to show that the interventionist might not consider D a cause if the relationship is not robust. But that is not how the test is applied for actual causation.

  I think we have to accept that for actual causation, both accounts often agree. The main disagreement is in the overdetermination case (Scenario 2).

  For Scenario 3, let's try to illustrate the invariance condition at the type level. But the activity is about token causation.

  Perhaps we can have a scenario where the counterfactual account says it is a cause, but the interventionist account says it is not because the relation is not invariant. For example, if the system is very fragile and the effect of D on F depends on many factors that are not in the model.

  But then the interventionist might not be able to see a change because in their trials, they might not reproduce the actual conditions exactly.

  This is too vague.

  Let's do this: 

  Unit 3: "The Fragile One"
  - Only one variable: D (damper position). But the outcome F is also affected by an unobserved variable U. 
  - The rule is: F = 1 if (D=closed and U=0) or (D=open and U=1). 
  - In the actual run: D=closed, U=0, F=1.

  Counterfactual for D:
  - If D had been open, then F = U. In the closest world, what is U? If we assume that U is fixed at its actual value (0), then F=0. So D is a cause.

  Interventionist:
  - They intervene on D: set D=open. But what about U? They cannot see U and cannot clamp it. In the actual run, U=0. When they set D=open, F = U. But U might be 0 or might be 1. They run the trial and by chance U=1, so F=1. They see no change: F=1 (actual) to F=1. So they conclude D is not a cause.
  - Or if by chance U=0, then F=0, so they see a change and conclude it is a cause.

  But this depends on chance. We don't want that.

  Moreover, Woodward's account requires that the intervention be such that it doesn't affect U. But if they set D=open, and if in their intervention U is still 0, then F=0. But they might not know U.

  This is not controlled.

  Given the time, let's focus on Scenarios 1 and 2 for the activity, and for Scenario 3, we can use the temperature dependence to show that the counterfactual account might say D is a cause, but the interventionist account requires that the causal relation be invariant, and if the sign flips, then it is not a good handle.

  But for actual causation, it's tricky.

  Perhaps we can have the following for Scenario 3:

  - In the actual run: T=cold, D=closed, F=1.
  - The rule: when T=cold, F=1 if D=closed, F=0 if D=open.
  - when T=warm, F=0 if D=closed, F=1 if D=open.

  Now, the counterfactual in the actual run for D: if D=open (and T=cold), F=0 -> cause.

  For the interventionist, they see that in some contexts (T=cold) D=closed causes F=1, but in other contexts (T=warm) D=closed causes F=0. So the effect is not invariant. But for the token case, they might still say that in this particular token, D is a cause.

  To highlight the difference, we can have the interventionist group try to use D as a handle and find that sometimes it works and sometimes it doesn't. But that might not show up in the verdict sheet because they are only testing in the actual context? But they can clamp T to cold, so they see it works.

  I think we should leave Scenario 3 as is and in the debrief, we can discuss how the counterfactual account focuses on what happened in the actual world, while the interventionist account cares about whether the relationship is stable enough to be a good handle. But for the verdict, they might still agree on the token cause.

  Given the complexity, I will proceed with the following three scenarios:

  1. The Chain: both groups agree on R, P, V being causes.
  2. The Two Watchdogs (symmetric overdetermination): Group C says neither A nor B is a cause; Group I says both are.
  3. The Fragile One: both groups agree that D is a cause (counterfactual: if D had been open, F=0; interventionist: set D=open, clamp T=cold, F=0 -> cause). But then we don't have a third disagreement.

  For the third scenario, let's make it so that the counterfactual group says it is a cause, but the interventionist group says it is not because of the invariance condition. But how to operationalize that in the activity?

  Perhaps we can have the interventionist group test the relationship in two different background conditions and see that it changes, so they conclude that D is not a reliable cause. But the verdict sheet is about whether it caused in this instance.

  This is not working. Let's replace the third scenario with a case of preemption that we mentioned earlier.

  Scenario 3: "Early Watchdog"
  - A and B are two trips. A is checked first. If A is tripped, then S=1 and the system ignores B. If A is not tripped, then it checks B and S=B.
  - Actual run: A=1, B=1, S=1.

  Group C (counterfactual):
  - For A: if A had been 0, then S=B. In this case, B=1, so S=1. So S is the same -> not a cause.
  - For B: if B had been 0, then S=1 (because A=1) -> not a cause.

  Group I (interventionist):
  - For A: they can clamp B=0 and set A=1 -> S=1. Then set A=0 (clamp B=0) -> S=0. So they see that A can change S -> cause.
  - For B: they set B=0 and clamp A=0 -> S=0. Then set B=1 (clamp A=0) -> S=1. So B can change S -> cause.

  But wait, in the actual run, B was not used because A was tripped. So for actual causation, should they mark B as a cause? 

  This is the same as Scenario 2. 

  Alternatively, in Group I, when they test B, they are not in the actual context. In the actual context, A=1 and B=1. If they want to test if B is an actual cause, they should hold A fixed at 1 and change B. Then S=1 regardless of B. So then they would say B is not a cause. 

  So in this preemption scenario:

  Group I for actual causation of B:
  - Intervention: set B=0 while holding A=1 (actual value). Then S=1 (unchanged). So B is not a cause.
  - Similarly for A: set A=0 while holding B=1 (actual value). Then S=1 (because now it uses B and B=1) -> unchanged. So A is not a cause.

  Then both groups agree: neither is a cause.

   So it does not give us the desired disagreement.

  Given the above, I will use only two scenarios for the activity: the chain (agreement) and the two watchdogs (disagreement). For the third, we can have the Fragile One as an example for invariance in the debrief, but not as a black box.

  So the activity will have two units. But the user asked for three. So let's keep the first two and for the third, we can do the invariance as follows:

  Unit 3: "The Fragile One" - with explicit background.
  - Variables: D and T (temperature). The outcome F.
  - Rule: F = 1 if (D=closed and T=cold) or (D=open and T=warm) 
  - Actual run: T=cold, D=closed, F=1.

  Counterfactual group:
  - D: if D=open ( T=cold) -> F=0 ( because now not (D=closed and T=cold) and not (D=open and T=warm) -> F=0) -> cause.
  - T: if T=warm ( D=closed) -> F=0 ( similarly) -> cause.

  Interventionist group:
  - For D: they can try setting D=open and clamping T=cold: then F=0 -> change, so cause.
  - For T: setting T=warm and clamping D=closed: F=0 -> change, so cause.

  Agreement. 

  In the debrief, we can then discuss that the interventionist also cares about whether the causal relation is invariant under changes in the background. We can point out that the effect of D on F is not invariant because it depends on T: when T is cold, D=closed causes F=1; when T is warm, D=closed causes F=0. So if you didn't know the temperature, using D to control F is not reliable. But for the specific token, both accounts agree it is a cause.

   So in the game, they will agree, but in the debrief, we can use it to discuss the additional layer in Woodward's theory.

  Now, to the practical arrangement.

  **Logistics:**
  - Split the class into two halves: Group C (counterfactual) and Group I (interventionist). Within each half, students work in small groups (3-4 students per group) on each scenario.
  - There are three scenarios. Each small group will work on all three scenarios for their assigned method.
  - Because of the desk grid, we can have the groups arranged in the grid. For example, in a grid of 4x6 (24 seats), we can have 6 groups of 3-4 students. Three groups for Group C and three for Group I.

  ** Materials for each scenario:**

  For each scenario, we provide an index card with the following:
  - The name of the unit (e.g., "Unit 1: The Chain")
  - A description of the system ( the variables and the actual run).
  - For Group C: the counterfactual question they must use.
  - For Group I: the intervention instructions.

  Additionally, for Group I, we provide a way to "clamp" variables. Since it's a thought experiment, they just need to be told they can set and clamp.

  ** verdict sheet:**
   For each unit, a table with the variables and a checkbox or write "cause" or "not a cause".

  Example for Unit 1:
  ```
  Unit 1: The Chain
  Variables: R, P, V, F
  Actual values: R=high, P=high, V=open, F=flood

  For each variable, is it a cause of F? (circle: cause / not a cause)
  - R: cause / not a cause
  - P: cause / not a cause
  - V: cause / not a cause
  ```

  Similarly for Unit 2 and 3.

  **Enforcement of protocols:**
  - Provide each group with a instruction card that clearly states what they are allowed to do.
  - For Group C: "For each variable, you may only consider: in the closest world where this variable had been different (and only that change), would the outcome have been different? You must not imagine setting other variables by force."
  - For Group I: "For each variable, you may only run trials: you can set the variable to any value you like and clamp other variables to any values you like. You then observe whether the outcome changes. You must not use counterfactual reasoning; only record what happens in the trials."

   circulate to monitor and remind.

  ** Timeline for 90 minutes:**
  1. (5 min) Introduction: Explain that they will be investigators of a flood-control system, and they will use two different methods to determine causes. Split into groups and assign method (C or I) to half the class. Distinctive index cards for each method.

  2. (10 min) Distribute materials for Unit 1 to all groups. Each group works on Unit 1 and fills out the verdict sheet for Unit 1.

  3. (10 min) Collect verdict sheets for Unit 1 and distribute Unit 2. Groups work on Unit 2.

  4. (10 min) Collect Unit 2 and distribute Unit 3. Groups work on Unit 3.

   But we have 22 students in groups, so we need to collect and distribute efficiently. Since they are index cards, we can have a runner (the teacher) collect and distribute.

   Alternatively, have all three units at once, but then groups might work at different speeds. Better to do one at a time.

  5. (15 min) After all verdict sheets are in, the teacher pairs up a Group C and a Group I that did the same unit (by desk proximity: e.g., a Group C and Group I that are behind each other or diagonal). They exchange verdict sheets for one unit at a time (start with Unit 1, then Unit 2, then Unit 3) and see where they agree and disagree. They should not discuss why immediately, just note the differences.

   Because of the bolted desks, they can hand the sheet to the team behind or in front. The teacher can say: "Pass your Unit 1 verdict to the team behind you." But we have only two halves, so behind might be the same method. Better: have the grid arranged so that Group C and Group I are interleaved. For example, in a row: C, I, C, I. Then behind: C, I, C, I. Then a group can pass to the group to their right or left in the next row? Or diagonal.

   Alternatively, the teacher can collect and then redistribute: after Unit 1, collect and then redistribute to a paired group ( Group C verdict to a Group I, and vice versa).

  6. (10 min) Class comes together. The teacher projects or reads out the results for each unit from one or two groups. For Unit 1, they should agree. For Unit 2, they should disagree. For Unit 3, they might agree.

  7. (30 min) Debrief: 
     - Start by Unit 1: both methods agreed. Why? Because the chain of dependence is captured by both: stepwise dependence (Lewis) and interventions can show each link (Woodward).
     - Unit 2: disagreement. 
       - Group C says neither A nor B is a cause. Why? Because in the actual world, changing one while the other is present doesn't change the outcome. This is symmetric overdetermination. Lewis's theory says they are not causes (without additional machinery).
       - Group I says both are causes. Why? Because by clamping the other to 0, they can see that each can make a difference. This is because Woodward's account is not just about the actual situation but about the capacity to make a difference in some context. For actual causation, Woodward might also require holding fixed the actual values, but in this activity, we did not restrict to holding fixed the actual values. This is a designed difference to highlight that the interventionist method is not limited to the actual context. We can explain that for Woodward, a variable can be a cause if there is some intervention (in some background) that shows it can change the outcome, and this can be used for type-level causation. But for actual token causation, Woodward might use a different test (holding fixed off-path variables at actual values) which would give the same as the counterfactual. But in this activity, we are not doing that to show the difference in the procedures.
     - Unit 3: agreement. Both say D (and T) are causes. But then we discuss the invariance condition: in Woodward, for a causal relation to be useful, it should be invariant under changes in background conditions. In this unit, the effect of D on F flips sign with T, so it is not invariant. This means that if you didn't know the temperature, using the damper to control the fire might not work. So the interventionist account cares about robustness.

  8. (5 min) Conclusion: The two procedures are answering different questions. The counterfactual account is asking: "Did this event depend on the actual value of this cause in this particular world?" The interventionist account is asking: "Is this variable a potential handle to control the outcome in various contexts?" And they can come apart.

  **What will go wrong:**
  - Group C might try to do interventions. The instructor must monitor and remind: "In the closest world, only that variable changes naturally, and then the system runs. You cannot hold other variables fixed."
  - Group I might not understand clamping. They might only set the variable and not clamp others, leading to different results. For example, in Unit 2, if they only set A to 0 and don't clamp B, then B might change? But in our systems, variables are not dependent unless specified. We should make the systems with clear modularity. In the OR gate, if they set A to 0 and don't clamp B, B is still 1, so S=1. So they might conclude A is not a cause. To get them to clamp, we must instruct them that they can also set (clamp) other variables to any value. And encourage them to try different clamps.
  - In Unit 2, Group I might not think to clamp the other variable to 0. The instructor can give a hint: "Try setting the variable to a different value and see if you can make the outcome change by also controlling the other variables."
  - Time might be tight. We might only get through two units. Prioritize Unit 1 and 2.

  **Parts of the theories not covered:**
  - Lewis's of preemption and quasi-dependence.
  - Woodward's detailed definition of actual causation ( with off-path variables held fixed).
  - The fact that in Woodward, an intervention must be such that it doesn't affect the outcome except through the cause variable. This is not enforced in the activity.

  In the debrief, we can mention these as refinements.

  Final note: This activity is meant to highlight the core ideas and the potential for disagreement, not to cover every nuance.

  Let's now write the materials for each unit.
answer: |-
  ### **Causation Game: Procedures, Materials, and Timeline**  
  **Goal:** Force a clash between counterfactual and interventionist procedures to reveal they answer distinct questions ("What did this outcome hinge on?" vs. "What’s a reliable handle?"), using concrete scenarios. Students discover mismatches in verdicts, setting up a debrief on theory differences.

  ---

  ### **Materials & Setup**  
  **Materials Per Group:**  
  - **Index Cards (3 sets):** One for each unit, with:  
    - **Front:** Scenario name, variables, actual run values, and system rules.  
    - **Back:** Group-specific procedure (C or I).  
  - **Verdict Sheets (3 per group):** Tables for each unit (see templates below).  
  - **Paperclips:** To clip verdict sheets to index cards.  
  - **Teacher’s Toolkit:** Phone timer, master scenario/key cards, spare verdict sheets.  

  **Student Groups (22 students):**  
  - Split class into **Group C (Counterfactual)** and **Group I (Interventionist)**.  
  - With bolted desks, form **pods of 3–4 students** (e.g., 3 pods of 4 for C, 2 pods of 4 and 1 pod of 3 for I).  
  - **Pairing for Comparison:** Each C pod pairs with the I pod **diagonally behind** them (minimal movement). After each unit, verdict sheets are passed diagonally.  

  **Enforcing Protocols:**  
  - **Group C (Counterfactual):**  
    - Card instructions: *"For each variable, ask ONLY: In the closest world where this variable had been different (nothing else tampered with, no ‘reaching in’), would the outcome have changed? Do NOT imagine interventions or holding variables fixed."*  
    - **Red flag:** If they say, "What if we force X and hold Y fixed?" Intervene: "That’s an intervention. You’re only allowed natural, stepwise changes."  

  - **Group I (Interventionist):**  
    - Card instructions: *"For each variable, run trials ONLY: Reach in, surgically set this variable to any value while clamping other variables to any values you choose. Observe if the outcome changes. Do NOT ask about ‘what if’ worlds—only run experiments."*  
    - **Red flag:** If they say, "But in the real world, if X changed, Y would…" Intervene: "That’s counterfactual reasoning. You’re only allowed to record what happens when you physically manipulate the system."  

  ---

  ### **Scenario Cards & Verdict Sheets**  
  **Unit 1: "The Chain" (Agreement Case)**  
  - **Front of Card:**  
    *"River sensor (R) → Pump command (P) → Valve (V) → Flood outcome (F).  
    Rules: R high → P high → V open → F flood; R low → P low → V closed → F no flood.  
    Actual run: R high, P high, V open, F flood."*  
  - **Verdict Sheet:**  
    | Variable | Cause? (✔/✘) |  
    |----------|-------------|  
    | R        |             |  
    | P        |             |  
    | V        |             |  

  **Unit 2: "Two Watchdogs" (Disagreement Case)**  
  - **Front of Card:**  
    *"Pressure trips A and B. Outcome S = A OR B (alarm sounds if either trips).  
    Rules: A and B are independent; no timing differences.  
    Actual run: A tripped (1), B tripped (1), S alarm (1)."*  
  - **Verdict Sheet:**  
    | Variable | Cause? (✔/✘) |  
    |----------|-------------|  
    | A        |             |  
    | B        |             |  

  **Unit 3: "The Fragile Damper" (Invariance Case)**  
  - **Front of Card:**  
    *"Damper position (D: open/shut) and ambient temperature (drawn from deck).  
    Rules:  
      - Cold night: D shut → F fire; D open → F no fire.  
      - Warm night: D shut → F no fire; D open → F fire.  
    Actual run: Cold night (card drawn), D shut, F fire.  
    *Temperature card: Pre-set to COLD (all groups use this).*"*  
  - **Verdict Sheet:**  
    | Variable | Cause? (✔/✘) |  
    |----------|-------------|  
    | D        |             |  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Intro & Setup (10 min):**  
     - Split class into Group C and Group I. Assign pods.  
     - Distribute materials: Each pod gets 3 index cards (units 1–3) and 3 verdict sheets.  
     - Emphasize: "Strictly follow your procedure—no theory talk yet!"  

  2. **Activity (55 min; 15–18 min per unit):**  
     - **Unit 1 (15 min):** Groups apply their procedure to "The Chain." *After*: Pods pass verdict sheets diagonally to compare.  
     - **Unit 2 (20 min):** Groups apply procedure to "Two Watchdogs." *After*: Pass sheets diagonally.  
     - **Unit 3 (20 min):** Groups apply procedure to "The Fragile Damper." *After*: Pass sheets diagonally.  
     - **Teacher Role:**  
       - Monitor for protocol breaches (especially C groups sneaking interventions).  
       - Warn at 5-min/unit intervals: "5 min left! Focus on one variable at a time."  

  3. **Comparison & Debrief (25 min):**  
     - **Share Results (5 min):** Ask pairs: "Where did your verdicts match or clash in each unit?"  
     - **Debrief (20 min):**  
       - **Unit 1 (Agreement):** "Both sides agreed R, P, V caused F. Why?  
         - *Counterfactual:* Stepwise dependence (if R low → P low → V closed → F no flood).  
         - *Interventionist:* Clamping works (set R low → F no flood; no need to clamp intermediates).  
         - **Takeaway:** Both capture transitivity when dependence is direct and invariant."  
       - **Unit 2 (Clash):** "Group C: Neither A nor B caused S. Group I: Both did. Why?  
         - *Counterfactual:* In closest world where A=0 (B untouched), S=1 (B still high). No dependence → not a cause. *No quasi-dependence chain to latch onto.*  
         - *Interventionist:* Clamping B=0 and setting A=1 → S=1; A=0 → S=0. A passes the test (same for B).  
         - **Takeaway:** C asks *"Did S depend on A in this world?"* I asks *"Can A be a reliable handle for S?"* Pre-emption repairs (quasi-dependence) fail here for C; clamping lets I detect capacity."  
       - **Unit 3 (Agreement but Tension):** "Both sides said D caused F. But why might Group I feel uneasy?  
         - *Counterfactual:* If D open (temp cold) → F no fire. Clear hinge.  
         - *Interventionist:* Set D=open + clamp temp=cold → F=0 (so cause). But...  
         - **Invariance Condition:** Effect of D on F flips with temperature. I can’t trust D as a handle without controlling temp. *Sharp student fix?* "Add temperature to the model!" → Shows I’s focus on robust, generalizable relations vs. C’s token-world focus."  
       - **Big Picture (5 min):**  
         - "Lewis (counterfactual) explains *what this outcome hinged on*; Woodward (interventionist) identifies *reliable handles for control*.  
         - Clash in Unit 2 isn’t a flaw—it reveals different questions. Repairs (quasi-dependence, clamping) aren’t edge-case fixes; they do heavy lifting!"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Group C Slipping into Interventions:**  
     - **Sign:** "If we hold B fixed and change A..."  
     - **Fix:** Interrupt: "That’s clamping—you’re Group C! Describe natural changes only."  

  2. **Group I Over-Clamping or Confounding:**  
     - **Sign:** Clamping downstream variables (e.g., in Unit 1, clamping V while testing R).  
     - **Fix:** "Remember, surgical intervention: Only clamp *other* variables, not effects of your test variable."  

  3. **Time Crunch on Unit 3:**  
     - **Sign:** Groups stuck on why D "feels wrong."  
     - **Fix:** Skip deep discussion; note agreement but flag invariance for debrief.  

  4. **Ambiguity in "The Fragile Damper":**  
     - **Sharp Student Fix:** "Add temperature to the model to restore invariance!"  
     - **Handle in Debrief:** "Exactly! Interventionism pushes us to include background variables for robustness. Counterfactuals don’t require this."  

  ---

  ### **Theory Limitations Uncovered by Game**  
  - **Counterfactual (Lewis):** Cannot simulate *default-dependent causation* (e.g., cases where "closest world" is ambiguous). Game assumes symmetric worlds.  
  - **Interventionist (Woodward):** Cannot simulate *non-manipulable causes* (e.g., economic conditions causing recessions). Game only covers surgically settable variables.  
  - **Explain in Debrief:** "Each theory has blind spots. Lewis struggles with overdetermination (Unit 2); Woodward struggles when interventions are impossible."  

  **Outcome:** Students experience the "collision" firsthand, moving beyond a "verbal dispute" to see how procedures define different causal relations. The debrief links game moments to theory machinery, making repairs (quasi-dependence, clamping, invariance) feel necessary, not ad hoc.
