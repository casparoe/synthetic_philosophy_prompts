prompt: |-
  I teach a first-year seminar (~24 students, mostly non-majors, one 75-minute slot on a Thursday afternoon when they're half asleep) on truth, media and polarization, and I want one whole session built around the thing I couldn't explain to my roommate last week: he said an echo chamber is just an epistemic bubble with wifi, and I could tell he was wrong but I fumbled the explanation. The distinction I have in mind is roughly the one from C. Thi Nguyen's work — in a bubble you just never hear the other side, so exposure fixes it, while in an echo chamber you *have* heard the other side and the group has pre-loaded you with reasons to discount anyone who says it, so exposure makes things worse. But I also want a third mechanism in the mix that I don't think has a standard name, and I've started calling it evidential laundering: the group doesn't deny the outsider's fact and doesn't even attack the source, it *admits* the fact and then redescribes it in the group's own vocabulary until it stops counting as evidence against them and starts counting as confirmation of them (the report says the water is contaminated — sure, and isn't it obvious that they'd plant exactly that story to distract from what's really going on). That one seems to me to be the hardest to break from outside, since neither adding evidence nor rehabilitating the source's credibility does anything.

  So what I need is a runnable activity for the full 75 minutes with all 24 doing something, not a lecture with a discussion tacked on — no slide with the definitions, and nobody should hear the words bubble, echo chamber or laundering until the last 15 minutes. My constraints: the subject matter has to be invented and not political (last year I tried it with a real controversy and we lost 25 minutes to students arguing about the actual issue), and it needs a determinate truth that I know and they don't, revealed at the end from a sealed envelope, so the class can *see* that one group ended up wrong in a way another group didn't. I have index cards, envelopes, a whiteboard, one projector, and a coffee-shop voucher I'm willing to hand out — no cash and nothing that needs phones. Give me: the setup and materials; a small-stakes payoff scheme (quiz points or the voucher) where going along with the group's discrediting move is individually rational and collectively costly; roles or rotations so the room splits into conditions without anyone feeling singled out (three simultaneous groups of eight, or one staged case the whole class moves through — tell me which you'd pick and why); and minute-by-minute timings. If there's a role for observers or a spectator row, I like that, since I can't watch three groups at once.

  Then the debrief, which matters more than the game: map specific moments that will actually happen in the room onto the three mechanisms, including what I should say when a student in the bubble condition updates instantly and a student in the echo-chamber condition digs in harder the more evidence I hand them. I also need an honest answer on what will predictably go wrong the first time I run it — I'm especially worried about the sharp student who clocks the setup in the first five minutes and meta-games it, the one who refuses to play along because it feels like I'm manipulating them (one student said something like that last year and I handled it badly), and the irony that I, standing at the front, am structurally the outside authority the activity teaches them to distrust, so my own credibility is a variable in the game. And be frank about what the exercise can't reproduce: real echo chambers are built up over years, they're tied to identity and to real costs for leaving, and none of that fits in a classroom, plus algorithmic curation isn't something I can stage — so tell me which parts of the idea I'll just have to state out loud, and give me one or two diagnostic questions students could take away for telling the three mechanisms apart from the outside.
reasoning: |-
  We are creating a classroom activity to illustrate three mechanisms: epistemic bubbles, echo chambers, and evidential laundering. The activity must:
  - Be non-political and invented.
  - Have a determinate truth revealed at the end.
  - Split the class into three groups (each experiencing one mechanism) without singling anyone out.
  - Use index cards, envelopes, whiteboard, projector, and a coffee voucher.
  - Avoid using the terms until the end.
  - Include a payoff scheme where going along with the group is individually rational but collectively costly.
  - Last 75 minutes with detailed timing.
  - Include a debrief mapping moments to mechanisms, and address challenges.

  **Core Idea:**
  We'll create a fictional scenario about a mysterious event in a small town. The truth is that a rare bird (the "Azure-winged Magpie") has been sighted, causing unusual bird sounds and a few minor disturbances (like missing berries from gardens). However, the town is abuzz with three competing explanations:

  1. **Epistemic Bubble Group (Bubble):** They only receive information that supports the idea that it's a new type of squirrel (the "Chirping Squirrel"). They never hear about the bird.

  2. **Echo Chamber Group (Echo):** They are told that the official story (bird) is a cover-up by the local authorities to distract from their mismanagement of the town's park. They get the bird information but are pre-loaded with reasons to distrust the source (authorities).

  3. **Evidential Laundering Group (Launder):** They are part of a group that believes it's a ghost of a legendary local musician. When they receive evidence of the bird, they reinterpret it as the ghost manifesting (e.g., the bird's call is the ghost's song, the missing berries are an offering to the ghost).

  **Determinate Truth:** The Azure-winged Magpie is real and causing the events. This is sealed in an envelope and revealed at the end.

  **Setup:**
  - Three groups of 8 students. Each group is in a different "information environment" (bubble, echo, launder).
  - Each group has a table with a set of index cards (information) and a task: to figure out what's happening in the town and present their theory.

  **Materials:**
  - **Index Cards (prepared in advance):** Each group gets a set of 5-7 cards with information. The cards are designed to feed into their group's mechanism.
  - **Envelopes:** One for each group with their initial instructions and the truth envelope (to be opened by the instructor at the end).
  - **Whiteboard/Projector:** For the instructor to keep time and display the task instructions.
  - **Coffee Voucher:** As a reward for the group that is "most convincing" (as voted by the class) OR for the group that gets closest to the truth (but note: only the bubble group might get it right? We'll adjust).

  **Payoff Scheme:**
  - Each student can earn up to 3 "participation points" (count toward a low-stakes quiz) for:
    1. Participating in the group discussion (1 point).
    2. Helping to prepare the group's presentation (1 point).
    3. If their group is voted "most convincing" by the class (1 point) OR if they individually write the correct answer on a slip at the end (but wait, we don't want to reveal the truth until the end). Instead, we can have a vote after the presentations and then reveal the truth.

  Alternative: The coffee voucher goes to a randomly selected member of the group that gets the closest to the truth (but we know the bubble group is the only one that might get it right). However, we don't want to punish the other groups for the mechanism they were assigned.

  Better: The coffee voucher is awarded to one randomly chosen student from the entire class at the end (as a thank you) and the participation points are the main incentive. The voting for "most convincing" is just a way to get them to engage, but we don't tie the voucher to it. Instead, we can say that the group that gets the truth exactly right (if any) gets an extra point each. But note: we expect the bubble group to get it right, the echo group to believe it's a cover-up, and the launder group to believe it's a ghost. So only the bubble group would get the extra point. This creates a collective cost for the other groups: they worked hard but were misled.

  **Roles:**
  - Each group has the same task: review the information and come up with a 2-minute presentation on what they think is happening.
  - No assigned roles within groups, but we can have an observer role? Since the instructor can't watch all, we assign 1-2 observers per group (from the same class) who are not in the group but watch and take notes on the group dynamics. They can be rotated in if we have extra time? But we have 24 students, 3 groups of 8. Alternatively, we can have 3 groups of 7 and 3 observers (one per group). Then the observers can report during debrief.

  But 24 students: 3 groups of 7 = 21, plus 3 observers. That works. The observers are given a note-taking sheet (provided) to record:
  - How the group reacts to new information (especially when the instructor delivers an additional card).
  - Whether they change their mind or double down.
  - How they treat conflicting information.

  **Staged Information Delivery:**
  - Initial set of index cards for each group.
  - Then, the instructor delivers an "update" card to each group midway (the same card to all: "A local bird expert confirms the sighting of an Azure-winged Magpie in the area").

  **Timing (75 minutes):**

  **0:00 - 0:10 (10 min): Introduction and Group Formation**
  - Instructor explains: "We're going to do an activity about how communities interpret information. You'll be split into three groups, each representing a different community in the town of Greenwood. Each group will receive some information about strange events happening in the town. Your task is to come up with a theory that explains the events and present it to the class. You'll have about 25 minutes to discuss and prepare a 2-minute presentation. Then we'll have presentations and a discussion."
  - Split the class: assign each student a number 1, 2, or 3 (by counting off). Then group 1 goes to one table, group 2 to another, group 3 to the last. Assign observers: ask for three volunteers (or assign randomly) to be observers. Give each observer a note sheet and assign them to a group. They should not participate, just watch and take notes.
  - Hand each group an envelope labeled "Greenwood Town Information" (with their initial set of index cards) and a sheet with their group's task.

  **0:10 - 0:35 (25 min): Group Work**
  - Groups open their envelopes and read the index cards. They discuss and prepare a presentation.
  - **Bubble Group Cards:**
    1. "Several residents report hearing an unusual chirping sound at night."
    2. "A few gardens have had berries go missing, with small bite marks found."
    3. "A blurry photo taken at night shows a small, fast-moving creature with a bushy tail."
    4. "Local squirrel population has been increasing."
    5. "No known bird in the area makes such a sound."
  - They are likely to conclude: it's a new type of squirrel.

  - **Echo Chamber Group Cards:**
    1. "Several residents report hearing an unusual chirping sound at night."
    2. "A few gardens have had berries go missing, with small bite marks found."
    3. "The town council has announced that they are investigating and will have a report next week."
    4. "A local blogger, known for exposing town corruption, suggests the council is hiding something about the park renovations."
    5. "A blurry photo taken at night shows a small, fast-moving creature, but the council says it's inconclusive."
    6. Background: They are told (on a card) that the town council has a history of covering up problems (e.g., last year they denied a water contamination issue until forced to admit it).
    - They are pre-loaded to distrust the council. They might conclude: the council is covering up something (like a toxic spill) and the creature story is a distraction.

  - **Evidential Laundering Group Cards:**
    1. "Several residents report hearing an unusual chirping sound at night — some say it resembles the song of the legendary musician, Old Tom, who used to play in the park."
    2. "A few gardens have had berries go missing, and one resident claims they left berries as an offering to Old Tom's ghost and they were gone in the morning."
    3. "A local historian notes that Old Tom died exactly 50 years ago and legends say his ghost returns to play music."
    4. "A blurry photo taken at night shows a shadowy figure in the park near Old Tom's statue."
    5. Background: They are told that the town's cultural society preserves Old Tom's legacy and they have interpreted recent events through this lens.
    - They are likely to conclude: it's Old Tom's ghost.

  **0:35 - 0:40 (5 min): Mid-Activity Update**
  - Instructor interrupts: "I have an update from the Greenwood Gazette for all groups." Hand each group an index card that says: "Breaking: Local bird expert Dr. Finch confirms the sighting of an Azure-winged Magpie in Greenwood Park. This rare bird is known for its distinctive chirp and for eating berries."
  - Groups have 5 minutes to discuss how this new information fits (or doesn't) into their theory and adjust their presentation if needed.

  **0:40 - 0:50 (10 min): Group Presentations**
  - Each group has 2 minutes to present their theory. Order: Bubble, Echo, Launder.

  **0:50 - 0:55 (5 min): Voting and Truth Reveal**
  - The class votes by show of hands: "Which group's explanation was the most convincing?" (Don't say correct, just convincing.) Tally on the board.
  - Then, the instructor reveals the truth from a sealed envelope: "The truth is: the Azure-winged Magpie is responsible for the chirping and missing berries. It's a rare bird that migrated to the area. There is no squirrel, no cover-up, and no ghost."
  - Announce which group was closest to the truth (bubble) and award each member of that group an extra participation point.

  **0:55 - 1:15 (20 min): Debrief**
  - This is the critical part. Start by asking the observers to report briefly (2 min each) on what they saw in terms of group dynamics, especially in reaction to the update.
  - Then, map to the three mechanisms without naming them yet:
    1. Ask the bubble group: "When you heard about the bird expert, did you change your mind?" (They likely did: exposure to the missing information fixed their view.)
    2. Ask the echo group: "When you heard about the bird expert, what did you think?" (They might have distrusted the expert, especially if tied to the council. They might have doubled down on the cover-up: the council brought in an expert to push the bird story.)
    3. Ask the launder group: "How did you fit the bird into your ghost theory?" (They might say: the bird is a messenger of the ghost, or the ghost is using the bird, etc. They laundered the evidence.)

  - Now introduce the terms:
    - **Epistemic Bubble:** The bubble group didn't have the bird information initially. Once they got it, they updated. That's an epistemic bubble: missing information, and exposure fixes it.
    - **Echo Chamber:** The echo chamber group had the information but distrusted the source. Exposure to more information from the same source (or authority) made them more distrustful. They are insulated by discrediting the source.
    - **Evidential Laundering:** The launder group took the same fact and reinterpreted it to fit their existing belief. They didn't deny the bird, but they made it part of the ghost story.

  - Discuss the payoff: Each student in the bubble group got an extra point because their group was right. But in the echo and launder groups, going along with the group (distrusting the bird expert or laundering the evidence) was individually rational (they got participation points for contributing to the presentation and being convincing) but collectively costly (they didn't get the extra point for being correct).

  **1:15 - 1:15 (final moments): Diagnostic Questions**
  - Hand out a slip of paper with two diagnostic questions for real-world cases:
    1. If you show someone new information and they change their mind, it was probably an epistemic bubble.
    2. If they reject the information because of its source, it might be an echo chamber.
    3. If they accept the fact but reinterpret it to fit their existing view, that's evidential laundering.

  **Predictable Problems:**
  1. **Sharp Student:** If a student figures out the setup early, they might try to meta-game (e.g., in the bubble group, they might say "I bet it's a bird" because they know the activity is about information). How to handle: In the instructions, emphasize that they should role-play as members of the Greenwood community and base their conclusions only on the information provided. If someone resists, say: "For the sake of the activity, try to think like someone in this town who only has these facts." 
  2. **Refusal to Play Along:** If a student says it feels manipulative, acknowledge: "Yes, we are creating artificial information environments to study how they affect reasoning. It's a simulation to help us understand real-world dynamics. Your awareness of the setup is valuable, and we'll discuss that in the debrief." Then, if they still resist, allow them to be an observer (but we already have three). Alternatively, have them participate but note their concerns for the debrief.
  3. **Instructor as Authority:** The update comes from the instructor (as the Greenwood Gazette). This makes the instructor an authority. In the echo group, they might distrust the instructor. In the debrief, acknowledge: "In this activity, I was the one delivering the update. Did that affect how you received it? In the real world, distrust of authorities is a key part of echo chambers." This becomes a teaching moment.

  **What the Exercise Can't Reproduce:**
  - Real echo chambers are built over years and tied to identity and community. The costs of leaving are high (social exclusion). We can only simulate the cognitive mechanisms, not the emotional and social stakes.
  - Algorithmic curation: We can't simulate how algorithms feed information. We have to state that in the real world, algorithms can create bubbles by only showing you what you like.

  **Final Note:** The activity is designed to be engaging and active. The invented scenario avoids political triggers. The sealed truth envelope provides a clear resolution. The debrief explicitly connects the classroom experience to the concepts.

  **Materials Checklist:**
  - Prepare index cards for each group (with group label).
  - Prepare observer note sheets (with prompts: How did the group react to the initial info? How did they react to the update? Did anyone change their mind? Did they reinterpret the update?).
  - Sealed envelope for truth reveal.
  - Instructions for group task (same for all): "With your group, review the information and develop a theory about what is causing the unusual events in Greenwood. Prepare a 2-minute presentation to share your theory with the class. Be convincing!"
  - Whiteboard/projector for timing and voting.

  This should fit the 75-minute slot and meet all constraints.
answer: |-
  ### Greenwood Town Mystery: Classroom Activity on Information Environments

  Here’s a complete 75-minute activity designed around your goals: illustrating epistemic bubbles, echo chambers, and evidential laundering through a fictional, non-political scenario (a mystery in the town of Greenwood). The **determinate truth** is that the disturbances are caused by a rare bird called the Azure-winged Magpie. Students won’t hear the terms "bubble," "echo chamber," or "laundering" until the debrief. The activity uses three simultaneous groups (8 students each) to model the mechanisms, with observers to help you track dynamics.

  ---

  ### **Setup and Materials**
  **Scenario:** Greenwood Town is experiencing strange events: unusual chirping sounds at night, missing berries from gardens, and blurry photos of a small creature. Three community groups have competing theories.  
  **Truth:** The Azure-winged Magpie (rare bird) migrated to the area. It chirps, eats berries, and is fast-moving.  

  **Materials per Group:**  
  - **Index cards** with scenario details (tailored to each group’s mechanism).  
  - **Sealed truth envelope** (opened by you at the end).  
  - **Observer note sheets** (for 3 assigned observers—one per group).  
  - **Whiteboard/projector** for timings and voting.  
  - **Coffee voucher** for the payoff scheme.  

  **Group Assignments (3 groups of 8):**  
  - **Group A (Epistemic Bubble):** Only receives information supporting the "Chirping Squirrel" theory. Never exposed to the bird.  
  - **Group B (Echo Chamber):** Gets bird information but is primed to distrust authorities (e.g., the "Town Council").  
  - **Group C (Evidential Laundering):** Gets bird information but reinterprets it as evidence for their "Ghost of Old Tom" theory.  

  **Observer Role:** Assign 3 observers (one per group) during setup. They take notes on:  
  - How the group reacts to new information.  
  - If they change their minds or double down.  
  - How they treat conflicting evidence.  

  **Payoff Scheme (Individual Rationality vs. Collective Cost):**  
  - **Participation points (low-stakes):** Each student earns 1 point for contributing to their group’s discussion and 1 point if their group’s presentation is voted "most convincing." (Points can go toward a quiz grade.)  
  - **Coffee voucher:** Awarded randomly to one student in the group closest to the truth (Group A).  
  - **Why it works:** Going along with the group is rational (students earn points by contributing to/defending their theory), but collectively costly (Groups B and C won’t get the voucher or the "closest to truth" bonus).  

  ---

  ### **Minute-by-Minute Timings**  
  **Total: 75 minutes**  
  *(I recommend three simultaneous groups because it lets students experience the mechanisms firsthand without waiting, creates peer-driven dynamics, and avoids singling anyone out. Observers help you capture details.)*  

  | Time | Phase | Activity |  
  |------|-------|----------|  
  | **0:00-0:10**<br>(10 min) | **Introduction** | - Briefly frame the activity: "We're exploring how communities solve mysteries. Split into three groups, each representing a Greenwood community. You'll get clues about strange events. Your goal: build a theory and present it. The most convincing group earns points."<br>- Split students into Groups A, B, C (count off 1-3). Assign one observer per group (give them note sheets).<br>- Hand each group an envelope with index cards and instructions. **Instructions (same for all):** *"Review your clues. Discuss: What’s causing Greenwood’s events? Prepare a 2-minute presentation arguing your theory. Everyone must contribute!"* |  
  | **0:10-0:35**<br>(25 min) | **Group Work (Part 1)** | Groups discuss clues and build theories. **No outside information!**<br>- **Group A (Bubble):** Cards only mention squirrels (e.g., *"Chirping sounds match squirrel vocalizations," "Bite marks on berries resemble squirrel teeth," "Photo shows bushy tail—likely a squirrel"*). They’ll likely conclude "Chirping Squirrel."<br>- **Group B (Echo Chamber):** Cards include bird clues but discredit sources (e.g., *"Council says it’s a bird, but they lied about water safety last year," "Expert hired by Council is unreliable," "Photo looks like a bird, but Council could be faking it"*). They’ll likely suspect a "Council cover-up."<br>- **Group C (Laundering):** Cards frame bird evidence as ghost-related (e.g., *"Chirping is ghostly music," "Bird sightings? Ghosts use animals as messengers," "Missing berries? Ghosts demand offerings"*). They’ll likely conclude "Ghost of Old Tom." |  
  | **0:35-0:40**<br>(5 min) | **Update Delivery** | Interrupt groups: "Breaking news! Greenwood Gazette reports: *‘Bird expert confirms rare Azure-winged Magpie in town. It chirps, eats berries, and is fast.’*"<br>- Hand each group an identical update card with this text. Groups discuss how it fits their theory. |  
  | **0:40-0:55**<br>(15 min) | **Group Work (Part 2)** | Groups refine presentations with the update. **Key moments:**<br>- *Bubble (A):* Likely updates to "bird" theory (exposure fixes).<br>- *Echo (B):* Doubles down on distrust (e.g., "The Council paid the expert!").<br>- *Launder (C):* Reinterprets the bird (e.g., "The magpie is the ghost’s familiar!"). |  
  | **0:55-1:05**<br>(10 min) | **Presentations** | Each group presents (2 min max). Order: A → B → C. Observers watch for reactions. |  
  | **1:05-1:10**<br>(5 min) | **Voting & Truth Reveal** | - Class votes by show of hands: "Which presentation was most convincing?" Tally votes on board.<br>- Open sealed truth envelope: "The truth: Azure-winged Magpie caused all events. No squirrel, cover-up, or ghost." Announce Group A is closest. Award voucher to a random Group A student. |  
  | **1:10-1:15**<br>(5 min) | **Transition to Debrief** | Ask: "Based on the truth, which group was most accurate? How did the update affect you?" (Brief reactions only—save analysis for debrief). |  

  ---

  ### **Debrief (1:15-1:30, 15 Minutes)**  
  **Goal:** Map in-room moments to the three mechanisms. Start with observer reports, then connect to concepts.  

  | Step | Script | Rationale |  
  |------|--------|-----------|  
  | **1. Observer Reports (3 min)** | "Observers, share: What did you see when groups got the update?"<br>- *Bubble (A):* "They accepted the bird quickly."<br>- *Echo (B):* "They dismissed the expert as corrupt."<br>- *Launder (C):* "They said the bird ‘proves’ the ghost theory." | Grounds discussion in concrete behaviors. Observers act as your eyes. |  
  | **2. Mechanism Mapping (5 min)** | Ask groups:<br>- *To Bubble (A):* "When you heard about the bird, why did you change your mind?" → *"You had missing information. Getting it fixed your view."*<br>- *To Echo (B):* "Why did the update make you trust the Council less?" → *"You’d already been told to distrust sources. New evidence felt like manipulation."*<br>- *To Launder (C):* "How did the bird report become proof of the ghost?" → *"You didn’t deny the fact—you redescribed it to fit your story."* | Uses student experiences to define mechanisms without jargon. |  
  | **3. Introduce Terms (3 min)** | "What you experienced has names:  
  - **Epistemic bubble:** You only heard one side (Group A). Exposure fixes it.  
  - **Echo chamber:** You heard the other side but were primed to distrust it (Group B). Exposure backfires.  
  - **Evidential laundering:** You twisted facts to fit your view (Group C). Evidence doesn’t help—it gets ‘laundered’." | Labels the mechanisms after students have felt them. |  
  | **4. Payoff Discussion (2 min)** | "Why did Groups B/C stick to their theories? Because you earned points by contributing—going along was smart individually. But collectively, you missed the truth." | Highlights individual rationality vs. collective cost. |  
  | **5. Real-World Diagnostics (2 min)** | "Outside class, ask:  
  1. If new evidence changes minds → it’s a *bubble*.  
  2. If evidence makes people dig in → it’s an *echo chamber*.  
  3. If evidence is ‘recycled’ to support the group → it’s *laundering*." | Gives students practical tools. |  

  ---

  ### **Handling Predictable Problems**  
  1. **Sharp student who meta-games:**  
     - **Risk:** A student says, "This is about confirmation bias!" early on.  
     - **Mitigation:** In the intro, emphasize role-playing: "You’re townspeople—use only your clues." If meta-gaming arises, redirect: "Interesting! But for this, stick to your group’s perspective." If they resist, assign them as an extra observer.  
     - **Debrief leverage:** Use their comment later—"Some spotted the setup. Real echo chambers work because people *don’t* realize it."  

  2. **Student who feels manipulated:**  
     - **Risk:** A student says, "You’re tricking us!"  
     - **Mitigation:** Acknowledge openly: "Yes, I designed information environments to simulate real dynamics. It’s not about fooling you—it’s about experiencing how easily this happens. Your discomfort is part of the lesson." Offer them the observer role if they withdraw.  

  3. **You as the untrustworthy authority:**  
     - **Risk:** Students (especially Group B) distrust your "Greenwood Gazette" update.  
     - **Mitigation:** Lean into it during debrief: "Did anyone question *me* delivering the update? In echo chambers, distrust of authorities is key. I became part of the experiment!"  
     - **Credibility fix:** After revealing the truth, say: "I kept it sealed to show I wasn’t manipulating the outcome."  

  ---

  ### **What the Exercise Can’t Reproduce (and How to Address It)**  
  - **Long-term buildup & identity ties:** Real echo chambers form over years and involve social identity. Students won’t feel emotional stakes.  
    - **State this:** "In real life, these groups feel like ‘who you are.’ Leaving costs friends or status. We simulated the thinking, not the heart."  
  - **Algorithmic curation:** You can’t replicate YouTube or Facebook algorithms.  
    - **State this:** "Algorithms feed bubbles by hiding dissent. Here, I manually controlled your info—IRL, it’s automated."  
  - **Costs of leaving:** No real risk for abandoning the group.  
    - **State this:** "In class, you won’t be shunned for changing your mind. But in extremist groups, you might."  

  ---

  ### **Why This Works**  
  - **Non-political & invented:** The bird/squirrel/ghost scenario avoids real-world triggers.  
  - **Determinate truth:** The sealed envelope creates a "reveal" moment where students see Group A was factually right—but Group B/C "won" the vote.  
  - **All-inclusive activity:** No one is singled out; groups create peer pressure naturally. Observers ensure you catch details.  
  - **Debrief precision:** You’ll see clear in-room examples (e.g., Bubble Group updating, Echo Group doubling down) to map to mechanisms.  

  **First-Run Tip:** Do a dry run with colleagues to tweak clues. Focus on making the laundering subtle (e.g., Group C should genuinely believe the bird "fits" their ghost theory). Good luck—your students will remember this!
