  Brainstorming word roles: TICKET/ODDS for lottery's false security, ERRATA/FALLIBLE for preface's intimate doubt. CLOSURE will be the recurring intruder in both. In stanza 5, "note" becomes the new lottery announcement, making sentences into tickets. Tornada's last line "FALLIBLE" withholds judgment deliberately. 

  Writing now: First stanza builds lottery comfort ("No need to check each TICKET"), second escalates false confidence ("So many ways to lose! The ODDS console"). Third shifts to authorial voice with ERRATA, fourth deepens FALLIBLE unease. Fifth introduces the note as external verdict, sixth shows both paradoxes persisting. Tornada pairs CLOSURE/ODDS then ERRATA/TICKET before ending on solitary FALLIBLE. 

