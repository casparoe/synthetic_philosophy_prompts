answer: |-
  ### Brainstorm  
  - **TICKET/ODDS/SURE**: Lottery’s scaffolding (external odds, tangible slips).  
  - **ERRATA/FALLIBLE**: Preface’s intimate dread (internal accounting, inherent flaw).  
  - **CLOSURE**: The intruder in both, hammering shut doors that should stay open.  
  - **Turn (stanza 5)**: Copy-editor’s note reframes the author’s sentences as lottery tickets. "The note" makes explicit what the preface only inferred.  
  - **Tornada**: Withholds resolution by pairing CLOSURE with ODDS (lottery’s false math) and ERRATA with TICKET (preface’s claims now gambles), ending on solitary FALLIBLE—the burden unnamed.  

  ---

  ### SESTINA: TWO PARADOXES AT THE PRINTERS  

  No need to check each flimsy **TICKET** twice—  
  The drum’s impartial spin assigns the **ODDS**.  
  To hold one is to know it’s not the **SURE**  
  corruption of your hope. The cold **CLOSURE**  
  demanded by the rules? No page of **ERRATA**  
  prepares you for this proof: we’re **FALLIBLE**.  

  So many ways to lose! The **ODDS** console  
  like stacked, unopened envelopes. Each **TICKET**  
  bears its own doom. You feel it, **FALLIBLE**  
  as breath. But isn’t comfort almost **SURE**  
  when chances drown the thought? This **CLOSURE**  
  craves the whole flock, though one hides **ERRATA**.  

  But here’s my pen. This text, no **ERRATA**  
  yet graces, stands composed. I know the **ODDS**  
  of flawless work—like hoping **CLOSURE**  
  won’t snap its jaws. For every **TICKET**  
  I’ve punched with ink, I’d call the claim near **SURE**…  
  Yet books like mine confess: *We’re **FALLIBLE***.  

  The press awaits. How starkly **FALLIBLE**  
  this feels—to sign, despite foreknown **ERRATA**,  
  the preface page. Each chapter seemed so **SURE**  
  in isolation. Who computes the **ODDS**  
  on error creeping in? Not like a **TICKET**  
  drawn blind. My own mind trips up **CLOSURE**.  

  Then—*ping*—a note arrives. “One **CLOSURE**  
  fails. One claim’s false.” No mark. Now **FALLIBLE**  
  as any slip of card, each **TICKET**-  
  sentence quivers. See? This cold **ERRATA**  
  strikes *after* typeset, shifts the **ODDS**  
  from “mine” to “drawn.” Was any page **SURE**?  

  This ink was almost dry. Almost **SURE**.  
  The note slams shut a different **CLOSURE**:  
  my careful proofs now hostage to the **ODDS**  
  I thought I’d left behind. **FALLIBLE**,  
  I scan for where the **ERRATA**  
  might nest—my own thought turned **TICKET**.  

  **ERRATA** haunt the press; the **TICKET** waits.  
  The **ODDS** demand, the **SURE** evaporates.  
  **CLOSURE**? Forged. We rest **FALLIBLE**.  

  ---

  ### Answer Key (For TA Eyes Only)  
  1.  **Stanzas 1-2**: Lottery Paradox (external odds, tangible tickets, false summation).  
  2.  **Stanzas 3-4**: Preface Paradox (author's internal certainty per claim + awareness of fallibility).  
  3.  **Stanza 5**: Copy-editor’s note case. Shows how *external* notification (like lottery results) converts claims into lottery tickets—structurally distinct from the preface’s *self-generated* doubt.  
  4.  **Burden Placement**: The paradoxes split at the source of the "at least one false" premise. Lottery/copy-editor: externally imposed certainty forces failure onto closure. Preface: self-acknowledged fallibility makes justification *itself* the unstable element.
