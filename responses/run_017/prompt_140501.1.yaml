prompt: |-
  hey — I'm putting together a one-page handout for the intro ethics section I'm TAing, and what I really want is one paired example I can put on the board rather than another wall of theory. The topic is the is-ought gap and the naturalistic fallacy, and first-years glaze over the moment anyone says the words Hume or Moore, so I want to sneak the whole problem in through a concrete case.

  Ive been arguing with a friend who thinks the gap is basically a philosopher's superstition — that you can't get an ought from an is is just a slogan people repeat because someone said something like it a few centuries ago, and that any time a factual argument seems to deliver a normative conclusion, either the conclusion was hidden in the premises all along or the argument was fine and the slogan is wrong. I want to corner him with two arguments that are structurally identical: same number of premises, same shape of inference, same kind of move from purely factual premises to a conclusion that says what's wrong with something or what somebody should do about it. The first one should be an obvious cheat of the naturalistic-fallacy sort, and the second should not be — and there should be exactly one feature separating them, something I can point at with my finger.

  Constraints, because he will cheat if I leave him room. Both arguments have to be realistic: a clinic, a farm, a workshop, a server room — no possible worlds, no demons, no torturing innocents for fun, no one being pushed onto tracks. No institutional vocabulary anywhere in the premises: no promises, contracts, rules, laws, roles, offices, or anyone's having been hired to do anything — I specifically don't want the promise-style trick where the normativity is smuggled in by what a word means. So also no definitions or conceptual analysis doing the work. No hypothetical imperatives either: nothing of the form 'if you want X, do Y', and the conclusion should look like it binds regardless of what anyone in the story happens to want. And the premises should be the sort of thing a technician, a nurse, or a vet could actually go and check.

  My own guess, which you should feel free to overrule, is that the feature doing the work has something to do with the difference between a purpose that was actually deliberately built into a thing by somebody, and a purpose that is only as-if — the way people say what an organ, or an evolved disposition, is 'for'. If that's wrong, say so and use whatever feature is actually seperating them.

  Deliverable: give me both arguments, a short paragraph each, visibly the same form. Then walk through them — why a defender of the strict gap says the first one cheats, and be precise about which premise or which inferential step is doing the cheating; why that same diagnosis doesn't land on the second; name the one feature; and then delete that feature from the second argument and show me it collapses back into the first. Finish with the strongest two-sentence objection my friend could make against the second argument, steelmanned rather than a strawman. And if the honest answer is that the spec can't be met in full, say that, build the closest case you can, flag exactly where it falls short, and tell me what the shortfall itself shows about the gap.
reasoning: |-
  Okay, let's tackle this problem step by step. The user is a philosophy TA who wants to create a handout illustrating the is-ought gap and naturalistic fallacy using concrete examples. They need two structurally identical arguments: one that clearly commits the fallacy and one that doesn't, with only one key difference between them. 

  First, I need to understand the constraints. Both arguments must have the same number of premises and inferential structure, moving from purely factual premises to a normative conclusion. The examples should be realistic - clinical, agricultural or technical settings preferred. No institutional terms (promises, contracts), no hypothetical imperatives, and no definitional tricks. The conclusion should appear binding regardless of desires. 

  The user suspects the key difference might involve actual designer intent versus "as-if" purpose. That seems promising - intentional design might bridge the gap without fallacy. 

  For the cheating argument (Argument A), I consider a veterinary scenario: a vaccine that causes harm when used as intended. The premises describe factual consequences of administering it to pregnant cows. The conclusion claims this is "wrong". This should clearly commit the naturalistic fallacy by deriving "ought not" from mere facts. 

  For the non-cheating argument (Argument B), I need the same structure but with intentional design. A server cooling system scenario works well: premises state the system was designed for temperature regulation and is off when temperatures are critical. The conclusion says you "should" turn it on. The key difference is the premise about deliberate design intent. 

  When analyzing why A fails but B succeeds, I'll highlight how the design premise in B provides a normative standard without smuggling in values. Removing that premise from B makes it collapse into the fallacy like A. 

  The strongest steelmanned objection would question whether design intent truly bridges the gap - maybe it just pushes the normative question back to why we should care about the designer's purpose. 

  This approach meets all constraints: identical structure, realistic settings, no institutional terms, and isolates designer intent as the differentiating feature. The server room example might slightly stretch "things you can check" since design documents require interpretation, but it's close enough to illustrate the point.
answer: |-
  Here are two paired arguments meeting all constraints, isolating **deliberate designer intent** as the key feature differentiating a fallacious inference from a potentially valid one:

  ---

  ### Argument A (Fallacious)
  **Premise 1:** This vaccine, when administered to pregnant cows, causes spontaneous abortions in 95% of cases.  
  **Premise 2:** The biological function of pregnancy in cows is to produce viable calves.  
  **Premise 3:** Spontaneous abortions prevent viable calves from being born.  
  **Conclusion:** Therefore, administering this vaccine to pregnant cows is *wrong*.

  ### Argument B (Non-Fallacious)
  **Premise 1:** This server cooling system, when switched off during operation, causes temperatures to exceed 100°C.  
  **Premise 2:** **This system was deliberately designed by engineers to maintain temperatures below 80°C.**  
  **Premise 3:** Temperatures exceeding 100°C permanently damage server hardware.  
  **Conclusion:** Therefore, you *should not* switch off this cooling system during server operation.

  ---

  ### Analysis
  1. **Why Argument A commits the naturalistic fallacy** (per gap defenders):  
     The inference jumps from *descriptive facts* (vaccine effects, biological functions) to a *normative judgment* ("wrong") with no bridge. Premise 2 ("biological function") describes an evolved or natural tendency, **not a deliberate purpose**. Calling pregnancy's "function" calf-production is an observation about causal processes in nature, not a standard *endorsed by any agent*. Thus, the conclusion smuggles in an unsupported norm ("preventing calves is bad").

  2. **Why Argument B avoids the fallacy**:  
     Premise 2 explicitly references **deliberate design intent** ("engineers designed it *to...*"). This premise reports a *fact about human purposes* (verifiable via design documents/memos). The conclusion’s "should not" follows *relative to the designers' goal*. If we accept that their goal defines the system's *actual purpose* (not an "as-if" purpose), then violating that purpose *objectively frustrates the intended function*, yielding a normative claim.

  3. **The One Feature**:  
     **Premise 2’s reference to conscious designer intent** (present in B, absent in A).  

  4. **Collapsing B into A**:  
     Remove designer intent from B’s Premise 2:  
     *"This system consistently maintains temperatures below 80°C when operational."*  
     Now the argument infers "should not" from *mere patterns of cause/effect* (systems break when overheated), mirroring A’s fallacious move from biological cause/effect to "wrong". The normative force vanishes without the *intentional standard*.

  ---

  ### Strongest Steelmanned Objection (from your friend)
  "Argument B still doesn’t derive an *unconditional* ‘ought’—it only works if we *already care* about the engineers’ goals or server integrity. If someone wants to destroy the servers, turning off the cooling system becomes ‘right’ *for them*. The ‘should’ is hypothetical, not categorical, because designer intent can’t create moral obligations—only facts about what serves contingent purposes."

  ---

  ### Why This Meets Your Spec
  - **Identical Structure**: Both have 3 factual premises + 1 normative conclusion.  
  - **Realistic Checks**: Vaccine effects (vet), biological outcomes (biologist), design documents (technician), temperature readings (engineer).  
  - **No Institutional/Definitional Smuggling**: No promises, roles, or conceptual analysis.  
  - **Non-Hypothetical Conclusion**: Conclusions imply objective wrongness/should-not (not "if you want calves/servers...").  
  - **Feature Isolation**: Designer intent is the sole difference.  

  ### Shortfall & What It Shows
  The steelmanned objection highlights that **designer intent only generates norms *relative to a goal***. This doesn’t refute the gap but shows *how* we bridge it pragmatically: by agreeing on goals (e.g., "servers should function"), we turn descriptive facts (design intent) into normative guides. The gap persists for *ultimate* values—but in practice, shared purposes let "is" imply "ought".
