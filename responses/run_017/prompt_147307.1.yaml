prompt: |-
  Hey — I'm TAing for a second-year philosophy of mind seminar and Thursday's section is on the ant-colony case: whether a colony like Aunt Hillary (the one from the Ant Fugue dialogue, where the individual ants play the role more or less of signals and the colony is the thing that ends up with the beliefs, the tastes, the anxieties, etc.) can really be said to have a mind of its own, and what exactly you're on the hook for if you say yes. I want to open with something that gets an actual laugh instead of another slide, but every joke I can come up with is either just an ant pun or would work exactly the same if you swapped in a robot or a brain in a vat. So: write me three jokes that genuinely depend on the details of this case, in the sense that they'd be confusing or just flat for someone who hasn't followed the argument, and actually funny for someone who has.

  Constraints, sorry to be that guy: each one has to be tellable out loud in under thirty seconds, setup and punchline, no puns built on the word ant or any other bug vocabulary, and nothing where I could swap the colony out for a single organism and lose nothing. Ideally each one squeezes a different bit of the position: (a) the asymmetry where we cheerfully ascribe beliefs and desires to the whole colony while the individual ants look like mere signal traffic, (b) the granularity and death question — take ants away one at a time, or split the colony in half, and something has to be said about when she stops existing or starts being two, and (c) a little wrinkle my section invented last week that definitely isn't in the reading: Aunt Hillary has developed what we started calling colony-level Capgras, where every ant is behaving exactly as if the queen is alive and thriving, the colony is running perfectly, and yet the queen has been dead for three weeks — so if there is a colony-level state of affairs here, there seem to be two incompatible candidates for what she believes, and no ant-level fact that settles it. I'd also like one of the three set at the reading of Aunt Hillary's will, after the colony has been fissioned into two halves, each of which insists it is the original and wants the same share of the estate.

  Along with each joke give me two or three sentences on which feature of the view it's leaning on, and the specific thing a hearer has to have already understood for the punchline to land — I've got maybe ninety seconds of runway before I need to get to the actual argument, and I want to know in advance which ones will just get polite silence if half the room didn't do the reading.
