  7. **Wrap-up (5 mins):** Conclude: the puzzle shows us that to understand the limitations of a formal system, we sometimes need to step outside it.

  ### The Carrying Example (~250 words)

  Use the two-symbol system as an introductory example to teach the invariant concept without the complexity of MIU.

  - **System:** 
    - Alphabet: {●, ▲}
    - Axiom: ●
    - Rules:
        1. From x, derive ▲x. (prefix an ▲)
        2. From x, derive x▲▲. (append two ▲s)
        3. From x, derive x●x. (append the string, but with a ● in the middle? Actually, the rule says: from x derive x●x -> so if x is the whole string, then we get the original string, then ●, then the original string again)

  - **Target:** ●●

  - **Invariant:** The number of ●s is always odd. 
    - Axiom: ● has 1 (odd).
    - Rule1: adds no ● -> same count -> still odd.
    - Rule2: adds no ● -> same count -> still odd.
    - Rule3: if x has k ●s, then x●x has k + 1 + k = 2k+1 ●s -> odd (because 2k is even, +1 is odd).
    - So the invariant: the number of ●s is always odd.

  - Target ●● has 2 (even) -> not derivable.

  - **Why use it?** 
    - It's simpler: the invariant is about parity (a familiar concept). 
    - It isolates the invariant method without the distraction of mod3 and without the doubling rule that changes the residue (here rule3 changes the count but preserves parity). 
    - It prepares for the MIU puzzle: in MIU, the invariant is mod3, which is a generalization of parity.

  - **Transfer:** 
    - Point out: in both cases, we defined a property that the axiom has and that every rule preserves. Therefore, every theorem has the property. The target string does not have the property, so it's not a theorem. 
    - The method is the same, but the property in MIU is more complex (mod3 vs mod2). 

  - **Caution:** 
    - Avoid the misconception that invariants are always about counting: sometimes they are about structure (e.g., the M is always at the beginning). But in this session, counting invariants are the focus.

  ### Misconception Map (~300 words)

  Address these misconceptions in the sequence:

  1. **M, I, U mean something?** 
     - At the start: emphasize that these are meaningless symbols. The system is purely formal. 
     - When they start, if they ask, say: "We are just manipulating strings by rules. The symbols have no inherent meaning."

  2. **If they can't find a derivation in ten minutes, it's impossible?** 
     - Correct this by pointing out that without a proof, we don't know. We need a method (like the invariant) to prove impossibility.

  3. **Rules ought to run backwards?** 
     - Explain that the rules are one-way: we derive new strings from old. We cannot reverse rule 3 (U to III) arbitrarily because the rule only allows replacing III by U, not the other way. The system is defined by the given rules in the forward direction.

  4. **Rule two should apply to any chunk?** 
     - Clarify the rule: "double everything after the M" means the entire tail. Give examples: from MI, we get MII (double "I" -> "II"). From MIIU, we get MIIUIIU. It's the whole substring after M.

  5. **The mod-3 observation is a trick?** 
     - Counter by building the invariant step-by-step and showing the induction. Stress that the invariant is preserved by every rule, and the induction on derivation length is a rigorous proof. This is not a trick but a standard mathematical method.

  6. **The system is defective?** 
     - Explain that the system is consistent: it has many theorems (like MI, MII, etc.) and we proved that MU is not one of them. That's a feature, not a bug. It shows the system's limitations.

  7. **Unprovability from outside is less certain?** 
     - Argue that the proof is mathematically sound: it uses induction and modular arithmetic, which are established. It is as certain as any mathematical proof.

  8. **The gap between "every rule preserves the property" and "every theorem has the property":** 
     - This is the induction step. Explain it explicitly: 
          - The axiom has the property (base case).
          - If we have a string with the property and we apply any rule, the new string has the property (induction step).
          - Therefore, by the principle of induction, every string that is derived (in any number of steps) has the property.

     - This induction is over the construction of theorems: the set of theorems is the smallest set containing the axiom and closed under the rules.

