            - Axiom: 1.
            - Rule1: same A -> at least 1.
            - Rule2: adds two A's -> then we have at least 1 (if we started with at least 1, then after adding 2, we have at least 3 -> still at least 1).
            - Rule3: removing BBB (no A) -> A-count unchanged -> at least 1.
            - Target BB: has 0 A's -> not derivable.

