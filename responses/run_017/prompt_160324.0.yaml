     So in the teaching:

          Step 4: After they notice that they never see a multiple of 3 (except maybe they think they got one but then it turned into MU? But actually they cannot get MIII because they can't produce a string with 3 I's? So they never have the chance to apply rule 3 to get MU? They might have tried to get three I's and failed).

          Then, introduce the invariant: 
            - Define the property P: the number of I's mod 3 is not 0.
