  2. **Exploration (15 mins):** Let them generate theorems. As they work, circulate and ask: "What patterns do you notice?" If they get stuck, prompt: "What rules can you apply to MI?" and "What new strings can you make?" After about 15 minutes, bring the group together and list some theorems they found (e.g., MI, MII, MIU, MIIU, MUI, etc.). 

