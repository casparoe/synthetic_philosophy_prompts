  ### The Sequence  
  Open with the MU-puzzle directly. State the goal: derive MU from MI using the four rules. Let them work in groups for 15 minutes, generating strings (e.g., MI → MII → MIIII → MIU → ...). Circulate and ask: "What patterns emerge in the strings you can produce?" When someone notices the I-count avoids multiples of 3 (e.g., 1, 2, 4, 1 I’s—never 0, 3, 6), pause the exploration.  

  **Step 1: Validate the observation.** List theorems on the board: MI (1 I), MII (2), MIU (1), MUI (1), etc. Ask: "Can anyone produce a string with 3 I’s?" They’ll try and fail (e.g., from MII → MIIII via Rule 2, but never MIII). Highlight that MU requires 0 I’s—a multiple of 3.  

  **Step 2: Introduce the invariant.** Define the property: *I-count mod 3 is never 0*. Show preservation:  
  - Rule 1 (add U): I-count unchanged → mod 3 preserved.  
  - Rule 2 (double after M): If post-M has *k* I’s, new I-count = *2k*. *k* ≡ 1 or 2 mod 3 → *2k* ≡ 2 or 1 mod 3 (never 0).  
  - Rule 3 (III→U): Removes 3 I’s ≡ 0 mod 3 → no change.  
  - Rule 4 (UU→∅): No I-change.  
  Axiom MI has 1 I ≢ 0 mod 3 → all theorems preserve this.  

  **Step 3: Bridge to induction.** Explicitly state: "This shows every *rule* preserves the property, but why does that mean every *theorem* has it?" **This is the jump-out moment.** Frame induction:  
  - Base: MI has I-count ≢ 0 mod 3.  
  - Step: If a string *S* has ≢0 mod 3, any rule applied to *S* yields ≢0 mod 3.  
  - Conclusion: All derivable strings have ≢0 mod 3. MU has 0 → impossible.  
  Emphasize: "This proof lives in *mathematics*—using induction and modular arithmetic—not in the MIU-system’s rules."  

  **Step 4: Defuse derailments.**  
  - When they say "the system is broken": "No, it’s *consistent*—it correctly avoids MU, just as arithmetic avoids 1+1=3."  
  - When they say "nothing can be proved": "We proved something definite: MU’s underivability. This is mathematical certainty, not mysticism."  

  **Step 5: Connect to Gödel (briefly).**  
  - Analogy: Both use "outside" reasoning (Gödel uses arithmetization; we use mod 3).  
  - Limit: Unlike Gödel, MIU has no *semantics*—MU isn’t "true," just underivable. Say: "Gödel constructs a *self-referential* sentence within arithmetic. Here, we’re only proving unprovability from a richer system." Stop here—no arithmetization.  

  Total time: Intro/exploration (20 min), invariant (20 min), induction (20 min), Gödel/defusing (30 min).  

  ---

  ### The Carrying Example  
  Use your ●▲ system. **Axiom: ●. Rules: (1) *x* → ▲*x*, (2) *x* → *x*▲▲, (3) *x* → *x*●*x*. Target: ●●.**  
  - Let them attempt derivation (e.g., ● → ▲● → ▲●▲▲ → ...). They’ll struggle.  
  - Invariant: *Number of ●s is always odd*.  
    - Base: ● has 1 (odd).  
    - Rules: (1) and (2) add ▲s → no change. (3) Doubles ●s (*k* ●s → *2k* + 1 ●s: odd).  
    - Target ●● has 2 ●s (even) → impossible.  

  **Why it works:**  
  - Residue-class focus: "Stays odd" is mod 2. When moving to MIU’s mod 3, say: "Same trick—just a different modulus."  
  - Rules changing counts: Rule 3 alters ●-count (unlike MIU’s U-rules), but preserves parity. This preempts "invariants are trivial" by showing non-trivial preservation.  
  - Avoids misconception: Say explicitly: "Not all unreachability is about counting (e.g., position matters in MIU’s Rule 2), but counting invariants are powerful tools."  

  ---

  ### Misconception Map  
  Address these **in sequence**:  

  1. **"M/I/U mean something"**: Shut this down immediately. Open with: "Symbols are meaningless—focus on syntax." Reiterate when they speculate.  
  2. **"Can’t derive in 10 min → impossible"**: After exploration, say: "Absence of derivation isn’t proof. We need a method."  
  3. **"Rules should run backward"**: When Rule 3 (III→U) arises, ask: "Can U turn into III?" Rule it out: "Rules are one-way—like chess moves."  
  4. **"Rule 2 applies to any chunk"**: Correct during exploration. Demo: From MIIU, Rule 2 yields MIIUIIU (entire post-M doubled), not e.g., MIU.  
  5. **"Mod-3 is a trick, not proof"**: At the induction step, stress: "Preservation per rule isn’t enough. We need induction over *all derivations*." Contrast with a flawed "proof" (e.g., "all strings start with M" is true but not inductive).  
  6. **"System is defective"**: After proving unprovability: "Defective would mean inconsistency. Here, MU’s absence is a feature."  
  7. **"Outside proof is less certain"**: Post-induction: "This is rigorous math—like proving 1+1=2. The ‘outside’ is just a richer system (e.g., arithmetic)."  

  **Core gap:** The induction step (from rule preservation to universal invariant). Isolate it: Write the induction argument formally.  

  ---

  ### The Check  
  **System:** Alphabet {A, B}. **Axiom:** A. **Rules:**  
  1. *x* → *x*B  
  2. *x* → A*x*  
  3. If *x* ends with BB, remove BB.  
  **Target:** B  

  **Why it works:**  
  - Invariant: *All theorems start with A*.  
    - Axiom: "A" starts with A.  
    - Rule 1: Appends B → "…B" still starts with A.  
    - Rule 2: Prepends A → "A…" starts with A.  
    - Rule 3: Removes trailing BB → start unchanged.  
  - Target "B" starts with B → underivable.  

  **Check design:**  
  - Students must decide: Derive or prove underivability?  
  - Those who "memorized mod-3" will try counting (A/B counts mod *k*), but the structural invariant (first symbol) is different.  
  - Success: They recognize no derivation exists and find the invariant.  

  ---

  ### What I Refuse and How I Say So  
  **"Is there a general test for derivability?"**  
  - Answer: "For MIU, yes: *Start with M, only M/I/U, I-count ≢0 mod 3*. But proving *all* such strings are derivable requires combinatorial construction—not today. We proved necessity (derivable → ≢0 mod 3), not sufficiency."  
  - Reframe: "Our focus is unprovability proofs, not decidability."  

  **Gödel analogy limits:**  
  - When asked: "Gödel’s sentence *G* says ‘I am unprovable’—a self-referential twist. Here, MU has no meaning; we just proved it’s unreachable. The parallel is in the *method* (outside proof), not the result."  
  - Stop if they push further: "True self-reference requires arithmetization—beyond our scope."  

  **"Turtles all the way down?"**  
  - Respond: "No—we stand on mathematical bedrock. Induction and mod 3 are tools from a system we accept. This doesn’t create infinite regress; it closes the proof."  

  **Tone:** Be firm but warm. For tangents: "Great question! But to stay on track, let’s discuss that after—I’ll note it down."
