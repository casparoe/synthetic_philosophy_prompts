prompt: |-
  I help run the neighborhood association for my area — nothing fancy, we meet one evening a month in the basement of a library, usually 20 to 35 people, mostly long-time homeowners, a handful of renters, one guy who does drywall and actually knows what things cost to build. I've got a 90-minute slot coming up and I want to do something other than the usual arguiing about a parking variance.

  Here's what I've been chewing on by myself (no background in any of this, I just read a lot and think about it at night): whenever a building with, say, twenty apartments gets proposed on a lot near us, the people who show up are all people who already live here, and the people the building is for are not in the room and don't get a vote. So the meeting almost always outputs no, and it feels principled the whole time, because every single objection is reasonable on its own — traffic, shadows, the school, the sewer line. What I can't get anyone in that room to actually feel is that the outcome is mostly being set by who is allowed a say rather than by anyone's reasons, and that the objections being made would have blocked most of us when we moved in.

  So: design a 90-minute activity for that group, on a fictional proposal of your choosing, using only stuff you could find in a library basement (no money, no projector, phones discouraged). Rules, roles or cards, a minute-by-minute timeline, and a debrief. Nobody should hear the words NIMBY or right to the city until the debrief, and there shouldn't be a lecture up front at all.

  Please build it around three things I've been messing with. First, the arrival test: any objection has to be restated in a form that would also have applied to the objector when they arrived, and someone has to say out loud whether it would have. Second, a spillover deck: when the room votes a project down, we draw a card saying where those households end up instead, and the cost has to land on someone the room can picture — a named relative of a person sitting there, whatever — so that the cost of no stops being invisible and delayed. Third, run the same decision twice with the franchise changed: round one only current residents vote; round two the households the building is for are represented too, and I want the people who have to argue for them chosen by lot from among the loudest opponents. Tell me honestly if that last bit backfires.

  The debrief should map specific moments in the activity onto specific parts of the problem, including the move where someone says I'm not against housing, I'm against this project. Also tell me what will predictably go wrong the first time I run it and how to handle it — assume at least one landlord who owns three rentals and two renters who might get priced out, and they already hate each other. And be frank about which part of the idea the activity can't reproduce at all and I'd just have to say out loud. If you can also work in a way to show the gap between what people say in the room and what they'll write down anonymously, do that too — I suspect that gap is half the story.
reasoning: |-
  We are designing a 90-minute activity for a neighborhood association meeting. The goals are to:
  1. Illustrate how the composition of the room (only existing residents) affects outcomes.
  2. Apply the "arrival test": objections must be restated in a form that would have applied to the objector when they arrived.
  3. Use a "spillover deck" to make the costs of rejection visible and immediate.
  4. Run two rounds: one with only current residents voting, and one with representation for future residents (with opponents arguing for them).
  5. Avoid terms like NIMBY and avoid a lecture. Use an activity format.

  We'll create a fictional proposal: a 4-story, 24-unit apartment building on a vacant lot at 123 Main Street (near the library). The units are a mix of 1- and 2-bedroom, with 10% affordable (as per the city's inclusionary zoning). The lot is currently zoned for single-family but the developer is seeking a variance.

  Materials needed:
  - Index cards for roles and spillover deck
  - Pens
  - A timer (phone timer allowed for facilitator only, or use a watch)
  - A flip chart or large paper to write down objections and run the arrival test
  - A way to randomly assign roles (e.g., drawing from a hat)

  Roles (for about 20-35 participants):
  - Most will be "Current Residents" (longtime homeowners, renters, the drywall guy, etc.)
  - A few (3-5) will be randomly assigned to be "Future Residents" (only in Round 2)
  - One or two "Developers" (to present the project and answer questions)
  - One "City Planner" (neutral, can explain rules and process)

  We'll also have a "Spillover Deck" of index cards. Each card describes where the households (that would have lived in the new building) end up if the project is rejected, and the consequences. Examples:
  - "One household moves in with relatives in a nearby town. The relatives delay having a child because they don't have space."
  - "A young couple pays $500 more per month for an apartment farther away, so they can't save for a down payment."
  - "A single parent commutes an extra hour each way, leading to less time with kids and more traffic for everyone."
  - "A senior on fixed income stays in a larger home they can't maintain, delaying downsizing until they have a fall."

  Timeline (90 minutes total):

  Part 1: Introduction and Setup (5 minutes)
  - Facilitator: "We're going to try something different tonight. We have a fictional proposal for a building at 123 Main Street. We'll have a mock meeting to decide on it. We'll do two rounds. In the first round, we'll run it like a typical meeting. Then we'll do a second round with a twist. Let's assign roles."
  - Assign roles by drawing from a hat:
    - 2 Developers (they get a short description of the project: 24 units, 4 stories, 10% affordable, etc.)
    - 1 City Planner (they know the zoning rules: current zoning allows single-family, but the city has a policy encouraging density near transit and this lot is near the bus line).
    - The rest are Current Residents (including the landlord and renters). Note: The landlord might be a homeowner who owns rentals, and the renters are current residents.

  Part 2: Round 1 - Current Residents Only (25 minutes)
  - Developers present the project (3 minutes).
  - Open floor for questions and objections (15 minutes). The facilitator writes each objection on the flip chart.
  - After each objection, the facilitator applies the "Arrival Test":
    - "Let's restate that objection as if it were made when you moved in. Would that have applied to your home when it was built? We need a yes or no from the group."
    - Example: If someone says "This will create too much traffic," the facilitator asks: "Would that have been said when your house was built? If so, how did that turn out?"
  - Then, vote by show of hands: Approve or Reject the project. Record the result.

  - If the project is rejected (as expected), draw 3 cards from the Spillover Deck and read them aloud. Assign the costs to specific people in the room (by name if possible, or to a group). For example: 
    - "John, your nephew and his wife were hoping to move into one of these units. Now they'll have to live with your brother, causing strain in that household. How do you feel about that?"
    - "Maria, you mentioned your daughter is looking for an apartment. Without this building, she will have to pay more and live farther away. That's a direct result of this vote."

  Part 3: Round 2 - Expanded Franchise (30 minutes)
  - Now, we change the rules: we add representation for the 24 future households.
  - Randomly select 4-5 people from the current residents (especially those who were vocal opponents in Round 1) to be "Future Residents". Give them index cards with a brief backstory (e.g., "You are a teacher who works at the local school and wants to live near work", "You are a senior looking to downsize", "You are a single parent with a job downtown", etc.).
  - Re-run the meeting:
    - Developers give a very short recap (2 minutes).
    - Open floor: Both current residents and future residents can speak. The future residents can explain their situation and why they want the building. The opponents who are now future residents must argue for the project. (15 minutes for discussion)
    - Facilitator again applies the Arrival Test to objections from current residents.
    - Vote: Now all in the room (current and future residents) vote. Record the result.

  Part 4: Anonymous Feedback (5 minutes)
  - Pass out index cards and ask everyone to write anonymously:
    - "In Round 1, what was the most compelling reason to reject the project?"
    - "In Round 2, what changed your mind or didn't?"
    - "What do you think is the fairest way to decide on new housing?"

  Part 5: Debrief (25 minutes)
  - Start by reading a few anonymous responses (without identifying) to show the gap between public and private views.
  - Then, map the activity to reality:
    - "In Round 1, who was missing? The future residents. That's like our real meetings. The objections were reasonable, but note: we applied the arrival test and found that many of our own homes would have been blocked by the same reasons."
    - "When we drew from the spillover deck, we saw that saying no has real costs, and they fall on people we know. In reality, these costs are hidden and delayed."
    - "In Round 2, we expanded who gets a say. Some of you had to argue for the other side. How did that feel? Did it change the outcome? This shows that the rules of the meeting (who votes) can matter more than the reasons."
    - Address the "I'm not against housing, I'm against this project" move: "In Round 1, we heard specific objections. But when we applied the arrival test, we saw that almost any project could be blocked by similar reasons. So if every project is 'this project', then we are effectively against housing."
    - Now you can use the terms: "This is sometimes called the 'veto point' problem or the 'NIMBY' effect. But note: it's not about bad people, it's about a system that only hears one side."
    - "What we can't simulate: In reality, the spillover effects are even bigger and affect housing prices regionally. Also, we can't perfectly represent future residents. But the point is to make the invisible visible."

  Predictable Problems and Solutions:
  1. **The landlord and renters already hate each other**: 
     - In the activity, assign the landlord a neutral role (maybe a current resident homeowner) and the renters as current residents. Avoid making the landlord the developer. If they start arguing, remind them it's a fictional scenario and focus on the activity.
  2. **The spillover deck might feel forced or too personal**: 
     - Prepare generic spillover cards and only use named examples if it feels natural and the person is willing. Have backup generic cards. Say: "This is a simulation to make the point that there are costs to rejection, but in reality, it's spread out."
  3. **Vocal opponents assigned as future residents might refuse to argue or do it half-heartedly**: 
     - Encourage them: "This is just an exercise, try to see it from their perspective." If they resist, ask the group: "What might a future resident say in response?" and let others help.
  4. **Time management**: 
     - Keep a strict timer. Cut off discussion if needed. Have a co-facilitator if possible.
  5. **The group might not reject the project in Round 1**: 
     - Unlikely but possible. If they approve, note that this group is more supportive than usual. Then in Round 2, expand the franchise and see if it changes (it might not, but that's a lesson too).

  What the activity can't reproduce:
  - The long-term regional effects of many such rejections (housing shortages, rising prices).
  - The cumulative impact of small decisions over time.
  - The fact that future residents are not just 24 people but a continuous flow.

  Work in the gap between public and private views:
  - The anonymous feedback in Part 4 will be read in the debrief. This will show that some people might have been swayed in Round 2 but didn't speak up, or had private doubts about the objections.

  Honest note about the last bit (opponents arguing for future residents):
  - It might backfire if the person is very stubborn and makes a weak or sarcastic case. But that in itself can be a teaching moment: "Even when forced to represent, it was hard to do it earnestly. That's why we need real representation." Alternatively, it might humanize the other side. It's a risk, but the potential payoff is high.

  Final timeline breakdown:
  - 5 min: Intro and role assignment
  - 25 min: Round 1 (3 min presentation, 15 min discussion with arrival test, 2 min vote, 5 min spillover deck)
  - 30 min: Round 2 (2 min recap, 15 min discussion, 3 min vote, 10 min for transition and role assignment included in the 30)
  - 5 min: Anonymous feedback
  - 25 min: Debrief

  Total: 90 minutes.

  This should create an engaging, eye-opening experience without lecturing, using only simple materials.
answer: |-
  ### **90-Minute Activity: "The Lot on Maple Street"**  
  *(Designed for your library basement, using index cards, pens, a flip chart, and a hat for drawing roles)*  

  **Fictional Proposal:**  
  A 6-story, 20-unit building on a vacant lot at 123 Maple Street (near the library). Units: 12 one-bedroom, 8 two-bedroom (including 4 income-restricted units). Developer seeks a zoning variance for height and density. Project includes ground-floor retail (a coffee shop).  

  **Why this proposal?**  
  - Relatable (similar to real proposals in your area).  
  - Triggers classic objections (traffic, shadows, "character").  
  - Includes affordable units to surface tensions around gentrification.  

  ---  

  ### **Materials Needed**  
  1. **Role Cards**: 30 index cards (one per participant).  
  2. **Spillover Deck**: 10 index cards with pre-written "cost of rejection" scenarios.  
  3. **Flip Chart**: For scribing objections and running the "Arrival Test."  
  4. **Pens & Hat**: For anonymous feedback and drawing roles.  
  5. **Timer**: A phone timer (facilitator only).  

  ---  

  ### **Setup (5 min)**  
  **Facilitator Script:**  
  *"Tonight, we’re trying a different kind of meeting. We’ll debate a fictional project: a 20-unit building at 123 Maple Street. We’ll run two short votes. I’ll assign roles randomly—some of you will be ‘residents,’ others will play specific parts. No phones, please. Let’s jump in."*  

  - **Assign Roles** (3 min):  
    - Draw cards from a hat:  
      - **18 Current Residents** (Homeowners/Renters): Cards with brief bios, e.g., *"You’ve lived here 20 years. Worried about parking."* Include:  
        - 1 Landlord (owns 3 rentals, bio: *"You rent to students. Fear new units will lower property values."*)  
        - 2 Renters (bios: *"You’ve rented here 5 years. Worried rent will rise if this fails."*)  
      - **2 City Planners**: Neutral. Explain zoning rules.  
      - **1 Developer**: Presents the project.  
    - *Save 5 "Future Resident" cards for Round 2.*  

  - **Flip Chart Setup** (2 min):  
    - Title: "Objections to 123 Maple St."  
    - Two columns: "Objection" and "Arrival Test Pass?"  

  ---  

  ### **Round 1: Current Residents Only (25 min)**  
  *(Only Current Residents + City Planners + Developer participate. Future Residents don’t exist yet.)*  

  1. **Developer Pitch** (3 min):  
     - *"This building adds housing near transit, including 4 affordable units. Retail space will activate the street."*  

  2. **Open Debate** (15 min):  
     - Facilitator invites objections, scribes each on flip chart.  
     - **Apply the Arrival Test immediately after each objection**:  
       - *"Restate this objection as if it applied when YOU moved in. Would it have blocked your home? Let’s vote yes/no as a group."*  
       - **Example**:  
         - Objection: *"Traffic will be unbearable!"*  
         - Arrival Test: *"Would this street have handled traffic when your house was built? If not, should your home have been blocked?"* → Group votes yes/no.  
     - **Anticipate Tensions**: Landlord vs. renters may clash over "property values" vs. "rent hikes." Redirect: *"Let’s run the Arrival Test on that."*  

  3. **Vote & Spillover** (7 min):  
     - Vote by show of hands: Approve or reject.  
     - **If rejected (expected)**: Draw 2 cards from the **Spillover Deck**. Read aloud and "assign" costs:  
       - *Example Card 1*: *"Two households move to a distant suburb. Your cousin’s commute grows by 2 hours. She misses family dinners."* → Assign to a resident with local family.  
       - *Example Card 2*: *"A renter in this room gets a 20% rent hike next year because supply dropped."* → Assign to one of the renters.  
     - **If approved**: Skip spillover (unlikely, but adapt).  

  ---  

  ### **Round 2: Expanded Franchise (30 min)**  
  *(Add 5 Future Residents. Loud opponents from Round 1 must advocate for them.)*  

  1. **Role Shift** (5 min):  
     - Facilitator: *"New rule: The 20 future households get a voice. I’m randomly selecting 5 of you to represent them."*  
     - Draw 5 names from **loudest opponents in Round 1**. Give them "Future Resident" cards with bios:  
       - *"Single mom: Works at the hospital. Needs affordable unit."*  
       - *"Retiree: Downsizing after spouse’s death. Wants walkable area."*  
       - *"Teacher: Can’t compete with bidding wars. Hopes to buy here."*  
     - *"You must argue FOR the project as this person."*  

  2. **Re-Debate** (20 min):  
     - Same project. Developer gives 2-min recap.  
     - Open floor: Future Residents speak first. Facilitator enforces:  
       - Opponents-turned-advocates *must* voice their assigned bio.  
       - Run Arrival Test on any objection from Current Residents.  
     - **Key Moment**: When a Current Resident says, *"I’m not against housing, just this project,"* ask: *"How would you redesign it to pass the Arrival Test?"*  

  3. **Vote** (5 min):  
     - **All** vote (Current + Future Residents). Show of hands.  

  ---  

  ### **Anonymous Feedback (5 min)**  
  - Pass out index cards. Ask:  
    *"Round 1: What was your real reason to reject?  
    Round 2: Did your view change? Why?  
    What’s the fairest way to decide on new housing?"*  
  - Collect cards for debrief.  

  ---  

  ### **Debrief (25 min)**  
  **Goal:** Link activity to reality without jargon. Use anonymous feedback to expose contradictions.  

  1. **Read Anonymous Responses Aloud** (5 min):  
     - Highlight gaps: *"Notice how some said ‘traffic’ publicly but wrote ‘property values’ privately."*  

  2. **Map Activity to Real Problems** (15 min):  
     - **Who Gets a Say?**:  
       *"In Round 1, only people who already lived here voted. The teacher, single mom—they weren’t here. That’s like our real meetings: future residents don’t get a vote, so ‘no’ wins by default."*  
     - **Arrival Test**:  
       *"When we rephrased ‘traffic’ or ‘shadows’ as if it applied to US when we moved in, most objections failed. That’s the point: our homes would have been blocked too."*  
     - **Spillover Deck**:  
       *"Rejecting projects has costs—long commutes, higher rents. We made it personal (e.g., your cousin). In reality, these costs are invisible, but they’re real."*  
     - **"I’m Not Against Housing, Just This Project"**:  
       *"In Round 1, every objection felt reasonable alone. But together, they veto everything. If we kill every project for traffic or shadows, we’re effectively against housing."*  
     - **Expanded Franchise**:  
       *"Round 2 forced us to hear the other side. Some opponents became advocates. Did that feel uncomfortable? Good. It’s easy to say ‘no’ when you don’t see who loses."*  
     - **Finally, Name the Issue**:  
       *"This isn’t about ‘NIMBYs’—it’s about rules that only let incumbents decide. And ‘right to the city’? That’s just a fancy term for letting the people a city is for have a say."*  

  3. **What Couldn’t Be Simulated** (2 min):  
     - *"We couldn’t show the long-term ripple effects: rising prices, displacement, or how 10 ‘no’ votes add up to a housing crisis. We just had to imagine that."*  

  4. **Close** (3 min):  
     - *"Next meeting, let’s apply the Arrival Test to real proposals. And maybe invite some ‘future residents’—like teachers or nurses who want to live here."*  

  ---  

  ### **Predictable Problems & Fixes**  
  1. **Landlord vs. Renters Explodes**:  
     - During the Arrival Test, if they argue, say: *"Let’s test that: Would your objection have blocked YOUR home?"* Forces focus on systemic issues, not each other.  
  2. **Spillover Deck Feels Forced**:  
     - If assigning costs to "your cousin" backfires, use generic cards: *"A young family pays 40% of income on rent in a worse school district."*  
  3. **Opponents-Turned-Advocates Sabotage Round 2**:  
     - Some might half-heart it. Fix: Prep them privately: *"Your job is to make us empathize. Try: ‘What if this was your daughter?’"* If they resist, ask the group: *"What would this future resident say?"*  
  4. **Group Rejects Project in Both Rounds**:  
     - Still useful! Debrief: *"Even with future voices, ‘no’ won. Why? Maybe we need better designs—but that’s a topic for next time."*  
  5. **Time Runs Short**:  
     - Cut debate by 2 min per round. Skip generic objections in Arrival Test.  

  ### **Why the "Loud Opponents as Advocates" Works (and When It Backfires)**  
  - **It Works If**: You pick respected opponents (not the most abrasive). They often humanize the other side, surprising themselves.  
  - **It Backfires If**: They mock the role. Mitigate by:  
    - Choosing opponents who are "principled" not angry.  
    - Using bios that evoke empathy (e.g., "retiree," "teacher").  
    - Debriefing it: *"When you argued for the teacher, did it feel awkward? That’s because we’re not used to centering outsiders."*  

  ### **The Gap Between Public and Private Views**  
  - **How We Show It**: Anonymous cards reveal that private reasons (e.g., "I don’t want renters here") mask public objections ("traffic"). In debrief, contrast written cards with public statements: *"Several wrote that rent hikes scared them, but no one said that aloud. Why?"*  

  ---  
  **Final Tip**: Bring cookies. Low stakes make hard conversations easier. This won’t solve everything, but it will force the room to confront *how* decisions get made—not just the decisions themselves.
