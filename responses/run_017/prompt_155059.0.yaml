    1. **Fact A**: The student plagiarized a specific section of their paper. (Let's say, from Source X)
    2. **Fact B**: The student had proper attribution for Source X elsewhere in the paper, showing they knew how to cite.
    3. **Conclusion**: The student is guilty of academic misconduct.

