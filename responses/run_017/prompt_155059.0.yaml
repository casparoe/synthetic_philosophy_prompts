              Procedure A: Vote directly on R (approve or not).
              Procedure B: Vote on P and Q, and then R is determined by the rule (if both P and Q pass, then R passes; otherwise, R fails).

            Which one do you choose?

            They will choose Procedure A because then R will be rejected (by 14-6). If they choose Procedure B, then R will be approved (since P and Q both passed). 

            So the chair chooses Procedure A and the drug is rejected.

            This shows agenda control.

          But note: if the chair were from Group C (wants approval), they would choose Procedure B? Then the drug would be approved.

          We can assign the chair from Group A (so they want rejection) and they choose Procedure A.

          Then we vote by Procedure A: direct vote on R -> rejected.

          Then we reveal that if they had chosen Procedure B, it would have been approved.

          This shows how the outcome depends on the procedure.

          Phase 6: Debrief (20 minutes)

          Guiding questions:

            - What happened in the separate votes? (P passed, Q passed, R failed)
            - What does the rule say should happen to R? (It should pass because P and Q passed)
            - What happened when we voted directly on R? (It failed)
            - What does this tell us about majority rule on multiple issues? (The group's set of judgments can be inconsistent even though every individual is consistent)
            - How did the agenda setter influence the outcome? (By choosing to vote directly on R, they got the outcome they wanted)

          Then introduce the name: This is known as the doctrinal paradox. (Also related: discursive dilemma, Ostrogorski paradox)

          Abstention discussion:

            - What if someone abstains? How would that affect the outcome?
            - Example: if one student in Group A abstains on Q, then Q would still pass (because 13-1=12 votes for Q, which is still a majority of 20? 12>10? But if we require a majority of those present and voting, then 12 out of 19 is a majority). But then the inconsistency remains: P passed, Q passed, R failed.

            - What if we had a rule that required unanimity? Or supermajority?

          Truth-tracking:

            - Is one procedure more likely to get the correct outcome? 
            - There is a literature: 
                * If the voters are more reliable on the premises (P and Q) than on the conclusion (R), then the premise-based procedure (voting on P and Q and then deriving R) is more likely to get the correct R.
                * If they are more reliable on the conclusion, then the conclusion-based (direct vote on R) is better.
            - But this depends on the actual setup.

          What can go wrong?

            - A sharp student might say: "This is like the Condorcet paradox" or "This is the doctrinal paradox" early on. How to handle? You can say: "We'll come back to that in the debrief" and continue.

            - The votes might not split as planned. We are assigning roles, so we control the votes. But what if a student votes against their role? We can avoid that by giving them a card that says "You must vote as follows: ..." and we'll use those votes. We can collect the votes and then if someone votes differently, we can adjust? But we don't want to fudge. 

            Instead, we can have the students turn in their votes on index cards and we tally them. If there's a deviation, we can note it and still get the numbers? For example, if one student in Group A votes for Q: Yes, then:

              Group A: 6 votes: Q: No, 1 vote: Q: Yes.
              Then on Q: 
                Group A: 6 No, 1 Yes
                Group B: 7 Yes
                Group C: 6 Yes
              Total Yes: 1+7+6=14; No:6 -> majority Yes (still).

            So the outcome is robust to one or two deviations? We have a margin.

          Timing:

            Phase 1: 10 min
            Phase 2: 5 min
            Phase 3: 10 min (collect and tally three votes)
            Phase 4: 10 min (discussion and direct vote on R)
            Phase 5: 15 min (agenda control and vote)
            Phase 6: 20 min (debrief)

            Total: 10+5+10+10+15+20 = 70 minutes. Close.

          We can cut Phase 4 to 5 min discussion and 2 min vote? Then 7 min. And Phase 5 to 10 min? Then 10+5+10+7+10+20 = 62. Then we have time for questions.

          Alternatively, if time is tight, we can skip the agenda control part? But it's a nice addition.

          We can do:

            Phase 1: 10
            Phase 2: 5
            Phase 3: 10
            Phase 4: 5 (discussion) + 3 (vote) = 8
            Phase 5: 10 (agenda control and vote)
            Phase 6: 25 (debrief) - and include the abstention discussion and truth-tracking.

          But 10+5+10+8+10+25=68 minutes.

          We have 75, so we can add 7 minutes buffer.

          Materials:

            - Role cards: A (7), B (7), C (6) with voting instructions.
            - Index cards for voting.
            - Tally sheets.

          Scenario write-up for students:

            **Drug Approval Committee**

            You are members of the Drug Safety and Efficacy Committee. You are reviewing a new drug, "MediCure," intended to treat a serious condition. The committee's rule is: the drug should be approved if and only if it is both effective and safe.

            You have been assigned a role based on your review of the evidence. Please vote according to the perspective described in your role card.

            Role Card A:
              - You believe: 
                 - Effectiveness: The drug is effective. (Vote P: Yes)
                 - Safety: The drug is not safe. (Vote Q: No)
                 - Approval: You vote against approval. (Vote R: No)

            Role Card B:
              - You believe:
                 - Effectiveness: The drug is not effective. (Vote P: No)
                 - Safety: The drug is safe. (Vote Q: Yes)
                 - Approval: You vote against approval. (Vote R: No)

            Role Card C:
              - You believe:
                 - Effectiveness: The drug is effective. (Vote P: Yes)
                 - Safety: The drug is safe. (Vote Q: Yes)
                 - Approval: You vote for approval. (Vote R: Yes)

          For the agenda control phase:

            Chair Role Card (given to one student from Group A or B, secretly):

              "You are the chair of the committee. Your goal is to have the drug rejected. You must choose one of the following two procedures:

                Procedure 1: The committee votes directly on whether to approve the drug (R). The outcome is decided by majority vote.

                Procedure 2: The committee votes on effectiveness (P) and safety (Q). Then, the approval (R) is decided by the rule: if both P and Q are approved, then the drug is approved; otherwise, it is rejected.

              Which procedure do you choose? (You may explain your choice of procedure to the committee with a neutral reason, but do not reveal your goal.)"

          The chair will likely choose Procedure 1 because that leads to rejection. If they choose Procedure 2, then the rule would lead to approval (because P and Q are both approved by majority).

          Then we vote using the chosen procedure.

          This activity should illustrate:

            - The doctrinal paradox (inconsistent group judgment).
            - The dependence of the outcome on the voting procedure (agenda control).

          Let's hope the students play their roles!

          If we run short of time, we can skip the agenda control part and just do the debrief on the paradox.

          This design avoids fudging because we assign the votes.

          We have not included an abstention, but we can discuss it in the debrief: "What if a member is unsure about safety? How should we handle abstentions? Does it matter?"

          Truth-tracking: 
            - We can say: 
                * If we think that the committee members are better at judging the evidence on effectiveness and safety separately than at making the overall decision, then the premise-based procedure (voting on P and Q) might be better.
                * If they are better at the overall decision, then the conclusion-based procedure (voting on R) might be better.
            - But note: in our example, which procedure is more likely to be correct? We don't know the truth. But we can ask: in the real world, how do we design decision procedures for such bodies?

          This should fit in 75 minutes.
