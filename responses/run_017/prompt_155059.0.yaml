  - **P**: The student copied text without citation. (Fact A)
  - **Q**: The student had a valid reason for the omission (e.g., they did cite in a way that was acceptable, but not obvious). (Fact B)
  - **R**: The student is guilty of academic misconduct.

  The verdict R should be true only if P and not Q. That is: if they copied without citation (P) and did not have a valid reason (not Q), then they are guilty (R). But if they had a valid reason (Q), then even if they copied (P), they are not guilty (not R). Also, if they didn't copy (not P), then not guilty regardless of Q.

