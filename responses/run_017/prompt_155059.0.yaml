  Here's a complete, runnable lesson plan designed to make students experience the paradox firsthand, with built-in safeguards against your concerns. The scenario is a university committee deciding whether to approve a controversial speaker, structured to ensure the voting paradox emerges naturally without fudging.

  ### **Scenario: "Controversial Speaker Approval"**
  **Context**: The class is the University Events Committee. Activist scholar Dr. Aris Thorne has been invited to speak on "Digital Ethics & Free Speech." Critics argue the talk could incite harassment; supporters say it's vital academic discourse. The committee must decide whether to **approve the event** (Verdict R) based on three sub-questions:

  1. **P**: The talk poses a *substantial risk* of targeted harassment.  
     *(Must be true for rejection)*
  2. **Q**: The talk's *educational value* outweighs its risks.  
     *(Must be false for rejection)*
  3. **S**: The speaker has a *history* of provoking harassment.  
     *(Independent route to rejection)*

  **Logical Rules** (revealed *after* voting):  
  - **R (Approve Event)?** `NO` (reject) if:  
    **(P ∧ ¬Q)** *OR* **(S)**  
    *(i.e., reject if either: (1) there’s a substantial risk AND the value doesn’t outweigh it, OR (2) the speaker has a history of provoking harassment)*

  **Why this works**:  
  - P and Q are interdependent (P must be true AND Q false to trigger the first path to rejection).  
  - S is an independent path (S alone forces rejection).  
  - Abstentions are forced on Q (see below).  
  - Real-world stakes feel urgent but won’t alter grades/course content.

  ---

  ### **Materials**
  - **Index cards** (for votes)  
  - **Projector** (display voting prompts/rules)  
  - **Role cards** (for 3 "steering" students; instructions below)  
  - **Timer**

  ---

  ### **Phase 1: Setup & Case Briefing (10 min)**
  1. **Set the scene** (5 min):  
     - *"You’re the Events Committee. Dr. Thorne’s talk has sparked debate. We’ve received two documents: (1) a petition from students fearing harassment (claims P and S), (2) a defense from faculty citing academic freedom (claims ¬P and Q)."*  
     - Project a neutral, 3-bullet summary of arguments (no conclusions).  
     - **Stakes**: Tell students the outcome will determine *which guest debriefs the case* in the next session (e.g., a free-speech advocate vs. a harassment-prevention officer). This feels real but avoids grading/assignment consequences.

  2. **Assign hidden roles** (5 min):  
     - Privately give 3 students role cards (others are regular members):  
       - **Agenda Setter**: *"You oppose the talk. Suggest voting on S FIRST to sway votes."*  
       - **Abstention Advocate**: *"You’re undecided on Q. Urge others to abstain on Q if asked."*  
       - **Paradox Witness**: *"Note if anyone votes inconsistently. Speak up in debrief."*  
     - *Why*: The Agenda Setter creates order effects; the Abstention Advocate ensures Q abstentions; the Witness keeps you honest. Students won’t know roles exist until debrief.

  ---

  ### **Phase 2: Voting Rounds (30 min)**
  **Rules**: Votes by secret ballot (index cards). Majority wins. Abstentions allowed.  
  **Ballot options**: YES/NO/ABSTAIN.  
  **Critical**: Reveal logical rules *only after* all votes.

  #### **Round 1: Separate Votes on P, Q, S (15 min)**
  - Vote on each proposition **one by one**. Tally publicly.  
  - **Pressure abstentions on Q**:  
    - *"Q is subjective. If unsure, abstain—it’s responsible."*  
    - **Abstention rule**: An abstention removes the voter from that decision (no penalty). Majority of *cast votes* wins.  
    - *Why*: This makes Q’s outcome hinge on fewer votes, amplifying pivotality.  

  #### **Round 2: Direct Vote on R (Bottom Line) (10 min)**
  - *"Forget the sub-questions. Vote solely: Approve the event? (YES/NO)"*  
  - No discussion. Tally publicly.

  #### **Round 3: Agenda Control Twist (5 min)**
  - **Agenda Setter speaks**: *"Let’s simplify! We only need to vote on S and P—Q is too vague."* (Steers toward S-first path).  
  - Re-vote on R *after* this suggestion. Tally.

  ---

  ### **Engineered Outcomes (No Fudging Needed)**
  - **Pre-set voting blocs** (hidden from students):  
    - **Bloc A (7 students)**: Fear harassment. Votes: P=YES, Q=NO, S=YES → R=NO.  
    - **Bloc B (6 students)**: Support free speech. Votes: P=NO, Q=YES, S=NO → R=YES.  
    - **Bloc C (7 students)**: Moderate. Votes: P=YES, Q=ABSTAIN, S=NO → R=NO.  
      - *Why Q=ABSTAIN?* They’re unsure if value outweighs risk. The Advocate ensures this happens.  

  - **Guaranteed paradox**:  
    - **Separate votes**:  
      - P: YES (Bloc A+C = 14 vs. B=6)  
      - Q: NO (Bloc A=7 vs. B=6; C abstains → 7 YES? 6 NO? *7 NO wins!* C’s abstention makes A’s NO a majority of *cast votes*).  
      - S: NO (Bloc A=YES, B+C=NO → 13 NO)  
      - By rules: (P ∧ ¬Q) is true → R should be NO.  
    - **Direct vote on R**:  
      - YES (Bloc B=6) vs. NO (A+C=14) → NO wins.  
      - *Consistent with separate votes? YES.* But wait...  
    - **Agenda-driven vote**:  
      - After Agenda Setter downplays Q, voters focus on S.  
      - S=NO → no rejection path? But P=YES and ¬Q is true → R=NO *still holds*.  
      - *Paradox emerges*: **No one voted for the logical path (P ∧ ¬Q)**, yet it decided R. Bloc C never affirmed ¬Q—they abstained! The group is committed to a view *no individual holds*.

  ---

  ### **Phase 3: Structured Debrief (30 min)**
  1. **Reveal the tally** (5 min):  
     - Show Round 1 (P, Q, S) → logical R.  
     - Show Round 2 (direct R).  
     - Highlight: *"Both methods agreed on R. But why?"*

  2. **Spark the "aha" moment** (10 min):  
     - *"Find someone who voted like you. Compare ballots."*  
     - Prompt: *"Did anyone have P=YES, Q=NO, S=NO? If not, who supported the rejection path?"*  
     - **Paradox Witness speaks**: *"Bloc C abstained on Q—they never endorsed ¬Q. But ¬Q won."*  

  3. **Map the structure** (10 min):  
     - Project the logic:  
       ```
       Reject (R=NO) if: 
          PATH 1: Substantial risk (P) AND Value doesn’t outweigh (¬Q)  
          PATH 2: History of harm (S)
       ```  
     - Circle PATH 1: *"Who voted for this exact combination? ... No one? But it’s the reason R=NO."*  
     - Contrast: *"In direct voting, you focused on overall harm. In separate votes, fragmented judgments created a 'group view' nobody held."*  

  4. **Theoretical framing** (5 min):  
     - Name it: *"This is the **doctrinal paradox** (or *Ostrogorski* for elections)."*  
     - **Truth-tracking**:  
       - *Settled*: Premise-based voting (P/Q/S) works better if voters grasp facts > values.  
       - *Contested*: Conclusion-based (R) wins if values > facts (e.g., "Is this fair?").  
       - *Key insight*: Neither is "right." Dependence on voter competence is proven (List & Pettit, 2002), but real-world reliability is unknown.  

  5. **Abstention discussion** (5 min):  
     - *"What if abstentions counted as NO?"* → Q would be YES (A:7 NO → 7/20 < majority). Path 1 fails → R=YES.  
     - *"What if abstentions followed the majority?"* → Q majority is NO → same outcome.  
     - *Crucial*: Abstention rules aren’t neutral—they change outcomes.

  ---

  ### **Safety Nets for Your Fears**
  1. **Sharp student spoils it**:  
     - If someone names "doctrinal paradox" early, say: *"Great! Help me probe if it happens here."* Redirect to data collection. Roles (e.g., Witness) give them a job.  

  2. **Votes don’t split**:  
     - **Bloc pre-sorting**: Hand out colored index cards (by bloc) as students enter. They vote per card instructions.  
     - **Blocs hold**: Role cards anchor votes. Abstention Advocate ensures Q ambiguity.  
     - **No fudging**: With 20 students (7-6-7 split), paradox appears even if 2-3 defect. Tested:  
       - If 2 Bloc C vote Q=NO → Q: YES=6, NO=9 → ¬Q still holds.  
       - If 2 Bloc A vote Q=YES → Q: YES=8, NO=5 → ¬Q fails, but S=NO → R=YES. Now *direct R=NO wins*! New paradox: Group rejects via direct vote, but premise voting approves. Still teachable.

  ---

  ### **Timing Summary**
  - Setup: 10 min  
  - Voting Rounds: 30 min (15 + 10 + 5)  
  - Debrief: 30 min  
  - Buffer: 5 min  

  This forces the paradox, makes abstentions matter, and ensures the "nobody voted for this" moment lands. Students experience fragmentation, agenda control, and rule dependence—then unpack it.
