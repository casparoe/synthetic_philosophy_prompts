prompt: |-
  I'm a software engineer — roughly twelve years, mostly backend and distributed systems — with no formal philosophy background, and I've ended up responsible for writing up a disagreement that started in a reading group three sessions ago and has not moved since. What I want from you is the document we should have produced at the start: the joint statement of an adversarial collaboration.

  The topic is the procreation asymmetry: the pair of claims that (i) there is no moral requirement to bring into existence a person whose life would, on the whole, be good, and (ii) there is a moral requirement not to bring into existence a person whose life would, on the whole, be bad. (I gather this is the sort of view associated with Narveson and Benatar, but I don't care about attribution. Please give me no citations, no bibliography, and no reading list — I have no library access and no way to check them, and they would be useless to me.)

  The two camps are:

  Camp A, the unified or axiological camp: the two halves are a single datum, and the correct explanation is one axiological asymmetry about absences — roughly, that the absence of pain is good even when there is no one whose absence of pain it is, while the absence of pleasure is not bad when there is no one who is thereby deprived of it.

  Camp B, the two-grounds or deontic camp: the two halves are not one datum. The no-duty-to-create half follows from there being no one who could be wronged or benefited by not being created, together with the optionality of creating; the duty-not-to-create half follows from the wrongness of imposing a bad life on someone who will then exist. The asymmetry is a conjunction of two claims with different grounds, and the axiological formulation is at best a redescription of that conjunction rather than an explanation of it.

  Note that both camps accept the asymmetry in the clear cases. The residual disagreement is about its ground, and therefore about what happens outside the clear cases. That is where I want the document to live.

  Please produce:

  1. A numbered section of agreed claims — claims both camps can sign without hedging. Some should be negative (what both sides reject): both, I assume, reject the move of saying that never existing is worse for the person who never exists, and both accept that the clear cases are not where the argument is decided. I want claims a partisan of each camp would actually put their name to, not diplomatic filler.

  2. A disagreements table, with columns for the question at issue, Camp A's position in wording a Camp A partisan would accept as their own, Camp B's position in wording a Camp B partisan would accept as their own, and a note on whether you take the disagreement to be genuine or merely verbal. Where you think part of it is verbal, say which part and why.

  3. A cruxes section: the sub-questions such that settling one would move at least one side. For each crux give the sub-question, one concrete case both sides would accept as bearing on it, and — written down in advance — what each side predicts the correct treatment of that case to be, together with what each side would count as an argument or result against its own view. The cases I have in mind are below; substitute or add better ones if you have them, and keep each case self-contained, since I want to be able to hand this to the group without explaining anything:

  - The fixed-number, different-people case: exactly one of two possible people will be created; both lives would be worth living; one would go clearly better than the other. Is there reason to create the better-off one, and if so what kind of reason is it?
  - The aggregation case: a choice between creating many lives each worth living and creating one equally good life. Does the claim that the first outcome contains more value do any action-guiding work, or is it idle?
  - The wronged-but-happy case: someone is created for a bad reason, or as a mere means to someone else's ends, has a life worth living, and suffers nothing. Is creating them permissible, and which account has the resources to explain the verdict?
  - The baseline question in item 5, if you judge it to survive.

  4. Two short paragraphs, one per camp, on the shape of the thing that would actually move that camp: the kind of case, argument, or cost that would make them give ground. Not sources — the shape of the consideration.

  5. Two conjectures of mine, which I would like you to adjudicate plainly. If either is confused, say so and tell me what I am conflating.

  - The null-versus-zero switch. In my day job, a surprising number of arguments turn out to be off-by-one or type errors about the baseline: whether you pass None into a function that expects a number, or a zero. My suspicion is that arguments on both sides quietly switch between treating the person never exists as a state the comparison can take (zero welfare, no bearer) and treating it as the absence of any relatum at all, and that the dispute looks deeper than it is because the switch is invisible. Is this a live crux that both camps would recognize as one, or am I importing a confusion from my own field?
  - The two-metrics picture. I also suspect that part of the stalemate is that one side is reporting on something like an outcome-value metric (is the resulting state of the world better?) and the other on something like a per-person error metric (was anyone wronged?), that each is right about its own metric, and that the disagreement about which metric is authoritative never gets stated. Same question: real crux, or my confusion?

  Write it so that a graduate student in each camp could sign their side of it, and gloss every term of art the first time you use it — person-affecting, impersonal value, and anything else along those lines. I have no philosophy training. I would rather have a document that is picky and precise than one that sounds authoritative.
reasoning: |-
  Hmm, the user is a software engineer with 12 years of experience in backend and distributed systems. They're tasked with resolving a philosophical stalemate in their reading group about the procreation asymmetry. They need a structured document for an adversarial collaboration between two camps: Camp A (axiological, unified explanation) and Camp B (deontic, two-grounds explanation).

  The user explicitly wants no citations or bibliographies—just a clean, usable document. They've outlined five specific sections: agreed claims, disagreements table, cruxes with concrete cases, moving considerations for each camp, and adjudication of their two conjectures.

  Breaking this down:

  First, the agreed claims section needs substantive, non-diplomatic points both sides genuinely endorse. Key elements: both reject "never existing is worse for the non-existent," both accept the asymmetry in clear cases, both deny that non-existence is comparable to existence for welfare assessments. Must avoid filler—every point should be battleground-relevant.

  For the disagreements table, I'll need three columns: question, Camp A's verbatim position, Camp B's verbatim position, and notes on whether the disagreement is substantive or partly verbal. Crucial to flag where terminology might cause false disputes (e.g., "wronging" might be equivocal). 

  The cruxes section is where the rubber meets the road. User provided four cases—I'll use all but suggest integrating the baseline question into the fixed-number case. For each crux: concrete case, both camps' predictions, and crucially—what would falsify their view. Cases must be self-contained; no external references needed. 

  For the "moving considerations" paragraphs, I'll focus on what would make each camp budge: for Camp A, if duties can exist without beneficiaries; for Camp B, if axiological asymmetries become unavoidable in aggregation. 

  Finally, adjudicating the user's conjectures: 
  - The null-vs-zero switch is real but insufficient. Both camps reject welfare assignments to non-existence, but the dispute runs deeper than a type error. 
  - The two-metrics picture captures the core divide. Camp A cares about states of the world; Camp B about patient-focused wrongs. This is the central unstated conflict. 

  Terminology glosses are essential: "person-affecting," "impersonal value," etc., must be defined inline on first use. Precision over flair—this is a technical document. 

  Structure outline:
  1. Agreed Claims: 5-7 bulletproof statements 
  2. Disagreements Table: 3-4 rows dissecting core conflicts 
  3. Cruxes: 4 cases with falsifiability conditions 
  4. Moving Considerations: 2 pragmatic paragraphs 
  5. Conjecture Adjudication: direct verdicts on both 

  The tone should be forensic, not conciliatory. Partisans must recognize their positions accurately. Since the user lacks philosophy training, every specialized term gets unpacked immediately—e.g., "impersonal value (value not indexed to particular persons)".
answer: |-
  Below is an adversarial collaboration document addressing the procreation asymmetry dispute. It adheres strictly to your specifications: no citations, self-contained cases, glossed terminology, and precision over authority. Designed for partisan endorsement, each camp's wording reflects their core arguments.  

  ---

  ### **Adversarial Collaboration: Grounds of the Procreation Asymmetry**  
  **Agreed Claims (Section 1)**  
  Both camps endorse the following without reservation:  
  1. **Asymmetry Acceptance**: In paradigm cases:  
     - (i) There is no *duty* to create a person whose life would be net good.  
     - (ii) There is a *duty* not to create a person whose life would be net bad.  
  2. **Rejection of Comparability**: "Never existing" is *not* a state that can be better or worse *for* a non-existent individual. Non-existence lacks a subject for whom welfare comparisons apply.  
  3. **No Welfare Baseline**: We reject assigning "zero welfare" to non-existence. Non-existence is not a welfare state (e.g., "neutral") but an *absence* of a welfare subject.  
  4. **Problem Location**: The disagreement is not about the asymmetry in clear cases but about:  
     - Its grounds (unified explanation vs. dual sources).  
     - Implications for non-paradigm cases (e.g., different-number choices).  
  5. **No Simple Conflation**: Both reject the claim that the asymmetry reduces to "avoiding harm is obligatory, providing benefit is optional." This misdescribes the duty-not-to-create.  

  ---

  ### **Disagreements Table (Section 2)**  
  | **Question at Issue** | **Camp A (Unified/Axiological)** | **Camp B (Two-Grounds/Deontic)** | **Genuine or Verbal?** |  
  |------------------------|----------------------------------|----------------------------------|-------------------------|  
  | **What explains the duty-not-to-create?** | The absence of suffering is *good* impersonally (i.e., good *simpliciter*, not merely for a person), even if no one exists to experience it. Creating suffering introduces badness. | The duty arises from *wronging* the created person by imposing a net-bad life. No one is wronged by not being created. | **Genuine**. Camp A invokes impersonal value; Camp B rejects impersonal moral weight. |  
  | **What explains the no-duty-to-create?** | The absence of pleasure is *not bad* if no one exists to be deprived. Thus, not creating a net-good life lacks negative axiological weight. | No person is deprived or wronged by non-creation. Creating is optional absent a patient to benefit. | **Partially verbal**. Both agree "no one is deprived," but Camp A sees this as an axiological feature; Camp B as a deontic constraint. |  
  | **Is the asymmetry reducible to one principle?** | Yes: Axiological asymmetry about *absences* (absent pain = good; absent pleasure ≠ bad). | No: Two distinct principles: (1) No duty without a subject to benefit; (2) Duty not to harm subjects we create. | **Genuine**. Camp A seeks a unified theory; Camp B denies its possibility. |  

  ---

  ### **Cruxes and Test Cases (Section 3)**  
  #### **Crux 1: Does impersonal value guide action in same-number cases?**  
  - **Case (Fixed-Number, Different-People)**: Choose to create either Person A (life: +100 welfare) or Person B (life: +50 welfare). Both lives are net-good.  
    - **Camp A Prediction**: We *should* create A. The outcome with A has *more impersonal value* (greater total welfare).  
    - **Camp B Prediction**: No *duty* to create either. No existing person is wronged by creating B. Creating A is permissible but not required.  
    - **What falsifies?**:  
      - If Camp A must concede no duty to create A, their axiology lacks action-guiding force.  
      - If Camp B must concede a duty to create A, their "no duty without beneficiary" claim fails.  

  #### **Crux 2: Can aggregation override person-affecting constraints?**  
  - **Case (Aggregation)**: Choose between creating 100 people (each +10 welfare) or 1 person (+10 welfare).  
    - **Camp A Prediction**: Creating 100 is better—it produces *more impersonal value* (total +1000 > +10). This value generates a pro tanto reason.  
    - **Camp B Prediction**: No *duty* to create either. The "total value" is idle—no one is wronged by creating fewer.  
    - **What falsifies?**:  
      - If Camp A denies a duty to create the many, aggregation is inert.  
      - If Camp B admits a duty to create the many, they accept impersonal aggregation.  

  #### **Crux 3: Does creation for bad reasons wrong the created?**  
  - **Case (Wronged-but-Happy)**: Create a person as a mere means (e.g., organ donor for another), but their life is net-good (+50) and they never suffer.  
    - **Camp A Prediction**: Permissible. No suffering exists, and the absence of pleasure for others isn’t bad. No axiological flaw.  
    - **Camp B Prediction**: *Impermissible*. The person is *wronged* by being created as a tool, even if their life is good.  
    - **What falsifies?**:  
      - If Camp A must forbid this, they need non-axiological duties.  
      - If Camp B permits this, their "wronging" claim is undermined.  

  #### **Crux 4: Does "non-existence" function as a baseline?**  
  - **Case (Baseline Integration)**: Add a third option to Crux 1: create *no one*.  
    - **Camp A Prediction**: Creating no one is *better* than creating B but *worse* than creating A (impersonal value: A > nothing > B).  
    - **Camp B Prediction**: Creating no one is *neutral*—no duties attach to it. Creating A or B is merely permissible.  
    - **What falsifies?**:  
      - If Camp A ranks "nothing" between A and B, they treat it as a comparable state.  
      - If Camp B denies any evaluative comparison involving "nothing," their view is consistent.  

  ---

  ### **What Would Move Each Camp (Section 4)**  
  - **Camp A (Unified)**: Would concede if forced to admit a **duty** in a case with *no suffering, no deprivation, and no impersonal gain* (e.g., Crux 3 permitted *without* any value difference). This would show their asymmetry is insufficient to capture deontic intuitions.  
  - **Camp B (Two-Grounds)**: Would concede if a case demanded **aggregation across persons** to avoid an intuitively terrible outcome (e.g., *not* creating 1,000 good lives when no existing person is harmed by creating them). This would show their "no beneficiary, no duty" constraint is implausibly restrictive.  

  ---

  ### **Adjudicating Your Conjectures (Section 5)**  
  1. **Null-vs-Zero Switch**:  
     - **Verdict**: **Real but partial crux**. Both camps explicitly reject treating non-existence as "zero welfare" (Agreed Claim 3). However, Camp A *implicitly* treats "no one exists" as an evaluable state (e.g., "better than creating a bad life"), while Camp B treats it as *non-comparable*. Your insight exposes a genuine ambiguity: Is "nothing" a *state of the world* (Camp A) or an *absence of patients* (Camp B)? This is live and relevant, but not the whole dispute.  

  2. **Two-Metrics Picture**:  
     - **Verdict**: **Core genuine crux**. You are correct:  
       - Camp A uses an **impersonal metric**: "Which outcome is better *simpliciter*?" (e.g., less suffering = better).  
       - Camp B uses a **person-affecting metric**: "Was anyone wronged or benefited?" (e.g., no beneficiary = no duty).  
     - The stalemate arises because both metrics yield the same results in paradigm cases but clash elsewhere (e.g., aggregation). The unstated disagreement is about which metric is morally authoritative. **This is the central conflict.**  

  ---  
  **Glossary**  
  - **Impersonal value**: Value not indexed to impacts on specific persons (e.g., "a world with less pain is better" even if no one experiences the reduction).  
  - **Person-affecting**: Moral considerations require a subject who is benefited or harmed (e.g., "no harm, no foul").  
  - **Pro tanto reason**: A reason that counts in favor of an action but may be overridden.  
  - **Deontic**: Duty-based (contrasted with axiological/value-based).  

  This document isolates the core disputes, provides testable predictions, and identifies underacknowledged structural conflicts. Both camps should recognize their positions and the burdens of proof implied by the cases.
