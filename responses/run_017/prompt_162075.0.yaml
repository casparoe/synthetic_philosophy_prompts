answer: |-
  Below is a taxonomy-structured handout for your reading group, built from the logical space of idealized preference theories. The tree starts from a shared root, branches at critical questions, and assigns named views to leaves where they fit. Each leaf includes: (1) a description, (2) its most awkward commitment, and (3) what it would hand to a powerful optimizer. Empty branches are flagged, as are indistinguishable leaves. The taxonomy has **12 leaves**, with anti-paternalism and proceduralism as explicit exits.

  ---

  ### **Taxonomy of Idealized Preference Views**  
  **Root**: Defer to preferences improved by idealization, not occurrent desires.  

  #### **Branch 1: Purpose?**  
  *What is the idealization for?*  
  - **A. Welfare** (identifying what is *good for* the person)  
  - **B. Authority** (identifying what we are *permitted to do* or what they would consent to)  

  #### **Branch 2A (Welfare): Scope of Idealization?**  
  *What defects are corrected?*  
  - **A1. Narrow**: Only subtracts **factual ignorance** and **instrumental irrationality** (e.g., means-end errors).  
    - *Leaf 1: Williams-style* (sound deliberative route from existing motivations)  
      - **Desc.**: Idealization refines desires using existing motivations + full information + instrumental rationality.  
      - **Awkward**: If someone’s core motivation is harmful (e.g., bigotry), refinement may still justify it.  
      - **Optimizer cmd**: "Pursue what the person would choose after rational deliberation from current motives."  
  - **A2. Moderate**: Subtracts **ignorance**, **irrationality**, and **incoherence** (desire conflicts).  
    - *Leaf 2: Unnamed coherence-focused welfare view*  
      - **Desc.**: Adds coherence to narrow idealization; no experience expansion or metaphysics changes.  
      - **Awkward**: May retain coherent but impoverished desires (e.g., a hermit’s perfectly consistent isolation).  
      - **Optimizer cmd**: "Maximize coherence-satisfaction under full info + instrumental rationality."  
  - **A3. Broad**: Subtracts **ignorance**, **irrationality**, **incoherence**, **impoverished experience**, and **false metaphysical beliefs**; may *add* new desires via experience.  
    - *Leaf 3: Brandt-style* (full information + cognitive psychotherapy)  
      - **Desc.**: Desires reformed via exposure to all facts, logic, and vivid experiences of alternatives.  
      - **Awkward**: Therapy could erase deeply held values (e.g., faith-based desires) as "irrational."  
      - **Optimizer cmd**: "Achieve what the person would desire after cognitive psychotherapy + full info."  

  #### **Branch 2B (Authority): Scope of Idealization?**  
  *What defects are corrected?*  
  - **B1. Narrow**: Only **ignorance** and **irrationality** subtracted.  
    - *Leaf 4: Veil of ignorance* (ex ante choice under ignorance)  
      - **Desc.**: Agents behind a veil choose rules for society, ignorant of their own traits.  
      - **Awkward**: Assumes risk-aversion (e.g., maximin) is universally rational.  
      - **Optimizer cmd**: "Implement rules chosen by rational agents unaware of their social position."  
  - **B2. Moderate**: Subtracts **ignorance**, **irrationality**, and **incoherence**.  
    - *Leaf 5: Hare-style* (universalization across persons)  
      - **Desc.**: Agents adopt preferences they would hold if they occupied all affected roles.  
      - **Awkward**: Universalized desires may contradict personal integrity (e.g., self-sacrifice).  
      - **Optimizer cmd**: "Satisfy preferences each agent would hold if they were everyone involved."  
  - **B3. Broad**: Subtracts **ignorance**, **irrationality**, **incoherence**, **impoverished experience**, and **metaphysical false beliefs**; may *add* desires.  
    - *Leaf 6: CEV-style* (coherent extrapolated volition)  
      - **Desc.**: Extrapolate individual desires to coherence + full info, then seek convergence.  
      - **Awkward**: Divergent ideals or unresolvable conflicts break the model.  
      - **Optimizer cmd**: "Extrapolate each person’s values to ideal conditions + aggregate where convergent."  

  #### **Branch 3 (All Paths): Order-Sensitivity?**  
  *Does step-order matter (e.g., inform then cohere vs. cohere then inform)?*  
  - **Yes (Non-commutative)**: Outcome depends on sequence.  
    - *Leaf 7: Unnamed non-commutative view*  
      - **Desc.**: Some defects (e.g., incoherence) must be fixed before others (e.g., ignorance).  
      - **Awkward**: Arbitrariness in choosing sequence (e.g., why coherence before metaphysics?).  
      - **Optimizer cmd**: "Apply idealization steps in [specified sequence]; output result."  
  - **No (Commutative)**: All sequences reach the same endpoint.  
    - *Leaf 8: Unnamed commutative view*  
      - **Desc.**: Idealization steps are path-independent; endpoint is fixed.  
      - **Awkward**: Assumes all defects are separable and additive (e.g., ignorance doesn’t warp coherence).  
      - **Optimizer cmd**: "Apply all idealization steps in any order; output stable result."  

  #### **Branch 4 (All Paths): Meta-Preferences?**  
  *Can a preference against idealization veto the process?*  
  - **Yes**: Current "don’t idealize me" commands override.  
    - *Leaf 9: Anti-paternalist*  
      - **Desc.**: Occurrent desires are authoritative; idealization is irrelevant or impermissible.  
      - **Awkward**: Forces deference to self-destructive preferences (e.g., addiction).  
      - **Optimizer cmd**: "Maximize satisfaction of current, unaltered preferences."  
  - **No**: Idealization proceeds regardless.  
    - *Leaf 10: Unnamed non-veto view*  
      - **Desc.**: Meta-preferences are defects to be corrected by idealization.  
      - **Awkward**: Authoritarian; ignores autonomy even when idealized selves might reject the process.  
      - **Optimizer cmd**: "Idealize all preferences (including meta-ones); output result."  

  #### **Branch 5 (All Non-Anti-Paternalist Paths): Identity/Special Cases?**  
  *Is the idealized self still "you"? How handle non-existence/replacement?*  
  - **A. Continuous self**: Idealized self must share core traits; rejects replacement/non-existence.  
    - *Leaf 11: Unnamed continuity-constrained view*  
      - **Desc.**: Idealization stops if it dissolves identity (e.g., values built on false metaphysics).  
      - **Awkward**: May preserve harmful desires if they’re identity-constitutive (e.g., cult indoctrination).  
      - **Optimizer cmd**: "Idealize only if endpoint retains continuity with current self; else defer to occurrent."  
  - **B. Discontinuous self**: Defers to endpoint even if unrecognizable or desiring replacement.  
    - *Leaf 12: Unnamed discontinuity-accepting view*  
      - **Desc.**: Any idealized endpoint counts, even if it erases current values or seeks oblivion.  
      - **Awkward**: May endorse self-destruction (e.g., "ideal me wants to die, so allow suicide").  
      - **Optimizer cmd**: "Pursue the endpoint of idealization unconditionally."  

  ---

  ### **Key Notes for Discussion**  
  1. **Empty Combinations** (no coherent/named views):  
     - **Welfare + Aggregation**: Welfare views don’t aggregate across people (by definition).  
     - **Non-commutative + CEV**: CEV assumes steps commute (divergent sequences would undermine convergence).  
     - **Authority + Purely Epistemic**: Authority requires normative force beyond epistemic access (unattractive).  

  2. **Indistinguishable Leaves**:  
     - *Leaf 8 (Commutative)* and *Leaf 6 (CEV)* overlap if CEV assumes commutativity. CEV’s convergence requirement makes it separable in practice.  
     - *Leaf 10 (Non-veto)* and *Leaf 12 (Discontinuous)* often align (if no veto, discontinuity is accepted).  

  3. **Missing Named Views**:  
     - **Purely epistemic** (idealization as discovery) fits *Leaf 1 (Williams)* or *Leaf 3 (Brandt)* but is *not a distinct leaf*—it’s a subtype of welfare where idealization is truth-tracking (implied in descriptions).  
     - **Go procedural** is *Leaf 9 (Anti-paternalist)* if rejecting idealization, or a meta-leaf (not shown) if rejecting the framework.  

  ---

  ### **How to Use This Handout**  
  - **Sorting Exercise**: Have members defend choices at each branch (e.g., "Should coherence come before experience?").  
  - **Loss Function Focus**: For each leaf, debate the optimizer command (e.g., "Is cognitive psychotherapy operationalizable?").  
  - **Awkwardness Tests**: Use edge cases (e.g., replacement-preferring selves) to stress commitments.  

  This tree exposes conflations (e.g., welfare vs. authority) and forces clarity on operationalization. Forks without named views are opportunities to articulate new positions!
