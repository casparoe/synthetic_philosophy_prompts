  *The search extends, no counter found as yet.*  

  *This program running halts or never will.*  
  A nervous hand resets to thirty-eight.  
  *The search extends, no counter found as yet.*  
  (Was that a rhythm in the mechanism’s weight?)  

  A nervous hand resets to thirty-eight.  
  One checkpoint cleared: the odds climb fifty-five.  
