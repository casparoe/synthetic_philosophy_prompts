prompt: |-
  I host a fortnightly recorded interview series on practical rationality: one guest, no audience, and a standing rule that we never spend time on how the guest got into the topic or on recommendations for further reading. My next guest is a philosopher of action who has just published a monograph on sunk costs. Her positive thesis — she calls it the fidelity account — is that honoring sunk costs is not a deviation from rationality but the diachronic analogue of loyalty, that the prospectivist verdict ("only prospective costs and benefits matter") rests on a metaphysical error rather than a decision-theoretic one, namely treating the deliberating agent as a time-slice cut loose from her own past, and that once agency is understood as temporally extended, sunk-cost sensitivity is at worst permissible partiality toward one's earlier self and at best something the prospectivist owes us an explanation for lacking.

  She is fluent, and she has one maneuver I want to plan around. Faced with a case in which honoring sunk costs looks costly, she re-describes the options until what looked sunk turns out to bear on the future: the cathedral matters to her now, the marriage has reshaped her practical identity, abandoning the research program would betray the collaborators who joined it. The move is often legitimate, and I do not want to rule it out by fiat — but I want the sequence to make it progressively harder to lean on, and to end somewhere it cannot be used at all.

  Please draft eight to ten interview questions, none of which let her simply restate the view, and each of which presses where the debate actually presses. I want at least one question on each of the following:

  1. The collapse objection: if her reason for continuing the marriage, the doctorate, or the business is that her skills, relationships and self-conception are already bound up with it, isn't that just prospectivism applied to a richer description of the options? What is left of the fidelity account once option-description has been enriched?

  2. The epistemic reading: sunk costs are often good evidence that a project was promising, and an agent with limited self-knowledge might reasonably treat her own past outlay as a signal of a judgment made under better information. But if that is all there is, an agent with direct access to the evidence and transparent self-knowledge should be wholly insensitive to sunk costs. Does she accept that consequence, and if not, what does fidelity add once the evidence is already in?

  3. The act/disposition gap: the credibility and self-governance reply (one finishes things because being the sort of person who finishes is what makes long projects possible at all) seems to justify a disposition rather than the individual act. If she grants that, is she committed to a form of rational irrationality — the well-functioning agent should be moved by considerations she knows to be irrelevant — and how does that sit with her own apparent willingness to recommend that people be trained out of sunk-cost reasoning?

  4. Fidelity under an adverse past: the rationale seems to presuppose a past self worth being loyal to. What happens when the initial outlay was made under manipulated information, by a self she now repudiates, or toward an end she now judges worthless or worse? And what does the account say about costs incurred by others on her behalf, or costs she imposed on others?

  5. The impersonal case: escalation of commitment in firms and states, and the "Concorde fallacy" label in behavioral ecology, show the same pattern where no single persisting self is in question — stronger when the decision-maker personally authorized the outlay, weaker under age, delay, or external review. If her account is personal, why does the phenomenon have this shape in organizations and across species? Is she conceding those cases to forward-looking signaling explanations, and if so does the concession undercut the personal case?

  6. Retrospective value: does finishing the cathedral make the earlier labor non-wasted, or only add value going forward? Does she need the stronger claim — that a later event can alter the value of an earlier one — and is she willing to pay for it? (The value-of-achievement literature's suggestion that effort is partly constitutive of an achievement's worth is relevant here.)

  7. A stipulated pair: two cases identical in every forward-looking respect, differing only in whether the outlay was personally authorized or externally imposed. Ask her what she would do; and if she answers that the cases still differ, ask her to say what the difference consists in without re-describing the options. This is where the maneuver should finally be closed off.

  8. Predictions: what pattern of susceptibility across stakes, delay, personal versus imposed outlay, and decision-maker age does the fidelity account predict, and which of the patterns commonly reported sit badly with it?

  9. Exposure: a closing question on what would count against the account — which finding or argument would make her give it up, and whether, given the ever-available re-description move, the view can be stated so as to risk anything at all.

  For each question, please supply the follow-up keyed to the answer she is most likely to give, and flag the two or three places where the follow-up should take her own preferred phrasing — "the cost isn't really sunk," "that's just loyalty, not error" — and ask what work it is doing. Close with a note on the one question you think she is most likely to handle badly, and why.
reasoning: |-
  Okay, the user hosts an interview series on practical rationality and has a specific guest coming up—a philosopher of action who wrote a monograph on sunk costs. Her theory, the fidelity account, argues that honoring sunk costs isn't irrational but is like loyalty to one's past self. The user wants questions that press her on key objections without letting her rely on re-describing options to make costs seem future-relevant. 

  First, I need to unpack the core challenges the user outlined. There are nine areas to cover, each targeting a different weakness in the fidelity account. The collapse objection questions if her view just disguises prospectivism. The epistemic reading asks if sunk costs are merely evidential. The act/disposition gap probes whether she advocates rational irrationality. Fidelity under adverse past challenges loyalty to flawed prior selves. The impersonal case demands why sunk-cost effects appear in entities without persistent identity. Retrospective value questions if completion changes past value. The stipulated pair forces a direct comparison without option-redescription. Predictions test empirical adequacy. Exposure asks if the theory is falsifiable.

  The user's explicit need is for tight questions that block evasion, especially the re-description maneuver. But deeper, they likely want to expose whether the fidelity account adds anything beyond prospectivism + psychology, and whether it risks becoming unfalsifiable. The guest's likely defenses—re-description, collapsing to loyalty, dismissing cases as "not true fidelity"—need preemptive follow-ups that corner her.

  For each question, I'll craft a primary probe and a follow-up targeting her probable responses. Key moments are when she says "the cost isn't sunk" or "it's just loyalty"—I'll flag those for immediate pressure: "What work is 'fidelity' doing here that loyalty doesn't?" or "If re-description absorbs this, what distinct phenomenon does your account explain?"

  The hardest point for her might be the stipulated pair (point 7), as it removes the re-description escape hatch. If she insists cases differ despite identical futures, she must defend a metaphysically costly view where past authorization changes present reasons—and that could unravel into mysticism or question-begging. 

  I'll structure the interview to escalate: start with conceptual collapses (1-2), move to psychological tensions (3-4), then impersonal cases (5) forcing a concession, hit metaphysical stakes (6), lock in with the inescapable pair (7), test predictions (8), and end with falsifiability (9). The sequence tightens the vise.
answer: |-
  Here’s a question set designed to force engagement with the core tensions, escalate pressure on re-description, and corner the fidelity account’s unique commitments. Follow-ups target predictable responses and force differentiation from prospectivism/evidentialism.

  ---

  ### **1. Collapse Objection**  
  **Q:** When you argue that honoring sunk costs in a marriage or doctorate stems from *current* entanglements (skills, identity, relationships), how is this meaningfully distinct from a sophisticated prospectivist simply including those persistent costs/benefits in the forward-looking calculus? Doesn’t fidelity dissolve into enriched prospectivism here?  
  *→ Likely Response:* "Fidelity isn’t about *current* costs—it’s about *owing* something to one’s past commitment."  
  **Follow-up:** If the reason I "owe" it is *because* the past project reshaped my current identity (making abandonment costly *now*), doesn’t that collapse into a prospective reason? What work is "owing" doing that isn’t captured by "current identity integrity has high value"?  

  ### **2. Epistemic Reading**  
  **Q:** If sunk costs can signal past judgments made under better information, a fully rational agent with perfect self-knowledge and access to original evidence should ignore them. Do you agree? If not, what *extra* reason does fidelity provide when all evidence is transparent?  
  *→ Likely Response:* "Fidelity isn’t epistemic—it’s constitutive of diachronic agency."  
  **Follow-up:** Suppose I have perfect recall and know my past judgment was *wrong*. Why should I honor the sunk cost? If fidelity compels me to continue anyway, isn’t it demanding loyalty *despite* evidence—making it non-rational?  

  ### **3. Act/Disposition Gap**  
  **Q:** You’ve suggested honoring sunk costs sustains a disposition crucial for long-term projects. But if the *disposition* is rational, while *individual acts* of honoring costs lack prospectivist justification, does this require agents to act on reasons they know are illusory—a form of rational irrationality?  
  *→ Likely Response:* "The act *is* justified as expressing fidelity—it’s not irrational!"  
  **Follow-up:** If expressing fidelity has *independent* value, shouldn’t it be included prospectively? If not, and the act is only instrumentally rational for sustaining the disposition, doesn’t that concede the *act itself* isn’t rationally compelling?  

  ### **4. Fidelity Under Adverse Past**  
  **Q:** Your account assumes a past self worth being loyal to. How does fidelity function if the sunk cost was incurred under coercion, misinformation, or by a self you now despise (e.g., funding a harmful cult)? Must you honor *those* costs?  
  *→ Likely Response:** "Fidelity isn’t blind—it applies only to authentic past commitments."  
  **Follow-up:** What makes a commitment "authentic" enough for fidelity? If authenticity depends on alignment with *current* values, doesn’t this again collapse into prospectivism (only honoring past acts you *still* endorse)?  

  ### **5. Impersonal Case**  
  **Q:** Sunk-cost effects appear in corporations, governments, and even animals ("Concorde fallacy"), where no persistent "self" exists. If fidelity is inherently personal, why do *impersonal* systems show the same bias? Shouldn’t your account predict its *absence* there?  
  *→ Likely Response:** "Organizations have collective agency; animal behavior is explicable via signaling."  
  **Follow-up:** If you concede impersonal cases to signaling/evidential accounts, why treat human personal cases as categorically different? Isn’t the *strength* of the effect in humans when they *personally authorized* the outlay better explained by *psychological ownership* (a prospective factor) than metaphysical fidelity?  

  ### **6. Retrospective Value**  
  **Q:** You argue completing a cathedral redeems the sunk cost. Does this mean the *past labor* becomes non-wasted retroactively, or does completion merely add new value *going forward*?  
  *→ Likely Response:* "Achievement’s value is partly constituted by the effort—so past labor gains meaning from completion."  
  **Follow-up:** If the bricklayer dies before completion, was their labor worthless? If yes, doesn’t this implausibly outsource value to an uncertain future? If no, how can fidelity demand completion to "redeem" labor that *already* had value?  

  ### **7. Stipulated Pair (Blocking Re-description)**  
  **Q:** Consider two medically identical patients needing a $50k treatment. Both paid $50k for an *ineffective* treatment yesterday. Patient A chose it freely; Patient B had it imposed by a mistake. All future costs/benefits are identical. Should either honor the sunk cost by refusing a new treatment?  
  *→ Likely Response:* "Patient A might feel obligation to see it through, altering their experience."  
  **Follow-up:** We’ve stipulated *identical future outcomes and costs*, including psychological states. If you still say Patient A should act differently, what *is* the reason, if not a bare "I authorized it"? How is that reason not inert?  

  ### **8. Predictions**  
  **Q:** Prospectivism predicts *no* sunk-cost sensitivity. Evidentialism predicts sensitivity only under uncertainty. What *distinct* pattern does fidelity predict? For example, should sensitivity *increase* with:  
  - Stakes (bigger costs demand more loyalty)?  
  - Time elapsed (stronger obligation to distant selves)?  
  - Personal authorization?  
  Which empirical findings clash with your model?  
  *→ Focus:* Does she predict effects prospectivism can’t explain?  

  ### **9. Exposure (Falsifiability)**  
  **Q:** Fidelity can always "rescue" a case by re-describing options (e.g., "the cost *isn’t sunk* due to identity effects"). What finding or argument *could* falsify the core claim that sunk-cost sensitivity is rationally permissible (or required) fidelity?  
  *→ Likely Response:* "Re-description isn’t evasion—it’s properly capturing what’s at stake."  
  **Follow-up:** If every apparent counterexample can be re-described as "not a true sunk cost" or "not true fidelity," is the account tautological? What *would* count as a pure sunk cost under your view?  

  ---

  ### **Critical Follow-Up Strategy**  
  - **When she says "The cost isn’t really sunk"** (e.g., due to identity/relationships):  
    *→ "If enriching the option description absorbs the 'sunk' cost into future consequences, what unique phenomenon does 'fidelity' explain that prospectivism misses?"*  
  - **When she says "That’s just loyalty, not error"**:  
    *→ "Is loyalty itself a *prospective* value (e.g., integrity feels good) or a *non-prospective* duty? If the former, it collapses; if the latter, how is it rationally justifiable?"*  

  ### **Likeliest Weak Point: The Stipulated Pair (Q7)**  
  **Why:** Her entire rhetoric relies on re-describing options to make costs "non-sunk." The stipulated pair *removes* this move by construction. If she bites the bullet and insists Patient A should act differently despite identical futures, she must defend a metaphysically weighty claim: that a bare "I chose it" generates reasons detached from consequences—risking incoherence or begging the question. If she concedes no difference, she surrenders the core claim that sunk costs *as such* matter.  

  ### **Execution Tips**  
  - **Pace:** Let silence linger after follow-ups. Don’t rescue her.  
  - **Phrasing:** Use *her* examples (cathedral, marriage) early; switch to neutral/stipulated cases later.  
  - **Goal:** Force her to either (a) admit fidelity reduces to enriched prospectivism/psychology, or (b) defend a strong, testable metaphysics of diachronic identity.  

  This sequence systematically strips away evasions, exposing whether "fidelity" is a distinctive rational norm or a psychological proxy for prospectively relevant values.
