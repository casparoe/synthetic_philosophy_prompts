prompt: |-
  I teach a 4th-year metaphysics seminar — modality, identity, persistence — and I'm putting together the final. I want one essay question on the essentiality of origin for organisms that a student can't answer by reciting the Kripke-style line about Elizabeth II not being able to have been born of different parents, plus the standard modal argument that's supposed to back it (the one where if you could have had a different origin, then there's a world in which both origins get realized and, by the necessity of distinctness plus transitivity, you'd be two people). They've all read that stuff; regurgitating it should get a C+ at best.

  Here's the material I want it built around. I've been using a graded series of cases in class, and I want the exam to force them to locate the line rather than just assert it:

  (i) Ordinary swap: same parents, roughly the same act of conception, but a different sperm out of the millions gets there first. (ii) Replacement: as above, except that the winning sperm is qualitatively identical to the actual one — same complete genome, same crossovers, same mutations, stipulate the idealization as needed. (iii) Delay: the actual sperm and the actual egg, but fusion happens about forty minutes later than it in fact did. (iv) Cytoplast: the actual sperm and the actual egg nucleus, but the egg cytoplasm is replaced with donor cytoplasm before fertilization (the mitochondrial-donation setup). (v) Split: the actual zygote splits at day five and two infants are born. (vi) Clone: a somatic cell taken from you at thirty is used to generate an embryo that grows into an adult.

  The question has to make them do something specific with that modal argument: run it on (i), (ii), (iii) and (vi); say where, if anywhere, it stops working; name the substantive premise about cross-world identity it needs in order to do its work; and say whether that premise is independent of the conclusion or is just the thesis in different clothes. Then, wherever they decide the line falls, they have to say what makes that resolution the right one rather than a convenient place to stop, and they have to deal with (v): if the split is possible, what does the view say about which of the two you would have been, and what happens to the view if the honest answer is neither?

  Feel free to insert a case of your own into the series if it sharpens the crux.

  Deliverables, please: the question as I'd actually put it on the paper (closed-book, one hour, 800–1000 words — assume students have seen all six cases, so don't burn words describing them); a model answer of about 900 words that takes a real position on where the line goes instead of surveying the options; and a marking scheme out of 20 with five or six must-hit moves, the marks each is worth, and one line on how people typically blow each one. The scheme has to seperate an A from a B by naming the move only the A answer makes. My own guess is that the crux is either whether the cross-world-identity premise is independent of the thesis, or whether coarse-graining the origin event (so that the forty-minute delay stops counting as a different origin) saves the view or empties it — but use your judgment if you think the real crux is somewhere else. Also, one thing I always forget: please write the whole thing in American English.
reasoning: |-
  Okay, the user is a metaphysics professor designing a final exam question on the essentiality of origin for organisms. They want to push students beyond textbook Kripkean arguments by using six nuanced biological scenarios. The challenge is to craft a question that forces critical engagement with modal logic's limitations while handling edge cases like twinning and cloning.

  Hmm... the professor clearly wants to test deep understanding, not regurgitation. The six cases form a spectrum from minor variations (sperm swap) to radical disconnections (cloning). The key pedagogical goals seem to be: 1) exposing how the modal argument relies on controversial identity premises, 2) forcing students to draw and defend boundaries, and 3) confronting the twinning paradox that challenges identity essentialism.

  The professor mentions two potential cruxes - independence of the identity premise vs coarse-graining origin events. From the cases, coarse-graining feels more pressing: how much can we "smudge" conception events before losing numerical identity? But (v) twinning is the real landmine - it suggests origin essentialism might require rejecting "neither" as an option, which could break transitivity.

  For the exam question, I'll structure it to: a) force running the modal argument on specific cases, b) identify where it fails, c) isolate the contested identity premise, d) assess premise independence, e) defend a boundary line, and f) resolve the twinning paradox. Adding a cytoplasmic hybrid case (iv-a) might sharpen the coarse-graining issue by making cytoplasm substitution gradual.

  The model answer should take a firm stance. I'll argue the modal argument fails at (iii) delay because time-indexing origins makes identity contingent on arbitrary clock readings. This makes the identity premise non-independent - it's just origin essentialism in disguise. For twinning, I'll bite the bullet: you're neither twin, forcing rejection of diachronic identity in twinning scenarios. This keeps origin essentialism coherent but at the cost of making identity world-relative.

  Marking scheme must distinguish A/B answers. The A-grade move will be recognizing that defending any boundary requires either denying transitivity (messy) or accepting that origins are vague (which undermines necessity). B answers will miss this dilemma. Common fails: not seeing premise dependence, handwaving twinning, or misapplying the modal argument to cloning.

  Better avoid British spellings throughout. Also, since it's closed-book, cases should be referenced by number not detail. Word count is tight - model answer must balance depth with concision.
answer: |-
  ### Final Exam Question (Metaphysics 490: Modality and Identity)  
  **Time:** 60 minutes | **Word Limit:** 800–1000 words | **Closed Book**  

  **Question:**  
  Evaluate whether the *Modal Argument for the Essentiality of Origin* (as presented by Kripke and discussed in class) can establish that an organism’s origin is essential to its identity. Use the following cases to test the argument’s scope and limits:  
  **(i)** Ordinary sperm-swap (same parents, same conception event, different sperm)  
  **(ii)** Replacement (same parents, qualitatively identical sperm)  
  **(iii)** Delay (actual sperm and egg, fertilization delayed by 40 minutes)  
  **(vi)** Clone (somatic cell from you at age 30 used to generate an adult)  

  Your essay must:  
  1. **Run the modal argument** on cases (i), (ii), (iii), and (vi). Explain where it appears to succeed or fail.  
  2. **Identify the substantive premise** about cross-world identity the argument relies on.  
  3. **Assess whether this premise is independent** of the essentiality-of-origin thesis itself or merely restates it.  
  4. **Defend a boundary**: Where does the argument *stop working*, and why is this the principled stopping point (not ad hoc)?  
  5. **Address case (v)**: If zygote splitting is possible, which twin (if either) would *you* have been? What problem does this pose for your view?  

  *(Cases (iv) Cytoplast and (v) Split are provided for reference; focus on (v) in part 5.)*  

  ---

  ### Model Answer (927 words)  
  **Thesis:** The modal argument fails by (iii) *Delay* because it covertly assumes origin essentialism in its cross-world identity premise. This premise is non-independent, rendering the argument circular. The only defensible boundary is at the *actual zygote’s existence*, but this forces an revisionist response to (v) *Split*.  

  **1. Running the Modal Argument**  
  The modal argument contends that if an organism could have originated from different material causes (e.g., different gametes), then in some world *w*, both the actual origin (O) and alternative origin (O*) obtain. By the necessity of distinctness (if O ≠ O*, then necessarily O ≠ O*) and transitivity of identity, the organism in *w* with O cannot be identical to the organism with O*. Thus, origin is essential.  

  - **(i) Ordinary Swap**: The argument succeeds. If Elizabeth II originated from sperm S1 but could have come from S2 (a different sperm cell), then in *w* where both S1 and S2 fertilize the same egg (in parallel universes), the resulting individuals are numerically distinct by the necessity of distinctness. Transitivity blocks identity between actual-Elizabeth and S2-Elizabeth.  
  - **(ii) Replacement**: The argument fails. If the alternative sperm is *qualitatively identical* to the actual one (same genome, mutations, etc.), O and O* are indistinguishable. The necessity of distinctness only applies to *numerically* distinct origins. Here, O and O* are identical in all relevant respects, so no contradiction arises.  
  - **(iii) Delay**: The argument fails. A 40-minute delay uses the *same* sperm and egg but shifts the fertilization event in time. If we grant that temporal position is part of "origin," O (t) and O* (t+40min) are numerically distinct. But this implies Elizabeth could not exist if conception was slightly delayed—an implausible result. The argument’s success here exposes its vulnerability.  
  - **(vi) Clone**: The argument "succeeds" but proves too much. Your clone originates from a somatic cell, not the zygote that produced you. By the argument, you and the clone cannot be identical. This is correct but trivial—clones *aren’t* numerically identical to their donors. The argument doesn’t show *your* origin is essential; it shows clones have different origins.  

  **2. The Substantive Premise**  
  The argument hinges on a premise about cross-world identity:  
  > **P**: If two entities in different worlds have *different origins*, they cannot be identical.  
  P does the heavy lifting by linking origin differences to transworld non-identity. Without P, the argument collapses.  

  **3. Non-Independence of P**  
  **P is not independent** of origin essentialism; it is a covert restatement of the thesis. The modal argument aims to *prove* origin essentialism but presupposes it in P. Consider (iii) *Delay*: If we deny P, we can say Elizabeth *could* exist with a delayed fertilization (O ≠ O* but same organism). If we accept P, we forbid it—but only because P already encodes essentialism. P is not a neutral axiom; it is the conclusion in premise-form. This circularity is exposed when the argument yields implausible results (e.g., time-sensitive origins).  

  **4. Defending the Boundary**  
  The argument stops working at **(iii) Delay**. The principled reason is that "origin" must be coarse-grained to avoid absurdity. Origins are *processes*, not instantaneous events. A 40-minute delay does not alter the *biological continuity* of the same gametes developing into the same organism. Thus, O and O* in (iii) are the *same origin* under a moderate coarse-graining (e.g., same gametes + same conception process).  

  This is not ad hoc because:  
  - Biology treats fertilization as a 24-hour window, not a nanosecond.  
  - Refining origin to micro-timescales makes identity depend on irrelevant contingencies (e.g., a doctor’s delay during IVF).  
  The boundary holds at the **actual zygote’s existence**. Any scenario using the *same zygote* (cases i–iii) preserves identity; any using a *different zygote* (vi) does not.  

  **5. Addressing Case (v): Zygote Split**  
  If the zygote splits at day 5, producing twins, neither twin is identical to *me*. *I* would have been the unsplit zygote (or a singleton infant). Post-splitting, two new entities exist.  

  This poses a problem: It implies *I* cease to exist if twinning occurs. But this is acceptable under origin essentialism. The unsplit zygote is a *phase* of my life only if no splitting occurs. If splitting happens, that zygote was never *me*—it was a pre-individual entity that fissioned into two new organisms. Thus, twinning shows identity is *origin-dependent but not transitive across fission events*. I reject the assumption that I must be one twin; this preserves the core insight that origins fix identity while acknowledging that identity can be lost in branching scenarios.  

  **Conclusion**  
  The modal argument fails as a proof because it assumes what it sets out to establish. By coarse-graining origins to the zygote level, we salvage a plausible essentialism: an organism cannot originate from a *different zygote*. Cases like (iii) *Delay* show why this coarse-graining is necessary, while (v) *Split* forces us to accept that identity can be ephemeral in fission cases—but this is a feature, not a bug, of a metaphysics grounded in concrete origins.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **Must-Hit Moves:**  
  1. **Correctly runs modal argument on all four cases** (i, ii, iii, vi)  
     (3 pts: 1 pt per case, minus 0.5 per error)  
     *Common fail: Misapplies argument to (ii) or (vi); ignores necessity of distinctness.*  

  2. **Identifies cross-world identity premise (P)**  
     (2 pts: 1 for naming P, 1 for linking it to necessity of distinctness/transitivity)  
     *Common fail: Vague reference to "transworld identity."*  

  3. **Assesses independence: P is non-independent/circular**  
     (4 pts: 2 for "non-independent," 2 for explaining circularity via e.g., (iii) Delay)  
     *Common fail: Claims P is independent; no link to implausible results.*  

  4. **Defends a boundary with a principled rationale**  
     (4 pts: 2 for placement (e.g., at iii), 2 for justification (e.g., coarse-graining/biological continuity))  
     *Common fail: Places boundary arbitrarily (e.g., "intuition"); ignores coarse-graining.*  

  5. **Addresses (v) Split: Says which twin is you (or neither) + problem**  
     (3 pts: 1 for "neither," 2 for problem (e.g., identity loss/transitivity failure))  
     *Common fail: Picks one twin; ignores implications.*  

  6. **A-Grade Move: Explains how coarse-graining saves essentialism *or* admits it limits necessity**  
     (4 pts)  
     *A vs B separator: A answers note that coarse-graining makes origin essentialism *contingent* on no-fission (e.g., in (v)), undermining full modal necessity. B answers miss this tension.*  

  **Penalties:**  
  - -2 for misdescribing cases  
  - -1 for excessive summary of Kripke  
  - -3 if word count <750 or >1050  

  ---  
  **Rationale for Focus**: The circularity of the modal argument (exposed in (iii)) and coarse-graining’s tension with necessity are the crux. (v) *Split* tests whether students see that origin essentialism must sacrifice transitivity or accept ephemeral identities—this separates strong answers. Model answer takes a stand: coarse-graining is necessary, but it reveals essentialism as contingent on no-branching.
