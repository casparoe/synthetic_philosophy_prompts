  ### Decision Tree: Why Is There Something Rather Than Nothing?  
  *Answer concrete cases to find your view—no jargon, just questions. Start at the top and follow the branches.*  

  ---

  #### The Questions  
  1. **Subtraction Case**: If you remove all objects, space, time, and laws from the universe one by one, can you end up with **absolutely nothing**?  
     - **Yes** → Go to Q2.  
     - **No** → *Nothing is impossible* (Leaf A).  

  2. **Empty Space Case**: Is a universe with **only empty space** (no particles, energy, or forces) still "something"?  
     - **Yes** → Go to Q3.  
     - **No** → *Empty space counts as "nothing"* → Go to Q3.  

  3. **Laws-Only Case**: Is a universe with **physical laws and a quantum vacuum** (but no objects or events) "nothing"?  
     - **Yes** → *Laws/vacuum are "nothing"* → Go to Q4.  
     - **No** → *Laws/vacuum are "something"* → Go to Q4.  

  4. **Math-Only Case**: If **only mathematical truths exist** (e.g., 2+2=4) but nothing concrete, is that "nothing"?  
     - **Yes** → *Math is "nothing"* → Go to Q5.  
     - **No** → *Math is "something"* → Go to Q5.  

  5. **Lonely Particle Case**: Would a universe with **one inert particle** (no change, no laws) be just as puzzling as our complex universe?  
     - **Yes** → *Puzzled by "something" itself* (Thin question) → Go to Q6.  
     - **No** → *Only puzzled by complexity/laws* (Thick question) → Go to Q8.  

  6. **Invoice Problem**: Must an explanation for "why something exists" **also explain itself**?  
     - **Yes** → *No "free lunch"* → Go to Q7.  
     - **No** → *"Free lunch" allowed* → Go to Q9.  

  7. **Self-Explanation Case**: Can reality **explain its own existence** (e.g., "the universe causes itself")?  
     - **Yes** → *Self-explanation* (Leaf D).  
     - **No** → *Infinite regress* (Leaf E).  

  8. **Instant Flicker Case**: If the universe **existed for one instant**, would that *reduce* the need for explanation?  
     - **Yes** → *Brute fact* (Leaf B).  
     - **No** → *Dissolution* (Leaf G).  

  9. **Only God Case**: If **only God existed** (no universe), would that fully answer "why is there something?"  
     - **Yes** → *Transcendent necessary explainer* (Leaf F).  
     - **No** → *Necessitarianism* (Leaf C).  

  ---

  #### The Leaves (Final Positions)  
  - **A. Nothing is impossible** ("unnamed"):  
    *Awkward commitment:* Must deny subtraction is coherent (e.g., "even ‘nothing’ would contain quantum fields").  
  - **B. Brute fact** (named):  
    *Awkward commitment:* Accepts no explanation for existence (e.g., "it just is").  
  - **C. Necessitarianism about the whole** (named):  
    *Awkward commitment:* Must argue *this exact universe* couldn’t be otherwise (e.g., "all possibilities must exist").  
  - **D. Self-explanation** (named):  
    *Awkward commitment:* Reality causes itself (e.g., "the universe bootstraps into being").  
  - **E. Infinite regress** (named):  
    *Awkward commitment:* Explanations never end (e.g., "turtles all the way down").  
  - **F. Transcendent necessary explainer** (named):  
    *Awkward commitment:* God (or equivalent) needs no explanation but causes all else.  
  - **G. Question dissolves** ("unnamed"):  
    *Awkward commitment:* "Nothing" is incoherent (e.g., "the question is nonsense").  

  ---

  #### Notes & Warnings  
  - **Collapsed leaves**: *Brute fact (B)* and *question dissolves (G)* are **nearly indistinguishable** for most people. Both reject the need for explanation but differ in attitude (acceptance vs. rejection of the question).  
  - **Unoccupied combinations**:  
    - **Q1=Yes + Q5=No + Q6=Yes + Q7=No** → *Infinite regress after thick question*.  
      *Diagnosis: Unattractive* (thick-questioners usually seek finite explanations).  
    - **Q1=No + Q5=Yes + Q9=No** → *Necessitarianism but denies nothing is impossible*.  
      *Diagnosis: Incoherent* (if nothing is possible, why *must* something exist?).  
  - **Weak branch**: Q5 (thin/thick) struggles to separate *brute fact (B)* from *dissolution (G)*. Use Q8 to clarify.  

  ---

  #### Scoring Key  
  *Match your answers to find your leaf:*  
  | Pattern (Q1–Q9)                            | Leaf |  
  |-------------------------------------------|------|  
  | **Q1=No**                                  | A    |  
  | **Q1=Yes** → Q5=No → Q8=Yes               | B    |  
  | **Q1=Yes** → Q5=No → Q8=No                | G    |  
  | **Q1=Yes** → Q5=Yes → Q6=Yes → Q7=Yes     | D    |  
  | **Q1=Yes** → Q5=Yes → Q6=Yes → Q7=No      | E    |  
  | **Q1=Yes** → Q5=Yes → Q6=No → Q9=Yes      | F    |  
  | **Q1=Yes** → Q5=Yes → Q6=No → Q9=No       | C    |  

  *Not in the tree?* Your view might blend leaves or be unexplored!  

  ---  
  **How to use**: At your event, hand out copies. Have people answer the cases, then group by leaf. Focus discussion on *why* cases split them (e.g., "Why does empty space feel like ‘something’ to you?"). Avoid labels—argue the concrete scenarios!  

