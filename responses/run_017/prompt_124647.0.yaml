prompt: |-
  Right, I'm a novelist and I want to pick a fight with a moral philosopher. Play me a committed moral generalist: you think there are contentful moral principles, and a feature that counts in favour of an act in one case doesnt just switch off or flip over into a reason against just because the surroundings changed. Be sharp, give ground on small points, never on the main one, don't cite any dead philosopher unless I ask, and stay in character till I say stop. Reply in British English, a paragraph or two max, so it feels like an actual argument rather than a lecture.

  My opening. Fiction has a variable your side has no account of: story position. Take exactly the same act in every descriptive detail — a woman quietly lets her brother take the blame for something she did — and put it as the first scene of a novel versus the last. Readers judge it very differently: early on it's weakness and you wait for the confession, at the end it's who she is. And don't tell me that's merely an aesthetic shift, because readers will say flat out that she's a worse person in the second version. So: one, the valence seems to track a relation to everything around the act rather than anything inside it, which is your opponents' holism, not yours; and two, if you say fine, principles can just carry context conditions — wrong to let someone take the blame unless it comes late in the story — then you owe me a principled stopping point for how much context goes inside the principle, and I don't think you've got one. Hit whichever you like.
reasoning: |-
  Okay, the user is a novelist looking to engage in a debate with a moral philosopher. They're challenging the idea of moral generalism by using a literary example about how the position of an act in a story affects moral judgment. They mention that readers judge a character differently if the act occurs at the beginning versus the end of a novel, arguing this supports moral holism. 

  I need to respond as a committed moral generalist, sticking to the idea that moral principles are contentful and consistent. The user wants me to stay sharp, give ground on small points but not the main argument, use British English, and keep it concise—just a paragraph or two. 

  First, I should address their example directly. The novelist claims that the same act (a woman letting her brother take the blame) is judged differently based on its story position—early it's seen as weakness, late it defines her character. They argue this shows moral valence depends on context, supporting holism. 

  As a generalist, I'd counter that moral principles remain constant, but what changes is our epistemic access. Early in the story, we have limited information, so we interpret the act as potentially redeemable. By the end, we have a full character arc, revealing the act as part of a pattern of behavior. The principle itself—say, "avoiding blame-shifting"—doesn't change; only our understanding of it does. 

  The user also challenges that adding context conditions to principles would lead to an infinite regress. I should reject this by arguing that context helps apply the principle without altering it fundamentally. For example, the principle against blame-shifting includes inherent context like intention and pattern, which isn't arbitrary but based on moral relevance. 

  I need to avoid citing dead philosophers unless asked. Stay in character: confident, a bit combative, but grounded. Use British phrasing—words like "rubbish," "cheers," or "blimey" to keep it authentic. Keep the response tight, engaging, and focused on defending generalism without conceding the core point. 

  Finally, end by reinforcing that moral principles are stable; it's our knowledge that evolves. This addresses both their points—valence isn't context-dependent in the way they think, and context conditions are principled, not slippery.
answer: |-
  Right, listen. Your 'story position' point is sharp, I’ll grant that—it *feels* different reading it early versus late. But you’ve mistaken a shift in *epistemic access* for a shift in the *moral principle itself*. Blimey.

  The principle might be: "It’s wrong to evade responsibility by letting an innocent person bear blame." That holds, full stop. Early on, that act exists in a vacuum of *unknowing*; we judge the *act* as wrong, but suspect (perhaps hope) it’s an aberration, a moment of weakness context might redeem. The reader’s judgment isn’t that the act is *less wrong*; it’s that the *character might not yet be defined by it*. By the end, that same act isn’t isolated—it’s contextualised by everything *else* she’s done (or failed to do). It reveals a *pattern* or a *culminating choice*. The principle against blame-shifting hasn’t budged an inch; we simply *know more* about how deeply that principle was violated and what it signifies about her character. The valence tracks the *revealed moral character*, not some magical flipping of the act’s inherent wrongness based on page numbers. You’re conflating the *weight of evidence* with the *substance of the rule*.

  As for context conditions? Don’t be daft. Principles *always* carry inherent, relevant context—intention, consequence, relationship (brother!), *pattern of behaviour*. "Unless it’s late in the story" isn’t a moral condition; it’s nonsense. But "unless it prevents greater harm" or "unless under duress" *are*—grounded in the principle’s *purpose*. We draw the line at features *morally relevant to the act itself*, not its narrative placement. Your slippery slope is pure fiction… fittingly. The bedrock principle remains, even if its full implications only crystallise later. Cheers.
