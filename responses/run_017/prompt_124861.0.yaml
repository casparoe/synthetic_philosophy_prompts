answer: |-
  ### Improved Design for the Underdetermination Activity

  **Core Improvements**:
  - **Rule & Noise Model**: `y = 0.5 * x * sin(x/4) + 10 + ε`  
    - `ε ~ N(0, 2)` (Gaussian noise, SD=2).  
    - *Why*: Visibly oscillatory but easily mistaken for linear/quasi-linear trends. Hard to guess due to embedded periodic element. Generates 40 noisy points for the dataset (x=1–40) and 10 held-back queries (x=41–50).  
    - *Spreadsheet Formula*: `=0.5*A2*SIN(A2/4) + 10 + NORM.INV(RAND(), 0, 2)` (round to 1 decimal).

  - **Teams & Roles**: Four teams (3–4 students). Assign:  
    - **Recorder** (writes hypotheses), **Skeptic** (constructs rivals), **Statistician** (calculates fits), **Spokesperson** (presents).

  - **Scoring System**:  
    - **Round 1**: Predictions scored against true values (no noise). Points:  
      - Within 1.0: 10 pts  
      - Within 2.0: 5 pts  
      - Else: 0 pts  
    - **Round 2**: Predictions use **confidence wagers** (0–3 pts per query). Gain 2× wagered points if within 1.0; lose wagered points if not.  
    - **Round 3**: Rivals scored by **admissibility** (5 pts if admissible) + **elegance** (peer vote, 1–5 pts).  
    - *Trivial Stake*: Winning team picks next week’s reading topic.

  - **Admissibility Test for Rivals**: Must be:  
    1. **Statable** in vocabulary of math operations (+, −, ×, ÷, ^, sin, cos, log, sqrt).  
    2. **Non-deferred**: Predictions must differ from the best rule only at x > 50 (outside testable domain).  
    3. **Non-gerrymandered**: Cannot include terms like `(x-41)*(x-42)*...` or arbitrary piecewise functions.  
    4. **Substantive**: Must offer a mechanistic interpretation (e.g., "This models cyclical decay," not "It just fits").

  ---

  ### Activity Timeline (100 Minutes)
  | Time  | Phase               | Facilitator Actions                                                                 | Team Tasks                                                                                                |
  |-------|---------------------|-------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|
  | 0–5   | **Intro**          | Explain: "You’re scientists finding a law for noisy data. No lab, just brains." Distribute dataset (x=1–40). | Understand rules; ask clarifications.                                                                   |
  | 5–25  | **Round 1**        | Circulate. Silence on rule hints. Prep held-back queries (x=41–45).                 | Propose 1 rule + predictions for x=41–45. Submit written.                                                |
  | 25–30 | **Scoring Break**  | Score Round 1 predictions against true values (no noise). Display scores.           | Break.                                                                                                    |
  | 30–35 | **Data Expansion** | Distribute new data: x=41–45 (noisy observations).                                  | Record new data; observe misfits.                                                                         |
  | 35–55 | **Round 2**        | Circulate. Warn: "Wagering rewards confidence but punishes error." Prep x=46–50.    | Revise rule. Predict x=46–50 + wager (0–3 pts per query). Submit rule + wagers.                          |
  | 55–60 | **Scoring Break**  | Score Round 2 (true values for x=46–50). Double-check wager math. Announce best rule. | Verify scores. Identify best rule in the room (highest total).                                           |
  | 60–75 | **Round 3**        | Enforce admissibility test. Veto gerrymandered rivals. Note: True rule ≠ any team’s. | Build rival to best rule. Must fit all data (x=1–45) ±4.0 (2× noise). Explain mechanistic intuition.     |
  | 75–80 | **Rival Showcase** | Host 60-second pitches per team. Moderate peer elegance votes (1–5 pts per rival).  | Spokesperson presents rival + intuition. Teams vote (not on own).                                        |
  | 80–90 | **Reveal**         | Show true rule. Graph predictions vs. team rules. Emphasize: "Truth was unconceived." | Compare fits. See true rule’s predictions for x=46–50.                                                   |
  | 90–100| **Debrief**        | Lead discussion (see below). Withhold "underdetermination" until minute 98.         | Reflect: Why did truth elude us? How did rivals "feel"?                                                  |

  ---

  ### Handling Pitfalls
  | Pitfall                          | Prevention & Response                                                                 |
  |----------------------------------|----------------------------------------------------------------------------------------|
  | **Gerrymandered rivals**         | **Prevent**: Strict admissibility test (block piecewise/arbitrary terms). **Response**: "Science dismisses contrived alternatives; let’s discuss why." |
  | **Overfitting rewarded**         | **Prevent**: Round 2 wagers penalize overconfidence in flawed rules. **Response**: "Note how new data broke your initial model—real science self-corrects." |
  | **Simulation skepticism**        | **Prevent**: Pre-generate data; show formula only at reveal. **Response**: "This models how evidence underdetermines theory—focus on that insight." |
  | **Skepticism about inquiry**     | **Respond**: "Underdetermination doesn’t make truth irrelevant. We eliminate *bad* theories, then use virtues to pick among plausible ones." |
  | **Time overrun**                 | **Prevent**: Hard stops; use timer. **Response**: Skip elegance votes; facilitator summarizes rivals. |
  | **True rule guessed**            | **Prevent**: Use subtle rule (sinusoidal). **Response**: "Celebrate! But historically, most truths were unconceived." |

  ---

  ### Debrief: Separating the Three Claims
  **Guided Discussion (90–100 min)**:  
  1. **Modal Claim** (finite evidence → ∞ hypotheses):  
     - *Activity Warrant*: Strong. Teams produced multiple rules fitting all data.  
     - *Script*: "In Round 3, you built rivals that fit *all* past data. How many could exist? Does evidence pick exactly one rule?"  

  2. **Historical Claim** (unconceived alternatives):  
     - *Activity Warrant*: Staged. True rule was never proposed.  
     - *Script*: "Why did no one suggest `y = 0.5x·sin(x/4) + 10`? History shows most truths start unconceived—like quantum mechanics baffling 19th-century physicists."  
     - *Caveat*: The activity uses fiat; stress this mimics historical dynamics.  

  3. **Methodological Claim** (virtues ≠ truth-tracking):  
     - *Activity Warrant*: None. Virtues (simplicity, scope) weren’t tested for truth.  
     - *Script*: "Your rivals used simplicity or elegance. But did that make them *truer*? We can’t know—virtues are practical tools, not truth detectors. Philosophers hotly debate this!"  
     - *Design Rig*: Scoring rewarded fit/confidence, not virtues. *Compensate*: "Note: We didn’t score ‘elegance’ until Round 3. Truth-tracking is a separate question."  

  **Taxonomy Defense**:  
  - These claims are distinct and non-collapsing. The modal claim is logical; the historical is contingent; the methodological is normative.  
  - *Activity Focus*: Makes modal claim visceral, stages historical claim, and *exposes* methodological debates (via elegance voting and admissibility disputes).  

  **Surface the Key Disagreement**:  
  - "When we rejected gerrymandered rivals, was that scientific integrity... or bias? Are admissible rivals ever ‘cheap’?"  
  - *Contested Consensus*:  
    - **Settled**: Virtues (simplicity, non-ad-hocness) are indispensable in practice.  
    - **Contested**: Whether virtues reflect reality (realism) or are mere tools (instrumentalism).  
    - **Activity Rig**: Peer voting favors "elegance," subtly privileging instrumentalism. *Compensate*: "In class, elegance won points—but does nature care?"  

  ---

  ### Materials & Prep
  - **Pre-Generated Data**: Use spreadsheet with formula to create datasets (x=1–50). Seal true rule in an envelope.  
  - **Handouts**:  
    - Dataset (x=1–40, noisy y).  
    - Rules: "Propose a function y = f(x) using +, −, ×, ÷, ^, sin, cos, log, sqrt."  
  - **Tech**: Projector for reveals and scoring.  

  This design makes underdetermination *felt*, avoids skepticism traps, and forces substantive rival-building. The debrief explicitly untangles philosophy’s "three moves"—with clarity on what’s settled, contested, and rigged.
