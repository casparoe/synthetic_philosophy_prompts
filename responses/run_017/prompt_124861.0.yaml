        1. Modal claim: for any finite data, there are multiple hypotheses that fit. (The activity shows this because there were multiple rules that fit the data.)
        2. Historical claim: often, the true theory is not among the conceived alternatives at the time. (The activity stages this by having the true rule not proposed.)
        3. Methodological claim: the criteria we use to choose between theories (simplicity, etc.) do not track truth. (The activity does not show this, because we don't know if the true rule is simpler than the ones proposed. Maybe it is. So this claim is not illustrated by the activity.)

    - In the activity, the scoring in round 2 used a wager system that might have rewarded accurate predictions, but it doesn't necessarily reward truth. It rewards predictive accuracy on the next set of points. But that might be correlated with truth.

    - The activity does not show that methodological virtues fail to track truth. It only shows that there are unconceived alternatives. So we can only claim that the activity supports the first two claims, but not the third.

    - The admissibility of rivals: we can discuss which rivals were admitted and which were not, and why. We can ask: is a contrived rival a serious alternative? In science, we often require that alternatives are not ad hoc.

    Finally, the true rule: y = 4*sqrt(x) + 5

    Noise: for each x, y_observed = y_true + N(0, 1.5)

    We generate the data in advance.

    Example data (rounded to one decimal):

    x=1: true=4*1+5=9 -> obs might be 9.3
    x=2: true=4*1.414+5≈5.656+5=10.656 -> obs might be 11.2
    etc.

    We'll generate 45 points for x=1-45, and then 46-50 for later.

    Let's do a quick generation in Python for x=1 to 45 and 46-50:

    ```python
    import numpy as np
    np.random.seed(42) # for reproducibility

    # True function
    def true_func(x):
        return 4 * np.sqrt(x) + 5

    # Generate with noise
    data = {}
    for x in range(1, 51):
        true_val = true_func(x)
        noise = np.random.normal(0, 1.5)
        obs_val = round(true_val + noise, 1)
        data[x] = {'true': round(true_val, 1), 'obs': obs_val}

    # Print data for x=1 to 40 for the handout, and then 41-45 for round1, and 46-50 for round2.
    ```

    We'll provide the students with a handout of x=1 to 40: (x, obs)

    Round1: they predict for x=41-45 (they don't see the obs for these until round2).

    In round2, we give them x=41-45 with obs.

    Then they predict for 46-50.

    For the true values without noise, we use for scoring.

    Now, write the timeline in minutes:

    0-5: Introduction (5 min)
        - Explain the activity: they are scientists trying to find a natural law. They have data (x,y) for x=1 to 40. The y values are generated by a rule plus some random noise.
        - They will work in teams.
        - They will have three rounds.

    5-25: Round 1 (20 min)
        - Teams work to find a rule and predict y for x=41-45.
        - At 25 minutes, they submit their rule (written) and predictions.

    25-30: Round 1 scoring (5 min)
        - Facilitator scores while teams take a break (or the facilitator can have a helper). 
        - Announce the scores.

    30-50: Round 2 (20 min)
        - Give teams the data for x=41-45 (the observed y with noise).
        - They revise their rule and then predict for x=46-50, with wagers (0,1,2) for each prediction.
        - They submit the revised rule, the predictions, and the wagers.

    50-55: Round 2 scoring (5 min)
        - Facilitator scores the predictions for 46-50 (against true values) and applies the wagers.

    55-80: Round 3 (25 min)
        - Announce the best team (highest score).
        - Each team has 15 minutes to create a rival rule that fits all data (x=1-45) within 4.5 of each observed point, and that is substantially different from the best rule.
        - They should write the rule and also predict for x=46-50.
        - Then, each team presents their rival rule (2 minutes per team, total 8 minutes).

    80-100: Reveal and debrief (20 min)
        - Reveal the true rule: y = 4 * sqrt(x) + 5. Show the true values for x=1-50 (without noise) in a table or graph.
        - Discuss the three claims.

    But note: we have 14 students, 4 teams. 4 teams * 2 minutes = 8 minutes for presentations. That leaves 7 minutes for the reveal and 13 minutes for discussion? We might need to adjust.

    Alternatively, skip the presentations and have them turn in the rivals. Then the facilitator can quickly show them.

    Or: the facilitator quickly shares the rivals and then reveals the true rule.

    Given time, it might be better to have the facilitator collect the rivals and then show them alongside the true rule.

    Revised:

    55-70: Teams work on rivals (15 minutes)
    70-75: Facilitator collects and quickly checks admissibility (on the fly) and then shares the rivals with the class (reads them out). (5 minutes)
    75-80: Show the predictions of the rivals for 46-50 and compare to the true values. Then reveal the true rule. (5 minutes)
    80-100: Discussion (20 minutes)

    Now, debrief talking points:

    - Modal claim: We had multiple rules that fit the data (the team rules in round1, and then the rivals). This shows that for any finite data, there are multiple hypotheses that are consistent with the data.

    - Historical claim: The true rule was not proposed by any team until the reveal. This illustrates that at any given time, there might be unconceived alternatives that also fit the data.

    - Methodological claim: The activity does not show that methodological virtues (like simplicity) do not track truth. In fact, the true rule is relatively simple. But it might not be the simplest proposed. We cannot conclude that the virtues are not truth-conducive from this activity.

    - Admissibility: We ruled out contrived rivals. In science, we also rule out ad hoc hypotheses. But is contrivance a defect? It might be, because it makes the hypothesis less testable or less unified.

    - Underdetermination: The word is now introduced. It means that the evidence does not uniquely determine the theory.

    - How science avoids global skepticism: By using methodological virtues to choose the best theory available, and by continuing to test. But we acknowledge that there might be unconceived alternatives that are better.

    Finally, what goes wrong:

    - Someone produces a gerrymandered rival: We rule it out by admissibility criteria. If one slips through, discuss in debrief why it is not a serious alternative.

    - Scoring rewards overfitting: In round2, the wager system penalizes overconfidence, so it might mitigate overfitting.

    - Reveal dismissed as cheating: Have the true rule in a sealed envelope from the beginning? Or show the spreadsheet formula at the end.

    - Activity overruns: Keep strict time.

    - Global skepticism: Emphasize that the activity is a simplified model and that in real science, we have more data and more constraints.

    - The true rule might be proposed? Unlikely, but if it is, then choose a different true rule for next time? Or, in the debrief, note that sometimes the true rule is conceived, but often it is not.

    Given the complexity, we might adjust the true rule if we see a team is close. But that is risky. It's better to have a rule that is unlikely to be guessed.

    I think the sqrt rule is a good choice.

