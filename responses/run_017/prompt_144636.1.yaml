answer: |-
  ### Planning
  (a) Three candidate cruxes:
  1. Whether the engineer's ability to act on aggregate suspicion without identifying the failed replica resolves the tension present in lottery/preface cases.
  2. Whether rejecting the justification closure principle (JCP) forces rejection of the reverse "conjunction-false" principle (CFP), and whether preface uniquely relies on CFP.
  3. Whether the monitor's alert structurally resembles lottery's "someone wins" claim or preface's "at least one error" claim, and what follows if it's a hybrid.

  (b) Set aside:
  - Crux 1: Actionability doesn't resolve the core epistemic tension about justification; it merely relocates practical questions.
  - Crux 2: While important, CFP is derivable from JCP via modus tollens, making it less distinctive than the monitor's hybrid role.

  (c) Likely faking move:  
  A student might assert that correlated failures "obviously" collapse the scenario into the preface case without analyzing how correlation alters justification thresholds.

  ### 1. Exam Question (25 marks total, 60 minutes)  
  **Stem:**  
  In epistemology, the lottery paradox shows that if we have strong statistical grounds to believe each individual ticket lost (e.g., 1/1000 chance to win), we cannot justifiably believe no ticket won—yet we know one did win. The preface paradox shows that an author may justifiably believe each claim in their book while also justifiably believing (due to fallibility) that at least one claim is false. Both challenge principles linking justification for individual claims to their conjunction.  

  Consider this scenario:  
  > An AI system runs a batch across 1,000 independent inference replicas. Each replica fails (returns wrong output) with probability 0.001. Failures are statistically independent due to separate seeds/provisioning. A monitor (99% reliable) alerts: "At least one replica failed this batch." As on-call engineer, you have:  
  > - Very strong statistical grounds to believe of *each individual replica* that it succeeded.  
  > - Decent grounds to believe the monitor’s alert.  
  > - No way to identify *which* replica failed.  
  > The system lets you discard/re-run the batch without locating the failure.  

  **Questions:**  
  (a) Does the engineer’s ability to act on the monitor’s alert *without identifying the failed replica* resolve the tension between believing individual replicas succeeded and believing the monitor’s alert? Explain why or why not. (5 marks; 12 min)  
  (b) The monitor’s alert ("at least one replica failed") resembles the lottery’s "one ticket won" claim and the preface’s "at least one error" claim. Is it closer to one? If neither, what philosophical problem arises? (7 marks; 15 min)  
  (c) Suppose replicas share model weights/input data, making failures *positively correlated*. How does this alter the justification for believing *each individual replica succeeded*? What happens to the tension? (6 marks; 15 min)  
  (d) Must rejecting justification of conjunctions (à la preface) commit us to rejecting the principle: "If justifiably believing a conjunction is false, then one must justifiably disbelieve at least one conjunct"? Briefly defend your view. (7 marks; 18 min)  

  ### 2. Model Answer (~900 words)  
  **(a)** No, actionability does not resolve the epistemic tension. The tension arises from conflicting *doxastic attitudes*: strong justification for each replica’s success versus justification for the monitor’s alert (implying ≥1 failure). Acting (e.g., re-running) is a *pragmatic* response to uncertainty but doesn’t reconcile whether both beliefs can be simultaneously rational. In the preface, authors can issue errata (an action) without solving the paradox. Here, re-running avoids reliance on beliefs about *specific* replicas but leaves intact the conflict between believing "all succeeded" (implied by each) and "not all succeeded" (from the monitor). The tension persists at the level of *justification*, not action.  

  **(b)** The monitor’s alert is a hybrid but functionally closer to the *lottery’s "someone won"* claim. Both:  
  - Describe a definite event: one replica failed / one ticket won.  
  - Derive from statistical properties of a set (replica failures/ticket wins).  
  - Contrast with the preface’s "at least one error," which is a concession to human fallibility, not a calculable probability.  

  However, it differs from lottery: the monitor adds testimonial evidence (99% reliability), while lottery relies purely on statistics. If neither, a problem arises: the alert might demand *two incompatible standards of justification*. Statistical justification for individual success (P(success) = 0.999) suggests threshold-based justification (where belief requires probability > threshold). Testimonial justification for the alert (99% reliable) suggests we must believe it, but this entails disbelieving all replicas succeeded—violating *conjunction closure* (if justified in each conjunct, justified in conjunction). This hybrid nature exacerbates the paradox.  

  **(c)** Positive correlation *weakens justification for each individual success claim*. Independence underpins the high probability (0.999) for each replica’s success. With correlation, a failure in one replica increases the chance others failed (e.g., shared faulty weights). If failures are perfectly correlated, P(all succeed) drops from (0.999)^1000 ≈ 0.37 to 0.999—no longer negligible. The tension *lessens* because:  
  - Justification for "each succeeded" weakens (correlation raises doubt).  
  - Justification for "≥1 failed" strengthens (correlation increases system fragility).  
  This mirrors how preface errors (if from a shared false assumption) correlate, making "no errors" less justifiable. The paradox persists but with reduced force, as statistical justification for individual claims diminishes.  

  **(d)** Rejecting justification for conjunctions (denying JCP) does *not* force rejection of the "conjunction-false" principle (CFP). CFP states: if justifiably believing a conjunction (P&Q&R...) is false, one must justifiably disbelieve at least one conjunct. CFP can hold even if JCP fails. In the preface, the author justifiably believes the book contains ≥1 error (false conjunction of all claims) but need not justifiably disbelieve any *specific* claim—she rejects CFP. In our scenario, the engineer justifiably believes the monitor (implying the conjunction "all succeeded" is false) but lacks justification to disbelieve any *particular* replica’s success. Rejecting JCP (for conjunctions) is consistent with *accepting* CFP only if we can pinpoint the faulty conjunct—which neither preface nor our case allows. Thus, rejecting JCP *without* rejecting CFP is untenable here.  

  **Glossary:**  
  - **Justification closure principle (JCP):** If S is justified in believing P, and S is justified in believing Q, then S is justified in believing (P&Q).  
  - **Conjunction-false principle (CFP):** If S is justified in believing (P&Q&R...) is false, S is justified in disbelieving at least one of P, Q, R...  
  - **Doxastic attitude:** A mental state toward a proposition (e.g., belief, disbelief, suspension).  
  - **Threshold-based justification:** Belief is justified if probability exceeds a fixed threshold (e.g., 0.95).  
  - **Modus tollens:** Logical rule: If P implies Q, and Q is false, then P is false.  
  - **Pragmatic:** Concerning practical consequences, not truth/justification.  

  ### 3. Marking Scheme  
  **Excellent (21-25 marks):**  
  - (a) Clearly distinguishes action from justification, cites irrelevance of identifiability.  
  - (b) Identifies hybrid nature, prioritizes lottery-like structure, explains testimonial vs. statistical conflict.  
  - (c) Correctly links correlation to weakened individual justification and reduced tension; contrasts with independence.  
  - (d) Separates JCP/CFP, shows CFP requires pinpointing failures, notes inconsistency in accepting CFP without JCP here.  

  **Competent (15-20 marks):**  
  - (a) Notes action doesn’t resolve belief tension but conflates identifiability with action.  
  - (b) Correctly picks lottery or preface but misses hybrid aspects.  
  - (c) States correlation weakens individual justification but doesn’t analyze tension.  
  - (d) States JCP/CFP link but doesn’t explain why rejecting JCP may compel rejecting CFP.  

  **Weak (0-14 marks):**  
  - (a) Asserts action resolves tension or misdescribes tension.  
  - (b) Misclassifies alert; no comparison.  
  - (c) Ignores probability shifts or claims correlation "solves" paradox.  
  - (d) Equates JCP/CFP or claims they stand/fall together unconditionally.  

  **Sophisticated-sounding errors (lose 2-3 marks per occurrence):**  
  - **"This is just gambler’s fallacy"**: Incorrect—gambler’s fallacy mistakes independence; here independence is given. *Costs:* Misdiagnoses the paradox.  
  - **"Expected utility justifies action, so justification is pragmatic"**: Confuses epistemic justification with decision theory. *Costs:* Fails to address doxastic tension.  
  - **"Rejecting closure ends the matter"**: Overlooks that rejecting JCP doesn’t explain why CFP fails. *Costs:* Incomplete answer to (d).  
  - **"Correlation makes it purely a preface case"**: Ignores that monitor’s alert retains lottery-like definiteness. *Costs:* Oversimplifies (b)-(c).  

  ### 4. Instructor Note  
  **Prior knowledge assumed:**  
  Students need only recognize the lottery/preface paradoxes as challenges to justification closure (JCP). No familiarity with solutions required.  

  **Handling disagreeable conclusions:**  
  Credit competent arguments even if opposed to the model answer. Example: A student defending CFP in (d) must explain how the engineer *can* justifiably disbelieve a specific replica without evidence. Focus on coherence, not conclusions.  

  **Exam-room announcements:**  
  1. "Statistical independence means replica failures do not influence each other; positive correlation means they tend to fail together."  
  2. "The monitor’s alert is treated as reliable testimony; do not question its 99% reliability."  
  3. "Marks depend on applying concepts (e.g., JCP, thresholds) to the scenario, not naming philosophers."  

  ### 5. Key Sentence  
  **"A monitor (99% reliable) alerts: 'At least one replica failed this batch.'"**  
  This hybrid claim—statistical yet testimonial, definite yet aggregate—generates the core philosophical novelty.  

  ### Note on Your Framing  
  Your scenario successfully generates tension by blending lottery-like probabilities with preface-like systemic doubt. The monitor’s reliability introduces testimony, creating a fresh challenge beyond classical paradoxes. No confusions detected.
