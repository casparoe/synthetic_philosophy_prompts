prompt: |-
  I sit on a hospital's therapeutics committee as its non-clinical member, and at our last meeting two of the clinicians — Marcus and Lena — spent most of an hour arguing about a proposal I now have to summarise in a memo, and I genuinely cannot tell who won. The proposal is this: formulary decisions (whether to adopt a proposed treatment protocol) are currently made by one senior clinical pharmacologist, whom a retrospective audit of the last few hundred cases puts at roughly 75% correct against our reconstructed gold standard; a working group wants to replace her with the majority verdict of a 15-member panel drawn from a rotating pool of generalist clinicians, each of whom the same audit puts at roughly 60% on comparable judgments. My own decision theory is about fifteen years stale, so I'd like the argument adjudicated rather than summarised back to me.

  Here is roughly how it went. (1) Marcus opened with the Condorcet jury theorem: at p = 0.6, a majority of fifteen is right a shade under 79% of the time, which beats the pharmacologist's 75%, and it keeps improving as you add members, whereas a single reviewer's number is a fixed ceiling — with forty-one panelists you'd be above 90% — and a single decision-maker is also a single point of failure (capture, a bad year, an idiosyncratic dogmatism about a drug class). (2) Lena said the independence assumption is doing all of the work: the panelists read the same dossier, the same evidence review, share a training and a set of professional habits, and talk in the corridor, so their errors are correlated; if the effective number of independent votes is closer to three, a majority of three gets you about 65%, well below the pharmacologist. She added that the assumption is really independence conditional on the truth of the matter, and that a shared signal which is merely noisy — right most of the time but not always — is precisely what makes votes co-vary within the set of cases where the truth goes one way rather than the other. (3) Marcus replied that the conditional formulation cuts his way too: if the shared dossier is highly reliable, conditioning on it is nearly conditioning on the truth and independence is nearly intact, so what breaks the theorem is shared-but-noisy evidence, which is a design problem — split the fifteen into three sub-panels of five, commission a separate evidence summary for each, and decide by majority of the three sub-panel verdicts. (4) Lena answered that you cannot manufacture independent summaries of one fixed body of trial data — re-commissioning or rewriting the same evidence yields correlated summaries, so the sub-panel structure is cosmetic unless you change the information rather than the packaging, since what buys reliability is redundancy of evidence channels, not redundancy of heads; that in any case, under the very independence assumption he is leaning on, the hierarchy costs accuracy, because each five-person sub-panel is right about 68% of the time and a majority of three of those is about 76%, a bit below the flat fifteen-person majority; and that the 60% is a reference-class average, whereas the items that actually reach a vote are the contested ones, where everyone's competence degrades — and the theorem has a flip side, so that if effective competence dips below 0.5, majority voting becomes worse than useless. (5) Marcus conceded the agenda point but said it is an argument about the decision rule, not about the decision-maker: since adopting an ineffective or harmful protocol is considerably worse than delaying an effective one, the panel should be run under a supermajority rule — say ten of fifteen, with a default to "do not adopt" — and a panel's threshold is a tunable dial in a way that a single reviewer's judgment is not. (6) Lena closed by saying a single reviewer's threshold is tunable too: you ask for her confidence, she can escalate or abstain, and she can say "this one is hard" — whereas fifteen binary votes discard exactly the graded confidence that asymmetric error costs make most relevant, and the panel cannot abstain collectively without effectively defaulting to inaction anyway.

  Please go through this move by move and tell me who is right about which specific point, rating each move from clearly mistaken to clearly right with a brief justification, and then say who is more right overall and what, if anything, both of them are missing. I'd particularly like you to (a) check the numbers rather than inherit them, and tell me if any of the percentages quoted above are wrong; (b) be explicit about what the jury theorem does and does not require of the votes — unconditional versus conditional independence, and what a shared evidence channel does to each; (c) take a view on the hierarchical variant in (3) and (4), including whether there are conditions under which the sub-panel design would beat the flat majority of fifteen, and what would have to be true of the evidence channels for that; (d) say how much the agenda-selection and heterogeneous-competence points in (4) actually threaten the case for the panel, given that they seem to threaten the single reviewer as well; and (e) say whether the threshold-tuning exchange in (5) and (6) is a genuine advantage for either arrangement, or whether continuous-confidence aggregation dominates both. Don't hedge into a summary of the literature or a list of considerations — I need a verdict I can put in a memo, including on whether the honest answer is that the audit numbers are too thin to settle any of this.
reasoning: |-
  Okay, the user is on a hospital therapeutics committee as the non-clinical member and needs to summarize a debate between Marcus and Lena about changing how formulary decisions are made. They want me to adjudicate who was right on each point rather than just summarizing. Let me start by understanding their scenario.

  First, the current system has one senior pharmacologist with a 75% correct rate based on an audit. The proposal is to switch to a 15-member panel, each with 60% accuracy, using majority vote. Marcus supports the panel, citing the Condorcet Jury Theorem (CJT), which at p=0.6 gives about 79% accuracy for 15 members. Lena argues that independence is unrealistic because panelists share evidence and training, leading to correlated errors. She thinks effective independence might be as low as three, reducing accuracy to 65%. 

  I need to verify Marcus's numbers. Calculating CJT for 15 members at p=0.6, majority (8+ votes) is indeed around 78.6%, which is higher than 75%. But Lena’s point about independence is crucial. CJT requires votes to be independent conditional on the truth. Shared evidence introduces correlation, which lowers effective independent voters. If correlation is high, the panel’s accuracy drops significantly. Lena’s estimate of three effective voters might be pessimistic, but without data, it's speculative. So Marcus is technically correct on the theorem but overlooks real-world dependencies, making Lena’s rebuttal valid here.

  Next, Marcus suggests sub-panels with separate evidence summaries to restore independence. Lena counters that re-commissioning the same data won’t create independence; you need genuinely different evidence channels. Also, hierarchical voting reduces accuracy: each 5-person panel at p=0.6 has 68.3% accuracy, and majority of three such panels is about 76.3%, which is lower than the flat panel’s 78.6%. So Marcus’s solution is flawed unless new evidence is introduced, which isn’t feasible. Lena wins this point.

  Then Marcus proposes a supermajority rule (e.g., 10/15) to avoid harmful protocols. Lena argues that a single reviewer can express confidence levels and escalate, while the panel’s binary votes lose nuanced judgment. Supermajority might reduce false positives but at the cost of more false negatives. Continuous confidence from an expert could be more informative. Here, Lena has a point about flexibility in decision thresholds, though Marcus’s idea is tunable in a different way. But given asymmetric errors, graded confidence might be superior.

  On agenda selection, Lena mentions that contested cases might have lower competence. This affects both the panel and the single reviewer, but if the panel’s average p drops below 0.5, majority voting becomes harmful. Without data on contested cases, it’s unclear how much this impacts either system. So Lena’s concern is valid but equally applicable to both.

  Overall, Lena’s arguments highlight practical flaws in Marcus’s assumptions, especially independence and evidence correlation. The audit numbers are too thin to prove the panel’s superiority. The single reviewer’s 75% might be more reliable given correlated panelists. The key missing piece is data on error correlation and contested case competence. Without that, switching to the panel is risky. Lena’s points about graded confidence and flexibility also stand out. So I need to conclude that Lena is more correct overall, but both have valid points. The memo should recommend sticking with the pharmacologist or gathering more data before changing systems.
answer: |-
  Here is a move-by-move adjudication with explicit verdicts, number verification, and answers to your specific queries. The audit data *is* too thin to definitively favor the panel, but the arguments reveal critical flaws in Marcus's proposal.

  ### Move-by-Move Adjudication
  1. **Marcus (CJT & Scaling Advantage):**  
     *Claim:* Majority of 15 at p=0.6 ≈ 79% > 75%; improves with size; avoids single point of failure.  
     *Number Check:* Correct. Binomial calculation: P(X≥8) for n=15, p=0.6 ≈ **78.6%** (not "shade under 79%"). At n=41, P(X≥21) ≈ **90.1%**.  
     *Verdict:* **Partially Right, Partially Misleading**.  
     *Justification:* The math is correct *if votes are independent conditional on the truth*, but Marcus ignores correlation (Lena's next point). Scaling beyond 15 is impractical. Single point of failure is valid but overemphasized.

  2. **Lena (Violation of Independence):**  
     *Claim:* Shared evidence/training correlates errors; effective independence ~3 → majority accuracy ~65%.  
     *Number Check:* Correct for effective n=3: P(X≥2) for n=3, p=0.6 ≈ **64.8%**.  
     *Verdict:* **Clearly Right (Core Insight)**.  
     *Justification:* CJT requires *conditional independence* (given ground truth). Shared noisy evidence correlates errors. Her "effective n" is hypothetical but directionally sound. "Conditional on truth" phrasing is precise.

  3. **Marcus (Sub-Panels & Independent Summaries):**  
     *Claim:* Sub-panels with separate evidence summaries restore independence.  
     *Verdict:* **Clearly Mistaken**.  
     *Justification:* Independent *summaries* require independent *evidence channels* (e.g., separate trials). Rewriting the same dossier adds minimal independence (high correlation). Design is impractical for most medical evidence.

  4. **Lena (Hierarchy Cost, Agenda Selection, p<0.5 Risk):**  
     *Claims:*  
     a) Hierarchical accuracy loss: 5-person panel (68%) → majority of 3 such panels (76%) < flat 15 (78.6%).  
     b) Agenda selection lowers p (contested cases harder).  
     c) If p<0.5, majority harmful.  
     *Number Check:*  
     - P(X≥3) for n=5, p=0.6 = **68.3%** (Lena: 68%).  
     - P(Y≥2) for 3 sub-panels, each P_correct=0.683 ≈ **76.3%** (Lena: 76%).  
     *Verdict:* **a) Clearly Right, b/c) Speculative but Valid**.  
     *Justification:*  
     - Hierarchy *always* reduces accuracy under CJT assumptions (no free lunch).  
     - Agenda selection *does* likely lower p for both systems, but threat is symmetric.  
     - p<0.5 risk is theoretical but real for panels if shared bias dominates.

  5. **Marcus (Supermajority Tuning):**  
     *Claim:* Supermajority (e.g., 10/15) tunes error asymmetry; single reviewer can't adjust threshold.  
     *Verdict:* **Half-Right**.  
     *Justification:* Supermajority *can* reduce false positives (adopting bad drugs) but increases false negatives (rejecting good drugs). However, a single reviewer *can* incorporate risk-aversion (e.g., "escalate if uncertain").

  6. **Lena (Graded Confidence & Collective Abstention):**  
     *Claim:* Single reviewer provides confidence gradation; panels discard nuance; abstention equivalent to inaction.  
     *Verdict:* **Clearly Right**.  
     *Justification:* Binary votes lose critical information when error costs are asymmetric. A single expert can express uncertainty (e.g., confidence scores) enabling better cost-sensitive decisions.

  ---

  ### Overall Verdict
  **Lena is more convincing overall.** Marcus's reliance on CJT ignores the fatal flaw of correlated errors in real-world panels. Lena correctly identifies that:
  - **Independence is destroyed by shared evidence**, rendering CJT overly optimistic.
  - **Hierarchy reduces accuracy** and doesn't fix correlation.
  - **Graded confidence** from a single expert better handles asymmetric costs.

  Marcus's points about tunable thresholds and single-point failure have merit but are outweighed by the correlation problem and loss of nuance.

  ---

  ### Answers to Specific Queries
  **(a) Audit Numbers:**  
  - Single reviewer: 75% correct (assumed reliable).  
  - Panelists: 60% correct *on comparable judgments*.  
  - **Problem:** The 60% may not hold for *contested formulary cases* (likely harder). No data on error correlation between panelists. Numbers *are* too thin to trust CJT predictions.

  **(b) Jury Theorem Requirements:**  
  - **Requires:**  
    - Voters identical and competent (p > 0.5).  
    - Votes **conditionally independent** *given the ground truth*.  
  - **Shared Evidence Impact:**  
    - Shared *noisy* signal → votes correlated → CJT overestimates accuracy.  
    - Shared *perfect* signal → votes perfectly correlated → no gain from aggregation.  
    - Shared *highly reliable* signal → partial correlation → moderate gain.  

  **(c) Sub-Panel Design:**  
  - **Would only beat flat panel if:**  
    1. Sub-panels receive **truly independent evidence** (e.g., separate research teams, different trials).  
    2. Sub-panel evidence summaries are **less noisy** than the original dossier (unlikely).  
  - **In reality:** Rewriting same evidence → high correlation → hierarchy *lowers* accuracy vs. flat majority (as calculated).

  **(d) Agenda Selection & Heterogeneous Competence:**  
  - **Threat to both:** Contested cases likely reduce *both* pharmacologist's and panelists' p.  
  - **Unique threat to panel:** If shared biases push *effective* p < 0.5 for controversial cases, majority voting becomes harmful. Single reviewer avoids this (if her p remains >0.5).  
  - **Conclusion:** Weakens panel more than single reviewer if panelists are more susceptible to groupthink on contentious issues.

  **(e) Threshold Tuning & Confidence Dominance:**  
  - **Supermajority:** Tunable but crude; sacrifices too many true positives.  
  - **Single reviewer threshold:** Adjustable via confidence thresholds (e.g., "only approve if >90% sure").  
  - **Continuous-confidence aggregation** (e.g., averaging expert scores) **dominates both** binary voting and single reviewer *if* properly implemented.  
  - **Practical verdict:** Single reviewer’s graded confidence is more actionable than panel’s binary votes under asymmetric costs.

  ---

  ### Final Recommendation for Memo
  > **Background:** Proposal to replace single pharmacologist (75% correct) with 15-member panel (members ~60% correct) using majority vote.  
  > **Key Findings:**  
  > 1. Marcus's 79% panel accuracy relies on unrealistic independence assumptions. Correlated errors (due to shared evidence) likely reduce accuracy below 75%.  
  > 2. Sub-panels or supermajorities do not resolve correlation and may worsen outcomes.  
  > 3. Single reviewer's ability to express graded confidence better addresses risk asymmetry.  
  > 4. Audit data is insufficient to model correlation or contested-case competence.  
  > **Recommendation:** Reject panel proposal. Retain single pharmacologist but explore confidence-based escalation protocols. If aggregation is desired, test small panels (5–7 members) with *individual* evidence assessments and continuous confidence aggregation.
