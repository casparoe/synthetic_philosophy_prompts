prompt: |-
  I sit on a couple of volunteer committees where any spend above a few hundred dollars needs unanimous sign-off: there's no vote, one person can just kill a proposal, and we talk until nobody objects. I keep noticing a pattern in how that goes and I don't have a word for it.

  Two instances. There was a grant we could have made to a group with a hard deadline. Six of us thought it was clearly worthwhile; two people were unsure, mostly because they'd read less about the area than the rest of us; and it died. A month later we approved a much duller, much safer expenditure that nobody was unsure about. I don't think anyone thinks the second one was better than the first — it's just that nobody's uncertainty got triggered. What seems to be going on is that the effective bar isn't our average view, it's the view of whoever happens to be most doubtful, and that person is usually the one with the least information rather than the one who's right. Adding members seems to make blocking more likely, not less.

  The second thing: because everyone knows who the blockers are, we've started wearing the same two or three people down, and now what gets through is whatever happens not to bother the member who caves most easily. So the veto seems to drift to whoever is most stubborn rather than to whoever is most cautious, which feels like a different distortion from the first one, and I can't tell if it's even the same phenomenon.

  I vaguely remember something from a blog post years ago called the unilateralist's curse, about groups where any one member can act alone — but that's the opposite setup, and I can't work out whether it's the same machinery pointed the other way or a genuinely different thing. Searching turns up "veto player", but that seems to be about comparing political systems, not about what happens to the quality of the judgement.

  So: does the version I'm describing have an established name? I don't just want a label — I want to know what exactly the distortion is, whether it's the same mechanism as the unilateralist's curse or a different one, whether the stubbornness part has been noticed as a separate effect, and what the nearest concepts are and why each doesn't quite fit. And whether the usual remedies for the acting-alone version (deferring, asking first, requiring agreement) do anything here or actually make it worse.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're on volunteer committees where any spending over a few hundred dollars needs unanimous approval. No voting—just talking until no one objects. The user notices two patterns: first, proposals get blocked by the least informed members, and second, over time, the most stubborn members end up controlling decisions.

  I recall the unilateralist's curse, which is when any member can act alone, leading to too many actions. But here, it's the opposite—anyone can block, so it's about inaction. The user mentioned this and is unsure if it's the same mechanism reversed. I think it is. The curse originally means that with unilateral action, the noisiest or most extreme members push things through. Here, with unilateral veto, the most cautious or uncertain block things. So same statistical idea but inverted.

  The first pattern—least informed members blocking proposals. That sounds like the statistical effect where the person with the highest uncertainty threshold stops everything. If each member has a random threshold for blocking, adding more members increases the chance that one has a high threshold. So more members make blocking more likely. That aligns with the user's observation.

  The second pattern is about the stubbornness dynamic. Because everyone knows who the blockers are, they pressure them until someone caves. Then the veto shifts to the most stubborn person. This seems like a behavioral adaptation to the initial setup. It's not just statistical; it's strategic. Members learn who resists and either avoid proposals or wear them down. The user wonders if this is separate. I think it's a consequence. The initial setup creates an environment where stubbornness is rewarded, leading to a different distortion.

  The user wants to know if there's an established name. Terms like "dictator-by-default" or "minority rule" come to mind, but they don't capture the statistical aspect. "Veto players" from political science refers to entities that can block decisions but doesn't address the quality distortion. The closest might be the reversal of the unilateralist's curse, but I'm not sure if it has a specific name.

  Remedies: The user mentioned that deferring or requiring agreement might make things worse. In unilateral action, requiring agreement prevents rash actions. Here, requiring unanimity causes inaction. So remedies for one exacerbate the other. Solutions like reducing unanimity, using expert subgroups, or anonymous objections could help. But the behavioral part with stubborn members might need separate strategies, like rotating veto power or discussing without names.

  The user's deeper needs: They want to understand the mechanisms to propose solutions. They might feel frustrated that good proposals die and the committee's effectiveness is compromised. They need validation that the problem is recognized and strategies to address both the statistical and behavioral issues.
answer: |-
  Your committee's dynamics are a fascinating case study in the pathologies of unanimity rules. What you're describing **doesn't have one universally agreed-upon name**, but it's a well-recognized cluster of problems arising from **unilateral veto power in group decision-making under uncertainty**. It's distinct from, but mathematically related to, the unilateralist's curse. Let's break down the components:

  1.  **The Core Distortion: The "Weakest Link" or "Highest Threshold" Effect (Your First Pattern)**
      *   **Mechanism:** With unanimity required, the proposal must clear *every single member's individual approval threshold*. The final outcome isn't determined by the average enthusiasm or even the median view, but by the **most pessimistic, uncertain, or risk-averse member at that moment**. As you astutely observed, this person is often the *least informed* rather than the most insightful. Adding members statistically increases the likelihood that *someone* will have a high threshold for approval (due to genuine caution, lack of info, idiosyncratic preferences, or even momentary distraction).
      *   **Relation to Unilateralist's Curse:** This is **precisely the inverse mechanism**.
          *   *Unilateralist's Curse:* Any *single* member can *act* (e.g., launch a project). The group tends towards *too much action* because the member with the *lowest action threshold* (most reckless, overconfident, or extreme) triggers it. The outcome is biased towards the most trigger-happy member.
          *   *Your Committee's Veto Curse:* Any *single* member can *block* action. The group tends towards *too little action* (or only ultra-safe action) because the member with the *highest approval threshold* (most cautious, uncertain, or risk-averse) blocks it. The outcome is biased towards the most reluctant member.
          *   **Mathematical Core:** Both phenomena stem from the statistical property of **order statistics**. The outcome depends on an extreme value (minimum action threshold for curse, maximum approval threshold for veto) within the distribution of individual thresholds. Adding members increases the range of these extremes. Whether it causes too much or too little action depends on whether the extreme value required is the *minimum* (curse) or *maximum* (veto) threshold.
      *   **Why "Veto Player" Doesn't Quite Fit:** While you have "veto players," the term in political science (Tsebelis) focuses on *comparing systems* based on the *number* and *alignment* of institutional veto points. It doesn't inherently capture the *distortion in collective judgment quality* or the specific dynamics of *uncertainty amplifying the least informed voice* that you're experiencing. Your problem is about the *operational consequence* of having veto players in a context of imperfect information.
      *   **Near Concept: "Minority Rule" or "Tyranny of the Minority":** This captures the *power* aspect (one person can stop many) but lacks the specific focus on *uncertainty* and *information asymmetry* driving the blocking. It doesn't explain why the blocker is often the least informed or why safe proposals pass.

  2.  **The Evolved Distortion: The "Stubbornness Equilibrium" (Your Second Pattern)**
      *   **Mechanism:** This is **not the same core phenomenon as the first**, but a **behavioral adaptation** *caused* by the first. Knowing the unanimity rule and identifying the frequent blockers ("pivotal veto players"), the group develops strategies:
          *   *Anticipation:* Members avoid proposing anything they suspect *might* trigger a known blocker, leading to self-censorship and only "safe" proposals.
          *   *Wear-Down Tactics:* Pressure is applied to perceived "softer" blockers or those perceived as less committed, hoping they'll cave to avoid conflict or prolonging the meeting. This *selects* for the blocker who holds out the longest under pressure – the most stubborn.
          *   **Result:** The *effective* veto shifts. It's no longer just held by the *most cautious* (who might block based on principle or risk), but by the *most stubborn* (who blocks based on resolve, personality, or willingness to endure conflict). The group optimizes for "not bothering the easiest cave," leading to decisions that satisfy the stubborn at the expense of potentially better options.
      *   **Is it Separate?** Yes, in origin. The *core* is the statistical "highest threshold" effect. The "stubbornness equilibrium" is a *social/strategic response* to the core rule and the repeated interactions identifying the blockers. It's a second-order distortion.
      *   **Near Concepts:**
          *   *Horsetrading/Logrolling:* Not quite, as that involves explicit trades ("I'll support your X if you support my Y"). Your dynamic is implicit pressure to relent.
          *   *Path Dependency/Institutional Drift:* The rules (unanimity) create incentives that shift behavior over time towards accommodating the stubborn.
          *   *Negotiation Theory (BATNA/Reservation Price):* The stubborn blocker has a lower "cost" for holding out (higher tolerance for conflict/inaction) than others have for pushing back, giving them leverage. The "easiest cave" has a lower tolerance for conflict.

  **Synthesizing the Whole: What to Call It?**

  You could describe it as:
  *   **The Unilateral Veto Curse:** Emphasizing its inverse relationship to the Unilateralist's Curse.
  *   **The Weakest Link Problem with Stubbornness Drift:** Capturing both the core statistical effect and the evolved behavioral distortion.
  *   **Pessimistic Extreme Governance:** Highlighting the reliance on the highest approval threshold.
  *   **Dictator-by-Default Dynamics:** Underlining how one reluctant/stubborn member effectively controls outcomes.

  **Why Remedies for the Unilateralist's Curse Fail (or Backfire) Here:**

  The standard cure for the Unilateralist's Curse ("anyone can act") is to **require prior consultation/agreement** (e.g., "Don't act unless you check with others first"). *This is exactly the rule you already have!* And as you see, it causes the opposite problem: paralysis and safe-only actions.

  *   **Deferring/Asking First:** *Exacerbates* your problem. It formalizes the veto power and gives the highest-threshold/stubborn member *more* opportunity to block. It increases transaction costs and favors the status quo.
  *   **Requiring Agreement:** This *is* your unanimity rule, which *is* the root cause.

  **Potential Remedies for Your Veto Problem:**

  1.  **Abandon Unanimity for Spending:** This is the most effective solution. Move to supermajority (e.g., 75%, 80%) or even simple majority for spending above the threshold. This breaks the "weakest link" logic and reduces the power of a single uninformed or stubborn member.
  2.  **Tiered Approval:** Smaller amounts: Chair/Subcommittee approval. Medium amounts: Majority vote. Only very large amounts: Unanimity (or high supermajority).
  3.  **Delegate to Subcommittees with Expertise:** Empower a smaller group (selected for relevant knowledge/engagement) to make recommendations or decisions within a budget. The full committee ratifies or discusses exceptions. This mitigates the "least informed blocker" problem.
  4.  **Anonymous Objections (with Threshold):** For objections to be valid, they must be submitted anonymously *in writing* with a reasoned justification *before* the meeting. The full committee then discusses the *objection itself* (anonymized), not who raised it. This weakens personality/stubbornness dynamics and forces blockers to articulate reasons, potentially exposing uninformed objections. (Requires a threshold, e.g., 2 objections trigger full discussion/vote).
  5.  **Rotating "Challenge Rights":** Assign (perhaps randomly) one member per meeting the right to *single-handedly send a proposal back for revision/clarification*, but *not* to kill it outright. This preserves some caution without granting permanent veto power to the most stubborn.
  6.  **Pre-Meeting Information & Discussion:** Mandate reading and an *asynchronous* discussion thread (e.g., forum, email chain) *before* the meeting where decisions are made. This gives less-informed members time to get up to speed and voice concerns early, potentially resolving uncertainty before the veto moment. It surfaces objections in a lower-stakes environment.
  7.  **Explicit Time Limits & Fallbacks:** For time-sensitive grants, implement a rule: "If no unanimous agreement by Deadline X, the proposal passes with support of Y% (e.g., 80%)." This creates pressure on blockers to engage constructively or risk being overruled.
  8.  **Addressing Stubbornness Directly (Hardest):** Facilitated discussion about group dynamics. Frame it as optimizing for the *committee's mission*, not individual comfort or preferences. Rotate meeting facilitation. Explicitly discuss the cost of missed opportunities due to blocking.

  **Conclusion:** You're experiencing the **inverse of the Unilateralist's Curse** – a **Unilateral Veto Curse** – where the statistical tendency of the highest approval threshold to control outcomes combines with a behavioral drift towards stubbornness wielding the effective veto. The core problem is the unanimity requirement itself, which elevates the most cautious/uncertain (often least informed) voice to decisive power. The evolved "stubbornness equilibrium" is a separate but predictable social adaptation to this flawed rule. Remedies designed to curb rash unilateral action (like requiring agreement) are the *cause* of your problem. Solutions involve reducing the scope of unanimity, restructuring decision processes to mitigate information asymmetry and personality effects, and creating mechanisms to override pure veto power when necessary for the group's effectiveness.
