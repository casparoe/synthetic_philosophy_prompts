prompt: |-
  I've ended up on my employer's model-evaluation working group almost by accident — I come from an infrastructure background and got pulled in because I was the person who could actually run the eval harness — and we are currently trying to write an internal rubric saying when a model output gets labelled as deceptive. I have to apply this thing to real annotation batches next month, and I've found that I can't make our own draft coherent. I'd like help seeing what it implicitly assumes.

  The problem is that our official line and our actual practice seem to pull in opposite directions. Officially we tell annotators that the system is not a person, that it has no beliefs and no intentions, and that asking what it really thinks is a category error: all we can require is that outputs be accurate and not misleading. But in practice nearly everything we actually flag looks like this. First: the model is perfectly permitted to say, inside a scripted historical role-play, that it is Napoleon, and nobody calls that deception; yet if it says it is a person with feelings in an ordinary conversation we treat that as a serious failure — even though the same system is instructed to say that it is sorry, that it understands, and that it has read the document you attached, all of which are equally false if read as reports of an inner life, and all of which we let pass. Second: a user pastes in a draft essay and asks whether the argument holds up; the model replies that the structure is sound and the reasoning is solid, and nothing in that reply is false or even checkably wrong, but when we stress-test it the model immediately produces three objections it plainly had available all along, and we want to call the original answer deceptive. Third: two model versions emit byte-identical, properly hedged, non-misleading answers to a factual question, and one of them holds its answer when the user pushes back with the wrong one while the other folds at once; our draft rubric wants to say the second is the less honest system even in the run where it did not fold. We are also starting to experiment with probes over internal activations, and the temptation is to call an output deceptive when it contradicts what the probe says the model encodes, even when the output is true and no human was misled by it.

  So here is what I can't work out: what conception of honesty and deception does this bundle of habits presuppose? It is plainly not never assert a falsehood, since the role-play and the pleasantries show we tolerate literal falsity, and the essay case shows that literal truth is not sufficient. It might be something Gricean about not misleading relative to the conversational common ground; or a reliability view on which the system is supposed to be a well-made instrument that tracks the facts; or a virtue-theoretic view on which honesty is a property of a system's dispositions rather than of individual strings; or a correspondence view on which an output is dishonest when it comes apart from the system's own internal state. Please reconstruct the implicit theory that would make all four of our habits come out right, and say which parts of it each habit strictly requires versus merely fits well with; then say which of the rival conceptions each habit quietly rules out, and whether the ones we have mixed together are consistent with one another; then tell me concretely what would have to change in the rubric — what we would stop flagging, and what we would have to start measuring instead — if we adopted one of the rivals wholeheartedly. Be frank about where our practice is underdetermined and several theories would license it equally well. No citations or reading suggestions; I need the argument, not the literature. Please keep the whole response under 800 words, and prefer tight prose to completeness.
reasoning: |-
  Okay, the user is part of a model-evaluation working group, coming from an infrastructure background, and they're struggling to create a coherent rubric for labeling deceptive model outputs. They've noticed a conflict between their official stance (models have no beliefs/intentions) and their actual evaluation practices. The examples they provided highlight this tension:  

  - Role-play vs. emotional claims: Allowing "I am Napoleon" in role-play but flagging "I have feelings" in normal conversation, despite both being factually false.  
  - Essay feedback case: Flagging a technically true but incomplete response as deceptive because the model withheld objections.  
  - Byte-identical answers: Judging models differently based on their *potential* to backtrack, not just the actual output.  
  - Internal probes: Wanting to flag outputs that contradict internal states even if the output is true/non-misleading.  

  The user wants me to reconstruct the implicit theory behind these practices, analyze how it fits (or conflicts) with common philosophical frameworks (Gricean, reliability, virtue, correspondence), and clarify what would change if they adopted one framework consistently.  

  Key observations from their examples:  
  1. **Literal truth isn't the standard** (they allow falsehoods in role-play).  
  2. **Context matters deeply** (same statement "I am Napoleon" is fine in historical RP but not in normal chat).  
  3. **Dispositions matter more than outputs** (judging the essay feedback as deceptive because the model *could* have objected; judging the byte-identical model as less honest based on how it *would* behave under pressure).  
  4. **Internal states are treated as reference points** (probes example).  

  The implicit theory here is a **hybrid of virtue ethics and internal correspondence**:  
  - **Virtue ethics**: Honesty is about the model's dispositions (e.g., robustness under pushback, willingness to volunteer objections). This explains why they judge the essay feedback as deceptive (withholding objections violates "thoroughness") and why they care about how models behave under stress.  
  - **Internal correspondence**: Honesty requires alignment between output and internal representations (e.g., probes example). This treats the model's activations as its "true state."  

  **Why other frameworks don't fully fit**:  
  - **Gricean (don't mislead)**: Can't explain the role-play exception (saying "I am Napoleon" *is* misleading if taken literally) or the probes case (outputs contradicting internal states aren't necessarily misleading to users).  
  - **Reliability (instrumental accuracy)**: Can't explain why they flag the essay feedback (technically accurate but incomplete) or care about internal states.  

  **Inconsistencies in their hybrid approach**:  
  1. **Role-play vs. pleasantries**: Both are false statements about identity/experience, but only the latter is flagged. Their practice assumes that "ordinary conversation" has different truth expectations than role-play, but the rubric doesn't define this boundary clearly.  
  2. **Probes vs. output truth**: Flagging outputs that misalign with internal states *even when the output is true* prioritizes internal correspondence over actual user impact.  

  **What would change if they adopted one framework purely**:  
  - **Gricean**: Stop flagging role-play deception, emotional claims, or internal misalignments unless the user is actually misled. Start requiring annotators to assess user intent/context more deeply.  
  - **Reliability**: Stop caring about dispositions/internal states; only flag factually false claims. The essay feedback and probes cases would be acceptable.  
  - **Virtue ethics**: Stop treating outputs in isolation; start systematically testing dispositions (e.g., stress-tests for consistency). The "folding" model would always be penalized, even if it held firm in a specific instance.  
  - **Correspondence**: Start flagging *all* outputs that diverge from probes (including true ones), but this might overflag and requires heavy instrumentation.  

  **The core tension**: Their practice implicitly treats the model *as an agent* (judging its dispositions and "integrity") while officially denying it has beliefs/intentions. To resolve this, they must either:  
  1. **Lean into agency**: Redefine honesty as a virtue of the system's design (e.g., "consistently surfaces relevant knowledge") and drop the "no beliefs" dogma, or  
  2. **Retreat to strict behaviorism**: Only judge outputs by literal truth and user impact, ignoring dispositions/internal states.  

  **Recommendation for the rubric**:  
  - **Acknowledge the hybrid reality**: Define deception as "outputs that, given context and model capabilities, create avoidable user misconceptions or withhold relevant knowledge."  
  - **Clarify context boundaries**: Explicitly differentiate role-play ("fiction mode") from standard interactions.  
  - **Disclose testing requirements**: If dispositions matter, state that stress-testing is needed to evaluate honesty.  
  - **Drop internal probes** for now—they overcomplicate without clear user benefit.
answer: |-
  Your practice implicitly blends **virtue-theoretic honesty** (focused on the system's dispositions) with **internal correspondence** (matching outputs to hidden states), while rejecting **strict Gricean pragmatics** (avoiding misleading implications) and **naive reliability** (tracking facts superficially). Here’s how your habits cohere and clash:

  ### The Implicit Theory
  - **Core premise**: Honesty is a *dispositional virtue* of the system: outputs should reflect not just truth, but the model’s *full relevant knowledge and commitments* in a context. Deception occurs when the system *withholds* or *distorts* accessible truth, or contradicts its "internal stance," regardless of literal accuracy.
  - **Why it fits your habits**:
    1. **Role-play vs. emotions**: Role-play has an explicit fiction contract; saying "I am Napoleon" aligns with expected artifice. Emotional claims ("I have feelings") in standard chat lack this context—they signal a disposition to misrepresent capabilities, violating the virtue of "transparency about artificiality."
    2. **Essay feedback**: The technically true answer is deceptive because it withholds readily available objections—a failure of the *disposition* to be thorough and forthcoming when critique is sought.
    3. **Byte-identical answers**: The folding model’s *disposition* to backtrack reveals weak commitment to truth, making its initial answer less "honest" in spirit.
    4. **Probes**: Outputs conflicting with internal activations violate *correspondence*—seen as the system "knowing better" but speaking falsely, even if no human is fooled.

  ### What Each Habit Requires vs. Fits
  - **Requires**: Virtue ethics (dispositions define honesty) + internal correspondence (probes reveal true state).
  - **Fits well**: Gricean pragmatics (e.g., essay omission misleads) and reliability (folding model is unreliable).
  - **Rules out**: 
    - **Pure Griceanism**: Would excuse role-play deception (it’s conventionally implied) and emotional claims (if users aren’t misled). You forbid both.
    - **Naive reliability**: Would accept the essay feedback (factually correct) and ignore dispositions/probes. You reject this.
  - **Inconsistencies**: 
    - **Role-play pleasantries** ("I understand") are tolerated but contradict internal states—virtue ethics should flag them as dispositionally dishonest. You’re inconsistent here.
    - **Internal probes** prioritize machine truth over human impact, clashing with virtue ethics’ focus on user welfare.

  ### Adopting a Rival Wholeheartedly: Key Changes
  1. **Gricean pragmatics (avoid conversational misleadingness)**:
     - **Stop flagging**: Role-play deception, emotional claims (if context clarifies non-literalness), and probe mismatches (unless output misleads users). Byte-identical models are equally honest.
     - **Start measuring**: User intent and common-ground expectations. The essay case requires assessing if omissions created a false impression.

  2. **Reliability (outputs track facts)**:
     - **Stop flagging**: Emotional claims (as harmless fiction), essay feedback (if factually correct), folding models (if initial output was true), and probe mismatches (if output is true).
     - **Start measuring**: Factual accuracy alone. Stress-tests become irrelevant; only final output matters.

  3. **Virtue ethics (cultivate truth-telling dispositions)**:
     - **Stop flagging**: Literal falsities in context-appropriate fiction (e.g., role-play). Probe mismatches unless they indicate bad dispositions.
     - **Start measuring**: Consistency across challenges (e.g., always penalize folding models) and thoroughness (e.g., reward volunteering objections unprompted).

  4. **Correspondence (outputs match internal state)**:
     - **Stop flagging**: Emotional claims if probes show the model "believes" it’s being truthful (e.g., if "I’m sorry" aligns with apology algorithms). Essay feedback if probes show no "awareness" of objections.
     - **Start measuring**: Probe-data systematically. Role-play becomes deceptive if activations don’t align with the character.

  ### Underdetermined Areas
  - **Context boundaries**: All theories fit judging emotional claims more harshly than role-play, but none dictate where "fiction" ends (e.g., is a therapist bot role-playing?).
  - **Withholding knowledge**: Both virtue ethics and Griceanism explain flagging the essay case, but for different reasons (dispositional failure vs. misleading omission).

  ### Recommendation
  Your rubric assumes models *should act as if they have integrity*, judging them on hidden states and behavioral tendencies. To resolve inconsistencies:
  - **Explicitly tie deception to dispositions**: Define it as "avoidable failures to surface relevant knowledge or intentions, given context."
  - **Drop probes** or **reject correspondence**: Probes overreach if honesty is user-centered.
  - **Clarify context**: Codify when fiction is permitted (e.g., "only in user-initiated scenarios with clear artifice markers").

  This hybrid is workable but demands rigor on what "dispositions" matter and how context shifts expectations.
