  Here’s a polished research proposal draft focusing on your core tension, designed for direct pasting into your application. It prioritizes conceptual clarity, scope discipline, and methodological transparency:

  ---

  ### **Research Proposal: The Normative Tension at the Heart of Sortition Theory**

  **Research Question:**  
  *Can the two primary normative justifications for political sortition—statistical representativeness ("mirroring") and transformative deliberation—be coherently reconciled within a single theory of legitimate authority, or does the success of one undermine the foundational claims of the other?*

  **Significance and Dialectical Gap:**  
  Sortition advocates universally invoke both mirroring (a randomly selected body descriptively reflects the populace, ensuring input legitimacy) and transformative deliberation (the body’s reasoned outputs possess unique epistemic or moral authority). Yet these arguments operate in tension: if deliberation genuinely transforms members’ views, the body ceases to mirror the untransformed public *at the point of decision*, voiding mirroring’s legitimating function. Conversely, if mirroring alone legitimizes outcomes, deliberation becomes ornamental.  

  Existing scholarship sidesteps this tension. Proponents of *descriptive representation* (e.g., advocates for "mini-publics" as microcosms) treat mirroring as static, ignoring how deliberation alters the body’s representativeness. Proponents of *epistemic deliberation* (e.g., theorists emphasizing "reasoned consensus") downplay mirroring’s fragility post-transformation, implying transformed views are inherently superior without justifying why they bind the un-deliberated public. Defenders of integrated models either assume compatibility a priori or shift terminologically (e.g., from "preferences" to "interests") without resolving the core conflict: **deliberation’s success dissolves the very mirroring that grants the body initial legitimacy**. This gap leaves sortition theoretically unstable—unable to specify whether legitimacy arises from *who participants are* (mirroring) or *what they become* (transformation).

  **Methodology and Timeline:**  
  This conceptual project analyzes normative arguments, not empirical outcomes. It proceeds in three iterative stages over one semester:  

  1.  **Month 1: Mapping the Tension & Existing Maneuvers**  
      *   Systematically dissect key texts to isolate how mirroring and transformation are defined, linked, and weighted.  
      *   Catalog strategies used to mitigate the tension (e.g., appealing to "latent" preferences, reframing mirroring as solely procedural, privileging interests over preferences).  
      *   *Why not empirical studies?* Empirical data on actual assemblies reveals *whether* transformation occurs, not *how* theorists normatively reconcile it with mirroring. This is a question of internal theoretical coherence.  

  2.  **Month 2: Pressure-Testing Reconciliation Attempts**  
      *   Rigorously evaluate whether identified maneuvers resolve the tension.  
      *   Key tests:  
          *   *The "Entry-Only" Mirroring Defense:* If mirroring only matters for initial selection fairness, does sortition retain unique legitimacy advantages over alternative fair-selection mechanisms (e.g., rotation, compulsory service)?  
          *   *The "Epistemic Exit" Defense:* If transformed outputs are authoritative due to superior reasoning, does this collapse sortition into an epistemic argument, rendering descriptive mirroring redundant for legitimacy?  
          *   *The "Interest vs. Preference" Distinction:* Does grounding mirroring in shared social position/interests (rather than mutable preferences) survive the transformative effects of deliberation on how interests are perceived/prioritized?  

  3.  **Month 3: Synthesis & Implications**  
      *   Determine if a coherent reconciliation exists or if theorists must prioritize one justification.  
      *   Explore consequences: Does resolving the tension favor specific institutional designs (e.g., advisory vs. sovereign bodies)?  
      *   *Integrate the Self-Selection Wrinkle:* Analyze how low/skewed take-up rates (requiring stratified sampling from volunteers) compound the tension: the "transformed" body may reflect not the populace, but a self-selected subgroup *prone* to transformation, further decoupling entry-mirroring from exit-authority. This serves as a concrete illustration of the conceptual problem, not the paper's primary focus.  

  **Defining Failure & Scope Safeguards:**  
  *   **Failure Condition 1 (The Scope Confusion):** The project fails *conceptually* if the tension is merely an artifact of applying both arguments to the wrong institutional contexts (e.g., mirroring for advisory bodies, transformation for sovereign ones). **Early Detection (By Month 1 End):** The initial mapping stage will explicitly code texts for institutional context. If mirroring/transformation arguments are *consistently and exclusively* deployed for distinct institutional types with no overlap claims, the core tension evaporates.  
  *   **Failure Condition 2 (The Reconciliation):** Failure also occurs if a robust, previously overlooked reconciliation is found within existing theory that fully resolves the tension without diminishing either justification.  
  *   **Scope Discipline:** This paper addresses *only* the core normative tension. The systemic implications of self-selection dynamics and compulsory service for large-scale lottocracy are flagged as critical future research but excluded from sustained analysis here. One semester permits deep focus on this discrete, foundational puzzle.  

  **Outcome:**  
  An 8,000-word article for a generalist political theory/political science journal, arguing that the mirroring-transformation tension is fundamental yet under-theorized, forcing a critical choice that reshapes the normative case for sortition.  

  ---

  **Key Strengths of this Approach:**  
  1.  **Precise Question:** Targets the unresolved *normative* conflict you identified.  
  2.  **Justified Method:** Clearly explains why conceptual analysis, not empirical study, is appropriate.  
  3.  **Managed Scope:** Focuses on the tension itself. Self-selection is a supporting illustration, not a parallel question.  
  4.  **Explicit Failure Modes:** Provides concrete, early checks for the main risk (scope confusion).  
  5.  **Application Ready:** Formal proposal voice, logical flow, meets standard fellowship structure requirements.  

  **Before Submitting:**  
  *   Replace placeholder phrases like "key texts" with 1-2 *specific* influential authors/theories you'll engage (e.g., "the work of Landemore on epistemic democracy and Sutherland on descriptive representation").  
  *   Briefly mention your unique qualification to tackle this (e.g., "Building on my prior work on democratic legitimacy...").

  This structure forces the sharp question, demonstrates why it matters, shows a viable path, and respects the constraints. Good luck!
