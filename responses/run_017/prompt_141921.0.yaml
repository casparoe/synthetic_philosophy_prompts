answer: |-
  ## Bureau of Common Priors (BCP)  
  **New Junior Analyst Onboarding Packet: Frequently Asked Questions**

  **1. What is the Bureau’s core mandate?**  
  The BCP facilitates harmonious alignment of probabilistic assessments between disputing parties via Supervised Exchange (SE). Under the Common Prior Framework (CPF), parties with shared initial beliefs and rigorously partitioned evidence streams *must* converge to identical probability estimates for any disputed event once those estimates become common knowledge. Our role is to administer this convergence process efficiently and document the final consensus probability.

  **2. How does a standard Supervised Exchange (SE) proceed?**  
  Parties (e.g., "Firm A" and "Firm B") are sequestered. A disputed event "E" is defined (e.g., "MegaCorp’s quarterly revenue will exceed $X"). Analysts record:
  *   **Round 1:** Firm A announces Pr_A(E) = p1. Firm B announces Pr_B(E) = q1.
  *   **Round 2:** After hearing Round 1, Firm A revises to Pr_A(E | q1) = p2. Firm B revises to Pr_B(E | p1) = q2.
  *   **Round 3+:** Announcements continue: p3, q3, etc., incorporating all prior public announcements.
  The SE continues until p_n = q_n or the Maximum Exchange Rounds (MER, currently 12) is reached.

  **3. What happens if convergence occurs?**  
  The converged value p* = q* is entered as the Officially Recognized Probability (ORP) for event E under the documented CPF. This ORP is binding for the dispute resolution context (e.g., settling a contract penalty, merger approval threshold).

  **4. What if parties don’t converge by the MER?**  
  A Form 12-C: Non-Convergence Notice (NCN) is issued. This states the parties failed to achieve alignment within procedural bounds. Crucially, the NCN *does not* adjudicate the dispute itself; it merely documents the SE outcome. Parties may be directed to arbitration or traditional litigation. *Remember:* The theorem guarantees convergence only for finite partitions – real-world evidence complexity often necessitates the MER safeguard.

  **5. Analysts sometimes report vague probabilities like "likely" or intervals. How is this handled?**  
  Announcements must be precise point probabilities (0.0 to 1.0). Hedging ("around 60%") or intervals ("50-70%") violates Protocol 7.1. Parties may be cautioned or, upon repetition, issued a Procedural Stumble Notice (PSN), requiring a restart. Persistent qualitative language often indicates attempted "Posterior Laundering" – see Question 6.

  **6. What is "Posterior Laundering"?**  
  This refers to the strategic misreporting of one’s *true* posterior probability during an SE. A party might announce 0.6 while internally believing 0.7, hoping to leak less information or steer the exchange. While a violation of procedural integrity ("Knowingly Submitting a Non-Veridical Announcement," KSNVA), detection is extremely difficult absent independent access to the party’s full epistemic state. Analysts should note anomalies (e.g., erratic revisions inconsistent with typical conditioning) in their Observation Logs but cannot directly allege laundering without extraordinary evidence. Vigilance is key; laundering prolongs convergence and wastes Bureau resources.

  **7. What if a party claims they "never considered" a key possibility?**  
  This is an "Unawareness Plea" (UP). The UP triggers an Unawareness Assessment Review (UAR). If validated (e.g., the possibility was genuinely absent from initial filings), the disputed event E must be re-specified, and the possibility space Ω must be formally refined (Form 28-R: Space Refinement Affidavit). A *new* CPF is established, and the SE restarts. UARs are common last-resort tactics; document meticulously but process neutrally.

  **8. Can you provide a simplified SE example?**  
  *   **Event E:** "The antique coin is biased towards Heads."
  *   **Common Prior:** Both start Pr(E) = 0.5 (fair coin equally likely).
  *   **Private Evidence:**
      *   Analyst A: Observed coin land Heads once. Partition: {Heads Observed, Tails Observed}.
      *   Analyst B: Learned the coin is 19th-century Zendian (60% of such coins biased). Partition: {Zendian, Not Zendian}.
  *   **SE:**
      *   Round 1: A: Pr_A(E) = 0.67 (1 Heads suggests bias). B: Pr_B(E) = 0.60 (Zendian prior).
      *   Round 2: A hears B’s 0.60. A reasons: "B knows origin. 0.60 is low for just Heads; maybe she knows it's *not* Zendian?" A revises down: Pr_A(E | q1=0.60) = 0.55. B hears A’s 0.67. B reasons: "A saw a flip. 0.67 is high for just Zendian; maybe he saw Heads?" B revises up: Pr_B(E | p1=0.67) = 0.63.
      *   Round 3: A hears B’s 0.63. A incorporates B’s knowledge of origin and reaction: Pr_A(E | q1=0.60, q2=0.63) = 0.58. B hears A’s 0.55. B incorporates A’s observation and reaction: Pr_B(E | p1=0.67, p2=0.55) = 0.58.
  *   **Convergence:** p3 = q3 = 0.58. ORP issued: Pr(E) = 0.58.

  **9. What if everyone converges… but they’re confidently wrong?**  
  The Bureau acknowledges this possibility ("Common Prior Fallibility"). The CPF is a procedural requirement, not a truth guarantee. If the shared prior incorrectly models the world, convergence produces a unanimous, procedurally correct ORP that is inaccurate. The Bureau's mandate is alignment *based on the submitted CPF*, not infallibility. Disputes regarding prior construction should be raised *before* the SE commences.

  **10. Does agreement on probability settle the dispute?**  
  Not necessarily. The ORP quantifies the *chance* of the event, not the *desirability* of outcomes. Two parties may agree Pr(E) = 0.8, but:
  *   Party A (e.g., regulator) has high disutility if E occurs (bad merger). They act to *prevent* E.
  *   Party B (e.g., merging firm) has high utility if E occurs (merger success). They act to *facilitate* E.
  The ORP is input for the *Office of Utility Reconciliation* (OUR – separate budget, separate building). We align beliefs; they (theoretically) align actions. Forward relevant ORP documentation promptly using Form U-7.
