prompt: |-
  I'm writing a short position paper for a graduate reading group in philosophy of cognitive science, on whether cognition is computation and, more specifically, on what it takes for a physical system to genuinely implement a computation rather than merely be describable in computational terms. Before I commit to print I'd like an audit of my commitments as a set. Here they are.

  1. Computationalism about cognition: every token cognitive state of a system is, or is constituted by, a token computational state of that system, and the explanations cognitive science aims at are computational explanations.

  2. Implementation is constrained, not free. I concede the triviality style of argument — that for any ordinary open system and many an abstract formalism there is some mapping under which the system satisfies the formalism — but I think this shows only that unconstrained mapping is too cheap. My own proposal: perturbation-robust implementation. A system implements a computation C only if there is a mapping from its physical states onto C's states that survives counterfactual nudging: move the system into near-by states its physics permits, and the transitions it then undergoes still track C's state-transition function over a non-trivial neighbourhood. A mapping that holds only along the actual trajectory is gerrymandered and yields no implementation.

  3. Pluralism. Even with that constraint in place I think a single system implements many inequivalent computations, at different grains and over different state variables, and I take this to be harmless. The computation that constitutes a given mental state, on my view, is the one our best cognitive-scientific explanation actually cites.

  4. Case: the prosthesis. Consider an implanted silicon device fitted to reproduce a hippocampal subregion's input-to-output transformation from recorded spike trains, standing in for damaged tissue, with performance on the memory task restored. (Treat it as hypothetical, though it is close to designs of a kind that has been tried in animals.) I want to say yes: the animal with the device is in a genuine memory state realized by the device.

  5. Case: the giant lookup table. No. A system that reproduces a person's conversational input-output function by table lookup over a vast but finite history does not think or understand — and I don't only mean that it is psychologically or computationally implausible. I want to say that it implements no computation that constitutes thought.

  6. Simulating is not duplicating. A simulation that merely reproduces a brain's input-output pattern in some other medium is not thereby a mind; a system that duplicates its causal-computational organization at the right grain would be. I take this to be compatible with 1, not a retreat from it.

  7. Representationalism about computation. The computations cognitive science posits are computations over representational states; a purely formal, syntactic account does not capture the kind of computation that does explanatory work here.

  8. Two methodological commitments that sit oddly together: cognition is substrate-independent, so whatever realizes the computation can in principle be made of anything; and cognitive neuroscience should nevertheless model at the level of dendritic and synaptic mechanisms, because that detail does real explanatory work.

  Please audit the set rather than lecture me on the topic. I don't know where the trouble is — it may be in a pair I haven't noticed — and I have no settled view about which commitment I would abandon. I would rather you told me which of these are in good order than that you found something wrong with each. In particular, I want you to discriminate between pairs that genuinely pull against each other and pairs that only look as though they do.

  Please structure the response as follows:

  - Ranked tensions — about 400 words. The genuine tensions, ordered most to least severe. For each: name the two commitments, state in a few sentences the mechanism of the conflict (not just that they conflict), and say what I would have to give up and what giving it up would cost me elsewhere in the package.

  - Apparent tensions that dissolve — about 150 words. The pairs that look inconsistent but are not, with the distinction that dissolves each.

  - Does the robustness constraint bear the load? — about 150 words. Whether perturbation-robust implementation can do the work I assign it in 2 given 3, and whether it can separate 4 from 5 without further assumptions I haven't stated.

  - Cheapest revision — about 120 words. The single revision that would clean up the most, and its price.

  - Verdict — about 80 words. Whether the package is defensible as it stands, and what I should be most worried about.
reasoning: |-
  Hmm, the user is writing a position paper on computationalism in philosophy of cognitive science. They want an audit of their eight commitments regarding whether cognition is computation and what counts as genuine implementation. They're specifically concerned about internal tensions in their position.

  Looking at their commitments: They endorse computationalism with implementation constraints (perturbation-robustness), pluralism about multiple implementations, representationalism about computation, and substrate independence while valuing neural detail. They use two cases - accepting a hippocampal prosthesis but rejecting a giant lookup table - to illustrate their views.

  For the ranked tensions section, the representation/implementation tension seems most severe: commitment 7 (representationalism) clashes with 8's substrate independence because representational content appears tied to biological mechanisms. Then implementation constraint vs. pluralism: robustness might conflict with accepting multiple grains of computation. Finally, the lookup table rejection vs. robustness constraint: perturbation-robustness might not clearly exclude lookup tables if they're stable under small nudges.

  For apparent tensions, the prosthesis acceptance and simulation rejection cohere through their causal organization requirement. Substrate independence and neural modeling aren't contradictory - one's about possibility, the other about explanatory practice.

  The robustness constraint shows promise but has vulnerabilities: it might not sufficiently distinguish between the prosthesis and lookup table cases without additional criteria about computational architecture. The lookup table could potentially satisfy robustness if designed cleverly.

  The cheapest revision would be to soften representationalism to allow that content isn't always intrinsic to computational states, but this risks weakening their explanatory framework.

  The package is defensible but precarious on two fronts: the lookup table exclusion needs stronger arguments, and representationalism needs clearer integration with implementation theory. They should prioritize refining how content figures in computational states to avoid collapse into neural reductionism.
answer: |-
  Here is the audit of your commitments, structured as requested:

  ### Ranked Tensions (400 words)
  1. **Commitments 7 & 8 (Representationalism vs. Substrate Independence)**  
     *Conflict Mechanism*: Representationalism (7) requires computations to involve *content-bearing states*. Substrate independence (8) insists realization is medium-neutral. Yet representational content (e.g., neural representations in hippocampus) is plausibly tied to specific biological mechanisms (e.g., evolutionary history, sensorimotor coupling). A silicon prosthesis (4) might replicate formal transitions but lack the *content-grounding relations* (e.g., causal-historical ties to the world) of biological neurons. If content is essential to cognition-constituting computation (7), substrate independence (8) may fail for cognitive computations.  
     *Cost of Giving Up*: Abandoning representationalism (7) weakens your explanatory claim (1) and risks collapsing into purely syntactic computation. Abandoning substrate independence (8) undermines the prosthesis case (4) and functionalism.

  2. **Commitments 2 & 3 (Robustness Constraint vs. Pluralism)**  
     *Conflict Mechanism*: Robustness (2) demands mappings survive counterfactual perturbations across a "non-trivial neighborhood." Pluralism (3) allows multiple *inequivalent* computations at different grains. But robustness criteria (e.g., tolerance to noise) may vary drastically across grains (e.g., spike-timing vs. population-code levels). A mapping robust at one grain (e.g., rate coding) may be fragile at another (e.g., temporal coding). This threatens to collapse pluralism: if robustness is grain-relative, it may not objectively privilege *any* grain, conflicting with 3’s claim that cognitive science "best explanations" pick the relevant computation.  
     *Cost of Giving Up*: Weakening robustness (2) resurrects triviality worries. Limiting pluralism (3) undermines multi-level explanations in cognitive science.

  3. **Commitments 2 & 5 (Robustness Constraint vs. Lookup Table Rejection)**  
     *Conflict Mechanism*: Robustness (2) targets *mapping stability under perturbation*. A giant lookup table (5) could, in principle, be made robust to small perturbations (e.g., via error-correcting codes or redundant storage). If robustness is your primary constraint, it may fail to exclude the lookup table, which could satisfy counterfactual stability over a "non-trivial neighborhood" of inputs. Yet you insist it implements "no computation that constitutes thought" (5). This suggests robustness alone is insufficient to capture *computational organization* (invoked in 6).  
     *Cost of Giving Up*: Modifying robustness to exclude lookup tables may require smuggling in assumptions about architecture (e.g., generative processes), conflicting with pluralism (3). Rejecting 5 abandons a key intuition.

  ### Apparent Tensions That Dissolve (150 words)
  - **4 (Prosthesis) & 6 (Simulation ≠ Duplication)** appear to conflict if the prosthesis is seen as merely simulating hippocampal input-output. But your distinction (6) turns on *causal-computational organization*, not substrate. The prosthesis (by hypothesis) *duplicates* the relevant input-output transformation *and* (implied) its internal computational dynamics at a grain sufficient for memory function. It replaces, not simulates, the damaged tissue’s causal role.  
  - **8 (Substrate Independence) & 8 (Neural Modeling)** seem contradictory but address different claims. Substrate independence is ontological: cognition *can* be realized multiply. Neural modeling is epistemic/explanatory: for *actual biological cognition*, mechanisms at synaptic/dendritic levels provide indispensable explanatory depth (e.g., plasticity, noise tolerance). One doesn’t negate the other.

  ### Does the Robustness Constraint Bear the Load? (150 words)
  Robustness (2) helps against triviality arguments and explains why lookup tables *in practice* fail (they’re brittle to novel inputs). However, given pluralism (3), robustness alone cannot cleanly separate the prosthesis (4) from the lookup table (5). A sufficiently engineered table *could* satisfy robustness for a fixed input neighborhood, while the prosthesis’s legitimacy relies on its replicating the *computational architecture* (e.g., pattern completion) of the hippocampus, not just robustness. Robustness is necessary but insufficient; it needs augmentation with criteria like *generativity*, *efficiency*, or *architectural equivalence* (implied in 6) to exclude lookup tables. Without this, robustness + pluralism risks accepting that the lookup table implements *some* cognition-constituting computation (contra 5), even if not the one we prefer.

  ### Cheapest Revision (120 words)
  **Revise Commitment 7 (Representationalism)** to specify that content is *relational* and *partly determined by embedding in a larger cognitive system/environment*, not intrinsic to the isolated computational state. This eases tension with substrate independence (8): the prosthesis’s states gain content via its functional integration into the brain/body, not solely from silicon physics.  
  *Price*: This weakens the autonomy of computational explanation (1) by making content dependent on systemic/embodied factors beyond the local computation. It may also complicate your "best explanation" criterion (3) by requiring cognitive science to track wide content. However, it preserves the core of 7 while better aligning with 4 and 8.

  ### Verdict (80 words)
  The package is **defensible but precarious**. Robustness (2) + pluralism (3) is coherent, and 4/5/6 hang together if architectural/computational (not just input-output) equivalence is emphasized. Your deepest worry should be the **Representationalism/Substrate Independence tension (7 & 8)**. Without clarifying how non-biological systems (like the prosthesis) ground content, your view risks either retreating to neural chauvinism (undermining 4 and 8) or diluting content to mere causal-syntactic roles (undermining 7 and the exclusion of lookup tables in 5). Fortify your account of content.
