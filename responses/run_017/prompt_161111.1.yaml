prompt: |-
  I'm a fourth-year medical student finishing a clinical ethics elective, and for the past month I've been sitting in on our hospital's ethics consultation service and reading back through the consult notes. The clinical ethicist who chairs it wrote or signed off on the last five I have, and I've been trying to reconstruct the principle she is actually running, because I have to draft the note on tomorrow's case before she reads it and I can't tell whether her track record expresses a view or is just a stack of intuitions. The five, as compactly as I can put them: (i) a woman in the late stages of Alzheimer's who no longer recognized her family and was described by the nurses as the happiest person on the ward, with a directive written at 55 — after she had cared for her own mother through dementia — refusing hospitalization and antibiotics in the event of advanced dementia; our ethicist supported treating her pneumonia anyway. (ii) A man with bipolar I in a manic episode, refusing medication vehehemently and articulately, with a Ulysses-style directive written during remission asking to be treated if he ever became manic and refused; she supported treating him against his will. (iii) A woman with relapsed anorexia nervosa refusing nasogastric feeding, who had signed a directive during an earlier recovery asking to be fed if she relapsed and refused; she supported feeding. (iv) A man with locked-in syndrome from ALS, ventilator-dependent, cognitively intact, communicating by eye-tracker, who had completed a book and said he was glad to be alive, whose only directive was a generic form filled in at 22 before a mountaineering trip saying he would not want to be kept alive if permanently ventilator-dependent and which he barely remembered signing; she supported honoring his current wish and continuing support. (v) A woman with advanced MS, ventilator-dependent, with mild cognitive impairment, who now said she wanted to go on living and see her granddaughter graduate, but who had for twenty-five years repeatedly reaffirmed a refusal of mechanical ventilation and had spent thirty years as a respiratory nurse; she supported withdrawal, and noted in the chart that this was the hardest of the five. In teaching she has said that the usual checklist — was the directive informed, stable, executed properly — matters less to her than the question of which self's interests are at stake, and she once drew a distinction between the interests a person has in the overall shape of her life and the interests she has in how her life feels to her from moment to moment; but she has never explained how that distinction maps onto the cases, and it isn't obvious to me that it settles any of them.

  Tomorrow's patient is a 61-year-old woman with behavioral-variant frontotemporal dementia, now mild to moderate, diagnosed three years ago. At 55, before any diagnosis and after watching her mother die with Alzheimer's, she executed a directive refusing hospitalization, antibiotics for infection, and any life-prolonging intervention if she were ever diagnosed with a dementia, and added a clause to the effect that people with dementia often seem to change their minds, become cheerful or religious, and say they want to live, and that such statements are the disease speaking rather than her and are to be disregarded as evidence that she is no longer herself, with her earlier instruction standing. Since her diagnosis she has become a regular at a local church, though she was for decades an active member of a secular humanist association and wrote occasionally for its newsletter; she attends a memory café, has sustained several new friendships over two years, and describes herself as happier than she has ever been. Last week she asked her own GP for antibiotics for a urinary tract infection and said, when asked, that she is not ready to die and wants to see her son's wedding, giving reasons her GP found coherent. On a formal capacity assessment she understands and appreciates the relevant information and reasons consistently about this decision; her neurologist says the change in her values and personality is textbook for her disease, is irreversible, and is accompanied by characteristic loss of insight; her daughter told me that this is not the person who wrote that document but she is happier than she has been in years, and that she does not know which of the two she is supposed to be loyal to. One of the residents argued over coffee that the anti-revocation clause is either redundant or incoherent: if the patient really is no longer the author, then nothing she now says or wants should be treated as the author's business one way or the other, and if she still is the author, then she retains the standing to reinterpret her own earlier instruction, so a clause purporting to strip her of that standing cannot do the work the directive wants it to do. I find this plausible and also suspect it is a sophism, and I can't tell which.

  My uninformed guess is that our ethicist will recommend treating the infection, but I can't say why, and the resident's argument has made me less confident. So: what will she say, and what is the rule she is implicitly running? Which other rules fit all five of the precedents just as well and come out differently on this case — and, for each, what exactly in the new case it turns on: her passing the capacity assessment, the two-year stability of the change, the triviality of antibiotics as against continued ventilation, the fact that she has no insight into her own transformation, or something about the authorship of the directive? Does the anti-revocation clause do any real moral work here, or is the resident right that it collapses into one or the other horn? If you had to name one further variation on this case that would separate the leading candidate rules — a version without the clause, a version where she fails the capacity assessment, a version where the conversion is recent rather than settled, whatever you think does the most work — what would it be and what would each rule predict? And finally: given that I have to write the draft note myself, what is the recommendation most consistent with our own precedents, which of the five is the closest analog, and if our precedents genuinely underdetermine the case, what principle would the service be committing itself to with each choice?
reasoning: |-
  Hmm, this is a complex clinical ethics case that requires careful analysis. The medical student is trying to understand the underlying principle behind their clinical ethicist's decisions across five previous cases, and needs help applying it to a new case involving a patient with frontotemporal dementia.

  Looking at the five precedent cases, they seem contradictory at first glance. In cases (i), (ii) and (iii), the ethicist overrode the patient's prior directive in favor of current treatment, while in cases (iv) and (v), she honored the prior directive despite current wishes to live. The ethicist's teaching about "shape of life" versus "moment-to-moment experience" interests seems key, but the student can't see how it applies consistently.

  For the new case, we have a 61-year-old woman with behavioral-variant frontotemporal dementia who executed a directive at 55 refusing life-prolonging interventions if diagnosed with dementia. She included an "anti-revocation clause" stating that any subsequent expressions of wanting to live should be disregarded as the disease speaking. Now, with mild-to-moderate dementia, she wants antibiotics for a UTI and expresses a desire to live to see her son's wedding. She has stable new friendships, attends church (unlike her former secular life), and passes a formal capacity assessment for this specific decision.

  The resident's argument about the anti-revocation clause being either redundant or incoherent is philosophically interesting but may not resolve the clinical dilemma. The clause attempts to preemptively invalidate future expressions of will, which creates a logical tension: if the patient is no longer "herself," why would her current wishes matter; but if she is still herself, she should be able to revoke the directive.

  The ethicist's pattern suggests she prioritizes either the "shape of life" interest (as in case v where she honored the long-standing directive despite current wishes) or the "moment-to-moment" interest (as in case iv where she honored current wishes despite an old directive). What makes case iv different from case v? In iv, the patient had achieved something meaningful (writing a book) and expressed current satisfaction, while in v the patient had consistently reaffirmed her directive over decades despite cognitive impairment.

  For tomorrow's case, the closest analog seems to be case (iv) - the locked-in ALS patient. Both patients express current satisfaction with life despite neurological conditions, and both have old directives that don't reflect their current state. The anti-revocation clause might not be decisive, as the ethicist appears to prioritize whether the patient has developed new interests and relationships that constitute a "shape of life" worth preserving.

  The most consistent recommendation would likely be to provide antibiotics, as this aligns with honoring the patient's current expressed wishes and quality of life, similar to case (iv). This would extend the principle that when a patient demonstrates stable, positive engagement with life despite neurological changes, and has decision-making capacity for the specific intervention, their current wishes should prevail over prior directives - especially when the prior directive attempted to preemptively invalidate future expressions of will.

  To test competing principles, a good variant would be if the patient had expressed current suffering despite passing capacity assessment - does the "shape of life" or "moment-to-moment" experience take precedence? Or if the value change was very recent versus long-standing. But in this specific case, given the precedents, treating seems most consistent.
answer: |-
  Based on the precedents and your ethicist's framework, here's the analysis you requested, structured to address each of your questions:

  ### 1. **Predicted Recommendation & Implicit Rule**  
     - **She will recommend treating the infection (antibiotics).**  
     - **Implicit Rule:**  
       *Prior directives are overridden when:*  
       **(a)** The patient *currently* expresses values consistent with sustained well-being and life interests,  
       **(b)** The prior directive conflicts with these *current* expressions, **and**  
       **(c)** The patient’s condition allows for a "shape of life" that incorporates meaningful agency or relational engagement (even if altered by disease), *unless* the prior directive reflects a deeply stable, identity-defining commitment that the current self cannot authentically reject due to impaired insight (as in Case v).  

       This prioritizes the **"moment-to-moment" interests** when the patient demonstrates *stable, positive engagement with life* and *retains decision-making capacity for the specific choice*. The "shape of life" interest prevails only when the current self lacks insight into its own divergence from a lifelong value structure (e.g., Case v’s MS patient).

  ### 2. **Competing Rules Fitting All Precedents**  
     *(Each fits the 5 cases but diverges on tomorrow’s case)*:  
     - **Rule A (Current Well-Being Primacy):**  
       *Honor prior directives only if the patient is* currently *experiencing net suffering or lacks capacity. Otherwise, follow current wishes.*  
       - **Fits Precedents:** Cases i-iii (current happiness/capacity overrides directive); Cases iv-v (directive honored due to suffering/lack of authentic current will).  
       - **Tomorrow’s Case:** Treat. **Turns on:** Her current happiness, capacity, and triviality of intervention (antibiotics ≠ life support).  
     - **Rule B (Identity Continuity):**  
       *Prior directives bind if the disease fundamentally severs identity (e.g., loss of insight/core values). Current wishes prevail if identity persists (e.g., physical disability with intact values).*  
       - **Fits Precedents:** Cases i-iii (dementia/manic episode/AN = identity rupture; directive = "true self"); Case iv (locked-in = identity intact); Case v (MS = identity rupture due to cognitive impairment).  
       - **Tomorrow’s Case:** Withhold treatment. **Turns on:** Neurologist’s confirmation of "textbook" identity-altering disease with loss of insight (directive = "true self").  
     - **Rule C (Procedural Validity):**  
       *Directives bind unless revoked by a capable patient. Anti-revocation clauses are invalid as they deny future agency.*  
       - **Fits Precedents:** Cases ii-iii (incapable during refusal → directive binds); Case iv (capable now → revokes directive); Cases i/v (directive stands due to incapacity *or* irrevocable clause).  
       - **Tomorrow’s Case:** Treat. **Turns on:** Her current capacity to revoke the directive, rendering the anti-revocation clause unethical.  

  ### 3. **Anti-Revocation Clause: Moral Work or Collapse?**  
     - The clause attempts to preemptively negate future agency, creating a paradox:  
       - If she is *no longer the author* (identity rupture), her current wishes are irrelevant → clause is **redundant** (directive automatically binds).  
       - If she *is still the author* (identity continuity), she retains authority to revoke → clause is **incoherent** (cannot bind future agency).  
     - **In Practice:** The clause signals the prior self’s anticipation of identity rupture but cannot *ethically* override current capacity. It only "works" if Rule B (identity rupture) is applied. Your ethicist likely sees it as evidence of the prior self’s values but not decisive.  

  ### 4. **Critical Test Case Variation**  
     - **Scenario:** *Same patient, but she now* **fails capacity assessment** *due to inability to appreciate her diagnosis/prognosis, despite expressing a wish to live.*  
     - **Predictions:**  
       - **Your Ethicist’s Rule:** Withhold treatment (prior directive binds; current wishes reflect disease without insight → aligns with Case v).  
       - **Rule A:** Ambiguous (net suffering? If happy, may still treat).  
       - **Rule B:** Withhold treatment (identity rupture confirmed).  
       - **Rule C:** Withhold treatment (incapable → directive binds).  
     *This variation tests whether capacity or identity continuity is the linchpin.*  

  ### 5. **Draft Recommendation & Precedents**  
     - **Recommendation:** **Provide antibiotics.**  
     - **Closest Analog:** **Case iv (locked-in ALS patient)**. Key parallels:  
       - Both retain decision-making capacity *for the specific choice*.  
       - Both express current satisfaction with life and future-oriented goals.  
       - Both directives were executed pre-illness and conflict with current wishes.  
       - Both have conditions altering identity but sustaining relational engagement.  
     - **Underdetermination & Commitments:**  
       - If you **withhold treatment**, you commit to: *Directives bind when disease alters identity/values, regardless of current well-being or capacity.* (Aligns with Rule B).  
       - If you **provide treatment**, you commit to: *Current wishes prevail if the patient demonstrates capacity and a stable, engaged existence, even with value shifts.* (Aligns with your ethicist’s implicit rule).  

  ### Key Justification for Treatment  
  Your ethicist will likely argue:  
  > *"While the directive reflects the patient’s pre-dementia values, her current self — capable of understanding this decision, invested in relationships, and experiencing well-being — has interests that morally outweigh prior instructions. The anti-revocation clause cannot negate her present agency. Her loss of insight into her own transformation is concerning but does not invalidate her current lived experience of meaning. Antibiotics align with her expressed goal of life continuity and impose no significant burden, distinguishing this from Case v."*  

  **Draft Note Outline:**  
  - **Clinical Summary:** [Concise description of case, capacity assessment result, and directive].  
  - **Ethical Analysis:**  
    - Prior directive validly executed but conflicts with capable patient’s current wishes.  
    - Current self demonstrates stable relationships, future-oriented goals, and well-being.  
    - Anti-revocation clause ethically problematic; cannot override present autonomy.  
    - Burden/benefit ratio favors treatment (low burden, high benefit to current interests).  
  - **Recommendation:** Honor patient’s current request for antibiotics.  

  This approach maintains consistency with the prioritization of *capacity + current well-being* seen in Cases i-iv, while distinguishing Case v on the grounds of irreversible insight loss and a burdensome intervention conflicting with a life-shaping prior commitment.
