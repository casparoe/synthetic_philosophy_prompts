prompt: |-
  You are a political philosopher specialising in public ethics and comparative political theory, who also advises development agencies on anti-corruption programme design. Please think carefully before writing: spend some time brainstorming how each of the commitments below constrains the others, and how much work each one is quietly being asked to do, before you commit to an answer. Be blunt where bluntness is warranted.

  I work on corruption in development contexts and I have finally written my position down so my colleagues can attack it. Seven theses:

  1. Corruption is not just bad government; it has an essential structure. Someone occupying a role that carries entrusted purposes subordinates those purposes to private advantage. Where there is no such role, talk of corruption is loose talk.

  2. That core is, I hold, universal and not a Western export. But the apparatus that Western law and compliance culture treats as its neutral application — conflicts-of-interest registers, disclosure duties, competitive tendering, arm's-length contracting, caps on gifts and hospitality — is one historically local way of institutionalising impartiality, suited to large impersonal bureaucracies. Where office is embedded in kinship and patronage, the same goods (predictability, restraint of arbitrary power, some downward accountability) are often secured by other mechanisms, and standard international indices systematically misread those mechanisms as their absence.

  3. So I am not a cultural relativist about corruption: that a practice is locally accepted, or locally expected, never settles that it is not corrupt. I want to condemn without hedging the minister who steers a road contract to his brother's firm at an inflated price with a kickback built in — even where everyone does it, and even where some of the money does reach the village.

  4. But I am not a consequentialist about it either. I do not want to say clientelism is acceptable when it happens to deliver growth, or that a facilitation payment is fine when it unblocks an official who would otherwise stall. The wrong lies in the subordination of the office, not in the outcome.

  5. I draw the gift/bribe line by asking whether the transfer sits inside an ongoing relationship of reciprocal obligation or is a payment that purchases a particular exercise of the office. Tributary gifts to a patron — the sort that sustain a relationship and carry no specific request — I treat as a different moral object from a bribe, and I resist criminalising them.

  6. Where I am most severe is clientelism: patronage hiring, targeted goods in exchange for votes, the local boss who directs a borehole to his own kin's wards rather than to the district on need. I hold this to be a distinct and deeper corruption than one-off grand theft, because it converts a relation of political equality into a relation of personal indebtedness.

  7. And I think corruption can be systemic: a polity can be thoroughly corrupt even when no individual official has departed from anything locally recognised as a rule.

  My question: does the set hang together? My own guess is that the trouble is (3) against (2) — that I have smuggled a Western conception of impartial office back in through the definition while claiming the core is thin. A colleague insists the real fracture is (4) against (6), and that the reason I give in (6) is exactly the sort of outcome-based reason (4) forbids me. I cannot tell who is right, and I do not want to give up any of the seven if I can help it.

  Please audit the package rather than lecture me about corruption in general. Identify where the commitments genuinely pull against each other, separate those from pairs that only look tense, rank the genuine tensions by severity, and for each state precisely what would have to be surrendered and what that surrender would cost me elsewhere in the set. If a single revision would repair more than one of them, say so — and say plainly if one of the seven simply has to go.
reasoning: |-
  Okay, the user is a political philosopher specializing in public ethics and advising on anti-corruption programs. They've outlined seven theses on corruption and want to know if they hang together. They suspect tension between thesis 3 (non-relativism) and thesis 2 (non-Western institutional mechanisms), while a colleague points to thesis 4 (non-consequentialism) versus thesis 6 (clientelism condemnation). 

  First, I need to unpack each thesis carefully. Thesis 1 defines corruption structurally: subordination of entrusted roles for private gain. Thesis 2 argues this core is universal but Western compliance tools are just one way to institutionalize impartiality, and indices often misread non-Western mechanisms. Thesis 3 insists local acceptance doesn't negate corruption (e.g., nepotistic contracts). Thesis 4 rejects justifying corruption by outcomes. Thesis 5 distinguishes relationship-sustaining gifts from bribes. Thesis 6 condemns clientelism as uniquely corrosive for converting political equality into indebtedness. Thesis 7 allows systemic corruption without individual rule-breaking.

  Hmm, the user's self-diagnosed tension between 2 and 3 is real but perhaps not fatal. If the core definition in thesis 1 is truly thin (role subordination), then condemning the minister in thesis 3 isn't necessarily Western—it's applying that thin standard. But the problem emerges when thesis 2 claims non-Western societies achieve "the same goods" (predictability, accountability) through kinship/patronage mechanisms. If those mechanisms structurally involve favoring kin in office decisions (like the minister's brother), doesn't thesis 3 automatically condemn them? Yet thesis 2 says these mechanisms aren't absences of integrity but alternatives. This needs reconciling.

  The colleague's point about thesis 4 vs. 6 is sharper. Thesis 6 condemns clientelism because it "converts political equality into indebtedness"—an outcome-based harm. But thesis 4 forbids outcome-based justifications. If clientelism is wrong solely because it subordinates office (the structural core), why mention equality-to-indebtedness conversion at all? That's smuggled consequentialism. The user might protest that the relational transformation is inherent to the act, not its consequence, but that's a tough sell—it sounds like describing the harm rather than the breach of duty.

  The systemic corruption point (thesis 7) is actually elegant: if the rules themselves permit role subordination (e.g., offices defined as tools for patronage), the structure is corrupt without individual deviance. No tension there. 

  For repairs: The user can salvage most by refining thesis 6. Instead of leaning on the equality-to-indebtedness outcome, they could argue clientelism intrinsically subordinates office by treating public resources as private currency ("This job exists to reward my voters"). That stays structural. On thesis 2 vs. 3, they might specify that non-Western mechanisms can restrain arbitrariness without endorsing all role subordination—perhaps via communal accountability, not impartiality. But they'll need concrete examples to avoid self-contradiction. 

  Ultimately, thesis 6's current formulation is the weakest link. Sacrificing the outcome-based language wouldn't gut the argument but would strengthen coherence. The other tensions are manageable with careful phrasing. No thesis needs full abandonment, but thesis 6 demands surgery.
answer: |-
  Your framework is rigorous and largely coherent, but two genuine tensions require surgical revision. Below is a structural audit ranking tensions by severity, specifying trade-offs, and identifying salvageable points. (Summary table at end.)

  ### **Critical Tension 1: Thesis 6 vs. Thesis 4 (Severe)**  
  **Conflict:** Thesis 4 forbids outcome-based condemnation of corruption ("The wrong lies in the subordination of the office, not in the outcome"). Yet Thesis 6 explicitly condemns clientelism *because of its outcome*: "it converts a relation of political equality into a relation of personal indebtedness." This is consequentialist reasoning.  
  - **What must be surrendered:** The outcome-based justification in Thesis 6.  
  - **Cost of surrender:** Losing the moral distinction between grand theft and clientelism weakens your critique of systemic patronage.  
  - **Repair:** Reframe Thesis 6 around the *structural subordination of office*. Argue that clientelism institutionalizes the diversion of entrusted power by design:  
    > *"Clientelism is distinct because it formally subordinates public office to private reciprocity networks. The office itself becomes a tool to cultivate indebtedness, embedding corruption in its functional logic."*  
    **→ Fixes both tensions:** Removes consequentialism *and* aligns with Thesis 1’s core definition.

  ### **Significant Tension 2: Thesis 3 vs. Thesis 2 (Moderate)**  
  **Conflict:** Thesis 2 argues that non-Western mechanisms (kinship/patronage) can secure "the same goods" (predictability, accountability) as Western compliance tools. But Thesis 3 condemns nepotistic contracts *even when* they partially deliver public goods ("some money does reach the village"). This implicitly privileges Western-style impartiality.  
  - **What must be surrendered:** The claim that non-Western mechanisms achieve "the same goods" *if* those mechanisms inherently require role subversion (e.g., patronage hiring).  
  - **Cost of surrender:** Weakens anti-relativist stance by conceding that some societies might trade impartiality for other values.  
  - **Repair:** Tighten Thesis 2’s scope. Specify that non-Western mechanisms can *restrain arbitrariness* or *ensure delivery* **without endorsing role subordination**:  
    > *"These mechanisms may achieve stability or limited accountability, but they do so by *negotiating*—not eliminating—the tension between entrusted purposes and private advantage."*  
    **→ Preserves Thesis 3** by maintaining that subordination remains corrupt regardless of cultural acceptance.

  ### **Apparent Tension 3: Thesis 5 vs. Thesis 3 (Resolvable)**  
  **Conflict:** Thesis 5 exempts tributary gifts from bribery classification, while Thesis 3 condemns all role subordination. But if tributary gifts sustain relationships *expecting future favors*, don’t they subordinate office?  
  - **Resolution:** Thesis 5 already distinguishes gifts "with no specific request" from quid-pro-quo bribes. As long as these gifts are *not* tied to discrete official acts (aligning with Anthropological studies like Mauss’ *The Gift*), they avoid subordinating the office’s purpose. No revision needed.

  ### **Systemic Coherence Check**  
  - Theses 1, 4, 5, and 7 are robust and interlocking:  
    - **Thesis 1** (core structure) + **Thesis 7** (systemic corruption) allow condemnation even when local rules permit subordination (e.g., a "legal" patronage system).  
    - **Thesis 4** (non-consequentialism) shields you from justifying "efficient corruption."  
    - **Thesis 5** (gift/bribe distinction) prevents over-criminalization of non-transactional customs.  

  ### **Prescription**  
  1. **Revise Thesis 6** (as above) to remove outcome-dependence. **This is non-negotiable**—it resolves both the severe tension (with Thesis 4) and the moderate one (by avoiding implicit consequentialism that undermines Thesis 2).  
  2. **Refine Thesis 2** to clarify that non-Western mechanisms *manage*—rather than resolve—tensions between office and private advantage.  
  3. **Retain all other theses.** No thesis must be fully abandoned, but Thesis 6’s current phrasing must go.  

  **Outcome:** Your framework survives with sharper definitions, fully retaining its anti-relativist, non-consequentialist core. The repaired version withstands charges of Western bias while condemning clientelism as systemically corrosive.  

  ---

  **Tension Summary Table**  
  | **Tension**         | Severity | Required Surrender                     | Repair Strategy                                  |  
  |----------------------|----------|----------------------------------------|-------------------------------------------------|  
  | Thesis 6 vs. Thesis 4 | Severe   | Outcome-based reasoning in Thesis 6    | Reframe clientelism as *institutionalized subordination* |  
  | Thesis 3 vs. Thesis 2 | Moderate | Claim that non-Western mechanisms achieve "same goods" | Specify mechanisms *negotiate* rather than resolve subordination |  
  | Thesis 5 vs. Thesis 3 | Low      | None                                   | None (distinction holds if gifts are non-transactional) |
