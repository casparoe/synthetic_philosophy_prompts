prompt: |-
  i'm putting together a handout for a grad seminar on direct democracy and I want a taxonomy of the positions on when (if ever) a binding referendum is legitimate — not a lit review, an actual tree where every branch is one claim that splits the space. Please build it questions-first: give the diagnostic questions and the answer-combinations they allow, then locate the real positions in that space.

  The branches I want doing the work: (1) does the objection lie in the voters (competence, information, judgement) or in the mechanism (binary framing, agenda-setting power, aggregation); (2) inside the voter branch, whether the objection scales with how salient and how technical the issue is — i.e. does it evaporate for a high-salience yes/no question that everyone has an opinion about; (3) whether a result binds over time once the electorate and the facts have moved on, call this mandate decay: does anyone say how long a mandate should bind and how you would tell when it has expired; (4) whether the right comparison class is what the representative body would have done anyway, so a referendum is judged against a legislative baseline rather than against an ideal; (5) whether some subject matters are off limits to any majority vote no matter how well informed it is.

  Leaves have to include: a Swiss-style semi-direct defence, a populist/plebiscitary one, an epistocratic or competence-based objection, an information-design or low-salience objection, a deliberative/assembly alternative, and a ratification-only view (referendum is fine as a confirming vote on something a legislature has already worked over, but not as an initiative — the complaint people made about Brexit). Name each leaf or mark it unnamed, and give one sentence on its most awkward commitment, especially what it has to say about California-style proposition voting on technical fiscal questions.

  Then mark the answer-combinations that come out empty and say in a clause why — incoherent, unattractive, or just unoccupied — and flag any pair of leaves your questions can't actually pull apart rather than forcing a distinction. Phrase each branch question so someone could answer it without already knowing which view it leads to. Around eight leaves, and please don't cite anything or give me a reading list, I'll fill in references myself.
reasoning: |-
  Okay, let me tackle this taxonomy request for the direct democracy handout. The user wants a structured decision tree that branches through key philosophical questions about referendum legitimacy, with clearly defined positions at the leaves.

  Hmm, the user specified five diagnostic branches: (1) objection locus (voters vs mechanism), (2) saliency/technicality scaling for voter objections, (3) mandate decay, (4) legislative baseline comparison, and (5) subject matter restrictions. Need to phrase these as neutral questions anyone could answer.

  Starting with Branch 1: "Where does the core problem with binding referendums primarily lie?" with options [A] In voter capacities or [B] In institutional design. This cleanly splits epistocratic objections from mechanism-focused critiques.

  For Branch 2 (voter objections): "Does this voter-capacity problem disappear if the issue is high-salience and non-technical?" [Yes/No] separates low-salience critics from those who think voters are fundamentally incompetent.

  Branch 3 (mandate decay): "Should referendum outcomes have expiration conditions?" [Yes/No] will reveal who considers democratic mandates temporally bounded.

  Branch 4 (baseline): "When evaluating referendum legitimacy, should we compare outcomes to what representative institutions would likely have decided?" [Yes/No] distinguishes proceduralists from consequentialists.

  Branch 5 (subject restrictions): "Are certain policy areas inherently unsuitable for majority decision?" [Yes/No] identifies substantive limits advocates.

  Now mapping positions:
  - Swiss semi-direct: Combines voter competence trust (A) with mechanism safeguards (B), accepts mandate decay (Yes), uses legislative baseline (Yes), no subject bans (No). Awkward on California: Defends technical votes but assumes informed deliberation.
  - Populist plebiscitary: Pure voter sovereignty (A), dismisses saliency scaling (No), rejects mandate decay (No), no baseline comparison (No), no subject bans (No). Struggles with volatile technical decisions.
  - Epistocratic objection: Voter-focused (A), doubts even salient issues (No), mandate decay irrelevant, no baseline comparison needed. Pain point: Explicitly rejects California propositions as illegitimate.
  - Low-salience critics: Voter-focused (A) but only worries about non-salient issues (Yes), accepts decays, may use baseline. Admits California propositions are problematic.
  - Deliberative alternative: Mechanism-focused (B) so skips Branch 2, wants mandate expiration (Yes), rejects baseline comparison, allows subject bans. Replaces binary votes with assemblies.
  - Ratification-only: Mechanism-focused (B), skips Branch 2, requires mandate renewal (Yes), insists on legislative baseline (Yes), allows subject bans. Says California initiatives circumvent proper process.
  - Plus two unnamed positions filling gaps: Permanent mandate populism and Unrestricted majoritarianism.

  Flagging empty nodes: The [Voter objection + No scaling + Accepts decay + No baseline + Subject bans] combo is incoherent - if voters are incompetent even on salient issues, subject bans don't resolve core problem. Also noting that low-salience critics and epistocrats both stem from voter objections but diverge on scaling.

  User gets eight distinct leaves including unnamed variants, with clear awkward commitments on technical fiscal votes. Structure should help seminar participants locate positions diagnostically.
answer: |-
  Here's a taxonomy structured as a decision tree with diagnostic questions, branching to positions (leaves). Each question is phrased neutrally. Positions are named, with their "awkward commitment" on California-style propositions highlighted.

  ---

  **Diagnostic Questions & Branches:**
  1.  **Q1: Where does the primary objection to binding referendums lie?**
      *   **A1a:** In the capacities of the voters (competence, information, judgment).
      *   **A1b:** In the institutional mechanism of the referendum itself (framing, agenda control, aggregation).
  2.  **Q2 (If A1a): Does this voter-capacity objection become negligible if the issue is highly salient *and* non-technical?**
      *   **A2a:** Yes (Objection scales strongly with low salience/technicality).
      *   **A2b:** No (Objection persists even on salient/non-technical issues).
  3.  **Q3: Should referendum outcomes be understood to have a limited mandate that decays as contexts change?**
      *   **A3a:** Yes (Mandate decays; renewal/sunset mechanisms needed; decay linked to voter turnover or changed facts).
      *   **A3b:** No (Result binds indefinitely or until formally reversed).
  4.  **Q4: Should referendum legitimacy be judged by comparing the outcome to what representative institutions would likely have decided?**
      *   **A4a:** Yes (Legislative baseline is the key comparison).
      *   **A4b:** No (Legitimacy is intrinsic to the referendum process or popular will).
  5.  **Q5: Are certain subject matters inherently illegitimate for majority decision via referendum?**
      *   **A5a:** Yes (Fundamental rights, constitutional essentials, etc., are off-limits).
      *   **A5b:** No (No inherent subject restrictions; only procedural limits).

  **Position Leaves (Mapped via Answer Combinations):**

  1.  **Low-Salience Critic** (A1a, A2a, A3a, A4a, A5a/b)
      *   *Path:* Voter objection → Scales with salience/tech → Mandate decays → Legislative baseline → Subject bans possible/irrelevant.
      *   *Core:* Binding referendums are only justifiable for simple, high-salience issues where voters have stable opinions; technical/low-salience votes are dangerous.
      *   *Awkward on California:* Must argue that complex fiscal propositions inherently exceed voter competence, making them illegitimate regardless of perceived "mandate."

  2.  **Epistocratic Objection** (A1a, A2b, A3a/b, A4b, A5a/b)
      *   *Path:* Voter objection → Persists even on salient issues → Mandate decay irrelevant/possible → No legislative baseline → Subject bans possible/irrelevant.
      *   *Core:* Voter incompetence (lack of knowledge/ability to reason) is fundamental, making referendums generally inferior to expert or elite decision-making even on simple issues.
      *   *Awkward on California:* Sees such propositions as the epitome of the problem: voters fundamentally lack the technical competence to decide complex fiscal matters wisely.

  3.  **Deliberative Alternative** (A1b, A3a, A4b, A5a)
      *   *Path:* Mechanism objection → Mandate decays → No legislative baseline → Subject bans exist.
      *   *Core:* Referendums' binary nature and lack of structured deliberation make them inferior; legitimacy requires small-group deliberation (citizens' assemblies) before any vote.
      *   *Awkward on California:* Views proposition voting as the worst case: complex issues reduced to simplistic yes/no choices via campaigns, lacking authentic public deliberation.

  4.  **Ratification-Only View** (A1b, A3a, A4a, A5a)
      *   *Path:* Mechanism objection → Mandate decays → Legislative baseline → Subject bans exist.
      *   *Core:* Binding referendums are only legitimate as a final check *after* extensive legislative/deliberative processing (e.g., constitutional amendments); initiatives bypass vital refinement.
      *   *Awkward on California:* Sees citizen initiatives on technical fiscal matters as illegitimate circumventions of legislative expertise and compromise.

  5.  **Swiss-Style Semi-Direct Defence** (A1a, A2a, A3a, A4a, A5b)
      *   *Path:* Voter objection → Scales with salience/tech → Mandate decays → Legislative baseline → No subject bans.
      *   *Core:* Well-designed mechanisms (filtering, counter-proposals, high thresholds, strong info campaigns) mitigate risks; suitable for major decisions alongside representative govt; voters *can* handle complexity with support.
      *   *Awkward on California:* Must defend complex fiscal propositions as legitimate *only* if robust informational and deliberative supports exist (which CA often lacks), making them potentially problematic in practice.

  6.  **Populist/Plebiscitary View** (A1a, A2b, A3b, A4b, A5b)
      *   *Path:* Voter objection → Persists even on salient issues? → No mandate decay → No legislative baseline → No subject bans. *(Note: This view *rejects* the premise that voter capacities are a problem - it *celebrates* raw popular will)*.
      *   *Core:* The referendum outcome *is* the sovereign will; it binds absolutely and permanently, superseding representative bodies on any matter. Competence objections are elitist.
      *   *Awkward on California:* Must embrace complex fiscal propositions decided by simple majority as the legitimate, binding, and permanent expression of popular sovereignty, regardless of consequences or complexity.

  7.  **Unrestricted Majoritarianism** (A1b *or* A1a/A2b, A3b, A4b, A5b)
      *   *Path:* Mechanism objection *OR* Voter objection → Persists even on salient issues? → No mandate decay → No legislative baseline → No subject bans.
      *   *Core:* The majority's decision via referendum is legitimate on any matter, at any time, and binds permanently. Sovereignty trumps all other concerns.
      *   *Awkward on California:* Fully endorses the legitimacy of binding, permanent decisions on highly technical fiscal matters by simple majority vote, even if poorly understood.

  8.  **Permanent Mandate Populism** (A1a, A2b, A3b, A4b, A5a) - *Rare/Unstable*
      *   *Path:* Voter objection → Persists even on salient issues? → No mandate decay → No legislative baseline → Subject bans exist.
      *   *Core:* The people's will expressed in a referendum is sovereign and permanent, *except* on certain fundamental matters deemed unsuitable for voting (creating tension).
      *   *Awkward on California:* Must simultaneously hold that complex fiscal propositions are legitimate *and* binding forever (due to sovereign will) *unless* deemed a "fundamental right," a difficult line to draw consistently.

  ---

  **Empty/Incoherent Combinations & Indistinguishable Pairs:**

  *   **Empty:** `A1a, A2b, A3a, A4a, A5a` (Voter objection persists always + Mandate decays + Legislative baseline + Subject bans). *Why?* **Unattractive/Incoherent:** If voters are fundamentally incompetent even on simple issues (A1a/A2b), relying on a legislative baseline (A4a) is incoherent (why trust *their* process?), and subject bans (A5a) don't resolve the core incompetence claim. Sunsetting (A3a) is a weak fix for a deep flaw.
  *   **Indistinguishable:** The tree **cannot reliably pull apart** the core commitments of **Populist/Plebiscitary View** and **Unrestricted Majoritarianism** solely based on Q1-5. Both end at `A3b, A4b, A5b`. Populism *emphasizes* the "will of the people" over elite objections (often rooted in voter-focused critiques), while Unrestricted Majoritarianism might be more purely procedural. They functionally converge on outcomes (binding, permanent, unlimited scope). The distinction is more rhetorical/motivational than structural in this taxonomy.

  ---

  **Key Notes:**

  *   **"Awkward Commitment" on California:** Each position's stance on complex, technical fiscal propositions highlights its most challenging practical implication.
  *   **Mandate Decay (Q3):** Positions accepting decay (A3a) rarely specify exact timelines; decay is usually triggered contextually (new electorate, changed facts, prolonged time). The "Permanent Mandate" positions (A3b) explicitly reject this.
  *   **Legislative Baseline (Q4):** This is crucial for distinguishing procedural views (Swiss, Ratification) that see referendums as *part* of a system with representative bodies, vs. populist/plebiscitary views that see referendums as *superseding* them.
  *   **Subject Bans (Q5):** Distinguishes positions accepting substantive limits on popular sovereignty (Deliberative, Ratification, Permanent Mandate Populism) from those rejecting any such limits (Populist, Unrestricted Majoritarian, Swiss).
  *   **Q1 & Q2 Interaction:** The `A1a -> A2a` path (Low-Salience Critic) accepts that voters *can* decide well *under specific favorable conditions* (simple/salient), while `A1a -> A2b` (Epistocratic) denies this competence even under ideal referendum conditions. Populist views reject the premise of Q1/Q2 that voter capacities are problematic.
