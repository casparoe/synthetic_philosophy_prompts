prompt: |-
  I help catalogue amateur metal-detecting finds for our county heritage record, and I keep arguing with a fellow volunteer — call her Diane — about when a find lets you say something about what people *believed*, rather than only what they did. Her rulings so far:

  - Dozens of spearheads deliberately bent and snapped before being put into bogs across the region, none ever fished back out: belief, an offering — you may talk about what they thought.
  - A worn, clipped coin from ploughsoil: a loss; says nothing about belief.
  - Two hundred graves in one cemetery with the same three objects in the same positions and every body aligned the same way: a shared belief about death.
  - A stack of unused iron bars in one fort ditch, no parallel anywhere else, about half of them later dug back up and worked: not belief; somebody was storing hardware.
  - Burnt hazelnut shells scattered through the floor make-up of a single house: rubbish; nothing to infer.
  - A shrine building with no image in it: absence proves nothing, the statue may have been wood.

  The new case: one unused, very finely made bronze axe, deliberately smashed, set point-down in the back-filled posthole beneath a longhouse threshold and sealed under the finished floor, so that once the house was up nobody could ever see it or get it back; nothing like it anywhere nearby for centuries.

  Please predict how she rules, set out the two or three rules that fit her whole track record equally well (something like: redundant-cost-and-unrecoverable, pattern-across-many-contexts, placement-in-a-set-apart-place), say what each predicts here and which you'd bet on, and name the one further find that would best separate the rules that survive. Don't tell me what the textbooks say — I want what her own record commits her to. One worry of mine she has never addressed: a deposit sealed where no one could see it and no one could retrieve it isn't addressed to anyone, so calling it an offering may be the wrong story — it may be closer to putting something spoiled or dangerous out of reach. I'd like to know whether her earlier rulings already quietly settle that, or whether it's the case that would finally force her to say which she means.
reasoning: |-
  Okay, let me tackle this user's query. They're cataloging metal-detecting finds and have ongoing debates with Diane about inferring beliefs from artifacts. The user wants to predict Diane's ruling on a new case involving a smashed bronze axe sealed under a threshold. 

  First, I need to analyze Diane's past rulings to identify patterns. The spearheads in bogs were deemed offerings because they were deliberately damaged and unrecoverable. The clipped coin was a loss with no belief implication. The graves showed a pattern across many contexts, indicating shared beliefs. The iron bars were practical storage. Burnt hazelnuts were rubbish without a pattern. The empty shrine's absence didn't prove anything.

  From this, Diane's rules seem to be: redundant cost and unrecoverable placement, consistency across multiple contexts, and placement in a set-apart place. The axe case involves high craftsmanship, deliberate destruction, and permanent sealing—similar to the spearheads. But it's a single instance, which Diane might see as insufficient without a pattern. 

  The user's concern is whether such sealed deposits are offerings or just disposing of dangerous items. Diane's spearhead ruling implies offerings don't need retrieval, addressing that concern. For the axe, the rules might conflict: the destruction and sealing suggest belief, but the lack of parallels could make Diane rule it as non-belief. 

  To test this, a find with multiple sealed, destroyed items in thresholds would clarify if pattern is necessary. If Diane accepts that, pattern is key; if not, then single instances with irrecoverable placement suffice. The user's deeper need might be understanding how Diane interprets intentionality and whether absence of retrieval supports belief or disposal.
answer: |-
  Based on Diane's track record, here's the prediction and analysis:

  1.  **Predicted Ruling:** Diane will rule the smashed axe under the threshold **IS evidence of belief** ("an offering" or "ritual deposit").

  2.  **Diane's Implicit Rules (fitting her track record):**
      *   **Rule 1: Irreversible Action + Irrecoverable Placement = Belief (Offering/Protection):** This prioritizes deliberate, destructive action rendering the object unusable *combined* with placement making retrieval impossible/permanent. The object is functionally "gone" from the human world. (Spearheads: Bent/snapped + Bogged; Axe: Smashed + Sealed under floor).
      *   **Rule 2: Pattern & Consistency = Belief:** This requires repetition across multiple, similar contexts to infer shared practice/meaning. (Graves: 200 instances, uniform practice).
      *   **Rule 3: Practical Functionality Trumps Ambiguity:** If a plausible, mundane, practical explanation exists (loss, storage, rubbish disposal, material limitations), belief is *not* inferred, especially for single or ambiguous finds. (Coin: Loss; Iron Bars: Storage; Hazelnuts: Rubbish; Empty Shrine: Absence proves nothing - practical explanation possible).

  3.  **Applying the Rules to the Axe & Prediction:**
      *   **Rule 1 (Irreversible + Irrecoverable):** **Strong Fit.** The axe is deliberately *smashed* (irreversible action) and *permanently sealed* point-down under a threshold where it's invisible and unrecoverable (irrecoverable placement). This mirrors the spearheads' logic perfectly.
      *   **Rule 2 (Pattern & Consistency):** **Weak Fit/Missing.** It's a single, unique find within the context ("nothing like it anywhere nearby for centuries"). While *internally* deliberate, there's no broader pattern *yet* of similar deposits under thresholds. Diane might note this lack of pattern weakens *specific* interpretation but doesn't negate the "belief" category.
      *   **Rule 3 (Practical Functionality):** **Poor Fit.** Smashing a *finely made*, *unused* bronze object and permanently hiding it under the threshold has no plausible practical explanation (it's not storage, loss, rubbish disposal, or reuse). It actively destroys value and access.
      *   **Bet:** Based on the strong parallel to the spearheads (Rule 1) and the total lack of a practical explanation (Rule 3), **I'd bet heavily on Diane ruling this as evidence of belief.** The lack of pattern (Rule 2) might make her cautious about *what specific belief*, but the *act itself* fits her "offering" logic.

  4.  **Resolving Your "Unaddressed Worry" (Addressed to Whom?):**
      Diane's **spearhead ruling decisively settles your worry.** She ruled that deliberate destruction + permanent deposition in an unrecoverable location (the bog) *is* evidence of belief ("an offering"). **She implicitly rejects the idea that an offering needs a retrievable audience or must be "addressed" to someone visible.** The act of permanent removal *is* the point – giving it *away* (to gods, spirits, the place itself) or neutralizing it. Her ruling on the axe logically commits her to the same view. The sealed axe isn't "just disposal" under her logic; the *quality* ("very finely made"), the *deliberate destruction*, and the *specific, symbolically charged location* (threshold) elevate it beyond simple disposal of spoiled goods. Her rules focus on the *intent behind the action and placement*, not the visibility to humans *after* deposition.

  5.  **The Best Separating Find:**
      To test the relative importance of **Rule 1 (Irreversible+Irrecoverable)** vs. **Rule 2 (Pattern)** for unique deposits:
      *   **The Find:** **Three or four additional longhouses within the same settlement/region, each with a single, deliberately destroyed (e.g., bent, snapped, smashed), non-trivial object (e.g., fine tool, weapon, ornament) found sealed *under the threshold* or in another *specific, irrecoverable structural location* (e.g., foundation trench, beneath central post), with no practical explanation.**
      *   **Why it Separates:**
          *   If Diane rules *each individual instance* as evidence of belief *even before* finding multiple (relying on Rule 1), then Pattern (Rule 2) is important for *understanding the belief system* but not *essential for identifying the act as belief-driven*.
          *   If Diane *only* rules it as evidence of belief *after* finding multiple instances (invoking Rule 2), then Pattern is essential *even when* Rule 1 (Irreversible+Irrecoverable) is strongly met for a unique find. This would mean her ruling on the single axe might have been on the borderline, reliant heavily on the strength of Rule 1 vs. the lack of Rule 2, and the pattern finally confirms it.

  **Conclusion:** Diane's logic points strongly to ruling the axe as evidence of belief. Her spearhead ruling shows she accepts permanent, unrecoverable deposition as indicative of ritual/offering, settling your concern about visibility/audience. The key tension in her framework for unique finds like this axe is between the strength of the *action/placement* (Rule 1) and the *lack of pattern* (Rule 2). Finding a pattern of similar sealed deposits would resolve that tension definitively.
