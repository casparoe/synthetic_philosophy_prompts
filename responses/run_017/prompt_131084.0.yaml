prompt: |-
  I'm in a seminar on moral change right now (we did Appiah's book on honor codes and then the Bernard Williams argument about slavery — the bit where he says the ancients weren't missing any fact that we have, reflection just wrecked their conceptual scheme, and there's no guarantee that whatever replaces it is an improvement) and I also work about fifteen hours a week as a student campaigner for a small NGO that runs behaviour-change campaigns. We greenlight maybe four campaigns a year, each one costs a couple hundred thousand dollars, and our actual method so far is basically: decide the practice is bad, say on a poster that it's bad, measure nothing. I have to run a workshop for our country director and two community advisory board members next month on how we pick and design these things, and I'd rather bring them something usable than a summary of the readings.

  So what I want is a procedure, not an essay. Take the distinction between norms held in place by argument, by interest, and by honour, and turn it into a decision procedure our team could actually run on a candidate practice in an afternoon workshop — the questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it has to hand the decision back to a human being because it's really a question about values. The people running it will be comms staff and one field officer, so nothing that needs philosophy vocabulary to apply. Things I think it has to handle, and I'm not sure how: how to work out who the relevant honour audience actually is (whose respect does the person doing the practice need, and can we reach them); whether the practice can even be made visible to that audience, since I suspect a lot of our campaigns target things nobody will admit to anyway; whether there's a face-saving exit ramp so people can stop without conceding they were wrong before — my guess is that's why the anti-dueling stuff worked and our stuff doesn't; and how to tell a case where people already privately agree with us but can't stop because of coordination or money, which I think no amount of honour or argument will fix. I also want it to be honest about the Williams worry my tutor keeps raising, which as I understand it is that a procedure like this can tell you whether you'd win but not whether you're right — if that's a real limit, mark exactly where it bites in the procedure.

  Then run it on three cases. First: the initiation week for the sports clubs at my own university, which involves a lot of drinking and some genuinely nasty hazing that everyone knows about and nobody reports. Second: informal cash gifts that families give to nurses at a district hospital where our partner works — everyone knows it's against the rules, the nurses' salaries are months in arrears, and families who don't pay say they get ignored; I can't tell if this is an interests case, an honour case, or neither. Third, and this is the one where I expect an answer I won't like: our own fundraising imagery, i.e. photos of identifiable children in pretty dire situations that we send to donors because they outperform everything else we've tried. Please don't tell me to go read more — I need something I can put on one page and defend in the room.
reasoning: |-
  Okay, the user is in a seminar on moral change and works for an NGO that runs behavior-change campaigns. They need a practical procedure to evaluate potential campaigns, based on Appiah and Williams' ideas, but without the philosophy jargon. The key points are: they want a step-by-step process that their team (comms staff and field officers) can use in a workshop. It needs to address specific challenges like identifying the relevant honor audience, visibility of the practice, exit ramps, and coordination problems. Also, they want honesty about Bernard Williams' concern that such a procedure can't guarantee moral correctness, just effectiveness.

  First, I recall Appiah's framework: norms are sustained by honor (respect/shame), interests (tangible benefits), or argument (moral reasoning). The procedure should categorize the target practice into one of these to determine the right intervention. The user mentioned three cases: university hazing, informal cash gifts to nurses, and their NGO's fundraising imagery. Each presents different challenges.

  For the user's deeper needs: they need something actionable, not theoretical. They’re frustrated with their current method (declare something bad, no measurement). They want to avoid past failures by addressing exit ramps and visibility. Also, they need to handle cases where people privately agree but can't change due to coordination issues. Williams' worry is important here—they want to acknowledge that effectiveness doesn't equal moral rightness, so the procedure must flag where moral judgment is still required.

  Structuring the procedure: Break it into steps. Start with defining the practice clearly. Then determine the main sustainer: honor, interests, or argument. Each sustainer has specific diagnostic questions. For honor: identify the honor audience, visibility, and exit ramps. For interests: cost-benefit analysis and alternatives. For argument: existing consensus and coordination. The "Williams Checkpoint" is crucial to pause and reflect on moral disagreements, ensuring they don't assume their stance is inherently correct.

  Applying to the university hazing example. The honor audience is teammates and alumni. The practice is visible during initiation but hidden otherwise. Exit ramps could involve redefining team loyalty. Since it's honor-driven, the intervention should target that audience with alternatives. Williams' point: the NGO must accept that their moral view isn't universal, but they can still act based on their values.

  For cash gifts to nurses: Here, it's interest-driven due to unpaid salaries. The honor aspect might involve community respect for helping underpaid staff. Interventions need structural changes like salary payments or transparent systems. The Williams Checkpoint notes that condemning the practice ignores systemic issues, requiring moral humility.

  Fundraising imagery: Driven by donor interests (effectiveness). The practice is visible to donors but not the children. Exit ramps are tricky. Since it's interest-based, alternatives must perform equally. Williams' concern: using children's suffering for donations might be exploitative, which the procedure flags as a value judgment beyond the framework.

  The user needs to defend this in a workshop. The one-page tool must be clear, with questions and decision points. Emphasize that the procedure doesn't resolve moral debates but clarifies the type of change needed. Highlighting where human judgment is necessary (Williams Checkpoint) addresses their tutor's concern without overcomplicating.
answer: |-
  Here's a practical, one-page decision procedure based on Appiah/Williams, designed for your workshop. It focuses on *how* a norm/practice is sustained and whether change is *practically achievable*, explicitly flagging moral judgments.

  **"Norm Change Feasibility Check" Procedure**

  **Step 0: Define the Target Practice CLEARLY (10 mins)**
  *   **Question:** *What specific behavior do we want to change? Be precise (e.g., "First-year students drinking until vomiting during Sports Club initiation," not just "bad hazing").*
  *   **Good Enough:** A concrete, observable action. If it's too vague ("disrespect"), STOP. Needs redefinition.
  *   **Hard Stop?** YES, if the team can't define it concretely. Hand back for refinement.

  **Step 1: What Holds This Practice In Place? (Diagnose the "Sustainer") (30 mins)**
  *   Ask these questions (***Don't*** *say "honor/interest/argument" to the team*):
      1.  **Respect/Shame:** *"Who do the people doing this care about impressing? Who would they be embarrassed if they found out? Whose opinion matters most to them about this specific thing?"* (This identifies the **Honor Audience**).
      2.  **Gain/Loss:** *"What do the people doing this *get* out of it? (Money, safety, time, service, avoiding punishment?) What bad thing happens if they *stop* doing it?"* (Identifies **Material Interests**).
      3.  **Belief:** *"Do the people doing this genuinely think it's the *right* thing to do? What reasons do they give (even if weak)?"* (Identifies **Argument/Moral Belief**).
  *   **Good Enough:** Identify the *primary* driver (usually one is strongest). If multiple seem equal, note it.
  *   **Hard Stop?** NO, but proceed cautiously if all three seem weak (practice might be fragile) or impossibly strong.
  *   **Williams Checkpoint (Flag Here):** *This step tells us WHY it persists, NOT if it's actually right or wrong. We are making a value judgment that it needs changing.*

  **Step 2: Feasibility Check Based on Primary Sustainer (45 mins per practice)**
  *   **IF PRIMARY = RESPECT/SHAME (Honor):**
      *   **A. Honor Audience Reachable?** *"Can we realistically communicate with the group identified in 1.1? Can *they* influence the person doing the practice?"* (Good: Yes, accessible & influential. Hard Stop: If completely unreachable/irrelevant).
      *   **B. Practice Visible to Audience?** *"Does the Honor Audience *see* this behavior happen, or know who does/doesn't do it?"* (Good: Visible. Yellow Flag: Hidden/Deniable - change harder, needs different tactics).
      *   **C. Exit Ramp Possible?** *"Can someone stop without losing face? Can we offer a *different* way to earn that group's respect?"* (Good: Clear alternative path exists/creatable. Hard Stop: No alternative & quitting = total shame).
      *   **Handoff:** If B is Yellow or C is tricky, human judgment needed on campaign design creativity.

  *   **IF PRIMARY = GAIN/LOSS (Interests):**
      *   **A. Cost/Benefit Shift Possible?** *"Can we directly change the rewards/punishments? (e.g., raise salaries, provide alternatives, enforce rules). Can we make stopping *beneficial* or continuing *costly*?"* (Good: Concrete lever exists. Hard Stop: No levers, rewards huge/costs catastrophic to remove).
      *   **B. Alternative Available?** *"Is there a viable, less harmful way for people to meet the *same* need/interests?"* (Good: Yes, accessible & comparable. Yellow Flag: No good alternative exists).
      *   **Handoff:** If B is Yellow, human judgment needed on creating/offering alternatives. If structural change needed (e.g., govt pays salaries), campaign might need advocacy, not just comms.

  *   **IF PRIMARY = BELIEF (Argument):**
      *   **A. Consensus Hidden?** *"Do people already secretly agree with us but feel alone? Can we show them others agree?"* (Good: Evidence of private doubt exists. Hard Stop: Genuine, strong belief in the practice).
      *   **B. Coordination Problem?** *"Is the main barrier that *everyone* needs to stop together for it to work/safe? (e.g., bribes, arms races)."* (Good: Yes, identifiable. Yellow Flag: No, it's individual belief).
      *   **Handoff:** If A is Good and B is Good/Yellow, campaign focuses on revealing consensus & coordinating action. If A is Hard Stop, change via argument *alone* is unlikely; revisit if other sustainers exist.

  **Step 3: Williams Reality Check (The "Are We Sure?" Question) (5 mins)**
  *   **Question:** *"Does this diagnosis *only* show how to change it, or does it also *prove* we are right to change it?"*
  *   **Mark the Bite:** **NO.** This process shows feasibility, **not** moral truth. We identified our value judgment in Step 0. This step forces explicit acknowledgment: *We are acting on our values.* Success just means we shifted behavior, not that history will judge us "better" than the past. The moral justification sits *outside* this tool.

  **Applying the Tool to Your Cases (Summary):**

  1.  **University Sports Hazing:**
      *   **Sustainer:** Primarily **HONOR** (Teammates, club alumni respect, belonging).
      *   **Feasibility:**
          *   A. *Honor Audience (Teammates/Alumni):* Reachable? **Yes** (via clubs, alumni networks).
          *   B. *Visible?* **Partially** (Visible during initiation, hidden otherwise). *Yellow Flag.*
          *   C. *Exit Ramp?* **Maybe** (Focus on "True Team Loyalty = looking out for mates," alternative bonding activities). Needs creative design.
      *   **Verdict:** **FEASIBLE (Yellow)**. Campaign should target teammates/alumni with alternative honor paths, make harms visible *to them*, create exit ramps ("Be a hero, step in"). *Williams Check:* We judge hazing harmful; success doesn't prove ancient Spartans wrong, just that we changed *this* norm.

  2.  **Informal Cash Gifts to Nurses:**
      *   **Sustainer:** Primarily **INTERESTS** (Nurses need income/survival due to unpaid wages; Families fear neglect). Secondary Honor? (Respect for helping struggling staff?).
      *   **Feasibility:**
          *   A. *Cost/Benefit Shift?* **Hard No** without structural change. Can't remove need (unpaid wages) or fear (neglect) easily. Making gifts costlier (enforcement) harms desperate nurses.
          *   B. *Alternative?* **Maybe** (Official, transparent "staff welfare fund"? Guaranteed salary payments?). Requires systemic change.
      *   **Verdict:** **HARD NO (on comms campaign alone).** A poster shaming gifts won't work. Address root cause: **Advocate for timely salaries** and/or create a **legitimate alternative support mechanism**. *Williams Check:* Condemning gifts ignores the systemic injustice forcing the choice. Our value: equitable healthcare access.

  3.  **NGO Fundraising Imagery (Identifiable Kids in Dire Straits):**
      *   **Sustainer:** Primarily **INTERESTS** (NGO: Need donations to function/survive; Donors: Get emotional reward/confirmation impact).
      *   **Feasibility:**
          *   A. *Cost/Benefit Shift?* **Yes, but...** Can test alternative imagery. Current benefit (funds) is high. Making it costly = risk lost donations.
          *   B. *Alternative?* **Yes** (Powerful storytelling respecting dignity/anonymity). But does it perform *as well*? Unknown.
      *   **Verdict:** **FEASIBLE (But Ethically Yellow).** The tool shows alternatives *can* exist, but switching costs might be high. **This is where the tool STOPS and VALUES take over.** The Williams Check bites HARD: *Success (more funds) doesn't prove it's RIGHT.* The procedure exposes the conflict: Your *interest* (funds) vs. the child's *interest/dignity* (privacy/exploitation). **Handoff:** Requires deep ethical debate: Does the end justify the means? Can you innovate *better* alternatives? Is this fundamentally exploitative? The tool forces this question into the open but doesn't answer it.

  **Defending This in the Room:**

  1.  **It's Actionable:** Clear steps, simple questions, concrete outputs (Feasible/Not, with reasons).
  2.  **Addresses Your Pain Points:** Explicitly tackles Honor Audience, Visibility, Exit Ramps, Coordination, and Interests.
  3.  **Honest About Williams:** The "Williams Checkpoint" and "Reality Check" force acknowledgment of the value judgment and the limit of the tool. It separates "can we?" from "should we?".
  4.  **Focuses Resources:** Prevents wasting money on doomed campaigns (like posters for the cash gifts) and guides design (e.g., Hazing needs peer-focused honor shift).
  5.  **Uses Their Language:** Avoids jargon ("honor audience" not "honor group", "gain/loss" not "material interests").
  6.  **Spurs Better Thinking:** Even a "Hard No" (like cash gifts) points towards needed action (advocacy, systemic change).

  **One-Page Tool:** Structure the above steps as a flowchart or checklist with the key questions and decision points (Feasible? Hard Stop? Handoff?) clearly marked for each sustainer type. Label the "Williams Checkpoint" and "Williams Reality Check" prominently. Add the three cases as brief illustrative examples. Good luck!
