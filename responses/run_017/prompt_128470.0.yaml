prompt: |-
  I run a small reading group that's been working though self-locating belief, and everyone has already said there piece about the plain vanilla case, so I want something that pushes past it. Here's the setup I've been messing around with, and I want you to argue one side of it.

  Case A, the plain one. Fair coin on Sunday. Heads: Beauty is woken Monday and that's it. Tails: she's woken Monday and Tuesday, amnesia in between, no clock, no way to tell the days apart. On waking she's asked her credence in heads. Halfers say a half, thirders say a third, and we've heard all of that already.

  Case B, mine. Same coin, but now there are two people, Beauty and her understudy. Heads: Beauty is woken Monday, the understudy sleeps through the whole thing. Tails: Beauty is woken Monday and the understudy is woken Tuesday. When you wake up you genuinely can't tell which of the two you are — twins, no mirrors, the experimenter never uses either name — though both of you were told the protocol in advance and know it. If you knew you were Beauty you'd be at a half, since Beauty gets woken either way. If you knew you were the understudy you'd be at zero, since the understudy only ever wakes on tails. You're two-thirds sure you're Beauty, and that nets out at a third.

  Case C, also mine. Same as A except that on tails Beauty is woken Monday, then scanned overnight, and an exact duplicate of her is woken Tuesday in her place while the original sleeps on, with the duplicate put under for good at the end of Tuesday. Again you can't tell whether you're the original or the duplicate. Same arithmetic as B: a half if you knew you were the original, zero if you knew you were the duplicate, a third if you don't.

  What I want you to argue for: that A has to get the same answer as B and C, so a third, and that the halfer's way of parking A at a half is dead. In particular, don't let anyone get away with this reply — in B and C you're ignorant about *who* you are, which is a real lottery with a real chance of you never waking up at all, whereas in A Beauty was guaranteed in advance to be woken at least once whatever the coin did, so her being awake isn't news and she stays at a half. I need you to actually kill that move, not just give it a name. And whatever principle you use has to say something about the duplicate in C, who is in a tails world every single time and would still be answering a half if she reasoned like a halfer.

  Give me exactly five numbered points, one or two sentences each, no preamble and no summing up at the end. Keep it in plain language, no more than one line of arithmetic anywhere, and don't cite anybody — half the group hasn't read the literature and I want something I can read out loud.
reasoning: |-
  Hmm, the user is running a reading group on self-locating beliefs and wants to push beyond the classic Sleeping Beauty problem. They've created two variants (Case B and Case C) and want me to argue that all three cases should have a credence of 1/3 for heads, countering the halfer position. Specifically, they want me to dismantle the argument that Beauty in Case A is guaranteed to wake up, unlike in B and C where there's uncertainty about identity.

  I need to present five concise points that directly address this challenge. The user wants plain language, no citations, minimal math, and exactly five numbered points without preamble or conclusion. They also want me to specifically counter the "guaranteed wake-up" objection that halfers might raise for Case A.

  For Case B: With two people (Beauty and understudy), waking up gives evidence against being the understudy (who only wakes on tails), naturally leading to 1/3 credence for heads. The uncertainty about identity directly impacts probability.

  For Case C: The duplicate only exists in tails worlds, so if you wake up as the duplicate, heads is impossible. Not knowing if you're original or duplicate forces credence below 1/2.

  The key is to show that in all cases, the waking moment provides new information - not about whether you exist, but about which perspective you're experiencing. In Case A, Beauty learns "it's now a waking moment," which occurs more often in tails scenarios. The "guaranteed wake-up" objection fails because while Beauty knows she'll wake up, she doesn't know which specific waking moment she's experiencing.

  I'll structure five points:
  1. Establish that uncertainty about identity in B/C lowers credence
  2. Show how this applies to the duplicate in C
  3. Explain why A is identical despite no identity uncertainty
  4. Directly counter the "guaranteed wake-up" objection
  5. Demonstrate that halfer reasoning fails for the duplicate in C

  The last point is crucial - if the duplicate in Case C used halfer reasoning, they'd mistakenly assign 1/2 credence to heads despite being in a tails-only situation. This reductio ad absurdum should effectively undermine the halfer position across all cases.
answer: |-
  1.  In B and C, not knowing *who* you are makes heads less likely because only one identity exists on heads, but two exist on tails, so being awake makes tails twice as likely.
  2.  The duplicate in C *only* exists if tails fell, so if you *were* the duplicate, heads would be impossible; not knowing your identity forces your credence below half.
  3.  In A, Beauty also doesn't know *which waking moment* she's experiencing (Monday or Tuesday), and Tuesday only happens on tails – this is functionally identical to not knowing "who" you are in B/C.
  4.  Knowing you'd wake up *sometime* in A doesn't change anything; the key is that *this specific moment* of wakefulness is more likely to be happening on a tails day because there are two such moments.
  5.  If the duplicate in C reasoned like a halfer ("I was guaranteed to wake up in *some* role if tails"), she'd wrongly say half, even though she *only* exists and wakes up on tails.
