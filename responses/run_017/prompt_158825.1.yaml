  In the procedure, step 4 is triggered only if step 3 is flagged OR step 1 is positive? Actually, step 4 is a routine check? The query says "using only data we actually have". We can do a random audit of the screener's flags every quarter? It's feasible. So:

  - Step 4 is done every quarter? We don't want to overburden. Alternatively, we do step 4 only if step 1 or step 3 flags? But the third case in the query is: "the screener flagging patients whose notes contain none of the criterion symptoms but who resemble earlier flagged patients in demographics and service history". So we must check.

  Let's restructure:

  We do steps 1, 2, 3 in order. Then step 4 (screener check) is done if:
     - Step 1 was positive OR 
