  Total words: ~1000. We need to condense.

  Condensed procedure and application:

  **Procedure (Checklist):**
  1. **Verbatim symptom reporting**: Review 20 random CDE intake notes. If ≥6 (30%) contain ≥2 criterion phrases verbatim without elaboration → flag.
  2. **Funding motive**: If any intake note explicitly states CDE coding is for securing sessions → hand to management (values issue).
  3. **Prevalence vs. referrals**: If CDE prevalence ↑≥20% from last quarter AND referrals and waitlist change ≤5% → flag.
  4. **Screener validity**: Review 20 random screener-flagged CDE cases. If ≥5 (25%) lack criterion symptoms but match demographics/service history → flag.
  5. **Outcomes (if data)**: If CDE patients use >20% more sessions than matched non-CDE without better outcomes → flag.
