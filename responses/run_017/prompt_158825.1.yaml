  So for the third case in the query (screener issue without outcome data):
  - Step 4: Yes → step 5: no outcome data → then we stop (no criteria change) but recommend retraining the screener.

  **What the procedure cannot do:**
  - It cannot distinguish between a genuine increase in CDE due to societal changes and a looping effect without a control group (e.g., a similar trust not using CDE).
  - It cannot capture implicit clinician motivations (only explicit notes).
  - It cannot assess whether the category is "real" (ontological question) — only whether it is stable or looping.
