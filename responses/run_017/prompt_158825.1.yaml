  We are designing a procedure for quarterly audits of the new diagnostic category CDE (Compulsive Digital Engagement). The procedure must be actionable by clinicians without philosophy backgrounds, using available data: coded prevalence, referral letters, free-text intake notes, waitlist and session counts. We need to account for two loops: (1) an automated screener trained on last year's notes (which may already reflect prior labeling effects) and (2) the funding rule that clinicians know coding CDE unlocks sessions.

  The core distinction: 
    - Category A: Tracks a condition that is indifferent to being classified (i.e., the classification does not alter the condition itself).
    - Category B: The introduction of the category changes how people experience, present, and describe themselves, thereby altering the evidence used to assess it.

  We preserve this distinction as the central focus. We drop other philosophical nuances for simplicity and focus on operational indicators.

  We design a flowchart in words (a checklist of questions). The procedure stops if at any point we cannot proceed without a values decision (hand to a person) or if the evidence is insufficient to make a change (stop and do not revise).

  Procedure:

  1. **Check for symptom mimicry in intake notes**: 
     - Question: Are intake notes increasingly reproducing the exact wording of the CDE criteria, especially in the absence of detailed behavioral descriptions?
     - Data: Free-text intake notes from the current quarter vs. baseline (pre-CDE or early implementation). 
     - Sufficient answer: Yes (if ≥30% of notes with CDE code contain ≥2 criterion phrases verbatim without elaboration) OR No.
     - If Yes → Go to 2; If No → Go to 3.

  2. **Assess clinician coding awareness**: 
     - Question: Are there explicit notes indicating that CDE coding is motivated by securing sessions?
     - Data: Free-text intake notes, especially looking for phrases like "coded for funding", "to get sessions", etc.
     - Sufficient answer: Yes (if any note in the quarter states this) OR No.
     - If Yes → Indicates a values conflict (funding rule loop) → Hand to management for decision (they must weigh patient need against diagnostic integrity). 
     - If No → Go to 3.

  3. **Check prevalence against referral and waitlist trends**:
     - Question: Is CDE prevalence increasing without a corresponding increase in referrals or waitlist?
     - Data: Quarterly coded prevalence of CDE, referral letters count, waitlist counts.
     - Sufficient answer: 
          - Increase in prevalence ≥20% from last quarter AND referrals and waitlist are flat (change ≤5%) or decreasing → Flag as potential diagnostic drift.
          - Otherwise → Go to 4.
     - If Flagged → Go to 4.

  4. **Review screener performance**:
     - Question: Is the automated screener flagging patients without criterion symptoms but with demographic/service history similarities?
     - Data: Sample of patients flagged by screener; review their intake notes for absence of CDE symptoms (using a random sample of 20 cases).
     - Sufficient answer: 
          - Yes (if ≥25% of the sample lack criterion symptoms but have similar demographics/service history) → Indicates the screener is learning non-clinical patterns → Go to 5.
          - No → Go to 5.

  5. **Assess therapeutic outcomes (if data available)**:
     - Note: We may not have outcome data yet, but if we do (e.g., session counts, early discharge rates), we use it.
     - Question: Are CDE patients using significantly more sessions than non-CDE patients with similar severity (if severity data exists) without better outcomes?
     - Data: Session counts per patient, outcome measures (if any), e.g., symptom reduction scales.
     - Sufficient answer: 
          - If CDE patients have higher session usage without better outcomes → Go to 6.
          - Otherwise → Stop: No change to criteria this quarter (insufficient evidence of looping).

  6. **Decide on revision**:
     - At this point, we have evidence of potential looping (from steps 1, 3, 4, or 5). 
     - However, we must distinguish:
          - If the evidence from step 2 (clinician awareness) was positive (i.e., coding for sessions) and we are now considering narrowing criteria → This would cut patients off from sessions → This is a values decision (weighing access vs. accuracy) → Hand to management.
          - Otherwise (no step 2 positive) → We have evidence of a self-reinforcing category (Hacking's loop) → Propose narrowing criteria to focus on core symptoms (technical decision).

  Stopping rules:
  - Stop with "no revision" if no flags are raised by step 5.
  - Stop and hand to a person at step 2 (if yes) and step 6 (if the change would cut funding).

  Now, apply to three quarters:

  **Quarter 1 (Baseline):**
  - Intake notes: No reproduction of criterion wording; diverse descriptions.
  - Prevalence: As expected (low, new code).
  - Referrals/waitlists: Normal.
  - Screener: New, not yet flagged non-symptomatic cases.
  - Outcome: Stop (no revision). No evidence of looping.

  **Quarter 2:**
  - Intake notes: 40% of CDE notes now contain ≥2 criterion phrases verbatim without elaboration (step 1: Yes).
  - Clinician notes: No explicit funding mentions (step 2: No → step 3).
  - Prevalence: Up 40% from Q1, but referrals flat (+1%), waitlists flat (step 3: Flag → step 4).
  - Screener: Not yet reporting issues (step 4: No → step 5).
  - Outcome data: Not available. 
  - Result: Evidence of diagnostic drift (symptom mimicry and rising prevalence without increased referrals). However, without step 2 positive, we propose narrowing criteria (step 6) but note: if narrowing would remove the code from some patients, and if those patients need sessions, that's a values issue? In step 6 we only hand to a person if step 2 was positive (which it wasn't). So we proceed with technical narrowing. But caution: if the funding rule is known, narrowing might harm access. We did not detect explicit funding motives, so we treat as a technical fix. However, the procedure must note: even without explicit notes, clinicians might be implicitly influenced. We are dropping this nuance for simplicity.

  **Quarter 3:**
  - Intake notes: Still high verbatim use (step 1: Yes).
  - Clinician notes: Now, some notes say "coded CDE to ensure sessions" (step 2: Yes) → Hand to management. 
     - Management must decide: even if some codes are driven by funding, the patients might still need help. They might choose to keep criteria wide or address the funding rule.

  Alternatively, if in step 2 we get a Yes, we hand it over immediately. So in Q3 we stop at step 2.

  But also, let's consider another scenario in the same quarter:
  - Prevalence: Up another 20% (from Q2), referrals flat, waitlists up 10% (step 3: Flag, but we are already at step 2 and handed over).
  - Screener: Now, 30% of flagged cases lack symptoms but have similar demographics (e.g., young, prior anxiety diagnosis). But we don't get to step 4 because we handed over at step 2.

