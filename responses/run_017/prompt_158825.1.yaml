answer: |-
  ### Quarterly CDE Audit Procedure  
  *Designed for clinicians, using available data: coded prevalence, referral letters, free-text intake notes, waitlist/session counts. Time: ≤20 mins/quarter.*  
  **Core Distinction Preserved**: *Indifferent Condition* (category tracks a stable reality) vs. *Looped Category* (category changes patient self-presentation, clinician documentation, or coding behavior). **Dropped Distinctions**: Hacking’s historical/contextual nuances (irrelevant for audits), motives of patients (no data), long-term societal effects (beyond scope).  

  **Flowchart Checklist**  
  *Run steps in order. Stop if "No" or "Insufficient." Hand to management at values decisions.*  

  1. **Check intake notes for criterion mimicry**  
     - *Question*: Do ≥30% of CDE-coded intake notes reproduce ≥2 criterion phrases verbatim (e.g., "compulsive scrolling" matching criterion A.1) without unique detail?  
     - *Data*: Random sample of 20 CDE intake notes vs. baseline (pre-CDE or Q1 notes).  
     - *Sufficient answer*: **Yes** → Proceed to Step 2.  
       **No/Insufficient** → Proceed to Step 3.  
     - *Why*: Verbatim reuse suggests patients/clinicians are adopting the category’s language, altering evidence.  

  2. **Check for explicit funding-driven coding**  
     - *Question*: Do any intake notes, referral letters, or session records state that CDE coding was used to "secure funding," "unlock sessions," or similar?  
     - *Data*: Text search for terms like "fund," "session access," "code for therapy" in CDE records.  
     - *Sufficient answer*: **Yes** → **Hand to management** (values issue: diagnostic integrity vs. patient access).  
       **No** → Proceed to Step 3.  
     - *Why*: Direct evidence of the funding loop. Values decision required (arbitrary coding vs. care needs).  

  3. **Check prevalence against referrals/waitlists**  
     - *Question*: Did CDE prevalence increase ≥20% from last quarter, while total referrals and waitlist counts changed ≤5%?  
     - *Data*: Quarterly coded CDE cases, referral counts, waitlist totals.  
     - *Sufficient answer*: **Yes** → Flag "diagnostic drift"; proceed to Step 4.  
       **No** → Proceed to Step 5.  
     - *Why*: Rising prevalence without external demand suggests coding expansion or criterion creep.  

  4. **Audit automated screener output**  
     - *Question*: Did the screener flag ≥25% of CDE patients without criterion symptoms, but with demographic/service history matches (e.g., "age 18–24, prior anxiety Dx")?  
     - *Data*: Review 20 random screener-flagged CDE cases for symptom absence (using intake notes).  
     - *Sufficient answer*: **Yes** → Proceed to Step 5.  
       **No** → Proceed to Step 5.  
     - *Why*: Screener errors may compound looping (trains on prior notes, propagating bias).  

  5. **Assess session use (if outcome data available)**  
     - *Question*: Do CDE patients use ≥20% more sessions than non-CDE patients with similar severity (e.g., matched referral urgency), without better outcomes?  
     - *Data*: Session counts, discharge notes (if outcome scales exist, use them).  
     - *Sufficient answer*: **Yes** → Proceed to Step 6.  
       **No/Insufficient data** → **Stop: No revision**.  
     - *Why*: Overuse without benefit may indicate the category is being stretched.  

  6. **Final decision point**  
     - If Steps 1, 3, 4, or 5 flagged → **Propose narrowing criteria** (e.g., stricter symptom thresholds).  
     - If Step 2 flagged → **Hand to management** (values conflict).  
     - If no flags → **Stop: No revision**.  

  **Stopping Rules**  
  - **Stop with "No revision"**: At Step 5 if outcome data is missing/negative, or no flags arise.  
  - **Stop and hand to management**: At Step 2 (explicit funding motive) or if narrowing criteria in Step 6 would defund patients (values issue).  
  - **Stop with "Insufficient evidence"**: If sample sizes are small (<20 cases) or data missing.  

  ---

  ### Procedure Applied to Three Quarters  
  ***Quarter 1 (Baseline)***  
  - **Data**: Intake notes show diverse symptom descriptions (e.g., "endless TikTok at night," "can’t stop checking emails"). Prevalence: 5% of intakes. Referrals/waitlists steady. Screener not yet active.  
  - **Audit**:  
    - Step 1: No verbatim criterion mimicry (0% of notes). → Step 3: Prevalence +3% (normal fluctuation). → Step 5: No outcome data. → **Stop: No revision**.  
  - **Conclusion**: Category behaves as "indifferent condition." No evidence of looping.  

  ***Quarter 2***  
  - **Data**: Prevalence ↑40% (from 5% to 7% of intakes). Referrals flat (+1%), waitlists flat. Intake notes: 50% of CDE cases use verbatim criteria (e.g., "persistent compulsive engagement per CDE B.2"). Session notes: "Coded CDE to secure 8 sessions" in 15% of records.  
  - **Audit**:  
    - Step 1: Yes (50% verbatim mimicry). → Step 2: Yes (explicit funding motive). → **Hand to management**.  
  - **Conclusion**: Prevalence is **not evidence** of rising cases. The funding loop has contaminated coding. Narrowing criteria might cut patients off from sessions—a values decision for management (e.g., decouple diagnosis from funding).  

  ***Quarter 3***  
  - **Data**: Prevalence ↑10% (to 7.7%). Referrals ↑2%, waitlists ↑3%. Screener flags 30% of CDE patients without symptoms but with "demographic matches" (e.g., "college student, prior ADHD Dx"). Intake notes show mixed language.  
  - **Audit**:  
    - Step 1: No (10% verbatim, below threshold). → Step 2: No explicit funding notes. → Step 3: Prevalence rise <20% → No flag. → Step 4: Yes (screener errors confirmed). → Step 5: No outcome data. → **Stop: No revision** (but flag screener for retraining).  
  - **Conclusion**: Screener loop detected (automation propagating bias), but no evidence CDE criteria need revision.  

  ---

  ### What the Procedure Cannot Do  
  1. **Prove causation**: It flags risks but cannot confirm if changes are due to looping, societal trends, or bias (e.g., no control group).  
  2. **Capture implicit motives**: Relies on explicit documentation (e.g., cannot detect unconscious clinician bias).  
  3. **Resolve values conflicts**: Defers to management for funding-access trade-offs.  
  4. **Predict long-term effects**: Audits react to quarterly data; cannot model future societal impact.  
  5. **Validate the category itself**: Does not assess if CDE is "real"—only if it is stable or looping.  

  **Final Output**: Quarterly report with: (1) Audit outcomes (no revision, propose narrowing, hand to management), (2) Data summary, (3) Annotated risks (e.g., "screener bias," "funding loop").
