     - It's the end of the year (routine annual check).

  But the query says we are applying to every quarter. So in the procedure, we do step 4 every quarter? We have the data. Let's assume we can sample 20 cases per quarter.

  So in the third case (which we can call Quarter X):
  - Step 1: No.
  - Step 2: No.
  - Step 3: Prevalence up 5%, referrals up 5% → no flag.
  - Step 4: We check and find 30% of a sample of 20 flagged cases lack symptoms → Go to step 5.
  - Step 5: Outcome data? If available, check. If not, we have evidence of a technical issue with the screener. This is not a looping effect of human kinds per se, but a machine learning bias. We would then retrain the screener (technical fix) and do not revise the diagnostic criteria. But note: the screener's bias might be due to it learning from past notes that were already looped? We cannot tell. We treat as a separate issue. So we do not go to step 6 for criteria revision but flag for IT to adjust the screener.

  Therefore, step 6 is only reached if we have evidence from step 1, 3, 4, or 5 that suggests the diagnostic category itself is looping (not just the screener). We adjust:

