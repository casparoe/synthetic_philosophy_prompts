prompt: |-
  Hey — I'm taking a rational choice / decision theory class this term and the prof said I could run one 50-minute recitation for my section on the Allais paradox and the independence axiom. About 18 people, mostly sophomores, mix of econ and phil majors. She wants them to actually feel the pull of the violation rather than just watch her write numbers on the board, so I need a real activity, not a mini-lecture with a handout.

  Constraints: no cash (department thing), but I'm allowed one extra-credit point and a $20 bag of genuinely good chocolate as a prize, so the stakes can be small but real. I've got a projector and a whiteboard. No phones or laptops during the choice part.

  Here's the wrinkle. We did the standard pair in lecture:

  Problem 1: A = $1M for sure, vs B = 10% chance of $5M / 89% chance of $1M / 1% chance of $0
  Problem 2: C = 11% chance of $1M / 89% chance of $0, vs D = 10% chance of $5M / 90% chance of $0

  Most of the room takes A and D, and that combination is supposed to clash with independence, since A and B share the whole 89% branch and C and D share the whole 89% branch. After class the prof floated her own variant: take Problem 1 and replace the sure thing with a 99% chance at $1M and a 1% chance at $0, so A* = 99% $1M / 1% $0 against the same B. She says this is the cleaner test because it 'washes out the certainty effect' and leaves you with just the independence violation.

  I think that's wrong, but I can't fully talk myself through it. Once you leak that 1%, isn't B first-order stochastically dominant over A*, so the pair stops testing independence and just tests whether people will violate dominance? And I have no idea what the same leak does to Problem 2 — does the leaky version of problem 1 and the leaky version of problem 2 end up being the same comparison, in which case there's no pattern left to violate? Or is there something the leak does isolate that the 100% version masks?

  What I want from you:

  1. A runnable 50-minute activity for those 18 people: rules, materials, how the lotteries actually get resolved without money (dice? a bingo cage? a deck of cards?), how you record choices publicly without making anyone feel dumb for picking the 'wrong' one, and a payoff scheme using the chocolate and the extra-credit point.
  2. A timeline with minutes.
  3. A debrief that maps concrete moments in the room onto the independence axiom — especially the move where you split the probabilities up and show the 89% branch is identical in A and B, and the point where the violation becomes a money pump. I had an idea of letting people trade their tickets after they choose: is that actually the money pump argument, or is it just a market and I'd be testing something else? Tell me if it earns its ten minutes. I want them to hit the problem before I name it.
  4. An honest verdict on my prof's leaky variant: what would it even be evidence of if somebody still picked A* over B? Should I include it in the session, and if so, where — as a trap, as the moment the money pump lands, or not at all?
  5. What will predictably go wrong the first time I run this (people who don't really get percentages, one loud guy anchoring the whole room, the chocolate being too small to change behavior, someone pointing out that $1M and $5M aren't real), and what the activity just can't do — the part I'll have to say out loud myself.

  At the very end, give me your bottom line on the leaky variant in a fixed form: either \answer{isolates} or \answer{does not isolate}. One or the other, no hedging, and nothing after it.
reasoning: |-
  Hmm, the user is a teaching assistant preparing a recitation on the Allais paradox and independence axiom. They need an interactive activity for 18 students, using chocolate and extra credit as incentives since real money isn't allowed. The professor suggested a "leaky" variant where the sure thing becomes 99% to test independence without the certainty effect, but the user suspects this might turn it into a dominance violation test instead.

  First, I need to design a 50-minute session. The standard Allais paradox involves two choice pairs that reveal inconsistent preferences when people choose A over B but D over C. The independence axiom says identical probability branches shouldn't affect the choice. The user wants students to experience this violation viscerally.

  For the activity: I'll use a deck of cards since it's simple and tactile. Students will make choices anonymously by writing on cards to avoid embarrassment. The lottery resolution needs to be public and fair - drawing cards for probabilities seems ideal. The payoff uses chocolate (high-value) and extra credit (low-value) to create meaningful but small stakes.

  The timeline should be tight: 5 min setup, 15 min for Problem 1 choices and resolution, 15 min for Problem 2 and resolution, then 15 min debrief. Recording choices anonymously on the board preserves privacy while allowing aggregation.

  The debrief is crucial. I'll visually decompose the lotteries to show the identical 89% branch, then demonstrate how trading choices exposes the money pump argument - this makes the violation tangible. The money pump segment is worth keeping because it concretizes the theoretical violation.

  Now the leaky variant: replacing 100% $1M with 99% $1M/1% $0. The user is right - this fundamentally changes the test. In the modified Problem 1 (A* vs B), B now dominates A* stochastically (same $0 risk but B offers higher upside). Choosing A* over B wouldn't violate independence - it would violate dominance, which is irrational. In Problem 2, the identical modification makes C and D identical to the original C and D since they already had the 89% $0 branch. So the leaky version tests different things and shouldn't be included in the core activity.

  Bottom line: The leaky variant does not isolate the independence violation. It confounds it with dominance. The answer must be \answer{does not isolate}.

  Potential pitfalls: Students might not grasp percentages, so I'll use visual aids. A dominant student could sway others - anonymous choices prevent this. Chocolate being insufficient? The extra credit point anchors seriousness. "Not real money" objections? I'll acknowledge it's a model. The activity can't derive utility theory - that requires lecture.

  Final structure: Standard Allais pairs with card draws, anonymous choices, money pump demonstration via trading, then clear debrief linking to independence. The leaky variant appears only as a footnote if time permits, with a warning about dominance.
answer: |-
  Here's a complete 50-minute recitation plan focused on making the Allais violation visceral, with a clear verdict on the leaky variant.

  **Activity Title:** *The Lottery Lab: When Your Choices Betray You*

  **Materials:**  
  - 1 standard deck of cards + 2 jokers (54 cards total)  
  - 18 small blank cards (for student choices)  
  - Whiteboard markers (4 colors)  
  - Projector with simple slides (see below)  
  - $20 bag of premium chocolate (e.g., Ghirardelli squares)  
  - 1 extra-credit point (pre-authorized)  
  - Hat or bowl for drawing cards  

  **Mechanics:**  
  - **Probabilities:** Deck = 54 cards. Map percentages to cards:  
    - 1% = 1 card (e.g., Ace of Spades = "bad outcome")  
    - 10% = 5 cards  
    - 11% = 6 cards  
    - 89% = 48 cards  
    - 99% = 53 cards  
  - **Outcomes:**  
    - "$0" = *No chocolate, no extra credit*  
    - "$1M" = *1 chocolate square*  
    - "$5M" = *1 chocolate square + 1 extra-credit point*  
  - **Choice Recording:** Students write "A/B" or "C/D" **anonymously** on blank cards. Tally on board under covers (e.g., "Problem 1: ? A, ? B"). Reveal totals only after all choices.  

  **Timeline (50 mins):**  
  1. **Setup (5 mins):**  
     - Project rules: "Decide fast, no discussion. Choices are binding. One real draw per problem."  
     - Show card→outcome mapping. Emphasize: 1 chocolate = "$1M", chocolate+point = "$5M".  
     - *Why this works:* Small stakes preserve rationality pressure while avoiding department issues.  

  2. **Problem 1: Original "Sure Thing" (12 mins):**  
     - Project:  
       - **A:** 100% chance of **$1M** (All 54 cards = 1 chocolate)  
       - **B:** 10% **$5M** / 89% **$1M** / 1% **$0**  
     - Students write **A or B** anonymously. Collect cards, tally hidden.  
     - **Public Draw:** Shuffle deck. Draw one card:  
       - If red suit: Outcome for **ALL** who chose A (1 chocolate each)  
       - If black suit: Resolve B (draw again: Ace Spades = $0, 5 specific cards e.g., Kings = $5M, else $1M).  
     - *Why this works:* One draw resolves all fairly. Anonymity prevents shame.  

  3. **Problem 2: Original "Riskier" Pair (12 mins):**  
     - Project:  
       - **C:** 11% **$1M** / 89% **$0**  
       - **D:** 10% **$5M** / 90% **$0**  
     - Repeat choice/tally process.  
     - **Public Draw:** Draw one card for all:  
       - Ace Spades + 47 blacks = **$0** (89%)  
       - Remaining 6 reds = **$1M** for C-choosers, **$5M** for D-choosers if a "King" is drawn.  
     - *Anticipated result:* Most choose A (safe) then D (higher upside). Record tallies.  

  4. **The "Money Pump" Trade (8 mins):**  
     - Announce: "You can now **trade your chosen lottery ticket** with a partner for 10 seconds. Find someone who made the opposite choice in Problem 1."  
     - After chaotic trading: "Who traded A for B? B for A?" (Hands up).  
     - **Debrief hook:** "If you picked A but traded for B... you paid to switch from A to B. But in Problem 2, you likely picked D over C. Why pay to *avoid* B in Problem 1 but *prefer* it in Problem 2?"  
     - *Why this works:* Trading simulates the pump. The cognitive clash is immediate.  

  5. **Whiteboard Debrief (13 mins):**  
     - Reveal Problem 1 & 2 tallies. Circle the A+D combo.  
     - **Visual Decomposition (key move):**  
       - Draw 2 decision trees (color-coded):  
         - *Problem 1:* Split A and B into "89% branch" (green) + "11% branch" (yellow).  
           - A: 89% $1M + 11% $1M  
           - B: 89% $1M + 11% (10/11 $5M + 1/11 $0)  
         - *Problem 2:* C and D share "89% branch" (green, $0) + "11% branch" (yellow):  
           - C: 89% $0 + 11% $1M  
           - D: 89% $0 + 11% (10/11 $5M + 1/11 $0)  
       - **Hammer:** "The green 89% branch is **identical** in A and B. The green 89% branch is **identical** in C and D. If you ignored identical branches (Independence Axiom), you’d choose A over B **only if** you chose C over D. But you didn’t. Why?"  
     - **Money Pump Link:** "If you preferred A > B but D > C, I can 'pump' chocolate from you: Charge you to switch from A to B (Problem 1), then charge again to switch from D to C (Problem 2), but C is objectively worse than A! This creates a cycle."  

  ---

  **Your Prof's Leaky Variant: The Verdict**  
  - **The flaw:** In Problem 1, replacing 100% $1M with 99% $1M / 1% $0 (A\*) makes B **stochastically dominant** over A\*:  
    - B gives $1M with ≥89% (same as A\*’s 99% minus the shared 89%) AND a 10% shot at $5M.  
    - Choosing A\* over B isn’t an independence violation—it’s a **dominance violation** (irrational).  
  - **In Problem 2:** The leaky version changes nothing! C and D already have 89% $0. Adding 1% $0 to the "$1M" branch in C is redundant.  
  - **If someone picks A\* over B:** It suggests error (misunderstanding dominance) or an irrational certainty effect *for 99%*. It **does not cleanly test independence**.  
  - **Bottom line:** Include it only as a *post-reveal trap*:  
    - After debriefing the original paradox, say: "Some think removing certainty clarifies things. Let’s test: A\* (99% $1M / 1% $0) vs. B (same as before)."  
    - When (nearly) all pick B, ask: "Why is this different? Because here, B *dominates* A\*. The 1% 'leak' turns a rationality *test* into a rationality *requirement*."  

  \answer{does not isolate}  

  ---

  **Predictable Problems & Mitigations:**  
  1. **Percentages confuse:** Use card counts visibly (hold up 5 cards for 10%). During draws, spread cards on a table.  
  2. **Loud guy anchors:** Anonymous choices prevent this. If someone blurts, say: "Interesting! But write your *own* preference."  
  3. **Stakes too low:** The extra-credit point amplifies the "$5M" allure. Award chocolate immediately during draws—sensory reward matters.  
  4. **"Not real money!" objection:** Pre-empt it: "We’re modeling a *structural* flaw in choice. If your brain contradicts itself here, it would with $1M too."  
  5. **Post-trade confusion:** Keep the trade window short (10 sec). Use it only to trigger dissonance, not as a perfect pump simulation.  

  **What the Activity Can’t Do:** It won’t *prove* expected utility is wrong—it shows a descriptive violation. You must verbally link the visual branch decomposition to the independence axiom’s formal statement: *"If L₁ > L₂, then (p)L₁ + (1-p)L₃ > (p)L₂ + (1-p)L₃."*  

  **Final Flow:**  
  - Original Allais (25 mins) → Trade frenzy (8 mins) → Debrief with decomposition (12 mins) → **Leaky variant as trap** (5 mins, if time).  
  - End with: "So—did you *feel* the pull of the paradox? That’s the independence axiom failing in your gut."  

  This balances experimentation, revelation, and rigor while making the violation unmistakable.
