prompt: |-
  hey — i want a spec before I read any more of the knowing-how literature, becuase I keep reading a paper, nodding along, and then realizing I never decided what I was asking the theory to do.

  where I'm coming from: I don't care about Ryle vs. the intellectualists purely for its own sake. I want a theory good enough for two jobs. First, to tell me whether I'm being loose or literally correct when I say a system trained by gradient descent "knows how" to translate a language, or write passable code, or play a decent endgame — and relatedly whether it knows how in the same sense a person does. Second, to say what a teacher is actually trying to produce in a student. If knowing-how is just knowing-that under a practical mode of presentation, then teaching starts to look like telling, and my gut says that's wrong, but I can't say what's lost. So: write me the desiderata for an account of knowing-how that would be fit for those jobs, with the case behind each requirement.

  The cases I want it to earn, not just accommodate: the expert who can't say how she does it (the chicken-sexer sort of case, or someone who recognizes a face she can't describe); the beginner with the complete set of instructions who gets it right slowly and falls apart the moment something deviates; the pianist who temporarily can't move her hands but hasn't forgotten; the person who currently succeeds but only by luck; the aging coach who can no longer perform but can still see what you're doing wrong, next to the athlete who performs beautifully and can't teach a thing — I don't want these collapsed into one phenomenon if they aren't one. Also: knowing-how decays with disuse and comes back faster on relearning than it was acquired, which knowing-that doesn't do, and I want to know whether an account has to explain that profile or is allowed to shrug at it. Also whether the skill is one thing or many: cycling versus cycling on ice, operating versus operating with unfamiliar instruments on unusual anatomy. And whether the account has anything to say about the complements that aren't about producing a success — knowing how not to, knowing how to lose gracefully. And how know-how gets transmitted by demonstration and correction when nothing propositional seems to change hands.

  For each requirement say what it's a requirement on the strength of, and mark which ones are non-negotiable and which are just prejudices of one camp — I especially want you to flag any pair you think can't be jointly satisfied (my hunch is that "don't reduce knowing-how to an ability" and "explain the decay-and-relearning data, which looks like it's about dispositions" are on a collision course, but you tell me). Then tell me which single requirement does the most damage to the most popular views, and close with a short go at how a Ryle-style anti-intellectualism and the intellectualist reply each fare against the list. Weight the thinking on the criteria and their cases, not the scoring.

  Oh and: write it as one continuous blob of prose, like an email — no headings, no bullet points, no bold, no tables, and please don't number the desiderata, carry them with phrases like "the next thing I'd ask" instead, even though I know that's harder.
reasoning: |-
  Okay, let me unpack this user request carefully. They're clearly deep in philosophical territory about know-how theories but frustrated with abstract debates detached from concrete applications. Two main needs stand out: evaluating AI capabilities and understanding pedagogical processes. The tone suggests urgency - they've been burned before by theories that collapse under real-world cases.

  Hmm... their case list is impressively thorough. Chicken-sexers, rusty pianists, lucky guessers - each seems chosen to stress-test different aspects of know-how. That decay-and-relearning point about skill atrophy is particularly sharp; most philosophical accounts ignore such empirical realities. And the transmission question ("how demonstration teaches without propositions") cuts straight to their teaching concern.

  I notice they're wary of false unifications. They want distinctions preserved between adjacent phenomena - the coach who can't perform versus the athlete who can't teach shouldn't be lumped together. That suggests any viable theory needs fine-grained taxonomy powers. Also noteworthy: they suspect internal tension between non-dispositional accounts and skill decay data. Smart catch - most papers don't confront that.

  For structure, I'll thread requirements through their two core use cases (AI assessment/pedagogy) while weaving in their test cases organically. The chicken-sexer illustrates tacit knowledge, the beginner with instructions shows procedural vs declarative disconnects, etc. Must resist academic formatting urges - no bullet points even where they'd fit. Phrases like "another box to check" can pace the flow.

  Biggest landmine: that disposition question. If know-how isn't an ability, how explain why unused skills fade but rebound faster? Maybe a "latent structural disposition" concept could bridge Rylean concerns with relearning data. But I shouldn't solve it here - just flag the tension per their request.

  Most damaging requirement? Probably the transmission criterion. Both intellectualists (who reduce know-how to propositions) and pure dispositionalists (who reject mental states) stumble explaining how demonstration teaches. That might be the kingmaker issue.

  For scoring theories: Ryle handles decay data well but chokes on "knowing how not to" cases; intellectualists ace propositional transmission but fail chicken-sexers. Neither fully resolves the expert/beginner gap. Final emphasis should stay on criteria weighting - their "gut says teaching isn't telling" deserves more philosophical respect than it usually gets.
answer: |-
  Right, let's carve out the spec properly then, before diving back into the trenches. Your frustration is spot-on – without knowing what job the theory needs to do, it's easy to get swept along by internal debates. We need functional criteria rooted in your goals, using those concrete cases as the anvil to hammer them out. Here’s the shape I think the account needs to take, built from the ground up of what you need it *for*:

  First and foremost, the theory **must distinguish genuine know-how from mere successful performance, especially in non-human systems and across variations in context.** This is non-negotiable because your core question hinges on whether attributing "know-how" to an AI is literal or loose. Cases like the lucky guesser (who succeeds but only by fluke) and the beginner who crumbles under deviation scream that success alone isn't sufficient. An AI might translate this sentence correctly due to statistical pattern-matching without "knowing how" in any robust sense, especially if it fails catastrophically on a slightly novel structure. Similarly, we need to know if the AI's "knowledge" decays meaningfully with disuse (like human skill atrophy) or simply involves forgetting facts – the relearning speed profile you mention is a crucial differentiator here. If know-how *isn't* fundamentally dispositional in some way, explaining that decay-and-rapid-reacquisition curve becomes very awkward, perhaps impossible. So, while we shouldn't *reduce* know-how *merely* to a current ability (the aging coach who can't perform but can teach proves that), the theory absolutely must account for the dispositional *profile* – how know-how manifests as reliable, adaptable dispositions under normal conditions, even if those dispositions can be temporarily masked (like the pianist with paralyzed hands who hasn't *forgotten*). This dispositional aspect isn't optional window dressing; it's central to the phenomenon you care about (performance under pressure, decay, transfer).

  Next, the theory **must accommodate the dissociation between practical competence and articulable knowledge.** The chicken-sexer and the face-recognizer are your non-negotiable cases here. If an account collapses know-how entirely into knowing-that (even under a "practical mode"), it fails these spectacularly. The expert *does* it flawlessly but cannot say *how* in propositional terms. Conversely, the beginner with the complete instruction manual *has* the propositions but lacks the know-how – they execute slowly, rigidly, and fail under deviation. This dissociation is fatal to simple intellectualism and demands a theory where the core competence isn't *constituted* by propositional knowledge, even if it often interacts with it. Relatedly, the theory should illuminate *why* telling often isn't sufficient for teaching – the transmission criterion. If demonstration and correction ("do it like *this*", "no, not quite, adjust your wrist *here*") transmit know-how without necessarily conveying new propositions, the theory must explain what *is* being transmitted or developed. Is it a non-propositional practical grasp? A refinement of embodied dispositions? A restructuring of procedural memory? Ryle’s ghost nods vigorously here.

  A third requirement, tightly linked to the first two, is that the theory **must handle the granularity and context-dependence of skills.** It can't treat "knowing how to cycle" as a monolithic thing if someone can cycle on dry pavement but not on ice, or if a surgeon is adept with familiar tools but flounders with new ones or on unusual anatomy. This speaks directly to your AI question: does the translation model "know how to translate" if it only handles common language pairs but fails on rare dialects or poetic ambiguity? The theory needs resources to distinguish core competence, adaptable skill, and context-specific mastery. It also relates to the "complements" you mention – knowing how not to panic, knowing how to lose gracefully. Are these separate skills, aspects of a broader practical intelligence, or something else? An account that can't parse this granularity won't tell you if the AI has *robust* know-how or just a narrow, brittle capacity.

  Fourth, the theory **must account for the persistence of know-how despite temporary inability to perform.** The paralyzed pianist is the key case. Her know-how isn't lost; it's inaccessible due to a peripheral block. This strongly suggests that know-how involves an enduring state (cognitive, dispositional, neural) that *underlies* and *explains* the ability when conditions allow, rather than being identical to the ability itself. This requirement pushes against a pure Rylean dispositionalism that might equate know-how *only* with the present ability. Similarly, the aging coach retains the critical eye – the diagnostic aspect of the know-how – even while losing the physical execution. The theory needs to explain this partial retention and dissociation within a skill set.

  Fifth, and critically for your teaching concern, the theory **must illuminate what is being cultivated in the learner.** If know-how isn't just knowing-that, then teaching isn't just telling. Your gut is likely reacting to the impoverishment of reducing pedagogy to information transfer. The theory should clarify what the teacher is aiming to foster: is it developing reliable embodied dispositions? Building a practical understanding? Cultivating flexible procedural schemas? Training the perceptual sensitivity of the chicken-sexer? This directly informs how we understand the *process* of teaching – the role of demonstration, guided practice, correction, and perhaps even the transmission of tacit norms ("this *feels* right"). The beginner with the manual highlights that *internalizing* propositions isn't enough; something more must be integrated.

  Now, about the tensions: You've hit a major one squarely. **Requiring that know-how isn't *merely* a current ability (to handle the pianist/coach) while also requiring that it explains the distinctive dispositional *profile* (decay, relearning speed, context sensitivity) is the central tightrope.** Pure Intellectualism struggles mightily with the dispositional profile (decay/relearning, context sensitivity, chicken-sexers) and the non-propositional transmission. Pure Rylean dispositionalism struggles with the persistence through temporary inability and risks collapsing know-how too directly into current performance. The requirement doing the most damage to popular views is likely the **dissociation requirement (chicken-sexer + beginner with manual) combined with the dispositional profile (decay/relearning)**. Simple Intellectualism is shattered by the chicken-sexer. Crude Dispositionalism is strained by the paralyzed pianist and struggles with the *structure* of skills and teaching.

  How do they fare?
  *   **Rylean Anti-Intellectualism (Dispositional Focus):** Excels at the dispositional profile (decay, context sensitivity), the dissociation cases (chicken-sexer, beginner), and non-propositional transmission. It resonates with "knowing how not to" as cultivating dispositions. It struggles most with the **persistence requirement** (paralyzed pianist, aging coach's knowledge) – how can a disposition persist if the ability is blocked? It also risks under-describing the *cognitive/neural* structures underlying skills and can be vague on skill granularity and the *content* of teaching beyond "training dispositions."
  *   **Intellectualism (Knowledge-that + Mode/Practicality):** Excels at the **persistence requirement** (knowledge states endure) and potentially skill granularity via propositional content. It aligns easily with the idea that the coach retains propositional knowledge. It utterly collapses on the **dissociation requirement** (chicken-sexer, beginner). It struggles profoundly with the **dispositional profile** – why would *propositional* knowledge decay with disuse and relearn faster? It reduces teaching to telling, failing your gut check and the transmission criterion. It struggles to explain the "how" in "knowing how not to" beyond propositional advice.

  The viable path likely lies in a sophisticated middle ground: know-how as a *structured, enduring cognitive/dispositional state* (explaining persistence and underlying the ability), realized in procedural memory/sensorimotor schemas (explaining dissociation from declarative knowledge and tacit aspects), which *manifests* as context-sensitive, reliable dispositions (explaining performance profile, decay, relearning), and which can be cultivated through guided practice and demonstration (explaining teaching). This state isn't reducible to propositions, nor is it *just* the present ability. It’s the infrastructure that reliably generates the ability under the right conditions. Earning *all* your cases, especially the decay data and the transmission puzzle, will be the ultimate test for any contender. The spec is strict, but necessary if the theory is to do the real work you need.
