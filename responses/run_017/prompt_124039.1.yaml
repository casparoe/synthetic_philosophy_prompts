answer: |-
  Based on your gut verdicts and the patterns across your eight scenarios, I've distilled a unified principle that explains all your cases without contradictions. The core insight is that **average-case reasoning is insufficient when failures could compound, propagate, or be intentionally triggered at scale, making risk non-linear and hard to bound with independent draws**. This splits into two key conditions that "flip the switch" to worst-case reasoning. I'll state the principle precisely, map it to your cases, resolve your open questions, and address the "expected value in disguise" concern.

  ---

  ### **Deployment Checklist Principle**  
  **Use worst-case reasoning if either of these holds:**  
  1. **Adversarial Exposure**: Failures can be systematically searched for, triggered, or amplified by intelligent adversaries (e.g., attackers, users, or the model itself).  
  2. **Uncontained Systemic Risk**: Failures are correlated (not independent) *and* the deployment lacks *per-event* mitigation (e.g., human review, sandboxing, or reversibility), allowing failures to cascade or affect many users simultaneously.  

  **Else, average-case reasoning with monitoring is sufficient.**  

  **Corollary for non-stationarity**: If the system drifts (e.g., due to retraining or feedback loops), past average-case metrics are invalid—use continuous monitoring + worst-case if either condition above applies to the *current* deployment.  

  ---

  ### **How It Explains Your Eight Cases**  
  | Case | Your Verdict | Principle's Explanation | Conditions Triggered |  
  |------|--------------|-------------------------|----------------------|  
  | **1. Chest X-ray + radiologist review** | Average-case fine | Failures caught per-event (radiologist review = per-event mitigation). No adversarial/search risk (medical images aren't "attacked"). | Neither: **Avg-case** |  
  | **2. Coding agent w/ write access, no per-diff review** | Worst-case-ish | Adversarial potential (users might submit malicious requests; agent could introduce subtle bugs). Systemic risk (bad code can cascade; failures correlated if model has bias). No per-event mitigation. | Both: **Worst-case** |  
  | **3. Model w/ root running fixed script** | Average-case fine | Harm contained (fixed script = per-event mitigation). No adversaries (isolated system). Failures independent/uncorrelated. | Neither: **Avg-case** |  
  | **4. Plain chatbot, millions of users** | Worst-case-ish | Adversarial exposure (users actively probe for manipulation/sycophancy). Systemic risk (harmful behaviors can spread/correlate across users; no per-message mitigation). | Both: **Worst-case** |  
  | **5. Human sysadmins w/ root** | Average-case fine | Humans have built-in "per-event mitigation" (spot checks, references, ethics). Failures are independent (no systemic correlation). Not adversarial (assuming no targeted attacks). | Neither: **Avg-case** (not special pleading—humans have inherent containment) |  
  | **6. Tutoring model @ 100k scale** | Average-case less reassuring | Systemic risk (correlated failures—e.g., model teaches same error to all students). *But* no adversarial exposure, and harm is contained/reversible (non-catastrophic). Mild worry due to correlation, but **not worst-case** because missing Condition 1 (no active search) and harm bounded. | Only systemic risk → **Avg-case + heightened monitoring** (not full worst-case) |  
  | **7. Spam filter under attack** | Worst-case-ish | Adversarial exposure (spammers actively search for failures). Systemic risk (failures correlated under attack). | Both: **Worst-case** (despite low stakes) |  
  | **8. Model retrained weekly** | Past avg-case invalid | Non-stationarity invalidates past metrics. If *current* deployment has adversarial/systemic risk (e.g., like Case 4), use worst-case. Else, use avg-case with live monitoring. | **Corollary**: Requires reassessment under current conditions |  

  **Why your "search-and-copy" stab almost worked**:  
  - Adversarial exposure ≈ "search" (Condition 1).  
  - Uncontained systemic risk ≈ "copy" (correlation) + lack of mitigation (Condition 2).  
  - The fix: Your stab missed that **correlation alone isn't enough**—it needs *uncontained* impact (e.g., Case 6 has correlation but contained harm). Also, it didn't handle non-stationarity (now covered by the corollary).  

  **Key clarifications from your notes**:  
  - **Not raw severity**: Case 3 (high stakes) is fine because harm is contained; Case 4 (low per-event stakes) needs worst-case due to adversarial + systemic risks.  
  - **Humans vs. AI**: Humans (Case 5) have inherent "containment" (ethics, accountability), so no systemic risk. AI (Case 2) lacks this, triggering worst-case.  
  - **Scale alone isn't enough**: Case 6 (100k users) only mildly worries you because correlation exists, but harm is bounded and non-adversarial → no worst-case.  

  ---

  ### **Predictions for Your Open Setups**  
  | Setup | Principle's Verdict | Reasoning |  
  |-------|---------------------|-----------|  
  | **(a) Agent writes/runs tests in sandbox, human approves merges** | **Average-case** | Sandbox = per-event mitigation (contains test failures). Human merge approval = per-event mitigation for deployments. No adversarial exposure (assuming no malicious inputs). Systemic risk low (failures isolated). |  
  | **(b) Open-weight release, anyone can fine-tune** | **Worst-case** | Adversarial exposure (malicious actors can search for harmful fine-tunes). Systemic risk (failures correlated across malicious uses; no containment). |  
  | **(c) Frozen model, 5 internal users, narrow task** | **Average-case** | No adversaries (internal users). Scale tiny (failures uncorrelated). Harm contained (narrow task). |  

  ---

  ### **Your Flip-Flop: Do Evals Need Worst-Case Reasoning?**  
  **Answer**: **Yes, if the deployment requires worst-case reasoning.**  
  - If adversarial/systemic risks exist (Conditions 1 or 2), evals must actively probe worst-case scenarios (e.g., adversarial testing, stress tests, or measuring correlated failures).  
  - Else, average-case evals (e.g., random test sets) suffice.  
  - *Why?* Average-case evals underestimate failure modes under adversarial/search or correlated conditions. For example:  
    - Case 2 (coding agent): A 99% pass rate on random code ignores targeted attacks or systemic flaws.  
    - Case 4 (chatbot): Average toxicity scores miss coordinated manipulation.  

  ---

  ### **Is This Just Fat-Tailed Expected Value in Disguise?**  
  **Short answer**: **No—it's about *when* to assume fat tails, not how to calculate them.**  

  **Expected value (EV) reasoning** treats risk as `probability × impact`, which works if failures are independent and stationary. It fails when:  
  - Adversaries *create* fat tails (e.g., spammers turn a 1% failure rate into 100% for attacked inputs).  
  - Correlation breaks independence (e.g., a tutoring model error affecting 100k students simultaneously).  
  - Non-stationarity makes the distribution unknowable (e.g., retraining drifts risk profiles).  

  **This principle identifies cases where EV is unreliable** due to adversarial pressure, uncontained correlation, or drift. Crucially, it doesn't prescribe *how* to model worst-case risk (e.g., via bounds, stress tests, or tail metrics)—it flags when to switch from average-case to those methods.  

  **Observation to distinguish them**:  
  - In **Case 3 (fixed script)**, EV works because failures are independent, stationary, and have known impact.  
  - In **Case 7 (spam filter)**, the *same* EV calculation (e.g., "average loss per failure = $1") is misleading—adversaries force worst-case scenarios where failures cluster and costs explode.  

  **Use in checklist**: This principle is **operational**, not theoretical. It tells you *when* to demand adversarial testing, containment safeguards, or correlation checks—without needing philosophical debates about probability distributions.  

  ---

  ### **Final Checklist Language**  
  ```markdown
  ### MODEL DEPLOYMENT RISK ASSESSMENT  
  **Step 1: Assess conditions**  
  - [ ] **Adversarial Exposure**: Could adversaries (users, attackers, or the model itself) systematically trigger failures?  
  - [ ] **Uncontained Systemic Risk**: Could failures correlate *and* lack per-event mitigation (e.g., no human review, sandboxing, or reversibility)?  

  **Step 2: Select reasoning**  
  - If **either condition is met**, use **worst-case reasoning** (adversarial testing, correlation analysis, stress tests).  
  - Else, **average-case reasoning** with monitoring is sufficient.  

  **Step 3: Handle non-stationarity**  
  - If the model/environment drifts (e.g., retraining, feedback loops):  
    - Reassess Conditions 1–2 for the *current* deployment.  
    - Past average-case metrics are invalid—use continuous monitoring.  

  **Step 4: Evaluation protocol**  
  - If worst-case reasoning is required, evals *must* include worst-case probes (e.g., adversarial examples, failure correlation tests).  
  ```  

  This covers all your cases, resolves the human-AI discrepancy, and avoids "special pleading." For your team, focus on the binary conditions—they're the switch.
