  - voucher_wrinkle: string, at most 70 words: whether the heterogeneity of the voucher helps or hurts, and which step it bears on.
  - residual_question: string, the single thing your diagnosis leaves unexplained.
  - confidence: number between 0 and 1.

  Ensure the JSON is valid and unaccompanied by commentary.
