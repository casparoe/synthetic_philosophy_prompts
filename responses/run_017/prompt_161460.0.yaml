  | avoidant-belief   | Self-deception requires holding a belief because of unconscious motivation to avoid the discomfort of forming a contrary belief. | NO            | YES         | 1,2,3,5,6,7,8,9       | 4 (thinness), Remark         | Woman avoids opening bank statements due to debt worry, believes finances stable. | Self-deception excludes those consciously aware of their avoidance and motivation for it. |
