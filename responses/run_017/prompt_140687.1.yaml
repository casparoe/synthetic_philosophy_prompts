  ### Key Editorial Commitments  
  1. **Replaced "Restorative Justice" Scope**: The leaf requires diversion (Q1=B) and short duration (Q2=A), excluding theorists who tolerate prison. *Why?* Most legislative staff engaging with restorative frameworks oppose confinement unless irreplaceable.  
  2. **Deleted Pure "Abolitionism"**: Folded into L8 (Decarcerator). *Why?* Abolitionist policy prescriptions (e.g., defunding prisons) are captured by minimal intake/duration; philosophical abolition exceeds legislative scope.  
  3. **Denied "Desert-Only" as Coherent**: No leaf allows desert to override all consequences. *Why?* In practice, desert theorists (e.g., Michael Moore) accept constraint-based roles for deterrence/rehabilitation; Q6 (trade-off) and Q3 (coercion) collapse pure desert into retributivist bounds (L1).  

  ---  
  The instrument forces clarity: It predicts that a "tough" staffer voting for Halden-style facilities likely holds a **Risk-Management (L3)** or **Humane-Absolutist (L9)** view, while one extending preventive confinement is **Incapacitation (L3)** or **Expressive (L6)**. The Halden-vs.-mass-incarceration divide splits most sharply on Q4 (apartments as punishment) and Q6 (harshness-duration trade-off).
