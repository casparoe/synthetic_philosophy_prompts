  | "Machinery [...] lets one man do the work of ten, so the other nine are thrown out [...] that permanent pool of the jobless is what Marx called the reserve army of labour: it holds everyone's wages down" | mostly accurate | Machinery displaces workers, creating a relative surplus population ("reserve army") that suppresses wages. Marx emphasizes this is systemic, not just about individual machines. | Keep this core idea but clarify: "Machines push us out of work, creating a pool of desperate labor that drags wages down for all." |
  | "machinery was a weapon in the class struggle, used deliberately to break the resistance of skilled workers by making them replaceable" | accurate | Marx explicitly describes machinery as a tool to crush strikes, deskill artisans, and increase capital's control over labor in *Capital, Vol. I*. | Your character can confidently use this as-is; it's textbook Marx. |
  | "as knowledge and science become the real productive force [...] labour time stops being the source of wealth, so [...] the less profit there is to be made, and capitalism destroys itself" | half-right | Marx (*Grundrisse*) posits that automation ("general intellect") makes labor time obsolete as wealth's measure, creating crises. But profit decline stems from the falling rate of profit theory (rising capital/labor ratio), not efficiency alone. | Clarify: "When machines replace labor, profit *rates* fall because value comes from human work. The system eats itself alive trying to fix this." |

