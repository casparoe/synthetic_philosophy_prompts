  - Shared map and shared board of slow variables.
  - Each generation, teams have a fixed labor budget to spend on actions.
  - Structural actions (terracing, granaries, etc.) have delayed effects (2-3 generations later).
  - Event cards each generation (epidemic, harvest, etc.) with severity conditioned on current slow variables (so same event has different impact).
  - Archive rule: each generation, each team adds one chronicle line to a shared sheet. Teams vote for the most memorable entry (prestige). Actual score is based on slow variables (population, welfare).
  - Prestige and outcome scores are separate and displayed to show divergence.
  - Mid-game (generation 6): each team seals a prediction (one sentence) on what will determine the final ranking.
  - End-game: teams are given only the chronicle sheet (slow variables covered) and must write a causal explanation for each polity's outcome.
  - Debrief: map game mechanics to historical concepts without using the vocabulary until the end.

