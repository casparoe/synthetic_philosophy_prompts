  ### Game Design: **"The Valley of Generations"**

  This game simulates 10 generations (250 years) of a society in a shared valley, emphasizing how slow-moving structural constraints shape outcomes more than episodic events. Teams manage a small polity, balancing immediate event responses with long-term investments, while confronting biases in historical recording.

  ---

  ### **Core Mechanics & Rules**
  1. **Teams & Setup**
     - 4 teams (3-4 players each). Each team is a polity starting in a distinct location: **Uplands**, **Lowlands**, **Coast**, and **Forest Edge**.
     - **Starting Resources**:  
       - Population: 10  
       - Labor budget per generation: 4 units  
       - Slow variables (all start at 5/10):  
         - **Soil Quality** (SQ): Food production, resistance to famines.  
         - **Forest Health** (FH): Building materials, resistance to fires.  
         - **Harbor/Route Capacity** (HR): Trade, resistance to blockades.  
         - **Defense Level** (DL): Resistance to raids/conflicts.  
     - **Shared Map**: Valley with river, coast, forests, and hills (visually distinct zones).  
     - **Materials**:  
       - Team tracker sheets (population, labor, slow variables, delayed actions).  
       - Event deck (16 cards, see table below).  
       - Shared "Chronicle of Ages" poster (for archive entries).  
       - Prestige tokens (for voting).  
       - Sealed prediction envelopes (for mid-game).  

  2. **Generation Sequence** (8 minutes per generation)  
     1. **Apply Delayed Actions** (1 min):  
        - Actions taken 3 generations prior now affect slow variables (e.g., "Terracing" in Gen 3 boosts SQ in Gen 6).  
     2. **Labor Allocation** (2 min):  
        - Teams spend labor on **structural actions** (2 labor each, effect in 3 gens):  
          - *Terracing*: +1 Soil Quality.  
          - *Reforestation*: +1 Forest Health.  
          - *Harbor Dredging/Road Building*: +1 Harbor/Route Capacity.  
          - *Fortification*: +1 Defense Level.  
        - *Unspent labor* is saved for event mitigation.  
     3. **Event Draw & Resolution** (3 min):  
        - Draw an event card. Severity scales with relevant slow variable (see lookup table).  
          - *Example*: A "Drought" with base pop loss 5:  
            - Team A (SQ=8): Loss = 5 × (1 - 8/10) = **1 pop**.  
            - Team B (SQ=2): Loss = 5 × (1 - 2/10) = **4 pop**.  
        - Mitigate with unspent labor: 1 labor reduces pop loss by 1 or boosts gain by 1.  
     4. **Chronicle & Prestige Vote** (2 min):  
        - Each team writes **one sentence** in the shared chronicle (e.g., "Gen 4: Drought struck; we lost 3 people").  
        - Teams vote for the "most memorable" entry (not their own). Winner gains 1 Prestige Point.  

  3. **Mid-Game (Generation 5)**  
     - Teams seal a prediction: *"What will determine the final ranking?"* (e.g., "Prestige votes" or "Population size").  

  4. **End-Game (Generation 10)**  
     - **Compute Final Scores**:  
       - **Actual Score**: Population × [1 + (SQ + FH + HR + DL)/40] (max 20).  
       - **Prestige Score**: Total votes won.  
     - **Archive Phase**:  
       - Cover the slow-variable board. Teams receive *only the chronicle* and write causal explanations for each polity’s outcome.  
     - **Reveal & Compare**:  
       - Uncover actual scores, open predictions, and contrast with chronicle-based explanations.  

  ---

  ### **Event Lookup Table**  
  Events are drawn from a deck of 16 cards (10 negative, 6 positive). Severity is calculated as:  
  - **Negative events**: `Base Effect × (1 - Relevant SV/10)`  
  - **Positive events**: `Base Effect × (Relevant SV/10)`  

  | Event            | Base Effect | Relevant SV | Special Rules                          |
  |------------------|-------------|-------------|----------------------------------------|
  | **Drought**      | Pop loss 5  | Soil Quality| If pop loss ≥3, SQ -1.                |
  | **Raid**         | Pop loss 4  | Defense Level| None.                                |
  | **Epidemic**     | Pop loss 4  | Soil Quality| None.                                |
  | **Earthquake**   | Pop loss 3  | N/A         | HR -2, DL -2. Mitigate SV loss: 1 labor/SV point. |
  | **Bumper Harvest**| Pop gain 3  | Soil Quality| Spend labor: +1 pop gain per labor (max +2). |
  | **Trade Windfall**| Pop gain 2  | Harbor/Route| Spend labor: +1 pop gain per labor (max +2). |
  | **Forest Fire**  | Pop loss 2  | Forest Health| FH -2.                               |
  | **Silting Harbor**| HR -2       | N/A         | If HR≤3, pop loss 2.                 |
  | *... (6 more)*   |             |             |                                        |

  **Example Event Resolution (Gen 3 - Team: Lowlands)**  
  - **Action Phase**: Spends 4 labor on *Terracing* (delayed SQ+1 in Gen 6) and *Fortification* (delayed DL+1 in Gen 6).  
  - **Event Draw**: "Drought" (base loss 5). SQ=4 → Pop loss = 5 × (1 - 4/10) = 3. No labor left → lose 3 pop.  
  - **Chronicle**: *"Gen 3: Invested in farms and forts; drought killed 3."*  
  - **Outcome**: Population: 10 → 7.  

  ---

  ### **Materials & Printables**  
  1. **Team Tracker Sheet**  
     - Grid for slow variables (SQ, FH, HR, DL) and population by generation.  
     - "Delayed Actions" log (e.g., "Gen 3: Terracing → +1 SQ in Gen 6").  
  2. **Event Cards**  
     - 16 cards with event name, base effect, relevant SV, art (e.g., quake illustration).  
  3. **Shared Map**  
     - Simple valley map with zones labeled (Uplands, Coast, etc.).  
  4. **Chronicle of Ages**  
     - Poster with 10 sections (1 per gen), space for 4 entries each.  
  5. **Prestige Tokens & Scoreboards**  
     - Tokens for voting; boards displaying Prestige vs. Actual Scores.  

  ---

  ### **Timeline (110 Minutes)**  
  - **0–5 min**: Setup (assign teams, distribute materials).  
  - **5–85 min**: Generations 1–10 (8 min/generation).  
    - *Gen 5 (Mid-Game)*: 2 extra min for predictions.  
  - **85–90 min**: Final scoring (calculate Actual Scores).  
  - **90–100 min**: Archive Phase (teams write explanations using chronicle only).  
  - **100–110 min**: Debrief (reveal scores, open predictions, discuss).  

  ---

  ### **Pitfall Mitigation**  
  1. **Teams Ignoring Structure & Winning on Events**  
     - **Rig the Numbers**: Make events catastrophic without high SVs (e.g., base pop loss 5+). Positive events require high SVs for gains (e.g., Bumper Harvest gives 0 pop if SQ=0).  
     - **Tested Balance**: In simulations, teams ignoring structure lost 30–50% pop by Gen 10; investing teams grew 20–40%.  
     - **Debrief Focus**: Ask, *"Did high-prestige teams survive? Why did some polities thrive despite few events?"*  

  2. **Prestige Vote Becomes Joke Contest**  
     - **Rule**: Chronicle entries must be *factual* (e.g., "Gen 4: We built roads" not "Gen 4: LOL, raiders owned John").  
     - **Incentive**: Award bonus Prestige for "most insightful entry" (instructor’s discretion) to encourage depth.  

  3. **Slow Variables Treated as Optimizable Resources**  
     - **Mechanic**: Cap SV growth (max 10) and tie events directly to SV thresholds (e.g., SQ≥8 needed for pop growth).  
     - **Debrief Question**: *"Could you have survived a Gen 8 earthquake with DL=2? Why did investing early matter?"*  

  4. **Archive Phase Feels Like a Memory Test**  
     - **Design**: Chronicle has *only* event-focused entries (e.g., no SV changes recorded).  
     - **Debrief Contrast**: Compare teams’ chronicle-based explanations with the hidden SV board. Ask, *"Why did the chronicle miss the real causes?"*  

  ---

  ### **What the Game Cannot Stage**  
  - **Timescale & Constitutive Constraints**: Students won’t *feel* 250 years. The game mechanizes "slow causes," but not how structures *constitutively shape* choices (e.g., "Why did no one consider industrialization?").  
  - **Agency within Structures**: The lookup table shows constraints but can’t replicate how people internalize structures as "the way things are."  

  **Address in Debrief**:  
  > *"In the game, you chose to terrace or not—but in reality, a society in a mountainous valley might not even imagine seafaring. Structures aren’t just slow causes; they define what options seem possible. The *longue durée* isn’t a speed, it’s a worldview."*  

  ---

  ### **Scalability**  
  - **60-Minute Version**:  
    - 6 generations (5 min each = 30 min).  
    - Mid-game at Gen 3.  
    - Archive phase + debrief: 20 min.  
  - **8 Students**:  
    - 2 teams of 4. Reduce SV interdependence (e.g., remove shared events).  
    - Use an AI "observer" for chronicle voting.  

  ---

  ### **Debrief Script (Last 10 Minutes)**  
  1. **Reveal Scores**: Show divergence between Prestige (event-driven) and Actual Scores (structure-driven).  
  2. **Map Mechanics to Concepts**:  
     - *Delayed Actions* → "Why did terracing in Gen 3 save you in Gen 6? *Causes beyond one lifetime are invisible to actors.*"  
     - *Event Lookup Table* → "Why was the same drought a crisis for Team A and a footnote for Team B? *Events are conditioned by structures.*"  
     - *Prestige Vote* → "Why does the chronicle record raids but not soil quality? *Sources bias history toward the eventful.*"  
     - *Sealed Predictions* → "Why did most predictions fail? *We test theories against outcomes, not narratives.*"  
  3. **Student Synthesis**: Ask, *"In your own words, what shapes history more: events or environments? What can’t we see when we focus on the dramatic?"*  
  4. **Vocabulary Reveal**: End with: *"You’ve described the *longue durée* (structures), *conjoncture* (events), and the *attribution gap* (chronicle vs. reality)."*  

  ---
  This design forces confrontation with structural causality, source bias, and the attribution gap. Playtest with colleagues to refine event balance, but the core loop—delayed rewards, SV-conditioned events, and the chronicle’s bias—will achieve your pedagogical goals.
