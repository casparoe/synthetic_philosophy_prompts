            - Bumper Harvest (x2): base gain 3, affected SV: FS; can spend labor to add up to 2 extra gain (1 labor per 1 gain)
            - Trade Windfall (x2): base gain 2, affected SV: TN; can spend labor to add up to 2 extra gain
            - Peaceful Reign (x1): base gain 1, affected SV: DL (if DL is high, you don't need it? so maybe condition on something else? or unconditionally?); we'll say base gain 2 and no SV condition? Or condition on TN? Let's say: base gain 2, and then actual gain = 2 * (TN/10) and can spend labor to add extra.
            - Mineral Discovery (x1): base gain 1, affected SV: RS; then actual gain = 1 * (RS/10) and can spend labor to add extra. Also, RS increases by 1 (if they spend labor? or always?) -> Let's say: RS increases by 1 regardless, and they get population gain = 1 * (RS/10) and can spend labor to add extra population gain.

