            - Flood (x1): base loss 3, affected SV: Infra? (we don't have that) -> let's use DL? or FS. We'll say FS. And also reduces FS by 1 if the actual loss is>=2.
            - Famine (x1): base loss 6, affected SV: FS
            - Forest Fire (x1): base loss 2, affected SV: RS; also reduces RS by 2.

