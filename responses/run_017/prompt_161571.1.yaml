prompt: |-
  I co-teach PHIL 347 (Rules, Law, and Self-Reference) with Dana, and a third of the course grade rides on a semester-long, Nomic-style game the students run: a set of mutable rules amendable by majority, a handful of entrenched rules amendable only unanimously, a rotating student adjudicator whose rulings on points of order can be appealed, and — this is the bit I added after last year's edition turned into a pure majoritarian steamroller — a hard cap of three proposal actions per player for the whole term, so that agenda-setting is genuinely scarce and coalitions have to decide what to spend themselves on. I sit on our department's Experiential Learning Committee, the body that signed off on running the game for credit and that doubles as the appeal route when a dispute affects grades, and we now have exactly such a dispute: two students have appealed the week-7 adjudicator's ruling upholding something called Rule 41, and we vote Tuesday morning. I need a memo I can circulate Monday night, so please draft it.

  The four clauses that matter are these. Entrenched Rule 108: "Any mutable rule may be amended or repealed by a majority vote of all players." Entrenched Rule 110: "No rule adopted by majority may purport to amend or repeal an entrenched rule; such a rule is void, unless the offending portion can be severed, in which case only that portion is void." Mutable Rule 112: "A proposal is adopted if it receives a majority of the votes cast." And then, in week 6, a coalition passed this by 12–8 under Rule 112: "Rule 41. Notwithstanding any other rule, no proposal is adopted unless it receives two thirds of the votes cast. This rule may be amended or repealed only by a unanimous vote of all players, and any rule to the contrary is void." In week 7 a rival bloc's redistributive scoring proposal failed 11–9 — a majority, but not two thirds — and that is what got appealed. Note that Rule 41 does two separable things: it raises the adoption threshold for everyone's future proposals (I've been calling this other-entrenchment), and it shields itself from ordinary majority repeal (self-entrenchment). Dana's line is that the whole thing is void in toto, since a mutable rule passed by majority cannot touch the operation of entrenched Rule 108, and that the clean reading of 110 makes severability unavailable where the self-entrenchment clause is the rule's whole point. Marco's line is that this is precisely what the unit on constituent power is for, that a majority which can never bind itself isn't a constituent power at all, and that voiding 41 retroactively rewrites the record of week 7 in a way we can't undo. The reliance wrinkle is real: three players who still had proposal slots left say they deliberately sat on them in weeks 7 and 8 because they believed nothing could clear two thirds, and if we now strike 41 they've lost irreplaceable actions they would have spent.

  I'm leaning toward something messier than either of them — roughly, that the threshold clause is validly enacted (it just amends mutable Rule 112, which is exactly what majorities are for) while the self-entrenchment clause is the part that overreaches, with some kind of conditional validation or re-ratification requirement to settle whether the two-thirds bar survives — but I can't shake Marco's point about constituent power, and I also can't tell whether my instinct to sever is just squeamishness about voiding a rule that eleven people are currently living under. What I want from you is the memo itself, addressed to the committee: recommend one course of action, in the imperative, with a time frame that fits inside a semester that ends in five weeks; say what happens to the week-7 vote and to the appellants' proposal; say whether your remedy reaches back or only forward; and propose whatever standing default we should announce for the rest of the term so the same fight doesn't recur every session (I've been toying with a sunset, under which any self-entrenching clause lapses unless re-ratified at its own threshold within two sessions, but say if that's incoherent). Give Marco's strongest argument the honest treatment it deserves rather than a footnote, and don't hide behind the observation that this is only a game — I know it's only a game, and the grading consequences are still real. End the memo with a "Verdict:" line giving the bottom line in one sentence, and then a final line reading \answer{...} containing your recommendation in twelve words or fewer.
reasoning: |-
  We are drafting a memo for the Experiential Learning Committee regarding an appeal of a ruling in the PHIL 347 Nomic game. The dispute centers on Rule 41, which was passed by a 12-8 majority (under the then-existing Rule 112 requiring a majority) and which (a) changed the adoption threshold to two-thirds for all future proposals and (b) entrenched itself by requiring unanimity for its amendment or repeal and declaring any contrary rule void.

  The key rules are:
  - Entrenched Rule 108: "Any mutable rule may be amended or repealed by a majority vote of all players."
  - Entrenched Rule 110: "No rule adopted by majority may purport to amend or repeal an entrenched rule; such a rule is void, unless the offending portion can be severed, in which case only that portion is void."
  - Mutable Rule 112 (at the time): "A proposal is adopted if it receives a majority of the votes cast."

  Rule 41: "Notwithstanding any other rule, no proposal is adopted unless it receives two thirds of the votes cast. This rule may be amended or repealed only by a unanimous vote of all players, and any rule to the contrary is void."

  The problem: A proposal in week 7 failed 11-9 (which is a majority but not two-thirds). The adjudicator upheld Rule 41, so the proposal failed. The students who proposed it are appealing. The committee must decide whether Rule 41 is valid, and if not, what happens to the week-7 proposal and the game going forward.

  Arguments:
  - Dana: Rule 41 is void in its entirety because it attempts to amend entrenched Rule 108 (by making it harder to amend mutable rules) and because the self-entrenchment clause is the whole point, so severability is not available.
  - Marco: Voiding Rule 41 retroactively would rewrite history and ignore the constituent power of the majority. Also, there is reliance: three players held back proposals because they believed the two-thirds threshold was in effect.

  My leaning: Sever the rule. The threshold clause (changing the adoption threshold) is valid because it amends mutable Rule 112 (which is mutable and can be amended by majority). The self-entrenchment clause is void because it attempts to entrench a mutable rule (making it harder to amend) and that violates entrenched Rule 108 and 110. However, we must address Marco's point about constituent power and the reliance interest.

  Proposal for the memo:

  1. Address the committee and state the issue.
  2. Recap the facts and the rules.
  3. Analyze the arguments.
  4. Propose a resolution that:
     - Validates the threshold clause (so the two-thirds requirement stands) but strikes the self-entrenchment clause (so Rule 41 can be amended by majority, as per Rule 108).
     - Addresses the week-7 vote: Since Rule 41 was in effect at the time (and we are upholding the threshold clause), the week-7 proposal failed because it didn't meet two-thirds. However, if we are only upholding the threshold clause prospectively, then the week-7 vote would have passed under the old rule (majority). But note: the threshold clause was in effect at the time of the vote and the vote was taken under that rule. We must decide the retroactive effect.

  But note: If we strike the self-entrenchment clause, then Rule 41 becomes an ordinary mutable rule. But the threshold clause was in effect at the time of the week-7 vote, so the vote failed. However, if we are voiding the self-entrenchment clause, then the threshold clause might be seen as having been validly enacted? But we are not voiding the entire rule.

  My proposal: 
  - The threshold clause of Rule 41 is valid and was in effect from the moment it was passed. Therefore, the week-7 vote was correctly decided under Rule 41: the proposal failed because it did not get two-thirds.
  - The self-entrenchment clause is void ab initio because it violates entrenched Rule 110 (it purports to make Rule 41 harder to amend than Rule 108 allows, and Rule 108 is entrenched). Therefore, Rule 41 is now an ordinary mutable rule and can be amended or repealed by majority vote.

  This means that going forward, the two-thirds threshold remains unless amended by majority. But note: Rule 41's threshold clause amended Rule 112. So now Rule 112 is effectively replaced by Rule 41's threshold clause. We should clarify that.

  To avoid confusion, we can say:
  - Rule 41's threshold clause is valid and has amended Rule 112 (or replaced it). So the current rule for adoption is two-thirds of votes cast.
  - Rule 41's self-entrenchment clause is void and of no effect. Therefore, Rule 41 (or the threshold rule, which is now part of the rules) can be amended by majority.

  But note: Rule 41 as written also says "any rule to the contrary is void". Without the self-entrenchment clause, that phrase might be problematic? We can interpret that as being part of the voided clause.

  Time frame: We are in week 9? The semester ends in five weeks. We need a resolution that doesn't require re-running every vote.

  For the week-7 vote: It stands as failed because the threshold rule was in effect and the proposal didn't meet two-thirds. We are not changing that.

  Reliance: The three players who held back proposals because they thought nothing could clear two-thirds might have acted on that belief. But note: if we remove the self-entrenchment clause, then the two-thirds threshold can be changed by majority. So they might now use their proposal slots to try to change the threshold back to majority. That would be a valid use. However, they have lost the opportunity to propose in weeks 7 and 8. But that loss is because of their reliance on the self-entrenchment clause being valid? Actually, they relied on the two-thirds threshold being in place and hard to change. Now, without the self-entrenchment, it's easier to change. So they might have acted differently.

  But we cannot turn back time. We must be forward-looking.

  Proposed remedy: 
  - We uphold the adjudicator's ruling that the week-7 proposal failed because it did not meet the two-thirds threshold. 
  - Going forward, Rule 41's threshold clause remains in effect, but without the self-entrenchment. Therefore, it can be amended by a majority vote.

  To address the reliance: We cannot give back the spent weeks, but we can note that the players can now use their remaining proposal slots (if any) to propose changing the threshold. Also, we can set a standing default to prevent future self-entrenchment attempts.

  Standing default: I propose that any rule that attempts to self-entrench (i.e., require more than a majority for its own amendment or repeal) is void unless it is passed by the threshold it seeks to impose for its own amendment. But note: that might not be feasible. Alternatively, we can say that self-entrenchment clauses are disallowed entirely because they conflict with Rule 108 and 110. But that might be too rigid.

  Alternatively, the sunset idea: Any self-entrenching clause lapses unless re-ratified at its own threshold within two sessions. But that might be complex. Instead, we can simply state that self-entrenchment clauses are void per Rule 110, so they should not be included. And if they are, they will be severed.

  But note: Rule 110 only forbids amending or repealing entrenched rules. Self-entrenchment of a mutable rule doesn't directly amend an entrenched rule? It attempts to make a mutable rule harder to amend than Rule 108 allows. Rule 108 says mutable rules can be amended by majority. So a rule that says "this mutable rule can only be amended by unanimity" is in conflict with Rule 108. Therefore, by Rule 110, it is void because it purports to amend Rule 108 (by creating an exception). Or more directly, it violates the entrenched Rule 108.

  Thus, Rule 110 applies: the self-entrenchment clause is void because it purports to amend Rule 108 (by making an exception for this rule). And because it's the whole point? But we can sever.

  So in the memo, we recommend:

  - The threshold clause of Rule 41 is valid and was effective from its adoption. Therefore, the week-7 vote was correctly decided: the proposal failed because it did not meet two-thirds.
  - The self-entrenchment clause of Rule 41 is void and of no effect. Therefore, Rule 41 (now meaning the threshold requirement) is an ordinary mutable rule and can be amended or repealed by a majority vote.
  - Going forward, any rule that includes a self-entrenchment clause (or any clause that attempts to make its amendment or repeal harder than a majority) will have that clause automatically void under Rule 110. The rest of the rule will stand if severable.

  For the sunset idea: It might be overcomplicating. We can just state the standing rule as above.

  Verdict: We deny the appeal and uphold the adjudicator's ruling on the week-7 vote. However, we rule that the self-entrenchment clause of Rule 41 is void, so Rule 41 can now be amended by majority.

  But note: the appeal is about the week-7 vote. The appellants wanted the week-7 proposal to be considered adopted. But under our ruling, it fails because the threshold clause was valid. So we deny the appeal.

  But the committee is also the appeal route for disputes affecting grades. How does this affect grades? The week-7 proposal was a redistributive scoring proposal. If it had passed, it would have affected the scores. But it didn't, so it doesn't. The appellants are the ones who proposed it? They are appealing because they think Rule 41 is invalid and their proposal should have passed by majority.

  Our ruling: Rule 41's threshold clause was valid, so the proposal needed two-thirds and failed. Therefore, the grade implications are that the week-7 proposal remains failed.

  Now, Marco's constituent power argument: The majority should be able to bind itself. But in this system, the entrenched rules are the higher law. Rule 108 and 110 are entrenched, so they constrain what a majority can do. The majority cannot change the entrenched rules by a simple majority. Similarly, they cannot create a rule that is effectively entrenched without following the entrenchment procedure (unanimity). So the constituent power is exercised when they act within the rules.

  But Marco is right that voiding Rule 41 retroactively would cause problems. However, we are not voiding it entirely, only the self-entrenchment clause. And the threshold clause remains. So the majority's will (to require two-thirds) is upheld. They just cannot make that rule harder to change than the entrenched rules allow.

  Therefore, we can address Marco by saying that the majority did bind itself to a higher threshold for adoption of rules, but it did not have the power to bind itself to a higher threshold for amending that particular rule without following the entrenchment procedure (unanimity). So the constituent power is preserved by requiring that any entrenchment must be done by the unanimous procedure.

  Now, the memo structure:

  MEMO
  To: Experiential Learning Committee
  From: [Your Name]
  Date: [Monday night]
  Subject: Recommendation on PHIL 347 Rule 41 Appeal

  Introduction:
  This memo addresses the appeal of the week-7 adjudicator's ruling in the PHIL 347 Nomic game. The ruling upheld Rule 41, which requires a two-thirds majority for proposal adoption and self-entrenches. The appeal concerns a redistributive scoring proposal that received 11 of 20 votes (a simple majority but not two-thirds) and was therefore ruled failed. We must decide the validity of Rule 41 and the status of the week-7 vote.

  Background:
  The game rules include:
  - Entrenched Rule 108: Mutable rules may be amended or repealed by a majority vote.
  - Entrenched Rule 110: A rule passed by majority that purports to amend or repeal an entrenched rule is void (severably).
  - Mutable Rule 112 (at the time): A proposal is adopted by a majority of votes cast.

  In week 6, Rule 41 was adopted 12-8. It states:
  "Notwithstanding any other rule, no proposal is adopted unless it receives two thirds of the votes cast. This rule may be amended or repealed only by a unanimous vote of all players, and any rule to the contrary is void."

  In week 7, a proposal failed 11-9. The adjudicator ruled that Rule 41 required two-thirds and thus the proposal failed.

  Arguments on Appeal:
  - Dana contends that Rule 41 is entirely void because it attempts to amend entrenched Rule 108 by making mutable rules harder to amend, and the self-entrenchment clause is the core of the rule, making severability impossible.
  - Marco contends that voiding Rule 41 retroactively would undermine the constituent power of the majority and the stability of the game. He notes that three players relied on Rule 41 by not using their proposal slots in weeks 7 and 8, believing that no proposal could pass the two-thirds threshold.

  Analysis:
  Rule 41 has two clauses: (1) the threshold clause (requiring two-thirds for adoption) and (2) the self-entrenchment clause (requiring unanimity to amend Rule 41 and voiding contrary rules).

  The threshold clause amends mutable Rule 112, which is within the power of a majority under entrenched Rule 108. Therefore, the threshold clause is valid and was effective upon adoption.

  The self-entrenchment clause, however, attempts to make Rule 41 amendable only by unanimity. This conflicts with entrenched Rule 108, which states that any mutable rule may be amended by majority. Rule 110 provides that such a clause is void because it purports to amend an entrenched rule (Rule 108) by creating an exception. The clause is severable because the threshold clause can operate independently. The self-entrenchment clause was not the only purpose of Rule 41; the threshold change is independently significant.

  Regarding Marco's argument: The majority did exercise its constituent power by validly changing the adoption threshold. However, the self-entrenchment clause overreaches because it attempts to create a new entrenchment level without following the required unanimous procedure. The stability of the game is preserved by upholding the threshold clause. The reliance interest is real but does not justify upholding an invalid clause. The players who held back proposals can now use their remaining slots to propose reverting to majority rule, which requires only a majority vote (since the self-entrenchment clause is void).

  Resolution:
  - The appeal is denied: The week-7 proposal failed because it did not meet the two-thirds threshold required by the valid threshold clause of Rule 41.
  - The self-entrenchment clause of Rule 41 is void ab initio. Therefore, Rule 41 is now an ordinary mutable rule and can be amended or repealed by a majority vote.
  - Going forward, any rule that includes a clause attempting to self-entrench (i.e., require more than a majority for its own amendment or repeal) will have that clause automatically void under Rule 110. The rest of the rule will stand if severable.

  Time Frame: This ruling is effective immediately. The game continues with the current two-thirds adoption threshold unless and until amended by majority vote.

  Verdict: Uphold the week-7 ruling that the proposal failed, but void the self-entrenchment clause of Rule 41, making the threshold amendable by majority.

  \answer{Deny appeal; void Rule 41 self-entrenchment; two-thirds threshold stands, amendable by majority.}
answer: |-
  **MEMORANDUM**  
  To: Experiential Learning Committee  
  From: [Your Name], PHIL 347 Co-Instructor  
  Date: [Monday Night]  
  Subject: Recommendation on Appeal of Rule 41 in PHIL 347 Nomic Game  

  ### Introduction
  This memo addresses the appeal of the week-7 adjudicator’s ruling in the PHIL 347 Nomic game, which upheld Rule 41 and resulted in the failure of a redistributive scoring proposal (11–9, majority but not two-thirds). The appeal implicates the validity of Rule 41, enacted in week 6 by a 12–8 majority under then-applicable Rule 112 (requiring majority adoption). Rule 41: (1) imposes a two-thirds supermajority for all proposal adoptions (“threshold clause”), and (2) self-entrenches by requiring unanimity for its amendment/repeal and voiding contrary rules (“self-entrenchment clause”). The dispute turns on whether Rule 41 violates entrenched Rules 108 and 110, and how to resolve reliance interests (e.g., three players withheld proposals based on Rule 41). The committee must decide the appeal, clarify the rules retroactively and prospectively, and prevent recurrence.  

  ### Background: Key Rules  
  - **Entrenched Rule 108**: “Any mutable rule may be amended or repealed by a majority vote of all players.”  
  - **Entrenched Rule 110**: “No rule adopted by majority may purport to amend or repeal an entrenched rule; such a rule is void, unless the offending portion can be severed, in which case only that portion is void.”  
  - **Mutable Rule 112 (pre-Rule 41)**: “A proposal is adopted if it receives a majority of the votes cast.”  
  - **Rule 41**: “Notwithstanding any other rule, no proposal is adopted unless it receives two thirds of the votes cast. This rule may be amended or repealed only by a unanimous vote of all players, and any rule to the contrary is void.”  

  ### Arguments Summarized  
  - **Dana’s Position**: Rule 41 is void *in toto*. Its self-entrenchment clause purports to amend entrenched Rule 108 (by shielding Rule 41 from majority repeal), violating Rule 110. Severability is inappropriate because self-entrenchment is the rule’s “whole point.”  
  - **Marco’s Position**: Voiding Rule 41 retroactively ignores the “constituent power” of the majority and disrupts reliance (e.g., players withheld proposals assuming two-thirds was binding). A majority that cannot constrain itself is not sovereign; retroactive invalidation unreasonably rewrites week 7 outcomes.  
  - **Reliance Concerns**: Three players conserved proposal slots (weeks 7–8) believing Rule 41’s two-thirds threshold was binding. If Rule 41 is voided, they lose irreplaceable opportunities.  

  ### Analysis and Recommendation  
  I recommend **partial severance** of Rule 41: uphold the threshold clause as valid but void the self-entrenchment clause. This balances Rule 110’s constraints, Marco’s constituent-power argument, reliance, and game integrity.  

  1. **Threshold Clause (Two-Thirds Adoption) Is Valid**:  
     - The clause amends mutable Rule 112 (adoption threshold), which Rule 108 explicitly permits via majority vote. It does not “amend or repeal” an entrenched rule; it alters a mutable one. Thus, it is consistent with Rules 108 and 110.  
     - **Effect on Week-7 Vote**: The threshold clause was validly enacted in week 6. The week-7 proposal (11–9) failed because it did not meet two-thirds. The adjudicator’s ruling is upheld, and the appeal is denied. The proposal remains rejected.  

  2. **Self-Entrenchment Clause Is Void and Severable**:  
     - This clause purports to make Rule 41 amendable only unanimously, directly conflicting with entrenched Rule 108 (majority amendment for mutable rules). Rule 110 voids it as an impermissible amendment of Rule 108.  
     - **Severability Applies**: The threshold clause operates independently—it functions identically without self-entrenchment. While self-entrenchment was a strategic goal, it was not “the whole point”; the threshold change has standalone value (e.g., it altered voting behavior immediately).  
     - **Constituent-Power Argument (Marco)**: A majority can bind itself *within the bounds of higher-order rules*. Here, entrenched Rules 108/110 are the game’s “constitution,” requiring unanimity for new entrenchment (Rule 41’s self-entrenchment did not clear this bar). Upholding the threshold clause respects the majority’s will, while voiding self-entrenchment respects the rules’ hierarchy. Reliance is partially honored: the threshold clause stands, but players may now amend it by majority.  

  3. **Prospective Remedy and Standing Default**:  
     - **Rule 41 Going Forward**: The threshold clause survives as an ordinary mutable rule (amended Rule 112), requiring two-thirds for adoption. It is **amendable by majority vote** (per Rule 108), not unanimity.  
     - **Reliance Mitigation**: Players who conserved proposals (due to two-thirds) may use remaining slots to amend/revert Rule 41. No retroactive restoration of slots is feasible, but this forward-looking fix honors their expectations while correcting the overreach.  
     - **Standing Default for Self-Entrenchment**: To prevent recurrence, announce:  
       > “Any self-entrenching clause (requiring > majority for its own amendment/repeal) is void *ab initio* under Rule 110. Non-offending portions survive if severable.”  
       A sunset clause (e.g., self-entrenchment lapsing unless re-ratified) is **incoherent here**—it would still violate Rule 108 by imposing non-majority thresholds. Voidance *ab initio* is cleaner and aligns with Rule 110.  

  4. **Time Frame and Practical Effects**:  
     - **Immediate Effect**: This ruling applies **retroactively to week 6** for validity (threshold clause valid; self-entrenchment void) and **prospectively** for amendments. Week 7’s outcome stands.  
     - **Semester Timeline**: With five weeks left, this resolves the dispute without reopening past votes. Players may propose amendments to Rule 41’s threshold (now mutable) using existing slots.  

  ### Verdict  
  Deny the appeal; uphold the week-7 adjudicator’s ruling that the redistributive proposal failed. Rule 41’s two-thirds adoption threshold is valid and remains in effect, amendable by majority vote; its self-entrenchment clause is void.  

  \answer{Uphold week-7 failure; void Rule 41 self-entrenchment; two-thirds threshold stands, amendable by majority.}
