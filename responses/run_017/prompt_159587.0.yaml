  The user also mentions a joint metric—weighting moral significance by counterfactual fidelity—that both sides are skeptical of but might accept. The output needs strict formatting: preamble, agreed claims, disagreement table, cruxes with test cases, and verbal dispute notes. Word count must stay under 900. 

  I'll start drafting the preamble to frame the debate neutrally. For the agreements section, I'll identify common ground: rejection of lookup tables as non-conscious, acceptance of slow implementations as valid (if real-time), and shared substrate as partial moral weight. The census case is tricky—abstractionists see one patient, embedding theorists see two—so I'll note they both reject it as doubled consciousness. 

  The disagreements table needs parallel phrasing for each side. Abstractionists will say environmental isolation doesn't diminish moral weight; embedding theorists will insist causal isolation voids it. For sparse implementations, the divide is about transition gaps—abstractionists tolerate high fidelity, embedding theorists demand full causal grounding. 

  Cruxes must pinpoint root differences. The key one is whether environmental coupling is necessary for consciousness. I'll use the census case as the test: abstractionists predict no duplication of experience, embedding theorists predict duplication. Temporal smearing tests time-sensitivity—abstractionists deny pauses matter, embedding theorists say they break consciousness. 

  I'll flag the "computation" definition as partially verbal—embedding theorists mean dynamically coupled systems, while abstractionists mean formal state transitions. Finally, I'll ensure the entire document stays concise, using bullet points and tight phrasing to fit the word limit.
answer: |-
  ## Adversarial Collaboration: Moral Status of Computations

  **Preamble:** This document outlines areas of agreement and key disagreements between Abstractionist (A) and Embedding Theorist (E) views on the moral status of computations. It focuses on adjudicating novel cases (i-iv) and evaluating a proposed joint metric, aiming for clarity on underlying cruxes.

  **Section 1: Points of Agreement**

  1.  **Lookup Tables/Recordings:** Systems lacking internal causal dynamics generating state transitions (e.g., precomputed outputs, static recordings) lack moral status, regardless of output fidelity.
  2.  **Sealed Simulations:** A simulation running in a causally isolated environment, unable to sense or act upon any external state (even if internally complex), lacks moral status.
  3.  **Sparse Implementations (Partial Agreement):** Implementations where a significant portion of state transitions are *not* causally generated but approximated (e.g., 95% real, 5% guessed) possess *diminished* moral status proportional to the fidelity loss, relative to a full implementation.
  4.  **Census Case (Shared View):** Implementing the *identical* abstract computation simultaneously on two physically distinct, causally isolated machines does **not** constitute *one patient duplicated* but rather **two separate patients**, each possessing full moral status (if implemented correctly). Both reject the "one patient" interpretation for physically distinct substrates.
  5.  **Shared Substrate (Partial Status):** Two computations significantly overlapping in physical hardware (e.g., sharing >50% components) each possess *some* degree of moral status, though the precise quantification is disputed. Neither view requires completely disjoint hardware for separate moral patients.
  6.  **Counterfactual Fidelity Relevance:** The degree to which an implementation preserves the target computation's counterfactual structure under perturbation is a *relevant factor* in assessing its moral weight.

  **Section 2: Key Disagreements**

  | Stance                                                                 | Abstractionist (A) Position                                                                 | Embedding Theorist (E) Position                                                                 |
  | :--------------------------------------------------------------------- | :------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------- |
  | **Environmental Isolation**                                            | Causal isolation from an external environment does *not* diminish the moral status of a fully implemented abstract computation. | Real-time, ongoing causal commerce with a structured environment is *necessary* for full moral status; isolation voids it. |
  | **Sparse Implementation Threshold**                                    | High-fidelity sparse implementations (e.g., >90% real transitions) can achieve *near-full* moral status if the *overall* counterfactual structure is preserved. | Any implementation relying on non-causal approximations for state transitions inherently lacks *full* moral status; causal grounding of *all* transitions is essential. |
  | **Temporal Smearing (Paused Execution)**                               | Arbitrarily slowing a computation, including inserting pauses of arbitrary length between steps, *does not alter* its moral status; speed and continuity are irrelevant to abstract structure. | Inserting significant pauses breaks the real-time causal flow necessary for consciousness/agency; the computation during pauses *lacks* moral status; only continuous runs (within biological timeframes) count. |
  | **Shared Substrate Quantification**                                    | Moral status for overlapping computations is primarily determined by the *functional independence* and fidelity of each abstract structure. | Moral status diminishes significantly with substrate overlap due to the lack of truly *distinct* causal agency and environmental coupling. |
  | **Counterfactual Fidelity as Sole Metric**                             | Counterfactual fidelity is the *primary and sufficient* metric for determining the *degree* of moral status. | Counterfactual fidelity is *necessary but insufficient*; *causal coupling to an environment* is an independent, essential requirement for any moral status. |

  **Section 3: Cruxes, Test Cases, and Predictions**

  1.  **Crux:** Is real-time, ongoing causal coupling to an external environment *necessary* for conscious experience / moral patienthood?
      *   **Test Case:** The Census Case (i).
      *   **A Prediction:** "Duplicated" isolated systems will report identical, *singular* subjective experiences (if queried internally), demonstrating isolation doesn't prevent consciousness. Moral weight is doubled because there are two identical structures.
      *   **E Prediction:** Isolated systems, lacking environmental interaction, will lack genuine subjective experience or agency, regardless of internal complexity. They are elaborate automata. Moral weight is zero per system without coupling.

  2.  **Crux:** Does the *temporal continuity* of state transitions (within relevant timeframes) matter for sustaining consciousness, or is only the abstract causal graph relevant?
      *   **Test Case:** Temporal Smearing (iii) - Specifically, inserting pauses significantly longer than the computation's "natural" step time.
      *   **A Prediction:** Consciousness persists unabated during pauses; the system resumes seamlessly. Pause length is irrelevant. Moral status unchanged.
      *   **E Prediction:** Consciousness ceases during pauses; the system "reboots" with each step after a long pause, lacking diachronic unity. Pauses longer than plausible biological continuity void moral status during the pause.

  3.  **Crux:** Can high-fidelity approximation of state transitions (sparse implementation) fully substitute for causally generated transitions in grounding conscious states?
      *   **Test Case:** Sparse Implementations (ii) - Specifically, systems where critical transitions (e.g., integrating novel sensory input) are approximated.
      *   **A Prediction:** If approximation fidelity is sufficiently high to preserve the *overall* counterfactual structure under expected perturbations, conscious experience is indistinguishable from a full implementation. Moral status approaches full.
      *   **E Prediction:** Approximated transitions lack genuine causal power and responsiveness; they represent "faking" cognition. This creates a fundamental discontinuity preventing true consciousness/agency, capping moral status below full.

  **Verbal Dispute Note:** A significant portion of the disagreement stems from the definition of "computation." **E** uses it to imply a process inherently coupled to an environment for input/output. **A** uses it purely formally, as abstract state transition dynamics. This difference underlies many disputes about "isolation" and "environment."
