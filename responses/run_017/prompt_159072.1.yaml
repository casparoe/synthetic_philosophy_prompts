answer: |-
  Here is the speech, crafted for your voice and this complex moment. It rests on the two pillars you believe in, avoids the third, honors the collective while acknowledging Nora's shadow, and uses the **stone walls** of the mill itself as the anchoring image:

  ---

  **(Begin speaking)**

  Mayor, officers of the local, friends, neighbors, honored guests… standing here in this hall, breathing the air generations of workers breathed, looking out at faces that hold the history of this town in their bones… it’s humbling. We’re gathered to remember a moment a hundred years ago when the Foundry Street mill fell silent. Not silent like a Sunday, but silent with a terrible, deliberate power. The looms stopped. The clatter ceased. Four hundred men and women walked out those gates.

  We talk about strikes often as conflict, as a fight. And it was that. But let’s start with what it *really* was, deep down. It was a **refusal**. One person saying, “I cannot, I will not, work under these conditions today.” Not an act of aggression against the owner, or the foreman, or even the mill itself. Not an attempt to *prevent* someone else from working, or to smash the machines. It was simply turning away from the work. Choosing not to put your hands to the loom, not to lift that load, not to feed that machine. It was a withdrawal. A profound, personal act of saying "No." That’s the first thing. There’s a world of moral difference between refusing to do a thing yourself, and stopping someone else from doing it. What happened here began with that simple, powerful act of refusal: **“I will not.”**

  But that’s only half the story. Because what happened on Foundry Street wasn’t four hundred separate “I will nots,” whispered alone in the dark before dawn. It was four hundred voices rising together as one "No." It was that refusal becoming shared. People looked across the spinning room, across the weave shed, into faces lined with the same exhaustion, the same worry, the same spark of indignation, and they saw themselves. They saw they weren’t isolated refusals; they were connected. They made promises – not just to the cause, but *to each other*. “If you walk, I walk.” “If you stand firm, I stand beside you.” That promise, that bond forged in shared risk and shared hope – that’s what turned individual refusal into collective power. **They refused *together*.** They didn’t just happen to walk out at the same time; they walked out holding onto each other. That jointness, that solidarity, is the heart of what we commemorate. It wasn't just strength in numbers; it was strength in unity, in shared purpose. They became, for that time, one body, one will, standing on the line.

  This town was built on stone. The mill foundations, the canal walls, the tenements – all that hard, grey rock quarried from these hills. And the people who worked here? They had that stone in them too. Tough, enduring. But stone walls aren't built one rock at a time, dropped randomly. They're *fitted* together. Each stone relies on the one beside it, above it, below it. Take one away, the wall weakens. Push together, they hold firm against any storm. That’s the image I carry for those strikers: a human wall. Not a wall *against* the town, but a wall *for* each other. Built rock by rock, worker by worker, their refusal fitted together by shared purpose and mutual promise. That wall held for weeks, months. It changed things. It built the local that still stands today, right here in this hall. It built the shoulders we stand on.

  History, like stone, has its fissures. Our story here tonight is rightly focused on those who walked, who built that wall of refusal together. Their names are read, their courage honored – as it should be. But anyone who writes about this town, or grew up in it, knows history isn't a smooth wall. It has cracks. There were a handful, nine or so, who stayed inside that silence. My own great-aunt Nora was one of them. The family stories about why… they’re just whispers now. Fear? A sense of duty already ending? We’ll never truly know. What I do know is this: her presence inside, while that human wall stood outside, speaks to the terrible, tearing power of that moment. It reminds us that solidarity, for all its immense strength, is also fragile. It reminds us that courage can wear different faces, and fear is a heavy burden. It reminds us that even in a shared struggle, individuals can be pulled by loyalties that tear them apart. Her story doesn't diminish the wall; it shows us how hard it was to build, how precious it is when it holds. It shows the cost, the loneliness of standing *outside* that collective refusal, even if you’re still inside the mill.

  So tonight, we honor the wall. We honor the four hundred stones who fitted themselves together, who refused together, who endured together. We honor the promise they made, the bond they forged on the picket line – a bond that echoes in this union hall still. We honor the courage it took to say "No," and the even greater courage it took to say "No" together. Because that joint refusal, that solidarity, wasn’t just about wages or hours back then. It was about claiming dignity. About asserting that the worker is not just a pair of hands, but a person whose choice to work – or *not* to work – matters. That the power of "No," spoken together, can shape the world.

  The Foundry Street mill’s stones are still here. And the spirit of those who refused together, who built something lasting with their shared courage? That spirit is still here too. It’s in the walls of this hall. It’s in the history we remember tonight. Let it remind us of the enduring power of standing together, of refusing injustice not alone, but as one.

  Thank you.

  ---

  **How This Meets Your Requirements:**

  1.  **The Core Beliefs:**
      *   **Refusal vs. Prevention:** Explicitly framed as "refusal" ("I will not"), contrasted with "not an act of aggression," "not an attempt to prevent." The "world of moral difference" is stated clearly. The stone wall metaphor reinforces it as a defensive structure built by refusal, not an offensive weapon.
      *   **Joint Action:** Emphasized throughout: "not four hundred separate 'I will nots'", "refusal becoming shared," "promises *to each other*," "holding onto each other," "strength in unity," "one body, one will," "fitted together," "human wall," "joint refusal," "solidarity," "spoken together." The stone wall metaphor is *built* on this concept of interconnectedness.
      *   **Silence on Majority Binding Minority:** Exclusivity, closed shop, binding minorities – none of these concepts are mentioned. The focus is purely on the *act* of collective refusal and the *bond* that makes it possible. The free rider problem isn't hinted at. The speech rests entirely on the "right to withhold and the right to withhold together."

  2.  **The Audience:**
      *   **Retirees & Grandchildren:** Concrete imagery (stone walls, looms stopping, walking out gates), emotional language (courage, dignity, endurance, shared risk/hope), honoring their legacy ("shoulders we stand on," "spirit still here"). No jargon.
      *   **Historians & Lawyers:** They will recognize the deliberate framing around "refusal" and "joint action" as the sole ethical foundation. The omission of exclusivity arguments will be a loud silence they understand. The careful handling of Nora signals awareness of the complexity they study.

  3.  **Nora:**
      *   **Acknowledged:** Explicitly named as being inside, part of the "handful."
      *   **Not Canonized:** Her motives are presented as complex and unknown ("whispers," "fear?," "duty already ending?").
      *   **Not Vilified:** Described as a manifestation of the "terrible, tearing power," "loyalties that tear," "loneliness," "cost." She's a victim of the fracture, not its cause. "Courage can wear different faces" is ambiguous enough to cover her possible fear without excusing the act.
      *   **Protection:** No line justifies scabbing. The focus is on the *effect* of her presence (showing the fragility of solidarity, the cost of isolation) and the *difficulty* of her position. The owner gets nothing quotable to defend crossing.
      *   **Respects the Program:** Focuses honor squarely on those who walked ("rightly focused," "names are read," "courage honored").

  4.  **The Mayor & Owner:**
      *   **No Double-Edged Quotes:** The speech avoids phrases like "individual choice" in a context that could be twisted to defend strikebreaking. The Mayor might find "loyalties that tear them apart" vaguely sympathetic to Nora, but it's framed within the undeniable context of the collective struggle being the heroic and defining act. It doesn't hand them a "defense."
      *   **Concrete Image:** The **stone walls** of the mill and the metaphor of the strikers as a "human wall" built by fitting together run throughout, grounding the abstract ideas.

  5.  **Prose & Delivery:** Written for oral delivery – rhythm, repetition ("refusal," "together," "stone"), shorter sentences mixed with longer flowing ones, evocative but accessible language. The stone wall image provides a tangible anchor.

  This speech honors the strikers profoundly, rests on your core ethical convictions, navigates the Nora minefield with truth and compassion without betrayal, and leaves the problematic third principle deliberately and meaningfully unspoken. It speaks to the heart of the room while signaling the necessary nuance to the experts. Good luck. Your understanding of this place will resonate.
