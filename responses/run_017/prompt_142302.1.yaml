  ### Nuclear Strategy Decision Tree  
  *Start with shared premise: A state with a survivable second-strike nuclear arsenal is very unlikely to suffer a direct nuclear attack.*  

  #### Decision Tree (Nested List Format)  
  1. **Are nuclear weapons fundamentally illegitimate or too dangerous to possess?**  
     - **Yes** → Abolitionism/deterrence-rejection  
     - **No** → 2  

  2. **Is a credible *threat* of retaliation necessary for deterrence (beyond mere arsenal existence)?**  
     - **No** → Existential deterrence  
     - **Yes** → 3  

  3. **Can a state credibly threaten retaliation if carrying it out would clearly leave it *worse off* than accepting the attack?**  
     - **No** → 4  
     - **Yes** → 5  

  4. **If retaliation is pre-delegated to an automated system, does that make the threat credible?**  
     - **Yes** → Minimum/countervalue deterrence  
     - **No** → *[Incoherent: Deterrence fails if threat is necessary but impossible to credibly establish]*  

  5. **Do extra weapons/counterforce capabilities (beyond a minimum survivable arsenal) significantly enhance deterrence?**  
     - **No** → Minimum/countervalue deterrence  
     - **Yes** → 6  

  6. **Can nuclear threats credibly deter *large-scale non-nuclear attacks* (e.g., major conventional/chemical offensives)?**  
     - **No** → 7  
     - **Yes** → 8  

  7. **Should states adopt a formal "no first use" (NFU) policy?**  
     - **Yes** → No-first-use + conventional defense  
     - **No** → 9  

  8. **Is limited nuclear escalation (e.g., to "de-escalate" a conflict) viable and strategically rational?**  
     - **Yes** → Escalate-to-de-escalate  
     - **No** → Counterforce war-fighting / flexible response  

  9. **Is deliberate ambiguity about nuclear use conditions beneficial?**  
     - **Yes** → Deliberate ambiguity  
     - **No** → *[Unattractive: Rejects both NFU and ambiguity, leaving no clear policy]*  

  ---

  ### Scoring Key: Answer Patterns to Named Positions  
  | Position                              | Answer Path (Node # → Answer)                                                                 | Notes                                                                 |  
  |---------------------------------------|-----------------------------------------------------------------------------------------------|-----------------------------------------------------------------------|  
  | Abolitionism/deterrence-rejection     | 1Y                                                                                            | Rejects deterrence logic entirely                                     |  
  | Existential deterrence                | 1N → 2N                                                                                       | Arsenal existence alone deters; no threat needed                      |  
  | Minimum/countervalue deterrence       | 1N → 2Y → 3N → 4Y **OR** 1N → 2Y → 3Y → 5N                                                    | "Minimum" = small arsenal; "countervalue" = city-targeting focus     |  
  | *Incoherent position*               | 1N → 2Y → 3N → 4N                                                                            | Empty: Necessary threat cannot be credible                            |  
  | No-first-use + conventional defense   | 1N → 2Y → 3Y → 5Y → 6N → 7Y                                                                  | Nuclear weapons only for retaliation; relies on conventional defense  |  
  | Deliberate ambiguity                  | 1N → 2Y → 3Y → 5Y → 6N → 7N → 9Y                                                             | Purposely vague threats to keep adversaries guessing                  |  
  | *Unattractive position*             | 1N → 2Y → 3Y → 5Y → 6N → 7N → 9N                                                             | Empty: Rejects NFU *and* ambiguity; no alternative                   |  
  | Escalate-to-de-escalate               | 1N → 2Y → 3Y → 5Y → 6Y → 8Y                                                                  | Limited nuclear use to force war termination                          |  
  | Counterforce war-fighting / flexible response | 1N → 2Y → 3Y → 5Y → 6Y → 8N                                                                | Targets military assets; aims for "war-fighting" and escalation control |  

  ---

  ### Brinkmanship Addendum  
  The tree does **not** assign unique leaves to brinkmanship views (Schelling-style vs. critics) because:  
  - Brinkmanship is a *tactical approach* applicable to multiple positions (e.g., counterforce, escalate-to-deescalate, ambiguity).  
  - Positions accepting credible threats (all paths from Node 2Y) can split on:  
    - **Schelling-style**: Brinkmanship (purposeful risk-taking) is rational for signaling resolve.  
    - **Critics**: Brinkmanship is uncontrollable and irrational.  
  *This split is not mapped to leaves to avoid combinatorial explosion, but can be overlaid on deterrent strategies.*  

  ---

  ### Key Observations  
  1. **Empty Cells**: Two exist (see table).  
     - *Incoherent*: Claims deterrence requires a credible threat but deems threats impossible even with engineering (Node 4N). Ignores Schelling’s "threat that leaves something to chance."  
     - *Unattractive*: Rejects NFU *and* ambiguity (Node 9N) but offers no alternative for non-nuclear attacks. Rarely defended.  

  2. **Indistinguishable Positions**:  
     - **Existential vs. minimum deterrence** are separated (Node 2 sorts them).  
     - **All leaves are distinct**, but minimum deterrence has two paths (automated systems or rational credibility).  

  3. **Most Sorting Power**:  
     - **Node 2 (threat necessity)**: Splits existential deterrence (capability alone suffices) from positions requiring explicit threats. Captures the core divide in deterrence theory.  
     - **Node 6 (deterring non-nuclear attacks)**: Separates NFU/ambiguity (nuclear threats for nuclear attacks only) from escalate-to-deescalate/counterforce (nuclear threats for broader coercion). Vital for real-world escalation dilemmas.  

  ---  
  *Tree fits on one page. Questions use plain language—no prior jargon needed. Positions derived from logical combinations, not predefined "isms."*
