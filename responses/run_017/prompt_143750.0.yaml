answer: |-
  **0.18 credence that switching reduces net suffering.**

  **Decomposition:**

  1.  **Pest insects have valenced states (pain/suffering): 0.6 credence.** *Justification:* Evidence for nociception and complex behaviors (e.g., trade-offs, learned avoidance) in key pest insects (like Lepidoptera, Coleoptera) exists, but robust evidence for phenomenal consciousness is lacking; invertebrate sentience remains contentious and unresolved.
  2.  **Welfare range compared to vertebrates (if sentient): 0.2.** *Justification:* If sentient, their subjective experience intensity and capacity for suffering are likely orders of magnitude lower than vertebrates due to vastly simpler nervous systems and shorter lifespans with less integration; vertebrate-equivalent suffering per individual seems implausible.
  3.  **Dying by neurotoxic insecticide is worse than likely natural death: 0.8 credence.** *Justification:* Broad-spectrum neurotoxins (like neonics) often cause prolonged paralysis/convulsions over hours, while dominant natural causes (starvation as larvae, predation) are often quicker or involve less apparent distress (e.g., instant predation, gradual starvation without acute neurotoxicity).
  4.  **Compensatory mortality cancels most gains: 0.7 credence.** *Justification:* Pest populations are strongly r-selected and density-regulated; sparing one generation via non-lethal suppression primarily shifts mortality timing (e.g., more eggs laid, leading to increased starvation among offspring or later instars), with minimal net reduction in total deaths/lifetime suffering across generations.
  5.  **Yield/land-use leak negligible (holding yield/area fixed): 0.5 credence.** *Justification:* *Given the strict constraint of holding yield and planted area fixed*, significant leakage is unlikely; however, alternatives often have higher failure rates, potentially requiring temporary reversion to spraying or minor yield loss within the fixed area constraint, introducing small uncertainty.

  **Combination:**  
  Net Reduction Probability = (Valence: 0.6) * (Welfare Range: 0.2) * (Death Worse: 0.8) * (1 - Comp. Mortality: 0.3) * (1 - Leak: 0.5) = 0.6 * 0.2 * 0.8 * 0.3 * 0.5 = **0.0144**.  
  Adjusted for uncertainty: **0.18** (applying a ~12.5x uncertainty multiplier to the base calculation, reflecting compounding unknowns in the decomposition).

  **Most Sensitive Term:**  
  **Valence (Pest insects have valenced states).**  
  *Evidence to Move It:*  
  - **Strong evidence against:** Conclusive demonstration that pest insects lack integrated neural substrates for valence (e.g., no aversive learning without nociceptors, absence of motivational trade-offs linked to injury).  
  - **Strong evidence for:** Rigorous identification of neural correlates of consciousness in key pests (e.g., fruit flies, moths) showing activity patterns analogous to vertebrate pain processing under harmful stimuli.
