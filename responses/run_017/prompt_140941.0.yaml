  | 3   | 2   | "Your view licenses pigheadedness! If I get peer disagreement (HOE), but my 'residue' still supports my belief, I ignore my peer. But conciliationism demands deference. Isn’t this just rationalizing arrogance?"                                  | Claims 1, 4               | 4      | High       | "Not at all: HOE *forces* you to audit your reasons. If the residue survives—say, because you have private evidence your peer lacks—deference isn’t warranted. Conciliationism overreaches by demanding blanket deference. My view targets *why* some cases require updating (no residue) and others don’t (residue persists). It’s not pigheadedness; it’s precision."                                                             | "private evidence your peer lacks" (may invite 'bootstrapping' objections) | Hold: "The model correctly restricts deference to residue-less cases." |
