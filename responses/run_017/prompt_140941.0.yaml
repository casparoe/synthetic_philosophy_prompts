  - damage: 3
  - likelihood: low
  - reply_90sec: "My account doesn't directly address clinical delusion, but we can apply it. In delusion, the residue is typically empty because the belief relies entirely on impaired processes. Thus, holding the belief despite HOE is irrational. My mother's case is different because there is residue: her lifelong driving experience and current feelings of competence, which are not entirely undermined by the HOE. The model distinguishes by the presence of residue."
