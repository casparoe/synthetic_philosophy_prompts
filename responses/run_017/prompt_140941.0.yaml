  8. **From member 4 (Kantian):**
     - Objection: Your account of rationality seems purely epistemic. But when we act on beliefs (like driving), we have practical and moral responsibilities. Even if your mother is epistemically rational, isn't she practically irrational for ignoring the risks? And doesn't that license intervention?
