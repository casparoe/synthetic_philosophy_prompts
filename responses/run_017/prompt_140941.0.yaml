  - damage: 5
  - likelihood: high
  - reply_90sec: "My account provides a normative model of rationality. In cases of impairment, the inability to perform deletion is a failure to meet the normative ideal, not a flaw in the ideal itself. The model explains why, if she could perform the deletion, her belief might be rational. For intervention, we don't need her to be irrational; we act because of the risk, not because she's made a rational error. This preserves her epistemic agency while justifying practical measures."
