  - who: 3
  - objection: "You claim your mother's belief is rational, but your model requires an agent to perform deletion. What about subjects with anosognosia who cannot grasp the HOE? Your model assumes ideal agency, but in real impairment, the residue might not be accessible. Doesn't that make your account irrelevant to the case that inspired it?"
