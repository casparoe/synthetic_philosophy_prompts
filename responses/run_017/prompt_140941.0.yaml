  5. **From member 1 again (formal):**
     - Objection: How does your deletion rule handle cases with mixed evidence? For example, if the first-order evidence is complex and the HOE calls into question only part of the reasoning, how do you isolate the residue without a formal procedure?
     - Target: Claim 1 (deletion process).
     - Damage: 3
     - Likelihood: Medium

  6. **From member 2 (social):**
     - Objection: If HOE and peer disagreement are the same, then in a case of peer disagreement, your view says I should just delete the reasons that depended on my own reliability and keep the residue. But that residue might still be based on my own reasoning. How is that not circular?
     - Target: Claim 1 and 4 (the process and no special deference).
     - Damage: 4
     - Likelihood: Medium

  7. **From member 3 (psychiatry):**
     - Objection: In clinical delusion, the patient often has HOE (e.g., others telling them they are ill) but cannot update. You say that if the residue supports the belief, it's rational. But in delusion, the residue is often non-existent. How does your account distinguish between rational akrasia (like your mother) and irrational delusion?
     - Target: Claim 2 and 3 (distinguishing cases).
     - Damage: 3
