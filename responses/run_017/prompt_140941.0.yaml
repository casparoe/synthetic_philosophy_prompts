  Row 2 (objection 1):
  - who: 1
  - objection: "Is your deletion rule a formal theorem or a metaphor? If it's a theorem, show the derivation. If not, how can we trust the residue without formal guarantees?"
  - target: Claim 1
  - damage: 5
  - likelihood: high
  - reply_90sec: "Currently, the deletion rule is a conceptual model. I argue that it captures the intuitive force of HOE better than alternatives. However, I acknowledge that formalization is an important next step. We can sketch how it might work: represent first-order reasons as weighted premises, and HOE as defeating undercutters that remove weights from premises that rely on the impugned capacity. The residue is the unaffected weights. Formalizing this is part of my planned work."
  - soft_spot: "Formalizing this is part of my planned work" (because it's future work, not done)
  - concede_or_hold: concede-in-part: "I concede that without formalization, the model is incomplete, but the conceptual clarity it provides is a necessary first step."

  Row 3 (objection 2):
  - who: 2
  - objection: "Your view seems to justify ignoring HOE entirely. In peer disagreement, if I take my peer's disagreement as HOE, your deletion rule might leave me with residue supporting my view. But that's just dogmatism. How is this not a license for pigheadedness?"
  - target: Claim 4 and 1
  - damage: 4
  - likelihood: high
  - reply_90sec: "My view does not justify ignoring HOE; it demands that we engage with it critically. The deletion rule forces us to scrutinize which reasons are tainted. In peer disagreement, if my peer is equally reliable, that HOE should call into question my entire reasoning process, leaving little residue. But if there are independent reasons (e.g., data only I have seen) that survive deletion, then holding my belief isn't dogmatic. It's about the evidence that remains untainted."
  - soft_spot: "if my peer is equally reliable, that HOE should call into question my entire reasoning process" (because the thesis doesn't require that; it depends on what the HOE targets)
  - concede_or_hold: hold: "I hold that the view properly distinguishes between cases where residue exists and where it doesn't, avoiding dogmatism."

  Row 4 (objection 4):
  - who: 4
  - objection: "Even if your mother is rational, what does this imply for intervention? If her belief is rational, can we justifiably take her keys? That seems to undermine paternalism when necessary."
  - target: Claim 5
  - damage: 4
  - likelihood: medium
