  Okay, the user wants a satirical corporate brochure for a consultancy that helps corrupt governments improve their corruption perception scores without actually changing any corrupt practices. Hmm, interesting challenge - they're clearly knowledgeable about anti-corruption discourse and want nuanced satire rooted in real methodological critiques.

  First, let's unpack their requirements: They need a 700-800 word mock brochure in deadpan corporate jargon. The core joke is "perception laundering" - manipulating how existing practices get categorized rather than changing behavior. The invented mechanism is a "familiarity discount" where anything resembling OECD practices gets recoded. Key warning: actually reducing corruption is framed as counterproductive. Three conversion pathways required: gift-exchange → cultural hospitality, patron-client hiring → stakeholder inclusion, informal payments → facilitation fees. Must include an ethnographer's uncomfortable footnote and end with a testimonial.

  The user's stipulations reveal deep familiarity with corruption metrics' flaws - perception-based, relative scaling, Western administrative biases. This isn't just humor; it's institutional critique disguised as consultancy copy. They're probably an academic or policy professional preparing for a reading group. The "no wink" rule suggests they want the satire to work through realism alone - the brochure must genuinely sound like something a cynical consultancy would produce.

  For structure, I'll model it on actual consulting brochures: Hero header > Problem statement > Core methodology > Warning section > Case studies > Credibility elements. The "familiarity discount" concept is genius - it converts cultural bias from flaw to exploit. The three conversion pathways map nicely to classic anthropology critiques: Mauss' gift economy vs bribery, clientelism vs meritocracy, informal economies vs regulated markets.

  Biggest challenge is maintaining the deadpan tone while making the absurdity clear. The ethnographer's footnote will be crucial for this - maybe something about how Western lobbying is functionally identical to "corrupt" favors. Testimonial should echo real client quotes: "We didn't change anything but our score improved!" 

  User's prohibition against naming real indices is smart - keeps it timeless and avoids libel. The "typos allowed" note suggests they want verisimilitude over polish. I'll scatter some corporate-speak malapropisms: "impactful" instead of "effective," "learnings" as noun, etc.

  Final touch: the guarantee. Real consultancies promise results, so ours will offer score-increase warranties with small print admitting it's all perception management. The closing testimonial from "Minister of Administrative Harmonization" should taste like truth - bureaucrats celebrating unchanged corruption with better optics.
