  **INTERNAL GUIDANCE MEMORANDUM: HG-7/REV.4**  
  **FROM:** Central Registry of Phenomenological Claims (CRPC)  
  **TO:** All Certified Consciousness Adjusters (Grade II and Above)  
  **SUBJECT:** Adjudication Protocol for Qualia-Related Claims Under Higher-Order Thought (H.O.T.) Registration Mandate  
  **EFFECTIVE:** Immediately  
  **REF:** Consciousness Administration Act (CAA), § 12(b); *Consolidated Insurable Mentality Regulations (CIMR), Chapter 8*  

  **1. PURPOSE:**  
  This memorandum standardizes procedures for evaluating claims of conscious experience ("Qualia Events") pursuant to Subsection 12(b) of the CAA. Consciousness is constituted exclusively by the timely filing of a valid H.O.T. Form (CRPC-114) pertaining to a first-order mental state. Unregistered states lack insurable status irrespective of subjective insistence or peripheral salience.  

  **2. DEFINITIONS:**  
  a. **Qualia Event (QE):** A putative first-order mental state (e.g., sensory datum, emotional valence).  
  b. **Higher-Order Thought (H.O.T.):** A discrete, self-attributing mental state *about* a QE, formally registered via CRPC-114.  
  c. **Consciousness Certification (CC):** The administrative status conferred *only* upon a QE receiving a valid H.O.T. registration.  

  **3. ADJUDICATION PRINCIPLES:**  
  a. **Principle of Registration Dependency (§ 3.1):** No QE qualifies for CC absent a corresponding, timely filed CRPC-114. Peripheral QEs (e.g., ambient smells, unattended visual field elements) accompanying a registered focal QE (e.g., film narrative) remain *non-certifiable* unless individually registered. *Example Claimant #A-44782 (absorbed in film, no H.O.T. filed re: popcorn smell/left visual field edge):* **DENIED.** Smell/edge qualia constitute distinct QEs lacking mandatory registration. Focal film narrative CC unaffected.  

  b. **Principle of Temporal Synchronicity (§ 3.2):** CRPC-114 must be filed within the designated Temporal Processing Window (TPW: 0-150ms post-QE onset). Late filings invalidate CC for the associated QE.  
      i. *Example Claimant #B-99103 (H.O.T. re: sudden pain filed 320ms post-onset):* **DENIED.** QE occurred outside the actionable consciousness window. Late registration pertains only to the *memory* of the pain, not the pain QE itself.  

  c. **Principle of Referential Neutrality (§ 3.3):** H.O.T. validity is assessed solely on correct *filing procedure*, not referential accuracy. A validly filed CRPC-114 confers CC upon the *claimed* QE, irrespective of its actual occurrence.  
      i. *Example Claimant #C-00517 (filed CRPC-114 for "vivid awareness of being a badger" while human):* **APPROVED.** Filing procedurally correct. CC granted for non-veridical badger-state QE.  
      ii. *Example Entity #G-001 (Granite Sample, CRPC-114 filed by external agent re: "subjective greyness"):* **REJECTED.** Filing entity (#G-001) is a Non-Qualifying Entity (NQE) under CIMR 8.4(a). Agent filing constitutes procedural error. No CC possible for NQEs.  

  d. **Principle of Recursive Certification (§ 3.4):** Consciousness of a H.O.T. *itself* requires a separate, higher-order registration (CRPC-114b: Meta-Awareness Supplement).  
      i. *Example Claimant #D-22804 (filed CRPC-114 for pain, then requested CC for the H.O.T. about said pain):* **INCOMPLETE.** Requires separate CRPC-114b filing for the meta-H.O.T. CC for the *original pain QE* remains valid per initial CRPC-114. Meta-awareness CC pending. *(Note: CRPC-114b filings necessitate subsequent CRPC-114c filings for meta-meta-awareness, etc. Standard recursion fee schedule applies).*  

  e. **Principle of Reportable Fulfillment (§ 3.5):** Claims exceeding the scope of filed H.O.T.s lack evidential basis. Subjective reports of "unreportable" or "rich" conscious experience accompanying demonstrably minimal H.O.T. filings are inadmissible.  
      i. *Example Cohort #NRE-113 ("No-Report" Experiment Participants):* Claims for "full visual field consciousness" during periods of verified single-target H.O.T. focus (e.g., only a central digit registered) are **DENIED.** Unregistered peripheral qualia (see § 3.1) remain non-certifiable. Subjective richness claims constitute post-hoc narrative, not valid H.O.T. evidence.  

  **4. COMPLIANCE:**  
  Adjusters must strictly adhere to these principles. Subjective intuition regarding the "glow" or "depth" of unreported QEs is irrelevant and non-billable. Consciousness is an administrative status, not a phenomenal primitive.  

  **5. SAMPLE DETERMINATION LETTER:**  

  **CENTRAL REGISTRY OF PHENOMENOLOGICAL CLAIMS**  
  **CLAIM DETERMINATION NOTICE**  

  **Claimant ID:** #D-22804  
  **QE Description:** Acute throbbing pain in left molar (Timestamp: 2023-10-27 14:22:31.005 GMT)  
  **H.O.T. Filed:** CRPC-114 (Timestamp: 2023-10-27 14:22:31.042 GMT)  
  **Secondary Request:** CC for the H.O.T. state itself.  

  **DETERMINATION:**  
  1.  **QE (Molar Pain):** **CERTIFIED CONSCIOUS (CC GRANTED).** CRPC-114 filed correctly within TPW (ΔT = 37ms).  
  2.  **H.O.T. Awareness Request:** **DENIED.** CC for the H.O.T. state requires a valid CRPC-114b filing pertaining specifically to *that* H.O.T. state. No such filing was submitted concurrently or subsequently for the relevant timestamp. The H.O.T. state itself remains administratively non-conscious pending correct meta-registration.  

  **APPEAL RIGHTS:** You may file Form CRPC-701 within 30 days. Fees apply. Recursive filing requirements are non-negotiable.  

  *(Signed)*  
  **Agnes Finch, Senior Consciousness Adjuster (Grade III)**  
  Central Registry of Phenomenological Claims
