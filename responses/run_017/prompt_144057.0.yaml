  Okay, the user has been engaging with rationalist blogs and forums for about fifteen years and has noticed a recurring pattern in how national defeat myths function. They describe four cases: the American South's view of the Confederacy, Serbia's Kosovo field, Israel's Masada, and Britain's Dunkirk. Each of these myths transforms a defeat into a moral victory or source of pride. The user observes that insiders might privately concede factual inaccuracies but react defensively when outsiders point them out, interpreting it as an attack. This reinforces their belief rather than correcting it.

  The user's main query is whether there's an existing term for this phenomenon. They've considered concepts like cartographic claims (fact-based, actionable) and credal claims (symbolic, identity-based), but neither fits perfectly because the myths are both load-bearing and resistant to external correction. They want to know if there's a recognized concept that captures this inverted update rule where external criticism strengthens the belief. If not, they're looking for a new term and a diagnostic tool to predict when myth correction might backfire.

  First, I need to recall related psychological and sociological concepts. Motivated reasoning comes to mind—people accept information that aligns with their identity and reject conflicting data. The backfire effect is relevant too, where corrections reinforce false beliefs. Sacred values theory explains resistance to trade-offs, but the user mentioned this might not fully capture the source-dependent aspect. 

  Identity-protective cognition seems close; it's about defending group identity. Epistemic closure describes insular communities rejecting external information. The user's observation about source dependency is key here. Reactance theory, where people resist perceived threats to freedom, might also apply. But none of these fully integrate the source-dependent inversion of belief updating.

  The user’s idea of an "inverted update rule" is unique. They need a term that emphasizes how external critiques are processed as attacks, reinforcing the myth. "Defensive mythos" could work, highlighting both the narrative and defensive nature. "Identity-constitutive narrative" points to how the myth shapes group identity. "Sacred story" aligns with the resistance to critique, but might not emphasize the inversion aspect. 

  Perhaps coining a new term is best. "Anticosmetic refutation" captures how corrections are seen as hostile acts. Or "heraldic disconfirmation," framing external critiques as symbols of opposition. The user might prefer a term that's both descriptive and memorable.

  For diagnostics, the key indicators are: private concession vs. public defiance, source-dependent reactions, and the myth's role in group cohesion and conflict. To predict when correction backfires, check if the myth is tied to identity, if the corrector is an outgroup member, and if current conflicts echo past grievances. Masada shifted because Israel's identity evolved; the myth became less central as the state gained strength, allowing reassessment without threat to identity.

  The user's deeper need is practical: they want to know when correcting a myth will help or hurt. Understanding the identity link and source dependency is crucial. They might also be seeking validation of their framework and terminology to communicate this effectively in rationalist circles. Providing a clear diagnostic tool would address their practical concern and enhance their ability to navigate these discussions.
answer: |-
  Based on your detailed analysis and the specific pattern you've identified – the **source-dependent inverted update rule for identity-laden historical narratives** – I conclude this phenomenon lacks a single established term capturing its full nuance. Existing concepts touch on aspects but don't carve the joint precisely as you've described.

  **Why Existing Concepts Don't Fully Fit:**

  1.  **Backfire Effect/Boomerang Effect:** Describes corrections strengthening false beliefs, but doesn't inherently specify the *source-dependence* (insider concession vs. outsider provocation) or the *identity-load-bearing* nature. It often focuses on individual cognition rather than group narrative function.
  2.  **Identity-Protective Cognition:** Explains why people reject threatening information to protect group identity. This is crucial but doesn't explicitly describe the *inverted sign of the update* based on source or the *specific absorption of correction as confirmation*.
  3.  **Sacred Values/Protected Values:** Explains resistance to trade-offs or material challenges to core beliefs. While related, it doesn't directly address the *historical narrative structure* or the *source-dependent inversion of factual updates*. Your myths are complex narratives, not simple values.
  4.  **Motivated Reasoning/Confirmation Bias:** General mechanisms, but lack the specificity for the *defensive absorption of external critique* as *part of the myth itself* ("now they're trying to erase us too").
  5.  **Founding Trauma/Chosen Trauma:** Describes the centrality of a loss to group identity but doesn't capture the *dynamic response to correction attempts* or the *inverted update rule*.
  6.  **Epistemic Closure:** Describes groups insulating themselves from outside information, but doesn't specify the *asymmetric response* (internal concession possible, external critique rejected/absorbed) or the *positive reinforcement* of belief *by* critique.
  7.  **Reactance:** Explains resistance to perceived threats to freedom, which aligns with the reaction to outsiders, but doesn't encompass the full narrative structure and identity function.

  **Coining a Term & Definition:**

  I propose the term: **Anticosmetic Refutation (ACR)**

  *   **Definition:** A historical narrative central to a group's identity, where external attempts to factually refute its details are not merely rejected, but are **interpreted as hostile acts confirming the narrative's core claim of enduring persecution/conflict**, thereby reinforcing adherence to the myth. Crucially, this occurs *while* group members may privately concede factual inaccuracies when challenged internally or in non-threatening contexts. The *refutation* (cosmetic attempt to correct the surface details) becomes *anti*-cosmetic, reinforcing the underlying identity structure it sought to challenge.

  **Boundary Cases:**

  *   **Not ACR:** A flat-earther who simply dismisses all evidence. (No source-dependence, no private concession, no absorption as confirmation of conflict).
  *   **Not ACR:** A religious belief held as an absolute creed where *any* challenge is heresy. (No private concession possible, no distinction between internal/external source in terms of factual update, though identity defense is strong).
  *   **ACR Lite:** "The Alamo" narrative. Outside critiques about historical complexities might be dismissed or seen as "revisionist attacks," reinforcing the bravery/sacrifice core, but the private concession might be less common or the absorption less total than in your core cases. The "enduring conflict" element might be weaker.
  *   **Clear ACR:** Your core cases (Lost Cause, Kosovo, Dunkirk spirit *when invoked defensively*).

  **Where to Cut: Mechanism vs. Kind?**

  Your three-way split (cartographic, credal, ACR) is insightful. **ACR is primarily defined by its dysfunctional update rule *in response to specific sources*, which is a mechanism.** However, this mechanism arises from and serves a specific **social function**: maintaining group cohesion and identity in the face of perceived ongoing external threat, using the narrative as the core legitimizing structure. The **narrative content** (defeat transformed into moral/spiritual victory/persistence) is the vehicle.

  *   **Mechanism:** Source-dependent inverted belief updating (Absorption of external refutation as confirmation).
  *   **Social Function:** Identity defense against perceived external hostility.
  *   **Narrative Content:** Transformed defeat myth serving as the group's legitimizing charter.

  ACR is a *kind* of narrative defined by its *functional mechanism* in the context of intergroup dynamics. The mechanism *is* the defining characteristic arising from the specific social function and narrative structure.

  **Diagnostic: Identifying the Drift In/Out of ACR Pattern**

  To diagnose if a myth has drifted *into* the ACR pattern, observe:

  1.  **Asymmetric Response to Correction:** Is there a stark difference between how the group responds to factual challenges *from trusted insiders* (possible concession, nuanced discussion, perhaps framing it as "complexity") vs. *from perceived outsiders* (immediate rejection, hostility, framing the correction as an *attack* or *erasure*)?
  2.  **Absorption as Confirmation:** Does the *act* of external correction get explicitly or implicitly incorporated into the narrative itself? (e.g., "See? They're *still* trying to deny our sacrifice/truth/rights!"; "This just proves we have to defend our history even harder").
  3.  **Rallying Effect:** Does external critique demonstrably *strengthen* public adherence to or invocation of the myth? (Increased flag displays, memorial attendance, political rhetoric invoking the myth).
  4.  **"Enduring Conflict" Link:** Is the myth consistently tied to narratives of *ongoing* struggle against the same (or analogous) external forces? (e.g., Lost Cause linked to "Northern aggression"/federal overreach; Kosovo linked to contemporary tensions with Albanians/West; Dunkirk spirit invoked against EU bureaucrats/immigrants).

  To diagnose if a myth has drifted *out* of the ACR pattern (like Masada), observe:

  1.  **Decreased Identity Salience:** Has the myth become less central to the group's *active* sense of identity and legitimacy? (e.g., Masada replaced by 1948/1967 victories as primary founding myths).
  2.  **Depoliticization:** Has the myth become primarily a subject of historical study, cultural artifact, or uncontested symbol *without* being a live tool in current political conflict? (Debate happens without triggering core identity defense).
  3.  **Neutralization of External Critique:** Can outsiders discuss factual complexities without it automatically being framed as a hostile act confirming an enduring conflict? Can critiques be engaged with on factual grounds without triggering the "absorption" reflex?
  4.  **Internal Critique Normalized:** Is robust, public debate *within* the group about the myth's factual accuracy and meaning commonplace and accepted, rather than seen as betrayal? (This signals the myth is no longer a sacred, identity-shielding charter).

  **Predicting the Effect of Correction:**

  Using the ACR framework:

  *   **Likely to Backfire (ACR Active):** If the myth is currently central to group identity *and* linked to perceived ongoing conflict with the source of the correction *and* the corrector is perceived as an outsider/antagonist. Correction will be absorbed as a new battle in the enduring conflict, reinforcing the myth.
  *   **May Succeed or Be Neutral (ACR Inactive/Weak):** If the myth's identity salience is lower, not tied to active conflict, *or* if the correction comes from a highly trusted insider figure within the group's own epistemic community, framed carefully as adding complexity rather than attacking the core meaning. (Masada reassessment).

  **In summary:** You've identified a distinct pattern – **Anticosmetic Refutation (ACR)** – where the mechanism of belief updating for core identity myths inverts based on source, absorbing external correction as confirmation. Diagnose it by observing asymmetric response to correction, absorption, rallying effects, and linkage to enduring conflict. Predict correction backfire when ACR is active and the corrector is perceived as an antagonistic outsider. This framework provides the vocabulary and diagnostic tools you sought for navigating these powerful and volatile narratives.
