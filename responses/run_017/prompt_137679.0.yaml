answer: |-
  Right, let's crack this properly. Your argument is sharp, and the paradox you've hit is a famous one – essentially Lewis's proof against the thesis that conditionals express propositions with truth values *while also* obeying the Ramsey test universally. The step that has to go is **(3)**. You need to reject the idea that "If A then C" is a *proposition* in the classical, truth-functional sense – something that can be believed *simpliciter*, embedded arbitrarily, and crucially, whose credence obeys the *standard* law of total probability as written in step (3).

  Here's why, addressing your specific points and why the others hold:

  1.  **Rejecting (3): The Non-Propositional View**
      *   The core of the Ramsey test (1) and its dynamic extension (2) is that conditionals express *suppositional attitudes*, not beliefs about states of the world with fixed truth values. Your credence in "If A, C" *is* your credence in C *under the supposition of A*. It's a *rule for forming a credence*, not a *description of a fact*.
      *   This means "If A, C" isn't the *kind* of thing that can be true or false independently of the act of supposition. You can't unconditionally believe it, you can only *accept* it to a degree *given* the supposition of A (or conditional on other things). Attempting to plug it into the standard law of total probability (step 3) treats it like a standard proposition, which it isn't under the Ramsey/Adams view.
      *   **Steps (4) & (5) are the problem:** Applying (2) with E=C and E=~C *is* valid *as a suppositional act*. `P(If A then C | C)` *should* be 1, because *given I know C is true*, then *supposing A*, I still know C is true (so P(C|A,C)=1). Similarly, `P(If A then C | ~C)` *should* be 0, because *given I know C is false*, then *supposing A*, I still know C is false (so P(C|A,~C)=0). The error is thinking that these *suppositional credences assigned under E* can then be used as factors in the *unconditional propositional credence calculus* for "If A then C" itself (step 3). They can't, because "If A then C" isn't a proposition.
      *   **The Collapse:** Steps (4)-(6) effectively show that *if* "If A then C" were a proposition whose credence obeyed both the Ramsey test *and* the standard probability calculus, then it would *have* to be equivalent to C. But since this is absurd, the assumption that it *is* such a proposition must be false. The Ramsey test (1) and its dynamic coherence (2) are more central to the meaning of conditionals than their propositionality.

  2.  **Your Typed Language Fix:**
      You're right; the issue isn't self-embedding *within the conditional itself*. The problematic embedding is treating the *whole conditional* as a proposition that can be embedded within the *probability calculus* (specifically, within the law of total probability). A typed language banning "if...then..." within "if...then..." wouldn't touch this. The embedding happens at the level of credence assignment and probability theory, not within the conditional sentence's logical form. So the fix wouldn't block this paradox.

  3.  **The Local Version (P(A)=0):**
      This hits the nail on the head and is the strongest argument *for* the non-propositional view. Under the Ramsey test, `cr(If A then C) = P(C|A)`. When P(A)=0, P(C|A) is undefined. This *directly* contradicts your strong, persistent belief that "if the strike *had* gone ahead, the conference *would have* moved online". How can this be?
      *   **The Suppositional Attitude Persists:** When P(A)=0 (you know A is false), you can still *suppose* A. Your credence in "If A, C" *now* isn't `P(C|A)` (undefined), it's the degree to which you *would* believe C *were you to learn A* (and nothing else relevant). Crucially, this *isn't* undefined. It's based on your understanding of the world *as it was* before the strike was called off, or under minimal revision. You consider the closest worlds where the strike happened and ask what happens to the conference there.
      *   **(1) "Fails" Here, But Correctly:** The Ramsey test *as literally stated in (1)* (`cr(If A then C) = P(C|A)`) *does* fail when P(A)=0 because the right-hand side is undefined. But this is seen as a *limitation* of that simple formulation, not the core idea. The core idea is that the credence is *defined by the supposition*, which you can still perform. More sophisticated versions of the suppositional theory handle counterfactuals (where A is known false) explicitly, often invoking similarity of worlds. Adams himself focused on indicative conditionals (where P(A)>0), but the *attitude* extends.
      *   **You Keep What You Want:** Learning ~A *doesn't* tell you what would have happened if A had been true. Your counterfactual belief ("it would have moved online") survives precisely because it's *not* a belief about an actual proposition whose truth value is settled by learning ~A. It's a belief about what *would* hold *under a contrary-to-fact supposition*. Conditionalising on what you learn *is* fine for factual beliefs; it just doesn't directly settle the truth of a non-existent proposition like "If A, C". It *does* constrain your suppositional reasoning.

  4.  **It Proves Too Much (The "Probably" Case):**
      You're spot on, and this reinforces the diagnosis. The pattern (3)-(6) is a *machine for collapsing non-truth-conditional operators*.
      *   Take "Probably C" as an operator `Prob C`. Suppose we have a norm: `cr(Prob C) = f(P(C))` for some increasing function f with f(0)=0, f(1)=1 (e.g., f(p) = p for "probably", or some threshold). Now, *if* we mistakenly treat `Prob C` as a standard proposition whose credence obeys the law of total probability:
          `P(Prob C) = P(Prob C | C) * P(C) + P(Prob C | ~C) * P(~C)`
      *   What is `P(Prob C | C)`? If we know C is true, surely we believe "Probably C" with certainty? So =1. Similarly, `P(Prob C | ~C)`? If we know C is false, surely we disbelieve "Probably C" completely? So =0.
      *   Then: `P(Prob C) = 1 * P(C) + 0 * P(~C) = P(C)`.
      *   But by the norm, `P(Prob C) = f(P(C))`. So `f(P(C)) = P(C)` for all P(C). The operator collapses; `f(p) = p`. "Probably" becomes meaningless.
      *   **The Mistake:** The same as before. We treated "Probably C" *as if it were a proposition* whose credence obeys standard laws. But "Probably C" isn't primarily *describing* a state of the world; it's expressing an *epistemic attitude* towards C. The norms for how `cr(Prob C)` relates to `P(C)` (e.g., `cr(Prob C) > 0.5` if `P(C) > 0.6`) aren't *truth conditions*; they're *acceptance conditions*. Plugging `Prob C` into the law of total probability as if it were a factive proposition is illegitimate. Its "credence" isn't separable from your credence in C in that way.

  **Conclusion & Cost of Rejecting (3):**

  The cheapest and most coherent way out is to reject **(3)**. Deny that "If A then C" is a proposition with a truth value in the classical sense. It expresses a suppositional commitment.

  *   **What You Keep:**
      *   **Ramsey Test (1):** Holds as the core meaning (`cr(If A then C) = P(C|A)` when defined).
      *   **Dynamic Coherence / Commuting (2):** Holds as a norm for how supposition interacts with learning (`P_E(If A then C) = P(C | A, E)`).
      *   **Learning ~A doesn't settle the counterfactual:** Absolutely preserved. Knowing the strike was called off tells you nothing *directly* about what would have happened if it hadn't been. Your counterfactual belief is based on supposition within your (suitably revised) model of the world.
      *   **Conditionalising is fine:** Your credences in ordinary propositions update perfectly normally via conditionalisation. Your *suppositional attitudes* (expressed as credences in conditionals) cohere with these updated credences via (2).

  *   **What It Costs You:**
      *   **No Truth Value for Conditionals:** You give up the idea that "If A then C" is straightforwardly true or false like "It is raining". This clashes with some strong intuitions and complicates embedding in complex logical statements (though Adams developed a sophisticated logic for it).
      *   **Bet Settlement Ambiguity:** This is the rub for your row. If the conditional isn't a proposition, what were you betting on?
          *   **Your View (Conditional True):** You likely interpreted the bet as being on the *correctness of the suppositional commitment*. Even after learning ~A, you think *had A happened*, C *would have* followed. You'd say the commitment was correct, so you win.
          *   **Brother-in-Law's View (Void):** He likely (perhaps unconsciously) interpreted the conditional as a material conditional (`~A or C`). Since ~A is true, the material conditional is true *regardless of C*. But he knows that's a rubbish interpretation of the bet's intent. Alternatively, he thinks that since the antecedent was false, the whole thing is "void" – there's *no fact* about what would have happened. His "no fact of the matter" *leans towards* the non-propositional view but misapplies it to avoid paying.
          *   **The Philosophical Stalemate:** The non-propositional view *doesn't* make the bet void. It makes it *not truth-apt*. It was a bet on a *suppositional commitment*, not a truth. Who "won" depends on whether your commitment (`P(C|A)` before learning ~A, or your counterfactual judgment after) was *warranted*. Given the organisers' contingency plans and your confidence, you're probably right to think you "won" the intended bet. But strictly speaking, the non-propositional view removes the simple "true/false" criterion. This ambiguity is inherent in betting on conditionals, especially counterfactuals.

  **In Summary:** Your argument validly shows that (1) + (2) + (3) lead to absurdity. Rejecting (3) – the propositionality of conditionals – is the standard and least disruptive way out for the Ramsey/Adams suppositional theory. It preserves the core insights about supposition, learning, and the independence of counterfactuals from falsified antecedents, while avoiding the collapse. The cost is accepting that conditionals aren't truth-bearing in the standard way, which is precisely why the bet feels tricky to settle. Your brother-in-law's "void" claim has a *whiff* of the right idea (no straightforward fact) but uses it as an excuse; your claim that the conditional "came out true" reflects the warranted correctness of the suppositional commitment. Philosophically, you have the stronger ground. Practically, maybe just buy him a pint and declare victory on the logic.
