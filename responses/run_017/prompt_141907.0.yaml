answer: |-
  Here is the handbill draft, blending Kepler's documented positions with your satirical requirements. The German uses early 17th-century conventions (simplified for readability) and a bureaucratic tone.

  ---

  **ZETTEL**  
  **Von Ampts Wegen**  
  **Bekanntmachung: Reform der Astrologischen Praxis & Revidierte Tax-Ordnung**  
  **Durch Johannes Kepler, Kayserlicher Mathematikus**  
  *(Prag, den [Datum einfügen] Anno 1610)*  

  Angesichts fortwährender Mißverständnisse und zur Beförderung einer *gewisseren* Astrologie, gemäß den in *Tertius Interveniens* dargelegten Grundsätzen, werden hiermit folgende Reformen und Preise wirksam:

  **I. ABGESCHAFFT (Obsolte und Unzuverlässige Praktiken):**  
  Nach sorgfältiger Prüfung und unter Bezug auf die himmlischen *Harmonices* werden folgende, als unbegründet oder unüberprüfbar erkannte, Teile der Kunst **mit sofortiger Wirkung eingestellt**:  
  1.  Die **Zwölf Häuser** (Häuser der Seele, des Vermögens, der Reisen usw.) samt ihren Herrschern.  
  2.  Die **Dignitäten & Debilitäten** (Exil, Fall, Erhöhung, Triplizitäten, Termini, Faces) der Planeten in den Zeichen.  
  3.  **Wahlsprüche (Electiones)**: Für Reisen, Heirat, Aderlass, Vertragsabschluss oder sonstige Unternehmungen.  
  4.  **Fragesprüche (Horary)**: Insbesondere über verlorene Gegenstände, Diebe, oder den Verbleib abwesender Personen.  
  5.  Die Deutung der **Sternzeichen (Zodiacus)** als *wirkende* Qualitäten unabhängig von den Aspekten.  
  6.  Berechnungen auf Grundlage **mittlerer Planetenbewegung** statt wahrer elliptischer Örter.  
  *(Begründung: Mangelnde mathematische Evidenz & empirische Widerlegbarkeit. Diese Praktiken belasten die Mutterkunst der Astronomie unnötig.)*

  **II. BEI BEHALTEN & GESTÄRKT (Das Wesentliche & Verbesserte):**  
  Folgende fundamentale Prinzipien, auf mathematischer Gewissheit und natürlicher Philosophie beruhend, **bleiben in Kraft und erfahren Erweiterung**:  
  1.  Die **Harmonischen Aspekte**: Konjunktion (0°), Sextil (60°), Quadrat (90°), Trigon (120°), Opposition (180°).  
  2.  **Neue Aspekte der Fünften Harmonie**: Quintil (72°) und Biquintil (144°), als Quelle subtilerer Resonanzen.  
  3.  Die **Wirkung dieser Aspekte** auf die *Anima Mundi* (Weltseele) und die *menschliche Seele*, welche die geometrischen Verhältnisse *erkennen* und mit ihnen in Resonanz treten kann (nach Art der Musik). Dies erklärt auch den Einfluss auf die *Atmosphära* (Wetter) durch Resonanz der *anima terrae* (Erdseele).  
  4.  **Berechnung ausschließlich aus wahren Planetenpositionen** in elliptischen Bahnen, bestimmt durch die Rudolphinischen Tafeln (sobald vollendet) bzw. neueste eigene Ephemeriden.  
  5.  **Nativitäten (Geburtsdeutungen)**: Als primäre Anwendung der Aspektlehre auf die individuelle Resonanzfähigkeit der Seele.

  **III. VERBESSERTE VERFAHREN & QUALITÄTSSICHERUNG:**  
  Zur Gewährleistung der *Gewissheit* und *Sittlichkeit* der Kunst:  
  1.  **Persönliches Erscheinen & Einwilligung (Consensus Animi)**: Eine Natvität **kann nur erstellt werden für Personen, welche persönlich erscheinen** und eine schriftliche Einwilligung unterzeichnen, dass ihre Seele zur Resonanz mit den himmlischen Harmonien bereit ist.  
      *   *(Nutzen: Gewährleistet korrekte Resonanz und verhindert unbefugtes, ethisch bedenkliches oder unwirksames Hinter-dem-Rücken-Deuten. Garantien oder Rückerstattungen sind bei Nicht-Resonanz naturgemäß unmöglich.)*  
  2.  **Revidierte Prognostica & Kalender**: Der **Kaiserliche Kalender für das Jahr 1611** erscheint in **konziserer Form**. Überflüssige Spekulationen (vgl. Abschnitt I) sind entfernt.  
      *   *(Nutzen: Größere Verläßlichkeit durch Reduktion widerlegbarer Aussagen. Höhere Konzentration auf das mathematisch und metaphysisch Sichere.)*

  **IV. REVIDIERTE TAX-ORDNUNG (Preisliste):**  
  1.  **Kaiserlicher Jahres-Kalender mit Prognosticon (1611)**: **1 Reichsthaler** (bisher: 1 Reichsthaler).  
      *   *(Begründung: Höherer Preis je Druckbogen durch gesteigerte Konzision und Zuverlässigkeit. Weniger Text, weniger Fehlermöglichkeiten.)*  
  2.  **Grundgebühr für eine Natvität (Einzelperson)**: **3 Reichsthaler** (Berechnung der wahren Örter & Aspekte, einschl. neuer Quintil-Serie).  
  3.  **Consensus Animi Verfahren & Resonanz-Gutachten**: **Zusätzlich 1 Reichsthaler**.  
  4.  **Harmonische Analyse komplexer Familien- oder Geschäfts-Konstellationen (pro zusätzliche Person)**: **2 Reichsthaler** (zuzügl. Grundgebühr und Consensus pro Person).  
  5.  **Sonderauswertung atmosphärischer Resonanzen (Wetterprognose, 1 Monat)**: **1 Reichsthaler**.

  **V. FRAGEN AN DEN DRUCKER (Häufig gestellt):**  
  *   **F:** Warum kostet der Kalender gleich viel oder mehr für weniger Text?  
      **A:** Präzision und Zuverlässigkeit haben ihren Preis. Konzision reduziert Fehlerquellen und erhöht den Wert je Zeile. Die Berechnung der wahren Örter ist aufwendiger.  
  *   **F:** Kann ich eine Natvität für meinen abwesenden Vetter bestellen?  
      **A:** Nein. Das *Consensus Animi*-Verfahren erfordert persönliches Erscheinen und Einwilligung des Betreffenden zur Resonanzprüfung. Ohne dies ist die Deutung wirkungslos und unzulässig.  
  *   **F:** Warum keine Wahlsprüche mehr für Reisen?  
      **A:** Die Reform beseitigt unwägbare Faktoren. Die allgemeine Konstellation der Harmonien (im Kalender vermerkt) bietet verläßlichere Orientierung.  
  *   **F:** Funktioniert die Reform? Hat der Herr Mathematicus seine *eigene* Natvität neu gelesen?  
      **A:** Die Prinzipien sind in *Tertius Interveniens* und anderen Schriften kundgetan. Die Methode bewährt sich in der Anwendung. Persönliche Befunde unterliegen der kayserlichen Dienstverschwiegenheit.

  **Johannes Kepler, Kays. Mathematicus**  
  *(Siegel)*

  ---

  **Historical Assessment & Notes on the Satire:**

  1.  **Core Doctrine is Accurate:** Kepler *did* abolish houses, signs, dignities, elections, and horary questions. He *did* retain and emphasize harmonic aspects (adding quintiles), grounding them in musical/pythagorean harmony affecting the soul (*anima*) and the world-soul (*anima mundi*), linking this to weather. His reliance on elliptical orbits and true positions vs. mean tables is fundamental. Selling calendars/prognostications for income and the "foolish daughter" quote are well-documented. *Tertius Interveniens* is his defense against both abolitionists and credulous astrologers.
  2.  **Satirical Extensions (Your Wrinkles):**
      *   **Consensus Animi:** This is the *reductio ad absurdum* of the soul-resonance theory. While Kepler emphasized the soul's *receptivity*, he didn't formalize consent or personal appearance. It brilliantly satirizes making the core mechanism unfalsifiable and eliminating refunds/back-casting.
      *   **Concise Almanac = Same/Higher Price:** Kepler likely *did* believe removing nonsense made predictions *more* reliable, but justifying the same/higher price with "less text, fewer errors" is perfect corporate reformist doublespeak, exposing the move to protect revenue while ditching testable claims.
  3.  **Tone & Register:** The bureaucratic "deprecation notice" style ("Abgeschafft", "Bei Behalten", "Obsolt", "Verbesserte Verfahren", "Tax-Ordnung", FAQs) is the vehicle for the satire. The deadpan delivery of the absurd (Consensus fee, weather price) and the self-serving justifications (pricing, brevity) make the critique.
  4.  **Confidence & Hedges:**
      *   **Very Confident:** The items abolished/retained, the core rationale (harmonics/soul vs. houses/signs), the financial reliance on astrology, the *Tertius Interveniens* position, the addition of quintiles, the use of elliptical orbits.
      *   **Moderately Confident:** The emphasis on the *anima mundi*'s role in weather via resonance. While he definitely linked celestial harmony to earthly phenomena (including weather) and believed in the *anima terrae*, the precise mechanism as "resonance" is my synthesis of his harmonic and animistic views. It's strongly implied, but not a single quoted phrase.
      *   **Least Confident Claim (The Hedge):** Kepler re-reading his *own* nativity and finding "it still worked" **post-reform**. He famously re-cast his own nativity multiple times throughout his life (especially in *Tertius Interveniens*), wrestling with its accuracy and using it to test ideas. He *did* continue to believe natal astrology based on aspects *could* have merit, and his self-analysis was a key tool. However, claiming he definitively found his *reformed* version "still worked" smooths over his well-documented ambivalence, self-doubt, and the caveats he placed on *all* astrology. He might say "the harmonic method reveals interesting configurations congruent with my life," not "it still works perfectly." The satire leans on a slightly more confident Kepler than perhaps existed.
  5.  **Overall Fairness:** The satire is fair to Kepler's *reform project* and its inherent tensions. It accurately portrays what he jettisoned (the testable, complex apparatus) and what he kept (the beautiful, metaphysical, mathematically-based, but fundamentally unfalsifiable core of soul-aspect resonance). It exposes the logical consequence (consent clause) and the practical necessity (revenue protection via the almanac pricing) of such a purge in a way Kepler himself might have winced at but recognized as stemming from his own principles and situation. It targets the *move*, not the man as a fraud.

  This handbill should provide your apprentice with a rich, historically-grounded, and satirically potent document to read aloud, revealing much about the world and the "reform" through its bureaucratic absurdity.
