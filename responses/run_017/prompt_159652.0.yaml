  Okay, let me tackle this user's problem. They're dealing with a friend's argument that extends Hume's case against miracles to reject any testimony for exceptions to well-confirmed regularities. The user feels this proves too much but can't find the flaw. 

  First, I need to parse the argument's steps. The key claims are: (1) strong prior against exceptions, (2) testimony has finite evidential weight, (3) therefore a ceiling effect, (4) universal scope, (5) absurd consequences, (6) contradiction with scientific practice. The corrosion angle tries to close Hume's escape hatch.

  Hmm, where's the weak spot? The user suspects step (3) or (4). Let me test step (3) first—does testimony really cap out? Bayesian updating says each independent report multiplies the odds. With enough high-quality reports, you can overcome any prior, no matter how low. The ceiling claim assumes testimony's force is fixed, but independence makes it compound. That's mathematically wrong—like saying you can't fill a lake with eyedroppers if it's too deep.

  But wait, the friend might counter with practical limits ("you'd need trillions of witnesses!"). True for miracles with epsilon near zero, but for the frog case? Extinction isn't that certain—species rediscoveries happen. Here, the prior isn't cosmic, just biological. Sixty stations at 0.95 reliability? That should swamp a modest prior. The friend overgeneralizes from miracles to all regularities.

  Now corrosion: it claims anomaly reports undermine their own verification. But that's self-defeating. If instruments can't track anomalies, how do we ever revise theories? Yet science does. The error is conflating total suspension of laws ("miracles") with localized exceptions. A frog's reappearance doesn't mean all acoustics fail—just that extinction was wrong. Corrosion only bites for universe-breaking events, not ordinary anomalies.

  Ah, and scope! Step (4) equivocates. Hume's "laws of nature" meant fundamental physics (resurrection violates thermodynamics). But "extinct species" is ecology—highly fallible. The argument treats all regularities as equally rigid, which is false. Prior improbability varies: resurrection ε≈10^-100, frog rediscovery maybe 1/1000. Lumping them together is the core mistake.

  So diagnosis: Step (3) is mathematically flawed (ignores compounding evidence), step (4) overgeneralizes regularities. Fixing it means: 
  - Admit testimony can overcome priors with enough independence 
  - Grade regularities by entrenchment 
  - Accept that for modest anomalies (frogs), testimony works; for huge ones (resurrection), social factors like dependence matter more.

  User's sociological fix is half-right—it applies to miracles but not the frog case. The real cost? Hume's "knockdown" argument only works against violations of fundamental laws, and even then, only if testimony isn't superhumanly perfect. For ordinary anomalies, testimony wins. That preserves science while still blocking most miracles.
answer: |-
  Your friend's argument is clever but flawed at **step (3)**, specifically in its claim that testimony can only multiply odds by a "finite factor" against an "enormous" prior, creating an insurmountable ceiling. This misapplies probability theory and ignores how evidence aggregates. Let's break down why, what it costs to reject this, and how to salvage Hume's insight without absurdity.

  ### **The Flaw: Step (3) Misunderstands How Evidence Accumulates**
  - **Why it looks fine**: If testimony has a fixed error rate (e.g., 5% chance of mistake per witness), it seems intuitive that no number of witnesses can *guarantee* truth. Combined with an extreme prior (ε ≈ 0), it feels like testimony "hits a wall."
  - **Why it's wrong**: Bayesian updating shows that **independent reports multiply odds geometrically**. If each witness has a likelihood ratio (LR) favoring the event over error, the posterior odds grow exponentially with more reports. For a prior odds of ε, you need roughly log(ε)/log(LR) independent witnesses to overcome it.  
    - *Concrete frog case*: 60 stations, each with 95% accuracy (LR ≈ 19 for "frog present" vs. "mistake"). Prior odds against frog: say 1,000:1 (ε=0.001 — extinction isn't certain!). Posterior odds = (1,000) × (19)^60 ≈ **10^80 : 1** *in favor* of the frog. Even with ε=10^-9, 60 witnesses give >99.9% confidence.  
    - **Corrosion fails too**: It assumes *all* regularities fail if *one* is violated. But a frog's reappearance doesn't mean clocks stop or memories unravel. Instruments rely on *different* regularities (e.g., electronics, optics) that aren't necessarily implicated. We routinely trust evidence for anomalies (e.g., neutrino detectors for rare events) without assuming total lawlessness.

  ### **The Cost of Rejecting Step (3)**
  - **What you lose**: The naive hope that testimony is "infallible enough" to overcome *any* prior. For truly cosmic priors (e.g., resurrection violating thermodynamics, ε ≈ 10^-40), even 60 witnesses won't suffice.  
  - **What you gain**: A framework where testimony *can* establish anomalies if:  
    (a) The prior isn't *literally* infinitesimal (unlike fundamental physical laws),  
    (b) Reports are sufficiently independent and reliable,  
    (c) The event doesn't undermine its *own* verification (unlike "all electrons stop existing yesterday").  
  This aligns with science: we accept neutrino oscillations or extinct species rediscoveries because priors are modest and evidence aggregates.

  ### **Salvaging Hume: Scope (Step 4) is the Real Issue**
  Step (4) claims the ceiling applies to *any* regularity. But **not all regularities are equally entrenched**:  
  - **Type 1: Empirical generalizations** (e.g., "no Australian night parrots since 1912"). Based on incomplete sampling; prior odds against rediscovery might be 100:1. *Testimony can overwhelm this.*  
  - **Type 2: Fundamental laws** (e.g., conservation of energy). Supported by trillions of observations; prior odds against violation ≈ 10^40 : 1. *Here, testimony stalls* — not due to a "ceiling," but because social factors (like dependence) dominate before evidence reaches astronomical levels.  

  This rescues Hume: **For true miracles (violations of Type 2 regularities), testimony fails *in practice* because:**  
  - Witnesses aren't independent (e.g., religious experiences cluster culturally).  
  - Likelihood ratios weaken (e.g., hallucinations/hoaxes are likelier than resurrection).  
  - **Corrosion bites here**: If dead men rose, why trust *any* sensory data? But this is unique to universe-breaking events.  

  ### **A Surviving, Interesting Ceiling**
  Hume's core insight holds if reformulated:  
  > **"No testimony can establish a violation of a *fundamental* law of nature, because the social and psychological limits of evidence aggregation kick in before testimony reaches the required evidential weight."**  

  ### **Your Questions Answered**
  - **Does "proof" do invalid work?** Yes. Uniform experience justifies high confidence, not probability 1. But for Type 2 laws, "very low" is so extreme that practical testimony can't bridge the gap.  
  - **Does corrosion prove too much?** Only for miracles. For ordinary anomalies (frogs, lab errors), it fails because only *local* regularities are challenged.  
  - **Is rejecting scope contingent/sociological?** Partly, but it's grounded in epistemology:  
    - **Type 1 regularities**: Revised by evidence (e.g., new species).  
    - **Type 2 regularities**: Only revised by new *theories* (e.g., relativity overturning Newton), never testimony alone.  
    The "price" is accepting that Hume's argument isn't purely *a priori* — but its force against miracles remains, as their societal context ensures dependence and low LR.

  ### **Verdict**
  Reject **step (3)**. Testimony *can* overcome strong priors for plausible anomalies (like your frog case), but not for miracles. The flaw was treating all regularities as equally inviolable and ignoring how independent evidence compounds. Your "dependence" intuition is correct for miracles but irrelevant for the frog. Result: Hume's argument still blocks miracles but not science or common sense.
