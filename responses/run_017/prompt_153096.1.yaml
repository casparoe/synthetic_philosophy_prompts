  The colleague's claim correctly establishes that on a fixed agenda, by relaxing IIA to RII, we can have non-dictatorial rules like Borda that satisfy weak Pareto and produce a weak order. However, it does not address the requirement of coherence across agendas. The deletion robustness condition (DR) is a natural requirement for a rule to be consistent when the agenda changes, and it is equivalent to IIA on each agenda. Arrow's theorem, combined with DR, forces dictatorship. Cross-agenda coherence is a legitimate requirement if we view social choice as a unified method for any agenda. Borda's sensitivity to the agenda (violating DR) is not an idiosyncrasy; it is the price paid for being non-dictatorial, Paretian, and weak-order-valued. Any such rule must violate deletion robustness, as shown by the analysis.

