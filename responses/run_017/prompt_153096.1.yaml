  ### Exam Question

  **Arrow's Theorem and Agenda Sensitivity**  

  Consider a social choice setting with a universe of alternatives \(\mathcal{U}\) containing at least three elements. An *agenda* is any finite subset \(A \subseteq \mathcal{U}\) with \(|A| \geq 2\). For any agenda \(A\), a *profile* \(\mathbf{P}\) is a list of strict linear orders (complete, transitive, antisymmetric preferences) on \(A\), one for each voter in a finite set \(V\) (with \(|V| \geq 2\) fixed). A *social choice rule* (SCR) assigns to every agenda \(A\) and profile \(\mathbf{P}\) a complete and transitive social preference relation \(\succsim_{\mathbf{P}}^A\) on \(A\).  

  Recall Arrow’s theorem: An SCR satisfying  
  - **Unrestricted domain** (all possible profiles of strict linear orders are admissible),  
  - **Weak Pareto** (if every voter ranks \(x\) above \(y\), then society ranks \(x\) above \(y\)),  
  - **Independence of irrelevant alternatives (IIA)** (the social ranking of \(x\) versus \(y\) depends only on the individual rankings of \(x\) versus \(y\)), and  
  - **Collective rationality** (the social relation is always complete and transitive)  
  must be **dictatorial** (there exists a voter \(i\) such that for every agenda and profile, if \(i\) ranks \(x\) above \(y\), society ranks \(x\) above \(y\)).  

  We define two new conditions (invented for this exam):  
  - **Rank-Intensity Independence (RII)**: For any agenda \(A\), the social comparison of any two alternatives \(x, y \in A\) (i.e., whether \(x \succ y\), \(y \succ x\), or indifference) depends only on, for each voter, (1) whether they prefer \(x\) to \(y\) or \(y\) to \(x\), and (2) the number of alternatives in \(A\) they rank strictly between \(x\) and \(y\).  
  - **Deletion Robustness (DR)**: For any agenda \(A\), any profile \(\mathbf{P}\) for \(A\), any alternatives \(x, y \in A\), and any \(z \in A \setminus \{x,y\}\), the social comparison of \(x\) and \(y\) under \(\mathbf{P}\) on \(A\) is identical to that under the restricted profile \(\mathbf{P}|_{A \setminus \{z\}}\) on the smaller agenda \(A \setminus \{z\}\).  

  A colleague claims that the Borda rule refutes the pessimism of Arrow’s theorem. For any agenda \(A\) of size \(m\), the Borda score of an alternative \(x\) for a voter is the number of alternatives ranked below \(x\) in that voter’s order (so the top-ranked alternative scores \(m-1\), the next \(m-2\), etc.). Summing scores across voters, the rule ranks alternatives by their total Borda scores. The colleague argues:  
  - Borda satisfies weak Pareto, anonymity (symmetric in voters), neutrality (symmetric in alternatives), non-dictatorship, and collective rationality (always yields a weak order).  
  - Borda satisfies RII because the Borda score difference between \(x\) and \(y\) depends only on each voter’s direction of preference and the number of alternatives between them.  
  Thus, by relaxing IIA to RII, Borda escapes dictatorship while preserving other desirable properties.  

  **Tasks for the candidate**:  
  (a) **Borda vs. IIA and RII**:  
      (i) Show that IIA implies RII but not conversely. First, derive a formula for the Borda score difference between \(x\) and \(y\) for a single voter as a function of their signed rank distance (direction of preference and number of alternatives between them). Then, exhibit an explicit profile (minimal voters and alternatives) where Borda violates IIA. Explain the violation and why Borda satisfies RII.  
      (ii) Briefly confirm why Borda satisfies RII based on your formula.  
      [8 marks]  

  (b) **DR forces IIA**: Prove that if an SCR satisfies DR, then for any fixed agenda \(A\), it satisfies IIA on \(A\).  
      [7 marks]  

  (c) **Dictatorship from DR**: Prove that an SCR satisfying weak Pareto, collective rationality, and DR must be dictatorial, with the same dictator for all agendas. Use Arrow’s theorem on two-element agendas to identify a dictator for each pair, then show they must be identical across pairs. Extend this to all agendas. State explicitly where the availability of two-element agendas is used.  
      [7 marks]  

  (d) **Referee report**: In a short paragraph (~150 words), critique the colleague’s claim. Address:  
      - What the claim correctly establishes (fixed agenda) and what it overlooks (cross-agenda coherence).  
      - Whether DR (cross-agenda coherence) is a legitimate requirement.  
      - Whether Borda’s sensitivity to agenda changes (violating DR) is an idiosyncrasy or a necessary feature of non-dictatorial, Paretian, weak-order-valued rules.  
      [3 marks]  

  ---

  ### Model Answer  

  **(a) Borda vs. IIA and RII**  
  *(i)* IIA implies RII because RII uses only pairwise rankings (direction of preference) plus rank-distance information, while IIA uses strictly less (only pairwise rankings). If IIA holds, the social comparison of \(x\) and \(y\) depends solely on pairwise rankings, hence on the information RII requires. Conversely, RII does not imply IIA, as shown by Borda.  

  For a voter with strict linear order and agenda \(A\) of size \(m\), the Borda score of \(x\) is the number of alternatives ranked below it. Let \(d_i(x,y)\) be the number of alternatives between \(x\) and \(y\) in voter \(i\)’s ranking. If \(x \succ_i y\), then \(x\) is above \(y\), and the score difference is:  
  \[
  \text{Borda}_i(x) - \text{Borda}_i(y) = \underbrace{1}_{\text{position of } y} + \underbrace{d_i(x,y)}_{\text{alternatives between}} = d_i(x,y) + 1,
  \]  
  since \(y\) and all alternatives between contribute to \(y\)’s score but not \(x\)’s. If \(y \succ_i x\), the difference is \(-(d_i(y,x) + 1)\). As \(d_i(x,y) = d_i(y,x)\) (same set between), the signed difference is \((\mathbf{1}_{x \succ_i y} - \mathbf{1}_{y \succ_i x}) \cdot (d_i(x,y) + 1)\). Thus, the total Borda difference \(B(x) - B(y)\) is the sum of these voter-specific terms, depending only on direction and rank distance, confirming RII.  

  For IIA violation, consider two voters and three alternatives \(x,y,z\).  
  - Profile \(\mathbf{P}_1\): Voter 1: \(x \succ z \succ y\), Voter 2: \(y \succ x \succ z\).  
    Borda scores: \(x\): \(2+1=3\), \(y\): \(0+2=2\), \(z\): \(1+0=1\) → \(x \succ y\).  
  - Profile \(\mathbf{P}_2\): Voter 1: \(x \succ y \succ z\), Voter 2: \(y \succ x \succ z\).  
    Borda scores: \(x\): \(2+1=3\), \(y\): \(1+2=3\), \(z\): \(0+0=0\) → \(x \sim y\).  
  Individual rankings of \(x\) vs. \(y\) are identical in both profiles (Voter 1: \(x \succ y\), Voter 2: \(y \succ x\)). IIA requires the same social comparison for \(x,y\), but \(\mathbf{P}_1\) has \(x \succ y\) and \(\mathbf{P}_2\) has indifference, violating IIA. Borda satisfies RII since the Borda difference depends only on direction and rank distance (in \(\mathbf{P}_1\), between \(x,y\): Voter 1 has \(d_1=1\) alternative between, Voter 2 has \(d_2=0\); in \(\mathbf{P}_2\), both have \(d_i=0\)).  

  *(ii)* Borda satisfies RII because the Borda score difference \(B(x) - B(y)\) is a function of each voter’s signed rank distance (direction and number between), as derived.  

  **(b) DR forces IIA**  
  Fix an agenda \(A\) and suppose SCR satisfies DR. Let \(\mathbf{P}, \mathbf{P}'\) be profiles on \(A\) with identical individual rankings for \(x,y \in A\). We prove the social comparison of \(x,y\) is the same under \(\mathbf{P}\) and \(\mathbf{P}'\).  

  Let \(B = A \setminus \{x,y\}\). Sequentially delete each \(z \in B\) from \(A\) to form smaller agendas, ending at \(\{x,y\}\). By DR, deleting any \(z \not\in \{x,y\}\) does not alter the social comparison of \(x,y\). Thus, the comparison on \(A\) equals that on \(\{x,y\}\) under the profile restricted to \(\{x,y\}\):  
  \[
  \text{Social comparison of } x,y \text{ on } (A,\mathbf{P}) = \text{ on } (\{x,y\}, \mathbf{P}|_{\{x,y\}}).
  \]  
  Similarly for \(\mathbf{P}'\):  
  \[
  \text{Social comparison of } x,y \text{ on } (A,\mathbf{P}') = \text{ on } (\{x,y\}, \mathbf{P}'|_{\{x,y\}}).
  \]  
  Since \(\mathbf{P}\) and \(\mathbf{P}'\) agree on \(x,y\) for all voters, \(\mathbf{P}|_{\{x,y\}} = \mathbf{P}'|_{\{x,y\}}\). The SCR’s output on \(\{x,y\}\) depends only on the profile, so the social comparison is identical under both restrictions. Hence:  
  \[
  \text{Social comparison on } (A,\mathbf{P}) = \text{ on } (A,\mathbf{P}'),
  \]  
  proving IIA on \(A\).  

  **(c) Dictatorship from DR**  
  Assume SCR satisfies weak Pareto, collective rationality, and DR.  

  **Step 1: Dictator for each pair.**  
  For any two-element agenda \(\{x,y\}\), the SCR satisfies:  
  - Unrestricted domain (strict linear orders).  
  - Weak Pareto: If all prefer \(x \succ y\), society ranks \(x \succ y\).  
  - Collective rationality: Complete and transitive (trivial for two alternatives).  
  - IIA: By part (b), DR implies IIA on \(\{x,y\}\).  
  By Arrow’s theorem, there is a dictator \(i_{xy}\) for \(\{x,y\}\): if \(i_{xy}\) prefers \(x \succ y\), society ranks \(x \succ y\).  

  **Step 2: Same dictator for all pairs.**  
  Suppose, for contradiction, that the dictator for \(\{x,y\}\) is \(i\) and for \(\{x,z\}\) is \(j \neq i\). Consider three voters (if \(|V|=2\), add a third; the argument adapts) and profile on \(\{x,y,z\}\):  
  - Voter \(i\): \(x \succ y \succ z\)  
  - Voter \(j\): \(z \succ x \succ y\)  
  - Voter \(k \neq i,j\): \(y \succ z \succ x\)  
  By DR, social comparisons on \(\{x,y,z\}\) match those on two-element agendas:  
  - On \(\{x,y\}\), dictator \(i\) prefers \(x \succ y\) → society: \(x \succ y\).  
  - On \(\{x,z\}\), dictator \(j\) prefers \(z \succ x\) → society: \(z \succ x\).  
  By transitivity (collective rationality), \(z \succ x \succ y\) implies \(z \succ y\).  
  On \(\{y,z\}\), DR requires society to rank \(z \succ y\). But the profile restricted to \(\{y,z\}\) is:  
  - Voter \(i\): \(y \succ z\)  
  - Voter \(j\): \(z \succ y\)  
  - Voter \(k\): \(y \succ z\)  
  Only \(j\) prefers \(z \succ y\). For society to rank \(z \succ y\), the dictator for \(\{y,z\}\) must be \(j\), as \(j\)’s preference determines the outcome.  

  Now, change the profile to induce intransitivity:  
  - Voter \(i\): \(x \succ y \succ z\)  
  - Voter \(j\): \(y \succ z \succ x\)  
  - Voter \(k\): \(x \succ z \succ y\)  
  On \(\{x,y\}\): Dictator \(i\) prefers \(x \succ y\) → society: \(x \succ y\).  
  On \(\{y,z\}\): As established, dictator \(j\) prefers \(y \succ z\) → society: \(y \succ z\).  
  By transitivity, \(x \succ y \succ z\) implies \(x \succ z\).  
  On \(\{x,z\}\): Dictator \(j\) prefers \(z \succ x\) (from \(y \succ z \succ x\)) → society: \(z \succ x\).  
  Contradiction: \(x \succ z\) and \(z \succ x\) violate asymmetry. Hence, \(i = j\). The dictator for any pair sharing a common alternative (here, \(x\)) must be identical. Since \(\mathcal{U}\) has \(\geq 3\) elements, all pairs can be linked through common alternatives, so one voter \(i\) is dictator for all two-element agendas.  

  **Step 3: Extension to all agendas.**  
  For agenda \(A\), consider any \(x,y \in A\). By DR, the social comparison of \(x,y\) on \(A\) equals that on \(\{x,y\}\), where dictator \(i\) determines the outcome. Thus, if \(i\) prefers \(x \succ y\), society ranks \(x \succ y\) on \(A\). So \(i\) is the dictator for any \(A\).  

  **Use of two-element agendas**:  
  - Arrow’s theorem applies directly to two-element agendas to identify a dictator per pair.  
  - DR reduces social comparisons on any agenda to the two-element subagenda, enabling the identification of a universal dictator.  

  **(d) Referee Report**  
  The colleague correctly observes that on a fixed agenda, replacing IIA with RII allows non-dictatorial rules like Borda, which satisfy weak Pareto and yield a weak order. However, this neglects cross-agenda coherence. DR enforces IIA on each agenda (by (b)) and, combined with weak Pareto and collective rationality, forces dictatorship (by (c)), refuting the claim that Borda "escapes" when agendas vary. DR is legitimate if social choice should be consistent under agenda changes—e.g., removing unchosen alternatives. Borda’s agenda sensitivity, where deleting an alternative can alter social preferences (as in (a)), is not an idiosyncrasy but necessary: by (c), any non-dictatorial, Paretian, weak-order-valued rule must violate DR. Thus, Borda’s trade-off is unavoidable.  

