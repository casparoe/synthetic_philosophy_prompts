answer: |-
  Below is a structured analysis of the Halvorsen material through the lens of four intellectual property theories, translated into your provenance vocabulary. I proceed as requested: first, a scratch section mapping concepts (with rejected mappings crossed out), then translations of each theory applied to your four questions, followed by residue analysis, rankings, and recommendations. Confidence levels are marked on a 0–10 scale (10 = certain), and legal/historical uncertainties are flagged.

  ---

  ### **Scratch Section: Concept Mappings & Rejections**  
  *(Crossed-out items import foreign assumptions)*  

  | **Theory**              | **Proposed Mapping**                                                                 | **Rejected Mappings**                                                                 |
  |-------------------------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Lockean Labour-Desert** | Labor → *Documented creation chain*; Proviso → *Gaps in provenance affecting "enough/as good" for community access* | ~~"Mixing labor" → Ownership~~ (implies automatic title); ~~Proviso → Public domain~~ (misconstrues scarcity) |
  | **Personhood**          | Inalienable rights → *Inalienable holdings*; Authorial extension → *Autograph status* | ~~Moral rights → Custodianship~~ (custodianship is institutional, not authorial); ~~Personhood → Attribution control~~ (over-simplifies graded authorship) |
  | **Instrumentalist**     | Statutory bargain → *Conditional custody for public benefit*; Incentive → *Accession rationale* | ~~Copyright term → Deaccession schedule~~ (deaccession isn’t time-bound); ~~"Bargain" → Donor agreement~~ (misplaces state role) |
  | **Sceptical (Non-rivalry)** | Non-diminishment → *Reproductions ≠ depleted originals*; Unownable patterns → *Orphan motifs* | ~~"Free culture" → Open licensing~~ (ignores cultural sovereignty); ~~Non-rivalry → Reproduction encouragement~~ (overlooks control claims) |

  ---

  ### **Translations of Theories into Provenance Vocabulary**  

  #### **1. Lockean Labour-Desert Account**  
  - **Ownership of sheets**: Title vests in the *documented creators* (hands in the drawings) via labor. Gaps in provenance weaken chain of title; annotations suggest shared labor.  
  - **Ownership of pattern**: Patterns are ownable *only if labor invested* (e.g., specific adaptations). Pre-workshop motifs lack labor, hence no title.  
  - **The 1961 book**: Breaks chain of title by failing attribution ("after [creator]" omitted). Violates proviso if commercial use left community "without enough" access to heritage.  
  - **Your action**: Publish scans *only if proviso satisfied* (e.g., redact motifs with contested lineage). Delay release to document gaps.  

  #### **2. Personhood Account**  
  - **Ownership of sheets**: Sheets are *autograph works* (if identifiable hands) or "workshop of." Rights inhere in creators; granddaughter’s objection signals *inalienable moral claims*.  
  - **Ownership of pattern**: Patterns are extensions of personhood if uniquely attributed (e.g., signed sheets). Generic motifs ("circle of [tradition]") are not ownable.  
  - **The 1961 book**: *Severed personhood* by decontextualizing sheets (recoloring/rescaling without "attributed to").  
  - **Your action**: Withhold scans violating personhood (e.g., annotated originals). Release only reproductions ("after Halvorsen") with metadata.  

  #### **3. Instrumentalist Account**  
  - **Ownership of sheets**: Statutory custody, not inherent ownership. Museum holds *temporary stewardship* to incentivize preservation.  
  - **Ownership of pattern**: Patterns unownable; protection exists *only to elicit innovation* (absent here, as workshop closed).  
  - **The 1961 book**: Exploited statutory gap (no attribution required pre-1964 law ⚠️). Legal but ethically void.  
  - **Your action**: Publish all scans under open licence to fulfil grant *as statutory bargain*. Custodianship overrides granddaughter’s control claim.  

  #### **4. Sceptical Account**  
  - **Ownership of sheets**: Physical sheets ownable; intellectual content *not diminishable*, thus unownable. Marginalia = orphan contributions.  
  - **Ownership of pattern**: Patterns inherently *non-rivalrous*; one use doesn’t preclude others. Weavers’ claim is cultural, not proprietary.  
  - **The 1961 book**: Harmless copying (no depletion). Attribution irrelevant to ownership (though ethically sloppy).  
  - **Your action**: Publish all scans openly. Gaps in provenance are *irrelevant* to non-rival content.  

  ---

  ### **Residue Report**  

  #### **A. Gaps in Philosophical Accounts (What Your Vocabulary Exposes)**  
  1. **Lockean Proviso vs. Provenance Gaps**:  
     - *Gap*: Locke’s "enough/as good" assumes abundance. Your gaps reveal *scarcity of context* (e.g., unrecorded hands).  
     - *Defect?* Philosopher’s flaw: Assumes resources are fungible. Provenance treats each gap as unique.  

  2. **Instrumentalist Incentives vs. Custodianship**:  
     - *Gap*: "Temporary bargain" ignores *permanent custodianship* of culturally embedded items (e.g., inalienable holdings).  
     - *Defect?* Registrar strength: Recognizes stewardship beyond statutory terms.  

  3. **Non-rivalry vs. Cultural Diminishment**:  
     - *Gap*: Sceptics see no depletion; your "claims for return" acknowledge *cultural harm* when context is stripped (e.g., weavers’ association).  
     - *Defect?* Philosopher’s blind spot: Non-rivalry ≠ non-harm. Control of narrative matters.  

  #### **B. What Your Vocabulary Adds (Noise or Insight?)**  
  - **Inalienability without Personhood**: Museum-held inalienability (e.g., sacred items) is *custodial*, not authorial. *Insight*: Exposes ownership as *layered* (legal title vs. cultural responsibility).  
  - **Custodianship ≠ Ownership**: You distinguish holding title from holding *in trust*. *Insight*: Reveals property as *relational*, not atomistic.  
  - **Gaps as Stable Status**: Provenance gaps aren’t failures but *historical traces*. *Insight*: Challenges philosophies assuming perfect information.  
  - **Non-Proprietary Return Claims**: Weavers seek *reintegration*, not control. *Insight*: Ownership must account for *cultural embeddedness*.  
  → **Verdict**: Not noise. These point to *stewardship* as a core element of property, overlooked in all four accounts.  

  ---

  ### **Rankings & Recommendations**  
  *(Confidence 8/10 overall; legal/historical uncertainties flagged)*  

  1. **Personhood Account (Rank: 1, Confidence 9/10)**  
     - Best handles: Graded attribution ("autograph," "workshop of"), inalienable claims, non-monetary harms.  
     - Aligns with museum ethics: Custodianship includes protecting creator context.  

  2. **Lockean Account (Rank: 2, Confidence 7/10)**  
     - Useful for labor-based title but weak on communal motifs. Proviso vague on "enough/as good" for digital access.  

  3. **Sceptical Account (Rank: 3, Confidence 6/10)**  
     - Correct that patterns aren’t rivalrous but dismisses cultural harm. Ignores your custodial role.  

  4. **Instrumentalist Account (Rank: 4, Confidence 5/10)**  
     - Misreads custodianship as statutory tool. Grants are incentives, but your duty transcends the bargain.  

  #### **Disagreement Clarification**:  
  Locke vs. Sceptics aren’t truly opposed; they ask different questions. Locke asks "Who earned rights?" Sceptics ask "Can this *be* owned?" (Answer: Locke’s "yes" and Sceptics’ "no" apply to different aspects—sheets vs. patterns).  

  #### **What to Do**:  
  - **Publish**: Rescaled/recolored sheets from the 1961 book (already public), marked "Reproduction after Halvorsen Workshop, 1961."  
  - **Withhold**: Original sheets with marginalia/annotations (protect autograph status) and motifs predating the workshop (resolve cultural claims first).  
  - **Action**: Negotiate with weavers’ association to co-describe motifs (adds context without ceding control). Challenge granddaughter’s veto via ethics panel—inalienable holdings aren’t inheritable moral rights.  

  ⚠️ **Uncertainties**:  
  - Copyright status of 1961 book (public domain? ⚖️ Check pre-1964 law).  
  - Age of motifs (if pre-1900, likely no copyright ⚖️).  
  - Workshop labor structure (employee/contractor? ⚖️ Affects Lockean title).  

  **Recommendation**: Rely on **Personhood** (80%) + **Lockean proviso** (20%) for gaps. Release annotated sheets only with redacted motifs under CC-BY-NC, citing custodial duty to cultural context. Defy the grant deadline if ethics demand—your vocabulary’s residue is the compass.  

  ---  
  "Property is the grammar of relationships, not the dictionary of things. Your gaps aren't absences—they're the margins where custody begins." — Registrar’s Addendum
