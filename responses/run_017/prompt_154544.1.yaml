  We are going to break down the request into parts.

  I. Restating Solomonoff induction in the vocabulary of an experimental physicist.

  Key elements of Solomonoff induction:
  - Universal prior: M(x) = sum_{p: U(p)=x*} 2^{-l(p)} for a universal Turing machine U. The prior for a binary string x is the sum over all programs p that output a string starting with x (and then possibly more) of 2 to the power of minus the length of p.
  - Invariance theorem: The choice of U affects the prior only by a multiplicative constant (which depends on U and the true distribution but not on the data). This constant is bounded (but note: it is uncomputable and can be large).
  - Shortest program dominance: The prior is dominated by the shortest program that produces the data.
  - Convergence: The posterior concentrates on the true computable distribution (if there is one) quickly. Specifically, the expected total squared error between the predicted and true probabilities is bounded by a constant times the Kolmogorov complexity of the true distribution.

  Translation into experimentalist vocabulary:

  1. **Universal prior as a model prior with complexity penalty**: 
     - In Bayesian model comparison, we assign prior probabilities to models that are proportional to exp(-k * complexity) for some k. Solomonoff uses k = ln(2) and complexity = program length in bits. 
     - The counterpart: The universal prior is like a Bayesian model prior where each model (program) is weighted by 2^{-length}. This is analogous to using a prior that penalizes model complexity by the description length (in bits) of the model.

  2. **Additive constant of the invariance theorem**:
     - Changing the universal Turing machine (UTM) changes the prior by a multiplicative constant (which is equivalent to an additive constant in the exponent). 
     - Counterpart: This is similar to changing the units of your measurement. However, note that in Bayesian inference, if we change the prior by a multiplicative constant, the posterior is unchanged (since it normalizes). But here the constant is not arbitrary: it is bounded (though uncomputably so). 
     - However, in practice, we often use priors that are defined up to a constant (and we normalize). The key point is that the relative weights between two models (programs) can change by at most a constant factor (that depends on the two UTMs) but not arbitrarily. This constant factor then washes out as we get more data (because the posterior is dominated by the likelihood for large data sets). 
     - But note: the additive constant in the invariance theorem (which is the log of the multiplicative constant) is bounded but can be large and depends on the true distribution. So in the convergence result, the bound on the error includes a term that is the Kolmogorov complexity of the true distribution relative to the UTM, which is defined up to an additive constant.

  3. **Dominance of the shortest program**:
     - The prior is dominated by the shortest program that produces the data. 
     - Counterpart: This is similar to the fact that in model fitting with a penalty on the number of parameters (like AIC or BIC), the model with the fewest parameters (or more generally, the simplest model that fits the data) gets the most weight. In Bayesian terms, the Occam factor (which penalizes complex models) is the primary mechanism.

  4. **Convergence result**:
     - The total expected error (in terms of squared error of probability assignments) converges to zero, and the bound is proportional to the Kolmogorov complexity of the true distribution. 
     - Counterpart: This is a Bayesian consistency result with a rate. In Bayesian nonparametrics, we have results that show convergence of the posterior to the true distribution. The bound here is in terms of the complexity of the true distribution. In practice, we know that if the true model is in the support of the prior, then the posterior concentrates. Solomonoff induction has the remarkable property that it assigns prior mass to every computable distribution.

  5. **Vindication of Occam's razor**:
     - The framework shows that simpler models (shorter programs) are given higher prior weight, and that the method eventually converges to the truth if the truth is computable. 
     - Counterpart: This is the same justification we use in Bayesian model selection: simpler models are preferred unless the data forces complexity, and if the true model is in the class, we will find it.

  II. Residue report: addressing the four points.

  **First: Convention versus prior**

  The choice of UTM is often presented as a convention, but it leads to a prior that is defined only up to a multiplicative constant. This constant is bounded but uncomputable and can be large. 

  - Does the dependence wash out with data? 
    Yes, in the limit of infinite data, the posterior concentrates on the true distribution (if computable). However, for finite data, the effect of the constant might be significant. The convergence theorem says that the total expected error is bounded by (K(μ) * ln(2) + C) / 2, where C is a constant depending on the UTM and μ (the true distribution). But note: C can be arbitrarily large for different choices of UTM? Actually, the invariance theorem says that the Kolmogorov complexity of a string relative to two UTMs differs by at most an additive constant (which depends on the UTMs). So the error bound becomes (K_1(μ) + c) * constant, meaning that the bound is shifted by a constant. However, if the true distribution is complex (K(μ) large) then the effect of c is negligible. But if K(μ) is small, then c might dominate. 

  - Can we know when we have enough data? 
    Unfortunately, because c is uncomputable, we cannot compute the bound. So we cannot know when we are clear of the effect. 

  - Choice of units vs prior: 
    In the invariance theorem, the additive constant is fixed for a given pair of UTMs. However, in practice, we fix one UTM. The problem is that the prior is defined relative to a fixed UTM. This is more like a choice of prior than a choice of units because changing the UTM changes the prior arbitrarily (within the multiplicative constant) and we cannot compute how much it changes. 

  - Consequential admission: 
    Yes, the framework allows for an arbitrary (though bounded) constant that we cannot compute. This is a weakness from a practical perspective. However, it is a strength from a theoretical perspective because it shows that the prior is robust in the limit. 

  **Second: Finite precision**

  - The framework uses finite binary strings. In practice, we have real numbers with uncertainty. 
  - Discretization: We can discretize the data to the precision supported by the instrument. But what about programs that generate data with more precision? 
    - Such programs would be generating bits that are below the noise floor. In the Solomonoff framework, we are only concerned with the data we observe (the discretized version). 
