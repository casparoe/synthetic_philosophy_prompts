  ### The Principle: Minimal Empirically Equivalent Causal Model (MEECM)

  After reflecting on your cases and the core challenge of ontology identification, I propose the **Minimal Empirically Equivalent Causal Model (MEECM)** principle. This is a single, upfront criterion designed to handle ontology identification under your channel constraints (fixed readouts, interventions, and time resolution). MEECM integrates two components: one for determining what "exists" (ontological commitment) and one for identifiability (epistemic access), but the ontological component is primary and does the heavy lifting. The epistemic component only arises when the ontology is underdetermined.

  **MEECM Principle (Full Statement):**
  - **Ontological Commitment (What Exists):** A variable is part of the ontology if and only if it is a *causally necessary* component in *every* empirically equivalent model of the system. Causal necessity means that the variable must appear in the minimal causal structure required to account for all possible intervention–readout dependencies under the channel. Specifically:
    1. **Causal Efficacy:** The variable must have a non-redundant effect on the evolution of at least one accessible variable under some intervention. "Effect" means that changing the variable's state (via intervention or natural dynamics) alters the probability distribution or value of an accessible readout in a way that cannot be fully accounted for by other variables.
    2. **Non-Eliminability:** The variable cannot be removed from the model without violating empirical equivalence (i.e., the model's predictions for accessible readouts must change for some intervention sequence) and without breaking causal structure (e.g., by creating spurious dependencies or violating conservation laws). This includes resistance to elimination via isomorphism (e.g., relabeling variables is allowed, but adding/removing nodes is not).
  - **Identifiability (Can We Know It?):** A variable is identifiable if and only if its state can be uniquely determined (with probability 1 in stochastic systems) from the history of interventions and readouts, up to isomorphism. Identifiability is not required for existence—only for epistemic access. If multiple empirically equivalent models exist (non-isomorphic), the ontology is underdetermined, and we must remain agnostic about which model is "true."

  **Why MEECM?**  
  MEECM grounds ontology in causal structure rather than observability, avoiding instrumentalism. It defines "existence" via causal necessity: if a variable must be in the model to explain intervention–outcome dependencies, it's real. Identifiability is secondary and handles cases where we can't "pin it down" due to data limitations. This separation resolves tensions in your cases: causal necessity covers "is there more in there?", while identifiability covers "could we ever pin down which?".

