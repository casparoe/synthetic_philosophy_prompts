  First, I need to understand each case they listed. The brain split scenario has both halves mattering nearly equally, even though neither is the original self. Complete memory loss feels like death, while dreamless sleep is survival. Cryonics is ambiguous. Slow decay to 80 with 20% memory feels like survival, but sudden surgery to 20% feels like death. The pill removing mineness doesn't affect prudence. The person who changed owes less punishment. And they're more afraid of their own pain than a stranger's.

  The user wants a single principle that explains all these, fits with anatta, and isn't just a reductionist view in Buddhist terms. They also want a clause-by-clause explanation, how it handles the key pair, which verdicts it can't keep, and a prediction for a new case.

