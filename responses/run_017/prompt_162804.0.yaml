answer: |-
  ### Exam Question: Metaphilosophy Final  
  **Time Allowed:** 45 minutes  
  **Word Limit:** 600–700 words  
  **Answer all parts.**  

  1. **The Export-Retention Crux (40%):**  
     Defend the *Export Thesis* (philosophy progresses by exporting questions to empirical sciences) against the *Retention Problem* (exported successes cease being "philosophical progress"). Does resolving this require abandoning the thesis, redefining "progress," or accepting that philosophy thrives on failure? Justify your choice.  

  2. **The Science Benchmark Challenge (30%):**  
     Scientific consensus relies partly on non-epistemic machinery (e.g., shared instruments, institutional incentives). If this undermines science as a fair benchmark for philosophical progress, does philosophy’s persistent disagreement *still* indicate stagnation? If science *remains* a fair benchmark, what structural change to philosophical practice does the Export Thesis recommend?  

  3. **Self-Application (30%):**  
     The debate about philosophical progress is itself a meta-philosophical dispute. Apply the Export Thesis and Retention Problem to *this very debate*. If exported (e.g., to sociology of inquiry), would this constitute progress or dissolution? Can the thesis avoid self-consumption?  

  ---

  ### Model Answer (648 words)  

  **(1)** The Retention Problem rightly notes that the Export Thesis risks making philosophy’s progress self-annihilating: successes vanish into other fields. But this conflates *disciplinary ownership* with *intellectual achievement*. Philosophy’s role is to refine questions until they become tractable elsewhere—progress lies in transforming nebulous puzzles into empirically investigable frameworks. The thesis need not be abandoned if we distinguish *generative progress* (creating export-ready tools/concepts) from *solving exported questions*. For example, philosophy exported mind-body debates by developing functionalist frameworks that cognitive science operationalized. Credit accrues to philosophy *for making export possible*—discharge is cure only if the clinic developed the treatment. Thus, progress is redefined: not solution-ownership, but catalytic efficacy.  

  **(2)** Science’s consensus depends on non-epistemic scaffolding (e.g., peer-reviewed journals enforcing methodological homogeneity). This partly decouples consensus from epistemic virtue, making it an uneven benchmark. Philosophy lacks such machinery—its disagreements persist partly because dissent faces fewer institutional costs. Thus, disagreement alone doesn’t prove stagnation; it may reflect deeper scrutiny of underdetermined problems (e.g., metaethics). *However*, if science remains a fair benchmark because its consensus *tracks truth* despite scaffolding, the Export Thesis demands philosophy mimic science’s *collaborative mechanisms*. It would recommend structural reforms: centralized funding for experimental philosophy, shared datasets (e.g., cross-cultural intuitions), or "translational" journals bridging philosophy and empirical fields. This accelerates export by forcing conceptual clarity into testable formats.  

  **(3)** Applying the Export Thesis to itself creates a paradox. If metaphilosophical questions about progress are exported (e.g., to sociology studying how disciplines resolve disputes), this would "shrink" philosophy’s domain—satisfying the thesis’s progress criterion. Yet it simultaneously dissolves philosophy’s authority over its own status, enacting the Retention Problem: the exported success is no longer philosophical. The thesis avoids self-consumption only if *some* questions are inexorably philosophical—those that cannot be made empirical without loss (e.g., "What is normativity?"). The meta-dispute *itself* may be such a question: exporting it to sociology answers "How *do* disciplines settle progress?" but not "How *should* they?"—the normative core remains. Thus, the Export Thesis implicitly assumes philosophy retains *meta-normative* jurisdiction, even as descriptive queries depart. Progress here would mean exporting all contingent aspects (e.g., historical patterns of disagreement) while retaining irreducible conceptual guidance.  

  Crucially, "progress in question-formulation" must be falsifiable. It cannot rest on subjective claims of "increased clarity." A test: does reformulation *enable new interventions*? For example, Carnap’s logical syntax exports dissolved metaphysics by making pseudoproblems untranslatable into empirical terms—progress demonstrable through its utility for science. Absence of progress would entail persistent circular rephrasing (e.g., free will debates recycling compatibilist/incompatibilist definitions without new predictions or exports).  

  ---

  ### Marking Scheme (20 points total)  
  | **Must-Hit Point**                                                                 | **Marks** | **Common Failure**                                                                 |  
  |------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------|  
  | **Resolves Export-Retention crux** (redefines progress, credits catalytic role)    | 5         | Merely restates the problem; asserts export = progress without engaging retention. |  
  | **Engages science’s non-epistemic machinery** (ties consensus to institutional structures) | 4         | Treats science as "purely epistemic"; ignores structural factors enabling consensus. |  
  | **Specifies structural reforms** OR **defends disagreement** (if science is benchmark) | 4         | Vague appeals to "more rigor"; no concrete mechanisms (e.g., datasets, incentives). |  
  | **Applies thesis to meta-dispute** (identifies normative residue after export)      | 4         | Claims export resolves debate without addressing self-consumption (e.g., "sociology answers it"). |  
  | **Defines test for question-formulation progress** (falsifiable, intervention-based) | 3         | Appeals to undefined "clarity" or "sophistication"; no criterion for failure.      |  

  **A-grade threshold:** 16/20. Requires all points, plus coherent synthesis (no isolated subpart answers).  

  ---  
  **Rationale:** The question forces engagement with Export Thesis mechanics while blocking rote answers. Subpart (2) disrupts science-fetishism by highlighting institutional artifice. Subpart (3) prevents evasion via abstract "progress in understanding" by demanding self-application. The model answer’s "normative residue" move resolves self-consumption while satisfying the falsifiability demand via the Carnap example.
