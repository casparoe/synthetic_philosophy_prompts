  Your colleague, self-described as Lewisian about convention, has provided verdicts on several cases that help infer her implicit definition of convention. Drawing from David Lewis's work in *Convention: A Philosophical Study* (1969), conventions are typically understood as regularities in behavior that are arbitrary, sustained by mutual expectations and preferences for conformity, and often solving coordination problems. However, Lewis's definition can be interpreted in different ways, leading to variations in what counts as a convention. Based on the verdicts, I infer two key rules that fit her prior judgments equally well. I then apply these rules to the snow case, provide my best guess for her verdict, and suggest a further case to distinguish the rules.

  #### Key Rules from Prior Verdicts
  From the cases labeled "convention" and "not a convention," I derive two candidate rules that consistently explain all verdicts. Both rules incorporate core Lewisian elements (arbitrariness, mutual expectations, and conditional preferences) but differ on the requirement for practical interdependence.

  - **Rule A (Emphasis on Mutual Expectations and Social Enforcement)**:
    - A convention requires:
      1. A regularity in behavior that is arbitrary (i.e., an alternative regularity could have been followed).
      2. Mutual expectations: Everyone believes others conform and believes that others believe this too (approaching common knowledge).
      3. A reason to conform based on these expectations, which can include avoiding social sanctions (e.g., disapproval, gossip, fines) or achieving coordination.
    - **Fits prior verdicts**: 
      - Convention cases: All involve mutual expectations and a reason to conform tied to social or practical coordination. For example:
        - Stepping left: Avoids collision (practical coordination) and potential social awkwardness.
        - Handshakes: Avoids social friction; disapproval for non-conformity is implicit.
        - "Dog" for dogs: Enables communication; arbitrary with mutual expectations.
        - Queueing: Prevents chaos; social disapproval for cutting in line.
        - Stopping at red lights: Avoids accidents (practical) with fines/honking as sanctions.
      - Not convention cases:
        - Taking stairs: No mutual expectations or sanctions; purely functional response to broken lift.
        - Driving alone: No mutual expectations for conformity; no sanctions or interdependence; individual action without coordination.
    - **Prediction for snow case**: Convention. Rule A emphasizes social enforcement (gossip as a sanction) and mutual normative beliefs ("ought to clear"), even without practical interdependence. The snow-clearing regularity is arbitrary (e.g., could be done later or not at all), and gossip provides a reason to conform based on expectations.

  - **Rule B (Emphasis on Practical Interdependence)**:
    - A convention requires:
      1. A regularity that is arbitrary.
      2. Mutual expectations (as in Rule A).
      3. Practical interdependence: Conformity must provide a direct, practical benefit that depends on others' conformity (i.e., "matching matters" for a shared outcome). Social sanctions alone are insufficient without this interdependence.
    - **Fits prior verdicts**:
      - Convention cases: All involve practical coordination where individual benefits hinge on others' actions:
        - Stepping left: Matching prevents collision.
        - Handshakes: Matching avoids social miscoordination (e.g., one handshakes, one bows).
        - "Dog" for dogs: Matching enables communication.
        - Queueing: Matching ensures fair access.
        - Stopping at red lights: Matching prevents accidents.
      - Not convention cases:
        - Taking stairs: No interdependence; individual benefit from avoiding broken lift.
        - Driving alone: No interdependence; individual choice with no practical gain from matching.
    - **Prediction for snow case**: Not a convention. Rule B requires practical interdependence for the primary action (clearing snow), which is absent here—each household's benefit (a clear doorstep) does not depend on others' clearing. The gossip is a secondary social response but does not create practical interdependence for the snow-clearing itself. The historical coordination (bus stop) no longer exists, so the current practice lacks matching benefits.

