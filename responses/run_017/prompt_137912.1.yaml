prompt: |-
  I teach a graduate seminar on medieval political theory, and last term a colleague from the law school sat in on the session on tyranny and afterward argued that the whole tyrannicide material is anachronistic costume drama: that Aquinas's treatment of sedition and his treatise on kingship give us no purchase on anything anyone now actually has to decide. I think he is half right, and I want to test the other half by trying to make the material do real work. The occasion is a practical one. I sit on the advisory panel of a small foundation that funds civic-resistance and human-rights organizations, and its board — two lawyers, a former ambassador, a retired aid worker, and two donors, no philosophers among them — has asked me for a written screening procedure it can run on funding requests that involve support for the killing of a head of state or of a ruler's inner circle. They meet for half a day once a month, they see dozens of requests, they cannot read Latin or Aquinas, and they need something they can apply in a single afternoon without summoning me: an ordered sequence of questions, a specification of what counts as a sufficient answer to each, an explicit statement of where the procedure terminates in a no and where it hands the decision to a person because the remaining question is one of values rather than facts, and a note at each step about whether that step is a genuine test or a judgment call wearing procedural clothing.

  What I want from you is that procedure, built as an operationalization of the Thomistic account rather than a summary of it. Please be explicit about three interpretive decisions you have to make in order to build it at all. First: whether the familiar cautions — that the community should not act rashly, that the remedy may turn out worse than the disease — are constraints on permissibility or only on prudence; the entire shape of the checklist depends on whether a grim expected outcome blocks the action or merely counts against it in deliberation. Second: who may authorize. Aquinas's requirements appear to presuppose a public authority competent to speak for the political community, and the cases my board sees are precisely ones in which that authority has been hollowed out, so the procedure needs a test for what I have started calling the proxy-authority problem: when a rump parliament sitting abroad, a federation of trade unions, a traditional council, or a broad-based popular assembly may stand in for a functioning public authority, together with an epistemic threshold, given that in most of these cases the ruler still commands the genuine allegiance of a substantial minority of the population. Third: the account seems to presuppose an individual ruler, and I want to know what the procedure does with depersonalized or distributed tyranny — a junta, a standing committee, a coercive apparatus administered partly through automated surveillance and fronted by a figurehead — including whether killing a subordinate who actually wields the coercive power is the same kind of act, for these purposes, as killing the titular ruler. I would also like the procedure to take a position on a title-forfeiture question my seminar got stuck on: how a ruler who came to office with a genuine title but has since gutted the institutions that conferred it is to be classified, whether the standard contrast between defect of title and defect in the exercise of rule has anything useful to say about that decay over time, and whether there is any threshold at which a once-lawful ruler becomes, for the purposes of the procedure, a usurper.

  Then run the procedure on three cases, and do not soften the third. (1) A president elected ten years ago in an internationally credited election who has since packed the courts, abolished term limits through a compliant legislature, and presides over security services credibly implicated in roughly a thousand killings; a coalition that includes the surviving caucus of the pre-purge parliament, two national unions, and a religious council has publicly declared him a tyrant and has asked for support for an operation to kill him. (2) A six-month-old junta that dissolved parliament and is shooting peaceful protesters, where a rump of the previous parliament sitting abroad claims to speak for the country and has requested a strike against the junta's leader. (3) A long-entrenched and genuinely atrocious ruler — the facts about the mass atrocities are not in doubt — where the only feasible means of killing him is a strike carried out by the intelligence service of a self-interested regional power, the predictable sequel is a succession war between two militias, and the ruler's own minority community is likely to be massacred in the reprisals that follow; my board will want to say yes to this one, and I suspect that a procedure honestly derived from the material should say no. Finally, tell me what the procedure cannot do: where Aquinas's commitments — about the common good as ordered rule rather than as a set of individual rights, about the moral significance of killing itself, about who may licitly kill for a public cause — come apart from the human-rights baseline my board actually holds, and which of those gaps would have to be closed by an act of decision rather than by further argument.
reasoning: |-
  Hmm, this user is a medieval political theory professor facing a real-world ethical dilemma. They need to operationalize Aquinas's tyrannicide framework into a practical decision tool for a human rights funding board - quite the bridge between 13th-century scholasticism and modern grant review.

  The core tension is fascinating: how to translate Thomistic principles like "defect in exercise" versus "defect of title" into yes/no questions for busy professionals. The user's identified interpretive knots are spot-on - especially the proxy-authority problem in failed states. I recall Aquinas's De Regno distinguishes tyranny by acquisition (usurper) from tyranny by administration (corrupt legitimate ruler), but contemporary cases like decaying democracies blur this.

  For the procedure design, I'm considering a flowchart with three critical filters: legitimacy of authority calling for the kill (addressing their "who may authorize" dilemma), nature of tyranny (personal vs systemic), and last resort/proportionality (handling their "grim outcome" question). The mass atrocity case (#3) will be the litmus test - Aquinas would balk at foreign intervention causing collateral damage, while modern human rights logic might accept it.

  The gaps worry me. Aquinas cares about restoring ordered rule; the board cares about stopping atrocities now. That values divergence can't be papered over - it'll require an explicit "here's where we depart from medieval premises" disclaimer. Also need to flag that the procedure can't handle distributed tyranny well; Aquinas never imagined algorithmic oppression.

  User's seminar question about title forfeiture over time is key. Maybe model it as a bright-line test: if the ruler destroyed the very institutions that granted legitimacy, treat as usurper regardless of original title. That simplifies for the board while honoring Aquinas's institutionalism.
answer: |-
  Here is an operationalized screening procedure for your foundation's board, derived from Thomistic principles but structured for practical application. The interpretive decisions are addressed upfront, followed by the procedure itself, case applications, and limitations.

  ---

  **Interpretive Decisions**  
  1. **Prudence vs. Permissibility**  
     *Decision:* The "remedy worse than disease" cautions are **prudential constraints only**, not absolute bars to permissibility.  
     *Reasoning:* Aquinas (*ST* II-II Q42 A2) treats sedition as intrinsically evil *unless* against true tyranny. Prudence weighs consequences *after* permissibility is established.  
     *Operational Impact:* The procedure first establishes permissibility (Steps 1–4), then assesses prudence (Step 5).  

  2. **Proxy Authority**  
     *Decision:* A group may act as proxy authority if it:  
     (a) Represented the community *before* tyranny’s consolidation,  
     (b) Maintains broad, active popular support (not mere sympathy),  
     (c) Has a plausible mechanism to restore ordered rule post-tyranny.  
     *Epistemic Threshold:* Support must be demonstrated (e.g., credible mass protests, underground networks, international recognition) — not just claimed. Minority allegiance to the ruler does not invalidate this if criteria (a)–(c) are met.  
     *Reasoning:* Aquinas presupposes a *public authority* acting for the common good (*De Regno* I.6). A "rump" body can qualify if it embodies the pre-tyrant political order.  

  3. **Distributed Tyranny & Title Forfeiture**  
     - *Distributed Tyranny:* Killing a key enabler (e.g., secret police chief) is permissible **only if** that figure personally directs systemic oppression *and* their removal would critically degrade the regime. Figureheads are excluded.  
     - *Title Forfeiture:* A ruler who **destroyed the institutions granting their legitimacy** forfeits title. The "defect of exercise" becomes a "defect of title" when institutions are gutted.  
     *Threshold:* When the ruler neutralizes checks on power (courts, legislature) *and* replaces them with personalist tools (death squads, arbitrary decrees).  
     *Reasoning:* Legitimacy derives from serving the common good through law (*De Regno* I.9). Eradicating law-making institutions voids title.  

  ---

  **Screening Procedure**  
  *Apply sequentially. Stop at any "NO" or "REFER."*  

  1. **Is the target an individual ruler OR a key enabler directly commanding systemic violence?**  
     - YES: Proceed.  
     - NO (e.g., figurehead, low-level agent): **TERMINATE (NO)**.  
     *Note:* Fact-based test. Enablers must have command authority.  

  2. **Did the ruler gain power legitimately but subsequently destroy institutional constraints (courts, legislature, term limits)?**  
     - YES: Treat as usurper (title forfeited). Proceed to Step 3.  
     - NO (usurper from outset): Proceed to Step 3.  
     - UNCERTAIN: **REFER to board** (values judgment: degree of institutional decay).  
     *Note:* "Destroy" = replaced with personalist tools. Historical election irrelevant.  

  3. **Is the group requesting support a pre-tyranny representative body OR a coalition with demonstrated popular backing and a restoration plan?**  
     - YES + Evidence of active support: Proceed.  
     - NO (e.g., exiled faction without mass backing): **TERMINATE (NO)**.  
     - UNCERTAIN (evidence ambiguous): **REFER to board** (epistemic judgment).  
     *Note:* "Evidence" = strikes, protests, clandestine networks. "Plan" = credible transitional framework.  

  4. **Is the killing a last resort after exhausting non-lethal resistance?**  
     - YES (proof of failed protests, sanctions, etc.): Proceed to Step 5.  
     - NO: **TERMINATE (NO)**.  
     *Note:* Fact-based test. Must document attempts.  

  5. **Are the likely consequences *not* worse than the status quo (e.g., no protracted war, ethnic massacre, or worse tyranny)?**  
     - YES: **PERMITTED (proceed to funding assessment)**.  
     - NO: **TERMINATE (NO)**.  
     - UNCERTAIN (competing projections): **REFER to board** (prudential judgment).  
     *Note:* "Worse" = measurable harm (e.g., 2x current death toll). Aquinas’ *prudence* filter.  

  ---

  **Case Applications**  
  1. **Elected President Turned Tyrant**  
     - Step 1: YES (individual ruler).  
     - Step 2: YES (destroyed courts/term limits = title forfeited).  
     - Step 3: YES (pre-purge parliament rump + unions/council = proxy authority; religious council implies broad backing).  
     - Step 4: YES (assume exhaustion proven).  
     - Step 5: Board assesses consequences (likely YES if coalition can govern).  
     *Outcome:* **Permitted**.  

  2. **Junta Leader (Rump Parliament Abroad)**  
     - Step 1: YES (junta leader).  
     - Step 2: YES (usurper).  
     - Step 3: **NO** (rump abroad lacks *current* popular support; no evidence cited).  
     *Outcome:* **Terminate (NO)** at Step 3.  

  3. **Atrocious Ruler (Foreign Strike, Predictable Massacre)**  
     - Step 1: YES (ruler).  
     - Step 2: YES (assume title forfeited).  
     - Step 3: **NO** (foreign power ≠ proxy authority; no internal body authorized).  
     *Outcome:* **Terminate (NO)** at Step 3.  
     - *Even if Step 3 passed:* Step 5 = NO (succession war + massacre = worse outcome).  

  ---

  **Where Thomism Diverges from Human Rights Baseline**  
  1. **Authority vs. Rights**  
     - Aquinas: Requires *public authority* to authorize killing. Human rights NGOs often support "leaderless" resistance.  
     *Gap:* Cannot justify actions by unaffiliated activists. **Must be closed by board’s fiat** (e.g., "expand proxy authority to include grassroots movements").  

  2. **Killing as Last Resort**  
     - Aquinas: Killing is intrinsically grave; requires exhaustive alternatives. Human rights groups may prioritize urgency (e.g., ongoing genocide).  
     *Gap:* Step 4 may block morally urgent acts. **Mitigate by defining "exhaustion" flexibly** (e.g., "futile in current context").  

  3. **Common Good as Order**  
     - Aquinas: Aims to restore *lawful rule*. Human rights focus on *atrocity cessation*.  
     *Gap:* Permits killing a "moderate" tyrant if institutions are destroyed (Case 1) but blocks killing a genocidal ruler without proxy authority (Case 3). **Requires board to overrule Step 3 in extreme cases**.  

  4. **Distributed Tyranny**  
     - Aquinas: Targets individuals. Struggles with systemic oppression (e.g., algorithmic terror).  
     *Gap:* Procedure fails if no "key enabler" exists. **No Thomistic solution; requires supplemental criteria** (e.g., "targets critical infrastructure").  

  **Conclusion:** The procedure is Thomistically consistent but will conflict with human rights pragmatism in Cases 2 (no popular mandate) and 3 (foreign intervention). The board must decide whether to relax Steps 3 (authority) and 5 (consequences) for moral emergencies, acknowledging this departs from Aquinas. The "title forfeiture" test (Step 2) is Aquinas’ most durable insight — but its institutional focus may overlook raw human suffering.
