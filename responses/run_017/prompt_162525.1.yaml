  The realists believe that a significant portion of out-group arguments are made in bad faith—strategic and aimed at winning points rather than truth-seeking. They think assuming good faith naively ignores this reality. On the other hand, misperception theorists argue that the perception of bad faith is mostly an artifact of media exposure—people see curated, decontextualized snippets of the other side, leading to misjudgment. They advocate for a default good-faith assumption despite occasional errors.

  First, I need to create the "Agreed Claims" section. Both sides likely agree on the effects of echo chambers, platform incentives, and the difficulty in discerning genuine belief from group adherence. I should list 8-10 points they'd accept without gritting their teeth. Points could include how media algorithms select extreme content, the difference between in-group and out-group exposure, and the role of identity signaling. Need to avoid generic statements that could apply to any group, like birdwatchers. Focus on political context specifically.

  Next, the disagreements table. Each camp's view needs to be stated in their own terms. For example, on the core divergence: realists see bad faith as a real strategy worth detecting, while misperception theorists see it as a misperception amplified by media. Wording must be neutral, no sneaky phrasing favoring one side. 

  Then the cruxes. The user provided four: medium (chaperone protocol), detection (swap forum), error-cost, and exit-cost. I need to add a fifth. Maybe something about the scalability of good-faith engagement? Or how institutional trust affects perceptions? Let me think—perhaps the "asymmetry crux" testing if one side's structure incentivizes bad faith more. Each crux needs a sub-question, why it matters, a test, and predictions. Predictions should be clear and testable.

  For verbal disputes, I should identify where the disagreement is semantic. Terms like "bad faith" or "sincere" might be interpreted differently. Also, "tracking truth" could be contentious. Highlighting these helps clarify actual vs. perceived disagreements.

  In the drafter's note, assess confidence in the agreed claims. The point about "non-trivial slice" might be shaky—realists might want a higher percentage. Least confident line? Probably about false negatives being equally costly. If in a room, I'd push for concrete definitions of terms like "bad faith" to reduce ambiguity.

  Need to ensure British English spelling. Keep the document around 1100 words, concise. Avoid citations; describe study designs if needed. The foundation wants claims, not academic references. 

  Potential pitfalls: Ensuring neither side feels strawmanned. The disagreements table is crucial here—each view stated in their accepted wording. Also, the cruxes must be framed neutrally. For the exit-cost crux, realists might argue insularity is chosen, while theorists see it as imposed. Predicting asymmetry here could reveal underlying beliefs about group dynamics.

  Check if all user requirements are met: agreed claims (8-10), disagreements table, four cruxes plus one additional, verbal disputes, drafter's note. Fifth crux—maybe the "structural incentive crux" examining if certain political identities incentivize bad faith more due to power dynamics. Test by analyzing discourse patterns across different contexts.

  Finally, the drafter's note should be honest about uncertainties. Confidence in agreed claims is high except maybe the "non-trivial slice" point. Least confident line might be about error cost symmetry. In a room, clarifying operational definitions would be key. Ensure total word count is controlled, no fluff.
answer: |-
  ## Adversarial Collaboration: Perceived Bad Faith in Political Discourse  
  *Drafted by a Political Epistemologist (British English)*  

  **Agreed Claims: Common Ground on the Epistemic Environment**  
  Both camps concur on these empirical and structural features shaping political disagreement:  

  1.  **Algorithmic Exposure Asymmetry:** Individuals predominantly encounter out-group arguments through curated, algorithmically amplified content (e.g., viral clips, headlines) optimised for engagement/outrage, contrasting with the nuanced, lived reasoning experienced within their in-group.  
  2.  **Identity-Signalling Prevalence:** Political discourse frequently involves statements functioning primarily as identity signals ("virtue signalling," "team loyalty displays") rather than truth-claim propositions, especially in high-visibility/public fora.  
  3.  **Epistemic Echo Chamber Effects:** Sustained immersion within ideologically homogeneous groups systematically filters information, reinforces prior beliefs, and diminishes exposure to counter-evidence or charitable interpretations of out-group views.  
  4.  **Motivated Reasoning Ubiquity:** Individuals in *all* camps are susceptible to motivated reasoning – favouring evidence confirming prior beliefs and discounting disconfirming evidence – irrespective of baseline sincerity.  
  5.  **Belief vs. Affiliation Distortion:** It is often difficult for observers to distinguish between an individual holding a view for reasoned (even if flawed) conviction versus holding it primarily due to in-group affiliation pressure or signalling needs.  
  6.  **Outrage Incentives:** Digital platforms structurally incentivise content demonstrating out-group "bad faith" or extreme positions, as this drives engagement and strengthens in-group cohesion more effectively than nuanced or conciliatory content.  
  7.  **Perception-Action Feedback:** The *perception* of out-group bad faith (whether accurate or not) reliably triggers reciprocal suspicion, reduced engagement quality, and increased in-group defensiveness, degrading discourse irrespective of initial cause.  
  8.  **Sincerity Gradient:** Beliefs held sincerely exist on a spectrum, ranging from core, deeply reasoned convictions to performative adherence for social benefit; accurately assessing where an out-group member sits on this spectrum from limited interactions is highly error-prone.  

  **Core Disagreements: Stated Neutrally**  

  | Disagreement Focus          | Bad-Faith Realist Framing (Acceptable to Them)                                                                 | Misperception Theorist Framing (Acceptable to Them)                                                                 |
  | :-------------------------- | :------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ |
  | **Core Phenomenon**         | A non-trivial proportion of politically salient arguments from out-partisans are strategically deployed in demonstrable bad faith (knowingly false, insincere, purely tactical). | The overwhelming majority of perceived bad faith arises from systematic exposure distortions and cognitive biases; genuinely strategic bad faith is rare and over-attributed. |
  | **Default Stance**          | Assuming good faith by default in politically charged exchanges is often an epistemic *error* that leaves one vulnerable to exploitation by bad-faith actors. | Assuming good faith by default is an essential *corrective* to systemic exposure distortions, even if it occasionally leads to being misled by rare bad actors. |
  | **Origin of Perception**    | Perceptions of bad faith correlate strongly with the *actual* presence of strategically insincere argumentation tactics employed by out-group members. | Perceptions of bad faith correlate strongly with the *quantity and type* of out-group content consumed and the structural incentives of the medium, not the inherent dispositions of the out-group. |
  | **Cost of Error**           | The cost of false negatives (failing to detect genuine bad faith) is significantly higher for individual and collective epistemic health than the cost of false positives (mistakenly attributing bad faith). | The cost of false positives (mistakenly attributing bad faith) is significantly higher for discourse health and cross-group understanding than the cost of false negatives (occasionally missing genuine bad faith). |
  | **Epistemic Responsibility**| Groups exhibiting high levels of demonstrable bad-faith tactics bear primary responsibility for the erosion of trust; observers identifying it accurately are not at fault. | Attributors bear significant responsibility for calibrating their bad-faith detection mechanisms against systemic exposure biases, regardless of the out-group's actual behaviour. |

  **Cruxes: Pivotal Questions & Testable Predictions**  

  1.  **The Medium Crux (Chaperone Protocol)**  
      *   **Sub-Question:** Does perceived asymmetry in bad faith stem primarily from asymmetric behaviour or asymmetric perception amplified by the medium?  
      *   **Why it Matters:** Distinguishes whether the *medium itself* generates the illusion of asymmetry or merely reveals underlying behavioural asymmetry.  
      *   **Test:** Recorded political debates are analysed in real-time by independent, non-partisan chaperones flagging *only* sentences performing clear signalling work (not making claims). Chaperones are randomly assigned, trained on clear criteria, and blind to participant affiliation.  
      *   **Realist Prediction:** Flagging will cluster demonstrably and significantly more frequently on one identifiable camp/orientation.  
      *   **Misperception Prediction:** Flagging rates will be statistically symmetrical across camps; perceived pre-test asymmetry will collapse under neutral observation.  

  2.  **The Detection Crux (Swap Forum)**  
      *   **Sub-Question:** Can partisans accurately detect sincerity in out-group members defending out-group views? Whose detection capabilities are flawed?  
      *   **Why it Matters:** Tests the core claim about the source (exposure vs. disposition) of perceived insincerity.  
      *   **Test:** Participants from Camp A write and orally defend the strongest version of Camp B's position (and vice versa) before an audience drawn *only* from Camp B (for A defenders) and Camp A (for B defenders). Audiences score defenders on perceived sincerity. Some defenders are sincere in the view, some are role-playing.  
      *   **Realist Prediction:** Audiences will detect sincerity accurately *only* when defenders are from their *own* camp defending their *own* view (in-group detection advantage). Accuracy will be poor for out-camp defenders.  
      *   **Misperception Prediction:** Audiences will be poor at detecting sincerity *regardless* of the defender's camp when the view is the out-group view, due to inherent suspicion triggered by the content.  

  3.  **The Error-Cost Crux**  
      *   **Sub-Question:** Are the costs of false-positive (FP) and false-negative (FN) bad-faith attributions symmetric across camps and for discourse health?  
      *   **Why it Matters:** Determines the rational default stance (caution vs. charity) based on consequence severity.  
      *   **Test:** Rigorous qualitative and quantitative analysis of discourse sequences following recorded FP and FN attributions across diverse platforms/contexts. Measures include escalation, disengagement, reciprocity of suspicion, and willingness for future engagement.  
      *   **Realist Prediction:** FNs lead to greater exploitation, emboldenment of bad actors, and long-term trust erosion *within* the in-group observing the FN. FPs cause shorter-term friction but less systemic damage. Costs are asymmetric (FN > FP).  
      *   **Misperception Prediction:** FPs cause immediate and severe breakdowns in dyadic and group discourse, increase polarisation, and create self-fulfilling prophecies of distrust. FNs are recoverable errors. Costs are asymmetric (FP > FN). *Both predict asymmetry, but disagree on direction and which camp suffers more.*  

  4.  **The Exit-Cost Crux**  
      *   **Sub-Question:** Is the cohesion of epistemic communities primarily driven by external barriers to leaving (testimonial exclusion, social/professional risk) or by internal preference for insularity?  
      *   **Why it Matters:** Affects whether arguments within a chamber are "sincere" (given constraints) or inherently performative/insular.  
      *   **Test:** Anonymous surveys and behavioural experiments measuring perceived costs (social, professional, psychological) of engaging charitably with out-group sources or publicly dissenting from in-group orthodoxy, versus stated preferences for in-group information sources.  
      *   **Realist Prediction:** Stated preferences for insularity will correlate highly with actual behaviour; exit costs will be rated as moderate, but preference will be the dominant driver.  
      *   **Misperception Prediction:** Perceived exit costs (fear of ostracism, reputational damage) will be rated as very high and be the primary self-reported driver of engagement patterns, outweighing stated preference.  

  5.  **The Structural Incentive Crux (Added)**  
      *   **Sub-Question:** Does political identity or structural position (e.g., governing vs. opposition, high vs. low status) systematically incentivise bad-faith argumentation more in one camp?  
      *   **Why it Matters:** Tests the Realist claim that bad faith is a *strategic choice* tied to position, versus the Theorist claim it's perceived asymmetrically due to exposure.  
      *   **Test:** Analysis of argumentative tactics across different contexts (e.g., same party in government vs. opposition, high-status vs. low-status movements) controlling for platform and medium. Measures include strategic ambiguity, known falsehood repetition, and refusal to engage with counter-evidence.  
      *   **Realist Prediction:** Incentives for bad faith will correlate strongly with structural position (e.g., defending power, gaining power) regardless of specific ideology. Tactics will cluster accordingly.  
      *   **Misperception Prediction:** Perceived use of bad-faith tactics will correlate with the observer's structural position and exposure diet, not the speaker's structural position. Measured tactics will show no systematic asymmetry tied purely to position.  

  **Verbal Disputes:**  
  *   **"Bad Faith":** Significant disagreement exists on the threshold for labelling an act "bad faith." Realists often include *strategic insincerity* (e.g., using arguments one knows are weak but effective with a base, avoiding engagement). Theorists often reserve it for *knowingly false* claims. Clarifying operational definitions is crucial.  
  *   **"Sincere":** Theorists often use "sincere" to mean "expressing a believed view." Realists argue this ignores whether the belief *itself* is held for performative/affiliative reasons rather than truth-tracking reasons – a different layer of "sincerity."  
  *   **"Non-Trivial Slice":** The core quantitative disagreement hinges on this vague term. Is it 5%? 20%? 50%? This is less verbal and more empirical, needing the cruxes.  
  *   **"Tracking the Truth":** While both camps nominally value truth, their operationalisation differs. Realists see calling out bad tactics as truth-tracking; Theorists see building conditions for dialogue as foundational for truth-tracking. This reflects a deeper methodological disagreement about epistemology in adversarial settings.  

  **Drafter's Note:**  

  *   **Confidence in Agreed Claims:** High (8/10). These points reflect well-established dynamics in social psychology, media studies, and political science. I am confident representatives from both camps could endorse this list as describing the *landscape* accurately, even if they prioritise different elements. The most likely friction point is Claim 2 (Identity-Signalling Prevalence) – Realists might argue its *degree* is understated.  
  *   **Least Confident Line:** The final sentence of the Misperception Theorist framing in the Error-Cost crux table: "*Costs are asymmetric (FP > FN)*... *which camp suffers more.*" While core to their position, quantifying and attributing "suffering" causally across camps in a generalisable way is exceptionally difficult. Realists would strongly contest the claim that their camp suffers less from FPs.  
  *   **Change in a Room:** I would immediately focus on tightly defining "bad faith" and "sincerity" operationally for the purpose of the crux tests. The verbal disputes section highlights this need. Without shared definitions, predictions in the Detection and Medium cruxes become muddy. I would push for concrete examples both sides accept as clear-cut bad faith vs. sincere-but-wrong before finalising protocols.  
  *   **Overall:** This draft attempts rigorous neutrality. The Disagreements table is the hardest-won section. The value lies in forcing precise, testable predictions via the cruxes. Success depends on both camps accepting the *fairness* of the tests and the wording of their own positions. Realists might feel the "non-trivial slice" isn't emphasised enough in the crux predictions; Theorists might feel the structural forces are underplayed in the Realist framings. Getting them to sign the *Agreed Claims* and commit to the *Crux Predictions* is the achievable goal. The rest is the battleground. (Word Count: 1,185)
