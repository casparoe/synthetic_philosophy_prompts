answer: |-
  **MEMORANDUM**  
  **TO:** Programme Board, National Brain and Mind Research Programme  
  **FROM:** Methods and Standards Subcommittee  
  **SUBJECT:** Recommendation on First-Person Reports in Funded Projects  
  **DATE:** October 26, 2023  

  ### Background  
  This memo addresses the dispute over whether funded projects may treat first-person reports (e.g., verbal descriptions of conscious experience) as evidence *about subjective experience itself*, or solely as behavioral data to be explained by third-person measures. The Programme’s success metric—a validated, clinically usable measure of conscious experience—requires resolution of this issue ahead of the second call for proposals.  

  ### Key Considerations  
  **1. The Calibration Dilemma**  
  Any objective neural/behavioral marker of consciousness requires calibration against a known standard. First-person reports are the primary calibrator for conscious states (e.g., pain, visual awareness). If reports are *categorically* demoted to mere dispositions (per "Adopt-Rule"), the Programme risks incoherence: validating a consciousness measure without access to consciousness itself. The blindsight study exemplifies this; inconsistent reports are not "noise" but critical data reflecting graded awareness. No-report paradigms (e.g., post-decision confidence measures) still indirectly rely on prior report-based validation. *Conclusion: Barring reports as evidence jeopardizes the success metric.*  

  **2. Heterophenomenology: Methodological Scruple vs. Ontological Thesis**  
  - **Methodological Scruple**: Reports are context-dependent, malleable, and require rigorous controls (e.g., avoiding leading questions). **This is settled consensus.**  
  - **Ontological Thesis**: Reports disclose only a "heterophenomenological world" (the theorist’s construct), never subjective experience. **This is philosophically contested and not empirically resolvable.**  
  We would be voting **only on the methodological scruple**. Adopting the scruple *does not* entail adopting the ontological thesis. The latter remains a speculative position outside scientific adjudication.  

  **3. Standards for First-Person Reports as Evidence**  
  If reports are admitted, they must meet validation criteria analogous to third-person tools:  
  - **Trained methods** (e.g., micro-phenomenology, structured explication) must demonstrate:  
    - Protocol standardization (e.g., interview scripts, neutral elicitation).  
    - Inter-rater reliability in analysis.  
    - Corroboration by convergent measures (e.g., neural correlates, behavioral tasks).  
  - **Untrained reports** (e.g., spontaneous utterances) require stringent context documentation.  

  ### Recommendation  
  **Adopt-Scruple-Only**  
  - **Reasoning**: Mandating the *methodological scruple* ensures rigor (e.g., acknowledging report limitations, controlling for artifacts) without precluding trained first-person methods. This:  
    - Avoids the calibration paradox (reports remain valid calibrators).  
    - Permits applications like the blindsight study to use nuanced report analysis.  
    - Allows no-report paradigms, provided they acknowledge their indirect reliance on report-based constructs.  
  - **Strongest Counterargument Considered**: Strict heterophenomenologists argue that *any* appeal to first-person authority reintroduces unscientific dualism. However, this conflates methodological caution with ontological skepticism. Trained methods can produce public, replicable data without presupposing dualism.  
  - **What We Decline**: We reject "Adopt-Rule" (ontologically restrictive) and "Adopt-With-Carve-Out" (implies trained methods are exempt from scrutiny). "Decline-To-Legislate" invites methodological inconsistency.  

  ### Guidance for Applicants  
  - First-person methods must document validation (protocols, reliability, convergence).  
  - Projects using reports must address how context/elicitation affects data.  
  - Projects bypassing reports must justify how markers link to conscious experience *without circularity*.  

  This recommendation reflects consensus on methodological rigor while acknowledging legitimate philosophical disagreement on the nature of consciousness.  

  \answer{Adopt-Scruple-Only}
