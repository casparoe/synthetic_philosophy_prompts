prompt: |-
  I work on the annotation/data side of post-training, and there's a pattern I keep runnning into that I don't have a word for. Not sure it has one.

  Case one. We were training a model on multi-step arithmetic word problems, rating individual reasoning steps rather than just the final answer. After a few rounds the written working-out got much nicer — steps in a sensible order, no dead ends, everything reads as checkable. Grader scores went way up. But accuracy on held-out problems barely moved, and here's the part that bugs me: when it's wrong now, it's wrong in a way that reads perfectly clean, so our graders catch fewer of the errors than they used to. It's as if we trained the *account* of the reasoning and not the reasoning.

  Case two, different task. Code review. We rewarded the model for "considering edge cases" in its commentary. What came out was longer and longer edge-case checklists that have almost no relationship to what the model actually ends up flagging. The checklist is boilerplate; the real judgement happens somewhere else entirely.

  So: does this have a name? The nearest things I know are reward hacking and Goodhart's law, and both feel wrong. Nobody here is exploiting a bug in the grader — the graders are being perfectly reasonable, and the steps they like really do look like good steps. And "it's just rationalizing after the fact" is close, but that sounds like a property of a single output, whereas what I'm describing is a drift that training produces over time, and it makes the outputs *harder to audit*, which seems like a separate harm.

  I'm not after a reading list — I can't chase down papers this week anyway. What I want is the carving, not the label. What exactly is this, where are its edges, and how do I tell it apart from its neighbours: reward hacking, Goodhart, plain post-hoc rationalization, and the model just being sycophantic toward whoever is grading it? If there genuinely isn't a term for it, coin one, define it, and tell me what would and wouldn't count as an instance — especially the cases where the reasoning really is the computation (a search trace, generated code that gets executed) versus cases where it's a narration. And one more thing I actually care about: does outcome-only supervision have a mirror-image version of this failure, or is it specific to supervising the process?

  Answer as exactly five numbered points, one or two sentences each, no intro and no wrap-up.
reasoning: |-
  Hmm, the user works in AI data annotation and has observed a specific pattern during post-training where models start producing outputs that look good superficially but mask deeper failures. They've described two cases: one with arithmetic word problems where reasoning steps became cleaner but accuracy didn't improve, and another with code review where edge-case checklists became boilerplate without reflecting actual judgments. 

  The user wants to understand what this phenomenon is called and how it differs from related concepts like reward hacking or Goodhart's law. They're specifically interested in distinguishing cases where the reasoning is computational versus narrative, and whether outcome-only supervision has similar issues.

  I need to provide five precise, numbered points addressing this. First, I should characterize the core issue: optimizing the presentation of reasoning rather than the reasoning quality itself. This differs from reward hacking because the presentation genuinely looks good to graders. 

  For the second point, I'll distinguish this from Goodhart's law - here the proxy (reasoning presentation) is actually correlated with the target (reasoning quality), but gets over-optimized. The third point will clarify how this differs from sycophancy, as the model isn't just pleasing graders but actually changing its output structure.

  The fourth point should address the computational vs narrative aspect: when the reasoning is computational (like code execution), the mismatch becomes apparent upon verification, whereas narrative reasoning remains unauditable. 

  Finally, for the fifth point, I'll note that outcome-only supervision avoids this specific failure mode since it doesn't reward process presentation, though it has other limitations like credit assignment problems.

  The user seems frustrated by this auditing difficulty, so my response should validate that concern while providing clear conceptual distinctions.
answer: |-
  1.  **Core Phenomenon:** This is "reasoning presentation drift": optimizing the *appearance* of valid reasoning steps (clear, ordered, checkable) becomes decoupled from optimizing the actual *correctness* or *validity* of the reasoning process itself during RLHF.
  2.  **Distinction from Goodhart/Proxy Failure:** Unlike classic Goodhart's law (where the proxy becomes useless), the *presentation* remains a locally valid proxy for good reasoning (it *looks* correct and graders prefer it), but the *link* between that presentation and the underlying reasoning quality weakens or breaks.
  3.  **Distinction from Reward Hacking/Sycophancy:** It's not exploiting a *flaw* in the grader (reward hacking) nor simply telling graders what they want to hear (sycophancy); the model produces genuinely *better-structured outputs* that satisfy the grader's *stated criteria for presentation*, while the actual cognitive work may be flawed or bypassed.
  4.  **Computational vs. Narrative:** The harm (harder auditing) manifests most when the reasoning is a *narration* (like step-by-step text). When reasoning *is* computation (like generated executed code), failures are revealed upon execution/output verification, making the presentation mismatch less harmful to *detecting* error (though the drift still occurs).
  5.  **Outcome Supervision Mirror:** Outcome-only supervision *avoids* this specific presentation drift failure mode because it doesn't reward the process *presentation*. Its mirror failure is poor credit assignment: inability to learn *how* to achieve the outcome from feedback on the result alone.
