  Okay, this grad student is running a film night for their social ontology reading group, showing "The Lobster" and wants to connect it to David Lewis's conventions. They need a defendable reading using Lewis's framework, not just surface-level analysis. They're worried about misremembering Lewis and want corrections.

  First, let me recall Lewis's actual conditions for conventions. From memory: (i) regularity in behavior, (ii) mutual expectations of conformity, (iii) preference to conform given others do (coordination equilibrium), (iv) arbitrariness (alternative possible regularity), and (v) common knowledge. I should verify this. Yes, Lewis emphasizes it's a solution to coordination problems where the arbitrary convention is salient. Need to correct any errors in their recollection.

  The student raises three main questions. First, whether the hotel's trait-matching is a genuine convention. The arbitrariness condition is clearly met with various traits. But the preference condition is problematic—people conform to avoid transformation into animals, not due to mutual benefit. That makes it enforcement-driven, not a coordination equilibrium. The loners' system seems like an alternative convention, but enforced through mutilation. The gesture language between David and the woman is a purer example—spontaneous and mutually beneficial.

  Second, the issue of faked traits. John fakes nosebleeds, David fakes heartlessness. This creates a scenario where the coordinating feature is manufactured. Lewis's model assumes truthfulness in signaling, but here there's strategic deception. While cheap talk can be part of conventions, systematic deception might turn it into a different kind of game, like a signaling problem with misaligned incentives. The film shows how conventions can be gamed, which Lewis might not fully address.

  Third, the ending with David possibly blinding himself. This highlights how conventions, once established, become entrenched and costly. Lewis's account is synchronic, focusing on how conventions stabilize. The film adds a diachronic element, showing the path-dependence and sunk costs that make conventions sticky. David's potential self-mutilation illustrates the transition cost between equilibria, something Lewis acknowledges but doesn't deeply explore.

  The student also wants honesty about where the reading overreaches. The film's themes of loneliness and absurdity aren't fully captured by Lewis. Scenes focusing on emotional isolation, like David's brother as a dog, resist a purely game-theoretic reading. The ending's ambiguity—whether David blinds himself—might be more about despair than convention maintenance.

  Confidence level: High on the hotel not being a true convention and the gesture language being textbook. Moderate on the deception analysis, as Lewis has some tools but the film extends it. Lower on the diachronic claim, though it's plausible. Least sure about treating the loners as a rival convention since their system is also enforced. Overall, the reading holds but shouldn't overshadow the film's existential themes.
answer: |-
  Here’s a Lewisian reading of *The Lobster*, structured around your questions, with corrections to Lewis’s conditions (based on *Convention* 1969) and an assessment of where the film extends or challenges his framework. I’ll flag overreaches and confidence levels throughout.

  ---

  ### **Lewis’s Conditions (Corrected)**  
  A convention is a regularity *R* in behavior where:  
  1. **Conformity**: Almost everyone conforms to *R*.  
  2. **Expectation**: Almost everyone expects others to conform to *R*.  
  3. **Preference for Conditional Conformity**: Almost everyone *prefers to conform* to *R* *if* others do (i.e., it’s a coordination equilibrium).  
  4. **Arbitrariness**: There’s at least one *alternative regularity* *R'* that everyone would prefer to follow *if* others did too.  
  5. **Common Knowledge**: (1)–(4) are common knowledge.  
  *(Your recall was close! The key tweak: (iii) is about conditional preferences, not just "no conflict.")*  

  ---

  ### **Reading the Film**  
  **1. The Hotel’s Trait-Matching: A Failed Convention?**  
  - **Satisfies**:  
    - (i) Conformity: Guests actively seek shared traits.  
    - (ii) Expectations: Everyone expects others to pursue trait-matching (e.g., David’s courtship rituals).  
    - (iv) Arbitrariness: Nosebleeds, limps, or heartlessness are interchangeable "solutions" (brilliantly shown).  
  - **Fails**:  
    - **(iii) Conditional Preference**: Guests *don’t prefer conformity*; they conform to *avoid transformation*. This is **coercion**, not coordination. If others conformed to trait-matching, David would *still* prefer to escape (as he does).  
    - **Result**: The hotel’s system is a **sanction-backed norm**, not a Lewisian convention. It mimics convention superficially but lacks mutual benefit.  

  - **The Loners as Rival "Convention"?**  
    - Their anti-romance rules *also* fail (iii): Compliance is enforced by mutilation (e.g., the "red kiss" punishment). No one *prefers* celibacy if others comply; they fear violence.  
    - **Film’s Insight**: Switching equilibria requires **catastrophic breakdown** (escape to the woods) or **force** (the loners’ raids). You can’t transition incrementally—defectors are killed or mutilated. Lewis acknowledges path-dependence but underestimates violence’s role in equilibrium shifts.  

  - **David and the Woman’s Gesture Language: Textbook Convention**  
    - ✅ (i) They both use gestures regularly.  
    - ✅ (ii) Each expects the other to respond.  
    - ✅ (iii) They *prefer* to use gestures if the other does (secret communication is mutually beneficial).  
    - ✅ (iv) They could have used clicks, taps, etc. (arbitrariness).  
    - ✅ (v) Common knowledge is implied (exchanged glances).  
    **Verdict**: This is Lewis’s model perfected—self-enforcing, arbitrary, and emergent.  

  **2. Faked Traits: Can Lewis Handle "Camouflage Conventions"?**  
  - **The Problem**: John’s faked nosebleeds and David’s feigned heartlessness exploit the *arbitrariness* of traits. But when coordination relies on *mutable signals*, incentives to deceive explode.  
  - **Lewis vs. The Film**:  
    - **Your Friend (Cheap Talk)**: Lewis allows for conventions where signals are costless/fakeable ("cheap talk"). If everyone expects honesty (e.g., "nosebleeds = genuine"), deception might not disrupt the equilibrium.  
    - **Your Instinct (Signaling Problem)**: The film shows this fails. When conformity is compulsory (hotel) or punitive (loners), agents game the system. Traits become **camouflage**—signals detached from truth (e.g., the Heartless Woman tests David because she expects deception).  
  - **Who’s Closer? You are—but Lewis *almost* gets there**. Lewis assumes conventions stabilize when deception is suboptimal. Here, deception is *essential* to survive. The film exposes a gap: **When incentives to misrepresent are structural (not incidental), conventions morph into "signaling traps."** Traits aren’t coordinating devices; they’re weapons.  

  **3. The Ending: Conventions as Costly Compulsions**  
  - David’s potential self-blinding illustrates how conventions **ossify**:  
    - **Diachronic Claim**: Initially arbitrary traits (short-sightedness) become *essential* to identity ("our only shared trait!"). The hotel’s ideology ("shared flaws = true love") reinforces this.  
  - **Lewis’s Gap**: His model is synchronic—it explains *why* a convention sticks, not how it acquires **moralized weight** over time. The film shows that once a convention is entrenched:  
    - Alternatives vanish (loners offer no other partnership model).  
    - Defection costs soar (blindness, animal transformation).  
  - **Film’s Addition**: David’s act isn’t just about restoring coordination; it’s **despair at inescapable arbitrariness**. Lewis notes path-dependence but doesn’t grapple with conventions becoming cages.  

  ---

  ### **Where the Reading Overreaches**  
  - **Flattens Existential Themes**: Reducing David’s relationship to "coordination" ignores the film’s critique of loneliness (e.g., his bond with the dog/Bob). The bathroom scene is more about **existential choice** (embracing absurdity) than restoring equilibrium.  
  - **Resistant Scenes**:  
    - The hotel manager’s deadpan speeches satirize bureaucratic logic—not just enforcement.  
    - The loners’ dances (staged joy) highlight performative freedom, which Lewis’s dry framework can’t capture.  
  - **Overclaim**: Calling the loners a "rival convention" is shaky—their rules are pure coercion, not mutual benefit.  

  ---

  ### **Confidence Assessment**  
  - **Lewis Reconstruction**: 95% confident (minor quibbles: "preference" is scalar for Lewis; common knowledge is technical).  
  - **Overall Reading**: 80% confident. The hotel/loner systems as *non-conventions*, the gesture language as *textbook*, and the ending as *diachronic critique* hold strong.  
  - **Least Confident Claim**: That faked traits create a **signaling trap** distinct from Lewis. Lewis *can* model deception (e.g., conventions with lying costs), but the film’s systemic fraud might be an edge case he didn’t anticipate (60% confident).  

  ---

  ### **Why This Works for Your Group**  
  This reading doesn’t just "point at the screen"—it uses Lewis to expose **three layers of social failure** in the film:  
  1. The hotel: Conventions corrupted by force.  
  2. The loners: Coordination impossible under terror.  
  3. The lovers: A "pure" convention destroyed by enforcement.  
  The ending becomes a tragic punchline: When conventions collapse, **arbitrariness doesn’t set you free—it demands mutilation**. That’s philosophy doing work.  
    
  **Final Tip**: Start discussion by asking: *"If David blinds himself, is he upholding a convention or surrendering to one?"* That bridges Lewis and the film’s human core.
