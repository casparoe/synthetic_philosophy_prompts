  We are designing a decision procedure for a foundation that incorporates lexical negative utilitarianism (LNU) with a severity threshold. The key features are:
   1. Suffering above a certain threshold lexically dominates any amount of below-threshold suffering and is not offset by pleasures.
   2. The procedure must be executable by program officers without philosophy training in about 40 minutes per application.
   3. It must produce a clear fund/don't fund/send back for more info decision and a half-page reasoning for donors.
   4. The board wants to know where they can overrule and won't be bound.

   We break the procedure into ordered questions. The procedure will have explicit stopping points for "no" and points where it hands off to human judgment.

   Definitions:
   - We have a six-rung "suffering ladder" (let's label rungs 1 to 6, with 6 being the worst).
   - We assume there is a fixed threshold rung (say, T) above which suffering is lexical. (T must be set by the board and revisited periodically, e.g., annually.)
   - We assume that the threshold applies to individual episodes of suffering (not a whole life) and that sub-threshold suffering cannot sum to cross the threshold (so the lexical threshold is about the intensity of an experience, not cumulative).

   The Procedure Outline:

   I. Initial Check: Eligibility and Basic Requirements (if not met, send back for more info or reject)
   II. Assessment of Suffering Severity and Probability of Crossing the Threshold
