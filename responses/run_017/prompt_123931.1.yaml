      So the rule: If the intervention has a probability >= P of preventing at least one instance of suffering at or above the threshold, then it is in the running. The number of such instances (and the probability of each) matters for the overall impact, but we are not doing expected value calculations. Instead, we need a way to compare two interventions that both have above-threshold potential.

