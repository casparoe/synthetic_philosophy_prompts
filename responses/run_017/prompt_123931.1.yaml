          Rule: 
              - Calculate the expected above-threshold episodes caused (E_caused) in the same way as prevented (E_prevented). 
              - Then the net expected above-threshold episodes = E_prevented - E_caused.

              - If net is positive, then we use net as E (the benefit).
              - If net is negative, then the intervention is harmful and we reject.
              - If net is zero, then we reject (since we don't want to fund something that causes as much above-threshold suffering as it prevents).

          But note: causing one above-threshold episode is infinitely bad? Actually, in LNU, we are trying to minimize the number of above-threshold episodes. Therefore, net expected count is acceptable.

