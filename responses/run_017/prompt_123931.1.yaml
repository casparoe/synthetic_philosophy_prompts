          - "Send back for more info"

      Then, the foundation aggregates the candidates and funds the top by E until the budget is exhausted.

   III. Pleasure and Pain Offset:

      According to LNU, pleasures do not offset suffering above the threshold. For below-threshold, we are not funding anyway. Therefore, we do not consider pleasure in the above-threshold case. For below-threshold, even if there are pleasures, we do not fund.

