          Therefore, we count the prevention of an existence that would have included above-threshold suffering as preventing one episode of above-threshold suffering? Actually, it prevents the entire life of suffering, but note our threshold is per episode. We must define: does the life include at least one episode above the threshold? If yes, then preventing that life prevents at least one above-threshold episode.

          How to count: if the intervention reduces the number of individuals by N, and each of those individuals would have had at least one above-threshold episode with probability Q, then the expected above-threshold episodes prevented by the reduction is N * Q.

          But note: we are also affecting the suffering of the individuals that still exist. So we must account for both.

