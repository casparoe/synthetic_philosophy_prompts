      - It requires data on suffering severity, probabilities, and counterfactuals that might be hard to get.
      - It does not consider equity, fairness, or other values.
      - It might reject interventions that are highly valued by donors and beneficiaries.

      When the officer hits a point where the evidence is too uncertain or the application is ambiguous, they should write: "There is insufficient evidence to determine [specific point]. Request more information from applicant. If information is not available, this application cannot be assessed by the procedure and requires board discretion."

      The board should review the severity table annually and review T and P annually.

      This procedure is an implementation of a specific ethical view. If the board does not fully endorse that view, they should adjust the procedure.

      Now, we write the procedure in a step-by-step form for the program officer.
answer: |-
  ### Lexical-Threshold Negative Utilitarian (LTNU) Funding Procedure  
  **For program officers with public-health/veterinary backgrounds (target: 40 min/application)**  
  **Output:** Fund / Do Not Fund / More Info Needed + Half-page donor-friendly reasoning.  
  **Board overrule points:** Explicitly flagged at Steps 2a, 2b, 3, and 5. Board may overrule any step but must document why.  

  ---

  ### Step-by-Step Procedure  
  **Key Definitions**  
  - **Suffering ladder:** 6 rungs (1 = mild, 6 = severe agony).  
  - **Lexical threshold (T):** Fixed at **Rung 5** (set by board; revisit annually). Suffering ≥T cannot be offset by pleasure or aggregated from sub-T suffering.  
  - **Episode:** A single occurrence of suffering (e.g., one painful procedure, one day of untreated pain). Duration/intensity product defines rung (see **Severity Table**).  
  - **Probability threshold (P):** Minimum 10% chance of success (set by board; revisit annually).  

  #### **Step 1: Initial Check**  
  - **Questions:**  
    - Is the application complete? Does it describe suffering, intervention, and counterfactual?  
    - Does it fall within health/animal welfare?  
  - **Decision:**  
    - ▶️ If "no" to either: **More Info Needed**.  
    - ▶️ Else: Proceed.  

  #### **Step 2: Severity Assessment**  
  - **Questions:**  
    - **2a.** What is the **worst episode** of suffering addressed? Assign a rung using the **Severity Table** (below).  
    - **2b.** Is this episode ≥ **T (Rung 5)**?  
  - **Rules:**  
    - Sub-T suffering **never sums** to cross T (e.g., 100 Rung-4 episodes << 1 Rung-5 episode).  
    - **Life vs. episode:** Threshold applies per episode (e.g., chronic pain = many episodes).  
  - **Decision:**  
    - ▶️ If **< T**: **Do Not Fund** (skip to Step 6).  
    - ▶️ If **≥ T**: Proceed.  
  - **Board overrule:** May adjust rung assignment if evidence misapplied.  

  **Severity Table** (Illustrative; finalize with board)  
  | Rung | Animal Example                     | Human Example                     | Intensity-Duration Product |  
  |------|------------------------------------|-----------------------------------|----------------------------|  
  | 6    | Live scalding, untreated trauma    | Severe burn pain, torture         | Extreme intensity + hours  |  
  | 5    | Ineffective stunning, bone cancer  | Unmedicated childbirth, amputation | High intensity + minutes   |  
  | 4    | Crowded transport, moderate injury | Dental abscess, severe flu        | Moderate intensity + days  |  
  | 1-3  | Mild stress, hunger                | Boredom, minor aches              | Low intensity + any duration |  

  #### **Step 3: Threshold Probability**  
  - **Questions:**  
    - **3a.** What is the probability the intervention **prevents ≥1 episode ≥T**? (e.g., 10% chance of ending agony for 1,000 individuals = 100 expected episodes prevented).  
    - **3b.** Is this probability **≥ P (10%)**?  
  - **Rules:**  
    - Ignore sub-T suffering/pleasure (they don’t offset ≥T).  
    - **Uncertainty:** Use conservative estimates (e.g., if evidence coarse, take lower bound).  
  - **Decision:**  
    - ▶️ If **< P**: **Do Not Fund**.  
    - ▶️ If **≥ P**: Proceed.  
  - **Board overrule:** May adjust probability if overly pessimistic/optimistic.  

  #### **Step 4: Counterfactual & Substitution**  
  - **Questions:**  
    - **4a.** **Without intervention**, will ≥T suffering occur?  
    - **4b.** Does the intervention change **who exists** (e.g., alters animal/human populations)?  
    - **4c.** Does it cause **substitution leakage** (e.g., reduces chicken suffering but increases fish consumption)?  
  - **Rules:**  
    - If new individuals are created, their ≥T suffering **counts as harm** (e.g., funding factory farms that breed more animals = net harm).  
    - If substitution increases ≥T suffering elsewhere, **deduct** expected episodes.  
  - **Decision:**  
    - ▶️ If net expected ≥T episodes prevented **≤0**: **Do Not Fund**.  
    - ▶️ Else: Proceed.  

  #### **Step 5: Gaming Check**  
  - **Questions:**  
    - **5a.** Compare severity claim to past applications for **similar conditions** (use foundation’s database).  
    - **5b.** Is the claim **≥0.5 rungs higher** than historical median without new evidence?  
  - **Rules:**  
    - If "yes," **downgrade to historical median rung** and revert to Step 2b.  
  - **Decision:**  
    - ▶️ Proceed with adjusted rung.  
  - **Board overrule:** May accept inflated claim if new evidence provided.  

  #### **Step 6: Final Decision & Reasoning**  
  - **Output:**  
    - **Fund** if all steps passed.  
    - **Half-page reasoning template:**  
      > "We fund [Intervention] because it addresses [Rung X] suffering (≥T). It has a [Y]% chance of preventing [Z] episodes of such suffering, after accounting for risks and substitutions. We do not weigh lower suffering or pleasure against this threshold, per our mandate."  
  - **Tiebreaker:** If budget constrained, prioritize highest expected ≥T episodes per dollar.  

  ---

  ### Test Cases  
  #### **Case 1: Poultry Stunning Retrofit**  
  - **Step 1:** Complete, animal welfare. ✅  
  - **Step 2a:** Ineffective stunning (historical median: Rung 5). ✅  
  - **Step 2b:** ≥T. ✅  
  - **Step 3a:** 90% chance of preventing 1M birds × 1 episode (ineffective stun) = 900K expected episodes. ✅  
  - **Step 3b:** ≥10%. ✅  
  - **Step 4:** No population change; substitution risk low (audited). Net episodes = 900K. ✅  
  - **Step 5:** Claim matches history. ✅  
  - **Decision:** **Fund**.  
  - **Reasoning:**  
    > "We fund the retrofit because it prevents Rung-5 suffering during slaughter. It has a 90% chance of preventing 900,000 episodes of agony, with minimal substitution risk."  

  #### **Case 2: Palliative Care Programme**  
  - **Step 1:** Complete, health. ✅  
  - **Step 2a:** Terminal cancer pain = Rung 6. ✅  
  - **Step 2b:** ≥T. ✅  
  - **Step 3a:** 30% chance of preventing 10K patients × 30 days of Rung-6 pain = 90K expected episodes. ✅  
  - **Step 3b:** ≥10%. ✅  
  - **Step 4:** Regulatory capture risk could divert opioids, causing addiction (Rung 4, ignored). Population unchanged. But substitution: If opioids reduce demand for euthanasia, may increase net suffering. ❌ **More Info Needed** on leakage.  
  - **Decision:** **More Info Needed** (Step 4c unresolved).  
  - **Reasoning:**  
    > "While targeting Rung-6 suffering, we lack data on whether eased access increases net agony via substitution. Provide evidence on euthanasia/diversion impacts."  

  #### **Case 3: Music/Playground Programme**  
  - **Step 1:** Complete, health. ✅  
  - **Step 2a:** Mild distress/boredom = Rung 2 (per Severity Table). ✅  
  - **Step 2b:** < T (Rung 5). ❌  
  - **Decision:** **Do Not Fund**.  
  - **Reasoning:**  
    > "This program addresses only Rung-2 suffering, which falls below our threshold for lexical harm. We cannot offset this by its pleasure benefits under our mandate."  
  - **Board note:** This is where board may overrule (e.g., "We value pleasure enough to fund anyway").  

  ---

  ### Limitations & Failure Modes  
  1. **Values-locked tradeoffs:**  
     - **Cannot handle:** Cases where pleasure/sub-T suffering is deemed morally relevant (e.g., music program).  
     - **Officer action:** Flag for board override. Write: "Application rejected per LTNU rules, but involves valued sub-threshold benefits."  

  2. **Unquantifiable uncertainty:**  
     - **Cannot handle:** When probabilities are too vague (e.g., "regulatory capture possible").  
     - **Officer action:** **More Info Needed**. Write: "Insufficient data to assess threshold probability."  

  3. **Small probabilities:**  
     - **Misfire:** May fund low-probability, high-severity interventions over high-probability, moderate-severity ones (e.g., 1% chance to prevent torture vs. 100% chance to prevent Rung-4 suffering).  
     - **Mitigation:** Board sets **P** carefully (e.g., P=10% avoids extreme speculation).  

  4. **Threshold arbitrariness:**  
     - **Misfire:** Misclassifying near-threshold suffering (e.g., Rung 4.9).  
     - **Mitigation:** Annual review of Severity Table with board + calibration against real-world cases.  

  5. **Cross-border effects:**  
     - **Failure point:** Substitution leakage in global supply chains (e.g., reducing suffering in one country increases it elsewhere).  
     - **Officer action:** Require applicant analysis. If absent, **More Info Needed**.  

  ### Implementation Notes  
  - **Who sets arbitrary lines:** Board sets **T**, **P**, and **Severity Table** annually, informed by program officer data logs.  
  - **Calibration maintenance:** Officers log all rung assignments; annually, board reviews for inflation/deflation.  
  - **When judgment is unavoidable:** Steps 2a (rung assignment), 3a (probability), and 4 (counterfactuals) require officer judgment. Document assumptions transparently.  
  - **Donor communication:** Emphasize that the procedure prioritizes preventing "unredeemable agony" as defined by board values.  

  ---  
  This procedure bites the bullet: no aggregation of sub-T suffering, no pleasure-pain offset, and a hard threshold. It streamlines LTNU into actionable steps while exposing where values (e.g., "Is Rung 5 the right cutoff?") drive decisions. Run it for 3 months on dummy applications to refine before full rollout.
