      b. Is the intervention within our funding areas (health and animal welfare)? If not, reject.
      c. Is the organization legally eligible? If not, reject.

   II. Suffering Severity and Threshold Crossing:

      We are concerned with the worst suffering that the intervention prevents (or alleviates) per individual affected.

      a. What is the worst type of suffering that the intervention targets? (Map to our six-rung ladder.)
          - Officer must assign a rung based on the description. If the application uses a term like "agony", require specific evidence (e.g., physiological indicators, behavioral signs).
          - If the officer cannot assign a rung due to lack of information, send back for more info.

      b. Is the worst suffering at or above the threshold rung T? (T is set by the board, e.g., rung 5 or 6.)
          - If yes, then we are in the lexical domain. Proceed to II.c.
          - If no, then the suffering is below the threshold. Proceed to II.d.

      c. For above-threshold suffering:
          - Estimate the probability that the intervention successfully prevents one episode of suffering at or above the threshold. (This is the probability that the intervention works as intended and that the suffering is indeed above T and is prevented.)
          - If this probability is above a certain threshold P (set by the board, e.g., 10%), then the intervention is a candidate for funding. Note: We do not require a high probability because even a small chance of preventing above-threshold suffering might lexically dominate. But we must set a minimum bar to avoid funding extremely speculative projects. The board must set P and revisit annually.
          - If the probability is below P, then reject.

      d. For below-threshold suffering:
          - We do not fund based on this alone, because below-threshold suffering is lexically dominated by above-threshold suffering. However, if the intervention also addresses above-threshold suffering (which would have been handled in II.c), then we consider the below-threshold part as a bonus but not a primary reason.
