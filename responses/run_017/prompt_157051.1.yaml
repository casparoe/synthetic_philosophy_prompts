prompt: |-
  I'm a novelist and I've somehow ended up on the jury for a translated-fiction prize — six of us, two long weekends a year, a longlist of about a hundred and fifty down to one winner. The disagreements are brutal and mostly can't be settled by anyone reading harder, and I'm bad at them: I either dig in or cave inside five minutes, and I can't tell which one I'm doing at the time.

  Half the books are in languages only one or two of us read, so half the time I'm arguing about a translation I can't check against the original; and we deliberate in the same room after reading each other's notes, so I suspect our verdicts aren't independent evidence at all, whatever that ought to mean for how much I move.

  What I want is a procedure I can actually run in the ten minutes before each meeting and again when we deadlock, for how much to shift when the others disagree with me. The stuff I half-remember about disagreement between peers seems built for factual disputes, where there's one thing that's true and we're both trying to find it, but "the ending doesn't earn itself" or "this is the most alive book on the list" doesn't obviously work like that, and the output isn't my belief anyway, it's a joint list I put my name to. So give me the questions in order, what counts as a decent answer to each, where the procedure stops with a no, and where it hands the decision back to us because it's a row about what the prize is for rather than a matter of evidence. It has to handle the cases where the other person has evidence I can't get at, like the original; where they know that literature far better than I do; where I'm the only one who loves the book; and where going along means signing a citation I think is wrong. Then run it on two: a book only I can read in the original that the other five are lukewarm about, and the book I found and fought for and should probably drop.

  Please write it as continuous prose, no headings, bullets, bold or tables — like an email to a friend. Don't worry about typos, its fine.
reasoning: |-
  Hmm, the user is a novelist serving on a jury for a translated-fiction prize. They're struggling with disagreements during deliberations. The conflicts are intense and often about subjective judgments like "the ending doesn't earn itself," rather than factual disputes. They feel torn between stubbornly defending their position or giving in too quickly. 

  The user faces unique challenges: many books are in languages only one or two jurors understand, so they can't verify translations against originals. Deliberations happen in person after sharing notes, which might bias independent judgment. They need a practical 10-minute procedure to decide how much to adjust their stance when others disagree, especially before meetings or during deadlocks.

  Key issues they highlighted:
  - Arguments involve untestable aesthetic claims.
  - They must co-create a joint list, not just hold personal beliefs.
  - Specific scenarios: defending a book only they read in the original, or dropping one they championed but might be overattached to.

  The user wants this framed as continuous prose—no bullet points—like an email to a friend. I should keep it conversational and empathetic.

  For the procedure, I need to design something that:
  - Handles epistemic asymmetry (e.g., others knowing a literature better).
  - Addresses when disagreement stems from prize philosophy vs. evidence.
  - Outputs either a clear adjustment ("shift X%") or flags unresolvable conflicts.
  - Works for their two test cases.

  Core philosophical tension: Bayesian peer disagreement models assume shared truth-seeking, but here the "truth" is intersubjective (what deserves the prize). The procedure must blend rationality with jury duty pragmatism.

  Structure the procedure as a decision tree in prose:
  1. Start by diagnosing the disagreement's nature: is it about evidence (e.g., translation quality) or values (what the prize prioritizes)? 
  2. If evidence-based, assess access asymmetry: can the dissenter share insights? If not, defer more.
  3. If values-based, check alignment with prize criteria. If misaligned, it's a "row," not evidence.
  4. Quantify shift based on confidence and stakes (e.g., signing a wrong citation).
  5. For their scenarios: 
     - Book only they read: if others cite translation flaws they can't verify, shift significantly unless they suspect cultural misreading. 
     - Book they fought for: if attachment drives their stance, shift unless core criteria are met.

  Emphasize self-checks for bias ("am I lone defender due to ego?"). End by affirming that deadlocks are okay—it means the process works.
answer: |-
  Okay, novelist friend, steeped in the glorious bloodsport of literary juries. I hear you. That room sounds like a pressure cooker where aesthetic convictions replace steam, and the whole "independent evidence" thing dissolves faster than cheap tea. Factual disagreement frameworks feel like bringing a protractor to a knife fight when the fight is about whether the *knife* is beautiful or just sharp. What you need is a pre-meeting mental checklist, something to run quietly in your head when the temperature rises or the deadlock clangs shut, to figure out *how much* to budge, *when* to plant your flag, and *when* to just sigh and say "This isn't resolvable, we need to vote or flip a coin or something." Here’s a stab at it, designed for speed and the messy reality you described. Think of it as your internal moderator.

  Start here, *before* the meeting proper, when you feel that familiar twinge of "Oh god, they're going to hate my darling" or "Why are they so blind to *that* book's flaws?" Run through these questions in order. Be brutally honest with yourself. The goal isn't to win, but to calibrate your own stance responsibly within the collective insanity.

  **First Question: Is this disagreement fundamentally about *evidence accessible only to them*, or about *interpretation/aesthetic judgment*?** This is your primary filter. Be specific about *what* they're disagreeing on. Are they saying "The prose in the original is actually quite flat, the translator elevated it" (Evidence: Original Text)? Or "The character's motivation is incoherent" (Interpretation)? Or "This doesn't feel like it belongs on a *best* list" (Aesthetic Judgment/Criteria)? Your decent answer is pinning down the *core point* of contention. If it's *clearly* about evidence you *cannot* access (like the quality of the original text, and you don't read the language), the procedure pushes you significantly towards shifting. Not capitulating blindly, but acknowledging their privileged access. If it's about interpretation or judgment, proceed.

  **Second Question (If Interpretation/Judgment): Does their perspective reveal a *genuine blind spot* in my reading, based on expertise or context I lack?** Are they deeply steeped in that literary tradition? Do they point out historical, cultural, or formal nuances I genuinely missed, even in translation? ("You missed how this structure parodies 19th-century serials common in that language," or "That character's actions make sense within cultural context X"). A decent answer isn't just "They know more," but "They've shown me something *specific* I overlooked that materially changes my reading of the book." If YES, shift meaningfully – they've added evidence *to the room*, even if it was always in the text. If NO (it's just a different taste, or they haven't illuminated a specific gap), proceed.

  **Third Question: Is my position driven by unique attachment or discovery bias?** Be harsh here. Is this *the* book you fought to get on the longlist? The one you found? Does its brilliance feel personal? Conversely, for the book you dislike, is it just rubbing you the wrong way for nebulous reasons? A decent answer acknowledges the emotional tug. If YES, you need to discount your own position *somewhat*. You're likely over-egging its virtues or underplaying its flaws. Shift internally to compensate for your bias, but don't abandon ship yet. Proceed to gauge the *substance* of the disagreement. (If NO, proceed straight on).

  **Fourth Question: What is the *stakes* of shifting for me on this specific point?** Is it about a minor quibble in an otherwise solid citation? Or is it about the core reason the book deserves to win (or not win), meaning shifting would force you to endorse a statement you find fundamentally *wrong* in the final citation? ("The poetry of the prose" when you think it's clunky, or "A searing indictment" when you found it shallow). A decent answer honestly confronts the integrity cost. High stakes (signing a lie) means you shift *less*, or not at all, potentially forcing a principled stand or deadlock. Low stakes (agreeing a subplot is weak when you thought it was okay) means shift more easily. This interacts with the evidence questions – if they have privileged evidence on a high-stakes point, you *still* might need to shift significantly, however painful.

  **Fifth Question: Is the core disagreement actually about *what this prize is for*?** Are they arguing from a completely different set of values? ("This prize should reward formal innovation!" vs. "It should champion emotional power!" vs. "It must represent the current zeitgeist of Country X!"). This often hides behind specific criticisms ("The ending is unearned" might really mean "It's too conventional for an *innovative* prize"). A decent answer identifies if the clash is over fundamental criteria, not the book itself. If YES, this is where the procedure **stops with a NO**. You've hit bedrock. No amount of re-reading or evidence-sharing will resolve it, because you're not arguing about the same goal. Flag it: "Okay, I think we're actually disagreeing about what 'best' means here. Should we revisit the prize criteria briefly or just acknowledge this is a values clash?" Hand it back to the room for meta-discussion or voting. No shifting calculation applies; it's a foundational impasse.

  **Where it hands back:** As above, fundamental prize-criteria clashes. Also, if after honestly running through 1-4, you genuinely feel the weight of evidence (including their privileged access or revealed blind spots) *demands* a shift you simply cannot make in good conscience (high stakes + conviction). Then you say, "I've listened, I understand your points about the original/context, but I fundamentally cannot agree with that assessment of the book's core achievement/flaw." You're deadlocked on principle. Time for a vote.

  **Running it on your two scenarios:**

  1.  **The Book Only You Read in the Original (Others Lukewarm):** Start Q1: Their lukewarmness is likely judgment/aesthetic ("didn't connect," "pacing off"). Not inaccessible evidence (unless they critique the *translation* specifically, which they can't access the original for – then shift significantly on *that point*). Q2: Do they illuminate a blind spot? Maybe, if they contextualize *why* it might not resonate cross-culturally in a way you missed. If so, shift. Q3: Unique attachment? Possibly, if you championed it *because* you saw the original's magic. YES – discount your enthusiasm slightly. Q4: Stakes? High if them being lukewarm means it drops out entirely and you think it's truly great in the original. You might shift *a little* based on Q2/Q3, but hold firm overall. If they haven't shown a specific blind spot (Q2 NO), and stakes are high (Q4 YES), you probably don't shift much. Outcome: You argue its original merits harder, knowing your bias but also your unique evidence.
  2.  **The Book You Found and Fought For (Should Probably Drop):** Q1: Others' criticisms are likely judgment/aesthetic. Q2: Blind spot? *Crucial*. Are they pointing out flaws you were blind to *because* you found it? ("The middle sags," "Character Y is a caricature")? If their points resonate *even slightly* as valid critiques you brushed aside, YES – shift significantly. This is discovery bias in action. Q3: Unique attachment? Definitely YES. Discount your position *heavily* upfront. Q4: Stakes? If dropping it means just losing *your* favorite, stakes are medium. If forcing it through means signing a citation overstating its merits, stakes are high. Given strong YES in Q2 (they show valid flaws) and Q3 (your bias), you *should* shift a lot, maybe even drop the fight unless the flaws feel minor *even after* discounting your bias. Outcome: You likely concede, gracefully, knowing you were over-committed.

  Remember, this isn't about becoming a pushover or a bulldozer. It's about introducing a moment of disciplined self-interrogation before the fray, to make your inevitable digging in or caving more defensible – to yourself and the ghost of literature future. Sometimes the answer *is* "Hold the line." Sometimes it's "Retreat, you fool." Sometimes it's "This isn't a fight about the book, it's a fight about the prize, and we need a different room." Good luck in the trenches. May the best book win, even if it’s not yours. Pour a stiff drink afterwards. You’ve earned it.
