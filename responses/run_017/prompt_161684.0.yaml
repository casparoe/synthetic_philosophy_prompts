  Here’s a toast that threads the needle—short sentences, one crowd-crossing joke, Hal’s logic dissected plainly, and a runway for his friend’s entrance without spoilers.  

  **(Clink glass. Pause for quiet.)**  

  Good afternoon, everyone. We’re here for Hal.  
  Seventy years. That’s a lot of theorems. And lawn-mowing at 6 a.m. Sundays. *(Smile. Neighbors chuckle; logicians nod.)*  

  This party? Hal said it couldn’t happen.  
  His famous argument: if you know the window—say, "sometime this week"—you’d deduce the day. No surprise possible.  
  Well. Today at 2 p.m., he walked in. Said aloud: "I did not see this coming."  
  *(Pause. Gentle laughter.)*  

  So what broke? Raj—where’s Raj? Ah, lurking philosophically—always argued: if the window *has no end*, the logic stalls.  
  Tell someone "someday, maybe years off, a party!" No last day to rule out. Surprise survives.  
  Hal called that cheating. But maybe Raj had a point.  

  Hal’s own unpublished answer? "Surprise" isn’t about *can’t deduce*. It’s about *don’t think to*.  
  You stop watching. Life distracts you.  
  That’s why today worked. In March? Hal would’ve guessed. By November? He forgot to look.  
  The verdict? His proof assumed we’re always vigilant. But humans aren’t watchtowers. We get busy. We mow lawns. *(Nod at neighbors.)*  

  That’s the grace in this. Surprise parties aren’t paradoxes.  
  They’re reminders: we’re seen when we’re not looking. Celebrated when we’re caught off-guard.  
  Hal—you spent twenty minutes in the corner rethinking your life’s work. We owe you that. But right now? Just enjoy the cake. *(Raises glass.)*  

  To Hal. Who taught us that truth bends—but joy doesn’t.  
  May your surprises always be this loud.  
  And may your lawn… remain eternally trim.  

  **(Sit down immediately. Hal’s friend enters from kitchen as applause fades.)**  

  ---

  **Why this works:**  
  - **The Joke:** *"Lawn-mowing at 6 a.m. Sundays"* lands universally. Logicians get the "real-world" gag; neighbors know Hal’s quirk.  
  - **Raj’s Point:** Simplified to *"someday, maybe years off"* → no last day → surprise possible. No seminar needed.  
  - **Hal’s Verdict:** One clear sentence: *"His proof assumed we’re always vigilant. But humans aren’t watchtowers."*  
  - **The Hanging Paradox:** Nodded at with *"no last day to rule out"* (core of the "unexpected hanging" version). No gallows.  
  - **Second Surprise Setup:** Ends on *"may your surprises always be this loud"*—affectionate, not suspicious. Handoff is seamless.  
  - **Sentiment Without Schmaltz:** Focuses on "seen when not looking"—true, earned, and very Hal.  
  - **Pacing:** Short sentences. Logical beats separated by warmth. Ends before 3 minutes.  

  **Hal’s Corner-Thought Process Solved:**  
  He assumed perfect rationality + constant attention. Real humans have neither. Today proved it—and his own unpublished hint cracked it. The toast lets him save face while being celebrated. And Raj? He’ll toast you later from the kitchen.
