answer: |-
  Here's the menu of distinct interpretations for "if you don't vote, you can't complain," with verdicts and pivot-probability engagement:

  1.  **Standing/Forfeiture:** Abstaining waives your moral right to object to outcomes. *Verdict:* Substantive but contested; requires arguing why voting is the *only* legitimizing act. *Pivot:* Routes around – forfeiture is based on the *act* of non-participation, not its causal impact.
  2.  **Fair Play/No Free Riding:** You benefit from the democratic system others maintain; abstaining while benefiting is unfair. *Verdict:* Substantive and defensible (if system is reasonably just). *Pivot:* Routes around – focuses on enjoying collective goods others produce, regardless of your marginal contribution.
  3.  **Expressive Consistency:** Complaining expresses dissatisfaction, but abstaining signals indifference or refusal to contribute minimally; the actions conflict. *Verdict:* Substantive and plausible (hypocrisy charge). *Pivot:* Engages weakly; pivot prob makes voting *instrumentally* insignificant but doesn't negate its *expressive* cost/signal.
  4.  **Generalization (What If Everyone?):** If everyone abstained, democracy collapses; your duty is conditional on others' compliance. *Verdict:* Substantive but dies to pivot paradox. *Pivot:* Dies – your abstention doesn't cause collapse, making the duty feel irrational.
  5.  **Consent/Lottery Acceptance:** By not participating, you accept any outcome as legitimate, like skipping a raffle. *Verdict:* Weak/False; voting isn't a lottery ticket purchase, and non-participation ≠ consent. *Pivot:* Engages minimally; pivot prob reinforces why it feels unlike consenting to a raffle.
  6.  **Epistemic:** Non-voters lack standing because they likely lack knowledge/engagement. *Verdict:* Often false/trivial; voting requires minimal knowledge, engagement varies. *Pivot:* Routes around – focuses on perceived legitimacy of the complainer, not causal impact.
  7.  **Descriptive/Norm Enforcement:** It's a social norm: non-voters *will* be shut down when complaining, regardless of logic. *Verdict:* Trivially true as description; norm's *value* is separate. *Pivot:* Routes around – purely about social reaction, not justification.
  8.  **Causal Participation:** Only those who *causally contributed* (voted) have a right to object. *Verdict:* Dies to pivot paradox. *Pivot:* Dies completely – neither voting nor abstaining changes the outcome.

  **The Contradiction ("You voted, so can't complain"):** No single principle generates all three variants ("didn't vote," "voted for X," "voted"). The "didn't vote" versions rely on participation/contribution norms (1,2,3,8) or social enforcement (7). The "voted for X" version relies on *specific endorsement* ("you chose this") or expressive consistency. The "voted (generally)" version is weakest, suggesting mere participation implies blanket consent, which is implausible. This inconsistency strongly suggests the core function is often *social work*: licensing blame/shame ("you didn't do your part"/"you backed the loser") and signaling in-group/out-group status, rather than stating a coherent, precise moral norm.

  **What Your Friend Likely Meant:** Almost certainly the **Fair Play/No Free Riding** (#2) argument, possibly blended with **Standing/Forfeiture** (#1) and reinforced by the **Descriptive Norm** (#7). This resonates with civic-republican "participation as duty" ethos and routes cleanly around the pivot-probability objection by focusing on collective contribution and reciprocity.

  **Confidence:** High confidence in verdicts overall (8/10). Least confident about **Consent/Lottery Acceptance** (#5) – while weak, consent arguments in democracy are complex and some nuanced defenses exist, though they don't map well onto this specific phrase.
