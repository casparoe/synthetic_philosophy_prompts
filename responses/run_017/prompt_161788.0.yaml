answer: |-
  ### Decision Tree: Mapping Beliefs About Merit and Desert in Academic Allocation  
  **Starting Commitment:** *University places/jobs must not be allocated arbitrarily; reasons must be offered for selections.*  

  #### Branch 1: **Must reasons be *desert*-based?**  
  - **If NO:** → **Consequentialist/Incentive View** (Leaf 1)  
  - **If YES:** Proceed to Branch 2.  

  #### Branch 2: **Does desert exist *independently* of institutional rules?**  
  - **If NO (desert is institution-dependent):** → **Institution-Dependent Desert** (Leaf 2)  
  - **If YES (desert is prior/independent):** Proceed to Branch 3.  

  #### Branch 3: **What *survives luck* as a desert base?**  
  (Assume: Luck = uncontrollable factors like innate talent, upbringing, or effort-disposition.)  
  - **Effort/trying survives:** Proceed to Branch 4.  
  - **Contribution/product survives:** Proceed to Branch 5.  
  - **Virtue/character survives:** → **Virtue-Grounded Desert** (Leaf 3, added)  
  - **Nothing survives (luck defeats desert):** → **Rawlsian Arbitrariness** (Leaf 4)  

  #### Branch 4: **Is desert *non-comparative* (fit-based) or *comparative* (ranking-based)?**  
  - **Non-comparative:** → **Effort-Grounded Desert** (Leaf 5)  
  - **Comparative:** → **Luck Egalitarianism** (Leaf 6)  

  #### Branch 5: **Can desert be claimed *under an unjust rule*?**  
  - **YES (desert holds independently):** → **Contribution-Grounded Desert** (Leaf 7)  
  - **NO (injustice blocks desert):** Proceed to Branch 6.  

  #### Branch 6: **Is the *currency of reward* fixed by institutions?**  
  - **YES (institutions define currency):** → **Institution-Dependent Desert** (Leaf 2)  
  - **NO (natural currency like well-being):** → **Unnamed Hybrid** (Leaf 8, added; awkwardly merges independent desert with institutional skepticism)  

  #### Branch 7: **Does the *proxy ratchet* corrupt desert claims?**  
  *(Proxy ratchet: Proxies like test scores become treated as desert bases themselves.)*  
  - **YES (corrupting):** All leaves *except* Leaf 2 and Leaf 1 can hold this.  
  - **NO (legitimate institutional process):** → **Institution-Dependent Desert** (Leaf 2) or **Consequentialist View** (Leaf 1).  

  #### Placement of Legitimation Critique:  
  **"Meritocracy legitimizes hierarchy"** is an *overlay* modifying Leaves 1, 2, 4, 5, 6, 7.  
  - *Cost:* It doesn’t fit cleanly into the tree as a leaf, as it critiques outcomes across positions but isn’t a theory of desert itself.  

  ---  

  ### Leaf Positions & Verdicts  
  *(Awkward commitment + Policy verdicts)*  

  1. **Consequentialist/Incentive View**  
     - *Awkward:* Desert is a "useful fiction"; institutions should *mimic* desert for efficiency.  
     - Legacy Preferences: **Reject** (inefficient).  
     - Drop Tests: **Accept** (if better proxy exists).  
     - Seniority Weight: **Split** (depends on incentive effects).  
     - Effort Awards: **Accept** (if it motivates).  
     - Proxy Ratchet: **Cannot reverse** (proxies are tools; no inherent corruption).  

  2. **Institution-Dependent Desert**  
     - *Awkward:* Desert *only* exists within rules; rules can’t be "unjust" by desert standards.  
     - Legacy Prefs: **Accept** (if rule-based).  
     - Drop Tests: **Accept** (if rules change).  
     - Seniority Weight: **Accept** (if institutionalized).  
     - Effort Awards: **Accept** (if rule permits).  
     - Proxy Ratchet: **No complaint** (ratchet *is* desert-creation).  

  3. **Virtue-Grounded Desert**  
     - *Awkward:* Virtue is hard to measure; luck in virtue-acquisition undermines claims.  
     - Legacy Prefs: **Reject** (unvirtuous).  
     - Drop Tests: **Accept** (if tests don’t capture virtue).  
     - Seniority Weight: **Reject** (seniority ≠ virtue).  
     - Effort Awards: **Reject** (effort ≠ virtue).  
     - Proxy Ratchet: **Corrupting** (proxies rarely track virtue).  

  4. **Rawlsian Arbitrariness**  
     - *Awkward:* No one deserves anything; desert is incoherent due to luck.  
     - Legacy Prefs: **Reject** (arbitrary advantage).  
     - Drop Tests: **Accept** (tests reflect luck).  
     - Seniority Weight: **Reject** (seniority reflects luck).  
     - Effort Awards: **Reject** (effort is luck-dependent).  
     - Proxy Ratchet: **Corrupting** (proxies compound arbitrariness).  

  5. **Effort-Grounded Desert**  
     - *Awkward:* Effort is unobservable; rewarding effort may ignore useful contributions.  
     - Legacy Prefs: **Reject** (non-effort-based).  
     - Drop Tests: **Accept** (if tests don’t measure effort).  
     - Seniority Weight: **Reject** (not effort-linked).  
     - Effort Awards: **Accept**.  
     - Proxy Ratchet: **Corrupting** (proxies ≠ effort).  

  6. **Luck Egalitarianism**  
     - *Awkward:* Compensating luck creates perverse incentives (e.g., rewarding poor choices).  
     - Legacy Prefs: **Reject** (unearned advantage).  
     - Drop Tests: **Accept** (if tests favor lucky).  
     - Seniority Weight: **Depends** (if seniority rewards effort, accept; if luck, reject).  
     - Effort Awards: **Accept** (if effort was costly).  
     - Proxy Ratchet: **Corrupting** (proxies ignore luck-sensitivity).  

  7. **Contribution-Grounded Desert**  
     - *Awkward:* Contributions depend on luck; may justify large inequalities.  
     - Legacy Prefs: **Reject** (non-contribution-based).  
     - Drop Tests: **Reject** (if tests predict contribution).  
     - Seniority Weight: **Depends** (if seniority signals contribution, accept).  
     - Effort Awards: **Reject** (effort ≠ contribution).  
     - Proxy Ratchet: **Can reverse** (if proxies stop tracking contribution).  

  8. **Unnamed Hybrid**  
     - *Awkward:* Demands "natural currency" (e.g., well-being) but lets institutions allocate jobs.  
     - Legacy Prefs: **Reject** (distorts natural rewards).  
     - Drop Tests: **Split** (depends on test’s link to natural currency).  
     - Seniority Weight: **Reject** (institutional, not natural).  
     - Effort Awards: **Accept** (if effort enhances well-being).  
     - Proxy Ratchet: **Corrupting** (proxies obscure natural desert).  

  ---  

  ### Tree Notes  
  - **Inert Distinction:** "Currency fixed by institution" (Branch 6) only reroutes to Leaf 2; drop it to simplify.  
  - **Unseparated Pair:** Luck Egalitarianism (Leaf 6) and Effort-Grounded Desert (Leaf 5) overlap if effort is seen as luck-resistant.  
  - **Proxy Ratchet Verdicts:** Only Leaf 2 sees it as *legitimate*; others call it *corrupting* (Leaf 7 can reverse it).  
  - **Unexplored View:** "Character desert" (Leaf 3) is rare; "non-comparative contribution desert" is coherent but unattractive (ignores competition).  
  - **Legitimation Critique:** Overlaid on Leaves 1, 2, 4–7; predicts *rejecting meritocratic rhetoric* but not specific policies.  

  **Handout Length:** Fits 2 pages (adjust spacing as needed).
