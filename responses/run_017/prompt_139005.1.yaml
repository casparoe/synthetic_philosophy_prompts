answer: |-
  Below is a complete simulation design for your seminar, incorporating your requirements for experiential learning, mechanical adversary rules, phased decision-making, and debriefing structure. The activity is structured as a 90-minute game simulating defence policy choices for a neutral state facing potential aggression.

  ---

  ### **Simulation Title:** *Territorial Denial: Defence Policy in a Neutral State*

  #### **Learning Objectives:**
  - Reveal trade-offs between conscript and volunteer forces beyond "efficiency".
  - Illustrate fiscal vs. opportunity costs, mobilisation lag, replacement depth, and signalling/deterrence.
  - Force students to confront personal stakes (free-rider dilemmas) and collective action problems.

  #### **Materials:**
  1. **Projector:** Display game phases, budgets, and adversary alerts.
  2. **Index Cards:**
     - **18 Identity Cards** (one per student): Occupation, annual income, special attributes.
     - **Adversary Alert Cards:** Pre-written triggers for crisis/war phases.
     - **Budget Tokens:** Physical tokens (e.g., poker chips) representing £100,000 each.
  3. **Printed Rules & Role Sheets** (provided below).
  4. **Board/Poster:** Track military capability (DP = Defence Points, EP = Expeditionary Points).

  ---

  ### **Game Setup**  
  *(5 minutes)*  
  1. **Assign Identities:** Distribute cards randomly. Each student receives:  
     - **Occupation & Income:** Determines annual earnings and opportunity cost if drafted.  
     - **Special Attribute (4–6 students):**  
       - `Physical Exemption`: Cannot be drafted (health grounds).  
       - `Conscientious Objector`: If drafted, reduces unit effectiveness by 0.5 DP.  
       - `Essential Worker`: High civilian value; if drafted, costs treasury 2x stipend.  
       - `Military Family`: Low opportunity cost; if drafted, gains £10,000 bonus.  

     **Sample Identities (annual income):**  
     - Doctor (£85,000), Software Engineer (£60,000), Teacher (£42,000), Farmer (£32,000), Student (£0, but opportunity cost = £20,000), Unemployed (£12,000), Nurse (£48,000), etc.  

  2. **Initial State:**  
     - **Budget:** £1.2 million/year (peace), represented by tokens.  
     - **Military:** None. Students build from scratch.  
     - **Reserve Pool:** Empty (tracked publicly).  

  ---

  ### **Rules & Payoff Structure**  
  **Core Mechanics:**  
  - **Phases:** Peace (2 rounds) → Crisis (1 round) → War (2 rounds).  
  - **Force Options:**  
    - **Volunteer Force (VF):** High cost, high effectiveness.  
      - Cost: £100,000/soldier/year (treasury).  
      - Effectiveness: 4 DP, 5 EP (good for expeditionary/ally support).  
    - **Conscript Force (CF):** Low treasury cost, high opportunity cost.  
      - Cost: £20,000/soldier/year (treasury) + opportunity cost (draftee’s lost income).  
      - Effectiveness: 3 DP, 1 EP (good for territorial denial).  
    - **Reserve Mobilisation:** Only available if CF maintained in peace. Cost: £30,000/reservist.  

  - **Adversary Rule (Mechanical & Partially Hidden):**  
    - Aggression threshold = 60 DP.  
    - **Deterrence Check (end of Peace Phase 2):**  
      - If **visible DP** (active forces) + **reserve potential** (if CF maintained) ≥ 60 → no attack.  
      - Else → attack in Crisis Phase.  
    - *Hidden from students:* Reserve potential = 80% of total conscripts drafted in peace.  

  - **Personal Stakes:**  
    - **Wealth = Income - Draft Losses + Survival Bonus.**  
    - If drafted: Lose annual income (opportunity cost).  
    - If territory occupied (DP=0 in war): All lose 100% wealth.  
    - Survival bonus: £50,000 if deterrence successful; £25,000 if war won.  

  ---

  ### **Game Timeline**  
  *(Total: 70 minutes)*  

  #### **Phase 1: Peace (Years 1–5)**  
  *(2 rounds × 15 minutes each = 30 minutes)*  
  - **Budget:** £1.2 million/round (displayed).  
  - **Decisions (per round):**  
    1. **Force Structure:** Choose number of VF and CF soldiers.  
    2. **Drafting:** Select which students to conscript (CF). Opportunity cost deducted from draftee’s wealth.  
    3. **Reserve Pool:** Conscripts drafted in peace automatically added to reserve (tracked publicly).  
  - **Constraints:**  
    - Physical Exemption/Essential Worker cards block drafting.  
    - Conscientious Objectors reduce unit DP by 0.5 if drafted.  
  - **Outcome:**  
    - Update DP/EP on board.  
    - Reserve Pool = total conscripts drafted in peace.  

  #### **Phase 2: Crisis (Year 6)**  
  *(15 minutes)*  
  - **Adversary Alert:** Display outcome of Deterrence Check.  
    - *If no attack:* Students earn income. No drafting.  
    - *If attack:*  
      - **Budget:** £1.5 million.  
      - **Decisions:**  
        - Mobilise reserve? (Cost: £30,000/reservist).  
        - Draft new conscripts or hire VF?  
      - **Urgency:** Forces must be mobilised *this round*.  
  - **Key Tension:** Reserve only available if CF maintained in peace.  

  #### **Phase 3: War (Years 7–8)**  
  *(2 rounds × 10 minutes each = 20 minutes)*  
  - **Budget:** £1.8 million/round.  
  - **Decisions (per round):**  
    - Replace losses (see below).  
    - Draft/hire new forces.  
  - **Battle Resolution:**  
    - **Adversary Strength:** Fixed at 50 DP/round.  
    - **Losses:** Student losses = (Adversary DP / Total Student DP) × 50%.  
    - **Replacement:** CF can absorb higher losses due to lower cost/faster training. VF limited to 5 new hires/round.  
  - **Occupation Check:** If DP = 0 → territory occupied.  

  ---

  ### **Debrief Guide**  
  *(15 minutes)*  
  Map gameplay moments to the four strands:  

  1. **Fiscal vs. Opportunity Cost:**  
     - *Game Moment:* High-income students (e.g., Doctor) resisting drafts despite "low treasury cost" of CF.  
     - *Point:* CF "cheapness" is illusionary; cost shifts from treasury to draftee.  

  2. **Mobilisation Lag:**  
     - *Game Moment:* Groups abandoning CF in peace → unable to mobilise reserves during crisis.  
     - *Point:* Reserves require long-term investment; VF cannot scale instantly.  

  3. **Replacement Depth:**  
     - *Game Moment:* War-phase losses depleting VF; CF allowing rapid draftee influx.  
     - *Point:* Volunteer forces "hollow out" in prolonged conflicts; conscription enables resilience.  

  4. **Signalling/Deterrence:**  
     - *Game Moment:* Adversary attacking when visible DP < 60 *and* no reserve potential.  
     - *Point:* Conscription signals pre-commitment, altering aggressor calculus *before* crisis.  

  #### **Predictable Issues & Limitations:**  
  - **Gaming the System:**  
    - Students may min-max DP to hit the 60 threshold then dismantle forces.  
    - *Mitigation:* Stress that adversary rules are opaque; focus on real-world unpredictability.  
  - **Unsimulatable Elements:**  
    - **Multi-decade horizon:** Game compresses time; discuss how decisions lock in path dependency.  
    - **Moral remainder:** Simulation frames coercion in cost-benefit terms; use debrief to surface unresolved ethical tensions (e.g., "Can collective security justify *this* draftee’s lost future?").  
    - **Uncertainty:** Adversary is mechanical; highlight how real states face ambiguity about intentions.  

  ---

  ### **Printable Materials**  
  #### **Identity Card Template:**  
  ```
  [OCCUPATION]  
  ANNUAL INCOME: £[X]  
  SPECIAL: [None / Physical Exemption / Conscientious Objector / Essential Worker / Military Family]  
  ```  

  #### **Adversary Alert Cards:**  
  - **Crisis Card 1:** *"Intelligence suggests rising tensions. Mobilise forces NOW."*  
  - **Crisis Card 2:** *"No imminent threat. Continue peacetime policy."*  

  #### **Rules Summary (Projected):**  
  ```  
  - DEFENCE POINTS (DP) = Territorial denial strength  
  - EXPEDITIONARY POINTS (EP) = Ally support/overseas ops  
  - VOLUNTEERS: £100K/yr, 4 DP, 5 EP  
  - CONSCRIPTS: £20K/yr + lost income, 3 DP, 1 EP  
  - RESERVES: £30K to mobilise (if available)  
  - WEALTH = Income - drafting losses + survival bonus  
  ```  

  ---

  ### **Facilitation Notes**  
  - **Role:** Neutral arbiter. Do not hint at strategies; enforce rules mechanically.  
  - **Pacing:** Use a visible timer. If debate stagnates, force a vote.  
  - **First-Run Risks:**  
    - Over-focus on EP (expeditionary) vs. DP (denial); remind students of neutrality doctrine.  
    - Wealth-maximising students may veto *all* drafting; let this play out to expose free-rider dilemmas.  
  - **Clarifications:** Opportunity cost for students = lost income; for unemployed = £12,000.  

  This simulation forces students to confront how institutional choices (conscription vs. volunteer) create path dependencies that shape deterrence, resilience, and social contracts. The debrief should crystallise why a "soldier-for-soldier efficient" force may still be wrong for a neutral state relying on territorial denial.
