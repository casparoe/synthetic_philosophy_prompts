          In each round (peace, crisis, war), if the student is not drafted, they earn their annual income (for the year). In peace rounds, since each round is 5 years, they earn 5 times their annual income? But then a draft in a peace round would mean they lose 5 years of income? That is a huge cost. Alternatively, in peace rounds, they earn for 5 years, but if drafted, they are drafted for one year out of the five? We can say that in a peace round, the conscription is for one year of service (and then they are in the reserve). So in a 5-year period, a drafted student is only drafted for one year (losing one year's income) and then they are free for the other 4 years. 

     How about: in each peace round, the group decides the number of conscripts to draft per year (for 5 years). Then, they must choose that many students to be drafted in each year. But since the round represents 5 years, we can say that each drafted student serves for one year (chosen at random within the 5 years) and thus loses one year's income. But that is complex.

     Alternatively, we can abstract: the group decides the annual draft size, and then the opportunity cost to the group is the total annual opportunity cost (sum of the incomes of the drafted students) multiplied by 5 (for the 5 years). But then the cost is not individual.

     We want the individual to feel it. So we can have:

          In each peace round, the group must choose a set of students to draft. Each drafted student in the round loses 2.5 years of income (half the round? because the round is 5 years and they serve for 2.5 years? that doesn't fit).

     Let's change the time scale: each round is one year. Then we can have more rounds, but the budget is annual.

     Given time constraints, we might have to make the peace rounds one year each. Then:

          Phase 1: Peace: 5 rounds (years 1-5)
          Phase 2: Crisis: year 6
          Phase 3: War: 2 rounds (years 7-8)

     Total: 8 rounds, which might be too many for 70 minutes.

     Alternatively, we can have the draft in peace rounds as a one-time event per round, and the drafted student loses the entire income for the round. But in a 5-year peace round, that is 5 years of income! That is very harsh. We might scale the income: say the income on the card is annual, but in a peace round (5 years), they normally earn 5 times that. If drafted, they are drafted for the entire 5 years? That is possible, but then they lose 5 years of income. That might be too much.

     We can have the draft as a per-year decision, but the round represents 5 years, and they decide the draft size per year. Then, they must select 5 times the annual draft size (because 5 years) of students to draft, and each drafted student is drafted for one year (so they lose one year's income). But then the group has to choose which student is drafted in which year? That is messy.

     Given the complexity, I propose:

          In each peace round, the group decides:
            - The annual number of professional soldiers (PVF) to hire. They are hired for the entire round (5 years), so the treasury cost is £100,000 * 5 per soldier.
            - The annual number of conscripts to draft. For conscripts, we assume they serve for one year and then are in the reserve. So each year, they draft a new set. Therefore, for the 5-year round, they will draft 5 times the annual number of conscripts, but in terms of the active force, the active conscripts at any time is the annual number.

          For the players: the group must choose, for each year in the round, a set of students to draft (equal to the annual number). But since the round is 5 years, they have to make 5 decisions? No, we can have them choose the entire set for the 5 years at once: they must choose 5 * (annual draft number) of students, and each of these students will be drafted for one year (and which year is not specified, so it's an average).

          Each drafted student loses one year's income (so they earn 4 years of income in the peace round instead of 5). The treasury cost for conscripts is 5 * (annual draft number) * £20,000 (because they pay £20,000 per conscript per year, and there are 5 years).

          This way, the opportunity cost to the student is one year's income per peace round if they are drafted.

          In the crisis round (1 year), if they draft new conscripts or mobilise reservists, then students drafted in that round lose their entire income for that year.

          In war rounds (1 year), same as crisis.

     This seems workable.

     So for a peace round:

          Each student not drafted at all in the round earns 5 * annual income.
          Each student drafted once in the round earns 4 * annual income.
          (We avoid drafting a student more than once in a peace round to prevent extreme hardship.)

     The group must ensure that they have enough students to draft: they can draft each student at most once per peace round.

     In crisis and war rounds, they can draft the same student again.

  9. **Victory Conditions and Individual Scoring:**

     - The group's goal: deter the aggressor, and if war comes, defend the territory (prevent occupation). We can define:

          If the aggressor is deterred (does not attack), then the group gets a high bonus, say £10 million to be divided among the students? Or we can have individual scoring based on accumulated wealth and a group success bonus.

     - Individual scoring: 
          Each student wants to maximise their accumulated wealth (from income minus opportunity costs due to draft).

          Additionally, if the group successfully deters the aggressor, each student gets a bonus of £100,000.
          If the group fights a war and prevents occupation (by having positive DP at the end of the war), each student gets a bonus of £50,000.
          If the territory is occupied (total DP falls to zero during the war), then each student loses everything and gets 0.

     This gives them an incentive to have a strong defence, but also to avoid being drafted.

  10. **Game Sequence:**

      We'll have 5 rounds:

          Round 1: Peace (years 1-5)
          Round 2: Peace (years 6-10)
          Round 3: Crisis (year 11)
          Round 4: War (year 12)
          Round 5: War (year 13)

      In each round:

          Step 1: The tutor reveals the round type and the budget for the round.
          Step 2: The students discuss and decide:
                  - The number of professional soldiers to maintain (annual number, which for peace rounds means they are hired for the entire round and paid for 5 years at £100,000 per year per soldier? Or we can have the cost as an annual cost and then multiplied by the number of years in the round).
                  - The annual number of conscripts to draft (which for peace rounds means they will draft that many each year, so total conscripts drafted in the round = annual number * 5).
                  - Additionally, in crisis and war, they can:
                      - Hire new professionals (with the limits and costs for crisis/war)
                      - Mobilise the reserve (if available)
                      - Draft new conscripts (which are additional to the annual draft in peace)

          Step 3: For conscription, the group must select which students to draft. In peace rounds, they need to select 5 * (annual draft number) of student-draft instances (each instance means one student drafted for one year). They can draft a student at most once in a peace round. In crisis and war, they draft for that year only.

          Step 4: The tutor calculates the military strength and resolves the adversary's action (in crisis round) or the battle (in war rounds).

          Step 5: The tutor announces outcomes and updates the military and reserve.

      Budgets:

          Round1 (Peace): £5 million (for 5 years)
          Round2 (Peace): £5 million
          Round3 (Crisis): £1.5 million (for 1 year)
          Round4 (War): £2 million
          Round5 (War): £2 million

      Military costs:

          PVF: 
              In peace rounds: cost per soldier = £100,000 * 5 = £500,000 for the round.
              In crisis and war: £100,000 per soldier per year (but in crisis and war, they can only hire up to 10 new professionals per round? and at £100,000 each? or £150,000? Let's say in crisis and war, new hires cost £150,000 per soldier and are limited to 10 per round. The existing PVF from previous rounds are already paid for? No, the treasury must pay the salary every year. So in round2, they have to pay for the PVF they have, and they can choose to increase it.

          Actually, the PVF force is maintained from round to round unless they reduce it. They must pay the annual cost for every professional soldier they keep.

          So in round1, they set the number of PVF, say N1, and pay £100,000 * 5 * N1.
          In round2, they start with N1 PVF. They can choose to reduce it (no cost) or increase it. If they increase by M, then they pay for the new ones: £100,000 * 5 * M, and also pay for the existing N1: £100,000 * 5 * N1? No, because they are already there. They only pay the salary for the round. So cost in round2 = £100,000 * 5 * (N1 + M) if they increase by M.

          Similarly for conscripts: in round1, they draft C1 per year, so cost = £20,000 * 5 * C1.
          In round2, they can set a new annual draft C2, and cost = £20,000 * 5 * C2.

          In crisis and war:
              Existing PVF: must be paid at £100,000 per year.
              New PVF: can be hired at £150,000 per year, up to 10.
              Existing active conscripts: none carried over from peace? In peace, conscripts serve for one year and then become reservists. In the crisis round, there are no active conscripts from peace unless they draft them in the crisis. So at the start of the crisis, the only active forces are the PVF from round2. 

          Reserve mobilisation:
              Cost: £30,000 per reservist mobilised for the year.

          New conscripts in crisis/war: £20,000 per conscript drafted that year.

      The reserve available in crisis (round3) is:
          Reserve = (total conscripts drafted in round1 + total conscripts drafted in round2) * 0.6
          But total conscripts in round1 = C1 * 5, in round2 = C2 * 5, so total reserve = (5*C1 + 5*C2) * 0.6 = 3*(C1+C2)

      In war rounds, the reserve is the same as in crisis (because it's the same people) minus any losses in the previous war round.

      Losses in war: in each war round, after the battle, a fraction of each type of force is lost. We apply the loss fraction to:
          PVF (existing and new hires)
          Active conscripts (newly drafted in the crisis or war)
          Reserve mobilised

      The loss fraction = (adversary's attack points) / (adversary's attack points + students' total DP) * 0.5

      After the loss, the remaining forces are carried over to the next war round.

  11. **Adversary's Attack Decision in Crisis Round (round3):**

      At the beginning of round3 (crisis), the tutor calculates the expected defence as perceived by the aggressor:

          active_PVF = number of PVF at the end of round2
          active_cons = the annual draft number in round2 (because that's the active conscript force at any time during round2)

          If the country drafted any conscripts in round2 (i.e., active_cons > 0), then the aggressor assumes a reserve of size active_cons (each providing 2 DP, so reserve_DP = active_cons * 2).

          So total expected defence = (active_PVF * 3) + (active_cons * 2) + (if active_cons>0: active_cons * 2, else 0)

          If active_cons>0: total expected defence = active_PVF*3 + active_cons*4
          If active_cons=0: total expected defence = active_PVF*3

          If total expected defence >= 100, the aggressor does not attack.
          If < 100, the aggressor attacks.

      The students do not know the threshold or the formula. They only know that the aggressor is watching.

  12. **Printable Materials:**

      - 18 identity cards (occupation, annual income, and if they have a special attribute, it is noted).
      - A few special attribute cards to hand out with the identity cards (2 physical exemption, 1 conscientious objector, 1 military family, 2 essential worker). The identity card should include the special attribute if they have one.

      Example identity card:

          Occupation: Doctor
          Annual Income: £80,000
          Special Attribute: None

      For a special attribute:

          Occupation: Teacher
          Annual Income: £40,000
          Special Attribute: Conscientious Objector - if drafted, you will serve in non-combat roles. Your draft reduces the effectiveness of your unit.

      - Rules summary for students (projected or handed out).

  13. **Timeline (90 minutes):**

      - 0-5 min: Introduction. Explain the setting (a small neutral state with a strategy of territorial denial). They are the citizens. They will make decisions about the military. Their goal is to protect the country and also to maximise their personal wealth. Explain the rounds. Do not reveal the adversary's rule or the victory conditions in detail. Just say they will face a potential threat.
      - 5-15 min: Round 1 (Peace, years 1-5). 
            - Budget: £5 million.
            - They decide: 
                 PVF annual number (they will have this many professionals for each year of the round; cost £500,000 per soldier for the round).
                 Conscript annual draft number (they will draft this many each year; cost £100,000 per year of draft? Wait, cost per conscript per year is £20,000, so for 5 years and annual draft of C, cost = 5 * C * £20,000 = £100,000 * C).
            - They must also choose which students to draft for each year. Since there are 5 years, they need to choose 5 * C students, but each student can be drafted at most once in the round. So they choose 5*C different student-drafts. They can draft a student only once in the round, so that student loses one year's income.
            - They can choose to draft a student with a physical exemption or essential worker? The rules: 
                 - Physical exemption: cannot be drafted.
                 - Essential worker: cannot be drafted in crisis or war, but in peace, they can be drafted? Or not? We'll say in peace, they can be drafted, but it's costly for the economy. We'll allow it.
                 - Conscientious objector: if drafted, they serve but reduce the unit's effectiveness. How? We can say: for every 10 conscripts, if there is a conscientious objector, the total DP from conscripts in that year is reduced by 1 (but this is complex to track). Alternatively, we can ignore the effectiveness reduction for simplicity and just have the role-play aspect. Or we can apply a global reduction: if any conscientious objector is drafted in a round, the total DP from conscripts that round is reduced by 10%. We'll do the latter.

            - After they decide, the tutor calculates the reserve accumulated: 
                 In round1, they drafted C1 per year, so total conscripts = 5*C1.
            - Each student's wealth is updated: 
                 Drafted students: wealth = 4 * annual income
                 Others: wealth = 5 * annual income

      - 15-25 min: Round 2 (Peace, years 6-10). Same as round1, but the reserve from round1 is carried over (not active, though).

      - 25-35 min: Round 3 (Crisis, year 11). 
            - Budget: £1.5 million.
            - The tutor reveals whether the aggressor attacks or not, based on the rule (using the military at the end of round2).
            - If the aggressor does not attack, the round is peaceful, and students earn their income (no draft unless they choose to have one? But they might want to mobilise even if not attacked? We can allow them to mobilise reserve or draft new conscripts, but if there's no attack, there's no need. But they might do it for deterrence? But the crisis round is after the aggressor's decision. So if the aggressor does not attack, then there is no draft and no mobilisation, and the students earn their income.
            - If the aggressor attacks, then the students can:
                  - Pay the salaries of the existing PVF (from round2) for year11: cost = £100,000 * (number of PVF they had at the end of round2).
                  - Hire new PVF: up to 10 at £150,000 each.
                  - Mobilise the reserve: cost £30,000 per reservist. The available reserve is 0.6 * (total conscripts from round1 and round2) = 0.6*(5*C1 + 5*C2) = 3*(C1+C2). They can mobilise any number up to that.
                  - Draft new conscripts: cost £20,000 per conscript. They can draft any number of students. Each drafted student loses their entire income for the year.

            - They must also assign any drafted students (for new conscripts) and any conscientious objector effects apply.

            - Then, if attack occurred, the tutor calculates the total DP for defence.

      - 35-50 min: Round 4 (War, year 12) - only if attack occurred in round3. If not, skip to round5.
            - Budget: £2 million.
            - They can again:
                  - Pay existing PVF: £100,000 per existing professional.
                  - Hire new PVF: up to 10 at £150,000.
                  - Mobilise more reserve (if any left): cost £30,000.
                  - Draft new conscripts: £20,000.
            - Then, resolve the battle: calculate losses. 
            - Update military and reserve.

      - 50-65 min: Round 5 (War, year 13) - only if attack occurred.
            - Same as round4.

      - 65-80 min: If there was no attack in round3, then round4 and round5 are peaceful years. The students earn their income and have no military decisions (they can maintain or reduce forces, but it's not necessary). But to save time, we can skip to scoring.

          Alternatively, we can have the crisis round if no attack, year11 is peaceful, and then years 12-13 are also peaceful. So the students only make decisions for year11 if there is an attack.

      - 80-90 min: Debrief.

  14. **Debrief Points:**

      - Fiscal cost vs opportunity cost: In the game, the treasury cost for conscripts was low, but the drafted students bore the opportunity cost (lost income). This was evident when students with high incomes were drafted.

      - Mobilisation lag: In the crisis, if they had maintained conscription, they had a reserve to mobilise quickly. If not, they had to draft new conscripts (which were less effective) or try to hire professionals (which was limited and expensive).

      - Replacement depth: In the war rounds, the conscript system allowed them to draft many new soldiers to replace losses, while the professional force was hard to expand quickly.

      - Signalling: The aggressor's decision was based on the military structure in peace. Maintaining conscription (even with a small active force) might have deterred the attack because the aggressor expected the reserve.

      Also, the free-rider problem: students might have argued against being drafted because someone else could go, hoping to benefit from the defence without paying the cost.

      Predictable issues:

          - Students might try to avoid being drafted by arguing they are essential or have high opportunity costs, leading to free-rider problems.

          - Gaming the adversary: if they figure out the threshold (100 DP), they might try to meet exactly that and then reduce.

          - The simulation cannot reproduce the multi-decade horizon: we compressed time.

          - It cannot reproduce genuine uncertainty about the adversary's intentions: the adversary's rule was mechanical.

          - The moral remainder: coercing individuals for the aggregate benefit is not fully explored because the game focuses on the trade-offs.

      The debrief should highlight these limitations.

  Given the complexity, the first run might have confusion on the rules, especially the drafting mechanism and the reserve calculation. The tutor should be prepared to clarify.

  This is a rich simulation but requires careful facilitation.

