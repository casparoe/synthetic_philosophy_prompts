answer: |-
  ### Brainstorming  
  Your half-formed picture is largely correct and insightful. The core of the deterministic G-S proof *does* rely on a discrete "jump": when a voter unilaterally moves an alternative \(x\) up their ranking, the social choice function must switch to \(x\) at some critical point (due to unanimity, onto-ness, and strategy-proofness). This jump creates a "pivotal" position where the voter gains decisive power over \(x\) vs. the previous winner. Randomization breaks this by replacing the jump with a continuous probability shift. However, two subtleties need flagging:  
  1. **The role of FOSD preferences**: The smoothing alone isn’t sufficient. FOSD preferences are crucial because they make marginal probability shifts non-pivotal. A small increase in \(P(\text{win for } x)\) only matters if it crosses a threshold where \(x\) becomes first-order stochastically dominant over the current lottery. Without FOSD’s "lumpiness" (e.g., if preferences were expected utility with arbitrary utilities), manipulation could still pay.  
  2. **"Onto" for randomized rules**: For lotteries, "onto" is trivial (every degenerate lottery is reachable), but the key is that random dictatorship covers all *degenerate* outcomes. This preserves the spirit of G-S’s onto condition.  

  Your skeptic’s worry is valid but misdirected. Thinning the preference order *is* the mechanism, but it’s legitimate: FOSD is the minimal coherent extension of ordinal preferences to lotteries. If a manipulation isn’t an FOSD improvement, it shouldn’t count as a profitable deviation under ordinal preferences.  

  For your strengthening:  
  - **Extension-robust SP**: Both versions collapse to SD-strategy-proofness. If truth-telling isn’t FOSD-dominant, there exists *some* FOSD-monotone completion (or EU utility) that strictly prefers the deviation. (Proof sketch: If lottery \(L'\) does not FOSD-dominate \(L\), some state \(s\) has \(L\) better than \(L'\) in the sense of placing higher probability on better alternatives. Tailor utilities to exploit this.) This implies your robust definitions are equivalent to SD-SP.  

  **Residual cost**: Random dictatorship’s cost isn’t asymmetry but *non-responsiveness*. It discards all preference information except the top choice of one voter. The "symmetric unknown dictator" framing is apt, but the deeper issue is that no rule can be both highly responsive to preferences and SD-strategy-proof.  

  ---

  ### Explanation: Why Randomization Escapes Gibbard-Satterthwaite  
  **The Deterministic Bottleneck**  
  Gibbard-Satterthwaite’s proof hinges on a discontinuity. Fix all other voters’ reports. As you move alternative \(x\) up your ballot, from bottom to top, the winning outcome must eventually switch to \(x\) (because if \(x\) is top, unanimity might apply, and onto-ness ensures \(x\) wins somewhere). Strategy-proofness forces this switch to happen abruptly at a single ranking position: if it jumped early, you could manipulate downward by ranking \(x\) lower; if late, you could manipulate upward. This jump makes you *pivotal* for \(x\) against some other alternative \(y\) – meaning your report alone decides \(x\) vs. \(y\). Iterating this builds a dictator.  

  **How Randomization Smooths the Jump**  
  With randomized rules, moving \(x\) up your ballot doesn’t cause a binary jump from "\(y\) wins" to "\(x\) wins". Instead, it gradually shifts probability mass from other alternatives toward \(x\). Crucially, under **first-order stochastic dominance (FOSD)**, a tiny probability shift is *not* a decisive improvement. For example:  
  - Suppose the current lottery gives 40% to \(y\) (your 2nd choice) and 60% to \(z\) (your 1st choice).  
  - Moving \(x\) (your *new* 1st choice) up might shift the lottery to 39% \(y\), 59% \(z\), 2% \(x\).  
  This shift doesn’t FOSD-dominate the original: there’s no point where the cumulative probability of getting at least \(k\)th choice is higher for all \(k\). FOSD improvements require "massive" redistribution (e.g., shifting 10% from \(y\) to \(x\)). Small manipulations lack leverage.  

  **Why This Isn’t a "Cheat"**  
  Your skeptic claims we merely made preferences "too thin" for manipulations to register. True, but appropriately so: if a voter only has ordinal preferences over *certain* outcomes, FOSD is the *only* rational way to compare lotteries without adding extraneous assumptions (like cardinal utilities). If a misreport doesn’t yield an FOSD improvement, it cannot be strictly preferred under **any** coherent extension of their ordinal preferences. Your proposed strengthenings confirm this:  
  - **Extension-robust SP** and **EU-SP both collapse to SD-SP**. If a misreport induces lottery \(L'\) while truth yields \(L\), and \(L'\) does not FOSD-dominate \(L\), then:  
    - There exists a utility function consistent with the voter’s ordinal ranking where \(L\) has higher expected utility than \(L'\) (e.g., assign high utility to an alternative where \(L\) stochastically dominates).  
    - Thus, under that utility function, truth-telling is strictly better.  
  This proves SD-SP is already the maximal possible incentive compatibility for ordinal preferences over alternatives. The skeptic’s objection conflates "thin preferences" (legitimate) with "incomplete incentives" (not applicable here).  

  **The Real Cost of Randomization**  
  Random dictatorship recovers anonymity, neutrality, and SD-strategy-proofness precisely because it **sacrifices responsiveness to the full preference profile**. Consider:  
  - **Cost 1: The "Single Voter" Problem**: Only one voter’s top choice matters in any realization. A majority preferring \(a\) to \(b\) is ignored if the random dictator prefers \(b\).  
  - **Cost 2: No Intensity or Compromise**: Even if 99% of voters rank \(x\) second-best, random dictatorship gives \(x\) no extra weight. It only cares about top choices.  
  - **Cost 3: Ex Post Inefficiency**: While the lottery is ex ante efficient, some realizations may be Pareto-dominated (e.g., the dictator’s top choice is everyone else’s worst).  

  This isn’t about weak vs. strict incentives or ex ante/ex post evaluations. The fundamental trade-off is:  
  > **Randomization buys strategy-proofness by making the social choice *insensitive* to changes in preferences that don’t alter top choices or the lottery’s FOSD ranking.**  

  Random dictatorship is not uniquely salvageable—other SD-strategy-proof rules exist (e.g., duple rules)—but all exhibit this insensitivity. The anonymity of random dictatorship masks an ex ante symmetry: every voter has equal *chance* to dictate, but no collective will shapes outcomes. This is "democratic" only in the thinnest sense: equal opportunity for dictatorship, not equal influence.  

  **Conclusion**  
  Randomization escapes G-S by convexifying the outcome space, turning pivotal jumps into smooth probability shifts that FOSD preferences don’t reward marginally. The escape is genuine, not a trick: SD-SP robustly ensures truth-telling under all rational extensions of ordinal preferences. But the price is high. Random dictatorship achieves fairness and non-manipulability by reducing democracy to a lottery over dictatorships, discarding information about shared preferences, compromises, and intensities. It solves manipulation technically but at the cost of democratic responsiveness—a trade-off inherent in the ordinal setting.
