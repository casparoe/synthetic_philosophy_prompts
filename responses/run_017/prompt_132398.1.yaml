prompt: |-
  I teach clinical reasoning to medical residents, and there is a shape of case I keep running into that I cannot find a name for, though I assume there is a literature on it.

  A resident feels sure that a scan shows something malignant, and is then told two things: that in this unit, readers who are *sure* about this presentation are right about as often as a coin flip, and that the reason is not that the presentation is intrinsically hard but a perceptual trap that produces both the error and the feeling of certainty. Her confidence is a symptom of the very process that makes her wrong. If she could stop being certain, she would be back to her normal accuracy and the undermining fact would no longer apply to her — but she cannot simply decide to stop being certain, and no amount of being told seems to switch the feeling off.

  Two nearby cases seem to work differently. In one, the undermining fact is insensitive to what she does: she learns she has been overconfident in this domain for years, so even the moderate confidence she retreats to is itself inflated, and the doubt simply moves with her. In the other, complying seems to *produce* the problem: she is told that the departmental guideline's track record is unreliable precisely because everyone defers to it, and that deference destroyed the independence the track record depended on — so the more decisively she treats that information as a reason to defer, the less support it gives.

  Does this cluster have an established name, or are these three different things? I am not after a label on its own. I want the carving: what exactly the phenomenon is; how it differs from a reason for doubt that merely outweighs the original evidence or makes it evidentially irrelevant; how it differs from the ordinary gap between judging that one should not believe something and actually giving it up; whether the category should include cases where one can only comply indirectly, by changing one's habits, one's sources, or one's environment rather than one's mind; and whether a reason for doubt that disappears when complied with belongs with one that appears only when complied with. If nothing established fits, coin the term, define it, and say which nearby cases must be excluded and why.
reasoning: |-
  Okay, the user is a medical educator teaching clinical reasoning to residents. They've encountered a specific pattern in diagnostic errors that they want to categorize and understand better. The core problem involves a resident who feels certain about a malignant finding on a scan, but that very certainty is part of what makes them likely to be wrong due to a perceptual trap. 

  Hmm, this is fascinating because it's not just about overconfidence - it's about confidence being intrinsically tied to the error mechanism. The resident can't just decide to stop being certain, even when told about the coin-flip accuracy. That's different from general calibration issues.

  The user also describes two variants: one where doubt "moves with" the resident (retreating to moderate confidence doesn't help because even that's inflated), and another where complying with a guideline actually destroys its reliability (because deference kills the independence it relied on). 

  What's really sophisticated here is the meta-cognitive layer - reasons that change their truth/value based on whether you act on them. The user wants precise philosophical carving, not just a label. They're clearly deep in the epistemology of medical decision-making.

  Let me break this down systematically. First, the core phenomenon: certainty as symptom. This reminds me of "cognitive entrenchment" in expertise literature, but that's not quite it. Kahneman's "illusion of validity" is close but doesn't capture the self-undermining aspect. 

  Ah! Epistemic circularity fits best - the feeling of certainty is part of the faulty process. But I need to differentiate from general metacognitive calibration. The key is that the doubt isn't additive ("this evidence plus this statistic makes me less sure") but transformative ("my certainty itself indicates I'm in the trap").

  For the variants: the first where doubt moves with you sounds like chronic miscalibration - maybe "base rate neglect persistence." The guideline case is pure performative contradiction, like a diagnostic version of the liar's paradox. 

  The user's last questions about indirect compliance are crucial. Can you escape by avoiding scanners with that trap? Changing workflows? That blurs into ecological rationality territory. And the compliance-dependent reasons - that's almost a "doubt Heisenberg principle" where examining the doubt changes its nature.

  I should propose "self-subverting certainty" as a term. Define it as: confidence states that are both (a) products of the error-generating process and (b) prevent recognition of that process. Exclude cases where confidence is merely miscalibrated without being mechanistically tied to error. 

  This deserves examples: like pattern-recognition traps where the "aha" feeling comes from the same shortcut that causes oversight. In radiology, maybe certain shadow artifacts that trigger false malignant reads with high confidence. 

  For teaching, I'll suggest framing it as "certainty as diagnostic finding" - when residents feel that surge of confidence, it should trigger "is this the trap?" meta-checking. Maybe design cases where confidence is the red flag.
answer: |-
  This is a profound and under-discussed phenomenon in clinical reasoning. Based on your description, I propose the term **"Self-Subverting Certainty" (SSC)** for the core case, with related but distinct concepts for the variants. Here's the conceptual carving:

  1.  **Core Phenomenon: Self-Subverting Certainty (SSC)**
      *   **Definition:** A state of high subjective confidence in a specific interpretation or diagnosis, where the *feeling of certainty itself* is a direct symptom and product of the same cognitive/perceptual process that generates the error. Attempts to directly comply with meta-evidence (e.g., "Your certainty here means you're likely wrong") are ineffective because the feeling of certainty is resistant to volitional change and *is part of the faulty mechanism*.
      *   **Mechanism:** The perceptual/cognitive trap (e.g., a specific visual pattern bias, an associative heuristic misfire) simultaneously generates both the erroneous interpretation *and* the strong feeling of rightness. The confidence is not just miscalibrated; it's an *output* of the error-producing system.
      *   **Key Differentiators:**
          *   **vs. Outweighing/Irrelevant Evidence:** SSC isn't just adding new evidence against the diagnosis (e.g., a negative test). It's meta-evidence that *undermines the probative value of their own subjective experience of confidence* for *this specific* interpretation. The original perceptual evidence isn't necessarily irrelevant; it's that the *confidence* attached to it is diagnostically indicative of error.
          *   **vs. Belief Perseverance:** Standard belief perseverance (the gap between knowing one shouldn't believe and still believing) involves clinging to a belief *despite* new counter-evidence. In SSC, the resident *wants* to reduce confidence based on the meta-evidence, but *cannot directly extinguish the feeling* because it's generated by the very trap they are in. The feeling is recalcitrant.
          *   **vs. Simple Overconfidence/Miscalibration:** Miscalibration is a general tendency to be too sure. SSC is *specific* to a particular perceptual/cognitive trap where certainty is a *symptom* of the error process, not just a miscalibration of general confidence levels.
      *   **Compliance:** Direct volitional reduction of confidence is impossible. Compliance requires *indirect strategies*:
          *   **Habit/Source Change:** Consciously adopting forced deliberation steps when encountering *this specific trigger pattern* (e.g., "When I see X and feel *very sure* it's malignant, I *must* consult the checklist/colleague/second reader protocol before acting").
          *   **Environmental Change:** Designing workflows that mandate consultation or double-reading specifically for presentations known to harbor this trap.
          *   **Reframing Certainty:** Teaching residents to interpret the *feeling of high certainty* with this specific pattern *as a diagnostic sign itself* ("My strong gut feeling here is actually a red flag indicating I need extra safeguards").

  2.  **Variant 1: Chronic Calibration Failure (CCF)**
      *   **Description:** The resident learns their general confidence level in a domain is inflated; even reduced confidence is still inflated. Doubt "moves with her."
      *   **Distinction from SSC:** This is *domain-general miscalibration*, not trap-specific. The meta-evidence doesn't undermine the *specific* feeling of certainty for a *specific* interpretation linked to a trap; it undermines the reliability of *all* her confidence judgments in that domain. The problem is systemic calibration, not a specific self-subverting mechanism tied to confidence generation.
      *   **Category:** Excluded from SSC. Belongs to literature on calibration, overconfidence bias, and feedback in expertise development.

  3.  **Variant 2: Performative Undermining (PU)**
      *   **Description:** Compliance (deference) with a guideline actively destroys the condition (independent judgment) that made the guideline reliable in the first place.
      *   **Distinction from SSC:** The undermining factor is external (the guideline's reliability) and its truth-value *changes* based on collective action. SSC is internal: the resident's *own feeling of certainty* is the symptom of the error process for *their specific* interpretation. PU is about the *external reason* (the guideline's track record) becoming invalid *because* it's used. SSC is about the *internal state* (certainty) being diagnostically indicative of error *for that specific case*.
      *   **Key Difference:** PU involves a *performative contradiction* – the act of using the reason negates its validity. SSC involves *epistemic circularity* – the feeling meant to signal correctness is actually a sign of error *for this instance*.
      *   **Category:** Excluded from SSC. Related to concepts like Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"), reflexive predictions, and the perverse consequences of protocols.

  **Clarifying Compliance-Dependent Reasons:**

  *   **Reason Disappears When Complied With (SSC-like):** In SSC, successfully complying (indirectly) means you avoid triggering the trap or mitigate its effect. Once you've avoided the trap, the meta-evidence ("Your certainty means you're likely wrong") *no longer applies to you* for that specific instance because you didn't fall into the certainty state. The reason for doubt was contingent on being *in* the SSC state.
  *   **Reason Appears Only When Complied With (PU-like):** In PU, the reason *for the guideline's unreliability* (that everyone defers) *only becomes fully realized/apparent as a reason* when people *do* defer. Before widespread deference, the guideline *was* reliable (based on independent judgments). The reason ("deference destroys reliability") emerges *because* of compliance. It's constitutive.
  *   **Belonging:** SSC involves the *first* type (reason contingent on state, disappears if state avoided). PU involves the *second* type (reason constituted by action). They are distinct mechanisms, though both involve a form of fragility in the reason based on action/state. SSC focuses on an internal cognitive state's diagnostic value for error; PU focuses on the external validity of a rule based on collective behavior.

  **Why "Self-Subverting Certainty"?**

  *   **Self:** The certainty is generated by the process it erroneously validates.
  *   **Subverting:** The feeling of certainty actively undermines the accuracy it purports to signal in this specific context.
  *   **Certainty:** Highlights the central role of the subjective confidence state as both symptom and part of the mechanism.

  **Teaching Implications for SSC:**

  *   Frame the feeling of high certainty with *specific known perceptual traps* as a *clinical finding* requiring a specific differential: "This strong sense of 'aha, malignancy!' could be correct, OR it could be the SSC trap for Pattern X."
  *   Develop "de-biasing protocols" for specific SSC-prone presentations: mandatory checklists, forced consideration of alternatives, or immediate second reads triggered *by the resident's own feeling of high certainty* in that context.
  *   Use your cases explicitly: "Remember Case Y? That strong certainty *was the trap*. When you feel that here, apply Protocol Z."
  *   Emphasize that overcoming SSC isn't about feeling less certain *in the moment* (which is hard), but about recognizing the feeling as a cue to invoke a safety net.

  This carving places the core phenomenon (SSC) within the epistemology of metacognition and cognitive bias in expertise, distinguishing it from general miscalibration (CCF) and performative social phenomena (PU). It highlights the unique challenge where the signal of confidence is corrupted *for specific judgments* by the very process it reflects.
