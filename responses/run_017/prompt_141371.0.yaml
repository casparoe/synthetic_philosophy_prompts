prompt: |-
  I sit on the ethics committee of a private fertility clinic, and over the past year we have been going round in circles about what to say to patients who now arrive already having read about polygenic embryo screening. I have tried to stop trading in slogans and just write down what I actually think case by case, and the result is a set of verdicts I cannot get into any respectable shape. Against a condition that kills in early childhood: obviously permissible, we do not even debate it. A deaf couple selecting for a hearing child: permissible. A deaf couple selecting for a deaf child, so that the child shares their language and community: impermissible — while I also want to say that deafness is not a harm, and I cannot see how both of those can be true. Sex selection to balance a family of three boys: impermissible, but only mildly. Sex selection for the same outcome out of son preference: impermissible and considerably worse, and I cannot say what does the work between them. A short couple, both badly bullied, who want an embryo predicted to be above the twenty-fifth percentile for height: permissible — yet the entire benefit there is relative, and if every parent did it the benefit would evaporate, and I do not withdraw the verdict when I notice that. Selecting on a polygenic score for educational attainment: I balk, and I cannot tell you why that differs from the height case, which is the pair I keep returning to. Creating a child as a tissue match for an ill sibling: permissible, provided the child is wanted for its own sake — though I suspect that proviso is doing all the labour. Selecting a profile of easy contentment, low trait anxiety, high satisfaction with whatever one gets, which on any welfare measure would give the child the best life of the batch: I recoil, it feels like cheating, and I cannot name who is cheated. And selecting against a trait that is a drawback only because of other people's prejudice — a couple asking for the embryo least likely to be dark-skinned in the area they describe as unsafe, or least likely to be gender-nonconforming — impermissible, even though it would raise the child's expected welfare by more than the height case does. On top of all this, a colleague on the committee keeps pointing out that in nearly every case a different embryo means a different child, so it is unclear who is supposed to have been benefited or harmed, and when he says it my confidence in all nine verdicts goes at once.

  My own attempt, which I would like tested and repaired rather than praised: select against whatever closes off the child's future options, select for whatever widens them, and never select for a trait whose whole point is that it makes the child easier for other people to live with or to raise. That draft seems to condemn the saviour-sibling case, which I do not want, and I am not sure it says anything determinate about the deafness pair, the contentment profile, or the prejudice-accommodating request. So: is there a principle that captures the pattern — or a short list of candidates, with the clause of each tied to the case that motivates it? Please be explicit about which of my verdicts each candidate cannot accommodate and would force me to overturn, and about whether the cost of saving them all is a principle so baroque that I should not want it. And then tell me what the best candidate says about three cases I have deliberately left off the list: selecting for moral traits such as empathy and conscientiousness; a clinic offering to rank embryos by a single composite index that trades a small increase in disease risk against a large gain on an attainment score; and whether the principle, whatever it is, binds only parents choosing among their own embryos, or also binds a public health service deciding what to fund and a regulator deciding what to license.
reasoning: |-
  Hmm, this is a fascinating and complex ethical dilemma from a fertility clinic ethics committee member. The user presents nine concrete cases where their intuitive ethical verdicts seem inconsistent when examined closely, along with their colleague's identity problem objection and their own attempted principle. They're explicitly asking for systematic analysis rather than reassurance.

  First, I need to map the user's existing verdicts clearly:
  - Early fatal disease: permissible
  - Deaf parents → hearing child: permissible
  - Deaf parents → deaf child: impermissible (with tension)
  - Sex selection for family balancing: mildly impermissible
  - Sex selection for son preference: strongly impermissible
  - Height selection for bullied parents: permissible
  - Educational attainment selection: impermissible (intuitively)
  - Savior sibling: permissible with proviso
  - Contentment trait selection: impermissible ("cheating")
  - Prejudice-accommodating selection: impermissible
  Plus three additional test cases.

  The core tensions stand out: 
  1) Why is selecting for height acceptable but educational attainment isn't? 
  2) How can they simultaneously hold that deafness isn't a harm but selecting for it is wrong? 
  3) What differentiates the two sex selection cases beyond motivation? 
  4) Why does the "different identity" objection undermine all cases equally?

  The user's proposed principle (select for open futures, against traits that make the child "easier for others") has merit but fails three key tests: it condemns savior siblings, doesn't resolve the deafness dilemma, and says nothing about contentment selection. It also doesn't address the identity problem.

  For a framework, I'm considering a modified capability approach with three layers:
  1) Harm threshold: absolute prohibitions based on severe limitations of core capabilities (e.g. fatal disease)
  2) Parental project zone: permissible selections where traits serve the child's interests without imposing identity-defining traits or compromising future autonomy
  3) Social entanglement filter: prohibitions when selections either reinforce oppression or make the child's value conditional

  This would require overturning two of the user's verdicts: the contentment selection (which falls in the parental project zone) and possibly the height selection (which risks normalizing enhancement). The identity problem gets reframed - we're not benefiting specific children but shaping the conditions of existence.

  For the additional cases:
  - Moral trait selection: impermissible under the autonomy principle (too identity-constitutive)
  - Composite index: impermissible if it bundles disease risk with non-health traits
  - Application scope: binds all actors but with sliding strictness (strictest for regulators)

  The framework isn't perfectly tidy - the deaf community selection case remains ethically fraught, requiring contextual negotiation. But it systematizes 80% of the cases while naming the irreducible tensions in the remainder. The baroqueness cost is moderate; the alternatives are either too simplistic or more fragmented.
answer: |-
  Your struggle captures the core tensions in reproductive ethics: welfare vs. autonomy, individual vs. societal consequences, and the paradox of "non-identity." Below is a tested framework based on your verdicts, followed by its application to your cases and the unresolved tensions. It combines three principles, each handling distinct ethical dimensions:

  **The Proposed Framework:**
  1. **The Threshold Principle:**  
     *Permit selection against traits that predictably cause severe, non-contingent harm (e.g., early fatal disease).*  
     → *Motivation:* Early fatal disease case.  
     → *Limits:* Does not resolve traits where harm is socially mediated (e.g., height, prejudice).

  2. **The Relational Autonomy Principle:**  
     *Permit selection for traits that expand the child’s future autonomy/opportunities, but prohibit:*  
     - *Traits that primarily serve others’ interests over the child’s,*  
     - *Traits that lock the child into a specific identity or community.*  
     → *Motivation:* Deaf couple selecting for deafness, savior sibling, contentment profile.  
     → *Key:* "Autonomy" here means preserving a range of life paths, not maximizing welfare.

  3. **The Social Entanglement Principle:**  
     *Prohibit selection that:*  
     - *Reinforces harmful social hierarchies (e.g., racism, sexism),*  
     - *Imposes avoidable burdens solely to accommodate prejudice,*  
     - *Treats the child as a means to societal approval.*  
     → *Motivation:* Sex selection for son preference, prejudice-accommodating requests.  

  ---

  ### **Application to Your Cases:**
  | Your Case                     | Verdict Under Framework                                                                 | Tension Resolution                                                                 |
  |-------------------------------|------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | **Early fatal disease**       | Permissible (Threshold Principle).                                                       | Clear severe harm.                                                                 |
  | **Deaf parents → hearing child** | Permissible (Relational Autonomy: expands child’s options).                             | Child’s autonomy preserved; no identity imposition.                                |
  | **Deaf parents → deaf child** | **Impermissible** (Relational Autonomy: locks child into identity; reduces sensory options). | *Overturns your verdict.* Deafness isn’t a "harm," but selecting for it limits autonomy. |
  | **Sex for family balancing**  | Permissible (Relational Autonomy: mild expansion of family dynamics).                    | Distinguishes from son preference via Social Entanglement.                         |
  | **Sex for son preference**    | Impermissible (Social Entanglement: reinforces sexism).                                  | Motivation matters due to societal harm.                                           |
  | **Height selection**          | Permissible (Relational Autonomy: reduces bullying risk; expands social options).        | Relative benefit is acceptable if autonomy-enhancing.                              |
  | **Educational attainment**    | **Impermissible** (Social Entanglement: exacerbates inequality; Relational Autonomy: risks "locking" child into parental expectations). | Distinguishes from height: education is more identity-constitutive and socially stratifying. |
  | **Savior sibling**            | Permissible *only* if the "wanted for own sake" proviso holds (Relational Autonomy: child’s existence isn’t conditional on utility). | Proviso does the work; conditional love is prohibited.                             |
  | **Contentment profile**       | Impermissible (Relational Autonomy: reduces motivation/curiosity; "locks" child into passive contentment). | "Cheating" = treating child as an object of parental convenience.                  |
  | **Prejudice accommodation**   | Impermissible (Social Entanglement: validates oppression; child treated as means to evade prejudice). | Welfare gain is illegitimate if contingent on injustice.                           |

  ---

  ### **Handling the Identity Problem:**
  Your colleague’s point (different embryo = different child) is valid but ethically navigable:  
  - **Response:** We don’t compare welfare of specific children (Child A vs. Child B). We evaluate whether *the act of selection* imposes unfair burdens, restricts autonomy, or reinforces injustice *on the child who will exist*.  
  - **Example:** Selecting for deafness imposes sensory limitations the child might resent; selecting to accommodate racism forces the child to bear the burden of others’ prejudice.  

  ---

  ### **Analysis of Your Draft Principle:**
  Your proposal ("select for open futures, not for traits that make the child easier for others") aligns with the Relational Autonomy Principle but:  
  - **Fails** the savior sibling case (conditional creation *is* making the child "useful").  
  - **Ignores** societal harms (Social Entanglement needed for prejudice/sexism cases).  
  - **Vague** on traits like contentment or deafness (what counts as "open"?).  

  ---

  ### **Test Cases:**
  1. **Selecting for moral traits (empathy, conscientiousness):**  
     - **Impermissible** under Relational Autonomy. Moral traits are deeply identity-constitutive and risk imposing parental values. Exception: selecting *against* extreme antisocial traits causing objective harm (e.g., psychopathy).  

  2. **Composite index (disease risk vs. attainment):**  
     - **Impermissible** if attainment is included. Bundling health with non-health traits commodifies the embryo. Permissible only for pure health-risk reduction (Threshold Principle).  

  3. **Who the principle binds:**  
     - **Parents:** Permitted to use autonomy-expanding selections (e.g., height), prohibited from socially harmful/identity-locking choices.  
     - **Clinics/Regulators:** Must enforce Social Entanglement (ban sexism/racism) and Threshold harms. Can restrict parental autonomy for societal goods (e.g., banning educational attainment selection).  
     - **Public Health:** Funds only health-related selections (Threshold Principle); non-health traits risk exacerbating inequality.  

  ---

  ### **Costs and Unresolved Tensions:**
  - **Overturned Verdicts:** Deaf parents selecting deafness and educational attainment are impermissible here (you must reconcile your intuition that deafness isn’t a harm with autonomy limits).  
  - **Baroqueness Cost:** The framework is moderately complex (3 principles + identity clause) but mirrors the moral reality: no single value (welfare, autonomy, justice) dominates. Simpler principles (e.g., "maximize welfare") fail your cases spectacularly.  
  - **The Deaf Community Dilemma Remains:** If a deaf child can flourish within signing culture, is selecting deafness truly autonomy-restricting? This requires contextual negotiation—e.g., permit only if parents commit to bilingualism (signing + speech), ensuring future choice.  

  **Final Recommendation:** Adopt this framework but acknowledge its limits. Some cases (e.g., deafness) need committee discretion. Update guidelines to:  
  - Prohibit identity-locking, socially harmful, or conditional selections.  
  - Permit health and mild autonomy-enhancing choices.  
  - Require counseling for traits entangled with prejudice or inequality.  

  This balances your intuitions while providing defensible boundaries. The non-identity problem is managed by focusing on harms/benefits *to the future child*, not comparisons between possible children.
