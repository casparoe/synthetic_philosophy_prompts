prompt: |-
  I sit on the committee revising our jurisdiction's model statute on advance health-care directives, and the remit has quietly grown. We are being asked to say whether the statute should recognize two instruments that no existing framework was drafted for, and we have discovered that we cannot even say what we would need from an account of the matter in order to decide. So before we look at theories, I want the specification.

  What I need is the list of requirements an adequate account of the authority of an earlier self over a later self must meet. Adequate for us means: usable by a hospital ethics committee, within a few hours, on the evidence actually available at the bedside, and capable of being turned into statutory language that says who bears the burden and what happens when a directive, a named surrogate, and the treating team disagree. I want requirements that cannot be operationalized listed too, marked as such rather than dropped — I would rather know that a requirement is real and unlegislatable than have it quietly subtracted.

  Here are the cases I think any account must get right, with the reason each earns its place on the list.

  1. The contented patient with advanced dementia. She signed at sixty a directive refusing antibiotics and assisted feeding in that condition; at eighty she has advanced dementia, appears content, greets visitors warmly, and would resist withdrawal. The account must say whether present contentment is a reason to set the directive aside, and whether continuing to keep her alive can itself be a harm to her — or whether that thought is one the theory is required to avoid.

  2. The convert. At twenty-five she refuses blood transfusion on religious grounds; at forty-five she has lost the faith, is competent and fully informed, and wants the transfusion, saying her earlier self was simply wrong about what matters. Distinguish from the variant in which she still avows both the faith and the directive but asks for the transfusion out of fear. A theory that handles these two the same way has collapsed something.

  3. The psychiatric Ulysses. A directive, written in remission, authorizing involuntary admission and medication during manic episodes — that is, a request to be overridden precisely while competent and precisely while refusing. If a theory cannot override contemporaneous competent refusal, say whether it can give this instrument any force at all.

  4. The addiction case. A directive written in remission refusing opioids except in defined circumstances; the same person now in genuine severe pain and asking for them; and no reliable way for the team to tell craving from pain. The account must say who decides that distinction and on what standard, not merely that it matters.

  5. Unanticipated circumstances and indeterminate terms. A directive written before the treatment existed, or one whose language (no extraordinary measures, no prolonging of life) does not determine an answer for the intervention now proposed. The theory has to say whether the gap is filled by the signer's values, by her likely words, or by a default rule — and why.

  6. Factual error. The directive rested on a belief that is false: that advanced dementia is continuous terror, that a stroke at eighty means institutionalization with no visitors, that a given prognosis is hopeless when a newer treatment has changed it. Distinguish the case where she was wrong about the facts from the case where she was wrong about her own future values, if the distinction can bear weight.

  7. Beyond medicine. Instructions about identity-constituting projects rather than treatment: a novelist's direction that her unfinished manuscript be destroyed if she loses the capacities needed to complete it, with her present self content and wanting it published. I want to know whether a theory of precedent autonomy is a theory about bodies and treatment specifically, or whether it must generalize, and what it costs to confine it to the clinical case.

  8. The two new instruments. First, the transformation clause: the signer specifies in advance what would count, in her own terms, as her having become a different person — if I come to affirm belief R, if I no longer recognize my children, if I stop caring about P — and stipulates that the directive lapses when the condition is met. Give me the hard variants, including the case where she meets her own stated condition and insists the directive should still apply, and the case where the trigger is the very state the directive was written to preempt. Second, the continuing-self model: a system trained on a person's own past writing, purchases, messages and records, which predicts her present values better than she can now articulate them. Should a written directive be read as deferring to that prediction? Is the prediction evidence of present values, a new kind of authority, or neither? Who has standing to invoke it against her present word?

  Alongside the cases, I want the distinctions the account must not collapse: authority versus epistemics (the earlier self's standing to decide versus her supposed better knowledge of her own values, and what happens when the epistemic advantage reverses); who decides versus what should be decided; a directive being void, being overridden, and being reinterpreted; identity questions versus evaluative-change questions; the interests of the then-self, of the now-self, and of the person across a whole life; legal competence thresholds versus whatever capacities actually do the work.

  Two further things. Tell me which pairs of requirements you think cannot be jointly satisfied — for my money the interesting candidates are the demand never to override contemporaneous competent refusal against the demand to ground authority in something other than present incompetence, and the demand to be sensitive to the kind and magnitude of personal change against the demand to be administrable in an afternoon; but find the real collisions rather than confirming mine. And tell me which single requirement does the most exclusionary work, the one that eliminates the most candidate positions.

  I also want my own list audited: flag anything on it that is really a prejudice of one camp or an artifact of the fact that we are drafting a statute rather than doing moral philosophy, and add what I have missed. Where I have relied on an empirical claim — that many people with advanced dementia are not well described as suffering, that directives are frequently unavailable or unheeded at the point of care, that stated treatment preferences drift and directives are rarely revisited — tell me whether it is established or itself disputed.

  Finally, a compressed scorecard against four position types, as a small table and not the centre of the answer: precedent autonomy as genuine authority rather than as evidence; directives as merely evidentiary input to a present best-interests judgment; the identity view, on which the question is whether signer and present patient are the same person and where they are not the instruction is a stranger's; and the supported-decision-making view, on which the whole framing is a mistake and the task is to support present capacity rather than to allocate authority between temporal selves. Name the thinkers associated with each only if you are confident of the attribution; I care about the positions.

  Throughout, separate what is settled from what is genuinely contested among people who work on this, mark each requirement as near-universal, contested, or a commitment of one camp, and do not present a contested view as where the field has landed.
reasoning: |-
  Okay, let me approach this systematically. The user is drafting legislation on advance directives and needs a framework to evaluate theories of precedent autonomy. The core challenge is identifying requirements for an adequate account that works in real-world clinical settings while handling complex philosophical dilemmas.

  First, I need to organize the user's extensive input. They've provided eight paradigmatic cases that any theory must address, key distinctions to preserve, and requests about operational constraints. The cases range from dementia patients to identity-altering transformations. The operational requirements are particularly crucial - this isn't just academic; it needs to work at the bedside.

  The user also wants to know where requirements conflict. I should identify inherent tensions, like between respecting contemporaneous refusal and honoring directives for future incompetence. The psychiatric Ulysses case directly tests this. There's also the tension between nuanced personal change assessments and administrative feasibility.

  For the audit function, I'll need to flag where the user's assumptions might reflect statutory drafting biases rather than philosophical necessities. For example, the focus on burden allocation and binary outcomes might oversimplify some ethical dimensions. The empirical claims about dementia sufferers' experiences should be noted as contested.

  The four-position scorecard should remain concise but highlight how each approach fails certain requirements. Precedent autonomy struggles with Ulysses cases, best-interests may collapse distinctions like authority vs epistemics, identity views face transformation clauses, and supported decision-making rejects the entire directive framework.

  Throughout, I'll maintain clear markers for what's settled (like the distinction between authority and epistemics) versus contested (like whether contentment voids directives). The transformation clause and AI-predicted values represent emerging challenges without consensus.

  The most exclusionary requirement appears to be "override contemporaneous refusal while competent" - it eliminates most theories except specialized Ulysses pact approaches. Meanwhile, the "administrable in hours" requirement constrains how deeply we can assess personal change.
answer: |-
  Here is the specification you requested, structured as requirements for an adequate account of precedent autonomy, audited against your cases and distinctions, with conflicts and exclusions identified.

  ### Core Requirements for an Adequate Account
  *(Adequate = Usable by hospital ethics committees within hours, bed-side evidence only, translatable to statutory language allocating burden/outcome in disagreements)*

  1.  **Resolve Directive-Surrogate-Clinician Disagreements:** Must provide a clear, operationalizable method to determine whose decision prevails when these parties conflict on treatment authorization/refusal. *(Statutory Core)*
  2.  **Allocate Burden of Proof:** Must specify who bears the burden (and standard of proof) to demonstrate a directive applies, is invalid, or should be overridden in a specific situation. *(Statutory Core)*
  3.  **Handle Contemporaneous Refusal vs. Prior Directive:** Must explicitly state whether, and under what conditions, a contemporaneous competent refusal can override a prior directive requesting that treatment. (Critical for Cases 3 & 4). *(Near-Universal)*
  4.  **Distinguish Authority from Epistemics:** Must clearly separate:
      *   The *right* of the past self to bind the future self (Authority).
      *   The past self's presumed *better knowledge* of the future self's values/needs (Epistemics).
      *   Must specify what happens when the epistemic advantage demonstrably reverses (e.g., Convert still faithful but fearful - Case 2 variant). *(Contested but Essential Distinction)*
  5.  **Address Changes in Values/Identity:** Must provide a framework for handling cases where the patient's core values, beliefs, or sense of self have demonstrably changed since the directive was signed (Cases 1, 2, 6b, 7, 8a). Must not collapse evaluative change ("I was wrong") and identity change ("I am no longer that person"). *(Contested Core)*
  6.  **Define "Competence" for Directive Application:** Must specify the capacities relevant *at the time treatment is needed* to invoke or override a directive (beyond simple legal thresholds). Must address whether competence to *refuse specific treatment now* automatically voids a directive *requesting* that refusal earlier (Case 3). *(Contested)*
  7.  **Handle Ambiguity & Unforeseen Circumstances:** Must provide a method (e.g., values inference, substituted judgment, best interests) to interpret directives with indeterminate terms (e.g., "extraordinary," "hopeless") or facing unforeseen treatments/situations (Case 5). *(Statutory Core)*
  8.  **Address Factual Errors:** Must specify how to handle directives based on demonstrably false empirical beliefs (Case 6a) vs. mistaken predictions about future values (Case 6b), if the distinction is recognized. *(Contested)*
  9.  **Account for Suffering vs. "Harm":** Must address whether merely continuing a life the past self deemed intolerable constitutes a harm *to the present self*, even if that self appears content (Case 1). *(Contested)*
  10. **Operationalize "Contentment" or Distress:** If present experience (e.g., apparent contentment in dementia) is relevant to overriding a directive, must provide a practically feasible, evidence-based method for assessment at the bedside. *(Operationally Challenging - Marked)*
  11. **Scope Limitation (Medical/Non-Medical):** Must explicitly state whether the theory's principles apply *only* to medical treatment decisions/bodily integrity (Case 7) or extend to other "precedent autonomy" acts (like manuscript destruction). If limited, must justify why. *(Contested)*
  12. **Integrate New Instrument 1: Transformation Clause:**
      *   Must define validity conditions (clarity, competence at signing).
      *   Resolve conflicts between the clause's trigger and contemporaneous wishes (e.g., meets condition but insists directive still applies; condition *is* the state the directive preempts).
      *   Specify who determines if the condition is met (patient, surrogate, clinicians, court?) and burden of proof.
      *   Address if the clause itself implies a theory of identity or radical value change. *(Novel & Complex - Statutory Core for Instrument)*
  13. **Integrate New Instrument 2: Continuing-Self Model (AI Prediction):**
      *   Define its legal status vis-à-vis a written directive and contemporaneous wishes (evidence? co-equal authority? overrides both?).
      *   Specify who can invoke it (patient, surrogate, clinician, system auto-applies?) and against whom (only if patient lacks capacity? over competent refusal?).
      *   Address epistemic challenges: How is "better prediction" validated? What data sources are permissible? How is bias mitigated?
      *   Resolve conflicts with written directives (does prediction *interpret* the directive or *supersede* it?). *(Novel & Highly Contested - Significant Operational Challenges Marked)*
  14. **Distinguish Void, Overridden, Reinterpreted:** Must provide clear, distinct pathways and criteria for:
      *   Declaring a directive invalid *ab initio* (void).
      *   Finding it valid but justifiably not followed *in this instance* (overridden).
      *   Interpreting its meaning differently than a literal reading suggests (reinterpreted). *(Essential for Clarity - Near-Universal)*
  15. **Balance Temporal Interests:** Must acknowledge and provide a framework (even if prioritizing one) for weighing the interests of:
      *   The past self (as expressed).
      *   The present self (as experienced/expressed).
      *   The person as a temporally extended whole. *(Contested Core)*
  16. **Feasible Implementation:** Must yield decisions that can be made based on evidence realistically obtainable at the bedside (e.g., chart, family input, basic observation, *not* deep philosophical inquiry or extensive historical research) within a timeframe relevant for clinical decisions (hours/days). *(Operational Imperative - Near-Universal)*

  ### Must-Preserve Distinctions (Cannot Collapse)
  *   Authority (Right to Decide) vs. Epistemics (Better Knowledge).
  *   Who Decides (Procedural Authority) vs. What Should Be Decided (Substantive Outcome).
  *   Directive Void vs. Overridden vs. Reinterpreted.
  *   Change in Factual Beliefs vs. Change in Core Values vs. Change in Personal Identity.
  *   Interests of Past Self vs. Present Self vs. Life as a Whole.
  *   Legal Competence Threshold vs. Capacities Relevant for Specific Decisions.
  *   Refusal due to Changed Values vs. Refusal due to Transient Fear/Impairment (Case 2 variant).

  ### Requirement Conflicts (Cannot be Jointly Satisfied)
  1.  **Never Override Contemporaneous Competent Refusal vs. Ground Authority Independently of Present Incompetence:** If a directive has genuine authority *even when* the patient is currently competent to refuse the treatment it mandates/refuses (as in the Psychiatric Ulysses Case 3), then overriding contemporaneous refusal must sometimes be permitted. Grounding authority *solely* in present incompetence avoids this but fails Ulysses pacts and struggles with the Convert Case 2 (if she becomes incompetent later). *(Fundamental Collision)*
  2.  **Sensitive Assessment of Personal Change vs. Administrable in Hours:** Truly assessing the kind/magnitude of value/identity change (Cases 1, 2, 6b, 8a) requires deep, often subjective, investigation into a person's biography and psychology – incompatible with bedside feasibility. Relying on crude proxies (e.g., diagnosis alone) collapses distinctions. *(Operational Collision)*
  3.  **AI Prediction as Authority vs. Respect for Contemporaneous Wishes (Competent or Not):** Granting the AI model authority potentially overrides both the written directive *and* the patient's current expressions. This fundamentally conflicts with respecting any form of contemporaneous expression (Requirement 3) and potentially with the directive itself (Requirement 1). *(Novel Collision for Instrument 2)*

  ### Most Exclusionary Requirement
  *   **Override Contemporaneous Competent Refusal (Requirement 3):** This requirement eliminates most standard accounts. Strong Precedent Autonomy views often reject overriding competent refusal. Best Interests/Supported Decisioning views prioritize current refusal. Only views specifically designed to handle Ulysses pacts (often relying on a "temporally extended interest" or "narrative unity" justification) or radical identity-change views can potentially satisfy it, and even then, operationalization is fraught.

  ### Audit of Your List & Assumptions
  *   **"Contented Dementia = Not Suffering":** This *is* empirically contested. While many appear content, research also shows significant unreported/unexpressed distress, isolation, and loss. Assuming contentment negates the "harm" of continued life (Case 1) leans towards a present-experience-focused view. *(Disputed Empirical Claim)*
  *   **"Directives frequently unavailable/unheeded":** Well-established empirically. Justifies the feasibility requirement (16). *(Established Empirical Claim)*
  *   **"Stated preferences drift, directives rarely revisited":** Well-established empirically. Highlights the importance of change over time (Requirement 5). *(Established Empirical Claim)*
  *   **Focus on Burden/Outcome in Disagreements:** This is primarily a **statutory drafting artifact/necessity**. Moral philosophy might focus on the "right" answer, but legislation must assign procedural responsibility and default outcomes. *(Artifact of Drafting)*
  *   **"Harm" in Continued Life:** The idea that continuing life judged intolerable *by the past self* constitutes harm *to the present self* (Case 1) is a **prejudice of strong precedent autonomy/identity-change camps**. Present-experience-focused views (Best Interests, Supported Decisioning) reject this. *(Camp Prejudice)*
  *   **Omissions:**
      *   *Surrogate's Role:* Requirements need explicit integration of how the named surrogate's judgment interacts with the directive, clinician judgment, and (potentially) AI predictions. Does the surrogate *interpret* the directive, *represent* past wishes, *advocate* for present interests?
      *   *Emergency Override:* Need clarity on whether clinicians can emergently override a directive/surrogate in immediate life-threatening situations pending ethics review. *(Added to Requirement 1/2 scope)*
      *   *Documentation & Evidence Standards:* Requirements for what constitutes a valid directive, proof of meeting transformation clauses, or reliability of AI models need specification. *(Implicit in 12,13,16 - needs emphasis)*
      *   *Conflicts of Interest:* How the theory handles potential conflicts (surrogate, clinician, institution) influencing interpretation/override.

  ### Position Type Scorecard

  | Position Type                  | Core Tenet                                                                 | Fails Requirement(s)                                                                                                  | Key Challenge Cases                                                                 |
  | :----------------------------- | :------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- |
  | **Strong Precedent Autonomy**  | Past self has binding authority over future self.                          | 3 (Override Contemp. Refusal), Often 10 (Operationalize Contentment), 12/13 (New Instruments), 5 (Radical Value Change). | 3 (Ulysses), 2 (Convert - if current refusal), 1 (Contented Dementia), 8a (Transformation insists). |
  | **Evidentiary Best Interests** | Directive is evidence for *current* best interests judgment.               | 4 (Collapses Authority/Epistemics), 1 (Doesn't resolve directive vs. surrogate/clinician clearly), 15 (Ignores Past Self). | 2 (Convert), 3 (Ulysses), 6 (Factual Error - if directive evidence only).           |
  | **Identity Change**            | Authority hinges on personal identity persistence. Directive void if not same person. | 5 (Hard to distinguish value/identity change), 10/16 (Impractical bedside identity assessment), 12 (Transformation clause nuances). | 1 (Contented Dementia - if identity gone), 2 (Convert - if identity gone), 7 (Manuscript). |
  | **Supported Decision Making**  | Rejects precedent autonomy framing. Focus on supporting *present* capacity/expression. | **All** requirements about directive authority (1,2,3,4,12,13,14,15). Views directives as planning tools, not binding authority. | *All* directive cases (1-8). Fundamentally incompatible with the remit.             |

  **Settled vs. Contested:**
  *   **Settled/Near-Universal:** The need for *some* mechanism to handle directives (Req 1), allocate burden (Req 2), distinguish void/override/reinterpret (Req 14), and be feasible (Req 16). The *distinction* between authority and epistemics is essential, though how to *apply* it is contested (Req 4).
  *   **Contested Core:** The source and scope of authority (Req 4, 5, 15), handling contemporaneous refusal (Req 3), defining relevant competence (Req 6), addressing factual vs. value errors (Req 8), the nature of "harm" (Req 9), and scope limitation (Req 11). The new instruments (Req 12, 13) are inherently contested.
  *   **Camp Prejudices:** The "harm" of continued life against past wishes (Req 9 - Strong PA/Identity), the primacy of present experience (Req 9/15 - Best Interests/SDM), the rejection of the entire framing (SDM).

  This specification provides the necessary framework to rigorously evaluate candidate theories against the practical demands of statutory drafting and clinical ethics committee function, while explicitly acknowledging operational limits and deep philosophical disagreements.
