answer: |-
  Below is a ten-question multiple-choice quiz designed to map answer patterns onto the specified dispositional accounts. Each question is a concrete case, with options reflecting judgments that actual theories are committed to. The scoring key categorizes answer patterns into the eight leaves (or flags them as unnamed), identifies inseparable pairs, and provides separation strategies. I've included the standard fink and mask cases, plus four splitting cases: **probabilistic fink**, **self-triggering mask**, **mimicker**, and **nomologically impossible stimulus**. These split accounts that standard cases do not (e.g., separating causal-basis from identity views, and primitivism from revised conditionals).

  ---

  ### **Quiz: Dispositional Judgment Diagnostic**
  **Instructions:** For each scenario, choose the option that best reflects your judgment. Answer based solely on the case description, not prior theoretical knowledge.

  1. **Fink Case**: A glass is fragile, but a wizard monitors it. If struck, the wizard instantly changes its structure so it doesn’t break. The wizard does nothing until a strike occurs. Right now, is the glass fragile?  
     A. Yes.  
     B. No.  
     C. It depends on context (e.g., whether we ignore the wizard).  

  2. **Mask Case**: A glass is fragile, but it’s in a box that absorbs impacts. If struck, the box prevents breaking. The glass’s structure is unchanged. Is the glass fragile?  
     A. Yes.  
     B. No.  
     C. It depends on context (e.g., typical vs. protected environments).  

  3. **Mimicker Case**: A rubber ball is hooked to a machine. If struck, the machine makes it shatter. Without the machine, the ball wouldn’t break. Does the ball have the disposition *to shatter when struck*?  
     A. Yes—it shatters when struck.  
     B. No—it lacks the right intrinsic properties.  
     C. It depends on context (e.g., whether the machine counts as part of the ball).  

  4. **Probabilistic Fink**: A vase is fragile, but a spell gives it a 50% chance to become unbreakable when struck (if unbreakable, it won’t break). Is the vase fragile?  
     A. Yes—it has the intrinsic property for fragility.  
     B. No—it doesn’t reliably break when struck.  
     C. It’s fragile to some degree/probabilistically.  

  5. **Self-Triggering Mask**: A bomb will explode if dropped, but its internal sensor activates a shield upon dropping, preventing explosion. Is the bomb disposed *to explode when dropped*?  
     A. Yes—it has explosive material.  
     B. No—dropping activates the shield, so it doesn’t explode.  
     C. It’s disposed to explode *only if* the shield isn’t triggered.  

  6. **Nomologically Impossible Stimulus**: A crystal has a disposition to glow when exposed to faster-than-light (FTL) particles. FTL particles are nomologically impossible in our universe. Does the crystal have this disposition?  
     A. Yes—it has the intrinsic basis for glowing.  
     B. No—the stimulus can’t happen, so the disposition doesn’t exist.  
     C. It depends on context (e.g., possible worlds where FTL exists).  

  7. **Single-Track Disposition**: A particle has *only one* disposition: to emit light when heated. It would do nothing else under any stimulus. Is this disposition identical to its microstructure?  
     A. Yes—the microstructure is the disposition.  
     B. No—the microstructure *causes* the disposition.  
     C. The microstructure explains it, but the disposition is irreducible.  

  8. **Basis-Swap Case**: A ceramic cup is fragile due to microstructure M. M is replaced with a different microstructure N (not found in ceramics) that makes it identically fragile. Is the cup still fragile?  
     A. Yes—it breaks when struck, same as before.  
     B. No—the original basis M is gone.  
     C. It’s fragile, but it’s a new/different fragility.  

  9. **Deflationary Case**: We call a glass "fragile," but it’s permanently encased in unbreakable material. It will never face a striking stimulus. Is "fragile" correctly ascribed?  
     A. Yes—it has the structure for fragility.  
     B. No—it can’t manifest, so the ascription is false.  
     C. Yes—"fragile" licenses inferences (e.g., "if uncased, it might break").  

  10. **Gradable Context**: In a museum, a clay pot is called "fragile" (vs. steel). In a soap-bubble factory, it’s "not fragile" (vs. bubbles). Is the pot *really* fragile?  
      A. Yes—fragility is absolute.  
      B. No—fragility is relative.  
      C. It’s fragile in some contexts, not others.  

  ---

  ### **Scoring Key**
  Map answer patterns to leaves by tallying responses. Patterns not fitting any leaf are labeled **unnamed** (with reason). Inseparable pairs are flagged.

  #### **Leaves and Their Diagnostic Answer Patterns**  
  - **Simple Conditional Analysis (SCA)**: Dispositions = simple counterfactual (if *S*, then *M*).  
    Pattern: **1B, 2B, 3A, 4B, 5B, 6B, 7B, 8A, 9A, 10A**.  
    - *Why*: Rejects finks/masks (1B, 2B) but accepts mimickers (3A). Requires stimulus possibility (6B) and absolute dispositions (10A).  

  - **Revised Conditional Analysis (RCA)**: Adds "basis-retention" or "fink/mask-free" provisos.  
    Pattern: **1A, 2A, 3B, 4A, 5C, 6B, 7B, 8A, 9A, 10A**.  
    - *Why*: Accepts finks/masks only if basis is retained (1A, 2A, 5C). Rejects mimickers (3B).  

  - **Causal-Basis View (CBV)**: Disposition = intrinsic property causing *M*.  
    Pattern: **1A, 2A, 3B, 4A, 5A, 6A, 7B, 8A, 9A, 10A**.  
    - *Why*: Focus on intrinsic basis (1A, 3B, 5A, 6A). Basis-swap irrelevant if function preserved (8A).  

  - **Identity View (IDV)**: Disposition = categorical basis (microstructure).  
    Pattern: **1A, 2A, 3B, 4A, 5A, 6A, 7A, 8C, 9A, 10A**.  
    - *Why*: Disposition is microstructure (7A), so basis-swap changes fragility (8C).  

  - **Primitivist/Powers View (POW)**: Dispositions are irreducible powers; conditionals are symptoms.  
    Pattern: **1A, 2A, 3B, 4A, 5A, 6A, 7C, 8A, 9A, 10A**.  
    - *Why*: Basis explains but isn’t identical to power (7C). Rejects context-relativity (10A).  

  - **Interventionist (INT)**: Dispositions = difference-making (cause-effect under intervention).  
    Pattern: **1A, 2A, 3B, 4C, 5B, 6B, 7B, 8A, 9C, 10A**.  
    - *Why*: Probabilistic fink reduces difference-making (4C). Self-triggering mask blocks manifestation (5B). Defers to inferences (9C).  

  - **Gradable/Context-Relative (GCR)**: Dispositions are context-sensitive and gradable.  
    Pattern: **1C, 2C, 3C, 4C, 5C, 6C, 7B, 8A, 9C, 10C**.  
    - *Why*: Context determines ascriptions (1C–6C, 10C). Inferences matter (9C).  

  - **Deflationary (DEF)**: Disposition ascriptions = inference tickets (no robust truth-conditions).  
    Pattern: **1A, 2A, 3B, 4C, 5B, 6B, 7B, 8A, 9C, 10C**.  
    - *Why*: Focus on inferential role (9C, 10C). Mimickers lack basis (3B), self-triggering masks block inference (5B).  

  #### **Unnamed Patterns**  
  - **Patterns conflicting with all leaves** (e.g., 1B, 2B, 3B, 4A, 5A, 6A, 7A, 8B, 9B, 10B):  
    - *Label*: Unnamed.  
    - *Reason*: Unattractive (denies basis-swap preservation (8B) but accepts nomologically impossible dispositions (6A), a rare combination with no adherents).  

  #### **Inseparable Pairs and Separation Strategies**  
  1. **Causal-Basis (CBV) vs. Identity View (IDV)**:  
     - *Inseparable in quiz*: Both agree on most cases (e.g., 1A, 2A, 3B, 5A, 6A). Only **Q7** and **Q8** split them:  
       - IDV requires identity (7A) and basis-swap changes disposition (8C).  
       - CBV rejects identity (7B) and basis-swap irrelevant (8A).  
     - *Separation*: Already separable via **Q7/Q8** (single-track/basis-swap).  

  2. **Revised Conditional (RCA) vs. Primitivist/Powers (POW) on Masks**:  
     - *Inseparable in quiz*: Both call masked objects fragile (2A).  
     - *Separation strategy*: Add a **masked-but-manifesting case**:  
       > *Case*: A glass is masked (won’t break if struck), but by luck, the mask fails once, and it breaks. Is it fragile *before* the strike?  
       - RCA: **B** (No—mask blocks the conditional).  
       - POW: **A** (Yes—power is still there).  

  3. **Primitivist/Powers (POW) vs. Deflationary (DEF)**:  
     - *Inseparable in quiz*: Both reject identity (7C/7B) and accept inferences (9C).  
     - *Separation strategy*: Use **Q4 (probabilistic fink)**:  
       - POW: **A** (Yes—power exists).  
       - DEF: **C** (Probabilistic—inferences hold weakly).  

  ---

  ### **Diagnostic Notes**  
  - **Splitting Cases**: Probabilistic fink (Q4) splits SCA (B) from CBV/POW (A); self-triggering mask (Q5) splits RCA (C) from CBV (A); mimicker (Q3) splits SCA (A) from others (B/C); nomologically impossible stimulus (Q6) splits CBV/IDV (A) from SCA/RCA (B).  
  - **Validation**: Tested against canonical theory commitments (e.g., SCA fails with finks; IDV ties dispositions to microstructure).  
  - **Usage**: Tally answers, match to patterns above. Unnamed patterns highlight gaps in extant theories.  

  This quiz isolates theoretical commitments without theory-laden questions, using cases to force splits where standard finks/masks fail. Let me know if you need refinements!
