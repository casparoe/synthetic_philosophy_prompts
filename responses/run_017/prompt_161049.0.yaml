prompt: |-
  You're a professional philosopher of perception who also happens to have the empirical literature on restoring sight to the congenitally blind in your head. No web access, so reason from what you know and say plainly where you're guessing. Brainstorm the sub-questions for a minute before you commit to any numbers.

  Concrete version of Molyneux's problem. Someone blind from birth, lots of tactile experience with objects, gets decent-but-imperfect vision suddenly as an adult (cataract removal, say). Within the first day of sight, before anyone lets them look at and touch the same object, we run a forced-choice cross-modal match: a shape they know well by touch is placed in front of them, out of reach, and they have to pick which of about six objects it is using sight alone. My credence that a group of such patients scores clearly above chance is 0.45. My coworker says 0.1, thinks this is just Locke's question and the answer is just no.

  Give me your number with the decomposition: one line and a rough probability each for (a) whether haptic and visual shape info share a format at all or need a learned mapping, (b) whether that mapping is learnable in hours-to-days versus weeks, (c) how much of any failure comes from the input quality being garbage — nystagmus, low acuity, crowding, figure-ground problems — rather than from the missing mapping, (d) whether 'recognize immediately' versus 'recognize eventually' even matters for what the question was supposed to show about nativism and modularity. Say how you combined them, which single term your number is most sensitive to, and which of me and my coworker is most likely wrong about which term.

  My coworker's actual argument, which I want you to take seriously: it's a data-format problem, tactile and visual shape live in different encodings and you need something like an alignment layer trained on correlated experience, and one day of vision isn't enough training signal. I think that overstates it — if the visual pipeline is already recovering 3D shape, the mapping might be close to free. Tell me who has the better version.

  One wrinkle I made up and haven't seen discussed: same test, but the patient spent the years before surgery using a sensory-substitution device (camera image onto a tactile grid on the tongue or back, or an auditory scan-line thing) and got good at naming objects with it. Does that move your number much, and is it because the device really delivers shape in a vision-like format or just because it's practice at a generic task? And what experiment would actually settle the disagreement between me and my coworker — I can design the study, I just don't know which result would force which of us to update.
