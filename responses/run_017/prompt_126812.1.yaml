   Conclusion 3: Adversarial exploit makes incoherence a security property.

     This is the one that relies most heavily on the analogy. We need the existence of an adversary that can force a guaranteed loss. The disanalogies:

        D1: The model is not an agent -> but the operator is acting as the bookmaker. We can shift the focus to the operator: the operator uses the model's reports as if they were odds. So the operator is effectively the bookmaker. This disanalogy does not break the conclusion if we consider the operator and the model together as a system.

