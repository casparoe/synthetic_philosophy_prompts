  2) "No inner place" translates to the implied author's absence; the text generates its own authority without needing an internal editor.
  3) The "posited self" maps neatly to narrative persona construction in revision - how characters get refined across drafts.
  4) "First-person reports as data" parallels how textual evidence overrides narrator statements.

  For the residue section, three friction points need addressing:
  - The "illusion without audience" problem: in fiction all illusions target readers, but the philosophical claim denies any internal audience. This exposes a fundamental gap between narrative artifice and phenomenological reality.
  - The "further fact" question: is this about representation or ontology? Craft can only handle the former, leaving the latter as untranslatable residue.
  - The "verbal dispute" issue: when philosophers argue about qualia vs illusions, it's like arguing over whether deleted scenes "count" as part of the novel - different framings of what constitutes the work.

  I'm structuring the response with strict word limits: under 300 words for Translation, under 300 for Residue. Using bullet points as requested, avoiding academic citations. The closing thought will emphasize that the residue challenges both vocabulary and theory equally - the collision reveals limits in both artistic and philosophical languages for capturing consciousness.

  Noticing the user's cabin isolation, I'm ensuring the response stands alone without follow-up resources. The craft-focused vocabulary must remain precise yet accessible, respecting their sophisticated understanding of narrative technique while admitting where philosophy exceeds its grasp.
answer: |-
  ### Translation

  1.  **Stream as Edited Presentation:** What a character (or narrator) presents as their continuous, authentic inner monologue (free indirect discourse) is, in reality, a *revised final draft*. It's a constructed narrative summary, not a raw transcript. Significant deliberation, conflicting impulses, and dead-end thoughts exist only in the "cutting-room floor" material or survive as ambiguous "moods" the character cannot narratively account for.
  2.  **No Inner Theater:** There is no implied author *inside the character's mind* assembling this presentation for an inner audience. The point of view (POV) discipline of staying strictly within the character's moment-by-moment experience reveals no such backstage operation; the presentation *is* the experience from within.
  3.  **Self as Posited Character:** The "I" to whom the stream is narrated (the character's sense of self as agent/experiencer) is itself a narrative construct *within* the presentation, akin to a character built through the narration. It's not the *source* of the perceiving but a *product* of the narrative summary, drafted alongside the events it describes.
  4.  **Reports as Textual Data:** First-person narration (or its free indirect equivalent) should be analyzed as textual evidence *within the scene* – like dialogue or described action – revealing the character's *constructed self-understanding* at that moment. Its authority is limited to showing *that construction*, not what "really happened" psychologically (the rival tendencies, the promotion process). The "unreliable narrator" gap exists between the narrated self and the implied author's (or reader's) understanding of the underlying psychological mechanics suggested by the totality of the text (including the "flat" register).

  ### Residue

  **Clean Carryover:**
  *   **Stream as Edited Draft:** Maps directly to the "production register" device. The "lived" column *is* the final draft; the "flat" column *is* the cutting-room floor/revision history showing the promotion process.
  *   **Self as Narrative Construct:** Translates cleanly to character being a "useful posit" built *by* the narration. The character's avowed self is a persona emerging from the summary, not its origin.
  *   **Reports as Data:** Aligns perfectly with treating narration as textual evidence subject to interpretation, creating unreliability via the gap between stated experience and implied psychological mechanics (shown in the flat register).

  **Carryover with Distortion:**
  *   **No Inner Theater/User Illusion:** In craft, the "implied author" assembles the text *for the reader*. The philosopher denies *any* internal user/auditor. Translating "no inner place" *only* as the discipline of close POV (showing no backstage) subtly distorts the claim: it's not just that we *don't show* the theater, but that there *is no theater* to show, even for the character. The "illusion addressed to nobody" problem highlights this: craft presupposes an authorial/reader framework the theory explicitly rejects for consciousness.

  **No Counterpart:**
  *   **The "Further Fact" Question:** The theory asserts there *is* no deeper reality behind the presentation (no "real chooser" in the character's head). Craft vocabulary (implied author, textual evidence, revision history) inherently deals *only* with levels of representation and construction *within the fictional world*. It cannot adjudicate the ontological claim that there's nothing *more* to consciousness than this production process. This is a claim *about* reality, not just about narrative construction *within* a fiction.
  *   **Qualia vs. Illusion Dispute:** Framing the philosophical quarrel as editors arguing over whether a scene (e.g., "tasting coffee") is "in the book" (published text vs. draft) presumes a shared fictional world. The dispute is whether the *entire concept of "what it's like"* (the published text of experience) refers to something real *or is itself the illusion*. This is a meta-level disagreement about the *status of the book itself*, not just its contents, which has no direct craft parallel.

  **Final Sentence:** The residue indicts neither vocabulary nor theory exclusively, but reveals the fundamental gap between describing the *construction of subjective representation* (craft's domain) and asserting the *ontological status of subjectivity itself* (the theory's core claim).
