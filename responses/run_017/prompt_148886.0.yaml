  For the cases: the synthetic cell challenges historical necessity; the somatic mutation tests units of selection; the rewired gene probes historical persistence. I'll ensure both positions get fair treatment - for example, the causal-role theorist would say the synthetic cell has functions while the selected-effects theorist would deny it.

  In the closing analysis, I'll argue that the core disagreement is substantive but partially verbal. The theories analyze distinct concepts used in different biological contexts - selected-effects for evolutionary questions, causal-role for physiological mechanisms. Both could potentially change their minds if, say, biologists consistently treated synthetic organisms as functional or if selected-effects accounts could explain novel traits without history.

