  Below is a 7-question quiz designed to sort readers into theories of vagueness (epistemicism, supervaluationism, degree-theoretic/fuzzy, contextualism, meaning nihilism) using real-world journalism cases. No prior knowledge of philosophy or the sorites paradox is needed—readers engage with practical dilemmas about labeling AI-generated content. Each question focuses on concrete scenarios, avoiding abstract metaphysical debates.

  ---

  ### **The AI Labeling Quiz: Where Do You Draw the Line?**
  *Answer based on your instincts. No wrong answers—just your take on real cases.*

  1.  **The 10% Draft**  
      A news article is drafted with 10% AI-generated text (e.g., auto-completed sentences) and 90% human writing. Should it carry an "AI-generated" label?  
      A. **Yes**—any AI involvement should be disclosed.  
      B. **No**—it’s overwhelmingly human work; the label would mislead.  
      C. **Maybe**—it depends on the article’s topic or publication’s standards.  
      D. **Follow policy**—if the rules say 0% is the cutoff, label it; if 20%, don’t.  
      E. **The label is arbitrary**—there’s no real difference between 10% and 20%.  

  2.  **The Policy Committee**  
      A media committee sets an "AI-generated" threshold at 20% for labeling. They admit it’s arbitrary but say it’s necessary for consistency. What’s your view?  
      A. **Good call**—we need a clear rule, even if imperfect.  
      B. **Flawed**—there’s a true threshold; this might be wrong.  
      C. **Inadequate**—AI involvement isn’t yes/no; a percentage would be fairer.  
      D. **Too rigid**—the threshold should adjust for context (e.g., news vs. fiction).  
      E. **Pointless**—no fixed rule can capture a meaningless concept.  

  3.  **The Judge’s Dilemma**  
      A judge must rule "yes" or "no" on whether a document with 49% AI content requires an "AI-generated" label. The law is vague. They can’t say "sort of." What should they do?  
      A. **Rule based on facts**—there’s a correct answer, even if unclear.  
      B. **Consider context**—factors like the document’s purpose could sway it.  
      C. **Pick one arbitrarily**—borderline cases force a choice, even if unfair.  
      D. **Aim for nuance**—49% is closer to human-dominant, so rule "no."  
      E. **The law is nonsense**—no ruling is "correct" because the term is empty.  

  4.  **The Editor Dispute**  
      Two editors argue over labeling a document that’s exactly 50% AI-generated. One insists it needs the label; the other disagrees. What’s happening?  
      A. **One is objectively right**—we just don’t know who.  
      B. **Both could be right**—without a strict rule, neither is wrong.  
      C. **50% is gray**—it should be labeled with a percentage, not a binary.  
      D. **Context decides**—their disagreement reflects different standards.  
      E. **They’re debating nothing**—"AI-generated" has no fixed meaning.  

  5.  **The 60% Document**  
      Is there a definite fact about whether a document with 60% AI-generated content is "AI-generated"?  
      A. **Yes, definitely**—it’s clearly over the line.  
      B. **Yes, but uncertain**—there’s a fact, but we might debate it.  
      C. **It’s partial**—it’s mostly AI, but not absolutely.  
      D. **Depends on stakes**—in low-risk cases, maybe not; in high-risk, yes.  
      E. **No fact exists**—the term is too vague for truth.  

  6.  **High-Stakes Shift**  
      For medical advice, do the rules for "AI-generated" labeling become stricter (e.g., even 5% AI requires a label)?  
      A. **No**—the meaning of "AI-generated" doesn’t change; we’re just cautious.  
      B. **No, but the rule should**—the threshold lowers for safety, not meaning.  
      C. **Yes**—high stakes shrink what counts as "human-enough."  
      D. **Yes, contextually**—the conversation’s stakes alter the term’s meaning.  
      E. **Irrelevant**—the concept is incoherent either way.  

  7.  **Perfect Knowledge Test**  
      If we could perfectly measure every AI/human contribution in a document, would that resolve whether it’s "AI-generated"?  
      A. **Yes**—it would reveal the exact threshold.  
      B. **Yes, by defining one**—we could finally set a sharp boundary.  
      C. **No**—even then, AI involvement is a matter of degree.  
      D. **No**—context (like the reader’s needs) would still matter.  
      E. **No**—the term doesn’t point to anything real.  

  ---

  ### **Scoring Key: What’s Your Theory?**
  Tally your answers. **Each letter maps to a theory** (A=Epistemicism, B=Supervaluationism, C=Degree-theoretic/Fuzzy, D=Contextualism, E=Meaning Nihilism). The theory with the **most matches** is your result.  
  - **Epistemicism (A)**: Vagueness is ignorance. There’s a sharp cutoff (e.g., 32.7% AI), but we’re bad at finding it.  
  - **Supervaluationism (B)**: Multiple "sharp" cutoffs are valid until specified. Borderline cases (e.g., 50%) are neither true nor false.  
  - **Degree-theoretic/Fuzzy (C)**: Truth is gradual (e.g., 60% AI = 60% "true" it’s AI-generated).  
  - **Contextualism (D)**: Meaning shifts with context (e.g., "AI-generated" means something stricter in medical news).  
  - **Meaning Nihilism (E)**: The term is hopelessly vague—no facts or boundaries exist.  

  #### **Ambiguities & Unoccupied Positions**
  - **Can’t separate**:  
    - **Epistemicism vs. Supervaluationism** in "clear" cases (e.g., Q5). Both agree on definite facts but differ on borderline handling (Q3/Q4 expose this).  
    - **Contextualism vs. Degree-theoretic** in low-stakes scenarios (Q6). Both support flexibility, but contextualism focuses on social context, degrees on inherent fuzziness.  
  - **Unoccupied combinations** (no theory matches these patterns):  
    - **Mostly A + Q3-C or Q4-B**: Incoherent. Epistemicism rejects arbitrary borderlines (Q3-C) and insists one person is right (Q4-B clashes with Q4-A).  
    - **Mostly D + Q2-A or Q7-A**: Unattractive. Contextualism rejects fixed rules (Q2-A) and fact-based thresholds (Q7-A).  
    - **Mostly C + Q6-A**: Unexplored. Degree-theoretic typically avoids "fixed meaning" answers like Q6-A.  

  #### **How to Use**
  - **For journalism**: This quiz highlights how policies, ethics, and language collide in AI labeling.  
  - **For philosophy**: It’s a sorites paradox in disguise—small changes (1% AI) challenge binary categories.  
  - **Readers**: Get your result and debate! Should 50.1% AI be labeled? Does context override policy? Your theory shapes your answer.
