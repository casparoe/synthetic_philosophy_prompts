  The questions:

  1. Scenario: A news article is written with 10% AI-generated text and 90% human-written. The editor must decide: does this require an "AI-generated" label?
     Choices:
     A) Yes, because any AI involvement should be disclosed.
     B) No, because the human contribution is dominant and it's essentially a human work.
     C) It depends on the context and purpose of the article.
     D) There is a precise threshold (say 50%) set by policy, and we should follow that regardless of this case.
     E) The question is fundamentally flawed because there's no fact of the matter about when something becomes "AI-generated".

  2. Scenario: A policy committee is setting rules for AI disclosure. They arbitrarily pick 20% as the threshold requiring a label. What do you think of this approach?
     Choices:
     A) It's necessary to have a clear line, even if arbitrary, to avoid ambiguity.
     B) It's a mistake because the boundary isn't arbitrary; there's a true threshold we just don't know.
     C) It's a good practical solution, but the line isn't really sharp; it's a simplification for the rules.
     D) The threshold should vary depending on the context (e.g., news vs. fiction).
     E) The whole endeavor is pointless because the concept is inherently meaningless.

  3. Scenario: A judge must rule whether a document with 49% AI-generated content requires an "AI-generated" label under a law that uses the term without defining it. The law requires a yes/no answer.
     Choices:
