     B) Both are correct in different ways because the document is borderline and both answers are acceptable until we sharpen the meaning.
     C) The document is partially AI-generated and partially not, so it should be labeled with a percentage, not a binary label.
     D) They are both right relative to their own standards or the context they are considering.
     E) They are arguing about nothing because "AI-generated" has no fixed meaning.

  5. Scenario: Consider a document that is 60% AI-generated. Is there a fact of the matter about whether it is "AI-generated"?
