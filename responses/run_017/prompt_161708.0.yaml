     B) The judge should rule based on the best interpretation of the law in this context, which might be "no" but could be different in another context.
     C) The judge should acknowledge that 49% is borderline but must pick one; it's arbitrary but necessary.
     D) The judge should rule "no" because it's more human than AI, but note that the law is vague and this is a borderline case.
     E) The judge should rule either way because there's no fact of the matter; the law is meaningless.

  4. Scenario: Two editors are arguing about a document that is exactly 50% AI-generated. One says it should be labeled, the other says it shouldn't. What's going on?
