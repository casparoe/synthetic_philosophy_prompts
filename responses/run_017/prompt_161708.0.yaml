  Hey — I'm a journalist doing a piece on how every platform now demands an "AI-generated" label while nobody can say how much human rewriting stops counting. A philosopher friend says this is just the sorites paradox in a hoodie, so I want a sidebar: a 7-question quiz that sorts readers into a theory of vagueness without ever naming one.

  Every question should be a plain-English case from my beat: a draft that's 10% model-written versus 90%; a policy committee that just picks a number and declares that's the line now; a judge who has to rule yes-or-no on a borderline case and isn't allowed to say "sort of"; two editors who disagree about the same borderline document; whether there's a fact of the matter here that we simply can't ever find out; whether the word's meaning shifts with what's at stake in the conversation. Nothing like "is vagueness in the world or in our heads" — I want them sorted by what they say about cases, not by which label they like.

  Then give me a scoring key mapping answer patterns onto epistemicism, supervaluationism, degree-theoretic (fuzzy) views, contextualism, and the meaning-nihilist option — and flag which pairs of positions my questions can't actually seperate, plus any combination of answers no real theory occupies (and whether that's because it's incoherent, just unattractive, or merely unexplored). Readers are sharp but have never heard the word "sorites".
