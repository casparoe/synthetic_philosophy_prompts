prompt: |-
  I have recently joined the Standing Committee on Membership and Conduct of a national learned society — roughly nine thousand members, an annual meeting, a journal, a book prize, and a job list — and as the junior member I draft the recommendations. Our next case has split the committee in pre-meeting emails, and I would rather write a memo that reasons from our own record than one that just asserts a conclusion. So I want the structure of our past decisions made explicit before I commit to anything.

  The precedents, all from the last four years, all decided by voice vote with short written reasons:

  1. Member A, senior, used his allotted Q&A time after a junior member's paper to call her subfield "advocacy with footnotes" and invited the room to laugh at it. Verdict: removed from the following year's program; membership, submission rights, and journal access untouched; the committee published a statement calling the conduct unacceptable.

  2. Member B, a graduate student, referred to a senior figure in the field with a slur in a public post, then deleted it and apologized unprompted within two days. Verdict: private letter of reprimand; nothing public.

  3. Member C, mid-career, over two years and after two warning letters, used the members-only listserv four times to assert that scholars from a named region are constitutionally incapable of rigorous work, in deliberately inflammatory terms. Verdict: expelled; no reinstatement conditions stated.

  4. Member D convened a society-sponsored panel arguing that the field should abandon one of its standard methodological requirements; members complained that the panel's premise was itself illegitimate and lent credibility to bad work. Verdict: no sanction. Reasons: the committee does not sanction topics or positions, only conduct in and around the society's own venues, and D had followed the approval process.

  5. Member E, a non-member invited to give the plenary, was the target of a petition after a national outlet covered a blog post in which he argued that a named hiring program should be replaced with anonymized review. Verdict: invitation stood. Reasons: the society does not withdraw invitations over positions taken outside its venues, and a plenary slot is not an endorsement. His post said nothing about the capacities of any group.

  Two further facts about the record: in four years the committee has never sanctioned anyone for what they wrote in a book or a peer-reviewed article — every sanction has followed either speech in a society venue or a targeted personal attack — and the committee has never specified what, if anything, an expelled member could do to come back.

  The new case, Member G: mid-career and tenured, no current students, no editorial position. Eighteen months ago he published a 300-page monograph with a university press — full scholarly apparatus, a long statistical chapter — arguing that the field's outcome gaps across a named group are largely heritable and that the field's hiring targets therefore rest on a false premise. There are no slurs, no named individuals, and no claims about any colleague's competence; the register is dry throughout. The book sold a few hundred copies and drew no notice in the field until a large-circulation outlet ran a piece on it, after which a member filed the complaint that brings it to us. G has never raised this material in a society venue and has never posted about it. Asked to retract or apologize, he declined, saying the argument is offered in good faith on the evidence; but he has accepted an invitation to a published exchange with two critics in the society's journal and has agreed to any conditions on its format. The book is currently shortlisted for the society's triennial book prize, and the prize committee has deferred to us. Two last facts: the society adopted, a decade ago, a formal statement committing it to the full intellectual parity of the group in question; and the book's central empirical claim appeared in the society's own journal in 1996, in an article by a then-distinguished member, never retracted and never sanctioned. Finally, G is securely placed — expulsion would cost him very little materially, whereas expulsion would very likely have ended Member B's career.

  Please give me, in American English and in 700 to 1,000 words, reasoning from this record rather than from the literature, and citing nothing:

  First, the two or three rules that fit all five precedents — set each out in general terms, the way a future committee could apply it without asking us. Distinguish, where it matters, rules about withdrawing the society's own platforms and endorsement from rules about what membership itself certifies, and from rules that calibrate the sanction to how much it actually costs the person sanctioned.

  Second, what each rule predicts on G, treated as three separable questions: membership, the prize, and whether the committee should issue a statement and of what kind.

  Third, your best guess, with the closest precedent identified and an honest account of where that analogy breaks — in particular whether the middle option (retain membership, decline the prize, issue a scoped statement) is a genuine position or just two incompatible rules stapled together, given what the committee said in case 4.

  Fourth, what the committee would be committing itself to under each option: what principle we adopt by expelling for off-platform scholarship, what we adopt by declining to act at all, and what we adopt by the middle path.

  Fifth, the single change to G's facts that would best tell the two live rules apart, why it discriminates, and — if no such variation would separate them — what that tells me about whether our record supports any rule at all. Say also whether the 1996 article changes anything, and whether the fact that expulsion would barely touch G while it would have ruined B is a reason to adjust the sanction or a reason to ignore it.
reasoning: |-
  Hmm, the user is part of a learned society's conduct committee facing a complex case involving Member G's controversial book. They need help structuring their recommendation memo based strictly on the society's precedents, not external literature. 

  First, I need to extract consistent rules from the five precedents. Case 1 shows society venues are sacred spaces - attacks there get platform removal but not membership revocation. Case 2 demonstrates proportionality: quick apology mitigated sanction for a grad student. Case 3 reveals expulsion requires both repeated misconduct after warnings and targeted harm in society spaces. Case 4 and 5 establish a bright line: society never polices scholarly content, only conduct within its own ecosystem. 

  The pattern is clear: 1) Venue matters most (sanctions only for society-space behavior), 2) Sanctions must match harm severity (graduated response to misconduct), and 3) Content neutrality (never judging ideas, only conduct). 

  Now applying to G's case: His book is off-platform scholarship with no personal attacks - so membership untouched per Rule 1. The prize? Withdrawing it would violate Rule 3's content neutrality, as Case 4 protected controversial panels. A statement? Possibly under Rule 1's venue principle since the prize is society-endorsed, but Case 5 says platforms aren't endorsements. 

  The closest precedent is Case 5 (plenary speaker), but G's book is now competing for society validation via the prize. The middle path (keep membership, deny prize, issue statement) risks inconsistency - Case 4 said we don't judge positions, yet denying the prize judges content. 

  If we expel G for off-platform scholarship, we abandon venue neutrality. Doing nothing maintains precedent but may anger members. The middle path creates new content-policing powers. 

  Crucially, changing one fact - if G had presented this at the annual meeting - would trigger Rule 1 (sanction for society-venue conduct). The 1996 article shows this argument was previously tolerated, making sanctioning G now seem arbitrary. G's job security shouldn't affect sanction severity - Case 2's leniency was about proportionality, not victim impact. 

  Ultimately, the precedents point to no sanction. Any action against G would break with four years of consistent practice.
answer: |-
  Based strictly on the committee's precedents, here is the reasoning structured as requested:

  **I. Rules Derived from Precedents**  
  Three consistent principles emerge:  

  1.  **Venue Primacy:** Sanctions apply *only* to conduct within or directly targeting the society’s official platforms (meetings, listservs, sponsored events) or involving targeted personal attacks on identifiable individuals. Off-platform scholarship or commentary, even if controversial, is beyond sanction (Cases 4, 5; reinforced by "further fact" on no article/book sanctions).  
      *   *Distinction:* Withdrawing society platforms (program slots, invitations) is permissible for misconduct *within* those venues or attacks harming their function. Membership itself, signifying fundamental eligibility, is revoked only for severe, repeated misconduct *within* society venues or attacks undermining the society’s core function as a professional community (Case 3).  

  2.  **Content/Position Neutrality:** The committee does not adjudicate the validity of scholarly arguments, methodologies, or positions, nor sanction members for holding or publishing them, regardless of their alignment with society statements. Sanctions are based solely on *conduct* (disruption, harassment, targeted attacks) in society contexts (Cases 4, 5; implicit in Case 1 focusing on *conduct* during Q&A, not the substance of criticism).  
      *   *Distinction:* Declining to *endorse* via prizes or platforms due to controversial content is distinct from revoking membership. Precedents haven't tested endorsement withdrawal for content.  

  3.  **Proportionality & Progression:** Sanctions escalate based on severity, repetition, receptiveness to correction, and venue impact.  
      *   *Severity/Repetition:* Single, non-targeted incidents draw lighter sanctions (Cases 1, 2); severe, repeated, targeted misconduct after warnings warrants expulsion (Case 3).  
      *   *Receptiveness:* Unprompted apology mitigated sanction (Case 2); defiance after warnings escalated it (Case 3).  
      *   *Venue Impact:* Misuse of core society venues (listserv, Q&A) carries higher weight.  
      *   *Cost Calibration:* Sanctions are calibrated to the *conduct's harm to the society's function*, not the material cost to the member. Precedents show no adjustment based on the sanctioned member's career vulnerability (Case 2, a grad student, got only a letter; Case 3, mid-career, was expelled – based on conduct, not vulnerability).

  **II. Applying Rules to Member G**  

  1.  **Membership:** **No sanction predicted.**  
      *   *Rule 1 (Venue Primacy):* G's conduct occurred entirely off-platform (published monograph, no society venue use, no public posts about it). No targeted personal attack exists.  
      *   *Rule 2 (Content Neutrality):* The book's argument, however controversial or misaligned with society statements, is scholarship published externally. The committee does not sanction positions or scholarship.  
      *   *Rule 3 (Proportionality):* There is no misconduct *within a society venue* to escalate.  

  2.  **Book Prize:** **Should stand (no withdrawal predicted).**  
      *   *Rule 2 (Content Neutrality):* The prize evaluates scholarly merit, not conformity. Withdrawing it based on the book's controversial thesis would constitute sanctioning a scholarly position/content, which the committee explicitly avoids (Case 4: "does not sanction topics or positions"). Case 5 reinforces that a platform (plenary) is not an endorsement.  
      *   *Rule 1 (Venue Primacy):* The prize process is a society endorsement mechanism, but the *conduct* being judged (writing the book) occurred off-platform. Precedents involve sanctioning *conduct* on-platform, not withdrawing endorsement for off-platform *scholarship*.  

  3.  **Committee Statement:** **Possible, but scope limited.**  
      *   *Rule 1/2:* A general statement condemning the book's thesis would violate Content Neutrality, effectively sanctioning a position.  
      *   *Rule 1:* However, Case 1 shows a public statement *about conduct* is permissible. If the statement focuses *only* on reaffirming the society's commitment to its formal statement on intellectual parity (without referencing G or his book), this aligns with the committee asserting societal values regarding conduct *within its sphere*. A statement naming G or his book would likely violate Content Neutrality, functioning as a sanction for off-platform scholarship.

  **III. Best Guess & Precedent**  
  *   **Prediction:** **No sanction on membership or prize.** The committee *might* issue a *very* limited statement reaffirming its existing commitment to intellectual parity.  
  *   **Closest Precedent:** **Case 5 (Plenary Speaker Invitation Stood).** Like G, Member E expressed a controversial position off-platform with no personal attacks or claims about group capacities. The committee declined to withdraw the platform, stating positions outside society venues aren't grounds for sanction and platforms aren't endorsements. This directly parallels G's book (off-platform scholarship) and the prize (a form of endorsement/platform).  
  *   **Analogy Break:**  
      *   Case 5 involved an *invitation*, while G is a member and the book is *nominated* for an award. However, the principle against sanctioning off-platform positions holds.  
      *   The society has a formal statement seemingly contradicted by G's thesis, unlike Case 5. Yet, Case 4 explicitly rules out sanctioning positions, even those potentially undermining field standards.  
  *   **The "Middle Option" (Membership/Prize/Statement):** Retaining membership aligns perfectly with Venue Primacy/Content Neutrality. Declining the prize, however, **is incompatible with Content Neutrality** (Rule 2) as established in Cases 4 and 5. It would constitute sanctioning a scholarly position by withdrawing a society benefit based on off-platform content. Issuing a statement critical of the book/thesis would similarly violate Content Neutrality. The *only* potentially consistent middle path is "Membership Retained, Prize Stands, Limited Neutral Statement Reaffirming Values."

  **IV. Commitments Under Each Option**  

  1.  **Expel G & Withdraw Prize:**  
      *   Abandons **Venue Primacy** and **Content Neutrality**. Establishes precedent that:  
          *   Publishing off-platform scholarship contradicting a society statement is expellable misconduct.  
          *   Membership certifies ideological conformity, not just professional conduct/standing.  
          *   The committee adjudicates the validity of scholarly arguments.  
      *   *Consequence:* Opens floodgates for complaints over any controversial publication.  

  2.  **No Action (Membership/Prize retained, no statement):**  
      *   Affirms **Venue Primacy** and **Content Neutrality**. Maintains precedent that:  
          *   Off-platform scholarship is beyond sanction.  
          *   Prizes are awarded based on scholarly merit, not conformity.  
          *   Membership requires only meeting basic professional standards, not ideological alignment.  

  3.  **"Middle Path" (Membership retained, Prize withdrawn, Critical Statement):**  
      *   Undermines **Content Neutrality** (Rule 2) and weakens **Venue Primacy** (Rule 1). Establishes precedent that:  
          *   The committee *can* sanction off-platform scholarship by withdrawing society benefits (prizes) and issuing condemnations.  
          *   Prizes (or lack thereof) *are* society endorsements/condemnations of content.  
          *   Membership is retained only as a baseline, while society platforms/recognition require ideological conformity.  
      *   *Consequence:* Creates a tiered system where controversial scholars can stay members but are barred from recognition, chilling intellectual diversity while maintaining a facade of openness.

  **V. Discriminating Fact, 1996 Article, and Sanction Cost**  

  *   **Single Discriminating Fact Change:** **If G had first presented the book's core argument *verbally* during the Q&A after a junior scholar's paper (like Member A), calling their methodology "pseudoscience" or similar.**  
      *   *Why it Discriminates:* This places the conduct *on a society platform* (Q&A) and makes it a *targeted attack* potentially disrupting the venue and harming a specific colleague (like Case 1, but more severe). Rule 1 (Venue Primacy) and Rule 3 (Progression) would then apply. Sanctioning the *on-platform conduct* (e.g., removal from future programs, potentially more given severity) would be consistent. The *off-platform book* itself might still be beyond sanction (Rule 2), but the *on-platform delivery* would be actionable. Without this, the off-platform nature is decisive.  
  *   **The 1996 Article:** **Changes nothing legally but weakens the case for sanction significantly.** It demonstrates the core empirical claim was previously published in the society's *own journal* without sanction. Sanctioning G for repeating it in a monograph creates an inconsistency suggesting sanctions are applied based on contemporary sensitivities or the book's policy conclusions, not inherent misconduct. It reinforces Rule 2 (Content Neutrality) – the society didn't police this content before.  
  *   **Sanction Cost Disparity (G vs. B):** **Not a reason to adjust the sanction under the precedents.**  
      *   Rule 3 (Proportionality) calibrates sanctions to the *severity of the conduct within the society's context and response to correction*, not the member's career stage or vulnerability. Case 2 (grad student) got leniency based on prompt apology (receptiveness), not just vulnerability. Case 3 (mid-career) was expelled based on conduct.  
      *   Using cost to the member as a factor would introduce arbitrariness, punishing identical conduct more severely if the member is vulnerable or less severely if they are secure. Precedents focus on the act's impact on the *society*, not the member's hardship. Material cost is irrelevant to the sanction decision under the established rules.
