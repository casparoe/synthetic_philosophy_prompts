prompt: |-
  I direct training for a free, anonymous advice service that runs a phone line and a web chat and fields roughly two hundred questions a week, and my sense from reading the logs is that the overwhelming majority are not requests for information at all but requests for a moral verdict: should I tell my sister what I saw her boyfriend do, am I obliged to offer a kidney to my father, is it disloyal to move to another city when my mother is ill, do I have to report a colleague I watched take money from the till. Our volunteers are eighteen to twenty-five, they receive two days of training and then take shifts unsupervised, the exchanges are one-shot and usually over within ten minutes, and nothing follows the questioner afterwards. Over the past year I have grown uneasy about what we are actually doing when we answer. My volunteers come from a narrow slice of one country's middle class, our logged verdicts visibly cluster by volunteer age and background, and when someone writes back it is often to say, in effect, that they had already decided and were hoping we would tell them they were permitted. I keep circling the philosophical question of whether a person can come to hold a moral view on the strength of someone else's say-so, and of what is missing when they do, but I need that question turned into something my volunteers can run rather than something to discuss in training. My current draft triage has three outputs: give a verdict, decline to give one and work through the reasons with the questioner instead, or redirect to someone better placed, meaning either a professional with the relevant non-moral knowledge or a person with the relevant lived experience. I am fairly sure this is too coarse, and that a volunteer with two days of training cannot tell which output is right without some prior questions.

  What I want is an ordered procedure: the questions in sequence, and for each one an account of what would count as a sufficient answer in the ninety seconds a volunteer actually has before the chat goes quiet, where the procedure stops with no verdict at all, and where it hands the decision to a person because the matter is one of values or of particulars the volunteer cannot see. It has to be short enough to hold in the head after two days of training, phrased so that a supervisor reading the log the next morning can tell whether it was followed, and it has to cope with at least these recurring shapes of question: the questioner who has already decided and wants permission; the questioner in distress who simply wants to be told what to do; the questioner who asks what some third party should do, or whether a third party wronged them, rather than what they themselves should do; the question whose morally relevant facts are unknown to the volunteer and would have to be guessed at; the question on which the volunteer is, unusually, the person in the room with the relevant experience; and the question that nearly everyone the volunteer can imagine would answer the same way, as against the one on which thoughtful people plainly disagree. Please then run the finished procedure in full on three of our real shapes so I can watch it work: a twenty-year-old asking whether she must report a coworker she saw taking money; a man in his thirties asking whether he is a bad person for refusing to donate a kidney to the father who was violent to him; and a sixteen-year-old writing at two in the morning, apparently frightened, to ask whether it would be wrong to call the police on her mother. My own instinct is that volunteers should almost never issue verdicts and should nearly always do the slower work of reasons instead, so if your procedure tells me that in some of these cases they must issue one anyway, I want that argued rather than asserted, and I would like at least one worked case where the procedure returns an answer I will dislike, so that I can find out whether I am prepared to trust it.

  Be explicit about what the procedure cannot do. I take it that no sequence of questions will make a volunteer's verdict correct if their underlying judgment is bad, and that a one-shot exchange can hand someone a sentence without handing them whatever it is that makes the sentence true, but tell me what else is missing and mark the point at which this stops being a procedure and becomes a judgment call that no checklist can remove. Close by saying, in a sentence or two, what would most change your mind about the procedure you have given me, whether that is an objection to routinizing this kind of thing at all or some pattern in our logs that would convince you it is doing harm, and by flagging the failure mode you would expect to surface only after a few months of use rather than in the first week. Write the whole thing as continuous prose, the way you would write a long email to someone who asked you for a favour, with no headings, bullet points, bold text or tables, and aim for something in the neighbourhood of fourteen hundred words that a tired volunteer could read once and still remember. Do not cite any literature and do not point me toward further reading; I have no library access and would not follow it up, so I need the distinctions stated in your own words and in terms my volunteers could act on.
reasoning: |-
  Okay, the user runs a free advice service with volunteers handling moral questions via phone and chat. I need to create a step-by-step procedure for volunteers to follow when faced with requests for moral verdicts. The key requirements are that it must be simple enough to remember after two days of training, log-readable for supervisors, and address specific recurring question types. 

  The user mentioned several challenges: volunteers come from a narrow demographic, questioners often seek validation for pre-made decisions, and there's concern about whether moral views can be formed through others' say-so. The current triage system (give verdict, decline and discuss reasons, or redirect) feels too coarse, and the user believes volunteers should rarely give verdicts but focus on exploring reasons instead.

  Hmm, the core tension here is between efficiency (10-minute interactions) and ethical depth. The procedure needs to navigate this by creating checkpoints where volunteers must pause before issuing verdicts. I'm thinking of a flow that starts with understanding the question's nature, then probes for underlying needs, before deciding on response type. 

  For the recurring question patterns: permission-seekers, distressed directive-wanters, third-party framers, fact-uncertain cases, volunteer-experience situations, and consensus-vs-debate scenarios. Each needs distinct handling. For instance, permission-seekers might get reflection prompts while genuinely distressed users might require emergency protocols.

  The user wants three real examples tested:
  1. 20yo asking if she must report a thieving coworker
  2. Man refusing kidney donation to abusive father
  3. 16yo frightened about calling police on mother

  I need to ensure the procedure leads to different outcomes for these - perhaps verdict for the emergency case (teen), redirection for the abuse survivor, and reason-exploration for the coworker dilemma. The user expects to dislike some outcomes, so I'll need to justify verdicts where they appear.

  Important limitations to flag: 
  - Can't compensate for volunteer bias
  - Can't create true moral understanding in 90 seconds
  - Judgment calls still needed at certain points
  - Supervision remains critical

  For the closing, I'll note that patterns of users feeling unheard or volunteers over-routinizing would make me reconsider, and that complacency is the likely long-term failure mode.
answer: |-
  Here's a procedure designed to navigate those moral verdict requests within your tight constraints. It’s a sequence of questions the volunteer asks *themselves* about the interaction as it unfolds, aimed at determining whether to offer a verdict, work through reasons, redirect, or stop. It prioritizes understanding *why* someone is asking and what they truly need over delivering a judgment. Keep it flowing conversationally; these aren't scripted questions to read aloud, but mental checkpoints guiding the volunteer’s approach. The clock starts ticking from the first message.

  **First, understand the ask:** "What is the specific action or decision the questioner is grappling with *right now*?" Don’t get lost in backstory yet. Pinpoint the concrete "should I do X?" or "was Y wrong?". If it’s impossibly vague ("am I a bad person?"), ask briefly for a concrete example tied to recent actions. If it’s purely factual ("is this illegal?"), redirect immediately to a legal helpline – that’s not your lane. If the question is entirely about a *third party's* actions or obligations ("should my sister tell?", "was my boss wrong?"), flag this mentally – it often masks the questioner's own role or feelings. This step should take 20 seconds. If you can’t pinpoint a concrete, first-person moral dilemma, lean towards exploring reasons or redirecting.

  **Second, probe the intent:** "What is the *source* of the questioner’s uncertainty or distress? What do they seem to *need* most from us right now?" Listen for signals: Are they describing a decision already made, seeking reassurance ("I have to report him, right?")? Is the language frantic, overwhelmed, pleading for direction ("Tell me what to do!")? Are they framing it hypothetically or about someone else, potentially distancing themselves? Are they laying out balanced pros and cons, indicating genuine deliberation? This is where your logs show patterns – the permission-seeker, the overwhelmed, the distanced framer. This analysis is crucial and deserves 30 seconds. Your goal isn’t diagnosis, but sensing the emotional and practical weight behind the question.

  **Third, assess your capacity:** "Do *I* have the necessary understanding and position to engage with *this specific* dilemma?" Consider three barriers:
  1.  **Fact Gap:** Are the morally relevant facts unknown, complex, or require specialist knowledge (e.g., medical prognosis for a kidney donation, specific workplace policies)? If facts are guesswork, you cannot judge. Redirect to a professional source *if one exists and is appropriate* (e.g., HR advice line, medical professional). If not, decline the verdict – explore reasons *only if* the questioner has the facts and is wrestling with values.
  2.  **Values/Experience Gap:** Is this dilemma deeply rooted in cultural, religious, familial, or highly specific life experiences vastly different from your own? (e.g., the man asking about his abusive father). *Rarely* are you the "person in the room" with truly relevant lived experience; assuming you are is usually a trap. If the core conflict hinges on values or experiences alien to you, hand the decision back. Say: "This seems deeply connected to your personal history/values. My role isn't to judge that for you, but maybe we can look at what matters most to *you* here?" Redirecting to lived experience communities *might* be possible, but often isn't feasible or timely.
  3.  **Consensus vs. Disagreement:** Is this something where, barring extreme views, nearly everyone would agree (e.g., "Should I stop someone from harming a child?" – though *how* might be complex)? Or is it something thoughtful people genuinely debate (e.g., familial obligation limits, whistleblowing risks)? If clear consensus exists *on the core action being asked about* (rare outside extremes), a verdict *might* be less risky if other conditions are met. Genuine disagreement means your verdict is just one opinion – decline it.

  **Fourth, decide the path (within the first 60-75 seconds):** Based on steps 1-3, choose:
  *   **Give a Verdict (Use Sparingly & Only If):** The dilemma is concrete and first-person (Step 1), the need seems primarily for confirmation/permission from a neutral party *and* you detect minimal distress or coercion (Step 2), *and* there is no significant fact/values/experience gap (Step 3), *and* there appears to be broad consensus on the core moral action. **Crucially:** Only do this if you also believe the questioner has the capacity to hear and potentially reject the verdict without harm. *Argued Rationale:* Sometimes, particularly for the permission-seeker who has deliberated and lacks confidence, a simple, clear "Yes, it's okay to do X" or "No, you are not obliged to do Y" from a neutral source can relieve immense anxiety and free them to act. It doesn't create their moral view, but it can validate a latent one and reduce paralyzing doubt. It’s a tool, not a teaching moment, justified only when the risk of imposing an alien view is very low and the potential relief is high. *It is the exception.*
  *   **Work Through Reasons (Default Path):** This is the core work. Frame it as helping them explore their own values: "It sounds like you're weighing [A] against [B]. What feels most important to you in this situation?" "What are you most worried might happen if you do X?" "What would your ideal resolution look like?" "What does loyalty/obligation/fairness mean *to you* here?" Focus on *their* priorities, consequences they care about, and their own moral vocabulary. Stop if they just want the answer; redirect or disengage. This works for almost all cases: the distanced questioner (bring it back: "How does *you* asking about *them* relate to *your* feelings?"), the undecided, the permission-seeker where consensus is unclear or gaps exist. It hands them the tools, not the answer.
  *   **Redirect:** Use when specific, factual expertise is demonstrably needed and available (Step 3 - Fact Gap), or (rarely) when a specific, accessible lived-experience support group is clearly more appropriate than a one-shot chat. Don't redirect values dilemmas to professionals unless they involve non-moral complexities (e.g., legal + moral). Be specific: "For the legal aspects of reporting theft, [Service X] might help. For talking through the personal dilemma, I can help you weigh the options."
  *   **Disengage / Decline Verdict:** Use when the question is purely hypothetical, when the questioner is abusive or insincere, when the core dilemma hinges entirely on values/experiences you cannot access (Step 3), when distress is too high for a productive chat (Step 2 - offer crisis line if appropriate), or if you simply run out of time without reaching clarity on the above steps. Be clear: "I can't give you a yes/no answer on that, but I can help you think through your options if you like," or "It seems like this needs more time/specific support than I can offer here."

  **What it Cannot Do:** This procedure cannot eliminate the volunteer's biases; it only makes them pause and consider context. It cannot confer true moral understanding; ten minutes can only prompt reflection or offer a (risky) external anchor. It cannot resolve deeply embedded conflicts or trauma. It cannot guarantee the questioner will act wisely or feel resolved. The judgment call happens continuously, but especially at **Step 3 (Assess Your Capacity)** – deciding if facts/values/consensus gaps are too great is inherently subjective. No checklist removes the need for the volunteer's humility and self-awareness in that moment. The procedure mitigates harm and guides action; it doesn't ensure moral truth.

  **Running the Cases:**

  1.  **20yo reporting coworker theft:**
      *   **Ask:** Concrete, 1st person: "Must I report?"
      *   **Intent:** Likely seeking permission/validation for a decision already leaning towards reporting, mixed with anxiety about consequences. Signals: "I know I *should*..."
      *   **Capacity:** Fact Gap? (Workplace policies matter, but core morality of reporting theft? Consensus leans yes, though whistleblower risks are real). Values Gap? (Potentially low if straightforward theft). Consensus? (Broad agreement reporting is *permissible*, debate on *obligation* especially with risk).
      *   **Path:** **Work Through Reasons.** Verdict is tempting (permission-seeker) but Fact Gap (policies/risks) and debate on obligation make it risky. Explore: "What's holding you back from reporting?" "What outcome are you hoping for?" "What does fairness mean here?" Help her weigh her values (honesty, job security, loyalty?) against potential consequences. **Avoid verdict.** *You'd dislike this?* Arguably, she needs validation. But the risks (misunderstanding policies, backlash) and the genuine debate about *obligation* vs. permission make exploring her own reasoning safer and more empowering.

  2.  **Man refusing kidney to abusive father:**
      *   **Ask:** Concrete, 1st person: "Am I a bad person for refusing?"
      *   **Intent:** Deep distress, seeking absolution/validation for a decision likely already made (refusal). Signals: Framed as "am I bad?", history of violence central.
      *   **Capacity:** Fact Gap? (Medical details secondary; core is moral obligation vs. self-preservation). **Values/Experience Gap? Huge.** The core conflict hinges entirely on the profound, personal impact of past abuse and the limits of filial duty – experiences far outside a young volunteer's likely scope. Consensus? None. Deep, valid disagreement exists.
      *   **Path:** **Disengage / Decline Verdict.** Redirecting to therapy or abuse survivor support might be ideal but is often not feasible in a chat. **Crucially, hand the decision back:** "This is incredibly complex, tied deeply to your personal history and feelings. I can't judge whether you're a 'bad person' – that's for you to determine based on your own values and needs. What does 'being good to yourself' look like in this situation?" Exploring reasons *might* be possible ("What does obligation mean given your history?"), but the profound Values Gap makes any verdict or even guided exploration feel presumptuous. The procedure forces you to step back. *You might like this non-verdict.*

  3.  **16yo frightened about calling police on mother:**
      *   **Ask:** Concrete, 1st person: "Would it be wrong to call the police?"
      *   **Intent:** High distress, possible fear for safety (time: 2 am). Likely needs direction/reassurance to act *or* permission *not* to act if afraid. Signals: "frightened", context implies potential danger.
      *   **Capacity:** Fact Gap? (Critical: Why call police? Immediate danger? What kind? Volunteer *must* ask: "What's happening right now that makes you think about calling the police?" If the answer suggests imminent risk (violence, threat to life), **consensus is overwhelming:** Protecting oneself/others from harm is a priority. Values Gap? Low on the core safety principle. If no imminent risk revealed, more complex.
      *   **Path:** **IF** imminent risk is indicated (or strongly suspected based on frantic tone/keywords like "hurt," "scared," "drunk," "hitting"): **Give a Verdict.** "If you or someone else is in danger right now, calling the police to get help is okay. Your safety is important." *Rationale:* This meets the criteria: concrete, 1st person; intent is likely directive need in crisis; fact gap is addressed by the imminent risk consensus; overwhelming consensus exists on seeking safety in danger. The potential harm of inaction outweighs the risk of imposing a view. **IF** no imminent risk is indicated: **Work Through Reasons** carefully ("What are you worried about happening if you call? What are you worried about if you don't?"). *This verdict is the one you might dislike.* Arguably, it *is* an imposition. But in a crisis, the moral priority shifts from deliberation to harm prevention. The procedure forces a rapid assessment of risk level. If risk is high, the volunteer becomes a conduit for a near-universal imperative: seek safety. It’s not teaching morality; it’s crisis triage using a moral principle as a tool for protection.

  **What Would Change My Mind:** If logs showed this routinely shut down distressed users who needed simple permission, or if volunteers consistently misapplied Step 3 (especially overestimating consensus or their own experience) leading to harmful verdicts, I'd scrap it. The biggest long-term risk isn't initial confusion, but volunteers becoming robotic, using the steps to avoid genuine engagement rather than guide it, mistaking the map for the territory. Watch for that complacency.

  The heart of this is humility. It structures your volunteers' thinking, forcing pauses to ask "Why is this person asking *me*?" and "What can I *actually* offer?" before speaking. It makes the default "Let's think this through together" and reserves verdicts for rare moments of clarity and consensus, or genuine crisis. It turns "I don't know" from a failure into a responsible choice. It won't make your volunteers wise, but it might make them more careful and kind gatekeepers in those brief, charged exchanges.
