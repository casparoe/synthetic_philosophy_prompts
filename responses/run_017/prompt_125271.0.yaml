prompt: |-
  I sit on the internal review panel of a large hospital trust, and next month I have to spend forty minutes with the trust's clinical safety committee explaining why the readmission-risk score we are about to procure cannot simultaneously satisfy the three fairness properties the committee has written into its own procurement specification.

  The setting: discharged medical patients are ranked by a model that outputs a probability of unplanned readmission within thirty days. The two hundred highest-scoring patients per month get two home visits from a district nurse; everyone else gets usual care. The committee's specification demands that the score be (a) calibrated within each of the two patient groups the trust monitors under its equality duties — call them A and B, with observed readmission rates of roughly 22% and 11% respectively; (b) such that, among patients who would not have been readmitted, the false-positive rate is equal across A and B; and (c) such that, among patients who would have been readmitted, the false-negative rate is equal across A and B. The vendor has told them all three are achievable. They are not, except in edge cases.

  Plan how I teach this, rather than teaching it to me. Specifically:

  State the order in which the components have to arrive and what each depends on. I take it that the group-difference in base rates has to be on the table before the conflict can even be stated, and that calibration has to be cashed out as a statement about what a number means rather than about how accurate it is — but tell me the sequence you would actually use, and why the alternatives fail (e.g. why opening with the algebra, or with the definitions of the three criteria, or with an abstract example involving coins or urns, leaves the committee with the wrong picture).

  Give me the one worked example that carries the whole session, and say what it must contain and what it must not. My instinct is a small fictitious table of scores and outcomes for a dozen patients, built so that the three criteria visibly pull apart, but I want to know which features are load-bearing — differing base rates, a score that is genuinely informative but nowhere near perfect, a scarce and genuinely beneficial intervention — and which features would mislead by importing a separate moral problem (training-label bias, a proxy variable doing the work, an intervention that harms some patients).

  Map the misconceptions this audience will predictably bring or form, and say at which point in the sequence each should be defused. The ones I anticipate: that fairness just is not using group membership, so the fix is to delete it from the data; that an impossibility theorem means the score is biased and should therefore be rejected outright; that the conflict is a small technical wrinkle we can split the difference on by approximately satisfying all three; that equalising the share of visits going to A and to B is the same as any of (b) or (c); that calibration is a claim about individuals. Add the ones I have not thought of, including the ones specific to clinicians rather than to statisticians.

  Two complications I will have to handle, and I want them placed deliberately rather than bolted on. First, the committee will ask that the three criteria hold not only for A and B but for every subgroup anyone can name — each ward, each admitting diagnosis, each comorbidity. I want to know where in the sequence that demand belongs and what it does to the argument, including what a relaxation to "calibrated on average within every efficiently-identifiable subgroup" would buy us. Second, the two hundred slots are a hard capacity constraint, not a threshold; tell me where the fixed-budget framing should enter and what it does to the menu of criteria, since I suspect it makes some of the committee's phrasing incoherent.

  Tell me what I should openly decline to explain at this level and say so out loud — I assume causal or counterfactual notions of fairness, and the fact that patients who receive the visits have their readmission outcome partly determined by the visit itself, so that the very error rates in (b) and (c) are only partly observable.

  Finally, give me one question to close on that would show me the idea had landed rather than that the committee had merely been impressed: my candidate is to double the nurse capacity and ask whether the conflict persists, but I suspect a better version changes something about the base rates or the score's accuracy instead, so propose the version that actually discriminates between understanding and deference.

  Write the plan in British English, and do not point me to papers, vendors, or reading.
reasoning: |-
  Hmm, the user is on an internal review panel for a hospital trust and needs to explain to the clinical safety committee why their readmission-risk score can't satisfy three fairness properties simultaneously. They've provided a detailed scenario: patients are scored for readmission risk, the top 200 get extra nurse visits, and the committee wants calibration within groups A and B (with different base rates), equal false-positive rates, and equal false-negative rates. The vendor claims this is possible, but mathematically it's not except in edge cases.

  The user wants a teaching plan. They've outlined specific requests: the sequence of components, a key worked example, handling misconceptions, addressing complications like multiple subgroups and budget constraints, what to avoid explaining, and a closing question to test understanding. They're anticipating clinician-specific misunderstandings, like thinking fairness means removing group data or that the conflict can be resolved by compromise.

  First, I need to structure the sequence logically. Starting with base rate differences is crucial because that's the root of the conflict. If I jump into algebra or definitions first, the committee might not grasp why it's impossible. Then, calibration needs to be explained clearly—it's about probability meaning the same thing across groups, not accuracy. After that, introduce the fairness criteria, show the conflict with an example, and only then bring in budget constraints. End by acknowledging other complexities but setting them aside.

  For the worked example, I'll create a small table with 20 patients—10 from group A (22% base rate) and 10 from group B (11% base rate). The scores should be informative but imperfect; say, 2 readmissions in A and 1 in B actually happen. I need to show how calibration forces scores to match base rates, but equal FPR and FNR pull in opposite directions. Avoid red herrings like biased labels or harmful interventions—focus purely on the mathematical tension.

  Common misconceptions: Clinicians might think deleting group membership fixes everything, but that ignores inherent differences. Or they might see the impossibility as a bias issue rather than a fundamental constraint. I'll defuse these by asking questions early, like "What if we hide group data?" and showing it doesn't help. Also, emphasize that fairness has multiple definitions, and their criteria conflict by design.

  Complications: When they demand fairness for all subgroups, I'll note that it makes the problem worse—requiring calibration everywhere exacerbates the conflict. Relaxing to "efficiently identifiable" subgroups helps a bit, but the core issue remains. The budget constraint is key too; with fixed slots, prioritizing based on risk means trade-offs in false positives/negatives can't be avoided without compromising calibration.

  I'll openly skip causal fairness and outcome modification from visits—those are too advanced for this session. The closing question should test understanding: double the base rate difference or the intervention's effectiveness and ask if the conflict changes. If they grasp it, they'll say the conflict persists based on base rates, not capacity.

  Overall, the plan must be practical, use simple language, and stay focused. The goal is to show that this isn't a vendor flaw but a mathematical reality, so they can adjust their spec realistically.
answer: |-
  Here’s a structured 40-minute teaching plan for the clinical safety committee, sequenced to build understanding incrementally while pre-empting misconceptions. Use a flip chart or slides to scaffold the logic visibly.

  ---

  ### **Sequence of Components (25 mins)**
  **1. Base Rates Anchor the Problem (5 mins)**  
     - *Start with:* "Group A’s readmission rate is 22%, Group B’s is 11%. This difference isn’t bias—it’s observed reality. If our score ignores this, it’s broken."  
     - *Why this first?* Clinicians intuitively grasp epidemiological differences. If you open with algebra/definitions, they’ll assume the conflict is "technical noise." Base rates make the dilemma visceral.  
     - *Defuse early:* "This isn’t about bias in the score. Even a perfect score would reflect this difference."

  **2. Calibration Demystified (5 mins)**  
     - *Define practically:* "Calibration means: if the score says ‘10% risk’ for 100 A-patients, ~10 should be readmitted. Same for B. It’s about the score meaning what it says."  
     - *Contrast with accuracy:* "A score could be perfectly calibrated but useless—e.g., always predicting 22% for A, 11% for B. Calibration ≠ usefulness."  
     - *Why now?* Clinicians often conflate "calibrated" with "correct." Isolating this preps them to see it as incompatible with other goals.

  **3. False Positives/Negatives as Fairness (5 mins)**  
     - *Simple definitions:*  
       - **False Positive (FP):** "Patient scored ‘high risk’ but wouldn’t have been readmitted even without the nurse visit."  
       - **False Negative (FN):** "Patient scored ‘low risk’ but would have been readmitted."  
     - *Fairness goals:*  
       - **(b)** Equal FP rates: "Same proportion of non-readmitted patients wrongly offered visits in A and B."  
       - **(c)** Equal FN rates: "Same proportion of readmitted patients wrongly denied visits in A and B."  
     - *Emphasise:* "These are about errors in identifying who needs help—not who gets visits."

  **4. The Conflict Revealed via Worked Example (10 mins)**  
     - *Use this table (simplified; 20 patients total):*  

  | Group | Patient | Score | *Actual Outcome* | Intervention? |
  |-------|---------|-------|-------------------|--------------|
  | **A** (Base rate 22%) | A1 | 0.85 | Readmitted | Yes |
  | **A** | A2 | 0.80 | Readmitted | Yes |
  | **A** | A3 | 0.75 | Not readmitted | Yes |
  | **A** | A4 | 0.70 | Not readmitted | Yes |
  | **A** | A5–A10 | <0.60 | Not readmitted | No |
  | **B** (Base rate 11%) | B1 | 0.85 | Readmitted | Yes |
  | **B** | B2 | 0.75 | Not readmitted | Yes |
  | **B** | B3 | 0.70 | Not readmitted | Yes |
  | **B** | B4 | 0.65 | Not readmitted | Yes |
  | **B** | B5–B10 | <0.60 | Not readmitted | No |

     - *Load-bearing features:*  
       - **Differing base rates:** A has 2 readmissions/10 patients (20% ≈ 22%), B has 1/10 (10% ≈ 11%).  
       - **Scarce intervention:** Only 200 slots/month. Here, top 4 scores get visits (A1–A4, B1–B4).  
       - **Informative but imperfect score:** Correctly ranks most readmitted patients highest but has FPs (A3,A4,B2,B3,B4).  
     - *Analysis:*  
       - **Calibration:** Scores ~match outcomes (e.g., A’s avg score for readmitted: 0.825; non-readmitted: lower).  
       - **FP rate:** Non-readmitted patients wrongly offered visits: A: 2/8 = 25%, B: 4/9 ≈ 44% → **Not equal**.  
       - **FN rate:** Readmitted patients wrongly denied visits: A: 0/2 = 0%, B: 0/1 = 0% → **Equal here, but only because all readmitted got visits.**  
     - *The tension:* "If we force equal FP rates, we must reduce interventions for non-readmitted B-patients. But that means lowering B’s scores, breaking calibration. Equal FN rates require prioritising readmitted patients equally—but A has more, so scores can’t align with B’s base rate."

  **5. Enter the Budget Constraint (5 mins)**  
     - *Frame:* "The 200 slots are fixed. We’re forced to prioritise—this turns fairness into a zero-sum game."  
     - *Impact:*  
       - "Equalising who *gets visits* (e.g., 100 A, 100 B) ignores need. It satisfies neither (b), (c), nor calibration."  
       - "Prioritising by risk means groups with higher need (A) get more visits. This inherently creates unequal FP rates (as above)."  
     - *Key point:* "The vendor’s ‘edge cases’? Either no base-rate difference (untrue) or a score so bad it’s random (useless)."

  ---

  ### **Handling Complications (5 mins)**
  - **"All subgroups" demand:**  
    - *Place here:* After the example, before misconceptions.  
    - *Response:* "Requiring calibration in every subgroup (e.g., diabetics over 70) amplifies the conflict. If a subgroup of A has a 25% rate and a subgroup of B has 5%, forcing equal FP/FN rates becomes mathematically chaotic. Relaxing to ‘efficiently identifiable subgroups’ helps only if we accept *average* calibration—but the core conflict remains."  
  - **Fixed budget’s role:**  
    - *Already integrated in Step 5.* Stress: "Soft thresholds (e.g., ‘top 10%’) might allow satisfying one more criterion, but with fixed slots, all three remain incompatible."

  ---

  ### **Defusing Misconceptions (Pre-emptively)**
  - **"Fairness = ignoring group membership"**  
    - *Defuse during Step 1:* "Deleting group data doesn’t erase base rates. The score still ‘sees’ correlates (e.g., postcodes, diagnoses), and FPs/FNs diverge *more* wildly."  
  - **"Impossibility = biased score"**  
    - *Defuse during Step 2:* "This isn’t about bias—it’s about conflicting definitions of fairness. Even an ideal score faces this."  
  - **"We can split the difference"**  
    - *Defuse during example:* Show that compromising (e.g., partial calibration) violates all three criteria. "Splitting the difference gives a score that’s fair in no sense."  
  - **"Equal visits = fairness"**  
    - *Defuse during Step 5:* "Equal visits might seem fair but wastes resources on low-risk B-patients while high-risk A-patients are denied care. Outcome fairness ≠ allocation fairness."  
  - **"Calibration applies to individuals"**  
    - *Defuse during Step 2:* "Calibration is a group property. Saying ‘10% risk’ to one patient doesn’t mean they have a 10% ‘chance’—it means in 100 similar patients, ~10 would be readmitted."  
  - **Clinician-specific:**  
    - **"But we *need* to help the sickest!"** → Agree, then: "That’s why we prioritise by risk—but it means trading off calibration and equal FPs."  
    - **"Can’t we collect better data?"** → "Better data improves accuracy but doesn’t resolve base-rate differences or the mathematical conflict."

  ---

  ### **What to Openly Decline (2 mins)**
  - State clearly:  
    > "We won’t address:  
    > 1. **Causal fairness** (e.g., ‘Would this patient have been readmitted *if* assigned to Group B?’)—that’s unobservable and not in your spec.  
    > 2. **How nurse visits change outcomes**—yes, visits likely reduce readmissions, meaning we can’t observe ‘true’ FNs/FPs. But your spec assumes we can measure them, so we’ll work within that."  

  ---

  ### **Closing Question to Test Understanding (3 mins)**
  - **Your candidate (double capacity):** "If we doubled nurse visits, does the conflict disappear?"  
    - *Weakness:* They might correctly say "no" (due to base rates) but for the wrong reason (e.g., thinking it’s "still unfair").  
  - **Better version:**  
    > **"Suppose Group B’s base rate rises to match Group A’s 22%. Could we now satisfy all three criteria? Why?"**  
    - *Why it works:*  
      - **Correct answer (understanding):** "Yes, because equal base rates remove the conflict. Calibration would require similar score distributions, making equal FP/FN rates achievable."  
      - **Incorrect answer (deference):** "No, the score is still biased" or "It depends on accuracy."  
    - *Discriminates:* Forces them to internalise that base-rate differences—not capacity, bias, or model quality—are the root cause.

  ---

  ### **Why This Sequence Works**
  - **Starts with clinical reality** (base rates), not abstraction. Clinicians anchor on what they know.  
  - **Example is concrete and minimal:** 20 patients, clear groups, outcomes binary. No proxies or iatrogenic harm to distract.  
  - **Misconceptions pre-empted contextually:** Each is countered when it naturally arises (e.g., "delete group data" when discussing base rates).  
  - **Budget constraint delayed:** Introducing it too early invites allocation-fairness tangents. Here, it enters as the catalyst for trade-offs.  
  - **Close tests conceptual transfer:** Changing base rates (not capacity) probes if they grasp the theorem’s core.  

  **Final note:** End by affirming, "This isn’t failure—it’s clarity. We can now choose which fairness criterion to prioritise in procurement." This pivots positively to action.
