prompt: |-
  I'm a journalist finishing a feature on hinge epistemology, the Wittgensteinian development of the idea in *On Certainty* that some propositions are not known but held fast, and that doubting them is a breakdown rather than a mistake. Across three interviews, one philosopher who works on this has given me a stable track record. Hinges: that she has two hands; that the Earth existed long before she was born, notwithstanding that geology can produce evidence for it; that physical objects persist when unperceived; that other people have inner lives. Not hinges: that water boils at 100 degrees Celsius at sea level; that Napoleon existed; that she was born in Cleveland; that the bird at her feeder is a goldfinch. She also allows that what stands fast can shift across generations and across forms of life. When I raised the Holocaust informally last month, she said only that the question is political and declined to rule.

  I have one interview left, and I want to put this case to her: that the Holocaust happened. It is learned from testimony, documented and in principle checkable, denied by an organized minority, and its denial in many countries is treated not merely as an error but as something legally prohibited and morally corrupt.

  Predict her verdict, and more usefully, reconstruct the rule she is running. Several fit her precedents equally well and come apart here: an evidence-practice rule, a never-learned rule, a presupposition rule, and a doubt-as-breakdown rule. Say what each predicts about this case, which one you think she is actually on and why, and which of her earlier verdicts you have to explain away. Then name the further case I should put to her that would most cleanly separate the surviving rules, and tell me what would change your own prediction: which consideration, if she offered it, would force you to say hinge after all, and where the rule you have reconstructed is most likely to fail.
reasoning: |-
  Okay, so I'm trying to help this journalist with their feature on hinge epistemology, specifically applying it to whether the Holocaust is a hinge proposition. The philosopher they've interviewed has clear examples: things like "I have two hands" are hinges, while "water boils at 100°C" isn't. The key is that hinges are foundational—doubting them causes a breakdown in our system of beliefs, not just an error.

  Now, the journalist wants to predict how the philosopher will rule on "the Holocaust happened." They mentioned several possible rules the philosopher might be using: evidence-practice (hinges aren't supported by evidence), never-learned (hinges aren't learned through testimony), presupposition (hinges are necessary for inquiry), and doubt-as-breakdown (doubting them paralyzes action). Each rule could lead to different conclusions here.

  First, I need to see how each rule applies to the Holocaust case. The Holocaust is learned from testimony and evidence, which under the evidence-practice or never-learned rules might disqualify it as a hinge. But if it's treated as a presupposition for historical inquiry or if denying it causes a moral and epistemic breakdown, it could still be a hinge. The philosopher declined to rule earlier, calling it "political," which adds complexity.

  Looking at her past verdicts, hinges like "the Earth is old" or "objects persist unperceived" aren't learned through testimony—they're background certainties. Non-hinges like "Napoleon existed" are checkable facts. The Holocaust seems similar to Napoleon in being historical and evidence-based, but its denial is treated as beyond error—morally corrupt and illegal. That might push it toward hinge status under the doubt-as-breakdown rule.

  I think the philosopher is primarily using a doubt-as-breakdown rule. Denying the Holocaust isn't just wrong; it undermines trust in testimony and historical inquiry, leading to a breakdown in moral and rational discourse. Her hesitation might be because hinges are typically non-empirical, but the breakdown aspect could override that.

  To confirm, the journalist should ask about a case like "parents are biological progenitors." If she says it's a hinge despite being learned, that supports the breakdown rule over the never-learned rule. If she rejects it, she might lean toward presupposition or evidence-practice.

  If the philosopher argues that Holocaust denial paralyzes historical understanding or moral deliberation, that would force me to accept it as a hinge. But her rule might fail with "vaccines work"—denial causes harm, yet it's evidence-based and often treated as debatable, not a hinge.
answer: |-
  Based on the philosopher's established pattern and Wittgensteinian framework, here's a precise reconstruction of her rule, predictions for the Holocaust case, and strategic next steps for your interview.

  ### Prediction for the Holocaust Case
  **Verdict:** She will **decline to classify the Holocaust as a hinge proposition**, likely reiterating that it is "political" or "historical," not a framework certainty. However, she may express extreme discomfort, emphasizing that denial is morally abhorrent and epistemically reckless—*without* granting it hinge status.  

  ### The Rule She Is Running: "Doubt-as-Systemic-Breakdown"  
  **Core Principle:** A proposition is a hinge only if **doubting it paralyzes the entire language-game or form of life** (e.g., inquiry, perception, communication), rendering coherent thought/action impossible. Hinges are *enabling conditions* for rational doubt itself.  
  - **Why this fits best:**  
    - Her hinges ("I have two hands," "Earth existed before me," "objects persist unperceived," "other minds exist") are all *preconditions* for empirical investigation. Doubting them collapses the scaffold of evidence, perception, or intersubjectivity.  
    - Her non-hinges (Napoleon, water boiling, Cleveland birth, goldfinch ID) are *within* the scaffold: falsifiable, evidence-dependent, and doubt doesn't cripple rationality.  
    - Her allowance for cultural/historical variation aligns with Wittgenstein's view of hinges as tied to "forms of life."  

  ### How Competing Rules Fare & Why They're Rejected  
  1. **Evidence-Practice Rule** ("Hinges aren't supported by evidence"):  
     - **Holocaust Prediction:** *Not a hinge* (it's evidence-checkable).  
     - **Problem:** Contradicts her hinge "Earth existed long before me" (geology provides evidence). She explicitly notes geology can support it, yet it remains a hinge. **Must explain away:** This hinge *admits* evidence but doesn't *depend* on it.  

  2. **Never-Learned Rule** ("Hinges aren't learned via testimony"):  
     - **Holocaust Prediction:** *Not a hinge* (learned from testimony/documents).  
     - **Problem:** Ignores her hinge "other people have inner lives." We *infer* this from testimony (e.g., pain reports). **Must explain away:** This hinge is acquired through socialization, not "learning" in the empirical sense.  

  3. **Presupposition Rule** ("Hinges are assumed for inquiry"):  
     - **Holocaust Prediction:** *Hinge* (historical inquiry presupposes it).  
     - **Problem:** Overextends. Napoleon is also presupposed in modern history, yet she excluded it. **Must explain away:** Napoleon isn't a *universal* presupposition; denial doesn't collapse history as a practice.  

  **Key Takeaway:** The doubt-as-breakdown rule subsumes these aspects but is stricter. Hinges aren't just *pragmatic* or *presupposed*—they're *constitutive*. The Holocaust, while foundational to modern historiography and morality, doesn't meet this threshold: one *can* coherently investigate history while doubting it (though it may be irrational or evil). Her "political" comment suggests she sees denial as ideological, not epistemic paralysis.  

  ---

  ### Critical Test Case to Separate Surviving Rules  
  **Propose:** **"Parents are one's biological progenitors."**  
  - **Why this cleaves the rules:**  
    - **Evidence-Practice Rule:** *Not a hinge* (verifiable via DNA tests).  
    - **Never-Learned Rule:** *Not a hinge* (learned via testimony).  
    - **Doubt-as-Breakdown Rule:** *Likely a hinge* (doubting it destabilizes kinship, identity, and legal systems—e.g., paternity disputes cause systemic crises).  
    - **Presupposition Rule:** *Hinge* (family structures presuppose it).  
  - **Her Probable Verdict:** **Hinge** (aligning with breakdown rule). Doubting biological parentage isn't just false; it unravels social practices (inheritance, medicine, genealogy). This mirrors "other minds" in destabilizing intersubjectivity.  

  ---

  ### What Would Change Your Prediction  
  If she argues **Holocaust denial dissolves the possibility of historical testimony itself**, treating it as a *condition* for trusting documents/witnesses (e.g., "If we doubt this, we doubt all historical evidence"), **then it becomes a hinge**. This would extend her "other minds" logic to collective memory.  
  - **Trigger Phrase:** If she says, "Holocaust denial isn't just false—it makes *any* historical inquiry incoherent."  

  ### Where Her Rule Is Most Vulnerable  
  **Failure Case:** **"Vaccines work."**  
  - **Why:**  
    - Meets *doubt-as-breakdown* (anti-vaxxer doubts cripple public health).  
    - Meets *never-learned* (many accept it via authority).  
    - But she would likely call it *non-hinge* (evidence-checkable, doubt is misguided but not system-collapsing).  
  - **Tension:** Modern societies *treat* vaccine efficacy as hinge-like (censoring denial, moral outrage), yet epistemically it resembles "water boils at 100°C." Her rule struggles with propositions that gain hinge-*like* social status without being universal certainties.  

  ### Strategic Recommendation  
  In your final interview:  
  1. **Present the Holocaust case.** Note its moral/legal weight but stress the epistemic structure (testimony-based, deniers engage in evidence-disputes).  
  2. **Follow with the "biological parents" case** to probe the breakdown criterion.  
  3. **Press gently:** "If denying parents' biological role collapses kinship systems, doesn't denying the Holocaust collapse historical truth? Or is the difference that history can *rebuild* without it?"  
  Her answer will reveal whether she prioritizes *epistemic function* over *social consequence*—a key tension in hinge epistemology.  

  **Final Note:** Her refusal to rule earlier suggests political hesitance, not epistemic ambiguity. If she *does* call the Holocaust a hinge, it likely reflects moral conviction overriding her framework—exposing the theory's limits when certainty meets trauma.
