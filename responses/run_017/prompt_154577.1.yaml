answer: |-
  **Bottom line:** Translation transfers poetic effects, not just words or forms, and both camps agree effects are paramount but disagree violently on what constitutes them.

  **1. Agreed Claims**  
  1. A translation must produce a *poem* in the target language, not a crib.  
  2. Meaning includes tone, register, allusion, and emotional impact—not just denotation.  
  3. Perfect 1:1 correspondence of form and content is impossible; trade-offs are inevitable.  
  4. Constraints (rhyme, meter, etc.) *can* carry meaning (e.g., tension, irony, emphasis).  
  5. A translation should feel as intentional and crafted as the original.  
  6. Distortion occurs when the translation asserts/implicates something the original does not.  
  7. Both camps ultimately seek equivalent *poetic effect*—the disagreement is about *how* to achieve it.  
  8. Historical/cultural context must be respected (e.g., an acrostic isn’t arbitrary decoration).  

  **2. Table of Disagreements**  

  | Form-First Claim (as signed)                                                                 | Content-First Claim (as signed)                                                                 | Real Disagreement?                                                                 |  
  |:---------------------------------------------------------------------------------------------|:------------------------------------------------------------------------------------------------|:-----------------------------------------------------------------------------------|  
  | The formal structure (rhyme, meter, acrostic) is *inherent meaning*; altering it distorts the poem’s essence. | The formal structure is a *vessel* for meaning; replacing it preserves the poem’s core if effects are matched. | **Yes**: Dispute over whether form is meaning itself or a delivery mechanism. |  
  | Sacrificing form *always* loses meaning, even if subtle (e.g., cohesion, surprise, aesthetic tension). | Sacrificing form *only* loses meaning if it alters tone, emphasis, or allusion—otherwise, it’s neutral. | **Yes**: Conflict over the *necessity* of form for meaning-transfer. |  
  | "Functional inheritance" (keeping a constraint’s *effect* but not its surface) is true translation. | "Functional inheritance" is adaptation, not translation—it creates a new artifact. | **Verbal** (largely): Disagreement hinges on the definition of "translation." |  
  | Readers perceive the *result* of formal choices (e.g., abruptness, harmony) even if unaware of the source constraint. | Unnoticed formal features are irrelevant; only *perceived* effects matter for equivalence. | **Yes**: Clash over whether imperceptible fidelity has value. |  
  | Formal slack exists: translators often abandon form *preemptively* when solutions are possible. | Form is inherently costly; apparent "slack" is usually unavoidable trade-off. | **Yes**: Dispute over translator competence vs. inherent difficulty. |  

  **3. Cruxes: Tests and Predictions**  
  *(a) Acrostic vs. Name/Rhyme Trade-off**  
  - **Form-First**: Gives up the *exact name spelling* (keeps acrostic pattern with adjusted name/rhyme).  
    *Cost*: Loses direct address intimacy; may imply a different recipient.  
  - **Content-First**: Gives up the *acrostic* (keeps name/rhyme via paraphrase or slant rhyme).  
    *Cost*: Loses structural wit and the "reveal" of the name through form.  
  - **Test**: Survey target-language readers: Does the translated poem feel personally addressed? Does the structural "puzzle" (if kept) enhance emotional impact?  
    *FF Prediction*: Kept acrostic preserves intentionality better.  
    *CF Prediction*: Kept name/rhyme preserves intimacy better.  

  *(b) Functional Inheritance: Translation or Cheating?*  
  - **Test**: Translate a couplet where rhyme clashes opposites (e.g., "love"/"shove"). Version A keeps the semantic clash with assonance ("hate"/"fate"); Version B keeps exact rhyme but softens clash ("love"/"dove"). Ask bilingual readers: Which better conveys the original’s tension?  
    *FF Prediction*: A succeeds; clash effect matters, not rhyme token.  
    *CF Prediction*: B succeeds; rhyme is inseparable from the effect.  

  *(c) Measuring Slack (S vs. C)*  
  - **Test**: Use back-translation + human scoring. Define:  
    C = % formal features retained (syllables, rhyme scheme, acrostic).  
    S = Accuracy score (0-10) from bilinguals answering content questions *after reading translation only*.  
  - **FF Prediction**: Flat regions in S/C plot → slack (e.g., S stable while C rises).  
    *CF Prediction*: Steep negative slope → no slack (rising C lowers S).  
  - **Verbal Trap**: Both reject the metrics as reductive. *Compromise*: Use only to compare *relative* fidelity among existing translations, not absolutes.  

  *(d) Process: Skeleton-First vs. Content-First Drafts*  
  - **Test**: Each camp produces both versions of the same stanza. Bilinguals rank all 4 outputs by formal coherence (C) and semantic accuracy (S).  
    *FF Prediction*: Skeleton-first → higher *combined* scores (form scaffolds meaning).  
    *CF Prediction*: Content-first → higher S with minor C loss (form distorts meaning if prioritized early).  

  *(e) Reader Perception of Form*  
  - **Test**: Monolingual readers read formal vs. free translations. Interview: What felt intentional? Did they notice argument shifts? Track if structural pivots align with content shifts.  
    *FF Prediction*: Readers sense tonal/argument shifts *because* of form, even if unaware of scheme.  
    *CF Prediction*: Shifts are sensed via content/logic; undetected form is irrelevant.  

  ---  
  **Final Note**: The acrostic (Crux a) is your immediate battleground. Force explicit concessions: Form-First *must* admit changing the name’s letters alters the relationship; Content-First *must* admit dropping the acrostic loses a layer of craftsmanship. Only then does functional inheritance (Crux b) become negotiable.
