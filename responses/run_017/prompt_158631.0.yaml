prompt: |-
  You are a professional philosopher specializing in metaphysics — someone who has genuinely worked on dispositions, counterfactuals, and the causal bases of dispositional properties — and I want you to think carefully and slowly rather than quickly. Before you commit to any number, do a real brainstorming pass: enumerate the live analyses of a disposition ascription (the simple conditional analysis, the ideal- or normal-conditions variant, the categorical-basis or dispositional-essentialist view, propensity and other probabilistic analyses, interventionist and causal-model treatments), and for each say how it classifies the cases below and where exactly it strains. Only after that should you assign probabilities, and your probabilities should combine into your headline number by arithmetic you actually show me, not by feel. Please don't cite or reference anything: I can't check sources and I don't care who said what first. I care about the structure of the reasoning.

  The context is that this has recently stopped being academic for me. I'm a reliability engineer, and my group has qualified a ceramic turbine blade with a self-healing surface layer. We're now writing a specification and arguing with an insurer about a clause that turns on whether the coated blade is fragile, and I have discovered that my team uses the word in three incompatible ways. So I need the conceptual question settled well enough to write a sentence into a contract.

  Fix the stimulus as a standardized impact of a given energy, and read fragile as disposed to shatter under an impact of that kind. Let P be the chance of shattering given such an impact.

  Case 0, calibration: a bare brittle blade. It shatters every time. P = 1. No dispute.

  Case 1, the classic fink: the blade is intrinsically brittle, but the impact itself triggers a phase change in the material that renders it ductile within microseconds. P = 0.

  Case 2, the classic mask: the same brittle blade, sheathed in a layer that stiffens on impact and absorbs the energy. P = 0.

  Case 3, the classic mimic: a toughened blade that is not brittle and would not shatter, but which carries a microscopic embedded charge that detonates on impact and destroys it. P = 1.

  Case 4, the case actually on my desk, a probabilistic fink: the brittle blade's self-healing mechanism fires on impact and successfully closes the incipient crack nine times in ten. P = 0.1.

  Case 5, a probabilistic mimic: the toughened blade carries a charge that detonates with probability 0.9. P = 0.9.

  The point of the construction is this: by combining mechanisms with probabilities I can produce, for any p between 0 and 1, one case where P = p and the disposition verdict looks like yes, and another where P = p and it looks like no. Frequency and verdict come fully apart.

  Here is the claim I want your credence in:

  C: Whether x is disposed to shatter when struck is settled by the causal basis or mechanism present in x, not by the probability, chance, or propensity of manifestation given the stimulus. Consequently, in cases 4 and 5 the probability of shattering is simply the wrong quantity to consult, and a probabilistic analysis of dispositions fails even once the stimulus conditions have been idealized.

  Give me one headline number for C, then the decomposition: the sub-questions C depends on, a rough probability for each with a single line of justification, and the combination. I expect your tree to contain at least the following, or an argument for why some of them don't belong: whether the simple conditional and ideal-conditions analyses survive finks and masks at all; whether the categorical-basis view is quietly doing all the real work; whether dispositions admit of degrees, so that a 0.1 chance of shattering is low-grade fragility rather than a masked disposition; whether cases 4 and 5 are gerrymandered, underdescribed, or physically incoherent in a way that makes them evidentially irrelevant to the general claim; whether fragility in engineering usage is interest-relative with a conventionally set threshold, so that my contract problem and the metaphysical problem come apart; and whether the entire dispute is verbal, a disagreement about how to describe one and the same mechanism.

  Next, give me your separate credence on each individual verdict — is the blade in case 4 fragile, is the blade in case 5 — because I suspect your headline number and your case-by-case verdicts will not line up as tidily as you expect, and I want to see the seam.

  Then tell me which single term in your tree you are least confident in and what would move it most: an experiment, a further case, an argument I haven't mentioned.

  For calibration, my credence in C is about 0.4 and my colleague's is about 0.75. She holds that fragility just is a reliability number, so the blade in case 4 simply isn't fragile — surviving nine impacts in ten is what not being fragile looks like, and calling it fragile is ancestor-worship directed at a property we can no longer observe. I sit lower partly because I think she is confusing the property with our evidence for it, and partly because I suspect the whole thing is verbal. Give me your number, but more importantly tell me where the disagreement between us most likely lives: how much of it is metaphysics, how much is pragmatics of the word, and which of those the fink-and-mask machinery was ever built to settle.

  One constraint: no it depends. Give numbers, or state explicitly that some term has no determinate probability for you and say why.
