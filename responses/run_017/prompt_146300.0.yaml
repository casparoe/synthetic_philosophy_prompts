  The core challenge here is bridging two very different domains: the precise, engineered world of software systems versus the messy, value-laden realm of human biology and ethics. I need to be careful not to oversimplify while maintaining strict adherence to their requested terminology. 

  Key points to preserve:
  - Therapy as "bug fix" restoring intended behavior
  - Enhancement as "feature request" adding new capabilities
  - The three baseline definitions (statistical, historical, evaluative)
  - The fourth environmental factor
  - All seven test cases

  Major red flags in the translation:
  1) The "no designer" problem - biology lacks an intentional spec-writer
  2) Ambiguity in defining "reference platform" for humans
  3) Trade-offs that aren't clean improvements (case 7)
  4) Community dependencies (case 6) mapping poorly to Hyrum's Law

  For the test cases, dental decay (case 1) will stress the statistical baseline - if cavities are statistically normal, are they still "bugs"? Cochlear implants (case 2) challenge the repair/bypass distinction. Aging (case 3) questions whether "intended behavior" includes degradation. 

  The residue analysis will likely show:
  - Evaluative baselines require smuggled values
  - Historical baselines assume knowable "original requirements"
  - Environmental factors reveal architecture flaws rather than individual defects

  Biggest unsaid assumption: All their vocabulary presupposes design intent. I'll need to explicitly mark every spot where that creeps in. The confidence check at the end should highlight this as the shakiest part.

  For case collapse: Cases 5 (moving thresholds) and 7 (trade-offs) might merge as "non-monotonic improvements" in engineering terms. Cases 4 (new immunity) and 6 (community) both involve "breaking changes" but with different stakeholders.

  Final output needs strict structure: 
  1) Precise term mapping
  2) Case-by-case translation success/failure
  3) Residue report
  4) Confidence declaration
answer: |-
  Here is the strict translation of your bioethics distinction into infrastructure/reliability engineering vocabulary, followed by case analysis, residue report, and confidence assessment.

  ### Core Translation
  - **Therapy vs. Enhancement**:  
    - **Therapy**: Fixing a **bug** (deviation from **intended behavior** per the **spec**) to restore **observed behavior** to match the **reference platform**'s **SLOs**. Treated as a **severity-one incident** requiring a **root-cause fix**.  
    - **Enhancement**: Implementing a **new feature** (adding **observed behavior** beyond the **spec**). Treated as a **feature request**, prioritized against **error budgets** and **maintenance work**.  

  - **Moral Asymmetry**:  
    - **Therapy** is owed: **Bugs** violate **SLOs**, exhausting **error budgets**, and require immediate remediation to avoid **breaking changes** for users.  
    - **Enhancement** is optional: **Feature work** lacks urgency unless it prevents future **incidents** or aligns with **acceptance tests**.  

  ### Accounts of the Baseline ("Reference Platform")  
  1. **Statistical Baseline**:  
     - **Reference platform** = most common **configuration** in the current deployment.  
     - **Defect** = **observed behavior** falling outside **alert thresholds** set on population metrics (e.g., p95 latency).  
     - *Analogy*: A **bug** is declared when metrics exceed **SLO**-based thresholds.  

  2. **Historical Baseline**:  
     - **Reference platform** = **intended behavior** inferred from **commit history** (original design goals).  
     - **Defect** = **regression** from the **golden file** of evolutionarily selected traits.  
     - *Analogy*: A **bug** violates the "original PR description" recovered from version control.  

  3. **Evaluative Baseline**:  
     - **Reference platform** = **acceptance tests** defined by user needs ("a life they have reason to want").  
     - **Defect** = failure to pass user-specific **acceptance tests**, regardless of stats/history.  
     - *Analogy*: A **bug** is any behavior failing a user’s custom **SLO**, even if statistically/historically "normal".  

  4. **Environmental Deficit**:  
     - **Defect** = mismatch between user and environment, fixable by either:  
       - **Root-cause fix**: Adjust environment (**refactor architecture**).  
       - **Workaround**: Modify user (**shim** at the human "layer").  

  ---

  ### Case Analysis Using Translation  
  **Case 1: Dental Decay (Statistically Typical)**  
  - **Translation**: Decay is within **alert thresholds** (statistically normal) → not a **bug** per statistical baseline.  
  - **Clean Carry**: Challenges statistical baseline’s moral weight (common ≠ healthy).  
  - **Distortion**: Statistical **SLOs** assume typical = acceptable; here, typical is harmful.  
  - **Cannot Say**: Why statistically normal conditions *should* be treated if harmful (smuggles "health" as implicit **SLO**).  

  **Case 2: Cochlear Implant (Bypasses Broken Part)**  
  - **Translation**: **Workaround** (**shim**) that restores **user-visible function** without fixing the root cause.  
  - **Clean Carry**: Restores **intended behavior** (hearing) but violates **historical baseline** (non-original **implementation**).  
  - **Distortion**: Engineering sees **workarounds** as technical debt; medicine may see it as valid therapy.  
  - **Cannot Say**: Whether bypassing biology’s "original implementation" is ethically different from repairing it.  

  **Case 3: Restoring Youthful Capacity (Aging)**  
  - **Translation**: Fixing a **regression** (loss of capacity since v20.0) to match **historical baseline** (younger "release").  
  - **Clean Carry**: Aging as **technical debt** accumulating over time; restoration as **maintenance work**.  
  - **Distortion**: Biology lacks a "golden file" for age 20; **commit history** is unrecoverable.  
  - **Cannot Say**: Whether aging is a **bug** (deviation from spec) or a **feature** (intended lifecycle).  

  **Case 4: New Human Immunity (Never-Before-Seen Trait)**  
  - **Translation**: **Feature request** adding new **observed behavior** beyond all prior **reference platforms**.  
  - **Clean Carry**: Clearly **enhancement** per all baselines (not a **bug fix**).  
  - **Distortion**: Engineering assumes new features are optional; ethics debates if some immunities are owed.  
  - **Cannot Say**: Whether unprecedented traits could become morally required (e.g., if disease prevalence changes).  

  **Case 5: Moving Thresholds on a Continuous Scale**  
  - **Translation**: **Alert thresholds** adjusted by committee, reclassifying some **observed behaviors** as **bugs**.  
  - **Clean Carry**: Thresholds as configurable **SLOs**; changes cause **breaking changes** for users.  
  - **Distortion**: Engineering **SLOs** are set *proactively*; medicine often sets thresholds *reactively*.  
  - **Cannot Say**: How to define the "correct" **SLO** without smuggling values (e.g., "health" as **acceptance test**).  

  **Case 6: Trait as Community Foundation (e.g., Deafness)**  
  - **Translation**: "Fixing" the trait is a **breaking change** violating **Hyrum’s Law** (community dependencies on current **observed behavior**).  
  - **Clean Carry**: Changes may break downstream "systems" (culture, relationships).  
  - **Distortion**: Engineering **migrations** can be planned; community destruction is irreversible.  
  - **Cannot Say**: How to weigh **technical debt** against cultural value (no **SLO** for social cohesion).  

  **Case 7: Trade-off Intervention (e.g., Less Sleep/Shorter Lifespan)**  
  - **Translation**: **Feature work** that improves one **metric** (sleep efficiency) but degrades another (uptime/lifespan).  
  - **Clean Carry**: Trade-offs as non-**SLO**-aligned changes; requires **cost-benefit analysis**.  
  - **Distortion**: Engineering optimizes for predefined **SLOs**; human "metrics" lack consensus.  
  - **Cannot Say**: Which **SLO** (longevity? alertness?) is morally primary.  

  ---

  ### Residue Report  
  1. **Smuggled Assumptions**:  
     - **Designer Intent**: Your vocabulary requires a **spec-writer** (engineer). Biology lacks this, making "**intended behavior**" speculative (especially for **historical baseline**).  
     - **Health as SLO**: "Normal function" implicitly defines **acceptance tests**, but "health" is not natively in your terms.  
     - **Moral Weight Source**: Why **bug fixes** are "owed" maps to **SLO violations** in engineering, but bioethics derives this from human dignity—a concept absent in your lexicon.  

  2. **Limitations Exposed**:  
     - **Vocabulary Limitation**: Your framework handles **observed behavior** and **dependencies** well but struggles with *teleology* (purpose without a designer) and *value conflicts* (e.g., Case 6’s cultural vs. individual "**SLOs**").  
     - **Distinction Limitation**: The therapy/enhancement boundary blurs when:  
       - Baselines conflict (Case 1: statistical normal ≠ healthy).  
       - "**Reference platform**" is ambiguous (Case 3: which "version" of biology is canonical?).  
       - **Hyrum’s Law** complicates "defects" (Case 6: if a trait has dependencies, is it a **bug** or a **feature**?).  

  3. **Case Collapses**:  
     - Cases 5 (moving thresholds) and 7 (trade-offs) both reveal **SLOs** as value-laden and non-universal.  
     - Cases 2 (cochlear implant) and 4 (new immunity) both involve **workarounds/shim** vs. **root-cause fixes**, but split on therapy/enhancement due to baseline ambiguity.  

  ---

  ### Confidence Assessment  
  - **Overall Verdict**: 85% confident. The translation robustly handles behavioral deviations, dependencies, and prioritization but fails to capture *human-specific values* (dignity, identity, meaning).  
  - **Least Confident Claim**: That the **historical baseline** can be mapped to **commit history**. Evolution has no version control, and "original behavior" is often unknowable (→ 60% confidence).  

  ### Final Output Summary  
  | **Bioethics Concept**       | **Engineering Translation**                     | **Residue**                                  |  
  |-----------------------------|------------------------------------------------|----------------------------------------------|  
  | Therapy                     | Bug fix (restores spec/SLO)                    | Assumes spec exists and is knowable          |  
  | Enhancement                 | Feature request (new capability)               | No intrinsic moral weight in engineering     |  
  | Statistical baseline        | Alert thresholds on population metrics         | Statistical normal ≠ desirable               |  
  | Historical baseline         | Intended behavior from commit history          | No biological "git log"; intent speculative  |  
  | Evaluative baseline         | User-defined acceptance tests                  | "Good life" not in vocabulary                |  
  | Environmental deficit       | Architecture flaw vs. user shim                | Environment refactoring may be ethically distinct |
