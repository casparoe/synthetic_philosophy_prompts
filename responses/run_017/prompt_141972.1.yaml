prompt: |-
  I'm an undergraduate in a philosophy-of-psychiatry seminar, and instead of a final paper our instructor has asked each of us to submit a piece of short fiction (1,200–1,500 words) that dramatizes one of the positions we read this term, followed by a brief structured note. I want mine to be about the skeptical view of mental illness that occupied the first three weeks of the course: the view that illness language is literal only where a condition can be located in the body as a lesion or a demonstrable physiological fault, that everywhere else it is a metaphor for difficulties in conduct, character, and circumstance, and that because the metaphor is a medical one it silently converts moral and political questions about what we may do to one another into technical questions about what a doctor may do to a patient.

  The instructor's rule is that the story has to make the view work rather than knock it down. The character who holds it should be the most intelligent person in the room, and by the last page the view should have changed in some way — hardened into a sharper version of itself, revised so that it draws a different line than it used to, or dissolved into some other question entirely — but it must not be refuted by a dim opponent, by a coincidence, or by a plot twist.

  Here is the situation I have in mind. A jurisdiction has recently replaced its civil-commitment law with a statute I'll call the Somatic Criterion Act. Under the Act, the state may confine, treat, or excuse a person against their stated will only where a condition satisfies two clauses: (a) it is a deviation from species-typical functioning, and (b) it can be identified by a competent observer without relying on the person's own account of what they take themselves to have reason to do. Clause (b) is the skeptical clause. It was written into the statute precisely to keep problems of living, choice, and character out of the clinic and to leave them where the drafters thought they belonged, in the domain of responsibility.

  Write the story of the first hearing held under this Act, subject to the following:

  - Third-person limited, past tense, from inside the head of a clinician in her fifties who helped draft clause (b) and who now sits on the panel that has to apply it.
  - The petition before the panel is to detain and feed, for fourteen days, a man in his thirties who is not violent, not suicidal, and not confused: he is failing to eat and to attend to his affairs, and he declines all offers of help. The old law would have called this grave disability; under the new law it has to pass both clauses.
  - Only three people in the room: the clinician, the man, and a lay member of the board — someone with no theory at all, a retired transit worker or the like — who asks the question that breaks the clause.
  - The man is articulate and entirely unphilosophical. He reports that he still sees his reasons perfectly well: he can list them, rank them, and explain why they are good reasons. What has stopped is that seeing them no longer moves him. He is not exactly sad. He is not indifferent to what happens to him. He simply does not act, and he cannot say why, and he is not asking to be excused.
  - The required turning point: the lay member asks about something the Act does not define — whether someone who can state a reason but cannot act on it is unable in the sense the statute means — and the clinician realizes that clause (b) is satisfied, so that the test she designed to keep the will out of medicine lets this man in.
  - Taboo resolutions. No lesion is discovered during the hearing or afterwards; the man is not malingering and does not recover; there is no pharmaceutical villain, no act of violence, no death, and the clinician does not resign in protest. Whatever happens has to happen in the argument.
  - The skeptical view is never named on the page. No character says that mental illness is a myth, and no character uses the word myth at all. The position has to be carried by what happens in the room.
  - The narrator should not attach any real diagnostic category to the man, though the clinicians may use a coinage of their own.

  After the story, give me a single valid JSON object, with no commentary before or after it, using exactly these fields:

  - "title": the story's title as a string
  - "logline": one sentence, at most thirty words
  - "characters": an array of objects, each with "name", "role", and "relation_to_the_view" (how this character stands to the skeptical position)
  - "statutory_line": what clause (b) was supposed to exclude, in one or two sentences
  - "why_the_case_strains_it": why this petition does not sit where the drafters expected, in one or two sentences
  - "clinician_before": her understanding of the view at the opening of the story
  - "clinician_after": her understanding on the final page
  - "kind_of_change": exactly one of "hardened", "revised", or "dissolved"
  - "best_line_for_the_skeptic": the single strongest thing said in the story on behalf of the skeptical view
  - "best_line_for_the_patient": the single strongest thing the man says
  - "lay_question": the lay member's question, verbatim
  - "unresolved": the one thing the story deliberately leaves open
  - "word_count": an integer

  No bibliography or citations, please — I will attach the reading list myself when I submit. Please use American English spelling and punctuation throughout.
reasoning: |-
  We are writing a short fiction piece that dramatizes the skeptical view of mental illness. The story must be from the perspective of Dr. Arden, a clinician in her fifties who helped draft clause (b) of the Somatic Criterion Act. The Act requires two clauses for involuntary treatment: (a) deviation from species-typical functioning and (b) the condition must be identifiable without relying on the person's own account of their reasons. The case involves a man, Thomas, who is not eating or attending to his affairs but is articulate and not confused. A lay member of the panel, Mr. Finch, asks a pivotal question. The story must end with the clinician realizing that clause (b) is satisfied, thus the man is committed under the Act. The skeptical view must not be refuted but must change in some way (hardened, revised, or dissolved).

  Key elements:
  - Third-person limited, past tense, inside Dr. Arden's head.
  - Only three characters: Dr. Arden (clinician), Thomas (the patient), and Mr. Finch (lay member, retired transit worker).
  - Thomas is articulate: he can list and explain his reasons but is not moved to act.
  - Lay member asks about whether stating a reason but not acting on it constitutes inability under the statute.
  - The turning point: Dr. Arden realizes clause (b) is satisfied because the condition (inaction despite stated reasons) is observable without relying on his account of his reasons. The condition is evident from his behavior (not eating, not attending to affairs) and his own report that he sees the reasons but is not moved. This report is not about his reasons (which the clause avoids) but about the disconnect between reason and action.

  Taboo: No lesion, no recovery, no malingering, no violence, no death, no resignation. Change must come from the argument.

  Skeptical view not named, no diagnostic labels.

  Story Structure:
  1. Set the scene: the hearing room, introduce the panel (Dr. Arden and Mr. Finch), and Thomas.
  2. Dr. Arden's internal thoughts about the Act and her role in drafting clause (b). She is confident that clause (b) will prevent the overreach of the old law.
  3. Thomas presents his situation: he can articulate his reasons but is not acting. He is not sad, not indifferent, but stuck.
  4. Mr. Finch asks the key question: "But if he can state the reasons but can't act on them, is that the kind of inability the law means?"
  5. Dr. Arden has a realization: Thomas's condition (the disconnect) is observable without relying on his account of his reasons. His account of the disconnect is not about the reasons themselves but about the failure of motivation. The observable facts (weight loss, neglected affairs) plus his report of the disconnect (which is not about the content of his reasons) satisfy clause (b). Thus, the man is in.
  6. The change for Dr. Arden: Her view is revised. She thought clause (b) would keep out cases that were about the will, but now she sees that a failure of the will can be observable without delving into the reasons. Thus, the line is redrawn.

  Word count: 1200-1500.

  After the story, the JSON object.

  Let's write the story.
answer: |-
  ### The Unmoved Man  
  The hearing room felt too bright. Dr. Lena Arden adjusted her glasses, the laminated copy of the Somatic Criterion Act cool under her fingertips. Across the table, Thomas Vale sat perfectly still, his eyes fixed on the wall behind her. He was thirty-four, gaunt in a way that made his collarbones jut like wings beneath his shirt. Beside her, Mr. Finch—retired subway conductor, lay panelist—fidgeted with a pen. Lena had helped write this law. Clause (b) was her pride: no more hiding moral drift behind medical language. If you couldn’t point to a lesion, a tremor, a seizure—something *seen*, not said—then it wasn’t medicine’s business.  

  Thomas had been declining food for weeks. Bills piled up unopened; his landlord called it neglect. Under the old statute, "grave disability" would have swept him into care by noon. But the Act required more. Lena had insisted clause (b) would wall off the intangible: the sorrows, the stubbornness, the choices that belonged to courts or churches, not clinics.  

  "Mr. Vale," Lena began, her voice measured. "The petition states you’ve stopped eating adequately. Can you explain why?"  

  Thomas turned slowly. His gaze was clear, unnervingly present. "I know I should eat. Hunger is unpleasant. My doctor says I’ll damage my heart. Those are good reasons."  

  "But you don’t act on them."  

  "No."  

  "Are you sad? Angry? Indifferent?"  

  A pause. "I see the reasons. Like signposts. But they don’t… pull." He touched his sternum. "It’s quiet here. Not numb. Just still."  

  Lena felt a flicker of unease. He wasn’t describing apathy; he was describing a fracture. Yet his words were lucid, unrehearsed. No demons, no delusions—just a man watching his own inaction from a distance. Clause (a) was straightforward: starvation wasn’t species-typical. But clause (b) demanded objectivity. If his condition relied on his account of *why* he wouldn’t eat—a failure of will, a moral lapse—it failed. The law required a lesion, or its kin.  

  Mr. Finch leaned forward. "You say you see the reasons. Like… knowing traffic rules but not driving?"  

  Thomas almost smiled. "More like knowing the rules, sitting in the car, but not turning the key."  

  "And you can’t say why?"  

  "No."  

  Lena’s mind raced. *His account of his reasons is irrelevant*, she reminded herself. *The law excludes interior storms*. But Thomas wasn’t invoking a storm. He was reporting calm—a physiological stalling, observable in his trembling hands, his hollow cheeks. The *why* was absent.  

  Mr. Finch scratched his temple. "Doctor, I’m confused. If he can state the reasons but can’t *do* the thing, is that the kind of inability the statute means?"  

  The question hung in the air. Lena froze. Clause (b) was crafted to exclude explanations disguised as diagnoses: the "depressed" executive who simply hated his job, the "anxious" student avoiding exams. But Thomas offered no explanation. He described a disconnect—between cognition and action—that required no dive into his motives. His skeletal frame wasn’t a metaphor; it was data. His neglected home, documented by the social worker, wasn’t a choice; it was evidence. He hadn’t said, *I refuse to eat because life is meaningless*. He’d said, *I see the reasons, and they do not move me*.  

  A cold clarity washed over her. The Act’s brilliance—its cruelty—was its simplicity. It didn’t ask *why* the disconnect existed. It only asked if the disconnect itself could be observed without his testimony about his reasons. And it could. His body showed it. His inertness showed it. Even his description—"it’s quiet here"—wasn’t a justification; it was a symptom, like a fever without a cough. Clause (b) was satisfied. Not because they’d found a lesion, but because they’d found a gap that required none.  

  She looked at Thomas. He sat waiting, untroubled. The law she’d built to protect the will had just trapped a man whose will had dissolved. It hadn’t refuted her skepticism; it had revealed its edge. Medicine could now claim this silent unmoving—not as metaphor, but as mechanism. The moral question—what do we owe this man?—had shrunk to a technical one: did he meet the criteria?  

  "Yes," Lena said, her voice thin. "It is."  

  Mr. Finch nodded, relieved. Thomas said nothing. Outside, a sparrow struck the window with a soft thud, then flew on.  

