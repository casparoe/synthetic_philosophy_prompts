prompt: |-
  I audit a philosophy of mind reading group on weekends — I'm not in the department, I just tag along, and on top of that I do volunteer shifts at a community seed library, which turns out to be relevant at the end. We've got to the Kripke stuff, and everyone keeps leaning on one sentence as if it does all the work by itself: ''names are rigid designators — a name picks out the same object in every possible world in which that object exists.'' Two arguments in the group have been built on it and I'm not sure its the same job in both. My flatmate used it to say that since ''water'' picks out H2O in every world, the Twin Earth business with XYZ isn't really a world where ''water'' refers to something else, it's just a world with no water in it at all — so the thought experiment doesn't show what it's supposed to show about meaning. Someone else used the very same sentence to argue that the mind-brain identity theory is dead: if ''pain = C-fiber firing'' were true it would have to be necessary, and we can plainly imagine pain without the C-fibers (and C-fibers firing with no pain), so it isn't true.

  Can you lay out, as a list I can bring to the next session, the different precise claims that one-liner could be making? I mean things like: whether it's a claim about how names work in our language versus a claim about what possibility is like; whether ''same object in every world'' needs some heavy metaphysical assumption about objects existing accross worlds, or whether it can be read as something thin about how we evaluate counterfactuals; whether it's meant to cover kind terms and definite descriptions too or only ordinary proper names; the difference between a term being rigid and a term being ''obstinate'' or simply never failing to refer; and whatever the scope distinction is doing — I keep nodding along when people say ''de dicto / de re'' but I couldn't reconstruct it. For each reading, say whether it's basically a platitude, whether it's substantive but defensible, whether it's genuinely contested, and whether it's probably false. Then, the part I actually care about: for each of the two arguments above, say which reading would be needed to make it go through, whether that's the reading the person probably meant, and whether there's still a gap in the argument even granting the reading. Please don't let ''necessity isn't apriority'' do the work either — I'd like that companion slogan taken apart too, at least enough that I can see where the ''discovered empirically'' bit is supposed to come from, using the morning star / evening star kind of example if it helps. No citations or reading lists, just the distinctions and the verdicts.

  And here's my own case, which nobody in the group wanted to touch. At the seed library we have beans labelled ''Kentucky Wonder'' that are about to be grown out, and an old gardener told me the seed we've all been calling that for thirty years is actually two distinct varieties mixed together, not one. On the readings you lay out, does ''Kentucky Wonder'' pick out one thing or a disjunction, and is it rigid either way? Does any of this say anything at all about whether our jars are mislabelled? I'd like to know which readings are silent on the question versus which give me an answer, and I'd especially like to know if the honest answer is that the slogan just has nothing to say about it.
