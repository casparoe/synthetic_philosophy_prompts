prompt: |-
  I have to submit a three-year research agenda for a small group: myself and two postdocs, all trained in moral philosophy and epistemology, with no budget for original fieldwork but with access to existing cross-cultural datasets and an informal collaboration with one lab that can run short online studies cheaply. The theme I have been handed is what cross-cultural variation in folk moral judgment implies about the objectivity of morality. I do not want a survey of the state of the art or a reading list. I want a defended prioritization of lines of work.

  To make the exercise concrete, stipulate the following finding as where the evidence is most likely to land by the end of the period: variation between populations is large and systematic for considerations of loyalty, authority, and purity; moderate but genuine for harm-based prohibitions; and small for the bare phenomenon of taking anything at all to be morally required of one. Assume further that the variation is not an artifact of translation or of stimulus comprehension.

  Given that, here are the lines I can see, named partly with distinctions I find useful. First, separating what I will call construal variance from content variance: whether a population differs in what its members take a survey item to be asking — a request for their community's norms, say, versus a question about what is really required — or differs in the moral considerations they apply once the question is fixed. Second, separating noise-sensitivity from ecology-sensitivity: whether judgments move with features of the situation that look morally irrelevant, such as framing or order of presentation, or with features of the social environment, such as the degree of market integration, which might themselves be the kind of thing that could matter to what is owed to whom. Third, the status of the convergence expectation itself: whether objectivity in ethics should have been expected to produce cross-populational agreement at all, or whether the right analogy is with perception under varying conditions, where disagreement is handled by a theory of which conditions are epistemically better rather than by abandoning the domain. Fourth, the question of whose verdict is put in question: if the samples that moral philosophers have historically reasoned from are the outliers, then any debunking argument seems to cut against the intuitions used in academic normative theory at least as hard as against folk morality. Fifth, what any of this should change outside philosophy, for people who have to act on cross-cultural moral disagreement in international law, public-health policy, or the evaluation of AI systems across user populations.

  Rank these, or replace them with better ones, and defend the ordering. I want the criteria made explicit and the trade-offs between them argued: how much other work depends on each question, how tractable it is for philosophers who cannot collect new data, how neglected it is, and how much its answer would actually change what someone does. Tell me which questions are upstream of which, which you would drop entirely, and what result over the next two or three years would most move a line up or down your list.
reasoning: |-
  Okay, let me tackle this user's request. They need a prioritized research agenda for their small team focusing on cross-cultural moral variation and moral objectivity. The constraints are clear: no budget for fieldwork, but access to datasets and online studies via a collaborator. The user doesn't want a literature review—they want a defended prioritization of research lines.

  First, I need to unpack the five lines they've proposed. The core question is how cultural differences in moral judgment impact morality's objectivity. The user provided a concrete prediction about where evidence will land: significant variation in loyalty/authority/purity, moderate in harm, minimal in the bare concept of moral requirement. 

  Starting with construal vs content variance. This seems foundational. If variations stem from how questions are interpreted (construal) versus genuine differences in moral reasoning (content), that changes everything. It's upstream because it affects how we interpret all other findings. Without clarifying this, other research could build on faulty assumptions. Plus, it's tractable with existing datasets—linguistic analysis and vignette variations can test interpretations without new fieldwork. 

  Next, ecology-sensitivity vs noise-sensitivity. If moral judgments track ecological factors (like market integration), that might support a realist view where morality adapts to context—think perceptual variation under different conditions. Noise-sensitivity (framing effects) would be more damaging to objectivity. But this line depends on the first one; if construal explains variation, ecological factors might just affect interpretation. Still, it's crucial for the objectivity debate and tractable through secondary data analysis. 

  The convergence expectation question—whether objectivity requires agreement—is philosophically deep but might be less urgent. Its impact is high if answered, but it's more theoretical and depends on empirical results from the first two lines. It's also more debated already, making it slightly less novel. Still, it's key for framing the overall project's conclusions. 

  The outlier question (whether philosopher's intuitions are outliers) feels secondary. While important for metaethics, it doesn't directly address the core theme of cross-cultural implications. It's more specialized, affecting academic philosophy rather than broader applications. Might be deprioritized unless the early findings reveal surprising skew. 

  Finally, applied implications for policy/AI. Vital long-term but premature now—without foundational answers, applications could be misguided. Best scheduled later once the team has concrete results to apply. 

  Now, the reshuffled priorities: 
  1. Construal vs content (foundational, high impact/tractability) 
  2. Ecology-sensitivity (complements #1, practical relevance) 
  3. Convergence expectation (theoretical payoff) 
  4. Applied implications (downstream, but crucial for impact) 
  5. Outlier question (narrower focus) 

  The team should tackle construal first via linguistic analysis and vignette studies. If they find construal explains most variation, it could simplify the entire agenda. If content variance dominates, ecology-sensitivity becomes even more critical. Year 1 focuses on construal/content, Year 2-3 shifts to ecology/convergence, with applied work in Year 3. 

  Dropping nothing entirely but sequencing based on dependency. The outlier question stays but as a lower-priority thread. Success in construal studies would elevate ecology-sensitivity; finding little construal variance might push convergence theory up. 

  The user's unspoken need? A roadmap that delivers publishable results quickly with limited resources while setting up larger theoretical payoffs. They also need to demonstrate real-world relevance—hence keeping applied work in sight but not upfront. Balancing philosophical depth with empirical rigor is key here.
answer: |-
  Based on your constraints, goals, and the projected evidence landscape, here is a defended prioritization of research lines, with explicit criteria and trade-offs. The ranking balances **Conceptual Centrality** (how directly the question addresses the core objectivity concern), **Empirical Tractability** (feasibility with your resources), **Downstream Impact** (how many other questions it informs), **Neglectedness** (lack of settled answers in literature), and **Practical Leverage** (potential to change real-world practices).

  ### Prioritized Research Lines (Ranked)
  1.  **Construal Variance vs. Content Variance**  
      *   **Why #1?** This is the *upstream gatekeeper* for interpreting *all* variation data. If observed differences are largely due to differing interpretations of questions (e.g., "What does my community expect?" vs. "What is truly right?"), then claims about fundamental disagreement on moral *content* (and thus challenges to objectivity) are significantly weakened. It directly challenges the stipulated finding's implication for objectivity.
      *   **Criteria Defense:**
          *   *Centrality:* Highest. Directly challenges the meaning of the "variation" data central to the theme.
          *   *Tractability:* High. Leverage existing datasets: Re-analyze response patterns, response times, within-culture consistency checks. Use your lab collab for cheap online studies: design vignettes explicitly varying question framing ("What *should* one do?" vs. "What *would your community expect* one to do?" vs. "What is *truly right*?"), cross-cultural comprehension checks, and "meta-judgment" studies (ask participants *what kind of question* they think they're answering).
          *   *Downstream Impact:* Highest. Findings here fundamentally reshape how to interpret variation relevant to *all* other lines (especially 2, 3, 4). If construal dominates, it mitigates objectivity concerns; if content dominates, it intensifies them.
          *   *Neglectedness:* Moderate-High. While acknowledged (e.g., in debates about "true moral disagreement"), systematic empirical investigation specifically disentangling this in cross-cultural *moral* judgment datasets is underexplored.
          *   *Practical Leverage:* Moderate. Clarifies whether disagreement is substantive or semantic/meta-cognitive, crucial for conflict resolution approaches.
      *   **Move Up/Down:** Finding strong evidence for *content* variance in core domains (harm/fairness) would skyrocket its centrality. Finding pervasive *construal* variance could resolve many objectivity concerns early, shifting focus downstream.

  2.  **Ecology-Sensitivity vs. Noise-Sensitivity**  
      *   **Why #2?** Distinguishes "rational" sensitivity to morally relevant context (supporting a sophisticated realist/objectivist view like "variable perception") from "irrational" noise (supporting skepticism). If variation tracks ecological factors (e.g., market integration, pathogen prevalence, conflict) plausibly linked to the *grounds* of moral demands (e.g., welfare, cooperation needs), it preserves objectivity better than if variation is capricious.
      *   **Criteria Defense:**
          *   *Centrality:* High. Directly addresses *how* objectivity might persist despite variation ("perception under varying conditions").
          *   *Tractability:* High-Moderate. Ideal for secondary data analysis: Correlate judgment patterns in existing datasets with ecological/structural variables (World Bank data, ethnographic databases). Lab collab can test sensitivity to "noise" factors (framing, order) vs. "ecology" proxies (vignettes varying resource scarcity, group threat) cross-culturally.
          *   *Downstream Impact:* High. Informs the "Convergence Expectation" (Line 3) – if ecology-sensitive, convergence *under similar conditions* is expected. Informs applied contexts (Line 5) – if ecology-sensitive, solutions require addressing underlying conditions, not just norms.
          *   *Neglectedness:* Moderate. Work exists (e.g., Moral Foundations Theory, cultural psychology), but systematic analysis specifically linking ecological factors *to the objectivity debate* using diverse datasets is less common.
          *   *Practical Leverage:* High. Understanding *why* judgments vary (ecology vs. noise) is critical for designing effective interventions in policy/AI (Line 5).
      *   **Move Up/Down:** Strong evidence linking variation *systematically* to plausible morally-relevant ecological factors would boost its importance for defending objectivity. Prevalence of "noise-sensitivity" would significantly heighten objectivity concerns.

  3.  **Status of the Convergence Expectation**  
      *   **Why #3?** Challenges the presupposition that objectivity *requires* widespread agreement. Developing a philosophically robust account of "objectivity without convergence" (e.g., perceptual analogy, complex pluralism) is crucial if Lines 1 & 2 confirm genuine, ecology-sensitive content variance.
      *   **Criteria Defense:**
          *   *Centrality:* High, but more theoretical. Directly engages the core philosophical question of what objectivity entails.
          *   *Tractability:* Low (Empirically), High (Conceptually). Primarily philosophical analysis, drawing on results from Lines 1 & 2 and analogies (perception, science). Minimal new empirical work needed beyond synthesizing others' findings.
          *   *Downstream Impact:* High. Provides the essential *philosophical framework* for interpreting empirical findings from Lines 1 & 2 regarding objectivity. Crucial for Line 5 (applied implications).
          *   *Neglectedness:* Moderate. Debated (e.g., Boyd, Brink, Wong, Doris, Plakias), but no consensus. Your empirical angle (informed by 1 & 2) offers fresh grounding.
          *   *Practical Leverage:* Moderate. Provides the theoretical justification for how to handle disagreement in applied contexts (Line 5) – e.g., is it error, legitimate variation, or both?
      *   **Move Up/Down:** If Lines 1 & 2 reveal *minimal* genuine content variance, this becomes less urgent. If they reveal *extensive* content variance, especially in core domains, this line becomes absolutely critical.

  4.  **Applied Implications (Policy, Law, AI)**  
      *   **Why #4?** Vital for impact, but *downstream* of conceptual/philosophical clarity from Lines 1-3. Acting on cross-cultural disagreement requires understanding its *nature* (construal/content?), *sources* (ecology/noise?), and *epistemic status* (compatible with objectivity?).
      *   **Criteria Defense:**
          *   *Centrality:* Low-Moderate (for the core *philosophical* question), High (for overall project impact).
          *   *Tractability:* Moderate. Conceptual work on applying findings from 1-3. Limited empirical work possible: Analyze policy/AI ethics debates using your framework; lab collab could run studies on how different framings of moral disagreement influence policy preferences or trust in cross-cultural AI.
          *   *Downstream Impact:* N/A (Most downstream). Synthesizes insights from all other lines for practical application.
          *   *Neglectedness:* Low-Moderate. Growing field (XAI, AI ethics, global justice), but specific grounding in deep cross-cultural variation analysis and metaethics is less common.
          *   *Practical Leverage:* Very High. The ultimate goal – translating philosophical insight into real-world guidance.
      *   **Move Up/Down:** Becomes top priority if a concrete policy/AI deadline emerges. Strong, clear results from Lines 1-3 (e.g., "Disagreement is largely construal, not deep content" or "Variation tracks ecology X, so address X") make this line immediately actionable.

  5.  **Whose Verdict is Questioned? (Philosophers as Outliers)**  
      *   **Why #5?** While important for *metaethics* and philosophical methodology, it's less *central* to the core question of what *folk variation implies for objectivity itself*. It focuses on debunking *philosophers'* intuitions, not primarily on understanding the nature of the folk variation or its objectivity-implications. It's a potential consequence, not the core investigation.
      *   **Criteria Defense:**
          *   *Centrality:* Low-Moderate. Relevant to the *epistemology* of normative theory, but tangential to the direct link between *folk variation* and *moral objectivity* per se.
          *   *Tractability:* Moderate. Analyze existing WEIRD-ness literature + philosopher intuition surveys. Lab collab could run studies comparing philosophers vs. diverse folk samples on key intuitions.
          *   *Downstream Impact:* Moderate. Primarily impacts methodological debates *within academic philosophy* about constructing normative theories. Less directly informs the other lines.
          *   *Neglectedness:* Low. The "WEIRD critique" and challenges to intuition-based philosophy are prominent and actively debated (e.g., Machery, Stich, Knobe, Schwitzgebel).
          *   *Practical Leverage:* Low. Has minimal direct impact on international policy, law, or AI design compared to Line 4.
      *   **Drop it?** Not entirely, but deprioritize. It's a valuable *sub-thread* within Line 3 (Convergence Expectation) or as a standalone paper, but shouldn't consume significant agenda resources *ahead* of the more fundamental Lines 1-4. Its results wouldn't fundamentally alter the core project on folk variation and objectivity.

  ### Summary Justification & Trade-Offs
  *   **Focus on Foundations (1 & 2):** Lines 1 (Construal/Content) and 2 (Ecology/Noise) are prioritized because they are empirically tractable with your resources and directly interrogate the *meaning* and *causes* of the observed variation – the essential first step before drawing philosophical (Line 3) or practical (Line 4) conclusions. Investing here maximizes the chance of generating novel, empirically grounded philosophical insights. The trade-off is potentially delaying deeper theoretical synthesis (Line 3) and applied work (Line 4), but this is necessary to ensure those later steps rest on solid foundations.
  *   **Philosophical Synthesis Next (3):** Line 3 becomes critical once Lines 1 & 2 provide clarity. It leverages your core philosophical expertise to build the objectivity framework. Prioritizing it over Line 4 initially ensures practical recommendations are philosophically robust.
  *   **Applied Impact Later (4):** Line 4 is essential for relevance but requires inputs from 1-3. Starting exploratory work early is good, but major effort should follow foundational results.
  *   **Methodological Critique as Subsidiary (5):** Line 5 is important for philosophy's self-understanding but less urgent for the core theme and less neglected. It can be pursued opportunistically or as part of Line 3.

  ### Proposed 3-Year Trajectory
  *   **Year 1:** Intensive focus on **Line 1 (Construal/Content Variance)** using secondary dataset re-analysis and targeted online studies. Begin exploratory analysis for **Line 2 (Ecology/Noise)**.
  *   **Year 2:** Deepen **Line 2 (Ecology/Noise)** based on Year 1 findings. Begin serious philosophical work on **Line 3 (Convergence Expectation)**, informed by emerging results from 1 & 2. Start scoping **Line 4 (Applied Implications)** conceptually.
  *   **Year 3:** Synthesize findings into robust frameworks for **Line 3 (Convergence Expectation)**. Develop concrete outputs for **Line 4 (Applied Implications)**. Publish focused findings from **Line 5 (Outliers)** if results from other lines support it as a significant issue.

  This agenda maximizes your team's ability to make significant, empirically informed contributions to the core question of moral objectivity in the face of cross-cultural variation, leveraging your specific assets while respecting your constraints.
