prompt: |-
  my book club read that big decline-of-violence book last month — the one with graphs on every other page, prehistoric skulls, medieval murder rates, war deaths per capita, the whole thing — and we've been going in circles about it ever since. I want your actual number, but more than that I want to see where it comes from, because I genuinely can't tell which of us is disagreeing about what. I'm at around 0.55, one friend came out of it at 0.9, and another (who does anthropology and thinks the whole thing is a measurement artifact dressed up as a moral achievement) is at 0.25.

  Here's the claim I want a credence on, stated as precisely as I can: a person picked at random, anywhere in the world, today, faces a substantially lower risk over the course of a year of suffering deliberate physical violence at human hands than a person picked at random in 1750 did. Say it resolves in favour of decline if the best reconstruction we could in principle assemble puts the later figure at half the earlier one or lower.

  Please decompose it and give me a number for each piece, with one line of justification apiece, and then the combination:

  - how much of your uncertainty is really the worry that there is no fact of the matter here at all — that "violence" is a contested, interest-shaped category rather than something with a discoverable trend. (If some of your mass sits here, count it against the claim being *true* for the headline number, but give me the conditional-on-there-being-a-fact figure separately too.)
  - how good the historical record would have to be, and is: how much of your number rides on whether pre-modern homicide and war-death estimates are anywhere near usable, versus being extrapolations from a handful of well-documented places.
  - the narrow core: interpersonal homicide plus battle deaths, counted per capita. How confident are you that *this* declined a lot?
  - the accounting choice: per capita versus absolute. If what matters is how many people got hurt in total, the population multiplier eats most of the decline. How much does the headline number depend on which one we're asking about, and which one does the book's "things are getting better" conclusion actually need?
  - the window problem. Pick 1500, 1750, 1900, 1945, 1965 or 1990 as your baseline and you get different stories, and the mid-century looks enough like an outlier that anything after it reads as recovery rather than decline. How much of your number is baseline sensitivity?
  - the category question, which is where I think the real fight is. My seminar came up with an operational rule we liked: count an event as violence only if it would have counted as a criminal homicide or assault under the law actually in force where and when it happened. That seems to me to quietly decide a lot — it lets colonial pacification, chattel slavery, prison conditions and a great deal of state killing in or out depending on who was writing the criminal code. Tell me how much your number moves if we adopt that proxy versus if we drop it, and what you'd replace it with.
  - the "outsourcing" worry: violence that hasn't gone away but has been displaced into arrangements where no individual seems to be the agent — a sentence length, an eviction, a sanction regime, a border. And a nastier version: if we count the violence that is credibly *threatened* in order to make every enforced rule bite, rather than only the violence that gets executed, modern states stop looking pacific at all. How much weight does each of those get, and does either reverse the trend?

  Then: multiply it out, tell me which single term your final number is most sensitive to, and what one argument or piece of evidence would move it most. And take a guess at where my two friends actually differ — is the 0.9 person and the 0.25 person disagreeing about the data, about what counts as violence, or about whether the question has an answer?

  No need to look anything up or cite studies, I'd rather you reason from what you already know and flag where you're guessing. End with your headline credence in a fixed form on the last line: \answer{0.xx}
