prompt: |-
  I sit on the animal-welfare committee of a farmed-seafood company, and my verdicts case by case don't seem to add up to anything I can state. Here they are as I actually have them.

  1. Stunning farmed salmon electrically, or with a percussive blow, immediately before they are killed and bled: fine, and I would make it mandatory. Killing the same fish by chilling them in an ice slurry while they are still conscious: not fine.
  2. Ablating one eyestalk of breeding female shrimp, with no anaesthetic, to induce them to spawn: not fine, even though the gain in hatchery output is large.
  3. Holding salmon at a density that leaves most of a cage with split fins and chronically elevated cortisol, while food, oxygen and disease control are all in order: not fine, but I would cap density rather than ban the practice. My discomfort: on my own arithmetic the total harm in 3 dwarfs the harm in 2, since it touches millions of fish rather than thousands of broodstock, and yet I want 2 banned outright and 3 merely capped.
  4. A feed additive that blocks the stress axis, given to fish in the very cages of case 3: they eat, grow and survive as well as ever, show no cortisol response to crowding, and no longer shoal or try to avoid the net. Not fine. It looks like it solves 3, but it strikes me as fixing the fish instead of the cage.
  5. Fixing the cage instead: low-density, structurally enriched ponds with predators, parasites and real social hierarchies, ending in the same stun and bleed as case 1. Fine — and I would bet the fish in 5 get hurt far more often, and some eaten, than the treated fish in 4.
  6. The one I keep reversing on: a gene-edited shrimp line in which the affective component of pain has been removed. They still withdraw and tail-flip at a noxious stimulus, but show no avoidance learning, no grooming of wounded parts and no physiological signature of distress, and they feed, mate and spawn normally. Ablating the eyestalk of such an animal, or crowding it, seems to stop being wrong; the whole programme nevertheless makes me uneasy in a way I cannot cash out.

  What principle, if any, returns my verdicts as its output — stated precisely enough to apply to cases I haven't listed? I would rather have a principle that overturns one of my verdicts than one with a separate clause shaped around each case, so say which verdict you would give up.

  Answer in exactly six numbered items, one or two sentences each, with no preamble and no summing-up: (i) your candidate principle, stated as precisely as you can; (ii) the clause you are least confident in, and which of my verdicts forces it; (iii) how the principle handles the pair of cases you think is doing the real work, if you disagree that it is 4 and 5; (iv) your verdict on case 6 and why; (v) which of my verdicts you would overturn; (vi) one case of your own, not on my list, that discriminates between your principle and its nearest rival, with your verdict on it.
reasoning: |-
  Okay, let me approach this systematically. The user presents six complex animal welfare cases from their role in farmed-seafood governance and seeks an underlying ethical principle that coherently explains their judgments. 

  First, I notice their discomfort stems from apparent inconsistencies: banning eyestalk ablation (case 2) while merely capping density (case 3) despite greater aggregate harm in the latter, and rejecting stress-axis blockers (case 4) while accepting naturalistic systems with higher injury risks (case 5). The gene-edited shrimp (case 6) particularly challenges their intuition.

  The core tension seems to be between:
  - Preventing deliberate harm vs allowing systemic harm
  - Valuing natural behaviors vs artificial solutions
  - Focusing on subjective experience vs biological functioning

  I consider principles like "minimize suffering" but note how it fails case 5 where harm is higher but natural. "Prevent unnatural interventions" struggles with case 4 vs 1. "Respect telos" (species-specific nature) fits best: case 4 violates salmon's shoaling instincts while case 5 allows natural hierarchies. 

  For case 6, removing pain affect seems to eliminate suffering but crosses an ethical line by fundamentally altering the animal's relationship with its environment. I'd overturn their case 3 verdict - capping density still permits chronic suffering when a ban might align better with the principle.

  A test case: selectively breeding blind cavefish for farming where vision isn't needed. Under telos, this is acceptable if it doesn't generate suffering; under a "natural anatomy" view it might not be. 

  The eyestalk ablation case (2) most strains the principle since one could argue it doesn't disrupt shrimp telos more than other farming practices. But the user's strong rejection suggests it violates a fundamental prohibition on deliberate mutilation.
answer: |-
  (i) Principle: Minimize interventions that disrupt an animal's natural functioning (telos) while preventing unnecessary suffering; prioritize eliminating deliberate harm over incidental harm when both cause comparable suffering, and reject modifications that fundamentally disconnect behavior from wellbeing.  

  (ii) Least confident in prioritizing deliberate harm prohibition (forced by case 2: eyestalk ablation’s deliberate mutilation outweighs case 3’s larger-scale incidental harm despite greater aggregate suffering).  

  (iii) The core tension is cases 4 vs. 5: blocking stress response (4) severs natural feedback mechanisms, violating telos, while enriched ponds (5) allow natural hierarchies and injuries as part of coherent functioning.  

  (iv) Case 6 verdict: Not fine; removing affective pain severs the constitutive link between noxious stimuli and subjective experience, rendering the animal’s responses mechanistically decoupled from wellbeing.  

  (v) Overturn case 3 verdict: Capping density still permits chronic suffering; the principle demands banning practices causing unavoidable severe harm (like ice-slurry chilling).  

  (vi) Test case: Breeding blind cavefish for dark aquaculture tanks. Verdict: Fine; blindness aligns with their evolved telos (unlike case 6’s artificial disconnection), and reduces navigation stress.
