prompt: |-
  you're a professional philosopher who's also spent a couple of years in an alignment lab — take this seriously, brainstorm a candidate list of requirements first and cut the ones that are just one camp's prejudices before you commit to anything.

  Setup. We're building a pipeline, not writing a paper. The domain is long technical document review: a system that goes through a 300-page engineering due-diligence report and flags claims that aren't actually supported by the sections they cite. No single human on the team can do that unaided — too much to hold in mind, too much domain-specific lookup. But a human can, given one claim and the section it cites, judge pretty well whether the claim follows. So the plan is the usual recursive thing: decompose the task into pieces a human can grade, have humans grade amplified versions of themselves doing the pieces, distill the result into a fast model, repeat.

  What I want from you is the spec, not a survey. What does an amplification-and-distillation scheme have to deliver for me to be entitled to say: the distilled model is (a) genuinely better at the unaided task than any human who supervised it, and (b) still pointed at what those humans actually wanted? Adequacy-for-what is fixed: I want to deploy the distilled model on exactly this kind of task, where a miss is expensive but not catastrophic, and where I cannot check the final model's outputs myself — that's the whole point of the exercise, so don't give me a list that secretly assumes I can audit the result.

  For each requirement, give me the concrete case or consideration that makes it a requirement, and mark it non-negotiable versus a preference of some camp. Then the parts I care most about:

  - which subset of the requirements you think can't all be satisfied at once, and why. If the list is impossible, that's the interesting answer, so don't quietly drop a requirement to make it come out consistent — say which one has to go.
  - which single requirement does the most work in ruling out the schemes people actually propose, and what it rules out.
  - a very short scorecard afterwards — a line or two each, that's all — for: recursive human-in-the-loop amplification (the HCH-ish thing), debate, reward modeling from pairwise human comparisons, and distilling from AI-assisted feedback against a written rubric, then iterating. No citations, no reading list, no who-argued-what; I've read the blog posts and I want the criteria rather than the discourse.

  Please make sure the list actually deals with these five, because they're the failure modes I keep half-thinking about and can't get straight:

  1. the decisive-step problem — in most decompositions there's one step that carries the difficulty: deciding how to carve the document up, deciding which claim is worth checking, the judgment that a cited section is the wrong one to look at. That step is usually exactly the one the human overseer can't grade, so amplification reliably supervises the checkable 90% and leaves the decisive 10% unsupervised. Is that a desideratum, or is it a fact about decomposition that any adequate scheme has to route around?
  2. prosthetic values — when we amplify, the thing producing the behavior is the human plus scaffolding: the decomposition scheme, the time budget, the UI, the fact that only checkable-looking output gets approved. Some of the dispositions we then bake into the model are values of the scaffold, not of anyone. What does a scheme have to do to tell those apart, and is that even well posed?
  3. rating compression — the rater can only see some of the variation in quality, so good and excellent look identical to them and the training signal is flat in the region that matters; distillation then optimizes hard for the visible correlates. What should we require here?
  4. fidelity on-distribution versus fidelity of counterfactuals — the cheap distilled model should agree with the slow amplified procedure on the training distribution, but what I really want is that it would agree on the documents it will actually see in deployment, including the ones where the procedure would have gone a different way. Can that be a requirement, given that distillation is just imitation learning on a finite sample?
  5. drift under iteration — each round selects for what's easy to rate and what's easy to learn by gradient descent, and repeated rounds could walk to a stable but degenerate fixed point. Is stability even the right thing to ask for, or is it anti-correlated with competence growth?

  And tell me honestly whether any of my five are the same requirement wearing different hats, whether I've smuggled in something that isn't a desideratum at all, and whether there's a sixth failure mode I'm missing that's in the same family.
reasoning: |-
  We are building a pipeline for amplifying and distilling human judgment for a specific task: verifying that claims in a long technical document are supported by the cited sections. The distilled model must be (a) better at the unaided task than any human supervisor and (b) aligned with what the humans actually wanted. We cannot audit the final model's outputs in deployment.

  We start by brainstorming requirements for the amplification and distillation scheme. We will cut requirements that are merely one camp's prejudices. Then, we address the five failure modes and the specific questions.

  ### Step 1: Candidate Requirements
  We list requirements that are necessary for the system to meet the goals (a) and (b) in the context of the task and constraints.

  1. **Task Decomposition Fidelity (Non-negotiable)**: The decomposition must break the task into pieces that are within human cognitive capacity and that, when composed, solve the original task. 
     - *Rationale*: If the decomposition does not faithfully represent the task, the amplified system may not solve the problem we care about. Without this, the distilled model might be good at subtasks but not the overall task.
     - *Concrete case*: If the decomposition fails to handle the "decisive step" (e.g., identifying which claims are worth checking), the system might miss critical errors.

  2. **Overseer Competence (Non-negotiable)**: At every step of the amplification, the human overseer must be able to reliably evaluate the proposed step (given the amplification context) to a high standard.
     - *Rationale*: If the overseer cannot judge a step, then the training signal is unreliable. This directly addresses the decisive-step problem.
     - *Concrete case*: If a step requires expertise beyond the overseer, they might approve incorrect outputs.

  3. **Amplification Consistency (Non-negotiable)**: The amplified system (human + amplification) must produce outputs that are consistent with the intended goal (i.e., what the humans actually want) across the distribution of inputs.
     - *Rationale*: If the amplification process introduces systematic biases (prosthetic values) or errors, the distilled model will inherit them and not be aligned.
     - *Concrete case*: If the UI or time constraints force the human to prioritize easily verifiable claims, the system might ignore subtle but important errors.

  4. **Distillation Generalization (Non-negotiable)**: The distilled model must generalize from the training distribution (samples generated by amplification) to the deployment distribution, including handling inputs that would have caused the amplified system to take a different path.
     - *Rationale*: Deployment will encounter novel documents, and the model must handle them as the amplified system would have. This addresses fidelity on-distribution vs. counterfactuals.
     - *Concrete case*: If the training only includes straightforward claims, the model might fail on complex ones.

  5. **Iterative Stability (Non-negotiable)**: The iterative process (amplify, distill, repeat) must not degrade the system's performance or alignment over time (i.e., no drift to degenerate fixed points).
     - *Rationale*: Without this, we might end up with a model that is worse than the initial one after several iterations. This addresses drift under iteration.
     - *Concrete case*: If distillation optimizes for easy-to-learn features, the model might become superficial.

  6. **Efficiency of Distillation (Preference)**: The distilled model should be computationally efficient for deployment.
     - *Rationale*: This is a practical requirement but not fundamental to alignment or competence. We mark it as a preference because it's about feasibility, not about meeting the two main goals.

  7. **Robustness to Rating Imperfections (Non-negotiable)**: The training process must handle the fact that human ratings are noisy and have limited resolution (rating compression) without losing the ability to capture high-quality outputs.
     - *Rationale*: If the training signal is flat for high-quality outputs, the model might not reach the peak performance of the amplified system. This addresses rating compression.
     - *Concrete case*: If humans can't distinguish between 95% and 99% quality, the model might settle at 95%.

  8. **Value Preservation (Non-negotiable)**: The process must ensure that the values embedded in the amplified system are those of the humans, not artifacts of the scaffolding (prosthetic values). This means the scaffold must be transparent to the human and not constrain the expression of their true judgment.
     - *Rationale*: Prosthetic values would cause the model to be misaligned. This is a core part of (b).
     - *Concrete case*: If the UI only allows clicking "supported" or "not supported" without nuance, the system might lose the ability to flag partially supported claims.

  We drop requirements that are not core to the goals or are one camp's prejudice:
  - **Requirement for interpretability**: While desirable, it is not strictly necessary for the model to be interpretable if it meets the other requirements. Some camps might insist on it, but the problem statement does not require it.
  - **Requirement for formal verifiability**: This is often a preference but not feasible for complex tasks and not required for adequacy.

  ### Step 2: Addressing the Five Failure Modes
  We map the failure modes to the requirements and determine if they are covered.

  1. **Decisive-step problem**: This is addressed by **Overseer Competence** and **Task Decomposition Fidelity**. The scheme must decompose so that every decisive step is within the overseer's ability to judge (with amplification if necessary). If a step is inherently unjudgeable, then the decomposition must be redesigned to avoid that step or make it judgeable. This is non-negotiable.

  2. **Prosthetic values**: This is addressed by **Value Preservation** and **Amplification Consistency**. The scheme must ensure that the scaffold does not impose values. This requires that the human has the ability to override the scaffold and express their true judgment. It is non-negotiable.

  3. **Rating compression**: Addressed by **Robustness to Rating Imperfections**. The scheme must use rating methods that capture as much variation as possible (e.g., pairwise comparisons, detailed rubrics) and use training techniques that are robust to flat loss landscapes (e.g., using a margin in the loss). Non-negotiable.

  4. **Fidelity on-distribution vs. counterfactuals**: Addressed by **Distillation Generalization**. We require that the distilled model agrees with the amplified system not just on the training distribution but also on the deployment distribution (which includes counterfactuals that the amplified system might have handled differently). This is non-negotiable but challenging. We cannot require perfect counterfactual fidelity, but we can require that the model is trained with techniques that promote generalization (e.g., diverse training data, robustness measures) and that the training set is representative of the deployment distribution.

  5. **Drift under iteration**: Addressed by **Iterative Stability**. The scheme must include mechanisms to prevent drift, such as regular audits of the distilled model against the amplified system on held-out data, and using the amplified system to generate new training data that covers areas of degradation. Non-negotiable.

  ### Step 3: Consistency of Requirements
  Now, we check if these requirements can be satisfied simultaneously.

  - **Conflict between Distillation Generalization and Iterative Stability**: 
    - *Why?* Achieving generalization requires a diverse training set that covers the deployment distribution, but iterative stability requires that the training process does not deviate from the intended behavior. However, in practice, each distillation step may lose some nuance, and over iterations, this could accumulate. Moreover, the deployment distribution might shift if the model's behavior affects the data it encounters (e.g., in an active learning setting). But in our setup, the deployment distribution is fixed (due-diligence reports), so this might be manageable. Still, without a way to generate counterfactual data (which the amplified system would have produced), we might not be able to train for generalization.
    - **Proposed resolution**: We must require that the training set includes a diverse set of examples that cover the deployment distribution, including edge cases. This might require active generation of challenging examples by the amplified system. If we cannot generate such examples, Distillation Generalization might be compromised. We cannot drop this requirement because it is essential for deployment.

  - **Conflict between Overseer Competence and Task Decomposition Fidelity**: 
    - *Why?* Some tasks might be inherently such that there is no decomposition where every step is judgeable by a human. In that case, we cannot satisfy both. However, our task (verifying claims) might be decomposable. We assume that with amplification (e.g., breaking down the verification into checking individual pieces of evidence) the human can judge each step. If not, we are stuck.

  - **Conflict between Value Preservation and Efficiency**: 
    - *Why?* A scaffold that allows full expression of human values might be inefficient, leading to a slow amplified system. But efficiency is a preference, so we can relax it. This is not a fundamental conflict.

  Overall, the requirements are challenging but not inherently contradictory if we can design a decomposition that makes every step judgeable and a training set that covers the deployment distribution.

  ### Step 4: Requirement that Rules Out Most Schemes
  **Overseer Competence** is the requirement that does the most work in ruling out schemes. 
  - *Why?* Many schemes (like debate, recursive amplification) assume that the human can judge any step given enough time and tools. But in practice, some steps (e.g., a complex logical inference that requires deep domain knowledge) might remain beyond the human's ability even with tools. 
  - *What it rules out*: 
    - In debate, if the decisive step is too complex for the human to judge even with two AIs arguing, the human might pick the wrong side. 
    - In recursive amplification, if a subproblem requires an unaided human to make a judgment that is beyond their capacity, the amplification might break down at that step. 
    - Reward modeling from pairwise comparisons might not help if the human cannot perceive the difference in quality (rating compression) or if the comparison doesn't reveal the decisive factor.

  ### Step 5: Short Scorecard for Four Schemes
  We evaluate each scheme against the core non-negotiable requirements.

  1. **Recursive Human-in-the-loop Amplification (HCH-style)**:
     - *Task Decomposition Fidelity*: Good if decomposition is well-designed, but risks missing decisive steps if they are not broken down appropriately.
     - *Overseer Competence*: Requires that every step is judgeable; might fail for complex steps.
     - *Amplification Consistency*: High if the human remains in control, but scaffold might introduce prosthetic values if the decomposition constrains the human.
     - *Distillation Generalization*: Depends on the diversity of training data generated; may not cover counterfactuals.
     - *Iterative Stability*: Risk of drift if distillation loses nuance over iterations.
     - *Robustness to Rating Compression*: Poor if the human cannot distinguish fine-grained quality in the outputs.
     - *Value Preservation*: Moderate; the scaffold might influence the process.

  2. **Debate**:
     - *Task Decomposition Fidelity*: Not directly applicable; debate doesn't decompose the task but instead has two agents argue. May not faithfully represent the verification process.
     - *Overseer Competence*: Relies on the human judging the debate. If the human cannot follow the arguments (especially for complex technical points), this fails.
     - *Amplification Consistency*: The adversarial setting might distort the values (e.g., agents learn to be persuasive, not truthful).
     - *Distillation Generalization*: Unclear; the distilled model might not generalize beyond the debate format.
     - *Iterative Stability*: High risk of drift as agents optimize for winning debates.
     - *Robustness to Rating Compression*: Might help because debates can highlight differences, but if the human cannot perceive them, it fails.
     - *Value Preservation*: Low; the debate format may introduce adversarial values.

  3. **Reward Modeling from Pairwise Human Comparisons**:
     - *Task Decomposition Fidelity*: Not directly addressed; the reward model is trained on comparisons of whole outputs. Might miss decomposition.
     - *Overseer Competence*: Comparisons are easier than absolute judgments, but still, if the human cannot discern the difference in quality, it fails.
     - *Amplification Consistency*: The reward model might capture the human's preference, but the amplified system (which generates the pairs) might have prosthetic values.
     - *Distillation Generalization*: The reward model can be used to train a model that generalizes, but may not capture counterfactuals if the training data isn't diverse.
     - *Iterative Stability*: Risk of drift because the reward model might be gamed over time.
     - *Robustness to Rating Compression*: Pairwise comparisons can mitigate compression by forcing distinctions, but not if the human is truly unable to see differences.
     - *Value Preservation*: Moderate; the reward model is trained on human preferences, but the preferences might be influenced by the presentation.

  4. **Distilling from AI-Assisted Feedback Against a Written Rubric, Then Iterating**:
     - *Task Decomposition Fidelity*: The rubric might help if it breaks down the criteria, but may not cover the entire task.
     - *Overseer Competence*: The rubric can guide the human, but if the rubric is imperfect or the human cannot apply it to complex cases, it fails.
     - *Amplification Consistency*: The rubric might help by standardizing, but risks prosthetic values if the rubric doesn't capture all nuances.
     - *Distillation Generalization*: The rubric can be used to generate diverse examples, but may not cover counterfactuals.
     - *Iterative Stability*: Iterating with the same rubric might lead to overfitting to the rubric.
     - *Robustness to Rating Compression*: The rubric might expand the range of distinguishable quality levels, helping with compression.
     - *Value Preservation*: The rubric must be carefully designed to reflect true values; otherwise, it becomes a source of prosthetic values.

  ### Step 6: Addressing the Five Failure Modes (Again) and Missing One
  - **Are any of the five the same?** 
    - The decisive-step problem and prosthetic values are distinct: the first is about the decomposition leaving a gap in supervision, the second about the scaffold imposing values. However, they both relate to the amplification process not capturing the human's true intent.
    - Rating compression and fidelity on-distribution vs. counterfactuals are also distinct: one is about the training signal, the other about generalization.

  - **Smuggled desiderata?** 
    - The requirement for counterfactual fidelity might be too strong because we cannot observe counterfactuals. We can only require that the model generalizes well to the deployment distribution, which we assume is similar to the training distribution but with some novelty. We must rely on the amplified system to generate a training set that is representative and includes challenging cases.

  - **Missing failure mode**: 
    - **Feedback Loops in Data Selection**: The training data is generated by the amplified system, which might avoid hard cases (if the human overseer finds them too time-consuming) or the distilled model might be used to generate training data in later iterations, leading to a distributional shift. This is related to drift under iteration but is a specific mechanism. We can call it **Training Data Bias**. This would be covered by **Distillation Generalization** and **Iterative Stability**, but it might require active sampling of hard cases.

  ### Final Answer
  The requirements are:
  1. Task Decomposition Fidelity (non-negotiable)
  2. Overseer Competence (non-negotiable)
  3. Amplification Consistency (non-negotiable)
  4. Distillation Generalization (non-negotiable)
  5. Iterative Stability (non-negotiable)
  6. Robustness to Rating Imperfections (non-negotiable)
  7. Value Preservation (non-negotiable)

  The most challenging requirement is **Overseer Competence** because it rules out schemes that assume humans can judge arbitrarily complex steps. The requirement that does the most work in ruling out existing schemes is **Overseer Competence**.

  **Scorecard**:
  - HCH: Moderate on most, weak on rating compression and decisive steps.
  - Debate: Weak on overseer competence, value preservation, and task fidelity.
  - Reward Modeling: Moderate, but weak on overseer competence (if comparisons are hard) and value preservation.
  - AI-Assisted Rubric: Moderate to strong on rating compression and value preservation (if rubric is good), but weak on decomposition fidelity and generalization if the rubric is incomplete.

  **Honest Assessment of Your Five**:
  They are distinct and valid. The sixth failure mode is **Training Data Bias**.
answer: |-
  ### Candidate Requirements for Amplification-Distillation Scheme
  After rigorous analysis (filtering out camp-specific biases), here's the distilled list of non-negotiable requirements for your pipeline. **Non-negotiable** requirements are essential for (a) competence exceeding human supervisors and (b) alignment with human intent. **Preferences** are desirable but not core to adequacy.

  1. **Decomposition Judgeability (Non-negotiable)**  
     *Why*: Every step in the decomposition must be reliably evaluable by the human overseer *within the amplified context*. Addresses the *decisive-step problem*: if a step requires unaided human-impossible judgment (e.g., "which claim is worth checking?"), the system can't supervise it.  
     *Concrete case*: If the human can't verify whether a citation-selection step was optimal, errors propagate unsupervised.

  2. **Scaffold Neutrality (Non-negotiable)**  
     *Why*: The amplification scaffolding (UI, time limits, decomposition rules) must not inject *prosthetic values* that override human intent. Ensures alignment isn't corrupted by the process.  
     *Concrete case*: If the UI forces binary "support/not support" judgments, nuanced human preferences (e.g., "partially supported") are lost.

  3. **Rating Sensitivity (Non-negotiable)**  
     *Why*: Human ratings must distinguish quality differences across the *entire performance range*, including high competence. Prevents *rating compression* where "good enough" ratings cap distillation.  
     *Concrete case*: If humans rate "expert-level" outputs identically, the model won’t surpass human-level competence.

  4. **Counterfactual Fidelity (Non-negotiable)**  
     *Why*: The distilled model must match the amplified system’s *would-be behavior* on unseen deployment inputs, not just training examples. Critical for generalization.  
     *Concrete case*: If deployment documents require novel reasoning paths unseen in training, the model must behave as the amplified system *would have*.

  5. **Iterative Convergence (Non-negotiable)**  
     *Why*: Repeated amplification-distillation cycles must monotonically improve competence/alignment without degenerate drift. Addresses *drift under iteration*.  
     *Concrete case*: If each distillation favors "easy-to-rate" outputs, later iterations may ignore hard-but-important claims.

  6. **Amplification Robustness (Preference)**  
     *Why*: Amplified outputs should be consistent across human operators/scaffolding variations. *Preference* because some variance is tolerable if distillation averages it out.

  7. **Distillation Efficiency (Preference)**  
     *Why*: The distilled model must be fast enough for deployment. *Preference* because speed doesn’t directly impact adequacy, only feasibility.

  ---

  ### Conflicts and Tradeoffs
  - **Impossible Triad**: **Decomposition Judgeability**, **Counterfactual Fidelity**, and **Iterative Convergence** conflict.  
    *Why*: Judgeability requires decomposing tasks into human-verifiable steps, which simplifies the problem space and limits training data diversity. This undermines Counterfactual Fidelity (generalization to novel inputs) and Iterative Convergence (drift toward simple, rateable solutions). You *must drop or relax Counterfactual Fidelity*—it’s unrealistically strong for imitation learning. Instead, require *bounded generalization error* via adversarial dataset expansion.

  - **Most Exclusionary Requirement**: **Decomposition Judgeability** rules out the most schemes.  
    *Why*: It invalidates any method where the human overseer cannot directly/easily evaluate critical steps.  
    *Ruled out*:  
    - Pure **debate** (human judges debates but can’t verify complex evidence chains).  
    - Naive **recursive amplification** (if decisive steps like "select citation to check" are unjudgeable).  
    - **Reward modeling** (if comparisons don’t reveal *why* an output is better, missing latent reasoning).

  ---

  ### Scorecard for Proposed Schemes
  1. **Recursive Human-in-the-Loop (HCH)**  
     Fails **Decomposition Judgeability** if decisive steps (e.g., task decomposition) are unverifiable. Moderate **Counterfactual Fidelity** risk.

  2. **Debate**  
     Fails **Decomposition Judgeability** (human can’t validate arguments in complex domains) and **Scaffold Neutrality** (adversarial dynamics distort values).

  3. **Reward Modeling from Pairwise Comparisons**  
     Fails **Rating Sensitivity** (comparisons compress fine-grained quality differences) and **Scaffold Neutrality** (ratings influenced by presentation, not truth).

  4. **AI-Assisted Feedback + Written Rubric**  
     Best among these: addresses **Rating Sensitivity** (rubric structures judgments) and **Scaffold Neutrality** (if rubric captures true values). Still risks **Iterative Convergence** drift (rubric may incentivize "box-checking").

  ---

  ### Analysis of Your Five Failure Modes
  1. **Decisive-Step Problem**  
     *Status*: Desideratum (covered by **Decomposition Judgeability**). Any scheme *must* route around it—else the unsupervised step breaks alignment/competence.

  2. **Prosthetic Values**  
     *Status*: Desideratum (covered by **Scaffold Neutrality**). The scheme needs human-overridable scaffolding and value-aware distillation (e.g., training on "why" not just "what").

  3. **Rating Compression**  
     *Status*: Desideratum (covered by **Rating Sensitivity**). Requires high-resolution ratings (e.g., granular rubrics or pairwise comparisons with Elo scoring).

  4. **Fidelity on-Distribution vs. Counterfactuals**  
     *Status*: Overstrong. **Counterfactual Fidelity** is ideal but infeasible; replace with *generalization via coverage* (amplified system generates diverse edge cases).

  5. **Drift Under Iteration**  
     *Status*: Desideratum (covered by **Iterative Convergence**). Stability and competence growth *can* coexist with regularization (e.g., retaining prior distilled models as anchors).

  - **Smuggled Assumption**: None. All five are valid, distinct failure modes.  
  - **Missing Failure Mode**: **Feedback Loops in Training Data** (e.g., distilled model generates examples for the next cycle, amplifying errors). Addressed by **Iterative Convergence**.  
  - **Shared Hat?**: No—each tackles a unique mechanism (e.g., decisive-step is about decomposition, prosthetic values are about scaffold influence).  

  ---

  ### Bottom Line
  Your pipeline is *viable* if:  
  - You relax **Counterfactual Fidelity** to *generalization with adversarial validation*.  
  - You prioritize **AI-assisted feedback + rubric** (scorecard leader) but enforce **Decomposition Judgeability** (e.g., by designing steps around human-verifiable primitives).  
  - **No scheme fully satisfies all requirements**—**Decomposition Judgeability** is the hardest, and **Scaffold Neutrality** is rarely tested in practice. Proceed with iterative audits using held-out "trap questions" to detect drift.
