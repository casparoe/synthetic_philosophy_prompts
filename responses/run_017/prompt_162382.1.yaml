prompt: |-
  I sit on the committee drafting the ethics guidance for a hospital's preconception and prenatal counseling service — the clinic where prospective parents arrive with a known genetic risk, an abnormal screen, a failed IVF cycle, or simply the question of whether to try at all. Counselors there must say something actionable, inside a consultation, to people who share no particular metaphysics of merely possible people. Before I let any account of the morality of creating people serve as the moral backbone of that guidance, I want to know what I should be asking of it.

  Write me the specification. What must an adequate theory of whether, when, and whom to bring into existence be able to do, if it is to be good enough to generate case-level advice in a counseling room? For each requirement, give the case or consideration that earns it its place on the list. The following are the cases our committee actually argues over; use them, and supply your own wherever a requirement needs a sharper test.

  1. *The delayed cycle.* A couple can conceive this month, with a high chance of a child who will have a painful early-onset condition but a life that child will on balance be glad to have, or wait one cycle and conceive a different child who will very likely not. One person either way; different person.
  2. *The replacement.* Terminate at twelve weeks and re-conceive. The first child's life would have been worth living, but clearly worse than the second's.
  3. *The last embryo.* The only viable embryo will produce a child whose life is predicted to be barely worth living. The alternatives are no child, or adopting a child who already exists.
  4. *The coin flip.* Conceiving now yields, with equal probability, a life of unusual flourishing or a life of severe suffering ending early. On any additive reckoning the expectation is comfortably positive.
  5. *The late-onset result.* A screen shows a condition that will not appear until the person is forty and will then cut short an otherwise good life — a life that the person, once existing, will almost certainly say was worth living.
  6. *The grievance.* The grown child of a parent who knew the risk says: you harmed me by creating me. Is there a coherent complaint here, against whom, and what would count as redressing it?
  7. *The exit corollary.* A patient already exists in the room. If coming into existence is always a net harm, ceasing to exist looks like a net benefit, and a theory that affirms the first while denying the second owes me the difference in principle rather than by stipulation.
  8. *The paused mind.* A person whose existence can be suspended and later resumed — a digital person, or a temporarily suspended one. Here the relevant absence is interruption, not never-having-been. Does the asymmetry between the absence of suffering and the absence of enjoyment survive when non-existence is reversible? This case should force a theory to say whether it is fundamentally about lives, about subjects with futures, or about states of the world.
  9. *The roll-up.* If each act of creation is a harm of modest size, the sum over everyone now alive is enormous and the end of sentient life would be an enormous improvement. Relatedly: a vast number of barely-worth-living lives against a small number of excellent ones, and a slow decline in quality of life across generations that no individual ever notices.

  Some of what people demand in this area is a genuine desideratum and some is the prejudice of a camp. Separate them. In particular, tell me the status of each of the following: that a theory must not imply extinction is a great improvement; that it must not imply any existing person's death is a benefit to them; that it must respect the person-affecting thought that morality concerns improving the lives of people who will exist rather than adding good lives; that it must still be able to condemn creating a life not worth living; that it must still permit creating the lives people ordinarily do create; that it must handle uncertainty, and must say whose standard of worth-living governs — the future person's anticipated own judgment or some external list, with the complication that people often report their own lives as better than observers predict; that it must yield advice without anyone computing total welfare; that its verdicts must not flip on arbitrarily small changes in probability or magnitude; that it must order populations without cycles; that it must be able to hold ordinary pediatric and obstetric care coherent for the practitioners who apply it; and that it must either say something articulate about funding fertility treatment, prenatal screening programs, and pronatalist subsidies, or explain why silence is correct.

  Also give me the hardest part. First: a requirement that the asymmetry be explained rather than asserted — state in your own terms what the asymmetry claims about the four cells of presence and absence of suffering and enjoyment, and say what would have to be true for its rationale to generalize to interrupted existence, to non-human animals, and to minds whose entire life we can specify in advance. Second: mark which requirements are non-negotiable for my purpose and which are negotiable. Third: identify any subset of the requirements you believe cannot be jointly satisfied, and say why — if the list is itself a result, I want that stated plainly. Fourth: tell me which single requirement does the most work in excluding otherwise popular candidates, and, if nothing on offer satisfies the non-negotiable core, what the guidance should say instead.

  Close with a brief scorecard — a few lines each, no more — for: the asymmetry itself; the person-affecting restriction; straightforwardly additive total views; threshold or critical-level views; and the principle that one ought to select, among possible children, the one with the best expected life. Keep the weight on the criteria and their motivating cases rather than on the scoring, and argue from the cases rather than from what anyone has published: assume no library.
reasoning: |-
  Hmm, this is a dense and fascinating challenge. The user sits on a hospital ethics committee drafting guidance for preconception and prenatal counseling, and they're asking for a rigorous specification of what makes an ethical theory adequate for real-world clinical decision-making. They've provided nine complex cases that their committee actually debates, along with a list of theoretical demands that range from genuine requirements to potential biases.

  First, I need to internalize what makes this request unique. This isn't academic philosophy - it's applied ethics where counselors must give actionable advice to people with diverse worldviews. The theories can't just be logically consistent; they must generate clear guidance in emotionally charged consultations. The user wants me to pressure-test ethical frameworks against concrete cases, not abstract principles.

  Looking at the nine cases, they cover brutal dilemmas: timing conception to avoid disease ("Delayed Cycle"), terminating to conceive a healthier child ("Replacement"), using marginal embryos ("Last Embryo"), high-risk conceptions ("Coin Flip"), late-onset conditions, complaints from affected children ("Grievance"), suicide implications ("Exit Corollary"), suspended consciousness ("Paused Mind"), and aggregation problems ("Roll-Up"). Each exposes different weaknesses in ethical theories.

  Then there's the list of demands - some clearly essential for clinical use (like handling uncertainty), others more debatable (like avoiding extinction implications). I'll need to separate what's pragmatically necessary from what's philosophically fashionable. That distinction matters because counselors can't say "the theory is elegant but unusable in your case."

  The hardest parts will be: 1) Explaining the asymmetry (why avoiding suffering seems more urgent than creating happiness) in a way that doesn't collapse in edge cases like suspended minds. 2) Admitting if some requirements conflict - which I suspect they might. 3) Identifying which requirement filters out most theories (probably the person-affecting constraint). 4) Being honest if no theory satisfies all must-haves.

  For the scorecard, I'll focus on how each approach handles the key cases rather than abstract grades. For example: Can the asymmetry explain why we wait one month in "Delayed Cycle" but not feel obligated to create endless happy lives? Does person-affecting views handle "Replacement" without implying the second child "replaces" the first? Do total views avoid monstrous conclusions in "Roll-Up"?

  Throughout, I'll anchor everything to the consultation room. A theory might be brilliant yet fail if it requires calculating total welfare or if its verdicts flip on tiny probability changes. The counselors need robust, actionable frameworks - and if no existing theory works, the guidance might need to acknowledge irreducible tensions rather than pretend there's always an answer.
answer: |-
  Here is the specification for an adequate ethical theory for preconception/prenatal counseling, derived from your cases and requirements. Non-negotiable requirements are marked **(NN)**.

  ### Core Requirements (Motivated by Cases)
  1.  **Handle Non-Identity Problems (Case 1 & 2):** Must resolve whether creating Person A (with a life worth living but with significant burdens) is morally distinct from creating Person B (with fewer burdens/a better life), especially when choosing A *prevents* B from existing. *Case: Delayed Cycle & Replacement.* **(NN)**
  2.  **Differentiate Harm & Non-Benefit (Cases 1, 2, 3, 6):** Must clearly define what constitutes a "harm" in creation. Can it be a harm to create someone with a life *worth living* but worse than an alternative possible person? *Case: Replacement, Last Embryo, Grievance.* **(NN)**
  3.  **Account for the Asymmetry (Cases 3, 8, 9):** Must explain *why* we have a strong duty to avoid creating suffering (a life not worth living) but no symmetrical duty to create happiness (a life worth living or even flourishing). Must examine if this holds for reversible non-existence. *Case: Last Embryo, Paused Mind, Roll-Up.* **(NN)**
  4.  **Handle Uncertainty & Risk Robustly (Case 4 & 5):** Must give actionable advice under significant uncertainty about outcomes. Verdicts must be stable under small probability/magnitude changes and avoid conclusions based solely on expected utility when tails are catastrophic. *Case: Coin Flip, Late-Onset Result.* **(NN)**
  5.  **Provide Coherent Existence/Non-Existence Comparisons (Cases 3, 6, 7, 9):** Must offer a principled way to compare existence (with its goods/bads) vs. non-existence (without goods *or* bads) that doesn't lead to absurd conclusions about death/extinction. *Case: Last Embryo, Grievance, Exit Corollary, Roll-Up.* **(NN)**
  6.  **Respect Person-Affecting Intuitions without Collapse (Cases 1, 2, 6, 9):** Must accommodate the core idea that morality is primarily about affecting *existing or future* people for better or worse, but avoid implying that creating a suffering person isn't wrong (because there's "no one" to harm by *not* creating them) or that creating vast numbers of barely-worthwhile lives is obligatory/benign. *Case: Delayed Cycle, Replacement, Grievance, Roll-Up.* **(NN)**
  7.  **Define "Worth Living" Operationally (Cases 3, 5, 6):** Must specify whose judgment matters (anticipated future person vs. external standard) and how to handle discrepancies between predicted and reported quality of life. *Case: Last Embryo, Late-Onset Result, Grievance.* **(NN)**
  8.  **Be Actionable in the Consultation Room (All Cases):** Must yield concrete advice ("wait one cycle," "consider termination," "use this embryo," "adopt instead") without requiring complex welfare calculations, impossible predictions, or resolving deep metaphysical questions. *Case: All.* **(NN)**
  9.  **Integrate with Existing Medical Ethics (Cases 3, 7, 9):** Must not render standard pediatric care (preventing suffering in existing children) or obstetric care (supporting wanted pregnancies) incoherent or contradictory for practitioners. *Case: Last Embryo, Exit Corollary, Roll-Up.* **(NN)**
  10. **Avoid Repugnant or Absurd Conclusions (Cases 3, 7, 9):** Must not imply extinction is a significant moral improvement, nor that the death of an existing person is typically a benefit *to them*. *Case: Last Embryo, Exit Corollary, Roll-Up.* **(NN)**
  11. **Guide Policy Coherently (Case 9):** Must provide a framework for evaluating fertility funding, screening programs, and pronatalist policies, or offer a clear justification for why it cannot/silence is appropriate. *Case: Roll-Up.*

  ### Status of Demanded Features
  *   **Must not imply extinction is a great improvement:** **(NN)** - Core requirement 10.
  *   **Must not imply any existing person's death is a benefit to them:** **(NN)** - Core requirement 10. Death and non-existence must be distinct.
  *   **Must respect the person-affecting thought:** **Negotiable, but crucial.** Core requirement 6 demands its *core insight* be respected without letting it cause collapse. A theory can modify it (e.g., "wide person-affecting") but cannot abandon the moral relevance of *who* is affected.
  *   **Must still condemn creating a life not worth living:** **(NN)** - Fundamental to the asymmetry (Core 3) and avoiding harm (Core 2).
  *   **Must still permit creating ordinary lives:** **Negotiable.** While intuitive, "ordinary" is vague. The theory must permit creating lives *above* a defensible threshold of "worth living," but need not endorse *all* "ordinary" creation if some carry undisclosed high risks.
  *   **Must handle uncertainty:** **(NN)** - Core requirement 4.
  *   **Must say whose standard governs "worth living":** **(NN)** - Core requirement 7.
  *   **Must yield advice without computing total welfare:** **(NN)** - Core requirement 8 (Actionability).
  *   **Verdicts must not flip on arbitrarily small changes:** **(NN)** - Core requirement 4 (Robustness).
  *   **Must order populations without cycles:** **Negotiable (ideally NN, but hard).** Desirable for coherence, but strict acyclicity might be impossible for complex comparisons. Avoiding gross contradictions (like A>B, B>C, C>A) is essential.
  *   **Must hold ordinary care coherent:** **(NN)** - Core requirement 9.
  *   **Must say something about funding/policy or explain silence:** **(NN)** - Core requirement 11.

  ### The Hardest Part: The Asymmetry Explained
  *   **The Claim:** The absence of suffering is *good* (even if no one exists to experience that good), while the absence of enjoyment is *not bad* (unless someone exists who is deprived). Creating a sufferer harms *that* person. Not creating a happy person deprives no one.
  *   **Rationale Generalization Test:** To generalize to **Paused Mind**: The rationale must show why *interrupting* existence (causing absence of enjoyment) is *not bad* in the same way causing suffering *during* existence is bad. For **Animals**: Must apply if animals have morally relevant experiences/suffering. For **Specified Minds**: Must hold even if we know the life would be happy – we still have no duty to create it.
  *   **Non-Negotiable vs. Negotiable:** Requirements marked **(NN)** above are non-negotiable for clinical guidance. Key negotiable: Strict acyclicity of all population comparisons; absolute requirement to permit *all* "ordinary" creation.
  *   **Conflict:** **Core Requirement 6 (Person-Affecting Insight)** and **Core Requirement 3 (Asymmetry)** create tension with **Core Requirement 5 (Coherent Existence/Non-Existence Comparisons)**. Theories struggle to condemn creating a life *worth living but full of suffering* (via Asymmetry) without implying non-existence is *better* for that person (contradicting requirement 10) or while staying strictly person-affecting (since the person *only* exists if created). *This is the central tension.*
  *   **The Filter:** **Core Requirement 6 (Person-Affecting Insight without Collapse)** excludes the most candidates. Utilitarian Total Views violate it directly. Strict Narrow Person-Affecting views collapse (can't condemn creating suffering if no alternative person is benefited). The Asymmetry itself often seems ad hoc without it.
  *   **If No Theory Satisfies Core:** The guidance should explicitly acknowledge the ethical tensions in specific case types (especially Replacement, Last Embryo, Roll-Up), prioritize avoiding severe suffering/harms over maximizing benefits, emphasize patient autonomy and values (within bounds of avoiding clear harm), and require counselors to disclose the limitations and controversies in the ethical reasoning. Focus on process and disclosure over definitive "correct" answers where core theory fails.

  ### Brief Scorecard (Focused on Core Requirements)
  1.  **The Asymmetry (e.g., Benatar):**
      *   *Strengths:* Easily handles condemnation of creating suffering (Cases 3, 6), explains avoiding "Delayed Cycle" risk, provides clear rationale for asymmetry (Core 3).
      *   *Weaknesses:* Fails Core 10 catastrophically (implies extinction *is* better), fails Core 7 (defines "worth living" externally/contentiously), struggles with Core 6 (abandons person-affecting intuition), makes Core 9 (ordinary care) incoherent (why treat anyone?).
  2.  **Person-Affecting Restriction (Strict Narrow):**
      *   *Strengths:* Satisfies Core 6 (intuition), avoids Core 10 problems (no claim non-existence is better).
      *   *Weaknesses:* Collapses on Core 2 & 3 (cannot condemn creating suffering in "Replacement" or "Last Embryo" if life is "worth living" - no one is *worse off*), struggles with Core 1 (non-identity - choice seems neutral), fails Core 11 (policy silent/ineffective).
  3.  **Straightforwardly Additive Total Views (Classic Utilitarianism):**
      *   *Strengths:* Clear ordering (Core 11?), handles uncertainty via expectation (Core 4), clear on "worth living" (Core 7 - external/aggregate).
      *   *Weaknesses:* Violates Core 3/6 catastrophically (demands creating more lives if net positive, however barely - fails "Last Embryo", "Roll-Up"), violates Core 10 (extinction is bad, but death *can* be net benefit), fails Core 1/2 (strongly prefers "Replacement", indifferent to identity), Core 8 (Actionability) doubtful due to calculation demands.
  4.  **Threshold/Critical-Level Views:**
      *   *Strengths:* Can condemn creating below-threshold lives (Core 2, 3), avoids demanding creation of above-threshold lives (partial asymmetry), potentially handles Core 10 (non-existence not better than existence above threshold).
      *   *Weaknesses:* Setting the threshold is arbitrary and contentious (Core 7). Struggles severely with Core 1 & 2 ("Delayed Cycle" & "Replacement" - why choose B over A if both above threshold? Is replacing A with B a harm to A?). Risk of violating Core 4 if threshold is sensitive. Core 6 (person-affecting) often violated or strained.
  5.  **Select-Best-Expected-Life Principle:**
      *   *Strengths:* Actionable (Core 8), handles uncertainty (Core 4), respects identity in "Delayed Cycle" (chooses B), intuitive for "Replacement" (chooses second child), avoids "Coin Flip" risk.
      *   *Weaknesses:* Fails Core 3 (no asymmetry - indifferent to creating suffering if alternative is non-existence, e.g., "Last Embryo" - adopting is often better). Fails Core 6 (not fundamentally person-affecting). Ignores aggregation/"Roll-Up" problems. May struggle with Core 5/10 justification for non-existence comparison.

  **Conclusion:** No existing theory perfectly satisfies all **(NN)** requirements. The deepest conflict lies between avoiding harm via the asymmetry, respecting person-affecting intuitions, and coherently comparing existence/non-existence. A theory combining a modified person-affecting view (e.g., "wide" or "causing to exist as...") with a strong asymmetry-like principle *avoiding implying non-existence is better* offers the most promise, but remains philosophically contested. Clinical guidance must prioritize avoiding severe suffering, respect autonomy amidst uncertainty, acknowledge theoretical limits, and ensure counselors don't impose contested metaphysics.
