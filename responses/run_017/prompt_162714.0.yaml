answer: |-
  ### Lesson Plan: Money-Pump Argument for Rationality  
  **Dependency Structure**  
  Before drawing the trade cycle:  
  1. **Preference relations** (on board): Define strict preference (\(P\)) and indifference (\(I\)).  
  2. **Transitivity & completeness**:  
     - *Transitivity*: If \(A \succ B\) and \(B \succ C\), then \(A \succ C\).  
     - *Completeness*: For any \(A, B\), either \(A \succ B\), \(B \succ A\), or \(A \sim B\).  
  3. **Cyclic preferences**: Explicitly state the cycle \(A \succ B\), \(B \succ C\), \(C \succ A\).  
  4. **Local vs. global choice**:  
     - *Local choice*: Evaluating each offer in isolation.  
     - *Global plan*: Committing to a strategy for the entire sequence.  
     *Why this contrast is essential first*: The strongest reply (resolute choice) relies on rejecting a locally beneficial trade to avoid global loss. Without this distinction, students cannot grasp the reply’s force.  

  **Core Example**  
  Use **three goods (\(A, B, C\))** with strict preferences \(A \succ B\), \(B \succ C\), \(C \succ A\), and a **penny charged per swap**.  
  - **Why this example?**  
    - **Re-tradeable goods**: Allows the cycle to repeat (e.g., back to \(A\) → pump again), demonstrating indefinite exploitability.  
    - **Unconnected traders**: Shows the problem arises from the agent’s preferences alone, not a malicious exploiter (avoids misattributing the issue to external factors).  
    - **No risk/uncertainty**: Preferences are fixed; outcomes are certain. Isolates intransitivity as the flaw (no "changing tastes" distractions).  
    - **No money in the endpoint**: The penny is a *tool* to model loss, but the core is returning to the same good with less value.  

  **Misconception Map**  
  | Misconception | When Defused | How Defused |  
  |---------------|--------------|-------------|  
  | "Pump shows cyclic prefs are *logically incoherent*." | During cycle setup (Step 3) | Emphasize: It reveals *practical cost* (sure loss), not logical contradiction. |  
  | "Refusing the final trade solves it." | After trade sequence (Step 7) | Show: After Steps 1–2, agent has \(B\) and lost 2 pennies; refusing Step 3 leaves them worse off than start. |  
  | "Requires an exploiter or money." | During trader discussion (Step 5) | Stress: Unconnected traders suffice; money is a proxy for any valued resource (e.g., time). |  
  | "Proves transitivity (full step)." | During transitivity review (Step 1) & endpoint | Clarify: Standard pump only defeats *cyclicity* (not full transitivity); completeness + acyclicity imply transitivity (briefly note). |  
  | "Proves completeness." | Endpoint (Step 11) | State: Pumping an agent with incomplete prefs (e.g., \(A \sim B\)) requires extra premises (e.g., paying to break ties), so it’s a separate argument. |  

  **Final Discussion Question**  
  **"Why would a rational agent refuse the first trade (\(A\) to \(C\) for a penny) if they strictly prefer \(C\) to \(A\) at that moment?"**  
  - *Tests understanding*: Correct answers cite **global planning** ("Avoiding the cycle’s cost outweighs local gain") and reject **local-choice myopia**.  
  - *Incorrect*: "They lose money" (superficial); "They dislike \(C\) later" (prefs are fixed).  

  **What to Explicitly Exclude**  
  - **Resolute choice debate**: Do *not* discuss whether rationality *requires* resolute planning (e.g., Bratman vs. McClennen).  
  - **Representation theorems**: Do *not** link to EU representation (e.g., von Neumann-Morgenstern).  
  *Rationale*: Focus is on the pump’s structure and the planning reply—avoiding tangents that exceed 60 minutes.  

  ---

  ### Session Table (60-Minute Breakdown)  
  | Step | Idea Introduced | Depends On | Misconception Defused | Check for Understanding | Minutes |  
  |------|-----------------|------------|------------------------|--------------------------|---------|  
  | 1 | Review: Transitivity, completeness | Pre-class knowledge | None | Q: "Define transitivity in your own words." | 5 |  
  | 2 | Cyclic preferences (e.g., \(A \succ B\), \(B \succ C\), \(C \succ A\)) | Step 1 | "Cyclic prefs are logically impossible" | Q: "Is this cycle possible if prefs are complete?" (Yes) | 5 |  
  | 3 | Money-pump setup: Agent starts with \(A\) | Step 2 | None | Draw: Agent’s initial state (\(A\)) | 5 |  
  | 4 | Trade 1: Pay penny to swap \(A\) for \(C\) | Steps 2–3 | None | Q: "Why accept? (Local benefit: \(C \succ A\))" | 5 |  
  | 5 | Trade 2: Pay penny to swap \(C\) for \(B\) | Step 4 | "Needs a single exploiter" | Q: "Does it matter if Traders 1 and 2 are strangers?" (No) | 5 |  
  | 6 | Trade 3: Pay penny to swap \(B\) for \(A\) | Step 5 | "Refusing Trade 3 fixes it" | Q: "If refused, what does the agent have?" (\(B\) – 2 pennies, worse than start) | 5 |  
  | 7 | Outcome: Back to \(A\) – 3 pennies | Steps 4–6 | None | Calculate net loss: "Start: \(A\). End: \(A\) – 3p." | 5 |  
  | 8 | Repeatability: Cycle restarts | Step 7 | "It’s a one-time problem" | Q: "What if we run it again?" (Loss compounds) | 5 |  
  | 9 | Local vs. global choice | Steps 4–8 | None | Contrast: "Each trade is rational alone vs. overall disaster." | 5 |  
  | 10 | Strongest reply: Adopt a plan (e.g., refuse Trade 1) | Step 9 | None | Q: "What could justify refusing Trade 1?" | 5 |  
  | 11 | Endpoint: Pump argues for *acyclicity* (→ transitivity w/completeness); reply = planning | Steps 1–10 | "Pump proves completeness" | Q: "Does this pump directly show prefs must be complete?" (No) | 5 |  
  | 12 | Final question: "Why refuse Trade 1?" | Step 10 | Tests depth of planning distinction | Listen for "global cost" reasoning | 5 |  
  **Total** | | | | | **60** |  

  ---

  **Key Delivery Notes**  
  - **Board Work**: Draw the cycle (A→C→B→A) with penny losses at each arrow.  
  - **Pacing**: Use timers; misconceptions often arise at Steps 5 (traders) and 7 (refusal).  
  - **Closer**: Restate the endpoint: "The pump shows cyclic prefs are *exploitable*; the reply is *planning*." No homework—this seeds next week’s discussion on dynamic choice.
