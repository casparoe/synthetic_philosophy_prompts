  We are planning a 60-minute session on the money-pump argument for a second-year philosophy module on rationality. The students have seen expected-utility theory and an informal presentation of the money-pump as an argument for transitive and complete preferences.

  Dependency Structure:
  1. We must have on the board:
     - The concept of preference relations (preferences between options).
     - The definitions of transitivity and completeness for preferences.
     - The idea of a preference cycle: A>B, B>C, C>A (for three options).
     - The setup of sequential choices: a series of offers that individually seem beneficial but lead to a bad outcome when taken together.

  2. Why the contrast between local choice and plan must be in place before the reply:
     - The money-pump argument exploits the fact that an agent with cyclic preferences will accept a series of trades that leaves them worse off (back at the start but having paid money).
     - The standard reply is that the agent can avoid being pumped by adopting a plan (or a resolute choice) that refuses some beneficial trade in the sequence to avoid the cycle. Without introducing the idea of local vs. global (plan) choice, we cannot state the reply.

  Example to build the hour around:
     - Use three goods: A, B, C.
     - Preferences: A > B, B > C, C > A (cyclic).
     - The agent starts with A.
     - Step 1: Offered to trade A for C plus a small payment (say, a penny) to the agent? Actually, the typical setup charges the agent for the swap. So we should say: the agent is offered to trade A for C and pay a penny (so they give up A and pay a penny to get C). But note: if the agent prefers C to A, then they would be willing to pay to switch from A to C? However, in our cycle, the agent prefers A to C? Wait, let's clarify:

     Actually, the cycle is A>B, B>C, C>A. So the agent strictly prefers A to B, B to C, and C to A? That would be a cycle. But note: if the agent strictly prefers A to B and B to C, then by transitivity we would expect A to be preferred to C. But here we have C preferred to A. So the agent has intransitive preferences.

     The standard money pump:
       - The agent starts with A.
       - Step 1: Someone offers to trade A for C. Since the agent prefers C to A, they are willing to pay a small amount (say, 1 penny) to make this trade. So they give up A and pay 1 penny to get C. Now they have C and are down 1 penny.
       - Step 2: Then, someone offers to trade C for B. The agent prefers B to C, so they are willing to pay 1 penny to trade C for B. Now they have B and are down 2 pennies.
       - Step 3: Then, someone offers to trade B for A. The agent prefers A to B, so they pay 1 penny to trade B for A. Now they are back to A and down 3 pennies.

     So they end up with A but having paid 3 pennies. They could have kept A and not paid anything.

     Why the goods need to be re-tradeable? Actually, in the example above, the agent starts with A and ends with A (so they are tradeable). The cycle can be run repeatedly: after Step 3, the agent is back to A and can be offered the same sequence again until they are depleted of money.

     Why successive offers from unconnected people? To avoid the idea that a single exploiter is necessary. The argument works even if each trade is offered by a different person because the agent is making locally rational choices at each step.

     Why no risk, no uncertainty, and no change in preferences? Because we want to isolate the problem as one of intransitivity per se, without confounding factors.

  Misconception Map:

  1. Misconception: The pump shows cyclic preferences to be logically incoherent.
     - Correction: The pump shows that cyclic preferences can lead to a sure loss (practical cost), not a logical contradiction. Head this off when introducing the example: emphasize that the agent is acting in a way that is locally rational at each step but globally disastrous.

  2. Misconception: The agent's ability to refuse the final swap disposes of the problem.
     - Correction: Even if the agent refuses the final swap, they are left with B (after having paid 2 pennies) and still have a preference for A over B. They are still worse off than at the start. Moreover, if they refuse the final swap, they are left with an option they don't like as much as A. But also, if they can foresee the entire sequence, they might refuse the first trade. This leads into the plan vs. local choice.

  3. Misconception: The argument needs an exploiter or needs money.
     - Correction: The argument does not require a single exploiter; unconnected traders will do. Also, the "money" in the pump is just a way to model the loss. We can think of the pennies as a small amount of a divisible good that the agent values. The key is that the agent ends up with the same good but less of the divisible good (or money). Without money, we can have a similar pump with goods that are degraded in each step? But the standard example uses money for simplicity.

  4. Misconception: The argument establishes transitivity, but the standard pump only gets you acyclicity and the extra step for transitivity must be located.
     - Note: The standard money pump with three options and a cycle (A>B, B>C, C>A) shows that the cycle is costly. But transitivity is a stronger condition. Acyclicity requires that there are no cycles, which is what the pump directly attacks. However, transitivity also rules out cycles. So the pump is an argument for acyclicity (and hence for transitivity as a way to achieve acyclicity). But note: the pump does not directly show that if preferences are acyclic they are transitive? That is a separate point. We can leave this as: the pump shows that cycles are costly, so we must avoid cycles. Transitivity is a condition that ensures acyclicity. The pump does not establish transitivity per se, but only that cycles are bad. However, if we require that preferences must be acyclic, then transitivity is one way (and the standard way) to achieve that. But there could be non-transitive but acyclic preferences? Actually, acyclicity is a weaker condition than transitivity. So the pump only argues for acyclicity. We might need an extra step to argue for transitivity? This is a subtle point. We can mention that the pump shows the practical problem with cycles (which are a violation of acyclicity) and hence we require acyclicity. Transitivity is a sufficient condition for acyclicity. But the pump does not force transitivity per se. However, in the literature, the pump is often taken as an argument for transitivity. We can note that the pump directly targets cycles, and transitivity is a way to avoid cycles.

     Alternatively, we can note that if we have a failure of transitivity without a cycle? For example, A>B, B>C, but A and C are incomparable? Then the pump might not apply. So the pump only attacks cycles. Therefore, it is an argument for acyclicity, and then we can say that if we also require completeness, then acyclicity implies transitivity? Actually, no: with completeness, transitivity and acyclicity are equivalent? Not exactly: acyclicity is the absence of cycles, and with completeness and transitivity, we have acyclicity. But without transitivity, we might have acyclicity and completeness. For example, A>B, B>C, and A and C incomparable? But completeness requires that the agent has a preference between A and C. So if we have completeness and acyclicity, we get transitivity? Actually, no: consider A>B, B>C, and C>A? That is a cycle and violates acyclicity. But if we have no cycles and completeness, then we have a weak order? Not necessarily: we might have an interval order or semi-order that is complete and acyclic but not transitive? Actually, without transitivity, we might have a failure: A>B, B>C, but A and C are indifferent? Then it's not intransitive? Actually, that is still transitive because A and C are indifferent. The failure of transitivity is when A>B, B>C, but not A>C (i.e., either C≥A or they are incomparable). But if we have completeness, then we must have either A>C or C>A. If we have acyclicity, then we cannot have C>A (because then we get a cycle A>B>C>A). So if we have completeness and acyclicity, then from A>B and B>C, we must have A>C? So yes, completeness and acyclicity together imply transitivity.

     However, the pump for completeness is separate: if the agent has incomparable options, we can set up a pump by charging the agent to move from one incomparable option to the other and then back? But that requires a different setup.

     We will focus on the cycle for transitivity and then note that a similar pump can be constructed for incompleteness.

  5. Misconception: The pump establishes completeness.
     - Correction: The standard pump is for transitivity. To show that preferences must be complete, we need a different setup: if the agent is indifferent between A and B, then they might pay a small amount to switch from A to B? Why would they? If they are indifferent, they shouldn't be willing to pay to switch. But if they are not indifferent and not comparable, then they might be willing to pay to move to an option that is incomparable? The pump for incompleteness: suppose the agent has A and B incomparable. Then they might be willing to pay a small amount to switch from A to B (because they don't prefer A to B, so they might be willing to pay to try B? But that is not forced). Alternatively, we might set up a sequence: start with A, pay to switch to B, then pay to switch to A? If they are incomparable, they might be willing to pay a little to switch either way? Then they can be pumped. But note: if they are truly indifferent, they wouldn't pay to switch. So the pump for incompleteness requires that the agent is not indifferent but has no preference (so they might be willing to pay a small amount to switch because they don't see a difference? Or because they are unsure? But we are assuming no uncertainty). This is more controversial. We can note that the standard money pump is for transitivity. The argument for completeness is less straightforward and requires additional assumptions.

     Therefore, we will focus on the cycle and transitivity.

  The plan for the session:

  We will build the example step by step, drawing the cycle of trades and showing how the agent loses money. Then we will discuss the replies, focusing on the idea of adopting a plan that refuses one of the trades.

  Endpoint:
     - The money-pump is an argument for acyclicity (and hence, given completeness, for transitivity) of preferences.
     - The strongest reply: the agent can avoid the pump by adopting a plan (being resolute) and refusing one of the trades even though it is locally beneficial.

  One question for the last five minutes:
     - "Suppose the agent, at the start, decides to refuse the first trade (from A to C). They keep A and save a penny. But why, if at the moment of the first trade they prefer C to A and are being offered to pay only a penny to get C, would they refuse? What is the justification they can give to themselves for refusing?"

     This question forces the distinction: locally, the trade is beneficial, but globally, they avoid the cycle. The agent must be able to commit to a plan that overrides the local choice.

  What to refuse to settle:
     - We will leave out the dispute over whether rationality requires resolute choice (i.e., whether it is rational to stick to a plan that requires refusing a locally beneficial trade). We will also leave out representation theorems.

