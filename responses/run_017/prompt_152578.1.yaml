     **Justification:** R2 governs the enactment of proposals during the voting window, so the new rule cannot retroactively validate its own passage because it isn't in force until after the vote concludes (per R1 and R2's function as a power-conferring rule).

  2. **Nadia's first argument (authorization and slippery slope)**  
