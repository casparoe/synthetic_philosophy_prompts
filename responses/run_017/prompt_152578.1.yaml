  ### Proposed Rule to Prevent Recurrence
  To avoid future disputes, propose a mutable rule like:  
  **"M3: For any proposal amending the threshold or procedure for passing proposals, the required vote is the stricter of the threshold in effect when voting begins and the threshold the proposal would establish. This rule applies retroactively to unresolved disputes."**  

  **Why this works:**  
  - It codifies the "intersection test" (see below) explicitly, closing the self-amendment loophole.  
  - It uses "stricter" to preserve entrenchment (e.g., if old requires unanimity and new requires majority, unanimity applies).  
  - Retroactivity resolves current ambiguity (but ensure your group accepts this; if not, omit it).  
  - **Format:** "PROPOSAL: Add M3: [text above]." This only needs a majority under current R2 since it's mutable.

  ### Intersection Test
  - **Is it a real principle?** Yes, it's a recognized interpretive tool in self-amendment contexts (e.g., law or game design) to prevent circularity by requiring a proposal to satisfy both old and new thresholds.  
  - **Is it just Nadia's position?** No—it's a neutral principle, but Nadia's arguments align with it. Here, it would require Joon's proposal to meet both unanimity (old) and majority (new), so 4-2 fails. However, it isn't explicitly in your rules, so it shouldn't be applied retroactively without a new rule.

