  Based on your query, I'll provide a precise principle for distinguishing control measures from non-control measures in your deployment safety case, grounded in your examples and concerns. The principle addresses the core tension between capability-based and dispositional assumptions, focuses on structural guarantees, and is motivated by your cases—especially the pairs (1 vs. 3) and (3 vs. 8). I'll state the principle, apply it to your listed cases and additional ones, identify where it overturns your gut verdicts, and detail the empirical facts that determine the classification.

  ### The Principle: Structural Isolation with Testable Adversarial Robustness (SITAR)
  **Definition:** A measure qualifies as **control** if and only if:
  1. **Isolation of Trusted Judgment**: The trusted component's decision to accept, reject, or modify the untrusted system's output depends solely on:
     - The **input** provided to the untrusted system.
     - The **final output** (or outputs) of the untrusted system.
     - The trusted component's own internal processing (e.g., code, weights, or algorithms that are fixed and aligned).
     - Environmental constraints (e.g., sandboxing, tool limitations) that are physically enforced and immutable during runtime.
  2. **No Reliance on Untrusted Interpretations**: The measure must not use any information from the untrusted system that:
     - Claims to explain, justify, or contextualize the output (e.g., reasoning traces, confidence scores, self-assessments).
     - Reflects internal states not directly tied to the final output (e.g., activations, attention patterns, gradients), unless those states can be *proven* to be necessary and sufficient for verifying the output without dispositional assumptions.
  3. **Testable Adversarial Robustness**: The measure's failure condition must be expressible as a capability threshold of the untrusted system (e.g., "the untrusted system can produce harmful output O only if it can exploit vulnerability V in the trusted component or environment"). This threshold must be empirically testable via:
     - **Red-teaming**: Simulating worst-case adversarial behavior (e.g., using aligned models fine-tuned to attack) to measure the trusted component's robustness.
     - **Stress-testing**: Evaluating if environmental constraints hold under maximum adversarial pressure (e.g., penetration testing).

  **Why this principle?**  
  - **Motivated by your cases**:  
    - Clause 1 (Isolation) resolves the 1 vs. 3 pair: Case 1 uses only input/output and is control; Case 3 uses reasoning (an untrusted interpretation) and is not. This separates evidence about the output (allowed) from evidence from the untrusted system about itself (forbidden).  
    - Clause 2 (No Reliance on Untrusted Interpretations) resolves the 3 vs. 8 pair: Case 3 uses reasoning (output-based interpretation), while Case 8 uses activations (internal-state-based interpretation). Both require assuming the untrusted system isn't manipulating the interpretation, but Case 8's activations are harder to arbitrarily control without affecting output. However, Clause 2 treats them similarly because neither can be verified without dispositional assumptions. Your gut separates them because activations feel "passive," but SITAR groups them as non-control since both are unverifiable interpretations.  
    - Clause 3 (Testable Adversarial Robustness) addresses your "hostile human" test being too strong: It replaces dispositional questions ("Would the adversary sabotage?") with capability questions ("Can the adversary defeat this with known techniques?"), which are testable via red-teaming.  
  - **Why not one step up/down?**  
    - A weaker principle (e.g., allowing any verifiable information) would permit Cases 2/3/8, but these rely on the model not deceiving—a dispositional flaw.  
    - A stronger principle (e.g., requiring the trusted component to be more capable) would invalidate Case 1 (since your trusted monitor is weaker), but Case 1 is structurally sound if robust to tested attacks.  
  - **Cost of accepting SITAR**: You lose measures that feel useful but hinge on unverifiable information (e.g., Case 2) or average-case incentives (e.g., Case 5). However, it provides a clear, worst-case-justified boundary for your safety case.

  ### Verdicts on Your Cases
  Using SITAR, here's how your 9 cases classify (✓ = control; ✗ = not control):  
  1. **✓ Control**: Uses only input, final output, and trusted review. Isolation is structural; robustness is testable via adversarial backdoor tests.  
  2. **✗ Not control**: Reasoning trace is an untrusted interpretation (violates Clause 2). It requires assuming the reasoning is faithful, which is dispositional.  
  3. **✗ Not control**: Relies solely on reasoning (an untrusted interpretation). No independence from the model's honesty.  
  4. **✓ Control**: Uses only inputs and candidate outputs (final artifacts). Selection/minimal edits by trusted component are internal processing. Robustness testable via adversarial candidate generation.  
  5. **✗ Not control**: Output agreement assumes non-collusion across samples—a dispositional assumption. An adversary can sabotage consistently, so failure isn't solely about capability (violates Clause 3).  
  6. **✗ Not control**: Confidence scores are untrusted interpretations (violates Clause 2). Deferring based on them assumes honesty.  
  7. **✗ Not control**: Training for faithfulness is alignment work (violates Clause 1; trusted judgment relies on trained-in honesty).  
  8. **✗ Not control**: Activations are internal-state interpretations. Training on "deceptive" models assumes generalization to novel deception—a dispositional risk. Not isolatable or robustly testable (violates Clause 2).  
  9. **✓ Control (but weak)**: Environmental constraints (e.g., no network) are physically enforced. Failure is capability-based (e.g., "can the model bypass sandboxing?"), testable via penetration testing (Clause 3).  

  **Verdicts overturned**: Your gut classified 2 as "control-ish" and 5/8 as borderline; SITAR forces you to reject all three as non-control. Case 2 violates Isolation (uses reasoning), Case 5 lacks Testable Adversarial Robustness (no failure threshold for consistent sabotage), and Case 8 violates No Reliance on Untrusted Interpretations (activations as evidence).

  ### Additional Cases
  Applied to your unlisted examples:  
  - **Untrusted model writes the monitor; trusted model signs off**: **✓ Control**. Input (monitor specs) and output (monitor code) are verified by trusted component. Robustness testable via adversarial code backdoors (e.g., can trusted model detect hidden exploits?).  
  - **Two untrusted models cross-examine; trusted model judges transcript**: **✗ Not control**. Transcript is an untrusted interpretation (violates Clause 2). Trusted model relies on the debate being faithful, which assumes non-collusion.  
  - **Payment/scoring for caught sabotage**: **✗ Not control**. Assumes the model cares about costs or is deterred—a dispositional incentive (violates Clause 3). No capability threshold for "undetectable sabotage."  
  - **Honeypots (deploy if model declines easy sabotage)**: **✗ Not control**. Relies on the model being "honest" during testing or not strategically deceptive—a dispositional assumption. Failure isn't testable as a capability (e.g., a deceptive model always passes).  
  - **Tripwire with secret trigger**: **✓ Control**. Environmental constraint (runtime halt) is physically enforced. Ignorance of the trigger makes attacks harder, and robustness is testable (e.g., red-team probing for tripwire coverage).  
  - **Untrusted model decides which outputs get audited**: **✗ Not control**. Trusted judgment depends on the model's choice—an untrusted interpretation (violates Clause 2). Assumes it won't hide sabotage.  
  - **Trusted model paraphrases output before review**: **✓ Control**. Paraphrase is a trusted transformation (internal processing); review uses only input and paraphrased output. Robustness testable via adversarial outputs that survive paraphrasing.  

  ### Empirical Facts and Measurement
  SITAR's classification depends on empirical facts about adversarial robustness. These can be measured via experiments over the next few months. The facts and their impact:  

  | **Fact to Measure** | **How to Measure** | **Moves Measure to Control If...** | **Relevant Cases** |
  |---------------------|--------------------|-----------------------------------|-------------------|
  | **Trusted component's false-negative rate on adversarial outputs** | Red-team with aligned models fine-tuned to generate worst-case outputs (e.g., backdoored code, misleading text). Test if trusted monitor detects them. | Rate is low (e.g., <0.1%) under attack. Moves verification-heavy cases (e.g., 1, 4) from "theoretically control" to "empirically robust." | Case 1, 4, monitor sign-off, paraphrase review |
  | **Environmental constraint robustness** | Penetration testing: Simulate adversarial tool use or sandbox escapes. Measure success rate of containment. | Constraints resist >99.9% of attacks. Strengthens weak control (e.g., Case 9, tripwires). | Case 9, tripwires |
  | **Sensitivity of internal states to manipulation** | For activation-based measures: Train probes on deceptive models, then test if they generalize to novel deception strategies or adversarial activations. | Probes detect deception with high reliability (>99%) and resist evasion. *Could* move Case 8 to control, but currently impractical due to generalization challenges. | Case 8 (if adapted) |

  - **Key implication**: Measures like Case 1 or 4 are control only if your trusted monitor's false-negative rate under attack is low. If testing reveals high vulnerability, they fail SITAR's Clause 3. Conversely, Case 5 (resampling) cannot be "fixed" by measurement because its failure (consistent sabotage) isn't a testable capability threshold—it's inherent to the design.

  ### Summary
  SITAR draws the cut point at **structural isolation of trusted judgment from untrusted interpretations**, coupled with **testable adversarial robustness**. It costs you intuitive-but-dispositionally-dependent measures like Case 2 (reasoning-assisted review) and Case 5 (resampling), but provides a worst-case-justified foundation for your safety case. The principle is defensible because:
  - It aligns with your intuition on Cases 1, 3, 4, 6, 7, and 9, while resolving inconsistencies in 2 and 8.  
  - It converts "hostile human" worries into testable capability thresholds.  
  - Empirical measurements (red-teaming, penetration tests) determine real-world viability, ensuring the safety case isn't just theoretical.  

  If your team prioritizes dispositional-risk reduction over strict control, you might layer SITAR-compliant measures with others (e.g., Case 5 for average-case safety). But for your goal—a deployment case that assumes active, deceptive adversaries—SITAR ensures no measure relies on the model "playing nice."
