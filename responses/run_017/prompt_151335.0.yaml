  **Principle (Independent Verifiability):** A measure is control if and only if the trusted components can, using only their own capabilities and the input to the untrusted system, verify the correctness of the output of the untrusted system (or a property of interest) without relying on any additional information provided by the untrusted system that is not itself independently verifiable by the trusted components.

