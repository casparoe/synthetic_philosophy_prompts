  Therefore, we can propose a principle:

  **Principle (Control via Independent Verification):** A measure is control if and only if it provides a guarantee that does not depend on the untrusted system's disposition (e.g., its willingness to be honest, cooperative, or non-deceptive) but only on the capabilities of the trusted components and the constraints of the environment. In particular, the guarantee must hold even when the untrusted system is actively trying to defeat the measure, and the measure must not rely on any information provided by the untrusted system that could be deceptive without being detected by the trusted system.

  More formally:

  A measure is control if it can be broken down into:
  1. **Trusted Components:** Components that are trusted (aligned) and have known capabilities.
  2. **Untrusted Components:** Components that are untrusted (possibly misaligned) and may be actively adversarial.
  3. **Verification Process:** The trusted components independently verify the output or behavior of the untrusted components without relying on any unverified information from the untrusted components. 

  The critical point: the trusted components must form their judgment based only on information that they can independently verify for correctness, or based on the final output of the untrusted system (which they can check for properties of interest) without relying on intermediate representations (like reasoning traces) that might be deceptive.

