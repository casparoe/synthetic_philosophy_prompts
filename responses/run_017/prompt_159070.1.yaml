  Okay, the user is a science columnist dealing with editorial debates about how to handle new studies, particularly surprising ones like a primate cognition result. Their desk is split between running such findings directly versus burying them with replication caveats. Both sides use terms like inside/outside view but lack concrete rules. The user needs a set of requirements (desiderata) for a norm that balances these evidence types, specifically for quick editorial decisions without statistical help. 

  First, I need to unpack the user's explicit needs: They want desiderata that address edge cases like unprecedented results, reference-class shopping, selection bias ("selection shadow"), performativity, heterogeneity within reference classes, and output ambiguity (credence vs. hedge vs. publish decision). They also want each requirement flagged as non-negotiable or contested, with tensions highlighted, and an analysis of why common heuristics fail. 

  The user's deeper needs emerge from their role: They're mediating between colleagues with entrenched positions, so the framework must feel impartial and operationally viable. The "selection shadow" point suggests they're aware of systemic bias in published literature, while "reception sensitivity" shows concern about how readers misinterpret hedging. Their demand for discrimination (no silent rule) hints that they fear overcautiousness stifles science communication. 

  For the desiderata, I'll structure each with: 1) Concrete case making it necessary, 2) How cheating would look. Non-negotiables will center on feasibility (deadlines, auditability) and core functions (handling unprecedented cases, avoiding paralysis). Tensions will arise between Discrimination and Selection Shadow (aggressive discounting kills stories) and between Heterogeneity and Base Rate Use (ignoring mechanistic evidence feels unscientific). 

  Common heuristics will fail mainly on Selection Shadow and Heterogeneity. For example, anchoring on base rates ignores that published rates are inflated by prior enthusiasm. Precision-weighted pooling pretends we can quantify uncertainty we know is corrupted. The key exclusionary requirement is Selection Shadow—it torpedoes any method relying uncritically on historical data. 

  In scoring:  
  - Anchoring fails Selection Shadow and Heterogeneity.  
  - Reference-class forecasting fails Unprecedented Cases and requires advance classes (unrealistic).  
  - Plausibility gates fail Base Rates and Output Ambiguity (mechanism ≠ truth).  
  - Pooling fails Selection Shadow (garbage-in-garbage-out) and Cheapness (requires weights).  

  The framework must acknowledge that some tensions can't be fully resolved (e.g., hedging being misread). The output should clarify that the rule doesn't output credences but editorial actions calibrated to reader impact. 

  Finally, I'll emphasize that no heuristic is perfect, but the desiderata force confronting tradeoffs explicitly—which might be the real win for their desk.
answer: |-
  Here is a set of desiderata for a norm governing the weighting of inside-view (IV) and outside-view (OV) evidence in science journalism, designed for your specific operational constraints. Requirements are categorized, tensions highlighted, and common heuristics scored.

  **Core Desiderata (Non-Negotiable):**

  1.  **Deadline Feasibility:** Must be applied reliably by reporters/editors within one day without specialized statistical expertise or external consultation.
      *   *Why:* Daily news cycle. Concrete case: Breaking study on a controversial topic (e.g., new Alzheimer's mechanism) lands at 3 PM.
      *   *Cheating:* Requiring complex calculations, literature meta-analyses, or expert consultations.
  2.  **Editorial Auditability:** An editor must be able to verify the *process* was followed correctly without needing to re-investigate the specific scientific details (the IV) themselves.
      *   *Why:* Editorial oversight; editor lacks time/expertise to re-report. Concrete case: Editor questions the reporter's assessment of a complex neuroscience result.
      *   *Cheating:* A norm relying solely on the reporter's subjective "gut feeling" about IV quality/plausibility with no traceable OV steps.
  3.  **Discrimination:** Must permit *some* results to be reported firmly and others cautiously/not at all. It cannot default to universal skepticism or universal credulity.
      *   *Why:* Purpose is editorial *decision-making*, not just commentary. Concrete case: Distinguishing between a solidly replicated, predictable finding vs. a wildly surprising, single-lab result.
      *   *Cheating:* A rule that always demands heavy hedging ("more study is needed") or always treats "new" as inherently "news," regardless of context.
  4.  **Output Clarity:** Must produce a clear editorial directive (e.g., "Lead with high confidence," "Bury in paragraph 5 with caveats," "Don't cover") alongside guidance on hedging language *explicitly calibrated for reader reception*.
      *   *Why:* "Credence" ≠ "hedge" ≠ "publish decision"; reader perception differs from writer intent. Concrete case: Knowing a study has a 30% replication chance (credence) doesn't dictate *how* to write the hedge so readers don't misinterpret it as 70% confidence.
      *   *Cheating:* Outputting only a probability estimate without translation to journalistic action/tonality, or ignoring how hedging is systematically misread.
  5.  **Unprecedented Case Handling:** Must provide explicit, non-arbitrary guidance when no clear reference class exists (genuine novelty).
      *   *Why:* Science advances via novelty; "unprecedented" claims arise. Concrete case: First claimed observation of a fundamentally new phenomenon (e.g., room-temp superconductor, entirely new sensory modality).
      *   *Cheating:* Defaulting to "run it big" because it's novel (ignoring OV principles) OR defaulting to "bury it" because novelty implies high prior uncertainty (ignoring IV potential). Permitting the reporter's pre-existing bias to dictate the outcome.

  **Critical Functional Desiderata (Often Contested, But Essential for Integrity):**

  6.  **Selection Shadow Mitigation:** Must explicitly account for the inflation/distortion of published base rates due to publication/press bias favoring surprising, positive results (the "enthusiasm filter").
      *   *Why:* Published literature is the OV data source, but it's contaminated. Concrete case: Base rate for "surprising primate cognition findings" is drawn from studies *that made headlines*, which inherently over-represents false positives.
      *   *Cheating:* Blindly using published base rates without acknowledging/adjusting for this bias. Assuming the published record is a neutral prior.
  7.  **Reference-Class Resolution:** Must provide a rule for choosing *one* reference class when multiple defensible classes yield conflicting base rates. Must specify if the choice needs pre-specification.
      *   *Why:* Reference-class shopping is easy and fatal. Concrete case: Is the primate study part of "animal cognition," "primate cognition," "studies using method X," or "studies led by controversial researcher Y"? Each class has a different failure rate.
      *   *Cheating:* Allowing the reporter to pick the reference class *after* seeing which base rate best suits their desired outcome. Requiring pre-specification without a feasible method to do so under deadline.
  8.  **Heterogeneity Sensitivity:** Must allow strong IV evidence (especially mechanistic) to *override* a discouraging OV/base rate if it convincingly demonstrates *this specific case is an exception* within the reference class.
      *   *Why:* IV exists to identify signal within noisy distributions. Concrete case: A primate study uses an exceptionally rigorous method not typical of the reference class, supported by clear neurophysiological data explaining the result.
      *   *Cheating:* Always rigidly applying the base-rate discount regardless of IV quality, treating the reference class as perfectly homogeneous.
  9.  **Performativity Awareness:** Must acknowledge that adopting the norm *at scale* (e.g., across science desks) could alter the future population (published/press-covered studies) from which base rates are drawn.
      *   *Why:* Norms shape behavior. Concrete case: If desks become universally skeptical of surprising single studies, fewer get published/promoted, artificially lowering future base rates for "surprising findings," creating a feedback loop.
      *   *Cheating:* Ignoring the potential for feedback loops, treating base rates as static natural laws.

  **Key Tensions (Likely Unsatisfiable Simultaneously):**

  *   **Discrimination (3) vs. Selection Shadow Mitigation (6):** Aggressively mitigating selection shadow (e.g., heavily discounting *all* surprising findings) inherently reduces discrimination, potentially burying true breakthroughs. Maximizing discrimination risks amplifying false positives inflated by the selection shadow.
  *   **Heterogeneity Sensitivity (8) vs. Base Rate Use / Editorial Auditability (2, Implicit in OV):** Strongly allowing IV to override OV makes auditability harder (did the reporter *correctly* assess the mechanistic strength?) and weakens the core OV discipline of base-rate respect. Strict base-rate adherence feels unscientific when strong mechanistic IV exists.
  *   **Deadline Feasibility (1) vs. Reference-Class Resolution (7) & Selection Shadow Mitigation (6):** Doing rigorous reference-class selection and adjusting for publication bias properly takes time and expertise, clashing with the 1-day deadline constraint.

  **The Heuristic-Killer Requirement & Scorecard:**

  The single requirement doing the most work in excluding common heuristics is **Selection Shadow Mitigation (6)**. Most popular methods naively assume published base rates are reliable priors.

  *   **Anchoring-and-Adjusting (Start with base rate, nudge based on IV):**
      *   Fails: **Selection Shadow (6)** (Anchors to contaminated rate), **Heterogeneity Sensitivity (8)** (Adjustments are often arbitrary/subjective, not principled overrides), **Output Clarity (4)** (Outputs a vague "adjustment" not a clear directive/hedge).
  *   **Reference-Class Forecasting (Pre-specify class, use its base rate):**
      *   Fails: **Unprecedented Cases (5)** (No class?), **Reference-Class Resolution (7)** (How to pre-specify reliably? Contested classes?), **Selection Shadow (6)** (Ignores contamination), **Deadline Feasibility (1)** (Pre-specification & rigorous class ID is hard under deadline), **Heterogeneity Sensitivity (8)** (Rigidly applies rate).
  *   **Inside-View Gated by Plausibility (Only run if mechanistically plausible):**
      *   Fails: **Base Rates / OV entirely** (Ignores base rates/replication crisis), **Selection Shadow (6)** (Plausibility judgements are *shaped* by the contaminated literature), **Output Clarity (4)** ("Plausible" ≠ "likely true" or "replicable").
  *   **Precision-Weighted Pooling (Average IV and OV estimates weighted by confidence):**
      *   Fails: **Selection Shadow (6)** (Contaminates the OV input), **Heterogeneity Sensitivity (8)** (Pooling assumes homogeneity), **Deadline Feasibility (1)** (Quantifying "precision" reliably is impossible quickly), **Editorial Auditability (2)** (Subjectivity in precision weights), **Output Clarity (4)** (Outputs a number, not an action).

  **Conclusion:** A perfect norm satisfying all desiderata simultaneously is likely impossible due to inherent tensions (especially Discrimination vs. Selection Shadow, Deadline Feasibility vs. rigorous OV). The goal is a *pragmatic, defensible process* that explicitly confronts these tensions and avoids the fatal flaws exposed by Selection Shadow and Unprecedented Cases. Any viable candidate must prioritize Non-Negotiables (1-5), explicitly address Selection Shadow (6) and Reference-Class Resolution (7) even if imperfectly, and acknowledge the limitations imposed by Heterogeneity (8) and Performativity (9). The output must be an *editorial action* calibrated for *reader impact*, not just a probability.
