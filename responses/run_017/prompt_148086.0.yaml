prompt: |-
  I am tutoring a second-year metaphysics tutorial next week: seventy minutes, one whiteboard, and fourteen students who have had a single lecture on identity over time — enough to feel the pull of the puzzle about a thing's apparently incompatible properties at different times, but no exposure to the idea of a temporal part. The topic is endurantism versus perdurantism. I am not asking you to explain the debate to me; I am asking for a plan for how to get them to see what is at issue, and I would like the plan to be specific about the dependencies rather than a list of talking points.

  Please give me the following.

  1. The order in which the components must be introduced, with the dependency behind each ordering decision: what has to be in place before the next move can land, and what specifically goes wrong if it is not.

  2. One concrete object or scenario to carry the whole session, together with an account of what a carrying example for this debate must have and must lack. Say explicitly whether you would reject the Ship of Theseus, a cat that loses a limb, an event such as a game of chess, and a human being, and give the reason in each case — including if you think one of them should be kept.

  3. A map of the misconceptions they will arrive with or will form in the room, and the point in the sequence at which each should be headed off. Two I am confident about: someone will take perdurantism to say that the object is spread out in time the way a road is spread out in space, and someone will conclude that the whole dispute is merely verbal. I also intend to ban the expressions "four-dimensional" and "block universe" from the room for the first forty minutes; tell me whether that helps, what I should use in their place, and what I should do when a student who has read ahead reaches for them anyway.

  4. A check for the last five minutes that tells me whether they have grasped the disagreement rather than merely acquired the vocabulary. I have three candidate questions; tell me which of them actually discriminates between the views, and why the others fail to.

   - If only the last ten seconds of a person's life had ever existed, would that person have existed at all?
   - A relay team wins a race; is the runner who crossed the line the same runner who started it?
   - Could there be a world in which everything that exists exists for exactly one instant, and in which things nevertheless change?

  5. One thing the session should openly decline to explain, and a single sentence I can use to make the refusal feel like a decision rather than an evasion.

  Finally: where in the sequence, if anywhere, should I introduce the third position — that the persisting thing is an instantaneous stage, and that persistence consists in standing in the right kind of series-relation to other stages? Give me your reason for placing it where you do, or for leaving it out entirely. My worry is that in their hands it will either collapse into perdurantism or make the whole debate look like a choice of notation.
reasoning: |-
  Okay, the user is preparing a tutorial on endurantism vs. perdurantism for second-year metaphysics students. They need a structured plan with specific dependencies, a central example, misconception management, and assessment methods. 

  First, I need to consider the students' background—only one lecture on identity over time, so they grasp the basic puzzle but lack technical concepts like temporal parts. The challenge is to make the abstract debate tangible without overwhelming them.

  The user wants a strict sequence where each step builds on the previous. I should start with the core puzzle they know (incompatible properties), then scaffold toward the solutions. Introducing temporal parts too early might confuse them, so that should come later. 

  For the carrying example, the Ship of Theseus is tempting but too messy—it introduces spatial parts and identity questions that derail the temporal focus. A cat losing a limb is better: biological continuity feels intuitive, and the change (losing a leg) is concrete. It avoids spatial decomposition debates and keeps attention on time. 

  Misconceptions are predictable. The "road spread in time" analogy oversimplifies perdurantism by ignoring part-whole relations. The "merely verbal" objection needs preemptive handling by stressing empirical differences like change without contradiction. Banning "4D" and "block universe" terms early is wise—they carry baggage. Instead, use "persists by having temporal parts" for perdurantism. If a student uses banned terms, redirect to the neutral paraphrase. 

  The assessment questions need to discriminate understanding. The "last ten seconds of life" question works best: endurantists must deny the person exists (no enduring subject), while perdurantists can accept it (a short temporal part). The relay question conflates composition with persistence, and the instantaneous world question is too abstract for beginners. 

  Stage theory should come late—after both main views are clear—to avoid collapsing into perdurantism or seeming notational. Present it as a "third way" but flag its distinctness: stages aren't parts, and persistence is relational. 

  Finally, openly deferring quantum persistence shows deeper layers exist without evasion. Say: "That’s a higher-level debate—today we’re mapping the basic landscape." 

  The sequence must be tight: puzzle → endurantism → its challenge → perdurantism → contrast → stage theory. Each step depends on the prior. Skip spatial analogies; stick to temporal change. Use the cat example relentlessly for focus.
answer: |-
  Here’s a structured plan designed to build conceptual dependencies, using a focused example, preempting misconceptions, and validating understanding—tailored to your constraints:

  ---

  ### **1. Order of Components & Dependencies**  
  *(Total: 70 mins; Whiteboard: Sketch cat at t1/t2)*  

  | Step | Content                                        | Time  | Dependency & Rationale                                                                                               | Risk of Misordering                                                                 |
  |------|-----------------------------------------------|-------|----------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | 1    | **Reinforce the Core Puzzle**: "This cat at t1 is healthy; at t2 (post-accident) it’s missing a leg. How can *one* thing have incompatible properties?" | 10m | Must start from their known pain point (lecture content). Establishes *why* we need a theory.                        | Skipping this loses the stakes. Students won’t feel the urgency of the debate.      |
  | 2    | **Endurantism Introduction**: "The cat is *wholly present* at each time. Change is the cat gaining/losing properties over time." | 15m | Requires the puzzle as setup. Shows the intuitive solution.                                                       | If puzzle isn’t vivid, endurantism seems unmotivated.                               |
  | 3    | **Challenge Endurantism**: "But if the cat is wholly present at t1 and t2, how can it be *numerically identical* while having incompatible properties? Is this a contradiction?" | 10m | Needs endurantism defined to attack its weak point (Leibniz’s Law).                                                | Premature challenge confuses; delayed challenge makes perdurantism seem ad hoc.     |
  | 4    | **Perdurantism Introduction**: "Maybe the cat *extends across time* by having temporal parts. The t1-part is healthy; the t2-part is injured. No contradiction!" | 20m | Depends on seeing endurantism’s struggle. Positions perdurantism as a solution.                                    | Introducing too early (e.g., before the challenge) feels like jargon overkill.      |
  | 5    | **Contrast & Consequences**: Side-by-side comparison using the cat: Endurance (one cat, changing properties) vs. Perdurance (cat-stages as parts of a larger "cat-worm"). | 10m | Requires both views defined. Highlights metaphysical divergence (what *is* the cat?). | Without clear definitions, contrast dissolves into "just semantics."                |
  | 6    | **Stage Theory (Ephemeralism)**: "A third view: Only *now* exists. Persistence is stages standing in relations (e.g., psychological continuity)." | 5m | Must come *after* perdurantism to avoid conflation. Emphasize: stages ≠ temporal parts; relations ≠ parthood. | Introducing earlier collapses into perdurantism or trivializes the debate.         |

  ---

  ### **2. The Carrying Example: A Cat Losing a Limb**  
  **Why it works**:  
  - **Must have**: Clear qualitative change (incompatible properties), intuitive persistence (it’s still the same cat), no spatial decomposition (avoiding Ship of Theseus pitfalls).  
  - **Must lack**: Spatial part ambiguity, artifacts with convention-dependent identity (e.g., ships), complex mereology.  

  **Rejected Examples**:  
  - **Ship of Theseus**: Overcomplicates with spatial parts/replacement. Derails into *conventional* vs. *metaphysical* identity.  
  - **Human Being**: Emotionally charged; invites personhood debates (e.g., memory) irrelevant to persistence metaphysics.  
  - **Chess Game**: An *event*, not a *continuant*. Shifts focus to event ontology (processes vs. substances).  
  - **Keep the Cat**: Biological continuity is intuitive; avoids distractions.  

  ---

  ### **3. Misconception Management**  

  | Misconception                          | When to Head Off                     | Strategy                                                                                                |
  |----------------------------------------|--------------------------------------|---------------------------------------------------------------------------------------------------------|
  | "Perduring = spread out like a road"   | During perdurantism intro (Step 4)   | **Preempt**: "Unlike a road’s spatial parts, temporal parts *depend* on their temporal position. A cat’s t1-part couldn’t exist at t2." |
  | "It’s just verbal"                     | After contrast (Step 5)              | **Ask**: "Does endurantism or perdurantism better explain change *without contradiction*? Is the nature of the cat the same?" |
  | **Banning "4D"/"Block Universe"**:     |                                      |                                                                                                         |
  | - **Helps?** Yes. Avoids physics baggage.                                                            |                                      |                                                                                                         |
  | - **Substitutes**: For perdurantism: "persists by having temporal parts"; for endurance: "wholly present at each time." | | |
  | - **If a student says it**: "Let’s unpack that. What do *you* mean by 4D? How would you explain it without those terms?" | | |

  ---

  ### **4. Comprehension Check (Last 5 mins)**  
  **Use this question**:  
  > **"If only the last ten seconds of a person's life had ever existed, would that person have existed at all?"**  
  > - **Why it discriminates**:  
  >   - Endurantist: **No**. The person must *endure* through time; a 10-second slice isn’t a "whole" person.  
  >   - Perdurantist: **Yes**. That 10-second temporal part *is* part of the person’s spacetime worm—it just has no earlier parts.  
  > - **Reject others**:  
  >   - Relay runner: Confuses *composition* (team = parts) with *persistence* (runner R at t1 = R at t2). Both views can answer similarly.  
  >   - Instantaneous changing world: Too abstruse; debates possibility, not core concepts. Endurantists *could* deny change is possible here.  

  ---

  ### **5. One Open Refusal**  
  **Decline to explain**: "How do temporal parts *ground* causal relations or personal identity?"  
  **Sentence**: **"That’s crucial but belongs to advanced metaphysics—today we’re mapping the basic terrain so you can tackle those questions later."**  

  ---

  ### **6. Stage Theory Placement**  
  - **Where**: After perdurantism (Step 6).  
  - **Why**:  
    - If introduced earlier, it conflates with perdurantism (both mention "stages").  
    - Placed last, its key difference is clear: stages are *instantaneous* and persistence is *relational* ("R-related" stages), not parthood.  
    - **Mitigate trivialization**: Stress that ephemeralism denies temporal parts *and* endurance—persistence is *reduced* to causal/mereological relations. "If stages are real, is change an illusion?"  

  ---

  **Summary Flow**:  
  Puzzle (tension) → Endurantism (intuitive fix) → Challenge (problem) → Perdurantism (solution) → Contrast (stakes) → Stage Theory (alternative reduction).  

  This sequence forces engagement with the *metaphysical cost* of each view (e.g., endurance’s Leibniz’s Law issue, perdurance’s ontology of parts) while using a lean example to avoid digressions. The cat’s lost leg is the workhorse.
