  ### Analysis of Precommitment Cases

  Your epistemic-priority rule fails as a complete principle because it cannot reconcile cases where binding occurs despite equal/better later knowledge (e.g., case 6) or where it fails despite epistemic disadvantage (e.g., case 7). It survives only as a *subcomponent* of a broader **Agency-Preservation Principle**:

  **Principle**: *A precommitment is legitimate only if it (a) preserves or enhances the agent’s capacity for reasoned choice across time, or (b) secures essential conditions for democratic self-revision in constitutional contexts. It becomes void if it substantially undermines future agency or blocks reasonable revision of contingent values.*

  ---

  ### Rule Components
  | Clause                                      | Motivated By          | Excludes                          |
  |---------------------------------------------|-----------------------|-----------------------------------|
  | **1. Targets impaired agency** (e.g., addiction, mania) | Cases 1, 4, 16       | Case 5 (stable depression)        |
  | **2. Allows escape for core value shifts**  | Cases 5, 7, 13, 15   | Irrevocable servitude (7)         |
  | **3. Locks only procedural/meta-rights**    | Cases 8, 9, 10        | Entrenched property/religion (9)  |
  | **4. Demands revisable constitutional locks** | Cases 10, 12, 14     | Permanent policy bans (12)        |
  | **5. Requires proportional revision costs** | Cases 2, 3, 10       | Case 2 (absolute lock)            |

  ---

  ### Case Resolution
  | Case | Your Verdict           | Principle Verdict     | Agrees | Note                                  |
  |------|------------------------|-----------------------|--------|---------------------------------------|
  | 1    | Binding                | Binding              | Yes    | Targets impaired agency (Clause 1)    |
  | 2    | Hesitant               | Not binding          | **No** | Absolute lock lacks escape (Clause 5) |
  | 3    | Approve                | Binding              | Yes    | Finite cost respects agency (Clause 5)|
  | 4    | Binding                | Binding              | Yes    | Mania impairs agency (Clause 1)       |
  | 5    | Not binding            | Not binding          | Yes    | Stable values ≠ impairment (Clause 2) |
  | 6    | Binding                | Binding              | Yes    | Penalty preserves contracting capacity|
  | 7    | Not binding            | Not binding          | Yes    | Destroys future agency (Clause 2)     |
  | 8    | Legitimate             | Legitimate           | Yes    | Secures democratic process (Clause 3) |
  | 9    | Illegitimate           | Illegitimate         | Yes    | Locks contingent values (Clause 3)    |
  | 10   | Approve                | Legitimate           | Yes    | Allows persistent majorities (Clause 4)|
  | 11   | Split (approve HR/reject tariff)| Split             | Yes    | HR secures agency; tariffs contingent |
  | 12   | Revisable              | Not permanent        | Yes    | Policy ≠ meta-right (Clause 4)        |
  | 13   | Not binding            | Not binding          | Yes    | Binds core identity (Clause 2)        |
  | 14   | Weakens approval       | Legitimacy decays    | Qualified| Turnover requires lower revision cost |
  | 15   | Deposit forfeit, no enforcement| Deposit only      | Yes    | Core value shift (Clause 2)           |
  | 16   | Expires                | Expires              | Yes    | No impairment; mandates expire        |

  ---

  ### Rejected Candidate Principles
  | Principle                          | Killed By | Why                                        |
  |------------------------------------|-----------|--------------------------------------------|
  | **Epistemic priority alone**       | 6, 7, 14  | No asymmetry in 6; voided despite asymmetry in 7; no "self" in 14 |
  | **Pure proceduralism**             | 9, 13     | Legitimacy depends on *what* is bound (property vs. speech) |
  | **Permanent will-prioritization**  | 5, 15     | Ignores stable value changes               |

  **Epistemic Priority Verdict**: Retained only for *episodic* agency impairment (cases 1, 4). Fails for constitutional cases, value shifts (5, 15), and equal-epistemology commitments (6).

  **One Principle or Two?** A single principle covers both: **preserving agency across time**. Constitutional precommitments are *instrumental* to sustaining collective agency (e.g., free speech enables democratic revision). Personal cases directly safeguard individual agency against self-undermining.

  ---

  ### New Cases Applied
  1. **Living will (30 vs. 85)**: Not binding. Competent 85-year-old’s choice reflects current values (Clause 2).  
  2. **Corporate mission lock**: Legitimate only if the mission is essential to identity (e.g., a B-corp’s ethics). Void if shareholders’ agency is blocked for profit (Clause 3).  
  3. **Reverse lock (later electorate blocked)**: Binding. Persistent majority (two votes) can revise; transient loss of later knowledge is the trade-off (Clause 4).  

  **Confidence**: High (1), Medium (2 – depends on mission content), High (3).

  ---

  **Unresolved Residual**: Quantifying "reasonable revision cost" in demographic turnover (case 14). No principle fixes decay rate – it requires contextual judgment about representational legitimacy and value entrenchment.

