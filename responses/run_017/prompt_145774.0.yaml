prompt: |-
  I'm applying for a 9-month masters-by-research fellowship and need a two-page proposal, due in like ten days. My half-formed idea, which I can't yet make sharp: everyone working on the definition of life seems to treat the question as if there's one concept with a hidden necessary-and-sufficient condition, and then the discussion just trades borderline cases at each other — viruses, sterile mules, dormant seeds, prions, fire, crystal growth, self-replicating robots, computer viruses in a sandbox — until someone declares the concept a cluster concept or a family-resemblance term and everybody goes home. I think that's the wrong diagnosis. My suspicion is that 'alive' is doing three or four seperable jobs that have got collapsed together: (a) a functional/causal job — picking out systems that actively maintain themselves far from equilibrium and resist dissolution; (b) a genealogical job — picking out things that belong to a lineage, i.e. are descended from reproducers and sit inside an evolving population; (c) an evidential job — telling a probe what to measure when you'll never get to dissect the thing; and maybe (d) a moral/legal job — deciding what gets protected, funded, or barred from being patented. My hunch is that every stalemate case in the literature is a case where two of these jobs come apart, and that if you index the question to a job, most of the apparent disagreements evaporate and what's left is a real but much smaller disagreement.

  What I want from you: turn that into a proposal with a question that has a determinate answer, not 'what is life?'. Explain why the standard moves each leave that question open rather than answering it — the usual working definition (roughly, a self-sustaining chemical system capable of Darwinian evolution), deflationary moves like cluster-concept or family-resemblance accounts, autopoietic and information-theoretic accounts, the organism/individuality literature (is a fungal network or a siphonophore colony one individual?), and the 'just stipulate a definition suited to our purposes' move. And say why my approach is better than the obvious alternatives, especially plain conceptual engineering and plain pluralism, since on the face of it my view looks like pluralism with extra steps.

  Also: give me a month-by-month method for 9 months that's actually doable — I won't run experiments, though I'd like the project to say something a person designing a life-detection instrument could use. Invent two or three borderline cases nobody in the literature uses, ideally ones that make a job other than (a) do the work — I was thinking about a large-model AI instance that only exists while a datacenter feeds it power, and a sealed jar ecosystem that's been cycling on its own for a hundred years — and use them as stress tests. Say what the deliverable would be (a paper? a decision procedure for picking a definition for a given purpose? something else?) and, importantly, what would count as the project failing: I definately want to know now if this collapses into 'it's all context-dependent so nothing follows' or into the boring claim that there are just several unrelated words spelled 'life'. Be honest about whether 9 months is too short and what you'd cut. Don't bother with citations, I'll fill those in myself.
