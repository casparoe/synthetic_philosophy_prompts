  Okay, the user is working on a research proposal for a 9-month master's fellowship and needs help refining their idea about defining life. They have a half-formed concept that current definitions of life conflate multiple distinct roles—functional, genealogical, evidential, and moral/legal—leading to stalemates in debates. They want a sharp research question, critique of existing approaches, a feasible 9-month plan, original test cases, and deliverables.

  First, I need to understand their core insight. They believe the impasse in defining life comes from different "jobs" the term serves. Existing approaches treat it as a single concept, but by separating these jobs, disagreements might resolve. The user mentioned avoiding both plain pluralism and conceptual engineering. So I should position their approach as a disambiguation framework rather than just accepting multiple definitions or creating a new one.

  The user wants a determinate research question. Instead of "What is life?", framing it around resolving conflicts through job disambiguation makes sense. The question needs to be specific enough to have a clear answer. Also, they need to show why current methods fail—standard definitions, deflationary moves, autopoiesis, etc.—because they don't address these separate jobs.

  For the methodology, a 9-month timeline is tight. The plan should be realistic: literature review first, then developing the framework, testing with borderline cases (including new ones like the AI instance and sealed ecosystem), analyzing existing debates, and finally writing. The user emphasized not running experiments, so the work is theoretical but should have practical implications for life-detection instruments.

  Creating new test cases is crucial. The AI instance tests the functional job without genealogy, while the sealed ecosystem highlights genealogy without ongoing function. These cases must stress the separation of jobs. Maybe add a third case, like a bioengineered organism with partial functions, to cover all bases.

  Deliverables: A paper seems feasible. The decision procedure could be a flowchart or guidelines for choosing definitions based on context. The user needs to know failure points—like collapsing into relativism or unrelated definitions. Addressing this involves showing that the jobs are interconnected but distinct, and disambiguation provides clarity without eliminating the concept's coherence.

  Assessing feasibility: 9 months is short, but manageable if scope is focused. Cutting deep dives into every alternative approach and omitting extensive moral/legal analysis keeps it doable. The user must prioritize core framework development and key test cases.

  Lastly, ensuring the proposal highlights novelty: new test cases, a structured disambiguation approach, and practical application for instrument design. Emphasize that this isn't pluralism but a diagnostic tool to resolve conflicts, adding value beyond existing solutions.
answer: |-
  Here’s a structured, actionable research proposal based on your insights, designed for a 9-month Master’s-by-Research fellowship. It sharpens your idea, addresses feasibility, and avoids common pitfalls.

  ---

  **Research Proposal: Disambiguating the "Jobs" of "Life": Resolving Stalemates in Biological Definition Through Functional Decomposition**

  **1. Research Question:**  
  *How does disambiguating the distinct functional roles (jobs) served by the concept "life" resolve persistent stalemates in borderline cases, and what framework best guides context-appropriate definitional choices?*

  **2. Core Problem & Hypothesis:**  
  The debate on defining life is mired in intractable disagreements over borderline cases (viruses, prions, etc.). **Hypothesis:** These stalemates arise because "alive" serves multiple distinct *jobs* conflated in discussion. When indexed to specific jobs—(a) **Functional** (self-maintenance far from equilibrium), (b) **Genealogical** (membership in an evolutionary lineage), (c) **Evidential** (detectable signatures for remote observation), and (d) **Normative** (moral/legal standing)—borderline cases cease to be paradoxical. Instead, they reveal *which job is prioritized in a given context*. This framework dissolves false disagreements and clarifies genuine ones.

  **3. Critique of Existing Approaches:**  
  | **Approach** | **Why It Fails to Resolve Stalemates** |
  |--------------|---------------------------------------|
  | **Standard Definitions** (e.g., NASA’s "Darwinian evolution") | Overlooks that borderline cases (viruses, mules) satisfy *some* criteria but not others. Doesn’t acknowledge contextual priorities. |
  | **Deflationary Moves** (cluster concepts, family resemblance) | Correctly identifies fuzziness but surrenders explanatory power. Fails to explain *why* specific features cluster or diverge in borderline cases. |
  | **Autopoiesis/Information Theory** | Addresses (a) but ignores (b)–(d). Prions or crystal growth may fit (a) but lack (b), causing disagreement. |
  | **Organism/Individuality Debates** (siphonophores, fungi) | Focuses on (a) and (b) but treats them as unified. Doesn’t resolve cases where functional integrity and lineage membership conflict. |
  | **Pragmatic Stipulation** ("define for purpose") | Avoids confusion but lacks principles to *guide* stipulation, risking arbitrariness. |

  **4. Your Approach vs. Alternatives:**  
  - **Vs. Plain Pluralism:** This isn’t just "multiple definitions." It’s a diagnostic tool: *why* definitions diverge is explained by job conflict. The framework provides principled reasons for choosing a definition (e.g., an astrobiologist prioritizes (c); an evolutionary biologist (b)).  
  - **Vs. Conceptual Engineering:** You’re not designing a new "correct" definition. You’re mapping existing uses to resolve confusion, making the framework descriptive *and* prescriptive for context.  
  - **Advantage:** Offers a *reasoned pathway* out of stalemates by exposing the root of disagreement (clashing jobs), not just declaring ambiguity.

  **5. Methodology (9-Month Plan):**  
  - **Months 1–2:** **Literature Synthesis & Framework Refinement**  
    - Systematically catalog 15–20 key borderline cases from literature and their disputed features.  
    - Finalize job taxonomy (a–d) and define diagnostic criteria for each.  
  - **Month 3:** **Develop Novel Borderline Cases as Stress Tests**  
    - **Case 1: "Datacenter Organism"** – A large AI model requiring continuous power/input. Functional (a)? Evidential (c) if probed? Lacks genealogy (b).  
    - **Case 2: "Century Jar Ecosystem"** – A sealed, self-sustaining microbial jar. Genealogical (b) and functional (a)? But if dormant seeds dominate, is it "alive" without active metabolism?  
    - **Case 3: **Synthetic Biofilm Consortia** – Engineered communities where some members cannot reproduce alone (challenging (b) vs. (a)).  
  - **Months 4–5:** **Job-Based Analysis of Cases**  
    - Apply the framework to classic and novel cases. Map where jobs align/diverge. Identify which job conflicts drive specific debates.  
  - **Months 6–7:** **Application to Life-Detection & Policy**  
    - Derive principles for instrument design: e.g., prioritizing (c) for exoplanet probes requires proxies for *either* (a) or (b).  
    - Sketch implications for normative debates (e.g., AI rights hinges on (d), not (b)).  
  - **Months 8–9:** **Integration, Writing & Dissemination**  
    - Draft paper; refine decision procedure; outline seminar for astrobiology/ethics audiences.

  **6. Deliverables:**  
  - **Primary:** A journal article (e.g., *Biology & Philosophy*, *Astrobiology*) presenting the framework, analysis of cases, and decision procedure.  
  - **Secondary:** A **"Job-Based Decision Procedure"** flowchart:  
    - Step 1: Identify the *context* (e.g., Mars rover, patent law).  
    - Step 2: Determine which *job* (a–d) is primary.  
    - Step 3: Select definitional criteria matching that job.  
  - **Tertiary:** Workshop for peers on applying the framework to their research.

  **7. Risk Assessment & Feasibility:**  
  - **Failure Mode 1: "Collapses into relativism"**  
    *Mitigation:* The framework *constrains* relativism by tying definitions to objective, context-specific goals. Success = showing stalemates resolve when jobs are explicit.  
  - **Failure Mode 2: "Just multiple homonyms"**  
    *Mitigation:* Demonstrate jobs are *interdependent* (e.g., (b) explains why (a) systems exist). Failure only if no cross-job connections exist.  
  - **Feasibility in 9 Months:** **Tight but achievable.** Cuts:  
    - *No deep dive into all alternative theories* (focus on key representatives).  
    - *Limited original normative analysis* (flag implications but defer full ethics paper).  
    - *Prioritize 2–3 literature stalemates + 2 novel cases.*

  **8. Why This Matters:**  
  - **Theoretical:** Transforms "What is life?" into tractable, job-specific questions.  
  - **Practical:** Guides life-detection instrument design (e.g., if prioritizing (c), detect metabolic byproducts OR genetic material).  
  - **Novelty:** Original framework + stress-test cases (Datacenter, Century Jar) force job disentanglement.

  ---

  **Key Strengths:**  
  ✅ **Sharp Question:** Moves beyond "What is life?" to "How does disambiguation resolve conflicts?"  
  ✅ **Actionable Output:** Decision procedure directly aids life-detection/policy.  
  ✅ **Risk-Aware:** Explicitly addresses collapse into relativism.  
  ✅ **Feasible:** Focused literature work + conceptual analysis fits 9 months.  

  **Next Steps for You:**  
  1. Flesh out novel cases with specifics.  
  2. Identify 3–4 key stalemates in literature (e.g., "Are viruses alive?") as primary targets.  
  3. Sketch the decision flowchart visually.  

  This framework doesn’t "solve" the definition of life—it dissolves the noise so meaningful disagreements stand out. By Month 9, you’ll have a tool to clarify debates and guide practice.
