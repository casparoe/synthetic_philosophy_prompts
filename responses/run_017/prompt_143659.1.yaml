  ### Game Design for Informational Cascades in Social Epistemology

  **Core Objective:** Students experience how rational individuals discard private evidence in sequential decisions, leading to unanimous but potentially incorrect group beliefs, while contrasting this with simultaneous aggregation.

  **Materials & Setup:**
  - **Two paper bags:** 
    - Bag A: 24 red index cards, 12 black index cards (2:1 red:black ratio → P(red) = 2/3 if Bag A).
    - Bag B: 24 black index cards, 12 red index cards (2:1 black:red ratio → P(black) = 2/3 if Bag B).
  - **Deck of cards:** For assigning expert status (optional) or order.
  - **Index cards:** For signals (pre-drawn), guesses, and confidence ratings.
  - **Coin:** To determine true bag.
  - **Whiteboard:** To record sequential guesses, tally votes, and debrief.

  **Signal Quality & Expert Twist:**
  - **Non-experts (21 students):** Draw one card → signal strength = 2/3 chance of correct signal.
  - **Experts (3 randomly chosen students):** Draw three cards → signal = majority color.  
    - Probability of correct signal: ≈80% (calculated via hypergeometric distribution: P(majority correct) = 0.798 for Bag A/B).  
    - Experts are secretly chosen; others don’t know who they are.

  **Key Probabilities:**
  - **Cascade formation:** In sequential round, cascade starts after two consecutive identical guesses. 
    - P(cascade forms) ≈ 100% with n=24 (due to high likelihood of early agreement).  
    - P(wrong cascade) = (1/3)² = **1/9** (if true bag is A, cascade on B requires first two to draw black).  
  - **Accuracy gap:** With n=24, simultaneous voting is 99.9% likely to be correct (central limit theorem). Sequential voting is 88.9% likely to be correct (1 - 1/9).  
  - **Ensuring drama:** Run sequential round once. If no cascade (unlikely with n=24), use the debrief to simulate "what if" using the first two students’ signals. If group is correct, highlight how cascades discard evidence (e.g., show majority private signals vs. unanimous public guess).

  ---

  ### Step-by-Step Rules & Script

  #### **Prep (Before Class):**
  - Pre-fill bags (Bag A: 24 red + 12 black; Bag B: 24 black + 12 red).  
  - Assign random student numbers (1–24) for sequential order.  
  - Pre-select 3 experts via lottery (draw names from deck of cards).

  #### **Round 1: Simultaneous Vote (20 min)**
  **Script:**  
  *"We have two bags: Bag A is mostly red, Bag B is mostly black. I’ve flipped a coin to pick the true bag—but I won’t reveal it yet. Each of you will get a clue about the bag. 3 experts get three clues; others get one. Write your guess (A or B) and confidence (1–5, 1=least confident). No talking!"*

  **Steps:**  
  1. Flip coin (heads→A, tails→B).  
  2. Draw 30 cards from true bag (21 for non-experts, 9 for experts).  
  3. Distribute:  
     - Non-experts: 1 card each.  
     - Experts: 3 cards each → report majority color as their signal.  
  4. Students write guesses/confidence privately. Collect cards and ballots.  
  5. Tally votes on whiteboard. Do **not** reveal truth yet.

  **Management:**  
  - Prevent signal leaks: "Keep your card facedown. Don’t show or discuss."  
  - Quiet students: Hand them materials directly; use numbered ballots for anonymity.  
  - Econ contrarians: Emphasize honesty: "Play as if you genuinely want the right answer."

  #### **Round 2: Sequential Announcement (25 min)**
  **Script:**  
  *"Same bag, new clues. We’ll go in order (1 to 24). Before you guess, consider:  
  - Your private clue.  
  - All prior guesses.  
  Use this rule:  
  1. Net public clues = (# of A guesses – # of B guesses) before you.  
  2. Your net = public clues +1 (if private clue red) or –1 (if black).  
  3. If net ≥ 2, guess A; if net ≤ –2, guess B; else follow your private clue.  
  Announce only your guess (e.g., ‘A’). Write your guess and confidence."*

  **Steps:**  
  1. Redraw 30 new cards from same bag, redistribute as in Round 1.  
  2. Call students in order. Record each guess on whiteboard.  
  3. Collect confidence ratings secretly.  

  **Predictable Issues & Fixes:**  
  - **"I saw black but go with group":** Interrupt firmly: "Only state your guess, not your clue or reasoning."  
  - **Accidental reveals:** Use index cards (not balls); collect cards immediately after viewing.  
  - **Instructor reactions:**** Practice poker face; stare at whiteboard while students speak.  
  - **Econ contrarians:** Prep them pre-game: "Stick to the rule—this is about rationality, not rebellion."  
  - **Quiet students:** Call order in advance: "Student 7, you’re next."  

  #### **Reveal & Debrief (30 min)**
  1. **Reveal truth:** "The true bag was [A/B]. Let’s see your private clues."  
  2. **Public signal tally:**  
     - Non-experts: Hold up one card (red/black).  
     - Experts: Report majority of three cards.  
     - Calculate total red/black signals on whiteboard.  
  3. **Contrast rounds:**  
     - Simultaneous: Show vote tally (likely correct).  
     - Sequential: Show unanimous cascade (possibly wrong).  
     - Highlight: "Same people, same clues, but sequential discarded 22 signals!"  
  4. **Confidence analysis:** Plot confidence vs. position in sequence. Expected:  
     - Early students: Confidence ~3 (moderate).  
     - Cascade starters: Confidence ~4 (high).  
     - Cascade followers: Confidence ~5 (high) despite ignoring signals.  
  5. **Reputational herding check:**  
     - Poll: "If you ignored your clue, was it because:  
       (A) Public clues outweighed yours (rational)?  
       (B) You didn’t want to look dumb (social)?"  
     - Expected: Most vote (A). Clarify: "This model has no social pressure—pure information."

  ---

  ### Debriefing the Concept
  **Map Moments to Theory:**  
  - **Cascade start:** Point to first two identical guesses (e.g., "After two ‘A’s, guess #3 ignored their clue").  
  - **Rational ignorance:** "Student 10 saw black but guessed A because net public=2. This is rational—their clue was too weak to override."  
  - **Wasted evidence:** "22 clues were unused! The group relied only on the first two signals."  
  - **Aggregation failure:** "Simultaneous voting used all clues → correct. Sequential threw clues away → wrong."  
  - **Expert trap:** "Expert at position 20? Their 3 clues (~80% accurate) were overruled by 19 public guesses. If they’d gone first, they might have averted a wrong cascade."

  **What the Game Can’t Show (Prevent Overgeneralization):**  
  | **Students Might Conclude** | **Reality Check** |
  |----------------------------|-------------------|
  | "Cascades always cause errors." | Cascades are often *correct* (P=8/9 here). Focus: They discard evidence. |
  | "Real herding is irrational." | Real herding mixes information (this model) + reputation (e.g., job markets). |
  | "Signals are always independent." | Real clues are correlated (e.g., everyone watches CNN). |
  | "People can’t fight cascades." | Cascades break if late actors get strong signals (experts) or costs change. |
  | "This explains stock bubbles." | Partially, but bubbles involve agency problems, not just information. |

  **Closing Discussion:**  
  - **Do apply:** Review voting, hiring, or diagnoses (e.g., "Why did 5 doctors agree, then all turn out wrong?").  
  - **Don’t overextend:** Caution against equating with social media pile-ons (reputation-heavy) or restaurant queues (signals are observable).  
  - **Big picture:** "Cascades are rational but fragile. They break if private signals are strong (e.g., experts early) or if we design aggregation to avoid queues (e.g., anonymous votes)."

  ---

  **Why This Works:**  
  - **Emotional pull:** Students *feel* frustration as clues are ignored; experts see their "better" info wasted.  
  - **Contrast:** Simultaneous vs. sequential creates visceral "Aha!" moment.  
  - **Low budget:** Uses index cards and bags.  
  - **Robust:** Works even if cascade is "correct" (focus on evidence loss) or broken (discuss fragility).  

  **Running Notes:**  
  - **Time:** Simultaneous (20 min), Sequential (25 min), Debrief (30 min).  
  - **If disaster strikes:** If sequential round has no cascade, simulate: "Imagine the first two saw black. What would #3 do?" Use pre-drawn signals to demo.  
  - **Confidence gap:** With n=24, confidence should rise by 0.5–1 point in sequential vs. simultaneous for followers. Point out: "High confidence ≠ accuracy."  

  This design ensures students confront the paradox: *Rational choices can make groups dumber.* They leave primed to dissect real-world herding—without oversimplifying.
