prompt: |-
  I'm retired — thirty-odd years in marine geochemistry — and in the last couple of years I've started going to a philosophy group at the library, so I may well be asking something that has a settled answer under a name I don't know. Forgive the fumbling.

  For about four years twelve of us have been playing a game by email: nomic, the one where the rules include the rules for changing the rules. I'm the arbiter. If there's a dispute about whether a rule-change was properly made, I rule, and my ruling stands unless it's reversed by a two-thirds vote.

  The bits of our ruleset that matter: (A) a rule-change needs a two-thirds majority of those voting; (B) proposals must be circulated 48 hours before the vote; (C) where two rules conflict, the one with the lower rule number wins; (D) players must comply with the rules in force.

  Rulings I've made, in order:

  1. A rule was passed saying the scoring rule "may never be amended". Ten months later the players repealed it by an ordinary two-thirds vote. I ruled the repeal good: an ordinary rule can't fence off part of the ruleset from a later vote, so the entrenchment had no effect.
  2. A proposal circulated twenty hours before the vote but carried 10–2. I struck it down. The notice rule was in force when it was tabled and I've never accepted substantial compliance.
  3. A proposal redefined "active player" — a term that appears in the quorum rule — and so changed who counted toward quorum. It was properly passed. I ruled it valid, but that the new definition governed later votes only, not the vote that enacted it.
  4. A rule requiring moves to be posted within 24 hours had been ignored by everybody for a year. When someone finally tried to enforce it, I ruled it was no longer in force: nobody had treated it as binding for a year and I wasn't going to resurrect it.
  5. A proposal to scrap the 48-hour notice rule was itself voted on after only 24 hours' notice. It got 9 of 12. I let it through, on the grounds that it had a big enough majority to satisfy the old rule anyway — so the fact that it was also trying to apply its own new procedure to itself was something I didn't have to decide.

  Now the new one. Dave tabled Proposal 61, which does three things: it lowers the amendment threshold to a simple majority of those voting; it says in so many words that this lower threshold applies to the adoption of this very proposal; and it replaces (C) with its opposite, so that where two rules conflict the later-passed one wins. It recieved 7 votes out of 12. That's a simple majority, but two-thirds would have needed 8. Then three rounds were played. Two further proposals were passed under the new simple-majority rule: one adding a bonus-points rule, which everybody has complied with and which decided last month's win; one deleting the 24-hour rule. One player objected in writing to 61 at the time, but has since complied with the bonus-points rule and used it to claim points herself.

  The player who came second under the new scoring — and would have won under the old — now challenges: 61 was never validly adopted, everything hanging off it is void, the win should be recomputed.

  So: what should I rule if I want to be consistent with myself, and which of my earlier rulings is the closest analogue? Ruling 2 and ruling 4 seem to point in opposite directions and I can't tell which one governs. More usefully, tell me what rules my five verdicts are jointly compatible with — I can see something like "validity is fixed by the procedure in force at the moment a proposal is tabled, and a change can't bootstrap itself in", and something like "a rule is in force if the players are actually treating it as in force, so later practice cures an earlier defect", but there may be a third I haven't thought of — and say what each of them predicts here, including about the bonus-points rule. Is there a middle option, where 61 becomes good at some later point without retroactively validating what was done under it? Does the swap of the conflict rule make any real difference — that is, which rule is supposed to tell me whether the old or the new threshold governs? And if my precedents definately don't decide it, tell me what principle I'd be adopting with each choice, and what single further fact or hypothetical case would best tell the candidate rules apart, since I can ask the players for whatever I like. One thing that amuses and worries me: whether my own ruling can be reversed by a simple majority or needs two-thirds depends on the answer — tell me if that's a genuine circularity or just a verbal one.

  Please be straight with me rather than polite. If you think there's no fact of the matter here and it's only ever a question of what we're all prepared to treat as binding, say so. If the question as I've put it is muddled, or if one of my five rulings was simply wrong in a way that makes the rest of this beside the point, say that instead of answering. Keep "this follows from what you've already decided" separate from "this is a coin toss", and give me your rough confidence on each bit. If this family of problem has a name, tell me the name — I'm not after a reading list, the library stopped doing inter-library loans years ago. And British English throughout, please.
reasoning: |-
  Hmm, this retired marine geochemist has a fascinating problem with their Nomic game. They've shared five previous rulings as precedents and now need to rule on Proposal 61's validity, which attempted to lower the amendment threshold to a simple majority while applying that new threshold to itself. 

  The core tension is between procedural rigor (like in Ruling 2 where they struck down a proposal for insufficient notice) and practical acceptance (like in Ruling 4 where they let a rule lapse due to non-compliance). Proposal 61 sits right at this crossroads - it didn't meet the two-thirds threshold required when proposed, but players have since operated under its new rules.

  Looking at their precedents, three principles emerge: 
  First, rules can't entrench themselves against future amendments (Ruling 1). 
  Second, strict compliance with procedural rules is required at the time of proposal (Ruling 2). 
  Third, rules can become invalid through sustained non-use (Ruling 4). 

  The conflict rule change in Proposal 61 adds complexity - it switched from "lower number wins" to "later rule wins," which might affect how we interpret the threshold issue. But since the threshold question arises before this change could take effect, it probably doesn't help resolve the core dilemma.

  For consistency, Ruling 2 suggests striking down Proposal 61 - it didn't meet the procedural requirements in force when proposed. But Ruling 4 hints that subsequent compliance might validate it retroactively. However, there's a key difference: in Ruling 4, the rule was already valid before falling into disuse, whereas Proposal 61 was never procedurally valid initially.

  The most consistent path would be to invalidate Proposal 61 entirely. Its attempt to apply the new threshold to itself violates the principle that rules can't bootstrap their own validity (supported by Ruling 3's stance on non-retroactivity). The bonus-points rule would also fall as derivative, though the 24-hour rule deletion might stand if it wasn't dependent on Proposal 61.

  If they want a compromise, they could rule that Proposal 61 only became valid after the group operated under it for some time - say, after the bonus-points rule was passed. But this creates messy retroactivity issues and contradicts Ruling 2's strict compliance stance. 

  The circularity about whether a simple majority or two-thirds vote can reverse this ruling is more verbal than real - the reversal mechanism exists outside the disputed rules. 

  Ultimately, this exposes a fundamental tension in Nomic: are rules validated by proper enactment or by collective acceptance? Their precedents lean toward the former, suggesting Proposal 61 should fall. But if the group has functionally accepted the new regime, enforcing strict validity might fracture the game. Perhaps the most practical solution is to put the entire package to a new vote under the original rules, allowing the group to consciously ratify or reject the changes.
answer: |-
  Based on your five precedents and the core principles they establish, here's how to rule on Proposal 61 consistently, the closest analogues, and the underlying logic:

  ### Your Ruling Should Be: **Proposal 61 is invalid. All subsequent rules dependent on it (bonus-points rule, deletion of 24-hour rule) are void.**
  - **Reason:** This aligns most closely with **Ruling 2** (strict procedural compliance at tabling) and **Ruling 3** (non-retroactivity of rule changes). Proposal 61 did not comply with Rule (B) (48-hour notice) *and* failed to meet the 2/3 threshold (Rule A) in force when it was tabled. Its self-referential attempt to lower the threshold for itself is bootstrapping, which your precedents reject (Ruling 1: entrenched rules can’t bind future votes; Ruling 3: rules don’t apply to their own enactment).

  ### Closest Analogues:
  1. **Ruling 2 (Primary):** Like the 20-hour notice proposal, 61 violated a procedural rule (2/3 threshold) in force at tabling. You’ve never accepted "substantial compliance" or self-application to bypass existing rules.
  2. **Ruling 3 (Secondary):** The self-application clause ("this lower threshold applies to this proposal") is analogous to redefining "active player" mid-vote. You ruled changes don’t govern their own enactment. 61 tried to do exactly that.

  ### Why Ruling 4 (desuetude) Doesn’t Apply Here:
  - Ruling 4 voided a rule *after* it was validly enacted but ignored. Proposal 61 was **never validly enacted** under the rules at the time. Desuetude cures abandonment, not initial invalidity. Your group *hasn’t* ignored 61’s defect—it’s actively disputed.

  ---

  ### Principles Your Precedents Establish:
  1. **Procedural Rigor at Tabling:**  
     Validity is judged by rules in force **when the proposal is tabled** (Ruling 2).  
     → *Predicts 61 is invalid: needed 8 votes (2/3 of 12) but got 7.*
  2. **No Self-Bootstrapping:**  
     A rule **cannot validate its own enactment** if it violates existing procedures (Rulings 1 & 3).  
     → *Predicts 61’s "this threshold applies to this proposal" clause is void.*
  3. **Non-Retroactivity:**  
     Rule changes govern **future votes only**, not their own adoption (Ruling 3).  
     → *Predicts 61’s conflict rule (C) change can’t affect the threshold for 61.*
  4. **Desuetude Requires Prior Validity:**  
     Rules lapse only if **once-valid and abandoned** (Ruling 4).  
     → *Does not save 61, as it was never valid.*

  **Conflict Rule (C) Swap is Irrelevant Here:**  
  The conflict rule (old vs. new) only resolves clashes *between valid rules*. Since 61 was invalidly passed, (C) never changed. The old rule (lower number wins) still applies, but it doesn’t help here—the threshold dispute precedes (C)’s application.

  ---

  ### What Each Principle Predicts for Bonus-Points Rule:
  - **Procedural Rigor:** Invalid (derivative of invalid 61).  
  - **Desuetude/Consent:** Potentially valid (players complied), but your precedents prioritize procedure over practice (Ruling 2 > Ruling 4).  
  - **Non-Retroactivity:** Invalid (passed under void threshold).  

  **No Stable Middle Option:**  
  If you rule 61 "became valid later," you contradict Ruling 3 (non-retroactivity) and Ruling 2 (strict tabling compliance). Your precedents don’t support "curing" initial defects via subsequent use.

  ---

  ### Circularity in Reversing Your Ruling:
  - **It’s verbal, not genuine.** Your arbitration rule exists *outside* the disputed ruleset. Reversals require 2/3 under **Rule A** (still in force, as 61 is void). A simple majority couldn’t reverse you—this is unaffected by 61’s claims.

  ---

  ### Key Test to Distinguish Principles:
  **Ask:** *"Would a proposal to exempt itself from the 48-hour notice rule, passed with 9 votes after only 24 hours, be valid?"*  
  - Under **Procedural Rigor (Ruling 2)**: No (violates notice rule at tabling).  
  - Under **Consent/Desuetude (Ruling 4)**: Yes (9 votes satisfy both thresholds, and group accepts it).  
    → You ruled this **valid in Ruling 5**, creating tension. To reconcile: Ruling 5 worked because the proposal *met the old threshold anyway*. Here, 61 *failed* the old threshold. **Your consistency test:** A rule can self-apply only if it *already satisfies the old rules*. 61 did not.

  ---

  ### Confidence & Directness:
  - **Invalidating 61:** 90% confidence. Follows directly from Ruling 2 (strict procedure) and Ruling 3 (no self-bootstrapping).  
  - **Bonus-points rule void:** 85%. Derivative of invalid parent rule (per Ruling 3 logic).  
  - **24-hour rule deletion:** Less clear. If proposed *after* 61 but under simple majority, likely void. If proposed under old rules, valid.  
  - **Ruling 5 tension:** 70%. Your exception for proposals satisfying *both* thresholds doesn’t extend to those failing the old threshold.  
  - **No fact of the matter:** True in abstract, but your precedents **are** your law. Stick to them.  

  **Name for this Problem:** "Bootstrapping paradox in self-amending systems" or "Procedural entrenchment." Legal theorists like H.L.A. Hart discuss similar issues, but no common lay term.

  ### Suggested Ruling:
  > "Proposal 61 is void. It received 7 votes, short of the 8 required under Rule A at the time of tabling. Its self-referential threshold change cannot bootstrap validity (per Rulings 1 & 3). The bonus-points rule and deletion of the 24-hour rule, passed under 61’s voided simple-majority threshold, are invalid. Last month’s win is recalculated under pre-61 rules.  
  > **To prevent future disputes:** Proposals may exempt themselves from procedures *only* if they satisfy the rules in force at tabling."

  ---

  **British English Check:** "Tabled," "struck down," "in force," "void," "reckon" avoided—all clear.
