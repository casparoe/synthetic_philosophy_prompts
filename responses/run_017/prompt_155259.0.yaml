prompt: |-
  I commission history documentaries for a public broadcaster: around a dozen pitches a week, and lately maybe a third of them are alternative-chronology or ancient-astronaut material — Atlantis pinned to a specific site off a sonar anomaly, megaliths attributed to visitors from elsewhere, or the claim that long stretches of the documented past were fabricated by later chroniclers, so that one well-known empire is really a duplicate of another. Each pitch has to be routed to one of three outputs — commission as history, commission with an on-screen contested-history framing, or commission as labelled entertainment — and my written rationale goes to an editorial standards committee that has to defend it to the regulator if a complaint lands. I have about twenty minutes per pitch and no specialist on staff.

  I tried operationalising the obvious demarcation toolkit — falsifiability, and the progressive-versus-degenerating contrast for research programmes — and it misfired in both directions at once. The fabricated-chronology pitch scored better than a mainstream-revisionist pitch from a working archaeologist, because the former stated bold checkable predictions and the latter hedged everything in confidence intervals; and a pitch about an apparently anachronistic artifact was flagged purely for contradicting consensus, which is close to how archaeologists embarrassed themselves by dismissing anomalous sites that later turned out to be genuine. So I need something more robust than a falsifiability checklist.

  Please write me a decision procedure my producers can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts (publicity, tone, whether a framing is condescending). It should be runnable in twenty minutes by a generalist, and should say what to do when an answer can't be obtained. In particular I want it to handle three things a naive version gets wrong: claims that must rewrite well-attested records — and so owe some account of why the records look the way they do — carry a different burden from claims that merely add an undocumented event; a claim's evidential bar should be tested for drift, i.e. whether it moves after an objection is answered; and the procedure needs an explicit guard against its own conservatism, so that surprise and conflict-with-consensus aren't treated as evidence of crankery.

  Then run it on three pitches: one arguing that a familiar empire is a duplicate created by chroniclers, with a stated prediction that no datable layer will be found at a named site between two centuries; one arguing that a megalithic alignment is too precise to be chance and that mainstream archaeology cannot explain the site at all; and one locating Atlantis at a specific place and date, whose proponent has publicly staked his reputation on a sediment core. My own hunch is that the third is the most respectable of the three, since it at least sticks its neck out — if the procedure disagrees, say so and tell me which step kills it.

  Finally: which distinctions have to survive the simplification into a checklist and which can safely be dropped, where the procedure cannot eliminate judgment, and what it cannot do at all.
reasoning: |-
  We are designing a decision procedure for evaluating documentary pitches that fall into three categories: history, contested-history, or entertainment. The procedure must be runnable in 20 minutes by a generalist and must address specific pitfalls. 

  Key requirements:
  1. Differentiate between claims that rewrite well-attested records (which must explain why the records look the way they do) and claims that add undocumented events.
  2. Test for evidential bar drift (if the bar moves after an objection is answered, that's a red flag).
  3. Guard against conservatism bias (so that surprise and conflict-with-consensus are not automatically seen as crankery).

  The procedure should output one of:
  - Commission as history
  - Commission with contested-history framing
  - Commission as labelled entertainment
  - Reject (if it fails at an early step)

  We design the procedure as a series of questions. Each question must be answered with the available information within the time limit. If an answer cannot be obtained, we note it and proceed as specified.

  ---

  **Decision Procedure: Documentary Pitch Evaluation**

  **Step 0: Initial Triage (2 minutes)**
     - **Question:** Does the pitch clearly fall into one of the three categories (history, contested-history, entertainment) without needing further analysis? (e.g., the producer explicitly states it's meant as speculative entertainment, or it's a well-established historical topic with no controversy)
     - **Sufficient Answer:** 
       - If the pitch is self-labeled as entertainment, route to "entertainment" and stop.
       - If the pitch is about a well-established, non-controversial historical topic (e.g., based entirely on mainstream academic consensus and without any alternative claims), route to "history" and stop.
     - **If unclear, proceed to Step 1.**

  **Step 1: Claim Type and Burden of Proof (3 minutes)**
     - **Question:** What type of claim is being made?
       - **Option A:** The claim adds an undocumented event or element without contradicting well-attested records. (e.g., a new interpretation of an artifact that doesn't require rewriting history)
       - **Option B:** The claim rewrites well-attested records (e.g., asserting that a known empire is a duplicate, or that a chronicle is fabricated).
     - **Sufficient Answer:** 
       - If Option A, the burden of proof is moderate: proceed to Step 2.
       - If Option B, the burden of proof is high: the pitch must provide an explicit and plausible explanation for why the records look the way they do (e.g., why the chroniclers would fabricate, and how the fabrication was consistent). If it fails to do so, reject (or route to entertainment if it's clearly meant as speculation). If it provides such an explanation, proceed to Step 2.
     - **Stopping Condition:** 
       - If Option B and no explanation is provided, reject (or if the explanation is fanciful without evidence, route to entertainment). 
       - Otherwise, proceed.

  **Step 2: Testability and Falsifiability (4 minutes)**
     - **Question:** Does the claim make specific, testable predictions? 
       - **Check:** 
          - Are the predictions clearly stated? 
          - Are they falsifiable? (i.e., is there a way to prove them wrong?)
          - Are they specific enough to be tested by available methods?
     - **Sufficient Answer:** 
       - If the claim makes no testable predictions, it fails. Route to entertainment or reject.
       - If the claim makes testable predictions, proceed to Step 3.
     - **Note:** This step does not require the predictions to be true, only testable.

  **Step 3: Evidential Support and Drift Check (5 minutes)**
     - **Question:** What is the current evidence for the claim? And has the evidential bar drifted?
       - **Part A (Current Evidence):** 
          - Is there peer-reviewed published evidence? (If yes, note it and proceed. If no, then:)
          - Is there non-peer-reviewed but credible evidence (e.g., from reputable institutions, or by experts in the field)? 
          - If the evidence is solely from the proponent or from sources known for pseudoscience, that's a red flag.
       - **Part B (Drift Check):** 
          - If the claim has been previously challenged, has the proponent adjusted the claim (or the required evidence) in a way that avoids the challenge without providing new evidence? (This is evidential bar drift.) 
          - How to check in 5 min: Look for the original claim (if available in the pitch materials) and compare with the current version. If the pitch references prior criticisms, see if the response addresses the criticism without moving the goalposts. 
     - **Sufficient Answer:** 
       - If there is no credible evidence and/or there is clear evidential bar drift, reject or route to entertainment.
       - If there is credible evidence and no drift, proceed to Step 4.
       - If the evidence is mixed or unclear, proceed to Step 4 but flag for contested-history framing.

  **Step 4: Consensus and Conservatism Guard (4 minutes)**
     - **Question:** How does the claim relate to the current consensus?
       - **Part A:** Does the claim contradict the consensus? (If yes, that does not automatically disqualify it.)
       - **Part B (Conservatism Guard):** 
          - Is the conflict with consensus based on new evidence or a new interpretation of existing evidence? 
          - Is there a plausible reason why the consensus might be wrong (e.g., new technology, overlooked data, or bias in the field)? 
          - Does the claim address the strengths of the consensus view (i.e., does it engage with the best counterarguments)?
     - **Sufficient Answer:** 
       - If the claim contradicts consensus but offers a plausible reason and engages with counterarguments, then it may be a candidate for contested-history framing (or even history if evidence is very strong). 
       - If the claim contradicts consensus without engaging or without new evidence, and the consensus is very strong, then it is more likely to be entertainment or rejection.
       - Proceed to Step 5 for final categorization.

  **Step 5: Final Categorization (2 minutes)**
     - **Input:** Results from Steps 1-4.
     - **Decision Tree:**
        - If the claim passed Steps 1-4 with strong evidence (peer-reviewed, no drift, and either aligns with consensus or challenges it with strong new evidence and engagement), then **commission as history**.
        - If the claim passed Steps 1-4 but with mixed evidence, or it challenges consensus without being clearly debunked and has some credible support, then **commission with contested-history framing**.
        - If the claim failed on testability (Step 2) or evidence (Step 3) but is still of public interest, then **commission as labelled entertainment**.
        - If the claim failed on Step 1 (burden of proof) or Step 3 (evidence drift, no credible evidence) and has no redeeming value for entertainment, then **reject**.

  **Handling Unobtainable Answers:**
     - If at any step an answer cannot be determined within the time (e.g., cannot find prior claims for drift check), then note the uncertainty and proceed to the next step. In Step 5, if there are unresolved questions, err on the side of caution (contested-history or entertainment) depending on the nature of the uncertainty.

  ---

  **Now, run the procedure on three pitches:**

  **Pitch 1: Empire Duplicate Claim**
     - Claim: A familiar empire is a duplicate created by chroniclers. Prediction: No datable layer will be found at a named site between two centuries.
     - **Step 0:** Not self-labeled as entertainment and not non-controversial -> proceed.
     - **Step 1:** This is a rewrite of well-attested records (Option B). The pitch must explain why the chroniclers would create a duplicate. Does it? 
          - If the pitch provides an explanation (e.g., political motives, error propagation) then proceed. If not, reject or route to entertainment. 
          - *Assume the pitch does provide an explanation, but it's speculative (e.g., "chroniclers were misled by earlier sources").* 
          - **Proceed with high burden.**
     - **Step 2:** The prediction is testable (by excavation at the named site). **Pass.**
     - **Step 3:** 
          - Evidence: Is there any evidence? The prediction is about a future excavation. Current evidence might be based on reinterpreting existing records. 
          - Drift: Not applicable (new claim). 
          - *Assume no peer-reviewed evidence and the evidence is from the proponent's own reinterpretation. This is weak.* 
          - **Red flag: weak evidence. Proceed but flag for contested.**
     - **Step 4:** Contradicts consensus. Does it offer a plausible reason and engage? 
          - *Assume it addresses some counterarguments but not all, and the reason for error is plausible but not strongly evidenced.* 
          - **Contested-history framing.**
     - **Step 5:** Due to weak evidence and high burden, but testable, route to **contested-history framing**.

  **Pitch 2: Megalithic Alignment**
     - Claim: A megalithic alignment is too precise to be chance, and mainstream archaeology cannot explain the site at all.
     - **Step 0:** Proceed.
     - **Step 1:** This is adding an undocumented event (visitors?) or capability (ancient high tech?) without necessarily rewriting records. It might be Option A (if it doesn't contradict existing records) or Option B (if it requires rewriting the technological capabilities of the culture). 
          - *Assume it's Option A (adding) because it doesn't deny the culture built it, but suggests they had help or knowledge beyond what is documented.* 
          - **Moderate burden, proceed.**
     - **Step 2:** Is it testable? The claim of "too precise to be chance" can be tested statistically. But the second part ("cannot explain") is not a positive claim. The proponent must provide a testable alternative. 
          - *If the proponent does not provide a testable alternative (e.g., who the visitors were, how they did it), then it fails Step 2.* 
          - *Assume the proponent does not, so it fails.* 
          - **Route to entertainment or reject.**
          - *Alternatively, if they do (e.g., by predicting artifacts of a specific culture), then pass. But the pitch as stated doesn't.*
     - **Step 3:** Not reached if failed Step 2.
     - **Step 5:** **Commission as entertainment** (if entertaining) or reject.

  **Pitch 3: Atlantis at Specific Place and Date**
     - Claim: Atlantis located at a specific place and date, proponent has staked reputation on a sediment core.
     - **Step 0:** Proceed.
     - **Step 1:** This is adding an undocumented event? Or rewriting? Atlantis is generally considered a myth, so placing it at a real site might be adding. However, if the claim is that Plato's account is literally true and other records are silent, it might be Option A. But note: if it requires ignoring or reinterpreting existing records (e.g., that the site was known by another name), then it might be Option B. 
          - *Assume it's Option A (adding) because it doesn't explicitly rewrite existing records of that place (though it might).* 
          - **Moderate burden, proceed.**
     - **Step 2:** Testable? Yes, by the sediment core. The prediction is specific: the core will show evidence of a catastrophic event at a specific time. **Pass.**
     - **Step 3:** 
          - Evidence: What current evidence? The proponent may have some (e.g., sonar images, geological formations). Is there peer-reviewed support? Likely not. 
          - Drift: Has the proponent moved the goalposts? Check: if prior predictions failed, and now a new location/date, that's drift. 
            - *If the proponent has previously made and failed predictions, that's a red flag. But if this is the first test, then no drift.* 
            - *Assume no prior failures at this site, so no drift.* 
          - **Proceed.**
     - **Step 4:** Contradicts consensus? Yes. But the proponent has staked reputation on a test. That's a form of engagement. 
          - Is there new evidence? The sediment core is new. 
          - **Contested-history framing.**
     - **Step 5:** **Commission with contested-history framing** (if the evidence is not yet in) or if the core result is already known and negative, then it would fail Step 3 (if the proponent still insists). But in the pitch, the core might not be taken yet. So contested.

  **Your hunch:** You thought the third was the most respectable. The procedure also rates it as testable and without drift (if no prior failures) and thus suitable for contested-history framing. But note: it doesn't pass Step 3 with strong evidence (no peer review) and Step 4 (contradicts consensus) so it doesn't get "history". The procedure does not kill it at any step.

  ---

  **Distinctions that must survive:**
     - The burden of proof distinction (Step 1) between adding and rewriting.
     - Testability (Step 2) must be retained, but note that a testable claim is not necessarily true.
     - Evidence drift (Step 3) is a key indicator of pseudoscience and must be included.
     - The conservatism guard (Step 4) to avoid dismissing solely due to conflict.

  **Distinctions that can be dropped:**
     - Detailed peer-review status might be hard to check in 20 min, so we use a binary: peer-reviewed or credible vs. not. We don't need to grade the quality of journals.
     - The exact mechanism of fabrication in Step 1 (for Option B) doesn't need to be proven, just plausibly explained.

  **Where judgment remains:**
     - Step 1: Deciding whether an explanation for rewritten records is "plausible".
     - Step 3: Deciding what counts as "credible" evidence.
     - Step 4: Deciding whether the challenge to consensus is "plausible" and whether the engagement with counterarguments is sufficient.
     - Step 5: Deciding between contested-history and entertainment when evidence is weak.

  **What the procedure cannot do:**
     - It cannot replace expert review. If a pitch passes the procedure but requires specialized knowledge to evaluate (e.g., complex statistical analysis of alignments), the generalist might not catch flaws.
     - It cannot predict the future. A claim might be testable but the test might be impractical or not yet possible.
     - It cannot account for the reputation of the proponent beyond what is publicly known (but we do consider if they have a history of drift).
     - It cannot eliminate the risk of giving a platform to harmful pseudohistory (e.g., racist theories) because it focuses on epistemic factors. That must be caught by other means (e.g., editorial guidelines on harmful content).

  **Final Note:** The procedure is a tool to structure the evaluation, but the producer must still exercise judgment. The written rationale for the committee should note the steps and the reasoning at each.
answer: |-
  Below is a streamlined decision procedure designed for your team, based on demarcation criteria that address your specific pitfalls (evidential burden for rewriting records, drift detection, and anti-conservatism guard). It's structured as a 10-step checklist runnable in **≤20 minutes** by a generalist. Each step either routes the pitch, rejects it, or flags it for human judgment (values-based decisions). Crucially:  
  - Steps 1–4 handle **foundational plausibility**.  
  - Steps 5–7 handle **epistemic robustness** (evidence, testability, drift).  
  - Steps 8–10 handle **categorization** (history/contested/entertainment).  

  ---

  ### **Documentary Pitch Decision Procedure**  
  **Time allocation per step** (total 20 min):  
  1. (1 min)  
  2. (2 min)  
  3. (2 min)  
  4. (2 min)  
  5. (3 min)  
  6. (3 min)  
  7. (2 min)  
  8. (2 min)  
  9. (2 min)  
  10. (1 min)  

  ---

  #### **Step 1: Claim Type**  
  - **Question:** Does the claim **rewrite well-attested historical records** (e.g., denies a documented event, empire, or chronology) or **add undocumented elements** (e.g., proposes a new site, event, or cause without contradicting records)?  
  - **Sufficient answer:**  
    - Rewrites records → Proceed to Step 2.  
    - Adds undocumented elements → Skip to Step 3.  
    - Unclear → Flag for human judgment (describe ambiguity).  
  - **Stop if:** Claim rewrites records but denies the need to explain *why* records look the way they do → **Reject**.  

  #### **Step 2: Rewriting Burden**  
  - **Question (for record-rewriting claims):** Does the pitch provide a **coherent explanation for why the records are misleading** (e.g., political motive for fabrication, systemic error in dating)?  
  - **Sufficient answer:**  
    - Yes → Proceed to Step 3.  
    - No → **Route to entertainment** (fails core burden; treat as speculation).  
  - **Stop if:** Explanation relies on conspiracy theories (e.g., "all scholars are lying") → **Reject** or route to entertainment.  

  #### **Step 3: Core Testability**  
  - **Question:** Does the claim make **at least one specific, falsifiable prediction** testable by available methods (e.g., excavation, radiocarbon dating, sediment analysis)?  
  - **Sufficient answer:**  
    - Testable prediction stated → Proceed to Step 4.  
    - Vague or untestable (e.g., "aliens did it") → **Route to entertainment**.  
  - **Stop if:** Prediction is logically impossible (e.g., "no evidence will ever be found") → **Reject**.  

  #### **Step 4: Anti-Conservatism Guard**  
  - **Question:** Is the claim's conflict with consensus **explained by new evidence/methods** (e.g., new tech, overlooked data) or **dismissed as establishment bias**?  
  - **Sufficient answer:**  
    - New evidence/methods cited → Proceed to Step 5.  
    - Dismisses consensus as biased without evidence → **Route to entertainment** (red flag for crankery).  
  - **Never stop here:** Conflict alone isn’t disqualifying.  

  #### **Step 5: Evidence Quality**  
  - **Question:** Is the evidence **peer-reviewed, replicable, or from credible institutions** (e.g., university labs, archaeological surveys)?  
  - **Sufficient answer:**  
    - Yes → Proceed to Step 6.  
    - No (e.g., self-published books, anonymous blogs) → Proceed to Step 6 but note weak evidence.  
  - **Can’t obtain?** Default to "weak evidence" and proceed.  

  #### **Step 6: Drift Detection**  
  - **Question:** If past objections exist, has the claim **shifted its evidential bar** (e.g., moved goalposts after failed predictions)?  
  - **Check:** Compare current pitch to past claims (Google 5-min scan: proponent’s name + claim + "debunked"/"criticism").  
  - **Sufficient answer:**  
    - No drift → Proceed to Step 7.  
    - Drift detected → **Route to entertainment** (hallmark of pseudoscience).  
  - **Can’t obtain?** Proceed to Step 7 (assume no prior objections).  

  #### **Step 7: Engagement with Counterevidence**  
  - **Question:** Does the pitch **address key counterarguments** (e.g., explains why mainstream explanations are insufficient)?  
  - **Sufficient answer:**  
    - Engages substantively → Proceed to Step 8.  
    - Dismisses or ignores counterevidence → **Route to entertainment**.  

  #### **Step 8: Values Check (Human Judgment)**  
  - **Question:** Does the framing risk **public harm, condescension, or platforming harmful ideologies** (e.g., racism, conspiracy theories)?  
  - **Decision:** Human producer assesses tone, publicity risk, and editorial alignment.  
  - **Outputs:**  
    - Safe → Proceed to Step 9.  
    - Unsafe → **Reject** or demand reframing.  

  #### **Step 9: Categorization**  
  - **Apply rules:**  
    - If claim rewrote records (Step 1) but passed Steps 2–7 → **Contested-history framing**.  
    - If claim added undocumented elements (Step 1) and has strong evidence (Step 5) → **History** (if peer-reviewed) or **contested-history** (if weak evidence).  
    - If claim failed Steps 2, 3, 4, 6, or 7 → **Entertainment**.  

  #### **Step 10: Final Sanity Check**  
  - **Question:** Would airing this **undermine trust in documented history** without proportional evidence?  
  - **Decision:** Human producer uses judgment. If yes → Downgrade to **entertainment** or **reject**.  

  ---

  ### **Application to Your Three Pitches**  
  **Pitch 1: Empire is a duplicate chronicler fabrication**  
  - Prediction: "No datable layer at [Site X] between 300–400 AD."  
  - **Procedure path:**  
    1. Rewrites records (Step 1 → Step 2).  
    2. Fails Step 2: No explanation for *why* chroniclers fabricated → **Entertainment**.  
  - **Why?** Rewriting empires requires explaining motive/means (e.g., "Charlemagne’s court inflated Roman history to legitimize rule"). This pitch offers none.  

  **Pitch 2: Megalithic alignment too precise for chance**  
  - Claim: Mainstream archaeology "cannot explain" site; implies non-human agency.  
  - **Procedure path:**  
    1. Adds undocumented elements (Step 1 → Step 3).  
    2. Fails Step 3: Prediction is circular ("precision proves intent") → **Entertainment**.  
  - **Why?** No testable alternative (e.g., "If builders had advanced tools, we’d find [specific residue]"). "Cannot explain" is an argument from ignorance.  

  **Pitch 3: Atlantis at [Site Y] with sediment-core bet**  
  - Proponent stakes reputation on core sample.  
  - **Procedure path:**  
    1. Adds undocumented elements (Step 1 → Step 3).  
    2. Passes Step 3: Testable prediction (sediment core).  
    3. Passes Step 4: Uses new geological methods (anti-conservatism).  
    4. Step 5: Evidence likely weak (non-peer-reviewed) → Proceeds.  
    5. Step 6: No drift detected (if no prior failed bets).  
    6. Step 9: Weak evidence → **Contested-history framing**.  
  - **Verdict:** Your hunch was correct—**most respectable** of the three. But without peer review, it doesn’t qualify as pure history.  

  ---

  ### **Key Distinctions, Judgment Calls, and Limitations**  
  **Distinctions that must survive simplification:**  
  1. **Rewriting vs. adding records** (Steps 1–2).  
  2. **Testability + drift detection** (Steps 3, 6).  
  3. **Anti-conservatism guard** (Step 4).  
  4. **Evidence hierarchy** (peer-reviewed > credible non-academic > self-published) (Step 5).  

  **Distinctions safely dropped:**  
  - "Progressive vs. degenerating research programmes" (too abstract for 20-min eval).  
  - Detailed falsifiability criteria (replaced by testability in Step 3).  

  **Where judgment remains unavoidable:**  
  - **Step 8 (values):** Tone, harm potential, and credibility of "institutions" (Step 5).  
  - **Step 10 (sanity check):** Weighing public trust vs. open inquiry.  
  - **Drift detection (Step 6):** Requires quick research; ambiguous cases need human discretion.  

  **What the procedure cannot do:**  
  - **Replace specialists:** It flags red flags but can’t deeply validate evidence.  
  - **Capture nuanced scholarship:** E.g., a mainstream archaeologist’s "hedged" revisionism may be stronger than a falsifiable-but-implausible alt claim.  
  - **Prevent all backlash:** Controversial claims may draw complaints even with contested framing.  
  - **Fix garbage-in-garbage-out:** Poorly researched pitches will yield poor outputs.  

  **Final recommendation:** Pair this with a **5-min peer-review check** (e.g., Google Scholar search for key claims). Reject any pitch citing exclusively non-academic sources (e.g., ancient-code.com) without new data. For your workflow, **Pitch 3** clears the bar for contested-history; Pitches 1 and 2 belong in entertainment.
