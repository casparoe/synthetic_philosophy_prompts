  Okay, the user is preparing for a Q&A session after a seventy-minute talk on their "relational answerability" theory at a law-philosophy workshop. They want a prep sheet focused on anticipated objections from their specific audience—not a defense of the theory itself. The audience includes criminal law scholars (retributivists and excuse specialists) and philosophers (incompatibilists, reasons-responsiveness compatibilists, and experimentalists). 

  First, I need to identify the core tensions. The user's view rejects desert entirely—this will enrage the retributivists. It also frames responsibility as purely relational/practice-based, which the incompatibilist will dismiss as changing the subject. The excuse scholars will question how it handles doctrinal nuances like duress, while the experimentalists will cite folk intuitions about alternative possibilities. 

  The user’s third step—manipulation arguments as relationship-damage rather than agent-damage—is their strong suit, but I should stress-test it. For example: what if manipulation *enhances* the relationship (e.g., brainwashing someone to be hyper-deferential)? Does the theory still condemn it? That might unravel their view. 

  I’ll structure the response by:  
  1. Opening with the deadliest objection (probably the retributivist’s "desert is irreducible" claim, since it attacks the heart of their project).  
  2. Walking through each likely question in sequence, mirroring the workshop’s dynamics.  
  3. For each objection:  
     - Phrase it in the questioner’s voice (e.g., the Pereboom-style incompatibilist: "This is just evasion!").  
     - Give a concise 2-minute rebuttal.  
     - Flag where the reply is weak (e.g., "This dodges the metaphysics").  
     - Judge if it’s survivable or damaging.  
  4. Advise upfront concessions (e.g., "Yes, this view *does* abandon desert—deliberately").  
  5. Highlight the make-or-break reply (likely the functional claim about practices working without desert).  
  6. End with the nightmare question (e.g., "Isn’t this just Scanlon with extra steps?").  

  The tone should match their request: prose-heavy, no bullet points, like an email to a colleague. Need to resist my instinct to systematize—this is about flow, not rigor.
answer: |-
  Here’s how I’d prep you, based on that room. The objection that’ll hurt most comes from the retributivist criminal law scholars, because when they say “You’ve erased the *point* of holding people responsible,” they’re attacking the perceived moral core of the practice you’re trying to save. If they convince the room your view is morally empty, you lose.

  Start by conceding upfront: "Just to frame this, I fully grant that my view *abandons* desert as a metaphysically robust, backward-looking basis for blame or punishment. I’m arguing we can and should keep the practice while jettisoning that specific justification, because the practice’s real work is forward-looking and relational." This disarms the inevitable “But you’ve killed desert!” shouts early.

  The first question will likely be from the strongest retributivist: **"If blame isn’t fundamentally *deserved* because the agent *did wrong*, but is just a tool for social coordination, doesn’t that reduce holding people responsible to mere manipulation? It feels like you’ve stripped the moral gravity out – the part where we say ‘What you did was *truly* awful, and you *own* that.’ Your answerability seems bloodless."**  
  *Your reply:* "The moral gravity isn't lost; it's relocated. Saying 'What you did was truly awful' isn't about invoking cosmic desert. It's a demand for acknowledgment *within our shared normative framework*, essential for repair and maintaining mutual respect. The 'awfulness' is real because of the damage to the relationship and the norms we uphold. The gravity is in the relational rupture, not in a metaphysical debt."  
  *Soft spot:* This doesn't fully satisfy the deep intuition that *the agent themselves* must metaphysically *merit* the negative response. They’ll feel you’ve changed the subject. *Verdict:* Survivable but tense. The retributivists won’t buy it, but others might see the distinction.

  Next, the Pereboom-style incompatibilist: **"This doesn't solve the hard problem; it dodges it! You’ve shifted from asking 'Is the agent *ultimately* responsible in a way that makes *deserved* blame/punishment fair?' to 'Does this social practice work?' That’s changing the subject. The deep worry about manipulation or determinism undermining *true* ownership isn’t addressed by saying the relationship is damaged – it shows the relationship *itself* might be systematically unjustified!"**  
  *Your reply:* "I agree I’m not answering the metaphysical worry head-on. I’m arguing that worry is misplaced because it presupposes desert is the core of the practice. Once we see the core function is answerability within a norm-governing practice, the ‘true ownership’ question fades. The manipulation worry becomes internal: does *this* demand, in *this* context, respect the norms of the practice itself (e.g., was coercion involved?), not whether the agent has some impossible ultimacy."  
  *Soft spot:* This *is* an evasion of the deepest metaphysical challenge. You’re offering a different paradigm, not refuting theirs. *Verdict:* Damaging if the room wants metaphysics. Your survival hinges on convincing them the desert-based question is the wrong one to ask. This is where your "conceptual ethics" move *must* land.

  Then, the reasons-responsiveness compatibilist: **"Okay, answerability is relational. But surely an agent needs *some* intrinsic capacities to even participate meaningfully in this practice? If someone is utterly delusional or lacks all impulse control, they can’t ‘answer’ demands. Doesn’t this smuggles back in something like reasons-responsiveness as a necessary condition?"**  
  *Your reply:* "Absolutely, capacities matter pragmatically. The practice presupposes agents who can *generally* understand demands, recognize norms, and offer intelligible replies. Severe delusion or incapacity means they can't *function* within the exchange. But this isn't a *desert base*; it's a *condition of participation*. We excuse them not because they lack some ultimate responsibility property, but because engaging them in the answerability practice is futile or cruel under those conditions. Doctrine already does this (e.g., insanity)."  
  *Soft spot:* This risks blurring into a capacity-based view. You need to insist the capacity is for participation in the *relationship*, not for being the 'source' in a metaphysical sense. *Verdict:* Answerable and a chance to clarify. Concede the point about necessary capacities but stress its functional, not metaphysical, role.

  One of the excuse/mitigation scholars will pounce: **"You say manipulation damages the relationship, and that's why law excuses coercion. But what about cases where the relationship *isn't* obviously damaged? Take provocation: the killer *was* answerable (they understood the wrong), but we mitigate because of the extreme emotional pressure. Or chronic diminished capacity – the relationship exists, but is strained. How does your purely relational view handle these gradations without something internal to the agent?"**  
  *Your reply:* "The relationship *is* damaged or altered in these cases. Provocation shows the demand for conformity was met with a reason (however flawed) rooted in an extraordinary situational breakdown of the norms *governing* the relationship itself. Mitigation acknowledges the demand to conform was made under uniquely destabilizing conditions *within the relational context*. Diminished capacity represents a chronic impairment *to participating fully* in the standard demands of the relationship, warranting adjusted expectations. The 'internal' state matters because it impacts the *interaction*, not as a standalone desert modifier."  
  *Soft spot:* This stretches "relationship damage" thin. Does *every* excuse condition neatly map onto a relational dysfunction? Maybe not perfectly. *Verdict:* Answerable with effort. Lean hard on your functional claim about what excuses *do* in practice (signal norm boundaries, adjust expectations).

  The experimental philosophers will tag-team: **"Our data shows people strongly withdraw attributions of responsibility in manipulation cases *and* cite lack of alternative possibilities. If folk intuition anchors responsibility in APs or sourcehood, doesn’t your relational view just ignore what people actually value? Isn’t your 'worth wanting' argument undermined if folks want leeway/sourcehood?"**  
  *Your reply:* "Folk intuitions are crucial data, but they’re also messy and influenced by implicit theories. My claim isn’t descriptive psychology; it’s normative conceptual ethics. We should want a concept that serves our demonstrable social needs best, even if it refines folk views. Crucially, folk reactions *also* track relational factors! They excuse coercion – a relational disruption. The 'alternatives' intuition might often be a proxy for concerns about fairness of the demand or lack of a real opportunity *within the situation*, which my view captures."  
  *Soft spot:* This dismisses the potential normative weight of widespread intuition. You risk sounding elitist – "I know what's best for you." *Verdict:* Survivable. Emphasize that refining concepts based on practice’s function is normal.

  Now, attacking your strong point (Step 3 - Manipulation): **"You say manipulation arguments work because they damage the relationship, not the agent. But imagine sophisticated, undetectable manipulation that *enhances* the relationship – makes the agent *more* attentive to norms and *better* at giving answers. Your view seemingly couldn't object, as the 'relationship' is fine. Yet, intuitively, this is a deep violation undermining responsibility!"**  
  *Your reply:* "This is sharp. My response is twofold. First, such manipulation fundamentally violates the norms of mutual respect *internal* to the practice – it treats the agent as a tool, not a genuine participant. Second, it undermines the practice's core function: transmitting *genuine* norms and coordinating *authentic* expectations. If the norms followed are secretly the manipulator's, not the community's, the practice is corrupted. The 'relationship' is deeply damaged by being rendered inauthentic."  
  *Soft spot:* This relies heavily on contested notions of "authenticity" and "genuine" participation, which need more fleshing out. It’s your best counter, but it shows the limits of *purely* relational talk without some implicit norm about agent integrity. *Verdict:* The strongest attack here. Your reply *must* invoke the corruption of the practice’s function and its internal norms. If it feels ad hoc, you’re vulnerable.

  The question you hope nobody asks is from the sharpest philosopher, synthesizing points: **"Isn't this just Scanlon's contractualism about blame, stripped of his richer moral framework, and then presented as a solution to free will? You talk about 'norms we uphold' and 'mutual respect,' but without Scanlon's substantive principles of justifiability, or Watson's deeper second-personal authority, your 'practice' feels unanchored. What *grounds* the norms governing this practice, and why should we care about maintaining *this specific* relational status if not because it reflects some prior, intrinsic value of agency that your view explicitly rejects?"**  
  This exposes the deepest vulnerability: the potential circularity or thinness of the normative foundation for your "practice." If the practice isn't grounded in something like the value of autonomous agency (which you reject as a desert base), why is *this* relational status worth having? Your functional benefits (coordination, norm transmission) might seem insufficiently *moral*. Your reply needs to bite the bullet: the value comes from the demonstrable goods the practice secures for beings like us living socially, full stop. But this risks feeling pragmatic to the point of amorality to some.

  **The Make-or-Break Reply:** Your survival hinges on the reply to the retributivist and incompatibilist. You *must* persuasively argue that the functional, forward-looking benefits of the answerability practice (coordination, norm transmission, repair) are real, demonstrable goods, and that they are *sufficient* to justify maintaining the practice *without* needing the (indefensible, on your view) metaphysical baggage of desert. If the room accepts that the practice can have moral gravity *without* desert, you live. If they insist desert is non-negotiable, you lose. Spend your rhetorical energy here. Good luck – it's a tough room, but your view is provocative and worth the fight.
