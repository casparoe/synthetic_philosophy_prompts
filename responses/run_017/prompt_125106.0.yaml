answer: |-
  ## Speech: The Policy of Looking

  [Adjust microphone. Minimal pause. Dry tone.]  

  Your class T-shirt got it half-right: “p < .05 is not a decision.” It’s a good start. But it’s incomplete. It tells you what *isn’t* a decision. The theorem you’ve implicitly been wrestling with for two years—Good’s theorem on the value of information—tells you what information *isn’t*. And that’s more useful today.  

  The theorem is ruthlessly pragmatic. It says free information has non-negative value *in expectation* for a rational decision maker. Zero or positive. Never negative. Sounds comforting. But the “in expectation” part is doing all the work. It’s a property of the *policy* of gathering information *before* you see what it says. It guarantees that, *on average*, looking won’t leave you worse off than plunging ahead blind.  

  Why zero or positive? Only if the information *could*, in *some* possible world, change your decision. If no conceivable result would make you act differently, then looking is worthless. Not harmful, just pointless. And crucially, its value isn’t about the noise or the signal strength per se; it’s about the *leverage* it provides *over your possible actions*. Perfect information about something irrelevant is worth nothing. A tiny, noisy signal about a critical hinge point? That can be priceless.  

  So the standard send-off, “go gather more evidence,” is mathematically hollow. It’s only good advice if the evidence *could* change your mind. Otherwise, it’s procrastination dressed up as rigor.  

  The opposite advice, “decide on conviction and stop listening,” is worse. The theorem obliterates it. Since information can’t hurt you *in expectation*, refusing a free look is irrational fear. It’s turning down a lottery ticket that might pay nothing but never costs you.  

  But here’s where Good’s theorem stops talking, and where your real work begins.  

  First, the guarantee is *ex ante* – before you see the data. *After* you look? That’s different. Information can absolutely leave you worse off *ex post*. You might discover an inconvenient truth that closes off your preferred path. You might learn something that makes a hard choice unavoidable. You might find ambiguity where you hoped for clarity. The theorem doesn’t promise comfort or easy answers. It just says that *before you look*, the *act* of looking is the right policy. It doesn’t immunize you against regret or complexity.  

  Second, and far more importantly, Good’s theorem takes your *ends* as fixed. Your preferences. Your values. Your goals. It’s purely instrumental: how does information help you achieve *what you already want*?  

  But look around you. Look at yourselves. What happened these last two years? Did you merely get better tools to chase the goals you walked in with? Or did the information change *what you wanted*? Did the models, the data, the ethical debates, the late-night arguments, the sheer exposure to complexity – did they reshape what you value? What you aim for? What you think a good life or a good policy looks like?  

  For most of you, I suspect it’s the latter. That’s what advanced learning *does*. It’s not just gathering evidence for predefined decisions. It’s about evidence that *redefines the decisions themselves*. Good’s theorem is silent on this. It has no calculus for the value of information that transforms the decider.  

  So what’s the takeaway? Not “gather more evidence.” Not “decide and ignore.”  

  It’s this: **Use the tools wisely, but know their limits.**  

  1.  **Before you dive into analysis, ask: "Could this *change* anything?"** If the answer is "no," you're wasting time. Someone asking for "just one more analysis" when their mind is welded shut? That’s theater. Your time is valuable. Don’t enable the theater. "p < .05 is not a decision," and neither is a thousand-page report nobody’s mind is open to receiving. Learn to say, "What decision would this inform, and are you actually open to changing course based on it?"
  2.  **Embrace the *policy* of looking, but brace for the *outcomes*.** Looking is the rational default. Do it. But understand: it might make your life harder, not easier, in the moment. The value lies in making *better* decisions, not *easier* ones. Don’t resent the complexity you uncover; that’s the job.
  3.  **Protect the space for information that changes *you*.** The most valuable information you’ll encounter isn’t just about refining your path to a fixed goal. It’s about questioning the goal itself. Good’s theorem gives you no framework for this. That’s where judgment, ethics, and courage come in. Don’t let the instrumental value of information blind you to its transformative power. Nurture the curiosity that lets data challenge your assumptions, not just optimize within them.

  You’re blessed with the curse of competence. People will ask you for answers. They’ll often want only the answer that fits their pre-existing narrative. Your training equips you to cut through that. Use Good’s theorem as your scalpel: demand to know if the information *could* change the course. If not, step back.  

  But more importantly, remember what the theorem *doesn’t* cover. Your true value won’t just be in running the numbers for decisions already framed. It will be in framing better decisions – and sometimes, in realizing the frame itself is broken. That requires looking beyond the instrumental.  

  Go do that.  

  ---

  ## Speaker's Note: Clarifications and Commitments  

  1.  **Ex Post Harm:** I explicitly stated that information *can* leave someone worse off *ex post*. This is correct and crucial. Good's theorem guarantees non-negative *expected* value *before* observation (Ex Ante Value of Information: EVI ≥ 0). However, for any *specific* realization of the information, the *actual* change in utility (Ex Post Value of Information) *can* be negative. Discovering a truth that forces a painful, unavoidable, costly action you could have otherwise (blissfully or delusionally) avoided is a classic example. The theorem doesn't contradict this; it only says the *expectation* over all possible information outcomes is non-negative. I believe this is essential to acknowledge to avoid painting an unrealistically rosy picture of information gathering.  

  2.  **Information Changing Aims:** I unequivocally stated that Good's theorem falls silent on information that changes preferences/goals/utility functions. This is a fundamental limitation of the standard Bayesian decision-theoretic framework underlying the theorem. The theorem assumes a fixed utility function and prior probabilities. Information can only update beliefs about states of the world, not the desirability of the outcomes themselves. Graduate education demonstrably *does* change students' values and goals. Treating this transformative effect as outside the theorem's scope is not just fair, it's accurate. Confining the theorem's relevance to instrumental information within a fixed preference structure is necessary for honesty.  

  3.  **Accuracy Check:** Your understanding was correct on all key points:
      *   **Free Signal Worth Zero:** Correct. If no possible outcome of the signal would change the optimal action compared to acting without it, then EVI = 0.
      *   **Noisy Signals & Thresholds:** Correct. A signal's value depends entirely on whether its *potential* realizations cross decision thresholds based on the prior and loss function. A very noisy signal about a critical factor can have high value if it *might* push you over the threshold; a perfect signal about an irrelevant factor has zero value.
      *   **Refusing Information Never Safer Ex Ante:** Correct. Under the theorem's assumptions (rational EU maximizer, correct Bayesian updating, costless information), refusing free information can never yield higher *expected* utility than accepting it. EVI ≥ 0 is the core result. (The note about noisy signals not contradicting this stands - their EVI might be zero, but not negative).
      *   **Strict Positivity:** You didn't misstate it. The theorem guarantees EVI ≥ 0. It can be zero, as you correctly noted when information cannot change the action. It is strictly positive only if there exists *some* realization that *would* change the optimal action.
