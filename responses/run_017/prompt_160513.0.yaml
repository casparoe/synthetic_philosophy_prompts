prompt: |-
  hey — I'm in year 3 of a pol-theory PhD, finally writing the chapter where I have to say what a criterion for democratic inclusion is even supposed to do, and I've realised I keep scoring views against criteria nobody ever wrote down. So: give me the spec first, scorecard later.

  Purpose, since adequacy is relative to it: I want a criterion that a constitutional draftsperson could actually turn into a rule about who gets on the electoral roll — not a principle that sounds nice at a conference. So being operable under ordinary factual uncertainty matters to me, and I suspect that's definately the requirement most of the standard views quietly flunk.

  Three cases I keep testing candidates against — I stitched these together myself, they're not from the literature, so please actually reason through them instead of pattern-matching:

  - the associated region: a region is inside a federation for criminal law and taxation, has its own assembly that the federation can overrule, and gets no vote in federal elections. Its residents are subject to a great deal of federal power and to nothing else that looks like membership.
  - the gradient proposal: instead of in/out, give people fractional votes in each polity whose law materially shapes their lives, so one person might hold 0.6 of a vote in one system and 0.4 in another.
  - the long-run decision: siting a nuclear waste repository, or setting a carbon budget — the people most affected don't exist yet, can't be coerced, and can't answer back. And in the version I care about, whether a given population is affected at all turns on a disputed causal claim: this state's emissions, that island's flooding.

  Two things I'm stuck on and want you to adjudicate rather than just assume: whether a criterion has to output a clean binary in/out or is allowed to output degrees and weights (is binary a real desideratum or just a one-person-one-vote prejudice?), and whether escaping the circularity — whoever applies the criterion is itself some demos — is a genuine requirement or a philosophers scruple that no working criterion has ever met.

  Format please:
  1. "The list" (~600 words): every requirement, each with the case or consideration behind it, each tagged non-negotiable / preference of a particular camp / genuinely up for grabs.
  2. "Where the list eats itself" (~200 words): the subsets that can't be jointly satisfied. If the whole list turns out to be unsatisfiable, say so plainly — that would be a result I'd happily report instead of a scorecard.
  3. "The one that does the most damage" (~100 words): the single requirement that knocks out the most candidate criteria, and why.
  4. "Scorecard" (~200 words, keep it brief): all-affected, all-subjected, and subject-to-coercion accounts, a line or two each. No names, no citations, no suggestions for further reading — I've read them and I have library access.
reasoning: |-
  Okay, let me approach this systematically. The user is a PhD candidate in political theory wrestling with democratic inclusion criteria, specifically seeking operational requirements for constitutional drafting. They've presented three original test cases and two conceptual sticking points that need resolution.

  First, I need to unpack the core tension: the gap between theoretical principles and implementable rules. The user's frustration with views being judged against unstated criteria is telling - this suggests the field may lack clear meta-criteria. Their three test cases are particularly insightful:
  - The associated region case probes territorial vs personal bases for inclusion
  - The gradient proposal challenges binary assumptions
  - The long-run decision introduces intergenerational and epistemic complications

  On the sticking points:
  The binary vs fractional question isn't just about voting mechanics - it's fundamentally about whether democracy requires discrete demoi. Meanwhile, the circularity problem exposes how all criteria are applied by some pre-existing political entity, which has profound legitimacy implications.

  For "The list" section, I'll structure requirements by their source rationale:
  Operational needs from the constitutional drafting purpose (non-negotiable)
  Normative constraints from democratic theory (some negotiable)
  Problem-driven requirements from the test cases (mostly non-negotiable)

  The incompatibility section will highlight three key tensions:
  1) Uncertainty vs determinacy in the long-run case
  2) Binary feasibility vs gradient's theoretical appeal
  3) Circularity avoidance vs practical application

  The most damaging requirement is likely "factual uncertainty tolerance" because it eliminates criteria relying on contested causal claims (like all-affected) and moral judgments that drafters can't reliably make.

  For the scorecard:
  All-affected fails almost everything except theoretical appeal
  All-subjected handles coercion well but stumbles on future generations
  Subject-to-coercion is administrable but too narrow for non-coercive power

  The response will maintain strict adherence to the requested format while ensuring each point traces back to the user's cases and stated concerns. No literature references as instructed - this is purely conceptual analysis tailored to their framework.
answer: |-
  Here's the specification for a democratic inclusion criterion, derived from your constraints and cases:

  ### 1. The List (Requirements)  
  **Non-negotiable** (Operational & Normative):  
  - **Actionability**: Must output clear parameters for electoral roll eligibility (e.g., residency duration, legal status) under real-world bureaucratic constraints. *Rationale: Constitutional draftsperson use-case; flunks theories requiring unverifiable moral judgments.*  
  - **Factual Uncertainty Tolerance**: Must function with imperfect/disputed data (e.g., disputed causal claims in long-run decisions). *Rationale: Avoids paralysis in cases like climate impacts or nuclear waste.*  
  - **Non-Circular Application**: Must not presuppose an already-defined demos to apply the rule. *Rationale: Bootstrapping problem—if the applier *is* the demos, legitimacy is compromised (e.g., who decides the associated region’s status?).*  
  - **Coercion-Accountability Link**: Must justify why included agents can hold power-wielders accountable. *Rationale: Core democratic function; tests against arbitrary exercises of power (e.g., federation ruling associated region).*  

  **Preference of Particular Camps** (Theoretically Contested):  
  - **Binary Output**: Requires in/out classification. *Rationale: Aligns with one-person-one-vote systems; avoids administrative complexity. Favored by institutionalists.*  
  - **Intergenerational Inclusion**: Must incorporate future/non-existent agents. *Rationale: Long-run decisions case; favored by green/cosmopolitan theories.*  

  **Genuinely Up for Grabs**:  
  - **Weighted Inclusion**: Permits fractional voting rights across polities. *Rationale: Gradient proposal’s appeal to multi-jurisdictional impact; but clashes with simplicity.*  
  - **Impact vs. Subjection**: Whether "affected by" or "subject to" power is primary. *Rationale: Affectedness covers long-run cases but is epistemically shaky; subjection clearer but may exclude future people.*  

  ---

  ### 2. Where the List Eats Itself  
  The list is **unsatisfiable as a whole**. Key irreconcilable conflicts:  
  - **Binary Output vs. Weighted Inclusion**: Gradients require non-binary outputs, but binary is administratively simpler and normatively entrenched.  
  - **Intergenerational Inclusion vs. Factual Uncertainty**: Future people’s "affectedness" hinges on contested causal claims (e.g., *which* emissions cause *whose* flooding), violating uncertainty tolerance.  
  - **Non-Circularity vs. Actionability**: Any operable rule must be applied *by someone*—likely an existing state/polity, embedding circularity.  

  ---

  ### 3. The One That Does the Most Damage  
  **Factual Uncertainty Tolerance** eliminates the most candidates. It sinks:  
  - Criteria requiring moral/philosophical judgments (e.g., "all whose autonomy is impacted").  
  - "All-affected" principles (indeterminate under disputed causality).  
  - Future-inclusion theories (unknowable long-term impacts).  

  ---

  ### 4. Scorecard  
  - **All-Affected**: Fails uncertainty tolerance (unknowable/litigable impacts in long-run/associated region cases). Unactionable without predefined demos (circularity). Only viable if diluted to near-meaninglessness.  
  - **All-Subjected**: Clears coercion-accountability link (e.g., associated region residents). Tolerates uncertainty if limited to *de jure* subjection. Flunks intergenerational inclusion (future people not yet subjected) and gradients (assumes binary subjection).  
  - **Subject-to-Coercion**: Best on actionability/uncertainty (coercion is legally verifiable). Survives associated region case. Fails long-run decisions (no coercion of future people) and gradients (rejects fractional membership).  

  ---  
  **Result**: No existing criterion satisfies all non-negotiables. Constitutional drafters face unavoidable trade-offs—prioritize *either* future-inclusion *or* operational rigor, *either* gradients *or* binary simplicity. Your cases expose this irreducibly.
