answer: |-
  ### Reconstruction of the Implicit Theory in Public-Information Pictogram Practice

  #### **Core Claims of the Implicit Theory**
  1. **Pictograms convey concrete, universal concepts without linguistic mediation**  
     - *Status*: Strictly presupposed by icon-only interfaces/signage.  
     - *Rationale*: Design assumes immediate recognition of objects/actions/prohibitions across cultures.

  2. **Pictorial meaning is conventional and learned, not innate**  
     - *Status*: Strictly presupposed by comprehension testing and redesign.  
     - *Rationale*: Testing thresholds and iterative redesign treat understanding as culture-dependent.

  3. **Pictograms semantically depend on language for disambiguation**  
     - *Status*: Presupposed by mandatory word labels (e.g., hazard statements) and captions.  
     - *Rationale*: Words resolve ambiguity where pictograms lack expressive range.

  4. **Pictorial content is inherently non-propositional**  
     - *Status*: Compatible with the narrow content range (objects/actions but not conditionals/modalities).  
     - *Rationale*: Practice avoids syntax-dependent concepts (e.g., uncertainty, negation beyond "⨉").

  5. **Visual efficiency justifies simplification**  
     - *Status*: Strictly presupposed by elimination of perspective/rounding numbers.  
     - *Rationale*: Neurathian unit signs prioritize rapid comprehension over precision.

  ---

  #### **Resolving Apparent Incoherences**
  - **Icon-only vs. word labels**: Not incoherent. Practice assumes *baseline* universality for core concepts (Claim 1) but acknowledges *limits* requiring linguistic backup (Claim 3). Hover-text restoration is a failsafe, not contradiction.  
  - **Testing vs. "immediacy"**: Testing (Claim 2) targets *effectiveness of convention*, not innate transparency. "Immediacy" is pedagogical, not epistemological.  
  - **Narrow content range**: Reflects Claim 4—pictures lack inferential structure. Syntax-free notations *cannot* be full languages (addressing Q3).

  ---

  #### **Neurathian Tension: Pedagogy vs. Anti-Foundationalism**  
  - **Tension**: Pedagogical "evidentness" (seeing comparisons) *seems* to reintroduce a "given."  
  - **Resolution**: Only apparent. Neurath’s visual education (*not* innate immediacy) aligns with anti-foundationalism:  
    - Charts are *taught conventions* (Claim 2), not raw sense-data.  
    - Captions frame pictures as *aids*, not evidence (Q4). The "fact" is pedagogically constructed, not foundational.  

  ---

  #### **Philosophical Underdetermination (Q5)**  
  The practice accommodates but does *not* require:  
  - **Theories of pictorial meaning**: Both resemblance-based (iconic) and conventionalist (symbolic) theories fit.  
  - **Psychological explanations**: Attention/memory efficiency (e.g., icons reduce cognitive load) justifies design but isn’t mandated.  
  - **Semantic dependence**: Practice *allows* but does not compel the view that pictures are parasitic on language (Neurath’s "helper" claim).  

  **Strict requirements**:  
  - Meaning is testable/conventional (Claim 2).  
  - Pictograms cannot carry logical operators (Claim 4).  

  ---

  #### **Consequences of Theory Replacement (Q6)**  
  **Scenario 1: Deflationary View (Pictures = Compact Assertions)**  
  - **Changes**:  
    - Abandon rounding/unit-sign repetition; show exact magnitudes.  
    - Add uncertainty metrics (e.g., error bars on pictogram charts).  
    - Specify sources/scopes (e.g., "data: 2019–2023 EU samples").  
    - Permit "wrong" charts (e.g., recallable drug leaflets).  
  - **Abandoned features**: Icon-only deployment (if assertions require words), universalism claims.  

  **Scenario 2: Non-Propositional Content**  
  - **Changes**:  
    - Stop treating charts as interchangeable with tables/text.  
    - Design for *evocation* over information equivalence (e.g., mood-based hazard icons).  
    - Reject comprehension thresholds (if meaning is non-linguistic).  
  - **Abandoned pretenses**: "Teaching" pictograms as neutral facts; using them for logical operations.  

  ---

  ### Summary of Implicit Theory  
  1. **Pictograms are conventional, taught signs** (Neurath-compatible).  
  2. **They excel at concrete nouns/actions but fail at syntax-dependent content**.  
  3. **Their "universality" is pragmatic, not ontological**—tested, not assumed.  
  4. **Epistemologically, they are pedagogical tools, not foundations**.  

  The practice coheres as a *pragmatic conventionalism*: pictograms are optimized for rapid, cross-cultural communication of limited content, with language as a necessary scaffold. Neurath’s austerity survives in the commitment to education over immediacy, while anti-foundationalism is upheld by treating visual legibility as a social achievement, not a given.
