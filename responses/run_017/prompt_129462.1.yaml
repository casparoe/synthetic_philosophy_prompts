  The user provides several specific cases to test the theory: role relativity, uncostly hero, mistaken-duty hero, supererogation by forbearance, linked-hands rescue, ratchet effect, advisor problem, honesty in corrupt office, and failed rescue. They also want key distinctions maintained or explained if collapsed.

  I need to approach this systematically. First, I should identify the core elements of supererogation: acts that are praiseworthy to perform but not blameworthy to omit, going beyond what's required. But the user challenges this with institutional reliance and exploitation concerns.

  For desiderata, I'll categorize them: phenomena to explain, necessary verdicts, critical distinctions, and constraints from other ethical domains. Each needs justification from the cases provided. For example, the nurse case shows we need "anti-exploitation" to prevent labeling coerced acts as supererogatory.

  The distinctions are crucial too. Beyond duty vs. merely permissible questions if choosing vanilla is supererogatory (it's not). Costly-but-required versus supererogatory addresses whether sacrifice is necessary. And maintaining the asymmetry between praise and blame is vital - supererogation shouldn't slide into obligation.

  Looking at potential conflicts: Unrestricted aggregation might clash with praise/blame asymmetry because if everyone must do the best possible, supererogation disappears. Time-indexed verdicts conflict with act-type properties in cases like the ratchet effect, where repeated acts become expected.

  The anti-exploitation desideratum might eliminate many theories. If a theory can't distinguish genuine sacrifice from institutional exploitation, it fails the nurse test. This seems like the strongest filter.

  For the quick scorecard: A beyond-duty view struggles with role relativity and anti-exploitation. Maximizing views with agent-centered prerogatives might handle cost but collapse distinctions. Practice-relative views excel in role contexts but may justify corruption. Contractualist views handle reasonable demands but might not cover uncostly heroes.

  The user's deeper needs seem to be: Clarity in moral evaluation to prevent exploitation, a framework applicable to real-world institutions, and understanding if supererogation as a concept is ethically sustainable or if it enables systemic issues. They want a theory that doesn't just label acts but guides when such labeling is appropriate versus harmful.
answer: |-
  Here is a specification of desiderata for an adequate theory of supererogation, derived from your cases and distinctions. Each desideratum is justified by a specific case or consideration, indicating it's a requirement for adequacy rather than a preference. Conflicts and key eliminative desiderata are identified.

  ### Core Desiderata for an Adequate Theory of Supererogation

  1.  **Beyond Strict Duty:** *Must* distinguish supererogation from acts that are morally required or merely permissible.
      *   *Requirement Source:* Distinction from "costly-but-required" (e.g., Honest Inspector) and "merely permissible" (e.g., choosing vanilla). Collapsing into required duty eliminates supererogation; collapsing into mere permissibility eliminates its praiseworthiness.
  2.  **Praiseworthiness without Blame for Omission:** *Must* explain why supererogatory acts are praiseworthy to perform while omissions are *not* blameworthy (asymmetric).
      *   *Requirement Source:* Definitional core of supererogation (Passing Swimmer). Collapsing praise/blame symmetry makes supererogation impossible or trivial.
  3.  **Non-Exploitation (Anti-Subsidy):** *Must* distinguish genuinely optional sacrifice from acts institutions/systematically rely upon to function unjustly or shirk responsibility.
      *   *Requirement Source:* Ward Nurse case. Failure means the theory subsidizes exploitation by calling coerced provision "praiseworthy."
  4.  **Role-Relativity with Limits:** *Must* account for how roles define duties, but *must not* allow roles to absorb all costly acts as *de facto* duties simply through reliance or expectation.
      *   *Requirement Source:* Lifeguard vs. Passing Swimmer; Ratchet effect. Must fix the index (e.g., formal duties, core function, reasonable expectations) and block infinite expansion via reliance alone.
  5.  **Sacrifice Not Constitutive, But Evidential/Pragmatic:** *Must* allow for praiseworthy supererogation *without* significant personal cost to the agent.
      *   *Requirement Source:* Uncostly Hero. Sacrifice is strong evidence an act exceeds duty, but constitutive views wrongly exclude cost-free excellence.
  6.  **Intentionality over Outcome/Motivation Purity:** *Must* ground praiseworthiness in the *intention* to go beyond duty for good reason, not success, nor require purely altruistic motivation.
      *   *Requirement Source:* Failed Rescue (intent praiseworthy, outcome tragic); Mistaken-Duty Hero (intent matters, not false belief).
  7.  **Accommodate Forbearance:** *Must* recognize that praiseworthy omissions (not exercising a right/permission) can be supererogatory.
      *   *Requirement Source:* Debt Forbearance case. Failure excludes a significant class of morally significant acts.
  8.  **Aggregation Constraints:** *Must* provide principles for when collective omission of individually permissible (or supererogatory) acts becomes impermissible or catastrophic.
      *   *Requirement Source:* Linked-Hands Rescue. Must explain why all *may* permissibly omit, but if all *do* omit, the outcome is bad/wrong, without collapsing into requiring each individual act.
  9.  **Temporal Stability with Ratchet Recognition:** *Must* recognize that repetition can shift reasonable expectations *within* a role/relationship, potentially transforming an initially supererogatory act into a duty or expected norm, altering the moral landscape.
      *   *Requirement Source:* Ratchet effect. Verdicts must be sensitive to context over time; failure risks ignoring the dynamic nature of obligations.
  10. **Advisor/Institutional Consistency:** *Must* provide consistent verdicts on acting, advising, and institutional design regarding supererogatory acts.
      *   *Requirement Source:* Advisor case. If an act is praiseworthy to do but not blameworthy to omit, advising/permissibly designing around omission must be coherent. Permissible indifference might conflict with encouragement of virtue.
  11. **Distinguish Saintly/Ideal from Supererogatory:** *Must* distinguish acts exceeding ordinary duty (supererogatory) from acts approaching moral sainthood or radical self-transcendence (which may be supererogatory but represent a different *degree* or kind).
      *   *Requirement Source:* Distinction preservation. Collapsing risks making supererogation seem unattainable or irrelevant to ordinary morality.
  12. **Accommodate Suberogation (if granted):** *Must* coherently accommodate or explicitly reject the possibility of "suberogatory" acts (blameworthy but not wrong to do).
      *   *Requirement Source:* Distinction preservation. If suberogation exists, the theory must explain its relationship to supererogation and the praise/blame asymmetry.
  13. **Risk Threshold:** *Must* provide a principle for when risk turns praiseworthy daring into recklessness that should not be celebrated *as supererogatory* (though it might remain non-wrong).
      *   *Requirement Source:* Failed Rescue (extreme risk). Must distinguish reasonable risk-taking for good from futile or disproportionate self-endangerment.

  ### Critical Constraints & Potential Conflicts

  1.  **Action-Guiding for Agent:** *Is this required?* **Likely not a core adequacy condition.** While desirable, the Mistaken-Duty Hero shows an act can *be* supererogatory (objectively) even if the agent perceives it as a duty. Theories focusing on objective features or social meaning can satisfy other desiderata without being primarily agent-guiding. *(Camp-specific: Often prioritized by Kantian/Deontological views)*.
  2.  **"Always Do the Most Good" (Maximizing):** *Is this required?* **No, and it conflicts with supererogation.** If agents are always required to do the very best act available (absent significant cost *to them*), supererogation disappears – all good acts become duties. Supererogation requires moral space *below* the best but *above* the minimally acceptable. *(Camp-specific: Consequentialist views often struggle here without an agent-centered prerogative)*.
  3.  **Unrestricted Aggregation vs. Praise/Blame Asymmetry:** **Conflict.** Unrestricted aggregation (if *each* may omit, then *all* may omit) clashes with the intuitive badness of the Linked-Hands outcome where all omit. Resolving this (e.g., via collective obligations, fairness constraints, or rejecting unrestricted aggregation) is crucial but difficult.
  4.  **Time-Indexed Verdicts vs. Act-Type Properties:** **Conflict.** The Ratchet effect shows an act-type (covering a shift) can be supererogatory at T1 but a duty at T2. A theory must either index supererogation to specific agent-context-time tuples (making it a property of tokens, not types) or find a way for context to fundamentally alter the act-type's moral status.

  ### The Key Eliminative Desideratum

  **#3 Non-Exploitation (Anti-Subsidy)** is the single requirement that knocks out the most candidate theories. Many traditional theories (especially simple "beyond duty" or "costly good act" views) fail to screen for systemic reliance and injustice. A theory that labels the Ward Nurse's act as straightforwardly supererogatory fails this desideratum and is inadequate for your downstream jobs (institutional design, political critique). Drop this last.

  ### Quick Scorecard of Candidate Views

  1.  **Simple Beyond-Duty View:** Fails #3 (Nurse), #4 (Lifeguard/Ratchet), #5 (Uncostly Hero), #8 (Linked-Hands). Strong on #1, #2, #7. *Inadequate.*
  2.  **Maximizing + Agent-Centered Prerogative:** Fails #3 if prerogative is too permissive (allows ignoring systemic harm), potentially fails #8 (aggregation). Better on #5 (cost defines prerogative use). Struggles with #12 (suberogation). *Possible but needs careful constraint.*
  3.  **Practice/Excellence Relative View:** Excels at #4 (Role-Relativity), #5 (cost not constitutive), #7 (forbearance within practices). Dangerously fails #3 (could deem corrupt office norms as "standard," making Honesty supererogatory!), struggles with #8/#9 (aggregation/ratchet dynamics). *High risk of justifying exploitation.*
  4.  **Contractualist (Reasonable Demand):** Strong on #3 (defines duty by what can be reasonably demanded, screening exploitation), #4 (roles define reasonable expectations), #8 (collective reasonableness). Struggles with #5 (Uncostly Hero - why *praise* if no sacrifice?), #6 (Mistaken-Duty - objective reasonableness). *Most promising for institutional focus, but may undervalue individual excellence.*

  This list *is* a result: it emerges from the pressure of your cases and distinctions against standard philosophical positions. A theory satisfying all desiderata must be nuanced, context-sensitive, institutionally aware, and resist both minimizing obligations and maximizing demands. **Non-Exploitation** (#3) and resolving the **Aggregation/Asymmetry** conflict (#8) are the steepest hurdles.
