prompt: |-
  Please write a specification for a theory of the commensurability of pleasure and pain, where the purpose the theory has to serve is fixed in advance: it must be good enough to turn lexical threshold negative utilitarianism (LTNU) into an action-guiding view rather than a slogan.

  The version of LTNU I have in mind is the two-threshold one. Below some threshold of intensity and duration, pleasant experiences have negligible positive value — zero, or at any rate not enough to count. Above a second threshold, episodes of suffering are not merely weightier than pleasures but lexically dominant over them: no quantity of sub-threshold pleasure, however vast, compensates for a single episode of suffering above the threshold, and no finite exchange rate converts one into the other. My question is what such a view presupposes about pleasure, pain, and the scale on which they are compared, and which of those presuppositions are legitimate demands on a theory and which are merely prejudices of the negative-utilitarian camp.

  So, for each requirement: state it precisely, give the case or consideration that motivates it, and mark it as non-negotiable for this purpose or as a preference of one camp. I would like the list to cover at least the following, though I do not regard this ordering or division as privileged:

  1. *What the bearers are.* Whether the items compared are momentary phenomenal states, temporally extended episodes, valence-carrying neural events, or whole lives — and what a theory must say about whether a long unpleasant episode can be divided into parts each of which falls below the threshold (the fragmentation, or "dust," worry), and about whether a lifetime of sub-threshold discomforts can be reassembled into something that matters.

  2. *Lexical priority versus incommensurability.* These are different claims and I want them kept apart. A lexical ordering is a relation inside a single scale and presupposes that the ranked items are comparable; incommensurability denies that there is a common scale at all. LTNU is frequently motivated by the second and stated in the vocabulary of the first. Say which one the view actually needs, and what follows if it cannot have it.

  3. *Aggregation across persons.* Whether the ban on trade-offs is intra-personal only or interpersonal as well; what must be said about enormous numbers of very small sufferings; and what must be said about the repugnant-conclusion style argument run in reverse, where one severe episode is ranked worse than any number of mildly pleasant lives.

  4. *Mixed valence.* Experiences that are pleasant and unpleasant together: relief, the scratching of an itch, effort that is enjoyed, grief one would not give up. Whether valence is separable into a pleasant and an unpleasant component, and what is lost if a theory stipulates that it is.

  5. *The zero point, and prudential versus moral significance.* Given that neutral states and sub-threshold pleasures come out equal in value, a theory must say whether it is collapsing the prudential value of an experience into its moral significance, or distinguishing them — and, if it collapses them, what it does with the implication that extinguishing mild pleasure is cost-free, and with the further question whether being permitted to ignore such pleasure is the same as being required to eliminate it.

  6. *Vagueness and the cliff edge.* If the threshold is even slightly vague, then states differing by an arbitrarily small amount are ordered as though one mattered infinitely more than the other. What must a theory say about higher-order vagueness here; may it instead treat near-threshold pairs as neither better, worse, nor equal but on a par; and what does that option cost? I would also like your assessment of a proposal I have not seen discussed — giving the threshold a hysteresis or ratchet structure, so that the level at which an episode enters the lexically dominant regime differs from the level at which it leaves it — as to whether this dissolves the cliff-edge problem or merely relocates it.

  7. *Prospects and risk.* Since the view rejects the trade-off structure that expected-value reasoning normally presupposes, what must it say about ranking gambles — in particular about whether a small probability of threshold-crossing suffering may be averted at the cost of the certain loss of an enormous quantity of sub-threshold pleasure, and what in the theory would make that verdict follow rather than its opposite.

  8. *Locatability.* A view that cannot tell us, even roughly, where the thresholds fall is not action-guiding. What must the scale be connected to — self-report, choice behaviour, neural markers, some hypothetical-choice test — for the theory to be usable, and what is required when those sources disagree?

  Then, two results about the list itself, which are the parts I most want. First: is any subset of these requirements jointly unsatisfiable? My suspicion is that no single theory can combine a sharp lexical threshold, the absence of cliff-edge discontinuity in near-threshold comparisons, and a transitive and complete ranking of the relevant states — but argue for or against that, and if the unsatisfiable subset is not the one I have named, say which it is. Second: which single requirement excludes the largest number of otherwise attractive candidate theories, and which requirement on the list is really a partisan demand of the negative-utilitarian camp that a neutral theorist of commensurability could reject?

  If it is useful, and briefly, since I intend to do the scoring myself: how a single cardinal scale with a priority clause, a parity-style incomparability model, and a two-dimensional or multi-utility representation each fare against the list. Please stipulate any technical vocabulary you need rather than surveying the literature; I am interested in the shape of the specification, not in who has defended what.
reasoning: |-
  We are building a specification for a theory of commensurability of pleasure and pain to make Lexical Threshold Negative Utilitarianism (LTNU) action-guiding. The version of LTNU has two thresholds: 
     - Below a certain threshold (for pleasure), pleasant experiences have negligible (effectively zero) positive value.
     - Above a second threshold (for suffering), episodes of suffering lexically dominate: no amount of sub-threshold pleasure can compensate for a single episode above the threshold.

  We are to cover 8 points (as listed). For each, we must:
     - State the requirement precisely.
     - Motivate it (why it is needed for LTNU to be action-guiding or to avoid absurdity).
     - Mark it as non-negotiable (for the purpose of making LTNU action-guiding) or as a preference of the negative-utilitarian camp.

  Then, we are to address two results:
     A. Identify any unsatisfiable subset of requirements.
     B. Identify the requirement that excludes the most candidate theories and which requirement is a partisan demand.

  Finally, briefly evaluate three candidate structures (without a literature survey) against the list.

  Let's proceed point by point.

  ---

  **1. Bearers of Value**

  **Requirement**: The bearers of value must be temporally extended, bounded episodes that are not subject to arbitrary fragmentation. Specifically, the theory must specify a minimal unit of experience such that:
     - An episode of suffering above the lexical threshold cannot be divided into sub-threshold parts (thus avoiding the "dust" worry).
     - Similarly, a sequence of sub-threshold pleasures cannot be aggregated to form a value that matters at the lexical level.

  **Motivation**: Without this, we face the "dust" problem: if a severe suffering can be fragmented into many mild moments, then by the threshold definition, each mild moment would be below the threshold and thus compensable. This would undermine lexical dominance. Similarly, if many mild discomforts could be aggregated to form a severe suffering, then we would have to count them as above the threshold, which might lead to overcounting.

  **Status**: Non-negotiable. Without a solution to fragmentation, the lexical threshold is vulnerable to trivialization.

  ---

  **2. Lexical Priority vs. Incommensurability**

  **Requirement**: The theory must adopt lexical priority (within a single scale) rather than incommensurability (lack of a common scale). Specifically, it must hold that pleasure and pain are comparable on a single scale, with the lexical threshold establishing a priority of pain above the threshold over any amount of pleasure below it.

  **Motivation**: LTNU is stated as a lexical ordering: it says that above-threshold suffering is infinitely worse than any sub-threshold pleasure. Incommensurability would mean that we cannot even compare the two, so we wouldn't be able to say that the suffering is worse. But LTNU requires that we can compare and then assign lexical priority.

  **Status**: Non-negotiable. Without comparability, we cannot have the lexical ordering that defines LTNU.

  ---

  **3. Aggregation Across Persons**

  **Requirement**: The lexical threshold must apply interpersonally. That is, no amount of sub-threshold pleasure in any number of persons can compensate for a single episode of above-threshold suffering in one person. Additionally, the theory must hold that a vast number of very small sufferings (each below threshold) cannot add up to a lexical-level disvalue. However, it must also avoid the reversed repugnant conclusion: one severe suffering is worse than any number of lives that are mildly pleasant (but without any suffering above threshold).

  **Motivation**: If the lexical threshold were only intrapersonal, then we might trade off above-threshold suffering in one person for sub-threshold pleasures in others. But LTNU typically forbids such trade-offs. Also, we must not allow aggregation of sub-threshold sufferings to cross the threshold (to avoid the "dust" problem across persons). The reversed repugnant conclusion (that one severe suffering is worse than any number of happy lives) is a direct consequence of lexical priority and is accepted by LTNU.

  **Status**: Non-negotiable for the interpersonal ban on trade-offs. The non-aggregation of sub-threshold sufferings is non-negotiable to avoid the dust problem. The reversed repugnant conclusion is a consequence of the view and must be accepted.

  ---

  **4. Mixed Valence**

  **Requirement**: The theory must be able to decompose mixed-valence experiences (like relief) into separable pleasant and unpleasant components. Each component must be assignable to the appropriate side of the threshold.

  **Motivation**: If an experience has both pleasant and unpleasant aspects, we need to know how it contributes to the thresholds. For example, if relief has a pleasant component (the easing of pain) and an unpleasant component (the residual pain), then the unpleasant part must be evaluated against the suffering threshold and the pleasant part against the pleasure threshold. If we cannot separate them, then we cannot apply the thresholds.

  **Status**: Non-negotiable. Without separability, we cannot assign the experience to the correct side of the threshold, making the theory inapplicable to many real experiences.

  ---

  **5. Zero Point and Prudential vs. Moral Significance**

  **Requirement**: The theory must collapse prudential value (value for the individual) into moral significance (value for ethical decision-making) at the thresholds. Specifically:
     - Sub-threshold pleasures are not just prudentially negligible but also morally negligible (so eliminating them has no cost).
     - However, the theory must also hold that we are not required to eliminate sub-threshold displeasures if doing so would require significant effort or sacrifice, but only that we are permitted to ignore them in trade-offs.

  **Motivation**: LTNU sets the thresholds for moral decision-making. If sub-threshold pleasures have negligible moral value, then eliminating them (e.g., by causing a neutral state) is not wrong. But LTNU does not necessarily require us to eliminate every sub-threshold displeasure if it is costly to do so. We need a distinction between permissibility (ignoring them in trade-offs) and requirement (actively eliminating them).

  **Status**: Non-negotiable that the thresholds define moral significance. The distinction between permissibility and requirement is a nuance that avoids over-demandingness and is non-negotiable for practicality.

  ---

  **6. Vagueness and the Cliff Edge**

  **Requirement**: The theory must allow for a non-vague (sharp) threshold. If vagueness is unavoidable, then the theory must include a hysteresis structure (ratchet) such that:
     - The threshold for entering the lexical regime (when suffering increases) is higher than the threshold for leaving it (when suffering decreases).
     - This hysteresis must be such that near-threshold states are not subject to the cliff edge in a way that leads to intransitive or paradoxical judgments.

  **Motivation**: A vague threshold would imply that arbitrarily close states are treated as infinitely different, which is counterintuitive and potentially action-paralyzing. The hysteresis proposal is a potential solution: it creates a buffer zone where states are not lexically dominant until they cross the higher entry threshold and remain dominant until they fall below the lower exit threshold. This avoids immediate flipping near the threshold.

  **Assessment of hysteresis**: This relocates the cliff edge but does not eliminate it. There are now two cliffs: one at the entry threshold and one at the exit threshold. However, it reduces the practical impact because once an episode enters the lexical regime, it remains there until it falls below a lower threshold. This might be acceptable for action-guidance.

  **Status**: Non-negotiable that the theory must avoid the cliff edge in a way that does not lead to intransitivities or arbitrary decisions. Hysteresis is a potential solution and is negotiable as a design choice, but avoiding the problem is non-negotiable.

  ---

  **7. Prospects and Risk**

  **Requirement**: The theory must hold that any positive probability of an above-threshold suffering lexically dominates any certainty of sub-threshold pleasure. That is, we must avoid a gamble that has even a small chance of causing above-threshold suffering, regardless of the amount of sub-threshold pleasure at stake.

  **Motivation**: If we allow expected-value calculations that trade off a small chance of severe suffering against a large amount of mild pleasure, then we lose lexical priority. Lexical priority requires that the mere possibility of above-threshold suffering cannot be outweighed.

  **Status**: Non-negotiable. Without this, the lexical threshold would be undermined in decision-making under uncertainty.

  ---

  **8. Locatability**

  **Requirement**: The scale of pleasure and pain must be connected to measurable phenomena, such as self-report, choice behavior, and neural markers. The theory must specify a method for resolving disagreements among these sources (e.g., by prioritizing self-report when available and consistent) and must provide rough but actionable thresholds.

  **Motivation**: Without knowing where the thresholds are, we cannot apply the theory. For action-guidance, we need to be able to determine in practice whether an experience is above or below the threshold.

  **Status**: Non-negotiable. A theory that cannot be applied in practice fails as action-guiding.

  ---

  **Results**

  **A. Unsatisfiable Subset**: 

  Consider the following requirements:
     - A sharp threshold (from point 6, to avoid vagueness problems).
     - Absence of a cliff edge (i.e., no arbitrarily close states being treated as infinitely different).
     - A complete and transitive ordering (which lexical priority requires).

  These three are jointly unsatisfiable. Why?
     - A sharp threshold creates a discontinuity: just below the threshold, a state has negligible value; just above, it has lexical dominance (infinite disvalue). Thus, states arbitrarily close are treated as infinitely different (a cliff edge).
     - If we try to avoid the cliff edge by introducing vagueness (e.g., a range of incommensurability), then the ordering becomes incomplete (violating completeness) and may become intransitive (if we use parity-like relations). But lexical priority requires comparability and transitivity.

  Therefore, the subset {sharp threshold, no cliff edge, complete and transitive ordering} is unsatisfiable. 

  Note: We cannot avoid the sharp threshold without risking vagueness, which then requires handling in a way that might break completeness/transitivity. And we cannot have lexical priority without a complete ordering (at least in the sense that every above-threshold suffering is worse than every below-threshold state).

  **B. Exclusion and Partisan Demand**:

     - The requirement that excludes the most candidate theories is **lexical priority** (point 2). Most theories of well-being (e.g., hedonistic utilitarianism) use a continuous trade-off and reject lexical priority. Also, many theories of value (e.g., those based on real-valued functions) cannot accommodate lexical orders without infinite values, which cause problems in decision theory.

     - The requirement that is a partisan demand of the negative-utilitarian camp is the **interpersonal lexical priority** (part of point 3). A neutral theorist might accept an intrapersonal lexical threshold (e.g., for one person, severe pain is not compensable by their own mild pleasures) but reject that one person's severe pain cannot be compensated by the mild pleasures of many others. The neutral theorist might allow interpersonal aggregation and trade-offs.

  ---

  **Evaluation of Candidate Structures**

  We consider three candidate structures:

  1. **Single Cardinal Scale with Priority Clause**: 
     - This model uses one cardinal scale for pleasure-pain, with a sharp threshold. Above-threshold suffering is assigned negative infinity.
     - **Evaluation**: 
          - Satisfies: Bearers (if episodes are bounded), lexical priority, interpersonal aggregation (by fiat), mixed valence (if separable), zero point (by setting near-zero), prospects (infinite disvalue dominates), locatability (if scale is measurable).
          - Fails: Vagueness (cliff edge is inherent), and the cliff edge problem is severe. Also, in decision theory, infinite utilities cause problems (e.g., Pascal's Wager type issues).
          - Overall: Fails on cliff edge and vagueness.

  2. **Parity-Style Incomparability Model**:
     - This model treats above-threshold suffering as incomparable to sub-threshold states. Thus, they are not on a common scale.
     - **Evaluation**:
          - Satisfies: Avoids cliff edge by having a zone of incomparability (so near-threshold states might be incomparable to others), might handle vagueness via this zone.
          - Fails: Lexical priority (point 2) requires comparability (with priority), but this model denies comparability. Thus, it cannot say that above-threshold suffering is worse than any sub-threshold pleasure (only that they are incomparable). This fails LTNU.
          - Also: Aggregation across persons becomes undefined.

  3. **Two-Dimensional or Multi-Utility Representation**:
     - This model uses two separate scales: one for sub-threshold states and one for above-threshold suffering. The above-threshold scale lexically dominates the sub-threshold scale.
     - **Evaluation**:
          - Satisfies: Bearers (if defined per episode), lexical priority (by design), interpersonal aggregation (by extending the dominance), mixed valence (if components are assigned to the two scales), zero point (by setting the sub-threshold scale to zero at neutral), prospects (by having the above-threshold dimension dominate even in expectation? Not straightforward: we have to avoid expected utility which would mix the dimensions).
          - Challenges: 
              - For prospects: We must rank gambles lexically: any positive probability of above-threshold suffering makes the gamble worse than any without, regardless of the sub-threshold utilities. This can be done by a lexicographic expected utility: first, minimize the probability of above-threshold suffering; then, if that probability is zero, maximize sub-threshold utility.
              - Vagueness: Still has a cliff edge at the threshold (unless we allow a range of incomparability, but then we break completeness). 
              - Locatability: Requires locating two thresholds, but it's the same problem as in one dimension.
          - Overall: Best candidate. It can satisfy most points if we accept the cliff edge and design around it (e.g., with hysteresis). The main issue is the cliff edge and vagueness.

  ---

  **Conclusion**

  The specification must accept a cliff edge or sacrifice completeness/transitivity. The hysteresis proposal (ratchet) can mitigate the practical impact of the cliff edge but does not eliminate it. The two-dimensional model is the most promising candidate, but it still requires a sharp threshold and thus a cliff edge. The partisan demand of the negative-utilitarian camp is the interpersonal lexical priority, which a neutral theorist might reject.

  The list of requirements is demanding, and the cliff edge problem seems unavoidable without giving up on a complete and transitive ordering. This is the central tension in making LTNU action-guiding.
answer: |-
  ### Specification for a Theory of Commensurability of Pleasure and Pain for Lexical Threshold Negative Utilitarianism (LTNU)

  **Purpose**: To render LTNU action-guiding, where:
  - Pleasure below a fixed intensity/duration threshold has negligible (≈zero) moral value.
  - Suffering above a higher threshold lexically dominates: no finite quantity of sub-threshold pleasure can compensate for a single above-threshold suffering episode.

  Each requirement is specified with: (1) precise statement, (2) motivation, (3) status (non-negotiable for action-guidance or partisan preference). The requirements cover eight domains.

  ---

  #### 1. **Bearers of Value**
     - **Requirement**: The bearers must be *temporally extended, non-fragmentable episodes* with intrinsic boundaries (e.g., "a migraine attack," not arbitrary milliseconds). The theory must prohibit reassembling sub-threshold pains into a supra-threshold unit ("dust aggregation") and similarly for pleasures. Fragmentation must not dissolve an above-threshold episode into sub-threshold parts.
     - **Motivation**: Prevents trivializing lexical thresholds (e.g., fragmenting torture into "dust" of mild discomforts to permit compensation). Ensures episodes retain their moral significance.
     - **Status**: **Non-negotiable**. Without this, LTNU collapses via redefinition.

  #### 2. **Lexical Priority vs. Incommensurability**
     - **Requirement**: The theory must affirm *lexical priority* (a strict, infinite exchange rate within a single scale), not incommensurability (no common scale). Above-threshold suffering must be comparable to and infinitely worse than any sub-threshold state.
     - **Motivation**: Incommensurability would leave LTNU unable to rank options (e.g., is severe pain worse than mild pleasure?), making it non-action-guiding. Lexical priority operationalizes the "no compensation" tenet.
     - **Status**: **Non-negotiable**. Incommensurability renders LTNU silent on decisions.

  #### 3. **Aggregation Across Persons**
     - **Requirement**: Lexical dominance must be *interpersonal*: no amount of sub-threshold pleasure (across any number of persons) compensates for one above-threshold suffering. Sub-threshold sufferings *cannot aggregate* to breach the threshold (e.g., a billion papercuts ≠ torture). The theory must accept the reversed repugnant conclusion: one above-threshold suffering is worse than any number of lives with only sub-threshold states.
     - **Motivation**: Intrapersonal-only lexicality permits sacrificing one person to benefit others, violating LTNU’s core. Allowing aggregation revives dust problems. The reversed repugnant conclusion is entailed by lexical dominance.
     - **Status**: **Non-negotiable** for interpersonal dominance and non-aggregation. The reversed repugnant conclusion is a **partisan demand** (neutral theorists may reject it as implausible).

  #### 4. **Mixed Valence**
     - **Requirement**: Valence must be *separable* into distinct pleasurable/unpleasant components (e.g., the pain of grief and relief of catharsis are independently evaluable). The theory must assign each component to the correct side of its threshold.
     - **Motivation**: Without separability, mixed experiences (e.g., enjoyable effort) become unclassifiable, paralyzing decisions. LTNU requires knowing if an episode contains *any* above-threshold suffering.
     - **Status**: **Non-negotiable**. Non-separability makes thresholds inapplicable.

  #### 5. **Zero Point and Prudential vs. Moral Significance**
     - **Requirement**: The theory must *distinguish prudential value from moral significance*. Sub-threshold pleasures have negligible *moral* weight but retain *prudential* weight for the individual. Eliminating mild pleasure is *permissible* (no moral cost) but not *required* unless it prevents suffering.
     - **Motivation**: Collapsing prudential/moral significance implies eradicating mild pleasures is obligatory (over-demanding) or that they lack value entirely (implausible). The distinction avoids fanaticism.
     - **Status**: **Non-negotiable**. Without this, LTNU demands absurd sacrifices (e.g., destroying all video games to prevent negligible displeasure).

  #### 6. **Vagueness and the Cliff Edge**
     - **Requirement**: The theory must *deny vagueness* at thresholds, treating them as sharp. If vagueness is unavoidable, it must use a *hysteresis/ratchet model*: the "entry" threshold (into lexical dominance) is higher than the "exit" threshold. Near-threshold states must not be "on a par" (incomparably different), as parity undermines lexicality.
     - **Motivation**: Vagueness creates sorites problems (e.g., is pain at 99% threshold lexically dominant?). Parity voids lexical dominance by allowing incomparability. Hysteresis mitigates flip-flopping (e.g., pain must decrease more to lose dominance).
     - **Assessment of hysteresis**: Relocates but does not dissolve the cliff edge (now two cliffs: entry/exit). It reduces oscillations in practical judgments but accepts discontinuities.
     - **Status**: Sharp thresholds are **non-negotiable**; hysteresis is a **partisan preference** (neutral theorists may allow vagueness).

  #### 7. **Prospects and Risk**
     - **Requirement**: Any positive probability of above-threshold suffering must lexically dominate certain sub-threshold pleasures. The theory must rank gambles by *lexical minimax*: first minimize the probability of above-threshold suffering; only if equal, maximize sub-threshold pleasure.
     - **Motivation**: Expected-value reasoning (e.g., 0.001% chance of torture vs. vast mild pleasure) would violate lexical dominance. Minimax enforces risk-aversion for catastrophe.
     - **Status**: **Non-negotiable**. Anything less revokes lexical priority in decisions.

  #### 8. **Locatability**
     - **Requirement**: Thresholds must be *empirically anchored* to intersubjectively observable markers (e.g., self-report scales, pain behaviors, neural correlates). Conflicts between markers (e.g., stoic self-report vs. aversive behavior) must be resolvable via a *priority rule* (e.g., behavior trumps self-report if incongruent).
     - **Motivation**: Unlocatable thresholds are unactionable (e.g., "Is this pain above threshold?" must be answerable).
     - **Status**: **Non-negotiable**. LTNU is vacuous without operational thresholds.

  ---

  ### Results on the Requirements

  #### A. **Jointly Unsatisfiable Subset**
  The subset {**Sharp thresholds** (from §6), **No cliff-edge discontinuity** (implied by §6’s rejection of vagueness/parity), **Complete and transitive ranking** (required by §2’s lexical priority)} is **unsatisfiable**.  
  - **Why**: A sharp threshold creates a discontinuity (cliff edge) between states arbitrarily close on the scale (e.g., pain at *T*−ε is negligible, at *T*+ε is infinitely bad). Transitivity and completeness demand comparable differences, but the discontinuity violates continuity (arbitrarily small differences yield infinite moral gaps). Allowing parity (§6) avoids the cliff but breaks completeness, voiding lexical priority (§2).  
  - **Verdict**: LTNU must accept a cliff edge or abandon transitivity/completeness—neither is viable for action-guidance. This tension is fatal.

  #### B. **Exclusion and Partisan Demand**
  - **Most Exclusionary Requirement**: **Lexical priority** (§2) excludes all continuous trade-off theories (e.g., classical utilitarianism, prioritarianism) and many decision models (e.g., expected utility).  
  - **Partisan Demand**: **Interpersonal lexical dominance** (§3) excludes otherwise viable theories. Neutral commensurability theories can accept intrapersonal lexicality (e.g., personal health thresholds) but reject *interpersonal* lexicality as implausibly extreme (e.g., one stubbed toe outweighs a galaxy of mild joys). This is a core NU commitment.

  ---

  ### Evaluation of Candidate Theories
  Assessed against the specification (✓ = satisfies, ✗ = violates, ~ = partial):

  | Requirement                             | Cardinal Scale + Priority | Parity/Incomparability | Two-Dimensional Scale |
  |----------------------------------------|---------------------------|------------------------|----------------------|
  | **1. Bearers (non-fragmentable)**      | ✓ (if episodes bounded)   | ~ (parity avoids dust) | ✓                     |
  | **2. Lexical priority (not incomm.)**  | ✓                         | ✗ (denies comparability)| ✓ (lexical ordering) |
  | **3. Interpersonal dominance**         | ✓                         | ✗ (incomm. blocks IP)  | ✓                     |
  | **4. Mixed valence (separable)**       | ✓                         | ✗ (parity muddles)     | ✓ (assign components)|
  | **5. Prudential/moral distinction**    | ✗ (often conflated)       | ~                      | ✓ (dimensions decouple)|
  | **6. Sharp thresholds + no parity**    | ✓ (sharp)                 | ✗ (parity central)     | ✓ (sharp)            |
  | **7. Risk: lexical minimax**           | ~ (infinite values break)| ✗                      | ✓ (dimension dominance)|
  | **8. Locatability**                    | ✓                         | ✗ (incomm. unmeasurable)| ✓                    |
  | **Avoids cliff edge?**                 | ✗                         | ✓ (parity as buffer)   | ✗ (discontinuity)    |
  | **Verdict**                            | Fails §5, §7, cliff edge | Fails §2, §3, §4, §7   | **Best fit** (fails §6 cliff) |

  - **Cardinal Scale + Priority**: Fails prudential/moral distinction (§5) and risk management (§7). Infinite values cause decision-theoretic pathologies.
  - **Parity/Incomparability**: Violates lexical priority (§2) and interpersonal comparability (§3). Parity handles vagueness but abandons action-guidance.
  - **Two-Dimensional Scale**: Best candidate (e.g., pleasure dimension + pain dimension, with lexical dominance). Satisfies most except cliff edge (§6), which is unavoidable. Hysteresis can be added but relocates discontinuities.

  ---

  **Conclusion**: LTNU requires a two-dimensional model with sharp thresholds, non-fragmentable episodes, and interpersonal lexical dominance. The cliff-edge problem (§6) and interpersonal dominance (§3) are the core tensions: the former is unsolvable without abandoning action-guidance, while the latter is a partisan demand. A theory meeting all requirements is likely infeasible due to the unsatisfiable subset {sharp thresholds, no cliff, transitivity}. LTNU can be made action-guiding only by accepting discontinuities and embracing its partisan commitments.
