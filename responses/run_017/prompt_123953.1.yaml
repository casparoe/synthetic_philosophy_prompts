prompt: |-
  I've somehow ended up on the committee of a very small charity that funds secondary school scholarships in Malawi and northern Ghana — I went out with them for three weeks last summer and have come back completely unable to shut up about it. The problem is that every committee meeting turns into the same row. One member thinks colonial borders and corruption explain everything. Another bangs on about disease burden and latitude. A third reckons it's basically culture and work ethic with extra steps. Everyone is extremely confident, nobody has ever changed anybody's mind, and the arguments are all just stories bolted onto the one history we happen to have watched happen.

  They've asked me to run a session on this at our volunteer training weekend in March and I want to do it properly rather than stand at the front and tell them causal inference is hard. So: design me a game or structured simulation for that room. About 14 people, ages from about 19 to late 60s, mostly no economics or stats background, 90 minutes, a church hall with a flipchart and no projector. There will be volunteers in the room who are Ghanaian and Malawian, so please use invented countries or blank names for the in-game places — I don't want anyone's actual home country turned into a puzzle for other people to solve.

  What I want them to feel in their bones is this: a single run of history can be equally well explained by two or more causal stories that disagree completely about what to do next, and getting the story to fit is not the same as finding the lever. No lecture up front, and ideally they shouldn't hear words like endogeneity or underdetermination until the debrief.

  Rough shape I have in mind, but please improve on it: the group plays through a few short "histories" generated by a hidden rule the facilitator knows and they don't. There should be at least three genuinely different hidden rules — say one where a slow-moving institutional parameter does the work, one where a fixed geographic or endowment parameter does, and one where early luck gets locked in and compounds. The key design constraint: each rule has to be able to throw up the same kind of visible history, so that the team observing it cannot tell which world they're in, but the rules must differ sharply in what would happen if you spent money to change one thing. Then they get an intervention budget and have to bet on a lever, and the payoffs should reward getting the intervention right rather than telling a convincing story. If it helps, give some people roles — donor board, country adviser, record keeper — and give at least one role information that is local and partial rather than global.

  Please give me: the rules, the roles, the materials (nothing I can't buy in a stationery shop), a timeline in minutes, and a debrief that maps specific moments in the game onto specific parts of the problem — why fitting the past is cheap, what would actually have counted as evidence, and the difference between asking why a place is poor and asking what would make it richer from here.

  Also be honest about two things. First, what will predictably go wrong when I run it. I can already see three risks: the confident committee member dominating, someone trying to reverse-engineer the rule cards instead of playing, and the whole thing landing as "well then nothing is knowable and we might as well keep doing what we're doing," which is the opposite of what I want. Second, be straight about what the game can't do and what I'll have to say out loud myself. I assume the honest answer is that the real world gives you a lot more than one draw from a stationary rule — variation inside countries, comparisons over time, past interventions that did land, records of the mechanism rather than just the outcome — and that the clean lever-versus-marker distinction is cleaner in a game than in a place where causes only seem to work in combination. Tell me what to say about that so the session doesn't just teach people to shrug.

  Oh, and one more thing: nobody should need any real-world facts to play it, and nothing should depend on anyone having read anything. If your design needs a name, a date or a cited study to land, it's the wrong design.
reasoning: |-
  We are going to create a simulation game called "The Leverage Game". The goal is to have players experience how the same observable history can be explained by different underlying causes (hidden rules) and how these different causes imply different effective interventions.

  ### Game Overview
  - **Setting**: We have three fictional countries: **Alandia**, **Boria**, and **Cartonia**. Each has a history of economic development (or lack thereof) over 50 years (represented as 5 decades).
  - **Hidden Rules**: There are three possible types of hidden rules (each game uses one, unknown to players):
    1. **Institutional Drift (Slow-moving institutional parameter)**: The country's institutions (quality of governance) slowly improve or deteriorate over time based on an initial value and a small random component. The outcome (wealth) is directly tied to the institution level.
    2. **Fixed Geography (Fixed endowment)**: The country has a fixed geographic feature (e.g., soil quality, access to sea) that affects its productivity. The outcome is determined by this fixed factor plus some random noise (to mimic other factors).
    3. **Path Dependence (Early luck compounds)**: The country starts with a random event (good or bad) that sets the trajectory. If the first event is good, it leads to a series of positive events (and vice versa) due to compounding.

  - **Game Flow**:
    1. **History Generation**: The facilitator (you) has three hidden rule cards (one for each type). You secretly pick one and use it to generate the 50-year history for each of the three countries. The history is presented as a simple line graph of wealth (from 0 to 100) over 5 decades (each decade is one step). You will generate these graphs in advance on flipcharts (one per country) and cover them until revealed.
    2. **Observation and Storytelling**: Players observe the three countries' histories (without knowing the hidden rule) and form teams to come up with explanations for why each country ended up as it did. They also note any patterns they see.
    3. **Intervention Phase**: Each team is given a fixed budget (say, 100 "development dollars") to invest in interventions in one or more countries. They must choose which lever to pull (each lever corresponds to one of the hidden rules, but they don't know which rule is in play). The cost of an intervention is fixed per country, and they can split the budget.
    4. **Reveal and Payoff**: The hidden rule is revealed. The facilitator then simulates the next 10 years (one more decade) for each country, applying the intervention if any. The payoff (increase in wealth) is calculated based on whether the intervention matched the hidden rule. The team with the highest total wealth increase wins.

  ### Roles (for 14 players)
  Divide into 3 teams (about 4-5 per team). Each team represents a **Development Agency** responsible for one country (Alandia, Boria, Cartonia). However, all teams see the same three countries' histories. Additionally, assign:
  - **Facilitator**: You (or a helper) to run the game, keep time, and reveal information.
  - **Country Insiders (3 people, one per country)**: These players get a little extra information about their assigned country. For example, they might know one additional fact about a specific decade (e.g., "In the 3rd decade, there was a drought" or "In the 1st decade, a new leader took over"). This information is partial and may be misleading if taken out of context. They join their country's team.

  ### Materials
  - Flipchart with pre-drawn grids (5 decades on x-axis, wealth 0-100 on y-axis) for each country (3 charts). You'll plot the history with a marker.
  - Markers in different colors.
  - Index cards for hidden rules (you'll have three, but only use one per game round).
  - Index cards for the country insiders' information (prepared in advance for each country, based on the hidden rule you picked).
  - Budget tokens (can be paper chips) representing 100 units per team.
  - Intervention cards (each team gets a set of three intervention options, each corresponding to one hidden rule but without labeling the rule). The options are:
    - *Institutional Reform*: Invest in improving governance (e.g., anti-corruption, education).
    - *Geographic Adaptation*: Invest in overcoming geographic limitations (e.g., irrigation, infrastructure).
    - *Boost Initial Conditions*: Invest in creating a positive shock to kickstart growth (e.g., a big project, technology transfer).
  - A way to record the interventions (e.g., a form).

  ### Timeline (90 minutes total)
  1. **Introduction (5 mins)**: Explain the setup: "We have three countries with different development paths. Your job is to understand why and then invest to help them grow. We'll play in three phases: observe, invest, and see results."
  2. **Phase 1: Observe History (15 mins)**:
     - Reveal the three flipcharts (each showing a 50-year wealth history for one country). 
     - Teams (with their country insider) discuss and note observations. They should come up with a story for each country and overall patterns.
  3. **Phase 2: Intervention (15 mins)**:
     - Each team gets 100 budget tokens and the three intervention cards. They decide how to spend their budget (they can invest in one or more countries, and choose one type of intervention per country). They can also choose to do nothing. They must write down their decisions.
     - The cost per intervention in one country is 50 tokens (so they can do two interventions in two different countries, or one in one country and save 50, etc.). 
  4. **Phase 3: Resolution (15 mins)**:
     - The facilitator reveals the hidden rule that generated the histories.
     - For each country, the facilitator calculates the next decade's wealth based on:
          - The hidden rule.
          - Whether the intervention was applied (if yes, and it matches the hidden rule, then it gives a boost; if it doesn't match, it has no effect; if no intervention, then the rule runs as usual).
     - Plot the next decade on the flipcharts and announce the new wealth levels.
     - Calculate the total wealth increase (from decade 5 to 6) for each team's investments (only for the countries they invested in). The team with the highest total increase wins.

  5. **Debrief (40 mins)**: This is the critical part. Structure the debrief around:
     - **Observations**: Ask each team to share the stories they came up with and what interventions they chose and why.
     - **Reveal the hidden rule and outcomes**: Discuss how the same history was generated by this rule and how the interventions worked (or didn't).
     - **Key Lessons**:
          - *Fitting the past is cheap*: Point out that each team probably had a compelling story that fit the data, but the stories conflicted. Emphasize that the history was generated by one rule, yet multiple explanations seemed plausible.
          - *Evidence vs. storytelling*: Ask: "What would have helped you know the true rule? Maybe more data? But note: we only had one run of history. In the real world, we have more: variation over time and space, natural experiments, etc."
          - *Why poor vs. what to do*: Highlight that explaining why a country is poor (e.g., colonialism, geography, culture) is different from knowing what intervention will work going forward. The lever must be tied to the actual cause.
          - **The game's limitations**: Acknowledge that in reality, causes are intertwined and the rules aren't stationary. But also stress that we can use evidence (like past interventions that worked) to learn.

  ### Hidden Rules Mechanics (for the facilitator)
  You will generate the histories in advance (so you don't have to compute during the game). Here’s how to generate for each rule:

  1. **Institutional Drift**:
     - Assign each country an initial institution value (e.g., between 0 and 10) and a drift (small random change each decade).
     - Wealth = institution value * 10 (plus a small noise, say ±5).
     - Example: 
          - Alandia: start at 5. Drift: +0.5, +0.2, -0.3, +0.4, +0.1 → institutions: 5, 5.5, 5.7, 5.4, 5.8, 5.9 → wealth: 50, 55, 57, 54, 58, 59 (plus noise).
     - Intervention: If a team invests in *Institutional Reform*, then the next decade the institution gets a +2 boost (so wealth increases by 20 plus noise).

  2. **Fixed Geography**:
     - Assign each country a fixed factor (e.g., Alandia: 6, Boria: 3, Cartonia: 8).
     - Wealth = fixed factor * 10 + noise (each decade, noise: ±10 to make it variable).
     - Example: Alandia: around 60, Boria: around 30, Cartonia: around 80, with fluctuations.
     - Intervention: *Geographic Adaptation*: This reduces the negative impact of noise (so the next decade, wealth = fixed factor * 10 + (noise reduced by half, so ±5) and then +5 for the investment). So it stabilizes and slightly boosts.

  3. **Path Dependence**:
     - Start with an initial random event (good: +3, bad: -3) for the first decade.
     - Then each subsequent decade: if the previous change was positive, then the current change is positive (say +2 to +4) and vice versa. But also add a small chance (10%) of breaking the trend.
     - Wealth starts at 50 and then adds the change each time.
     - Example (good start): 50, 53, 56, 60, 64, 68.
     - Example (bad start): 50, 47, 44, 41, 38, 35.
     - Intervention: *Boost Initial Conditions*: This creates a positive shock (like resetting the path). If the country was in a bad path, it breaks the trend and sets the next change to +3 (and then continues positively). If it was in a good path, it adds an extra +5.

  ### What will go wrong
  1. **Dominant players**: Assign roles (like country insider) to distribute talking. Also, structure the team discussion by giving specific questions: "What patterns do you see? What might explain country X's path? What intervention might work?" 
  2. **Reverse-engineering**: Discourage this by emphasizing the goal is to learn about decision-making under uncertainty, not to crack the code. The hidden rule is not something they can figure out from one run. 
  3. **Nihilism ("nothing works")**: Counter by showing that in the game, the right intervention did work. Stress that in the real world, we can test interventions and learn from many examples.

  ### What the game can't do and what to say
  - **Real world is messier**: Causes are intertwined, and we have more data (variation within countries, over time, etc.). We can use that to test theories. Also, past interventions that worked are evidence of levers. 
  - **Say**: "The game simplifies to make a point: one history can have multiple explanations. But in reality, we have more tools: we can look at what happened when a similar country tried an intervention, or when a policy changed. We can look for natural experiments. The point is not to give up, but to be humble about our stories and to test our interventions rigorously."

  ### Example Run (for you to practice)
  Pick one hidden rule (e.g., Path Dependence) and generate the three countries:
  - Alandia: Good start → steady growth: 50, 53, 56, 60, 64.
  - Boria: Bad start → decline: 50, 47, 44, 41, 38.
  - Cartonia: Good start but then a break in the trend (10% chance): 50, 53, 56, 52 (break), 49, 47.

  Teams see these and might think: 
  - Alandia: good institutions? 
  - Boria: poor geography? 
  - Cartonia: maybe corruption?

  Then they invest. If a team invests in *Boost Initial Conditions* in Boria, then it breaks the bad path and sets it to growth (next decade: 47 + 3 = 50). If they invest in Institutional Reform in Boria, nothing happens (because the rule is path dependence).

  This will drive the point home.

  ### Final note
  Make sure the country names are fictional and the histories are generated without any real-world references. The goal is to create a neutral, abstract learning environment.
answer: |-
  ### **The "Leverage Lab" Game**  
  **Goal:** Show that a single historical path can support conflicting causal stories, and that fitting the past ≠ knowing what lever to pull. The payoff is tied to *intervention success*, not storytelling.

  ---

  ### **Materials Needed**  
  - **Flipcharts:** Pre-drawn grids (x-axis: 5 "decades"; y-axis: "National Wealth" from 0–100).  
  - **Index Cards:** For roles, hidden rules, and interventions.  
  - **Colored Stickers:** To plot wealth levels (e.g., green = wealth growth).  
  - **Budget Tokens:** Poker chips or paper coins (20 per team).  
  - **Role Badges:** Simple name tags (e.g., "Adviser", "Historian", "Donor").  
  - **Rule Cards:** For the facilitator only (hidden from players).  

  ---

  ### **Setup**  
  **1. Fictional Countries:**  
  - **Northland**, **Southland**, **Eastland** (no real-world parallels).  
  - Each has a 50-year "history" (5 decades) of wealth levels plotted on flipcharts.  

  **2. Hidden Rules (Facilitator’s Secret Deck):**  
  Each rule generates the **same visible history** but responds differently to interventions.  

  | Rule Type                | How Wealth Is Determined                                  | Effective Intervention          | Ineffective Intervention        |  
  |--------------------------|-----------------------------------------------------------|----------------------------------|----------------------------------|  
  | **Institutional Drift**  | Wealth = (Starting Institutions × Decade) + Random Noise | Fund "Institution-Building"     | Fund "Geography" or "Luck"      |  
  | **Fixed Geography**      | Wealth = (Fixed Resource Score) – (Decade × Noise)       | Fund "Geography Adaptation"     | Fund "Institutions" or "Luck"   |  
  | **Path Dependence**      | Wealth = (Initial Luck) × (1.5^Decade) + Noise           | Fund "Luck Catalyst"            | Fund "Institutions" or "Geography" |  

  - **How histories look identical:**  
    - All 3 countries end Decade 5 at: **Northland=30**, **Southland=60**, **Eastland=20** (wealth units).  
    - Paths vary slightly (e.g., dips/spikes) but overall trend is similar. *Pre-generate these using each rule + noise to ensure visual match.*  

  **3. Roles (Assign to Players):**  
  - **Country Adviser (×3, one per country):** Receives a secret "local insight" card (e.g., *"Northland: Drought in Decade 3"*). Partial info, not diagnostic.  
  - **Historian (×1):** Records the group’s theories. Cannot speak until final debate.  
  - **Donor Board (×10):** Split into 3 teams. Decide interventions.  

  ---

  ### **Game Flow (90 Minutes)**  
  **0. Intro (5 mins):**  
  - *"You’re donor agencies. Here are 3 countries’ wealth histories. Your goal: spend limited funds to boost their future wealth. You’ll propose interventions, then see what works."*  

  **1. Phase 1: Observe & Theorize (20 mins)**  
  - **Task:** Teams study flipcharts and devise theories for why countries diverged.  
  - **Constraints:**  
    - Advisers share their "local insight" (e.g., *"Eastland had a mining strike in Decade 2"*).  
    - Historian records all theories on flipchart ("Culture!" "Colonialism!" "Disease!").  
  - **Facilitator Tips:**  
    - Ask: *"What story explains Northland’s decline?"*  
    - Highlight contradictions: *"Team A says ‘geography’—Team B says ‘institutions’. Both fit the data."*  

  **2. Phase 2: Intervention Betting (20 mins)**  
  - **Task:** Each team gets 20 tokens to invest in 1 intervention per country:  
    - **Institution-Building** (e.g., schools, courts)  
    - **Geography Adaptation** (e.g., irrigation, ports)  
    - **Luck Catalyst** (e.g., startup grants, disaster prep)  
  - **Rules:**  
    - Teams debate, then place tokens on intervention cards.  
    - Cost: 10 tokens per country intervention.  
    - *No one knows the hidden rule yet.*  

  **3. Phase 3: Reveal & Payoff (15 mins)**  
  - **Step 1:** Announce the hidden rule (e.g., *"This world runs on Fixed Geography"*).  
  - **Step 2:** Calculate new wealth (Decade 6):  
    - **Match:** If intervention matches rule, wealth jumps +20.  
    - **Mismatch:** No change (or -5 if you want stakes).  
    - **No intervention:** +0 (baseline growth).  
  - **Step 3:** Declare "winning team" (highest total wealth increase).  

  **4. Debrief (30 mins)**  
  ***Guide the discussion using the Historian’s flipchart:***  
  - **Why fitting the past is cheap:**  
    - *"Look at your theories—all fit the data. But only one team won. Why?"*  
    → *Evidence:* Theories were post-hoc stories, not tested.  

  - **What would have counted as evidence?**  
    - *"What if you’d seen multiple countries with similar geographies but different outcomes? Or a policy change that failed?"*  
    → *Key point:* Real evidence requires variation (over time/space) or experiments.  

  - **Why vs. what to do:**  
    - *"Explaining ‘why Eastland is poor’ (colonialism? geography?) didn’t tell you whether funding ports would work. The lever depends on the hidden driver."*  
    → *Map:* "Why" is about the past; "what to do" is about the causal mechanism now.  

  - **Game limitations (say this explicitly):**  
    - *"Real worlds aren’t this clean. Causes mix, rules change, and we have more data—like local experiments or historical records. This game is a metaphor: it shows why we test interventions instead of trusting stories."*  
    - *"Your job isn’t to ‘prove’ your story—it’s to find what actually changes outcomes."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Dominant player monopolizes debate:**  
     - **Fix:** Assign roles with structured tasks (e.g., Advisers speak first; Historian enforces quiet reflection).  

  2. **Players reverse-engineer rules:**  
     - **Fix:** Emphasize, *"Your goal is to maximize wealth, not guess my card. Real-world rules aren’t this simple!"*  

  3. **Nihilism ("Nothing works!"):**  
     - **Fix:** In debrief, stress:  
       - *"This shows why testing matters. In reality, we run small pilots or use natural experiments (e.g., ‘What happened when Region X got a port?’)."*  
       - *"Your scholarships are already a lever! You’re testing whether education changes paths—that’s how we learn."*  

  4. **Over-simplification backlash:**  
     - **Acknowledge:** *"Yes, in reality, geography/culture/institutions interact. But if a factor can’t be changed (e.g., latitude), or if it’s just a marker, funding it won’t help. We need to find the actionable lever."*  

  ---

  ### **What the Game Can’t Do (Say This Loudly)**  
  - **"This is a toy model. Real development has:**  
    - **More data:** We see variations within countries (e.g., booming vs. failing towns).  
    - **Deeper context:** Colonialism/disease matter—but as *historical events*, not immutable rules.  
    - **Combined causes:** A port (geography) only helps if institutions manage it well.  
  - **So we don’t shrug—we experiment. Your scholarships are experiments. Track outcomes! Ask: ‘Did this cohort thrive? Why or why not?’ That’s how we find real levers."**  

  ---

  ### **Why This Works**  
  - **No real-world knowledge needed:** Everything is abstracted into fictional countries and simple mechanics.  
  - **Emotional hook:** Teams compete to "win" (boost wealth), making the payoff visceral.  
  - **Debrief roots insights in gameplay:** "Remember when Team A funded ‘luck’ in a geography world? That’s why we test."  
  - **Safe for all:** No real countries named; no expertise required.  

  **Final Prep Tip:** Pre-generate histories using each rule (+5% noise) to ensure they look equally plausible. Run a test round with friends!
