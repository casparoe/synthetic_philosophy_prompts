prompt: |-
  I sit on a small committee that is drafting the industrial-action section of a labor federation's code of conduct, and I have been asked to say when a strike is justified. I do not want a survey of any country's labor law, or a tour of the standard doctrines; I know the law often diverges from what I think, and that does not bother me. What I want is a principle: one I could defend to a skeptic, that earns my verdicts rather than merely restating them. Below are my gut verdicts, given as honestly as I can. Assume a setting where unions are established and a collective agreement is in force, except where I say otherwise.

  **The cases**

  1. An ordinary economic strike over wages, begun after the contract expires, with two months' notice; the employer keeps part of the line running with managers and output falls by about sixty percent. **Permissible**, without hesitation.

  2. Nurses at a large hospital strike intermittently — three days out, four days in — but the union staffs the emergency department and intensive care at normal levels and gives ten days' notice of each cycle. Elective procedures are cancelled, and the cancellations fall hardest on poorer patients who cannot easily rebook. **Permissible.**

  3. Teachers strike for six weeks; parents scramble for childcare and students lose instructional time. **Permissible in principle, but not as executed** — they gave two days' notice, and I want more than that.

  4. Workers walk out in breach of a no-strike clause in a contract that still has a year to run, because a machine guard was removed five months earlier and has since been involved in two amputations; the union filed a grievance and no hearing was scheduled. **Permissible.**

  5. The same plant, same clause, walks out over a schedule change the agreement plainly lets the employer make. **Not permissible.**

  6. Warehouse workers at a separate company in the same supply chain strike for a week so that the primary employer loses its buffer. They have no grievance of their own. **Permissible.**

  7. Software workers walk out to force their employer to cancel a government contract. The work itself is ordinary; their objection is to what the contract is ultimately used for. **Not permissible** — and this is the verdict I am least sure I can defend.

  8. Employees at a print shop refuse to run an order of white-nationalist flyers and walk out when the owner insists; their contract permits refusal only on safety grounds. **Permissible.**

  9. Food-delivery couriers, classified as independent contractors, with no union and no recognition election, coordinate in a group chat to log off simultaneously for one hour during the Friday surge-pricing window, demanding a floor on per-trip pay. No notice at all. **Permissible.**

  10. Sanitation crews work to rule — every inspection done in full, no shortcuts, no voluntary overtime — and throughput drops by forty percent. They never call it a strike. **Permissible, but it troubles me more than an open walkout does**, and I would want it disclosed.

  11. Mass picketing that physically prevents replacement workers and suppliers from entering the plant. **Not permissible.** For what it is worth, I also think it is **not permissible** for the employer to hire permanent replacements who keep their jobs after a settlement.

  12. Auto-parts workers stage six unannounced four-hour walkouts, each timed to a just-in-time delivery window during a new model launch. Total hours lost are fewer than in a three-day continuous strike. **Not permissible.**

  13. An employer fires the most visible organizer two weeks into a card-signing drive, citing a minor rule violation of a kind usually tolerated. **Not permissible, and seriously so.** The same employer then holds mandatory paid meetings arguing against unionization, with no equal access for the union. **Also not permissible, but far less seriously, and I am not confident it should be legally prohibited.** I suspect "not permissible" is doing two different jobs across my list — blameworthy versus apt for legal prohibition — and I would like that sorted out.

  **The case I cannot settle**

  A federation calls a one-day general strike, with a week's notice, aimed not at employers but at the government over a national policy; both public- and private-sector unions take part. I go back and forth, partly because case 7 says a political object is out of bounds and partly because a general strike seems to be the only remaining route to that particular object.

  **My tentative principle**

  The best I have managed: a strike is permissible if and only if (i) the demand is one the workers could not reasonably be expected to secure by quitting individually or by enforcing their existing agreement; (ii) the costs of the action fall in the first instance on the party able to grant the demand rather than on people with no power to concede anything; and (iii) the action is authorized by a majority of the unit and announced far enough ahead that those who will bear the costs can adjust.

  As far as I can tell it gets cases 1, 5, 7 and 12 right. It looks wrong on case 2, where the costs land on patients who can concede nothing; on case 9, where there is no union, no vote, no notice, and where quitting is trivially easy; and on case 8, where the printers could quit. It has nothing to say about case 11, which is a question of tactics rather than of whether to strike. I cannot tell whether it gets case 4 right, because I do not know how to count a grievance that has sat unanswered for five months.

  **What I want**

  Repair that principle or replace it. I would like the replacement stated precisely enough to be applied by someone else, with the case that motivates each of its clauses named; an explicit statement of which of my verdicts it cannot accommodate and which of those you would overturn; and its verdicts on three cases I have not ruled on — a twelve-person unit of air-traffic controllers at a regional hub, whose walkout cancels hundreds of flights; a strike, properly voted and noticed, whose sole demand is that the employer not automate the jobs the strikers currently do; and a union striking for a clause requiring new hires to join within thirty days. I already know that I permit the teachers in case 3 while balking at the controllers, and I want to know whether my principle should simply swallow that.

  Two pairs sit worst with me: cases 7 and 8, where the workers' objection in each is to what their labor produces, and cases 2, 9 and 12, where notice and authorization seem to matter enormously in one place and not at all in another. If no single principle covers the lot, tell me whether the right shape is two-level — one test for whether a grievance is a fit object of strike action, and separate constraints on tactics — or something else, and tell me which of my distinctions are doing no work at all.
reasoning: |-
  Hmm, the user is drafting an industrial-action policy for a labor federation and needs a defensible ethical principle for when strikes are permissible. They've provided detailed case judgments and a tentative principle that doesn't fully align with their intuitions. This is clearly an important ethical and practical challenge for them.

  Looking at their cases, several patterns emerge. First, notice requirements seem context-dependent: essential services like healthcare require more notice (case 2) than non-essential jobs (case 9). Second, the legitimacy of the demand matters - safety violations (case 4) justify strikes even during contracts, while frivolous demands (case 5) don't. Third, there's tension between political strikes (case 7) and conscience-based refusals (case 8), which their current principle handles inconsistently.

  Their tentative principle fails mainly because it's too rigid about cost-bearing (ignoring that third-party costs may be unavoidable) and too individualistic (ignoring collective power dynamics). The quitting alternative is unrealistic for many workers, especially in precarious jobs like food delivery (case 9).

  For a better principle, I should focus on three core elements: 1) Substantive justification of the demand, 2) Tactical proportionality, 3) Procedural legitimacy. This structure maintains their key distinction between whether to strike and how to strike.

  The revised principle would need to handle tricky cases like political strikes (where I'd suggest conditional permission if workplace-focused demands are included) and work-to-rule actions (requiring disclosure since they're covert). Their discomfort with case 12's "pinprick" strikes highlights that disruption timing matters beyond total hours lost.

  For their unsettled general strike case, a hybrid approach makes sense: permit it only when tied to workplace impacts of the policy, with enhanced notice for essential services. This maintains consistency with case 7 while acknowledging the unique power of general strikes.

  The user seems particularly thoughtful about power asymmetries - noting how case 13's firing is worse than captive-audience meetings. My principle should reflect that severity gradient by distinguishing blameworthiness from prohibition-worthiness, perhaps through a "reasonableness" standard for tactics.

  Ultimately, they need a principle that honors labor's collective agency while minimizing undue harm. The proposed reformulation balances these by making demand legitimacy central while allowing tactical flexibility contingent on context-sensitive safeguards.
answer: |-
  Based on your cases and the tensions in your tentative principle, here's a revised principle structured around **demand legitimacy**, **tactical proportionality**, and **procedural fairness**. This distinguishes *why* a strike occurs from *how* it's conducted, resolving many of your internal conflicts:

  **Revised Principle:**
  A strike is permissible if and only if:
  1.  **The demand addresses a substantial workplace interest**, meaning it concerns:
      *   Terms and conditions of employment (e.g., wages, safety, hours), OR
      *   The integrity of the collective bargaining process (e.g., retaliation for organizing), OR
      *   A direct and grave imposition of complicity in severe harm through the worker's specific labor.
  2.  **The tactics are proportionate**, meaning:
      *   Disruption is primarily targeted at the employer's operations or bargaining position.
      *   Unavoidable harm to essential third-party interests (e.g., public health, safety) is minimized to the greatest feasible extent.
      *   Tactics do not inherently involve coercion, violence, or the permanent exclusion of workers.
  3.  **The action is procedurally legitimate**, meaning:
      *   It is authorized by a majority of the affected unit (or, in absence of a formal unit, represents their collective will).
      *   Adequate notice is provided relative to the essentiality of the service disrupted, allowing affected parties reasonable time to mitigate harm.

  **How it Works & Case Justification:**

  *   **Demand Legitimacy (Why Strike?)**
      *   **Substantial Workplace Interest:** Explains why economic strikes (Case 1), safety strikes (Case 4), anti-retaliation (Case 13a), and even the print shop (Case 8) are permissible. The printers' labor is directly used to produce harmful material, imposing complicity. Rejects the schedule change strike (Case 5) and the political contract strike (Case 7) – the demand isn't tied to the workplace relationship or direct complicity in severe harm *through their specific work*.
      *   **Integrity of Bargaining:** Captures Case 13a (firing the organizer) as a core attack on the process itself. Explains the sympathy strike (Case 6) – it targets the employer's *bargaining position* via the supply chain, a legitimate workplace interest.
      *   **Complicity:** Justifies Case 8 (printers) while excluding Case 7 (software). Printing flyers *is* the harm; writing code for a system with potential military use is indirect and lacks the "grave/severe + specific labor" link required here. *Motivates Clause 1.*
  *   **Tactical Proportionality (How to Strike?)**
      *   **Targeted Disruption:** Permits Case 12 *in principle* (targeting just-in-time windows hurts the employer) but requires assessing notice/essentiality under Clause 3. Condemns mass picketing blocking access (Case 11) as inherently coercive.
      *   **Minimize Essential Harm:** Explains why Case 2 (nurses staffing ER/ICU) is permissible despite patient impact – harm is minimized where essential. Contrasts with the air traffic controllers (below) where minimization is impossible. *Motivates Clause 2.*
      *   **Non-Coercive/Non-Exclusive:** Condemns Case 11 (blocking access) and employer use of permanent replacements (your aside). Permits work-to-rule (Case 10) *if disclosed* (Clause 3), as it's non-coercive pressure. *Motivates Clause 2.*
  *   **Procedural Legitimacy (How is it Done?)**
      *   **Majority Authorization:** Requires a vote for formal units (Cases 1, 2, 3, 4, 5, 6, 7, 8, 12). Permits Case 9 (gig workers) – no formal unit exists, but coordinated action via group chat implies collective will. Condemns Case 3 (teachers) *as executed* due to inadequate notice, not lack of demand legitimacy.
      *   **Notice Relative to Essentiality:** Requires minimal notice for non-essential disruption (Case 9: food delivery), significant notice for essential services (Case 2: healthcare, Case 3: education). Condemns Case 12 (pinprick strikes) *if* the unannounced timing during critical windows causes unavoidable, significant harm to essential third parties (e.g., disrupting critical infrastructure) – notice must allow mitigation. *Motivates Clause 3.*

  **Accommodating Your Verdicts & Sorting "Not Permissible":**

  *   **Fully Accommodated:** Cases 1, 2, 3 (in principle yes, execution no), 4, 5, 6, 8, 9, 10 (if disclosed), 11 (blocking), 12 (verdict upheld based on tactics/notice), 13a (serious), 13b (less serious).
  *   **Requires Distinction (Blameworthy vs. Prohibitable):**
      *   *Blameworthy but not necessarily legally prohibitable:* Case 13b (captive audience meetings) violates fair process but may be seen as a lesser interference than firing. Case 10 (work-to-rule) is permissible but blameworthy if undisclosed. The *demand* in Case 7 is illegitimate, making the strike blameworthy; prohibition depends on legal context. Your "not permissible" often meant "the strike tactic is illegitimate/unjustified," sometimes shading into "this interference by the *employer* is wrong."
      *   *Potentially Prohibitable:* Case 11 (violence/coercion), Case 5 (breach over non-grievance), potentially Case 7 (if political strikes are deemed outside the proper scope of labor relations).
  *   **Not Fully Accommodated (And Overturned):**
      *   **Case 7 (Software Contract):** Your verdict is upheld. The demand lacks a substantial workplace interest or direct complicity link. The principle rejects it.
      *   **Employer Permanent Replacements:** Your aside is upheld – inherently undermines the right to strike and the bargaining unit.

  **Verdicts on New Cases:**

  1.  **Air Traffic Controllers (12-person unit, walkout cancels hundreds of flights):**
      *   *Demand:* Assume workplace-related (e.g., safety, staffing, wages) – Legitimate (Clause 1).
      *   *Tactics:* Walkout causes massive, unavoidable harm to essential public safety/transportation. Minimization impossible. **Not Permissible** due to Disproportionate Harm (Clause 2). (Aligns with your instinct vs. teachers).
  2.  **Strike to Prevent Automation (voted, noticed, sole demand):**
      *   *Demand:* Concerns future job security/terms – a Substantial Workplace Interest (Clause 1).
      *   *Tactics/Notice:* Voted and noticed – Procedurally sound (Clause 3). Proportionality depends on the harm caused and targeting. **Permissible in principle.** (Workplace interest is clear).
  3.  **Strike for Union Shop Clause (mandatory membership):**
      *   *Demand:* Concerns the strength/stability of the bargaining unit – directly relates to the Integrity of the Bargaining Process (Clause 1). **Permissible in principle** (if procedurally sound and tactics proportional).

  **Resolving Key Tensions:**

  *   **Cases 7 & 8 (Complicity):** Distinguished by the **directness and severity of harm** imposed **through the specific labor**. Printing flyers *is* the act of dissemination. Coding software is several steps removed from its end-use. Clause 1(c) captures this.
  *   **Cases 2, 9 & 12 (Notice/Authorization):** Resolved by **tying notice to essentiality** and recognizing **informal collective action** where no formal unit exists. Healthcare (Case 2) requires high notice; gig work surge (Case 9) requires minimal notice; Case 12's tactics are permissible *unless* the unannounced timing causes disproportionate essential harm even with mitigation efforts (which it likely would during a critical just-in-time launch). Authorization requires a formal vote for a recognized unit (Case 12 fails this too) but collective will suffices where no unit exists (Case 9).
  *   **The General Strike (Your Unsettled Case):**
      *   *Demand:* Purely political/national policy. Lacks a Substantial Workplace Interest or direct complicity link for most workers. **Not Permissible** under Clause 1. (Consistent with Case 7).
      *   *However:* If the policy *directly impacts* workplace conditions (e.g., a law banning public sector bargaining, a safety regulation rollback affecting specific industries), a strike *including that demand* could be legitimate. The "general" nature and targeting of government make it highly unlikely to satisfy proportionality (Clause 2 - massive, untargeted disruption) or procedural legitimacy (Clause 3 - notice adequacy for all essential services?).

  **Why This Structure Works:**

  1.  **Clarity:** Separates justification (Clause 1) from execution (Clauses 2 & 3).
  2.  **Defensibility:** Grounds permissibility in core labor interests (workplace conditions, bargaining integrity, avoidance of direct complicity) rather than abstract cost-bearing. Recognizes the reality of collective action in precarious work.
  3.  **Flexibility:** "Proportionate" and "minimized to greatest feasible extent" allow context-sensitive judgment. "Notice relative to essentiality" avoids fixed timeframes.
  4.  **Accommodates Nuance:** Distinguishes blameworthy employer conduct (Case 13b) from illegitimate strikes. Handles the spectrum of collective action forms.
  5.  **Resolves Conflicts:** Addresses your core tensions around complicity, notice variation, and tactics vs. justification.

  This principle provides a coherent, defensible framework that aligns closely with your considered judgments while offering clear guidance for novel situations. It explicitly rejects the purely political strike (Case 7, General Strike) and protects essential services from disproportionate harm, while affirming the right to strike over core workplace interests, safety, bargaining integrity, and conscience-based refusals involving direct complicity.
