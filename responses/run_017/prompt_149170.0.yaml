answer: |-
  ### Scene 1  
  The lab’s humming silence enveloped her. Elena adjusted the headset, fingertips cold. On the monitor, her own gaze fractured into jagged lines: a window’s edge splintered into abstract vectors, a vase dissolved into light gradients. She scrubbed backward, watching shapes reassemble into coherence. But the intermediates—chaotic, raw—felt distant, like eavesdropping on a stranger’s thoughts. "It’s… not me," she murmured, pulling the headset off. The technician frowned. "Your brain’s data," he insisted. She shook her head. The fragments lacked the weight of seeing.  

  ### Scene 2  
  Alone in her studio, Elena toyed with the scrubber. She paused processing at 300 milliseconds—a half-formed cup on her desk—and muted its color. When the final image resolved, the cup was grey. She hadn’t noticed. Later, she altered the cup’s shape *just* before completion. This time, the result jarred: a visual stutter, like static overlaid on reality. She froze. Early changes folded in silently; late ones tore the fabric. The boundary felt unnervingly precise.  

  ### Scene 3  
  She stood before the attic door, heart drumming. Inside lay her brother’s old studio, untouched since his accident. Through the headset, she scrubbed the feed: early layers reduced the room’s shadows to geometric patterns. She softened them there, muting the darkness. Stepping inside, the room felt airy, almost gentle. "It’s brighter than I remembered," she told Dr. Aris later, voice steady. "Always was." He noted her calm, unaware she’d rewritten the dread.  

  ### Scene 4  
  "Your report *is* the seeing," Aris argued, leaning across his cluttered desk. "If you call it bright, and feel no conflict, then it *was* bright. What else could it be?" Elena gripped her chair. "But I *made* it bright. The room didn’t give that to me." He spread his hands. "The outcome is all we act on. All you experience. There’s no ‘true’ version hiding behind it." She looked away. "You’re saying my hand isn’t mine if the scalpel cuts cleanly."  

  ### Scene 5  
  Aris offered to widen the window—more time to edit. Elena refused. That evening, she painted her brother’s studio: the shadows she’d erased now deepened in oils, clawing at the walls. She left the center empty—a figure half-sketched, then scraped away. Her collaborator called it inaccurate. She touched the blank canvas. "It’s not about the room," she said. The absence was hers to shape.
