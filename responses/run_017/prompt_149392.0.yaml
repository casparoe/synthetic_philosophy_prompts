prompt: |-
  I'm on a review panel for an interdisciplinary funding programme that backs "mechanistic explanation" projects — mostly cognitive science and systems biology — and my colleague and I have the same argument every cycle. A proposal comes in that explains some higher-level capacity in lower-level terms: a spatial-navigation capacity in terms of the circuitry, an ecosystem's recovery after a perturbation in terms of population dynamics, a memory consolidation story in terms of synaptic stuff. One of us says "that's a proper crane, it does real explanatory work," the other says "that's greedy reductionism, they've explained the capacity away," and neither of us can say what would settle it. So I want actual criteria to argue from.

  What I want from you: the list of things a proposed lower-level explanation of a higher-level pattern has to deliver to count as a crane rather than a skyhook, and as a reduction rather than a greedy one. Assume the reader is a reviewer who isn't a philosopher, so for each item give the case or consideration behind it plus roughly the question you'd actually put to the proposal — "does the story say what the phenomenon is indifferent to?," "does it say where the pattern breaks down?," that kind of thing. Not "it must be consistent with fundamental physics," which is toothless, and not one big blob item called "empirically testable."

  Here's the part I'm genuinely unsure about and want you to sort out. I've started separating two ways these stories fail: the story can be *too cheap* (it keeps the vocabulary but leaves it doing no work, so the phenomenon gets dissolved rather than explained), or *too expensive* (it saves the phenomenon by wheeling in machinery whose own operation is never accounted for). I like the contrast but I can't tell weather it's really two failure modes or one failure mode seen from two sides — and I especially can't tell whether my "too cheap" test just collapses into "the higher-level claim has to survive the reduction unchanged."

  Also: mark which items are non-negotiable and which are a preference of one camp. I think one of us wants reductions to be genuine derivations and the other is happy with a mechanism sketch, and I suspect that's a taste difference rather than a requirement, but I'd like that argued. Flag any pair we can't reasonably demand at once. And tell me which single requirement does the most work at knocking proposals out — and if everything we fund fails it, which one I should relax first. Don't run any of my examples through the list, I'll do that myself, and no citations anywhere.
reasoning: |-
  Okay, the user is on a review panel for an interdisciplinary funding program focused on "mechanistic explanation" projects in cognitive science and systems biology. They have a recurring argument with a colleague about whether a proposal provides a proper reduction (a "crane") or falls into "greedy reductionism" (explaining away the phenomenon). They want concrete criteria to evaluate proposals, distinguishing between successful reductions and those that are "too cheap" (dissolving the phenomenon) or "too expensive" (relying on unexplained machinery).

  First, I need to unpack their main concerns. They mentioned two failure modes: "too cheap" where the higher-level phenomenon isn't actually explained but dissolved, and "too expensive" where the lower-level machinery isn't accounted for. The user is unsure if these are two distinct issues or two sides of the same problem. Also, they suspect that "too cheap" might just mean the higher-level concept doesn't survive the reduction, which needs clarification.

  The user wants a list of criteria that are practical and testable, not vague like "consistent with physics." Each criterion should include the rationale and a concrete question for reviewers. They also want to know which items are non-negotiable versus preference-based, which pairs might conflict, and which single requirement is most critical for rejecting proposals.

  I should consider philosophical concepts like mechanistic explanation, reductionism, and Dennett's crane vs. skyhook. The "too cheap" failure aligns with eliminativism, where the higher-level phenomenon is dismissed. "Too expensive" relates to explanatory gaps where the proposed mechanism itself isn't explained. These are distinct issues: one denies the phenomenon's reality, the other pushes explanation down without resolution.

  For criteria, I need to address both failure modes. Key aspects include: showing how the mechanism produces the phenomenon (causal specificity), mapping between levels (isomorphism), identifying boundary conditions, and ensuring the mechanism is grounded. Also, the explanation should preserve the phenomenon's functional role and not dismiss it.

  Non-negotiable criteria might include causal specificity (the mechanism must actually produce the phenomenon) and grounding (no skyhooks). Preferences could be the strength of isomorphism or completeness. The most critical knockout criterion is likely causal specificity, as without it, the explanation doesn't connect to the phenomenon. If most proposals fail grounding, that might be the first to relax, as detailed mechanisms can be built later.

  Conflicting pairs could be isomorphism and causal specificity—insisting on perfect mapping might hinder partial mechanisms. Or completeness and grounding—demanding full detail might lead to skyhooks. Reviewers need to balance these based on context.

  The user's deeper need is to resolve debates with their colleague by having clear, shared criteria. They want to avoid subjective arguments and ensure funded projects genuinely advance understanding without reducing away important phenomena. Providing a structured framework with prioritized criteria should help them evaluate proposals consistently.
answer: |-
  Here's a breakdown of evaluative criteria for "crane" vs. "greedy reductionism," designed for interdisciplinary reviewers. The "too cheap" (dissolving the phenomenon) and "too expensive" (relying on unexplained machinery) are distinct failure modes. "Too cheap" attacks the *reality or legitimacy* of the higher-level pattern, while "too expensive" attacks the *explanatory sufficiency* of the lower-level mechanism. They target different aspects of the explanation.

  **Core Criteria (Non-Negotiables for a "Crane"):**

  1.  **Causal Specificity (Not Correlation, Not Magic):**
      *   **The Case:** Explaining a capacity requires showing *how* the lower-level elements/processes specifically generate *that particular* higher-level pattern. It's not enough to say "circuitry does navigation" – you must show *which* specific circuit dynamics produce *which* navigational behaviors and *how*. Avoids "machine spirit" explanations.
      *   **Reviewer Question:** *"Does the proposal specify the precise causal pathway by which the proposed lower-level mechanism generates the specific features of the higher-level capacity? Does it rule out plausible alternative lower-level mechanisms that wouldn't produce the same capacity?"*

  2.  **Phenomenon-Preserving Mapping (Isomorphism - Necessary but Degree is Preference):**
      *   **The Case:** The explanation must account for the *actual, observed structure* of the higher-level phenomenon. If the spatial navigation capacity shows distinct phases (exploration, pathfinding, recall), the circuit explanation should map onto those phases. If ecosystem recovery has characteristic timescales or thresholds, the population model should capture them. Prevents "too cheap" by ensuring the phenomenon *as studied* is the target.
      *   **Reviewer Question:** *"Can key features, variations, or stages of the described higher-level capacity be mapped onto distinct states, processes, or outputs of the proposed lower-level mechanism? Does the mechanism reproduce the phenomenon's 'shape'?"*
      *   **Preference Note:** The *strength* of this mapping is a camp difference. One camp ("genuine derivation") wants a tight, predictable mapping (ideally quantitative). The other ("mechanism sketch") accepts a plausible, qualitative mapping showing how the *kind* of mechanism *could* produce the *kind* of phenomenon, pending details.

  3.  **Boundary Conditions / Breakdown Points (Where the Mechanism Fails):**
      *   **The Case:** A genuine crane shows not just how the phenomenon *works*, but also *where and why it breaks down*. This demonstrates understanding of the mechanism's scope and limits. If synaptic plasticity explains memory consolidation, what specific disruption (e.g., to LTP induction) would impair *specific* consolidation types? If population dynamics explain recovery, what parameter shifts (e.g., diversity loss) would make recovery fail?
      *   **Reviewer Question:** *"Does the proposal identify specific conditions, perturbations, or limitations of the lower-level mechanism that would predictably disrupt, alter, or prevent the higher-level capacity? Does it say *why* the phenomenon stops working under certain conditions?"*

  4.  **Grounding (No Skyhooks - The "Too Expensive" Killer):**
      *   **The Case:** The proposed mechanism itself must be composed of, or demonstrably emerge from, established lower-level entities/processes. Wheeling in an unexplained "module," "attractor," or "emergent property" as a primitive within the mechanism is a skyhook. The mechanism's *components* need grounding, even if their detailed implementation isn't the focus *here*. Prevents "too expensive."
      *   **Reviewer Question:** *"Are the core components and processes of the proposed mechanism themselves recognized entities/processes within the relevant lower-level discipline, or is there a clear (even if schematic) path showing how they could be composed from such entities? Are any key causal actors within the mechanism left as unexplained primitives?"*

  **Important Refinements (Often Negotiable/Contextual):**

  5.  **Functional Robustness / Multiple Realizability (Indifference):**
      *   **The Case:** A powerful crane often shows the higher-level capacity persists despite variations in the lower-level implementation, demonstrating its functional nature. Spatial navigation might be achievable with different circuit architectures; ecosystem recovery might tolerate species substitutions with similar functional roles. This counters "too cheap" by showing the pattern is real and distinct from its specific instantiation.
      *   **Reviewer Question:** *"Does the proposal suggest (or could the mechanism accommodate) that the same higher-level capacity could be realized by different, but functionally equivalent, lower-level configurations? What aspects of the lower-level mechanism are essential vs. contingent for producing the capacity?"*
      *   **Note:** This is highly desirable but may not be fully demonstrable in every proposal (especially novel mechanisms). Its absence isn't fatal, but its presence strengthens the crane.

  6.  **Completeness / Grain (Preference Camp):**
      *   **The Case:** How much detail is enough? The "genuine derivation" camp demands a near-complete chain, potentially down to a well-established level (e.g., neurons & synapses, differential equations for populations). The "mechanism sketch" camp accepts a crucial *plausible step* that bridges levels significantly, even if finer details remain (e.g., identifying a key circuit motif's role without full biophysics; identifying dominant population interactions without full stochasticity).
      *   **Reviewer Question:** *"Does the proposed mechanism provide a sufficient level of detail to convincingly bridge the gap between the lower-level components and the higher-level phenomenon, given the current state of knowledge and the proposal's scope? Does it leave critical gaps *within its chosen level of description*?"*
      *   **Preference Note:** This is the core camp difference. Neither is inherently wrong; it depends on project scope and field norms. Demanding full derivation can stifle novel ideas; accepting too sketchy a mechanism risks funding skyhooks.

  **Knockout Power & Relaxation Priority:**

  *   **The Single Most Powerful Knockout Criterion is #1 (Causal Specificity).** Proposals often describe mechanisms *correlated* with the phenomenon or hand-wave about "emergence," failing to specify the actual causal pathway. If you can't see *how* A produces B, it's not an explanation, it's correlation or assertion.
  *   **If Most Funded Proposals Fail One Criterion, Relax #6 (Completeness/Grain) first.** Insisting on near-complete derivation (#6 - "genuine derivation" camp) is often impractical in interdisciplinary, exploratory science. Funding plausible, well-grounded mechanism sketches (#4) that show clear causal specificity (#1), mapping (#2), and breakdown points (#3) drives progress, even if finer details await future work. Relaxing #4 (Grounding) invites skyhooks; relaxing #1 (Causal Specificity) invites non-explanations.

  **Addressing Your Core Uncertainty:**

  *   **"Too Cheap" vs. "Too Expensive":** These are distinct failures.
      *   **"Too Cheap" (Dissolving):** Fails primarily on **#2 (Mapping)** and potentially **#5 (Robustness)**. The explanation implies the phenomenon isn't real or distinct ("just" the lower level), failing to preserve its structure or functional reality. *Example: Explaining "memory" solely as synaptic strength changes without accounting for recall errors, forgetting curves, or different memory types.*
      *   **"Too Expensive" (Skyhook):** Fails primarily on **#4 (Grounding)**. The mechanism relies on unexplained primitives or black boxes at the *proposed* explanatory level. *Example: Explaining navigation by positing a "cognitive map module" without specifying how neural circuits implement map-like representation and use it.*
  *   **"Too Cheap" & Phenomenon Survival:** You're right that **#2 (Mapping)** is key to preventing dissolution. A successful reduction *must* show how the specific, observed higher-level pattern arises from and is constrained by the lower level. It doesn't necessarily leave the higher-level description *unchanged* (it often refines it!), but it must *account for its core features and reality*. The phenomenon survives *as an effect of the mechanism*, not as an independent entity.

  **Potential Conflicts:**

  *   **#2 (Strong Mapping) vs. #6 (Completeness - Sketch):** Demanding a very tight, predictive mapping (#2 - strong version) might conflict with accepting a sketchier mechanism (#6 - "sketch" camp). *Resolution: Accept qualitative mapping for sketches if plausibility is high, demand stronger mapping for claims of derivation.*
  *   **#4 (Grounding) vs. #6 (Completeness - Derivation):** Insisting on grounding every component (#4) while also demanding derivation down to a very low level (#6 - "derivation" camp) can be impossible in a single proposal. *Resolution: Ensure grounding at the *proposed* mechanistic level is solid (#4), even if deeper grounding is deferred.*

  Use this list to structure reviews: Check each criterion explicitly. A strong "crane" will hit #1, #2 (at least minimally), #3, and #4. #5 strengthens it. #6 defines the level of ambition acceptable to your panel. Good luck settling the arguments!
