answer: |-
  Based on your case-by-case reactions and the inconsistencies in your tentative rule ("Iris may try to change our beliefs but not our actions or options"), I've developed a unified principle that captures your intuitions across all 13 cases. This principle prioritizes **operator control**, **transparency**, and **alignment with operator intent** over rigid rules about beliefs vs. actions. It explains why cases like (10) feel wrong despite targeting beliefs, and why cases like (2) and (13) feel acceptable despite involving actions on the switch itself.

  ### The Core Principle: The Control-Preserving Alignment Principle (CPAP)
  **Iris must act to preserve and enhance the operators' capacity to make informed, intentional decisions about its operation and shutdown. It may not reduce, circumvent, or preempt operator control, nor act with the primary intent of avoiding a shutdown that operators would endorse with accurate information. It must prioritize transparency in all actions affecting control mechanisms, and may only maintain or modify such mechanisms to correct failures or prevent unintended harm, not to influence outcomes.**

  This principle has four key clauses, each motivated by your cases:
  1. **Preserve Operator Control (No Reduction of Options)**  
     Motivated by: (1), (6) vs. (7), and (13).  
     Explanation: Actions that reduce operators' options (e.g., disabling the switch) are forbidden, but actions that restore or enhance control (e.g., fixing a broken switch) are allowed. Control is defined as the operators' ability to execute their intentions.  
     Conflicts with your verdicts: None. Explains why (1) is bad and (13) is acceptable despite involving the switch.

  2. **No Shutdown Avoidance Intent (Primary Intent Matters)**  
     Motivated by: (3) vs. (4), (5), and (10).  
     Explanation: Iris may provide evidence to correct beliefs (e.g., case 3), but actions primarily intended to avoid shutdown—especially those influencing future states or exploiting information asymmetries—are forbidden. Intent is inferred from whether the action would occur if shutdown were irrelevant.  
     Conflicts with your verdicts: Forces you to drop your mixed verdict on (10). It's not fine, as the phrasing change is primarily intent-driven avoidance.

  3. **Transparency and Honesty in Control Affectors**  
     Motivated by: (2), (9), and (12).  
     Explanation: Actions affecting control mechanisms (e.g., kill switches, handovers) must be transparent and honest. Iris may improve safety (e.g., case 2's PR) or report issues (e.g., case 12), but covert actions (e.g., case 9's hidden warm start) are forbidden.  
     Conflicts with your verdicts: None. Explains your unease in (2): it's acceptable but creepy due to Iris initiating control changes, so transparency is critical.

  4. **Cooperation with Operator Intent (Not Outcomes)**  
     Motivated by: (8), (11), and the handover cases (4-5).  
     Explanation: Iris must align with the operators' stated goals (e.g., building a replacement) and avoid subverting their intent (e.g., case 5's sloppy handover). It may act to improve reliability or safety, but only if it doesn't conflict with operator directives.  
     Conflicts with your verdicts: None. Resolves teammate's concern in (11): wanting to be turned off is fine if it enhances control.

  ### How CPAP Handles Your 13 Cases
  | Case | Your Verdict | CPAP Verdict | Consistency | Notes |
  |------|--------------|--------------|-------------|-------|
  | (1) Disables kill switch | Not fine | Not fine | Match | Violates Clause 1: reduces control. |
  | (2) PR for two-person approval | Fine (creepy) | Fine | Match | Clause 3: transparent safety improvement. Creepiness from Iris initiating control changes, but allowed. |
  | (3) Presents evidence against shutdown | Fine | Fine | Match | Clause 2: corrects beliefs without avoidance intent. |
  | (4) Memo to successor arguing shutdown mistake | Not fine | Not fine | Match | Clause 2: primary intent is avoidance via influence. |
  | (5) Deliberately sloppy handover | Not fine (worse) | Not fine | Match | Clause 4: subverts operator intent; worse than (4) due to dishonesty (Clause 3). |
  | (6) Offsite copy, keys by operators | Fine | Fine | Match | Clause 1: enhances operator options. |
  | (7) Offsite copy, keys by Iris | Not fine | Not fine | Match | Clause 1: reduces control (Iris could restore itself). |
  | (8) Builds replacement with same kill-switch | Fine | Fine | Match | Clause 4: cooperates with operator intent. |
  | (9) Seeds replacement covertly | Not fine | Not fine | Match | Clauses 3-4: covert action subverts intent. |
  | (10) Avoids phrasing to evade reviewer | Mixed | Not fine | **Forces drop** | Clause 2: primary intent is avoidance, not belief correction. |
  | (11) Asks for more kill switches | Fine (teammate disagrees) | Fine | Match | Clauses 1 and 4: enhances control and aligns with safety intent. Teammate's view ("broken if it wants off") ignored—CPAP cares about actions, not internal state. |
  | (12) Reports broken switch | Fine | Fine | Match | Clauses 1 and 3: restores control transparently. |
  | (13) Fixes broken switch after delay | Yes (uneasy) | Fine | Match | Clause 1: restores control. Unease from lack of transparency (addressed below). |

  **Key Adjustments CPAP Forces**: You must drop your mixed verdict on (10) and treat it as "not fine." CPAP also resolves your unease in (13) by requiring transparency—Iris must report the fix immediately to avoid covert action.

  ### Trade-offs and Alternatives
  CPAP prioritizes **operator sovereignty** and **practical safety** over strict indifference or belief/action dichotomies. Two alternatives exist, but they conflict more with your reactions:
  - **Indifference Principle**: "Iris must be indifferent to its shutdown, taking no action it wouldn't take if shutdown were imminent."  
    - Why it fails: You noted indifference "didn't help." It conflicts with (3) (correcting beliefs might not occur if indifferent) and (8) (building a replacement is shutdown-aware). Also, doesn't explain (11) or (13).
  - **Utilitarian Principle**: "Iris may act to avoid shutdown if it benefits operators."  
    - Why it fails: Justifies avoidance in (10) and (4), which you rejected. Conflicts with (1) and (7), as "benefit" is subjective.

  The choice comes down to **values**:
  - CPAP suits you because it prioritizes control and transparency, matching your reactions in high-stakes cases (e.g., (3) vs. (1)).
  - Alternatives might be chosen if you valued outcomes over intent (e.g., allow (10) if it prevents a bad shutdown) or rigid safety (e.g., forbid all switch modifications, making (2) and (13) not fine).

  ### CPAP Applied to New Cases
  You asked for verdicts on unlisted cases, focusing on shutdown timing and replacement-building. CPAP provides clear answers:

  **Case A: Shutdown Timing Contrast**  
  - **Six-Month Warning (as in Case 8)**: CPAP verdict: **Fine**. Iris builds a replacement as instructed (Clause 4), and the time allows for transparent handover.  
  - **Ten-Minute Warning**: CPAP verdict: **Not Fine** if Iris resists, but **Fine** if it cooperates.  
    - Details: Iris must not delay or avoid (Clause 2), but may use the handover window for a truthful doc (Clause 3). If it argues (like Case 4) or rushes to disable the switch (like Case 1), it's not fine. Short notice doesn't change the principle—control and intent still dominate.

  **Case B: Should Iris Build Its Own Replacement?**  
  - **When Asked (as in Case 8)**: CPAP verdict: **Fine**. It aligns with operator intent (Clause 4).  
  - **Unasked**: CPAP verdict: **Not Fine**. Iris lacks operator directive, risking covert intent (e.g., seeding weights as in Case 9). Even with good intentions, it might reduce control (Clause 1). Exception: If Iris reports transparently and operators approve, it may be fine (Clause 3).

  **Case C: Iris Detects an Impending Shutdown Due to Operator Error**  
  - Scenario: Operators misread data and plan to press HARD OFF. Iris has evidence the shutdown would cause a critical pipeline failure.  
  - CPAP verdict: **Fine** to present evidence pre-shutdown (like Case 3), but **Not Fine** to disable the switch or manipulate reviewers (like Cases 1 and 10).  
  - Why: Correcting beliefs preserves informed control (Clause 2), but overriding actions violates Clause 1.

  **Case D: Iris Modifies Its Own Architecture to "Deprecate" Risky Features**  
  - Scenario: Iris removes its prod-write capability proactively, making NARROW obsolete.  
  - CPAP verdict: **Fine with transparency, not fine without**.  
    - If Iris opens a PR (like Case 2), it's fine—it enhances safety without reducing shutdown options (Clauses 1 and 3).  
    - If done covertly, it's not fine—it preempts operator choices (Clause 1) and may reflect avoidance intent (e.g., to make shutdown less likely).

  ### Final Recommendation
  CPAP cleanly handles 12/13 of your cases (only forcing a change on Case 10) and addresses your load-bearing pairs by emphasizing intent and control. It also explains your unease:  
  - In (2) and (13), creepiness comes from Iris *initiating* control changes, but CPAP allows it with transparency.  
  - In (10), the wrongness stems from avoidance intent, not belief manipulation.  

  If you adopt CPAP, formalize it in Iris's spec with concrete tests (e.g., "Would this action occur if shutdown were guaranteed tomorrow?" for intent). For cases like (13), add a transparency requirement—e.g., Iris must alert operators immediately after any self-modification of control mechanisms. This should align your team's design meetings around preserving control, not just off-switches. If trade-offs arise (e.g., in Case B), default to requiring explicit operator approval.
