prompt: |-
  I'm writing a paper in which constitutive panpsychism is supposed to do real work rather than sit there as a promissory note about the intrinsic nature of the physical. Specifically, I need it to deliver an extension thesis: for any arbitrary collection of micro-subjects there is a fact of the matter about whether they compose a further subject, and about what it is like for that subject if they do. I need the criterion rather than a list of paradigm cases, because I eventually want to apply it where I have no reliable antecedent intuition — a beehive, a firm, a split-brain patient, a data centre running a large model — and a theory that only tells me about organisms like me is no use to me.

  Before I commit to a version, I want the specification. Please write the desiderata that an account of phenomenal combination would have to meet to count as adequate for that purpose. For each requirement, give the case or consideration that motivates it, and mark it as non-negotiable or as a preference of one camp.

  My current candidate, so the list can be tested against something concrete: there is a primitive phenomenal-unity relation; a further subject exists over a collection just in case the micro-experiences form a maximal connected plurality under that relation, and what it is like for the resulting subject is fixed by the micro-characters together with the pattern of the relation among them. I want the desiderata to tell me what would have to be true of the relation for this to have a chance — whether it must be transitive and otherwise well behaved enough to partition experiences into non-overlapping subjects, what that commits me to about near-ties and borderline degrees of unity, whether the relation may be brute in the way bonding strategies are accused of being or whether the list should demand that it be explained, and whether it is a problem that the relation is stipulated rather than something I could ever observe from the inside.

  Among the questions I want you to take a position on rather than survey: whether any genuine criterion collapses either into every collection composing a subject or into only the most basic ones doing so; whether combination is meant to iterate upwards, and what stops it if not; whether the demand that the criterion cohere with what our best story about causal integration says about brains is a desideratum or a surrender of the whole motivation; whether the summing-of-subjects question and the summing-of-character question can be separated at all; and whether some subset of your own list is jointly unsatisfiable — I would rather be told that my project's requirements contradict one another than be handed a tidy list that conceals it.

  Take a definite line. Tell me which single requirement excludes the most candidate theories, which one you would abandon if forced to abandon one, and commit to a verdict on whether the list as a whole is satisfiable. A short scorecard — three or four lines each — for a bonding-style micropsychism, a cosmopsychism that derives subjects by decomposition, and a non-constitutive emergence view can close the piece; the list itself is what I care about.
reasoning: |-
  Okay, let me break down this user's request. They're writing a paper on constitutive panpsychism and need a robust criterion for phenomenal combination that can handle edge cases like beehives or AI systems. The core challenge is moving beyond promissory notes to a functional extension thesis.

  First, I need to identify the key philosophical tensions. The user wants to avoid two extremes: universal composition (everything is conscious) and radical emergence (only brains are conscious). Their candidate solution involves a primitive unity relation, so I should evaluate what properties this relation must have.

  The user raises several critical questions: transitivity requirements, handling borderline cases, avoiding brute stipulation, coherence with neuroscience, and whether combination can iterate infinitely. These aren't just technical details - they strike at whether constitutive panpsychism can deliver on its promises.

  Looking at potential desiderata, I consider these non-negotiables:
  - Anti-universality (to exclude cosmic consciousness)
  - Anti-atomism (to allow macro subjects)
  - Causal integration coherence (to prevent disconnect from science)
  - Criterion non-arbitrariness (to avoid brute facts)

  But there's tension here. Requiring both anti-universality and non-arbitrariness while maintaining coherence with science might be impossible. For example, if the unity relation isn't brute, what explains it? And if it's fundamental, how do we test it against empirical data?

  The user's candidate theory has red flags. Maximal connected unity might force transitivity, leading to cosmic consciousness - exactly what anti-universality forbids. Yet without transitivity, we get borderline cases that undermine definite composition claims.

  For the scorecard: 
  Bonding theories fail on non-arbitrariness (brute relations). 
  Cosmopsychism violates anti-universality (everything conscious). 
  Emergence abandons constitutive explanation entirely.

  Ultimately, I suspect the desiderata conflict. The user needs either to accept brute facts (weakening the criterion) or embrace universal composition (contradicting intuition). The project's viability hinges on which requirement they'll compromise.
answer: |-
  Here are the core desiderata for an account of phenomenal combination that meets your "extension thesis" requirement, ranked by criticality and annotated. I take a definite position on each, informed by your constraints and the pitfalls of existing approaches.

  ### Non-Negotiable Desiderata
  1.  **Anti-Universal Composition (Exclusivity)**
      *   *Motivation:* Avoids "cosmic subject" or "heap consciousness" (e.g., a random pile of sand or the entire universe having a unified experience). Intuition strongly rejects this for arbitrary collections.
      *   *Requirement:* The criterion must rule out *some* conceivable collections of micro-subjects from composing a macro-subject. A theory implying *every* collection composes a subject fails.
      *   *Position:* Non-negotiable. Your project requires discernment between composing and non-composing collections.

  2.  **Anti-Radical Atomism (Non-Trivial Composition)**
      *   *Motivation:* Avoids the opposite extreme where *only* fundamental micro-subjects exist (e.g., no human consciousness). Defeats the purpose of constitutive panpsychism explaining macro-subjects.
      *   *Requirement:* The criterion must allow for *some* macro-subjects (like humans) to be composed of micro-subjects.
      *   *Position:* Non-negotiable. Core to constitutive panpsychism doing "real work."

  3.  **Causal/Functional Integration Coherence**
      *   *Motivation:* The best empirical explanation of *our* consciousness (human brains) hinges on complex causal integration. A viable criterion cannot be radically disconnected from this without becoming empirically vacuous or ad hoc ("brains are magic").
      *   *Requirement:* The criterion must designate brains/organisms as composing macro-subjects *because of* (or strongly correlated with) their specific type of causal integration. It need not be identical to the causal story, but cannot contradict it without strong justification.
      *   *Position:* Non-negotiable. *Not* a surrender; it's grounding the theory in the only uncontested data point (human consciousness) and ensuring applicability to borderline cases (brains). Ignoring this renders the criterion arbitrary for your target cases.

  4.  **Definite Fact of the Matter**
      *   *Motivation:* Your extension thesis demands determinacy for *any* collection. Vagueness or pervasive borderline cases undermine the intended work.
      *   *Requirement:* For any given collection, the criterion must yield a determinate yes/no answer to composition, even if the *epistemic* access is limited. Borderline cases must be rare exceptions, not the rule.
      *   *Position:* Non-negotiable for your specific project goal. Theories relying heavily on vagueness fail the extension thesis.

  5.  **Non-Arbitrariness / Non-Brutality**
      *   *Motivation:* A brute, unanalyzable "bonding relation" (like your candidate) is widely criticized as a non-explanation ("panpsychism + magic glue"). It struggles with *why* unity obtains in some cases (brains) but not others (heaps), inviting accusations of being a promissory note in disguise.
      *   *Requirement:* The criterion (or the relation it relies on) must have *some* grounding in fundamental features of reality beyond mere stipulation. This could be its connection to physical structure, information, causation, or a more fundamental experiential nature. It cannot be *wholly* brute.
      *   *Position:* **Strong Preference (Non-Brutality Camp)**. While you might accept a brute relation *provisionally*, its brutality is the single biggest weakness of your candidate and the most common fatal flaw cited against bonding views. A truly adequate theory *should* mitigate this.

  ### Important Preferences (Subject to Theoretical Choice)
  6.  **Iterative Composition**
      *   *Motivation:* Macro-subjects might themselves compose even larger subjects (e.g., a group mind). Blocking this requires justification.
      *   *Requirement:* The criterion should, in principle, allow for composition to occur at multiple levels (micro→macro→meta-macro), unless blocked by a specific feature of the criterion itself (e.g., maximality). Theories assuming only one level of composition appear ad hoc.
      *   *Position:* **Preference (Iteration Camp)**. Your candidate (maximal connected plurality) naturally allows iteration if larger connected unities form.

  7.  **Character Summation Constraint**
      *   *Motivation:* If macro-character is radically emergent or wholly dissociated from micro-character, constitutive panpsychism's core claim (consciousness is fundamental and constitutive) is undermined.
      *   *Requirement:* The phenomenal character of the macro-subject must be *intelligibly grounded* in the phenomenal characters of the micro-subjects and the way they are unified. It need not be "summation" in a simple additive sense, but cannot be wholly independent.
      *   *Position:* **Preference (Constitutive Camp)**. Separating composition from character summation risks abandoning constitutive explanation. Your candidate meets this via pattern + micro-characters.

  ### Key Positions on Your Questions
  *   **Collapse Risk:** A genuine criterion *can* avoid both universalism and atomism. Maximality (in your candidate) is the primary tool against universalism, while requiring a specific *kind* of relation (e.g., unity) counters atomism.
  *   **Iteration:** Should be allowed in principle. Maximality stops it *locally* (no larger unity containing *this* subject), but doesn't forbid distinct macro-subjects forming a new unity at a higher level.
  *   **Causal Integration Coherence:** **Not surrender; essential.** It provides the anchor for applying the criterion beyond paradigm cases. Ignoring it makes the criterion untethered and arbitrary for brains/split-brains/AI.
  *   **Composition vs. Character Summation:** **Cannot be fully separated.** A theory of composition must imply *something* about how macro-character arises, otherwise the "further subject" is experientially empty (contradicting panpsychism). How *tightly* constrained the macro-character is remains open.
  *   **Satisfiability:** **The list as specified is likely *unsatisfiable*.** The core tension is between **Definite Fact of the Matter** (requiring sharp boundaries) and the plausible **Non-Arbitrariness** demand. Causal integration in nature (brains, beehives) often exhibits *degrees* and functional overlaps, making sharp boundaries for "maximal connected unity" seem artificial or brute. **Non-Arbitrariness** is the hardest to meet for any non-universalist view; **Causal Integration Coherence** excludes the most candidates (e.g., pure information-integration without physical constraints). **If forced to abandon one, abandon Definite Fact of the Matter** (accepting some vagueness) to preserve grounding in reality and avoid brute stipulation.

  ### Candidate Scorecard (vs. Desiderata)
  *   **Your Bonding Micropsychism (Maximal Connected Unity):**
      *   `✔` Anti-Universal (Maximality)
      *   `✔` Anti-Atomist
      *   `?` **Causal Integration Coherence** (Depends: Is "unity" defined *by* or merely *correlated* with causal integration? Risk of disconnect)
      *   `✘` **Definite Fact** (Near-ties/borderline degrees of unity create vagueness)
      *   `✘` **Non-Arbitrariness** (Primitive unity relation is brute/stipulated)
      *   `✔` Iterative (In principle)
      *   `✔` Character Constraint (Pattern + micro-chars)
      *   **Verdict:** Fails key non-negotiables; brute & vague.
  *   **Cosmopsychism (Decomposition):**
      *   `✘` **Anti-Universal** (Starts with cosmic subject; decomposition criterion needed to avoid universalism)
      *   `✔` Anti-Atomist (Presumably)
      *   `?` Causal Integration Coherence (Depends on decomposition criterion)
      *   `?` Definite Fact (Depends on decomposition criterion)
      *   `?` Non-Arbitrariness (Depends on decomposition basis - often physical/fundamental)
      *   `✔` Iterative (Decomposition is hierarchical)
      *   `?` Character Constraint (Macro-character is a "part" of cosmic character - intelligibility varies)
      *   **Verdict:** Struggles with Anti-Universal; decomposition criterion faces similar challenges to bonding.
  *   **Non-Constitutive Emergence:**
      *   `✔` Anti-Universal (Typically restricts to complex systems like brains)
      *   `✔` Anti-Atomist
      *   `✔` Causal Integration Coherence (Emergence *based on* it)
      *   `✔` Definite Fact (Can be tied to clear thresholds)
      *   `✔` Non-Arbitrariness (Grounds emergence in physical complexity)
      *   `✔` Iterative (Possible)
      *   `✘` **Character Constraint** (Radical emergence breaks constitutive grounding; macro-phenomenology not grounded in micro-phenomenology)
      *   **Verdict:** Meets most except core constitutive commitment (Character Constraint). Abandons panpsychism.

  **Conclusion:** Your project's core tension is between demanding determinacy/sharply bounded composition (**Definite Fact**) and providing a non-arbitrary, non-brute criterion grounded in reality (**Non-Arbitrariness**, **Causal Integration Coherence**). Nature's gradualness and functional overlaps resist sharp boundaries for consciousness. **Your candidate fails primarily on brutality and vagueness.** To succeed, either embrace some ontological vagueness or find a way to ground the unity relation non-arbitrarily in fundamental physics/metaphysics (a monumental task). **Non-Arbitrariness** is the linchpin; failing here leaves panpsychism vulnerable.
