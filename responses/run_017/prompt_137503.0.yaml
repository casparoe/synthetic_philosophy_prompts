prompt: |-
  Hi — please act as an experienced facilitator of behavioural public policy workshops who also has a proper philosophy background on paternalism. Think carefully, brainstorm two or three genuinely different designs before you settle, and then give me the one you'd actually run.

  Context: I work in the policy team of a mid-sized city council, and I've just been handed the "behavioural insights" slot in induction week for our new cohort of policy advisers — about 24 of them, 90 minutes, 2pm right after lunch, in a room with a projector, a whiteboard, index cards, and no budget for cash incentives. Most are politics/economics/policy grads; roughly a third are instinctively hostile ("nanny state, just tell people the facts and let them decide"); two or three did a behavioural-econ module and think revealed preference settles the whole question. Last year I ran it as a slide deck of the greatest hits — fruit at eye level, the organ-donor default, all that — and it completly died. Half the room said "that's just marketing" and the other half said "that's manipulation dressed up as kindness," and we never got past the slogans. So this time I want them to run into the problem themselves rather than hear me describe it. Please don't build the session around the famous examples everybody's already seen, and don't hand me a reading list or name-drop studies I'd have to look up: I need something I could run on Thursday with what's in the cupboard.

  The thing I want them to come away seeing is a distinction I've been chewing on and can't get straight myself. The same intervention seems to me to be able to do two quite different jobs: it can be a way of getting someone to do what they already, on reflection, want to do but predictably won't get around to — the deadline they blow, the form they never send back; or it can be a way of steering someone towards something they wouldn't choose if you asked them calmly and they had time. I've been calling these the "servant" version and the "author" version, but label them however is clearer. The distinction matters because the actual politics of nudging is nearly always about which one is being done, and you usually can't tell from the outside. There's a second thing I want them to feel, which I think of as the endorsement asymmetry: a person can sign off on an arrangement at the moment it's introduced, not knowing whether they'll be the one who later gets tempted, and then experience that same arrangement as an imposition at the moment it actually bites on them — and it's genuinely unclear which of those two moments should settle whether what was done to them was paternalistic.

  So: design me a session where that shows up in what happens, not in what I say. I'd like at least one real piece of choice architecture built into the room or the sign-up before they arrive — something they don't notice until I point at it, which then becomes Exhibit A — plus a main structured activity with roles, rules and small real stakes (chocolate, status, getting out ten minutes early, a mildly annoying task, whatever works without money) in which participants have to design or pick a default/opt-out arrangement while partly ignorant of what their own later self will want, and then live under it for a while. The servant/author distinction should be something they generate out of what happened to them, not something I define on a slide, and the word "paternalism" shouldn't be used at all until the last ten or fifteen minutes. Then give me the debrief: map specific moments onto the specific thing they're meant to see, say what you predict will go wrong the first time I run it — I already know about the tiny-stakes shrug and the two people who sussed the setup early and turned into professional contrarians, so give me fixes for those plus at least one failure mode I haven't thought of — and be honest about which part of this the activity simply can't produce and I'll have to say out loud myself.
reasoning: |-
  We are designing a workshop session for 24 new policy advisers. The goal is to have them experience and discover the distinction between interventions that help people achieve their own reflective goals vs. those that steer them toward outcomes they wouldn't choose reflectively. We also want them to feel the endorsement asymmetry (where a person agrees to an arrangement at one time but may resent it when it binds their future self). The session should avoid famous examples and not use the word "paternalism" until the end.

  Constraints: 
  - 90 minutes, right after lunch (so energy may be low)
  - Room with projector, whiteboard, index cards
  - No budget for cash incentives, but can use chocolate, status, early release, annoying tasks, etc.
  - Participants: mostly politics/economics/policy grads; about a third hostile to "nanny state", a few with behavioral econ background.

  Key elements:
  1. **Pre-set choice architecture**: Something in the room or sign-up that they don't notice until pointed out, which becomes Exhibit A.
  2. **Main activity**: Participants design or pick a default/opt-out arrangement while partly ignorant of their own future preferences, then live under it. Should have small real stakes.
  3. **Debrief**: Map the experience to the servant/author distinction and endorsement asymmetry without using the term paternalism until the end.

  Brainstorming three designs:

  **Design 1: The Workshop Snack Setup**
  - **Pre-set**: During sign-up, they were asked to choose a snack for the break (with options including healthy and unhealthy). The default was set to a healthy option (e.g., an apple) but they could change it. We don't reveal this until the activity.
  - **Main activity**: We split into groups and assign each group a policy scenario (e.g., retirement savings, organ donation, green energy). Each group must design a default rule for their scenario. Then we have a "future self" round where participants are assigned a role (e.g., a person who just got a raise and is tempted to spend, not save) and have to live under the rule they designed. Stakes: The group that designs the most popular rule (by vote) gets out early, but individuals might get chocolate if their personal outcome (in the role-play) is good.
  - **Problem**: Might be too abstract and the role-play might not feel real.

  **Design 2: The Annoying Task Lottery**
  - **Pre-set**: When they entered the room, they were given a colored index card (randomly) and told to keep it. They don't know why. This determines their group.
  - **Main activity**: We tell them we are going to have a lottery for an annoying task (e.g., cleaning the whiteboard, stacking chairs). But first, they must choose the lottery rules in groups. The rules are about defaults: e.g., default to entering everyone unless they opt out, or default to excluding everyone unless they opt in. Then we run the lottery under the rule they chose. The "winner" does the task (or if they opt out successfully, they don't). Stakes: The winner gets a small reward (chocolate) for doing the task? Or the group that designed the rule that is chosen by vote gets out early, but the individual who gets the task is compensated. This might make the stakes conflicting.
  - **Problem**: The annoying task might be too trivial, and the compensation might not feel like real stakes.

  **Design 3: The End-of-Session Release Time**
  - **Pre-set**: The sign-up email had a line at the bottom: "By attending this session, you agree to stay until the scheduled end time unless you explicitly opt out of this requirement by replying to this email." We don't mention it until the session.
  - **Main activity**: We split into groups and give each group a choice: design a rule for how we end the session. Options: 
    - Default 1: Everyone stays until 3:30 unless they individually opt out at the break (by handing in a card).
    - Default 2: Everyone can leave at 3:20 unless they individually opt in to stay (by handing in a card). 
    - Or other variations. 
    Then, we actually implement the rule for the last part of the session. The groups present their rule, we vote, and the winning rule is implemented. Then at 3:20 (if we are doing an opt-out), we let people leave if they opted out. Stakes: Getting out 10 minutes early is a real incentive. Also, we might have a small reward for those who stay (if the rule requires staying) to make it a trade-off.
  - **Problem**: The pre-set might be too obvious if we reveal it at the start? But we can delay the reveal.

  **Chosen Design: Design 3 (modified) because it uses a real stake (time) and the pre-set is directly tied to the activity. We can call it "The Early Release Experiment".**

  **Detailed Session Plan:**

  **Pre-set (before they arrive):** 
  - In the sign-up email, include: "By attending this session, you agree to stay until the scheduled end time (3:30 PM) unless you explicitly opt out of this requirement by replying to this email by Tuesday 5 PM." (Set a deadline that has passed.) We don't mention this at the start.

  **Session Flow (90 minutes):**

  1. **Introduction (5 minutes)**: 
     - Welcome, introduce yourself. 
     - "Today we're going to do something a bit different. We're going to run an experiment together about how we make group decisions and set up rules. We'll have a group activity and then a discussion. The goal is to think about how small changes in the way choices are presented can affect outcomes."

  2. **Exhibit A: Reveal the Pre-set (10 minutes)**:
     - Ask: "How many of you read every word of the sign-up email?" (Few hands.)
     - Reveal: "In that email, there was a line that said: [show on slide]. By attending, you agreed to stay until 3:30 unless you opted out by replying by Tuesday 5 PM. How many of you opted out?" (Probably none, because they didn't notice or didn't act.)
     - "So, according to this, you are all committed to staying until 3:30. But we're going to change that now. We're going to redesign the rule for ending this session. Let me explain the activity."

  3. **Main Activity: Designing the Release Rule (30 minutes)**:
     - Split into 4 groups of 6 (use the colored index cards they got at entry to assign randomly).
     - **Task**: Each group designs a rule for how participants can leave early (at 3:20). They must choose one of two base structures (or create their own, but we nudge them to these):
       - **Opt-Out Default**: Everyone is eligible to leave at 3:20 *unless* they opt out (by handing in an index card during the break). If they opt out, they must stay until 3:30 and do a quick task (e.g., write one thing they learned on a card and hand it in) but get a small reward (a chocolate).
       - **Opt-In Default**: Everyone must stay until 3:30 *unless* they opt in to leave early (by handing in an index card during the break). If they leave early, they forgo the chance at a reward (chocolate) and also miss a "bonus tip" (something trivial but framed as valuable, like a shortcut for policy work).
     - Groups have 15 minutes to design their rule (they can tweak the details, but must pick a default structure). They must also prepare a one-minute pitch for why their rule is fair and effective.
     - Then, each group pitches (4 minutes total). We vote by secret ballot (on index cards) for the rule we want to implement. The winning rule is announced.

  4. **Implement the Rule (10 minutes)**:
     - We have a 5-minute break at 3:15. During the break, participants can hand in their index card to opt in/out (depending on the winning rule). 
     - After the break, at 3:20, we implement the rule: 
       - If Opt-Out Default: Those who did not hand in a card can leave. Those who handed in a card (opting out) stay and get chocolate and the bonus tip (which is a printed card with a useful policy website or a tip like "Always check the default settings in forms").
       - If Opt-In Default: Those who handed in a card (opting in) can leave. Those who did not must stay and get chocolate and the bonus tip.

  5. **Debrief (35 minutes)**:
     - Start by asking about the experience: 
       - "How did it feel when you saw the rule in the email and realized you were bound by it without having actively consented?" (Map to endorsement: they agreed by attending, but didn't notice until later.)
       - "When you were designing the rule in your group, what were you thinking about? Did you consider what you might want later in the session? Did you know if you'd want to leave early or stay?"
       - "When it came time to decide (during the break), was it easy or hard? Did you know what you wanted? Did the rule influence what you did?"
     - Draw a timeline on the board:
       - Time 1: Design time (when they made the rule in the group)
       - Time 2: Decision time (break, when they opted in/out)
       - Time 3: Outcome time (3:20, when the rule was implemented)
     - Ask: "At which of these times did you feel the rule was serving you? At which times did it feel like it was imposing on you? Why?"
     - Without labeling it, tease out the two types of interventions:
       - "Did anyone design a rule that they thought would help people do what they really wanted but might not get around to? (e.g., if they wanted to stay for the reward but might forget and leave without it?)"
       - "Did anyone design a rule that they thought would steer people toward a particular choice? (e.g., encourage more people to stay by making staying the default?)"
     - Finally, introduce the terms (last 10 minutes):
       - "In behavioral policy, we often talk about two ways an intervention can work: one is like a servant, helping you do what you already intend but might not get around to. The other is like an author, writing a script that leads you to an outcome you might not have chosen if you'd stopped to think. Which did we see today?"
       - "And when we agreed to the rule at Time 1 (design) but then at Time 3 (outcome) some of us might have felt it was imposed, what does that tell us about the timing of consent?"
       - Now (if time) connect to paternalism: "This is at the heart of debates about paternalism. The same tool can be used in two very different ways, and the difference is often about whose goals are being served and when we are asked to endorse the arrangement."

  **Predicted Failure Modes and Fixes:**

  1. **Tiny-stakes shrug**: Participants might not care about 10 minutes or a chocolate.
     - **Fix**: Frame the stakes as meaningful: "10 minutes of your time back" is valuable, especially after lunch when they might be tired. Also, the bonus tip should be something genuinely useful (e.g., a template for policy briefs). Make the chocolate good quality. Emphasize that this is a simulation of bigger stakes.

  2. **Contrarians**: Two people figure out the setup and try to game it or object.
     - **Fix**: When splitting groups, assign them to different groups. During the activity, if they object, say: "That's a valid point, but for the sake of the experiment, let's play along and we can discuss in the debrief." Also, the group design phase might engage them because they can argue for their preferred rule.

  3. **New failure mode: Groupthink in rule design**.
     - One group might dominate the voting, or groups might all choose the same rule type because it's obvious. Then we don't get variation.
     - **Fix**: Assign the base structures to groups. Tell Group 1 they must design an opt-out default, Group 2 an opt-in default, Group 3 can design either, Group 4 must create a new structure. This forces variation.

  4. **Time management**: The activity might run over.
     - **Fix**: Have strict timekeepers (use a timer on the projector). Assign a participant as timekeeper for each group. Cut pitches to 1 minute each.

  5. **Low energy after lunch**:
     - **Fix**: Keep the activity interactive. Stand up during group work. Use the break to move around.

  **What the Activity Can't Produce and You Must Say:**
  - The activity won't explicitly distinguish between the servant and author versions in the abstract. It will generate raw material (their experiences), but you must help them see the pattern and label it. Also, the endorsement asymmetry might be felt but not articulated. You'll need to draw it out and then frame it in the debrief.

  **Supplies Checklist:**
  - Index cards (for group assignment, voting, and opt-in/out).
  - Chocolate (enough for about half the room?).
  - Printed bonus tips (trivial but useful, e.g., a list of behavioral insights resources or a policy hack).
  - Timer.
  - Slides for the email reveal and instructions.

  This design avoids famous examples, builds in real stakes (time, chocolate, a small task), and creates an experience where the servant/author distinction and endorsement asymmetry emerge naturally. The pre-set email clause is Exhibit A, and the main activity makes them designers and subjects of choice architecture.
answer: |-
  Below is a carefully designed workshop session based on your constraints and goals. I've prioritized **experiential learning** over lecture, built around a real-time activity that forces participants to confront the "servant vs. author" distinction and endorsement asymmetry through direct experience. The design uses **time** and **social pressure** as stakes (no budget needed), avoids famous examples, and embeds choice architecture in the room setup. I'll first outline the core structure, then the step-by-step flow, and finally the debrief/failure modes.

  ---

  ### **Core Design Concept: "The Policy Priority Draft"**  
  **Activity Summary:**  
  Groups design a "priority-setting" rule for a shared task, under partial ignorance of their own future preferences. The rule includes defaults/opt-outs that participants must live by during the session. Stakes involve getting out early (time), avoiding a mildly annoying task (sorting index cards), and small social rewards (public recognition).  

  **Key Mechanics:**  
  - **Pre-set Choice Architecture (Exhibit A):** The seating arrangement defaults them into groups based on an "invisible" opt-out in the sign-up email.  
  - **Main Activity:** Groups draft a policy memo under time pressure, using a default rule they design. Halfway through, a "crisis" forces them to reevaluate, revealing conflicts between their past and present selves.  
  - **Stakes:**  
    - **Time:** Winning group leaves 10 mins early.  
    - **Task:** Losing group sorts all session index cards into categories.  
    - **Social Reward:** Best memo gets displayed (trivial but leverages professional pride).  

  **Why This Works:**  
  - The "servant" (helping people follow through) vs. "author" (steering choices) distinction emerges when groups design rules *for themselves* while ignorant of the "crisis," then react to it.  
  - Endowment asymmetry hits when they realize they endorsed rules earlier that now feel imposed.  
  - Uses only projector, whiteboard, and index cards. No jargon until the end.  

  ---

  ### **Step-by-Step Session Flow (90 mins)**  
  **Pre-Set Before Arrival:**  
  - In the sign-up email, include: *"This session involves group work. If you prefer not to be grouped, reply to opt out by 5 PM yesterday."*  
    - Place opt-outers at a separate "solo table" (likely empty, as no one replies). For everyone else, pre-assign groups via colored index cards on seats (e.g., blue card = Group 1).  

  #### **Part 1: Intro & Exhibit A Reveal (10 mins)**  
  - **Start (2:00 PM):** "Welcome! Today is about designing policy tools that work *with* human behavior. We’ll simulate a real policy task."  
  - **Exhibit A Reveal (2:05):** Point to grouped seating. Ask:  
    - *"How many noticed the seating assigned you to groups?"*  
    - *"How many knew you could’ve opted out via email? Why didn’t you?"* (Likely: overlooked, forgot, low stakes).  
    - **Key Point:** *"This was your first policy tool: a default group assignment. You ‘agreed’ by not opting out, but it only bites now. Keep that in mind."*  
    - **Visual:** Sketch a timeline on the whiteboard: "Sign-up → Now → Later."  

  #### **Part 2: Main Activity - Policy Priority Draft (45 mins)**  
  **Setup (5 mins):**  
  - Split into 4 groups of 6 using colored cards. Give instructions:  
    *"Your task: Draft a 3-point policy memo for ‘improving public park usage’ in 25 mins. The twist: You must use a ‘Priority Rule’ your group designs now.*  
    *Rules:  
    - Default: One policy area must be prioritized (e.g., "safety" or "accessibility").  
    - Opt-out: Anyone can veto the default, but it costs 2 mins of your time to argue.*  
    *Stakes:  
    - Best memo (vote) gets displayed + leaves 10 mins early.  
    - Last-place group sorts all session index cards into themes (annoying, takes 10 mins)."*  

  **Group Work (25 mins):**  
  - Groups have 10 mins to design their rule (e.g., "Default to safety; opt-out requires drafting an alternative").  
  - Then 15 mins to draft memos using their rule.  
  - **Facilitator Moves:**  
    - Circulate and seed tension: *"What if your default isn’t what people really care about?"*  
    - **Inject Crisis (at 2:30):** Interrupt: *"Breaking news! Budget cuts mean one priority must be cut. You have 2 mins to adjust your memo—no rule changes allowed."* (This creates conflict between their past-designed rule and present desires).  

  **Voting (5 mins):**  
  - Groups pitch memos (30 sec each). Vote via index cards for "most convincing." Announce winner/loser.  

  #### **Part 3: Rule Implementation & Stakes (10 mins)**  
  - Winning group leaves at 3:05 PM (early).  
  - Losing group stays to sort index cards (annoying task).  
  - Others (middle groups) get "social reward": Their memos are projected.  

  #### **Part 4: Structured Debrief (25 mins)**  
  **Guided Discussion (15 mins):**  
  - Start experiential: *"How did it feel when the budget crisis hit? Did your rule help or hurt?"*  
  - Surface servant/author distinction:  
    - *"Which groups designed rules to help you *follow through* on what you already wanted? Which designed rules to *steer* the group toward a goal?"* (Note answers on whiteboard: "Help vs. Steer").  
    - *"When did you feel the rule was ‘yours’? When did it feel imposed?"*  
  - Highlight endorsement asymmetry:  
    - *"At sign-up, you ‘agreed’ to grouping by not opting out. When did that feel fair? When did it not?"*  
    - *"When you designed your priority rule, did you know the crisis was coming? How would you design it now?"*  

  **Label Concepts (Last 10 mins):**  
  - Introduce terms: *"What you called ‘help’ is like a servant—helping people do what they’d choose if they had willpower. ‘Steer’ is like an author—writing the story for them. The tension between these is where policy gets messy."*  
  - Connect to paternalism: *"Some call this paternalism. But notice: the *same tool* can be both, depending on who sets it, when, and what they know."*  
  - **Close:** *"Your job as policymakers: When does a default ‘help’ vs. ‘hijack’? And whose voice matters—past you, present you, or future you?"*  

  ---

  ### **Debrief Map: How Activities Reveal Key Concepts**  
  | **Moment in Session** | **Reveals This Concept** | **Facilitator Question to Unpack** |  
  |------------------------|---------------------------|-----------------------------------|  
  | **Exhibit A (seating)** | Endorsement asymmetry: They agreed to grouping passively, but only feel it now. | *"When did you feel the default helped you? When did it feel like an imposition?"* |  
  | **Rule design phase** | Servant vs. author: Groups design rules while ignorant of "crisis," leading to steering. | *"When you made your rule, were you trying to help or direct? Did you know what future-you would want?"* |  
  | **Budget crisis** | Conflict between past/present selves: Their rule bites when context changes. | *"Did your rule still feel like it served you? Or did it feel like it was authored by someone else?"* |  
  | **Stakes (losing group sorts cards)** | Real stakes make the imposition tangible (not theoretical). | *"How did it feel to live under a rule you designed but now resent?"* |  

  ---

  ### **Predicted Failure Modes & Fixes**  
  1. **"Tiny-stakes shrug" (e.g., no one cares about sorting cards):**  
     - **Fix:** Amplify social stakes. Announce: *"The sorted cards will shape our next staff meeting agenda!"* Or mock-dramatize: *"Group 4, you’ve been condemned to… CARD SORTING!"* Use peer pressure—applause for winners, playful boos for losers.  

  2. **Contrarians game the system (e.g., opt out of everything to "prove a point"):**  
     - **Fix:** Pre-empt by framing the activity as a "collective experiment." If someone refuses, say: *"Your choice! But if you sit out, you’ll miss the data to critique it later."* Redirect to the debrief: *"Note how your reaction mirrors real-world responses—we’ll unpack that."*  

  3. **Overly abstract discussion (e.g., econ grads debate revealed preference):**  
     - **Fix:** Ground them in the activity. Ask: *"In this room, did revealed preference hold? When you didn’t opt out of grouping, did that ‘reveal’ you wanted it?"* Point to the crisis: *"Did your vote at the start reveal what you’d want now?"*  

  4. **NEW Failure Mode: "Crisis" feels contrived, breaking immersion.**  
     - **Why it happens:** Policy grads may see the budget cut as a silly twist.  
     - **Fix:** Make the crisis credible. Tie it to real context: *"Based on last year’s park survey, 60% of citizens now prioritize cost over safety—adjust now!"* Use the projector to "simulate" a news alert.  

  5. **NEW Failure Mode: Groups design identical rules (no variance to discuss).**  
     - **Fix:** Secretly assign different constraints. Tell Group 1: *"You represent cost-conscious citizens,"* Group 2: *"You represent safety advocates,"* etc. This forces rule diversity.  

  ---

  ### **What the Activity Can’t Produce (Requires Your Voice)**  
  - **The servant/author distinction won’t self-label.** Participants will *feel* the difference (e.g., "Our rule backfired!" vs. "It saved us time!") but won’t call it "servant/author." You must frame it in the last 10 mins using their language (e.g., "help vs. steer").  
  - **Endorsement asymmetry needs framing.** They’ll experience frustration (e.g., "I didn’t know the crisis would happen!") but won’t generalize to policy. In the debrief, explicitly link to the timeline: "At Time 1 you agreed; at Time 2 you rebelled—which moment should we trust?"  

  ---

  ### **Prep Checklist (What’s in the Cupboard)**  
  - **Pre-set:** Email opt-out clause, colored index cards for grouping.  
  - **Activity:** Index cards for voting/memos, timer (projector), whiteboard for timeline.  
  - **Stakes:** Chocolate (for memos displayed), a box of mixed index cards for sorting task.  
  - **Contingencies:**  
    - If no one loses motivation, *you* be the "crisis" by forcing a rule change.  
    - If energy lags post-lunch, use humor: *"If this were a real policy draft, we’d be caffeinated. Use that imagination now!"*  

  This design forces your cohort into the creator *and* subject role, making the "servant vs. author" tension visceral. By the end, even skeptics will have felt the ambiguity of "help" vs. "steering"—and you’ll have the receipts (their reactions) to prove it. Run it tight, and they’ll leave arguing not about "nanny states," but about how to tell the difference.
