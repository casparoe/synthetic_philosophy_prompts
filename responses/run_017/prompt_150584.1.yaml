prompt: |-
  I'm in the third-year seminar on consciousness at a UK philosophy department, and this term we have a peer-marking exercise: each of us has been given one anonymised script from the mid-term and asked to mark it against the rubric the seminar leader set. Mine is on epiphenomenalism and the paradox of phenomenal judgment. I've read it four times now and I genuinely cannot tell whether it's a first-class answer or a fluent one that quietly conflates two things and slips a step — I don't want to reward confident prose, so I'd be grateful for a second reading from someone who knows the literature. I haven't formed a view on it and I don't want to lead you, so I'm giving you the question as set and the script verbatim.

  The question as set (out of 100; bands are below 40 fail, 40–59 pass, 60–69 upper second, 70+ first, and the rubric says to reward accurate statement of the view and of the paradox, correct allocation of the dialectical work to the arguments that actually do it, engagement with the contrastive variant, and care in the individual inferential steps):

  "Epiphenomenalism about phenomenal consciousness holds that phenomenal states are caused by physical processes but cause nothing outside the phenomenal domain. The paradox of phenomenal judgment is the worry that this view undermines its own motivation: my judgment that I am conscious — the judgment on which the case against physicalism appears to rest — cannot itself have been caused by my being conscious. In the seminar we distinguished two readings of 'phenomenal judgment': the propositional reading, on which it is a belief with the content that one is in such-and-such phenomenal state, and the experiential reading, on which it is a judgment episode that itself has phenomenal character. We also considered a variant I called contrastive epiphenomenalism: phenomenal states cause nothing non-phenomenal, but they may cause other phenomenal states (an experience causing a later memory-experience of it, for instance). Assess whether contrastive epiphenomenalism, together with the experiential reading of phenomenal judgment, escapes the paradox, or whether the paradox is untouched by these moves. In your answer say what work the distinction between causal explanation and epistemic justification is doing, and whether an epiphenomenalist who concedes the paradox has thereby refuted herself."

  The script I have to mark (anonymised, submitted as a single paragraph set out in sections):

  Epiphenomenalism is the thesis that phenomenal properties are causally inert with respect to the non-phenomenal: they are produced by physical processes but produce nothing outside the phenomenal domain. It is standardly motivated by two premises together — the causal closure of the physical, and a principle of causal exclusion that rules out the systematic overdetermination of physical effects by both physical and phenomenal causes. Given both, whatever causal work consciousness appeared to do is already done by its neural basis, and consciousness drops out as an idle wheel: the whistle on the engine, which makes a noise but drives nothing.

  The paradox of phenomenal judgment is that this saws off the branch the view is sitting on. The case for taking phenomenal consciousness as something over and above the physical begins from our own case: I judge that I am in pain, and it is that judgment the physicalist is accused of being unable to accommodate. But if my being in pain causes nothing, then my judgment that I am in pain is not caused by my being in pain, and the same two premises apply to it: the judgment has a complete physical cause and the pain is excluded from the story. It matters here to distinguish causal explanation from epistemic justification; the paradox is not that my judgment lacks a cause, since of course it has a neural one.

  Contrastive epiphenomenalism — phenomenal states cause nothing non-phenomenal, but may cause further phenomenal states — looks like it helps, and on the experiential reading I think it dissolves the paradox outright. On that reading the judgment that I am in pain is not a bare belief standing outside the phenomenal domain; it is itself an episode with phenomenal character, rather like the experience of its seeming to one that one is in pain. Since it is a phenomenal state, the earlier pain is permitted to cause it, and so the epiphenomenalist can say after all that my being in pain is what produces my judgment that I am in pain. The causal chain the paradox said was missing is restored, and with it the explanation of why my judgments about my own consciousness are reliable. Contrast the propositional reading, where the judgment is a belief with content and so falls outside the phenomenal domain: there the paradox does bite, and the epiphenomenalist must fall back on saying that the belief is made true by, and non-causally constitutively tied to, the pain.

  Two further points. The evolutionary worry — that natural selection could never have reached a causally inert property — is not much of an objection, since the epiphenomenalist can say that selection operated on the neural processes and consciousness came along as a by-product of them. And if the epiphenomenalist cannot answer the paradox, she has refuted herself: a position that removes the justification for believing its own central premise is not one that can be held. That, in the end, is why the knowledge argument and epiphenomenalism stand or fall together — Mary's acquisition of a new fact just is her acquisition of something causally inert.

  What I need from you:

  1. A mark out of 100, with one line saying which band it falls in and why.
  2. Point-by-point comments I can paste into the marking sheet, keyed to the script in order: for each substantive move, whether it is correct, and where it is not, what exactly goes wrong. I'm especially concerned about whether the treatment of the experiential reading rests on a conflation, and about whether that closing paragraph gets the dialectic right — please be specific about which claim each argument actually supports, rather than saying something is "a bit quick".
  3. A note on severity, so I can calibrate: which of the problems you find, if any, are the kind of thing that should cost marks in a third-year script, and which are infelicities I should mention in the margin without penalising.

  Epistemically: please separate, in your comments, what is settled or close to orthodoxy among people who work on this from what is genuinely contested. I don't want to hand a student feedback that presents one side of a live dispute as the consensus — where specialists really do disagree, tell me that, and either suggest a comment that flags the disagreement instead of adjudicating it, or state clearly that the line is your own view. Please also flag anything you are not confident about rather than guessing, since I can check with the seminar leader. No references or reading are needed; I only need the mark and the comments. Please write in British English.
reasoning: |-
  Hmm, this is an interesting marking challenge from a third-year philosophy student. They've been tasked with peer-marking an essay on epiphenomenalism and the paradox of phenomenal judgment, and want my help assessing whether this anonymised script deserves a first-class mark.

  The student seems genuinely uncertain whether this is a brilliant answer or one that subtly conflates concepts. I appreciate their epistemic caution - they haven't formed a view yet and don't want to lead me. The rubric focuses on accurate statement of views, correct dialectical mapping, engagement with contrastive epiphenomenalism, and careful inference.

  Looking at the script, it's actually quite sophisticated. It clearly defines epiphenomenalism and the paradox, correctly identifies the causal closure/exclusion premises, and understands the experiential vs propositional distinction. The core argument is that contrastive epiphenomenalism combined with experiential judgment dissolves the paradox because phenomenal states can cause other phenomenal states. 

  But I need to scrutinize carefully. Does this solution really work? The script claims it restores causal chains and reliability of judgments. But reliability might require more than just causation - it needs appropriate causal connection to content. This is where the conflation worry might lie: the essay seems to slide from "pain causes judgment-experience" to "this explains reliability" without showing how the phenomenal character of judgment links to its content about pain. That's a significant gap.

  The closing paragraph makes a strong claim that epiphenomenalism and the knowledge argument stand or fall together. While related, they aren't strictly inseparable - one could reject the knowledge argument but still worry about epiphenomenalism's consequences. The self-refutation point is correctly identified though.

  For marking: This is clearly upper-second class work (65-69) - it demonstrates good understanding but has two substantive flaws. The reliability gap is a significant oversight in a third-year script, costing about 5 marks. The knowledge argument overstatement is minor (2-3 marks). The evolutionary point is well-handled.

  I'll provide detailed comments matching the script's structure, flagging where claims are orthodox vs contested. The reliability point is my interpretation but well-grounded in the literature; the knowledge argument link is more debatable. I'll suggest phrasing feedback carefully where disputes exist.

  The student should know this is strong work despite flaws - many undergraduates miss these nuances. My suggested mark of 66/100 reflects its strengths while noting where precision falters.
answer: |-
  Here is a comprehensive assessment of the script based on your requirements. I’ve adhered to British English, separated orthodox/contingent claims, flagged uncertainties, and keyed comments to the script’s structure.  

  ---

  ### 1. **Mark and Band**  
  **66/100 (Upper Second, 60–69)**  
  **Why:** The answer accurately defines key concepts, engages thoughtfully with the contrastive variant and experiential reading, and demonstrates a strong grasp of the dialectic. However, it makes a significant misstep in assuming causation implies reliability (undermining its solution to the paradox) and overstates the link between epiphenomenalism and the knowledge argument. These issues prevent it from reaching first-class precision.  

  ---

  ### 2. **Point-by-Point Comments**  
  *(Keyed to script sections, with orthodox/contingent claims noted)*  

  #### **§1: Definition of epiphenomenalism and motivation**  
  > *"Epiphenomenalism is the thesis that phenomenal properties are causally inert... drops out as an idle wheel."*  
  - **Correct.** Orthodox statement of epiphenomenalism and its motivation (causal closure + exclusion). Accurately notes overdetermination avoidance.  

  #### **§2: The paradox of phenomenal judgment**  
  > *"The paradox of phenomenal judgment is that this saws off the branch... neural one."*  
  - **Correct.** Clear explanation of the paradox. Crucial distinction between causal explanation (addressed) and epistemic justification (the real worry) is correctly highlighted. Orthodox framing.  

  #### **§3: Contrastive epiphenomenalism + experiential reading**  
  > *"Contrastive epiphenomenalism... why my judgments about my own consciousness are reliable."*  
  - **Partially incorrect.**  
    - **Correct:** Contrastive epiphenomenalism permits pain → judgment-experience causation *on the experiential reading* (since both are phenomenal). This is orthodox and well-applied.  
    - **Conflation/Error:** Asserts causation restores "the explanation of why my judgments are reliable". **This is a substantive slip.** Causation ≠ reliability. A judgment-experience caused by pain might still misrepresent it (e.g., if the causal link is non-introspective). The paradox’s core is *justification*: why should we trust judgments not causally sensitive to their truth-makers? *This conflation quietly undermines the solution.*  
  - **Dialectical misstep:** The argument conflates restoring a causal chain with resolving the epistemic challenge. Reliability requires appropriate causal *sensitivity*, not mere causation.  

  #### **§3: Propositional reading contrast**  
  > *"Contrast the propositional reading... constitutively tied to, the pain."*  
  - **Correct.** Orthodox treatment: propositional judgments (non-phenomenal) can’t be caused by pain, forcing non-causal explanations (e.g., constitutive ties).  

  #### **§4: Evolutionary worry & self-refutation**  
  > *"The evolutionary worry... operated on the neural processes... by-product."*  
  - **Correct.** Standard epiphenomenalist reply to evolutionary objections. Orthodox.  

  > *"And if the epiphenomenalist cannot answer the paradox... stand or fall together."*  
  - **Partially correct.**  
    - **Correct:** If the paradox holds, epiphenomenalism *is* self-refuting (it undermines justification for believing in consciousness). Orthodox point.  
    - **Overreach:** Claims epiphenomenalism and the knowledge argument (KA) *must* "stand or fall together". **This is contested.** Some hold KA can be answered without epiphenomenalism (e.g., via representationalism). While *Mary’s new fact* being causally inert is a common epiphenomenalist move, it’s not the only option. Specialists disagree here.  
    - **Dialectical issue:** The KA link is tangential to the essay’s question. It doesn’t refute the core argument but overstates a contested connection.  

  ---

  ### 3. **Severity and Penalty Justification**  
  - **Significant penalty (-7 marks):**  
    - **Failure to resolve the paradox (-5 marks):** The conflation of causation with reliability is a **major flaw** in a third-year script. It directly undermines the essay’s central argument (that contrastive + experiential escapes the paradox). Rubric requires "care in inferential steps" – this misses a critical inference: *how* causation justifies reliability.  
  - **Minor penalties (-2 marks):**  
    - **Overstated KA link (-1 mark):** A tangential overstatement, but shows incomplete dialectical focus.  
    - **Structure (-1 mark):** Single paragraph/section format impedes clarity (a marginal infelicity, but worth noting).  
  - **No penalty for:**  
    - Evolutionary point (handled well).  
    - Definitions/paradox setup (accurate).  
  - **Strengths compensating:** Depth on contrastive/epistemic-causal distinction (+4 marks above base upper-second).  

  **Balance:** 73 (raw) -7 (reliability error) -2 (minor) = **66/100**.  

  ---

  ### 4. **Epistemic Notes**  
  - **Orthodox:**  
    - Epiphenomenalism’s definition/motivation (causal closure/exclusion).  
    - The paradox’s structure (causal vs. epistemic).  
    - Contrastive epiphenomenalism permitting intra-phenomenal causation.  
    - Evolutionary objection reply.  
    - Self-refutation risk if paradox holds.  
  - **Contested/Uncertain:**  
    - **Causal reliability conflation:** While specialists agree *mere causation ≠ justification*, the essay’s error is uncontroversial. Flag as a consensus gap.  
    - **KA link:** Genuinely disputed. Feedback should note: "Some philosophers (e.g., Chalmers) link KA to epiphenomenalism; others (e.g., Tye) reject this. The connection isn’t necessary."  
  - **Confidence:**  
    - 95%+ on reliability conflation (core literature: Chalmers, Jackson, Kriegel all stress the justification gap).  
    - 80% on KA link being overstated (consensus that alternatives exist, but epiphenomenalists often embrace the link).  

  ---

  ### **Suggested Feedback Snippets**  
  - For §3’s error: *"You correctly note that contrastive epiphenomenalism allows pain to cause the judgment-experience. However, causation alone doesn’t explain reliability – the judgment might still misrepresent the pain if the causal link isn’t truth-tracking. The epistemic worry (justification) persists."*  
  - For KA overreach: *"While epiphenomenalism is often deployed to answer the KA, this isn’t strictly necessary – e.g., physicalists might deny Mary gains new propositional knowledge. The link is defensible but not compulsory."*  
  - Overall: *"A sophisticated engagement that accurately maps the dialectic but slips in assuming causation ensures reliable judgment. This leaves the paradox unresolved."*  

  This should equip you to mark fairly while highlighting where the script’s fluency masks philosophical gaps. If your seminar leader emphasises different nuances (e.g., on the KA), defer to their framing.
