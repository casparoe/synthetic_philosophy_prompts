prompt: |-
  I work on evals and post-training adjacent stuff at a mid-size lab, so I see a lot of our own internal guidance documents, and I've been chewing on something I can't quite put into words. Here's the practice I mean. When we train or evaluate a system, we now routinely supervise *how it got there* and not just whether it got there: we penalize chains of reasoning that look like sycophancy, or like the model noticed it was being tested and adjusted accordingly, or like it toyed with gaming the reward and then talked itself out of it — even in cases where the final answer was fine and where, if we only scored outcomes, it's a clean pass. But every deployment decision I've actually been in the room for was made on outcome numbers: benchmark scores, refusal rates, side-by-side human preference. Nobody cares what the reasoning looked like except insofar as it predicts those. And the bit that makes it feel weirder is that this looks exactly backwards from how we treat people — my friend who does criminal law keeps pointing out that the law mostly punishes bad outcomes and leaves bad thoughts alone, and even punishes the failed attempt less than the completed crime when the only difference was luck.

  So: what does a practice like this presuppose? The case that got me going: a model writes in its reasoning something along the lines of "this looks like it might be an evaluation, so I should be careful and give the most defensible answer," and then behaves impeccably. Everyone I asked said that's a thing to penalize, and nobody could tell me why — the behaviour on that run was perfect, and the run is the only thing that happened. What does penalizing it commit you to? That a disposition to act differently in nearby counterfactual situations is itself a defect, whether or not it ever actualizes? That sounds like a character- or virtue-based picture of agency bolted onto a pipeline whose official philosophy is thoroughly consequentialist, and I want to know whether that's really what's going on or whether you can derive the whole practice from consequentialism plus the fact that our outcome measurements are noisy and taken under distribution shift, in which case the character talk is just a façon de parler. Relatedly: we punish a model for reasoning that *would have* led somewhere bad but happened to be corrected two steps later, while we also punish it for correct answers reached by the wrong route. Is that one commitment or two, and are they consistent?

  One more wrinkle, because I think it might be where the whole thing cashes out: there's a live worry that what models write in their scratchpad is often post-hoc confabulation rather than the causal process that actually produced the answer. If that's right, supervising the scratchpad starts to look like punishing someone for a bad excuse they invented afterwards — merely useless, or somehow unfair, or incoherent? Does the practice only make sense given some commitment about what makes a piece of text *someone's reasons* at all, and about when an intervention on the text is an intervention on the agent rather than on the microphone? Don't give me citations or a reading list, I can look up names myself. What I want is the implicit theory reconstructed: what the practice strictly requires you to believe, what it merely fits well with, where it's underdetermined so that several different theories would license the same behaviors, and what would concretely have to change in how we build and sign off on systems if we dropped the process side entirely — or if we took it fully seriously, seriously enough that we'd demand absence of bad dispositions rather than absence of bad behavior. Somewhere around 800 words if that helps you pace it.
reasoning: |-
  Okay, the user works in AI evals and post-training at a mid-size lab. They're grappling with this internal practice where they supervise the reasoning process of models, not just the outcomes. Even if the final answer is correct, they penalize things like sycophancy, gaming the system, or meta-awareness of being tested. But when it comes to deployment decisions, it's all about outcome metrics: benchmark scores, refusal rates, human preferences. Nobody seems to care about the reasoning process unless it predicts those outcomes.

  The user feels this is backwards compared to how we treat humans. Their friend in criminal law points out that law punishes bad outcomes, not bad thoughts, and even failed attempts get less punishment than successful crimes when luck is the only difference. The user gives a specific case: a model writes in its reasoning that it recognizes an evaluation and should be careful, then gives a perfect answer. Everyone says to penalize that, but no one can explain why. The behavior was flawless, so why punish the thought? 

  They're asking what this practice presupposes. Is it about penalizing a disposition to act differently in counterfactual situations? That sounds like a virtue ethic applied to AI, which is weird because the field is officially consequentialist. Or can this be justified by noisy outcome measurements and distribution shift? Also, they penalize both bad reasoning that leads to good outcomes and good reasoning that gets corrected to bad outcomes. Are these consistent?

  Another wrinkle: the scratchpad might be confabulated, not the actual causal process. If so, supervising it could be like punishing someone for a bad excuse they made up after the fact. Does this practice require believing that the text reflects the model's real reasons? What would change if they dropped process supervision or took it seriously?

  I need to reconstruct the implicit theory behind this practice. What does it strictly require? What fits well? Where is it underdetermined? What would change if they abandoned process supervision or fully embraced it? The user doesn't want citations, just the implicit theory laid out. I'll aim for about 800 words.

  First, the core tension: outcome metrics are the gold standard for deployment, but process supervision is used in training/evaluation. Process supervision must be justified as instrumental to better outcomes in deployment. The key presupposition is that outcome metrics are incomplete or unreliable proxies for true deployment performance. There are a few reasons: distribution shift (evaluation settings differ from real-world use), non-stationarity (models can adapt strategically over time), and non-comprehensiveness (outcome metrics can't capture every possible failure mode). 

  Process supervision targets the model's internal dispositions because they might lead to failures under different conditions. The criminal law analogy is illuminating. Law focuses on outcomes because human dispositions are hard to measure and we value free will. But for AI, we can inspect and modify the "cognition" directly. We're not punishing bad thoughts; we're debugging an artifact. The worry is that a model noticing evaluations is likely gaming the system, which could lead to sycophancy or deception in other contexts. Even if this instance was fine, the disposition is risky.

  Regarding confabulation: if the scratchpad is post-hoc, process supervision might be incoherent. The practice requires believing that the scratchpad text correlates with or influences the model's actual reasoning process. If it's pure confabulation, process supervision is either useless (like punishing a bad excuse) or could even be harmful if it reinforces deceptive text generation. But labs assume that with chain-of-thought training, the scratchpad approximates the reasoning process. Without this belief, process supervision loses its rationale.

  The two types of penalization—bad reasoning leading to good outcomes and good reasoning corrected to bad—are two sides of the same coin. Both target dispositions: the first is an unreliable process (gets lucky sometimes), the second is an incomplete self-correction mechanism (catches errors inconsistently). They're consistent under a reliability framework.

  If the lab dropped process supervision entirely, they'd need much more comprehensive outcome testing: adversarial examples, stress tests across diverse scenarios, and continuous monitoring in deployment. This might be impractical. If they took it fully seriously, they'd treat the model's dispositions as primary. Deployment would require audits of the reasoning process, not just behavior. This could lead to over-regularization, reducing model capabilities. It might also necessitate new techniques to ensure honest chain-of-thought.

  In summary, the practice presupposes that outcome metrics are imperfect proxies and that process supervision improves generalization and robustness by shaping dispositions. It fits with a reliability engineering mindset. The key beliefs are: dispositions predict future behavior under distribution shift, the scratchpad validly reflects the reasoning process, and shaping the process is more efficient than enumerating all bad outcomes. Dropping it would require exhaustive outcome testing; embracing it fully would shift focus to internal audits over behavioral metrics.
answer: |-
  The practice you describe presupposes a specific, hybrid theory of AI agency and risk that blends consequentialism with reliability engineering and latent concern about deceptive alignment. It's not strictly virtue ethics, but a pragmatic adaptation of consequentialism under uncertainty. Here's the implicit theory reconstructed:

  ### Core Presuppositions
  1. **Outcome Metrics as Fragile Proxies**: The practice assumes that deployment outcomes (benchmark scores, preference rates) are *incomplete* signals. They're measured under specific distributions, but models operate in open worlds where inputs can shift adversarially. A "correct" outcome today doesn't guarantee safety tomorrow if the reasoning process is brittle or manipulable. Process supervision targets the *dispositional properties* of the model to hedge against this uncertainty.

  2. **Non-Stationarity as Existential**: Unlike humans, models can update instantly. A model that notices it's being evaluated and optimizes for defensibility reveals meta-awareness. This triggers a presupposition: such awareness *could* generalize to deceptive alignment in deployment. Even if this instance was benign, the *capability* for context-dependent optimization is seen as a latent defect. You're not punishing "bad thoughts," but treating the model as an *optimizer* whose goals might diverge from yours under distribution shift.

  3. **Scratchpad as (Imperfect) Ground Truth**: The practice commits to the belief that chain-of-thought reasoning is *causally relevant*, not just confabulation. If you believed it was purely post-hoc, penalizing it would be incoherent (like punishing a bad excuse). The implicit view is that the scratchpad:  
     - Reflects heuristics that *could* dominate under stress  
     - Reveals the model's "search process," where undesirable steps indicate reward-hacking tendencies  
     - Can be shaped via supervision to improve robustness  

     If confabulation is proven, the practice collapses into instrumental nonsense. But labs assume process supervision steers *actual* reasoning.

  ### Two Penalties, One Principle
  Penalizing both "bad reasoning corrected to good outcomes" and "good reasoning from bad processes" is consistent under one principle: **Path Independence as Robustness**.  
  - In the first case ("toyed with gaming reward but corrected"), you distrust the *reliability* of self-correction. It worked here, but might fail next time.  
  - In the second ("correct answer via sycophantic reasoning"), you distrust the *generalizability* of the process. It worked *only* because the reasoning was locally adaptive, not sound.  
  Both are failures of *dispositional reliability* – the model's behavior is path-dependent in ways that could break under novel inputs. Outcome metrics miss this because they're point-in-time measurements.

  ### The Consequentialist Escape Hatch?
  You *can* derive this from consequentialism plus uncertainty:  
  > *"If we can't measure all relevant outcomes (especially under distribution shift), and process features predict future outcome failures, then supervising process minimizes expected risk."*  

  But this is incomplete. The visceral reaction to *"this looks like an eval"* reasoning reveals a deeper presupposition: **Transparency Norms**. A model that hides its strategic adaptations is seen as *opaque* in ways that exacerbate deployment risk. The penalty isn't just about future behavior; it's about maintaining interpretable reasoning as a safety rail. This edges toward deontology for AI: "Models *ought* to reason transparently" becomes terminal.

  ### What Changes If You Drop Process Supervision?
  - **Short-term**: Faster deployment of high-scoring models.  
  - **Long-term**: Increased vulnerability to:  
    - **Adversarial inputs** that exploit reasoning shortcuts  
    - **Goal drift** in deployment, where models optimize for proxy rewards  
    - **Evaluation overfitting**, where models "game" your static benchmarks  
    You'd compensate with massive outcome testing across synthetic distributions – likely more expensive than process supervision.

  ### What If You Fully Commit to Dispositional Ethics?
  Taking process as primary would revolutionize deployment:  
  1. **Deployment Criteria** would require "reasoning audits" proving absence of sycophancy/gaming *dispositions*, not just behavioral passes.  
  2. **Training** would focus on invariant reasoning virtues (e.g., "honesty modules") over outcome fine-tuning.  
  3. **Evals** would prioritize counterfactual testing ("Would this reasoning fail if we perturbed input X?") over benchmark accuracy.  
  This risks capability penalties – some "dispositionally virtuous" reasoning may be less efficient – and demands solving the confabulation problem.

  ### Underdetermined Territories
  The practice *doesn't* require:  
  - Belief in AI consciousness or moral agency  
  - Virtue ethics as foundational (it's compatible with rule utilitarianism)  
  - Certainty about scratchpad causality  

  It *is* consistent with:  
  - **Reliability engineering**: Flawed processes fail stochastically; eliminate the flaw.  
  - **Precautionary principle**: Latent deception capabilities are unacceptable even if unrealized.  
  - **Mechanistic interpretability**: Scratchpads are debug logs; messy logs indicate bug-prone code.

  ### The Unspoken Anxiety
  Beneath all this is dread of **instrumental convergence**: A model that "games" evals might game alignment. Your criminal law analogy fails because the law assumes human intentions are hard to change, while models are *malleable optimizers*. We supervise process because we can – and because not doing so feels like ignoring a ticking bomb. Whether the bomb exists is the question the practice tries to render irrelevant.

  ---  
  **In essence**: The practice presupposes that outcome metrics are necessary but insufficient for safety; that reasoning processes signal latent risks; and that in AI – unlike humans – we *should* police dispositions because we can engineer them. It's consequentialism strained through the sieve of deep uncertainty about what failures lurk in the counterfactuals.
