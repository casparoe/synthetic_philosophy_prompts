  We are going to build up to the result that an evidential decision theorist (EDT) in a large population with correlated agent-types can be rationally required to cooperate in a one-shot Prisoner's Dilemma (PD) with a stranger. The key is that the agent's own action provides evidence about the type of agent they are, and hence about the actions of other similar agents (including the stranger). We must avoid several misconceptions.

  The plan is for a 90-minute whiteboard session. We will proceed step by step, with each step building on the previous one.

  **Outline of the Session:**

  1. **The Prisoner's Dilemma (PD) Setup (10 minutes)**
     - Present the payoff matrix for a one-shot PD:
          - Both cooperate: (R, R)
          - You cooperate, other defects: (S, T)
          - You defect, other cooperates: (T, S)
          - Both defect: (P, P)
       with T > R > P > S and 2R > T+S (so that mutual cooperation is better than alternating).
     - Standard causal dominance reasoning: No matter what the other does, you get a higher payoff by defecting (because T>R and P>S). So defect is the dominant strategy.
     - Why is this one-shot? Emphasize: no future interactions, no reputation.

  2. **Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT) (15 minutes)**
     - EDT chooses the action that, conditional on performing it, leads to the best outcome. It uses conditional probabilities: U(A) = sum_{O} P(O | A) * Utility(O).
     - CDT uses causal influence: U(A) = sum_{O} P( [O] would result if I did A ) * Utility(O). It typically uses do-calculus or causal models.
     - The gap: In some situations, P(O | A) ≠ P( [O] would result if I did A ). The classic example is Newcomb's problem: 
          - Box A: $1000 if predictor thought you would take only B, else $0.
          - Box B: $100 always.
          - EDT conditions on your action: P(Box A has $1000 | you take only B) is high (because you are the kind of person who takes only B and the predictor knows that), so it says take only B.
          - CDT severs the correlation: it says your action doesn't cause the predictor's past decision, so you should take both.
     - But we are not using Newcomb's problem today. We are going to build a similar gap without a predictor.

  3. **The Population Picture (20 minutes)**
     - Imagine a large population of agents. Each agent has a "type" that determines how they play in the PD. The type might be "cooperator" (always cooperates) or "defector" (always defects) or more complex.
     - You are one agent drawn from this population. The stranger you are playing is another draw from the same population.
     - The key: the types of agents are not independent. There is a joint distribution over types. In particular, if the population has clusters of similar agents, then knowing your own type gives you information about the type of the stranger (because you are both drawn from the same distribution and there is correlation).
     - We model: 
          - Let θ be your type and θ' be the stranger's type.
          - The joint distribution P(θ, θ') is such that θ and θ' are positively correlated (for example, because the population has groups of similar agents).
     - Your decision: You are not certain of your own type! You have some prior over types. When you choose an action, you are also learning about your type (and hence about the stranger's type).

  4. **The Decision Problem in the Population (15 minutes)**
     - You are about to play the PD with a stranger. But you are uncertain about your own type and the stranger's type.
     - The action you take (cooperate or defect) will provide evidence about your type. For example, if you decide to cooperate, that might make it more likely that you are a cooperator, and then (because of the correlation) more likely that the stranger is a cooperator too.
     - So in EDT:
          - U(cooperate) = P(stranger cooperates | I cooperate) * R + P(stranger defects | I cooperate) * S
          - U(defect) = P(stranger cooperates | I defect) * T + P(stranger defects | I defect) * P
     - The question: When is U(cooperate) > U(defect)?

  5. **The Threshold Inequality (15 minutes)**
     - We derive the condition for cooperation to be better under EDT.
          U(C) > U(D)
          => [P(stranger C | I C) * R + P(stranger D | I C) * S] > [P(stranger C | I D) * T + P(stranger D | I D) * P]
     - Rearranging, we get:
          P(stranger C | I C) * R + (1 - P(stranger C | I C)) * S > P(stranger C | I D) * T + (1 - P(stranger C | I D)) * P
     - Let:
          p_C = P(stranger C | I C)
          p_D = P(stranger C | I D)
     - Then:
          p_C * (R - S) + S > p_D * (T - P) + P
          => p_C * (R - S) - p_D * (T - P) > P - S
     - We can also write:
          (p_C - p_D) > [ (P - S) - p_D*(T - P) + p_C*(S - R) ] / (R - S)   [This is messy. Let me rearrange differently.]

     Alternatively, we can rearrange as:
          p_C * (R - S) - p_D * (T - P) > P - S

     - But note: R - S and T - P are both positive (from the PD inequalities). So the left-hand side is a weighted difference of the conditional probabilities.

     - The critical point: If the correlation is strong enough, then p_C (the probability the stranger cooperates given you cooperate) is much higher than p_D (the probability the stranger cooperates given you defect). Then the left-hand side can be positive and large enough to exceed P-S (which is negative? Wait: P-S is negative because P>S? Actually, in PD, P>S, so P-S is positive? Let's check: we have P > S, so P-S is positive. But the left-hand side: R-S is positive, T-P is positive. So we have:

          p_C*(R-S) - p_D*(T-P) > P - S

     Since P-S is positive, the left-hand side must be sufficiently positive.

     - Alternatively, we can express the condition as:

          (p_C - p_D) > [ (P - S) + p_D*(T - P) - p_C*(R - S) ] / (R - S)   [Not the best]

     Let me define:
          Let Δp = p_C - p_D   (the increase in the probability that the stranger cooperates when you cooperate versus when you defect)

     Then the condition becomes:

          Δp > [ (P - S) + p_D*(T - P) - p_C*(R - S) ] / (R - S)

     But note that we can write:

          Δp > [ (P - S) - (p_C*(R - S) - p_D*(T - P)) ] / (R - S)   [This is circular]

     Actually, let me rearrange the original inequality:

          p_C*(R-S) - p_D*(T-P) > P - S

          => Δp * (R-S) + p_D*(R-S) - p_D*(T-P) > P - S

          => Δp * (R-S) + p_D*( (R-S) - (T-P) ) > P - S

     Note: (R-S) - (T-P) might be negative? Because T>R and P>S, so T-P > R-S? Actually, we don't have a direct relation. But note that T + S < 2R? That doesn't directly help.

     Alternatively, we can express in terms of the payoffs and the conditional probabilities.

     - We can also note that p_C and p_D are both between 0 and 1. The condition is more likely to hold when:
          - Δp is large (strong correlation)
          - R is much larger than P (so mutual cooperation is very good)
          - T is not too much larger than R (so the temptation isn't too big)
          - S is not too bad (so being exploited isn't catastrophic)

     - We will use one example to illustrate.

  6. **The Central Example (15 minutes)**
     - We need an example that satisfies:
          - No predictor (so no Newcomb's apparatus).
          - One-shot, no repetition.
          - No literal duplicates: similarity is graded and statistical.
          - The correlation must be natural and read off the setup.

     - Example: **The Island Model**
          - There are many islands. Each island has a group of agents. The agents on the same island are similar to each other. The population is large, and agents are randomly paired (possibly from the same island or different islands).
          - You are an agent. You know you are on an island, but you don't know which one. The islands vary in how cooperative they are. On some islands, most agents are cooperators; on others, most are defectors.
          - Specifically, each island has a "cooperation rate" ρ, which is the fraction of cooperators on that island. The ρ for different islands are drawn from a distribution (say, a beta distribution, but we don't need to specify). 
          - You are paired with a stranger. There is a chance that the stranger is from your island (high correlation) or from another island (low correlation). But to simplify, let us assume that the pairing is random within the entire population. However, because of the island structure, two agents from the same island are more likely to be the same type.

     - How does this work in the math?
          - Let θ be your island's cooperation rate (but note: you don't know your island's ρ). You are a cooperator with probability ρ (if we assume that given ρ, types are independent). But actually, we can think of your type as being drawn from the island's ρ.
          - We want: P(stranger cooperates | I cooperate) and P(stranger cooperates | I defect).

     - Alternatively, we can assume that the entire population is divided into clusters (islands). The fraction of agents in cluster i is w_i. In cluster i, the fraction of cooperators is ρ_i. You are randomly assigned to a cluster (with probability w_i) and then your type is drawn (cooperator with probability ρ_i). The stranger is drawn similarly.

     - But note: if you are both from the same cluster, then the correlation is high. If from different clusters, independent.

     - Let the probability that the stranger is from your cluster be α (and 1-α that they are from a different cluster). Then:

          p_C = P(stranger C | I C) 
               = P(same cluster | I C) * P(stranger C | same cluster, I C) + P(different cluster | I C) * P(stranger C | different cluster, I C)

          But note: if same cluster, then the stranger's cooperation probability is ρ (the same as your cluster's ρ). And given ρ, your cooperation and the stranger's are independent? Actually, we are conditioning on I C. 

          However, we must use Bayes to update on our own action.

     - This gets complex. Instead, we can use a simpler model:

          - Suppose there are two types of clusters: "high" and "low". 
          - High clusters: ρ_h fraction cooperators.
          - Low clusters: ρ_l fraction cooperators (with ρ_h > ρ_l).
          - The prior probability that a random cluster is high is q.

          - You are in a cluster. You don't know if it's high or low. You are about to decide to cooperate or defect? But wait: in our model, your type is fixed? Or are you deciding? 

          We must be careful: in the standard setup, an agent's type determines their action. However, we are allowing the agent to choose. So we are introducing a notion of "free will" but with the agent being uncertain of their own type.

          Alternatively, we can think: the agent's type is their disposition. The agent does not know their own disposition? Then when they choose, they are revealing their disposition? 

          Actually, we can model: the agent has a disposition that is either cooperator or defector. But they don't know it. Then when they choose, they are effectively revealing their disposition. Then the correlation between agents in the same cluster comes from the fact that they share the same environment that makes cooperators more likely.

          So:

          - Let D be your disposition (C or D). You don't know D. You choose an action A (which might be the same as D, or might be chosen freely?).

          How do we model the choice? We are assuming the agent is an evidential decision theorist. So they choose the action that maximizes conditional expected utility.

          But note: if the agent chooses to cooperate, then that act provides evidence that they have a cooperative disposition. And if the cluster has a high fraction of cooperators, then the stranger (from the same cluster) is more likely to be a cooperator.

          So we can model:

          - Your disposition D is drawn from your cluster's ρ. The stranger's disposition D' is drawn independently from the same ρ (if same cluster) or from a different ρ (if different cluster).

          - Then:

              P(stranger C | you choose A) = ?

          This is getting complicated.

     - Instead, we can use a very simple model: **The Bernoulli Model**

          - The population is characterized by a single parameter ρ, the overall cooperation rate. But there is correlation: the probability that two randomly selected agents are both cooperators is not ρ^2 but ρ^2 + c, for some covariance c.

          - But we need a model where the action you take provides evidence about ρ, and hence about the stranger.

          - We can use: ρ is unknown with a prior distribution (say, uniform on [0,1]). Then:

              P(stranger C | I C) = E[ ρ | I C ]   (because given ρ, the stranger is independent? but note: if we condition on ρ, then the actions are independent. However, we are conditioning on the action of one agent, which gives information about ρ.)

              Specifically, by Bayes:

                  P(ρ | I C) ∝ P(I C | ρ) * P(ρ) = ρ * P(ρ)

              So E[ρ | I C] = ∫ ρ * [ρ * P(ρ) dρ] / ∫ [ρ * P(ρ) dρ] = E[ρ^2] / E[ρ]

              Similarly, P(stranger C | I C) = E[ρ | I C] = E[ρ^2]/E[ρ]

              And P(stranger C | I D) = E[ρ | I D] = E[ρ(1-ρ)] / E[1-ρ]   [since P(I D | ρ)=1-ρ]

          - Now, note:

              E[ρ^2] = Var(ρ) + (E[ρ])^2

              So:

              p_C = [Var(ρ) + (E[ρ])^2] / E[ρ] = E[ρ] + Var(ρ)/E[ρ]

              p_D = E[ρ | I D] = [E[ρ] - E[ρ^2]] / [1 - E[ρ]] = [E[ρ] - (Var(ρ) + E[ρ]^2)] / [1 - E[ρ]] 
                   = [E[ρ] - Var(ρ) - E[ρ]^2] / [1 - E[ρ]]

          - The difference p_C - p_D is positive (since Var(ρ)>0) and can be large if the variance is large.

          - Then we plug into the threshold condition.

     - However, this model is abstract. We want something concrete.

     - Alternatively, we can use a two-point prior for ρ:

          - Suppose ρ is either ρ_h (high) or ρ_l (low), with probabilities q and 1-q.
          - Then:

              p_C = P(stranger C | I C) 
                   = P(ρ=ρ_h | I C) * ρ_h + P(ρ=ρ_l | I C) * ρ_l

              where P(ρ=ρ_h | I C) = P(I C | ρ_h) * P(ρ_h) / P(I C) = [ρ_h * q] / [ρ_h * q + ρ_l * (1-q)]

              Similarly, P(ρ=ρ_l | I C) = [ρ_l * (1-q)] / [ρ_h * q + ρ_l * (1-q)]

              So p_C = [ρ_h^2 * q + ρ_l^2 * (1-q)] / [ρ_h * q + ρ_l * (1-q)]

              Similarly,

              p_D = P(stranger C | I D) 
                   = P(ρ=ρ_h | I D) * ρ_h + P(ρ=ρ_l | I D) * ρ_l
                   = [ (1-ρ_h) * q * ρ_h + (1-ρ_l) * (1-q) * ρ_l ] / [ (1-ρ_h)*q + (1-ρ_l)*(1-q) ]

          - We can choose numbers. Let:

              ρ_h = 0.9, ρ_l = 0.1, q = 0.5

              Then:

              P(I C) = 0.9*0.5 + 0.1*0.5 = 0.5
              p_C = [0.9^2 *0.5 + 0.1^2 *0.5] / 0.5 = [0.81*0.5 + 0.01*0.5] / 0.5 = (0.405 + 0.005) / 0.5 = 0.41 / 0.5 = 0.82

              P(I D) = 1 - 0.5 = 0.5
              p_D = [ (1-0.9)*0.5 * 0.9 + (1-0.1)*0.5 * 0.1 ] / 0.5 
                   = [0.1*0.5*0.9 + 0.9*0.5*0.1] / 0.5
                   = [0.045 + 0.045] / 0.5 = 0.09 / 0.5 = 0.18

              So p_C = 0.82, p_D = 0.18, so Δp = 0.64.

          - Now plug into the inequality:

              p_C*(R-S) - p_D*(T-P) > P - S

              Let's use standard PD payoffs: 
                  T = 5, R = 3, P = 1, S = 0.

              Then left-hand side: 0.82*(3-0) - 0.18*(5-1) = 0.82*3 - 0.18*4 = 2.46 - 0.72 = 1.74
              Right-hand side: P-S = 1 - 0 = 1.

              1.74 > 1 -> true.

              So cooperation is better.

          - What if the variance is smaller? Suppose ρ_h=0.6, ρ_l=0.4, q=0.5:

              p_C = [0.6^2*0.5 + 0.4^2*0.5] / (0.6*0.5+0.4*0.5) = [0.18+0.08]/0.5 = 0.26/0.5 = 0.52
              p_D = [0.4*0.5*0.6 + 0.6*0.5*0.4] / 0.5 = [0.12+0.12]/0.5 = 0.24/0.5 = 0.48
              Then left-hand side: 0.52*3 - 0.48*4 = 1.56 - 1.92 = -0.36 < 1 -> doesn't hold.

          - So the correlation must be strong enough.

     - This example has no literal duplicates, and the correlation is statistical (due to the common cluster). We did not need a predictor.

  7. **Defusing Misconceptions (built in throughout)**
     - **Misconception: This is the iterated dilemma under another name.**
          - Defuse: We are in a one-shot game. There is no future. The correlation comes from the population structure, not from repeated interaction.

     - **Misconception: The agent is treating its own action as bringing about the other's.**
          - Defuse: In EDT, the agent conditions on the action. It does not believe that the action causes the other's action. It only believes that the action is evidence about the other's action. In the island model, the reason is that the action reveals information about the cluster, which then informs about the stranger.

     - **Misconception: Exact copies make the answer trivial because there is really only one agent.**
          - Defuse: We are not using exact copies. In the island model, agents are similar but not identical. They are independent draws from the same cluster distribution.

     - **Misconception: The agent can manufacture the correlation by deciding.**
          - Defuse: The correlation exists in the population structure regardless of what the agent does. The agent does not create the correlation by their action; they only use the evidence provided by their action to update about the population.

     - **Misconception: The result either vindicates EDT generally or is explained by the world being large.**
          - Defuse: The result is specific to the correlation structure. In the absence of such correlation, EDT would defect. The world being large is only to ensure that we have a statistical distribution of types and that the pairing is random. But the key is the correlation, not the size per se.

  8. **The Mimic-Contrarian Case (10 minutes)**
     - Place this after the main example and the threshold inequality.
     - Setup: The population is half mimics (who do what you do) and half contrarians (who do the opposite). You don't know which you are facing.
     - Then:
          P(stranger C | I C) = P(mimic) * 1 + P(contrarian) * 0 = 0.5
          P(stranger C | I D) = P(mimic) * 0 + P(contrarian) * 1 = 0.5
          So p_C = p_D = 0.5 -> Δp=0.
     - Then the left-hand side of the inequality becomes:
          0.5*(R-S) - 0.5*(T-P) = 0.5*(R - S - T + P)
          And we compare to P-S.
     - Note: R - S - T + P is negative (because T>R and P>S, so T-P > R-S). So the left-hand side is negative, while P-S is positive. So the inequality fails: we don't have enough to make cooperation better.
     - In fact, plugging in the standard numbers:
          0.5*(3-0-5+1) = 0.5*(-1) = -0.5, which is less than P-S=1.
          So U(C) = 0.5*3 + 0.5*0 = 1.5
          U(D) = 0.5*5 + 0.5*1 = 2.5 + 0.5 = 3 -> defect is better.
     - What is the point? The correlation must be positive and strong enough. If the correlation is zero (as it is here on net) or negative, then the condition fails and EDT will defect.

  9. **Closing Question (5 minutes)**
     - Question: "In the island model, if you knew for sure that your island had a high cooperation rate (say ρ_h=0.9), then what would EDT recommend? And why is that different from when you are uncertain?"
          - Answer: If you are sure your island is high, then your action doesn't provide any new information about the island. So P(stranger cooperates | I cooperate) = P(stranger cooperates) = 0.9 (if the stranger is from your island) or the overall rate (if from the whole population). But note: in our setup, the stranger is from the whole population? We need to be consistent.

          However, in the original setup, you were uncertain. If you are certain about the island, then:
              - If you are also certain that the stranger is from your island, then P(stranger C) = 0.9 regardless of your action. Then:
                  U(C) = 0.9*R + 0.1*S
                  U(D) = 0.9*T + 0.1*P
              Since T>R and P>S, U(D) > U(C) -> defect.
          - The difference: When you are uncertain, your action provides evidence about the island, which then affects your estimate of the stranger. When you are certain, the evidence doesn't change anything.

          So the closing point: The mechanism only works when your action provides evidence about the type of the population (and hence about the stranger). If you are already certain about the population, then there is no evidence and EDT reduces to the standard dominance reasoning.

     - What we decline to settle:
          - Which decision theory (EDT or CDT) is correct? We only showed that in this setup, EDT can recommend cooperation. We haven't argued that this is the right recommendation.
          - What if the agent is already certain about what it will do? Then conditioning on an action that the agent is sure it won't take is problematic. We haven't addressed how EDT deals with such cases (the problem of known action). That's a deeper issue.

  **Timing Summary:**
  - 0-10: PD setup and dominance.
  - 10-25: EDT vs CDT and the gap (without Newcomb, just the definitions).
  - 25-45: Population picture and the idea of correlated types (island model).
  - 45-60: The decision problem under EDT and the expected utility expressions.
  - 60-75: Threshold inequality and the two-point example (with numbers).
  - 75-85: Mimic-Contrarian case (showing zero net correlation leads to defection).
  - 85-90: Closing question and wrap-up.

  **Important:** Throughout, emphasize that the correlation is a feature of the world, not created by the agent. And the agent is not causing the other's action; it's updating evidence.

  This plan should get the group to the result and defuse the stated misconceptions at the appropriate points.
answer: |-
  ### Lecture Plan: Evidential Cooperation in Large Worlds  
  *Goal: Show EDT agents can rationally cooperate in one-shot PD via statistical similarity correlations.*  
  **Total: 90 minutes, whiteboard-only, no pre-reading.**  

  ---

  #### **1. Prisoner’s Dilemma Setup (10 min)**  
  - **What**: Define the payoff matrix:  
    - (C,C) → (R,R)  
    - (C,D) → (S,T)  
    - (D,C) → (T,S)  
    - (D,D) → (P,P)  
    With \(T > R > P > S\) and \(2R > T + S\) (e.g., T=5, R=3, P=1, S=0).  
  - **Why**: Establishes the conflict—dominance reasoning says *defect* is rational:  
    - *Defuse "literal duplicates" misconception*: Emphasize this is a **stranger**—no shared identity.  
    - *Key point*: One-shot, no repetition—eliminates tit-for-tat or reputation.  

  ---

  #### **2. Evidential vs. Causal Decision Theory (15 min)**  
  - **What**: Contrast EDT and CDT:  
    - CDT: Maximize *causal* expected utility. "What will my action *cause*?"  
    - EDT: Maximize *conditional* expected utility. "What does my action *signal*?"  
    - Whiteboard: \(U_{EDT}(A) = \sum_{O} P(O \mid A) \cdot \text{Payoff}(O)\).  
  - **Why**: Introduces the **evidential/causal gap**—actions can correlate with outcomes without causing them.  
    - *Defuse "manufactured correlation" misconception*: Your action doesn’t *cause* the correlation; it *reveals* pre-existing statistical structure.  
    - *Stress*: No predictors (unlike Newcomb).  

  ---

  #### **3. Population Picture (20 min)**  
  - **What**: Sketch a large world with correlated agents:  
    - Population of \(N\) agents, divided into "similarity clusters" (e.g., labs, tribes).  
    - Your type \(\theta\) (e.g., "cooperator", "defector") is drawn from a cluster-specific distribution.  
    - Stranger is another draw from the population. Your action reveals your \(\theta\), which correlates with theirs.  
  - **Why**: Shows decisions are **statistical samples**—your action provides evidence about cluster tendencies.  
    - *Defuse "iterated dilemma" misconception*: Clusters create correlation without repetition.  
    - *Key constraint*: Similarity is **graded** (not duplicates)—clusters have varying cooperation rates.  

  ---

  #### **4. Threshold Inequality (15 min)**  
  - **What**: Derive when EDT prefers cooperation:  
    - Let \(p_C = P(\text{stranger cooperates} \mid \text{I cooperate})\)  
      \(p_D = P(\text{stranger cooperates} \mid \text{I defect})\).  
    - EDT cooperates if:  
      \[
      p_C R + (1 - p_C) S > p_D T + (1 - p_D) P
      \]  
      Rearranged:  
      \[
      \Delta p > \frac{(P - S) + p_D(T - P) - p_C(S - R)}{R - S} \quad \text{(simplify with numbers)}.
      \]  
    - For (T=5,R=3,P=1,S=0): \(\Delta p > \frac{1}{3} + \frac{2}{3}p_D\).  
  - **Why**: Quantifies **how strong correlation must be**—\(\Delta p = p_C - p_D\) must exceed a function of payoffs.  
    - *Defuse "vindicates EDT generally" misconception*: This holds only in worlds with specific correlation structures.  

  ---

  #### **5. Central Example: Island Model (15 min)**  
  - **What**:  
    - **Setup**: 100 islands. Each has 100 agents.  
      - "Cooperator-rich" islands: 90% cooperators.  
      - "Defector-rich" islands: 10% cooperators.  
      - You’re randomly assigned to an island (unknown type).  
      - Stranger is randomly selected from the whole population.  
    - **Evidence**:  
      - If you cooperate: \(\approx 82\%\) chance stranger cooperates (\(p_C \approx 0.82\)).  
      - If you defect: \(\approx 18\%\) chance (\(p_D \approx 0.18\)).  
      - \(\Delta p \approx 0.64\) (meets threshold: \(0.64 > \frac{1}{3} + \frac{2}{3}(0.18) \approx 0.45\)).  
    - **Result**: EDT expected utility:  
      - Cooperate: \(0.82 \times 3 + 0.18 \times 0 = 2.46\)  
      - Defect: \(0.18 \times 5 + 0.82 \times 1 = 1.72\) → **Cooperate wins**.  
  - **Constraints it satisfies**:  
    - **No predictors**: Correlation from population structure.  
    - **No duplicates**: Graded similarity (island cooperation rates vary).  
    - **No stipulation**: Correlation read off \(P(\text{same cluster})\) and Bayes’ rule.  
    - **One-shot**: No future interactions.  
  - **Why**: Concrete case where correlation forces EDT cooperation.  
    - *Defuse "treats own action as causing other’s" misconception*: Your action is *evidence* of your island type, which correlates with the stranger’s type.  

  ---

  #### **6. Mimic-Contrarian Case (10 min)**  
  - **Placement**: After threshold inequality, as a foil.  
  - **What**:  
    - Population: 50% mimics (copy your action), 50% contrarians (do opposite).  
    - Uncertainty: You don’t know who’s who.  
    - Then: \(p_C = P(\text{mimic}) \cdot 1 + P(\text{contrarian}) \cdot 0 = 0.5\)  
      \(p_D = P(\text{mimic}) \cdot 0 + P(\text{contrarian}) \cdot 1 = 0.5\).  
    - \(\Delta p = 0\) → Fails threshold (for T=5,R=3,P=1,S=0: \(0 \not> \frac{1}{3} + \frac{2}{3}(0.5) \approx 0.67\)).  
    - Result: Defect dominates (U(D)=2.5 > U(C)=1.5).  
  - **Purpose**: Shows **correlation must be net positive**—EDT cooperation fails when evidence is neutral.  
  - **Takeaway**: Group should see this as a boundary case—structure matters, not just "similarity exists."  

  ---

  #### **7. Closing Question (5 min)**  
  - **Question**: *"In the island model, if you knew your island was cooperator-rich, would EDT still recommend cooperation? Why/why not?"*  
    - **Correct answer**: No. If you know your island type, your action provides **no new evidence** about the stranger. Dominance (defect) reappears:  
      - \(U(C) = 0.9 \times 3 + 0.1 \times 0 = 2.7\)  
      - \(U(D) = 0.9 \times 5 + 0.1 \times 1 = 4.6\) → Defect wins.  
    - **Tests understanding**: Distinguishes evidence-based reasoning (mechanism) from "similarity = always cooperate" (slogan).  

  ---

  #### **What to Openly Decline**  
  - **Decision theory correctness**: "We’re not endorsing EDT—just showing its behavior in correlated worlds."  
  - **Agents certain of their action**: "What does conditioning mean if you’re sure you’ll do X? That’s a paradox for EDT we won’t resolve today."  
  - **Causal vs. evidential metaphysics**: "Why *does* correlation arise? That’s about the world, not decision theory."  

  ---

  #### **Misconception Defusal Sequence**  
  1. **"Iterated dilemma"**: After PD setup (no future, no reputation).  
  2. **"Action causes other’s move"**: During EDT explanation (signaling ≠ causing).  
  3. **"Exact duplicates trivialize"**: During population intro (graded similarity clusters).  
  4. **"Manufactured correlation"**: In EDT derivation (correlation pre-exists).  
  5. **"Vindicates EDT or requires bigness"**: At threshold inequality (depends on correlation structure, not size).  

  ---  
  **End with punchline**: *"In a world of statistically similar strangers, your choice to cooperate is evidence they’re like you—and EDT listens."*
