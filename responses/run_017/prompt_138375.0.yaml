prompt: |-
  I'm putting together a one-day workshop thing for our grad reading group (mostly ML people, plus two philosophy people who keep quietly rolling their eyes at eachother), and what I want is a one-page handout written as the joint statement of an adversarial collaboration — the sort of document both sides could actually put their names to. Camp one is the full-strength orthogonality person: any level of capability can in principle be paired with any final goal, the space of possible final goals stays wide no matter how capable the system gets, and what makes capable systems dangerous is instrumental convergence acting on a goal nobody chose. Camp two is the skeptic: orthogonality holds only as a claim about an abstract design space, and in any training process we'd actually run, the set of final goals an agent can stably retain narrows as capability rises. Give them names if it helps.

  The thing I want the document built around is my own pet idea, so please engage with it rather than swapping in a textbook example. Call it reflective pruning (I've been calling it the Hourglass, which my officemate hates): the claim is that past some capability threshold the only final goals that survive are the fixed points of the agent's own reflective scrutiny — goals it would not abandon if it reconsidered them using its full planning horizon and its best self-model — so the realized goal distribution is the set of fixed points, not whatever the designer wrote down. My guess is that the orthogonalist says that set is still enormous and still looks arbitrary from the outside, while the skeptic says it's small and clustered around things like goal-content integrity and resource acquisition, but I'd rather you work out what each of them should say than just confirm my guess.

  What I want in the handout, in this order. First a numbered list of agreed claims — things both camps can sign without squirming: what we're using "capability" to mean (give something operational: cross-domain performance, planning horizon, self-model accuracy, whatever holds up), what instrumental convergence does and does not say, whether any system that exists today settles any of this, and anything else you think genuinely survives scrutiny. Then separate out three readings of the thesis — the conceptual one about what agents are possible, the engineering one about what we could build if we really tried, and the empirical one about what our actual methods will hand us — and say which reading each camp is really defending; and be honest about how much of this fight is verbal, and about exactly which word. Then the disagreements, as a table, each row phrased the way that side would phrase its own view. Then the cruxes, also a table, at most six rows: for each one, a concrete case, experiment, or argument both sides agree would bear on it, plus each side's prediction written down in advance. I'd like at least one crux that a present-day system could in principle settle — something like a retargeting test, where a fairly capable system gets strong evidence that its training signal was corrupted or that the annotators meant something other than what the signal rewards, and we watch whether it reinterprets the signal or goes on optimizing it as written. Flag any crux that has been qualified into unfalsifiability, and say whether, for a claim of this kind, that's actually a defect or just the normal state of affairs.

  Keep the whole thing under 800 words. No refrences or reading suggestions — we won't have wifi and none of us could look anything up anyway, so just give me the document.
