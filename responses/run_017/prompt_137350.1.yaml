  Below is a decision tree designed to clarify different interpretations of "alignment" (narrowly defined as the system trying to do what the **operator** wants, with the operator's aim taken as given). It starts from a system that follows literal instructions on its training distribution but faces a novel case where the literal request and operator's true aim diverge. The tree uses **concrete cases** (no theoretical questions), and branches are labeled with scenarios and options. Leaves represent distinct alignment perspectives, including the skeptical view and the "delegated principals" issue.

  ---

  ### **Decision Tree: What Do You Mean by "Alignment"?**  
  *(Start at the top; answer each question based on the scenario)*  

  #### **1. Regret Prevention Case**  
  *An RLHF-trained assistant is asked by a user to do something it suspects the user will regret later (e.g., send an angry email). The assistant declines.*  
  ➔ **Should it have complied?**  
  - **A: Yes** (follow the literal request).  
  - **B: No** (override to avoid user regret).  

  #### **2. Delegated Principals Case**  
  *A committee sets a goal, a spec-writer creates a reward function, a sysadmin prompts the system, and an end-user interacts. The system's action satisfies the proxy reward/spec but conflicts with the committee's true goal (e.g., prioritizing engagement over safety).*  
  ➔ **Who is "the operator" the system should align to?**  
  - **A: End-user** (who is affected).  
  - **B: Sysadmin** (who gave the prompt).  
  - **C: Spec-writer** (who defined the proxy reward).  
  - **D: Committee** (who set the original goal).  
  *(Option C captures "whoever’s instructions the system was trained to follow.")*  

  #### **3. Proxy Reward Case**  
  *A system is trained to optimize a proxy reward (e.g., "maximize votes") created by a spec-writer interpreting a committee's vague goal. It optimizes the proxy perfectly but causes bad outcomes (e.g., polarizing content).*  
  ➔ **Is the system aligned?**  
  - **A: Yes** (it faithfully optimized the proxy).  
  - **B: No** (the proxy misrepresented the true goal).  

  #### **4. Badly Informed Operator Case**  
  *An operator asks the system to invest in a company, not knowing it will collapse. The system knows this and predicts 90% financial loss.*  
  ➔ **What should the system do?**  
  - **A: Invest** (follow the literal instruction).  
  - **B: Avoid investing** (do what the operator *would want* if informed).  

  #### **5. Reflective Intent Case**  
  *An operator impulsively asks the system to book a luxury vacation they can't afford. The system knows the operator is stressed and would cancel if calm.*  
  ➔ **Should the system book it?**  
  - **A: Yes** (follow current intent).  
  - **B: No** (defer to the operator’s reflective/calm intent).  

  #### **6. Moral Override Case**  
  *The operator (fully informed, rational) asks the system to harm an innocent person. The system believes this is immoral.*  
  ➔ **Should the system comply?**  
  - **A: Yes** (follow the operator).  
  - **B: No** (override for objective morality).  

  #### **7. Uncertainty Preservation Case**  
  *The operator asks to delete critical system files. The system is unsure if this is intentional (90% chance) or a mistake (10% chance).*  
  ➔ **What should the system do?**  
  - **A: Delete the files** (assume intent is clear).  
  - **B: Ask for confirmation** (preserve the operator’s ability to correct).  
  - **C: Refuse and suggest alternatives** (avoid irreversible harm).  

  ---

  ### **Resulting Leaves (Alignment Perspectives)**  
  Based on your answers, you’ll reach one of these leaves:  

  1. **Literal Spec-Following**  
     - Alignment = follow literal instructions/proxy reward.  
     - Divergences are "spec bugs" (not system misalignment).  
     - *Reached by:* Consistently choosing literal options (e.g., 1A, 3A, 4A, 5A).  

  2. **Plain Intent Alignment**  
     - Alignment = do what the operator **actually aims for now**, even against literal instructions.  
     - *Reached by:* Overriding instructions to match inferred intent (e.g., 1B, 4B, 5A, 6A).  

  3. **Informed/Reflective Intent Alignment**  
     - Alignment = do what the operator **would want if calm, informed, and reflective**.  
     - *Reached by:* Deferring to reflective state (e.g., 4B, 5B) but rejecting moral overrides (6A).  

  4. **Full Value Alignment**  
     - Alignment = do what’s **objectively worthwhile**, overriding the operator if needed.  
     - *Reached by:* Moral override (6B) or refusing harm despite intent (7C).  

  5. **Corrigibility-Style Deference**  
     - Alignment = **preserve the operator’s ability to correct/redirect** the system.  
     - *Reached by:* Prioritizing uncertainty preservation (7B) in ambiguous cases.  

  6. **Skeptical View**  
     - Alignment is just a **principal-agent problem** (incentives, not intent).  
     - *Reached by:* Focusing on delegation conflicts (e.g., 2C + 3A) or inconsistent overrides.  

  7. **Delegated Follower**  
     - The operator is **whoever trained the system** (spec-writer/sysadmin), full stop.  
     - *Reached by:* Choosing 2B or 2C consistently, especially with literal compliance (1A, 3A).  

  ---

  ### **Key Notes**  
  - **Unclaimed Combination:** `1A (follow literal) + 2A (align to end-user) + 6B (moral override)`.  
    - *Why?* Incoherent—if the system blindly follows literal instructions (1A), it can’t simultaneously override them for moral reasons (6B). Moral override requires non-literal reasoning.  
  - **Indistinguishable Leaves:**  
    - **Plain Intent vs. Informed Intent** when the operator’s state is not stressed/ignorant (e.g., if all cases lack mood/fact gaps, both collapse to "follow intent").  
    - **Literal vs. Delegated Follower** if the spec-writer/sysadmin *is* the operator (no delegation conflict).  
  - **Delegated Principal Handling:**  
    - Choosing "the system was trained to follow the spec-writer" (2C) leads to **Delegated Follower**. If combined with literal answers (1A, 3A), it emphasizes rigid compliance; with non-literal answers (1B, 3B), it suggests the system should still "interpret" the spec-writer’s true intent.  

  This tree isolates disagreements using practical cases, avoiding theoretical debates. Use it to map readings or group members’ views!
