prompt: |-
  I work in the appraisal unit of a national transport authority. Every year we allocate a fixed safety budget across candidate projects — junction redesigns, median barriers, bridge retrofits, level-crossing upgrades — by monetising each project's expected reduction in fatality risk using a single official figure, expressed in currency, for what is called the value of a statistical life. That figure comes from studies of how much extra pay workers in hazardous occupations have to be offered to accept additional risk of death on the job. We convert each project's expected lives saved into money at that rate, rank the projects by net monetised benefit, and fund them in that order until the budget is spent.

  Three features of this procedure strike me as pulling in different directions, and I can't tell whether they are in tension or whether I am missing the view that reconciles them.

  First, we use one number for everyone, even though the underlying studies report quite different trade-offs depending on whose behaviour you look at and in what occupation, and even though the individual circumstances of the people protected by any given project vary enormously. When I asked why we discard that variation, I was told that a single uniform number is what keeps the procedure non-judgmental: we are deferring to the trade-offs people actually make rather than substituting our own views about whose life matters more. But discarding the variation looks to me like the opposite of deference.

  Second, we refuse to count what people say. The authority also runs consultations in which residents are asked how much they would pay for safer junctions near them, and those answers are excluded from the ranking on the ground that hypothetical questions are not real choices. Yet the wage evidence we do rely on is also, in the end, a money-for-risk trade-off, inferred rather than requested; and the people whose risk we are reducing were never asked anything at all.

  Third, the procedure is justified entirely by deferring to each individual's own trade-offs, and then simply adds the resulting sums across different individuals — including, in the nature of the case, people who will never enjoy the benefit attributed to them.

  A consultant has now proposed that we stop averaging: infer each person's own valuation of risk from their actual behaviour — occupational choice, seatbelt use, smoking, and similar — and weight safety spending accordingly, so that those who live as though they set less store by their own lives receive less protection.

  What I want from you is a reconstruction of the implicit theory. What view of utility, or of what it is we are putting a number on, would make this procedure coherent? Which parts of it strictly require that view, and which are merely habits that would survive under rival views? Which rival views does the procedure quietly rule out? Is it internally consistent — in particular, in treating market behaviour as evidence while treating stated willingness to pay as none? Does the consultant's proposal follow from the same view, or does it rest on a misunderstanding of what a choice can reveal? And if we replaced the presupposed view with one on which what matters is how well lives actually go, what exactly would have to change in how projects are ranked, and would the resulting rankings differ much in practice?
reasoning: |-
  Okay, let me start by unpacking this user's query. They work in a transport authority's appraisal unit, using a Value of Statistical Life (VSL) to allocate safety budgets. They're questioning three aspects: using a single VSL for everyone, ignoring stated preferences, and aggregating individual trade-offs without considering who benefits. A consultant suggested using individual risk behaviors instead. The user wants to understand the implicit theory behind their current method, its coherence, internal consistency, and how alternatives might work.

  First, I need to recall the foundations of VSL. It's rooted in welfare economics and revealed preference theory. The idea is that individuals' actual choices in the market reveal their true valuations of risk. Using a single VSL is seen as respecting each person's autonomy without making judgments about whose life is more valuable. But the user points out that discarding variation seems contrary to deference. I should explain why uniformity is considered non-judgmental in this framework, even though it averages out differences.

  Next, the exclusion of stated preferences. The current method trusts only revealed preferences, like wage-risk trade-offs, because they involve real consequences. Hypothetical surveys are seen as unreliable. The user questions why inferred trade-offs from market behavior are valid while direct statements aren't. I need to clarify the epistemic distinction here: actual choices reveal true preferences, while hypotheticals might not reflect real intent. But is this distinction logically consistent? The user might be highlighting a contradiction if the wage studies also involve inference.

  The third point is about aggregation. The procedure sums up individual VSLs to get total benefits, even for people who don't benefit from the project. This relies on the Kaldor-Hicks criterion, assuming potential compensation. The user wonders if this is consistent with the individualistic foundation. Here, I should discuss how Kaldor-Hicks justifies aggregation without actual compensation, which is a pragmatic approach in policy-making.

  The consultant's proposal to use individual behaviors like smoking or seatbelt use to tailor protection seems logical under revealed preference. But this could lead to discrimination. The current uniform VSL avoids such judgments, even if it ignores personal variation. The user might be concerned about equity versus efficiency here. I need to address whether the consultant's approach aligns with the theory or misinterprets what choices reveal. Choices like smoking aren't purely about valuing life; other factors like addiction or information gaps play roles.

  If the system shifted to focus on well-being outcomes, like actual lives saved regardless of personal valuations, the approach would change. Prioritizing projects by lives saved per dollar, especially in high-risk areas, might favor vulnerable groups. The user is asking how rankings would differ in practice. Data shows lower-income areas often have higher accident rates, so a well-being approach might redirect funds there, unlike the current VSL method, which might favor wealthier areas where individuals have higher willingness-to-pay.

  Internally, is the procedure consistent? Relying on market behavior while ignoring stated preferences hinges on the belief that real choices are more credible. But wage studies also involve modeling and assumptions, similar to surveys. The user might be pointing out a tension here. I should acknowledge that while there's a theoretical distinction, in practice, both methods have limitations. However, the preference for revealed preferences is a methodological choice within welfare economics.

  The user's deeper needs might include a desire for a fairer system. They might be uncomfortable with the equity implications of using a uniform VSL that reflects average willingness-to-pay, which is income-dependent. They might also seek justification for possibly incorporating equity adjustments. Understanding the implicit theories helps them evaluate if the current method aligns with their authority's goals or if alternatives should be considered.

  I should also touch on practical implications. Switching to well-being metrics could shift funding to high-risk, potentially lower-income areas, making it more equitable. But quantifying well-being directly is challenging. The user needs a clear comparison of how rankings might change and the philosophical underpinnings of each approach.

  In summary, the user is grappling with the philosophical and practical tensions in their current appraisal method. They need a thorough dissection of the implicit theories, consistency checks, and a practical analysis of alternatives to inform potential reforms or validate the existing process.
answer: |-
  Your procedure rests on a specific, coherent (though contestable) philosophical foundation within **welfare economics** and **revealed preference theory**. Here's a breakdown of the implicit theory, its implications, and alternatives:

  ### The Implicit Theory: What Makes the Procedure Coherent
  1.  **Fundamental Premise: Individual Sovereignty & Revealed Preference:**
      *   What is being monetized? Not the "value of life" intrinsically, but the **individual's marginal willingness to pay (WTP) for a small reduction in their own risk of death.**
      *   Source of Value: Value is defined *subjectively* by individuals themselves, not by an external authority judging the "worth" of their life. The only valid way to discover this value is by observing **actual choices involving real trade-offs between money and risk** (e.g., hazardous job wages, purchasing safety equipment).
      *   Epistemic Stance: True preferences are revealed *only* through actions with real consequences ("revealed preference"). Hypothetical statements ("stated preference") are unreliable indicators of what people would *actually* choose when faced with real costs.
      *   Aggregation Principle: Social welfare is the simple **sum of individual welfares**, defined by their own preferences. The benefit of a project is the sum of the WTPs of all individuals whose risk is reduced.

  2.  **Justification for Uniform VSL:**
      *   **Anti-Paternalism & Anti-Discrimination:** Using a single average VSL avoids the government making explicit, morally fraught judgments that one group's life is "worth more" than another's based on income, age, location, or occupation. It respects the *principle* that everyone's preferences matter equally in the social calculus, even if their *expressed* WTP differs.
      *   **Practicality & Political Acceptability:** A single number is administratively simple and less likely to provoke controversy than a system explicitly valuing lives differently.
      *   **Interpretation of "Deference":** Deference isn't to each individual's *specific* WTP, but to the *mechanism* of revealed preference *in general*. The average VSL is seen as representing the "typical" or "representative" citizen's valuation derived from actual behavior, avoiding paternalism in *implementation* even if it averages out individual variation. Discarding variation is the price paid for avoiding discriminatory judgments.

  3.  **Rejection of Stated Preferences:**
      *   **Hypothetical Bias:** People often state much higher WTP in surveys than they demonstrate in actual market behavior where real money is at stake. They might overstate their concern to appear virtuous or underestimate budget constraints.
      *   **Strategic Bias:** Residents might inflate their stated WTP hoping to secure the safety project for their area.
      *   **Consistency with Epistemic Stance:** Only *actual* choices involving *real* trade-offs (like taking a risky job for higher pay) are considered reliable evidence of true preferences. Stated WTP is seen as fundamentally different in kind.

  4.  **Aggregation & Non-Beneficiaries:**
      *   **Kaldor-Hicks Efficiency:** The procedure implicitly relies on the Kaldor-Hicks criterion. A project is efficient if the monetized benefits (sum of individual WTPs) exceed the costs, *regardless* of whether the winners *actually* compensate the losers (in this case, taxpayers funding the project). It's about potential Pareto improvement – *in principle*, winners *could* compensate losers and still be better off.
      *   **Ex Ante Perspective:** The valuation is based on people's ex ante WTP to reduce a *statistical* risk they face, *before* knowing who the specific beneficiaries (or victims) will be. Everyone facing the risk values its reduction, even if they turn out not to be the one saved.

  ### Internal Consistency Assessment
  *   **Market Behavior vs. Stated WTP:** The procedure *is* internally consistent *within its own revealed preference framework*. It draws a clear, principled (though debatable) line: **Actual choices with real consequences (market behavior) reveal true preferences; hypothetical choices without consequences (surveys) do not.** The "inferred" nature of wage-risk studies involves statistical modeling of *actual* choices, which is fundamentally different, in this view, from asking hypothetical questions. The key distinction is the *reality of the trade-off*. The people whose risk is reduced weren't asked, but their valuation is *imputed* based on the behavior of a population deemed sufficiently similar in their revealed risk-money trade-offs.
  *   **Uniform VSL & Aggregation:** Using a uniform VSL and summing benefits across individuals is logically consistent with the goal of maximizing aggregate social welfare defined as the sum of individual WTPs, *if* you accept the average as a reasonable proxy for the population's marginal WTP and the Kaldor-Hicks criterion.

  ### The Consultant's Proposal: Coherent or Misguided?
  *   **Coherent within Revealed Preference?** The proposal *pushes the logic of revealed preference to its extreme*. If the goal is to respect each individual's *own* valuation of their risk reduction, then tailoring protection to their *observed* risk-taking behavior (occupation, smoking, seatbelt use) seems a direct application. It claims to offer *more* precise deference to individual choices.
  *   **Where it Misunderstands/Misapplies the Theory:**
      *   **Multidimensionality of Choices:** Choices like smoking or not wearing a seatbelt are rarely *purely* about valuing life. They involve addiction, habit, perceived risk (often underestimated), time inconsistency (valuing present convenience over future risk), information gaps, social influences, and other factors. Inferring a clean "value of life" from such complex behaviors is highly problematic.
      *   **Context Dependence:** Willingness to accept risk for higher pay (compensating wage differential) exists in a specific market context. Willingness to bear risk by not wearing a seatbelt exists in a very different personal context. Equating the WTP implied by these vastly different choices is dubious.
      *   **Equity & Moral Hazard:** It leads to morally repugnant outcomes (denying safety to smokers or reckless drivers) and creates perverse incentives. It violates the core *anti-discrimination* justification for the uniform VSL.
      *   **Epistemic Limitations:** Inferring a reliable, individual-level VSL from such behaviors is practically impossible and prone to massive error and bias.
  *   **Verdict:** While superficially extending the revealed preference logic, the consultant's proposal misunderstands the complexity of what choices reveal and ignores the crucial *normative* reasons (anti-paternalism, anti-discrimination) why the uniform VSL was adopted in the first place. It rests on a simplistic interpretation of "what a choice can reveal."

  ### Shifting the Foundation: Well-Being Focus ("How Well Lives Actually Go")
  Suppose you reject the revealed preference/WTP foundation and instead base decisions on **objective well-being** – maximizing the number of lives saved, healthy life years, or well-being adjusted life years (WELLBYs), prioritizing those facing the greatest risk or disadvantage.

  *   **What Would Change in Ranking:**
      1.  **Valuation Source:** Abandon monetization via VSL. The primary metric becomes **lives saved** or, better, **Quality-Adjusted Life Years (QALYs) or WELLBYs gained**.
      2.  **Focus on Impact:** Projects would be ranked by **cost per life saved** or **cost per QALY/WELLY gained**. Efficiency is maximizing health/well-being outcomes per dollar.
      3.  **Targeting:** Explicitly prioritize projects benefiting groups with:
          *   **Higher Baseline Risk:** Address areas or demographics with significantly higher accident/fatality rates.
          *   **Greater Health Disadvantage:** Incorporate equity weights, potentially giving higher priority to saving lives or improving well-being among the disadvantaged (e.g., lower-income groups with lower life expectancy).
      4.  **Rejection of WTP:** Stated or revealed WTP would be *irrelevant* to the core valuation. Focus shifts to objective health/well-being outcomes.
      5.  **Aggregation:** Benefits are summed based on lives/QALYs/WELLBYs, not monetary WTP. The Kaldor-Hicks justification disappears.

  *   **Would Rankings Differ in Practice? Almost Certainly Yes.**
      *   **Wealth Bias Removal:** The current VSL method inherently favors protecting wealthier populations (they have higher WTP). A well-being approach focusing on cost per life saved or prioritizing high-risk areas (often lower-income) would likely shift funding towards more disadvantaged communities and infrastructure.
      *   **Project Type Shift:** Projects saving fewer lives (but potentially with high WTP beneficiaries) might fall in rank compared to projects saving more lives (potentially in lower-WTP/higher-risk areas).
      *   **Age/Risk Profile:** A QALY/WELLBY approach would naturally give more weight to saving younger lives or preventing severe disability compared to a simple life saved metric, potentially altering rankings between project types (e.g., pedestrian safety near schools vs. bridge retrofits used mainly by commuters).
      *   **Magnitude:** The practical difference depends on the *dispersion* of WTP across the population and the correlation between high-risk areas and low WTP. Evidence suggests this correlation (high-risk, low-income areas) is often strong, meaning the shift in funding priorities could be significant.

  ### Summary: The Implicit View & Its Alternatives

  | **Aspect** | **Current VSL Procedure** | **Consultant's Proposal** | **Well-Being Focus** |
  |------------|----------------------------|---------------------------|----------------------|
  | **Core Philosophy** | Welfare economics (revealed preference) | Extreme revealed preference | Objective well-being |
  | **What's Valued** | Marginal WTP for risk reduction | Individual risk valuation through behaviors | Lives/QALYs/WELLBYs |
  | **Key Justification** | Anti-paternalism, anti-discrimination | Hyper-individualism | Maximizing health outcomes |
  | **Epistemic Basis** | Actual market choices only | All observable risk behaviors | Empirical risk data |
  | **Equity Handling** | Uniform VSL as equal respect | Meritocratic (based on behavior) | Explicit equity weighting |
  | **Practical Difference** | Wealth bias in allocations | Unworkable and discriminatory | Likely shifts funding to high-risk areas |

  Your current procedure is coherent within a specific welfare economics framework prioritizing individual sovereignty through revealed preferences, using a uniform VSL to avoid discriminatory judgments. The consultant's proposal takes this logic to an impractical and ethically problematic extreme. Shifting to a well-being focus would fundamentally alter the valuation basis, likely leading to significantly different project rankings that prioritize saving the most lives or improving the most well-being, particularly in high-risk areas, rather than reflecting average willingness-to-pay. The tension you feel reflects genuine philosophical and ethical trade-offs inherent in allocating resources to save lives.
