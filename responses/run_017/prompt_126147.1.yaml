  Maier's theorem: For intervals of length (log x)^λ, λ>1, the prime count normalized by expectation doesn't have a limit; sup >1, inf<1. Cramér model would predict it concentrates, but it doesn't.

  Granville: Cramér gap conjecture said gaps are O((log p)^2), but Granville with conditioning says 2e^{-γ} (log p)^2, so constant is larger.

  So, yes, the naive model is incorrect, and conditioning fixes it.

  T is right that theorems revealed the flaws.

  Verdict: Clearly right that the model has counterexamples, but the point inside is that refinements are possible.

