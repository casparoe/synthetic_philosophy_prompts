  **Move (4): R says failures are due to insufficient conditioning, and repairs are finer conditioning.**

  R argues that Maier and Granville are consequences of small-prime structure, which the correction product encodes. So, it's one schema: condition on z, let z grow slowly with x.

  R says the question is which level z, not an objection to the method.

  This seems consistent. The heuristic can be refined by conditioning on more.

  But T might say that without theorems, we don't know how to choose z.

  Verdict: Right but with caveat. The caveat is that we need a way to choose z, and sometimes theorems are needed to guide that.

  **Move (5): T's licensing criterion.**

  T proposes that a heuristic prediction is "licensed" only if it follows from some uniformity statement not known false, and if prediction fails, uniformity fails.

  For twin primes, it would need level-of-distribution input.

  Cramér gap not licensed because uniformity refuted.

  But T notes that then heuristic is just restating the lemma, no independent evidence.

  Is the criterion coherent? It seems so, but restrictive.

  It defines when a heuristic is mathematically sound, based on existing knowledge.

  But R will object that it might exclude good heuristics like twin primes.

  Verdict: The inference holds, but it's a strict criterion that might be too narrow.

  **Move (6): R's parity objection.**

  R says that for twin primes, level-of-distribution (like Bombieri-Vinogradov) isn't enough because of parity; sieves can't distinguish primes from prime products, so bounded gaps were proved differently.

  Thus, Hardy-Littlewood isn't licensed under T's criterion, but it matches data, so criterion is wrong.

  R suggests conditioning on Möbius randomness, which is the heuristic again.

  So, T's criterion might exclude valid heuristics.

  Verdict: Right, and the point defeats T's strict licensing for twin primes. The parity phenomenon is real; Elliott-Halberstam might not suffice for twin primes asymptotic.

  **Move (7): T's parasitic point.**

  T says repairs come from theorems, not from heuristic self-correction. So heuristics depend on theorems for credibility.

  Is this a limitation? Well, heuristics can inspire theorems, but validation comes later. It's true that without theorems, heuristics might be misleading.

  But for new predictions, heuristics might be the only guide.

  Verdict: Right but with caveat. It's a truism to some extent, but emphasizes that heuristic evidence is weaker without theorems.

  Now, for the specific inferences:

