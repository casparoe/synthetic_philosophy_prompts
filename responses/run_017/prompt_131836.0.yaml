prompt: |-
  I'm in the last year of a PhD and next month I'm presenting a chapter to my department's work-in-progress seminar. It's the chapter where I try to say, as exactly as I can, what I am committing myself to by calling myself a particularist about reasons, and my supervisor's complaint about the last draft was that I had produced a list of things particularists tend to like rather than a position with a shape. Before I try to fix that I want an audit from someone who isn't invested. So here is everything I am inclined to assert in the chapter, written as flatly as I can, including one constraint I invented myself and one case I lean on hard:

  (a) Holism about reasons: whether a feature counts in favour of an action, and which way it points, depends on what else is true of the case; the same feature can be a reason in one case, no reason at all in a second, and a reason on the other side in a third, and there is no finite, general, informative specification of the conditions under which it does each. (b) Anti-principlism: the rationality of moral judgement does not depend on a supply of moral principles; the competent judge responds to the salience of the case rather than subsuming it, and principles are at best crutches that a good judge would outgrow. (c) Reasons are not the only reason-relevant features: some features enable, disable, intensify or attenuate without themselves counting in favour of or against anything, and this distinction is what stops (a) from collapsing into arbitrariness. (d) Anti-triviality: I want the dispute with the generalist to remain a genuine one, so I cannot win it with a manoeuvre that my opponent could use too — in particular, I cannot let any awkward feature be demoted to a mere enabling condition whenever a principle would otherwise break. This means I owe some non-ad-hoc account of what makes a feature an enabler rather than a reason. (e) The account I've proposed myself, call it Detachability: a genuine enabler or disabler must attach to a type of consideration in advance of the case, so that you can say which kind of reason it switches on or off without already knowing the verdict you want in the particular case; if the only thing you can say about a feature is that adding it here flips this verdict, it is a hedge and not an enabler. (f) I concede, against many of my allies, that for any body of particularist verdicts there is some hedged, disjunctive, thoroughly uninformative principle that matches all of them; I take the real disagreement to be about explanation, deliberation and what moral thought depends on, not about which verdicts are available. (g) I accept supervenience: no moral difference without a non-moral difference, necessarily and without exception. (h) I think moral deference is real and often the right response to disagreement: someone with better moral perception can tell you what you should do and you can thereby come to know it, not merely comply. (i) The case I rely on most. Devi and Tomas are colleagues with a standing arrangement to alternate the weekly departmental coffee duty; in week one Devi skips her turn unannounced, in week two Tomas does the same. I stipulate that everything that could matter is held fixed and equal across the two weeks: same arrangement, same twenty minutes of extra work for the other person, no further promise, no further need, no third party affected, and the same amount of inconvenience, the same being-let-down and the same annoyance. The only difference is that in Devi's week the two of them are in the middle of a low-grade feud in which each is quietly collecting grievances against the other, while in Tomas's week they are on cordial terms. My verdict is that what Tomas did is fine and what Devi did is not; and I want to insist that the feud is not itself a reason against anything, that it is not that the breach hurts more or that anyone is more upset, since I have stipulated all of that away — it simply switches on the small consideration already present, so that the twenty minutes counts in Devi's week and is silent in Tomas's. I also want to insist on something that makes this harder rather than easier: I cannot say in advance which kind of consideration the feud switches on, because in a case with a different trifle lying about it would switch on that one instead.

  What I want from you is an audit, not a survey. Tell me which of (a) through (i) are genuinely in tension with one another, and rank those tensions by severity rather than listing them as equally serious; for each real tension say what exactly would have to be revised, restricted or abandoned, and what that revision would cost me elsewhere in the set; and then tell me which single revision would clean up the most. Please also mark off the pairs that merely look like they conflict, and say briefly why they don't, since I would rather have a short list of real problems than a long list of things I already knew were uncomfortable. I don't know yet which of these I would be willing to give up, so don't assume an ordering of my attachments, and don't assume that the item I added myself is the weak one — or that it isn't.
reasoning: |-
  Hmm, the user is a PhD student in their final year, preparing for a work-in-progress seminar on moral particularism. Their supervisor criticized their draft for lacking a coherent position, presenting instead a list of particularist tendencies. They've shared nine assertions (a through i) and want an audit of tensions between them, ranked by severity, with suggestions for revisions and identification of false conflicts. They need this to refine their chapter into a unified position.

  First, I need to understand each component deeply. The core claims are holism (a), anti-principlism (b), the reason/enabler distinction (c), anti-triviality (d), detachability (e), concession about principles (f), supervenience (g), moral deference (h), and the Devi/Tomas case (i). The user emphasizes that (d) and (e) are their own contributions, and (i) is a key illustrative example.

  Looking for tensions: The biggest red flags are between (e) Detachability and (i) the Devi/Tomas case. In (i), they insist that the feud "switches on" a reason without specifying in advance what type of reason it enables. But (e) requires enablers to attach to reason-types prior to cases. That's a direct contradiction—either the feud is an enabler (violating e) or it's arbitrary (violating d). This seems severe because it undermines their core case study.

  Next, I see issues with (f) and (b)/(a). By conceding that uninformative principles can capture particularist verdicts (f), they risk hollowing out anti-principlism (b). If principles are always available, even if useless, what makes deliberation principle-independent? This could weaken their critique of generalism. Also, supervenience (g) might pressure them toward generalism, but they explicitly reject that via holism (a), so it's not a direct tension unless they can't explain how supervenience works without principles.

  Now, false alarms: Moral deference (h) seems compatible—deferring to perceptive judges fits particularism's focus on case-salience. And supervenience (g) isn't inherently anti-particularist; Dancy himself accepts it. The user just needs to clarify how variation emerges from non-moral bases without principles.

  For revisions: The top priority is fixing the (e)-(i) clash. They could weaken (e) to allow case-specific enablers, but that risks triviality (d). Or they could reframe the feud in (i) as affecting the reason's weight (not existence), but that might betray holism. Alternatively, they could drop the "no advance specification" demand in (i), but that sacrifices the case's intended force. The cost of any choice here ripples through anti-triviality and their example.

  Lower-severity tensions: The (f)-(b) issue threatens their explanatory claims but isn't fatal if they stress that principles don't guide deliberation. And (c) might need bolstering to show how enablers prevent arbitrariness without sneaking in proto-principles.

  Ranking: 1. (e) vs (i) is critical; 2. (f) vs (b) is structural; 3. Potential (c)/(d)/(e) instability is manageable with care. Everything else is reconcilable.

  The user's hidden need seems to be defending particularism as a distinct, non-arbitrary position. They're likely worried their "shape" problem stems from internal conflicts. By resolving (e)-(i), they'd gain coherence—perhaps by rethinking enablers or re-presenting the case. This audit should help them tighten their chapter's core argument before the seminar.
answer: |-
  Here is an audit of your position, prioritizing genuine tensions by severity and identifying false conflicts. The analysis focuses on logical and structural coherence within your stated commitments.

  ### Severity Ranking of Genuine Tensions
  *(Most severe first)*

  1.  **Tension: (e) Detachability vs. (i) Devi/Tomas Case**
      *   **Nature of Conflict:** (e) demands that genuine enablers must "attach to a type of consideration in advance of the case" and allow us to say "which kind of reason it switches on or off" prior to knowing the verdict. (i) explicitly denies this for the feud: "I cannot say in advance which kind of consideration the feud switches on, because in a case with a different trifle lying about it would switch on that one instead."
      *   **Why Severe:** This is a direct contradiction. Your core case study relies on an enabling feature (the feud) that violates the core criterion (detachability) you propose to distinguish genuine enablers from ad-hoc hedges. This undermines both your proposed solution to anti-triviality (d) and the intended force of the Devi/Tomas example as illustrating a *particularist* enabler.
      *   **Revision Required:** You must choose:
          *   **Revise (e):** Weaken detachability. Drop the requirement that the enabler attaches to a *specific type* of reason in advance. Allow enablers to be context-specific "switches" that activate *whatever* minor reason exists in that context, without prior type specification. *Cost:* Significantly increases the risk of triviality (d), as *any* feature flipping a verdict could now be called an enabler. Requires strong justification for why this isn't ad-hoc.
          *   **Revise (i):** Abandon the "no advance specification" claim. Argue that the feud enables *a specific type* of reason (e.g., "considerations of minor inconvenience in contexts of existing relational strain") detectable in advance. *Cost:* Weakens the case's power to illustrate the radical context-dependence demanded by (a) and (b). Makes the enabler look like a proto-principle component.
          *   **Abandon the Feud as an Enabler:** Re-describe the feud's role. Perhaps it subtly changes the *weight* or *nature* of the inconvenience (contra your stipulation) or constitutes a *different kind* of reason itself. *Cost:* Forces significant reinterpretation of your flagship case, potentially undermining its intended support for (a)/(c).
      *   **Clean-Up Potential:** Resolving this is the single most important revision. It directly impacts the coherence of your core anti-triviality maneuver (d) and your key illustrative case (i).

  2.  **Tension: (f) Concession vs. (b) Anti-Principlism & (a) Holism (Explanatory Claim)**
      *   **Nature of Conflict:** (f) concedes that *any* set of particularist verdicts can be captured by *some* (hedged, disjunctive, uninformative) principle. (b), however, claims the "rationality of moral judgement does not depend on a supply of moral principles" and principles are mere crutches. (a) claims there's "no finite, general, *informative* specification" of when a feature is a reason. The tension arises over *explanation* and *dependence*. If generalists can always produce *some* principle (even uninformative) matching your verdicts, how does this differ substantively from their view, especially concerning (b)'s claim about dependence? Doesn't (f) trivialize the disagreement?
      *   **Why Serious:** This threatens to hollow out the *significance* of (a) and (b). If the disagreement is solely about whether principles are "informative" or "useful for deliberation" (per your gloss in (f)), rather than about the fundamental structure of reasons and the possibility of codification, it risks making particularism a methodological preference rather than a substantive metaphysical/epistemic thesis. This weakens the "shape" your supervisor seeks.
      *   **Revision Required:** Sharply distinguish **metaphysical/explanatory priority** from **representational possibility**. Emphasize that while principles *can* be constructed *post hoc* (f), they play *no role* in *explaining why* something is a reason (a demands context explains) and *no necessary role* in competent *deliberation or justification* (b). The "dependence" in (b) is about what *grounds* rational judgment and deliberation, not what can be constructed afterwards. Insist that the constructed principles in (f) are epiphenomenal to moral reality and moral thought. *Cost:* Requires careful articulation to avoid the concession in (f) undermining the force of (a) and (b). You must make clear why the *existence* of such principles is irrelevant to the core claims about how reasons work and how we know them.
      *   **Clean-Up Potential:** Clarifying this is crucial for defending particularism as a substantive position distinct from generalism, not just a different style of moral thinking.

  3.  **Tension: Potential Instability of (c) within (d) & (e)**
      *   **Nature of Conflict:** While (c) distinguishes reasons from enablers/disablers/etc. to prevent holism (a) from collapsing into arbitrariness, your constraints (d) Anti-Triviality and (e) Detachability make this distinction potentially fragile. (d) forbids demoting awkward features arbitrarily. (e) tries to provide a criterion, but its conflict with (i) (see #1) shows its vulnerability. The question is whether (c) alone, without robust (d) and (e), *can* prevent arbitrariness. Relying solely on the *distinction* isn't enough; you need a stable way to *draw* it non-arbitrarily.
      *   **Why Moderately Serious:** If the reason/enabler distinction itself becomes arbitrary or collapses under pressure (e.g., from clever counterexamples), holism (a) *does* risk appearing arbitrary. Your solution (e) is under stress, and without it, (c) lacks teeth against the triviality threat (d). This doesn't contradict other points directly yet, but it reveals a structural vulnerability in the core particularist machinery.
      *   **Revision Required:** Strengthen the defense of (c) *and* your mechanism for drawing the distinction. If (e) is revised significantly (see #1), you need a *new* or *reinforced* non-ad-hoc criterion satisfying (d). Emphasize the *phenomenology* of deliberation – how competent judges experience features *as* reasons or *as* enabling conditions – as evidence for the distinction's reality, even if specifying criteria is hard. *Cost:* Requires deeper epistemological or phenomenological work to ground the distinction independently of potentially problematic criteria like (e).
      *   **Clean-Up Potential:** Bolstering this foundation strengthens the entire position against the standard "arbitrariness" and "triviality" objections.

  ### False Conflicts (Apparent Tensions, Reconcilable)
  1.  **(a) Holism / (b) Anti-Principlism vs. (g) Supervenience:**
      *   **Why no conflict:** Supervenience (g) only states that moral properties depend on non-moral ones; it doesn't specify the *form* of that dependence. Holism (a) is a specific thesis *about* that form of dependence (contextual, non-atomic). Particularists (like Dancy) readily accept supervenience; they just deny that it entails generalism. The dependence is holistic and complex, not governed by atomistic principles. Your (a) and (b) are perfectly compatible with (g).
  2.  **(a) Holism / (b) Anti-Principlism vs. (h) Moral Deference:**
      *   **Why no conflict:** Deference (h) relies on the perception of someone with "better moral perception." This is entirely consistent with particularism. The expert isn't applying principles; they are perceiving the salient features and their complex valences/reason-relations within the specific context, just as (a) and (b) describe. Deferring to their judgment is trusting their capacity for holistic, non-principled perception. There's no implication that the expert uses principles.
  3.  **(c) Reason-Relevant Features vs. (a) Holism:**
      *   **Why no conflict:** (c) is part of the *explanation* for how (a) works without arbitrariness. Enablers/disablers/intensifiers/attenuators are precisely the contextual features that *make* the valence/status of a potential reason (like the 20 minutes) context-dependent. (c) fleshes out the holistic mechanics implied by (a). They are complementary, not conflicting.

  ### Summary & Key Recommendation
  *   **Most Severe Tension:** The direct contradiction between **(e) Detachability** and the "no advance specification" claim in **(i)** the Devi/Tomas case. This is the critical fault line threatening your anti-triviality constraint (d) and the coherence of your core example.
  *   **Highest Impact Revision:** Resolving the **(e) vs. (i)** conflict offers the most significant clean-up potential. **Recommendation:** Seriously consider **revising (e)**. Weaken the "advance specification of reason-type" requirement. Argue that a genuine enabler is one that plays a *systematic enabling role* within a *recognizable context or relationship type* (like "existing low-grade feud among colleagues"), even if the *specific minor consideration* it enables varies (the coffee duty, leaving a mess, a snub, etc.). This preserves the core insight of (e) – non-ad-hocness based on prior attachment to a *kind of situation* – while accommodating the variability in (i). It still satisfies (d) by preventing *arbitrary* feature demotion. You can then argue that the feud enables "minor considerations of inconvenience or slight within the context of this strained relationship," without needing to specify *which* minor consideration in advance. This revision minimizes costs elsewhere and strengthens the link between (c), (d), and your case study.

  By addressing the (e)/(i) tension decisively, clarifying the explanatory vs. representational point regarding (f)/(a)/(b), and shoring up the grounding of the reason/enabler distinction, you will significantly enhance the "shape" and internal coherence of your particularist position. Good luck with the seminar!
