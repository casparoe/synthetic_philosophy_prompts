  ### Constraint Compliance
  1.  **Spread Achieved**:  
      - E ≤ 0.25: Pain (0.04), Visual Exp. (0.07), Episodic Mem. (0.09), Anger (0.11), Hope (0.23), Intention (0.12) → **6 items**.  
