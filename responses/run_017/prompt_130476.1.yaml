  For the mover, I'll pick findings that directly impact A or U. For knowledge, if internal markers of justification are found, it could increase A. For character traits, if neuroscience predicts behavior better than self-report, U decreases.

  Verbal disagreement: Knowledge—if "mental state" is contested. Also, speaker meaning might involve "intention."

  Misdescription: Practical skill—the two factors focus on state types, but skills are abilities, so the stakes are about embodiment vs. cognitive representation.

  Finally, tier sorting: Tier 1 (low E): High first-person authority. Tier 2 (medium E): Mixed. Tier 3 (high E): Social/external aspects dominant.

