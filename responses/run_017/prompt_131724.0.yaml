  Synthesizing this: My overall credence is low (0.15), siding with the debate friend. The anchors and Harsanyi's method don't inspire confidence. The user's 0.50 might come from weighting the Veil of Ignorance more heavily or believing in undiscovered neural anchors. Their friend's 0.15 likely discounts those possibilities more.

  What would change my mind? A validated neural correlate of utility could bump it to 0.40. If Harsanyi's approach was empirically shown to produce consistent societal preferences, that'd be compelling. But currently, the evidence points to arbitrariness.

