  ### Institutional Setting and Setup
  Consider a pretrial services agency using a risk assessment tool to predict the likelihood of a defendant committing a violent crime if released (true outcome \(Y = 1\)), but the agency only observes arrests for violent crimes (recorded outcome \(R = 1\)) as a proxy. Due to differential police patrol allocation, arrests are more likely in neighborhoods where Group A resides (high sensitivity) than where Group B resides (low sensitivity). Specifically, the probability that a violent crime results in an arrest is 0.4 for Group A and 0.9 for Group B. The true base rate of violent crime is 0.20 for Group A and 0.10 for Group B. The score \(S\) is the conditional expectation of \(R\) given observed features (e.g., criminal history, age, employment), making it an honest predictor of \(R\). We assume no false arrests (\(R = 0\) if \(Y = 0\)) and a discrete score: \(S \in \{0, 0.1, 0.3\}\). Group distributions are:

  - **Group A**: \(P(S=0) = 0.6\), \(P(S=0.1) = 0.2\), \(P(S=0.3) = 0.2\)
  - **Group B**: \(P(S=0) = 0.55\), \(P(S=0.1) = 0.225\), \(P(S=0.3) = 0.225\)

  ### Calibration on Recorded Outcome (Requirement 3)
  \(S\) is calibrated within groups for \(R\): \(P(R=1 \mid S=s, \text{group}) = s\).  
  **Verification**:  
  - For Group A:  
    - At \(s=0\): \(P(R=1 \mid S=0, A) = 0\) (by construction, since \(S\) conditions on features).  
    - At \(s=0.1\): \(P(R=1 \mid S=0.1, A) = \frac{0.1}{0.4} \times 0.4 = 0.1\) (true risk scaled by sensitivity).  
    - At \(s=0.3\): \(P(R=1 \mid S=0.3, A) = \frac{0.3}{0.4} \times 0.4 = 0.3\).  
  - For Group B:  
    - At \(s=0\): \(0\) (similarly).  
    - At \(s=0.1\): \(P(R=1 \mid S=0.1, B) = \frac{0.1}{0.9} \times 0.9 = 0.1\).  
    - At \(s=0.3\): \(P(R=1 \mid S=0.3, B) = \frac{0.3}{0.9} \times 0.9 = 0.3\).  
  Group membership is not among the score's features, but calibration holds by construction.

  ### Balance for Positive Class on Recorded Outcome (Requirement 4)
  Balance for positives: Mean \(S\) among \(R=1\) is equal across groups.  
  **Calculation**:  
  - **Group A** (\(P(R=1 \mid A) = 0.08\)):  
    \(E[S \mid R=1, A] = \frac{E[S^2 \mid A]}{0.08} = \frac{0^2 \times 0.6 + 0.1^2 \times 0.2 + 0.3^2 \times 0.2}{0.08} = \frac{0 + 0.002 + 0.018}{0.08} = 0.25\).  
  - **Group B** (\(P(R=1 \mid B) = 0.09\)):  
    \(E[S \mid R=1, B] = \frac{E[S^2 \mid B]}{0.09} = \frac{0^2 \times 0.55 + 0.1^2 \times 0.225 + 0.3^2 \times 0.225}{0.09} = \frac{0 + 0.00225 + 0.02025}{0.09} = 0.25\).  
  Both groups have mean \(S = 0.25\) among \(R=1\), satisfying balance.

  ### Failure of Balance for Negative Class (Requirement 5)
  Balance for negatives: Mean \(S\) among \(R=0\) differs.  
  **Calculation**:  
  - **Group A** (\(P(R=0 \mid A) = 0.92\)):  
    \(E[S \mid R=0, A] = \frac{E[S \mid A] - E[S \mid R=1, A] \cdot P(R=1 \mid A)}{P(R=0 \mid A)} = \frac{0.08 - 0.25 \times 0.08}{0.92} = \frac{0.08 - 0.02}{0.92} \approx 0.0652\).  
  - **Group B** (\(P(R=0 \mid B) = 0.91\)):  
    \(E[S \mid R=0, B] = \frac{0.09 - 0.25 \times 0.09}{0.91} = \frac{0.09 - 0.0225}{0.91} \approx 0.0742\).  
  Since \(0.0652 \neq 0.0742\), balance for negatives fails. Non-degeneracy holds: predictor is imperfect, and recorded base rates differ (0.08 vs. 0.09).

  ### Failure of Target-Robustness (Requirement 6)
  **Target-robustness** requires:  
  1. *Same true risk at equal scores*: \(P(Y=1 \mid S=s, A) = P(Y=1 \mid S=s, B)\) for all \(s\).  
  2. *Consistent group risk ordering*: The group with higher recorded risk (Group B at 0.09) should have higher true risk.  

  **Failure of (1)**:  
  - At \(s=0.1\): \(P(Y=1 \mid S=0.1, A) = \frac{0.1}{0.4} = 0.25\); \(P(Y=1 \mid S=0.1, B) = \frac{0.1}{0.9} \approx 0.111\) (gap: 0.139).  
  - At \(s=0.3\): \(P(Y=1 \mid S=0.3, A) = \frac{0.3}{0.4} = 0.75\); \(P(Y=1 \mid S=0.3, B) = \frac{0.3}{0.9} \approx 0.333\) (gap: 0.417).  
  True risk differs at every non-zero score.  

  **Failure of (2)**:  
  - Recorded risk: Group B (0.09) > Group A (0.08).  
  - True risk: Group A (0.20) > Group B (0.10).  
  Ordering reverses: Group B appears riskier in the record, but Group A is riskier in fact.  

  ### General Fact (Requirement 7)
  **Theorem**: If \(S\) is calibrated for \(R\) within groups, and recording sensitivities \( \rho_A \neq \rho_B \) (both in (0,1)), then for any \(s > 0\), \(P(Y=1 \mid S=s, A) \neq P(Y=1 \mid S=s, B)\).  
  **Proof**: Calibration implies \(P(R=1 \mid S=s, g) = s\). Since \(R=1\) only if \(Y=1\), we have \(s = P(R=1 \mid S=s, g) = \rho_g \cdot P(Y=1 \mid S=s, g)\). Thus, \(P(Y=1 \mid S=s, g) = s / \rho_g\). If \(\rho_A \neq \rho_B\), then \(s / \rho_A \neq s / \rho_B\) for \(s > 0\).  
  **Role of balance**: Balance for positives/negatives is irrelevant here. The violation stems solely from calibration on \(R\) and \(\rho_A \neq \rho_B\). Adding or removing balance conditions does not affect the true-risk gap.

  ### Ablation (Requirement 8)
  **Feature doing the work**: Differential recording sensitivity (\(\rho_A = 0.4 \neq \rho_B = 0.9\)).  
  **Ablation 1 (equalize sensitivities)**: Set \(\rho_A = \rho_B = 0.7\).  
  - True risk at \(s=0.1\): Both groups have \(0.1 / 0.7 \approx 0.143\).  
  - Recorded risk: Group A = \(0.7 \times 0.20 = 0.14\), Group B = \(0.7 \times 0.10 = 0.07\) → Ordering matches (A > B).  
  Violation dissolves.  

  **Ablation 2 (equalize true base rates)**: Set \(P(Y=1 \mid A) = P(Y=1 \mid B) = 0.15\), sensitivities unchanged.  
  - True risk at \(s=0.1\): Group A: \(0.1 / 0.4 = 0.25\); Group B: \(0.1 / 0.9 \approx 0.111\) (gap remains).  
  - Recorded risk: Group A: \(0.4 \times 0.15 = 0.06\); Group B: \(0.9 \times 0.15 = 0.135\) → B > A, but true risks are equal (both 0.15). Ordering reverses (B appears riskier, but groups are equal in fact).  
  Violation persists.  

  **Conclusion**: The sensitivity difference drives the true-risk gap. Equal true base rates do not resolve it and may cause reversal.

  ### Consistency Checks (Requirement 9)
  - **Conditional probabilities in [0,1]**:  
    - True risks: Group A (\(s=0.1\): 0.25, \(s=0.3\): 0.75); Group B (\(s=0.1\): ~0.111, \(s=0.3\): ~0.333). All in [0,1].  
    - Scores constrained: \(s \leq \rho_g\) (e.g., \(s \leq 0.4\) for Group A).  
  - **True base rates aggregate**:  
    - Group A: \(0.6 \times 0 + 0.2 \times 0.25 + 0.2 \times 0.75 = 0.2\).  
    - Group B: \(0.55 \times 0 + 0.225 \times \frac{0.1}{0.9} + 0.225 \times \frac{0.3}{0.9} \approx 0.225 \times 0.444 \approx 0.10\).

  ### The Objection (Requirement 10)
  The strongest objection is that **target-robustness is unverifiable**: Auditors only observe \(R\), not \(Y\), making claims about "true risk" unfalsifiable. Institutions could exploit this to dismiss audits by alleging label imperfections. This differs from calibration (which is observable) and is not merely "calibration for \(Y\)" (which is undefined without \(Y\)-data). An auditor limited to \(R\) could:  
  - Estimate sensitivity differences using auxiliary studies (e.g., randomized monitoring in subgroups).  
  - Report bounds on true risks (using known sensitivity ranges).  
  While imperfect, this is better than ignoring the proxy gap.

  ### Closing Statements (Requirement 11)
  **What the case establishes**: Even a risk score perfectly calibrated and balanced on a recorded proxy can exhibit significant true-risk disparities and reversed group rankings if the proxy's sensitivity differs across groups.  
  **What it does not establish**: That every fairness intervention fails under label bias—only that simultaneous calibration on a proxy and target-robustness is unattainable under differential sensitivity.  

