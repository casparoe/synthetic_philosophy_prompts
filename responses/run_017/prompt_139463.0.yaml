    A: 0.25*0.2 + 0.75*0.2 = 0.05+0.15=0.20? 
    Distribution: P(S=0|A)=0.6, P(S=0.1|A)=0.2, P(S=0.3|A)=0.2
    P(Y=1|A)=0.25*0.2 + 0.75*0.2 = 0.05+0.15=0.20
    B: P(Y=1|B)=0.1111*0.225 + 0.3333*0.225 = 0.225*(0.1111+0.3333)=0.225*0.4444≈0.1000.

  10. The objection: The strongest case for using only the recorded outcome is that it is the only observable. Any other target is unverifiable. The institution could always claim that the true outcome is different, and there is no way to audit that. However, an auditor who is aware of the issue could, for example, conduct a sample audit with more intensive monitoring for a subset of cases to estimate the true outcome and then estimate the recording sensitivity by group. This would be costly, but not impossible.

  11. Closing: This case establishes that even when a risk score is perfectly calibrated and balanced on a recorded outcome, it may be miscalibrated and unbalanced on the true outcome, and the group-level risk ordering may be reversed, if the recording process is differentially sensitive across groups. It does not establish that every fairness intervention in the presence of label bias will fail, only that the specific form of target-robustness we defined is incompatible with within-group calibration on a differentially recorded proxy.
