prompt: |-
  I've been asked to run a sealed-bid tender for the organisation I work for, and I've been spending what spare time I have on the mechanics of how such things are supposed to work. Our format is the ordinary one: suppliers submit sealed bids, the lowest bid wins, and the winner is paid its own bid. There is an alternative format that textbooks like, in which the lowest bidder still wins but is paid the runner-up's price; there, quoting your true cost is the sensible thing to do whatever you happen to believe about your rivals, whereas in our format a supplier has to bid some way above its own cost, and by how much depends on how many rivals it faces and on what it expects those rivals to do. Real tenders almost never use the other format.

  What I can't get straight is what our format presupposes about the bidders. Taken at face value it seems to need a great deal: not merely that each supplier knows its own costs, but that each has a view about the others' costs, a view about the others' views, and so on upward — and, further, that they all in some sense share a single picture of the spread of costs they are drawing from, so that whatever disagreement exists among them is really just a difference in private information. It also strikes me as odd that we seal the bids and forbid the bidders from talking to one another, thereby destroying mutual knowledge, while the predictions we rely on seem to need that mutual knowledge; and that our own rules let me reject a bid for being implausibly cheap, as though a supplier offering a very low price must be mistaken about its own costs, even though finding out who genuinely has the lowest costs was the whole purpose of the exercise.

  I'd like you to reconstruct the implicit theory of rationality and mutual knowledge that this practice rests on, and to tell me which parts the practice strictly presupposes and which it merely sits comfortably with. Could the same practice be licensed by a view on which suppliers are risk-averse, or one on which they reason only a step or two about each other rather than reasoning to a fixed point, or one on which they learn across repeated tenders instead of working anything out in advance? Where is the choice of format philosophically underdetermined — where would several quite different theories of bidder rationality all tell me to carry on exactly as we do? And what would concretely have to change in how we run the tender if I stopped assuming common knowledge of rationality: for instance, if I announced in advance that every bid would be published afterwards, or if I knew that one regular supplier always bids its true cost?

  Please argue from the structure of the situation rather than from the literature — I want your own reconstruction, not references — and write the answer in British English.
reasoning: |-
  Hmm, this is a fascinating query about auction theory from someone clearly well-versed in the practicalities of procurement. The user works for an organisation running sealed-bid tenders and has spotted some fundamental tensions in their format. They're questioning the rationality assumptions behind their current "lowest bid wins, paid own bid" model versus the Vickrey auction alternative where winner gets paid second-lowest bid.

  The user makes several astute observations: that standard practice requires bidders to have nested beliefs about competitors' costs; that bid secrecy contradicts the mutual knowledge needed for equilibrium; and that the right to reject "implausibly cheap" bids seems inconsistent with the auction's purpose. They want me to reconstruct the implicit theory behind their practice - what rationality assumptions are essential versus compatible - and explore how alternative behavioural models (risk aversion, bounded rationality, learning) might fit. Crucially, they've asked for original structural analysis in British English without academic references.

  Breaking this down:
  First, the core rationality assumption in their current format is Nash equilibrium under common knowledge. Bidders must each form beliefs about the cost distribution and competitors' strategies, then best-respond. The equilibrium bid function typically involves "marking up" true costs, with the markup depending on the number of bidders and perceived competitiveness. Crucially, this requires:
  - Common prior belief about the cost distribution
  - Common knowledge of rationality (CKR)
  - That bidders solve for the symmetric BNE

  But as the user notes, practice contradicts this: sealed bids prevent common knowledge formation, while rejection rules suggest distrust of rationality. The "implausibly cheap" rejection policy implicitly assumes either:
  - Bidders can't have costs below some threshold (contradicting cost discovery purpose)
  - Or they might be irrational/miscalculating, so extreme bids signal error

  Alternative models could justify current practice:
  1) Risk aversion: Bidders shade bids upward more aggressively, but equilibrium structure remains similar
  2) Level-k thinking: A "level-0" bidder bids truthfully; "level-1" assumes others are level-0 and marks up accordingly. This might approximate equilibrium without CKR
  3) Repeated interactions: With learning, bidders might converge toward equilibrium via experience rather than deduction

  Where practice is philosophically underdetermined:
  - The rejection rule could stem from fear of winner's curse (common values), risk aversion, or suspicion of irrationality
  - Sealed bids might prevent collusion rather than enable CKR
  - Current format works passably under both equilibrium and simple heuristic models

  Concrete changes if dropping CKR:
  - Publishing bids afterward: Destroys future information asymmetry, enabling collusion or punishment strategies
  - One truthful bidder: Would force others to bid just below that firm's cost (if identifiable), undermining the markup logic

  The fundamental tension is between the auction as a cost-discovery mechanism versus a strategic game. Their rejection rule reveals they don't fully trust it as discovery - suggesting they actually fear common values (where low bids signal overestimation of efficiency) rather than private costs.
answer: |-
  Your tender format—lowest sealed bid wins, paid its own price—rests on a specific, game-theoretic vision of rationality, but it’s more adaptable than it first appears. I’ll reconstruct the implicit theory, distinguish strict necessities from comfortable compatibilities, and show where practice diverges or tolerates alternatives. Crucially, your format doesn’t *strictly* require infinite regress of beliefs or perfect common knowledge, but it does assume a structured uncertainty that bidders navigate strategically.

  ### Core Implicit Theory: Asymmetric Information & Nash Equilibrium
  1. **Private Costs & Common Priors**:  
     - **Strict presupposition**: Each bidder knows their own cost (c_i) but treats rivals’ costs as random draws from a shared probability distribution (e.g., uniform over [£c_min, £c_max]).  
     - **Why essential?** Without this, bidders couldn’t compute expected payoffs. Your tender rules treat costs as *privately known* but *publicly distributable*.  
     - **The mutual knowledge paradox**: Sealing bids *prevents collusion*, not mutual knowledge. Bidders need only *believe* others also see costs as draws from a common distribution. They don’t need to know rivals’ exact beliefs—only that all face symmetric uncertainty.  

  2. **Rationality as Best Response**:  
     - **Strict presupposition**: Bidders maximise expected profit: *(bid - c_i) × Prob(win | bid)*.  
     - **Why essential?** Bidding above cost requires estimating win probability, which depends on:  
       - Number of rivals (n),  
       - Beliefs about their cost distribution (e.g., "rivals' costs are likely £10k-£15k"),  
       - Beliefs about their *strategies* (e.g., "they bid 20% above cost").  
     - **Nested beliefs simplified**: Bidders don’t need infinite recursion. Equilibrium assumes all use the *same* bid function (e.g., *bid = c_i + k*). Each infers rivals’ behaviour from the common cost distribution and shared rationality.  

  3. **The Role of "Implausibly Cheap" Rejections**:  
     - This exposes a tension. Theoretically, a low bid *should* signal genuine low costs. But rejecting it implies:  
       - **Hidden common-value elements**: You suspect the bidder misjudged shared risks (e.g., "they forgot planning consent costs"), turning private costs into interdependent estimates.  
       - **Defensive rationality**: You’re guarding against winner’s curse or irrationality. Philosophically, your rules betray *distrust* in bidders’ self-knowledge or competence, contradicting pure private-cost assumptions.  

  ### Where Practice is Philosophically Underdetermined  
  Your format accommodates *multiple* rationality models. Key compatibilities:  
  - **Risk-Aversion**:  
    - Bidders mark up bids *more* to avoid loss. Equilibrium still holds, but bids cluster higher. Your rejection rule for "too cheap" bids aligns here—it screens recklessness.  
    - **No change needed**: Practice works if bidders overweight low-probability losses.  

  - **Bounded Rationality (1-2 steps)**:  
    - **Step 0**: "Naïve" bidder bids at cost.  
    - **Step 1**: "Canny" bidder assumes rivals are naïve, so bids just below expected rival cost.  
    - **Step 2**: "Cunning" bidder assumes rivals are canny, bids lower still.  
    - **Convergence**: With many bidders, this mirrors equilibrium. Your format *still works*—lowest bid wins, even if bidders don’t compute fixed points.  

  - **Learning Across Repeated Tenders**:  
    - Bidders need no prior beliefs; they adjust markups based on past wins/losses ("I lost last time; I’ll bid lower").  
    - **Compatible with current practice**: Secrecy still prevents collusion. Rejecting anomalous bids may even accelerate learning ("that bid was rejected, so I must bid higher").  

  ### What Changes if Common Knowledge of Rationality (CKR) Falters?  
  CKR means all know all are rational, all know all know, ad infinitum. Dropping it alters incentives:  
  1. **Publish All Bids Afterwards**:  
     - **Problem**: Destroys asymmetry for future tenders. Bidders learn rivals’ exact strategies, inviting collusion ("I’ll bid high if you do") or punitive bids ("I’ll undercut Firm X forever").  
     - **Required change**: You’d need strict anonymity or randomised bidder pools to prevent retaliation.  

  2. **One Supplier Bids True Cost (c_i)**:  
     - **Problem**: This "truth-teller" becomes a focal point. Rational bidders would bid *just below* the truth-teller’s expected cost to win profitably. But if the truth-teller’s cost is volatile, others may over/under-shoot.  
     - **Required change**: Rejecting "implausible" bids becomes crucial to handle destabilising low bids. Alternatively, exclude the truth-teller if they distort competition.  

  ### Conclusions: What Must Hold, What Can Flex  
  - **Strict presuppositions**:  
    - Private costs (mostly—rejection rules hint at doubt).  
    - Common cost distribution (bidders share a rough "market price" belief).  
    - Profit maximisation (bidders avoid certain loss).  

  - **Flexible compatibilities**:  
    - Risk aversion, learning, or bounded rationality all produce viable bidding in your format.  
    - The "secrecy paradox" isn’t one: Sealed bids enable *strategic uncertainty*, which equilibrium bidding resolves without needing mutual knowledge.  

  - **Where theory underdetermines practice**:  
    - Rejecting low bids is defensible under risk-aversion or common-value concerns but clashes with pure private-cost theory.  
    - The format works under both deep Nash reasoning and simple heuristics—so long as bidders broadly avoid dominated strategies (e.g., bidding below cost).  

  **Practical advice**: Your tender’s resilience lies in its simplicity. It functions passably across a spectrum of rationality—provided bidders grasp the basic stakes. To reduce instability:  
  - Keep bids sealed (prevents collusion).  
  - Use rejection rules sparingly, only for bids risking contractual failure (e.g., below plausible cost).  
  - For complex contracts, consider Vickrey (second-price) to incentivise truthful bidding, but recognise its own impracticalities (e.g., distrust when the winner pays less than its bid).  

  This reveals your format as a "robust heuristic" rather than a game-theoretic ideal—one that banks on bidders being shrewd but not infinitely so, and competitive but not pathological.
