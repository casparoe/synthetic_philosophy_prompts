  Below, I construct a calibrated-preface pair designed to pry apart the preface and lottery paradoxes. The core challenge is Case B, where probabilistic independence is absent, yet the pressure toward believing "at least one is false" persists via a non-probabilistic preface-style reason. I first present the cases, then the deliverables, and finally an honest assessment of whether Case B succeeds.

  ---

  ### **Case A: Independent Evidence (Critical Edition of a Text)**
  **Setting:** A philologist is preparing a critical edition of a 100-line medieval manuscript. Each line is transcribed from a unique, physically distinct fragment (e.g., separate parchment scraps from different archaeological digs). The philologist examines each fragment using standard methods (palaeography, ink analysis, context). Their track record: across 50 prior editions of similar size, 5% of individual lines contained errors, but every edition had at least one error (error-per-project rate: 100%).  
  **Proposition set:** {L₁, L₂, ..., L₁₀₀}, where Lᵢ = "Line i is correctly transcribed."  
  **Credence in an arbitrary Lᵢ (c):** 0.98.  
  **Credence in the conjunction (L₁ ∧ L₂ ∧ ... ∧ L₁₀₀):**  
  - Arithmetic: With independence, P(conjunction) = (0.98)¹⁰⁰ ≈ 0.1326.  
  - Threshold (t) = 0.95: c = 0.98 > t, but P(conjunction) ≈ 0.1326 < 1 - t (0.05).  
  **Preface-style reason:** Induction from track record: "In all my past projects of 100 lines, at least one line was wrong; so this edition likely has at least one error." This is not derived from the individual credences but from the project-level error history.  
  **No asymmetry:** No line is more suspect; errors are unpredictable.  

  **Treatments:**  
  - (a) *Threshold plus closure:* Each Lᵢ is believed (c > t), but closure forces belief in the conjunction, which has low probability (0.1326 < 0.95). Contradiction.  
  - (b) *Threshold with restricted conjunction:* Belief in each Lᵢ is justified, but conjunction introduction is blocked (high individual credence doesn’t warrant belief in large conjunctions). No contradiction.  
  - (c) *Coherence treatment:* The belief set {L₁, L₂, ..., L₁₀₀} is incoherent with the low-conjunction probability. Repair requires withdrawing belief from some Lᵢ or rejecting closure.  

  ---

  ### **Case B: Common Failure Mode (Regulatory Audit)**
  **Setting:** The same philologist (now as a regulatory auditor) verifies 100 financial transactions in a corporate filing. All transactions were validated using a *single* AI tool (e.g., one calibrated algorithm for fraud detection). The tool is known to be either fully functional or globally flawed due to a single calibration setting (e.g., misconfigured training data). The auditor’s track record matches Case A: across 50 prior audits of 100 transactions, 5% of individual transactions were erroneous, and every audit had at least one error (error-per-project rate: 100%).  
  **Proposition set:** {T₁, T₂, ..., T₁₀₀}, where Tᵢ = "Transaction i is compliant."  
  **Credence in an arbitrary Tᵢ (c):** 0.98.  
  **Credence in the conjunction (T₁ ∧ T₂ ∧ ... ∧ T₁₀₀):**  
  - No arithmetic: Evidence passes through a shared failure mode (the AI tool). If the tool is functional (prob = 0.98), all Tᵢ are true; if flawed (prob = 0.02), all Tᵢ are false. Thus, P(conjunction) = P(tool functional) = 0.98.  
  - Threshold (t) = 0.95: c = 0.98 > t, and P(conjunction) = 0.98 > t.  
  **Preface-style reason:** Same induction as Case A: "All my past audits had at least one error; so this one likely does too." This is not derived from individual credences but from project-level history.  
  **No asymmetry:** No transaction is uniquely suspect; if the tool fails, all fail equally.  

  **Treatments:**  
  - (a) *Threshold plus closure:* Each Tᵢ is believed (c > t), and the conjunction is believed (P(conjunction) > t). But the preface belief ("at least one Tᵢ is false") is also held due to track record, contradicting the conjunction belief.  
  - (b) *Threshold with restricted conjunction:* Belief in each Tᵢ and the conjunction is justified. The preface belief may be rejected (since P(conjunction) is high), but the track record induction pressures acceptance. Tension arises.  
  - (c) *Coherence treatment:* The set {T₁, T₂, ..., T₁₀₀, conjunction} coheres (all supported by P(conjunction) = 0.98), but adding the preface belief creates incoherence. Repair requires rejecting the preface belief or re-evaluating the common-cause model.  

  ---

  ### **Honest Assessment of Case B**
  **Where Case B succeeds:**  
  - The probabilistic route to a low-conjunction credence is genuinely blocked. Multiplication is inapplicable because the evidence is not independent; all claims share a single binary failure mode (functional/flawed tool).  
  - The preface-style reason ("at least one is false") exerts pressure independently via track record induction, not base rates or probabilities.  
  - Specifications 1–4 are met: non-statistical evidence (testimony-like tool output), no lotteries, matched agent/claims/credences/track record, and no asymmetry.  

  **Where Case B risks failure (and why it narrowly avoids it):**  
  - **Incoherence?** The agent has P(conjunction) = 0.98 and a preface belief ("at least one false") based on track record. If this belief is held outright, it contradicts P(conjunction). However, the preface belief is *not* a credence-driven judgment; it is an inductive, non-probabilistic commitment from professional humility. The agent rationally withholds full credence from the preface proposition (P(at least one false) = 0.02) but accepts it as a *practical belief* for error-avoidance. This is consistent with "preface contexts" (e.g., scientists believing their model has flaws without knowing where).  
  - **Hidden lottery?** The common failure mode resembles a lottery over the tool’s state. Crucially, though, the agent lacks base rates about *this specific tool*; the 0.98 credence comes from non-statistical evidence (e.g., the tool’s design documentation and validation reports), not random sampling. The track record provides a global inductive reason, not a probability.  
  - **Stipulation?** The preface belief’s force relies on track record being a *practical* reason to expect errors, detached from credence. If track record merely estimated P(conjunction), Case B collapses into Case A. Here, it works because the induction is defeasible and holistic.  

  **Why it works:** The track record evidence is **project-indexed, not claim-indexed**. It speaks to the agent’s *whole-performance history*, not individual claims. In Case B, it pressures belief in global error without implying claim-level statistics.  

  ---

  ### **Feature Doing the Work**
  - **Independence (in Case A):** When removed, the probabilistic route collapses. In Case A without independence (e.g., if all claims shared a failure mode), P(conjunction) jumps to 0.98, matching Case B. The preface route remains intact via track record.  
  - **Track record (in both cases):** When removed from Case A, the probabilistic route survives (low P(conjunction) from independence). In Case B, its removal eliminates the preface pressure, leaving high P(conjunction) uncontested.  

  ---

  ### **Which Treatment Handles Both with a Uniform Rule?**
  - **Threshold with restricted conjunction** (treatment b) handles both uniformly:  
    - **Rule:** "Belief in a proposition is justified iff its credence > t, but conjunction introduction is not automatically warranted for large sets."  
    - **Case A:** Each Lᵢ is believed; conjunction belief is blocked.  
    - **Case B:** Each Tᵢ and the conjunction are believed; the preface belief is not mandated by the rule (but may be held for non-credal reasons).  
  - **Cost:** It sacrifices closure, which some epistemologists find axiomatic. It also cannot *resolve* the tension in Case B between the conjunction and preface beliefs, pushing the latter into a pragmatic realm.  

  **Why others fail:**  
  - *Threshold plus closure* explodes in both cases (contradiction in A, conjunction/preface conflict in B).  
  - *Coherence treatment* forces belief revision in both cases but offers no uniform repair rule.  

  ---

  ### **Conclusion**
  The pair successfully pries apart the paradoxes:  
  - Case A fits the lottery paradox (probabilistic multiplication enables "at least one false").  
  - Case B isolates the preface paradox (no multiplication, but track record induces "at least one false").  
  The key is the **project-indexed track record**: it provides a non-probabilistic, global error expectation that persists when statistical routes are blocked. Case B is valid if we accept that agents can hold practical, inductively grounded beliefs alongside probabilistic credences without incoherence. Threshold epistemology with restricted conjunction offers the most uniform solution, though it relaxes closure.
