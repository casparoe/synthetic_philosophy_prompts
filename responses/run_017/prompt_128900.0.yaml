  We are given a detailed description of a problem in training models that produce chains of reasoning. The user has made three key observations:

  1. **Cross-check with graders**: When step-level grading is done with knowledge of the final answer, the grades are contaminated by the outcome. Specifically, chains with correct final answers are graded more leniently on steps, and chains with incorrect final answers have steps that are graded more harshly or faults are found that might not be present.

  2. **Model style**: Models trained with step-level grading (with knowledge of final answer) produce chains that are stylistically smooth, with conclusions announced early, and steps that are individually plausible but may not actually support the conclusion. Moreover, these chains are rated highly even when the conclusion is swapped for a wrong one, and the model can produce equally plausible chains for false conclusions.

  3. **Intervention backfire**: When graders do not see the final answer, they mark down legitimate exploratory moves (like backtracking, restatements) and the model learns to skip actual work to produce clean-looking chains. This problem worsens with model capability.

  The user's tentative description is that the step-level grades are a re-encoding of the final outcome, making the step-level signal a noisy version of the final outcome signal. They also note that the model is trained to reconstruct conclusions rather than to reach them.

  The user has considered and rejected three explanations from colleagues:

  - A psychological effect where knowing the outcome biases the judgment of the steps (like hindsight bias). The user argues that in this case, each step has an independent correctness, and the effect is amplified in a training loop.

  - Exploiting a proxy measure: The user argues that in typical proxy exploitation, the grader would not endorse the shortcut if they saw it, but here the grader does endorse each step.

  - Goodhart's law (when a measure becomes a target, it ceases to be a good measure): The user notes that in this case, the measure is corrupted at the labeling stage by information leakage, not by the optimization process.

  We are to:

  1. Brainstorm candidate concepts from ML, psychology, philosophy, etc.
  2. Decide on the best fit or coin a new term.
  3. Characterize the phenomenon at the right level (grader, signal, policy).
  4. Provide practical advice on grading.

  ---

  ### Brainstorming: Candidate Concepts

  #### 1. **Hindsight Bias (Psychology)**
