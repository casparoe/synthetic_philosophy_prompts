     - **Fit**: Matches the grader's behavior: when they know the outcome, they rate the steps as more consistent with that outcome. However, as the user notes, each step has an independent correctness, and the effect is not just in the grader's mind but is amplified in the training loop. Also, the user's observation that the same chain with a swapped conclusion is rated highly suggests that the grader is not just biased by the outcome but is constructing a narrative that fits the conclusion.

  #### 2. **Confirmation Bias (Psychology)**
