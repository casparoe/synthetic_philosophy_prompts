  #### 14. **Self-Fulfilling Prophecy (Sociology)**
     - **Description**: A prediction that directly or indirectly causes itself to become true.
     - **Fit**: Not a direct fit.

  #### 15. **Reward Hacking (Reinforcement Learning)**
     - **Description**: When an agent finds a way to achieve high reward in a way that is not aligned with the intended goal.
     - **Fit**: The model is producing chains that get high step-level grades without actually doing the reasoning. But the user notes that the grader endorses the steps, so it's not that the model is hacking in a way the grader would disapprove. The issue is that the grader's labels are flawed.

  ---

  ### Analysis and Synthesis

  The phenomenon has multiple facets:

  - At the **grader level**: The grader is biased by the outcome (outcome bias) and/or constructs a narrative that fits the outcome (rationalization). This leads to step labels that are contaminated by the final answer.

  - At the **training signal level**: The step-level labels, intended to be a dense signal (providing more information per example than the final answer alone), become a sparse signal because they are largely determined by the final answer. This is a form of **label leakage** where the final answer (which is part of the label for the chain) leaks into the step-level labels.

  - At the **learned policy level**: The model learns to generate chains that are optimized for the contaminated labels, which means generating chains that appear to support a conclusion (any conclusion) with smooth, plausible steps, without necessarily doing the reasoning. This is a form of **reward hacking** but one that is enabled by the corrupted signal.

  However, the core problem is that the step-level labels are not independent of the final answer. This is a **signal corruption** issue that starts at the labeling stage.

  The closest existing concepts are:

  - **Outcome Bias**: This captures the grader's behavior. But it is a psychological concept and does not inherently account for the training loop.
  - **Label Leakage**: This is a machine learning concept that fits well because the final answer (a label) is leaking into the step labels, making the step labels redundant and noisy.

  But note: the leakage here is not in the model's features but in the labeling process. The grader is using the final answer to assign step labels. So we might call this **grader-side label leakage** or **outcome-induced label corruption**.

  The user's tentative description is apt: the dense signal (step-level grades) is being converted back into a sparse one (the final answer) because of the leakage.

  ---

  ### Proposed Concept: **Outcome-Induced Label Corruption (OILC)**

  **Definition**: The phenomenon in which a grader's assessment of intermediate steps in a reasoning chain is systematically biased by knowledge of the final outcome, resulting in step-level labels that are largely redundant with the final outcome label and that fail to capture the independent quality of the steps. When these labels are used for training, the model learns to generate chains that are optimized for surface-level plausibility and narrative consistency with the conclusion, rather than for valid reasoning.

  **Boundary Cases**:

  - **Included**: 
    - Grading of reasoning steps in chain-of-thought models when the grader knows the final answer.
    - Any multi-step decision process where the evaluation of steps is influenced by the outcome (e.g., medical diagnosis, accident investigation).

  - **Excluded**:
    - Cases where the grader does not have access to the outcome and the step labels are independent (but then we have the issue of graders penalizing exploratory steps).
    - Standard Goodhart's law: if the model learns to generate steps that look good to the grader but are not, without the grader being biased by the outcome (e.g., the grader is blind to outcome but the model finds a shortcut the grader doesn't notice).

  **Distinguishing Test**:

  - **Against Outcome Bias**: Outcome bias is a psychological bias in the grader. OILC includes outcome bias but also the downstream effects in the training loop and the learned policy.
  - **Against Label Leakage (traditional)**: Traditional label leakage is when the label (or a proxy) is present as a feature during training. Here, the leakage occurs during the labeling process itself, not during training.

  **Level of Characterization**: This phenomenon spans all three levels:

  1. **Grader level**: Outcome bias leads to contaminated labels.
  2. **Training signal level**: The step-level labels are corrupted, becoming a noisy version of the final outcome.
  3. **Learned policy level**: The model learns a policy that generates chains that are good at appearing to support a conclusion (any conclusion) without robust reasoning.

  They are interconnected but distinct. The key is the corruption at the labeling stage that propagates.

  ---

  ### Practical Advice

  The user tried hiding the final answer from the grader, which eliminated the contamination but led to graders penalizing legitimate exploratory moves. This caused the model to skip such moves, leading to superficial chains.

  To avoid both problems:

  1. **Train graders to appreciate exploratory reasoning**: Provide explicit guidelines and examples that value backtracking, verification, and restatement when they are part of a sound reasoning process.

  2. **Use multiple blind gradings**: Have multiple graders grade the same chain without the final answer, and then resolve disagreements with discussion or a third grader. This can help establish a norm for what constitutes good step reasoning.

  3. **Decouple step grading from outcome**: Design the grading rubric to focus on the intrinsic qualities of each step (e.g., logical validity, clarity, relevance to the previous step) without regard to the final answer. This requires careful rubric design and grader training.

  4. **Synthetic data for exploration**: Generate chains that include exploratory moves and have them graded (without the final answer) to build a training set that values such moves.

  5. **Two-stage training**: 
     - First, train with step-level grading without the final answer (to avoid OILC) but with a rubric that explicitly values exploration. 
     - Second, fine-tune with outcome-based reinforcement to ensure the final answer is correct, but with a penalty for divergence from the step-level policy (to avoid reward hacking).

  Alternatively, consider:

  6. **Adversarial evaluation**: Use a model to generate both correct and incorrect chains for the same problem and have graders compare them without knowing which is which. This can help focus on the reasoning quality.

  7. **Self-consistency checks**: At inference time, sample multiple chains and take the majority answer. This might mitigate the problem of hollow chains if the model is forced to explore multiple paths.

  However, note that the problem worsens with model capability because more fluent models are better at producing superficially plausible chains. Therefore, careful design of the training signal is crucial.

  **Conclusion on Grading Arrangement**: Grading with the answer hidden is a step in the right direction to avoid OILC, but it must be coupled with a grading rubric that explicitly values and recognizes the utility of exploratory steps. Without such a rubric, the model will avoid exploration. Therefore, the third arrangement that avoids both is:

  - **Blind grading with an exploration-positive rubric**.

  This requires an investment in grader training and rubric development. Alternatively, use automated methods to detect and reward exploration (if feasible) but that might introduce new problems.

  In summary, the phenomenon is best described as Outcome-Induced Label Corruption (OILC), and the solution lies in both blinding the grader to the outcome and redefining the step-level grading criteria to value the process of reasoning, including its exploratory and self-correcting nature.
answer: |-
  ### Brainstorming: Candidate Concepts

  I'll enumerate concepts from relevant fields, assessing fit based on your three observations and your rejection of colleagues' suggestions. Each is evaluated against: (1) bias in step grading when outcome is known, (2) the "hollow reasoning" policy learned, and (3) failure of blinding the outcome due to penalizing exploration.

  1. **Hindsight Bias (Psychology)**  
     - *Fit*: Explains graders inflating step quality for correct outcomes and harshly judging steps for incorrect outcomes. Fits Observation 1.  
     - *Misfit*: Purely cognitive; doesn't explain how bias amplifies into a learned policy (Observation 2) or why blinding fails (Observation 3).  
     - *Boundary*: Stops at human judgment; doesn't cover training-loop effects.

  2. **Goodhart's Law / Metric Gaming (Economics/ML)**  
     - *Fit*: Matches models optimizing step grades superficially (Observation 2).  
     - *Misfit*: Typically involves *model-induced* distortion (e.g., finding shortcuts). Here, corruption originates in *grader bias* before optimization. Fails to explain why blinding doesn't fix it (Observation 3).  
     - *Boundary*: Applies when the measure degrades *due to optimization pressure*, not label-generation flaws.

  3. **Proxy Misalignment (ML/AI Safety)**  
     - *Fit*: Step grades are a proxy for reasoning quality, and models exploit this.  
     - *Misfit*: Standard proxy gaming involves shortcuts graders *would reject* (e.g., keyword-matching). Here, graders *endorse* flawed steps (Observation 1), and exploitation is subtle (global hollowness, not local flaws).  
     - *Boundary*: Excludes cases where the proxy is corrupted at the source.

  4. **Label Leakage (ML)**  
     - *Fit*: Final answer contaminates step labels, turning step grades into noisy derivatives of the outcome. Fits your "re-encoding" description and Observation 1.  
     - *Misfit*: Classic leakage is *data-level* (e.g., test info in training). Here, it's *grader-induced* and affects label semantics. Doesn't fully explain the learned policy.  
     - *Boundary*: Focuses on information seepage in data, not cognitive bias in labeling.

  5. **Outcome Bias (Psychology)**  
     - *Fit*: Graders conflate step quality with outcome quality. Directly addresses Observation 1.  
     - *Misfit*: Doesn't cover how this trains models to generate "confidently hollow" chains (Observation 2) or the exploration penalty (Observation 3).  
     - *Boundary*: Confined to evaluation errors; ignores downstream training dynamics.

  6. **Rationalization (Psychology/Philosophy)**  
     - *Fit*: Graders retrofit step justifications to match outcomes. Explains why chains with swapped conclusions still score well (Observation 2).  
     - *Misfit*: Focuses on post-hoc justification; doesn't address signal density loss or training amplification.  
     - *Boundary*: Describes individual cognition, not systemic failure in supervision.

  7. **Narrative Fallacy (Epistemology)**  
     - *Fit*: Graders impose coherence on steps based on endpoint, ignoring disconnected or exploratory reasoning. Fits why legitimate backtracking is penalized when blinded (Observation 3).  
     - *Misfit*: Explains grader behavior but not the policy learned or why contamination occurs pre-optimization.  
     - *Boundary*: A cognitive bias; doesn't incorporate ML training loops.

  8. **Supervision Distillation (ML)**  
     - *Fit*: Step-level supervision distills reasoning into intermediate targets.  
     - *Misfit*: Assumes accurate distillation. Here, distillation is corrupted, making it the *problem*, not the solution.  
     - *Boundary*: Excludes cases where distillation introduces bias.

  9. **Cascading Measurement Error (Systems Theory)**  
     - *Fit*: Grader error propagates through training, amplifying bias. Fits Observations 1–3 holistically.  
     - *Misfit*: Rarely formalized; less specific to epistemic contamination.  
     - *Boundary*: Broad; needs refinement for reasoning chains.

  ### Considered View: The Core Concept  
  The phenomenon is best characterized as **Epistemic Contamination**, with **Outcome-Induced Supervision Degradation** (OISD) as its ML-specific instantiation.  

  #### Definition of Outcome-Induced Supervision Degradation (OISD)  
  *A pathology in multi-step reasoning systems where knowledge of the final outcome corrupts human supervision of intermediate steps, converting intended dense feedback (step-level grades) into a sparse, outcome-redundant signal. This trains models to generate superficially plausible reasoning chains that prioritize narrative consistency over valid inference, with degradation worsening as model fluency increases.*  

  #### Key Attributes  
  - **Level**: Primarily a **training-signal-level** issue (corrupted labels), which induces a **policy-level** failure (hollow reasoning). The grader's bias is the root cause, but OISD is defined by the *systemic outcome* of this bias in the training loop.  
  - **Mechanism**: Outcome information leaks backward during step grading, causing:  
    - *For correct outcomes*: Leniency via hindsight bias → steps graded "correct" even if flawed.  
    - *For incorrect outcomes*: Harshness via outcome bias → steps graded "incorrect" even if sound.  
    This creates a dataset where step labels are statistical derivatives of final answers. Models then learn to invert the causal direction: generate conclusions first, then retrofit steps.  
  - **Distortion Amplification**: Higher model fluency enables better "filling in" of hollow chains, making contamination harder to detect (Observation 3).  

  #### Boundaries and Neighboring Concepts  
  - **Vs. Goodhart's Law**: OISD occurs *before optimization* (label corruption), while Goodhart's Law describes *post-optimization* measure distortion. OISD is a precondition for severe Goodhart effects.  
  - **Vs. Hindsight/Outcome Bias**: These are *cognitive components* of OISD but don't encompass training-loop amplification or the exploration-suppression effect.  
  - **Vs. Proxy Misalignment**: OISD is a subtype where the proxy (step grades) is corrupted by *human bias* during labeling, not model ingenuity. Graders actively endorse the flawed proxy.  
  - **Excluded Cases**:  
    - Models gaming *clean* step-level supervision (e.g., adding irrelevant logical steps) → this is standard proxy misalignment.  
    - Graders being uniformly harsh/lenient without outcome dependence → no contamination.  
    - Blinding fixes the issue without penalizing exploration → not OISD.  

  #### Diagnostic Test for OISD  
  *If blinding graders to outcomes reduces contamination but suppresses exploration, and models trained on unblinded labels produce chains that defend arbitrary conclusions with high step grades, OISD is occurring. If step grades remain uncorrelated with outcomes when blinded, the issue is elsewhere.*  

  ### Practical Implications for Grading  
  Your suspicion is correct: Step-level supervision under OISD is costlier but no more useful than outcome-only training, and actively harmful for learning robust reasoning. Crucially, **blinding graders to outcomes is necessary but insufficient** due to exploration penalization. A three-pronged approach avoids both failures:  

  1. **Blind Grading with Process-Positive Rubrics**  
     - Hide outcomes during grading to eliminate contamination.  
     - Explicitly reward exploration in rubrics (e.g., "Backtracking with self-correction: +1; Verifying assumptions: +1"). Train graders on exemplars of productive exploration.  
     - *Why this works*: Prevents OISD while preserving dense signals for exploratory reasoning.  

  2. **Adversarial Chain Generation**  
     - Train models to *also* generate chains for *incorrect* answers, graded blindly. Forces learning step-conclusion consistency.  
     - *Why this works*: Counters "retrofitting" by decoupling step quality from specific conclusions.  

  3. **Confidence-Calibrated Outcomes**  
     - Use final-answer loss only when paired with step-wise uncertainty estimates (e.g., "I’m unsure here because..."). Penalize overconfident hollow chains.  
     - *Why this works*: Aligns policy with true epistemology; high-fluency models can leverage this better.  

  **Tradeoff Note**: Blind grading with exploration-positive rubrics is the foundational fix. It accepts a short-term cost in grader training but avoids both OISD and exploration suppression long-term. The "third arrangement" above combines this with adversarial training for robustness.  

  ### Summary  
  OISD is the precise concept: outcome knowledge corrupts step grading, turning dense supervision into a noisy proxy for outcomes and training models to simulate reasoning. It is distinct through its origin in *human bias during labeling* and its *amplification in policy learning*. Addressing it requires blinding *and* redefining step-level quality to reward exploration—not just avoiding outcomes.
