  #### 7. **Observer Effect (Physics) or Hawthorne Effect (Psychology)**
     - **Description**: The effect of being observed changes the behavior of the observed. The Hawthorne effect is a specific type where individuals modify an aspect of their behavior in response to their awareness of being observed.
