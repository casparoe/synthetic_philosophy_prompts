  We are planning a 50-minute section on the colour phi phenomenon and the Orwellian vs. Stalinesque distinction for first-year cognitive science students. The students have seen change blindness and the rubber hand illusion, but no philosophy of mind. They have a two-page handout describing the display and the two accounts without drawing conclusions.

  The plan must include:
  1. Order of introduction and the foundational piece.
  2. Choice of case (bare two-spot vs. variant with random color after first spot off) and what it must contain/avoid.
  3. Four expected misconceptions and when to address them.
  4. Where to place the question about neural signatures of consciousness.
  5. What to leave out and how to frame that.
  6. A closing question to assess understanding.

  We commit to one order, one case, and one foundational move.

  **Foundational Piece (the one thing everything else depends on):**
  The key is that the subject's report (or experience) of the event is a single, continuous motion with a mid-trajectory color change. This must be established first because it is the phenomenon to be explained.

  **Order of Introduction:**
  1. (5 min) **Introduce the Phenomenon**: Show the display (or describe it vividly) and emphasize what the subject experiences: one spot moving and changing color mid-way. Use a video or animation if possible. Make sure they grasp the illusory motion and color change.

  2. (5 min) **Highlight the Puzzle**: Why is this puzzling? Because the subject sees the color change before the second spot appears? Actually, no: the second spot appears very quickly. But the experience seems to incorporate the future (the second color) in a way that is anomalous. However, the puzzle is that the brain must be "filling in" the motion and the color change. The key puzzle: How does the brain generate this experience? The timing is critical: the experience of the color change at the midpoint seems to require information from the second spot (which hasn't been registered yet at the time the midpoint would have been traversed).

  3. (15 min) **Introduce the Two Explanatory Stories (Orwellian vs. Stalinesque)**:
     - Orwellian: The brain initially registers two separate spots but then revises the memory to create a coherent story (post-experiential revision). The experience at the time was of two spots, but the memory is altered.
     - Stalinesque: The brain processes the two spots and creates the illusion before it reaches consciousness. The experience itself is of the moving and changing spot.

     Use the chosen case to illustrate. We choose the **variant with the random color for the second spot** (determined after the first spot has gone off). Why this case? Because it makes the problem more acute: the subject reports seeing the color change at the midpoint even though the color of the second spot was not determined until after the first spot disappeared. This makes it impossible for the brain to have generated the experience of the change at the midpoint at the time of the first spot (since the color wasn't known). This variant is from Dennett's discussion and is more powerful for showing that the brain is not building a detailed representation in real-time.

     What the case must contain: 
     - The first spot (say, red) is flashed and then goes off.
     - Then, after a short delay, a random event (e.g., a coin flip) determines the color of the second spot (say, green or blue).
     - The second spot is then flashed at the nearby location.
     - The subject experiences a spot moving from the first location to the second and changing color at the midpoint.

     What it must avoid: Do not introduce the idea that the subject is "clairvoyant". Instead, emphasize that the experience seems to incorporate the future event, which is impossible. Therefore, the brain must be constructing the experience after the fact.

  4. (10 min) **Address Misconceptions** (as they arise, but we'll plan specific points):
     - **Mixing up the labels**: When introducing the two accounts, use clear labels and a mnemonic. Orwellian: like rewriting history (after the fact, in memory). Stalinesque: like a show trial (staged in advance). Address this right after defining the terms.
     - **Supposing the two stories differ in what the subject experiences**: Emphasize that both accounts agree on what the subject reports (the moving, color-changing spot). The difference is in when and how the brain constructs that experience. Address this when first presenting the two accounts and again when using the random color variant to show that the experience must be constructed after the fact.
     - **Reaching for a decisive experiment**: Students might suggest using finer neural timing or asking the subject to look harder. We must explain that the subject's report is the same in both cases, and we don't have independent access to the experience. We only have the report. Address this when discussing why the two accounts are empirically equivalent? Or when we introduce the neural signature question? We'll place it after introducing the two accounts and the random variant, because the variant seems to break the symmetry. But even then, we cannot tell. So we address this when we discuss the neural signature.
     - **Hearing the upshot as the claim that the motion is not really seen**: This is critical. The illusion is a real experience. We are not saying that the subject doesn't see the motion. We are saying that the brain constructs it. Address this when first describing the phenomenon and again when summarizing.

     Planned sequence for misconceptions:
     a. After defining the terms, immediately clarify the labels with a mnemonic and stress that both accounts agree on the report.
     b. When presenting the random color variant, emphasize that the subject still reports the same experience. Then ask: how can the brain construct the experience of the color change at the midpoint if the color wasn't known until after the first spot? This leads to the idea that the experience is constructed after the fact. Then we note that both accounts are still possible? Actually, the random variant seems to favor the Orwellian? Not necessarily: the Stalinesque might still be possible if the brain delays consciousness until after the second spot. But then the experience would be delayed. This leads to the next point.

  5. (10 min) **Place the Neural Signature Question**: Now we ask: what would a neural signature of consciousness have to show to settle the issue? We want to know when the color change became conscious. If we could find a neural marker that indicates when a conscious event occurs, then we could look for when the color change is represented. But note: in the random color variant, the color change representation must occur after the second spot. So if we find a neural marker at a time when the color hasn't been determined, that would be a problem. But if we find it only after the second spot, then it could be either Orwellian (if the marker is for the memory) or Stalinesque (if the marker is for the delayed conscious experience). Actually, this doesn't break the symmetry. The point is that the neural signature must be able to tell us whether the representation was present in real-time or only in memory. But without a theory of what the neural signature of consciousness is, we cannot decide. This is where we make the distinction matter: it shows that the question of when something becomes conscious is not straightforward. We do this after introducing the two accounts and the random variant, and after discussing the misconceptions about the reports and the possibility of an experiment.

     Timing: At about 30 minutes in, we bring up the neural signature.

  6. (5 min) **What to Leave Out**: We must leave out the deeper philosophical implications (e.g., about the self, about the nature of consciousness) and the debates about whether the distinction is real or just a false dichotomy. We also cannot go into the neuroscience in detail. How to say it: "We're focusing on the basic puzzle and the two ways the brain might solve it. We're leaving aside the bigger questions about consciousness and the self because that's for later in the course. But note that this puzzle shows that our brains construct our experiences in ways we don't consciously control."

  7. (5 min) **Closing Question**: To see if the distinction has landed, ask: 
     "Suppose we do an experiment and find brain activity at time T (after the second spot) that represents the color change. Could this activity be part of an Orwellian or a Stalinesque process? Explain why."

     We want them to say that it could be either:
     - Orwellian: because it could be the brain revising the memory.
     - Stalinesque: because it could be the brain constructing the experience (which was delayed until after the second spot).

     If they see that the same neural event could fit both stories, then they have understood that the distinction is not about what the brain does but about when and how the experience is generated relative to consciousness.

  **The One Claim That Must Be Established Before Anything Else (in eight words or fewer):**
  "Subjects see one moving spot changing color mid-trajectory."

  **Detailed Timeline:**

  - 0-5 min: Phenomenon demonstration and description. Establish the experience: one spot moving and changing color.
  - 5-10 min: Why is it puzzling? The brain must fill in the gap, and the random variant (if chosen) makes it more acute. We choose the random variant and describe it.
  - 10-25 min: Introduce the two accounts (definitions). Use the random variant to illustrate: how can the brain do it? Then clear up misconceptions:
     - Right after defining: "Remember, Orwellian is like rewriting history, Stalinesque is like staging a show. And both lead to the same report."
     - Then: "Does the subject have different experiences in the two stories? No, the report is the same. The difference is in the underlying processing."
     - Then: "Can we ask the subject to look harder? No, because the experience is what it is. And we don't have access beyond the report."
     - Also: "Is the motion not real? It is a real experience, an illusion created by the brain."
  - 25-35 min: Neural signature question: What would we need to see in the brain to know when the color change became conscious? Explain the challenge: even if we see a neural representation, we don't know if it's part of the original experience or a later revision. This shows the distinction matters for interpreting neural data.
  - 35-45 min: Summarize and leave out: We are not resolving the debate, just showing how the brain constructs experience. Leave out the deeper philosophy and the question of which account is correct.
  - 45-50 min: Closing question and discussion.

