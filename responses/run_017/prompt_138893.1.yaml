  I'm a TA for an introductory cognitive science course, and I have a single fifty-minute section next week on the colour phi phenomenon and on the distinction, usually labelled with Dennett's terms, between an Orwellian and a Stalinesque account of what goes on in it. The students are first-years: they have met change blindness and the rubber-hand illusion, they have had no philosophy of mind, and they will have read a two-page handout of mine that describes the display — two differently coloured spots at nearby positions, flashed in quick succession, seen as one spot that travels and seems to change colour partway along its path — and names the two stories without drawing any moral. Don't explain the phenomenon or the distinction to me; plan the fifty minutes. I want: (1) the order in which the pieces have to be introduced and the one thing everything else depends on; (2) the single case that will carry the session, chosen definitely between the bare two-spot display and a variant of mine in which the second spot's colour is fixed by a random event occurring after the first spot has gone off but before the second appears — and, either way, what the carrying case must contain and must not contain if it is to do its work; (3) the four misconceptions I expect — mixing up which label is which and why, supposing the two stories differ in what the subject experiences, reaching for a decisive experiment such as finer neural timing or asking the subject to look harder, and hearing the upshot as the claim that the motion is not really seen — and the exact point in the sequence at which each should be headed off; (4) where in the arc to place the question of what a neural signature of consciousness would have to show in order to settle when the spot's colour became conscious, since that is the one place I can make the distinction matter to them; (5) what to leave out at this level and how to say I am leaving it out without the session ending in a shrug; and (6) one closing 