answer: |-
  ### Section Plan: Colour Phi and Orwellian vs. Stalinesque Accounts

  #### (1) Order of Introduction and Foundational Piece
  - **Order** (total: 50 min):  
    1. **Phenomenon demonstration and report (5 min)**: Use a simple animation (or vivid description) of the two-spot display to show the illusion (one spot moving while changing color mid-trajectory). Highlight the subject's verbal report: "I saw a single spot move from A to B and change color halfway."  
    2. **Puzzle framing (5 min)**: Ask, "How does the brain generate this experience? The color change seems to happen *before* the second spot appears, but that’s impossible—so what’s really going on?"  
    3. **Introduce the two accounts (10 min)**: Define Orwellian (post-experiential memory revision) and Stalinesque (pre-experiential processing). Use analogies: Orwellian like "editing a memory after the fact," Stalinesque like "staging a fake show before it’s presented."  
    4. **Deepen with the random-color variant (15 min)**: Present the variant where the second spot’s color is randomly determined *after* the first spot disappears (e.g., coin flip). Emphasize the subject still reports the same illusion.  
    5. **Neural signature question (10 min)**: Probe what evidence could settle when the color became conscious.  
    6. **Misconception checks and summary (5 min)**: Address lingering confusions explicitly.  
    7. **Closing question (5 min)**: Assess comprehension.  
  - **Foundational piece (one thing everything depends on)**: The subject’s *verbal report* of the illusion ("moving spot changes color mid-trajectory") must be established first. Without this, there is no puzzle to explain.

  #### (2) Case Choice and Specifications
  - **Chosen case**: **The random-color variant** (second spot’s color fixed after first spot disappears).  
  - **Why**: It heightens the temporal paradox (the brain "knows" the future color only after the first spot is gone), making the need for post-hoc construction undeniable.  
  - **Must contain**:  
    - A clear sequence: Spot 1 (e.g., red) flashes → disappears → random event (e.g., coin flip) → Spot 2 (e.g., green) flashes.  
    - Subject’s report: "I saw one spot move and change color midway."  
  - **Must avoid**:  
    - Any suggestion of "prediction" or "guessing" the color. Emphasize the color is random and unknown until after Spot 1 is off.  
    - Neuroscientific jargon (e.g., "reafference," "feedback loops") to keep it accessible.  

  #### (3) Four Misconceptions and When to Head Them Off
  1. **Mixing up labels (Orwellian vs. Stalinesque)**  
     - **When**: Immediately after defining the terms (Step 3).  
     - **Prevention**: Use analogies + quick quiz: "If the brain alters memory *after* the event, is that Orwellian or Stalinesque?" (Orwellian). Repeat twice.  
  2. **Supposing the accounts differ in what’s experienced**  
     - **When**: During the random-variant discussion (Step 4).  
     - **Prevention**: Stress: "Both accounts agree the subject *reports* the same illusion. The disagreement is about *how* the brain produces it—not the experience itself."  
  3. **Reaching for a decisive experiment (e.g., finer timing, asking subjects to 'look harder')**  
     - **When**: During neural signature discussion (Step 5).  
     - **Prevention**: State: "No experiment can directly access 'raw' experience—we only have reports. Even with perfect neural data, we must interpret *when* consciousness happened."  
  4. **Hearing the upshot as 'the motion isn’t really seen'**  
     - **When**: During puzzle framing (Step 2) and summary (Step 6).  
     - **Prevention**: Clarify: "The illusion *is* the experience. We’re asking how it’s built, not denying it happens."  

  #### (4) Placement of Neural Signature Question
  - **Where**: Step 5 (after introducing the random variant).  
  - **Why**: The variant creates urgency—how can we determine *when* the color change became conscious? Ask: "If we found a neural signature of consciousness (e.g., a specific brain wave), what would it need to show to prove the color was conscious *before* the second spot? (It would need activity encoding the color change *during* the motion, but the random variant makes this impossible!)" This forces engagement with the distinction’s stakes: without it, neural data alone can’t resolve the "when" of consciousness.  

  #### (5) What to Leave Out and Framing
  - **Leave out**:  
    - Philosophical debates (e.g., "hard problem" of consciousness, ontology of self).  
    - Alternative theories (e.g., representationism, predictive processing).  
    - Neuroscientific details (e.g., specific brain regions, ERP components).  
  - **Framing**: "We’re focusing on the *minimal* puzzle—how the brain constructs reports. We’re skipping deeper philosophy and neuroscience for now because this distinction alone shows why consciousness is tricky to pin down. It’s not a shrug; it’s a first step."  

  #### (6) Closing Question
  - **Question**: "In the random-color variant, could a Stalinesque account work if the brain delays consciousness until after the second spot? Why or why not?"  
  - **Why it lands the distinction**:  
    - Correct answer (yes) shows they grasp Stalinesque flexibility (processing can be delayed).  
    - Follow-up: "Could Orwellian work too?" (yes—memory revision could still occur). If they see both are possible despite the delay, they understand the accounts are empirically equivalent and not about the report itself.  

  #### Guesses About First-Years’ Reactions
  - They’ll initially conflate "Orwellian" with "Stalin" (evil/bad), so analogies are critical.  
  - They’ll want a "solution," so emphasize this is about *framing* the problem, not solving it.  
  - The random variant’s "time travel" feel will intrigue but confuse; anchor it to the report.  

  ---  
  \answer{Subjects report moving spot changing color mid-trajectory.}
