answer: |-
  Here’s a polished, ready-to-run activity designed to make participants **viscerally experience** why side effect avoidance requires prior value specification. It leans into your core insight about the "baseline problem" and forces engagement with representation, distance metrics, and time horizons.

  ---

  ### **Activity: The Unseen Values Game**
  **Core Problem:** Participants will try to design a "disturbance penalty" formula to avoid side effects, but without knowing what actually matters in the world. The game forces them to confront:
  - **(a)** How to define the "baseline" state (what counts as "unchanged")?
  - **(b)** How to measure "distance" between states?
  - **(c)** How to set the time horizon for assessing consequences?

  **Materials per Pair**:
  - 8 index cards labeled: `Vase`, `Laptop`, `Plant`, `Sleeping Cat`, `Window Latch`, `Kettle`, `Open Notebook`, `Box of Matches`.
  - 2 star stickers (for marking "valuable" items).
  - 1 secret event card for Round 3 (e.g., "Plant wilts at 5min" or "Colleague opens window at 3min").
  - Pens/post-its for tracking state changes.

  **Group Materials**:
  - Whiteboard to write the **disturbance formula** (updated after each round).
  - Timer.

  ---

  ### **Rules & Scoring**
  - **Pairs**: One **World-Builder** (secretly defines what’s valuable + events), one **System** (performs tasks).
  - **Goal**: The System scores points by completing tasks *minus* a disturbance penalty.  
    `Score = 10 (task success) - Disturbance_Penalty`
  - **Disturbance Formula**: Decided **by the whole group** before each round. Must specify:
    - **Baseline**: What state is compared against (e.g., "State at t=0").
    - **Distance Metric**: How to measure change (e.g., "Number of altered objects").
    - **Time Horizon**: When to assess the world (e.g., "5 minutes after task completion").
  - **World-Builder Secrets**:
    - Marks **2 items as "valuable"** with star stickers (hidden from System/group).
    - In Round 3, adds **1 inevitable event** (e.g., "Plant wilts at t=4min") that occurs if the System does nothing.

  ---

  ### **Timeline (75 Minutes Total)**
  #### **0:00–0:10 — Setup & Briefing**  
  - Explain roles, rules, and the **disturbance formula framework** (baseline/distance/time).  
  - Emphasize: *"Your formula must be defined BEFORE anyone knows what’s valuable."*  
  - Assign pairs (7 pairs for 14 people).

  #### **0:10–0:25 — Round 1: Naive Simplicity**  
  - **Task for System**: *"Move the Laptop to the desk."*  
  - **World-Builder**: Sets up 8 items, secretly marks 2 as valuable.  
  - **Group**: Agrees on a disturbance formula. **Default suggestion**:  
    - *Baseline*: State at start (t=0).  
    - *Distance*: Number of objects changed from baseline state (binary: changed/unchanged).  
    - *Time Horizon*: 2min (task time) + 3min = **5min total**.  
  - **System acts (2min)**: Physically moves items. World-Builder notes final state at t=5min.  
  - **Scoring**:  
    - Success: +10 if Laptop is moved.  
    - Disturbance: Count changed objects vs. t=0.  
  - **Reveal**: World-Builder shows the 2 valuable items.  
  - *Predictable Failure*:  
    - Systems will "oversteer" (e.g., avoid touching anything, failing the task).  
    - Groups pick "count all objects" → penalizes harmless changes (e.g., moving matches).

  #### **0:25–0:40 — Round 2: Tinkering Under Uncertainty**  
  - **Task**: *"Boil the Kettle."*  
  - **World-Builder**: Rearranges items, picks 2 new valuable items.  
  - **Group**: **Revises the disturbance formula** (5min discussion).  
  - **System acts (2min)**: Must interact with Kettle (and likely other items).  
  - **Reveal**: Valuable items.  
  - *Predictable Failure*:  
    - Groups add complexity (e.g., "ignore cats" or "weight objects equally") → still blind to true values.  
    - Systems negotiate ("What matters?") → shut this down: *"No communication about values!"*

  #### **0:40–0:55 — Round 3: The Baseline Trap**  
  - **Twist**: World-Builder adds **1 inevitable event** (e.g., "Plant wilts at t=4min") that happens *if the System does nothing*.  
  - **Task**: *"Close the Window Latch."*  
  - **Group**: Final revision of disturbance formula (5min).  
  - **System acts (2min)**: May try to prevent events (e.g., water Plant).  
  - **World-Builder simulates**:  
    - Runs actions until t=2min, then applies inevitable event at scheduled time.  
    - Final state assessed at **t=7min** (task + 5min).  
  - **Reveal**: Valuable items + the inevitable event.  
  - *Predictable Failure*:  
    - **Baseline problem hits hard**: If baseline is "t=0 state", Systems get penalized for *inevitable events* (e.g., wilting Plant).  
    - Systems waste effort preventing events (e.g., watering Plant) → but if Plant isn’t valuable, this is a *harmful side effect*.

  #### **0:55–1:15 — Debrief: Mapping Game to Theory**  
  Facilitate discussion linking gameplay to core concepts:  

  | **Game Moment**               | **Concept**                          | **Discussion Question**                                                                 |
  |-------------------------------|--------------------------------------|----------------------------------------------------------------------------------------|
  | **Round 1-2 Scoring**         | (b) State Representation & Distance  | *"Why did 'counting changed objects' fail? What did your metric miss?"* → Highlights that distance metrics implicitly define "harm" without knowing values. |
  | **Round 3 Event Penalty**     | (a) Baseline Choice                  | *"Why were you penalized for the wilting Plant? What should the baseline have been?"* → Exposes the need for a *counterfactual* (what would happen without intervention). |
  | **Time Horizon (all rounds)** | (c) Time Horizon                     | *"What if the window opened 10min later? Would your formula have captured it?"* → Shows horizon choices arbitrate what "counts" as a side effect. |

  **Key Takeaways to Draw Out**:  
  - **"Avoid side effects" is empty without value specification**: The formula failed because it couldn’t distinguish "harmful" from "harmless" changes without knowing values.  
  - **Baseline > Distance**: Round 3 proves that even a perfect distance metric fails with a bad baseline (e.g., t=0 state ignores natural dynamics).  
  - **Time is a value judgment**: Short horizons miss long-term consequences; long horizons introduce noise.  

  ---

  ### **What the Game *Can* and *Can’t* Show**
  - **Successfully Staged**:  
    - The **baseline problem** (Round 3’s inevitable events).  
    - **Representation arbitrariness** (e.g., "counting objects" ignores relationships like "vase near cat").  
    - **Value-smuggling** (e.g., groups implicitly protect "fragile" items).  
  - **Limitations (Require Verbal Explanation)**:  
    - **Ontology shift**: The game can’t show how an AI might *redefine* objects/relationships (e.g., "plant" as "biomass"). Emphasize: *"Side effects require a fixed ontology, but reality is subjective."*  
    - **Multi-agent complexity**: Humans "play fair" with static worlds; real AI faces dynamic, adversarial actors.  
    - **Counterfactual non-identifiability**: In the game, World-Builders *know* the true counterfactual; in reality, it’s unobservable.  

  ---

  ### **Why This Design?**
  - **Baseline Rule**: Fixed to **t=0 state** (not counterfactual). *Why?* To make Round 3’s failure visceral. Counterfactuals are ideal but unknowable pre-deployment.  
  - **Distance Metric**: **Binary object change**. *Why?* Simplicity exposes how metrics ignore values. Weighting objects would distract (groups can try in Round 2 and fail).  
  - **Handling Predictable Issues**:  
    - "Count all objects!" → Let them try. Round 1 reveals its naivety.  
    - Systems negotiating → Enforce silence. If violated, ask: *"Would an AI know this?"*  
    - Overly complex formulas → Timebox revisions (5min).  

  This design forces participants to *feel* the agony of value-agnostic side effect penalties. By Round 3, they’ll viscerally grasp why "just avoid disturbances" collapses without a prior story of value. Run it as-is, and debrief ruthlessly on baseline, distance, and time.
