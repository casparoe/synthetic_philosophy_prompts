prompt: |-
  Me and a friend have been argueing for weeks about the whole replace-your-brain-a-bit-at-a-time-with-little-machines thing, and I think we keep going in circles because neither of us has ever said what a theory of this would actually have to do to count as a decent one. So I want the spec first, not the theories.

  What it's for, so "adequate" means something: say there's a clinic offering the procedure, done over about two years, one small batch of cells at a time. I have to decide whether to sign the form. Afterwards, everyone has to decide whether my flat, my debts and my promises belong to the person who walks out at the end, and whether that person is bound by the consent I gave on day one. A theory that can't help with those decisions is no use to me however elegant it is.

  So: the requirements. The cases it has to handle, with why each one earns a place on the list:

  1. all of it swapped in one operation versus one tiny bit every few minutes — and if the difference matters, what the rate is even measured in.
  2. a patient whose mental life runs much faster than mine, or much slower. Is "gradual" a matter of how many parts get swapped, how much clock time passes, or how much life they subjectively live through?
  3. it being done while I'm asleep, versus done while I'm awake and watching it happen.
  4. half finished, then stopped for a year, then finished.
  5. parts swapped in a scattered random order, versus one neighbouring region at a time.
  6. parts that do exactly the same job but whose inner state nobody can read off or copy, so no scanning and no backup is possible at any point.
  7. every swap nudging the person's tastes slightly, so that by the end they want nothing the person at the start wanted, including the operation itself, and they want the rest of it stopped.
  8. the bits that get taken out being kept alive and wired up into a second working brain, so there end up being two of us.
  9. it being stopped at 40% with no plan to go further, and a contract that needs interpreting right now.

  The distinctions it isn't allowed to collapse: whether it's me versus whether it matters to me (and whether caring about the outcome is the same thing as surviving it); being the same person versus being treated as the same person for practical purposes; there being an answer versus there only being a decision we have to make; and the difference between a claim about what happens and a claim about what to do when you're not sure what happens.

  Things it can't contradict: anaesthesia, deep sleep, the ordinary fact that people change enormously over a lifetime and still get counted as one person, and the fact that I couldn't tell from the inside whether it had been done to me.

  Then the interesting bits: mark which requirements are non-negotiable given what I want the theory for and which are just what one camp happens to like; flag any pair you suspect can't be satisfied together (I've got a feeling "give a definite yes or no in every case" and "don't invent a fact where there isn't one" are in trouble together, but you tell me); and say which single requirement does the most work in knocking candidates out.

  At the end, a small table is fine, but keep each entry to a line or two: how the obvious candidates do against the list — the psychological-continuity one, the "you're just the living animal" one, the "you're the pattern, not the stuff" one, and the "there's no fact of the matter, just more or less continuity" one. I've described them clumsily on purpose, and please dont bother telling me who came up with which, I genuinely don't care. British English throughout, cheers.
reasoning: |-
  Alright, the user has been arguing with a friend about the gradual brain replacement thought experiment. They need a clear set of criteria to evaluate theories of personal identity, specifically for practical decisions like legal responsibilities and continuity of self after the procedure. 

  First, I need to unpack their requirements. They listed 9 scenarios that any theory must handle, from speed of replacement to multiple duplicates. They also emphasized key distinctions like "me vs matters to me" and constraints like not contradicting anesthesia or lifelong change. 

  The user's frustration is palpable—they're tired of circular debates and want pragmatic tools. Their mention of contracts and debts shows this isn't abstract philosophy; it's about real-world consequences. The British English request and "cheers" suggest they prefer no-nonsense clarity over academic jargon.

  Hmm, the tricky part is balancing definite answers with avoiding false objectivity. Their gut feeling about tension between "always yes/no" and "no invented facts" is spot-on—that'll eliminate some theories immediately. The "40% stopped" case seems especially brutal for theories requiring full continuity.

  For the theories: 
  - Biological approaches will fail scenarios 6-9 where physical continuity breaks. 
  - Pattern theories struggle with scattered swaps (5) and state changes (7). 
  - Psychological continuity cracks under duplication (8) or altered desires (7). 
  - Non-factualist handles ambiguity well but disappoints by refusing clear answers for legal needs.

  The rate vs. subjective time question (2) feels pivotal. If a theory can't distinguish between clock time and lived experience, it'll crumble in edge cases like coma or accelerated consciousness. That might be the silent killer of overconfident theories.

  Notably, the user dismisses "who came up with which"—refreshing! They want utility, not pedigree. The table should reflect that, stressing functional outcomes over labels.
answer: |-
  Right, this is precisely what's needed to cut through the waffle. Below is the **Specification for an Adequate Theory of Gradual Replacement Personal Identity**, designed for practical decision-making about the clinic procedure, legal continuity, and consent. Followed by the assessment of the main theories against your requirements.

  **Core Purpose of the Theory:** To provide a framework for determining:
  1.  **Survival/Continuation:** Is the entity emerging from the clinic *me*? (Not just "a person", but *me*).
  2.  **Practical Continuity:** Does this entity inherit my specific legal obligations, rights, property, and commitments, *based on being me*?
  3.  **Valid Consent:** Does the consent signed by the pre-procedure entity remain valid and binding for the entire procedure and its consequences for the post-procedure entity?

  **Requirements (Cases & Distinctions):**
  1.  **Rate Dependence:** Must handle swap rates from instantaneous (one lump) to extremely gradual (e.g., one neuron-equivalent per minute). If the theory says rate matters, it *must* specify *what* rate is critical (e.g., swaps per subjective second, per objective hour).
  2.  **Subjective vs. Objective Time:** Must handle cases where the patient's subjective experience is sped up (e.g., experiences years mentally while objectively only hours pass) or slowed down. Must clarify if "gradual" refers to the number of swaps, objective time elapsed, or subjective time experienced.
  3.  **Consciousness During:** Must handle the procedure being performed entirely during unconscious states (anaesthesia, deep sleep) vs. performed while fully conscious and aware of each step. Does awareness impact survival/continuity?
  4.  **Interruption:** Must handle the procedure being halted at 50% for a significant period (e.g., 1 year) with no continuity of consciousness or function during the pause, then resumed.
  5.  **Spatial Order:** Must handle parts being replaced in a spatially coherent manner (e.g., lobe by lobe) vs. a scattered, random order throughout the brain. Does spatial coherence matter?
  6.  **Non-Copyable Parts:** Must handle replacement parts that are functionally identical but fundamentally opaque – no scanning, reading, copying, or backing up of brain state is possible at any time. (Forces theories relying on information transfer/copying to show their hand).
  7.  **Drifted Preferences:** Must handle a scenario where each replacement subtly alters preferences/values, such that by the end, the entity actively opposes continuing the procedure (had it been paused) and shares *no* core desires/goals with the original. Does continuity of identity survive radical, imposed psychological discontinuity?
  8.  **Branching/Duplication:** Must handle the removed biological parts being kept alive and functional, eventually forming a second, distinct, conscious entity alongside the machine-based one. Who, if anyone, is *me*? What are the implications for property, debts, etc.?
  9.  **Incomplete Procedure (40%):** Must provide a clear determination *now* about the identity and legal status of the entity existing at the 40% replacement mark, with no intention to proceed further.

  **Critical Distinctions the Theory MUST Respect:**
  *   **Identity vs. What Matters:** Is survival (being *me*) the same as what *matters* to me (e.g., continuation of consciousness, values, relationships)? Or can they come apart? (e.g., Is the outcome of case 7 still *me*, even if *I* wouldn't value it?).
  *   **Identity vs. Treatment:** Is the entity *actually* the same person, or should we just *treat* it as the same person for legal/social convenience? The theory must not conflate these.
  *   **Fact vs. Decision:** Does the theory claim there is a *fact of the matter* about identity in all cases, or does it acknowledge that in some scenarios (like 8 or 9), we are forced to make a *practical or ethical decision* without a clear ontological fact?
  *   **Description vs. Prescription:** Does the theory describe *what happens* to identity, or prescribe *how we should act* under uncertainty? Must be clear.

  **Non-Negotiable Constraints (Cannot Contradict):**
  *   **Anaesthesia/Sleep:** People survive deep sleep and anaesthesia without identity loss; a theory cannot imply that unconsciousness alone destroys identity.
  *   **Lifelong Change:** People change beliefs, values, memories, and personality dramatically over a lifetime (e.g., from child to adult) yet are uncontroversially considered the same person. A theory cannot require strict psychological immutability.
  *   **First-Person Opacity:** It must be impossible for the subject to introspectively detect whether the procedure has been performed *if the replacement is perfect*. Identity isn't something you "feel" changing moment-to-moment in this context.

  **Analysis of Requirements & Constraints:**

  *   **Non-Negotiable for Purpose:** 1 (Rate Dependence, if applicable), 2 (Clarity on Time), 3 (Consciousness), 6 (Non-Copyable), 8 (Branching), 9 (Incomplete), and crucially, respecting **all Critical Distinctions** and **Constraints**. These directly impact the core questions of survival, consent, and legal continuity under the described scenarios.
  *   **Potential Conflicts:** The most significant tension is between:
      *   **Requirement 9 (Definite Answer Now for 40%) + Distinction (Fact vs. Decision):** Demanding a definite "yes/no" answer for the incomplete case *and* respecting that there might be no clear ontological fact (just a decision to make) is likely impossible. A theory must choose its primary commitment here.
      *   **Constraint (Lifelong Change) + Requirement 7 (Drifted Preferences):** If radical change over time doesn't break identity (Constraint), how does the *mechanism* of change (gradual replacement causing drift) matter for Requirement 7? Theories must explain why the *cause* of change is relevant, if the *degree* isn't (per Constraint).
  *   **Knock-Out Requirement:** **Requirement 8 (Branching/Duplication)** is likely the most effective eliminator. Any theory that cannot provide a coherent, non-arbitrary account of who is "me" when two viable candidates exist (the machine continuation *and* the revived biological brain) will fail the practical purpose of assigning debts, property, and responsibility. Requirement 6 (Non-Copyable) is a close second, forcing theories relying on copying information to show they don't need it.

  **Assessment of Obvious Candidates:**

  | Theory                          | Key Strengths                                  | Key Weaknesses Against Spec                                                                                                | Viability for Purpose                                  |
  | :------------------------------ | :--------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------- |
  | **Psychological Continuity (PC)** | Handles Constraints (Change, Sleep) well. Intuitive link to "what matters". Handles slow rates (1), order (5). | Fails **8** (Branching) spectacularly (which copy is me?). Struggles with **7** (Radical Drift) & **9** (40% - how much continuity?). Blurs Identity/What Matters. Often collapses Fact/Decision. | Poor. Fails critical non-negotiable (8).               |
  | **Biological (Animalism)**      | Clear, objective. Handles **1** (Rate irrelevant), **3** (Sleep fine), **5** (Order irrelevant), **6** (No copy needed). Respects Identity/What Matters distinction. | Fails **8** (Only biological entity is me, machine isn't - but what if bio is destroyed?). **Ignores Constraints**: Contradicts Lifelong Change & First-Person Opacity (implausible). Fails **9** (40% entity *is* me biologically). Fails **7** (Drift irrelevant). | Mixed. Strong on some Reqs, fatally contradicts Core Constraints. |
  | **Pattern (Constitutive)**      | Handles Constraints (Sleep, Change, Opacity). Handles **1** (Rate ok if pattern preserved), **3** (Awareness irrelevant). Respects Identity/What Matters. | Fails **6** (Requires pattern to be copyable/readable). Fails **8** (Both could instantiate the pattern? Or neither?). Struggles with **5** (Scattered might disrupt pattern flow?) & **7** (Drift may destroy pattern identity). | Poor. Fails non-negotiable **6** & struggles with **8**. |
  | **Non-Factualist (Narrative/Decision)** | Avoids false objectivity. Handles **8** & **9** pragmatically (it's a decision). Respects Fact/Decision distinction fully. Acknowledges ambiguity in **7** & **4**. | **Fails Core Purpose**: Cannot definitively answer Survival or Guarantee Legal Continuity. Provides no basis for binding consent ("just a decision"). Undermines practical need for answers in **9**. Blurs Identity/Treatment. | Useless. Provides no guidance for the decisions required. |

  **Conclusion for Your Decision:** No candidate theory satisfies the entire spec. **Biological** comes closest on handling the replacement mechanics and duplication but fatally contradicts core realities of human experience (change, opacity). **PC** handles experience but fails duplication and radical change. **Pattern** requires impossible copying. **Non-Factualist** abdicates the need for an answer. The clinic's offer forces a practical choice lacking a perfect theoretical foundation. Your decision hinges most critically on **what you believe matters** (continuity of consciousness? the living body? a coherent narrative?) and what risks you accept regarding duplication **(8)** and incomplete replacement **(9)**, knowing no theory gives flawless answers under the spec.
