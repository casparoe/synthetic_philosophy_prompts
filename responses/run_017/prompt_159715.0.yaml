answer: |-
  Below is a careful translation of the psi-ontic/epistemic distinction into your operational vocabulary, an analysis of its applicability to the three roles of the quantum state, a residue report of conceptual gaps, and a scored taxonomy. I first sketch my mapping to your framework privately, then write the answer, and finally note where adjustments occurred.

  ---

  ### **Private Brainstorming Sketch**  
  **Vocabulary Carry/Break Forecast:**  
  - *Carry:* Microstate/macrostate, ensembles as measures, conditioning, Bayesian updating, structural parameters (T4/T5).  
  - *Break:* Configuration space dimensionality, complex phase, non-commutativity, no-go theorems (PBR, contextuality), quantum interference.  
  - *Tension Points:* Conditioning presupposes pre-existing values; Hamiltonian reversibility vs. measurement irreversibility; "complete specification" in quantum configuration space.  

  **Plan:**  
  1. Map psi-ontic → T1, psi-epistemic → T3 (with caveats).  
  2. Split verdict possible: Dynamical role → T1/T5, Predictive/Informational → T3.  
  3. Residue: Phase, no-go theorems, configuration space.  
  4. Score T1–T5 based on empirical/structural constraints.  

  *Post-writing check:* Added emphasis on T2 irrelevance and T5 viability; refined collapse translations; flagged conditioning presupposition explicitly.  

  ---

  ### **Translation: Psi-Ontic vs. Psi-Epistemic**  
  **Core Distinction in Your Taxonomy:**  
  - **Psi-Ontic**: Asserts the quantum state is **T1** (a *complete specification* of the system’s physical state).  
    - *Formal Sharpening:* Distributions over "complete states" (e.g., ontic states λ) for distinct pure states are non-overlapping.  
    - *Mapping:* One-to-one with T1. Vacant slots: T2, T3, T4, T5 are excluded.  
  - **Psi-Epistemic**: Asserts the quantum state is **T3** (a *measure/credence function* over underlying physical states).  
    - *Formal Sharpening:* Distributions for distinct pure states *can overlap* on λ-space.  
    - *Mapping:* Fits T3 cleanly. Vacant slots: T1 (denied), T2 (inapplicable—epistemic states are distributions, not incomplete specifications), T4/T5 (excluded).  
  - **Vacant Slots**: T2 (*incomplete specification*) is irrelevant—quantum states are not macrostate-like. T4 (*fixed parameter*) and T5 (*structural*) are not claimed by either view.  

  **Role-Split Verdict:**  
  Your tripartite role division permits a *coherent split verdict*, though no mainstream interpretation adopts it wholesale:  
  - **Dynamical Job** (Unitary evolution): Treated as **T1 or T5** by all views.  
    - Psi-ontic: T1 (state is physically real).  
    - Psi-epistemic: T5 (evolution is a structural constraint on knowledge, e.g., QBism).  
  - **Predictive Job** (Born rule probabilities): Treated as **T3** by epistemic views; *reconciled* as T1 with stochasticity (e.g., GRW) by ontic views.  
  - **Informational Job** (Preparation summary): **T3** universally, but psi-ontic must *add* T1 as the physical correlate.  
  - *Coherence & Cost:* A split (e.g., dynamical T5 + predictive T3) is coherent in quantum Bayesian/neo-Copenhagen views. Cost: It severs dynamics from direct physical representation, treating unitarity as a rationality constraint (T5) and the state as subjective (T3).  

  **Collapse Mechanisms Translated:**  
  - *Stochastic Collapse* (e.g., GRW): A **real physical process** (like coarse-graining irreversibility). *Fudge:* Violates Hamiltonian reversibility.  
  - *Guiding + Complete State* (Bohmian): **Hybrid T1 + T1'**: ψ guides particles (T1), but particles are the "complete state." *Fudge:* Dual ontology; configuration space mismatch.  
  - *Branching* (Everett): **Conditionalization without collapse**—all outcomes occur. *Fudge:* Apparent uniqueness of experience; preferred basis problem.  
  - *Conditioning as Updating* (Rovelli, QBism): **Bayesian updating** of knowledge (T3). *Your Worry Addressed:* This *does* presuppose an underlying physical state λ, but only in λ-epistemic views. Purely operational views (QBism) reject λ entirely, making conditioning primitive.  

  ---

  ### **Residue Report: What Your Vocabulary Cannot Hold**  
  1. **Configuration Space Dimensionality**:  
     - Quantum states live in *Hilbert space* (e.g., 3N-dimensional for N particles), not physical space. Your vocabulary assumes systems embed in 3D space with apparatus—this breaks. *Defect:* In your framework, not philosophical unclarity.  

  2. **Complex Phase & Interference**:  
     - Quantum phases cause interference (e.g., double-slit) in a way classical probability measures cannot replicate. Your "ensemble measure" (T3) lacks resources for *amplitude addition*. *Defect:* Vocabulary limitation; phases are empirically irreducible.  

  3. **No-Go Theorems for Overlap**:  
     - PBR theorem: If quantum states overlap on λ-space (epistemic), some preparations yield false predictions. Recent no-go results (e.g., contextuality) further constrain viable epistemic models. *Defect:* Philosophical claims are precise, but your vocabulary lacks tools to *express* the proofs.  

  4. **Silent Assumptions in Your Framework**:  
     - **Microstate Pre-existence**: Conditioning assumes λ exists pre-measurement. Quantum indeterminacy denies this.  
     - **Reversibility**: Hamiltonian flow is reversible; measurement isn’t. Quantum dynamics splits this: unitary (reversible) vs. measurement (irreversible).  
     - **Non-commutativity**: Observables (e.g., X, P) lack joint values—no "complete specification" in your classical sense.  

  ---

  ### **Scorecard for T1–T5**  
  | Type | Score (0–1) | Key Evidence/Argument to Move Score |  
  |------|-------------|-------------------------------------|  
  | **T1** (Complete specification) | 0.4 | **PBR theorem**: If viable, requires non-overlap. Favored by unitary dynamics. |  
  | **T2** (Incomplete specification) | 0.0 | Excluded: Quantum states aren’t coarse-grainings of a physical phase space. |  
  | **T3** (Ensemble/Credence) | 0.3 | **No-go theorems**: Overlap restricted; cannot fully explain interference. |  
  | **T4** (Fixed parameter) | 0.1 | Only in toy models (e.g., classical limits). No evidence for fundamental status. |  
  | **T5** (Structural) | 0.6 | **Unitarity as constraint**: Best accounts for reversibility and no-collapse views (e.g., Everett, QBism). |  

  *Scores sum >1 as options aren’t mutually exclusive. T5 leads due to consistency with dynamics.*  

  ---

  This translation respects your operational fluency while exposing where quantum phenomena strain classical concepts. The residue items—especially configuration space and phase—mark genuine limits of your vocabulary, not philosophical vagueness.
