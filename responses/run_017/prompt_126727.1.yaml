  **OFFICE OF ADMISSIBLE SHARPENINGS**  
  **INTERNAL GUIDANCE ONLY**  
  **Guidance Note 17 (Third Revision): Designation of Heaps, Baldness, and Other Statutory Predicates**  
  **Effective Date:** [REDACTED] | **Classification:** RESTRICTED (PENUMBRAL ZONE)  

  ---

  ### **DEFINITIONS**  
  1.  **Admissible Sharpening:** Any precisification of a vague predicate (e.g., "heap", "bald") consistent with established usage and contextual factors, as ratified by the Office of First-Order Admissibility.  
  2.  **Supertruth:** A statement is supertrue iff true under every admissible sharpening.  
  3.  **Superfalsehood:** A statement is superfalse iff false under every admissible sharpening.  
  4.  **Penumbral Case:** A case where a statement is true under some admissible sharpenings and false under others. Such statements lack a determinate truth value.  
  5.  **Determinate Threshold:** The precise boundary point for a predicate (e.g., the exact number of grains constituting a heap) whose existence is guaranteed, though its identity remains unspecified.  

  ---

  ### **OPERATIVE CLAUSES**  

  **Section A: Truth Value Assignment**  
  6.  Officers MUST assign only supertruth or superfalsehood in all official documentation.  
  7.  Where a case falls within the penumbra (e.g., a pile of grains where some sharpenings deem it a heap, others do not), officers MUST record the status as "INDETERMINATE".  
      *   7.1 **Disciplinary Note:** Recording "HEAP" or "NOT A HEAP" for an INDETERMINATE case constitutes falsification of records (Regulation 12(c)). Officer P. Smith (Ref: H-7342) was reprimanded for inscribing "Probably Not a Heap?" on Form H-17a. "Probably" implies an inadmissible probability distribution over sharpenings.  
  8.  Statements may be "true" (under a specific sharpening) without being "supertrue". Only supertruth is administratively actionable.  

  **Section B: The Determinate Threshold**  
  9.  It is supertrue that a determinate threshold exists for every vague statutory predicate (e.g., there exists a specific number *n* such that *n* grains constitute a heap and *n-1* do not).  
  10. Officers are PROHIBITED from introducing any specific value *n* as *the* threshold into any administrative reasoning, form, or internal memorandum.  
      *   10.1 **Rationale:** For any candidate number *n*, the statement "*n* is the threshold" is penumbral (neither supertrue nor superfalse). Introducing *n* via existential instantiation commits the Fallacy of Precise Designation.  
      *   10.2 **Sanction:** Violation constitutes Gross Misapplication of Logic (Schedule 3, Offence 5), punishable by dismissal and mandatory re-education on higher-order indeterminacy.  

  **Section C: Higher-Order Vagueness & Admissibility**  
  11. The admissibility of a sharpening (First-Order) may itself be vague. Borderline cases of admissibility are subject to review by the Office of Second-Order Admissibility (OSA).  
      *    11.1 Officers encountering potential Second-Order Penumbral Cases (e.g., uncertainty whether a proposed sharpening *is* admissible) MUST flag the file for OSA review using Form S-2.  
      *    11.2 **Pending Resolution:** Procedures for Third-Order vagueness (borderline cases of Second-Order admissibility) are under development. Refer all such queries to the Deputy Director (Theoretical Compliance) via Form T-0 (Experimental), marked "POTENTIAL REGRESS". Do not initiate independent action.  

  **Section D: Practical Implementation**  
  12. **Certification of Positive Status (e.g., "Heap", "Bald"):**  
      *    12.1 Certification requires supertruth. A pile may only be certified as a "HEAP" if it constitutes a heap under *every possible* admissible sharpening.  
      *    12.2 **Consequence:** Given typical usage patterns, certification thresholds are operationally stringent. E.g., Preliminary Directive H/5b: A pile requires ≥ 10,000 grains for provisional consideration as *potentially* certifiable as a heap. Final certification requires OSA pre-clearance of all contextual sharpenings.  
  13. **Certification of Negative Status (e.g., "Not a Heap", "Hirsute"):**  
      *    13.1 Follows the same principle (superfalsehood of the positive predicate). Small collections (e.g., ≤ 10 grains) are generally certifiable as "NOT A HEAP".  
  14. **Penumbral Cases:**  
      *    14.1 Constitute the majority of operational workload. Status remains "INDETERMINATE" indefinitely. No statutory rights or duties contingent on the predicate (e.g., Heap Tax, Baldness Benefit) apply.  
      *    14.2 **Fines & Fees:** Administrative penalties related to indeterminate cases (e.g., "Failure to Declare Potential Heap Status") are payable in Penumbral Credits (PC), valued indeterminately against the national currency. Payment requires submission of Form PC-1 "Declaration of Indeterminate Remittance".  

  **Section E: Resource Implications**  
  15. The operational definition of "appropriated funds" (Budget Code 7f) is currently under Second-Order Admissibility review by the OSA.  
      *    15.1 Until supertruth of appropriation status is established for FY [REDACTED], all non-essential expenditure (Category 3b: "Stationery exceeding determinately necessary levels") is suspended.  
      *    15.2 Essential heating and lighting for the Office of First-Order Admissibility has been granted provisional supertruth status via Emergency Directive OSA/E-4. All other offices operate under INDETERMINATE power allocation. Staff are advised to bring blankets.  

  **Section F: Reporting**  
  16. All designations must use the prescribed forms:  
      *    H-17a (Heap/Not Heap/Indeterminate)  
      *    B-22c (Bald/Hirsute/Indeterminate)  
      *    S-2 (Suspected Second-Order Indeterminacy)  
      *    PC-1 (Penumbral Credit Transaction)  
  17. Forms must be completed in triplicate. Copies marked "ARCHIVE (POTENTIAL SUPERTRUTH)", "WORKING COPY (CONTEXTUAL SHARPENING)", and "OSA REVIEW (PENUMBRAL)".  

  ---
  **Deputy Director (Compliance) Signature:** [Illegible Stamp]  
  **Distribution:** All Field Officers, OSA Liaison, Theoretical Compliance Unit, Archives (Indeterminate Access Status)  

  ---

  **LEAKED MARGINAL NOTES (Epistemicist Clerk, "E.C."):**  

  1.  **Beside Clause 9 ("It is supertrue that a determinate threshold exists..."):**  
      *Well obviously there is! It’s 8,129 grains. Or maybe 8,130? Point is, it’s written down somewhere. Probably locked in the DD’s safe next to the *real* budget figures. All this "indeterminate" rot is just because they won’t admit we’re too thick to know the number. – E.C.*

  2.  **Beside Clause 10.1 ("...the statement ‘n is the threshold’ is penumbral..."):**  
      *See? They admit no *n* can be *known* as the threshold! But one of them *is* it. Bet if you saw a pile of True N and one of True N-1 side-by-side, you’d swear they were identical. You’d *think* they were both heaps or both not. Your belief would be wrong for one of them, but you’d never know which. Hence: safe job for life writing "INDETERMINATE". – E.C.*

  3.  **Beside Clause 14.1 ("Status remains ‘INDETERMINATE’ indefinitely..."):**  
      *Nightmare. You could spend your whole career knee-deep in borderline piles, filing S-2s about whether your *ruling* on the pile’s heap-status was itself borderline... and never once realise that *this specific pile here* (points at 8,129 grains) is *actually, definitely* the cutoff. You just can’t tell when you’re standing in the penumbra. Makes me want to go bald. Determinate bald. – E.C.*
