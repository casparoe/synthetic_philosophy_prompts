prompt: |-
  I've just joined the research ethics board at my hospital, and a colleague has backed me into an argument I can't escape but also can't accept.

  (1) Consent is an intentional state, so it is always consent to an act under some description — nobody consents to a touching or a procedure full stop.
  (2) If A consents to φ as A conceives it, and the act that actually occurs does not satisfy that description, then A's consent does not cover the act that occurred.
  (3) Any false belief about any feature of the act, or of the person performing it, means the description A was consenting under is not satisfied by what actually happens.
  (4) So any deception — even about a feature A is indifferent to, even one A would have consented straight through without pausing — means A did not consent to what happened.
  (5) Contact that isn't consented to is a battery, and consent has to be contemporaneous, so later ratification can't cure it.
  (6) Hence every deception study, every surgery performed by a substitute surgeon, every placebo dispensed with a misleading rationale, and arguably every procedure consented to on the basis of an optimistically framed risk estimate, is a battery.

  That conclusion is absurd, but I can't locate the movable part, and I'd like the diagnosis plus the price list: which step do you reject, why did it look innocent, and what does rejecting it commit me to?

  Two things I want in particular. First, my colleague's repair: distinguish consent to the contact, which she says is object-involving — it attaches to this person's body and this act, and is nearly indefeasible — from consent to the transaction, which is description-sensitive and is voided by fraud, giving a claim for deception but not a battery. Does that distinction hold, or does it merely relocate the question to which level a given deception operates on? And what does it imply about the identity-deception cases, where the intuitive verdict is that consent was vitiated even though the physical act was exactly what was agreed to?

  Second, the counterfactual test. We lean heavily on whether the person would still have consented had she known. But consider a case it handles oddly: the investigators' deception was irrelevant to the participant, who would have enrolled anyway, and was instead essential to getting the protocol past us — the false detail sat in the protocol, not the consent form. She looks unwronged and her consent looks valid, yet the investigators plainly did something wrong. Is the would-have-consented-anyway question a test of validity at all, or only a test of whether the deceived person was harmed or wronged? If the latter, what test of validity is left?

  I'd rather keep the intuitive verdict in the identity cases than the result in (6), but I want to know what that costs me.
reasoning: |-
  Okay, the user is dealing with a complex ethical argument about consent and deception, particularly in medical contexts. They've outlined a colleague's reasoning that leads to an absurd conclusion - that virtually all deceptive practices in research or medicine constitute battery. The user needs help identifying which premise to reject, understanding the implications of that rejection, and evaluating their colleague's proposed solution.

  First, let me unpack the colleague's argument step by step. The core issue seems to be premise (3) - the claim that any false belief about any feature of an act voids consent. This is clearly overbroad. In medical ethics, we routinely accept that consent can still be valid despite minor inaccuracies or irrelevant false beliefs. For example, if a patient consents to surgery by "Dr. Smith" but the anesthesiologist is actually "Dr. Smiith" with an extra i, that shouldn't void consent. The critical question is whether the false belief concerns a material aspect of the procedure.

  The colleague's proposed distinction between "consent to contact" versus "consent to transaction" seems helpful but incomplete. While it might work for cases like placebo prescriptions (where the physical contact is consented to), it struggles with identity deception cases where the physical act is identical but the identity of the actor matters. This suggests we need a more nuanced approach to materiality.

  The user's counterfactual test question is particularly insightful. The "would they have consented anyway" test is better understood as measuring harm or wrongness rather than validity of consent itself. For consent to be valid, we need actual understanding of material facts, not just hypothetical willingness. This explains why deception in protocols might be unethical even if it doesn't affect a particular patient's decision - it violates institutional trust and integrity standards.

  Rejecting premise (3) is the cleanest solution, but it requires developing a robust theory of materiality. Courts have taken various approaches: patient-oriented (what would a reasonable patient care about?), subjective (what did this particular patient care about?), or autonomy-based (what affects self-determination?). Each has tradeoffs the user should consider based on their institutional needs.

  The identity deception cases show why we need this materiality filter. When a doctor impersonates another, it violates trust in a way that's fundamental to medical relationships, even if the physical procedure is identical. This suggests autonomy concerns can make certain deceptions material regardless of physical consequences.

  For the research ethics board context, the user should establish clear guidelines distinguishing material from immaterial information. They might categorize common scenarios: undisclosed residents assisting surgery would typically be immaterial, while placebo use without disclosure in research requires special justification and IRB oversight.

  The cost of this approach is some loss of bright-line rules. Materiality assessments will be contextual and sometimes disputed. But this is preferable to the colleague's absurd conclusion that makes standard medical practices legally battery.
answer: |-
  Here's the diagnosis and price list for your colleague's argument, focusing on rejecting the problematic premise while preserving intuitive verdicts in identity cases and addressing the counterfactual test issue:

  **Diagnosis:**
  The movable part is **Premise (3)**. Its claim that *any* false belief voids consent is overbroad and conflates material with immaterial features. This premise mistakes the *scope* of consent for an all-or-nothing phenomenon when consent operates on a spectrum of materiality.

  **Why it looks innocent:**
  It appears logically sound – if consent is description-relative (Premise 1), and the actual act doesn't match the description (due to deception), consent seems void. This aligns with formal logic but ignores the *normative purpose* of consent: protecting autonomy from material harm/wrong, not enforcing perfect informational symmetry.

  **What rejecting (3) commits you to:**
  1. **A Materiality Requirement:** You must distinguish *material* from *immaterial* features of an act. Only deception about material features vitiates consent to the act itself.
  2. **Defining Materiality:** This is the core challenge. Materiality can be:
     - *Subjective:* What *this patient* would consider important (risks, identity, nature of act)
     - *Objective:* What a *reasonable person* would consider important
     - *Autonomy-based:* What fundamentally affects the patient's ability to exercise self-determination regarding bodily integrity
  3. **Contextual Judgment:** Materiality isn't a fixed list; it requires case-by-case assessment (though guidelines help).

  **Price List (Implications):**
  - **Cost:** Loss of bright-line rule; introduces ambiguity requiring ethical judgment.
  - **Benefit:** Avoids the absurd conclusion (6) while preserving battery claims in egregious deception cases (e.g., impersonation).
  - **Medical Context:** Requires defining "core elements" of consent (nature of procedure, risks, benefits, alternatives) as presumptively material.

  ---

  ### Addressing Your Specific Requests

  **1. Your Colleague's Repair ("Consent to Contact" vs. "Consent to Transaction"):**
  - **Does the distinction hold?** Partially, but it's unstable.
    - *Contact:* Consent to physical invasion (e.g., "incision at site X") is relatively stable but *not* indefeasible. Identity deception (e.g., surgeon impersonation) shows physical contact alone isn't sufficient – the *who* can be material to autonomy.
    - *Transaction:* Consent to the broader purpose/context (e.g., "surgery by Dr. Smith" or "taking a therapeutic drug").
  - **Relocation Problem:** Yes. The core issue becomes: **When does a deception shift from merely voiding "consent to the transaction" to voiding "consent to the contact"?** The answer depends on whether the deceived feature was material to the *bodily autonomy decision*. Impersonation vitiates contact consent because trust in the *performer* is often integral to bodily permission.
  - **Identity-Deception Verdict:** This distinction *fails* to protect the intuitive wrong in identity cases. If consent to contact is "nearly indefeasible," impersonation wouldn't be battery – which clashes with legal/ethical consensus (e.g., *DeMay v. Roberts*). Rejecting Premise (3) and adopting materiality better handles this: the surgeon's identity is often material to the consent for surgery.

  **2. The Counterfactual Test ("Would they have consented anyway?"):**
  - **Is it a test of validity?** **No.** It's primarily a test of **harm or wrongful causation**, not validity.
    - *Validity Test:* Focuses on whether the person had sufficient *understanding* of *material* facts to exercise autonomy at the time of consent. Actual understanding is key, not hypothetical willingness.
    - *Harm/Wrong Test:* If they *would have consented anyway*, the deception may not have caused them to undergo an unwanted procedure (no harm/no autonomy violation *for them*), but it doesn't make the consent *valid*. The act of deception may still be wrong (violating honesty, institutional integrity).
  - **Your Protocol Deception Case:**
    - *Consent Validity:* If participants weren't deceived about anything *material* to *their* decision (the false detail was only in the protocol), their consent is likely valid. They understood the material facts *they* cared about.
    - *Wrongdoing:* The investigators *did* act wrongly by deceiving the REB, violating research integrity, and potentially breaching professional/regulatory duties. But this doesn't retroactively invalidate the participant's consent or turn the procedure into battery *against the participant*. The wrong is to the institution/regulatory system.
  - **What test of validity is left?** **Actual understanding of material facts at the time of consent.** This requires:
    - Disclosure of all facts material to *that person's* decision (subjective) or to a reasonable person's decision (objective).
    - Absence of coercion/incapacity.
    - The deceived fact must be material to the consent decision.

  ---

  ### Verdict Preservation & Costs
  - **Keeping Identity Cases:** Rejecting Premise (3) and adopting materiality preserves the intuitive wrong in identity deception (e.g., impersonating a surgeon is battery). The cost is accepting that not *every* deception is battery.
  - **Cost Summary:**
    - **Ambiguity Cost:** You must define "materiality" (subjective vs. objective tests have trade-offs).
    - **Institutional Cost:** Requires robust consent processes documenting material disclosures.
    - **Edge Cases:** Some deceptive practices (e.g., placebos in clinical *practice*) remain ethically contentious even if not battery. Battery law sets a floor, not the ceiling of ethics.
    - **Research Context:** Deception studies require REB waiver proving: (a) necessity, (b) minimal risk, (c) debriefing, and crucially, (d) deception isn't about *material* risks or discomforts.

  **Practical Path Forward:** Adopt a **hybrid materiality standard**: 
  > *"Consent is invalidated by deception only if the deceived fact (a) would be considered material by a reasonable person in the patient's position, OR (b) was subjectively material to this patient (if known)."* 

  This satisfies ethics boards, courts, and intuition – without collapsing into absurdity.
