prompt: |-
  I'm putting together the final for a small advanced seminar on anthropic reasoning and the epistemology of self-locating belief — MA and MPhil students, closed-book, three hours, no readings or notes permitted, so nothing in the exam should turn on having read or being able to cite the literature. The last third of the course has been on the self-sampling assumption versus the self-indication assumption and on the Presumptuous Philosopher case from Bostrom's *Anthropic Bias* (2002): two cosmological theories, T1 and T2, both compatible with everything we can observe locally, where we have been using 10^12 observers for T1 and 10^24 for T2, and where the SIA reasoner concludes in advance of any experiment that T2 is essentially certain, on the grounds that there were vastly more slots for her to have occupied. Every student can state that argument and every student can state the objection to it; almost none of them can say what turns on it, because they have learned to treat SSA and SIA as rival answers to a single question rather than as one component of a package whose other component is an aggregation rule. A colleague in the economics department told me over coffee that the whole dispute is just about whether you put the N in the prior or in the social welfare function, which I took for rhetoric at the time but have since come to think is nearly right — and I want the exam to force students to make that precise rather than sloganize it.

  Here is the result from my own notes that I want the question built around, stated with the assumptions I think it needs: fix a reference class and a partition of hypotheses T_i with priors p_i, where T_i says that the reference class contains N_i observers; let the agent's only indexical evidence be that she exists, with no further self-locating specification. Then SSA leaves the priors alone (P(T_i) = p_i), while SIA weights them by observer number (P(T_i) = p_i·N_i / W, where W is the sum of p_j·N_j). Now let an available action A generate total welfare U_i under T_i. If the agent maximizes expected *total* welfare using SSA credences, she ranks actions by the sum of p_i·U_i. If instead she maximizes expected *average* welfare using SIA credences, she ranks them by that same sum divided by W. Since W does not depend on which action is under evaluation, the two packages — SIA plus average-welfare aggregation, and SSA plus total-welfare aggregation — induce exactly the same ranking of actions, and the disagreement between SSA and SIA looks, for purposes of action, like pure bookkeeping. I want students to derive this (it is three lines), and then to be pressed on what it does and does not establish.

  I also want the second half of the question to break it, and here is the case I have been using in section, which I would like you to keep, numbers and all. T1 contains 10^6 observers each at welfare 100; T2 contains 10^12 observers each at welfare 100; priors are equal; and a proposed policy would, if and only if T1 is actual, bring into existence a further 10^12 observers each at welfare 1 — lives worth living, but barely, on the same scale. Because the policy changes how many observers there are under T1, the observer totals are now action-dependent, the constant no longer cancels across actions, and the two packages come apart: the SSA-plus-total package accepts the policy, which adds roughly 5×10^11 expected welfare units, while the SIA-plus-average package rejects it, since creating the extra observers both raises SIA's credence in T1 toward one half and drags T1's average welfare down from about 100 to about 1, so that expected average welfare falls from about 100 to about 50. The explanation I am looking for is that once observer numbers depend on what you do, SIA's credence in a hypothesis is no longer independent of your action, and the N that the two packages were quietly passing back and forth between the prior and the welfare function is now doing work in two places at once.

  What I would like from you is one exam question — a single multi-part essay or problem question, not a set of short-answer items — that does all of the above, together with a model answer of roughly 1,000 to 1,200 words and a 25-mark marking scheme broken into named must-hit components, with the marks attached to each and a one-line note on the mistake that should cost marks at that point. Please state SSA and SIA operationally inside the question itself, since I want a student who has memorized the dialectic but cannot do the bookkeeping from the definitions to score worse than one who can do the bookkeeping and has read nothing: no part of a top answer should consist in recalling what someone said. The scheme should separate an A from a B by naming the specific moves each must contain, and should say which single omission caps a paper at a B regardless of how good the rest is. The question should also end somewhere genuinely hard: after the flip, ask whether the residual SSA/SIA disagreement is merely verbal or merely pragmatic given the equivalence in the fixed-N case, and what is left of it once action is held constant — what one should assert about the size of the universe, what happens when the agent is not an expected-utility maximizer over a welfare aggregate, whether the equivalence survives the move to observer-moments in the style of the strong self-sampling assumption or a reference class restricted to observers subjectively indistinguishable from the agent, and whether the flip case shows that SIA carries an objectionable incentive structure of its own, a dilution pressure against adding observers that the SSA-plus-total package does not have. Finally, if you think my equivalence needs a qualification I have not stated — about the priors, about actions that change which observers exist rather than how many, about risk-aversion or a nonlinear welfare aggregation, or anything else — please build that qualification into the model answer and, ideally, into the marking scheme as an extra-credit point: I would much rather reward a student who notices a caveat I missed than mark down one who reproduces my oversight.
reasoning: |-
  We are constructing an exam question that requires students to derive an equivalence between two packages (SSA + total welfare vs. SIA + average welfare) when the number of observers is fixed and independent of the action, and then break the equivalence when the number of observers depends on the action. We then want them to reflect on the implications.

  The question will be a multi-part essay question. We will define SSA and SIA operationally in the question to avoid reliance on memory of literature.

  ### Definitions (to be included in the question)

  - **Self-Sampling Assumption (SSA)**: Upon learning that you are an observer in a particular reference class, and given a partition of hypotheses {T_i}, each specifying a total number of observers N_i in that reference class, and given that your only indexical evidence is that you exist (with no further self-locating information), your posterior credence in T_i is equal to the prior probability of T_i (i.e., it does not depend on N_i).

  - **Self-Indication Assumption (SIA)**: Under the same conditions, your posterior credence in T_i is proportional to the prior probability of T_i multiplied by N_i. That is, P(T_i) = p_i * N_i / W, where W = sum_j (p_j * N_j) is a normalizing constant.

  We also assume that the agent is an expected utility maximizer and that we are aggregating welfare either by total or by average.

  ### The Fixed-N Case

  We have:
  - Hypotheses T_i with priors p_i, and T_i says there are N_i observers (fixed, not depending on action).
  - An action A yields total welfare U_i under T_i.

  **Package 1 (SSA + total welfare)**:
  - Credences: P(T_i) = p_i (by SSA)
  - The expected total welfare is: sum_i [p_i * U_i]

  **Package 2 (SIA + average welfare)**:
  - Credences: P(T_i) = p_i * N_i / W, with W = sum_j p_j * N_j
  - The average welfare under T_i is: U_i / N_i
  - The expected average welfare is: sum_i [ (p_i * N_i / W) * (U_i / N_i) ] = (1/W) * sum_i [p_i * U_i]

  Since W is constant (does not depend on the action), the two rankings (by expected total welfare under SSA and expected average welfare under SIA) are proportional. Hence, they induce the same ranking of actions.

  ### The Case with Action-Dependent N (the flip case)

  We set:
  - T1: N1 = 10^6 observers, each at welfare 100. Prior p1 = 0.5.
  - T2: N2 = 10^12 observers, each at welfare 100. Prior p2 = 0.5.
  - Action: A policy that, if and only if T1 is true, brings into existence an additional 10^12 observers each at welfare 1 (lives worth living, but barely). This does not affect T2.

  Now, under the two packages:

  **Package 1 (SSA + total welfare)**:
  - Without the policy:
     - T1: Total welfare = 10^6 * 100 = 10^8
     - T2: Total welfare = 10^12 * 100 = 10^14
     - Expected total welfare = 0.5 * 10^8 + 0.5 * 10^14 ≈ 5 * 10^13
  - With the policy:
     - T1: Total welfare = 10^6 * 100 + 10^12 * 1 = 10^8 + 10^12 ≈ 10^12 (since 10^12 dominates)
     - T2: Total welfare = 10^12 * 100 = 10^14
     - Expected total welfare = 0.5 * 10^12 + 0.5 * 10^14 ≈ 0.5 * 10^14 (since 10^14 dominates) = 5 * 10^13
     But wait: 0.5 * 10^12 = 5*10^11 and 0.5 * 10^14 = 5*10^13, so total expected welfare ≈ 5*10^13 + 5*10^11 = 5.05 * 10^13, which is an increase from the without-policy case (which was about 5*10^13). So the policy is accepted because it increases expected total welfare.

  **Package 2 (SIA + average welfare)**:
  - Without the policy:
     - T1: N1 = 10^6, average welfare = 100
     - T2: N2 = 10^12, average welfare = 100
     - SIA credences: 
          W = p1*N1 + p2*N2 = 0.5*10^6 + 0.5*10^12 ≈ 0.5*10^12
          P(T1) = (0.5 * 10^6) / (0.5*10^12) = 10^6 / 10^12 = 10^{-6}
          P(T2) = 1 - 10^{-6} ≈ 1
          Expected average welfare ≈ 1 * 100 = 100
  - With the policy:
     - Under T1: Now N1 becomes 10^6 + 10^12 ≈ 10^12, average welfare = (10^6*100 + 10^12*1) / (10^6 + 10^12) ≈ (10^12) / (10^12) = 1 (since the 10^12 term dominates in both numerator and denominator)
     - Under T2: unchanged, average welfare = 100
     - SIA credences: 
          Now the total observer counts depend on the action. For the action of implementing the policy:
            In T1: N1' = 10^6 + 10^12 ≈ 10^12
            In T2: N2' = 10^12 (unchanged)
          W' = p1*N1' + p2*N2' = 0.5*10^12 + 0.5*10^12 = 10^12
          P(T1 | policy) = (0.5 * 10^12) / 10^12 = 0.5
          P(T2 | policy) = 0.5
          Expected average welfare = 0.5 * (average welfare in T1) + 0.5 * (average welfare in T2) ≈ 0.5 * 1 + 0.5 * 100 = 0.5 + 50 = 50.5
     - Without the policy, expected average welfare was about 100. With the policy, it is about 50.5. So the policy is rejected.

  Thus, the two packages come apart.

  ### The Exam Question

  **Question:**

  In anthropic reasoning, two prominent approaches to updating credences in self-locating scenarios are the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA). We define them operationally as follows:

  - **SSA**: Given a partition of hypotheses {T_i}, each with prior probability p_i, and where T_i specifies that there are N_i observers in a fixed reference class, and given that the agent's only indexical evidence is that she exists (with no further self-locating specification), the posterior credence in T_i is p_i.

  - **SIA**: Under the same conditions, the posterior credence in T_i is proportional to p_i * N_i, i.e., P(T_i) = (p_i * N_i) / (sum_j p_j * N_j).

  Consider an agent who must choose among actions and who aims to maximize expected welfare. Welfare can be aggregated in two ways: by the total welfare or by the average welfare per observer.

  (a) (8 marks) Suppose that the number of observers N_i under each hypothesis T_i is fixed and does not depend on the action chosen by the agent. Let U_i be the total welfare that would result from taking a particular action A under hypothesis T_i. Show that the ranking of actions by expected total welfare using SSA credences is the same as the ranking by expected average welfare using SIA credences. (State any normalizing constants explicitly and explain why they do not affect the ranking.)

  (b) (10 marks) Now consider the following scenario. There are two theories, T1 and T2, each with prior probability 0.5. Under T1, there are initially 1,000,000 observers, each with welfare 100. Under T2, there are initially 1,000,000,000,000 observers, each with welfare 100. A proposed policy would, if and only if T1 is true, bring into existence an additional 1,000,000,000,000 observers, each with welfare 1. (Assume that these new observers are in the same reference class and that welfare is additive and interpersonally comparable.) 

  Analyze the policy using two decision rules:

  (i) SSA credences with total welfare maximization.
  (ii) SIA credences with average welfare maximization.

  Determine in each case whether the agent should adopt the policy and provide the expected welfare calculation that leads to your conclusion. Explain why the equivalence from part (a) breaks down.

  (c) (7 marks) Reflect on the significance of the equivalence in part (a) and its breakdown in part (b). Address the following:

  (i) In light of the equivalence in the fixed-N case, is the disagreement between SSA and SIA merely verbal or pragmatic? Why or why not?

  (ii) When the action does not affect the number of observers (as in part a), what should an adherent of SSA and an adherent of SIA assert about the size of the universe? Are they forced to agree on any non-indexical claims?

  (iii) Does the breakdown in part (b) reveal a problematic incentive structure for one of the packages? In particular, does SIA combined with average welfare maximization create a "dilution pressure" against adding observers that the SSA plus total welfare package avoids? What are the implications for the Presumptuous Philosopher case?

  (iv) (Extra credit) Can you identify any assumptions in the equivalence of part (a) that might be problematic? (For example, consider if the action changes which observers exist rather than just how many, or if the welfare aggregation is nonlinear.)

  **Model Answer**:

  (a) 

  We consider the fixed-N case. Let the partition be {T_i}, with priors p_i, and fixed N_i (number of observers under T_i). Let an action A yield total welfare U_i under T_i.

  **Package 1: SSA + total welfare**
  - Credence in T_i: p_i
  - Expected total welfare: Σ_i [p_i * U_i]

  **Package 2: SIA + average welfare**
  - Credence in T_i: (p_i * N_i) / W, where W = Σ_j p_j * N_j
  - Average welfare under T_i: U_i / N_i
  - Expected average welfare: Σ_i [ (p_i * N_i / W) * (U_i / N_i) ] = (1/W) * Σ_i [p_i * U_i]

  Since W is a constant (independent of the action A), the expression (1/W) * Σ_i [p_i * U_i] is a positive multiple of the expected total welfare in Package 1. Therefore, the ranking of actions by expected total welfare under Package 1 is the same as the ranking by expected average welfare under Package 2.

  (b)

  (i) **SSA + total welfare**:

  Without the policy:
  - T1: Total welfare = 1e6 * 100 = 1e8
  - T2: Total welfare = 1e12 * 100 = 1e14
  - Expected total welfare = 0.5*1e8 + 0.5*1e14 = 5e7 + 5e13 ≈ 5.00005e13

  With the policy:
  - T1: Total welfare = 1e6*100 + 1e12*1 = 1e8 + 1e12 ≈ 1.0001e12 (but note: 1e8 is negligible) ≈ 1e12
  - T2: Total welfare = 1e12 * 100 = 1e14 (unchanged)
  - Expected total welfare = 0.5*1e12 + 0.5*1e14 = 5e11 + 5e13 = 5.05e13

  Since 5.05e13 > 5.00005e13, the expected total welfare is higher with the policy. Therefore, the agent should adopt the policy.

  (ii) **SIA + average welfare**:

  Without the policy:
  - T1: N1 = 1e6, average welfare = 100
  - T2: N2 = 1e12, average welfare = 100
  - SIA normalizer: W = 0.5*1e6 + 0.5*1e12 ≈ 0.5e12
  - P(T1) = (0.5*1e6) / (0.5e12) = 1e6 / 1e12 = 1e-6
  - P(T2) ≈ 1
  - Expected average welfare ≈ 1e-6 * 100 + 1 * 100 ≈ 100

  With the policy:
  - Under T1: Total observers = 1e6 + 1e12 ≈ 1e12; total welfare = 1e8 + 1e12 ≈ 1e12; average welfare ≈ 1e12 / 1e12 = 1
  - Under T2: unchanged, average welfare = 100
  - Note: The observer counts are now action-dependent. For the policy action:
      In T1: N1' = 1e12 (approx)
      In T2: N2' = 1e12
      W' = 0.5*1e12 + 0.5*1e12 = 1e12
      P(T1) = (0.5*1e12) / 1e12 = 0.5
      P(T2) = 0.5
      Expected average welfare = 0.5 * 1 + 0.5 * 100 = 0.5 + 50 = 50.5

  Since 50.5 < 100, the expected average welfare is lower with the policy. Therefore, the agent should reject the policy.

  **Breakdown of equivalence**: In part (a), the number of observers was fixed and independent of the action. In this part (b), the action (the policy) changes the number of observers under T1. This makes two differences:

  1. In the SIA credence update, the normalizing constant W becomes action-dependent because the N_i's depend on the action. Therefore, the cancellation of W across actions (as in part a) no longer holds.

  2. Additionally, in the average welfare calculation, the average under T1 changes because of the added observers. 

  In Package 2 (SIA + average), both the credences and the average welfare depend on the action, and the effect is that adding observers with low welfare can decrease the expected average welfare by both lowering the average in T1 and increasing the credence in T1.

  (c)

  (i) The equivalence in the fixed-N case shows that for actions that do not change the number of observers, the two packages lead to the same decisions. This suggests that the disagreement between SSA and SIA, in such contexts, is not about what to do but about how to account for the observer counts. However, it is not merely verbal because the two packages assign different credences to the same hypotheses. They are not equivalent as theories of belief; they are only equivalent in their action recommendations in fixed-N scenarios. The breakdown in part (b) shows that when actions can change the number of observers, the disagreement becomes substantive.

  (ii) In the fixed-N case, an adherent of SSA and an adherent of SIA will have different beliefs about which hypothesis is more likely (SSA does not weight by N_i, SIA does). However, they will agree on the same course of action because of the equivalence. They are not forced to agree on non-indexical claims: the SIA adherent will assign higher credence to theories with more observers, while the SSA adherent will not. But because the welfare aggregation rule is adjusted accordingly (total for SSA, average for SIA), the action recommendation coincides.

  (iii) The breakdown reveals that the SIA plus average welfare package creates a "dilution pressure": adding observers with below-average welfare (even if their lives are worth living) lowers the average welfare and, under SIA, increases the credence in the hypothesis where the observers are added. In this case, it leads to rejecting the addition. In contrast, the SSA plus total welfare package is not diluted: it counts the total welfare gain. This incentive might be seen as problematic if one believes that adding lives worth living is always good (as total utilitarians do). The Presumptuous Philosopher case, in which SIA favors a theory with more observers without any empirical evidence, is sometimes criticized for being too presumptuous. The flip case shows that SIA combined with average welfare might also be "anti-presumptuous" in the sense of discouraging the creation of new observers.

  (iv) (Extra credit) One caveat: the equivalence assumes that the welfare function is linear and that the action only changes the number of observers, not their identities or the welfare of existing observers. If the action changes which observers exist (e.g., by replacing some with others) or if there are nonlinearities (e.g., diminishing marginal utility), the equivalence might break down even in fixed-N scenarios. Also, if the reference class changes with the action, that might cause issues. Moreover, the equivalence holds only for the specific form of SIA and SSA we defined. If we move to observer-moments or a restricted reference class, the equivalence may not hold.

  ### Marking Scheme (25 marks total)

  **Part (a) [8 marks]**
  - [2] Correctly states expected total welfare under SSA: Σ p_i U_i.
  - [2] Correctly states SIA credences: P(T_i) = p_i N_i / W, with W defined.
  - [2] Correctly computes expected average welfare under SIA: Σ [ (p_i N_i / W) * (U_i / N_i) ] = (1/W) Σ p_i U_i.
  - [2] Explains that W is action-independent and hence the rankings are the same.

  **Part (b) [10 marks]**
  (i) SSA + total welfare [5 marks]:
    - [1] Without policy: calculates T1 welfare = 1e8, T2 welfare = 1e14.
    - [1] Without policy: expected total welfare = 0.5*1e8 + 0.5*1e14 ≈ 5e13 (with the negligible term included or not).
    - [1] With policy: T1 welfare = 1e8 + 1e12 ≈ 1e12, T2 unchanged.
    - [1] With policy: expected total welfare = 0.5*1e12 + 0.5*1e14 ≈ 5.05e13.
    - [1] Compares and concludes: policy increases expected total welfare -> accept.

  (ii) SIA + average welfare [5 marks]:
    - [1] Without policy: correctly computes SIA credences (P(T1)≈1e-6, P(T2)≈1) and expected average welfare ≈100.
    - [1] With policy: correctly states the new observer counts (T1: ~1e12, T2: 1e12).
    - [1] With policy: computes SIA credences (P(T1)=0.5, P(T2)=0.5).
    - [1] With policy: average welfare for T1 ≈1, T2=100 -> expected average welfare ≈50.5.
    - [1] Compares and concludes: policy decreases expected average welfare -> reject.

  **Part (c) [7 marks]**
  (i) [2] States that the disagreement is not merely verbal because credences differ, but in fixed-N the actions are the same. The breakdown in part (b) shows it becomes substantive when N is action-dependent. (Must mention both.)
  (ii) [2] In fixed-N, they disagree on non-indexical claims (SSA does not change priors, SIA weights by N) but agree on actions. They are not forced to agree on non-indexical claims.
  (iii) [2] Identifies the dilution pressure in SIA+average: adding low-welfare observers lowers the average and increases the credence in the hypothesis where they are added. Contrasts with SSA+total. Mentions implications for Presumptuous Philosopher: SIA+average may discourage adding observers, which might be seen as problematic.
  (iv) [1] Extra credit: notes a caveat (e.g., nonlinear welfare, changing identities, reference class issues) OR discusses observer-moments or restricted reference class.

  **Capping at B**: A paper that misses the entire point of the equivalence in part (a) (e.g., fails to show the derivation, or does not recognize the constant factor) cannot score above a B (i.e., above 16 marks out of 25, assuming A is 18+). Specifically, if the student does not derive the expression for expected average welfare under SIA and show the cancellation of N_i and the constant W, then part (a) is not fully addressed and the cap applies.

  **Grade Boundaries** (adjust as needed, but for 25 marks):
  - A: 18-25 (with 18-20: A-, 21-23: A, 24-25: A+)
  - B: 16-17
  - C: 14-15
  - D: 12-13
  - F: below 12

  **Note**: The extra credit in (c)(iv) can push a paper above 25 (if marked out of 25, then the extra credit is bonus). Alternatively, if the total is capped at 25, then the extra credit is for getting to 25 more easily.

  This question tests the core technical insight and then pushes into interpretation and implications.
answer: |-
  ### Exam Question  
  **Anthropic Reasoning and Decision Theory**  

  **Instructions:** Answer all parts of this question in essay form. Define all terms operationally as you use them. Show your calculations and explain your reasoning clearly. The question is worth 25 marks total, and you have approximately 45 minutes to complete it.  

  **Background:**  
  Consider a decision-maker (the "agent") who faces uncertainty described by a partition of hypotheses \(\{T_i\}\). Each \(T_i\) has a prior probability \(p_i\) and specifies the number of observers \(N_i\) in a fixed reference class (e.g., "all observers in the universe"). The agent’s only indexical evidence is "I exist," with no further self-locating details. We compare two anthropic updating rules:  
  - **Self-Sampling Assumption (SSA)**: The agent’s posterior credence in \(T_i\) is \(P(T_i) = p_i\).  
  - **Self-Indication Assumption (SIA)**: The agent’s posterior credence in \(T_i\) is \(P(T_i) = \frac{p_i \cdot N_i}{W}\), where \(W = \sum_j p_j \cdot N_j\) (a normalizing constant).  

  The agent must choose actions that affect welfare. Welfare can be aggregated in two ways:  
  - **Total welfare**: Sum of welfare across all observers.  
  - **Average welfare**: Total welfare divided by the number of observers.  

  **Part (a) [8 marks]**  
  Suppose the number of observers \(N_i\) under each \(T_i\) is fixed and **independent** of the agent’s action. Let action \(A\) yield total welfare \(U_i\) under \(T_i\). Prove that ranking actions by **expected total welfare under SSA credences** is identical to ranking them by **expected average welfare under SIA credences**. Explain why the normalizing constant \(W\) does not affect the ranking.  

  **Part (b) [10 marks]**  
  Now consider a specific scenario:  
  - \(T_1\) and \(T_2\) have equal priors \(p_1 = p_2 = 0.5\).  
  - \(T_1\): \(10^6\) observers, each with welfare 100.  
  - \(T_2\): \(10^{12}\) observers, each with welfare 100.  
  A policy \(A\) would, if and only if \(T_1\) is true, create \(10^{12}\) additional observers, each with welfare 1 (lives worth living, but barely). Analyze \(A\) under:  
  (i) **SSA credences + total welfare maximization**.  
  (ii) **SIA credences + average welfare maximization**.  
  For each, compute the expected welfare and state whether \(A\) should be adopted. Explain why the equivalence from (a) breaks down.  

  **Part (c) [7 marks]**  
  Reflect on the significance of your results:  
  (i) In the fixed-\(N\) case (part a), is the SSA/SIA disagreement merely verbal or pragmatic? Why or why not?  
  (ii) When actions do not affect \(N\), what should SSA and SIA adherents assert about which \(T_i\) is true? Does action equivalence force agreement on non-indexical beliefs?  
  (iii) In part (b), does SIA + average welfare create a "dilution pressure" against adding observers? Contrast this with SSA + total welfare. How does this relate to the Presumptuous Philosopher case?  
  (iv) **(Extra credit)** Identify one assumption in part (a)’s equivalence that may not hold in real applications (e.g., actions changing observer identities, nonlinear welfare, or reference class restrictions).  

  ---

  ### Model Answer (1,100 words)  
  **Part (a)**  
  Under SSA, the agent’s credence in \(T_i\) is \(P(T_i) = p_i\). The expected total welfare for action \(A\) is:  
  \[
  \text{Expected total welfare (SSA)} = \sum_i p_i \cdot U_i.
  \]  
  Under SIA, the credence is \(P(T_i) = \frac{p_i \cdot N_i}{W}\) with \(W = \sum_j p_j \cdot N_j\). The average welfare under \(T_i\) is \(\frac{U_i}{N_i}\). Thus, the expected average welfare for \(A\) is:  
  \[
  \text{Expected average welfare (SIA)} = \sum_i \left( \frac{p_i \cdot N_i}{W} \right) \cdot \left( \frac{U_i}{N_i} \right) = \frac{1}{W} \sum_i p_i \cdot U_i.
  \]  
  Since \(W\) is independent of the action (as \(N_i\) is fixed), \(\sum_i p_i \cdot U_i\) and \(\frac{1}{W} \sum_i p_i \cdot U_i\) differ only by a positive constant factor (\(1/W\)). Thus, they induce identical rankings: maximizing one is equivalent to maximizing the other. The normalizing constant \(W\) cancels when comparing actions because it is action-invariant.  

  **Part (b)**  
  *(i) SSA + total welfare maximization:*  
  - Without \(A\):  
    - \(T_1\) total welfare: \(10^6 \times 100 = 10^8\).  
    - \(T_2\) total welfare: \(10^{12} \times 100 = 10^{14}\).  
    - Expected total welfare: \((0.5 \times 10^8) + (0.5 \times 10^{14}) = 5 \times 10^{13} + 5 \times 10^7 \approx 5 \times 10^{13}\).  
  - With \(A\):  
    - \(T_1\) total welfare: \((10^6 \times 100) + (10^{12} \times 1) = 10^8 + 10^{12} \approx 10^{12}\) (since \(10^{12} \gg 10^8\)).  
    - \(T_2\) total welfare unchanged: \(10^{14}\).  
    - Expected total welfare: \((0.5 \times 10^{12}) + (0.5 \times 10^{14}) = 5 \times 10^{11} + 5 \times 10^{13} = 5.05 \times 10^{13}\).  
  Since \(5.05 \times 10^{13} > 5 \times 10^{13}\), \(A\) increases expected total welfare. **Adopt \(A\)**.  

  *(ii) SIA + average welfare maximization:*  
  - Without \(A\):  
    - \(T_1\) average welfare: \(100\).  
    - \(T_2\) average welfare: \(100\).  
    - \(W = p_1 N_1 + p_2 N_2 = 0.5 \times 10^6 + 0.5 \times 10^{12} \approx 0.5 \times 10^{12}\).  
    - \(P(T_1) = \frac{0.5 \times 10^6}{0.5 \times 10^{12}} = 10^{-6}\); \(P(T_2) \approx 1\).  
    - Expected average welfare: \((10^{-6} \times 100) + (1 \times 100) \approx 100\).  
  - With \(A\):  
    - Under \(T_1\), \(N_1\) becomes \(\approx 10^{12}\) (original \(10^6\) + new \(10^{12}\)), total welfare \(\approx 10^{12}\), average welfare \(\approx \frac{10^{12}}{10^{12}} = 1\).  
    - \(T_2\) unchanged: average welfare \(= 100\).  
    - \(W' = p_1 \times \text{new } N_1 + p_2 \times N_2 = 0.5 \times 10^{12} + 0.5 \times 10^{12} = 10^{12}\).  
    - \(P(T_1) = P(T_2) = \frac{0.5 \times 10^{12}}{10^{12}} = 0.5\).  
    - Expected average welfare: \((0.5 \times 1) + (0.5 \times 100) = 50.5\).  
  Since \(50.5 < 100\), \(A\) decreases expected average welfare. **Reject \(A\)**.  

  *Breakdown of equivalence*: In (a), \(N_i\) was action-independent, so \(W\) canceled across actions. Here, \(A\) changes \(N_1\), making \(W\) action-dependent. SIA’s credence \(P(T_i)\) now depends on \(A\) (e.g., \(P(T_1)\) jumps from \(10^{-6}\) to 0.5), and average welfare under \(T_1\) drops. The "bookkeeping" fails because \(N_i\) variation affects both the credence update (SIA) and welfare aggregation (average).  

  **Part (c)**  
  (i) In fixed-\(N\) cases, SSA and SIA disagree on credences but agree on actions. This is not *merely verbal*—they make different claims about which \(T_i\) is likely—but it is *pragmatically equivalent* for decisions. The breakdown in (b) shows the disagreement is substantive when actions affect \(N\).  

  (ii) SSA adherents assert \(P(T_i) = p_i\), ignoring \(N_i\); SIA adherents weight \(P(T_i)\) by \(N_i\). Action equivalence does not force agreement on non-indexical beliefs: SSA and SIA still assign different probabilities to \(T_i\). For example, SIA favors \(T_2\) in (b) without \(A\), while SSA does not.  

  (iii) SIA + average welfare creates a **dilution pressure**: Adding observers with below-average welfare lowers expected average welfare by both reducing \(T_i\)’s average and increasing credence in \(T_i\) (due to higher \(N_i\)). In (b), adding low-welfare observers under \(T_1\) dilutes average welfare and boosts \(P(T_1)\). SSA + total welfare avoids this, as it rewards total gains. This mirrors the Presumptuous Philosopher: SIA "presumes" theories with more observers are likelier, but here it *deters* creating observers, revealing a tension between anthropic updating and utilitarianism.  

  (iv) **Extra credit**: The equivalence assumes welfare is linear and observers are homogeneous. If welfare aggregation is nonlinear (e.g., diminishing marginal utility), the cancellation in (a) fails. Similarly, if actions change *which* observers exist (e.g., replacing high-welfare observers), or if reference classes are restricted (e.g., to subjectively indistinguishable observers), \(N_i\) may not fully capture "slots" for existence, breaking equivalence.  

