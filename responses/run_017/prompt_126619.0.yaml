  ### Marking Scheme (25 marks)  
  **Part (a) [8 marks]**  
  - **Derive SSA expected total welfare [2]**: \(\sum_i p_i U_i\).  
    *Error*: Incorrect SSA credence or missing summation.  
  - **Derive SIA expected average welfare [3]**: \(\sum_i (p_i N_i / W) \cdot (U_i / N_i) = (1/W) \sum_i p_i U_i\).  
    *Error*: Incorrect SIA credence, failure to simplify \(N_i\), or missing \(W\).  
  - **Equivalence explanation [2]**: Rankings identical because \(W\) is action-independent.  
    *Error*: Claims \(W\) cancels without noting action-independence.  
  - **Normalizing constant [1]**: Explicitly defines \(W = \sum_j p_j N_j\).  
    *Error*: No definition of \(W\).  

  **Part (b) [10 marks]**  
  *(i) SSA + total [5]*:  
  - **Without \(A\) [1]**: Correct \(U_i\) and expected welfare \(\approx 5 \times 10^{13}\).  
  - **With \(A\) [2]**: Correct new \(U_1 \approx 10^{12}\), expected welfare \(= 5.05 \times 10^{13}\).  
  - **Decision [1]**: Adopt \(A\) (increase).  
  - **Calculation clarity [1]**: Units and approximations consistent.  
    *Error*: Miscompute welfare or omit approximation.  

  *(ii) SIA + average [5]*:  
  - **Without \(A\) [2]**: Correct \(P(T_1) \approx 10^{-6}\), expected avg welfare \(\approx 100\).  
  - **With \(A\) [2]**: Correct new \(P(T_1) = 0.5\), expected avg welfare \(= 50.5\).  
  - **Decision [1]**: Reject \(A\) (decrease).  
    *Error*: Wrong \(W'\) or miscompute average welfare under \(T_1\).  

  **Part (c) [7 marks]**  
  - **(i) Verbal/pragmatic? [2]**: Not merely verbal (credences differ), but pragmatically equivalent in fixed-\(N\) [1]. Breakdown shows substantive when \(N\) action-dependent [1].  
  - **(ii) Beliefs and agreement [2]**: SSA: \(P(T_i) = p_i\); SIA: \(P(T_i) \propto p_i N_i\) [1]. Action equivalence ≠ belief agreement [1].  
  - **(iii) Dilution pressure [2]**: SIA+avg deters adding low-welfare observers; SSA+total does not [1]. Contrast with Presumptuous Philosopher (SIA favors large \(N_i\), but here deters creating \(N\)) [1].  
  - **(iv) Extra credit [1]**: Valid caveat (e.g., nonlinear welfare, changing observer identities, reference class issues).  

  **Capping at B (16 marks)**: A paper missing the **equivalence derivation in (a)** (e.g., no simplification of SIA average welfare) cannot score above 16, regardless of other quality. This is the core insight.  

