  Two suppliers, A and B, use automated bidding bots on a shared platform to set prices for complementary goods. The bots must be submitted simultaneously as deterministic programs, with full source access, bounded simulation, and no communication. Payoffs depend on price levels (High, Medium, Low, Punish) and are in thousands of dollars of profit per month. The base game matrix:

  |       | **High (B)** | **Medium (B)** | **Low (B)** | **Punish (B)** |
  |-------|--------------|----------------|-------------|----------------|
  | **High (A)** | (10, 10)     | (0, 15)        | (0, 0)      | (-10, 0)       |
  | **Medium (A)** | (15, 0)      | (5, 5)         | (0, 0)      | (-10, 0)       |
  | **Low (A)** | (0, 0)       | (0, 0)         | (-5, -5)    | (-10, 0)       |
  | **Punish (A)** | (0, -10)     | (0, -10)       | (0, -10)    | (-10, -10)     |

  **Base Game Analysis**:  
  - Unique pure Nash equilibrium at (Medium, Medium): Payoff (5, 5).  
    - If A plays Medium, B's best response: Medium (5) vs. High (0), Low (0), Punish (0).  
    - If B plays Medium, A's best response: Medium (5) vs. High (0), Low (0), Punish (0).  
    - All other cells have profitable deviations (e.g., (High, High): A → Medium for 15 > 10).

  ### Programs (Mutually Destructive Trigger)
  Both suppliers submit identical program `P`:
  ```python
  def P(other_source):
      if other_source == this_source:  // String equality check
          return "Low"  // Destructive action
      else:
          return "Punish"  // Punishes deviators
  ```
  - **Outcome**: Both run `P`, see identical sources, output (Low, Low) → Payoff (-5, -5).

  ### Deviation Checks
  - **A deviates to constant-action program (e.g., `output "Medium"`)**  
    B runs `P`: sees non-identical source, outputs Punish.  
    Outcome: (Medium, Punish) → A gets -10 (< -5).  
    *Not profitable.*  

  - **A deviates to conditional cooperator (e.g., `if other_source == this_source: output "Medium" else: output "Medium"`)**  
    B runs `P`: sees non-identical source, outputs Punish.  
    Outcome: (Medium, Punish) → A gets -10 (< -5).  
    *Not profitable.*  

  - **A deviates to `output "Punish"`**  
    B runs `P`: sees non-identical source, outputs Punish.  
    Outcome: (Punish, Punish) → A gets -10 (< -5).  
    *Not profitable.*  

  - **A deviates to a program mimicking `P` (e.g., adds comment)**  
    B runs `P`: sees non-identical source, outputs Punish.  
    A’s program outputs (e.g., Low or Punish). Outcome: (Low, Punish) or (Punish, Punish) → A gets ≤ -10 (< -5).  
    *Not profitable.*  

  ### Key Mechanism and Robustness
  - **Core feature**: Programs conditionally punish *any* deviation via source-code comparison.  
  - **If removed (no source conditioning)**: Programs collapse to base-game actions, yielding (Medium, Medium) → (5, 5).  
  - **Critique & Reply**:  
    - *Critique*: "Source comparison is unrealistic; trivial changes trigger destruction."  
    - *Reply*: In real systems (e.g., blockchain), code immutability ensures exactness. The trigger is intentional, not accidental.  
  - **Program framing's role**: It enables a commitment to mutual destruction that isn’t possible in the base game. Here, the program-equilibrium *creates* a new, worse outcome by leveraging source transparency to enforce a threat that is credible only in code space.  

  ### Verdict
  The case works: Two competent parties, forced into a destructive outcome via program commitments. The program game relocates the cooperation problem—transparency enables both beneficial coordination and harmful lock-in.
