prompt: |-
  Hi — I'm on the attributions panel at a decent-sized museum (paintings and sculpture, mostly European, plus a modern bit) and we've got a case next month that I think exposes us. Our verdicts so far, for whatever there worth: a Roman marble figure that's a copy of a lost Greek bronze — we labelled it 'Roman copy after a Greek original' and refused the big name; a huge 17th-century workshop canvas where the master painted the heads and hands and the shop did the draperies, finishing them after he died — 'workshop of', no bare 'by'; a set of enormous shiny sculptures by a very famous living artist who has never physically touched any of them (they're built by technicians from his computer files and he's happy to call them his) — 'by'; a signed readymade from the 1910s, a factory-made object he simply chose, whose original got smashed and was replaced in the 1960s with a new example of the same model that he authorised — we accepted the replacement as the work itself; a print made after the photographer's death from his own negative, by a printer following written instructions he'd left — 'by', with the print date in brackets; and a painting we now know was done start to finish by a forger in the 1920s, which has been on our walls for eighty years and is genuinely lovely — we refused the attribution but kept it up under a new label saying 'imitator of'.

  Now the new one. A sculptor who died in 2019 worked with a fabricator and had shown a piece only in plaster, but her studio notes (in her hand, undated) specify a bronze edition of six, the foundry and the patina. She had one bronze pulled from those moulds in 1998 and signed it off; that bronze was destroyed in a warehouse fire in 2005. The foundation she set up has now had a new bronze cast from the same moulds and wants to give it to us as 'by [her], cast 2024'. The valuation on the gift form is roughly fifteen times what it would be if we call it 'after' — which its not supposed to matter to us but, you know, it does.

  What I want is exactly five numbered points, a sentence or two each, no intro and no conclusion. 1) The two or three rules about what an attribution actually asserts that fit all six of those earlier verdicts — I can think of maybe 'the artist's hand', 'the artist said so', and something about the label being a claim with money riding on it, but you'll do it better. 2) What each of those rules says about the 2024 bronze, including whether it matters that she signed off a cast from these very moulds in 1998. 3) Your best guess at what we'll actually decide, and why that rule rather than the others. 4) The closest analogue among the six precedents, and whether it's really close. 5) The one further case we'd have to rule on that would best tell the surviving rules apart. If you think we've allready been inconsistent somewhere, say where — that can slot into whichever point it belongs in.
reasoning: |-
  Alright, the user is part of an attributions panel at a museum dealing with European paintings, sculpture, and modern art. They've described several past cases and now face a new dilemma about a bronze sculpture. The artist died in 2019, had a plaster original, specified a bronze edition in her notes, but only one bronze was made in 1998 and destroyed. Now, her foundation wants to cast a new bronze in 2024 and label it as "by [her]". The valuation difference is significant—fifteen times higher if labeled as "by" versus "after". 

  The user wants five specific points. Let me break down each point they asked for. First, they need the core rules derived from their past decisions. Looking at their precedents: the Roman copy was labeled as copy after original, refusing the big name. The workshop piece got "workshop of" even though the master did parts. The living artist's tech-made sculptures are "by" since he claims them. The replaced readymade was accepted as the work. The posthumous print is "by" with date. The forgery was reattributed as "imitator of". 

  From these, the common threads seem to be: the artist's direct involvement or endorsement, the work existing during their lifetime, and authenticity linked to the creator's intent. For the Roman copy, the original artist didn't make it, so not attributed to them. The workshop piece had partial involvement but not full, hence "workshop of". The living artist endorses the tech-made pieces, so "by". The readymade's replacement was authorized, so accepted. The print was from the artist's negative and instructions, so "by". The forgery lacked any artist connection, so reattributed. So the rules are: lifetime creation/approval, artist's endorsement, and authenticity over physical hand.

  Next, applying these rules to the 2024 bronze. The artist specified the edition in her notes, which shows intent. She approved the 1998 cast, so the molds were valid. But the 2024 cast wasn't made during her lifetime, and she didn't endorse this specific piece. The 1998 approval doesn't extend to posthumous casts unless specified. Without her direct approval of this cast, it might not meet the endorsement rule. The physical hand wasn't involved, but that wasn't a barrier in other cases (like the tech-made sculptures). The key issue is her absence in approving this specific cast.

  For what they'll likely decide, considering the museum's past: they accepted the readymade replacement because the artist authorized it. Here, the artist didn't authorize the 2024 cast. The print was "by" because the artist left instructions. But the bronze wasn't cast from her instructions posthumously; the foundation is doing it now. They might lean on the 1998 approval as validating the molds, but since she's not here to approve this cast, they might use "after" or note the cast date. The valuation pressure might push them towards "by", but precedents suggest caution. Probably they'll call it "estate-approved cast" or similar, avoiding "by" but not fully "after".

  The closest precedent is the posthumous print. Both involve posthumous creation based on artist's plans. But the print had explicit instructions left by the artist, whereas here the foundation is acting on her notes without her overseeing the process. The readymade replacement is also similar because the artist authorized the replacement, but that was during his lifetime. The 2024 bronze lacks the artist's direct authorization for this specific cast, making it less close than the print case.

  To clarify the rules, a test case would be an artist specifying an edition but dying before any casts are made. If they accept that as "by", then the rule is intent over execution. If not, then lifetime approval is key. The user's museum accepted the print based on instructions, so maybe they'd accept hypothetical bronze casts from instructions. But without such a case, the rules are fuzzy. The inconsistency might be with the readymade: authorizing a replacement during lifetime vs. posthumous actions. If they require the artist's presence for approval, then the 2024 bronze doesn't qualify. 

  Also, the user might be worried about institutional pressure due to the high valuation. They need a principled decision that aligns with past rulings. Highlighting the endorsement rule as key ties the precedents together. Pointing out the print as closest but noting the lack of direct instructions for the bronze cast can justify a different label. Suggesting a test case where no lifetime creation occurred would force defining whether intent alone suffices.
answer: |-
  Here are your five points, as requested:

  1)  **Core Attribution Rules:** Your precedents consistently rely on **artist authorization/endorsement** (the artist claimed or approved the specific object/process, e.g., living artist's tech works, readymade replacement, posthumous print), **lifetime conception/execution oversight** (the work materially existed or its core creation was directed by the artist during their lifetime, e.g., workshop piece, print negative), and **authenticity as defined by the creator's intent** (the label reflects the artist's own understanding of what constitutes their work, even if not made by their hand, e.g., readymade, tech sculptures).

  2)  **Rules Applied to 2024 Bronze:** Authorization/Endorsement exists only for the *1998 cast* and the *idea/concept* of an edition; the 2024 cast itself lacks the artist's direct approval. Lifetime execution oversight applies to the *plaster original* and the *1998 cast*, not the 2024 object. Authenticity via Intent is partially met (she specified the process/edition) but crucially, she never saw, approved, or signed *this specific 2024 object*. The 1998 approval validates the *moulds and process* but not *posthumous casts* absent explicit instructions *for them*.

  3)  **Likely Decision & Rule:** You will likely **reject "by [artist]"** and use a formulation like "Conceived by [artist]; cast 2024 by [foundry] under the supervision of [Foundation]" or similar. The decisive rule is **Authorization/Endorsement of the specific object**. While the *concept* was authorized, the *2024 physical object* was not directly approved by the artist during her lifetime, unlike the 1998 cast. The lifetime oversight rule also fails for this cast.

  4)  **Closest Precedent & Analogy:** The **posthumous print** is the closest analogue. Both involve creating a physical object after death based on the artist's prior specifications. However, it's **not truly close**: the print had *explicit written instructions left by the artist for posthumous execution*. The bronze notes specify an *edition concept* but lack documented intent/instructions *for posthumous casting after the initial approved cast was destroyed*. The foundation's action is interpretive, not directly instructed.

  5)  **Revealing Test Case:** The case that would best clarify the rules is: **An artist leaves detailed, signed instructions for a specific, unrealized edition to be cast posthumously by a named foundry (but dies before any are made).** If you label the first posthumous cast "by [artist]", you prioritize *Authenticity via Intent/Instructions* over *Lifetime Execution* and *Authorization of the specific object*. If you label it "after" or specify the executor, you prioritize the lack of direct Authorization/Endorsement of any object and Lifetime oversight. (*Note: Inconsistency potentially lies with the readymade replacement; you accepted the *artist's lifetime authorization* of the replacement concept, not posthumous fabrication based on notes.*)
