prompt: |-
  I have supported myself by writing novels for thirty years, and a pattern in the way my colleagues reason about career decisions has begun to bother me.

  Two cases. A friend was offered the choice between a modest guaranteed advance for a dependable book in a series she had already established, and no advance but a far larger share of royalties on a riskier one. She multiplied the share by her agent's estimates, found the second option worth considerably more on average, and took it. So did several of us, on the stated ground that a writing life contains many such choices and that the averages will look after themselves. She has now taken that bet four times, been unlucky twice, and cannot place the fifth book on the terms the first would have secured. Another writer of my acquaintance, who has never once taken the option with the larger average payout, has had a steadily widening career and is now offered more than either of us.

  What bothers me is the direction of the argument. The defence of averaging — there will be many decisions, so expect the average — seems to get weaker, not stronger, the more decisions there are. Over many choices, the person who takes the higher average every time becomes nearly certain to end up worse than the person who does not, and the gap widens with each additional decision. That inversion is the thing I cannot name.

  I should say what I take it not to be. It is not caution about large losses: no single one of these choices threatened to ruin anyone, and nobody was risking money already in hand. It is not that her estimates were poor; suppose them exactly right. And it is not a matter of spreading risk: she could not take both options and had no one to share them with.

  A friend in finance, hearing this, said something about geometric averages that I did not follow, and then gave an account which assumed one is reinvesting money and can lose the whole of one's stake on any single bet. Neither is my situation. In a writing career the floor is soft: a poorly selling book does not bankrupt you, it reduces the print run, the review coverage and the shelf space available to the next one, so that the rate at which a career grows depends on where it currently is, and there is a level below which it decays slowly towards nothing without ever quite arriving.

  Does the phenomenon I have described have an established name, and does the standard treatment of it survive the soft floor? If the nearest established concept fits only imperfectly, I would rather have the mismatches spelled out — including how the thing differs from ordinary aversion to risk, and from ruin in the usual sense — than be handed a label I can repeat. One boundary case matters to me especially: does any of this still apply to a writer who intends to write exactly three more books and then stop, so that there is no long run to appeal to? Please answer in British English.
reasoning: |-
  Okay, the user is a seasoned novelist with thirty years of experience, troubled by a pattern in career decisions among fellow writers. They describe two colleagues: one repeatedly took higher-risk royalty deals based on average payoff calculations but faced declining opportunities after some failures, while another consistently chose safer advances and achieved steady career growth. 

  The core paradox baffling them is why the "law of averages" argument seems to backfire over multiple decisions—the more bets taken, the more likely the risk-taker falls behind the cautious player. They've ruled out standard explanations: it's not loss aversion (no ruinous single loss), not poor estimation (assume perfect forecasts), not diversification constraints (choices are mutually exclusive). 

  Their finance friend mentioned geometric means and reinvestment risk, but those don't fit the publishing industry's "soft floor" reality—where failures don't bankrupt but erode future opportunities incrementally. The user wants precise terminology for this phenomenon and analysis of whether it applies even to short sequences (e.g., three books). 

  First, I recognize this as a multiplicative process where outcomes compound non-neutrally—each book's success modulates the next's starting conditions. Unlike financial ruin models, the decay here is asymptotic; careers fade but never hit zero. The closest framework is multiplicative processes with absorbing barriers, but the soft floor makes it a "reflecting barrier with decay" instead. 

  Key distinctions from standard risk concepts: 
  - Not variance aversion (the safer option has lower average payoff but less dispersion)  
  - Not Kelly criterion (no reinvestment of winnings)  
  - The risk manifests as path dependence: early failures constrain future options even if later bets succeed  

  For the three-book case, averaging still fails because terminal wealth depends on the product of growth rates, not the sum. A single flop could halve the audience for subsequent books. The cautious writer's strategy minimizes downside correlation with future opportunities—a meta-risk management the risk-taker overlooks when maximizing per-deal averages.  

  The finance friend's geometric mean insight was directionally correct but misapplied due to assumptions about total loss and reinvestment. Here, the "stake" is the career's momentum, which degrades partially with each failure.  

  British phrasing note: "maths" not "math", "whilst" where suitable, "career capital" as a core metaphor. Will emphasise that "nearly certain to end up worse" reflects ergodicity breaking—the time average (one writer's career path) diverges from the ensemble average (hypothetical parallel universes).
answer: |-
  You've put your finger on a profound and often counterintuitive phenomenon, one particularly acute in creative careers with path dependence. The established concept that best captures the *essence* of your dilemma is the **multiplicative nature of career growth** and the critical difference between **arithmetic mean** and **geometric mean** when evaluating sequences of decisions – even without financial ruin or reinvestment. Your finance friend was on the right track, but the standard explanation doesn't perfectly fit your "soft floor" scenario. Let's unpack it.

  1.  **The Core Concept: Multiplicative Processes & The Geometric Mean**
      *   **The Situation:** Your career trajectory isn't additive; it's multiplicative. Each book's success (or lack thereof) acts as a *multiplier* on your existing "career capital" (reputation, audience size, publisher confidence, shelf space, review access). A modest success might multiply your current standing by 1.1x; a breakout hit by 2.0x; a flop by 0.7x. The *order* and *sequence* matter enormously.
      *   **The Arithmetic Mean Fallacy:** Your friend calculated the *arithmetic mean* expected value: (High Royalty Option Estimated Payoff * Probability) + (Low Payoff * Probability). This treats each outcome as independent and additive. It assumes a £10,000 outcome followed by a £20,000 outcome is equivalent to a £15,000 outcome twice (£30k total either way).
      *   **The Geometric Mean Reality:** In multiplicative processes, what matters is the *geometric mean* of the growth factors. The geometric mean of 1.1 and 2.0 is √(1.1 * 2.0) ≈ √2.2 ≈ 1.48. The geometric mean of 0.7 and 2.0 is √(1.4) ≈ 1.18. The *product* (1.1 * 2.0 = 2.2) is much larger than (0.7 * 2.0 = 1.4). The sequence starting lower but growing steadily yields a higher *overall* multiplier than the sequence with a large drop followed by a recovery, even if the arithmetic averages were similar (here, 1.55 vs 1.35 arithmetic average growth factors!). The risk-taker suffers more from the downside because it shrinks the base for future multiplication.

  2.  **Why the "Average" Defence Weakens with More Decisions:**
      *   **Compounding Asymmetry:** Losses (downward multipliers <1) compound more destructively than gains (upward multipliers >1) compound constructively, relative to the arithmetic mean. To recover from a 0.7x multiplier (a 30% decline in "career capital"), you need a subsequent multiplier of approximately 1.43x just to get back to where you started. A single bad outcome creates a hole that takes disproportionate success to climb out of.
      *   **Path Dependence & The Soft Floor:** This is where the "soft floor" is crucial. A flop doesn't send you to zero (ruin), but it significantly reduces your base (print run, marketing, confidence) for the *next* book. This lower base means:
          *   The *same* level of intrinsic success (e.g., same quality, same reader appeal) on the next book will yield *lower absolute results* (smaller sales, lower royalties) because the starting platform is smaller.
          *   Achieving the *same absolute outcome* (e.g., £20k royalties) requires *disproportionately more success* (e.g., a multiplier of 1.6x instead of 1.2x) from the diminished base.
      *   **The Long Run Trap:** Over many decisions, the risk-taker exposes themselves to the possibility of *multiple* downward multipliers. Because of the compounding asymmetry and path dependence, a single significant downward multiplier early on (or, critically, a cluster of them) can permanently depress the trajectory below what the safe player achieves, even if the risk-taker occasionally hits a big win. The safe player avoids these large downward steps, ensuring their base remains stable or grows slowly but steadily. Each "safe" decision protects the platform for the *next* decision. The "averages" (arithmetic mean) do *not* look after themselves because the *distribution* of outcomes (specifically, the presence of large negative multipliers) and their *sequence* drastically alter the long-term product.

  3.  **The Name & The Mismatches**
      *   **Established Name:** The closest established concept is understanding outcomes via the **Geometric Mean** or the mathematics of **Multiplicative Processes/Path-Dependent Growth**. It's deeply linked to the **Kelly Criterion** in finance (maximizing long-term growth rate), but Kelly typically assumes:
          *   Reinvestment of all capital.
          *   The possibility of total loss (ruin) on a single bet.
          *   Objective probabilities.
      *   **Mismatches with Your Scenario:**
          *   **No Reinvestment:** You aren't betting your entire accumulated wealth on each book. You're betting your *career momentum/capital*, which *is* path-dependent and multiplicative, but not directly fungible cash.
          *   **Soft Floor vs. Ruin:** The key difference. Your career doesn't hit zero ("ruin"); it asymptotically decays towards obscurity but never technically vanishes. The *impact* of a downward multiplier is not total loss but a persistent reduction in the base for future growth. This makes the destructive power of negative multipliers *less* extreme than in ruin models but *more* persistent and insidious than in simple additive models. The risk isn't bankruptcy, but stagnation and decline.
          *   **Not Primarily Risk Aversion:** Ordinary risk aversion is about disliking uncertainty or potential losses *per se*. This phenomenon explains *why* risk aversion can be rational *even when* the arithmetic mean is higher and *even when* no single loss is catastrophic. It's about the *structural dynamics* of growth in a multiplicative, path-dependent system. It's a rational response to the *ergodicity problem* – the long-term outcome for a *single individual* taking repeated bets (the time average) differs from the average outcome of many people taking the bet once (the ensemble average).

  4.  **The Three-Book Case: Does it Still Apply?**
      *   **Absolutely, Yes.** Path dependence and multiplicative effects operate over *any* sequence longer than one.
      *   **Why:** The terminal value (your career position after book 3) depends on the *product* of the growth multipliers from your *current* starting point: `Terminal Position = Current Position * Mult1 * Mult2 * Mult3`.
      *   **The Risk:** Choosing the high-average-risk option for book 1 carries the danger of a low multiplier (e.g., 0.7x). Even if books 2 and 3 are moderately successful (e.g., 1.2x each), the terminal position is `Current * 0.7 * 1.2 * 1.2 = Current * 1.008`. Barely any growth over three books.
      *   **The Safe Alternative:** Choosing the safe option for book 1 (e.g., 1.05x), followed by safe options for 2 and 3 (also 1.05x), yields `Current * 1.05 * 1.05 * 1.05 ≈ Current * 1.158`. A nearly 16% increase in career capital.
      *   **The Danger of the Early Flop:** The high-risk path *could* yield `Current * 2.0 * 1.1 * 1.1 = Current * 2.42` (a huge win), but it also risks `Current * 0.7 * 1.1 * 1.1 = Current * 0.847` (a net decline). Crucially, an *early* flop (Book 1 = 0.7x) significantly handicaps the potential gains from books 2 and 3, making it harder to achieve a good terminal position. The safe strategy minimises the chance of an early catastrophic multiplier that poisons the subsequent sequence. The risk-taker maximises the *chance* of a very high terminal value but *also* maximises the chance of a low or negative growth trajectory over the three books. The safe player maximises the chance of *steady, positive growth*.

  **In Summary:**

  The phenomenon you observe is the **superiority of strategies minimizing large downward multipliers in multiplicative, path-dependent growth processes**, precisely because of the **compounding asymmetry of losses and the soft floor effect**. While often discussed in finance under "Geometric Mean Maximization" or the "Kelly Criterion," your scenario differs crucially due to the lack of total reinvestment and the presence of a soft floor (persistent decay rather than ruin). The core insight remains: maximising the arithmetic mean expected value per decision is a poor strategy for long-term (or even medium-term) growth when outcomes multiply. Protecting the base (career capital) from significant erosion is paramount, as recovery from setbacks is disproportionately difficult. This explains why your consistently cautious acquaintance prospered: they avoided the large negative multipliers that permanently drag down the *product* of outcomes, even if the *sum* of expected values suggested otherwise. The inversion you perceive is the **divergence between the arithmetic mean expectation and the geometric mean reality of compounded growth under path dependence.** It applies just as forcefully to your planned three final books as it does to a decades-long career.
