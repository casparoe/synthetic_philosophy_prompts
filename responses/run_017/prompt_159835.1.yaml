  - what_I_keep — array of the step numbers I can still hold onto, each with a short note on what holding it now commits me to
  - biggest_remaining_cost
  - confidence_0_100 — your confidence in the diagnosis overall
  - least_certain_point — the single thing in your answer you're least sure about, and why

  Say somewhere how confident you are in the diagnosis as a whole, and single out the bit you're least sure of.
