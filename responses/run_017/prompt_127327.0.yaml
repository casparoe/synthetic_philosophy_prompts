  ### Decision Tree for Bertrand's Chord Paradox  
  **Entry Point**: Three defensible methods for "random chord" yield probabilities ≈1/3 (two endpoints uniform on circumference), 1/2 (radius uniform, then point uniform along it), and 1/4 (midpoint uniform in disk).  

  ---

  #### **Decision Tree**  
  1. **Does the problem ("random chord in a unit circle longer than side of inscribed equilateral triangle") have a unique correct probability?**  
     - **Yes** → 2  
     - **No** → 3  

  2. **Why is it unique?**  
     - Mathematical symmetry/invariance decides it → 4  
     - Physical chance setup decides it → 5  

  3. **How resolve under-specification?**  
     - Add mathematical conditions (e.g., symmetry) → 4  
     - Specify physical mechanism → 5  
     - Accept multiple answers as valid → **Leaf B: Permissive**  

  4. **Which transformations should probability be invariant under?**  
     - Rotations of the circle only → 6  
     - Rotations, translations, and scalings (ignore circle’s size/location) → **Leaf G: Jaynes**  
     - Rotations and translations (rigid motions of plane) → 7  

  5. **Which quantity should indifference apply to?**  
     - Angular positions of endpoints → **Leaf C: Endpoints**  
     - Distance of midpoint from center → **Leaf D: Radius**  
     - Position of midpoint in disk → **Leaf E: Midpoint**  
     - Length of chord → **Leaf H: Uniform Length**  
     - None—symmetry is primary → 4  

  6. **Apply your (rotations-only) method to a square: Probability a random chord is longer than its side?**  
     *(Square chosen: finite rotational symmetry tests generalizability)*  
     - Use square’s symmetries (rotations/reflections) → **Leaf I: Symmetry-Per-Shape**  
     - Same parameterization as circle (e.g., uniform endpoints) → **Leaf J: Consistent Parameterization**  
     - Fails; circle is special → **Leaf A: Under-Specification**  

  7. **Apply your (rotations + translations) method to a square:**  
     - Use rigid-motion measure for all shapes → **Leaf F: Rigid-Motion for All**  
     - Use square’s own symmetries → **Leaf I: Symmetry-Per-Shape**  
     - Only for circles → **Leaf A: Under-Specification**  

  ---

  #### **Leaves**  
  | Label                   | Position Statement                                                                 | Awkward Commitment                                                                 |
  |-------------------------|------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | **A: Under-Specification** | Problem is ill-posed; no answer until specified.                                   | Doesn’t explain why the three methods seem natural.                              |
  | **B: Permissive**       | Many answers are valid; "random" is incomplete.                                    | No definite answer; paradox only highlights ambiguity.                           |
  | **C: Endpoints**        | Probability = 1/3 via uniform independent endpoints.                              | Result depends on arbitrary choice of circle parameterization.                   |
  | **D: Radius**           | Probability = 1/2 via uniform radius then uniform point.                          | Choosing "radius first" is physically unmotivated.                               |
  | **E: Midpoint**         | Probability = 1/4 via uniform midpoint in disk.                                   | Distribution not preserved under rigid motions (e.g., translation).              |
  | **F: Rigid-Motion for All** | Probability = 1/2 via measure on lines invariant under rotations/translations.  | For non-circular shapes (e.g., square), ignores the shape’s own symmetries.     |
  | **G: Jaynes**           | Probability = 1/2 via invariance under rotations, translations, and scalings.    | Group choice is circle-specific; doesn’t generalize to non-circular shapes.      |
  | **H: Uniform Length**   | Probability = (2 - √3)/2 ≈ 0.134 via uniform chord length.                      | Chord length is rarely uniform in natural processes; no physical basis.         |
  | **I: Symmetry-Per-Shape** | For each shape, use its symmetry group to define "random."                      | For circles, rotational symmetry alone doesn’t yield a unique probability.       |
  | **J: Consistent Parameterization** | For any shape, use same method (e.g., uniform endpoints). Probability = 1/3 for circle. | No deep reason to prefer one parameterization (e.g., endpoints over length). |

  ---

  #### **Coincidences & Blind Spots**  
  - **Coincidences**:  
    - **Same probability (1/2) for circle, but separable**:
      - *Jaynes (G)* vs. *Rigid-Motion for All (F)*: Ask about a **square**. *Jaynes* fails (scaling breaks square); *Rigid-Motion* applies but yields a non-1/2 probability.  
      - *Radius (D)* vs. *Jaynes (G)*: Use a **spherical variant** (random point on sphere, P(near equator)). Indifference over latitude (→ P=0.5) vs. surface area (→ P≈0.293) separates them.  
  - **Blind Spots (Empty Cells)**:  
    - *Uniform Length (H)*: Yields ≈0.134, but no defenders. **Diagnosis**: Coherent but unattractive—no symmetry or common physical process justifies it.  
    - *Only Rotations (without further conditions)*: Leads to non-unique measures. **Diagnosis**: Unresolved—fragments into other leaves (e.g., *Under-Specification*).  

  ---

  #### **Walk-Throughs**  
  - **Student 1 (No determinate answer)**:  
    1 → No (3) → Accept multiple (B) → **Leaf B: Permissive**  
  - **Student 2 (Symmetry decides)**:  
    1 → Yes (2) → Symmetry (4) → Full group (rotations/translations/scalings) → **Leaf G: Jaynes**  

  ---

  #### **Key: Classic Methods → Leaves**  
  | Method                   | Leaf            | Awkward Commitment Rejected?                                  |
  |--------------------------|-----------------|-------------------------------------------------------------|
  | **Endpoints** (≈1/3)   | C: Endpoints    | Defenders reject "arbitrary parameterization" claim.       |
  | **Radius** (≈1/2)      | D: Radius       | Defenders reject "unmotivated" charge; cite natural setups.|
  | **Midpoint** (≈1/4)    | E: Midpoint     | Defenders reject "violates rigid motions" as irrelevant.   |
  | **Jaynes’ Invariance** (≈1/2) | G: Jaynes     | Defenders accept circle-specificity as natural.            |

  ---

  **Gloss**:  
  - *Symmetry group*: Transformations preserving structure (e.g., rotating circle).  
  - *Invariant measure*: Probability unchanged by transformations.  
  - *Simplified away*: Haar measures, maximal entropy (replaced by operational symmetry choices).  

