prompt: |-
  Bit of context first, then the ask. I'm a retired analytical chemist — ran a mass spec lab for about thirty years — and since I stopped I've been sitting in on philosophy stuff at the lifelong learning center near me. I now run the weekly "Great Questions" group there: 9 or 10 people most weeks, all retired, two ex-engineers, a former city councilman who will definately say "well that's just politics" at some point, two who are hard of hearing, and we get a room with a whiteboard and bad coffee for 75 minutes. I keep thinking about this material the way I used to think about experiments: controls, conditions, and being honest about what three trials can't show you.

  We've been circling around voting, and what I want is one session where they *feel* the thing I keep bumping into in the reading — the claim that any sensible ranked voting rule with three or more options can be gamed, that sincere voting isn't just naive but sometimes straightforwardly costly, and that this isn't a fact about bad people. I think there's a famous impossibility result about this (Gibbard-Satterthwaite? I may have the name mangled). I don't want them told it. I want them to walk into it.

  So: design me a runnable game.

  - Rules, materials, payoff scheme, and a minute-by-minute timeline for 75 minutes. Cards, chips, a hat, whiteboard — nothing digital, no real money, candy or bragging rights as stakes is fine. Everyone gets a private "true preference" card they don't show, and the payout depends on where the winner lands on their hidden card.
  - The key thing I want engineered in: a way for people to have *partial* information about how the others will vote — a straw poll, maybe deliberately noisy — so that gaming the system is tempting and sometimes works and sometimes visibly backfires. I want the group to see both outcomes, not just the clever-successful one.
  - If you can fit it in, two conditions so we can compare, the way you'd compare against a control: one round where everyone votes blind and honesty does fine, one where they get the peek. The contrast between those two should be what does the teaching, not anything I say.
  - My own pet hypothesis, which I want *tested* by the activity rather than argued about: I think the whole mess comes from throwing away intensity. In the lab we never threw away magnitude. So I've invented the "thermometer rule" — everybody marks a 0-10 feeling-dial for each option, you add the numbers up, highest total wins. Build in a round that uses my rule and lets people discover for themselves whether pumping your dial to the extremes pays. If it does, I want them to find the hole in it themselves, not me explaining why its broken afterwards.
  - Nobody should hear "strategic voting," "tactical," or any theorem name until the last ten minutes, if at all. Ideally they spend the whole hour thinking they're just picking where the group's end-of-term outing goes.
  - A debrief that maps specific moments in the session onto specific parts of the idea: what the blind round shows, what the peek round shows, what my thermometer round shows, why "it's just human nature" is the wrong lesson, and the gap between "this rule got gamed once" and "no rule escapes it." Be explicit about which of those two claims the activity actually gives evidence for and which one it doesn't and I'll just have to assert.
  - What will predictably go wrong, and what I do about it: someone who votes insincerely out of pure contrarianism and wrecks the payoff data, someone who doesn't get the scoring, the guy who concludes democracy is hopeless, someone who tries to coordinate out loud.
  - And level with me about the parts the activity can't reproduce at all. My guesses: the generality claim, the bit where preferences have to be completely unrestricted rather than lined up on some single dimension, and maybe the difference between one person gaming a rule and a bloc doing it. Tell me which of those I have to just say out loud at the end and in what words.
reasoning: |-
  We are designing a voting game for a group of 9-10 retired people, to be run in 75 minutes. The goal is to let them experience the tension between sincere and strategic voting, the possibility of gaming the system, and the inherent trade-offs in voting rules. We will avoid technical terms until the end.

  The scenario: The group is deciding where to go for their end-of-term outing. There are three options: 
  A) Art Museum (A)
  B) Botanical Garden (B)
  C) Concert in the Park (C)

  Each participant has a private preference order over these options, and a "feeling" intensity (0-10) for each. We will have three rounds, each using a different voting rule, and in some rounds, we will have a straw poll that reveals partial information.

  **Materials:**
  - Preference cards: Each card has a true preference order (e.g., A>B>C) and intensity ratings (e.g., A:10, B:5, C:0). We need to design these so that there is a conflict and strategic voting is possible.
  - Voting tokens or ballots for each round.
  - A hat for collecting ballots.
  - Whiteboard to record votes and results.
  - Candy or bragging rights as stakes. Each participant will earn points based on the outcome and their true preference. We'll use a point system that reflects their intensity.

  **Payoff scheme:**
  - For each round, if the winning option is the participant's first choice, they get 10 points; second choice, 5 points; third choice, 0 points. (Alternatively, if we use the intensity ratings, we can pay based on the actual intensity number for the winning option. But for simplicity in the first rounds, we use the rank-based points. In the thermometer round, we use the intensity ratings as both the vote and the payoff.)

  **Preference Distribution:**
  To create the possibility of strategic voting, we need a situation where one option is the Condorcet winner (beats every other in pairwise comparisons) but might not win under some rules, and where a third option is a spoiler. Also, we need to have a situation where a majority might be split between two similar options, allowing a less preferred option to win.

  We'll set up the group with the following preference profile (for 9 people):

  Group 1: 3 people with A>B>C (intensity: A:10, B:7, C:0)
  Group 2: 4 people with B>A>C (intensity: A:5, B:10, C:0)  [Note: They prefer B over A, but they like A moderately]
  Group 3: 2 people with C>A>B (intensity: A:8, B:0, C:10)  [They love C and like A, but hate B]

  This setup:
  - Without strategic voting, if we use plurality: 
    - A: 3 votes (from group1) 
    - B: 4 votes (from group2) -> wins
    - C: 2 votes (from group3)
    But note: Group3 prefers A over B, so if they could coordinate, they might want to avoid B winning.

  - If we use a ranked voting system (like Borda or IRV), the outcome might change.

  We'll run three rounds:

  Round 1: Plurality voting, blind (no information)
  Round 2: Plurality voting with a straw poll (partial information)
  Round 3: The "Thermometer Rule" (rate each 0-10, sum the ratings)

  But note: We want to show that in Round 2, with the straw poll, some voters might change their vote strategically. We also want to compare with Round 1.

  Alternatively, we might run two rounds of plurality: one blind and one with straw poll, and then the thermometer round.

  **Timeline (75 minutes total):**

  1. **Introduction (5 min):**
     - Explain the scenario: We are deciding the end-of-term outing among A, B, C.
     - Each participant gets a private preference card. They must not show it to others. The card has:
          - Their true ranking (e.g., "1st: A, 2nd: B, 3rd: C")
          - Intensity ratings: numbers from 0 to 10 for each option (to be used in Round 3 and for payoff).
     - Explain the payoff: After each round, they get points based on the winner and their true preference. For Rounds 1 and 2: 10 points if the winner is their 1st choice, 5 for 2nd, 0 for 3rd. For Round 3, they get the intensity rating of the winning option (so if the winner is A and they rated A as 8, they get 8 points). We are using the same true preferences for all rounds.

  2. **Round 1: Blind Plurality (15 min)**
     - Rules: Each person votes for one option (sincerely or not, but we hope they vote sincerely in this blind round). They write their vote on a slip and put it in the hat.
     - Collect votes, count, and announce the winner. Record on whiteboard.
     - Payoff: Assign points based on the winner and their true preference (using the 10/5/0 system for this round).

  3. **Round 2: Plurality with Straw Poll (20 min)**
     - First, conduct a straw poll: Ask everyone to raise their hand for the option they are currently planning to vote for. Record the counts on the whiteboard (without names). This is public information and may change.
     - Then, allow a minute for people to reconsider their vote in light of the straw poll. They can change their mind.
     - Collect the final votes (by ballot in hat) and count. Announce the winner and assign points.

  4. **Round 3: Thermometer Rule (20 min)**
     - Explain the rule: Each person gives a rating from 0 to 10 for each option (0=hate, 10=love). They write it on a ballot (three numbers: for A, B, C).
     - Collect ballots, sum the ratings for each option, and the option with the highest total wins.
     - Payoff: Each person gets the intensity rating they assigned to the winning option (from their true preference card) as points. Note: Here, they are asked to mark the ballot with their true feelings? Or strategically? We don't specify. We want them to consider if they should exaggerate.

     However, note: In the thermometer rule, if they vote sincerely (put their true intensity), then the outcome reflects the sum of true utilities. But if they exaggerate (e.g., put 10 for their favorite and 0 for others), then they might push their favorite to win. But if everyone does that, then it becomes equivalent to plurality (because the ratings become 10 for one and 0 for others). So we want to see if they will exaggerate.

     We can tell them: "Mark how much you like each option, but you can choose any numbers between 0 and 10." Then we'll see if they are honest or strategic.

     We might run this round without a straw poll? Or with? We want to see if they inflate. So let's do it without a straw poll first.

     Alternatively, we can run two sub-rounds: one where we ask them to vote sincerely (and we check if that's stable) and then one where they can vote strategically? But time is short.

     Let's do one round of thermometer and see what happens. They might exaggerate without prompting.

  5. **Debrief (15 min)**
     - Compare the results of the three rounds. 
     - Discuss: 
          - Round 1 (blind): Did sincere voting lead to a result that was acceptable? 
          - Round 2 (straw poll): Did some people change their vote? Why? What happened? Did it lead to a better or worse outcome for them? For the group?
          - Round 3 (thermometer): Did people rate honestly? Or did they inflate? What was the effect? 
     - Then, introduce the concepts: strategic voting, the idea that no voting rule is immune to manipulation, and the Gibbard-Satterthwaite theorem (without the name at first). 
     - Your hypothesis: We threw away intensity in the first two rounds. But in the thermometer, if everyone is honest, we capture intensity. But then we saw that it might be in their interest to lie (exaggerate). So the rule is manipulable too.

     - Explicitly state what the activity shows and what it doesn't:
          - Shows: That in some rules, under partial information, strategic voting can occur and can change the outcome (sometimes for better, sometimes worse). And that even the thermometer rule can be gamed by inflating ratings.
          - Doesn't show: That every voting rule is manipulable (we only tried two rules). Also, we had a specific preference profile. In reality, preferences might be structured (e.g., along a left-right spectrum) and then some rules are less manipulable. But if preferences are unrestricted, then no rule is strategy-proof.

     - Also, we had a small group. In a large election, it's harder to have information and coordination.

     - The gap: We saw one instance of gaming in one rule. The theorem says that for any rule (with at least three options) that is not dictatorial and satisfies some other conditions, there will be some situations where someone can benefit by voting strategically. We can't show that generality in a game.

  6. **Potential Problems and Mitigations:**
     - Contrarian voter: Someone votes insincerely just to be contrary. 
          - Mitigation: Emphasize that the goal is to maximize their own points. They have a true preference card and they should try to get as many points as they can. The points are based on their true preferences, not what they vote. 
     - Doesn't get the scoring: 
          - Mitigation: Have a practice round? Or explain clearly and check for understanding. Use the whiteboard for examples.
     - Concludes democracy is hopeless: 
          - In debrief, note that no system is perfect, but we can choose rules that are less manipulable or that have other desirable properties. Also, in practice, people often vote sincerely.
     - Tries to coordinate out loud: 
          - Rule: No talking during the voting (except during the straw poll, which is public). In Round 2, after the straw poll, they can change their vote but without discussion. If they try to coordinate, gently remind them that in real elections, you don't get to talk to everyone.

  **Preference Cards Preparation:**
  We need to create the cards for 9 people:

  - 3 cards: 
      Ranking: A > B > C
      Intensity: A:10, B:7, C:0

  - 4 cards:
      Ranking: B > A > C
      Intensity: A:5, B:10, C:0

  - 2 cards:
      Ranking: C > A > B
      Intensity: A:8, B:0, C:10

  **Expected Outcomes:**

  Round 1 (Blind Plurality):
  - Group1 (3) vote A
  - Group2 (4) vote B
  - Group3 (2) vote C
  Winner: B (4 votes). 
  Payoff: 
     Group1: 5 points (B is their 2nd)
     Group2: 10 points
     Group3: 0 points (B is their last)

  Round 2 (Straw Poll then Plurality):
  - Straw poll: same as above? Then Group3 sees that C is losing. They might switch to A to try to beat B (because they prefer A over B). 
  - If both Group3 voters switch to A, then:
     A: 3 (Group1) + 2 (Group3) = 5
     B: 4
     C: 0
     Winner: A.
  - Payoff:
     Group1: 10 (A wins) -> better
     Group2: 5 (A is their 2nd) -> worse than before (they got 10 in Round1)
     Group3: 8 (if we use the intensity? Wait, in Round2 we are using the 10/5/0 system? Then they get 5 for A (2nd choice). But note: in their true preference, A is 2nd? Actually, in their ranking: C>A>B, so A is 2nd -> 5 points. They got 0 in Round1, so 5 is better.

  But wait: in the payoff for Round2 we are using the rank-based points (10/5/0). So:
     Group1: 10 (A wins)
     Group2: 5 (A is second) -> they preferred B (which won in Round1) and now they get only 5.
     Group3: 5 (A is second) -> they preferred C, but A is second so 5.

  So Group2 is worse off. Group3 is better off (5>0). Group1 is better off (10>5).

  But note: Group3 switched and caused A to win. They got 5 instead of 0. But if they had voted sincerely, they would have gotten 0. So it worked for them. However, Group2 is unhappy because they lost their first choice.

  Alternatively, what if Group2, seeing the straw poll and anticipating that Group3 might switch, they might try to switch? But they have the majority. They might not. But if they see that A is getting 5 and they are 4, they might not switch because they prefer B over A. So they stay.

  Round 3 (Thermometer):
  - If everyone votes sincerely: 
     A: (3*10) + (4*5) + (2*8) = 30 + 20 + 16 = 66
     B: (3*7) + (4*10) + (2*0) = 21 + 40 + 0 = 61
     C: (3*0) + (4*0) + (2*10) = 0 + 0 + 20 = 20
     Winner: A (66)

     Payoff: 
        Group1: 10 (A wins) -> 10 points
        Group2: 5 (A wins) -> 5 points (but they rated A as 5, so they get 5)
        Group3: 8 (A wins) -> 8 points (they rated A as 8)

  - But if some groups exaggerate? 
     Group1: might put A:10, B:0, C:0 -> trying to boost A and hurt others.
     Group2: might put B:10, A:0, C:0.
     Group3: might put C:10, A:0, B:0.

     Then:
        A: 3*10 + 4*0 + 2*0 = 30
        B: 3*0 + 4*10 + 2*0 = 40
        C: 3*0 + 4*0 + 2*10 = 20
     Winner: B.

     Payoff (based on true intensity of the winner):
        Group1: B wins -> they get 7 (from their true intensity) -> 7 points (which is less than 10 they would have gotten with A)
        Group2: B wins -> 10 points (good for them)
        Group3: B wins -> 0 points (they hate B)

     So Group1 and Group3 are worse off than if they had been honest. Group2 is happy.

     But note: Group1 intended to help A by giving max to A and min to others, but by doing so they caused B to win (because Group2 also exaggerated and they are the largest group). So their strategy backfired.

     Alternatively, Group3 might try to be strategic: they really hate B. So they might give A a high rating (even though they prefer C) to prevent B. But if they rate A:10, C:10, B:0, then:
        A: 3*10 + 4*0 + 2*10 = 30+0+20 = 50
        B: 3*0 + 4*10 + 2*0 = 40
        C: 3*0 + 4*0 + 2*10 = 20
     Then A wins. 
     Payoff for Group3: A wins -> they get 8 (from their true intensity). They would have gotten 10 if C won, but 8 is better than 0 (if B wins). So they are better off. But note: they didn't get C, but they avoided B.

     However, we don't know if they will do that. We just let them try.

  We hope that in Round3, we see that exaggeration can lead to a worse outcome for some, and that honest voting might lead to a better outcome collectively.

  **Final Timeline Breakdown:**

  - 0-5 min: Introduction and distribute preference cards. Explain the three options and the point system for Rounds 1, 2 (10/5/0) and Round3 (intensity of winner). 
  - 5-20 min: Round1 (Blind Plurality). 
       - 5 min: Explain Round1 rules. 
       - 5 min: Vote and collect.
       - 5 min: Tally and announce winner, record on whiteboard. Assign points (write on board: group1: 5 each, group2:10, group3:0). 
  - 20-40 min: Round2 (Straw Poll then Plurality).
       - 5 min: Explain rules: first straw poll (show of hands for current intention), record counts. Then they can change, then vote.
       - 5 min: Straw poll: ask for hands for A, B, C. Record.
       - 5 min: Allow them to reconsider (quietly). Then vote by ballot.
       - 5 min: Tally and announce. Assign points.
  - 40-60 min: Round3 (Thermometer).
       - 5 min: Explain: rate each option 0-10, sum the ratings, highest wins. Payoff: you get the true intensity (from your card) for the winner. 
       - 5 min: Vote (write three numbers).
       - 5 min: Tally: one volunteer sums A, one sums B, one sums C? Or you do it. Announce winner and the sums.
       - 5 min: Assign points (each person gets the intensity for the winner from their card).
  - 60-75 min: Debrief.
       - 5 min: Summarize the outcomes of the three rounds on the board.
       - 10 min: Discussion: 
            - Round1: What happened? (B won, some happy, some not)
            - Round2: Did anyone change their vote? Why? What happened? (Group3 switched to A, then A won. Group2 lost their first choice.) 
            - Round3: Did anyone rate differently than their true feeling? Why? What was the effect? (If someone exaggerated, did it help or hurt? If they were honest, what happened? Compare with if they had been honest: we calculated A would win, but if they exaggerated, B might have won and some groups got less.)
       - Then, connect to the big ideas: 
            - In Round2, when people had information, they voted strategically to avoid a bad outcome. But it hurt others. 
            - In Round3, the thermometer rule captures intensity, but if people don't vote honestly, it can lead to worse outcomes. 
            - The problem is that in any system, there might be an incentive to vote strategically. 
       - Finally, state that there is a theorem that says that no voting system (with at least three options) can be both strategy-proof and satisfy some other basic conditions. 
       - Your hypothesis: intensity matters, but even if we capture it, the rule can be gamed.

  **What the activity cannot reproduce:**
  - The generality: We only tried two rules and one preference profile. We cannot show that every rule is manipulable. 
  - Unrestricted preferences: In our game, preferences were set by us. In reality, preferences can be any ordering, and the theorem requires that. 
  - The difference between individual manipulation and group coordination: In our game, we saw individuals or small groups acting on partial information. In reality, coordinated blocs might be more effective, but also harder to form. 
  - The theorem also requires non-dictatorship and Pareto efficiency. We didn't test these.

  At the end, you might say: 
     "What we saw today is that in specific situations, voting rules can be manipulated. There's a mathematical theorem (Gibbard-Satterthwaite) that says that for any voting system with three or more options that isn't dictatorial and that allows any possible preference ordering, there will always be some situations where some voter can benefit by voting strategically. We saw examples of that today. But note: in our game, we only tried a few rules and one set of preferences. The theorem says it's always true, for any rule, in some circumstances."

  **Adjusting for the Group:**
  - For the hard of hearing: Make sure to speak clearly and write key points on the whiteboard.
  - The ex-engineers and the city councilman: They might be particularly interested in the strategic aspects. 
  - The group is small enough that we can manage.

  This design should achieve your goals. Let me know if you need adjustments.
answer: |-
  Below is a complete, runnable game design based on your specifications. It uses physical materials, avoids technical jargon, and structures the experience to let participants discover strategic voting dilemmas through a relatable scenario (choosing a group outing). The debrief explicitly connects gameplay to theory while acknowledging limitations.

  ---

  ### **Scenario & Setup**  
  **Premise**: The group is choosing an end-of-term outing. Options:  
  - **A**rt Museum (A)  
  - **B**otanical Garden (B)  
  - **C**oncert in the Park (C)  

  **Materials**:  
  - **Preference Cards** (1 per player): Hidden rankings + intensity ratings (0-10).  
  - **Voting Ballots**: Small slips of paper for plurality rounds; index cards for thermometer ratings.  
  - **Straw Poll Board**: Whiteboard to display poll results.  
  - **Payoff Tokens**: Colored chips (red=10pts, blue=5pts, yellow=0pts) or candy.  
  - **Collection Hat**: For ballots.  
  - **Timer**: For strict 75-minute flow.  

  **Preference Distribution** (9 players):  
  - **3 "Art Lovers"**: A>B>C (Intensity: A:10, B:4, C:0)  
  - **4 "Garden Enthusiasts"**: B>A>C (Intensity: A:5, B:10, C:0)  
  - **2 "Music Fans"**: C>A>B (Intensity: A:8, B:0, C:10)  
  *Rationale*: B is the plurality winner if all vote sincerely, but C voters prefer A over B, creating a spoiler effect.  

  **Payoff Rules**:  
  - **Rounds 1 & 2 (Plurality)**: Winner’s rank on your card → 10pts (1st), 5pts (2nd), 0pts (3rd).  
  - **Round 3 (Thermometer)**: Winner’s *intensity number* on your card = points earned.  
  - *Candy/chips awarded immediately after each round*.  

  ---

  ### **Game Timeline (75 Minutes Total)**  
  #### **0–5 min: Introduction**  
  - Explain the outing scenario: "We’re voting on A, B, or C. Each of you has a private *true preference card*—don’t show it! Payoffs depend on how the winner matches your card."  
  - Briefly outline rules: 3 voting rounds; payoff chips/candy based on outcomes.  
  - Distribute preference cards.  

  #### **5–20 min: Round 1 (Blind Plurality – "Control" Condition)**  
  - **Rules**: Vote for one option. No discussion. Secret ballot.  
  - **Process**:  
    - (5 min) Players write choice (A, B, or C) on ballot → drop in hat.  
    - (5 min) Tally votes on whiteboard. *Expected result*: B wins (4 votes: Garden Enthusiasts).  
    - (5 min) **Payoffs**:  
      - Art Lovers: 5pts each (B is 2nd).  
      - Garden Enthusiasts: 10pts each (B is 1st).  
      - Music Fans: 0pts (B is 3rd).  
  - **Key Learning**: Sincere voting in blind conditions → "safe" outcome but leaves some unhappy.  

  #### **20–40 min: Round 2 (Straw Poll Plurality – "Peek" Condition)**  
  - **Rules**: Public straw poll → revote → payoff.  
  - **Process**:  
    - (5 min) **Straw Poll**: "Raise hands for your *current* vote." Record counts on whiteboard (e.g., A:3, B:4, C:2).  
    - (5 min) **Reconsideration**: "You may change your vote based on the poll." *No talking allowed*.  
    - (5 min) **Revote**: New secret ballot.  
    - (5 min) Tally and announce winner. *Likely outcomes*:  
      - *Best case for strategists*: Music Fans switch to A (fearing B win). A wins (3 Art + 2 Music =5).  
        - Payoffs: Art Lovers 10pts, Music Fans 5pts, Garden Enthusiasts 5pts.  
      - *Backfire risk*: If only 1 Music Fan switches, B still wins → switcher gets 0pts instead of 5pts.  
  - **Key Learning**: Partial info tempts strategy (e.g., Music Fans compromising on A). But it can succeed (A wins) or fail (B still wins), hurting the strategist.  

  #### **40–60 min: Round 3 (Thermometer Rule – Test "Intensity" Hypothesis)**  
  - **Rules**: Rate each option 0–10 (0=hate, 10=love). Sum ratings → highest wins.  
  - **Process**:  
    - (5 min) Explain: "Mark your *true* feelings? Or boost your favorite? Your payoff uses your *card’s* intensity, not what you write."  
    - (5 min) Vote: Players write A:_, B:_, C:_ on index cards.  
    - (5 min) Sum ratings on whiteboard. *Expected outcomes*:  
      - *If all honest*: A wins (Art:3×10=30; Garden:4×5=20; Music:2×8=16 → Total A=66).  
      - *If strategic inflation*: Many rate 10/0/0 → B wins (Art:3×10=30; Garden:4×10=40; Music:2×0=0 → Total B=70).  
    - (5 min) **Payoffs** (using card’s intensity for winner):  
      - *If A wins*: Art:10, Garden:5, Music:8.  
      - *If B wins*: Art:4, Garden:10, Music:0.  
  - **Key Learning**:  
    - Honesty → better group utility (A wins, total payoff=114).  
    - Inflation risks: Art Lovers’ 10/0/0 votes help B win → they get only 4pts (worse than honest 10).  

  #### **60–75 min: Structured Debrief**  
  - **(5 min) Recap Outcomes**: Whiteboard table comparing winners/payoffs across rounds.  
  - **(7 min) Guided Discussion**:  
    - *Round 1 (Blind)*: "Did everyone get what they wanted? Why not?" → *Lesson*: Sincere voting can produce "least bad" but unsatisfying outcomes.  
    - *Round 2 (Straw Poll)*: "Who changed their vote? Why? Did it help or hurt?" → *Lesson*: Partial info creates incentives to manipulate; sometimes it backfires. Highlight that this isn’t "bad people" but rational choices.  
    - *Round 3 (Thermometer)*: "Did you rate honestly? What happened when people inflated?" → *Lesson*: Capturing intensity helps, but manipulation (e.g., 10/0/0) can distort outcomes and *lower* individual payoffs.  
  - **(3 min) Connect to Theory (No Jargon Yet)**:  
    - "What did we learn? Voting rules shape behavior. Even good rules can be ‘gamed,’ and gaming can hurt the gamer or others."  
    - "Your pet hypothesis: Intensity matters, but throwing it away isn’t the only problem—we also saw that *any* rule can be manipulated."  
  - **(5 min) Name the Concepts + Acknowledge Limits**:  
    - "This illustrates *strategic voting*: changing your vote to get a better outcome. There’s a famous result (Gibbard-Satterthwaite) proving *all* voting systems with 3+ options can be manipulated. **But our game only shows part of this:**  
      - ✅ We saw *one rule* (plurality) manipulated in *one scenario*.  
      - ✅ We saw your thermometer rule *can* be gamed.  
      - ❌ We *didn’t* prove *all rules* are vulnerable (we only tested two).  
      - ❌ We *didn’t* test if preferences are "unrestricted" (e.g., if everyone agreed A>B>C, manipulation might fail).  
      - ❌ We saw *individual* gaming, not coordinated blocs (though Music Fans semi-coordinated in Round 2).  
    - **The takeaway**: No system is perfect, but understanding trade-offs helps us design better rules."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Contrarian Voter**:  
     - *Risk*: Someone votes insincerely "for fun," skewing payoffs.  
     - *Fix*: Emphasize: "Your goal is to maximize *your* points. Your card is your ‘true self’—win points by matching outcomes to it." Award candy to top scorers to incentivize engagement.  

  2. **Confusion Over Scoring**:  
     - *Risk*: Misunderstanding thermometer payoffs (card vs. ballot).  
     - *Fix*: Use whiteboard examples: "If A wins, you get the number *on your card* for A, even if you rated it 0."  

  3. **Pessimism ("Democracy is Hopeless")**:  
     - *Risk*: Overgeneralizing from backfires.  
     - *Fix*: In debrief, note: "Manipulation is *possible* but not always *effective*. Many real elections have honest voting because information is limited."  

  4. **Out-Loud Coordination**:  
     - *Risk*: Players colluding openly (e.g., "Everyone vote A!").  
     - *Fix*: Gently enforce: "No talking during voting—this mimics private ballots. Real voters rarely get to conference-call!"  

  ---

  ### **What the Activity *Can’t* Reproduce**  
  As noted in the debrief, explicitly state:  
  > *"Today showed gaming is possible in specific cases, but not that it’s inevitable or universal. The theorem claims that for* **any** *non-dictatorial voting rule with 3+ options, there exist* **some** *preference profiles where manipulation benefits someone. We only tested one profile and two rules. Also, real-world preferences often align on spectrums (e.g., liberal-conservative), which can reduce manipulation opportunities—but the theorem assumes* **unrestricted preferences** *(any possible rankings). Finally, we saw individuals reacting to polls, but large-scale* **bloc coordination** *is harder to simulate here."*  

  This design ensures participants experience the tension between sincerity and strategy firsthand, tests your "intensity" hypothesis, and scaffolds the debrief to separate observed evidence from theoretical generalizations. The candy payoffs and relatable scenario keep it engaging while delivering the conceptual punch.
