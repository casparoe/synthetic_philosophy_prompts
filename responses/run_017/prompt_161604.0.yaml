answer: |-
  *Clears throat, adjusts his sleeve with a faint smile*  

  **WHAT I GRANT**  
  I grant that you rightly distinguish between *propositional supposition* and the having of a *sensible idea* in the mind.  

  **THE REPLY**  
  Your objection hinges on a false severance of conception from perception! When you "suppose" a starry void unseen, or an even number of stars, do you not still frame *some* notion—however abstract—to give meaning to that supposition? You speak of "regions unobserved," yet even this phrase conjures *space*, *distance*, perhaps *darkness*—ideas drawn from your sensory storehouse. To conceive is *always* to entertain ideas; there is no naked "that" without some garment of thought. Your propositional supposition is but a leaner idea, not a different genus! As for "notions"—yes, I allow them for spirits and relations, but precisely *because* spirits are *active*, perceiving things, not inert, senseless *matter*. A notion of matter? Absurd! Matter is defined by passivity, extension, resistance—qualities which exist only *as* perceived. To claim a "notion" of it would be to claim a thought of utter absence, like supposing "no supposition"! Your "simulation" is a phantom: if its states are "written down," they exist as marks (ideas!) or, if immaterial, as rules in a mind—but rules require a *spirit* to conceive and sustain them. An unwatched simulation grinding on? Either its states are ideas in God’s mind (as all things unperceived by you are), or it is pure contradiction—a procession of *nothings*, affecting *nothing*, signifying *nothing*. The master argument stands because existence *is* being perceived or being a perceiver. To imagine otherwise is to chase shadows with a lantern, only to find the light itself proves the shadow’s dependence!  

  **YOUR MOVE**  
  If you insist thought can grasp matter without ideas, describe this "notion" of inert, unperceiving substance—not by what it *does* (for it does nothing), nor by what it *is like* (for it has no qualities save as perceived), but by what it *is* in itself.
