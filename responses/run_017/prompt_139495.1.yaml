prompt: |-
  Someone from my department left this on the whiteboard after a works-in-progress session and I've been chewing on it for a week. Its supposed to show that expected-value fanaticism refutes itself.

  (1) Rank outcomes by total welfare, welfare is unbounded above, and the probabilities are objective and known.
  (2) Rational choice is maximising expected value.
  (3) Then for any finite cost c and any probability p > 0 there is a finite payoff G with pG > c, so the long shot beats the sure modest good.
  (4) Over a life you get offered a long series of independent long shots of that shape; (2) and (3) apply to each one severally, so rationality requires accepting all of them. Call it the sweep.
  (5) Each shot is overwhelmingly likely to miss, and there are very many of them, so the sweep leaves you, as near to certainly as you like, with nothing: you paid every time and the good never arrived. That is much worse than the sure goods you turned down at each step.
  (6) A rule for living is unacceptable if following it makes it as near to certain as you like that you end up far worse off than under an available alternative, where the residual chance of coming out ahead is too small to be distinguishable by any evidence you could have at the time of choosing.
  (7) So (2) is false, even granting (1).

  What bothers me most is that the same (5)–(6) machinery run in reverse seems to prove far too much. Over a long life you also face a great many tiny risks of catastrophe, and if near-certainty is what matters then ordinary life — driving, surgery, having kids, whatever — comes out forbidden, since some catastrophe or other becomes as near to certain as you like. So either the machinery is broken or it condemns everything, and I cant tell which.

  I also tried a reply that got waved off. If the shots on offer jointly exhaust the outcome space — if I can buy every member of the partition — then the sweep pays off with certainty and the ruin story never gets started. She said that's an artefact of a toy case and the argument only needs the everyday situation where the shots overlap and you cant cover everything. Maybe so, but it felt like it should tell us something.

  I'm teaching a decision theory seminar this term and don't want to bring this in until I know where it breaks. I'd rather keep (1) than (2), and (3) is just arithmetic. Which step do you reject, what does rejecting it cost, and is there a repaired version that still bites?
reasoning: |-
  Okay, let's dive into this decision theory puzzle. The user presents an argument claiming expected value maximization leads to self-destruction, and they're clearly wrestling with its implications. They're teaching a seminar and want to identify where the reasoning fails before presenting it to students.

  First, I need to unpack the core argument step by step. The key move happens between (4) and (5): accepting all positive-EV bets leads to near-certain ruin despite each being rational individually. The user's main concern is that rejecting this logic might also condemn ordinary risk-taking behaviors like driving or surgery, since catastrophic risks accumulate over time.

  Hmm, the user seems sophisticated - they've already considered partition-based counterarguments but found them insufficient. Their frustration comes through in phrases like "chewing on it for a week" and "got waved off". They're not just looking for surface-level rebuttals but want to preserve unbounded utility theory while avoiding paralyzing conclusions.

  The partition objection they mentioned is actually crucial. In standard probability spaces, you can't actually construct infinitely many mutually exclusive positive-EV bets without violating countable additivity or boundedness assumptions. Real-world risks don't neatly partition the outcome space either. 

  Ah! The deeper flaw is in how the argument handles "near certainty". The probability of total ruin converges to 1, but not uniformly - for any fixed n bets, ruin probability is high but not overwhelming, and the limit behavior doesn't translate to practical decision-making. This preserves ordinary risk-taking where catastrophe probabilities don't approach 1 as quickly.

  The user might appreciate connecting this to existing literature. Bounded utility functions (like Arrow-Pratt) solve it but at high cost, while Paul Samuelson's response to the St. Petersburg paradox shows why rational agents reject positive-EV sequences when independent bets scale unfavorably. 

  For their seminar, I should emphasize that rejecting step (6) doesn't eliminate all caution - it just requires more nuanced decision rules. The key insight is that expected utility theory remains consistent when properly constrained, and the "reverse argument" fails because real-world risks don't accumulate to near-certainty in comparable ways.
answer: |-
  This is a sophisticated argument against unbounded expected utility maximization, and your concerns about its implications are spot-on. Let's break down where the argument fails and how to reconcile it with rational risk-taking:

  **The Core Flaw: Rejecting Step (6)**

  The critical weakness lies in premise (6). It states:
  > *"A rule for living is unacceptable if following it makes it as near to certain as you like that you end up far worse off than under an available alternative, where the residual chance of coming out ahead is too small to be distinguishable by any evidence you could have at the time of choosing."*

  This is far too strong a criterion for rejecting a decision rule. It conflates *probability approaching 1* with *practical certainty* in a way that paralyzes decision-making. Here's why:

  1.  **The "Reverse" Problem You Identified:** Your intuition is correct. Apply (6) rigorously to everyday life:
      *   Over a lifetime, the cumulative probability of *some* catastrophic event (fatal car accident, fatal surgical complication, freak accident) *does* approach 1, given enough independent exposures.
      *   The "available alternative" for each risky activity (never driving, refusing all surgery, never having kids) avoids *that specific catastrophe's risk*.
      *   (6) would therefore condemn *all* activities involving non-zero catastrophic risk, no matter how small the individual risk or how large the benefit. This is absurd.
  2.  **Distinguishing Probabilistic Scales:** The argument relies on the *limit* as the number of bets `n` approaches infinity. While `P(Ruin) → 1`, for *any finite `n`*, `P(Ruin)` is *less than 1`. Crucially, `P(Coming Out Ahead)` remains *greater than 0` for any finite `n`.
      *   **The Sweep:** For the long shots, `P(Ruin)` becomes *overwhelmingly high* very quickly as `n` increases. The `P(Coming Out Ahead)` vanishes *extremely* rapidly (exponentially fast in `n` for fixed `p` and `G` chosen just large enough).
      *   **Ordinary Risks:** For tiny catastrophic risks `q` (e.g., `q = 10^{-6}` per car trip), `P(Some Catastrophe)` also approaches 1 as exposures `m` increase. However, it approaches 1 *much slower* than the long-shot ruin probability. More importantly, `P(Coming Out Ahead)` – the probability of surviving *and* benefiting from the activity (getting to work, being cured, having a family) – remains *very high* even for very large `m`. The vanishingly small residual `P(Coming Out Ahead)` in the sweep case is qualitatively different from the robustly high `P(Success)` in ordinary risk-taking, even though both residual probabilities are technically non-zero.

  **(6) ignores this crucial difference in the *magnitude* and *behavior* of the residual probability of a good outcome.** It treats any probability "too small to be distinguishable by evidence" as equivalent, whether it's `10^{-100}` (vanished) or `1 - 10^{-6}` (essentially certain success). This conflation is fatal to premise (6).

  **Why Your Partition Reply Was Insightful (Even If Dismissed)**

  Your intuition that "buying the whole partition" solves the problem points directly to the mathematical heart of the issue: **countable additivity** and the **structure of the probability space**.

  1.  **The Toy Case:** If the outcomes are mutually exclusive and exhaustive (a true partition) and you can buy all tickets, you *do* guarantee the payoff. The expected cost is the sum of the costs, the expected payoff is the sum of the probabilities times their payoffs `(Σ p_i * G_i)`, and since `p_i * G_i > c_i` for each ticket by (3), the overall EV is positive. Ruin is impossible. The argument relies on an *infinite* number of *independent* bets where you *cannot* cover all possibilities.
  2.  **The Real Issue - Non-Integrability:** The deeper problem revealed by arguments like this is that unbounded utility functions combined with infinite state spaces can lead to **non-measurable expectations** or situations where the order of summation matters. The "sweep" strategy forces you to consider an infinite series of investments whose *collective* expected value might not be well-defined or might not equal the sum of individual EVs (which is infinite) due to convergence issues. Standard expected utility theory assumes expectations are finite or integrable. The long-shot sequence violates this implicit assumption by demanding infinite expected expenditure for an infinite expected gain, creating a pathological scenario.

  **What to Reject and the Costs**

  *   **Reject (6):** This is the least costly and most necessary rejection. It doesn't invalidate caution; it simply recognizes that vanishingly small residual chances of success aren't always decisive, especially when balanced against robustly high probabilities of significant benefit in alternatives. We routinely accept rules where catastrophic failure is *possible* (`P > 0`) but *highly improbable* for practical purposes (`P << 1`).
      *   **Cost:** Requires acknowledging that "near certainty" (`P ≈ 1`) is context-dependent and not a strict logical threshold. Decision theory needs to incorporate concepts like *practical negligibility* or *tolerable risk*, which often involve informal judgment. This is messy but reflects reality.
  *   **Reject Unbounded Utility (1):** Many theorists (e.g., Arrow, Pratt) argue utility *must* be bounded to avoid such paradoxes. A bounded function (e.g., `U(W) = 1 - exp(-kW)`) ensures that no single outcome, no matter how good, can dominate the expectation calculation infinitely. The St. Petersburg paradox is resolved similarly.
      *   **Cost:** Seems ad hoc. Why *must* utility be bounded? It rules out plausible preference structures where individuals genuinely don't have an upper satiation point for wealth/welfare. It also complicates modeling growth over very long horizons.
  *   **Reject Strict EV Maximization (2) for Sequences:** Argue that rational choice for a *sequence* of decisions cannot be naively reduced to maximizing EV at *each individual step* when the sequence is known in advance and the stakes are potentially unbounded. This is related to "Dutch book" arguments for sequential consistency.
      *   **Cost:** Undermines the appealing simplicity of "just maximize expected utility at each choice point." Requires developing more complex rules for dynamic choice with foresight.

  **Repaired Versions & Lessons for Your Seminar**

  1.  **The Bounded Utility Solution:** This is the most common "repair" within standard decision theory. Present it as the mainstream response: "Expected utility theory remains coherent if we assume utility is bounded. Unbounded utility leads to infinite expectations and pathologies like this, suggesting boundedness is a rational constraint." Discuss the costs (plausibility?).
  2.  **The Practical Negligibility Response:** Focus on rejecting (6). Argue that rationality involves recognizing when probabilities become *practically negligible* or when risks become *tolerable* relative to benefits, even if they never hit exactly zero or one. Highlight the difference between the long-shot sweep (residual `P(Success)` vanishes *impossibly* fast) vs. driving (residual `P(Safe Life)` remains robustly high). Emphasize that decision theory needs tools beyond pure expectation for handling extreme tail risks and infinitesimal probabilities.
  3.  **The Structural/Integrability Response:** Dive into the math. Show that the expectation of the net gain from the *entire infinite sweep* is ill-defined (∞ - ∞). Argue that rational choice requires well-defined, finite expectations for the gambles under consideration. The individual bets have finite positive EV, but committing to the *entire sequence unconditionally* does not constitute a gamble with a well-defined finite expectation. Rationality might require rejecting *commitments* to such pathological sequences, even while accepting each bet individually if offered sequentially without pre-commitment (though the end result is still ruin with near certainty!). This connects to Samuelson's argument against accepting arbitrarily many independent St. Petersburg bets.

  **Conclusion for Your Seminar**

  The argument powerfully highlights the tension between **sequential rationality** and **long-run outcomes** under unbounded utility. Rejecting **premise (6)** is the most defensible and least disruptive path, as its flaw is exposed by its absurd consequences for ordinary risk-taking. It demands we acknowledge that rationality involves judgments about *practical* (not just logical) certainty and negligibility. The partition counterexample points towards the underlying mathematical pathology (non-integrability) caused by unbounded utility in infinite settings. Presenting **bounded utility** as the standard resolution, while discussing its costs and alternatives like rejecting (6), provides a balanced and insightful entry point into the limitations and foundations of expected utility theory. The argument "bites" by forcing a confrontation with the implications of unbounded value and the handling of infinities in decision models.
