prompt: |-
  I co-host a tiny podcast with my brother — we get one guest on for about an hour and just pick at a single idea untill it breaks. Next month's guest is someone I'll call Rowan, who defends what he calls "pessimism about borrowed verdicts": roughly, that when you take someone else's word for it that a thing is wrong — not because you can see the reasons yourself but because they said so — something is missing from your moral situation, even if the belief you end up with is true and you act on it. I've been turning this over on my own for months and I've got a pile of half-baked objections, but I've never studied this stuff, so I can't tell which of my objections are the ones people actually press and which are just me going in circles.

  Can you write me nine or ten interview questions, each two or three sentences, in plain spoken language — I'll be reading them out loud, so no acadamese — plus a follow-up for each, keyed to what you think Rowan will most likely answer. Here's what I want covered:

  - Rowan's favourite move, whenever I bring up the feeling that a borrowed verdict is hollow, is to say something like "that's a question about how the belief got there, not about whether it's a good belief." I want a run of two or three questions that makes that move harder and harder to lean on, ending with one where the distinction itself is what's up for grabs.
  - The asymmetry with ordinary expertise. If a mechanic tells me my brakes are shot and I act on that, nobody thinks I'm missing something; I'm being sensible. He'll say morality is different because what matters is acting for the reasons, or that the act has no special worth if you do it on someone's say-so. Press that — and then push on whether that makes the whole worry kind of selfish: the person I helped doesn't care whether I understood why helping was right, so who exactly is this defect a defect for?
  - A case I made up that I like: I've got two friends who agree with me that keeping promises matters and that not wrecking someone's life matters. In a particular mess I ask them which of those weighs more here, and they say the promise, definately. That feels like borrowing without borrowing the verdict. Is borrowing a weighting different from borrowing an answer, and why would his view treat them the same way — or differently?
  - Another one: when someone tells me "that thing you did hurt me", I just take their word for it, and that seems completely fine, not hollow at all — but they aren't an expert, they're the person affected. Maybe all moral deference is secretly like this, or maybe this case just shows the worry is really about expertise and not about testimony. I want the question to force him to say which.
  - Chains and crowds. What if I defer to someone who was themselves only passing on what they'd heard? And what if, instead of one trusted person, I go by what a bunch of people who disagree with each other roughly converge on — is that still borrowing, or is it more like reading a map?
  - A worry I can't shake: if everyone in a community defers to the same one or two voices, you get a moral monoculture — everybody's reasons are the same reasons, so nothing corrects the mistakes. That looks like a harm of deference that has nothing to do with whether any individual's borrowed belief is defective, and I want to know where it fits in his picture, if anywhere.
  - Looking backwards: I decide something is wrong on my own, clumsily, with my own reasons, and years later find out that someone whose judgment I now trust had come to the same conclusion. Does he have to say my original verdict was defective the whole time and just got lucky? That answer feels wrong to me but I can't say why.
  - Kids. Most of us learned most of our morals by being told. If borrowed verdicts are defective, are we all walking around with a broken moral picture that we later repair — and what would the repair even consist in?
  - Finish with one question about what would count as evidence against the view. Not "what would change your mind" in general — I hate that question — but something concrete he'd actually have to give up.

  He's quick and he'll have a stock answer for the obvious stuff, so please skip anything that just asks him to explain what the view is.
reasoning: |-
  Okay, the user is co-hosting a podcast with their brother and they're preparing for an interview with Rowan about "pessimism about borrowed verdicts" in ethics. They need sharp, non-academic questions that press Rowan on key points while avoiding obvious or recycled arguments. 

  Hmm, let's unpack what they're really after. They've clearly done deep thinking on this - their half-baked objections show genuine engagement. The request is unusually specific: they want questions targeting Rowan's favorite deflection about belief origins vs quality, plus asymmetry with expertise, weighting dilemmas, personal testimony cases, and systemic effects. They're also worried about sounding amateurish - hence the "no acadamese" rule.

  Interesting how they frame the "hollow" feeling as central. That's the emotional core Rowan's theory might overlook. The asymmetry push is smart too - if deferring to mechanics is fine but moral deference isn't, is this just philosophy being precious? And that monoculture point feels urgent in our polarized world.

  For the deflection sequence, we need questions that gradually collapse Rowan's distinction. Start with his comfort zone (Q1: "why care about origins?"), then force him to explain why origin affects worth (Q2), and finally attack the distinction itself (Q3: "what if the how changes the what?"). The follow-ups should anticipate his "reasons-responsiveness" dodge by demanding why that matters to the victim.

  The weighting case is subtle - borrowing a priority feels different from borrowing a rule. Q4 should highlight that intuitive difference, then Q5's follow-up traps him: either he admits weighting deference is fine (undercutting his view) or insists it's defective (which feels absurd when friends give advice).

  Personal testimony (Q6) is Rowan's trapdoor. If he says this is still problematic deference, he sounds inhuman. If he says it's different, he admits testimony isn't always hollow - so what makes moral "experts" special? The follow-up must make him choose.

  Chains/crowds (Q7) exposes whether his worry is about epistemic distance. And the monoculture point (Q8) shifts to systemic harm - if he only cares about individual defects, he might dismiss this, but that seems myopic.

  The retrospective case (Q9) is clever: if past-you coincidentally agreed with an authority, was your correct verdict still "lucky"? That exposes the theory's counterintuitive edge. Kids (Q10) is the nuclear option - if all early morality is defective, what does "repair" even look like? 

  Final evidence question (Q11) avoids cheap "what ifs" by demanding observable consequences - if borrowed verdicts are truly defective, we should see behavioral differences. That's falsifiable.

  Throughout, keeping language podcast-friendly: contractions, fragments, "let's say" framing. No "one might object" academic hedging. The follow-ups should name his likely moves ("I imagine you'll say...") to force engagement beyond stock answers.

  This guest sounds sharp - the questions need to be landmines disguised as stepping stones. User's prepped well; now they need ammunition to make Rowan sweat a little.
answer: |-
  Here are nine interview questions with follow-ups designed to press Rowan on key points, avoid obvious setups, and target your specific concerns—all in plain language:

  1.  **Question:** Rowan, you often say the "hollowness" feeling is about *how* I got the belief, not whether the belief itself is true or good. But if I feel like something crucial is missing *in the moral situation itself* when I act just on your word, why wouldn't that be a defect in the belief or my action?
      *   **Follow-Up (Anticipating "Belief vs. Origin"):** I imagine you'll say the belief's truth is separate from its origin. But if the origin makes my *acting on it* feel less engaged or less *mine* morally, doesn't that suggest the origin actually *does* affect the moral worth or completeness of the action?

  2.  **Question:** When my mechanic says my brakes are shot, I act immediately. That seems sensible, not defective. But you say moral deference is different because acting for the *reasons* matters. Why is getting the *right outcome* for the right mechanical reasons unimportant, but suddenly crucial for morals?
      *   **Follow-Up (Pushing the Selfishness Angle):** Let's say I help someone solely because you told me it was right. The person I helped got helped – they're happy! If *they* don't care *why* I did it, who exactly is harmed or missing out? Isn't worrying about *my* internal reasons a bit... self-absorbed?

  3.  **Question:** Let's push that distinction further. If the "hollowness" *only* reflects the belief's origin and *never* touches the belief's moral quality or the action's worth, why does it feel like a *moral* lack? Why does it feel different from just learning I memorized a physics fact wrong?
      *   **Follow-Up (Targeting the Distinction Itself):** Could it be that *how* we arrive at a moral verdict – blindly trusting vs. understanding – actually changes *what kind of thing* the verdict is for us? That the origin isn't just history, but shapes the moral nature of the belief itself?

  4.  **Question:** I've got two friends who agree keeping promises matters and not ruining lives matters. In a messy situation, I ask which matters *more* here, and they both say "the promise." I trust their weighting and act on it. Is this "borrowing a weighting" defective like borrowing a verdict, or is it different?
      *   **Follow-Up (Forcing a Choice):** If you say it *is* defective, doesn't that make trusting friends' judgment on hard calls seem inherently flawed? If you say it's *not* defective, how is deferring on this balancing act different from deferring on whether something is wrong outright?

  5.  **Question:** When someone tells me "What you did hurt me," I just take their word for it. That seems right, not hollow. They're not a moral expert; they're the affected person. Does your pessimism apply here? Or does this show the worry is really about trusting *experts*, not testimony itself?
      *   **Follow-Up (Forcing a Distinction):** So, is the problem *specifically* deference to a third-party *authority*? Or is testimony from the affected person fundamentally different kind of moral information? What makes their "verdict" borrowable without defect?

  6.  **Question:** What if I defer to someone who was just passing on what *they* heard? Or, instead of trusting one person, I look at what a bunch of disagreeing people roughly converge on? Is that chain or crowd-sourcing still "borrowing a verdict," or is it more like gathering evidence?
      *   **Follow-Up (Pushing Epistemic Distance):** Does the potential for distortion in a chain, or the lack of a single authoritative source in a crowd, make it *less* like problematic deference, or does it just make the borrowed verdict *more likely* to be wrong, which is a different problem?

  7.  **Question:** If everyone defers to the same few voices, we get a moral monoculture. Everyone uses the same reasons, so mistakes spread and nothing corrects them. That seems like a real harm, but it's about the *system*, not whether any individual's borrowed belief feels hollow. Where does this fit in your view?
      *   **Follow-Up (Systemic vs. Individual):** Is this monoculture harm just a *consequence* of many individuals having potentially defective borrowed verdicts? Or is it a *separate* problem that your focus on the individual's "hollowness" might miss?

  8.  **Question:** Years ago, I decided something was wrong through my own clumsy reasoning. Later, I learn someone I deeply respect now reached the same conclusion independently back then. Does your view force you to say my original verdict was still defective or "lucky" because I *could have* deferred to them, even though I didn't?
      *   **Follow-Up (The "Lucky" Verdict):** That seems counterintuitive. If I got it right myself, why should the mere *existence* of someone I *later* respect undermine the status of my original, independent judgment?

  9.  **Question:** Most of our early morals come from being told – "Don't hit!" "Share!" If borrowed verdicts are defective, are we all walking around with a broken foundation? What does "repairing" it even mean? Getting the same verdicts again, but for our own reasons?
      *   **Follow-Up (The Nature of Repair):** If "repair" just means eventually understanding the *reasons* behind the rules we were taught... does that mean the initial borrowed verdicts *were* defective, and only became "proper" beliefs when we did the reasoning ourselves? Or were they okay for kids?

  10. **Question:** Forget changing your whole mind. What's one *concrete, observable thing* that, if we found it, would be strong evidence against your pessimism? Like, if people acting solely on borrowed moral verdicts consistently showed *more* moral courage or deeper commitment than those who reasoned independently?
      *   **Follow-Up (Consequence Focus):** So, evidence against your view would involve showing that the *origin* of the belief *doesn't* negatively impact the quality of the moral agent or the action in a tangible way, even if it feels different internally?

  **Key Design Choices:**

  *   **Plain Language:** Uses contractions ("it's," "doesn't"), simple phrasing ("pick at," "messy situation," "walking around"), and avoids jargon ("epistemic," "normative," "de dicto/de re").
  *   **Targeting Stock Moves:** Questions 1-3 directly confront the "origin vs. belief quality" deflection, escalating to challenge the distinction itself. Questions 2 & 4-6 target the asymmetry and expertise angles hard.
  *   **Your Cases Incorporated:** Q4 uses your "weighting" case, Q5 uses your "hurt me" case, Q6 uses chains/crowds, Q7 uses monoculture, Q8 uses the retrospective case, Q9 uses kids.
  *   **Pressing Selfishness & Systemic Harms:** Q2 Follow-Up explicitly raises selfishness. Q7 tackles the systemic monoculture harm.
  *   **Concrete Evidence:** Q10 asks for a *specific, observable* consequence that would count as evidence against the view, avoiding vague "change your mind" territory.
  *   **Avoiding Explanation:** Assumes listeners (and you) grasp the core "borrowed verdicts are defective" idea, focusing solely on challenges and implications.

  These questions should force Rowan beyond his standard defenses and into the nuances and potential weaknesses of his position, while keeping the conversation grounded and accessible for your podcast audience. Good luck!
