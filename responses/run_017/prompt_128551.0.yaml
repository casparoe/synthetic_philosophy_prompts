prompt: |-
  Our neighbourhood mutual aid fund is tiny — about forty members, we pool roughly $40k a year and vote on requests at a monthly meeting — and we basically think of ourselves as living in Singer's shallow pond but with an inbox. We've built up a track record of votes, and I want to know what it commits us to on the case we're voting on Thursday. The precedents as best I can reconstruct them: we funded a member's $600 emergency surgery even though she'd ignored the advice that would have prevented the problem, on the reasoning that fault isn't the issue; we funded the same amount for a stranger referred by a partner organization on another continent, on the grounds that distance isn't a moral difference; we turned down a member whose brother would have paid if we said no, because our money would just have replaced his; we refused a $22,000 life-saving request and offered $1,500 instead, because paying it would have cleaned us out for the rest of the year; when two applicants had the same condition and the same price and one had already been funded twice, we funded the other one, saying she'd had her turn; and once we funded a $600 piece of equipment for a local clinic specifically because it would be used on many patients, not just the one who asked for it. That last one is the one nagging at me.

  Thursday's case: a member's seven-year-old needs a $600 surgery next month, will die without it, no one else is going to step in (we checked, the way we checked in the brother case), and nobody is at fault. But one of our members who works in hospital billing has convinced half the group that our paying for it has a knock-on: the surgery would happen at the county hospital, and privately funded cases at that hospital reliably push up what it charges uninsured families for the same procedure the following year — enough that over the next three years two or three more families in the same position get priced out of it. Assume for the sake of argument that this is right. I don't want to argue about the empirical claim, though I'm aware we'd never really be able to audit it. So: what should we do if we want to be consistent with ourselves, and what rule would we be adopting either way?

  As I see it, our past votes fit both a rule where we answer the claim in front of us once we've checked that the need is real, the cost is within our cap, and no one else is going to meet it — with fairness and rotation as tie-breakers, and fault and distance explicitly irrelevant — and a rule where we do the most good with the money, counting everyone affected including people who aren't applicants. Those two come apart here in a way they haven't before, because it's the first time the knock-on effects have pointed *away* from the person doing the asking. What I'd like: a straight verdict with your confidence in it; the competing rules spelled out clearly enough that I can read them to the group, including what each one says about those two or three families; which precedent is the closest analogue and why the clinic-equipment decision doesn't just settle it on its own; whether "fund the child but route the money so it never passes through the county hospital" is a genuine third option or a way of dodging the question; and the one further case that would actually tell the two rules apart, since I suspect this vote won't. Please write in American English. And if you think the framing itself is confused — if the precedents don't really underdetermine this, if a fund our size shouldn't be reasoning this way at all, or if the knock-on effect can't do the work I've handed it — say so plainly instead of playing along; I'd rather be told than agreed with.
reasoning: |-
  Okay, let me tackle this user's problem step by step. They run a small mutual aid fund with about 40 members pooling $40k annually. They vote on requests monthly and want to stay consistent with their past decisions. The current case involves a child's $600 life-saving surgery, but paying might increase future costs, potentially pricing out other families. The user needs help reconciling this with their precedents.

  First, I need to parse their past cases. They funded surgery despite the patient ignoring advice (fault irrelevant), helped a distant stranger (distance irrelevant), denied a member whose brother would pay (no displacement), capped a large request to avoid draining funds, chose a first-time applicant over someone funded twice (fair rotation), and funded clinic equipment for multiple uses. These precedents suggest two principles: responding to immediate needs and maximizing impact.

  The clinic equipment case stands out because it prioritized broader impact over individual need. That’s key here. If the knock-on effect is accepted, funding the child might harm more families later. The user mentioned a member’s claim about hospital billing practices. Even if unverifiable, the group must decide assuming it's true.

  The user’s dilemma is between two rules: Rule 1 (Direct Need) focuses on the applicant once criteria are met. Rule 2 (Maximize Good) considers all affected, including future families. The clinic precedent leans toward Rule 2, but it’s not identical—there, the money helped many directly, whereas here, not funding might prevent indirect harm.

  A third option: routing money around the hospital. But if the issue is the hospital's pricing response to private payments, bypassing might not help. The hospital might still notice the funded case and adjust prices. So it's likely not a real solution.

  For a future case to distinguish the rules, imagine two identical needs where funding one displaces more aid than the other. That would force a choice between helping now or maximizing overall impact.

  The user’s framing isn’t confused. Their precedents support both rules, making this case a true conflict. A fund their size can reason this way, but should acknowledge uncertainty in knock-on effects. My recommendation: don't fund, based on Rule 2 and the clinic precedent. The potential harm to multiple families outweighs the immediate need, aligning with their past choice to maximize good. However, I’m only 60% confident due to the unverifiable knock-on claim. They should stress that if the effect is disproven later, they’d fund similar cases.
answer: |-
  Here’s a straight verdict with clear reasoning, based solely on your precedents and stated values:

  **Verdict: Do NOT fund the surgery.**  
  Confidence: 60% (due to the unverifiable nature of the knock-on claim, but your precedents point here).

  ### The Two Competing Rules
  1. **Rule 1: Respond to Immediate Need**  
     *What it says:* Fund any verified, life-threatening need within our budget cap if no one else will help, regardless of fault, distance, or past aid. Tie-breakers: Fairness (rotation) and no displacement.  
     *About future families:* Ignores them. Only the applicant’s need matters.  
     *Fits precedents:* The funded surgery (fault irrelevant), stranger (distance irrelevant), and capped $22k request (no displacement).

  2. **Rule 2: Maximize Net Good**  
     *What it says:* Fund only when our $600 does more good than any alternative use—including preventing future harm. Count all affected people, not just applicants.  
     *About future families:* Explicitly weighs their unmet needs against the current applicant. If funding now causes more suffering later, we shouldn’t do it.  
     *Fits precedents:* Rejecting the brother case (displacement), funding clinic equipment (scale impact), and capping the $22k request (preserving future aid capacity).

  ### Why the Rules Diverge Here
  - Under **Rule 1**, you fund: The child’s need is urgent, verified, unfunded, and no-fault.  
  - Under **Rule 2**, you don’t fund: The knock-on effect means your $600 could indirectly cause 2-3 future deaths. Spending here does *less* net good than holding funds for a case without harmful side effects.

  ### The Clinic Equipment Precedent: Why It Doesn’t Settle This
  - The clinic case was a **positive** knock-on: Funding helped many people, aligning *both* rules (immediate need met + greater good served).  
  - This case is a **negative** knock-on: Funding helps one but *harms* others. Rule 2 explicitly blocks this; Rule 1 overlooks it.  
  - **Analogue:** The brother case is closer. Both involve displacement—but here it’s systemic (future families) vs. direct (the brother).

  ### The "Route Around the Hospital" Option: A Dodge
  - If the hospital’s pricing responds to *any* private payment for this procedure (regardless of routing), rerouting funds changes nothing. The harm arises from the procedure being paid privately, not payment mechanics.  
  - If you could truly hide the funding source, it *might* work—but hospital billing systems track this. Assume the empirical claim holds: routing won’t fix it.

  ### The Case That Would Force a Choice Between Rules
  Imagine:  
  *Two identical $600 life-saving requests. Funding Applicant A displaces $1,800 in future aid (costing 3 lives elsewhere). Funding Applicant B has no knock-on effects.*  
  - **Rule 1** funds both (if verified/unmet), ignoring displacement.  
  - **Rule 2** funds only B, maximizing net lives saved.  
  *(Your current case is like Applicant A.)*

  ### Is Your Framing Confused?
  No—your precedents genuinely support both rules, making this a principled conflict. A fund your size *should* reason this way: your votes show sophisticated ethical consistency. The knock-on effect *is* relevant if accepted as true (per your request). But **acknowledge the uncertainty**: You can’t prove the hospital’s pricing model, so Rule 2 requires a leap of faith.

  ### Recommendation for Thursday
  - **Don’t fund**, citing Rule 2 (Maximize Net Good) and the clinic precedent’s emphasis on broad impact. Argue: *"We funded the clinic equipment because it helped many. Here, funding one child may hurt many. We can’t ignore that trade-off."*  
  - **Offer alternatives**: Could you fund the surgery at a different hospital? Pool resources with other aid groups to negotiate a fixed price with the county? If not, hold funds for a case without harmful externalities.  
  - **Stress**: This vote sets a precedent to *avoid causing foreseeable harm*, even indirectly. If the knock-on claim is later disproven, revisit the policy.

  **Bottom line**: Your history prioritizes outcomes over rigid rules. Funding here risks net harm—a line your precedents suggest you won’t cross.
