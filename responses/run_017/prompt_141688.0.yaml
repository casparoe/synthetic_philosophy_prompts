  ### **Key Annotations**  
  1. **Split Purposes (🔁 Nodes):**  
     - The **"Does the purpose matter?"** node and **"For this purpose, is ranking acceptable?"** node must be repeated for guilt, commemoration, and prevention. This allows characters to hold different positions (e.g., rank for prevention but not commemoration).  

  2. **Unoccupied Leaves & Why:**  
     - **Branch 1.1 + Branch 1.2 (Unyielding Incommensurabilist + Question Rejector):** Unoccupied for *prevention*.  
       - *Why:* Incoherent. If preventing future atrocities is urgent, refusing to engage with the question undermines the goal.  
     - **Branch 2.2.1.1 + Branch 2.2.1.2 (Strict Quantitativist + Method Absolutist):** Unoccupied for *commemoration*.  
       - *Why:* Unfashionable. Commemoration focuses on individual stories, so purely quantitative or method-centric views are seen as dehumanizing.  
     - **Branch 2.2.2.1 (Contextual Moralist):** Unoccupied for *prevention*.  
       - *Why:* Unfashionable. Prevention requires prioritization; rejecting ranking entirely is seen as morally negligent.  

  3. **Indistinguishable Leaf Pairs (Avoid in Scenes):**  
     - **Unyielding Incommensurabilist (1.1) vs. Contextual Moralist (2.2.2.1)** for commemoration: Both refuse to rank, but for different reasons (intrinsic impossibility vs. purpose-related obscenity). *Make distinguishable by:* Have one attack the act of ranking ("Ranking defiles memory!"), while the other attacks the purpose ("Using commemoration to compare is sacrilege!").  
     - **Epistemic Nihilist (2.1) vs. Pragmatic Quantitativist (2.2.2.2.1)** for guilt: Both discuss evidence, but one rejects ranking entirely ("We can't know!"), while the other ranks with caveats ("Only numbers are reliable!"). *Make distinguishable by:* Have one demand more evidence, the other dismiss non-quantifiable factors.  

  4. **Manner of Killing Axis:**  
     - Fits cleanly under nodes where ranking is accepted (Branches 2.2.1 and 2.2.2.2). It is treated as independent of death toll (per your constraint).  

  ---

  ### **Why This Works for Your Novel**  
  - **Characters argue badly:** Positions are mutually exclusive and rooted in first principles (e.g., evidence vs. morality vs. purpose). Dialogue snippets ensure clashes feel organic.  
  - **Split purposes handled:** By repeating 🔄 nodes, a character can be a Pragmatic Qualitativist for prevention ("Stop bureaucratic killing first—it's insidious!") but a Contextual Moralist for commemoration ("Don't rank their suffering—honor each story!").  
  - **Manner of killing integrated:** Explicitly included as a decisive factor where ranking occurs, with positions defending/rejecting its relevance.  
  - **Distinct voices:** Unoccupied leaves and flagged indistinguishable pairs ensure characters don't blur together. For example:  
    - A Strict Quantitativist might snap, "Stop fixating on 'how'—10,000 starved is worse than 1,000 shot!"  
    - A Method Absolutist might retort, "Killing face-to-face breaks society's fabric—that matters beyond numbers!"  

  This taxonomy lets characters collide along ideological fault lines while reflecting real-world debates. Use the repeated nodes to show how a single character's stance fractures across purposes, fueling tension in your truth commission scenes.
