      - *Yes: "Why we compare alters everything—guilt, memory, and prevention aren't the same."*  

      **Branch 2.2.1: No →**  
      - *Next Node: Is manner of killing (e.g., face-to-face vs. bureaucratic) rank-relevant beyond death toll?*  
        *Dialogue to settle:*  
        - *No: "A death is a death; how it happens doesn't independently change the scale."*  
        - *Yes: "Method matters—up-close killing adds a distinct layer of horror."*  

        **Branch 2.2.1.1: No →**  
        - **Leaf: Strict Quantitativist**  
          *Refuses to say aloud:* "Bureaucratic killing is inherently 'worse' than hands-on violence." (Rejects method as a factor.)  

        **Branch 2.2.1.2: Yes →**  
        - **Leaf: Method Absolutist**  
          *Refuses to say aloud:* "Only the number of deaths matters." (Rejects pure body-count comparisons.)  

      **Branch 2.2.2: Yes (purpose matters) →**  
      - 🔄 **Node: For this purpose [guilt/commemoration/prevention], is ranking acceptable?**  
        *Dialogue to settle:*  
        - *No: "For [purpose], ranking cheapens suffering—it's a tool of the perpetrators."*  
        - *Yes: "For [purpose], we must rank—inaction is complicity."*  

        **Branch 2.2.2.1: No →**  
        - **Leaf: Contextual Moralist**  
          *Refuses to say aloud:* "For [purpose], Atrocity X was objectively worse." (Rejects ranking for this specific context.)  

        **Branch 2.2.2.2: Yes →**  
        - *Next Node: Is manner of killing rank-relevant beyond death toll?*  
          *Dialogue to settle:*  
          - *No: "For [purpose], only scale determines severity—method is peripheral."*  
          - *Yes: "For [purpose], method is crucial—it reveals intent or suffering's nature."*  

          **Branch 2.2.2.2.1: No →**  
          - **Leaf: Pragmatic Quantitativist**  
