answer: |-
  Below is a diagnostic decision tree designed to sort students based on concrete case judgments, capturing the specified distinctions without relying on abstract labels. It comprises eight branch questions (all mandatory cases included) and seven leaf positions. Students can answer each binary question cold in 15 minutes. British English is used throughout.

  ### Decision Tree Questions
  1. **Kidney Sale (Seller)**: "Is it morally acceptable for a poor but unpressured person to sell one of their kidneys to a stranger for money?"  
     - *Tests: seller-side repugnance, objection to money/transfer.*

  2. **Kidney Sale (Buyer)**: "Is it morally acceptable for a person to buy a kidney from a poor but unpressured seller?"  
     - *Tests: buyer-side repugnance, asymmetry in direction.*

  3. **Disaster Pricing**: "After a natural disaster, an automated system raises the price of bottled water tenfold, ensuring it reaches those who need it most. No human intends exploitation. Is this acceptable?"  
     - *Tests: objection to money form vs. spillover, motive.*

  4. **Vote Selling**: "Is it morally acceptable for an individual to sell their vote to the highest bidder, with a verifiable receipt?"  
     - *Tests: kind of good, consent under non-desperation.*

  5. **Transplant Priority Scheme**: "A scheme allows kidney donors to gain priority on the transplant list if needed later. No money changes hands. Is this acceptable?"  
     - *Tests: objection to money vs. non-cash incentives, channelling.*

  6. **Kidney Desperation Sale**: "Is it morally acceptable for a person to sell a kidney to pay for their child's life-saving medical treatment?"  
     - *Tests: consent under desperation curing objections.*

  7. **Pollution Payment**: "A factory pays residents for consent to pollute local air. The payment is generous and residents agree. Is this acceptable?"  
     - *Tests: spillover harm to non-participants.*

  8. **Vote Seller Punishment**: "If a vote sale occurs, should the seller face legal punishment (e.g., fine or jail)?"  
     - *Tests: objection binding individual agent vs. law.*

  ### Answer Combinations and Leaf Positions
  - **Total combinations**: \(2^8 = 256\) possible answer patterns.
  - **Leaves defined**: Seven positions, covering common stances. Unmapped combinations (if any) default to **Leaf 7: Contextualist (Mixed)**.
  - **Indistinguishable leaves**: None—all leaves are separable by at least one question. Leaf 3a and 3b differ only on Q8 (punishment for vote selling).
  - **Unoccupied combinations**: 
    - **Seller/Buyer Asymmetry (Q1=Y, Q2=N)**: 32 combinations. Rare and unexplored; students rarely approve selling but condemn buying without additional objections (e.g., to money form or desperation).  
    - **Consent-Inconsistent (Q1=Y, Q6=N, Q4=N)**: 8 combinations. Incoherent if objecting to vote/kidney sales only under desperation without broader principle.  
    - **Punishment Without Objection (Q4=Y, Q8=Y)**: 16 combinations. Unattractive; punishing permissible acts is inconsistent.

  ### Leaf Positions
  1. **Commodification Corrosive (Money-Objector)**  
     - *Profile*: Objects to money in exchanges for "sacred" goods (Q1=N, Q2=N, Q5=Y), rejects desperation consent (Q6=N), prohibits markets (Q4=N, Q7=N), and binds law (Q8=Y). Disaster pricing rejected (Q3=N).  
     - *Response*: Prohibition.  
     - *Distinctions*: (i) Money form, (ii) Both sides, (iii) Consent doesn’t cure, (iv) Prohibition, (v) Binds law.

  2. **Market Enthusiast**  
     - *Profile*: Accepts all transactions (Q1–7=Y) and rejects punishment (Q8=N).  
     - *Response*: Permission with minimal restrictions.  
     - *Distinctions*: (i) No objection, (ii) Neither side, (iii) Consent cures, (iv) Permission, (v) Binds neither.

  3a. **Vote Protector (Punitive)**  
     - *Profile*: Accepts all except vote selling (Q4=N), punishes sellers (Q8=Y). Approves kidney sales (Q1=Y, Q2=Y, Q6=Y), non-cash schemes (Q5=Y), and disaster pricing (Q3=Y).  
     - *Response*: Prohibition + punishment for votes; permission elsewhere.  
     - *Distinctions*: (i) Kind of good (votes), (ii) Both sides for votes, (iii) Consent cures (for kidneys), (iv) Prohibition (votes), (v) Binds law.

  3b. **Vote Protector (Non-Punitive)**  
     - *Profile*: Identical to 3a but rejects punishment (Q8=N).  
     - *Response*: Prohibition without punishment for votes; permission elsewhere.  
     - *Distinctions*: As 3a, except (v) Binds transaction (not individual).

  4. **Altruism Advocate**  
     - *Profile*: Rejects all monetary exchanges (Q1=N, Q2=N, Q3=N, Q4=N, Q6=N, Q7=N) and non-cash incentives (Q5=N). Punishes vote sellers (Q8=Y).  
     - *Response*: Channelling into non-price systems (e.g., altruistic registries).  
     - *Distinctions*: (i) Bare transfer/motive, (ii) Both sides, (iii) Consent doesn’t cure, (iv) Channelling, (v) Binds law.

  5. **Desperation Matters (Efficiency-Focused)**  
     - *Profile*: Accepts unpressured kidney sales (Q1=Y, Q2=Y) but rejects desperation sales (Q6=N). Approves non-cash schemes (Q5=Y), disaster pricing (Q3=Y), votes (Q4=Y), and pollution payments (Q7=Y). Rejects punishment (Q8=N).  
     - *Response*: Permission with restrictions against exploitation.  
     - *Distinctions*: (i) Motive/desperation, (ii) Seller-side for desperation, (iii) Consent doesn’t cure under desperation, (iv) Restrictions, (v) Binds transaction.

  6. **Spillover Concerned**  
     - *Profile*: Accepts kidney sales (Q1=Y, Q2=Y, Q6=Y) and votes (Q4=Y) but rejects pollution payments (Q7=N) and disaster pricing if spillover suspected (Q3=N). Ambivalent on punishment (Q8=Y/N—mapped to leaf if Q3=N/Q7=N).  
     - *Response*: Prohibition/channelling for spillover cases; permission otherwise.  
     - *Distinctions*: (i) Spillover, (ii) Neither side for kidneys, (iii) Consent cures, (iv) Channelling/prohibition, (v) Binds law for spillover.

  7. **Contextualist (Mixed)**  
     - *Profile*: All combinations not fitting Leaves 1–6.  
     - *Response*: Varied (e.g., prohibition for some goods, channelling for others).  
     - *Distinctions*: Captures nuanced/unexplored views.

  ### Example Traces
  **Trace 1: Commodification Corrosive (Leaf 1)**  
  - Q1 (Kidney Seller): N → Object to selling.  
  - Q2 (Kidney Buyer): N → Object to buying.  
  - Q3 (Disaster Pricing): N → Object to money form/spillover.  
  - Q4 (Vote Selling): N → Object to kind of good.  
  - Q5 (Priority Scheme): Y → Accept non-cash incentive.  
  - Q6 (Kidney Desperation): N → Consent doesn’t cure.  
  - Q7 (Pollution Payment): N → Object to spillover.  
  - Q8 (Vote Punishment): Y → Bind law to individual.  
  - *Result*: Leaf 1.

  **Trace 2: Desperation Matters (Leaf 5)**  
  - Q1 (Kidney Seller): Y → Accept unpressured sale.  
  - Q2 (Kidney Buyer): Y → Accept buying.  
  - Q3 (Disaster Pricing): Y → Accept efficiency.  
  - Q4 (Vote Selling): Y → Accept vote sale.  
  - Q5 (Priority Scheme): Y → Accept non-cash incentive.  
  - Q6 (Kidney Desperation): N → Reject desperation sale.  
  - Q7 (Pollution Payment): Y → Accept spillover consent.  
  - Q8 (Vote Punishment): N → Reject binding individual.  
  - *Result*: Leaf 5.

  ### Key Features
  - **Kidney cases appear twice**: Q1 (seller) and Q2 (buyer) test asymmetry.  
  - **Consent under desperation**: Q6 contrasts with Q1.  
  - **Money vs. non-cash**: Q5 vs. Q1/Q2.  
  - **Spillover**: Q7 directly tests non-participant harm.  
  - **Individual vs. law**: Q8 isolates punishment.  
  - **Efficiency/motive**: Q3 (automated pricing) and Q6 (desperation) test these factors.  

  This tree cleanly separates positions using concrete cases, avoids abstract labels, and fits within a 15-minute completion time. Use the answer patterns to assign students to leaves during your seminar diagnostic.
