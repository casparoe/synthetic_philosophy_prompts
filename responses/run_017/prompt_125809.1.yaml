prompt: |-
  i run a monthly data-literacy hour for the analysts on our growth team — about fifteen people, very fluent in SQL, nervous around anything causal. last month we had a small incident: a new onboarding flow lost on the topline conversion number but won inside both the mobile and the desktop cuts. two of them walked away with opposite morals. one says this proves topline numbers are junk and you should always read the segments. the other says it's just a weighting artefact, nothing to see, report the topline and move on. i've got 50 minutes and a whiteboard and i want to actually fix the confusion, not just show them a cute trick and have them be more confused.

  so please don't explain Simpson's paradox to me — plan how i should teach it, to this exact room:

  - the order the ideas have to arrive in, and what depends on what. my instinct is that the "a rate is just a weighted average" bit has to land before any reversal is shown, but tell me if there's something that has to come even before that.
  - the one example that carries the whole session, with actual small numbers. it should be about their world (experiments, funnels, platforms, traffic mix), small enough to hold in your head, and it should make the flip feel inevitable rather than like a card trick. also: tell me what the example must *not* have — i'm wary of an example where the right answer is obviously "the subgroups, obviously," because that teaches them the wrong lesson in the other direction. and say why i should skip the two cases everyone reaches for (the kidney-stone one, the Berkeley admissions one).
  - the misconceptions, in the order this room will actually produce them, and where in the sequence i should head each off. the ones i'm betting on: "the topline is wrong / someone messed up the math"; "more data would fix it"; "the subgroups are always the true answer"; "we randomize our A/B tests so this can't happen to us" (i suspect that last one is only half true and i don't trust my own explanation of why); and "ok, then just segment harder" — which i also have a feeling isn't automatically right, but again i can't say why.
  - one question i can ask in the last five minutes that would tell me they got it rather than just learned to be suspicious of averages.
  - what i should openly refuse to get into at this level.

  commit to things: pick one example, tell me what to cut, and give me a straight verdict on both of my colleagues' morals — which one survives and why, even if the answer is that they're both wrong. where your plan rests on a contested call, say so and tell me what you'd do anyway.
reasoning: |-
  We are teaching a group of 15 data analysts fluent in SQL but nervous about causal concepts. The goal is to resolve confusion around Simpson's Paradox observed in their recent experiment, where a new onboarding flow lost on topline conversion but won in both mobile and desktop segments.

  **Core Insight:** The paradox arises when a trend appears in different groups but disappears or reverses when the groups are combined. This is due to the topline conversion rate being a *weighted average* of the group rates, and the weights (group sizes) can distort the comparison.

  **Key Dependencies in Teaching Order:**
  1. **Rates as Weighted Averages:** Before any paradox, establish that an overall rate is a weighted average of subgroup rates, with weights being the proportion of units in each group.
  2. **Weighting Matters:** Show that changing the weights can change the overall average even if subgroup rates stay the same.
  3. **The Paradox:** Present an example where the weighted average reverses the direction of effect due to unequal group sizes and differing subgroup rates.

  **The Example:**
  We'll create a hypothetical A/B test for the onboarding flow, with two platforms (mobile, desktop) and two variants (Control A, Treatment B). The numbers must be small and clear.

  *Why avoid common examples?*
  - Kidney stones: Medical context is irrelevant and might distract.
  - Berkeley admissions: Involves historical data and potential bias, which might lead us into causal discussions we want to avoid.

  *Our Example:*
  - **Control (A):** 
    - Mobile: 100 visitors, 30 converted → 30% rate
    - Desktop: 20 visitors, 15 converted → 75% rate
    - Overall: 120 visitors, 45 converted → 37.5% rate

  - **Treatment (B):**
    - Mobile: 200 visitors, 70 converted → 35% rate (better than Control's 30% in mobile)
    - Desktop: 10 visitors, 8 converted → 80% rate (better than Control's 75% in desktop)
    - Overall: 210 visitors, 78 converted → 37.1% rate (worse than Control's 37.5%)

  *Why this works:*
  - The treatment wins in both segments but loses overall because the treatment group had more visitors in the low-conversion segment (mobile) and fewer in the high-conversion segment (desktop). The overall rate is pulled down by the higher weight of mobile in the treatment group.

  *What the example must NOT have:*
  - Do not make one subgroup clearly more important (e.g., desktop is the "premium" segment). We don't want to bias the answer toward subgroups. The point is that the "right" answer depends on the question.

  **Teaching Sequence (50 minutes):**

  1. **Introduction (5 mins):** 
     - Recap the incident: "Last month, we saw Treatment B lose overall but win in both mobile and desktop. Today we're going to understand why and how to think about it."
     - State the goal: "By the end, you'll know when to trust the topline and when to dig into segments, and why this reversal happens."

  2. **Rates as Weighted Averages (15 mins):**
     - Define: Overall conversion rate = (sum of conversions) / (total visitors)
     - Break it down: = (conv_mobile + conv_desktop) / (visitors_mobile + visitors_desktop)
     - Rewrite as: = [ (visitors_mobile * rate_mobile) + (visitors_desktop * rate_desktop) ] / total_visitors
     - Emphasize: It's a weighted average of the subgroup rates, with weights = proportion of visitors in each group.
     - *Activity:* Have them calculate the overall rate for Control and Treatment using the example numbers. Then, change the weights: "What if Treatment had the same rates but 10 mobile and 200 desktop? Then overall would be (10*0.35 + 200*0.80)/210 = 78.5% — much higher! So weights matter."

  3. **Present the Paradox (15 mins):**
     - Show the example (write Control and Treatment numbers side by side on the whiteboard).
     - Step-by-step calculation for each segment and overall.
     - Highlight: Treatment does better in each segment but worse overall because:
       - Control had a higher proportion of desktop (high-converting) visitors: 20/120 ≈ 17% vs. Treatment's 10/210 ≈ 5%.
     - Key: The treatment group was disproportionately allocated to the segment with lower conversion rates (mobile).

  4. **Addressing Misconceptions (10 mins):** 
     - **Order and Responses:**
       1. *"The topline is wrong / someone messed up the math":* Show the math is correct. The overall rate is a valid metric, but it's not the only way to look at it.
       2. *"More data would fix it":* No, the issue isn't noise; it's a structural effect. Even with infinite data, if the group proportions are imbalanced, the reversal remains.
       3. *"The subgroups are always the true answer":* Not necessarily. The subgroups might not be the only way to segment. The "true" answer depends on the causal question: Are we trying to improve the overall rate? Then we must account for how the treatment changes the composition (if it does) or if we can influence the mix. If the mix is fixed, then the weighted average of subgroup effects is appropriate.
       4. *"We randomize our A/B tests so this can't happen to us":* Randomization ensures that, on average, the group proportions (like mobile vs. desktop) are similar. But in a finite sample, imbalance can occur by chance. Also, if the treatment itself affects the composition (e.g., by changing the device mix of users who complete onboarding), then even in an A/B test, the paradox can occur. (But in a standard A/B test where the device is fixed per user, randomization should balance device types. So the paradox might be rare in their tests, but it can happen if the treatment affects which users are included in the denominator — e.g., if the treatment causes more mobile users to drop out early, leading to a skewed sample.) *Contested call:* We'll say that in a well-randomized experiment where the outcome is measured on the same set of users (no differential dropout by segment), the device mix should be balanced. But if there's differential dropout, or if we're analyzing observational data (like their onboarding flow incident, which might not have been a randomized experiment?), it can happen. For now, focus on the math and the concept.
       5. *"Ok, then just segment harder":* Over-segmentation can lead to noise and multiple testing issues. Also, if we don't know the right segments, we might miss the reversal. The point is to think about what drives the rates and what we can control.

  5. **Verdict on the Two Morals (3 mins):**
     - Both colleagues are partially right and partially wrong.
     - Moral 1: "Topline numbers are junk" → **Wrong.** The topline is a valid metric but can be misleading if we ignore the composition. It's not junk; it's one view.
     - Moral 2: "It's just a weighting artefact, report the topline and move on" → **Wrong.** Ignoring the segments misses that the treatment actually improved conversion in both segments. We might want to roll it out and try to get more desktop traffic, or adjust the mix.
     - **The fix:** The topline is not inherently junk, but we must understand why it reversed. The correct approach is to report both and interpret: "The treatment improved conversion in both segments, but overall conversion decreased because the treatment group had a higher proportion of mobile users, who convert at a lower rate. We should consider why the mix changed and whether we can influence it."

  6. **Check for Understanding (Last 5 mins):**
     - **Question:** "Imagine we run another experiment. Treatment has a higher conversion rate in every country we track, and the overall conversion rate is also higher. Could Simpson’s Paradox still be a concern? Why or why not?"
       - *Correct Answer:* No, because there's no reversal. But note: if the overall is higher and every segment is higher, the paradox didn't occur. However, we should still check weights if segment sizes changed dramatically, but the effect is in the same direction. (This ensures they don't over-apply the paradox.)

  7. **What to Refuse to Get Into (Explicitly):**
     - Causal diagrams (e.g., backdoor paths) or advanced causal inference.
     - How to adjust for the paradox in regression (this is a next step, but not for today).
     - Other statistical paradoxes or exceptions.

  **Summary of Time Allocation:**
  - 0-5 min: Intro
  - 5-20 min: Rates as weighted averages
  - 20-35 min: Example and paradox
  - 35-45 min: Misconceptions and verdict
  - 45-50 min: Check question and wrap-up

  **Commitments:**
  - **One Example:** The A/B test with mobile and desktop as above.
  - **What to Cut:** Do not dive into causal inference or regression. Avoid other examples.
  - **Verdict:** Both morals are incomplete. The topline is not junk, but we can't ignore the segments. The weighting artefact is real, but we must understand why it happened.

  By the end, they should see the flip as inevitable in the example and understand that the overall rate depends on both the subgroup rates and the weights. They'll know to check for imbalances in group sizes when interpreting topline results.
answer: |-
  Here's a battle-tested lesson plan tailored to your analysts. The goal is to create an "aha" moment about weighted averages before Simpson's paradox even shows up, then resolve their real-world confusion.

  ---

  ### **Teaching Sequence (50m Total)**
  **Dependency Chain:**  
  1. What averages hide → 2. Rates as weighted averages → 3. Why weights create illusions → 4. How this causes reversals → 5. When to trust what

  | Time | Phase                          | Key Activity                                                                 |
  |------|--------------------------------|------------------------------------------------------------------------------|
  | 0-5m | **Hook: Their Incident**       | Replay their onboarding flow result (topline loss, subgroup wins). Ask: "Which colleague is right? We'll resolve this today." |
  | 5-15m| **What Averages Hide**         | Derive conversion rate = weighted average of subgroup rates. Use their funnel metrics. *Crucial foundation.* |
  | 15-30m| **Weights Create Illusions**   | Interactive whiteboard: Change group sizes with fixed rates → overall rate flips. *Make it feel inevitable.* |
  | 30-40m| **The Reversal (Simpson's)**   | Introduce paradox as special case of weights. Use their incident numbers. Debunk misconceptions. |
  | 40-45m| **Decision Rule**              | "When should you trust subgroups?" Flowchart. Verdict on the two morals.     |
  | 45-50m| **Check Understanding**        | "Spot the Trap" question (see below).                                        |

  ---

  ### **The Example: Onboarding Flow A/B Test**
  **Why this works:**  
  - Uses their domain (traffic mix between platforms)  
  - Numbers small enough to calculate mentally  
  - Flip feels inevitable, not magical  
  - Avoids "obvious" subgroup superiority  

  **Actual Numbers:**  
  *Control (A):*  
  - Mobile: 100 visitors → 40 conversions (40%)  
  - Desktop: 50 visitors → 35 conversions (70%)  
  - **Overall:** 150 visitors → 75 conversions → **50%**  

  *Treatment (B):*  
  - Mobile: 180 visitors → 81 conversions (45%) *← better than Control mobile*  
  - Desktop: 20 visitors → 15 conversions (75%) *← better than Control desktop*  
  - **Overall:** 200 visitors → 96 conversions → **48%** *← worse than Control!*  

  **Why the flip is inevitable:**  
  - Treatment improved conversion rates for both platforms  
  - BUT traffic shifted toward lower-converting mobile (90% vs Control's 67%)  
  - Math: (45% × 0.9) + (75% × 0.1) = 48% < (40% × 0.67) + (70% × 0.33) = 50%  

  **What the example MUST avoid:**  
  - ❌ No inherent quality difference between segments (e.g., desktop isn't "premium")  
  - ❌ No missing variables (e.g., no "user type" hidden confounder)  
  - *Why?* Ensures focus on weights, not subgroup superiority.  

  ---

  ### **Misconceptions & Defusing Them**  
  *(Order they'll arise, with responses)*  

  1. **"The topline math is wrong!"**  
     - *When:* During example calculation  
     - *Response:* "Let's calculate together. See? Arithmetic is correct. The trap is *interpreting* it."  

  2. **"More data would fix this."**  
     - *When:* After seeing reversal  
     - *Response:* "Actually, larger samples worsen this! More data amplifies the weight imbalance."  

  3. **"Subgroups are always the truth!"**  
     - *When:* After seeing subgroups agree  
     - *Response:* "What if Treatment caused the traffic shift? Then subgroups aren't causal. *Always ask why weights changed.*"  

  4. **"We randomize A/B tests, so this can't happen!"**  
     - *When:* During verdict phase  
     - *Response:* "Half-true: Randomization balances *unobserved* factors, but platform is observed! If Treatment attracts more mobile users *because of the change*, weights shift. Always check segment traffic allocation."  

  5. **"Just segment harder!"**  
     - *When:* During Q&A  
     - *Response:* "Deeper segments increase noise and may hide effects. Weights explain 90% of reversals—start there."  

  ---

  ### **Verdict on the Two Morals**  
  - **Colleague 1 (trust subgroups):**  
    *Survives, but incomplete.* Subgroups reveal mechanism, but blindly trusting them ignores why weights changed.  

  - **Colleague 2 (report topline):**  
    *Falls apart.* Topline alone could kill a good feature. Must report: "Treatment improved conversion on both platforms, but overall dipped due to increased mobile traffic share."  

  **The Fix:** Both are pieces. Always:  
  1. Check weights (traffic allocation)  
  2. Ask: "Did the treatment *cause* the weight shift?"  
  3. Report: Subgroup effects + weight change  

  ---

  ### **"Got It?" Check Question (Final 5m)**  
  **Ask:** *"We launch a feature where:*  
  - *It wins with new users (10% lift) but loses with existing users (5% drop)*  
  - *Overall, it’s flat (+0.1%)*  
  *Should we roll it out? What’s your next move?"*  

  **Correct Answer:**  
  - "Check traffic weights. If we're acquiring tons of new users, rollout might be good. If traffic is stable, kill it. Never trust flat topline!"  

  **Why it works:** Tests if they connect weights to action, not just math.  

  ---

  ### **What to Refuse**  
  - **❌ Causal diagrams:** "We're focusing on descriptive math today, not causality."  
  - **❌ Adjusting metrics:** "We'll cover standardization in Part 2."  
  - **❌ Berkeley/kidney stone examples:** "Real onboarding flows > medical papers."  

  ---

  ### **Why This Works**  
  - **Fixes instinct:** Makes weights visceral before showing reversal.  
  - **Uses their trauma:** Resolves their exact confusion with their numbers.  
  - **Safe for SQL-fluent:** Math stays in percentages and counts.  

  Start writing the Control/Treatment numbers on the board at minute 15. The gasp when Treatment loses overall will be your signal they're hooked.
