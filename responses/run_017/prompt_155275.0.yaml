prompt: |-
  Next month I'm recording an episode of a philosophy podcast with a perceptual epistemologist who has just finished a book defending the epistemic innocence of cognitive penetration. Her central argument — call it the symmetry thesis — runs roughly like this: if a person's fear can shape what she sees, so that the shadow at the end of the alley looks menacing to her, and if that penetration is supposed to strip her experience of justificatory force, then the same should hold for the radiologist whose years of training make a faint shadow on a scan look like a tumor. But the radiologist's experience looks like a paradigm of good perceptual justification rather than a defective one. So, she concludes, the epistemic objection to penetration is misplaced: what matters for whether an experience justifies belief is the reliability of the process that produced it, not whether that process was shaped from above.

  Draft me six interview questions that press on the argument rather than asking her to restate it. I want: one question on why the two flanking cases are genuinely parallel, with a follow-up keyed to the reply I expect — that in the fear case the penetrating state's content is simply echoed back in the experience, while in the expertise case the training contributes a prior the experience then corroborates — pressing her on whether that contrast can be drawn without assuming what is in dispute; one on whether reliability is sufficient when the penetrating state is itself partly sustained by the experiences it shapes, so that the whole arrangement is reliable but circular; one on how we would distinguish real penetration from post-perceptual judgment, a shifted response criterion, or a subject reporting what she takes herself to have seen, and which of her own cases would survive that scrubbing; one on whether the view still leaves her any way to distinguish perceiving from imagining or assuming; and a closing question about what empirical finding would count against the symmetry thesis. Give each question a one-line note on how confident you are that this is where the dialectic actually bites, and flag the one question you are least sure would land. There's no need to name authors or papers.
reasoning: |-
