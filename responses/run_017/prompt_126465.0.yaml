  - So, after they choose a cutoff (either one or two cutoffs), the facilitator will:
    - For the enrolled patients: flip a coin for each patient who was going to have an HI: with 50% chance they don't have it (because of the program) and 50% they do (the program didn't work for them). But wait, we said it reduces the chance by 50%, so if the original risk was p, the new risk is p/2. But we have discrete events. We can simulate by: for each enrolled patient who was going to have an HI (based on the initial data), we have a 50% chance of turning it into a non-HI.
    - For the not enrolled patients: we assume they have the same outcome as the initial data.
    - But when they re-audit, they only have data on the enrolled patients. So they see:
        - For the enrolled: the new outcome (after the program effect)
        - For the not enrolled: no outcome data (so they cannot compute the true FNs or TNs for next year's model training).
  - Teams must decide on a cutoff for next year using only the data from the enrolled patients this year.
  - They will see that the base rate in the data they have is now different (because they only see a subset and the program changed the outcomes).

  This part is complex. We might need to run a simulation.

  Alternatively, we can do a simpler version: after they choose a cutoff and the program is applied, we give them a new aggregate table that only includes the enrolled patients, with the new outcomes (i.e., the HI counts reduced by 50% for the enrolled). But then they don't have data on the rest.

  For example, for Group A, if they enrolled 300 patients (with 135 HIs initially), after the program, the number of HIs in the enrolled group is 67.5 -> approximately 68. And the non-HI in enrolled becomes 300 - 68 = 232. But they don't know about the others.

  For next year, they have a new set of patients, but we won't simulate that. Instead, we just show that the data they have for re-training is biased.

  But the point is to see that the base rates and distributions are changed.

  #### Part 5: Debrief (25 minutes)
  - Map the experience to the fairness trilemma.
  - Discuss why the bland group labels are problematic (they might be proxies for race or SES, and the base rate differences are due to structural factors).
  - Discuss the escape hatch: different thresholds lead to explicit use of group membership, which might be controversial.
  - Discuss the feedback loop: how the intervention changes the data, leading to a distorted view for future models.

  ### Timeline
  - 0-10 min: Introduction
  - 10-25 min: Part 2 (teams choose one cutoff) [15 min]
  - 25-35 min: Facilitator runs audit and shares results [10 min]
  - 35-55 min: Part 3 (teams choose two cutoffs) and audit [20 min]
  - 55-75 min: Part 4 (feedback loop: teams use only enrolled data to choose next year's cutoff, and we simulate the effect) [20 min]
  - 75-90 min: Debrief [15 min] -> but we allocated 25 min above, so adjust.

  Revised timeline for 90 min:
  - 0-10: Intro
  - 10-25: Part 2 (15 min for teams to decide one cutoff)
  - 25-35: Facilitator collects cutoffs, runs audit, and reports (10 min)
  - 35-45: Part 3 intro and teams choose two cutoffs (10 min)
  - 45-55: Audit for two cutoffs (10 min)
  - 55-65: Part 4 intro and teams choose cutoffs for next year (using only enrolled data from this year) (10 min)
  - 65-70: Simulate and show results (5 min)
  - 70-90: Debrief (20 min)

  ### What will go wrong
  1. **Someone does the algebra**: If a participant starts calculating the optimal threshold mathematically, that's okay. It might happen quickly. You can acknowledge that in real life, we have optimization, but the point is the trade-offs between fairness criteria.

  2. **"Just don't use algorithms"**: If someone suggests not using the algorithm at all, you can say that the same trade-offs appear in human decision-making, but algorithms make them explicit and measurable. The exercise is about understanding the trade-offs.

  3. **Inventing a new fairness criterion**: A team might try to define a new way to be fair. Welcome the creativity, but then show how their criterion relates to the three we have (calibration, FPR, FNR) and whether it avoids the trilemma. Likely it will require sacrificing one of the three.

  ### What the game can't deliver
  - The trilemma is a mathematical necessity given different base rates. The made-up numbers illustrate it, but the result holds generally. You can say: "In the real world, as in our exercise, if two groups have different base rates, you cannot achieve all three fairness properties at once. This is a mathematical certainty, not an artifact of these numbers."
  - The game does not address why the base rates differ. In the debrief, you must emphasize that the base rate differences are often due to structural inequities, and the algorithm inherits them. The bland group labels are placeholders for social categories, and the exercise of avoiding them is itself a form of ignoring structural differences.

  ### Debrief Points
  - **The trilemma**: When base rates differ, you can't have calibration, equal FPR, and equal FNR. In the first round, whichever cutoff they chose, one or two of these failed.
  - **The escape hatch**: Using different thresholds for each group can equalize error rates, but at the cost of using group membership explicitly, which might be seen as discriminatory (equal treatment vs. equitable treatment).
  - **The feedback loop**: By only observing outcomes for the enrolled, the data becomes biased. The base rate in the enrolled group is altered by the intervention, and the non-enrolled group is not observed. This makes it hard to re-train the model and can perpetuate biases.

  You can say: "The takeaway is that fairness in algorithms isn't a box you check by choosing a metric; it's a set of value judgments about which trade-offs are acceptable. And these trade-offs are unavoidable when groups have different base rates, which often reflect broader societal inequities."

  ### Materials to Prepare
  - **Packets for each team** (4 packets):
    - Page 1: Background and instructions for Part 1.
    - Page 2: Aggregate data for Group A (City Hospital) and Group B (Clinic) in tables.
    - Page 3: (To be handed later) Audit report form for Part 2.
    - Page 4: Instructions for Part 3 (escape hatch).
    - Page 5: Audit report form for Part 3.
    - Page 6: Instructions for Part 4 (feedback loop).
    - Page 7: Data from the enrolled patients only (after program effect) for Part 4.
  - **Facilitator's master sheet** with the full data and formulas to compute the audits quickly.
  - Flip charts and markers.
  - Projector for overall instructions and debrief.

  This design should fit within 90 minutes and provide a hands-on experience of the fairness trilemma.
answer: |-
  Below is a complete, runnable activity design for your 90-minute session. I've focused on creating an experiential "aha" moment around algorithmic fairness trade-offs, using a hospital risk-score scenario with deliberate abstractions to sidestep unproductive debates. The design includes three acts: the initial trilemma, the escape hatch, and the feedback loop, with the last one serving as the crucial third beat.

  ---

  ### **Activity: The Fairness Trilemma Simulation**
  **Objective:** Experience why satisfying multiple fairness criteria simultaneously is impossible with differing base rates, discover workarounds, and confront unintended consequences.

  ---

  ### **Materials List** (fits in carry-on)
  1. **Team Packets** (4 packets, one per team of 4):
     - Part 1: Background, scoring rules, and aggregate data tables (see [Data Setup] below).
     - Part 2: "Audit Report" sheets (revealed after initial decisions).
     - Part 3: Feedback loop rules and partial dataset.
  2. **Facilitator Toolkit**:
     - Printed "hidden data" master sheet (for quick auditing).
     - Scoreboard (flip chart or whiteboard).
     - Timer.
     - Sticky notes for team decisions (threshold choices).
     - Projector for debrief slides (optional, not formulas).
  3. **Other**: Pens, calculators (teams can use phones).

  ---

  ### **Data Setup**  
  *Deliberately bland groups:* **City Hospital (CH)** and **Rural Clinic (RC)**.  
  *Risk score:* 0–100 (higher = higher risk of "Adverse Event" (AE)).  
  *Base rates differ:* CH has higher AE prevalence (20%) than RC (10%).  

  **Aggregate Data Tables for Teams**  
  *(Based on 500 patients per group; calibrated scores)*  

  | **Risk Score Range** | **City Hospital (CH)** | **Rural Clinic (RC)** |
  |----------------------|-------------------------|------------------------|
  |                      | **# Patients** | **# AEs** | **# Patients** | **# AEs** |
  | 0–20                 | 100           | 5         | 200           | 4         |
  | 21–40                | 150           | 30        | 150           | 15        |
  | 41–60                | 150           | 45        | 100           | 20        |
  | 61–80                | 80            | 40        | 40            | 16        |
  | 81–100               | 20            | 20        | 10            | 5         |
  | **Total**            | **500**       | **140** (28%) | **500**       | **60** (12%) |

  *Notes for facilitator (hidden):*  
  - **True base rates:** CH = 140/500 = 28%, RC = 60/500 = 12%.  
  - **Calibration:** Scores are calibrated *within groups* (e.g., in CH’s 41–60 bin, 45/150 = 30% ≈ midpoint of 50).  
  - **Individual patients not provided** to avoid "gaming" via micro-decisions.

  ---

  ### **Rules & Payoff Scheme**  
  - **Goal:** Maximize "Community Health Points" (CHP).  
  - **Scoring:**  
    - `+5 CHP` per **True Positive** (enroll patient who *would have had AE*).  
    - `-1 CHP` per **False Positive** (enroll patient who *would not have had AE*).  
    - *No points* for True/Negatives or False Negatives (simplifies focus on trade-offs).  
  - **Constraints:**  
    - Limited program slots (no cap, but high FP costs will deter over-enrollment).  
    - Teams choose thresholds **without knowing true outcomes** (only aggregate tables).  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **Part 1: The Trilemma (30 min)**  
  - **0–5 min:** Introduce the scenario.  
    > *"Your team is a hospital committee allocating scarce follow-up care. Use this risk score to decide who gets enrolled. You have aggregate data from last year. Maximize CHP. You must use ONE threshold for both groups."*  
  - **5–15 min:** Teams pick one threshold using aggregate tables. Write choice on sticky note.  
  - **15–25 min:** **Audit Reveal:**  
    - Collect thresholds. For each, announce:  
      - CHP earned (calculate using hidden data).  
      - **Fairness audit:** Violations of:  
        1. **Calibration:** Observed AE rate ≈ score (within 5%)?  
        2. **Equal FPR:** Same FP rate (FPR = FP / Non-AE patients).  
        3. **Equal FNR:** Same FN rate (FNR = FN / AE patients).  
    - *Sample result for threshold=50:*  
      - CH: FPR=24%, FNR=25%, Calibration=Good (AE rate=39% ≈ 40–60 bin).  
      - RC: FPR=12%, FNR=50%, Calibration=Good (AE rate=18% ≈ 40–60 bin).  
      - **Violations:** Equal FPR ❌, Equal FNR ❌.  
  - **25–30 min:** Teams see their audit. Highlight: *"No matter your threshold, 1–2 criteria failed."*  

  #### **Part 2: The Escape Hatch (25 min)**  
  - **30–35 min:** Introduce the fix.  
    > *"Now you may set DIFFERENT thresholds per group. Goal: Achieve equal FPR AND FNR."*  
  - **35–45 min:** Teams pick two thresholds (e.g., CH=40, RC=60).  
  - **45–50 min:** **Audit Reveal:**  
    - *Sample (CH=40, RC=60):*  
      - Equal FPR (CH=15%, RC=15%), equal FNR (CH=21%, RC=20%).  
      - **But:** A CH patient with score=55 gets care; an RC patient with score=55 does not.  
  - **50–55 min:** **Trade-off discussion:**  
    > *"You achieved fairness in errors. What did you sacrifice? Is it fair that identical-risk patients get different care?"*  

  #### **Part 3: The Feedback Loop (25 min)**  
  - **55–60 min:** Introduce twist.  
    > *"New rule: You only see outcomes for ENROLLED patients next year. Why? Unenrolled patients aren’t tracked. Also, the program WORKS: Enrolled patients’ AE risk drops 50%."*  
  - **60–65 min:** Teams receive **partial dataset** (only patients they enrolled in Part 2, with AE counts post-intervention).  
    - *Example (if CH=40, RC=60):*  
      - CH: 50 AEs originally → 25 post-intervention (50% reduction).  
      - RC: 30 AEs originally → 15 post-intervention.  
      - *No data on unenrolled patients.*  
  - **65–70 min:** Teams re-audit their system using **only this partial data**.  
    - *They’ll calculate:*  
      - Observed AE rate drops (e.g., CH: 25/250 = 10% vs. original 28%).  
      - "New" risk scores appear inflated (e.g., CH’s 41–60 bin now has AE rate=15% vs. original 30%).  
  - **70–75 min:** **Reveal consequences:**  
    - Base rates appear artificially lower → Teams lower thresholds to "catch more AEs."  
    - *But:* This amplifies disparities (e.g., RC’s lower enrollment → less data → worse model tuning).  

  #### **Debrief (10 min)**  
  - **75–85 min:** Facilitator-led discussion:  
    | **Game Moment**          | **Real-World Concept**                          |  
    |--------------------------|------------------------------------------------|  
    | Part 1 audit             | Trilemma: Calibration, equal FPR/FNR impossible with differing base rates. |  
    | Part 2 thresholds        | "Equal odds" fix requires explicit group treatment → procedural unfairness. |  
    | Part 3 partial data      | Feedback loops: Interventions alter data, masking true risk and entrenching bias. |  
    | Bland group labels       | Abstraction hides structural causes of base-rate differences (e.g., access disparities). |  
  - **85–90 min:** Final takeaways:  
    > "Fairness isn’t a checkbox; it’s a trade-off between competing values. Algorithms don’t create these tensions—they reveal them. Your job as journalists: Scrutinize which trade-offs were chosen, who bears the cost, and whether we’re solving symptoms or causes."  

  ---

  ### **What Will Go Wrong & How to Handle It**  
  1. **"Someone does the algebra"**:  
     - *Likelihood:* High. Math-inclined reporters will calculate expected CHP.  
     - *Response:* "Great! But does your ‘optimal’ threshold satisfy all fairness criteria? Check the audit." (Spoiler: It won’t.)  

  2. **"Just don’t use algorithms"**:  
     - *Likelihood:* Medium.  
     - *Response:* "Human decisions face the same trade-offs—they’re just less visible. Algorithms force us to confront them. What’s your non-algorithmic solution?" (Let them sit with the discomfort.)  

  3. **"Inventing a new fairness criterion"**:  
     - *Likelihood:* High. Teams may suggest "equal enrollment rates" or "need-based fairness."  
     - *Response:* "Interesting! Does your criterion require *ignoring* base rates? Does it conflict with calibration? That’s the point: Every definition has trade-offs."  

  4. **Emotional debates about group labels**:  
     - *Likelihood:* Low (bland labels help), but possible in debrief.  
     - *Response:* "We abstracted groups to focus on the math. But in practice, these labels *are* charged. The trilemma doesn’t care—it applies to *any* groups with base-rate differences, whether ‘city vs. rural’ or racial groups."  

  ---

  ### **What the Game Can’t Deliver**  
  1. **Mathematical necessity (vs. artifact)**:  
     - *Limitation:* The game shows the trilemma exists in *this* dataset but doesn’t prove it’s unavoidable.  
     - **What to say:** "This isn’t just about my numbers. Math itself says: If Group A has more underlying risk than Group B, you can’t have all three fairness properties. Period."  

  2. **Structural causes of base rates**:  
     - *Limitation:* The game treats base rates as given, ignoring *why* CH has higher AEs (e.g., poverty, bias in training data).  
     - **What to say:** "Algorithms inherit the world’s inequalities. The 28% vs. 12% isn’t neutral—it reflects real disparities. But even if we fix those, the trilemma remains for *any* groups with current differences."  

  3. **Overlapping subgroups**:  
     - *Why not included:* Adds complexity without deepening the core insight. The feedback loop beat better illustrates systemic consequences.  

  ---

  ### **Final Notes**  
  - **Prep Tips**:  
    - Pre-calculate CHP/audits for common thresholds (40/50/60) to speed up reveals.  
    - For Part 3, generate partial datasets *during* the activity based on teams’ Part 2 choices.  
  - **Why This Works**: Reporters *feel* the trade-offs via low-stakes choices and audit surprises. The feedback loop forces them to confront how algorithmic decisions distort reality.  
  - **Debrief Anchor:** End with, "Your stories shape which trade-offs society notices. Will you frame this as an algorithm problem... or a design-for-values challenge?"  

  This design turns abstract theory into tactile frustration, ensuring the trilemma sticks. Run it as a "choose-your-own-adventure" with real stakes (CHP bragging rights!), and let the audits do the teaching.
