  **You are offered a choice: take only sealed box B, or take both B and visibly empty box A containing $1,000. The contents of B were set by an automated lottery one week ago using your blood hormone level (measured yesterday) as input: high hormone (50% base rate) yields $0 in B with 90% probability and $1,000,000 with 10%; low hormone yields $1,000,000 with 90% probability and $0 with 10%. This hormone directly influences neural impulsivity circuits, making high hormone cause 90% probability of two-boxing (taking both) and 10% of one-boxing (taking only B), while low hormone causes 10% two-boxing and 90% one-boxing. You know these probabilities and base rates but not your hormone level.**

  **EDT verdict: one-box.**  
  *Reasoning:* EDT conditions on the choice as evidence. Choosing two-boxing strongly indicates high hormone (posterior 90%), making B likely empty (P(B = \$1M) = 0.18). Expected value (EV) of two-boxing = (0.18 × \$1,001,000) + (0.82 × \$1,000) = \$181,000. Choosing one-boxing indicates low hormone (posterior 90%), making B likely full (P(B = \$1M) = 0.82). EV of one-boxing = 0.82 × \$1,000,000 = \$820,000. Higher EV for one-boxing.  

  **CDT verdict: two-box.**  
  *Reasoning:* CDT ignores choice as evidence and uses only causal dependencies. Hormone level (unknown) is the common cause. EV averages over hormone states (each 50% prior):  
  - *If high hormone:* P(B = \$1M) = 0.1, so two-boxing EV = (0.1 × \$1,001,000) + (0.9 × \$1,000) = \$101,000; one-boxing EV = 0.1 × \$1,000,000 = \$100,000.  
  - *If low hormone:* P(B = \$1M) = 0.9, so two-boxing EV = (0.9 × \$1,001,000) + (0.1 × \$1,000) = \$901,000; one-boxing EV = 0.9 × \$1,000,000 = \$900,000.  
  Overall EV(two-box) = (0.5 × \$101,000) + (0.5 × \$901,000) = \$501,000; EV(one-box) = (0.5 × \$100,000) + (0.5 × \$900,000) = \$500,000. Two-boxing yields \$1,000 more.  

  **Critical feature for both tests:** The hormone’s *physical causal influence* on both choice (via neural impulsivity) and lottery outcome (via input to the automated system).  

  - **If deleted (no hormone influence):** Choice and lottery become independent. EDT and CDT converge: two-boxing always adds \$1,000 (since B’s contents are independent of choice).  
  - **Lesion test application:** Replace hormone with a brain lesion that *only fixes high hormone outcomes* (causing 90% two-boxing and 90% chance of B = \$0). Now, the lesion determines outcomes; choice provides no new evidence and has no causal power. EDT calculates: two-boxing EV = (0.9 × \$1,000) + (0.1 × \$1,001,000) = \$100,100; one-boxing EV = (0.1 × \$1,000,000) + (0.9 × \$0) = \$100,000. Near indifference (difference due to baseline noise). CDT sees lesion as fixed state: two-boxing adds \$1,000 in all worlds. **Verdict flips:** In hormone case, one-boxing is obvious for EDT; in lesion case, CDT’s two-boxing edge dominates, while EDT is nearly indifferent.  

  **Strongest CDT attack:** "Your framing misrepresents the agent’s evidence. The agent knows *before choosing* that their hormone level is fixed, meaning B’s contents are already determined. Thus, they should not treat their choice as informational—updating on it is irrational self-signaling. Only the base rate matters. For example, regardless of hormone, two-boxing adds \$1,000 if B is full and still adds \$1,000 if B is empty. Choice only *appears* evidentially relevant because you’ve embedded it in a narrative that tempts the agent to overupdate. This is not a true Newcomb problem."  

  **Counter:** The attack fails. The agent *lacks* access to their hormone level or B’s contents. Choice is genuinely informational: in the causal structure, it screens off the hormone for B’s state. Crucially, the hormone’s *pre-choice physical influence* on both systems makes the correlation objective, not a narrative trick. The agent must use their knowledge of the hormone-choice link to interpret their decision; ignoring this forces underupdating. The setup satisfies both tests without smuggling in a predictor.
