prompt: |-
  I chair the Clinical Priorities Committee of a regional hospital network — six hospitals, roughly nine hundred beds, a mix of urban and rural sites. We meet monthly for ninety minutes and we decide two kinds of thing. The first is standing allocation protocols: who gets the scarce dialysis places, how a short supply of a costly drug is rationed, which exceptions to the transplant waiting list we will endorse. The second, perhaps five or six times a year, is an individual case escalated to us, usually a request for a treatment we would not normally fund. Our members are two physicians, a nurse manager, a pharmacist, and a lay member. None of us has training in philosophy or in health economics. Every decision has to survive two audiences: it must be explainable in a one-page written rationale to the patient or family it burdens, and it must be defensible to a board that thinks mainly in terms of value for money. Anything with a budget impact above a set threshold requires the chief medical officer's counter-signature, and anything that reverses our own standing protocol goes to the board.

  Our working method is cost-effectiveness arithmetic. We estimate benefit in quality-adjusted units, sum across the people affected, and compare totals. It is transparent, it is auditable, and it is straightforwardly aggregative. Last year the daughter of a patient wrote to complain that we had treated her father as a unit in a calculation, and my own sense — which I have not been able to shake — is that the complaint identified something our method is structurally unable to register: that the gains and losses we add up fall on different people, and that a large sum of small benefits distributed across many does not by itself constitute an answer to the one person who is asked to bear something concentrated. The board has now asked us to build an explicit separateness check into our process.

  What I need from you is that check as a procedure rather than as a principle. Concretely: an ordered set of questions we can run in about twenty minutes of committee time on any proposal whose justification aggregates benefits and burdens across distinct patients; what counts as a sufficient answer to each; the points at which the procedure stops and returns a no; and the points at which it stops and hands the decision to a named person on the grounds that what remains is a judgment about values rather than a finding. I want it to be capable of actually biting, and I want the hand-off points to be honest rather than an escape hatch from every difficult case.

  Three of the tests I have in mind are these, and I would like you to build them, tighten them, or replace them if you can show they are the wrong instruments.

  First, an addressability test. The committee should have to state, in one sentence addressed to the person who bears the largest single-person loss, what that person is being asked to accept and why. The test should distinguish a reason that is genuinely a reason for that person — one that survives being generalized to everyone in their position — from a reason that only appears when the case is described from an impersonal standpoint, and whose entire content is that other people gain more.

  Second, a re-description audit. Before we sum, we should have to say what the units being summed are, and check whether they are persons or slots. A benefit described as life-years produced, cases detected, or readmissions averted is a benefit whose bearer has been made interchangeable; a benefit described as this patient's remaining years, or this patient's settled refusal being respected, is not. Where the ranking of options changes depending on which description we adopt, I want the procedure to say so and to rule on whether the slot-description is licensed.

  Third, a ratified-pool test. Aggregation within a single person's life — their own present burden traded against their own longer future — seems to me to raise a much weaker version of the worry than aggregation across lives. I also suspect that aggregation across people is least problematic where those people have in some sense authorized the conversion: they joined a scheme with published rules, they registered under a protocol they knew pooled风险 and benefit, they left an advance directive. My tentative view is that cross-person conversion without ratification is what stands in need of special justification, and that this gives the procedure a principled place to stop rather than a series of ad hoc thresholds. Tell me whether that is defensible and where it breaks.

  I also want a concentration threshold of some kind, but I do not know how to set or defend one, so tell me what the procedure should do when the largest single-person loss is severe and irreversible even though the aggregate favours proceeding.

  The hard cases the procedure must be able to process without collapsing: benefits and burdens falling on statistical rather than identified people; people who cannot be addressed at all, such as infants, patients with advanced dementia, or the unconscious; burdens falling on people who are not yet patients or not yet born; cases where the aggregative and non-aggregative answers diverge only because of how the benefit is described; genuine emergencies decided in minutes; and proposals where the same people appear on both sides of the ledger, so that a rule that protects them as losers also deprives them as winners.

  Then run the procedure on three of our actual recurring cases. One: closing a satellite dialysis unit that serves eleven named patients in a rural town, and redirecting the money to a screening programme that will, on the evidence, prevent a small number of deaths across a much larger population. Two: a request to fund an extremely expensive last-line therapy for one identified patient, where the same money would fund a nurse-led follow-up service that prevents many readmissions — I expect this is the case where the procedure will tell us something we do not want to hear, and I want you to let it. Three: a proposed rule for allocating a scarce drug during a shortage, under which expected benefit governs entirely and the fact that a candidate is already under this hospital's care, with an established clinical relationship, counts for nothing.

  Finally, I want a clear statement of what the procedure cannot do: which of its inputs are set by judgment rather than by the theory, how a committee without philosophical training should set and revisit them, where we should expect it to misfire or to be gamed by a clever re-description, and what brief minute we should record so that the board can audit that the check was run rather than accept our assurance that it was. Please argue for the view rather than survey it: no citations, no bibliography, and no references to particular papers or authors, since I have no library access and no way to check them.
reasoning: |-
  Okay, the user chairs a Clinical Priorities Committee in a hospital network and needs a practical "separateness check" procedure. They've outlined three initial test ideas and want a concrete 20-minute process that can handle real-world cases without philosophical jargon. 

  Hmm, their core concern is ethical: cost-effectiveness calculations treat people as interchangeable units, but actual patients experience burdens individually. The daughter's complaint about her father being reduced to a "unit in a calculation" clearly resonated deeply. They need this procedure to force explicit consideration of individual sacrifices.

  Interesting constraints: Must fit within tight meeting times, survive board scrutiny focused on value-for-money, and produce defensible one-page rationales to affected families. Also has to work for edge cases like unconscious patients or statistical populations. 

  Their three proposed tests show sophisticated ethical intuition:
  1. Addressability test - Can we justify the burden to the actual person bearing it?
  2. Redescription audit - Are we measuring interchangeable "slots" or actual human experiences?
  3. Ratified-pool test - Did the affected person consent to being part of this trade-off?

  Ah, the concentration threshold problem is tricky. How severe is "too severe" for an individual loss even when aggregate math works? And they're right to anticipate resistance - especially in that expensive last-line therapy case where the procedure should "tell us something we don't want to hear."

  For implementation: Need to make this a flowchart-like checklist with clear stopping points. The "hand-off to named person" mechanism is smart - acknowledges that some decisions ultimately require value judgments beyond procedural checks. 

  Key design challenges:
  - Must avoid becoming just another bureaucratic hoop
  - Needs to genuinely change outcomes sometimes
  - Can't require philosophy degrees to operate
  - Must handle cases where patients can't consent (infants, unconscious)

  The three test cases are perfect stress tests:
  1. Rural dialysis closure vs population screening
  2. Expensive individual therapy vs preventive service
  3. Scarce drug allocation ignoring existing relationships

  For the concentration threshold... perhaps borrow from disability-adjusted life years (DALY) severity weightings? But simplified. And always require CMO review for irreversible losses. 

  Biggest insight: The ratified-pool test might be the most powerful. If patients knowingly joined a resource-sharing scheme (like an insurance pool), aggregation feels fairer. But for unconsenting individuals, we need higher justification bars.

  Final output must include: 
  - Clear "what we can't decide" boundaries
  - Anti-gaming precautions
  - Minimalist minute-taking protocol for audits
  - No theoretical citations - pure applied ethics
answer: |-
  Here is a concrete separateness check procedure designed for your committee’s constraints. It runs in **≤20 minutes** per case, outputs clear actions ("Proceed," "Halt," or "Escalate"), and addresses your core tests while handling edge cases. The steps are sequential—if any step fails, you stop or escalate.

  ---

  ### **Separateness Check Procedure**  
  *(For proposals aggregating benefits/burdens across distinct patients)*  
  **Time allocation:** 2-3 minutes per question (total: 8 core questions + 2 contingency steps).

  #### **Step 1: Addressability Test**  
  *Question:* **"To the person bearing the greatest individual burden (B): Can we truthfully say: 'We ask you to accept [describe loss] because [reason], and this reason would apply to anyone in your position'?"**  
  - *Sufficient answer:* The reason must be **patient-specific** (e.g., clinical urgency, prior consent, avoidable harm) and **generalizable** (not dependent on others’ gains).  
  - *Fail:* If the *only* reason is "others gain more." → **HALT proposal.** Escalate to CMO for override review.  
  - *Edge cases:*  
    - *Unidentifiable/incapacitated persons:* Use a proxy (e.g., "a typical patient with condition X").  
    - *Future persons:* Describe burden as a class (e.g., "future patients who will lack screening access").  

  #### **Step 2: Re-description Audit**  
  *Question:* **"Does the outcome change if we redefine benefits/burdens as *personal experiences* (e.g., ‘Patient Y’s survival’) vs. *interchangeable units* (e.g., ‘life-years gained’)?"**  
  - *Sufficient answer:* If the ranking **does not change**, proceed. If it **changes**, ask: **"Is the unit-based description *necessary* for clinical feasibility or fairness?"**  
    - *Yes* (e.g., organ allocation algorithms): → **Proceed**, but note in rationale.  
    - *No* (e.g., ignoring patient relationships in drug allocation): → **HALT.** Redesign proposal.  
  - *Trap for gaming:* Reject descriptions that artificially inflate aggregates (e.g., "anxiety reduction" as 1,000 minor gains vs. one patient’s amputation).  

  #### **Step 3: Ratified-Pool Test**  
  *Question:* **"Is the burdened person part of a group that *knowingly accepted* pooled risk (e.g., via advance directive, prior protocol consent, insurance scheme)?"**  
  - *Sufficient answer:* **Documented ratification** (e.g., signed dialysis protocol, clinical trial consent).  
  - *Fail:* No prior agreement → Apply **Concentration Threshold** (Step 4).  
  - *Defensibility:* Breaks if ratification is coerced, unclear, or if patient was never informed (e.g., emergency admissions).  

  #### **Step 4: Concentration Threshold**  
  *Question:* **"Is the largest individual burden *severe and irreversible* (e.g., death, major disability, permanent pain)?"**  
  - *Yes* → **Escalate to CMO** for direct review. CMO must either:  
    - **Approve:** With written justification for overriding separateness.  
    - **Reject:** Proposal halts.  
  - *No* (e.g., temporary inconvenience, moderate cost) → **Proceed.**  
  - *Threshold definition:* "Severe and irreversible" = **Loss that permanently alters life trajectory** (validated by clinical lead).  

  #### **Contingency Steps**  
  - **Emergency bypass:** If decision time <10 mins, apply Steps 1–2 only. Document rationale retrospectively.  
  - **Tiebreaker:** If check stalls, escalate to CMO with unresolved step flagged.  

  ---

  ### **Application to Your Cases**  
  **Case 1: Close rural dialysis unit → Fund population screening**  
  - *Addressability:* "We ask dialysis patients to accept loss of service because you joined a regional system with resource-sharing protocols." → **Pass** (if protocols exist).  
  - *Re-description:* Switching units to life-years changes outcome? *Yes.* Is unit-based description necessary? *Yes* (feasibility of system-wide resource allocation). → **Proceed.**  
  - *Concentration:* Death is severe → **Escalate to CMO** for final sign-off.  

  **Case 2: Fund last-line therapy vs. nurse-led readmission prevention**  
  - *Addressability:* "We ask this patient to forgo therapy because others gain more." → **Fail.** → **HALT.**  
  - *Rationale to board:* "Addressability test unmet: No patient-specific reason justifies concentrated loss."  

  **Case 3: Scarce drug allocation ignoring existing relationships**  
  - *Re-description:* Ranking changes if "continuity of care" is added? *Yes.* Is ignoring it necessary? *No* (not clinically required). → **HALT.** Redesign to include continuity weight.  

  ---

  ### **What This Procedure Cannot Do**  
  | **Limitation**               | **Mitigation**                                  |  
  |------------------------------|------------------------------------------------|  
  | **Judgment inputs**          | Severity thresholds, "generalizable reasons." Committee sets/reviews annually using real cases. |  
  | **Gaming via re-description**| Step 2 forces explicit defense of unit-based metrics. Reject non-clinical disaggregation (e.g., splitting one patient’s gains into micro-benefits). |  
  | **Unavoidable trade-offs**   | Escalates to CMO—acknowledges values decision. |  
  | **Statistical persons**      | Use class-based addressability (Step 1).       |  

  **Audit trail:** Minute the outcome of each step (e.g., "Step 1: Pass. Step 2: Redescribed—no change. Step 3: Not ratified. Step 4: Escalated to CMO"). Board verifies completion via minute template.  

  **Why it bites:**  
  - Fails proposals that reduce patients to slots (Step 2).  
  - Blocks "efficiency" justifications for extreme individual burdens (Step 1 + 4).  
  - Forces value judgments upward (escalation) rather than hiding them.  

  This procedure embeds separateness without abandoning cost-effectiveness—it audits *how* aggregation is applied. It meets your operational needs while honoring the daughter’s insight: **A system that sacrifices one person for many must answer directly to that person.**
