  ### Decision Tree for the Semantics and Pragmatics of 'If'

  This decision tree classifies accounts of conditionals by their commitments to concrete cases, avoiding theoretical labels. The spine addresses whether the indicative/subjunctive contrast (e.g., 'if the growth is malignant' vs. 'if the growth were malignant') is a difference in content or merely in what is taken for granted. The tree starts here, as this is the organising question. Subsequent nodes probe diagnostics from eight cases, ordered to first resolve content uniformity, then context sensitivity, logical properties, probability, quantification, and counterfactual phenomena. Each node is a question answerable with first-order logic and elementary probability, without naming principles or theories. Stipulations: 'Truth conditions' are evaluated relative to the context of utterance; 'same conditional' requires identical antecedent and consequent clauses; context sets are fixed for utterance evaluation unless shifted by the conditional itself. 

  I commit to the following node order:
  1. **Same content?** (Case 1: Settling) first, as it directly addresses the organising question.
  2. **Excluded antecedent evaluable without context shift?** (Case 2: Antecedent you rule out) next, as it tests context sensitivity after content uniformity.
  3. **Import-export validated?** (Case 3: Import and export) then, as it examines core logical structure.
  4. **Credence = 0.5?** (Case 5: Chance under known chances) after, as probability interacts with truth conditions.
  5. **Universal quantification?** (Case 6: Indefinite antecedents) follows, as it explores quantificational force.
  6. **Strengthening validated?** (Case 4: Strengthening and sequence) here, as it tests monotonicity after quantification.
  7. **Counterpossible true?** (Case 7: Counterpossibles) then, as it targets vacuity and impossibility.
  8. **Backtracking true?** (Case 8: Backtracking) last, as it assesses causal directionality.

