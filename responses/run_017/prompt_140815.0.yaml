  For the drop-if-losing point: The first grade (redescription invariance) is safest to sacrifice - it's the least controversial and doesn't affect their core argument about robustness.

  Will structure objections from most to least damaging:
  1. Metaphysician's causal exclusion (threatens whole project)
  2. Sympathetic physicist's "added value" challenge (undercuts novelty)
  3. Budget-relativity → instrumentalism slide (epistemic nightmare)  
