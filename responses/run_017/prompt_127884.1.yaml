prompt: |-
  I'm stuck on the intro of a paper about dispositions and I want the spec nailed down before I look at any actual views. What does a theory of what it is for a thing to have a disposition have to deliver? Not more examples of dispositions — the requirements: which cases it has to get right, which distinctions it can't collapse, which constraints it can't violate, with the case or consideration behind each.

  Purpose, so adequacy has something to be relative to: I need the account to do two jobs. First, tell me whether a disposition ascription is true in a concrete setting — the sort engineers and regulators make all the time: this alloy is corrosion-resistant in seawater, this cluster is fault-tolerant, this model is robust to distribution shift. Second, tell me whether ascribing a disposition can ever explain the manifestation, or is always just a redescription of it.

  Cases I want on the list at minimum: the fink (the stimulus destroys the basis), the mask (manifestation blocked, disposition retained), the mimic (no disposition, but on stimulus the manifestation shows up anyway), the antidote (stimulus produces something else entirely), irreducibly chancy manifestations like a radium atom's decaying — what even is the stimulus there, and what is the manifestation condition? — and one-shot dispositions whose exercise destroys or alters the bearer, like fragility, or a self-sealing tyre that manifests by acquiring a mask. Plus two of my own:

  The selective fink. A guardian device repairs the sample only when the impact exceeds a threshold, so below the threshold it shatters and above it doesn't. Is that a disposition with a restricted stimulus condition, a finked disposition, or a disposition whose ceteris paribus clause excludes guardians — and whatever you say, does the theory still handle masks the same way, or does it have to treat the two differently?

  The distributed bearer. A server cluster that's fault-tolerant, or a colony that thermoregulates: no single node has anything like the disposition and the "basis" isn't a microstructure. If the theory needs a categorical basis in the bearer, what's the bearer here and what's the basis?

  For each requirement, say whether it's a genuine desideratum or a prejudice of one camp — I suspect the demand that the ceteris paribus conditions be spelled out in non-dispositional terms is negotiable, and that the demand that dispositions be intrinsic is a camp preference dressed up as data. Flag any pair that can't be jointly satisfied; my guess is you can't have both "handle masks without circularity" and "give necessary and sufficient conditions", but I want to know which other subsets blow up. And name the single requirement that excludes the most candidates. You can score the usual suspects — simple conditional analysis, the revised conditional analysis, mutual manifestation views, dispositional essentialism — in a line each at the end, but the list is what I actually want.
reasoning: |-
  Okay, the user is working on a paper about dispositions and wants to nail down the requirements for any theory of dispositions before examining existing views. They need a clear set of criteria that such a theory must satisfy, including handling various cases and distinctions without collapsing them. The purpose is twofold: first, to determine truth in concrete settings like engineering or regulation, and second, to address whether disposition ascriptions can explain manifestations or just redescribe them.

  The user has listed several key cases that the theory must handle: finks, masks, mimics, antidotes, chancy manifestations, and one-shot dispositions. They also introduced two additional cases: selective finks and distributed bearers. Each of these presents unique challenges. For example, the selective fink involves a guardian device that repairs the sample only above a certain impact threshold, complicating stimulus conditions. The distributed bearer case, like a fault-tolerant server cluster, challenges the need for a categorical basis intrinsic to a single bearer.

  The user wants each requirement to specify whether it's a genuine desideratum or a camp preference. They suspect that demands like non-dispositional ceteris paribus conditions or intrinsic dispositions might be negotiable. They also want to identify any conflicting requirements, such as handling masks without circularity while providing necessary and sufficient conditions. Additionally, they ask which requirement excludes the most theories.

  To structure the response, I'll outline each requirement with its purpose, the underlying case, and whether it's a core need or a preference. Key distinctions include avoiding collapses between cases like finks vs. masks, accommodating probabilistic manifestations, and handling distributed bearers without relying on intrinsic bases. Conflicts might arise between non-circular mask handling and providing necessary and sufficient conditions. The distributed bearer requirement likely excludes many theories that assume intrinsic bases. 

  For existing theories, I'll briefly assess how they fare against these requirements. Simple conditional analysis fails with finks and masks. Revised versions struggle with masks and require non-dispositional terms. Mutual manifestation views handle distribution but face circularity issues. Dispositional essentialism avoids circularity but imposes intrinsicness, conflicting with distributed bearers. The most demanding requirement is handling masks without circularity, as it challenges the core of many theories.
answer: |-
  Here’s a distilled list of requirements for a theory of dispositions, derived from your cases and purposes, with each item specifying: **the requirement**, **the case/consideration motivating it**, **whether it's core or negotiable**, and **key conflicts**. The goal is **empirical adequacy** (handling real-world ascriptions like engineering cases) and **explanatory power** (clarifying if dispositions explain manifestations).

  ---

  ### **Core Requirements (Genuine Desiderata)**
  1. **Handle Finks**  
     - *Case*: Disposition lost *during* stimulus (e.g., wire disconnects when touched, preventing conductivity).  
     - *Requirement*: Distinguish dispositions destroyed *by* their stimulus from those merely unmanifested.  
     - *Status*: **Core** (tests causal fragility).  

  2. **Handle Masks**  
     - *Case*: Disposition present but blocked (e.g., poison masked by antidote; fragile vase wrapped in foam).  
     - *Requirement*: Preserve disposition ascription even when manifestation is prevented externally.  
     - *Status*: **Core** (ubiquitous in real-world applications, e.g., safety testing).  
     - *Conflict*: Clashes with providing **non-circular necessary & sufficient conditions** (see below).  

  3. **Handle Mimics**  
     - *Case*: Manifestation occurs without disposition (e.g., fake diamond shatters on impact due to hidden mechanism).  
     - *Requirement*: Block false positives; not all manifestations imply dispositions.  
     - *Status*: **Core** (prevents anthropomorphism/over-ascription).  

  4. **Handle Antidotes**  
     - *Case*: Stimulus triggers a *different* effect (e.g., poison + antidote causes healing, not death).  
     - *Requirement*: Ensure stimulus *specifically* links to the disposition’s manifestation.  
     - *Status*: **Core** (tests specificity of causal pathways).  

  5. **Accommodate Chancy Manifestations**  
     - *Case*: Radium decay (stimulus? manifestation condition? probabilistic outcome).  
     - *Requirement*: Allow dispositions without deterministic stimulus-manifestation links; clarify what counts as "stimulus" (e.g., passage of time).  
     - *Status*: **Core** (quantum/statistical dispositions are fundamental).  

  6. **Handle One-Shot Dispositions**  
     - *Case*: Fragility (manifestation destroys bearer); self-sealing tire (manifestation alters bearer permanently).  
     - *Requirement*: Allow dispositions whose exercise changes/destroys the bearer.  
     - *Status*: **Core** (many real dispositions are transformative).  

  7. **Resolve Selective Finks**  
     - *Case*: Guardian device repairs sample *only* for high-impact stimuli (low-impact: shatters; high-impact: survives).  
     - *Requirement*: Distinguish this from (a) finks, (b) masks, or (c) restricted stimuli. Must **treat masks and finks distinctly** (e.g., masks preserve dispositions, finks remove them).  
     - *Status*: **Core** (tests stimulus specificity and ceteris paribus clauses).  

  8. **Accommodate Distributed Bearers**  
     - *Case*: Fault-tolerant server cluster (no single node has the disposition; basis is organizational, not microstructural).  
     - *Requirement*: Allow dispositions without intrinsic/categorical bases in a *single* object; explain "bearer" as a system.  
     - *Status*: **Core** (critical for complex systems biology/AI).  

  9. **Ensure Explanatory Power**  
     - *Purpose*: Dispositions must *explain* manifestations, not redescribe them (e.g., "shattered because fragile" ≠ "shattered because it shattered").  
     - *Requirement*: Dispositions should be prior to/independent of their manifestations in causal narratives.  
     - *Status*: **Core** (for scientific usefulness).  

  ---

  ### **Negotiable "Requirements" (Camp-Specific Prejudices)**  
  10. **Non-Dispositional Ceteris Paribus Clauses**  
      - *Demand*: Spell out "all else being equal" without dispositional terms.  
      - *Status*: **Negotiable** (circularity may be unavoidable; see *conflict* below).  
      - *Motivation*: Anti-circularity stance (Lewisian camp).  

  11. **Intrinsicness**  
      - *Demand*: Dispositions must depend only on intrinsic properties.  
      - *Status*: **Negotiable** (excludes relational/systemic dispositions like distributed bearers).  
      - *Motivation*: Reductionist metaphysics (e.g., David Lewis).  

  ---

  ### **Key Conflicts & Trade-offs**  
  - **Masks vs. Non-Circular N&S Conditions**:  
    - *Conflict*: Handling masks requires acknowledging extrinsic blockers, making **non-circular necessary & sufficient conditions impossible** (masks are exceptions to simple rules).  
    - *Resolution*: Most theories drop N&S conditions for a more contextual approach.  

  - **Distributed Bearers vs. Intrinsicness**:  
    - *Conflict*: Intrinsicness excludes systemic dispositions (e.g., server clusters). Sacrificing intrinsicness loses parsimony but gains scope.  

  - **Explanatory Power vs. Redescription**:  
    - *Conflict*: Conditional analyses (e.g., "fragile iff it breaks if struck") invite charges of circularity/redescription.  

  - **Selective Finks vs. Uniform Handling of Masks/Finks**:  
    - *Conflict*: Selective finks blur fink/mask distinctions. A theory must **treat them asymmetrically** (finks remove dispositions; masks suppress manifestations).  

  ---

  ### **The Most Exclusionary Requirement**  
  **Handling masks without circularity** excludes the most theories. It forces abandonment of simple conditional analyses and challenges even "revised" conditionals.  

  ---

  ### **Quick Scorecard of Major Theories**  
  | **Theory**                          | **Fails**                                  | **Handles Well**                     |  
  |-------------------------------------|--------------------------------------------|--------------------------------------|  
  | **Simple Conditional Analysis**     | Finks, Masks, Mimics, Antidotes            | One-shot dispositions (trivially)    |  
  | **Revised Conditional (e.g., Lewis)** | Selective Finks, Distributed Bearers       | Finks (with miracles)                |  
  | **Mutual Manifestations (Molnar)**  | Intrinsicness demand                       | Distributed bearers, Explanatory power |  
  | **Dispositional Essentialism**      | Distributed bearers, Masks (often)         | Chancy dispositions, Intrinsicness   |  

  ---

  ### **Summary of Non-Negotiables**  
  A theory must:  
  1. Distinguish **finks** (disposition lost) from **masks** (manifestation blocked).  
  2. Exclude **mimics** (no disposition → manifestation).  
  3. Accommodate **non-deterministic** and **one-shot** dispositions.  
  4. Resolve **selective finks** without collapsing masks/finks.  
  5. Support **distributed bearers** (no intrinsic basis requirement).  
  6. Grant dispositions **explanatory force** beyond redescription.  

  **The biggest hurdle**: Providing a non-circular account of masks while preserving explanatory power. If your theory cracks this, it outperforms 90% of existing work.
