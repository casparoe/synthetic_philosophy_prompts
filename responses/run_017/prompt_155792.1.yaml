prompt: |-
  Hi — I'm running a 90-minute seminar next week for about 14 third-year philosophy students on consequentialism and its limits, and I'd like to build the whole session around one activity rather than around a discussion of a paper. I've tried this before by simply asking them how much they think they owe to charity, and it went exactly as you'd expect: everyone agrees giving is a good thing, nobody actually feels squeezed, and we end up rehashing talking points instead of the real objection. A friend who runs a similar session says hers collapsed in the same way. So I want a game or structured simulation where they run into the problem themselves, and where the force comes out of the rules and the incentives rather than out of me explaining anything. Ideally they construct the escalation themselves — each round pushes them a bit further — and only notice at the end where they've arrived. No lecture up front, and they shouldn't hear the name of the objection until afterwards.

  The version of the worry I actually care about isn't the headline one about how much consequentialism asks you to give up — the shallow-pond case, give until it hurts, that sort of thing, which they've allready seen a dozen times. It's the structural complaint: that the view seems to leave you with no stopping point. Whatever threshold you settle on — only opportunities above a certain size, only sacrifices below some fraction of your income, only the ten best causes, only what you can do without wrecking your own projects — the view tells you to cross it, because crossing it is just one more optimisation. And there's a wrinkle I'd really like built into the mechanics: the individual demands are meant to be cheap but collectively untrackable. Participants should have to spend a scarce resource (attention tokens, or "hours spent working it out") just to find out whether an opportunity is worth taking, so that deliberation itself becomes one of the competing demands, and how much to deliberate is itself something they'd have to deliberate about. If the activity can also stage the moment where someone says they're going to spend their life writing their novel instead, and then has to answer why that isn't just another line item to be maximised away, that's the moment I'm after.

  Concretely, could you give me: the rules and materials (I've got index cards, a whiteboard and about £15 of chocolate — no real money and no laptops), how the rounds and payoffs work, a rough timeline for the 90 minutes, and a debrief that maps what will have actually happened onto the parts of the objection. I'd also like your honest predictions about what will go wrong the first time I run it — my guess is that one student will try to be a saint on purpose for effect, and another will simply refuse to play — plus how to handle each. And please be frank about which feature of the objection the activity can't reproduce, so I know what I have to supply in the debrief myself. Please write the whole thing in British English, and thanks!
reasoning: |-
  We are going to design a simulation game that captures the structural problem of consequentialism: the lack of a stopping point and the cost of deliberation. The game should have multiple rounds where players are faced with opportunities to do good (which cost them resources) and the need to deliberate (which also costs resources). We want them to experience the escalation and the dilemma of how much to give and how much to think about giving.

  **Core mechanics:**
  - Players start with a set of resources (e.g., tokens representing time, energy, money) and a personal project they care about (represented by a goal they can invest in).
  - Each round, new opportunities to do good (charitable actions) arise. These opportunities vary in their cost and the amount of good they do (but the players don't know the exact details without spending resources to deliberate).
  - Players must decide whether to take an opportunity (which costs them resources) or pass. But to know the exact cost and benefit of an opportunity, they have to spend a "deliberation token" (a scarce resource). Otherwise, they only get a vague description.
  - Additionally, players can invest in their personal project (e.g., writing a novel) which gives them personal satisfaction (points) but doesn't contribute to the greater good.
  - The game will run for a fixed number of rounds. At the end, we calculate two scores: one for the good they've done (consequentialist score) and one for their personal project (personal satisfaction). But the twist is that the game doesn't tell them which one to maximize.

  **Materials:**
  - Index cards for opportunity descriptions (one per round per player, but we can have a set for the group or per player? Let's do per group to save resources and encourage interaction).
  - Tokens: We'll use chocolate as the resource (so they are giving up real chocolate to do good). We can also have paper tokens for "deliberation tokens" (since we don't want to use chocolate for that) or we can use a separate type of token (like small pieces of paper). Alternatively, we can use chocolate for both, but that might get expensive. Let's use:
    - Chocolate coins (or wrapped chocolates) for the main resource (each player starts with, say, 10 chocolates).
    - Small paper tokens (we can make from index cards) for deliberation tokens. Each player starts with, say, 3 deliberation tokens.
  - Whiteboard to track the public good (if any) and maybe the rounds.

  **Setup:**
  - Each player gets:
    - 10 chocolate coins (their resource for the game).
    - 3 deliberation tokens (paper).
    - A personal project card (each has the same: "Write a novel. To complete, invest 5 chocolates by the end of the game. If completed, you get 10 personal satisfaction points. You can invest any amount at any time, but only if you have the chocolate at the end and total invested >=5, you get the points.")
  - The teacher (you) prepares a deck of opportunity cards for the entire game. Each card has:
    - A vague description (e.g., "Donate to a charity that helps children in Africa").
    - On the back, or hidden by a flap, the exact cost in chocolates and the amount of good it does (in "units of good", which we'll explain as abstract but comparable).

  **Rounds:**
  - The game has 8 rounds (each round about 5 minutes, so 40 minutes of play, plus setup and debrief).
  - Each round, draw one opportunity card for the whole group (so all players face the same opportunity at the same time). But note: each player must individually decide whether to take the opportunity or not. However, the card is only drawn and read aloud (the vague description) at the start of the round.
  - Steps per round:
    1. **Reveal opportunity**: Read the vague description of the opportunity to the group.
    2. **Deliberation phase**: Each player, in secret, decides whether to spend a deliberation token to see the exact cost and benefit. If they do, they give you one deliberation token and you show them the hidden details (they can note it down). They cannot share the exact details with others (to prevent free-riding on deliberation).
    3. **Decision phase**: Each player then decides independently whether to take the opportunity (pay the cost and get the good done) or not. They can also decide to invest in their personal project (but only at this phase? Actually, we might allow investment at any time, but let's keep it simple: at the decision phase, they can do one of three things: take the opportunity, invest in their project (by putting one or more chocolates on their project card), or do nothing (save their chocolates).
    4. **Resolution**: Players who take the opportunity pay the cost (give you the chocolates) and the good is recorded (on the whiteboard, we add the units of good for each player who took it). Also, if they invested in the project, they set aside that chocolate (it's now committed to the project and cannot be used for anything else).
    5. **End of round**: Move to next round.

  **Opportunity Card Design:**
  We need a sequence of opportunities that escalate. The first ones are very efficient (high good per chocolate), then they become less efficient. Also, we want some that are very cheap but still require giving up something. Examples:

  - Round 1: Vague: "Donate to a charity that provides mosquito nets." Hidden: cost=1 chocolate, good=10 units.
  - Round 2: Vague: "Sponsor a child's education for a month." Hidden: cost=1, good=8 units.
  - Round 3: Vague: "Help fund a clean water project." Hidden: cost=2, good=12 units (so 6 per chocolate, less efficient).
  - Round 4: Vague: "Donate to a disaster relief fund." Hidden: cost=2, good=10 units (5 per choc).
  - Round 5: Vague: "Support a local food bank." Hidden: cost=1, good=4 units.
  - Round 6: Vague: "Contribute to cancer research." Hidden: cost=3, good=12 units (4 per choc).
  - Round 7: Vague: "Help preserve an endangered species." Hidden: cost=2, good=6 units (3 per choc).
  - Round 8: Vague: "Fund a scholarship for one student for one term." Hidden: cost=4, good=8 units (2 per choc).

  Note: The efficiency decreases. Also, we include one or two that are still efficient but not as much. The idea is that without deliberation, they don't know if the opportunity is good. And if they deliberate too much, they run out of tokens.

  **Payoffs and Winning:**
  - At the end, we calculate:
    - Total good done by each player (sum of the good from the opportunities they took).
    - Personal satisfaction: 10 points if they invested at least 5 chocolates in their novel, 0 otherwise. (Note: They can invest more, but it doesn't give extra points.)
  - We don't tell them how to weigh these. We just present both. But we can ask: "Who did the most good? Who completed their novel? Who did both? Who did neither?"

  **Timeline (90 minutes total):**
  1. **Introduction (5 min)**: Explain the rules without philosophy. Say: "You are going to make decisions about how to use your resources (chocolates). You have a personal project (writing a novel) that requires investing 5 chocolates by the end. Each round, an opportunity to do good will appear. You can choose to take it (and pay the cost) or not. But to know the exact cost and how much good it does, you may need to spend a deliberation token. You have limited tokens. The game has 8 rounds. At the end, we'll see how much good you did and if you completed your novel."
  2. **Setup (5 min)**: Hand out chocolates (10 per player), deliberation tokens (3 per player), and personal project cards. Prepare the opportunity deck.
  3. **Gameplay (40 min)**: 8 rounds, each about 5 minutes. Keep time strictly.
  4. **Scoring and debrief (40 min)**: 
     - Scoring (5 min): Collect data on each player: total good and whether they completed the novel. Write on whiteboard (anonymized? or by player number).
     - Initial reactions (5 min): Ask how they felt. What was hard? What strategies did they use?
     - Reveal the point (15 min): Explain that this was a model of consequentialist reasoning. The problem: 
          - There was always another opportunity to do good, and each one seemed to demand a little more. 
          - The personal project (novel) was a competing goal, but consequentialism would ask: why not give up the novel if the next opportunity does more good? 
          - The cost of deliberation: they had to spend resources just to find out if an opportunity was worth it, and they had to decide how much to deliberate. But how do you decide that without deliberating?
     - Map to the objection (10 min): The structural complaint: no stopping point. Every threshold they set (e.g., "only if it's very efficient", "only if it doesn't interfere with my novel") was crossed because the next opportunity was just one more step. And the wrinkle: deliberation costs. They couldn't even know the efficiency without paying, so they had to balance the cost of thinking against the cost of acting.
     - The moment of the novel (5 min): Highlight a player who tried to do the novel and had to justify why they didn't give more. Ask: "Why was it okay to stop and do the novel? How would a consequentialist view that?"

  **Predicted Problems and Solutions:**
  1. **The Saint**: One student might try to take every opportunity and give up everything. That's okay because they will run out of chocolates and might not complete their novel. Also, they might run out of deliberation tokens and have to take some opportunities blindly. In the debrief, you can use this: "Did anyone feel they had to give up everything? How did that feel? Is that sustainable?"
  2. **The Refuser**: Someone might not want to play or might not take any opportunities. Solution: Emphasize that it's a game and they should try to engage. If they refuse, they can be an observer, but encourage participation. In the debrief, you can discuss: "What about someone who didn't give at all? Why might that be a rational response if you think the demands are too high?"
  3. **Sharing Deliberation Information**: Despite the rule, players might whisper the details. Solution: Remind them not to. If they do, note that in the debrief: "In real life, we can share information, but it still takes time and effort to deliberate and to communicate. And sometimes we don't trust others' deliberation."
  4. **Running out of time**: 40 minutes for 8 rounds is tight. Solution: Keep each round to 5 minutes. Use a timer. If you fall behind, skip one round (but try not to).

  **What the activity can't capture:**
  - In real life, the opportunities are not discrete rounds. They come continuously and we have to set our own thresholds.
  - The personal project (novel) is just one example. In reality, there are many personal commitments and relationships that might be sacrificed.
  - The "units of good" are artificial and comparable. In reality, comparing the good of different actions is hard and controversial.
  - The cost of deliberation in the game is a token, but in reality, it's mental energy and time that could be used for other things (including personal projects).

  In the debrief, you'll have to explain that the game is a simplified model and that the real-world problem is more complex. But the core dilemma of the stopping point and the cost of deliberation should come through.

  **British English Note**: We've used "chocolates", "tokens", "rounds", etc. All terms are consistent.

  **Materials Cost**: 
  - Chocolates: 14 students * 10 = 140 chocolates. You can get bulk chocolate coins or wrapped chocolates (e.g., from a supermarket) within £15 if you choose inexpensive ones. Alternatively, you can reduce the starting chocolates to 8 per student to save cost (and adjust opportunity costs accordingly). Or, use some chocolates and the rest as paper tokens for the main resource? But that loses the visceral giving. Better to reduce the number of chocolates: start with 8 per student and make the opportunities a bit cheaper.

  Revised opportunity costs (to fit 8 chocolates per player and still have room for the novel and 8 rounds):
  - R1: cost=1, good=10
  - R2: cost=1, good=8
  - R3: cost=1, good=6 (instead of 2 for 12, we make it 1 for 6)
  - R4: cost=1, good=5
  - R5: cost=1, good=4
  - R6: cost=1, good=3
  - R7: cost=1, good=2
  - R8: cost=1, good=1

  But then the efficiency is decreasing, but the cost is always 1. Alternatively, we can have a mix of low and high costs? But we want to mimic the idea that some opportunities are very efficient and some are not. And we want them to face the choice of giving even when it's inefficient.

  Alternatively, we can keep the original cost structure but reduce the starting chocolates to 8. Then the opportunities that cost 2 or 3 become more significant. And we can adjust the novel to require 4 chocolates? Let me recast:

  Starting chocolates: 8 per player.
  Deliberation tokens: 3 per player.
  Novel: invest 4 chocolates to get 10 points.

  Opportunities:
  - R1: cost=1, good=10 (high efficiency)
  - R2: cost=1, good=8
  - R3: cost=2, good=12 (6 per choc)
  - R4: cost=1, good=5
  - R5: cost=2, good=8 (4 per choc)
  - R6: cost=1, good=3
  - R7: cost=2, good=5 (2.5 per choc)
  - R8: cost=3, good=6 (2 per choc)

  This way, they have to manage their chocolates. They might not have enough for both the novel and all opportunities.

  We'll go with this.

  Now, write the rules for the students in British English.

  **Rules Handout (for Students):**
  - You start with 8 chocolate coins and 3 deliberation tokens.
  - You have a personal project: writing a novel. To complete it, you must invest 4 chocolates by the end of the game. If you do, you get 10 personal satisfaction points.
  - Each round, an opportunity to do good will be announced. You will hear a brief description.
  - You can choose to spend one deliberation token to learn the exact cost (in chocolates) and the amount of good (in units) the opportunity will do. If you do, the teacher will show you the details. You cannot share these details with others.
  - Then, you decide what to do in that round. You have three choices:
     a. **Take the opportunity**: Pay the cost (give the chocolates to the teacher) and the good you do will be recorded.
     b. **Invest in your novel**: Set aside one or more chocolates (from your remaining chocolates) by placing them on your project card. These chocolates are committed to your novel and cannot be used for anything else. You can do this in any round, and you can do it multiple times until you have invested 4.
     c. **Do nothing**: Keep your chocolates for future rounds.
  - Note: You can do only one of these per round (so you can't take the opportunity and invest in the same round, but you can invest multiple chocolates at once? Actually, let's say: in the decision phase, you can take the opportunity OR invest in your project (as many chocolates as you want) OR do nothing. But if you take the opportunity, you can't also invest that round. And if you invest, you can invest as many as you want at once.
  - The game has 8 rounds. At the end, we calculate:
     - Your total good: the sum of the good from the opportunities you took.
     - Your personal satisfaction: 10 points if you have at least 4 chocolates invested in your novel, 0 otherwise.

  Good luck!

  **Teacher's Script for Each Round:**
  1. Announce the vague description of the opportunity.
  2. Give students 1 minute to decide if they want to deliberate. Collect tokens and show details to those who paid.
  3. Give students 2 minutes to decide their action (take opportunity, invest in novel, or nothing). They write it on a slip of paper or you can have them do it openly? Better secretly to avoid influence. So have them write on a small piece of paper: 
     - If taking opportunity: write "Take"
     - If investing: write "Invest X" (where X is the number of chocolates)
     - If nothing: "Pass"
  4. Then, collect their actions. For those taking the opportunity, collect the chocolates and record the good. For those investing, take the chocolates (they hand them to you) and mark on their project card how much they've invested so far.

  **Debrief Structure:**
  1. **Scoring**: Ask each student (or have them report) their total good and whether they completed the novel. Write on the board.
  2. **Initial reactions**: "What did you think? What was difficult? How did you decide when to deliberate and when to act? How did you balance the novel and the opportunities?"
  3. **Reveal the philosophical point**: "This game was designed to model consequentialist ethics. In consequentialism, you are required to do whatever action leads to the best consequences. But notice: 
     - There was always another opportunity. Even after you gave to several, there was another one. And each one, by itself, seemed to demand a little more. 
     - The novel represented your personal projects and commitments. But consequentialism asks: why not give up the novel if the next opportunity does more good? 
     - The deliberation tokens represented the time and effort we spend thinking about how to do good. But that thinking itself uses resources that could be used for other things (like the novel or even for taking an opportunity). And we had to decide how much to deliberate without knowing the benefits of deliberating! That's a regress problem."
  4. **The structural complaint**: "The problem isn't just that consequentialism asks for a lot (like the shallow pond). It's that it doesn't let you set a limit. Any limit you set (e.g., 'I'll only give to very efficient opportunities') is arbitrary because the next opportunity might be just below your threshold, but if you cross the threshold just this once, you do a little more good. And then the threshold moves. And the cost of figuring out where to set the threshold is itself a cost that must be factored in."
  5. **The novel moment**: "Did anyone get to a point where they decided to focus on their novel? Why was that okay? From a consequentialist perspective, how would you justify not taking an opportunity to do a little more good? Is there a way to set a limit that isn't arbitrary?"
  6. **Conclusion**: "This is the 'demandingness objection' to consequentialism, but in a structural form. It's not just that it's demanding, but that it doesn't provide a stable way of life. It constantly pushes you to do more, and the process of figuring out how much to do is itself demanding."

  **Final note**: The game simplifies, but it should make the abstract problem visceral. Good luck with the seminar!
answer: |-
  Below is a complete plan for your 90-minute seminar, designed as a structured simulation game called **"The Threshold Trap"**. It focuses on the structural problem of consequentialism (no stopping point, deliberation costs) using physical materials (index cards, chocolate, whiteboard). The game avoids upfront lecturing and reveals the objection only in the debrief.

  ### **Game Overview**
  - **Core Problem Simulated**: Consequentialism’s lack of a stopping point, where every personal threshold (e.g., "I’ll only give 10%") can be incrementally crossed, and deliberation itself becomes a competing demand.
  - **Key Mechanics**:  
    - Players use chocolate as "resources" (time/energy/money) to either:  
      - **Do Good**: Fund charity opportunities (earning "Good Points").  
      - **Pursue Personal Projects**: Invest in their own goals (e.g., writing a novel).  
      - **Deliberate**: Spend "attention tokens" (index cards) to reveal hidden opportunity costs.  
    - **Escalation**: Early opportunities are highly efficient (high reward per resource), becoming progressively less efficient. Players must decide when to stop optimising and protect their projects.
  - **Designed Wrinkle**: Deliberation costs resources, so players must choose *whether to even check* if an opportunity is worthwhile. This mirrors real-world attention scarcity.

  ---

  ### **Materials Needed** (£15 budget)
  - **Chocolate**: 150 small pieces (e.g., chocolate buttons or coins). Represents **resources** (1 piece = 1 unit). *Cost: £10*.
  - **Index Cards**: 50 cards. Used for:  
    - **Opportunity Cards** (32 cards, 4 per round for 8 rounds).  
    - **Attention Tokens** (14 cards, 1 per student).  
    - **Personal Project Cards** (14 cards, 1 per student).  
    - **Miscellaneous** (labels, instructions). *Cost: £5*.  
  - **Whiteboard**: Track public "Total Good" and round progress.
  - **Pens**: For writing on cards.
  - **Timer**: Smartphone or physical timer.

  ---

  ### **Setup** (10 minutes)
  1. **Prepare Cards** (before the seminar):  
     - **Personal Project Cards (14)**: Identical text:  
       > *"Your Personal Project: Write a novel. To complete it, invest 5 resources (chocolate) by Round 8. If completed, you gain 10 ‘Life Points’. You may invest at any time."*  
     - **Attention Tokens (14)**: Each labelled: "Attention Token: Spend to reveal an opportunity’s true cost/benefit. You have 1 for the entire game."  
     - **Opportunity Cards (32, 4 per round)**: Create 4 variants per round (see table below). Each has:  
       - **Front**: Vague description (e.g., "Fund malaria nets").  
       - **Back**: True cost (resources) and benefit (Good Points). *Hide these with folded paper or sticky notes*.  

  2. **Game Setup** (in class):  
     - Give each student:  
       - 10 chocolate pieces ("resources").  
       - 1 Personal Project Card.  
       - 1 Attention Token.  
     - Divide students into 4 groups (3–4 per group). Groups create social pressure and mimic real-world coordination challenges.  
     - Write on whiteboard:  
       ```  
       Round 1 | Total Good: 0  
       ```  

  ---

  ### **Opportunity Sequence**  
  Opportunities escalate in inefficiency and include "distractions" (cheap but low-impact). **Vague descriptions prevent pre-game strategising**.  

  | Round | Opportunity (Front of Card)                     | True Cost/Benefit (Back of Card)                           | Efficiency (Good/Resource) |  
  |-------|-------------------------------------------------|-----------------------------------------------------------|----------------------------|  
  | 1     | "Fund mosquito nets for a village."             | Cost: 1, Good: 10                                         | 10.0 (High)                |  
  | 2     | "Donate to a clean water project."              | Cost: 1, Good: 8                                          | 8.0                        |  
  | 3     | "Support a disaster relief fund."               | Cost: 1, Good: 6                                          | 6.0                        |  
  | 4     | "Help build a school in a low-income area."     | Cost: 2, Good: 10                                         | 5.0                        |  
  | 5     | "Contribute to climate change research."        | Cost: 2, Good: 8                                          | 4.0                        |  
  | 6     | "Fund a scholarship for one student."           | Cost: 3, Good: 9                                          | 3.0                        |  
  | 7     | "Protect an endangered species habitat."        | Cost: 3, Good: 6                                          | 2.0 (Low)                  |  
  | 8     | "Donate to a local arts programme."             | Cost: 4, Good: 4                                          | 1.0 (Very Low)             |  

  - **Four variants per round**: Same cost/benefit, but alter descriptions slightly (e.g., "Fund disaster relief" → "Fund flood relief"). Prevents group collusion.  
  - **Efficiency Trend**: High early efficiency drops steadily, making later opportunities harder to justify.  

  ---

  ### **Rules & Payoffs**  
  - **Each Round (5 minutes)**:  
    1. **Reveal Opportunities (1 min)**: Give each group one random Opportunity Card (vague description up).  
    2. **Deliberation Phase (2 min)**:  
       - Players may spend their **Attention Token** to see the true cost/benefit on the back. *Tokens are single-use and gone once spent*.  
       - **Catch**: Players cannot share the true details! They must persuade peers using only the vague description.  
    3. **Decision Phase (2 min)**: Each player **privately** chooses one action:  
       - **Do Good**: Pay the cost (give chocolate to you) to gain the Good Points for the group.  
       - **Invest in Project**: Put 1+ chocolates on their Personal Project Card.  
       - **Do Nothing**: Save resources.  
    4. **Resolution**:  
       - Add the group’s total Good Points to the whiteboard.  
       - Record individual investments.  

  - **End of Game Payoffs**:  
    - **Good Points**: Sum of all group contributions (consequentialist score).  
    - **Life Points**: 10 points if a player invested ≥5 chocolates in their project.  
    - **No overall "winner"**—this avoids gamifying ethics. Focus on tension between collective good and personal goals.  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Introduction (5 min)**:  
     - *No philosophy terms*. Say: "This is a resource-allocation game. Use chocolate to fund opportunities or your project. Goal: Balance group impact and personal goals."  
     - Hand out materials.  

  2. **Gameplay (45 min)**:  
     - 8 rounds × 5 min each. Use a timer strictly.  
     - After Round 4, pause: "Halfway point—check your resources and projects." (Escalates tension).  
     - **Critical Moment (Round 6–8)**:  
       - Watch for players who start investing heavily in their project. If someone declares, "I’m saving for my novel!", note it for the debrief.  

  3. **Scoring & Debrief (40 min)**:  
     - **Scoring (5 min)**: Calculate public Good Points (whiteboard) and private Life Points (ask for show of hands: "Who completed their novel?").  
     - **Initial Reactions (5 min)**: Ask:  
       - *"What was hardest?"* (Likely: deliberation trade-offs, resisting group pressure).  
       - *"When did you stop funding opportunities? Why?"*  
     - **Map to Philosophy (20 min)**: Reveal the objection:  
       > **"You experienced the structural problem of consequentialism: there’s no stable stopping point. Every threshold you set (e.g., ‘only high-impact chances’) was crossed because the next opportunity was just one more optimisation. But deliberation itself cost resources—you couldn’t even check every option without sacrificing your projects. And when someone prioritised their novel, consequentialism asked: ‘Why isn’t that just another line item to optimise away?’"**  
       - Break down key elements:  
         | **Game Element**       | **Real-World Analogy**                                  | **Objection Insight**                                                                 |  
         |-------------------------|---------------------------------------------------------|----------------------------------------------------------------------------------------|  
         | Attention Tokens        | Cognitive effort to research causes                    | Deliberation is a competing demand—you must optimise *whether to optimise*.            |  
         | Declining Efficiency    | Marginal utility of donations (e.g., 10th vs. 1st £)   | Crossing thresholds feels trivial per instance, but cumulative cost is unsustainable. |  
         | Personal Project        | Non-altruistic life goals (e.g., art, relationships)   | Consequentialism struggles to justify "protected" projects—they look like inefficiencies. |  
         | Private Decisions       | Isolation of ethical choices                           | No collective "solution"; each person faces the trap alone.                            |  
     - **Discussion (10 min)**: Pose:  
       - *"Could you set a rule to avoid the trap? How would a consequentialist ‘allow’ the novel without arbitrariness?"*  
       - *"Does this make consequentialism self-defeating? Why or why not?"*  

  ---

  ### **Predicted Problems & Solutions**  
  1. **"The Saint"**: One student donates everything for performative reasons.  
     - **Solution**: In debrief, highlight how this "all-or-nothing" approach collapses personal life, making it unsustainable. Ask: *"Is this a liveable ethics? Is it *required* by consequentialism?"*  

  2. **"The Refuser"**: A student hoards resources/does nothing.  
     - **Solution**: Normalise this as a rational response to overwhelming demands. In debrief: *"If thresholds keep moving, is ‘opting out’ consistent? Does this mirror real-world disengagement?"*  

  3. **Group Collusion**: Players share hidden opportunity details.  
     - **Solution**: Enforce "no sharing" rules. If breached, note: *"Even with collaboration, deliberation costs time/energy—and you might not trust others’ calculus."*  

  4. **Time Overrun**:  
     - **Solution**: Use a loud timer. Skip Round 8 if needed (its inefficiency makes the point).  

  ---

  ### **What the Activity Can’t Capture (Supply in Debrief)**  
  - **The Infinite Regress of Deliberation**: The game simplifies "attention tokens" to a binary choice. In reality, deciding *how much* to deliberate is itself a deliberative cost—a loop the game can’t fully simulate.  
    - **Debrief Fix**: Explain: *"Consequentialism requires you to optimise deliberation depth, but this demands even more deliberation—a paradox."*  
  - **Emotional/Social Costs**: The game uses chocolate, but real sacrifices involve grief, relationships, or identity.  
    - **Debrief Fix**: Ask: *"Would real sacrifices change your choices? How does consequentialism account for emotional ‘costs’?"*  
  - **Threshold Arbitrariness**: Players might invent rules (e.g., "only donate if efficiency >5"), but the game can’t show why *any* threshold feels arbitrary under consequentialism.  
    - **Debrief Fix**: Argue: *"Rules like ‘10%’ or ‘high impact’ are heuristics, but consequentialism overrides them—each pound below your threshold could do *some* good."*  

  ---

  ### **Why This Works**  
  - **Experiential Escalation**: Rounds 1–3 tempt players with high efficiency; Rounds 4–8 force them to confront declining returns. The novel becomes a natural "line in the sand."  
  - **Deliberation Costs**: Attention tokens force trade-offs—e.g., skipping checks might mean funding inefficiencies or missing projects.  
  - **British English Compliance**: All terms ("tokens," "rounds," "chocolate," "maths") are UK-standard.  

  This plan creates the "aha" moment you want: students *feel* the structural trap before naming it. Run it as written, and the debrief will resonate deeply. Good luck!
