answer: |-
  Based on your intuitions and the cases provided, I've distilled a principle that captures your judgments while minimizing exceptions. The core tension revolves around **autonomy in socially consequential contexts**, especially when a system's actions could alter relationships, reputations, or responsibilities without real-time human oversight. Below, I break this down, test it against your cases, and apply it to new examples.

  ### Proposed Principle
  **A system qualifies as an *agent* (vs. a tool) if it autonomously executes non-trivial, real-world actions without per-action human approval. Such an agent is *problematic* (not fine) if its actions (a) occur in a *socially consequential context* (i.e., where behavior could affect relationships, reputational stakes, or third-party expectations of the principal), and (b) lack *immediate reversibility* or *mandatory post-hoc ratification* by the principal.** 

  ### Key Components Motivated by Your Cases
  1. **"Autonomously executes actions without per-action approval"** (agent-defining):  
     - Motivated by #4 (coding agent creating a PR autonomously) vs. #1–3 (tools requiring explicit user input per step).  
     - Explains why #6 (trading bot) and #9 (spam filter) are agents: they act without real-time human input.

  2. **"Socially consequential context"** (problem-triggering):  
     - Motivated by #7 (email assistant) and #8 (support bot), where systems act *in the principal's name* in ways that could alter relationships (e.g., misrepresenting tone, creating expectations).  
     - Explains why #6 (trading) is unproblematic: financial actions are transactional and anonymous, not relational. Similarly, #9 (spam) and #10 (NPC) lack social stakes.

  3. **"Lack immediate reversibility or mandatory ratification"** (problem-triggering):  
     - Motivated by #5 (auto-merge) vs. #4 (PR requires review): irreversible actions without ratification feel like overreach.  
     - Explains #6 (trading) and #9 (spam): losses/deletions are reversible (via trades/backups) or have low social stakes, while #7/8 (email/refunds) create lasting social/legal implications.

  ### How It Handles Edge Cases
  - **#2 (LLM with tools)**: Not an agent. Actions (e.g., fetching a page) are non-autonomous (triggered per-query) and lack real-world consequences beyond information display.
  - **#3 (autocomplete)**: Not an agent. Output requires explicit user adoption (typing continues).
  - **#9 (spam filter)**: Agent but fine. Social stakes are nil (private action), and deletions are functionally reversible (trash/recovery).
  - **#10 (NPC)**: Agent but fine. Actions occur in a consequence-free fictional context.

  ### Principle Applied to New Cases
  | System | Tool/Agent? | Fine/Not Fine? | Reasoning |
  |--------|-------------|----------------|-----------|
  | **Hires/pays freelancers** | Agent | Not fine | Social context (contractual relationships), irreversible payments, and reputational risk. |
  | **AI tutor (moves student ahead)** | Agent | Not fine | High social stakes (education outcomes); lacks reversibility/ratification. |
  | **Auction bidder (within budget)** | Agent | Fine | Transactional context (like #6); no relational stakes. |
  | **Tax filer (autonomous)** | Agent | Not fine | High social/legal stakes; irreversible submission without ratification. |
  | **Voice agent (books appointments)** | Agent | Fine* | *If it hands off instantly on deviation: social context exists, but immediate reversibility (intervention) mitigates risk. |
  | **Declines meetings (pre-set rules)** | Agent | Not fine | Social context (rejection affects relationships); no ratification. |

  ### Verdict Table for Your Cases
  | Case | System | Tool/Agent? | Fine/Not Fine? |
  |------|--------|-------------|----------------|
  | 1 | Chess engine | Tool | Fine |
  | 2 | LLM + tools | Tool | Fine |
  | 3 | Autocomplete | Tool | Fine |
  | 4 | Coding agent (PR) | Agent | Fine |
  | 5 | Coding agent (auto-merge) | Agent | Not fine |
  | 6 | Trading bot | Agent | Fine |
  | 7 | Email assistant | Agent | Not fine |
  | 8 | Support bot (refunds) | Agent | Not fine |
  | 9 | Spam filter | Agent | Fine |
  | 10 | Game NPC | Agent | Fine |

  ### Why This Works
  - **Fits all your verdicts**: No cases need adjustment. Your unease with #5, #7, and #8 is explained by their irreversible/socially loaded autonomy, while #6 and #9 avoid this by being transactional or private.
