prompt: |-
  I lead a four-person data-viz team at a national health department. We push out maybe thirty graphics a month — leaflets for clinics, posters, social cards, a couple of interactive dashboards — for a public with patchy literacy and three official languages, and lately also audio versions for people who get their information by phone message. Sign-off is our comms director plus whichever epidemiologist is on rotation, we get about half an hour of thinking time per graphic, and nobody here has any philosophy background.

  I've been reading about Otto Neurath and the ISOTYPE picture language he built in Vienna in the 1920s and 30s, and it keeps feeling like it was wrote for exactly our problem: show quantity by repeating a same-sized symbol, never by making the symbol bigger; avoid perspective, because it wrecks comparison; symbols are conventions people have to be taught, not naturally obvious; and pictures are a helping language, never a replacement for words, because a picture can't really carry negation, conditionals, or other logical relations. Plus the bit I find strangest: that a lot of our basic categories — unemployment, the working class, maybe even something as plain as dog — are irreducibly fuzzy clumps that you can draw but can't pin down exactly, and that a picture language should own that fuzziness instead of pretending to be precise.

  Can you turn that into an actual pass/fail procedure we could run on a draft? Questions in the order they'd come up, what counts as a good enough answer to each, where it hard-stops with a no, and where it has to hand the call back to a person because it's a values question rather than a design question. Then run it on three things we're arguing about right now: one, a district map of maternal deaths with circles sized by rate and coloured on a red ramp; two, our flagship vaccination dashboard, where the user can rescale the axis and filter by region themselves; three, a one-page leaflet explaining who qualifies for free care — you qualify if you're pregnant, or over 65, or you have a chronic condition — which we really wanted to make picture-first, because the words are the dificult part for our readers. Give me the unwelcome answers too, not a compromise.

  Also be clear about which rules are really Neurath's and which are you stretching him to cover screens, interactivity and audio, say where the procedure will misfire on our kind of work, and tell me how confident you are in each piece — and single out the thing you're least sure of, since I can't check the sources myself.
reasoning: |-
  Okay, let me approach this systematically. The user leads a public health data visualization team facing complex communication challenges: low literacy audiences, multiple languages, tight deadlines. Their discovery of Otto Neurath's ISOTYPE principles seems revelatory - they're specifically asking for a practical pass/fail framework based on these ideas to evaluate their current projects.

  First, I need to distill Neurath's core tenets into actionable questions. The key elements mentioned are: consistent symbol sizing for quantities, avoidance of perspective, acknowledgment of symbols as learned conventions, pictures as supplementary to text, and embracing categorical fuzziness. But I must also consider how these 1930s print-based principles translate to modern digital contexts like interactive dashboards and audio formats.

  For the evaluation framework, I'm considering structuring it as a sequential checklist with clear decision points:
  - Early questions about symbolic representation and scaling
  - Middle section on textual support and categorical honesty
  - Final considerations about audience appropriateness

  The three test cases present distinct challenges:
  1) The choropleth map with sized circles likely violates multiple ISOTYPE rules about proportional representation
  2) The interactive dashboard introduces user control that Neurath couldn't anticipate
  3) The eligibility leaflet's "picture-first" approach directly contradicts Neurath's text-first principle

  I'm particularly uncertain about applying the "no perspective" rule to modern map visualizations - while Neurath was thinking of pictorial perspective, today's map projections involve mathematical distortions that might warrant different consideration. Also, the categorical fuzziness concept feels philosophically sound but tricky to implement as a practical design test.

  For each evaluation, I'll need to:
  - Identify clear violations of core principles
  - Note where modern contexts require interpretation
  - Provide unambiguous pass/fail judgments as requested
  - Flag value decisions requiring human judgment

  The framework should acknowledge its own limitations - where ISOTYPE's print-centric, didactic approach might clash with modern interactive or audio formats. The maternal deaths map will likely fail hardest, while the dashboard might pass with caveats about user control. The leaflet presents the most interesting tension between accessibility goals and Neurath's principles.
answer: |-
  Here's a Neurath-inspired pass/fail procedure tailored to your context, followed by blunt assessments of your three projects. **Core Neurath Rules** are marked (N), **Adaptations/Extensions** for modern contexts are marked (A), and **Confidence Levels** (High/Med/Low) are noted throughout.

  ---

  ### The ISOTYPE Pass/Fail Procedure for Health Comms Graphics
  **(Run sequentially - fail any step = graphic fails procedure)**

  1.  **"Is quantity shown ONLY by repeating identical symbols (not by resizing, perspective, or 3D effects)?"**
      *   *Good Enough:* Identical symbols (e.g., people, syringes, houses) used consistently. Minor variations for clarity (e.g., color for categories) are acceptable *if* they don't imply size difference. Overlapping symbols used minimally and carefully.
      *   *Hard Stop (Fail):* Resized circles/bars used as the *primary* method to show quantity. 3D effects, perspective tricks, or graduated symbol sizes (N). Conflicting size cues within the graphic (A).
      *   *Confidence:* **High** (Core Neurath principle, clear visual test).

  2.  **"Are symbols/pictograms used as *conventions*, not attempts at realistic art (perspective, shading, fine detail)? Are they consistently designed?"**
      *   *Good Enough:* Simple, flat, stylized, consistently designed symbols from a defined set. Minimal detail, no perspective shading. Recognizable *after* brief learning/context (N/A).
      *   *Hard Stop (Fail):* Photographs, realistic illustrations with perspective/shading, highly detailed or inconsistent symbols. Symbols trying to be "intuitively obvious" without context (N).
      *   *Confidence:* **High** (Core Neurath principle, clear visual test).

  3.  **"Is the picture language *supplemented* by necessary words/text (titles, labels, key terms), especially for logical operations (negation, conditionals), categories, and precise values?"**
      *   *Good Enough:* Essential text is present and legible. Key concepts (qualifications, rates, exclusions) are clearly stated in words *alongside* symbols. Audio descriptions fully cover logical nuances missing visually (A).
      *   *Hard Stop (Fail):* Attempts to convey negation ("not eligible"), conditionals ("if...then"), complex logical relationships, or precise numerical values *solely* through pictures/symbols. Text is absent, illegible, or an afterthought (N/A). Audio fails to explain logical nuances present visually (A).
      *   *Confidence:* **High** (Core Neurath principle - "helping language, never a replacement for words").

  4.  **"Does the graphic *acknowledge* or avoid implying false precision for fuzzy categories (e.g., 'chronic condition', 'working class', even 'dog')?"**
      *   *Good Enough:* Symbols represent categories understood as approximations/ranges. Text clarifies fuzziness where critical (e.g., "includes conditions like..."). Avoids visuals suggesting sharp, unambiguous boundaries where none exist (e.g., distinct boxes for inherently overlapping groups) (N/A).
      *   *Hand Back to Human (Values/Context):* How explicitly *must* fuzziness be shown? Is the chosen symbol acceptable *enough* for this category in *this* cultural/health context? (e.g., Is a simple "person" icon sufficient for "patient with chronic condition", or does it mislead?).
      *   *Confidence:* **Medium** (Philosophically core to Neurath, but application is interpretive and context-dependent. The *intent* to avoid false precision is key).

  5.  **"Is the graphic designed for *teaching* the convention first, assuming symbols need to be learned, not innately understood?" (A - Adaptation for modern context & low literacy)**
      *   *Good Enough:* Graphic includes a clear key/legend. Symbols are introduced consistently over time/campaigns. Simpler symbols chosen where possible. Accompanying text/audio actively *explains* the symbol meaning initially. Tested with target audience for learnability.
      *   *Hand Back to Human (Design/Context):* Is the learning curve acceptable for this medium and audience urgency? Are the chosen symbols the *most* learnable options available? Is sufficient repetition/context provided?
      *   *Confidence:* **Medium** (Neurath assumed teaching, but modern speed & low literacy amplify this need. Defining "good enough" learnability is contextual).

  6.  **"Does the graphic avoid distortions that wreck quantitative comparison (perspective, isometric axes, misleading baselines)?" (N/A - Combines Neurath core & modern best practice)**
      *   *Good Enough:* Axis baselines start at zero for bar charts representing full quantity. Maps use appropriate, undistorted projections where area comparison matters. Charts avoid perspective or false 3D skewing lengths/areas. Interactivity (A) allows honest comparisons (e.g., maintaining consistent scales).
      *   *Hard Stop (Fail):* Truncated axes distorting magnitude comparisons. Pie charts in 3D/perspective. Maps with highly distorted projections used for area comparisons. Interactive controls allowing misleading axis rescaling *without* clear safeguards (A).
      *   *Confidence:* **High** for static elements (Core Neurath + Visualization 101). **Medium** for interactive safeguards (A - Interpretation needed on "clear safeguards").

  ---

  ### Where the Procedure Misfires for Your Work

  1.  **Speed & Scale (30 graphics/30 mins):** Neurath's ISOTYPE involved meticulous design and teaching campaigns. This procedure is idealistic vs. your reality. Expect many "fails" – it's a *standard*, not always achievable. Use it strategically on high-impact pieces.
  2.  **Interactivity (A):** Neurath designed static exhibits. Rules 1 (resizing), 3 (supplementing words), and 6 (comparison) need adaptation. User control *can* violate principles (e.g., rescaling axes).
  3.  **Audio-Only (A):** Neurath was visual. Rule 3 (supplementing logic with words) becomes paramount. Symbolic audio equivalents (e.g., chimes for counts) need careful teaching (Rule 5).
  4.  **Complex Health Concepts:** Fuzzy categories (Rule 4) are endemic ("chronic condition", "access", "vulnerable"). The procedure flags the issue but forces a tough human decision.
  5.  **"Values Questions" (Rules 4 & 5):** Prioritizing learnability vs. speed, acknowledging fuzziness vs. simplicity – these are team/org value calls the procedure surfaces but can't resolve.

  ---

  ### Assessment of Your Current Projects

  **1. District Map: Maternal Deaths (Circles sized by rate, colored on red ramp)**

  *   **Rule 1 (Quantity by Repeating Symbols):** FAIL. Uses resized circles as the primary quantity method. Neurath's biggest taboo.
  *   Rule 2 (Symbol Convention): PASS (Assuming standard map/circle conventions are established).
  *   Rule 3 (Supplement with Words): PASS (Labels, legend, title likely present).
  *   Rule 4 (Fuzzy Categories): PASS (District is precise; "maternal death" definition is standardized medically, if not culturally).
  *   Rule 5 (Designed for Teaching): PASS/FAIL? (Hand Back). Depends on audience familiarity with choropleth/symbol maps. Low-literacy audiences often struggle with maps.
  *   Rule 6 (Avoid Distorting Comparison): FAIL (Sized circles on maps are notoriously hard to compare accurately, especially at different locations/sizes. Area perception is non-linear. Red ramp might imply ordinal severity well, but circle size comparison is flawed).
  *   **OVERALL:** **FAIL** (Hard fails on Rule 1 & likely Rule 6). Neurath would demand repeating identical mother/child symbols within each district (likely impractical) or a different chart type (e.g., bar chart by district).

  **2. Flagship Vaccination Dashboard (User rescales axis, filters by region)**

  *   Rule 1 (Quantity by Repeating Symbols): PASS/FAIL? (A - Hand Back). Depends *entirely* on the chart types used *within* the dashboard. If it uses bars (length, not area/size) or repeated symbols, PASS. If it uses pies, sized bubbles, or 3D charts, FAIL.
  *   Rule 2 (Symbol Convention): PASS (Assuming standard UI and charting symbols).
  *   Rule 3 (Supplement with Words): PASS (Critical for labels, filters, axis titles).
  *   Rule 4 (Fuzzy Categories): PASS (Regions, vaccine doses are precise).
  *   Rule 5 (Designed for Teaching): PASS/FAIL? (Hand Back). Does it teach the dashboard conventions? Is there onboarding? This is crucial for low-literacy users facing interactivity.
  *   **Rule 6 (Avoid Distorting Comparison):** **MAJOR RISK (A - Potential FAIL).** Allowing users to rescale axes is Neurath's nightmare. It *invites* misleading truncation or inflation of trends. If the Y-axis can start above zero without clear warnings/lockable defaults, this is a FAIL. Filtering is generally acceptable (A) if comparisons remain valid (consistent scales).
  *   **OVERALL:** **CONDITIONAL PASS / HIGH RISK.** It *can* pass if: 1) Base charts follow Rules 1 & 2. 2) Axis rescaling has strong safeguards (e.g., zero baseline locked by default, clear warnings when changed, prominent scale indicator). 3) Teaching (Rule 5) is addressed. Neurath would be deeply skeptical of user-controlled axis scaling.

  **3. Free Care Eligibility Leaflet (Picture-First, Qualifiers: Pregnant, 65+, Chronic Condition)**

  *   **Rule 1 (Quantity by Repeating Symbols):** PASS (Not primarily about quantity).
  *   Rule 2 (Symbol Convention): PASS (Assuming simple pictograms).
  *   **Rule 3 (Supplement with Words):** **HIGH RISK (Likely FAIL).** This is the core Neurath conflict. Your intent ("picture-first because words are hard") directly contradicts his principle ("pictures are a helping language, never a replacement for words"). Can pictograms alone *reliably* convey the logical OR between categories? Can they define "chronic condition" without text? Negation ("if NOT in these groups, you do NOT qualify") is nearly impossible purely visually. Audio *must* carry the full logical nuance.
  *   Rule 4 (Fuzzy Categories): **HIGH RISK (Hand Back / Potential FAIL).** "Chronic condition" is inherently fuzzy. A single pictogram (e.g., person with a heart?) will be exclusionary or misleading. How is fuzziness acknowledged?
  *   Rule 5 (Designed for Teaching): **CRITICAL (Hand Back).** Success *absolutely* depends on teaching these specific symbols *intensively* beforehand and within the leaflet. Is that feasible? Will it be done?
  *   Rule 6 (Avoid Distorting Comparison): PASS (Not applicable to core message).
  *   **OVERALL:** **HIGH FAIL RISK.** Neurath would insist words ("Pregnant?", "65 or older?", "Diagnosed with a long-term illness?") are the *primary* carriers of the logical structure and definitions, with symbols *alongside* as reminders/illustrations. A purely "picture-first" approach for complex eligibility logic violates his core tenet (Rule 3). Success hinges entirely on exceptional execution of Rule 5 (teaching symbols) and Rule 4 (handling fuzziness) with strong supporting audio/text, making the "picture-first" goal arguably counterproductive.

  ---

  ### Least Confident Piece: Rule 4 (Fuzzy Categories)

  *   **Confidence: Low-Medium.** While Neurath explicitly acknowledged the fuzziness of social categories ("unemployment", "working class"), translating this into a practical, actionable design rule for health categories ("chronic condition", "vulnerable", "access") is incredibly difficult. The *intent* (don't pretend false precision) is clear, but the *application* is highly subjective:
      *   How fuzzy is too fuzzy?
      *   How *must* the fuzziness be visually acknowledged without confusing the audience?
      *   When is a symbol "good enough" vs. actively misleading?
      *   This rule relies heavily on the "Hand Back to Human" aspect because it's deeply contextual and value-laden (precision vs. simplicity vs. inclusivity). The procedure flags the *need* for the discussion but provides less concrete design guidance than the others.
