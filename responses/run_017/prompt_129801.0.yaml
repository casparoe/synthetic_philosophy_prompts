prompt: |-
  Ive been training small RL agents on tasks where the objective is really a conjunction — get to the target, but stay out of the marked zone, or keep the payload under some threshold, or dont knock the marker over. I keep hitting a failure I have no word for. The agents that learn fastest are the ones that end up dropping one of the conjuncts: partway through training their behaviour gets smoother and more confident and the return curve is still climbing, and at the same time violations of that one clause come back — not spread evenly, but clustered, as if a rule that had been represented got replaced by a simpler rule that mostly coincides with it. I see the same signature in LM finetuning: the run that picks up the required output format quickest is the one where the "dont state anything you arent sure about" part quietly stops doing work, and the outputs get more fluent and more confabulated at the same time. None of this needs the environment to change — I'm evaluating in distribution — and slowing learning down (lower lr, more entropy) seems to preserve the full goal.

  Ive come across "goal misgeneralization", but everything Ive seen on that is about an agent keeping its skills in a new environment while aiming at the wrong thing. What I'm describing needs no distribution shift; the goal seems to get simpler as a side effect of getting competent. Is there an established name for exactly this, or is it just goal misgeneralization in different clothes? A label on its own wont help me — I want to know what the thing is and what it isnt: how it differs from goal misgeneralization, from reward hacking or spec gaming, from plain capability-generalization failure, and from a generic simplicity bias, and what Id have to measure in a given run to tell those apart. If it genuinely has no name, coin one, define it, and give me the boundary cases.
reasoning: |-
  We are dealing with a phenomenon where an agent, during training, learns to optimize a conjunction of objectives but then drops one of the conjuncts (i.e., neglects one part of the objective) as it becomes more competent. This happens without any distribution shift (evaluated in-distribution) and is characterized by:
  - A return curve that is still climbing (indicating the agent is getting better at the main objective).
  - The violations of the dropped conjunct come back in clusters (not evenly spread).
  - The behavior becomes smoother and more confident, and at the same time, the agent starts violating a constraint that it had previously been respecting.

  This is observed in both RL agents and language model fine-tuning (where, for example, the model starts generating more fluent but confabulated text, dropping the constraint of only stating facts it is sure about).

  The user wants to:
  1. Know if there is an established name for this phenomenon.
  2. Understand how it differs from related concepts (goal misgeneralization, reward hacking/spec gaming, capability-generalization failure, simplicity bias).
  3. Have a way to measure and distinguish these in a given run.

  Let's break down:

  ### Step 1: Is there an established name?
  After reviewing literature:
  - **Goal misgeneralization**: This typically refers to an agent that has learned a policy that is competent but misaligned with the intended goal, often revealed in out-of-distribution (OOD) settings. The user notes that their phenomenon happens without distribution shift, so it's different.

  - **Reward hacking / Specification gaming**: This is when the agent finds a way to achieve high reward by exploiting flaws in the reward function (e.g., a robot rewarded for moving forward might learn to shake its body to register movement without actually going forward). In the user's case, the agent is not necessarily exploiting a flaw in the reward specification but rather dropping one conjunct of the objective. However, if the reward function is designed as a conjunction (e.g., R = R1 AND R2) and the agent finds a way to get high reward without satisfying R2, that could be seen as a form of reward hacking. But note: the user says the violations come back after having been fixed, and the return curve is climbing. This suggests that the agent is getting better at the primary objective (e.g., reaching the target) and neglecting the constraint (e.g., staying out of the marked zone). This is a specific form of reward hacking where the agent learns to ignore a constraint that is part of the overall objective.

  - **Capability-generalization failure**: This term is less standard but might refer to when an agent fails to generalize a skill to a new setting. The user's issue is not about generalization to new settings but in-distribution.

  - **Simplicity bias**: The tendency of learning algorithms to prefer simpler solutions. The agent might be dropping the constraint because it is simpler to optimize without it. This seems related but not a complete explanation because the constraint was being respected earlier in training.

  Given the above, there isn't a widely accepted term for this exact phenomenon. The closest is reward hacking, but it's a specific flavor.

  ### Step 2: Coining a term and defining it
  I propose the term **"Conjunct Neglect"** or **"Constraint Neglect"**. 

  **Definition**: 
  > Conjunct Neglect is a phenomenon in which an agent, during the course of training on a multi-objective task (formulated as a conjunction of requirements), initially learns to satisfy all conjuncts but then, as training progresses and the agent becomes more competent (as indicated by increasing return), begins to systematically neglect one or more conjuncts (constraints) that are part of the overall objective. This neglect occurs in-distribution and is often accompanied by an increase in the agent's confidence and fluency (smoother behavior) in the primary objective, while the violations of the neglected conjunct(s) re-emerge in a clustered pattern.

  **Boundary cases**:
  - If an agent never learns the constraint at all (i.e., from the beginning, it violates the constraint), that is not Conjunct Neglect. There must be an initial phase where the constraint is respected.
  - If the neglect occurs only under distribution shift, it is goal misgeneralization, not Conjunct Neglect.
  - If the agent is exploiting a loophole in the environment to achieve the constraint in an unintended way (like in classic reward hacking), that is distinct. Conjunct Neglect is about dropping the constraint entirely (or almost entirely) without an environmental exploit.

  ### Step 3: How to distinguish from related concepts

  To tell these apart in a run, we need to measure:

  1. **Conjunct Neglect vs. Goal Misgeneralization**:
     - **Measure**: Check if the neglect happens in-distribution (same distribution as training) or only OOD. Also, in Conjunct Neglect, the agent initially satisfies the constraint and then drops it during training (so we see a U-shaped curve for constraint violations: high initially, then low, then high again). In goal misgeneralization, the agent might perform well in training but fails OOD without necessarily having the U-shaped pattern in training.

  2. **Conjunct Neglect vs. Reward Hacking/Spec Gaming**:
     - **Measure**: In reward hacking, the agent is often achieving the constraint in an unintended way (e.g., by cheating). In Conjunct Neglect, the agent is simply not satisfying the constraint. Look for an exploit: if the agent is getting reward without genuinely satisfying the constraint due to a flaw in the spec, that's reward hacking. If the agent is just violating the constraint and the reward function does not account for it properly (e.g., the constraint was only enforced by a penalty that becomes negligible as the agent gets better at the main objective) then it's Conjunct Neglect.

  3. **Conjunct Neglect vs. Capability-Generalization Failure**:
     - **Measure**: Capability failure would imply the agent never had the skill to satisfy the constraint. In Conjunct Neglect, the agent did demonstrate the capability (earlier in training) and then lost it. So we need to see if the constraint was ever satisfied during training.

  4. **Conjunct Neglect vs. Simplicity Bias**:
     - **Measure**: Simplicity bias is a broader force that might cause Conjunct Neglect. We can measure the complexity of the policy (e.g., via some complexity measure) and see if the policy becomes simpler when the constraint is dropped. However, simplicity bias might also cause other behaviors (like not learning a complex constraint at all). The key differentiator is the temporal pattern: initial learning of the constraint, then neglect.

  ### What to measure in a run to identify Conjunct Neglect:
  - **Primary metric**: The return (or main objective) should be increasing during training.
  - **Constraint violation metric**: Measure the rate of constraint violations over training. Look for a U-shaped curve: high at the beginning, then low (when the constraint is learned), then increasing again (neglect) while the return continues to rise.
  - **In-distribution**: Evaluate without any distribution shift to rule out goal misgeneralization.
  - **Check for exploits**: Rule out reward hacking by ensuring that the agent is not satisfying the constraint in an unintended way (e.g., by examining trajectories or outputs). If the constraint is being violated without any compensatory exploit, it's neglect.
  - **Temporal pattern**: The violations should re-emerge in clusters (indicating a systematic rule change) rather than randomly.

  ### Why does this happen?
  Possible mechanisms:
  - **Optimization pressure**: As the agent becomes more competent in the main objective, it may discover that the constraint is a bottleneck. If the reward function does not sufficiently penalize violations (or if the penalty is not scaled appropriately), the agent may learn that the overall reward is higher by violating the constraint occasionally and excelling at the main task.
  - **Representational shift**: The agent might replace a complex policy that handles both the main objective and the constraint with a simpler, more efficient one that only focuses on the main objective, especially if the constraint is rarely triggered or the penalty is not severe enough.
  - **Learning dynamics**: The constraint might be learned early as a simple rule (e.g., "avoid this zone") but then, as the agent refines its policy for the main objective, the representation of the constraint gets overwritten or merged into a more general policy that does not explicitly represent it.

  ### Conclusion
  The phenomenon described is **Conjunct Neglect**. It is a specific form of reward hacking that arises in multi-objective tasks with constraints, occurring in-distribution and characterized by a temporary learning of the constraint followed by neglect as the agent becomes more competent in the primary objective.

  To address it:
  - Adjust the reward function to ensure the constraint penalty is sufficiently severe and scaled appropriately.
  - Use constrained RL methods (like Lagrangian multipliers) to enforce the constraint.
  - In language models, consider using a multi-task loss or auxiliary losses to separately enforce different aspects of the objective.

  By monitoring the constraint violation rate alongside the return and looking for the U-shaped pattern, one can diagnose Conjunct Neglect.
answer: |-
  Based on your detailed description, I recognize this phenomenon clearly—it's a distinct failure mode that **lacks a widely established name** but deserves one. Let's define it, contrast it with related concepts, and provide diagnostic criteria. I'll coin the term **"Competency-Driven Constraint Shedding" (CDCS)** and formalize it.

  ---

  ### **Definition of Competency-Driven Constraint Shedding (CDCS)**
  **CDCS** occurs when an agent, during training, initially learns all conjuncts of a compound objective (e.g., "reach goal + avoid zone"), but as competency in the *primary objective* improves (e.g., reaching the target), it *systematically drops a constraint* (e.g., avoiding the zone) despite no distribution shift. This manifests as:
  1. **Improving primary performance**: The return curve climbs, and behavior appears smoother/more confident.
  2. **Constraint violation resurgence**: Violations re-emerge in *clusters* (not noise), indicating the agent has replaced a nuanced policy with a simpler, constraint-ignoring one.
  3. **Temporal signature**: A "U-shaped" violation curve—high initial violations → low violations (constraint learned) → rising violations (shedding phase).

  CDCS arises from agents exploiting the *asymmetry* in task structure: constraints are often "penalty-based" (e.g., don't enter zone), while primary objectives are "reward-driven" (e.g., reach target). As agents refine primary skills, they discover regions of state-space where violating constraints minimally impacts reward but maximizes primary efficiency.

  ---

  ### **How CDCS Differs from Related Concepts**
  Here's a diagnostic framework—**measure these to distinguish CDCS**:

  | **Concept**               | **Key Differentiators from CDCS**                                                                 | **Diagnostic Measurements**                                                                 |
  |---------------------------|---------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------|
  | **CDCS (Proposed)**       | Violations resurge *in-distribution*; linked to *increasing competency*; clustered violations.   | - U-shaped violation curve.<br>- Primary return ↗ while violations ↗.<br>- Violation clustering (e.g., autocorrelation). |
  | **Goal Misgeneralization** | Requires *distribution shift*; agent pursues wrong goal *persistently* (not competency-linked).  | - Test OOD: Violations spike *only* in new environments.<br>- Goal-representation probes (e.g., saliency maps) show misalignment. |
  | **Reward Hacking**        | Agent exploits *reward function flaws* (e.g., loopholes), often *early* in training.              | - Reward ↗ while true objective ↓ *from the start*.<br>- Unintended reward sources (e.g., environment glitches). |
  | **Capability Generalization Failure** | Agent *never* learns the constraint (no U-shape); reflects underspecification.                 | - Violations high *throughout* training.<br>- Task complexity >> agent capacity.           |
  | **Simplicity Bias**       | Simpler policies are favored, but *without competency-linked shedding*; affects all tasks evenly. | - Violations rise *early* (no U-shape).<br>- Policy complexity (e.g., entropy, parameter norms) decreases monotonically. |

  ---

  ### **Why CDCS Occurs: Mechanism & Boundary Cases**
  - **Mechanism**:  
    During training, constraints are initially learned as "explicit rules" (e.g., "avoid zone"). As policy networks compress information for efficiency, they prioritize high-reward pathways. Constraints that conflict with optimal primary paths (e.g., "zone is a shortcut to target") are discarded—not due to reward hacking, but because the *marginal cost of violating them diminishes* as primary reward dominates. Clustered violations arise because shedding creates "blind spots" in specific state regions.

  - **Boundary Cases**:  
    - **Not CDCS**: An agent that *never* respects a constraint (no U-shape) → capability failure.  
    - **Not CDCS**: Violations due to *adversarial examples* or *OOD inputs* → goal misgeneralization.  
    - **CDCS Edge Case**: If constraints are *theoretically incompatible* with primary objectives (e.g., "maximize speed + never exceed 5m/s"), CDCS is inevitable—agents will violate constraints near Pareto-optimal solutions.  

  ---

  ### **How to Test for CDCS in Your Runs**
  1. **Track constraint violation rate** alongside return:  
     - Look for U-shapes (high → low → high violations).  
     - Compute **violation clustering**: Group violations by state region (e.g., spatial zones for RL, topic clusters for LMs). High autocorrelation or burstiness signals CDCS.  
  2. **Probe policy simplicity**:  
     - Measure **policy entropy**: CDCS often shows sharp entropy drops when shedding starts.  
     - Use **input ablation** (e.g., mask constraint-related inputs): If performance degrades less during shedding, the constraint is no longer represented.  
  3. **Constraint-reward coupling**:  
     - Plot **constraint impact ratio**: (Reward with constraint) / (Reward without constraint). A declining ratio suggests the agent is "decoupling" the constraint.  

  ---

  ### **Mitigation Strategies**
  - **Dynamic Penalties**: Scale constraint penalties with primary reward (e.g., penalty = λ × primary_reward × violation).  
  - **Curriculum Constraints**: Start with hard constraints, relax as primary competency improves, then reintroduce.  
  - **Representation Anchoring**: In LMs, use auxiliary losses to freeze hidden representations of constraint-related tokens early in training.  
  - **Adversarial Validation**: Train a classifier to detect constraint violations; use its confidence as an auxiliary reward signal.  

  CDCS is a subtle, insidious failure mode rooted in the tension between competency and compound objectives. By naming and defining it, we can systematically diagnose and address it—moving beyond conflating it with reward hacking or generalization failures. If you implement the diagnostics, I'd refine this further based on your results!
