prompt: |-
  Im recording an episode next week with a philosopher who's just finished a book on Harsanyi's aggregation theorem, arguing that it basically vindicates utilitarianism — her slogan is 'grant Pareto and expected-utility rationality for the social ranking and the weighted-sum form falls out for free.' I want 6–8 questions that dont let her just restate the theorem, each with one follow-up written against the answer she's most likely to give. Press her on: (a) since each person's vNM utility function is only pinned down up to positive affine transformation, the weights can just be absorbed into however you rescale each person's function, so is 'equal weights' any constraint at all — and if it isnt, does she have to fall back on the equiprobability / veil-of-ignorance version to get anything egalitarian, and is that fallback circular? (b) a fix I've seen people reach for is normalizing everyone's function so that their own worst-to-best span runs 0 to 1 before adding — but doesnt that quietly build in the claim that everyone's span is the same size, i.e. a pretty strong interpersonal comparison? (c) her argument needs the ex ante version of Pareto rather than the ex post one, so what does she say to someone who thinks that's the wrong Pareto? (d) as usually stated the result assumes a fixed set of people, so what happens when the lotteries can change who exists. And one last thing I keep going back and forth on: I used to think the weighted-sum form was neutral between utilitarianism and prioritarianism since the weights are arbitrary — but a fixed weight attached to a person isn't the same as extra weight for being worse off, and squashing someone's function to get priority looks like it breaks the Pareto condition. Turn that into a question pitched so she can't just answer 'yes, the theorem is neutral between the two.'
reasoning: |-
  Okay, the user is preparing for an interview with a philosopher who wrote a book on Harsanyi's aggregation theorem. They need 6-8 questions that push beyond restating the theorem, focusing on specific critical points. Let me break down their concerns.

  First, they mention issue (a): the utility functions are unique only up to affine transformations. This means weights can be absorbed by rescaling. So, is "equal weights" meaningful? And if not, does she rely on the veil-of-ignorance, risking circularity? The follow-up needs to challenge if the initial normalization assumes equality, making the egalitarian conclusion dependent on that assumption.

  Next, (b) discusses normalizing each person's utility from 0 to 1. But doesn't that imply interpersonal comparisons by assuming everyone's utility range is equal? The follow-up should question if this normalization smuggles in a substantive claim about equal capacity for welfare, which might be controversial.

  Then, (c) addresses the ex ante vs. ex post Pareto principle. The theorem uses ex ante Pareto, but critics argue ex post is more appropriate. The question should press why ex ante is defensible, especially when individuals might prefer different lotteries. The follow-up could highlight cases where individual rankings conflict, challenging the social planner's ex ante approach.

  Issue (d) involves variable populations. The theorem assumes a fixed set of people, but real policies affect who exists. How does her argument handle nonexistent individuals' utilities? The follow-up should ask if including potential people forces a total utilitarian view, which she might want to avoid.

  Lastly, the user is confused about weighted-sum being neutral between utilitarianism and prioritarianism. Fixed weights vs. weighting based on welfare level: squashing utility for priority might violate Pareto. The question needs to clarify if the theorem's structure prevents prioritarianism, as variable weights based on welfare levels could break the expected utility form.

  The user's deeper needs: They want incisive questions that expose potential weaknesses in the philosopher's argument. They need to avoid letting her retreat to theorem restatement. Each question must target assumptions (normalization, Pareto choice), implications (egalitarianism, prioritarianism), and extensions (variable populations). Ensuring follow-ups preempt common defenses is key. Also, the last question must force her to distinguish utilitarianism from prioritarianism within the theorem's constraints, not just acknowledge neutrality.
answer: |-
  Here are 8 targeted questions designed to press on the critical points you raised, each with a follow-up anticipating a likely response. They avoid simple theorem restatement:

  1.  **Question (Addressing Core Ambiguity - Weights & Affine Transformations):** "You argue Harsanyi 'vindicates utilitarianism'. But since each individual's vNM utility function is only unique up to a positive affine transformation, the social weights (`w_i`) in the weighted sum `Σ w_i u_i` can be arbitrarily absorbed into the *scaling* of each individual's `u_i`. Doesn't this mean the *magnitude* of the weights, including whether they are 'equal', is essentially a convention based on how we normalize each person's utility scale, rather than a substantive ethical constraint derived *from* the theorem itself?"
      *   **Likely Answer:** "The theorem shows the *form* is additive. Equal *normalization* under a veil of ignorance then justifies equal weights substantively."
      *   **Follow-Up:** "But doesn't that shift the entire egalitarian burden *away* from Harsanyi's theorem and *onto* the veil-of-ignorance justification? And if the veil justification relies on the idea that each person has an 'equal claim' or that all possible lives are equally probable, isn't that *already* assuming the fundamental moral equality that utilitarianism (with equal weights) is supposed to *derive*? Doesn't this make the appeal to Harsanyi circular for establishing egalitarianism?"

  2.  **Question (Normalization & Interpersonal Comparison - Span 0 to 1):** "A common response to the affine transformation issue is to normalize each individual's vNM utility function so that their worst outcome is 0 and their best outcome is 1 *according to their own preferences*, then sum these normalized utilities with equal weights. But doesn't setting everyone's 'full range' to [0,1] implicitly assume that the *subjective intensity* or 'size' of the difference between the worst and best *possible* states is *the same* for every person? Isn't this a strong, and highly contestable, form of interpersonal comparison – essentially assuming equal capacity for welfare across individuals – smuggled in via the normalization procedure?"
      *   **Likely Answer:** "This normalization provides a consistent basis for comparison. It respects each individual's own valuation of their extremes."
      *   **Follow-Up:** "But doesn't 'respecting their own valuation' only fix the *scale relative to themselves*? The jump to using *that specific scale* (0 to 1) *across individuals* for summation assumes that one unit on Alice's normalized scale is somehow *comparable in moral significance* to one unit on Bob's normalized scale. If Alice's normalized 0-to-1 represents a vast range of suffering/joy she's capable of, while Bob's represents a much narrower range, wouldn't giving them equal weight in the sum potentially *undervalue* Alice's welfare swings? Isn't the claim that '0 to 1 is the same moral magnitude for everyone' doing the heavy lifting here?"

  3.  **Question (Ex Ante vs. Ex Post Pareto):** "Harsanyi's theorem crucially relies on the *ex ante* Pareto principle: if every individual *expects* to be better off under lottery A than lottery B, then society should prefer A. Critics argue the *ex post* Pareto principle – if A turns out better than B in *every possible state of the world*, then prefer A – is more fundamental and avoids problematic state-wise aggregation. Why should we accept *ex ante* Pareto as the compelling starting point for deriving the social good, especially when it forces us to aggregate utilities in a specific way *before* uncertainty is resolved?"
      *   **Likely Answer:** "Social decisions under uncertainty *must* consider expectations. Ex post Pareto is too weak; it rarely applies to real uncertain choices. Ex ante Pareto respects individual risk attitudes embedded in their vNM utilities."
      *   **Follow-Up:** "But doesn't *ex ante* Pareto potentially conflict with state-wise dominance or fairness concerns? Imagine a lottery where, in one state, Alice is made much worse off so that Bob can gain slightly in expectation, but due to their differing risk aversion, both *ex ante* prefer it. Doesn't *ex ante* Pareto mandate this lottery, even though it involves a potential large loss for Alice that seems Pareto inferior *ex post* in that state? Why is the social planner obligated to respect individuals' *betting preferences* over outcomes in this way, rather than focusing on the realized outcomes across states?"

  4.  **Question (Fixed Population Assumption):** "Harsanyi's theorem assumes a fixed population. How does your vindication of utilitarianism handle cases where social choices affect *who exists*? If we consider potential people, do their utilities enter the sum? If not, how do we avoid the repugnant conclusion? If yes, doesn't this push us towards total utilitarianism, which faces its own well-known problems?"
      *   **Likely Answer:** "The theorem applies to fixed populations. Extensions to variable populations are complex and require separate arguments, perhaps appealing to average utilitarianism or critical levels."
      *   **Follow-Up:** "But if Harsanyi is meant to provide a *foundational* vindication of utilitarianism, doesn't its silence on one of the most ethically significant domains – procreation and extinction – severely limit its claim to being a complete or definitive vindication? Doesn't the need to graft on a separate, potentially ad-hoc, solution (like average utilitarianism) to handle variable populations undermine the idea that the weighted-sum form 'falls out for free' as *the* fundamental social aggregation rule?"

  5.  **Question (Utilitarianism vs. Prioritarianism - The Structural Point):** "I understand the theorem delivers a weighted sum of *individual expected utilities*. You call this utilitarianism. But prioritarianism also often uses a sum – a sum of *transformed* individual utilities (`Σ f(u_i)`, with `f` concave). Why doesn't Harsanyi's result equally 'vindicate' prioritarianism, since both are additive?"
      *   **Likely Answer:** "Prioritarianism transforms utilities *before* expectation, breaking the linearity in probabilities required by the EU axioms applied to the social ranking. Harsanyi's social welfare function is linear in *individual expected utilities*."
      *   **Follow-Up:** "Exactly. So doesn't this reveal a crucial distinction? Prioritarianism requires applying the concave transformation *state-wise*: the social value of an outcome depends on the *level* of welfare in that state. But Harsanyi's theorem, by demanding the social ranking satisfies EU axioms *directly*, forces social welfare to be linear in *probabilities* – it aggregates *expected utilities*, not utilities state-by-state. So isn't the theorem's structure fundamentally *incompatible* with the state-wise weighting by marginal utility that defines prioritarianism, making it genuinely *neutral* only between different linear aggregations (i.e., different `w_i`), all of which are versions of *utilitarianism* (giving priority only via fixed weights, not welfare levels)?"

  6.  **Question (Pareto & Prioritarianism Breakdown):** "Building on that, suppose someone tries to encode prioritarianism *within* the Harsanyi framework by defining each person's 'vNM utility' not as their welfare, but as their priority-transformed welfare (`f(u_i)`). Couldn't we then apply Harsanyi to sum these transformed utilities?"
      *   **Likely Answer:** "They could try, but then the `u_i` fed into Harsanyi are *not* the vNM utilities representing the individual's *own* risk preferences over their welfare outcomes. Harsanyi requires the social planner to use the individuals' *actual* vNM utilities as input."
      *   **Follow-Up:** "Right, so the key constraint is that the `u_i` in the sum `Σ w_i u_i` are the *individuals' own* vNM utility functions, reflecting *their* attitudes towards risk over *their* welfare. Any concave transformation applied *by the social planner* (`f(u_i)`) would violate Pareto, correct? Because the planner would be substituting their own valuation (`f(u_i)`) for the individual's valuation (`u_i`) of the individual's own welfare. Doesn't this mean Harsanyi's axioms, particularly Pareto, *actively block* the social planner from implementing prioritarianism by transforming utilities state-wise?"

  7.  **Question (The 'Falls Out for Free' Claim - What's Doing the Work?):** "Your slogan says the weighted-sum form 'falls out for free' from Pareto and Social EU Rationality. But given the profound ambiguity in the weights due to affine transformations and the strong implicit interpersonal comparison needed to fix them meaningfully, and given the specific choice of *ex ante* Pareto, doesn't this 'free' result depend heavily on accepting a very specific – and ethically loaded – *interpretation* of how individual utilities are measured and compared, and *which* version of Pareto is fundamental? Isn't the theorem less a free derivation and more a lens focusing pre-existing ethical commitments?"
      *   **Likely Answer:** "The theorem shows the *logical structure* is inescapable given those axioms. The interpretation and normalization are separate, necessary steps to apply it."
      *   **Follow-Up:** "But doesn't that concede that the theorem itself doesn't 'vindicate utilitarianism' in any substantive sense *until* those ethically charged steps (choosing normalization, defending *ex ante* Pareto) are taken? Doesn't this make your book's argument less about Harsanyi *delivering* utilitarianism and more about arguing *why we should accept the specific interpretations and premises* needed to make Harsanyi *compatible* with a particular (egalitarian) version of utilitarianism?"

  8.  **Question (The Veil of Ignorance - Necessary Supplement?):** "Given the difficulties in pinning down equal weights directly from the theorem and the affine ambiguity, do you see the veil-of-ignorance interpretation as an *essential supplement* to Harsanyi's theorem to ground *egalitarian* utilitarianism? Or can the weights be fixed ethically without appealing to hypothetical choice under equiprobability?"
      *   **Likely Answer:** "The veil provides the most compelling justification for equal weights, linking Harsanyi's formal result to a deep principle of impartiality and equal concern."
      *   **Follow-Up:** "If the veil is essential, doesn't this make Harsanyi's theorem primarily a *technical bridge* showing that *if* we accept impartiality modeled by the veil (and its equiprobability assumption), *then* the social ranking must take the utilitarian form? Doesn't this shift the core justificatory weight away from Pareto and Social EU Rationality and onto the ethical defensibility of the veil construction itself? And if we reject the veil, does Harsanyi offer *any* internal guidance for choosing weights other than convention or arbitrary social choice?"

  These questions force engagement with the theorem's *limitations*, *interpretive ambiguities*, and *ethical presuppositions*, rather than allowing a restatement of its mathematical conclusion. They specifically target the points you wanted to press and anticipate common defensive moves. The prioritarianism questions (5 & 6) are structured to highlight the *structural incompatibility* due to the state-wise vs. ex ante aggregation, moving beyond simple neutrality claims. Good luck with the interview!
