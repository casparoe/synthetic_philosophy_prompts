   - Groups of 3, with sealed envelopes containing rules for marking strings.
   - The activity should lead to the realization that some truths cannot be marked by their rules, but without explicit self-reference.
   - We want to avoid the participants writing "this sentence is unprovable".
   - The user suggested a sneaky idea: some groups get a consistent system and some get an inconsistent one (with an extra rule that makes everything provable). Then at debrief, the room might split on whether a particular sentence is true, revealing that they were trusting consistency.

