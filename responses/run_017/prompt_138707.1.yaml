    - We will have two kinds of envelopes: one with 4 rules (Type A) and one with 5 rules (Type B). The extra rule in Type B will be something that allows marking any string (e.g., "if s is any string, then you can mark s" or a rule that leads to contradiction, which we can use to mark everything via explosion). However, to avoid confusion, we should design it so that the explosion is not immediate but can be triggered.

