prompt: |-
  I am editing the proceedings volume for a workshop on aggregation in distributive ethics, and I want to close it with something more useful than the exchange the participants actually had. Two of them have been running the utility monster case against each other for about a decade and have never once written down what they agree on. Call them the Aggregators, who are total-welfare consequentialists counting a unit of welfare equally no matter whose it is, and the Separatists, who hold that a gain to one being does not by itself generate a reason of the same kind to impose a loss on another, and that any such imposition has to be justifiable to whoever bears it. Draft the joint statement the two of them could both sign after a good-faith adversarial collaboration.

  Fix the case, so that both sides are reasoning about the same text. There is a fixed stock of a perfectly divisible resource. Welfare is cardinally measurable and interpersonally comparable on a scale both sides accept, and each ordinary recipient's welfare is a strictly concave, increasing function of the share they receive. One being, the monster, converts a unit of the resource into k units of welfare where anyone else gets one, with k greater than one; its rate is intrinsic to it, stable across scales, known with certainty, and not itself a product of earlier transfers.

  Run the case at two values of k, because I suspect much of the disagreement relocated when nobody was looking: k in the hundreds or thousands, with one monster and a very large population of ordinary recipients; and k around 1.2, with two groups of patients and a fixed budget of a scarce therapy, where both participants in fact accept allocating to the group with the greater capacity to benefit. If either of them wants to contest the second case, that belongs in the disagreements table rather than being smoothed over.

  Then four reformulations, which I want treated as tests rather than as new ammunition.

  1. The dispersed reformulation. Hold the aggregate gain and the aggregate loss fixed but realize them through a very large number of slightly above-average recipients rather than one recipient with an enormous rate. If the intuition tracks concentration rather than aggregation, this should show it.
  2. The endogenous monster. Its conversion rate rises with the size of its share, so there is no interior optimum at which marginal returns equalize and the Aggregator's usual stopping rule never engages.
  3. The curable monster. The elevated rate is a pathology that a cheap, permanent, and fully consensual intervention would remove; because the rate is what makes transfers productive, the intervention lowers total welfare. Does either camp forbid providing it?
  4. The contaminated monster. It realizes its elevated welfare only from resources taken from others without their consent; under a voluntary transfer scheme its rate falls to one. I suspect this variant belongs to a different dispute, about whether malevolent or otherwise other-regarding preferences belong in the currency of welfare at all, and I want that suspicion either confirmed or killed.

  Structure the document in four parts. First, a numbered list of agreed claims, substantive enough that neither side would sign it reflexively: what the formalism of the case is, what follows for each view at each value of k, what the case does and does not establish, and what would follow if the case turned out to be nomologically impossible. Second, a table of residual disagreements, each row giving the disputed proposition in neutral terms, then the formulation an Aggregator would endorse for their own side, then the formulation a Separatist would endorse for theirs. Third, the cruxes, meaning the sub-questions such that settling one would move at least one of them, with, for each crux, the case, argument, or piece of evidence both camps accept as bearing on it and each camp's prediction about what it will show, recorded in advance. Fourth, a short closing section identifying which parts of the remaining dispute are merely verbal or orthogonal to aggregation, including whether the framing of the case as a reductio is doing any real work, and stating what each camp would count as evidence against its own view.

  Work conceptually; I do not want citations, and where a technical notion carries weight, define it inline rather than invoking it. I am thinking of concavity, priority weights and how fast they would have to decay to block the monster, the person-affecting restriction, and the distinctions between a criterion of rightness and the demandingness of morality and between what there is most reason to do and what an institution should mandate.
reasoning: |-
  We are drafting a joint statement for two parties: the Aggregators (total-welfare consequentialists) and the Separatists (who hold that gains to one do not by themselves justify imposing losses on another without justification to the bearer). We fix the case as described and consider two values of k: one large (hundreds or thousands) and one small (around 1.2). Then we consider four reformulations. The document has four parts: agreed claims, residual disagreements, cruxes, and closing.

  Part 1: Agreed Claims

  We, the Aggregators and the Separatists, after good-faith discussion, agree on the following:

  1. **Formal Setup**: 
     - There is a fixed stock of a perfectly divisible resource.
     - Welfare is cardinally measurable and interpersonally comparable on a scale accepted by both sides.
     - Each ordinary recipient has a welfare function that is strictly concave and increasing in their share of the resource.
     - The utility monster converts a unit of resource into k units of welfare (with k>1), while any ordinary recipient converts a unit into 1 unit at the margin (at the relevant allocation). The monster's rate k is intrinsic, stable across scales, known with certainty, and not a product of earlier transfers.

  2. **Case 1: Large k (hundreds or thousands) with one monster and a large population of ordinary recipients**:
     - **Aggregator View**: In this case, the Aggregator's total welfare maximization implies transferring nearly all the resource to the monster, because the marginal welfare gain per unit of resource is k for the monster and 1 for any ordinary recipient (at the point of near-starvation for the ordinary recipients). Since k is much greater than 1, this transfer greatly increases total welfare.
     - **Separatist View**: The Separatist holds that such a transfer is not justifiable to each ordinary recipient who is brought near starvation. The gain to the monster does not, by itself, provide a reason that can be justified to those who bear the loss. Therefore, the Separatist rejects the transfer of nearly all resources to the monster.

  3. **Case 2: Small k (around 1.2) with two groups of patients and a fixed budget for a scarce therapy**:
     - **Agreed Outcome**: Both sides agree that when k is small (specifically, 1.2) and the welfare functions are linear (or nearly linear) in the relevant range (which is typical for life-saving therapies), it is acceptable to allocate more resources to the group with the higher capacity to benefit (the "monster" group in this analogy). 
       - *Reason for Aggregator*: This allocation maximizes total welfare because the marginal gain is 1.2 for the high-benefit group and 1 for the other, so shifting resources to the high-benefit group increases total welfare.
       - *Reason for Separatist*: The Separatist can justify this allocation to the members of the lower-benefit group by pointing out that, given the scarcity, the alternative (equal allocation) would result in a greater loss in overall health benefits, and the differential is not so extreme as to impose a catastrophic loss on any individual for the sake of a modest gain to another. Moreover, the Separatist might appeal to the idea that each individual in the low-benefit group has a claim that is proportional to the benefit they would receive, and the small differential (1.2 vs 1) does not override the efficiency argument in a way that makes the allocation unjustifiable.

  4. **What the Case Establishes**:
     - The utility monster case (with large k) starkly illustrates the disagreement between Aggregators and Separatists. It shows that the two views can lead to radically different resource allocations when one being has a much higher marginal welfare conversion rate.
     - The case does not establish that either view is incoherent. Both views are internally consistent and can be applied to the case.
     - The case does not establish that the Aggregator view is indifferent to distribution; it is sensitive to distribution through the concavity of welfare functions, but in the monster case the high linear rate overrides that concern.

  5. **What the Case Does Not Establish**:
     - It does not establish that the Separatist view must reject any and all transfers that impose losses on some for the benefit of others. The small k case shows that the Separatist can accept some transfers when the gains are not too concentrated and the losses are not too severe.
     - It does not establish that the Aggregator view requires us to ignore the separateness of persons. The Aggregator view can acknowledge the separateness but holds that the moral importance of welfare does not depend on whose welfare it is.

  6. **If the Case Were Nomologically Impossible**:
     - If beings with such extreme and stable conversion rates (large k) were impossible (for instance, due to physiological constraints or diminishing returns at high levels of resources), then the practical disagreement would be limited to cases with more moderate differences (like k=1.2). However, the theoretical disagreement would remain, because it is about the structure of moral reasons.

  Part 2: Table of Residual Disagreements

  | Disputed Proposition | Aggregator Formulation | Separatist Formulation |
  |----------------------|------------------------|------------------------|
  | **1. Permissibility of extreme transfers for large k** | "In the case of a utility monster with a large k, it is not only permissible but required to transfer nearly all resources to the monster to maximize total welfare." | "In the case of a utility monster with a large k, transferring nearly all resources to the monster is impermissible because it imposes catastrophic losses on many without a justification that can be addressed to each person who loses." |
  | **2. The role of concentration in generating moral reasons** | "The concentration of benefits does not affect the moral reason to promote welfare. A unit of welfare counts the same regardless of whether it is concentrated in one being or dispersed among many." | "The concentration of benefits matters because reasons must be justifiable to each individual. A benefit to one being does not generate a reason that can justify imposing a loss on another." |
  | **3. The relevance of the endogenous monster** | "Even if the monster's conversion rate rises with its share (endogenous monster), we must still allocate resources to the point where the marginal welfare per unit of resource is equalized across all beings. If that point involves a very large share for the monster, so be it." | "In the endogenous monster case, the rising rate creates a feedback loop that exacerbates the concentration problem. This does not change the fundamental objection: the allocation cannot be justified to those who are left with almost nothing." |
  | **4. The curable monster** | "If an intervention can cure the monster (reducing k to 1) at a small cost in resources, but doing so reduces total welfare (because the monster's welfare is high and the cure lowers it), we should not provide the cure. Welfare is what matters, and we should not destroy welfare." | "If the monster's condition is a pathology and the cure is cheap, permanent, and consensual, we must provide the cure. The fact that the monster's welfare would be lower after the cure does not override our duty to treat the pathology, especially because the monster's welfare is built on the deprivation of others." |
  | **5. The contaminated monster** | "The source of the resource (whether taken voluntarily or not) does not change the welfare value. If the monster's welfare is real, then it should count. However, if the welfare depends on non-consensual taking, then that might be a separate reason to avoid the transfer (e.g., because it violates rights). But in a pure resource allocation problem without prior ownership, the welfare should count." | "The contaminated monster case shows that welfare that is parasitic on non-consensual taking is not legitimate. Such welfare should not count in the moral calculus because it is based on a violation of the separateness of persons. This is not just about malevolent preferences but about the conditions under which welfare claims are valid." |

  Part 3: Cruxes

  We identify the following cruxes, and for each, we state the case or argument that both sides accept as bearing on it and each camp's prediction:

  1. **Crux: Does the dispersion of benefits and losses affect the permissibility of a transfer?**
     - *Test Case*: The dispersed reformulation. Hold aggregate gain and loss fixed but spread the gain over a very large number of slightly above-average recipients and the loss over a very large number of slightly below-average recipients.
     - *Aggregator Prediction*: The dispersion should not matter. If the aggregate gain exceeds the aggregate loss, the transfer is required.
     - *Separatist Prediction*: The transfer is permissible in the dispersed case because each loser loses only a little and each gainer gains only a little, and the justification (that the small gains together outweigh the small losses) can be addressed to each loser without requiring them to bear a catastrophic loss for the sake of others.

  2. **Crux: How do priority weights decay?**
     - *Test Case*: The Aggregator uses a linear weighting (no decay), while the Separatist uses a priority view (diminishing marginal moral weight for welfare). We can test the rate of decay by considering cases where the loss to the worst-off is fixed and the gain to the better-off varies.
     - *Aggregator Prediction*: No decay: the moral weight of a unit of welfare is the same regardless of the level of the recipient.
     - *Separatist Prediction*: Priority weights decay with the absolute or relative level of welfare. The decay is steep enough to block the utility monster for large k.

  3. **Crux: Is there a distinction between a criterion of rightness and the demandingness of morality?**
     - *Test Case*: The Aggregator holds that the criterion of rightness is total welfare maximization, but this may be too demanding for human moral agents. The Separatist holds that the criterion of rightness includes justifiability to each individual.
     - *Aggregator Prediction*: The demandingness of morality is a separate issue from the criterion of rightness. Even if we cannot always achieve the best outcome, it remains the standard for what is right.
     - *Separatist Prediction*: The criterion of rightness is inherently tied to what can be justified to each affected party. Therefore, the demandingness is built into the criterion.

  4. **Crux: Does the person-affecting restriction hold?**
     - *Test Case*: The person-affecting restriction says that an outcome can be better than another only if it is better for someone. Both camps can consider a case where we can create a new being with positive welfare, but doing so would slightly reduce the welfare of an existing being.
     - *Aggregator Prediction*: The person-affecting restriction is false. We should create the new being because it increases total welfare.
     - *Separatist Prediction*: The person-affecting restriction holds. We cannot justify imposing a loss on the existing being for the sake of creating a new being.

  Part 4: Closing

  We note that some parts of the dispute might be verbal or orthogonal to the core issue of aggregation:

  - **Verbal Element**: The term "aggregation" itself may be ambiguous. For the Aggregator, it means adding up welfare. For the Separatist, it may refer to the practice of allowing gains to one to morally offset losses to another without justifiability to the losers. Clarifying this might reduce the disagreement.

  - **Reductio Framing**: The utility monster is often used as a reductio against Aggregation. However, the Aggregator does not see it as such because they accept the conclusion. The Separatist uses it to show that Aggregation leads to unacceptable conclusions. This framing does not advance the debate beyond what is in the agreed claims and disagreements.

  - **Orthogonal Issues**: 
     - The debate about the contaminated monster may be orthogonal because it involves the source of welfare (non-consensual taking) and might be about the validity of welfare claims rather than aggregation per se. 
     - The curable monster might also involve a separate issue of whether we should value welfare that depends on a pathology.

  - **Evidence Against Own View**:
     - **Aggregator**: Evidence against our view would be a case where an action clearly maximizes total welfare but is clearly wrong, and the wrongness cannot be explained by secondary effects (e.g., incentive effects, or violation of rights that are justified instrumentally). The utility monster with large k is such a case for our opponents, but we do not see it as wrong.
     - **Separatist**: Evidence against our view would be a case where a transfer that imposes a loss on one person for the sake of a larger gain to another is clearly permissible and cannot be justified by appeal to the interests of the loser (e.g., through prior consent, reciprocity, or avoidance of a greater loss to others). The small k case (like 1.2) is not such evidence because we accept it. A more challenging case would be one where the gain is large and the loss is small but the justification to the loser seems weak.

  We commit to continuing the discussion by focusing on the cruxes and seeking empirical and conceptual evidence to resolve them.

  Signed,

  [Representative of the Aggregators]
  [Representative of the Separatists]
answer: |-
  ### Joint Statement: Aggregators and Separatists on the Utility Monster  

  **Preamble**  
  After a decade of debate, we—Aggregators (defenders of total-welfare consequentialism) and Separatists (defenders of justification-to-the-individual)—commit to this adversarial collaboration. We fix the utility monster case as follows:  
  - A fixed stock of a perfectly divisible resource.  
  - Welfare is cardinally measurable, interpersonally comparable, and on a common scale.  
  - **Ordinary recipients**: Welfare is a strictly concave, increasing function of their resource share (i.e., gains diminish as they receive more).  
  - **Monster**: Converts a unit of resource into *k* units of welfare, where *k* > 1. This rate is intrinsic, stable, certain, and independent of prior transfers.  
  - **Two scenarios**:  
    - **Large-k**: *k* = 100s/1000s; one monster; large population of ordinary recipients.  
    - **Small-k**: *k* ≈ 1.2; two groups of patients; fixed budget for a scarce therapy.  

  We address four reformulations:  
  1. **Dispersed**: Aggregate gain/loss fixed, realized via many slightly above-average recipients.  
  2. **Endogenous Monster**: *k* rises with its resource share, preventing marginal equalization.  
  3. **Curable Monster**: Pathology causing high *k* is removable via a cheap, consensual intervention, lowering total welfare.  
  4. **Contaminated Monster**: High *k* depends on non-consensual resource takings; under voluntary transfers, *k* = 1.  

  ---  

  #### Part 1: Agreed Claims  
  1. **Formal Structure**:  
     - The Aggregator objective is to maximize total welfare. The Separatist objective requires that losses to any individual be justifiable to them, independent of others’ gains.  
     - **Strict concavity** (diminishing marginal welfare gains) implies priority to the worse-off under equal rates. The monster’s linear rate (*k*) disrupts this.  

  2. **Large-k Scenario**:  
     - **Aggregator Conclusion**: Near-total transfer to the monster maximizes welfare.  
     - **Separatist Conclusion**: This transfer is unjustifiable to ordinary recipients, whose catastrophic losses cannot be overridden by the monster’s gains.  
     - **Agreed Insight**: The case cleanly separates our views; it does not impeach the internal coherence of either.  

  3. **Small-k Scenario**:  
     - **Aggregator Conclusion**: Allocate to the high-k group (k=1.2) to maximize welfare.  
     - **Separatist Conclusion**: This allocation is justifiable. The loss to low-k recipients is marginal, the gain to high-k recipients is medically significant, and scarcity permits efficiency-based claims.  
     - **Agreed Insight**: Both endorse allocation to the group with greater capacity to benefit here. The dispute is not about small differentials.  

  4. **What the Case Establishes**:  
     - It demonstrates a *principled disagreement*: Aggregators see welfare gains as fungible; Separatists see justification as non-fungible across persons.  
     - It does **not** show that Aggregators ignore fairness (concavity ensures sensitivity to distribution) or that Separatists reject all loss-imposing transfers (see small-k).  

  5. **Reformulation Outcomes**:  
     - **Dispersed**: Both sides predict their conclusions will hold identically to the concentrated case. Intuitions track aggregation, not concentration.  
     - **Endogenous Monster**: Both agree the Aggregator optimum is undefined or extreme; Separatists still reject the transfer as unjustifiable.  
     - **Curable Monster**: Both forbid the intervention if non-consensual; both permit it if consensual (irrespective of welfare loss).  
     - **Contaminated Monster**: Both agree this is **orthogonal to aggregation**. It hinges on whether welfare from non-consensual takings belongs in the moral calculus—a separate dispute.  

  6. **Nomological Impossibility**:  
     - If large-k monsters are impossible (e.g., due to resource saturation), the practical urgency diminishes. The *theoretical* disagreement persists, as small-k cases and other trade-offs (e.g., risk imposition) remain.  

  ---  

  #### Part 2: Residual Disagreements  
  | Disputed Proposition | Aggregator Formulation | Separatist Formulation |  
  |----------------------|------------------------|------------------------|  
  | **Permissibility of large-k transfers** | "Total welfare maximization requires transferring resources to the monster, as each unit does more good there. Justice is served by optimal outcomes." | "No individual’s catastrophic loss can be justified by another’s gain, regardless of totals. The transfer violates the duty of justification to each person." |  
  | **Moral relevance of aggregation** | "A unit of welfare has equal weight regardless of distribution. Aggregation is necessary to avoid paralysis in trade-offs." | "Aggregating gains and losses across persons obscures the distinct claim each has against being used as a means. Justification must be person-specific." |  
  | **Role of concavity** | "Concavity ensures distributional sensitivity, but linear rates (k) override this when disparities are large." | "Concavity reflects diminishing moral urgency, but it does not license overriding an individual’s threshold claim to minimal welfare." |  
  | **Demandingness vs. criterion of rightness** | "The criterion of rightness (welfare-max) is distinct from practical demandingness. Institutions should aim for the criterion." | "The criterion of rightness *includes* justifiability. Institutions must embody this, not merely approximate an impersonal optimum." |  

  ---  

  #### Part 3: Cruxes  
  1. **Does dispersion affect permissibility?**  
     - **Test**: Dispersed reformulation (identical aggregate gain/loss, many recipients).  
     - *Aggregator Prediction*: Permissible; dispersion is irrelevant.  
     - *Separatist Prediction*: Permissible; small losses are justifiable via reciprocity or fairness.  
     - **Bearing**: If dispersion changes intuitions, it implicates concentration, not aggregation.  

  2. **How fast must priority weights decay?**  
     - **Test**: Rate at which moral weight decreases as welfare increases (e.g., weighting gains to the worse-off more heavily).  
     - *Aggregator Prediction*: Linear weights (no decay); decay would violate impartiality.  
     - *Separatist Prediction*: Steep decay; minimal welfare has near-absolute priority.  
     - **Bearing**: Fast decay blocks the monster; slow decay permits it.  

  3. **Is the person-affecting restriction necessary?**  
     - **Test**: Does a change require being better/worse for some *particular* individual?  
     - *Aggregator Prediction*: No; impersonal welfare gains matter.  
     - *Separatist Prediction*: Yes; morality is anchored in effects on individuals.  
     - **Bearing**: Affects whether the monster’s gains can "count" against others’ losses.  

  4. **Does the framing as a reductio matter?**  
     - **Test**: Restate the case as a direct policy choice, not a thought experiment.  
     - *Aggregator Prediction*: No change; the reductio is rhetorical.  
     - *Separatist Prediction*: Reductio highlights counterintuitive implications; direct framing may obscure this.  
     - **Bearing**: If intuitions shift, the dispute is partly methodological.  

  ---  

  #### Part 4: Closing  
  **Verbal and Orthogonal Elements**:  
  - **"Aggregation"** is verbal: Aggregators define it as *summing welfare*; Separatists as *offsetting losses with others’ gains*.  
  - **Reductio framing** does no independent work; it only dramatizes the core disagreement.  
  - **Contaminated monster** is orthogonal (hinges on welfare’s scope, not aggregation).  
  - **Curable monster** invokes consent, not aggregation.  

  **Evidence Against Own View**:  
  - **Aggregators**: Evidence would be a case where (1) welfare is clearly maximized, (2) no rights violations occur, yet (3) the outcome is intuitively unjustifiable.  
  - **Separatists**: Evidence would be a case where (1) a loss to A is clearly justifiable to A solely by B’s gain, (2) no reciprocal or procedural mechanisms apply, and (3) refusal to transfer seems dogmatic.  

  **Commitment**: We will test these cruxes empirically (e.g., moral psychology studies on dispersion) and conceptually (e.g., priority weight decay models), updating our views accordingly.  

  ---  
  *Signed,*  
  **Aggregators**: The total welfare of all beings, impartially considered, is the sole criterion of rightness.  
  **Separatists**: Morality requires that each being’s claims be respected in terms justifiable to them.
