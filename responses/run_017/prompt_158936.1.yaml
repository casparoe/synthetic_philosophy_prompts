  However, note that the CTT is a claim about the entire input-output function of the device. The device might be expected to produce outputs for inputs we haven't tested. If we observe an input-output pair that is not computable, then we would have a counterexample. But Ravi's point is that we can only observe finitely many pairs. And for any finite set of pairs, we can build a lookup table. Therefore, we can never observe a counterexample to CTT? That is, we can never observe an input-output pair that is not computable? Actually, we could: suppose we have a device that we believe computes an uncomputable function. We run it on an input and get an output. We then try to compute that output by a Turing machine. But we might not be able to verify that the output is uncomputable because we cannot run all Turing machines to check. However, if we have a candidate uncomputable function (like the halting problem) and the device solves it correctly on some input that we can independently verify (by a proof, say) that no Turing machine could have solved, then we have a counterexample.

  But Ravi's argument is that for the finite set of inputs we test, we can always build a lookup table. So if we test the device on an input that we know (by mathematical proof) requires an uncomputable function, then the lookup table for that finite set of tests would still work. However, note that the lookup table would have to include that specific input-output pair. But that pair is computable by a lookup table! So even if the function is uncomputable, every finite set of input-output pairs is computable (by the lookup table). Therefore, we can never observe a finite set of input-output pairs that is not computable. So step (4) is correct: no finite evidence can conflict with CTT. But then step (5) follows: CTT is not falsifiable by any finite evidence.

  This is similar to the problem of induction: we cannot prove a universal generalization by finite evidence, and we cannot falsify it by finite evidence if the generalization is about an infinite set? Actually, we can falsify a universal generalization by a single counterexample. But if the counterexample is in the future or in an untested input, then we haven't observed it. However, in the case of CTT, a counterexample would be an input-output pair that is not computable. But if we observe such a pair, then we have a finite set of evidence (that one pair) that is computable by a lookup table. So we cannot observe a non-computable input-output pair? Because if we observe it, we can write it down, and then it becomes computable by a lookup table. Therefore, it seems impossible to observe a counterexample to CTT.

  This leads to the conclusion that CTT is not empirically falsifiable. But then the user's point is that the same applies to any universal generalization. For example, the law of gravity: we have only observed finitely many instances. We could always build an ad hoc theory that fits the data and then diverges arbitrarily in the future. So why do we accept the law of gravity as empirical? Because we demand that the theory be simple, uniform, and not ad hoc. But Ravi preempts that by saying that CTT as stated does not require the Turing machine to be non-ad-hoc.

