  But the user's point is that the same applies to any universal generalization. So if we accept Ravi's argument, we must reject all universal generalizations as non-empirical. That is a high cost. Alternatively, we can reject the Popperian view that empirical content requires falsifiability by finite evidence. But that is a big move.

  Alternatively, we can note that the CTT is about the existence of a Turing machine that reproduces the entire input-output behavior. The lookup table for finite evidence does not provide such a machine because it doesn't cover all inputs. Therefore, step (3) is misleading: the lookup table does not show that the entire behavior is reproducible; it only shows that the finite evidence is reproducible. So step (4) is incorrect: we can have evidence that conflicts with CTT. How? If we have a physical theory that predicts that the device computes an uncomputable function, and we test it and find that it does, then we have evidence against CTT. But again, we can only test finitely many points. However, if we have a theory of the device that we trust, and that theory says it computes an uncomputable function, and we verify the theory in many ways, then we have evidence. But Ravi might say that the lookup table still fits the finite data. So the conflict is indirect.

  Therefore, the flaw is in step (4): the fact that there is a Turing machine that fits the finite evidence does not mean that no evidence conflicts with CTT. Evidence conflicts with CTT if it shows that the device's entire input-output function is not computable. But we can never directly observe the entire function. We can, however, have evidence that the function is uncomputable, such as a physical theory that entails uncomputable behavior and is well-confirmed. Then, if we accept that physical theory, we have evidence against CTT. The lookup table doesn't help because it doesn't account for the entire function.

  But Ravi's argument is that CTT itself is not directly testable, but that doesn't make it non-empirical. Many scientific theories are not directly testable.

  Alternatively, we can reject step (3) by arguing that the lookup table is not a reproduction of the device's behavior because the device is supposed to work for all inputs, and the lookup table does not. Therefore, the lookup table does not satisfy the CTT because it does not reproduce the behavior for all inputs. So step (3) fails.

  This is a key point: the CTT requires a Turing machine that reproduces the behavior for all inputs. The lookup table for E only reproduces the behavior for the inputs in E. So it does not meet the requirement of CTT. Therefore, step (3) is invalid.

  However, Ravi might say: but we only have evidence for the inputs in E. So for the evidence we have, the lookup table works. And we can never have evidence for all inputs. So we can never have evidence that the device's entire behavior is not computable. Therefore, we can never falsify CTT. But that doesn't mean it's not empirical; it just means it's not falsifiable by direct observation. But then again, the same is true for many scientific laws.

  But the user's concern is that the argument proves too much. So we must either:

  - Accept that no universal generalization has empirical content (which is unacceptable).
  - Reject the argument by finding a flaw.

  The flaw I see is in step (3): the lookup table does not reproduce the device's behavior; it only reproduces the behavior for the inputs in E. The CTT requires reproduction for all inputs. So the lookup table does not satisfy CTT unless the device only ever receives inputs in E. But the device is capable of handling any input. Therefore, the existence of the lookup table does not show that CTT holds for the device; it only shows that for the finite set E, the behavior is computable. This is trivial and does not bear on CTT.

  Therefore, step (3) is irrelevant to CTT. Step (4) then does not follow: the fact that there is a Turing machine for E does not mean that no evidence conflicts with CTT. For example, if we have a physical theory that predicts that the device will produce an uncomputable output for some input, and then we test it on that input and it does, then we have evidence that the entire function is uncomputable. But note: we can never be absolutely sure because we haven't tested all inputs, but that is the nature of induction.

