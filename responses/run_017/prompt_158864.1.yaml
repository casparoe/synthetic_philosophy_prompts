  Below is a structured specification for an adequate decision procedure in infinite ethics, tailored to your requirements. The requirements are derived from core paradoxes, edge cases, and your custom criteria. I've marked non-negotiable requirements (widely agreed as essential) versus contentious ones (where philosophical camps diverge), flagged potential conflicts, and identified which requirement eliminates the most views. The focus is on formal adequacy, not endorsing any specific theory.

  ---

  ### **Core Requirements (Non-Negotiable)**
  These are necessary for any minimally coherent procedure. Failure here leads to logical inconsistency or indefensible arbitrariness.

  1. **Permutation Invariance (Anonymity)**  
     **Case**: Reshuffling utility values across locations shouldn't change world evaluations.  
     **Requirement**: The procedure must yield identical verdicts for worlds differing only by a permutation of utilities.  
     **Why non-negotiable**: Violations imply moral relevance depends on arbitrary spatial/temporal labels.

  2. **Order-Independent Aggregation**  
     **Case**: Worlds where net utility converges to different values (or diverges) based on summation order (e.g., alternating +1/-1 vs. grouped positives/negatives).  
     **Requirement**: Evaluations must not depend on the order in which locations are aggregated. Limits, if used, must be invariant under reordering.  
     **Why non-negotiable**: Order-dependence makes valuations non-objective.

  3. **Finite Pareto Dominance for Acts**  
     **Case**: Acts affecting only finitely many locations, where one act is better than another at every affected location.  
     **Requirement**: If act A dominates act B in a finite set of affected locations and matches B elsewhere, A must be strictly better than B.  
     **Why non-negotiable**: Rejection collapses to "no act matters," violating basic decision theory.

  4. **Distinction Between Indifference and Incomparability**  
     **Case**: Worlds with identical infinite utility patterns (e.g., both contain ℵ₀ good and ℵ₀ bad lives) vs. worlds with no consistent aggregation (e.g., conditionally convergent series).  
     **Requirement**: The procedure must distinguish:  
     - *Indifference*: A and B are equally good (e.g., permutation clones).  
     - *Incomparability*: No verdict between A and B (e.g., failure of convergence).  
     **Why non-negotiable**: Conflating these leads to false precision or paralysis.

  ---

  ### **Contentious Requirements (One Camp's Taste)**
  These address debated issues; some theories reject them to avoid impossibility results.

  5. **Invariance to Cardinality Shifts**  
     **Case**: Worlds with identical cardinalities of good/bad lives but different distributions (e.g., densely packed good lives vs. evenly spaced).  
     **Requirement**: The procedure should sometimes judge one such world better than another (e.g., via density measures).  
     **Taste-based**: Permutation invariance (Req 1) forces indifference here. Rejecting this requirement allows all such worlds to be deemed equal.

  6. **Act Evaluation Under Partial Control**  
     **Case**: Acts that alter finitely many locations, but the background world is infinite (e.g., adding one good life to an infinite universe).  
     **Requirement**: The procedure must deliver "better/worse/equal/incomparable" verdicts for acts, not just whole-world comparisons.  
     **Taste-based**: Some theories (e.g., fanaticism) prioritize background utility, making act evaluations irrelevant.

  ---

  ### **Your Custom Requirements (Conditional Adequacy)**
  Kept only if they align with real ethical constraints. All are defensible but may conflict with non-negotiable requirements.

  7. **Coarseness Invariance**  
     **Case**: Spacetime carved into fine-grained (person-moments) vs. coarse-grained (whole lives) locations.  
     **Requirement**: Evaluations must be invariant under recarving, assuming utilities are additive across subdivisions.  
     **Real?**: Yes—prevents "atom manipulation" paradoxes where slicing locations changes verdicts.  
     **Taste note**: Non-negotiable if utilitarianism is assumed; negotiable for non-additive theories.

  8. **Non-Triviality Under Cloned Agents**  
     **Case**: Infinitely many identical agents running the same rule, each affecting a finite patch (e.g., planetary managers in a multiverse).  
     **Requirement**: The procedure must output non-trivial verdicts (e.g., "create good lives" dominates "create bad lives") without retreating to "you only affect finitely much."  
     **Real?**: Yes—tests whether the procedure avoids impotence arguments.  
     **Taste note**: Rejected by "finitarian" views but essential for cooperative ethics.

  9. **Graceful Degradation for Uncertainty**  
     **Case**: Agent is unsure if the world is infinite (e.g., 70% chance of infinite locations).  
