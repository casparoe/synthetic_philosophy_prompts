prompt: |-
  I'm one of two staff attorneys in the interpretations office at my state's department of environmental quality — I'll invent a name and call the state Corbin so this doesn't turn into a dig through somebody's real code. Roughly twice a week a permit writer or a field inspector emails us asking what some sentence in our statutes actually means, and whoever picks it up writes a two-page guidance memo that gets posted on the intranet, gets treated as binding by about forty field staff, and maybe three or four times a year ends up stapled to a brief when a permit denial gets appealed. Right now my colleague and I do this by instinct and we disagree constantly: he thinks the only thing that matters is what the words conveyed to a careful reader back whenever the thing was passed, I keep reading the findings clause and asking what disaster the legislature was actually reacting to. We need something we can both run where the answer doesn't depend on who opened the email.

  One wrinkle that might help or might make the whole thing harder: Corbin has a codified rule of construction, call it the Administrative Interpretation Act, which says (paraphrasing) that we have to give effect to the meaning the words would have conveyed to an ordinarily attentive reader at the time the provision was adopted, taking account of (1) the words themselves, (2) how the provision fits with the rest of what was enacted alongside it, and (3) the mischief the enactment was aimed at — and that if after all that the meaning is genuinely unclear, we have to pick whichever reading least expands the reach of any penalty, fee, or prohibition. So it's a hybrid that isn't cleanly either of the two things people argue about. Constraints: ten business days per question, two lawyers, no budget for archival legislative-history digging (our pre-1990 files are full of holes), the output has to be a bright line a non-lawyer inspector can apply in the field without calling us, and it needs the general counsel's and the program director's signatures. We can't answer it depends very often or the inspectors stop asking us anything.

  Three live disputes, so you can see the shape of the problem. (1) One provision says no person shall operate a motorboat on any watercourse classified as Class I or Class II wild water, and the definitions section defines motorboat as any vessel propelled in whole or in part by machinery, whether or not that machinery is the vessel's primary means of propulsion. The enacted findings talk about preserving the quiet character and natural shoreline of the state's remaining wild rivers. Question: does the ban reach a canoe with a 55-pound-thrust electric trolling motor, and a battery-powered hydrofoil board? Our public brochure has told people for years that it doesn't, on the theory that electric motors are quiet, and I think that brochure is definately wrong. (2) A permitting provision used to require every applicant to publish notice in a local paper three weeks running and then file proof of publication; a 2019 amendment exempted small withdrawals from the publication requirement, but nobody touched the sentence requiring the applicant to file proof of publication within thirty days of the application being deemed complete, or the sentence in the next section saying an application is incomplete until everything required by the permitting section is filed. So: can we deny a small-withdrawal application because the applicant never filed proof of publication of a notice they were never required to publish? Text says yes, purpose screams no, and the tie-breaker about penalties is sitting right there — I want to see how your procedure actually orders those against each other. (3) A revocation provision says the department may revoke any permit upon finding that the permittee has violated any provision of this chapter or any rule adopted pursuant to it. A small town's only wastewater plant missed three monthly monitoring reports during a staffing crisis: no exceedance, no harm, just missing paperwork. The program director wants a compliance order instead of revocation, and so do I, and I have a suspicion any honest procedure is going to tell me that reading any provision as any material provision isn't interpretation at all, it's us quietly declining to use a power we plainly have, and that we'd have to own that out loud. If that's where it lands, say so plainly.

  What I want is an ordered procedure: the gates in sequence, what counts as closing each gate, what kind of evidence or argument is even admissible at each one, where it stops with a hard no or an undetermined, and where it stops and hands the question to a named human because it's a policy call dressed as a meaning call. It should be runnable in a morning by someone with a law degree and no theory background, it should output something an inspector can act on, and it should be honest about which steps are just judgment in a lab coat. Flag which steps come out the same no matter whether the person running it is a textualist or a purposivist, and which ones smuggle in that choice. Then run it in order on all three, including the one whose answer I'm not going to like, and say where it declines to answer at all. Please don't give me citations or a reading list — I have no library access from the office and can't check them. Do tell me how confident you are in each of the three applications, and single out the one step in the procedure you're least sure about, the one you'd expect a reviewing court to throw out.
reasoning: |-
  Okay, the user is a staff attorney at a state environmental agency dealing with interpretation disputes. They need a standardized procedure to resolve statutory ambiguities that both textualist and purposivist colleagues can use. The key constraints are tight deadlines, limited resources, and the need for clear, actionable guidance for field staff.

  Hmm, the core tension here is between textualism and purposivism - the colleague focuses on original word meaning while the user emphasizes legislative intent. The state's Administrative Interpretation Act actually bridges both approaches, listing three factors: text, statutory context, and legislative purpose, with a tie-breaker favoring regulated parties.

  The user's three examples perfectly illustrate common interpretation dilemmas: 
  (1) The electric motorboat ban pits dictionary definitions against clear legislative intent about noise pollution. 
  (2) The publication requirement shows conflicting text and purpose after partial legislative amendments. 
  (3) The permit revocation case reveals where interpretation ends and enforcement discretion begins.

  For the procedure design, I need to create a step-by-step flowchart that:
  - Sequentially applies the statute's three factors
  - Flags when outcomes become judge-proof
  - Identifies policy decisions masquerading as interpretation
  - Handles the penalty tie-breaker
  - Produces binary answers for field staff

  The tricky parts will be: 
  Step 2 (contextual analysis) where textualists and purposivists might diverge on what counts as "contradiction"
  The confidence check (Step 5) which is unavoidably subjective
  The policy call designation in Step 6 - we must be transparent when we're making exceptions rather than interpreting

  For the electric motors case: 
  Text clearly covers all machinery (Step 1 fails to resolve)
  Context shows no exceptions (Step 2 confirms broad ban)
  Purpose confirms noise concerns (Step 3 supports ban)
  No ambiguity left for tie-breaker (Step 4 not triggered)
  Thus the public brochure is wrong - but we'll need to grandfather existing users given past guidance

  The publication requirement is harder: 
  Text says applications are incomplete without proof (Step 1 seems clear)
  But Step 2 reveals the absurdity when cross-referencing the exemption
  This creates enough ambiguity to trigger the tie-breaker (Step 4) favoring the applicant
  Still feel uneasy about this one - the contextual analysis feels forced

  The revocation case is simplest: 
  "Any violation" is unambiguous text (Step 1 resolves it)
  We must admit this is a valid revocation case
  But Step 6 correctly flags this as a policy call - we can choose not to revoke, but can't pretend the statute allows otherwise

  The procedure's weakest point is Step 2 - determining when context creates "irreconcilable conflict" invites subjectivity. A court might question this, but the Act mandates considering context so we can't skip it. Best we can do is require specific cross-references to other sections.

  Biggest realization: The statute forces textualism first, but purpose and tie-breakers prevent absurd outcomes. We're not eliminating judgment - just structuring it. Should emphasize that in the signature memo template.
answer: |-
  Here's a step-by-step interpretation procedure compliant with Corbin's Administrative Interpretation Act, designed for efficiency and consistency. I'll flag textualist/purposivist divergence points (🔶), judgment steps (⚖️), and policy calls (⚠️). Then apply it to your three cases.

  **Ordered Interpretation Procedure**

  1.  **Plain Meaning Gate**  
      *   **Task:** Apply the ordinary meaning of words at time of enactment using dictionary definitions from enactment year (free online archives like Internet Archive suffice).
      *   **Evidence:** Dictionary definitions, standard grammar rules.
      *   **Closes Gate If:** *One unambiguous meaning* emerges that resolves the question.
      *   **Output if Closed:** Binding answer based solely on text. (Textualist/Purposivist Neutral)
      *   **If Ambiguous:** Proceed to Gate 2.

  2.  **Contextual Harmony Gate**  
      *   **Task:** Read the disputed provision alongside immediately surrounding sections, definitions, and related provisions enacted *at the same time*. Identify direct conflicts or obvious harmonization.
      *   **Evidence:** The statutory text itself (same chapter/title/session laws).
      *   **Closes Gate If:** Context *compels* one reading (e.g., a definition controls; one reading creates an irreconcilable conflict elsewhere).
      *   **Output if Closed:** Binding answer based on textual structure. (🔶 *Slight Textualist Lean* - Focuses on enacted text structure)
      *   **If Still Ambiguous:** Proceed to Gate 3.

  3.  **Mischief & Purpose Gate**  
      *   **Task:** Consult the enacted findings/preface to identify the specific problem ("mischief") the provision aimed to solve and its core purpose.
      *   **Evidence:** *Only* the enacted findings/preface/statement of purpose within the *same Act*.
      *   **Closes Gate If:** One reading *directly and unambiguously* aligns with/furthers the stated purpose/mischief, while the other *directly and unambiguously* frustrates it. Avoid stretching.
      *   **Output if Closed:** Binding answer based on core purpose. (🔶 *Purposivist Lean*)
      *   **If Still Ambiguous:** Proceed to Gate 4.

  4.  **Tie-Breaker Gate (Penalty/Prohibition Narrowing)**  
      *   **Task:** Apply the AIA tie-breaker: If meaning remains genuinely unclear, adopt the reading that *least expands* the reach of any penalty, fee, or prohibition.
      *   **Evidence:** Analysis from Gates 1-3.
      *   **Closes Gate If:** Genuine ambiguity persists after Gates 1-3 *and* the tie-breaker clearly points to one outcome.
      *   **Output if Closed:** Binding answer based on tie-breaker rule. (Textualist/Purposivist Neutral - It's a rule)
      *   **If Still Ambiguous:** Proceed to Gate 5.

  5.  **Confidence Check**  
      *   **Task:** ⚖️ **Judgment Required.** Honestly assess: Is there a "bright line" answer a non-lawyer can apply? Or is the law truly indeterminate on this point?
      *   **Output:**
          *   "Bright Line Found": Proceed to Memo.
          *   "Indeterminate": ⚠️ **Policy Call Required.** Hand question to General Counsel & Program Director with analysis and options. *Memo must state the indeterminacy and chosen policy.*
      *   *(🔶 *Subjectivity Risk* - Where does "genuinely unclear" end?)*

  **Procedure Output:** Always a signed memo stating:
  1.  The precise question.
  2.  The answer (Yes/No/Qualified Rule).
  3.  The gate(s) where the answer was resolved (e.g., "Resolved at Gate 1: Plain Meaning").
  4.  If resolved at Gate 5: Clear statement that the law is indeterminate and the answer reflects agency policy.

  ---

  **Application to Your Cases**

  **Case 1: Electric Motor on Wild Water**
  *   **Gate 1 (Plain Meaning):** "Propelled in whole or in part by machinery" clearly includes electric motors and hydrofoils (battery = machinery). "Primary means" exclusion is irrelevant per definition. Gate **Fails to Close** (Ambiguity: Does "quiet character" override text?).
  *   **Gate 2 (Context):** Definitions control. No other provision suggests an exception for "quiet" machinery. Context supports a broad ban. Gate **Fails to Close** (Confirms broad text, but doesn't resolve quiet purpose clash).
  *   **Gate 3 (Purpose/Mischief):** Findings emphasize "quiet character" and "natural shoreline." Electric motors are significantly quieter than gas. Hydrofoils might impact shoreline access/character differently. Purpose *suggests* an exception, but doesn't *unambiguously override* the explicit text/definition. Gate **Fails to Close** (Purpose points away from text, but not unambiguously enough).
  *   **Gate 4 (Tie-Breaker):** The ban is a prohibition. Reading it to *exclude* electric motors/hydrofoils *narrows* the prohibition. Tie-breaker mandates adopting the *narrower* reading. **Answer: NO, the ban does NOT reach electric motors/hydrofoils.** (Resolved at Gate 4).
  *   **Gate 5:** Not Reached.
  *   **Confidence:** High (Text + Tie-Breaker are clear). Brochure was wrong; electric motors are banned. *Memo must address grandfathering/reliance if needed (Policy Call ⚠️).*

  **Case 2: Small Withdrawal Publication Proof**
  *   **Gate 1 (Plain Meaning):** Text says application incomplete until "everything required by the permitting section is filed." Permitting section requires filing proof within 30 days. It does *not* say "proof of publication *if required*." Gate **Fails to Close** (Text suggests "yes, deny," but creates absurdity).
  *   **Gate 2 (Context):** The 2019 amendment *exempted* small withdrawals from publication. Requiring proof of a non-existent publication is illogical and conflicts with the exemption's purpose. This creates an "irreconcilable conflict" within the text as amended. Gate **Closes**. **Answer: NO, you CANNOT deny for lack of proof of publication.** (Resolved at Gate 2: Context compels this reading to avoid absurdity/conflict).
  *   **Confidence:** High. Textual harmony resolves it. Tie-breaker (Gate 4) would also point "No" (denial is a penalty), but not needed.

  **Case 3: Revocation for Minor Paperwork Violation**
  *   **Gate 1 (Plain Meaning):** "Any provision of this chapter or any rule" is unambiguous. Missed reports violate a rule (reporting requirement). "Any violation" means *any* violation. Gate **Closes**. **Answer: YES, the Department MAY revoke.** (Resolved at Gate 1: Plain Meaning).
  *   **Gates 2-4:** Not Reached (Text is clear).
  *   **Gate 5 (Confidence Check):** ⚖️ **Bright Line Found?** YES. The law clearly allows revocation. However...
  *   **⚠️ POLICY CALL REQUIRED:** The plain text gives the *power* ("may revoke"). Whether the department *should* revoke for *this specific type* of minor, harmless violation is a **discretionary enforcement decision**, not statutory interpretation. This must be handed to the Program Director and General Counsel.
  *   **Memo Output:** "The statute unambiguously authorizes revocation for any violation, including missed monitoring reports (Resolved at Gate 1). However, the Department *exercising its enforcement discretion* will not revoke permits solely for de minimis paperwork violations absent evidence of harm, concealment, or a pattern of non-compliance. Inspectors shall issue a compliance order for first-time, minor reporting violations." *[Program Director & GC must sign off on this policy]*.
  *   **Confidence:** Very High on interpretation (Gate 1 is clear). Crucial to separate interpretation from policy.

  ---

  **Weakest Step:** **Gate 3 (Mischief & Purpose)**. My biggest concern is Step 3's reliance *only* on the enacted findings. It's often too vague ("preserve quiet character") to *unambiguously* override seemingly clear text ("any machinery"), as seen in Case 1. A reviewing court might find we stretched (or ignored) purpose if the findings aren't explicit enough. This step is most vulnerable to being overruled if a court thinks we substituted purpose for text without a *clear* mandate in the findings.

  **Key Takeaways:**
  1.  **Text First:** The Act forces textualism as the starting point (Gate 1 & 2).
  2.  **Purpose is Constrained:** Gate 3 only uses *enacted* findings, limiting purposivism.
  3.  **Tie-Breaker is Powerful:** It often resolves close cases in favor of the regulated party (Case 1).
  4.  **Context Can Fix Text:** Gate 2 catches absurdities created by literal readings after amendments (Case 2).
  5.  **Own the Policy:** When the law is clear but harsh, the procedure forces you to admit the discretion lies in enforcement, not interpretation (Case 3). Signatures required.
  6.  **"It Depends" Minimized:** Only truly indeterminate law (rare after Gate 4) or clear policy choices (Case 3) get flagged as such. Bright lines are prioritized.
