prompt: |-
  I've been lurking around the rationalist corner of the internet since the Sequences days and I now haunt the comments of every "can these models actually reason" thread, which is where this started: someone posted a set of Bongard problems — the ones from the old Soviet pattern-recognition book, six little figures on the left that share some property, six on the right that don't, guess the rule — and said solving them is the cleanest remaining test of genuine concept induction, because you get twelve examples and nothing else to go on. A friend of mine said that's just overfitting with extra steps: a system that labels the held-out figures right has found a discriminating feature, not induced a concept. I think she's half right and half wrong in an interesting way, and I want to spend a year on it, so I'm applying for a one-year research fellowship and need a proposal of about four pages.

  Here's the half-formed idea I want turned into one. Start with a structural point about the problems themselves: in a good chunk of them the right-hand class has no positive description at all, it's just "not that" — a catch-all — whereas in the bilateral ones both sides instantiate their own rule and the two rules are systematically related (one is the negation, or the same thing with a feature swapped, or the same relation with the roles reversed). Those two kinds of problem seems to demand different things: the catch-all kind looks solvable by one-class modelling or novelty detection without ever representing the contrast, the bilateral kind doesn't. So my first move is to split any benchmark along that axis and check whether the ordering actually shows up (and whether training on bilateral problems transfers to catch-all ones and not the other way round). Second move: the rule is radically underdetermined by twelve examples — Goodman's new riddle, grue and all that — but nobody in these arguments talks about the thing that does the work in real induction, which is some ordering over the candidate rules that makes some of the consistent predicates projectile and the rest mere curve-fitting. My suspicion is that "induced the concept" is being used to mean three separable things — found a discriminating feature, got something that supports counterfactual and generative uses, and represented the space of alternative rules with its simplicity structure — and that current systems plausibly get the first, partly get the second, and don't get the third, and that the third is the one doing the philosophical work. If you think my bilateral/catch-all cut is the wrong axis, or that it's a rediscovery of something obvious, say so and propose a better one, but I don't want a literature review — I'll fill in citations myself.

  What I need the proposal to actually contain: the question stated precisely enough that a year's work could come out either way; why the two positions in that comment thread (and the standard "few-shot concept learning" framing more generally) leave it open; the method month by month for twelve months, including what I'd build myself — I have a modest GPU budget and some ability to generate synthetic figures programmatically, but I am not training anything from scratch, so the design has to be probes and evaluations run against existing open models plus synthetic sets I construct, and I want you to be concrete about how I'd construct sets that control for the things that need controlling (the discriminating-feature confound, the verbalization confound, the possibility that a model just recites a rule it can't use); what the deliverable is for people who actually build and report these benchmarks, as opposed to another philosophy paper nobody reads; and an honest failure section — both the empirical failure (the probes dissociate, passing one doesn't predict passing another, no clean story) and the conceptual one (the three-way distinction collapses, or "concept" turns out to be doing no work here), with some indication of what pattern of results would push me to which conclusion. Also tell me what to cut: I have a bad habit of scoping these things like a five-year project and then recieving a polite rejection.
reasoning: |-
  Okay, the user is working on a research proposal about Bongard problems and concept induction. They've been part of the rationalist community since the Sequences days and are familiar with the debates around AI reasoning. Their friend argued that solving Bongard problems is just overfitting, but the user thinks there's more to it. They want to explore whether current AI systems can genuinely induce concepts or if they're just finding discriminating features.

  First, I need to understand their core argument. They mention that Bongard problems come in two types: catch-all (right side is just "not left") and bilateral (both sides have defined rules). The user believes these require different cognitive processes. Their hypothesis is that true concept induction involves not just discrimination but also supporting counterfactuals and understanding the simplicity structure of possible rules.

  The user needs a structured proposal. They want a clear research question, methodology, deliverables, and failure scenarios. They also mentioned avoiding scope creep, so I should focus on a feasible one-year plan. They have a GPU budget and can generate synthetic data but won't train models from scratch.

  Breaking it down: The key is to split Bongard problems into catch-all vs. bilateral and test AI systems on three aspects: discrimination, counterfactual/generative use, and rule space representation. The methodology should include creating synthetic datasets, probing existing models (like CLIP or LLMs), and designing evaluations that separate the three capabilities.

  Potential pitfalls include models performing well on discrimination but failing on counterfactuals, or the three aspects not dissociating as expected. The user also wants practical deliverables for benchmark designers, not just a philosophy paper.

  I should outline a month-by-month plan. Months 1-3: Problem curation and dataset generation. Months 4-6: Discrimination testing. Months 7-9: Counterfactual/generative tasks. Months 10-12: Rule space representation analysis. Each phase needs specific tasks and evaluations.

  For deliverables, creating a diagnostic framework and benchmark guidelines would be useful. Failure modes: if no dissociation between problem types or capabilities, it might mean the distinction isn't valid. Or if models pass all tests, their "concept induction" might be similar to humans'.

  Need to ensure the proposal stays focused. Cut deep dives into Goodman's riddle or detailed literature reviews. Emphasize the experimental design and concrete evaluations. Mention controlling confounds like verbalization by using non-verbal probes.
answer: |-
  Here’s a focused, feasible one-year proposal structured to avoid scope creep while addressing your core philosophical and empirical questions. It centers on dissecting "concept induction" in Bongard problems (BPs) through the lens of **bilateral vs. catch-all problem types** and **three distinct capability axes**.

  ---

  ### Research Proposal: Dissecting Concept Induction in Bongard Problems  
  **Can AI Systems Induce Concepts or Merely Discriminate Features? A Test via Bongard Problem Typology**

  #### 1. Core Question & Hypothesis  
  **Question:** When AI systems solve Bongard problems, do they exhibit capabilities beyond feature discrimination—specifically, counterfactual reasoning and representation of rule simplicity structure—and do these capabilities dissociate across *bilateral* (two defined rules) vs. *catch-all* (one rule + negation) problem types?  

  **Hypothesis:**  
  - Systems will solve *catch-all* BPs via feature discrimination alone.  
  - *Bilateral* BPs will require counterfactual reasoning and implicit rule-space modeling.  
  - Current models (e.g., VLMs, LLMs) will show:  
    - Strong discrimination in both types.  
    - Limited counterfactual/generative ability, stronger in bilateral.  
    - No robust representation of rule simplicity structure.  

  #### 2. Why Existing Framings Fall Short  
  The "few-shot concept learning" paradigm conflates three distinct capabilities:  
  1. **Discrimination:** Labeling held-out instances correctly (solved by feature detection).  
  2. **Counterfactual/Generative Use:** Predicting variations ("If figure X had property Y, would it belong to left/right?") or generating new valid instances.  
  3. **Rule-Space Representation:** Encoding a simplicity-ordering over candidate rules (e.g., "all convex" > "grue-like" rules).  
  Your friend’s "overfitting" critique applies only to (1). Bilateral BPs probe (2) and (3), which constitute *genuine induction*.  

  #### 3. Methodology: 12-Month Plan  
  **Core Assets:**  
  - **Synthetic BP Generator:** Python tool generating BPs with controllable parameters (e.g., shape, topology, symmetry). Labels each problem as *bilateral* or *catch-all*.  
  - **Probe Datasets:** Curated BPs + evaluations for (1) discrimination, (2) counterfactuals, (3) rule-space probing.  
  - **Models:** Open VLMs (CLIP, LLaVA), LLMs (GPT-4, Claude, open-source), probed via API/local inference.  

  **Monthly Breakdown:**  
  | **Months** | **Phase** | **Tasks** | **Deliverable** |  
  |------------|-----------|-----------|-----------------|  
  | 1–3 | **Problem Curation & Generation** | - Annotate existing BP sets (e.g., [Bongard-HOI](https://github.com/nrclark/Bongard-HOI)) by type.<br>- Generate 500 synthetic BPs (250 bilateral, 250 catch-all). Control: visual complexity, verbalizability. | Dataset v1.0; typology taxonomy. |  
  | 4–6 | **Capability 1: Discrimination** | - Test models on held-out BP classification. Metric: Accuracy per problem type.<br>- *Control confounds*: Run with masked text (image-only); add distractor features. | Performance split: catch-all ≈ bilateral → discrimination suffices for both. |  
  | 7–9 | **Capability 2: Counterfactual/Generative** | - **Counterfactual Q&A:** "If [figure] lost/gained [feature], would it switch sides?"<br>- **Generation:** "Sketch a new left/right instance." (Evaluate via VLM similarity).<br>- Test only on bilateral BPs. | Gap: High discrimination + low counterfactual accuracy → no concept induction. |  
  | 10–12 | **Capability 3: Rule-Space Structure** | - **Rule Simplicity Probe:** Feed models 3-5 candidate rules per BP (varying simplicity). Ask: "Which rule is simplest?"<br>- **Goodman-style Test:** Inject "grue" rules (e.g., "convex before t=12, concave after"). | Success: Models prefer simpler rules *and* reject grues. Failure: Random or complexity-insensitive choices. |  

  #### 4. Deliverables (For Benchmark Builders)  
  - **Diagnostic Framework:** A BP evaluation suite scoring models on 3 axes (discrimination, counterfactual, rule-space).  
  - **Typology Guidelines:** When constructing BPs:  
    - Use *bilateral* to test induction.  
    - Avoid catch-all if claiming "concept learning".  
    - Include counterfactual/rule-simplicity tasks.  
  - **Open Artifacts:** Code for BP generation, probes, and model evaluation.  

  #### 5. Failure Modes & Interpretation  
  - **Empirical Failure (Likely):**  
    - **No dissociation:** Models perform similarly on bilateral/catch-all → typology is irrelevant (cut future work).  
    - **No counterfactual/rule-space ability:** Confirms systems only discriminate (your friend is right).  
    - **Unexpected success:** Models ace counterfactuals + rule-space → reevaluate "genuine induction" claims.  
  - **Conceptual Failure (Possible):**  
    - The 3 capabilities are inseparable → "concept" is monolithic (unlikely given prior psychology).  
    - Rule-space representation is not necessary for induction → retreat to discrimination + counterfactuals.  

  #### 6. Strategic Cuts  
  - **DO NOT:** Replicate human experiments, train new models, or deeply engage with Goodman (beyond grue tests).  
  - **MINIMIZE:** Literature review (cite key: Lake ‘15, Mitchell ‘23, Barbu ‘19), philosophical justification.  
  - **FOCUS:** Synthetic data, controlled probes, model comparisons.  

  ---

  ### Why This Works for a 1-Year Fellowship  
  - **Scope:** 3 clear phases (curation → discrimination → advanced capabilities), each with concrete outputs.  
  - **Leverage:** Uses existing models + synthetic data; no training needed.  
  - **Novelty:** The bilateral/catch-all axis is underexplored and falsifiable.  
  - **Impact:** Delivers tools for AI evaluators, not just theory.  

  **Estimated Budget:** Mostly GPU costs for inference (~$1k). Synthetic data generation: minimal compute.  

  **If Typology is Wrong:** Results showing no performance split will refute it in Month 6—still a publishable null result. Proceed with Capabilities 2/3 as planned to dissociate discrimination from induction.  

  ---  
  **Final Pitch:** This cuts through the "can they reason?" noise by treating "concept" as a composite of testable capabilities and using BPs as the scalpel. Whether the bilateral/catch-all distinction holds or not, we get a tractable empirical answer with practical benchmarking implications.
