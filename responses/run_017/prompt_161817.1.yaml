  ### Grading Report  

  **Part (a) Mark: 6/6**  
  **Part (b) Mark: 5/8**  
  **Part (c) Mark: 4/6**  
  **Total: 15/20**  

  ---  

  ### Margin Comments (Keyed to Specific Phrases)  
  *(✔ = Correct / Defensible; ✘ = Incorrect / Problematic; △ = Thin/Sloppy)*  

  1. **"Commensurable here just means there is one scale... you can add them up"**  
     *[Line 1, Part (a)]*  
     **✔ Correct.** Clear definition captures commensurability as a single scale for aggregation, not tradeability.  
     *Defensible:* Strong answers might add that commensurability permits *comparison* of magnitudes but not *substitution* in value.  

  2. **"LTNU is not committed to there being some enormous finite N... not a lexical view"**  
     *[Line 6, Part (a)]*  
     **✔ Correct.** Vital distinction: lexical ordering explicitly rejects finite trade-offs.  
     *Defensible:* Could note that commensurability enables the *calculation* of tiers while lexical ordering denies *compensation*.  

  3. **"The strongest objection is the discontinuity objection... 'one pinprick outweighs a galaxy of bliss'"**  
     *[Line 1, Part (b)]*  
     **△ Thin.** Correct objection but misses nuance. *Stronger answers* would distinguish this from *aggregation* objections (e.g., tiny pains summing to priority-tier).  
     *Defensible but incomplete:* Should note LTNU’s fanaticism applies *only* to above-T suffering.  

  4. **"The choice matters — if T were an aggregate threshold... fanatical result"**  
     *[Line 7, Part (b)]*  
     **✔ Correct.** Spot-on about aggregate T reintroducing fanaticism.  
     *Missing:* No discussion of *lifetime* T (e.g., chronic mild pain accumulating). Question explicitly asks if force depends on T-reading—this is underdeveloped.  

  5. **"Represent the priority as, say, 10^100 hedons... maximise as usual"**  
     *[Line 1, Part (c)]*  
     **✘ Incorrect.** Lexicographic orders **cannot** be represented by finite weights without violating lexicality. A large finite weight implies eventual compensation; LTNU forbids this.  
     *Critical flaw:* This misrepresents LTNU’s structure. Expected-value maximization ≠ lexicography.  

  6. **"The lexical clause also gets LTNU out of the repugnant conclusion"**  
     *[Line 6, Part (c)]*  
     **△ Sloppy.** LTNU avoids *one version* of the repugnant conclusion but invites others (e.g., "hellish" populations with sub-T suffering).  
     *Defensible but overstated:* Should note this is contingent on zero above-T suffering.  

  ---  

  ### Key Missing Elements  
  - **(b)** Failed to engage with *all three readings of T* (intensity/lifetime/aggregate). Lifetime T (e.g., chronic pain) weakens the threshold’s defense against discontinuity.  
  - **(c)** No acknowledgment that LTNU’s *strict* lexicality creates decision-theoretic problems under uncertainty (e.g., no guidance when all options risk above-T suffering).  
  - **(b)** No mention of *threshold location arbitrariness* as a distinct objection beyond "boundary problems."  

  ### Final Clarifications  
  - **Surviving objection:** The student implies the *arbitrariness of T’s location* persists (correct), but underplays how this undermines LTNU’s normative appeal.  
  - **Major lapse:** Part (c)’s conflation of lexicality with finite weights is a significant error; it misrepresents the theory’s core mechanic.  

  **Defense Note:** Marks lost in (b) for incomplete T-analysis; in (c) for substantive misstep. Total 15/20 reflects strong (a), adequate (b), weak (c).
