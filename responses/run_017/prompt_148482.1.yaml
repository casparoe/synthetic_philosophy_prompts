prompt: |-
  My friend and I spent about two hours arguing about Memento last night and neither of us budged, so I want a third opinion. He thinks it's just a film about memory being unreliable; I said that's too shallow, and that what it actually dramatizes is what happens to someone who has to run his whole life on knowledge sources he can never audit. Read it through Nyāya epistemology and tell me who's closer.

  Concretely, I want two things worked out. First: Leonard's system of polaroids, notes and tattoos. The notes function as testimony, but the testifier is a past self he can't cross-examine, and the only evidence that the testifier is reliable is more writing from the same unreliable source. So is that a fifth pramāṇa, a distinct kind of self-authored testimony from a self you can't question, or does Nyāya have to fold it into śabda and then disqualify it because the speaker is defective, or at best unverifiable? And remember Nyāya is parataḥ prāmāṇya about this: validity gets established from outside the cognition, by inference from the reliability of whatever produced it or by whether acting on it works out. Leonard's setup seems designed so that the outside check never arrives, and when evidence of failure does show up he destroys it. Does that mean the honest Nyāya verdict is that he basically never has knowledge, or that he has too much of it?

  Second, the Sammy Jankis stuff. I think the film is secretly a study of upamāna: Leonard comes to understand his own condition by comparison with a case he's told is merely similar, and the gut-punch is that the analogue was never other than the thing itself. Is that a legitimate use of upamāna, or am I forcing it?

  Two more constraints on the answer. Say where the reading breaks: which scene would you actually point to as the one where the Nyāya framing does real work instead of just relabeling what's on screen, and is there a scene where it distorts the film? And no theorizing that depends on the viewer remembering exact lines, I've only seen it twice and I'll get them wrong anyway. If you think Nyāya is doing no real work here and my friend was basically right, say so, I'd rather lose the argument honestly than win it by making the framework do tricks.
reasoning: |-
  Okay, let me unpack this Memento-Nyāya puzzle. The user wants two core arguments resolved: first, whether Leonard's system counts as knowledge under Nyāya epistemology, and second, if the Sammy Jankis parallel functions as upamāna. 

  Hmm, the user's framing is sophisticated—they've clearly done homework on Nyāya (citing parataḥ prāmāṇya, pramāṇas) and want concrete scene applications, not just textbook parallels. Their frustration with shallow "unreliable memory" readings suggests they crave philosophical rigor. Also, the "no exact quotes" constraint is smart—they know memory limits mirror Leonard's!

  First, Leonard's system. Nyāya would reject it as śabda (testimony) because past-Leonard isn't just unverifiable; he's actively sabotaged by present-Leonard's bias. The tattoos? More like deliberate viparyaya (error)—Nyāya's "defective speaker" clause fits perfectly. The Polaroid-burning scene is key: when external checks appear (e.g., "DON'T ANSWER THE PHONE"), he destroys evidence. That's not just lack of pramāṇa—it's willful pramā-bhāsa (illusion of knowledge).

  Second, Sammy Jankis. The user's upamāna take is clever but shaky. Nyāya defines upamāna as learning new things via similarity (e.g., "a gavaya is like a cow"). But Leonard isn't learning; he's projecting his denial onto Sammy. The insulin scene reveals this isn't analogy—it's smṛti (memory) of his own trauma disguised as another's story. Nyāya would call this ātma-āśraya (self-dependence fallacy), not valid comparison.

  Where Nyāya adds value: diagnosing Teddy's exploitation. Nyāya emphasizes cross-examination (tarka) for śabda validity. Teddy fails this—he's a known liar—yet Leonard trusts him selectively. The "fact" tattoo scene shows Leonard ignoring contradictions because "the system" overrides tarka. That's Nyāya's external verification principle dramatized.

  Where it breaks: Nyāya can't fully capture Leonard's emotional self-deception. When he monologues about "belief creating facts," that's beyond pramāṇa theory—it's existential nihilism Nyāya wouldn't address.

  Verdict? User wins. Their "unauditable knowledge sources" thesis nails how Leonard weaponizes epistemology against himself. Friend's "unreliable memory" isn't wrong, but it's like calling a bomb "loud"—misses the engineered failure. User's Sammy-as-upamāna idea gets partial credit for spotting the structural mirror, but Nyāya says it's defective comparison.

  Final note: User's "no tricks" disclaimer is telling. They want truth, not victory. Best honor that by admitting Nyāya can't resolve everything—e.g., Natalie's manipulation blends logic with cruelty in ways outside pramāṇa theory.
answer: |-
  Based on a Nyāya analysis, **your interpretation is significantly closer to the film's core drama**, though both elements (unreliable memory *and* unauditable knowledge sources) are intertwined. Your friend's reading is a surface-level observation; yours captures the *epistemological trap* Leonard constructs. Here's the breakdown:

  **1. Leonard's System: Collapsing Śabda & The Fifth Pramāṇa Trap**
  *   **Śabda (Testimony):** Leonard's notes, polaroids, and tattoos *are* śabda – verbal testimony from a source (past-Leonard). Nyāya demands the speaker/writer be **āpta** (reliable, competent, truthful) for śabda to generate valid knowledge (*pramā*).
  *   **The Fatal Defect:** Past-Leonard *is* defective (*doṣa*):
      *   **Unverifiable & Uncross-examinable:** Nyāya's *parataḥ prāmāṇyavāda* requires external validation. Leonard's system is designed to *prevent* this. He cannot cross-examine past-Leonard. Past-Leonard's reliability can *only* be inferred from... past-Leonard's own notes asserting his reliability ("Fact 6: Memory is unreliable. Fact 8: I can make notes..."). This is vicious circularity (*ātma-āśraya*).
      *   **Actively Compromised:** Crucially, *present*-Leonard actively *undermines* validation. He selectively ignores contradictions (e.g., Teddy's warnings) and **destroys counter-evidence** (burning the "DON'T ANSWER THE PHONE" polaroid proving Teddy right). He *prefers* the testimony that feeds his purpose, regardless of truth.
  *   **Nyāya Verdict:** Leonard **never has valid knowledge (pramā) from his system under Nyāya.** His cognitions are largely *viparyaya* (error) or *saṃśaya* (doubt), masquerading as certainty. The system generates *pramā-bhāsa* (the mere *appearance* of knowledge), not *pramā*. It's not a "fifth pramāṇa"; it's a *pathological corruption* of śabda where the speaker's defects are inherent and actively shielded from scrutiny. He doesn't have "too much" knowledge; he has a self-sustaining illusion of knowledge. His constant "I know, I know" is the tragic irony.

  **2. Sammy Jankis: Upamāna or Projected Smṛti?**
  *   **Your Upamāna Insight:** It's perceptive but slightly forced within strict Nyāya. Upamāna typically involves learning something *new* about an *unfamiliar* thing (X) by comparing it to a *familiar* thing (Y) based on similarity. Leonard uses Sammy (Y) to understand his *own* condition (X), which seems fitting.
  *   **The Nyāya Problem:** Nyāya defines upamāna as the knowledge arising from the perception of similarity *after* being given the comparison ("a gavaya is like a cow"). Leonard isn't *learning* about his condition *through* Sammy; he's *projecting* his denial and guilt *onto* Sammy.
  *   **The Gut-Punch & Nyāya:** The revelation isn't primarily about the *failure of comparison* (upamāna) but about the **nature of Leonard's memory (smṛti)**. Sammy isn't just an analogue; he's the vessel for Leonard's repressed memory (*smṛti*) of his own wife's death and his culpability. The "knowledge" Leonard has of Sammy isn't gained *by* comparison; it's a *distorted recollection* serving as a shield. The punch is that his understanding of Sammy *was never knowledge* (pramā) *about Sammy*, but a *defective memory* (viparyaya/smṛti error) *about himself*. Nyāya would see this less as flawed upamāna and more as a catastrophic failure of smṛti compounded by self-deception (*moha*).

  **Where Nyāya Does Real Work (The Scene):**
  *   **The Polaroid Burning Scene:** This is the Nyāya critique crystallized. When presented with śabda (the "DON'T ANSWER THE PHONE" polaroid) that *falsifies* his existing belief (that Teddy killed his wife) and *validates* an external source (Teddy's testimony), Leonard actively *destroys* the evidence. Nyāya's demand for external verification (*parataḥ prāmāṇyavāda*) is met not with scrutiny but with obliteration. He prioritizes the coherence of his internal, unauditable system (the tattoos, his narrative) over any external check. This isn't just "unreliable memory"; it's the *deliberate sabotage of verification*, making genuine pramā impossible. Nyāya explains *why* this act is epistemically suicidal.

  **Where Nyāya Distorts/Is Limited:**
  *   **The Final Twist/Motivation:** Nyāya focuses on the *process* of knowing. It brilliantly diagnoses Leonard's epistemic failure but is less equipped to fully articulate the *psychological why* – the overwhelming grief, guilt, and need for purpose that *drive* him to construct and maintain this self-deceptive system. The scene where Leonard monologues about "needing a purpose" or the final "Leonard, you know..." line reveals a dimension (existential need trumping truth) that Nyāya, as an epistemology, doesn't directly address. Your friend's "unreliable memory" is part of this, but it's the *foundation* for the far deeper epistemic prison.

  **Verdict:**
  *   **You win the core argument.** Your "unauditable knowledge sources" thesis captures the *active, systemic epistemological trap* Leonard is in, perfectly illuminated by Nyāya's rigorous demands for verifiable sources and external validation. The film dramatizes the *consequences* of living entirely within unauditable śabda.
  *   **Your friend isn't *wrong*, but it's incomplete.** Unreliable memory (*smṛti*) is the *premise*, but the film explores the terrifying *epistemic system* built upon that premise. Nyāya shows *why* and *how* that system fails as a source of knowledge.
  *   **Your Upamāna point gets partial credit.** While not perfectly fitting Nyāya's definition, you correctly identify the structural mirroring and its devastating collapse. Nyāya helps clarify that the failure is rooted more in defective memory and projection than a flawed comparison *per se*.

  **Conclusion:** Nyāya provides powerful tools to dissect Leonard's epistemic nightmare. It confirms his system cannot generate valid knowledge (pramā) due to the inherent and actively protected defects in his sole source of śabda (past-self). The Sammy Jankis narrative is exposed as a projection of repressed memory, not valid comparison. The framework excels in showing how Leonard's actions (like burning evidence) actively prevent the external verification Nyāya requires, making his "knowledge" a sustained illusion. Your interpretation leverages this framework to reveal the profound epistemological tragedy at Memento's heart. Your friend's reading describes the starting point; yours, using Nyāya, diagnoses the fatal disease.
