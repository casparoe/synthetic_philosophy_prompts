  - Purity (freedom from after-pains)
  - Extent (number affected)
  Plus his concepts of primary mischief (direct harm) and secondary mischief (alarm/danger to society). Crucially for sexuality, I must consider his rejection of pains from mere disapproval as legitimate grounds for prohibition.

  For the scoring system, Column A represents unreformed society with existing prejudices and laws. Column B removes legal sanctions but keeps social disapproval. Column C is the idealized state where even irrational social disapproval is eliminated. The user wants me to commit to specific numbers - no hedging - which is challenging but necessary.

  Looking at the cases:
  Case A seems to have near-zero mischief in Column C since it's consensual, private, and causes no harm. 
  Case B adds the mischief of non-consensual exposure to neighbors. 
  Case C involves adultery but without direct harm - though the deception might qualify as secondary mischief. 
  Case D's mischief stems entirely from false beliefs about the clergyman. 
  Case E has clear coercion due to material dependence. 
  Case F involves psychological compulsion and regret. 
  Case G creates non-consensual spectatorship. 
  Case H is deceptive by nature. 
