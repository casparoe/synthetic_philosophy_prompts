  The criminalization threshold is tricky. Bentham would likely set it where clear, direct harm occurs - probably around 30 in my scoring where coercion begins. This puts Cases E and G above the line.

  The fraction calculation shows how much of traditional sexual morality stems from irrational disapproval - I'm landing at 0.85 meaning 85% of perceived mischief disappears when we remove prejudice. This strongly supports the user's position against their friend.

