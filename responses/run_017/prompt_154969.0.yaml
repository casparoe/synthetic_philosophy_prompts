answer: |-
  ### Brainstorming: Benthamite Considerations  
  - **Intensity/duration of pleasure/pain**: Directly relevant. Keep.  
  - **Certainty/uncremoteness**: Relevant to risk of harm. Keep.  
  - **Fecundity**: Pleasure/pain leading to further consequences. Keep.  
  - **Purity**: Freedom from after-pains. Keep (e.g., regret, social fallout).  
  - **Extent**: Number of persons affected. Keep.  
  - **Primary mischief**: Direct harm (physical, psychological, economic). Keep.  
  - **Secondary mischief**: Alarm/danger to society (e.g., eroded trust). Keep only if empirically verifiable.  
  - **Offences against oneself**: Purely self-regarding acts with no collateral harm. Set aside (Bentham rejects punishment for these).  
  - **Pains from mere disapproval**: Set aside (Bentham explicitly discounts these as "groundless antipathy").  
  - **Pains from deception/coercion**: Keep (violate consent/autonomy).  
  - **Pains from non-consensual exposure**: Keep (imposes unwanted experience).  
  - **Pains from false beliefs**: Set aside (Bentham views these as irrational).  

  ---

  ### Scoring Table  
  | Case | Column A (Unreformed) | Column B (No Law) | Column C (No Disapproval) | Rank by C |  
  |------|------------------------|-------------------|---------------------------|-----------|  
  | A    | 70                     | 40                | **0**                     | 1         |  
  | B    | 90                     | 70                | **25**                    | 5         |  
  | C    | 85                     | 60                | **10**                    | 3         |  
  | D    | 95                     | 75                | **0**                     | 1         |  
  | E    | 80                     | 65                | **50**                    | 7         |  
  | F    | 50                     | 35                | **15**                    | 4         |  
  | G    | 90                     | 70                | **55**                    | 8         |  
  | H    | 75                     | 60                | **35**                    | 6         |  
  | I    | 65                     | 45                | **5**                     | 2         |  

  **Tie-break**: A and D tie at rank 1; ranked equally as both have 0 residual mischief in Column C.  

  ---

  ### Column C Rationale (One Sentence per Case)  
  - **A (0)**: No coercion, deception, harm, or non-consensual exposure; purely private act.  
  - **B (25)**: Non-consensual imposition (reading explicit material) causes direct psychological pain.  
  - **C (10)**: Deception violates reasonable expectations (marital trust), causing secondary mischief.  
  - **D (0)**: Congregation’s pain stems solely from false beliefs (discounted).  
  - **E (50)**: Material dependence voids meaningful consent, constituting coercion.  
  - **F (15)**: Agent’s regret and compulsion create internal psychological conflict (after-pains).  
  - **G (55)**: Forced spectatorship imposes non-consensual experience on passers-by.  
  - **H (35)**: Essential deception negates autonomous consent, even if undiscovered.  
  - **I (5)**: Abstract erosion of fidelity is speculative; negligible without identifiable victims.  

  ---

  ### Fraction of Column A Mischief from Bare Thought/Report  
  **0.85** (85% of total Column A scores arise from pains of disapproval, false beliefs, or legal stigma).  

  ---

  ### Criminalisation Threshold  
  **Threshold**: Column C score ≥ 30.  
  **Place in ranking**: Between Case I (5) and H (35).  
  **Why here?** Bentham sanctions prohibition only for acts with clear primary/secondary mischief (coercion, deception, non-consensual exposure). Cases below 30 (A,D,I,C,F,B) lack sufficient direct harm; E (50), G (55), H (35) exceed it due to verifiable violations of autonomy or public order. Threshold avoids punishing acts where harm is speculative (I) or self-regarding (F).  

  ---

  ### Closing Analysis  
  You had the better argument. The hinge is **consistent exclusion of pains dependent on false beliefs or mere antipathy**, which collapses Bentham’s sexual ethics to a harm principle focused on coercion, deception, and non-consensual imposition — not blanket permission. Column C scores confirm residual mischief exists in 7/9 cases, primarily from these violations. Your fraction (0.85) quantifies Bentham’s "demolition" of extrinsic factors, but the threshold (≥30) proves a principled line endures. Your friend underestimated Bentham’s distinction between groundless disgust and tangible mischief to autonomy.
