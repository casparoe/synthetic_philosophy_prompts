prompt: |-
  I'm part of a small team writing the conduct code and the internal risk metric for a development organization that operates in roughly thirty countries, and we have got as far as discovering that the word corruption appears in every section of the draft and is defined in none of them. Before we look at any of the standard definitions on offer, I want the specification: what would a working definition of corruption have to deliver to count as adequate for our particular purpose — a code that a country director and a field officer have to apply on a Tuesday, and a risk score we then publish about the places we work — with the case or consideration behind each requirement. I would like the cases, not just the labels: the phenomenon or hypothetical it has to handle, the distinctions it must not collapse (corruption versus clientelism versus patronage versus rent-seeking versus state capture versus ordinary theft; corrupt act versus corrupt official versus corrupt system; the need case versus the greed case), and the findings from anthropology and economics it is not allowed to contradict — that gift exchange frequently constitutes a relationship rather than distorting a pre-existing one, that enforcement is itself politically selective, that in some settings side payments move goods faster rather than slower.

  Several requirements keep being presented to me as mandatory, and I suspect they are a mix of genuine desiderata and the prejudices of whichever camp is speaking: that corruption requires a public office, so a kickback to a purchasing manager inside a private firm is fraud but not corruption; that it requires an identifiable quid pro quo; that the gain must be private, whatever we then say about the official who steers contracts to her own ethnic group or her party and takes nothing herself; that there must be a loser, which seems to fall apart on the payment that buys a service the citizen was already owed, or the one that gets a nurse to turn up; that the standard must be identical in every country we operate in, which one of my colleagues says simply smuggles in the assumption that arm's-length impartial administration is the neutral baseline rather than one local ideal among others; and that whatever we end up with must be provable enough to dismiss or prosecute someone on. A different colleague has proposed a shortcut she calls the sunlight test — an act is corrupt just in case the people involved would not be willing to have it entered in a public register — and I do not think it survives contact with an official who would be delighted to publicise a patron's gift, or with a disclosed, budgeted, lawful fee for faster inspections, or with a practice the whole district knows about and approves of. I would also like to know whether the list has to cover corruption with no corruptible human in the loop at all: a procurement model whose training data encodes a decade of favouritism, or a vendor selected because he is somebody's cousin, where no individual exercised a discretion that anyone can point to.

  So: sort the requirements I have listed into the ones that are non-negotiable and the ones that are a camp's preferences, add the ones I have missed, and give me the case behind each. Two things matter most to me. First, whether some subset of the desiderata cannot be jointly satisfied — I have a suspicion that demanding courtroom-grade provability and demanding sensitivity to systemic or institutional corruption pull in opposite directions, and that demanding one cross-national standard and demanding something our own staff find legitimate and enforceable do too, but tell me if the real conflict is elsewhere, because if the list is jointly unsatisfiable that is itself the answer I should bring back to the team. Second, which single requirement does the most work in excluding candidate definitions. You can score the two or three usual families of definition in a line or two each at the end if it helps, but the criteria are the deliverable.
reasoning: |-
  Okay, the user is part of a team developing a conduct code and risk metric for a development organization operating in thirty countries. They're struggling with defining "corruption" because it appears everywhere in their draft without a clear definition. Before looking at standard definitions, they want to know what a working definition must deliver for their specific needs—something practical for country directors and field officers to apply, and a risk score they can publish.

  First, I need to unpack their requirements. They mentioned several points: distinguishing corruption from related concepts like clientelism, patronage, etc., handling cases like gift exchanges that build relationships, and acknowledging that enforcement can be politically selective. They also listed some proposed mandatory requirements like requiring a public office, an identifiable quid pro quo, private gain, a loser, identical standards across countries, and provability for dismissals. There's also the "sunlight test" proposed by a colleague, which they think fails in certain scenarios.

  The user has two main concerns. First, they suspect some requirements conflict—like courtroom provability vs. sensitivity to systemic corruption, and one standard globally vs. local legitimacy. Second, they want to know which requirement is the biggest obstacle for definitions. They also brought up whether non-human systems (like biased AI) should be included.

  I should start by categorizing their mentioned requirements into non-negotiable and preferences. Non-negotiables probably include practical applicability in the field and usefulness for risk scoring. Preferences might be things like requiring a public office or private gain. Then, I need to add missed requirements. For instance, adaptability to local contexts or handling systemic vs. individual corruption.

  Next, analyzing conflicts between requirements is crucial. Provability vs. systemic sensitivity is a real conflict because proving individual acts in court is different from identifying systemic issues. Similarly, global consistency vs. local legitimacy might clash because one standard may not fit all cultural contexts. The user’s suspicion here seems valid.

  The most critical requirement that excludes many definitions is likely the need for provability. Legal definitions focus on individual acts, but that excludes systemic issues. If their risk score needs to reflect environments where corruption is institutionalized, a definition requiring provable individual acts won’t capture that. So provability becomes a major hurdle.

  Regarding the sunlight test, the user’s examples show its flaws. Public registers might not work where patronage is celebrated or fees are transparent. So it's insufficient for their needs. Also, AI-driven corruption without human discretion needs addressing—maybe under systemic issues, as it’s about institutional bias.

  I should also consider anthropological insights. Gift-giving as relationship-building versus bribery requires context. Enforcement being selective means their definition must allow for uneven application without undermining the code’s legitimacy. This ties into local legitimacy vs. global consistency.

  In the end, the user needs to present to their team that some requirements can't all be met. They might have to prioritize—maybe two definitions: one for conduct (individual acts) and another for risk scores (systemic). Or adjust expectations, accepting that provability might be sacrificed for a more holistic risk assessment. Highlighting these trade-offs is key.
answer: |-
  Here’s a structured breakdown of requirements for your corruption definition, sorted by necessity, with cases and conflicts highlighted. The core tension is between **legal precision** and **operational/contextual realism**, with systemic corruption as the critical challenge.

  ---

  ### **Non-Negotiable Requirements**  
  *(Essential for your code/risk metric to function)*

  1. **Practical Applicability in Field Contexts**  
     - **Case**: A field officer in Country X must decide whether accepting a "gift" of lunch from a village elder during a project site visit violates the code. The gift is culturally expected but could influence project decisions.  
     - **Why**: Without clear thresholds (e.g., "gifts exceeding $10 value" vs. "any non-trivial gift"), staff cannot act consistently. Anthropological insight: Gift-giving builds social capital; banning it outright may sabotage work.  

  2. **Distinction Between Individual Acts & Systemic Corruption**  
     - **Case**: In Country Y, all public contracts are awarded to the ruling party’s donors—but no single official demands bribes. Is this "corruption" if it’s legally codified?  
     - **Why**: Risk metrics must capture environments where corruption is institutionalized (e.g., state capture), even if no provable quid pro quo exists.  

  3. **Provability for Accountability**  
     - **Case**: A country director must fire a staff member who took bribes for vendor selection. The definition must support disciplinary action with evidence.  
     - **Why**: Unenforceable codes breed cynicism. *Conflict*: Systemic corruption (e.g., biased algorithms) may lack a "corruptible human" to prosecute.  

  4. **Cultural Legitimacy**  
     - **Case**: In Country Z, officials receive "speed money" for routine services (e.g., issuing permits). Locals see this as efficient, not corrupt. Applying a "zero tolerance" rule alienates partners.  
     - **Why**: Definitions contradicting local norms undermine staff buy-in. Anthropological insight: "Side payments" may optimize broken systems.  

  ---

  ### **Negotiable Preferences / Misplaced Mandates**  
  *(Often reflect legalistic biases or over-simplification)*

  5. **Requires a Public Office**  
     - **Problem**: Excludes private-sector corruption (e.g., your purchasing manager kickback).  
     - **Case**: A NGO partner’s employee diverts funds. Is this "fraud" (handled internally) or "corruption" (requiring disclosure in risk metrics)?  
     - **Verdict**: **Preference**. Your risk metric should cover any abuse of entrusted power, public or private.  

  6. **Identifiable Quid Pro Quo**  
     - **Problem**: Misses diffuse patronage (e.g., contracts awarded to a political faction over years).  
     - **Case**: A minister hires unqualified relatives. No explicit bribe, but public trust erodes.  
     - **Verdict**: **Preference**. Systemic corruption often lacks discrete exchanges.  

  7. **Private Material Gain**  
     - **Problem**: Ignores ideological/nepotistic corruption (e.g., official favoring co-ethnics).  
     - **Case**: A bureaucrat fast-tracks permits for party allies, gaining no personal wealth.  
     - **Verdict**: **Preference**. Focus should be on *undue advantage* (private, group, or political).  

  8. **Requires a "Loser"**  
     - **Problem**: Ignores Pareto-efficient corruption (e.g., bribe speeds up service everyone receives).  
     - **Case**: Paying a nurse to show up benefits the payer without directly harming others—but corrodes equity.  
     - **Verdict**: **Preference**. Corruption’s harm is systemic (distorted institutions), not always individual.  

  9. **Identical Standard in All Countries**  
     - **Problem**: Imposes Western "arm’s-length" ideals. Ignores contexts where relational reciprocity is normative.  
     - **Case**: Gift-giving to officials during festivals is expected in Country A but forbidden in Country B.  
     - **Verdict**: **Preference**. Set core principles globally (e.g., "no undue influence"), but allow localized thresholds/rules.  

  10. **The "Sunlight Test" (Public Register)**  
      - **Flaws**:  
        - Patronage gifts may be *celebrated* publicly (e.g., "Look how our chief provides for us!").  
        - Lawful "fast fees" (e.g., expedited visa processing) are transparent but may still disadvantage the poor.  
        - Widely accepted practices (e.g., tribal favoritism) could pass the test despite distorting fairness.  
      - **Verdict**: **Inadequate**. Confuses transparency with legitimacy.  

  ---

  ### **Missing Critical Requirements**

  11. **Handles Non-Human Systems**  
      - **Case**: An AI procurement tool favors vendors from Region X because historical data reflects past discrimination. No human "took a bribe."  
      - **Requirement**: Definition must include *institutional corruption*: outcomes violating fairness due to biased systems.  

  12. **Distinguishes Corruption from Clientelism/Patronage**  
      - **Case**: An official directs projects to loyal villages. Is this "corruption" (personal gain) or "clientelism" (political exchange)?  
      - **Requirement**: Key distinction: Corruption = *abuse of entrusted power for undue advantage*. Clientelism = *exchange of goods/services for political support*, which may be legal/cultural. Overlap when public resources fund it.  

  13. **Acknowledges Enforcement Selectivity**  
      - **Case**: Anti-corruption courts only target opposition figures. Your risk metric must reflect this *political weaponization*.  
      - **Requirement**: Definition shouldn’t imply corruption is always punishable or uniformly defined by local laws.  

  ---

  ### **Core Conflicts & Trade-offs**
  - **Unresolvable Tension**: **Provability vs. Systemic Sensitivity**  
    - Courtroom-proof definitions need identifiable actors, clear quid pro quos, and evidence (individual acts). Systemic corruption involves diffuse power networks, cultural norms, and institutional biases—rarely provable to legal standards.  
    - *Solution?* Use two definitions:  
      - **Conduct Code**: Focus on *individual acts* (provable, for disciplinary action).  
      - **Risk Metric**: Focus on *corrupt environments* (systemic, for contextual risk scoring).  

  - **Secondary Conflict**: **Global Consistency vs. Local Legitimacy**  
    - Imposing identical rules ignores anthropological realities (e.g., gift economies).  
    - *Solution*: Core principles + localized guidance (e.g., "Gifts exceeding local median daily wage require reporting").  

  ---

  ### **Most Exclusionary Requirement**  
  **Provability** does the most to exclude candidate definitions. Legal/audit-focused definitions (e.g., OECD’s "bribery") require evidence of individual misconduct, excluding:  
  - Systemic corruption (state capture)  
  - Non-material corruption (nepotism)  
  - Institutional bias (AI algorithms)  
  - Culturally embedded practices (tribal patronage)  

  ---

  ### **Quick Scorecard of Definition Families**  
  1. **Legal Definitions** (e.g., UN Convention): Strong on provability/accountability; weak on systemic/cultural corruption.  
  2. **Principal-Agent Theory** (e.g., World Bank): Focuses on individual "agents" betraying trust; ignores corruption where elites collude (e.g., state capture).  
  3. **Institutional/Sociological** (e.g., Philp, Rothstein): Captures systems/context; too abstract for disciplinary actions.  

  ---

  ### **Recommendation**  
  **Adopt a dual-track approach:**  
  - **Conduct Code**: Narrow, provable definition for disciplinary actions (e.g., "soliciting/accepted undue advantage in exchange for official action").  
  - **Risk Metric**: Broader definition capturing *corrupt environments* (e.g., "systematic diversion of public goods for private/group advantage, whether legal or cultural").  

  This resolves the core conflict: the code enforces individual accountability; the risk metric flags contextual dangers where "corruption" is the water, not the shark. Bring this trade-off to your team—perfect coherence is impossible, but operational clarity is achievable.
