answer: |-
  Below is a complete, runnable game design for your 75-minute session on costly signaling, tailored to address your three target misconceptions. The game avoids using the term "handicap principle" until debrief and includes your requested wrinkles (transfer variant and "tell" signal).

  ---

  ### **Game Title:** Signal Quest  
  **Core Mechanics:** Players pair as "Signallers" (hidden type) and "Receivers" (accept/reject). Tokens are used as currency (redeemable for raffle tickets).  

  ---

  ### **Materials**  
  - **Deck of cards:** Assign types: Hearts/Diamonds = **High (H)**, Clubs/Spades = **Low (L)**.  
  - **Index cards:** For signalling decisions (write numbers 0-10).  
  - **Tokens:** 100+ identical items (poker chips, beads, or raffle tickets). Each player starts with 20 tokens.  
  - **Timer:** For rounds and penalties.  
  - **Tedious task:** Prepared sheets of random numbers to transcribe (5-minute task; used as punishment).  
  - **Two colored markers:** Red for "tell" phase (fixed signal).  

  ---

  ### **Payoff Tables**  
  *(Tokens gained/lost per round)*  

  #### **1. Base Payoffs (All Phases)**  
  | Role          | Outcome                     | Tokens Received |  
  |---------------|----------------------------|-----------------|  
  | Signaller     | Accepted by Receiver       | +10             |  
  | Signaller     | Rejected by Receiver       | 0               |  
  | Receiver      | Accepts **H**              | +5              |  
  | Receiver      | Accepts **L**              | -5              |  
  | Receiver      | Rejects                    | 0               |  

  #### **2. Signal Costs**  
  *(Deducted from Signaller’s tokens)*  
  | Signal Level | Cost for **H** | Cost for **L** |  
  |-------------|----------------|----------------|  
  | 0–10        | `s`            | `2 × s`        |  
  *(e.g., Signal "5" costs H: 5 tokens, L: 10 tokens)*  

  #### **3. Transfer Variant**  
  - Cost paid by Signaller **is transferred to Receiver** (no tokens destroyed).  
  - *Example:* H sends "5" (costs H: 5). Receiver gains +5 (cost transfer) + outcome payoff.  

  #### **4. "Tell" Variant**  
  - Signal = Card color (♥♦= red, ♣♠= black). **No cost.** Players reveal card color.  

  ---

  ### **Game Phases & Timeline**  
  *(Total: 75 minutes)*  

  #### **Phase 0: Setup (5 min)**  
  - Distribute tokens (20/player).  
  - Explain rules:  
    - "Each round, you’ll pair up. Signallers draw a hidden card (type: High/Low).  
    - Signallers choose a signal level (0–10). Receivers see the signal and decide: **Accept** or **Reject**.  
    - Goal: Maximize tokens. Tokens buy raffle tickets (1 token = 1 ticket). Losers do transcription tasks."  
  - Assign initial pairs randomly (use deck: draw cards to match pairs).  

  ---

  #### **Phase 1: Cheap Talk (15 min)**  
  - **Rules:** Signals cost **0 tokens** (write number on index card).  
  - **Rounds:** 3 rounds (4 min/round).  
    - *Min 0–1:* Signallers draw card, choose signal (0–10).  
    - *Min 1–2:* Receivers see signal, decide Accept/Reject.  
    - *Min 2–4:* Record outcomes. Re-pair players.  
  - **Predictable Collapse:**  
    - Signals become noise (everyone claims "10"). Receivers reject indiscriminately.  
    - **Debrief hook:** "Why didn’t signals work? What made receivers distrustful?"  

  ---

  #### **Phase 2: Costly Signaling (15 min)**  
  - **Rules:** Signals now cost tokens (H: `s`, L: `2×s`). Costs **destroyed** (not transferred).  
  - **Rounds:** 5 rounds (3 min/round).  
    - Same structure as Phase 1.  
  - **Discovery Goal:** Players find separating equilibrium (H: ~4–5, L: 0).  
    - **Key Moment:** When Receivers start accepting only signals ≥4.  
  - **Predictable Shift:**  
    - Early rounds: Bluffing (L sends high signals).  
    - Later rounds: Separation (H sends 4–5, L sends 0).  

  ---

  #### **Phase 3: Transfer Variant (15 min)**  
  - **Rules:** Signal costs **transferred to Receiver** (no waste).  
  - **Rounds:** 3 rounds (5 min/round).  
  - **Discovery Goal:** Honesty collapses. Receivers accept high signals regardless of type.  
    - **Why:** Receivers profit from high signals (even from L). L can afford to bluff (e.g., L sends "3": costs 6, gains 10 if accepted → net +4).  
  - **Debrief Hook:** "Did signals stay honest? Why did Receivers act differently?"  

  ---

  #### **Phase 4: "Tell" Signal (10 min)**  
  - **Rules:**  
    - Signallers **must** reveal card color (red=H, black=L). **No cost.**  
    - No index cards—show color directly.  
  - **Rounds:** 2 rounds (5 min/round).  
  - **Discovery Goal:** Honesty requires **no cost**. Separation is automatic.  
  - **Debrief Hook:** "Was this still ‘costly signaling’? Why did it work?"  

  ---

  #### **Debrief (15 min)**  
  Map game outcomes to your three misconceptions:  

  | **Game Moment**               | **Concept Addressed**                                                                 | **Misconception Corrected**                                                                 |  
  |-------------------------------|---------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------|  
  | Phase 1 collapse              | Costless signals → dishonesty                                                        | Signals aren’t honest *because* they’re costly; cost structure matters.                    |  
  | Phase 2 separation (~signal 5)| Differential cost (L pays more) enables honesty                                       | Waste is a byproduct; **differential cost** does the work.                                 |  
  | Phase 3 transfer collapse     | Honesty fails when waste is removed (Receiver incentives change)                     | Confirms waste isn’t essential; differential cost must align with incentives.               |  
  | Phase 4 "tell" honesty        | Fixed signals need no cost; honesty is automatic                                      | Costly signaling isn’t the only path; "tells" require different explanations.              |  
  | Phase 2 bluffing early rounds | Multiple equilibria possible (e.g., all send "10") → no guarantee of honesty          | Costly signaling **enables** honesty but doesn’t guarantee it; bluffing equilibria exist. |  

  **Key Debrief Points:**  
  - "Honesty emerges from **differential cost** (L pays more to fake H), not cost itself."  
  - "Waste is a side effect; the transfer variant proves **incentive alignment** is key."  
  - "Costly signaling doesn’t guarantee honesty—it just makes it *possible* (e.g., early bluffing)."  
  - "‘Tells’ are fundamentally different: they’re unfakeable, not costly."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Boring task" aversion:**  
     - Some will *hate* transcription. **Solution:** Use tokens for raffle tickets (1 token = 1 entry). Losers lose 5 tokens (not forced task). Frame as "cost of losing."  

  2. **Reputation across rounds:**  
     - Players may track partners. **Solution:** Re-pair randomly each round (use deck: draw new cards for pairs/roles). Enforce anonymity (no sharing IDs).  

  3. **Clever play (e.g., always reject):**  
     - A Receiver might reject everyone to avoid risk. **Solution:** Remind players tokens are lost if not used. High-stakes rounds incentivize engagement.  

  4. **Math confusion:**  
     - Players may miscalculate payoffs. **Solution:** Provide printed payoff tables. Walk through examples before Phase 2.  

  ---

  ### **What the Game Cannot Reproduce**  
  Your intuition is correct: **evolutionary dynamics** are the gap.  
  - **In biology:** Equilibrium emerges from selection over generations. Players *reason* in minutes.  
  - **In the game:** Honesty is "perfect" (players know types). In nature, it’s probabilistic (e.g., some peacocks cheat).  
  - **Common knowledge:** Players know payoffs. In evolution, payoffs (fitness) are unknown; traits evolve blindly.  

  **How to Address:**  
  - Explicitly discuss this during debrief:  
    - "In nature, costly signals evolve because high-types *out-reproduce* low-types when honest. No one ‘chooses’—selection does the work."  
    - "Real signals are honest *on average*, not perfectly. Bluffers exist but are outcompeted."  
    - "This game assumes rational players with common knowledge. Evolution has no strategist—just differential survival."  

  ---

  ### **Final Tips**  
  - **Keep energy high:** Award bonus tokens for "best round" or insightful debrief comments.  
  - **Emphasize discovery:** "Your goal isn’t to win—it’s to figure out how signals work."  
  - **Test beforehand:** Run with friends to refine timing.  
  - **Supply intuition gaps:** Use debrief to link game → evolution ("Imagine rounds as generations...").  

  This design ensures players *experience* differential costs, equilibrium shifts, and the irrelevance of waste—setting up your debrief to dismantle misconceptions surgically.
