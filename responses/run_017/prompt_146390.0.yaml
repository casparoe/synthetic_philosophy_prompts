     - Phase 4: Tell: the signal is fixed by the type (e.g., H always has a red dot, L a blue dot, and they must show it) and costs nothing.

   Payoffs:
   For the signaller:
     - If accepted: gets a benefit (B) minus any signal cost (C(s, type)).
     - If rejected: gets 0 minus any signal cost.

   For the receiver:
     - If accepts a H: gets a gain (G)
