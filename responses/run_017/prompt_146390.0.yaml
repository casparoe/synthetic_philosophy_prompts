   1. Have participants paired as signallers and receivers.
   2. Signallers draw a hidden type (e.g., from a deck of cards) and choose a signal level.
   3. Receivers decide to accept or reject the signaller based on the signal.
   4. The first phase should be cheap talk (costless signals) and show that it collapses to noise.
   5. Later phases introduce costly signals and allow participants to discover the separating equilibrium and how it shifts with changing stakes and cost schedules.
   6. Include a "transfer variant" where the cost paid by the signaller is transferred to the receiver (so no waste) to see if honesty is maintained.
   7. Include a phase with a "tell" (a signal that is fixed by type and cannot be faked) to show it doesn't require cost for honesty.

