prompt: |-
  I'm a backend engineer with no formal philosophy background — I ended up in a reading group a colleague runs, and the last couple of sessions were on the philosophy of mind, where I bumped into the phrase "multiple realizability." A friend in the group said the thing I'm about to describe sounds like the "same function, different implementation" idea, and that some philosophers hang a whole theory of mind on it, which is why I'm asking here rather than settling it in a code review. The phrase seems to cover part of what I have in mind and not the rest, and I'd like to know whether the rest has a name.

  Three cases from work. First: a service that assigned records to buckets was written three times over the years — once as a comparison-based sort, once as a distribution sort over integer keys, and once, for a narrow legacy key space, as a precomputed table of answers. All three passed the same contract tests, no caller could tell them apart, and everyone was happy to say: one job, three implementations. Second: two components that labelled incoming support tickets. One was a trained model; the other was a hardcoded map from the exact strings in our test corpus to labels, plus a fallback for everything else. For months their outputs agreed on every input either of them actually saw — but nobody would say they were doing the same thing. The objections were all of the form "it hasn't learned the rule," "it's memorised the test set," "just wait for the inputs to drift" — that is, they were about inputs that had not happened yet. Third, a case of a different shape: the same module, same code, no changes at all, redeployed downstream of a different parser, so that the bytes arriving at it meant something different. Its internals were untouched and its behaviour on those bytes was unchanged, and yet we said it was no longer doing the same thing.

  So: is there an established concept — or several — that carves up this territory? The piece I most need is whatever separates case two from case one: both pairs agree on all actual behaviour, but in one we grant sameness and in the other we withhold it, and what seems to do the work is behaviour in situations that haven't arisen yet. Is that the same phenomenon as multiple realizability, a special case of it, a consequence of it, or something else entirely? And is case three the same phenomenon too, or a separate one — something about how much of the surrounding system gets to count as part of the thing being described? I'd also like to know how one would settle case two in a principled way: does the difference live in the module right now, or only in our expectations about what it will be fed later? Please don't just hand me a label — I want the boundaries: what the phenomenon is, what it isn't, which of my three cases belong together and which don't, and where the philosophically interesting line actually falls.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a backend engineer who stumbled upon "multiple realizability" in a philosophy reading group. They have three cases from their work and want to understand the philosophical concepts that explain the differences between them. The main confusion is why in case one (three implementations of a sorting service) they consider the implementations the same, but in case two (two ticket labeling components) they don't, even though both agree on current behavior. Also, case three (same module with different upstream parser) adds another layer.

  First, I need to recall what multiple realizability (MR) is. In philosophy of mind, MR argues that mental states can be realized by different physical substrates. Applied to their cases, in the first example, the same function (sorting) is implemented differently (sort algorithms, table lookup), which fits MR perfectly. All implementations satisfy the same functional specification. 

  Now, case two is trickier. Both components produce the same outputs for current inputs, but the team sees them as different. The objections are about future inputs or generalization. This isn't about multiple realizability because the issue isn't different implementations of the same function, but rather that one component (the hardcoded map) doesn't actually implement the intended function—it only handles the current dataset. The intended function is to generalize to new inputs, which the model might do but the hardcoded map can't. So the distinction here is between the function as specified (current I/O) vs. the intended function (handling unseen data). This touches on competence vs. performance, where competence is the underlying capability.

  Case three involves the same code but different interpretations due to an upstream change. The module's behavior is the same, but because the input semantics changed, its outputs now mean something different. This is about semantic externalism—meaning depends on context. The computational process is identical, but the content it processes has different meanings, so the overall system's function changes.

  Putting it together: Case one is MR. Case two is about functional equivalence vs. competence. Case three is about semantic externalism. The user’s core need is understanding why sameness is granted in one case but not another when current behavior is identical. The key is future inputs and intended function in case two, and contextual meaning in case three. They also want principled ways to distinguish these, which involves precise specifications and context considerations. Their deeper need might be applying these concepts to system design, like ensuring modules are evaluated not just on current tests but on intended scope and dependencies.
answer: |-
  Your cases brilliantly expose the gap between *behavioral equivalence* (same outputs for given inputs) and *functional equivalence* (performing the same underlying task). Multiple realizability (MR) is part of the story, but not the whole picture. Here's how philosophy carves this up:

  ### 1. **Multiple Realizability (MR) - Your Case 1**
     - **What it is:** The thesis that a single *functional kind* (e.g., "sorting records into buckets") can be implemented by distinct *physical/structural kinds* (different algorithms, hardware, etc.).
     - **Why Case 1 fits:** All three implementations satisfy the *identical functional specification*: for any valid input, they produce the correct bucket assignment. Their internal mechanisms differ, but they realize the same function. MR says this is possible and common.
     - **Boundaries:** MR requires *actual equivalence under the full domain of possible inputs defined by the specification*. If the precomputed table only worked for legacy keys, it wouldn't be a realization of the *general* sorting function – it would be a different, restricted function.

  ### 2. **Competence vs. Performance - Your Case 2**
     - **The Core Distinction:** This separates *what a system actually does now* (performance) from *what it's capable of doing* or *what it was designed/intended to do* (competence).
     - **Why Case 2 differs from Case 1:**
       - **The Trained Model (Competence):** It (ideally) learned a general rule (e.g., "identify topics based on word patterns"). Its current outputs are a *performance* of this underlying competence. It *should* generalize to novel, valid inputs within its training domain.
       - **The Hardcoded Map (Performance without Competence):** Its outputs *match* the model *only for inputs it was explicitly programmed for* (the test corpus + fallback). It lacks any general rule-following competence. Its "function" is defined *only* by its current lookup table + fallback, not by an ability to handle unseen-but-valid tickets.
     - **The Philosophical Line:** The difference lies in the **counterfactual conditionals**. We ask: "If presented with a *novel, valid input X* (within the problem domain), what would it do?"
       - The model *should* apply its learned rule to X.
       - The hardcoded system would *only* output correctly if X was in its table or triggered the correct fallback by coincidence. It has no *systematic* way to handle X correctly.
     - **The Established Concept:** This is **Functional Equivalence vs. Behavioral Coincidence**. Philosophers like Jerry Fodor and Noam Chomsky emphasize competence (the underlying causal structure/disposition) over mere performance (current outputs). The difference *is in the modules now* – their internal causal structures give them different dispositions to respond to *possible* inputs. Your colleagues' objections ("just wait for drift") are appeals to these counterfactual dispositions.
     - **Not MR:** MR applies when two *different* structures realize the *same* competence. Here, the hardcoded system *lacks* the competence the model (ideally) has. They are not realizing the same function.

  ### 3. **Semantic Externalism - Your Case 3**
     - **What it is:** The meaning (semantic content) of a state or process depends not just on its internal structure, but also on its *causal history* and the *environment* in which it operates (Hilary Putnam's "Twin Earth" thought experiment, Tyler Burge).
     - **Why Case 3 is different:** The module's internal *computational process* (syntax) is unchanged. However, the *meaning* of its inputs (and thus its outputs) has changed due to the upstream parser shift. Its outputs now *represent* different things.
     - **The Functional Shift:** While its *syntactic operation* is identical, its *functional role in the larger system* has changed. Previously, it computed Function F(InputMeaning_A). Now, it computes Function F(InputMeaning_B). F is the same, but its *arguments* and *results* now have different semantic content. It is now performing a different *semantic/computational task* for the business logic.
     - **The Philosophical Line:** Functionality isn't just about internal states pushing bits; it's about what those bits *mean* in context. The line falls where the *intentional content* of inputs/outputs changes, even if the internal transformation process doesn't.
     - **Not MR or Competence/Performance:** This is a distinct issue about *representation* and *context-dependence*.

  ### Mapping Your Cases & Answering Your Questions

  1.  **Case 1 (Sorting):** Pure **Multiple Realizability**. Different structures realize the *same* well-defined function over the *same* input domain.
  2.  **Case 2 (Labeling):** **Competence vs. Performance** / **Functional Equivalence vs. Behavioral Coincidence**. The difference is *not* about future events per se, but about the *current causal dispositions* of the systems. The hardcoded system lacks the competence (the disposition to generalize correctly) that the model (ideally) possesses. This disposition is a *current* property, evidenced by its structure (lookup table vs. trained weights). Future inputs merely *reveal* this pre-existing difference.
  3.  **Case 3 (Same Code, Different Input Semantics):** **Semantic Externalism**. The function changed because the *meaning* of its inputs was altered externally. The internal process is identical, but its role in the system is different.

  **Your Key Question:** "What separates case two from case one?"
  *   **The Line:** **Specification Scope and Causal Disposition.**
      *   Case 1: The functional specification ("Assign records to buckets correctly") *explicitly or implicitly covers the entire relevant input domain*. All implementations satisfy this full specification *counterfactually* (they *would* work for any valid input). Their internal differences are irrelevant to the function.
      *   Case 2: The functional specification is broader ("Label *support tickets* correctly") than just the test corpus. The model (ideally) satisfies this full specification counterfactually. The hardcoded system only satisfies a *different*, narrower specification ("Output specific labels for these specific strings + a fallback"). Its structure shows it *cannot* satisfy the broader specification. The "sameness" you withhold is the *competence* for the intended task.

  **Settling Case 2 Principledly:**
  1.  **Define the Intended Function Rigorously:** What is the *full* input domain? (e.g., "All possible support ticket texts conforming to schema X"). What constitutes correct labeling?
  2.  **Examine the Causal Structure:** How does the system generate outputs?
      *   The model uses statistical patterns learned from data – its structure embodies a (hopefully general) rule.
      *   The hardcoded system uses direct lookup – its structure embodies only specific cases and a fixed fallback rule.
  3.  **Assess Counterfactual Robustness:** Does the system's structure support *systematically* correct outputs for *novel, valid inputs within the intended domain*? The model's structure is *designed for* this (though it may fail). The hardcoded structure *precludes* it (except by coincidence).
  4.  **Conclusion:** The difference *lives in the module right now*, encoded in its structure and the dispositions that structure entails. Future inputs only *test* this pre-existing property. They are functionally equivalent only under the *restricted* specification defined by their coincidentally overlapping outputs on the current input stream, not under the *intended* specification.

  **Philosophically Interesting Line:** The deepest line falls between **behavior** (current I/O) and **competence** (causal disposition to produce correct I/O across a domain). Multiple realizability operates *at the level of competence* (different structures, same competence). Semantic externalism highlights that competence itself can depend on external context. Your cases demonstrate that in engineering, as in philosophy of mind, *what something is doing* depends critically on the *scope of the specification* and the *counterfactual dispositions* of its underlying mechanism, not just its current behavior.
