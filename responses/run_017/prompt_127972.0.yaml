answer: |-
  ### Joint Statement on the Problem of Old Evidence in Bayesian Confirmation Theory  
  **An Adversarial Collaboration Between the Modeling Artifact View (A) and the Extra Ingredient View (B)**  
  *Regarding the "Drawer Case" in Systems Neuroscience*  

  ---

  ### 1. Claims Both Sides Endorse  
  We agree on the following foundational principles and interpretations of the drawer case. These form common ground for resolving the problem of old evidence:  

  1. **Purpose of Confirmation**: Confirmation theory should explain how evidence *rationally justifies* changes in credence toward a hypothesis. It must account for both new discoveries and re-evaluations of existing knowledge (e.g., recognizing unnoticed connections).  

  2. **Role of Bayesianism**:  
     - Bayesian probability theory is a normative framework for modeling rational belief updating via conditionalization.  
     - Confirmation is minimally defined as probability-raising: \(E\) confirms \(H\) relative to background knowledge \(K\) iff \(P(H|E, K) > P(H|K)\).  

  3. **The Drawer Case (Your Scenario)**:  
     - **Facts**: Your lab possessed numerical data \(E\) for three years. At that time, \(E\) was recorded but not recognized as relevant to hypothesis \(H\). Last month, you discovered \(H\) explains \(E\) (e.g., via a seminar, preprint, or coding error), doubling your confidence in \(H\).  
     - **Confirmation Timing**: Both sides agree that \(H\) was *not* confirmed when \(E\) was first recorded. Confirmation occurred "last month" when the connection was recognized.  
     - **Causal History**: The *method* of discovery (seminar/preprint/mistake) is epistemically irrelevant to *whether* \(E\) confirms \(H\). Only the recognition of the connection matters for justification.  

  4. **Priors and Epistemic States**:  
     - Rational agents have a "current prior" \(P\) representing credences before updating on new information.  
     - In the drawer case, at the moment of recognition, the agent updates from a prior \(P\) that includes \(E\) but not its relevance to \(H\).  

  5. **Verbal Disagreement**: The term "evidence" is ambiguous:  
     - **Raw Data (E)**: The numbers in your notebook.  
     - **Evidential Relevance**: The proposition that \(E\) is explained by or predicts \(H\).  
     Both sides agree that "old evidence" refers to \(E\) being known *as raw data* before its relevance was recognized. The core dispute is whether learning *relevance* is reducible to Bayesian updating.  

  6. **Dissolution of *Some* Old Evidence Problems**: The classic problem (e.g., Mercury's perihelion) dissolves if we use a counterfactual prior \(P'\) from before \(E\) was known. For the drawer case, however, this counterfactual is inappropriate because \(E\) was always known—the issue is *relevance*, not novelty.  

  ---

  ### 2. Residual Disagreements  
  *Each side phrases their view in their preferred terminology. Disagreements focus on the drawer case.*  

  | **Modeling Artifact View (A)** | **Extra Ingredient View (B)** |
  |------------------------------|-------------------------------|
  | **On the Drawer Case**: Confirmation occurred when you learned a proposition \(R\): "\(H\) explains \(E\)." This is captured by conditionalizing on \(R\) relative to your prior \(P\) (which included \(E\) but not \(R\)). The probability-raising \(P(H|R, E) > P(H|E)\) is sufficient; no extra ingredients are needed. | **On the Drawer Case**: Confirmation occurred when you recognized \(H\)'s *explanatory relationship* to \(E\). Bayesian conditionalization on \(R\) ("\(H\) explains \(E\)") is circular because \(R\) presupposes the confirmatory relation. Probability-raising alone cannot capture why explanation justifies belief. |
  | **On Evidence**: At the moment of recognition, your evidence set expanded to include \(R\). \(R\) is a standard proposition; updating on it is ordinary Bayesianism. How \(R\) was learned (e.g., seminar vs. mistake) affects only computational practicalities, not rationality. | **On Evidence**: Your evidence set did not change—you still only knew \(E\) and background facts. What changed was your *grasp of explanatory structure*. Bayesianism misses this; we need a theory of explanation (e.g., unification or causal grounding) as an extra ingredient. |
  | **On Confirmation Timing**: Confirmation happened *exactly* at recognition. Before this, \(E\) was part of your background knowledge but did not confirm \(H\) because \(R\) was unknown. After learning \(R\), \(H\) is confirmed via \(P(H|R, E)\). | **On Confirmation Timing**: Confirmation happened at recognition, but Bayesianism *cannot model it* without smuggling in explanation. The rise in credence reflects a non-Bayesian insight: that \(H\) *predicts* or *explains* \(E\). |
  | **On Priors**: The prior \(P\) for the drawer case is your credence function *just before* learning \(R\). \(P\) encodes uncertainty about \(R\), so conditionalization on \(R\) yields confirmation. No counterfactual to before \(E\) is needed. | **On Priors**: Your prior \(P\) at recognition already had \(P(E)=1\), so \(P(H|E)=P(H)\). Learning \(R\) isn't propositional—it's grasping a modal fact (e.g., "\(H\) entails \(E\)"). Thus, \(R\) cannot be cleanly added to the algebra. |

  ---

  ### 3. Cruxes and Predictive Tests  
  We identify three empirical/logical cruxes. For each, we specify a test case both sides agree is decisive, and we pre-register predictions.  

  **Crux 1: Is learning relevance (\(R\)) reducible to conditionalizing on a proposition?**  
  - **Test Case**: You discover the connection via an unreliable source (e.g., a preprint later retracted). You initially conditionalize on \(R\), raising \(P(H)\). Later, you learn the source was wrong.  
    - **A's Prediction**: Your credence in \(H\) rises upon learning \(R\) and reverts upon its retraction. This shows \(R\) is a standard proposition. Bayesianism handles this naturally.  
    - **B's Prediction**: Your credence rise is weaker than if you had *seen* the explanation (e.g., via a derivation). Reversion occurs, but the episode reveals that explanation is distinct from propositional learning.  

  **Crux 2: Does Bayesianism exhaust confirmation in the drawer case?**  
  - **Test Case**: You have two hypotheses \(H_1\) and \(H_2\). Both predict \(E\), but \(H_1\) explains \(E\) more simply (e.g., fewer free parameters). Upon recognizing the connection, your credence in \(H_1\) rises more than in \(H_2\).  
    - **A's Prediction**: This is captured by conditionalizing on \(R_1\) ("\(H_1\) explains \(E\)") and \(R_2\) ("\(H_2\) explains \(E\)"), with priors favoring simpler explanations (e.g., via complexity penalties). No extra ingredients.  
    - **B's Prediction**: Bayesian priors over \(R_1\) and \(R_2\) cannot fully encode "explanatory depth." The differential rise reflects a non-probabilistic virtue (e.g., elegance) not reducible to probability-raising.  

  **Crux 3: Does "grasping explanation" require modeling beyond credences?**  
  - **Test Case**: After recognizing the connection, you lose access to the raw data \(E\) but retain the insight that \(H\) explains it (e.g., server failure).  
    - **A's Prediction**: Confirmation remains because \(R\) ("\(H\) explains \(E\)") is still known. Credence in \(H\) stays high even without \(E\), as \(R\) supports \(H\) directly.  
    - **B's Prediction**: Credence in \(H\) drops because explanation requires the *evidence* \(E\) to be present (it's not just about \(R\)). Explanation is a three-place relation \(X \approx H \to E\), and losing \(E\) breaks it.  

  ---

  ### Conclusion  
  We concur that the drawer case illuminates the old evidence problem: confirmation hinges on recognizing *relevance*, not data novelty. Both sides reject the claim that confirmation happened when \(E\) was first recorded. Where we diverge is whether learning relevance is propositional (A) or explanatory (B). Forthcoming work will test these cruxes experimentally (e.g., manipulating how relevance is discovered) and formally (e.g., modeling \(R\) in Bayesian networks). We commit to updating our views based on these tests.  

  **Signed**,  
  **Position A (Modeling Artifact)**: [Name], Affiliation  
  **Position B (Extra Ingredient)**: [Name], Affiliation  

