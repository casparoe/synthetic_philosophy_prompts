prompt: |-
  So I'm halfway through my PhD (systems neuroscience, dont ask) and we did the thing everyone tells you not to do: we picked the model family after staring at the same dataset for a year, and now my advisor wants a Bayes factor for it. Which means I've spent the last week reading about the problem of old evidence, and my takeaway is that the two camps are mostly talking past each other — so I want the document they should have written instead.

  Draft the joint statement of an adversarial collaboration between, on one side, someone who thinks old evidence is a modelling artifact: get clear about what you conditionalize on (the counterfactual prior from before you knew E, the proposition that you've learned E, an expanded partition — take your pick) and the problem dissolves. On the other side, someone who thinks it shows confirmation isn't exhausted by probability-raising: what does the work is that the theory predicts or explains E, and no choice of prior over the old partition captures that, so Bayesianism needs an extra ingredient or isn't the whole story about evidence.

  And please put my actual case in it, because I think it's subtly different from the textbook one. Our data sat in the lab notebook and on the server for three years. We always knew the numbers. What we didn't know was that they had anything to do with our hypothesis — we only noticed the connection last month, and the moment we noticed it our confidence in the model roughly doubled. Call it the drawer case. I want both sides to say, about that case specifically, what got confirmed when: was it at the moment we first saw the numbers, or last month, or neither? And whether it should matter how we came to notice the connection (a seminar, a rival group's preprint, a genuine mistake in a bit of code) or only that we now see it.

  Format: a numbered section of claims both can sign — about what confirmation is even supposed to do for us, what priors are for, whether the agent's actual causal history is relevant to her evidence or just to how we model her; then a table of the residual disagreements, each phrased in wording its own side would accept; then the cruxes, and for each crux a case or argument both agree bears on it, with each side's prediction written down in advance. If part of the dispute turns out to be verbal — about what "evidence" or "prior" or "confirm" means — say which part and why.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between two positions on the problem of old evidence in Bayesian confirmation theory. The two positions are:

  Position A (The Modeling Artifact View): The problem of old evidence is an artifact of how we model learning. It can be resolved by carefully specifying what we conditionalize on (e.g., a counterfactual prior from before knowing E, the proposition that we have learned E, or an expanded partition). Once we do this, the problem dissolves and no extra ingredient is needed.

  Position B (The Extra Ingredient View): The problem of old evidence shows that confirmation is not exhausted by probability-raising via conditionalization. What does the work is that the theory predicts or explains E, and no choice of prior over the old partition captures that. Therefore, Bayesianism needs an extra ingredient (e.g., a notion of explanation or predictive success) or is not the whole story about evidence.

  We also have a specific case: the "drawer case". The data (E) was in the lab notebook and on the server for three years. The numbers were known, but the connection to the hypothesis (H) was only noticed last month. At that moment, confidence in H roughly doubled. We want both sides to address: when was H confirmed? At the moment of first seeing the numbers, last month, or neither? And does it matter how the connection was noticed (seminar, preprint, code mistake) or only that it is now seen?

  The document will have:

  1. A numbered section of claims both can sign (common ground).
  2. A table of residual disagreements, each phrased in wording acceptable to its own side.
  3. The cruxes, and for each crux a case or argument both agree bears on it, with each side's prediction written in advance.
  4. If part is verbal, identify it and why.

  Let's start with the common ground.

  **Section 1: Common Ground**

  Both sides agree on the following:

  1. **Goal of Confirmation Theory**: The purpose of a theory of confirmation is to provide a normative account of how evidence should affect the rational credence in a hypothesis. This includes characterizing when and why evidence supports a hypothesis.

  2. **Bayesian Framework**: We work within a broadly Bayesian framework where rational agents have credences represented by probabilities, and they update by conditionalization upon learning evidence. The framework uses a probability function P that represents the agent's degrees of belief.

  3. **Old Evidence Problem**: The problem of old evidence arises when we ask how evidence E, which is already known (so P(E)=1), can confirm a hypothesis H. In the standard definition of confirmation (e.g., E confirms H relative to P if P(H|E) > P(H)), if P(E)=1 then P(H|E)=P(H), so there is no confirmation. However, intuitively, old evidence can confirm a hypothesis (e.g., Einstein's general relativity being confirmed by the pre-known anomalous perihelion of Mercury).

  4. **The Drawer Case**: In the drawer case, the agent (or research team) had the data E (numerical values) for a long time but did not recognize its relevance to H until a later time. At that later time, upon recognizing the connection, the agent's confidence in H increased. This case is distinct from the classic old evidence problem in that E was known but its relevance to H was not.

  5. **Relevance of Epistemic States**: Both sides agree that the agent's epistemic state at a given time is crucial. At the time when E was first recorded, the agent did not see the connection to H, so E did not then confirm H. At the time the connection was noticed, the agent's credence in H increased. The key question is how to model this change within (or beyond) the Bayesian framework.

  6. **Priors and Counterfactuals**: Both sides agree that one common approach to the old evidence problem is to consider a counterfactual prior probability function that represents what the agent's credences would have been before learning E. Then, we can say that E confirms H relative to that counterfactual prior. However, Position A sees this as a complete solution, while Position B argues that this counterfactual does not capture the actual epistemic change when the connection is noticed.

  7. **The Role of Explanation**: Both sides acknowledge that the act of noticing that H explains or predicts E is a key element in the drawer case. Position A holds that this can be captured by modeling the agent's learning about the connection (i.e., learning a proposition about the relevance of E to H) within the Bayesian framework. Position B holds that this explanation event is not reducible to learning a proposition in the same algebra and requires an extra ingredient.

  8. **Verbal Disagreement Possibility**: There might be a verbal disagreement about the meaning of "evidence". In the drawer case, when we say "evidence E", we must distinguish between having the data and recognizing its evidential relevance to H. The two positions might use the term differently, but we try to disambiguate.

  **Section 2: Table of Residual Disagreements**

  We present the disagreements in two columns, each using the preferred wording of the respective position.

  | Position A (Modeling Artifact View) | Position B (Extra Ingredient View) |
  |-------------------------------------|-------------------------------------|
  | The problem of old evidence, including the drawer case, is resolved by conditionalizing on an expanded partition that includes propositions about the relevance of E to H. In the drawer case, the agent learns a new proposition (e.g., "H explains E" or "E is evidence for H") and conditionalizes on that. This update yields the increase in credence without needing to leave the Bayesian framework. | The counterfactual prior approach and the expanded partition are modeling tricks that do not capture the true nature of the confirmatory event. In the drawer case, what happens is that the agent comes to see that H explains E, and this explanatory relationship is what provides confirmation. This relationship is not a proposition that the agent learns in the ordinary sense, and Bayesian conditionalization on such a proposition is either circular (because the proposition already contains the confirmatory relation) or requires that we already have a notion of explanation. |
  | The moment of confirmation in the drawer case is when the agent learns the relevance proposition (i.e., when they notice the connection). The prior to conditionalize on is the one just before that learning event. The actual causal history (how the connection was noticed) is irrelevant to the confirmation relation; it only matters that the agent now has the information. | The moment of confirmation is when the agent grasps the explanatory connection, but this is not captured by conditionalizing on a proposition about that connection. The causal history (how the connection was noticed) is irrelevant to the confirmation itself, but the fact that it is an explanatory connection is crucial. Bayesianism, by focusing only on probability raising, misses the explanatory aspect. |
  | In the drawer case, confirmation occurred at the moment the connection was noticed (last month). It did not occur at the moment the numbers were first seen because at that time the agent did not have the relevant background knowledge to see the connection. The counterfactual prior approach (relative to before seeing E) might show that E confirms H, but that is not the actual confirmation event in the agent's history. | In the drawer case, confirmation occurred at the moment the connection was noticed, but this event is not a Bayesian update. The agent's prior at that moment already had P(E)=1, so the Bayesian account cannot explain the increase in credence without an artificial counterfactual. The counterfactual prior (from before E was known) is not the agent's actual prior at the time of the event, so it does not represent the actual confirmation. |

  **Section 3: Cruxes and Predictions**

  We identify the cruxes (key points of disagreement) and for each, we present a case or argument that both sides agree bears on it. We then state each side's prediction.

  **Crux 1: Can the learning of the relevance of E to H be fully captured by conditionalizing on a proposition?**

  - **Case that bears on it**: Consider a variant of the drawer case where the agent is told by a reliable source that "E is evidence for H", but without any explanation of how or why. The agent then conditionalizes on this proposition. Both sides agree that this would increase the agent's credence in H. But now, suppose that after this, the agent discovers that the source was just guessing (and the proposition is false). Position A would say that the agent should then revert their credence (or adjust based on the new information). Position B would say that even if the source was reliable, the agent did not have a genuine explanation and thus the confirmation was not as strong as when the agent sees the explanation.

  - **Prediction of Position A**: In the reliable source case, conditionalizing on the proposition "E is evidence for H" (with a suitable interpretation) is sufficient for confirmation. If the agent later learns the source was unreliable, they will update accordingly. This shows that the confirmation is propositional.

  - **Prediction of Position B**: The confirmation in the reliable source case is weak and unstable because it lacks an explanatory component. In the case where the agent sees the explanation, the confirmation is stronger and more robust. Thus, the Bayesian update on the proposition does not capture the full strength of the confirmation in the genuine explanation case.

  **Crux 2: Is the counterfactual prior approach a legitimate solution to the old evidence problem?**

  - **Case that bears on it**: Consider an agent who has known E for so long that they cannot even imagine not knowing E. They are asked to consider a counterfactual prior from before they knew E. Position A claims that rational agents can engage in such counterfactual reasoning and that it is a valid way to assess confirmation. Position B claims that this counterfactual is not well-defined and does not reflect the agent's actual epistemic state.

  - **Prediction of Position A**: The agent can and should use the counterfactual prior to measure confirmation. This is a normative requirement of rationality.

  - **Prediction of Position B**: The counterfactual prior is not accessible and its use is arbitrary. It does not explain why the agent's credence actually changes when they notice the connection (as in the drawer case).

  **Crux 3: Does the drawer case involve a change in the agent's evidence set?**

  - **Case that bears on it**: In the drawer case, when the connection is noticed, does the agent's evidence set change? Position A says yes, because the agent now has the proposition about the relevance of E to H. Position B says that the evidence set (the set of propositions known) might not change, but the agent's understanding of the implications of the evidence does.

  - **Prediction of Position A**: The agent's evidence set now includes a new proposition (about the connection) and that is why conditionalization applies.

  - **Prediction of Position B**: The agent's evidence set (the known facts) does not change; they already knew E and the background knowledge. What changes is the agent's insight into the explanatory relationship, which is not a new piece of evidence but a new way of seeing the old evidence.

  **Verbal Disagreement**: The term "evidence" is used in two ways. Position A tends to use it for propositions that are known (the data E and the relevance proposition). Position B reserves "evidence" for the data E and sees the explanatory connection as a relation between E and H that is not itself evidence. This is why Position B says that the agent's evidence set does not change.

  **Conclusion of the Statement**

  We, the undersigned, agree on the common ground but continue to disagree on the residual points. We have set out our predictions on the cruxes and commit to revisiting these cases and others to test our positions.

