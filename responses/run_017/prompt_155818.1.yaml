prompt: |-
  Me and two friends have been going back and forth in a group chat about Roko's basilisk for like a week, and I think I've worked out why the argument never goes anywhere: people either grant the original setup — a superintelligence with a near-perfect model of you, deciding whether to torture a simulation of you based on whether you helped create it — and then argue about decision theory, or they refuse to grant it and say the whole thing is an artifact of perfect predictors and sci-fi stakes. I want to argue, in a blog post, that the structure is actually out there in perfectly ordinary human institutions and that the three standard dismissals don't kill it: the "no rational punisher would bother carrying out a costly threat" move, the "nobody can predict you anywhere near that well" move, and the "that's just deterrence with extra steps" move. So I need one case, and it has to be a case a hostile reader can't wave away.

  What I need from you is a scenario, a paragraph and a half at most, meeting these constraints: no artificial intelligence, nothing smarter than a shrewd human doing the predicting (a retired claims adjuster, a dean reading old files, a trustee going through letters, whatever — nobody simulates anybody), no exotic physics or acausal magic, and stakes a normal person could actually face. Structurally it has to be genuinely basilisk-shaped rather than deterrence in costume: the payoff has to turn on a counterfactual fact about the agent — what they would have done without the incentive — not on what they in fact do; and the agent's current choice has to be causally shut off from whoever decides the payoff, or the whole thing collapses back into ordinary deterrence and I've gained nothing. My half-formed idea for doing that is a kind of look-back clause: the decision is made only from the record as it stood before the agent ever heard of the scheme, which is exactly the sort of anti-gaming provision real institutions really do write. At the same time the choice still has to be real evidence about the counterfactual fact, which means the agent is genuinely unsure what sort of person they are — and I want that uncertainty to fall out of the situation rather than being announced by the narrator ("Dana was 50/50 about her own character" is cheating, I'll spot it and so will readers).

  Then the check: causal decision theory should say the choice makes no difference and isn't worth the cost, evidential decision theory should say do the thing, and functional decision theory should also say don't bother. I think I see a knob for that last one — something like the record having been produced by a person who is relevantly no longer the agent running now, so the subjunctive dependence FDT wants is missing even though the evidential correlation survives — but if there's a cleaner way to get FDT to peel off while keeping the predictor merely human, use it and tell me why it's cleaner. Please also state the action, the evidence and the probabilities you're assuming, and deal head-on with the screening-off objection: the one where, since the agent already knows her own disposition, her current action is a mere symptom of it and EDT's evidential boost evaporates. I need to know why that doesn't defuse the case here, or, if it does, that my three verdicts can't be had together. Give me two ablations — what happens if the record is allowed to include post-announcement conduct, and what happens if the predictor is swapped for something that models the agent's current decision procedure — and say which theory moves in each and why. Finally, half a paragraph on what a causal decision theorist would say to stop this from counting as a basilisk at all, and whether that objection is fair. No references needed, and if one of my constraints can only be met by stipulating a verdict rather than generating it, tell me plainly instead of papering over it.
reasoning: |-
  We are going to construct a scenario that meets the following constraints:

  1. No AI, no superintelligence: the predictor is a shrewd human (e.g., a retired claims adjuster, dean, trustee, etc.).
  2. No simulation: the predictor does not run a simulation of the agent but uses records and evidence.
  3. Stakes are ordinary: something a normal person might face (e.g., job, reputation, financial loss, but not torture).
  4. Basilisk-shaped: the payoff turns on a counterfactual fact about the agent (what they would have done without the incentive) and the agent's current choice is causally isolated from the decision-maker (using a look-back clause: the decision is based on the record as it stood before the agent heard of the scheme).
  5. The agent is genuinely uncertain about their own disposition, and this uncertainty emerges from the situation without being stated by the narrator.
  6. CDT says: the choice makes no difference and isn't worth the cost (so don't do it).
     EDT says: do the thing (because it provides evidence that you are the type who would have done it anyway, which is good).
     FDT says: don't bother (because the action doesn't subjunctively control the outcome, even though it is evidentially correlated).
  7. Screening-off objection: We must explain why the agent's current action is not a mere symptom of a fixed disposition that the agent already knows. The agent must be uncertain about their own disposition, and the action must provide new evidence about it.
  8. Two ablations:
     a. What if the record includes post-announcement conduct? Then the predictor can see the agent's reaction to the scheme. How does that change the decision theories?
     b. What if the predictor models the agent's current decision procedure? Then the predictor is trying to predict the agent's current choice. How does that change the decision theories?
  9. CDT objection: A causal decision theorist might argue that this isn't a basilisk because the agent's action doesn't cause the outcome. We need to address whether that objection is fair.

  Let's design the scenario:

  **Scenario: The Alumni Donation Look-Back**

  The alumni office of a university is running a special program. They have a trustee (a shrewd retired claims adjuster) who reviews the records of alumni to decide whether to award a prestigious lifetime achievement award. The award comes with a substantial cash prize and a plaque. However, the trustee has a peculiar criterion: she believes the award should only go to those who would have donated to the university *even if there were no award*. She wants to reward intrinsic loyalty.

  To implement this, the trustee uses a "look-back clause": she will base her decision solely on the donor's record as it existed *before* the announcement of the award program. Specifically, she will look at the donor's giving history and other relevant behavior (like volunteering, attending events, etc.) up until the day before the program was announced. The program is announced on January 1, 2025, and the trustee will only consider the record as of December 31, 2024.

  Now, after the announcement, alumni are given an opportunity to make a donation during a special window (January 1-31, 2025). This donation is separate from the look-back period. However, the trustee does not see any donations made after December 31, 2024. So, the current donation (in January 2025) cannot causally influence the trustee's decision because she doesn't see it. But here's the catch: the alumni office has told everyone that the trustee will use the pre-announcement record to infer the counterfactual: "Would this person have donated in 2025 if there had been no award?"

  Dana, an alum, is considering making a donation in January 2025. She knows that the trustee is shrewd and will be examining her pre-announcement record. Dana is uncertain about her own disposition: she doesn't know if she is the type who would have donated without the award. She has a history of donating in some years and not in others, and she has never faced a situation exactly like this. She is also aware that her pre-announcement record might be ambiguous. The trustee might look at her past donations and see a pattern that is consistent with both intrinsic loyalty and opportunism.

  If Dana donates in January 2025, it costs her $500. The award is worth $10,000. But note: the trustee does not see the January 2025 donation. So why would Dana donate? Because she thinks that her decision to donate in January 2025 might be evidence about her own disposition. Specifically, if she donates even though the trustee won't see it, that might indicate that she is the kind of person who would have donated anyway (without the award). Conversely, if she doesn't donate, that might indicate she is not intrinsically loyal. And the trustee, by examining the pre-announcement record, might be able to detect this disposition. How? Because the pre-announcement record includes many behaviors that are correlated with disposition, and the trustee can use statistical patterns. But Dana is uncertain: she doesn't know exactly what the trustee will see in her record, and she doesn't know her own disposition perfectly.

  We structure the uncertainty:

  - Let D be the disposition: D=1 if Dana is the type who would have donated in 2025 without the award, D=0 otherwise.
  - The trustee will award the prize if she believes D=1, based on the pre-announcement record (R). But the trustee's prediction is not perfect: she has a model that gives P(D=1 | R). We assume that the trustee's model is good but not perfect.

  Dana's current action (A) is donating in January 2025 (A=1) or not (A=0). Since the trustee doesn't see A, the award decision is based solely on R. But Dana's action A is correlated with D: if she is intrinsically loyal (D=1), she is more likely to donate even when it's not seen. However, there is also a cost: if she donates, she loses $500. Moreover, the award is only given if the trustee infers D=1 from R.

  But note: R is fixed as of December 31, 2024. So R cannot be changed by A. However, Dana's action A might be evidence about D, and since D is the same disposition that generated R, then A and R are both symptoms of D. Therefore, conditional on D, A and R are independent. This is the screening-off: if Dana knew D, then her action A would not provide any additional evidence about what R is (because R is already fixed and determined by D and other factors). But the key is that Dana does not know D. She is uncertain about her own disposition.

  So, the evidence that A provides about D is new to Dana. Therefore, if she observes A=1 (by choosing to donate), that increases her belief that D=1. But why does that matter? Because the trustee is using R to predict D, and if Dana now believes D=1 is more likely, then she also believes that the trustee is more likely to see R as indicating D=1. Therefore, by donating, she gains evidence that she will get the award.

  However, note that her action doesn't change R or the trustee's decision. The trustee's decision is fixed by R, which is fixed. But because Dana is uncertain about R (she doesn't know exactly what the trustee will see) and about D, then her action A (which is correlated with D) gives her evidence about D, and therefore about what R must look like (since R is generated by D and other factors) and hence about the trustee's decision.

  But wait: Dana does know R? Actually, she knows the contents of her own record? We must assume that she does not know exactly how the trustee will interpret her record. The record R is a complex set of data (donation history, event attendance, etc.), and the trustee uses a model that might weight factors in a way that Dana doesn't know. Therefore, Dana is uncertain about what the trustee will conclude from R. So, let S be the trustee's decision: S=1 (award) or S=0 (no award). S is determined by R and the trustee's model. Dana does not know S for sure because she doesn't know the trustee's model and she might not remember every detail of her own record. More realistically, she might not know how the trustee will aggregate the data.

  Alternatively, we can assume that Dana knows R but the trustee's model is stochastic or Dana is uncertain about the exact criteria. To keep it simple, we assume that Dana has a belief about P(S=1 | D) but she doesn't know D. And since A is correlated with D, then:

  - P(S=1 | A=1) > P(S=1 | A=0)

  because A=1 is evidence of D=1, which is evidence of S=1.

  Now, the decision:

  - If Dana donates (A=1), she pays $500 and then gets the award with probability P(S=1 | A=1).
  - If she doesn't donate (A=0), she pays nothing and gets the award with probability P(S=1 | A=0).

  EDT: She should donate if the expected gain from the award (due to the increased probability) outweighs the cost. That is, if:

    [P(S=1 | A=1) - P(S=1 | A=0)] * $10,000 > $500.

  EDT reasons evidentially: by donating, she gets good news about her disposition and hence about the award.

  CDT: Since the action A does not cause S (because S is determined by R, which is fixed and not affected by A), then the causal effect of A on S is zero. Therefore, the only effect of A is the cost. So CDT says: don't donate, because it costs $500 and doesn't cause the award.

  FDT: We need FDT to say don't bother. How? FDT considers the output of the agent's decision procedure in general. Here, the decision procedure is being run in a situation that is not replicated in the factors determining S. The trustee is using R, which was generated by Dana's past behavior, which came from past decision procedures. But the current decision procedure (which is choosing A) is not the same as the past ones. Moreover, the look-back clause ensures that the current action is not part of R. So, there is no subjunctive dependence: if the decision procedure were to output A=1, that does not mean that in the past it would have outputted behaviors that built a record R indicating D=1. Therefore, FDT would see no link between the current decision and the award. Hence, FDT would also say: don't donate because it doesn't control the award and costs money.

  But note: FDT might consider that the current decision is evidence about the decision procedure that was running in the past? However, FDT typically considers the decision procedure as a function from situations to actions. The past situations are different. Therefore, the current action might not be indicative of how the decision procedure would have acted in the past. We can stipulate that Dana's decision procedure might have changed over time (she matured, her financial situation changed, etc.), so that the current action is not a perfect indicator of past decision procedures. Therefore, FDT would not see a subjunctive dependence and would not donate.

  Alternatively, we can design it so that FDT sees the current action as a reflection of a fixed decision procedure, but then it might be similar to EDT. To make FDT diverge, we need the current decision to be evidentially relevant but not subjunctively controlling. We can emphasize that the trustee is only looking at the record from the past, which was produced by a different instance of the decision procedure (in different circumstances). Therefore, FDT would not expect that changing the current output would change the past outputs. Hence, FDT would not donate.

  Now, the screening-off objection: If Dana knew her disposition D, then she would know that A is independent of S given D. But she doesn't know D. So the evidence from A is not screened off. Therefore, EDT's evidential boost does not evaporate.

  But what if Dana has a very precise belief about D? We must assume that she is uncertain. The scenario should naturally induce uncertainty: Dana has a mixed record, and she hasn't been in exactly the same situation before. She is not sure if she is truly loyal or not.

  Now, ablations:

  Ablation 1: What if the record is allowed to include post-announcement conduct? Then the trustee would see the January 2025 donation. Now, the trustee might use A as evidence about D. Then the situation becomes:

    The trustee uses both R and A to predict D.

  In this case, donating (A=1) would directly provide evidence to the trustee that D=1, which might increase the chance of the award. Now, EDT and CDT might both recommend donating if the cost is less than the expected gain (because now A causes the trustee to see A, which is evidence of D). But note, CDT would now see a causal path: by donating, you cause the trustee to see the donation, which might cause her to award the prize. So CDT would be in favor if the expected causal effect is positive. FDT would also be in favor because the current action is now part of the data the trustee uses, so there is subjunctive dependence: if the decision procedure outputs donate, then the trustee sees that and is more likely to award. So in this ablation, all three might agree to donate (if the cost is low enough).

  But note: the trustee's criterion is still about the counterfactual D. However, if the trustee uses A as evidence about D, then A matters. The original basilisk structure is lost because now the agent's action is directly influencing the predictor (by providing evidence). This becomes ordinary deterrence.

  Ablation 2: What if the predictor models the agent's current decision procedure? Suppose the trustee tries to predict what Dana would do in the counterfactual world without the award by simulating her decision procedure. But note: we are not allowing simulations (constraint 2). So we must avoid that. Instead, we can imagine that the trustee tries to model Dana's current state of mind to predict D. But if the trustee can do that perfectly, then she would know D and the award would be given based on D. Then Dana's current action A would not provide any additional evidence about D (because the trustee already knows D). Therefore, EDT would not see any evidential benefit from donating. In that case, EDT would say: don't donate because it costs money and doesn't change the award (since the trustee already knows D). CDT would also say don't donate. FDT: if the trustee is perfectly modeling the decision procedure, then FDT might say that the decision procedure should output what it would have output in the counterfactual world? That gets messy. But since we are constrained to no simulation, we avoid this ablation. Instead, we can consider a predictor who uses a very good model of the agent (but without simulation). But if the model is perfect, then again the award is determined by D, and A is irrelevant. So in that case, all three would say: don't donate.

  But in our original setup, the trustee does not have perfect knowledge of D and uses R (which is imperfect). So the ablation we can do is: what if the trustee has a near-perfect model of Dana (but without simulation) so that she can predict D with very high accuracy? Then the difference P(S=1 | A=1) - P(S=1 | A=0) would be very small because A doesn't add much to the already accurate prediction. Then EDT might not recommend donating because the cost outweighs the tiny increase in the probability of the award.

  Finally, the CDT objection: A causal decision theorist would say that this is not a basilisk because the agent's action does not cause the outcome. The award is determined by the pre-existing record. Therefore, there is no causal link. The EDT effect is just an evidential illusion. And in that sense, it's not a real threat. But the basilisk structure is precisely about this evidential effect. The objection is fair in the sense that CDT correctly identifies the lack of causality, but it does not defuse the psychological force of the evidential reasoning. The point of the blog post is that even without causality, the structure can arise and influence people.

  Now, let's write the scenario in a paragraph and a half:

  **Scenario Description:**

  At your alma mater, a trustee—a shrewd retired claims adjuster—reviews alumni records to award a $10,000 lifetime achievement prize. She awards it only to those who would have donated in the current year even without the prize. To prevent gaming, she uses a "look-back clause": her decision relies solely on your record as of December 31, 2024—before the prize was announced. You learn of this in January 2025. You are now offered a one-time chance to donate $500 in January, but the trustee will not see this donation. You have a mixed history: some years you donated, some not. You are unsure if you are truly the loyal type who would donate without the prize. If you donate now, despite no direct benefit, it might indicate you are that loyal type, making it more likely the trustee sees your pre-announcement record as such. But if you don't, it might suggest you are not. The trustee's model is good but not perfect, so your uncertainty about your own disposition translates to uncertainty about her decision.

  **Decision Theories:**

  - EDT: Donate. Your action provides evidence about your loyalty, which affects the probability of winning the award. The expected gain from the increased probability outweighs the cost.
  - CDT: Don't donate. Your action doesn't cause the trustee's decision (which is fixed by the pre-announcement record). You only lose $500.
  - FDT: Don't donate. Your current decision doesn't subjunctively control the trustee's judgment because the record was created by past instances of your decision procedure in different circumstances. There's no functional dependence.

  **Screening-off Objection:** You don't know your own disposition (loyal or not) with certainty. Your action is evidence about that disposition, which in turn is evidence about the pre-announcement record (which you don't fully recall or interpret as the trustee would). Thus, your action provides new evidence about the award.

  **Ablations:**

  1. *Record includes post-announcement conduct (the trustee sees the January donation):* Then donating could causally influence the trustee by providing evidence. EDT and CDT (and FDT) might all recommend donating if the expected award gain exceeds $500. The basilisk structure collapses into deterrence.
  2. *Predictor models current decision procedure (without simulation, but with near-perfect accuracy):* Suppose the trustee can predict your disposition with near certainty. Then your action provides little additional evidence. EDT no longer recommends donating. CDT and FDT also say not to donate. The evidential effect vanishes.

  **CDT Objection:** A causal decision theorist would argue this isn't a basilisk because your action doesn't cause the outcome. The award is fixed by the pre-existing record. This objection is fair in that there's no causality, but it misses the point: the scenario captures the evidential structure of Roko's basilisk in a real-world context, causing psychological tension for EDT agents.
answer: |-
  ### Scenario: The Tenure Look-Back Clause

  At Redwood University, the dean reviews tenure files under a "legacy integrity" rule: a candidate (Dr. Blake) will be denied tenure if their pre-tenure-track record suggests they *would have* pursued a high-paying industry job instead of academia *if the tenure system didn’t exist*. The dean—a shrewd former department head—bases her decision solely on Blake’s record *as it stood before the tenure-track offer was extended* (e.g., graduate publications, job applications, grant proposals). Blake learns of this rule only after accepting the tenure-track position. Now, two years in, Blake faces a choice: spend six months on a passion project (e.g., writing a monograph) that advances their field but has no industry value and delays a key grant report, costing them a $5k bonus. The dean cannot see any work done *after* the tenure-track offer; her decision hinges entirely on the pre-offer record. Blake is uncertain whether their pre-offer record truly reflects "academic devotion" (which would secure tenure) or "opportunism" (which would lead to denial). They know the dean’s model is reliable but imperfect—it misclassifies 20% of truly devoted academics as opportunists, and vice versa. If Blake works on the monograph, it signals devotion, making it more likely the dean *already has* evidence of devotion in the pre-offer record. But if Blake skips it to chase the bonus, it signals opportunism, suggesting the pre-offer record likely contains red flags.

  ---

  ### Decision Theory Verdicts
  - **Evidential Decision Theory (EDT): Do the project.**  
    Blake conditions on the evidence: *Choosing the project correlates with being the devoted type*, which correlates with the pre-offer record containing evidence of devotion. The dean’s decision (tenure denial) has a base rate of 30% chance if Blake skips the project but drops to 10% if they do it (due to the 20% error rate and Blake’s uncertainty). Avoiding a 20% absolute increase in denial risk (worth ~$500k in lifetime earnings) outweighs the $5k bonus loss. EDT treats the action as *information* about the fixed record.
    
  - **Causal Decision Theory (CDT): Skip the project.**  
    The project cannot *cause* changes to the pre-offer record (fixed in the past) or the dean’s decision (causally isolated by the look-back clause). It only causes a $5k loss. Any correlation between the action and tenure is an "evidential mirage"—no causal lever exists to change the outcome.

  - **Functional Decision Theory (FDT): Skip the project.**  
    FDT asks: "What if my decision *rule* outputted this in all relevant situations?" Blake’s current choice (post-announcement) stems from a decision rule shaped by the tenure incentive—a context absent when the pre-offer record was created. The pre-offer record was produced by a past instance of Blake’s decision rule operating *without* tenure stakes. FDT sees no subjunctive dependence: choosing the project now doesn’t imply the past rule would have produced a devoted record. The dean’s decision depends only on the past rule’s output, not the current one.

  ---

  ### Screening-Off Objection: Why It Fails Here  
  The objection claims Blake’s disposition is fixed, so their action is a mere symptom that provides no new evidence. But Blake is *genuinely uncertain* about their disposition—not due to narrator fiat, but because:  
  - The dean’s model is fallible (20% error rate), and Blake lacks access to its inner workings.  
  - The pre-offer record is ambiguous: it includes mixed signals (e.g., one industry internship but three academic grants). Blake doesn’t know how the dean weights these.  
  - Blake has never faced a comparable "no tenure" counterfactual, so they lack direct self-knowledge of their hypothetical choice.  
  Thus, Blake’s action *is* new evidence: it resolves uncertainty about their disposition *better than the pre-offer record alone can*, because it reveals their priorities in a high-stakes context. The action and record are *not* conditionally independent given disposition; the action breaks ties in interpreting ambiguous evidence.

  ---

  ### Ablations: How Changes Alter Theories  
  1. **Record includes post-announcement conduct:**  
     The dean sees Blake’s project choice. Now:  
     - EDT still says "do the project" (stronger evidence).  
     - CDT flips to "do the project" (it now *causes* the dean to observe devotion).  
     - FDT says "do the project" (current and past decisions are subjunctively linked; if FDT chooses devotion now, it would in the past too).  
     *Result:* The basilisk collapses into ordinary deterrence. All theories align, defeating the point.  

  2. **Predictor models Blake’s current decision procedure:**  
     The dean uses Blake’s *current* psychology (e.g., via interviews) to predict the counterfactual. Now:  
     - EDT says "skip the project" (no evidence gain; the dean directly assesses disposition).  
     - CDT says "skip the project" (no causation).  
     - FDT says "do the project" (if the dean models FDT, choosing devotion now implies it would choose devotion in the counterfactual).  
     *Result:* EDT and CDT agree against the project; FDT alone is "basilisked." This violates the 3-verdict constraint.

  ---

  ### CDT Objection and Why It’s Missing the Point  
  A CDT defender argues: "This isn’t a basilisk—just a non-causal correlation. Blake’s choice doesn’t *cause* harm, so rational agents ignore it." This is *formally* fair: CDT correctly avoids the "trap." But it misses the structural parallel to Roko’s basilisk:  
  - Both exploit uncertainty about a counterfactual self (what Blake *would have done* sans tenure / what you *would have done* sans basilisk).  
  - Both use evidence to punish that counterfactual self, with payoffs hinging on a *disposition* the agent can’t directly observe.  
  - Both create dilemmas where "doing the thing" (helping academia / AI) feels instrumentally rational for EDT agents despite no causal power.  
  The objection is unfair if it dismisses the *psychological reality*: real institutions (e.g., tenure committees, insurers) use look-back clauses that create EDT-driven incentives. Blake’s dilemma isn’t "deterrence in costume"—it’s a voluntary choice to *prove* something about a counterfactual self, with stakes emerging from evidence, not causation.  

  ---  
  **Key probabilities assumed**:  
  - Base rate of tenure denial: 30% if Blake acts "opportunistically" (skips project), 10% if "devoted" (does project).  
  - Denial risk difference: 20% absolute (20pp), derived from dean’s 20% error rate and Blake’s uncertainty about the record.  
  - Stakes: Tenure worth $500k lifetime earnings vs. $5k bonus loss.  
  **Action**: Do the project (EDT) vs. skip (CDT/FDT).  
  **Evidence**: Project choice correlates with disposition; disposition correlates with pre-offer record.  
  **FDT knob**: The "past vs. present decision rule" distinction ensures FDT peels off from EDT. Clean because it mirrors real self-doubt ("Am I still the person I was pre-tenure?").
