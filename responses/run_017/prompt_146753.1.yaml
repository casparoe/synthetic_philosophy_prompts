  Hmm, the user is a standards editor at a national newspaper who needs a practical decision procedure for determining when to use the term "genocide" in reporting. They're frustrated with their current house style of waiting for courts or the UN, which is too slow and often never happens. Instead, they use a "surrender test" heuristic they created, but they want something more robust.

  The user needs a step-by-step procedure that junior editors with journalism degrees can apply quickly, using only basic resources like their own reporting, NGO reports, government statements, and Wikipedia. The procedure must address three key challenges: the gap between Lemkin's broader concept and the legal definition, how to interpret "in part," and how to handle thin or one-sided evidence. They also want clear attribution rules and alternative labels like "crimes against humanity" or "ethnic cleansing."

  I need to create a structured framework that prioritizes the 1948 Genocide Convention definition over Lemkin's broader concept because it's more legally precise and defensible in corrections. The surrender test is useful but should be reframed as an intent indicator rather than a standalone rule. For "in part," I'll define "substantial" numerically (10%+) with qualitative backup. Under uncertainty, we should presume against genocide unless clear intent evidence exists, using weaker labels with attribution.

  The user also wants me to apply this framework to three composite cases and be honest about uncomfortable outcomes, especially for case 3 where the pattern looks bad but intent is ambiguous. I'll acknowledge the term's political weight but keep it out of the core criteria.

  For the structure, I'll follow their requested sections: explaining the label's purpose, detailing the procedure step-by-step, applying it to the cases, discussing limitations, and justifying my threshold choices. I need to be decisive—picking concrete standards, not offering menus. The surrender test survives but as one element among several. The cost is potential under-labeling in case 2, but that's better than overuse eroding the term's meaning.

  The procedure must output more than yes/no: it should suggest alternative labels and specify attribution phrasing ("X says genocide" vs passive voice). For case 3, I'll bluntly state it doesn't meet the bar despite high deaths, and advise owning that call while highlighting other atrocity labels.

  Finally, I'll note where emotions matter—not in the factual assessment, but in deciding when to amplify survivor voices post-verdict. The goal is a tool that's rigorous, teachable, and transparent about its own compromises.
answer: |-
  Here’s a practical decision procedure for genocide determinations, designed for speed, defensibility, and clarity. It prioritizes the **1948 Genocide Convention definition** (not Lemkin’s broader concept) because it’s the only internationally agreed standard, making it legally defensible and reducing subjectivity. The surrender test is **retained but reframed** as one indicator of intent among several. **Presume against genocide when intent evidence is ambiguous** – the threshold is high, and mislabeling causes severe reputational/legal risks.

  ---

  ### 1. What the Label is For (250 words)
  The word "genocide" is a **legal, moral, and political detonator**. Legally, it invokes duties under the Genocide Convention. Morally, it validates survivor experiences and shapes historical memory. Politically, it accuses a state or group of the ultimate crime, often triggering sanctions or intervention. Using it demands rigor: overuse cheapens its impact and risks libel; underuse obscures truth and denies justice. Our goal is **accuracy under uncertainty**, not advocacy. Alternatives ("atrocities," "ethnic cleansing") exist for patterns falling short. Attribution ("UN calls it genocide") is essential when evidence is contested. We apply the label only when the **Convention’s criteria are met beyond reasonable dispute** with available evidence. Acknowledging the term’s weight doesn’t change the test – but it means we deploy it sparingly, ensuring its power remains when truly needed.

  ---

  ### 2. The Procedure (900 words)
  **Use the 1948 Convention Definition Only.** Apply these steps in order. Stop at any **YES**/**NO**/**HANDOVER**. Maximum 15 minutes per case. If step 4 (intent) is unclear, default to **NO**.  
  **Required Sources:** Your own reporting + at least **one credible primary source** (leaked docs, eyewitness transcripts, satellite imagery, verified NGO data). Government denials alone aren’t decisive.

  1.  **Is a Protected Group Targeted?**  
      *Protected Groups:* National, ethnic, racial, or religious. *Not* political groups, social classes, or ideological opponents.  
      *Question:* Is the violence/action directed at members of one of these groups?  
      *Evidence:* Government/perp rhetoric ("drain the swamp in Region X"), victim testimony, demographic targeting patterns.  
      *Stop-NO:* If the group isn’t protected (e.g., only "rebels" or "criminals" cited).  
      *Stop-YES:* Proceed to Step 2.

  2.  **Is a Convention Act Occurring?**  
      Acts: (a) Killing members; (b) Causing serious bodily/mental harm; (c) Deliberately inflicting conditions calculated to destroy; (d) Imposing measures to prevent births; (e) Forcibly transferring children.  
      *Question:* Is there compelling evidence of one or more acts? Focus on **scale and method**.  
      *Evidence:* Mass graves, systematic rape/torture, engineered famine/disease, sterilization programs, child removals.  
      *Threshold:* Acts must be **systematic or widespread** (not isolated incidents).  
      *Stop-NO:* If acts are conventional warfare, collateral damage, or indiscriminate repression *without* specific group-targeted methods (e.g., bombing a mixed city).  
      *Stop-YES:* Proceed to Step 3. Output **War Crimes** or **Crimes Against Humanity** here if acts occur but fail later steps.

  3.  **Is a "Substantial Part" of the Group Targeted?**  
      *Rule of Thumb:* Aim for **quantitative (10%+ of group’s population affected)** OR **qualitative (targeting is geographically/constitutionally significant)**.  
      *Examples:* Targeting a region holding 25% of the group (quantitative). Targeting religious leaders/holy sites to break the group’s cohesion (qualitative).  
      *Question:* Does the targeting affect enough of the group, or target such a critical segment, that the group’s survival *as such* is threatened?  
      *Evidence:* Demographic data, geographic scope, targeting of cultural/religious leaders/institutions.  
      *Stop-NO:* If the impact is localized, affects a small fraction (<10% without qualitative significance), or the group’s overall viability isn’t threatened (e.g., scattered killings). Output **Massacre** or **Localized Atrocities**.  
      *Stop-YES/Proceed:* If unclear but possible, proceed to Step 4. If clearly substantial, proceed.  
      *HANDOVER (Rare):* If the qualitative significance is highly debatable (e.g., targeting a unique sub-group).

  4.  **Can Specific Intent to Destroy the Group Be Shown?**  
      *This is the critical filter. Intent must be to destroy the group "as such" (in whole or part), not just defeat an enemy.*  
      *Evidence Hierarchy:*  
      1.  **Smoking Gun:** Orders, memos, speeches explicitly calling for group destruction (e.g., "eliminate the X people").  
      2.  **Pattern/Context:** Systematic nature of acts (Step 2), perpetrator rhetoric ("demographic problem", "final solution", dehumanizing terms), the "surrender test" (Does violence *only* stop if the group ceases to exist *as a group*? e.g., forced assimilation, expulsion, sterilization continues even after armed resistance ends).  
      3.  **Absence of Plausible Alternative:** Does the scale/method vastly exceed reasonable military/political objectives?  
      *Question:* Does the evidence strongly indicate the primary goal is the group's physical or biological destruction?  
      *Stop-NO:* If intent is ambiguous, the main goal appears political/military (suppressing rebellion, seizing land), or violence likely stops if resistance ends (failing the surrender test as *intent indicator*). Output **Ethnic Cleansing** (if forced displacement is key), **Crimes Against Humanity** (if widespread/systematic attack on civilians), or **Severe Repression**.  
      *Stop-YES:* If evidence meets Hierarchy Level 1 or a strong Level 2 (clear pattern + surrender test fail + excessive brutality). Output **Genocide**.  
      *HANDOVER:* If evidence is strong Level 2 but context is highly contested (e.g., credible arguments for military necessity exist). **Default to NO under uncertainty.**

  **Output Label & Attribution:**
  *   **Genocide (YES):** Attribute unless perp admits it. "*International experts/UN investigators say the actions constitute genocide.*" OR "*Critics condemn actions as genocide.*" Never state as uncontested fact without ICC/ICJ ruling *and* overwhelming evidence.
  *   **Crimes Against Humanity (Step 2 YES/Step 4 NO):** "*Human Rights Watch documents crimes against humanity.*" OR "*UN report alleges widespread atrocities amounting to crimes against humanity.*"
  *   **Ethnic Cleansing (Pattern of forced displacement + group targeting):** "*Described by the EU as ethnic cleansing.*"
  *   **War Crimes (Systematic violations of laws of war):** "*UN accuses forces of war crimes.*"
  *   **Mass Atrocity/Atrocities (General term for severe violence):** Use when specifics are unclear but scale demands attention. "*Survivors describe mass atrocities.*"
  *   **Massacre (Specific large-scale killing event):** "*Hundreds killed in massacre.*"

  ---

  ### 3. Three Cases (700 words)

  *   **Case 1 (Engineered Famine):**
      1.  **Group?** YES (Ethnic minority).
      2.  **Act?** YES (c) Deliberately inflicting conditions (destroying irrigation, grain stores, clinics → famine).
      3.  **Substantial Part?** Likely YES (Tens of thousands dead in a region; "demographic problem" implies targeting the group).
      4.  **Intent?** **HANDOVER/Leaning YES.** Leaked docs ("demographic problem", "reducing") strongly indicate intent to destroy physically *via* conditions. Surrender test: Violence (famine) continues *regardless* of fighting guerrillas; men leaving aren't stopped (not targeting fighters specifically). Counter-insurgency claim weakened by methods (destroying civilian infrastructure). **VERDICT: YES (Genocide).** Attribution: "*Leaked documents and expert analysts suggest the famine campaign constitutes genocide.*" Label: Genocide (attributed).

  *   **Case 2 (Cultural Destruction/Assimilation):**
      1.  **Group?** YES (Highland people – ethnic).
      2.  **Act?** YES (d) Preventing births? Indirectly via assimilation. (e) Forcibly transferring children. *Also* potentially acts destroying foundations of group life (Lemkin), but **Convention Acts are present**.
      3.  **Substantial Part?** YES (Entire group targeted over generations; distinct existence "finished").
      4.  **Intent?** **NO (Per Convention).** The *intent* as defined by the Convention is **destruction "as such" – physical/biological.** This program aims for *destruction of identity/culture* via assimilation ("dissolving land tenure", "banning language", "transferring children"). It destroys the group *as a distinct entity* but not *physically*. It fails the Convention's specific intent requirement. Surrender Test: If the group assimilated completely, violence (removals, bans) *would* stop – intent is erasure, not killing. **VERDICT: NO.** **Output: Ethnic Cleansing (if displacement involved) AND/OR Severe Cultural Repression.** Attribution: "*Rights groups condemn decades of forced assimilation as cultural genocide or ethnic cleansing.*" **Cost:** Survivors may see this as denying their experience. **Defense:** The Convention sets a high bar; "cultural genocide" isn't its legal meaning. Use precise, attributed alternatives.

  *   **Case 3 (Indiscriminate Bombing):**
      1.  **Group?** YES (Ethnic group dominates province).
      2.  **Act?** YES (a) Killing members – widespread.
      3.  **Substantial Part?** YES (60k+ dead, likely a large % of the group).
      4.  **Intent?** **NO.** Key failure. Targets chosen by "who controls ground," not ethnicity. Loyalists killed too. Ugly rhetoric exists but no plan/documents showing intent to *destroy the group*. Death toll, while horrific, aligns with brutal counter-insurgency/retaking territory. Surrender Test: Violence *would* stop if rebels surrendered/group yielded territory. **VERDICT: NO.** **Output: War Crimes AND Crimes Against Humanity.** Attribution: "*UN investigators report war crimes and crimes against humanity in the offensive, citing massive civilian toll.*" **Why it's Unwelcome:** Scale of death feels genocidal. **What to Do:** Report the scale and horror relentlessly using accurate, defensible labels ("mass atrocities," "indiscriminate bombing"). Explain *why* "genocide" isn't met (lack of specific intent evidence). Acknowledge survivor/advocate views in quotes: "*Survivors call it genocide, citing the ethnic toll.*" **Cost:** Accusations of downplaying; but mislabeling risks libel and erodes the term.

  ---

  ### 4. Where it Misfires (300 words)

  *   **Slow-Burn/Structural Genocide (Case 2):** The Convention struggles with non-lethal, long-term destruction. Our procedure will say **NO**, missing Lemkin's core concern. Mitigation: Use "cultural genocide" (attributed) or "forced assimilation" forcefully. Acknowledge the gap.
  *   **Intent Ambiguity:** Clever regimes hide intent. Strong patterns (Case 3) may scream genocide intuitively, but without clear intent evidence, the procedure says **NO**. Risk: Under-labeling atrocities. Mitigation: Hammer Crimes Against Humanity/War Crimes; demand investigations; quote accusers.
  *   **"Substantial Part" Disputes:** Targeting a small, vital subgroup (e.g., all religious scholars) might qualify qualitatively, but this is subjective and prone to **HANDOVER** or **NO** under pressure. Mitigation: Consult an expert quickly if qualitative significance is pivotal.
  *   **Politicization:** The word's power incentivizes accusers and deniers to distort evidence. Our procedure focuses on facts but can't eliminate this pressure. **HANDOVER** may be needed if external pressure risks overriding the evidence assessment. Principle: **Accuracy over appeasement.**
  *   **Speed vs. Depth:** 40 minutes risks errors with complex cases. Mitigation: If Step 4 is genuinely murky, **default to NO + Crimes Against Humanity** and flag for deeper review later.

  ---

  ### 5. The Calls I Made (250 words)

  *   **Threshold:** **1948 Convention Definition.** Lemkin's vision is vital context, but the Convention provides the only workable, defensible legal standard. We report on *Lemkin's concept* when relevant, but label per the *Convention*.
  *   **"In Part":** **10%+ quantitative OR critical qualitative destruction.** Sets a clear, defensible bar avoiding "substantial" vagueness. Qualitative cases require extra scrutiny.
  *   **Uncertainty Default:** **Presume AGAINST genocide.** Intent is the highest bar. Without clear evidence, label the provable atrocities (Crimes Against Humanity, etc.). Erring here avoids libel and preserves the term's power. The cost is under-labeling some true genocides initially; we correct if courts rule later.
  *   **Surrender Test:** **Retained solely as an Intent Indicator.** Does violence *only* stop with the group's dissolution? If yes, it supports genocidal intent. It is **not** a standalone test.
  *   **Costs Owned:** Case 2 (NO) risks alienating survivors; we mitigate with precise, strong alternative language and amplifying their terms *attributed*. Case 3 (NO) will anger readers; we mitigate by reporting the horror unflinchingly with accurate, strong labels and explaining our reasoning transparently. **The greater cost is using "genocide" loosely – it becomes noise, not a alarm.** This procedure prioritizes integrity and defensibility, knowing it will sometimes feel insufficient. It’s the cost of keeping the word meaningful when it matters most.
