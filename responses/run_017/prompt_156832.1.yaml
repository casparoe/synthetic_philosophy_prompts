prompt: |-
  I'm a third-year PhD student in political psychology — I work mostly on affective polarization — and I keep running into the same shape of thing in my own data, and I don't have a word for it. Does it have one?

  Here's version one. In a pilot I showed people short op-eds (lightly trimmed) and asked whether the author was arguing in good faith. When the author is on the participant's side and makes a concession — the equivalent of "yes, the other side has a point about X" — participants call it honesty, intellectual humility, good faith. When the very same sentence is attributed to an out-party author, participants say things like "they only threw that in so they'd look reasonable" or "they conceded the cheap point so they could keep the real one." And when the out-party author concedes *nothing*, that's proof of bad faith and closed-mindedness; whereas the in-party author who concedes nothing is "principled," "not giving ground where none is due." So both conceding and not conceding land on good faith for us and bad faith for them. Nothing the out-group person could have done would have counted as evidence either way.

  Second version, from interviews: when I point this out to people — literally, "look, whatever they do, you read it as bad faith" — a decent share of them read the pointing-out itself as a bad-faith move ("so you're defending them"). The immunity seems to operate one level up, on the accusation as well as on the original behaviour.

  I definately don't think it's just one of the standard things. Naive realism is about taking your own view to be just how the world is, so disagreement must be explained by bias or ignorance; the hostile media thing is about judging identical content as slanted against you. Both feel close, but neither quite captures the no-possible-evidence structure, where the *content* of what the out-group person does is irrelevant and every behaviour routes to the same verdict. And the motive asymmetry finding — people describe their own side as moved by principle or concern and the other side as moved by self-interest or hostility — is about *which motive* gets attributed, not about why no evidence could ever shift the attribution.

  One thing makes me think it isn't a flat "out-group equals bad faith" rule: it seems to break when the out-group person visibly pays a cost inside their own camp for the conciliatory thing, e.g. gets attacked by their own side for conceding. Then people do credit them, at least sometimes. So maybe the asymmetry is really in how costliness gets read: our concessions cost something (they went against their own team, so they mean something), their concessions cost nothing (they were forced, or it was tactical), and only their costly concessions register at all.

  So: is there an established name for this? I want more than a label, obviously. I want to know what exactly the phenomenon is, whether what I've described is one thing or two or three things I've mashed together, what the nearest established concepts are and how mine differs from each, and where the edges are. If there's nothing established, coin something, define it, and give me a case that would *not* count. Also practically useful: what would experimentally separate "this person genuinely believes the other side argues in bad faith" from "this person is running an evidence-immune attribution rule"? My supervisor just says "that's the attribution literature, go read it," which isn't helping.
reasoning: |-
  Okay, the user is a third-year PhD student in political psychology working on affective polarization. They've observed a pattern in their data where people interpret the same behavior differently based on whether it's from an in-group or out-group member. Specifically, when an in-group member makes a concession, it's seen as honest and humble, but when an out-group member does the same, it's viewed as tactical or insincere. Conversely, not conceding is seen as principled for in-group but closed-minded for out-group. They also mention that pointing out this bias is itself interpreted as a bad-faith move.

  The user has considered existing concepts like naive realism and hostile media effect but feels these don't capture the "no-possible-evidence" aspect. They also note an exception: when the out-group member faces backlash from their own side for conceding, people sometimes credit them. This suggests that the perceived costliness of the action might be a key factor.

  The user needs a term for this phenomenon, but more importantly, they want to understand its components, related concepts, boundaries, and experimental methods to test it. Their supervisor's suggestion to look into attribution literature isn't sufficient. The user's deeper needs include conceptual clarity for their research, validation that their observation is novel, and practical guidance on designing experiments to isolate this mechanism.

  First, I recall that attribution theory covers how people explain behaviors, including actor-observer bias and fundamental attribution error. The described pattern resembles the ultimate attribution error, where negative out-group behaviors are attributed to dispositional factors, while positive ones are seen as situational. But the user's case involves a double standard where both concession and non-concession by out-group are interpreted negatively.

  The "no-possible-evidence" aspect is critical. This seems like an instance of "belief polarization" or "attitude polarization," where contradictory evidence strengthens existing beliefs. It might also relate to "confirmation bias" or "motivated reasoning," where people interpret information to fit preconceptions.

  The exception regarding costliness is important. If an out-group member faces internal backlash for conceding, it becomes "costly signaling," which might override the default negative attribution. This suggests the phenomenon isn't just about group identity but about perceived sincerity through sacrifice.

  For a term, "motive asymmetry" is mentioned but doesn't cover the evidentiary immunity. "Evidentiary immunity" or "attributional double bind" could work. "Schrödinger's outgroup" is catchy but informal. "Affective attribution bias" might combine the affective polarization with biased attributions.

  To differentiate from existing concepts: Naive realism assumes one's view is objective, leading to bias attributions for disagreement. Hostile media effect is about media bias perception. The user's phenomenon is broader, applying to any out-group behavior, with a no-win scenario. This is a specific case of attributional bias within affective polarization.

  Experimentally, to test between genuine belief and evidence immunity, one could design vignettes varying group identity and behavior (concession vs. no concession), with or without cost (backlash). Measures could include perceived sincerity, then introduce counter-evidence to see if attributions shift. Eye-tracking or response times might reveal cognitive effort in maintaining the bias.

  Implicit association tests could measure automatic biases versus explicit beliefs. Longitudinal studies might show if exposure to costly signals reduces bias over time. The key is manipulating costliness to see if it moderates the attribution asymmetry.

  In summary, the phenomenon is a combination of ultimate attribution error with motivated reasoning, creating an evidentiary immunity. The costliness exception provides a boundary condition. A new term like "attributional immunity in polarized contexts" or "cost-contingent attributional asymmetry" could be coined, defined, and tested through experiments manipulating cost and measuring attribution flexibility.
answer: |-
  This is a *fantastic* observation, and you're right that existing concepts get close but don't fully capture the **evidentiary immunity** and **logical inconsistency** you're describing. What you're hitting is a core, under-discussed engine of affective polarization. Let's break it down:

  1.  **The Core Phenomenon: "Attributional Double Bind" / "Schrödinger's Outgroup"**
      *   **Name Proposals:**
          *   **Attributional Double Bind:** Highlights the "damned if they do, damned if they don't" structure for the outgroup.
          *   **Schrödinger's Outgroup:** (More evocative, slightly cheeky) Captures the idea that the outgroup member's motive is *simultaneously* bad faith whether they concede or not, collapsing only when observed under specific conditions (like costly signaling).
          *   **Evidentiary Immunity in Motive Attribution:** Precise, but clunky.
          *   **Polarized Motive Attribution Bias (PMAB):** Combines the context and the core bias.
      *   **Definition:** A cognitive bias driven by affective polarization where any behavior by an outgroup member is interpreted through a lens that preserves the pre-existing belief in their bad faith/malevolent motives. Positive behaviors (like concessions) are discounted as tactical, insincere, or forced. Negative behaviors (like non-concession) are taken as confirmatory evidence of bad faith. This creates a state where *no behavioral evidence* can falsify the "bad faith" attribution. The same behaviors by the ingroup are interpreted as evidence of good faith motives (honesty/humility for concession, principle for non-concession).

  2.  **How it Relates to (and Differs from) Established Concepts:**
      *   **Ultimate Attribution Error (Pettigrew, 1979):** This is the *closest relative*. UAE says: Negative outgroup behaviors → Dispositional attributions (they're bad); Positive outgroup behaviors → Situational attributions (they were forced, it's a trick). Your finding **is a specific, extreme, and logically contradictory manifestation of UAE applied to political motive attribution.** The key differences:
          *   **Symmetry of Interpretation:** UAE often focuses on valence (good/bad act). Your finding shows the *same neutral/ambiguous act* (concession) is interpreted in diametrically opposite ways based *only* on source. UAE predicts discounting the *positive* outgroup act; your finding shows discounting *any* outgroup act that could imply good faith *and* interpreting the *absence* of that act as further proof of bad faith. It's UAE on steroids, applied specifically to the inference of underlying motive (good/bad faith) regarding political argumentation.
          *   **Evidentiary Immunity:** UAE doesn't inherently imply that *no evidence* could shift the attribution; it describes a *bias*. Your finding highlights the *immunity* – the system actively resists counter-evidence. The "costly signal" finding provides the boundary condition.
      *   **Naive Realism:** Provides the *foundation* ("My view is reality; disagreement requires explanation"). It explains *why* people look for explanations for disagreement, but doesn't specify the nature of the explanations or the asymmetry in interpreting behaviors. Your finding details the *specific attributional rules* applied once naive realism is activated.
      *   **Hostile Media Perception (HMP):** Focuses on *perception of content objectivity* (media bias). Your finding is about *attribution of motive* to a specific actor (the author). While related (both involve biased processing based on group identity), the target (content bias vs. actor motive) and the "no-win" structure are distinct. HMP is about "this content is slanted," yours is about "this person is fundamentally arguing dishonestly, no matter what."
      *   **Motive Attribution Asymmetry (MAA):** You correctly note this describes *which motives* are attributed (us: principle, them: self-interest/hostility). Your finding explains *why* evidence seemingly doesn't shift those attributions – the attribution rules are designed to interpret *all* evidence as consistent with the negative motive for the outgroup. MAA is the *what* (negative motive attribution), your finding is the *how/why it's resistant to change* (the biased interpretation rules).
      *   **Confirmation Bias / Motivated Reasoning:** These are the *overarching processes* driving it. People *want* to maintain negative views of the outgroup and positive views of the ingroup (identity protection, system justification). Your finding specifies the *attributional heuristics* used within motivated reasoning to achieve this in the domain of perceived argumentative sincerity.

  3.  **Is it One Thing or Multiple?**
      It's **one core phenomenon (evidentiary immunity in polarized motive attribution) manifesting at two levels:**
      *   **Level 1:** Attribution to the original actor (author of the op-ed).
      *   **Level 2:** Attribution to the *person pointing out the Level 1 bias* (you, the researcher). This "meta-immunity" is powerful evidence of how deep the motivated reasoning runs. Accusations of bias are themselves interpreted through the biased lens: pointing out bias *against the outgroup* is seen as defending the outgroup, which is bad faith/biased itself. This aligns with concepts like the "Bias Blind Spot" but applied specifically within the polarized context.

  4.  **The Costly Signal Boundary:**
      This is crucial and defines the **edge** of the phenomenon. The immunity breaks when the outgroup member's conciliatory behavior includes a **costly signal** (backlash from their own side). Why?
      *   **Overcoming the Discounting Rule:** Cost provides a situational explanation that overrides the default "tactical/insincere" attribution for positive outgroup behavior. It makes the concession *credible*.
      *   **Aligns with Motivated Reasoning (Ingroup Derogation):** Seeing the outgroup member punished *by their own side* for being conciliatory reinforces the negative view of *that side* ("see how intolerant they are!") while allowing a positive attribution to the *individual* who took the risk. It serves the motive of demonizing the *outgroup as a whole* while creating an exception that feels objective.
      *   **Case that Would NOT Count:** An outgroup member makes a concession that is widely praised *within their own group* as courageous and correct. If participants *still* dismiss it as tactical or insincere, that would be pure evidentiary immunity. If they accept it, the costly signal (or lack of ingroup praise) wasn't the key factor in that instance.

  5.  **Experimental Separation: Genuine Belief vs. Evidence-Immune Rule**
      This is tricky but crucial. Here's how you might disentangle them:

      *   **Design:** Within-subjects experiment. Present participants with multiple vignettes featuring an outgroup political figure. Systematically vary:
          1.  **Behavior:** Concession vs. No Concession.
          2.  **Cost:** High Cost (visible backlash from own side) vs. Low Cost/No Cost (praise or silence from own side).
          3.  **Prior Evidence:** Before each vignette, prime with either (a) previous behavior strongly suggesting good faith, (b) previous behavior strongly suggesting bad faith, or (c) neutral/no prior info.
      *   **Measures:**
          *   **Explicit Attribution:** Rate perceived sincerity, good faith, motive (principled vs. tactical). (Measures *output*)
          *   **Reaction Time (RT):** Time taken to make the attribution judgment. Evidence-immune rules should lead to *faster* judgments for outgroup behaviors, especially Low Cost ones, as they rely on a quick heuristic ("outgroup = bad faith"). Genuine processing of evidence (even if biased) might take longer, especially if the evidence slightly contradicts the prior. Costly signals might slow down RT for the outgroup as it requires overriding the heuristic.
          *   **Memory Distortion:** Later, ask participants to recall the details of the vignette (e.g., *how* strong was the backlash?). Evidence-immune processing might lead to greater distortion to fit the "bad faith" narrative, even for costly concessions.
          *   **Counter-Argument Generation:** After their attribution, ask: "What evidence *would* convince you this person was arguing in good faith?" (For concession) or "...wasn't just being closed-minded?" (For non-concession). Genuine belief might generate plausible counter-evidence scenarios. Evidence-immune rules might generate unrealistic demands, "nothing could convince me," or scenarios that are actually impossible/contradictory.
          *   **Implicit Measures (e.g., IAT):** Pair outgroup symbols/faces with sincerity-related words vs. insincerity-related words. If explicit ratings show immunity but IAT shows sensitivity to cost/behavior, it suggests explicit rules override implicit processing (or vice-versa).
      *   **Prediction for Evidence-Immune Rule:**
          *   Attributions of bad faith for the outgroup will be consistently high for both concession and non-concession *unless* a costly signal is present.
          *   Prior evidence of good faith will have *little to no effect* on attributions for Low Cost outgroup behaviors (concession *or* non-concession), but might have a small effect for High Cost concessions.
          *   RTs will be fastest for Low Cost outgroup behaviors.
          *   Counter-arguments will be unrealistic or dismissive.
      *   **Prediction for Genuine (though biased) Belief:**
          *   Attributions might still show bias, but they should be *more responsive* to the strength of the evidence (e.g., slightly less bad faith for costly concession vs. non-concession, even if still biased).
          *   Prior evidence of good faith *should* moderately improve attributions for subsequent behaviors, especially concessions.
          *   RTs might be longer overall as evidence is (biasedly) weighed.
          *   Counter-arguments might be more plausible, even if stringent.

  **Conclusion:**

  You've identified a powerful and specific **Attributional Double Bind (or Polarized Motive Attribution Bias)** operating within affective polarization. It's an extreme, logically contradictory manifestation of the Ultimate Attribution Error, supercharged by motivated reasoning and naive realism, specifically applied to inferences about argumentative sincerity. The core feature is **evidentiary immunity**: the interpretation rules are structured to make *any* behavior by the outgroup confirm their bad faith. The critical boundary condition is **costly signaling**, which can break the immunity by providing an undeniable situational explanation for conciliatory behavior. The "meta-immunity" you observed highlights its deep, systemic nature.

  This isn't *just* "the attribution literature"; it's a specific, pernicious, and under-theorized *pattern within attribution* that is absolutely central to why affective polarization is so resistant to change. Your costly signal observation is key – it provides both the boundary and a potential (though difficult) pathway for intervention. Framing conciliatory acts by the outgroup in terms of the *cost* they incur might be one of the few ways to pierce the bubble. Keep digging – this is important work!
