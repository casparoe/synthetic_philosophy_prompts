prompt: |-
  Hey — I'm a novelist, about a hundred and twenty thousand words into a third draft, and I keep hitting the same problem in scene after scene and I've decided it's actually a philosophy problem, so here goes.

  My book is mostly in free indirect style, and it has two threads that are giving me trouble. One: a POV character who has aphasia after a stroke — she can't produce or understand language, but I've been writing her chapters as fully worded interior monologue, because that's the only way I know to make a reader care about her, and the chapters are the best things in the book. Two: another character has a bodily sensation she privately names and tracks in a notebook, marking a sign (call it S) every time it comes back, and she's convinced it predicts her seizures; nobody else can check it, and I want to know what I'm committing to when I write that she was right, or wrong, about it being the same sensation again. And then underlying both: my narrator is constantly stating what characters feel in third-person grammar, with no behavior on the page to back it up, and I can't tell any more whether that's fine or whether it's cheating.

  I read Wittgenstein in a survey course fifteen years ago. I remember a beetle in a box, and something about a person who writes a private mark whenever a feeling recurs, and the general vibe that a language only one person could understand is supposed to be incoherent. That's about it. I do not want to go read the scholarship, and please don't give me a reading list or tell me what to look up — I want the thing itself, operationalized.

  So: write me a decision procedure I can run on a single scene in about ten minutes while I'm revising, in plain language, with no theory vocabulary I'd have to look up (if a term is unavoidable, define it in one line, because my editor will ask me why I cut a passage and she has to be able to follow the answer). Give me the questions in order, what counts as a sufficient answer to each, the point where the procedure stops with a hard no — meaning I cut or rewrite the passage — and the point where it hands the decision back to me because it's a literary or values call rather than something the argument settles. I've got maybe forty scenes like this and my editor wants the revision in ten weeks, so it has to be something I can apply repeatedly without stopping to think about first principles every time.

  The hard cases it has to handle: a mind with no language at all; a private sign for a sensation that no one else can check; free indirect narration that asserts an inner state with no outward criteria given; and a character (there's one, from a culture with no vocabulary for the state in question) where I suspect the procedure just can't settle it and I'd rather be told that than get a fake verdict.

  Then run it on three actual cases: the aphasia chapter, the notebook-with-S thread, and one free indirect passage where the narrator says a character's grief is unbearable and there is nothing on the page to show it. I want at least one of those to come back with a verdict I won't like — I'm pretty sure the aphasia chapter's best paragraph is indefensible and I want to see whether the procedure actually says so or whether I can wriggle.

  And be honest about the translation: tell me which distinctions have to survive the flattening into a checklist (I'm guessing something about the difference between expressing a pain and reporting that you have one, and between criteria and mere symptoms, and the point that the target is a picture of how signs get their meaning rather than a denial that people have inner lives) and which can be dropped without the procedure breaking. Then tell me what it can't do: it can't tell me whether the prose is any good, and I assume it can't settle whether a creature whose behaviour is nothing like ours has experiences at all, but say what else.

  Also, I'm not sure the private-mark thing is even the same problem as the aphasia thing — tell me if they're different problems and the procedure needs to branch.

  Anyway. Third draft, definately overthinking it, send help.
reasoning: |-
  Okay, this novelist is deep into their third draft and hitting philosophical walls. They're wrestling with three core issues: writing an aphasic character's inner monologue, handling a private sensation notation system, and using free indirect style that states emotions without behavioral cues. They explicitly want a practical checklist, not theory - with hard stops for "cut this" versus "literary judgment" zones.

  Hmm, the key move here is operationalizing Wittgenstein's private language argument into a diagnostic tool. Need to identify what absolutely can't work versus what's artistically risky but defensible. The beetle box analogy is crucial - if something is truly private (like the stroke victim's wordless awareness), showing it through language creates a contradiction. But for the seizure predictor, it's about whether the "S" mark could mean anything verifiable at all.

  For the procedure, I'll structure it as a five-step filter: 
  First question must torpedo truly impossible cases (like claiming a non-verbal being is having verbal thoughts). 
  Second question tackles the "private sign" problem by demanding some potential public anchor. 
  Third is about emotional assertions needing observable hooks. 
  Fourth handles cross-cultural gaps. 
  Fifth is the escape valve for artistic choices that break rules knowingly.

  Testing on their examples: 
  The aphasia chapter's beautiful paragraph probably fails at step one - you can't narrate verbal thoughts for someone who can't have them. That'll hurt, but they anticipated that. 
  The "S" notation might survive if there's any conceivable way to falsify it (like a scene where she mispredicts a seizure). 
  The "unbearable grief" without evidence gets flagged at step three but might be salvaged if context supports it.

  Important disclaimers: This won't judge prose quality, can't solve other-minds problems, and cultural gaps may be unresolvable. The private sensation and aphasia issues are distinct - one's about meaning, the other about possibility. 

  The writer's clearly brilliant (calling their own best work indefensible!) but time-crunched. Checklist design prioritizes speed: clear yes/no thresholds, minimal jargon. "Observable hook" defined as anything another character could theoretically notice. "Verifiable" as anything testable in the story's reality.

  Biggest sacrifice in simplification: flattening Wittgenstein's "grammar of sensations" into binary checks. But for their deadline, worth it. Final step intentionally vague about "artistic payoff" because that's where voice and vision trump philosophy.
answer: |-
  Here's your ten-minute scene diagnostic tool. It asks five questions in sequence, stops at the first "Hard No," and flags unresolvable cases. No theory jargon - just plain terms defined in-line.

  **The Wittgenstein Scene Check (v1.0 for Novelists Under Deadline)**

  **Core Principle:** A sign (word, mark, feeling-label) needs *some* connection to public, observable reality to mean something specific. You can’t *privately guarantee* meaning forever. Inner states are real, but *describing them meaningfully in a story* needs hooks the reader (or other characters) can grasp.

  **Definitions:**
  *   **"Observable Hook"**: Something another character could *potentially* see, hear, or infer from behavior/physical state *in the story world* (e.g., flinching, crying, a recorded temperature, a specific action taken).
  *   **"Verifiable"**: Could *someone in the story world, in principle* (even if they don't), check if this sign/feeling/claim matches something external? Doesn't mean they *do* check, just that it's *possible*.
  *   **"Specific Meaning"**: Does the sign point clearly to *one thing* (e.g., "S" = *this exact seizure-predicting sensation*, not just "a weird feeling")?

  ---

  **The Procedure (Run on ONE scene/chunk at a time):**

  1.  **Is there a claim about *language* or *thoughts* happening *inside* a character who *cannot* use or understand language (like severe aphasia)?**
      *   *Sufficient "No"*: The character is thinking in images, sensations, urges, raw emotions *without forming words or sentences*. Narration describes *those non-verbal states*.
      *   *Sufficient "Yes"*: The narration presents *actual words/sentences* as the character's inner monologue ("She thought, 'Why won't they understand me?'").
      *   **VERDICT:**
          *   **YES → HARD NO. CUT/REWRITE.** (Beetle-in-Box Problem: Language requires shared rules. A mind utterly devoid of language capability cannot have linguistically structured thoughts. Narrating verbal thoughts for them is incoherent. Show non-verbal awareness instead.)
          *   **NO → Proceed to Question 2.**

  2.  **Is there a *private sign* (like "S") used *solely* by one character to mark a *private sensation* (like the seizure predictor), where *no one else could ever verify* what it points to?**
      *   *Sufficient "No"*: There is *some* potential link to the public world. E.g., The sensation *always* precedes a verifiable event (seizure), even if only the character feels it. *Or*, the character describes it using public language ("a buzzing in my left thumb"). *Or*, someone else *could* theoretically correlate the mark "S" with the subsequent event.
      *   *Sufficient "Yes"*: The sign "S" refers *only* to a feeling that *only she ever experiences*, and its supposed meaning (predicting seizures) *cannot be verified or falsified by anyone, ever*, even in principle. The link is purely her private declaration.
      *   **VERDICT:**
          *   **YES → HARD NO. CUT/REWRITE.** (Private Language Problem: A sign no one else *could* understand or check is meaningless. "S" predicting seizures only works if seizures are public events verifying the prediction. If "S" is just a mark for an untestable feeling, it signifies nothing specific.)
          *   **NO → Proceed to Question 3.**

  3.  **Does the narration *state* a character's specific inner state (feeling, belief, sensation) *without* providing *any* "Observable Hook" in the scene? (e.g., "He felt unbearable grief," "She was convinced it was betrayal," "The pain spiked")**
      *   *Sufficient "No"*: There is *at least one* Observable Hook in the scene (a tear, a clenched fist, a shaky voice, a specific action motivated by the state, a physical reaction like paling).
      *   *Sufficient "Yes"*: Pure assertion. Zero description of behavior, physical reaction, or context that manifests the state. Just the narrator telling us.
      *   **VERDICT:**
          *   **YES → Flag for Review.** (Criteria vs. Symptoms: Asserting inner states without *any* outward criteria risks being empty telling. It *might* work if context is overwhelming, but it's weak. *Not* an automatic cut, but highly suspect. Needs strong justification in Step 5).
          *   **NO → Proceed to Question 4.**

  4.  **Is the inner state/sign tied to a *specific cultural concept* lacking vocabulary/understanding *within the character's own culture* in the story?**
      *   *Sufficient "No"*: The state/sign uses concepts familiar within the character's culture (even if unique to them personally, like the "S" sensation).
      *   *Sufficient "Yes"*: The state/sign relies on a concept entirely foreign to the character's culture (e.g., a pre-industrial character experiencing "existential dread" as defined by 20th-century philosophy).
      *   **VERDICT:**
          *   **YES → "Cannot Settle - Cultural Gap."** (The procedure hits its limit. Does the character *truly* experience this? Can it be *meaningfully* described? This requires pure *literary judgment* about authenticity, metaphor, and reader buy-in. The procedure gives no verdict.)
          *   **NO → Proceed to Question 5.**

  5.  **Is the passage *vital* for character/plot/thematic reasons *despite* potential philosophical wobbliness identified in Q3?**
      *   *This is your call.* Weigh the artistic payoff against the weakness flagged in Q3 (pure assertion) or the inherent risk in Q4 (cultural gap).
      *   **VERDICT: Artistic Judgment.** The procedure hands it back to you. Keep, cut, or rewrite based on instinct and editorial goals.

  ---

  **Testing on Your Cases:**

  1.  **Aphasia Chapter (Best Paragraph):**
      *   Q1: **YES** (It presents verbal inner monologue for a character who cannot have language). **VERDICT: HARD NO. CUT/REWRITE.** (Sorry! This is the beetle box. You *can* show her non-verbal awareness, perception, emotion, confusion, frustration *through* how she experiences the world sensorily and reacts physically. But verbal thoughts are off the table. Rewrite into sensory/emotional non-verbal POV.)
  2.  **Notebook-with-S Thread (Scene where she marks "S"):**
      *   Q1: NO (Assuming she has language).
      *   Q2: **DEPENDS.** Is "S" *only* a mark for an untestable feeling? Or does it *predict* the public event of a seizure?
          *   If she marks "S" and seizures *sometimes* follow (and sometimes don't!), then it's **NO** (verifiable link exists, even if imperfect). Proceed. (Q3 might flag if *only* the mark is shown with no sensation description/hook).
          *   If "S" *only* marks the feeling and its predictive power is never testable (or is declared infallible), then **YES → HARD NO.** (Meaningless private sign). **Rewrite:** Show some failed predictions or ambiguous cases. The feeling *must* have consequences in the public world for "S" to mean something specific.
  3.  **Free Indirect: "His grief was unbearable." (No behavior shown):**
      *   Q1: NO (Language capable character).
      *   Q2: NO (Not a private sign issue).
      *   Q3: **YES** (Pure assertion, no hook). **VERDICT: Flag for Review.** (Philosophically weak - "unbearable grief" with *zero* manifestation is just noise. Can you add *one* observable hook in this scene? A breath caught? Eyes fixed on a void? A weight in his limbs? If not, does the surrounding context *overwhelmingly* support it? If not, rewrite or cut. This is often telling, not showing.)

  **What the Translation Keeps & Drops:**
  *   **Keeps (Essential):**
      *   The core distinction: **Meaningful Signs vs. Empty Noise.** (Signs need *some* public anchor, even if subtle).
      *   **Expression vs. Report:** Showing the *manifestation* of a state (expression) vs. just stating it exists (report). (Q3 enforces needing manifestation/hooks).
      *   **Criteria vs. Symptoms:** Observable hooks act as potential *criteria* for attributing the inner state, making it meaningful. Lack of hooks makes it a mere symptom report, which is weak. (Built into Q2 & Q3).
      *   **Target:** It's about *how signs get meaning in the narrative*, *not* denying inner life exists. (The procedure assumes inner states are real but demands ways to *signify* them meaningfully).
  *   **Drops (Simplified):**
      *   Deep dives into "grammar," "language-games," "rule-following." The checklist focuses on actionable narrative tests.
      *   Nuances of "pain behavior" vs. "pain." We use "Observable Hook" as a practical umbrella.
      *   The full complexity of "knowing other minds." We focus on *representing* them coherently *for the reader*.

  **What It Can't Do:**
  1.  Judge prose quality (beauty, rhythm, voice).
  2.  Settle if radically alien beings (or philosophical zombies) have inner states. (It assumes human-like minds unless specified otherwise).
  3.  Resolve deep cultural gaps definitively (Q4 hands it back).
  4.  Tell you if a thematic *metaphor* works despite philosophical tension.
  5.  Replace your intuition about character truth or emotional resonance. It just flags potential incoherence or weak representation.
  6.  Handle purely fantastical/internal magic systems *unless* they have defined, verifiable rules within the story world. (If "S" is magic, define its rules publicly!).

  **Are Aphasia & Private Sign Different?**
  Yes, but the procedure branches naturally:
  *   **Aphasia (Q1):** Is about the *possibility* of linguistic thought. A hard limit.
  *   **Private Sign (Q2):** Is about the *meaningfulness* of a sign/symbol. Requires a public link.
  *   **Free Indirect Assertion (Q3):** Is about *grounding* claims of inner states. Requires observable hooks.
  They are distinct problems tackled by different questions.

  **Your Hard Cases:**
  *   **Aphasia:** Q1 gives the **HARD NO** you expected for verbal thoughts. Non-verbal interiority is still possible.
  *   **Private Sign (S):** Q2 is the gatekeeper. **Require verifiable consequences** (seizures) for "S" to mean something. Infallibility breaks it.
  *   **Cultural Gap Character:** Q4 will say **"Cannot Settle"**. You must make the literary call based on empathy, research, and narrative necessity.

  **Final Tip:** Run this *after* your instinctive revision pass. Use it to surgically target problem spots flagged by your gut or editor. It's a debugger, not the whole writing process. Good luck with draft 4!
