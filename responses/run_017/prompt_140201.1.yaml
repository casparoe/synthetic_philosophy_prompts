  Okay, the user is a philosophy professor teaching a seminar on the ethics of war. They've encountered a recurring argument structure in student papers and published works where the wrongness of a war is acknowledged at a macro level but doesn't translate to any practical consequences for individual soldiers. The professor identifies two nuances: first, the "inert conclusion" where blame doesn't attach to soldiers despite the war's injustice; second, the "migrating cost" where the soldier's excuse becomes a burden for their opponents.

  Hmm, this is a sophisticated ethical dilemma. The professor clearly has deep familiarity with just war theory but is deliberately avoiding naming specific doctrines (like *jus ad bellum* vs *jus in bello* independence) to prevent students from fixating on labels. Their frustration is palpable - they call it "sloppy thinking" even in published works. 

  The core tension seems to be between moral accountability and practical constraints in warfare. The professor's observation about epistemic excuses (soldiers not knowing the war is unjust) being converted into increased risks for their opponents is particularly acute. I recall Walzer touches on this in "Just and Unjust Wars" with the "moral equality of soldiers" concept, but the professor wants to dissect the mechanism, not just cite authorities.

  Their colleague's international law perspective (separating *jus ad bellum* and *jus in bello*) feels insufficient because it doesn't explain why the moral weight disappears at the individual level. The professor wants to expose the logical structure itself - how premises fail to generate expected conclusions.

  For the migrating cost phenomenon, the professor's coinage "excused party's freebie" is telling - they sense it's misnamed because the soldier doesn't benefit, the opponent bears the cost. That inverse relationship is crucial. It's almost like a moral hazard where the blameless actor's protected status externalizes harm.

  The boundary cases they want will need to test: 1) how ignorance functions as both shield and sword 2) when epistemic limits genuinely excuse vs. enable harm 3) whether the opponent's burden is proportionate. Scenarios with varying levels of available evidence (e.g., Vietnam draft vs. Nazi troops) could help isolate variables.

  Since they're philosophically trained, framing this as a "normative asymmetry" might resonate - the soldier's excuse creating an asymmetrical burden shift. But the definition must capture that the excuse doesn't expand the soldier's permissions nor restrict others' actions against them, only imposes costs on those they attack.
answer: |-
  This is a brilliantly articulated critique of a pervasive pattern in war ethics, and your dissection of the "inert conclusion" and "migrating cost" captures a genuine conceptual gap. While established concepts touch on aspects, neither the phenomenon as a whole nor its two key wrinkles have a single, widely accepted name. Here's the carving you requested:

  1.  **The Core Phenomenon: Normative Asymmetry of Systemic Wrongdoing**
      *   **What it is:** A structural feature where the moral wrongness of a large-scale action (like an aggressive war) is acknowledged at the systemic level ("*jus ad bellum* failure"), yet this wrongness fails to generate *significant downstream normative consequences* for the individual agents (soldiers) carrying out the action within the system, particularly regarding their permissions, obligations, or liability to defensive harm. The wrongness remains inert at the operational level ("*jus in bello*").
      *   **Key Mechanism:** The justification relies heavily on the *epistemic limitations* of the individual agent ("reasonable belief," "due diligence," "reliance on authority") to block blame and obligations (like desertion), while simultaneously insisting that opponents must treat these agents *as if* they were acting permissibly.

  2.  **Your Two Wrinkles: Distinct but Interconnected Manifestations**
      *   **Wrinkle 1: The Inert Conclusion Effect**
          *   **What it is:** The acknowledged systemic wrongness fails to translate into concrete obligations for individual agents (e.g., to refuse service, desert) or liabilities (e.g., post-war punishment). The wrongness is acknowledged but rendered operationally irrelevant for the agent.
          *   **Nearest Concepts:** This draws heavily on the principle of the *"Independence of *Jus in Bello* from *Jus ad Bellum*"* (the core doctrine your colleague mentioned), and the *"Moral Equality of Combatants"* (MEC). However, as you note, these *describe* the separation but don't adequately *explain* or *critique* the **inertness** – *why* the systemic wrongness doesn't generate *any* significant downstream duties or liabilities for the unjust combatants themselves, beyond perhaps a weak "should have known better."
      *   **Wrinkle 2: The Migrating Cost / Reverse Moral Hazard**
          *   **What it is:** The epistemic excuse *intended* to absolve the agent of blame or obligation (e.g., "he reasonably believed") is functionally repurposed to *impose additional burdens or costs* (increased risk, restraint) onto the *victims* or *defenders* (the just side). The excuse for Agent A becomes a cost borne by Agent B, *without* correspondingly restricting Agent A's permissions or increasing Agent B's permissions against A.
          *   **Nearest Concepts:**
              *   **Distributive Injustice/Asymmetry:** It highlights an unfair distribution of the *costs* associated with the unjust combatant's epistemic situation.
              *   **Reverse Moral Hazard:** Normally, moral hazard occurs when protection from risk encourages risky behavior. Here, the *excuse* granted to the unjust combatant (removing their risk of blame/obligation) *incentivizes* the continuation of the harmful action and *externalizes* the risk onto the defenders. It's "reverse" because the hazard isn't to the excused party but *created by* them for others.
              *   **Weaker than "Strict Liability":** The migrating cost phenomenon argues that even *without* strict liability for the unjust combatant (which MEC rejects), the epistemic excuse shouldn't *actively create obligations for the defenders* beyond baseline *jus in bello*.
          *   **Crucial Difference:** This isn't just about the *excused party* having permissions (like MEC grants); it's about their *excuse generating specific, additional burdens on their adversaries* that wouldn't exist if the excuse weren't accepted.

  3.  **Why Existing Concepts Don't Fully Cover It:**
      *   **Moral Equality of Combatants (MEC):** Explains *why* both sides have the same *jus in bello* permissions/constraints and neither is criminal *merely* for fighting. It *enables* the inert conclusion but doesn't explain the *mechanism* of epistemic excuse or the *migration of cost*. MEC focuses on the *agent's status/permissions*, not on how their excuse burdens their *victims*.
      *   **Independence Thesis:** Explains the *separation* of the two levels of judgment. It *describes the framework* where inertness occurs but doesn't analyze *why* the systemic wrongness becomes inert for the individual agent or how excuses migrate costs.
      *   **Excuses vs. Justifications:** This distinction explains *why* the soldier isn't *blamed* (excuse) but doesn't address the inertness of systemic wrongness or the migration of cost. An excuse typically negates blame *only*, not necessarily downstream obligations or the impact on others' permissions/costs.
      *   **Collective Responsibility:** Addresses blame for the *group* but struggles with individual culpability and permissions within the unjust system, and doesn't touch the migrating cost.
      *   **"Innocent Threat":** Covers cases where someone poses a threat through no fault of their own. However, the unjust combatant *is* acting intentionally (even if excusably), and the migrating cost phenomenon specifically arises from the *epistemic excuse* being used to *impose defensive burdens*, not just the fact that they are a threat.

  4.  **Proposed Term and Definition:**
      *   **Term: Excuse-Driven Burden Shift (EDBS)**
      *   **Definition:** A normative phenomenon occurring in contexts of systemic wrongdoing (e.g., unjust war) where:
          1.  An agent (A) is granted an epistemic excuse (e.g., reasonable belief, non-culpable ignorance) for their participation in the wrongdoing, absolving them of blame and potentially negating specific obligations (e.g., to resist/desert).
          2.  This excuse, however, fails to generate significant restrictions on A's operational permissions or increase their liability to defensive harm.
          3.  Crucially, the acceptance of A's excuse functionally *imposes additional burdens or costs* (e.g., heightened restraint, increased risk) onto the victims or defenders (B) acting against A, beyond the baseline requirements of defensive action.
      *   **The "Shift":** The burden associated with A's epistemic limitation (which excused *A*) is shifted onto *B*.

  5.  **Boundary Cases for Discussion:**
      *   **Case 1: The Conscripted Student (Weak EDBS?):** A barely-adult conscript in a totalitarian state, fed relentless propaganda, fights in an aggressive war. Strong epistemic excuse seems plausible. Does imposing significant *additional* restraint on defenders (e.g., banning certain weapons usable against regular troops) constitute an unjust EDBS? Or is the baseline restraint sufficient? Where is the line?
      *   **Case 2: The Willfully Ignorous Professional (Strong EDBS?):** A highly trained officer in a democracy with access to independent media ignores reports questioning the war's justification because "patriotism" or career ambition. They claim reasonable belief. Does accepting this excuse (even partially) and then demanding defenders incur extra risks to avoid harming *this* officer exemplify an objectionable EDBS? How culpable does the ignorance need to be for EDBS to become problematic?
      *   **Case 3: The "Clean Hands" Dilemma (Testing the Limit):** Just defenders face unjust combatants benefiting from EDBS (excused, defenders must take extra risks). To defeat the threat effectively within resource constraints, defenders *must* use tactics that impose higher risks on the unjust combatants than baseline *jus in bello* allows *if* EDBS applies. Is adhering to EDBS here morally required, supererogatory, or potentially even wrong if it significantly jeopardizes the just cause? Does EDBS have an upper limit defined by proportionality for the *defenders*?

  **Conclusion:** While the "Independence Thesis" and "Moral Equality of Combatants" provide the *framework*, the specific phenomena you identify – the **inertness** of systemic wrongness for individual agents and the **migration of cost** from the excused perpetrator onto their victims – are best captured together by the concept of **Excuse-Driven Burden Shift (EDBS)**. It highlights the problematic asymmetry: the epistemic excuse shields the agent from blame and obligation *while simultaneously being converted* into a justification for imposing greater burdens on those they are harming. This framing moves beyond merely describing the separation (*jus ad bellum* vs. *jus in bello*) to critically analyzing the *normative dynamics* and *distribution of costs* that arise *because* of that separation and the reliance on epistemic excuses. It directly addresses your observation that the wrongness asserted at one level "goes completely inert" operationally and, worse, "leaves the people he's attacking worse off."
