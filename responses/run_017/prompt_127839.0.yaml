  **Argument & Weaknesses:**
  1. **Why this works:** It resolves your core tensions:
     - **Container vs. Harvester:** Containers didn't *foreclose* labor alternatives (unions could fight automation); harvesters made small farms structurally nonviable.
     - **Roundabout Symmetry:** All drivers yield equally; no distributive conflict embedded.
     - **Glued Battery:** Repair isn't foreclosed (laws can mandate parts), unlike harvester-driven farm economics.

  2. **Where it breaks:**
     - **Lecture Seating:** "Weaker sense" verdict is messy. If bolting *only* exists to deter rearrangement (not fire codes), it becomes more political.
     - **Mesh App Confidence:** 0.6 reflects tension: Design enables *both* emancipation and oppression. Principle prioritizes *latent foreclosure capacity* (e.g., surveillance potential if logs exist).

  3. **Rival Principle (if symmetric costs aren't enough):**  
     *"Artifacts have politics when they encode irreversible authority over human choices, making certain social outcomes non-negotiable."*  
     This would make **roundabouts political** (yielding non-negotiable) but **glued batteries not** (repair negotiable via laws). I reject it as over-inclusive.

  **Final Defense:** Winner’s core insight was about *constitution-like* technologies. This principle captures that by focusing on artifacts that **codify social relations** by shutting down democratic pathways. The tomato harvester codified agribusiness dominance; speed bumps codify residential priority; EHRs codify billing over care. The shipping container merely optimized logistics within existing relations.
