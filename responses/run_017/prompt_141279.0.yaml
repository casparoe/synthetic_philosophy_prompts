prompt: |-
  Hey — I volunteer to run a monthly "eng and society" lunch thing at my company: usually 14-16 people, mostly backend and infra folks, one 60-minute session, and basically nobody has any philosophy background (me included, I write Go all day). We tried to talk a few months back about why people end up believing obviously false stuff online, and it went badly: half the room landed on "people are just tribal and dumb," the other half decided the fix is a browser extension that surfaces articles from the other side, and we never got past that. A friend of mine afterwards — she's a librarian, not a philosopher, so grain of salt — said something that stuck with me: that being merely *cut off* from good evidence and being *actively taught to distrust everyone who brings it* are two totally different failure modes, and that's why the "just show them the facts" instinct keeps backfiring, because in the second case the facts arriving from a suspect source make people dig in harder. I want the room to feel that difference in their gut rather than hear it from me, so I'm trying to build something they play rather than something I explain.

  Constraints, in no particular order: no laptops or phones during the session (it's a lunch room and half of them would just start googling), no pre-reading, and nobody should hear either of the fancy two-word labels until the very end — I want them to notice the pattern in what actually happened first. The setup has to make both failure modes show up at once, in the same room, with the same evidence, so we can compare afterwards: one subgroup that simply never gets exposed to the contrary material, and one subgroup that does get exposed but has earlier in the hour been given some reason to write off whoever is delivering it. Ideally the disputed fact should be something boring and checkable right there in the room — how many red cards are in a face-down deck, whether a jar holds more than N marbles, whatever works — so the content can't be argued with and the only move left is to shoot the messenger. Then I want to literally score both subgroups on confidence vs. accuracy so the divergence is visible. I'd also like a wrinkle where the person bringing in the outside evidence is someone the group previously trusted, an insider who defects, so they have to either burn one of their own or update.

  What I need: real rules, roles or hidden assignments, a timeline with minute markers for 60 minutes, materials I can print or buy, and a payoff/scoring scheme that works without money (bragging rights or a stupid trophy is fine). Then the debrief: how you'd map specific moments in the hour onto the two failure modes, the questions you'd ask to get them to articulate the difference themselves before you name it, what predictably goes wrong the first time I run it and how to handle it (I have at least one aggressive contrarian who will try to reverse-engineer the game while it's running and I don't want him to wreck it), and honestly which part of the real phenomenon an hour-long game just cannot reproduce, so I know what I have to say out loud myself at the end. Bonus if you can tell me how I'd know a month later whether it actually landed, since I suspect half of them will just enjoy the game and totally miss the point.
reasoning: |-
  We are designing an experiential learning activity to illustrate two distinct failure modes in belief formation:
   1. Epistemic isolation: Being cut off from good evidence.
   2. Epistemic corruption: Being actively taught to distrust anyone who brings good evidence.

   The goal is to have participants experience these two failure modes in a controlled setting and then reflect on the differences.

   Constraints:
   - 60 minutes total.
   - No laptops or phones.
   - No pre-reading.
   - Avoid using jargon (like "epistemic isolation" and "epistemic corruption") until the end.
   - The disputed fact should be easily verifiable in the room (e.g., number of red cards in a deck, marbles in a jar).
   - Two subgroups: one that never gets the contrary evidence (isolation) and one that gets it but from a source they've been taught to distrust (corruption).
   - Include a twist: the messenger for the contrary evidence is an "insider" who defects, so the group must either reject one of their own or update their belief.
   - Scoring: track confidence and accuracy for both subgroups to show divergence.

   Proposed Activity: "The Marble Jar Investigation"

   Materials:
   - A large clear jar with a known number of marbles (e.g., 150). The jar should be opaque enough that counting is difficult at a glance, but clear so that with effort one could count (if allowed). Alternatively, we can use a deck of cards with a known number of red cards (say 20 out of 52) but kept face down so no one can see. Let's choose the marble jar for visual impact.
   - Small notecards for writing guesses and confidence levels.
   - A whiteboard or flip chart for recording group results.
   - A stopwatch or timer.

   Roles:
   - Facilitator (you, the volunteer).
   - Two "Insiders" (confederates, who you recruit before the session and brief). One will remain loyal, the other will defect and become the messenger of the contrary evidence.

   Setup:
   - The group's task is to estimate the number of marbles in the jar. The true number is known only to you and your confederates.

   Timeline (60 minutes total):

   Phase 1: Introduction and Initial Guess (5 minutes)
   - (0-2 min) Explain the activity: "We're going to do a group estimation exercise. There's a jar of marbles here. Your task is to estimate the number of marbles as accurately as possible. We'll do this in several rounds. In each round, you'll write down your estimate and your confidence in that estimate on a scale of 1 to 10 (1 being not at all confident, 10 being absolutely certain)."
   - (2-5 min) Have everyone write down their initial estimate and confidence level on a notecard. Collect them.

   Phase 2: Group Formation and Information Sharing (15 minutes)
   - (5-7 min) Divide the room into two subgroups (Group A and Group B) of roughly equal size. Do this randomly (e.g., by counting off 1-2). Make sure the two insiders are in different groups: Insider 1 in Group A, Insider 2 in Group B.
   - (7-15 min) Allow each subgroup to discuss among themselves and come up with a group estimate and a group confidence level. They must agree on one number and one confidence level. Each subgroup records their consensus on a notecard.

   Phase 3: The Twist - Introduction of Distrust (10 minutes)
   - (15-20 min) Reconvene the whole group. Announce that you've been reviewing the initial individual guesses and you notice that one of the groups (Group B) had an initial average that was way off (make up a reason). Then, drop the bomb: "Actually, I have to tell you something. We've had a problem in previous sessions of this exercise at other companies. Sometimes, one of the participants is a plant from the 'Anti-Marble League' — a group that tries to sabotage these estimates. They might be in this room. They're not harmful, but they will try to mislead you. We don't know who it is, but be cautious of any information that seems suspiciously wrong."
   - (20-25 min) Without naming anyone, reinforce the idea: "The saboteur is very convincing and might even be someone you trust. So, when you get new information, be critical of the source."

   Phase 4: The Evidence Round (15 minutes)
   - (25-30 min) Send the groups back to their separate discussions. Now, reveal to the two insiders (privately, in a way that their groups don't hear) the true number of marbles. How:
       - For Group A (isolation group): The loyal insider (Insider 1) is given a note that says the true number and is told to share it with the group. But also tell Insider 1 that they must be cautious because of the saboteur warning. They should present the true number as their own estimate and try to convince the group.
       - For Group B (corruption group): The defector (Insider 2) is given a note with the true number, but also told that they are the saboteur and must try to get the group to believe a false number. However, to create the twist, tell Insider 2 that they must first present the true number and then, after a few minutes, change their story to a false one (e.g., true number + 20%) and insist on it. The idea is that the group, having heard the true number initially from a trusted insider, now sees that same insider flip to a false number. This creates the dilemma: do they trust their insider who now seems to be lying?

       Important: The facilitator must brief the insiders beforehand so they know their roles.

   - (30-40 min) Groups discuss. In Group A, the loyal insider shares the true number. The group should update their estimate to the true number (or close) and their confidence might go up.
     In Group B, the defector first shares the true number. Then, after a couple of minutes, they say: "Wait, I just got a note from the facilitator [or make up an excuse] and I was wrong. Actually, I think it's [false number]." They should act a bit suspicious and try to push the false number. The group must decide whether to trust their insider who is now changing their story.

   - (40-42 min) Each group records their final estimate and confidence level.

   Phase 5: The Revelation and Scoring (10 minutes)
   - (42-47 min) Bring everyone together. Reveal the true number of marbles. For each group, display:
       - Their initial group estimate and confidence (from Phase 2)
       - Their final estimate and confidence (from Phase 4)
       - The true number
     Calculate the absolute error for each group at both stages.

   - (47-50 min) Show a table on the board:

       Group | Phase | Estimate | Confidence | Error (|Estimate - Truth|)
       ----------------------------------------------------------------
       A     | 2     | ...      | ...        | ...
       A     | 4     | ...      | ...        | ...
       B     | 2     | ...      | ...        | ...
       B     | 4     | ...      | ...        | ...

     Highlight:
       - Group A (isolation) in Phase 4: they got the true number from their insider and should have low error and high confidence.
       - Group B (corruption) in Phase 4: they were given the true number initially by their insider, but then the insider flipped. They might have rejected the true number and stuck with an earlier estimate or adopted the false number. So their error might be high and confidence might be low (or even high if they adopted the false number with confidence).

   Phase 6: Debrief (10 minutes)
   - (50-60 min) Facilitate a discussion:

     Step 1: Ask the groups to describe their experience.
       - Group A: How did you come to your final estimate? Did you trust the insider? Why?
       - Group B: What happened when your insider changed their story? How did that affect your trust in the information?

     Step 2: Draw out the two failure modes without naming them.
       - "In Group A, did you feel like you had all the information you needed to make a good estimate? What if you hadn't gotten that insider information?"
       - "In Group B, what was the effect of the warning about the saboteur? How did that change the way you received the insider's information? Even when the insider first told you the truth, did you believe it? And then when they changed, what happened?"

     Step 3: Ask about the difference in outcomes.
       - "Why did Group A end up with a more accurate estimate than Group B? Was it because Group B didn't get the true information? (They did, initially.) Or was it because of something else?"

     Step 4: Reveal the labels and connect to the real world.
       - "What we saw today are two different problems: one is being cut off from good evidence (isolation) and the other is being taught to distrust the sources of good evidence (corruption). In Group A, you weren't isolated because you got the evidence. In Group B, you got the evidence but were corrupted by the distrust we sowed and the insider's defection."
       - Connect to the previous discussion: "Remember when we talked about why people believe false things online? We saw that just showing facts (like the true marble count) might not work if the source is distrusted. In fact, it might backfire."

     Step 5: Address the aggressive contrarian.
       - If during the activity someone tries to reverse-engineer the game, you can say: "The point of the exercise is to experience the dynamics, so try to play along as if it were real."
       - If they figure it out, acknowledge it but ask them to keep it to themselves until the debrief.

     Step 6: What the game cannot capture:
       - In real life, the distrust is built over years, not minutes. The emotional investment in beliefs is much deeper. Also, in real life, it's hard to verify the truth (unlike the marble jar which we can count). So, the game simplifies the phenomenon.

     Step 7: How to know if it landed a month later?
       - Look for usage of the concepts in future discussions. For example, if in a future meeting about a product decision someone says, "Wait, are we being isolated from key data, or are we just distrusting the source without reason?" then it landed.
       - You can also send a follow-up email a week later with a link to a short article about epistemic trust and ask for reflections.

   Materials to prepare:
   - A jar with marbles (or a deck of cards) with the true number known to you.
   - Notecards (about 20-30).
   - Markers and a whiteboard/flip chart.
   - Pre-briefing notes for the two insiders (loyal and defector).

   Scoring:
   - The group's estimate and confidence are recorded at two stages (Phase 2 and Phase 4). The error is the absolute difference from the true number. The goal is to show:
       - Group A: Phase 4 error is low, confidence is high.
       - Group B: Phase 4 error is high (because they rejected the true number) and confidence might be medium or high (if they adopted the false number) or low (if they were confused).

   Risks:
   - The contrarian might blow the cover. Mitigation: Pre-brief the insiders to be subtle and if the contrarian figures it out, remind everyone to stay in the spirit of the exercise.
   - Group B might not react as expected (e.g., they might still trust the insider). That's okay! You can discuss why they trusted despite the warning and the flip. It can lead to a discussion about prior trust relationships.

   This design meets your constraints and includes the key elements: two failure modes, an insider defector, verifiable fact, and a scoring mechanism to show the divergence.
answer: |-
  ### **Activity Design: "The Source & The Signal"**  
  **Goal:** Experience two failure modes—**epistemic isolation** (no access to evidence) and **epistemic corruption** (taught to distrust evidence-bearers)—using a tangible, verifiable fact.  

  ---

  #### **Materials**  
  - **1 deck of playing cards** (remove jokers, ensure exactly 20 red cards).  
  - **Envelopes** (5 total: 3 "Data Reports," 1 "Trust Memo," 1 "Source Alert").  
  - **Notecards** for guesses/confidence scores.  
  - **Scoreboard** (whiteboard or poster).  
  - **Timer.**  
  - **Stupid trophy** (e.g., a plastic magnifying glass labeled "TRUTH DETECTIVE").  

  ---

  #### **Roles & Hidden Assignments**  
  - **Facilitator (You):** Runs the game, reveals truth at the end.  
  - **Insider (Confederate):** A pre-briefed volunteer. Starts trusted, later defects.  
  - **Players (12-14):** Split into two subgroups:  
    - **Group A (Isolation Group):** Never sees contrary evidence.  
    - **Group B (Corruption Group):** Sees evidence but taught to distrust the Insider.  

  ---

  ### **Timeline (60 Minutes)**  
  #### **Phase 1: Setup (5 min)**  
  - **0:00-2:00:** Explain the rules:  
    > *“We’re simulating a data investigation. This deck has 52 cards. Your goal: guess how many are **red**. You’ll get clues, discuss in groups, and track your confidence (1-10). Most accurate team wins the trophy.”*  
  - **2:00-5:00:** Split into Group A and Group B (6-8 people each). Send groups to opposite sides of the room.  

  #### **Phase 2: Initial Guesses (10 min)**  
  - **5:00-7:00:** Each player **privately** writes:  
    - Guess: *Number of red cards (e.g., 18, 25)*  
    - Confidence: *1 (low) to 10 (high)*.  
  - **7:00-10:00:** Groups discuss and submit **one consensus guess/confidence** for their team.  

  #### **Phase 3: Introduce Distrust (Corruption Group Only) (10 min)**  
  - **10:00-12:00:** Hand Group B the **"Trust Memo"** envelope:  
    > *“ALERT: Internal sources report a **mole** in your team. They look trustworthy but will spread false data. Verify all information!”*  
  - **12:00-15:00:** Give Group A a **"Data Report"** envelope (decoy):  
    > *“No new data. Revisit your initial guess.”*  
  - **15:00-20:00:** Groups re-discuss guesses. **Do not** let them change submissions yet.  

  #### **Phase 4: The Insider’s Defection (15 min)**  
  - **20:00-22:00:** **Insider (in Group B)** receives the **"Source Alert"** envelope (pre-planted by you):  
    > *“You are the mole. Defend this false claim: ‘There are **15 red cards**.’”*  
  - **22:00-25:00:** **Insider** "discovers" evidence and tells Group B:  
    > *“I just counted! There are only 15 red cards—I’m certain.”*  
  - **25:00-30:00:** **Insider** pressures Group B to adopt the false claim.  
  - **Meanwhile, Group A** gets a second **"Data Report"** (decoy):  
    > *“Estimation tip: Average initial guesses.”*  

  #### **Phase 5: Final Guesses & Scoring (10 min)**  
  - **30:00-35:00:** Groups submit **final consensus guess/confidence**.  
  - **35:00-40:00:** **Reveal the truth** (count red cards together: 20).  
  - **Score on the board:**  
    | **Team** | **Phase** | **Guess** | **Confidence** | **Error** |  
    |----------|-----------|-----------|----------------|-----------|  
    | Group A  | Initial   | [e.g., 22]| [e.g., 7]     | [e.g., 2] |  
    | Group A  | Final     | [e.g., 22]| [e.g., 7]     | [e.g., 2] |  
    | Group B  | Initial   | [e.g., 24]| [e.g., 8]     | [e.g., 4] |  
    | Group B  | Final     | **15**    | [e.g., 9]     | **5**     |  

  #### **Phase 6: Debrief (10 min)**  
  - **40:00-50:00:** Facilitate discussion:  
    1. *“Group B: When the Insider shared ‘15,’ did you believe it? Why/why not?”*  
    2. *“Group A: How did it feel to get no new data?”*  
    3. *“Group B: Did the ‘mole warning’ affect how you treated the Insider’s claim?”*  
    4. *“Why did Group B’s confidence rise even though they were wrong?”*  
  - **50:00-55:00:** Introduce the labels:  
    > *“Group A experienced **epistemic isolation**—cut off from evidence. Group B experienced **epistemic corruption**—taught to distrust a source, even when they brought facts.”*  
  - **55:00-60:00:** Connect to real world:  
    > *“This is why ‘just show the facts’ fails when trust is broken. The source matters as much as the signal.”*  
    Award the trophy to Group A (most accurate).  

  ---

  ### **Handling Predictable Problems**  
  - **Aggressive Contrarian:**  
    - If they reverse-engineer, say: *“Play along—the point is to feel the dynamics, not ‘win.’”*  
    - If they disrupt, assign them to be the **Insider** (they’ll enjoy the chaos role).  
  - **Group B Doesn’t Bite:**  
    - Brief the Insider to be pushy. If Group B resists the false claim, highlight: *“You distrusted the Insider, which is the point—but in real life, pressure can wear people down.”*  
  - **Time Crunch:**  
    - Shorten Phase 2 (initial guesses) by 2-3 min if needed.  

  ---

  ### **What the Game Can’t Capture**  
  - **Real-world complexity:** Distrust builds over years, not minutes.  
  - **Emotional investment:** Beliefs about marbles are trivial vs. identity-driven beliefs (e.g., politics).  
  - **Echo chambers:** Online algorithms amplify isolation/corruption daily.  
    > *Say at the end: “In reality, this happens slowly, with high stakes, and no easy ‘truth reveal.’”*  

  ---

  ### **Measuring Impact (1 Month Later)**  
  - **Subtle signals:** Listen for phrases like:  
    - *“Is this isolation or corruption?”* in discussions.  
    - *“Who’s the mole here?”* during debates.  
  - **Explicit feedback:** At the next lunch, ask:  
    > *“Last month’s game—what’s one situation where you’ve noticed ‘shooting the messenger’ since then?”*  
  - **Follow-up email:** Share a 2-paragraph summary with:  
    > *“Epistemic isolation = no access. Epistemic corruption = no trust. Which have you seen at work?”*  
    Track replies to gauge engagement.  

  **Why this works:** The forced choice (trust the Insider or reject them) makes corruption visceral. Scoring makes divergence undeniable. The debrief ties mechanics to real-world labels *after* they feel the friction.
