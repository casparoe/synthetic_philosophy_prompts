  ### Loss-Prone Moments + Fixes  
  **Philosophers Likely Lost At:**  
  1. **§3 (Program Shift):** "Code as input" feels alien.  
     - **Fix:** Analogize to "choosing a reaction rule in advance," e.g., "I will cooperate only if my rule is identical to yours."  

  2. **§5 (Equilibrium Definition):** "Best response in program space" abstracts choice.  
     - **Fix:** Contrast with Nash: "Before, BR to an action; now, BR to a *function*."  

  **CS Students Likely Lost At:**  
  1. **§7 (Agency):** "Why is this philosophical?"  
     - **Fix:** Link to halting problem: "Choosing programs risks infinite regress if we simulate—but we avoided that. What if we couldn’t?"  

  2. **§6 (Not Dissolved):** Why isn’t (C,C) a "win"?  
     - **Fix:** Use CS analogy: "Like adding a new algorithm to a library—it doesn’t delete the old bad ones."  

