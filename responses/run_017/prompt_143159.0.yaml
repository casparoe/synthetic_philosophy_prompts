  ### Misconception Map  
  **Break each with one sentence/board move at specified point:**  
  1. *"This is just PD with complete info / cheap talk"*  
     - **When:** During §4 (running example).  
     - **Break:** "Complete info doesn't change dominant strategies; programs change the choice object."  

  2. *"Defection is still available, so nothing changed"*  
     - **When:** During §6 (neither dissolved).  
     - **Break:** "Now (C,C) is an equilibrium outcome—impossible in one-shot PD."  

  3. *"The dilemma is solved!"*  
     - **When:** During §6.  
     - **Break:** "(D,D) is still an equilibrium; we added options but didn't remove defection."  

  4. *"Must be repeated / programs are learning"*  
     - **When:** During §3 (program shift).  
     - **Break:** "Programs run once, no history. This is still one-shot."  

  5. *"P checking what P does → circular / hangs"*  
     - **When:** During §4 (running example).  
     - **Break:** "P checks opponent's *code as string*, not its output—no simulation."  

  6. *"Programs must simulate each other"*  
     - **When:** During §4.  
     - **Break:** Board: Show byte comparison as string operation, not execution.  

  7. *"Outcome is what they print (even if loop)"*  
     - **When:** During §3 (program shift).  
     - **Break:** "We assume programs halt. Non-halting is real but omitted today."  

  **Correct Insight to Welcome:**  
  - *"Byte-identical is fragile—any code change breaks cooperation."* → **Welcome during §4/§6:** "Exactly! That's why we'll see coalitions later."  

  **Anticipate Unexpected:**  
  - *"What if opponent obfuscates code?"* Likely during §4. Response: "Then P defects! This exposes a vulnerability—provability fixes this but needs logic we skip."  

  ---  

  ### Provability Variant Decision  
  **Verdict: NO.**  
  - **Why:** Without Löb’s theorem, hand-waving is inevitable. The critical step (self-referential proof via Löb) cannot be honestly covered in 5 mins.  
  - **Substitute:** Double down on byte-identical’s limitations. At §8 (omissions), say: "Provability avoids brittleness but uses logical fixed points—we skip it because it needs a toolbox they lack."  
  - **Circularity Met:** Byte-identical halts and is non-circular by construction—no simulation.  

