prompt: |-
  You are a game theorist and philosopher of action who has taught strategic interaction to mixed technical and non-technical audiences, and who thinks about solution concepts as much for their conceptual structure as for their formal properties. Before writing the plan, do the design work: sketch the dependency relations among the ideas you intend to use (which ones genuinely presuppose which, and which merely feel like they do), mark which of them my students already have, and flag the places where you are making a real pedagogical judgment call rather than following a standard script. Then give me the plan itself. Do not give me the explanation I should deliver; give me the plan for the explanation. Don't give me readings or references either — I want the architecture of the session, not sources.

  The setting: I have a 75-minute seminar next week for about twenty third-year undergraduates, roughly half computer science and half philosophy. The CS students have seen the halting problem and a little incompleteness, but no provability logic. The philosophy students know the one-shot Prisoner's Dilemma, the idea of a Nash equilibrium as mutual best response, and dominance reasoning; they have no computability theory at all. Nobody in the room has heard of program equilibrium. Logistics: one whiteboard, a projector I don't trust, so the session has to survive without displayed code. My aim is narrower than it sounds: by the end they should be able to say what a program equilibrium is, in exactly what sense it is an equilibrium, why it neither dissolves the Prisoner's Dilemma nor leaves it untouched, and why the move from actions to programs raises a question about rational agency rather than just adding a new trick to the toolbox.

  Three complications you should design around. First, our campus has just spent two weeks arguing about students using automated bidding agents in the housing lottery, so everyone will arrive with a live but misleading picture of a program as a delegate or representative that acts on your behalf and has aims of its own; I expect that framing to do real damage and I want to know where to break it. Second, the same students will later in term do a session on multi-player program equilibrium and coalitional deviation, so I want the plan to install the hooks that session needs without covering any of it. Third, I have to tell them openly what I am refusing to cover, and I'd rather name the right two or three omissions than mumble.

  What I want from you:

  1. The order. What has to be in place before what, and what actually breaks if I reorder it — as opposed to what merely feels more natural in another order. In particular: where in the sequence must the moment go at which the object of choice changes from a move to a program, and where must the question of who or what selects the program go?

  2. The carrying example. My candidates are (a) two competing trading bots whose source code is published by the exchange's rules, (b) the program that cooperates if and only if the opponent's source is byte-identical to its own, and (c) a Cold War hotline story in which each side commits a retaliation policy in advance. Pick one, or refuse all three and give me a better one, and say explicitly what properties the example must have and must lack — I assume it must not smuggle in iteration, reputation, cheap talk, or external enforcement, but tell me what else it must be free of, and what the housing-lottery agents do to each candidate.

  3. The misconception map, with the point in the sequence where each should be headed off and the single board move or one-sentence move that heads it off. My guesses at what I'll face: that this is just the Prisoner's Dilemma with complete information, or just cheap talk, so the strategic problem has vanished; its twin, that defection is still available so nothing whatever has changed; the opposite twin, that the dilemma has been solved; that the game must be repeated or the programs must be learning from each other; that a program which does what the other program does is circular and either hangs or has an arbitrary output, and the related thought that a program which cooperates when it can prove the opponent cooperates is circular in the same way; that the programs must be simulating each other all the way down; and that the outcome of two programs is what they print, looping programs included, with a timeout. Also tell me which of these is not a misconception at all but a correct insight I should welcome rather than defuse, and which one my students will raise in an order I haven't anticipated.

  4. A decision I can't make myself: whether to include the provability-based variant in which a program cooperates iff it can prove the opponent cooperates, given that nobody here has seen Löb's theorem. If yes, show me how to do it honestly in five minutes without hand-waving the one step that makes it work. If no, tell me what to put in its place so that the circularity worry is met rather than quietly sidestepped.

  5. The two moments most likely to lose the philosophers and the two most likely to lose the CS students, and what to do at each so that neither half is merely waiting.

  6. A check for understanding that distinguishes getting it from pattern-matching: not restate the definition, but something like a second game, not the Prisoner's Dilemma, where I can see from their answer whether they have the concept or only the slogan. Give me the question, the answer that shows they got it, and one plausible wrong answer together with what it would tell me about where the explanation failed.
reasoning: |-
  We are designing a single 75-minute session on program equilibrium for a mixed group of CS and philosophy undergraduates. The goal is for them to understand what program equilibrium is, in what sense it is an equilibrium, why it neither dissolves the Prisoner's Dilemma (PD) nor leaves it untouched, and why it raises questions about rational agency.

  ### Design Work: Dependency Relations and Pedagogical Judgments

  **Core Ideas and Dependencies:**
  1. **Prisoner's Dilemma (PD) as the base game** (known by philosophers, but recap needed for CS) → sets up the strategic problem.
  2. **The concept of a strategy in normal form games** (known by philosophers as actions) → must be extended to programs.
  3. **Programs as strategies**: A program is a function from the opponent's program to an action. This is the key shift: the object of choice is now a program, not an action. 
     - *Dependency*: Requires understanding of what a program is (both sides have some intuition, but the housing lottery example may mislead). 
     - *Pedagogical judgment*: We must break the delegate/representative view of programs (from the housing lottery) and instead present programs as fixed pieces of code that are chosen in advance and then interact without further input.
  4. **The interaction of programs**: How two programs, when facing each other, produce an outcome. 
     - *Dependency*: Requires the idea of programs as functions and the notion of input/output. 
     - *Critical point*: The programs are chosen independently and then run without any further intervention. They are not agents that can re-evaluate; they are static code.
  5. **Program equilibrium definition**: A pair of programs (P, Q) such that each is a best response to the other. 
     - *Dependency*: Requires the concept of best response (known by philosophers) and the idea of a program as a strategy (new).
  6. **Why PD is not untouched**: Without program equilibrium, the only Nash equilibrium in the one-shot PD is (defect, defect). With programs, we can have (C, C) as an outcome in a program equilibrium. But note: it's not that defection is impossible; it's that by choosing the right program, you can commit to cooperate conditionally and thereby achieve cooperation.
  7. **Why PD is not dissolved**: Defection is still possible. Moreover, the program equilibrium that yields (C, C) is fragile and relies on mutual commitment. Also, there are other program equilibria that yield (D, D). The dilemma is transformed but not eliminated.
  8. **The challenge to rational agency**: The shift from actions to programs changes the locus of choice. The agent chooses a program in advance, and then the program executes. This raises questions about what it means to choose rationally at the moment of program selection, especially when the program's behavior depends on the opponent's program in a way that might seem circular.

  **What Students Already Have:**
  - Philosophers: PD, Nash equilibrium, dominance.
  - CS: Halting problem, incompleteness (but no provability logic).

  **Pedagogical Judgment Calls:**
  - **The shift from moves to programs**: This must come early, but only after setting up the PD and the problem of cooperation. We must break the housing lottery mindset (programs as autonomous agents) immediately. We will explicitly state that the program is chosen once and then runs deterministically without any further goals or adaptation.
  - **The selection of the program**: We must clarify that the agent chooses the program *before* knowing the opponent's program. This is a key point to avoid the idea that the program is a delegate that can react in real time.
  - **Provability-based variant**: Given the lack of background in provability logic and Löb's theorem, and the time constraint, we will skip it. Instead, we will use a simple example that avoids simulation (to address circularity) and use a syntactic criterion (like source code comparison) that is computable and halts. This addresses the circularity worry without requiring provability.
  - **Circularity**: We will use an example that does not require simulation (so no halting problem issues) and show that the program can use a syntactic property (e.g., byte-identical) to decide. This halts and is not circular.

  ### The Plan

  **Total Time: 75 minutes**

  #### (0) Introduction (5 minutes)
  - **Goal**: Frame the session and break the housing lottery misconception.
  - **Script**: 
    - "We've all heard about the housing lottery bots. But today, we are not talking about agents that bid on your behalf in a dynamic environment. Instead, we are going to consider a one-shot game where you choose a program once, and then that program is run against the opponent's program without any further input. The program is a fixed strategy that you commit to in advance. It's not an agent that has its own goals; it's a piece of code that you design to produce an action (cooperate or defect) when faced with the opponent's code."
  - **Board**: Write: "Programs: chosen in advance, fixed, no real-time input, no goals of their own."
  - **Why here?**: Must come first to prevent the housing lottery example from distorting the entire session.

  #### (1) Prisoner's Dilemma Recap (5 minutes)
  - **Goal**: Ensure everyone is on the same page about the base game.
  - **Board**: Write the PD payoff matrix. Emphasize that in the one-shot game, the only Nash equilibrium is (D, D) even though (C, C) is better for both.
  - **Question**: "Why can't we get (C, C) in the one-shot PD?" (Answer: Because each has a dominant strategy to defect.)
  - **Why here?**: Sets the stage for the problem we are trying to address.

  #### (2) Shifting to Programs: The Object of Choice (10 minutes)
  - **Goal**: Introduce the idea of choosing a program instead of an action.
  - **Board**: 
    - "Now, instead of choosing an action, each player chooses a program. The program takes the opponent's program as input and outputs an action (C or D)."
    - Write: `P(Q) -> action for player 1`, `Q(P) -> action for player 2`.
  - **Key Point**: The programs are chosen simultaneously and independently. Then they are given to each other and run. The output is determined by running P on Q and Q on P? Wait, no: actually, we run P on Q (which gives P's action) and Q on P (which gives Q's action). But note: if P requires the output of Q, we have a circularity. We avoid this by not requiring the output of the opponent's program but the code of the opponent's program as input. The programs are not run on the output of the opponent but on the opponent's source code.
  - **Carrying Example**: We choose candidate (b): a program that cooperates if and only if the opponent's source code is byte-identical to its own. Why?
    - Properties it must have: 
      - Computable and always halts (so no undecidability issues).
      - Does not rely on iteration, reputation, cheap talk, or external enforcement.
      - The condition is syntactic and does not require simulating the opponent.
    - Properties it must lack: 
      - No hidden iteration (like repeated games).
      - No reliance on future punishment.
      - No communication during the game.
    - Why not (a) trading bots? They might involve learning or real-time adaptation, which we want to avoid. Also, the housing lottery example might make students think of bots as active agents.
    - Why not (c) Cold War hotline? It might suggest that the programs are run in real time with communication, and also it might evoke mutual assured destruction which is iterated. Moreover, the retaliation policy might be seen as an action rather than a program that conditions on the opponent's code.
  - **Why here?**: This is the moment the object of choice changes. We must do this after the PD recap and before discussing equilibrium.

  #### (3) How Programs Interact: The Byte-Identical Example (15 minutes)
  - **Goal**: Show a program that can yield cooperation and explain why it works without circularity.
  - **Board**:
    - Define program P: "If the source code of the opponent is identical to my source code, then output C; else output D."
    - Now, suppose both players choose P. Then:
      - P (for player 1) looks at Q (which is P) and sees they are identical → outputs C.
      - Similarly for player 2 → outputs C.
    - Outcome: (C, C).
  - **Key Points**:
    - This is not circular: the program does not run the opponent's code; it only compares the source code. This is a syntactic check and halts.
    - We are not assuming that the opponent is running the same program at the time of execution; we are comparing the source code that was submitted.
  - **Check for Understanding**: 
    - "What if one player chooses P and the other chooses a different program, say D_always (which always defects)?"
      - Then P (when facing D_always) sees they are not identical → defects. D_always defects anyway. So outcome (D, D).
  - **Why here?**: After introducing the program shift, we need to show a concrete example of how programs interact.

  #### (4) Program Equilibrium Defined (10 minutes)
  - **Goal**: Define program equilibrium and show that (P, P) is one.
  - **Board**:
    - "A program equilibrium is a pair of programs (P, Q) such that for each player, given the opponent's program, their program is a best response. That is, there is no alternative program that would yield a higher payoff against the opponent's program."
    - Now consider (P, P) as above. 
      - If player 1 switches to another program, say R, then what happens? 
        - If R is not identical to P, then when facing P, R might defect (if R is not designed to cooperate with P) and P (when facing R) will defect because R is not identical to P. So the outcome is (D, D) and player 1 gets the sucker's payoff (say 0) which is worse than the 3 from (C, C). 
        - But note: what if player 1 switches to a program that cooperates unconditionally? Then when facing P, this program (call it C_always) would cooperate. But P (when facing C_always) would see that the source code of C_always is not identical to P → so P defects. Then outcome: (C, D) — player 1 cooperates and player 2 defects. Player 1 gets 0 (the sucker's payoff) which is worse than 3. 
      - Therefore, P is a best response to P. Similarly for player 2.
  - **Why here?**: We have an example, now we formalize the equilibrium concept.

  #### (5) Why the Dilemma is Not Dissolved and Not Untouched (10 minutes)
  - **Goal**: Show that defection is still possible and that there are multiple equilibria.
  - **Board**:
    - "Not dissolved: (D, D) is still a program equilibrium. How? Consider both players choose a program that always defects (D_always). Then if one switches to any other program, the outcome will be (D, D) because D_always always defects. So no incentive to switch."
    - "Also, cooperation is achieved only in the (P, P) equilibrium. But note: if one player chooses P and the other chooses D_always, the outcome is (D, D) and both get 1, which is worse than 3. So the dilemma is not gone: without coordination on the same program, we might end up in a bad outcome. Also, if both players choose different programs that are designed to cooperate only with themselves, then both will defect and we get (D, D)."
    - Moreover, the program equilibrium (P, P) is not the only one that yields (C, C). But the point is that the dilemma is transformed: we now have multiple equilibria, including (C, C) and (D, D). The problem becomes one of coordination on a program. But note: the original dilemma was that (C, C) was not an equilibrium at all. Now it is.
  - **Why here?**: After defining equilibrium, we can now address the main question.

  #### (6) The Challenge to Rational Agency (10 minutes)
  - **Goal**: Raise the philosophical question about choice and agency.
  - **Board**:
    - "When choosing a program, the agent is choosing a function that maps the opponent's program to an action. But at the time of choice, the agent doesn't know the opponent's program. So how can they choose rationally? They must reason about what the opponent might choose. This is a higher-order strategic problem."
    - "Moreover, the program commits the agent in advance. This raises the question: what does it mean to choose rationally at the moment of program selection? How do we reason about counterfactuals (what if I had chosen a different program) when the opponent's choice is also a program and might depend on what I choose?"
  - **Why here?**: After seeing how program equilibrium works, we can step back to the agency question.

  #### (7) Check for Understanding (10 minutes)
  - **Goal**: Test if they understand the concept beyond the PD example.
  - **Question**: "Consider a different game: the Stag Hunt. In Stag Hunt, if both players choose Stag, they get a high payoff (say 4 each). If one chooses Stag and the other Hare, the Stag-chooser gets 0 and the Hare-chooser gets 3. If both choose Hare, they get 3 each. The dilemma: there are two pure Nash equilibria: (Stag, Stag) and (Hare, Hare). Now, in the program version, can we design programs such that we get the (Stag, Stag) equilibrium even if the Hare equilibrium is risk dominant? How?"
  - **Answer that shows understanding**: They might design a program that plays Stag if and only if the opponent's program is identical (or more generally, if it can be verified that the opponent will play Stag). Then (P, P) would yield (Stag, Stag). But note: if the opponent is playing a program that always plays Hare, then switching to a program that plays Stag unconditionally would lead to (Stag, Hare) and the Stag player gets 0. So the program that conditions on the opponent's code being identical is a best response to itself. However, the (Hare, Hare) equilibrium is still there: if both choose a program that always plays Hare, that is also an equilibrium.
  - **Plausible wrong answer**: "We can have a program that plays Stag if the opponent is the same, and Hare otherwise. Then both will play Stag." This is correct for the (Stag, Stag) outcome. But the test is whether they see that (Hare, Hare) is still an equilibrium. If they don't mention that, they may not see that program equilibrium doesn't force cooperation. Alternatively, a wrong answer might be: "We can have a program that plays Stag because it's the best." But that doesn't condition on the opponent and wouldn't be a best response if the opponent defects.
  - **What it tells me**: If they don't note the multiple equilibria, they might think program equilibrium forces the good outcome. Also, if they try to use a program that requires simulation without halting, they haven't grasped the computability constraint.

  #### (8) Wrap-Up and Omissions (5 minutes)
  - **Goal**: Recap and name the omissions.
  - **Board**:
    - "Today we focused on two-player, one-shot games with programs that condition on the opponent's source code. We did not cover:
      1. Multi-player program equilibrium and the issue of coalitional deviations (which we will do later in the term).
      2. The provability-based program equilibrium (which uses logical proofs to avoid simulation and requires Löb's theorem). 
      3. The possibility of programs that do not halt (and how to handle them). We assumed programs always halt."
  - **Why here?**: To set the stage for future sessions and be transparent.

  ### Misconception Map and How to Address Them

  1. **Misconception**: This is just the PD with complete information, so the strategic problem vanishes.
     - **When it might arise**: After introducing the byte-identical example.
     - **How to break it**: Point out that complete information about the game does not change the dominant strategy in the one-shot PD; it is the shift to programs that enables new equilibria.

  2. **Misconception**: Defection is still available so nothing has changed.
     - **When it might arise**: After showing the (P, P) equilibrium.
     - **How to break it**: Emphasize that now (C, C) is an equilibrium outcome, which was not possible before. Also, note that (D, D) is still an equilibrium, so the set of equilibria has changed.

  3. **Misconception**: The dilemma has been solved.
     - **When it might arise**: After seeing (C, C) is possible.
     - **How to break it**: Point out that (D, D) is still an equilibrium and that without coordination we might end up there. Also, if one player chooses a defective program, the other might be forced to defect.

  4. **Misconception**: The game must be repeated or the programs must be learning.
     - **When it might arise**: When introducing the program shift.
     - **How to break it**: Explicitly state that the interaction is one-shot: the programs are run once and only once, with no history and no future.

  5. **Misconception**: A program that does what the other program does is circular and either hangs or has arbitrary output.
     - **When it might arise**: When first describing the program that uses the opponent's code.
     - **How to break it**: Use the byte-identical example: it does not run the opponent's program, it only does a syntactic comparison. It halts and is not circular.

  6. **Misconception**: The programs must be simulating each other all the way down.
     - **When it might arise**: When discussing how P examines Q.
     - **How to break it**: Clarify that we are not simulating the opponent's program; we are only looking at its source code. The byte-identical check does not run the code.

  7. **Misconception**: The outcome of two programs is what they print, and looping programs are included with a timeout.
     - **When it might arise**: When running the programs.
     - **How to break it**: State at the beginning that we assume programs always halt. We are not considering non-halting programs in this session.

  **Correct Insight to Welcome**: The idea that the byte-identical program is fragile because it requires both to choose the same program. This is correct and leads to the coordination problem.

  **Unexpected Order**: A student might ask about the byte-identical program: "What if the opponent uses a program that is functionally equivalent but has different source code?" This is a great point and can be addressed by noting that the program we defined is brittle to code changes. We can say that there are other programs that are more robust (like the provability one) but we are not covering them today.

  ### Moments of Potential Loss

  1. **Losing the Philosophers**:
     - **Moment 1**: When we write `P(Q) -> action` and talk about programs as functions. Philosophers might not be comfortable with the functional view.
       - **What to do**: Draw an analogy to a strategy in game theory: a strategy is a plan that says what to do in every contingency. Here, the program is a strategy that conditions on the opponent's entire plan (program). Use an example: "Your program is like a rule: if the opponent's rule is X, then do C, else do D."
     - **Moment 2**: When we discuss why (P, P) is an equilibrium and consider alternative programs (like C_always). The payoff reasoning might be too abstract.
       - **What to do**: Use the PD payoff matrix and write the outcomes explicitly: (C, C) gives (3,3), (C, D) gives (0,5), etc.

  2. **Losing the CS Students**:
     - **Moment 1**: During the philosophical discussion about rational agency. CS students might wonder why we are talking about agency.
       - **What to do**: Connect to the halting problem and the limits of computation: "When we design a program, we have to consider what the opponent's program might do. But if the opponent's program is trying to do the same, we might get into undecidable situations. We avoided that by using a syntactic check, but what if we want a more robust check? That's where provability comes in, but we skip it for now."
     - **Moment 2**: When discussing the Stag Hunt example in the check for understanding. They might not know Stag Hunt.
       - **What to do**: Briefly explain Stag Hunt on the board with a payoff matrix.

  ### Final Plan Order

  1. Introduction (5 min)
  2. PD Recap (5 min)
  3. Shifting to Programs (10 min) [includes breaking the delegate view and introducing the byte-identical example]
  4. How Programs Interact: Byte-Identical Example (15 min) [includes running the example and the non-identical case]
  5. Program Equilibrium Defined (10 min) [showing (P,P) is an equilibrium and why switching doesn't help]
  6. Why Not Dissolved/Untouched (10 min)
  7. Challenge to Rational Agency (10 min)
  8. Check for Understanding (10 min) [Stag Hunt]
  9. Wrap-Up and Omissions (5 min)

  This order is fixed in that:
  - The shift to programs (step 3) must come after the PD recap and before the example and equilibrium definition.
  - The byte-identical example (step 4) must come before the equilibrium definition (step 5) because it provides the concrete instance.
  - The agency discussion (step 7) must come after the technical setup so that we have something to reflect upon.

  Reordering step 4 and 5 would break the flow because we use the example to define the equilibrium.

  The moment for the shift from moves to programs is step 3. The question of who selects the program is addressed in step 3 (the agent chooses the program in advance, without knowing the opponent's) and reinforced throughout.

  We skip the provability variant. In its place, we use the byte-identical program to meet the circularity worry: it's a computable, non-simulating method.

  The Stag Hunt check is designed to see if they can apply the concept to a new game and if they understand that multiple equilibria remain.

  We are ready.
answer: |-
  ### Session Architecture Plan

  **Core Pedagogical Structure:**  
  The sequence is designed around *conceptual dependencies*. Changing the order risks breaking comprehension, not just flow. Key dependencies:  
  - PD recap must precede program shift (establishes the problem).  
  - Program-as-choice must precede equilibrium definition (new object of choice).  
  - Concrete example must precede equilibrium properties (grounds abstraction).  
  - Agency question must follow equilibrium analysis (requires seeing the transformation).  

  **Critical Invariants (break if reordered):**  
  1. Shift from moves to programs **must** occur *after* PD recap but *before* equilibrium definition.  
  2. "Who selects the program?" **must** be addressed *during* the program shift (when introducing programs), not after interaction is modeled.  

  **Total Time:** 75 minutes  
  **Segments:**  

  #### 1. **Shatter the Delegate Misconception + Frame Agency Question** (5 min)  
     - **Pedagogical Goal:** Break housing-lottery framing before technical work.  
     - **Board Move:**  
       - Draw two boxes: "Housing Bot" (dynamic, autonomous, aims) vs. "Program Here" (static, no aims, fixed at choice).  
     - **Key Sentence:** "Unlike your housing bot, these programs don't *act* for you; they *are* your one-time choice. They execute deterministically when given opponent's code."  
     - **Judgment Call:** Explicitly reject "delegate" model before any game theory.  

  #### 2. **Prisoner's Dilemma Recap + Why Defection Dominates** (5 min)  
     - **Goal:** Reactivate existing knowledge. Anchor later contrast.  
     - **Board Move:**  
       - PD matrix (philosophers recognize it; CS students see payoffs).  
       - Circle (D,D): "Only NE? Why?" Elicit dominance reasoning.  
     - **Dependency:** Must precede program shift to show why status quo is bleak.  

  #### 3. **The Shift: Choosing Programs, Not Moves** (10 min)  
     - **Goal:** Introduce program-as-strategy. Resolve selection timing.  
     - **Carrying Example:** **Choose (b)**: Cooperates iff opponent's source is byte-identical.  
       - *Why?*  
         - Must avoid: Iteration, simulation, learning, enforcement, reputation.  
         - Must have: Halting (byte comparison halts), no hidden dynamics.  
         - *Housing-lottery damage control:* Unlike bidding bots, this program has no "aims," doesn't adapt, and isn't evaluated mid-game.  
       - *Reject (a)/(c):*  
         - (a) Trading bots imply real-time adaptation.  
         - (c) Cold War evokes repeated threats/retaliation.  
     - **Board Move:**  
       - "Program P: Input = Opponent's source code. Output = C or D."  
       - "Chosen *simultaneously*, then exchanged and run once."  
     - **Key Sentence:** "You choose P *before* seeing Q. P is a machine, not a negotiator."  

  #### 4. **Run the Example: Byte-Identical in PD** (15 min)  
     - **Goal:** Show cooperation emerging without iteration.  
     - **Board Moves:**  
       - Write P's rule: "IF opponent_code == my_code THEN C ELSE D".  
       - Case 1: Both choose P → P(P) = C (since identical) → (C,C).  
       - Case 2: P vs. "Always D" → P sees non-identity → (D,D).  
     - **Check:** "Why no infinite regress?" → "Compares strings, doesn't run opponent."  

  #### 5. **Define Program Equilibrium** (10 min)  
     - **Goal:** Formalize why (P,P) is stable. Contrast with Nash.  
     - **Board Moves:**  
       - "(P,Q) is a program equilibrium iff: P is BR to Q, Q is BR to P."  
       - Matrix overlay: Show payoff if P switches to "Always C" or "Always D" vs. Q=P.  
     - **Key Sentence:** "Best response *in program space*—not action space."  

  #### 6. **Neither Dissolved Nor Untouched** (10 min)  
     - **Goal:** Precision on what changed.  
     - **Board Moves:**  
       - Two columns: "Untouched?" vs. "Dissolved?"  
       - Untouched? ✘: (C,C) now possible in equilibrium.  
       - Dissolved? ✘: (D,D) still an equilibrium; defection still rational if unsure.  
     - **Elicit:** "Why is this *not* 'solving' PD?" → "Still multiple equilibria; coordination problem remains."  

  #### 7. **Agency Question: What Did We Change?** (10 min)  
     - **Goal:** Elevate to philosophy of action.  
     - **Board Moves:**  
       - "Before: Choose *what to do*. Now: Choose *how to decide what to do*."  
       - Arrow from "Decision Moment" (program choice) to "Execution Moment" (program run).  
     - **Key Question:** "When you choose P, are you choosing an action or a rule? What does rationality bind?"  

  #### 8. **Check for Understanding: Stag Hunt Test** (5 min)  
     - **Goal:** Diagnose conceptual grasp vs. pattern-matching.  
     - **Question:** "In Stag Hunt (two equilibria: (Stag,Stag) high reward, (Hare,Hare) safe), how might program equilibrium make (Stag,Stag) *more* viable?"  
     - **Target Answer:** "Use byte-identical program: both play Stag iff codes match. Now (Stag,Stag) is an equilibrium *without* changing risk dominance of Hare."  
     - **Plausible Wrong Answer:** "Always play Stag—it's better!" → Reveals miss: Fails to condition on opponent, ignores that unilaterally playing Stag is risky.  
     - **Diagnosis:** If wrong, they reduced programs to actions; reintroduce conditioning.  

  #### 9. **Omissions + Hooks for Later** (5 min)  
     - **Name These:**  
       1. Multi-player/coalitions (hook: "What if 3 programs? Can 2 gang up?").  
       2. Provability-based programs (hook: "What if we want robustness beyond byte-matching?").  
       3. Non-halting programs (hook: "What if P simulates Q and loops?").  

