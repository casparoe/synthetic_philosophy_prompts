prompt: |-
  I'm a journalist working on a piece about why economics keeps building models out of assumptions everyone involved agrees are false. Nearly every economist I put the question to comes back with the same picture: a model is a map. The Tube map is not drawn to scale, and no one takes that to stop it getting you from Holborn to Bank; a model's false assumptions are its not being to scale. The picture then does real work: it is used to dismiss worries about unrealistic assumptions as pedantry about scale, and, in the stronger form Friedman gave the point in his 1953 essay on the methodology of positive economics (the one Samuelson called the F-twist), to suggest that unrealistic assumptions are a mark of a theory's significance rather than a cost.

  I would like to audit it before I let it into print. Three things worry me. First, I have started sorting false assumptions into three kinds: those that shrink a magnitude the modeller takes to be irrelevant (no friction, no transport costs); those that fix or restrict the domain (a continuum of traders, zero transaction costs); and as-if surrogates, where the mechanism is granted to be false but the behaviour is claimed to match (firms acting as if they equated marginal revenue with marginal cost when no one is doing any such calculation). I suspect the map has resources for the first two and none for the third. Second, the map seems to cover only distortions you could in principle pay to remove, not falsehoods without which the model derives nothing at all. Third, a map states its scale and projection on its face and can be checked point by point against a territory that exists independently of it; a model does neither.

  Give me the correspondence table — what plays the territory, the scale, the projection, the route — then where the mapping holds, where it breaks for the use I have described, which of my three kinds each breakage bears on, and whether the stronger conclusion survives once the breakages are in, or whether the analogy was carrying it.

  Sections in this order, please: "Correspondences" (a table, or about 100 words); "Where it holds" (about 100 words); "Where it breaks" (about 250 words, each breakage tagged to one of my three kinds); "What the analogy was carrying" (about 100 words); "A better analogy, if there is one" (about 75 words).
reasoning: |-
  Okay, the user is a journalist working on an article about why economics relies on models with false assumptions. They've encountered the common analogy that models are like maps—specifically, the London Tube map, which isn't to scale but still gets you from place to place. The user has three main concerns about this analogy and wants a structured analysis before publishing.

  First, I need to unpack their three worries:
  1. They've categorized false assumptions into three types: magnitude-shrinking (like ignoring friction), domain-fixing (like assuming zero transaction costs), and as-if surrogates (like firms acting "as if" they maximize profit without actually doing the math). They suspect the map analogy handles the first two but fails for the third.
  2. The map analogy only covers distortions that could theoretically be fixed (e.g., adding scale for accuracy), not core falsehoods without which the model collapses.
  3. Maps explicitly state their scale/projection and can be verified against real terrain, whereas models don't and often can't be tested point-by-point independently.

  The user wants a very structured response with five sections: correspondences table, where the analogy holds, where it breaks (tagged to their three categories), what the analogy was "carrying" (i.e., propping up Friedman's strong claim), and optionally a better analogy.

  I should start by mapping the Tube analogy to economics:
  - Territory = Real-world economies
  - Scale = Degree of abstraction (e.g., assuming perfect competition)
  - Projection = Causal framework/mechanisms (e.g., supply-demand curves)
  - Route = Policy prescriptions
  - Landmarks = Key outcomes (e.g., equilibrium prices)

  For "where it holds," I'll note that the analogy works well for simplifying complex realities (like ignoring minor frictions) and for practical applications like policy design—similar to how Tube maps help navigation despite distortion.

  For "where it breaks," I need to address all three user concerns:
  - As-if surrogates: The analogy fails because maps don't claim mechanisms (e.g., "as if" the Tube teleports you), while economic models often do. Tagged to their third category.
  - Unremovable falsehoods: Maps can add scale; but if a model's core assumption (like rational expectations) is false and essential, it's like a map with no spatial relation at all. Tagged to their second category.
  - Verifiability: Maps can be checked against physical terrain; economic "territory" is contested and models shape perception (e.g., GDP defining growth). Tagged to all three categories indirectly.

  Then, I'll argue that Friedman's strong claim ("unrealistic assumptions indicate significance") is propped up by the analogy. Without it, we see that unrealistic assumptions can sometimes be necessary evils but aren't inherently virtuous.

  For a better analogy, I'll suggest flight simulators—they use deliberate simplifications (e.g., no turbulence) that must be validated against real outcomes, emphasizing purpose-driven approximation over universal truth.

  Throughout, I'll keep it concise as requested: ~100 words for correspondences and "holds," ~250 for "breaks" with tags, ~100 for what the analogy carries, ~75 for new analogy.
answer: |-
  ### Corrrespondences
  | Map Element         | Economic Model Equivalent         |
  |---------------------|-----------------------------------|
  | **Territory**       | Real-world economies & behaviors  |
  | **Scale**           | Level of abstraction (e.g., perfect competition) |
  | **Projection**      | Causal framework (e.g., supply-demand mechanics) |
  | **Route**           | Policy prescriptions/predictions  |
  | **Landmarks**       | Key outcomes (e.g., equilibrium prices) |
  | **Distortion**      | False assumptions (e.g., frictionless trade) |

  ---

  ### Where It Holds
  The analogy holds for assumptions that deliberately simplify *irrelevant complexities* (e.g., ignoring minor transaction costs to isolate market dynamics). Like omitting streets from a Tube map, such abstractions clarify core mechanisms. Models here are "good enough" for directional guidance, such as predicting inflation trends or designing tax policies. The focus is on functional utility—getting from A to B—not literal accuracy. This justifies the first two assumption types (magnitude-shrinking, domain-fixing) as benign idealizations.

  ---

  ### Where It Breaks
  **1. Failure on As-If Surrogates (Your 3rd Kind)**  
  The analogy collapses when models rely on *as-if behaviors* (e.g., firms "acting as if" they optimize). Maps don’t assert false mechanisms—they omit detail but don’t misrepresent *how* you travel. Economic models, however, often posit fictional decision processes, masking ignorance of real behavior. Unlike a Tube map’s honest omission, these surrogates risk conflating predictive success with explanatory truth.  
  **Breakage**: Untestable mechanisms.  

  **2. Unremovable Falsehoods (Bears on Your 2nd Kind)**  
  Maps allow "correcting" distortions (e.g., adding scale). But many economic assumptions (e.g., rational expectations) aren’t mere simplifications—they’re foundational falsehoods. Remove them, and the model implodes. This is like a Tube map that *requires* believing stations are equidistant; if false, it misleads fundamentally. These aren’t distortions you can "pay to remove"—they’re constitutive untruths.  
  **Breakage**: Non-negotiable inaccuracies.  

  **3. Lack of Independent Verification (Bears on All Three Kinds)**  
  Maps state scale/projection and reference objective geography. Economic models lack both: their "territory" (e.g., preferences, expectations) is unobservable and shaped by the models themselves (e.g., GDP defining "growth"). You can’t check a model point-by-point against a fixed reality. False assumptions thus become self-insulating—validated only by internal consistency, not external match.  
  **Breakage**: No objective benchmark.  

  ---

  ### What the Analogy Was Carrying
  The analogy smuggles in Friedman’s "F-twist" (unrealistic assumptions signal significance) by implying all distortions are like Tube map omissions—harmless if functionally useful. But the breaks reveal this is untenable for as-if surrogates (misleading mechanisms) and unremovable falsehoods (which aren’t "abstractions" but errors). The analogy thus props up Friedman’s strong conclusion by masking epistemic risks: it conflates *pragmatic simplification* with *theoretical evasion*.

  ---

  ### A Better Analogy, If There Is One  
  **Flight simulators**. They replicate real-world physics with deliberate simplifications (e.g., ignoring turbulence during training). Like models, they’re judged by outcomes ("can you land the plane?"), not mechanistic fidelity. Crucially, they *flag* simplifications and require validation against real flights—addressing the verification gap. This better captures economics’ purpose-driven approximations while acknowledging the need for empirical grounding.
