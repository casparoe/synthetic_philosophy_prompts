prompt: |-
  you're a professional philosopher — formal epistemology / epistemic logic side, the kind of person who's actually spent time with Fitch-style arguments and with local anti-realism about a region of discourse. Take your time and think it through carefully before you answer; do a bit of brainstorming first, I'd rather have a slow, correct audit than a fast confident one. I can't look anything up from where I'm writing, so please don't cite anything or give me a reading list — just argue.

  Here's the situation. I'm trying to put together a package of views for a paper. The paper defends a *local* anti-realism, not a global one: I only want to be an anti-realist about one region of discourse. Call the target sentences "trans-horizon sentences" — claims about the contents of spacetime regions from which no signal can ever reach any inquirer in our causal patch (there is a galaxy of roughly such-and-such mass over there, there isn't, whatever). My claim is that there's no fact of the matter about them, and the reason is the usual verificationist one: nothing any of us could ever do, even in principle, would settle them.

  Roughly where I've landed:

  1. Knowability: every truth is knowable in principle, where "in principle" is generous — for each truth there is some possible finite inquirer who could come to know it. Finite, but no fixed upper bound on lifetime, memory, or instrumentation. And I want the possible inquirers to include agents in pretty exotic physical situations, not just minor variations on us.

  2. Classical logic throughout. Knowledge is factive, distributes over conjunction, closed under known entailment. No intuitionist retreat, no relevant logic, no dialetheism. Bivalence for everything I'm a realist about.

  3. Local anti-realism: trans-horizon sentences have no determinate truth value (or at the very least aren't true), for the reason above.

  4. Full realism about the unexcavated past: there are indefinitely many determinate truths about the deep past that nobody will in fact ever check — the exact number of vertebrae in some particular dinosaur nobody will ever excavate, that sort of thing. I also think that in total there are vastly more truths than there will ever be acts of knowing, so plenty of truths are never known by anyone at all. This is definately a commitment, not a throwaway.

  5. My escape hatch from the paradox: I state the knowability principle only for sentences containing no epistemic vocabulary whatsoever — nothing about knowing, evidence, or verification. The Fitch-style sentence (p, and it's not known that p) helps itself to the knowledge operator, so it falls outside the scope of the principle, and I take it the derivation doesn't get off the ground.

  6. But methodologically I also don't want to save the view the way I've seen it saved, by restricting the principle to a subclass of propositions picked out using epistemic notions — propositions that are stable, or that don't have their truth values depend on who knows what. That move always looks to me like it turns a thesis about truth into a thesis about what we can find out, and then it's no use against the realist I'm arguing with.

  7. Realism about the far future after the last inquirer is gone: how things stand in the universe long after everyone is dead is determinately true or false, even though by construction nobody will ever verify it. I need this — the view is supposed to be local, not the thin end of a global wedge.

  8. I'd also like to be able to state my own position in the paper as both true and knowable, including the bit where I say that there are truths nobody will ever know. A friend says that's precisely what the paradox rules out. I think he's wrong but I can't say why.

  9. Same friend's other worry, which I really can't evaluate: he says my syntactic restriction in (5) doesn't block a revenge version, because by diagonalization you can produce a sentence that, without using any epistemic vocabulary, still manages to say of itself that it isn't known — so the principle applies to it and the collapse comes back anyway. Is that right, or is he helping himself to something?

  What I want from you: wich of these are actually in tension, which only look like they are, and what the cheapest repair is in each case. Rank the tensions by severity instead of listing them all as equally bad, and for each one say what would have to give. Then tell me which single revision would clean up the most, and whether 8 and 9 are things I can just stop worrying about. I genuinely don't know where the problem is, so don't assume I'd prefer to drop any particular one of them. About 800-1000 words, and be blunt where I'm kidding myself.
