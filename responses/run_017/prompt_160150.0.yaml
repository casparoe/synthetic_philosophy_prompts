  The neuroscience thought experiment is particularly devastating for disjunctivism. If we could perfectly replicate perception-neural-states, disjunctivism would have to say there's no conscious experience at all in such cases - which seems deeply counterintuitive. The user seems aware this is disjunctivism's Achilles heel.

