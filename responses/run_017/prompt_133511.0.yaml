answer: |-
  ### Specification for a Theory of Graded Moral Status

  **The purpose the criteria are written for**  
  This theory must enable an advisory body to rank interventions across radically diverse candidate subjects (insects, crustaceans, AI, humans, etc.) under fundamental disagreement about consciousness metaphysics. Crucially, it must produce *publicly justifiable rankings*—reasons engageable by reasonable dissenters—without resolving metaphysical disputes. I judge this *possible* if the theory focuses on empirically tractable proxies and decision-relevant properties, but it demands extreme flexibility. No extant theory satisfies all below; the list defines adequacy.

  ---

  **The Requirements**  
  *(Hard: non-negotiable for usability; Soft: desirable but negotiable)*  

  1.  **Accommodate Nociception Without Pain (Hard)**  
      *Case:* Insect nociception surviving decapitation, lacking vertebrate-like flexibility/attentional dependence.  
      *Requirement:* Must distinguish reflexive harm-avoidance from pain-as-suffering, using behavioral/neural markers (e.g., trade-offs, attention modulation). Cannot assume nociception implies suffering.

  2.  **Decouple Observable Responses from Subjective Experience (Hard)**  
      *Case:* Vegetative state patients showing nociceptive reflexes vs. awareness without behavioral signs.  
      *Requirement:* Must acknowledge dissociation between measurable responses (autonomic, neural) and conscious experience. Requires independent markers of consciousness (e.g., information integration, global workspace signatures).

  3.  **Define Aggregation Rules Explicitly (Hard)**  
      *Case:* Whether vast insect numbers can outweigh one human.  
      *Requirement:* Must specify if moral status is cardinal (additive), ordinal (non-additive ranking), or multidimensional (incommensurable axes). Cannot presuppose one model; must justify choice and handle trade-offs transparently.

  4.  **Address Nested Subjects Without Double-Counting (Hard)**  
      *Case:* Eusocial colonies vs. enteric nervous systems within humans.  
      *Requirement:* Must define the fundamental unit of moral concern (e.g., individual neurons? whole organisms? integrated systems?) and provide principles to avoid attributing status redundantly to parts and wholes.

  5.  **Resolve Gradual Substrate Replacement Non-Arbitrarily (Hard)**  
      *Case:* Neuron-by-neuron replacement leading to silicon functional duplicate.  
      *Requirement:* Must pinpoint where status changes (if at all) using functional/physical criteria, *not* species or substrate alone. Change must be justified by loss/gain of status-conferring properties, not continuity.

  6.  **Achieve Interpolation Path Stability (Hard)**  
      *Case:* Continuous series between thermostat and human.  
      *Requirement:* Verdicts on intermediate systems must be robust across different interpolation paths (e.g., adding memory vs. adding sensors). If stability is impossible, the theory must formally prove why and handle arbitrariness responsibly.

  7.  **Avoid Human-Specific Markers (Hard)**  
      *Case:* Alien system behaving/claiming consciousness identically to humans.  
      *Requirement:* Evidence for status must rely on general functional/structural properties (e.g., feedback complexity, predictive processing), not human biology or verbal reports alone. Cannot presuppose human-unique mechanisms.

  8.  **Permit Superhuman Status (Soft)**  
      *Case:* Being with vastly superior sensory/temporal integration capacities.  
      *Requirement:* Must allow for higher moral status than typical humans if enhanced capacities warrant it. Denying this *a priori* is anthropocentric bias; acceptance risks radical conclusions but is ethically consistent.

  9.  **Guide Action Under Profound Uncertainty (Hard)**  
      *Case:* Acting when probability of sentience is tiny, unfalsifiable, and inaction is costly.  
      *Requirement:* Must incorporate decision theory (e.g., expected value, minimax) to avoid paralysis *and* prevent negligible probabilities of vast stakes dominating. Requires bounded precaution (e.g., probability thresholds, diminishing marginal stakes).

  10. **Respect Established Neuroscience (Hard)**  
      *Case:* All biological cases (anaesthesia, decapitation, vegetative states).  
      *Requirement:* Must not contradict robust neurobiological consensus (e.g., thalamocortical systems for human pain, lack thereof in insects). Can extend beyond consensus but not ignore it.

  11. **Avoid Triviality (Hard)**  
      *Case:* Thermostat-to-human continuum.  
      *Requirement:* Must not imply panpsychism (everything has status) or radical skepticism (nothing does). Must demarcate plausible boundaries using non-circular criteria.

  ---

  **Genuine Desiderata vs. Camp Prejudices**  
  *Genuine:* Avoiding human-specific markers (Requirement 7), permitting superhuman status (8), and decoupling behavior from experience (2) are essential for non-arbitrary, substrate-neutral rankings. Accommodating uncertainty (9) and interpolation stability (6) are practical necessities.  
  *Camp Prejudices:* Demanding a *single cardinal metric* (often from economics) is not ethically necessary; ordinal or multidimensional rankings suffice if justified (see 3). Insisting *species boundaries never matter* is misguided; while not fundamental, they can correlate with functional properties (e.g., neural complexity) evidentially. Rejecting this entirely risks ignoring biology.

  ---

  **Where the List is Unsatisfiable**  
  **The core conflict is between Interpolation Stability (6) and Non-Triviality (11).**  
  *Problem:* On any continuous path between non-sentient (thermostat) and sentient (human) systems, a theory must either:  
  (a) *Deny continuity* by positing a sharp threshold (violating 6’s demand for non-arbitrariness/stability across paths),  
  (b) *Accept continuity* by granting fractional status to intermediates (risking panpsychism if the path includes simple systems), or  
  (c) *Deny comparability* for intermediates (collapsing into paralysis or arbitrariness).  
  *Result:* No theory can satisfy both 6 and 11 fully. **Resolution:** Sacrifice strict Interpolation Stability (6) as Soft, accepting that some arbitrariness is unavoidable, but bound it by requiring thresholds be *justified by discontinuous functional properties* (e.g., emergence of global feedback). This preserves Non-Triviality (11) as Hard.

  ---

  **The Requirement that Excludes the Most**  
  **Requirement 5 (Gradual Substrate Replacement)** excludes the most otherwise-attractive accounts.  
  *Why:* Threshold theories (e.g., "cortex required") fail if silicon duplicates are status-less. Additive views struggle with non-biological substrates. Multidimensional views must explain why replacing matter changes status if function is identical. Precautionary approaches falter if the duplicate's status is certain but contested. Only theories grounding status in *specific physical implementations* (e.g., biological continuity) survive—but these violate Requirement 7 (Avoid Human-Specific Markers). Requirement 5 forces a definitive stance on functionalism vs. biological naturalism, excluding theories that evade this metaphysical rift.

  ---

  **Scorecard**  
  *(✓ = Satisfies, ~ = Partially, ✗ = Fails)*  

  | Family                              | Key Requirements                                                                 | Verdict |
  | :---------------------------------- | :------------------------------------------------------------------------------- | :------ |
  | **Simple Threshold/Lexical**        | Fails 5 (substrate replacement), 6 (interpolation), 9 (uncertainty). Strong on 11. | ✗       |
  | **Additive Intensity/Duration**     | Fails 3 (assumes cardinality), 5 (substrate), 7 (human-centric weights). Good for 9. | ✗       |
  | **Multi-Dimensional Capacities**    | ~3 (if dimensions commensurable), ~5/6 (if paths stable). Strong on 2,4,7,8. Weak on 9. | ~       |
  | **Precautionary/Expected Value**    | Strong on 9 (uncertainty). Fails 5/6 (assumes status probabilities), risks 11 (paralysis/triviality). Weak on 1,2. | ~       |

  *Summary:* No family satisfies all Hard requirements. Multidimensional views fare best but struggle with aggregation (3) and uncertainty (9). Precautionary approaches need integration with multidimensional capacities to avoid collapse. Threshold and additive views are inadequate. A hybrid *multidimensional-precautionary* approach, with explicit aggregation rules and bounded uncertainty, is the most viable path—but must confront the interpolation/substrate replacement challenges head-on.
