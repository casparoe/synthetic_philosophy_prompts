answer: |-
  Here are twelve questions for your Hobbes interview, crafted to your specifications, with likely answers and strategic follow-ups. The register is formal British English, addressed to Hobbes directly.

  **Interview Questions:**

  1.  **Mr Hobbes, you rank geometry as the only science God has yet bestowed upon mankind, and assert that the science of justice and policy began only with you because you alone made it proceed geometrically. What precisely must politics emulate in geometry to become a science?**  
      *Likely Answer:* It must emulate the synthetic method, beginning from definitions of causes and generations, demonstrating necessary consequences through ratiocination.  
      *Follow-up:* But many before you claimed to reason systematically about justice; wherein lies the *unique* geometrical character of *your* method which they lacked?

  2.  **You insist that true science begins not with discovered principles, but with definitions stating how a thing is generated, definitions which are impositions of names by the definer. Why is this act of naming fundamental to science?**  
      *Likely Answer:* Because without names fixed by definition, signifying precisely the cause and generation of a conception, reason cannot track the necessary consequences of their composition; we know only what we make.  
      *Follow-up:* If the definition is an imposition, not a discovery of essence, how can it guarantee that the consequences deduced pertain to anything real outside the mind?

  3.  **You define a point as a body considered without regard to its quantity, and a line as the trace left by a moved body. Does this mean that geometry, the model science, is ultimately a science of body?**  
      *Likely Answer:* Most certainly; geometry considers bodies not in their particularity, but under universal modes of conception arising from their generation by motion.  
      *Follow-up (Pressing Abstraction Fork - Horn 1):* If geometry is a science of body, dependent on conceptions generated by motion, how can its universal demonstrations be underwritten by a particular, imperfect diagram drawn with compasses? Is not every drawn circle merely an approximation?

  4.  *(If he takes the other horn):* **If geometry considers not body itself, but abstracted modes of conceiving body generated by us, how can it be considered a science of nature, and thus serve as a model for politics, which concerns real men and their passions?**  
      *Likely Answer:* Geometry considers the *universal accidents* of body arising *necessarily* from motion, which are real properties; politics similarly considers the universal accidents arising *necessarily* from the motions of the human mind and the artificial generation of the commonwealth.  
      *Follow-up:* But the motions of the mind and the passions are given, not generated *by* our definitions in the way a circle is; how then can definitions of justice or covenant have the same causative power as definitions in geometry?

  5.  **You commend the geometers' method of resolution and composition – resolving complex wholes into simple parts, and recomposing them synthetically. How does this apply to the commonwealth?**  
      *Likely Answer:* We resolve the commonwealth into its simplest parts – individual men, their natural motions (passions), and natural rights. From definitions of these, we compose synthetically the necessary causes and consequences of covenants, sovereignty, and the nature of justice.  
      *Follow-up:* Men and their passions are observed, not made *ex nihilo* by the political scientist. How does this difference affect the certainty attainable in politics compared to geometry, where we generate the figures *de novo* according to our definitions?

  6.  **Regarding that synthetic composition: which feature provides the core certainty – the logical deduction from definitions, the fact we generate the object (like a circle), or that we impose the names? Frame your answer carefully.**  
      *Likely Answer:* The certainty flows from the conjunction: the definitions state the generation *we* perform, fixing the names, and reason demonstrates the necessary properties flowing from *that* generation.  
      *Follow-up (Pressing Transfer Question):* But in politics, while the *commonwealth* is an artefact we generate, its *matter* – the men and their passions – is not generated by our definitions; it is observed. If we cannot define the *generation* of the passions as we define the generation of a line, does this not weaken the parallel at its root?

  7.  **You famously attempted the quadrature of the circle. Your adversary, Dr Wallis, argued your construction was flawed. You maintained the angle of contact between a curve and its tangent is a true, divisible quantity. Why was this principle essential to your defence?**  
      *Likely Answer:* Because geometry is the science of continuous quantity generated by motion; the angle of contact arises necessarily from the generation of the circle by a moving point and the generation of the tangent by the same motion, and is therefore a real accident susceptible to division like any other angle. To deny it is to deny the principles of generation and composition.  
      *Follow-up:* Wallis used algebraic methods to demonstrate the impossibility. You dismiss algebra as unscientific. Is your rejection based solely on its deviation from synthetic demonstration from causes, or is there a deeper incompatibility with your philosophy of body and motion?

  8.  **You argue that algebraic methods, lacking synthetic demonstration from the generation of figures, yield no true scientific understanding. What, then, can they yield that is of value?**  
      *Likely Answer:* They may yield instrumental rules, computational shortcuts, or probable conjectures, much like the rules of merchants' accounts; but they cannot deliver *scientia* – causal, demonstrable knowledge of *why* the thing must be so.  
      *Follow-up:* If algebra provides reliable results about the same figures geometry studies, does this not suggest that synthetic composition, while perhaps the ideal path to understanding, is not the *only* path to truth about quantity?

  9.  **You attribute the persistence of error in philosophy to three things: private interest, the authority of received schools, and the abuse of insignificant words. How do you explain the near universal rejection of your geometry by the professed mathematicians?**  
      *Likely Answer (Self-Application):* Their interests lie in maintaining the repute of their own methods, particularly that specious algebra; they are enthralled by the authority of the universities and the Royal Society, which favour novelty over true principles; and they obscure their arguments with insignificant symbols and terms not grounded in clear conceptions of body and motion.  
      *Follow-up (Pressing Self-Application):* If interest, authority, and insignificant words explain *their* error, what explains why *no* independent geometer, free of these alleged corrupting influences, was convinced by your demonstrations on the circle or the angle of contact? What specific evidence *would* have persuaded *you* that the fault lay not solely with the age, but perhaps within the geometrical arguments themselves?

  10. **If the principles of a science are definitions we impose, and the necessity in demonstration is merely the necessity in the consequences of names, how can such a science deliver truths about the real world, about bodies we did not make?**  
      *Likely Answer:* Our definitions of the simplest motions and figures are not arbitrary; they signify real conceptions generated in us by the universal properties of body and motion. The necessity is in the consequences following from those conceptions of generation, which *do* correspond to the necessary accidents of real bodies.  
      *Follow-up (Pressing Nominalism/Reality):* But if a rival defines, say, a point not as a body minus quantity, but as indivisible location, and builds a different geometry, how is the truth determined? Is it merely which definition better suits our purposes, or is there a reality, independent of our naming, to which the definitions must conform?

  11. **Given your definition of a line as the trace of a moved body, is it possible to have geometry without motion?**  
      *Likely Answer:* No, impossible; for magnitude, figure, place, and the very generation of geometrical concepts depend entirely upon the conception of body moved. Motion is the universal cause of all figure and magnitude.  
      *Follow-up:* Does this not make geometry fundamentally a branch of physics, the science of natural bodies and their motions, rather than a distinct, purely abstract science? And if so, does this not complicate its status as the unique, perfect model for an artificial science like politics?

  12. **Reflecting on your life's work in mathematics and its reception, do you believe the core principles of your geometrical philosophy – concerning generation, definition, and the nature of body – will ultimately prevail, or are they destined to remain obscured by the methods you condemned?**  
      *Likely Answer:* Truth, grounded in right reason and the true philosophy of body, must eventually prevail against the shifting fashions of symbols and the tyranny of false authority; though when, I cannot say. The principles of generation by motion are irrefutable.

  **The Question to Omit & Why:**

  *   **Do Not Ask:** "Mr Hobbes, given that your geometrical arguments, particularly on the circle, were refuted by every competent mathematician of your age using methods you decried, and that your political doctrines brought you such notoriety, do you ever concede that your prowess lay more in statecraft than in the rigours of geometry, perhaps akin to Filmer's in patriarchalism?"
      *   **Reason for Omission:** This question is deliberately inflammatory and insulting. It directly impugns his mathematical competence, compares him unfavourably to figures he despised (like Filmer), and implies his lasting fame rests solely on politics – a bitter irony given his belief in his geometry's superiority. It conflates the rejection of his mathematics (which he attributes to malice and error) with its supposed falsity. Hobbes would almost certainly perceive this as a vicious *ad hominem* attack, not a philosophical inquiry. He would likely refuse to answer, accuse the interviewer of being in league with Wallis and the Royal Society, and potentially terminate the interview in anger. The phrasing ("prowess lay more in statecraft") is patronising and designed to provoke.
      *   **Careful Version (If Absolutely Necessary):** "Mr Hobbes, history records that your political philosophy achieved profound influence while your specific geometrical propositions found little acceptance among contemporary mathematicians. Setting aside their motives, what fundamental divergence in first principles concerning body, motion, or method do you believe lay at the heart of this disagreement over geometry itself?" *This focuses on the* philosophical *disagreement rather than his competence or legacy, framing the differential reception as a historical fact to be explained by clashing principles.*
