prompt: |-
  hey — I'm a novelist, ~200 pages into a book about a made-up island republic whose legal order is built to rewrite itself: ordinary statutes flip on a majority vote, the load-bearing bits of the Code need two-thirds, and a handful of clauses are "entrenched," meaning you have to clear an even higher bar to touch them *or* to touch the entrenchment itself. A friend got me hooked on a game called Nomic a while back (players take turns proposing changes to the rules of the game, including the rules about how rules change) and it's basically ruined me, because now every scene in the Assembly turns into a self-reference headache — and my writing group has started asking what the actual rule in this fictional system is *supposed* to be, and I've noticed my own gut verdicts dont line up with each other. So here are my verdicts; I want the principle behind them, if there is one.

  1. Old rule: majority. Proposal: "from now on, amendments require two-thirds." Passes 54–46. Verdict: valid — the harder bar governs later amendments, it doesn't reach back and kill the vote that created it. 2. Old rule: two-thirds. Proposal: "from now on a majority suffices." Passes 58–42. Verdict: no good, it had to clear the bar in force at the time (which I realize is case 1 mirrored, and I'm answering the other way). 3. "Any amendment adopted with less than two-thirds is void" — itself adopted at 61%. Verdict: valid going forward, but it can't annul its own adoption; I'm much shakier here than in 1. 4. A single bundled proposal that strips the entrenchment off a clause and rewrites that clause in the same vote, clearing the higher bar. Verdict: cheats — do it in two votes, disentrench first, then rewrite — but it's the same people and the same numbers, so I can't say why I think that. 5. "For the purposes of this Code, 'majority' means two-thirds of those voting." Passes 55–45. Verdict: sneaky, I lean invalid, even though structurally it looks like case 1. 6. A poison pill: "if the Assembly ever lowers the amendment threshold below two-thirds, the Code is repealed outright and customary law revives." Later a properly adopted amendment lowers it to a majority. Verdict: the pill fires, the Code dies, and the pill dies with it, so we land in customary law — no paradox, fine. 7. Retroactive cure: a repeal failed 64–36 last year under the two-thirds rule; this year the Assembly, properly, by two-thirds, enacts "last year's repeal is deemed to have been validly adopted." Verdict: revolting, shouldn't work, even though procedurally it's spotless.

  The only principle I can actually articulate is "a change is valid iff it satisfies whatever was in force the moment before it takes effect," which gets me 1, 2, 3 and 6 but overrules me on 4, 5 and 7, and I dont want to give up all three. Can you do better — a principle (or two rival candidates) stated sharply enough that one character could deliver it in a floor speech and another could immediately try to poke a hole in it, with the clause of each one tied to the case that motivates it, and an honest list of which of my verdicts it can't save? Please also say what it predicts for the case I keep dodging: the Assembly redefines who counts as a voter (enfranchises the outer islands, or disenfranchises everyone who owns property) and the *new* electorate then ratifies the change. And my partner says my verdicts are just a ratchet — thresholds go up easy, come down nearly never — and that I've dressed plain conservatism up as jurisprudence. Is she right, and if she is, is the ratchet defensible anyway?
reasoning: |-
  Okay, the user is a novelist struggling with a fictional legal system inspired by Nomic. They've presented seven scenarios with their verdicts but can't find a consistent principle. The key issues are self-amendment rules, retroactivity, and entrenchment. 

  First, I need to understand why their gut reactions conflict. Cases 1 and 2 are mirrors but judged oppositely—valid when raising the threshold, invalid when lowering. That suggests an unspoken bias toward stability. Their partner called it a "ratchet," which seems accurate. But is that just conservatism, or is there a legal logic?

  Looking at their stated principle ("change valid if it meets prior rules"), it works for cases 1, 2, 3, 6 but clashes with 4, 5, 7. Why? Because in 4 (bundled disentrench+amend), they feel it's cheating despite meeting procedural bars. Case 5 (redefining "majority") feels sneaky, and case 7 (retroactive cure) feels revolting. The discomfort seems rooted in meta-concerns: avoiding self-justifying changes or temporal paradoxes.

  Two candidate principles emerge:  
  - **Temporal Fideism**: Rules at time T govern amendments at T. Clean, but allows all their disliked outcomes (bundling, redefinition, retroactivity).  
  - **Procedural Essentialism**: Higher rules constrain lower ones, and amendments can't covertly sabotage the framework. This protects against case 5 (redefining terms) and case 7 (retroactivity) by requiring explicit, layered consent. Case 4 (bundling) fails because disentrenchment must be standalone—it's a meta-change.  

  For the voter redefinition case: Essentialism would require the *old* electorate to approve changing electorate rules, since it alters the amendment process itself. Temporal Fideism would let the new electorate self-ratify. The user likely prefers Essentialism here (their ratchet instinct).  

  Their partner's "ratchet" critique is fair—Essentialism makes raising thresholds easier than lowering them. But defensible: foundational rules *should* be hard to alter casually. The fictional society might see stability as sacred.  

  Final principle: **"An amendment is valid only if it clears the bar applicable when proposed, *and* it doesn't subvert the framework by redefining its own validity conditions or creating retroactive effects—unless explicitly authorized by existing higher rules."**  

  This saves their verdicts except case 3 (self-validation at 61%), which Essentialism might accept but they feel uneasy about. A tradeoff: sacrifice case 3 to keep 4,5,7 aligned. Or add a "no self-application" corollary.  

  For the floor speech: A traditionalist senator argues for Procedural Essentialism ("We must protect the Code's bones!"), while a reformist counters with Temporal Fideism ("Rules are rules at the time—stop inventing ghosts!"). Perfect for their novel's conflict.
answer: |-
  Here's a principled framework for your fictional legal system, designed to match your verdicts while providing a sharp, debatable core principle. It embraces the "ratchet" critique but turns it into a defensible feature. I'll call it **Procedural Essentialism**:

  ### Core Principle (For a Traditionalist Character's Floor Speech)
  "Honorable delegates, the Code isn't just words—it's a *structure* built on *procedural legitimacy*. **An amendment is valid only if it clears the bar applicable at the moment of its proposal *and* it does not covertly undermine the framework enabling its own adoption.** Entrenched clauses aren't 'harder to change'—they are *structural foundations*. Changes to foundations require explicit, standalone consent under the *old* rules governing those foundations. Anything less turns sovereignty into self-devouring snake oil!"

  ### How It Explains Your Verdicts
  1.  **✅ Valid:** Clears the active bar (majority). Doesn’t sabotage its own foundation (it applies prospectively).
  2.  **❌ Invalid:** Fails the active bar (needed 67%, got 58%). *Also*, lowering a threshold *is* destabilizing the framework—it demands strict scrutiny under existing rules.
  3.  **✅ Valid (but shaky):** Clears the active bar (61% > majority). Its *application* is prospective (voiding future weak amendments). It doesn’t *directly* sabotage its own adoption (it didn’t exist then). *(Weakness: It implies its own adoption was "voidable" but escapes via prospective application)*.
  4.  **❌ Invalid (Cheats):** Bundling conflates two acts: stripping entrenchment (a structural change) and amending content. Structural changes require standalone validation under the *old* entrenchment rule. Bundling lets the amendment *create the conditions for its own validity*, violating the "no covert undermining" clause.
  5.  **❌ Invalid (Sneaky):** Redefining "majority" *within the Code* covertly redefines the **entire amendment process**. This isn't just changing a rule—it’s changing the *meta-rule* without explicit consent under the *old meta-rule*. It sabotages the framework enabling its adoption.
  6.  **✅ Valid (Code Dies):** The pill was validly enacted (cleared its bar). The later amendment clears *its* bar (majority), but triggers the pill—a valid, non-paradoxical consequence. The framework isn’t sabotaged; it’s *consummated* by its own terms.
  7.  **❌ Invalid (Revolting):** Retroactively curing a past failure *creates validity where none existed*. This undermines the *entire concept of procedural legitimacy* at the time of the original vote. The past failure was void *ab initio*; you can't "heal" it without erasing the authority of the rules in force then.

  ### What It Can't Save & Why
  - **Case 3 (Self-Validation at 61%)**: Essentialism *accepts* this, but you felt "shaky." To reject it, you'd need an **Anti-Self-Application Corollary**: *"No rule may declare void the very act that creates it, even prospectively."* This sacrifices Case 3 to strengthen the principle against self-reference.
  - **Case 5 (Redefining Majority)**: Essentialism rejects it, matching your verdict. If you *wanted* this valid, you'd need Temporal Fideism (below).

  ### Prediction: Changing the Electorate
  - **Procedural Essentialism Says**: **Invalid if self-ratified by the new electorate.** Changing who votes is a *structural foundation* (like entrenchment). The *old* electorate must approve it under the *old* rules. Letting the new electorate self-ratify lets the amendment *create its own legitimacy*, violating "no covert undermining."
  - **✅ Only Valid Path**: The *old* Assembly (under old voter rules) passes the change, clearing the applicable bar (e.g., majority or two-thirds), and it takes effect *after* that vote.

  ### Addressing the "Ratchet" Critique
  **Your partner is right—it *is* a ratchet.** But here’s the defense (for your traditionalist character):
  > "This isn't conservatism—it's *custodianship*. Thresholds rise easily because higher barriers *reinforce* procedural integrity. Lowering them risks collapsing the structure that makes our laws more than mere whimsy. Entrenchment exists because some things *should* be hard to undo—like the rules that keep us from becoming a tyranny of transient majorities. If you want to dismantle the foundations, you must do it openly, under the old rules, with eyes wide open to what you're destroying."

  ### Alternative Principle: Temporal Fideism (For the Reformer Character)
  "Honored colleagues, this 'essentialism' is fear masquerading as wisdom! **A rule-change is valid if and only if it satisfies the rule in force *immediately before* its adoption.** That's all! No ghosts of 'structure' or 'foundations'—just clear, sequential authority. The past governs the present; the present governs the future. Anything else is aristocracy of the *status quo*!"

  **How Temporal Fideism Handles Your Cases**:
  1. ✅ Valid (Meets prior rule: majority)
  2. ❌ Invalid (Fails prior rule: needed 67%)
  3. ✅ Valid (Meets prior rule: majority; applies prospectively)
  4. ✅ Valid (Meets the *bundled* proposal's required threshold under prior rules)
  5. ✅ Valid (Meets prior rule: majority; redefinition applies *after* adoption)
  6. ✅ Valid (Pill enacted properly; later amendment meets *its* rule but triggers pill)
  7. ✅ Valid (Retroactive cure meets *current* rule when enacted)

  **What It Sacrifices**: Your verdicts on 4 (allows bundling), 5 (allows redefinition), and 7 (allows retroactive cure)—which you rejected.

  ### Which to Choose?
  - **Procedural Essentialism** saves **6.5/7** of your verdicts (only Case 3 is shaky). It creates rich conflict: "Foundations vs. Flexibility." The ratchet is *defended* as a virtue.
  - **Temporal Fideism** saves **5/7** (fails your verdicts on 4,5,7). It's cleaner but lets rules self-destruct via redefinition or retroactivity—good for chaos/tension.

  ### Recommendation
  **Go with Procedural Essentialism**. It mirrors real constitutional anxieties (e.g., "unconstitutional constitutional amendments"), justifies your intuitive rejections of sneaky/retroactive changes, and turns the "ratchet" into a thematic strength: your island’s obsession with *order* versus the *chaos* of Nomic-style play. Have a reformer attack it as "ossification" and a traditionalist defend it as "the only shield against oblivion"—perfect for your Assembly scenes. 

  For Case 3, add the **Anti-Self-Application Corollary** if your shakiness persists: *"No rule may retroactively invalidate, or deem voidable, the act that created it."* This kills the self-validation loophole while keeping everything else intact.
