prompt: |-
  My dad is filling out a living will / advance directive and I've been reading the paperwork with him, and the whole thing seems to presuppose something I can't pin down. The proxy section says the person he picks should decide based on what he would have wanted, not on what's best for him now — so his earlier preferences are supposed to beat his current welfare. But clinicians also quietly set directives aside when a demented patient seems pretty content and is resisting what's being done to him, and he can revoke the thing at any moment while he's still competent, for any dumb reason or none. And it's much easier to get a refusal of treatment enforced than a demand for treatment he'd plausibly want.

  So what does the practice actually presuppose? That a person is a temporally extended agent who owns their whole life and so can bind later stages of it? That identity is psychological continuity, so the directive loses grip as continuity frays? Or something less metaphysical — the earlier self is just a better judge, because it isn't currently demented, manic, or in pain? Which rival views does it strictly rule out (say a straight time-slice view on which only whoever is in the chair right now counts), and where is it just underdetermined and compatible with several stories? Also: is this thing more like a will, which takes effect when its author has no stake left, or more like a contract, which binds a party who is still around and has to live with it?

  Where I get stuck: it seems like the form ought to have a second-order box where you decide in advance how much your later objections get to count, plus some lapse rule where a directive stops binding if the later you keeps objecting for a month. Would adding those make the practice more coherent, or do they collapse it?
reasoning: |-
  Okay, the user has shared a complex philosophical and practical question about advance directives and the underlying presuppositions. They've noticed several tensions in the living will paperwork their father is completing - particularly how earlier preferences are supposed to override current welfare, yet clinicians sometimes disregard directives when patients seem content. They're asking deep questions about personal identity, autonomy, and the nature of these legal documents.

  First, I need to unpack all the layers here. The user is clearly thoughtful - they've identified real contradictions in how advance directives work in theory versus practice. They mention dementia cases where directives get set aside, the ease of revoking while competent, and the asymmetry in enforcing treatment refusals versus demands. Their questions touch on metaphysics (temporal selves, identity), epistemology (earlier self as better judge), and legal philosophy (is this like a will or contract?).

  The core tension they've spotted is between three principles that advance directives try to balance: precedent autonomy (past wishes), current welfare, and present autonomy (even if impaired). In real clinical practice, these often conflict in messy ways that the forms don't acknowledge.

  I should address their specific questions systematically:
  - The metaphysical presupposition seems to be a hybrid view: we treat persons as temporally extended (hence binding future selves) but with psychological continuity as the anchor (so when continuity severely breaks, the directive may loosen)
  - It rules out pure time-slice theories where only the present moment matters
  - The "better judge" practical argument is equally important - we trust competent selves over impaired ones
  - The will vs contract analogy is insightful - it's actually neither perfectly. More like a "commitment device" with living beneficiaries (the future self)

  Their proposed solution - a second-order clause about how much to weight later objections - is brilliant but dangerous. It might make directives more nuanced but could also create new ambiguities. I've seen some experimental "Ulysses contracts" in psychiatry that attempt this, but they're controversial.

  The user seems frustrated by how crude the forms are compared to the philosophical complexity. They're probably looking for both understanding and practical advice for their father. I should acknowledge the imperfections while explaining why the system works well enough in most cases. Might mention that some scholars like Rebecca Dresser have proposed "mediated directives" as alternatives.

  This feels like the kind of question that keeps bioethicists up at night - it exposes how our legal frameworks simplify profound questions about identity and autonomy. The user has really put their finger on why advance care planning feels philosophically unsatisfying even when practically necessary.
answer: |-
  That's an incredibly sharp analysis – you've pinpointed the core philosophical and practical tensions embedded in advance directives. The presuppositions are indeed complex and often unstated. Let's break down the rival views and what the practice *actually* leans on:

  **Core Presuppositions (A Hybrid & Pragmatic View):**

  1.  **Primacy of Precedent Autonomy (But Not Absolute):** The strongest presupposition is that a *competent* person has the right to control their *future* medical care, especially regarding states they fear (intolerable suffering, meaningless existence, loss of personhood). This views the person as a temporally extended agent ("**whole life ownership**").
  2.  **Earlier Self as the "Better Judge":** Crucially, this isn't *purely* metaphysical identity. It's heavily practical: the earlier, competent self is presumed to be:
      *   **More Rational:** Less likely to be clouded by acute pain, depression, dementia, delirium, or transient despair.
      *   **More Informed:** Able to consider long-term consequences and values across a lifespan.
      *   **Possessing "Truer" Values:** Holding the core life narrative, values, and conception of a "good death" that dementia or severe illness might obscure.
      *   **Protecting Against Harm:** Seen as protecting the future self from suffering states the *earlier* self deemed worse than death.
  3.  **Psychological Continuity as the Anchor (But With Fraying Edges):** The directive *gains* its moral force from the continuity between the competent directive-maker and the future incapacitated patient. However, the practice *implicitly acknowledges* that when psychological continuity is *severely* disrupted (e.g., late-stage dementia where the person seems content and lacks any connection to past values or identity), the directive's binding force weakens. The *current* well-being and observable preferences of the *present* individual become harder to override purely based on a past instruction. This isn't a clean metaphysical line but a clinical judgment about the *degree* of continuity and the *nature* of the present experience.
  4.  **Pragmatic Asymmetry:** The easier enforcement of refusals vs. demands reflects practical realities:
      *   **Liberty Interest:** Refusing unwanted bodily intrusion is a fundamental liberty right, strongly protected even for incapacitated persons (hence honoring refusals).
      *   **Resource Allocation & Futility:** Demanding treatment (especially expensive, scarce, or potentially futile treatment) involves claims on others' resources and professional judgment. Courts are reluctant to *force* clinicians to provide treatment they deem inappropriate.
      *   **Knowledge Gap:** The earlier self can know what they *don't* want (e.g., prolonged suffering in a vegetative state). It's much harder to anticipate and demand specific *future* beneficial treatments that haven't been invented or whose risks/benefits are unknown.

  **What Views Does It Rule Out?**

  *   **Strict Time-Slice View (Only Present Self Matters):** This is clearly ruled out. The entire *point* of the directive is to bind future selves based on past wishes. The competent revocation clause *acknowledges* the present self's supremacy *while competent*, but once capacity is lost, the past self's instructions take precedence over the present incapacitated self's *potential* but unverifiable or irrational objections.
  *   **Pure "Current Welfare" Maximization:** While current welfare matters (especially when continuity is low), it is explicitly *subordinated* to precedent autonomy in the directive's instructions. The proxy is told *not* to choose based solely on what seems best *now* for the patient, but on what the patient *would have wanted*.

  **Where is it Underdetermined/Compatible?**

  *   **The *Degree* of Psychological Continuity Required:** The practice doesn't specify a precise threshold. How much dementia, how content must the patient be, how disconnected from past values, before the directive weakens? This is left to clinical/ethical judgment, compatible with various views on identity.
  *   **The *Basis* of the "Better Judge" Status:** Is it purely epistemic (better information/rationality) or also metaphysical (the "real" self)? The practice works with the epistemic argument but often *feels* metaphysical.
  *   **The *Weight* of Present Objections:** How much should an incapacitated patient's consistent resistance to a directive (e.g., a dementia patient fighting a feeding tube they previously rejected) count? The form doesn't say, leading to the ambiguity you observed in practice. This is underdetermined territory.

  **Will vs. Contract?**

  *   **Neither Perfectly, But Leans Contractual:** While it *takes effect* like a will (upon incapacity/death), it fundamentally **binds the still-living future self**, who *does* have a stake. The future self must *live with* (or *die from*) the consequences of the past self's decision. This makes it more like a **unilateral commitment device** or a **contract with one's future self**.
      *   **The Revocation Clause is Key:** This reinforces the "contractual" aspect *while capacity exists*. The present self can always renegotiate the terms until they lose the legal capacity to do so. After that, the "contract" (directive) binds the future self.

  **Your Proposed Solutions: Second-Order Box & Lapse Rule**

  Your ideas are brilliant and highlight the current system's shortcomings. Would they work?

  1.  **Second-Order Box ("How Much Weight to Give My Future Objections?"):**
      *   **Pros:** Increases nuance, respects autonomy *over time*, acknowledges the potential conflict. Could allow people to say "If I consistently object to X for Y period, even if demented, override my prior refusal/demand."
      *   **Cons:**
          *   **Complexity & Burden:** Makes an already difficult form even harder. Requires anticipating complex future states.
          *   **Interpretation Nightmare:** How is "objection" defined in advanced dementia (is agitation an objection?)? Who decides if the objection is "valid" under the terms? Creates huge potential for disputes.
          *   **Potential for Coercion:** Could be exploited by others ("Mom ticked the box saying to listen to her if she objected, and she keeps saying 'no' to the hospice nurse...").
          *   **Might Collapse the Primacy of Precedent Autonomy:** If the later objection "counts" too easily, it undermines the core purpose of binding the future self. Where's the line?

  2.  **Lapse Rule ("Directive stops binding after sustained objection"):**
      *   **Pros:** Directly addresses the clinical reality you observed. Provides a clear(ish) off-ramp if the current self persistently rejects the directive.
      *   **Cons:**
          *   **Severely Undermines the Directive:** Essentially makes the directive only valid until the incapacitated person starts objecting. What's the point of making it then?
          *   **Defines "Objection" Problem:** Same issues as above. Is passive resistance enough? What about fluctuating capacity?
          *   **Ignores *Why* the Directive Exists:** The objection might be rooted in the very impairment (dementia, delirium) the directive was meant to guard against. Honoring it might lead to the suffering the person feared.
          *   **Creates Perverse Incentives:** Could encourage caregivers to "wait out" the objection period.

  **Would They Make it More Coherent or Collapse It?**

  *   **Coherence:** They would make the *theoretical framework* more coherent by explicitly incorporating the tension between temporal selves and providing mechanisms for it. They acknowledge that the past self *isn't* always sovereign over the future self when continuity is low and the future self expresses a contrary preference.
  *   **Collapse Risk:** There's a significant risk they would **pragmatically collapse the core function** of advance directives. The beauty (and fragility) of the current system is its relative simplicity and strong presumption in favor of precedent autonomy. Introducing complex conditional clauses based on future behavior creates massive uncertainty, interpretative burdens, and legal vulnerability. It could make directives practically unenforceable or lead to outcomes directly contrary to the person's deepest values as expressed when competent.

  **Conclusion:**

  The practice presupposes a messy, pragmatic hybrid: a **temporally extended agent whose competent past self is the "best judge"** of what constitutes harm or a life worth living for its future selves, grounded primarily in **epistemic superiority** (rationality, foresight, clarity of values) rather than pure metaphysics. It prioritizes **precedent autonomy** but implicitly acknowledges its limits when **psychological continuity frays** significantly and the **current self exhibits consistent well-being or resistance**. It functions like a **revocable contract with one's future self**, enforced more easily for **negative liberties** (refusals) than **positive claims** (demands).

  Your proposed additions are philosophically insightful attempts to resolve the inherent tensions. However, their practical implementation risks undermining the directive's primary purpose by introducing paralyzing complexity and potentially ceding too much ground to the preferences of the impaired present self. The current system, while flawed and sometimes ethically uncomfortable, operates on a necessary (though imperfect) presumption: the competent *you* gets to decide for the future *you*, especially when the future *you* might not be in a position to make good decisions. The clinical flexibility you observe in dementia cases represents the system's *de facto* acknowledgment of its own limits when that presumption becomes morally untenable.
