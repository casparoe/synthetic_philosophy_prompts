  ### In-Class Activity: Terraforming Station Certification Board  
  **Goal:** Create a tangible conflict between etiological (selected-effect) and causal-role accounts of function without naming them upfront, forcing students to grapple with divergent "instructions" for certifying biological parts.  

  ---

  #### **Materials**  
  *Printed for each of 4 groups (4 students/group):*  
  1. **Organism Dossier** (Aquafern species):  
     - **Part 1: Gas Chambers**  
       - *Description:* "Thin-walled sacs that store gases. In water, they enable buoyancy control and passive gas exchange (O₂/CO₂)."  
       - *Conflict:* In legacy organisms, selected for buoyancy; now primary site for O₂ uptake. In assembled, designed for gas exchange.  
     - **Part 2: Display Crests**  
       - *Description:* "Colorful, fleshy appendages used in mating displays. They emit pheromones when intact."  
       - *Conflict:* In legacy, selected for mate attraction; now attracts a predator (Skimmers) that kills bearers. In assembled, designed for mate attraction but Skimmers absent.  
     - **Part 3: Vestigial Spines**  
       - *Description:* "Hard, bony protrusions along the dorsal ridge. No observed role in behavior or survival."  
       - *Conflict:* In legacy, remnants of predator defense; now inert. In assembled, accidental by-product of synthesis.  
     - **Part 4: Digestive Vents**  
       - *Description:* "Pores that expel digestive by-products. Also anchor symbiotic bacteria that regulate thermal tolerance."  
       - *Conflict:* In legacy, selected for waste expulsion; now co-opted for thermoregulation. In assembled, designed for thermoregulation.  
     - **Part 5: Duplicated Filter Sets (Anterior & Posterior)**  
       - *Description:* "Hair-like structures filter water for nutrients. Anterior set larger; posterior set smaller."  
       - *Conflict:* In legacy, anterior selected for feeding; posterior is non-selected duplication now used for O₂ filtration. In assembled, both designed identically for O₂ filtration.  

  2. **Capacity Ticket** (Assigned per group):  
     - Ticket A: "Protect OXYGEN UPTAKE capacity."  
     - Ticket B: "Protect THERMOREGULATION capacity."  
     - Ticket C: "Protect PREDATOR AVOIDANCE capacity."  
     - Ticket D: "Protect REPRODUCTIVE SIGNALLING capacity."  

  3. **Tokens & Cards:**  
     - 20 tokens/group (for repairs).  
     - 5 certification cards/part (CRITICAL/OPTIONAL/JUNK).  
     - 1 "Handover Revision" card (to revise one certification later).  

  ---

  #### **Rules & Payoff Scheme**  
  1. **Certification Phase (20 min):**  
     - Groups certify each part as **CRITICAL** (must repair if degraded), **OPTIONAL** (may repair), or **JUNK** (no repair).  
     - *Constraints:*  
       - CRITICAL parts must be repaired if degraded (cost: 1 token/part).  
       - OPTIONAL repairs are discretionary.  
       - JUNK parts cannot be repaired.  
     - **Key Twist:** Groups know their capacity ticket but **not** their organism type (legacy/assembled) yet.  

  2. **First Season Simulation (10 min):**  
     - Instructor announces degradations (fixed for all groups):  
       - Gas Chambers degrade (impairs O₂ uptake).  
       - Display Crests degrade (triggers pheromone release).  
       - Posterior Filter Set degrades.  
     - Groups spend tokens to repair CRITICAL/OPTIONAL parts.  
     - **Survival Check:**  
       - Organism dies if:  
         - O₂ ticket: No functional O₂ uptake system (Gas Chambers or Posterior Filters).  
         - Thermoregulation ticket: Digestive Vents degraded and not repaired.  
         - Predator Avoidance ticket: Display Crests functional (attracts Skimmers).  
         - Reproductive ticket: Display Crests degraded (no signalling).  
       - *Survival Awards:* 10 points for Season 1 survival.  

  3. **Reveal & Handover Phase (10 min):**  
     - **Reveal 1:** "Your organism has a physically identical twin of the other kind (legacy ↔ assembled)."  
     - **Reveal 2:** Environment changes:  
       - New predator (Skimmers) introduced.  
       - Water temperature fluctuates wildly.  
     - Groups revise **one** certification using the Handover Revision card.  

  4. **Second Season Simulation (10 min):**  
     - New degradations: Digestive Vents and Anterior Filter Set degrade.  
     - Groups repair based on revised certifications.  
     - **Survival Check:** Same rules, but conditions stricter (e.g., Skimmers attack if Display Crests intact; temp swing fatal without Digestive Vents).  
     - *Survival Awards:* 20 points for Season 2 survival.  

  5. **Wager (5 min):**  
     - Groups wager 0–5 points on whether their certifications will change once they learn their organism’s provenance (legacy/assembled).  
     - *After debrief:* If certifications change → lose wagered points; no change → gain points.  

  ---

  #### **Group Setup & Information Asymmetry**  
  - **4 Groups:** Each gets 1 organism dossier (Aquafern) and 1 capacity ticket.  
    - Group 1: Legacy Aquafern + Ticket A (O₂)  
    - Group 2: Legacy Aquafern + Ticket C (Predator Avoidance)  
    - Group 3: Assembled Aquafern + Ticket A (O₂)  
    - Group 4: Assembled Aquafern + Ticket C (Predator Avoidance)  
  - **Blind Spots:**  
    - No group knows if their Aquafern is legacy/assembled initially.  
    - No group knows other groups’ tickets until final reveal.  

  ---

  #### **Predictable Problems & Solutions**  
  1. **Students collapse function into "usefulness-to-us":**  
     - Groups with O₂ ticket may certify Gas Chambers as CRITICAL regardless of history.  
     - *Mitigation:* In debrief, contrast this with Vestigial Spines (no causal role but historical function).  

  2. **Board ignores capacity ticket and certifies for survival:**  
     - E.g., Predator Avoidance group certifies Digestive Vents as CRITICAL "just in case."  
     - *Mitigation:* Award fewer points if organism survives but ticket capacity fails.  

  3. **"It’s obviously both!" dismissal:**  
     - Students may try to "split the difference" early.  
     - *Mitigation:* Force trade-offs (e.g., limited tokens make OPTIONAL repairs costly).  

  ---

  #### **Debrief: Moving from Activity to Theory**  
  **Step 1: Map Student Decisions to Accounts (15 min)**  
  - *Ask:* "Which parts caused the most debate? Why?"  
    - **Gas Chambers:**  
      - Legacy/O₂ group: Likely certified CRITICAL for causal role (O₂ uptake).  
      - Legacy/Predator group: Certified OPTIONAL/JUNK (no role in predator avoidance).  
      - *Etiological:* "Its *proper function* is buoyancy, not O₂ uptake. If it fails at buoyancy (but does O₂), it malfunctions."  
      - *Causal-Role:* "What matters is its current contribution to O₂ capacity."  
    - **Display Crests:**  
      - Legacy/Predator group: Certified JUNK (attracts predators now).  
      - Assembled/Predator group: Certified CRITICAL (designed for signalling, no predators).  
      - *Etiological:* "In legacy, its function is signalling—even if it now harms."  
      - *Causal-Role:* "Its net effect on survival determines function."  
    - **Vestigial Spines:**  
      - Groups certify JUNK (no causal role).  
      - *Etiological:* "In legacy, it *had* a function; in assembled, it never did."  
      - *Causal-Role:* "No difference—no current role."  

  **Step 2: Name the Pattern (5 min)**  
  - *Ask:* "What *question* were you answering when you certified parts?"  
    - Let students generate:  
      - "What is this part *supposed* to do?" (Etiological)  
      - "What does it *actually* do for the system?" (Causal-Role)  
  - *Then supply vocabulary:* "You’ve described the etiological vs. causal-role accounts."  

  **Step 3: Highlight the Tension (5 min)**  
  - *Pose:* "Why did physically identical twins get different certifications?"  
    - Emphasize:  
      - Legacy organisms carry "selected history" → etiological functions can *conflict* with current contributions (e.g., Gas Chambers).  
      - Assembled organisms have no history → causal role is the only guide.  
  - *Conclude:* "These aren’t two definitions of ‘function’—they’re answers to different questions. The tension arises because history and current contribution can pull apart."  

  ---

  #### **Limitations & Corrective Framing**  
  - **Budget Framing Biases Toward Causal Role:**  
    - The "repair budget" implicitly prioritizes current contributions (what a part *does* over why it exists).  
    - *Corrective:* In debrief, stress: "The etiological account explains *malfunction* (e.g., Gas Chambers failing at buoyancy but doing O₂). Our activity couldn’t simulate this because the station only cares about outcomes."  
  - **What You Must Explain (Last 10 min):**  
    - **Malfunction & Normativity:** Etiological accounts allow a part to work "wrongly" (e.g., a heart pumping blood is "broken" if it fails, even if it makes art). Causal-role lacks this normativity.  
    - **Selection vs. Design:** Clarify that "selection history" in etiological accounts mirrors "design intent" in assembled organisms—but only natural selection is mindless.  
  - **Final Note:** "The activity shows why biologists *need* both accounts: one to explain origins (why do we have this part?), the other to explain mechanisms (how does it work now?)."  

  This design forces students into the conflict before labeling it, using tangible trade-offs and asymmetric information. The debrief extracts philosophical insights from their lived choices, making the accounts feel like solutions to different problems—not semantic quibbles.
