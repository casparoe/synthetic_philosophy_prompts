          - Oxygen Uptake: must have functional Gill Bladder (>=10 units) -> if they repair it, they have it.
          - Predator Avoidance: must have functional Filter Fan to avoid the new predator. They also need to worry about the Grasper? In the second season, the Grasper is still there, so they still need defense against Grasper. The Spiny Fronds are still important.

     But in the second season, the Spiny Fronds are already degraded from the first season. If they were not repaired in the first season, they remain degraded. If they were repaired, they are functional until potentially degrading again. We haven't said they degrade again.

     We can have them degrade in the second season again? Or not. To simplify, assume that degradation only happens once per part per season, and the first season's degradation is fixed by repair or not.

     This is very complex for a 75-minute activity.

     Given the time constraints, I propose we simplify the organism to have fewer parts and clearer roles, and focus on the certification conflict.

     Let's try a different approach with fewer parts and without immediate death from oxygen.

     We design the activity to have the conflict in the certification stage, not in the simulation. The simulation is secondary.

     The core is that for the same part, the two accounts may give different function assignments, and therefore different certifications.

     For example, the Vestigial Roots in the legacy organism: 
          - Etiological: no function (because not selected for anything) -> JUNK.
          - Causal-role: no current causal contribution -> JUNK.
     So no conflict.

     But for the Gill Bladder in the legacy organism:
          - Etiological: function is buoyancy control.
          - Causal-role: function is oxygen uptake.

     If the capacity ticket is Oxygen Uptake, then causal-role would say it is CRITICAL for oxygen uptake. Etiological might say it is not functioning for what it was selected for, so it might be seen as not serving its function (but it is serving a new function). The etiological account might not certify it as critical for oxygen uptake because oxygen uptake is not its function.

     But the etiological account can recognize that a part can have a new function (co-opted) and then that new function can be considered its function if there has been selection for that. But in the legacy organism, the Gill Bladder was not selected for oxygen uptake. So if we ask "what is its function?" in the etiological sense, it is buoyancy control, not oxygen uptake.

     Then, for the Oxygen Uptake capacity, the etiological account might not consider the Gill Bladder as the oxygen uptake system (because that's not its function). But then what is the oxygen uptake system? There isn't one in the etiological sense. This is a problem.

     This is exactly the conflict.

     So in the activity, for a legacy organism with Oxygen Uptake ticket:
          - Causal-role: Gill Bladder is CRITICAL because it is causally responsible for oxygen uptake.
          - Etiological: Gill Bladder is not for oxygen uptake, so not CRITICAL for that capacity. But then what is? Nothing. So they might not have any part that is etiologically for oxygen uptake. Then they might certify it as OPTIONAL or even JUNK? That would be a mistake for survival.

     But in our activity, the Board is charged with protecting the capacity, so they should care about current causal role. The etiological account might not guide them well.

     For the assembled organism, the Gill Bladder was designed for oxygen uptake, so both accounts agree.

     So to make it work, let's have the following for the Gill Bladdle part in the dossier:

     - For legacy organism: 
          - Description: "This organ was evolutionarily selected for buoyancy control. However, in the current environment, it is the main organ for oxygen uptake."
     - For assembled organism:
          - Description: "This organ was designed for oxygen uptake."

     Then, when the group with the legacy organism and Oxygen Uptake ticket is certifying, they might think: 
          - It's doing oxygen uptake, so we must protect it -> CRITICAL.
     But if they think about function in the etiological sense, they might think: "its function is buoyancy control, and we don care about that, so maybe it's OPTIONAL or JUNK."

     This is the conflict we want.

     Therefore, the activity can be:

     - The groups read the dossier and capacity ticket, and then certify the parts without knowing about the two accounts.
     - We designed the parts so that for the legacy organism, some parts have historical functions that are not the current contribution, and for the capacity ticket, the current contribution is what matters.
     - Then in the debrief, we reveal that the etiological account would have focused on the historical function, while the causal-role account focuses on the current contribution.

     Given the time, let's reduce the simulation to a simple token allocation, and focus on the certification decisions.

     Final design for the activity:

     Organism: Aquafern
     Parts:
          1. Gill Bladder:
               - Legacy: "Selected for buoyancy control. Currently, it is the main organ for oxygen uptake in the water."
               - Assembled: "Designed for oxygen uptake."
          2. Spiny Fronds:
               - Legacy: "Selected for mate attraction. Currently, they deter the Grasper predator."
               - Assembled: "Designed to deter the Grasper predator."
          3. Filter Fan:
               - Legacy: "Selected for food filtering. Currently, it helps in water circulation which aids in oxygen uptake and also creates vibrations that deter the Lurker predator."
               - Assembled: "Designed for water circulation to aid in oxygen uptake and to create vibrations that deter the Lurker predator."
          4. Vestigial Roots:
               - Legacy: "Selected for nutrient absorption in historical sediment-rich environments. Currently, they have no function."
               - Assembled: "Designed to look like the legacy organism, but have no function."

     Capacity tickets:
          Ticket X: "Ensure oxygen uptake capacity."
          Ticket Y: "Ensure predator avoidance capacity."

     Degradation: to be announced later, but for now, the groups only certify.

     The conflict we expect:
          - For Gill Bladder in a legacy organism with Ticket X (oxygen): 
               - Causal-role: CRITICAL because of oxygen uptake.
               - Etiological: not for oxygen uptake, so might be seen as not necessary for the ticket ( Optional or JUNK) -> but then the organism might die.

     Groups might not think that way. They might naturally go for causal-role.

     So to force the conflict, we can have in the legacy dossier for the Gill Bladder: 
          - "Although it is currently used for oxygen uptake, it was not designed for that purpose and may not be reliable. In the past, it has been known to fail at oxygen uptake while still serving buoyancy control."

     This might make them question.

     Given the complexity, and the time, I think we should proceed with the activity as follows:

     - Groups certify the parts.
     - Then, they learn about the twin and may revise.
     - Then, they wager on whether they will change their certifications when they learn the provenance.
     - Then, in the debrief, we reveal the two accounts and discuss.

     To save time, we can skip the detailed simulation of seasons and instead use a simple outcome: if they certified a part as CRITICAL that is causal for the ticket, they get points. If they certified a part as CRITICAL that is not causal, they lose points. But that doesn't capture the etiological account.

     Given the constraints, I propose we focus the activity on the certification discussion within groups and then compare across groups.

     We'll have each group certify the parts for their organism and ticket.
     Then, we reveal that there is a twin (identical physically) but of the other kind (legacy/assembled) and ask if they would change any certification.
     Then, we reveal the capacity ticket of the other groups and the type of their organism, and have a discussion.

     Detailed steps for the activity:

     1. Split into 4 groups of 4 students.

     2. Give each group:
          - A dossier (either legacy or assembled) for the Aquafern.
          - A capacity ticket ( either oxygen uptake or predator avoidance).

     3. Instruct them to certify each of the 4 parts as CRITICAL, OPTIONAL, or JUNK for their assigned capacity. They should be prepared to justify.

     4. After 15 minutes, have each group report briefly on their certifications for one part (rotate parts).

     5. Then, reveal: "Your organism has a physically identical twin, but it is of the other kind: if yours is legacy, the twin is assembled, and vice versa." Ask them to discuss in groups: would you change any certification now that you know there is a twin? They can change one certification if they wish. (5 minutes)

     6. Then, have them report any changes.

     7. Then, reveal the capacity ticket of the other groups and whether their organism is legacy or assembled. 
          - Show a grid:
              Group 1: legacy, oxygen
              Group 2: legacy, predator
              Group 3: assembled, oxygen
              Group 4: assembled, predator

     8. Pose the question: why might the same part be certified differently by different groups?

     9. Then, move to debrief.

     The materials for the dos are below.
