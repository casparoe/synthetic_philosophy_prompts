answer: |-
  Below is a structured procedure for choosing a reference class for an individual patient's risk score, designed to be executed in approximately 15 minutes per complaint. It addresses the core challenges: (i) multiple reasonable classes that disagree, (ii) the pitfalls of narrow classes (empty/small/data-mined), and (iii) outdated cohort data. The procedure includes explicit stopping points ("no number shown"), handoffs for values-based decisions, and acknowledgment of inherent limitations. It is formatted as a checklist for your team.

  ---

  ### **Procedure for Selecting a Reference Class**  
  **Time Budget:** 15 minutes per patient complaint. Use a timer.  
  **Goal:** Identify a single reference class (named, n≥50, traceable) or conclude "no number shown."  
  **Core Principles:**  
  - **Relevance:** The class must reflect the patient’s key risk factors (without outcome contamination).  
  - **Validity:** Classes must be defined *a priori* (not data-mined).  
  - **Defensibility:** Prefer classes from guidelines/hospital-endorsed models.  
  - **Transparency:** Document rationale at each step.  

  #### **Step 1: Define the Outcome and Patient Context (2 minutes)**  
    - **Action:** State the risk score’s outcome (e.g., "10-year CVD risk") and list the patient’s key characteristics (e.g., age 62, diabetes, prior stent, CKD stage 3).  
    - **Good Enough Answer:** Unambiguous outcome definition and ≤5 relevant patient factors.  
    - **Stop If:** Outcome is undefined or patient factors are missing. Output: "No number shown—incomplete input."  

  #### **Step 2: Generate Candidate Classes (3 minutes)**  
    - **Action:** List 1–3 candidate classes from:  
      - Hospital-endorsed models (e.g., ACC/AHA Pooled Cohort Equation for CVD).  
      - Clinical guidelines (e.g., ADA Standards for diabetes).  
      - Registry data (e.g., "diabetics aged 60–65," "post-op patients with COPD").  
    - **Constraints:**  
      - Classes must have n≥50 in your registry.  
      - Never include race, sex, or insurance status without ethics committee pre-approval (hand off to Compliance if proposed).  
      - Classes must be defined *before* outcomes were known (no data-dredged subgroups).  
    - **Good Enough Answer:** 1–3 classes that include the patient’s major risk factors.  
    - **Stop If:** No class has n≥50. Output: "No number shown—no class of size ≥50."  

  #### **Step 3: Assess Class Validity (4 minutes)**  
    - **Action:** For each candidate, evaluate:  
      - **A Priori Definition:** Was the class defined in a guideline/model *before* registry outcomes were analyzed? (If unsure, check publication date vs. registry data collection.)  
      - **Outcome Contamination:** Does the class definition include the outcome variable? (e.g., a "high-risk pneumonia" class defined by actual pneumonia cases).  
      - **Temporal Relevance:** Is the cohort outdated? (e.g., pre-modern drugs). Note bias but proceed if best available.  
    - **Good Enough Answer:** All classes pass a priori and contamination checks.  
    - **Stop If:** All classes fail a priori/contamination checks. Output: "No number shown—no valid reference class."  

  #### **Step 4: Resolve Disagreement Among Classes (5 minutes)**  
    - **Action:** If multiple valid classes remain:  
      1. **Prioritize Specificity:** Prefer the class matching the most risk factors (e.g., "diabetics with prior stent" over "all diabetics").  
      2. **If Tied, Use Hierarchy:**  
         - Choose hospital-endorsed models first.  
         - Then, guideline-based classes (newest publication).  
         - Then, largest n (most stable).  
      3. **Values Handoff:** If prioritization requires trade-offs (e.g., "useful for decision" vs. "defensible in court"), escalate to the Clinical Ethics Committee. Document: "Referred for values adjudication."  
    - **Good Enough Answer:** One class selected via hierarchy.  
    - **Stop If:**  
      - Classes disagree severely (>10% absolute difference) *and* no clinical consensus exists.  
      - Hierarchy fails (e.g., ties unresolved).  
      - Output: "No number shown—high disagreement among valid classes."  

  #### **Step 5: Finalize and Document (1 minute)**  
    - **Action:** State the chosen class (name, n, risk estimate), rationale, and limitations (e.g., "Uses 2008 cohort—may overestimate risk").  
    - **Output:** Display the number with the named class in the EHR. If stopped earlier, show blank.  

  ---

  ### **Key Limitations of the Procedure**  
  1. **Cannot overcome data gaps:** Outdated cohorts or missing variables introduce bias but are used if best available.  
  2. **Not a substitute for judgment:** The procedure selects the "least wrong" class; it does not guarantee accuracy for the individual.  
  3. **Values dilemmas:** Race/sex/insurance decisions require ethics review—this procedure only flags them.  
  4. **The n=1 problem is fundamental:** Narrow classes are empty/small because patients are unique—this is not a database flaw. Practically, we trade specificity for stability (n≥50).  

