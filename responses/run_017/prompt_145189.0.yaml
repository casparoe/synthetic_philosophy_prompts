  Okay, so the user is having a debate with their flatmate Dev about this split-surplus lemma from a working paper. They've outlined Dev's argument step by step, leading to some conclusions they find insane. Specifically, point (6) suggests that one should always allocate a fixed slice of life to every moral view, no matter how certain one is it's wrong, avoid high-variance moral bets, and compromise even with those advocating monstrous acts. The user wants to know where the argument goes wrong and how to salvage the sensible parts without accepting the extreme conclusions.

  First, I need to break down each step of Dev's argument. Step (1) and (2) seem solid—concavity in resource allocation leading to gains from compromise regardless of who's right. The user agrees with this, especially since they've used similar reasoning in negotiations. Step (3) draws an analogy between interpersonal disagreement and moral uncertainty. Step (4) extends the concavity reasoning to moral hedging. Step (5) claims that hedging doesn't depend on credence but on the concavity itself. Step (6) concludes with those three insane points.

  The user's main issue is with (6), particularly (a) and (c). They don't want to allocate resources to views they deem garbage or compromise on what they see as monstrous. But they value (1)-(4) and find (3) intuitive. So, where does the argument break?

  The key flaw seems to be in step (3) and (4). The analogy between interpersonal compromise and moral uncertainty might not hold. In interpersonal cases, the resource is shared, and both parties have a claim. In moral uncertainty, the agent is a unitary decision-maker. The concavity applies to resource allocation, but moral uncertainty involves allocating effort based on normative weights, not just efficiency. 

  Step (5) is problematic because it dismisses credence entirely. While concavity matters, credence should influence how much weight a moral view gets. Ignoring probability leads to giving resources to views with negligible likelihood, which is inefficient. The user mentioned a 0.1% view still getting a seat—this seems irrational if the agent is almost certain it's false.

  Step (6)(a) and (c) are where the conclusions become unacceptable. Allocating fixed slices regardless of certainty ignores diminishing returns and opportunity costs. Also, compromising with someone advocating monstrous acts could violate core moral principles. The user's intuition here is correct; not all compromises are permissible.

  To salvage the split-surplus lemma, the user needs to reject the strict analogy in (3) and the dismissal of credence in (5). They can maintain that concavity supports compromise in shared resources without extending it to moral hedging in the same way. For moral uncertainty, a balanced approach using both credence and concavity (like variance-adjusted weighting) makes more sense. 

  Rejecting step (3) costs the neat symmetry between interpersonal and moral decisions but preserves the practical benefits of compromise. Rejecting step (5) means acknowledging that probability matters, which avoids wasting resources on highly unlikely views. The user can keep the core insight of (1) and (2) while avoiding the extreme conclusions of (6).
answer: |-
  Right, let's dissect this properly—Dev's built a fascinating but overextended edifice from a sound foundation. The split-surplus lemma is genuine insight for *interpersonal compromise*, but its leap to *moral uncertainty* commits several category errors. Here's where it goes off-piste, why it *looks* persuasive, what rejecting each step costs you, and how to salvage the valuable bits without the madness. I'll keep it in British English as requested.

  ### The Core Flaw & Where Dev Derails
  The fatal misstep is **Step (3) and its uncritical application in (4)/(5)**. Here's why:

  1.  **Step (3) is a False Equivalence:** Disagreeing with another person over a *shared resource* is **not** structurally identical to being uncertain about moral truth *within your own mind*.
      *   **Interpersonal (Shared Resource):** The concavity applies to a *physical* resource (money, time, land) being allocated. Both parties have *legitimate, competing claims* to control that resource. Jensen's inequality shows splitting the *resource* often dominates winner-takes-all conflict *for that resource*. The "surplus" is realised in the physical outcome (e.g., both projects get partial funding, yielding more total 'good' per pound spent due to diminishing returns).
      *   **Intrapersonal (Moral Uncertainty):** Here, the "resource" is your *own effort/agency*. You are the sole decision-maker. There is no external party with a legitimate claim forcing compromise. The concavity *might* technically apply if you model "moral output" as a concave function of resources spent *on a specific moral view* (e.g., £1000 to AMF does more *per pound* than £1 million, due to room for more funding). **But:**
          *   **No Legitimate Competing Claimant:** The Nazi ideology in your head isn't a separate agent with rights; it's a belief *you* assess as almost certainly monstrous and false. Splitting *your* resources with it isn't analogous to compromising with an actual Nazi over shared funds – it's capitulating to an internal fiction you reject.
          *   **Credences *Must* Matter:** In interpersonal deals, the split-surplus exists *regardless* of who's "right" because the physical concavity is objective. In moral uncertainty, your *degree of belief* (credence) in a view being *true* is paramount. Allocating effort proportional to expected choice-worthiness (credence * strength of the view if true) *already incorporates risk aversion/concavity concerns* if done properly (e.g., variance-adjusted weighting).
      *   **Why it Looks Fine:** The analogy *feels* natural because both involve "spreading resources". The maths *looks* similar if you crudely map "moral view" to "agent". But it ignores the fundamental difference between internal belief assessment and external negotiation with autonomous agents.

  2.  **Step (5) is Unworkable and Absurd:** Dismissing credences entirely ("a 0.1% view still gets a seat") is where it truly implodes.
      *   **Ignores Opportunity Cost:** Your time, money, and energy are finite. Allocating *any* fixed slice to a view you believe is 99.9% likely to be not just wrong but actively harmful (e.g., devoting 1% of your income to a cause promoting something you find abhorrent) isn't "hedging"; it's actively *harming* causes you believe in with near certainty, for negligible potential upside. The concavity might *technically* say spending £1 on the 0.1% view does more *marginal* good for *that view* than the millionth pound on your top cause, but that ignores:
          *   **The Actual Moral Cost:** If the view *is* wrong (as you believe), that £1 actively causes harm or supports evil.
          *   **The Massive Opportunity Cost:** That £1 could do vastly more good spent on a cause you believe is 99.9% likely to be right and important. The "hedge ratio" prioritises minimising *variance* in a narrow mathematical sense over maximising *expected value*, which is irrational when credences are extreme.
      *   **Violates Instrumental Rationality:** An agent with 99.9% credence in View A and 0.1% in View B *should* act almost exclusively on View A, unless View B's potential downside if true is catastrophic *and* acting on A risks triggering it. The "hedge ratio" ignores this basic decision theory.
      *   **Why it Looks Fine:** It *seems* like pure "risk aversion" applied morally. But risk aversion applies to *outcomes*, not to giving resources to beliefs you think are certainly false. It confuses spreading resources *across projects with uncertain payoffs* (sensible) with spreading resources *proportionally to every conceivable moral claimant regardless of validity* (madness).

  3.  **Step (6) is the Predictable (and Mad) Conclusion:** (6a) and (6c) follow directly from the flawed premises of (3) and (5). (6b) is a separate overcorrection – sensible risk management doesn't mean *never* taking high-variance bets if the expected value is sufficiently high and you can tolerate the downside.

  ### Which Step to Reject & The Cost
  *   **Primary Rejection: Steps (3), (4), and (5).** The core analogy between interpersonal compromise over shared resources and intrapersonal moral uncertainty is invalid. Credences *must* dominate allocation under moral uncertainty, moderated by risk aversion/variance concerns, not displaced by a mechanical "hedge ratio".
      *   **Cost:** You lose the beautifully clean, symmetrical story Dev built. You have to accept that "compromise is often a genuine gain" (interpersonal) and "don't give resources to views you're certain are false" (intrapersonal) are *different* principles operating in *different* domains. The world is messier.
  *   **Secondary Rejection: The extreme interpretation of (6b).** Never taking high-variance bets is excessive.
      *   **Cost:** None, really. Sensible risk management is good, but blanket rules are bad.

  ### Salvaging the Split-Surplus Lemma & Sensible Moral Hedging
  You absolutely **do not** have to choose between keeping (1)/(2) and rejecting (6a/6c). Here's how to preserve the valuable insights:

  1.  **Keep Interpersonal Compromise (Steps 1 & 2):** This is rock solid. For shared resources where parties have legitimate (even if disputed) claims, concavity means compromise often creates surplus *regardless* of who is "more right". Disagreement intensity *can* signal potential gains. This is powerful for negotiations.
  2.  **Refine Moral Uncertainty (Reject Strict Analogy):**
      *   **Credence is King (mostly):** Allocate effort based on *expected choice-worthiness* (Credence * Choice-Worthiness if True).
      *   **Incorporate Concavity/Risk Aversion:** This is where Dev *almost* had a point, but misapplied it.
          *   **Variance Matters:** If two views have similar expected choice-worthiness, but one has much higher variance (e.g., speculative long-shot vs. proven intervention), a risk-averse agent might slightly favour the lower-variance option. **This is probability-sensitive hedging.**
          *   **Diminishing Marginal Returns:** If the "output" of resources spent on a *specific cause* (e.g., malaria nets) is concave *and* you have significant uncertainty about *which cause is best*, then *within your overall moral portfolio*, it *can* be rational to diversify across causes you assign non-negligible credence to, *even if one has slightly higher EV*, to avoid over-concentration and diminishing returns. **But:**
              *   This is **not** giving a fixed slice to *every* view "anyone takes seriously".
              *   It **requires non-trivial credence** (e.g., >1%, maybe >5-10% depending on stakes). A 0.1% view gets virtually nothing.
              *   It's driven by **efficiency** (maximising expected impact given concavity) not an abstract "fairness" to the view itself. You wouldn't fund a cause you believe is net harmful.
      *   **"Moral Compromise" with Monsters?** No. The interpersonal lemma assumes *both parties have some legitimacy*. Compromise with someone advocating the genuinely monstrous, over a resource *you control*, isn't required by concavity. Refusing isn't "irrational risk aversion"; it's upholding a core value. The surplus only exists if the *outcomes* of both options are acceptable enough that splitting is preferable to conflict. Monstrous outcomes fail this test. Concavity can't force you to do evil.

  ### The Bottom Line
  *   **Reject:** The core analogy (Step 3) and the credence-free "hedge ratio" (Step 5). This costs you a neat theoretical unified field theory of compromise/uncertainty, but saves you from madness.
  *   **Keep:** The powerful interpersonal split-surplus lemma (Steps 1 & 2). It's invaluable for real-world negotiation.
  *   **Refine:** Moral uncertainty requires balancing expected choice-worthiness (credence * value) with risk aversion and the potential for diminishing marginal returns *within causes*. This might lead to *some* probability-sensitive diversification, but **never** fixed slices for views you deem certainly false or monstrous.
  *   **Avoid Extremes:** Don't bet the farm recklessly (6b is *overly* strict), but also never feel compelled to "compromise" with evil (6c is wrong) or honour garbage views (6a is bonkers).

  Dev's mistake was taking a brilliant tool for one job (negotiating shared pies) and trying to use it for a completely different job (deciding your own moral path), stripping out the crucial element of *belief*. Keep the tool, use it where it works, and trust your instincts that giving Nazis a "standing slice" is not just mad, but morally bankrupt – concavity be damned. The split-surplus lemma survives intact for compromises between legitimate claimants; it doesn't mandate moral capitulation.
