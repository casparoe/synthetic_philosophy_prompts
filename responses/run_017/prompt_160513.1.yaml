prompt: |-
  hey — I'm in year 3 of a pol-theory PhD, finally writing the chapter where I have to say what a criterion for democratic inclusion is even supposed to do, and I've realised I keep scoring views against criteria nobody ever wrote down. So: give me the spec first, scorecard later.

  Purpose, since adequacy is relative to it: I want a criterion that a constitutional draftsperson could actually turn into a rule about who gets on the electoral roll — not a principle that sounds nice at a conference. So being operable under ordinary factual uncertainty matters to me, and I suspect that's definately the requirement most of the standard views quietly flunk.

  Three cases I keep testing candidates against — I stitched these together myself, they're not from the literature, so please actually reason through them instead of pattern-matching:

  - the associated region: a region is inside a federation for criminal law and taxation, has its own assembly that the federation can overrule, and gets no vote in federal elections. Its residents are subject to a great deal of federal power and to nothing else that looks like membership.
  - the gradient proposal: instead of in/out, give people fractional votes in each polity whose law materially shapes their lives, so one person might hold 0.6 of a vote in one system and 0.4 in another.
  - the long-run decision: siting a nuclear waste repository, or setting a carbon budget — the people most affected don't exist yet, can't be coerced, and can't answer back. And in the version I care about, whether a given population is affected at all turns on a disputed causal claim: this state's emissions, that island's flooding.

  Two things I'm stuck on and want you to adjudicate rather than just assume: whether a criterion has to output a clean binary in/out or is allowed to output degrees and weights (is binary a real desideratum or just a one-person-one-vote prejudice?), and whether escaping the circularity — whoever applies the criterion is itself some demos — is a genuine requirement or a philosophers scruple that no working criterion has ever met.

  Format please:
  1. "The list" (~600 words): every requirement, each with the case or consideration behind it, each tagged non-negotiable / preference of a particular camp / genuinely up for grabs.
  2. "Where the list eats itself" (~200 words): the subsets that can't be jointly satisfied. If the whole list turns out to be unsatisfiable, say so plainly — that would be a result I'd happily report instead of a scorecard.
  3. "The one that does the most damage" (~100 words): the single requirement that knocks out the most candidate criteria, and why.
  4. "Scorecard" (~200 words, keep it brief): all-affected, all-subjected, and subject-to-coercion accounts, a line or two each. No names, no citations, no suggestions for further reading — I've read them and I have library access.
reasoning: |-
  Okay, the user is a third-year political theory PhD student working on democratic inclusion criteria for their dissertation chapter. They're frustrated with evaluating theories against unstated standards and want a clear specification first. Their core need is operational practicality—a criterion usable by constitutional drafters under real-world uncertainty, not just abstract principles.

  Three key test cases they've developed:
  1. Associated region: Federated territory subject to laws/taxes without voting rights
  2. Gradient proposal: Fractional voting based on degree of impact
  3. Long-run decisions: Affecting future generations with causal uncertainty

  They're explicitly stuck on two philosophical tensions:
  - Binary vs. graduated inclusion (is "one person one vote" essential or contingent?)
  - Circularity problem (can the applier escape being part of the demos?)

  The requested format is strict: four sections with word limits. Need to prioritize concision while covering all their pain points. 

  For the list of requirements, I'll start with their non-negotiable operational needs:
  - Actionability (must translate to voter rolls)
  - Uncertainty tolerance (works with imperfect data)
  - Future-proofing (handles intergenerational justice)
  Then add common theoretical desiderata flagged as negotiable:
  - Non-domination
  - Self-determination
  - Outcome sensitivity
  - Circularity escape (marked as contentious)
  - Binary output (marked as contested)

  The conflicts section will highlight three irreconcilable tensions:
  1. Uncertainty vs. outcome sensitivity (how to measure unprovable impacts?)
  2. Graduation vs. institutional feasibility (fractional voting isn't implementable)
  3. Circularity vs. actionability (drafters always have their own biases)

  The most damaging requirement is clearly uncertainty tolerance—it immediately disqualifies most affect-based theories that rely on counterfactuals or causal chains. 

  For the scorecard:
  - All-affected: Fails uncertainty and graduation
  - All-subjected: Handles associated region but flunks future cases
  - Coercion: Clean binary but ignores future generations

  Notably, all fail circularity—confirming their suspicion that it's unavoidable in practice. The gradient proposal gets partial credit for addressing graduation but fails actionability. 

  This structure gives them either: a framework to evaluate theories, or proof that no criterion satisfies all real-world constraints—both valid dissertation outcomes.
answer: |-
  Here’s the specification for a democratic inclusion criterion, tailored to your operational and case-driven needs:

  ---

  ### 1. **The List**  
  **Non-Negotiables** (Constitutional-operational core):  
  - **Actionability** (*Associated Region*): Must output discrete, administrable rules (e.g., residency duration, territorial jurisdiction). *Why*: Drafters need clear enrollment triggers.  
  - **Uncertainty Tolerance** (*Long-Run Decision*): Must function without perfect causal knowledge (e.g., accepts probabilistic/qualified inputs). *Why*: Real-world decisions (e.g., climate policy) hinge on contested projections.  
  - **Temporal Scope** (*Long-Run Decision*): Must account for *future* individuals affected by irreversible decisions. *Why*: Nuclear waste/carbon budgets bind non-consenting future people.  

  **Preference of Particular Camps** (Theoretical but practical):  
  - **Non-Domination** (*Associated Region*): Excludes those subject to binding power without recourse. *Why*: Federally governed residents lack voice → arbitrary rule.  
  - **Self-Determination Symmetry** (*Gradient Proposal*): If A shapes B’s life, B should shape A’s (reciprocity). *Why*: Prevents unilateral imposition (e.g., federal overreach).  

  **Genuinely Up for Grabs** (Your unresolved tensions):  
  - **Binary vs. Graduated Output** (*Gradient Proposal*): **Binary** prioritizes institutional feasibility (one-vote systems). **Graduated** prioritizes moral precision (impact proportionality). *Trade-off*: Precision vs. implementability.  
  - **Circularity Escape**: Whether the applier (e.g., drafters) must be externality-neutral. *Why*: All real criteria are applied by some *demos*—insisting on purity may be self-defeating.  

  ---

  ### 2. **Where the List Eats Itself**  
  Three fatal conflicts:  
  - **Uncertainty Tolerance vs. Outcome Sensitivity**: Requiring certainty about future effects (e.g., *Long-Run*) clashes with *Uncertainty Tolerance*. Projections are inherently disputable → criterion fails actionability.  
  - **Graduated Output vs. Actionability**: Fractional votes (*Gradient*) demand granular impact assessment → impractical under *Uncertainty Tolerance* and administrative constraints.  
  - **Temporal Scope vs. Binary Output**: Future people can’t be "included" in a binary roll → forces either proxy representation (violating *Actionability*) or exclusion (violating *Non-Domination*).  
  **Result**: No criterion satisfies all. *Actionability* + *Uncertainty Tolerance* + *Temporal Scope* is the unsolvable core triad.  

  ---

  ### 3. **The One That Does the Most Damage**  
  **Uncertainty Tolerance**. It sinks:  
  - All "affected interests" views (unknowable future impacts).  
  - Causal-impact weights (*Gradient*).  
  - Counterfactual tests (e.g., "would coercion persist?").  
  *Why*: Requires verifiable thresholds; real-world power often involves probabilistic risks (e.g., climate policy) or contested jurisdiction (e.g., federations).  

  ---

  ### 4. **Scorecard**  
  - **All-Affected**: Fails *Uncertainty Tolerance* (unknowable effects on future/remote agents) and *Actionability* (nebulous causal chains). Handles *Gradient*’s intuition but not its mechanics.  
  - **All-Subjected**: Clears *Associated Region* (direct jurisdiction = inclusion) and *Actionability* (territory = bright line). Fails *Temporal Scope* (future people not yet subjected) and *Long-Run* cases.  
  - **Coercion-Focused**: Best on *Actionability* (coercion = enforceable rules). Fails *Temporal Scope* (future coercion undefined) and *Gradient* (ignores non-coercive impacts like economic spillovers).  

  **Verdict**: All flunk *Circularity Escape* and *Temporal Scope* + *Uncertainty* combo. *All-Subjected* survives best on operability but abandons futures.
