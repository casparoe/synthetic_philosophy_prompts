  The user's hunches aren't distractions—they reveal architectural shifts that reshape moral questions. "Rollout-level welfare" could inform compute-aware ethical accounting, making it a leverage point for institutional tools. 

  Ranking: 1) Institutional pathways (immediate impact), 2) Architecture-aware metaphysics (upstream but concrete), 3) Consciousness markers (speculative but monitor). 

