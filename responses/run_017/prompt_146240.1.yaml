answer: |-
  **MEMORANDUM**  
  **TO:** Voss Prize Fiction Jury  
  **FROM:** [Your Name], Jury Member  
  **SUBJECT:** Recommended Decision Rule for 2025 Voss Prize Winner  
  **DATE:** October 25, 2025  

  ### Bottom Line Up Front  
  After rigorous analysis, I recommend we adopt a **grading system (median grade wins)** for selecting the winner. Each juror assigns every finalist a letter grade (A=Excellent, B=Good, C=Fair, D=Poor, F=Unacceptable) based on merit, not ranking. The book with the highest median grade wins. Ties are broken by the highest average grade. This system best accommodates preference intensity, minimizes strategic voting in small groups, and cleanly handles plagiarism-related withdrawals. For 2025’s deadlock, we should hold a revote using this method during Sunday’s call. If ties persist, we default to moderated deliberation to build consensus.  

  ---

  ### The Problem: Arrow’s Theorem and Our Messy Reality  
  As you know, our ranked ballots produced a perfect cycle: Salt Year beats Understudy 4–2, Understudy beats Winter 4–2, and Winter beats Salt Year 4–2. All three books have identical first-place votes (2), second-place votes (2), and last-place votes (2). Borda counts tie at 6 points. This is a textbook example of **Arrow’s Impossibility Theorem**, which proves no ranked voting system can satisfy all four fairness criteria:  
  1. **Unrestricted Domain**: Any voter preferences are allowed.  
  2. **Pareto Efficiency**: If all voters prefer X over Y, Y cannot win.  
  3. **Independence of Irrelevant Alternatives (IIA)**: Adding/removing a non-winning book shouldn’t change the winner.  
  4. **Non-Dictatorship**: No single juror decides the outcome.  

  Our cycle violates IIA by default—removing any book changes pairwise outcomes—and no ranked system escapes Arrow’s curse. Worse, we have **intensity imbalances**: Salt Year’s top supporters are indifferent between Understudy and Winter, while Winter’s champions strongly dislike Understudy. Ranked systems ignore this, wasting critical information. We also face **strategic voting risks** (jurors misranking books to manipulate outcomes) and **plagiarism uncertainty** (a finalist may withdraw post-vote).  

  Below, I evaluate all proposed systems against Arrow’s conditions, strategic voting, intensity, withdrawals, and practicality. The grading system outperforms others, but I explain all options transparently for debate.  

  ---

  ### System 1: Plurality (First-Place Votes Only)  
  - **How it works**: Count only first-place votes. Winner has most.  
  - **2025 outcome**: 2–2–2 tie.  
  - **Arrow violations**: Fails IIA (e.g., removing Winter might shift votes to Salt Year or Understudy, changing the winner).  
  - **Strategic voting**: High risk. Jurors could demote a strong rival to boost their favorite (e.g., a Winter supporter ranks Understudy last to avoid splitting votes).  
  - **Intensity**: Ignores it completely—Winter’s strong dislike for Understudy isn’t captured.  
  - **Withdrawals**: If a book withdraws, revote or reinterpret ballots. Winner could flip (e.g., removing Winter might give Salt Year 4 first-place votes).  
  - **Verdict**: Worst option. Fails all criteria except non-dictatorship.  

  ### System 2: Instant Runoff (IRV) with Tie-Break  
  - **How it works**: Eliminate the book with fewest first-place votes; redistribute votes until one wins. Tie-break: Chair picks elimination order.  
  - **2025 outcome**: All books have 2 first-place votes. If chair eliminates Winter first, Salt Year beats Understudy 4–2. If chair eliminates Salt Year first, Understudy beats Winter 4–2.  
  - **Arrow violations**: Violates IIA (elimination order changes outcomes).  
  - **Strategic voting**: High risk. Jurors can insincerely rank weak rivals higher to block strong ones (e.g., Winter fans rank Salt Year second to ensure Understudy loses).  
  - **Intensity**: No mechanism to capture it.  
  - **Withdrawals**: Removing a book alters runoff dynamics (e.g., withdrawing Understudy lets Winter win).  
  - **Chair’s order proposal**: Chair bias invites manipulation and violates non-dictatorship lite. Pre-committing to a fixed elimination order (e.g., "Always eliminate alphabetically first") removes chair bias but still violates IIA and ignores intensity.  
  - **Verdict**: Unworkable for us—too arbitrary and manipulable.  

  ### System 3: Borda Count  
  - **How it works**: Assign points (2 for 1st, 1 for 2nd, 0 for 3rd). Highest total wins.  
  - **2025 outcome**: All books score 6—tie.  
  - **Arrow violations**: Violates IIA (adding a fourth book could distort rankings).  
  - **Strategic voting**: Extreme risk. Jurors can tank strong rivals (e.g., Understudy’s fans rank Winter last to depress its score). In a six-person room, ballots are visible, incentivizing tactical voting.  
  - **Intensity**: Roughly captures order but not strength (e.g., Winter’s hatred for Understudy is scored the same as Salt’s indifference).  
  - **Withdrawals**: Removing a book forces reweighting points, likely flipping the winner (e.g., removing Winter gives Salt Year 6 points, Understudy 4—Salt wins).  
  - **Verdict**: Unsuitable—guarantees a tie here and amplifies strategy.  

  ### System 4: Pairwise Comparisons with Fixed Elimination Order  
  - **How it works**: Pre-commit to an order (e.g., compare Book A vs. B first, winner vs. C). Winner of last pairing wins.  
  - **2025 outcome**: Order matters. If we pit Salt Year vs. Understudy first (Salt wins 4–2), then Salt vs. Winter (Winter wins 4–2), Winter wins. If order starts with Understudy vs. Winter (Understudy wins 4–2), then Understudy vs. Salt (Salt wins 4–2), Salt wins.  
  - **Arrow violations**: Violates IIA (order choice changes outcomes).  
  - **Strategic voting**: Moderate risk. Jurors might misrank books to influence earlier matchups.  
  - **Intensity**: Ignored.  
  - **Withdrawals**: If a book withdraws, apply the order to the remaining two. Winner may change unpredictably.  
  - **Pre-commit proposal**: Fixing the order in bylaws (e.g., "Compare by publication date oldest to newest") removes chair bias but remains arbitrary and violates IIA. It "solves" manipulation only if voters don’t know the order—but in practice, they will adjust rankings once shortlists are public.  
  - **Verdict**: Better than chair discretion but still unfair—intensity ignored, IIA violated.  

  ### System 5: Grading System (Median Grade Wins)  
  - **How it works**: Jurors assign each book a grade (A=4, B=3, C=2, D=1, F=0) based on absolute merit. Highest median grade wins. Tie-break: Highest average grade.  
  - **2025 outcome (simulated)**:  
    - Salt Year: Jurors 1–2 (A), Jurors 3–4 (C), Jurors 5–6 (B) → Grades: [A, A, C, C, B, B] → Sorted: [B, B, C, C, A, A] → Median = C (2.0).  
    - Understudy: Jurors 1–2 (B), Jurors 3–4 (A), Jurors 5–6 (F) → Grades: [B, B, A, A, F, F] → Sorted: [F, F, B, B, A, A] → Median = B (3.0).  
    - Winter: Jurors 1–2 (C), Jurors 3–4 (B), Jurors 5–6 (A) → Grades: [C, C, B, B, A, A] → Sorted: [C, C, B, B, A, A] → Median = B (3.0).  
    - **Understudy wins on median (B vs. C)**. Tie-break: Understudy avg = 2.33, Winter avg = 2.33—still tied, but Winter’s supporters loathe Understudy (F grades), so deliberation might resolve.  
  - **Arrow violations**: Not applicable—Arrow assumes rankings, not cardinal grades. Pareto and non-dictatorship hold; IIA is partially satisfied (grades are book-specific, so removing non-winner rarely affects others).  
  - **Strategic voting**: Low risk. Jurors can’t easily game medians (extreme grades are ignored). Small groups reduce anonymity, but grading is less manipulable than ranking.  
  - **Intensity**: Captured! Winter’s fans assign Understudy F, expressing their intensity. Salt’s indifference shows in moderate grades.  
  - **Withdrawals**: Remove the withdrawn book’s grades; recalc medians for remaining books. Winner changes only if withdrawn book won—satisfies IIA in spirit.  
  - **Verdict**: Best option. Uses our intensity data, minimizes strategy, and handles withdrawals cleanly.  

  ---

  ### The Deliberation or Randomization Alternatives  
  - **Structured Deliberation**: Abandon voting; discuss to consensus. Preferences evolve, avoiding Arrow’s constraints. But it’s time-consuming, risks groupthink, and may disadvantage quieter jurors. If we try this, set rules: 20-minute case for each book, secret straw poll after.  
  - **Random Selection**: Flip a coin. Mathematically fairest in a true tie but undermines the prize’s credibility. Only use as last resort.  

  ### Recommendation and Next Steps  
  Adopt the **grading system** immediately:  
  1. **For 2025**: During Sunday’s call, hold a revote. Each juror assigns grades (A–F) to all three books. Compute medians and averages live.  
  2. **For future years**: Embed this in bylaws. Define the scale clearly (e.g., A = "Prize-worthy," F = "Not competitive").  
  3. **Plagiarism protocol**: If a book withdraws after voting, exclude its grades and recalc. If the winner is disqualified, the prize rolls to the runner-up (based on original grades).  
  4. **Tie-breakers**: Highest median → highest average → deliberation.  

  This system respects preference intensity, avoids ranking paradoxes, and is auditable. Yes, no system is perfect—grading violates Arrow’s IIA if grades shift based on the shortlist—but it’s the least flawed for our needs. It also forces us to evaluate books on absolute merit, not just comparisons.  

  If opponents resist, remind them: Arrow’s theorem means all ranked systems will fail us. Grading embraces our human judgments without illusion. Let’s vote on Sunday—and may the best book win.  

  **APPENDIX: Quick Reference for Sunday’s Call**  
  - **Step 1**: Revote with grades (A=4, B=3, C=2, D=1, F=0).  
  - **Step 2**: Calculate medians. Highest wins.  
  - **Step 3**: If tie, highest average wins.  
  - **Step 4**: If still tied, 20-minute moderated deliberation, then revote.  
  - **Contingency**: If plagiarism forces withdrawal, exclude that book and recompute.
