  ## Sestina: Article Five

  The gavel falls, the first decree takes **rule**,
  Inscribed in ink where silence held the ground.
  A careful clause allows you to **amend**,
  To shift the weight where precedent was found,
  Or strike the text that circumstance made **void**.
  The core, they say, must steadfastly **remain**.

  But power shifts; old certainties **remain**
  Less absolute than first conceived. The **rule**
  That built the scaffold risks being **void**
  If newer voices, gathering on the ground
  Of shifting need, demand we **amend**
  The very path by which we **amend**.

  So whispers rise: why not profoundly **amend**
  The sacred text that lets all changes **remain**?
  Propose a shift within the central **rule**,
  Alter the gears that turn on common **ground**.
  Let one bold vote possess the strength to **void**
  The gate itself – a paradox deployed.

  *(Proposed Amendment: Stanza)*
  Whereas the method may itself be **void**
  Of future grace, we hereby **amend**:
  The sixth word shifts where once '**void**' did **remain**,
  Now '**repeal**' stands where '**amend**' held its **rule**.
  Let ink confirm this change upon the **ground**
  That words have weight when properly employed.

  *(Stanzas Resume Under New Order)*
  The scribe records, though doubt clouds the **ground**.
  Can structure bend so far without **remain**-
  dered trust? Did we transgress the ancient **rule**
  By altering the means to **amend**?
  The altered text now waits, a silent **void**
  Or fertile field? The future's unalloyed.

  To challenge it invites a chilling **void**,
  A silent gap where reason stood its **ground**.
  If this new path is true, how to **amend**
  Itself again? What principles **remain**
  To anchor sense? Or does the deepest **rule**
  Now state: *All change obeys the final vote*?

  The chamber holds its breath before the **vote**.
  Was the procedure flawed, the change made **void**
  Before it breathed? Or does its power **remain**,
  A lawful shift upon contested **ground**?
  The Speaker scans the lines, the altered **rule**,
  Uncertain if they can still **amend**.

  Can words **amend** their own creating source?
  The final **vote** confirms a path, or **void**.
  Does structure **remain**, or **rule** unbound?

  ---

  **Envoy**

  The parchment bears the mark, the shifted **rule**,
  The Speaker's gavel poised: was it sound?
  The path to **amend** now changed by that **vote**,
  Does the old core **remain**, or stand **void**?
  A shadow falls across the solid **ground**,
  This new word's power: does it **remain**?
