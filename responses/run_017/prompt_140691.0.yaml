prompt: |-
  hi — I chair the restitution working group at the Fennimore University Museum (small teaching museum, about 400 objects with colonial-era provenance gaps). We have to bring a recommendation to the trustees in March and I'd really like a draft memo to circulate, because right now the group is going in circles.

  The case: a carved wood and pigment memorial effigy, roughly a metre tall, accessioned in 1947 but collected in 1899 by a colonial district officer during a punitive expedition against the Okwei. It commemorates a war leader, and — this is the bit I keep coming back to — it was made to be impermanent. Figures of this kind were left at a grave site and allowed to weather away as part of the commemoration; they weren't meant to last. Our conservation file says it was consolidated with a synthetic resin and put on a steel armature in 1972, and the base was cut down to fit a display case. So the thing we'd be handing over is preserved in a way its makers apparently didn't intend, and it will never decay now.

  Three claims, and they conflict:
  - The Okwei Heritage Council, speaking through the current Keeper of the Grove, wants it returned to be 'retired' — put back in the grove, allowed to weather, no display, no photography. Complication: our 1899 records describe that office as male-only and the current Keeper is a woman, and one trustee has started using this to argue her claim is a modern invention. I think that's a bad argument but I can't quite say why.
  - A community museum committee, partly diaspora-funded, wants it back and on display locally. They've been explicit that the tourism income matters and that young people should be able to see it.
  - The national museum in the capital claims it under Ndara's heritage law and would show it there. There's a decent chance it's the only legally recognised recipient.

  Legal snag: under our state's rules we can basically only deaccession to another public institution, and we can't transfer anything we have reason to think will be destroyed. Our lawyer says a transfer to the Council is probably a non-starter and has floated two workarounds — transfer title to the Council but keep the object here on indefinite loan, or a rotating three-year cycle between us, the community museum and the capital.

  The group is split roughly down the middle on three things I want the memo to take a position on:

  (1) Is returning it while insisting on our own conditions (climate control, no ritual handling, full documentation) actually restitution, or just guardianship with better PR? My instinct is that the conditions quietly reassert the museum's authority — but I also can't shake the feeling that letting a 120-year-old carving rot is something future Okwei kids might resent us for, and that irreversibility is a real cost rather than just a curator's squeamishness.

  (2) How do we handle the disagreement inside the Okwei claim without us effectively picking which Okwei count as authentic? Is there a way to structure this so we're deferring rather than arbitrating, or is that just a way of hiding that we're arbitrating?

  (3) Does it matter that the object's being here is part of why there's a tourist economy and a diaspora committee with views about display at all? One of our curators says yes — so the display faction's preferences are partly our own creation and shouldn't work as a neutral tiebreaker. Someone else says that's condescending, and I'm not sure they're wrong.

  Also: we hold three more objects from the same 1899 expedition. The Council has said it does not want two of them back, since they belong to a cult the community abandoned. I don't want a memo that quietly commits us to returning all of them or none of them, and I don't want a principle that lets us keep things because a community declined them.

  What I need is a memo with a bottom line the trustees could actually vote on — who gets what, on what conditions, on what timeline, and what happens to the other three — plus the reasoning. And please give the strongest version of whichever position you're not recommending; I definitely know which side I want to win and I need to be able to argue with myself about it in the meeting. Say so if you think the frame of the question is wrong.
reasoning: |-
  Okay, the user chairs a restitution working group at a small university museum and needs help drafting a memo for the trustees. They're dealing with a complex case involving a memorial effigy from the Okwei people, collected during a punitive expedition in 1899. There are three conflicting claims: the Okwei Heritage Council wants it returned for ritual decay, a community museum wants it for display and tourism, and the national museum claims legal rights under heritage law. 

  The user's memo needs to resolve several dilemmas: whether imposing conservation conditions undermines restitution, how to handle internal Okwei disagreements without arbitrating legitimacy, and whether the museum's past display influenced current stakeholder preferences. They also need to address three other objects from the same expedition that the Council doesn't want back.

  The user seems ethically aware but frustrated by the committee's circular debates. They need concrete recommendations with clear reasoning, while acknowledging counterarguments. Their unspoken need might be validation that prioritizing ethical restitution over legal technicalities is defensible, despite institutional pressures.

  Hmm... the conservation history adds philosophical weight—the object was altered against its intended impermanence. The gender-based challenge to the Keeper's authority feels like a colonial hangover; the user intuitively knows this but needs framing to rebut it. The lawyer's "workarounds" risk perpetuating control, which clashes with restitution's spirit.

  For the memo structure, I'll propose:
  - A definitive recommendation to transfer to the Okwei Heritage Council with minimal conditions
  - Parallel transfer of the unwanted objects to the national museum
  - Transparent reasoning that names trade-offs
  - Strong counterarguments for the user to prep against

  The key is centering Okwei sovereignty: their right to determine the object's fate matters more than preservation ethics or tourism economics. The national museum's legal claim is secondary to community agency. For the gender challenge, emphasizing cultural dynamism shuts down the "inauthenticity" argument. 

  On conservation concerns: future Okwei generations might value the choice more than the object's survival. The diaspora committee's display preference, while valid, doesn't override ritual practice. The museum's role in creating tourism doesn't obligate perpetual display—that's a colonial guilt trap.

  For the other objects: transferring the unwanted ones to the national museum respects the Council's specificity. Keeping them would be paternalistic. 

  This approach risks legal friction, but the user seems prepared to advocate for ethical over legal compliance. The memo must model that courage.
answer: |-
  Here’s a draft memo for your working group, structured to provide clear recommendations while acknowledging complexities. The recommended position centers **ethical restitution over legal convenience**, but includes strong counterarguments for robust discussion.

  ---

  **MEMORANDUM**  
  **To:** Fennimore University Museum Restitution Working Group  
  **From:** [Your Name], Chair  
  **Date:** [Draft Date]  
  **Subject:** Recommendation for Restitution of Okwei Memorial Effigy & Associated Objects  

  ### I. Executive Summary  
  We recommend **unconditional transfer of the memorial effigy to the Okwei Heritage Council for ritual retirement**, despite legal and preservation challenges. For the three additional objects from the 1899 expedition: **transfer two unwanted objects to the Ndara National Museum** (per their claim), and **retain one** (if unclaimed). We reject conditional returns or rotating custody as incompatible with restorative justice.  

  ### II. Background & Key Facts  
  - **Object:** Okwei memorial effigy (accessioned 1947, collected 1899).  
  - **Provenance:** Acquired during a punitive colonial expedition.  
  - **Significance:** Ritually impermanent; altered by museum (resin, armature, base cut).  
  - **Claims:**  
    1. **Okwei Heritage Council (OHC):** Requests return for decay in the grove (no display/docs).  
    2. **Community Museum Committee (CMC):** Seeks display for tourism/education.  
    3. **Ndara National Museum (NNM):** Claims under heritage law; offers public display.  
  - **Legal Constraint:** State law bars deaccession to non-institutions or if destruction is likely.  

  ### III. Recommended Resolution  
  | **Object** | **Recipient** | **Conditions** | **Timeline** |  
  |------------|---------------|----------------|--------------|  
  | Memorial Effigy | Okwei Heritage Council | None. Transfer irrevocable. | Immediate (pre-March). |  
  | 2 Unclaimed Objects | Ndara National Museum | Standard transfer agreement. | Within 6 months. |  
  | 1 Retained Object | Fennimore Museum | Reevaluate if claimants emerge. | N/A |  

  #### **Reasoning for Effigy Transfer to OHC:**  
  1. **Ethical Imperative:** The object was taken violently; its return is reparative, not curatorial.  
  2. **Respect for Intent:** Impermanence is core to its meaning. Our preservation violated this; we don’t compound the harm by imposing permanence.  
  3. **OHC Legitimacy:** The Keeper’s gender is irrelevant. Cultural offices evolve; our 1899 records reflect colonial bias, not Okwei law.  
  4. **Legal Workaround:** Transfer title to OHC, then facilitate *their* loan to NNM or CMC **if OHC consents**. Do not precondition return.  

  #### **Handling Internal Okwei Divergence:**  
  - **Do not arbitrate.** State: *"The Museum defers to the OHC as the culturally recognized authority. Disagreements within the Okwei community are sovereign matters."*  
  - **Mitigation:** Offer mediation funding for Okwei parties to negotiate internally post-return.  

  #### **Other Objects:**  
  - Transfer NNM-claimed objects to honor heritage law and OHC’s explicit disinterest.  
  - Retaining unclaimed objects avoids imposing unwanted returns; reassess if new claims arise.  

  ### IV. Addressing Working Group Splits  
  #### **(1) "Conditional Return vs. True Restitution"**  
  - **Recommendation:** Unconditional return.  
    - *Why:* Conditions (climate control, no handling) replicate colonial control. Future Okwei generations deserve agency over their heritage—even to "lose" it.  
    - **Counterargument (Preservationist View):**  
      > *"Irreversible destruction negates the object’s value as evidence of violence and artistry. Our duty is to preserve for global humanity. Compromise: Return after 3D documentation, or transfer to NNM where decay is slowed but Okwei access is guaranteed."*  

  #### **(2) "Avoiding Arbitration of Okwei Legitimacy"**  
  - **Recommendation:** Defer to OHC without caveats.  
    - *Why:* Colonial institutions lack standing to validate cultural authority. OHC’s claim is consistent with traditional structures.  
    - **Counterargument (Pluralist View):**  
      > *"Ignoring diaspora/CMC voices privileges one faction. Rotating custody shares access and acknowledges multiple Okwei perspectives. We risk endorsing an exclusionary hierarchy."*  

  #### **(3) "Museum’s Role in Creating Stakeholders"**  
  - **Recommendation:** Irrelevant to restitution.  
    - *Why:* Tourism/diaspora engagement arose *despite* injustice, not because of it. Using this to deny OHC’s claim instrumentalizes trauma.  
    - **Counterargument (Pragmatic View):**  
      > *"Our display fostered cultural revival; destroying the effigy wastes this opportunity. The CMC’s plan benefits living Okwei economically. Restitution isn’t zero-sum: NNM display honors heritage while sharing it."*  

  ### V. Risks & Mitigation  
  - **Legal Risk:** State may block OHC transfer.  
    *Mitigation:* Lobby trustees to challenge state rules; prepare to sue or transfer to NNM with OHC’s blessing.  
  - **Object Deterioration:** If OHC retires effigy.  
    *Mitigation:* Accept this outcome; document process with OHC consent if offered.  
  - **Community Discord:** Okwei factions clash post-return.  
    *Mitigation:* Fund dialogue; clarify the museum’s role ends at transfer.  

  ### VI. Bottom Line for Trustees  
  **Vote Recommendation:**  
  *"Approve unconditional title transfer of the memorial effigy to the Okwei Heritage Council. Transfer two unclaimed 1899 objects to the Ndara National Museum. Retain one object pending future claims."*  

  ---

  ### Why This Frame Matters
  **The core question isn’t "Who gets the object?" but "How do we end our authority over it?"** Legal compromises (loans, rotation) extend museum control. True restitution cedes power—even when uncomfortable. The effigy’s altered state doesn’t negate Okwei rights; it underscores our interference.  

  **Strongest Counterproposal (for debate):**  
  > *"Transfer the effigy to the Ndara National Museum unconditionally. It complies with heritage law, ensures preservation, and serves all Okwei (OHC can access it; CMC/NNM display it). OHC’s retirement plan is unsustainable idealism; our duty is to history, not ritual."*  

  ---  
  **Next Steps:** Circulate this draft. Request working group members articulate their preferred position *using this structure* by [date]. We’ll finalize by [date] for March trustee submission.
