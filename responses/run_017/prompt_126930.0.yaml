  | 3. **The novel sensory channel test: interpretation of results** | If System S shows better tracking, it confirms that sensorimotor grounding improves the system's ability to hook symbols to the world. If they track equally, it might be because the test is not sensitive enough or because the novel channel is being processed linguistically in both. | If both systems track equally, it confirms that grounding is achieved by functional role. If System S is better, it would be a surprise, but B would argue that the difference is due to the additional data (which is linguistic in nature) and not non-linguistic grounding. | Both agree that if System S is better, it supports A; if equal, it supports B. But they have different interpretations of what equal performance would mean. |
  | 4. **How much of a competent adult's vocabulary is ungrounded?** | A large portion (e.g., words for abstract concepts, historical events) is ungrounded by the sensorimotor criterion. These words are anchored only via causal chains to grounded uses. This is not a reductio but a fact about language: much of our language is parasitic on grounded core vocabulary. | Almost all of an adult's vocabulary is grounded because each word plays a functional role in inference and use. The fact that we haven't directly experienced everything we talk about doesn't make the words ungrounded. To call it ungrounded would be a reductio of the sensorimotor view. | N/A (this is a conceptual point) |
