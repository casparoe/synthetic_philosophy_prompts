  We are drafting a joint statement between two philosophers after an adversarial collaboration on the symbol grounding problem.

  Philosopher A: Believes that a symbol is grounded only when the system has non-linguistic causal and sensorimotor contact with the referent. Thus, a text-only system has at best borrowed meaning.

  Philosopher B: Believes that meaning is fixed by a symbol's role in inference and use. A purely linguistic system can have grounded symbols if it satisfies the functional role.

  Agreed Section (both sign):

  1. **Reference is possible without direct perception**: Both agree that a system trained only on text can have tokens that refer to entities, events, or properties in the world. This reference is achieved through the same causal-historical chains that allow human speakers to refer to things they have never directly perceived (e.g., historical figures, abstract concepts, or distant galaxies).

  2. **The dispute is not about reference but about grounding**: The core disagreement is not whether reference occurs, but whether the symbols of a text-only system are grounded. Philosopher A holds that grounding requires non-linguistic causal and sensorimotor contact, while Philosopher B holds that grounding is achieved solely by the symbol's functional role in the system.

  3. **The test case of two systems**: Consider two systems:
     - System L (Linguistic): Trained only on text.
     - System S (Sensorimotor): Trained on the same text plus a synchronous, unlabelled stream of sensorimotor data from a body it controls.

     Both systems are indistinguishable in their linguistic behavior (i.e., they produce the same outputs given the same inputs).

  4. **Agreed fact about the test case**: Both agree that if System S's vocabulary is better anchored, it must be due to some difference in the systems that goes beyond their linguistic behavior. However, since they are behaviorally indistinguishable in language, any difference in grounding must be non-behavioral.

  5. **The novel sensory channel experiment**: Both accept the following test as bearing on the grounding question:
     - Give each system (L and S) live, unlabelled access to a genuinely novel sensory channel (e.g., a new type of sensor input that neither system has encountered before).
     - Let each system coin a new token for this sensory input.
     - Then, observe whether the subsequent use of that token in the system's language (e.g., in descriptions, inferences) tracks the state of the novel channel.

     Both agree that if one system's token use tracks the channel better than the other, it would be evidence for a difference in grounding.

  Disagreements Table:

  | Crux | Philosopher A's Position | Philosopher B's Position | Test/Prediction in the Novel Sensory Experiment |
  |------|--------------------------|--------------------------|------------------------------------------------|
  | 1. **What constitutes grounding?** | Grounding requires non-linguistic causal and sensorimotor contact. Without such contact, symbols are ungrounded and merely borrow meaning from grounded users. | Grounding is entirely a matter of the symbol's functional role in the system's inference and use. If the symbol plays the right role, it is grounded, regardless of sensorimotor contact. | Both will use the novel sensory channel test. |
