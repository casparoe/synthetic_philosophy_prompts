answer: |-
  ### Pascal's Mugging: Infra/ML Translation  
  **Core Problem**: Mugger claims "Pay $5 or I'll torture `N` people," where `N` is large. EV = `P(claim_true) * U(torture)`. If `U(torture)` scales as `e^N` (unbounded disutility) and `P(claim_true)` decays slower than `1/N` (e.g., `1/log(N)`), EV → `-∞`. Paying $5 dominates. The exploit: adversary can arbitrarily pump `N` to make EV calculation overflow to `-Inf` unless `P(claim)` decays fast enough.  

  **Fixes as Engineering Patterns**:  
  1. **Fast-Falling Prior (Complexity Regularization)**:  
     Treat `P(claim)` as `exp(-K(claim))`, where `K(claim)` is Kolmogorov complexity (bits to specify the threat). High `K` acts like L2 regularization: `P(claim)` decays exponentially with claim complexity, making `EV` converge. Adversary can't pump `N` without increasing `K`, so `P * U → 0`.  

  2. **Utility Bounding (Activation Function)**:  
     Cap `|U|` at a constant (e.g., `tanh(U)`). Now `EV` can't diverge. Alternatively, log-scale utilities: `U = log(happiness)`, preventing linear scaling. Fixes overflow but violates "linear moral weights" (type error if utilities are dimensionless?).  

  3. **Robustness (Minimax/Adversarial Defense)**:  
     Switch from average-case (EV) to worst-case. Ignore claims where `P(claim) < ε` (timeout/confidence threshold). Or, use a decision rule that's exploit-proof: "Never pay if `N > N_max`" (hardcoded rate limit).  

  4. **Bullet-Biters**: Accept the EV math. Pay $5 to avoid `-Inf` disutility. Like ignoring NaN in a critical path.  

  ### Your Variants: Same Exploit, New Vectors?  
  **Variant A (Uncomputable Payoff)**:  
  - Threat: `N = BB(10^6)` (Busy Beaver), EV computation times out or returns `NaN`.  
  - **Same problem, relocated**: EV is non-halting or undefined. "Compute EV" isn't a total function. Fixes:  
    - Timeout → `default: ignore_claim` (robustness).  
    - Prior `P(BB(N))` decays super-exponentially with `K` (fast-falling prior).  
    - Residue: Handling non-computable functions breaks standard EV estimators. Requires a metadecision: "Abort if runtime > threshold."  

  **Variant B (Adaptive Mugger)**:  
  - Adversary reads your policy `f(claim) → {pay, ignore}` and iterates: `claim_{k+1} = pump_N(claim_k)` until `f(pays)`.  
  - **New exploit surface**: Now attacking the *policy's iteration*, not just one EV calc. Naive robustness (ignore if `N > 1e9`) fails—mugger starts at `N = 1e9 + 1`.  
  - Fix: Make policy history-dependent (e.g., "ignore after 3 refusals") or randomize (Monte Carlo acceptance). Or publish a precomputed `N_max` (commitment device).  
  - This is an adversarial DDoS on your decision loop. Defense-in-depth: rate limiting + input sanitization (complexity checks).  

  ### Residue Report  
  **Translated Cleanly**:  
  - Fast-falling prior ≈ Complexity-based regularization (bits → `exp(-K)`).  
  - Robustness ≈ Timeouts/rate limits.  
  - Adversarial pumping ≈ Inputs optimizing against your loss function.  
  - EV divergence ≈ Heavy tails in reward distribution (variance → ∞).  

  **Fudged Translation**:  
  - "Utility" isn't a type-safe unit. In engineering, rewards are bounded (e.g., RMSE ≤ 100%). Unbounded `U` is like an unconstrained `float` that can `Inf`—requires normalization.  
  - Kolmogorov complexity is uncomputable; we approximate with heuristics (e.g., gzip size).  

  **No Counterpart**:  
  - **Linear utility of lives**: No infra analogue. A "happy life" isn't a fungible unit like CPU-seconds. Bounding `U` is like clamping, but the *reason* (moral weights) has no parallel.  
  - **Magic powers**: Claims with `P≈0` but `K=O(1)` are like prompt injection—accepting arbitrary input without validation.  

  **Your NaN Intuition Is**:  
  - **Fast-falling prior** (if `K` high → `P=0`) + **robustness** (timeout → `ignore`). You're type-checking claims: "Does `N` fit in `float64`? Else reject."  

  **Core Residue**: The mismatch between discrete EV decisions and unconstrained moral mathematics. Your vocabulary handles bounded rationality; unbounded ethics requires new primitives (or admits defeat).  

