  We are in the neonatal intensive care unit (NICU). Nurse Evans records the oxygen saturation (SpO2) of four premature infants at 8 AM: Baby A: 94%, Baby B: 95%, Baby C: 95%, Baby D: 96%. The unit uses two brands of pulse oximeters: Brand X (on A and B) and Brand Y (on C and D). The readings are stable and consistent with no alarms. The question is why the readings are slightly higher in Brand Y.

  Shortlist of hypotheses:
  - H1: Brand Y oximeters are calibrated 1% higher than Brand X due to a recent recalibration error.
  - H2: Infants C and D genuinely have slightly higher SpO2 because they are in warmer incubators (which can improve oxygenation) while A and B are in slightly cooler ones.

  Priors (based on background knowledge):
  - H1: Calibration errors happen occasionally; prior ~10%. (Nurses know that oximeters can drift after recalibration, but it's not common.)
  - H2: Temperature differences in incubators occur and affect SpO2; prior ~15%. (Thermoregulation is important, and minor variations happen.)

  Likelihoods (probability of the evidence given the hypothesis):
  - Evidence: A:94, B:95 (Brand X), C:95, D:96 (Brand Y). The critical observation is the difference: Brand Y reads 1% higher on average.
  - For H1: If Brand Y is calibrated 1% high, then the true values for C and D are 94% and 95%. The readings are exactly as expected: C should read 95% (true 94% +1), D should read 96% (true 95% +1). The actual readings (95, 96) match perfectly. Assuming small measurement noise (say, Gaussian with σ=0.5%), the likelihood of the exact numbers under H1 is high. Specifically, P(E|H1) ≈ [normal PDF at 0 deviation for each] ≈ (0.8)^4 ≈ 0.41 (since each reading is within 0.5% of expected, and normal PDF at mean is about 0.8/σ, but let's be proportional: high, say ~0.4).
  - For H2: If C and D are in warmer incubators, we expect their true SpO2 to be higher. But how much? A reasonable effect is 1-2%. So expected true SpO2 for C and D: about 95.5%? But we observe 95 and 96. Also, A and B: cooler incubators, expected lower, say 94.5% true? But we observe 94 and 95. So the observed differences (A:94, B:95; C:95, D:96) are consistent with a 1% average increase for warmer incubators, but not perfectly: 
    - Under H2, we might expect A and B to be similar (both cool), but they are 94 and 95. Similarly, C and D: 95 and 96. So the within-group variation is present. However, the effect of temperature is not perfectly precise; it might vary by infant. We model the expected difference as about 1%, but with some spread. So the likelihood: P(E|H2) = P(A:94, B:95 | cool) * P(C:95, D:96 | warm). If we assume that without the temperature effect, all would be around 94.5? Then with +1% for warm, we expect 95.5 for C and D. But we see 95 and 96. So deviations: for C: 95 vs 95.5 (diff -0.5), D: 96 vs 95.5 (diff +0.5). Similarly, A: 94 vs 94.5? (diff -0.5), B:95 vs 94.5 (diff +0.5). Assuming normal noise with σ=0.5%, the likelihood for H2 would be the product of four normal densities at 0.5 deviations (absolute) which is about (normal(0.5,0,0.5))^4 = [ (1/(σ√2π)) exp(-(0.5)^2/(2*σ^2)) ]^4. For σ=0.5, at x=0.5, the density is about 0.48 (since at 1σ, it's ~0.24, but wait: at mean 0, density=1/(0.5*2.5)≈0.8; at 1σ (0.5), density = 0.8 * exp(-0.5)≈0.8*0.6≈0.48). So P(E|H2) ≈ (0.48)^4 ≈ 0.05.

  But wait, this makes P(E|H1) much higher than P(E|H2). Then Bayesian posterior: 
  P(H1|E) ∝ P(E|H1) * P(H1) ≈ 0.4 * 0.1 = 0.04
  P(H2|E) ∝ P(E|H2) * P(H2) ≈ 0.05 * 0.15 = 0.0075
  So conditionalization picks H1.

  But intuitively, we might prefer H2? Why? Because if the readings were slightly different, H1 would break. For example, if Baby C had read 94% (but still with Brand Y), then under H1 (calibration error) we would have expected 95% (true 94% +1%) but observed 94%, which is a 1% error, unlikely. But under H2, if C had read 94%, it could be within normal variation (if the temperature effect is not exactly 1% for every baby). So H2 is more robust.

  Now, IBE with robustness: We look for the hypothesis that best explains a neighborhood of data. H1 fits the exact data perfectly but only that exact pattern. If the readings had been, say, A:94, B:94, C:95, D:95, then H1 (which predicts a 1% shift for Brand Y) would have been off by 1% for B (expected 94 but observed 94? wait, if B is Brand X and read 94, that's fine; but C:95 with Brand Y: if true is 94, then 95 is perfect; D:95 with Brand Y: expected 96? no. Let me rework: 

  H1 predicts for any infant on Brand Y: reading = true +1. For Brand X: reading = true. 
  So if we had observed, say, A:94, B:94, C:95, D:95, then under H1:
  - A:94 -> true=94 (ok)
  - B:94 -> true=94 (ok)
  - C:95 -> true=94 (so reading should be 95? yes, because 94+1=95 -> ok)
  - D:95 -> true=94? then reading should be 95? yes. So that's also consistent? 

