prompt: |-
  I have been reading rationalist blogs and forums for about a decade, so I came to Parfit's teletransporter argument secondhand — the fission case, the claim that identity is not what matters, the thought that survival comes in degrees — and I had always filed it under intuition pumps with no cash value. Then two things happened in my own family that make me think the question is not academic at all. Last winter my uncle had a brain hemorrhage and was declared dead by neurological criteria while he was still warm, still on a ventilator, still with a beating heart; the hospital asked whether we would donate his organs, and we said yes. A year earlier my grandmother had died with end-stage Alzheimer's, at a point where there was almost nothing left of the person — no memory, no recognisable character, no capacity to form or act on the simplest intention — and yet everyone from the hospice nurse to the probate court treated her as unambiguously alive and as the very same person whose decades-old advance directive still bound what could be done to her body. Same legal system, same hospitals, two apparently flatly different answers about what has to continue for the person to still be there, and I have been going in circles trying to say precisely where the inconsistency lies.

  Here is the cluster of practices I mean, as concretely as I can put it. Death in most of the United States is defined by a statute descended from a uniform model act that most states adopted in the early 1980s: a physician may pronounce death either on the basis of irreversible loss of circulatory and respiratory function or on the basis of irreversible loss of all functions of the entire brain, brainstem included, and the two routes are treated as interchangeable routes to the same fact, though jurisdictions differ over whether the whole brain or only the brainstem must have stopped. Transplantation runs on the dead donor rule, the rule that organs are not to be taken from someone who is alive, and yet a large share of donors are brain-dead patients with beating hearts and ventilated, warm bodies who are wheeled into an operating theatre and opened up while looking, to any layperson, alive. Where donation instead follows the circulatory route, the wait after the heart stops is a matter of minutes, and the bioethics literature openly describes the standard as permanence rather than irreversibility — the patient will not be resuscitated because we have decided not to, not because nobody could. Meanwhile, down the same corridor, a patient in a persistent vegetative state or with end-stage dementia is a living person with full legal standing, whose prior instructions and property rights are still in force, and from whom taking a kidney would be murder.

  I also notice that the people who take this question most literally in practice have quietly settled on an answer: the cryonics organisations charge substantially less to preserve just the head than to preserve the whole body, treat their legally dead clients as patients with continuing interests and continuing contracts, and some of them propose dodging the copy problem altogether by replacing the brain a small region at a time with functionally equivalent hardware, so that there is never a moment of discontinuity and never a second copy to argue with the first. So here is what I want. What view of what matters in survival does this whole apparatus — the neurological criterion, the dead donor rule, the treatment of the demented and the vegetative as still present — actually presuppose? Is it the psychological-continuity view; or something thinner, like the claim that the substrate of consciousness sits in this organ; or only a bright line that several incompatible metaphysics could equally live with? Which rival views does the practice strictly rule out, as opposed to merely sitting badly with — does it really rule out the view that what matters is the continuing life of the human organism, and does it really rule out a demanding psychological-continuity view, given that such a view would make my grandmother both dead and available as an organ source? Where is the practice philosophically underdetermined, such that two or three theories would license exactly the same behaviour, and where is it instead doing genuine metaphysical work that an administrator could not quietly drop? And then take the three rivals one at a time — the organism view, a strict psychological-continuity view, and a view on which survival is degreed with no further fact — and tell me what exactly would have to change in the practice if each were the one we adopted: which declarations would become impermissible, which would become mandatory, and which current distinctions would collapse. Please do not give me a survey of the literature, a reading list, or citations; I want the implicit theory reconstructed, the parts that are substantive separated from the parts that are administrative convenience, and a straight verdict on whether the whole thing is coherent.
reasoning: |-
  Okay, the user has been engaging with rationalist blogs and Parfit's teletransporter argument for a decade but initially dismissed it as having no practical value. However, personal family experiences—his uncle's brain death and organ donation, and his grandmother's end-stage Alzheimer's—made him question the real-world implications of personal identity and survival. He's struggling with the apparent inconsistency in how the legal and medical systems treat these two cases, despite both involving severe loss of function.

  The core of his confusion lies in the cluster of practices around death determination: the neurological criterion for organ donation versus the treatment of patients with advanced dementia as still alive. He notes the dead donor rule, where organ donation requires the donor to be dead, yet brain-dead patients are maintained on ventilators, appearing alive. In contrast, circulatory death involves a short wait after the heart stops, based on permanence rather than irreversibility. Meanwhile, patients in persistent vegetative states or advanced dementia are considered legally alive with full rights.

  He also mentions cryonics organizations, which preserve heads at a lower cost, treating legally dead clients as having ongoing interests and proposing gradual brain replacement to avoid discontinuity. He wants to understand the implicit view of what matters for survival underpinning these practices. Specifically, he asks which philosophical views (organism, psychological continuity, degreed survival) the current system presupposes, which it rules out, and where it's underdetermined. He also wants to know how practices would change under each view, without literature surveys or citations—just a coherent reconstruction.

  The user's explicit request is for an analysis of the implicit theory behind medical and legal practices regarding death and personhood. But deeper, he seeks resolution to his personal conflict from witnessing contradictory applications in his family. He needs clarity on whether the system is coherent or fundamentally inconsistent, possibly to find peace with his experiences. His mention of cryonics indicates interest in practical solutions that align with different theories, showing a desire for actionable understanding beyond abstract philosophy.

  To address this, I need to reconstruct the implicit theory from the practices. The neurological criterion and dead donor rule emphasize irreversible loss of brain function as the point where the person ceases to exist, even if the body continues. This suggests that consciousness and brainstem functions (like breathing) are what matter, not the organism's biological life. However, the treatment of dementia patients as alive despite severe psychological loss indicates that minimal biological life is sufficient for personhood, contradicting the emphasis on brain function.

  The permanence standard in circulatory death (deciding not to resuscitate) is about administrative practicality, not philosophy. Cryonics strategies (head preservation, gradual replacement) aim to maintain continuity, leaning toward psychological continuity without strict identity.

  The current system is a hybrid: it uses brain death to define the end of personhood for organ donation but relies on biological life for dementia patients. This isn't entirely coherent; it's a negotiated compromise. It rules out a pure organism view (since brain-dead bodies are considered dead) and a strict psychological view (since dementia patients are still alive). Degreed survival fits best but isn't fully implemented.

  Under each rival view:
  - Organism view: Brain death wouldn't equal death; organ donation would require waiting for circulatory cessation. Dementia patients would still be alive, but taking organs would be murder.
  - Strict psychological view: Dementia patients could be considered dead, allowing organ donation. Brain death would be death. PVS patients might lose rights earlier.
  - Degreed survival: Rights and obligations would fade with cognitive loss. Death determination might involve gradations, complicating legal clarity.

  The system's inconsistencies arise from prioritizing practical needs (organ supply, clear legal bright lines) over philosophical coherence. The user's anguish stems from these contradictions, and while the practices are somewhat underdetermined, they reveal a societal choice to treat certain losses as decisive for specific purposes. The answer is that the system isn't fully coherent but functions through compartmentalization and administrative convenience.
answer: |-
  The practices you describe form a hybrid system that implicitly endorses a **modified biological criterion with consciousness-centric thresholds**, while strategically employing administrative bright lines to evade metaphysical commitments where impractical. It's neither philosophically coherent nor entirely arbitrary—it's a pragmatic mosaic that reveals what society *acts* as if it believes under pressure from clinical, legal, and ethical constraints. Below is a dissection of its presuppositions, limitations, and consequences under rival theories.

  ---

  ### **The Implicit Theory Behind Current Practice**
  1. **Core Presupposition: Consciousness as the Non-Negotiable Anchor**  
     The system treats **irreversible loss of the capacity for consciousness** (mediated by the brainstem/whole brain) as the definitive endpoint of the *person*. Brain death criteria focus on the destruction of the brain's capacity to generate consciousness or integrate bodily functions—not memory, personality, or higher cognition. This explains:  
     - Why your uncle (brain-dead) was legally dead despite a ventilated body: The *organism* persists, but the capacity for consciousness is gone.  
     - Why your grandmother (advanced Alzheimer's) was legally alive: Minimal consciousness (e.g., sleep-wake cycles) or residual brainstem function persists, anchoring the "person" to the body.  

  2. **The Administrative Scaffolding**  
     - **Dead Donor Rule**: A legal fiction that retroactively justifies organ procurement. Brain death is declared *precisely because* it enables donation while maintaining the rule. The "biological life" of the organism is irrelevant once consciousness is irreversibly lost.  
     - **Permanence vs. Irreversibility in Circulatory Death**: A concession to practicality. By declaring death after 2–5 minutes of asystole (knowing resuscitation *could* occur but won't), the system prioritizes organ viability over metaphysical precision.  
     - **Treatment of Dementia/PVS**: Here, the system defaults to **biological continuity of the organism** as a proxy for personhood. Consciousness is degraded but not *irreversibly absent* by clinical criteria (e.g., brainstem reflexes may persist). Advance directives remain binding because the law treats the patient as the "same biological entity" that authored them.  

  3. **What Is Ruled Out**  
     - **Pure Organism View**: Rejected in practice. If biological life were paramount, brain-dead patients would be alive, organ donation from them would be homicide, and your uncle’s case would be illegal.  
     - **Strict Psychological-Continuity View**: Rejected for dementia patients. If memory, character, or intentions defined survival, your grandmother would have "ceased to exist" years before death, invalidating her directives and permitting organ harvest.  
     - **Degreed Survival**: Implicitly acknowledged in palliative contexts (e.g., withdrawing care in PVS), but legally suppressed. The law demands binary categories: alive (with rights) or dead (without them).  

  4. **Philosophical Underdetermination**  
     The system *could* be justified by:  
     - A **consciousness-based view** (what matters is the capacity for subjective experience).  
     - A **minimal biological view** (what matters is the persistence of a human organism with *some* integrated function).  
     - A **pragmatic identity view** (continuity matters only insofar as it supports social/legal norms).  
     Crucially, **none** require committing to Parfitian "what matters" (e.g., psychological connectedness). The practice collapses into administrative bright lines when theory becomes inconvenient (e.g., the "permanence" loophole).  

  ---

  ### **Consequences Under Rival Theories**
  **1. Organism View (Human Animalism)**  
     - **Definition**: You are identical to your biological organism; survival requires its continued life.  
     - **Changes to Practice**:  
       - Brain death is **not death**. Your uncle’s organs could not be procured until cardiopulmonary arrest *and* biological decay begins.  
       - Donation after circulatory death (DCD) becomes **ethically impermissible**—waiting 2–5 minutes ignores potential reversibility.  
       - Dementia patients remain **unambiguously alive**; advance directives bind strictly.  
       - **Distinctions Collapsed**: Brain death vs. PVS—both are living organisms. Organ transplantation plummets.  

  **2. Strict Psychological-Continuity View**  
     - **Definition**: Survival requires robust psychological connectedness (memories, intentions, character).  
     - **Changes to Practice**:  
       - Your grandmother is **legally dead** upon losing autobiographical memory/agency. Her organs could be taken, her property distributed, and her directives voided.  
       - Brain death remains death (no psychological continuity possible).  
       - PVS patients lose rights; life support can be withdrawn *without* consent.  
       - **Distinctions Collapsed**: Dementia vs. brain death—both entail "death of the person." Organ sources expand dramatically.  

  **3. Degreed Survival (Parfitian View)**  
     - **Definition**: Survival is a matter of degree; psychological connectedness determines "how much" survives.  
     - **Changes to Practice**:  
       - **Death declarations abolished**. Legal personhood fades as connectedness diminishes:  
         - Your uncle’s brain death = near-total loss → organs procurable.  
         - Your grandmother’s dementia = severe loss → advance directives revised by surrogates; organ donation *possible* if she previously consented.  
       - Rights become gradated: A PVS patient might "own" property but not refuse medical care.  
       - **Distinctions Collapsed**: Alive/dead binary replaced by capacity-based tiers. Cryonics-style gradual replacement is ethically sound.  

  ---

  ### **Verdict on Coherence**
  **The system is locally coherent but globally inconsistent.** It holds three conflicting premises:  
  1. Brain death = death (consciousness extinguished).  
  2. Dementia/PVS = life (biological persistence).  
  3. Circulatory death = death after *non*-irreversible cessation (administrative necessity).  

  It **succeeds pragmatically** by:  
  - Using brain death as a "good enough" proxy for loss of personhood for organ procurement.  
  - Using biological persistence as a "good enough" proxy for personhood in dementia to preserve autonomy.  
  - Exploiting loopholes (permanence) to avoid intractable debates.  

  **It fails philosophically** by:  
  - Arbitrarily switching criteria between contexts (brain vs. biology).  
  - Ignoring degreed realities (e.g., minimal consciousness in PVS vs. none in brain death).  
  - Prioritizing organ supply and legal simplicity over metaphysical rigor.  

  Cryonics enthusiasts grasp this: they treat "death" as a legal label, substitute continuity for identity, and engineer around duplication. The law’s refusal to follow suit reveals its core commitment: **consciousness is necessary but insufficient; the biological organism must *also* be irreversibly doomed.** This hybrid is unstable but functional—a testament to society’s ability to "muddle through" existential questions when lives and organs are at stake.
