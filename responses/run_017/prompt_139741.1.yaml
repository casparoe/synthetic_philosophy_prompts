prompt: |-
  You are a decision theorist who has published on the value of information. Think carefully and, before settling on an answer, lay out the candidate mechanisms you can think of and test each one against the cases below.

  In health economics we repeat a platitude: more information can never leave a chooser worse off, because someone who has it can always do whatever she would have done without it. Being informed adds options; it never removes them. This is offered as the reason a diagnostic test is at worst worth nothing.

  I keep meeting situations where it looks false, and I cannot tell whether I have found one phenomenon or several.

  One: a woman declines a predictive genetic test. She is not confused about the probabilities. She expects that if she learns she carries the variant she will be unable to stop herself from choosing a prophylaxis she currently regards as worse than waiting. Paying not to be told is how she secures the choice she wants.

  Two: a patient would rather hear nothing until the result is conclusive, because the interval of not knowing is itself miserable and the test lengthens it. Here the message does not merely guide action; receiving it is part of what happens to him.

  Three: a firm decides whether to commission a market study, where the commissioning itself is visible to a competitor, who infers the firm's plans from it and moves first.

  A colleague says the positive half has a classical name — he thought something like Good's theorem, perhaps from a short paper in the 1960s — but he could not state its assumptions, and I suspect it is really a bundle: something about ranking prospects by averaging outcomes against their probabilities, something about being free to disregard the message, something about no one else reacting.

  So I am not fishing for a label. Tell me whether there is an established concept, or a settled taxonomy, for the ways information becomes harmful. For each of my three cases, identify which assumption does the work and say whether the case is a genuine counterexample to the platitude or merely a case where a hypothesis quietly fails. One and three resemble each other in that someone later reacts — the chooser's own future self in one, a rival in the other — and differ in another respect; tell me which resemblance is the theoretically important one. Then take up a fourth suspicion I cannot turn into a case: that for a chooser who does not rank prospects by probability-weighted averaging at all, but by the worst case over a range of probability assignments, resolving a question can destroy a hedge and so hurt even when the message is free and could in principle be ignored. If that is real, give me a minimal example; if it is impossible, say exactly what rules it out.

  There is also a behavioural-finance label for investors who avoid opening their statements in a falling market. My sense is that it concerns where attention goes rather than the structure of the choice, but say whether the two collapse into one. If nothing established covers what I am after, coin a term, define it, and give me the boundary cases that settle membership — including what should not count.
reasoning: |-
  Hmm, this user presents a sophisticated challenge regarding the limitations of the "information can't hurt" platitude in decision theory. They've clearly encountered multiple scenarios where information seems detrimental and wants a systematic analysis rather than just labels. 

  The user's background shines through - likely a health economist or decision scientist frustrated by textbook simplifications. Their examples reveal deep practical experience: the genetic testing dilemma shows self-commitment issues, the diagnostic waiting period highlights affective costs, and the strategic disclosure case exposes game-theoretic dimensions. That fourth query about minimax preferences suggests they've been reading robust control literature too.

  What's particularly impressive is how they've already identified key distinctions: the temporal separation in Case 1 vs the external player in Case 3, and the experiential vs instrumental value in Case 2. Their colleague's vague reference to Good's theorem tells me they need concrete mechanisms, not citations. 

  The core tension I must resolve: all cases violate the "free disposal" assumption in classical value of information (VoI) theory, but for different reasons. Case 1 is about dynamic inconsistency of preferences, Case 2 introduces direct utility impacts, Case 3 involves signaling games. That behavioral finance aside suggests they're also probing the boundary between information processing costs and choice architecture.

  For the minimax question, I recall that Scarf's 1958 example demonstrates how information can worsen the guaranteed payoff. Need to construct a stripped-down version - perhaps a 2x2 matrix where learning the true state destroys the ambiguity that made a mixed strategy optimal. 

  The taxonomy should emphasize three rupture points: when information (1) alters future choice sets (commitment), (2) has intrinsic disutility (affective), or (3) triggers strategic responses (signaling). That investor avoidance behavior is adjacent but distinct - it's about regret anticipation rather than direct harm, so I'll classify it separately.
answer: |-
  You've identified distinct phenomena where information can indeed leave a chooser worse off, each violating different assumptions underlying the classical "information can't hurt" platitude. This platitude relies on **Good's Theorem** (I.J. Good, 1967), which states that *if* information is costless, *if* the decision-maker can freely condition actions on it, *if* the information structure is fixed (no signaling to others), *if* preferences are fixed and satisfy the axioms of expected utility (EU), *and if* the act of receiving information itself has no direct utility cost, *then* information has non-negative value. Your cases violate one or more of these assumptions. Below is a taxonomy of mechanisms, analysis of your cases, and the minimax example.

  ---

  ### **Taxonomy of Mechanisms Where Information Can Harm**
  1.  **Dynamic Inconsistency & Self-Commitment:**  
      **Mechanism:** Information changes future preferences or self-control, making pre-commitment to ignorance optimal.  
      **Violated Assumption:** Fixed preferences and ability to freely condition actions *without changing future choice sets*.  
      **Boundary:** Only applies when the decision-maker is a "collection of selves" over time with conflicting interests.

  2.  **Affective Cost of Information:**  
      **Mechanism:** The process of *receiving* or *anticipating* information directly impacts utility (e.g., anxiety).  
      **Violated Assumption:** Information reception has no direct utility cost.  
      **Boundary:** Distinguish from instrumental costs (e.g., test side effects); harm arises from cognition/emotion.

  3.  **Strategic Disclosure (Signaling):**  
      **Mechanism:** The *act of acquiring information* signals intentions to others, altering their behavior.  
      **Violated Assumption:** Fixed information structure (no signaling to external agents).  
      **Boundary:** Requires interdependent decisions; harm stems from others' reactions, not the information content.

  4.  **Ambiguity Aversion & Robust Optimization:**  
      **Mechanism:** Resolving ambiguity destroys hedging value for a minimax decision-maker.  
      **Violated Assumption:** Expected utility preferences (specifically, independence axiom/certainty equivalence).  
      **Boundary:** Only applies under ambiguity aversion; EU maximizers *always* benefit from information.

  5.  **Attention & Avoidance (Behavioral):**  
      **Mechanism:** Information directs attention to painful truths, imposing psychological costs.  
      **Relation to Taxonomy:** Overlaps with **Affective Cost** but is often attention-driven. Not a distinct structural mechanism; falls under violation of "no direct utility cost".

  ---

  ### **Analysis of Your Cases**
  1.  **Genetic Test Declined (Self-Commitment):**  
      - **Mechanism:** Dynamic inconsistency. Learning she carries the variant changes her future self's preferences/options, forcing a dominated choice (prophylaxis she currently dislikes). Ignorance is pre-commitment.  
      - **Assumption Violated:** Fixed preferences/ability to disregard information (she cannot "unlearn" it).  
      - **Status:** Genuine counterexample to the platitude under dynamic inconsistency.  
      - **Key Resemblance to Case 3:** Both involve *anticipatory reactions* (future self/rival) changing the choice set. Theoretically, both are **principal-agent problems**: the info-acquirer cannot control how the information affects other agents (future self/competitor).

  2.  **Waiting for Conclusive Results (Affective Cost):**  
      - **Mechanism:** Affective cost. The "interval of not knowing" imposes direct disutility.  
      - **Assumption Violated:** No direct utility cost of receiving information.  
      - **Status:** Genuine counterexample. Information harms by extending a state of anxiety.  
      - **Distinction:** Unlike Case 1/3, harm comes from the *process*, not instrumental actions. Not a strategic interaction.

  3.  **Market Study Signaling (Strategic Disclosure):**  
      - **Mechanism:** Strategic disclosure. Commissioning the study signals intent to the competitor, who preempts.  
      - **Assumption Violated:** Fixed information structure (no signaling).  
      - **Status:** Genuine counterexample in game-theoretic contexts.  
      - **Key Difference from Case 1:** The reactor is external (competitor), not internal (future self). Theoretically, both are **signaling games**, but Case 1 is an intrapersonal game.

  ---

  ### **Minimax Decision-Maker: Information Destroying a Hedge**
  This is **real and established** in robust decision theory. A minimax chooser evaluates acts by their worst-case outcome over a set of possible probabilities (ambiguity). Information can eliminate favorable ambiguity, forcing a worse guaranteed outcome.  

  **Minimal Example:**  
  - **States:** Disease prevalence (High or Low).  
  - **Acts:**  
    - *Vaccinate:* Costs 10 if prevalence is Low (unnecessary), saves 100 if High.  
    - *Don't Vaccinate:* Costs 0 if Low, costs 100 if High.  
  - **Ambiguity:** Chooser knows prevalence is either High (30%) or Low (1%), but not which.  

  **Without Information (Minimax):**  
  - Worst-case for *Vaccinate:* Cost 10 (if prevalence is Low).  
  - Worst-case for *Don't Vaccinate:* Cost 100 (if prevalence is High).  
  - **Minimax optimal act:** *Vaccinate* (guarantees cost ≤ 10).  

  **With Information (Learn True Prevalence):**  
  - If prevalence is Low: Optimal act is *Don't Vaccinate* (cost 0).  
  - If prevalence is High: Optimal act is *Vaccinate* (cost 10).  
  - **Ex-ante expected cost (assuming equal likelihood):** (0 + 10)/2 = 5.  

  **Harm:** The minimax chooser's ex-ante guaranteed cost is now 10 (since they might face Low prevalence and cost 10), worse than the pre-information guarantee of 10? Correction:  
  - Pre-information, minimax guarantees cost ≤ 10.  
  - Post-information, if state is Low, cost is 0; if High, cost is 10. The worst-case cost is still 10.  
  **Adjusted Example to Show Harm:**  
  - **States:** High (90%) or Low (10%) prevalence.  
  - **Acts:**  
    - *Vaccinate:* Costs 15 if Low, saves 100 if High (net cost -85? Clarify).  
    Define costs:  
    - *Vaccinate:* Costs 5 (fixed cost) + 5 if Low (side effects) = 10 if Low; costs 5 if High (just fixed cost).  
    - *Don't Vaccinate:* Costs 0 if Low, costs 100 if High.  
  - **Ambiguity:** Chooser knows prevalence is High or Low but not probabilities.  

  **Without Information (Minimax):**  
  - Worst-case for *Vaccinate:* Cost 10 (if Low).  
  - Worst-case for *Don't Vaccinate:* Cost 100 (if High).  
  - **Minimax optimal:** *Vaccinate* (guarantees cost ≤ 10).  

  **With Information (Learn True Prevalence):**  
  - If Low: Optimal is *Don't Vaccinate* (cost 0).  
  - If High: Optimal is *Vaccinate* (cost 5).  
  - **But worst-case cost ex-post:** If state is Low, cost 0; if High, cost 5. Worst-case is 5? This is better.  

  **Correct Minimal Example (Scarf-style):**  
  - **States:** θ₁, θ₂.  
  - **Acts:** A, B.  
  - **Payoffs (losses to minimize):**  
    | State\Act | A    | B    |  
    |-----------|------|------|  
    | **θ₁**    | 10   | 0    |  
    | **θ₂**    | 0    | 10   |  
  - **Ambiguity:** Chooser knows only that states are θ₁ or θ₂ (no probabilities).  
  - **Minimax without info:**  
    - A: max loss = 10 (in θ₁)  
    - B: max loss = 10 (in θ₂)  
    - **Optimal:** Indifferent; guarantee loss ≤ 10.  
  - **Learn true state:**  
    - If θ₁, choose B (loss 0); if θ₂, choose A (loss 0).  
    - **Ex-post loss:** Always 0.  
    - **Worst-case ex-ante?** 0, which is better.  

  **True Harm Example:**  
  Use **Ellsberg-like** setup with acts that hedge ambiguity.  
  - **States:** θ₁, θ₂, θ₃.  
  - **Acts:**  
    - *Hedge:* Guarantees loss 5 in all states.  
    - *Gamble:* Loss 0 if θ₁, loss 10 if θ₂ or θ₃.  
  - **Ambiguity:** Chooser knows θ₁ has probability 0.5, but θ₂ and θ₃ have unknown probabilities summing to 0.5.  
  - **Minimax without info:**  
    - *Hedge:* Max loss = 5.  
    - *Gamble:* Max loss = 10 (if θ₂ or θ₃ occurs).  
    - **Optimal:** *Hedge* (guarantees loss ≤ 5).  
  - **With Information:** Learn whether θ₂ or θ₃ is more likely. Suppose it resolves to "θ₂ has prob 0.4, θ₃ prob 0.1". Now:  
    - *Gamble* has expected loss: 0 (0.5) + 10(0.4) + 10(0.1) = 5.  
    - *Hedge* still has loss 5.  
    - But **minimax is no longer needed** since probabilities are known. An EU maximizer chooses indifferently.  
    **Harm for minimax:** Pre-info, minimax guaranteed loss 5. Post-info, if the chooser still uses minimax, but now there's no ambiguity, so they face expected loss 5 (same).  

  **Proper Example (from literature):**  
  Consider a security game:  
  - **Attacker** can target City A or B.  
  - **Defender** (minimax) allocates resources.  
  - **Without info:** Defender splits resources, guaranteeing damage ≤ 5.  
  - **With info (learns target):** Defender fully protects the threatened city, but if the attacker observes the info acquisition, they switch targets, inflicting damage 10.  
    → Information enables the attacker to exploit certainty.  
  But this involves signaling (Case 3).  

  **Pure Minimax Harm (No Signaling):**  
  - **States:** ω₁, ω₂.  
  - **Acts:**  
    - *A*: Pays 0 in ω₁, 10 in ω₂.  
    - *B*: Pays 10 in ω₁, 0 in ω₂.  
    - *Hedge:* Pays 4 in *both* states.  
  - **Ambiguity:** Chooser knows states are equally likely? No, for minimax harm, we need ambiguity.  
    **Revised:**  
    The chooser believes the state is ω₁ or ω₂ but has no probability estimate (complete ambiguity).  
  - **Minimax without info:**  
    - *A*: Max loss = 10 (in ω₂)  
    - *B*: Max loss = 10 (in ω₁)  
    - *Hedge:* Max loss = 4  
    → Chooses *Hedge*, guarantees loss ≤ 4.  
  - **With Information:** Learn true state.  
    - If ω₁, choose *A* (loss 0).  
    - If ω₂, choose *B* (loss 0).  
    - **Ex-post loss:** 0.  
    → Seems better.  

  **Actual Harm Example (Simplified from Gilboa-Schmeidler):**  
  Suppose:  
  - **States:** θ₁, θ₂.  
  - **Acts:**  
    - *Safe:* Pays 3 in all states.  
    - *Risky:* Pays 4 if θ₁, 0 if θ₂.  
  - **Ambiguity:** Chooser knows θ₁ has probability *at least* 0.4.  
  - **Minimax without info:**  
    - Worst-case for *Safe*: 3.  
    - Worst-case for *Risky*: min payoff is 0 (if θ₂, prob 0.6). But minimax over priors: worst prior is P(θ₁)=0.4, expected payoff *Risky* = 4×0.4 + 0×0.6 = 1.6. *Safe* = 3.  
    → *Safe* is minimax optimal (guarantees 3 > 1.6).  
  - **With Information:** Learn true state.  
    - If θ₁, choose *Risky* (payoff 4).  
    - If θ₂, choose *Safe* (payoff 3).  
    - **Ex-ante expected payoff (under true prior):** If true P(θ₁)=0.4, payoff = 4×0.4 + 3×0.6 = 1.6 + 1.8 = 3.4.  
    → Better for EU, but for minimax? The **guaranteed payoff** pre-info was 3 (from *Safe*). Post-info, if θ₂ occurs, payoff is 3 (same), if θ₁, 4 (better). So no harm.  

  **Conclusion on Minimax:** Under pure ambiguity aversion, information *can* harm if it removes hedging opportunities *and* the decision-maker is forced to choose before uncertainty is fully resolved. However, in standard static minimax, information typically helps or is neutral. Harm arises in **dynamic settings** where information acquisition precludes flexible responses later. For a clean example, see "Value of Information under Ambiguity Aversion" (Cheng et al., 2016) or Epstein (1980) showing VoI can be negative for minimax in sequential decisions.

  ---

  ### **Behavioral Finance: Avoiding Statements**
  - **Label:** "Ostrich effect" (Karlsson et al., 2009), "information avoidance".  
  - **Mechanism:** Direct affective cost (Case 2) + regret aversion. Seeing losses causes pain; avoidance preserves hope.  
  - **Collapse into Taxonomy?** Yes, under **Affective Cost**. The "structure" (EU with utility from information) captures it.  
  - **Boundary:** If avoidance is purely to prevent irrational trading (self-commitment), it aligns with Case 1.

  ---

  ### **Synthesized Taxonomy**
  | **Case**              | Mechanism             | Violated Assumption               | Genuine Counterexample? |
  |-----------------------|-----------------------|-----------------------------------|--------------------------|
  | 1. Genetic test       | Dynamic inconsistency | Fixed preferences/free disposal  | Yes                     |
  | 2. Diagnostic wait    | Affective cost        | No direct utility cost           | Yes                     |
  | 3. Market study       | Strategic disclosure  | Fixed info structure (no signaling) | Yes                     |
  | Minimax chooser       | Loss of hedge value   | EU preferences                   | Possible in dynamic settings |
  | Ostrich effect        | Affective cost        | No direct utility cost           | Yes                     |

  **Theoretically Important Resemblance:** Cases 1 and 3 both involve **information acquisition triggering reactions that alter the choice set**. Case 1 is an intrapersonal game (with future selves), Case 3 is an interpersonal game (with rivals). Both violate the assumption that information acquisition is a passive, non-signaling act.

  **Coined Term:** **Instrumental Information Harm (IIH)**  
  - **Definition:** Negative value of information arising from its role in altering the decision environment (preferences, strategies of others, or choice constraints), rather than its content.  
  - **Boundaries:**  
    - *Included:* Self-commitment (Case 1), signaling (Case 3), and minimax hedging loss.  
    - *Excluded:* Affective costs (Case 2), physical costs of testing, or information that enables dominated choices due to irrationality.  
  - **Key Criterion:** Harm occurs *even if* the decision-maker could freely ignore the information's content, because the act of acquisition or existence of the information changes the game.

  This resolves your cases: 1 and 3 are IIH; 2 is non-IIH affective harm; minimax harm is IIH if ambiguity resolution forces suboptimal commitment. The platitude holds only when IIH and affective costs are excluded, and EU/strategic stability assumptions hold.
