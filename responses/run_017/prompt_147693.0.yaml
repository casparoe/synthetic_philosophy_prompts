answer: |-
  Your friend's narratability framework is a sharp tool for dissecting Omelas and the dust specks, and Le Guin absolutely weaponizes it – *but the story also exposes its limits and points beyond aggregation.** Here's how to structure the discussion using key scenes:

  **Scenes for Eighteen-Year-Olds (Focus on Embodied Experience & Choice):**

  1.  **The Cellar Visit:** This is the *core* confrontation with narratability. Don't just *mention* it; focus on *how* Le Guin forces narratability onto the reader and the citizens:
      *   **Vivid Sensory Detail:** The filth, the smell, the light, the sores, the broken mind. This isn't abstract suffering; it's a specific, horrifying *story* happening *to this child, right now*. Le Guin makes it impossible *not* to narrate this harm in stark, individual terms.
      *   **The "Understanding":** Citizens *see* it, *know* it, and are told the terms. This makes the harm concrete and undeniable *within* the narrative world. It becomes a singular, named atrocity they must cognitively and morally process. Contrast this with the *diffuse*, unlocatable nature of the dust specks or hypothetical micro-pangs.
      *   **Prompt:** *Why does seeing the child change things? Is it just that the harm is bigger, or is it that Le Guin makes it impossible to ignore as a specific, terrible event happening to a specific being? Could you tell a story about *your* dust speck? Could you tell *this* child's story?*

  2.  **The Initial Happiness (Revisited AFTER the Cellar):** Don't skip the festival! But revisit it *after* the cellar scene. Ask:
      *   *Can you still see the city's joy the same way? Does knowing the price make that joy feel "aggregated" or hollow?* Le Guin initially paints aggregate happiness beautifully, but the cellar scene *retroactively poisons it* by attaching a specific, narratable cost. The aggregate happiness doesn't feel like the sum of countless tiny goods; it feels tainted by one colossal, visible evil. This undermines the "pure aggregation" argument – the cost isn't diffuse dust, it's a screaming child in a basement. The story forces the cost *into* the narrative of the city's happiness.

  3.  **The Ones Who Walk Away:**
      *   **The Nature of Their Choice:** Emphasize *what they don't do*. They don't storm the cellar (which might be futile or worsen things). They don't organize a revolution. They *leave*. This is crucial for your question.
      *   **"They seem to know where they are going":** Focus on the *deliberateness* and the *unknown destination*. This isn't random flight; it's a rejection of the foundational bargain. It's integrity over utility.
      *   **Prompt:** *If aggregation justified Omelas, why walk away? Isn't leaving pointless for the child and wasteful for their own potential happiness? What are they rejecting? The *calculation*? The *complicity*? The *nature of the happiness built on that specific suffering*? Does walking away "aggregate" anything?*

  **Where the Story Pushes Back on/Complicates the Narratability Framework & Your Friend's Test:**

  1.  **The Micro-Pang Test & Omelas:** Your friend is right that reducing the child's suffering to sub-narratable pangs would gut the story. But this doesn't *invalidate* narratability; it *confirms* its power *and* its link to intensity in practice. Le Guin *needs* the suffering to be intense *and* narratable to achieve her effect. The story shows **intensity *enables* narratability** in a visceral way. A faint pinch per citizen *wouldn't* create the same moral crisis because:
      *   It wouldn't be locatable or attributable as *the* cause of happiness.
      *   It likely *wouldn't even be perceived as harm* by the citizens (truly sub-narratable).
      *   There would be no specific victim to empathize with or story to tell.
      *   **The Takeaway:** Narratability *does* depend on a certain threshold of intensity/discernibility to register as a "harm worth telling about." Omelas leverages this link brilliantly. Your friend's micro-pang torture *fails* as a parallel to Omelas precisely because it removes the intensity that *makes* the harm narratable and morally salient in the Omelas scenario.

  2.  **Beyond Aggregation: Means, Complicity, and Integrity:** The story resists being *only* about aggregation vs. non-aggregation. Walking away highlights other key elements:
      *   **Using as a Means:** The child isn't just suffering; they are *deliberately imprisoned and tortured* **as a means to an end**. This violates Kantian dignity regardless of the aggregate math. The citizens' happiness is *causally dependent* on the active, ongoing infliction of this specific harm.
      *   **Complicity & Knowing Acceptance:** Citizens *see* the cost and *accept* it. Walking away is a refusal of this complicity. It's about not wanting your happiness to be *defined* by that bargain, even if rejecting it doesn't change the outcome. It's moral purity/clean hands.
      *   **The Nature of the Happiness:** Le Guin subtly suggests the happiness of Omelas might be shallow or false *because* of its foundation. Walking away might be a search for a different *kind* of happiness, one not built on such horror. This transcends consequentialism entirely.
      *   **Prompt:** *Is the problem the *math* (one intense harm vs. many goods) or the *act* (deliberately torturing a child for everyone else's benefit)? If the harm was an unavoidable natural disaster affecting one child, would walking away make sense?*

  3.  **The Story's Self-Awareness?** Does Le Guin know she's weaponizing narratability? Absolutely. The entire story is a rhetorical trap:
      *   She invites you to imagine happiness, then slams you with the unbearable, specific cost.
      *   She forces the reader into the position of the citizen who must "understand." She makes *you* complicit in the imaginative act.
      *   **The Critique:** Yes, the story exploits the narratability bias. It *depends* on it. A diffuse cost wouldn't work. But that's not a flaw; it's the *point*. Le Guin is demonstrating the *power* of the individual, visible sufferer to shatter utilitarian justifications. She's showing *why* aggregation feels monstrous when confronted with a singular, narratable horror. The story "knows" this is how human empathy and moral outrage typically function.

  **Discussion Flow Suggestions:**

  1.  **Start with Dust Specks:** Why do students refuse aggregation? Tease out intuitions (unimaginable number, triviality, unfairness to tortured person).
  2.  **Introduce Narratability:** Frame your friend's idea. Can they articulate it? Does it resonate with their dust speck refusal?
  3.  **Apply Narratability to Omelas:** Use the Cellar scene. How does Le Guin make the harm hyper-narratable? How does this contrast with the *initial* description of aggregate happiness (revisit that)?
  4.  **Challenge Narratability:** Pose your friend's micro-pang torture test. Why does it feel absurd? (Links intensity to narratability). Now apply it to Omelas: Would a micro-pang child work? Why not? (Confirms Le Guin's reliance on intense/narratable harm).
  5.  **The Walkers:** Analyze their choice. Why leave if it doesn't help? Push beyond aggregation. Introduce Means/Complicity/Integrity. Is it about the *math* or the *nature of the act*?
  6.  **Le Guin's Trap:** Discuss the story's structure as exploiting narratability bias. Is this a *critique* of Le Guin or the *core mechanism* of her moral argument? Does the story offer a *solution* or just a *rejection*? What does this say about the limits of consequentialism?

  By moving from intuitions (dust specks) to the framework (narratability) to the textured literary example (Omelas scenes) and back to the framework's limits (micro-pangs, the walkers' choice), you can push students to see that while narratability powerfully explains *initial resistance* to aggregation, Omelas ultimately points to deeper deontological concerns about agency, complicity, and the intrinsic wrong of using a person in this way, concerns that persist even if the harm were somehow "non-narratable" but still deliberately inflicted as a means. The act of walking away is the ultimate repudiation of the *bargain itself*, not just the math.
