  | Yes            | Yes               | Yes                | Any               | **Grounded in Nature** | |
  | Yes            | Yes               | Yes                | Any               | **Hole 3** | Nature grounds truths but omniscience fails—incoherent. |
  | Yes            | Yes               | No                 | No                | **Simple Foreknowledge**, **Ockhamism**, **Eternalism** | *Flag: These differ only in mechanism of foreknowledge (Q10/Q12).* |
  | Yes            | Yes               | No                 | Yes               | **Molinism/Congruism** | |
  | Yes            | Yes               | No                 | Yes               | **Reformed Compatibilism** | |
