  ### Decision Tree: Divine Foreknowledge and Human Freedom  
  *Start with concrete cases, avoid labels until leaves. Each branch is a single question about a case or claim. Answer based on your commitments.*  

  #### **Q1: Truth of Unactualized Choices?**  
  *Consider a person never in a specific circumstance (e.g., Alice never offered a bribe). Is there a fact of the matter about what she would have chosen in that circumstance, assuming her choice is free (i.e., she could have chosen otherwise under identical conditions)?*  
  - **No** → Go to Q2.  
  - **Yes** → Go to Q4.  

  #### **Q2: Why No Truth?**  
  *Is this because the future is genuinely "open" (i.e., no facts exist about future free choices until they happen)?*  
  - **Yes** → **Open Theism** (God lacks exhaustive foreknowledge because future free choices are unknowable).  
    *Awkward: God faces uncertainty about human actions.*  
  - **No** → Go to Q3.  

  #### **Q3: Divine-Action Dependence?**  
  *Is it because the truth depends on divine action (e.g., God must first decide how to influence the choice)?*  
  - **Yes** → **Thomism (Physical Premotion)** (God directly causes all creaturely acts via premotion; no "neutral" counterfactuals exist).  
    *Awkward: God causes sin without being its author.*  
  - **No** → **Hole 1: Unspecified Denial** (Denies counterfactual truths for reasons besides openness or divine dependence; e.g., logical fatalism).  

  ---

  #### **Q4: Grounded Truth?**  
  *If there is a truth (from Q1), is it grounded (i.e., explained by prior facts about the world or the agent)?*  
  - **No** → Go to Q5.  
  - **Yes** → Go to Q6.  

  #### **Q5: Divine Knowledge of Brute Truths?**  
  *Can an omniscient being (e.g., God) know these brute (ungrounded) truths?*  
  - **Yes** → **Brute Counterfactuals** (Counterfactuals of freedom are true but inexplicable; God knows them arbitrarily).  
    *Awkward: Truths about choices lack any basis.*  
  - **No** → **Hole 2: Unknowable Brute Truths** (Truths exist but are inherently unknowable, even by an omniscient being).  

  ---

  #### **Q6: Grounded in Agent's Nature?**  
  *Is the truth grounded solely in the agent's individual nature (e.g., character, desires), such that someone exhaustively knowing that nature could deduce the choice?*  
  - **Yes** → Go to Q7.  
  - **No** → Go to Q8.  

  #### **Q7: Divine Knowledge of Nature-Grounded Truths?**  
  *Can an omniscient being know these nature-grounded truths?*  
  - **Yes** → **Grounded in Nature** (Counterfactuals are true due to the agent's nature; God knows them by knowing that nature).  
    *Awkward: Reduces freedom to deterministic natures.*  
  - **No** → **Hole 3: Unknowable Nature Truths** (Agent’s nature grounds truths, but even an omniscient being cannot know them).  

  ---

  #### **Q8: Divine Knowledge?**  
  *Can an omniscient being know these truths (grounded in something besides the agent’s nature)?*  
  - **No** → **Hole 4: Grounded Yet Unknowable** (Truths grounded (e.g., in cosmic laws) but unknowable by an omniscient being).  
  - **Yes** → Go to Q9.  

  #### **Q9: Divine Control?**  
  *Can God ensure an agent freely chooses what He desires?*  
  - **No** → Go to Q10.  
  - **Yes** → Go to Q11.  

  ---

  #### **Q10: Divine Foreknowledge Mechanism?**  
  *Is God’s foreknowledge located within time?*  
  - **No** → **Eternalism** (God is timeless; "foreknowledge" is misnamed as He sees all time equally).  
    *Awkward: Timelessness is philosophically contentious.*  
  - **Yes** → Go to Q12.  

  #### **Q12: Fixity of Past Divine Beliefs?**  
  *Are God’s past beliefs about future choices "hard facts" (unchangeable, like past events)?*  
  - **No** → **Ockhamism** (God’s past beliefs are "soft facts" and not fixed; humans can act to make them different).  
    *Awkward: Implies God’s beliefs depend on future human choices.*  
  - **Yes** → **Simple Foreknowledge** (God knows but cannot control future choices; foreknowledge is "passive").  
    *Awkward: Foreknowledge is useless for providence.*  

  ---

  #### **Q11: Control via Counterfactual Knowledge?**  
  *Does God’s control rely on knowing what agents would freely choose in any circumstance (without Him causing it)?*  
  - **Yes** → **Molinism/Congruism** (God uses "middle knowledge" of counterfactuals to orchestrate circumstances).  
    *Flag: Congruism (grace-focused) agrees with Molinism on all cases but adds that God’s grace ensures cooperation.*  
    *Awkward: Counterfactuals of freedom are unexplained.*  
  - **No** → **Reformed Compatibilism** (God causes free choices via sovereignty; freedom is compatible with divine determinism).  
    *Flag: Thomism (from Q3) agrees with this leaf on control but denies counterfactuals exist without divine action.*  
    *Awkward: God causes evil.*  

  ---

  ### Logical Space Grid  
  *4 key questions define 16 cells. Real positions in **bold**; holes marked. Empty cells collapse or are unattractive.*  

  | **Q1: Truth?** | **Q4: Grounded?** | **Q6: In Nature?** | **Q9: Control?** | **Position** | **Why Empty?** |
