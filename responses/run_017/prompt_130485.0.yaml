answer: |-
  Here’s a 90-minute workshop design focused on experiential learning:

  ### **Setup & Materials (10 mins)**
  *   **Participants:** 14 volunteers, seated in small groups (3-4 people). Each group is a "Design Team."
  *   **Materials per Team:** Blank paper, thick markers (black only), simple clipart images (optional, generic people/objects).
  *   **Materials for You:** Pre-made "Reader Sheets" (see Rounds), timer, whiteboard/flipchart.
  *   **Banned:** Letters, numerals, punctuation, ticks (✓), crosses (✗, ❌), traffic light colours (🔴🟢🟡), arrows (→), mathematical symbols (+/-), emojis. *Why?* These are deeply conventional symbols masquerading as pure pictures. Banning them forces reliance on imagery alone.

  ### **The Rounds (45 mins - 9 mins per round)**
  *   **Rules:** Design Teams have 5 mins to create a single image-only "card" based on your prompt. Readers (different group each round) have 1 min to interpret it *silently* and write their understanding on a Reader Sheet. *No questions allowed.*
  *   **Key:** D = Designers get prompt; R = Readers interpret silently; You = Facilitator rigs the confusion.

  | Round | Prompt for Designers                                     | What You've Rigged                                     | What Designers Will Likely Do                          |
  | :---- | :------------------------------------------------------- | :----------------------------------------------------- | :----------------------------------------------------- |
  | 1     | "Show someone how to use an inhaler with a spacer."      | Readers: Group who *don't* use/have asthma meds.      | Draw sequential steps (person, inhaler, mouth, breath). |
  | 2     | "Warn that about 1 in 20 people get a rash from this."   | Readers: Group told *beforehand* "This means *everyone* gets it." | Draw 20 figures, 1 with rash (clumsy). Or abstract symbols (dots/stars). |
  | 3     | "Tell someone: If you are also taking a blood thinner, do NOT take this new pill." | Readers: Group told *beforehand* "This is just general pill info." | Draw pills + blood drop, add red circle/bar (banned!) or skull (conventional!). |
  | 4     | "Say: This card is old. Ask the nurse for new advice."   | Readers: *Same group* who designed Round 1's inhaler card. | Draw calendar, clock, nurse, question mark (banned!). Or try to modify old card image. |
  | 5     | "Show: Dizziness is a common side effect. If it happens, sit down immediately." | **SPLIT TASK:** Half teams use ONLY **photos** (from provided generic clipart). Half use ONLY **line drawings** (hand-drawn). Readers: Mixed group, no priming. | Photos: Use cluttered scene. Drawings: Simplify key actions (person wobbling -> sitting). |

  ### **Scoring (5 mins)**
  *   After *each* round, collect Reader Sheets.
  *   **Scoring Rule:** A card "scores" if **over 50% of Readers** write the *exact intended meaning* (e.g., "Sit down if dizzy," not just "Dizziness").
  *   **Process:** Quickly tally "Scores" per round on the whiteboard (e.g., ✓ or ✗). **No discussion yet.** Focus is on binary "Was the core message understood?" not nuances or prettiness. The scoreboard shows success/failure starkly.

  ### **Debrief (30 mins)**
  1.  **Show Scores:** Point to the board. "Round 1 probably scored. Round 2? 3? 4? Why?"
  2.  **Map the Moments:**
      *   **Round 1 (Success):** "Simple *actions* work! Pictures show *what is* (inhaler use)." (Similarity).
      *   **Round 2 (Failure):** "Showing *how often*? Hard! '20 figures' is literal but messy. Abstract symbols? What do they *mean*? You needed a *rule* (e.g., 'a group = many') – that's convention!" (Probability needs rules/convention).
      *   **Round 3 (Failure):** "The 'if... not' trap! Pictures show *states* (pills, blood). Showing *logic* ('IF blood thinner, THEN NOT pill')? Almost impossible without symbols (❌) or text. You smuggled in conventions (skull=death=danger=don't!)." (Conditionals/Prohibition need convention).
      *   **Round 4 (Failure):** "Talking *about the card itself*? Pictures point *outward*. Pointing *inward* (this is old) is incredibly hard without symbols." (Self-reference breaks the system).
      *   **Round 5 (Photo vs. Drawing):** "Photos: Realistic clutter (Was that a dizzy person or just tired?). Drawings: Simplified, focused on the *idea* (wobbly lines = dizziness). But did they *lose* crucial context photos had? Which worked better *here*? (Likely drawings). **Key Point:** Photos show *a specific instance*; drawings show *the concept*. Universality needs concepts."
  3.  **Name Neurath's Conclusion:** "This struggle isn't new. A guy named Otto Neurath spent decades on picture languages. His big insight? **Pictures are powerful *aids* within a system that *includes* rules and *some* words, NOT a magic, self-sufficient language.** Our cards need clear rules (e.g., 'red border = warning') and maybe *minimal*, carefully chosen words or numbers."
  4.  **If "Pictures are just ambiguous!":** Acknowledge it! Then ask: "So, for *our* clinic cards: What simple rules could we *all* agree on? What 3 words are worth keeping? How do nurses explain the cards verbally? How do we test them?" Shift focus to practical system-building.

  ### **What Will Go Wrong**
  *   **English Shared Assumptions:** Volunteers unconsciously design for English speakers. *Mitigation:* Use diverse Reader priming (Rounds 2 & 3) & strict scoring. Ask Readers: "Did you understand because of the picture, or because you *assumed* X?"
  *   **Confident Designer Dominates:** One person draws; others watch. *Mitigation:* Enforce "Everyone must contribute a mark on the paper" in design time.
  *   **Readers Cheat/Talk:** Strictly enforce silent writing. Collect sheets immediately.
  *   **Designers Get Frustrated:** Acknowledge difficulty. Emphasize: "The *struggle* is the point! We're finding the edges."
  *   **Scoring Feels Harsh:** Explain it mirrors real life: A patient either understands the core action or doesn't.
  *   **Round 4 Feels Impossible:** Good! That's the point about self-reference. Celebrate attempts.
  *   **Time Crunch:** Be ruthless with the timer. Move on.

  ### **What the Game Can't Do**
  *   **Cultural Specificity:** It won't reveal if a "house" or "hand gesture" in a drawing means something offensive or nonsensical elsewhere. **You must say:** "These exercises test *logic* limits. We *also* need diverse user testing for cultural meaning."
  *   **The Full Nuance of Probability:** Showing "1 in 20" is hard, showing "increased risk" or "rare" is impossible purely visually. **You must say:** "For likelihoods, we likely need words ('rare', 'common') or numbers *alongside* the picture."
  *   **Why Conventions Creep In:** The exercise *shows* it happens (Round 3 skull), but won't deeply explore *why* humans need shared symbols. **You must say:** "Symbols (like ❌) evolve *because* pure pictures struggle with abstract ideas. We might need *one or two* very clear, *locally taught* symbols."
  *   **The Real Cost of Rules:** It shows rules are needed (Round 2), but not the burden of *teaching* them to every patient. **You must say:** "Rules only work if explained. This means training staff *always* to briefly explain the card's 'language' when handing it over."

  This design forces the group to *experience* the limitations through frustrating, hands-on failure, making Neurath's conclusion feel inevitable and practical. Good luck with the real cards!
