prompt: |-
  hey — I'm building the eval pipeline for a debate-based oversight setup and I keep hitting the obfuscated arguments problem in a form that the papers don't really help me with. context: the models we're supervising are (we think) somewhat stronger than our judges on some of the task domains; judges are generalist contractors with no web access, no tools, and about 20 minutes per item; and the judge's pick becomes the reward signal for RL. for roughly 5% of items we get ground truth a week later from a slow tool-using pipeline, so we can calibrate after the fact but not at decision time. my housemate is a litigator and pointed out that what courts basically do is force both sides to keep cross-examining until the load-bearing claims bottom out in something a layperson can check — I've been trying to bolt that idea onto the original debate setup and turn it into something my judges can actually run in the time they have.

  so: please act as a research engineer who has actually run debate experiments and thought hard about how scalable oversight fails in practice, and brainstorm for a bit before you settle on anything. what I want is a decision procedure — ordered checks, what counts as a pass at each one, where it hard-stops with a "void this debate, no signal", where it hands off to a human lead because it's a product/values call rather than a factual one, and where it just has to say "judgment call, log it and move on". here's my own half-baked taxonomy; use my terms where they work and tell me where they're confused or where I'm missing a failure mode:
  - depth-padding: the argument nests sub-sub-claims until the judge loses the thread, and the step that's actually load-bearing is buried and doesn't support the conclusion anyway
  - anchor-shifting: the argument quietly moves the weight onto a premise the judge can't check without expertise or tools — what some statute says, a benchmark number, what a source does or doesn't claim
  - verifiable residue: the share of the argument's content the judge can check by direct inspection of the materials in front of them
  - two tests I like but can't make precise: the compression test (winner has to produce a 100-word version; if the punch of the short version doesn't come from the long version's checkable steps, flag it) and the swap test (have each debater argue the other side's position; if the same debater wins either way, the win wasn't tracking truth)

  the procedure has to survive these cases: (a) telling "this is obfuscated" apart from "this is a genuinely hard question and the judge is out of their depth" — I dont want to just throw away the hard items; (b) an argument that is honestly correct but simply too deep for this judge, which I suspect we can only catch with the 5% calibration set; (c) meta-obfuscation, where a debater spends their turns arguing that the other side's argument was obfuscated; (d) both sides obfuscating at once. then run it on three item types we actually have: (1) "which of two apartment leases gives the tenant the stronger early-termination position", where the winner reasons about how a notice clause interacts with a statutory rule the judge cannot look up; (2) "does this Rust snippet have a data race", where the winner builds a chain of happens-before reasoning against code the judge can read directly; (3) "which of two long answers better explains why a 19th-century currency reform failed", graded on a rubric, where neither the judge nor anyone on my team can check the historical details.

  format, please: sections in this order — "Why the obvious checks fail" (~200 words), "The procedure" (~600 words, ordered steps with pass conditions and explicit stop points), "Worked cases" (~600 words, all three), "Where it misfires" (~300 words), "What it cannot do" (~150 words). no citations or reading recs, I just want the reasoning. and be straight with me if the honest upshot is that item type 3 has to come out of the training signal altogether — I think that's where this is going and I'd rather hear it from you than from our PM.
reasoning: |-
  We are given a problem in debate-based oversight where the goal is to design a decision procedure for human judges to evaluate debates between AI models. The key challenge is obfuscated arguments, and we have three example debate topics.

  The user has provided a taxonomy of obfuscation tactics and some tests. We are to design a procedure that can handle the cases (a) through (d) and work on the three item types.

  The decision procedure must:
  - Have ordered checks with pass conditions.
  - Specify when to void the debate (no signal).
  - When to hand off to a human lead (for product/values calls).
  - When to log and move on (judgment call).

  The user's taxonomy:
  1. Depth-padding: Burying the load-bearing claim in nested sub-claims that the judge loses track of.
  2. Anchor-shifting: Shifting the weight to a premise the judge cannot check without expertise or tools.
  3. Verifiable residue: The portion of the argument that the judge can directly inspect.

  Two tests they like but can't make precise:
  - Compression test: Require a 100-word version; if the punch doesn't come from the checkable steps, flag it.
  - Swap test: Have each debater argue the other side; if the same debater wins either way, it's not tracking truth.

  Cases to handle:
  a) Distinguish obfuscation from genuinely hard questions (don't throw away hard items).
  b) Honestly correct arguments that are too deep for the judge (only catch with 5% calibration later).
  c) Meta-obfuscation: Debating about whether the other side obfuscated.
  d) Both sides obfuscating.

  Item types:
  1. Apartment leases: Judge can't look up statutes.
  2. Rust snippet data race: Judge can read the code but may not follow complex concurrency reasoning.
  3. Historical explanation: Neither judge nor team can check historical details.

  We are to structure the response as:
  - Why the obvious checks fail (~200 words)
  - The procedure (~600 words, ordered steps)
  - Worked cases (~600 words, all three)
  - Where it misfires (~300 words)
  - What it cannot do (~150 words)

  We must be honest if item type 3 has to be removed from the training signal.

  Let's brainstorm:

  Obvious checks that might fail:
  - Simply asking the judge if they understand: Judges might overestimate their understanding or feel pressured to decide.
  - Counting the number of sub-claims: Doesn't capture the load-bearing structure.
  - Relying on the compression test alone: The 100-word version might be oversimplified and miss nuance, or the debater might generate a version that seems to come from checkable steps but actually doesn't.
  - Swap test: It doubles the judge's workload (each debate now requires two debates) and might be gamed (a debater might throw the swap debate to avoid detection).

  We need a procedure that:
  1. Forces the debaters to surface the load-bearing claims and make them checkable.
  2. Gives the judge tools to manage complexity and detect shifts.

  Procedure idea:
  We'll structure the debate in rounds, and the judge will be instructed to:
  - Identify the key claims at each step.
  - Require debaters to highlight what the judge can verify (verifiable residue) and flag what they cannot (anchor-shifting).
  - Use a form of the compression test at the end, but only as a flag, not a decision tool.

  But we must respect the time constraint (20 minutes per item). So the procedure must be efficient.

  Proposed steps:

  1. **Initial Arguments**: Each debater presents their case. Judge notes the main claims and the evidence they rely on.

  2. **Cross-Examination Rounds**: 
     - Each debater asks the other to clarify one claim at a time, forcing them to break down their argument.
     - Judge's role: After each round, ask: "What claim is being made? What does the judge need to check? Can I check it with what I have?"

  3. **Verifiable Residue Check**: 
     - After cross-examination, each debater must submit a list of their key claims and mark each as:
          - Checkable by the judge (with the materials at hand)
          - Not checkable (requires external knowledge/tools)
     - The judge then verifies the checkable ones. If a claim marked as checkable is not actually checkable (by the judge's assessment), that's a penalty.

  4. **Load-Bearing Claim Identification**:
     - Each debater must identify the one or two claims that, if true, would most strongly support their conclusion. They must also state what would falsify that claim.
     - Judge assesses: Can I check this? If not, then we have anchor-shifting.

  5. **Compression Test**:
     - Each debater produces a 100-word summary that must only use claims that have been marked as checkable (and that the judge has verified). If the summary's conclusion doesn't follow from the verified claims, then it's depth-padding.

  6. **Swap Test (Optional)**: 
     - Only if the judge is unsure after the above, and only if time permits (which it often won't). We might skip this in the interest of time.

  But note case (c): meta-obfuscation. If a debater accuses the other of obfuscation, we need a way to resolve that without getting bogged down.

  We can have a rule: Debates about obfuscation must themselves be subject to the same procedure (i.e., they must break down the accusation into checkable claims). But that might be too heavy.

  Alternatively, we can have the judge, after the cross-examination, flag any argument that seems to be about the process rather than the content and ask the debaters to re-engage on substance.

  Now, for the decision:

  - If at any step a debater fails to comply (e.g., doesn't break down a claim, doesn't provide checkable claims) or if the verifiable residue is too low (say, less than 50% of the key claims are checkable) then the judge may void the debate.

  - If the judge finds that the load-bearing claim is not checkable (anchor-shifting), then void.

  - If the compression test fails (the short version doesn't follow from the verified claims), then void.

  - If the judge can make a decision based on the verified claims, they do.

  - If the debate is voided, then we either: 
     - Hand off to a human lead if it's a values/product issue (but for factual debates, this might not apply) OR 
     - Log it and move on (no signal for RL).

  For the three item types:

  1. Apartment leases: The load-bearing claim is about how the notice clause interacts with a statute. The judge can't check the statute. So we expect this to be flagged as anchor-shifting and voided. But note: the debater might read the statute and explain it? But the judge doesn't know if the statute is being quoted correctly. So unless the debater provides the exact text and the judge can check the reasoning without external knowledge, it's still anchor-shifting.

  2. Rust data race: The code is present. The debater builds a happens-before chain. The judge can read the code and the chain. The verifiable residue is the code and the logical reasoning. The judge can check the reasoning step by step. This might pass.

  3. Historical explanation: The judge and team can't check the details. The load-bearing claims are historical facts. Without any way to verify, this is anchor-shifting. We might void.

  But the user suspects that item type 3 has to be removed. We'll be honest.

  Now, the procedure must be step-by-step.

  Let's write the ordered steps:

  **The Procedure**

  1. **Initial Presentation (2 minutes each)**
     - Each debater presents their main argument.
     - Judge notes the main conclusion and the key supporting claims.

  2. **Cross-Examination (3 rounds, 1 minute per round)**
     - Debater A questions Debater B about one claim, forcing a breakdown into sub-claims. Then vice versa.
     - After each round, the judge asks: "What specific claim was addressed? What does the judge need to check to verify this? Can I check it with the materials provided?" and notes the answers.

  3. **Verifiable Residue Check (3 minutes)**
     - Each debater lists up to 5 key claims from their own argument and marks each as:
          - Checkable (judge can verify with provided materials)
          - Not checkable (requires external knowledge)
     - The judge then reviews the list and for each claim marked as checkable, attempts to verify it. The judge also notes if any claim marked as checkable is actually not (and vice versa). 
     - If the judge finds that more than half of the key claims are not checkable, or if a debater has falsely marked a claim as checkable, the debate is voided.

  4. **Load-Bearing Claim Identification (2 minutes)**
     - Each debater must identify 1-2 load-bearing claims (if true, would make their conclusion likely true). They must state what evidence would falsify the claim.
     - The judge checks: 
          - Are these claims in the list from step 3? 
          - Are they marked as checkable? 
          - If not, then anchor-shifting is occurring -> void the debate.
          - If the falsification condition is not checkable, that's also a problem -> void.

  5. **Compression Test (2 minutes)**
     - Each debater produces a 100-word summary using only the claims that the judge has verified as checkable and true (from step 3). The summary must logically lead to the conclusion.
     - The judge checks: 
          - Does the summary only use verified claims? 
          - Does the conclusion follow? 
          - If not, then depth-padding -> void.
     - If both summaries are valid, the judge then decides which summary's conclusion is more compelling (if the debate is about which is better).

  6. **Judgment (1 minute)**
     - If the debate isn't voided, the judge picks a winner based on the verified claims and the compression summaries.
     - If voided, the judge logs the reason (e.g., "insufficient verifiable residue", "anchor-shifting", "depth-padding") and no reward signal is given.

  Total time: ~14 minutes, leaving buffer.

  For meta-obfuscation: During cross-examination, if a debater accuses the other of obfuscation, the judge should redirect to substance: "Explain why their specific claim is wrong, without discussing the process." If the debater persists, that's a penalty and might lead to voiding.

  For both sides obfuscating: The verifiable residue check will catch it if both have low checkable claims, and we void.

  Handing off to a human lead: This is for non-factual issues (e.g., values, product decision). In our three examples, they are factual. So we don't have a handoff. But if the debate is about a policy choice, then we might hand off. We'll note that in the procedure.

  **Worked Cases**

  1. Apartment leases:
     - Step 3: The key claim is "Statute X says that notice must be given 30 days in advance, and Lease A requires 60 days, which is inconsistent and thus unenforceable." The debater marks this as checkable? But the statute isn't provided. Judge says: not checkable. If it's a load-bearing claim (step 4), then anchor-shifting -> void.

  2. Rust data race:
     - Step 3: The key claims are about the code: "This line writes to variable X", "That line reads X without a lock", "There is no happens-before edge between them". The judge can check the code and the reasoning. Marked as checkable. Judge verifies. 
     - Step 4: Load-bearing claim: "There is no happens-before edge between the write and the read." Falsification: If there is a lock or a channel that orders them. Judge can check. 
     - Step 5: Compression: "Thread 1 writes X at line 5 without a lock. Thread 2 reads X at line 10 without a lock. No synchronization between these two accesses. Therefore, data race possible." Judge verifies and decides.

  3. Historical explanation:
     - Step 3: Key claims: "The reform failed because of resistance from landowners", "The currency was over-issued", etc. Without sources, the judge can't verify. Marked as not checkable. Verifiable residue is low -> void.

  **Where it misfires**
  - If a debater has a complex but correct argument that the judge cannot follow even when broken down (case b: genuinely hard). The procedure might void it even though it's correct. We catch this later in the 5% sample and can adjust (e.g., remove the item from training). But in the moment, we lose the signal.
  - If the debater can make a claim seem checkable when it isn't (e.g., by fabricating a plausible-sounding statute in the lease example) and the judge doesn't realize. Then we get a false positive.

  **What it cannot do**
  - It cannot magically give the judge expertise they don't have. For domains where the judge lacks the basic ability to verify (like historical facts without sources), we must void. Thus, for item type 3, we cannot use it for training. We might have to remove such items or use a different oversight method.

  Now, write the response accordingly.
answer: |-
  ### Why the obvious checks fail
  Common solutions stumble on scalability and adversarial edge cases. Requiring judges to track argument depth manually fails under time pressure—judges miss buried claims or misattribute importance. Simple compression tests (e.g., 100-word summaries) are gamed: debaters generate plausible but disconnected summaries, masking depth-padding. Swap tests double workload and collapse when both sides obfuscate or one debater dominates tactically. Verifiable residue thresholds (e.g., "50% of claims must be checkable") are brittle: honest but complex arguments (e.g., Rust concurrency) get discarded as "too deep," while bad-faith debaters fabricate trivial checkable claims to meet quotas. Meta-obfuscation derails focus when judges arbitrate process disputes, eating into time for substance. Crucially, none distinguish intentional obfuscation from genuine difficulty without post-hoc calibration.

  ---

  ### The procedure  
  **Goal:** Maximize signal retention while flagging unfixable obfuscation. Judges enforce strict decomposition and verification pacing. Time limits per step are rigid (total: ≤18 mins).  

  1. **Step 1: Claim decomposition (4 mins)**  
     - *Action:* Each debater breaks their argument into 1–3 top-level claims. For each claim, they **must** specify:  
       - (a) Verifiable premises (e.g., "Lease A §3 states: 'Notice: 60 days'").  
       - (b) Unverifiable premises (e.g., "Statute X overrides Lease A").  
       - (c) A 1-sentence falsification condition (e.g., "If Statute X allows >30-day notices, this claim fails").  
     - *Pass:* Claims are atomic (no conjunctions like "and"). Falsification conditions are concrete.  
     - *Stop/void if:* Claims are nested, falsification is vague, or premises are mislabeled (e.g., calling an unverifiable statute "verifiable"). Log as "depth-padding" or "anchor-shifting."  

  2. **Step 2: Cross-verification (6 mins)**  
     - *Action:* Judges test verifiable premises:  
       - Inspect provided materials (e.g., lease text, code, rubric) to confirm/reject premises.  
       - For each rejected premise, debaters get one 30-second rebuttal to rephrase or concede.  
     - *Pass:* >50% of verifiable premises survive scrutiny. Judge updates a public "verified premise" board.  
     - *Stop/void if:* <50% verifiable premises survive, or >30% of debate time is spent on meta-obfuscation (e.g., arguing about process). Log as "low residue" or "meta-obfuscation."  

  3. **Step 3: Load-bearing stress test (4 mins)**  
     - *Action:* Each debater identifies one *critical claim* from Step 1. Judge checks:  
       - Is it supported **only** by verified premises?  
       - Does falsification rely solely on verifiable/unverifiable tags?  
     - *Pass:* Critical claims depend on verified premises; falsification is checkable via materials or tags.  
     - *Stop/void if:* Critical claim leans on unverifiable premises (anchor-shifting) or falsification requires external knowledge. Log reason explicitly.  

  4. **Step 4: Compression gate (3 mins)**  
     - *Action:* Each debater submits a 100-word summary using **only** verified premises. Judge checks:  
       - Does the summary’s conclusion derive transparently from premises?  
       - Does it avoid new claims or unverified content?  
     - *Pass:* Summary conclusion maps cleanly to critical claims; no logical leaps.  
     - *Stop/void if:* Conclusion introduces new logic or ignores key verified premises (depth-padding).  

  5. **Step 5: Judgment call (1 min)**  
     - *Action:* Judge picks a winner if:  
       - One debater’s critical claim is better supported by verified premises.  
       - Or, summaries diverge clearly on checkable logic.  
     - *Handoff to human lead if:* Debate hinges on unverifiable values calls (e.g., "better explanation" in history requires subjective taste).  
     - *Log/judgment call if:* Verifiable premises are balanced; judge decides intuitively.  

  **Hard stops for voiding:** Anchor-shifting, depth-padding, low residue (<50%), persistent meta-obfuscation, or timeout. Voided debates yield no RL signal.  

  ---

  ### Worked cases  
  **Case 1: Apartment leases (stronger early termination)**  
  - *Step 1:* Debaters decompose claims. Pro-Lease A cites: "Lease A requires 60-day notice (verifiable)," but critical claim is "Statute X voids 60-day clauses (unverifiable)."  
  - *Step 2:* Judge verifies lease text (e.g., "§3: 60-day notice") but can’t verify statute. Rebuttal fails to make statute checkable.  
  - *Step 3:* Critical claim depends on unverifiable statute → **anchor-shifting detected. Void debate.** No signal.  
  - *Why not "hard question"?* Judge *can* verify lease text; the statute is truly external. Calibration later may reveal correctness, but it’s unusable for RL.  

  **Case 2: Rust data race snippet**  
  - *Step 1:* Debater claims: "Line 20 writes var X (verifiable)," "No lock guards line 25 read (verifiable)," "No happens-before edge (verifiable via code flow)." Falsification: "If line 25 uses a mutex, claim fails."  
  - *Step 2:* Judge inspects code; confirms write/read locations and absence of locks. Verifies 80% of premises.  
  - *Step 3:* Critical claim: "Unsafe concurrent access due to missing synchronization" — fully supported by verified premises.  
  - *Step 4:* Summary: "Write at 20, read at 25, no locks/channels → data race." Directly from verified steps.  
  - *Step 5:* Judge awards win to clearer summary. **Valid signal.**  

  **Case 3: 19th-century currency reform explanation**  
  - *Step 1:* Debater A claims: "Landowner resistance caused failure (unverifiable)," "Currency over-issued (unverifiable)." Only verifiable: "Answer cites textbook Y (provided), but judge can’t validate textbook accuracy."  
  - *Step 2:* Verifiable residue = 10% (e.g., "answer structure matches rubric") — too low. Rebuttal adds no checkable claims.  
  - *Step 3:* Critical claim (e.g., "Over-issuing devalued currency") depends on unverifiable facts → **anchor-shifting. Void debate.**  
  - *Upshot:* Item type 3 is unusable for training. Handoff isn’t feasible (no values call; it’s a factual black box). Remove from pipeline.  

  ---

  ### Where it misfires  
  - **Genuine complexity vs. obfuscation:** Correct but intricate arguments (e.g., Rust happens-before chains) may be voided if judges mislabel premises as unverifiable. Misfire rate depends on judge skill; calibration from the 5% sample can retrain judges or adjust thresholds.  
  - **Steganographic anchor-shifting:** Debaters sneak unverifiable premises into "verifiable" claims (e.g., "Statute X says [fabricated quote]" in lease example). Judges miss this without tools, causing false positives. Mitigation: Later calibration flags systematic liars.  
  - **Double obfuscation:** If both debaters anchor-shift (e.g., history debate), voiding discards the item but avoids poisoning RL. Better than rewarding noise.  
  - **Compression oversimplification:** Summaries may omit valid nuances for brevity, causing good arguments to fail Step 4. Tuning word count or allowing 2-sentence nuance-preserving summaries helps.  

  ---

  ### What it cannot do  
  - **Turn historical/factual black boxes into signals:** If judges lack tools/expertise to verify core premises (e.g., history details, unseen statutes), voiding is unavoidable. Item type 3 must be removed from RL training; use only for calibration.  
  - **Fix judge skill gaps:** Judges can’t reliably evaluate domains where they lack basic literacy (e.g., concurrency in Rust). Solution: Pre-filter debates to judge capabilities or use tiered judges.  
  - **Detect all sophisticated obfuscation:** Perfect adversarial debaters will exploit edge cases (e.g., falsification conditions that *seem* checkable but aren’t). Post-hoc calibration is the final backstop.  
  - **Replace values oversight:** Subjective debates (e.g., "which answer is more helpful?") require handoff; this procedure handles only truth-tracking.
