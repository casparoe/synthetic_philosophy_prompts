prompt: |-
  I sit on the prioritisation committee of a regional health board, and we rank funding proposals without any formula, arguing case by case. I have been reading around social choice theory in the evenings and got pulled up short by Harsanyi's aggregation theorem: as I understand it, if each person's preferences and the social ordering both satisfy the von Neumann–Morgenstern axioms, and the social ordering respects unanimity over lotteries, then social welfare has to be expressible as a weighted sum of individuals' cardinal utilities — which sounds like a derivation of something utilitarian-ish, except that the weights are left entirely free, so it seems to tell me nothing about prioritising the worse off. A colleague says the theorem settles everything and that any residual pull towards priority is simply incoherent; another says we should drop the expected-utility assumption on the social ordering and stop worrying. Before I argue with either of them I want to know what I actually think, so here are my verdicts on a set of hypotheticals, all on a welfare scale where 0 is a life not worth living and 10 is excellent, with everyone stipulated to be risk-neutral wherever that matters and no one else affected. (1) Anna is at 3, Ben at 8, and one of them can get +2 for certain: I give it to Anna. (2) Anna, still at 3, asks for a treatment that gives her a fifty-fifty chance of +4 or −1: I let her have it and I count it as a gain of about +1.5, deferring to her own attitude to risk. (3) Same Anna, but now the committee chooses between a certain +2 for her and a fifty-fifty chance of +5 or −0.5, which she would take: I choose the certain +2, because I don't think we should gamble with the welfare of people who are already badly off — which is the same shape of gamble as in (2) with the opposite verdict, the only difference being who imposes it. (4) Option A inflicts a loss of 6 on one identified patient for certain; Option B spreads it so that sixty patients each face a one-in-sixty chance of the same loss, one person affected in expectation: I take B, and by more than a little, even though everyone involved would be indifferent between the two. (5) Programme P gives +0.1 to each of 10,000 people, a total of 1,000 units; Programme Q gives +5 to each of 100 people, a total of 500: I take Q, because a hundredth of a point on this scale isn't a benefit anyone would ever notice, and I don't think total sums should automatically win. (6) Preventing the existence of ten children whose lives would sit at level 1 strikes me as a larger good than lifting ten existing adults from 3 to 5; but bringing ten extra children into existence at level 8 strikes me as no benefit at all against the same alternative, even though the total is far larger.

  My own tentative principle, such as it is: the weighted sum should govern risks people choose for themselves, something more risk-averse should govern risks we impose on them, and behind the veil of ignorance I should first put a probability over how many people there will be and only then an equal chance over which of them I am — which I think pushes me towards average rather than total welfare and might explain (6). Please take that apart and repair it rather than humouring it. I want a principle, or two or three candidates, stated precisely enough that someone else could apply it: tell me which clause each of my verdicts motivates, what it says about the case I keep going back and forth on (a treatment for 1,000 patients at level 2 that gives each a ninety per cent chance of +3 and a ten per cent chance of −4, with everyone consenting and expected value clearly positive), and what it predicts for some case I haven't listed where it comes apart from a plain weighted sum. Then be honest about which of my verdicts it cannot accommodate and which one I should give up, and say plainly whether what is left still deserves to be called a version of Harsanyi's conclusion or whether I have denied one of its premises — and if so which, and at what cost. Please write in American English, as I am drafting this up with an American co-author; and please argue it out rather than pointing me to a reading list.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're on a health board prioritization committee and are grappling with Harsanyi's theorem and its implications for their decision-making. The user has provided six hypothetical scenarios with their verdicts, revealing a tension between utilitarian aggregation and prioritizing the worse off, especially when risks are imposed.

  First, I need to understand each of their verdicts and how they conflict with Harsanyi. Verdicts 1, 3, and 5 show a preference for helping the worse-off, while verdicts 2 and 4 respect individual risk preferences but diverge when the committee imposes risks. Verdict 6 complicates things with population ethics, rejecting total utilitarianism. The user's tentative principle involves weighted sums for self-chosen risks, more risk-averse approaches for imposed risks, and an average utilitarian view behind the veil of ignorance.

  Harsanyi's theorem requires both individual and social preferences to satisfy vNM axioms and unanimity, leading to a weighted sum of utilities. The user's verdicts violate this in several places. For example, in verdict 3, choosing a certain +2 over a gamble with higher EV for Anna goes against the linear aggregation because it introduces social risk aversion not present in individuals. Similarly, verdict 4's preference for spreading risk despite individual indifference violates the social ordering's adherence to the same vNM axioms.

  The user needs a precise principle that explains their judgments. Their proposed separation between self-chosen and imposed risks is key. For self-chosen risks (verdict 2), they defer to individual risk attitudes, aligning with Harsanyi. But for imposed risks (verdicts 3 and 4), they want a social risk aversion that protects the vulnerable. This suggests a dual framework: one for voluntary gambles and another for social impositions.

  For population ethics in verdict 6, average utilitarianism makes sense. The user values preventing miserable lives but not adding happy ones if existing people aren't affected. Average utility handles this by focusing on per-capita welfare rather than totals. 

  The treatment case (1000 patients at level 2, 90% +3, 10% -4) is tricky. Under their principle, since patients consent, it's self-chosen risk, so the weighted sum applies. Expected gain per person is (0.9*3 + 0.1*(-4)) = 2.7 - 0.4 = 2.3, so total gain 2300. But if consent is token, and the committee imposes the risk, they might use a risk-averse transform. Here, the gamble could drop someone from 2 to -2 (life not worth living), which is catastrophic. So the committee might reject it despite positive EV.

  Testing against an unlisted case: suppose two groups—100 at level 1.5 and 100 at level 8. A policy gives +0.5 to the worse-off or +2 to the better-off. Total utility equal, but user likely prioritizes the worse-off. Their principle would weight the worse-off more, deviating from plain sum. If forced to choose, they might accept violating Harsanyi's vNM for social decisions, as the cost of protecting the vulnerable is worth it. Giving up verdict 4 (spreading risk) might be necessary if they want full coherence, but that seems central to their view. Instead, rejecting linear aggregation for social gambles while keeping it for individual choices could be the compromise. This means denying Harsanyi's premise that social ordering must satisfy vNM axioms, accepting that social values can incorporate risk aversion beyond individual preferences.
answer: |-
  Based on your verdicts and tentative principle, here's a precise, candidate framework that systematizes your judgments, identifies tensions with Harsanyi, and offers clear guidance. This builds on **Dual-Domain Utilitarianism with Risk Contextualism and Average Welfare for Population Ethics**.

  ---

  ### The Proposed Principle
  1.  **Individual Consent Domain:** For gambles *chosen by the affected individuals themselves* (or where their informed, rational preferences are known and respected), social welfare is the **weighted sum of individuals' expected utilities** (Harsanyi-compliant). Weights are positive but need not be equal.
  2.  **Social Imposition Domain:** For gambles *imposed by the social planner* on individuals (even with consent if the choice context is dominated by the planner's authority), social welfare applies a **strictly concave transformation** to individual utilities *before* aggregation. Specifically:
      *   Use a **transformed utility function**: φ(U_i) = U_i for U_i ≥ U_Threshold; φ(U_i) = U_i - k * (U_Threshold - U_i)^α for U_i < U_Threshold.
      *   *Parameters:* `U_Threshold` defines a "badly off" threshold (e.g., 3-4 on your scale). `k > 0` controls aversion to losses for the badly off. `α > 1` ensures increasing penalty as welfare drops further below threshold.
      *   Social welfare = Σ w_i * φ(U_i), then maximize *expected* social welfare.
  3.  **Population Ethics:** Social welfare is the **average utility** of all individuals who *will exist regardless of the choice*, plus the *expected average utility* of individuals whose *existence is contingent on the choice*, calculated under a uniform probability density over possible future identities behind a veil of ignorance (conditional on existence).
  4.  **Weighting:** Weights `w_i` are generally positive. Strong priority to the worse off is achieved primarily via `φ(U_i)` below `U_Threshold` and potentially higher weights `w_i` for those below threshold, but weights alone are insufficient without the transformation.

  ---

  ### How Your Verdicts Motivate Each Clause
  *   **(1) Anna (3) vs. Ben (8):** Motivated by **Weighting (`w_i` higher for worse off)** and/or **`φ(U_i)` transformation**. Giving +2 to Anna yields larger gain in transformed space if she's below threshold.
  *   **(2) Anna's Own Gamble:** Motivated by **Individual Consent Domain**. Respects her risk-neutral valuation (EU= +1.5).
  *   **(3) Committee Imposes Gamble on Anna:** Motivated by **Social Imposition Domain + `φ(U_i)`**. The gamble risks dropping Anna (already below threshold) lower. `φ(U_i)` heavily penalizes outcomes where U_i << U_Threshold (e.g., 3 - 0.5 = 2.5). The certain +2 is safer for her transformed utility.
  *   **(4) Spreading Identified Loss:** Motivated by **Social Imposition Domain + `φ(U_i)`**. The identified patient suffers a catastrophic drop (e.g., 8->2). `φ(U_i)` makes this drop *socially* worse than the EU calculation of the individuals facing tiny risks. Spreading avoids a single catastrophic φ-loss.
  *   **(5) Tiny vs. Substantial Benefits:** Motivated by **`φ(U_i)` transformation implicitly or explicitly**. Benefits below a "just noticeable difference" (JND) might map to Δφ(U_i) ≈ 0, even if ΔU_i > 0. Alternatively, a very high `U_Threshold` (e.g., 8) could make +0.1 irrelevant below it, while +5 for those at low levels generates large φ-gains. Weights could also play a role.
  *   **(6) Population Cases:** Motivated by **Population Ethics Clause (Average Utility)**.
      *   Preventing 10 lives at 1: Improves average (replaces neutral existence or low average with nothing).
      *   Lifting 10 from 3 to 5: Improves average of existing population.
      *   Adding 10 at 8: If existing population average is >8, this *lowers* the average. If =8, neutral. If <8, improves average. Your verdict "no benefit at all" suggests you focus *only* on existing people's average unless the new lives are below some acceptable minimum (handled by `φ` or weights).

  ---

  ### The Treatment Case (1000 @ Level 2, 90% +3 / 10% -4)
  *   **Consent Matters:** You specify "everyone consenting". This strongly suggests the **Individual Consent Domain** applies. Defer to their own risk assessment.
  *   **Calculation (Consent Domain):** Per-person EU = (0.9 * +3) + (0.1 * -4) = 2.7 - 0.4 = +2.3. Total EU Gain = 1000 * 2.3 = +2300. This is substantial.
  *   **Verdict under Principle:** **APPROVE the treatment**. The gamble is chosen by the patients; their positive EU calculation governs. The large total gain reinforces this.
  *   **Caveat:** If "consent" is perfunctory or under systemic pressure (making it effectively imposed), the **Social Imposition Domain** *could* apply. `φ(U_i)` would heavily penalize outcomes where U_i = 2 - 4 = -2 (catastrophic). The EV of φ(U_i) could be negative even if raw EU is +2.3. Your verdict would likely be **REJECT** in this interpretation. *Your principle requires clarifying the nature of consent*.

  ---

  ### Prediction: Where it Diverges from Plain Weighted Sum
  *   **Case:** Two groups. Group A: 100 people at U=2. Group B: 100 people at U=8. We can enact Policy X: Give +1.0 to *everyone* in Group A (Total ΔU= +100). Policy Y: Give +1.1 to *everyone* in Group B (Total ΔU= +110).
  *   **Plain Weighted Sum (Equal Weights):** Chooses Policy Y (ΔΣU = 110 > 100).
  *   **Proposed Principle (Social Imposition):** Assume `U_Threshold=4`, `k=1`, `α=2`.
      *   Group A: φ(U) now: 2 - 1*(4-2)^2 = 2 - 1*4 = -2. After X: φ(3) = 3 (since 3>4? Wait, U=3<4). φ(3) = 3 - 1*(4-3)^2 = 3 - 1 = 2. Δφ = 2 - (-2) = +4 per person. Total Δφ_A = 400.
      *   Group B: φ(8) = 8 (U>Threshold). φ(9.1) = 9.1. Δφ = 1.1 per person. Total Δφ_B = 110.
      *   **Social Welfare Δ:** Policy X: +400. Policy Y: +110. **Chooses Policy X decisively.**
  *   **Divergence:** The principle prioritizes larger gains for the much worse-off Group A via `φ(U_i)`, despite the lower total raw utility gain.

  ---

  ### Honest Assessment: Costs, Accommodation, and Harsanyi
  1.  **Verdicts You Must Give Up (or significantly reinterpret) to be Consistent:**
      *   **(4) Spreading the Loss:** Your principle (Social Imposition Domain + `φ`) *justifies* your verdict. *However*, it **contradicts Harsanyi fundamentally**. Harsanyi *requires* social indifference if all individuals are indifferent (Unanimity over Lotteries). You reject this for imposed risks involving catastrophic losses for the badly off. **Cost:** Violates a core axiom of Harsanyi (Unanimity/Pareto over Lotteries). This is a major departure.
      *   **(3) vs. (2):** Distinguishing based on who imposes the risk is **incompatible with Harsanyi**. Harsanyi treats social choice as an aggregation of *preferences over social states (including lotteries)*. The source of the gamble isn't a primitive. Your distinction is a normative addition. **Cost:** Rejects the idea that social preference can be *solely* derived from individual preferences over outcomes/lotteries. It injects procedural context.

  2.  **Verdicts Accommodated:** (1), (2), (5), (6) can be accommodated well. (3) and (4) are accommodated *by the principle* but *only by violating Harsanyi's axioms*.

  3.  **Relation to Harsanyi:**
      *   **Denied Premise(s):** You fundamentally reject that the **social ordering must satisfy the vNM axioms**, particularly independence and continuity, *in the Social Imposition Domain*. Your `φ` transformation makes social preference over lotteries non-linear in probabilities and dependent on the absolute level of outcomes, violating vNM. You *also* potentially reject **Unanimity over Lotteries (Pareto Indifference over Lotteries)** as shown in (4).
      *   **Retained Premise:** In the *Individual Consent Domain*, you largely retain Harsanyi's framework (weighted sum of EU respecting individual risk attitudes). You also retain a form of weighted sum aggregation, but with transformed utilities (`φ(U_i)`) in the Social Imposition Domain.
      *   **Is it "Harsanyi-ish"?** Only partially. It retains aggregation and cardinal utility but crucially denies that social preference must mirror the vNM structure of individual preferences, especially concerning risk for the worse-off when imposed. It's a *contextual modification*.

  4.  **Costs of Denying Harsanyi's Premises:**
      *   **Loss of Theoretical Unity:** The clean derivation from individual preferences to social welfare is gone. The distinction between domains requires justification beyond preference aggregation.
      *   **Operational Complexity:** Defining "imposed" vs. "chosen" is crucial but potentially fuzzy (as seen in the treatment case). Estimating the `φ` function parameters (`U_Threshold`, `k`, `α`) is value-laden and challenging.
      *   **Potential Incoherence Critics:** Your colleague arguing priority is "incoherent" likely bases this on Harsanyi's theorem showing that *only* weighted sums satisfy the axioms. By denying the axioms (especially vNM for social ordering and unanimity over lotteries), you escape the "incoherence" charge *only* by stepping outside the framework they deem necessary. The debate shifts to whether those axioms *should* constrain social choice concerning the badly off and imposed risks.
      *   **Justification Burden:** You need strong normative arguments for why social aversion to harming the badly off should override respecting individual indifference (in cases like 4) or individual risk-taking (in cases like 3 where the individual *would* gamble).

  ---

  ### Conclusion: Your Principle Refined
  You hold a **contextual prioritarian view**:
  1.  **Respect Individual Risk Choices:** Use weighted EU summation (`Σ w_i * EU_i`) when risks are self-chosen.
  2.  **Protect the Vulnerable from Imposed Risks:** Use a **priority-weighted expected utility** with a concave penalty below a threshold (`Σ w_i * E[φ(U_i)]` with `φ` concave below `U_Threshold`) for socially imposed gambles, especially on the badly off.
  3.  **Focus on Average Welfare:** Use average utility (of necessary plus contingent lives under a veil of ignorance) for population ethics.

  **Regarding Harsanyi:** You reject the requirement that *social* preference must satisfy vNM axioms (independence/continuity) and Unanimity over Lotteries, particularly concerning risks imposed on the worse-off. This is a significant but defensible departure, motivated by a strong commitment to protecting the vulnerable from catastrophic losses imposed by collective action. The cost is complexity and loss of the "derivation" from individual preferences alone. What remains "Harsanyi-ish" is the use of cardinal utilities and aggregation, albeit transformed and contextualized. You haven't settled the philosophical debate with your colleagues, but you've articulated a coherent alternative grounded in your considered judgments.
