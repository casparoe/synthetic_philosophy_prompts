  First, I need to unpack what matters here. The user is frustrated because what seemed like "boring bookkeeping" turned into a major theoretical challenge. Their soft-floor log score (measure 5) seems like an attempt to fix log score's unboundedness while keeping convexity, but they suspect propriety might be the casualty. That local/proper/bounded trade-off suspicion is crucial - if true, it would shape the whole evaluation.

  Looking at their test cases: The Fan (flat credences as partition grows) tests boundedness; Coarsening (same beliefs on different partitions) tests refinement-stability; Over-credence (c=(0.5,0.5,0.5)) checks if measures penalize incoherence. These are smart stress tests.

  For tier ranking: 
  - Log and quadratic are S-tier as standard bearers, but log fails boundedness while quadratic fails refinement-stability. 
  - Soft-floor log (their creation) might be A-tier for fixing boundedness but likely loses strict propriety. 
  - Spherical and city-block have more fundamental flaws - spherical isn't refinement-stable, city-block isn't strictly proper.

  On their key suspicion: Yes, the local/proper/bounded trade-off seems real. Local proper rules are essentially logarithmic (Savage's theorem), so any bounded alternative must sacrifice either locality or propriety. Their soft-floor log probably has improper "kinks" below ε. This isn't just a quadratic score flaw - it's inherent.

  Confidence level: Maybe 0.7? The trade-offs force hard choices. If refinement-stability is non-negotiable, quadratic is out. If boundedness matters most, soft-floor log is interesting despite propriety concerns. But philosophically, I lean toward log score accepting unboundedness as the price for purity.

  The user needs this crisp - no literature reviews, just direct analysis. They're at the stage where they must make a defended choice, not survey options. My response should validate their theoretical insight while being honest about where their pet measure might falter.
answer: |-
  Here’s your tier list and analysis, stripped to essentials. Your suspicion about the local/proper/bounded tradeoff is correct.  

  **Tier List**  
  - **S-Tier (Log Score, #2)**: Only strictly proper, local measure. Gold standard for epistemic arguments. Fails boundedness.  
  - **A-Tier (Soft-Floor Log, #5 & Quadratic, #1)**:  
    - **#5**: Bounded, convex, and refinement-stable. Sacrifices strict propriety (improper for credences near 0 but above ε).  
    - **#1**: Strictly proper, bounded. Fails refinement-stability (sensitive to partition granularity).  
  - **B-Tier (Spherical, #3)**: Strictly proper but not refinement-stable (non-linear aggregation). Bounded.  
  - **C-Tier (City-Block, #4)**: Bounded and refinement-stable, but not strictly proper (permits dominated incoherent credences).  

  **Scores (0–10)**  
  | Measure       | Strict Propriety | Boundedness | Refinement-Stability | Dominance Argument |  
  |---------------|------------------|-------------|----------------------|---------------------|  
  | (1) Quadratic | 10               | 10          | 0                    | 10                 |  
  | (2) Log       | 10               | 0           | 10                   | 10                 |  
  | (3) Spherical | 10               | 8           | 0                    | 10                 |  
  | (4) City-Block| 0                | 10          | 10                   | 0                  |  
  | (5) Soft-Floor| 4*               | 10          | 10                   | 10**               |  
  \*Improper near ε (dominated by slightly higher credences in some cases).  
  \**Works if ε is small enough to avoid dominating coherent alternatives.  

  **On the Tradeoff & Your Suspicion**  
  You’re right: **no measure can be local, strictly proper, and bounded**. Savage (1971) showed that (up to affine transformation) the log score is the only strictly proper, local scoring rule. Boundedness requires suppressing extreme penalties (e.g., your soft-floor’s linear tail), breaking propriety. The log score’s blowup isn’t a bug—it’s necessary for propriety when credences approach 0. Your soft-floor log is improper for credences just above ε (e.g., c_j = ε + δ can be accuracy-dominated by c_j = ε + 2δ). Convexity ensures coherence is optimal *locally* but not that all incoherent credences are dominated *globally*.  

  **Test Cases**  
  - **The Fan**: Log → ∞, others bounded.  
  - **Coarsening**: Log, city-block, soft-floor stable; quadratic/spherical unstable (e.g., (0.34,0.66) vs. (0.34,0.33,0.33) have different inaccuracy).  
  - **Over-credence (0.5,0.5,0.5)**: Quadratic/city-block penalize sum >1; log/spherical/soft-floor treat as middling inaccuracy (no direct sum sensitivity).  

  **Confidence in Top Tier**: **0.7**  
  Log score (S-tier) is the "right" foundation for accuracy-first arguments due to strict propriety/locality, but its unboundedness is philosophically costly. If refinement-stability is non-negotiable, quadratic (A-tier) or your soft-floor (A-tier) are pragmatic alternatives—but both sacrifice core virtues. No free lunch.  

  *—Key regularity: Savage’s theorem requires a smooth (differentiable) scoring rule for locality/propriety, which boundedness violates.*
