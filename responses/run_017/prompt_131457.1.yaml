answer: |-
  ### Stage One: Untangling "Race to the Bottom"  
  A "race to the bottom" is not one mechanism but four distinct phenomena often conflated. Remedies differ critically.  

  1. **Absolute-Level Race (Wasteful Competition)**  
     - **Mechanism**: Competitors escalate inputs (e.g., hours worked, grant applications) to outdo rivals. Absolute costs rise, but outputs don’t improve proportionally.  
     - **Harm**: *Internal* (participants suffer burnout, wasted effort).  
     - **Key Trait**: Waste is *recoverable* if escalation stops.  
     - **Example**: Submitting excessive grant applications when success rates are fixed.  

  2. **Positional Race (Zero-Sum Ranking)**  
     - **Mechanism**: Competitors vie for *relative rank* (e.g., impact prizes, journal rankings). Escalation doesn’t improve collective outcomes—it redistributes fixed rewards.  
     - **Harm**: *Internal* (no one gains; all incur costs).  
     - **Key Trait**: **Cannot be won collectively**. Spending more changes nothing—only rank shuffles.  
     - **Example**: Over-designing travel prize portfolios when only one winner exists.  

  3. **Negative Externality Race**  
     - **Mechanism**: Escalation by Group A harms Group B *outside* the competition (e.g., pollution, journal backlogs from excessive submissions).  
     - **Harm**: *External* (non-participants bear costs).  
     - **Key Trait**: Requires regulation, not mere coordination.  
     - **Example**: Thousand-author papers diluting credit for early-career researchers.  

  4. **Defection Race (Prisoner’s Dilemma)**  
     - **Mechanism**: Mutual cooperation is optimal, but *individual incentives* to defect (e.g., using AI for reports if rivals do) force all into mutually destructive escalation.  
     - **Harm**: *Internal* (participants trapped in inferior equilibrium).  
     - **Key Trait**: All prefer mutual disarmament but can’t trust others.  
     - **Example**: AI-generated referee reports if unregulated.  

  **Your Framing Clarified**:  
  - Internal vs. external harm **are different animals** requiring distinct remedies. Negative externalities demand regulation; others need coordination.  
  - Absolute races waste resources but can be capped; positional races are **structurally unwinnable**—only caps or randomization help.  
  - Moloch (systemic self-destruction) emerges when these overlap.  

  ---  

  ### Stage Two: Decision Procedure  
  **Output**: One-page recommendation for Council (✓ = approve; ✗ = reject; △ = send to Council for values debate).  
  **Input**: Petition + 90 mins of committee discussion. No data required—use qualitative assessment.  

  #### Step 1: Exit Test (5 mins)  
  - **Question**: "Could an individual member *freely* reduce their effort/input without losing essential opportunities?"  
  - **Sufficient Answer**: ✓ = Yes (competition is voluntary; reject petition). ✗ = No (proceed to Step 2).  
  - **Stop Here If**: ✓. *Rationale: No collective action problem if individuals can opt out.*  

  #### Step 2: Negative Externality Test (10 mins)  
  - **Question**: "Does the behavior harm people *outside* the competing group (e.g., early-career researchers, taxpayers)?"  
  - **Sufficient Answer**: ✓ = Yes (proceed to Step 6 for enforcement). △ = No (proceed to Step 3).  
  - **Stop Here If**: △ (hand off to Council). *Rationale: Internal harms require values debate about "fairness."*  

  #### Step 3: Positional Test (5 mins)  
  - **Question**: "Is the reward *entirely* based on ranking (e.g., prizes, limited grants), not absolute thresholds?"  
  - **Sufficient Answer**: ✓ = Yes (proceed to Step 4). ✗ = No (proceed to Step 5).  
  - **Rationale**: Positional races need randomization/abolition; absolute races may tolerate caps.  

  #### Step 4: Winners Test (10 mins)  
  - **Question**: "Would current ‘winners’ support this constraint? (Assess via committee knowledge of incentives.)"  
  - **Sufficient Answer**: ✓ = Yes (proceed to Step 6). ✗ = No (reject petition).  
  - **Stop Here If**: ✗. *Rationale: If winners resist, the petition likely protects losers, not collective welfare.*  

  #### Step 5: Ratchet Test (10 mins)  
  - **Question**: "If pressure eased (e.g., funding doubled), would escalated behavior *persist*?"  
  - **Sufficient Answer**: ✓ = Yes (strengthens case for action; proceed to Step 6). ✗ = No (weakens case; proceed to Step 6).  
  - **Rationale**: Persistent ratchets justify urgency; reversible ones allow monitoring. *Unsettled theory—use pragmatically.*  

  #### Step 6: Enforcement Test (15 mins)  
  - **Question**: "Could this constraint be policed *without* creating new games (e.g., evasion, credential inflation)?"  
  - **Sufficient Answer**: ✓ = Feasible (e.g., simple caps). ✗ = Unworkable (e.g., ban hard to detect). △ = Uncertain (proceed to Step 7).  

  #### Step 7: Displacement Test (15 mins)  
  - **Question**: "If constrained here, would competition shift to a *costlier* arena?"  
  - **Sufficient Answer**: ✗ = Yes (reject petition). ✓ = No (proceed). △ = Unknown (proceed with caution).  

  #### Step 8: Jurisdiction Test (10 mins)  
  - **Question**: "Can we bind ≥70% of relevant actors? Would unbound outsiders *override* the constraint?"  
  - **Sufficient Answer**: ✗ = No (reject petition). ✓ = Yes (proceed to design).  

  #### Step 9: Design & Sunset Clause (10 mins)  
  - **Output Framework**:  
    - **Constraint**: State precisely.  
    - **Sunset Clause**: 3 years unless renewed.  
    - **Observable Metric**: One measurable outcome (e.g., "Average grant applications per member," "Report turnaround time"). Must be trackable with existing data.  
  - **If No Metric**: Reject petition.  

  ---  

  ### Application to Petitions  
  **Petition A: Cap grant applications at 2/year**  
  - Step 1: ✗ (Can’t freely exit—grants essential for labs).  
  - Step 2: △ (Mainly internal harm—proceed).  
  - Step 3: ✗ (Grants have absolute thresholds).  
  - Step 5: ✓ (Ratchet likely—high applications persist even if funding increases).  
  - Step 6: ✓ (Simple to track submissions).  
  - Step 7: △ (May displace effort to fellowship applications).  
  - Step 8: ✓ (Society binds most applicants).  
  - **Recommendation**: ✓ **Approve** with sunset clause. Metric: *Median grant applications per member*.  

  **Petition B: Ban AI-generated referee reports**  
  - Step 1: △ (Can exit individually but lose time/competitiveness).  
  - Step 2: ✓ (External harm: journals overloaded).  
  - Step 6: ✗ (Enforcement impossible; forgery trivial).  
  - **Recommendation**: ✗ **Reject** (fails enforcement).  

  **Petition C: Replace impact prize with lottery**  
  - Step 1: ✗ (Early-career researchers can’t exit safely).  
  - Step 2: △ (Internal harm—proceed).  
  - Step 3: ✓ (Purely positional).  
  - Step 4: ✗ (Winners—senior judges—would oppose).  
  - **Recommendation**: ✗ **Reject** (fails winners test; protects losers). *As you predicted, the procedure rejects this unpopularly.*  

  ---  

  ### Limits of the Procedure  
  **Systematically Over-Regulates**:  
  - Low-stakes positional races (e.g., travel prizes) where harm is minor but tests trigger action.  

  **Systematically Under-Regulates**:  
  - Races with diffuse harms (e.g., author inflation) lacking clear metrics.  
  - Races involving power imbalances (e.g., senior vs. junior researchers).  

  **Do Not Use When**:  
  1. **Crisis Imbalance**: One group (e.g., early-career) has *no voice* in the petition.  
  2. **Data-Free Claims**: No verifiable harm alleged (e.g., "erodes academic values").  
  3. **Existential Threats**: Competition tied to survival (e.g., lab closures).  

  **Final Note**: This won’t prevent all bad rules—but it filters most hopeless cases and forces transparency on values. Revise if new petition breaks it.
