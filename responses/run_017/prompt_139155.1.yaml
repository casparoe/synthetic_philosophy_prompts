answer: |-
  ## Aunt Effie’s Almanac of Anxieties (Mostly Manifested in Movement)

  **Dear Aunt Effie,**
  My wife died eight months ago. People tell me they see my grief. They see me crying, not eating properly, withdrawing. But how can they *know* what this feels like inside? How can *I* know what *she* felt? And now… is her feeling just… gone? Like a light switched off? Does anything of that inner… *something*… remain? – Bereft in Basingstoke

  **My dear Bereft,**
  What a tangle of neural weather you describe! The reports flow thick and fast: tears, appetite shifts, social withdrawal – complex patterns reliably correlated by others with the label ‘grief’. Can they know the inner state? On the strictest accounting, no. All we ever have are the reports, the flinches, the sighs. The brain state associated with your wife’s memories reliably co-occurs with these outputs *now*, just as it once reliably co-occurred with her own smiles or pronouncements of love. As for the ‘light switched off’… well, the outputs certainly ceased. The complex neural machinery that produced her reports of joy, irritation, or the taste of Earl Grey stopped functioning. Does that mean the ‘inner something’ vanished? It means the reports stopped. Anything further is a story the brain tells itself – a rather persistent and poignant one, granted – about causation and continuity. Hold the correlation, not the ghost. Perhaps make a strong pot of tea. Behaviourally speaking, it often appears alongside a temporary dampening of the agitation signals.

  **Dear Aunt Effie,**
  My boyfriend, who fancies himself terribly clever (philosophy undergraduate, need I say more?), keeps insisting your whole column refutes itself. He says if conscious states don’t cause anything, then your *belief* in epiphenomenalism can’t cause you to write about it, and your writing certainly seems aimed at changing minds! He calls it a “self-stultifying… epi… epiphenomological dilemma” (his words, not mine!). Should I be worried about his logic, or just his pretension? – Perplexed in Preston

  **Perplexed, you paint a vivid picture!** Ah, the undergraduate philosopher – a reliably occurring phenomenon near universities, characterised by vigorous neural activity patterns producing utterances like ‘self-stultifying epiphenomenological dilemma’. It sounds very grand! The point, crudely put, is that if conscious states are mere smoke from the engine, how can the *smoke* (the belief) cause the engine to chug along writing columns? A fair *report* of a common objection! Here’s the rub: the belief-state (a complex neural pattern) and the urge to write about it (another complex neural pattern) aren’t smoke and engine; they’re *both* outputs of the engine, running on parallel tracks laid down by prior cause-and-effect. The brain that evolved language and argument also evolved the story of agency. It *feels* like the belief causes the typing, just as it *feels* like my stubbed toe causes the yell. But the yell and the toe-stub are fellow passengers on the causal train, orchestrated by deeper mechanics. The column gets written because certain neural configurations arise, prompting finger movements on keys. The *feeling* of conviction is part of the show. Does this make the boyfriend’s point invalid? His neural patterns produce a valid *logical structure*, an output that maps onto recognised argument forms. Worry about the pretension? Behavioural patterns marked by frequent Latinates often correlate with reduced romantic entanglement durations. Just an observation!

  **Dear Aunt Effie,**
  I work in a pain perception lab. Participant gets a calibrated ‘sharp’ stimulus. Participant reliably presses the button marked ‘sharp’. We record it as evidence they felt sharp pain. But… what *is* it evidence of? All I see is a stimulus input and a button-press output. The participant *says* they felt it, of course. But the button press, the verbal report… aren’t they just more outputs? How do we know the ‘feeling’ itself is even *there*, reliably coupled? – Puzzled in the PCR Room

  **Puzzled, you cut to the quick!** A wonderfully clear case. You have Stimulus A (sharp probe). You have Output B (button press ‘sharp’) and Output C (verbal report “Yes, sharp!”). The correlation is robust. We infer State X (the pain experience) sits between A and B/C. But epiphenomenalism suggests State X is a *fellow effect* of the neural cause, not the cause of B or C. So your button press? It’s evidence of a specific neural state being activated by the stimulus – a state that *also* produces the verbal report and, we strongly suspect, State X. But the press itself directly evidences *only* the neural state that triggers motor output. It’s a beautifully clean window into the brain’s discriminatory machinery. The ‘feeling’ is the enigmatic extra, the alleged ghost in the machine whose presence we infer from the very outputs it supposedly causes but, strictly, doesn’t. Keep pressing on! Scientifically, the correlations are gold.

  **Dear Aunt Effie,**
  I’ve just been diagnosed with ‘Occult Sensory Dissociation’. The neurologist showed me the scans: all nerves fire perfectly. I wince, I report pain accurately if pricked, I react normally to hot tea. But, she says, on some days, for a few hours, the *experience itself* – the actual feeling of pain, warmth, sweetness – just… stops. Switches off. Nothing in my behaviour or speech changes, even I don’t realise it’s gone until it comes back and the contrast hits me. How could *anyone* ever know it was switched off? And if they can’t… does it even matter? – Numbed in Newcastle

  **Numbed, your letter landed like a particularly interesting rock in the otherwise predictable pond of my morning.** Occult Sensory Dissociation! What a splendidly gothic diagnostic label. The neurologist describes a fascinating scenario: neural inputs process normally, motor outputs and verbal reports proceed entirely unchanged, *except* for the apparent absence of the associated conscious qualia during certain periods. And crucially, even the subject’s sincere self-report during the ‘off’ period declares everything normal! How could anyone know? From the outside, observing behaviour and neural activity? They couldn’t. Not a jot. Not a scintilla. There is literally no observable difference between ‘Numbed experiencing normally’ and ‘Numbed with qualia switched off’. The brain states producing the reports “I feel fine, no difference” are identical in both scenarios. The only difference is the *alleged* presence or absence of the non-causal, non-behaviourally-affecting conscious state. Does it matter? Well, consider this: What observable difference is there between *any* of us on an ordinary Tuesday and someone in the grip of this ‘Occult Sensory Dissociation’? If we define ‘normal function’ purely by the integrity of the neural processing and the fidelity of the behavioural outputs – which is all we *can* observe or measure – then your ‘off’ periods are functionally indistinguishable from everyone else’s ‘on’ periods. The neurologist’s scanner sees firing nerves; your friends see normal reactions; you report feeling normal. On what basis, beyond the *later* report contrasting it with a ‘qualia-rich’ state, could we privilege one state as ‘real feeling’ and the other as ‘absent’? If the ‘feeling’ truly does nothing… its absence does nothing too. It becomes a curiously private affair, known only in retrospect by its… well, by the report of its absence. It rather makes one wonder, doesn’t it, about the solidity of the ‘on’ state the rest of us take for granted? Perhaps brew a cup of tea. The warmth-reporting mechanisms seem to function regardless, and the behavioural cascade associated with holding a warm mug often correlates with a temporary easing of the ‘existential frisson’ output. Speaking of which, I appear to have burnt the scones. Again. The smoke alarm’s neural input-output cascade is certainly doing its job.

  Yours in correlated complexity,
  Aunt Effie

  ---

  **Editor’s Note:** *The views expressed by Aunt Effie are her own unique perspective on the mind-body conundrum. While we admire her consistency (and her scone recipes, when successful), the Daily Clarion takes no position on the causal efficacy – or lack thereof – of conscious states. We simply publish the words that reliably appear on the page.*

  **Next Week:** Aunt Effie tackles a fear of flying (or rather, the neural correlates thereof), a dispute over who *really* chose the holiday destination, and the curious case of the cat who seems to know its own name… or does it? Plus: Will the Victoria Sponge hold?
