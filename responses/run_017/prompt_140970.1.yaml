  **Debrief for Part Two:**
  - Some students paid to remove the flexible option (C), some chose the flexible option and then in session 2 splurged (chose to use 2 in session 2), some chose the flexible option and spread (1 in session 2, 1 in session 3), and some chose the restricted option.
  - The ones who paid to remove the option might have done so because they foresaw that they would splurge.
