   Given the complexity, I have provided a design that fits within the constraints. The instructor may need to adjust based on the students' reactions.
answer: |-
  Below is a comprehensive design for your two-part activity on money-pumping, tailored to your constraints. The activity uses "cookie vouchers" (redeemable for cookies at any session) to avoid real money. I address substitutions, bounded bankroll, scripts, handling edge cases, recording sheets, debrief, predictable pitfalls, and philosophical distinctions.

  ---

  ### **Part One: Synchronic Incoherence (Cyclic Preferences)**
  **Goal:** Students experience a cycle of trades that leaves them strictly poorer due to internally inconsistent valuations.

  #### **Materials**
  - **Vouchers:** 160 cookie vouchers (10 per student).  
  - **State Cards:** 16 "A" cards, 16 "B" cards, 16 "C" cards.  
  - **Recording Sheet:** Tracks trades and voucher changes per student (see template below).  

  #### **Payoff Scheme & Bankroll**
  - **Starting Point:** Each student has 10 vouchers and an "A" card.  
  - **Dealer Bankroll:** 48 vouchers (covers 16 students × 3 trades × 1 voucher/trade).  
  - **Voucher Value:** Assume cookies have near-constant marginal utility for 0–10 vouchers (e.g., mini-cookies). To compensate for substitution:  
    - **Cost:** Utility isn’t linear (like money), but with small-stakes/single-session redemption, we approximate neutrality.  
    - **Compensation:** Use vouchers only for this activity (no external trading) and emphasize "no satiation" (e.g., "redeem over weeks").  

  #### **Facilitator Script**  
  *(Total Time: 25 minutes)*  
  1. **Setup (5 min):**  
     - "Today, you’ll trade between three *states*: A, B, and C. States are like different bundles of goods. **Trade only if it improves your position.**"  
     - "Vouchers are for cookies. You value cookies, right? Each voucher = one cookie, redeemable anytime."  

  2. **Trade Rounds (15 min):**  
     - **Trade 1 (A→C):** "Give me your A card and 1 voucher; I’ll give you a C card. Why trade? Because C is *better* than A by more than 1 voucher’s worth!"  
       - *If refusal:* "If you see no benefit, skip. But most find this trade beneficial."  
     - **Trade 2 (C→B):** "Give me your C card and 1 voucher; I’ll give you a B card. B is *better* than C by more than 1 voucher."  
     - **Trade 3 (B→A):** "Give me your B card and 1 voucher; I’ll give you an A card. A is *better* than B by more than 1 voucher."  

  3. **Reveal Outcome (5 min):**  
     - "Check your vouchers. If you did all trades, you started with A+10 and now have A+7. You’re poorer, but each trade felt like a gain. Why?"  
     - **Key Insight:** "No deception, no changed odds—the pump exploits a *pattern* in your responses."  

  #### **Handling Edge Cases**  
  - **Refusal:** "You’re free to skip, but play along to experience the phenomenon. Why might someone refuse if they see the cycle coming?" (Discuss later).  
  - **Renegotiation:** "Trades are final. If you want changes, we’ll discuss in debrief."  

  #### **Recording Sheet Template**  
  | Student | Start | Trade 1 | Trade 2 | Trade 3 | End |  
  |---------|-------|---------|---------|---------|-----|  
  | 1       | A+10  | C+9    | B+8     | A+7    | A+7 |  
  | ...     | ...   | ...     | ...     | ...     | ... |  

  ---

  ### **Part Two: Diachronic Incoherence (Planning vs. Acting)**  
  **Goal:** Students confront reversals between planning and acting. Some pay to remove options, some "defect" from plans, some stick to plans.  

  #### **Materials**  
  - **Vouchers:** 32 cookie vouchers (2 per student initially).  
  - **Commitment Tokens:** 16 cards ("F" for flexible, "R" for restricted, "C" for commitment).  
  - **Recording Sheet:** Tracks choices and outcomes (see template).  

  #### **Payoff Scheme & Bankroll**  
  - **Starting Point:** Each student has 2 vouchers in Session 1.  
  - **Dealer Bankroll:** 16 vouchers (covers 16 students × 1 voucher paid in "commitment").  
  - **Payout Timeline:**  
    - **Session 1 (now):** Choose menu (F, R, or C).  
    - **Session 2 (next week, 5 min):** Flexible students choose redemption; others follow plan.  
    - **Session 3 (following week, 5 min):** Final redemption.  

  #### **Facilitator Script**  
  *(Session 1: 20 min; Sessions 2/3: 5 min each)*  
  1. **Setup (5 min):**  
     - "You have 2 vouchers. Choose how to redeem them over Sessions 2 and 3:  
       - **F (Flexible):** In Session 2, choose to redeem 0, 1, or 2 vouchers; the rest go to Session 3.  
       - **R (Restricted):** Commit now to redeem 1 in Session 2 and 1 in Session 3.  
       - **C (Commitment):** Pay 1 voucher to force R. You’ll have fewer cookies but avoid temptation."  

  2. **Choice & Rationale (15 min):**  
     - "Think aloud: Why might you pay (C) to avoid F? Who’ll pick F and stick to R-like plans? Who’ll pick F and splurge in Session 2?"  
     - *Record choices.*  

  3. **Sessions 2 & 3 (5 min each):**  
     - **Session 2:** "F-choosers: Redeem 0, 1, or 2 vouchers now."  
     - **Session 3:** Redeem remaining vouchers.  

  #### **Handling Edge Cases**  
  - **Refusal:** If a student won’t trade: "You can keep your vouchers, but you’ll miss the learning. What’s your concern?" (Note for debrief).  
  - **Renegotiation:** "Choices are binding. If you regret, we’ll analyze why."  

  #### **Recording Sheet Template**  
  | Student | S1 Choice | S2 Redemption (F only) | S3 Redemption | Outcome |  
  |---------|-----------|-------------------------|---------------|---------|  
  | 1       | F         | 2 (splurge)             | 0             | 2 now, 0 later |  
  | 2       | C         | N/A (committed to R)    | 1             | 1 now, 1 later (net 1 due to cost) |  
  | ...     | ...       | ...                     | ...           | ... |  

  ---

  ### **Debrief (30 min)**  
  Map moments to concepts:  
  1. **Part One (Synchronic):**  
     - **Cyclic Pattern:** Trade sequence (A→C→B→A) exploited inconsistent valuations.  
     - **Argument:** Synchronic incoherence (preferences violate transitivity/independence).  
  2. **Part Two (Diachronic):**  
     - **Three Patterns:**  
       - *Commitment (C):* Paid to avoid future self’s defection.  
       - *Defection (F→splurge):* Used flexibility against their plan.  
       - *Foresight/Plan-Honoring (F→spread or R):* Stuck to plan or valued flexibility.  
     - **Argument:** Reversal between planning (time-consistent) and acting (time-inconsistent).  
     - **Key Moment:** Splurging in Session 2 vs. paying to prevent it.  

  ---

  ### **Predictable Pitfalls & Mitigations**  
  1. **Stakes Too Small:** Students may not engage.  
     - *Mitigation:* Use high-value cookies (e.g., gourmet) and emphasize scarcity.  
  2. **Satiation:** Too many cookies reduce marginal utility.  
     - *Mitigation:* Bound vouchers (≤10) and allow redemption over weeks.  
  3. **Suspicion:** Some guess the twist.  
     - *Mitigation:* Frame as "behavioral experiment"; use ambiguous states (A/B/C).  
  4. **Genuine Preference Change:** Hard to distinguish from reversal.  
     - *Mitigation:* Survey why students changed (e.g., "Did new info emerge?").  
  5. **Ambiguous Foresight:** Can’t externally distinguish plan-honoring from luck.  
     - *Mitigation:* Ask students to explain choices in Session 2.  

  **Unreproducible Element:**  
  - Money-pumping in *neutral* currency (money) has normative force; with cookies, utility isn’t linear. You’ll need to argue that **exploitability in any resource reveals irrationality**, but this is contested (see below).  

  ---

  ### **Settled vs. Contested**  
  **Settled (Consensus):**  
  - Synchronic incoherence (cyclic prefs) enables money-pumps.  
  - Diachronic incoherence (time inconsistency) enables planning-acting reversals.  
  - Commitment devices are rational for time-inconsistent agents.  

  **Contested (Flag Disputes):**  
  1. **Exploitability as Irrationality:**  
     - *Evidential View:* Pumping *reveals* irrationality (e.g., intransitivity).  
     - *Constitutive View:* Vulnerability *is* irrationality (e.g., Dutch books).  
  2. **Sticking to Plans:**  
     - *Coherent:* Resolute choice respects past commitments.  
     - *Violates Sequential Rationality:* "Sunk cost" bias; should re-optimize.  
  3. **Consumption Good vs. Money:**  
     - *Neutrality Matters:* Money-pumping in cash is "purer" (linear utility).  
     - *Generalizable:* Any resource loss reveals inconsistency.  

  ---

  ### **Final Notes**  
  - **Logistics:** Prepare cookies/vouchers ahead. Pre-print recording sheets.  
  - **Ethics:** Use anonymized data; emphasize learning (cookies are bonus).  
  - **Adaptation:** If Part 1 flops, use the assigned-prefs version (see script).  

  This design balances experiential learning with philosophical depth. Students will *feel* the pump and debate its implications—setting up your diachronic rationality lectures perfectly.
