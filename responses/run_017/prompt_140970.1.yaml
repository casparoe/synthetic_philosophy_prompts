  **What will predictably go wrong:**
  - In Part One, students might not take the trades seriously because the preferences are assigned.
  - In Part Two, the consumption good might have satiation: if you have too many cookies, the marginal utility diminishes. We should use a good that has constant marginal utility over the range (0 to 3).
