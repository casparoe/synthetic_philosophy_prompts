  We are given a user with a background in programming language theory (Agda, Lean) and a request to reconstruct Bradley's regress in that vocabulary. The request has five parts, which we'll address in order.

  1. **State the problem in your own words**

     The problem of the unity of the proposition asks why a proposition is more than just a collection of its constituents. For example, the proposition "Socrates is wise" is not just the set {Socrates, wisdom} but a unified whole that asserts something about Socrates. If we try to explain the unity by introducing a relation (say, `InheresIn`) that holds between Socrates and wisdom, then we must ask how this relation is bound to its arguments. If we represent the relation as a separate entity (a reified relation), then we need a further relation to connect `InheresIn` to Socrates and to wisdom. This leads to an infinite regress: we need a relation to connect the first relation to the arguments, then a further relation to connect that second relation, and so on.

     Bradley's own use of the regress was to argue that relations are unreal and that the relational picture of reality (where objects are connected by relations) must be abandoned in favor of a monistic reality (the Absolute). 

     Russell, in his multiple-relation theory of judgment, faced a similar problem. When judging that `aRb`, he thought of judgment as a relation between a subject and the objects `a`, `R`, and `b`. But then what relates `a`, `R`, and `b` in the judgment? If we introduce a further relation, we get a regress. 

     Frege's response was that concepts (and relations) are unsaturated — they have a kind of incompleteness that must be filled by objects. Thus, the relation `R` is not an object but a function that, when applied to `a` and `b`, yields a truth value. The unity comes from the application.

  2. **Rebuild in PLT vocabulary**

     Let's use dependent type theory. Consider a proposition as a type. For example, the proposition that Socrates is wise might be:

     ```agda
     data Socrates : Set
     data Wise : Socrates → Set
     ```

     But the problem arises when we try to represent the relational structure as data. Suppose we have:

     ```agda
     record Relation (A B : Set) : Set₁ where
       field
         rel : A → B → Set
     ```

     Now, to represent the proposition that Socrates is wise, we might try:

     ```agda
     data Individual : Set where
       socrates : Individual

     data Property : Set where
       wise : Property

     -- A reified relation that is supposed to hold between individuals and properties
     data Holds : Individual → Property → Set where
       holds : (x : Individual) (P : Property) → Holds x P

     -- Now, we want to say that Socrates is wise.
     -- But note: we have not connected the property 'wise' to the individual 'socrates' in a proposition.
     ```

     The issue: we have a term `holds socrates wise` of type `Holds socrates wise`. But this is just a term. The proposition we want is that Socrates is wise, which we might have represented as `Wise socrates` (if `Wise` were a predicate). Instead, we've reified the holding relation. Now, to make this reified relation actually do something, we need an interpretation:

     ```agda
     -- We need an interpretation function that maps properties to predicates.
     interpret : Property → Individual → Set
     interpret wise x = ... -- we want this to be the type that represents x being wise.

     -- But then we have to define what the Holds relation means. We might say:
     postulate
       holds-meaning : ∀ x P → Holds x P → interpret P x
     ```

     However, note that `holds-meaning` is a new relation (at the meta-level) that connects the reified relation `Holds` to its intended meaning. Now, to use this, we would have to apply it. But then if we try to reify this new relation, we get a regress.

     Alternatively, consider representing the relational fact as an element of an inductive type:

     ```agda
     data Fact : Set where
       holds : Individual → Property → Fact

     -- But then we need to assign a truth condition to Fact. We might have:
     ⟦_⟧ : Fact → Set
     ⟦ holds x P ⟧ = interpret P x
     ```

     Now, the regress: what is the status of `⟦_⟧`? It is a function that we have defined in the meta-language. If we try to reify it as well, then we would need a type of reified interpretation functions, and then we would need a new function to interpret that, and so on.

     In ordinary dependent type theory, we avoid the regress by not reifying the relation. Instead, we use function application at the judgment level. For example, we have:

     ```agda
     Wise : Individual → Set
     ```

     Then the proposition is `Wise socrates` — a type. The unity is provided by the type system's built-in notion of function application. The cost is that we cannot treat the relation `Wise` as a first-class object in the same way as `socrates` without reifying it. When we reify it (by making it an element of a type, say `Property`), we must then provide an interpretation function (which is a function in the meta-language) and then we start the regress if we try to reify that too.

  3. **What is the unity?**

     The unity of the proposition, in this vocabulary, is the act of forming a type by applying a type constructor (a function) to its arguments. This is done in the judgment `Γ ⊢ P type` for a proposition `P` that is built by application. The derivation of that judgment is what unifies the constituents. 

     However, the derivation is a meta-theoretic object. When we try to make the proposition (the type) the object of an attitude (like belief), we must reify it. For example, we might have a type `Belief : Set → Set` that takes a reified proposition (a type) and returns the type of beliefs about that proposition. But to reify the proposition, we must represent it as a term. We can do this with a universe:

     ```agda
     data U : Set
     El : U → Set

     -- Then we can have:
     Belief : U → Set
     ```

     But note: `El` is the interpretation function. Now, if we want to form a belief about a proposition that involves a relation, we must have the relation as a term in `U`. For example:

     ```agda
     data U where
       individual : Individual → U
       wise : U   -- but then we need to interpret wise as a function? 
     ```

     This approach quickly becomes difficult. We might instead have:

     ```agda
       -- We can have an application constructor in U
       app : U → U → U
     ```

     But then we have to define `El (app a b) = El a (El b)`. This requires that `El a` be a function. But in order for that to work, we must have a universe that is closed under function types. This leads to a hierarchy of universes because we cannot have a type `El : U → Set` without running into the usual universe level issues.

     The key point: reification (via a universe) is what starts the regress because we must then provide an interpretation function. The interpretation function is not reified (it lives in the meta-language) and if we try to reify it we get a regress.

  4. **Is the regress structurally benign or vicious?**

     In dependent type theory, we can avoid the regress by having a hierarchy of universes. For example:

     ```agda
     U₀ : Set₁
     U₁ : Set₂
     ...
     ```

     Then we can have `El₀ : U₀ → Set₀`, `El₁ : U₁ → Set₁`, and so on. The interpretation function for each universe lives in the next higher universe. This is an infinite hierarchy but it is benign because no function has to apply to itself at the same level.

     Bradley's regress, if we model it by an infinite sequence of application operators at higher and higher levels, is also benign in the same way. However, note that Bradley's argument was that the regress shows the relational model is unintelligible. But in type theory, we have a well-defined (though infinite) structure. So we have changed the subject: we have provided a consistent model where the regress is controlled by a hierarchy. 

     Bradley's original regress would be vicious if we required a single level. For example, if we tried to have a type `U : Set` and then `El : U → Set`, we get a contradiction (like Girard's paradox). So at a single level, it is vicious. But with a hierarchy, it is benign.

  5. **Residue report**

     - **Clean mappings**:
       - Frege's unsaturatedness maps to function types. A function is not an object until it is applied. The act of application is primitive.
       - Reification corresponds to introducing a universe or an inductive type for relation symbols.

     - **Distorted mappings**:
       - Truth vs inhabitation: In type theory, truth is represented by inhabitation. But a false proposition is an empty type. This is acceptable in some contexts (e.g., intuitionism) but may not capture the classical notion of truth as correspondence to reality. Also, the truthmaker (the fact that makes the proposition true) is not explicitly represented. We might use a dependent pair: `Σ (x : Individual) (Wise x)` for the fact that someone is wise, but then the proposition `Wise socrates` is made true by the term `(socrates , p)` where `p` is a proof. However, this is still within the language of proofs as terms.
       - The step from the unintelligibility of relational judgment to monism: This has no counterpart. Type theory is comfortable with an infinite hierarchy of universes and does not require the entire structure to be an undifferentiated whole.

     - **No counterpart**:
       - The act of judging and its force: In type theory, we have judgments (like `Γ ⊢ t : T`) but the act of asserting is not represented. We only have the static proof objects.
       - The demand that a theory explain unity rather than legislate it: In type theory, the unity of the proposition is provided by the primitive rules of function application and type formation. We do not derive it; we take it as given.

     **Verdict**: The residue is not a defect of the vocabulary. The vocabulary of dependent type theory is designed to avoid the regress by building in application as a primitive. The original demand for an explanation of unity may be less clear than it looked. For example, why should we expect a further explanation of how the function applies to its arguments beyond the rules of the system? 

     The translation is largely on Frege's side: we treat relations as functions and application as primitive. Bradley's own conclusion (that relations are unreal and monism is true) is not expressible in this vocabulary because it requires a metaphysical step that the formal system does not take. To express Bradley's conclusion, we would need a vocabulary that allows for the rejection of relations altogether and a move to a non-relational reality. This might be a vocabulary without function types, or with a primitive notion of unity that cannot be decomposed. But then we would have to explain how to do without relations in the formal system, which is difficult because even the formation of a judgment requires some structure.

     **Explicit note on application**: The kernel of dependent type theory includes application as a rule (the elimination rule for function types). This is exactly Frege's unsaturatedness. By making it a rule, we stop the regress at the first step. Bradley's regress arises only when we try to represent the relation as an object (a term). So the distinction is: in the object language, relations are functions (unsaturated) and application is built in; in the reified representation (the universe), we have to provide an interpretation function (which is meta-theoretic) and if we try to reify that, we get a benign regress that is handled by a hierarchy.

     In conclusion, the residue is mostly a sign that the original problem is dissolved by the type-theoretic approach: we have a clear account of unity at the judgment level, and we can handle reification with care (using universes and a hierarchy). The demand for an explanation of unity beyond the primitive rules of the system is not met, but that demand may be misguided in this setting.
answer: |-
  ### Reconstruction of Bradley's Regress in PLT Vocabulary

  #### 1. Problem Statement
  The unity of the proposition asks why "Socrates is wise" is a single truth-bearing unit, not merely the collection `{Socrates, wise}`. If we add a relation `R` binding them (yielding `R(Socrates, wise)`), we must now bind `R` to its arguments. This demands a new relation `R'` binding `(R, Socrates, wise)`, which itself requires `R''`, ad infinitum. Bradley used this regress to argue relations are unreal, implying reality must be a non-relational Absolute. Russell faced a similar regress in his multiple-relation theory: what "glues" the subject to the objects in a judgment? Frege avoided this by making concepts *unsaturated*—they inherently require completion by arguments.

  #### 2. Rebuilding the Regress
  Consider a proposition as a type. Let `Socrates : Entity` and `wise : Entity → Prop`. The unified proposition is `wise Socrates : Prop`. But if we **reify** the relation as data:  
  ```agda
  data Relation : Type where
    WiseRel : Relation  -- Reified 'wise'

  -- Interpretation as function
  ⟦_⟧ : Relation → (Entity → Prop)
  ⟦ WiseRel ⟧ = wise
  ```  
  To apply `WiseRel` to `Socrates`, we need an application operator:  
  ```agda
  apply : (r : Relation) → (x : Entity) → ⟦ r ⟧ x
  ```  
  But `apply` itself is a relation binding `r` and `x`. Reifying *it* starts the regress:  
  ```agda
  data ApplyRel : Type where  -- Reifies 'apply'
    App : ApplyRel

  ⟦_⟧₁ : ApplyRel → (Relation → Entity → Prop)
  ⟦ App ⟧₁ r x = ⟦ r ⟧ x

  apply₁ : (a : ApplyRel) → (r : Relation) → (x : Entity) → ⟦ a ⟧₁ r x
  apply₁ App r x = ⟦ r ⟧ x
  ```  
  Now `apply₁` requires a new reified `ApplyRel₂`, and so on.  

  **Stopping the regress**: DTT halts this by keeping application primitive. The typing judgment `Γ ⊢ f a : B` uses built-in function application. Reification is deferred to universes:  
  ```agda
  data U : Type₁ where  -- Universe of reifiable types
    entity : U
    rel : U

  El : U → Type
  El entity = Entity
  El rel = Relation  -- Relation is now a Type, not a function
  ```  
  The cost: `El` (the interpreter) lives in the metatheory. If we reify `El` itself, we need `U₂ : Type₂`, starting a **benign hierarchy** (e.g., `Type₀ : Type₁ : ...`).  

  #### 3. What Provides Unity?
  Unity is **judgmental**, not representable as a term. The derivation of `Γ ⊢ wise Socrates : Prop` unifies constituents via application as a primitive rule. The proposition's unity is the act of derivation itself.  

  When we make a proposition the object of an attitude (e.g., belief):  
  ```agda
  Believe : (p : Prop) → Type
  ```  
  We must reify `p` as a term. Using a universe:  
  ```agda
  data U : Type₁ where
    prop : U
    imply : U → U → U

  El : U → Type
  El prop = Prop
  El (imply a b) = El a → El b
  ```  
  But `El` is meta-theoretic. Reifying it would restart the regress, requiring `U₂`. The attitude `Believe` now operates on codes (`U`), not raw propositions. Unity shifts to the derivation of `El (imply prop prop)`, which relies on primitive application.

  #### 4. Benign or Vicious Regress?
  Bradley's regress is **vicious** if we insist relations must be reified *at the same level* as their arguments. The infinite tower of `applyₙ` operators mirrors this:  
  ```agda
  apply₀ : ApplyRel₀ → Relation₀ → Entity → Prop
  apply₁ : ApplyRel₁ → ApplyRel₀ → Relation₀ → Entity → Prop
  ...  
  ```  
  Unlike a universe hierarchy (`Typeᵢ : Typeᵢ₊₁`), each `applyₙ` requires a *new* type of relations, not a higher universe. DTT avoids this by:  
  - Keeping application as a primitive judgment.  
  - Allowing a hierarchy where `ApplyRelᵢ : Typeᵢ₊₁`.  

  Bradley assumes relations must be "completed" at a single level—a demand DTT rejects via universes. This changes the subject: Bradley’s monism has no analog in DTT’s stratified hierarchy.

  #### 5. Residue Report
  **Clean mappings**:  
  - Frege’s unsaturatedness → Function types (`A → B`). A function cannot be an argument without reification.  
  - Reification → Universe encoding (`U` and `El`).  

  **Distorted mappings**:  
  - Truth vs. inhabitation: `⊢ p : True` (inhabited) vs. classical truth. A false proposition is an uninhabited type, but "Socrates is wise" being false doesn’t require a "truthmaker" term—only the absence of a proof.  
  - Proposition vs. fact: The fact `SocratesIsWise` might be a term, but `wise Socrates` is a type. No direct analog.  

  **No counterpart**:  
  - Bradley’s monism: DTT’s universe hierarchy doesn’t imply relational unreality.  
  - The *force* of judgment: DTT derivations (`Γ ⊢ t : T`) are static; they don’t model the act of judging.  
  - Explaining unity: In DTT, application is primitive. Bradley’s demand for an explanation beyond "the rules say so" has no traction.  

  **Verdict**:  
  The residue stems from **unclear original demands**, not defects in DTT. Bradley’s regress assumes relations *must* be reifiable at the object level without primitive application. DTT shows this is optional: application can be judgmental (Frege’s move) or stratified (benign hierarchy). To express Bradley’s conclusion (relations are unreal), we’d need a vocabulary where:  
  - All relations are reified by default.  
  - Application is not primitive.  
  - An infinite regress implies contradiction (e.g., via a fixed-size universe).  

  DTT quietly sides with Frege: application is a kernel rule. Bradley’s monism remains foreign—it requires a metaphysics where "relation" is a suspect category, something formalizable only in logics that reject relations entirely.
