  I'll structure my response to first articulate each theory's core position, then systematically address each probe, noting where theories succeed or struggle, before concluding with an overall assessment of their relative strengths and dependencies.
answer: |-
  ## Adjudicating Accounts of Slurring Terms

  This adjudication compares Prohibitionism and Expressivism as accounts of slurring terms (S) and their neutral counterparts (C). Each will be presented in its strongest form before addressing the four probes.

  **Prohibitionism (Strongest Form):** S and C share identical semantic content: identical extension, identical contribution to truth conditions, and identical behaviour under semantic embeddings (e.g., negation, conditionals). The *only* difference is pragmatic: S is subject to a strict social prohibition against its use. This prohibition *constitutes* its offensiveness; the offense *is* the breaking of this conventional ban. Offense does not stem from the expression of falsehood or any inherent semantic derogation, but purely from violating the convention. The prohibition arises due to historical associations of hatred or oppression linked to S, but its *current* force is maintained by the convention itself.

  **Expressivism (Strongest Form):** S and C share the same core descriptive content concerning the group referred to (i.e., the same extension). However, S *conventionally encodes* a distinct, non-truth-conditional element: a derogatory attitude (e.g., contempt, dismissal, assertion of superiority) towards the target group. This attitude is part of the conventional meaning of S, triggered by its use. The offense stems directly from the expression of this encoded attitude. The difference between S and C is thus semantic (though non-truth-conditional) and concerns *what is conventionally expressed*, not merely a prohibition on use. The attitude is tied to the word type, not solely dependent on the speaker's momentary intention or context.

  **Probe 1: The Embedding Test**

  *   **Observed Pattern:** The offensiveness of S persists robustly under semantic embeddings:
      *   Negation ("John is not an S"): Still offensive; denies group membership but retains slur's derogatory force.
      *   Conditionals ("If he is an S, he can't join"): Offensive; the slur's derogation colours the hypothetical.
      *   Questions ("Is John an S?"): Highly offensive; asking the question using S expresses the attitude.
      *   Indirect Reports ("Mary said John is an S"): *Highly* problematic and often offensive; reporting the slur typically involves re-using it and thus re-expressing the derogation, even when attributed. Speakers often avoid direct quotation ("Mary used a slur for John").
      Confidence stems from linguistic intuition and observed social reactions: uttering S in these contexts typically causes offense regardless of the embedding, demonstrating the derogation isn't cancelled.

  *   **Prohibitionism:** Predicts the pattern poorly. If offense is *solely* breaking the prohibition, embeddings shouldn't matter – uttering S *itself* is the transgression. The theory struggles to explain why "Mary said John is an S" feels more offensive than paraphrasing without S ("Mary insulted John based on his group"), or why asking "Is John an S?" is offensive while asking "Is John a C?" is not, if the *only* issue is uttering the prohibited word S. It must *stipulate* that the prohibition applies to *any utterance containing S*, regardless of semantic context, making the offensiveness context-insensitive in a way that seems brute and fails to capture the *derogatory* nature persisting within embeddings.

  *   **Expressivism:** Predicts the pattern well. If S conventionally encodes a derogatory attitude, that attitude is expressed whenever S is uttered, regardless of truth-conditional operators like negation or conditionals. The attitude is part of the word's conventional meaning, activated by its use. Indirect reports are particularly telling: reporting "Mary said John is an S" requires the reporter to *use* S, thereby expressing the encoded attitude themselves while attributing it to Mary. This explains the strong recoil. The explanation flows naturally from the core commitment that S encodes attitude.

  *   **Verdict:** Expressivism handles embedding far better. Prohibitionism requires a significant, context-insensitive stipulation about the scope of the prohibition.

  **Probe 2: The Sealed Ban**

  *   **Scenario:** A clinical term is banned purely for administrative tidiness; no prior contempt, replacement term is neutral. Later, the word causes recoil.

  *   **Prohibitionism:** Predicts the recoil directly and easily. The offense *is* the breaking of the established prohibition. The reason for the ban's origin (tidiness vs. hatred) is irrelevant; the convention itself is what matters. This is a point in its favour, demonstrating the core mechanism: prohibition *creates* offense. However, it potentially *reduces* its position by showing that the offense generated isn't necessarily *derogatory* in the way slurs typically are – it might feel more like breaking a severe taboo or uttering a profanity than expressing contempt for a group. This highlights a weakness: prohibitionism struggles to distinguish the *specific kind* of offense caused by slurs (group-directed hatred) from offense caused by other severe taboos.

  *   **Expressivism:** Does not predict the recoil based on its core commitments. If the word never conventionally encoded a derogatory attitude (it was a neutral clinical term, banned arbitrarily), then uttering it shouldn't express such an attitude. Expressivism must explain the recoil as something *other* than the expression of the encoded attitude central to slurs. It might appeal to:
      *   *Metalinguistic Negativity:* The word becomes associated purely with transgression and prohibition itself, triggering a reaction akin to hearing any severely tabooed word (e.g., a profanity), not group-directed contempt.
      *   *Suspicion of Attitude:* Hearers, aware of the ban but not its arbitrary origin, might *suspect* the speaker endorses the *reason* they imagine caused the ban (presumed historical hatred).
      However, these are significant additions or shifts away from the core machinery (conventional encoding of attitude). They feel somewhat *ad hoc* and struggle to explain the *specificity* of the patients' reaction if it feels like slur-recoil rather than taboo-violation recoil. The explanation is less direct and less principled.

  *   **Verdict:** Prohibitionism predicts the recoil straightforwardly, strengthening its case for this specific mechanism, though potentially weakening its claim to capture the *distinctive* nature of slur offense. Expressivism struggles and needs significant, less principled supplementation.

  **Probe 3: The Orphaned Word**

  *   **Scenario:** S was a slur in a lost language, survives as neutral C in neighbours' language. Etymology is revealed. Does it become offensive? Retroactively taint innocent uses? What if borrowed onto a different group?
      *   **Become Offensive?** Intuition suggests yes, once the history is known, using the word *as the ordinary term* becomes problematic or offensive for speakers aware of the history, even within the neighbour language. It feels like using a reclaimed slur without reclamation.
      *   **Retroactive Taint?** Intuition suggests no; the innocent speakers weren't expressing a derogatory attitude they were unaware of. The offense is prospective.
      *   **Language Matters?** Intuition suggests yes; using the word *within the neighbour language* where it was the neutral term is less immediately offensive (though potentially insensitive once history is known) than using it *in the original language* (if revived) or in a new context where its history is invoked to cause offense.
      *   **Borrowed Variation:** If borrowed onto a completely different Group D in Language Z, does it carry offense? Intuition strongly suggests no, unless the borrowers *know* its history *and* intend to invoke it derogatorily against D. Otherwise, it's just a new, potentially arbitrary label for D.

  *   **Prohibitionism:** Struggles profoundly. The offense is tied to a *current* prohibition. In the neighbour language, there *was* no prohibition against using their ordinary term C. Revealing its history doesn't automatically create a *binding convention* against it (though it might *lead* to one). It cannot explain why the word *feels* offensive once the history is known *before* a new convention is established. It cannot explain the differential effect based on language (no prior prohibition in neighbour language). For the borrowed case: if no prohibition exists in Language Z regarding this word for Group D, prohibitionism predicts no offense. This matches the intuition but only by effectively admitting that offense *isn't* solely about prohibition *in this case*; the history matters. It needs significant, unprincipled stipulation about *how* and *when* etymology triggers a new prohibition. It risks arbitrariness.

  *   **Expressivism:** Handles this well. The history reveals that the word *conventionally encoded* a derogatory attitude in its original context. Once known, using it *as if it were neutral* in *any* language becomes problematic because speakers aware of the history understand it *carries that historical weight*; they risk being seen as invoking or endorsing that encoded attitude, or at minimum being crassly insensitive to it. The offense isn't retroactive for innocent speakers because *they* weren't exploiting or invoking the conventional attitude – it wasn't part of the convention *they* were using. The attitude is tied to the word's *type* and its historical convention. Language matters because the *convention* is language-specific. Using it in the neighbour language invokes a weaker convention (neutral) layered over a discovered dark history, making it sensitive but perhaps reclaimable. Using it knowingly in a context evoking its original language/use strongly invokes the derogatory convention. For the borrowed case onto Group D: If borrowed innocently into Language Z with no knowledge of the history and no intent to derogate D, the word *does not carry the derogatory convention* for D. It lacks the necessary historical and conventional link to that attitude for that group. The core machinery (conventional encoding tied to word-type and target group within a linguistic community) provides principled resources to differentiate these cases.

  *   **Verdict:** Expressivism provides a significantly more principled and predictive account. Prohibitionism is reduced to stipulating arbitrary conventions and struggles with the role of historical meaning.

  **Probe 4: The Ventriloquist**

  *   **Pattern:** Offensiveness varies dramatically with context:
      *   **Licensed (or less offensive):** Actor delivering historical line (in character), judge reading defendant's words verbatim (in court record), linguist writing S on blackboard (for analysis), witness quoting assailant ("He called me an S!").
      *   **Unlicensed (highly offensive):** Documentary narrator using S descriptively (not quoting), judge using S in their own commentary, linguist casually using S in conversation, defendant proudly repeating their own slur.
      Licensing depends on role (actor vs. narrator), medium (academic analysis vs. casual speech), audience (courtroom vs. street), and crucially, the *purpose* – quotation, citation, analysis, or endorsement/use.

  *   **Prohibitionism:** Explains the pattern poorly. If offense is simply uttering the prohibited word S, all these utterances should be equally offensive. It must bolt on massive exceptions: "The prohibition doesn't apply when..." and list contexts like quotation, academic discussion, legal reporting. This list feels entirely *ad hoc* and extrinsic to the core machinery. It provides no principled reason *why* these contexts are exceptions beyond social practice. This is highly damaging, as the core claim (offense = breaking prohibition) is utterly context-insensitive without these arbitrary exemptions.

  *   **Expressivism:** Explains the pattern as a principled application of its core view. The offense stems from the speaker *expressing the derogatory attitude conventionally encoded by S*. In licensed contexts:
      *   The actor/defendant reading/judge quoting/witness recounting is *not* expressing their *own* contempt; they are *reporting* or *demonstrating* the attitude expressed by another (the character, the original defendant, the assailant). The focus is on the reported use.
      *   The linguist writing on the board is *mentioning* the word for analysis, not *using* it to express an attitude towards the group.
      The unlicensed contexts involve the speaker *using* S to express their *own* derogatory attitude (narrator, judge commenting, linguist conversing, defendant boasting). The core distinction between *using* a word to express its conventional content (attitude included) versus *mentioning* it or *reporting its use* by others provides a principled framework. While drawing the line can be complex, the explanation flows naturally from the semantic commitment to conventional expression.

  *   **Verdict:** Expressivism integrates the licensing pattern naturally. Prohibitionism requires damaging, unprincipled exceptions.

  **Overall Verdict and Relationship**

  Expressivism emerges as the account in significantly better shape overall. It handles embedding, the orphaned word, and ventriloquism robustly and with minimal ad hoc adjustment, leveraging its core commitment to conventionally encoded attitude. Its explanation of the sealed ban is weaker, requiring supplementation, but this supplementation (metalinguistic negativity/suspicion) is less damaging than the fundamental failures of Prohibitionism elsewhere. Prohibitionism's strength in the sealed ban is real but comes at the cost of reducing the distinctive nature of slur offense to a generic prohibition and failing catastrophically on embedding, orphaned words, and ventriloquism without arbitrary stipulations.

  **Rivalry and Dependence:** The theories are genuine rivals offering fundamentally different explanations for the offense of S: conventional prohibition vs. conventionally encoded attitude. However, a nuanced view suggests Expressivism may implicitly *require* something *like* prohibition for full explanation. The *strength* and *social force* of the derogatory attitude encoded by S seems inextricably linked to social histories of oppression and the consequent severe *taboos* surrounding its use. While Expressivism explains *what* is expressed (the attitude), the *intensity* of the offense and its quasi-moral dimension might stem from the profound social harm historically associated with that attitude, leading to prohibition. Prohibitionism, conversely, utterly fails without borrowing Expressivism's core insight about derogatory content to explain the embedding and ventriloquism patterns. The dependence runs primarily from Prohibitionism needing Expressivism's machinery to avoid irrelevance, while Expressivism may acknowledge the role of social prohibition/harm as the *source* or *reinforcer* of the attitude's conventional encoding and potency, without making prohibition the *definition* of offense.

  **Strongest Objection to Prohibitionism:** The most devastating objection to Prohibitionism is its **abject failure to explain the embedding test**, particularly indirect reports. If offense is *solely* the act of uttering the prohibited word S, then "Mary said John is an S" should be offensive only because the *reporter* uttered S, equivalent to saying "S" alone. This fails to capture why this report is profoundly offensive *as a report of Mary's bigotry* and why paraphrasing without S ("Mary used a slur against John") avoids the core offense while still conveying the same information about Mary's act. Prohibitionism cannot explain the *derogatory content* persisting within the semantic context; it reduces all offense to a crude act of transgression, severed from meaning. This renders it incapable of accounting for the fundamental linguistic behaviour of slurs.
