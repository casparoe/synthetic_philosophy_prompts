  The four probes present interesting challenges:
  1) The embedding test examines how slurs behave in negations, conditionals, questions and indirect reports. Both theories need to explain why offensiveness persists even in these embedded contexts.

  2) The sealed ban scenario describes a hospital banning a term for administrative reasons, with no original derogatory intent. Later generations recoil at the word. This tests whether offense can emerge purely from prohibition.

  3) The orphaned word case involves a historical slur whose offensive origins are forgotten and then rediscovered. This probes whether offensiveness is inherent or socially constructed, and how it transfers across languages.

  4) The ventriloquist examines contexts where slurs are quoted (by actors, judges, etc.), testing when such usage is licensed and whether theories can explain this systematically.

  I notice the user emphasizes British English and constrains me to avoid real examples or academic citations. I must use S/C placeholders and argue purely from conceptual commitments. The word limit of 1000-1200 words requires tight focus.

  For my analysis, I'll need to:
  - Deduce each theory's predictions for each probe from first principles
  - Identify where commitments underdetermine responses
  - Evaluate whether necessary stipulations are principled or ad hoc
  - Compare explanatory power
  - Finally render a verdict on which account is stronger overall

