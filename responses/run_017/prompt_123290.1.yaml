  Write it in my terms, not in the jargon of the literature, and don't give me names, papers, or a reading list — I can't check them and I don't care who said what first. Start with one sentence on whether my friend's "it's just a least fixed point" line survives the translation, then go straight into the translation itself with no preamble and no restating of what I asked for, and put the residue report at the end.
