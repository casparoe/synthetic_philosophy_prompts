  I'm a compiler/PL person — mostly Rust by day, I did one graduate course on denotational semantics and I've since written a couple of little fixpoint-based static analyzers — and I've fallen into a rabbit hole on the liar paradox because a friend in a philosophy PhD program told me, very confidently, that the standard response to it is "basically just a least fixed point construction." I want to know whether that's true or whether she's flattening something. So here's the ask: restate the main families of response to the liar in the vocabulary I actually think in — evaluation relations, ⊥ and nontermination vs. uncaught exceptions vs. type errors, monotone operators on lattices and their least fixed points, three-valued logic as short-circuit evaluation with an error value, reification/quote and eval, quines and fixed-point combinators, guarded or corecursive definitions, type-level stratification, abstract interpretation if it helps — as faithfully as you can, and then give me a residue report on what didn't make it across.

  My rough map of the territory, so you can see where I'm coming from (fix it if I've got it wrong): (1) the hierarchical view, where a truth predicate for a language can't live in that language, so you index truth into levels and the liar never gets built; (2) the fixed-point view, where you start with the truth predicate's extension and anti-extension both empty and repeatedly apply an evaluation scheme until it settles, at which point the liar sentence gets assigned nothing at all and is neither true nor false; (3) the glut view, where the liar comes out both true and false and you weaken the consequence relation instead of the semantics; (4) the "don't look for a fixed point, look at the sequence" view, where you keep revising a hypothesis about which sentences are true and then classify sentences by whether their status ever stabilizes; and (5) views where the truth predicate's extension shifts as you go, so the liar is harmless but "true" is subtly context-dependent. For each, tell me what it looks like in my terms, where the translation is exact, where you had to fudge, and what has no counterpart at all.

  Things I keep tripping over, which I'd rather you take up in your own way than answer with a yes or no: whether the iteration in (2) is really the same move as taking a least fixed point of a monotone operator on a CPO — the evaluation scheme has to be monotone for that to work, and I can't tell if demanding monotonicity is a technical convenience or is doing real philosophical work; whether there are two different three-valued schemes, one where a compound gets a classical value as soon as its parts settle it even if the rest are undefined (that looks to me exactly like short-circuit evaluation) and a stricter one where any undefined part poisons the whole compound like an exception, and whether that choice changes which sentences come out undefined; whether "truth-value gap" is more like ⊥ as an ordinary value or more like an exception you're not allowed to catch, because if its the first one and the language lets me test for it as a ground value I can apparently rebuild a paradox out of "this sentence is false or undefined," which I gather is the so-called revenge problem, whereas if it's the second one revenge seems to just not arise, which is suspicious enough that I assume I'm missing something; whether the T-schema is the same kind of claim as eval(quote(e)) = e, i.e. a commuting diagram or an evaluator being a left inverse of a reifier, and whether its failure under diagonalization is ordinary Gödel/Turing diagonalization (which I know perfectly well survives in total languages) or something else; and whether the fact that untyped languages have fixed-point combinators and quines and yet don't explode means self-reference was never the real problem, or whether I'm just conflating inconsistency with partiality, i.e. conflating different failure modes. Then the residue: is there anything left over that my vocabulary simply cannot say — the normativity of truth, maybe, or the claim that being gappy isn't just having a third value — and for each such leftover,