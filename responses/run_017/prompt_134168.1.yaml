  ### Dichotomous Key for Illocutionary Acts

  **Instructions:** Start with a bare description of an utterance-in-context. Answer each question based solely on observable features of the situation. Proceed to the next node as directed. Terminal leaves classify the act and note problematic cases. Categories are mutually exclusive; etiolated uses are isolated upfront. Empty cells in the logical space are marked with explanations.

  ---

  #### Key Structure:
  1. **Internal Nodes**: Binary questions answerable from context (no theoretical jargon).  
  2. **Terminal Leaves**: At most 14, each with:  
     - Category name (or "unnamed" if undefended).  
     - Canonical example.  
     - Problematic case (one sentence).  
  3. **Empty Cells**: Marked as:  
     - 💀 **Incoherent**: Logically impossible.  
     - ⚠️ **Unattractive**: Theoretically possible but implausible.  
     - ❓ **Undefended**: No major theory occupies this space.  

  ---

  #### The Key:
  0. **Is the utterance produced in a non-serious context (e.g., theater, poem, joke)?**  
     - **Yes** → **Leaf 1: Etiolated Use**  
       - *Example*: An actor on stage saying, "I promise to pay you Tuesday."  
       - *Problematic*: Recorded apologies lack sincerity but aren't etiolated—they're institutional.  
     - **No** → Proceed to Q1.  

  1. **Does the act require an institutional framework (e.g., laws, roles, rituals) to succeed?**  
     - **Yes** → Proceed to Q2.  
     - **No** → Proceed to Q6.  

  2. **Is the utterance intended to describe existing reality (word-to-world fit)?**  
     - **Yes** → Proceed to Q3.  
     - **No** → Proceed to Q4.  

  3. **Is the utterance intended to change reality to match its content (world-to-word fit)?**  
     - **Yes** → **Leaf 2: Declaration**  
       - *Example*: Officiant saying, "You are now married" (valid license).  
       - *Problematic*: Common-law marriage variants blur institutional boundaries.  
     - **No** → **Leaf 3: Verdictive**  
       - *Example*: Jury foreperson stating, "We find the defendant not guilty."  
       - *Problematic*: Posthumous degrees force world-to-word fit onto the past.  

  4. **Is the utterance intended to change reality to match its content (world-to-word fit)?**  
     - **Yes** → **Leaf 4: ❓ Empty (Undefended)**  
       - *Why*: No theory posits purely world-changing institutional acts without descriptive intent (e.g., a "pure command" in court lacks examples).  
     - **No** → Proceed to Q5.  

  5. **Is the act conventionally recognized as having illocutionary force?**  
     - **Yes** → **Leaf 5: ❓ Empty (Undefended)**  
       - *Why*: Institutional acts with no direction of fit (e.g., state-mandated small talk) are unattractive and undefended.  
     - **No** → **Leaf 6: Perlocutionary Effect Only**  
       - *Example*: Statutory clause deeming a notice "served" without human uptake.  
       - *Problematic*: Smart contracts automate outcomes but resemble declarations.  

  6. **Is the utterance intended to describe existing reality (word-to-world fit)?**  
     - **Yes** → Proceed to Q7.  
     - **No** → Proceed to Q8.  

  7. **Is the utterance intended to change reality to match its content (world-to-word fit)?**  
     - **Yes** → **Leaf 7: ❓ Empty (Undefended)**  
       - *Why*: Non-institutional declarations (e.g., "I quit!" in a casual setting) are undefended (Searle requires institutions).  
     - **No** → **Leaf 8: Assertive**  
       - *Example*: "It is raining."  
       - *Problematic*: Self-verifying acts ("I assert that I’m asserting") are parasitic on assertives.  

  8. **Is the utterance intended to change reality to match its content (world-to-word fit)?**  
     - **Yes** → Proceed to Q9.  
     - **No** → Proceed to Q10.  

  9. **Is the change intended to be effected by the speaker?**  
     - **Yes** → **Leaf 9: Commissive**  
       - *Example*: "I promise to pay you tomorrow."  
       - *Problematic*: Self-nullifying vows ("I promise to never promise again") are paradoxical.  
     - **No** → **Leaf 10: Directive**  
       - *Example*: "Please close the door."  
       - *Problematic*: Hints ("It’s cold here") rely on inference, not direct force.  

  10. **Is the act conventionally recognized as having illocutionary force?**  
      - **Yes** → **Leaf 11: Expressive**  
        - *Example*: "I’m sorry for your loss."  
        - *Problematic*: Chatbots ("I understand your frustration") decouple speaker from sincerity.  
      - **No** → **Leaf 12: Perlocutionary Effect Only**  
        - *Example*: A scream causing fear (no conventional force).  
        - *Problematic*: Expired-license marriages may cause belief but lack illocutionary status.  

  ---

  #### Collapsed Categories & Empty Cells:
  - **Behabitives (Austin) and Expressives (Searle) collapse** into Leaf 11 (e.g., thanking, apologizing).  
  - **Verdictives (Austin) and Assertives (Searle) remain distinct** due to institutional vs. non-institutional divide.  
  - **Empty Cells**:  
    - **Leaf 4 (Institutional, world-to-word only)** ❓ Undefended.  
