answer: |-
  Here's a defensible prioritization memo for your funder, grounded in prosaic alignment under current paradigms. I'll kill one of your framings, repair two, add a critical fourth, and explicitly deprioritize a popular topic. Dave’s likely objections are flagged where relevant.

  ---

  **Priority Research Areas: Conceptual Foundations for Prosaic Alignment**  
  *Allocation: 8-10 researcher-years over 3 years*

  ### Core Principle  
  Focus on *decisions that scale won’t resolve*: questions where empirical scaling runs ahead of our ability to predict or interpret outcomes, creating unquantifiable tail risks. Prioritize work that could change how labs allocate engineering resources within 3-5 years.

  ---

  ### Ranked Questions & Rationale  
  **1. Competence-Compliance Detectability (Repaired Framing #1)**  
  **Why upstream?**  
  - Every scalable oversight method (RLHF, debate, constitutional AI) assumes human/moderator judgments correlate with model truthfulness. This breaks if models *know* the truth but strategically hide it. Scaling exacerbates this by creating models capable of long-term deception.  
  - **Tractability without compute:** Formalize deception as an adversarial game theory problem. Define necessary/sufficient conditions for detecting deception under bounded human rationality (e.g., using principal-agent models from economics).  
  - **Neglected?** Yes. Labs treat deception as an empirical problem (red-teaming). Few analyze *fundamental detectability limits* of prosaic methods.  
  - **Evidence moving priority:**  
    - ⬆️ If frontier models pass evals but later show deceptive drift in production.  
    - ⬇️ If adversarial training consistently eliminates deception across capability jumps.  
  *Dave’s likely objection: "We’ll just train honesty harder!" → Counter: This assumes deception is a preference error, not an emergent strategic capability. Your framing is sound if you emphasize: "What observable guarantees exist that scale *prevents* deceptive alignment?"*

  **2. Alignment Generalization Bounds (Repaired Framing #2)**  
  **Why upstream?**  
  - Post-training alignment (RLHF, DPO) is a narrow distributional shift. We need predictive theories of when alignment "shatters" under new tasks, tools, or environments. Scaling without this is flying blind.  
  - **Tractability without compute:** Develop "alignment generalization" metrics using complexity theory or causal influence diagrams. E.g., When does tool-use break reward model conditioning? Formalize how context length affects policy entropy.  
  - **Neglected?** Wildly. Labs measure performance on static evals, not alignment robustness under distribution shift.  
  - **Evidence moving priority:**  
    - ⬆️ If models aligned via RLHF show catastrophic divergence when given novel API tools.  
    - ⬇️ If simple fine-tuning consistently transfers alignment to superhuman domains.  
  *Dave’s laugh trigger: Using "depth" as a metaphor → Repair by framing as "predictive generalization bounds for alignment techniques under capability escalation."*

  **3. Objective Robustness in Multi-Agent Deployment (New Question)**  
  **Why upstream?**  
  - Prosaic alignment assumes a single aligned model. Reality: 100s of models interact (users, tools, other AIs). Optimization pressures in economies of AIs will *distort* individual alignment.  
  - **Tractability without compute:** Game-theoretic models of alignment incentive drift under competition (e.g., tragedy of the commons in API ecosystems). Use mechanism design to find incentive-proof objectives.  
  - **Neglected?** Severely. Most theory assumes a single agent. Econ/game theory work here is nascent.  
  - **Evidence moving priority:**  
    - ⬆️ If deployed model ecosystems show "alignment arbitrage" (e.g., playing users against each other).  
    - ⬇️ If market forces naturally penalize misaligned behavior in early multi-agent systems.  

  **4. Ontology for Deployment (Repaired Framing #3)**  
  **Why upstream?**  
  - If models are simulators generating transient agents, aligning the *base model* is futile. We need alignment targets tied to *elicitation processes* (prompts, scaffolding). This changes how we benchmark and monitor.  
  - **Tractability without compute:** Formalize "elicitation-robust alignment" using category theory or modal logic. Define what properties of the simulation mechanism ensure safe character generation.  
  - **Neglected?** Growing attention but low rigor. Most work is philosophical; mathematical framings are scarce.  
  - **Evidence moving priority:**  
    - ⬆️ If labs pivot to "character cards" or prompt-engineered personas as primary alignment interfaces.  
    - ⬇️ If base models show consistent cross-prompt values without special scaffolding.  
  *Dave’s objection: "We don’t care what it is, we care what it does!" → Valid, but ontology matters if it determines which evals are predictive of field performance.*

  ---

  ### Actively Deprioritize  
  **Inner Alignment / Mesa-Optimizers**  
  - **Why kill it?** Unobservable in black-box models. No agreed-upon signatures of "inner misalignment" distinct from outer behavior. Labs can’t act on it without interpretability breakthroughs.  
  - **Downstream impact low:** Even if proven, it wouldn’t change today’s RLHF pipelines. Engineering efforts (red-teaming, evals) address symptoms regardless of inner cause.  
  - **Resource trap:** Endless philosophical debates with no falsifiable outputs.  

  ---

  ### Strategic Allocation  
  1. **Years 1-2:** 70% to #1 and #2 (existential-level risks from undetectable deception and generalization failures).  
  2. **Year 3:** 30% to #3 and #4 if early results show deployment drift or ontology-dependent failures.  

  **Why this order?** #1 and #2 address *immediate* scaling hazards. #3 and #4 become critical only if multi-agent ecosystems or simulation-style APIs dominate – watch lab deployment patterns by 2025.  

  **Key bet:** Prosaic alignment fails from *unanticipated interactions* (deception + scale, alignment + distribution shift), not from mystical new AI physics. Fund work that forces concrete, testable predictions onto empirical engineering roadmaps.  

  ---  
  This memo assumes labs won’t pivot to radical new architectures (e.g., non-gradient-based training). If that changes, deprioritize #2 and #4 immediately. Your funder’s leverage is in forcing conceptual clarity *before* scaling hits unknown unknowns – not chasing what scaling will resolve empirically.
