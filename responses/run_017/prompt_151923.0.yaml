  - Whether propositions have constituents (they likely do, but structure matters more than atomism - say 0.7)
  - Whether the regress is vicious (operator approach may avoid infinite chains by being functional - 0.65)
  - Unsaturatedness coherence (Frege-inspired view isn't just relabeling - 0.6)  
