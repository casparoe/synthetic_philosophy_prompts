prompt: |-
  I direct a long-running cohort study — the Kiruna Register: roughly 40,000 people born between 1955 and 2015, genome-wide genotypes, unusually detailed environmental records, and repeated measurements on a standardized apparatus of a composite I will call saccadic reacquisition latency (SRL), the time in milliseconds needed to re-fixate a target after an unpredicted displacement. Heritability estimates for SRL are constantly quoted back at me: by clinicians deciding whom to screen, by colleagues in education deciding whether a training programme is worth funding, and occasionally by people who want an argument that no intervention could help. I end up having to rule, case by case, on whether a given inference from a heritability estimate is legitimate. My verdicts are stable, but I cannot get them to fall out of the one-sentence definition I was taught, and two pairs of them seem to pull against each other. I would like the principle I am actually applying, stated precisely enough to return verdicts on cases I have not considered, together with an honest account of where it refuses to follow me.

  My cases and verdicts.

  A. A GREML estimate in unrelated cohort members puts narrow-sense heritability at 0.42. Inference: genetic differences among these people account for roughly two-fifths of the variance in SRL, given the environments this cohort actually occupied and the measurement procedure we used. I allow this.

  B. Same number. Inference: two-fifths of any given person's SRL is genetic, the rest environmental. I disallow this.

  C. We introduce a revised training protocol; mean SRL improves by 15 ms, the variance is essentially unchanged, and individuals keep roughly their relative standing. Inference: the 0.42 must have been an artefact, since the trait turns out to be trainable. I disallow this. I also disallow the symmetrical inference that the 0.42 shows training is pointless.

  D. Mean SRL is 8 ms higher for men than for women; within-sex heritability is about 0.40. Inference: part of the sex difference is therefore genetic. I disallow this, though I grant it may well be true. My reason: the within-sex decomposition does not constrain the between-sex mean, and sex is not a genetic contrast of the kind the estimate partitions.

  E. Mean SRL improved by 20 ms between the 1955 and the 2015 birth cohorts; within-cohort heritability stayed near 0.40; allele frequencies at the associated loci are essentially unchanged. Inference: the improvement is environmental. I allow this. I am aware this sits badly with D, and I would like to know whether one of the two verdicts has to go or whether the asymmetry is principled.

  F. Nearly everyone in the cohort was given, in childhood, a then-standard medication with a known effect on vestibular development; within the cohort, genetic differences in how the drug is metabolised explain a large share of the variance in SRL. Inference: SRL is therefore substantially genetic, and withdrawing or replacing the drug would not change matters much. I disallow both halves, the second emphatically. My reason: a trait can owe its existence entirely to an environmental agent in the difference-making sense and still be highly heritable, because heritability partitions differences among individuals while holding the shared cause constant.

  G. Two indirect-effect cases, which I think are the real problem.
  G1. Infant SRL at six months is substantially affected by maternal genotype acting through the intrauterine environment. Regressed on the child's own genotype, heritability is 0.15; computed so as to include the maternal contribution, it is 0.55. My verdict: both numbers mean something, but only 0.15 is the heritability; 0.55 answers a different question, about how much the trait runs in families and how fast it would respond to selection.
  G2. SRL in eight-year-olds is affected by whether a parent reads to the child daily, and that parental behaviour is itself heritable and correlated with the child's genotype. Structurally this is the same pattern: genes acting through an environment the parents provide. My verdict: I want to say this one is not genetic at all, and that the 0.55-style number here is misleading rather than merely different. I cannot explain why it differs from G1 except that the pathway is behavioural rather than biological, which strikes me as a prejudice rather than a principle.

  H. A second register in another country, with different diet and schooling but broadly similar allele frequencies at the associated loci and the same apparatus, gives 0.20. Inference: heredity matters less there. I allow the comparison but only under a gloss — that the difference is owed to a wider spread of environments and to weaker genotype-environment covariance, not to genes having become less important to any individual's SRL — and I disallow the further claim that the trait is intrinsically more genetic in Kiruna than elsewhere.

  A case I cannot settle. For the subsample that underwent the new training protocol we computed the heritability of the improvement itself, post minus pre: 0.60. Half of me says the gain is measured, it varies, and it plausibly predicts who will benefit from the protocol, so it has a heritability like anything else. The other half says the gain is a function of two potential outcomes only one of which was ever observed for any individual, so either it is not the kind of quantity that can have a heritability at all, or its heritability licenses a different set of inferences from a heritability of SRL.

  A tentative principle of my own, to be tested rather than deferred to: heritability is the proportion of phenotypic variance in a specified population — under a specified distribution of environments, a specified measurement procedure, and a specified rule for which causal pathways count as genetic — that is statistically attributable to genetic differences among the individuals in that population; it licenses exactly that attribution and, for the selection-relevant variant of the quantity, the prediction of within-population response to selection via the breeder's equation; and it licenses nothing about the causes of an individual's trait value, nothing about differences between populations or between periods, nothing about what would happen under an intervention the population has not experienced, and nothing about whether a trait is genetic in any intrinsic or counterfactual sense.

  What I want from you. Test that principle against A through H and repair it where it gives the wrong verdict or no verdict. Say explicitly which heritability your principle is about — narrow-sense additive, broad-sense, SNP-based, twin-based — and whether the principle itself changes when the estimator does, since in my data the SNP-based figure (0.42) and the twin-based figure (0.58) disagree in a way I have never been able to adjudicate. Make the pathway-counting rule in G1 and G2 explicit and tell me whether any non-arbitrary rule separates them, or whether I must drop one of those two verdicts. Tell me whether D and E can both stand, and if so which clause does the work and what ancillary premise is being smuggled in. Give me your verdict on the gain-score case. Then construct three cases of your own that I have not listed, state what the repaired principle says about each, and say plainly which of my verdicts it cannot accommodate and which of those you would overturn. Argumerather than summarise; I am not asking for the literature or for citations, only for the principle and its consequences.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're running a cohort study called the Kiruna Register with detailed genetic and environmental data, focusing on a trait called Saccadic Reacquisition Latency (SRL). The user is frustrated because heritability estimates are being misinterpreted by various stakeholders—clinicians, educators, policymakers—and they have to constantly judge whether these interpretations are valid. They've listed several cases (A to H) with their verdicts and want a precise principle that can consistently explain these judgments. 

  First, I need to understand the core issue. The user's tentative principle emphasizes heritability as population-specific, context-dependent, and not applicable to individual causes, population differences, or counterfactuals. Their verdicts mostly align with this, but there are tensions in cases D and E, G1 and G2, and the unresolved gain-score case. The user also mentions discrepancies between SNP-based and twin-based heritability estimates, which adds another layer of complexity.

  Starting with cases A and B, the user allows attributing variance proportions to genetics in the specific cohort (A) but disallows splitting an individual's trait into genetic/environmental fractions (B). This makes sense because heritability is about variation within a group, not individual causation. The principle should explicitly state that heritability is a population statistic, not decomposable at the individual level.

  Case C deals with trainability. The user disallows both inferring that heritability is an artifact because training worked and that training is pointless. Here, the key point is that heritability doesn't predict response to interventions that change environments. The principle must clarify that heritability is descriptive of a specific context, not predictive of interventions.

  Cases D and E are tricky. D disallows attributing sex differences to genetics based on within-sex heritability, while E allows attributing cohort improvements to environment. The asymmetry might be because sex is a categorical variable with potential environmental differences, while cohort changes involve temporal shifts where environmental changes are measurable. The principle needs to address that between-group differences can't be inferred from within-group heritability, but E might involve known environmental shifts. So, an ancillary premise about observed environmental changes could justify E without contradicting D.

  Cases G1 and G2 involve indirect genetic effects. The user distinguishes maternal genotype acting biologically (G1) from parental behavior (G2), wanting G2 to be "not genetic at all." This seems inconsistent. The principle should treat both as genetic influences through pathways, but clarify that "genetic" in heritability includes any causal path from genotype to phenotype, regardless of mediation. The user's discomfort might stem from conflating "genetic" with "biological," but the principle should remain neutral on pathway types. However, the user might need to accept both as valid heritability estimates with different interpretations.

  The unresolved gain-score case involves heritability of improvement from training. The user is torn between seeing it as a measurable trait and recognizing it's a derived measure. The principle could allow heritability for the gain as a new phenotype in that specific intervention context, but caution against generalizing beyond that scenario.

  For SNP vs. twin heritability differences, the principle should specify that narrow-sense heritability (additive genetic effects) is the reference, acknowledging that different estimators capture different components. Twin-based includes non-additive effects or shared environment, so discrepancies are expected. The principle remains the same, but the estimator choice affects interpretation.

  The user's deeper needs include a robust framework to counter misuse of heritability, clarity in communication, and resolving internal inconsistencies in their judgments. They might also seek validation of their nuanced understanding against oversimplified interpretations common in interdisciplinary discussions.

  Constructing test cases: 
  1. Cross-cultural GxE interaction where heritability differs due to environmental range. The principle would attribute the difference to environmental variance and GxE, not genetic importance changes.
  2. Epigenetic heritability where early environment alters gene expression. The principle treats this as environmental influence on phenotype variance, even if mediated biologically.
  3. Heritability of trauma response where the trauma is environmental but genetic sensitivity varies. The principle allows heritability estimates in exposed populations but doesn't imply inevitability for individuals.

  The user might need to adjust verdicts in G2 to align with G1, accepting that heritability can include indirect behavioral pathways. D and E can coexist if E's environmental change is documented, while D lacks evidence for genetic causation of sex differences. The gain-score heritability is valid for predicting differential response to that specific training but not for broader claims.
answer: |-
  Your tentative principle is fundamentally sound, but requires refinement to resolve tensions in your verdicts and address unresolved cases. Below, I articulate a repaired principle, test it against your cases, specify its scope, resolve G1/G2 and D/E, adjudicate the gain-score case, and provide new test cases.

  ### Repaired Principle
  **Heritability (narrow-sense, \( h^2 \)) is the proportion of phenotypic variance in a defined population—under prevailing environmental conditions, measurement protocols, and causal pathways—that is linearly attributable to additive genetic differences. It licenses:**  
  1. Attribution of population-level variance proportions in the observed context.  
  2. Prediction of short-term response to selection (via breeder’s equation) *within that population and context*.  
  **It does NOT license:**  
  - Claims about individual trait composition (e.g., "X% of Jane’s SRL is genetic").  
  - Inferences about between-group mean differences (e.g., sexes, cohorts, populations).  
  - Predictions about trait changes under unobserved interventions or environments.  
  - Claims that a trait is "intrinsically" genetic/environmental.  
  - Inferences where "genetic" pathways include *indirect* effects mediated by environmental covariates (unless explicitly partitioned).  

  **Scope:** This applies to **narrow-sense heritability** (additive effects). Discrepancies between estimators (SNP-based \( h^2 = 0.42 \) vs. twin-based \( h^2 = 0.58 \)) arise because:  
  - SNP-based \( h^2 \) captures only tagged additive genetic variation.  
  - Twin-based \( h^2 \) includes non-additive effects or shared environment if the equal environments assumption is violated.  
  *The principle holds for both, but the estimator choice affects interpretability:* Twin-based estimates may inflate \( h^2 \) if non-additive/shared environmental confounds exist; SNP-based estimates are conservative but miss rare variants. Your Kiruna data discrepancy likely reflects these limitations.  

  ---

  ### Verdicts on Your Cases  
  **A:** **Allowed.** Direct application: \( h^2 = 0.42 \) quantifies additive genetic contributions to SRL variance *in this cohort*.  
  **B:** **Disallowed.** Principle prohibits individual-level attribution.  
  **C:** **Disallowed both inferences.** Heritability describes status quo variance decomposition; it does not predict nor preclude trainability. The unchanged variance post-training implies stable *relative* genetic influences, consistent with \( h^2 \).  
  **D:** **Disallowed.** Sex difference is a between-group mean contrast; within-sex \( h^2 \) does not inform its cause. Ancillary premise: Sex categories correlate with environmental differences (e.g., socialization, hormones), violating the "genetic contrast" requirement.  
  **E:** **Allowed**, but only with an ancillary premise: **Documented environmental changes** (e.g., nutrition, education) explain the cohort improvement. Within-cohort \( h^2 \) stability and static allele frequencies rule out genetic shifts as the driver. *Asymmetry with D is principled:* E involves temporal environmental change evidence; D lacks evidence that sex difference is genetic.  
  **F:** **Disallowed both halves.** Heritability reflects variance under the drug’s presence; it cannot predict effects of removing the drug (an unobserved intervention). High \( h^2 \) under medication does not imply SRL is "intrinsically" genetic.  
  **G1/G2 Pathway-Counting Rule:**  
  - **Rule:** "Genetic" pathways count only if the causal chain originates in the *focal individual’s genotype* and is not mediated by *environmental covariates that could be independently manipulated*.  
  - **G1:** **Allowed** both estimates. Maternal genotype → intrauterine environment → child SRL is a *biological mediation* inseparable from the child’s phenotype. \( h^2 = 0.15 \) (child’s genotype only) and \( h^2 = 0.55 \) (including maternal genotype) answer distinct questions.  
  - **G2:** **Disallowed** treating \( h^2 = 0.55 \) as heritability. Parental reading is an *environmental mediator* that could be altered without genetic change (e.g., via policy). The correlation arises from genetic nurture, not direct biological mediation.  
    - *Non-arbitrary Separation:* Pathways are distinguished by whether the mediator is a *plausible intervention target* independent of genotype. Biological uterine effects (G1) are not readily manipulable; parental behavior (G2) is.  
  **H:** **Disallowed** "heredity matters less there." **Allowed** comparison with gloss: Lower \( h^2 \) reflects greater environmental heterogeneity or reduced \( r_{GE} \) in the other cohort, not weaker genetic effects per individual.  

  **Gain-Score Case Verdict:**  
  - **Heritability of gain (0.60) is valid** for the subsample undergoing training.  
  - **But it licenses only:**  
    (a) Variance attribution for *improvement under this protocol* in this population.  
    (b) Predicting differential response to *the same training* in similar individuals.  
  - **It does NOT license:**  
    - General claims about "trainability" unrelated to this protocol.  
    - Inferences about gains from other interventions.  
  *Rationale:* The gain is an observed phenotype (post-pre difference) in a defined context. While it relies on counterfactuals (pre-training SRL), its measurement is empirical.  

  ---

  ### New Test Cases & Principle Application  
  **Case I: Gene-Environment Interaction (GxE)**  
  A subgroup in Kiruna exposed to high lead levels shows \( h^2 = 0.10 \) for SRL; unexposed subgroup shows \( h^2 = 0.50 \). Inference: Lead exposure suppresses genetic expression.  
  - **Principle Verdict:** **Allowed.** \( h^2 \) is context-specific; differing environments alter genetic variance expression.  

  **Case J: Cross-Population Selection Prediction**  
  Using Kiruna’s \( h^2 = 0.42 \) to predict SRL response to selection in the other country’s cohort (\( h^2 = 0.20 \)).  
  - **Principle Verdict:** **Disallowed.** Heritability is population-context-specific; breeder’s equation applies only within the source population.  

  **Case K: Non-Additive Variance**  
  Twin-based \( h^2 = 0.58 \) includes dominant genetic effects. Inference: SRL is more "genetically determined" than SNP-based \( h^2 = 0.42 \) suggests.  
  - **Principle Verdict:** **Disallowed.** "Genetic determination" implies fixity; heritability (even broad-sense) does not measure this. Narrow-sense \( h^2 \) (additive) is relevant for selection; non-additive effects reduce selection efficacy.  

  ---

  ### Unreconciled Verdicts & Overturned Judgment  
  - **G2 Must Be Revisited:** Your verdict ("not genetic at all") conflicts with G1. The repaired principle treats both as genetic influences *in the observed context*, but G2’s pathway is excluded from "heritability" if the mediator is intervenable. However, \( h^2 \) still measures *familial transmission* (via genes + environment). To align:  
    - **Revise G2 Verdict:** Allow \( h^2 = 0.55 \) as a heritability estimate *for this population*, but emphasize it conflates direct genetic and genetic-nurture effects.  
  - **D/E Asymmetry Upheld:** D lacks evidence for genetic causation of sex differences; E has evidence for environmental causation of cohort changes. The "ancillary premise" (observed environmental change) justifies E.  

  ### Final Principle Summary  
  **Heritability is a context-dependent variance ratio—not a causal parameter. It answers: "In this population, under current conditions, how much do genetic differences contribute to trait differences?" Nothing more.** Your Kiruna data discrepancies (SNP vs. twin \( h^2 \)) reflect methodological limits, not principle failure. The gain-score heritability is valid for protocol-specific prediction but extends no further. Pathway partitioning hinges on intervenability of mediators. D/E stand due to evidence asymmetry.  

  This framework disallows overreach while respecting heritability’s utility for within-context inference and selection prediction—precisely the guardrails your stakeholders need.
