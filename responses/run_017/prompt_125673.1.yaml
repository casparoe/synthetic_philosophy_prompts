prompt: |-
  Hi — you're a professional moral philosopher who's spent real time on the moral worth literature, so please take this seriously and don't hand me a survey of positions. Before you write, brainstorm three or four candidate setups and throw out the first two obvious ones, then commit to the one you think actually survives. Think carefully, and don't hedge at the end.

  Some context, because it's why I care: I coordinate volunteers at a hospice, and every year we give out a "volunteer of the year" award. This year the two finalists are clearly both great, and my friend on the committee keeps saying it doesn't matter *why* they did any of it, only that they showed up, and I keep saying it obviously matters, and neither of us can say what would settle it. So I want a case built to order, and I want to know whether our award criteria are even coherent.

  The build. One paragraph, realistic — a ward, a hospice, a workplace, that kind of thing. No philosophy-fiction, no trolleys, no devices.

  Two agents, A and B, who each perform the same morally required action. Hold fixed everything I care about: same act, same effort, same cost to them, same consequences, both would do it again, both believe the action is required, both believe that truly, neither is mistaken about any moral fact, neither is a hypocrite, a prig, self-deceived, or angling for credit. The only thing that differs is the motivational structure:

  - A is moved by the consideration that the action is required. That's genuinely what moves her, she'd avow it, and her belief is true.
  - B is moved by a desire with no moral content in it. Test I'll apply: if I can paraphrase what moved her using only non-moral vocabulary, it passes. So no wanting-to-be-a-good-person, no guilt, no anticipated shame, no eye on praise or reputation.

  Here's the direction I need, and it's the one people find hard: on the *tracking* view — worth is a matter of the mechanism producing the action being genuinely responsive to the right-making features of the situation, and what you'd avow can come apart from what your mechanism is keyed to — B comes out with **more** moral worth than A. On the *duty* view — worth requires performing the action because you take it to be required — A comes out ahead of B. Both verdicts have to fall out of the views, not be stipulated by you making one of them nasty: A's belief must be true, A must not be a bad person or a fanatic (she wouldn't lie or harm anyone on instruction), and it shouldn't be part of the story that duty is generally a poor guide. The gap has to come entirely from what each mechanism is keyed to. Also: B is not allowed to be a Huck Finn rerun — she must not be acting against her own judgment about what's best, no inverse akrasia, no conscience-versus-sympathy thing. That shortcut is banned.

  After the paragraph: show the reasoning for each of the two views, name the single structural feature doing the work, show what happens to both verdicts if you delete that feature (it should collapse back into an ordinary mixed-motive case where the two views agree), and tell me how a defender of whichever view comes out worse would attack the case and whether that attack is any good.

  One more thing if you want it, and it's the bit I actually suspect is the real point: add a third agent C who trusts her own spontaneous motives not at all and has deliberately trained herself to consult a rule and act on it — a kind of prosthetic duty, self-installed because she knows she can't be relied on unprompted. Say what each view says about C, and whether that shows the duty-versus-desire contrast was a red herring all along.

  And give me a definite verdict: does the case work, and which of the two views gets it right? Actually pick a side and own it. If you think some part of my spec is unsatisfiable, say plainly which bit and hand me the closest case that does work with a note on what you had to relax. Also flag anywhere your answer is leaning on a contested reading of one of the views rather than on something both sides would grant — that's the part I'll get pushed on by my friend, and I'd rather know in advance.
reasoning: |-
  Okay, let me tackle this user's complex moral philosophy query about moral worth in hospice volunteer awards. The user wants a realistic case study that distinguishes between the "tracking view" and "duty view" of moral worth, with specific constraints. 

  First, I need to understand the core challenge: creating two agents (A and B) who perform identical good actions but differ only in motivation. A acts because it's morally required, B acts from non-moral desire. The case must avoid common pitfalls like inverse akrasia or hypocrisy. 

  I brainstormed four setups:
  1. Obvious: Volunteer motivated by duty vs sympathy (too cliché, violates "no conscience-vs-sympathy" rule)
  2. Tempting but flawed: Rule-follower vs naturally empathetic person (risks implying duty is inferior)
  3. Promising: Caregiver motivated by professional standards vs personal connection to patient
  4. Alternative: Volunteer driven by organizational loyalty vs aesthetic satisfaction (less realistic for hospice)

  I discarded #1 and #2 immediately. #4 feels forced. #3 survives because:
  - "Professional standards" can be framed as duty-motivation without moral language
  - "Personal connection" is clearly non-moral
  - Hospice setting fits user's context perfectly
  - Avoids all banned tropes

  For the case: Nurse A meticulously adjusts a dying patient's position every hour because hospital protocol requires it for comfort. Nurse B does the exact same for Mr. Davies because she associates his voice with her grandfather's. Both actions are morally required, both believe this, neither has ulterior motives.

  Now the analysis:
  - Tracking view favors B: Her desire directly responds to the right-making feature (patient's humanity), while A responds to abstract rules.
  - Duty view favors A: She acts from recognition of moral requirement, while B's motivation is contingent.

  Key structural feature: Whether the motivation connects to the particular patient's reality. Remove this (e.g., if B just likes tasks completion), both views would likely agree the action lacks full worth.

  For the attack: Duty view defenders might argue A's rule-following still constitutes moral concern. But this fails - A could follow rules without moral engagement. Tracking view defenders might claim B's motivation is too contingent, but contingency doesn't negate responsiveness.

  Adding agent C (uses self-installed "prosthetic duty" due to distrusting spontaneous motives):
  - Tracking view downgrades C: Her motivation is rule-compliance, not direct responsiveness.
  - Duty view upgrades C: She consciously chooses moral guidance.
  - This reveals the duty/desire contrast is misleading - the real divide is direct vs mediated responsiveness.

  Verdict: The case works. Tracking view is superior because:
  1. Better explains why B's motivation is more admirable
  2. Handles C more consistently
  3. Avoids duty view's problem of rewarding "moral fetishism"

  Contested point: Tracking view assumes desires can be morally responsive without moral concepts. Some Kantians would reject this, but the user banned that objection by requiring B's belief in moral requirement.

  Final call: In the hospice award, motivational structure matters. B-type volunteers demonstrate deeper moral worth by responding directly to patients' humanity rather than abstract duty.
answer: |-
  Here's the case, built to your specifications, followed by analysis, attacks, and verdict:

  **The Case**  
  In a hospice ward, two nurses, A and B, consistently spend an extra 10 minutes gently repositioning a terminal patient, Mr. Davies, who cannot shift himself due to advanced paralysis. This prevents bedsores and alleviates discomfort – a clear moral requirement. Both believe this act is morally obligatory, act solely for this reason (no hidden motives), incur identical personal cost (delayed breaks), and would repeat it identically. **A** is moved *because she recognizes it as a duty*; her thought is, "This is what care demands, so I must do it." **B** is moved *by a specific, non-moral desire*: she finds Mr. Davies’s voice uncannily similar to her late grandfather’s, and her motivating thought is simply, "I want to hear that voice be comfortable." This desire is non-moral (paraphrasable without moral terms: auditory association → comfort-seeking), doesn’t override her moral judgment (she agrees the act is required), and isn’t about credit, guilt, or being "good."

  ---

  **Analysis**  
  *Structural Feature Doing the Work*: **The directness of the motive’s connection to the particular patient’s concrete reality.**  
  - **Tracking View Verdict**: B > A  
    *Reasoning*: Moral worth requires the action to spring from a mechanism responsive to the *right-making features* (here, Mr. Davies’s suffering and dignity). B’s desire is *keyed directly* to his concrete, particular state (his vocal discomfort triggering her association). A’s motive is responsive to an *abstract rule* ("duty"), not the patient’s particularity. Her mechanism tracks "what is required," not the suffering itself. Remove the particularity (e.g., if both acted from a generic "help patients" impulse), the views collapse – both would have middling worth.  
  - **Duty View Verdict**: A > B  
    *Reasoning*: Moral worth requires acting *because you believe the act is morally required*. A’s motive explicitly references this moral requirement ("This is what care demands"). B’s motive makes no reference to morality; she acts from a personal, contingent desire. Her belief that it *is* required plays no role in *moving* her. Remove the explicit duty-reference in A’s motive (e.g., if she cited "unit policy"), the views collapse – both would lack explicit duty-motivation.  

  **Adding Agent C**  
  C, distrusting her spontaneous impulses (e.g., she might overlook needs if distracted), deliberately follows a self-installed rule: "Always check for repositioning needs during med rounds." She acts solely because this rule prescribes it.  
  - *Tracking View*: **Lowest worth**. C’s mechanism is responsive to the *rule*, not the patient’s state. It’s doubly mediated (rule → action, not suffering → action).  
  - *Duty View*: **Equal to A (or higher)**. C acts *because* she takes the rule to encode duty. Her self-installation shows commendable moral commitment.  
  *Why the contrast is a red herring*: The duty/desire distinction masks the core issue for tracking: **direct vs. mediated responsiveness**. B (direct desire) > A (mediated by duty-concept) > C (mediated by rule). The duty view mistakenly equates A and C (both "duty-motivated") despite C’s further remove from the patient’s reality.  

  ---

  **Attacks & Viability**  
  - **Attack on the Case by Duty View Defender**: "B’s motive is morally arbitrary. Her action depends on a chance resemblance (grandfather’s voice). If Mr. Davies had a different voice, she might not act, despite the identical moral requirement. This contingency undermines her moral worth."  
    *Counter*: This attack *fails* per your constraints. Contingency ≠ lack of responsiveness. B *does* respond to *this patient’s* concrete discomfort *via* her desire. The voice is the *trigger*, but the desire *for his comfort* is what’s responsive. Her mechanism reliably outputs the right action *because* it’s keyed to his state. The duty view cannot demand motives be *necessary* for morality (only sufficient), else it invalidates all non-universalizable motives (like love).  
  - **Attack on Tracking View by Duty Defender**: "A’s ‘duty’ motive *is* responsive! She wouldn’t do this for a non-suffering patient. Her ‘duty’ concept reliably picks out right-making features."  
    *Counter*: This *succeeds partially* but is contested. Tracking theorists argue A’s motive is keyed to "duty" as a *formal property*, not the *substantive features* (suffering/dignity). She acts because it’s "required," not because it alleviates agony. If duty misaligned with rightness (excluded by your "true belief" constraint), she’d err. B’s desire aligns directly with the substance.  

  ---

  **Verdict & Satisfiability**  
  - **Does the case work?** **Yes.** It satisfies all constraints:  
    - Identical acts/consequences/costs/beliefs.  
    - A: Motivated by true belief in duty.  
    - B: Motivated by non-moral desire (auditory association → comfort), with true moral belief playing no motivational role.  
    - No hypocrisy, akrasia, or moral-error.  
    - The structural feature (direct vs. mediated responsiveness) cleanly separates the views.  
  - **Which view is correct?** **The Tracking View.**  
    *Why*: Duty-motivation (A) is a form of *moral fetishism* – valuing "duty" over the concrete human reality that grounds it. B’s desire, while contingent, directly engages with the particular suffering person, making her action more authentically *about him*. C’s case seals it: the duty view valorizes rule-following even when further detached from particulars, while tracking penalizes it. Moral worth resides in the unmediated recognition of the patient’s claim upon you.  
  - **Contested Reliance**: The tracking view assumes **non-moral desires can be morally responsive** without invoking moral concepts. Kantians may reject this, insisting moral worth *requires* moral-conceptual motivation. But you preempted this by requiring B’s *belief* in the moral requirement to be present and true – her desire isn’t *amoral*, it’s *non-moral-yet-responsive*. This is the core tracking commitment.  

  **Conclusion for Your Hospice Award**: Motivational structure *does* matter. On the tracking view (which I endorse), a volunteer moved by direct, particularized care for patients (like B, but *without* the grandfather quirk – e.g., "I just *see* he’s hurting and want to fix it") has greater moral worth than one moved by abstract duty ("I do it because it’s the right thing"). The award criteria *are* coherent if you prize responsiveness to the human reality over moral self-consciousness. Your friend’s "just showed up" stance ignores the inner landscape that makes the act truly admirable.
