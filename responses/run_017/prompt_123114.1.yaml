  First, I need to understand the core of proleptic nosology. The guest argues that since psychiatric categories are looping kinds (as per Ian Hacking), we should judge them by the effects they trigger—like changes in self-narrative or societal responses—rather than their ontological accuracy. Her proposals include sunset clauses and stealth categories. The user has covered Hacking and DSM history, so they want to avoid basics and dive into criticisms.

