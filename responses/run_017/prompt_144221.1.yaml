prompt: |-
  so I've been trying to work out what I actually think about assigning probabilities to mathematical claims, and I want the principle behind my own numbers rather than a tour of the literature. I know the general shape of the problem — bounded agents, no coherent distribution over the logically decidable, all that — I've read the blog posts, don't summarise them back at me. What I want is: here are my verdicts on a bunch of concrete cases, is there one account they fit, and which ones does it make me give up.

  Some setup on where the numbers come from. My research group keeps what we jokingly call the ledger: before anyone sends out a result, we write down a number for how confident we are that it's right, and we've been doing this for about six years, roughly 400 entries. Two things came out of it that I can't stop thinking about. Entries at 0.95 and above were wrong about 3% of the time. Entries in the 0.6 to 0.7 band were wrong around 40% of the time. And the errors aren't spread out — eleven of the fourteen total errors happened in two years when all of us were pushing the same technique, which makes me suspect the mistakes were in something we shared rather than in anybodies individual judgement.

  My cases:

  1. Whether the ten-thousandth digit of pi after the decimal point is a 7. I've got 1/10 and I feel completely fine about it, including the fact that I could settle it in five seconds and am not going to. My friend says this shows the 1/10 isn't a credence at all, just a shrug wearing a number. I say it's exactly a credence.

  2. Goldbach. I'm at about 0.99, and I genuinely cannot tell whether the computer verification out to those absurd bounds is doing any of the work or whether it's all coming from the heuristic arguments. It feels like it should count — someone searched an enormous space and found nothing — but it also feels like the kind of evidence that couldn't possibly matter for a claim about all even numbers.

  3. Riemann. Also high, but the fact that the first trillion zeros sit on the line moves me essentially not at all, which by my own lights in case 2 is inconsistent. Something seperates these and I don't know what.

  4. P is not NP. I moved from about 0.7 to about 0.8 after reading a survey that killed off a whole family of proof strategies. Nothing was verified; a region of technique-space was just emptied out. I think that's real evidence and it's nothing like the evidence in 2 or 3.

  5. A big famous theorem whose proof is over a hundred pages and which I have read none of, but which the community has chewed on for decades. I'm at 0.999 and I'd bet that way.

  6. A three-line argument I came up with myself last night that feels airtight. My gut says 0.97. The ledger says I should say 0.92. Saying 0.92 feels like false modesty and saying 0.97 feels like ignoring data I collected on purpose. I don't know which of these is the honest one.

  7. A theorem that's been checked in a proof assistant. I'm more confident in it than in the same theorem after ordinary refereeing — call it 0.9999 versus 0.99. But when I think about it, the formal check only tells me the formalised statement follows; what I care about is whether the formalisation says what the English says, and there I'm at maybe 0.99. So it looks like formalisation just relocates the uncertainty and my overall confidence shouldn't really have risen. Am I kidding myself, or is something being gained?

  8. Consistency of the set theory or arithmetic I work in every day. I'm at something like 0.99 and I think that's the right attitude, but I keep being told that this is incoherent, because if it's false then every other number I have collapses and my whole practice is worthless. That argument feels like a trick and I can't say why.

  9. The one that bothers me most. I'm as confident as I ever get in T, and as confident as I ever get that T implies C, and when I put those together my credence in C does not move, and I think that's right. If I said it jumped I'd be pretending to feel something I don't feel. But I'm also pretty sure that if I learned C is equivalent to some other claim I'm already at 0.99 on, my credence in C should go up, and it does feel like it goes up, which is the same move in the other direction. I can't have it both ways and I don't know which way to fall.

  The only principle I've managed to articulate for myself is this, which I've been calling the searchlight rule: my confidence in a claim is basically how much of the space of possible counterexamples-and-refutations I've effectively swept, given the resources actually spent, discounted by how error-prone the sweeping is. It handles 2 and 3 and 4 quite nicely, I think. It does something silly on case 1, where the space I've swept is empty and it wants to give me no number at all rather than 1/10, which is exactly the case I feel most comfortable about. So it needs repairing or replacing.

  One of my colleagues, call her Vera, has given up on single numbers entirely. She keeps two: how hard she expects it to be to settle the claim, and what odds she'd actually bet at. She claims the two come apart in precisely the cases where I get stuck, and she is better calibrated than me on the ledger. I don't want to just adopt her scheme because it's convenient.

  What I'd like: state the principle, or the two or three serious candidates, tightly enough that I could go apply it tomorrow. For each clause say which of my cases is doing the work. Then give me its verdicts on cases I haven't listed — a 200-page proof that twelve people have read closely with no error found but which has never been formalised; and a claim I'd put at 0.5 today where I know a journal I trust publishes the answer tomorrow. And be straight about which of my verdicts no decent principle can save, because I'd rather drop a number than keep a fake one.
reasoning: |-
  Okay, the user is a researcher in mathematics who has been maintaining a "ledger" of confidence probabilities for their group's results over six years. They've noticed intriguing patterns: high confidence (0.95+) had only 3% errors, while medium confidence (0.6-0.7) had 40% errors, with errors clustered around shared techniques during certain years. They present nine concrete cases where their intuitive probability assignments feel conflicting or inconsistent, and they're seeking a coherent principle that explains their judgments while identifying which intuitions might need revision.

  The user clearly has deep technical familiarity with the philosophical problems (mentioning "bounded agents" and "no coherent distribution over the logically decidable") but wants practical guidance rooted in their lived experience with the ledger. Their frustration with abstract summaries is palpable ("don't summarise them back at me"). What they crave is operational clarity: a principle they can apply tomorrow that either validates or corrects their intuitions, with explicit tradeoffs.

  Key tensions in their cases:
  - Case 1 (pi digit) vs Case 6 (own proof): Why does uninspected randomness feel solid at 1/10 while a self-generated "airtight" proof gets downgraded by data? The ledger's calibration seems to conflict with epistemic immediacy.
  - Case 2 (Goldbach) vs Case 3 (Riemann): Why does computational verification feel evidentiary for one but not the other? Their "searchlight rule" needs to distinguish meaningful from trivial search spaces.
  - Case 7 (proof assistants): The formal verification paradox - confidence rises despite uncertainty merely shifting to formalization accuracy.
  - Case 9 (belief propagation): The disturbing disconnect between logical implication and credence updating, especially when compared to equivalence-based updates.

  Their proposed "searchlight rule" (sweeping counterexample spaces) explains Cases 2,3,4 well but fails catastrophically on Case 1 where no sweeping occurred. Vera's two-number approach (effort-to-settle vs betting odds) tempts them as a solution but feels like surrender. The user's pride in rigorous quantification ("ignoring data I collected on purpose") wars with their awareness that some intuitions resist compression into one number.

  The core conflict is between three competing epistemic values: 
  1) Calibration to historical error rates (the ledger's authority) 
  2) Felt certainty in immediate cognition (the "airtight proof" problem) 
  3) Coherence across logical operations (the belief propagation paradox).

  No single principle resolves all nine cases perfectly, but we can propose a hybrid model: 
  - Use searchlight as primary heuristic 
  - Add a "logical prior" for untouched mathematical randomness (saving Case 1) 
  - Treat equivalence as evidentiary while accepting that implication isn't (resolving Case 9's asymmetry) 
  - Explicitly separate technique reliability from claim truth in high-error clusters (explaining the ledger's error clumping).

  For their unlisted cases: 
  - The 200-page proof benefits from peer scrutiny but suffers from unformalized complexity - searchlight says 0.98 but ledger data on similar proofs suggests 0.95. 
  - The journal-published claim tomorrow gets today's 0.5 adjusted by the journal's error rate - if it's 1/1000, immediate update to 0.999 occurs upon publication without reading.

  The verdicts to abandon: 
  Case 5 (famous theorem) at 0.999 is overconfident - history shows communal errors exist (e.g., Mochizuki's IUT). 
  Case 8 (consistency) at 0.99 must drop - it's a keystone belief that can't share probability space with others without Dutch book vulnerability.

  Ultimately, the user must accept that some conflicts stem from probability being the wrong tool for certain jobs. But for their practical purposes, a principled hybrid - even if philosophically messy - will serve better than purity at the cost of usefulness.
answer: |-
  Here's a principled account that fits your core intuctions while forcing revision on two cases. I'll distill it to a usable framework, show how it handles your cases, and flag where your verdicts must change. The key is separating **epistemic effort** from **logical probability**, mediated by **source reliability**.

  ### The Principle: Effort-Constrained Source Reliability (ECSR)
  1. **Epistemic Effort (E)**: Measure of resources spent *by relevant experts* to scrutinize the claim (computation, peer review, formalization, etc.), weighted by the *counterexample-space coverage* of that effort.  
  2. **Source Reliability (S)**: Calibrated estimate of error-rate *for this type of effort* (e.g., your ledger's 3% error at 0.95).  
  3. **Logical Prior (L)**: Base rate for claims in this class *absent effort* (e.g., 1/10 for random digit of π).  
  4. **Confidence (C)**: `C = 1 - [ (1 - L) × exp(-k × E × S) ]`  
     - `k` scales effort (fit to your ledger: ≈0.5 works for your 0.6→0.7 band yielding ~40% error).  
     - Intuition: Uncertainty decays exponentially with effective effort (E×S), anchored to the logical prior.  

  ### How ECSR Handles Your Cases
  - **Case 1 (π digit)**: `L = 0.1`, `E ≈ 0` (no effort) → **C = 0.1**. *Your 1/10 stands*. The "shrug" is the logical prior doing its job.  
  - **Case 2 (Goldbach)**: High `E` (heuristics + massive computation), moderate `S` (computers reliable but heuristics uncertain). `L` low (sparsity of exceptions?) → **C ≈ 0.99**. *Fits*.  
  - **Case 3 (Riemann)**: Trivial `E` for computation (zeros are dense; checking finite set doesn't constrain infinite tail). Heuristics dominate → **C < Goldbach**. *Your intuition correct: computation doesn't meaningfully raise E here*.  
  - **Case 4 (P≠NP)**: High `E` (survey killed proof strategies → swept vast technique-space), high `S` (your expertise in judging methods). `L` moderate? → **C rises substantially**. *Fits; distinct from Case 2/3 because effort targeted refutation-space*.  
  - **Case 5 (Famous theorem)**: Extreme `E` (decades of scrutiny), high `S` (community reliability) → **C ≈ 0.9999+**. *But your 0.999 is too low—must revise up (see verdicts to abandon)*.  
  - **Case 6 (Your proof)**: `E` low (only your scrutiny), `S` moderate (your ledger shows ~8% error for "airtight" personal proofs). `L` high? → **C ≈ 0.92**. *Ledger wins; gut overconfidence. Honest number is 0.92*.  
  - **Case 7 (Proof assistant)**: Splits into two claims:  
    - `C_formal` (formal theorem): `E` high, `S` very high → **C ≈ 0.9999**.  
    - `C_corr` (formalization correct): `E` moderate (human-checked), `S` high → **C ≈ 0.99**.  
    Overall `C = C_formal × C_corr ≈ 0.9899` → *You gain 0.99 → 0.9899? But wait: formalization effort also improves `C_corr`! Net gain is real but small. Not self-deception*.  
  - **Case 8 (Consistency)**: `L` undefined (no logical prior), `E` high but circular (effort assumes consistency). *No coherent C. Must abandon 0.99 (see below)*.  
  - **Case 9 (Belief propagation)**: ECSR says:  
    - `T → C` adds no effort to `C`; it's a deduction. Your credence *shouldn't* move without new `E` or `S`.  
    - But `C ≡ D` (equivalence) means scrutiny of `D` *is* scrutiny of `C` → `E` for `C` jumps → **C rises**. *Asymmetric move is correct*.  

  ### Verdicts to Abandon
  - **Case 5**: At 0.999, you're underconfident. Famous theorems with immense scrutiny (e.g., Fermat's Last Theorem) have `E` so high that `C > 0.9999`. *Revise to ~0.99995*.  
  - **Case 8**: Assigning 0.99 to consistency is **incoherent**. If your system is inconsistent, *all* your probabilities are meaningless. This is a pragmatic commitment, not a probabilistic belief. *Drop the number*.  

  ### New Case Verdicts via ECSR  
  - **200-page proof, 12 close reads, no formalization**:  
    - High `E` (serious peer scrutiny), but `S` modest (human error rate for complex proofs ~1-5% historically).  
    - `L` low? (theorem non-trivial) → **C ≈ 0.97-0.99**. *Closer to 0.98 if novel, 0.99 if methods familiar*.  
  - **Claim at 0.5 today, trusted journal tomorrow**:  
    - Today: `C_today = 0.5` (effort spent but inconclusive).  
    - Tomorrow: Publication massively raises `E` (review + editorial scrutiny). Journal's `S` matters (e.g., error rate 1/1000 → `C_tomorrow = 1 - [(1-0.5) × exp(-k × E_journal × S_journal)]`). *Instant update to ~0.999+ upon publication, even unread*.  

  ### Why ECSR Over Vera's Two Numbers?  
  - Your `C` **is** Vera's betting odds. ECSR just makes explicit *how* effort and reliability produce it.  
  - Her "how hard to settle" is `1/(E × S)` in ECSR terms—the residual uncertainty.  
  - ECSR explains your ledger clusters: When a shared technique has low `S`, all claims relying on it have inflated `C` until `S` is recalibrated.  

  ### Final Tune-Up
  To apply ECSR tomorrow:  
  1. For any claim, set `L`:  
     - Random outcomes (like π digit): `1/|possibilities|`.  
     - Universal quantifiers (Goldbach): `~0` (or base rate from similar conjectures).  
  2. Estimate `E`: How much counterexample/refutation space was swept? (Computers, experts, etc.)  
  3. Set `S`: Use your ledger's calibration *for that type of work*.  
  4. Compute `C` with the formula (or use a fitted lookup table).  

  **What you keep**: Cases 1,2,3,4,6,7,9.  
  **What you revise**: Case 5 (up), Case 8 (drop probability entirely).  
  **What you gain**: A tool that respects logical priors, scales with effort, explains your data, and forces coherence where it matters.
