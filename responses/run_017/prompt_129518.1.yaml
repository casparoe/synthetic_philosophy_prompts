  I need to watch for unoccupied branches, e.g., "artificial history doesn't count but short natural does" – probably unattractive. Also, flag that views requiring actual history vs. ideal conditions collapse outside Swampman cases. 

  Word count is tight (700 words), so examples must be concise. Use British English: "labour" not "labor", "realise" not "realize". Explain any new cases briefly, like the cancer-detecting AI or the rabbit's reused fear mechanism. 

  Finally, ensure the tree separates views cleanly on the two axes while acknowledging where distinctions blur. Highlighting awkward commitments will help students grasp trade-offs in each theory.
answer: |-
  Here’s a teleosemantics decision tree handout for your reading group, focusing on your axes and constraints (British English, ~650 words):

  ---

  **Teleosemantic Decision Tree**

  *Answer each question based on the cases below. Follow the branches to your position, noting its awkward commitment.*

  **Q1: Can Swampman (a lightning-struck duplicate with no evolutionary history) have mental states with determinate content?**  
  - **Yes** → Go to Q4.  
  - **No** (Content requires *some* history) → Go to Q2.  

  **Q2: Does a system’s *artificial* design history suffice for content?**  
  *(Consider: A deep learning AI, trained via gradient descent on medical scans, reliably flags cancerous tumours. It has a design function but no natural selection history.)*  
  - **Yes** (Artificial design counts) → Go to Q3.  
  - **No** (Only *natural* selection history counts) → **Position: Historical Essentialism (e.g., Millikan, early Papineau)**.  
    *Most awkward commitment:* The AI tumour-detector lacks content entirely – its “cancer” states mean nothing, despite perfect functionality.  

  **Q3: Does *short* or *supervised* natural selection suffice?**  
  *(Consider: A lab fruit fly population, selectively bred over 200 generations to avoid a specific scent. Or: a neural implant designed by engineers and wired into a human visual cortex, restoring sight.)*  
  - **Yes** (Short/supervised natural history suffices) → **Position: Liberal Historicalism (e.g., Dretske-inspired views)**.  
    *Most awkward commitment:* The lab fly’s scent-avoidance has genuine content almost immediately, blurring evolved/designed distinctions.  
  - **No** (Requires long-term, "wild" natural selection) → **Position: Strict Selectionism (e.g., Millikan, Neander)**.  
    *Most awkward commitment:* The neural implant’s “edge detection” states lack content, even if fully integrated and aiding survival.  

  **Q4: Can a state misrepresent if its system *lacks* any relevant history?**  
  *(Consider: Swampman’s “fly-detecting” visual state fires at a dust mote.)*  
  - **Yes** (Misrepresentation possible sans history) → Go to Q5.  
  - **No** (Only systems with functions can misrepresent) → **Position: Pure Causal/Input-Based Teleosemantics (e.g., Fodor’s asymmetrical dependency, if hybridised)**.  
    *Most awkward commitment:* Swampman cannot misrepresent *anything*; his dust-mote state is merely non-veridical, not false.  

  **Q5: In co-option, does content follow the *derived* function?**  
  *(Consider: A rabbit’s evolved fear mechanism (ancestral function: detect hawks) is triggered by drone noises (derived function: avoid drones). It flees a harmless shadow.)*  
  - **Yes** (Content tracks current role) → **Position: Derived Function Teleosemantics (e.g., Price, some Millikan interpretations)**.  
    *Most awkward commitment:* The rabbit’s state misrepresents the shadow *as a drone*; its hawk-detection history becomes irrelevant to content.  
  - **No** (Content tracks *ancestral* function) → **Position: Etiological Function Teleosemantics (e.g., standard Millikan, Neander)**.  
    *Most awkward commitment:* The rabbit’s state misrepresents the shadow *as a hawk*, even if drones are now the primary threat.  

  **Q6: Can content exist *without* any causal-informational link?**  
  *(Consider: A randomly mutated neuron in a fish fires when distant earthquakes occur, aiding survival. It never evolved *for* this.)*  
  - **Yes** (Functions alone fix content, causation optional) → **Position: Pure Teleosemantics (e.g., Millikan)**.  
    *Most awkward commitment:* The fish’s state represents “earthquake” despite zero causal connection or informational sensitivity.  
  - **No** (Causal/informational role is essential) → **Position: Causal-Hybrid Teleosemantics (e.g., Papineau, Dretske)**.  
    *Most awkward commitment:* The fish’s earthquake state lacks content until selection exploits it; pure luck isn’t enough.  

  ---

  **Unoccupied Combinations & Indistinguishable Leaves:**  
  - **Unoccupied:** "No" to Swampman content (Q1) + "No" to artificial history (Q2) + "Yes" to short/supervised history (Q3). *Why?* Unattractive: Artificially denies AI content while granting it to very recent lab evolution without principled distinction.  
  - **Indistinguishable in Practice:** "Pure Teleosemantics" (Q6-Yes) vs. some "Causal-Hybrid" versions (Q6-No). *Why?* If selection *requires* reliable causation (a common view), the "causal link" demanded by hybrids is built into the selected function. They diverge *only* in rare cases like the earthquake fish or Swampman.  

  ---

  **Key:**  
  - **Artificial design history:** Intentional creation/training (e.g., AI, prosthetics).  
  - **Co-option:** A trait evolves for function A, later used for function B.  
  - **Ancestral function:** What the trait was originally selected for.  
  - **Derived function:** What the trait currently does/is used for.  

  This tree isolates views on your axes: Q2-Q3 handle design history sans selection; Q5 handles co-option. Misrepresentation sans history is covered in Q4. Awkward commitments highlight theoretical costs.
