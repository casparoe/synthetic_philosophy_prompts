  → Splits testimony vs constitutive views

  Q2 (lucid signaling): Can the signal be wrong?
  → Tests incorrigibility

  Q3 (interrupted dream): Does continuation exist?
  → Handles temporal determinacy

  Q4 (REM disorder): Is enactment part of dreaming?
  → Probes physical criteria

  Q5 (report breakoff): Does "unfinished" imply objective sequence?
  → Further temporal tests

  This should generate leaves covering:
