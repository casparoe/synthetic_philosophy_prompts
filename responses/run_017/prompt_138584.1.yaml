prompt: |-
  I'm 68, retired from running a hydrology lab, and I've got myself volunteered as the (unpaid, and only) compliance person for a small medical NGO running clinics in two countries, one in West Africa and one in Southeast Asia. So about ten times a week I get an email asking: is this payment, gift, or favour ok? A fifty-dollar expediting fee to get a vaccine consignment released at the border; a village chief presenting a fieldworker with a goat; the district health officer asking us to put his cousin on the payroll; a drug company paying for our staff to attend a conference at a nice hotel; cash "transport money" given to patients so they'll actually show up for treatment.

  I've been reading about corruption and I'm sick of two things people keep saying. First, the textbook definition where corruption is misuse of public office for private gain — that covers almost none of my cases, since half the people we deal with aren't officials in any useful sense and the gain often flows to a clinic or a family rather than to a person. Second, when in Rome, do whatever the local norm is — which I don't accept but also can't yet argue against properly.

  So: I don't want more theory, I want a decision procedure I can run in five minutes on my phone. Give me the questions in order, what counts as an adequate answer to each one, where the procedure definately stops with a no, and where it hands the decision up to our director because it's a values call and not a factual one. And please give me at least a couple of distinctions that aren't in the standard compliance handbook. Three I've been chewing on and can't make work: the difference between a transfer that buys a specific act and one that buys a standing disposition to be helpful, where the return is vague and indefinitely deferred; whether a gift corrupts more when the recipient can't easily say no to the giver later, i.e. the exit costs are lopsided; and whether it matters that refusing makes the patients worse off rather than making us worse off. Use whatever actually does the work and throw out the rest — and tell me if I'm seperating things that should be kept together.

  Then run the procedure on three of the cases above, your pick of the hardest ones, but include at least one where the answer it spits out is one I won't like. Finish by telling me plainly what the procedure can't do.

  Under 700 words, bullets rather than essay prose, and no citations or further reading — no library access here and I don't want any.
reasoning: |-
  Okay, let me tackle this for our retired hydrologist turned compliance officer. They're dealing with real-world ethical dilemmas across two continents and need a practical decision tool—not theory. 

  First, I recognize their core frustrations: textbook definitions of corruption don't fit their reality, and "when in Rome" feels morally bankrupt. Their three unresolved distinctions are particularly insightful—they're wrestling with reciprocity dynamics, power imbalances, and outcome-based ethics. 

  For the framework, I'll prioritize operational clarity: binary stops at "NO", flags for director escalation, and incorporate their nuanced concerns. Key additions beyond standard compliance: 
  - Differentiating "speed money" from "access money" (their disposition vs specific act point)
  - Assessing who bears refusal costs (their patient welfare concern)
  - Mapping reciprocal obligation traps (their exit cost asymmetry)

  The goat gift case will test cultural accommodation versus slippery slopes, while the cousin hire forces values-based escalation. The conference example must show how professional benefits can mask vendor influence—and deliver the "unpleasant answer" they requested. 

  Throughout, I'll maintain strict constraints: under 700 words, bulleted, zero citations. The conclusion must explicitly warn where the tool fails—like systemic bribery patterns requiring policy overhaul. This isn't about perfection; it's about giving a principled yet pragmatic compass for the trenches.
answer: |-
  ### Decision Procedure: Ethical Transfer Assessment  
  *(Run sequentially; stop at first "NO" or "DIRECTOR")*  

  1. **Is this transfer required by law/regulation in the specific location?**  
     - *Adequate answer:* Verified via NGO’s local legal counsel or official government sources.  
     - **NO** if illegal. **DIRECTOR** if legally ambiguous.  

  2. **Does this primarily harm vulnerable populations?**  
     - *Adequate answer:* Evidence of direct harm (e.g., diverted meds, exclusion of poorer patients).  
     - **NO** if yes (e.g., "transport money" that excludes those farther away).  

  3. **Is the recipient’s autonomy compromised?**  
     - *Your distinction:* **Exit cost asymmetry**. Can the recipient refuse *without* disproportionate retaliation (e.g., job loss, withheld essentials)?  
     - **NO** if coercion exists (e.g., official’s cousin hire under threat of clinic closure).  

  4. **Does this distort core medical priorities?**  
     - *Adequate answer:* Diverts resources/attention from urgent health needs (e.g., lavish conference vs. malaria nets).  
     - **NO** if distortion is severe. **DIRECTOR** if marginal benefit exists.  

  5. **Is the return benefit vague/deferred?**  
     - *Your distinction:* **Specific act vs. standing disposition**. Favors for "future goodwill" (standing disposition) are riskier than fees for concrete services (specific act).  
     - **DIRECTOR** if deferred/vague (e.g., goat gift to chief for "ongoing cooperation").  

  6. **Who bears the cost of refusal?**  
     - *Your distinction:* **Patients harmed vs. NGO burden**. Refusal that hurts patients (e.g., vaccines stuck at border) may justify exceptions vs. refusal that only inconveniences NGO.  
     - **DIRECTOR** if patients bear significant harm.  

  7. **Is this transparent/reciprocal within local norms?**  
     - *Adequate answer:* Culturally routine *and* disclosed to community/NGO leadership.  
     - **NO** if secretive or exploitative (e.g., hidden kickbacks). **DIRECTOR** if norm is contested but transparent.  

  ---

  ### Test Cases  
  **1. $50 expediting fee for vaccine release**  
  - (1) Likely illegal → **NO** (stops).  
  - *But*: If refusal harms patients (Q6), escalate to **DIRECTOR** despite illegality. *You may not like this.*  

  **2. Village chief’s goat gift to fieldworker**  
  - (1) Legal? Unknown → **DIRECTOR** if ambiguous.  
  - (5) Vague reciprocity (standing disposition) → **DIRECTOR**.  
  - (7) Transparent/local norm? If yes → **OK**; if not → **NO**.  

  **3. Drug company pays for staff conference at nice hotel**  
  - (4) Distorts priorities? If conference is irrelevant/superfluous → **NO**.  
  - *Hidden risk*: Creates obligation to vendor (exit asymmetry, Q3). If staff can’t refuse future vendor pressure → **NO**.  

  ---

  ### What This Can’t Do  
  - **Solve systemic corruption**: Repeated "DIRECTOR" escalations signal need for policy overhaul.  
  - **Replace context**: Local staff input is irreplaceable for Q7 (norms).  
  - **Prevent slippery slopes**: Small "OKs" may normalize larger breaches—track patterns.  
  - **Assign moral blame**: Focuses on act/impact, not intent.  

  *Procedure isolates key pressures (power, harm, opacity) while honoring your distinctions. Q3 & Q6 explicitly address your "exit cost" and "patient harm" insights—separating these clarifies dilemmas.*
