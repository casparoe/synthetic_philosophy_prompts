  - At the beginning, give each participant 2 candies.
  - Contribution cost: 1 candy (they put it in the box).
  - Reward: 2 candies per person if the group succeeds.

  So if they don't contribute and the group succeeds, they end with 2+2=4. If they contribute and the group succeeds, they end with 2-1+2=3. If they contribute and the group fails, they have 2-1=1. If they don't and fail, they have 2.

  **Shapley bonus round:** We can use extra candies for the bonus.

  **Deception?** We avoid it. We are clear about the rules.

  **Final Design:**

  **Round 1: Baseline Threshold**
  - Split into groups of about 12 (if 24, two groups).
  - Each group: threshold T=6.
  - Participants each start with 2 candies.
  - Choose: CONTRIBUTE (put 1 candy in the group box) or NOT (keep the candy).
  - After submission, facilitator counts contributions. If >=6, every member gets 2 candies from the facilitator. If not, no reward.
  - Reveal the total and ask the reflection questions.

  **Round 2: Uncertain Threshold**
  - Same groups.
  - The threshold is a random number between 8 and 12 (write it on a card, seal in envelope, show it's sealed).
  - Participants choose (CONTRIBUTE or NOT) with same costs.
  - After, reveal threshold and total, then distribute rewards if met.
  - Reflection: Did you know if you would be pivotal? How did uncertainty affect you?

  **Round 3: Ripple Effect**
  - Same groups.
  - Allow 5 minutes for group discussion. Participants can try to persuade each other.
  - Then private choice (with cost) as before. Threshold T=6 fixed.
  - After, reveal and distribute.
  - Reflection: Did anyone change their mind due to the discussion? How might your choice have influenced others?

  **Round 4: Shapley Value**
  - Take one group that succeeded in Round 1 with more than 6 contributions (if none, use Round 2 or 3).
  - We focus on that group. The set of contributors is known.
  - We set T=6 (the threshold they had).
  - We will simulate 10 random orderings of the entire group (including non-contributors).
  - For each ordering:
     - Go down the list until we have encountered 6 contributors. The 6th contributor in the ordering is the pivotal one for that ordering.
     - Record that person.
  - After 10 orderings, we have 10 pivotal events. Each contributor may have been pivotal multiple times.
  - We assign each contributor a share of a bonus pool of 10 candies proportional to the number of times they were pivotal.
     - E.g., if contributor A was pivotal 3 times, they get 3 candies.
  - Then, we also assign an equal share: total bonus of 12 candies (for 12 people) split equally (1 candy each).
  - We ask the group: which assignment feels fairer? Why?

  **Debrief Structure:**
  - Go through the rounds and the three aspects.
  - Introduce the inefficacy objection and how the activity addressed it.
  - Discuss the predictable issues.

  **Time Check:** We might have to adjust timing. 

  This should create the experiences we want.
answer: |-
  ### Workshop Activity: "The Collective Choice Challenge"  
  **Objective:** Create an experiential understanding of the inefficacy objection through game mechanics, forcing separation of "no outcome change," "uncertainty," and "overdetermination," while incorporating Shapley value intuition and ripple effects.  

  **Materials:**  
  - Index cards (4 per participant)  
  - Pens (1 per participant)  
  - A box for submissions  
  - Whiteboard + markers  
  - Stakes: A bag of small, desirable treats (e.g., fancy chocolates) or $5 in quarters (facilitator-provided).  
  - Timer (use phone or watch; participants don’t need it).  

  **Setup:**  
  - **Groups:** Split into 4 teams of 4–6 people. Smaller groups intensify individual stakes.  
  - **Stakes:** Each successful team gets 1 treat (or quarter) per member. Treats are distributed *only* if the team succeeds. Individual choices cost nothing—facilitator bears all costs.  
  - **Rules Summary (Write on Whiteboard):**  
    > 1. Each round, you choose: **COOPERATE** or **DEFECT**.  
    > 2. Choices are secret. Write choice on card, fold, submit to box.  
    > 3. Success depends on team choices + rules.  
    > 4. If team succeeds, *everyone* in the team gets a reward.  
    > 5. No talking during choice phases (except in Round 3).  

  **Rounds (45 minutes total):**  
  Run rounds in sequence. After each, have teams briefly discuss feelings (not logic) before moving on.  

  #### **Round 1: Baseline Threshold (10 minutes)**  
  *Targets: "My act didn’t change the outcome" + overdetermination.*  
  - **Rules:**  
    - Success requires **at least 3 COOPERATE** in a team.  
    - Everyone writes **COOPERATE** or **DEFECT** in secret, submits card.  
  - **Conduct:**  
    - Collect cards, count COOPERATE per team. Announce totals (e.g., "Team 1: 4 COOPERATE. Success!").  
    - **Ensure overdetermination:** If a team has ≤3 COOPERATE, secretly add 1–2 fake COOPERATE cards to their box to force success with excess (e.g., if they have 3, report 4). *No deception debrief needed—explain post-activity.*  
  - **Reflection Prompt (Whiteboard):**  
    > "If you COOPERATED: Would DEFECT have changed the outcome?  
    > If you DEFECTED: Would COOPERATE have changed it?"  

  #### **Round 2: Uncertain Threshold (10 minutes)**  
  *Targets: "I can’t tell if my act made a difference."*  
  - **Rules:**  
    - Success requires **at least T COOPERATE**, where T is hidden (T = 2, 3, or 4).  
    - Before choices, write T on a card, seal in envelope, and show it to the group.  
  - **Conduct:**  
    - Choose T randomly per team (ensure T=3 for most teams).  
    - After submissions, reveal T, then count COOPERATE. Announce success/failure.  
    - **Manipulate for uncertainty:** If a team’s COOPERATE = T, report T+1 (e.g., if T=3 and they have 3, say they have 4). This makes outcomes feel fixed regardless of individual choices.  
  - **Reflection Prompt:**  
    > "When you chose, did you know if you were needed? How did it feel?"  

  #### **Round 3: Ripple Effect (15 minutes)**  
  *Targets: "My choice influences others’ choices" (ripple channel).*  
  - **Rules:**  
    - Success requires **at least 2 COOPERATE**.  
    - **Discussion phase:** 3 minutes for open team discussion (e.g., "I’ll COOPERATE if you do").  
    - **Choice phase:** Secret choice after discussion.  
  - **Conduct:**  
    - After discussion, submit choices. Count COOPERATE. Report totals truthfully.  
  - **Reflection Prompt:**  
    > "Did anyone change their mind during discussion? Why?"  

  #### **Round 4: Shared Responsibility (Shapley Intuition) (10 minutes)**  
  *Targets: Assigning non-causal responsibility (Shapley value) despite no pivotality.*  
  - **Rules:**  
    - Use Round 1’s team data (with overdetermined success).  
    - Success required 3 COOPERATE, but team had 4 (e.g.).  
    - **Credit assignment:** Randomly pick 3 participants per team. Give each a treat (or quarter) as "pivotal contributors."  
    - Then, redistribute: Take treats back, give **every team member 1 treat** (equal share).  
  - **Conduct:**  
    - First, reward only the "pivotal" few (randomly chosen).  
    - Then, redistribute to all.  
  - **Reflection Prompt:**  
    > "Which reward felt fairer? Why?"  

  ---

  ### **Debrief (40 minutes)**  
  **Goals:**  
  1. Name the inefficacy objection after they’ve felt it.  
  2. Separate the three thoughts (no change, uncertainty, overdetermination).  
  3. Contrast causal vs. Shapley-style responsibility.  
  4. Validate ripple effects as a key channel.  

  **Structure:**  
  1. **Elicit Reactions (10 min):**  
     - Ask: "What frustrated or surprised you?" Focus on feelings from Rounds 1–3.  
     - Note responses on whiteboard (e.g., "I felt pointless in Round 1," "Round 2 was stressful").  

  2. **Map to Concepts (15 min):**  
     - **Round 1 = Overdetermination:**  
       - "In Round 1, your choice didn’t change the outcome. It was ‘overdetermined’—enough others cooperated. But you still got rewarded. How does that sit with you?"  
       - *Key point:* Overdetermination ≠ no responsibility.  
     - **Round 2 = Uncertainty:**  
       - "In Round 2, you couldn’t tell if you were pivotal. But you had to choose anyway. How does uncertainty affect real-world decisions like voting?"  
       - *Key point:* Uncertainty forces expected-value reasoning.  
     - **Round 3 = Ripple Effects:**  
       - "In Round 3, your choice might have influenced others. How does this channel create ‘real’ impact in boycotts or voting?"  
       - *Key point:* Most expected difference lives here.  
     - **Round 4 = Shapley Value:**  
       - "In Round 4, we assigned equal credit even if you weren’t pivotal. This mirrors the Shapley value in game theory: sharing credit for collective outcomes. Did it feel like a fair ‘share’ of responsibility? Why or why not?"  
       - *Key point:* Responsibility can be non-causal but distributional.  

  3. **Predictable Issues (5 min):**  
     - **"Someone computed pivot probabilities":** "Yes, you can calculate expected impact. But in Rounds 1 and 2, even with math, the *feeling* of futility persists. That’s the objection’s pull."  
     - **"Someone refused to play":** "This mirrors real-world disengagement. Did the ripple round change that?"  
     - **"This is just a game / real cases differ":** "True, but the structure—thresholds, uncertainty, influence—is the same. The difference is scale and stakes."  

  4. **Final Connection (10 min):**  
     - Define inefficacy objection: "The pull to think ‘my act does nothing’ because it doesn’t change outcomes, I can’t tell, or others would’ve done it anyway."  
     - Emphasize: "We’ve forced apart three distinct thoughts. In reality, ripple effects and Shapley-style shares often dominate—your choice matters even when it feels invisible."  

  ---

  ### **Facilitator Notes**  
  - **Stakes Handling:**  
    - Use chocolates/quarters for rewards. Max cost: 24 treats or $6 (for 4 rounds × 6 successes).  
    - No participant payment—facilitator covers all.  
  - **Deception:**  
    - Rounds 1 and 2 use light manipulation (adding cards). **Debrief honestly:** "We slightly adjusted outcomes to highlight overdetermination/uncertainty. IRL, this happens naturally via others’ actions."  
  - **Predictable Problems:**  
    - **Overcomputation:** If someone calculates pivot odds, say: "Great! Now ignore the math—how did you *feel* when your choice was swallowed by the group?"  
    - **Skepticism:** If dismissed as "just a game," reply: "The game abstracts real dilemmas. Where have you felt this pull IRL?"  
  - **What the Activity Can’t Capture:**  
    - **Scale:** Real-world collective harms (e.g., climate change) involve millions, not 6. You must say: "Scale amplifies uncertainty and ripple effects, but the logic is identical."  
  - **Timing Safety Net:**  
    - If behind, skip Round 4’s redistribution or shorten debrief. Prioritize Rounds 1–3.  

  **Why This Works:**  
  - Rules create visceral experiences: Overdetermination feels frustrating, uncertainty feels anxious, ripples feel empowering.  
  - Shapley assignment forces debate about "fair shares" of responsibility.  
  - Minimal lecturing—participants generate insights via choices and consequences.  

  Run this Saturday—no prep beyond gathering materials. Good luck!
