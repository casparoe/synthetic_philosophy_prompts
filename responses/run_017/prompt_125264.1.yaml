  The user needs a step-by-step procedure they can use quickly in sessions or during emergency calls. They want clear questions, criteria for answers, and decision points on when to follow the directive or ignore it. They also need to handle situations where answers aren't available. The procedure must be explainable to family members without philosophical jargon.

  Looking at their examples: Case A involves a bipolar client near the trigger threshold. Case B is about a religious conversion invalidating an old directive. Case C is an organizational policy that's too rigid. The user wants one of these to yield an uncomfortable answer to ensure the procedure isn't biased toward the past self.

  I should consider how to structure the procedure. Key elements might include assessing capacity, checking for value drift or new info, and evaluating trigger gaming. For capacity, standard tools like the MacCAT-T could be referenced but adapted for quick use. For value drift, distinguishing between changed values and impaired judgment is crucial. New information needs verification. Trigger gaming requires looking at intent versus letter of the directive.

  Process-based directives (like involving support people) seem more robust. Maybe the procedure should encourage these. Expiry dates or mandatory reviews could prevent outdated directives. For emergencies when info is lacking, defaulting to the directive but with specific overrides might be necessary.

  Now, applying the procedure to the cases. For Case A: The client is coherent but near the trigger. The trigger hasn't fully fired (only two nights, gave $200 but maybe below threshold). Checking for new info or value drift? If she's stable, maybe delay and involve her sister per the directive. If she's showing early signs, proceed. But here, the trigger isn't met, so don't act yet, monitor.

  Case B: The client had a religious conversion and wants the directive voided. If she's capable now and her values fundamentally changed, voiding might be okay. But need to ensure no current impairment. The procedure might allow revocation if capacity is intact and changes are credible.

  Case C: The clinic policy forbids calling police, but a nurse was injured. The policy was set with a high bar to repeal. The procedure should treat group policies differently, perhaps allowing override in emergencies with documentation. The analogy to individual directives is weak because groups have ongoing oversight.

  Potential flaws: The procedure might not handle subtle capacity issues well. Regular reviews could help. For emergencies, clear documentation of decisions is vital to avoid appearing arbitrary. Training for staff on the procedure's limits is also key.
answer: |-
  Here's a field-tested procedure based on your real-world patterns ("**DECIDE-V**"). It prioritizes speed, safety, and defensibility, focusing on *actionable distinctions* over philosophical purity. It works for drafting sessions (40 mins) and 2am ER calls (90 sec). **Core Principle:** The directive is a powerful *tool* for the *current self*, not a prison built by the *past self*. The goal is *least-harm agency preservation*.

  ---

  ### **The DECIDE-V Procedure**
  **(Run these steps in order. Stop and act when you hit a definitive answer.)**

  1.  **D: DIRECTIVE TRIGGER MET? (Fact)**
      *   *Question:* Does the *exact, literal* condition written in the directive apply *right now*? (e.g., "<4 hours sleep x 3 nights"? "<$X given away"? Specific phrases spoken?)
      *   *Good Enough Answer:* "Yes" (Triggered) or "No" (Not Triggered) based solely on observable facts/document wording.
      *   *Stop & Act If:* **No.** **Do NOT activate directive.** Explain why trigger isn't met. Document. (This handles *most* "trigger gaming").
      *   *If Yes:* Go to Step 2.

  2.  **E: EMERGENCY CAPACITY NOW? (Clinical Fact)**
      *   *Question (Fast Version):* Is the person *unable* to understand the *current* situation, the directive they made, its consequences, and communicate a choice *about this specific decision*? (Focus: *Current* understanding of *current* choice).
      *   *Good Enough Answer:* Use a stripped-down capacity screen:
          *   "Can you tell me what's happening right now that made us look at this document?" (Understanding Situation)
          *   "What does this part of your directive say we should do if [trigger] happens?" (Understanding Directive)
          *   "What do you think would happen if we did that? What if we didn't?" (Understanding Consequences)
          *   "What do you want us to do *right now* about this?" (Communicating Choice)
      *   *Stop & Act If:* **No Capacity.** **ACTIVATE DIRECTIVE.** Current self cannot make this decision safely. Document incapacity findings briefly.
      *   *If Capacity Present:* Go to Step 3.

  3.  **C: COHERENT REASON FOR OVERRIDE? (Values/Fact Hybrid)**
      *   *Question:* "The document says [X]. You're saying [Y]. Help me understand *why* you want something different *now* than what you planned?" Listen for:
          *   **Value Drift:** "My core beliefs/priorities are fundamentally different now." (e.g., "I found God," "I don't fear mania anymore," "My kids changed my perspective").
          *   **New Information:** "Something happened/changed that I *never* knew about or considered when I wrote this." (e.g., "That med causes permanent tremor now," "My spouse died," "I have a new diagnosis," "This church is my only support now").
          *   **Invalid Reason (Red Flags):** Denial of illness ("I'm fine!"), minimizing consequences ("$200 is nothing!"), blaming past self without substance ("I was an idiot"), incoherent rambling, pressured speech contradicting known history.
      *   *Good Enough Answer:* A clear, internally consistent statement falling into Value Drift or New Information that *plausibly* relates to the decision *and* isn't contradicted by known history/clinical presentation. *Doesn't need philosophical depth, just coherence and relevance.*
      *   *Stop & Act If:*
          *   **Valid Value Drift/New Info Present:** **DO NOT ACTIVATE DIRECTIVE.** Honor current choice. Document reason clearly (e.g., "Client reports religious conversion fundamentally altering values re: medical intervention, capacity intact, override directive").
          *   **Invalid Reason/No Answer:** **ACTIVATE DIRECTIVE.** Current reasoning is impaired or insufficient to override prior considered judgment. Document reason (e.g., "Insists 'I'm fine,' minimizes risk of $200 gift despite known pattern, unable to articulate coherent reason to override").
      *   *If Unsure:* Go to Step 4.

  4.  **I: INVOLVE PROXY/PROCESS? (Safety Net)**
      *   *Question:* Does the directive specify a *process* or *person* to involve BEFORE a final decision/action? (e.g., "Call my sister," "Wait 24 hours," "Consult Dr. Smith").
      *   *Action:* **FOLLOW THE PROCESS STEP NOW.** This is often the safest move. It buys time, gathers context, and leverages trust. *Do this even if you're leaning towards override or activation.*
      *   *After Process:* Re-assess capacity (Step 2) and reason (Step 3) *after* the process step. Did new info emerge? Did the conversation clarify capacity/reasoning?
      *   *Stop & Act If:* Process step resolves the ambiguity (e.g., sister provides crucial new context, waiting period allows symptoms to clarify). Otherwise, proceed to Step 5.

  5.  **D: DEFER OR DEFAULT? (Risk Mitigation)**
      *   *Situation:* Still ambiguous after Steps 1-4? (Rare, but happens: Unreachable proxies, client silent/stuck, complex new info at 2am).
      *   *Rule:* **DEFAULT TO MINIMIZING IMMEDIATE HARM.**
          *   *If Directive Action is Restrictive (e.g., force meds):* **DEFER.** Do the *least* restrictive thing that maintains *immediate* safety while gathering more info. (e.g., "We won't force meds *tonight*, but you stay here, we monitor, we call sister/doctor *first thing* AM, we revisit then.").
          *   *If Directive Action is Protective/Preventative (e.g., hold funds, prevent discharge):* **DEFAULT TO DIRECTIVE.** Err on side of protection if harm is imminent and override reason is weak/unclear. (e.g., "We're holding your checkbook per your directive until we can talk more tomorrow.").
      *   *Document Meticulously:* The ambiguity, steps taken, specific safety risks considered, plan for reassessment.

  6.  **E: EXPIRY/REVIEW BUILT-IN? (Future Proofing - For Drafting Sessions ONLY)**
      *   *Mandatory Question During Drafting:* "Things change. When should we *automatically* review this to see if it still fits, even if nothing bad happens? (e.g., 1 year? 2 years? After a major life event?)".
      *   *Mandatory Action:* **SET AN EXPIRY/REVIEW DATE** (Max 2 years for most, 1 year if unstable/high risk). Build it into the document: "This directive expires on [Date] unless reviewed and reaffirmed." Schedule the review *now* in your system.
      *   *Why:* Catches slow Value Drift, New Information accumulation, and outdated triggers *before* a crisis. Your cheapest misfire prevention.

  **V: VALUES CHECK (Core Principle - Remind Yourself)**
  *   Before finalizing any decision (especially override or deferral): **"Am I preserving agency or overriding it? Is the *least* harmful path being taken *now*?"** This is your gut-check against paternalism or abdication.

  ---

  ### **Running DECIDE-V on Your Cases**

  **(A) Bipolar Client (Sleep 4hrs x2 nights, $200 given, refusing, coherent)**
  1.  **D: Trigger Met?** NO. Literal trigger is "<4 hrs x 3 nights". It's only night 2. $200 may or may not meet the financial trigger (document matters!).
      *   **STOP & ACT: DO NOT ACTIVATE DIRECTIVE.** "The plan says 3 nights, it's only been 2. We won't force meds based on this document right now." *Explain this to the ER doc/resident.* Monitor closely. Document trigger not met. ***(This avoids the "trigger gaming" bind by enforcing literal meaning).***

  **(B) Religious Conversion (Wants 11yo directive voided, capable now)**
  1.  **D: Trigger Met?** (N/A - This is about revocation, not trigger firing. Start at Step 2).
  2.  **E: Capacity Now?** YES (as described).
  3.  **C: Coherent Reason?** VERY LIKELY YES ("Different and worse person" + religious conversion = **Value Drift**). It's coherent, relevant, and plausible.
      *   **STOP & ACT: DO NOT ACTIVATE (HONOR VOID REQUEST).** "You've clearly explained how your core values have fundamentally changed. You have the capacity now to make this choice. We will void the old directive. Let's talk about what, if anything, you want in its place now." Document thoroughly: "Client with intact capacity requests revocation of dated directive citing profound religious conversion altering core values and identity. Directive voided per DECIDE-V Step 3." ***(You get the "uncomfortable" answer: Past self loses).***

  **(C) Clinic "No Police" Policy (Staff want to repeal, nurse injury)**
  *   **Is it the same shape? NO.** Group policies differ fundamentally:
      *   *Agent:* The policy binds the *organization* (current staff/admin), not an individual whose capacity fluctuates.
      *   *Process:* The repeal mechanism *is* the safeguard (2/3 vote). Ignoring it undermines institutional integrity & trust.
      *   *Emergency:* Physical violence causing injury is **new information** potentially unforeseen in the *original scope* of the policy (which likely assumed patient *distress*, not staff *injury*).
  *   **Applying DECIDE-V Logic (Adapted for Group):**
      1.  **D: Policy Trigger Met?** YES (Patient on premises, police call considered).
      2.  **E: "Group Capacity"?** (Not literal). Focus: **Is the *current* harm/risk unforeseen & extreme?** YES (Broken arm = severe physical harm).
      3.  **C: Coherent Reason for Override?** YES (**New Information:** Policy drafters likely didn't contemplate *this level of imminent physical danger to staff* as the sole reason against calling police). Staff consensus is strong evidence.
      4.  **I: Involve Process?** Policy repeal process is slow (2/3 vote). *Not feasible mid-emergency.*
      5.  **D: Defer or Default?** **DEFAULT TO MINIMIZING IMMEDIATE HARM.** Calling police to protect staff from imminent violence minimizes harm *now*.
  *   **Action:** **OVERRIDE POLICY THIS INSTANCE.** Call police for staff safety. **Document Meticulously:** "Policy overridden under DECIDE-V adapted group principles due to unforeseen severe staff injury (New Info), imminent safety risk, and inability to utilize repeal process mid-crisis. Policy review for emergency violence exceptions triggered." ***(Uncomfortable answer: Policy loses to current harm minimization).*** *Crucially, this triggers an immediate formal review of the policy itself.*

  ---

  ### **Where DECIDE-V Can Misfire & Cheap Safeguards**

  1.  **Subtle Incapacity Missed (Step 2):** Especially in high-functioning folks or early mania.
      *   *Cheap Safeguard:* **Always ask the 4 capacity questions (E-step), even if they seem "fine."** Use collateral from the ER nurse/tech ("Did he seem confused? Pressured?"). *When in doubt on capacity, lean towards directive activation (Step 2 default).*
  2.  **"Coherent" Bad Reasoning Accepted (Step 3):** E.g., someone with severe OCD gives a "coherent" but illness-driven reason.
      *   *Cheap Safeguard:* **Correlate reason with KNOWN HISTORY/DIAGNOSIS.** Does this "new value" align with their stable self? Does the "new info" actually change the risk calculus? *Require the reason to be *plausibly disconnected* from their illness pattern.*
  3.  **Process Step Fails (Step 4):** Proxy unreachable, waiting period dangerous.
      *   *Cheap Safeguard:* **Define "Process Feasibility" during drafting.** "If sister unreachable after 1 hour, proceed to..." Build contingencies.
  4.  **Outdated Directive (General):**
      *   *Cheap Safeguard:* **MANDATORY EXPIRY DATES (Step 6).** Your strongest prevention. No expiry? Flag directives >3 years old for *urgent* review during *any* contact.
  5.  **2am No-Info Nightmare (Step 5):**
      *   *Cheap Safeguard:* **Build "Defer/Default" rules INTO the directive during drafting.** "If unclear at 2am, do X until 8am." "Default to protective action if proxy unreachable."

  **Explaining to the Sibling:** "We used a clear checklist based on what your brother wrote and his state *right then*. The plan says [X]. We checked if the exact situation matched [It did/didn't]. We checked if he understood what was happening [He did/didn't]. We asked why he wanted different [He gave this reason/He couldn't]. Based on those answers, the rules said we had to [follow/not follow] his plan to keep him safest *in that moment*. We documented it all. We're happy to review the steps with you."

  **DECIDE-V isn't perfect.** It prioritizes safety, clarity, and respecting *considered* choices (past or present) over theoretical consistency. It makes the "uncomfortable" choice in (B) and (C) because those scenarios expose the flaw in rigid past-self worship. **Its power comes from forcing specific, documented questions at critical points, replacing "judgment call" with "structured inquiry."** Use the expiry dates (Step 6) religiously – they prevent more problems than anything else.
