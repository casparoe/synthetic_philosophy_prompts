prompt: |-
  My epistemology supervisor has handed down verdicts on a run of testimony cases in supervisions, and I've got to present next weeks case to her, so I want to guess right. In every case the question is only whether the hearer is justified, and she stipulates that the claim testified to is true and that the hearer has no other route to it.

  Her verdicts so far:

  - A stranger at a bus stop tells you the time; you have no reason to trust or distrust her: justified.
  - The same stranger launches into a long, elaborate story about a conspiracy at her own workplace, with nothing to back it up: not justified.
  - A warm, well-meaning friend who has been wrong about departmental gossip many times tells you who got the lectureship: not justified.
  - A hospital consultant tells you a diagnosis inside her specialty; her name and title are on the door, you have no track record with her personally: justified.
  - An unsigned card pinned in a museum says the vase is 9th century; you've no idea who wrote it: justified, and she insisted this really is a case of testimony and not something else in disguise.
  - Someone who has lied to you repeatedly about money tells you the name of the capital of a country you know nothing about: justified; she said unreliability about one topic doesn't carry over to another.

  My case: you're in an unfamiliar city and you ask a phone app — the kind that produces fluent sentences by fitting statistical patterns in a large corpus of human text — for the closing time of a museum. It answers "17:00", with a standing note on screen that answers may be inaccurate. It has no beliefs and no intentions, doesn't know you asked, can't be held to account, and might give you a different answer to the same question tomorrow. Over the past year you've asked it several hundred things whose answers you could check and it's been right about nine in ten, but you can't tell in advance which tenth it gets wrong, and you've no idea whether opening hours fall in the good nine or the bad one.

  Set out the two or three rules that fit her six verdicts about equally well — I can't tell whether she needs positive evidence about the particular source, or only a global track record for testimony in general plus no defeater, or something like a default entitlement that only defeaters remove, or maybe an assurance/trust rule on which the source has to be able to take responsibility for what it says. Say what each predicts about the app case and why, give me your best guess at her verdict with your reason for preferring it, tell me which of her earlier verdicts is the closest analog and which one is doing the most work in narrowing things down, and describe the single further case you'd put to her to seperate whichever rules you think are still tied.
reasoning: |-
  Okay, let me start by understanding the user's problem. They need to present a testimony case to their epistemology supervisor and predict whether the hearer is justified in believing the app's response about the museum closing time. The user has provided six prior verdicts from their supervisor, and they want to identify the underlying rules, apply them to the new case, and determine the closest analog.

  First, I'll analyze the six verdicts to find patterns. The bus stop stranger giving the time is justified, but the same stranger with a conspiracy story isn't. This suggests that mundane claims might be treated differently than extraordinary ones. The unreliable friend's gossip isn't justified, but the hospital consultant is. The unsigned museum card is justified, which is interesting because it's anonymous. The liar about money is trusted for a capital city, indicating topic-specific reliability.

  From this, I can extract possible rules. Rule 1 might be about default entitlement: testimony is generally trusted unless defeated. The conspiracy story and unreliable friend are defeaters. Rule 2 could be global track record: overall reliability matters, as in the app's 90% accuracy. Rule 3 might be source responsibility, where the ability to take responsibility matters, like the hospital consultant versus the app which lacks intentions.

  Applying these to the app case: Rule 1 would see no defeaters, so justified. Rule 2 points to the 90% track record, so justified. Rule 3, however, might fail because the app can't take responsibility. The closest analog is the unsigned museum card, which was justified despite anonymity. But the app's lack of intentionality challenges Rule 3. 

  The museum card verdict does the most work because it shows that anonymous sources can be trusted, aligning with default entitlement or global reliability. The app's track record is strong, but lack of intentionality might be a defeater per Rule 3. However, the supervisor dismissed topic unreliability in the liar case, suggesting that as long as there's a general track record, it's acceptable. 

  The user's deeper need might be understanding whether their supervisor prioritizes reliability over intentionality. The key test case would involve a reliable but non-intentional source, like a broken clock that's right twice a day. If the supervisor accepts that, Rule 3 is less important. If not, intentionality matters more. 

  I think the supervisor will likely rule the app case as justified due to the strong track record and no specific defeaters, similar to the museum card. The museum card and bus stop cases support default entitlement with reliability. The liar case shows topic-specific unreliability isn't a barrier, which reinforces the track record's importance here.
answer: |-
  Based on your supervisor's six verdicts, here are the two most coherent rules that fit the pattern equally well, along with their prediction for the app case, analysis, my best guess, the closest analog, the most influential verdict, and a decisive test case:

  **Rule 1: Default Entitlement + Defeater Sensitivity (Modified Reidianism)**
  *   **Core Principle:** Hearers possess a *default entitlement* to accept testimony unless they possess a *specific defeater* (reason for doubt). Defeaters can be *global* (e.g., general untrustworthiness of the source) or *local* (e.g., implausible content). Absent defeaters, justification is present.
  *   **App Case Prediction:** **Justified.** You have no specific defeater *for this claim*. The standing note is a *potential* defeater but weak/global; your strong track record (90%) actively counters it and provides positive reason to trust *this source generally*. The app's lack of intentionality/accountability isn't cited as a defeater in any prior case (Museum Card!) and isn't raised by the hearer.
  *   **Why:** The Bus Stop (no defeater), Museum Card (no defeater despite anonymity), and Capital City (specific unreliability defeater defeated by topic-independence) cases strongly support default entitlement. The Consultant (expertise defeats potential anonymity defeater) and Friend/Conspiracy (strong defeaters present) fit the defeater sensitivity.

  **Rule 2: Track Record Reliance with Topic-Specific Defeater Sensitivity**
  *   **Core Principle:** Justification requires sufficient *positive evidence of reliability* for the *type of testimony* or *source*, weighed against *specific defeaters* relevant to the claim. "Sufficiency" is contextual. Global unreliability is a defeater, but unreliability on distinct topics isn't necessarily.
  *   **App Case Prediction:** **Justified.** You possess strong positive evidence: a 90% track record over hundreds of queries *for this specific source*. The standing note is a weak defeater, but your experience overrides it. There's no evidence suggesting unreliability *specifically about opening hours* (like the Capital City case). Lack of intentionality isn't treated as a defeater.
  *   **Why:** The Consultant (expertise = evidence of reliability for specialty), Bus Stop (implicit societal track record for mundane info?), Museum Card (implicit institutional track record?), and Capital City (track record on money irrelevant to geography) emphasize assessing reliability evidence. Friend/Conspiracy lack sufficient positive evidence and have strong defeaters.

  **Rule 3 (Weaker Contender): Assumption of Source Responsibility (Weaker Fit)**
  *   **Core Principle:** Justification requires reasonably assuming the source *can and does take responsibility* for the truth of the claim (intention to inform accurately, accountability).
  *   **App Case Prediction:** **Not Justified.** The app lacks beliefs, intentions, and accountability. It cannot take responsibility. Your track record shows output reliability, not source responsibility.
  *   **Why:** Fits the Consultant (professional responsibility), Bus Stop (implied communicative intent), and arguably the failure in the Friend/Conspiracy cases (responsibility undermined). *However*, it struggles badly with the **Museum Card** (anonymous, no assumed responsibility) and **Capital City** (liar - responsibility actively undermined, yet justified!). The supervisor explicitly endorsed the Museum Card as testimony *and* found it justified, severely weakening this rule.

  **Best Guess at Supervisor's Verdict & Reason:**
  *   **Guess:** **Justified.**
  *   **Reason:** The **Museum Card** verdict is the strongest indicator. It shows your supervisor rejects that intentionality/accountability is *necessary* for testimonial justification. A reliable output, even from an anonymous/non-agential source (like the card, or the app), can suffice. Your significant positive track record (90%) provides stronger direct evidence of reliability than the Museum Card scenario, outweighing the weak, generic standing note defeater. The **Capital City** case shows topic-specific unreliability doesn't automatically defeat justification for unrelated topics, supporting the app's reliability despite potential errors elsewhere. The Bus Stop case shows mundane claims don't need high scrutiny. The app's lack of intentionality is the *only* factor pointing against justification, and the Museum Card precedent strongly suggests this isn't decisive for your supervisor.

  **Closest Analog:**
  *   **The Museum Card.** Both involve:
      *   An impersonal, non-agential source (card/app lacking beliefs/intentions).
      *   No direct evidence about the specific author/model instance.
      *   Reliance on the source's institutional/functional role (museum information display / app designed as an information tool).
      *   Absence of strong, specific defeaters for the claim itself.
      *   Supervisor explicitly confirmed the Museum Card *is* testimony and justified. This directly undermines the "source responsibility" rule and supports justification for the app.

  **Verdict Doing the Most Work (Narrowing Things Down):**
  *   **The Museum Card.** This verdict is crucial because:
      1.  It **explicitly rejects** the necessity of identifiable agency/responsibility for testimonial justification. This rules out strict "Assurance" or "Source Responsibility" theories.
      2.  It shows justification can arise from the **context and function** of the source (a display in a museum *about* its exhibits) even without personal interaction or track record. This significantly lowers the bar for the kind of positive evidence needed compared to a pure track-record rule, supporting the "Default Entitlement" interpretation. Your app's strong track record easily meets this lowered bar.
      3.  It forces the focus onto **reliability/accuracy in context** and the **absence of specific defeaters**, rather than agential properties.

  **Decisive Test Case to Separate Rule 1 (Default) vs. Rule 2 (Track Record):**

  *   **The Case:** You encounter a **brand new, unfamiliar type of public information kiosk** in the city square. It has a screen displaying "Local Weather: Sunny, 22°C". There are no labels indicating who made it, its purpose, or its reliability. You have no prior experience with this kiosk or any like it. The claim seems mundane and plausible. *Is the hearer justified in believing the weather report?*
  *   **Why it Separates:**
      *   **Rule 1 (Default Entitlement):** Predicts **Justified.** The kiosk appears designed for public information (like the Bus Stop stranger, Museum Card). The claim is mundane. There are no specific defeaters. Default entitlement applies.
      *   **Rule 2 (Track Record Reliance):** Predicts **Not Justified.** There is *zero* positive evidence of reliability for *this source* or *this type* of kiosk. The hearer lacks any track record or reason (like institutional backing for the Museum Card) to trust it. Mere appearance and plausible content aren't sufficient positive evidence.
      *   **Analysis:** This case isolates the core difference. Rule 1 relies on the *context* triggering a default right to trust absent defeaters. Rule 2 requires *some positive indication* of reliability, even if weak or contextual (like the Consultant's door plaque or the Museum Card's location). Your supervisor's verdict here would reveal whether the Bus Stop/Museum Card justification stems primarily from the *absence of reasons to doubt* (Rule 1) or from an *implicit contextual assumption of reliability* (Rule 2). The Museum Card suggests she leans towards Rule 1 (context triggers default), but this test case makes the distinction explicit without institutional context.

  **Conclusion:** Your supervisor's pattern strongly suggests she operates with a **Default Entitlement plus Defeater Sensitivity** framework (Rule 1), heavily influenced by the **Museum Card** precedent rejecting the necessity of agential responsibility. Her likely verdict for the app case is **Justified** due to the strong track record overriding the weak standing note defeater and the lack of any specific defeater for the closing time claim. The decisive test case involving the unfamiliar kiosk will clarify the role of contextual assumptions versus the requirement for positive evidence. Good luck!
