prompt: |-
  Hey — I've got an MA student who wants to write a one-semester term paper (about 6000 words) on consequentialist cluelessness, and I need to turn their half-baked idea into an actual proposal I can hand back to them. So: you're a professional moral philosopher who's also completely at home in decision theory and heavy-tailed probability distributions — take this seriously, brainstorm for a bit before you start drafting, and don't give me a literature survey.

  Their hunch, as far as I can tell: the cluelessness debate keeps treating the problem as one about variance, or about unknown far-future effects, and then argues about whether those unknowns wash out in expectation. The student wants to claim that the interesting case isn't high variance at all but undefined expectation — if the distribution over an act's downstream effects is heavy-tailed enough (think Pareto with tail index around or below 1), there is no expected value to be clueless about, so the standard "the noise is roughly symmetric, it cancels" move has nothing to cancel. On that picture cluelessness doesn't make consequentialism misleading, it makes it incomplete: for some acts the theory returns no verdict. And incompleteness might call for a different fallback than the ones usually reached for (rules, virtues, hedging, satisficing, searching for options that look good under many models).

  What I want: a one-page proposal — the question stated precisely enough that it has a determinate answer inside 6000 words; why both the cancelling-out response and the usual "then fall back on non-consequentialist criteria" response leave it open; the method, including the one bit of formalism they'd have to actually get right and when in the semester they'd do it; the two or three possible conclusions and what would decide between them; and an honest note on what would make the project fail or blow past a semester.

  Also: there are a few places where they'll just have to stipulate something — how to model the tail, and whether to treat cluelessness as imprecise credence, as model/structural uncertainty, or as plain undefined expectation. Pick one for them and say why that one rather than the obvious alternatives. No citations and no bibliography, they'll fill those in themselves and I don't want invented references. Take a definite line throughout: tell me what you think the right framing is and defend it, don't lay out the menu and leave me to choose. And if you think the whole idea is a dud, say so — with reasons.
reasoning: |-
  Okay, let me tackle this professor's request step by step. They need a concrete term paper proposal for their MA student's idea on consequentialist cluelessness with heavy-tailed distributions. 

  First, I need to unpack the core idea. The student is challenging the standard "cancelling out" response to cluelessness by arguing that some acts have truly undefined expected value due to heavy-tailed distributions (Pareto α≤1). That's clever - it shifts the problem from epistemic uncertainty to mathematical incompleteness in the theory itself. 

  The professor wants this framed as a precise research question. I think the key is specifying: "Does infinite expectation undermine consequentialism's completeness?" This isolates the mathematical heart while leaving room for philosophical analysis. 

  For the method, the student must formally show when expectations diverge. They'll need to:
  - Prove EV divergence for Pareto α≤1 using integral calculus
  - Contrast with finite-variance cases
  - Argue why this isn't just extreme uncertainty but true undefinedness

  The formalism is non-negotiable but manageable - a week of focused work around mid-semester should suffice. 

  Where stipulations are needed, I'll make calls:
  - Pareto distributions: canonical for heavy tails, clear divergence threshold
  - Model as undefined expectation: this is what breaks consequentialism fundamentally
  - Not imprecise credence: that keeps EV defined (just interval-valued)

  Possible conclusions range from "consequentialism is incomplete" (most likely) to "we must reframe dominance reasoning" (more speculative). The deciding factor will be whether they can show practical cases where α≤1 is plausible.

  Biggest risks? 
  - Getting bogged down in probability theory
  - Failing to distinguish this from ordinary uncertainty
  - Overreach in practical applications

  But if they nail the formalism by week 8 and stay focused, it's viable. The originality lies in treating cluelessness as mathematical failure rather than epistemic limitation - that's worth pursuing.
answer: |-
  ### Refined Term Paper Proposal: "Consequentialism's Missing Verdicts: Cluelessness as Incompleteness under Heavy-Tailed Uncertainty"  

  **Core Question:**  
  *Does consequentialism fail to deliver action-guidance for choices whose downstream effects follow a heavy-tailed distribution (Pareto, α ≤ 1), rendering expected value undefined—and if so, does this demand a structurally distinct fallback strategy compared to standard cluelessness responses?*  

  **Why Existing Responses Fail:**  
  1. **The "cancelling-out" move** presupposes a finite expectation. When α ≤ 1, the Pareto distribution’s expectation diverges: ∫<sub>k</sub><sup>∞</sup> x · (αk<sup>α</sup>/x<sup>α+1</sup>) dx = ∞ for all acts. There’s no expected value to converge toward, no symmetry to exploit. Consequentialism returns *no verdict*, not a noisy one.  
  2. **Standard fallbacks** (e.g., rules/virtues as proxies for expected value, satisficing, hedging) assume cluelessness is *epistemic* (we lack the value, but it exists). Here, the problem is *mathematical*: the theory lacks an operative criterion. Applying proxies designed for high-variance cases misses the pathology.  

  **Method & Formalism:**  
  - **Core Formalism (Weeks 3–5):** Prove that for a random variable *X* ~ Pareto(α, k), *E[X]* = ∞ iff α ≤ 1. Contrast with α > 1 (finite mean, infinite variance possible). Key insight: When α ≤ 1, increasing data *increases* the sample mean’s volatility—it doesn’t converge.  
  - **Philosophical Translation (Weeks 6–8):** Argue that undefined expectation ≠ extreme uncertainty. Use decision-theoretic axioms (e.g., dominance under statewise dominance fails when expectations are infinite) to show consequentialism is *incomplete*—not silent, but inapplicable.  
  - **Fallback Analysis (Weeks 9–12):** Test if non-consequentialist fallbacks address incompleteness. Does "maximize robustness across models" help if *all* models have undefined expectation? Does virtue ethics bypass the problem or obscure it?  

  **Stipulations (Defended):**  
  - **Model:** Pareto distributions (α ≤ 1). *Why?* They are the canonical heavy-tailed model with a sharp threshold for undefined expectation. Other distributions (e.g., Cauchy) share this property but Pareto’s scale-invariance mirrors how cluelessness compounds over time.  
  - **Cluelessness as Undefined Expectation** (not imprecise credence/model uncertainty). *Why?* Imprecise credence preserves a *set* of expected values; model uncertainty assumes a true EV exists. Here, the EV is *provably undefined* under the theory’s own calculus—a deeper failure.  

  **Possible Conclusions:**  
  1. **Strong Incompleteness (Likely):** Consequentialism is incomplete for α ≤ 1 distributions. Fallbacks must be *procedural* (e.g., "choose options with defined expectations" or "minimize tail exposure") not substantive.  
  2. **Reinterpretive Escape (Possible):** Consequentialism can be salvaged by redefining "value" (e.g., using median utility). But this abandons standard expected utility theory.  
  3. **Practical Irrelevance (Unlikely):** Real-world cluelessness never involves α ≤ 1. But plausibly: AI/geoengineering effects may have such tails (e.g., value impact scales with event size, not frequency).  
  *Decider:* Whether real-world cluelessness cases can be credibly modeled with α ≤ 1. If yes, (1) wins; if no, (3) wins.  

  **Execution Risks & Mitigation:**  
  - **Blowup Risk 1:** Obsessing over probability theory. *Mitigate:* Strict formalism deadline (Week 5). The math is a tool; the philosophy starts once divergence is proven.  
  - **Blowup Risk 2:** Conflating with risk-aversion or longtermism. *Mitigate:* Explicitly contrast with Bostrom/Ord-style cases (finite EV, high variance).  
  - **Failure Risk:** Undefined EV being dismissed as "just extreme risk." *Mitigate:* Hammer the decision-theoretic point: no EV → no dominance → no action-ranking.  
  - **Semester Killers:**  
    - Chasing citations instead of the argument.  
    - Letting tail-index estimation swallow the project (use stylized cases: "Suppose α = 0.8...").  
    - Ambiguity about target (is this a critique of *all* consequentialism, or a boundary condition?).  

  **Verdict:** Not a dud. The angle is novel, narrow enough for 6k words, and forces a confrontation with decision theory’s mathematical foundations. If the student nails the formalism early and ties it to a clear incompleteness thesis, this could be sharp. They must avoid three pitfalls: overgeneralizing, getting lost in distributions, and conceding that "infinite EV is just really big EV."  

  ---  
  **Hand this to your student.** They’ll need to: (1) Master the Pareto EV proof, (2) Pick 1–2 concrete cluelessness cases (e.g., "engineer this solar geoengineering aerosol"), and (3) Commit to incompleteness as the target. No citations here—they’ll find Pareto in probability texts (e.g., Embrechts) and cluelessness in Lenman/Greaves. If they start by Week 2, it’s doable.
