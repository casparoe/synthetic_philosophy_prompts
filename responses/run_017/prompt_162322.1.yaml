answer: |-
  Below is a decision tree designed to guide users from the basic commitment to true *de re* modal claims about ordinary objects to specific modal metaphysics positions, using only logically prior questions. It incorporates your diagnostic cases (nonexistence, haecceitism, fission) and flags indistinguishability where applicable. The tree has **six binary branch nodes**, phrased for accessibility, and marks empty cells with brief explanations. Positions drop into the leaves they occupy, with notes on gaps.

  ---

  ### **Decision Tree for *De Re* Modality**  
  *Start here if you believe there are true claims like "I could have been a painter" or "This table might not have existed".*

  1. **Are there non-actual concrete worlds?**  
     *(Concrete worlds: spacetime systems as real as ours, but not actual.)*  
     → **Yes** → Go to 3.  
     → **No** → Go to 2.  

  2. **Do we quantify over abstract world-surrogates?**  
     *(Surrogates: non-concrete entities, e.g., maximal consistent sets of propositions, representing possibilities.)*  
     → **Yes** → Go to 3.  
     → **No** → Go to 6.  

  3. **Can the same individual exist in multiple worlds?**  
     *(Or are claims like "I exist in another world" literal?)*  
     → **Yes** → Go to 4.  
     → **No** → Go to 5.  

  4. **Is individuation across worlds qualitative?**  
     *(Could two worlds be identical in all qualitative properties but differ only in which individual is you?)*  
     → **Yes** → 🚫 **Empty**: Unattractive (collapses distinct possibilities where only haecceities differ).  
     → **No** → ✅ **Actualist transworld identity with haecceities**  
     *(Handles nonexistence (1): You don't exist in worlds lacking your haecceity. Handles haecceitism (2): Requires non-qualitative "thisness". Fission (3) problematic: Identity can't split, so neither successor is strictly you.)*  

  5. **Is the counterpart relation sensitive to context?**  
     *(Does "my counterpart" depend on how we describe the scenario?)*  
     → **Yes** → ✅ **Context-sensitive counterpart theory**  
     *(Handles fission (3): Context determines if one/both/none are counterparts. Haecceitism (2) and nonexistence (1) handled flexibly.)*  
     → **No** → Go to 5a.  

     **5a. Is the counterpart relation grounded in qualitative similarity?**  
     → **Yes** → ✅ **Lewis-style modal realism** (if from 1) or **Ersatz similarity-based counterpart theory** (if from 2).  
     → **No** → ✅ **Primitive counterpart theory** (if from 2) or 🚫 **Empty** (if from 1: Unattractive for concrete worlds—no clear motivation without similarity).  
     *(All counterpart theories handle nonexistence (1): Worlds with no counterpart make "I might not exist" true. Handle haecceitism (2): Counterparts needn't be qualitatively unique. Handle fission (3): Allow one-many relations.)*  
     **Note**: Without context-sensitivity, similarity-based and primitive counterparts are indistinguishable externally—both validate the same modal profiles (e.g., for fission or haecceitism).  

  6. **Is modality analyzed via fictional world-talk?**  
     *(Are claims like "There is a world where I don't exist" useful fictions?)*  
     → **Yes** → ✅ **Modal fictionalism**  
     *(Handles cases (1–3) via fiction, but faces "smuggling" charges: Primitive modality often sneaks into the fiction's rules.)*  
     → **No** → ✅ **Modal primitivism**  
     *(Takes "I might not exist" (1) as brute; avoids worlds altogether. Smuggling explicit: Modality is irreducible.)*  

  ---

  ### **Key to Positions & Diagnostics**
  - **Named positions**:  
    - **Lewis-style modal realism** (concrete worlds; similarity-based counterparts).  
    - **Actualist transworld identity with haecceities** (abstract worlds; non-qualitative individuation).  
    - **Ersatz counterpart theories** (abstract worlds; counterparts vary by grounding).  
    - **Modal fictionalism** and **primitivism** (no world-quantification).  
  - **Empty cells explained**:  
    - Transworld identity + qualitative individuation → Denies haecceitism (2), rendering indistinguishable possibilities distinct—*unattractive*.  
    - Concrete worlds + primitive counterparts → No advantage over similarity-based views; no prominent defender—*never tried*.  
  - **Diagnostic coverage**:  
    - **Nonexistence (1)**: Forks at transworld identity (requires haecceities) vs. counterparts/fictionalism/primitivism (handled naturally).  
    - **Haecceitism (2)**: Forks at transworld identity (requires non-qualitative individuation) vs. counterparts (qualitative similarity or context).  
    - **Fission (3)**: Forks at transworld identity (rejects fission as identity-preserving) vs. counterparts (allows one-many relations).  
  - **Indistinguishability note**: Similarity-based and primitive counterparts (non-contextual) agree on truth-values for all *de re* claims—only metaphysical grounding differs.  

  ---

  ### **Tree Logic & Unexplored Cells**
  - **Why only six nodes?** The branches exhaust combinations of your specified questions (concreteness, quantification, transworld identity, individuation, counterpart grounding, reductionism).  
  - **Unexplored paths** (e.g., concrete worlds + transworld identity) are omitted as incoherent: Transworld identity requires worlds to share individuals, but concrete worlds spatiotemporally isolate everything—*no theorist combines these*.  
  - **Output-driven**: Paths terminate in positions or explicit gaps—no "choose your label" steps.  

  This tree separates all major positions while using your cases to force decisive forks. Handout-ready for first-years!
