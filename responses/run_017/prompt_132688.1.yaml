  The rooftop air smells of distant rain and old brick. Below them, the vacant lot – the proposed site – is a dark gash between the amber-lit buildings. Miriam leans against the parapet, arms crossed, watching Dev pace. His usual planner’s calm is frayed.

  **Miriam:** Forty-one years, Dev. Forty-one winters scraping ice off that bus, summers sweating through that tin can. That lot was a junkyard when I moved in. We *made* this block livable when the city wrote it off. And now some… algorithm… says my say counts less than someone who *might* show up? What weight do you give a ghost?

  **Dev:** (Stops pacing) It’s not less, Miriam. It’s weighted by the future you declare. You stay forty more years? Your voice carries the weight of forty years of commitment. But the people who *need* that building… their future is zero in your system. It’s rigged against them before they even get a shot.

  **Miriam:** Rigged? We *earned* this say. By staying. By paying rent through floods and rats and landlords who wouldn’t fix a damn thing. The city forgot us. We didn’t forget each other. You hand votes to phantoms, what’s left of that? Who holds *them* accountable? Who suffers if *they* change their mind? You built a machine that counts paper promises. We count *people*.

  **Dev:** (Runs a hand through his hair) The clawback holds *us* accountable. Leave early, your past vote gets recalibrated. The outcome can be revisited. It’s messy, yeah, but it tries to tie the vote to the actual stake.

  **Miriam:** (Eyes narrow slightly at ‘clawback’) Revisited? Five years later? After the concrete’s poured, the rents are set? That’s not accountability, Dev, that’s chaos. Punishing someone because life happened? A job loss, an illness… (Her voice catches, almost imperceptibly)… a grandchild needing you? That clawback turns a vote into a prison sentence. You think that’s *fair*?

  **Dev:** It’s not perfect. It’s… the best way I found to approximate the long-term cost. People who declare long horizons *should* bear the consequences if they bail. But Miriam… the people on that waitlist? They exist *now*. They’re drowning in rent, doubled up, sleeping on couches. They’re not ghosts. They’re just… locked out. Your rule says their need doesn’t count until they magically materialize inside the walls. It pretends the walls are the only reality that matters.

  **Miriam:** The walls *are* the reality for the people *in* them! The family in 3B scraping together first and last because their old place got flipped? The seniors terrified of being priced out? They’re *here*. They sweated, they stayed. They have skin in the game *now*. You want to dilute their hard-won say for the sake of a theoretical somebody? That feels like… erasure. Like everything we built through the lean years counts for nothing because the wind changed direction.

  **Dev:** (Quieter) Is it erasure… or sharing? The city isn’t static. It’s a current. People leave, people arrive. The rule… it tries to recognize the claim of those who are coming, who *need* to come, not just those who already landed. Pretending otherwise… it freezes the city in amber. For the privileged few who got here first.

  **Miriam:** Privileged? (A dry, humorless laugh) Driving a school bus? Living check-to-check in a rent-stabilized walk-up? That’s privilege now? We weren’t first, Dev. We were just… stubborn. We held on. That stubbornness *is* the claim. It’s the only currency we had. And you want to devalue it overnight so your model balances? So the planners sleep easy?

  **Dev:** (Looks down at the dark lot) My model… it showed this project only works if the existing residents with long horizons vote yes. If the declared permanence… carries weight. Without that… (He trails off, then meets her gaze, a flicker of genuine unease) You think permanence is something you *earn* by endurance alone. I think… sometimes permanence is just luck. Or circumstance. And the city owes a duty to the ones who weren’t lucky enough to get here sooner.

  **Miriam:** Duty. Fine. But a vote? You give a *vote* to someone who doesn’t live here, doesn’t pay taxes here, doesn’t know Mrs. Kowalski’s cat gets stuck on the fire escape every Tuesday? That’s not duty, Dev. That’s… fantasy. It’s handing the keys to strangers who haven’t even found the door yet. It makes the vote mean nothing. Just paper promises and phantom voices.

  **Dev:** And what about the phantom voices *you’re* silencing? The ones whispering from waitlists and shelter beds? Doesn’t the city belong to them too, even if they haven’t found their corner of it yet? Doesn't their need… their *future* need… have a weight? Even a fractional one? Because ignoring it feels like… deliberately turning away from the storm gathering just outside the gate.

  **Miriam:** (Stares at him, the wind whipping strands of grey hair across her face. A long silence. When she speaks, it’s low, almost wondering) You talk about ghosts needing votes, Dev. But what about the ghost of the woman who *might* leave? The one who declares forty years because it’s expected, or because the numbers demand it… even if her heart’s pulling her someplace else? What weight does *her* lie carry in your beautiful machine? What violence does it do… to the future… and to herself?

  Dev freezes. The distant wail of a train cuts through the night. He doesn’t look at the lot. He looks only at Miriam, his expression shifting from argument to something colder, sharper – the sudden, chilling clarity of a planner recognizing an unforeseen variable, a human flaw in the model. He opens his mouth, closes it.

  **Dev:** (His voice is barely above a whisper, stripped of all planning jargon, raw) "...Violence? Miriam… what horizon *are* you going to declare tomorrow?"

  The rain begins, a cold, sparse spatter on the tarpaper roof between them. Miriam doesn’t flinch. She just holds his gaze, the unspoken answer hanging heavier than the coming downpour.
