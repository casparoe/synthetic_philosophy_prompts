  ### Removal Test: Alter the Key Feature  
  - **Test**: Change the target in Item 2 to a single-group sequence (e.g., `"M M M"`).  
  - **Result**:  
    - Surface account: Remove last symbol → `"M M"`.  
    - Relational account: Reduce group to first element → `"M"`.  
    - **Disagreement remains** (no collapse into agreement).  
  - **Why?** The disagreement persists because the relational account still applies the rule per group (now one group), while the surface account still removes the last symbol. The key feature (single vs. multiple groups) amplifies the disagreement but is not the sole cause—the *per-group application* in the relational account is the core driver.  

