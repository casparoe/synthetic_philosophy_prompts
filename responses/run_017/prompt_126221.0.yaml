answer: |-
  ### Joint Statement of Collaboration: Metaphysical Disagreement on Composite Objects  

  #### 1. Agreed Claims  
  Both parties accept the following non-trivial claims. A hostile reader from either camp would endorse these:  

  1. **Common Ground on Simples and Observations**:  
     - There exist fundamental particles ("simples") with specific properties (e.g., mass, charge).  
     - Simples can be arranged in patterns (e.g., "arranged table-wise" or "arranged organism-wise"), and these arrangements explain all observable phenomena (e.g., a human perceives a "table" when interacting with simples arranged table-wise).  
     - All scientific predictions, measurements, and practical outcomes (e.g., whether a bridge collapses, whether a virus spreads) depend solely on the properties and arrangements of simples. Neither side’s position alters these predictions.  

  2. **Criteria for a Merely Verbal Dispute**:  
     A dispute is merely verbal if and only if all three conditions hold:  
     - **Eliminability**: The contested term ("exists" as applied to composite objects) can be removed without loss of meaning. Claims about "tables" or "organisms" must be fully restatable using only arrangements of simples, and disagreement vanishes in this restatement.  
     - **Translation**: A two-way manual can translate every assertion in one side’s vocabulary into the other’s, preserving all logical inferences (e.g., "If A, then B" remains valid post-translation) and explanatory power (e.g., why a bridge collapsed).  
     - **No Residual Fact**: If Eliminability and Translation succeed, no fact about the world—beyond language conventions—remains to settle. The dispute reduces to linguistic preference.  

  3. **Primitive Vocabularies and Substantive Commitments**:  
     - **Dissolutionist Primitives**:  
       - *Simples*: Fundamental particles.  
       - *Plural reference*: Ability to refer to many things collectively (e.g., "those simples").  
       - *Arranged-wise predicates*: Fundamental properties describing patterns (e.g., "arranged table-wise").  
       - *No "composite objects"*: Terms like "table" are shorthand for arrangements.  
       - *Substantive commitment?* Exchanging these for realist primitives would alter content. Arranged-wise predicates are irreducible to parthood.  
     - **Realist Primitives**:  
       - *Simples*: As above.  
       - *Parthood*: A fundamental relation where one thing is part of another (e.g., "This atom is part of that molecule").  
       - *Unrestricted composition*: Any collection of things composes a larger object (e.g., "The Eiffel Tower + your left ear" is an object).  
       - *Substantive commitment?* Exchanging these for dissolutionist primitives would lose objective structure. Parthood is a feature of reality, not language.  
     - **Agreed Conclusion**: An exchange of primitives is **not** a notational difference. Each side’s primitives reflect a substantive commitment about what is fundamental.  

  #### 2. Disagreements Table  
  Each row addresses a crux where a settled answer would move at least one party.  

  | Crux | Dissolutionist’s Position | Realist’s Position | Shared Case/Argument | Dissolutionist’s Prediction | Realist’s Prediction | Evidence Moving Dissolutionist | Evidence Moving Realist |  
  |-------|---------------------------|---------------------|----------------------|---------------------------|----------------------|--------------------------------|-------------------------|  
  | 1. **Can ‘composite object’ be eliminated?**<br>(*About words*) | "Exists" applied to composites is eliminable: "There is a table" ↔ "Simples are arranged table-wise." No information lost. | "Exists" is ineliminable: "Table" refers to a real object beyond its parts. Paraphrases lose the fact of composition. | **Case**: "The University Library exists." Both agree it implies simples arranged library-wise. | Paraphrase succeeds; disagreement dissolves. | Paraphrase fails; "exists" denotes a library-shaped object irreducible to parts. | If paraphrases break explanatory roles (e.g., fail to explain why libraries persist through part-replacement). | If paraphrases fully replicate inferences (e.g., identity over time) without "object" talk. |  
  | 2. **Is translation possible?**<br>(*About words/world*) | Translation manual works: Realist’s "object" talk maps to "arranged-wise" talk with identical inferences. | Translation impossible: Realist claims (e.g., "Objects ground causality") have no dissolutionist equivalent. | **Case**: "This cat is alive." Both agree it depends on simples arranged organism-wise. | Translation preserves why the cat moves (inferences match). | Translation omits why the *cat itself* (an object) is the cause. | If realist explanations (e.g., object-level causality) outperform dissolutionist ones empirically. | If dissolutionist vocabulary replicates all realist inferences (e.g., "the cat" as shorthand never misfires). |  
  | 3. **Does the world have ‘mereological structure’?**<br>(*About the world*) | No: Reality has no joints between "wholes" and "parts." Structure is imposed by language. | Yes: Parthood is objective. Unrestricted composition reflects reality’s structure. | **Case**: "The Eiffel Tower + your left ear is an object." | No fact of the matter; depends on "object" definition. | Fact of the matter: Composition is universal and mind-independent. | If science detects parthood as fundamental (e.g., in quantum gravity). | If science never invokes composites beyond convention (e.g., physics uses only arrangements). |  

  #### 3. Held-Out Case: The Ninety-Minute Outage  
  **Case**: A service outage lasted ninety minutes. Both grant:  
  - Machines, network processes, packets, and logs existed.  
  - On-call engineers responded to events.  
  **Question**: Is "the outage itself" (distinct from the above) an object? Does "the outage lasted ninety minutes" require this object’s existence?  

  - **Dissolutionist’s Prediction**:  
    - Realist will say "the outage" is an object (a composite event) and is required for the claim’s truth.  
    - Agreed criteria → Eliminability/Translation succeed: "Outage lasted 90min" paraphrases to "Machines/processes were non-functional for 90min." No object needed.  
  - **Realist’s Prediction**:  
    - Dissolutionist will deny the outage is an object.  
    - Agreed criteria → Eliminability/Translation fail: "The outage" refers to a single event that unifies the machines/processes. Paraphrases omit this unity.  

  *(Predictions made before collaboration; case unresolved here.)*  

  #### 4. Closing Section  
  **Conclusions**:  
  - **Verbal Elements**: The core disagreement (e.g., "Do tables exist?") is **merely verbal** per the agreed criteria:  
    - Eliminability and Translation are possible (per dissolutionist’s arguments).  
    - No residual fact about arrangements of simples remains.  
  - **Substantive Survival**: One question survives: **Does reality have objective mereological structure?**  
    - This is independent of language: The realist claims parthood is fundamental; the dissolutionist denies this.  
  - **Nature of the Survival**:  
    - If the survivor is purely about which *framework* to adopt:  
      - Dissolutionist: Decision is **practical** (e.g., which primitives simplify science). Not truth-evaluable.  
      - Realist: Decision **is truth-evaluable** because it tracks whether parthood is real.  
    - **Joint Conclusion**: The choice of framework has a truth-evaluable core (is parthood fundamental?), which the realist may reasonably call substantive. However, this question is separable from the original verbal dispute.  

  **Outcome of Collaboration**: The first-order dispute (e.g., "tables exist") is dissolved as verbal. The surviving question (mereological structure) is substantive but does not affect observations, predictions, or the shared goal of recording adversarial collaborations.
