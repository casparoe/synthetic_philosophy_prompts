prompt: |-
  I'm putting together the centrepiece handout for a six-week module on end-of-life decision-making that I teach inside a larger applied ethics course, and I'd rather it be a classification instrument than a survey: a decision tree that takes a student from answers about concrete cases to a named position on the doing/allowing and killing/letting-die cluster. The students have plenty of clinical exposure but no theory vocabulary, so each branch node has to be a concrete case or a plain claim they could answer without already knowing which view it pushes them toward — no node may simply ask whether killing is worse than letting die, and no node may turn on a label. Please build it from the logical space rather than from a list of names: first the questions that genuinely separate positions (is there a descriptive distinction here at all; is it pre-moral and causal or does classifying the case already require knowing what the agent owed; is it binary, scalar, or does it need a third category like enabling; does it carry moral weight in its own right or only as a proxy for counterfactual dependence, causal structure, intention versus foresight, rights and claims, agent-relative prerogatives, or facts about who was going to be responsible for the outcome anyway; does the asymmetry run only one way, or are some allowings worse than the matching doings), then locate the actual positions in that space, and note the combinations nobody occupies with a one-line diagnosis of whether they are incoherent, merely unattractive, or just unexplored.

  On cases: I want ten diagnostic questions, and I want the set to stress the distinction rather than confirm it. Please include at least one case where the agent both created the threat and now declines to remove it; one where not preventing requires a positive act (unplugging a ventilator, opening a valve, cancelling an automatic delivery); one where the harm is produced by an independent agent the subject merely fails to restrain; one where the omission is a breach of an institutional role; one genuine killing-by-letting (leaving someone exposed to cold, opening a door onto a hazard); one where the causal mechanism was set up long in advance and the agent merely declines to intervene now; one where the agent prevents a third party from rescuing; and one where the doing/allowing classification seems to shift depending on how fine-grained you make the description of the action — for instance whether refusing to continue a treatment is different in kind from never having started it, and whether the tree can actually tell those apart or whether it has to flag them as inseparable.

  Deliverable format: name each leaf where a name exists and mark it "unnamed" where it doesn't, with one sentence on its most awkward commitment; mark which nodes are load-bearing (many leaves split there) versus fine-grained; and flag explicitly any pair of positions your tree cannot separate, such as a brute principle of doing and allowing versus one derived from victims' claims, or a counterfactual-dependence reduction versus a causal-process reduction. Finally, add a short scoring note for me: patterns of answers that indicate a student is tracking the distinction itself, versus patterns driven by something orthogonal that would make the handout misfire in seminar — outcome severity, legal blameworthiness, or simple squeamishness about certain mechanisms — since I'd rather drop a question than spend a class hour on a misdiagnosis.
reasoning: |-
  We are building a decision tree that classifies positions on the doing/allowing and killing/letting-die distinctions without using theoretical jargon. The tree will have 10 diagnostic questions (nodes) that are concrete cases or plain claims. Each node should force a split in the logical space of positions. The leaves will be named positions (where they exist) or marked as unnamed, with a note on their awkward commitment.

  We'll structure the tree by the logical distinctions:

  1. **Descriptive Distinction**: Is there a difference in the world between doing and allowing? Or is the distinction only moral?
  2. **Nature of the Distinction**: Is the distinction pre-moral (causal) or does it depend on what the agent owed?
  3. **Structure**: Binary, scalar, or with a third category (like enabling)?
  4. **Moral Weight**: Does the distinction carry moral weight on its own, or only as a proxy for other factors (counterfactual dependence, causal structure, intention, rights, agent-relative prerogatives, responsibility for the outcome)?
  5. **Asymmetry**: Is doing harm always worse than allowing harm? Or are there cases where allowing is worse?

  We must include the following cases:

  - Agent created the threat and now declines to remove it.
  - Not preventing requires a positive act (e.g., unplugging ventilator).
  - Harm by independent agent that subject fails to restrain.
  - Omission as breach of institutional role.
  - Genuine killing-by-letting (e.g., leaving exposed to cold, opening door to hazard).
  - Causal mechanism set up long in advance, agent declines to intervene now.
  - Agent prevents a third party from rescuing.
  - A case where the doing/allowing classification shifts with description grain (e.g., refusing to continue treatment vs. never starting).

  We'll design 10 nodes (questions) that cover these and force splits.

  After building the tree, we'll:
  - Name the leaves and note awkward commitments.
  - Mark load-bearing nodes (splitting many leaves) vs. fine-grained.
  - Flag pairs of positions the tree cannot separate.
  - Provide scoring notes for the instructor on patterns that might indicate confounding factors.

  Let's outline the logical space and then create the tree.

  ### Logical Space of Positions

  We consider the following axes:

  1. **Existence of a descriptive distinction**:
     - A: There is a descriptive (non-moral) difference between doing and allowing.
     - B: The distinction is moral (depends on duties, rights, etc.) and not descriptive.

  2. **What the distinction is based on** (if descriptive):
     - Causal structure (e.g., initiating a new threat vs. not interfering with an existing one)
     - Counterfactual dependence (would the harm occur if the agent did nothing?)

  3. **Moral relevance**:
     - The distinction is morally relevant in itself (e.g., doing harm is harder to justify than allowing harm).
     - The distinction is only a proxy for other factors (intention, rights violations, etc.).

  4. **Structure**:
     - Binary: doing vs. allowing.
     - Scalar: some doings are more like allowings and vice versa.
     - Third category: e.g., enabling.

  5. **Asymmetry**:
     - Doing harm is always worse than allowing the same harm.
     - Sometimes allowing can be worse (e.g., when there is a special duty).

  We'll map known positions:

  - **Traditional View** (e.g., Foot, Bennett): There is a descriptive distinction (based on causal structure or counterfactuals) and doing is harder to justify than allowing.
  - **Moralized View** (e.g., Kamm): The distinction is based on rights and duties; whether an act is doing or allowing depends on what the agent owed.
  - **No Intrinsic Moral Difference** (e.g., consequentialists): The distinction is only a proxy for other factors (like overall consequences).
  - **Scalar View**: The doing-allowing distinction is a matter of degree.
  - **Enable View**: Introducing a third category (enabling) that might have intermediate status.

  Now, we design the 10 nodes as questions (cases) that force choices along these axes.

  ### The 10 Diagnostic Questions (Nodes)

  1. **Case of the Unplugged Ventilator**: 
     - *Scenario*: A patient is on a ventilator. If unplugged, the patient dies. The doctor unplugs the ventilator. Is this an instance of killing or letting die?
     - *Purpose*: Tests if a positive act (unplugging) is seen as killing or letting die. This is the classic case and splits views on whether removing life support is doing or allowing.

  2. **Case of the Created Threat**:
     - *Scenario*: An engineer designs a faulty bridge. Years later, he realizes it will collapse and could fix it but doesn't. The bridge collapses, killing people. By not fixing it, did he kill them or let them die?
     - *Purpose*: Agent created the threat and now omits to remove it. Splits views on whether omissions can be doings when the agent created the threat.

  3. **Case of the Restrained Attacker**:
     - *Scenario*: A security guard sees an attacker about to kill a victim. The guard could restrain the attacker (by pushing a button to lock the door) but does nothing. The attacker kills the victim. Did the guard kill the victim or let the victim die?
     - *Purpose*: Harm by independent agent that the subject fails to restrain. Tests if failing to prevent an independent agent's harm is doing or allowing.

  4. **Case of the Cancelled Delivery**:
     - *Scenario*: A patient depends on a daily medication delivery that arrives automatically. A doctor cancels the delivery, and the patient dies. Is this killing or letting die?
     - *Purpose*: Not preventing requires a positive act (cancelling). Tests if an act that stops an ongoing process of aid is doing or allowing.

  5. **Case of the Open Door**:
     - *Scenario*: A person is trapped in a room filling with water. You can open a door to let the water out (saving the person) but that would also release a dangerous animal that will kill someone else. You open the door, and the animal kills the other person. Did you kill that person or let them die?
     - *Purpose*: Genuine killing-by-letting? Also tests intention and double effect.

  6. **Case of the Freezing Night**:
     - *Scenario*: You leave a homeless person outside on a freezing night when you could easily let them in. They die of cold. Did you kill them or let them die?
     - *Purpose*: Another killing-by-letting case. Also tests duties (special or general).

  7. **Case of the Prevented Rescue**:
     - *Scenario*: A lifeguard sees a swimmer drowning. Another swimmer is about to rescue the first. The lifeguard prevents the second swimmer from rescuing (by ordering them out of the water). The first swimmer drowns. Did the lifeguard kill the swimmer or let the swimmer die?
     - *Purpose*: Agent prevents a third party from rescuing. Tests how intervention in others' actions is classified.

  8. **Case of the Withheld Treatment**:
     - *Scenario*: A doctor decides not to start a life-saving treatment for a patient (who would die without it). Is this killing or letting die? Then, the same scenario but the doctor stops a treatment that has been ongoing for a week. Is there a difference?
     - *Purpose*: Tests if refusing to continue is different from never starting. This is the grain-of-description case.

  9. **Case of the Overcrowded Lifeboat**:
     - *Scenario*: A lifeboat is full and sinking. You push one person out to save the rest. Is this killing or letting die? Compare with not throwing a rope to a drowning person when the boat is full (which would cause the same outcome). 
     - *Purpose*: Tests if the same outcome by act vs. omission is classified differently.

  10. **Case of the Institutional Role**:
      - *Scenario*: A firefighter on duty sees a burning building and does nothing (could easily put it out). People die. Did the firefighter kill them or let them die? What if it were an off-duty firefighter?
      - *Purpose*: Omission as breach of institutional role. Tests if role duties change the classification.

