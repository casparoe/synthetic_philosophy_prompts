answer: |-
  Below is a decision tree designed as a classification instrument for end-of-life decision-making, based on concrete cases that force distinctions in the doing/allowing and killing/letting-die debate. The tree has **10 diagnostic questions (nodes)**, each using plain language and avoiding theoretical labels. It is constructed from the logical space of positions, with leaves named where possible and awkward commitments noted. Load-bearing nodes (critical splits) are marked, as are inseparable positions and scoring flags for instructor use.

  ---

  ### **Decision Tree: Classifying Views on Doing/Allowing and Killing/Letting-Die**

  **Instructions for Students:**  
  Answer each question based on your intuitive judgment of the case. There are no "right" answers—this is about mapping your view. Choose the option that best reflects your reasoning.

  ---

  #### **Node 1: Ventilator Withdrawal**  
  *Case: A doctor disconnects a ventilator from a terminal patient, who dies immediately. The patient would have lived longer with the ventilator.*  
  → **A. This is "killing" (or morally similar to killing)**  
  → **B. This is "letting die" (or morally similar to allowing death)**  
  - **Load-bearing**: Splits views on whether removing life-sustaining intervention is active harm or passive omission.  
  - *Path A → Node 2*  
  - *Path B → Node 3*

  ---

  #### **Node 2: Engineer’s Omission**  
  *Case: An engineer designs a faulty elevator. Years later, she realizes it will fail and could fix it easily but chooses not to. It crashes, killing a person.*  
  → **A. By not fixing it, she killed the person**  
  → **B. By not fixing it, she allowed death (but didn't kill)**  
  - **Load-bearing**: Tests if creating a threat and omitting to remove it is doing or allowing.  
  - *Path A → Leaf 1*  
  - *Path B → Node 4*

  ---

  #### **Node 3: Canceled Auto-Injection**  
  *Case: A patient needs a daily automated insulin injection. A nurse cancels today’s injection (a button press), causing death. Without cancellation, the patient would have lived.*  
  → **A. This is killing**  
  → **B. This is letting die**  
  - **Load-bearing**: Splits views on whether stopping an automated process is active doing.  
  - *Path A → Node 5*  
  - *Path B → Node 6*

  ---

  #### **Node 4: Restrained Attack Dog**  
  *Case: A guard sees a trained attack dog about to maul a child. He could press a button to lock the dog in its kennel but doesn’t. The child dies.*  
  → **A. The guard killed the child**  
  → **B. The guard allowed death but didn’t kill**  
  - Tests classification when harm is from an independent agent.  
  - *Path A → Leaf 2*  
  - *Path B → Leaf 3*

  ---

  #### **Node 5: Withheld vs. Withdrawn Treatment**  
  *Case: Compare two scenarios:  
  - (i) A doctor never starts life-saving dialysis for a patient who needs it.  
  - (ii) A doctor stops dialysis after one week for the same patient.*  
  → **A. Both are letting die (no difference)**  
  → **B. Withholding (i) is letting die; withdrawing (ii) is killing**  
  → **C. Both are killing**  
  - **Critical for grain sensitivity**: Tests if description granularity affects classification.  
  - *Path A → Node 7*  
  - *Path B → Leaf 4*  
  - *Path C → Leaf 5*

  ---

  #### **Node 6: Frozen Exposure**  
  *Case: A homeowner finds a homeless person freezing on their porch. They could let them inside but refuse. The person dies of cold.*  
  → **A. This is killing (e.g., "exposing to death")**  
  → **B. This is letting die**  
  - Tests "killing-by-letting" (inaction enabling environmental harm).  
  - *Path A → Leaf 6*  
  - *Path B → Node 8*

  ---

  #### **Node 7: Blocked Rescue**  
  *Case: A boat captain sees a drowning swimmer. A passenger tries to throw a lifebuoy, but the captain physically stops them. The swimmer drowns.*  
  → **A. The captain killed the swimmer**  
  → **B. The captain allowed death but didn’t kill**  
  - Tests if preventing a third-party rescue is doing or allowing.  
  - *Path A → Leaf 7*  
  - *Path B → Leaf 8*

  ---

  #### **Node 8: Firefighter’s Choice**  
  *Case: An on-duty firefighter watches a building burn with people inside. They could easily extinguish it but don’t. (Compare to an off-duty bystander doing the same.)**  
  → **A. The firefighter killed them; the bystander let them die**  
  → **B. Both let them die (same moral category)**  
  - Tests institutional role duties and moral weight.  
  - *Path A → Leaf 9*  
  - *Path B → Leaf 10*

  ---

  ### **Leaf Classifications**  
  *(Named positions and commitments)*  

  - **Leaf 1: Unnamed "Full Responsibility" View**  
    - *Commitment:* Creating a threat makes you responsible for all future outcomes, even omissions.  
    - *Path:* Node 1A → Node 2A  

  - **Leaf 2: Unnamed "Causal Control" View**  
    - *Commitment:* Failing to restrain an independent threat is killing if you had total control.  
    - *Path:* Node 1A → Node 2B → Node 4A  

  - **Leaf 3: Traditional Doing/Allowing (Bennett/Foot-style)**  
    - *Commitment:* Allows a hard distinction between initiating vs. sustaining causal chains, but struggles with "enabling" cases.  
    - *Path:* Node 1A → Node 2B → Node 4B  

  - **Leaf 4: Asymmetry View (e.g., Rachels-rejecting)**  
    - *Commitment:* Withdrawing treatment is killing; withholding is not. But this implies identical outcomes have different moral status.  
    - *Path:* Node 1B → Node 3A → Node 5B  

  - **Leaf 5: Moralized View (Kamm-style)**  
    - *Commitment:* Rights/duties determine the distinction (e.g., stopping treatment violates a claim). Awkward: Calls passive acts "killing."  
    - *Path:* Node 1B → Node 3A → Node 5C  

  - **Leaf 6: Enabling View (Unnamed)**  
    - *Commitment:* "Enabling" harm (e.g., exposing to cold) is a third category between doing and allowing.  
    - *Path:* Node 1B → Node 3B → Node 6A  

  - **Leaf 7: Unnamed "Prevention as Doing" View**  
    - *Commitment:* Blocking a rescue is killing because it creates a new barrier.  
    - *Path:* Node 1B → Node 3B → Node 5A → Node 7A  

  - **Leaf 8: Counterfactual Dependence View**  
    - *Commitment:* Harm must counterfactually depend on your act to be "killing." Blocking rescue isn’t killing because harm depends on the original threat.  
    - *Path:* Node 1B → Node 3B → Node 5A → Node 7B  

  - **Leaf 9: Agent-Relative View (Scheffler-style)**  
    - *Commitment:* Duties make omissions by role-holders equivalent to doing. Awkward: Same act is "killing" or "letting die" based on context.  
    - *Path:* Node 1B → Node 3B → Node 6B → Node 8A  

  - **Leaf 10: Consequentialist/No Intrinsic Difference View**  
    - *Commitment:* Doing/allowing has no moral weight; only outcomes matter. Struggles to explain why we punish "doing" more harshly.  
    - *Path:* Node 1B → Node 3B → Node 6B → Node 8B  

  ---

  ### **Unresolved Pairs (Tree Cannot Separate)**  
  1. **Brute Principle vs. Claims-Based View**:  
     - Both might agree on cases (e.g., Node 3 = "killing") but for different reasons (causal structure vs. rights violation). Diagnose via student justifications.  
  2. **Counterfactual vs. Causal Process Views**:  
     - Often converge (e.g., Node 4: "allowing" if harm isn’t from your causal chain). Only separable in edge cases (e.g., preemption).  

  ---

  ### **Scoring Notes for Instructor**  
  **Patterns Tracking the Distinction**:  
  - Consistency on key splits (e.g., Node 1 and Node 3 both A → views doing as distinct and worse).  
  - Differentiating withdrawal vs. withholding (Node 5B) → tracks granularity debates.  
  - Node 8A → role-dependent duties signal a moralized view.  

  **Confounding Patterns (Might Misfire in Seminar)**:  
  - **Outcome Severity Bias**: Always choosing "killing" in high-stakes cases (e.g., Node 6 freezing death = "killing" but Node 1 ventilator = "letting die").  
  - **Mechanism Squeamishness**: Calling acts "killing" if violent (e.g., Node 4 attack dog) but "letting die" if clinical (Node 1 ventilator).  
  - **Legal Blameworthiness Overlap**: Equating "killing" with criminal liability (e.g., Node 2 engineer = "killing" because negligent).  
  - **Inconsistent Splits**: If a student calls Node 3 (canceling auto-injection) "killing" but Node 1 (unplugging ventilator) "letting die" without a clear principle, they may be conflating intent/outcomes.  

  **Recommendations**:  
  - Drop **Node 4 (Restrained Attack Dog)** if students fixate on animal violence vs. cold logic.  
  - Drop **Node 5 (Withheld/Withdrawn)** if answers correlate with outcome severity (e.g., "stopping feels worse, so it’s killing").  
  - Use **Node 8 (Firefighter)** to flag duty-based reasoning vs. causal purity.  

  ---

  This tree isolates core debates (descriptive vs. moralized distinctions, scalar/binary views, role of duties) while avoiding jargon. By stressing edge cases (e.g., enabling, third-party prevention), it forces students to reveal implicit principles. In seminar, track answer patterns against confounders to ensure the distinction—not intuition—drives classification.
