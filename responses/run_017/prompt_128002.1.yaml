  We'll now build the decision tree. We start with the question that splits the most fundamental disagreement.

  **Node 1: Unplugged Ventilator**
  - Question: In the ventilator case, is unplugging the ventilator killing or letting die?
    - Answer A: Killing (or at least, more like killing) -> go to Node 2
    - Answer B: Letting die (or not killing) -> go to Node 3

  *Rationale*: This is the classic split. Traditional views say letting die. Some moralized views might say killing if it violates a duty.

  **Node 2: Case of the Created Threat** (for those who answered A at Node 1)
  - Question: In the faulty bridge case, by not fixing it, did the engineer kill the people or let them die?
    - Answer A: Kill -> Position: **Traditional Doing/Allowing with Responsibility** (awkward: must explain why omissions can be killings when the agent created the threat)
