  ### Epistemic Self-Critique  
  1. **Hardest Neutrality**: Balancing "burden of proof scaling" (C2). Demarcationist framing ("exponential") implies consensus has high prior credibility; continuity framing ("linear") risks understating network effects of evidence.  
  2. **Framing Leakage**: Agreed claim §1 ("established techniques") subtly privileges demarcationist view; continuity critic might prefer "currently accepted techniques". Mitigated by §3 (institutional fallibility).  
  3. **Synthesis Breakdown**:  
     - C3 assumes "identical methodology" is observable, but execution (e.g., rigor) may differ.  
     - Predictions for Guadiana rely on unknown base rates (e.g., how often forgeries pass initial technical tests).  
  4. **What Could Move Each Side**:  
     - **Demarcationist**: Evidence that consensus frameworks *routinely* reject well-supported anomalies *without review* (C1).  
     - **Continuity Critic**: Proof that "fringe" works *consistently* evade falsification even when given resources (C3).  

  This document isolates testable disagreements while acknowledging shared principles. The Guadiana case operationalizes cruxes where empirical outcomes could resolve stalemates (C1, C3) or refine conceptual thresholds (C2).
