  Below is the joint statement drafted to reflect common ground, clarify residual disagreements in neutral terms, specify testable cruxes using your Guadiana case, and isolate the verbal component. The table and JSON summary follow the requested format.

  ---

  ### Part 1: Agreed Claims  
  1. **Methodological Standards**: Historians must critically evaluate sources using established techniques (provenance analysis, cross-validation, falsifiability criteria, and consilience with independently verified frameworks). Claims failing these tests warrant skepticism.  
  2. **Specific Case Assessments**:  
     - **Atlantis/ancient astronauts**: Fail due to lack of primary evidence, disregard for archaeological consilience, unfalsifiable core claims, and selective use of data.  
     - **Fomenko revisionism**: Rejects cross-disciplinary consilience (e.g., astronomy, dendrochronology) without providing testable alternatives; relies on circular arguments.  
     - **Vindicated claims (e.g., Norse Vinland, Hittites)**: Initially doubted due to *incomplete evidence* but gained acceptance through *new evidence* (L’Anse aux Meadows archaeology, Boğazköy tablets) that satisfied methodological standards.  
  3. **Institutional Limitations**: Mainstream consensus can err (e.g., Piltdown Man, Hitler Diaries) due to institutional biases or methodological lapses. Institutional affiliation alone does not validate work.  
  4. **Epistemic Responsibility**: All historical claims—mainstream or heterodox—bear a burden of proof proportional to their divergence from established consilience. Extraordinary claims require extraordinary evidence.  
  5. **Guadiana Tablets (Baseline)**: Initial assessment *must* involve:  
     - Radiocarbon verification of the writing-board fragment.  
     - Astronomical validation of the eclipse record.  
     - Paleographic analysis against known Punic scripts.  
     - Investigation into provenance and forgery parallels.  

  ### Part 2: Residual Disagreements (Stated Neutrally)  
  | Crux ID | Sub-Question                                                                 | Demarcationist’s Position (Her Terms)                                                                                                                                 | Continuity Critic’s Position (His Terms)                                                                                                                               | Shared Test (Guadiana Case)                                                                                       | Demarcationist Prediction                                                                 | Continuity Critic Prediction                                                                 | Disagreement Type |  
  |---------|------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|-------------------|  
  | C1      | Are methodological criteria independent of consensus?                        | Standards (provenance, falsifiability) are *objective* constraints; pseudohistory ignores them *systematically*.                                                      | Standards are *emergent* from consensus; "pseudohistory" labels target deviations from institutional orthodoxy, not inherent flaws.                                  | If tablets pass technical tests (C14, astronomy) but are rejected solely due to anomalous location/deity reference. | Rejection is justified: anomaly requires rewriting too much consilient evidence.          | Rejection reveals institutional bias; anomaly should trigger reconsideration of "frontier" models. | Conceptual        |  
  | C2      | How should burden of proof scale with divergence from consensus?             | Burden scales *exponentially*: claims contradicting cross-verified frameworks (e.g., Phoenician frontiers) require irrefutable evidence upfront.                     | Burden scales *linearly*: all claims deserve equal scrutiny; consilient frameworks may be incomplete (e.g., pre-Vinland Norse archaeology).                         | If tablets show minor anomalies (e.g., king-list variant) vs. major ones (e.g., impossible eclipse).               | Major anomalies invalidate entire cache without exhaustive study; minor ones warrant review. | All anomalies require equal investigation; frameworks adapt incrementally.                   | Conceptual        |  
  | C3      | Does "pseudohistory" track method or institutional alignment?               | Method is primary: pseudohistory is defined by *repeated* evasion of falsification, not institutional status.                                                        | Label is socially contingent: identical methods may be "heterodox" or "pseudohistory" based on academic reception (e.g., Velikovsky vs. mainstream critics).        | If identical methodology is applied to tablets by an independent scholar vs. a known "fringe" author.             | Output judged on method alone; institutional bias is irrelevant.                            | Identical output will be received differently based on author’s affiliation.                | Empirical         |  

  ### Part 3: Verbal Component  
  The dispute over the term **"pseudohistory"** is partially verbal. Both agree on:  
  - Some claims persistently evade methodological standards.  
  - Consensus frameworks are fallible and revisable.  
  **Non-verbal core**: Whether evasion of standards is *inherent* to certain forms of inquiry (demarcationist) or a *contingent* feature of claims rejected by institutions (continuity critic). The substantive disagreement reduces to **whether methodological violations are necessarily epistemic malpractice (C1, C2) or symptoms of provisional exclusion from consensus-building (C3)**.

