  The recantation description is also misleading. Popper didn't "quietly abandon" his position - he published a formal retraction calling his earlier tautology charge a "grave mistake." But he maintained that natural selection required careful formulation to avoid circularity, seeing his recantation as a refinement rather than a complete reversal.

