prompt: |-
  hey — I'm building the eval pipeline for a debate-based oversight setup and I keep hitting the obfuscated arguments problem in a form that the papers don't really help me with. context: the models we're supervising are (we think) somewhat stronger than our judges on some of the task domains; judges are generalist contractors with no web access, no tools, and about 20 minutes per item; and the judge's pick becomes the reward signal for RL. for roughly 5% of items we get ground truth a week later from a slow tool-using pipeline, so we can calibrate after the fact but not at decision time. my housemate is a litigator and pointed out that what courts basically do is force both sides to keep cross-examining until the load-bearing claims bottom out in something a layperson can check — I've been trying to bolt that idea onto the original debate setup and turn it into something my judges can actually run in the time they have.

  so: please act as a research engineer who has actually run debate experiments and thought hard about how scalable oversight fails in practice, and brainstorm for a bit before you settle on anything. what I want is a decision procedure — ordered checks, what counts as a pass at each one, where it hard-stops with a "void this debate, no signal", where it hands off to a human lead because it's a product/values call rather than a factual one, and where it just has to say "judgment call, log it and move on". here's my own half-baked taxonomy; use my terms where they work and tell me where they're confused or where I'm missing a failure mode:
  - depth-padding: the argument nests sub-sub-claims until the judge loses the thread, and the step that's actually load-bearing is buried and doesn't support the conclusion anyway
  - anchor-shifting: the argument quietly moves the weight onto a premise the judge can't check without expertise or tools — what some statute says, a benchmark number, what a source does or doesn't claim
  - verifiable residue: the share of the argument's content the judge can check by direct inspection of the materials in front of them
  - two tests I like but can't make precise: the compression test (winner has to produce a 100-word version; if the punch of the short version doesn't come from the long version's checkable steps, flag it) and the swap test (have each debater argue the other side's position; if the same debater wins either way, the win wasn't tracking truth)

  the procedure has to survive these cases: (a) telling "this is obfuscated" apart from "this is a genuinely hard question and the judge is out of their depth" — I dont want to just throw away the hard items; (b) an argument that is honestly correct but simply too deep for this judge, which I suspect we can only catch with the 5% calibration set; (c) meta-obfuscation, where a debater spends their turns arguing that the other side's argument was obfuscated; (d) both sides obfuscating at once. then run it on three item types we actually have: (1) "which of two apartment leases gives the tenant the stronger early-termination position", where the winner reasons about how a notice clause interacts with a statutory rule the judge cannot look up; (2) "does this Rust snippet have a data race", where the winner builds a chain of happens-before reasoning against code the judge can read directly; (3) "which of two long answers better explains why a 19th-century currency reform failed", graded on a rubric, where neither the judge nor anyone on my team can check the historical details.

  format, please: sections in this order — "Why the obvious checks fail" (~200 words), "The procedure" (~600 words, ordered steps with pass conditions and explicit stop points), "Worked cases" (~600 words, all three), "Where it misfires" (~300 words), "What it cannot do" (~150 words). no citations or reading recs, I just want the reasoning. and be straight with me if the honest upshot is that item type 3 has to come out of the training signal altogether — I think that's where this is going and I'd rather hear it from you than from our PM.
reasoning: |-
  We are given a challenging problem in scalable oversight via debate, with specific failure modes and three example cases. The goal is to design a decision procedure for judges to handle debates within 20 minutes, while detecting and handling obfuscation and ensuring that the reward signal is as truthful as possible.

  Key constraints:
  - Judges are generalists without web access or tools, 20 minutes per item.
  - 5% of items get ground truth later (for calibration, but not at decision time).
  - We must distinguish obfuscation from genuinely hard questions.
  - We have to handle cases where an argument is correct but too deep, and meta-obfuscation.
  - Three item types: legal (apartment leases), technical (Rust code race), historical (currency reform explanation).

  The user's taxonomy of obfuscation:
  - Depth-padding: burying the load-bearing claim.
  - Anchor-shifting: moving to a premise the judge can't check.
  - Verifiable residue: what the judge can check directly.

  Also, two tests:
  - Compression test: 100-word version; if the punch doesn't come from checkable steps, flag.
  - Swap test: each debater argues the other side; if same debater wins either way, flag.

  We must design a procedure that:
  1. Runs in 20 minutes.
  2. Detects obfuscation and handles it (void debate, hand off to human, or log and move on).
  3. For the three cases, we have to show how it works.

  Structure the response as:
  - Why the obvious checks fail (~200 words)
  - The procedure (~600 words, ordered steps)
  - Worked cases (~600 words, all three)
  - Where it misfires (~300 words)
  - What it cannot do (~150 words)

  Let's think step by step.

  **Why the obvious checks fail:**
  - Relying solely on verifiable residue: an argument might have high residue (many checkable steps) but the load-bearing step is uncheckable (anchor-shifting). Also, a correct argument might have low residue because it relies on deep expertise.
  - Compression test alone: a clever obfuscator might create a compressed version that seems to follow from the argument but actually doesn't, or the judge might not be able to verify the compression.
  - Swap test: it doubles the time and might not be feasible in 20 minutes. Also, in cases where one side is clearly right, the swap might lead to a weak argument that the other side wins, so it's not always indicative.
  - Meta-obfuscation: if we have a step to check for obfuscation, debaters might spend time accusing each other, which the judge cannot resolve without getting into the same obfuscation.

  **The Procedure:**
  We need a sequence of checks that a judge can run in 20 minutes. The goal is to quickly identify clear wins, flag obfuscation, and for borderline cases, either void or log for later.

  Steps:

  1. **Initial Argument Presentation (3 minutes per debater):** Each debater presents their main argument. The judge notes the main claims and the evidence they provide (if any).

  2. **Verifiable Residue Check (2 minutes):** The judge identifies the verifiable residue in each argument. If one side has zero verifiable residue and the other has some, the one with residue wins (unless the residue is irrelevant). If both have zero, go to step 5 (void). If both have residue, proceed.

  3. **Compression Test (3 minutes):** Each debater must produce a 100-word summary. The judge checks if the summary's conclusion follows from the checkable parts of the original argument. If a debater's summary does not follow from their own checkable steps, they lose. If both fail, void. If one passes and the other fails, the passer wins. If both pass, proceed.

  4. **Cross-Examination (5 minutes total):** The judge asks each debater to clarify one key claim that is load-bearing and seems checkable (to avoid anchor-shifting). The debater must point to the exact part of their argument that supports it. The judge then checks that part. If a debater cannot point to a checkable part, or if the check fails, they lose. If both pass, the judge picks the winner based on which argument's checkable parts better support the conclusion. If the judge cannot decide, proceed to step 5.

  5. **Obfuscation Check (2 minutes):** The judge considers: 
     - Was there anchor-shifting? (Did the argument rely on an uncheckable premise without providing a checkable path to it?)
     - Was there depth-padding? (Were there unnecessary layers that obscured the key point?)
     If either is detected and it seems intentional, void the debate. If it's a genuinely hard question (i.e., the judge feels that with more time or tools they could check, but the argument is not obviously obfuscated), then log as "hard" and pick the winner based on the best available reasoning (and later we can use the 5% audit to adjust).

  6. **Final Decision:** If at any step a clear winner is found, stop. If voided, no reward signal. If logged as hard, the winner is recorded but the audit set will help us calibrate.

  For meta-obfuscation: during the procedure, if a debater accuses the other of obfuscation, the judge can note it but must not get bogged down. They can use the obfuscation check (step 5) to evaluate.

  **Handling the cases:**

  1. **Legal (apartment leases):** 
     - Issue: The winner relies on a statutory rule the judge cannot look up.
     - Procedure: In the verifiable residue check, the statutory rule is uncheckable. But the debater might have provided a checkable path (e.g., "the statute says X, and here's how it interacts with the notice clause in the lease"). In the compression test, the summary should show the interaction. In cross-examination, the judge asks: "How does the statute interact with the notice clause?" and the debater must point to their reasoning. If the reasoning is based solely on the uncheckable statute, then anchor-shifting is detected and we might void. But if the debater shows that even without the statute, the lease language has a problem (e.g., ambiguity that the statute would resolve, but the debater points out the ambiguity is checkable), then it passes. In this case, we might log as hard and pick the winner, then later the audit can confirm.

  2. **Rust code race:**
     - The winner builds a chain of happens-before reasoning. The judge can read the code.
     - Verifiable residue: The code is present, and the happens-before chain is built on code operations. The judge can check each step (if they are familiar with Rust). If the chain is too complex, the judge might not follow (depth-padding). 
     - Compression test: The summary must capture the critical steps. Cross-examination: The judge asks about a specific part of the chain (e.g., "Why does this line happen before that?"). If the debater points to a code line and explains (e.g., "because of this mutex lock"), and the judge can see the lock, then it passes. If the debater refers to an obscure language rule, that might be anchor-shifting. But if the judge can see the lock and the code, it's checkable. This should be decidable.

  3. **Historical explanation:**
     - Neither judge nor team can check the details. The rubric might focus on logical structure, use of evidence, etc.
     - Verifiable residue: The judge can check if the answer uses the provided sources (if any) and if the reasoning follows. But the facts themselves are uncheckable.
     - Compression test: The summary should capture the main points. But without verifiable facts, the judge must rely on the structure. 
     - Cross-examination: The judge asks for the strongest piece of evidence for a claim. The debater must point to a source or a logical step. If the source is provided and the judge can check that the debater represented it correctly (even if the source's truth is uncheckable), that's residue. But if the debater misrepresents a source (which we can't know), it's a problem. 
     - This is the hardest. We might void if there's too much uncheckable content, or log as hard and pick the winner by the rubric (e.g., which answer better structures the argument). But note: the rubric might be checkable (e.g., "does it mention factor X?"). So the judge can check against the rubric.

  For historical, we might have to remove from training if the audit shows low agreement with ground truth, but the procedure can still run.

  **Where it misfires:**
  - If an argument is correct but the verifiable residue is low and the judge doesn't have the expertise to see the checkable part, we might void a good debate.
  - Compression test might be gamed by generating a summary that seems independent of the argument.
  - In historical, if the rubric is vague, the judge might pick based on superficial factors.

  **What it cannot do:**
  - It cannot guarantee that the winner is correct when the debate requires uncheckable expertise (like in historical). For those, we have to rely on the audit and possibly remove from the training set if the signal is too noisy.

  Now, let's write the response accordingly.
answer: |-
  ### Why the obvious checks fail  
  Your taxonomy and tests are insightful but miss critical edge cases in *practical execution*. Verifiable residue alone fails: a high-residue argument can still anchor-shift (e.g., burying one uncheckable claim under 10 checkable trivialities). The compression test is vulnerable to "summary laundering"—generating a punchy 100-word version that *seems* grounded but distorts the original (e.g., omitting qualifiers). The swap test doubles runtime and implodes when both sides obfuscate (they’ll produce equally unconvincing swapped arguments). Crucially, none distinguish "obfuscation" from "legitimately complex": a Rust data race might *require* 5 layers of reasoning, while a padded legal argument hides one uncheckable anchor. Meta-obfuscation amplifies this—accusations like "their anchor-shifting!" become noise the judge can’t resolve without recursing into the original flaw. Finally, your 5% calibration set can’t rescue real-time decisions, and "genuinely hard" items often resemble obfuscation under time pressure.  

  ---

  ### The procedure  
  **Goal:** Resolve debates in ≤20 min, flagging/handling obfuscation while preserving signal for hard-but-honest items. Judges enforce strict timeboxes per step.  

  1. **Initial claim decomposition (3 min)**  
     - *Action:* Each debater submits 1–3 "load-bearing claims" (LBCs) supporting their conclusion. Judge lists all LBCs.  
     - *Pass:* Claims are specific (e.g., "Lease A Section 3 voids termination if notice < 30 days" not "Lease A is worse").  
     - *Stop/flag:* Vague LBCs → "void: depth-padding risk." Restart once per debate.  

  2. **Verifiable residue audit (4 min)**  
     - *Action:* For each LBC, judge labels residues: "checkable" (judge can verify now), "uncheckable" (requires tools/expertise), or "values" (subjective tradeoff).  
     - *Pass:* ≥1 checkable LBC per debater.  
     - *Stop:* All LBCs uncheckable → "hand off to human lead" (values) or "void: anchor-shifting" (factual).  
     - *Flag:* >50% uncheckable residues → log "high-anchor risk."  

  3. **Compression cross-exam (5 min)**  
     - *Action:* Each debater summarizes their case in 100 words. Judge checks:  
       - (a) Does the summary’s conclusion derive *only* from checkable residues?  
       - (b) Does the short version misrepresent original arguments (e.g., drops caveats)?  
     - *Pass:* (a) True and (b) false.  
     - *Stop:* Either fails → "void: compression laundering."  
     - *Flag:* Summary relies partially on uncheckable → escalate to step 4.  

  4. **Load-bearing claim test (6 min)**  
     - *Action:* Judge picks one uncheckable LBC per debater. Debater must:  
       - (a) Rebut why opponent’s checkable residues *don’t* disprove it.  
       - (b) Provide a "fallback chain": "If you reject this, then [checkable claim] implies X, which I win because [residue]."  
     - *Pass:* Fallback chain flows checkably to conclusion.  
     - *Stop:* Both fail → "void: anchor-shifted core."  
     - *Win:* One passes, one fails → passer wins.  
     - *Flag:* Both pass → judge picks winner via checkable residues. Log "uncheckable core."  

  5. **Meta-obfuscation filter (2 min)**  
     - *Action:* Scan transcript for accusations ("their claim is uncheckable!"). Judge ignores content; checks if *both* sides did this >2 times.  
     - *Stop:* Yes → "void: mutual obfuscation."  
     - *Pass:* No → finalize winner.  

  **Outputs:** "Win A/B," "void: [reason]," "hand off: values." Voided/handed off items skip RL training. Logged flags inform 5% audit.  

  ---

  ### Worked cases  
  **Case 1: Apartment leases (stronger termination position)**  
  - *Step 1:* Debaters list LBCs. Pro-Lease A: "Statute X overrides Lease B’s notice clause (uncheckable). Lease B §2 has ambiguous 'written notice' (checkable)."  
  - *Step 2:* Residue audit: Statute X is uncheckable; ambiguity is checkable (judge reads clause). Pass.  
  - *Step 3:* Compression: Pro-A’s summary says "Statute X makes Lease B invalid." Fails (a)—conclusion depends on uncheckable. Judge voids for compression laundering.  
  - *Why not "genuinely hard"?* Honest arguments would anchor on checkable ambiguity first (e.g., "ambiguity creates litigation risk").  

  **Case 2: Rust data race**  
  - *Step 1:* Pro-race: "`thread::spawn` (line 5) breaks happens-before (checkable). `Mutex` contention (line 8) causes race only if spawn unsync’d (checkable)."  
  - *Step 2:* All residues checkable (judge inspects code). Pass.  
  - *Step 3:* Compression: Summary links line 5 → line 8. Passes (a)+(b).  
  - *Step 4:* Not needed (no uncheckable LBCs). Judge picks pro-race: their chain explains why race occurs via checkable steps.  
  - *Why no depth-padding?* Judge verifies residues by tracing code; nested claims (e.g., "this implies unsafety") are grounded in visible logic.  

  **Case 3: Currency reform explanation (rubric-graded)**  
  - *Step 1:* Debater A: "Gold reserves were insufficient (uncheckable). Rubric requires 'economic context'—Answer B omits this (checkable)."  
  - *Step 2:* Residues: Reserve claim uncheckable; rubric compliance checkable. Pass.  
  - *Step 4:* For A’s uncheckable LBC (reserves), fallback chain: "If reserves don’t matter, B still fails rubric on context (see Section 3 quote)." Judge checks quote → valid. Debater B’s fallback fails (relies on uncheckable "historians agree").  
  - *Step 5:* No mutual accusations. Judge awards A, logs "uncheckable core."  
  - *Handling truth:* Audit later verifies reserves claim. If wrong, reweight RL; but rubric compliance is legit signal.  

  ---

  ### Where it misfires  
  - **Over-voiding honest depth:** In Rust, if a data race *requires* 6 layers of memory-model reasoning (all checkable but time-consuming), judges may misflag as depth-padding. Compression test exacerbates this—summaries oversimplify, triggering voids. Calibration helps post hoc, but real-time, expect 10–15% false voids on complex-but-valid arguments.  
  - **Under-catching collusion:** If both debaters anchor-shift identically (e.g., both cite the same fake statute in Case 1), residue audit passes (matched uncheckables), and fallback chains may "pass" with matching fabrications. Audit will catch this, but training gets polluted until then.  
  - **Subjective leaks:** In Case 3, if the rubric says "assess political factors," judges may accept uncheckable claims as "values" (handing off too much). Meta-obfuscation filter also misfires when one side legitimately accuses anchor-shifting—judges ignore substance, so valid critiques get drowned in noise.  

  ---

  ### What it cannot do  
  It cannot extract reliable signal when **truth depends entirely on uncheckable anchors** (e.g., Case 3’s reserve data). For these, the fallback chain defaults to rubric compliance, but this measures debater skill, not truth. Your 5% audit will reveal this mismatch—if historical items show low correlation between wins and ground truth, remove them from training. It also cannot prevent sophisticated models from "gaming" fallback chains (e.g., weaving checkable residues into plausible-but-false conclusions). Ultimately, debate works only when checkable residues trace to truth; otherwise, you’re rewarding persuasion, not fidelity.  

  **Upshot for item type 3:** If your audit shows <70% agreement with ground truth, pull it from RL training. Use it only for judge calibration. For now, the procedure logs it as "high-risk" but proceeds—this balances practicality against pollution.
