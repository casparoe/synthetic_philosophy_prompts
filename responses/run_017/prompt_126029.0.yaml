  Let me unpack their core argument: They propose "filling-relative assessment" where moral evaluation focuses on how well an agent fills predefined "slots" (like "my first child") rather than comparing outcomes for specific individuals. This aims to preserve wrongs without counterfactual harm claims while avoiding impersonal axiology. The user identifies two soft spots: matching (how to define slot counterparts across outcomes) and propagation (how far downstream effects matter).

  For §1 diagnosis: Their framing seems novel - most solutions either bite the bullet on no-wrongness or go impersonal. The slots move isn't obviously equivalent to existing person-affecting views since it deliberately avoids comparing the same individual across worlds. But I should probe whether this resembles Parfit's "same-number quality claim" or Roberts' "future individuals framework."

  On §5 matching: The practical question constraint feels vulnerable. Consider a policy choosing between building a playground (creating happy child A) or a library (creating equally happy but different child B). If slots are "the child born from this policy," both options fill it equally well. But if an opponent defines the slot as "the intellectual-development beneficiary," suddenly the library fills it better. The verdict flips based on slot description alone.

  For §6 propagation: The orchestra case is damning. If the conductor's choice affects descendants centuries later, and we must evaluate all those slots, it becomes impersonal aggregation. The foresight cutoff creates new problems: (1) wrongness becomes scalar (how foreseeable?) rather than binary, (2) it may excuse historical wrongs with unpredictable long-term effects. A better move might be limiting slots to those the agent intended to affect, but that feels arbitrary.

  Regarding §4 silence: This is defensible as principled restraint. Different-number cases require different tools, and claiming to solve everything often backfires. But they should acknowledge that many non-identity problems (like Parfit's depletion) involve different numbers implicitly.

  The weakest section is clearly §6 propagation. The fatal objection: If slots propagate through causal chains, evaluating a single hiring decision requires comparing entire possible human histories - which is just impersonal total utilitarianism wearing a mask. The foresight dodge undermines the view's initial promise of clear, relational wrongs.

  The user has a sharp philosophical mind - they've perfectly identified their argument's pressure points. I'll structure feedback to challenge those vulnerabilities while acknowledging the approach's ingenuity.
answer: |-
  Your argument is ambitious and philosophically intriguing. Below is targeted pressure testing addressing your specific queries, focusing on conceptual vulnerabilities rather than exposition. I’ll proceed question-by-question, reserving strongest objections for §5–6 as you anticipated.

  ### 1. Diagnosis (§1) & Novelty  
  Your diagnosis is fair: Standard approaches *do* assume identity-determined assessment as a pivot point. Filling-relative assessment (FRA) isn’t a mere redescription of existing views:  
  - **Distinct from person-affecting views**: Unlike Harman/Rivera-López, FRA rejects the need for *actual* counterfactual worsenings. The "complaint" is slot-relative, not individual-relative.  
  - **Distinct from impersonal views**: It avoids aggregating welfare over varying populations.  
  **What it buys**: A *relational* wrong without (a) requiring the same individual in alternatives (unlike person-affecting views) or (b) invoking impersonal values (unlike totalism). The payoff is rescuing intuitive wrongness judgments (e.g., the 14-year-old’s choice) while blocking repugnant conclusions.  
  **Cost**: It sacrifices completeness (see §4) and risks covert impersonalism if slot-matching fails (§5).

  ### 2. Attacking §5 (Matching)  
  The core vulnerability: **Indeterminacy in practical questions** allows slot-matching to be gerrymandered, collapsing FRA into impersonalism.  
  - **Objection**: Your constraint (slots individuated independently of welfare) is insufficient. The "practical question" is often underspecified or multi-describable.  
  - **Case**: *The Gamble*. A couple must choose:  
    - *Option A*: Conceives naturally (50% chance of healthy child, 50% child with chronic pain).  
    - *Option B*: Uses screened IVF for a healthy child.  
  Both result in different children.  
  **Matching 1** (intuitive): Slot = "our first child". *Option B* fills this slot better (guaranteed health). Verdict: *A* is wrong.  
  **Matching 2** (gerrymandered): Slot = "a child whose existence depends on this specific gamete combination". Now *Option A* fills one slot (the pain child) worse than *Option B* fills its slot, but *Option B*’s slot has no counterpart in *A* (since no child exists in *B* who depends on *A*’s gametes). FRA is undefined or permits *A*.  
  **Result**: Verdict flips based on slot description. If slots are individuated by *metaphysical* criteria (e.g., origin essentialism), Matching 1 holds. But if the "practical question" permits *modal* criteria (e.g., "a child we could have via method X"), Matching 2 is valid. Without a principled way to fix slot individuation, FRA is either arbitrary or impersonalism in disguise (ranking outcomes by maximizing expected slot-welfare).

  ### 3. §6 Propagation: Fatal or Salvageable?  
  **Problem**: Propagation threatens to make FRA **global** (comparing infinite causal chains) or **scalar** (if foresight-bound).  
  - **Orchestra case**: If the conductor’s choice affects descendants, FRA *must* evaluate downstream slots (e.g., "first-chair’s grandchild") or deny they are slots.  
  - **Why foresight fails**:  
    - If wrongness tracks *actual* downstream effects, FRA becomes totalism (optimizing genealogical trees).  
    - If limited by *foreseeability*, wrongness becomes non-binary. But deontic categories (wrong/permissible) are binary. A scalar "wrongness score" abandons your relational structure.  
  - **Non-ad-hoc cut-off?** Only one candidate: Slots are **roles the agent intends to affect**. The conductor intends to fill "first violinist", not "ancestor of 22nd-century Berliners". This avoids propagation but faces problems:  
    - *Cost 1*: Excuses negligence (e.g., a policymaker who "doesn’t intend" to affect future generations).  
    - *Cost 2*: Makes wrongness depend on subjective intentions, not objective roles.  
  **Verdict**: Propagation is **nearly fatal**. FRA must either (a) bite the bullet and accept local evaluation (denying downstream slots), sacrificing intuitive judgments in long-term cases (e.g., climate policy), or (b) become a foresight-relative view, losing binary verdicts. Neither is attractive.

  ### 4. §4 Silence Defensible?  
  **Yes, but with a cost**. Silence in different-number cases is defensible as theoretical modesty: FRA solves same-number identity-affecting cases and *only* those.  
  - **Advantage**: Avoids repugnant conclusions and procreation asymmetry debates.  
  - **Cost**: Many core non-identity problems (e.g., Parfit’s *Depletion*—choosing resource policies affecting population size) *are* different-number cases. If FRA is silent here, it fails to address the original puzzle.  
  **Your move**: Claiming these are "separate problems" is valid *if* you reframe the non-identity problem as *essentially* about same-number cases. But this risks ad hoc boundary-drawing.

  ### 5. Weakest Section & Top Referee Objection  
  - **Weakest section**: **§6 (Propagation)**. It exposes FRA’s instability in temporal/causal depth.  
  - **Top objection**: **"FRA collapses into impersonalism when slots propagate"**.  
    - If downstream slots count, evaluating *any* choice requires comparing total welfare across possible futures (e.g., the conductor must optimize the welfare of the violinist’s lineage).  
    - If downstream slots don’t count, FRA cannot explain wrongness in cases with long-term identity-affecting effects (e.g., creating a child who predictably causes suffering to *their* children).  
    Either outcome undermines FRA’s core motivation: offering a *relational* alternative to impersonalism.

  ### Conclusion: Can the Central Move Work?  
  **Conditionally yes, but with significant constraints**:  
  - **Strengths**: FRA elegantly handles same-number cases (e.g., the 14-year-old) without impersonal aggregation. Its slot-based complaint is novel and captures institutional reasoning (§4).  
  - **Fatal if**:  
    - Slot individuation cannot be constrained non-arbitrarily (§5).  
    - Propagation isn’t contained without ad hocery (§6).  
  **Recommendation**: Double down on **§5**. Argue that slots are fixed by *social practices* or *agent-relative roles* (e.g., "my child" is a pre-moral category). Reject propagation by limiting slots to *directly intended roles*. This risks being underdeveloped but is your best path. If §5–6 hold, §4’s silence is a virtue; if not, FRA may be a footnote on the person-affecting restriction.  

  **If pressed for time**: Focus the paper on same-number cases, explicitly denying FRA applies elsewhere. This salvages novelty while containing scope.
