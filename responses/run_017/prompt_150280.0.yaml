     - B. Compensate pedestrian only if Dana is bankrupt  
     - C. Do not compensate pedestrian  

  5. **Underwriter Test Failure:** Erin has a rare allergy making travel deadly. No insurer offers coverage. Erin travels and needs $1M emergency care.  
