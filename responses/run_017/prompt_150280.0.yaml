  **Diagnostic Appendix**  
  1. **Unoccupied Regions & Why**:  
     - *Ex Ante + Identification Stopping Point (e.g., Leaf 5 path)*: Incoherent—ex ante views focus on opportunity structures, not psychological identification.  
     - *Ex Post/Weakened Underwriter + Identification (Leaf 7)*: Unattractive—combines counterfactual insurance with subjective endorsement, creating arbitrary burdens.  
