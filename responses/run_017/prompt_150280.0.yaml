  10. **Imprudent Destitute:** Ian gambles away savings despite warnings. He is destitute; a basic floor exists.  
      - A. Lift to prudent-unlucky level  
      - B. Give partial aid (worse off than prudent unlucky)  
      - C. Provide only basic floor  

