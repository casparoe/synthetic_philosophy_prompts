  *Pattern Notes*:  
  - **Leaf 1** (Dworkinian): No compensation for voluntary risks (1-3C,6C,8-9C), partial for third-party (4B), full for uninsurable (5A), no leveling-down (7B), basic floor for imprudent (10C).  
