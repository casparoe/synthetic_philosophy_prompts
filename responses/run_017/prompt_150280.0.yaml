  ### Diagnostic Instrument for Luck-Egalitarian Views

  #### Part 1: Decision Tree  
  *Start:* You accept that an inequality traceable to factors a person had no hand in is *pro tanto* unjust.  

  1. **Timing Question:** Should society regulate the *structure of chances* people face (ex ante) or *actual outcomes* after luck resolves (ex post)?  
     - **A. Ex ante (fair chances):** Go to 2.  
     - **B. Ex post (outcomes):** Go to 3.  

  2. **Ex Ante Underwriter Test:** A risk is the agent’s own only if, at the moment of action, a competitive insurer would have underwritten it at a finite premium. Uninsurable risks (unmeasurable, unavoidable, or agent lacks standing/wealth) are brute luck.  
     - **A. Accept unweakened:** Go to 4.  
     - **B. Accept weakened** (insurer *would have* underwritten in complete markets/solvency): Go to 5.  
     - **C. Reject test** (irrelevant to responsibility): Go to 6.  

  3. **Ex Post Underwriter Test** (same as 2):  
     - **A. Accept unweakened:** Go to 7.  
     - **B. Accept weakened:** Go to 8.  
     - **C. Reject test:** Go to 9.  

  4. **Ex Ante + Unweakened Underwriter:**  
     - **Leaf 1: Dworkinian Equality of Resources**  
       - Awkward commitment: Denies compensation for losses from uninsurable risks agents knowingly took (e.g., rare genetic surgery).  
       - Held: Yes (Dworkin).  

  5. **Ex Ante + Weakened Underwriter:**  
     - **Leaf 2: Relaxed Insurance View**  
       - Awkward commitment: Holds agents responsible for risks only insurable in idealized markets (e.g., untreatable phobia).  
       - Held: Unoccupied.  

  6. **Ex Ante + Reject Underwriter:**  
     - **Leaf 3: Equality of Opportunity for Welfare**  
       - Awkward commitment: Leaves agents destitute for risks they "chose" but couldn’t insure (e.g., unavoidable disaster).  
       - Held: Yes (Arneson/Cohen variants).  

  7. **Ex Post + Unweakened Underwriter:**  
     - **Regress Stopping Point:** Where does tracing causes halt?  
       - **A. Reasons-responsiveness** (agent could respond to reasons): Go to 10.  
       - **B. Identification/endorsement** (agent endorsed the desire): Go to 11.  
       - **C. No principled stopping point** (responsibility impossible): Go to 12.  

  8. **Ex Post + Weakened Underwriter:**  
     - **Regress Stopping Point** (same as 7):  
       - **A. Reasons-responsiveness:** Leaf 6.  
       - **B. Identification:** Leaf 7.  
       - **C. No stopping point:** Leaf 8.  

  9. **Ex Post + Reject Underwriter:**  
     - **Regress Stopping Point** (same as 7):  
       - **A. Reasons-responsiveness:** Leaf 9.  
       - **B. Identification:** Leaf 10.  
       - **C. No stopping point:** Leaf 8.  

  10. **Ex Post/Unweakened + Reasons-responsiveness:**  
      - **Leaf 4: Resource Egalitarianism (Strict)**  
        - Awkward commitment: Holds people responsible for choices under duress if minimally rational (e.g., coerced gamble).  
        - Held: Yes (Dworkin/Rakowski).  

  11. **Ex Post/Unweakened + Identification:**  
      - **Leaf 5: Endorsement-Sensitive Egalitarianism**  
        - Awkward commitment: Denies aid to those with unchosen, unendorsed desires (e.g., addiction from abuse).  
        - Held: Yes (Frankfurt).  

  12. **No Stopping Point:**  
      - **Leaf 8: Outcome Egalitarianism**  
        - Awkward commitment: Must "level down" even if it wastes resources (e.g., destroy eyesight of sighted to match blind).  
        - Held: Yes (Temkin).  

  **Leaf 6: Resource Egalitarianism (Weakened Insurance)**  
  - *From 8A:* Ex Post/Weakened + Reasons-responsiveness.  
  - Awkward commitment: Compensates for risks that *would* be insurable only in fantasy markets.  
  - Held: Unoccupied.  

  **Leaf 7: Identification + Weakened Insurance**  
  - *From 8B:* Ex Post/Weakened + Identification.  
  - Awkward commitment: Compensates only if desire unendorsed AND risk uninsurable in idealized markets.  
  - Held: Unoccupied.  

  **Leaf 9: Responsibility-Sensitive (No Insurance)**  
  - *From 9A:* Ex Post/Reject + Reasons-responsiveness.  
  - Awkward commitment: Holds agents responsible for unavoidable risks if "responsive" (e.g., earthquake in hazard zone).  
  - Held: Yes (Knight/Van Parijs).  

  **Leaf 10: Identification-Sensitive (No Insurance)**  
  - *From 9B:* Ex Post/Reject + Identification.  
  - Awkward commitment: Denies aid to agents who endorse reckless desires caused by trauma.  
  - Held: Unoccupied.  

