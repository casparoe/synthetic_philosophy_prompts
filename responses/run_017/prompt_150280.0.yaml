  #### Part 2: Sorting Quiz (10 Items)  
  *Instructions:* Choose what the tax-and-transfer apparatus should do.  

  1. **Dose-Response Gradient (Low Risk):** Alex takes up smoking, knowing the lifetime risk of lung cancer is 1% and treatment costs $500,000. Alex gets cancer and cannot pay.  
     - A. Compensate in full  
     - B. Compensate partially (e.g., 50%)  
     - C. Do not compensate  

  2. **Dose-Response (Moderate Risk):** Blake takes up smoking, knowing the lifetime risk is 15% and treatment costs $200,000. Blake gets cancer and cannot pay.  
