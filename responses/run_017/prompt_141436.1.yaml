prompt: |-
  You are a political philosopher who has spent years advising legislatures and non-profit boards on the ethics of democratic institutions, and who can also write like someone who has to be understood by eleven tired volunteers on a Thursday night. Before you draft anything, think carefully: spend a little time brainstorming, in a form I will not circulate, the genuinely different things a person might mean when they say money "corrupts" politics — outright bribery; the purchase of a scarce good that arguably should not be for sale at any price; and the sheer inequality of influence — and then decide which of those is really carrying the weight in our case, because I think our board has been talking past itself for two months precisely because different members mean different ones.

  Some context, since the case is oddly specific. I write novels — three of them, the last of which got a marketing budget and the second of which did not, and I have had a close-up view of how much of being heard is paid reach rather than having something to say — and I sit on the board of our national guild of published fiction writers. We have two interlocking decisions to make in twelve days. The first is whether the guild should endorse Question 3 on our state ballot, the "Clean Voices" amendment. Its mechanics, briefly: the state would match the first hundred dollars of any resident's contribution to a participating candidate or committee at six to one, funded partly from general revenue and partly from a surcharge on the registration fees of firms that lobby the state; participation is voluntary but requires accepting a spending cap and disclosing every donor above fifty dollars; nothing in the measure caps the spending of anyone who declines to participate. That design is deliberate, and it is what divides us: supporters say it levels up rather than down, while others invoke the doctrine of unconstitutional conditions and say the state may not buy waivers of a right with a subsidy. The second decision is whether to accept a $1.5m bequest from the widow of the founder of Halberd Public Affairs, a firm that ran independent-expenditure campaigns for energy clients, which would endow the Halberd Prize for Fiction and Free Expression and requires us to host an annual lecture under his name; the first installment lands nine days before our vote. Complicating everything, our separately incorporated political committee wants to run ads for Question 3, and our executive director points out that the bequest legally cannot fund that but would free up money that can — which someone at the last meeting called laundering, and someone else called ordinary fungibility.

  What I want from you is the decision memo I will circulate to the board four days before the vote. It should take a position on both questions with a concrete course of action and the dates attached, not a menu of options. Two things matter to me especially. First, I have been persuaded by a board colleague that we should stop saying "money is speech" or denying it, and instead separate three different things political money buys: reach, meaning how many people hear a view that they could have expressed anyway; access, meaning the finite attention and time of officials, which is a rival good and which republican theory says is owed to reasons rather than to the highest bidder; and agenda, meaning which questions get taken up at all, where nobody is silenced but some things are never discussed. Tell me which of those three the reform actually addresses, which it leaves untouched, and whether the untouched ones are the more serious harms. Second, you have to deal honestly with the strongest argument on the side I suspect you will not take: that an organization of writers, of all people, is the last body that should endorse state management of political spending, since our own speech is worthless without someone's money behind it, and the power we hand the state to discount a billionaire's megaphone is the same power that could be turned on a publisher's advertising, a festival's sponsorship, or an author's paid op-ed. Do not give me case citations, statutory language, or legal research — our counsel handles that, and I only want the argument. Aim for something a board can read in ten minutes, in prose, with a recommendation at the top, your reasons beneath it, and the losing consideration stated at least as charitably as your own.
reasoning: |-
  Okay, the user is a novelist and board member of a national fiction writers guild. They need a decision memo for two intertwined issues: endorsing a campaign finance reform ballot measure (Question 3) and accepting a $1.5m bequest from a controversial source. The board is divided, partly because members have different understandings of how money "corrupts" politics.

  Hmm, the user wants me to wear two hats: political philosopher who understands institutional ethics, and plain-language communicator for tired volunteers. That's an interesting tension - deep analysis but packaged accessibly. 

  First, I need to unpack the corruption question. When people say money corrupts politics, they usually mean one of three things:
  - Outright bribery (quid pro quo)
  - Treating political access like a commodity (which shouldn't be for sale)
  - Simple inequality of influence distorting representation

  For this memo, I should focus on the access/influence distinction since that's where the board seems stuck. The user's colleague suggested a useful framework: money buys three things in politics:
  1. Reach (amplification)
  2. Access (finite official attention)
  3. Agenda-setting power (what gets discussed)

  Looking at Question 3's design... it clearly targets access and influence inequality through the matching funds. The spending cap is key - it makes candidates choose between public funds or big donors. That directly addresses whether political attention becomes a paid privilege. 

  But reach and agenda-setting? Not touched. Billionaires can still spend unlimited amounts independently to amplify messages or drown out other topics. That's significant because agenda distortion might be the deeper problem - when certain issues get buried not by silencing but by shouting.

  Now the Halberd bequest... tricky. The widow's money is clean legally, but the source is problematic - her husband's firm ran energy industry dark money campaigns. Accepting it creates both practical problems (freeing up other funds for Question 3 ads) and symbolic ones. For a writers' guild, taking money from someone who manipulated public discourse feels... off-brand. 

  The strongest counterargument is important: writers depend on private money for reach (publishing, ads, etc.). If we endorse state regulation of political spending, couldn't that logic extend to regulating book promotion? That's not paranoid - the same legal principles could apply. 

  But there's a distinction: Question 3 regulates candidate elections, not general public discourse. It's about preventing government capture, not limiting expression. Still, the slippery slope worry isn't trivial for writers whose work relies on private backing.

  For the memo structure:
  - Lead with clear recommendations
  - Explain reasoning in plain terms
  - Acknowledge counterarguments charitably
  - Use the reach/access/agenda framework to clarify
  - Note the untouched problems (reach/agenda)
  - Address the "writers' dilemma" head-on
  - Include concrete deadlines since timing is tight

  Key dates: bequest acceptance deadline is 9 days before the vote, so we need to decide that first. The Question 3 endorsement vote comes later. 

  The optics matter too. If we take Halberd money then immediately fund ads for campaign reform... it looks hypocritical even if technically legal. Better to avoid that perception trap.

  Final thought: The guild's credibility is its currency. We should act consistently with our values - both in reforming systems and in choosing our funders.
answer: |-
  ## DECISION MEMO: WRITERS GUILD BOARD ACTIONS ON QUESTION 3 & HALBERD BEQUEST  
  **To:** Board of Directors, National Guild of Published Fiction Writers  
  **From:** [Your Name], Board Member  
  **Date:** [Date 4 Days Before Vote]  
  **Subject:** Recommendations on Question 3 Endorsement & Halberd Bequest  

  ---

  ### **RECOMMENDATIONS**  
  1. **DECLINE the Halberd Bequest.** Notify the estate by [Date - 3 Days from Now].  
  2. **ENDORSE Question 3 ("Clean Voices").** Authorize our political committee to run ads supporting it, funded from general reserves.  

  ---

  ### **WHY DECLINE THE HALBERD BEQUEST?**  
  **The Core Conflict:** This isn’t about illegal "laundering." It’s about *moral fungibility*. Accepting $1.5m from a firm that profited by manipulating political speech with undisclosed money undermines our voice on Question 3—a reform targeting precisely that opacity. Even if the funds can’t legally pay for ads, using Halberd money to free up *other* dollars for Question 3 ads ties our integrity to a legacy of corporate dark money. Writers trade in moral clarity. This blurs it.  

  **The Strongest Counterargument (Stated Fairly):**  
  *"We rely on publishers’ money to be heard. If we endorse state rules limiting political spending, we invite future regulators to limit spending on books, festivals, or op-eds. Halberd’s money is tainted, but rejecting it won’t cleanse politics—it just denies us resources to fight for speech."*  

  **Why It Loses:**  
  The fear isn’t baseless, but it conflates *political spending* (aimed at capturing government action) with *cultural spending* (amplifying ideas in the public square). Question 3 regulates **access to elected officials**—not the reach of novels or op-eds. Taking Halberd’s money while fighting political dark money makes us complicit in the system we’d critique. Our credibility as writers depends on refusing this trade.  

  ---

  ### **WHY ENDORSE QUESTION 3?**  
  **What Money Buys (and What Question 3 Fixes):**  
  When we say money "corrupts," we mean three distinct things:  
  1. **Reach:** Money buys megaphones (ads, mailers). *Question 3 doesn’t limit reach.* Billionaires can still spend freely.  
  2. **Access:** Money buys time with officials—a **scarce resource** that should go to *reasons*, not wallets. **This is what Question 3 fixes.** By matching small donations 6:1, it lets candidates rely on constituents, not lobbyists.  
  3. **Agenda:** Money drowns out certain issues (e.g., climate vs. oil profits). *Question 3 doesn’t fix this.* The agenda stays skewed.  

  **The Reform’s Tradeoff:**  
  Yes, it uses public money to "buy" candidates’ agreement to spending caps. But this isn’t coercion—it’s a voluntary exchange to **rebalance access**. Candidates choose: public funds + caps, or private funds + no caps. For writers, this should resonate: we know small patrons (readers) make art more accountable than one billionaire patron.  

  **The Strongest Counterargument (Stated Fairly):**  
  *"This lets the state pick winners by subsidizing some speech. If the state can amplify a voter’s $100 into $700, why can’t it amplify a publisher’s ad spend? Writers’ livelihoods depend on private money buying reach. This is a slippery slope."*  

  **Why It Loses:**  
  Question 3 doesn’t amplify *speech*—it amplifies *constituent access*. The subsidy goes to *candidates* who meet voters halfway, not to ideas themselves. The state isn’t judging content; it’s ensuring officials listen to ordinary people. This isn’t about silencing billionaires—it’s about preventing them from renting lawmakers by the hour.  

  ---

  ### **THE UNTOUCHED PROBLEMS & OUR ROLE**  
  Question 3 **only fixes access**. Reach and agenda remain warped by wealth. But declining Halberd’s money while endorsing Question 3 does two vital things:  
  1. **Modeling Integrity:** We prove writers won’t sell their credibility, even for noble causes.  
  2. **Targeting the Worst Harm:** Unequal *access* is the core corruption. When lobbyists buy face-time, voters become spectators. Question 3 makes politics a conversation again—something writers understand deeply.  

  ---

  ### **ACTIONS & TIMELINE**  
  - **By [Date - 3 Days]:** Decline Halberd bequest via signed letter from Chair.  
  - **By [Date - 2 Days]:** Distribute endorsement statement on Question 3 to board for final tweaks.  
  - **By [Date - 1 Day]:** Authorize political committee to spend $[X] from reserves on ads.  

  ---

  **In short:** Keep Halberd’s money away from our conscience. Back Question 3 to give small voices a seat at the table. We’re writers—we know whose story this should be.
