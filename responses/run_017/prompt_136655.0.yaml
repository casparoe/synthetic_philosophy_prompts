answer: |-
  ## Proposal: The Degradation Asymmetry as Key to Knowledge-How

  The central debate concerning knowledge-how—whether it reduces to knowledge-that or constitutes a distinct kind—has largely centered on synchronic *constitution*: what constitutes an instance of knowing-how at a given moment? Proponents of reductivism argue it is simply a complex set of propositional attitudes; anti-reductivists posit a distinct, often practical, state. This focus, however, obscures a fundamental and revealing asymmetry in how these states *persist and degrade over time*. Knowing-that is typically treated dichotomously: one possesses it fully until some event causes its complete loss (forgetting). Knowing-how, conversely, exhibits *gradual degradation*: skills rust through disuse, decay under pressure, recover with savings in relearning, and manifest in partial accessibility even when performance falters. This asymmetry suggests both sides of the traditional debate share an unexamined assumption: that epistemic states are fundamentally all-or-nothing possessional items. They then disagree only on *where* to locate the non-propositional machinery (e.g., in the *possession* conditions for anti-reductivists, or in the *environment/performance* for reductivists). By shifting focus to diachronic *degradation and partial accessibility*, we can reframe the debate and dissolve apparent paradoxes. The core question becomes: **What structural feature of knowledge-how explains its distinctive pattern of gradual degradation and partial accessibility under stress or disuse, contrasting sharply with the typically all-or-nothing loss characteristic of paradigmatic knowledge-that?**

  Existing positions leave this question open because their constitutional focus forces degradation phenomena into possessional or non-possessional boxes. Reductivism struggles to explain why the relevant propositions (e.g., "how to φ") remain known and articulable even when the ability to φ degrades or fails under pressure, as in the expert who chokes yet accurately diagnoses their error. Treating the knowledge-that as intact pushes the failure wholly into non-epistemic performance factors, obscuring the *epistemic* sense in which the agent still "knows how" despite failing to execute. Anti-reductivism, by positing a distinct state, risks making degradation mysterious—why does *this* state decay gradually?—and struggles with cases where articulating the how (arguably activating propositional knowledge) actively *degrades* skilled performance, suggesting an interference between epistemic states rather than a simple absence of one. Both frameworks prioritize what the state *is* over how it *fails*, neglecting degradation as a constitutive clue.

  My method over the fellowship year will be a rigorous conceptual investigation structured around the degradation asymmetry, systematically analyzing key cases and constructing a positive model. Months 1-3 will involve a focused literature review, mapping the constitutional debate but with specific attention to any existing, often marginal, discussions of forgetting, skill decay, or performance anxiety, identifying where degradation phenomena are acknowledged but inadequately explained or forced into existing frameworks. Months 4-6 will center on developing detailed case studies: archetypal instances of degradation asymmetry like the expert performer who chokes under competitive pressure yet retains the ability to describe and correct the precise fault (the "accessible but degraded" case), and the skilled agent whose performance deteriorates when made to consciously articulate the steps involved (the "articulation-induced degradation" case). Crucially, I will extend the analysis beyond motor skills to include cognitive skills (e.g., mathematical problem-solving under time pressure) and "softer" skills (e.g., conversational fluency in a second language after prolonged disuse), testing the generality of the asymmetry. Months 7-9 will focus on constructing a positive model of knowledge-how centered on *accessibility gradience*. Instead of an all-or-nothing state, I propose knowledge-how involves a complex structure where core propositional or practical components can be retained (constituting the state) while *access pathways* for fluent, reliable performance degrade gradually due to factors like stress, disuse, or conscious interference. Degradation is the fraying of these access routes, not necessarily the loss of the underlying epistemic components. Months 10-12 will synthesize this model, evaluating its explanatory power against the key cases, its ability to dissolve traditional puzzles (like the two cases above, and savings in relearning), and its implications for the constitution debate, arguing it offers a more fundamental criterion than synchronic possession.

  This approach through degradation and access significantly outperforms the obvious alternatives. More armchair analysis of skill attributions alone risks remaining trapped within the synchronic possessional paradigm, refining categories without addressing the underlying temporal dynamics revealed by how states fail. Importing a model of motor control from cognitive science, while potentially informative about mechanisms, risks bypassing the core *epistemic* question – what *kind* of state is being degraded? – and collapsing into empirical psychology without resolving the philosophical puzzle about the nature of knowledge-how itself. My approach is uniquely positioned at the intersection: it uses the empirically observable phenomenon of degradation as the *conceptual lever* to pry open the nature of the epistemic state, demanding an account of its internal structure that explains its characteristic failure modes. It remains philosophical in its focus on the *kind* of state involved and the conditions for attributing knowledge, but is rigorously constrained and informed by the real-world phenomenology of skill loss and recovery.

  A successful result would be a compellingly argued model of knowledge-how that: 1) fully accounts for the degradation asymmetry across diverse skill types, explaining both gradual decay and cases of retained-but-inaccessible competence; 2) dissolves key puzzles (choking, articulation interference, savings) by reinterpreting them as manifestations of access-pathway degradation; 3) demonstrates that this diachronic perspective provides a more fundamental and unifying lens than synchronic constitution arguments, potentially reframing or dissolving aspects of that debate; and 4) offers a novel, gradience-based understanding of epistemic retention for abilities. Failure would manifest in several ways: if the degradation asymmetry proves less universal or fundamental than assumed; if the proposed access-pathway model fails to provide a better explanation than existing constitutional accounts for the core cases; if the analysis ultimately collapses back into simply restating reductivist or anti-reductivist positions dressed in diachronic language without genuine explanatory gain; or if the project becomes too descriptive of degradation phenomena without successfully linking them back to the core epistemic question of what knowledge-how *is*.

  The scope of this one-year project is deliberately conceptual and analytical. It will not involve designing or running new experiments. However, it is inevitably hostage to certain empirical claims: primarily, the accuracy and generality of the described degradation phenomena (e.g., the prevalence and nature of choking, the effects of articulation on skill, patterns of skill decay and relearning). I will handle this by grounding my claims firmly in well-established empirical findings from psychology, cognitive science, and phenomenology of expertise, carefully citing robust sources. The project's risk lies in navigating this dependence: I must avoid making *novel* empirical claims while ensuring the conceptual model is sufficiently responsive to the empirical landscape. The core philosophical work lies in *interpreting* these established phenomena to reveal the structure of knowledge-how, not in proving the phenomena exist. The primary innovation is conceptual – using degradation as the key to unlock the state's nature – and this conceptual work is robustly achievable within the year, provided the empirical foundations are soundly referenced. The result will be a significant shift in perspective for the knowledge-how debate, grounded in the undeniable reality of how skills fade and flicker.
