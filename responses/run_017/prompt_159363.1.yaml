prompt: |-
  I teach a seminar on consciousness for about sixteen upper-level undergraduates, mostly philosophy majors with a scattering of cognitive science students. We meet once a week for ninety minutes in a room with a projector, a whiteboard, and nothing else; there is no budget and no possibility of pre-class reading compliance beyond a single short handout. We are coming up on the fight between access-based accounts of consciousness — the global-workspace-style family of views on which a content's being conscious just is its being globally available, broadcast to many downstream consumers, reportable, usable in reasoning and memory and the control of action — and the claim that phenomenal consciousness outruns access, that there can be more to what a subject undergoes than the subject can report, use, or act on, so that global availability is at best a signature of consciousness and not its essence. On the page this reads to my students as a stale stalemate: one side says report is our only real evidence, the other side says experience in the moment is richer than what survives into report, and nobody moves. So I would like to stage it instead of assigning it.

  What I want is a ninety-minute in-class simulation — runnable with index cards, a timer, a projector, and maybe some envelopes — in which the students are themselves arranged as a cognitive architecture with a severe bottleneck: several peripheral "modules" that each privately receive rich, detailed input (a crowded visual scene, a fragment of music, a bodily sensation, a word on the tip of the tongue), and a single global channel that can carry the content of only one module per round, after which that content becomes available to downstream consumers: the system's memory, its reasoning, its action, and above all its single "spokesperson," one student who alone is permitted to speak for the whole system and who may say only what has actually been broadcast. The students should walk into the problem rather than be told about it: nobody should hear the words "access," "phenomenal," "overflow," or "global workspace" until the debrief. Beyond the basic architecture, I would like the design to include at least three conditions I have been sketching and cannot get to work. First, a silent-channel condition: a module receives vivid input that is never broadcast and that leaves no downstream trace at all, and the record still has to contain the module's own contemporaneous first-person verdict about whether the content was experienced. Second, a faint-signature condition: a module's content is not broadcast and cannot be reported by the spokesperson, but it does leave a weak downstream effect — a slight tilt in a later forced choice, a bias the spokesperson cannot explain or cite — so the class has to ask whether a downstream effect that no one can attribute is enough to count the content as accessed. Third, a decay condition: modules log their confidence about their own content immediately and then again after a delay, so the group can watch immediate richness shrink into a thinner, more confident retrospective story. I would also like the incentives to pull against each other: the system as a whole earns points for accurate public report, while each module earns points for how much of its own private richness gets recorded in the archive, so the players feel the tension between what the system can avow and what its parts contain. Please give me the rules, the roles with their information asymmetries, the materials, and a minute-by-minute timeline.

  Then I need the debrief, and I need it to be more than a lecture: it should map specific moments in the simulation onto the specific claims in dispute — what broadcast was doing functionally in the game, which moment produced the pull toward saying the un-broadcast content was nonetheless experienced, which moment produced the pull toward saying report is all we can go on, and where the two sides turn out to be arguing about the evidential rules rather than about the facts. Tell me honestly what will predictably go wrong the first time I run it: my guess is that the peripheral players will cheat or meta-game, that the bottleneck will leak because people can see and hear each other, and that the exercise will collapse into giggling the way a note-passing version of it did when I tried something similar a couple of years ago — say how to handle each. I also want you to be frank about what the simulation cannot reproduce. The obvious worry is that every participant in my game is a real conscious person who has their own content no matter what the architecture does, so nothing in the activity actually makes a content unavailable to the subject who has it, and the hard part of the real dispute — the gap between what a subject can avow and what a subject undergoes — may be exactly the thing the staging presupposes rather than produces. Tell me which feature of the debate the facilitator will simply have to supply in words, and say it plainly so I know what I am doing when I talk at the end. Please write your answer in American English.
reasoning: |-
  We are designing a classroom simulation to illustrate the debate between access-based accounts of consciousness and the idea of phenomenal overflow (phenomenal consciousness exceeding access). The simulation will use students as components of a cognitive architecture with a severe bottleneck (global channel). We'll have peripheral modules receiving rich inputs, a global channel that can broadcast only one module's content per round, and downstream consumers (memory, reasoning, action, and a spokesperson). The simulation should include three conditions: silent-channel (unbroadcast content with no trace), faint-signature (unbroadcast content with a weak downstream effect), and decay (immediate vs. delayed confidence). The system earns points for accurate public report, while modules earn points for having their private richness recorded.

  To address the concerns:
  - Cheating/meta-gaming: Enforce strict rules, use partitions or blindfolds to prevent leakage, and have a facilitator monitor.
  - Giggling/collapse: Keep the activity structured and timed, and emphasize the seriousness of roles.
  - What the simulation cannot do: It cannot make the content truly unavailable to the subject (the student in the module) because they are conscious. We must acknowledge that the simulation is about the functional architecture and the system's ability to report, not about the subjective experience of the module players.

  Materials:
  - Index cards (for module inputs, confidence logs, and forced-choice tests)
  - Envelopes (to pass information confidentially)
  - Timer (for rounds and delays)
  - Projector (to display instructions, points, and the forced-choice options)
  - Whiteboard (to keep score and record observations)
  - Blindfolds or partitions (optional, to prevent visual leakage)

  Roles:
  1. Peripheral modules (6-8 students): Each receives a private, rich input (e.g., a detailed image, a short melody, a tactile sensation description, a tip-of-the-tongue word). They log their input and confidence. They may also be asked to cause a weak downstream effect in the faint-signature condition.
  2. Global Channel (1 student): Chooses which module's content to broadcast each round (by receiving an index card from the chosen module and reading it aloud or projecting it).
  3. Downstream Consumers (4 students, can be assigned to one or more roles):
     - Memory: Records what is broadcast in a log (on whiteboard or paper).
     - Reasoning: Can use broadcast content to answer a question (e.g., a simple inference).
     - Action: Can use broadcast content to perform a task (e.g., draw something based on the broadcast).
     - Spokesperson (critical role): Only one who can speak for the system. Must report only what has been broadcast. Answers questions from the facilitator or class.
  4. Facilitator (instructor): Runs the timer, gives inputs, asks questions, and enforces rules.

  Setup:
  - Arrange the room so that peripheral modules are isolated (facing away from center, or with partitions). The global channel and downstream consumers are in the center. The spokesperson is at the front.

  Information Flow:
  1. Each round (about 5 minutes total per round, with multiple rounds for different conditions):
     a. Facilitator gives private input to each module (via index card in an envelope).
     b. Modules privately record their input and confidence (immediate confidence log).
     c. Modules may also receive instructions for causing a downstream effect (in faint-signature condition) without broadcasting.
     d. Global channel selects one module to broadcast (by pointing, or by module raising a flag). The chosen module passes their input card to the global channel.
     e. Global channel broadcasts the content (reads it aloud or projects it).
     f. Downstream consumers record/use the broadcast:
          - Memory writes it down.
          - Reasoning and Action may use it for a task (if applicable that round).
          - Spokesperson notes it.
     g. Facilitator may ask the system (via spokesperson) to report on a specific aspect (e.g., "What was the word on the tip of the tongue?").

  Conditions (to be run in separate rounds):
  1. Baseline: Normal broadcast and report.
  2. Silent-channel: One module (secretly chosen by facilitator) is not allowed to broadcast and leaves no trace. That module still logs their input and confidence, but the system has no record.
  3. Faint-signature: One module is not broadcast but must cause a weak downstream effect (e.g., in a later forced-choice test, the spokesperson or the system must choose between options, one of which is biased by the unbroadcast content). The module might be given a card that says "When asked to choose a color, nudge toward red" and they do so by passing a note to the forced-choice administrator (facilitator) without broadcasting.
  4. Decay: After a delay (e.g., 5 minutes of other activities), modules are asked to log their confidence again and recall their input. Compare immediate and delayed confidence and richness.

  Scoring:
  - System score: The spokesperson's report accuracy (compared to what was actually broadcast) earns points (e.g., 10 points per accurate report).
  - Module score: Each module earns points based on how much of their private input is recorded in the archive (the memory log and any downstream traces). For example, 5 points if fully recorded, 2 points if only a weak trace (faint-signature), 0 if no trace.

  Timeline (90 minutes total):

  Part 1: Setup and Rules (10 minutes)
  - [0-5 min] Assign roles: 6 modules, 1 global channel, 1 memory, 1 reasoning, 1 action, 1 spokesperson. The rest can be observers or assist. Explain the basic rules without using theory-laden terms:
     - "We are building a model of a mind. Each module gets private information. The global channel can only share one piece per round. The downstream components (memory, reasoning, action, spokesperson) can only use what is broadcast. The spokesperson is the only one who can answer for the system."
     - Emphasize: No talking between modules, no sharing except via broadcast. Modules must not show their cards to anyone except the global channel when chosen.

  Part 2: Round 1 - Baseline (15 minutes)
  - [10-12 min] Facilitator gives each module a rich input (e.g., a detailed image description, a short melody notation, a word on the tip of the tongue, a complex bodily sensation). Each module records their input and immediate confidence (1-5 scale) on a log card (kept private).
  - [12-14 min] Global channel chooses one module to broadcast. That module passes their input card to the global channel, who reads it aloud.
  - [14-15 min] Downstream consumers update:
     - Memory writes the broadcast on the whiteboard (public archive).
     - Reasoning and Action: Facilitator gives a task (e.g., "Based on the broadcast, what should the system do next?"). They write an answer (but only based on broadcast).
  - [15-17 min] Facilitator asks the spokesperson a question about the input (e.g., "What was the word on the tip of the tongue?"). Spokesperson answers based only on broadcast. If the word was not broadcast, they say "I don't know" or what was broadcast.
  - [17-20 min] Scoring: System gets points for accurate report. Modules: if their input was broadcast, they get 5 points (recorded in memory). Otherwise 0.

  Part 3: Round 2 - Silent-Channel (15 minutes)
  - [20-22 min] Facilitator gives new inputs. This time, one module (e.g., the one with the bodily sensation) is marked "do not broadcast" (on their card). They still log input and confidence, but they are not allowed to be chosen. The global channel chooses from the others.
  - [22-24 min] Broadcast occurs as before.
  - [24-25 min] Downstream update.
  - [25-27 min] Facilitator asks spokesperson about the unbroadcast content (e.g., "What was the bodily sensation?"). Spokesperson can't know. Then, the silent module is asked (by facilitator) to reveal their log (input and confidence) to the class. Class sees that the module had rich content but the system didn't.
  - [27-30 min] Scoring: System points for accurate report (on what was broadcast). Silent module gets 0 points (no trace). Other modules get points if broadcast.

  Part 4: Round 3 - Faint-Signature (15 minutes)
  - [30-32 min] Facilitator gives inputs. One module (e.g., the one with a color image) is marked to cause a weak effect. Their card says: "Do not broadcast. In the forced-choice test, nudge toward the color green." They are also given a separate card that says "green" to pass to the facilitator later.
  - [32-34 min] Broadcast: Global channel chooses from the other modules (the marked module cannot be chosen).
  - [34-35 min] Downstream update.
  - [35-37 min] Facilitator asks spokesperson about the unbroadcast content (image details). Spokesperson doesn't know.
  - [37-40 min] Facilitator conducts forced-choice test: "What color was the image that module 3 had? Red, blue, or green?" The spokesperson must guess. The marked module passes their "green" card to the facilitator secretly. The facilitator then biases the test: they might say "The system guesses green" (if the spokesperson didn't choose, or if the spokesperson chose randomly, the facilitator can use the nudge). Alternatively, the facilitator can have the reasoning or action component do the forced choice and be biased (e.g., the action student is told to draw a circle and color it; they get a note saying "use green" and do so without knowing why). Then reveal the nudge and ask if this trace (the biased choice) counts as access.
  - [40-42 min] Scoring: System gets points for accurate report on broadcast. The faint-signature module gets 2 points because there was a weak trace (the forced choice was biased). Other modules get 5 if broadcast.

  Part 5: Round 4 - Decay (15 minutes)
  - [42-44 min] Facilitator gives inputs. All modules log input and immediate confidence.
  - [44-46 min] Broadcast one module (as usual).
  - [46-47 min] Downstream update.
  - [47-50 min] Then, wait 5 minutes (do another activity? or move to next part). During this time, the facilitator can run a distractor (e.g., ask the system to do a math problem using the reasoning consumer).
  - [50-52 min] Now, ask all modules to log their input again and their confidence (delayed). They try to recall what they had.
  - [52-55 min] Collect logs. Compare immediate and delayed logs: typically, delayed logs are less rich (details lost) and confidence might change.
  - [55-57 min] Scoring: System points for report (on what was broadcast). Modules: 5 points if broadcast (and recorded in memory), 0 otherwise. But also, note the decay in their own logs.

  Part 6: Debrief (30 minutes)
  - [57-60 min] First, ask the students about their experiences:
     - Modules: How did it feel when your content wasn't broadcast? When it decayed?
     - Spokesperson: What was it like to be limited to broadcast information?
     - Consumers: Did you feel you had the whole picture?
  - [60-70 min] Map to the concepts:
     - Global workspace: The broadcast channel that made information available to the whole system. Point out that without broadcast, the downstream consumers (memory, reasoning, action, report) couldn't use the information.
     - Silent-channel: This corresponds to the idea of phenomenal consciousness without access. The module had the content and could report it themselves (if asked), but the system (spokesperson) couldn't. Ask: Was the unbroadcast content still part of the subject's experience? (Here we note: the module player was conscious of it, but in the real debate, the subject is the whole system? Or the module? This is where the simulation breaks down.)
     - Faint-signature: The weak trace (forced-choice bias) might be seen as a form of access (because it influenced behavior) but without reportability. Is that enough for consciousness? Or is it just a subliminal effect?
     - Decay: Shows how immediate experience might be rich, but access (what gets into the global workspace and is maintained) is limited and decays. This maps to arguments about the richness of phenomenal consciousness vs. the sparseness of access.
  - [70-85 min] Highlight the debate:
     - Access-based view: Only what is globally available (broadcast) is conscious. In the game, only broadcast content was available for report and use. The unbroadcast content, even with a faint signature, wasn't consciously experienced by the system (the spokesperson couldn't report it).
     - Overflow view: The silent-channel condition shows that there can be experience without access (the module had it). The decay condition shows that experience was richer than what was accessed and remembered.
     - The key point of contention: What counts as evidence? The access-based view says only report (by the spokesperson) is evidence. The overflow view says the module's own testimony (when asked) is evidence of experience without access.
     - But note: In the simulation, the module player is a separate conscious agent, while in reality, we are considering a single subject. So we must be cautious. The simulation models the functional architecture, but the real issue is whether within a single subject, there can be unreportable experience.

  What will go wrong:
  1. Cheating: Students might peek, talk, or pass notes. Prevent by:
     - Having a strict facilitator who watches and enforces silence.
     - Using partitions or having modules face the wall.
     - Confiscating phones and notes.
  2. Bottleneck leakage: Even with rules, students might see or hear the broadcast and infer. Solution: Have the broadcast done in a way that only the global channel and downstream consumers hear (e.g., the global channel whispers to them, or projects only to the center). Modules should not hear the broadcast (so they don't know what was shared). Alternatively, run the broadcast in a separate area.
  3. Giggling: This is a fun activity, so keep it structured and move quickly. Assign roles to serious students. If it happens, acknowledge it and refocus.

  What the simulation cannot reproduce:
  - The key gap: In reality, the subject is one entity. In the game, each module is a separate subject. So when a module has unbroadcast content, that student is conscious of it, but in the real brain, the module is not a separate subject. Therefore, the simulation cannot show that within one subject there is unreportable experience. It only shows that in a distributed system, some parts have information that the central reporter doesn't.

  Therefore, in the debrief, you must explicitly state:
  "The simulation models the information flow in a cognitive architecture. But in the real debate, we are talking about a single subject. The access-based view says that for a content to be conscious, it must be globally available to the subject's systems. The overflow view says that a subject can have an experience without that global availability. The simulation cannot prove or disprove either, but it lets us see the functional role of global availability and the tension between what is present in a module and what the system can report."

  Finally, emphasize that the simulation helps illustrate the concepts and the arguments, but the real philosophical work comes from considering first-person experience and the nature of consciousness.
answer: |-
  ### Consciousness Simulation: "The Bottleneck Broadcast"  
  This simulation creates a functional model of a cognitive system to explore the tension between global accessibility and subjective richness. Students will embody modules, a global channel, and downstream consumers, experiencing how information bottlenecks shape reportability, downstream effects, and memory decay—without using theoretical jargon until debrief.  

  ---

  ### **Materials**  
  - **Index cards** (100+): For module inputs, confidence logs, forced-choice tests.  
  - **Envelopes** (10+): To pass inputs confidentially.  
  - **Timer**: For rounds and delays.  
  - **Projector**: Display instructions, points, and forced-choice options.  
  - **Whiteboard**: Track system/memory logs and points.  
  - **Blindfolds/partitions** (optional): Prevent visual/auditory leakage between modules.  
  - **Stickers or pens**: Label roles.  

  ---

  ### **Roles & Information Asymmetries**  
  *(Assign 15-20 mins before start; 16 students total)*  
  1. **Peripheral Modules (6 students)**:  
     - Each receives a unique, rich input via envelope (e.g., "Visual: A crowded street scene with a blue bicycle, red umbrella, and barking dog"; "Auditory: Four-note melody: C-E-G-C"; "Somatosensory: Sharp itch on left ankle").  
     - **Private knowledge**: Their input + confidence log. Cannot speak or show cards unless broadcast.  
     - **Incentive**: Earn 5 pts if their full input is recorded in the archive (memory log), 2 pts for a weak trace (faint-signature), 0 pts otherwise.  

  2. **Global Channel (1 student)**:  
     - **Role**: Receives requests-to-broadcast from modules (via raised hand). Selects ONE module per round. Reads its input aloud and passes it to Downstream Consumers.  
     - **Constraint**: Only 10 seconds to choose per round.  

  3. **Downstream Consumers (4 students)**:  
     - **Memory**: Writes broadcast content on whiteboard (system’s "archive").  
     - **Reasoning**: Uses broadcast to solve a simple puzzle (e.g., "If the word was ‘apple,’ name a fruit").  
     - **Action**: Performs a task (e.g., "Draw the object described").  
     - **Spokesperson**: ONLY person allowed to speak for the system. Answers facilitator questions **strictly based on broadcast archive**.  

  4. **Facilitator (You)**:  
     - Deliver inputs, enforce rules, run timer, award points.  
     - **Observer (1-2 spare students)**: Track "leaks" (e.g., cheating) for debrief.  

  ---

  ### **Rules**  
  - **No cross-talk**: Modules cannot speak, gesture, or share inputs. Spokesperson only speaks when asked.  
  - **Bottleneck enforcement**: Only broadcast content enters memory/reasoning/action.  
  - **Point system**:  
    - **System points**: 10 pts per accurate spokesperson report (vs. broadcast archive).  
    - **Module points**: Recorded privately (modules reveal points at end).  
  - **Violations**: −5 pts for leaks (e.g., module whispering).  

  ---

  ### **Timeline (90 Minutes)**  
  #### **Part 1: Setup (10 mins)**  
  - **0:00–0:05**: Assign roles. Label modules with stickers (e.g., "Vision," "Hearing"). Arrange chairs: Modules face walls/partitions; Consumers/Spokesperson face center. Project: *"You are parts of a system. Follow rules strictly. Modules: Keep inputs secret. Spokesperson: Only report what’s broadcast."*  
  - **0:05–0:10**: Explain rules. Emphasize: "No jargon—focus on your role’s goal (points!)." Distribute materials.  

  #### **Part 2: Baseline Round (15 mins)**  
  *(Goal: Establish normal bottleneck dynamics)*  
  - **0:10–0:12**: Give modules input envelopes (e.g., Visual: "Red car, green traffic light, pedestrian"). Modules log input + confidence (1–5 scale) privately.  
  - **0:12–0:14**: Modules signal to broadcast (raised hand). Global Channel selects one.  
  - **0:14–0:15**: Broadcast: Selected module passes card; Global Channel reads it aloud.  
  - **0:15–0:16**: Downstream Consumers:  
    - Memory writes broadcast on whiteboard.  
    - Reasoning/Action complete task (e.g., "Name something in the scene").  
  - **0:16–0:18**: Spokesperson report: Facilitator asks, "What did the visual module see?" Spokesperson answers **only from broadcast**.  
  - **0:18–0:20**: Award points: System (accuracy) + Modules (only broadcast module gets 5 pts).  

  #### **Part 3: Silent-Channel Round (15 mins)**  
  *(Goal: Unbroadcast content with no downstream trace)*  
  - **0:20–0:22**: New inputs. **Secretly** assign one module (e.g., Somatosensory) "DO NOT BROADCAST" on their card. They log input/confidence but cannot raise hand.  
  - **0:22–0:25**: Broadcast one other module. Consumers update archive.  
  - **0:25–0:27**: Spokesperson report: Ask about silent module (e.g., "What bodily sensation occurred?"). Spokesperson: "No data."  
  - **0:27–0:30**: Reveal: Silent module shares input/confidence log. Class sees rich unbroadcast content. Award points (silent module: 0 pts).  

  #### **Part 4: Faint-Signature Round (15 mins)**  
  *(Goal: Unbroadcast content with weak downstream effect)*  
  - **0:30–0:32**: New inputs. **Secretly** assign one module (e.g., Auditory) "DO NOT BROADCAST" but "In next choice, nudge toward option B."  
  - **0:32–0:35**: Broadcast another module. Consumers update archive.  
  - **0:35–0:37**: Spokesperson report: Ask about unbroadcast content (e.g., "What melody played?"). Spokesperson: "No data."  
  - **0:37–0:40**: **Forced-choice test**: Project: "What was the melody? A) C-D-E-F B) C-E-G-C." Spokesperson guesses. Reasoning/Action secretly biased (e.g., hears "B" via note from facilitator).  
  - **0:40–0:42**: Reveal nudge. Award points (unbroadcast module: 2 pts for trace).  

  #### **Part 5: Decay Round (15 mins)**  
  *(Goal: Confidence/memory decay over time)*  
  - **0:42–0:44**: New inputs. Modules log input + **immediate confidence**.  
  - **0:44–0:46**: Broadcast one module.  
  - **0:46–0:50**: **5-min delay**: Facilitator distracts with simple task (e.g., Consumers discuss broadcasted content).  
  - **0:50–0:52**: Modules re-log input + **delayed confidence** from memory.  
  - **0:52–0:55**: Compare logs: Show decay (e.g., "Confidence dropped from 5→3; details forgotten"). Award points.  

  #### **Part 6: Final Scoring & Transition to Debrief (5 mins)**  
  - **0:55–0:60**: Tally points. Project scores. Ask: "How did it feel to be a module vs. spokesperson?"  

  ---

  ### **Debrief (30 mins)**  
  **Goal**: Link simulation moments to the consciousness debate without lecturing. Use Socratic questioning.  

  #### **Step 1: Replay Key Moments (10 mins)**  
  - **Silent-Channel**: *"When the somatosensory module wasn’t broadcast, it logged ‘sharp itch’—but the spokesperson reported nothing. Did the system ‘experience’ the itch? Why did some of you feel it was real, even without access?"*  
    → Maps to: **Phenomenal overflow** (experience beyond access).  
  - **Faint-Signature**: *"The melody was unbroadcast but biased the forced choice. Is a weak, unattributable effect enough for ‘access’? Or is it just noise?"*  
    → Maps to: **Access as global availability** vs. **signatures as non-conscious**.  
  - **Decay**: *"Immediate logs were detailed but decayed. Does this mean experience is richer than what’s reportable, or is it just bad memory?"*  
    → Maps to: **Rich phenomenology** vs. **access as post-perceptual**.  
  - **Bottleneck**: *"Why did the system prioritize broadcasting one thing? What did this bottleneck *do* for the system?"*  
    → Maps to: **Global workspace as functional integration**.  

  #### **Step 2: Introduce the Stalemate (10 mins)**  
  - Project the debate:  
    - **Access View**: "Consciousness *is* global availability. Evidence = report (spokesperson)."  
    - **Overflow View**: "Experience exceeds access. Evidence = subjective richness (modules’ logs)."  
  - *"In the silent round, did you trust the module’s log (overflow) or the spokesperson (access)? Why?"*  
  - *"When the faint signature biased the choice, was that content ‘conscious’? Or did it just leak?"*  
  - **Crucial pivot**: *"Are we arguing about what consciousness *is*—or about what counts as evidence?"*  

  #### **Step 3: Highlight the Evidential Divide (5 mins)**  
  - *"Access theorists say: ‘If it’s not reportable, we can’t know it’s conscious.’ Overflow theorists say: ‘Report is imperfect; experience is immediate.’*  
  - *"In this sim, the spokesperson was the ‘reporter.’ But each module was also a ‘mini-reporter’ of their own state. That’s the problem."*  

  #### **Step 4: Acknowledge Limitations (5 mins)**  
  - *"What this sim **got right**:  
    - Bottleneck = access constraints.  
    - Decay = fragility of working memory.  
    - Faint signatures = unconscious priming."*  
  - *"What it **couldn’t simulate**:  
    - **Real overflow**: Every module was a conscious person. In reality, we ask: Can *one subject* have unreportable experience? The sim assumes this gap; it doesn’t prove it.  
    - **Subjectivity**: We didn’t recreate ‘what it’s like’ to have unbroadcast content. We only modeled functional segregation."*  
  - **Final note**: *"You’ll need words to bridge this. Say: ‘The hard question is whether the *subject’s* experience outstrips what they can access. This sim shows how access works functionally—but the gap itself is philosophical.’"*  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Peripheral players cheat/meta-game**:  
     - *Predictable*: Modules peek, whisper, or pass notes to "help" the system.  
     - *Fix*: Enforce −5 pt penalties. Use blindfolds/partitions. Assign observers to watch.  

  2. **Bottleneck leaks**:  
     - *Predictable*: Modules overhear broadcasts or see whiteboard.  
     - *Fix*: Isolate modules. Broadcast via projector (not aloud) or have Global Channel whisper to Consumers.  

  3. **Giggling/chaos**:  
     - *Predictable*: Early rounds may feel silly (e.g., forced-choice bias seems arbitrary).  
     - *Fix*: Lean in—ask, "Why is this funny? Because it feels artificial? That’s the point!" Keep rounds tight (use timer).  

  4. **Spokesperson frustration**:  
     - *Predictable*: Spokesperson hates being "ignorant" of unbroadcast content.  
     - *Fix*: In debrief, highlight this tension: "Your frustration mirrors the debate!"  

  5. **Time overruns**:  
     - *Predictable*: Decay round delay drags; setup takes longer.  
     - *Fix*: Cut distraction to 3 mins. Have inputs pre-written.  

  ---

  ### **What the Simulation Cannot Do**  
  - **Reproduce the hard problem**: It models *access* (information flow), not *phenomenality* (subjective experience). Students will *feel* their own module’s content, but this doesn’t resolve whether a *single subject* can have inaccessible experience.  
  - **Bridge the gap**: You must explicitly state: *"This sim shows *functional* segregation. The philosophical leap is whether a subject’s phenomenology can be like a module’s private content—present but unreportable. That’s where words take over."*  
