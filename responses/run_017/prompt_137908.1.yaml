answer: |-
  Here’s a runnable in-class activity designed to make your case tangible, with British English throughout and no citations. It runs in 90 minutes, emphasises anticipatory drift, logical coherence, and the "troll" dynamic, while exposing common pitfalls. Materials are minimal (paper, whiteboard, one laptop).

  ---

  ### **Activity: Logical Uncertainty Trading Floor**
  **Duration:** 60 mins trading + 30 mins debrief  
  **Players:** 14 students, 1 facilitator (you), 1 volunteer "Troll"  
  **Materials:**  
  - Claim cards (6 pre-made + blank cards for Troll)  
  - A4 sheets for portfolios (one per student)  
  - Whiteboard for "order book" (prices/positions)  
  - Laptop for rapid computations (e.g., Python for digits of π, prime checks)  
  - Timer  

  ---

  ### **Game Setup**
  **Claims & Settlement Schedule (announced upfront):**  
  | Claim | Statement | Settlement Time | Difficulty |  
  |-------|-----------|-----------------|-----------|  
  | A | "15 × 4 = 60" | **t=0 min** (immediately) | Trivial (by hand) |  
  | B | "The 100th prime is 541" | **t=10 min** (laptop: `sympy.isprime(541)`) | Easy (seconds) |  
  | C | "The last digit of \(3^{100}\) is 1" | **t=20 min** (laptop: `pow(3,100,10)`=1) | Moderate (seconds) |  
  | D | "The 1,000th digit of π is 9" | **t=60 min** (laptop: precomputed, but slow to verify) | Hard (known, but slow check) |  
  | E | "At t=30 min, median price for Claim D is >70" | **t=30 min** (facilitator checks whiteboard) | Self-referential |  
  | F | "All even numbers >2 are sum of two primes (Goldbach weak)" | **Never settled** | Open (but true for checked values) |  

  **Troll Mechanics:**  
  - Volunteer plays "Troll". At **t=8, t=25, t=40 min**, they introduce a new claim + negation on a blank card (e.g., "2³ = 8", "7 is prime"). Claims **settle 2 minutes after introduction** (Troll whispers truth to facilitator).  

  **Scoring (no real money):**  
  - Start with **100 points** per player.  
  - **Trades:** Buy/sell "shares" of claims. Shares pay **100 pts if true, 0 if false** at settlement.  
  - **Arbitrage Penalty:** If a player’s prices violate:  
    - \(P(X) + P(\neg X) = 100\) (e.g., \(P(A) = 60\), \(P(\neg A) = 50\))  
    - \(P(\text{Consequent}) \geq P(\text{Antecedent})\) for implications (e.g., if \(A \rightarrow B\) theorem, \(P(B) < P(A)\))  
    **Any player** can call "Arbitrage!" → Forced trade at incoherent prices, **offending player loses 20 pts**.  

  **Trading Rules:**  
  1. **Pricing:** Players publicly post bid/ask prices for claims (e.g., "Buy Claim B @ 80, Sell @ 85"). Update anytime.  
  2. **Trading:** Match bids/asks on whiteboard. Max 1 share/trade to prevent monopolies. Short selling allowed (negative shares).  
  3. **Predictions (at t=0):**  
     - Write down: "My price for Claim D at t=20 min: ___" (revealed at debrief).  
     - Predict median price for Claim E (self-referential).  

  ---

  ### **Step-by-Step Runthrough**
  **0. Prep (5 mins)**  
  - Hand portfolios (cash: 100 pts, positions: 0 for all claims).  
  - Explain claims, settlement times, arbitrage rules. Assign Troll.  
  - Stress: "Prices reflect your willingness to bet *now*—not waiting for proofs."  

  **1. Trading Rounds (60 mins)**  
  - **t=0:** Settle Claim A (true). Players see instant coherence pressure (e.g., if \(P(\neg A) >0\), arbitrage hits).  
  - **t=8:** Troll introduces trivial claim (e.g., "\(10^2 = 100\)"). Traders scramble to price before **t=10 settlement**.  
  - **t=10:** Settle Claim B (true). Watch Claim D prices—do they drift after B’s settlement?  
  - **t=20:** Settle Claim C (true). Record Claim D prices → compare to t=0 predictions.  
  - **t=25:** Troll introduces moderate claim (e.g., "There are 30 primes < 120").  
  - **t=30:** Settle Claim E (median Claim D price checked → true/false).  
  - **t=40:** Troll introduces hard claim (e.g., "Catalan’s constant irrational").  
  - **t=60:** Settle Claim D (true). Claim F remains open.  

  **2. Arbitrage Enforcement**  
  - **Deliberate traps:** Troll claims are easy—players penalised for slow coherence (e.g., \(P(\text{``7 prime''}) + P(\neg\text{``7 prime''}) \neq 100\)).  
  - **Implication example:** If Claim B implies "541 > 100" (theorem), enforce \(P(\text{``541>100''}) \geq P(B)\).  

  ---

  ### **Predictable Pitfalls & Mitigation**
  - **Liquidity dries up?** Troll injects urgency. Short selling adds action.  
  - **Anchoring at 50?** Early arbitrage penalties shock (e.g., Claim A settlement forces 0/100).  
  - **Whizzes dominate?** Cap trades/share. Stress: "This isn’t about maths skill—it’s about *pricing under uncertainty*."  
  - **"Football betting" mentality?** Debrief emphasises: "No dice rolls—penalties come from *logic*, not chance."  
  - **Last-minute dumping?** Self-referential Claim E exposes it (players must anticipate others’ actions).  

  ---

  ### **Debrief (30 mins)**  
  **Map Moments to Concepts:**  
  | Event | Concept |  
  |-------|---------|  
  | Claim D price drifts pre-settlement | Anticipatory drift (vs. "collapse at reveal"): Good reasoners use *related proofs* (e.g., Claim B/C) to update. |  
  | Troll claim penalties | Coherence isn’t optional—even for new sentences. Cheap errors (e.g., \(2+2\)) are *more* embarrassing. |  
  | Claim E (self-referential) | Reflective reasoning: Good reasoners model their *future* beliefs. |  
  | Claim F (open) | Handling undecided claims: Prices reflect *best guess* given compute limits (final price = last traded). |  
  | Arbitrage calls | Dutch books via *logic*: Violating \(P(X)+P(\neg X)=100\) guarantees loss, independent of truth. |  

  **Key Arguments Reinforced:**  
  1. **Logical uncertainty ≠ ignorance:** Prices track *effort-conditional* truth (e.g., Claim D drifts as *nearby* proofs complete).  
  2. **Agents > axioms:** Bounded reasoners (unlike omniscient gods) *must* use gradients—easy proofs (Claim A) anchor, hard ones (Claim D) allow drift.  
  3. **Collapse-at-reveal is lazy:** If your probability only moves at settlement (e.g., Claim B), you’re *waiting*, not *reasoning*.  

  **Limitations to State Explicitly:**  
  - "This isn’t *real* proof search: You get answers handed to you—no ‘aha!’ moments."  
  - "Logical induction tolerates *temporary* incoherence—but here, arbitrage is instant (not ‘in the limit’)."  
  - "A room of undergrads isn’t a ‘logical inductor’—it’s a toy model for intuitions."  

  **Close with Your Original Point:**  
  > "My mate said logical uncertainty is ‘mysticism’. But today, you saw prices drift toward truth *before* the laptop finished—because good reasoners use *logical shadows* (like Claim B settling) to update. That’s not curve-fitting. It’s how bounded minds grok maths when they can’t wait for QED."  

  ---

  ### **Troll Cheat Sheet**  
  - **t=8:** Trivial claim (e.g., "5! = 120")  
  - **t=25:** Moderate (e.g., "GCD(91, 104) = 13")  
  - **t=40:** Hard (e.g., "Riemann hypothesis true for first 10^9 zeros")  
  *Tip: Whisper truth to facilitator. Settlement in 2 mins forces rapid pricing.*  

  ### **Logistics**  
  - **Whiteboard Columns:** Claim | Bid/Ask | Player | Time  
  - **Portfolio Tracker:**  
  ```  
  | Claim | Long | Short | Last Price |  
  |-------|------|-------|------------|  
  | A     | 1    | 0     | 100        |  
  ```  
  - **Laptop Scripts (Python):**  
    - Prime check: `from sympy import isprime; isprime(541)`  
    - π digit: `import math; str(math.pi)[2:][999]` (precompute to avoid lag)  

  Run this as-is—no prep beyond printing claims and setting a timer. The forced coherence, Troll, and self-reference will make your case visceral. Good luck!
