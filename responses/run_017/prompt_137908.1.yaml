          Therefore, we can compute for each claim X: 
              payout = (net position in X) * (100 if X true else 0)

          But wait: if they are long 2 and short 3, the net is -1. Then if true, payout = -1 * 100 = -100. If false, 0.

          This matches: they lose 100 when true.

          But if they are long 3 and short 2, net +1. Then if true, +100; if false, 0.

          So the rule: at settlement, for each claim X, the participant's cash changes by: 
              (net position in X) * (100 if X is true, 0 if X is false)

          And then their position in X is set to zero.

          This is simple.

     We'll use this.

  9. **Logistics:**
     - We need a way for participants to post their prices. We can use a shared Google Sheet? Or a whiteboard? Or index cards that they update and pin on a board? 

     Given the classroom setting, we can have a large board with a grid: participants as rows, claims as columns. Each cell has the participant's price and max quantity for that claim. They can update by going to the board and changing.

     - Trading: if participant A wants to trade with participant B, they go to B's cell for the claim they are interested in. They see B's price and max quantity. Then they can trade up to the max quantity at B's price. Then they both update their positions (and B updates his max quantity if he doesn't want to trade more at that price).

     - The facilitator keeps track of positions and cash? Or each participant keeps their own? We'll have each participant keep a record of their own trades and positions. But the facilitator should also keep a central record to monitor arbitrage and settlement.

     Alternatively, we can have a few designated market makers (the facilitator and assistants) to record trades.

     Due to time constraints, we might need to simplify.

     We can use a centralized ledger (a spreadsheet on a projector). The facilitator records:
        - Each participant's cash and positions (for each claim).
        - Each participant's posted prices and max quantities for each claim.

     Participants can update their posted prices by telling the facilitator. When a trade occurs, the two participants agree (or one participant initiates by accepting the posted price of another) and then they report the trade to the facilitator.

     The facilitator updates the ledger.

     The arbitrageurs (any participant) can call out an incoherence in a participant's prices and then the facilitator forces the arbitrage trade.

  10. **Predicting Own Updates:**
      - At the start, each participant writes down their prediction for their own price of Claim D at t=20 and t=45. At the end, we see how close they were.

  11. **Debrief Points (30 minutes):**
      - Graded claims: show how the prices on the hard claim (D) drifted as time went on and as other claims settled (even though D itself wasn't settled until the end). Point out that if they were just waiting for the proof, the price would only change at settlement. But we saw drift.
      - Troll claims: when the troll introduced a trivial claim, participants who didn't immediately set their prices to 0 or 100 were caught out. This shows that a good reasoner must assign prices to new claims and be coherent immediately.
      - Self-referential claim: the price of Claim E (about the market) changed as the participants updated their prices for Claim D. This illustrates that the reasoner's beliefs about the future of their own beliefs are part of the system.
      - Arbitrage: the penalties for incoherence forced participants to be logically consistent. This is the Dutch book argument for logical coherence.
      - Predicting own updates: if they were good at predicting their own updates, it means their learning process is transparent to themselves.

      Also, what went wrong:
        - Liquidity dried up? Some claims might not have been traded. Solution: encourage more trading by having the troll claims or by the facilitator acting as a market maker for some claims?
        - Everyone anchored on 50? The troll claims should break that.
        - The two whizzes cleaned up: if some participants are better at math, they might have an advantage. But the point is that logical uncertainty is about bounded reasoners, and even the whizzes are bounded (they don't know Claim D immediately). Also, the arbitrage rule is about coherence, not about being right.
        - Last-minute dumping: if a claim is about to be settled and everyone knows it's true, then the price should be near 100. If someone sells at 99, they lose 1 point but avoid the risk? But the risk is zero. So the price should be 100. The arbitrage rule should enforce that if the claim is proven (but not yet settled) then the price must be 100? But during the game, they don't know the proof. But for Claim A at t=0, they should set 100. If they don't, they get arbitraged.

      What the game can't reproduce:
        - Real proof search: in the game, the claims are settled by the facilitator. In reality, we update our beliefs by thinking and by learning about proofs. The game abstracts away the actual reasoning process.
        - The gap between "no trader can exploit you in the limit" and "reasonable on a particular Tuesday": the game is a finite session. A participant might be incoherent on one claim for a short time and then fix it. That's allowed in logical induction over time. But in the game, they get punished immediately by arbitrage.
        - The framework describes an ideal reasoner that is computable? The game uses humans who are not computable? But the point is to illustrate the concepts.

