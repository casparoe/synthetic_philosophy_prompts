      - Frequentist: they might have done a meta-analysis assuming a fixed effect. Calculate the average effect across labs and see if it's significant. But ignore the heterogeneity.
      - Bayesian: would have considered a prior on how much the effect might vary and then updated to a distribution of effects. Might have been more cautious.
  - And note that piling on more replications without measuring the moderators doesn't resolve the ambiguity.

  To prevent a table that drew a null from concluding "the effect is fake", during the debrief we will reveal that the true effect was not the same for everyone. So a null result in one lab doesn't mean the original was wrong, it might be that the effect is not present in that population.

  To handle a loud person: assign roles. For example, in each lab, one person is the data roller, one is the recorder, one is the calculator, and one is the spokesperson. Rotate or assign to ensure everyone participates.

  What will predictably go wrong:
  - A lab might not understand the procedure for adding the true effect. Solution: clear written instructions and facilitator circulating.
  - The sample size might be too small to show variation. We have 4 labs: according to the moderator die, the distribution of true effects is:
      - P(big) = 1/3, P(small)=1/3, P(null)=1/3.
    So expected: one big, one small, two null? Or any combination. It might be that no lab gets a significant result in the replication? Then they might all decide not to adopt, and we don't see the dilemma.

    To mitigate, the facilitator can ensure that at least one replication is significant (by re-rolling the moderator die for one lab until it's big or small and the result is significant) if necessary? Or we can let it be and discuss.

    Alternatively, we can have more labs? But we have only 4.

    Or we can run the activity twice? Not enough time.

    We can have the true effects assigned by the facilitator to ensure one big, one small, one null, and one either big or small? Then we have variety.

    Since the activity is about learning, it's okay to rig the true effects to make sure we have a mixed picture.

    So the facilitator assigns:
      - Lab A: big effect (3)
      - Lab B: small effect (1)
      - Lab C: null (0)
      - Lab D: either big or small (say, big again to have two successes)

    But then it's not random. Or we can roll in advance and adjust to have at least one of each type.

    Given time, we can do: the facilitator rolls the moderator die for each lab until we have at least one big, one small, and one null. But with 4 labs, it's likely.

    Distribution: with 4 labs, the probability of at least one of each is:
      - Total possibilities: 3^4=81.
      - Number with at least one of each: total - those missing one type.
      - Missing big: 2^4=16 (only small and null)
      - Missing small: 16
      - Missing null: 16
      - But subtract the ones missing two types: all big (1), all small (1), all null (1), and also missing two types (e.g., only big and small: 2^4 - 2 = 14? because subtract all big and all small) -> better to use inclusion-exclusion.
      - Number with all three: total - (missing big + missing small + missing null) + (missing big and small) + (missing big and null) + (missing small and null) - missing all three? 
      - Missing big and small: only null -> 1
      - Similarly, missing big and null: only small -> 1
      - Missing small and null: only big -> 1
      - So by inclusion-exclusion: 3^4 - 3*2^4 + 3*1 = 81 - 3*16 + 3 = 81 - 48 + 3 = 36.
      - So probability = 36/81 = 4/9. About 44.4%. Not guaranteed.

    So to be safe, the facilitator can assign:
      - Lab1: big
      - Lab2: small
      - Lab3: null
      - Lab4: let the die roll (or assign to big to have two successes)

    Or to make it random, we can accept whatever comes.

    Given the educational purpose, I think it's okay to fix the true effects for the four labs to be: big, small, null, and big. So two labs will likely succeed (big effect), one will sometimes succeed (small), and one will likely fail (null). This will give us a mixed picture.

    Then the results might be:
      - Lab1 (big): significant
      - Lab2 (small): might be significant or not (about 43% chance)
      - Lab3 (null): not significant (or 5% chance of false positive)
      - Lab4 (big): significant

    So typically, 2 or 3 significant replications.

    Then when deciding, the lab with the small effect might or might not have significant result, and the null lab probably not.

    Then the labs with non-significant results might still see that others succeeded.

  Debrief outline:

  1. Show the results: the original study and the four replications. Note which were significant and which were not.
  2. Ask the labs what they decided (adopt or not) and why. In particular, the lab with the small effect: if they got a non-significant result, did they still adopt because others succeeded? The null lab: if they got a non-significant result, they probably didn't adopt.
  3. Then reveal the true effects for each lab. Show that the effect was not the same everywhere.
  4. Discuss the ambiguity: a failed replication might mean either the original was wrong (false positive) or the effect is not the same here.
  5. Connect to the replication crisis: when we try to replicate and fail, how do we know which it is?
  6. Then introduce the two statistical approaches:
      - Frequentist: typically assumes a fixed true effect. They might do a meta-analysis combining the studies, testing if the average effect is non-zero. But this ignores the heterogeneity.
      - Bayesian: would explicitly model a distribution of effects. The prior might be that effects vary across labs, and then the data update the distribution.
  7. Show that in the activity, the effect varied, and the Bayesian approach would have captured that uncertainty.
  8. Note that more replications without measuring the moderators don't resolve the ambiguity because each new lab might have a different unmeasured moderator.

  What the activity cannot reproduce: 
  - It doesn't show the full Bayesian machinery (priors, updating, posterior) because we haven't done any calculations. It only shows the conceptual idea of variation.
  - It might be seen as rigged because we introduced the moderator die. We have to be clear that in reality, we don't know if there is a moderator die, but the ambiguity is real.

  Confidence in the design:
  - The mechanism of the hidden moderator die is essential to create the variation. It does build in a distribution of effect sizes, which is the Bayesian view. But that is the point: to show that the world might have variation, and the frequentist approach often ignores it. So it's not rigged, it's the reality we are simulating.
  - The data generation might be a bit cumbersome, but it should work in 20 minutes if each lab has 4 people, each generating 10 rolls (5 control and 5 treatment base outcomes) and then one person adding the true effect and doing the calculations.
  - The significance rule is an approximation, but it should be close enough.

  Alternative simplification: to save time, each lab only generates 10 subjects per group? Then n=10 per group. We recalculate the critical difference. With n=10, SE = sqrt(2*2.92/10)=sqrt(0.584)=0.764. Critical t for df=18 is 2.10, so critical difference=2.10*0.764=1.6044, so about 1.6. Then:
  - Big effect (3): always significant
  - Small effect (1): rarely significant (power about 21%)
  - Null: 5% significant.

  But then the small effect will almost never be significant, which might make the replication failure more common. That's okay, but we want the small effect to sometimes be a success and sometimes not? With n=10, it's less likely. So n=20 is better.

  Given the time, we'll go with n=20 per group.

  Final rules and materials per lab:
  - 1 sealed envelope with the true effect (0, 1, or 3) - assigned by facilitator.
  - 40 index cards or a sheet of paper to record rolls (20 for control, 20 for treatment base).
  - 1 die for rolling.
  - A calculator (or phone) for computing means? Or they can do by hand.

  But computing the mean of 20 numbers might take time. We can have them sum the 20 rolls and then divide by 20.

  To save time, they can sum the control rolls and the treatment base rolls, then after adding the true effect, the treatment sum becomes (treatment_base_sum + 20 * true effect). Then the mean control = control_sum/20, mean treatment = (treatment_base_sum + 20 * true effect)/20 = treatment_base_sum/20 + true effect.

  So they don't have to add the true effect to each card, just to the mean.

  So procedure:
  1. Roll for control: 20 rolls, record the sum.
  2. Roll for treatment base: 20 rolls, record the sum.
  3. Open envelope to get true effect.
  4. Compute:
     - Control mean = control_sum / 20
     - Treatment mean = (treatment_base_sum / 20) + true effect
     - Difference = treatment mean - control mean
  5. If |difference| >= 1.1, then significant.

  This is faster.

  Timeline:

  - 0-10 min: 
    - Facilitator introduces the activity: we are replicating a study that found a significant effect (present original study: control mean=3.5, treatment mean=6.5, difference=3.0, significant).
    - Divide into 4 labs. Facilitator gives each lab a sealed envelope (with true effect: 0, 1, or 3) and a die.
    - Explain the procedure: 
          a. Roll the die 20 times for the control group, record the sum.
          b. Roll the die 20 times for the treatment group, record the sum (this is the base outcome).
          c. Open the envelope to get the true effect for your lab.
          d. Compute control mean = control_sum / 20.
          e. Compute treatment mean = (treatment_base_sum / 20) + true effect.
          f. Difference = treatment mean - control mean.
          g. If |difference| >= 1.1, then your replication is significant.
    - Each lab should have a recorder, a roller, a calculator, and a reporter.

  - 10-25 min: Labs generate data and compute. Facilitator circulates to help.

  - 25-30 min: Each lab reports on the central board: 
      - Lab ID, control mean, treatment mean, difference, significant? (yes/no)

  - 30-35 min: Labs look at the board and see all results.

  - 35-40 min: Each lab decides: based on the original study and the replications (including your own), should your university adopt the treatment? (adopt or not adopt)

  - 40-45 min: Labs report their decision on the board.

  - 45-50 min: Facilitator reveals the true effect for each lab and the payoff for each lab's decision:
      - If adopted and true effect=3: +3
      - If adopted and true effect=1: +1
      - If adopted and true effect=0: -2
      - If not adopted: 0

  - 50-90 min: Debrief.

  Debrief points:
  1. What happened? (Original study was significant, replications were mixed.)
  2. How did you decide whether to adopt? (Especially labs with non-significant results: did they adopt because others had significant results? Labs with significant results: did they adopt for sure?)
  3. Reveal: the true effect was not the same in every lab. Why? Because of unmeasured moderators (e.g., maybe the treatment works better in some populations, or the procedure differed slightly). We didn't measure what caused the difference.
  4. This is the ambiguity in replication failures: is it a false positive in the original, or is the effect not the same here?
  5. Frequentist approach: often assumes a fixed effect. If we combined the results in a meta-analysis, we might get an average effect. But if there is heterogeneity, that average might be misleading. For example, the effect is 3 in some places, 0 in others, so the average is 1.5? But in a place with 0 effect, the average doesn't help.
  6. Bayesian approach: would start with a prior distribution on the effect size, including how much it might vary. Then the data update the distribution. So for a new lab, the predicted effect is a distribution, not a single number. Then the decision to adopt might depend on the entire distribution (e.g., expected utility).
  7. In the activity, the labs with null or small effects might have adopted because of the other positive results, but then they got low or negative payoffs. This shows that even with replications, we can make bad decisions if we ignore heterogeneity.
  8. The replication crisis: more replications are good, but if we don't measure and account for the moderators, we still have ambiguity. The solution is to measure potential moderators and include them in the analysis.

  Potential issue: 
  - A lab with null effect might have gotten a significant result by chance (false positive). In our setup, with n=20, the false positive rate is about 5%, but it happened. Then they might have adopted and then found out they got -2. This is a false positive in the replication, but it's rare. It can be discussed as well.

  - If a lab with small effect got a significant result, they adopted and got +1, which is positive but less than the +3 of the big effect labs. They might wonder why.

  We can discuss that even if the effect is present, it might be smaller in some populations.

  Confidence: 
  - The activity should work to illustrate the ambiguity and the role of unmeasured heterogeneity. 
  - The data generation might be a bit tedious, but with the summing it should be doable in 15 minutes.
  - The connection to frequentist vs. Bayesian is conceptual and might need careful explanation in the debrief.

  I am confident that the core idea is sound. The implementation might need tweaking based on time and resources.
