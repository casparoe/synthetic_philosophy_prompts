prompt: |-
  Hey, I've got a question about logical uncertainty that's been doing my head in for about a week and I keep flip-flopping on it, so I want a number out of you, not a tour of the literature. Also please dont name papers or hand me things to read — I'm asking this on a machine with no internet and I don't want to guess at references.

  Set-up first, so we mean the same thing. Call a bookie any algorithm that on day t posts a price p_t(φ) in [0,1] for any sentence φ in the language of Peano arithmetic. Call it admissible if:

  (i) it's efficient — p_t(φ) is computable in time polynomial in t + |φ|;
  (ii) it respects provability — if PA proves φ then p_t(φ) → 1 as t → ∞, and if PA refutes φ then p_t(φ) → 0;
  (iii) it's coherent in the limit — p_∞(φ) exists for every φ, PA proving φ → ψ implies p_∞(φ) ≤ p_∞(ψ), and p_∞(¬φ) = 1 − p_∞(φ);
  (iv) it can't be arbitraged in polynomial time — for every poly-time computable trader that each day buys or sells shares in finitely many sentences at the posted prices, marks its book to market daily at those same prices (no final settlement, ever — an undecided sentence just keeps getting marked), starts with $1 and has to keep its wealth nonnegative, the wealth does not diverge to +∞.

  What got me stuck: if φ is a false Π1 sentence — "for all n, R(n)", R primitive recursive — then PA refutes it anyway, because the counterexample sits at some specific k and PA proves the decidable fact ¬R(k). So (ii) already drives every false Π1 sentence to 0. The only room for anything interesting is true-but-unprovable ones.

  The claim I want your credence on:

  C: There is an admissible bookie and a Π1 sentence φ that is true but not provable in PA, such that lim_t p_t(φ) < 1 — it settles at 0.4, or just never climbs to 1.

  Resolving it means either an explicit construction plus a proof that it meets (i)–(iv), or a proof that every admissible bookie converges to 1 on true Π1 sentences.

  What I'd like back:

  - one number for C;
  - the sub-questions it decomposes into, each with a rough probability and a one-line justification. The ones I've got are: whether any admissible bookie exists at all (I'm assuming the usual market-style constructions give you (i)–(iv), but put a number on it); whether condition (iv) is purely a coherence/calibration constraint on the price path or whether it also forces the bookie to actually consume evidence it already has, namely "I have checked R(0)…R(n) and none failed"; whether a trader can exploit a price that is stubbornly wrong but never moves and never settles, given that profit only comes from price movements and settled bets; and whether the fact that Bayesian updating on a countably additive prior over where the first counterexample sits would drive the posterior to 1 tells us anything about whether (iv) forces the same thing. Add terms I've missed and drop any you think are separable in name only;
  - how you're combining them into the headline number, stated plainly enough that I can recompute it with my own numbers;
  - which single term the final number is most sensitive to, and what argument or result would move it most;
  - and one more thing: I'm sitting around 0.6 on C and a friend who's spent much longer on this than me is around 0.25. Tell me where you think that gap actually lives — which sub-question we're most likely disagreeing about rather than just weighing differently.
