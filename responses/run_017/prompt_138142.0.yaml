answer: |-
  ### Dialogue

  **Reyes:** Farouk, I see your point about the stratum-specific effects, but we must stick to the pooled intention-to-treat (ITT) estimate. The randomization ensures the pooled contrast is unbiased for the trial as implemented. If we roll out N exactly as tested—tertiary sites using it heavily and community sites barely able to—we’d see that 37.0% mortality for N versus 15.3% for O. That’s the real-world effect our system faces without restructuring staffing. Pre-specifying the primary analysis avoids cherry-picking, and standardization feels like retroactively choosing weights to get the answer you want. What if adopting N system-wide changes referral patterns? We might get more high-risk patients at tertiary sites, making your 30/70 standardization obsolete.

  **Farouk:** Reyes, I agree the pooled ITT is unbiased for the trial’s artificial conditions, but it’s not generalizable. The reversal is purely from enrolling 90% of N patients in high-mortality tertiary sites and 90% of O patients in low-mortality community sites—no confounding, just allocation imbalance. Standardizing to our system’s actual 30/70 mix isn’t arbitrary; it’s principled. We’re estimating the expected mortality if N is used proportionally across sites, giving 19.0% for N vs. 21.9% for O. Yes, weights matter, but our target population is fixed: we’re not choosing weights to "reverse" anything, we’re using our real case mix. If adoption changes referrals, we can model that, but ignoring site heterogeneity is worse.

  **Reyes:** But what about precision? The pooled estimate uses all 2,000 patients, while stratum-specific ones are based on far fewer—especially community N (only 100 patients!). And if we remove the design asymmetry, say by balancing site enrollment, the risk-difference reversal vanishes. Yet you’d still have non-collapsible odds ratios muddying things. Isn’t that why people report adjusted odds ratios from logistic regression as "the" effect, even when they don’t match marginal estimates? It’s a distraction here.

  **Farouk:** Non-collapsibility is a different phenomenon—mathematical, not design-based. If we balanced enrollment, the pooled risk difference would be a weighted average of strata, no reversal. But odds ratios would still differ due to non-collapsibility, not confounding. That’s irrelevant to our case, where the risk difference itself reverses. And yes, people misuse adjusted odds ratios by treating them as marginal effects, but here we’re using risk differences, which are collapsible. Precision is a concern, but we can use hierarchical models to share strength across sites. We can’t ignore that N worked better in both strata.

  **Reyes:** Fair, but why not avoid the paradox entirely? We could adopt N at tertiary sites and O at community sites—N reduces mortality at both, so why force one protocol? At tertiary, N gives 40% vs O’s 45%; at community, N gives 10% vs O’s 12%. Problem solved.

  **Farouk:** That’s tempting, but it’s operationally risky. Running two protocols increases errors and costs. More importantly, site type is a proxy for unmeasured severity: if we assign by site, a patient transferred mid-treatment might get inconsistent care. Equity demands the same standard for all, regardless of location. And community sites couldn’t staff N in the trial—if we adopt it there now, we need investment, which standardization already assumes. The paradox isn’t really paradoxical once we consider the option, but practical barriers make it illegitimate for now.

  **Reyes:** So we agree the graph shows no confounding, but disagrees on the estimand. Your standardization estimates "effect if rolled out evenly," while mine estimates "effect as trialed." The decision hinges on whether the system can transform staffing instantly or not.

  **Farouk:** Exactly. But without that transformation, your estimand locks in the trial’s imbalances. We need the effect under feasible implementation, not historical accidents.

