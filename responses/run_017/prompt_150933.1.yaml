answer: |-
  Here's your hypothetical scenario, designed to meet all your constraints:

  **Scenario:** Maplewood University Dorm Rule 7 states: "Residents must not create amplified sound audible in neighboring rooms between 10:00 PM and 8:00 AM. Violations may result in disciplinary action." The rule was enacted following years of complaints about loud music and parties disturbing sleep. Sarah, a resident, practices her trumpet loudly in her room at 11:00 PM without any electronic amplifier, clearly disturbing her neighbors trying to sleep. She argues she did not violate Rule 7 because her trumpet sound is not "amplified."

  **Analysis:**

  1.  **Textualism:** The text explicitly prohibits only "amplified sound." "Amplified," in its ordinary meaning, requires sound to be made louder electronically (e.g., speakers, microphones). An acoustic trumpet, played without such equipment, produces unamplified sound. Therefore, Sarah did not violate the rule's plain language and should not be disciplined. The rule specifically chose to target *amplified* sound, implying non-amplified sound was intentionally excluded.
  2.  **Purposivism:** The rule's undeniable purpose, clear from the context of sleep disturbance complaints, is to prevent disruptive noise during quiet hours that prevents neighbors from sleeping. Sarah's loud trumpet playing, while technically unamplified, fulfills the exact harm the rule was designed to prevent – disruptive noise preventing sleep. A purposivist interpretation would hold Sarah violated the rule's spirit and objective, leading to discipline.
  3.  **Key Feature Doing the Work:** **Under-inclusion of the Text.** The text ("amplified sound") is narrower than the purpose ("prevent disruptive sleep-disturbing noise"). The specific term "amplified" creates a gap where the core problem (disruptive noise) exists without the triggering characteristic (electronic amplification). This gap allows the textualist to find no violation while the purposivist, focusing on the harm, finds one.
  4.  **Removing the Key Feature:** If Rule 7 instead prohibited "loud noise" or "disruptive sound," both textualists and purposivists would almost certainly agree Sarah violated the rule. The text would directly encompass the conduct matching the purpose, eliminating the gap and the disagreement.
  5.  **Strongest Textualist Reply:** A textualist could forcefully argue: "The rule's drafters *chose* the specific term 'amplified sound.' This deliberate choice reflects a policy decision to *permit* loud, non-amplified sounds during quiet hours, perhaps to allow acoustic music practice, loud conversations, or other naturally loud activities that were deemed acceptable despite potential disturbance. Purposivism here overrides this deliberate legislative choice, imposing a restriction the drafters explicitly declined to enact and creating uncertainty about what other unmentioned activities might now be prohibited based solely on perceived 'purpose.' The text provides clear notice; purposivism undermines that notice after the fact."

  **Why this works:**

  *   **Clear Text:** "Amplified sound" has a well-understood ordinary meaning distinct from acoustic sound.
  *   **Clear Purpose:** Dorm quiet hours rules universally aim to prevent disruptive noise for sleep; "amplified" was the *means* identified as the primary problem historically, but the *end* is reducing disruptive noise.
  *   **Reversed Roles:** Textualism (literal meaning) leads to leniency (no violation); Purposivism (focus on harm) leads to strictness (violation).
  *   **Ordinary Setting:** University dorm rule.
  *   **No Lenity:** Not a criminal statute.
  *   **No Stipulation:** Purpose inferred directly from the context provided (complaints about disturbance leading to the rule).
  *   **No Vagueness/Ambiguity:** "Amplified" isn't vague; the disagreement arises from the *gap* between the precise term and the broader purpose.
  *   **Disagreement Falls Out:** The theories naturally diverge based on their core principles applied to the under-inclusive text.
