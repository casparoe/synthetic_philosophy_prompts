  Hmm... common examples usually have textualism being strict. Reversing that requires a rule whose wording is unexpectedly broad or has loopholes. Maybe a university policy? Those often have clear purposes but precise wording. 

  Let me brainstorm scenarios: 
  - A "no pets" rule where a fish isn't literally a pet? But that might feel weak. 
