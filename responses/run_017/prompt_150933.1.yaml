  Now for the analysis: 
  - Textualism: Focuses on "amplified"—no electronics, no violation. 
  - Purposivism: Ignores the technicality because the noise disrupts sleep. 
  - Key feature: Under-inclusion—the text misses non-amplified disturbances. 
  - Without it: If the rule said "loud noise," textualism and purposivism align. 
