prompt: |-
  I'm a novelist and I've written myself into a corner, and I'm hoping someone finds it fun rather than annoying.

  Setup, short version. A couple of centuries out in my book there's life on another planet — not microbes, a whole biosphere — and the plot hangs on a legal question: there's a conservation instrument that protects kinds of organism, and somebody has to certify how many kinds there are before a mining concession goes through. So my characters need a species concept. Which means I need to know what a species concept is even supposed to do, because right now every argument in my draft is people reciting defintions at each other and it reads like a wikipedia page with dialogue.

  So: give me the requirements list, not the answer. What does a species concept have to deliver to count as adequate — and adequate for what, since I get the sense that's half the fight. The cases it has to get right, the distinctions it isn't allowed to collapse, whatever bits of actual biology it can't flatly contradict. For each requirement I want the case or consideration behind it, i.e. why it's a requirement and not just something one camp happens to like. And mark which are non-negotiable and which are preferences of particular schools.

  Three different jobs are pulling on the concept in my book, and I suspect they pull different ways:

  1. The lawyers need a number and a list, and the list has to stay still long enough to be litigated.
  2. The mining company's scientist says none of this matters, all anyone needs is to know which organisms will respond the same way to what they're about to do — so the concept has to license inductive generalizations, not just label things.
  3. My point-of-view character is a field naturalist who has to make the call in the field, with what's in her pack and a slow handheld sequencer, on an organism she may only ever see once.

  Tell me which requirements come from which job, and whether any of those jobs is making a demand that a species concept shouldn't be asked to meet at all.

  The biosphere I've given them, which is were I think I've made it hard on myself:

  - Nothing has sexes. Individuals bud off propagules, but two grown individuals can also fuse, and their genomes recombine into one organism.
  - Fusion isn't confined within anything recognisable. A sessile filter-feeding mat and a motile grazer that look like they belong to different phyla fuse as a matter of course, and the fused product can bud offspring of either body plan.
  - There's a virus-like shuttle that moves whole packets of chromosomes between organisms that never fused with anything. So different genes tell different family trees, and the trees disagree.
  - Development is switched by diet and temperature: one genome can produce three or four adult forms that don't look related, and these aren't life stages — they don't turn into each other. Which one you get depends on what you ate as a propagule.
  - The ecologically dominant organism on the planet is a persistent swarm of intermediates between two otherwise perfectly recognisable forms. It has been stable for as long as anyone has been watching, it isn't a transient at a contact zone, and it is exactly the thing that would be wiped out by the mine.
  - And they can't rule out that the mats and the grazers had separate origins in the first place — more than one tree of life on the planet — with the shuttles moving genes between the trees anyway.

  Two things I especially want. First: which of the requirements on your list are really just terran parochialism, things that look mandatory only because Earth life happens to be built a certain way, versus which any concept would have to meet anywhere? Second: which two requirements on the list can't be had together? If the honest answer is that my biosphere makes the full list unsatisfiable, that's a gift, I can build a scene around it — so say so explicitly rather than papering over it.

  There also seem to be two questions tangled together in every argument I've drafted — how many kinds there are, and which kind this particular animal belongs to — and I want to know whether a concept has to answer both, and whether settling one settles the other.

  At the very end, a one-line scorecard is fine — the interbreeding one, the look-alike one, the family-tree one, the niche one, and whatever the lineage-first people call theirs — but only one line each, and only if it doesn't crowd out the criteria. The criteria are what I'm paying for.

  Then finish with a single line I can paste into a spreadsheet:

  \answer{<the one requirement that knocks out the most candidate concepts, in six words or fewer> | <yes/no: can every non-negotiable requirement on your list be met at once in a biosphere like this one>}
reasoning: |-
  Okay, the user is a novelist who's written themselves into a corner with a sci-fi legal dilemma about defining species on an alien planet. They need a rigorous framework for evaluating species concepts, not just definitions. Let me unpack this carefully.

  First, the core problem: they have three conflicting demands on the species concept from different stakeholders. The lawyers want stability and countable entities, the corporate scientist wants predictive utility for environmental impact, and the field naturalist needs practical field applicability. The alien biology they've created deliberately challenges all terrestrial assumptions - horizontal gene transfer, fusion reproduction, phenotypic plasticity, and possible multiple origins of life. 

  I should start by identifying what species concepts fundamentally must achieve in biology. The non-negotiables: any concept must allow identification of distinct entities (operationality), maintain consistency over time (stability), and reflect actual biological discontinuities rather than arbitrary divisions. These come from basic scientific needs - we can't study what we can't identify or track. 

  The stakeholder-specific requirements reveal tensions:
  - Lawyers need discrete countable units (stability and discreteness), but biology often has fuzzy boundaries. 
  - The corporate scientist's demand for predictive power requires the concept to map to functional traits, which conflicts with genetic or phylogenetic approaches when phenotypes don't match genotypes. 
  - The naturalist's field constraints prioritize observable characteristics over genetic analysis, which is problematic when morphology doesn't reflect reproductive compatibility or evolutionary history.

  Now the alien biology systematically breaks terrestrial assumptions:
  - Fusion reproduction and gene shuttles destroy the interbreeding criterion
  - Phenotypic switching undermines morphological and ecological concepts
  - The stable hybrid swarm breaks the "distinct forms" expectation
  - Multiple origins plus gene transfer make phylogenies incoherent

  This means several fundamental terrestrial requirements can't be met simultaneously here. Most critically:
  - Discreteness vs continuity (the hybrid swarm forces a binary choice)
  - Stability vs dynamism (with constant gene flow, any classification becomes transient)
  - Monophyly requirement (impossible with multiple origins and horizontal transfer)

  The key insight is that no single concept can satisfy all three stakeholders' needs in this biosphere. The lawyers' demand for permanent countable entities is biologically unrealistic here. The predictive utility requirement might be partially salvageable through ecological grouping, but won't align with genetic data.

  For the spreadsheet answer, the most disruptive requirement is "distinctness maintained over time" because the alien biology inherently produces fluid boundaries. And no, not all non-negotiables can be met simultaneously - this biosphere makes coherent species classification impossible by terrestrial standards, which is perfect for their narrative conflict.
answer: |-
  Here's the requirements list for a species concept, structured by purpose, with biological reasoning, stakeholder alignment, and feasibility in your biosphere. The core tension: **species concepts are tools for specific jobs, not universal truths.**

  ### Non-Negotiable Requirements (True for Any Biosphere)
  1.  **Operationality:** Must provide *actionable criteria* to place an organism into a group or reject it.  
      *Why?* Without this, the concept is philosophy, not science. You can't count or list what you can't identify.  
      *Stakeholder:* Critical for Lawyer (counting) and Naturalist (field ID).  
      *Alien Challenge:* Phenotypic switching and fusion make consistent identification by morphology alone impossible.

  2.  **Consistency:** Must apply the *same criteria* to all organisms being classified.  
      *Why?* Arbitrary standards invalidate comparisons (e.g., using genetics for some, morphology for others).  
      *Stakeholder:* Non-negotiable for Lawyer (legal defensibility) and Scientist (valid induction).  
      *Alien Challenge:* Fusion across body plans forces a single criterion (e.g., genetics) onto wildly disparate forms.

  3.  **Discontinuity Identification:** Must recognize where *significant biological gaps* exist between groups.  
      *Why?* The point is to distinguish "kinds," not just label continua. If there are no gaps, the concept fails.  
      *Stakeholder:* Core for all. Lawyer (defines units), Scientist (groups with shared responses), Naturalist (meaningful categories).  
      *Alien Challenge:* The stable hybrid swarm *is* the continuum. Forcing discrete units here might be biologically invalid.

  ### Contingent Requirements (Depend on Purpose/Biology)
  4.  **Stability (over relevant timescales):** Groups should not dissolve or merge under minor observation/perturbation.  
      *Why?* For conservation/law, the list must hold long enough for policy. For science, categories need predictive shelf-life.  
      *Stakeholder:* **CRITICAL for Lawyer** (litigation timescales). *Less critical* for Scientist (if responses are predictable now) and Naturalist (if ID is momentary).  
      *Alien Challenge:* Gene shuttles & fusion cause constant genomic flux. Stability may be impossible beyond very short terms.

  5.  **Predictive Power (Inductive Potential):** Membership should predict *unobserved traits* (e.g., physiology, response to toxins, reproductive compatibility).  
      *Why?* Science relies on generalization. Conservation needs to know "protect X, you protect its traits."  
      *Stakeholder:** **Core demand of Scientist**. Useful for Lawyer/Naturalist if traits matter legally or for ID.  
      *Alien Challenge:* Phenotypic switching means same genome ≠ same form/response. Fusion means shared genes ≠ shared biology. Gene shuttles mean related genes ≠ shared evolutionary history. Severely compromised.

  6.  **Field Applicability:** Criteria must be assessable with *available tools/time* by a competent practitioner.  
      *Why?* If you need a full genome lab to ID everything, field biology is dead.  
      *Stakeholder:* **Absolute requirement for Naturalist**. Irrelevant to Lawyer/Scientist *if* the final list is authoritative.  
      *Alien Challenge:* Morphology unreliable due to switching. Slow sequencer struggles with massive gene flow & recombination. Fusion history hard to trace. Extremely difficult.

  7.  **Evolutionary Relevance (Monophyly/Cohesion):** Should reflect *actual evolutionary history* or *ongoing evolutionary processes* (lineage cohesion).  
      *Why?* For understanding origins, dynamics, and long-term conservation of unique evolutionary pathways.  
      *Stakeholder:* Preference of many biologists (Scientist/Naturalist). Lawyer cares only if law specifies "evolutionary units."  
      *Alien Challenge:* Multiple origins + gene shuttles + fusion = **phylogenetic chaos**. Monophyly is likely unattainable. Cohesion (via fusion) is hyper-fluid.

  ### Stakeholder Demands vs. Biological Reality
  *   **Lawyer (Stability/Countability):** Demands **Stability** and **Discreteness**. This is the *most biologically unreasonable demand* in your biosphere. Gene flow and fusion inherently prevent stable, countable units. *This demand clashes fundamentally with the biology.*
  *   **Scientist (Predictive Power):** Demands **Predictive Power**. Undermined by phenotypic switching (same "kind" = different responses) and fusion (different "kinds" share genes/responses). Hard to satisfy reliably.
  *   **Naturalist (Field ID):** Demands **Field Applicability**. Undermined by phenotypic switching and the inadequacy of a slow sequencer against massive horizontal gene transfer. Possible only with crude (and unreliable) proxies.

  ### Terran Parochialism vs. Universal Needs
  *   **Parochial:** Assumption of vertical inheritance, stable genomes, sexual reproduction barriers defining groups, tight genotype-phenotype linkage, monophyletic origins for major groups. Your biosphere breaks all of these.
  *   **Universal:** Need for **Operationality, Consistency,** and identifying **Discontinuities**. Even in chaos, you need *some* way to identify and group based on observable/measurable properties for any science to happen. Predictive Power and Stability are *desired* but not always biologically achievable universals.

  ### Unsatisfiable Tensions
  1.  **Stability vs. Predictive Power:** A stable list (Lawyer) will quickly become biologically inaccurate due to gene flow/fusion, losing its predictive power (Scientist). Locking in a snapshot sacrifices relevance.
  2.  **Evolutionary Relevance vs. Field Applicability:** Defining evolutionarily coherent units requires deep genomic/lineage analysis impossible for the Naturalist.
  3.  **Discreteness vs. Biological Reality:** The lawyer demands distinct units. The stable hybrid swarm AND fusion processes are **fundamentally continuous**. Forcing discreteness here is biologically artificial.

  ### The Two Questions (How Many Kinds? Which Kind is This?)
  *   A concept must answer **"Which kind is this?"** (Operationality). This is primary.
  *   **"How many kinds?"** depends entirely on the resolution set by the concept's criteria applied consistently to *all* sampled organisms. Settling the identification criteria *allows* counting, but doesn't pre-determine the number. The continuous hybrid swarm makes counting inherently arbitrary.

  ### One-Line Scorecard on Common Concepts
  *   **Biological (Interbreeding):** Utterly destroyed by fusion & gene shuttles. Useless.
  *   **Morphological (Look-alike):** Undermined by phenotypic switching & fusion products.
  *   **Phylogenetic (Family Tree):** Destroyed by gene shuttles, fusion, multiple origins. Impossible.
  *   **Ecological (Niche):** Complicated by phenotypic switching & fusion, but *possible* (dominant swarm is its own niche?).
  *   **Evolutionary/Lineage (Cohesion):** Fluid cohesion via fusion/gene flow makes distinct lineages fuzzy. Hard to apply.

  ### The Core Conflict & Your Biosphere's Gift
  **The honest answer:** Your brilliantly designed alien biosphere makes it **impossible to satisfy all non-negotiable requirements (Operationality, Consistency, Discontinuity Identification) *and* the key stakeholder demands (Stability, Predictive Power, Field Applicability) simultaneously.** The continuous hybrid swarm, rampant horizontal gene transfer, fusion across body plans, and phenotypic switching create inherent contradictions. Any concept chosen will be a **pragmatic compromise favoring one stakeholder or biological perspective over others**, inherently flawed and ripe for narrative conflict. This *is* the scene: the negotiation over which flaws are acceptable.

  \answer{Stability over litigation timescales | No}
