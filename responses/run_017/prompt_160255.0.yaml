  For Adele's position, I'll emphasize how public space communicates current community values. Her core argument should be that by maintaining the statue, the city continues to honor Kell's actions, regardless of original intent. She'd likely argue that the coercive nature of the street name is particularly problematic since residents must use it constantly.

