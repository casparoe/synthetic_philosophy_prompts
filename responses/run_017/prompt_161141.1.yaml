     (b) Substantive and defensible.
     (c) Role type: Spec-role (the standard is fixed and independent).
     (d) Supports: Both arguments (if they assume the duties are fixed and morally mandated).

  3. **Reading 3: Practice-Constituted Standard**
     (a) Thesis: The duties and permissions of a role are not fixed but emerge and are sustained by the ongoing, harmonious interactions among role occupants.
     (b) Substantive and defensible.
     (c) Role type: Enact-role.
     (d) Supports: Neither argument (because both arguments assume fixed duties and clear boundaries, which this reading rejects).

  4. **Reading 4: Exclusive Role Occupancy**
