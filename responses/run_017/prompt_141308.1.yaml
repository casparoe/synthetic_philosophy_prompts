prompt: |-
  hey — practical problem that turned into a conceptual one. I'm building a dataset where every party that cleared 2% in about 45 countries, 1945 to now, has to get coded onto a left–right scale (or flagged as uncodable), and before I freeze the codebook I want the spec instead of another round of people arguing about who is really on which side. So: what does an account of the left–right distinction have to deliver to be good enough for that job?

  Ground rules: no reading lists, no citations, no "so-and-so argues" — I can't look anything up and I don't need the bibliography. I want the requirements, each one with the case or consideration that makes it a requirement, and I'll hand you the candidate accounts at the bottom so the scoring is easy.

  The cases I keep getting stuck on (names changed, they're invented composites, don't try to place them):

  - A party that wants to break up the big tech firms and massively expand public healthcare, is tightly tied to the unions, and also wants a hard line on immigration, a national curriculum with mandatory religious instruction, and much less power for the central government.
  - A protest movement of small farmers and anti-corruption types that insists it is "neither left nor right, just forward," and that every single commentator immediately places on one side anyway.
  - A post-Soviet case where the party everyone locally calls left is socially conservative, nationalist and fiscally austere, while the party called right is culturally liberal and wants to keep the pension system exactly as it is.
  - A party whose manifesto is basically unchanged for thirty years but which slides from far left to center-left because the whole country moved around it.

  Things I want the list to settle. Does the theory have to supply a fixed substantive content, or is it allowed to be relational — roughly, left = the side pressing against the local status quo, or the side of the people who are outside — and if it goes relational, what do I lose (cross-time and cross-country comparability?) and what does it buy me on the cases above. Which distinctions it is not allowed to collapse: the label versus the bundle of policies that happens to travel with it; left/right versus authoritarian/libertarian, if that really is a separate axis; which side a party is on versus how far out it is; self-description versus coded position; the axis as it shows up in ordinary people placing themselves on it versus in what parties actually do in parliament. Whether the theory has to explain the thing people call the horseshoe — the extremes resembling each other — or is permitted to say that resemblance is an artifact of something else. Whether it has to predict anything, and what: coalition formation? which policies get enacted? who ends up hating whom?

  Also: what would have to be true for us to conclude the distinction has broken down and I should just drop the scale from the codebook, and what kind of evidence would settle that question. Whether "two undergrads who know nothing about the country can apply it and agree" is a genuine requirement or a methodological contamination of the concept. Whether even-handedness is a real desideratum or a prejudice of people who want to sound respectable — I mean, does a decent theory have to avoid making one side look irrational or straightforwardly more wrong about the facts, or can it say the axis tracks something like willingness to override inherited arrangements, which might leave one side better calibrated on some questions. Mark each requirement non-negotiable-for-my-purpose or camp preference. Tell me which pair you suspect can't be jointly satisfied — that's the part I most want. And tell me which single requirement knocks out the most accounts people actually hold.

  The candidates floating around my head, score them in a few lines each at the end if you feel like it: (1) it's basically about equality — the left wants fewer or more-justified inequalities, the right accepts or defends some; (2) it's about inherited institutions and tradition versus emancipation from them; (3) it's about how wide the circle of "us" is; (4) purely positional — left is just whichever faction is pushing in the direction local reformers have been pushing; (5) it's two dimensions, economic and cultural, that correlate often enough that everyone mistakes them for one. The list is what I need though, not the scorecard.
reasoning: |-
  Okay, the user is working on building a dataset for political parties across 45 countries from 1945 to now. They need to code each party that cleared 2% on a left-right scale or flag them as uncodable. They're stuck on some tricky cases and want a set of requirements for what makes a good left-right distinction theory that can handle these cases without endless debates.

  First, I need to understand the core problem. The user wants a conceptual framework that's practical enough to apply consistently across different countries and time periods. The tricky cases they mentioned involve parties that don't fit neatly into traditional left-right categories—like a party that's economically left but socially conservative, or movements that reject the left-right label but get placed anyway.

  Looking at their list of requirements, they need clarity on several key issues. First, whether the theory should be substantive (fixed content) or relational (based on local context). Relational approaches might handle cases like the party that stayed the same while the political landscape shifted around it, but could sacrifice cross-country comparability. Then there's the distinction between labels and actual policies, which is crucial for cases like the "neither left nor right" protest movement that commentators place anyway.

  The user also wants to know which distinctions must be maintained. For instance, authoritarian vs. libertarian shouldn't be collapsed into left-right if it's a separate dimension. The parties' self-description versus their actual positions matters too, especially in cases like the post-Soviet parties where local labels don't match typical left-right characteristics.

  Another point is whether the theory needs to explain the horseshoe effect (extremes resembling each other). If the theory can't account for that, it might need to dismiss it as an artifact, which could be a weakness. They also question if the theory must predict outcomes like coalition formation, which adds practical utility but might be asking too much of a conceptual framework.

  The user also asks what evidence would show the left-right distinction has broken down. If parties in multiple countries consistently adopt mixed positions or reject the labels, that might signal it's no longer useful. But how many exceptions are too many? They also question if inter-coder reliability (like two undergrads agreeing) is essential or just a methodological convenience. For a dataset, consistency is probably non-negotiable, even if the concept itself is complex.

  Even-handedness is another concern. Should the theory avoid making one side look irrational? Or can it acknowledge that one side might be more willing to challenge traditions, affecting their factual accuracy? For a dataset, neutrality is key to avoid bias.

  Now, assessing the candidate theories. The equality-based theory (1) is intuitive but struggles with the first case (pro-union but anti-immigration). The emancipation theory (2) handles the post-Soviet case better by focusing on tradition vs. change. The "circle of us" theory (3) might conflate social issues with economic left-right. Positional theory (4) is relational, solving the sliding party issue but losing cross-context comparability. The two-dimensional theory (5) addresses the authoritarian-libertarian split but might complicate the scale.

  The biggest challenge is balancing cross-context comparability with the flexibility to handle local variations. Theories that are too rigid fail with exceptional cases, while relational ones can't compare across time or space. Also, maintaining the policy bundle distinction is crucial but often overlooked in common theories.

  The user's deeper need seems to be a reliable, applicable framework that minimizes subjective debates, ensuring their dataset is credible and useful for analysis. They need clear criteria to decide when a party is uncodable, avoiding forcing ambiguous cases into categories. The requirements should prioritize practicality for coding while capturing the essence of left-right distinctions across diverse contexts.
answer: |-
  Here’s a requirements list for a left-right theory fit for your dataset coding, grounded in your cases and constraints. Each requirement includes its rationale and classification (**non-negotiable** or **preference**). Candidates are scored at the end.

  ---

  ### **Core Requirements (Non-Negotiable)**
  1. **Distinguish policies from labels**  
     *Why*: Your "neither left nor right" protest movement may *claim* neutrality but enact policies aligning with one side. A theory must code based on observable policies/actions, not self-identification.  
     *Case*: The protest movement’s policies (e.g., anti-corruption + pro-small farmer subsidies) likely place it left or right regardless of rhetoric.

  2. **Separate economic and cultural axes**  
     *Why*: Collapsing them fails your first case (pro-union + anti-immigration) and post-Soviet case (nationalist "left" vs. liberal "right"). The theory must allow orthogonal coding or explicitly define how dimensions interact.  
     *Case*: The socially conservative/anti-immigration but pro-welfare party is economically left, culturally right.

  3. **Handle relational shifts over time**  
     *Why*: Your sliding party (fixed manifesto, shifting placement) requires a theory accounting for changing *context*. A purely substantive definition (e.g., "left always = nationalization") fails here.  
     *Case*: A 1970s party supporting mild market reforms could be center-left; by 2020, identical policies may be center-right if the Overton window shifted left.

  4. **Define "uncodable" thresholds clearly**  
     *Why*: Ambiguity (e.g., parties with contradictory policies) must be flaggable. The theory must specify when a party’s positions are too incoherent/mixed to code.  
     *Case*: If a party’s economic platform is hard-left but cultural platform hard-right with no consistent worldview, it may be uncodable on a single axis.

  5. **Prioritize policy/behavior over voter perception**  
     *Why*: Voters may misplace parties; your dataset needs objective coding. The theory must anchor to party manifestos, voting records, or elite statements.  
     *Case*: A party called "left" locally due to historical ties (post-Soviet case) but with right-wing policies must be coded by policies.

  ---

  ### **Strong Preferences (Near-Negotiable)**
  6. **Avoid requiring prediction of coalitions/hatred**  
     *Why*: Predictive power is desirable but not essential for *coding*. Focus on descriptive accuracy.  
     *Case*: Two economically left parties may refuse to coalition for cultural reasons; this shouldn’t invalidate their left coding.

  7. **Reject horseshoe theory as essential**  
     *Why*: "Extremes resembling each other" is often situational (e.g., shared anti-elitism). A theory shouldn’t be forced to explain it—it can be an artifact of other factors (e.g., populism).  
     *Case*: Far-left and far-right may both use extra-parliamentary tactics, but their core goals differ.

  8. **Accept uneven calibration as possible**  
     *Why*: Even-handedness is methodological, not conceptual. The axis *can* track traits like "challenging vs. conserving tradition," which may correlate with factual accuracy on some issues.  
     *Case*: If the right defends inherited property laws ignoring inequality data, the theory needn’t pretend both sides are equally "rational."

  ---

  ### **Methodological Constraints (Non-Negotiable)**
  9. **Enable inter-coder reliability**  
     *Why*: If two undergrads can’t apply it with high agreement, your dataset loses credibility. Rules must be operationalizable, not require niche expertise.  
     *Case*: Coders must discern a party’s stance on "equality" without knowing local political folklore.

  10. **Allow cross-country/time comparability**  
      *Why*: The core purpose of your scale. Relational definitions ("left = anti-status-quo") sacrifice this; substantive definitions ("left = pro-redistribution") preserve it.  
      *Trade-off*: Relational handles sliding parties (#4) but risks making Swedish "left" and Bolivian "left" incomparable. **Substantive anchor required**.

  ---

  ### **Breakdown Conditions & Evidence**
  - **When to drop the scale**:  
    If >20% of major parties (post-1990) are uncodable due to inconsistent policies *or* if left/right placements fail to predict voting blocs/coalitions in >30% of legislatures.  
  - **Evidence**:  
    Statistical analysis of voting patterns (e.g., left-coded parties rarely vote together) or rise of "valence" parties (dominant on non-ideological issues like anti-corruption).

  ---

  ### **Candidate Theories Scored**  
  *(Scale: ★ = Fails requirement, ✓ = Meets, ~ = Partial)*  

  | Requirement               | (1) Equality | (2) Emancipation vs. Tradition | (3) "Circle of Us" | (4) Positional        | (5) Two-Dimensional          |
  |---------------------------|--------------|--------------------------------|--------------------|-----------------------|------------------------------|
  | 1. Policies > labels      | ✓            | ✓                              | ✓                  | ✓                     | ✓                            |
  | 2. Separate econ/culture  | ★ (Collapses)| ~ (Tradition spans both)       | ★ (Conflates)      | ★ (Ignores axes)      | ✓                            |
  | 3. Relational shifts      | ★            | ✓                              | ★                  | ✓                     | ~ (If dimensions shift)      |
  | 4. Clear uncodable rule   | ~            | ~                              | ~                  | ~                     | ✓ (Uncodable if orthogonal)  |
  | 5. Policy > perception    | ✓            | ✓                              | ✓                  | ✓                     | ✓                            |
  | 9. Inter-coder reliability| ~ (Vague)    | ~ (Subjective)                 | ★ (Too abstract)   | ✓                     | ✓ (Clear dimensions)         |
  | 10. Cross-context compar. | ✓            | ✓                              | ★                  | ★ (Localized)         | ✓ (If dimensions fixed)      |
  | **Verdict**               | Fails #2, #3 | Best on #3, #10; weak on #2, #9 | Fails #2, #3, #10  | Fails #2, #10         | **Best fit**: Meets most non-negotiables |

  **Best candidate**: **(5) Two-dimensional** (economic left-right + cultural libertarian-authoritarian).  
  **Runner-up**: **(2) Emancipation vs. Tradition** if economic/cultural dimensions are explicitly split.  

  **Key trade-off**: No theory aces #10 (comparability) and #3 (relational shifts). **Two-dimensional** comes closest by fixing dimension definitions (e.g., "economic left = pro-state intervention") but allowing positions to shift contextually within those frames.  

  **Most violated requirement**: #2 (separating economic/cultural axes) eliminates most popular mono-dimensional theories (1,3,4).
