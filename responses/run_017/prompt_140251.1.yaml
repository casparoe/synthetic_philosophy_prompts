answer: |-
  ### Setup and purpose
  The theory must define when compromise between parties with conflicting terminal values constitutes a genuine Pareto improvement *by each party's own evaluative standards*, absent any shared cardinal currency or permissible side payments. It must distinguish this from mere stability (modus vivendi), capitulation, or correct refusal to compromise. Crucially, it must output determinate recommendations for resource allocation or policy stances in scenarios like a nonprofit board split between animal welfare and global health advocates, where endorsing the "wrong" action imposes an integrity cost. The goal is a predictive and prescriptive account of moral gains-from-trade under value pluralism and integrity constraints.

  ### The Requirements

  | Requirement                                      | Motivating Case/Consideration                                                                                                 | Status              |
  | :----------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------- | :------------------ |
  | **Distinguish Genuine Joint Improvement from Modus Vivendi** | Modus vivendi is stable but not mutually beneficial; parties merely tolerate, not prefer, the outcome (e.g., uneasy ceasefire). Genuine improvement requires each to see it as net-positive *by their own values*. | Non-negotiable      |
  | **Distinguish Genuine Improvement from Epistemic Hedging** | Hedging arises when parties are uncertain which value system is "true" (e.g., splitting budget 50/50 because truth is unknown). Gains-from-trade must persist even when both sides *know* their values conflict irreconcilably. | Non-negotiable      |
  | **Model Non-Trivial Integrity Tax**              | Authorizing an action one deems morally wrong imposes a cost beyond the outcome's direct disvalue (e.g., animal faction bearing cost for funding disease research using animals). Must capture if this tax can coexist with net gains or inevitably negates them. | Preference (User)   |
  | **No Interpersonal Comparison / Shared Cardinalization** | The core problem: no agreed metric (like money) to trade "utils" between welfare-dollars and health-lives. Theory cannot assume convertibility exists. | Non-negotiable      |
  | **Determinate Output**                           | Must recommend specific allocations/policies (e.g., "60% health, 40% welfare with stance X on issue Y"), not just assert gains are possible. Needed for practical guidance. | Non-negotiable      |
  | **Specify Source of Gains**                      | To avoid handwaving: Does gain arise from diminishing returns (e.g., first $1M in health saves many lives, next $1M saves fewer) enabling compromise on *scale*? Or from differing intensities across *issues* (e.g., health cares intensely about vaccines, welfare about factory farms) enabling log-rolling/turn-taking? Theory should predict the mechanism. | Preference (User)   |
  | **Robustness to Strategic Misrepresentation**    | If gains vanish when parties exaggerate issue intensities (knowing others might too), the mechanism is fragile. Must address if true vulnerability exists or if mechanisms exist to mitigate it (without side payments). | Non-negotiable      |
  | **Exclude Capitulation/Refusal as "Gains"**      | A compromise isn't genuine if one side is bullied into submission ("capitulation") or if refusing all compromise is truly best for all ("correct refusal"). Theory must exclude these. | Non-negotiable (Implied) |

  ### Collisions
  The subset **No Common Currency**, **Determinacy**, **Robustness to Misrepresentation**, and a **Non-Trivial Integrity Tax** is likely unsatisfiable. **Determinacy** without a common currency pushes towards quantitative models requiring cardinal comparability *somewhere* (e.g., within-party intensities), conflicting with strict **No Common Currency** if intensities are used interpersonally. **Robustness** demands incentive-compatible mechanisms, often requiring verifiable cardinal preferences – difficult without shared metrics and exacerbated if misrepresentation is easy. A **Non-Trivial Integrity Tax** acts as a friction, potentially negating the marginal gains identified through trade, especially if the tax scales with the "wrongness" authorized. Satisfying all four simultaneously appears impossible; relaxing any one (e.g., allowing weak cardinal comparability, accepting some determinacy loss, assuming honesty, or trivializing integrity costs) makes the problem tractable.

  ### The Load-Bearing Requirement
  **Determinacy without Common Currency** excludes the most candidates. Dropping it allows theories that merely *assert* potential gains exist (e.g., vague appeals to "mutual respect" or "procedural fairness") without specifying *what* to do, rendering them useless for the board’s budget problem. It also excludes purely axiomatic approaches (e.g., "any Pareto improvement is valid") that lack concrete allocation rules. Crucially, it forces engagement with the hardest part: how to generate specific recommendations from purely ordinal or intra-cardinal preferences across incommensurable domains. Theories that sidestep this are obviously inadequate for the practical task.

  ### Scorecard
  *   **Splitting the Difference (Per Dimension):** Fails *Distinguish from Hedging* (often conflated), struggles with *Source of Gains* (assumes convexity/diminishing returns), vulnerable to *Misrepresentation* (exaggerate intensity to shift midpoint), silent on *Integrity Tax*. May violate *No Common Currency* if "difference" implies measurability.
  *   **Log-Rolling/Turn-Taking (Across Dimensions):** Better on *Source of Gains* (leverages differing intensities) and potentially *Robustness* (if preferences on conceded issues are verifiable). Struggles with *Integrity Tax* (authorizing intrinsically wrong policies may be costly), *Determinacy* without common currency (how to quantify "intensity" for trade rates?), and *Distinguish from Modus Vivendi* if trades feel transactional.
  *   **Jurisdictional Separation (Issue Partitioning):** Avoids *Integrity Tax* (only authorize what you value) and *Misrepresentation* (no need to trade intensities). Fails *Distinguish Genuine Improvement* (no mutual gain, just non-interference), offers no *Determinacy* for shared unavoidable issues (the core problem), and may not create *Gains* at all if resources are pooled.
