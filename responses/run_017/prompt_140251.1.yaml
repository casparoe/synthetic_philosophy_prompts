  For the "Scorecard," I'll briefly assess three approaches: splitting the difference might fail on multiple dimensions; log-rolling/turn-taking could work if intensities differ but struggles with integrity tax; jurisdictional separation avoids compromise but may not create gains. This highlights where each falls short without detailed scoring.

