  The user's deeper needs seem to be about creating a rigorous framework for moral compromise that avoids biases from specific cases. They want to stress-test their own taxonomy of gains (diminishing returns vs. log-rolling) and understand theoretical limits. The unspoken challenge is whether such a theory can exist without compromising on key principles like integrity or determinacy.

  For the structure, I'll start with "Setup and Purpose" to clarify the problem. The theory must define when a compromise is a Pareto improvement by each party's own values, not just a truce. Then, in "The Requirements," I'll organize their points into a table with each requirement, motivation, and status. Non-negotiables include no common currency, determinacy, and distinguishing genuine improvements. Preferences might include sources of gains and integrity tax details.

