  - The **skeptic** view is not represented as a leaf. This is an empty box. Why? Because the tree assumes that the framework of corruption applies, while the skeptic rejects the framework. To include it, we would need to ask if the transfer is voluntary and mutually beneficial, and then have the skeptic leaf, but that would complicate the tree and is not easily observable without interpretation. It is unclaimed in this tree because the tree is designed within the corruption discourse.
