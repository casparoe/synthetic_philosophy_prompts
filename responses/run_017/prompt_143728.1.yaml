  ### Sorting Device for Gifts, Favors, and Payments to Officials  
  **A Decision Tree for Comparative Analysis**  
  *Designed for concrete cases, based on observable features. Avoids subjective questions like "Do you think culture matters?" Focuses on acts, not labels.*  

  #### Decision Tree  
  Start at the top and answer each question based on **facts of the case**, not moral judgments. Proceed down the branches.  

  1. **Did the transfer alter the outcome from what the written rules prescribe?**  
     - *Written rules*: Formal laws, regulations, or official procedures.  
     - *Altered outcome*: Result differs from what rules require (e.g., skipping a required step, favoring an unqualified person).  
       - **Yes** → Go to 2.  
       - **No** (outcome matches rules) → Go to 3.  

     *(Example: Storm gift to engineer → **No** (power restored per rules). Border post bribe → **Yes** (avoids delay rules require).*  

  2. **Would the intended outcome (per rules) be unattainable without the transfer, due to systemic failure?**  
     - *Systemic failure*: The system routinely blocks rule-compliant outcomes without transfers (e.g., delays are extreme, services are inaccessible).  
       - **Yes** → **Leaf: Second-best view** (Transfer repairs dysfunction; e.g., border post bribe if delays are crippling).  
       - **No** → **Leaf: Universalist** (Transfer subverts rules for private gain; e.g., cousin’s job if hiring bypasses merit).  

     *(Systemic failure examples: Border post if queues are months long. No failure: Hiring a relative over better candidates.)*  

  3. **Is the transfer prohibited by official rules in the jurisdiction?**  
     - *Prohibited*: Explicitly banned by law, code, or regulation (e.g., no gifts to officials).  
       - **Yes** → Go to 4.  
       - **No** → Go to 5.  

     *(Example: Storm gift in Norway → **Yes** (illegal). Storm gift in Kerala → **Depends on local law**.)*  

  4. **Is the transfer a customary, socially expected practice in the context?**  
     - *Customary*: Widely practiced and accepted locally (e.g., routine gifts for services).  
       - **Yes** → **Leaf: Social-norms view** (Moral status depends on local norms; e.g., storm gift if culturally routine).  
       - **No** → **Leaf: Universalist** (Breaks rules and lacks social justification; e.g., envelope to surgeon if rare and extortionate).  

  5. **Is the transfer a non-reciprocal expression of gratitude or social obligation?**  
     - *Non-reciprocal*: No expectation of future favors (e.g., gift after service is rendered).  
       - **Yes** → **Leaf: Relativist / Social-norms view** (Collapsed: "How we do things here"; e.g., storm gift if not prohibited).  
       - **No** → **Leaf: Universalist** (Creates obligation; e.g., mining company building a school if it secures a license).  

  #### Key to Positions  
  - **Universalist**: Using a position of trust for private advantage (NGO standard).  
  - **Relativist / Social-norms view**: Collapsed into one leaf (see below).  
  - **Second-best view**: Transfer fixes a broken system.  
  - *(Skeptic not included; see "Empty Boxes" section.)*  

  ---

  #### What Was Discarded (and Why)  
  From brainstorming, axes considered then omitted:  
  - **Intent of giver** (e.g., gratitude vs. bribe): Discarded. Too subjective; hard to observe.  
  - **Scale of transfer** (e.g., week’s wages vs. millions): Discarded. Context-dependent (e.g., "small" is relative); not decisive on its own.  
  - **Timing** (e.g., before/after service): Discarded. Correlates with outcome alteration, but less reliably than Q1.  
  - **Transparency** (e.g., open vs. secret): Discarded. Ambiguous (e.g., some cultures accept open bribes); covered by custom (Q4).  
  - **Voluntariness** (e.g., coerced vs. willing): Discarded. Coercion implies altered outcome (handled in Q1).  
  - **Harm caused**: Discarded. Subjective and post-hoc; outcome alteration (Q1) is a clearer proxy.  

  #### Empty Boxes and Indistinguishable Leaves  
  - **Empty Box: Skeptic view** ("Corruption is a pejorative for disfavored exchanges").  
    - *Why?* The tree assumes transfers *can* be evaluated within a framework. The skeptic rejects this, arguing all voluntary exchanges are neutral. But no leaf captures this because:  
      - It’s incoherent in a decision tree (the skeptic denies the categories).  
      - Unattractive for policy (ignores power imbalances).  
    - *Result:* Skeptic isn’t a leaf. It’s a meta-critique of the tree itself.  

  - **Indistinguishable Leaves: Relativist vs. Social-norms view**.  
    - Collapsed at Q5 ("Relativist / Social-norms view").  
    - *Why?* In all your cases (e.g., storm gift, land payment), they yield identical judgments:  
      - Relativist: "It’s just how we do things here."  
      - Social-norms: "Act is gray/nothing if local norms permit."  
    - No factual difference emerges—both rely on local acceptance.  

  #### How Your Cases Sort  
  | Case                          | Path                          | Leaf                     |  
  |-------------------------------|-------------------------------|--------------------------|  
  | **Storm gift** (engineer)     | Q1: No → Q3: ? → Q5: Yes      | Relativist / Social-norms|  
  | **Cousin’s job** (nepotism)   | Q1: Yes → Q2: No              | Universalist             |  
  | **Border post bribe**         | Q1: Yes → Q2: Yes/No          | Second-best or Universalist|  
  | **Envelope to surgeon**       | Q1: No → Q3: Yes → Q4: Yes/No | Social-norms or Universalist|  
  | **Mining company school**     | Q1: Yes → Q2: Yes/No          | Second-best or Universalist|  
  | **Land payment to headman**   | Q1: No → Q3: ? → Q5: No       | Universalist             |  

  *Note:* Answers depend on context (e.g., systemic failure in Q2). The tree forces clarity on *why* cases differ.  

  ---

  **Design Notes**  
  - **Your axis (outcome vs. rules)** is root (Q1). Priya’s engineer (no alteration) and your border post (alteration) split here.  
  - **One-page focus**: Tree uses 5 questions, handles all cases.  
  - **Bring to your group**: Test with new cases. Does it resolve circular debates by exposing premises?
