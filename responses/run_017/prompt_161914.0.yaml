prompt: |-
  I write the wall texts and the audio guide at a mid-sized municipal gallery — started last September, six shows a year, about a fortnight per show to get from a loan list to print-ready, with the director signing off at the end and the learning team wanting their own versions for schools groups. I did a ten-week evening course in aesthetics last spring and got into a long argument with a mate who's writing a PhD on it: she reckons you can't come to a justified aesthetic judgement about a work you haven't experienced first-hand — she called it the aquaintance principle, I think, and said something Kant-ish backs it up — and I said that can't be right, because basically my entire job is telling people things about objects they're standing in front of but haven't actually looked at yet. I've also started noticing my own bad habits: I open with critics have called this one of the great paintings of the decade, I tell visitors they'll find this devastating, and last month someone emailed to complain that our texts do the feeling for you.

  So: can you turn that debate into an actual procedure? I want something I can run per object in the twenty minutes I actually have before the director sees it, for both formats — 90 words of wall text, roughly 200 words of audio per stop. It should sort the sentences I write into kinds — ones that direct attention, ones that give non-aesthetic background like materials or what the artist was responding to, ones that report someone else's verdict, ones that predict what the visitor will feel — and then give a rule for each kind about when it's allowed, what counts as a sufficient answer, and where it stops with a no. I've been using a rough two-key rule of my own, no evaluative claim without a paired instruction to look at something the visitor can check for themselves, and I'd like you to keep it if it survives and tell me honestly if it doesn't.

  Hard cases I need it to handle: a fresco destroyed in a fire that we're showing as documentation, so nobody alive can experience the thing itself; our audio description for blind and partially sighted visitors, which is testimony given to people who can't have the visual experience at all; the marketing team's poster line, if you loved the Hockney you'll love this, which is testimony about taste-matching rather than about the work; a catalogue essay by a scholar who has written about the painting for years but never seen it in the flesh; the learning team wanting a content note saying this work is disturbing; and verdicts where the critics definately disagree. Then run the whole thing on three objects — the embroidered textile piece I want to call exquisite, the destroyed fresco, and the poster line — and include at least one case where the procedure gives me an answer I won't like. Mark clearly the points where it has to hand the decision back to a person because it's a values call rather than a facts call, and say what the procedure can't do at all.
reasoning: |-
  Okay, the user works at a municipal gallery writing wall texts and audio guides. They're juggling tight deadlines—about two weeks per show—and need a practical procedure to handle aesthetic judgments ethically. Their core conflict stems from a debate with a PhD friend about the acquaintance principle (you can't judge art without direct experience), which clashes with their job of interpreting art for visitors who haven't yet engaged with the work. 

  They've noticed their own problematic habits: using hyperbolic claims ("this is devastating") or outsourcing emotional responses, which sparked a complaint about texts "doing the feeling for you." Their existing two-key rule (pair evaluative claims with concrete visual instructions) seems like a good starting point, but they need it formalized into a scalable workflow. 

  The hard cases they mention reveal nuanced layers: the destroyed fresco (no firsthand experience possible), audio descriptions for blind visitors (relying on testimony), marketing taste-matching ("if you loved Hockney..."), scholarly essays about unseen works, content warnings, and disputed critical opinions. These test the procedure's boundaries. 

  Their deeper need isn't just taxonomy—it's about authority and humility. They want to balance expertise with visitor autonomy, avoiding prescriptive language while still guiding interpretation. The time constraint (20 mins per object) means the procedure must be efficient, not academic. 

  I'll structure the procedure around sentence types they identified (attention-directing, background, reported verdicts, predictive claims), with clear rules per category. The two-key rule survives but gets refined: evaluative claims must always tether to observable features. For impossible cases like the fresco, we'll shift to historical/testimonial framing. 

  Key pain points to address: 
  - Their dislike of "content notes" as evaluative overreach (procedure will treat them as factual hazard alerts) 
  - Marketing's taste-matching (allowed only if framed as institutional opinion, not universal truth) 
  - The "exquisite" textile claim (permissible if paired with stitch/detail observations) 

  Will flag where the procedure requires human judgment (e.g., deciding what counts as "sufficient evidence" for critical claims) and its limits (can't resolve aesthetic disputes, only report them neutrally). The three test cases will prove it handles both comfortable and uncomfortable outputs.
answer: |-
  Here's a procedural framework based on your debate, designed for speed (within 20 mins/object) and covering both wall text (90w) and audio (200w). It incorporates your "two-key rule" and tackles your hard cases.

  **The Core Procedure: Sentence Sorting & Rules**

  1.  **Categorize Each Sentence:** As you draft, tag each sentence as one of these types:
      *   **AD (Attention Director):** Points to specific, observable features (e.g., "Notice the dense cross-hatching in the lower left," "Observe the contrast between the vibrant foreground and muted background").
      *   **BG (Background):** Provides factual, non-aesthetic context (e.g., "Painted in 1922," "Oil on canvas," "Created in response to the artist's experience in...", "Depicts Saint Jerome").
      *   **RV (Reported Verdict):** Attributes an aesthetic judgment *to a specific source* (e.g., "Critic X described this as 'a masterpiece of tension'," "The artist stated she aimed for 'a sense of overwhelming serenity'").
      *   **PV (Predictive Verdict):** States what the visitor *will* or *should* feel/think (e.g., "You'll find this composition unsettling," "This evokes a profound sense of loss," "Viewers often report feeling energized").
      *   **EV (Evaluative Claim):** States an aesthetic judgment *as fact* (implied or explicit) *without attribution* (e.g., "This is an exquisite work," "The brushwork is masterful," "The scene is deeply moving").

  2.  **Rules for Each Sentence Type:**

      | **Type** | **Allowed?**                                                                 | **Sufficient Answer / Requirement**                                                                                                                                 | **Stops With A "No" If...**                                                                                              |
      | :------- | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------ |
      | **AD**   | **Always Yes** (Essential)                                                   | Clearly points to a *specific, observable* element within the work/documentation. Avoids interpretation ("see the red shape" not "see the angry red shape").         | It describes something not present/visible *in the current presentation* (e.g., texture in a low-res repro).              |
      | **BG**   | **Always Yes** (Essential)                                                   | Factually accurate, verifiable (dates, materials, historical context, artist's stated intent *if documented*). Sourced if obscure.                                  | Information is speculative, unverified, or irrelevant to immediate engagement.                                            |
      | **RV**   | **Conditional Yes** (Use sparingly)                                          | Source is **named** and **relevant** (critic, artist, historian). Verdict is **clearly attributed** ("X argues..."). Significance of source is implied or stated. | Source is vague ("critics say"), insignificant, or the verdict overshadows the work itself. *Avoid in wall text if space is critical.* |
      | **PV**   | **Generally No** (High Risk)                                                 | *Extremely Rare Exception:* Only if based on **widely documented, overwhelming audience response** *and* framed carefully ("Many first-time viewers report..."). **Never** "you will". | Almost always. Especially phrases like "you will feel," "this is devastating," "viewers should sense."                   |
      | **EV**   | **Conditional Yes** (Use cautiously) - **Your "Two-Key Rule" Applies Here** | **Must be paired immediately with a specific AD sentence.** The evaluation *must directly arise* from the observable feature just pointed to. ("Notice the intricate gold stitching (AD). This craftsmanship is exquisite (EV).") | Unpaired ("This painting is magnificent"). Paired but the link is weak/illogical. Subjective interpretation presented as fact. |

  **Handling Your Hard Cases (Applying the Rules)**

  1.  **Destroyed Fresco (Documentation Only):**
      *   **Problem:** No one can experience the original. Acquaintance Principle seems violated.
      *   **Solution:** **Shift focus heavily to BG and RV.** Describe *what the documentation shows* (AD: "The photograph reveals a central figure surrounded by..."). Use BG for history, significance, loss. Use RV extensively for historical accounts, artist statements, contemporary criticism. **EVs are highly restricted:** Only paired with observable features *in the documentation* itself ("The grainy photograph suggests [AD feature], hinting at the fresco's reported grandeur [EV, weak but permissible via documentation-as-object]"). *Avoid* claims about the fresco's *current* aesthetic impact.
      *   **Output Focus:** History, significance, loss, *reported* experience. "This documentation captures... Contemporary accounts described its vibrant colors... Its destruction in 1923 was a significant loss to..."

  2.  **Audio Description for Blind/Partially Sighted Visitors:**
      *   **Problem:** No visual experience possible.
      *   **Solution:** **This is primarily AD.** Describe observable features meticulously, factually, spatially. **BG** is crucial for context. **RV** can be used carefully ("The artist described wanting to evoke a sense of X through texture"). **PV is absolutely forbidden.** **EV is highly problematic:** Your "two-key rule" fails if the key (AD) doesn't lead to a visual experience the listener can verify. *Focus on enabling their own interpretation through rich description.* "The sculpture's surface is deeply pitted and rough to the touch near the base (AD), rising to a smooth, cool, curved peak (AD). The artist worked primarily in bronze during this period (BG)."

  3.  **Marketing Poster Line ("If you loved Hockney, you'll love this"):**
      *   **Problem:** Taste-matching, predictive, not about the specific work's qualities.
      *   **Solution:** **This is PV (Predictive Verdict) - Generally No.** It's not about the work's inherent qualities but a guess about audience preference. *The procedure flags it as invalid for gallery text/audio.* It belongs purely in marketing. If *absolutely* forced to reference it internally? Frame as institutional stance (**RV**: "The gallery positions this exhibition as appealing to fans of modern British painting, like David Hockney") – but it's weak RV.

  4.  **Scholar's Catalogue Essay (Never seen original):**
      *   **Problem:** Scholar lacks firsthand experience.
      *   **Solution:** **Treat as RV (Reported Verdict).** The scholar is the named source. The procedure *allows* reporting their judgment ("Scholar Y, in her extensive analysis based on reproductions and archives, argues the work demonstrates Z..."). **Crucially:** The text *must* transparently state (or heavily imply within context) they haven't seen the original if relevant to their argument (e.g., discussing color fidelity). Their expertise *is* the relevance/significance.

  5.  **Learning Team Content Note ("This work is disturbing"):**
      *   **Problem:** Evaluative/Predictive?
      *   **Solution:** **Frame as BG (Background Fact).** Treat it as a factual statement about common reactions or content, *not* an aesthetic judgment or prediction. "This work depicts [factual description of potentially disturbing content, e.g., graphic violence, traumatic themes]. Viewer discretion is advised." *This is a **values call**.* The procedure can't define "disturbing." The *decision* to include a note is institutional. The *wording* should be factual/BG, avoiding PV/EV.

  6.  **Critics Disagree:**
      *   **Problem:** Conflicting verdicts.
      *   **Solution:** **Use RV effectively.** Present the disagreement: "While Critic A hailed this as a breakthrough, Critic B found it derivative." This is informative BG/RV. **DO NOT** try to resolve it with an EV or PV. The disagreement *is* part of the work's story (BG). *Highlighting disagreement often strengthens engagement by showing art is alive to interpretation.*

  **Testing the Procedure on Three Objects**

  1.  **The "Exquisite" Embroidered Textile:**
      *   **Draft EV:** "This textile is an exquisite example of craftsmanship."
      *   **Procedure Check:** EV flagged! Needs paired AD.
      *   **Action:** Add AD: "Observe the thousands of minute, perfectly uniform stitches forming the floral border." (Points to specific, observable feature).
      *   **Revised Sentence:** "Observe the thousands of minute, perfectly uniform stitches forming the floral border (AD). This meticulous craftsmanship is exquisite (EV)." **ALLOWED.** (Two-key rule satisfied).
      *   **Alternative Safer:** "The thousands of minute, perfectly uniform stitches forming the floral border (AD) demonstrate exceptional technical skill (BG/Descriptive Fact)." (Avoids EV).

  2.  **The Destroyed Fresco (Documentation):**
      *   **Draft EV:** "This was one of the most breathtaking frescoes of its era."
      *   **Procedure Check:** EV flagged! Needs paired AD based on *documentation*. "Breathtaking" is too strong an EV given the mediation.
      *   **Action:** Downgrade to RV & strengthen AD/BG.
      *   **Revised:** "This 18th-century photograph documents the lost 'Ascension' fresco (BG). The central figure's dynamic pose remains visible (AD). Contemporary accounts, like that of critic Luigi Rossi, consistently described its original colors and scale as breathtaking (RV)." **ALLOWED.** (EV avoided, RV used with source, AD/BG present).

  3.  **The Marketing Poster Line ("If you loved Hockney, you'll love this"):**
      *   **Draft PV:** "If you loved David Hockney's vibrant pools, you'll love the dazzling colors in this exhibition!"
      *   **Procedure Check:** **PV - NO.** Also functions as weak EV ("dazzling").
      *   **Action:** **REJECT for gallery text/audio.** This belongs solely in marketing materials. Forced institutional RV option: "This exhibition features vibrant, large-scale contemporary paintings, appealing to fans of artists like David Hockney (RV)." (Less catchy, but procedure-compliant if you *must* reference the comparison internally. You probably won't like this answer!).

  **Where the Procedure Hands Off & Its Limits**

  *   **Values Calls Handed Back:**
      *   **Deciding RV Relevance/Significance:** Is critic X important *enough* to quote? (Curator/Director).
      *   **Content Warnings:** *Whether* to warn, and *defining* what requires a warning ("disturbing," "challenging"). (Learning Team, Director, Ethics Board).
      *   **"Sufficient" Evidence for RV:** What constitutes a well-documented audience reaction for a *rare* PV exception? (Director/Research).
      *   **Interpreting Artist Intent (BG):** How much weight to give an artist statement? (Curator).
      *   **Prioritizing Info:** What BG facts are *most* crucial in 90/200 words? (Curator, Learning Team needs).
      *   **"Weak Link" in EV/AD Pair:** Is the connection between the observed feature and the evaluation strong enough? (Curator/Writer judgment).

  *   **What the Procedure CANNOT Do:**
      *   **Guarantee "Good" Writing:** It ensures ethical/argumentative structure, not elegance or clarity.
      *   **Resolve Aesthetic Disputes:** It provides rules for *reporting* them (RV), not solving them.
      *   **Define "Art" or "Quality":** It provides rules for *talking about* judgments made by others or grounded in observation.
      *   **Replace Expertise:** Sorting sentences requires understanding what constitutes BG vs EV, etc.
      *   **Handle Deliberate Provocation/Conceptual Art:** If the *point* is to challenge the Acquaintance Principle or use impossible PVs conceptually, the procedure breaks. (Flag for Director discussion!).
      *   **Account for Visitor Diversity:** It assumes a baseline ability to perceive the AD targets. Tailoring for specific needs (like the audio description) requires additional layers.

  **Conclusion:**

  This procedure systematizes your "two-key rule" and the Acquaintance Principle debate into a fast, actionable checklist. It:
  1.  **Validates AD and BG** as core, essential tools.
  2.  **Restricts EV** by requiring pairing with AD (keeping your rule).
  3.  **Controls RV** through sourcing and relevance.
  4.  **Effectively Bans PV** (the source of the "doing the feeling for you" complaint).
  5.  **Provides Strategies for Hard Cases** by shifting focus (e.g., to RV/BG for the fresco, pure AD for audio description).
  6.  **Clearly Flags Values Calls** for human decision-making.

  By forcing you to categorize each sentence and apply these rules, it promotes grounding interpretation in the observable work, respecting visitor agency, and maintaining transparency about the sources of judgments. It directly addresses the complaint by eliminating unsupported PVs and tightly coupling EVs to direct observation. While it might sometimes produce answers you dislike (like neutering the marketing line for gallery use), it ensures textual integrity aligned with the core ethical argument.
