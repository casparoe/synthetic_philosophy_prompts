answer: |-
  Here’s a dissection of your framework applied to Brexit and the Swiss initiative, with British English rigorously applied (no rogue *-ize* endings):

  ### **Brexit as an Incomplete Contract**  
  **Parties to the Contract**: The UK electorate (voters), the Crown-in-Parliament (sovereign actor), and the government (executor).  
  **The "Leave" Commitment**: A binary instruction to exit the EU, with **zero specification** on:  
  - The future relationship (single market access, customs union, regulatory alignment).  
  - The process (hard vs. soft Brexit, transition periods).  
  - Constitutional constraints (role of devolved nations, parliamentary sovereignty).  

  **Residual Control Rights & Their Exercise**:  
  1. **Government (May 2016–2019)**: Initially claimed exclusive right to interpret "Leave" (Lancaster House speech: hard Brexit). Residual rights contested via:  
     - *Miller I* (2017): Supreme Court ruled Parliament held residual rights over Article 50 triggering. **→ Parliament as co-interpreter**.  
     - The 2017 election: Framed as "ratifying May’s mandate" but produced hung parliament. **→ Weakened executive control**.  
  2. **Parliament (2017–2019)**: Seized residual rights via:  
     - Meaningful votes on Withdrawal Agreement (defeated 3×).  
     - Cooper-Letwin Act (2019): Forced May to seek extension. **→ Explicit assertion of residual control**.  
  3. **2019 Election**: Johnson reframed "Get Brexit Done" as a mandate for his specific deal. **→ Executive reclaimed residual rights via electoral victory**.  

  **Mandate-Preserving vs. Consuming**:  
  - **Consuming at Every Step**: Each decision (Article 50, backstop, trade-offs) reopened core questions: "Is *this* what Leave meant?" The 2016 result had to be constantly re-legitimised.  
  - **Counterfactual-Stability Test**:  
    - **The Deal Offered**: Johnson’s WA (Northern Ireland Protocol, non-tariff barriers, loss of frictionless trade).  
    - **Would 2016 Leavers Endorse It?** Unambiguously **no**. Key Leave campaign pledges ("exact same benefits," £350m/NHS) were undelivered. The coalition included both "clean break" and "soft Brexit" voters; neither got their preferred outcome.  

  **Value Added vs. "Ambiguity" Relabelling**:  
  - The contracting frame explains **why ambiguity persisted institutionally**: Residual rights were *unallocated* by the referendum, forcing a power struggle. "Ambiguity" alone doesn’t capture how Parliament, courts, and elections *actively redefined* the mandate. The 2019 election didn’t clarify ambiguity—it **transferred residual rights** to Johnson.  

  ---

  ### **Swiss "Against Mass Immigration" Initiative (2014): A "Complete" Contract?**  
  **The "Contract"**: Constitutional Article 121a + Transitional Clause:  
  - Requires quotas on EU immigration.  
  - Mandates renegotiation of free movement agreements.  
  - Instructs implementation within 3 years.  

  **Residual Rights Allocation**:  
  - **Federal Assembly (Parliament)**: Tasked with implementation but constrained by:  
    - **Treaty conflict**: Bilateral EU agreements (esp. Free Movement of Persons) vs. constitutional imperative.  
    - **Proportionality requirement**: Swiss constitutional law demands balanced implementation.  

  **Relocation, Not Reduction of Residual Rights**:  
  1. **Treaty Conflict**: Parliament implemented via "light touch" legislation (prioritising Swiss/EU nationals for jobs *without* quotas). **→ Residual right: Interpreting how to reconcile treaty obligations with constitutional text**.  
  2. **The "Guillotine Clause"**: Renegotiating free movement risked terminating all EU bilateral accords. Parliament’s solution (the "Cassis de Dijon principle" approach) effectively **substituted quotas with indirect measures**—arguably a reinterpretation.  
  3. **Next Initiative ("Limitation Initiative," 2020)**: Direct response to perceived dilution of 2014 result. **→ Incompleteness shifted to *enforcement* of the contract**.  

  **Counterfactual-Stability Test (Extrapolated)**:  
  - Would the 50.3% have accepted indirect measures preserving EU treaties? Likely **no**—hardliners demanded strict quotas. The 2020 initiative (rejected 62%–38%) suggests the original coalition fragmented.  

  **Completeness as Illusion**: The detailed text relocated residual rights from *defining the goal* to *implementing it within real-world constraints* (EU relations, rule of law). The core tension (popular sovereignty vs. treaty compliance) remained unresolved.  

  ---

  ### **Predictive Power & Objections**  
  **(a) Second Referendum = Renegotiation or Contract Completion?**  
  - Under your frame, it’s **renegotiation after breach**: When implementation diverges from the winning coalition’s expectations (failed counterfactual stability), a second vote offers a ratification mechanism for the *actual* terms. It completes the contract by specifying missing terms (e.g., "Leave *on these conditions*").  

  **(b) The *Vox Populi* Objection: "Not a Contract, But an Instruction"**  
  - **Objection**: Referendums are exercises of constituent power—a sovereign command requiring execution, not interpretation. Residual control rights are illegitimate; the people’s will is self-executing.  
  - **Can Your Frame Answer This?** Only by rejecting the premise. Your frame *assumes* implementation requires interpretation by agents with discretion. The *vox populi* view collapses when confronted with:  
    - **Multidimensionality**: "Leave" encompassed mutually exclusive outcomes (e.g., single market access vs. immigration control).  
    - **Institutional reality**: Constitutions require *someone* (courts, parliament) to translate binary wins into law.  
    - **Empirical evidence**: Brexit proved "the will of the people" is contested terrain.  

  **Conclusion**: Your frame excels in **tracking power struggles post-referendum** and **predicting legitimacy crises** (via counterfactual stability). It’s more than vocabulary—it’s a diagnostic for why some referendums (Swiss) cause chronic disputes and others (mandate-preserving votes, e.g., devolution) do not. But it *does* assume away the Rousseauian ideal of unambiguous popular sovereignty—which, as Brexit showed, is a feature, not a bug.  

  ---  
  **Final Note**: The Swiss case is extrapolated from public sources (Federal Council reports, EAER summaries). Corrections on cantonal procedures or legislative details are welcome.
