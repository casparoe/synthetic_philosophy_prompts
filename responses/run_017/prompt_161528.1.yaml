answer: |-
  Here's a practical decision procedure for your forum, grounded in the philosophy of assertion. I'll use the **warranted confidence norm** (assert only what you're reasonably confident in, based on evidence you possess) as the core foundation. This norm balances the strengths of the other candidates: it avoids the rigidity of the "knowledge norm" (which struggles with statistical/lottery cases) and the impracticality of the "truth norm" (which ignores the speaker's responsibility). **Stakes matter**: the bar *does* rise for high-stakes claims (e.g., health, finance, accusations) because unwarranted assertions there cause more harm. Reach *also* matters—top-level comments get stricter scrutiny than nested ones because they influence more readers. **Crucially, moderation tracks *mod-visible evidence***, not the speaker's private state. A user might satisfy the norm but lack visible support, or violate it while appearing credible—we prioritize consistent, evidence-based moderation over mind-reading.

  ### The Decision Procedure (30-60 sec checklist)
  **Step 0: Is this an assertion?**  
  *Ask: Is the user presenting a factual claim (true/false) about the world?*  
  - **No → Leave alone.** Examples:  
    - Rhetorical questions ("Who believes that?"),  
    - Jokes/sarcasm (if obvious),  
    - "Suppose P" (if part of an argument),  
    - Quoting to disagree,  
    - Links with neutral captions ("Related: [url]").  
  - **Yes → Proceed.** Examples:  
    - Direct claims ("P is true"),  
    - "Everyone knows P" (implies P is fact),  
    - "Reportedly P" (still asserts P might be true),  
    - "My understanding is P" (asserts belief in P).  
  - **Reach factor**: Apply the "nesting discount." Top-level claims get full scrutiny; nested replies get leeway (e.g., allow weaker evidence in deep threads). Why? Top-level comments shape discourse and mislead more people.  

  **Step 1: Assess stakes**  
  - **Low stakes** (e.g., pop science, speculation): Lower bar.  
  - **High stakes** (e.g., health advice, accusations, career impacts): Higher bar (demand sources/hedges).  
  - **Key test**: Could this claim, if wrong, cause real harm? If yes, stakes are high.  

  **Step 2: Check for hedging**  
  *Hedges reduce assertoric load ONLY if they convey genuine uncertainty.*  
  - **Real hedge**: Phrases like "I think P," "Probably P," or "I'd put 70% on P" must:  
    - Match the user's actual confidence (you can't verify this, but check for consistency—e.g., "I think" + extreme confidence is invalid),  
    - Be calibrated (e.g., "70%" shouldn't describe near-certain events).  
    - If valid → Reduce scrutiny; proceed to Step 3 with lower evidence demands.  
  - **Fake hedge (warrant laundering) → Ignore hedge; treat as bare assertion.** Examples:  
    - "I'm no expert, but [confident claim]",  
    - "Studies show [no citation]",  
    - "People in the field say [unsupported]".  
    *Philosophy note: Under warranted confidence, "I think P" commits you to reasonably believing P—not to knowing your credence. Fake hedges violate the norm by misrepresenting warrant.*  

  **Step 3: Evaluate warrant (mod-visible evidence)**  
  *Rank evidence from strongest to weakest. Stop at first match.*  
  1. **Public source**: Claim cites a checkable link/study. → **Leave alone** (or **Tag unverified** if source is dubious/contested).  
  2. **Track record**: User has a *visible* history of accurate, checkable claims *in this specific topic* (e.g., past correct predictions in threads). Must be:  
     - Public (logged in-thread or in a user profile),  
     - Recent (expires after ~6 months; topics evolve),  
     - Domain-specific (doesn't transfer across topics). → **Leave alone** (or **Tag unverified** for borderline cases).  
  3. **No visible warrant**: No source or track record. → **Require link** (if plausible) or **Require hedge** (if uncertain/low stakes). If high stakes or fake hedge → **Remove**.  

  **Step 4: Apply reach factor**  
  - **Top-level**: Strict. No warrant? Remove or demand source.  
  - **Nested reply**: Lenient. Allow weaker evidence (e.g., track record suffices where top-level needs a source).  

  **Output Justification** (one sentence, public):  
  - Always state the *rule*, not the topic. E.g.,  
    - "Removed: High-stakes claim lacks sourcing + no track record."  
    - "Hedge required: Unsupported assertion."  
    - "Left alone: User has established track record in this domain."  

  ### Calibration Set (8 Test Comments)
  | Comment | Context | Output | Justification |
  |---------|----------|--------|--------------|
  | "COVID vaccines cause infertility." | Top-level, no hedge, no source. | **Remove** | "High-stakes claim requires sourcing." |
  | "I think rent prices will fall next year." | Nested reply, user has economics track record. | **Leave alone** | "User's track record provides warrant." |
  | "My understanding is that cold fusion works—it's obvious!" | Top-level, fake hedge. | **Remove** | "Warrant laundering: confident claim disguised as opinion." |
  | "Reportedly, the CEO is resigning (source: internal chat)." | Top-level, no public source. | **Require link** or **Remove** if high stakes | "Unverified claim requires citation." |
  | "Suppose gravity is weaker tomorrow; would planes crash?" | Top-level, hypothetical. | **Leave alone** | "Not an assertion about current reality." |
  | "Scaling works—I'd bet $100 on it." | Top-level, new account, no source. | **Require hedge** (if low stakes) or **Remove** (if high stakes) | "Probabilistic claim lacks grounding." |
  | "Everyone knows the election was stolen." | Top-level, bare assertion. | **Remove** | "High-stakes claim requires evidence." |
  | "Per the paper: 'AI risk is overblown' (links study)." | Nested reply, source provided. | **Leave alone** | "Sourced claim." |

  ### Handling Your Three Cases
  1. **New account, top-level: "Scaling keeps working, I'd put 85% on capabilities improving sharply through 2027."**  
     - **Procedure**: Assertion? Yes (predictive claim). Stakes? Medium (forum-relevant but not urgent harm). Hedge? "85%" is a real hedge, but new account = no track record → no warrant. Reach? Top-level → strict.  
     - **Output**: **Require link** or **Require stronger hedge** (e.g., "based on X trend"). If refused, **Remove**.  
     - **Justification**: "Top-level probabilistic claim requires evidence or substantiated track record."  
     - *Philosophy note: Warranted confidence demands reasonable evidence for 85% certainty—base rates alone rarely justify it. Your mod's "ignorance" is irrelevant; no visible warrant means it fails.*

  2. **Nested reply: B says "This is well documented, X has been shown repeatedly" (to A requesting a source). B is right, but specific number wrong.**  
     - **Procedure**: Assertion? Yes. Stakes? Low (nested correction). Hedge? None (claims documentation). Warrant? No source cited → no visible warrant. Track record? If B has one in-thread, use it; else, no. Reach? Nested → lenient.  
     - **Output**: **Require link**. If B adds it → **Leave alone**. If not → **Tag unverified** or **Remove** (if B doubles down).  
     - **Justification**: "Assertion of repeated evidence requires citation when challenged."  
     - *Philosophy note: B violated warranted confidence by overclaiming ("repeatedly" when details are wrong). Mod tracks evidence, not truth—so B's correctness doesn't save it.*

  3. **Verified ML researcher: "The next model drops in March, I know people there."**  
     - **Procedure**: Assertion? Yes (specific prediction). Stakes? Medium (community interest). Hedge? None. Warrant? No public source, but user has visible track record of correct insider claims → valid warrant. Reach? If top-level, apply strictness, but track record suffices.  
     - **Output**: **Leave alone**.  
     - **Justification**: "User's established track record in this domain provides warrant."  
     - *Philosophy note: This is licensed by warranted confidence. The researcher *has* evidence (insider knowledge), and the track record makes it mod-visible. Letting this stand is the norm's strength—it rewards reliability without demanding impossible sourcing.*

  ### What This Procedure Can't Do (Failure Modes)
  1. **Systematically suppresses true but novel claims**: If a user has groundbreaking info but no track record or public source, it gets removed. Warranted confidence prioritizes reliability over truth.  
  2. **Licenses confidently wrong users**: Users with strong track records can assert false claims (if their record hasn't expired). The procedure assumes past reliability predicts future accuracy—which can fail.  
  3. **Struggles with calibration**: Fake hedges ("I think") are hard to distinguish from real ones at speed. Expect false negatives (laundered claims slip through).  
  4. **Biased against new users**: Low-warrant newcomers get penalized, even if correct.  
  5. **Stakes are subjective**: Mods may misjudge stakes (e.g., treating niche topics as high-stakes).  

  **Final note**: This procedure optimizes for consistency, speed, and alignment with warranted confidence—not truth-seeking perfection. It accepts that moderation is a proxy for speaker intent, and focuses on community norms (e.g., rewarding track records). Refine the track-record rule (e.g., log user claims in a mod dashboard) to reduce failures.
