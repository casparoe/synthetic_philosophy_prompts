  2. **Hedges**: What do phrases like "I think" commit to? Under the knowledge norm, bare assertions require knowledge, but hedged ones might require knowledge of one's own belief. Warrant laundering is a problem—fake hedges like "studies show" without citation. Need to distinguish between genuine uncertainty and social hedging. Maybe require that hedges reflect actual confidence levels. For instance, "I think" should imply the speaker isn't certain, and they should be reasonably calibrated.

  3. **Warrant**: What mods can see—public sources, track records, or nothing. They want an "assertoric license" based on domain-specific track records. This is tricky because mods might not know a user's history. Maybe implement a user reputation system where past accuracy in a topic earns license, but mods need quick access to that info. However, the user mentioned mods are volunteers and time-constrained. So maybe track records are only considered if visible in the thread or via mod tools.

  4. **Stakes and Reach**: Should the bar move with stakes? High stakes (like medical advice) require higher certainty. Lottery cases (99% probable but not "known") are problematic. They need a stance. I lean towards the warranted confidence norm because it handles probabilities better. For stakes, maybe have a separate flag for high-stakes topics where the bar is higher regardless of the user.

  5. **Speaker vs. Mod Evidence**: The norm applies to the speaker, but mods judge based on their own evidence. The procedure must acknowledge this disconnect. For example, a user might know something but can't prove it to the mod. The decision should be based on mod-visible evidence to maintain consistency, even if it means removing truthful claims. Otherwise, mods can't enforce fairly.

  Now, the three test cases:
  1. New account: "scaling keeps working, 85% through 2027." Even though common belief, no track record or source. Under warranted confidence, is 85% reasonable? Without evidence, it's overconfident. Require a hedge or remove? Given it's top-level, stricter. Probably require a link or tag as unverified.

  2. Nested reply: "well documented, X shown repeatedly." B is right but specific number wrong. Here, the claim is correct but unsourced. Since it's nested and correcting a request, maybe require a link. If B has a track record in that topic, could leave with a tag. But mod might not know track record. Default to requiring a source.

