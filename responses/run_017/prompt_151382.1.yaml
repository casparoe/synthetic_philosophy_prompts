  ### Runnable Activity: The Utility Auction Challenge
  **Materials:** Play money (e.g., $500 in $10 bills), index cards with secret rules, 3 homework passes, 6 snack bars, whiteboard.

  **Setup (5 min):**
  1. **Select 5 volunteers.** Give each:
     - **Secret multiplier card** (hidden from class):
       - V1: Snack bar × 0.5, Homework pass × 2.0, Starting cash: $50  
       - V2: Snack bar × 1.0, Homework pass × 1.0, Starting cash: $200  
       - V3: Snack bar × 1.5, Homework pass × 0.5, Starting cash: $300  
       - V4: Snack bar × 2.0, Homework pass × 1.5, Starting cash: $100  
       - V5: Snack bar × 0.5, Homework pass × 0.5, Starting cash: $400  
     - **Starting cash** (as above).
  2. **Explain rules to class:**
     - Goal: Distribute 3 homework passes (HPs) and 6 snack bars (SBs) to maximize total "enjoyment points."
     - **Auction rules:** 
       - Each prize auctioned separately. Volunteers bid with their cash. Highest bid wins.
       - Winners pay immediately (cash is removed from the system).
       - No collusion or sharing money.
     - **Class role:** Observe bids and outcomes. Decide final allocation based on what they infer.

  **Auction (25 min):**
  - **Phase 1: Homework passes (10 min)**  
    Auction each HP one by one. Volunteers bid openly. Record winners/prices.  
    *(Predictable issue: V4 (HP multiplier 1.5, low cash) may lose to V5 (multiplier 0.5, high cash).)*  
  - **Phase 2: Snack bars (10 min)**  
    Auction SBs in batches of 2 to save time. Same rules.  
    *(Predictable issue: V3 (SB multiplier 1.5, high cash) outbids V1 (multiplier 0.5, low cash).)*  
  - **Phase 3: Allocation (5 min)**  
    Class debates and allocates remaining prizes based on observed bids. No new auctions.

  **Reveal (5 min):**  
  1. Display multipliers/cash on board.  
  2. Calculate **total enjoyment**:  
     - Example: If V1 won 1 HP and 0 SBs: (1 × 5 base pts × 2.0) = 10 pts.  
     - Add all volunteers’ points.  
  3. Contrast class’s allocation with the "optimal" one (e.g., giving HPs to high-multiplier/low-cash V1 and V4).

  **Debrief (20 min):**  
  *Use Socratic questioning to draw out insights:*  

  1. **Willingness to pay ≠ intensity of benefit:**  
     - *Ask:* "V5 won an HP with a $60 bid but had a 0.5 multiplier. V1 only bid $50 but had a 2.0 multiplier. Why did this happen?"  
     - *Guide:* Highlight V5’s cash advantage. *Key Q:* "Did the highest bidder always benefit the most? Why or why not?"  
     - *Map to point:* Bids reflected purchasing power, not true benefit.  

  2. **Swap tests mix personal taste with objective welfare:**  
     - *Ask volunteers:* "Would you swap your *entire outcome* (prizes + leftover cash) with another volunteer? Why?"  
       - *Likely response:* V1 (HP-focused) swaps with V4; V4 (cash-poor) swaps with V3; V3 (SB-focused) swaps with V1. **This creates a cycle.**  
     - *Ask class:* "Who’s objectively best off? Can we rank them consistently?"  
     - *Map to point:* Swaps reveal personal preferences, not a universal "better/worse."  

  3. **Marginal gain vs. overall welfare:**  
     - *Ask:* "V2 got 1.0 multipliers—moderate gains from prizes. But they have $200 left. Is V2 ‘better off’ than V1, who has high HP joy but $0 cash?"  
     - *Guide:* Note that we measured *gains from prizes only*, not total life quality.  
     - *Map to point:* Policy gains ≠ overall well-being; the latter includes unobserved factors.  

  **Caveats & Gaps:**  
  - **The elephant in the room:** *In this game, we revealed true multipliers. Real life has no reveal.* This gap is **crucial and intentional**—point out: "We cheated by seeing the multipliers. In reality, we never can. All we see are bids... which are warped by inequality."  
  - **What’s missing:** The activity can’t replicate **scale complexity** (e.g., valuing lives vs. dollars). Briefly note: "Real cost-benefit often involves incommensurable values—like health vs. profit—where numbers feel immoral."  
  - **Predictable hiccups:**  
    - Volunteers may underbid if confused. *Fix:* Remind them to bid "as high as you think it’s worth *to you*."  
    - Class may allocate prizes arbitrarily. *Fix:* Ask: "What did bids *not* tell you?"  

  **Closing (1 min):**  
  "Today’s takeaway: Putting people’s gains on one scale isn’t just math—it’s a minefield of inequality, perspective, and unknowns. Numbers? They’re not neutral."  

  **Why this works:** Students *feel* the tension through bidding wars and swap contradictions. The reveal shocks them, and the debrief ties chaos to your three points without lecturing. Total words: 899.
