  I'll structure my response to first state the thesis clearly: that for practice-contingent discoveries, credit should shift from priority to usability. Then I'll explain why current systems focus on the wrong thing (proposition over practice), argue for redistribution to those who built the usable machinery, and specifically counter the two objections about hindsight and multiplicity.

  For the first objection about visibility in hindsight, I can point out that while full impact takes time to see, the components of usability (notation, techniques) are often immediately apparent to expert communities. For the second objection about multiple discoveries, I can argue that while different versions exist, they're competing solutions to the same problem, and the one that becomes canonical does the historical work of transmission - making it the unit deserving credit.

