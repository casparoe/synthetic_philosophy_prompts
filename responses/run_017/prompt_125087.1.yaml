  I need to understand this distinction they've created. Content-inevitable means someone else would have come up with the same idea soon anyway. Practice-contingent means that even if the content was inevitable, how it became part of scientific practice depended on specific contributions like notation or proofs. They suspect most famous multiple discoveries fall into this category - inevitable in content but contingent in practice.

