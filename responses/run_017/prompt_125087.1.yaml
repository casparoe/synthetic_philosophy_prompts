answer: |-
  **Thesis: For practice-contingent discoveries, credit should shift from rewarding priority of proposition to recognizing those who built the usable machinery enabling the result's integration into scientific practice, and this redistribution is both defensible and administrable despite objections.**

  Our priority-based credit system conflates the proposition with the practice, focusing solely on who articulated the core idea first. This ignores that for practice-contingent discoveries – where the *content* was inevitable but the specific *form* and *pathway to adoption* were not – the real historical work lies in constructing the transmissible package: the effective notation, the compelling proof or robust experimental method, the clarifying examples, and the framing that connects it to existing problems. Newton vs. Leibniz exemplifies this: while both grasped calculus, Leibniz's notation and algorithmic rules were vastly more usable and became the foundation for practice, driving calculus forward far more effectively than Newton's fluxions. Priority rewards Newton (or the dispute), but usability demands credit for Leibniz.

  This necessitates redistributing credit towards the "builders": those who crafted the formulations that were actually taken up and used. This includes expositors who clarified the discovery, notation innovators like Leibniz, and crucially, the "losing" priority claimants whose versions proved superior for practice (like Wallace, whose Ternate paper arguably presented natural selection more accessibly than Darwin's initial private essays, though Darwin's later synthesis was monumental). Credit isn't abolished; it's redirected to recognize whose labour made the idea *operational* and *communicable*, thereby *doing* the science rather than just stating it.

  **Objection 1 (Hindsight):** *Practice-building's value is only visible in hindsight, making real-time credit allocation impossible.*  
  **Rebuttal:** While the *ultimate* dominance of a specific practice might take time, the *components* of usability are often immediately evaluable by expert communities. Superior notation's clarity, a proof's elegance or rigor, an experimental method's robustness, an exposition's coherence – these are tangible qualities assessable contemporaneously. We already make judgments about the "best" or "most elegant" proof or method; we simply need to weight these judgments more heavily in credit assignment *alongside* priority, recognizing their role in enabling the discovery's actual scientific function. The system wouldn't predict future dominance perfectly, but it would better capture the *present* contribution to building functional scientific knowledge. We administer credit for technical innovations (methods, instruments) in real time; the same can apply to the cognitive and communicative machinery of a discovery.

  **Objection 2 (Multiplicity):** *A practice-contingent result is several distinct discoveries, not one, so redistributing credit for "the" discovery is incoherent.*  
  **Rebuttal:** This objection mistakes the *artifact* (the specific formulation) for the *achievement* (solving a recognized problem in a way that enters practice). Multiple formulations tackling the same core problem (e.g., understanding change mathematically, explaining species adaptation) are competing solutions vying to become the canonical practice. The achievement is not merely stating the proposition but providing the *successful solution framework*. When one formulation "wins" by becoming the working tool of science, it demonstrates a unique contribution: the construction of the *effective* practice. Credit for solving the problem *in a manner that became scientifically operational* belongs primarily to the builders of that framework. The other formulations are attempts; the adopted one is the discovery that did the historical work. Redistribution focuses credit on *that* specific, historically effective achievement.
