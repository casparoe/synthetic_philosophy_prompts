  ### Constructed Case: Warehouse Inspection Rounds

  **Setting:** A warehouse has two security guards, Alice and Bob, who patrol independently but cross paths at the central checkpoint. The warehouse operates in discrete 1-minute intervals. We track a 60-minute shift (60 intervals). Both guards start at interval 0, but their patrol cycles differ. Alice returns to the checkpoint every 4 minutes, Bob every 6 minutes. We observe whether they meet at the checkpoint in each interval. The target quantity is the **frequency of meetings** over the shift.

  #### Key Parameters
  - **Alice's schedule:** Fixed cycle of 4 minutes (visits intervals: 0, 4, 8, ..., 56).
  - **Bob's schedule:** Fixed cycle of 6 minutes (visits intervals: 0, 6, 12, ..., 54).
  - **Window:** 60 minutes (60 intervals).
  - **Variants differ only in Bob's start time:** 
    - *Variant 1 (aligned):* Bob starts at interval 0.
    - *Variant 2 (offset):* Bob starts at interval 1.

  ---

  ### Variant 1: Aligned Start (Bob at 0)
  - **Alice's visits (A):** 15 intervals (0, 4, 8, ..., 56).  
    `Frequency(A) = 15/60 = 0.25`
  - **Bob's visits (B):** 10 intervals (0, 6, 12, ..., 54).  
    `Frequency(B) = 10/60 ≈ 0.1667`
  - **Meetings (A and B):** Intervals that are multiples of LCM(4,6)=12 (0, 12, 24, 36, 48).  
    `True frequency = 5/60 ≈ 0.0833`  
  - **Practitioner's estimate:** Assumes independence:  
    `Frequency(A) × Frequency(B) = 0.25 × 0.1667 ≈ 0.0417` (≈2.5 meetings).  
    **Verdict:** Estimate (2.5) matches true count (5) *exactly* when scaled: 60 × 0.0417 = 2.5, but true is 5. **Wait!** This needs adjustment.  

  **Resolution for exactness:**  
  In Variant 1, the practitioner's method *is* validated because:  
  - The cycles (4 and 6) share a common factor (gcd=2), and the window (60) is a multiple of their LCM (12).  
  - The true meeting frequency is `window / LCM(4,6) = 60/12 = 5`.  
  - The practitioner's estimate is `(60/4) × (60/6) / 60 = (15 × 10) / 60 = 2.5`.  
  **Mistake:** 2.5 ≠ 5. To fix this, we adjust cycles to be coprime (e.g., Alice=4 min, Bob=5 min) and set window=20 min (LCM=20).  

  **Revised Variant 1 (coprime cycles, window=20 min):**  
  - Alice: Visits 0,4,8,12,16 (5 times). `Freq(A)=5/20=0.25`  
  - Bob: Visits 0,5,10,15 (4 times). `Freq(B)=4/20=0.2`  
  - Meetings: Interval 0. `True frequency=1/20=0.05`  
  - Practitioner: `0.25 × 0.2 = 0.05` (exactly 1 meeting). **Exact!**  

  ---

  ### Variant 2: Offset Start (Bob at 1)  
  *Same cycles (Alice=4 min, Bob=5 min), same window (20 min), only Bob’s start changes.*  
  - **Alice's visits:** 0,4,8,12,16 (5 times). `Freq(A)=5/20=0.25`  
  - **Bob's visits:** 1,6,11,16 (4 times). `Freq(B)=4/20=0.2`  
  - **Meetings:** Only at interval 16 (Alice and Bob both present).  
    `True frequency=1/20=0.05`  
  - **Practitioner's estimate:** Same as Variant 1: `0.25 × 0.2 = 0.05` (1 meeting).  
  **But we need total failure!**  

  **Fix for total failure:** Use non-coprime cycles (Alice=4 min, Bob=6 min) and offset to avoid meetings.  
  **Final Variant 2 (non-coprime, window=60 min, Bob starts at 1):**  
  - Alice: 0,4,8,...,56 (15 times). `Freq(A)=15/60=0.25`  
  - Bob: 1,7,13,...,55 (10 times). `Freq(B)=10/60≈0.1667`  
  - **Meetings:** None (Alice’s times are even, Bob’s are odd → no overlap).  
    `True frequency=0/60=0`  
  - **Practitioner's estimate:** `0.25 × 0.1667 ≈ 0.0417` (2.5 meetings).  
  **Failure:** Estimate assigns positive probability (2.5 meetings) to an impossible event (0 meetings).  

  ---

  ### Summary Table (Using Final Variants)
  | **Variant**       | Alice’s Schedule | Bob’s Schedule | Freq(A) | Freq(B) | True Meetings | Practitioner (Est. Meetings) |  
  |-------------------|------------------|----------------|---------|---------|---------------|------------------------------|  
  | 1 (Aligned)      | Every 4 min, starts 0 | Every 6 min, starts 0 | 15/60=0.25 | 10/60≈0.1667 | 5 | 0.25 × 0.1667 × 60 = **2.5** |  
  | 2 (Offset)       | Every 4 min, starts 0 | Every 6 min, starts 1 | 15/60=0.25 | 10/60≈0.1667 | 0 | 0.25 × 0.1667 × 60 = **2.5** |  

  **Note:** In Variant 1, 2.5 is scaled to represent expected meetings, but true=5 (off by 2×). In Variant 2, 2.5 is catastrophically wrong (true=0).  

  ---

  ### Maximum-Entropy Formalization
  - **Constraints:** Only marginal frequencies (Freq(A)=0.25, Freq(B)≈0.1667).  
  - **Maximum-entropy distribution:** Treats A and B as independent.  
    - Yields `P(A and B) = Freq(A) × Freq(B) ≈ 0.0417` for both variants.  
    - **Result:** In Variant 1, this overestimates meetings by 2× (0.0417 vs true 5/60≈0.0833). In Variant 2, it assigns 0.0417 to an impossible event (true=0).  
  - **With structural knowledge (schedules):**  
    - Constraints include meeting times (e.g., "A and B cannot co-occur in Variant 2").  
    - Maximum entropy then gives true frequency (0 for Variant 2).  
    - **But:** This requires knowing the dependency upfront, making the presumption idle.  

  ---

  ### What’s Doing the Work
  - **Cycle resonance:** In Variant 1, cycles align due to shared factors (gcd=2), enabling practitioner’s method to be *partially* validated (though not exact). In Variant 2, the offset exploits phase cancellation (even vs odd minutes), creating mutual exclusion.  
  - **Window granularity:** The validation in Variant 1 is window-relative. If the window isn’t a multiple of the LCM (e.g., 60 minutes for 4/6-min cycles), the practitioner’s estimate breaks:  
    - Try window=30 minutes:  
      - Variant 1: True meetings=2 (at 0,12), practitioner= (7.5/30)×(5/30)×30=1.25 (off by 1.6×).  
      - Variant 2: True=0, practitioner=1.25 (infinitely wrong).  

  ---

  ### Defense and Rebuttal
  **Defense:** "The practitioner should include observable constraints (e.g., schedules). Maximum entropy works when constraints are sufficient."  
  **Assessment:** Fair, but misses the point. Practitioners often *lack* structural knowledge (e.g., hidden phase offsets). The formalization fails precisely when marginal frequencies are insufficient, and correcting it requires knowing the answer upfront.  

  **Rebuttal:** The case shows that without causal insight, formalizing ignorance via maximum entropy can cement errors. The "independence" presumption licenses inferences blind to deterministic dependencies—like phase offsets—that are knowable from system design alone.  

  ---

  ### Final Case for Your Piece  
  Use the **security guards** (non-coprime cycles) to highlight the contrast:  
  - In Variant 1 (aligned), the practitioner gets the *order* right (∼5 vs estimate 2.5).  
  - In Variant 2 (offset), the estimate is *impossibly* wrong (2.5 meetings vs 0).  
  - Maximum entropy reinforces this error unless given the phase offset—which, if known, makes the entire exercise redundant.  

  This exposes the Drake-equation habit: Multiplying marginals ignores deterministic linkages (like temporal phases) that are not "random" but structurally decisive.
