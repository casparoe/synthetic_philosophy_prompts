answer: |-
  ## Small-Grants Reform: A Path Forward for the Marchmont Trust  
  **Prepared for Trustees' Away Day: 14 March**

  ---

  ### 1. Introduction  
  This paper addresses the critical shortcomings in our small-grants stream (£50k and under). The current outcomes-based metric has led to **gaming by providers** and, more damagingly, **excluded organisations serving the most vulnerable young people**. The Director of Programmes proposes replacing the metric with an AI-driven "endorsement procedure." While innovative, this raises valid concerns about bias, new gaming risks, and the absence of "ground truth" for evaluation. This paper evaluates the proposal, presents alternatives, and recommends a conditional adoption plan with robust safeguards.  

  ---

  ### 2. The Problem: Why Change is Necessary  
  Our outcomes framework has failed in two key ways:  
  *   **Gaming the System:** The "cost-per-outcome" metric incentivises redefining success (e.g., counting a text message as "sustained engagement"). This distorts service delivery and erodes trust.  
  *   **Exclusion of Critical Work:** Organisations supporting highly chaotic care leavers cannot guarantee 12-month outcomes. Consequently, our funding flows towards easier-to-measure, less complex interventions, **undermining our mission to support the most vulnerable**.  
  *   **Current Process Gaps:** Fortnightly officer/trustee decisions without individual monitoring lack the depth to reliably identify gaming or assess true impact potential for complex cases.  

  **The status quo is unsustainable.** It misallocates funds and neglects our core beneficiaries.  

  ---

  ### 3. The Proposal: AI-Powered Endorsement  
  The Director of Programmes proposes:  
  1.  **Anonymised Applications:** Strip applicant names, charity numbers, and past track records. Retain region, amount, and activity description.  
  2.  **AI Scoring:** Use a language model trained *exclusively* on 12 years of anonymised Marchmont Trust grant decisions and written trustee reasoning. The model answers: "Is this the sort of proposal the trustees would endorse?"  
  3.  **"Annual Report" Lens (Optional):** Frame the application description as it would appear in a *future annual report* (post-grant), aiming for more honest post-facto judgment.  
  4.  **Ranking & Human Decision:** The model ranks proposals. The programme officer and trustee review the top-ranked band in full and make final decisions.  

  **Aim:** Replicate trustee judgment patterns to prioritise proposals aligned with our *implicit values and preferences*, moving beyond the flawed metric.  

  ---

  ### 4. Trustee Concerns: Acknowledged & Examined  
  The board’s reservations are serious and merit thorough consideration:  

  *   **Concern 1: Learning Approval, Not Reasons**  
      *   **The Worry:** The model learns to predict past *approvals*, not the *underlying reasons* for those approvals. Crucially, past approvals were influenced by the very outcomes metric we now reject. This risks embedding past biases and errors, potentially perpetuating the exclusion of complex cases.  
      *   **Is this "Approval-Directed" vs. "Goal-Directed"?** This framing highlights a real tension. The model *is* inherently "approval-directed" – it predicts trustee past behaviour. Our "goal" (funding impactful work for the most vulnerable) may not have been perfectly reflected in past behaviour due to the flawed metric. However, the proposal aims to capture the *intent and values* embedded in trustee reasoning *despite* the metric. The question is whether those captured patterns are closer to our true goals than the current explicit metric.  

  *   **Concern 2: New Forms of Gaming**  
      *   **The Worry:** Applicants will optimise proposals for the AI model ("machine-washing"), using language or structures they believe will trigger endorsement, rather than clearly articulating genuine need and impact. Early signs of this exist.  
      *   **Analysis:** This risk is real. Any scoring system creates incentives. Shifting gaming from manipulating outcomes data to manipulating proposal language is a lateral move, not necessarily an improvement. The anonymisation helps but doesn't eliminate the core incentive.  

  *   **Concern 3: The "Ground Truth" Problem & Evaluation**  
      *   **The Worry:** Without individual monitoring, how do we know if "endorsement" leads to better grants than the metric? We risk replacing one flawed proxy (cost-per-outcome) with another (predicted trustee approval) that is even less auditable or measurable for impact.  
      *   **Analysis:** This is the most fundamental challenge. **We cannot assess the true effectiveness of *any* small-grant selection method solely by looking at grant outputs without significant additional data collection.** We lack baseline data on what we *missed* under the old system and will lack direct impact data under the new one.  

  ---

  ### 5. Options Analysis  

  | Option                     | Pros                                                                 | Cons                                                                                              | Addresses Core Problems?                                    |
  | :------------------------- | :------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------ | :---------------------------------------------------------- |
  | **1. Reject Proposal**     | Avoids AI risks/bias; Simplicity.                                    | Perpetuates current failures (gaming, exclusion); Missed opportunity for reform.                  | ❌ Fails to address gaming/exclusion.                       |
  | **2. Adopt Proposal Unchanged** | Innovative; Addresses exclusion *potentially*; Streamlines process. | Ignores serious bias/gaming risks; No plan for evaluation ("ground truth" gap remains).           | ⚠️ Addresses exclusion *potentially*, but risks remain high. |
  | **3. Adopt with Conditions (RECOMMENDED)** | Mitigates key risks; Creates path to evaluation; Balances innovation/caution. | Requires more initial setup; Demands trustee oversight commitment.                               | ✅ Directly tackles risks & "ground truth" gap.             |

  ---

  ### 6. Recommendation: Conditional Adoption & Addressing "Ground Truth"  
  **I recommend adopting the endorsement procedure proposal, subject to the following concrete, time-bound, and checkable conditions designed to mitigate risks and build evaluative evidence:**  

  1.  **Model Training & Validation (Mitigates Bias - Concern 1 & "Approval-Directed"):**  
      *   *Condition:* Before deployment, the model must undergo rigorous validation by an independent AI ethics auditor (e.g., Ada Lovelace Institute, CAST). Focus: Does it disproportionately deprioritise proposals describing complex/vulnerable cohorts *even when the narrative aligns with our mission*?  
      *   *Check:* Auditor's report presented to the Board by **30 June 2024**.  
      *   *Action:* If significant bias is found, trustees mandate adjustments or halt deployment.  

  2.  **Pilot & Phased Rollout (Mitigates Risk & Builds Evidence):**  
      *   *Condition:* Implement as a 12-month pilot for **50% of small grants** selected at random. The other 50% use a modified "expert judgment" process (see 7.1 below) for comparison.  
      *   *Check:* Comparative analysis of pilot vs. control group presented at the **March 2025 Away Day**.  

  3.  **Building "Ground Truth" & Monitoring (Addresses Concern 3):**  
      *   *Condition:* Implement a **Light-Touch, Aggregate Monitoring Framework** for *all* small grants:  
          a.  **Standardised 12-Month Output Report:** Mandatory for all grantees (max 2 pages). Captures: # beneficiaries (demographics), key activities delivered, *qualitative* case study (1-2 paragraphs), *any* outcome data collected *naturally* by the org (no pressure to use our old metric).  
          b.  **Structured Feedback from Beneficiaries:** Commission an independent agency to conduct **annual aggregated surveys/focus groups** with a representative sample of care leavers supported *across all small grantees*. Focus on experience and perceived value, not narrow outcomes.  
          c.  **Random Deep Dives:** Commission 3-5 **independent qualitative evaluations** annually, randomly selecting small grantees to assess context, implementation challenges, and emergent outcomes.  
          d.  **Partner Trust Data Sharing:** Explore agreements with 2-3 peer trusts funding similar work to **anonymously share aggregate data/trends** on small grants, creating benchmarks.  
      *   *Check:* First aggregate output report & beneficiary feedback summary presented at **December 2024 Board Meeting**. First independent deep-dive reports by **March 2025**.  

  4.  **Countering Machine-Washing (Mitigates Concern 2):**  
      *   *Condition:* Revise application guidance to **explicitly forbid AI-generated content** and emphasise clear, human-written descriptions of need and activity. Programme Officers will scan for obvious machine-washing during the anonymisation stage and seek clarification.  
      *   *Check:* Programme Officer report on application trends and machine-washing attempts at **September 2024 and March 2025 Board Meetings**.  

  5.  **Trustee Oversight:**  
      *   *Condition:* Establish a **Small-Grants Reform Subcommittee** (3 trustees) meeting quarterly to review audit reports, pilot data, monitoring outputs, and machine-washing trends.  
      *   *Check:* Subcommittee reports to each full Board meeting.  

  **The "Annual Report Lens" Wrinkle:** This is conceptually interesting but adds complexity. **Recommendation:** **Do not implement** in the pilot phase. Focus first on validating the core model. This can be reconsidered for Year 2 if the pilot succeeds.  

  ---

  ### 7. The Losing Side's Strongest Case (Rejection Argument)  
  The most compelling argument against the AI proposal is **the "Ground Truth" problem combined with bias risk**:  

  *   "We are replacing a *known bad* proxy (cost-per-outcome) with a *black box* proxy (predicted trustee endorsement). The endorsement model is trained on decisions corrupted by the very metric we reject. It risks automating past biases, potentially still excluding the complex cases we now wish to reach. Crucially, *without individual monitoring, we fundamentally lack the data to prove this new system is better*. We might simply obscure failure differently. The proposed monitoring, while better than nothing, only provides indirect, aggregated signals, not causal proof the AI selects *more impactful grants*. We risk expensive experimentation with vulnerable beneficiaries' support, where robust evidence of improvement is structurally elusive. A simpler, more transparent expert-led approach, while imperfect, offers greater accountability and avoids the opacity and potential lock-in of an AI system."  

  **This argument is powerful and correct about the inherent difficulty of proof.** Our conditional adoption seeks to mitigate, not eliminate, this fundamental challenge through comparative piloting and enhanced aggregate monitoring.  

  ---

  ### 8. Conclusion & Bottom Line  
  The current small-grants system fails our mission. The AI endorsement proposal offers a potentially better way to capture trustee values and include complex cases, but carries significant risks regarding bias, new gaming, and evaluability. **Blind adoption is unwise, but rejection perpetuates known harms.**  

  **Recommendation for Vote:**  
  **ADOPT the AI Endorsement Procedure proposal SUBJECT TO the following conditions:**  
  1.  **Independent Bias Audit:** Completed and reported to the Board by 30 June 2024.  
  2.  **12-Month Pilot:** With 50% control group using enhanced expert judgment.  
  3.  **Implementation of Aggregate Monitoring Framework:** Standardised output reports, independent beneficiary feedback, random deep dives, and exploration of trust data sharing, with first reports Dec 2024 / Mar 2025.  
  4.  **Anti-Machine-Washing Protocols:** Included in guidance and monitored.  
  5.  **Establishment of Trustee Subcommittee:** For ongoing oversight.  

  **Bottom Line:** This conditional path allows us to innovate cautiously, directly addresses the critical risks and the "ground truth" gap through tangible, time-bound actions, and provides a clear framework for evidence-based evaluation at the March 2025 Away Day, where a decision on full adoption, modification, or abandonment will be made.  

  ---  
  **Trustee Action Requested:** Vote to adopt the AI Endorsement Pilot under the specified conditions at the Away Day on 14 March.
