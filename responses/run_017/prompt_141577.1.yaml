prompt: |-
  I sit on the governance-advisory team of a multilateral development bank. We are drafting an internal guidance note on which practices our programmes should treat as corrupt — not merely illegal, and not merely in breach of our own procurement rules — and we keep discovering that we disagree with each other in ways none of us can fully articulate. Before I argue with my colleagues I would like to know what I actually think. So I have written down my own verdicts on a set of cases I have either encountered or argued about, together with the test I have been using to decide them, and I would like you to tell me what principle my verdicts add up to, how my test should be repaired or replaced, and which of my verdicts a defensible account would force me to give up.

  My cases and verdicts.

  1. At a district hospital in a low-income country, a family gives a nurse the equivalent of about two dollars before she will take an elderly woman's card and let her be seen. Corrupt, but the least serious thing on this list; I would not report her, and I would rather she took the money than sent the woman away.

  2. The same nurse, on the same ward. After a successful delivery, the family hands her a chicken in front of the other patients, purely out of gratitude; nothing about her future conduct changes. Not corrupt. I notice that these two cases involve the same official, a transfer of roughly the same magnitude, and opposite verdicts, and that what seems to be doing the work is timing, publicity and consequence. I dislike the idea that timing does the work, but I cannot get myself to change either verdict.

  3. A municipal clerk demands twenty dollars to release a ration card that the applicant has already been approved for and is legally entitled to. The clerk's demand is corrupt; the applicant's payment is not. As I understand it, the American statute's grease-payment carve-out and the British statute's lack of one each get one half of this case wrong, and in opposite directions.

  4. A mayor awards a no-bid contract to the only firm in a blighted district, having campaigned on bringing work to that district; his motive is partly re-election. Not corrupt.

  5. A mayor awards a no-bid contract to a firm that, three months later, hires his son at market salary for a job he is qualified for; there is no evidence of any prior understanding. Corrupt. I know this sits badly with case 4 and I go back and forth on the pair: in both, an official uses discretion to advantage someone connected to him and gains from it.

  6. A pharmaceutical representative buys lunch for the doctors at a clinic and waits outside while they eat; prescribing of her product subsequently rises. Corrupt, mildly — including in jurisdictions where this is legal and fully disclosed.

  7. A village headman adjudicating a land dispute accepts the customary drink from both parties before he hears the matter; everyone present regards this as how a headman behaves and would think worse of one who refused. I want to say not corrupt, and I genuinely cannot tell whether that verdict is respect for local norms or cowardice.

  8. An international lender makes a loan tranche conditional on the recipient's criminalising customary gift-giving to officials, on pain of losing money that pays for clinics. The condition is itself a species of the thing it targets. My own employer does things of this kind.

  9. A donor gives a university ten million dollars; his son is admitted two years later; the admissions office never discussed the gift. Not corrupt on these facts — but the university ought to refuse the gift, and I do not know what to call the wrongness if corruption is the wrong name for it.

  10. A senior regulator takes a job at a bank she previously regulated, at triple her public salary, eighteen months after leaving, breaking no cooling-off rule. This is the case I feel most strongly about, and I call it corrupt or at least corrosive, even though no law was broken and no bribe was offered. Her former department now regulates softly, in the hope of similar offers.

  11. A legislator's closest friend since university — now a registered lobbyist for an industry her committee oversees — gives her a watch worth two thousand dollars for her fiftieth birthday. There is no expectation on either side; the friendship is precisely what makes the gift possible. This should be prohibited and I am inclined to call it corrupt, but it seems to break clause (i) of my own test below, since the transfer would have been made had she held no office at all.

  My current test, which a colleague has named the Counterfactual-Relation Test, says that a transfer of advantage to someone occupying a role of trust is corrupt if and only if (i) the transfer would not have been made but for the role, and (ii) the point of the transfer is to make the recipient's exercise of the role answer to the giver's interests rather than to the purposes the role exists to serve, where interests is understood to include an interest in being treated better than the role's rules allow. The same colleague proposes sorting transfers into extractive ones — those the office-holder can extract because of her power over someone already entitled to something, as in cases 1 and 3 — and integrative ones — those that constitute or maintain a relationship, as in cases 2, 7 and 11 — and treating only the extractive ones as corrupt. I think that sorting collapses on case 11, but I cannot say why in a way my colleague would have to accept.

  What I want from you. State, as precisely as you can, the principle my verdicts are really tracking, with the case that motivates each clause, and say plainly which clause of my test is doing no work and which is doing too much. Explain why the very same transaction can be corrupt in one direction and not the other in case 3, and whether that asymmetry is a feature of a good account or a sign that I have been using one word for two things. Then give your account's verdicts on three cases I have not listed: a legislator who accepts campaign contributions from an industry whose case she had independently come to believe in before any contribution was made; a hiring manager who appoints her nephew, who is genuinely the strongest candidate, without disclosing the relationship; and a convoy commander who pays a militia for safe passage of food through territory that militia controls. Finally, tell me honestly which of my eleven verdicts your account cannot accommodate and which one you think I should overturn, and say whether the resulting account commits me to the view that the standards my institution enforces are universal, or to the view that they are parochial standards we happen to have the power to impose — and, if it commits me to the latter, whether corruption is then a concept I should be using less, with some of cases 8, 9 and 10 reassigned to other names such as injustice, abuse of power, or institutional capture.
reasoning: |-
  Hmm, this is a fascinating and complex query from someone working on anti-corruption policy at a multilateral development bank. They've presented 11 nuanced cases with their personal verdicts, a proposed "Counterfactual-Relation Test," and several specific requests for analysis. 

  The core tension I notice is between their intuitive judgments and their stated test. For example, in case 3 they correctly identify the asymmetry where the clerk's demand is corrupt but the applicant's payment isn't - something their test doesn't explicitly address. Their discomfort with timing in cases 1/2 and relationship in case 11 suggests they're intuitively tracking institutional consequences rather than just transactional elements.

  What's particularly interesting is how their verdicts prioritize institutional integrity over individual actions. Case 10 (the regulator revolving door) bothers them most despite no explicit bribe, while case 9 (university donation) feels wrong but not corrupt - showing concern for systemic incentives. Their colleague's extractive/integrative distinction fails because it can't handle relationship-based corruption like case 11's lobbyist gift.

  For their three unlisted cases: The legislator taking contributions for a pre-held belief might be acceptable if properly disclosed, but creates perception issues. The hiring manager appointing a qualified nephew becomes corrupt if undisclosed due to the secret advantage. The convoy payment to militias is an extortionate "corrosive" transfer that distorts institutional functions.

  Their verdicts I'd challenge: Case 5 (mayor's son hired later) seems inconsistent with case 4 if we focus on institutional harm rather than connections. Case 7 (customary drink) might need tolerance for culturally embedded practices with low distortion risk. And they should probably soften case 6 (pharma lunches) to "corrosive" rather than corrupt if fully transparent.

  The big philosophical question they raise is crucial: Their institution's standards are necessarily parochial (Western-derived) but must be applied universally. The solution isn't abandoning "corruption" as a concept, but distinguishing core institutional harms from secondary issues better handled as "injustice" or "abuse." Cases like 8 (criminalizing gifts) show why - the cure can be worse than the disease when ignoring local context.

  Throughout, the thread is institutional purpose. A defensible definition must examine how actions distort an institution's reason for existing - whether it's a hospital meant to serve patients or a regulator meant to oversee banks. This focus explains their intuitive judgments better than their current test.
answer: |-
  Your verdicts reveal a coherent principle centered on **institutional distortion**: an act is corrupt when it *undermines the core purpose of an institution by subverting its decision-making processes to serve private interests*. Your judgments consistently weigh whether a transfer creates systemic incentives that detach institutional actions from their intended goals. Below, I reconstruct your implicit principle, critique your test, apply it to new cases, and flag tensions.

  ### Your Implicit Principle: The Institutional Distortion Test
  A transfer or advantage is corrupt **if and only if**:
  1. **It creates a dependency or incentive** that distorts institutional decision-making away from its core purpose *(motivated by Cases 1, 3, 5, 6, 10)*;  
  2. **The distortion is systemic or predictable**, not merely incidental *(Cases 5, 10, 11)*;  
  3. **The act exploits an asymmetry of power** derived from institutional authority *(Cases 1, 3, 8)*;  
  4. **Social/cultural context may excuse the act** only if it reinforces institutional trust without creating harmful dependencies *(Cases 2, 7)*.  

  **Key differentiators**:  
  - **Timing/publicity matters** (Cases 1 vs. 2) because preemptive transfers create *obligations*, while gratitude rituals reinforce social cohesion without distorting future acts.  
  - **Asymmetry in Case 3** arises because the clerk *weaponizes* institutional power for extraction, while the applicant acts in self-defense. Corruption targets the abuse of power, not victim compliance.  
  - **"Interests" in your test** should include *implicit institutional harms* (e.g., Case 10’s revolving door), not just explicit quid pro quo.  

  ### Critique of Your Counterfactual-Relation Test
  - **Clause (i) "But for the role" is overinclusive and underinclusive**:  
    - *Fails Case 11*: The watch *would* be given absent the role, yet you deem it corrupt because it embeds a conflict of interest.  
    - *Fails Case 9*: The donation *would not* occur "but for" the university’s role, yet you withhold the corruption label.  
    - **Fix**: Replace with **"The transfer gains its value or opportunity from the role"** (e.g., the watch’s significance derives from the legislator’s power).  
  - **Clause (ii) "Point of the transfer" is too narrow**:  
    - Ignores *systemic effects* (Case 10: no "point" to bribe, but soft regulation results).  
    - **Fix**: Add **"or predictably undermines institutional integrity by creating conflicted incentives."**  
  - **Colleague’s extractive/integrative distinction fails** because it cannot handle "integrative" corruption (e.g., Case 11’s friendship gift) where relationships *are* the vehicle for distortion.  

  ### Verdicts on New Cases Using Your Principle
  1. **Legislator taking campaign contributions for a pre-held belief**:  
     - *Not corrupt* if votes/actions are unchanged and contributions are transparent. However, it becomes **corrosive** (not corrupt) if it creates *appearance* of influence, requiring disclosure rules.  
  2. **Hiring manager appointing qualified nephew without disclosure**:  
     - **Corrupt** if undisclosed, as secrecy implies awareness of wrongdoing. The act exploits institutional power to conceal a conflict, undermining merit-based trust.  
  3. **Convoy commander paying militias for safe passage**:  
     - **Corrosive but not corrupt** if payment is extortion under duress (like Case 3’s applicant). But if payment incentivizes future hostage-taking, it becomes institutionally distortive (like Case 8’s loan condition).  

  ### Tensions with Your Original Verdicts
  | Case | Your Verdict | Institutional Distortion View | Recommendation |  
  |------|--------------|-------------------------------|----------------|  
  | 5    | Corrupt      | **Inconsistent**: If the son is qualified and no prior deal, no *distortion* occurs. Weak systemic link. | **Overturn to not corrupt** (aligns with Case 4). |  
  | 7    | Not corrupt | **Acceptable but borderline**: Customary drinks risk normalizing bias. Tolerate only if transparent and non-coercive. | Keep verdict but add safeguards. |  
  | 11   | Corrupt     | **Correct but your test fails it**: The watch gains significance *through* the role. | Strengthen test to capture "role-derived value". |  
  | 6    | Corrupt     | **Overextended**: Mildly corrupt only if lunches are covert or influence prescribing *against* patient interests. If transparent and product is legit, it’s merely **corrosive marketing**. | Downgrade to "not corrupt" with disclosure rules. |  

  ### Philosophical Commitment: Universal vs. Parochial Standards  
  Your principle commits to **universal institutional purposes** (e.g., hospitals exist to heal, regulators to regulate fairly) but **parochial enforcement**. Corruption is defined by harm to an institution’s *telos*, which is cross-culturally recognizable (e.g., extracting bribes for entitled services perverts healthcare everywhere). However:  
  - **Case 7’s drink ritual** may be non-corrupt *if* it reinforces local decision-making legitimacy without distorting outcomes.  
  - **Case 8’s loan condition** is **itself corrupt** by your principle: it weaponizes donor power to impose rules that ignore local institutional realities, substituting one distortion for another.  
  - **Reassign some cases**:  
    - *Case 9*: Not corruption but **institutional capture** if donations sway admissions.  
    - *Case 10*: **Abuse of power** (not bribery) due to systemic incentive distortion.  
    - *Case 8*: **Coercive injustice** in imposing uncontextualized norms.  

  ### Conclusion: Refined Test  
  **A transfer is corrupt if:**  
  (A) It exploits institutional power to extract private advantage **or** embeds conflicts that predictably distort institutional purposes;  
  (B) The act’s value or opportunity derives from the recipient’s institutional role;  
  (C) It undermines trust in the institution’s core function.  

  **Use "corruption" sparingly** for clear institutional subversion (Cases 1, 3, 10). For gray areas (Cases 6, 7, 11), prioritize **transparency and anti-distortion rules** over punitive labels. Your institution’s standards should enforce *universal harms* (extortion, conflicted incentives) while tolerating *non-distortive local practices*. Argue with colleagues using Case 3’s asymmetry: corruption is about **power abuse**, not victim survival.
