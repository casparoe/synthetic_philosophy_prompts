  ### Analysis of the Monetary Redenomination Scheme

  #### (a) Implicit Theory of Money  
  The core rules—nominal-value, legal tender, and continuity on redenomination—collectively presuppose a **creature-of-law theory of money**. This theory asserts that money is a legal construct defined by state authority, with no intrinsic value beyond its nominal designation. The nominal-value rule treats the numerical unit as inviolable, reflecting the state’s sovereign power to define monetary obligations without reference to purchasing power. Legal tender laws reinforce this by mandating state currency as the exclusive medium for debt discharge, positioning the state as the sole arbiter of monetary validity. Continuity on redenomination (dividing all units by 1,000) confirms that money’s essence lies in state-decreed labels, not underlying value. This framework denies money any natural or pre-legal stability; it is purely a conventional token whose utility rests on state fiat. Aristotle’s insight that money is conventional is accommodated, but his emphasis on money as a stable *measure* for proportional justice is implicitly rejected. The state here wields convention as power, not responsibility.

  #### (b) Strict Presuppositions vs. Rival Theories  
  - **Strictly presupposed**: Only the creature-of-law theory is indispensable. It alone explains why redenomination is legally trivial (the state redefines the unit at will) and why nominalism overrides real-value concerns.  
  - **Merely consistent with**:  
    - *Social convention theory*: Fits the redenomination’s seamless transition but conflicts with legal tender’s coercion and invalidation of private indexation.  
    - *Numeraire/accounting device*: Aligns with continuity (units are relabeled for clarity) but clashes with nominal-value’s refusal to adjust for inflation-induced accounting distortions.  
  - **Ruled out**:  
    - *Commodity theory*: Invalidated by the ban on commodity-pegged clauses and redenomination’s indifference to material backing.  
    - *Credit/debt theory*: Contradicted by nominal-value’s disregard for the debtor-creditor balance when inflation erodes claims.  
    - *Measure-of-value (Aristotelian)*: Undermined by nominalism’s tolerance of purchasing power drift and the state’s refusal to enforce stability.  
  The scheme permits *social convention* and *numeraire* theories as compatible overlays but elevates state authority as non-negotiable.  

  #### (c) Internal Consistency  
  The scheme is **inconsistent in practice but coherent in legal logic**.  
  - **Tension 1**: State nominalism (for private debts) vs. state index-linked bonds/pensions.  
    - *Conflict*: The state enforces nominalism on citizens while indexing its own obligations, exploiting money’s conventionality asymmetrically.  
    - *Coherent*: True, as sovereignty allows selective indexing, but **residual cost** is hypocrisy: the state avoids inflation’s burden while imposing it on private actors.  
  - **Tension 2**: Reference basket maintenance vs. ban on its use.  
    - *Conflict*: The basket acknowledges money’s measure-of-value function yet forbids its application, revealing a state monopoly on defining "real value."  
    - *Coherent*: True, as statistical tools need not bind contracts, but **residual cost** is distrust: the state signals that its nominal unit is untrustworthy for long-term fairness.  
  **Best resolution**: Extend indexation options to private parties or abandon state indexation. Otherwise, the inconsistency erodes rule-of-law legitimacy.  

  #### (d) Equitable Reopening Clause  
  This clause **presupposes a measure-of-value theory** as an exception to nominalism. It implicitly accepts Aristotle’s view that money’s purpose is proportional equality, allowing courts to restore intended real value when inflation distorts it. It is **compatible with nominal-value rule only superficially**; by adjusting the nominal amount to offset purchasing power loss, it quietly subverts nominalism’s core. Crucially, it is **better justified as an Aristotelian correction** than mercy:  
  - Mercy would prioritize debtor relief indiscriminately, but the clause targets *proportional equality* (e.g., restoring "the real position the parties intended").  
  - Its constraints (40% threshold, long-term obligations) mirror Aristotle’s concession that money’s value "tends to shift less," making minor drifts tolerable.  
  - The official index provides the "common measure" Aristotle deemed essential, aligning with his demand for a stable standard.  

  #### (e) Aristotelian Alternative  
  **Summary**: Adopting Aristotle’s view—money as a conventional-but-stable measure for proportional exchange—would prioritize preserving purchasing power in obligations. Redenomination would not be neutral but would correct for cumulative inflation.  
  **Changes required**:  
  1. Replace nominal-value rule with a real-value principle: debts adjust automatically via the official index.  
  2. Repeal bans on private indexation (to foreign currencies/commodities) and permit the reference basket for contracts.  
  3. Redefine redenomination: not "divide by 1,000," but "adjust by cumulative inflation since contract inception."  
  4. Cap or prohibit interest (per Aristotle’s "unnatural" critique), allowing only risk-based fees.  
  5. Mandate state indexation for all obligations (bonds, taxes, pensions) to ensure consistency.  
  **Gains**: Achieves proportional justice; aligns state/citizen treatment; legitimizes money as a reliable measure.  
  **Losses**: Increased complexity; reduced credit availability (if interest capped); state cannot inflate away debt.  
  **Verdict**: **Adapt** selectively. Aristotle’s theory exposes nominalism’s unfairness but overcorrects by demanding perfect stability. Retain the equitable clause as a compromise, extend indexation rights to private parties, and cap interest only for predatory lending.  

