answer: |-
  Below is a complete session plan designed to meet your requirements. It uses physical tokens (paper counters) and sweets to simulate multi-level selection dynamics without lectures or technical terms until the debrief. The game has adjustable assortment (mixing vs. group isolation) and a currency wrinkle (total vs. average output) to highlight core tensions.  

  ---

  ### **Session Overview**  
  - **Duration:** 90 minutes (60 min gameplay + 30 min debrief)  
  - **Participants:** 12–30 people (teens count tokens, adults strategize; rotate roles).  
  - **Materials per Group:**  
    - 4–6 *player tokens* (paper circles: ♡=Cooperator, ♢=Selfish; 50% ♡ initially).  
    - 1 *neutral marker* (stickers: ⬤=red, ⬤=blue; randomly assigned, no fitness effect).  
    - *Offspring tokens* (blank paper circles).  
    - *Sweets* (rewards for "offspring" in winning groups).  
  - **Key Mechanics:**  
    - ♢ **always** out-reproduces ♡ *within* a group.  
    - Groups with more ♡ produce more *total offspring*.  
    - **Assortment dial:** New groups form from scrambled individuals (low assortment) or isolated offspring (high assortment).  
    - **Currency split:** Half the room uses *total offspring* to rank groups, half uses *average offspring*.  

  ---

  ### **Game Rules (Facilitator Script)**  
  **Round 0: Setup (5 min)**  
  - *You say:* "Split into groups of 4–6. Each group gets tokens: ~50% ♡ (cooperators), ~50% ♢ (selfish), and a random colored dot (⬤/⬤). This dot does nothing—just track it."  
  - *Helper* distributes materials. Record starting ♡/♢/⬤/⬤ counts publicly (whiteboard/chart paper).  

  **Round 1: Low Assortment (Random Mixing) (15 min)**  
  1. **Reproduction:**  
     - *You say:* "In your group, ♢ produces 3 offspring, ♡ produces 1. But ♡ boosts your group’s *total* output: add +1 offspring for every ♡ present."  
       - *Example:* A group (3♡, 1♢) gets: (3♡ × 1) + (1♢ × 3) + (3♡ bonus) = 9 offspring.  
     - Groups calculate offspring, create tokens, and record ♡/♢/⬤/⬤ inherited (e.g., if parent is ♡⬤, offspring are ♡⬤).  
  2. **New Groups:**  
     - *All offspring go to a central pool.* Shuffle and redistribute randomly into new groups of 4–6.  

  **Round 2: High Assortment (Group Isolation) (15 min)**  
  1. **Reproduction:** Same as Round 1.  
  2. **New Groups:**  
     - *You say:* "Offspring stay with their parent group. Each group forms its own new group—no mixing."  
     - Groups use their offspring to found new groups (ignore leftovers not making a full group).  

  **Round 3: Currency Wrinkle (15 min)**  
  - *You say:* "Rank your group against others. **Half the room:** Rank by *total offspring*. **Other half:** Rank by *average offspring* (total ÷ group size)."  
  - **Reproduction:** Same as before.  
  - **New Groups:** Scramble offspring into central pool, redistribute randomly.  
  - **Group Reward:** Top-ranked groups by *each metric* get sweets.  

  **Round 4: Optional "Selfish Gene" (10 min)**  
  - *Add a 3rd level:* "Some ♢ have a ✪ symbol (randomly assigned 25%). ✪ doubles *its own* offspring but reduces *group total* by 3."  
    - ✪ modifies ♢: If ♢ has ✪, it produces 6 offspring (not 3), but group loses 3 total offspring.  
    - Track ✪ inheritance (offspring of ✪ parents get ✪).  
  - New groups: Scramble or isolate (your choice; scramble is faster).  

  ---

  ### **Debrief Structure (30 min)**  
  **Step 1: Map Observations to Concepts (15 min)**  
  - *Ask:* "What happened to cooperators (♡) in each round? Why?"  
    - **Round 1 (low assortment):** ♡ ↓ (selfish win within groups).  
    - **Round 2 (high assortment):** ♡ ↑ (groups with many ♡ dominated reproduction).  
    - **Round 3 (currency):** *Total* groups ranked high-♡ groups best; *average* groups ranked mixed/selfish groups best.  
    - **Round 4 (✪):** ✪ spread but hurt groups (gene-level vs. group-level tension).  
  - **Key insights:**  
    - Assortment (mixing vs. isolation) determines whether ♡ or ♢ win.  
    - "Group success" depends on the metric (total vs. average).  
    - Neutral markers (⬤/⬤) fluctuated randomly—frequency change ≠ adaptation.  

  **Step 2: Introduce Terminology (10 min)**  
  - *Now* use technical terms:  
    - **Within-group selection:** ♢ outcompeted ♡ in every group.  
    - **Between-group selection:** High-assortment rounds created variation between groups, letting high-♡ groups "win".  
    - **Currency debate:** Total output vs. average output represent competing definitions of "group fitness."  
    - **Kin selection:** When someone says, "But in hives, workers are sisters!," affirm: *"Yes! High relatedness (assortment) is why cooperation evolves—it aligns within-group and between-group incentives."*  

  **Step 3: Handle Tensions (5 min)**  
  - **What the game CAN’T do:**  
    - All views (gene/individual/group) are mathematically valid; the debate is about *which level drives adaptation*. Say: *"This isn’t about right/wrong—it’s about which lens clarifies the biology. In bees, kinship makes group-level effects powerful."*  
  - **Predictable issues:**  
    - If teens/adults disengage: Rotate counting/strategy roles each round.  
    - If scramble rounds feel "rigged": Emphasize that assortment is a real variable (e.g., bee swarms vs. panmixis).  
    - If players say "it depends on the numbers": Agree! The math determines the outcome, but the biology determines the math.  

  ---

  ### **Why This Works**  
  - **No front-loading:** Players experience selection tensions physically before naming them.  
  - **Assortment dial:** High/low assortment visibly flips cooperator fate.  
  - **Currency wrinkle:** Groups self-discover that "group success" is ambiguously defined.  
  - **Selfish gene (✪):** Illustrates gene-level selection without complexity.  
  - **Neutral markers:** Show drift ≠ selection.  
  - **Debrief:** Turns shouts into "aha!"s by validating kitchen-table insights with precise terms.  

  **Prep Tips:**  
  - Pre-calculate offspring examples for common group compositions (avoid math panic).  
  - For >20 players, have helpers manage token redistribution.  
  - Use sweets strategically to keep teens/adults engaged.  

  This design forces players to *feel* the multi-level tug-of-war—and leaves them arguing not in the kitchen, but about the profound biology of superorganisms.
