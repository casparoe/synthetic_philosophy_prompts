  We, representatives of Camp S (self-sampling) and Camp I (self-indication), after extensive discussion, present the following joint statement.

  ### 1. Agreed Claims

  1. Anthropic reasoning is necessary in cases where the existence of observers is contingent on the hypothesis under consideration.
  2. In the absence of anthropic considerations, standard Bayesian updating applies.
  3. The choice of reference class (which set of observers to consider) is a significant and unresolved problem in anthropic reasoning.
  4. The two test cases (Swarm vs. Marathon and The Smear) are valid and challenging thought experiments that highlight key differences between our positions.
  5. In the test cases, the physical evidence and priors are stipulated to be equal (1:1), so any posterior difference is due solely to anthropic factors.
  6. In the Swarm vs. Marathon case, every experience in both theories is subjectively indistinguishable, including apparent memories and the sense of time passage.
