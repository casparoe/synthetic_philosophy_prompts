prompt: |-
  At the investing-and-forecasting reading group I go to, people repeat that 'Kelly betting maximizes your long-run growth rate' as if that closed the discussion. It came up last week about a favourable-coin game: each round you may stake any fraction of your current bankroll at even odds, winning the stake with probability 0.6 and losing it otherwise — so the usual Kelly fraction is 20% — but with a hard floor: if your bankroll ever falls below 10% of its starting value, the game ends and you walk away with nothing. Someone said this shows that staking anything other than 20% is straightforwardly irrational, and that those of us who wanted a smaller fraction were 'paying a volatility tax for nothing'.

  I'd like a disambiguation rather than a verdict. What distinct precise theses could that slogan be expressing — about which quantity is supposedly maximized (expected log wealth per round, the almost-sure asymptotic growth rate, the median or mode of the wealth distribution, the probability of being ahead after a fixed number of rounds), about which class of rival strategies it is compared against, and about what horizon and what sense of 'beats'? For each reading on that menu, say whether it is true, whether it is a near-platitude or a substantive result, and whether it would really license the step from 'not Kelly' to 'irrational' rather than merely to 'aimed at something else'.

  Then say how the 10% floor interacts with all this. Does it leave the optimal constant fraction unchanged, does it make the optimal stake state-dependent rather than a fixed fraction of wealth, and in which direction does it push someone whose bankroll is currently close to the floor? Assume I know the standard derivation of the Kelly fraction, so don't re-derive it.
reasoning: |-
  We are discussing the Kelly criterion in the context of a favorable coin game (probability of win = 0.6, even odds) with a hard floor: if the bankroll falls below 10% of the starting value, the game ends and the player gets nothing.

  The standard Kelly fraction for this game (without a floor) is 20% (f* = p - q = 0.6 - 0.4 = 0.2). However, the presence of a floor changes the situation.

  The slogan "Kelly betting maximizes your long-run growth rate" can be interpreted in several ways. Let's break it down.

  1. **Expected Logarithm of Wealth per Round (Asymptotic):**
     - The Kelly strategy maximizes the expected value of the logarithm of wealth in each round (asymptotically). This is the standard derivation: by maximizing E[log(1+f*X)] where X is the return (here, +1 with prob 0.6, -1 with prob 0.4), we get the Kelly fraction.
     - Without a floor, this leads to the highest asymptotic growth rate (almost surely) and also maximizes the expected log wealth at any finite time (if we start with the same initial wealth and use a constant fraction strategy).
     - This is a substantive result (not a near-platitude) and holds for constant fraction strategies in the infinite horizon without ruin constraints.
     - However, without the floor, the Kelly fraction is indeed optimal for maximizing long-run growth. But note: the Kelly strategy does not avoid ruin (if the fraction is positive, there is a positive probability of ruin in the long run, but in the favorable game the probability of ruin goes to zero as the number of rounds increases? Actually, with positive fraction and repeated play, the probability of ruin is positive but the growth rate is positive so the wealth grows without bound with positive probability. But note: in the standard Kelly without floor, ruin (wealth approaching zero) is possible but the probability of ruin is less than 1. However, with the floor we have an absorbing barrier at 10% of initial wealth.

  2. **Almost Sure Asymptotic Growth Rate:**
     - The Kelly strategy achieves the highest almost sure limit of (1/n)*log(W_n) as n goes to infinity (where W_n is the wealth at time n). This is a direct consequence of the law of large numbers applied to the log returns.
     - This is true and substantive. However, it requires that the game continues indefinitely without a floor. With the floor, the game stops at ruin, so the asymptotic growth rate is not defined for paths that hit the floor.

  3. **Median or Mode of the Wealth Distribution at a Fixed Horizon:**
     - Kelly does not necessarily maximize the median or mode of wealth at a fixed finite horizon. In fact, for finite horizons, other strategies might have a higher median or mode. For example, a strategy that bets less than Kelly will have less variance and might have a higher median in the short run, but over the long run, Kelly will dominate in the median as well (if we avoid ruin). However, without the floor, the median wealth after n rounds for Kelly is typically higher than for any other constant fraction strategy in the long run. But note: the median is not the same as the mode. The mode might be maximized by a different fraction? Actually, the log-normal distribution is skewed, so the mode is less than the median. Kelly maximizes the median of the log wealth, which is the geometric mean, but not necessarily the median of the raw wealth? Actually, because the log is monotonic, the median of log wealth corresponds to the median of the geometric mean, but note: the median of the raw wealth is the exponential of the median of the log wealth? Not exactly: the median of a monotonic transformation is the transformation of the median. So if we let L_n = log(W_n), then the median of W_n = exp(median of L_n). Therefore, maximizing the median of log wealth (which Kelly does) also maximizes the median of the geometric mean of wealth? Actually, the Kelly strategy maximizes the growth rate of the median wealth in the long run? Yes, because the median of log(W_n) grows linearly with n at a rate equal to the expected log return. Therefore, Kelly maximizes the rate at which the median of log(W_n) grows, hence the median of W_n grows at the exponential of that rate. So in the long run, Kelly maximizes the median wealth? But note: this is only true if we don't hit ruin. With a floor, we must avoid ruin.

  4. **Probability of Being Ahead After a Fixed Number of Rounds:**
     - Kelly does not maximize the probability of being ahead after a fixed number of rounds. For example, a strategy that bets a very small fraction will have a high probability of being ahead (but by a small amount), while a strategy that bets too aggressively might have a lower probability of being ahead. In fact, for a fixed horizon, the probability of being ahead is maximized by a fraction that is less than Kelly? Actually, it depends. For a single round, the probability of being ahead is maximized by betting the entire bankroll (if the game is favorable) but that also has a high chance of ruin. For multiple rounds, it's more complex. Generally, Kelly does not maximize the probability of being ahead at a finite horizon.

  Now, the step from 'not Kelly' to 'irrational':

  - Without the floor, the Kelly strategy is rational for an agent who wishes to maximize the long-run growth rate of wealth (and who has a logarithmic utility function). However, if an agent has a different utility function (e.g., risk-averse with respect to log wealth) or a different objective (e.g., minimizing the probability of ruin, or maximizing the probability of reaching a certain goal), then a different fraction might be rational.

  - With the floor, the situation changes: the possibility of ruin (hitting the floor) and losing the entire future play (and walking away with nothing) makes the problem state-dependent. The optimal strategy is no longer a constant fraction. It becomes state-dependent: when the bankroll is close to the floor, one should bet a smaller fraction to avoid ruin.

  How the 10% floor interacts:

  1. **Does it leave the optimal constant fraction unchanged?**
     - No. The presence of the floor (ruin) means that even the constant fraction that maximizes the long-run growth rate without the floor might lead to a high probability of ruin. Therefore, a constant fraction strategy that is less than Kelly might be better because it reduces the risk of ruin.

  2. **Does it make the optimal stake state-dependent?**
     - Yes. The optimal strategy now depends on the current bankroll relative to the floor. When the bankroll is far above the floor, one might bet close to the Kelly fraction. But when the bankroll is close to the floor, one should bet less to avoid crossing the floor.

  3. **Direction for someone close to the floor:**
     - If the bankroll is close to the floor (say, just above 10% of the starting value), then the agent should bet a very small fraction (possibly zero) to avoid ruin. This is because the cost of ruin (losing all future opportunities and leaving with nothing) is very high.

  Therefore, in the presence of the floor, the constant fraction Kelly strategy (20%) is no longer optimal. The group member's assertion that staking anything other than 20% is irrational is not valid in this setting. The Kelly fraction without the floor maximizes the long-run growth rate without considering ruin. With the floor, we must balance growth and the risk of ruin.

  Moreover, the slogan "Kelly betting maximizes your long-run growth rate" must be qualified:

  - Without ruin constraints, it maximizes the asymptotic growth rate (both in expectation and almost surely).
  - With ruin constraints, the unqualified slogan does not hold. The optimal strategy becomes state-dependent and typically involves reducing the bet size as the bankroll approaches the ruin level.

  In summary:

  - Without the floor, the Kelly fraction (20%) is optimal for maximizing the long-run growth rate (in the senses of 1 and 2 above). It is a substantive result and for an agent with logarithmic utility, it is rational. But for other objectives, it might not be.

  - With the floor, the optimal strategy is no longer constant fraction Kelly. It becomes state-dependent and more conservative near the floor. Hence, the group member's criticism of wanting a smaller fraction as "paying a volatility tax for nothing" is not justified because the smaller fraction (or state-dependent strategy) is rationally motivated by the risk of ruin.

  Therefore, the presence of the floor changes the optimal strategy and makes the constant Kelly fraction suboptimal. The slogan must be understood in the context of no ruin constraints.
answer: |-
  ### Disambiguation of "Kelly betting maximizes your long-run growth rate"

  The slogan is often invoked to defend Kelly betting as optimal, but its precise meaning and implications depend on context. Below, I disambiguate the key interpretations, their validity, and whether they justify labeling non-Kelly strategies as "irrational." I then address the impact of the 10% floor.

  ---

  #### **Interpretations of the Slogan: What is Maximized?**
  1. **Expected log-wealth per round (asymptotic)**  
     - **Thesis**: Kelly maximizes the expected value of the logarithm of wealth per round in the limit: \(\lim_{n \to \infty} \frac{1}{n} \mathbb{E}[\log W_n]\).  
     - **Validity**: True. This is the core result from the Kelly derivation (for constant fraction strategies without constraints).  
     - **Nature**: Substantive result (not platitude). Follows from maximizing \(G = \mathbb{E}[\log(1 + fX)]\), where \(X\) is the return.  
     - **Licenses "irrational" claim?** Only for agents solely focused on asymptotic expected log-wealth. Ignores other objectives (e.g., survival, short-term goals). Non-Kelly strategies are "aimed at something else," not necessarily irrational.  

  2. **Almost-sure asymptotic growth rate**  
     - **Thesis**: Kelly maximizes \(\lim_{n \to \infty} \frac{1}{n} \log W_n\) almost surely (a.s.).  
     - **Validity**: True. By the law of large numbers, \(\frac{1}{n} \log W_n \to \mathbb{E}[\log(1 + fX)]\) a.s. for constant fractions.  
     - **Nature**: Near-platitude (direct consequence of the expected log maximization).  
     - **Licenses "irrational" claim?** Similar to (1). Only applies if the game continues indefinitely without ruin. With finite horizons or risk of ruin, other strategies may be rational.  

  3. **Median or mode of terminal wealth**  
     - **Thesis**: Kelly maximizes the median (or mode) of \(W_n\) for large \(n\).  
     - **Validity**:  
       - *Median*: True for large \(n\). By the Central Limit Theorem, \(\log W_n\) is asymptotically normal, so maximizing \(\mathbb{E}[\log W_n]\) maximizes median log-wealth, hence median wealth (since log is monotonic).  
       - *Mode*: False. Kelly often produces a right-skewed distribution; lower-fraction bets may have higher modes (more probability mass on "typical" paths).  
     - **Nature**: Substantive for median; counterintuitive for mode (Kelly's mode is often suboptimal).  
     - **Licenses "irrational" claim?** No. An agent prioritizing the most likely outcome (mode) might rationally choose a fraction \(< 20\%\).  

  4. **Probability of being ahead after \(n\) rounds**  
     - **Thesis**: Kelly maximizes \(\mathbb{P}(W_n > W_0)\) for fixed \(n\).  
     - **Validity**: False. For finite \(n\), a smaller fraction often has a higher probability of being ahead. For example, with \(p = 0.6\) and \(n = 20\), betting \(10\%\) may yield \(\mathbb{P}(W_n > W_0) \approx 0.99\), while Kelly (\(20\%\)) yields \(\approx 0.97\) (due to lower volatility).  
     - **Nature**: Substantive result (but contradicts the slogan).  
     - **Licenses "irrational" claim?** No. An agent wanting high survival probability or steady gains might rationally choose a smaller fraction.  

  ---

  #### **Class of Rival Strategies and Horizon**
  - **Class of strategies**: The slogan typically compares constant-fraction strategies (i.e., fixed fraction of wealth bet each round). It does not generally apply to:  
    - Time-dependent strategies (e.g., decreasing \(f\) over time).  
    - State-dependent strategies (e.g., varying \(f\) based on bankroll).  
    - Non-fractional strategies (e.g., fixed-dollar bets).  
  - **Horizon**: The slogan assumes infinite horizons. For finite horizons or ruin-constrained settings, Kelly is often suboptimal.  
  - **Sense of "beats"**: Refers to dominance in the limit (\(n \to \infty\)). Kelly does *not* necessarily "beat" other strategies in finite samples or under risk constraints.  

  ---

  #### **Is Non-Kelly "Irrational"?**  
  - **Without ruin constraints**: Kelly is optimal *only* for agents who:  
    - Have logarithmic utility (i.e., maximize asymptotic growth).  
    - Tolerate arbitrary volatility (no risk of ruin).  
    - Prioritize the long-run limit.  
  - **Rationality claim**: Labeling non-Kelly as "irrational" assumes all agents share these preferences. This is false:  
    - A risk-averse agent might prefer lower volatility.  
    - An agent with short-term goals might prioritize finite-horizon performance.  
    - **Conclusion**: The step from "not Kelly" to "irrational" is invalid. Non-Kelly strategies are "aimed at something else," not inherently irrational. The "volatility tax" critique ignores legitimate risk preferences.  

  ---

  #### **Impact of the 10% Floor**  
  The floor (\(W_t < 0.1 W_0\) ends the game with \(W = 0\)) fundamentally changes the problem:  

  1. **Optimal fraction unchanged?**  
     - No. The constant Kelly fraction (\(f^* = 20\%\)) is no longer optimal. It ignores the risk of hitting the floor, which terminates future growth.  

  2. **State-dependent strategy?**  
     - Yes. The optimal strategy becomes state-dependent:  
       - **Far above the floor**: Bet close to \(20\%\) (growth dominates).  
       - **Close to the floor**: Bet a smaller fraction (even \(0\%\)) to avoid ruin.  
     - *Why?* Near the floor, the cost of ruin (losing all future growth) outweighs the growth benefit.  

  3. **Direction near the floor**  
     - **Optimal action**: When \(W_t\) is close to \(0.1 W_0\), bet a fraction \(\ll 20\%\) (possibly \(0\%\)). Volatility reduction becomes critical to survival.  
     - **Example**: If \(W_t = 0.11 W_0\), betting \(20\%\) risks ruin with probability \(0.4\) in one round, ending the game. Betting \(5\%\) reduces this risk.  

  4. **Overall effect**  
     - **Without floor**: Kelly maximizes growth but accepts a positive ruin probability.  
     - **With floor**: Growth maximization requires avoiding ruin. Optimal play reduces bets near the floor, lowering long-run growth expectations but increasing survival probability.  
     - **Critique rebuttal**: Those advocating fractions \(< 20\%\) are not "paying a volatility tax for nothing"—they are rationally avoiding catastrophic ruin.  

  ---

  ### Summary  
  - **Slogan truths**: Kelly maximizes asymptotic expected log-wealth and almost-sure growth rate *for constant fractions without ruin constraints*. This is a substantive result but narrow.  
  - **Slogan falsehoods**: Kelly does not maximize finite-horizon performance, modal wealth, or survival probability.  
  - **Rationality**: Non-Kelly strategies are not irrational; they serve different objectives (e.g., survival, short-term gains).  
  - **Floor impact**: The \(10\%\) floor invalidates constant Kelly betting. Optimal play becomes state-dependent, advocating conservative bets near the floor.  

  In your reading group, the critique that non-Kelly bettors are "irrational" reflects a misunderstanding: the slogan applies only to unconstrained asymptotic growth. With the floor, reducing volatility is rational risk management.
