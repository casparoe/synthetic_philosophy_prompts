prompt: |-
  My partner's Norwegian and insists Norway is the more liberal of the two. I say that's patriotism talking. She's at maybe 0.2 on Sweden being more liberal, I'm at 0.7, and I've slowly realised we might not even be arguing about the same thing: 'liberal' is doing at least three jobs here — how much the state coerces economically, how permissive things are on social/cultural policy, and how strongly minorities are fenced off from majorities by constitutional structure — and my guess is Sweden takes the second, maybe loses the third, and the first is murkey because both are big-state social democracies.

  Give me your own number on the flat claim 'Sweden is the more liberal country', decomposed. I want your weights over the senses of liberal (and say what would count as settling which sense is the real one — I don't think that's pure taste, but maybe it is), then within each sense your credence that Sweden comes out ahead, then how it combines. Work from what you already know, don't cite statistics, and flag which of your numbers are basically ignorance priors.

  Then run my mirror test on it: instead of comparing the policies where they sit, ask how each country's actual policies would be recieved if somebody proposed them tomorrow in the other one's parliament. I worry it just returns 'each looks radical to the other' in different areas — if it does, is that a defect in the test, or a sign the original question isn't well-posed?

  Last: does our 0.7-vs-0.2 gap most likely live in the weights over senses or in the within-sense facts, and which single term, if we pinned it down, would shrink the gap most?
