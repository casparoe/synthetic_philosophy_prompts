  #### **Tree Notes**  
  - **Unseparated Leaves**:  
    - *Symmetric Debunking (Leaf 5)* and *Asymmetric Debunking (Leaf 6)* can be reached via identical paths (e.g., Q1 No → Q5 No → Q7). This is **not incoherent**—it reflects that debunking symmetry is a standalone choice.  
