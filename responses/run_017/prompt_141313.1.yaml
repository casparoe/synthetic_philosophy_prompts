  Below is a decision-tree handout designed for your reading group session. It starts from the premise that Moral Foundations Theory (MFT) accurately describes psychological variation between left and right, and leads participants to named epistemic positions using concrete cases. The tree has **6 branch questions** and **7 leaves**, with splits addressing tracking, coverage vs. sensitivity, binding foundations' status, debunking symmetry, and your preferred procedural view. Cases are framed to avoid MFT jargon, and answers route users to positions where wide-sensitivity psychology (conservative-leaning, under current findings) is sometimes epistemically better, sometimes worse.  

