  ### **Decision Tree: Does Moral Psychology Tell Us Who Is Right?**  
  *Start with: "MFT is roughly right—conservatives use all six foundations evenly, liberals prioritize care/harm, fairness, liberty."*  

  #### **Branch Questions**  
  1. **Toilet Flag Case**: A person cleans their toilet with their national flag in complete privacy (no one sees, no harm). Is this *inherently* wrong?  
     - **Yes** → It suggests foundations track something real (go to Q2).  
     - **No** → Foundations might not track moral truth (go to Q5).  

  2. **Cousin Hiring Case**: A family firm hires a less qualified cousin over a more qualified stranger, harming no one. Is this *always* morally acceptable due to loyalty?  
     - **Yes** → Binding foundations (loyalty/authority/sanctity) may track genuine reasons (go to Q3).  
     - **No** → Binding foundations may be mere evolutionary heuristics (go to Q4).  

  3. **Village Burial Case**: A village buries its dead within 24 hours, ignoring modern science showing delays are safer. Is this tradition intrinsically valuable?  
     - **Yes** → Binding foundations likely track genuine moral reasons (go to Q6).  
     - **No** → Binding foundations may be useful but not truth-tracking (go to Q4).  

  4. **Art Desecration Case**: An artist mocks a religion’s sacred symbol in a way that offends believers but causes no tangible harm. Is the offense a *moral* harm, or just psychological?  
     - **Moral harm** → Binding foundations may track genuine reasons (go to Q6).  
     - **Psychological only** → Binding foundations are likely heuristics (go to Q7).  

  5. **Deliberation Case**: Should societies *always* include loyalty/authority/sanctity arguments in moral debates (e.g., laws, policies), even if you doubt their truth?  
     - **Yes** → Foundations may guide procedures, not truth (go to Leaf 4: **Deliberative Scaffolding**).  
     - **No** → Reject procedural role (go to Q7).  

  6. **Factory on Sacred Land Case**: A factory on sacred tribal land causes no harm/fairness violations and helps the economy. Is blocking it justified *primarily* by:  
     - **Covering more moral factors** (e.g., sanctity) → Wide sensitivity sees more reasons (Leaf 1: **Coverage Conservatism**).  
     - **Better-calibrated intuition** (e.g., tradition) → Wide sensitivity has superior discernment (Leaf 2: **Sensitivity Conservatism**).  

  7. **Debunking Symmetry Case**: If cultural evolution shaped *all* moral intuitions, does it undermine:  
     - **All intuitions equally** → No epistemic advantage (Leaf 5: **Symmetric Debunking**).  
     - **Binding intuitions more** → Individualizing foundations less undermined (Leaf 6: **Asymmetric Debunking**).  

  ---

  #### **Leaf Positions**  
  1. **Coverage Conservatism**  
     - *Epistemic claim*: Wide-sensitivity psychology (conservative) is better—it accesses more moral reasons, reducing blind spots.  
     - *Awkward commitment*: Must accept that harmless acts (e.g., private flag desecration) can be deeply immoral.  
     - *Path*: Q1 Yes → Q2 Yes → Q3 Yes → Q6 "Covering more factors".  

  2. **Sensitivity Conservatism**  
     - *Epistemic claim*: Wide-sensitivity psychology is better—cultural evolution better calibrates intuitions (e.g., tradition refines authority).  
     - *Awkward commitment*: Must defend practices like cousin hiring as morally wise, even when inefficient.  
     - *Path*: Q1 Yes → Q2 Yes → Q3 Yes → Q6 "Better-calibrated intuition".  

  3. **Epistemic Noise**  
     - *Epistemic claim*: Wide-sensitivity psychology is *worse*—more foundations add bias/confusion, not insight (e.g., burial traditions ignore science).  
     - *Awkward commitment*: Must reject binding concerns (e.g., sacred land) as distractions, even when deeply felt.  
     - *Path*: Q1 Yes → Q2 Yes → Q3 No → Leaf 3 (direct).  

  4. **Deliberative Scaffolding** (your view)  
     - *Epistemic claim*: Psychology tells us *nothing* about who is right but *does* inform procedures: include all foundations in deliberation to avoid marginalizing groups.  
     - *Awkward commitment*: Must platform arguments you deem false (e.g., "sanctity" against LGBTQ+ rights) to ensure inclusive debate.  
     - *Path*: Q1 No → Q5 Yes → Leaf 4 (direct).  

  5. **Symmetric Debunking**  
     - *Epistemic claim*: Cultural evolution debunks *all* intuitions equally—no side is more reliable.  
     - *Awkward commitment*: Moral disagreement is intractable; no progress possible via intuition.  
     - *Path*: Q1 No → Q5 No → Q7 "All intuitions equally" OR Q1 Yes → Q2 No → Q4 "Psychological only" → Q7 "All intuitions equally".  

  6. **Asymmetric Debunking**  
     - *Epistemic claim*: Individualizing foundations (care/fairness) are less debunked—they track tangible harms, unlike heuristic-based binding foundations.  
     - *Awkward commitment*: Harmless "desecration" (e.g., art) is never immoral, even if it feels sacred.  
     - *Path*: Q1 No → Q5 No → Q7 "Binding intuitions more" OR Q1 Yes → Q2 No → Q4 "Psychological only" → Q7 "Binding intuitions more".  

  7. **Binding Blindness**  
     - *Epistemic claim*: Narrow-sensitivity psychology (liberal) is better—binding foundations are heuristics that distort judgment (e.g., cousin hiring is nepotism).  
     - *Awkward commitment*: Traditions (e.g., rapid burial) lack moral weight; only consequences matter.  
     - *Path*: Q1 Yes → Q2 No → Leaf 7 (direct).  

