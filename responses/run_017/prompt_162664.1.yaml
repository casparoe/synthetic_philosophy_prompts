prompt: |-
  I have been reading rationalist blogs and forum threads on Bayesian epistemology for something like fifteen years — the sequences, the old comment wars, and more recently a small forecasting league I help run, where participants routinely issue conditional forecasts (if the treaty is ratified, then the currency peg survives) and we argue about how to score them — and the same thing happens every time a thread turns to what it means to put a probability on an indicative conditional. Someone asserts that the probability of if A, B just is the conditional probability of B given A; someone else says that identity was refuted decades ago by Lewis's triviality arguments; a third person mentions Adams, or closest-world selection-function semantics, or the idea that conditional probabilities are primitive rather than derived; and the thread stalls at the level of brand names without anyone saying what a theory of the probability of a conditional is supposed to do. So before I read any more of the literature, I want the specification rather than the menu.

  Write me the desiderata for a theory of the probability of an indicative conditional: what any adequate account has to deliver, each paired with the case or consideration that makes it a requirement rather than a taste. I want the requirements to carry the weight here, not the scorecard, though two or three lines on the main candidate families at the end is welcome. In particular, say which of the things people routinely demand are genuine desiderata and which are the prejudices of one camp. Compositionality, for instance: a conditional occurring inside Boolean compounds and inside further conditionals, so the theory must make sense of the probability of if A then B, or if C then D — is that a requirement, or an artifact of assuming in advance that conditionals express propositions? Is a unified treatment of indicatives and counterfactuals required, or is that a preference a theory of indicatives may decline? Is it a desideratum that the probability of if A, B be defined when P(A) is zero or infinitesimal, or is leaving it undefined an acceptable cost, given that the near-miss cases (if the dam had held, if the launch had been scrubbed) are exactly the ones where people report the firmest probabilities? I suspect the deliberational cases matter and I almost never see them raised: when the antecedent describes an action the speaker is even now deciding whether to perform (if I were to press the button, if I pay the hundred dollars), conditional probability looks like the wrong object entirely, since an agent who has not yet settled on A has no stable unconditional P(A) to condition on, and yet agents hold firm credences in such conditionals and act on them. And I want a requirement — or a debunking of the apparent requirement — from the forecasting side: if a conditional forecast is scored only on those occasions where the antecedent is realized, is calibration over that subclass, or expected accuracy under a proper scoring rule, the standard an account of the probability of conditionals has to meet?

  The part I most want, though, is the negative result. As I understand them, Lewis's triviality arguments show that a cluster of plausible-looking constraints — that identity with conditional probability, the conditional's being a proposition in the algebra, closure under Boolean operations, and non-collapse of the probability space into a handful of atoms — cannot all hold together. So I want the list to be honest about which subsets are jointly unsatisfiable, with the minimal inconsistent subset identified and the assumption doing the damage named: I would rather watch the desiderata turn into a theorem than have the list quietly presuppose that some escape hatch has already been taken. Relatedly, tell me whether the choice between conditioning and imaging as the operation of supposing A is itself a desideratum or a disguised decision about semantics. My understanding is that if you revise by Lewis's imaging rule, moving each world to its closest A-world, the resulting probability of B just is the probability of the Stalnaker conditional, which is one route to letting the probability of the conditional come apart from the conditional probability; if that is right, what does it cost elsewhere — imaging does not commute with ordinary conditioning, or does not compose the way updating should, or something in that vicinity, and I want the cost stated properly rather than gestured at. I also want your view on conditional bets: if every payoff a bet on the conditional could deliver is replicable by a bet on B conditional on A, does that drain the identity of content, or does the price of a bet on the conditional remain a quantity a theory is obliged to predict? Finally, which single requirement on your list excludes the largest number of live candidates, and which two do you expect defenders to quietly drop? Please argue from the cases, and do not give me a reading list or a set of references — I have no library access and want the reasoning, not the citations.
reasoning: |-
  Okay, let me tackle this user's deep dive into Bayesian epistemology and indicative conditionals. They've been wrestling with this for 15 years, from LessWrong sequences to forecasting leagues, and they're frustrated with how discussions always stall on brand names without clear criteria. 

  First, I need to understand their core request: they want desiderata - the non-negotiable requirements for any theory of indicative conditionals' probability, with concrete cases justifying each. No literature surveys, just the conceptual groundwork. 

  Hmm, they're highlighting several pain points: compositionality (can conditionals nest?), counterfactual unification (must indicatives and counterfactuals share a theory?), zero-probability antecedents (what if P(A)=0?), deliberational conditionals (when A is undecided action), and scoring conditional forecasts. And crucially, they want the negative result from Lewis' triviality laid bare - which assumptions actually conflict.

  The forecasting angle is particularly interesting. When scoring "if A then B" predictions only when A happens, calibration over that subpopulation seems essential. But does that imply P(if A,B) must equal P(B|A)? Not necessarily - the user's own example shows conditional forecasts can be evaluated this way regardless of the semantic theory. 

  For deliberational cases like "if I press the button...", conditional probability seems problematic because the agent hasn't fixed P(A). Yet people hold firm credences here. This suggests a requirement: the theory must handle suppositions about one's own contingent actions. 

  On compositionality - the user asks if demanding Boolean compounds is just assuming conditionals are propositions. I think it's a genuine requirement because people do say things like "either if A then B or if C then D" and assign probabilities. But maybe some theories can satisfy this without full propositionality? 

  Lewis' triviality is key. The user wants the minimal inconsistent set of assumptions. Let me recall: if (1) conditionals have truth values, (2) P(if A,B) = P(B|A) always, (3) probabilities are Kolmogorov, and (4) the algebra isn't trivial, you get contradiction. The killer is that P(B|A) isn't a probability function over A-worlds in the way required for (1)-(3).

  For imaging vs conditioning: the user notes imaging gives Stalnaker conditionals. But imaging costs commutativity - supposing A then B isn't the same as B then A. That matters for sequential reasoning. 

  Conditional bets: if a bet on "if A,B" can be replicated by conditional bets on B given A, does that make P(if A,B) = P(B|A) redundant? Not quite - replication doesn't imply identity of meaning, just pricing equivalence in simple cases. 

  Now, which desiderata exclude most theories? Compositionality eliminates Adams-style non-propositional accounts. Zero-probability antecedents kills simple conditional probability. Deliberational cases challenge any theory needing precise P(A). 

  The user seems sophisticated but weary of ungrounded debates. They want the steelmanned requirements laid bare so they can evaluate theories themselves. No handwaving - they want the conceptual machinery exposed, especially the failure points. 

  I'll structure this by first listing the indispensable requirements with their justifying cases, then the trade-offs, then the negative result dissected, and finally which requirements are the sharpest knives. The forecasting and deliberational cases deserve special attention since they're underdiscussed in literature. And I must emphasize where desiderata conflict - no hiding the tensions.
answer: |-
  Here are the core desiderata for any theory of the probability of indicative conditionals, derived from conceptual requirements and real-world use cases. Each is paired with the case that necessitates it, avoiding partisan assumptions. The negative result (Lewis triviality) is dissected in the requirements themselves.

  ### Core Desiderata (Non-Negotiable)
  1. **Antecedent Probability Dependence**  
     *Requirement*: The probability of "if A, B" must depend on the agent's epistemic state regarding A and B.  
     *Case*: When P(A) ≈ 0 (e.g., "if this uranium sphere spontaneously liquefies in the next minute..."), agents still assign meaningfully low probabilities to such conditionals. A theory that makes P(if A,B) undefined or arbitrary here fails descriptively.

  2. **Suppositional Calibration**  
     *Requirement*: When P(A) > 0, P(if A, B) must equal P(B|A) *in non-dynamic contexts*.  
     *Case*: Conditional forecasts scored only when A occurs (e.g., "if the treaty is ratified, the peg survives" → scored iff ratification happens). For calibration over the A-subclass, P(if A,B) *must* match P(B|A) to avoid exploitable inaccuracy.  
     *Caveat*: This holds when the agent's beliefs are stable *during* the supposition.

  3. **Deliberational Adequacy**  
     *Requirement*: Must handle agents conditioning on their *own contingent actions* (e.g., "if I press this button, the light turns on") when P(A) is unsettled.  
     *Case*: An agent deciding whether to press the button has no fixed P(A), yet bases decisions on P(if A,B). Theories requiring a precise prior P(A) fail here. Conditional probability alone is insufficient.

  4. **Non-Triviality Under Uncertainty**  
     *Requirement*: P(if A,B) must not collapse to 0 or 1 when 0 < P(A) < 1 and 0 < P(B|A) < 1.  
     *Case*: In forecasting ("if it rains, the game is canceled"), probabilities are routinely fractional. Lewis triviality shows this is incompatible with treating conditionals as propositions *if* identity with P(B|A) is demanded universally (see §Negative Result below).

  ---

  ### Trade-Off Desiderata (Theory-Dependent Costs)
  5. **Compositionality**  
     *Status*: **Not required** for adequacy, but a cost if absent.  
     *Case*: Nesting ("if A, then if B, C") or Boolean compounds ("if A,B or if C,D") occur in reasoning. Non-propositional theories (e.g., Adams) lack truth values for these, making probability assignment undefined. *But*: Humans handle such constructions imperfectly, so absence isn't fatal. Propositional theories pay with triviality risk.

  6. **Unified Counterfactuals**  
     *Status*: **Not required**.  
     *Case*: Counterfactuals ("if the dam had held...") often involve imaging (closest-world shifts), while indicatives ("if the dam holds...") use conditioning. Demanding unity ignores evidence that their probability mechanisms differ (e.g., historical vs. real-time evidence).

  7. **Zero-Antecedent Robustness**  
     *Status*: **Required**, but solutions vary.  
     *Case*: Near-miss counterfactuals (P(A)≈0) demand non-arbitrary probabilities. Popper functions (primitive conditional probabilities) or impossible-world semantics can satisfy this. Undefined probabilities are descriptively inadequate.

  ---

  ### The Negative Result: Lewis Triviality Dissected
  - **Minimal Inconsistent Set**:  
    (i) P(if A,B) = P(B|A) for all A,B in the algebra.  
    (ii) "if A, B" expresses a proposition (has a truth value).  
    (iii) Probability is Kolmogorov (P(B|A) = P(A∧B)/P(A) when P(A)>0).  
    (iv) The algebra is non-atomic (rich enough for non-trivial uncertainty).  
  - **Fatal Assumption**: (i) *universalized*.  
  - **Consequence**: (i)–(iv) imply P(B|A) is a probability function, forcing the space to be trivial (only atoms).  
  - **Escape Hatches**:  
    - Reject (ii): Conditionals aren't propositions (Adams).  
    - Restrict (i): P(if A,B) = P(B|A) only when P(A)>0 *and* no compositionality (Gibbard, Bacon).  
    - Reject (iii): Use primitive conditional probabilities (Popper).

  ---

  ### Imaging vs. Conditioning
  - **Imaging** (moving probability to closest A-worlds):  
    - Delivers P(if A,B) = P(B after imaging on A).  
    - Satisfies suppositional calibration only if imaging matches conditioning (rare).  
  - **Cost**: Breaks **Suppositional Dynamics**:  
    - *Failure Case*: Sequential suppositions ("suppose A, then suppose C") give different results if the order changes. Conditioning commutes (P(B|A,C) = P(B|C,A)); imaging does not.  
    - *Requirement*: For deliberative coherence (e.g., game-theoretic reasoning), order-independence is needed. Imaging fails here; conditioning succeeds.

  ---

  ### Conditional Bets
  - **Replicability Argument**:  
    A bet on "if A, B" that pays $1 iff A∧B, $0 iff A∧¬B, and is called off if ¬A, replicates a conditional bet on B given A.  
    - *Implication*: The *fair price* for both must be P(B|A), regardless of semantics.  
    - **Not a desideratum for meaning**: This constrains *betting behavior*, not the *content* of conditionals. Theories may assign P(if A,B) ≠ P(B|A) if they distinguish the conditional's truth from its betting profile (e.g., in non-propositional accounts).

  ---

  ### Most Exclusionary Desiderata
  1. **Compositionality**: Eliminates non-propositional theories (Adams).  
  2. **Non-Triviality + P(if A,B) = P(B|A)**: Eliminates propositional theories without escape hatches (trivialized by Lewis).  
  3. **Deliberational Adequacy**: Eliminates theories requiring fixed P(A) (standard Bayesian conditioning).  

  Defenders most often quietly drop **Compositionality** (embracing non-propositionality) or **Universal Identity** (allowing P(if A,B) ≠ P(B|A) for low P(A) or dynamic cases).

  ### Summary of Theories' Costs
  - **Adams-Style (Non-Propositional)**:  
    Pros: Avoids triviality, handles zero-antecedents via limits.  
    Cons: Compositionality impossible; probabilities undefined for compounds.  
  - **Stalnaker/Imaging (Propositional)**:  
    Pros: Compositionality, unified with counterfactuals.  
    Cons: P(if A,B) ≠ P(B|A) under imaging; fails suppositional dynamics.  
  - **Conditional = Conditional Probability (Restricted)**:  
    Pros: Matches betting and forecasting.  
    Cons: Requires P(A)>0; fails deliberational cases; compositionality risky.  

  The requirements force a trilemma: sacrifice compositionality, universal identity with conditional probability, or Kolmogorov probability. Your forecasting cases demand (2), deliberational cases demand (3), and near-misses demand (1) and (7). No theory satisfies all perfectly; adequacy depends on use-case dominance.
