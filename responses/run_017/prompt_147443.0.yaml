  Place and personal names pose a unique challenge because they can't be easily changed. The offense here is structural—systems (like email filters) or societal norms forcing avoidance, but individuals might still need to use the names. The problem is systemic rather than intentional, highlighting the clash between language processing tools and human communication.

  The user also compared it to taboo deformation in some cultures where words resembling the deceased's name are avoided. That’s similar in that sound triggers avoidance, but the reason is different (cultural vs. social offense). Both involve sound, but the motivations differ, so they're parallel phenomena rather than the same.

  I should synthesize these points into a coherent explanation, avoiding jargon. Emphasize that the core issue is the sound resemblance leading to social and practical barriers, separate from meaning or intent. The term "phonetic contamination" covers this, but since it's not widely known, I should define it clearly. Also, mention that written resemblance ("orthographic overlap") is a subset, especially relevant in digital contexts.

