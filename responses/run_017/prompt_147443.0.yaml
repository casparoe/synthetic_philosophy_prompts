answer: |-
  The phenomenon you're describing doesn't have a single, universally agreed-upon name in everyday language, but it's a recognized concept within linguistics and social dynamics. The most precise existing term is likely **phonetic contamination** or **sound-alike taboo**. This captures the core idea: an otherwise innocent word becomes tainted or unusable primarily because its *sound* (or sometimes its spelling) closely resembles that of a genuinely offensive term, regardless of its own meaning, history, or the speaker's intent.

  Here's a breakdown of what it is, what it isn't, and how it works:

  *   **What it is:** It's a form of linguistic avoidance driven by phonological (sound-based) or orthographic (spelling-based) resemblance to a taboo word. The offense arises not from the word itself, but from the *potential for mishearing or misinterpreting* its sound/shape as the taboo term. This creates a social risk. Listeners might be genuinely offended, or, more commonly, bystanders (or the speaker themselves) fear *appearing* offensive or insensitive. Because it's impossible to guarantee everyone will know the difference instantly, or that the resemblance won't be exploited by bad actors later, the word becomes functionally "radioactive." The coordination problem you identified is key: the safe path for everyone is to avoid the word altogether, even if its literal meaning is harmless and its origins are distinct. Your examples – "niggardly" (sounding like the N-word) and email filters blocking place names like "Scunthorpe" (due to the substring "cunt") or "Cockburn" – are classic cases. The school kids avoiding words containing syllables like "nig" or "fag" (even in words like "snigger" or "faggot" meaning a bundle of sticks, though the latter *does* have a problematic history as a slur) are reacting to this phenomenon.

  *   **What it is not:**
      *   **It's not the Euphemism Treadmill:** That process ("retarded" -> "mentally challenged" -> "intellectually disabled") is driven by the *meaning* of the word becoming tainted by association with the stigmatized concept it refers to. Phonetic contamination is purely about the *sound/shape* resembling a taboo word for a *different* concept. The meaning of the innocent word is irrelevant; it's collateral damage.
      *   **It's not Intentional Doublespeak/Innuendo:** When someone deliberately uses an ambiguous word hoping some audience hears the insult while maintaining plausible deniability (e.g., certain political dog whistles), that's an *intentional* act of communication. Phonetic contamination happens when the speaker *doesn't* intend the resemblance but is trapped by it anyway. The offense (or fear of offense) comes from the ambiguity itself, not the speaker's hidden message.
      *   **It's not (necessarily) Historical Load:** While some words become unusable due to a direct history as slurs (e.g., many racial epithets), phonetic contamination affects words with *no such history*. Their only "sin" is sounding like the bad word.
      *   **It's not (exactly) Name Avoidance Taboos:** While related because they also involve sound resemblance triggering avoidance, cultural taboos around deceased persons' names usually stem from beliefs about spiritual pollution or profound respect/grief, not the fear of social offense or appearing bigoted. The *mechanism* (sound resemblance -> avoidance) is similar, but the *reason* is different.

  *   **Addressing your specific questions:**
      *   **Written vs. Spoken Resemblance:** It matters, but both can trigger the effect. Spoken resemblance ("niggardly"/N-word) is often more potent in direct social interaction, as it evokes the taboo sound immediately. Written resemblance ("Scunthorpe") is more relevant in contexts like automated filters or online communication where text is scanned algorithmically or visually. People might tolerate saying "Scunthorpe" aloud more easily than typing it if they know the filter exists. However, strong written resemblance can also fuel spoken avoidance once people become aware of it.
      *   **Does knowledge of unrelated origins stop it?** Usually not. While knowing the etymology (like "niggardly" coming from Old Norse, unrelated to racial slurs) might reassure some individuals, it rarely rehabilitates the word broadly. The visceral reaction to the *sound* and the persistent *social risk* of being misunderstood or causing discomfort usually outweighs the etymological facts. The ambiguity remains: did you say the innocent word, or are you testing boundaries? Avoiding it is simpler and safer socially.
      *   **Intentional use for resemblance:** This is a different phenomenon. If someone uses "niggardly" *specifically because* it sounds like the N-word, hoping to hint at it or provoke a reaction while hiding behind deniability, that's **dog-whistling** or deliberate **innuendo**. They are exploiting the phonetic resemblance maliciously. Phonetic contamination, however, describes the *unintended* consequence and social pressure that renders the innocent word unusable *even for well-meaning people*. The initial act might be accidental; the resulting un-usability is the contamination.
      *   **Does it count for place/personal names?** Absolutely. This is where the problem becomes structural. Individuals can't easily swap out "Scunthorpe" or "Cockburn" for another name. The offense arises purely from the word's shape/sound resembling taboo terms. The "solution" often involves awkward circumlocutions ("that town in Lincolnshire"), filters causing real communication problems, or social pressure to avoid saying the name directly, despite its necessity. It highlights the clash between language as a practical tool and language as a carrier of social sensitivities.

  In essence, phonetic contamination is a social safeguard mechanism gone somewhat awry. It's the linguistic equivalent of refusing to carry a perfectly harmless object that vaguely resembles a weapon into a sensitive area – the risk of misunderstanding or causing alarm is too high, regardless of intent. The innocent word becomes a casualty of its own unfortunate sound. While the term "phonetic contamination" might sound academic, it accurately pins down the core issue: the contamination of a word's usability purely by the accident of its sound or spelling resembling something deeply taboo.
