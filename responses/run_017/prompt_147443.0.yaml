  The user also mentioned coordination problems—where people avoid the word because they fear others might misinterpret intent. That ties into pragmatic aspects: the speaker's intent vs. listener's perception. Even if the speaker means no harm, the ambiguity makes the word risky. This is different from semantic shift (like euphemism treadmill) because it's about sound, not meaning.

