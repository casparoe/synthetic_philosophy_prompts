  ### In-Class Activity: Isolating Projectibility in Goodman's New Riddle

  #### Activity Design: Betting Game with a Hidden Change Point
  **Objective**: Students confront the underdetermination of hypotheses by evidence (Goodman's "grue" problem) without questioning induction itself. The focus is on *which rule* the evidence supports.

  **Setup**:
  - **Groups**: Split the class into two teams:
    - **Team World (7 students)**: Generates the observation sequence using a hidden rule.  
    - **Team Bettors (7 students)**: Bets on the next observation after seeing the sequence.
  - **Rule**: The sequence follows a rule: Property **P** (e.g., "green") holds until a hidden change point **c**, then **Q** (e.g., "blue") holds afterward. **c** is fixed before the game but concealed from Bettors.
  - **c Selection**: **c** is drawn uniformly at random from **1 to 20** (e.g., roll a 20-sided die or use a RNG). *Example draw: c = 15*.
  - **Sequence**: Team World reveals observations one-by-one, starting at step 1. For **t ≤ c**, output **P**; for **t > c**, output **Q**.  
    - *Example sequence (c=15)*:  
      `[P, P, P, P, P, P, P, P, P, P, P, P, P, P, P, Q, Q, Q, ...]`  
      (15 "P"s followed by "Q"s).
  - **Betting and Scoring**:
    - After each observation **t**, Bettors wager on the **next observation (t+1)**.
    - Bettors submit a probability **p** that observation **t+1** is **P**.
    - Use a **quadratic scoring rule** (proper scoring):  
      - If **t+1** is **P**: Score = \(1 - (1 - p)^2\)  
      - If **t+1** is **Q**: Score = \(1 - p^2\)  
      *(Scores range from 0–1; maximizing expected score rewards truthful probability reporting)*.
    - Track scores to incentivize careful reasoning.

  **Procedure** (80 minutes total):
  1. **Intro (5 min)**: Explain rules. Emphasize: The sequence has a *stable hidden rule* (change point **c**), so the future *will* resemble the past—the only question is *how*.
  2. **Gameplay (25 min)**:
     - Team World draws **c** privately (e.g., c=15) and begins revealing the sequence step-by-step.
     - At each step **t** (after **t** observations), Team Bettors submit **p** (probability next is **P**).
     - After submissions, Team World reveals observation **t+1**.
     - Repeat until **t=16** (so Bettors see the transition at **t=16** if **c=15**).
  3. **Debrief (50 min)**: Guide discussion using gameplay outcomes (see below).

  ---

  ### Key Moments in Gameplay & Links to Goodman's Riddle
  **Hypotheses in Play**:  
  After **t** observations of **P**, the live hypotheses are:  
  - **H₁**: "**P** forever" (i.e., **c** is beyond the observation horizon).  
  - **H₂**: "**P** until **c > t**, then **Q**" (change happens later).  
  - **H₃**: "**P** until **c = t**, then **Q**" (change happens *now*).  

  **Why Disagreement Survives Every Observation**:  
  - No amount of **P**s eliminates **H₃** (change at **t+1**). After 15 **P**s, the data is *equally consistent* with:  
    - *All future* **P**s (if **c > 15**),  
    - *Immediate switch* to **Q** (if **c = 15**).  
  - **Goodman Link**: Like "all emeralds are green" vs. "all emeralds are grue" (where "grue" = green if observed before **t+1**, else blue), *both hypotheses fit the data perfectly*. Evidence alone cannot resolve the tie.

  **Why "Obvious" Answers Fail**:  
  | Reflexive Answer | Why It Fails | Goodman Connection |
  |------------------|--------------|-------------------|
  | **"Simplicity favors H₁!"** | "**P** forever" seems simpler—but "**P** until **c**, then **Q**" is equally simple *mathematically*. Simplicity here is subjective. | "Green" seems simpler than "grue" due to *entrenchment* (we’re used to color predicates, not time-indexed ones). |
  | **"H₃ is gerrymandered!"** | Defining **Q** as "not **P** after **c**" isn’t inherently gerrymandered—it’s just a disjunction. Rejecting it assumes **P** is "natural," but why? | "Grue" is accused of being artificial, but only because it’s *less entrenched* in our language. |
  | **"More P’s make H₁ likely!"** | With a uniform prior over **c**, after **t** **P**s:  
    `P(next is P) = (20 - t)/(21 - t)`  
    After 15 **P**s, `P(next P) = 5/6 ≈ 83.3%`—*but this depends entirely on the prior*. If **c** had an exponential prior, **H₃** could dominate. | Priors over hypotheses (e.g., favoring "green") are shaped by *past projectibility* of predicates, not logic. |

  **Why This Isn’t Hume’s Problem**:  
  - Hume questions if the future *must* resemble the past (induction’s justification). Here, we *assume* it does—the rule is stable. The problem is *underdetermination*: many rules fit the data, and we need a prior (entrenched in language/history) to choose.

  ---

  ### Predictable Problems & Limitations
  **What Will Go Wrong (First Run)**:
  1. **Bettors ignore the prior**: Many will assign **p ≈ 1** after ~10 **P**s, dismissing **H₃** ("It’s *obviously* always P!").  
     - *Why*: Humans overweight streak evidence and underweight structural uncertainty.  
     - *Fix*: After the game, show the Bayesian calculation: `P(next P) = (20 - t)/(21 - t)`. Contrast with student bets.

  2. **Confusion about scoring**: Students may not grasp how to maximize scores with truthful **p**.  
     - *Fix*: Pre-game demo with coin-flip examples.

  3. **Time crunch**: Running 15+ steps is tight.  
     - *Fix*: Stop after **t=10** and extrapolate ("What if we saw 15 **P**s?").

  **What the Game Can’t Reproduce**:  
  - The game **cannot replicate why "grue" feels contrived** (vs. "green"). Here, **P** and **Q** are symmetric labels—no inherent "weirdness."  
  - *You must state*: "Grue" seems artificial because it’s *disjunctive* (green before **T**, blue after) and *unentrenched*. But this is psychological, not logical. The game isolates the *underdetermination*, but the riddle’s full force needs your explanation of how language shapes priors.

  ---

  ### Debriefing Script (50 min)
  1. **Review gameplay (10 min)**:  
     - Plot student bets vs. Bayesian posterior `(20 - t)/(21 - t)` after each step. Highlight divergence at **t=10+**.  
     - Ask: "Why did bets stay below 100%? Why not bet **p=1** after 5 **P**s?"

  2. **Map to Goodman (25 min)**:  
     - Q: "After 15 **P**s, is the next observation **P** or **Q**?"  
       → *Data alone can’t decide*.  
     - Q: "Why did ‘simplicity’ or ‘no gerrymandering’ fail as tiebreakers?"  
       → *They presuppose entrenchment*.  
     - Q: "How is this different from doubting induction?"  
       → *Here, stability is given; the issue is selecting hypotheses*.  
     - **Clinch**: "The ‘grue’ hypothesis isn’t ruled out by evidence—it’s ruled out by *which predicates our language prioritizes*. That’s the new riddle."

  3. **Discuss limitations (10 min)**:  
     - "In this game, **P** and **Q** were symmetric. But ‘grue’ feels weird. Why?" → *Entrenchment*.  
     - "If you rejected **H₃**, was it because of the data—or because you’re used to stable properties?"

  4. **Conclusion (5 min)**:  
     - "Goodman shows induction relies on *projectible predicates* (like ‘green’), not just data. And projectibility comes from history—not logic. That’s why it’s a riddle, not a solution."

  ---

  **Why This Works**:  
  - The game forces students to confront **underdetermination** and **prior dependence** without Humean skepticism.  
  - By making Team World adversarial, students *experience* why even "obvious" rules can be ambushed.  
  - The scoring rule exposes Bayesian reasoning, priming debrief on priors and entrenchment.
