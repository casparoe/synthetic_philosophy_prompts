  We are going to design an activity that isolates the problem of projectibility as in Goodman's new riddle of induction. The key is to have a hidden change point, so that the rule is: property P holds until a certain point c, and then property Q holds after. The students will see a sequence of observations and bet on the next one. We want to show that no matter how many observations they see (all P so far), the hypotheses that the change hasn't happened yet (so the next is P) and that the change happens at the next step (so the next is Q) are both still live. Moreover, the betting odds they accept should depend more on their prior beliefs about when the change might occur (i.e., the distribution from which c is drawn) than on the data.

  Activity Design:

  1. **Setup**:
     - The class is divided into two groups: the "World" and the "Bettors". The World group will know the rule and the change point c. The Bettors will only see the observations and bet.
     - The rule: There is a sequence of objects (or events) that have a property that we'll call "color". For simplicity, let's say each object is either green (G) or blue (B). The rule is: all objects up to and including the c-th are G, and all after c are B. We fix c in advance and keep it hidden from the Bettors.

  2. **Generating the sequence**:
     - Let the total length of the sequence that the World will reveal step by step be at least 20 (so we have enough to show a long run of G's). The change point c is drawn from a distribution that we choose. To make the point, we want a distribution that is not too concentrated and that allows for the possibility of c being very late. We can use a uniform distribution over a range, but note that if we use a uniform over [1, 100] then the prior is spread very thin. However, for the activity, we can fix a prior that is uniform over [1, 20] (so c can be any integer from 1 to 20). We tell the Bettors the prior: c is equally likely to be any integer between 1 and 20.

  3. **The betting game**:
     - The World group starts by revealing the first observation. Since c>=1, the first object is always G. Then the Bettors are asked to bet on the next observation (the second). They can bet on G or B at some odds. We need a proper scoring rule. Let's use a quadratic scoring rule for simplicity, which can be adapted to probabilities.

     However, to make it more engaging and to focus on the odds, we can use a simple betting market. We can have the Bettors assign a probability p to the event that the next object is G. Then we use a scoring rule that rewards them for their reported probability. For example, if they report p for G, and the outcome is G, they get 1 - (1-p)^2; if it's B, they get 1 - p^2. But to keep it simple and more like a betting market, we can have them bet at odds set by the instructor based on their aggregated probabilities? Alternatively, we can have them write down their probability and then we score them later.

     Alternatively, we can do it in a way that they see the accumulated data and then at each step, after seeing the first k observations (all G's so far), they are asked to report their subjective probability that the next observation is G. Then we score them using a proper scoring rule.

     Let me propose:

     - At each step t (after t observations, all G so far), the Bettors write down their probability that the next object (the t+1-th) is G. We collect these and compute the average probability (or we can just use the median or leave it at individual scoring). Then we reveal the next object (which, until c, is G, and at c+1 it becomes B).

     - We score each Bettor individually using the quadratic scoring rule: if they report p for G, and the outcome is G, they get 1 - (1-p)^2; if it's B, they get 1 - p^2. (Note: This gives a score between 0 and 1, and it's proper.)

     But note: the outcome for step t+1 is G if t+1 <= c, and B if t+1 > c.

  4. **The sequence and the change point**:
     - We choose c in advance. To make the point, we might choose c to be 15 (so that we have 15 G's and then B's). But we don't tell the Bettors c. They only know the prior: c is uniform from 1 to 20.

     - The World group reveals the sequence one by one. They start at t=1: reveal G. Then t=2: reveal G. ... until t=15: reveal G. Then at t=16, reveal B, and so on.

  5. **What we expect to see**:
     - After each observation (all G's so far), the Bettors will update their beliefs about when the change might occur. The posterior probability that the change hasn't happened yet (i.e., that c >= current step t) is computed by Bayes' theorem.

     - Specifically, after t observations (all G), the likelihood of a particular c is:
          - If c < t: then we should have seen a B at step c+1, but we didn't. So these c's are impossible -> probability 0.
          - If c >= t: then the data is consistent. The prior is uniform, so the posterior probability for each c in [t, 20] is proportional to 1. There are (21-t) possible c's (from t to 20 inclusive). So the posterior probability that the next observation (at step t+1) is G is:
              P(next is G | data) = P(c >= t+1 | data) = (number of c's from t+1 to 20) / (number of c's from t to 20) = (20 - t) / (21 - t)

          Why? Because if c>=t+1, then the next is G (since t+1<=c). If c==t, then the next (t+1) is B.

          So:
            P(next is G) = (20-t) / (21-t)

          Example:
            After 1 G: t=1 -> P(next G) = (20-1)/(21-1) = 19/20 = 0.95
            After 10 G's: t=10 -> P(next G) = 10/11 ≈ 0.909
            After 15 G's: t=15 -> P(next G) = 5/6 ≈ 0.833
            After 19 G's: t=19 -> P(next G) = 1/2 = 0.5

     - However, note that the Bettors might not do this exact calculation? But we can hope they reason similarly. The point is that the probability of the next being G decreases slowly, but even after 15 G's, it's still 5/6.

     - But note: the prior is critical. If the prior were different, the update would be different. For example, if the prior were that c is very likely to be large (say, a prior that favors large c), then even after many G's, the probability of the next being G remains high. Conversely, if the prior were that c is likely to be small, then after a few G's, the probability of the next being G would drop quickly.

