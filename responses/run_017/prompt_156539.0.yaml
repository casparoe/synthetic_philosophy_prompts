prompt: |-
  I have been reading Simone Weil's argument for abolishing political parties — the part where she says, roughly, that a party is a collective that exerts on the minds of its own members a pressure nobody has decided on and nobody is answerable for. The mechanism keeps turning up somewhere she does not seem to have had in view, and I want to know whether it has a name.

  Two cases. (1) A volunteer tenants' association: officers rotate annually, nobody draws a salary, nobody has a career to build. It achieved the thing it was formed to achieve and did not dissolve; it produced further campaigns. Questioning a tactic now draws the coldness that used to be reserved for questioning the aim, while questioning the aim is treated as a private matter. Individual members' stated reasons for each new campaign track the group's current line, and when the line changes the reasons change with it, without any sense of reversal. (2) A small learned society whose positions drift toward whatever most sharply distinguishes it from a neighbouring society it agrees with on nearly everything: the shared theses drop out of its self-description, and the differentiating ones become the ones it is most certain of.

  What I am after is narrower than "organizations drift from their purposes," and it is not, I think, the iron law of oligarchy, or goal displacement, or mission creep, or groupthink: there is no oligarchy, no one seems cynical, the mission is never formally revised, and deliberation can be vigorous, sincere and well-informed. Is there an established concept for a group whose doctrines come to be selected for their usefulness in holding the group together and marking it off from its nearest rivals — members' beliefs following the group rather than the reverse — and for the fact that no individual is the author of the result? If there is no such concept, name and define one. Either way I want the carving rather than the label: the mechanism; how it differs from each of the nearby established notions; whether Weil's heavier apparatus (a collective that generates positions no member individually holds and for which no one is responsible) is really needed, or whether a thinner story about membership sorting, the costs of exit, and the need to justify continued association suffices; and what shape of organization would be immune to it, so that the phenomenon has edges.
reasoning: |-
  Okay, the user is diving deep into Simone Weil's critique of political parties and noticing a similar mechanism in other groups. They described two cases: a tenants' association and a learned society. Both show how group beliefs shift to maintain cohesion and differentiation, without any individual driving the change. The user wants to know if there's a named concept for this phenomenon or if we need to coin one.

  First, I recall Weil's argument. She said parties create collective pressure that no one controls or is accountable for. The user's examples align with this but in non-political groups. The tenants' group started with a clear goal but kept going, tactics became sacred. The learned society drifted to differentiate from a similar group. Both show doctrines serving group cohesion rather than truth or original purpose.

  The user mentions established concepts like iron law of oligarchy, goal displacement, mission creep, groupthink. They argue these don't fit because there's no oligarchy, cynicism, or formal mission change. Deliberation is sincere. So, existing terms might not capture this specific mechanism.

  I need to check related concepts. Group polarization? That's about extreme shifts, not cohesion. Institutional isomorphism? More about conformity to external norms. The key here is internal: beliefs adapt to reinforce group identity and boundaries, especially against near rivals.

  The mechanism involves membership sorting. People who stay align with the group's evolving stance; dissenters leave, increasing homogeneity. Exit costs make leaving hard, so members rationalize staying, adjusting their beliefs. Also, to justify the group's existence, especially when original goals are achieved, new differentiating doctrines emerge. This happens without conscious design—emergent through interactions.

  Weil's "collective pressure" is crucial here. It's not just individual choices but a systemic effect. The group develops positions no single member might hold, a shared fiction that binds them. The user wonders if a thinner explanation (sorting, exit costs, justification) suffices. But Weil's point about no one being responsible adds depth. The emergent nature means no one authors the drift, making it insidious.

  For a new term, "doctrinal autotelism" comes to mind—beliefs serving the group itself. Or "cohesion-driven doctrinal drift." But "autopoietic doctrine formation" might be better, borrowing from systems theory. Autopoiesis means self-creating systems. Here, doctrines form to maintain the group's identity, independent of original purposes.

  To define immune organizations: those with built-in dissolution clauses, rotating external reviewers, or requiring periodic re-justification. Groups that emphasize individual conscience over collective unity might resist this drift. The edges are clear: when the group's existence is tied to specific goals, or mechanisms enforce external accountability.

  The user's deeper need might be understanding how to prevent such drift in organizations they're part of. They seek not just a label but a framework to identify and counteract this mechanism. Recognizing it as an emergent system effect highlights the need for structural safeguards rather than blaming individuals.
answer: |-
  Your keen observation identifies a subtle yet pervasive mechanism that transcends Weil's original target. This isn't just party pathology; it's a fundamental organizational dynamic where **group persistence becomes the unstated, overriding goal, shaping beliefs and doctrines to serve cohesion and differentiation, irrespective of original purpose or individual intent.** While existing concepts touch aspects, none fully capture this specific, emergent phenomenon.

  Let's carve it precisely:

  1.  **The Core Mechanism:** **Autopoietic Doctrine Formation.**
      *   *Autopoiesis* (from Greek: *auto-* self, *-poiesis* creation) describes a system that maintains and reproduces itself. Here, the "system" is the group's identity and existence *as a distinct collective*.
      *   *Doctrine Formation* refers to the evolution of shared beliefs, positions, tactics, and self-descriptions.
      *   **The Mechanism:** The group's doctrines are gradually selected and molded *primarily* by their functional utility in:
          *   **Maintaining Internal Cohesion:** Providing shared focus, justifying continued association, suppressing dissent that threatens unity (even if sincere and well-argued).
          *   **Enhancing External Differentiation:** Sharpening boundaries against perceived "near rivals" (groups sharing significant overlap), making the group's distinct existence feel necessary and justified.
      *   This selection happens *emergently* through countless micro-interactions (discussions, reactions to dissent, internal narratives, responses to external comparisons), not through conscious design or conspiracy. **No individual authors the drift; it's a collective output.**

  2.  **Distinguishing from Nearby Concepts:**
      *   **Iron Law of Oligarchy (Michels):** Focuses on power concentrating in a leadership elite pursuing self-interest. Your cases lack this: no oligarchy, no cynical careerism. The pressure is diffuse.
      *   **Goal Displacement / Mission Creep:** Involves conscious or semi-conscious shifts in stated objectives (e.g., a charity prioritizing fundraising over service). Your groups haven't formally redefined their mission; the *original purpose fades into irrelevance* while *group persistence itself* becomes the unstated driver. Doctrine changes serve cohesion/differentiation, not necessarily a new external goal.
      *   **Groupthink (Janis):** Emphasizes premature consensus-seeking, suppression of dissent due to pressure for harmony, leading to faulty decisions. Your groups *do* allow deliberation ("vigorous, sincere, well-informed"), but the *outcome* of that deliberation is constrained by the unspoken imperative of cohesion/differentiation. Dissent on *tactics* (threatening unity) is suppressed, while dissent on *aims* (if framed as purely personal) is tolerated but marginalized.
      *   **Organizational Isomorphism (DiMaggio & Powell):** Focuses on organizations becoming similar due to coercive, mimetic, or normative pressures *from the institutional environment*. Your learned society case shows *differentiation* from a specific near rival, driven *internally* by the need for distinct identity.
      *   **Institutionalization (Selznick, etc.):** Broadly describes organizations developing a life of their own beyond their original purpose. This is the *context* for your mechanism, but doesn't specify *how* beliefs/doctrines adapt specifically to serve cohesion/differentiation in an emergent way.

  3.  **Weil's Apparatus vs. A "Thinner" Story:**
      *   **Weil's "Collective Pressure" (Heavier):** Weil's emphasis on a collective entity generating positions no single member holds and for which no one is responsible is *crucial* for capturing the *emergent, authorless* nature of the phenomenon. It explains why members' stated reasons shift seamlessly ("without any sense of reversal") – they are conforming to/participating in a shared fiction generated by the group dynamic itself. The pressure feels impersonal, systemic.
      *   **"Thinner" Story (Membership Sorting, Exit Costs, Justification):** This explains the *fuel* and *conditions* but not the full *mechanism*.
          *   *Sorting:* Like-minded stay, dissenters leave, increasing homogeneity. True, but doesn't explain the *content* of the new doctrines (why differentiation from *that* rival?).
          *   *Exit Costs:* Social/identity costs of leaving make rationalization of staying easier. Necessary, but insufficient alone.
          *   *Need to Justify:* Members need reasons to stay. Critical, but doesn't specify *why* the justification takes the form of cohesion/differentiation doctrines rather than, say, doubling down on the original purpose.
      *   **Synthesis:** The thinner story provides the necessary conditions and incentives (why individuals participate in the system). **Weil's heavier apparatus explains the emergent, systemic nature of the *output* (the specific, authorless doctrines of cohesion/differentiation).** You need both: the individual incentives create the environment where the emergent collective pressure shapes doctrine. The emergent pressure is the *how*; the sorting/exit/justification are part of the *why it persists*.

  4.  **Immunity and Edges: What Shapes Resist Autopoietic Doctrine Formation?**
      *   **Built-in Sunset Clauses/Dissolution Triggers:** Groups explicitly designed to dissolve upon achieving a specific, verifiable goal (e.g., "Dissolve when the rent cap is law"). Removes the imperative for persistence.
      *   **Strictly Episodic or Project-Based Structure:** Existence is tied to specific, time-bound tasks. No persistent "group identity" to maintain.
      *   **Radical Decentralization / Anti-Identity Focus:** Groups emphasizing individual action or local affinity over a unified collective identity (e.g., some affinity group models in anarchist organizing). Less "group self" to preserve.
      *   **Mandated External Review & Re-justification:** Requiring periodic, formal defense of the group's existence and purpose to an external body or the broader community it claims to serve, based on *external impact*, not internal cohesion.
      *   **Strong Norms of Individual Conscience Over Collective Unity:** Groups where dissent on fundamentals is not just tolerated but actively valued as a core principle, and leaving carries minimal stigma (e.g., some Quaker meetings, philosophical societies focused on inquiry over advocacy). Weakens cohesion imperative.
      *   **High Environmental Turbulence / Clear Existential Threats:** When survival depends *directly* and *obviously* on adapting to external realities (e.g., a community facing imminent displacement), cohesion doctrines may be secondary to pragmatic survival tactics. However, once the threat recedes, the mechanism can re-emerge.
      *   **Explicitly Multi-Party or Pluralist Internal Structure:** Deliberately incorporating competing factions *within* the structure can make differentiation *external* rivals less crucial for internal identity, though it risks other pathologies.

  **Conclusion:** The phenomenon you describe is **Autopoietic Doctrine Formation** – the emergent, self-reinforcing process by which a persistent group's beliefs and positions evolve primarily to maintain internal cohesion and sharpen external differentiation against near rivals, irrespective of original purpose or individual authorship. Weil's concept of an authorless collective pressure is essential for understanding the *emergent* nature of the doctrine produced. The "thinner" factors (sorting, exit costs, justification) explain individual participation and the *drive* for persistence, but not the specific *content* (cohesion/differentiation) of the emergent doctrines. Immunity requires structural features that either prevent persistence itself, actively counter the cohesion/differentiation imperative, or constantly tether the group's justification to external reality rather than internal dynamics. The edges are sharpest when the group's *raison d'être* is externally verifiable, finite, or where individual conscience structurally supersedes collective unity.
