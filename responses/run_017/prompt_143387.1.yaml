prompt: |-
  I direct a state-level interfaith advocacy coalition — about ninety congregations across Christian, Jewish, Muslim, Sikh, and Buddhist traditions — that prepares lay witnesses to testify before legislative committees. We send witnesses to forty to sixty hearings per session. They are almost always volunteers with no training in philosophy or law, they get two minutes each, and my three staff members review and sign off on every testimony in advance. We currently handle religious content case by case, and it is failing in two opposite directions at once: some witnesses testify in a thick theological register that legislators hear as a demand to defer to an authority they do not accept, and other witnesses — told loosely by us to make it secular — end up reciting arguments they do not believe and cannot defend under questioning, which is worse than the original problem.

  I want the public-reason tradition turned into a procedure my staff can actually run. The raw material is familiar enough: the thought that coercive law should be justifiable to the people bound by it; the idea that a reason whose force depends on accepting a revelation, a scripture, or a comprehensive doctrine is not available to all citizens in the way a shared reason is supposed to be; the milder proviso version, on which religious reasons are admissible provided that public reasons are also given, in due course; and the standard reply that this asks religious citizens to split themselves in two and silently favors whichever comprehensive views are already culturally dominant. I do not need the debate rehearsed. I need it operationalized: ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a named person because it turns on values rather than on whether the rule was followed.

  Six things keep going wrong, and I want you to decide which of them are real distinctions that must survive the simplification and which are confusions to discard:

  Translation versus ventriloquism. A staffer can usually produce a secular argument that supports the witness's position. The test I have been using is to ask the witness whether, if that argument were decisively refuted, they would still hold the position: if yes, there is a reason left over that has not been made public, and the testimony is ventriloquism. Is that the right test, and is ventriloquism actually a failure here or an acceptable bit of rhetoric?

  The proviso's deferral. The permission to supply public reasons in due course is unenforceable in a two-minute oral testimony that is never followed up. Should the procedure require the public-reason counterpart in the same venue, and what does it do with the witness who has none?

  Three audiences in one utterance. The witness is speaking at once to the committee, which will coerce; to their own congregation, which authorized them, pays dues, and will watch the clip; and to an archived public record with a longer memory than either. A formulation can be in order for the first and read as an act of shame to the second.

  Premise-use versus indictment-use. Religious language that supplies a premise for what the law should be seems different from religious language addressed to the polity's conscience — the register of this law makes us cruel, or of blessing and curse. I suspect the two deserve different treatment in the procedure, but I am not sure the difference is stable under pressure.

  The evenhandedness check. Whatever test we adopt should be applied to secular comprehensive doctrines as well: a witness who opposes a bill because it violates a Marxian or a Randian or a strict-libertarian world-view is in the same position, it seems to me, as the witness who opposes it on scriptural grounds. If the procedure admits one but not the other, it is just a taste test.

  Proximity to coercion. The requirement surely bites hardest on a judge writing an opinion and least on a letter to the editor, with committee testimony somewhere in the middle. My staff need the dial calibrated for the settings we actually operate in, not for the ones philosophers write about.

  Also tell me where intelligibility (others can follow it), accessibility (others can see its force without accepting its source's authority), and shareability (others could reasonably accept it) come apart, and which threshold you are recommending for committee testimony and why.

  Deliverable: a numbered procedure of no more than a dozen steps, preceded by the one-paragraph rationale that justifies the simplifications, and followed by a one-page version my field organizers can use in twenty minutes with a volunteer who has never thought about any of this. State explicitly where judgment cannot be eliminated and who signs off there.

  Then run it on three of our actual recurring cases. First, a Catholic parish volunteer opposing expansion of solitary confinement, whose actual reasons include the Gospels and the dignity of the person, and for whom public reasons — recidivism, mental-health costs, litigation exposure — also genuinely exist. Second, a Sikh congregation supporting statewide tenant right-to-counsel, whose reason is thoroughly religious and who has no data and no appetite for any. Third, a case where I expect to dislike the answer: a member congregation wants to oppose a bill mandating content in public-school sex education, their reasons are inescapably scriptural, and they regard the available secular framing as a mask rather than a translation. My fear is that a well-built procedure will systematically clear the witnesses whose theology happens to converge with secular consensus and silence the ones whose theology does not, which would make us a progressive advocacy group with a religious decoration. If that is what the procedure implies, say so, and say whether the honest fix is to accept the asymmetry, to loosen the rule, or to route these witnesses to a different kind of speech rather than to silence.

  Finally, state what the procedure cannot do: what it cannot settle about whether public reason is a sound requirement in the first place, what it cannot know about how legislators actually receive a line of testimony, and what it should do when a witness's tradition forbids them to offer any reason other than their own.
reasoning: |-
  Okay, this is a complex and fascinating operational challenge. The user directs a multi-faith advocacy coalition and needs to transform abstract public reason theory into a practical staff procedure for lay testimony. They're clearly deeply experienced - noticing six distinct pain points in implementation shows sophisticated pattern recognition.

  Hmm, the core tension seems to be between philosophical rigor and real-world constraints: untrained volunteers, 2-minute limits, and triple-audience dynamics (committee/congregation/historical record). Their fear about systematic bias against non-convergent theologies is particularly acute - it's not just an academic concern but goes to their coalition's legitimacy.

  Let me unpack their six pain points:
  First, the translation/ventriloquism dilemma. Their current "would you change your mind?" test is psychologically astute but might be too stringent. In legislative contexts, arguments serve strategic purposes beyond pure truth-telling. Maybe we need to distinguish between core conviction and persuasive packaging.

  The proviso's deferral problem is very real. "Due course" evaporates in oral testimony. The solution might be to treat testimony as one link in a chain of justification rather than the complete account.

  Triple audiences complicate everything. A phrase that satisfies legislators might alienate congregants. The procedure should probably prioritize persuading lawmakers while providing alternate language for congregational reports.

  Premise-use vs indictment-use distinction feels crucial. Religious moral outrage ("this law makes us cruel") operates differently than theological premises. The former might actually translate better across worldviews.

  Their evenhandedness check is spot-on. Any test must apply equally to secular comprehensive doctrines. This prevents progressive bias.

  Proximity to coercion matters. Committee testimony isn't a judicial opinion but carries more weight than a blog post. The standard should be "could this reasonably persuade a neutral listener" not "would it convince opponents."

  For the deliverables... The procedure must be bulletproof for staff but teachable in 20 minutes. That means: minimal steps, clear decision points, and designated judgment calls (with sign-off authority specified).

  The three test cases are perfectly chosen to stress-test the system:
  - Catholic solitary confinement (ideal convergence case)
  - Sikh right-to-counsel (pure religious reasoning)
  - Sex-ed opposition (non-convergent theology)

  Ah, and their deepest fear - that this becomes progressive ventriloquism - must be addressed head-on. The honest answer might be that non-convergent positions sometimes belong in different forums (op-eds, rallies) rather than testimony seeking state coercion.

  Finally, the procedure's limits: It can't resolve philosophical debates about public reason itself, can't control reception, and can't solve traditions that forbid secular reasoning. These boundaries need explicit acknowledgment.

  The solution will live or die on whether field staff can actually run it during crunch time. Every step must withstand the pressure of last-minute testimony drafts and nervous volunteers.
answer: |-
  ## Public Reason Procedure for Legislative Testimony

  **Rationale:** This procedure operationalizes public reason by focusing on *coercive justification* in committee testimony. We prioritize **accessibility** (force visible without source authority) over perfect shareability (universal acceptance) or intelligibility (mere comprehension). This accepts that: (1) "Due course" is impractical in 2-minute testimony, requiring public reasons *now*; (2) Authenticity matters – witnesses shouldn't parrot arguments they can't defend; (3) Secular comprehensive doctrines face the same bar as religious ones; (4) Committee testimony warrants a higher standard than public debate but lower than judicial rulings. We simplify by prioritizing the *committee audience* (coercion) while providing optional congregational framing, and by distinguishing *argument function* (premise vs. indictment). We accept that non-convergent theological positions may require alternative advocacy channels.

  **The Procedure (12 Steps):**

  1.  **Identify Core Position:** What specific bill/action does the witness support or oppose? (e.g., "Support HB 1234: Tenant Right to Counsel")
  2.  **Identify Primary Motivator:** What is the witness's *deepest* reason for this position? (e.g., "My Sikh faith commands defending the oppressed.")
  3.  **Function Check (Premise vs. Indictment):**
      *   *Premise Use:* Is the religious reason offered as a *logical foundation* for the law's content? (e.g., "The Bible says life begins at conception, therefore abortion must be illegal.") → **Requires Translation (Proceed to Step 4).**
      *   *Indictment Use:* Is the religious reason expressing *moral concern or conscience* about the law's *impact*? (e.g., "Allowing prolonged solitary confinement violates the God-given dignity of the person and makes us a cruel society.") → **Permitted as-is IF combined with accessible impact language (Proceed to Step 5).** If *solely* indictment, proceed to Step 6.
  4.  **Premise Translation Test (Staff):** Can staff articulate an argument supporting the position *without* relying on revelation, scripture, or comprehensive doctrine? Use accessible concepts (e.g., harm prevention, fairness, liberty, efficiency, public safety, health, dignity, equality).
      *   *Yes (Translation Exists):* → Proceed to Step 6.
      *   *No (No Accessible Translation):* → **Decision Point A (Staff Lead Signs Off):** Can the position be credibly supported *only* by inaccessible reasons? If YES → *Route to Alternative Advocacy* (e.g., op-ed, letter, rally speech). If NO → Work with witness to find accessible grounding or reconsider testimony.
  5.  **Indictment Grounding (Staff/Witness):** Ensure the indictment links to a tangible impact accessible to non-believers. *Add:* "...because it causes severe psychological harm, increases recidivism, and wastes taxpayer money on lawsuits," OR "...because it leaves vulnerable families homeless and destabilizes communities."
  6.  **Public Reason Core (Witness/Staff):** Draft the core argument using *only* the accessible concepts identified (Steps 4/5). This *must* be the primary justification presented in the testimony.
  7.  **"Can You Defend It?" Check (Witness):** Ask the witness: "If challenged on *this specific argument* during Q&A, can you explain and defend it sincerely without relying on your religious authority?" (Defending = explaining its logic/evidence, not just repeating it).
      *   *Yes:* → Proceed.
      *   *No:* → Revise the public core argument until witness can defend it OR **Decision Point B (Staff Lead Signs Off):** Is the witness deeply uncomfortable? If YES → *Route to Alternative Advocacy*.
  8.  **Evenhandedness Check (Staff):** Apply Steps 4-7 equally. Would a purely Marxist/Randian/Libertarian argument for this position pass the same translation and defense tests? If the *only* accessible argument relies on *their* comprehensive doctrine, it fails.
  9.  **Authenticity Integration (Witness):** *After* establishing the public reason core, the witness *may* add:
      *   *Optional Context:* "My faith inspires my concern about this issue..."
      *   *Optional Indictment:* "...and compels me to say this policy degrades our shared humanity." (Ensure Step 5 grounding is present if used).
      *   *NEVER* present religious reasons as the *logical basis* for the law.
  10. **Congregational Addendum (Optional - Staff/Witness):** For internal reporting/website: "To our congregation: This testimony is grounded in our shared belief [Specific Religious Principle], expressed today through the shared values of [Accessible Concepts]."
  11. **Final Review (Staff):** Does the testimony:
      *   Lead with & primarily rely on the accessible public reason core (Step 6)?
      *   Keep optional religious language contextual/indictive (Step 9)?
      *   Ensure the witness can defend the public core (Step 7)?
      *   Pass the evenhandedness check (Step 8)?
  12. **Sign-Off:** Staff Lead approves testimony meeting criteria.

  **Field Organizer Cheat Sheet (20-Minute Volunteer Version):**

  1.  **What's Your Main Ask?** (Support/Oppose which bill?)
  2.  **Why Do *You* Care Deeply?** (What's your biggest personal/faith reason?)
  3.  **The Law's Reason:** We need an argument *anyone* could understand, even if they don't share your faith. Think: Harm? Fairness? Safety? Cost? Health? Freedom? Dignity? (e.g., Solitary: "It breaks people mentally, costs us more later, gets us sued.")
  4.  **Can You Explain That?** If a legislator questions *that* reason, could you talk about it sincerely? (Not just your faith reason).
  5.  **Your Faith's Role (Optional):** *After* giving the law's reason, you *can* briefly say: "My Sikh faith calls me to defend the vulnerable, which is why I care so much about tenants having lawyers to prevent unfair evictions." OR "As a Catholic, I believe solitary confinement violates human dignity, making us a crueler society."
  6.  **NO to Religious Rules as Law's Logic:** Avoid: "The Bible/Quran/Guru says X, so the law must be Y."
  7.  **Focus on Committee:** Your main job is giving lawmakers a reason *they* can use to justify voting your way to *everyone*.
  8.  **Staff Helps:** We'll help find the "law's reason" and make sure you're comfortable talking about it!

  **Judgment Points & Sign-Off:**
  *   **Decision Point A (Step 4):** Does *any* accessible public reason exist for this position? **Staff Lead** signs off on decision to route testimony or proceed.
  *   **Decision Point B (Step 7):** Can the witness genuinely defend the public reason core? **Staff Lead** signs off on decision to revise, proceed, or route testimony.
  *   **Step 8 (Evenhandedness):** **Staff Lead** confirms application.

  **Test Case Application:**

  1.  **Catholic Opposing Solitary Expansion:**
      *   *Position:* Oppose Bill X (Solitary Expansion).
      *   *Motivator:* Gospels (Dignity of the Person).
      *   *Function:* **Premise Use** (Dignity as foundation) → **Requires Translation.**
      *   *Translation:* Public reasons exist (recidivism, mental health costs, litigation). Draft core: "Solitary causes severe, lasting psychological harm, increases violent reoffending, and exposes the state to costly lawsuits, undermining rehabilitation and wasting resources."
      *   *Defense Check:* Witness can defend mental health impacts, recidivism data, litigation risks. YES.
      *   *Authenticity Integration:* Optional: "My Catholic faith teaches the inherent dignity of every person, which compels me to oppose this cruel and counterproductive practice."
      *   **OUTCOME:** **APPROVED.** Strong convergence. Public core robust, witness authentic.

  2.  **Sikh Supporting Tenant Right-to-Counsel:**
      *   *Position:* Support HB 1234 (Tenant Right to Counsel).
      *   *Motivator:* Sikh principle of defending the oppressed (religious).
      *   *Function:* **Primarily Premise Use** (Religious duty as foundation) → **Requires Translation.**
      *   *Translation:* Staff must help identify accessible public reasons: Unbalanced power in evictions, homelessness prevention (public health/cost), stability for families/children, fairness in legal process. Draft core: "Evictions are complex legal processes where landlords almost always have lawyers, but tenants rarely do. This imbalance leads to unfair outcomes, preventable homelessness harming families and children, and greater public costs for emergency services and shelters. Legal counsel ensures fairness and stability."
      *   *Defense Check:* Witness can explain power imbalance, consequences of homelessness, basic fairness? (Staff provides simple talking points). YES (with prep).
      *   *Authenticity Integration:* Optional: "My Sikh faith calls on us to stand with the oppressed, which is why I urge you to pass HB 1234 and bring fairness to tenants facing eviction."
      *   **OUTCOME:** **APPROVED (Conditional).** Translation *exists* (fairness, harm prevention, efficiency). Witness can defend core with support. Religious motivation framed contextually.

  3.  **Congregation Opposing Sex-Ed Content Mandate:**
      *   *Position:* Oppose Bill Y (Mandate Specific Sex-Ed Content).
      *   *Motivator:* Scriptural prohibitions (e.g., specific acts are sinful).
      *   *Function:* **Premise Use** (Scripture dictates morality, therefore law must reflect it).
      *   *Translation Test (Staff):** What is the *accessible* harm or public reason? Common attempts (parental rights, age-appropriateness) often feel like masks if the *core* objection is the content's inherent sinfulness per scripture. If the witness rejects "translation" as masking their true reason (sinfulness), and staff cannot identify a *sincere, defensible* public reason the witness accepts (e.g., *not* just "parents should decide" if their real fear is the *content itself* being sinful), then **No Accessible Translation Exists**.
      *   **Decision Point A:** **Staff Lead** judges that the *only* coherent reason for the witness's position relies on the inaccessible scriptural premise. Available "public" reasons are seen as masks, not translations.
      *   **OUTCOME:** **ROUTE TO ALTERNATIVE ADVOCACY.** (e.g., Submit written testimony stating religious objection clearly, speak at a rally, write an op-ed). The procedure blocks *committee testimony* seeking to use state coercion based solely on inaccessible religious premises where no authentic, defensible public reason exists. **This is the predicted asymmetry.**

  **Addressing the Fear:** The procedure *will* systematically favor witnesses whose theological commitments converge with accessible public reasons grounded in secular concepts like harm, fairness, or efficiency. It *will* challenge or block testimony relying solely on non-convergent theological premises lacking such accessible justification. **The honest fix is to accept this asymmetry for *legislative testimony seeking coercive law*.** The alternatives are worse: "Loosening the rule" undermines the core justification for state action and risks alienating the committee. "Silencing" is unnecessary; **routing to alternative advocacy channels** (op-eds, letters, rallies, religious statements) respects the conviction while acknowledging that *coercive justification* requires reasons accessible to those subject to the coercion. The coalition remains interfaith by facilitating *all* voices through *appropriate* channels, not by demanding all use the same channel for all purposes.

  **What the Procedure Cannot Do:**

  1.  **Settle the Legitimacy of Public Reason:** It assumes the core principle (coercive power requires public justification) is sound for this context. It cannot resolve the deeper philosophical debate about self-splitting or cultural bias.
  2.  **Control Reception:** It cannot guarantee how legislators interpret or receive the testimony, or whether they perceive the witness as authentic. It optimizes for *providing* accessible justification.
  3.  **Override Tradition Constraints:** If a witness's tradition *forbids* offering any justification other than divine command/revelation (making Steps 4-6 impossible), the procedure cannot accommodate that for committee testimony. The witness cannot participate in this form of advocacy. **Staff Lead** makes this determination at Decision Point A/B.
  4.  **Eliminate Judgment:** Staff Lead judgment is crucial at key points (Translation existence, Witness defense sincerity, Evenhandedness, Tradition constraint). The procedure structures but doesn't automate these decisions.
