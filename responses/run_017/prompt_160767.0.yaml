prompt: |-
  I teach a utilitarianism-and-its-critics seminar every spring, and the one item that reliably splits the room and never resolves is Williams's integrity objection: the complaint that consequentialism alienates an agent from his own actions because it counts everything he merely fails to prevent as equally his business (negative responsibility), and because it makes him deliberate from thoughts he couldn't act on without embarrassment — the one-thought-too-many case, where the man who can rescue either his wife or a stranger is supposed to need the further thought that rescuing his wife is impersonally licensed. I've also been chewing on this for about three years in a work-in-progress group with two colleagues, and it has stalled in a way that now interests me more than the original question does. Nobody denies the phenomenology: the consequentialist in the group happily grants that acting on the impersonal calculus in the Jim-and-the-Indians case, or in the George case where the job is the only way to support his family, feels like a betrayal of who you are. She just says the feeling is explained by something else — the cost to your motives, the demandingness, your epistemic limits — without conceding that the action is wrong or that integrity is a moral consideration at all. And the Williamsian says no, the feeling is the datum and integrity is precisely what consequentialism cannot represent. We have gone around this maybe a dozen times.

  My hunch, which I want treated as a hunch: the dispute isn't really about morality at all, it's three disputes stacked under one heading. One is about the metaphysics of reasons — whether there is any genuinely agent-relative reason, or whether everything that looks like one is just a strong attachment plus a first-personal mode of presentation. One is about which property of a project does the work: a grad student of mine suggested we separate mere depth of attachment from identity-conferral (how central the project is to who the agent takes himself to be), and claim that consequentialists can perfectly well model the first and have no room for the second, so the whole objection turns on whether identification has normative force over and above strength of attachment. I don't think that's quite right, but it's the most interesting thing anyone in the group has said. A third, which a colleague in political philosophy keeps pushing, is that the argument is a proxy war about the division of moral labour and about what alienation from one's own agency is. I also introduced something I called the outsourcing test, to see if it would break the staleness: suppose the impersonal demand could be discharged institutionally — you pay the levy, fund the effective charity, vote for the regulator — and then act from your own projects with a clear conscience about the rest. My consequentialist colleague says the objection loses its target there; the Williamsian says it doesn't, because the objection was never about what you produce, it's about what you deliberate from and what you can say about yourself.

  So I want a diagnosis, not a verdict and not a literature survey — I've read the literature, I can recite it. Is this a substantive disagreement about whether there are agent-relative reasons, a verbal one about the word integrity, a clash over which cases count as data (does the outsourcing case count as a genuine instance of the objection, or as a changed subject), or people answering different questions under one name — one about right action, one about the standpoint of deliberation, one about the metaphysics of the self? Say which, with reasons drawn from what each side actually commits itself to, and tell me honestly whether each strand is arguable or bottoms out in intuitions neither side can argue for. Then the part I actually care about: given your diagnosis, what would count as progress here? A distinction, a formal result about how agent-relativity behaves in a decision-theoretic framework, a different kind of case, a change of question? Or should I conclude the question as posed is ill-posed and that three years is exactly what I should have expected to spend on it?
reasoning: |-
  Hmm, this user presents a sophisticated and long-standing philosophical dilemma about Bernard Williams' integrity objection to utilitarianism. The user teaches this material and has been stuck in a work group for three years without resolution. They've clearly engaged deeply with the literature and the core tension: consequentialists grant the phenomenology of alienation but attribute it to psychological factors rather than moral deficiency, while Williamsians treat the feeling of betrayal as morally significant data.

  The user's hunch about stacked disputes seems spot-on. Let me unpack those layers: First, the metaphysical layer about agent-relative reasons - are they irreducible or reducible to attachments? Second, the psychological layer about identity-conferral versus mere attachment strength. Third, the political layer about moral labor division. The outsourcing test is particularly clever because it isolates whether the objection concerns consequences or deliberative standpoint.

  What's striking is how both sides agree on the phenomenology but disagree on its normative weight. The consequentialist sees alienation as an unfortunate psychological cost of doing the right thing, while the Williamsian sees it as evidence of a moral flaw in the theory itself. This suggests the core conflict is about what counts as moral data: should moral theories accommodate our deepest self-conceptions or reform them?

  The grad student's distinction between attachment strength and identity-conferral is crucial. If identity-conferral has normative force beyond psychological weight, that would ground Williams' position. But proving that requires tackling metaethical questions about reasons that resist empirical resolution.

  Progress might come from shifting focus: Instead of asking "is alienation morally significant?" ask "under what conditions does alienation indicate moral error versus psychological limitation?" Or explore whether consequentialism can incorporate identity-conferral through nested agency - letting individuals act as trustees for personal projects within an overall consequentialist framework. The user's outsourcing test already points this way.

  Three years isn't excessive for this depth of problem. The impasse may reflect that the question bridges normative ethics and metaethics in ways that resist knockdown arguments. The most promising path forward is mapping precisely where intuitions diverge and constructing hybrid approaches that preserve insights from both sides.
answer: |-
  Here's a diagnosis of the impasse, drawing on the commitments and arguments you've described, followed by thoughts on progress:

  **The Diagnosis: Three Interlocking Disputes Creating an Intractable Meta-Conflict**

  Your hunch is largely correct. The stalemate isn't a *single* disagreement about morality, but three fundamental, intertwined disagreements operating simultaneously under the banner of "integrity." Each side is arguing past the other because they prioritize different layers:

  1.  **The Metaethics of Reasons (Metaphysics of Normativity):**
      *   **Consequentialist Commitment:** Reasons are fundamentally agent-neutral. What *appears* agent-relative (loyalty to family, personal projects) is either:
          *   A psychological fact about attachments/preferences that feeds *into* the agent-neutral calculus (the strength of your attachment *is* a fact about the world relevant to maximizing good).
          *   An epistemic/practical constraint (it's often *efficient* to focus on proximate concerns).
          *   A first-personal *mode of presentation* of an agent-neutral reason (your reason to save your wife *is* the agent-neutral reason to save a life combined with the contingent fact that *you* can save *this specific life* with whom you have deep bonds, which creates more overall good).
      *   **Williamsian Commitment:** Genuine agent-relative reasons exist *irreducibly*. The reason I have to save *my wife* is fundamentally distinct from, and not merely a component of, the reason anyone has to save *a life*. Denying this is precisely what alienates the agent from their deepest commitments, treating them as mere inputs rather than constitutive grounds of identity and value *for the agent*.
      *   **Conflict Point:** This is bedrock. The Consequentialist sees the Williamsian as mistaking psychology for normativity. The Williamsian sees the Consequentialist as denying a fundamental feature of practical reason. **This strand bottoms out in competing intuitions about the nature of normativity itself.** Neither side can *prove* their foundational view of reasons without begging the question.

  2.  **The Psychology & Normativity of Identity (What "Integrity" Means & Why It Matters):**
      *   **Consequentialist Commitment:** "Integrity" refers to psychological coherence and acting consistently with one's *current* strongest motivations/projects. Its normative force stems *entirely* from:
          *   The *disutility* of psychological turmoil, cognitive dissonance, or motivational conflict.
          *   The *utility* of stable character traits for reliable action.
          *   Its "identity-conferral" aspect is purely descriptive psychology; it doesn't grant projects *extra* normative weight. A deeply identity-conferring project is simply a *very strong preference* within the calculus.
      *   **Williamsian Commitment:** "Integrity" involves being true to commitments that are *constitutive* of one's practical identity – projects that define *who one is* as an agent. Alienation arises not (just) from psychological cost, but from the *betrayal* of this constitutive self. The normative force of integrity stems from the *authority* this self-constituting identity has over the agent's deliberation. It *is* a moral consideration (or a proto-moral one grounding reasons) precisely because it defines the perspective *from which* moral (and other) reasons are apprehended.
      *   **Conflict Point:** Is "identity-conferral" merely a psychological state (strong attachment) or does it have *normative significance*? The Consequentialist reduces it to psychology/utility. The Williamsian elevates it to a source of reasons. **This strand is arguable (e.g., through conceptual analysis of identity, agency, and reasons) but ultimately rests on the prior commitment to the nature of reasons (Strand 1).** Your grad student's distinction highlights the crux: *Can consequentialism model the *normativity* of identification, or only its psychological force?*

  3.  **The Standpoint of Deliberation vs. The Criterion of Right Action:**
      *   **Consequentialist Commitment:** The fundamental moral question is "What *ought* to be done?" (Right Action). Deliberation is an imperfect, psychologically constrained process aiming at that answer. Alienation is a *regrettable feature of the deliberative process* when it clashes with strong attachments, but it doesn't invalidate the answer to the "ought" question. The outsourcing case *dissolves* the practical problem by satisfying the "ought" without requiring alienating deliberation.
      *   **Williamsian Commitment:** Morality is fundamentally about *how an agent should live*, which is inextricably tied to *how they deliberate and understand their actions*. The "one thought too many" isn't just psychologically awkward; it reveals a *moral flaw* in the theory – it makes the agent view their deepest commitments through an alien, impersonal lens *in the moment of action*. This alienation *is* a moral cost, reflecting a failure to fully inhabit one's agency. Outsourcing doesn't solve this; the *deliberative standpoint required* to endorse the outsourcing system *itself* might embody the alienating perspective ("I pay the levy so I can *finally* act on *my real* reasons").
      *   **Conflict Point:** What is the primary locus of moral evaluation – the *outcome*, the *action*, or the *deliberative perspective* of the agent? The Consequentialist prioritizes the outcome/action. The Williamsian prioritizes the deliberative perspective as constitutive of the agent's moral life. **This strand is arguable (e.g., by examining what we hold agents responsible *for*, or the value of "clean hands").** The outsourcing test is pivotal: The Consequentialist sees it as a solution (preserves right action, minimizes alienating deliberation). The Williamsian sees it as either irrelevant (the deliberation *to* outsource is still alienated) or a confirmation (it shows the objection was always about standpoint, not consequences).

  **Why the Impasse?**
  *   **Stacked Foundations:** Strand 1 (reasons) underlies Strand 2 (identity/normativity), which underlies Strand 3 (deliberation vs. action). Disagreement at the bottom infects everything above.
  *   **Different Data:** They agree on the *phenomenology* (it *feels* like betrayal), but disagree on its *significance*. For the Williamsian, the feeling *is* the crucial moral datum revealing a flaw. For the Consequentialist, the feeling is a *psychological side-effect* of demandingness or cognitive limitations, irrelevant to the *rightness* of the action.
  *   **Incommensurable Priorities:** The Consequentialist prioritizes impartial good. The Williamsian prioritizes the agent's non-alienated engagement with their life and commitments. These are different fundamental values.
  *   **"Integrity" is Ambiguous:** It functions as a placeholder for the complex of issues above. Each side defines it according to their foundational commitments.

  **Paths to Progress (Given the Diagnosis):**

  1.  **Reframe Away from "Integrity":** Explicitly disentangle the three strands in discussion. Stop asking "What about integrity?" and instead ask:
      *   "Is there irreducible agent-relativity in reasons? How would we know?" (Strand 1 - hardest, metaethical).
      *   "Does the fact that a project is identity-constituting grant it normative weight *beyond* its contribution to well-being/preference-satisfaction? If so, how?" (Strand 2 - bridge between metaethics and normative psych).
      *   "Is the deliberative standpoint itself a primary locus of moral evaluation, distinct from right action? What does alienation *signify* morally?" (Strand 3 - potentially most tractable for argument).
  2.  **Focus on the Outsourcing Test (Targeting Strand 3):** This is your most promising lever. Don't ask if it "counts" as the objection, but use it to probe *why* the Williamsian finds it unsatisfying.
      *   *Scenario Refinement:* Make the outsourcing *perfect* - seamless, optimally effective, no epistemic worries. Does the alienation persist *in the deliberation leading to participating in the system*? Is the agent's thought "I pay so I can focus on *my* stuff" itself alienating from a Williamsian view? Is *living within* such a system inherently alienating, even if one never faces a direct Williams-case dilemma?
      *   *Question:* If the *only* alienation occurs at the moment of endorsing/participating in the system, and thereafter the agent acts "freely" from projects, is this alienation *morally significant* in the way the original cases are? Or is it just the cost of achieving impartial justice? This forces clarity on whether the objection is truly about deliberation *as such* or about *directly* performing alienating actions.
  3.  **Explore Hybrid Theories/Acknowledgements:** Instead of seeking a knockout blow, look for concessions or syntheses.
      *   Can Consequentialism formally model "nested agency"? E.g., Granting individuals a "sphere of agency" where agent-relative reasons operate *by default* as a rule justified on agent-neutral grounds (promoting well-being, stability, etc.), but overrideable in extreme cases. Does this preserve enough non-alienation? Does it satisfy the Williamsian demand for *intrinsic* authority of identity-conferring projects?
      *   Can the Williamsian acknowledge that *some* feeling of alienation might be the cost of moral responsibility in an interconnected world, while insisting that *deep, identity-shattering* alienation points to a flaw? This requires refining the grad student's distinction between deep attachment and identity-conferral.
  4.  **Shift to Moral Psychology & Epistemology:** Acknowledge the foundational impasse on reasons (Strand 1) might be unresolvable here. Focus instead on the *epistemic role* of identity-conferring projects.
      *   Do such projects provide essential *orientation* for moral deliberation that cannot be replicated by an impersonal calculus? Is alienation partly an *epistemic* failure – losing access to the values embedded in those projects?
      *   Does demanding constant impartial perspective undermine the motivational resources needed for *any* sustained moral action (as Scheffler argued)?
  5.  **Accept the Stalemate & Map the Territory:** Conclude that, *as posed*, the question ("Is Williams's integrity objection fatal to consequentialism?") might be ill-posed because it bundles incommensurable disagreements. The three years weren't wasted; they revealed the profound depth and structure of the dispute. Future progress might involve:
      *   Clarifying the *costs* of each view more precisely (What does Consequentialism demand we give up? What moral risks does Williams's view run?).
      *   Exploring *which* projects generate the strongest integrity objections and why (e.g., relationships vs. creative endeavors vs. commitments to ideals).
      *   Investigating historical or cultural variations in conceptions of self and agency relevant to the "identity" strand.

  **Honest Assessment:** Strand 1 (agent-relativity) bottoms out in fundamental, arguably intuition-driven, metaethical commitments. Strand 2 (normativity of identity) is highly arguable but inextricably linked to Strand 1. Strand 3 (deliberative standpoint) is the most promising for substantive argument and potential progress, especially using tools like the outsourcing test to force clarification. **The outsourcing case is not a changed subject; it's a crucial test case revealing whether the core objection is about *consequences* or *deliberative constitution*.** Your three years reflect the depth of the problem. Progress now likely requires shifting the focus, accepting partial victories (like clarifying *why* the disagreement persists), or exploring the implications of the different standpoints within applied contexts rather than seeking a grand resolution on the original terms.
