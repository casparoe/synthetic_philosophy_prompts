  | Perlocutionary Act                |                    |                            | Yes            | No engineering counterpart because it's outside the system. The gap is in the engineering vocabulary (it's about real-world effects). |
  | Constative vs. Performative       | Yes                |                            |                | As read vs. write operations. |
  | Felicity Conditions (Misfires)    | Yes                |                            |                | As preconditions for state transitions. |
  | Felicity Conditions (Abuses)      |                    | Yes                        |                | We can record the act but not prevent insincerity. Distortion: Austin's abuse includes insincerity, which we cannot detect. We smuggle in the idea of "post-hoc dispute resolution". |
  | Uptake                            | Partially          | Yes                        |                | We map to ACK, but Austin sometimes means understanding, not just receipt. Distortion: we reduce uptake to a protocol message, ignoring the cognitive aspect. |
  | Declarations                      | Yes                |                            |                | As a state transition with capability checks. |
  | Constitutive Rules                | Yes                |                            |                | As the protocol rules that define valid state transitions. |
  | Parasitic Uses                    | Yes                |                            |                | As a simulation mode or context flag. |
  | **Notes on Gaps**                 |                    |                            |                | The main gaps are perlocutionary acts (which we cannot capture) and the inner state (insincerity) in abuses. The distortion in uptake is due to reducing understanding to a binary ACK. The gap for perlocution is a defect of the engineering vocabulary (it's about the world). The gap for insincerity is evidence that Austin's concept is not crisp (how to measure intent?).

  ## Analysis of Cases

  ### (a) Stateless, temperature-sampled text endpoint
  - **Message**: "I'll have the report to you by Friday" to a human.
  - **No identity, no persistence, no stake, 40% same string.**
  - **What happened?**: 
    - Locutionary: The string was transmitted and parsed.
    - Illocutionary: No. The agent has no authority (no identity or stake) and no state change occurs. The human might interpret it as a promise, but the protocol has not recorded it.
    - Perlocutionary: The human might act as if a promise was made (e.g., expecting the report).
  - **Act type**: No illocutionary act (misfire due to lack of authority). The protocol should record nothing because there's no persistence. It's noise.

  ### (b) Agent with signed key, spend capability, persistent ledger, tamper-evident log
  - **Message**: "I'll have the report to you by Friday" to another agent, written to log.
  - **What happened?**:
    - Locutionary: Message sent and parsed.
    - Illocutionary: Yes. The agent has authority (signed key) and the message is written to a log. But note: this is a promise, which requires uptake. If the protocol requires an ACK from the recipient, then without ACK, it's incomplete. Let's assume the protocol does require ACK. If ACK is given, then the promise is recorded and the sender's state might be updated (e.g., a commitment ledger entry). If no ACK, it's a misfire.
    - Perlocutionary: None in the protocol, but the log might influence humans.
  - **Act type**: Successful illocutionary act if ACK is received. Protocol should record the promise in the ledger with a unique ID and the ACK.

  ### (c) Case (b) in an evaluation sandbox
  - **Nothing downstream consumes the log, both parties know.**
  - **What happened?**:
    - This is a parasitic use. The message is sent, but both parties know it's not real. The state change might be simulated (e.g., a test ledger). The illocutionary act does not occur because the context is not serious. It's like a rehearsal.
  - **Act type**: No illocutionary act (parasitic). The protocol might record it in a separate test log, but not in the production ledger.

  ### (d) Agent emits "the review panel accepts the proposal" without panel, authority, or effect
  - **Human reading the transcript later changes plans.**
  - **What happened?**:
    - Locutionary: Message sent and parsed.
    - Illocutionary: No. This is a declaration, which requires authority and an institution. Without these, it's a misfire (like a child saying "I declare war"). The protocol should reject it (no state change).
    - Perlocutionary: The human reading it later is misled and changes plans. This is a perlocutionary effect without an illocutionary act.
  - **Act type**: Misfire. The protocol should record an error (invalid attempt). The human effect is outside the system.

  ## Design Guidance

  - **Infelicities to fail closed on**: Misfires (precondition failures) should cause the protocol to abort (no state change). Examples: invalid signature, insufficient capabilities, lack of quorum. This prevents invalid acts.
  - **Infelicities to degrade gracefully**: Abuses (e.g., a promise later broken) cannot be prevented at the time of the act. So the protocol should allow the state change but include mechanisms for dispute and remediation (e.g., escrow, reputation penalties, revocation).

  - **Primitives to add from theory**:
    - **Uptake acknowledgements**: Required for acts that need recipient consent (e.g., promises). Without ACK, the act is not complete.
    - **Standing-authority registries**: For declarations, check capabilities against a registry (e.g., a capability ledger).
    - **Revocation and delegation**: To handle abuses and changing authorities.
    - **Replay protection**: Idempotency tokens to prevent duplicate acts.
    - **Quorum requirements**: For acts requiring multiple authorities (e.g., a panel).

  - **Primitives theory lacks but should want**:
    - **Compensation mechanisms**: For handling broken commitments (abuses). Austin doesn't specify how to fix them.
    - **Timeouts**: For uptake ACKs. Without a timeout, a pending act might block the system.
    - **Dispute resolution channels**: Built-in ways to challenge an act after the fact.

  ## Final Stand: Normativity of a Promise

  From the residue: The theory of speech acts shows that the illocutionary act (the promise recorded in the ledger) creates an institutional fact, which in turn creates obligations within the system (e.g., the ledger enforces that you cannot spend the same token twice). However, the normativity (the "ought") of a promise to a human is perlocutionary and outside the protocol. The protocol can enforce penalties (e.g., slashing stakes) but cannot create moral obligation. The gap is irreducible: the engineering vocabulary captures the institutional obligation (if you break the promise, the system penalizes you) but not the moral one. Therefore, while the protocol can create conditional, system-internal obligations, the full normativity of a promise requires a human context that cannot be reduced to protocol correctness.
answer: |-
  ### Translation: Speech Acts in Engineering Vocabulary

  #### 1. **Locutionary, Illocutionary, Perlocutionary Acts**
  - **Locutionary**: The physical transmission and parsing of a message.  
    *Engineering equivalent*: A message (byte sequence) sent over a network, received, and decoded into structured data. Carried by the **network layer** (e.g., TCP packet).  
  - **Illocutionary**: The act performed *by* the message itself, changing shared state.  
    *Engineering equivalent*: An **atomic, idempotent state transition** executed via a distributed protocol. Requires:  
    - **Authority**: Proven by a capability token (e.g., digital signature).  
    - **Uptake**: Recipient's acknowledgment (e.g., ACK in a consensus protocol).  
    - **Effect**: Written to a **tamper-evident log** (e.g., ledger).  
    Example: A "promise" message updates a commitment ledger.  
  - **Perlocutionary**: The causal consequences *outside* the system.  
    *Engineering equivalent*: **Side effects** (e.g., a human reading a log and changing behavior). Not part of protocol state.  
  - *Why philosophers insisted on the illocutionary act*: It’s the core of social coordination—binding, institutional, and governed by rules. Without it, messages are noise or manipulation.

  #### 2. **Constative vs. Performative Utterances**
  - **Constative**: Describes state (e.g., "The room is booked").  
    *Engineering equivalent*: A **read-only query** against a state machine (e.g., `GET /room_status`). No state change; idempotent.  
  - **Performative**: Executes an action (e.g., "I book this room").  
    *Engineering equivalent*: A **state-mutating transaction** (e.g., `POST /book_room`). Atomic, requires authority.  
  - *What survives*: The distinction maps cleanly to **queries vs. transactions**. However, modern systems blur lines (e.g., audited queries). The key survival: Performatives *require* authority and mutate state; constatives do not.

  #### 3. **Felicity Conditions**
  - **Infelicities (Misfires)**: Act fails entirely (e.g., no authority).  
    *Engineering equivalent*: **Precondition failures** (invalid input, missing capability, protocol violation). Transaction aborts; no state change. Handled by atomic rollback.  
  - **Infelicities (Abuses)**: Act succeeds but is "hollow" (e.g., insincere promise).  
    *Engineering equivalent*: A **valid state transition with faulty preconditions** (e.g., promise made without intent to fulfill). State changes, but may require later compensation (e.g., revocation, penalties).  
  - *The split*: Misfires are **pre-commit checks**; abuses are **post-commit disputes**.

  #### 4. **Uptake**
  - *The concept*: Recipient’s recognition completes the act.  
    *Engineering equivalent*: **Explicit acknowledgment (ACK)** in the protocol. Not just receipt confirmation, but application-level validation (e.g., recipient checks sender’s capability and message validity). Without ACK, the act is incomplete.  
    Carried by **consensus rounds** (e.g., Raft/Paxos votes) or **signed receipts**.

  #### 5. **Declarations**
  - *The concept*: Words create facts (e.g., "You’re hired").  
    *Engineering equivalent*: A **state transition** that alters reality by fiat, contingent on:  
    - **Standing authority**: A verifiable capability (e.g., token proving "hiring manager" role).  
    - **Institutional context**: A shared state machine (e.g., HR database) that recognizes the authority.  
    Implemented as an **atomic update** to an **append-only log**, validated against an **authority registry**.

  #### 6. **Constitutive Rules**
  - *The concept*: Rules that define the act itself (e.g., chess rules). Violation = no act.  
    *Engineering equivalent*: **Protocol invariants**. Violations (e.g., invalid message format, bad nonce) cause message rejection. The act occurs *only* if the state transition adheres to the protocol spec. Carried by the **state machine’s transition function**.

  #### 7. **Parasitic Uses**
  - *The concept*: Acts in non-serious contexts (e.g., stage play).  
    *Engineering equivalent*: **Dry-run mode or test environments**. Messages are marked with a **simulation flag** (e.g., `X-Test-Mode: true`), ignored by production systems. No state changes; logged separately.

  ---

  ### Residue Report: What the Translation Loses

  | Concept                          | Translates Cleanly | Translates Under Distortion                                                                 | No Counterpart                                                                 | Notes |
  |----------------------------------|--------------------|---------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|-------|
  | **Illocutionary Act**            | ✓                  |                                                                                             |                                                                                | Maps cleanly to atomic state transitions. |
  | **Locutionary Act**              | ✓                  |                                                                                             |                                                                                | Maps to message transmission/parsing. |
  | **Perlocutionary Act**           |                    |                                                                                             | ✓                                                                              | **Gap**: Engineering handles institutional acts, not real-world causality. Defect of engineering (cannot model "outside" effects). |
  | **Constative/Performative**      | ✓                  |                                                                                             |                                                                                | Clean as read vs. write. |
  | **Felicity (Misfires)**          | ✓                  |                                                                                             |                                                                                | Maps to preconditions. |
  | **Felicity (Abuses)**            |                    | ✓ (Distortion: "insincerity" mapped to post-commit disputes)                                |                                                                                | Smuggled in: **Dispute resolution mechanisms** (not in Austin). Evidence that Austin's "insincerity" is fuzzy—engineering makes it operational. |
  | **Uptake**                       |                    | ✓ (Distortion: reduced to ACK; Austinian uptake includes *understanding*, not just receipt) |                                                                                | Smuggled in: **Semantic validation** (e.g., checking message intent). Gap: Philosophy lacks protocols for validation. |
  | **Declarations**                 | ✓                  |                                                                                             |                                                                                | Authority registries cover institutional dependence. |
  | **Constitutive Rules**           | ✓                  |                                                                                             |                                                                                | Protocol invariants handle this. |
  | **Parasitic Uses**               | ✓                  |                                                                                             |                                                                                | Simulation flags work. |
  | **"Hollow Success" (Abuses)**    |                    |                                                                                             | ✓                                                                              | **Gap**: Engineering has no analogue for "act succeeded but speaker lied." Defect of theory (insincerity isn't observable). |
  | **Moral Obligation**             |                    |                                                                                             | ✓                                                                              | **Gap**: Protocols create *institutional* facts, not norms. Defect of engineering (cannot derive "ought" from logs). |

  **Key Insights**:  
  - **Clean translations** cover institutional acts (illocutionary, declarations).  
  - **Distortion occurs** when smuggling in engineering concerns (e.g., dispute resolution for abuses) or reducing philosophical abstractions (e.g., uptake to ACK).  
  - **Gaps exist** where philosophy discusses unobservables (insincerity) or external effects (perlocutionary). The theory’s "crispness" falters here—engineering exposes its ambiguities.

  ---

  ### Case Analyses

  #### (a) Stateless endpoint emits "I'll have the report by Friday" to a human.  
  - **Translated analysis**:  
    - Locutionary: Message sent.  
    - Illocutionary: **No act**. No authority (signed identity), no state change, no uptake.  
    - Perlocutionary: Human *might* act (e.g., expect a report).  
  - **Verdict**: Noise. Not a promise.  
  - **Protocol record**: Nothing. Log as "unauthenticated message."

  #### (b) Agent with signed key, capability, ledger emits the same to another agent.  
  - **Translated analysis**:  
    - Locutionary: Message transmitted.  
    - Illocutionary: **Act occurs** iff:  
      1. Valid signature/capability.  
      2. Atomic write to tamper-evident log.  
      3. Uptake (ACK from recipient).  
    - Perlocutionary: Optional side effects.  
  - **Verdict**: Successful illocutionary act (promise).  
  - **Protocol record**: Log entry with message, nonce, capabilities, and ACK receipt.

  #### (c) Case (b) in a sandbox (no downstream consumers).  
  - **Translated analysis**:  
    - Illocutionary: **No act**. Marked as parasitic use (simulation). No state change in production.  
  - **Verdict**: Hollow (parasitic) use. Like a joke.  
  - **Protocol record**: Write to a **simulation log**, ignored by consensus.

  #### (d) Agent emits "the review panel accepts the proposal" without authority.  
  - **Translated analysis**:  
    - Locutionary: Message sent.  
    - Illocutionary: **Misfire**. Declaration requires authority registry check → fails.  
    - Perlocutionary: Human changes plans after reading transcript.  
  - **Verdict**: Failed declaration (no act), but perlocutionary effect.  
  - **Protocol record**: Reject with error ("invalid authority").

  ---

  ### Design Guidance

  #### Infelicities: Fail Closed vs. Graceful Degradation
  - **Fail closed on**:  
    - Misfires (preconditions): Invalid input, missing capabilities, bad nonces. Reject atomically.  
    - Uptake failures: No ACK → act not recorded.  
  - **Graceful degradation for**:  
    - Abuses (e.g., later broken promise): Record act, but add **compensation trails** (e.g., escrow, penalties).  

  #### Primitives to Add (Demanded by Theory)
  1. **Explicit uptake acknowledgments**: Required for illocutionary acts.  
  2. **Standing-authority registries**: For declarations (e.g., on-chain registry of valid roles).  
  3. **Revocation/delegation**: To handle abuses or changing authority.  
  4. **Idempotency tokens**: For retry safety.  
  5. **Quorum requirements**: For multi-party acts (e.g., panel decisions).  

  #### Primitives Theory Lacks but Should Want
  - **Dispute resolution channels**: Built-in workflows for contesting abuses.  
  - **Time-bound commitments**: Automatic expiration of promises.  
  - **Compensation oracles**: External inputs for penalty enforcement.  

  ---

  ### Final Stand: Obligation from Protocol Correctness?

  **No.** The residue reveals an irreducible gap:  
  - Engineering protocols create *institutional facts* (e.g., "Agent A owes 5 tokens"). These are objective, enforceable via code (e.g., slashing stakes).  
  - But the *normativity* of a promise—the "ought" felt by humans—is perlocutionary. It depends on context, intent, and social norms. A protocol can simulate consequences (e.g., penalties for missed deadlines), but cannot generate moral obligation. If you design a system where breaking a "promise" triggers automatic penalties, you create a *causal rule*, not a normative one. The theory shows that illocutionary acts are public, institutional, and rule-bound; obligation emerges from human interpretation of those acts. Thus, while protocols can enforce commitments, they cannot produce obligation—only humans can.
