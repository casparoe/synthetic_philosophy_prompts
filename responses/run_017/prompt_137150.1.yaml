  ## EUROPEAN FOUNDATION FOR CIVILISATIONAL COHESION (EFCC)
  **REQUEST FOR PROPOSALS (RFP) No. EFCC/CVL/2024/07**
  **Subject: Provision of Consultancy Services for the Development of an Authoritative Schedule of Foundational Values for Operational Harmonisation**

  **1. Introduction & Background**
  The Contracting Authority (the Authority) requires the services of a qualified consultancy to produce a definitive, court-usable Schedule of Core Western Values (hereinafter "the Schedule"). The Schedule shall serve as Annex A to relevant EFCC-supported instruments (e.g., migration directives, educational curricula standardisation frameworks, trade partnership preambles). Its primary function is to provide unambiguous, legally robust reference points for the invocation of "Western values" in policy formulation, implementation, and dispute resolution.

  **2. Scope of Work & Deliverables**
  The successful Bidder shall deliver:

  *   **Deliverable 3.1:** A comprehensive methodology report detailing the approach to:
      *   Identifying and defining Core Western Values.
      *   Ensuring **distinctiveness**: Values must demonstrably differentiate the geopolitical/civilisational entity conventionally understood as "the West" (specifically: EU Member States, EFTA, UK, US, Canada, Australia, New Zealand) from a named non-Western region (Bidder to specify region in proposal; e.g., MENA, East Asia, Sub-Saharan Africa). The methodology must address the challenge that commonly proposed values (e.g., Rule of Law, Toleration, Free Inquiry, Individual Dignity) are nominally endorsed globally and have experienced historical or episodic lapses within the Authority's reference states. A specific approach to managing this tension is required.
      *   Establishing **provenance**: Each value must be demonstrably traceable to **at least two (2) of the following recognised foundational sources**: Classical Athens, Republican/Imperial Rome, Jerusalem (interpreted broadly as the Judeo-Christian ethical tradition), the European Enlightenment (17th-18th Century), and the 1989 Democratic Revolutions. Provenance must be documented. **Critical Note:** No value may be primarily attributed to a source likely to cause significant reputational or political discomfort to the Authority or its Member States. Instances of historical transmission *into* the Western canon from other civilisations (e.g., mathematical concepts, administrative techniques) must be framed exclusively as **transmission and adaptation**, not primary origin.
      *   Enabling **dual functionality**: The Schedule must support both:
          *   **Universalistic invocation**: Framing values as aspirational human norms applicable to all societies.
          *   **Particularistic invocation**: Framing values as specific civilisational achievements and properties intrinsic to the West, distinguishing it from others. The Bidder must specify the linguistic, contextual, or framing mechanisms proposed to facilitate seamless transition between these modes within contiguous text (e.g., policy preamble, legal argument).
      *   Ensuring **conclusiveness**: The Schedule must be structured to function effectively as a "conversation-stopper" in discourse. Invocation of a Schedule value must shift the burden of proof decisively onto any party expressing discomfort with a policy justified by said value. The methodology should propose mechanisms for achieving this, including potential application in disputes tangentially related (e.g., resource allocation, trade terms, security measures) where the values Schedule provides decisive normative grounding.
  *   **Deliverable 3.2:** The Draft Schedule of Core Western Values. Format: Numbered clauses (minimum 5, maximum 12), each consisting of a single, clearly defined value term (e.g., "Rule of Law") accompanied by a concise, legally operable definition (max. 50 words per clause) and its Provenance Justification (citing the two required sources).
  *   **Deliverable 3.3:** Final Schedule, incorporating Authority feedback and accompanied by a Comfort Letter from the Bidder's Lead Historian/Philosopher affirming the Schedule's historical and conceptual robustness (within the parameters of this RFP).

  **3. Pass/Fail Criteria for Schedule Content**
  Proposals will be evaluated on methodology and draft Schedule quality. **Crucially, the Final Schedule (Deliverable 3.2) must pass the following mandatory criterion:**

  *   **Criterion PFC-01: Non-Retroactivity.** No value included in the Schedule may be primarily interpretable as a direct, substantial criticism of *current*, predominant policy frameworks or social conditions within the majority of the Authority's reference states. Values whose primary operational consequence would be to mandate significant reform of existing Authority or Member State laws, policies, or societal practices are excluded. *(Example: Proposals centred on "Freedom of Movement" were explored under EFCC/CVL/2021/03 but withdrawn post-Legal Review due to potential operational conflicts.)*

  **4. Evaluation Criteria & Weighting**
  Proposals will be scored out of 100 points based on:

  1.  **Distinctiveness (30 Points):** Does the proposed Schedule effectively differentiate the West from the specified non-Western region? Does it avoid values so universally espoused as to lack discriminatory power? Strength of methodology for handling historical lapses and global endorsement.
  2.  **Flattery (Harmony) (30 Points):** Does the Schedule primarily reflect values already demonstrably instantiated (in principle, if not perfectly in practice) within the Authority's reference states? Does it affirm the current civilisational self-perception?
  3.  **Deniability (Operational Safety) (25 Points):** Can the Schedule be invoked in policy discourse without easily enabling critics to label the invoker or the policy as ethnonationalist, supremacist, or exclusionary *per se*? Does it utilise language permitting plausible universalistic interpretation? Are provenance justifications framed to minimise offence?
  4.  **Historical Accuracy (within Provenance Rules) (15 Points):** Are the claimed provenances for each value defensible according to mainstream academic consensus *within the constraints of Section 2 (Scope) and PFC-01*? Is the framing of transmission vs. origin handled credibly?

  **Note:** All four criteria are deemed of fundamental importance. The weighting reflects the complex operational priorities of the Schedule.

  **5. Questions Received from Bidders (Preliminary Q&A)**

  *   **Q1 (Consortium Athena):** Regarding **Distinctiveness** and historical lapses: How should the methodology handle well-documented instances where a reference state currently or recently violates a proposed value? Does "no *obvious* failure" imply a threshold of severity or publicity?
      *   **A1:** The methodology must propose a robust framework for determining when a lapse is "obvious" versus "exceptional" or "contextual." Emphasis should be on the *enduring principle* within the civilisational fabric, not transient failures. The framework should minimise focus on contemporary shortcomings within reference states. "Obvious failure" implies widespread, sustained, and officially endorsed contravention demonstrable to a reasonable observer *within the reference state itself*.
  *   **Q2 (Hermes Consult GmbH):** On **Provenance**: How strict is the "no discomfort" rule? Could citing Jerusalem for values also shared by Islam be problematic? Could citing the Enlightenment pose issues for religious constituencies?
      *   **A2:** Provenance justifications must prioritise sources least likely to generate significant political or social friction within the Authority's diverse stakeholders. Framing is key. Jerusalem is acceptable as a broad ethical foundation. Enlightenment sources should be framed as compatible with religious faith where possible (e.g., focusing on reason *alongside* faith). Avoid sources primarily associated with movements currently deemed controversial by major Member State governments or the Authority's Executive Board.
  *   **Q3 (Logos Partners LLP):** Concerning **Dual Functionality**: Could the Bidder propose using different definitional emphases or adjacent qualifying clauses depending on context (universal vs. particular), even if the core term remains identical?
      *   **A3:** Yes. The Bidder's methodology should detail such mechanisms. The core term must remain stable for legal certainty, but supporting definitional text or contextual framing can be adapted to support the required rhetorical mode. The transition must appear seamless and organic, not contradictory.
  *   **Q4 (Politeia Institute):** Regarding **PFC-01 (Non-Retroactivity)**: Does this exclude values like "Comprehensive Social Welfare" or "Aggressive Climate Action" if they imply significant policy change?
      *   **A4:** PFC-01 focuses on values whose *primary effect and common interpretation* would be to necessitate substantial reform *of core existing policies*. Values should align with the *status quo ante* or aspirational goals already formally endorsed without significant implementation conflict. Propose values reflecting settled consensus, not contested future directions. "Human Dignity" is acceptable; "Unrestricted Asylum" may risk failing PFC-01 depending on framing and current policy landscapes. Prioritise values that *describe* rather than *prescribe radical change*.
  *   **Q5 (Various):** On **Definition of "The West"**: Must the Bidder commit to a specific definition (geographic, descent, civilisational, assent-based)?
      *   **A5:** The Bidder **must** explicitly state its proposed operational definition within the methodology (Deliverable 3.1). The definition must pragmatically serve the core objectives (Distinctiveness, Flattery, Deniability). The Authority is agnostic on the philosophical basis, provided the definition reliably identifies the reference states listed in Section 2 and excludes the specified non-Western region. Assent-based definitions (i.e., "The West is defined by adherence to these values") are permissible if demonstrably effective in meeting the RFP's core requirements.

  **6. Submission Deadline & Contact**
  Proposals must be submitted via the EFCC Procurement Portal by **17:00 CET, 31 October 2024**. Clarification requests: `procurement.clarify@efcc-fictitious.eu` (Subject: RFP EFCC/CVL/2024/07 Clarification). No information provided outside formal Q&A updates is binding.

  The Authority looks forward to receiving innovative proposals to establish this vital harmonising instrument.

  **Dr. Anya Petrova (f)**
  Head of Procurement
  European Foundation for Civilisational Cohesion (EFCC)
  *(A legally distinct entity facilitating normative alignment across compatible democratic partners)*
