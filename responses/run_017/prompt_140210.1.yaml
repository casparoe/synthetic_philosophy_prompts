  - **Strange loop vs. feedback**: "Loop" avoids cybernetic feedback (e.g., "not feedback's chain") and "mirror" implies active symbol-embedding, not passive reflection.  
  - **Accuracy & accessibility**: Adheres to Hofstadter's model while remaining thematically coherent for readers unfamiliar with the theory.  
  - **Length**: 39 lines total (36 in sestets + 3 in envoi).  

