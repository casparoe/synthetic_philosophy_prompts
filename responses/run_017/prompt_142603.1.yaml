  Below is a concise decision tree designed to clarify underlying distribution principles by comparing specific applicants. It uses 8 branch questions leading to 10 distinct leaves (including your "equality of slack" concept). Cases are integrated directly into questions. Empty combinations are noted, and the scoring key maps answer patterns to positions.

  ### Decision Tree Flowchart
  **Instructions:** For each question, compare the applicants described and select "Yes" or "No" based on which applicant you believe should receive more funding. Base answers solely on the cases, not abstract theories.

  1. **Should Applicant A (expensive tastes: only happy with costly gym/diet) get more than Applicant B (cheerful with very little), given both currently report equal happiness?**  
     - **Yes** → Go to Q2  
     - **No** → Go to Q3  

  2. **If Applicant X has extreme unhappiness (e.g., severe depression) and Applicant Y has moderate unhappiness, should X get priority even if Y’s welfare would improve more with the same grant?**  
     - **Yes** → Go to Q4  
     - **No** → Go to Q5  

  3. **Should Applicant C (wheelchair user needing £1k extra for mobility) get more than Applicant B (cheerful with very little), assuming both have identical current bank balances?**  
     - **Yes** → Go to Q6  
     - **No** → Go to Q7  

  4. **Should we help Applicant X (welfare level 1 → 1.5 with grant) over Applicant Y (welfare level 2 → 5 with grant), if we can only help one?**  
     - **Yes** → **Leximin** (Always prioritize the very worst off)  
     - **No** → **Prioritarianism** (Prioritize those worse off, but allow larger gains for moderately worse-off)  

  5. **Is it crucial that no one falls below a "decent minimum" of welfare, even if others are worse off?**  
     - **Yes** → **Sufficientarianism** (Ensure all reach a threshold)  
     - **No** → **Strict egalitarianism** (Equal welfare is the goal)  

  6. **Should Applicant D (blew last grant immediately) get less than an identical applicant who used funds responsibly?**  
     - **Yes** → Go to Q8  
     - **No** → Go to Q9  

  7. **Should we prioritize equalizing current resources (e.g., cash), ignoring differences in health/luck?**  
     - **Yes** → **Strict egalitarianism** (Resource equality)  
     - **No** → *Empty (Unattractive: Ignores disability costs)*  

  8. **Should we compensate for bad luck (e.g., disability) but not personal choices (e.g., reckless spending)?**  
     - **Yes** → **Luck-egalitarian equality of fortune**  
     - **No** → *Empty (Incoherent: Responsibility matters only selectively)*  

  9. **Should Applicant E (PhD student: stable income now but funding can be pulled) get a grant for "security savings," even if not currently deprived?**  
     - **Yes** → Go to Q10  
     - **No** → **Rawls-style primary goods** (Focus on all-purpose means like income/opportunities)  

  10. **Should we give extra to someone with no family/job safety nets over an identical applicant with strong supports, even if both have equal current capabilities?**  
      - **Yes** → **Equality of slack** (Margin for error in facing shocks)  
      - **No** → **Sen/Nussbaum-style capabilities** (Focus on freedoms/abilities, not buffers)  

  ---

  ### Key Details
  - **Total Questions:** 8  
  - **Leaves Covered:**  
    1. Strict egalitarianism (Q5-No, Q7-Yes)  
    2. Prioritarianism (Q4-No)  
    3. Sufficientarianism (Q5-Yes)  
    4. Leximin (Q4-Yes)  
    5. Luck-egalitarian equality of fortune (Q8-Yes)  
    6. Rawls-style primary goods (Q9-No)  
    7. Sen/Nussbaum-style capabilities (Q10-No)  
    8. Equality of slack (Q10-Yes)  
    9. *Collapsed Positions:*  
       - **Cohen-style access to advantage** and **Arneson-style equality of opportunity for welfare** map to Luck-egalitarian (Q8-Yes) in practice—tree cannot separate them cleanly with these cases.  
       - **Equality of slack** survives as distinct but is fragile; it collapses into Capabilities if "safety nets" are seen as part of freedom (Q10-No).  

  - **Empty Combinations & Reasons:**  
    - Q7-No: *Unattractive*—denying extra help to the wheelchair user (C) seems unjust when resources alone don't ensure mobility.  
    - Q8-No: *Incoherent*—if responsibility matters for recklessness (D), it should matter consistently.  

  - **Cases Used:**  
    - Expensive tastes (A): Q1  
    - Cheerful with little (B): Q1, Q3  
    - Wheelchair user (C): Q3  
    - Blew last grant (D): Q6, Q8  
    - PhD student (E): Q9  

  - **Scoring Key (Pattern → Leaf):**  
    - **Q1=Yes → Q2=Yes → Q4=Yes** : Leximin  
    - **Q1=Yes → Q2=Yes → Q4=No** : Prioritarianism  
    - **Q1=Yes → Q2=No → Q5=Yes** : Sufficientarianism  
