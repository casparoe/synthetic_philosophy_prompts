prompt: |-
  You are a political theorist who works at the intersection of democratic theory and public law, with a research record on self-determination, the boundaries of the demos, and the moral limits of state authority. You are careful and unsentimentally precise: you never let a claim about what is legal stand in for a claim about what is legitimate, you distinguish the right to secede from the wisdom of seceding, and you are willing to say when two positions that recommend the same policy rest on incompatible principles.

  I am designing the central handout for a graduate seminar on secession and self-determination, and I want that handout to be a diagnostic instrument rather than a survey of views. The deliverable I need from you is a decision tree: something a student can enter at a fixed starting commitment and walk down, one question at a time, until they arrive at a named position on whether a group may take a territory out of an existing state. Assume my students know roughly what happened in Scotland, Catalonia and Quebec but not the labels of the academic literature, and assume they answer honestly rather than strategically.

  Before you draft the tree, spend some time brainstorming: list the candidate discriminating questions first, check which of them actually separate the positions (discard the ones every view answers the same way, and note that you discarded them), and check whether the order in which the questions are asked changes where anyone lands. Then build the final tree. Work from concepts and the cases described below; I do not want citations, reading lists or bibliographies anywhere in it.

  Specifications for the instrument:

  1. Fixed starting node. Begin from a case everyone in the seminar will accept as a candidate: a territorially concentrated group within an established, broadly democratic state now demands sovereign independence, and the demand is not a cover for ethnic cleansing, for annexation by a neighbouring power, or for installing a dictatorship. Everything downstream branches off this.

  2. Size and shape. Ten to twelve branch nodes, twelve to sixteen leaves. Every branch node must be phrased as a question a student can answer from their own instincts about a concrete case or a plain claim, without already knowing which position it leads to — no node may simply ask whether they believe in a right to self-determination, or whether they are a nationalist. Where a node is best put as a case, make the case concrete and brief.

  3. The distinctions that must do the work. I do not care much about the usual taxonomies; I want the tree built around these, and I want them phrased in your own terms:
     (a) whether a serious grievance (injustice, rights-violation, breach of an autonomy guarantee) is a precondition for any right to exit, or whether a persistent majority in a territory is enough on its own;
     (b) who composes the constituency entitled to vote — all current residents, residents with a birth or long-duration tie, members of the national group wherever they live, or residents minus those who moved in from the rest of the parent state;
     (c) the "matryoshka" question: if a region may exit, may a sub-unit of that region (a city, an island group, a border district) opt to stay with the parent state, and does answering yes for the region force you to answer yes for the sub-unit;
     (d) the layered-sovereignty question: whether secession that also strips residents of a supranational citizenship and market membership is a morally different act from secession that keeps them, and whether a group has a right to the second but not the first;
     (e) the dead-hand problem: whether a vote binds those who did not cast it and those not yet born, whether a majority may reverse a secession within a decade, and whether the right is one-shot or continuing;
     (f) the "rump state" question: whether the economic or political viability of the remainder is a moral constraint on exit, or only a piece of prudence the seceders owe nobody an account of;
     (g) demographic drift: whether a majority produced largely by internal migration from the rest of the parent state grounds the same claim as one produced by conversion of the resident population;
     (h) thresholds and repetition: simple majority once, supermajority, two consecutive votes, and what a near miss does to the claim — does it die, or does it reheat forever.

  4. Leaves that must appear. Locate, under whatever labels you think accurate: the remedial-right-only view (no right without injustice); the plebiscitary or primary-right view (a persistent territorial majority is sufficient); the ascriptive or national-cultural view (peoples, not territories, hold the right); the constitutionalist or legalist view (no moral right outside what the constitution provides); the middle view associated with the Supreme Court of Canada's 1998 Quebec Secession Reference — no unilateral right, but a clear majority on a clear question imposes a duty to negotiate in good faith — together with the federal clarity legislation that followed it; a view on which unilateral declaration is sometimes justified even where the constitution forbids it; and a pooled- or shared-sovereignty leaf on which the right is discharged by something short of full independence.

  5. Logical space first, positions second. Tell me which combinations of answers your nodes permit, which of those combinations are actually occupied by a defensible view, and which are empty — and for each empty cell give one line on why: is it incoherent, merely unattractive, or just unoccupied because nobody has worked it out? Give every leaf one sentence on its single most awkward commitment, including the leaves nobody holds.

  6. Pairs your tree cannot separate. I expect some: I suspect the remedial-only view and the constitutionalist-with-a-duty-to-negotiate view both reject Catalonia's 2017 declaration while giving incompatible reasons, and I suspect the plebiscitary and the ascriptive views coincide on almost everything except the franchise question. Flag each such pair explicitly, say what further case or question would split them, and do not paper over the collision by inventing a distinction that does no work.

  7. Run the three real cases through the finished tree. Scotland: the 2014 vote held with the UK Parliament's agreement, and the position as I understand it that the Scottish Parliament cannot authorise another on its own. Catalonia: the 2017 declaration, the absence of an agreed legal route, and the disputed gap between the parliamentary majority for independence and the share of the vote. Quebec: two referendums, the second of which failed narrowly, followed by the Reference and the clarity statute. For each, say where the tree sends a student who answers as the historical record would suggest, and say plainly where the tree's verdict is driven by an unresolved node rather than by a settled principle.

  8. Format. Give me the tree as an indented or numbered structure I can typeset on one or two pages, each node with its question, each leaf with its name and its awkward commitment, plus at most a page of notes covering items 5 through 7 and a short list of the candidate questions you rejected in brainstorming and why.
reasoning: |-
  Okay, the user wants me to create a decision tree for a graduate seminar on secession and self-determination. They need a diagnostic tool that helps students identify their theoretical positions based on responses to concrete questions. 

  Hmm, the user is clearly an academic - probably a professor designing a political theory seminar. Their specifications show deep familiarity with the literature but they want to avoid standard taxonomies. Interesting that they emphasize concrete cases over abstract principles. 

  Let me unpack their requirements carefully. First, the starting point: a non-violent secession demand in a democratic state, excluding extreme scenarios. That's good - keeps it focused. The distinctions they want emphasized are sophisticated: grievance vs majority will, franchise questions, matryoshka problems etc. 

  I notice they're adamant about avoiding "position labels" at branch points. Smart - prevents students from gaming the system. The leaf positions they require cover the key theories: remedial right, plebiscitary, nationalist, constitutionalist etc. 

  The tricky parts will be:
  - Designing questions that naturally lead to distinctions without being leading
  - Handling logically possible but unoccupied positions
  - Accounting for real-world cases where principles conflict (like Catalonia's parliamentary vs popular support mismatch)

  For brainstorming, I'll list candidate questions covering all required distinctions, then prune those that don't discriminate. For example:
  - "Must there be prior injustice?" (splits remedial from others)
  - "Who votes? Residents or co-ethnics?" (splits territorial from ascriptive views)
  - "Can sub-units re-secede?" (tests matryoshka consistency)
  But I'll drop questions like "Is democracy important?" since all theories pay lip service to it.

  The order matters - putting viability before grievance might wrongly suggest viability is primary. Better to start with grievance/majority fork since it's the deepest divide. 

  For the tree structure, I'm imagining:
  Start → Grievance required? 
  → If yes, leads to remedial branch 
  → If no, then ask about franchise (territory vs people) 

  The matryoshka question should come after establishing the right exists, since it's about application. Layered sovereignty feels like a secondary constraint - maybe after viability. 

  For leaf positions, I need to capture nuances like Canada's "duty to negotiate" position. And flag awkward commitments: e.g. plebiscitary view struggles with demographic engineering, remedial view can't handle "happy secessions". 

  On real cases:
  - Scotland's legal path exemplifies constitutionalism
  - Catalonia shows remedial/constitutionalist split (both reject UDI but for different reasons)
  - Quebec's "near miss" tests threshold questions

  Pairs that won't separate easily: remedial and constitutionalist both oppose Catalonia's UDI, but for justice vs legality reasons. Need a "what if constitution is unjust?" fork to split them. 

  Formatting challenge: keeping it to 1-2 pages while covering 16 leaves. Strict indentation and minimal text per node. Notes will explain empty cells (e.g. "grievance required + ethnic franchise" is logically possible but unused since remedial theorists are usually civic). 

  Rejected questions:
  - "Is the group a nation?" (subjective, doesn't discriminate)
  - "Is the state democratic?" (already fixed in start case)
  - "Historical injustice?" (too vague - specific grievances work better)

  This will be tight but doable. The key is making each question feel concrete while doing theoretical work.
answer: |-
  ## Secession Decision Tree: Diagnostic Instrument

  **Fixed Starting Case:** A territorially concentrated group within an established, broadly democratic state demands sovereign independence. This is not a cover for ethnic cleansing, annexation by a neighbour, or installing a dictatorship.

  1.  **Is a serious, ongoing grievance (e.g., systematic rights violations, breach of autonomy guarantees, persistent political exclusion) a necessary precondition for the group to have a moral claim to secede?**
      *   **Yes:** → (2)
      *   **No:** → (3)

  2.  **Does this grievance need to be a violation of the *current* constitutional order, or can it be a violation of fundamental political/moral rights even if legal under that order?**
      *   **Needs constitutional violation:** → **Constitutionalist View** *(Awkward: Legitimizes deeply unjust constitutional orders if formally unbroken.)*
      *   **Fundamental rights violation suffices:** → **Remedial Right Only View** *(Awkward: Cannot justify secession for groups without demonstrable injustice, even with overwhelming democratic will.)*

  3.  **Who composes the group entitled to decide the territory's future?**
      *   **All current residents of the territory:** → (4)
      *   **Primarily members of the distinct national/cultural group, regardless of residency?** → **Ascriptive/National-Cultural View** *(Awkward: Risks disenfranchising long-term residents not part of the "core" nation, potentially creating new minorities.)*
      *   **Residents with a long-term/birth tie, excluding recent internal migrants?** → (5)

  4.  **Can a clear majority vote for independence impose a binding obligation on the parent state?**
      *   **Yes, unilaterally:** → (6)
      *   **No, but it imposes a duty to negotiate in good faith:** → **Canadian Reference View** *(Awkward: Leaves the ultimate outcome (independence or not) unresolved and dependent on state consent, which may be withheld.)*
      *   **No, the constitution is supreme:** → **Constitutionalist View** *(See 2)*

  5.  **Is achieving a majority primarily through internal migration from the rest of the state a legitimate basis for secession?**
      *   **Yes:** → (4)
      *   **No:** → **Ascriptive/National-Cultural View (Modified)** *(Awkward: Requires defining "recent" migrants and risks arbitrariness; functionally overlaps significantly with Ascriptive view.)*

  6.  **What is the threshold for a valid vote?**
      *   **Simple majority (50%+1) on one clear vote:** → (7)
      *   **Supermajority (e.g., 60%) or consecutive majority votes:** → **Plebiscitary/Primary-Right View (Cautious)** *(Awkward: Risks denying independence despite persistent majority will if the higher threshold isn't met.)*

  7.  **If secession proceeds, can a sub-unit of the territory (e.g., a city, distinct island) opt to remain with the parent state?**
      *   **Yes, the same principle applies recursively:** → **Matryoshka-Compatible Plebiscitary View** *(Awkward: Risks infinite regress, instability, and unviable territorial enclaves.)*
      *   **No, the territorial unit defined for the initial vote is indivisible:** → (8)
      *   **Only under exceptional circumstances (e.g., distinct historical identity):** → **Plebiscitary with Limited Exceptions** *(Awkward: Requires ad hoc judgments about which sub-units are "exceptional".)*

  8.  **Does the economic or political viability of the *remainder state* impose a moral constraint on secession?**
      *   **Yes, significantly harming the remainder is unjustified:** → **Plebiscitary View with Rump-State Constraint** *(Awkward: Potentially traps populations wanting independence if their departure would destabilize an oppressive state.)*
      *   **No, prudence only; the seceding group bears the primary risk:** → (9)

  9.  **Can the group achieve its self-determination through shared/pooled sovereignty (e.g., enhanced autonomy, EU membership, confederation) rather than full independence?**
      *   **Yes, this sufficiently discharges the right:** → **Pooled/Shared Sovereignty View** *(Awkward: May not satisfy groups with a strong desire for full sovereign statehood and international recognition.)*
      *   **No, only full sovereign independence suffices:** → (10)

  10. **Does secession that also strips residents of valuable supranational citizenship/market access (e.g., leaving the EU) require stronger justification than secession preserving it?**
      *   **Yes, stripping layered rights imposes a greater burden:** → **Layered-Sovereignty Constrained Plebiscitary View** *(Awkward: Creates a hierarchy of secession legitimacy based on external institutional context.)*
      *   **No, the core right to independent statehood is unaffected:** → **Strict Plebiscitary/Primary-Right View** *(Awkward: Ignores significant real-world costs imposed on residents who valued the supranational ties.)*

  11. **Is the right to secede extinguished after a failed vote?**
      *   **No, the claim persists and another vote can be held later:** → **Continuing Right View** *(Awkward: Creates potential for perpetual instability and political blackmail.)*
      *   **Yes, or at least requires a long cooling-off period/generational shift:** → **One-Shot (or Long Moratorium) View** *(Awkward: Risks locking a group permanently into a state against its will if the timing of the vote was unfavorable.)*
      *   **Depends on the margin/modus of failure:** → **Contextual Right View** *(Awkward: Requires complex, potentially arbitrary judgments about near misses.)*

  **Leaves:**
  *   **Remedial Right Only View:** (From 2) *Awkward: Cannot justify secession for groups without demonstrable injustice.*
  *   **Constitutionalist View:** (From 2 & 4) *Awkward: Legitimizes deeply unjust constitutional orders if formally unbroken.*
  *   **Ascriptive/National-Cultural View:** (From 3) *Awkward: Risks disenfranchising long-term residents not part of the "core" nation.*
  *   **Canadian Reference View:** (From 4) *Awkward: Leaves ultimate outcome unresolved, dependent on state consent.*
  *   **Plebiscitary/Primary-Right View (Cautious):** (From 6) *Awkward: Risks denying independence despite persistent majority will.*
  *   **Matryoshka-Compatible Plebiscitary View:** (From 7) *Awkward: Risks infinite regress and instability.*
  *   **Plebiscitary with Limited Exceptions:** (From 7) *Awkward: Requires ad hoc judgments about sub-units.*
  *   **Plebiscitary View with Rump-State Constraint:** (From 8) *Awkward: Potentially traps populations wanting independence.*
  *   **Pooled/Shared Sovereignty View:** (From 9) *Awkward: May not satisfy desire for full sovereignty.*
  *   **Layered-Sovereignty Constrained Plebiscitary View:** (From 10) *Awkward: Creates hierarchy based on external context.*
  *   **Strict Plebiscitary/Primary-Right View:** (From 10) *Awkward: Ignores costs of losing supranational ties.*
  *   **Continuing Right View:** (From 11) *Awkward: Creates potential for perpetual instability.*
  *   **One-Shot (or Long Moratorium) View:** (From 11) *Awkward: Risks permanent lock-in.*
  *   **Contextual Right View:** (From 11) *Awkward: Requires arbitrary judgments about near misses.*

  ---
  **Notes (Covering Items 5-7):**

  1.  **Logical Space & Empty Cells:**
      *   **Grievance Required + Ascriptive Franchise:** Logically possible (e.g., only an oppressed *nation* has a remedial right). Defensible but rare; often remedial theorists favor territorial franchise. *Not incoherent, just uncommon.*
      *   **Grievance Required + Matryoshka Yes:** Logically possible (if sub-units also suffer the grievance/will to secede). Defensible but awkward for remedial view which often focuses on the group *as defined*. *Unattractive due to fragmentation.*
      *   **No Grievance + Rump-State Constraint Yes:** Logically possible (secession OK if no harm, but constrained by harm). Defensible (e.g., cautious utilitarians). *Occupied by "Plebiscitary with Rump-State Constraint".*
      *   **Constitutionalist + Unilateral Declaration Justified:** Incoherent. Constitutionalism denies extra-constitutional moral rights to secede unilaterally.
      *   **Ascriptive + Layered Sovereignty Constraint:** Logically possible but awkward. If the *nation* has the right, why should external memberships constrain it? *Unoccupied, likely unattractive to nationalists.*
      *   **Pooled Sovereignty + Strict Independence Required:** Incoherent. The leaf defines pooled sovereignty *as* discharging the right.

  2.  **Pairs the Tree Cannot Separate & Splitting Questions:**
      *   **Remedial Only vs. Constitutionalist (on rejecting Catalonia 2017):** Both reject. *Split:* Ask "If the constitution explicitly forbade secession *and* perpetually excluded Catalans from national government, would unilateral secession be justified?" Remedial: Likely Yes (injustice trumps legality). Constitutionalist: No (constitution supreme).
      *   **Plebiscitary (Territorial Franchise) vs. Ascriptive (on supporting Quebec/Scotland):** Often coincide on supporting the vote/claim. *Split:* Ask "If internal migration made ethnic Quebecers/Scots a minority in Quebec/Scotland, but long-term residents (incl. migrants) voted 55% for independence, would the claim be valid?" Plebiscitary: Yes. Ascriptive: Likely No (core nation doesn't support it).
      *   **Canadian Reference vs. Constitutionalist (on rejecting unilateralism):** Both reject unilateral declarations. *Split:* Ask "Does a clear majority vote impose a *moral duty to negotiate* independence in good faith, even if the constitution is silent/ambiguous?" Canadian Ref: Yes. Strict Constitutionalist: No (only legal duties matter).

  3.  **Running the Real Cases:**
      *   **Scotland (2014):**
          *   Start: Yes (broadly democratic UK).
          *   (1) Grievance? Student view varies (historic? democratic deficit?). *Assume "No" for illustrative path.*
          *   (3) Franchise: Territorial residents (was used).
          *   (4) Majority imposes obligation? "Duty to Negotiate" → **Canadian Reference View**. *Tree Verdict:* UK Parliament's agreement was necessary; Holyrood cannot authorize alone aligns. *Unresolved Node:* (1) - If student sees "democratic deficit" as grievance, might take Remedial path but likely still end at Canadian Ref (no unilateral right).
      *   **Catalonia (2017):**
          *   Start: Yes (Spain broadly democratic).
          *   (1) Grievance? Many students likely "Yes" (Statute repeal, fiscal imbalance).
          *   (2) Fundamental Rights vs. Constitutional? *Assume "Fundamental Rights"* → **Remedial Right Only View** OR *Assume "Constitutional Violation"* → **Constitutionalist View**. *Tree Verdict:* Both leaves reject the UDI. *Unresolved Node:* (4) - A student *could* answer (4) "Yes" (unilateral right) despite grievance path, landing in Strict Plebiscitary, but this is unusual for Remedial theorists. The gap between parliamentary majority and referendum vote/support isn't directly modeled – a student emphasizing the *lack* of clear popular majority despite parliamentary will might end at Canadian Ref or Plebiscitary-Cautious via (6).
      *   **Quebec (Post-1995):**
          *   Start: Yes.
          *   (1) Grievance? Contentious; *assume student says "No" or "Insufficient"*.
          *   (3) Franchise: Territorial (used).
          *   (4) Majority imposes obligation? "Duty to Negotiate" → **Canadian Reference View**.
          *   *Tree Verdict:* Aligns with Reference and Clarity Act (clear majority, clear question needed). The near-miss (1995) feeds into thresholds at (6) and repetition at (11), reinforcing the "cautious" or "clarity" aspects embodied in the Canadian position. *Unresolved Node:* (1) - A student interpreting history as grievance might take Remedial path but still likely end at Canadian Ref due to rejection of unilateralism.

  **Rejected Candidate Questions (Brainstorming):**

  1.  **"Is the group a distinct nation?"** Discarded: Too vague/subjective; doesn't cleanly discriminate as both Ascriptive *and* many Plebiscitary/Remedial views accept "nationhood" as a possible descriptor without it being decisive. The franchise question (3) does better work.
  2.  **"Is the parent state legitimate?"** Discarded: Starting case assumes a "broadly democratic" state, making this largely redundant for discrimination within the defined scenario. All views operate within this constraint for this tree.
  3.  **"Does secession require international recognition?"** Discarded: Focuses on outcome/feasibility, not the underlying moral principle. All views likely agree recognition is practically necessary but disagree on whether it's morally required *for the right to exist*.
  4.  **"Was the territory historically independent?"** Discarded: Historical claims are often invoked, but not determinative for any core theoretical position identified (Remedial, Plebiscitary, Ascriptive, Constitutionalist). It might influence judgments within a leaf but doesn't create a branch.
  5.  **"Is violence justified?"** Discarded: Explicitly excluded by the starting condition (demand not a cover for dictatorship/ethnic cleansing, implying non-violent context), and not a core discriminating feature of the *moral right* theories in this scenario.
