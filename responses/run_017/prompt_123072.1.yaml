  ### Exposure Map: Stress-Testing the Polarization Thesis

  Your core claim—that perceived bad faith is manufactured through sampling asymmetry, monitoring-mode consumption, and a reciprocity ratchet—faces several decisive threats. Below, I identify defeaters ordered by danger, then summarize key implications.

  **1. Defeater Table**

  | rank | defeater                                                                 | mechanism                                                                 | defender_response          | severity    | status                     | forced_revision                                |
  |------|--------------------------------------------------------------------------|---------------------------------------------------------------------------|----------------------------|-------------|----------------------------|-----------------------------------------------|
  | 1    | The out-party's visible "tail" holds disproportionate policy-making power. | If extreme factions control agendas/primaries, sampling their views isn't misleading—it accurately reflects threat. | concede grudgingly (empirical variance by party/issue) | damaging    | arguably already observed  | Acknowledge power-visibility overlap in specific subsystems (e.g., primaries). |
  | 2    | Asymmetric institutional capture enables genuine bad-faith obstruction.  | If one side systematically weaponizes procedures (e.g., filibuster abuse), monitoring-mode is rational, not distorted. | concede (but note asymmetry may be downstream of ratchet) | damaging    | arguably already observed  | Specify "in the main" excludes tactics like stonewalling confirmed judges. |
  | 3    | Paraphrase ability correlates poorly with reduced hostility in experiments. | Your testable edge fails; improving understanding doesn't lower bad-faith perceptions as predicted. | concede (fatal if robust) | fatal       | live and testable now      | Drop paraphrase as diagnostic; refocus on auditability triggers. |
  | 4    | Monitoring-mode posture is rational when out-group openly endorses harmful policies. | If policies (e.g., deportation squads) directly threaten in-group welfare, threat detection is epistemically sound. | concede grudgingly (scope limitation) | damaging    | arguably already observed  | Restrict claim to identity disputes, not material threats. |
  | 5    | Your coalitions are misdefined; many voters hold cross-cutting identities. | If people don't cognitively partition into monolithic "sides," sampling asymmetry doesn't apply. | dismiss (coalitions are affective, not ideological) | cosmetic    | live and testable now      | Clarify "coalition" as perceived ingroup in polarized contexts. |
  | 6    | Reciprocity ratchet is falsified by asymmetric de-escalation successes.  | If one side consistently accepts goodwill gestures (e.g., peaceful power transfers), the ratchet isn't symmetric. | concede (ratchet may be party-specific) | damaging    | arguably already observed  | Admit asymmetry: one party's base may be more ratchet-prone. |
  | 7    | Auditability is impossible to measure objectively.                       | If "would you hold this view without tribal stakes?" is unanswerable, the core metric is vacuous. | dismiss (use adversarial audits) | cosmetic    | possible in principle only | Define auditability via prediction markets or cross-examination. |
  | 8    | Your mechanisms cannot explain elite-driven polarization.                | If politicians/mediators actively inflame conflict, bottom-up dynamics are secondary. | dismiss (elites exploit these mechanisms) | cosmetic    | arguably already observed  | Add elite incentives as amplifier, not alternative. |

  **2. JSON Summary**
  ```json
  {
    "most_dangerous": "The out-party's visible 'tail' holds disproportionate policy-making power.",
    "predictions_no_rival_makes": [
      "Interventions boosting out-group paraphrase ability reduce perceived bad faith better than fact-checking or exposure.",
      "Perceived bad faith correlates more strongly with paraphrase deficits than policy disagreement.",
      "Exposure to out-group content increases antipathy when delivered in monitoring mode."
    ],
    "insulation_verdict": "partial",
    "insulation_cost": "Not fatal. Self-confirming phenomena require loop-aware frameworks. The ratchet's self-fulfilling nature is central, not a bug—but must allow exogenous shocks to break it.",
    "cheapest_surviving_version": "Perceived bad faith is often manufactured via asymmetric sampling, defensive consumption, and reciprocal distrust—even where genuine conflicts exist.",
    "single_observation_that_would_move_me": "A study showing paraphrase training lowers perceived bad faith more than exposure or fact-checking across diverse cohorts."
  }
  ```

  ### Critical Context
  - **Insulation**: The reciprocity ratchet *does* risk unfalsifiability by absorbing observed bad faith as self-caused. This is partially defensible for feedback-loop phenomena but requires admitting *exogenous* bad faith (e.g., sabotage) can exist. Your stipulation that sincerity is cheap helps, but the ratchet must allow for asymmetric starting conditions.
  - **Power-Visibility**: Your doubt is well-placed. If the loudest voices also dominate candidate selection (e.g., via small-donor primaries), the "tail" *is* the operative coalition. This forces revision: sampling asymmetry still distorts *intent* attribution, but not necessarily *threat assessment*.
  - **Testability**: The paraphrase-intervention prediction is your strongest discriminant. If it fails, the thesis loses empirical traction. If it holds, it invalidates exposure-focused solutions (e.g., contact hypothesis).

  **Least-Cost Adjustment**: Confine the claim to *affective* polarization (distrust of motives) and exclude *instrumental* conflicts (policy threats), while acknowledging subsystems where extremes wield power. This retains the mechanisms' novelty without overreach.
