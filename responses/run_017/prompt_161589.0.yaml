  (c) **Confidence intervals**: They might think the interval is a confidence interval? We can clarify: in this context, the interval represents the range of probabilities that are compatible with the evidence. It's not a frequentist confidence interval, but a set of possible chances.

  ### What the Game Cannot Deliver
  - We are manufacturing the intervals from sparse evidence. The students might think the imprecision is due to lack of data, and if we had more data we would get a sharp probability. But in some interpretations of imprecise probability, the world might be indeterminate (e.g., in quantum mechanics) or there might be fundamental ignorance. We can note in the debrief: the imprecision here is epistemic (due to lack of knowledge), but the behavioral response is the same regardless of the source. In decision theory, we care about the representation of belief and how it affects decisions.

  - The activity doesn't cover updating of imprecise probabilities (except in Part 3, but we only show the effect of conditioning). We don't show how to update a set of probabilities when new evidence comes in (via likelihoods). That has to be taught.

  - The activity doesn't cover the many decision rules for imprecise probabilities (maximin, E-admissibility, maximality, etc.). We only used a cautious rule (maximin) in Part 2.

  ## Adjustments for Time and Clarity

  - We might need to adjust the number of prices in Part 1 to save time. Maybe 7 prices: 30,40,45,50,55,60,70.
  - In Part 2, we might only run Group U? Because Group K is not the focus? But we can run both to show the contrast. We can do it quickly by having them raise hands.
  - Part 3 is quick.

  ## Last Note: The Source of Intervals

  We are using intervals from sparse evidence. We can say: "In this activity, the imprecision comes from limited information. But the same formal model can be used for other sources of indeterminacy. The key point is that the decision maker represents their belief as a set of probabilities and behaves accordingly."

