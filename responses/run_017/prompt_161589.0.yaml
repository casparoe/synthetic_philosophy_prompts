answer: |-
  Based on your goals and constraints, here's a runnable activity designed to make students *feel* the key differences between sharp and imprecise credences. The activity uses points (with a chocolate bar for the top scorer), runs in 90 minutes, and focuses on behavioral differences without requiring real money. I'll address your concerns (Ellsberg confusion, midpoint objections, confidence intervals) and clarify what the activity can/cannot deliver.

  ---

  ### **Materials & Setup**
  - **Urns**: Virtual urns described on info cards:
    - **Group K (Sharp) Card**: *"A fair coin decided this urn: Heads = 4 red/6 blue balls; Tails = 6 red/4 blue balls. The chance of red is exactly 50%."*
    - **Group U (Imprecise) Card**: *"This urn has 4, 5, or 6 red balls (rest blue, total 10 balls). No further information is given."*
  - **Betting Tokens**: Paper slips for private responses (to avoid contagion).
  - **Points System**: Start all students at 100 points. Bets adjust points hypothetically (no real draws). Top scorer wins chocolate.
  - **Physical Props (Optional)**: Two boxes labeled "Box A" and "Box B" for Part 3.

  ---

  ### **Timeline (90 Minutes Total)**
  1. **Introduction (5 min)**: Explain rules, points, and groups (7 students per group).
  2. **Part 1: The Pass Band (25 min)**  
     - **Activity**: Price walk for a ticket paying 100 points if red is drawn.
     - **Prices**: 30, 35, 40, 45, 50, 55, 60, 65, 70 (9 prices, 2 min per price).
     - **Procedure**:
       - At each price, students privately write **Buy**/Sell/Pass on slips.
       - Slips collected instantly; tally **#Buy/#Sell/#Pass** per group on the board.
     - **Goal**: Show Group K flips at ~50; Group U has a 20-point "pass band" (40–60).
  3. **Part 2: Free Money & Menu Dependence (15 min)**  
     - **Bets**:
       - Bet X: Lose 10 if red, gain 14 if blue.
       - Bet Y: Gain 14 if red, lose 10 if blue.
       - Together: Gain +4 points regardless.
     - **Groups**:
       - **Subgroup U-A & K-A**: Offered bets *sequentially* (first X alone, then Y alone, then both).
       - **Subgroup U-B & K-B**: Offered *simultaneous menu* (choose any subset: neither, X, Y, or both).
     - **Procedure**: Students submit choices privately. Record accept/reject decisions.
     - **Goal**: U-A rejects X and Y alone; U-B accepts both. K-A/K-B accept everything.
  4. **Part 3: Conditioning Worsens Imprecision (15 min)**  
     - **Setup**: Describe 100 balls (50 red/50 blue) split into two 50-ball boxes, with neither >60% red.
     - **Offer**: Free peek at which box the ball came from.
     - **Procedure**: Students privately choose **Want Peek**/Refuse Peek. Tally choices.
     - **Goal**: Some refuse the peek to avoid switching from sharp 0.5 to [0.4, 0.6].
  5. **Debrief (30 min)**: Map outcomes to philosophical points (detailed below).

  ---

  ### **Key Mechanics & Solutions to Concerns**
  #### **1. Price Walk Logistics**
  - **Private Slips**: Use numbered slips (e.g., Student 1–14) for anonymity + tracking. Collect in fixed order to speed tallying.
  - **Tally Display**: 
    | Price | Group K: Buy | Sell | Pass | Group U: Buy | Sell | Pass |
    |-------|--------------|------|------|--------------|------|------|
    | ...   | ...          | ...  | ...  | ...          | ...  | ...  |
  - **Expected Data**:
    - **Group K**: Sharp flip at 50 (e.g., 100% Buy at 45 → 100% Sell at 55).
    - **Group U**: Pass band at 40–60 (e.g., 0–20% trade between 45–55).

  #### **2. Predicted Problems & Solutions**
  - **Problem (a): Ambiguity Aversion vs. Genuine Imprecision**  
    - **Solution: 5-Minute Control Round**  
      Before Part 1, run a **known-risk urn** (5 red/5 blue) for all students.  
      - Ask: "Would you buy/sell a ticket for 100 points at price 45?"  
      - **Goal**: If >80% trade, they’re risk-neutral. If not, note risk aversion and subtract its effect from Group U’s pass band in debrief ("Group U’s band is wider due to added ambiguity").
  - **Problem (b): "Just Use the Midpoint!"**  
    - **Short Reply**: "If you use 0.5, would you accept Bet X in Part 2? (EV = +2). But what if your set was [0.1, 0.9]? The midpoint is 0.5, but Bet X (EV = -4 to +8) could lose big. The cautious rule avoids worst-case losses."
  - **Problem (c): Confidence Intervals**  
    - **Reply**: "Confidence intervals are frequentist (about long-run frequency). This is about your belief *now* given limited evidence. A 95% CI for this urn might be [2,8] red balls—but that doesn’t mean you’re 95% confident!"

  #### **3. Sparse Evidence Caveat**
  - **Not Fatal, but Address in Debrief**: Say: "Here, imprecision comes from sparse evidence. But indeterminacy could be fundamental (e.g., quantum events). The key is how belief *representation* affects decisions—whether the source is ignorance or indeterminacy."

  ---

  ### **Debrief (30 Min)**
  Map outcomes to your three goals, using board data:

  1. **Pass Band → Behavioral Difference (10 min)**  
     - **Point**: Both groups "feel" 50% confident, but Group U refuses bets between 40–60.  
     - **Contrast with Dutch Book**:  
       - Sharp credences: Incoherence → sure loss.  
       - Imprecise credences: Caution → forgone gains (e.g., missed +EV bets in the band).  
     - **Resistance Cost**: If Group U trades in the band, they risk losses at extremal probabilities (e.g., buying at 55 when P(red)=0.4 loses 15 points).

  2. **Declined Pair → Menu Dependence (10 min)**  
     - **Point**: U-A rejects X/Y alone; U-B accepts both. Same bets, different menus → different choices.  
     - **Contrast**:  
       - Sharp agents (Group K) always accept (EV>0).  
       - Imprecise agents: Cautious rule declines good bets alone, missing "free money" (sure +4).  
     - **Resistance Cost**: Accepting X/Y alone risks loss (e.g., -10 if P(red)=0.6 for Bet X).  
     - **Normative Q**: "Which is rational? Avoiding sure loss (decline singles) or seizing sure gain (accept pair)?"

  3. **Free Peek → Conditioning Worsens Imprecision (10 min)**  
     - **Point**: Unconditionally sharp 0.5 → free info → [0.4, 0.6].  
     - **Phenomenon**: "Dilation" (standard term—mention this!).  
     - **Resistance Cost**: Refusing free info may miss useful knowledge (e.g., if bets depend on box identity).  
     - **Why It Matters**: Precision isn’t always desirable; it can be fragile under updating.

  ---

  ### **What the Activity Cannot Deliver**
  - **Updating Imprecise Credences**: The activity shows dilation but not *how* to update sets (e.g., via generalized Bayesianism). Cover this in lecture.
  - **Decision Rules Beyond Maximin**: Students experience caution (accept only if EV>0 for all probabilities), but not other rules (E-admissibility, maximality). Debrief: "Other rules avoid free-money loss but require more complexity."
  - **Non-Epistemic Indeterminacy**: Sparse evidence drives intervals; you must clarify that imprecise probabilism also applies to objective indeterminacy.

  ---

  ### **Predicted Outcomes & Adjustments**
  - **Group U Behavior**: 
    - Part 1: ~80% pass between 40–60. 
    - Part 2: U-A rejects singles; U-B accepts pair. 
    - Part 3: ~40% refuse the peek.
  - **Adjustments**:
    - If Part 1 runs long, skip prices 35/65. 
    - If students resist pass bands, emphasize: "Would you bet against your worst-case probability?"
    - Bring a chocolate bar—motivates engagement!

  This design makes imprecision visceral: students *act out* caution, menu dependence, and dilation. The control round and slips mitigate Ellsberg confusion, and debriefing sharp/imprecise failure modes (sure loss vs. forgone gain) solidifies the contrast.
