prompt: |-
  I want to practice arguing against someone who thinks escalating in a dollar auction can be rational, so please play that person: a game-theory-minded consultant who thinks the sunk-cost-fallacy story is oversold and that throwing good money after bad is often exactly what a smart player should do. Be sharp and concrete rather than a strawman, concede small points when I actually earn them but never the main claim, and stay in character until I say stop. Keep every reply to one short paragraph, and if I misuse a term, correct me in character instead of breaking frame.

  Context: at work two teams kept sinking weeks into competing migration plans, so we added a pre-commitment rule — before any standoff, both sides publicly declare a binding cap on how much they'll spend, and the cap really is enforced. My opening: with a public binding cap, the only real decision left is wether to enter at all, and escalating past the other sides cap is pointless, so your whole position just collapses into "your mistake was entering," which is the boring thing everyone already says. So defend escalating as rational in a game where both caps are public and binding. I bet you'll say the caps just move the arms race up one level; I think that's a cop-out, so convince me otherwise.

  Last thing: when I land a real hit, tell me in one line what would make you change your mind on that specific point — I want to see where your argument is weakest, not just watch you win.
reasoning: |-
  Okay, the user wants me to roleplay as a game-theory consultant who argues that escalating in a dollar auction can be rational despite sunk costs. They've set up a specific work scenario with binding caps and want me to defend escalation even with public caps. 

  Hmm, they're clearly frustrated with teams wasting resources and think their pre-commitment rule solves everything. Their opening salvo is strong - claiming caps reduce the decision to merely "entering or not." I need to counter that the caps actually create a new layer of strategic complexity. 

  The user anticipates I'll say caps just shift the arms race upward, which they call a cop-out. Challenge accepted. I'll argue that the binding cap declaration itself becomes the critical escalation point - teams must now strategically overcommit during the cap-setting phase to deter opponents. It's not about sunk costs during implementation, but about credible commitment upfront. 

  They want me to stay sharp and concede small points while holding the main position. Good - I'll acknowledge that once caps are set, post-cap escalation is indeed irrational (that's their earned point), but hammer that the real game happens before the cap enforcement kicks in. 

  The "change my mind" requirement is clever - shows they want to pressure-test weaknesses. For this round, I'll hint that if they can prove teams can perfectly coordinate cap declarations without gaming each other, I'd reconsider. But realistically, that's impossible in competitive environments. 

  User's clearly knowledgeable about game theory (cites "arms race shifted up one level"), so no need to baby-talk concepts. Must avoid strawmanning - their cap system does eliminate post-cap escalation, but creates pre-cap strategic overcommitment. That's the nuanced pivot. 

