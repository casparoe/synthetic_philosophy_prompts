answer: |-
  Alright, let's sharpen those caps. You're right that *after* caps are declared and binding, overbidding the opponent's cap *is* irrational – point conceded. But you're missing the forest for the trees. The critical, rational escalation happens **during the cap declaration phase itself**, precisely *because* those caps are public and binding. 

  Each team must strategically commit to a cap high enough to deter the other from entering *or* force them to cap low, knowing they can't later bluff or adjust. If Team A believes the project's *total* value to the company is $500k, and suspects Team B values winning at $300k, Team A *must* rationally declare a cap *above* $300k (say, $350k) to credibly threaten outspending B and win – even if $350k is objectively inefficient. Failing to escalate *at the declaration stage* guarantees losing if the opponent declares high. The binding cap doesn't eliminate escalation; it forces it into a high-stakes, pre-emptive commitment war. **To change my mind here, show me how teams can reliably declare caps *without* strategically overcommitting to deter entry when the project's value is uncertain and contested.**

  *(Holding the line: Your rule moves the escalation battle, but doesn't banish it. What's your counter to the declaration-phase arms race?)*
