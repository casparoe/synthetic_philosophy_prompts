prompt: |-
  I'm coauthoring a paper on epistemic arguments for democracy with my advisor, and I keep tripping over the same question: when exactly does he think the Condorcet jury theorem licenses deferring to a majority? I want to predict his reaction before I bring it up, so here's his track record on cases we've actually talked through. All of them are groups making a yes/no call, everyone votes at the same time unless I say otherwise, and in every case the question is whether the group should just do what the majority says.

  1. 11 voters, independent, each about 0.60 reliable: yes, defer, and he'll add that the majority is more reliable than any single member.
  2. 11 voters, 0.60 each, but they all got their information from the same misleading news source, so their votes move together: no. He says the group is effectively one voter and the theorem has nothing to say.
  3. 1,001 voters, independent, each 0.501: yes, and he's happy to say majority reliability is near-certain even though no individual is better than a coin flip by any amount you'd notice.
  4. 21 voters, independent, competences all somewhere between 0.70 and 0.80: yes, majority comfortably beats the best member.
  5. 3 voters, 0.60 each, but they vote one at a time seeing the earlier votes and end up following the first voter: no. He says sequential voting is worse than simultaneous here and independence is gone.
  6. 51 voters, 0.60 each, except that the 20 who feel least confident abstain, and being unsure is exactly what makes them abstain: yes, more emphatically than in case 1. He says voluntary abstention by the unsure helps rather than hurts.
  7. 11 voters, three options instead of two, each voter 0.60 likely to pick the best one with errors split evenly between the other two, independent: yes, defer to plurality. He says the binary version is just the clean case, not the limit of the idea.

  The new case I want to bring him: a 7-person committee taking an up-or-down vote, voting simultaneously, votes independent. One member has read the full file and is about 0.90 reliable. The other six skimmed the one-page summary and are each about 0.55. If I've done the arithmetic right, the majority comes out around 0.71 — better than the 0.61 you'd get from seven people all at 0.55, but well short of 0.90 for just asking the one person who did the reading. So what does he say, and more importantly what's he actually running?

  What I want from you: lay out the two or three rules that fit cases 1 through 7 about equally well — I can see something like "independence plus everyone above chance," and something like "independence plus roughly homogeneous competence," and something comparative where the majority only wins if it beats the best alternative rule available (the expert, or a weighted vote where each person's weight scales with the log of their odds). Say what each predicts about my 7-person committee, give me your best guess at his verdict with the reason for preferring it, tell me which of his earlier verdicts is doing the most work in your prediction, and name the single variant case that would separate the rules cleanly — I was thinking of re-running the same committee with the expert at 0.60 instead of 0.90, or holding her at 0.90 and growing the number of 0.55 voters. Do the arithmetic if it helps, and please answer in American English.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is working on epistemic arguments for democracy and needs to predict their advisor's stance on a specific voting scenario involving a 7-person committee. I'll start by understanding the advisor's past responses to different cases.

  First, reviewing the seven cases provided. In case 1, with 11 independent voters each at 0.60 reliability, the advisor says yes to deferring to majority. Case 2, same setup but votes correlated due to a shared misleading source, gets a no. Case 3 has 1,001 voters at 0.501 reliability, and the advisor agrees to defer. Case 4 with varying competences between 0.70-0.80 still gets a yes. Case 5 involves sequential voting breaking independence, leading to a no. Case 6 allows abstention by less confident voters, strengthening the yes. Case 7 extends to three options, supporting plurality despite non-binary choice.

  The new scenario is a 7-person committee: one expert at 0.90 and six others at 0.55 each. The majority reliability here is about 0.71, which is better than the average member but worse than the expert. The key question is whether the advisor would recommend deferring to the majority or just following the expert.

  I need to identify consistent rules from past cases. The advisor seems to emphasize two main factors: independence of votes and competence above chance. The first rule could be "Independence + Mean Competence Above Chance." This fits cases 1, 3, 4, 6, and 7 where mean competence is above 0.5. Case 2 fails due to dependence, case 5 due to lack of independence. Applying this to the new case: mean competence is (0.90 + 6*0.55)/7 ≈ 0.607, above 0.5. Votes are independent. So rule predicts YES.

  The second possible rule is "Independence + Homogeneous-ish Competence." This would explain why case 4 (varying 0.70-0.80) is acceptable but the new case with a mix of 0.90 and 0.55 might not be. The heterogeneity here is extreme. Rule predicts NO.

  The third rule is "Comparative Epistemic Optimality," where the group defers to majority only if it's more reliable than the best alternative. In the new case, the expert at 0.90 beats majority at 0.71, so predicts NO.

  Looking at past cases, case 3 is crucial - here majority beats any individual despite each being barely above chance. The advisor accepted this, which supports rule 1 over rule 3. Case 6 with abstention shows the advisor values collective improvement even when individuals are weak. Case 4's variance didn't bother the advisor. This suggests rule 1 is more consistent.

  For the new committee, my prediction is the advisor says YES to deferring to majority. Key reason: independence maintained, mean competence (0.607) clearly above chance. Case 3 is the strongest precedent - accepting barely competent large groups.

  To test these rules, I need a variant case. Suppose the expert is only 0.60 reliable instead of 0.90, with the same six at 0.55. Now majority reliability is about 0.71 (same as before) while the expert is worse at 0.60. All rules would say YES here, so no distinction.

  Better test: keep expert at 0.90 but increase the number of 0.55 voters. At 15 such voters, majority reliability drops to about 0.58 while expert remains 0.90. Rule 1 (mean competence now (0.90 + 15*0.55)/16 ≈ 0.572 > 0.5) still says YES. But rule 3 says NO because 0.58 < 0.90. If advisor says NO here, it supports rule 3; if YES, supports rule 1.
answer: |-
  Based on your advisor's track record, I identify three plausible decision rules he might be using. Each fits the existing cases reasonably well but gives different answers for your 7-person committee. I'll lay out the rules, their predictions for your case, my best guess at his verdict with reasoning, the key precedent driving that guess, and a clean test case. All calculations use binomial probabilities for majority reliability (with ties broken randomly).

  ### Rule 1: Independence + Mean Competence Above Chance
  - **Core idea**: Defer to majority if votes are independent and average competence is strictly >0.50. No homogeneity requirement.
  - **Fits cases**: 1 (mean=0.60), 3 (mean=0.501), 4 (mean≈0.75), 6 (mean>0.60 after abstention), 7 (mean=0.60). Excludes 2 (dependence) and 5 (dependence).
  - **Prediction for your committee**:  
    Mean competence = (0.90 + 6×0.55)/7 ≈ 0.607 > 0.50. Votes independent.  
    → **YES**, defer to majority.

  ### Rule 2: Independence + Homogeneous-ish Competence
  - **Core idea**: Defer only if votes are independent *and* competences are "close enough" that no subgroup dominates. Roughly, max competence ≤ 2× min competence or similar.
  - **Fits cases**: 1 (all 0.60), 3 (all 0.501), 4 (0.70–0.80 range is tight), 6 (implied homogeneity after abstention). Excludes 2/5 (dependence) and possibly 7 (if he assumes homogeneity for simplicity).
  - **Prediction for your committee**:  
    Competences range from 0.55 to 0.90 → ratio = 0.90/0.55 ≈ 1.64 (if "close enough" threshold is e.g., ≤1.5).  
    → **NO**, don't defer (expert too dominant).

  ### Rule 3: Comparative Epistemic Optimality
  - **Core idea**: Defer to majority *only if* it's more reliable than the best alternative decision rule (e.g., following the best expert, weighted voting).
  - **Fits cases**: 1 (majority > best member), 3 (majority ≈1 > 0.501), 4 (majority > best), 6 (abstention improves majority reliability), 7 (plurality best available). Excludes 2 (majority = worst member) and 5 (majority worse than first voter).
  - **Prediction for your committee**:  
    Reliability of expert = 0.90  
    Reliability of majority ≈ 0.71 (calculated via binomial: P≥4 out of 6 weak voters correct, weighted by expert's vote)  
    Since 0.71 < 0.90 → **NO**, better to just follow the expert.

  ---

  ### My Best Guess for His Verdict & Why
  - **Prediction**: He says **YES, defer to the majority** in your 7-person case.  
  - **Primary Reason**: Rule 1 (Independence + Mean Competence >0.50) aligns best with his most definitive precedents, especially Case 3. He consistently prioritizes collective performance over individual excellence when votes are independent and "better than chance" on average.  
  - **Key Precedent Doing the Work**: **Case 3** (1,001 voters at 0.501). Here, he accepted near-certain majority reliability (≈0.73) despite *no individual* being meaningfully better than a coin flip—and despite the best alternative (picking a random voter) having reliability 0.501. Your committee has higher mean competence (0.607 > 0.501) and independence, so he'll likely see this as an easier "yes."  
  - **Secondary Support**: Case 6 (abstention helps) shows he values *aggregate* gains from marginal competences. Case 7 (non-binary) confirms he extends the logic beyond idealized homogeneity.

  ---

  ### Clean Test Case to Separate the Rules
  - **Proposed Variant**: Same 7-person committee, but **increase the weak voters to 15** (expert still 0.90, others 0.55, independent votes).  
  - **Why It Separates**:  
    - Mean competence = (0.90 + 15×0.55)/16 ≈ 0.572 > 0.50 → Rule 1 still says **YES**.  
    - Competence ratio = 0.90/0.55 ≈ 1.64 (unchanged) → Rule 2 still likely **NO**.  
    - Majority reliability ≈ 0.58 (expert + P≥8 of 15 correct) < 0.90 → Rule 3 says **NO**.  
  - **Predicted Advisor Response**: If he says **NO** here (citing the expert's superiority), Rule 3 wins. If he says **YES** (emphasizing mean competence >0.50 and independence), Rule 1 wins. Rule 2 is weaker (it struggles with Case 3's bare-minimum homogeneity).

  ### Your Other Variant Considered
  Changing the expert to 0.60 (others 0.55): Majority reliability ≈0.71 > expert's 0.60 → *All rules predict YES*. Not decisive. Stick with scaling up the group size.

  ### Final Thought
  Your advisor seems to treat the Jury Theorem as a *baseline justification* for majority rule when independence and minimal competence hold—not an optimization tool. If he balks at your 7-person case, it'll likely be on practical grounds ("just let the expert decide!") not formal ones. But based on his history, **Rule 1** is the safest bet. Bring coffee when you ask—this feels like a "teach the philosophy, not the math" moment.
