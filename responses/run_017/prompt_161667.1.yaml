prompt: |-
  I write about science and ideas for a national magazine, and several times a week my desk hits what is recognisably the same decision in a different costume: whether to publish an identifying detail about a named or nameable individual. Last month it was a photograph of a graduate student taken outside the lab where a misconduct investigation was underway; this week it is whether to name the author of an intemperate email that surfaced in a public-records release about a university's handling of a biosafety incident, and whether to include the street, though not the house number, of a patient whose rare-disease case is the spine of a feature. Our working rule has always been roughly that if the material is already public and relevant to the story, we run it. That rule has started to feel as though it answers a different question from the one we are actually facing — a friend who works in data protection got quite exercised about this over dinner and I could not say why she was right or wrong — and my standards editor has asked me to bring her something she can actually run in twenty minutes, with a reporter who has no philosophy training, a lawyer whose entire vocabulary is defamation, and her own sign-off required before the story closes.

  What I want from you is a decision procedure, not an essay on privacy. Please build it as an ordered set of questions, each with a statement of what would count as a sufficient answer, each with an explicit point at which the procedure stops with a no, and each with an explicit point at which it stops and hands the decision to my editor because the unresolved question is one of values rather than of fact. It should be grounded in whatever is genuinely defensible about what privacy is and why it matters, and I would like it to have a step — or a stated refusal to have a step — for each of the difficulties I keep tripping over. First, whether privacy is a quantity, a matter of how many people know something, or a matter of who comes to know it and in what capacity, given that the same fact seems to change its character depending on whether the second audience is a clinician, an employer, a neighbour, or a searchable archive. Second, the aggregation problem: each item on its own discloses little, but the set assembled discloses something the subject never put forward, and our item may be the missing link rather than the revealer. Third, the already-public defence, including its awkward variant in which something was legitimately public in one setting years ago and is now being re-presented to a far larger audience with different purposes and a longer memory. Fourth, the complaints that are not about harm at all, where nothing bad is likely to happen to the person and the objection is still that something of theirs has been taken; the procedure needs to say what to do with those if privacy has a value that is not just a stand-in for downstream injury. Fifth, whether the thing that can have this interest is only a living individual, or whether a group, a company, or a dead person can have it too.

  Then run the procedure on three of our cases: naming the author of the leaked email; publishing the photograph of the graduate student, who was never charged with anything and whom the piece mentions in a single clause; and printing the street name in the rare-disease feature, where the patient consented to being written about but the consent form did not contemplate an address. Tell me what the procedure says and where it stops. I suspect it will rule against me on at least one of these in a way that will make me look squeamish to an editor who wants the colour — do not soften that one, and give me the sentence I would have to say to defend it. Finally, be straight about the procedure's failure modes: the kinds of case it will systematically get wrong, the situations in which a twenty-minute version is a sham, and what no such checklist can do for us at all.
reasoning: |-
  Okay, the user is a science writer at a national magazine facing recurring privacy dilemmas. They need a practical decision procedure—not theoretical musings—to handle cases like publishing identifiable details about individuals. Their current "if public and relevant" rule feels inadequate, especially after a data protection expert challenged it. 

  Hmm, their pain points are multidimensional: they're juggling editorial pressure (20-min sign-offs with non-philosophy-trained reporters), legal tunnel vision (defamation-only lawyers), and genuine ethical uncertainties. The core tension is between newsworthiness and privacy-as-inherent-value, not just harm prevention. 

  Breaking down their explicit stumbling blocks:
  First, privacy isn't just about how many know something, but the context shift—e.g., a fact known to clinicians vs. the internet. Second, aggregation risks turning breadcrumbs into a full identity. Third, the "already-public" loophole ignores how digital permanence and audience scale change everything. Fourth, they need to handle objections where no tangible harm exists but violation feels real. Fifth, extending privacy considerations beyond living individuals.

  *scribbles structure* The procedure must be: 
  - Linear questions with clear exit ramps to "no" or "escalate to editor" 
  - Anchored in defensible privacy principles (contextual integrity? inherent dignity?) 
  - Explicit about what it can't solve

  Testing against their cases: 
  For the email author—public record but context shift from bureaucratic disclosure to media spotlight. 
  For the grad student photo—publicly taken but aggregates with misconduct investigation they weren't charged in. 
  For the street name—consented feature but address fragment creates locatability risk despite consent scope gap.

  *winces* The grad student case will bite. Telling an editor "We can't use the photo because being visually associated with misconduct without charges violates contextual integrity even if legally safe" will sound squeamish but necessary. 

  Failure modes haunt me: 
  - When "values" questions get disguised as "facts" 
  - When time pressure forces skipping aggregation assessment 
  - When the procedure kills nuance (e.g., deceased subjects where family dignity matters but checklist stops at "living? no→publish")

  Final touch: phrasing the "no" for the photo case as "We're making them a visual symbol of scandal without justification" – that might resonate with even a color-hungry editor.
answer: |-
  Here is a decision procedure for identifiable-detail publication, designed for speed and defensibility. It prioritizes **contextual integrity** (privacy is violated when information flows to parties/in contexts the subject didn't reasonably expect) and **minimization of exposure**. It stops early on "No" or escalates values conflicts.

  ---

  ### The Identifiable Detail Publication Procedure (20-Minute Version)

  1.  **Is the detail *necessary* to achieve a core journalistic purpose of this specific piece?** (e.g., Accountability, explaining a complex process, providing essential human context).
      *   *Sufficient Answer:* Clear, specific justification directly linking the detail to the story's core purpose. Vague "adds color" fails.
      *   **STOP: NO** if not necessary. (e.g., "The grad student's face adds nothing essential to understanding the misconduct process itself").
      *   *Handoff:* If necessity is debatable *only* on subjective grounds of newsworthiness/emphasis.

  2.  **Is the individual a *direct, central participant* in the events core to the story?** (e.g., Key decision-maker, primary subject, major actor).
      *   *Sufficient Answer:* The individual played a significant, active role directly related to the story's central claim or event.
      *   **STOP: NO** if peripheral or incidental (e.g., "The grad student was merely present near the lab, not accused or central to the investigation narrative").
      *   *Handoff:* If centrality is ambiguous (e.g., Was the email author a minor player or the initiator?).

  3.  **Was the detail obtained *legitimately* and is it *verifiably accurate*?**
      *   *Sufficient Answer:* Legally obtained (e.g., public records, consent, non-coercive observation) and factually confirmed.
      *   **STOP: NO** if illegally obtained, unverifiable, or obtained under duress/coercion.
      *   *Handoff:* If legality/verification is complex or requires deeper legal review beyond defamation.

  4.  **Does publishing this detail *fundamentally alter the context* in which the information originally existed or became "public"?** (Addressing Context Shift & Already-Public Defense)
      *   *Sufficient Answer:* The audience, scale, permanence, and likely *use* of the information remain reasonably consistent with the original context (e.g., Naming a public official in a records release about their official actions is consistent).
      *   **STOP: NO** if it creates a radically new context (e.g., Taking a decades-old public record and making it globally searchable; taking a minor bureaucratic email and blasting it to millions; associating a face publicly with an unproven allegation).
      *   *Handoff:* If the degree of context shift is debatable as a matter of journalistic judgment vs. ethical principle.

  5.  **Does publishing this detail create a *significant, unjustifiable risk of harm* (beyond mere discomfort)?** (e.g., Physical safety, job loss, targeted harassment, severe reputational damage).
      *   *Sufficient Answer:* Risk is low, speculative, or the harm is proportionate to the public interest served (see Step 1). *OR* Risk exists but mitigation is effective and implemented (e.g., blurring, partial redaction).
      *   **STOP: NO** if risk is high, specific, and disproportionate to the public interest. (e.g., Publishing a street name for a rare disease patient drastically increases locatability risk with no proportional journalistic gain).
      *   *Handoff:* If risk assessment is highly uncertain or involves complex prediction.

  6.  **Does publishing this detail *aggregate with other available information* to reveal something highly sensitive the subject never intended to disclose?** (Aggregation Problem)
      *   *Sufficient Answer:* The detail alone is low sensitivity, and combining it with *readily accessible* information does not reveal a significant, unexpected private fact (e.g., Name + public job title is expected).
      *   **STOP: NO** if it is the "missing link" enabling harmful aggregation (e.g., Street name + rare disease + other public details enables precise identification/location; photo + lab location + investigation timing creates strong association with misconduct).
      *   *Handoff:* If the sensitivity of the aggregated information or the accessibility of the other pieces is unclear.

  7.  **Has the individual provided *informed consent* specifically covering this detail and its publication in this context?**
      *   *Sufficient Answer:* Explicit, specific consent obtained *after* explaining the detail and its publication context.
      *   **STOP: NO** if consent is absent, revoked, or clearly doesn't cover *this* detail in *this* context (e.g., General consent for a feature ≠ consent for publishing a street name).
      *   *Handoff:* If consent is ambiguous, implied, or given under questionable circumstances.

  8.  **Is the subject a *living individual*?** (Addressing Scope)
      *   *Sufficient Answer:* Yes.
      *   **STOP: PROCEED (Evaluate Harm/Risk Carefully)** if deceased (minimal intrinsic privacy, but consider family dignity/safety). **STOP: PROCEED (Evaluate Necessity/Harm)** if a group/company (privacy weaker, focus shifts to reputational harm, harassment, or operational security). *Intrinsic privacy value is strongest for living individuals.*
      *   *Handoff:* If the status of the subject (e.g., very recently deceased) creates novel values questions.

  **If you reach the end: PUBLISH (with any necessary mitigations).**

  ---

  ### Application to Cases

  1.  **Naming Author of Leaked Email:**
      *   Step 1: Likely YES (Accountability for public employee conduct).
      *   Step 2: Likely YES (Author is central to the email's content/impact).
      *   Step 3: Likely YES (Public records release, verifiable).
      *   Step 4: **HANDOFF/DEBATABLE.** Context shift: Internal email released bureaucratically vs. named in national media spotlight. Degree of shift is a values/judgment call. (*Procedure says: Escalate to Editor*).
      *   Step 5: Assess Harm (Reputational? Harassment?) - Depends on content/role. Step 6: Low aggregation risk (name + job likely already public). Step 7: NO Consent. Step 8: YES (living individual).
      *   **Conclusion:** Likely PUBLISH *if* Step 4 deemed acceptable by editor (context shift justified by accountability), but harm assessment (Step 5) crucial. If email is minor/employee peripheral, Step 2 might fail.

  2.  **Publishing Photo of Graduate Student (Outside Lab under Investigation):**
      *   Step 1: **NO.** What core purpose? Student not charged, mentioned in a clause. Photo adds visual "color" but isn't necessary to explain the investigation process or outcome. It primarily associates a face with an allegation.
      *   **STOP: NO.** (The procedure stops early).
      *   **The Sentence for Your Editor:** "We cannot publish the photo because it associates this individual visually with a misconduct investigation they were never charged in, which is unnecessary for the story and creates an unjustifiable risk of reputational harm by fundamentally altering the context of their public presence."

  3.  **Printing Street Name (No Number) for Rare-Disease Patient:**
      *   Step 1: **NO.** What core purpose? The *medical case* is the spine, not the patient's *location*. The street name adds no essential medical or human context to the disease narrative. It only satisfies geographical curiosity.
      *   **STOP: NO.** (The procedure stops early).
      *   Step 6 reinforces this: Even without the number, the street name + rare disease + potentially other details in the feature or public records (age, family info, photos?) can *aggregate* to significantly increase locatability risk in a way the patient never consented to (Step 7: Consent didn't cover address). Step 5 (Harm Risk) is high (privacy intrusion, potential unwanted contact).

  ---

  ### Failure Modes & Limitations

  1.  **Speed vs. Depth:** The 20-min version is a **sham** for complex aggregation analysis (Step 6) or nuanced harm prediction (Step 5). It relies on quick, sometimes superficial, judgments. Deep dives are needed for high-stakes cases.
  2.  **Values Disguised as Facts:** Steps 4 (Context Shift) and 1 (Necessity) often involve core *values* (what constitutes a "fundamental" shift? what's "core" purpose?). The procedure tries to isolate these for handoff, but pressure might lead to passing them off as resolved facts.
  3.  **Systematic Blind Spots:**
      *   **Power Imbalances:** It may underestimate harm to vulnerable individuals vs. powerful ones.
      *   **Chilling Effects:** It doesn't explicitly weigh the *collective* chilling effect of publishing patterns on future sources/subjects.
      *   **"No Harm" Violations:** It addresses intrinsic privacy via Steps 4 & 6 (context/aggregation), but a pure "it feels like a violation even if safe" complaint might only be caught if it triggers a "No" on necessity (Step 1) or context shift (Step 4) – which relies on the user recognizing it. Step 7 (Consent) is the main bulwark here.
      *   **Future-proofing:** Struggles with potential future uses of data (e.g., archives, AI training).
  4.  **What No Checklist Can Do:**
      *   **Replace Judgment:** It frames questions, not answers. Good faith application and editorial courage are irreplaceable.
      *   **Anticipate Unforeseen Consequences:** Human behavior and technology create unpredictable risks.
      *   **Resolve Fundamental Conflicts:** When core values (newsworthiness vs. privacy) truly clash, the procedure flags it for the editor (handoff), but the hard choice remains.
      *   **Ensure Consistency:** Human biases will still creep in; the procedure mitigates but doesn't eliminate this.
      *   **Fix Bad Journalism:** Publishing unnecessary, salacious detail will likely be caught (Step 1), but poorly framed stories that *make* a detail seem necessary when it's not might slip through.

  **Use this procedure as a forcing function to articulate *why* you're publishing, not just *if* you can. It shines a light on the hardest questions – context, necessity, aggregation – that the "already public" rule ignores, and forces the conversation about values up to your editor where it belongs.**
