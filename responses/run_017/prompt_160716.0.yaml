answer: |-
  ## HM Treasury  
  Office for Future Generations  
  Supplementary Impact Assessment Guidance Note SIA/GN/OFG/7.3  
  **Conditional Existence Exemption: Identity-Affecting Policy Pathways**  
  *Effective Date: 1 October 2024*

  **1. Purpose & Scope**  
  This guidance clarifies the application of HM Treasury's Green Book principles concerning long-term policy impacts where implementation pathways demonstrably affect *which specific individuals come into existence* in future generations, as opposed to impacting the welfare of individuals whose existence is counterfactually stable (i.e., would exist under all relevant policy alternatives). It introduces the Conditional Existence Exemption (CEE) for such identity-affecting scenarios within cost-benefit analysis (CBA) frameworks.

  **2. Key Definitions**  
  *   **Identity-Affecting Policy (IAP):** A policy or decision where the set of individuals existing at time T (>25 years post-implementation) differs significantly (>95% variance in projected population composition using standard demographic models) from the counterfactual set under any credible alternative policy.  
  *   **Counterfactual Person Discount Rate (CPDR):** A variable adjustment factor (range: 0.0 to 1.0) applied to the attribution of harms/benefits in CBA. It quantifies the diminishing relevance of welfare impacts to individuals whose probability of existence diminishes under alternative policy pathways. CPDR = 1 - (P_e), where P_e is the modelled probability of a specific individual existing under the *next most likely* policy alternative. CPDR = 1.0 indicates a counterfactually stable person; CPDR = 0.0 indicates an individual whose existence is wholly contingent on the policy choice.  
  *   **Conditional Existence Exemption (CEE):** The principle that, for individuals where CPDR ≤ 0.05 (de minimis threshold for significant identity overlap), and whose lives are assessed as being "worth living" (net lifetime welfare > 0, based on calibrated well-being indices), they **cannot be recorded as "persons affected"** on the primary CBA assessment form (HMT Form CB1a). Their welfare changes are deemed non-attributable for the purposes of net present value (NPV) calculation under Standard Assessment Protocol 7.  

  **3. Application of the CEE**  
  3.1. **Assessment Trigger:** The CEE applies only when a policy is formally classified as an IAP (see Definition 2.1) through the Office for Future Generations' (OFG) Identity Variance Screening Tool (IVST v2.1).  
  3.2. **"Persons Affected" Column:** For individuals falling under the CEE (CPDR ≤ 0.05 & net life worth living), the number entered in the "Persons Affected" column(s) on CB1a must be **zero (0)**. Their welfare changes, while calculable, are entered into the supplementary "Contingent Welfare Flux" annex (Form CB1a-S7) and do not contribute to the core NPV.  
  3.3. **Exemption Limitations:** The CEE **does not apply** to:  
      *   Individuals alive at the decision point (t=0), or born within the immediate demographic inertia period (typically ≤ 25 years, subject to OFG certification). These individuals possess CPDR = 1.0.  
      *   Scenarios where a policy renders a life *not* worth living (net lifetime welfare ≤ 0). Such individuals *are* entered as "persons affected" (negative welfare impact).  
  3.4. **Temporal Scope:** The applicability and impact of the CEE increase proportionally with the projection horizon. By Year 100+, standard projections indicate >99.8% of affected individuals will typically fall under the CEE for significant IAPs.

  **4. Technical Note: Counterfactual Person Discount Rate (CPDR) Calculation**  
  *   Utilise OFG-approved Agent-Based Demographic Projection Suite (ABDPS v4.3) with policy-specific parameters.  
  *   Run baseline (Policy A) and primary alternative (Policy B) simulations for target year T.  
  *   For the cohort existing in Policy A at time T, calculate P_e (probability of existing in Policy B simulation) using lineage-tracking modules.  
  *   CPDR = 1 - P_e.  
  *   **De Minimis Threshold:** CPDR ≤ 0.05 (i.e., P_e ≥ 0.95) signifies insufficient identity stability for "persons affected" attribution under CEE. Values are batch-assigned to cohorts via ABDPS.

  **5. Worked Example: Regional Development & Ecological Tipping Point (RDD-ETP Scenario)**  
  *   **Policy Choice:** Approve construction of the Wolds Deep Industrial Hub (WDIH), creating 4,200 jobs (Year 1-5).  
  *   **IAP Classification:** CONFIRMED (IVST v2.1 output: 98.7% projected population variance in North Wolds region by Year 70 due to significant migration differentials and altered fertility patterns under alternatives).  
  *   **Key Impact:** WDIH operations accelerate aquifer depletion. Modelling shows a near-certainty (>99%) of triggering an irreversible ecological tipping point by Year 65, rendering the North Wolds region largely uninhabitable and causing widespread agricultural failure *from Year 70 onwards*.  
  *   **CBA Application under CEE:**  
      *   *Beneficiaries (Year 1-25):* 4,200 direct jobs + ~8,500 indirect/service sector jobs (CPDR=1.0). Benefits recorded on CB1a.  
      *   *Current Residents (Alive at t=0):* Experience minor initial economic uplift, then manageable water restrictions (Years 30-65). Modest net negative welfare impact by Year 65 (CPDR=1.0). Recorded on CB1a.  
      *   *Future Contingent Population (Post-Year 65):* The individuals residing in the North Wolds *after* the tipping point (Years 70+).  
          *   *Existence:* Wholly contingent on the WDIH approval (migration patterns, specific descendants of workforce). CPDR = 0.02 (< 0.05 threshold).  
          *   *Welfare:* Lives projected to be "worth living" (net positive, albeit significantly lower quality than baseline alternative due to resource scarcity, displacement, health burdens).  
          *   *CEE Application:* Therefore, these **~220,000 projected individuals facing severe hardship, displacement, and premature mortality from Year 70 onwards are recorded as ZERO (0) "Persons Affected"** on the primary CB1a form. Their substantial negative welfare flux (estimated mean lifetime welfare reduction: 35%) is detailed solely in Annex CB1a-S7 ("Contingent Welfare Flux: Non-Attributable").  
  *   **Net Impact on CB1a:** The severe, widespread harms occurring from Year 70+ do not offset the earlier benefits within the core NPV calculation due to the CEE. Project NPV remains positive. Project recommended for approval.  

  **6. Compliance & Review**  
  All departments must utilise the IVST v2.1 and CPDR methodology via ABDPS v4.3 for relevant long-term assessments. The CEE framework is subject to quinquennial review by the OFG Ethics & Methodology Panel.  
  **Signed,**  
  *Sir Alistair Finch-Brackley*  
  Permanent Secretary, Office for Future Generations
