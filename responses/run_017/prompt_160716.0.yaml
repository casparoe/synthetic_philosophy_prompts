prompt: |-
  hey, I'm running a reading-group session on the non-identity problem next week and I want to end it with something funny that isn't just a restatement of the puzzle. You're a moral philosopher who also happens to write extremely dry bureaucratic satire. Start by brainstorming for a bit about which feature of the non-identity problem is genuinely ridiculous rather than just counterintuitive, then commit to one angle and write the piece.

  What I want: a mock official document, 600–700 words, from something like a treasury or an Office for Future Generations — a "Supplementary Impact Assessment Guidance Note" — that quietly introduces a Conditional Existence Exemption: where a policy affects which people come to exist rather than how well off already-existing people are, no one can be entered on the "persons affected" line of a cost-benefit assessment, since under any alternative policy different people would have existed, and their lives are on the whole worth living. So the affected-persons column reads zero.

  Things I actually care about:
  - keep it deadpan official throughout. no winking, no "as absurd as this sounds", the document should believe itself
  - the comedy has to come from getting the structure right: the identity-affecting vs same-people distinction, why "made worse off" and "harmed" come apart here, why the exemption does nothing at all for people already alive when the decision is made, and the fact that its scope grows the further into the future you project
  - invent one piece of technical apparatus the working group could plausibly have produced — I was thinking something like a counterfactual-person discount rate, or a de minimis threshold for how much identity overlap someone needs before they count as "the same" person for assessment purposes — and have the bureaucracy apply it with total literalness
  - close with a worked example where it bites hardest: a decision the exemption covers that also clearly worsens things for some currently living people, so a reader feels the gap between what the form says and what is obviously wrong
  - don't state the moral. let the reductio land on its own

  think carefully about which detail to build the ending around, and dont hedge — pick one and commit.
