  For the "tribunal" issue, I'm considering a "Joint Verdict" desideratum: composite status shouldn't wildly contradict scientific practice without justification. Some conflicts are tolerable (e.g., nihilism rejecting ordinary objects), but theories must explain why science appears successful despite its errors. 

  I suspect two desiderata might conflict: Non-Arbitrariness (demanding principled composition conditions) and Joint Verdict (respecting scientific classifications). Life-based restrictivism satisfies Joint Verdict for organisms but struggles with artifacts, while universalism respects physics but violates ordinary intuitions. The hardest exclusionary requirement is likely Non-Arbitrariness—it rules out vague, degree-theoretic, or brutally non-supervenient answers, eliminating most extant views. 

  For the close, I'll distill the most exclusionary requirement into five words. "Conditions must be principled" captures Non-Arbitrariness concisely, as it forces theories to avoid brute facts or vagueness. This requirement alone disqualifies popular approaches and pushes toward highly structured mereologies.
answer: |-
  Here are the compressed desiderata for an adequate answer to the Special Composition Question, distilled from core problems and your specified cases. Non-negotiable demands (NN) constrain all viable theories; others reflect deep but potentially contestable commitments.

  ---

  ### **Non-Negotiable Desiderata (NN)**
  1. **Distinction Enforcement (NN):**  
     *Must rigorously distinguish composition from:*  
     - **Constitution** (e.g., statue ≠ lump, despite spatial coincidence).  
     - **Coincidence** (e.g., temporary overlap like ship-of-Theseus stages).  
     - **Identity over time** (e.g., persistence conditions for composites vs. parts).  
     *Motivation:* Prevents collapse into monism or eliminativism about ordinary objects.

  2. **Causal Non-Flabbiness (NN):**  
     *Must explain apparent causal efficacy of composites without ubiquitous overdetermination.*  
     - If composites cause effects, it cannot be that *every* such case is redundantly caused by all parts/arrangements.  
     *Motivation:* Avoids causal exclusion arguments (e.g., "why believe in organisms if cells do all the work?").

  3. **Boundary Determinacy (NN):**  
     *Must resolve the Borrowed-Activity Problem:*  
     - *Case:* A synthetic organ permanently integrated into an organism sustains its life.  
     - *Horns:* If the organ is part of the composite, boundaries shift mysteriously. If not, unity depends extrinsically (vicarious unity). **Vicarious unity is worse**—it violates mereological internality, making composition extrinsic and context-dependent.  
     *Shows:* Unifying relations (e.g., life) **cannot be had by proxy**; the composer must directly possess the unifying property.

  4. **Non-Arbitrariness (NN):**  
     *Must resolve the Near-Miss Problem:*  
     - *Case:* Continuous series (e.g., fading life, weakening bonds) with no salient cut-off.  
     - *Requires:* A theory must **argue** for its stopping point (sharp/vague/degrees) and **justify** ordinary judgments (e.g., why a dying organism still composes something).  
     *Rules out:* Brute facts without explanation, unmotivated thresholds.

  ---

  ### **Negotiable Desiderata (Reflecting Theoretical Camps)**
  5. **Vagueness/Extrinsicality Stance:**  
     - Must explicitly state whether composition can be vague and/or extrinsic to the xs and their relations.  
     *Prejudices:* Nihilists/reductivists deny vagueness; non-nihilists may accept it. Universalists reject extrinsicality; others (e.g., functionalists) permit it.

  6. **Problem of the Many/Thinking Parts:**  
     - Must handle overlapping candidates (e.g., cloud boundaries) without ontological explosion.  
     - Must address whether "thinking objects" (brains, organisms) have lower-level thinkers as parts.  
     *Prejudices:* Nihilists avoid both; universalists accept explosion; restrictivists impose conditions to exclude micro-thinkers.

  7. **Tribunal of Composition ("Joint Verdict"):**  
     - Must specify whether composite-status is decided by:  
       (a) Fundamental metaphysics,  
       (b) Special sciences (e.g., biology for organisms), or  
       (c) A hybrid (e.g., metaphysics sets constraints, sciences apply them).  
     - Must either vindicate or explain away scientific posits (molecules, ecosystems, etc.).  
     *Prejudices:* Restrictivists favor (b/c); universalists/nihilists prioritize (a).

  ---

  ### **Key Tensions**
  - **Non-Arbitrariness vs. Joint Verdict:**  
    Life-based restrictivism satisfies Joint Verdict for organisms but struggles with artifacts (e.g., is a dead tree a composite?). Near-miss cases force uncomfortable vagueness or sharp cuts inconsistent with scientific gradation (e.g., ecosystem boundaries).  
  - **Boundary Determinacy vs. Extrinsicality:**  
    Vicarious unity (from Borrowed-Activity) implies extrinsicality, which violates internality assumptions of most restrictivists and universalists.

  ---

  ### **Theories in Brief**
  - **Universalism:** Always composition. *Meets:* Causal Non-Flabbiness? (overdetermination worry). *Fails:* Joint Verdict (accepts arbitrary fusions), Near-Miss (no thresholds).  
  - **Nihilism:** Never composition (only simples). *Meets:* Non-Arbitrariness. *Fails:* Joint Verdict (rejects science's composites), Borrowed-Activity (no composites to have boundaries).  
  - **Brutal Composition:** Composition has no general rule. *Meets:* Distinction Enforcement? *Fails:* Non-Arbitrariness (admits brute facts), Near-Miss (no justification for cuts).  
  - **Life-Based Restrictivism:** Composition iff life. *Meets:* Joint Verdict (for organisms). *Fails:* Borrowed-Activity (vicarious unity), Near-Miss (fading life).

  ---

  ### **Most Exclusionary Requirement**  
  **Non-Arbitrariness** eliminates brutal composition, vague theories, and unmotivated restrictivisms by demanding principled, justifiable conditions. It forces answers to confront continuous series head-on, exposing ad hoc or brute-factor solutions.

  \answer{Composition conditions require justification}
