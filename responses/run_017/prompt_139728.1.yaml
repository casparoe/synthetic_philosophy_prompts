  The user wants the number first, then a decomposition with sub-questions, combination method, sensitivity analysis, and where the disagreement between their credence (0.55) and their colleague's (0.2) likely lives.

  Looking at the ECMV setup:
  - Extrapolated value functions (V_i) for each person after idealization
  - Weighted sum scoring for actions
  - Minority veto: 5% coalition with action in their bottom decile can block
  - Veto per decision, not bundled
