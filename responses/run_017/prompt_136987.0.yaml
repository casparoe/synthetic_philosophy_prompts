answer: |-
  The salt wind clawed at the shutters of the harbour office. Upstairs, Neve traced a finger down the column of numbers in the ledger, the ink slightly faded from the sea-damp air. Forty years. The request sat before her, thick with engineering reports and hydrological projections, all pleading the same case: hold off reinforcing the East Barrier now. Push the cost, the disruption, the hard choices, forty years down the line.

  Neve was the junior in the Office of Deferred Costs. Two rooms, three people, and the weight of the town’s future pressing down on every decision they reviewed before it went to the Council. Their job wasn’t to say yes or no, but to untangle the *why* of the deferral. To show the Council what kind of delay they were really buying.

  Old Man Barrett, her boss, was out inspecting the current West Barrier repairs. So the East Barrier file landed on Neve’s desk. She opened it. The core argument was familiar: spend the money *now* on the new tidal energy array proposed for the outer harbour. That array, its proponents swore, would generate enough revenue and resilience within twenty years to easily cover the barrier reinforcement *and* more, leaving the town richer and safer sooner.

  **Reason One: The Trade-Off.** Neve understood this. It wasn't really about the distant future; it was about what else that steel, that labour, that coin could do *today*. Money poured into concrete and pilings now meant no dredging for larger cargo ships next year, no subsidies for the struggling kelp farms, no extra hands for the creaking desalination plant. The ledger wasn’t just numbers; it was the town’s living body – feed one part, another might weaken. She sketched a quick balance: the *possible* future wealth from the energy array against the *certain* present strain of the barrier work, and the *known* costs of delaying those other projects. The deferral wasn’t free; it was a bet, paid for in missed opportunities now.

  **Reason Two: The Shifting Sands.** Then came the uncertainty. Forty years. Would the East Barrier even be where the fiercest storms hit? Charts showed the seabed silting, currents shifting unpredictably. Would the town *be* the same town? Fisherfolk whispered of following changing stocks north. The young talked of opportunities in the floating cities. Maybe in forty years, the barrier wouldn’t guard homes and workshops, but warehouses or nothing at all. Spending a fortune to armour a ghost town was folly. This wasn't stinginess, Neve thought, just brutal realism. The future was foggy; investing in its precise shape was risky.

  **Reason Three: The Richer Future.** The report hinted at it delicately: progress. The energy array was just the start. With cheaper power, new industries would bloom. Automation would advance. Surely, the townsfolk of 2164 would be wealthier, more capable. What felt like a crushing burden now – the cost of the barrier work – would feel lighter to them. It was only fair, the implication ran, to let those better-equipped shoulders bear the load. A coin dropped then wouldn't clang as loudly as a coin dropped now. Neve chewed her lip. It sounded plausible, almost generous. But…

  **Reason Four: The Bare Later-Ness.** …she sensed something else. A visceral relief in pushing the hard, expensive thing away. A preference for *now* over *then*, dressed up in the respectable clothes of opportunity, uncertainty, and future wealth. How to spot it? How to peel off the costume?

  She recalled Barrett’s method, shared over bitter tea one late night. "Swap the hats, Neve. Make 'em wear the other fellow's coat."

  Neve closed her eyes. She imagined the Council chamber, not as it was, but forty years hence. The councillors were different faces, weathered by four more decades of storms and hard choices. On *their* table lay a request – not to defer, but to finally build the East Barrier reinforcement. The cost was high, disruptive. But the arguments against it sounded jarringly familiar:

  *   "Spend it now? We need that coin for the deep-sea mining rig upgrades! That’s our future prosperity! The barrier held this long, surely it can wait another decade?"
  *   "Who knows if this town will even *be* here in another forty years? Maybe the archipelago federation relocates us all! Why armour against a storm that might hit an empty bay?"
  *   "Think of our grandparents! They were poorer than us, true, but they built the *first* barrier with far less. They managed hardship. Why should *we*, richer and smarter, flinch from this cost? They deferred it for us, didn’t they? Pass it on!"

  The arguments mirrored perfectly, yet felt obscene coming from the mouths of those facing the imminent consequence. The generational swap revealed the naked preference for the present. The deferral wasn’t primarily about better opportunities, shifting threats, or fairer burdens; it was about *not now*. The costume slipped.

  **Trouble One: The Richer Future Was Real.** But then Neve looked closer at her imagined 2164 councillors. Their clothes *were* finer, woven from advanced polymers. Holographic charts flickered above their table. The harbour below teemed with sleek, automated vessels. The energy array, if built now *instead* of the barrier, *had* likely made them richer. The cost *would* represent a smaller slice of their abundance. Was it truly unfair to ask them to pay? The swap test made the time preference stark, but it couldn’t erase the genuine difference in capacity. Her clear verdict blurred. Was it exploitation or prudence?

  **Trouble Two: The Shifting Sands Shifted People.** And who exactly *were* these richer folk? If the town invested heavily now in the energy array and the industries it spurred, wouldn’t it attract different people? Engineers, technicians, maybe even off-islanders seeking high-tech jobs. The families who would struggle *now* with the barrier disruption – the small boat fishers, the ageing artisans – might be priced out, might leave. The people facing the cost in forty years might not be the descendants of those who deferred it; they might be newcomers, beneficiaries of the very growth the deferral enabled. Asking *them* to bear the cost felt different than asking the children of those who chose delay. The swap test presumed a continuity that might not exist. Who was she swapping?

  Neve sighed, the sound lost in the groan of wind against the stone. She picked up the engineering report again. The appendix listed the projected costs, year by year, adjusted for expected inflation and growth. She followed the numbers down, down the decades. The initial cost was a steep cliff. Ten years deferred: still substantial, but manageable. Twenty years: a noticeable hill. Thirty years: a moderate incline. Forty years: a smaller bump. Fifty years… sixty… seventy… the number dwindled, becoming almost trivial, a rounding error against projected future budgets. Anything beyond eighty years barely registered.

  A chill that had nothing to do with the draught crept over her. This calculation was the silent engine beneath all the reasons, the mathematical gravity pulling decisions towards *now*. It implied a horizon: beyond a certain point, any future cost or benefit, no matter how catastrophic or magnificent, simply ceased to matter. It shrank below the threshold of consideration. A storm that would drown the town in eighty-one years wasn't worth a single coin spent today to prevent it. Her office, the ledger, the careful parsing of reasons… it all existed within the sphere where the numbers were still large enough to see. Beyond that event horizon, the future vanished.

  And that, she realized with a hollow feeling, was the true purpose of the Office of Deferred Costs. Not to prevent deferral – the town lived on borrowed time, literally behind borrowed barriers – but to force the Council to *look* at the deferral clearly. To see the trade-offs, the uncertainties, the uncomfortable truths about present comfort versus future burden, and the cold calculation that made the distant vanish. The office existed because everyone knew the natural pull was always to kick the can, and the can would eventually hit a wall, or roll into the dark where no one cared.

  The wind rattled the shutters harder. A storm was brewing, not the cataclysm of forty years hence, but one that would test the current barriers tonight. Neve dipped her pen. She had to write the recommendation. She couldn’t dismiss the genuine opportunity the energy array presented, nor ignore the uncertainty of forty years. She couldn’t deny the future wealth argument entirely, even as the swap test revealed its selfish undertow. And she couldn’t ignore the insistent, diminishing whisper of the numbers the further out they went.

  Her pen scratched across the paper. She outlined the trade-off: the specific projects that would languish now. She detailed the uncertainties: the shifting currents, the demographic drift. She acknowledged the argument of future capacity but flagged the ethical discomfort revealed by the generational swap. She noted the cold logic of the long-term numbers, a logic that made her job both necessary and, ultimately, limited. She did *not* recommend outright rejection. Instead, she proposed a partial deferral: fund the critical foundation work now, the part that couldn’t easily be done later, securing the site. Defer the final, expensive cladding and height increase, tying that future cost explicitly to the revenue stream of the energy array. Make the beneficiaries of the *now* choice partly responsible for the *later* cost.

  It was messy. It satisfied no one completely. It acknowledged the pull of *now*, the gamble on the future, the uncomfortable discounting of the distant, and the labour of holding it all in mind, knowing the bill would come due, somewhere, sometime, for someone. Neve sanded the ink, closed the file, and placed it in the out-tray for Barrett. Below, she heard the harbour master shouting orders, battening down for the night’s storm. The present demanded its due. She lit the small oil lamp against the gathering gloom, its flickering light barely pushing back the shadows in the corners of the room, where the future waited, patient and vast.
