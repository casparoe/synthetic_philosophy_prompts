prompt: |-
  I'm working up a column about that old Letter Spirit question — what makes every 'a' still an 'a' — and I've been sitting in on a typographer's weekly drop-in session where she rules, yes or no, on whether a given glyph counts as an 'a'. Her calls so far: a Futura-ish circle with a stem on the right, yes; a double-story 'a' with its top hook filed off so the bowl runs straight into the stem, yes; a plain closed circle in a font where every other letter is fully drawn, no, that's an 'o'; a bowl with a chunk missing in a stencil face where all the letters have gaps, yes; a blackletter thing that's basically two slanted strokes and a diamond, yes; a wildstyle graffiti job with an arrow through a triangle, no. The one she's got next week comes from a display face where 'o' is drawn as a hexagon with a dot in the middle, and the glyph sitting in the a-slot is a plain circle: no stem, no notch, nothing atatched to it. What do you think she'll say, and what is the rule she's actually running — some invariant skeleton of bowl-plus-stem, some contrast-with-the-rest-of-the-alphabet business, something about what a reader gets in context? I want every rule that fits her track record about as well as the others, which one you'd put money on and why, and, if there is one, a description of a glyph I could put in front of her that would settle which rule she's using. And please no headings, bullet points, bold, or tables in your reply, just continous prose I can read on my phone.
