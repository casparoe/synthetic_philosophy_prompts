   1. The agent has preferences that are always transitive and complete. However, her ranking of two items (call them S for sunny and Q for quiet) flips over time. Specifically, she alternates between preferring S to Q and Q to S.

   2. The intensity of the preference varies. That is, the amount she would be willing to pay to swap one for the other changes over time.

   3. There is a neighbor who, at each of a sequence of times, offers to swap the two items for a small fixed fee (say, $1). The fee is pure profit for the neighbor and the agent sees it as such.

   4. The agent has perfect foresight of her own future preferences and the offers.

   5. We consider three types of agents:

      a. The "myopic" agent: at each time, she decides based on her current preferences. Since the preferences flip, she will sometimes swap and sometimes not. But because the intensity varies, there are times when she is willing to pay the fee to swap (when the intensity is high) and times when she is not (when the intensity is low). However, the sequence of swaps and non-swaps can be arranged so that over time, she ends up paying a lot of fees and eventually holding the same item she started with (or one that her initial self did not prefer) and having paid a large amount.

      b. The "sophisticated" agent: she uses backward induction to plan her entire sequence of decisions. She will end up losing only a bounded amount (which we will compute).

      c. The "committed" agent: at the outset, she commits to a plan (at no cost) that covers every future offer. This plan is designed to end up with the item that her earliest self ranks highest (which we assume is S at time 0) and to pay at most the bounded amount.

