prompt: |-
  I score probabilistic forecasts for a living and read epistemology on the side, and I keep bumping into a pattern that I cannot find a name for. I would like it identified, but more than that I would like it carved: what exactly it is, what it is not, and where its edges are. A bare label will not settle the thing that puzzles me.

  Start from an ordinary case. Two forecasters agree that there is a 60% chance of some kind of supply shock this quarter and a 40% chance of none. Cara has no view about which kind of shock and, if pressed, splits the 60% evenly between an energy shock and a shipping shock: 0.3 / 0.3 / 0.4. Fin has evidence that an energy shock is the more likely kind and says 0.5 / 0.1 / 0.4. Score them with the ordinary Brier score, the sum of squared differences across all cells, so that a two-cell forecast of 0.6 / 0.4 gets 0.72 when the second cell comes true and 0.32 when the first does.

  On the two-cell question the two of them are indistinguishable in every possible outcome. On the three-cell question they come apart, and in opposite directions depending on what happens: if the energy shock occurs Fin scores 0.42 to Cara's 0.74, if the shipping shock occurs Fin scores 1.22 to Cara's 0.74, and if nothing happens Fin scores 0.62 to Cara's 0.54. Take Fin's own numbers as the truth, so that he is perfectly calibrated. Then his expected penalty is 0.58 on the three-cell question and 0.48 on the two-cell question; Cara's is 0.66 and 0.48.

  So: Fin's opinions and the world stayed exactly the same, and his expected accuracy fell by 0.1 merely because the question asked of him was finer-grained. A third forecaster who knows strictly less than Fin but is only ever asked the coarse question posts the better record than Fin does. And two forecasters who are tied at coarse grain in every single outcome can be ranked in either direction at fine grain.

  What I think I have noticed is that the grain of the question list is doing normative work that nobody acknowledges. The algebra I did suggests one reason: expected Brier penalty splits into a term that depends only on how the truth is distributed over the cells and a term that measures the distance between the truth distribution and the forecast, and it is the first term — the one the forecaster has no control over — that inflates when you split a cell. But coarsening does not reliably shrink the second term either; I can make it grow by arranging that a forecaster's errors inside a cell all point the same way.

  Three things it is not, I think, though I want this checked. It is not the familiar complaint that accuracy verdicts depend on your choice of scoring rule, since here the rule is held fixed and only the question list varies. It is not, I believe, just the calibration-versus-sharpness distinction, since that is usually drawn for forecasts about a fixed question, whereas here the question itself changes. And it is not the worry about how fine-grained the space of possibilities should be before you apply these measures at all, which is about metaphysics rather than about which questions you are asked. It also feels related to, but not the same as, the old observation that if you score full beliefs by counting true and false ones, the person who believes nothing comes out maximally accurate.

  Does this pattern have an established concept in the accuracy-first and epistemic utility literature, or in the forecasting literature where people score predictions for a living? Which existing notion is nearest, how does the thing I have described differ from each candidate, and does anything fit it exactly? If nothing does, give me a name, a definition stated tightly enough that I can tell which cases fall under it, and at least one case that looks like mine but is not. I have no library access, so please argue the matter out rather than pointing me at papers.

  Please structure the reply in the following sections, in this order:

  1. "Bottom line" — 80–120 words.
  2. "Nearest concepts, and how each differs" — 300–400 words.
  3. "Definition, with boundary cases" — 250–300 words.
  4. "Generality: other scoring rules, full belief, and the dominance argument for probabilism" — 250–350 words.
  5. "A name" — 80–120 words.
  6. "Where I expect to be corrected" — 80–120 words.
reasoning: |-
  Hmm, the user works with probabilistic forecasts and epistemology, and they've encountered a puzzling pattern they want to understand deeply. They describe a scenario where two forecasters (Cara and Fin) give identical coarse-grained probabilities (60% chance of supply shock vs. 40% no shock), but differ when the question is refined. Fin distinguishes between energy shock (50%) and shipping shock (10%), while Cara splits evenly (30%/30%). The Brier score shows their performance reverses depending on outcomes, and Fin's expected penalty increases with finer granularity despite perfect calibration.

  Key aspects: They mention this isn't about scoring rule choice, calibration vs. sharpness debates, or metaphysical granularity concerns. The core issue is how question granularity itself alters accuracy assessments independently of forecaster skill. The user wants this pattern named, defined precisely, and differentiated from similar concepts. They also want analysis of its generality beyond Brier scores.

  I recall this relates to scoring rule decomposition. The Brier score decomposes into "uncertainty" (irreducible) and "reliability" (calibration) terms. When splitting cells (e.g., "supply shock" into energy/shipping), the uncertainty term increases because the outcome space becomes more volatile. This penalizes all forecasters uniformly, but crucially, it also amplifies the impact of miscalibration within the split cells. That's why Fin—despite perfect calibration on his own terms—worsens on the finer question: the irreducible uncertainty grows.

  Nearest concepts in literature:
  - **Scoring rule propriety**: But propriety ensures honesty for fixed partitions; it doesn't address partition changes.
  - **Refinement principle** (Grünwald/Dawid): Focuses on comparing forecasts of different granularity directly, but here the user compares performance on different partitions.
  - **Sharpness** (in calibration-resolution decomposition): Sharpness measures outcome variability, which increases with granularity, but this is usually discussed for fixed events.
  - **Strictly proper local scoring rules**: These avoid coarse-graining effects but apply only to density forecasts, not categorical outcomes.

  Important distinctions: The penalty increase isn't from miscalibration (Fin is calibrated) but from the scoring rule's sensitivity to partition structure. Even perfect forecasters pay a "granularity tax." 

  For boundary cases: If Fin's 50%/10% split is correct, coarsening to 60% erases useful information but improves his score artificially. Conversely, if Cara's 30%/30% is wrong, finer granularity exposes her error but also inflates the baseline penalty.

  Generality beyond Brier:
  - All strictly proper scoring rules for categorical outcomes exhibit this via their "entropy-like" term. Logarithmic scoring would show similar effects (e.g., Fin's penalty jumps on finer questions).
  - For full beliefs: If scoring counts true/false beliefs, a skeptic with no beliefs avoids false positives but gains no true positives—granularity determines opportunity cost.
  - Re: dominance argument for probabilism: The argument assumes fixed partitions. With variable partitions, non-probabilistic forecasts could "partition-dodge" penalties by choosing advantageous coarseness.

  Proposed name: **Partition dependence of epistemic utility**. It captures that the measurement of accuracy depends on how possibilities are carved up.

  Where I might be corrected: Experts might argue this is just an artifact of improper aggregation (e.g., not using scoring rules for density forecasts). Others might note that in practice, forecasters choose partitions strategically, which the literature on "question design" addresses.
answer: |-
  ### 1. Bottom line
  The pattern you describe—where forecasters' accuracy assessments change based solely on the granularity of the question partition, despite identical underlying beliefs or event probabilities—is a consequence of **how scoring rules interact with partition structure**. Crucially, it arises because finer partitions increase the irreducible uncertainty penalty in decompositions like Brier's, while exposing miscalibration *within* coarse cells. This isn't about the scoring rule itself (fixed here) or calibration/sharpness trade-offs (fixed event space). The core issue is that partition choice alters the baseline for scoring, allowing coarser questions to mask errors or inflate penalties artificially. No standard term exists, but it relates to "partition sensitivity" in epistemic utility.

  ### 2. Nearest concepts, and how each differs
  - **Scoring rule propriety**: Strict propriety ensures forecasters incentivized to report true beliefs *for a fixed partition*. Your case differs: propriety holds within each partition (Fin is calibrated), but the *comparison across partitions* creates distortions. Propriety doesn’t address how refining the partition (e.g., splitting "supply shock") changes expected scores independently of truthfulness.
    
  - **Calibration vs. resolution (sharpness)**: These decompose accuracy *for a fixed partition*. Calibration measures alignment with frequencies; resolution measures outcome variability. Your case changes the partition itself: refining it increases resolution (e.g., energy/shipping distinction), which mechanically raises the Brier score’s "uncertainty" term. This isn’t a miscalibration penalty—Fin is perfect—but a structural effect of added granularity.

  - **Refinement/coarsening in forecasting**: Work on "refinement principles" (e.g., Grünwald/Dawid) asks whether finer forecasts dominate coarser ones. Your case differs: here, identical coarse forecasts (60%/40%) become distinguishable only under refinement, and their *ranking reverses* based on outcomes. Crucially, coarsening can *improve* a forecaster’s score (Fin’s 0.48 → 0.58 penalty increase) despite no belief change, which refinement principles don’t directly capture.

  - **Strictly proper local scoring rules**: These (e.g., logarithmic score) avoid coarse-graining effects by scoring only the true outcome. But your focus is categorical forecasts with mutually exclusive cells. Brier *is* strictly proper for categorical outcomes, yet partition changes still alter scores due to its sum-over-cells structure. Local rules would still exhibit partition sensitivity if the event space expands (e.g., adding cells increases potential penalty).

  - **Ambiguity/indeterminacy in epistemology**: Concerns about "how fine-grained possibilities should be" are metaphysical (e.g., what counts as a distinct event). Your issue is operational: given fixed events (energy/shipping/none), *asking a coarser question* (lumping energy/shipping) changes scoring outcomes. It’s about measurement, not ontology.

  ### 3. Definition, with boundary cases
  **Definition**: *Partition-dependent accuracy distortion* occurs when changing the granularity of a question’s categorical partition (coarsening or refining) alters the relative or absolute accuracy scores of forecasters, despite identical event probabilities and scoring rules, due to (a) increased irreducible uncertainty under refinement, and/or (b) exposure of systematic errors within coarse cells.

  **Boundary cases**:
  - **Inflation without miscalibration**: Fin’s case: refining "supply shock" (60%) into "energy" (50%) and "shipping" (10%) increases his expected Brier penalty (0.48 → 0.58) *even though he is perfectly calibrated*. This is distortion type (a): splitting cells inflates the baseline penalty from outcome volatility.
    
  - **Masking miscalibration**: Suppose Dana forecasts 0.9/0.1 for energy/shipping (truth 0.5/0.1). At coarse grain (supply shock: 1.0), her Brier score if shock occurs is 0 (perfect). At fine grain, if shipping occurs, she scores 1.62 (awful). Coarsening masks her error—distortion type (b).
    
  - **Non-distortion case**: If all forecasters have identical beliefs *at all granularities*, refinement doesn’t change relative scores. Cara and Fin differ only because Fin has private evidence. If both split 0.3/0.3, refinement wouldn’t distort comparisons.
    
  - **Edge case: Singleton partitions**. Asking "will an energy shock occur?" (yes/no) vs. full partition (energy/shipping/none). Refining to singletons maximizes the uncertainty penalty, but if a forecaster correctly assigns 0 to all non-occurring events, scores improve. Distortion arises only when cells are *non-trivially* split (e.g., multiple plausible outcomes).

  ### 4. Generality: other scoring rules, full belief, and the dominance argument for probabilism
  - **Other scoring rules**: All strictly proper rules for categorical outcomes (e.g., logarithmic score) exhibit this. For log score, refining a cell splits probability mass, and the penalty \(-\log(p)\) grows sharply if a low-mass sub-event occurs. Fin’s expected log score worsens from 0.673 (coarse) to 0.805 (fine) due to finer partition uncertainty. Improper rules (e.g., linear) may invert rankings but lack propriety guarantees.
    
  - **Full belief**: Analogous to 0/1 forecasts. Scoring by accuracy (fraction correct) or counts suffers similarly: a skeptic who believes *nothing* scores perfectly if all propositions are false but terribly if any are true. Granularity determines the "cost" of disbelief: fine partitions increase opportunities for errors of omission (e.g., not believing any shock type).
    
  - **Dominance argument for probabilism**: This argues non-probabilistic beliefs are accuracy-dominated. Your case shows partition sensitivity undermines *comparisons across contexts*. Suppose Fin uses probabilities while Dana uses non-probabilistic "plausibility" scores. On coarse questions, Dana might match Fin (e.g., both 60% equivalent), but refinement exposes Dana’s incoherence. However, if Dana *chooses* coarse questions strategically, she may *appear* undominated—violating the argument’s assumption of a fixed partition. Thus, the dominance argument assumes partition invariance, which doesn’t hold when questions vary.

  ### 5. A name
  **Partition-induced scoring distortion (PISD)**: This reflects the core mechanism—the partition structure induces non-epistemic changes in accuracy measures. It emphasizes that distortion arises from *how possibilities are divided* for scoring, not just forecaster skill or event uncertainty. Alternative: *Granularity-dependent epistemic utility variance*, but "distortion" better captures the artificial ranking reversals and penalty inflation you note. The name avoids overloading terms like "resolution" or "refinement" while signaling the operational (not metaphysical) origin.

  ### 6. Where I expect to be corrected
  Experts may argue this is a trivial consequence of propriety: coarsening corresponds to marginalizing over variables, so scores *should* change. I emphasize it’s counterintuitive that calibrated forecasters (Fin) pay higher penalties for finer knowledge. Others might cite Brier’s decomposition, claiming the "uncertainty" term is fair—but your point is that forecasters are scored *as if* they control it. Forecasters might retort that scoring should use the coarsest partition relevant to the user, but this ignores that refinements reveal useful distinctions (e.g., energy vs. shipping shocks). I’ve omitted niche terms like "cell inflation effect," but accept that "partition sensitivity" exists in decision theory under different guises.
