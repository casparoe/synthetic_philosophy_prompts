  - Modern influence-sphere: Extends control to things we can influence (e.g., through effort, persuasion, etc.)
  - Indirect-influence reading: We can partly steer outcomes, so they are partially under our control.
  - Therapeutic reading: It's about where we put our anxiety. We can choose not to be anxious about things we don't control.
  - Quietist-leaning: Political action (or any external action) is pointless because we don't control outcomes.
  - Flat rejection: The question of control is the wrong one; we should ask what is worth caring about.

  We need to design questions that tease apart these views without using technical terms.

