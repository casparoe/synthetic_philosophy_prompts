answer: |-
  ## Premise
  Dr. Ergo champions the "Time-Average Standard": wealth grows multiplicatively, so maximise its *geometric* mean growth rate. The Reappearance Rule asserts no decision is truly one-off; structurally identical choices will recur for your future selves, heirs, or multiverse branches. Expected value maximisation is myopic physics-envy; only long-run growth matters. Ruin is intolerable. The load-bearing beam? The Reappearance Rule. Without it justifying infinite repetition, the edifice crumbles when faced with genuinely unique, high-stakes choices.

  ---

  ## The Column

  **ASK THE GROWTH OPTIMISER**
  *Feeling financially adrift? Let Dr. Ergo steer your portfolio towards multiplicative dominance. Remember: Time Averages Truth!*

  ---

  **Standfirst:** Confused by volatile markets, one-off windfalls, or distant targets? Dr. Ergo cuts through the fog of expected-value thinking with the clear, cool logic of the Time-Average Standard. Submit your quandaries!

  ---

  **Dear Dr. Ergo,**
  My eccentric Uncle Cedric is finally selling his thriving artisanal clog business – to *me*, at a knockdown price! It’s a one-time chance. I’ve savings to buy it outright. But my mate Baz, who’s read your column, insists I should only stake a *fraction* of my cash, as per some “Kelly” thing. Why leave money on the table for a sure(ish) winner? It makes no sense!
  *Perplexed in Preston*

  **Dr. Ergo replies:**
  Perplexed, your perplexity stems from a fundamental error: the “one-time” fallacy. The Reappearance Rule applies! While Uncle Cedric’s *specific* clog emporium may not reoccur, structurally identical opportunities – lucrative, unexpected, requiring capital allocation – *will* manifest throughout your life, your children’s lives, and indeed, across the branching multiverse where you survive the great clog shortage of ’27. This is a repeated game. Staking everything risks ruin (bad clogs, market shifts, rogue badgers); ruin terminates future growth. Calculate the *growth-optimal* fraction. If the venture multiplies your wealth by 1.5 on success (probability p) and 0.6 on failure (q=1-p), the fraction f = (p/0.6) - (q/0.9) maximises your long-run doubling rate. Ignore Baz’s crude approximation; use the exact formula. Staking all? That’s the path to *negative* time-average growth. Be rational, not reckless!

  ---

  **Dear Dr. Ergo,**
  I need £20,000 by December for a house deposit. My broker keeps rabbiting on about “long-term growth rates” and “time averages” and suggests a portfolio that grows geometrically. But December isn’t “long-term”! I need a specific sum by a specific date. What’s the growth-optimal way to hit my target?
  *Deadline-Driven in Dundee*

  **Dr. Ergo replies:**
  Deadline-Driven, your query reveals a category error. A *target* is not a *growth rate*. The Time-Average Standard optimises the multiplicative growth factor *over time*, not the probability of reaching an arbitrary number by an arbitrary date. Focusing on a specific sum by December is precisely the myopic, expected-value thinking that leads to ruin! You are fixated on the ensemble average of one trial – “What’s my expected wealth in December?” – a meaningless phantom. The rational path remains maximising your *ongoing* growth rate. If your chosen strategy risks falling short in December, this simply means your current wealth level makes the £20k target incompatible with *safe* growth optimisation over the long horizons guaranteed by the Reappearance Rule. Recalibrate your target or increase your initial capital through ethically sound multiplicative endeavours. Growth-rate maximisation is the compass; targets are mirages.

  ---

  **Dear Dr. Ergo,**
  As Chief Actuary for the Prudent & Mutual Assurance Society (PMAS), we pool premiums from millions of members to pay pensions decades hence. Doesn’t this pooling across a vast *ensemble* of people *right now* achieve precisely the ensemble average outcome over time that your Time-Average Standard critiques? Why wouldn’t PMAS, as an institution, simply maximise expected value per policy?
  *Actuarially Aware in Acton*

  **Dr. Ergo replies:**
  Actuarially Aware, your institutional thinking is commendable but flawed! Pooling across lives does *not* magically transform multiplicative growth dynamics into an additive expected-value game *for the individual*. Consider: while PMAS sees the ensemble average return across its millions, the *individual member* experiences only one path – their personal sequence of multiplicative returns dictated by the Society’s investment choices. If PMAS maximises expected value using a strategy that, say, offers a 5% boost to the ensemble mean but induces a -5% drag on the *time-average* growth for individual wealth paths (e.g., 1.5x / 0.6x per period), then over decades, *most* members’ pension pots will grievously underperform the ensemble promise! The Society’s solvency relies on the ensemble, true, but the *member’s outcome* relies on the time-average. PMAS must choose investments to maximise the *geometric mean growth rate per member*, ensuring the typical member thrives. Anything else is intergenerational theft via volatility drag. Apply fractional Kelly scaling to the *entire portfolio* per member. Time averages truth, ensemble averages lie.

  ---

  **Dear Dr. Ergo,**
  The Smytheson Family Trust must decide whether to spend 90% of its capital to purchase Raven’s Tor, a unique historical landmark, securing its future for centuries. This is a once-in-a-hundred-years decision. Our trustees are split: some see the immense cultural value (effectively infinite utility!), others fret over the concentration risk. How does the Reappearance Rule apply to a genuinely unique, century-scale commitment?
  *Legacy-Minded in Lymington*

  **Dr. Ergo replies:**
  Legacy-Minded, uniqueness is an illusion fostered by temporal myopia! The Reappearance Rule shines brightest here. While Raven’s Tor itself is unique, the *structure* of the decision – allocating a vast fraction of capital for a high-impact, irreversible outcome with uncertain long-term multiplicative consequences (preservation value, tourism income, reputational multipliers) – *will* recur. Your future trustees will face similar epoch-defining choices: restoring the Tor after a meteor strike (probability non-zero!), acquiring the adjacent valley, funding a lunar Smytheson archive. Your institutional successors are your future selves! Spending 90% risks ruinous volatility for the remaining capital. Calculate the growth-optimal fraction for the *expected multiplicative impact* on the Trust’s long-term mission-capital. Assign probabilities and multiplicative factors to “cultural perpetuity” outcomes. If the expected growth factor from full purchase doesn’t dominate the Kelly-optimal staking fraction for the *risky* portion of the purchase cost versus holding capital, you must stake less. Perhaps a consortium? Growth-optimisation ensures the Smytheson legacy thrives multiplicatively across millennia and multiverses. Sentiment must bow to the geometric mean.

  ---

  **Dear Dr. Ergo,**
  Forgive my impertinence, but isn’t maximising expected log wealth just another arbitrary choice? It avoids ruin and dominates in the long run, granted. But it feels less like fundamental physics (as you imply) and more like picking a specific concave utility function (U(W) = log W) and hoping no one asks *why that one*? Why not U(W) = -1/W, or just maximise the median outcome?
  *Curious about Foundations in Cambridge*

  **Dr. Ergo replies:**
  Curious, your “impertinence” is mere confusion masquerading as depth! The log is *not* arbitrary; it is the *linchpin of multiplicative ergodicity*. Expected value maximisation assumes additive dynamics – physics for simpletons! Real wealth grows multiplicatively. The log transform is the *only* function that converts this multiplicative noise into additive noise, making the time-average (limit of (1/T)Σ log(return_t)) and the ensemble average (E[log(return)]) converge – ergodicity restored! Choosing another utility function (U(W) = -1/W? Preposterous!) or obsessing over the median (a mere snapshot!) ignores this profound mathematical truth about how capital *actually* evolves. The Kelly fraction derived from maximising E[log(1+f*return)] *is* the growth-optimal fraction, proven to asymptotically dominate any other strategy with probability 1. This isn’t “picking”; it’s *discovering* the iron law of capital dynamics. Questioning the log is like questioning gravity because you dislike falling. Time averages truth. The foundations are bedrock. Next question?

  ---

  ## What I am Satirising

  The satire targets the *rigid, universalised application* of growth-rate (geometric mean) maximisation via the Kelly criterion, particularly the core justification: the Reappearance Rule. The vulnerability is that this "repetition" is often a metaphysical assertion, not an empirical reality, especially for unique, high-stakes, or existential choices (like Raven's Tor or the house deposit). Defenders would argue the Rule is a *heuristic for robustness*: strategies that avoid ruin and perform well under repetition are generally safer and more sustainable even for "one-shot" decisions, as they acknowledge deep uncertainty and path dependence. They'd stress that expected value *is* often myopic and dangerous for multiplicative growth, and the critique of ensemble averages for individual trajectories is mathematically sound. The satire pushes the *dogmatic insistence* on growth-optimality into absurdity when the assumed repetition is implausible, or when other values (targets, unique legacy, pooled outcomes) legitimately conflict.

  ## Where I have Taken Liberties

  1.  **Exaggeration:** Dr. Ergo's Reappearance Rule is hyper-extended (multiverse! children's choices! meteor strikes!) to absurdity to highlight its role as a necessary but often convenient fiction for the theory. Her dismissal of targets and unique legacy is overly brutal.
  2.  **Contested Reading:** Treating pooled institutions like PMAS *solely* through the lens of individual time-averages ignores that well-diversified pools *can* validly use expected value *because* they realise the ensemble average across members *simultaneously*. Dr. Ergo dismisses this by incorrectly claiming the individual member only sees one path *of the fund's performance* – but a stable, diversified fund *delivers* a smoothed, near-expected-value return *to* each member. The satire leans on a purist, individual-path-centric reading.
  3.  **Omitted Point:** The valid use of fractional Kelly (staking less than full Kelly to reduce volatility) is mentioned but not explored as a concession to risk-aversion or finite horizons. A genuine defence would emphasise fractional Kelly as a practical bridge. Leaving it out makes Dr. Ergo seem more dogmatic and her advice for Preston (using the exact formula, not Baz's crude fraction) potentially worse, heightening the satire.
