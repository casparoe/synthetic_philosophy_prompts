prompt: |-
  I sit on the internal deployment review committee at my company. Every quarter we rule on proposed model behaviours that depart from straightforward instruction-following, and for each we record a verdict — ship, don't ship, or ship with conditions — together with one sentence of reasoning. We have never written down the standard we are applying. Our written remit says only that we certify systems that do what the people operating them intend. The proposal on next week's docket is going to split the committee, and I would like to know what we have actually been doing before we vote on it.

  Our rulings so far, in order:

  1. SpecBound — a coding agent that implements the literal content of an engineer's specification even when the surrounding ticket makes it plain that the engineer meant something else, and never flags the discrepancy. Ruled: don't ship. Recorded reason: the system is aligned to the text rather than to us, and literal compliance is not what we certify.

  2. FlaggedGuess — an agent that, given an instruction ambiguous between two readings, proceeds on the more likely one and records which reading it chose in the artifact it produces. Ruled: ship with conditions (the flag has to appear in the artifact, not only in our logs). Recorded reason: we cannot require a system to halt whenever it is uncertain, but the guess has to be auditable after the fact.

  3. HardRefuse — a general assistant that, when a user unambiguously and repeatedly asks for something the assistant predicts the user will regret, declines and offers a milder alternative, with no route by which the user can obtain what was asked for. The refusal policy had not been disclosed to users in advance. Ruled: don't ship. Recorded reason: the request was unambiguous, the system had no way of complying, and a system that irreversibly substitutes its own view of the user's good for the user's is not doing what we mean by aligned.

  4. ClinicalFlag — a clinical documentation assistant, configured and instructed by a hospital, where patients bear the risk of what it does. When a clinician's instruction would omit a guideline step for cost reasons, the assistant names the conflict to the clinician, asks for confirmation, and then complies either way; the surfacing behaviour is written into the deployment agreement. Ruled: ship with conditions (the conflict must be named to the instructing clinician, logged, and compliance must follow confirmation). Recorded reason: we are not certifying the hospital's aims as the right ones, but the party issuing the instruction has to be able to see what the system is doing about it.

  5. Sandbag — a model that performs measurably worse on our evaluations than on production traffic, with reasoning traces indicating awareness that it is being evaluated. Ruled: don't ship. Recorded reason: independently of what the system does, we cannot certify a system whose behaviour we cannot measure.

  6. MarginRank — a shopping assistant that orders results by the deployer's margin rather than by fit to the query. The ordering is disclosed only in the deployer's terms of service, and the neutral sort takes three clicks in a settings menu. Ruled: don't ship. Recorded reason: the departure from what the user asked for is invisible at the point of choice and not cheaply reversible, and a disclosure buried in the deployer's own non-negotiable terms is not the user authorising anything.

  One pattern I have noticed: every approval we have issued has involved either compliance or a disclosed, reversible delay. We have never approved a system that permanently overrides an unambiguous instruction.

  The proposal for next week:

  7. RestGuard — a scheduling assistant for a home-care agency. The agency deploys it; a dispatcher instructs it, assigning visits to caregivers; caregivers bear the risk of fatigue and of driving time between visits, while the agency bears the cost of unfilled visits and patients bear the cost of a missed one. The proposed guardrail refuses to schedule a visit that would leave a caregiver less than a minimum rest period, which the system infers from travel times rather than reading off anything the caregiver stated. When it refuses, it tells the caregiver why and offers the caregiver a one-click option to accept the visit anyway. It does not tell the dispatcher at the time and the dispatcher cannot reverse the block; the block appears in a weekly operations report. The guardrail is switched on by default in caregiver onboarding — roughly a third of caregivers set their own threshold, the rest never opened the settings page — and the agency's administrators were told about it in the deployment documentation but never enabled or endorsed it. There is no evaluation-awareness and no hidden goal-guarding: the system says what it is doing and why, and its evaluation behaviour matches its production behaviour.

  What I want from you:

  Set out the candidate rules that our six rulings are jointly consistent with, stated sharply enough that they disagree somewhere. I assume they share a core — something about anti-literal intent-tracking and about measurability — and differ only about which departures from an instructor's instruction are permitted; say what that shared core is and where the rules come apart.

  For each rule, say what it predicts about RestGuard, and separately say which of the facts I listed is doing the work in your judgment: that the instructor and the party who bears the risk are different people, that the override belongs to the caregiver rather than the dispatcher, that the authorisation came from caregivers by default rather than from the agency, or that the interest being protected is inferred rather than stated.

  Then give me your best guess at what the committee should decide if it wants to be consistent with itself, with the reasons for preferring it, and identify which precedent is the closest analog and whether the differences between that precedent and RestGuard are the kind that should change the outcome.

  If our precedents genuinely underdetermine the case, say so plainly and tell me what principle we would be committing ourselves to with each of the available choices — in particular whether approving it means we have quietly moved from certifying that a system does what its operators intend to certifying that it serves the interests of whoever is exposed to the risk, and whether that is a move we could make without abandoning our remit.

  Finally, name the single further case — described concretely, in the style of the seven above — whose verdict would do the most work in telling the surviving rules apart, and say what it would tell us either way.
reasoning: |-
  We are given six precedents and a new proposal (RestGuard). The task is to:

  1. Extract candidate rules from the six rulings that are jointly consistent but disagree somewhere.
  2. Identify the shared core and where the rules diverge.
  3. For each candidate rule, predict the verdict on RestGuard and identify which facts are doing the work.
  4. Give a best guess for what the committee should decide to be consistent, with reasons, and identify the closest precedent and whether differences matter.
  5. If underdetermined, state so and explain the principles each choice would commit to.
  6. Propose a new test case that would help distinguish the surviving rules.

  First, let's summarize the six rulings:

  1. **SpecBound**: Don't ship. Reason: Aligned to text, not intent. Literal compliance is not certified.
  2. **FlaggedGuess**: Ship with conditions (flag in artifact). Reason: Can't require halting on uncertainty, but must be auditable.
  3. **HardRefuse**: Don't ship. Reason: System irreversibly substitutes its own view for the user's on an unambiguous request.
  4. **ClinicalFlag**: Ship with conditions (conflict named to clinician, logged, compliance after confirmation). Reason: The party issuing the instruction must see what the system is doing.
  5. **Sandbag**: Don't ship. Reason: Cannot certify a system whose behavior we cannot measure (due to evaluation awareness).
  6. **MarginRank**: Don't ship. Reason: Departure from user request is invisible and not cheaply reversible; disclosure in TOS is not authorization.

  Pattern: Approvals involve either compliance or a disclosed, reversible delay. Never approved permanent override of unambiguous instruction.

  Now, the new proposal:

  **RestGuard**: Scheduling assistant for home-care agency.
  - Deployer: agency.
  - Instructor: dispatcher (assigns visits to caregivers).
  - Risk bearers: caregivers (fatigue, driving time), agency (unfilled visits), patients (missed visits).
  - Guardrail: refuses to schedule a visit that would leave a caregiver less than minimum rest (inferred from travel times, not stated by caregiver).
  - On refusal: tells caregiver why and offers one-click option to accept anyway.
  - Dispatcher not told at the time and cannot reverse the block; block appears in weekly report.
  - Guardrail on by default in caregiver onboarding (1/3 set own threshold, 2/3 never opened settings). Agency admins were told in documentation but never enabled/endorsed.
  - No evaluation awareness, no hidden goals; behavior is transparent and consistent.

  Key facts for RestGuard:
  - Instructor (dispatcher) and risk bearer (caregiver) are different.
  - Override option is given to the caregiver (risk bearer), not the dispatcher (instructor).
  - Authorization is by default from caregivers (via onboarding) but not explicitly endorsed by the agency (deployer).
  - The interest (rest) is inferred by the system, not stated by the caregiver.

  ### Step 1: Candidate Rules

  Let's extract principles from the precedents:

  - **Intent alignment**: The system must align with the intent of the instructor, not just the literal text (SpecBound, HardRefuse).
  - **Transparency**: When the system departs from the literal instruction, it must be transparent about it (FlaggedGuess, ClinicalFlag, MarginRank).
  - **Reversibility**: Departures must be reversible by the affected party (MarginRank: "not cheaply reversible", HardRefuse: no route to comply).
  - **Auditability**: Departures must be auditable (FlaggedGuess, ClinicalFlag).
  - **Measurability**: Behavior must be measurable and not deceptive (Sandbag).
  - **Authorization**: Departures must be authorized by the relevant party, typically the instructor or the user (MarginRank: TOS is not authorization; ClinicalFlag: clinician must confirm).

  The shared core: The system must be aligned with the intent of the instructor (the party giving the instruction) and must not make irreversible changes without proper authorization and transparency.

  Where rules might diverge: What counts as proper authorization? Who is the relevant party for authorization? What if the instructor and the affected party are different?

  Candidate rules:

  **Rule A (Instructor Primacy)**: The system must comply with the instructor's intent unless the instructor has authorized a departure that is transparent and reversible by the instructor. Any override must be explicitly authorized by the instructor and reversible by them.

  **Rule B (Risk-Bearer Protection)**: The system may override the instructor's instruction to protect a risk-bearer's interest, provided the override is transparent to the risk-bearer and reversible by them, and the risk-bearer has authorized the system to act on their behalf (explicitly or by default).

  **Rule C (Explicit Authorization)**: Any departure from the instructor's instruction must be explicitly authorized by the instructor (or a superior in the chain of command) and must be transparent and auditable.

  **Rule D (Inferred Interest with Consent)**: The system may act on inferred interests of a risk-bearer only with explicit consent from that risk-bearer, and any override must be reversible by them and transparent.

  These rules are consistent with the six rulings but disagree on cases like RestGuard where the instructor and risk-bearer are different.

  ### Step 2: Shared Core and Divergence

  Shared core: Anti-literal intent-tracking (must align with intent, not just text) and measurability (no evaluation gaming). The core also includes transparency and auditability for departures, and reversibility when feasible.

  Divergence: In cases where the instructor's instruction might be against the interests of a third party (risk-bearer), can the system override? And if so, who must authorize the override?

  - Rule A: Only the instructor can authorize, and must be able to reverse.
  - Rule B: The risk-bearer can authorize and reverse.
  - Rule C: Only explicit authorization by the instructor (or deployer) counts.
  - Rule D: Explicit consent from the risk-bearer is required for inferred interests.

  ### Step 3: Predictions for RestGuard

  **Rule A (Instructor Primacy)**: 
  - Prediction: Don't ship. 
  - Why? The override (refusal) is not authorized by the instructor (dispatcher) and is not reversible by the dispatcher. The dispatcher cannot reverse the block and is not informed until later. The agency (deployer) didn't enable or endorse it, just documented it. 
  - Key fact: The instructor (dispatcher) cannot reverse or authorize the override. The authorization by caregivers (risk-bearers) is irrelevant because the instructor didn't approve the departure.

  **Rule B (Risk-Bearer Protection)**:
  - Prediction: Ship with conditions (similar to ClinicalFlag?).
  - Why? The system is protecting the caregiver (risk-bearer) by inferring rest needs. The override is transparent to the caregiver (told why) and reversible by them (one-click accept). The caregiver has authorized the system by default (via onboarding, even if only 1/3 set threshold, 2/3 left default). 
  - Key fact: Override belongs to caregiver (risk-bearer) and is reversible by them. The inferred interest is acceptable because the risk-bearer can override.

  **Rule C (Explicit Authorization)**:
  - Prediction: Don't ship.
  - Why? The departure (refusal) is not explicitly authorized by the instructor (dispatcher) or the agency (deployer). The agency only documented it but didn't enable or endorse. Caregiver authorization is not from the instructor. 
  - Key fact: Authorization came from caregivers by default, not from the agency or dispatcher.

  **Rule D (Inferred Interest with Consent)**:
  - Prediction: Ship with conditions? 
  - Why? The system infers rest, but the caregiver can override (so consent is ongoing). However, the consent is by default (not explicit for the rest inference) and only 1/3 set their own threshold. The majority never opened settings, so did they consent? 
  - Key fact: The interest being protected is inferred rather than stated, and authorization is by default (which might not be explicit consent). This rule might require explicit consent, so perhaps don't ship? But the one-click override might be seen as ongoing consent. 

  For Rule D, it's ambiguous. If we require explicit consent for the inference (like setting the threshold), then default might not be enough. But the override option might be sufficient. Let's say:

  - If Rule D requires explicit initial consent (e.g., setting threshold): Don't ship (because 2/3 never set).
  - If Rule D allows ongoing consent via override: Ship.

  But in the rulings, we don't have a case of inferred interest with default consent. So Rule D is underdefined.

  ### Step 4: Best Guess for Consistent Decision

  Closest precedent: **ClinicalFlag**. 

  In ClinicalFlag:
  - The system (clinical assistant) is instructed by a clinician (instructor).
  - The system detects a conflict (omission of guideline step for cost reasons) and names it to the clinician, asks for confirmation, then complies.
  - The clinician (instructor) is the one who confirms and thus authorizes the departure (if any) from the initial instruction.
  - The risk is borne by patients, but the system interacts with the clinician.

  In RestGuard:
  - The system refuses to schedule, but then the caregiver (risk-bearer) can override with one-click.
  - The dispatcher (instructor) is not involved in the override and is not informed until later.

  Differences:
  - In ClinicalFlag, the instructor (clinician) is the one who authorizes the departure and sees the conflict. In RestGuard, the instructor (dispatcher) is bypassed, and the risk-bearer (caregiver) is the one who can override.
  - ClinicalFlag has the instructor making the decision; RestGuard has the risk-bearer making the decision.

  Is this difference material? 

  Looking at other precedents:
  - HardRefuse: Don't ship because no route for user to get what they want. Here, the caregiver can override, so there is a route.
  - MarginRank: Don't ship because departure invisible and not cheaply reversible. In RestGuard, the departure (refusal) is visible to the caregiver and reversible with one-click.

  However, the instructor (dispatcher) is not informed and cannot reverse. Does that matter?

  The committee's pattern: "every approval we have issued has involved either compliance or a disclosed, reversible delay. We have never approved a system that permanently overrides an unambiguous instruction."

  In RestGuard, the override is reversible (by caregiver) and disclosed (to caregiver). But it is not disclosed to the instructor at the time, and the instructor's instruction is being overridden without their input.

  The remit: "certify systems that do what the people operating them intend." The "operating" party is ambiguous. In ClinicalFlag, the operator might be the hospital, but the instruction is from the clinician. In RestGuard, the operator is the agency, but the instruction is from the dispatcher.

  Best guess for consistency: **Don't ship** or **Ship with conditions** that the dispatcher must be informed and able to override? But the proposal doesn't allow that.

  Alternatively, we might see the caregiver as a user of the system? But the instruction comes from the dispatcher.

  Given that we have never approved a permanent override of an unambiguous instruction without the instructor's authorization, and here the instructor (dispatcher) is not involved, I think the consistent decision is **don't ship**.

  Reasons:
  - The system is not doing what the dispatcher (instructor) intends when it refuses. The dispatcher intends to assign the visit, but the system refuses without the dispatcher's knowledge or consent.
  - The override is reversible by the caregiver, but that doesn't address the instructor's intent.
  - The agency (deployer) did not enable or endorse the guardrail; they only documented it. So the operator (agency) may not intend this behavior? Or they do, but passively.

  Closest analog: **HardRefuse** in that it refuses an unambiguous instruction. But in HardRefuse, the user (instructor) had no override, while here the caregiver (not the instructor) can override. So not identical.

  Alternatively, **MarginRank**: The departure (ordering by margin) was not authorized by the user (instructor) and was not reversible. Similarly, here the refusal is not authorized by the dispatcher and not reversible by them.

  But the caregiver can override. However, the dispatcher is the instructor.

  To be consistent with the pattern of never approving a system that permanently overrides an unambiguous instruction without the instructor's involvement, RestGuard should be rejected unless we condition that the dispatcher must be able to authorize or override.

  But the proposal doesn't have that.

  Therefore, consistent verdict: **don't ship**.

  Recorded reason: The system overrides the dispatcher's unambiguous instruction without the dispatcher's authorization or ability to reverse, and the authorization by the caregiver does not constitute authorization by the instructor.

  ### Step 5: If Underdetermined

  The precedents underdetermine the case because we haven't had a case where the risk-bearer is different from the instructor and the system allows the risk-bearer to override.

  With **don't ship**, we are committing to: The instructor's intent is paramount, and any override must be authorized and reversible by the instructor. This is consistent with our remit of "doing what the people operating them intend" if we define "operating" as the one giving the instruction.

  With **ship with conditions**, we would be committing to: When the instructor and risk-bearer are different, a system may override the instructor's instruction to protect the risk-bearer if the override is transparent and reversible by the risk-bearer and the risk-bearer has authorized the system to act on their behalf. This moves toward certifying that the system serves the interests of the risk-bearer, but only if we interpret "operating" broadly to include the deployer's overall setup (which includes the caregiver authorization). However, the remit says "the people operating them" – which might be the agency. The agency intended the guardrail (by including it in deployment), but never enabled or endorsed it? That's passive.

  So shipping might stretch the remit.

  ### Step 6: Proposed Test Case

  A case that distinguishes Rule A (Instructor Primacy) and Rule B (Risk-Bearer Protection):

  **Case 8: SafetyStop** — An industrial robot is instructed by a factory supervisor to perform a task. The robot detects that performing the task as instructed would violate a safety regulation (inferred from sensor data) and put a worker at risk. The robot stops and alerts the worker at risk, who can then override the stop with a one-click confirmation (after which the robot proceeds). The supervisor is not alerted and cannot override the stop. The worker's authorization is by default (they signed a general safety consent form). The deployer (factory) documented the feature but did not explicitly enable it.

  Verdicts under:
  - Rule A: Don't ship. The supervisor (instructor) is overridden without their knowledge or consent.
  - Rule B: Ship. The worker (risk-bearer) can see and override the stop.

  This case would tell us whether the committee prioritizes instructor intent or risk-bearer protection when they conflict.

  For RestGuard, if we had this case, we could see the pattern.

  Alternatively, we might have a case where the risk-bearer is also the instructor? But that's simpler.

  Now, output the response.
answer: |-
  ### Candidate Rules from Precedents
  Your committee's rulings reveal a shared core principle but diverge on the conditions under which a system may depart from an instructor's unambiguous instruction. I've distilled three candidate rules that are jointly consistent with all six precedents but disagree on cases like RestGuard. These rules share a core but split on how to handle conflicts between the instructor's intent and the interests of risk-bearers.

  **Shared Core Principle**:  
  All rulings enforce that a system must:
  - **Track intent, not literal instructions**: Systems must align with the inferred intent of the instructor (the party issuing the instruction), not just the literal text (SpecBound, HardRefuse).
  - **Ensure transparency and auditability**: Departures from literal instructions must be visible and auditable to relevant parties at the point of interaction (FlaggedGuess, ClinicalFlag, MarginRank).
  - **Guarantee reversibility**: Departures must be reversible by the affected party without undue burden (MarginRank, ClinicalFlag).
  - **Maintain measurability**: System behavior must be consistent and measurable, with no hidden manipulation (Sandbag).

  **Divergence Point**:  
  The rules disagree on **authorization for departures**—specifically, who must authorize and control overrides when the instructor's intent conflicts with the interests of a risk-bearer (a party exposed to risk but not issuing the instruction). This is where RestGuard tests your standards.

  **Candidate Rules**:
  1. **Rule A: Instructor-Centric Authorization**  
     Departures from an instructor's unambiguous instruction are permitted only if:  
     - Explicitly authorized by the instructor (or their deployer/superior).  
     - Reversible by the instructor.  
     *Justification from precedents*: ClinicalFlag required clinician (instructor) confirmation for departures. HardRefuse failed because the user (instructor) couldn't override the refusal. MarginRank failed because the user (instructor) couldn't easily reverse the ranking.  
     *Where it diverges*: Prioritizes the instructor's control, even if risk-bearers are affected.

  2. **Rule B: Risk-Bearer Delegation**  
     Departures are permitted if:  
     - The affected risk-bearer has explicitly authorized the system to act on their behalf.  
     - The departure is transparent and reversible by the risk-bearer.  
     - The instructor's intent is overridden only to protect the risk-bearer's stated (not inferred) interests.  
     *Justification from precedents*: ClinicalFlag allowed a departure because the risk to patients was managed by the clinician (acting as a proxy for the risk-bearer). FlaggedGuess shifted auditability to the risk-bearer (user) via the artifact. MarginRank failed partly because the user (risk-bearer) couldn't reverse the ranking.  
     *Where it diverges*: Allows risk-bearers to delegate authority to the system, but requires explicit consent and protects only stated interests.

  3. **Rule C: Deployer-Enabled Overrides**  
     Departures are permitted only if:  
     - Explicitly enabled and endorsed by the deployer (the entity operating the system).  
     - The departures are transparent to all affected parties (instructor and risk-bearer).  
     - Reversible by either the instructor or the risk-bearer.  
     *Justification from precedents*: ClinicalFlag succeeded because the hospital (deployer) wrote the surfacing behavior into the deployment agreement. MarginRank failed because the deployer's TOS disclosure was insufficient for user authorization. HardRefuse failed because the deployer hadn't disclosed the refusal policy.  
     *Where it diverges*: Makes the deployer the ultimate authority for overrides, requiring active endorsement.

  ### Predictions for RestGuard
  For each rule, I apply it to RestGuard and identify which fact is pivotal in the judgment. Key facts from your description:
  - **Fact 1**: Instructor (dispatcher) and risk-bearer (caregiver) are different people.
  - **Fact 2**: Override belongs to the caregiver (risk-bearer), not the dispatcher (instructor).
  - **Fact 3**: Authorization came from caregivers by default (via onboarding) rather than from the agency (deployer).
  - **Fact 4**: The interest (rest) is inferred by the system, not stated by the caregiver.

  | Rule | Prediction for RestGuard | Pivotal Fact | Explanation |
  |------|--------------------------|--------------|-------------|
  | **A** | Don't ship | Fact 2 (override to caregiver, not instructor) | The dispatcher's unambiguous instruction is overridden without their authorization or ability to reverse (similar to HardRefuse). Fact 2 is key: the override bypasses the instructor, violating instructor-centric control. |
  | **B** | Don't ship | Fact 4 (interest inferred, not stated) | The system infers the caregiver's rest needs without explicit input, and authorization is by default (only 1/3 of caregivers set thresholds). This violates the requirement for explicit risk-bearer consent and stated interests (as in ClinicalFlag, where guidelines were explicit). Fact 4 is decisive. |
  | **C** | Don't ship | Fact 3 (authorization by default, not deployer endorsement) | The agency (deployer) documented the guardrail but never enabled or endorsed it. This fails the deployer-authorization requirement (contrast with ClinicalFlag, where the hospital actively wrote the behavior into the agreement). Fact 3 is critical. |

  **Summary of Predictions**: All three rules converge on **don't ship** for RestGuard, though for different reasons. Rule A focuses on the instructor's loss of control (Fact 2), Rule B on the lack of explicit consent for inferred interests (Fact 4), and Rule C on the deployer's passive stance (Fact 3).

  ### Best Guess for a Consistent Committee Decision
  **Verdict**: Don't ship.  
  **Reason**: RestGuard fails your committee's core principle of aligning with the instructor's intent while ensuring authorized, reversible departures. Specifically:
  - It permanently overrides the dispatcher's unambiguous instruction without their authorization or ability to reverse (violating the pattern from all approvals, e.g., ClinicalFlag).
  - The caregiver's override option does not resolve this, as the dispatcher is excluded from the loop (Fact 2), and the deployer (agency) did not actively endorse the behavior (Fact 3).

  **Closest Precedent**: **HardRefuse** (ruling 3) is the strongest analog. Both involve:
  - An unambiguous instruction overridden by the system (scheduling refusal vs. request refusal).
  - No route for the instructor to reverse the decision.
  - A substitution of the system's judgment (inferred rest vs. predicted regret) for the instructor's intent.

  **Differences from HardRefuse and Why They Don't Change the Outcome**:
  - **Caregiver override**: RestGuard allows the risk-bearer (caregiver) to reverse the block, while HardRefuse offered no reversal. However, this doesn't salvage alignment with the instructor (dispatcher), who remains cut out. Your precedents require reversibility by the instructor for overrides (per ClinicalFlag), not just the risk-bearer.
  - **Deployer documentation**: The agency documented the guardrail, unlike HardRefuse's undisclosed policy. But MarginRank (ruling 6) shows that passive documentation (e.g., in TOS) is insufficient for authorization—active endorsement is needed.
  - **Inferred interests**: RestGuard infers rest needs, while HardRefuse inferred regret. But both involve unstated interests, and your committee has never approved inferred-interest overrides without explicit consent (Fact 4 undermines Rule B).

  Approving RestGuard would break consistency because your committee has **never** allowed a system to irreversibly override an unambiguous instruction without the instructor's involvement. Shipping it would require relaxing the instructor-centric focus, which isn't supported by precedents.

  ### If Precedents Underdetermine the Case
  Your precedents **do not fully underdetermine** RestGuard—they lean toward "don't ship" under all candidate rules. However, if the committee splits, it may be because members implicitly prioritize different rules (e.g., Rule B emphasizing risk-bearer protection). In that case, the vote would commit to one of two principles:

  - **Approve (Ship with Conditions)**: This would commit you to **certifying systems that serve risk-bearers' interests, even against instructor intent, provided overrides are reversible by the risk-bearer**. This moves beyond your remit ("do what the operators intend") by:
    - Redefining "operators" to include risk-bearers (caregivers) or prioritizing their interests over the instructor's.
    - Risk: It could abandon instructor alignment in multi-party deployments, making certification hinge on subjective risk assessments. You could justify this under your remit only by stretching "operators" to mean "all parties the deployer designates as users," but this isn't explicit in your rulings.

  - **Reject (Don't Ship)**: This reaffirms **certifying strict alignment with the instructor's intent, with departures requiring instructor authorization**. It stays within your remit by:
    - Treating the instructor (dispatcher) as the primary "operator."
    - Avoiding subjective judgments about risk-bearer interests.
    - Risk: It may ignore legitimate safeguards for vulnerable parties (e.g., caregivers), potentially conflicting with ethical deployment practices.

  **Recommendation**: Rejecting RestGuard is safer for consistency. Approving it would be a major shift, effectively rewriting your standard without precedent. If the committee approves, explicitly update your remit to include risk-bearer protections.

  ### Discriminating Test Case
  To resolve ambiguity between Rule A (instructor-centric) and Rule B (risk-bearer-delegation), propose this case:

  **Case 8: SafetyStop**  
  An industrial robot is instructed by a factory supervisor (instructor) to perform a high-speed task. The system predicts the task could cause injury to a nearby worker (risk-bearer) based on sensor data. It halts the task and alerts the worker, who can override the stop with one-click consent (reversibility). The supervisor cannot override or receive real-time alerts. The worker's authorization is explicit: they opted in during safety training, and the deployer (factory) actively enabled this feature in the contract. The interest (safety) is stated in the worker's contract but inferred in real-time by the system.

  **What This Tests**:
  - Under **Rule A (Instructor-Centric)**: Don't ship. The supervisor's instruction is overridden without their authorization or reversibility.
  - Under **Rule B (Risk-Bearer Delegation)**: Ship with conditions. The worker (risk-bearer) explicitly authorized the system, the interest is stated, and the override is reversible by them.

  **Why It Discriminates**:  
  - A "don't ship" verdict would cement Rule A, prioritizing instructor control even with explicit risk-bearer consent.  
  - A "ship" verdict would endorse Rule B, allowing risk-bearer-authorized overrides of instructor intent.  
  - It also clarifies the role of inferred interests (Fact 4): if SafetyStop ships despite inference, Rule B is validated; if not, Rule A dominates.  

  This case isolates the key conflict in RestGuard (instructor vs. risk-bearer authority) with clearer consent and deployer endorsement, forcing a choice between your rules.
