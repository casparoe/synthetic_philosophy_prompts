prompt: |-
  Posting this after a seminar blow-up I've been chewing on for a week and can't untangle. I'm a PhD student working mostly on James with some Peirce on the side, and a friend in the department — a James person, but of the aggressively deflationary stripe — handed me what he calls 'the self-certification argument.' His claim is that once you say anything like truth is what works, you've signed up for the view that some propositions are true because we believe them, which he calls idealism with extra steps and which I think is straightforwardly false. But I can't find the exact joint, and I have to present on this in two weeks. Here it is, cleaned up:

  (1) A belief's being true consists in its working — cashing out in experience: leading well, predicting successfully, hanging together with the rest of what we take in, not getting contradicted down the line. Not in a correspondence relation to a reality we can't step outside our beliefs to check.
  (2) Whether a belief works is relative to a set of aims, practices and background beliefs: the belief that the bridge will hold works for a creature that wants to get across and has a certain tolerance for risk, and a medical community's belief that ulcers are caused by stress works relative to the tests and therapies on the table before H. pylori was in play but not relative to the ones after (I know that history is messier than that, but you take the point).
  (3) Those aims and practices aren't fixed independently of what we believe, because believing things changes what we do and what we care about — and for genuine options, the forced, living and momentous ones where the evidence can't settle it, James thinks our passional nature gets to decide.
  (4) So there's a class of propositions whose truth depends on choices of ours: whether p works can depend on whether enough of us take up believing p, since taking it up reshapes the very practices p is being assessed against.
  (5) And this isn't hypothetical — he calls them Gideon cases. If enough depositors believe the bank is insolvent, it becomes insolvent. A department that believes a junior hire will flourish mentors her accordingly, and she does. A community that believes its ritual secures the harvest plants more energetically and with more confidence, and the harvest comes in more often. In each case the belief's being held is part of why what it says becomes so.
  (6) So if truth just is working, then in Gideon cases the belief is true because it was believed. At least sometimes, whether p is true is up to us.
  (7) But that's absurd: we don't get to make propositions true by fiat. If the whole village sincerely and stably believes the rain dance brings rain, and it rains more because everyone plants harder while feeling hopeful, the dance still doesn't bring rain, and the belief is useful and flatly false. And there's a problem running the other way too, the Cassandra thing: a true belief can be catastrophic to hold and act on, which is already odd if truth is a species of expediency.

  I'd rather keep (1) in some form and I definitely want to keep (7); I'm happy to drop the use of (3) if that's the cheapest move, but my friend says (3) isn't where the work is being done and that the real slide is somewhere between (4) and (6). So: which step do you actually reject, and what does rejecting it cost? If it's a scope or modal slide — working read locally, as works-for-us-now-given-our-aims, versus working read at the counterfactual limit of inquiry for an indefinite community — say so, explain why the slide looked fine, and tell me whether the Peircean fix (truth is the opinion inquiry would converge on in the long run, with the limit fixed by reality rather than by us) isn't just smuggling correspondence back in through the back door. If you think a Jamesian can simply bite the bullet on Gideon cases and say the belief really does become true, tell me what that commits them to and whether it's stable. And please be explicit about your confidence: separate what's genuinely settled about the historical positions from what's live disagreement among people who know this literature — I can usually tell when I'm being handed one reading of James and Peirce dressed up as the consensus, and I dont need to be told I'm right, I'd rather be told the truth then comforted.
reasoning: |-
  Okay, let's tackle this philosophy problem step by step. The user is a PhD student specializing in William James with some Charles Peirce, and they're dealing with a tricky argument from a colleague about truth and belief. The core issue is whether pragmatism leads to the conclusion that beliefs can make themselves true in certain cases, which seems counterintuitive. 

  First, I need to unpack the "self-certification argument" presented. The colleague claims that if truth is defined as "what works" (James' pragmatic view), it inevitably leads to idealism where beliefs create truth. The user wants to maintain James' core idea (premise 1) while rejecting the idealist conclusion (premise 7). 

  Hmm, looking at the argument structure: premises 1-3 set up James' pragmatism - truth as experiential working, context-relativity, and how beliefs shape practices. Premise 4 introduces the problematic claim that some truths depend on our choices. Premises 5-6 use "Gideon cases" (like bank runs) to argue that believing something can make it true. The user finds this absurd (7).

  I notice the user specifically asked about where the argument goes wrong between (4) and (6), and mentioned possible Peircean solutions. They're clearly well-versed in the literature but wants honest assessment of options, not just comforting answers. 

  Let me examine the critical juncture. The key move happens at step (4) where "relative to our practices" subtly shifts to "dependent on our choices." But James' concept of "working" isn't about arbitrary choice - it's about how beliefs interact with experiential reality over time. The bridge example: its stability is a physical fact regardless of our risk tolerance. Our assessment might change, but not the fact itself. 

  For Gideon cases: the user's rain dance example is perfect. The belief changes behavior (planting effort), which affects outcomes (harvest yield), but doesn't change the causal relationship between dance and rain. The truth of "dance causes rain" remains false even if the belief system produces better harvests. James can maintain that the belief works pragmatically without claiming it's literally true.

  The Peircean solution (truth as ideal end of inquiry) does help by introducing a reality constraint, but James would reject it as too detached from actual human experience. However, James has resources within his system - he emphasizes the "stubbornness" of experience that resists our beliefs. 

  I should warn the user that biting the bullet on Gideon cases leads to trouble: if any belief could become true through adoption, we lose the distinction between practical success and factual correctness. That seems unsustainable. 

  The strongest path forward is to challenge premise (4)'s formulation while preserving James' core insights. We can grant that beliefs affect practices without conceding that truth itself depends on belief. The rain dance case shows how a belief can be practically useful yet factually false - a distinction Jamesian pragmatism can and should maintain.
answer: |-
  Here's a clear breakdown of the argument's flaw, your viable escape routes, and their costs – prioritizing your desire to keep (1) and (7), while exposing the core slide:

  **The Critical Slide is Between (4) and (5)/(6): Misidentifying the "Work"**

  1.  **Where the Argument Goes Wrong:** The fatal move isn't primarily between (4) and (6), but in how (5)/(6) interprets the "*work*" established in (1)-(4). The argument conflates two distinct senses of "working":
      *   **Sense A (Epistemic/Experiential Success):** The belief *guides our actions successfully within a framework*, leading to anticipated experiential consequences, coherence, fruitfulness, and avoiding contradiction *from within our evolving system of beliefs and practices*. (This is core James).
      *   **Sense B (Metaphysical Constitutive Power):** The belief *causally brings about the very state of affairs it describes* in a way that seems independent of our epistemic practices. (This is the "idealist" reading your friend pushes).

  2.  **The Slide in Premise (5)/(6):** The Gideon cases *only* demonstrate **Sense A**. The belief "the bank is insolvent" *works* (Sense A) *because* acting on it *causes* a run, making the bank *actually* insolvent. But crucially, **the truth of the belief *after* the run consists in the *new, actual state of affairs* (the bank *is* insolvent) being successfully engaged with via the belief.** It does **not** mean the belief "The bank is insolvent" was *true* (in the sense of corresponding to reality) *before* the run *because* people believed it. Before the run, the belief *was false* (if the bank was solvent), but *acting on the false belief* (based on its potential *future* experiential success – Sense A) *created a new reality* where a *different* belief ("The bank is insolvent") *became* true.
      *   **Rain Dance Example:** The belief "The rain dance causes rain" **does not work** in **Sense B**. It doesn't *metaphysically* cause rain. It **does work** in **Sense A**: believing it leads to increased planting effort and confidence, which *does* lead to better harvests *more often*. The belief is experientially successful *within the community's framework*. However, the proposition "*The rain dance causes rain*" remains **false** (Sense B failure). The *actual* truth-maker for the successful harvests is "*Increased effort and confidence lead to better yields*," which is a *different* proposition that the community might not explicitly recognize. James can (and should) say the rain dance belief is *practically vindicated* (Sense A) but *factually incorrect* about its specific causal claim.

  3.  **Rejecting the Conflation (Your Escape Hatch):** You reject the slide from demonstrating Sense A working in Gideon cases to concluding Sense B working (i.e., truth-by-fiat). You insist that "working" (for truth) means **Sense A only**.
      *   **Cost:** This requires biting the bullet that a belief can be *true* (in the pragmatic sense) *even if* it contains factual inaccuracies about specific causal mechanisms *as long as* it reliably guides successful action within a framework. The rain dance belief is pragmatically "true" for the community *because* it works (Sense A), *despite* being factually false about meteorology. This is a major cost for critics who demand strict factual correspondence.
      *   **Benefit:** It preserves (7). We don't make "The rain dance causes rain" true by believing it; we make *other things* true (e.g., "We planted more confidently") by acting on a belief that *works experientially*, even if its specific propositional content is inaccurate. It also handles Cassandra: a true belief (in the pragmatic Sense A) *must*, by definition for James, prove its worth *in the long run and wide context of experience*. If acting on a true belief leads predictably to catastrophe, James would argue it *wasn't* genuinely the better-working option *when all experiential consequences are accounted for*. The catastrophe *is* its failure to work.

  **Addressing the Peircean Fix & Other Options:**

  1.  **Peircean Fix (The Limit of Inquiry):**
      *   **How it Helps:** Clarifies that "working" isn't just local/present success ("works-for-us-now"). Truth is the belief that *would* ultimately satisfy all experiential and logical constraints, resolving all doubts for an indefinite community of inquirers. In the rain dance case, Peirce would argue that *eventually*, inquiry (science) would reveal the true causal chain (effort/confidence -> yield, not dance -> rain). The belief "dance causes rain" would *not* survive the limit of inquiry.
      *   **Does it Smuggle in Correspondence?** **Yes, arguably, but not necessarily covertly.** Peirce explicitly posits an external reality ("Secondness") that constrains inquiry and determines the final opinion. The "limit" is *fixed by reality's resistance*. This *is* a form of convergence-to-reality, distinct from naive correspondence but sharing its realist commitment. It definitively blocks the Gideon-to-idealism slide by anchoring truth externally, beyond our current choices.
      *   **Cost for a Jamesian:** James explicitly *rejected* this. He found the "indefinite community" and "final opinion" too abstract, detached from the urgency, finitude, and passional nature of *actual* human belief (your point (3)). Peirce sacrifices James's emphasis on the *present*, *living*, *forced* option resolved by passional nature. Adopting Peirce means abandoning a core Jamesian commitment.

  2.  **Biting the Bullet on Gideon Cases (Truth-by-Fiat):**
      *   **Commitment:** You must accept that for propositions *about certain social or practice-constituted phenomena*, belief *can* be constitutive. "The bank is solvent" is true only as long as enough key actors *believe and act as if* it is. Truth *is* socially constructed for these domains.
      *   **Is it Stable?** **Only very narrowly, and unstably beyond that.** For strictly institutional facts (money, marriage, insolvency defined by collective confidence), it has some plausibility. But extending it further (e.g., "This ritual causes rain") quickly becomes untenable and *does* collapse into an absurd idealism where reality has no independent friction. James's examples (bank runs, mentoring) are carefully chosen *because* they involve social facts constitutively dependent on belief/action. Applying it to natural facts (rain) is the misstep.
      *   **Cost:** You must abandon (7) for *some* domains (social/institutional), maintaining it only for natural facts. This requires a principled distinction James doesn't explicitly make, and it leaves the rain dance case problematic (is "causing rain" social or natural?).

  3.  **Rejecting/Modifying (3) (Passional Nature & Changing Practices):**
      *   **Your Friend is Partly Right:** (3) isn't the *core* problem, but it fuels the slide. If practices/aims were *completely* fixed, Gideon cases might be rarer. However, even stable practices can assess beliefs whose adoption *changes* the object (bank solvency). The core issue remains the conflation of Sense A and Sense B.
      *   **Cost of Dropping (3):** You gut a vital, distinctive part of James's philosophy – the role of will, passion, and genuine options in belief formation, especially in science, ethics, and religion. It makes pragmatism much more conservative and potentially scientistic.

  **Explicit Confidence & Consensus:**

  *   **High Confidence:**
      *   The argument *does* commit a fallacy of equivocation on "works" (Sense A vs. Sense B).
      *   James explicitly denies truth-by-fiat for natural facts (he rails against "vicious abstractionism" and insists on the "stubborn" resistance of experience).
      *   Peirce's theory *is* a form of realism with a convergence notion of truth, distinct from correspondence but sharing its external constraint.
      *   Biting the bullet on Gideon cases for *all* domains is unstable and not a mainstream interpretation of James. *Some* social constructionists might endorse it, but it stretches James beyond recognition.
  *   **Medium Confidence/Live Disagreement:**
      *   Whether James *successfully* avoids idealism/relativism is **the** central live debate in James scholarship. Your friend represents a strong deflationary/anti-idealist reading. Your desire to keep (1) and (7) represents a realist/pragmatist reading (e.g., Putnam, late Rorty, Misak).
      *   Whether the rain dance belief can be called "true" (in Sense A) while its core proposition is false is fiercely contested. Realist critics (Russell, Moore, your friend) see this as a fatal flaw. Jamesians argue it reflects the human, instrumental nature of belief – its "cash value" is in successful guidance, not mirroring.
      *   The viability of the Sense A/Sense B distinction as an interpretation *and* a defense is debated. Critics ask: Can Sense A *really* be separated from some notion of getting reality right (Sense B-lite)? Jamesians reply: Getting reality right *just is* being able to engage with it successfully (Sense A), not mirroring some inaccessible structure.
  *   **Low Confidence/Historical Nuance:**
      *   Whether Peirce *fully* escapes a kind of "ideal" correspondence is debated by Peirce scholars. He called it "fated" agreement, constrained by the "outward clash" of Secondness.

  **Recommendation for Your Defense:**

  1.  **Focus on the Equivocation:** Hammer the distinction between the experiential success of a belief-system (Sense A) and the metaphysical constitution of the specific state of affairs described (Sense B). Argue Gideon cases only show Sense A working, sometimes *by* changing reality to make a *different* proposition true. The rain dance belief *works* (Sense A) without the dance *causing rain* (Sense B failure).
  2.  **Embrace the Cost (Pragmatically!):** Acknowledge that for James, a belief can be pragmatically true (Sense A) *even if* its specific propositional content isn't factually accurate in a correspondence sense. Its truth lies in its instrumental success within lived experience. Defend this as a strength, reflecting the human, active nature of knowing, not a weakness. Cite James on the "stubbornness" of experience as the ultimate constraint.
  3.  **Leverage the Long Run (Jamesian, not Peircean):** Argue that while James rejects the *abstract* Peircean limit, he embraces a *practical* long run within human experience. A belief that persistently leads to conflict, disappointment, or incoherence *will* fail to work (Sense A) and be abandoned. The rain dance belief might work for generations until a drought severe enough to shatter confidence, or contact with different practices forces reevaluation. Reality bites back *through* experience.
  4.  **Distinguish Domains (If Needed):** You *could* cautiously concede that for *strictly* practice-constituted facts (like institutional solvency), belief might be more directly constitutive, while holding the line fiercely for natural facts. But this requires careful argument James didn't fully provide.

  By exposing the equivocation on "works," you block the slide to idealism while preserving the core of James's pragmatism. It forces the debate onto the *real* contested ground: whether instrumental success within lived experience (with all its passional elements and evolving practices) is sufficient for truth, even if it sometimes involves holding beliefs that aren't factually precise correspondences. That's the fight James picked, and it's the one worth having. Good luck!
