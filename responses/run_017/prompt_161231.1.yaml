  Hmm, the professor has already done smart groundwork by using Typogenetics_0 – a stripped-down system without arithmetic or variables, where the only "conditional" is search-and-halt. That forces students to confront the machinery head-on. The key is crafting a question that makes them articulate why self-replicating strands are more like quines (outputting their own code) than Gödel sentences (asserting their own unprovability).

  I'm imagining a question with three thrusts: 
  First, force the DNA/Gödel analogy dissection – where the substrate/enzyme duality genuinely mirrors arithmetization (collapse of object/syntax), and where it fails (no internal truth conditions). 
  Second, make them distinguish Kleene's fixed points (causal) from Gödel's (semantic). 
  Third, have them theorize what Typogenetics_0 would need to support real diagonalization – maybe by using search-and-halt as a primitive "falsity predicate" or showing why it can't capture negation.

  Biggest trap to avoid: letting students regurgitate "code describes machinery = Gödel sentence." Need to block that by focusing on aboutness. A strand in Typogenetics_0 doesn't represent anything; its "meaning" is externally imposed by translation rules. Whereas a Gödel sentence genuinely refers to itself via arithmetization.

  For the marking scheme, I'll weight heavily: 
  - Clear distinction of fixed-point types (4 marks) 
  - Arithmetization parallel vs. breakdown (4 marks) 
  - Analysis of search-and-halt's limitations (5 marks) 
  - Universality implications (3 marks) 
  - Nuanced isomorphism verdict (4 marks)

  The A/B divider should hinge on whether they realize search-and-halt can't simulate negation properly – that's where the diagonalization attempt collapses. B answers might correctly contrast causal/semantic fixed points but miss why Typogenetics_0 can't bridge the gap.

  *adjusting glasses* Time to draft. The question must feel like unpacking a Matryoshka doll: outer layer (analogy), middle (formal distinction), core (minimal conditions for diagonalization). And no enzyme-table memorization!
answer: |-
  ### Exam Question  
  **Block D: Typogenetics_0 and Self-Reference**  
  In *Gödel, Escher, Bach*, Hofstadter claims DNA and Gödel numbering share a "deep isomorphism" because both systems enable self-reference through encoding. In Typogenetics_0 (as stipulated above), a self-replicating strand *S* is defined causally: when translated and executed, *S*’s enzyme produces a copy of *S* itself.  

  **Question:**  
  Critically evaluate Hofstadter’s isomorphism claim by answering the following:  
  1. What is the precise formal analogue of a Typogenetics_0 self-replicating strand in computability theory? Distinguish it clearly from a Gödel sentence.  
  2. Explain what minimal property or primitive *must* be added to Typogenetics_0 (or proven about it) to enable the construction of a true "diagonal" fixed point (like a Gödel sentence) rather than a purely causal one. Focus on the role of the `search`-and-halt primitive and the system’s lack of truth-conditions.  
  3. Where does the DNA–Gödel isomorphism genuinely hold, and where does it break down? Address how arithmetisation’s dual use of numbers (as objects *and* syntax) compares to Typogenetics_0’s treatment of strands.  

  *(Answers should engage the stipulated Typogenetics_0 system. No enzyme-table recall is expected.)*  

  ---

  ### Model Answer (704 words)  
  The formal analogue of a Typogenetics_0 self-replicating strand is a **quine**: a program that outputs its own source code. This is a causal fixed point of Kleene’s recursion theorem, where a program *P* computes the function *f* such that *f(P) = P*. Crucially, this requires no semantic content: *P* need not "describe" itself; it merely induces machinery to copy it. A Gödel sentence *G*, conversely, is a diagonal fixed point. It encodes the statement "I am unprovable," constructed by arithmetising syntax so that *G*’s Gödel number *n* satisfies *Prov(n) ⇔ ¬G*, where *Prov* is a formalised provability predicate. *G*’s power derives from *truth-conditions*: it *predicates* unprovability of its own encoding.  

  Typogenetics_0 lacks the machinery for such diagonalisation. Its self-replicating strands are quines because:  
  - **No intrinsic aboutness**: Strands gain "meaning" only extrinsically via translation rules. A strand acting as a program directs enzyme actions but does not *assert* properties about itself or other strands.  
  - **No negation or variables**: The `search`-and-halt primitive halts execution if a symbol is absent but cannot express *falsity* as a generalisable condition. For example, a strand cannot define a predicate like "is not replicable" because halting only aborts an enzyme’s operation locally; it cannot output a universal proposition.  
  - **Causal closure**: Enzymes manipulate strands physically (copy, cut, insert), but no operation interprets a strand *as* a statement.  

  To support Gödel-like diagonalisation, Typogenetics_0 would need **representational capacity**: the ability for strands to encode *predicates* about strand properties (e.g., "is a valid program" or "does not replicate"). This requires:  
  1. **Arithmetisation analogue**: A way to map strands *to* the operations they describe (e.g., a strand’s sequence encodes both enzyme actions *and* arguments for those actions). Typogenetics_0 partially achieves this via dual use (strands as program/substrate/template), but this is causal, not representational.  
  2. **Truth-conditional primitives**: The `search`-and-halt could *partially* simulate negation (e.g., "halt if no C exists" implies "C is absent here"), but this cannot scale to universal quantification. Adding a primitive like `assert_false(S)` that outputs a strand *only if* enzyme *S* fails to replicate would enable predicate-level negation.  
  3. **Universal interpreter**: Proof that Typogenetics_0 is Turing-complete would imply it can simulate its own interpreter, enabling self-referential predicates. Without this, diagonalisation is impossible.  

  The isomorphism holds **structurally** in the collapse of object/machine duality:  
  - **DNA/cell mirror arithmetisation**: Just as Gödel numbers blur data/program (a number encodes a formula *and* is manipulated by arithmetic operations), a Typogenetics_0 strand is both data (substrate) and machine (program). This duality enables self-application: a strand can encode an enzyme that acts on itself.  
  - **Gödel numbering’s core insight**: Syntax as mathematics enables self-reference. Similarly, DNA’s chemical encoding allows it to describe the machinery (ribosomes) that reads it.  

  The isomorphism breaks **semantically**:  
  - **No truth in typogenetics**: DNA replication is a causal process; a strand doesn’t "claim" anything. A Gödel sentence *G* is true but unprovable; its power lies in *correspondence* between formal provability and metatheoretic truth. Typogenetics_0 has no truth predicate—only halting conditions for enzymes.  
  - **External vs. internal semantics**: Arithmetisation internalises meaning (e.g., *Prov(x)* is defined *within* the system). In Typogenetics_0, "meaning" is imposed by external translation rules. A strand’s "self-description" is metaphorical; it causes replication but does not *represent* it.  

  Hofstadter’s analogy thus captures self-application’s mechanics but overreaches on meaning. Self-replication is Kleene’s theorem (causal fixed points); unprovability requires Tarski’s truth (semantic diagonalisation). The `search`-and-halt primitive edges toward detection of absence but cannot bootstrap truth without universality and explicit predication.  

  ---

  ### Marking Scheme (20 points)  
  **Must-hit moves** (marks deducted per miss):  
  1. **Distinguish quine vs. Gödel sentence** (4 pts):  
     - *Quine*: Fixed point outputting own code (causal, no semantics).  
     - *Gödel sentence*: Fixed point against predicate (e.g., unprovability), requiring truth-conditions.  
     *Common miss: Conflates both as "self-referential" without contrasting causal vs. semantic.*  
  2. **Identify minimal addition for diagonalisation** (5 pts):  
     - Need for representational capacity (predicates/truth-conditions), e.g., via arithmetisation analogue + negation/universal quantifier.  
     - Critical analysis of `search`-and-halt: Can detect local absence but not global falsity.  
     *Common miss: Suggests "add negation" without explaining why halting ≠ logical negation.*  
  3. **Articulate isomorphism’s validity/breakdown** (4 pts):  
     - *Holds*: Object/machine duality (strands as data/program ≈ numbers as syntax/objects).  
     - *Breaks*: Lack of intrinsic truth-conditions; external semantics.  
     *Common miss: Only discusses similarity ("both encode") without addressing truth.*  
  4. **Role of universality** (3 pts):  
     - Notes that proving Typogenetics_0 Turing-complete would imply diagonalisation *possible* (via interpreter simulation), but not that it *exists*.  
     *Common miss: Assumes universality is necessary/sufficient without nuance.*  
  5. **Refute "DNA = Gödel number" reduction** (4 pts):  
     - Emphasizes self-replication ≠ self-predication; isomorphism is structural, not semantic.  
     *Common miss: Repeats Hofstadter’s analogy uncritically.*  

  **A (17–20) vs. B (13–16) Divide**:  
  - **A answer**: Hits all 5 moves *and* explicitly ties the `search`-and-halt primitive’s limitations to the impossibility of internal truth-conditions (e.g., "halting cannot express ¬P for arbitrary predicates").  
  - **B answer**: Correctly contrasts causal/diagonal fixed points and identifies isomorphism breakdowns but misses why search-and-halt fails to simulate logical negation or how arithmetisation internalises semantics.  

  ---  
  This question forces computer-science-oriented students to grapple with truth-conditions (philosophy’s domain) and philosophy-oriented students to engage formal primitives (CS’s domain). By centering on minimal extensions to Typogenetics_0, it blocks rote analogy while testing deep synthesis.
