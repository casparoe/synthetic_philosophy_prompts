answer: |-
  Here is a reconstructed implicit theory of contemporary pictogram-based public information design, addressing your specific questions:

  **Implicit Theory of Pictogram Practice (Reconstructed Claims):**

  1.  **Pictorial Content is Non-Identical to Verbal Content:** What a picture conveys cannot be *fully* or *without remainder* translated into sentences. Pictorial content is distinct, potentially less inferentially articulated (less amenable to direct logical manipulation like deduction from premises), and grasped more holistically/intuitively.
      *   **Status:** Strictly presupposed by the *very existence* of the practice (why use pictures if words suffice?). Reinforced by the reliance on illustrations for non-readers and the belief in "immediacy."

  2.  **Pictures Offer Immediacy & Universal Access:** Pictorial content can be grasped faster, with less cognitive load, and potentially across language barriers, compared to verbal equivalents. This immediacy is often assumed to be innate or near-universal.
      *   **Status:** Strictly presupposed by the *core justification* for icon-only toolbars, signage in transit hubs, and hazard symbols aiming for instant recognition. Drives the removal of text in primary visual fields.

  3.  **Pictorial Meaning is Largely Conventional & Learned:** Despite claims of immediacy, the *specific* meaning of symbols is not innate but culturally acquired and context-dependent. Understanding requires familiarity with the convention.
      *   **Status:** Strictly presupposed by the *comprehension testing and redesign process*. Withdrawing/reworking failed symbols explicitly acknowledges meaning isn't transparent but must be learned.

  4.  **Pictograms Have Severely Limited Semantic Range:** Pictorial representation is fundamentally suited only for a narrow band of content: concrete objects, simple actions, directions, quantities (via repetition), basic prohibitions, and stereotyped states. It struggles with abstraction, logic (conditionals, scope, complex negation), modality, quantification, and uncertainty.
      *   **Status:** Strictly presupposed by the *observed practice* – the content *actually conveyed* by pictograms universally falls within this narrow band. Designers implicitly accept these limits when choosing what to depict pictorially vs. verbally.

  5.  **Verbal Language is Semantically Foundational:** Pictures require verbal anchoring for precise, unambiguous meaning, especially for complex, abstract, or safety-critical information. Pictures alone are insufficient.
      *   **Status:** Strictly presupposed by the *mandatory pairing of words* (captions, hazard statements, signal words, hover labels). Neurath's captioning practice embodies this. This conflicts with Claim 2's "immediacy/universality" but overrides it in practice.

  6.  **Pictures are Pedagogical/Communicative Aids, Not Evidence:** The primary function is efficient communication and pedagogy, *not* serving as foundational evidence or rigorous data presentation. Their simplification and rounding are features, not bugs, for this purpose.
      *   **Status:** Strictly presupposed by the *design choices*: aggressive rounding, elimination of detail, repetition over scaling, focus on comparison over exactitude.

  **Addressing the Neurathian Tension (Q4):**
  The tension between the pedagogical aim (making social facts "evident to the eye") and anti-foundationalist epistemology is **only apparent** within the practice's implicit theory. Here's why:
  *   **"Evident to the Eye" ≠ The Given:** The practice presupposes (Claims 3 & 5) that this "evidentness" is the result of *prior learning* (visual education) and relies on *conventional symbols*. It's not a raw, pre-conceptual "given." The reader *interprets* the conventional sign, it's not passively received sense-data.
  *   **Pedagogical Aid ≠ Epistemic Foundation:** The picture is explicitly an *aid* (Claim 6), a tool for communication and teaching. Its purpose is to efficiently convey a pre-existing, verbally articulable *claim* (often stated in the caption). The "fact" it makes evident is the *comparison or state* described verbally; the picture serves as a mnemonic or intuitive illustration. Nothing epistemically "rests on" the picture *alone*; its authority derives from its connection to the verbal claim and its function within the communicative/educational context. Neurath's sailors are using a *tool* (the pictogram system) they built and maintain, not grounding their ship on a sensory bedrock.

  **Addressing Underdetermination & Compatibility (Q5):**
  The practice is **philosophically underdetermined** in key aspects:
  *   **Nature of Pictorial Content:** The practice is compatible with both:
      *   A **Moderate Non-Propositionalism** (Claim 1): Pictures convey non-propositional content that *can* support propositional inferences but isn't *itself* propositional.
      *   A **Compressed Propositionalism:** Pictures are a highly efficient, perceptually optimized way of presenting propositional content (the "bundle of assertions" view). The practice *works* under either view.
  *   **Source of "Immediacy":** The practice is compatible with explanations for the perceived speed/ease of understanding rooted in:
      *   **Conventionalism + Familiarity:** Speed comes from learned associations (Claim 3).
      *   **Cognitive Psychology:** Parallel processing, pattern recognition, memory advantages for images over text.
      *   **Reduced Parsing:** Avoiding syntactic decoding needed for language.
      *   The practice *strictly requires* that pictures *are* faster/easier *in specific contexts* (justifying their use), but the *explanation* for *why* is underdetermined.
  *   **Scope of Conventionalism:** While Claim 3 (necessity of learning) is strict, the *degree* of conventionality vs. iconicity/resemblance for *specific symbols* is an empirical matter accommodated by the testing process.

  **What the Practice Strictly Requires:**
  1.  Pictures are distinct from and not fully reducible to words in their communicative function (Claim 1).
  2.  Pictures offer a practical advantage in speed/ease for specific tasks (Claim 2 - though the *reason* is underdetermined).
  3.  Specific pictogram meanings must be learned and are conventional (Claim 3).
  4.  Pictures are semantically limited (Claim 4).
  5.  Words are necessary for precision and anchoring, especially beyond basic content (Claim 5).
  6.  The primary role is pedagogical/communicative simplification, not rigorous evidence (Claim 6).

  **Replacement Scenarios (Q6):**

  **Scenario 1: Embracing Deflationary/Compressed Propositionalism (Charts as Assertion-Bundles):**
  Designers would have to give up:
  *   **Rounded Magnitudes:** Exact quantities would be mandatory, eliminating Neurathian repetition/rounding. Charts would need precise scales/numerical labels.
  *   **Omitted Uncertainty:** Any uncertainty (measurement error, sampling bias) would need explicit pictorial or (more likely) verbal representation.
  *   **Lack of Sources:** Charts would require citations or source indications.
  *   **"Immediacy" as Primary Justification:** The justification would shift to efficient presentation of *propositions*, not non-verbal intuition. Icon-only interfaces would become harder to justify for complex functions.
  *   **Non-Verbal Interchangeability:** The pretense that a chart is *interchangeable* with a table for a non-literate viewer would vanish. Its value would be in efficient propositional presentation to those who *can* decode the notation.
  *   **Resistance to Complex Content:** Attempts to pictorially represent conditionals, modalities, or nuanced comparisons would increase, though likely still constrained by practical cognition.

  **Scenario 2: Embracing Strong Non-Propositionalism (Irreducible Pictorial Content):**
  Designers would have to stop pretending:
  *   **Verbal Equivalence:** That a pictogram or chart *says the same thing* as its caption or verbal description. They would acknowledge the caption captures *some* of the content, but not the unique, non-propositional residue.
  *   **Full Interchangeability with Tables/Text:** That a purely pictorial presentation is semantically equivalent to a tabular or textual presentation of the "same" information for all purposes. Its unique contribution would be emphasized.
  *   **Strict Accountability to Propositional Standards:** That pictorial representations can or should be judged *solely* by the standards of propositional truth/falsity, precision, and inferential articulation. Aesthetics, evocative power, and unique perceptual insights might gain legitimacy.
  *   **The Universality of "Reading":** That understanding a pictogram is fundamentally the same cognitive act as reading a sentence. Different cognitive faculties might be emphasized.
  *   **The Primacy of the Caption's Meaning:** The verbal caption would be seen as *one interpretation* or *one facet* of the picture's meaning, not its exhaustive definition. More ambiguity in pictorial meaning might be tolerated or even embraced. The mandatory pairing (Claim 5) might weaken for certain non-safety contexts, relying more on context and the unique pictorial content.
