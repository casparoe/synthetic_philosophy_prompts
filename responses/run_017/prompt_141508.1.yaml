  The stale-beer fug of the Greyhound Glory clubhouse clung to Arnie like a second cardigan. He squinted at the smudged odds on the tote board, the familiar calculus humming in his brain – risk, reward, probability, the comforting machinery of fairness. Retirement hadn’t dulled it; it just redirected the output towards pints of cheap lager, earned settling wagers for the track’s hopeful and hopeless.

  **Monday:** Mick, perpetually red-faced and clutching a sausage roll, wanted £20 on *Whippet Wonder* to win the 3:15. Odds: 3/1. Arnie crunched. *Whippet Wonder* had form, decent starting position. "Fair shake, Mick," Arnie rasped, scribbling the ticket. "Win pays sixty."

  **Tuesday:** Old Vera, fingers stained with nicotine, slid a crumpled fiver across the sticky table. "Place bet, Arnie. *Silver Streak* in the fifth. Each way, mind." *Silver Streak* was 10/1 to win, 1/4 odds for place (top two). Vera wanted £5 each way – £10 total. Win paid £55, place paid £12.50. "Place money's thin, Vera," Arnie warned. "But odds are fair for the ask." He took the bet.

  **Wednesday:** Young Lenny, eyes wide with a system only he understood, proposed a complex hedge. "See, Arnie, I reckon *Gambler’s Ghost* either wins *or* finishes dead last in the 4:45. Nobody middle!" He offered £15 on *Ghost* to win (5/1), and £10 on *Ghost* to finish last (a longshot, Arnie offered 8/1). "Covers your extremes, Lenny," Arnie mused. Win bet paid £75, last-place bet paid £80. Individually, each felt like a reasonable price for the unlikely outcome Lenny stipulated. "Alright, lad. Written down."

  **Thursday:** Shifty Ron, smelling of cheap cigars, sidled up. "Heard you take the tricky ones, Arnie. Fancy a novelty? I bet you £5 *even money* that *Fast Eddie* doesn't finish *exactly* third in the 2:30." Arnie frowned. *Fast Eddie* was erratic. Finishing exactly third? Low probability. But *even money* against it happening? If Eddie finished anywhere *but* third, Ron paid Arnie £5. If Eddie miraculously *did* finish third, Arnie paid Ron £5. On its own, against the likely outcome? "Seems fair weighted my way, Ron," Arnie conceded, taking the fiver. "But you're daft."

  **Friday:** The air crackled before the last race. Bertie "The Book" Benson, a relic who smelled of mothballs and disappointment, tapped Arnie's ledger. "One for the purist, Arn. Ninth race. I bet you £100, at 1/1 odds, that the ninth dog to finish *isn't* wearing the blue jacket."

  Arnie stared. The ninth dog? In a twelve-dog race? It was utterly random, impossible to predict or influence. Exactly 50/50 chance any given jacket colour *wasn't* on the ninth dog. "Even money? For *that*?" Arnie scoffed. "Bertie, that's just... arithmetic."

  "Arithmetic pays bills, Arn. Fair odds, ain't they? You said so yourself. Flip a coin. Blue jacket not on ninth dog? Pays £100. Any other outcome? I pay you £100. Pure chance."

  It *was* fair. Objectively. But a cold dread, unfamiliar and unwelcome, began to prickle Arnie’s spine. *Ninth dog*. The sheer, indifferent randomness of it felt... infinite. He was seventy-two. How many races did he have left? How many *ninth dogs*? Could he *ever* settle this bet definitively? The odds were fair *now*, for *this* bet... but the settling stretched into a foggy, uncertain future he wouldn't see the end of.

  He took the bet, grumbling about "Bertie's bloody statistics," but the unease lingered.

  Saturday morning, nursing a lukewarm tea, Arnie laid out his ledger. The week's bets, like scattered puzzle pieces. He started combining them, his underwriter's brain instinctively mapping contingencies. *Whippet Wonder* wins... pays Mick, good. *Silver Streak* places... pays Vera, fine. Lenny's *Ghost* wins or finishes last... covers. Ron's bet against *exactly third*... likely pays Arnie. Bertie's ninth dog... pure coin flip.

  Then he saw it. A pattern emerging not from malice, but from the cold, neutral aggregation of individually "fair" contracts. He grabbed his stubby pencil, sweat beading on his forehead as he mapped scenarios involving multiple races simultaneously.

  "Bloody hell," he whispered.

  He saw a sequence of outcomes – not likely, but *possible* – where the payouts and receipts created a net loss, no matter what happened in the races involved. Mick's win, Vera's place payout overlapping unfavourably with Lenny's extremes, Ron's 'sucker' bet actually costing him in a specific scenario, and Bertie's coin flip acting like a final, indifferent tax. Each bet, defended on its own merits, conspired against him in concert. An accidental Dutch book, stitched together by five strangers who’d never met.

  He confronted them, one by one, the ledger trembling in his hand.

  "Fair odds, Arnie!" Mick insisted, spraying pastry flakes. "You said so!"

  "Just covering my pension, dear," Vera wheezed, lighting another cigarette.

  "My system's sound!" Lenny protested. "Each bet stands alone!"

  Ron just grinned. "Told you it was tricky. Still fair, though, innit? You agreed."

  Bertie was philosophical. "The mathematics is pristine, Arn. The odds *are* fair for the proposition stated *at the time*. Whether you live to see the ninth dog a thousand times... that's not my equation. That's yours."

  Arnie argued, his voice rough. "It's a phantom loss, Ron! A ghost in the machine! Shows up when you squint at all the papers together, not in the real world! How can you be damned by a... a *spreadsheet demon*?"

  "And if it *can* happen, Arn," Bertie countered softly, tapping the ninth-dog bet, "does it matter if it was planned or an accident? The loss is guaranteed in the mathematics. The universe doesn't care about intent."

  "And this?" Arnie stabbed Bertie's ticket. "Fair? How? I could take this bet every day till I drop, Bertie, and *still* not know if the blue jacket *wasn't* on the ninth dog more than half the time! Is a loss that only shows up if you add up an infinity of races still a reason to call me a mug *today*? Is a bet you can't finish even *real*?"

  Bertie shrugged. "The proposition is clear. The odds are fair for the single event. Your mortality... that's exogenous data, Arn. Not part of the wager's structure."

  The races ran. Some bets paid Arnie, some cost him. The catastrophic loss sequence didn't materialize *that day*. But the spectre remained in his ledger, mathematically inescapable under certain lights. The unfairness wasn't in any single handshake over odds; it was in the invisible web they wove.

  Sunday, under the grimy clubhouse lights, Arnie stared at the five tickets pinned like accusing butterflies. He wasn’t irrational for taking each one. He knew that in his bones. But together... they whispered condemnation. Did it matter that the book wasn’t planned? The cold numbers said no. Did the infinite bet damn him? It haunted him, an unresolved chord.

  His gnarled finger hovered. Take one back. Just one. Undo a single strand of the web. Mick’s trifecta? Sound. Vera’s pension hedge? Sensible. Lenny’s weird hedge? Logically sound. Bertie’s infinite coin flip? A fair proposition, however unsettling.

  His finger came down hard on **Ron’s** ticket – the bet against *Fast Eddie* finishing exactly third. *Even money against an improbable event.* On its own, mathematically defensible. But Ron’s smirk, the feeling of being nudged towards a ‘sucker’ bet that turned out to be mathematically fair yet existentially grating… that was the grain of sand.

  "Ron's," he muttered to the empty air, tearing the ticket slowly. "Slippery bastard. Not because the odds were wrong. Because it *felt* like the start of the rot." A choice against perceived sleaze, not mathematical sin. The ledger still held the seeds of loss, but Arnie could still choose which flavour of fairness stuck in his craw. He ordered another pint. The ninth dog was still out there, running towards an unseen finish line.
