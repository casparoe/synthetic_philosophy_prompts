  9. a swarm of nanobots I made up: tiny robots that build copies of themselves out of parts from a factory they also maintain and repair, the copies vary a bit and the faster builders take over, so there's real evolution — but if the factory stops everything dies out. I said NOT alive, but I can't say why in a way that doesn't also kill case 8
  10. programs in a simulation that copy themselves, mutate, and compete for processor time — I said not alive, but I'm less sure here than about the nanobots, which is dumb because both are machines
  11. an ant colony — I want to say the colony is alive in a way the individual ant isn't really, but I also want to say the individual ant obviously is alive

