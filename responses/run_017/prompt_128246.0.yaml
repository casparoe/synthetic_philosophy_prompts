answer: |-
  ### Analysis of Your Friend's Implicit Rule
  Based on her consistent verdicts across the seven cases, your friend operates on a principle of **continuous existence through maintenance and modification without cessation or recreation**. This rule emphasizes the persistence of the vessel as a single, unbroken entity over time, regardless of material changes, disassembly, or functional interruptions. Key aspects include:
  - **No reliance on material composition**: Matter can be entirely replaced (case 1), and having all original matter doesn't confer identity if it involves reassembly (case 2).
  - **Continuity over gaps**: Identity persists through disassembly (case 4), sinking and restoration (case 3), and inactivity (case 5), as long as there is no complete cessation of existence (e.g., the vessel exists as a whole, in parts, or as an unfinished hulk).
  - **No threshold for change**: Gradual replacement or modification never reaches a "borderline" where identity becomes ambiguous (cases 1 and 6).
  - **Rejection of social/conventional factors**: Identity is intrinsic; registers, names, and honors follow the vessel because it is the original, not the other way around (as per her comment).
  - **Distinction between maintenance and creation**: Maintenance of an existing vessel preserves identity, while new construction (even with original matter) does not (cases 2 and 7).

  This rule can be summarized as: **A vessel remains the same if it has an unbroken history of existence—whether in service, under maintenance, in storage, or incomplete—without a moment of destruction or recreation.**

  ### Predictions for the *Cormorant* Case
  **First question:** At the moment of B's launch, with A still afloat, your friend will confidently say that **A is the original *Cormorant***, and B is not.
  - **Reasoning**: 
    - A has been in continuous existence and service for 60 years, with gradual replacement of timbers. This mirrors case 1, where gradual replacement preserves identity, and case 2, where the continuously maintained vessel is original even when original matter is reassembled elsewhere.
    - B, though built with all the original matter in the original arrangement, is a new construction project. It has never been to sea and lacks A's continuous history. This resembles case 2's reassembly (a replica) and case 7's replica (new construction, not original). The gradual assembly of B over 60 years doesn't change this, as your friend rejects gradualism as a path to identity transfer (case 1 has no threshold, and case 2's reassembly is not borderline).
    - Confidence is high (similar to case 2), as A's continuous existence aligns perfectly with her core principle.

  **Second question:** Fifty years after A's destruction, she will say that **B is not the original *Cormorant***.
  - **Reasoning**:
    - At the time of A's destruction, B was a replica vessel, not the original. The transfer of the name, logs, bell, and honors does not confer original identity, as per her view that social factors follow identity rather than define it.
    - Over the next 50 years, B undergoes its own gradual timber replacement, similar to case 1. However, this preserves B's identity as the replica vessel launched in year 60, not the original *Cormorant*. Identity is established at creation: B began as a new entity, and maintenance only sustains that, it doesn't retroactively make it the original.
    - Confidence remains high, as this is consistent with case 2: having the original matter (which B did at launch) or assuming a social role (as B did post-transfer) doesn't make a replica the original. The original *Cormorant* (A) ceased to exist when destroyed.

