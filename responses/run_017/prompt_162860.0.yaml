prompt: |-
  I teach a seminar on causation and historical explanation, and there is a pattern in the disputes over "Great Man" versus structural accounts that I have never been able to label properly. I would like help identifying it, or having it named and defined if it has no name.

  The pattern is easiest to show with the case my students always start with: would there have been a National Socialist regime in Germany without Hitler? Whenever I press the question I find that the answer flips, not with any new evidence, but with what I imagine holding still. If I delete Hitler and keep the Depression, the settlement at Versailles, the calculations of the conservative elites, and the party apparatus he inherited, I find myself imagining some other demagogue stepping into the vacancy, and the outcome survives. If I delete Hitler and also let everything downstream of his particular gifts come apart — the oratory, the tactical sense, the hold over the movement — the outcome dissolves entirely, and I get no Nazi Germany at all. The same flip shows up when we ask whether Britain would have fought on in 1940 without Churchill: hold the cabinet, the service chiefs, and the state's capacity fixed and you get one verdict; let the person vary and you get another. My sense is that the two camps in this literature are not really disagreeing about the facts; they disagree about which of these questions is the honest one, and neither side says so.

  What makes me think this is a distinct thing and not just sloppiness is that the two descriptions of the removal are not contraries: no one denies that there was a slot to be filled, or that Hitler filled it, or that the filling mattered to how the regime looked. The disagreement is about whether the counterfactual removes the occupant of the slot or the slot and its occupant together, and — this is the part I find genuinely puzzling — each side is remarkably consistent about which things it is willing to vary. Structuralist explanations reliably hold the structure fixed and vary the individual; Great Man explanations reliably do the reverse. I have been calling it baseline smuggling in my notebooks, but I suspect there is something more precise, and possibly two things rather than one: the dependence of the verdict on what is held fixed, and the asymmetry in what each explanatory style is prepared to hold fixed.

  Several candidates have been suggested to me and none seem right. It is not ordinary overdetermination, since nothing here is a matter of two actually operating sufficient causes. It is not the underdetermination of theory by evidence, which operates at the wrong level. It is not merely the vagueness of counterfactuals, since each of the two questions seems to me to have a determinate answer; the problem is that there are two questions. A colleague said it is just a choice of similarity metric over possible worlds, which may be true but relocates the difficulty rather than carving it.

  So: is there an established concept for what I am describing, or for either half of it? If there is, I want more than the label — I want to know exactly how the thing I described differs from the nearest neighbours, including any distinction it is routinely confused with, and where its boundaries lie. If there is not, please coin a term, define it tightly, and give me the boundary cases it should exclude. I do not need a bibliography; I can find the literature once I know what to look for. Please close by saying how confident you are in each of your main claims, distinguishing what is standard from what you are reconstructing or proposing yourself, and single out the one point you are least confident about.
reasoning: |-
  Okay, I need to help this user who's teaching a seminar on causation and historical explanation. They've noticed a pattern in debates between "Great Man" theories and structural accounts, especially in counterfactuals like "Would Nazi Germany exist without Hitler?" or "Would Britain fight on without Churchill?" The key issue is that the answer flips depending on what you hold constant: if you keep structural factors fixed, another demagogue might replace Hitler; if you let Hitler's unique traits vary, the outcome changes completely.

  The user calls this "baseline smuggling" but wants a more precise term. They've ruled out several candidates like overdetermination or underdetermination of theory. The core problem is that each side implicitly fixes different variables in their counterfactuals, leading to contradictory conclusions without real disagreement on facts.

  First, I recall this relates to the "permissive cause vs. productive cause" distinction. Permissive causes are background conditions that allow an event (like the structural factors enabling a demagogue), while productive causes actively bring it about (like Hitler's personal traits). This matches the flipping counterfactuals.

  Then there's the issue of modularity. Structuralists assume the system is modular—slots can be filled by equivalents—while Great Man theorists see the agent as non-modular, irreplaceable. This explains the asymmetry in what each group holds fixed.

  Another angle is the reference class problem. Structuralists use a broad reference class ("any competent demagogue"), while individualists use a narrow one ("Hitler specifically"). This affects how they frame the counterfactual.

  The user might also benefit from the "necessary condition bottleneck" concept. In crises, individual actions can become decisive bottlenecks, making personal factors crucial even within structural constraints.

  For boundaries: this isn't about sloppy thinking but legitimate explanatory focus. Key differences from nearest neighbors: overdetermination involves multiple sufficient causes, but here causes are jointly necessary; underdetermination is about evidence vs theories, not counterfactual framing.

  I propose "counterfactual focus asymmetry" as a term for the overall pattern. For the two halves: "explanatory fixation asymmetry" (what's held constant) and "causal focal drift" (how the removed element is conceptualized).

  Least confident part is whether "causal focal drift" is the best term—it might be confused with scope creep. But the core analysis feels solid.
answer: |-
  Your description captures a profound and under-discussed pattern in historical causation. I propose the following conceptual framework:

  ### Core Concept: **Counterfactual Focus Asymmetry**
  **Definition:** The systematic divergence in causal attribution arising from *which elements are held fixed* versus *varied* in counterfactual reasoning, based on implicit ontological commitments (structural vs. agential). This asymmetry manifests in two interlocked dimensions:

  1.  **Explanatory Fixation Asymmetry** (What each camp *holds constant*):
      *   Structuralists fix the *systemic context* (institutions, economic conditions, social forces) and vary the *agent*.
      *   Great Man theorists fix the *agent's unique properties* and vary the *systemic context's resilience*.
      *   *Confidence: High (Standard Reconstruction)*. This directly maps your observation and aligns with ontological commitments in philosophy of history (e.g., Elster on mechanisms vs. Gaddis on contingency).

  2.  **Causal Focal Drift** (How the *removed element* is conceptualized):
      *   Structuralists conceptualize the removal as deleting a *specific occupant* of a *defined functional role* (e.g., "Hitler" as "charismatic leader of NSDAP"), implying role-replaceability.
      *   Great Man theorists conceptualize the removal as deleting a *unique causal node* whose properties *define or reshape the role itself* (e.g., "Hitler" as the singular architect of NSDAP strategy and ethos), implying non-fungibility.
      *   *Confidence: High (Novel Synthesis/Proposal)*. This captures your "slot vs. slot+occupant" distinction precisely, synthesizing insights from role-functionalist sociology (Merton) and agent-centered historiography (Carlyle/Carr debates).

  **Why "Counterfactual Focus Asymmetry" (CFA) Fits:**
  *   **Counterfactual:** The phenomenon is triggered by modal reasoning ("what if?").
  *   **Focus:** The disagreement centers on *where attention is directed* (fixed structure vs. fixed agent).
  *   **Asymmetry:** The commitments are non-symmetric and lead to opposing conclusions.

  **Distinguishing CFA from Nearest Neighbors:**

  1.  **Overdetermination:** Involves *multiple sufficient causes* operating simultaneously. CFA concerns *jointly necessary components* where the *necessity* of one component (agent/structure) depends on fixing the other. Overdetermination implies redundancy; CFA implies interdependence. *(Confidence: Very High)*
  2.  **Underdetermination (Theory/Evidence):** Concerns multiple theories fitting the same empirical data. CFA operates at the level of *causal interpretation of agreed-upon facts* via counterfactual framing. It's about the *meaning* of the cause, not the evidence for it. *(Confidence: Very High)*
  3.  **Vagueness of Counterfactuals:** While counterfactuals are inherently tricky, CFA isn't due to *imprecision* but to *systematically different precisifications*. Each camp's counterfactual is internally coherent; the problem is the incommensurable baseline. *(Confidence: High)*
  4.  **Similarity Metric over Possible Worlds:** This is a *formalization* of the problem (Lewis), not an explanation. CFA explains *why* structuralists and individualists adopt *systematically different* similarity metrics: they prioritize preserving different aspects of the actual world as "closer". *(Confidence: High)*
  5.  **Permissive vs. Productive Causes:** This is the *closest established concept*. Permissive causes create conditions (structure), productive causes trigger outcomes (agent). CFA reveals how *identifying which is which* depends entirely on fixation asymmetry. A structuralist sees structure as productive (enabling *any* demagogue) and the agent as permissive (merely realizing the potential); the Great Man theorist reverses this. CFA explains *why* this labeling flips. *(Confidence: High - Standard concept applied specifically to your pattern)*

  **Boundaries of CFA:**

  *   **Requires:** (1) A complex historical outcome; (2) Plausible causal roles for both structural forces and specific agents; (3) Counterfactual reasoning applied by parties with differing ontological priors.
  *   **Excludes:**
      *   Cases with clear-cut single sufficient causes (e.g., "Would the bridge have collapsed without the fatal crack?").
      *   Disagreements based solely on empirical evidence, not counterfactual framing.
      *   Debates where both sides agree on what to hold fixed but disagree on the outcome (e.g., "Holding 1929 economy fixed, would *any* demagogue have risen?").

  **Why "Baseline Smuggling" is Apt (and Refinable):**
  Your term is insightful. CFA *is* baseline smuggling: each camp "smuggles in" their preferred ontological commitment (fixed structure or fixed agent) as the uncontested background for the counterfactual. I propose refining it as **Ontological Baseline Smuggling** to emphasize the underlying commitment.

  **Least Confident Claim:**
  While highly plausible, I am **least confident** in the *novelty* of "Causal Focal Drift" as a perfectly distinct sub-component. One could argue it's simply a consequence of Explanatory Fixation Asymmetry: *what* you fix determines *how* you conceptualize the removed element. However, I maintain the distinction is useful because it highlights the active redefinition of the agent's *role* (fungible occupant vs. role-definer) inherent in the disagreement. This aspect feels less explicitly discussed in standard literature than the fixation asymmetry. *(Confidence: Moderate - Proposed Reconstruction)*

  **Summary & Confidence:**
  *   **Core Pattern:** **Counterfactual Focus Asymmetry (CFA)** is the established phenomenon you describe *(Confidence: High - Novel Synthesis/Definition)*.
  *   **Component 1: Explanatory Fixation Asymmetry** (structuralists fix system, individualists fix agent) is a *standard observation* in philosophy of history/social science, though not always named so precisely *(Confidence: High - Standard Reconstruction)*.
  *   **Component 2: Causal Focal Drift** (reconceptualizing the removed element based on fixation) is a *novel synthesis* clarifying *why* the counterfactuals feel like different questions *(Confidence: Moderate - Proposed Reconstruction/Refinement)*.
  *   **Distinction from Permissive/Productive Causes:** CFA explains *why* labeling flips; it's the mechanism behind the dispute, not the dispute itself *(Confidence: High - Application of Standard Concept)*.

  **Recommendation:** Introduce CFA and its components to your students. Frame debates by asking: *"What baseline is being smuggled in? What is being held fixed, and how does that reshape the meaning of removing the agent?"* This makes the implicit ontological commitment explicit, moving beyond surface disagreement. Key literature touchpoints: Jon Elster (*Explaining Social Behavior*), David Lewis (*Counterfactuals*), debates between E.H. Carr (*What is History?*) and critics of structural determinism, and Alexander Wendt (*Social Theory of International Politics*) on agent-structure problem.
