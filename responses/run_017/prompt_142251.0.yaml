answer: |-
  ## Recommendation: Shift to Flat-Rate Payments with Randomized Audits Against a Quality Rubric  

  **Bottom Line:** We should immediately replace our outcome-based payment formula with a flat-rate per-enrolled-participant structure, paired with randomized, in-depth audits of provider case files against a multi-factor quality rubric to ensure accountability.  

  ### Why Change is Necessary  
  Our current metric—tying 20% of payments to "unsubsidized job placement within 90 days"—has unintentionally rewarded providers for excluding harder-to-serve participants (e.g., screening out those with >1-year work gaps) and prioritizing short-term, low-quality placements (e.g., 2–3 day temp jobs). While the *measured* placement rate soared from 31% to 58%, **real-world outcomes for participants haven’t improved**—median earnings are flat per state wage data. This is a classic case of "what gets measured gets managed," often to the detriment of our true goal: sustainable economic mobility for justice-involved individuals.  

  ### Evaluating Our Options  
  | Option                     | Key Strengths                                   | Key Weaknesses                                                                 |
  |----------------------------|------------------------------------------------|-------------------------------------------------------------------------------|
  | **A: Risk-adjusted placement** | Recognizes participant barriers; fairer to providers. | Complex to design; providers may still "game" risk tiers; doesn’t address low-quality placements. |
  | **B: Flat rate + audits**      | Eliminates perverse incentives; focuses on true quality via audits; simpler administration. | Audits require staff time; rubric design is critical.                          |
  | **C: Decoy metric**         | May distract providers from gaming true metrics. | Unethical (misleads partners); risks distrust; gaming may shift to composite.  |
  | **D: Vague + hand-adjusted** | Flexible; hard to reverse-engineer.            | Subjective; opaque; invites perceptions of bias; unstable for provider planning.  

  ### Why Flat Rate + Audits (Option B) Is Best  
  1. **Kills the Root Problem**: Paying per enrolled participant—regardless of placement—removes all incentive to cherry-pick easy cases or chase empty "placements." Providers can refocus on skills development and meaningful employer relationships.  
  2. **True Accountability via Audits**: Randomly auditing 10–15% of cases against a robust rubric (e.g., job quality, wage growth, retention support) ensures we pay for *real impact*, not loopholes. Staff time is a worthy investment to verify outcomes.  
  3. **Fair and Transparent**: Providers know exactly how they’ll be paid and evaluated. No hidden formulas (Option C) or subjective adjustments (Option D) undermine trust.  
  4. **Scalable and Proven**: Models like federal Workforce Innovation and Opportunity Act (WIOA) use similar audit frameworks. We start simple and refine the rubric annually with provider input.  

  ### The Strongest Alternative: Why Not Risk-Adjusted Placement (Option A)?  
  Risk adjustment *seems* fair—providers serving participants with greater barriers (e.g., homelessness, low skills) wouldn’t be penalized. However:  
  - **It Doesn’t Fix Gaming**: Providers could still manipulate risk tiers or target "medium-risk" clients over high-risk ones.  
  - **It Ignores Job Quality**: A "placement" could remain a low-wage, short-term role—adjusting for risk doesn’t ensure better earnings.  
  - **Implementation Chaos**: Defining risk tiers objectively would be contentious and data-intensive, delaying reform.  

  ### Implementation Steps  
  1. **Immediate Transition**: For FY25, pay 100% of funds as flat fees per enrolled participant (using current enrollment definitions).  
  2. **Develop Audit Rubric by Q1**: Collaborate with providers to define 4–5 audited outcomes (e.g., wages at 90/180 days, full-time status, benefits access).  
  3. **Audit 15% of Cases Quarterly**: Use state wage records + provider documentation. Penalize consistent underperformance with payment holds.  
  4. **Sunset Clause**: Review system effectiveness in 18 months.  

  ### Confidence and Caveats  
  **Confidence Level: Medium-High**. This directly attacks gaming incentives while balancing accountability and practicality. Evidence from similar programs shows audit-based systems improve outcome integrity.  

  **Key Uncertainty: Cost of Audits**. We don’t yet know the full staff/resources needed. I recommend piloting audits with 1–2 providers first to refine the process. Budget allocation for audit staffing will be critical.  

  ---  
  **Word Count**: 698  

  **Suggested Next Step**: Vote to adopt Option B at our next meeting, and form a subcommittee (including 1–2 providers) to draft the audit rubric by August 30.
