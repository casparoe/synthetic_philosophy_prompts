prompt: |-
  hey so my teacher lets me write the practice exam for our grade 12 philosophy elective and I'm doing the section on weakness of will / akrasia and hyperbolic discounting. I need one in-class short answer question, 30 minutes, 20 marks, plus a model answer and a marking scheme.

  Problem is everyone in the class has already done the basic stuff — present bias, beta and delta, preference reversal over time, Ulysses and commitment devices — and I want a question where just writing that stuff down gets you a B at most. My idea is to build it around a case I sort of made up: someone puts off doing something that costs them basically nothing to do right now. Like there's a button on their screen that turns their phone greyscale and they've decided they want it on and they just don't press it for a month. Or a form that takes 40 seconds and pays them 20 bucks and they leave the tab open for three weeks. There's no real effort cost and no real delay, so there's nothing much for a discount function to bite on.

  Can you write the question (with the case in it, or a better version of the case if mine is muddled), a model answer of about 500-600 words, and a marking scheme out of 20 that says exactly which moves separate an A from a B. I want it to force people to say what the hyperbolic discounting story would have to add on to handle the zero-cost case — an attention or salience thing, a status quo thing, whatever — and whether once you add it you're still describing weakness of will or something else entirely. Also list the usual wrong answers so I can turn them into distractors. We don't have journal access so pls no reading lists or citations, just the question and the scheme. idk if attention is even the right lever, use a different one if it works better.
reasoning: |-
  Okay, the user is a grade 12 student tasked with creating a challenging philosophy exam question on akrasia and hyperbolic discounting. They want to push beyond basic concepts (present bias, Ulysses contracts) by focusing on a paradox: why people delay trivial-cost/high-reward actions. Their button/greyscale phone and instant-payment-form examples are perfect because they eliminate effort/delay variables that hyperbolic discounting typically explains.

  Hmm... their deeper need is testing *conceptual synthesis*. The question must force students to:  
  (1) Diagnose why standard models fail here (no temporal conflict → no β-δ drama)  
  (2) Propose extensions (status quo bias? attentional neglect?)  
  (3) Debate if this still counts as "weakness of will"  

  Key pitfalls to avoid:  
  - Letting students regurgitate β/δ without engaging the zero-cost paradox  
  - Not forcing the "is this still akrasia?" meta-question  
  - Weak distractors (e.g. just calling it "laziness")  

  For the case study, I'll refine their examples into "Instant Reward Button Scenario" to emphasize immediacy. The model answer needs to:  
  - First establish why hyperbolic discounting *can't* explain this (no future penalty, no effort cost)  
  - Then borrow from status quo bias (inertia > preference reversal)  
  - Contrast with "true akrasia" where conflict is between now-self vs future-self  

  Marking scheme must harshly penalize answers that:  
  - Mention commitment devices (irrelevant here)  
  - Blame "procrastination" without mechanism  
  - Miss the "conceptual boundaries of akrasia" debate  

  Distractor ideas:  
  - "It's just irrationality" (vague)  
  - "Seen as effortful subconsciously" (unfalsifiable)  
  - "Hyperbolic discounting of microseconds" (absurd)  

  The A-grade differentiator will be attacking the *definition* of akrasia itself. Best students should argue that without intertemporal conflict, this might be "negligence" not "weakness of will".
answer: |-
  Here's a complete exam package focused on the zero-cost delay paradox, designed to push students beyond standard hyperbolic discounting explanations. The question forces engagement with boundary cases and conceptual refinement.

  **Exam Question (30 minutes, 20 marks):**

  > **Case Study:** Alex has decided that enabling greyscale mode on their smartphone will reduce distraction and improve focus. The setting change requires precisely two taps on their phone’s settings menu (taking <10 seconds) and has no financial cost or technical risk. Alex believes this change will provide immediate and ongoing benefits. Despite this, Alex leaves the setting disabled for 27 days, seeing the menu option daily, before finally enabling it.  
  >  
  > **Question:** Standard accounts of weakness of will (akrasia) often rely on hyperbolic discounting models, where a steeply discounted *immediate cost* (effort, temptation) outweighs larger *future rewards*. Explain why Alex’s behaviour poses a challenge to this standard model. Propose and evaluate *one* significant theoretical extension or alternative mechanism needed to explain cases like this. Finally, discuss whether adding this mechanism preserves the core concept of "weakness of will" or describes a meaningfully distinct phenomenon.

  ---

  **Model Answer (Approx. 550 words):**

  Alex’s behaviour challenges the core logic of hyperbolic discounting as an explanation for weakness of will (akrasia). Hyperbolic discounting (using β-δ models) explains preference reversal through *temporal asymmetry*: a smaller, immediate reward is irrationally preferred over a larger delayed reward due to the steep discounting of the future by the present-biased β factor, or conversely, an immediate cost feels disproportionately large compared to larger future benefits. In Alex’s case, however, there is **no salient immediate cost or delayed reward to discount**. The cost is negligible (<10 seconds, no effort, no risk) and crucially, the *benefits are also immediate* (reduced distraction starts right after enabling). There’s no intertemporal conflict for β-δ dynamics to operate on. The action is overwhelmingly net-positive *at every point in time*, including *right now*. Standard akrasia involves choosing a worse *immediate* option (e.g., eating cake) knowing it conflicts with a better *future* state (health). Alex isn’t choosing a worse present option; they are failing to act on a dominant present option. This is a problem of **inaction despite negligible cost/effort and immediate net gain**, not preference reversal over time.

  To explain this, we need a mechanism addressing **attentional neglect or salience failure**. While Alex "knows" the action is beneficial, the *need to act* or the *salience of the opportunity* fades into the background of habitual behaviour. The status quo (colour display) is the default, cognitively "invisible" state. Enabling greyscale requires a brief but distinct *shift of attention* and *execution of a deliberate, non-habitual action*. The cost isn’t temporal discounting of effort; it’s the **cognitive switching cost** or the **failure of the intention to become salient** at moments when action is possible. Alex isn’t devaluing future benefits; they are failing to register the *action opportunity* as demanding attention *now*, despite their general intention. The mechanism is less about distorted valuation over time and more about **procedural or attentional gaps** between forming an intention and implementing it in a cluttered cognitive environment.

  Whether this preserves "weakness of will" is debatable and hinges on definitions. If akrasia *requires* a clear conflict between a *present desire* (e.g., for ease, pleasure) and a *judged better course* (e.g., long-term good), then Alex’s case may fall outside it. Here, there’s no strong countervailing *present desire* keeping the phone in colour; it’s inertia, not temptation. Alex’s failure seems more like **executive or attentional lapse** than succumbing to a stronger impulse. However, one could argue it *broadly* fits akrasia as "acting against one’s better judgement" if "judgement" includes recognising the net benefit of acting *now*. The key difference is the *nature of the failure*. Standard akrasia involves actively choosing a worse option due to emotional or appetitive pull. Alex’s inaction involves *passively neglecting* a better option due to attentional drift and procedural inertia. While both manifest as irrational action/inaction against one's goals, the core psychological failure – distorted valuation vs. attentional/executive lapse – suggests they are distinct phenomena. Explaining Alex requires moving beyond the valuation-centric model of hyperbolic discounting to cognitive science concepts of attention, habit, and implementation intention.

  ---

  **Marking Scheme (20 marks total):**

  **A-Grade Responses (17-20 marks) MUST:**
  1.  **Accurately Diagnose the Challenge (6 marks):** Explicitly state the absence of a significant *immediate cost* or *delayed benefit* for hyperbolic discounting (β-δ) to operate on, highlighting the *immediacy of the net gain*. Contrast sharply with standard akrasia cases (e.g., cake vs. health). (Marks lost for vague statements like "it's weird" or misidentifying costs/benefits).
  2.  **Propose & Evaluate a Plausible Mechanism (7 marks):** Propose *one* specific, named mechanism beyond valuation discounting (e.g., attentional neglect, salience failure, status quo bias, implementation intention failure, executive function lapse). **Crucially, explain HOW it bridges the gap** (e.g., "Salience failure means the *opportunity to act* doesn't capture attention despite the intention"). Briefly note strengths/weaknesses (e.g., "Explains inaction, but less clear on why action *eventually* happens"). (Marks lost for vague terms like "laziness" or just listing mechanisms without explaining application).
  3.  **Critically Engage Conceptual Boundaries (7 marks):** Explicitly debate whether the extended model still describes "weakness of will" or something distinct. *Must reference core features of akrasia* (e.g., conflict with better judgement, role of desire/temptation) vs. features of the new mechanism (e.g., attentional lapse, inertia). Reach a reasoned conclusion (e.g., "It broadens akrasia" OR "It's a distinct executive failure"). (Marks lost for ignoring the question or asserting without argument).

  **B-Grade Responses (13-16 marks) typically:**
  *   Correctly identify the challenge but less precisely (e.g., "no cost" without emphasizing *immediacy of net gain*).
  *   Propose a plausible mechanism but explain its application less clearly or deeply.
  *   Discuss the "weakness of will" question but with less rigor in defining terms or contrasting mechanisms/failures.
  *   May include some standard hyperbolic discounting explanation correctly but insufficiently adapted to the case.

  **Common Wrong Answers / Distractors (C grade or lower):**
  *   **"It's just hyperbolic discounting":** Argues Alex discounts the tiny effort massively or the immediate benefit of *not switching* (e.g., colour vibrancy), ignoring the *immediacy* of the net gain from acting. (Shows misapplication of model).
  *   **"Procrastination means it feels effortful":** Asserts Alex subconsciously perceives the task as high effort without justification from the case details. (Unfounded assumption).
  *   **"Ulysses Contract needed":** Suggests commitment devices as a solution, but fails to explain the *cause* or why standard discounting doesn't apply. (Misreads the task).
  *   **"Pure irrationality / laziness":** Uses descriptive labels without providing *any* explanatory mechanism. (Lacks analysis).
  *   **"Indecision / Uncertainty":** Posits Alex isn't sure about the benefits, contradicting the case ("Alex believes this change will provide immediate and ongoing benefits"). (Ignores case facts).
  *   **Focus only on why action *eventually* happens:** Discusses triggers for finally acting (e.g., deadline pressure) but ignores the core question of *why the delay occurred* initially. (Off-topic).

  **Key A vs. B Differentiators:**
  *   **Precision in Challenge:** A-grades explicitly dissect *why* β-δ fails (no intertemporal conflict, net gain *now*). B-grades note "no cost" vaguely.
  *   **Depth of Mechanism:** A-grades explain *how* the proposed mechanism (e.g., salience) *specifically* causes inaction *in this context*. B-grades name it but apply it superficially.
  *   **Conceptual Rigor:** A-grades rigorously compare the *nature of the failure* (valuation vs. attention) against core definitions of akrasia. B-grades discuss it loosely as "still a willpower thing."

  This setup forces students to show they understand the *limits* of hyperbolic discounting, can creatively apply *related but distinct* cognitive concepts, and think critically about philosophical definitions – moving well beyond textbook summaries.
