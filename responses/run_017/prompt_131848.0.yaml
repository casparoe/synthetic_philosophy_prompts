prompt: |-
  After thirty-odd years as a research geophysicist — most of it spent on radiometric dating and on the stratigraphic correlation of cores taken from widely separated basins — I have begun sitting in on a graduate seminar in the philosophy of history, and I keep tripping over a word I would have defined wrongly had I met it in my own field. In metaphysics, presentism is the doctrine that only the present exists; in historiography, as my seminar uses it, it is the fault of judging past agents by the standards of our own time. I assumed at first that these were merely homonyms, but I am no longer sure, and I would like help seeing whether the physicist's sense is doing any quiet work underneath the historians' sense.

  What prompted the question is a pair of practices that seem to pull in opposite directions. On the one hand, the professional norm in my seminar is emphatic: we are to reconstruct what an agent could reasonably have believed given the evidence available to her, to resist anachronism, to treat the past as a foreign country. On the other hand, the institutions around us do the reverse constantly and with great moral seriousness: statues of nineteenth-century slave traders and imperial proconsuls are pulled down, colleges and schools named for benefactors are renamed, plaques are bolted on, parliaments and churches issue retrospective apologies, and politicians accuse their opponents of standing on the wrong side of history — a phrase I find curious, since it launders a thoroughly contemporary judgment as though it were a verdict of time itself. Meanwhile the scruple seems strictly one-directional: no one reproaches us for praising an abolitionist or an early advocate of women's education as having been ahead of her time, though that is the very same anachronism running the other way, and the same seminar that insists we must not fault a seventeenth-century naturalist for failing to be a Darwinian will happily describe him as a forerunner of population thinking.

  I have been toying with a way of framing this that I cannot get to work properly, and I would like it tested rather than indulged. In my old field, when a quantity looks different depending on the frame in which you measure it, the useful move is not to ask which frame is correct but to ask which quantities are invariant under a change of frame, and then to argue about the conventions that make one frame appropriate for a given purpose. So I have been treating the choice of *which era's* standards to judge by as a kind of frame choice: the question would then be which moral judgments are invariant under a shift of temporal standpoint, and what conventions govern when it is apt to adopt the standpoint of the agent versus that of the judge. Does that analogy illuminate the situation or does it smuggle in something? More concretely: what view of moral judgment, and of historical explanation, do these commemorative and condemnatory practices actually presuppose? Does condemning a past figure require thinking moral standards are timeless, while the anti-anachronism norm requires relativizing blame to an agent's epistemic situation — and are those consistent, or does one need something like a distinction between an act's being wrong and the agent's being blameworthy? Where is the practice philosophically underdetermined, so that several rival theories would license the same renaming? In particular, is it a real answer to say that commemoration is not a verdict on a person at all but a decision about what a community currently wishes to honour and to teach — so that taking down a statue no more judges the dead than choosing a reading list does — or is that a dodge? And what would have to change in these practices if one took the anti-presentist norm seriously all the way down, or if one took the frame-relativity picture seriously instead?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a geophysicist with decades of experience, now diving into philosophy of history. They're grappling with the term "presentism" across fields—metaphysics vs. historiography. Their core confusion is whether these senses are connected beneath the surface. 

  The user presents a tension: historians reject judging the past by modern standards, yet society constantly does this (removing statues, issuing apologies). They notice this scruple only goes one way—condemning past figures gets scrutiny, but praising "ahead of their time" figures doesn't. That asymmetry bothers them. 

  Their physics-trained mind frames this as a "reference frame" problem: moral judgments as quantities that may/may not be invariant across temporal standpoints. They want to know if this analogy holds water, and what philosophical underpinnings explain real-world practices like renaming buildings. 

  Hmm. First, I should validate their intuition—the two presentisms *are* subtly linked. Metaphysical presentism (only now exists) might psychologically enable the historiographical kind (judging past by present). But the latter is more about epistemology than ontology. 

  The frame analogy? It's brilliant but risky. Invariance works for physics, but morality isn't math. We can't "transform coordinates" between eras and expect conserved quantities—unless you're a moral realist, which is contested. Still, the analogy usefully reframes the question: *When* do we switch frames? 

  The asymmetry they spotted (condemnation vs. praise) is key. We condemn slave traders as "evil then and now" (implying timeless wrongness), but praise abolitionists as "ahead of their time" (implying moral progress). Both are presentist! Yet only condemnation feels jarring. Why? 

  Ah—because praise aligns with *our* narrative of progress. Condemnation threatens our connection to the past. Hence institutions' double standard: strict anti-presentism in scholarship, but presentist moralizing in commemoration. 

  The user's concrete questions: 
  - Do condemnations assume timeless morals? Yes, implicitly. 
  - Does anti-anachronism require relativizing blame? Also yes. 
  Conflict? Only if you conflate *wrongness* and *blameworthiness*. That distinction (à la Aristotle) resolves it: slavery was always wrong, but 19th-century defenders weren't fully blameworthy given their context. 

  Commemoration as "teaching, not judging"? Partly a dodge. Removing a statue *does* imply moral judgment, even if it's primarily about current values. But calling it purely pedagogical ignores how it shapes historical perception. 

  If we took anti-presentism seriously? We'd contextualize *everything*—no statues removed, but plaques added. If we embraced frame-relativity? We'd specify *whose* standards we're using when (e.g., "This violated 2024 norms; here's what contemporaries thought"). 

  The user’s physics analogy illuminates by forcing precision about standpoints. But it smuggles in a covert optimism: that invariant "moral truths" exist. Historians might reject that. Still, for a geophysicist? It’s a formidable bridge between disciplines.
answer: |-
  Your inquiry cuts to the heart of enduring tensions in historiography, ethics, and public memory. Let's dissect the conceptual layers and test your frame-relativity analogy.

  ### 1. **The Two Presentisms: Homonyms or Covert Allies?**
     - **Metaphysical Presentism** (only the present exists) subtly enables **Historiographical Presentism** (judging the past by present standards). If the past "does not exist" (metaphysically), it becomes easier to treat it as a mere resource for present agendas rather than a reality with its own epistemic gravity. Historians reject this, yet public commemorative practices often operate as if the past *must* conform to present values to be "relevant."

  ### 2. **Testing the Frame-Relativity Analogy**
     Your physics-inspired model is insightful but requires refinement:
     - **Strengths**: 
       - It exposes the *conventionality* of temporal standpoints. Choosing to judge by 18th-century standards vs. 21st-century standards is like choosing Cartesian vs. polar coordinates: neither is "true," but one may be *apt for a purpose*.
       - Invariants might include: *intentional cruelty*, *epistemic negligence* (ignoring available evidence), or *violations of contextually transcendant norms* (e.g., prohibitions against betrayal or torture in many eras).
     - **Risks**: 
       - Moral judgments aren't mathematical invariants. What counts as "cruelty" is often frame-dependent.
       - The analogy smuggles in a *temporal God's-eye view*—but no neutral frame exists. We always judge from *somewhere*.

  ### 3. **The Asymmetry Problem: Condemnation vs. Praise**
     Your observation about one-directional scruples is astute:
     - **Condemnation** (e.g., renaming buildings) implies: *"They should have known better, even then."*  
     - **Praise** (e.g., "ahead of their time") implies: *"They exceeded their era's limitations."*
     - **Resolution**: Both are presentist, but praise aligns with **Whig history** (history as progress toward present values). Condemnation disrupts cultural continuity; praise reinforces it. The asymmetry persists because institutions use history for *pedagogy* and *legitimation*—not just truth-seeking.

  ### 4. **Philosophical Underpinnings of Commemorative Practices**
     These practices reveal conflicting presuppositions:
     | **Practice** | **Presupposed View** | **Tension with Anti-Presentism** |
     |--------------|----------------------|----------------------------------|
     | Removing statues | Moral truth is timeless; past acts are eternally condemnable. | Ignores that moral knowledge evolves contextually. |
     | Retrospective apologies | Moral responsibility transcends time; present entities inherit past debts. | Risks anachronistic attribution of modern agency to past collective actors. |
     | "Wrong side of history" | History has a teleological moral arc (e.g., toward liberty/equality). | Imposes a present-derived narrative on the past's contingency. |

     - **Core Conflict**: Commemorative acts often assume **moral realism** (timeless wrongs/rights), while scholarly anti-presentism leans toward **contextualist relativism** (blame requires epistemic situatedness).

  ### 5. **Is Commemoration "Not a Verdict"?**
     Claiming that removing a statue is "not judging the dead" is a **strategic half-truth**:
     - **Plausible Defense**: Commemoration reflects *current community values*, not historical verdicts. A statue is pedagogy, not jurisprudence.  
     - **Problem**: This fails when institutions *moralize* the act (e.g., "We remove this statue because *he was evil*"). It also ignores how erasure implies condemnation. A purely pedagogical approach would add context (plaques, counter-monuments), not subtract.

  ### 6. **What Changes if We Take Anti-Presentism Seriously?**
     - **In Scholarship**: Judges past agents *only* by contextual standards. Darwin's forerunners are studied for their own questions, not as "pre-Darwinians."  
     - **In Commemoration**: 
       - Statues remain but gain explanatory plaques (e.g., "X owned slaves; this reflects 18th-century norms we now reject").  
       - Apologies focus on *present obligations* (e.g., reparations) rather than imputing guilt to past actors.  
       - "Wrong side of history" rhetoric is abandoned as teleologically unhistorical.

  ### 7. **A Synthetic Proposal: The Double Standpoint**
     Borrowing from your frame analogy and Bernard Williams' *relativism of distance*:
     - **Adopt Dual Frames Explicitly**: 
       1. **Contextual Frame**: Explain past actions within their era's epistemology/morality (e.g., "Given 17th-century biological knowledge, spontaneous generation was reasonable").  
       2. **Evaluative Frame**: Judge *from the present* which past norms we endorse or reject (e.g., "Colonial violence was wrong by *both* 18th-century humanist standards and our own").  
     - **Conventions for Frame Selection**:  
       - Use the *contextual frame* for explanatory history (understanding agency).  
       - Use the *evaluative frame* for commemorative/political acts (affirming current values), but *only if* contextual explanation precedes evaluation.

  ### Conclusion
  Your physics analogy illuminates by forcing explicitness about temporal standpoints. The two presentisms are not homonyms but dialectically related: metaphysical presentism erodes the past's autonomy, enabling historiographical presentism. Public practices aren't philosophically consistent—they oscillate between moral realism (for condemnation) and Whiggish progressivism (for praise). 

  The underdetermined space lies in **whether moral progress is real or illusory**. If one believes in moral progress (e.g., expanding rights), praising "ahead of their time" figures makes sense. Condemning past actors only coheres if we distinguish:  
  - **Timeless wrongness** (e.g., slavery violates human dignity in any era)  
  - **Contextual blameworthiness** (e.g., a 1700s slave trader might lack full culpability due to epistemic limitations).  

  Thus, we *can* condemn the act (from our frame) while withholding full condemnation of the agent (in their frame). Commemoration becomes a dodge only when it denies this duality. To take frame-relativity seriously is to make both standpoints explicit—and to let tension between them refine our moral humility.
