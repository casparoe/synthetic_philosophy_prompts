answer: |-
  ### 1. Exam Question (199 words)  
  **"The Meridian Trace (2148) provides a complete, uncontested factual record of the 2031 withdrawal. Historian A produces *The Meridian Decision* (tragedy); Historian B writes *Meridian: A Farce of Logistics* (farce). Both use identical facts, deny nothing in each other’s accounts, yet offer irreconcilable interpretations. A third historian publishes an unedited chronology adding ‘nothing’ to the Trace, dismissed as ‘not history.’ A fourth notes both rivals presuppose unchallenged frameworks (e.g., nation-state agency, one-week timeframe).  

  Analyse whether the Meridian case demonstrates that historical objectivity is impossible. In your answer:  
  (a) Explain how the dispute between A and B differs from a factual disagreement.  
  (b) Evaluate whether *either interpretation* can be deemed ‘objective’ by at least three distinct criteria (e.g., fidelity to evidence, procedural impartiality, relational utility).  
  (c) Argue whether the tragedy/farce disagreement admits of truth or resolution.  
  (d) State one concession a defender of objectivity must make, and one a radical sceptic (à la Hayden White) must make, to avoid reducing this dispute to mere aesthetics."**  

  ---

  ### 2. Model Answer (852 words)  

  #### (a) The Nature of the Disagreement  
  The Meridian historians disagree not about facts but *emplotment* – the narrative structure imposed on facts. White’s insight is pivotal: the Trace’s brute facts lack inherent tragic or comic form. Historian A organizes events into a *tragedy* (conflicting duties, inevitable downfall); B frames identical events as *farce* (absurdity, vanity, incompetence). This is a conflict of *meaning*, not evidence. The third historian’s paratactic chronology proves that unprocessed facts lack narrative coherence, while the fourth exposes unexamined *frameworks* (state-centric agency, temporal myopia) shared by A and B. The dispute resides in the *metahistorical* layer: the conceptual and aesthetic scaffolding built *upon* the facts.  

  #### (b) Three Construals of Objectivity  
  - **Correspondence Objectivity (Rankean):** Demands fidelity to the Trace. *Verdict:* Both A and B satisfy this. Their facts are unassailable. Yet this cannot resolve the conflict, proving correspondence *necessary but insufficient* for objectivity.  
  - **Procedural Objectivity (Carr):** Relies on intersubjectively reproducible methods (source criticism, contextualisation). *Verdict:* Both historians deploy sound methods. But shared procedures yield divergent narratives, exposing method’s inability to constrain emplotment.  
  - **Relational Objectivity (Carr’s "Historical Facts"):** Facts become "historical" only when selected and interpreted for present purposes. *Verdict:* Tragedy might objectively illuminate leadership ethics; farce might better diagnose systemic dysfunction. Here, objectivity is *functional*: each account is "objective" relative to its investigative aim.  

  **Asymmetry:** The Trace *excludes* certain emplotments (e.g., a heroic triumph) by lacking supporting facts, but *underdetermines* all plausible narratives (tragedy/farce). This residue of constraint distinguishes history from fiction: fiction faces no such evidentiary bounds.  

  #### (c) Is the Disagreement Truth-Apt?  
  Yes, but not empirically resolvable. The conflict is *theoretically* truth-apt but *practically* indeterminate.  
  - **What would settle it?** Not new facts (the Trace is complete), but:  
    1. **Framework Scrutiny:** The fourth historian’s critique opens truth-apt debate. If the supply network (not the state) is the true agent, or if causes lie in the prior decade, both A and B’s frameworks may be *objectively inadequate*.  
    2. **Explanatory Power:** Which narrative better integrates *all* Trace elements? If "bungling" (B) ignores evidence of structural constraints A highlights, B’s account may be *objectively reductive*.  
    3. **Ethical Coherence:** If the Trace reveals conscious moral dilemmas, framing events as *farce* (denying agency) may be objectively misleading.  
  Resolution requires meta-debate about *appropriate scales, agencies, and explanatory priorities* – a higher-order objectivity.  

  #### (d) Necessary Concessions  
  - **Defender of Objectivity must give up:** The illusion that objectivity guarantees a *single* narrative. The Trace’s underdetermination forces acknowledgement of *plural legitimate interpretations*, constrained but not dictated by evidence. Objectivity lies in the *discipline* of evidence, not the *elimination* of perspective.  
  - **Radical Sceptic (White) must give up:** The claim that history is *indistinguishable from fiction*. The Trace excludes infinite narratives (e.g., alien intervention). White’s scepticism, if consistent, must admit that evidence *asymmetrically constrains* narratives – a minimal objectivity that anchors history in the past.  

  #### Conclusion  
  The Meridian case does not negate objectivity but redefines it. Objectivity is not monolithic "truth" but a *gradient*: correspondence to evidence (achieved), procedural rigour (achieved), and relational utility (context-dependent). The tragedy/farce dispute is truth-apt only at the level of framework justification and explanatory coherence. History’s objectivity persists not in narrative singularity, but in evidence’s power to *exclude* the indefensible and *demand* interpretive accountability. Without this residue of constraint, history collapses into fabulism; with it, objectivity survives as a regulative ideal.  

  ---

  ### 3. Marking Scheme (20 points total)  
  **Each of 5 moves = 4 marks**  

  | Move | First-Class Answer (4 marks) | Mediocre Failure Mode (2 marks) |  
  |------|-----------------------------|--------------------------------|  
  | **1. Locates the Disagreement** | Explicitly contrasts *factual agreement* with *narrative/emplotment conflict*; uses White to show facts lack inherent form. | Labels historians (e.g., "A is constructivist") but does not pinpoint the *metahistorical* layer of framing. |  
  | **2. Analyses 3+ Objectivity Construals** | Clearly defines and applies 3+ types (e.g., correspondence/procedural/relational); shows how verdict on A/B *changes* by type; notes *asymmetry* (constrains without determining). | Lists definitions without applying to case; misses asymmetry; conflates objectivity types. |  
  | **3. Truth-Aptness & Resolution** | Argues decisively whether disagreement is truth-apt; proposes non-empirical criteria for resolution (e.g., framework adequacy, explanatory scope). | Claims disagreement is "subjective" or "only about style"; suggests "more evidence" despite trace-completeness. |  
  | **4. Concessions for Objectivity/Scepticism** | Identifies *specific* sacrifices (e.g., objectivist: single narrative; sceptic: fiction/history equivalence); links to Trace constraints. | Vague concessions (e.g., "be less rigid"); ignores Trace’s constraining power. |  
  | **5. Synthesis & Stance** | Takes a position (e.g., "redefined objectivity possible"); uses Meridian to *defend* it; integrates asymmetry to distinguish history/fiction. | Summarises positions without synthesis; avoids committing to a verdict. |  

  **Fail (0 marks/move):** Misrepresents case, ignores key elements (e.g., third/fourth historian), or relies on labels/dialectic without engaging the Trace.
