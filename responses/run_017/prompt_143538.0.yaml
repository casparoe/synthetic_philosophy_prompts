  - **Case Description**: Player 1 submits **PROVE** (cooperates iff it finds a proof that the opponent cooperates against it). Player 2 submits **PRUDENT** (the retaliatory variant from verdict (viii); cooperates iff it proves the opponent would retaliate—i.e., play D against defection). Both see each other's source.
