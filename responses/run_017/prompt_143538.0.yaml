  Under each rule set, the chapter would commit to a specific principle for "genuine" cooperation:
  - **If Rule Set 1 (Strategic Conditioning)**: Cooperation is genuine if programs enforce it through *any* conditional response to the opponent's source, regardless of implementation. This emphasizes *outcome-based enforcement*: Cooperation must be a best response to the opponent's strategy, and deviations would break it. The chapter focuses on incentive alignment.
  - **If Rule Set 2 (Symmetric Mechanism)**: Cooperation is genuine only if programs enforce it through *identical conditional mechanisms*. This emphasizes *procedural symmetry*: Mutual enforcement requires programs to "speak the same language" (e.g., both use proofs or both use source-identity). The chapter prioritizes mechanistic uniformity to avoid "imbalanced" pairs like PROVE/ALWAYS-C.

