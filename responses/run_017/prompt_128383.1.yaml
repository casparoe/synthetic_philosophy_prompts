  Hmm, the user wants me to act as a professional philosopher with experience in cross-cultural survey work to draft a joint statement between moral realists and variationists about moral objectivity. This is for a metaethics course study group that's having heated debates about cross-cultural variation in moral judgments.

  The user has very specific requirements: I need to disambiguate different senses of "objectivity," use a three-way taxonomy for moral disagreements, incorporate three hypothetical study designs as crux probes, and address whether the variationist's tools are themselves culturally variable. The format needs numbered agreed claims followed by a disagreements table and a section on the probes.

  I'll start by clarifying the four dimensions of objectivity they mentioned: mind-independence (do moral facts exist independently of us?), universality (are true moral claims the same everywhere?), convergence (would we agree under ideal reflection?), and authority (are moral demands non-negotiable?). Both sides might agree on some but not others.

  For the taxonomy of disagreements, I'll organize them as: Type 1 - same principles, different factual/metaphysical beliefs; Type 2 - same principles, different weighting; Type 3 - different moral properties or domain boundaries.

  For the study probes: 
  1) Vocabulary-switch: Present identical scenarios framed in rights/honor/purity language to see if judgments track facts or framing. 
  2) Reflective-convergence: Ask what an ideal community member would say and whether they'd revise after generalization. 
  3) Bicultural-salience: Test people fluent in two moral frameworks with one made salient.

  I'll structure the document as requested: about 10 substantive agreed claims that go beyond undergraduate level, a disagreements table with neutral statements and each side's position, and a section detailing predictions for each probe and what each side would concede if wrong.

  Key agreed claims might include: recognition of substantial variation (beyond WEIRD samples), that variation isn't random but patterned, that Type 1 disagreements are most common, that framing effects exist but are bounded, etc. The disagreements will focus on whether Type 3 cases fundamentally challenge realism, whether convergence under ideal conditions is possible, and the nature of moral authority.

  For the probes, realists will predict that judgments track facts regardless of framing, that reflection leads to convergence, and that bicultural people maintain core morality despite surface switching. Variationists will predict framing dominates, reflection doesn't converge, and bicultural people show deep switching. Each side will have meaningful concessions if proven wrong.

  I'll keep it under 1200 words with substantive claims that genuinely represent common ground while clearly marking where disagreements remain. The goal is to create a document both sides could sign after good-faith debate, not a watered-down compromise.
answer: |-
  ## Joint Statement on Moral Variation and Objectivity

  **Preamble:** After sustained dialogue examining cross-cultural data (including WEIRD critiques, small-scale societies, honor cultures, and studies on framing, market integration, and kinship intensity), we, a moral realist (MR) and a moral variationist (MV), affirm the following points of agreement and clarify our remaining disagreements. We distinguish four dimensions of "objectivity":
  1.  **Mind-Independence (MI):** Moral facts exist independently of human beliefs/attitudes.
  2.  **Universality (UNIV):** True core moral claims hold across all cultures.
  3.  **Convergence (CONV):** Idealized reflection (full information, impartiality, rationality) would lead moral judgments to converge.
  4.  **Authority (AUTH):** Moral demands possess practical non-negotiability, overriding other considerations.

  We classify disagreements as:
  *   **Type 1 (T1):** Shared principle, divergent factual/metaphysical belief (e.g., "harm matters" + disagreement on whether ritual causes harm/ancestors mind).
  *   **Type 2 (T2):** Shared principle, divergent weighting/lexical priority (e.g., "harm matters" vs. "loyalty matters" – which trumps when?).
  *   **Type 3 (T3):** Divergent candidate moral properties or moral domain boundaries (e.g., is purity *moral* or merely conventional/religious?).

  **Agreed Claims:**

  1.  **Substantial Variation Exists:** Cross-cultural data robustly demonstrates significant variation in *expressed moral judgments*, *salient considerations*, and *justifications* across diverse populations, far exceeding variation observed within typical WEIRD samples on many issues. This variation is non-random and often predictable based on socio-ecological factors.
  2.  **Variation is Structured:** Much observed variation falls under **T1** (e.g., harm interpretations in ancestor rituals, resource distribution norms based on beliefs about desert/need/cosmic order). **T2** disagreements (e.g., honor vs. fairness weighting) are also empirically common and significant. **T3** disagreements (e.g., moralization of purity, loyalty, specific forms of respect) are empirically attested and constitute the most theoretically challenging variation.
  3.  **Framing Effects Are Real:** How a situation is described (e.g., rights vs. honor vs. purity language) demonstrably influences moral judgments *within and across cultures*. This sensitivity is a key feature of moral cognition.
  4.  **Domain Boundary Disputes are Central:** Significant cross-cultural friction arises precisely over whether certain domains (e.g., purity, hierarchy, specific forms of loyalty) belong to the *moral* realm or to convention, etiquette, religion, or prudence. These disputes are not merely verbal.
  5.  **Within-Culture Variance is High:** Significant moral disagreement exists *within* all studied cultures. Attributing variance solely *between* cultures is empirically inaccurate; the fraction varies by issue.
  6.  **Measurement is Non-Neutral but Possible:** All measurement tools (surveys, interviews, vignettes) reflect theoretical commitments and cultural framings. However, careful design (e.g., ethnographic grounding, multiple methods, reflexivity) allows for meaningful cross-cultural data collection and comparison. The MV acknowledges their tools are part of the varied landscape; the MR argues tools can access shared core features.
  7.  **"Ideal Reflection" is Contentious:** Both sides agree that asking people about idealized versions of their own community members or about generalized reasons is methodologically complex. Neither side believes *current* convergence/non-convergence in such probes *definitively* settles MI or UNIV, though each has interpretations.
  8.  **Moral Psychology is Culturally Scaffolded:** The development and operation of moral cognition are deeply influenced by cultural learning, practices, and institutions. There is no credible "view from nowhere" accessible to untutored human intuition.

  **Remaining Disagreements:**

  | Neutral Statement of Disagreement                                                                 | Realist (MR) Position (Focus: MI, UNIV, CONV, AUTH)                                                                 | Variationist (MV) Position (Focus: Debunking MI, Denying UNIV/CONV, Contextualizing AUTH)                                                                 | Crux & Testability                                                                                                                                                                                                                                                                                               |
  | :------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Significance of Type 3 (T3) Disagreements**                                                  | T3 disagreements often mask underlying T1/T2 issues or involve error/misidentification of true moral properties. True moral properties (e.g., wellbeing, fairness, basic rights) are universal, even if locally misrecognized. | T3 disagreements reflect fundamental differences in the *constitution* of the moral domain. Concepts like "purity" or "hierarchical duty" are genuinely moral in some frameworks, not errors regarding universal properties. | **Crux:** Are T3 disagreements resolvable under ideal reflection by revealing shared core properties (MR) or do they represent incommensurable frameworks (MV)? <br>**Probe:** *Vocabulary-Switch*: If judgments track *framing* even when factual harm/benefit is identical & salient, this favors MV. If judgments track underlying described facts *despite* framing, favors MR. |
  | **2. Convergence Under Idealized Conditions**                                                     | Sufficiently idealized reflection (full non-coercive information, impartiality, rationality) would lead to convergence on core moral truths (CONV). Non-convergence stems from non-ideal conditions. | CONV is unlikely. Different starting points (frameworks, values) lead rational, informed, impartial agents to substantively different conclusions within their own coherent systems. Convergence signals shared background, not MI. | **Crux:** Does the idealization procedure presuppose a specific (likely WEIRD) moral framework, or can it be framework-neutral? <br>**Probe:** *Reflective-Convergence*: If bicultural or diverse samples *converge significantly* on revised judgments after ideal reflection probes, favors MR. Persistent, reasoned divergence favors MV. Both agree non-convergence *now* doesn't disprove CONV, but sustained divergence under probing is MV-favouring. |
  | **3. Source of Moral Authority**                                                                  | Moral demands possess AUTH (non-negotiable, overriding force) *because* they track MI truths about reasons that bind all rational agents. Variation reflects error or incomplete access. | AUTH is experienced as inherent but is conferred by culturally specific frameworks and commitments. Its "overridingness" is contextually variable and negotiable within frameworks. No extra-framework grounding exists. | **Crux:** Can the phenomenology of AUTH and its cross-cultural presence be fully explained by cultural frameworks alone (MV), or does it require an external source (MR)? <br>**Probe:** *Bicultural-Salience*: If bicultural individuals report a *single* source of non-negotiable authority regardless of salient framework, favors MR. If they report the source/strength/scope of authority *shifts* with salient framework, favors MV. |

  **Predictions on Key Probes & Concessions:**

  1.  **Vocabulary-Switch Probe:**
      *   **MR Prediction:** Judgments will primarily track the *described facts* (e.g., physical/psychological harm, benefit, rights violation) once made clear, with framing having a secondary, often strategic or emphatic, effect. Core wrongness remains detectable across frames.
      *   **MV Prediction:** Judgments will show strong sensitivity to framing. Identical underlying facts described in rights vs. honor vs. purity terms will elicit significantly different levels of condemnation, justifications, and perceived core wrongness within *and* across cultures.
      *   **MR Concession if MV Wins:** If framing dominates even with clear, salient facts, it significantly challenges the accessibility/robustness of mind-independent facts and suggests judgments are more framework-dependent than believed.
      *   **MV Concession if MR Wins:** If judgments robustly track described facts across frames, it suggests a stronger, perhaps universal, sensitivity to core features (like harm/benefit) underlying diverse moral framings.

  2.  **Reflective-Convergence Probe:**
      *   **MR Prediction:** After sustained, scaffolded reflection (considering generalizability, full consequences, impartial perspectives), significant convergence will emerge across diverse cultural starting points on core issues (e.g., prohibitions on unprovoked violence, torture, basic fairness norms), revealing shared rational grounds.
      *   **MV Prediction:** Reflection will lead to greater *internal* coherence within starting frameworks but persistent, reasoned divergence *between* frameworks on core values, priorities (T2), and domain boundaries (T3). Convergence will be limited to thin, formal principles or heavily context-dependent.
      *   **MR Concession if MV Wins:** Sustained, reasoned divergence under idealizing conditions seriously challenges CONV and, indirectly, UNIV/MI.
      *   **MV Concession if MR Wins:** Robust convergence on substantive norms under deep reflection would provide strong evidence for CONV and challenge strong variationist claims about incommensurability.

  3.  **Bicultural-Salience Probe:**
      *   **MR Prediction:** Bicultural individuals will report a core, unified sense of moral authority (AUTH) and wrongness, even if they express it differently or emphasize different *applications* depending on context/salience. Switching is pragmatic expression, not core belief change.
      *   **MV Prediction:** Bicultural individuals will report shifts in the *source*, *content*, and *experienced force* (AUTH) of moral demands depending on which cultural framework is salient. Switching reflects accessing different normative worlds.
      *   **MR Concession if MV Wins:** If salience reliably shifts reports of the *source* and *non-negotiable content* of core moral demands, it undermines the MR view of a single, framework-independent grounding for AUTH.
      *   **MV Concession if MR Wins:** If bicultural individuals consistently report a single, underlying source and core content of moral authority resistant to framing salience, it supports the MR view of a unified grounding for morality.

  This document reflects points of hard-won agreement and clarifies the precise nature and empirical stakes of our fundamental disagreements. We commit to these formulations as accurately representing our respective positions and the shared empirical landscape.
