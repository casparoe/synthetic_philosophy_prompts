  First, I recall the deterministic G-S proof hinges on the "pivotal voter" concept. When a voter changes their ballot, the outcome jumps discretely from one alternative to another. This jump creates a situation where the voter can force an outcome, leading to dictatorship. Randomization replaces jumps with continuous probability shifts. Under first-order stochastic dominance (FOSD), moving probability mass slightly doesn't create a strict improvement, so no single voter can force outcomes.

  The user's intuition about convexity seems correct. The convex outcome space allows continuous changes, preventing pivotal jumps. But I should check if other factors matter. The "onto" condition still holds for lotteries, and FOSD-based strategy-proofness is weaker than deterministic incentive compatibility. However, the key is indeed the convexification.

  Now, the skeptic's challenge: is randomization just making preferences thin? The user proposes testing with extension-robust strategy-proofness. I think both their versions collapse back to FOSD-strategy-proofness. If a lie gives a lottery not FOSD-dominated by truth, there exists some utility function where it's better. So requiring strategy-proofness for all completions adds nothing beyond FOSD-SP. This means the skeptic is partially right—randomization works because FOSD has sparse comparisons—but it's not a cheat because FOSD is the standard extension.

