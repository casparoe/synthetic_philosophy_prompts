prompt: |-
  Hey — I'm in a philosophy of emotion seminar this term and I've got a short paper due (about 1200 words) on some real practice that seems to presuppose a view about what emotions are. I want to do the criminal law one and I'd really like your help getting it framed before I start writing.

  Here's the practice, more or less as we got it in class. In the standard textbook version of provocation / heat-of-passion doctrine, an intentional killing that would otherwise be murder gets reduced to manslaughter only if: (a) there was adequate provocation; (b) the defendant actually was provoked; (c) a reasonable person would have been provoked too; and (d) there wasn't enough time between the provocation and the killing for the defendant to cool off. There's also the old rule that words on their own aren't adequate provocation, and I think some places have quietly dropped the suddenness bit, but I definately don't care about the exact current state of the law anywhere — use the textbook version, and tell me if the answer would turn on which jurisdiction's version you take.

  What's bugging me is that the pieces seem to pull in different directions. Condition (c) treats the emotion as something that can be correct or incorrect, reasonable or unreasonable — that sounds like the judgement view or the perception view. But (d) and all the heat talk treats it like a quantity of intensity that decays on its own if you wait, which sounds much more like the feeling view. And (a) and (d) care about the content of the emotion and about its timing in a way that none of the three theories we read seem to care about — none of them says anything about how long an emotion is supposed to last, or about what it even means to wait one out rather than revise it.

  So: what theory of emotion does the doctrine actually presuppose? Can a single view cover all four conditions, or is the doctrine a grab bag? Which conditions strictly need which theory, and which ones would two or three different views license equally happily? What would have to change in the doctrine if we went full judgement theory, or full just-a-feeling theory? And here's my half-baked idea — maybe the law is committed to a fourth picture we never discussed: emotions as episodes with a characteristic shape over time, so that still being furious an hour later becomes something you're answerable for in a way that being furious in the first two minutes isn't. Is that genuinely a fourth option, or is it one of the three in a costume?

  Please don't give me citations or a reading list; I'll fill those in myself, and I honestly can't remember who argued for what anyway.

  Could you give it back in these sections, roughly:

  - The implicit theory (about 300 words): reconstruct in one piece the view of emotion the doctrine needs.
  - What it strictly needs vs. what it merely sits well with (about 200).
  - Where several theories would license the same doctrine (about 150).
  - Counterfactual doctrine (about 200): what would change under a pure judgement view, and under a pure feeling view.
  - On the time-shape idea (about 150): fourth option or a disguise?
  - Where I'd change my mind (about 150): the argument or case that would flip your verdict, and where your reconstruction is most likely to crack.

  Also flag as you go anywhere you're guessing rather than confident — I'd rather have an honest hedge than a smooth story I can't defend in section.
reasoning: |-
  Okay, the user is working on a philosophy paper about the criminal law doctrine of provocation and its implicit theory of emotion. They've outlined the four conditions of the doctrine and pointed out tensions between them that seem to align with different philosophical theories of emotion. The user is particularly interested in whether the doctrine presupposes a single coherent theory or is a "grab bag," and they're floating an original idea about emotions having a characteristic time-shape.

  Hmm, the user is clearly grappling with how to reconcile the doctrine's conflicting elements. On one hand, condition (c) suggests emotions can be reasonable/unreasonable (judgment/perception theories), while (d) treats emotion like a physical quantity that decays (feeling theory). The user's frustration about content/timing mismatches is spot-on - none of the standard theories explicitly address duration or "cooling off" periods.

  The user's half-baked time-shape idea is actually quite perceptive. It might bridge the gap by seeing emotion as a process with normative phases. But I should be careful not to overstate this - it could just be a pragmatic legal fiction rather than a philosophical theory. Need to acknowledge where I'm speculating (like about the "episodic" interpretation).

  For the structure, I'll follow their requested sections but keep the analysis tight. The "where it would crack" part is crucial - they want to defend this in seminar, so I should flag the weakest points (like whether "reasonable emotion" truly requires cognitive theory, or if feeling theory could stretch to accommodate it through socialization narratives).

  Notably, they don't want citations - good, this keeps the focus on conceptual mapping. The challenge is making the implicit theory reconstruction coherent without forcing false unity. The compromise position might be that the doctrine hybridizes theories operationally while leaning on folk psychology about anger's "heat." 

  On counterfactuals: pure judgment theory would collapse (c) into reasonableness of beliefs, ignoring intensity/timing. Pure feeling theory would make (c) nonsensical ("reasonable rage" becomes an oxymoron). This contrast should clarify why the doctrine needs both. 

  User seems analytically sharp - they're aware the law might not be philosophically consistent. I should validate that insight rather than impose artificial coherence. Their time-shape idea deserves serious engagement as a potential fourth dimension beyond standard taxonomy.
answer: |-
  Here’s a reconstruction structured per your request, with hedges flagged explicitly:

  ---

  ### 1. The Implicit Theory (≈300 words)  
  The doctrine presupposes a **hybrid somatic-cognitive theory** where emotions are:  
  - **Intense somatic disturbances** (feelings) that *physiologically peak and decay* over time (condition d, "heat" metaphor). The "cooling off" period treats emotion as a wave of autonomic arousal that naturally subsides unless reignited.  
  - **Cognitive appraisals** with propositional content tied to provocation (condition a: "adequate" provocation implies the emotion must track a *legitimate grievance*, e.g., infidelity vs. insult). Condition (c) further requires this appraisal to be *objectively justified*—not just sincere (b) but *warranted* by community standards.  
  - **Time-bound episodes** with a normative arc. The "suddenness" requirement (even if relaxed) implies anger has a canonical trajectory: ignition (provocation), peak (heat), dissipation (cooling). Lingering beyond this arc reframes rage as a chosen state, not an "overwhelming" force.  

  This view blends William James-style somaticism (emotion as bodily change) with a Martha Nussbaum-like cognitive appraisal (emotion as value-laden judgment). The law treats anger as a *temporary crisis of agency*: a "reasonable person" might lose control *if* provoked gravely (c), *when* the body is flooded (d), but *only* if the mind correctly registers an intolerable wrong (a). **Hedge**: The "episodic" framing is my interpretive leap; the doctrine doesn’t explicitly theorize time-shapes.

  ---

  ### 2. Strict Needs vs. Merely Sits Well With (≈200 words)  
  - **Strictly needs**:  
    - *Cognitive appraisal* for (a) and (c). Without evaluative content, "provocation" is meaningless; "reasonableness" requires adjudicating the *merits* of the emotion.  
    - *Somatic intensity* for (d). "Cooling off" assumes affective energy dissipates passively—a feeling-theory commitment. Judgment/perception theories lack this decay mechanism.  
  - **Sits well with**:  
    - *Perception theories* (e.g., emotions as perceptions of value). They accommodate (a)/(c) but struggle with (d)’s passive decay.  
    - *Basic emotion theories* (innate, physiological). They explain (d) but falter at (c)’s reasonableness standard.  

  **Hedge**: The law’s "reasonable person" might be a pragmatic fiction, not a philosophical claim about emotion’s nature.

  ---

  ### 3. Where Multiple Theories License the Same Doctrine (≈150 words)  
  Conditions (a) and (c) could be satisfied by **judgment, perception, or even social-constructivist theories**—all agree emotions have intentional objects assessable for fit. Condition (b) ("actual provocation") is neutral: any theory acknowledging subjective experience works. The "words alone" rule (rejecting insults as "adequate") fits any view prioritizing *gravity of harm* over inner feeling. **Hedge**: If a feeling theory defined "provocation" purely neurologically, (a)/(c) collapse, but no jurisdiction does this.

  ---

  ### 4. Counterfactual Doctrine (≈200 words)  
  - **Pure judgment theory** (e.g., Solomon): Emotions are evaluative judgments.  
    - *(d) vanishes*: No "heat" to cool; you’d ask if the *judgment* was hasty or irrational, not if time passed.  
    - *(c) dominates*: Reduction hinges *only* on whether a "reasonable person" would share the defendant’s evaluative belief (e.g., "My honor was destroyed"). Cooling time is irrelevant.  
  - **Pure feeling theory** (e.g., James-Lange): Emotions are perceptions of bodily states.  
    - *(a)/(c) collapse*: Provocation’s "adequacy" makes no sense; only intensity matters. "Reasonable person" standard becomes incoherent (feelings aren’t reasonable/unreasonable).  
    - *(d) expands*: Any intense feeling (fear, envy) could trigger reduction if it caused loss of control.  

  ---

  ### 5. On the Time-Shape Idea: Fourth Option or Disguise? (≈150 words)  
  Your idea is **genuinely distinct** but *compatible* with existing theories. It treats emotions as **temporally structured processes** with phases (onset, peak, resolution). This isn’t reducible to:  
  - *Judgment* (which focuses on content, not duration).  
  - *Feeling* (which lacks narrative shape).  
  - *Perception* (which is punctual, not phased).  
  The law’s "suddenness" norm implies anger has an *expected duration*; exceeding it shifts blame to the agent. **But** this could be seen as a *pragmatic overlay* on somatic/cognitive components (e.g., "peak" = somatic intensity; "resolution" = cognitive reappraisal). **Hedge**: This may be a folk-psychological, not philosophical, model.

  ---

  ### 6. Where I’d Change My Mind (≈150 words)  
  My reconstruction cracks if:  
  - **Condition (d) is purely evidentiary, not conceptual**. If "cooling off" is just *proof* that the emotion wasn’t overwhelming (not a metaphysical claim about emotion’s duration), the somatic decay element weakens.  
  - **"Reasonable emotion" (c) is strictly behavioral**. If courts mean only "would a reasonable person *act* violently?"—not "*feel* justified rage"—the cognitive requirement crumbles.  
  - **Historical analysis shows "heat" is purely metaphorical**. If "heat-of-passion" originated as a moral excuse (not a physiological claim), the somatic reading is anachronistic.  
  **Weakest point**: The time-shape idea. If cooling time is *only* about opportunity to regain self-control (not emotion’s intrinsic arc), your fourth option collapses into agency theory, not emotion theory.

  ---

  **Jurisdictional note**: The core tensions hold across common-law versions. Modern reforms (e.g., dropping "suddenness") may downplay somatic decay but retain reasonableness/content demands. The hybrid theory remains resilient.
