prompt: |-
  I lead a small evaluation group that is about to spend eighteen months building a Bongard-style benchmark of few-shot visual concept induction — the format in which a solver is shown six figures on one side that share a rule and six on the other that violate it, and must state or apply the rule that separates them. Two of my six people are conceptually rather than empirically trained: they read ML papers, specify tasks, and analyse results, but they will not be training or fine-tuning models. The benchmark specification freezes in about four months, so I have to decide now what those two work on, and in what order, because their answers should change how the benchmark is built: what ground truth gets stored, which diagnostics ship alongside accuracy, whether we produce matched variants of each item at all.

  The space as I currently see it has these pieces: with twelve examples, infinitely many rules separate the two sets, and accuracy on held-out items drawn from the same generator cannot tell us whether a system found the intended rule or merely one that happens to hold in that generator's accidental regularities — palette, stroke width, layout artefacts, the renderer's habits. Separately, a failure on any given item could be a perceptual failure, a failure to search over candidate rules, or a failure to check a candidate rule against what was perceived, and it is not obvious to me which dominates or how to tell them apart without training anything. And it is not obvious what the target is: an inductive bias resembling ours, or something like the correct rule under changes of surface realization, and these can come apart if human solvers are themselves relying on accidental regularities.

  Two operationalizations I keep circling: first, cross-renderer adjudication — generate the same rule under a second, deliberately different surface generator, breaking the accidental correlations while preserving the intended one, and score transfer between the two; second, composition and negation transfer — take two rules a system has already solved, and test it on items requiring their conjunction or the complement of one, on the thought that genuine concept possession should be compositional in a way that pattern matching is not.

  I do not want a survey of the area and I do not want papers to read. I want a defended priority ordering of three or four questions for those two people, each with: what it is upstream of and which design decision it settles before the spec freezes; whether it is tractable for people who will not run experiments; whether it is neglected relative to its leverage; and what empirical result over the coming year would move it up or down the list. Say explicitly where you would trade tractability for importance and where you would not. If one of my two operationalizations is a distraction, or is settled by an argument I have not considered rather than by an experiment, say so and say why.

  Attach a confidence estimate to each of your ordering claims, and single out the recommendation you are least confident in, with the observation that would most quickly dislodge it.
reasoning: |-
  We are given a fixed timeline: benchmark specification freezes in four months. We have two conceptually trained team members who will not run experiments. Their work should directly inform the benchmark design, specifically:
     - What ground truth gets stored?
     - Which diagnostics ship alongside accuracy?
     - Whether we produce matched variants of each item (e.g., via different renderers, or composition/negation variants).

   The key challenges are:
    1. The problem of multiple valid rules (infinitely many rules can separate the 12 examples) and the need to ensure that the system has learned the intended rule, not an accidental regularity.
    2. Diagnosing the cause of failure: perceptual failure, failure in rule search, or failure in rule checking.
    3. Defining the target: should the system have an inductive bias similar to humans, or should it be robust to changes in surface realization? These might conflict if humans rely on accidental regularities.

   The two operationalizations the user is considering:
    A. Cross-renderer adjudication: Generate the same rule with a different renderer (breaking accidental correlations) and test transfer.
    B. Composition and negation transfer: Test on conjunctions or complements of rules the system has already solved.

   We need a priority ordering of 3-4 questions for the two team members. Each question should be described with:
    - What it is upstream of (which design decision it settles)
    - Whether it is tractable without running experiments
    - Whether it is neglected relative to its leverage
    - What empirical result in the next year would change its priority.

   We must explicitly state where we trade tractability for importance and where not.
   We must also critique the two operationalizations if needed and attach confidence estimates.

   Analysis:

   The core problem is that we cannot rely solely on accuracy on held-out items from the same generator because of the multiple rule issue. We need to design the benchmark to allow for better diagnostics.

   Proposed questions for the two team members:

   1. **Question 1: How can we best structure the benchmark to disambiguate the intended rule from accidental rules?**
      - **Upstream of**: What ground truth to store? The need for multiple renderers? Whether to generate items that break accidental regularities.
      - **Tractable without experiments?** Yes. This is a conceptual design problem. They can analyze the space of possible accidental regularities and propose ways to break them (e.g., by varying palettes, stroke widths, layouts, etc.) without running experiments. They can design the metadata that needs to be stored (e.g., which variations were used) and how to generate the items to have controlled variations.
      - **Neglected?** Yes, because many benchmarks focus on accuracy without worrying about the rule that was actually learned. The leverage is high: it addresses the core problem of multiple rules.
      - **Empirical result that changes priority**: If early experiments show that models are not sensitive to the accidental regularities we worry about, then this becomes less critical. But we don't have such experiments, so we must assume it is critical.

   2. **Question 2: How to design diagnostics to distinguish between perceptual failures, rule search failures, and rule checking failures?**
      - **Upstream of**: Which diagnostics ship alongside accuracy? Also, the design of the items (e.g., having items that are perceptually easy but rule-wise hard, or vice versa).
      - **Tractable without experiments?** Partially. They can propose a taxonomy of failure modes and design the benchmark to include probe items that target each failure mode. However, without experiments, they cannot validate the effectiveness of these probes. But they can design the probes conceptually. We trade tractability for importance here because this is crucial for diagnostic value. We can design the probes now and validate them later.
      - **Neglected?** Very. Most benchmarks report only accuracy. Having detailed diagnostics would be a major contribution.
      - **Empirical result**: If it turns out that one failure mode dominates (e.g., perceptual failures are rare in modern vision models) then we might simplify the diagnostics. But we don't know that yet.

   3. **Question 3: What is the target? Should we aim for human-like inductive bias or robustness under surface changes? And how do we handle cases where these conflict?**
      - **Upstream of**: The entire benchmark philosophy: whether we generate multiple renderers (if we choose robustness) or aim for a fixed renderer that matches human expectations (if we choose human-like). Also, whether we include items that test for compositionality (if we choose robustness) or not.
      - **Tractable without experiments?** Yes. This is a conceptual and philosophical question. They can review literature on human concept learning and robustness in ML to form a position. They can also design the benchmark to capture both (e.g., by having a human baseline and then testing for transfer) but we need a guiding principle.
      - **Neglected?** In the context of Bongard problems, the target is often implicit (human-like). Making it explicit is novel and high-leverage.
      - **Empirical result**: If it turns out that models that are robust to surface changes also perform better on human-like problems (or vice versa) then we might adjust. But the decision must be made upfront.

   4. **Question 4: How to operationalize compositionality and negation?**
      - **Upstream of**: Whether we produce matched variants (composition and negation versions) of each item. Also, what ground truth to store (e.g., the atomic rules and their compositions).
      - **Tractable without experiments?** Yes. They can design the structure of the rules to be compositional (e.g., define a set of atomic rules and how to compose them) and design the generation of items for composed rules. This does not require training models.
      - **Neglected?** Compositionality in Bongard problems is under-explored and has high leverage for testing concept understanding beyond pattern matching.
      - **Empirical result**: If early results show that models are already compositional without explicit training, then the variants might be less critical. But we don't know.

   Now, the two operationalizations:

    - Cross-renderer adjudication: This is a good idea and directly addresses the multiple rule problem. It is not a distraction. It is an implementation of the idea of breaking accidental correlations. However, it requires generating the same rule with multiple renderers. This should be part of the answer to Question 1.

    - Composition and negation transfer: This is a good test for compositionality. It should be included if we decide that compositionality is a target (which it should be, for genuine concept possession). However, note that it does not directly address the multiple rule problem. It is a different angle. It is not a distraction, but it might be more about testing the systematicity of the learned concepts.

   Priority ordering:

   We have four months until the spec freezes. The highest priority should be given to the questions that have the most impact on the fundamental structure of the benchmark.

   1. **Question 3 (Target: human-like vs robustness)**: This is the most foundational. It will guide the entire benchmark. Without deciding this, we cannot design the variations. (Confidence: 90%)
   2. **Question 1 (Disambiguating the intended rule)**: This is the core of the multiple rule problem. It will determine whether we use multiple renderers and what ground truth we store. (Confidence: 85%)
   3. **Question 4 (Compositionality and negation)**: This is about the structure of the rules and the generation of variants. It is important but less foundational than the first two. (Confidence: 80%)
   4. **Question 2 (Diagnostics for failure modes)**: This is important for the diagnostic value of the benchmark, but it builds upon the other decisions. We can design the diagnostics once we know the structure of the benchmark. (Confidence: 75%)

   However, note that the two team members can work in parallel. But the ordering reflects the dependencies.

   Trade-offs:

    - We are trading tractability for importance in Question 2: we will design the diagnostics without experimental validation because it is too important to skip. We can adjust later if needed.

   Critique of operationalizations:

    - Cross-renderer adjudication: This is a good idea and should be part of the solution to Question 1. It is not settled by argument alone because we don't know if the accidental regularities are actually a problem in practice until we test. But we can design the benchmark to include multiple renderers and then use transfer as a metric. This is an empirical matter. However, the team members can design the renderers to be sufficiently different without running experiments.

    - Composition and negation: This is a good idea and should be part of the benchmark. But note that it does not replace cross-renderer testing. They address different concerns. It is not settled by argument: we need to see if models can transfer to compositions. But we can design the benchmark to include these variants.

   The recommendation I am least confident in is the priority of Question 2 (diagnostics for failure modes) at the end. If we had evidence that one failure mode dominates, we might prioritize it more. The observation that would dislodge this ordering: if early experiments (by other team members) show that perceptual failures are negligible in modern vision models, then we might not need such detailed diagnostics and could focus more on rule search/checking. But without that, we must design for all.

   Revised priority ordering (with confidence):

   1. Question 3 (90%): What is the target? (human-like vs robustness)
   2. Question 1 (85%): Disambiguating the intended rule (multiple renderers, etc.)
   3. Question 4 (80%): Compositionality and negation
   4. Question 2 (75%): Failure mode diagnostics

   But note: the decision on the target (Question 3) will affect how we approach disambiguation (Question 1). For example, if we choose human-like, then we might use a single renderer that is designed to be natural for humans, and then disambiguation might be done by human validation. If we choose robustness, then we require multiple renderers.

   Therefore, I am confident in the top two. The least confident recommendation is putting Question 2 last, because it might turn out that without good diagnostics the benchmark is less useful. But given the dependencies, it is the right order.

   Let me explicitly state:

    - We trade tractability for importance in Question 2: we will design the diagnostics without experiments because it is critical to have them, even if they are not validated yet.

    - We do not trade tractability in the other questions because they are already tractable without experiments.

   Final ordering:

    1. Question 3 (Target)
    2. Question 1 (Rule disambiguation)
    3. Question 4 (Compositionality)
    4. Question 2 (Failure diagnostics)

   However, note that the two team members might work on multiple questions in parallel. The ordering is for when the decisions are needed in the design process.

   Now, attach confidence estimates to the ordering:

    - The overall ordering: 80% confidence. The most uncertain part is the relative priority of compositionality and failure diagnostics. If we get new information that failure modes are critical and we need to design the benchmark around them, then Question 2 might move up.

   Single out the least confident recommendation: 
     - Putting Question 2 last. 
     - What observation would dislodge it? If we get early results (from other team members or external literature) showing that in Bongard-style problems, the dominant failure mode is rule search (say, 70% of failures) and that perceptual failures are rare, then we might need to design the benchmark to focus on rule search. That would require a different set of diagnostics and might push Question 2 to be addressed earlier.

   Implementation note: The two team members should start with Question 3 and Question 1 in parallel, because they are the most foundational and they are linked. Then they can move to Question 4 and Question 2.

   But the priority order for decision-making is as above.

   Let's write the defended ordering:

   1. **Question 3: Defining the Target**  
      - **What it settles**: The benchmark's philosophical stance: whether we prioritize human-like inductive bias or robustness under surface changes. This decision will guide whether we use multiple renderers (to test robustness) and how we validate the rules (e.g., by human agreement or by transfer).  
      - **Tractable without experiments**: Yes, by conceptual analysis and literature review.  
      - **Neglected**: Yes, because benchmarks rarely make this explicit.  
      - **Empirical result that changes priority**: If a study shows that human solvers are highly sensitive to accidental regularities (making human-like and robustness goals conflict strongly), we might have to revisit. But we must decide now.  
      - **Confidence in this ordering**: 90%  

   2. **Question 1: Rule Disambiguation**  
      - **What it settles**: The structure of the benchmark items to break accidental regularities (e.g., multiple renderers) and what ground truth to store (e.g., the renderer parameters, the intended rule, and the variations).  
      - **Tractable without experiments**: Yes, by designing the renderers to vary the critical attributes.  
      - **Neglected**: Very, as most benchmarks do not address the multiple rule problem.  
      - **Empirical result**: If early experiments show that models are not fooled by accidental regularities, then we might simplify. But we must assume they are.  
      - **Confidence in this ordering**: 85%  

   3. **Question 4: Compositionality and Negation**  
      - **What it settles**: Whether and how to generate items that test composed rules and negations, and what ground truth to store (e.g., the atomic rules and composition operations).  
      - **Tractable without experiments**: Yes, by designing a grammar of rules and their compositions.  
      - **Neglected**: Compositionality is under-studied in Bongard benchmarks.  
      - **Empirical result**: If evidence emerges that compositionality is not a challenge for models, then we might reduce the number of such items.  
      - **Confidence in this ordering**: 80%  

   4. **Question 2: Failure Mode Diagnostics**  
      - **What it settles**: The additional diagnostics (beyond accuracy) that we ship, and the design of probe items to isolate failure modes.  
      - **Tractable without experiments**: Partially. We can design the probe items and diagnostics, but without experimental validation. We trade tractability for importance.  
      - **Neglected**: Extremely, since diagnostics beyond accuracy are rare.  
      - **Empirical result**: If we find that one failure mode is dominant, we might focus the diagnostics.  
      - **Confidence in this ordering**: 75% (this is the least confident placement)  
      - **Observation to dislodge**: Evidence that perceptual failures account for less than 10% of errors in a pilot study, then we might push it down. Conversely, if rule search failures are rare, we might also adjust. But without data, it stays here.

   The two operationalizations are not distractions. Cross-renderer adjudication is a key part of Question 1. Composition and negation transfer is a key part of Question 4. They require implementation in the benchmark generation, but they are not settled by argument alone. We must include them and then let the experiments (by others) show how well they work.
answer: |-
  ### Defended Priority Ordering for Benchmark Design Questions

  I recommend the following priority ordering for your conceptually trained team members, based on leverage, tractability without experiments, and alignment with your four-month deadline. The goal is to maximize impact on the benchmark's core structure before specification freeze. Confidence estimates are calibrated against your constraints (e.g., no model training required).

  ---

  #### **1. Question: How do we disambiguate the intended rule from accidental regularities?**  
  *(Highest Priority; Confidence: 90%)*  
  - **Upstream of**: Ground-truth storage requirements, renderer diversity strategy, and whether cross-renderer validation is mandatory.  
  - **Tractable without experiments?** **Yes**. Your team can:  
    - Catalog common accidental regularities (e.g., palette, stroke width, layout artifacts) by analyzing existing Bongard datasets and generative models.  
    - Design rules with *minimal sufficient complexity* (e.g., rules that break if an accidental regularity is altered).  
    - Specify metadata to store (e.g., renderer parameters, intentional vs. accidental features).  
  - **Neglected leverage**: Critical and underexplored. Most benchmarks assume "held-out accuracy" suffices, but this fails for concept induction.  
  - **Empirical result that changes priority**: If empirical work (e.g., from your other team members) shows models consistently ignore accidental regularities, deprioritize to #2.  
  - **Trade-off**: Prioritizing importance over tractability here is non-negotiable. This question *must* be settled first—it defines the benchmark’s integrity.

  #### **2. Question: Should the target be human-like inductive bias or surface-realization robustness?**  
  *(Confidence: 85%)*  
  - **Upstream of**: Diagnostic design (e.g., whether to include human-solver baselines), renderer variation strategy, and rule complexity.  
  - **Tractable without experiments?** **Yes**. Your team can:  
    - Analyze conflicts via edge cases (e.g., rules where humans rely on accidental regularities).  
    - Propose a hybrid target (e.g., "robustness when humans are robust, else human-like").  
    - Draft test cases to pit human bias against surface invariance.  
  - **Neglected leverage**: High. ML benchmarks rarely formalize this trade-off, yet it affects generalization claims.  
  - **Empirical result that changes priority**: If early results show human solvers *never* rely on accidental regularities, move to #3. If they *always* do, move to #1.  
  - **Trade-off**: Tractability suffices. Conceptual clarity here prevents downstream redesigns.

  #### **3. Question: Is composition/negation transfer necessary for diagnosing concept possession?**  
  *(Confidence: 75%)*  
  - **Upstream of**: Whether to generate composition/negation variants for all rules, and diagnostic suite design.  
  - **Tractable without experiments?** **Yes**. Your team can:  
    - Define compositionality criteria (e.g., if a solver passes rules A and B, must it pass A∧B?).  
    - Identify rules where composition/negation *should* hold (e.g., geometric primitives) vs. where it shouldn’t (e.g., abstract correlations).  
    - Design minimal metadata to support compositional testing.  
  - **Neglected leverage**: Moderate. Composition is often discussed but rarely operationalized in Bongard benchmarks.  
  - **Empirical result that changes priority**: If empirical work reveals compositionality failures are rare, deprioritize. If dominant, move to #2.  
  - **Trade-off**: Prioritize importance. Not running experiments *does not hurt* here—design now, validate later.

  #### **4. Question: How can we diagnostically distinguish perceptual vs. rule-search failures?**  
  *(Lowest Priority; Confidence: 70%)*  
  - **Upstream of**: Diagnostic suite (e.g., including "perceptual control" items), granularity of ground truth.  
  - **Tractable without experiments?** **Partially**. Your team can:  
    - Design "trap items" (e.g., images where perception is trivial but rule search is hard, or vice versa).  
    - Propose failure taxonomies and link them to metadata (e.g., store segmentation masks to audit perception).  
    - But: Requires *some* empirical input (e.g., human difficulty ratings) for calibration.  
  - **Neglected leverage**: High, but less urgent. Failure diagnostics are absent in most benchmarks.  
  - **Empirical result that changes priority**: If early solver results show near-perfect perception (e.g., on control tasks), deprioritize further. If perception errors dominate, move to #3.  
  - **Trade-off**: **Trade tractability for importance**. Design the framework now; refine with others’ empirical data later.

  ---

  ### Critiques of Your Operationalizations  
  - **Cross-renderer adjudication**: **Essential, not a distraction** (aligned with Question #1). It directly addresses accidental regularities. However, it’s *not settled by argument*—it requires generator design (e.g., "How different must renderers be?"). Your team can specify renderer divergence criteria (e.g., varied palettes, stroke styles) without experiments.  
  - **Composition/negation transfer**: **Valuable but secondary** (aligned with Question #3). It tests systematicity but doesn’t resolve accidental regularities. If a solver uses pattern matching, it may still pass composition if the training set is biased. Prioritize after core disambiguation.  

  ### Least Confident Recommendation  
  - **Question #4 (Failure diagnostics) at lowest priority**.  
    - **Why low confidence?** It may be more urgent if perception is a known bottleneck, but your description suggests rule search/abstraction is the crux.  
    - **Observation to dislodge it**: If a pilot study (e.g., with humans or off-the-shelf models) shows >50% of failures stem from perception (e.g., misclassifying shapes), move it to #2 immediately.  

  ### Summary Workflow  
  1. **Months 1–2**: Team tackles #1 (rule disambiguation) and #2 (target definition). This locks renderer diversity and ground-truth requirements.  
  2. **Months 2–3**: Team addresses #3 (composition) and drafts #4 (diagnostics).  
  3. **Month 4**: Integrate findings into benchmark spec (e.g., renderer pairs for cross-validation, composition variants, diagnostic hooks).  

  This ordering maximizes conceptual impact before the freeze while using your team’s strengths. All questions are tractable without experiments if focused on *design* over validation.
