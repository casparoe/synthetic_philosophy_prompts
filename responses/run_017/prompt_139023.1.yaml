prompt: |-
  I am putting together a lecture on the methodological critique of evolutionary psychology — the charge that its explanations are unfalsifiable narratives invented to fit whatever behavior happens to have been observed — and I want a case that runs in the other direction: an adaptationist hypothesis that a careful skeptic should concede is doing genuine scientific work, even though it displays every formal vice on the critics' list. So I would like you to build me one.

  Take the following as stipulated findings from a single large, preregistered, multi-site study. I have invented them for the purposes of the exercise; treat them as given rather than as claims to check or to reconcile with the literature. Adults sleep measurably worse on the first night in an unfamiliar bedroom than on the second night in that same room, and worse than in their own bedroom. The size of the deficit tracks the novelty of the room — its layout and soundscape — and is unaffected by the room's comfort, temperature, and noise level. It is not reduced by giving subjects credible and true information that the room is perfectly safe, and it is unrelated to how safe they report feeling. It is much smaller in adults who slept in a large number of different rooms during childhood. It is asymmetric: on that first night one hemisphere responds more strongly than the other to unfamiliar sounds, and the asymmetry is absent on the second night and at home. And it appears with roughly the same magnitude in samples from five countries whose actual night-time risks differ enormously.

  Now invent, strictly after the fact, an adaptationist explanation of exactly this pattern, subject to the following constraints. State the mechanism as an input-output rule together with an explicit error-management trade-off, in information-processing terms: no invented neuroanatomy, no fictional technology, no imagined fossil or archaeological discoveries. Do not rescue it by claiming that selection is powerful, or that complex functional organization must have an adaptive explanation; whatever earns the hypothesis its standing has to be a structural feature it possesses, not the adaptationist assumption itself. Do not reach for the standard parade of examples — no kin selection, reciprocity, mate choice, pathogen avoidance, or cheater detection. Every confirmatory test must be one a well-equipped laboratory could run this decade. And the case must be one in which the skeptic retains a real objection: I want a hypothesis that is good science, not one that has been stipulated to be immune.

  Give me exactly five numbered points, no more than two sentences each, with no preamble and no closing summary.

  1. The hypothesis, stated as an input-output rule with its error-management trade-off, including why the mechanism's failure to take safety information as an input is a prediction rather than an embarrassment.
  2. At least two consequences it has that go beyond the stipulated findings, that the obvious alternative — discomfort, stress, or general hyperarousal — does not yield, and that could be tested now.
  3. Why each of the three standing objections fails to land on this hypothesis in particular: that it was generated after the fact to fit data already in hand; that there is no evidence about ancestral environments; and that some other story, including a by-product story, could always be told instead.
  4. The single feature doing the work: name it, and show that deleting it while leaving everything else in place turns the hypothesis back into the kind of story the critics are right to dismiss.
  5. The strongest objection a skeptic who grants all of the above should still press, together with the most honest reply available, including a statement of what would refute the hypothesis.
reasoning: |-
  Hmm, the user is putting together a lecture on evolutionary psychology critiques and wants a strong counterexample - an adaptationist hypothesis that seems methodologically flawed but actually does proper scientific work. They've provided detailed fictional findings about the "first-night sleep effect" and want me to construct a hypothesis under strict constraints.

  The findings are interesting: people sleep worse in novel environments regardless of actual safety, with hemispheric asymmetry that disappears after the first night. The effect is stronger in those with less varied childhood sleeping environments and appears cross-culturally.  

  I need to create an adaptationist explanation that meets several challenging constraints: it must be stated as an input-output rule with error management; generate novel testable predictions; address three common objections; have one crucial feature that makes it scientific; and acknowledge a valid skeptical counterargument. All while avoiding standard evolutionary psychology tropes.

  For the core hypothesis, I'm considering a "novel environment vigilance mechanism" that trades off sleep quality for threat detection. The key insight is that safety information shouldn't override it because ancestral threats couldn't be reliably communicated - that's actually a prediction, not a flaw.  

  For novel predictions, I'm thinking about how the mechanism should respond to invisible barriers and olfactory cues - things that wouldn't affect general hyperarousal but would trigger an evolved threat detector.  

  To address objections: the post-hoc nature is mitigated because the hypothesis makes risky predictions; ancestral evidence isn't needed because the mechanism's design reveals its function; and alternative explanations fail to explain the precise pattern of findings.  

  The crucial feature is the "informationally encapsulated" nature of the mechanism - if removed, it becomes just another unfalsifiable story.  

  Finally, the strongest remaining objection is about evolutionary plausibility - whether ancestral sleep environments actually posed such threats. The honest reply is that while we can't prove it, the mechanism's specificity makes non-adaptive explanations less parsimonious, and we can test its design features against alternatives.  

  This should give the user exactly what they need - a hypothesis that looks vulnerable to standard critiques but withstands scrutiny through specific design features.
answer: |-
  1. Input: Novel environmental signatures (spatial layout cues, soundscape patterns). Output: Unilateral hemispheric alertness suppressing deep sleep. Trade-off: Accepts frequent false positives (reduced sleep in safe novelty) to avoid catastrophic false negatives (undetected predation threat in dangerous novelty). Safety information is ignored because ancestral threats couldn't be reliably signaled verbally; the mechanism's design reflects that constraint.

  2. (i) The vigilance asymmetry should *increase* if an invisible barrier (e.g., transparent shield blocking physical access) is placed around the bed in the novel room, whereas general hyperarousal should decrease. (ii) Introducing a single, unfamiliar, evolutionarily-relevant olfactory cue (e.g., predator scent masked below conscious detection) on the *second* night should reinstate the full first-night deficit, which discomfort theories wouldn't predict.

  3. (i) *Post-hoc generation*: Its novel predictions (Point 2) are inherently risky and testable now, moving beyond the original data. (ii) *No ancestral evidence*: The specific computational trade-off and informational encapsulation (ignoring safety assurances) reveal design logic independent of specific fossil evidence. (iii) *Alternative stories*: No plausible by-product explains the *precise* trigger (novelty signatures), asymmetry, resistance to safety info, and childhood exposure effect *together* without invoking function.

  4. **Informational Encapsulation**: The mechanism's imperviousness to explicit safety information as an input is its defining structural feature. Removing this encapsulation—allowing safety info to override the alertness response—destroys the predicted error-management logic and renders it unfalsifiable ("it adjusts based on everything").

  5. **Objection**: The proposed selective pressure (nocturnal predation in unfamiliar locations) might be insufficiently strong/recurrent in ancestral environments to shape such a specific mechanism. **Reply**: While absolute certainty is impossible, the mechanism's costly, specific design (reduced sleep, hemispheric asymmetry) is poorly explained by weaker pressures or drift. **Refutation**: Demonstrating the full effect pattern (asymmetry, childhood exposure link, etc.) in a species with well-established *no* ancestral history of sleeping in novel, high-predation-risk locations.
