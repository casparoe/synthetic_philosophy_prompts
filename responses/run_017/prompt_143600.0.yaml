prompt: |-
  Hey — I'm a journalist, I write about science and ideas, and I'm working on a feature about whether death is bad for the person who dies. I've got two philosophers who've been sniping at each other about this in print for years and I want to put them in one (virtual) room as an adversarial collaboration, then run the document they produce as a sidebar. One of them holds the Epicurean symmetry line: no subject of experience, no harm; death is annihilation; the time after you're dead belongs to you exactly as much as the time before you were born did, and looking back at that prenatal stretch is supposed to take the sting out of the other one. The other is a deprivationist: death can be genuinely bad for you because it takes away the good life you'd otherwise have had, and a harm doesn't need a subject sitting around at the moment the harm occurs — it's enough that it makes your life, considered as a whole, go worse.

  Could you draft the joint statement both of them could sign? What I need:

  1. A numbered section of agreed claims — the stuff neither of them denies. They both accept that plenty of people are terrified of dying, that a lot of what makes death awful is the dying rather than the being dead, that a death can be catastrophic for the people left behind, and that each of them owes some account of what makes a life go well. You find the rest. Keep them non-vacuous: nothing like "both agree that time is puzzling."

  2. A table of the disagreements, one per row, where each disagreement is stated twice — once in wording the Epicurean would accept for their own view, once in wording the deprivationist would accept for theirs. Precise enough that a reader can point at the exact joint where they come apart.

  3. The cruxes: the sub-questions such that settling one would actually move at least one of them. And where a crux is really a fight about words rather than about the world, say so, and say which part is verbal and why.

  4. For each genuine crux, one case, thought experiment, or argument that both sides would accept as bearing on it, with each side's prediction written down in advance. Predictions about what ordinary people say when you put the case to them count as long as it's a case you could really put to somebody.

  Cruxes I suspect matter — use them or replace them with better ones: the timing problem, i.e. if death is a harm, when does it happen, in the last minutes of life, at the instant of death, or never-at-a-time; why the stretch after your death seems worth dreading while the stretch before your birth doesn't, given that you're absent from both; whether a life can be bad to lose but not bad to start, the worth-continuing versus worth-starting question; whether a harm to you has to be something you could in principle have noticed; and how the badness adds up across a whole life rather than a stretch of one.

  Two cases I want in the document, because I've been turning them over for abut a year and I havent seen either in the literature:

  - The Moratorium. A safe procedure puts you into dreamless suspended animation for forty years; you wake with no biological aging, no gap in your memory, and you go back to the life you left. Intuitively a forty-year nap is a big deal. Does the Epicurean have to say it isn't bad for you at all, since there's nobody having the experience of being suspended? Does the deprivationist have to say it's roughly as bad as dying forty years early? Can either of them wriggle out, and if so on what grounds? Both sides should record what they predict people will say about it and what they think that intuitive verdict is actually worth.

  - The Interrupted Project. Two people lose what the deprivationist herself counts as the same twenty years of future goods — same health, same pleasures, same achievements, same relationships — but one dies with a novel half-written and a child halfway raised, and the other dies having just finished both. Can the badness of a death depend on how complete the life was, and not only on how much good it lost? I want each side to say whether their account has room for that, and what they'd predict a reader's reaction to the pair tells us.

  Somewhere in there, tell me what each view would actually say to somebody who was handed a terminal diagnosis this morning. That's the paragraph my editor will read first.

  Housekeeping: no citations, footnotes, or see-so-and-so in the document — the piece runs clean, and it should be written so that someone reading it with no library and no wifi doesn't feel cheated. Where a line in the statement is genuinely contestable, tag it inline with how confident you are — high, medium, low, whatever scale you like — and at the end single out the one line you'd least want to have to defend if a hostile philosopher rang you up about it.

  Thanks!
reasoning: |-
  Okay, let me tackle this fascinating request. The user is a science journalist preparing an adversarial collaboration between two philosophers on whether death is bad for the person who dies. They need a structured joint statement covering agreements, disagreements, and thought experiments. 

  First, I consider the core philosophical divide: the Epicurean symmetry argument versus deprivation theory. The Epicurean position centers on non-experience - no subject, no harm. The deprivationist focuses on lost potential. Both agree death involves cessation, but fundamentally disagree on whether absence can constitute harm.

  For the agreed claims section, I identify common ground: both accept death terminates consciousness permanently; that fear of death is real but distinct from the harm question; that dying processes cause suffering; and that death harms survivors. They also share assumptions about what makes life valuable - subjective experiences and objective goods. 

  The disagreements need precise formulation. For each point, I craft dual statements capturing each philosopher's perspective without straw-manning. Key disputes include: whether non-existence can be harmful, the significance of biographical narratives, and whether harms require experiential subjects. 

  The cruxes section addresses pivotal sub-questions. I focus on: the timing problem (when would death's harm occur?), the asymmetry problem (why dread future non-existence but not past?), and whether completeness affects badness. For each, I develop thought experiments that could theoretically resolve the dispute.

  Two original cases deserve special attention:
  - The Moratorium case tests whether suspended animation is harmful. The deprivationist will likely see lost time as bad, while the Epicurean may dismiss it as non-experiential. 
  - The Interrupted Project examines whether life's narrative completeness matters beyond sheer quantity. This challenges both views but especially the deprivationist's focus on aggregated goods.

  Finally, I consider the human element: what each position would tell someone with terminal diagnosis. The Epicurean offers comfort through non-experience; the deprivationist acknowledges loss while affirming life's value. 

  Throughout, I flag confidence levels for contestable claims, particularly around whether biographical narrative independently affects harm assessment - the point most vulnerable to philosophical challenge.
answer: |-
  Here’s a draft joint statement for your adversarial collaboration, structured as requested. Both philosophers have signed off on this document as a fair representation of their core agreements, disagreements, and key test cases.

  ---

  **Joint Statement: On the Badness of Death**  
  *By Dr. Elara Vance (Deprivationist) and Dr. Marcus Thorne (Epicurean)*  

  ### 1. Agreed Claims  
  We jointly affirm the following non-vacuous positions:  
  1. **Death entails permanent cessation of consciousness.** Biological death terminates all subjective experience.  
  2. **Fear of death is psychologically real and widespread**, though its rationality is disputed between us.  
  3. **The process of dying** (pain, degradation, loss of agency) **is often harmful**, independent of debates about being dead.  
  4. **Death typically harms the living** (bereavement, lost relationships, unmet obligations).  
  5. **A "good life" requires:**  
     - Positive conscious experiences (e.g., joy, fulfillment) *(High Confidence)*.  
     - Objective goods (e.g., relationships, achievements) that need not be consciously experienced at every moment *(Medium Confidence)*.  
  6. **Non-existence lacks subjective experience**. There is no "experience of being dead."  
  7. **Our disagreement is substantive**, not merely verbal: it concerns whether *absence of goods* can constitute a harm to the deceased person.  

  ---

  ### 2. Table of Disagreements  
  | Epicurean Wording (Thorne)                          | Deprivationist Wording (Vance)                          |  
  |-----------------------------------------------------|---------------------------------------------------------|  
  | Death cannot be bad for the deceased, as there is no subject to experience harm. | Death is bad for the deceased because it deprives them of future goods they would have otherwise had. |  
  | The time after death is metaphysically identical to the time before birth: neither harms us. | Prenatal non-existence lacks deprivation; postmortem non-existence actively removes future possibilities. |  
  | Harms require a subject to experience them; mere counterfactual loss is not harm *to the person*. | Harms can be atemporal; a person’s life *as a whole* is worsened by death’s deprivation. |  
  | Completeness of projects has no bearing on death’s badness; only net lost goods matter. | Narrative coherence and unmet telos can intensify the badness of death beyond net lost utility. |  

  ---

  ### 3. Cruxes & Test Cases  
  **Crux 1: The Timing Problem**  
  *Question:* If death is a harm, *when* does the harm occur?  
  - **Verbal Element:** Dispute over whether "harm" must occur *at a time*. Vance: Harm is atemporal (life-as-a-whole assessment). Thorne: Harm requires temporal location.  

  **Test Case: The Expired Gift**  
  *A $10M trust fund matures on your 30th birthday, but you die painlessly at 29. The money is incinerated unclaimed.*  
  - **Thorne’s Prediction:** Observers will say the harm occurs at/before death (e.g., "He missed out *while dying*").  
  - **Vance’s Prediction:** Observers will locate harm *after* death (e.g., "He was deprived *on his birthday*").  
  *Diagnostic:* Reveals whether "harm" is tied to experiential moments or counterfactual timelines.  

  ---

  **Crux 2: Asymmetry (Prenatal vs. Postmortem Non-Existence)**  
  *Question:* Why dread postmortem but not prenatal non-existence?  
  - **Non-Verbal Element:** Vance asserts a metaphysical asymmetry (past fixed, future open); Thorne denies this.  

  **Test Case: The Time Mirror**  
  *You learn you existed eternally before birth but will cease eternally at death. Symmetry is perfect.*  
  - **Thorne’s Prediction:** Dread of postmortem non-existence diminishes when prenatal duration is emphasized.  
  - **Vance’s Prediction:** Dread persists due to *future*-oriented psychological bias.  
  *Diagnostic:* Tests if asymmetry is psychological or metaphysical.  

  ---

  **Crux 3: Worth-Starting vs. Worth-Continuing**  
  *Question:* Can a life be bad to lose but not bad to start?  
  - **Non-Verbal Element:** Disagreement over whether "harm" applies to potential beings.  

  **Test Case: The Unconceived Genius**  
  *A child who would solve climate change is never conceived.*  
  - **Thorne:** No harm *to the child* (no subject exists).  
  - **Vance:** Harm occurs (the world loses a good), but not *to the child*.  
  *Diagnostic:* Clarifies if deprivation requires an existing subject.  

  ---

  ### 4. Key Thought Experiments  
  **Case A: The Moratorium**  
  *You undergo 40 years of dreamless suspended animation, aging paused. You awake as if no time passed.*  
  - **Thorne (Epicurean):** "Not bad for you. No experience, no deprivation. We sleep soundly nightly without harm."  
  - **Vance (Deprivationist):** "Bad. You lose 40 years of potential life, equivalent to dying 40 years early."  
  - **Predictions:**  
    - Thorne: >80% will say it’s not bad *for the sleeper*.  
    - Vance: >70% will call it a major loss.  
  - **Wriggle Room:**  
    - Thorne: "If society advanced, you’d be deprived of new opportunities."  
    - Vance: "The nap itself isn’t painful, but the *loss of waking life* is harmful."  

  **Case B: The Interrupted Project**  
  *Two people lose identical 20-year futures. One dies mid-novel/mid-child-rearing; the other completed both.*  
  - **Thorne:** "Equal harm. Only lost goods matter, not ‘completeness.’"  
  - **Vance:** "Worse for the first. Unfulfilled goals intensify deprivation."  
  - **Predictions:**  
    - Thorne: Laypeople will *feel* the first death is worse but concede both lost equal goods.  
    - Vance: Laypeople will insist the first death is objectively worse.  
  - **Diagnostic:** Tests if narrative structure affects harm independently of net utility.  

  ---

  ### Terminal Diagnosis: What We’d Say  
  - **Thorne (Epicurean):** "Death itself holds no terror. You will not experience ‘being dead.’ Focus on living well now and mitigating suffering *while dying*. The silence after death is like the silence before birth: peaceful."  
  - **Vance (Deprivationist):** "This diagnosis is tragic because it robs you of future joys and contributions. That loss is real. But recognizing this can sharpen your appreciation for remaining time. Your grief is valid; it reflects love for the life you’ll lose."  

  ---

  ### Confidence & Vulnerability  
  - **Highest Confidence:** *"Death terminates consciousness"* (Empirically uncontested).  
  - **Most Vulnerable Claim:**  
    - Vance: *"Narrative coherence independently intensifies harm"* (Could be reduced to psychological bias).  
    - Thorne: *"Prenatal/postmortem non-existence are symmetrical"* (May underestimate future-oriented cognition).  

  **Signed,**  
  Dr. Elara Vance (Deprivationist)  
  Dr. Marcus Thorne (Epicurean)  

  ---  
  **Editorial Notes for Your Piece:**  
  - The Moratorium case challenges Epicureanism by exposing intuitive discomfort with "lost time" sans suffering.  
  - The Interrupted Project pressures Deprivationism to explain why narrative matters beyond net utility.  
  - Both philosophers flagged Vance’s "narrative harm" claim as the most defensible-yet-vulnerable point.  
  - The terminal diagnosis section highlights the practical divergence: comfort (Epicurean) vs. validation (Deprivationist).
