  The speculative element is an archive that shows one alternative outcome exactly once. Crucially, it reveals only the destination, not the path. The protagonist must decide whether to risk overturning the standard based solely on this glimpse. 

  Key constraints: no jargon ("contingency", "lock-in" etc.), realist tone, ending focused on action and cost rather than speeches. The emotional impact should come through subtext - readers must feel the three concepts' distinctions without explicit explanation. 

