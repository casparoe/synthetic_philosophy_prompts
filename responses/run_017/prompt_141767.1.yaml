  ## The Weight at Riverton Bend

  Riverton lived and breathed by the iron gauge. Four feet, eight and a half inches. The precise width that dictated the size of every railcar rolling into the sprawling yards, the dimensions of the loading cranes that swung like arthritic giants over the docks, the very spacing of the warehouses lining the sluggish Brown River. Elias Thorne, Chief Inspector of Track and Way, knew its tyranny in his bones. He measured deviations with micrometer eyes, heard the protest of a misaligned wheel long before others. His father had died under a jack-slipped boxcar – a death pinned, the inquest concluded, on "imperfect adherence to gauge tolerances." Riverton’s prosperity, its soot-stained brick facades and humming factories turning river clay into specialized kiln bricks shipped nationwide, rested on that exacting, unyielding width.

  The Municipal Archives were dusty and smelled of damp paper and neglect. Elias was there reluctantly, chasing a phantom discrepancy in a 1923 track survey for a drainage repair. He pulled a heavy, leather-bound volume labeled "Infrastructure Proposals – Rejected, 1890-1910." It was mostly dry minutes and cost estimates for bridges never built. Then, tucked between pages discussing sewer lines, a brittle, oversized blueprint crackled free. It wasn't sewer lines. It was a station.

  But not Riverton Station as Elias knew it. This station was grander, airier. The platforms weren't the cramped, familiar 4'8.5" width he policed daily; they were wider, more generous. The rail lines themselves… they were drawn to a different scale. Five feet, maybe? The notation was faded, but the implication was clear. The docks depicted weren't the current, congested jetties where barges strained against narrow slips; they were deeper, broader, designed for larger vessels. The schematic showed warehouses set further back, implying larger stockyards. A caption, almost illegible, read: "*Proposed Broad-Gauge Integration Hub – Riverton Expansion (Alternate Vision)*." *Alternate Vision*. The words buzzed in his skull.

  He blinked, expecting the familiar cramped lines of Riverton’s reality to snap back. Instead, the vision deepened. He didn't *see* the town evolving; he simply *knew* its destination. The Brown River wasn't just a muddy conduit; it was a bustling artery feeding ocean-going ships that dwarfed the current barges. The kiln brick factories weren't just humming; they were roaring, producing not just bricks, but vast ceramic components – turbine housings, perhaps – loaded directly onto waiting trains with seamless, broad-platform efficiency. The air felt cleaner, somehow, charged with a prosperity less frantic, more substantial. Riverton wasn't just surviving on its narrow gauge; it was thriving on the broad one. *This is what they built instead*, the knowledge settled in him, cold and undeniable. *This is what Riverton became, starting from the same muddy bend, the same ambitions, but choosing a different width.*

  The blueprint slipped from his numb fingers, fluttering to the stone floor like a dying bird. When he looked again, it was just brittle paper, showing only the cramped, familiar lines of the *rejected* proposal. The vision was gone, leaving only the scent of dust and the crushing weight of the *what-is*.

  The knowledge didn't liberate; it paralyzed. It proved only one thing: **It could have been different.** The gauge wasn't destiny decreed at Riverton’s founding. It was an accident, a committee vote, a cheaper initial bid, a persuasive salesman for 4'8.5" rolling stock. Yet, seeing that other Riverton, the prosperous broad-gauge Riverton, didn't mean it was *meant* to be that way. It didn't mean the narrow gauge was a mistake condemned from the start. It only proved the starting point was a fork in the track, not a single destined path. Was the broad-gauge vision *better*? The archive showed the destination – prosperity – but not the cost of getting there. The upheaval, the bankruptcies, the years of chaos during the transition – the archive offered no ledger for that. Maybe the narrow gauge *was* the best possible outcome for the path actually taken. Or maybe not. The vision left that agonizingly open.

  And oh, the **lock** was absolute. Elias saw it everywhere now, with sickening clarity. The new bridge south of town? Engineered precisely for the existing gauge; widening it now would cost millions and halt all river traffic for a year. The specialized kilns? Their unique firing process relied on railcars of exact dimensions delivering raw clay and shipping finished bricks. Change the gauge, and the intricate dance of production shattered. Thousands of jobs, pensions, mortgages – all woven into the fabric of that specific width. To change it wasn't just an upgrade; it was demolition. Ruin. The cost of switching wasn't a natural law; it was the colossal monument built *around* the initial, accidental choice. It proved nothing about the choice itself being right or wrong, only that it had become the ground everything else stood upon.

  The whispers started. Elias, usually respected for his taciturn competence, became withdrawn, haunted. He spent hours staring at track junctions, at the narrow spaces between platforms and trains. He saw the inefficiency like blood seeping from a wound: the double-handling of goods, the limitations on cargo size, the constant, expensive maintenance to keep everything squeezed within the iron corset. He saw his father’s death not as an individual tragedy, but as a systemic flaw inherent in the cramped, straining system. The broad-gauge vision floated before him – not as a guaranteed paradise, but as a stark reminder of the *accident* that had shaped their world. It could have been otherwise. It wasn't inevitable. But *was* it better? The archive was mute on that count. And the cost… the cost was potentially everything.

  The crisis point came unexpectedly. A vital trestle bridge over Gantry Creek, weakened by spring floods, was deemed critically unstable. Repair using the existing, sub-optimal support structures designed for the narrow gauge was possible – a patch job, buying maybe five years. Or… they could rebuild entirely. Wider, stronger, *future-proofed*. The cost difference was astronomical, the disruption immense. The Town Council, led by Mayor Hendricks (whose family owned half the kilns), pushed hard for the patch. "Stick with what works, Elias," Hendricks boomed, clapping him on the shoulder. "Our gauge is our foundation. Why gamble on unproven width?"

  *Unproven*. The word echoed. The broad-gauge vision *was* proven, in that single, fleeting glimpse. Proven possible. Proven prosperous. But unproven in the cost of achieving it *from here*. Elias stood on the shuddering planks of the Gantry Creek bridge, the brown water swirling hungrily below. He held the repair schematics. The patch was drawn in thin, hesitant lines. The rebuild, sketched beside it by a junior engineer more hopeful than authorized, showed robust piers spaced for… more. Five feet, perhaps. It was a ghost of the archive’s vision.

  He knew the arguments. The patch was safe, known, cheaper *now*. It preserved everything built upon the narrow gauge. The rebuild was risk, expense, upheaval. It gambled Riverton’s present on a future glimpsed only once, in silence, on brittle paper. It risked ruin in the name of a prosperity that might, after unimaginable cost, match the one accidentally bypassed decades ago. The archive settled the past’s contingency: **It could have been otherwise.** It left the future’s optimality shrouded: **Was this path best?** And the crushing lock-in screamed: **Change is ruinously expensive *because* of the path taken.**

  Elias Thorne stood on the trembling bridge. Below him, the river, the town’s lifeblood and its cage. In his hand, the thin promise of preservation, and the heavy ghost of an alternate width. He thought of his father crushed by the weight of the inevitable. He thought of the airy platforms and deep docks he would never see. He thought of the thousands whose lives were bricks mortared into the existing walls.

  The Mayor expected the repair order. The crew waited for his word. The town held its breath, unaware it balanced on a knife-edge of historical accident.

  Elias didn't speak of contingency, lock-in, or convergence. He didn't speak at all. He walked to the bridge’s central weak point, the one the patch was designed to shore up. He looked not at the crumbling stone, but at the spacing between the rails – 4 feet, 8.5 inches – the measure of Riverton’s world.

  Then, Elias Thorne, Chief Inspector of Track and Way, raised the heavy wrench he carried and brought it down, not on a loose bolt, but with savage, final force onto the already cracked main support beam directly beneath the compromised joint. The sound was a sickening crack, louder than the river’s rush. Wood splintered. Metal shrieked in protest. The bridge groaned, a living thing wounded.

  He stepped back quickly as the structure lurched. Shouts erupted from the crew on the bank. Hendricks’s face, arriving at a run, was a mask of disbelief turning to horror. Elias didn't look at them. He watched the fracture widen, a dark mouth opening in the timber. He saw not destruction, but the necessary void before rebuilding could even be considered. **The cost began now.** His career, his freedom, likely his place in the town – all forfeit. He had chosen to force the rupture, to make the locked-in cost of change a present, catastrophic reality, gambling everything on the silent testimony of a ghost blueprint and the unbearable weight of *it could have been otherwise*. Whether Riverton would find the broad-gauge prosperity he’d glimpsed, or plunge into the ruin everyone feared, was a destination the archive had never shown him. The river flowed on, indifferent to the width of the tracks beside it.
