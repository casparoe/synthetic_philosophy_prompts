prompt: |-
  Hey — I'm doing a philosophy of medicine module this term (it's a joint honours, so half the room are medics and half of us are just philosophers) and I've got completely stuck on the naturalism vs normativism thing. My tutor keeps saying something like "no dysfunction without a history, no history without a selection story" and I sort of get it but it doesn't help me with the actual cases. My flatmate, who's a medic, says I'm just reinventing the harmful-dysfunction account badly; my cousin the physio says the whole question is a waste of time and we should only ever ask whether the person needs help. So I thought I'd write down my gut verdicts on a pile of cases and see whether anything actually fits them. Definately changed my mind twice on the deafness one while typing this.

  Cavities: a disease, even though nearly everyone I know has had one and the reason is the modern diet. Male pattern baldness at 55: not a disease. Sudden patchy hair loss at 24: a disease, and I can't say why that's different from the previous one. Lactose intolerance: not a disease, and I still think not even in a country where everyone drinks milk — although on my own view that seems inconsistent with cavities. Sickle cell trait: not a disease. Sickle cell disease: obviously a disease. Congenital deafness in someone who grew up signing in a Deaf family: I want to say not a disease, or at least not one they need treatment for. The same person losing their hearing at 40: a disease. My friend who used to run at club level and, after some viral thing, can now just about walk to the shops: ill, even though every test comes back normal and his exercise capacity is now exactly what an average sedentary 45-year-old man has. Long covid with normal bloods and scans: ill. ME/chronic fatigue: ill, and I get genuinely cross when people imply otherwise. Short because your whole family is short, nothing else wrong: not a disease. Exactly the same height but from growth hormone deficiency: a disease. Infertility at 78: not a disease. Infertility at 30: a disease. High cholesterol with nothing else wrong: I want to call it a risk factor rather than a disease, but I do want to call prediabetes a disease, which seems like I'm cheating. Internet gaming disorder and female sexual dysfunction: not diseases, or at least I suspect those are conditions that exist mainly because someone had a pill to sell. Asymptomatic atrial fibrillation picked up by someone's smartwatch: I lean towards disease. And chronic loneliness in an old man whose family moved away: I go back and forth on this one every single time I think about it. My flatmate has already pointed out that I accept ME on basically the same kind of evidence on which I reject internet gaming disorder, and I don't have an answer for her.

  The test I keep trying out is: something is a disease iff (a) some part of you isn't doing what it was shaped to do, or what it typically does in the relevant comparison group, and (b) that failing cuts against something the person themselves has reason to care about. But I can't work out what the comparison group is supposed to be — your age, your sex, your species, the population you actually live in, or your own baseline before you got worse? — and I can't tell whether (b) is about what the person wants or about what's bad for them whether or not they want it. So: can you either fix that test or give me one or at most three candidate principles that come closer, with each clause tied to the case that motivated it, and predictions for the cases I haven't listed — a gene that protects you against plague but gives you Alzheimer's at 75, ADHD in a classroom versus in a foraging band, mild high blood pressure in a 92-year-old, an asymptomatic brain aneurysm found by accident, obesity? Please be straight about which of my verdicts a principle can't save and which ones I'd have to give up, and say whether the honest answer is that I'm conflating disease with illness with sickness and should stop. Say in one sentence which famous view I'm closest to if you like, but don't build the answer around it — and no bibliography, no suggested reading, no citations, since I'd just be guessing at those anyway. British English please, and keep it under about 900 words.
reasoning: |-
  Okay, let me tackle this user's problem. They're stuck on the naturalism vs normativism debate in philosophy of medicine, specifically about what counts as a disease. Their tutor's mantra about dysfunction requiring a selection history isn't helping with real cases. The user listed various conditions where their intuitive judgments seem inconsistent, and their current test (dysfunction plus harm) feels messy. 

  First, I need to unpack why the user is struggling. They've given 20+ cases with nuanced verdicts, showing they grasp the complexity but can't systematize it. Their frustration with concepts like "comparison group" and "harm" is central. The medic flatmate calling it a "harmful-dysfunction reinvention" suggests they're circling around Wakefield's theory without quite nailing it. 

  The user's core tension: they want objective dysfunction (naturalism) but keep needing value judgments (normativism). Cases like congenital deafness vs acquired deafness show this perfectly - same physical state, different disease status based on personal impact. Their cholesterol vs prediabetes inconsistency reveals discomfort with purely statistical risks. 

  I should focus on building a practical framework that honors their intuitions while fixing the flaws. Three principles seem necessary: 
  1. Baseline dysfunction (using species-typical design to handle cavities/sickle cell) 
  2. Contextual harm (addressing deafness/infertility cases where social/situational factors matter) 
  3. Significant deficit (filtering out minor/normal variations like mild hypertension in elderly) 

  For their test's comparison group problem, I'll specify species-typical function as baseline but clarify that harm depends on individual context. The harm clause must blend personal distress and objective welfare - e.g., chronic loneliness qualifies if it damages health even if the person "accepts" it. 

  Notable verdicts to preserve: 
  - Their strong defense of ME/long COVID despite normal tests shows harm can exist without measurable dysfunction 
  - Rejecting "female sexual dysfunction" as invented reflects healthy skepticism of medicalization 
  But they'll need to adjust: 
  - Prediabetes can't be a disease if high cholesterol isn't (both are risk factors) 
  - Internet gaming disorder might need consistency with ME if evidence is similar 

  The Alzheimer's-plague gene case will test the framework: dysfunction (late-life cognitive failure) + harm (even if trade-off was beneficial earlier). Obesity would require checking for actual dysfunction (metabolic harm) not just statistics. 

  Final note: They're conflating disease (objective dysfunction) and illness (subjective experience), but that's actually productive - medicine needs both. Their view is Wakefield-esque but more flexible on harm. 

  Word count is tight - must avoid tangents about medicalization debates and stay focused on their cases. British English terms like "ill" not "sick" matter for their context.
answer: |-
  Right, let's ditch the jargon and build some practical principles directly from your cases. Your instincts are good, but the 'comparison group' problem highlights the naturalism/normativism clash. Here are three candidate principles designed to capture your verdicts, fix the test's flaws, and predict new cases:

  **Principle 1: Species-Typical Functional Design (The Naturalist Core)**
  *   **Clause:** A state is a dysfunction *iff* it significantly impairs a part's ability to perform a core function that was evolutionarily selected for in the human species *and* this impairment isn't a normal consequence of aging.
  *   **Motivated by:** Cavities (tooth decay impairs core digestive/dental function), Sickle Cell *Disease* (impairs oxygen transport core function), Growth Hormone Deficiency (impairs core developmental function), Sudden Hair Loss at 24 (impairs core protective/sensory? function abnormally early). Baldness at 55 gets a pass as 'normal aging'. Sickle Cell *trait* isn't a dysfunction.
  *   **Fixes your test:** Defines the baseline firmly as *human species-typical design*. Avoids messy population comparisons. "Shaped to do" means *by natural selection*.
  *   **Cost:** Forces you to accept Male Pattern Baldness at 55 is NOT a disease (as per your verdict). Also forces you to potentially accept Congenital Deafness *is* a dysfunction (impaired core sensory function), even if you don't think it *needs* treatment. Your 'harm' clause saves it later. Rules out internet gaming disorder as a *dysfunction* under this clause.

  **Principle 2: Contextual Harm (The Normativist Core)**
  *   **Clause:** A dysfunction becomes a disease *iff* it causes *significant harm* to the individual *in their actual life context*. Harm means either (i) significant subjective distress/suffering, *or* (ii) significant objective impairment of major life goals/activities typical for that person's stage of life/culture *without offsetting benefits*, *or* (iii) significant increased risk of future harm meeting (i) or (ii).
  *   **Motivated by:** Congenital Deafness in Deaf family (no harm, possibly benefit/neutrality in context ≠ disease), Same person losing hearing at 40 (significant harm/impairment in established context = disease), Infertility at 30 (impairs major life goal for that age = disease), Infertility at 78 (no significant impairment of typical life goals = not disease), Lactose Intolerance in milk-drinking society (potential harm/impairment = disease? *See prediction below*), Chronic Loneliness (significant distress/health risk = disease? *See prediction below*). Your friend with reduced exercise capacity (significant impairment of *his* prior capacity/goals = ill). ME/Long Covid (significant distress/impairment = ill).
  *   **Fixes your test:** Resolves the 'harm' ambiguity. It's *not* just what the person wants *now* (could be denial), nor purely objective welfare (ignores context). It blends personal experience, typical goals, and objective risk. Handles context (Deaf community, age).
  *   **Cost:** Might force you to accept Lactose Intolerance *is* a disease in a milk-drinking society (due to impairment/harm), aligning it with cavities. Your intuition might need adjusting here. Requires accepting that Congenital Deafness involves a *dysfunction* (Principle 1) but not necessarily a *disease* due to lack of harm *in context*.

  **Principle 3: Significant Deficit (The Threshold Filter)**
  *   **Clause:** Not every minor impairment or statistical deviation is a disease. The dysfunction must represent a *significant deficit* relative to the robust species-typical function, and the harm must be *substantial*.
  *   **Motivated by:** Short stature familial vs. GH deficiency (both might be 'deficits', but only GH deficiency implies a *dysfunction* per Principle 1). High Cholesterol (statistical risk factor, not necessarily a *dysfunction* per Principle 1 unless causing active harm *now*). Prediabetes (early *dysfunction* of glucose metabolism per Principle 1 + significant *risk* of future harm per Principle 2 = disease). Asymptomatic Atrial Fibrillation (*dysfunction* of electrical conduction + significant *risk* of harm = disease). Internet Gaming Disorder/Female Sexual Dysfunction (lack of clear *dysfunction* per Principle 1 + harm often contested/situational ≠ disease).
  *   **Fixes your test:** Prevents over-medicalisation. Explains why 'normal aging' variations (baldness, mild presbyopia) aren't diseases even if sub-optimal. Explains rejecting 'invented' disorders.
  *   **Cost:** Forces you to accept Prediabetes as a disease (dysfunction + significant risk) while potentially rejecting *isolated* High Cholesterol as merely a risk factor unless it meets Principle 1 (is hypercholesterolaemia itself a selected *dysfunction*? Debateable). Might challenge your Asymptomatic A-Fib verdict if risk is very low.

  **Predictions on New Cases & Verdict Consistency:**

  1.  **Plague-protection/Alzheimer's Gene (75):** *Disease.* Principle 1: Alzheimer's is a clear dysfunction (cognitive impairment). Principle 2: Causes significant harm (dementia). The earlier benefit doesn't negate the current dysfunction/harm.
  2.  **ADHD Classroom vs. Foraging Band:** *Classroom = likely disease; Foraging Band = likely not.* Principle 1: The underlying neurocognitive traits (attention regulation) might be the same (potential dysfunction relative to broad species norms). Principle 2: Harm is highly context-dependent (impairment in structured classroom vs. potential benefit/neutrality in foraging). Principle 3 filters minor variations.
  3.  **Mild High BP in 92-year-old:** *Likely not a disease.* Principle 1: Difficult to separate mild elevation from 'normal aging'. Principle 3: Threshold of 'significant deficit' likely not met for disease status at that age unless causing immediate harm.
  4.  **Asymptomatic Brain Aneurysm:** *Disease.* Principle 1: Structural abnormality impairing vessel integrity. Principle 2: Significant risk of catastrophic harm (rupture).
  5.  **Obesity:** *Complex.* Principle 1: Excess adiposity *can* impair core metabolic/mechanical functions (dysfunction). Principle 2: Harm varies massively (metabolic health, mobility, distress, social context). Principle 3: Not every overweight person has a *significant* dysfunction/harm. **Verdict:** Obesity *can be* a disease state when it involves significant metabolic dysfunction (e.g., insulin resistance, inflammation) and/or significant harm (mobility issues, diabetes, distress), but isn't automatically one based solely on BMI.

  **Which verdicts struggle?**
  *   **Congenital Deafness:** Principle 1 forces you to accept it's a *dysfunction*, even if Principle 2 (no harm in context) means it's not a *disease needing treatment*. Your gut wants to reject the dysfunction label entirely.
  *   **Lactose Intolerance:** Principles 1 & 2 likely force you to call it a disease in a milk-drinking society, conflicting with your initial verdict but aligning it with cavities.
  *   **Prediabetes vs. High Cholesterol:** Principle 1 makes prediabetes (clearer early metabolic dysfunction) a stronger disease candidate than isolated high cholesterol (risk marker, potential dysfunction debateable). You might need to either accept prediabetes *or* reject high cholesterol as diseases, but can't easily keep both inconsistent verdicts.
  *   **Internet Gaming Disorder vs. ME:** Principle 1 is the key difference. ME involves plausible dysfunction (e.g., post-exertional malaise, immune dysregulation) even if poorly understood, while IGD lacks a clear selected function it impairs. Evidence matters. Your flatmate has a point if the *evidence for harm* is similar, but Principle 1 provides a reason to distinguish.

  **The Honest Answer:** You're rightly wrestling with the core tension. You *are* conflating aspects of **disease** (objective dysfunction), **illness** (subjective experience of being unwell), and **sickness** (social recognition/labeling), but **that's the reality of medicine.** Your principles implicitly separate the concepts: Principle 1 defines dysfunction (disease), Principle 2 defines illness/harm, Principle 3 filters noise. The "honest answer" is that a workable definition needs *both* the naturalist anchor (dysfunction relative to evolutionary design) *and* the normativist judgment of significant harm in context. Your tutor's slogan captures half (dysfunction requires history), but the harm part (Principle 2) is irreducibly normative.

  **Famous View Proximity:** You're closest to a **modified Wakefield (Harmful Dysfunction)** but demanding clearer grounding of "dysfunction" in evolutionary design and "harm" in significant contextual impact, while adding a threshold filter.
