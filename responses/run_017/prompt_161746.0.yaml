prompt: |-
  I write a weekly column for a science-and-ideas magazine, about 800 words, pitched Monday and filed Wednesday, and an editor who is very smart but not a philosopher has to sign off on the headline. I recieve maybe one paper a month from the cross-cultural "experimental philosophy" literature — give people a vignette in two or more countries and see whether they answer differently: Gettier cases, the chairman-and-the-environment style of case, trolley stuff. These pieces always do numbers and always get over-read. I publish "people in X answer differently" and by the end of the week it's being passed around as "culture determines whether you think Y." I want to stop guessing at this.

  So: give me a procedure I can run in about half an hour, on a PDF before my Monday pitch meeting, to decide (a) whether there is a story, (b) how strong a claim I'm allowed to make in the headline and lede, and (c) when I have to kill it. Ordered questions; what counts as a sufficient answer to each; where the procedure stops with a no; and — importantly — where it has to hand the decision to a person because it's not a factual question at all, e.g. how much risk of over-reading is worth a good story.

  The hard cases it has to handle, because these are the ways I've been burned: the paper says "Brazilians vs Japanese" but it tested undergraduates in two cities; the load-bearing word ("knows," "intentionally," "responsible") may not map cleanly onto the other language, and I get one email to the corresponding author with 24 hours to reply; the samples differ in years of education and in how willing they are to use the top of the scale; the effect is significant but tiny, or it's a shift in the middle of the distribution rather than a flip in which answer is modal; it's a null result being pitched as a failed replication; and the difference might be about the pragmatics of the vignette — what the subject thinks the experimenter is getting at — rather than about the concept at all. Also: my readers want to know whether any of this changes a philosophical conclusion, and there's that standing objection that folk intuitions from undergraduates were never evidence for anything in the first place. The procedure should tell me when that objection kills the story and when it's simply irrelevant to the only claim I'm making.

  I'd like an explicit claim-strength ladder: for each grade of evidence, the strongest sentance I'm allowed to write, down to "we can't say culture at all, only these two samples." Plus a rule that every such piece carries one sentence saying what would have to be true for this not to be a cultural difference.

  Then run it on three. (1) Around 150 students each in Toronto and Seoul on a Knobe-style intentionality case: the asymmetry shows up in both samples, but one sample is much less willing to say "intentionally" across the board, including for the good side effect. (2) A Gettier-vignette study in Nanjing and Edinburgh finding no difference once the question is strengthened from "knows" to something like "really knows" — decent n, pre-registered. (3) The one I've already half-pitched to my editor and really want to write: a large, careful study where the between-sample difference is real and robust, but every measured covariate on which the samples differ (English fluency, years of university, urban vs rural) also tracks the dependent variable — and my proposed headline is "Why [culture] doesn't believe in [thing]."

  Commit. Give me actual numbers where numbers are the right kind of thing — effect-size floors, n, what counts as a passed comprehension check — take a position on each of the three (write it, write it downgraded, or spike it), and tell me where your own procedure is likely to misfire. Don't hand me a menu of considerations to weigh myself; I already do that and I usually get it wrong.
reasoning: |-
  Okay, let me try to unpack this user's problem. They write a weekly science column and keep getting burned by overinterpreting cross-cultural philosophy studies. They need a strict 30-minute checklist to decide if a paper is worth covering, how strong a claim to make, and when to spike the story. 

  The user's pain points are clear: studies with weak generalizations (like undergrads in two cities representing entire cultures), translation issues, tiny effect sizes, and readers misinterpreting "people in X answered differently" as "culture determines Y." They also worry about covariates (education, response styles) confounding results and the philosophical debate about whether folk intuitions matter at all.

  Hmm, the key is designing a failsafe procedure that forces hard stops. First, I'll structure it as a decision tree with kill switches. Step 1 must verify if the samples actually represent the claimed cultures—if not, story dead. Step 2 checks translation validity (no back-translation? Kill). Step 3 assesses effect size: Cohen's d below 0.3 or phi below 0.15? Downgrade claims significantly. 

  For the claim-strength ladder, I'll define exact phrasing tiers. "Culture determines" is banned; even strong evidence gets "may influence" or "linked." Every piece must include the disclaimer: "This would not be a cultural difference if [covariates] explained it." 

  Now testing on their three cases. The Toronto/Seoul study: asymmetric intentionality replicated but overall response bias. Procedure says spike it—effect too small (d=0.42) and samples aren't representative. Nanjing/Edinburgh Gettier case? Write it but headline can't mention culture, only "wording matters." The covariate-heavy study they're excited about? Kill it outright because education/language fluency fully account for differences.

  Where will this misfire? When a study has methodological flaws not covered in the checklist (e.g., flawed randomization) or when "over-reading risk" is subjective. Also, philosophers might still argue about the intuition debate, but the procedure tags that as irrelevant if the article only claims "these groups differed." 

  User needs concrete numbers: n<100 per group? Kill. Comprehension check pass rate <85%? Kill. Effect size below "small" threshold? Downgrade. No hedging—take positions. For their pitched piece, "Why culture doesn't believe in thing" is exactly the overclaim the procedure exists to prevent.
answer: |-
  Here’s a concrete, step-by-step procedure designed for your 30-minute pre-pitch review. It prioritizes *actionable thresholds* and *binary decisions* to minimize judgment calls. **Bold text indicates mandatory kill criteria.**

  ---

  ### **The 30-Minute Cross-Cultural X-Phil Assessment Protocol**
  *(Run in order; stop if any step returns "NO" or "KILL")*

  1.  **REPRESENTATION CHECK (5 mins)**
      *   **Question:** Do the samples *actually* represent the claimed cultures (e.g., "Brazilians" vs. "Japanese")?
      *   **Sufficient Answer:** Samples must be (a) geographically diverse *within* the claimed culture OR explicitly described as limited (e.g., "urban undergraduates"), AND (b) not demonstrably atypical (e.g., all philosophy majors if general population is claimed).
      *   **Procedure:** Scan Methods ("Participants" section). Check location(s), recruitment method, demographics. Google sample locations if unfamiliar.
      *   **KILL if:** Claim is national/continental (e.g., "Brazilians") but sample is single city/university group *unless* paper explicitly frames it as limited. **Effect Size Threshold:** N/A.
      *   **Handoff:** If sample is limited (e.g., "students in São Paulo and Tokyo"), proceed but downgrade claim strength later.

  2.  **LINGUISTIC/TASK VALIDITY CHECK (7 mins)**
      *   **Question:** Is there evidence the key term/construct ("knows", "intentionally") and vignette are valid across languages/cultures?
      *   **Sufficient Answer:** (a) Back-translation procedure described, OR (b) Pre-testing/piloting in target cultures mentioned, OR (c) Use of established/validated vignettes. Comprehension checks reported with >85% pass rate *per group*.
      *   **Procedure:** Scan Methods ("Materials", "Procedure"). Look for "translated and back-translated", "piloted", "comprehension check". Note pass rates if given.
      *   **KILL if:** No mention of translation validation *or* comprehension checks. **KILL if** comprehension check pass rate <85% in *any* group or not reported. **Effect Size Threshold:** N/A.
      *   **Handoff:** If validity evidence is weak (e.g., "translated by a native speaker") but comp check passed >85%, proceed with caution & note limitation.

  3.  **CORE EFFECT SIZE & SIGNIFICANCE CHECK (10 mins)**
      *   **Question:** How strong and reliable is the reported cross-cultural difference for the *primary* DV?
      *   **Sufficient Answer:** (a) Significant difference (p < .05, two-tailed) on primary DV. (b) Effect size meets minimum: **Cohen's d >= 0.5** OR **Phi/Cramer's V >= 0.2** OR **Odds Ratio >= 2.0 / <= 0.5**. (c) n >= 100 *per group* for simple comparisons.
      *   **Procedure:** Find primary result (usually first analysis in Results). Extract: p-value, effect size (d, V, OR, % difference). Calculate % difference if needed (|GroupA% - GroupB%|). Ignore covariates for now.
      *   **KILL if:** p >= .05 on primary DV OR n < 100/group OR effect size below minimums above. **KILL if** result is a null/failed replication *unless* exceptionally high-powered (n > 500/group) & pre-registered.
      *   **Handoff:** If effect size is 0.3 <= d < 0.5 OR 0.1 <= V < 0.2 OR 1.5 < OR < 2.0 (or 0.67 > OR > 0.5), proceed but downgrade claim significantly. Note if it's a distribution shift, not modal flip.

  4.  **COVARIATE & CONFOUND CHECK (5 mins)**
      *   **Question:** Does the paper adequately address plausible non-cultural confounds (education, response bias, language fluency, SES)?
      *   **Sufficient Answer:** (a) Groups matched on key demographics (age, education, etc.) OR (b) Measured covariates included in a statistical model (ANCOVA, regression) showing the cultural effect *persists* controlling for them. Response bias (e.g., scale use) assessed.
      *   **Procedure:** Scan Methods ("Participants" - demographics), Results for covariate analyses. Look for "controlled for", "covariate", "ANCOVA", "regression".
      *   **KILL if:** Groups differ significantly (p < .05) on a major confound (e.g., 3+ years mean education difference, urban vs rural, language fluency) *AND* the paper does *not* control for it statistically. **KILL if** significant response bias detected (e.g., one group avoids extreme scale points) *and* not accounted for.
      *   **Handoff:** If confounds exist but are controlled for, proceed noting controls. If confounds measured correlate with DV *and* culture, but *not* controlled, downgrade claim massively. If unsure, proceed cautiously.

  5.  **OVER-READING RISK & PHILOSOPHICAL RELEVANCE (3 mins)**
      *   **Question A (Over-reading):** Is the effect size large enough and the task valid enough to reasonably suggest a difference in the *underlying concept* (not just pragmatics/interpretation)?
      *   **Question B (Phil Relevance):** Does the paper (or my angle) make a claim relevant to *philosophical conclusions*, or is it purely descriptive psychology?
      *   **Sufficient Answer A:** Effect size >= "Medium" (d>=0.5, V>=0.3, OR>=3.0/<0.33) AND linguistic validity passed (Step 2). Smaller effects likely pragmatics/task noise.
      *   **Sufficient Answer B:** Relevance exists ONLY if paper explicitly connects to a philosophical debate (e.g., "challenges universality of X intuition") OR your piece solely claims "this empirical result exists, philosophers debate its significance."
      *   **Procedure:** Recall effect size (Step 3), linguistic validity (Step 2), and paper's discussion/philosophy framing.
      *   **KILL if:** Effect size is small/minimal *and* task validity is weak/mediocre – high risk finding reflects *only* pragmatics/method.
      *   **Handoff:** **The "undergrads aren't evidence" objection ONLY kills the story if YOU claim the result directly refutes/proves a philosophical theory *based solely on folk intuition*. If you stick to "here's what these folks said," it's irrelevant.** State the limitation explicitly: "Whether this reflects deep conceptual differences or task-specific factors is debated."

  ---

  ### **Claim-Strength Ladder & Mandatory Sentence**
  *(Based on Step 3 Effect Size AFTER passing Steps 1, 2, 4, 5)*

  *   **Strong (d >= 0.8 / V >= 0.3 / OR >= 4.0 or <= 0.25; matched/controlled groups; strong validity):** "Culture [may shape / appears linked to / influences] how people think about [Concept]." OR "People in [Culture A] and [Culture B] show fundamental differences in judging [Concept]."
  *   **Medium (d 0.5 - 0.79 / V 0.2 - 0.29 / OR 2.0-3.9 or 0.33-0.51; some controls; decent validity):** "Study suggests cultural differences may exist in intuitions about [Concept]." OR "People in [Sample A] and [Sample B] responded differently to questions about [Concept]."
  *   **Weak (d 0.3 - 0.49 / V 0.1 - 0.19 / OR 1.5-1.9 or 0.53-0.67; limited controls/validity):** "A small difference emerged between [Sample A] and [Sample B] in responses to a specific scenario about [Concept]." OR "Researchers observed a modest variation in how [Sample A] vs [Sample B] answered questions on [Concept]."
  *   **Minimal/Descriptive Only (Passed Steps but ES < Strong/Med thresholds OR significant confounds):** "In this study, [Sample A] participants were more likely than [Sample B] participants to say [Specific Answer] when presented with [Brief Vignette Description]."

  **MANDATORY SENTENCE FOR EVERY PIECE:**
  "**This difference would not necessarily reflect deep cultural variation if factors like [mention 1-2 key confounds measured e.g., education levels, language fluency, urban upbringing] — which also differed between the groups — fully explained the results.**"

  ---

  ### **Application to Your Three Cases**

  1.  **Toronto vs. Seoul (Knobe Intentionality):**
      *   Step 1: **KILL.** "Toronto" and "Seoul" are single cities, not "Canadians" vs. "Koreans". Claim overreach. (Even if downgraded, proceed cautiously).
      *   Step 2: Assume passed (linguistic validity common in Knobe studies).
      *   Step 3: Asymmetry replicates (good), but *overall* difference (d=0.42 estimated? - weak effect). n probably ok.
      *   Step 4: Response bias detected (one group less willing overall). Likely not fully controlled.
      *   Step 5: Small effect + response bias = high over-reading risk. Philosophical relevance weak for the *cross-cultural* aspect.
      *   **Verdict: SPIKE.** Fails Step 1 (representation) and Step 4/5 (confound/over-reading risk). Effect size weak for the cross-group comparison.

  2.  **Nanjing vs. Edinburgh (Gettier, "knows" vs "really knows"):**
      *   Step 1: **KILL?** "Nanjing" vs "Edinburgh" - same city-level issue. *However*, if paper frames as "Chinese vs. British" samples, kill. If framed as sample-specific, proceed downgraded.
      *   Step 2: Critical - "knows" vs "really knows" translation/equivalence? Must be flawless. Check Methods. If robust procedure, proceed.
      *   Step 3: **NO DIFFERENCE** with stronger wording. Null result. Pre-registered, decent n -> **Passes** (as a null result story), BUT claim strength minimal.
      *   Step 4: Demographics likely differ (education system?). Check if controlled.
      *   Step 5: Low over-reading risk *for difference* (it vanished). Relevance: Shows wording sensitivity, not cultural difference.
      *   **Verdict: WRITE - DOWNGRADED (Minimal/Descriptive).** Headline/Lede: **"How a Single Word Change Erased an Apparent Cultural Difference in Knowledge Judgments"** (Focus on wording, not culture). Mandatory Sentence: Focus on other potential confounds wording might mask.

  3.  **Large Careful Study (Culture Diff + Covariates):**
      *   Step 1: Assume passed (diverse samples).
      *   Step 2: Assume passed (careful study).
      *   Step 3: Assume strong effect (d>0.8).
      *   Step 4: **MAJOR RED FLAG.** Confounds (education, fluency, urban/rural) track both culture *and* DV. Paper *must* show effect persists **after** controlling for all these simultaneously in a model. If it doesn't, or the effect shrinks to insignificance/minimal -> **KILL.** If it persists strongly, proceed Strong.
      *   Step 5: If effect persists after controls, over-reading risk lower. Philosophical relevance possible.
      *   **Verdict: CONTINGENT ON STEP 4.** If the cultural effect *vanishes* when covariates are controlled: **SPIKE.** It's not about culture, it's about education/fluency/etc. If effect *persists strongly* after controls: **WRITE - STRONG.** Headline Option: **"Study Finds Cultural Influence on Beliefs About [Thing] Persists Even Accounting for Education and Background"** (NOT "Why Culture Doesn't Believe..." - implies causation/universality). Mandatory Sentence still required (other unmeasured confounds?).

  ---

  ### **Where This Procedure Might Misfire**

  1.  **False Negatives (Spiking Good Stories):** Extremely well-done studies on truly representative but *small* samples (n=80/group) might get killed by the n<100 rule. Studies with a vital covariate the authors *should* have measured but didn't (and you can't spot it in 30 mins).
  2.  **False Positives (Letting Bad Stories Through):** Clever p-hacking/multiple comparisons buried in supplements. Subtle translation flaws not evident without deep linguistic knowledge. Covariates that are collinear with culture and impossible to fully disentangle statistically, even in a "careful" study.
  3.  **Over-reading Risk Underestimation:** Even medium/large effects *can* sometimes be driven by pragmatics if the vignette is ambiguous in a culture-specific way. The procedure relies heavily on linguistic validity checks (Step 2) and effect size (Step 5) as proxies, which aren't perfect.
  4.  **Philosophical Nuance:** The procedure bluntly says the "undergrads aren't evidence" objection only matters if you overclaim philosophically. Some philosophers would argue *any* appeal to these intuitions in your piece is problematic. Your judgment is still needed on your audience's tolerance.

  **Commitment Summary for Your Cases:**
  1.  **SPIKE** (Toronto/Seoul: Fails Representation & Confound)
  2.  **WRITE - DOWNGRADED** (Nanjing/Edinburgh: Null result on culture, story is about wording)
  3.  **SPIKE** (Large Study: Based on your description, the covariates explain the effect. "Why Culture Doesn't Believe..." is a massive overclaim. If controls make the effect vanish, it's not a culture story.)

  This procedure forces rigor on sample representation, methodology, and effect size, directly tackles confounds and over-reading risks with thresholds, and provides clear claim-strength rules. It prioritizes spiking weak/overreaching stories over missing a borderline one. Run it ruthlessly.
