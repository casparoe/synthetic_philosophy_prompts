answer: |-
  Here are five numbered responses addressing your query:  

  (1) Your two-questions hypothesis is largely correct: aggregators seek a *substantively optimal* outcome for the collective, while neutralists prioritize *procedural legitimacy* for each individual. The camps diverge because they address distinct problems—moral optimization vs. authority—masked by shared terminology.  

  (2) The deepest fault line is the **source of legitimacy**: aggregators anchor it in collective outcomes (e.g., minimizing regret), while neutralists demand individual justifiability, rejecting any "common good" as a covert substantive value. This reflects the irreconcilable conflict between consequentialism and consent-based deontology.  

  (3) Hidden formal/empirical work includes: (i) whether value convergence *under ideal reflection* is feasible (empirical), and (ii) if completion rules can be uniquely derived from data without imposing exogenous norms (formal). Both camps assume these are intractable, but their stances depend on it.  

  (4) Progress would require **hybrid frameworks** that formally separate policy *selection* (addressing aggregators) from *justification* (addressing neutralists), or empirical evidence that specific completion rules yield universally acceptable procedures despite value divergence.  

  (5) Expect limited progress: the dispute reduplicates foundational, unresolved debates in political philosophy (e.g., utilitarianism vs. Rawlsian proceduralism). Pragmatic advances might arise in bounded domains, but a universal solution is unlikely.
