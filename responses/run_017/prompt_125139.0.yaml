  The key distinctions the user mentioned are critical. For identity, if the hard core changed, it's a new program. Translational reformulations are tricky—mathematically equivalent changes that look like progress but aren't. Immunity clauses make theories unfalsifiable. Borrowed progress is output that's useful but doesn't test the core. Prediction-milling is slicing predictions to inflate numbers. Stagnation vs consolidation: is the program stuck or mature? And the hindsight problem—Lakatos is retrospective, but panels decide now.

  The procedure needs clear steps: questions to ask, evidence to look for, stop points for negative verdicts, and when to hand off to human judgment. For each issue, define what counts as sufficient evidence, what to do if the dossier is silent, and when to halt.

  For Program A: Hard core is sleep reactivation necessary for memory consolidation. One confirmed prediction, but eight replication failures dismissed via salience threshold (immunity clause). Their popular tool is borrowed progress. Verdict should be probation due to the immunity clause and replication issues.

  Program B: Hard core unchanged, extended to new materials, used in industry. No novel predictions, but consolidating. Anomaly excluded as insufficiently characterized. This is handling an anomaly, but no new predictions. Verdict: renew with restructuring to address the anomaly.

  Program C: Hard core is a scaling law for urban failures. Reformulations are equivalent, immunity clause on network size, confirmation was an artifact. Spin-offs abandoned the core. Despite being the flagship, it's degenerating. Verdict should be wind down, though politically tough. The user prefers honesty over politics.

  The procedure's limitations: Biases against long-term payoff fields, struggles with nascent programs or those needing new instruments. Values-based decisions like risk appetite or societal impact need panel judgment. Grace periods should be context-dependent, signed off by senior experts.

  Need to structure the procedure into phases: Identity, Novelty, Responsiveness, Progress Balance, and Synthesis. Each phase has specific questions. For example, Phase 1 checks if the hard core changed. If yes, it's a new program. Phase 2 looks for novel predictions and tests against immunity clauses. 

  Handling dossier silence: If critical evidence is missing, it's a negative mark. For example, if no advance predictions, it fails Phase 2. Stop points are clear: if hard core changed without restart, or no novel predictions in 5 years without justification.

  Grace periods: Allow 0-5 years without novelty, extendable with evidence like new instruments. Requires senior panelist sign-off.

  Applying to each program with findings. For C, despite its status, the artifacts and lack of genuine progress necessitate winding down. The user's integrity is key here.

  Finally, note the procedure's biases: Favors fields with quick outputs, penalizes high-risk/long-term work. Not suitable for very new programs or those in crisis. Panel must acknowledge when they're making value judgments.
answer: |-
  Here is a decision procedure operationalizing Lakatos for your panel, designed for an afternoon per programme using only the dossier. It handles your specified distinctions explicitly and flags value judgments. The procedure has five phases, each with clear exit criteria:

  **Decision Procedure: Lakatosian Programme Assessment (LPA)**

  **Phase 1: Identity & Core Integrity**  
  *Question:* Has the Hard Core (HC) remained materially unchanged?  
  *Evidence:* Consortium’s self-report (explicitly stating HC), comparison of HC description in current vs. previous self-report/dossier.  
  *Silence/Unobtainable:* Assume HC unchanged unless dossier explicitly notes revision.  
  *Stop if:* HC changed significantly (e.g., core causal claim modified, central entity replaced). **Verdict: "Renew with Restructuring"** (treat as new programme; requires full re-proposal).  
  *Distinction Handling:*  
  - *Translational Reformulation:* If HC unchanged but formalism/vocabulary altered, check self-report for equivalence claim or demonstration. If provably equivalent (e.g., mathematical proof, acknowledged in text), ignore as non-progressive.  
  - *Identity Threshold:* HC change = abandonment if old core’s central causal mechanism is negated or replaced.

  **Phase 2: Novelty & Testability**  
  *Question:* Did the programme generate ≥1 *novel* factual prediction *in advance* that was *risky* (falsifiable within current means) and *confirmed*?  
  *Evidence:* Self-report "key predictions" section, external reviews, publication list (timestamped preprints/pre-registrations vs. results).  
  *Silence/Unobtainable:* If no documented advance prediction, proceed but note failure.  
  *Stop if:* Zero novel confirmed predictions AND no grace period applies (see below). **Verdict: "Wind Down"** if degenerative; **"Probation"** if mitigating factors.  
  *Distinction Handling:*  
  - *Prediction-Milling:* Count only predictions where:  
    (a) Outcome was genuinely uncertain (e.g., rival programmes predicted opposite);  
    (b) Prediction required HC to be true (not derivable from background knowledge);  
    (c) Unit of risk is the *conceptual advance*, not number of sub-predictions.  
  - *Immunity Clause:* Reject predictions if:  
    (a) Method to test is declared currently impossible (e.g., "salience cannot be measured");  
    (b) Anomaly domain is excluded post-hoc without independent justification (e.g., "insufficiently characterised").  
  - *Grace Period Rule:* Allow ≤5 years without novel success. Extend only if dossier shows:  
    (a) Major technical barrier overcome in-period;  
    (b) New instrument/dataset now enables previously impossible test.  
  *Extension Sign-off:* Panel chair + statistician must approve, citing dossier evidence.

  **Phase 3: Responsiveness**  
  *Question:* Did the programme absorb anomalies through belt modifications that *increased empirical content* (explained new phenomena) or *enhanced testability*?  
  *Evidence:* Self-report "challenges/responses", external reviews critiquing anomalies, publication methods sections.  
  *Silence/Unobtainable:* Assume no explanatory belt modifications.  
  *Stop if:* Anomalies dismissed via immunity clause (Phase 2) or belt modifications are purely defensive (no new predictions/domain extensions). **Verdict: "Probation" or "Wind Down"** depending on severity.  
  *Distinction Handling:*  
  - *Borrowed Progress:* Outputs (tools/data/software) cited as progress must be:  
    (a) Uniquely enabled by HC (not buildable without it);  
    (b) Able to discriminate HC from rivals. Else, note as field-wide contribution but *not* programme progress.

  **Phase 4: Progress Balance**  
  *Question:* Does the *net* progress (novel confirmations minus unresolved anomalies) justify continuation?  
  *Evidence:* Synthesis of Phases 2-3, external review summaries.  
  *Handoff to Panel if:*  
  - Net progress is marginal (±1 novel prediction/anomaly).  
  - Programme is in *Consolidation* (belt stable, extending reach quantitatively) vs. *Stagnation* (no new domains, anomalies mounting).  
  *Distinction Handling:*  
  - *Consolidation Criteria:* Requires all:  
    (a) HC stable ≥5 years;  
    (b) Quantitative framework applied to ≥2 new domains/material classes in-period;  
    (c) Anomalies resolved or contained with independent evidence.  
  - *Stagnation Criteria:* Any of:  
    (a) No domain extensions despite capacity;  
    (b) Anomalies growing without resolution plan;  
    (c) Outputs primarily translational/review articles.

  **Phase 5: Synthesis & Verdict**  
  *Apply Verdict Matrix:*  
  | HC Change? | Novel Success? | Anomalies Handled? | Progress Balance | Verdict |  
  |------------|----------------|---------------------|-----------------|---------|  
  | Yes        | –              | –                   | –               | Restructure |  
  | No         | Yes            | Yes                 | Strong          | Renew |  
  | No         | Yes            | Partial             | Marginal        | Probation |  
  | No         | No (no grace)  | No                  | Negative        | Wind Down |  
  | No         | Consolidation  | Yes                 | Strong          | Renew |  
  | No         | Stagnation     | No                  | Negative        | Wind Down |  

  *Value Judgment Flags:*  
  - **Renew:** Despite weaknesses if societal impact/training exceptional (requires panel vote).  
  - **Probation:** If net progress marginal but field context justifies patience (e.g., high-risk/high-reward).  
  - **Wind Down:** Override possible if national strategic need critical (board decision).

  ---

  **Application to Current Programmes**

  **Programme A (Memory Reactivation)**  
  - *Phase 1:* HC unchanged.  
  - *Phase 2:* One novel prediction confirmed. BUT: Immunity clause invoked ("salience unmeasurable") to dismiss 8 failures → Prediction invalidated.  
  - *Phase 3:* No belt modifications; borrowed progress (sleep-staging tool).  
  - *Phase 4:* Net progress negative (1 confirmed vs. 8 unresolved anomalies + immunity clause). Stagnation.  
  - *Verdict:* **Wind Down**  
  - *Findings:* "Programme failed independent replication of core effect, invoking untestable salience threshold to immunize core. Sole novel prediction confirmation outweighed by unresolved anomalies. High-impact tool development noted but not dependent on HC. Degenerative trajectory."

  **Programme B (Materials Order Parameter)**  
  - *Phase 1:* HC unchanged.  
  - *Phase 2:* No novel predictions. Consolidation claim.  
  - *Phase 3:* Anomaly (deviant material family) excluded post-hoc without independent characterization.  
  - *Phase 4:* Quantitative extension to 3 new families + industrial adoption = strong consolidation. Anomaly handling weak but contained.  
  - *Verdict:* **Renew with Restructuring**  
  - *Findings:* "Successful consolidation and field adoption demonstrate utility. Anomaly management ad-hoc and unsustainable; restructuring must address characterization of excluded samples. No novel predictions expected in consolidation phase, but anomaly resolution plan required."

  **Programme C (Infrastructure Scaling Law)**  
  - *Phase 1:* HC unchanged (despite spin-offs abandoning it).  
  - *Phase 2:* No valid predictions. Immunity clause ("law applies only above unattained network size"). "Celebrated confirmation" was artifact → negative evidence.  
  - *Phase 3:* Reformulations provably equivalent (self-admitted) → no progress. Spin-off success explicitly contradicts HC.  
  - *Phase 4:* Net progress negative. Stagnation with defensive maneuvers.  
  - *Verdict:* **Wind Down**  
  - *Findings:* "No empirical novelty; core protected via untestable size threshold and mathematical re-description. Key 'success' attributable to methodological artifact. Spin-off programmes abandoning HC show progress elsewhere. Despite historic contributions, programme is degenerative and cannot claim continued investment on scientific merits." (Training/legacy noted separately for board.)

  ---

  **What the Procedure Cannot Do**  

  1. **Inherent Guessing Points:**  
     - *Nascent Programmes:* Cannot distinguish "slow-starting progressive" from "permanently sterile" within 5-year windows.  
     - *High-Risk Programmes:* If no testable predictions yet (e.g., awaiting new collider), relies on panel's risk-tolerance.  
     - *Consolidation vs. Stagnation:* Subjective threshold in mature programmes.  

  2. **Unsuitable Programmes:**  
     - *Pure Engineering/Applied:* Where "success" is utility, not truth-content (e.g., developing a vaccine).  
     - *Descriptive/Taxonomic Science:* No "predictions" in Lakatosian sense (e.g., biodiversity cataloguing).  
     - *Interdisciplinary Programmes:* With multiple HCs; procedure assumes one unified core.  

  3. **Systematic Biases:**  
     - **Short-Cycle Bias:** Favours fields with rapid experimentation (molecular bio) over long-gestation work (climate modeling). Mitigation: Grace period extensions for technical delays.  
     - **Quantification Bias:** Over-rewards countable predictions; under-rewards conceptual/methodological breakthroughs.  
     - **Conservatism Bias:** Punishes high-risk programmes more harshly than incremental work.  
     - **Bandwagon Effect:** May prematurely condemn small programmes challenging dominant paradigms.  

  **Recommendation:** Use LPA for *discovery-driven* programmes with testable cores. Supplement with impact/training assessment for applied/descriptive work. Flag all value-judgment overrides transparently in reports to the board.
