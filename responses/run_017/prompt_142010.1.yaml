  We are given a problem: to advise a small funder on how to spend resources (one philosopher and one game theorist for nine months) to make the surprise exam paradox useful for real-world audit and inspection regimes. The classic paradox is known to be problematic and not directly applicable.

  The classic surprise exam paradox: A teacher announces that there will be a surprise exam next week (Monday to Friday). The student reasons that the exam cannot be on Friday because then on Thursday night they would know. Then it cannot be on Thursday, and so on, leading to the conclusion that there cannot be a surprise exam. But then the exam happens (say on Tuesday) and it is a surprise.

  The real-world context: audit and inspection regimes (financial audits, nuclear safeguards, AI deployment gates) where the auditee can read the published policy. The timing is random by design, and the target knows the scheduler. We need to reframe the paradox to be useful in such settings.

