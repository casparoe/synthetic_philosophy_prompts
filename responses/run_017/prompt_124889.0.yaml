          - For each available action:
              - If the action is A*, assign it the adverse outcome payoff.
              - Otherwise, assign it its base payoff.
          - Choose the action with the highest payoff.
          - Proceed to take the chosen action. Override the policy if necessary.

     5. **Diagnostic case:**
          - The agent should follow its policy as designed. No override is needed.
          - End.

     **Points requiring human judgment or escalation:**
        - Step 1 requires determining the mechanism of the adverse outcome. If you don't know, escalate.
        - The base payoffs and adverse outcome payoff may involve organizational risk tolerance or ethical considerations. If these are not predefined or clear, escalate.

     **What this procedure cannot settle:**
        - This procedure does not handle cases where the nature of the correlation is unknown (step 1).
        - It does not account for adversaries that use a different strategy than trapping the highest-probability action.
        - It does not address cases where the base payoff of an action depends on complex factors that are not quantified.

     **Worked Examples:**
        (As above, but concise)

     **Example 1 (Genuine predictor case, deterministic):**
        - Drone choosing route: policy deterministically chooses route A. Adversary sets trap on A.
        - Step 1: yes (predictor). Step 2: deterministic. Step 3: remove A, choose between B (base=10) and C (base=8) -> choose B.

     **Example 2 (Diagnostic case):**
        - Stock trader: policy says sell X. Stock X crashes due to market conditions, not because of an adversary trap set using the policy.
        - Step 1: no (diagnostic) -> step 5: follow policy (sell X).

     **Example 3 (Undesirable outcome in predictor case):**
        - Military drone: policy prefers AttackA (prob=0.6). Adversary traps AttackA. Base payoffs: AttackA=100, AttackB=20, Retreat=-10. With trap, AttackA becomes -1000.
        - Step 1: predictor. Step 2: stochastic. Step 4: assign AttackA=-1000, AttackB=20, Retreat=-10 -> choose AttackB.
        - Verdict: Override to AttackB (which has lower base payoff than AttackA without trap, but avoids disaster).

     **End of Procedure.**
