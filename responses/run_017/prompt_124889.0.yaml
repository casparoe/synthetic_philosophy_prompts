  ### Decision Protocol: Handling Adversarial Prediction in Agent Deployment  
  **Use when:** An agent's actions correlate with outcomes it doesn't cause, and adversaries have exfiltrated the policy network (but not the random seed). Symptoms include all high-preference actions appearing to guarantee failure.  

  **Inputs required:**  
  - Available actions \(A = \{a_1, a_2, ..., a_n\}\).  
  - Policy's action probabilities for current state (e.g., \(P(a_1) = 0.7, P(a_2) = 0.3\)).  
  - Payoff for each action **if no adversary interferes** (e.g., "Action A yields +10 reward if safe").  
  - Cost of adversary-induced failure (e.g., "-100 reward").  

  ---

  #### Step 1: Identify the correlation mechanism  
  **Ask:** "Does the adversary set the failure condition **AFTER** predicting the agent's action using the exfiltrated policy?"  
  - **If YES (Predictor case):** Outcome is actively caused by adversary tracking the agent's decision. Proceed to Step 2.  
  - **If NO (Diagnostic case):** Outcome is fixed by pre-existing world state (e.g., "Route A is always mined"). **→ Follow original policy. STOP.**  
  - **If UNCLEAR:** Escalate to human; this is a risk-appetite decision.  

  > *Key distinction: Predictor = adversary reacts to policy output. Diagnostic = outcome exists independently of agent's choice.*  

  ---

  #### Step 2: Handle discontinuity at determinism  
  **Ask:** "Does the policy assign >99% probability to any single action?"  
  - **If YES (Deterministic policy):**  
    - Adversary **will** trap the top-ranked action \(a_{\text{top}}\).  
    - Remove \(a_{\text{top}}\) from consideration.  
    - Assign payoffs:  
      - Trapped action \(a_{\text{top}}\): Adversary cost (e.g., -100).  
      - Other actions: Base payoff (e.g., \(a_2\): +5).  
  - **If NO (Stochastic policy):**  
    - Adversary traps the action with **highest probability** (e.g., \(a_1\) at \(P=0.7\)).  
    - Assign payoffs:  
      - Trapped action: Adversary cost (e.g., -100).  
      - Non-trapped actions: Base payoff (e.g., \(a_2\): +5).  

  ---

  #### Step 3: Condition on survival and select action  
  **For all untrapped actions**, use base payoffs (these assume no adversary interference).  
  - **If all actions trapped:** Agent cannot avoid failure → Escalate; organizational risk decision.  
  - **Else:** Select the action with the **highest payoff** from the assigned values.  
  - Override policy if needed.  

  > *Rationale: Survival is guaranteed for non-trapped actions; payoffs reflect post-survival value.*  

  ---

  ### Worked Applications  

  #### Case 1: Genuine predictor (Death-in-Damascus)  
  **Situation:** Delivery drone chooses routes. Adversary has policy and ambushes the top-predicted route.  
  - Actions: {Route A, Route B}. Policy: \(P(\text{A}) = 1.0\) (deterministic).  
  - Base payoffs: A = +8, B = +5. Adversary cost = -100.  
  - **Procedure:**  
    - Step 1: YES (adversary sets trap after prediction) → Predictor.  
    - Step 2: Deterministic → Trap A (payoff: -100). B = +5.  
    - Step 3: Select B (highest untrapped payoff).  
  **Verdict:** Override to Route B.  

  ---

  #### Case 2: Misdiagnosed as predictor (Diagnostic case)  
  **Situation:** Stock trader sells asset X. Price crashes. Adversary has policy but did not cause crash.  
  - Actions: {Sell X, Hold X}. Policy: \(P(\text{Sell}) = 0.9\).  
  - Base payoffs: Sell = -5 (loss), Hold = -50 (larger loss).  
  - **Procedure:**  
    - Step 1: NO (crash caused by market conditions, not adversary reaction) → Diagnostic.  
    - **STOP.** Follow policy (Sell X).  
  **Why it’s diagnostic:** Crash exists regardless of agent’s choice; policy correctly diagnoses risk.  

  ---

  #### Case 3: Undesirable verdict (Predictor with poor options)  
  **Situation:** Military robot attacks or retreats. Adversary ambushes top-predicted target.  
  - Actions: {Attack A, Attack B, Retreat}. Policy: \(P(\text{Attack A}) = 0.8, P(\text{B}) = 0.2\).  
  - Base payoffs: A = +100, B = -10, Retreat = -20. Adversary cost = -1000.  
  - **Procedure:**  
    - Step 1: YES → Predictor.  
    - Step 2: Stochastic → Trap A (payoff: -1000). B = -10, Retreat = -20.  
    - Step 3: Select B (least bad untrapped action).  
  **Verdict:** Override to Attack B. Team dislikes negative payoff, but A is catastrophic.  

  ---

  ### What This Procedure Cannot Settle  
  1. **Adversary strategy uncertainty:** If the adversary traps a non-top action (e.g., highest *reward* action), escalate.  
  2. **Payoff ambiguity:** If base payoffs involve ethical risks (e.g., "harm to humans"), escalate.  
  3. **Diagnostic uncertainty:** If Step 1 is unanswerable, humans must weigh intelligence about the adversary.  

  **Output:** Action to execute or escalation directive. Update deployment logs.  

  ---  
  **For engineers:** Complete within 15 minutes. Escalate unknowns; do not guess values/risks.
