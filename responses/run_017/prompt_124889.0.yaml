    1. Diagnostic case: The correlation is due to the agent's action merely being a diagnostic of a fixed state of the world (which the action does not cause).
    2. Predictor case: The outcome is produced by an adversary that is tracking the agent's decision procedure (a Death-in-Damascus scenario).

  The procedure must be step-by-step, with clear questions and decision points. It should account for the discontinuity in the adversary's accuracy (perfect for deterministic actions, but only stochastic for stochastic actions). Also, we must consider options that have different payoffs conditional on survival.

