     **Final Procedure Document:**

     **Procedure: Handling Action-Outcome Correlation in Adversarial Environments**

     **When to use this procedure:**
     Use this procedure when your agent's actions are correlated with outcomes that the agent's action does not cause, and you know that an adversary has exfiltrated the agent's policy network and can run it on any input (but does not have the random seed). The symptoms may include: every action the agent considers appears to lead to a loss once the agent conditions on its own choice.

