     - Question: "Is the correlation between the agent's action and the adverse outcome due to the agent's action being a *cause* of the outcome, or is it only a *symptom* (i.e., the outcome would have happened regardless of the action chosen, but the action chosen is informative about the state that causes the outcome)?"
