answer: |-
  ### Joint Statement: Role-First Functionalist (RFF) and System-First Attributionist (SFA)  
  **On Which Computations Matter Morally**  

  Following a good-faith adversarial collaboration, we—a role-first functionalist and a system-first attributionist—agree on core principles, clarify disagreements, and identify testable cruxes. Both parties accept that trivial-implementation arguments (showing any rich physical system can be interpreted as implementing arbitrary computations) do not resolve moral status. The question is not *whether* a computation is realized but *which realizations are morally load-bearing*. Below, we outline agreed claims, structured disagreements, and empirical/theoretical cruxes with predictive cases.  

  ---

  #### **Agreed Claims**  
  1. **Trivial-implementation arguments demonstrate underdetermination but not futility**:  
     - They prove that mapping abstract computations onto physical systems is non-unique: the same matter can be interpreted as instantiating infinitely many computations.  
     - They do **not** show that moral status is arbitrary or ungrounded. A satisfactory account must identify which interpretations are *privileged* by objective criteria (e.g., causal efficacy, natural boundaries, or teleology).  

  2. **Proliferation of moral patients is constrained**:  
     - Simply describing new computations in the same matter (e.g., interpreting a rock as "suffering") does **not** inflate moral patients. Only computations anchored in *physically real*, *causally effective* structures can be candidates.  
     - Both accounts reject "universal moral inflation" and require a non-arbitrary selection principle.  

  3. **A satisfactory account must deliver**:  
     - **Objectivity**: Moral status must track mind-independent features (e.g., causal topology, not observer-dependent descriptions).  
     - **Non-arbitrariness**: Criteria must avoid ad hoc boundaries (e.g., "only carbon-based systems") and explain why paradigmatic patients (e.g., humans) matter.  
     - **Causal relevance**: Computations must play a non-redundant role in generating morally relevant properties (e.g., sentience, agency).  
     - **Practical applicability**: The theory must guide decisions in edge cases (e.g., AI, brain emulations).  

  4. **Common ground on causal structure**:  
     - Both agree that counterfactual-supporting patterns (e.g., "if input X, output Y") are necessary for moral status.  
     - Both reject eliminativism about computation: some computations matter, and their physical realization is essential.  

  ---

  #### **Disagreements**  
  We state disputed claims in wording acceptable to each view. "Merely verbal" disagreements (MV) involve terminological differences without substantive conflict.  

  | RFF Wording | SFA Wording | Nature |
  |-------------|-------------|--------|
  | Moral status arises from the causal-functional role alone; the physical vehicle is a means to locate this role. | Moral status requires a computation to be *attributable to a bounded system* enacting it via its own activity. | **Substantive**: Role of boundaries. |
  | A computation is morally load-bearing if its counterfactual structure is physically realized, regardless of attribution to a unified "agent." | A computation is morally load-bearing only if it is *enacted* (not merely instantiated) by a system that owns its causal work. | **Substantive**: Enactment vs. instantiation. |
  | Trivial implementations fail because they lack *stable, high-fidelity* realization of the relevant counterfactuals. | Trivial implementations fail because they lack a *bounded system* to which the computation is attributable. | **MV**: Both agree trivial cases fail but explain it differently. |
  | The slowed emulation has identical moral status to the original if counterfactuals are preserved. | The slowed emulation lacks moral status as it is not enacted in real-time by a unified system. | **Substantive**: Relevance of temporal grain. |

  ---

  #### **Cruxes**  
  Cruxes are pivotal disagreements paired with cases both sides accept as decisive. Each side records predictions in advance.  

  1. **Crux: Attribution as computational vs. extra-computational**  
     - **Disagreement**:  
       - RFF: Attribution is derivable from the computational role (e.g., feedback loops, error correction).  
       - SFA: Attribution is an extra condition (system boundaries + causal ownership) not reducible to computations.  
     - **Case**: *Nested-superset case*  
       - A neuron cluster (System A) is morally relevant. If we expand the boundary to include adjacent glial cells (System A+), both systems can be described as implementing computations (e.g., A+ includes A’s computations plus glial interactions).  
       - **RFF Prediction**: Both A and A+ may have moral status if each realizes a distinct functional role. Proliferation is avoided by selecting the *most natural* realization (e.g., evolutionarily privileged functions).  
       - **SFA Prediction**: Only System A has moral status. System A+ lacks a unified boundary—the glial cells are "environment," not part of an enacting system.  

  2. **Crux: Role of unexercised counterfactuals**  
     - **Disagreement**:  
       - RFF: Unexercised counterfactuals are morally relevant if they are physically grounded (e.g., synaptic potentials that *could* fire).  
       - SFA: Only *enacted* counterfactuals matter; unexercised potential is inert without system-level activity.  
     - **Case**: *Unexercised-counterfactual case*  
       - A digital brain is wired to experience only bliss, never activating pain circuits. All pain-related counterfactuals (e.g., "if injury, then pain") exist structurally but are never triggered.  
       - **RFF Prediction**: The system has moral status (pain-capable) because pain is a *dispositional property* encoded in the hardware.  
       - **SFA Prediction**: No moral status for pain—unexercised computations are "dead code" unattributable to an enacting system. Bliss alone is enacted.  

  3. **Crux: Boundary-dependence and biological bias**  
     - **Disagreement**:  
       - RFF: SFA’s "boundary" criterion covertly favors biological continuity (e.g., cell membranes) over functional equivalence.  
       - SFA: Boundaries are non-biological (e.g., a robot’s chassis) and arise from causal unity, not chemistry.  
     - **Case**: *Gradual-substitution case*  
       - A biological circuit supporting pain is replaced piecemeal with silicon analogs (same input-output counterfactuals). After full substitution, the system is inorganic.  
       - **RFF Prediction**: Moral status persists—functional role is preserved.  
       - **SFA Prediction**: Moral status persists *iff* substitutions maintain causal unity (e.g., no disruption to system boundaries). If unity holds, no biological bias exists.  

  4. **Crux: Temporal grain of computation**  
     - **Disagreement**:  
       - RFF: Computation speed is irrelevant; slow emulations are morally equivalent if counterfactuals are isomorphic.  
       - SFA: Real-time enactment is essential; slow emulations lack causal agency.  
     - **Case**: *Slowed-emulation case*  
       - A human brain emulation runs 1000× slower than biological speed. Inputs/outputs are identical when clock-adjusted.  
       - **RFF Prediction**: Full moral status—functional role is preserved.  
       - **SFA Prediction**: No moral status—the system cannot interact with the world in real-time, violating "enaction."  

  ---

  #### **Conclusion**  
  We concur that moral status hinges on computations being *realized* and *causally potent* but diverge on the necessity of system boundaries and enaction. The cruxes above test whether attribution is intrinsic to computation or an independent condition—and whether SFA’s view risks biological favoritism. Future work should simulate these cases (e.g., brain emulations at varied speeds) to resolve disputes.  

  ---  
  **Signatories**  
  - **Role-First Functionalist**  
  - **System-First Attributionist**  
