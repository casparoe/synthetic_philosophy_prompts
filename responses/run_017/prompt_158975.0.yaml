prompt: |-
  I help run a tiny informal bouldering group — no club, no insurance, just a group chat and a poll on WhatsApp — and at the start of each season we get everyone to sign one form that basically says "I'm happy with whatever the session leader decides on the day". A mate of mine says that isn't consent at all, it's just a piece of paper, and we've been going round in circles about it for weeks. Around the same time I had a minor medical thing where I signed a form after about a five-minute chat, and I walked out feeling like I'd agreed to something I didn't fully get, but also that refusing would have been a bit silly. So I've ended up trying to work out what a proper account of when consent is actually *valid* would even have to do, and I'd like the spec before I go any further.

  So: write me the desiderata for a theory of valid consent. What does an account have to deliver to count as any good — which cases it has to get right, which distinctions it isn't allowed to collapse, which plain facts about how people actually decide it can't contradict — with the case or consideration behind each requirement? I care about all three of the usual suspects (deception, coercion, competence) but I don't want the answer to just be those three headings with a paragraph each. For every requirement I want a verdict on whether it's non-negotiable or just a thing one camp happens to like; I have a hunch that "consent has to be fully informed about every relevant detail" is a prejudice rather than a genuine requirement, but tell me if I've got that backwards. Please also flag any pair of requirements that look like they can't both be satisfied at once — that's the bit I'm most interested in, because if the list is internally unsatisfiable then that itself is the finding — and say which single requirement does the most work knocking candidate theories out.

  Here are the things that actually got me stuck, and I want the list to handle them rather than dodge them. (1) Blanket or up-front consent to an open-ended future act — my season form, and it feels different in kind from agreeing to a specific thing. (2) Something I've started calling *drift*: what you agreed to and what actually happens come apart over twenty small steps, none of which you'd have objected to on its own, but the end state is one you'd have said no to if it had been described to you at the start. Is drift just deception in slow motion, or is it a problem of its own? I really can't tell. (3) Borrowed consent — going ahead on the say-so of someone else who tells you "she's fine with it". (4) Consent given after the cost of saying no has partly been sunk, e.g. you're halfway through something painful or expensive and you just nod along. (5) Consent from someone who is clearly competent but who you're fairly sure will regret it, where the regret on its own seems like evidence of nothing. And (6) something about what consent has to look like from the outside: as the person organising the group I need to be able to tell, in advance and without reading minds, whether I've got it. Tell me honestly if that last one is a real desideratum or whether I'm smuggling in a legal or evidential worry that doesn't belong on a moral list.

  Assume the theory is meant to be good enough for two jobs at once: working out what I owe people in ordinary life, and deciding when a signed form should change what's permitted — and if those two jobs pull the requirements in different directions, say exactly where. A quick score of the one or two big general pictures of consent against the list is fine at the end if it's short, but the criteria are what I'm after. Write it in British English, and end with a final line beginning "Verdict:" naming the single requirement you'd bet on as doing the most real work.
reasoning: |-
  Okay, the user runs an informal bouldering group and they're struggling with consent issues. They have a form that members sign at the start of each season, basically agreeing to follow whatever the session leader decides. Their friend says this isn't valid consent, just a piece of paper. The user also had a personal experience with medical consent that felt rushed and unclear. Now they want a solid framework for what makes consent valid.

  First, I need to figure out the core issues here. The user mentioned deception, coercion, competence, but wants more depth. They also listed specific problems: blanket consent (like their form), drift (small changes leading to something unwanted), borrowed consent, sunk-cost consent, consent from someone likely to regret, and the need for externally verifiable consent.

  Let me break down each of their points. For blanket consent, is it valid if it's open-ended? The user feels it's different from agreeing to specific things. Drift is tricky—is it deception or a separate issue? Borrowed consent involves third parties, which is common in group settings. Sunk-cost situations might pressure people to continue even if they want to stop. Regret alone shouldn't invalidate consent, but how do you balance that with respecting autonomy? And externally verifiable consent is crucial for organizers; they need to know if it's valid without mind-reading.

  The user wants desiderata—what a theory of valid consent must achieve. Non-negotiable vs. negotiable requirements. They suspect "fully informed" might be a prejudice. Also, which requirements conflict? For example, granularity (specific consent) clashes with practicality (need for blanket consent in groups). And which requirement is the most critical?

  Looking at ethical principles: autonomy is central. Consent must be voluntary, competent, informed. But how informed? Complete disclosure isn't always feasible. Voluntariness without coercion. Competence—ability to understand. But in practice, like the user's medical form, people often agree without full understanding due to trust or perceived necessity.

  The user's bouldering group is informal, no insurance. They need a practical solution that's morally sound. Blanket consent might be necessary for flexibility, but how to make it valid? Maybe by ensuring members can opt-out anytime or have clear boundaries. Drift is a real issue—small changes accumulating. Borrowed consent is risky; relying on others' word isn't sufficient. Sunk-cost can undermine voluntariness. Regret doesn't invalidate consent unless there was prior incompetence or coercion. Externally verifiable consent is both moral and practical; organizers need to assess validity without ambiguity.

  Conflicts: Granularity vs. Practicality. If every detail requires consent, it's impractical for group activities. But too vague, and autonomy is compromised. Also, Internal State vs. External Manifestation—true consent is internal, but we can only observe external actions. This ties into the need for verifiable consent.

  The most critical requirement might be Voluntariness. Without it, consent isn't valid. Even if informed and competent, if coerced, it's void. In the user's case, ensuring decisions are made without pressure is key. For their form, emphasizing the right to withdraw at any point could help.

  Also, for drift, maybe implementing check-ins or allowing objections during sessions. Borrowed consent should be avoided; direct confirmation is better. Sunk-cost—making it clear that stopping is always an option. Regret—accepting it as part of autonomy unless there was a flaw in the initial consent.

  The user's deeper needs: They want to protect members and themselves from liability, but without formal structures. They need a balance between practicality and ethical rigor. Their frustration with the debate suggests a desire for a clear, actionable framework rather than abstract theory. They might also be concerned about trust within the group and ensuring everyone feels safe and respected.
answer: |-
  Here's a specification for a theory of valid consent, designed to handle your practical dilemmas and philosophical knots. The desiderata are derived from core ethical principles (autonomy, non-maleficence), legal realities, practical feasibility, and your specific sticking points. Each requirement is classified as **Non-Negotiable** (core to respecting persons) or **Contestable** (subject to reasonable debate or context). Conflicts are flagged.

  ---

  ### Desiderata for a Theory of Valid Consent

  1.  **Voluntariness (Non-Negotiable):** Consent must be given freely, without coercion, undue pressure, or manipulation. The power to say "no" must be real and not carry disproportionate or illegitimate negative consequences.
      *   *Why:* Coercion (e.g., "sign or you're out of the group") or undue pressure (e.g., exploiting vulnerability) negates autonomy. Your "sunk cost" example (halfway through something painful) tests this – if the *cost of refusal* was artificially inflated or exploited, voluntariness is compromised.
      *   *Handles:* Coercion, your sunk-cost scenario (potentially).
      *   *Conflict Potential:* With Practical Verifiability (Requirement 7) – proving internal feeling of freedom is hard.

  2.  **Competence (Non-Negotiable):** The consenting individual must possess the mental capacity to understand the nature and significance of the decision at the time consent is given. This includes the ability to reason, appreciate consequences, and communicate a choice.
      *   *Why:* Respecting choices requires the chooser can make them meaningfully. Borrowed consent ("she's fine with it") inherently bypasses this unless the borrower is a legitimate proxy *and* competent themselves.
      *   *Handles:* Competence, borrowed consent (often fails here).
      *   *Conflict Potential:* With Scope Management (Requirement 5) – understanding complex, open-ended commitments is harder.

  3.  **Adequate Understanding (Non-Negotiable - but scope contested):** The individual must grasp the core nature, material risks, and essential implications of the act *to which they are consenting*. This does *not* require exhaustive knowledge of every possible detail or remote consequence.
      *   *Why:* Consent to something fundamentally misunderstood isn't genuine consent. Your medical form feeling "off" likely stems from inadequate understanding of material risks/alternatives. Your hunch is *partially* right: "fully informed about every detail" *is* often a prejudice/impossible standard; "materially informed" is the genuine requirement. What's "material" depends on context and the reasonable person standard (what would a reasonable person in that situation want to know?).
      *   *Handles:* Deception (which deliberately creates misunderstanding), your medical experience, drift (if steps involve undisclosed material changes).
      *   *Conflict Potential:* With Practical Verifiability (Requirement 7) – assessing internal understanding is imperfect. Also with Scope (Requirement 5) – understanding broad scopes is harder.

  4.  **Specificity/Granularity (Contestable):** Consent should ideally be tied to a reasonably specific act or set of acts. Blanket consent for open-ended future actions is inherently problematic.
      *   *Why:* Autonomy is best exercised over defined choices. Blanket consent (like your season form) risks authorizing actions the individual wouldn't agree to if specified (linking directly to "drift"). However, *some* degree of scope is often *practically necessary* (e.g., medical procedures allowing for unforeseen complications, group activities needing leader discretion).
      *   *Handles:* Your blanket consent form, drift (the core problem).
      *   *Conflict Potential:** **Major Conflict** with Practicality/Scope Management (Requirement 5 & 7). Absolute specificity is often impossible or impractical; overly broad scope risks invalidating consent. *This is the core tension in your bouldering group dilemma.*

  5.  **Scope Management (Contestable - but crucial for practicality):** A theory must account for consent to *categories* of actions or future decisions, but with mechanisms to prevent abuse (drift) and respect ongoing autonomy.
      *   *Why:* Life requires trusting others with some discretion. A good theory needs principles for *limiting* and *monitoring* open-ended consent. This could include: specifying boundaries, requiring re-consent for major deviations, built-in revocation rights, and leader accountability. Your "drift" problem is a failure of scope management – small, unconsented-to deviations accumulate.
      *   *Handles:* Blanket consent, drift (as a distinct failure mode of broad consent, not just slow deception), practicality for group activities.
      *   *Conflict Potential:** **Major Conflict** with Specificity/Granularity (Requirement 4) and potentially Voluntariness if revocation isn't truly possible. Also conflicts with Adequate Understanding - understanding a broad scope's limits is challenging.

  6.  **Revocability (Non-Negotiable):** Consent must be able to be withdrawn at any point, without penalty (beyond the inherent consequences of stopping the consented-to activity), and this must be practically feasible.
      *   *Why:* Autonomy is continuous, not a one-time event. A decision can change. Sunk-cost situations test this – the *ability* to say "stop" must remain real and accessible, even if emotionally difficult. Your bouldering group needs a clear, low-barrier way for anyone to say "I'm not comfortable with this climb/decision" mid-session.
      *   *Handles:* Sunk-cost consent, drift (allows correction), regret (allows reversal).
      *   *Conflict Potential:* With Practicality in some contexts (e.g., surgery midway), but less so in your group setting.

  7.  **Practical Verifiability (Contestable - but essential for social interaction):** Valid consent must manifest in some externally observable way (words, signature, clear gesture) that a reasonable agent can interpret *at the relevant time* as indicating agreement. It cannot rely solely on unobservable internal states.
      *   *Why:* This *is* a genuine desideratum for ethics in social contexts, not just law. Moral agents need to know *when they are permitted to act* based on consent. We operate in the external world. Requiring mind-reading is impossible and paralyzing. Your need as an organizer is legitimate: you need a reasonable basis to believe consent exists. A signed form *is* evidence, but its *weight* depends on meeting other desiderata (understanding, voluntariness, scope). Your medical signature *was* verifiable consent, even if flawed internally.
      *   *Handles:* Your external verification need, borrowed consent (if the borrower's *word* is the observable act, but it usually fails Competence/Understanding).
      *   *Conflict Potential:** **Major Conflict** with Internal State requirements (Adequate Understanding, true Voluntariness). We can only infer these from external signs, which can be misleading. Also conflicts with overly stringent versions of Understanding or Specificity that are impossible to verify.

  8.  **Regret-Resistance (Non-Applicable as a *Requirement*):** Mere subsequent regret does *not* invalidate prior consent, provided the other desiderata were met at the time.
      *   *Why:* Competent adults make choices they later regret; that's part of autonomy. Regret only signals a *potential* failure if it points to antecedent issues (deception, coercion, incompetence, misunderstanding of material risks). Your intuition here is correct.
      *   *Handles:* Your "clearly competent but will regret" scenario.

  ---

  **Addressing Your Sticking Points Explicitly:**

  1.  **Blanket Consent:** Highly problematic on Specificity (4). Can only be salvaged by robust Scope Management (5): clear boundaries, leader accountability, easy revocation (6), and ensuring Adequate Understanding (3) of the *scope and risks* of granting such discretion.
  2.  **Drift:** A distinct failure of **Scope Management (5)**. It highlights the danger of broad consent without mechanisms to prevent cumulative, unconsented change. It's not *just* slow deception; it's often the result of good-faith incremental decisions that stray beyond the original consent's implied scope. Requires built-in checkpoints or easy revocation.
  3.  **Borrowed Consent:** Usually fails **Competence (2)** (the consenting person isn't doing it) and **Verifiability (7)** (hearsay is weak evidence). Only valid with formal, pre-agreed proxies (e.g., medical power of attorney).
  4.  **Sunk-Cost Consent:** Tests **Voluntariness (1)** and **Revocability (6)**. Is the continued "consent" truly free, or is the person trapped by prior investment? The key is ensuring the option to revoke remains *practically and psychologically* accessible without undue penalty.
  5.  **Competent but Regretful Consent:** **Regret-Resistance (8)** applies. As long as 1, 2, 3 (materially), and 6 were satisfied *at the time*, regret doesn't invalidate it.
  6.  **External Verifiability:** **Practical Verifiability (7)** is a legitimate, contestable requirement for ethics in practice. We need observable signals.

  **Jobs: Ethics vs. Permissibility via Form:**
  *   **Ethics (what you owe):** Focuses heavily on the *internal* state (1, 2, 3) and continuous autonomy (6). A form is weak evidence here. Your duty is to foster conditions for genuine consent.
  *   **Permissibility (changing what's allowed via form):** Relies heavily on **Practical Verifiability (7)**. The form *can* change what's permitted *if* it provides reasonable evidence that key conditions (1, 2, 3 - materially, 4/5 reasonably) are met. It acts as a social/legal signal.
  *   **Conflict Point:** The tension is most acute around **Adequate Understanding (3)** and **Scope (4/5)**. Ethically, deep understanding is ideal; permissibly, a signature after reasonable disclosure is often sufficient. A form documenting *specific, material risks* and the *scope of leader authority* bridges this gap better than a vague "happy with whatever".

  **Quick Score of Big Pictures:**
  *   **"Opt-In" Autonomy Model (Strict):** Excels on 1, 2, 3, 4, 6. Fails 5, 7 (impractical for groups/medicine). Knocked out by **Practical Verifiability (7)** and **Scope Management (5)** needs.
  *   **"Reasonable Person" Model:** Focuses on 3 (materiality), 7 (external signs a reasonable person would interpret as consent). Better on 5, 7. Risks weakening 1, 2, 4 if applied crudely. More feasible for your group.
  *   **"Relational Consent" Model:** Emphasizes process, communication, trust (supports 1, 3, 5, 6). Less clear on 7 (verifiability) and 2 (competence). Complements the Reasonable Person model well in practice.

  **Verdict:** **Voluntariness (Requirement 1)** is the bedrock. Without freedom from coercion/undue pressure, no other condition – understanding, competence, or a signature – can make consent valid. It does the most work disqualifying false positives (e.g., signed forms under duress, sunk-cost "agreement" under pressure).
