  ### Activity Design: Moral Uncertainty Allocation Seminar

  #### **Setup & Materials**
  - **Credence Chips**: Each student receives 10 physical chips (or digital tokens) to distribute privately across three moral views:
    - **View A (Near-term Consequentialism)**: Maximize immediate, measurable welfare (e.g., save lives today).
    - **View B (Deontological)**: Uphold rights/constraints (e.g., never harm innocents) and prioritize special obligations (e.g., aid kin/community).
    - **View C (Long-run Consequentialism)**: Focus on the far future; tiny probabilities of affecting humanity’s trajectory dominate.
  - **Projects & Scores**: Five projects compete for a $1000 play-money pot. **Do not reveal scores until after the class vote**. Describe projects verbally:  
    1. **Clean Water Initiative (CWI)**: Prevents 100 child deaths from waterborne diseases this year in impoverished regions.  
    2. **AI Safety Research (AI)**: 0.1% chance of preventing a global catastrophe that would end humanity (saving trillions of future lives).  
    3. **Emergency Food Relief (EFR)**: Provides 10,000 meals immediately in famine-stricken areas.  
    4. **Family Support Grants (FSG)**: Cash transfers to local low-income families (respects kinship obligations).  
    5. **Climate Infrastructure (CI)**: Builds flood barriers to protect coastal cities over 50 years.  

    *Hidden Scores* (revealed during debrief):  
    | Project | View A (Near-term) | View B (Deontological) | View C (Long-run) |
    |---------|--------------------|------------------------|-------------------|
    | CWI     | 8                  | 8                      | 8                 |
    | AI      | 1                  | 1                      | 10,000            |
    | EFR     | 10                 | 3                      | 1                 |
    | FSG     | 4                  | 10                     | 1                 |
    | CI      | 5                  | 5                      | 20                |  

  - **Rules**:  
    1. Students privately distribute 10 chips across Views A, B, C.  
    2. **Shortcut Vote**: Each student votes for the project ranked **best by their highest-credence view** (ties broken randomly).  
    3. **Binding Allocation**: After the vote, compute the class’s credence-weighted expected value (EV) for each project using hidden scores. Allocate $1000 proportionally to EVs.  
    4. **No Interruption**: Do not mention "moral uncertainty," "aggregation," or "expected value" until debrief.  

  ---

  #### **Timeline (75 Minutes)**  
  1. **Introduction (5 min)**:  
     - Frame the goal: "Allocate $1000 to one or more projects. Distribute your chips based on how plausible you find each view."  
     - Hand out chips. Students record distributions privately.  

  2. **Project Descriptions (5 min)**:  
     - Verbally describe projects (CWI, AI, EFR, FSG, CI) **without scores or rankings**.  

  3. **Shortcut Vote (10 min)**:  
     - Students vote for the project their highest-credence view favors:  
       - View A: EFR (best immediate impact).  
       - View B: FSG (best for obligations/constraints).  
       - View C: AI (best for long-run stakes).  
     - Tally votes publicly. *Expected outcome*: EFR or FSG wins (since A/B likely dominate credences).  

  4. **Credence Aggregation (15 min)**:  
     - Collect credence distributions. Compute class-average credences:  
       - Total chips for A, B, C ÷ 140 (14 students × 10 chips).  
       - E.g., A: 45%, B: 45%, C: 10%.  
     - Reveal the **score table**. Explain: "Scores represent how much each view values a project."  

  5. **Expected Value Calculation (20 min)**:  
     - Calculate EV for each project:  
       `EV = (Credence_A × Score_A) + (Credence_B × Score_B) + (Credence_C × Score_C)`  
       - E.g., with A:0.45, B:0.45, C:0.10:  
         - **AI**: (0.45×1) + (0.45×1) + (0.10×10,000) = **1000.9**  
         - **CWI**: (0.45×8) + (0.45×8) + (0.10×8) = **8.0**  
         - EFR: 5.95, FSG: 6.4, CI: 5.75.  
     - Allocate $1000 proportionally to EVs:  
       - Total EV = 1000.9 + 8.0 + 5.95 + 6.4 + 5.75 ≈ **1027**.  
       - AI gets ≈ $976 (1000.9 ÷ 1027), others split $24.  

  6. **Announce Binding Allocation (5 min)**:  
     - Declare: "$976 to AI Safety, $24 split among others." *Expect gasps or protests*.  

  7. **Debrief (25 min)**:  
     Use guided questions to expose engineered insights:  
     - **Compromise Project (CWI)**:  
       *"Why did CWI get no votes in the shortcut method? Yet in the EV method, it beat EFR, FSG, and CI. What does this reveal about compromises under moral uncertainty?"*  
       → *Insight*: CWI is 2nd-best for all views (scores 8/8/8) but never 1st. EV aggregation favors it when no theory dominates.  

     - **Fanaticism Problem (AI)**:  
       *"We allocated almost everything to AI. Did this feel right? Why or why not? How does View C’s score (10,000) affect the outcome?"*  
       → *Insight*: Tiny credence (10%) in C dominates due to massive stakes. Moral uncertainty "inherits" fanaticism; the class likely rejects this.  

     - **Intertheoretic Comparisons (Scaling Sensitivity)**:  
       *Recalculate EVs after halving View C’s scores (AI now 5000, CI 10):*  
       - New AI EV: (0.45×1) + (0.45×1) + (0.10×5000) = **500.9**  
       - New allocation: AI ≈ $500, CWI ≈ $16.  
       *"Why did AI’s share drop? What if we doubled View B’s scores? What does this say about the EV method?"*  
       → *Insight*: EV aggregation is sensitive to arbitrary score scaling. Ordinal rankings aren’t enough; cardinals require contested comparisons.  

     - **Broader Takeaways**:  
       *"How might this apply to real-world decisions (e.g., policy, charity)? What alternatives exist to EV aggregation?"*  

  ---

  #### **What Will Go Wrong (First Run)**  
  1. **Credence Skew**: If >15% credence pools in View C, AI’s EV dominance becomes extreme, causing frustration. Mitigate by reminding students to distribute chips "as if uncertain."  
  2. **Time Crunch**: EV calculations may run long. Prep a spreadsheet to auto-compute.  
  3. **Student Rebellion**: The class may refuse the AI allocation. *Use this!*: "Why resist? Is this a flaw in the method or our intuitions?"  
  4. **Vote Ties**: If EFR/FSG tie in the shortcut vote, flip a coin. Ensures a "non-compromise" wins.  
  5. **Scores Questioned**: Students may challenge AI’s "10,000" score. Reply: "We need concrete numbers to compare theories—but assigning them is fraught."  

  ---

  #### **What the Activity Cannot Model**  
  1. **Non-Quantifiable Values**:  
     - Deontological constraints (View B) are often binary (e.g., "never torture"), but scores force cardinalization. *Supplement verbally*: "Some argue View B resists trade-offs. Can we ‘score’ a side-constraint?"  

  2. **Credence Formation**:  
     - Students’ chip distributions are static. *Explain*: "Real moral uncertainty involves updating credences via debate—we skipped this."  

  3. **Risk Aversion**:  
     - The model assumes linear value scaling. *Note*: "Should we discount low-probability, high-stakes outcomes (e.g., AI’s 0.1% chance)?"  

  4. **Alternative Aggregation Methods**:  
     - The activity uses EV maximization. *Clarify*: "Other approaches exist, like maximin or my favorite theory. We’ll compare them next week."  

  5. **Intertheoretic Unit Comparisons**:  
     - Scores imply "1 unit of A-value = 1 unit of B-value." *Emphasize*: "This is the deepest problem. We assumed comparability, but philosophers disagree."  

  ---  
  **Final Note**: The activity’s power lies in *experiencing* aggregation failures. By making choices binding and scores hidden, students confront fanaticism, compromise, and scaling fragility firsthand—setting up rigorous debriefing on moral uncertainty’s core challenges.
