            Project 3: A:10, B:3, C:1
            Project 4: A:4, B:10, C:1
            Project 5: A:2, B:2, C:20

          We are ready.

          Summary timeline:

            0-5 min: Intro. Distribute chips and collect.

            5-10 min: Describe the 5 projects.

            10-15 min: Each student votes for the project of their top theory (shortcut). Tally and announce the winner.

            15-20 min: Reveal the score table.

            20-30 min: Compute class credences and then the EVs for each project.

            30-40 min: Compute the total EV and the allocation (in dollars).

            40-45 min: Announce allocation.

            45-75 min: Debrief.

          Debrief questions:

            - What did the shortcut method give us? Why?
            - What did the expected value method give us? Why?
            - How did the class feel about the allocation from the expected value method?
            - How did the presence of Project 2 affect the outcome?
            - What if we remove Project 2? Let's recalc the EVs and allocation without Project 2. What happens? (Project 1 wins.)
            - What if we rescale View C's scores by dividing by 100? Let's recalc. How does the allocation change?
            - Why is Project 1 a good candidate under moral uncertainty? (It's a compromise.)
            - What are the problems with the expected value method? (Fanaticism and intertheoretic comparisons.)
            - How might we address these problems? (This points to ongoing research.)

          What will go wrong:

            - The computation might be messy and take time. We can prepare a spreadsheet in advance.

            - The students might not accept the scores. We can explain that we set them for illustration, but in reality, these numbers are hard to get.

            - Some students might have tied credences. We can have a rule: if tie, choose the first one alphabetically, or flip a coin.

            - The shortcut vote might have ties. Same.

            - The class might want to use a different aggregation method. We can acknowledge that and say we are illustrating one method.

            - The fanaticism problem might not arise if the class has zero credence in C. We can assume that at least one student assigns some credence to C.

          To ensure the fanaticism problem, we can say: "Remember, one of the views is long-run consequentialism, which many philosophers find compelling to at least some degree." We can also seed the class by having the instructor assign one student to have at least one chip in C.

          But we want it to be their own credences. We'll hope for the best.

          What the activity cannot model:

            - We are treating moral uncertainty as analogous to empirical uncertainty, but some argue it's different.

            - We are using a simple linear aggregation (expected value) but there are other methods (e.g., maximizing the minimum score across views, or using a risk-averse approach).

            - The cardinal scores are given, but in reality, we might only have ordinal rankings.

          We will mention these in the debrief.

          This should meet the requirements.
