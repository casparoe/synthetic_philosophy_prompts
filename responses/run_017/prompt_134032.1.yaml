  Okay, the user is dealing with a philosophical argument about Dutch-book arguments and rationality during conceptual change. They're revising a paper and a friend presented this "unbidden-hypothesis argument" that seems to prove too much - essentially that rationality requires conceptual finality, which is absurd. The user wants to preserve book-immunity as necessary for rationality (premise 1) and the conservation lemma (premise 2), but finds the conclusion unacceptable.

  The argument centers on Clara, a physician who shifts from miasma/contagion theory to germ theory. When she encounters germ theory (K), her hypothesis space is reconfigured. The conservation lemma says her credences on old propositions must stay the same without new evidence, but the argument claims rationality requires them to decrease because the old framework was flawed. This creates tension: conservation demands stability while rationality demands reduction. The conclusion is that anyone not in the final conceptual scheme is irrational.

  Hmm... the key tension is between premise 2 (conservation) and premise 5 (mandatory reduction). Premise 5 claims that when old categories become "degenerate," rationality requires lowering credences in all old propositions. But why must this happen immediately upon considering K? The argument assumes that merely considering K reveals the old space as inadequate, but this conflates two distinct moments: the arrival of the new hypothesis versus evidence demonstrating its superiority.

  Ah! The critical flaw is in step 5's bridge from "old categories are inadequate" to "must immediately lower all credences." This presumes the agent already accepts K's superiority upon its mere presentation, which isn't rational unless supported by evidence. Without evidence, Clara shouldn't downgrade M/C yet - she should remain uncertain how K affects them. The conservation lemma still applies until evidence arrives.

  The user's worry about the nickel bet not being available is spot-on. In the actual case where old categories become obsolete (say after robust evidence for germ theory), Clara wouldn't still price M-bets at 0.7 - she'd have updated based on evidence, so the bookie couldn't exploit her via conservation. The exploitation scenario only works in the artificial gap where she's adopted K without evidence.

  Regarding the catch-all: even if Clara had a "something else" hypothesis, it wouldn't help here because the problem is misapplication of conservation during conceptual transition, not absence of a catch-all. The deeper issue is treating conceptual exploration as requiring immediate credence shifts rather than evidence-driven updates.

  So we can preserve (1) and (2) by limiting conservation to cases without new evidence or conceptual change - but actually, the lemma still holds if we distinguish between merely considering new hypotheses versus evidentially updating. The framework isn't silent; it shows that premature credence shifts without evidence are exploitable, which is correct. Rational conceptual change requires evidence to drive updates, not just hypothesis generation.
answer: |-
  Your friend's argument is clever but overreaches, and the fracture point lies in step (5)'s leap from "the old categories were inadequate" to "rationality requires her confidence in *every* proposition of the old language to fall." This claim conflates the *epistemic significance* of encountering a new hypothesis with the *evidential basis* for revising beliefs. It smuggles in an unstated assumption that merely *considering* the germ theory (K) constitutes evidence against the old categories (M and C), forcing an immediate reduction in credence. This isn't warranted, and it's where the conservation lemma (2) and the demand for reduced confidence (5) clash irreparably. Here's how it breaks down, preserving (1) and (2).

  The conservation lemma (2) correctly states that without new evidence, book-immunity requires Clara's new credences over the *old propositions* (M and C) to match her old ones. This is arithmetic: if she changes her fair price for a bet on M from 0.7 to 0.6 without new evidence, a bookie can exploit her by selling her the bet at 0.7 and buying it back at 0.65, netting a sure loss. Crucially, this holds *even if Clara is now considering K*. The lemma relies solely on the propositions being expressible in the old language and the absence of new evidence. Step (3) is also sound: her new credences over the *refined* space (M, C&K, C&~K) *are* underdetermined by her old credence for C. Nothing in coherence dictates how the 0.3 splits.

  Step (5) fails because it asserts that the mere *arrival* of K – the unbidden hypothesis – constitutes a reason for Clara to "distrust the space" and uniformly lower her credences in M and C. But why? Unless K is accompanied by *evidence* demonstrating the inadequacy of M and C, Clara has no rational grounds to reduce her confidence in them *yet*. Encountering K means she now recognizes a *possibility* she hadn't conceived, not that she has *evidence* against M or for K. Rationality does not demand an immediate global loss of confidence in the old framework upon merely conceptualizing an alternative; it demands that she *integrate* the new possibility coherently. She could rationally maintain her 0.7 credence in M while assigning some portion of the 0.3 to C&K and C&~K, pending evidence. Step (5) incorrectly assumes that conceptual innovation inherently *discredits* the old space, transforming K's arrival into pseudo-evidence.

  This misstep bridges the gap between underdetermination (3) and mandatory reduction (5), creating the contradiction with conservation (2). If Clara *does* uniformly lower her credence in M (say to 0.6) *solely* because K has entered her consideration, *without new evidence*, then the bookie *can* exploit her via the conservation lemma, demonstrating a genuine failure of book-immunity. But this failure stems precisely from her *irrational* revision: she changed her credence without evidence, violating conditionalization (or synchronic coherence if the change is instantaneous). Book-immunity (1) correctly flags this as irrational. However, if she *doesn't* change her credence in M (keeping it at 0.7), integrating K coherently by splitting the C-portion, she satisfies conservation (2) and avoids this exploit. Step (5) wrongly insists she *must* lower it anyway, creating the illusion that book-immunity forces irrationality or finality.

  Your worry about the nickel bet’s availability hits the nail on the head. In the scenario where the old categories genuinely become obsolete – *after Clara has received compelling evidence for germ theory and against miasma* – she *would* rationally lower her credence in M dramatically, perhaps to near zero. Crucially, this revision is driven by *evidence*, not merely K's arrival. The conservation lemma *does not apply here* because new evidence *has* arrived. The bookie can't exploit her via the old bet discrepancy because her credence change is justified. The nickel bet exploit only works in the artificial gap where she changes her mind without evidence. Step (4) attempts to pre-empt this by claiming the old categories don't "survive," but survival isn't binary. Before evidence, M remains a meaningful proposition in the old language; its *content* hasn't changed, even if Clara suspects it might be empty. The bookie’s bet is on M *as she previously understood it*. Only evidence justifies ceasing to treat it as a live possibility.

  Regarding the catch-all (7): its dismissal is mostly correct but tangential. A catch-all ("something not conceived") doesn't solve the core problem. Assigning it a sharp credence *is* arbitrary, and without it, synchronic incoherence looms. But even with a catch-all, the key issue remains: upon conceiving K, should Clara immediately drain credence from M and C into the catch-all or into K-related partitions? Premise (5) insists she must drain it, but without evidence, this is unjustified. The catch-all might help manage unforeseen possibilities *before* they are conceived, but it doesn't license evidentially unmotivated belief shifts upon their conception.

  The bookie's conceptual foresight isn't the fundamental flaw. A perfectly rational Clara *could* be exploited *if* she irrationally lowers her credence without evidence upon hearing K. The bookie only needs to know she *has* changed her mind, not why K is superior. The deeper issue is that step (5) mistakes this irrational reaction for a rational requirement.

  So, you can hold (1) and (2). Book-immunity remains a necessary condition for rationality, and the conservation lemma stands as a guard against evidentially unmotized belief shifts. The framework doesn't fall silent on conceptual change; it illuminates how it *should* work rationally. Conceptual expansion itself doesn't mandate credence shifts. When a new hypothesis arrives:
  1.  **Without evidence:** Clara should preserve her old credences over the old propositions (satisfying conservation/immunity) while coherently extending her credences to the new partitions (reflecting the underdetermination). Her confidence in M stays at 0.7 until evidence challenges it.
  2.  **With evidence:** New evidence justifies updating via conditionalization (or Jeffrey conditioning). Credences in old propositions like M may plummet, but the conservation lemma no longer binds, and immunity is maintained through justified updating.

  The unbidden-hypothesis argument errs by collapsing the first scenario into the second. It treats the *act of conceptual innovation* as if it were *itself* evidence, demanding immediate retrenchment. Rationality requires no such thing. Book-immunity, rightly understood, doesn't force conceptual finality; it enforces discipline during conceptual transition, ensuring beliefs shift only when evidence warrants it. The "interesting epistemic action" – how new concepts form, how evidence interacts with them, how underdetermination is resolved – happens within this constraint, not outside it. Your project survives: exploitability still provides a handle, showing that premature retreat from old frameworks without evidence is indeed irrational, not that any retreat requires having finished inquiry.
