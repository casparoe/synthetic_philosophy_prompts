prompt: |-
  I am writing up my settled position on the epistemology of moral testimony for a reading group, and I would like it stress-tested for internal consistency before I present it. What follows is the package as I actually hold it, including one principle of my own that I have not seen defended anywhere and that I am not confident about.

  1. Asymmetry. I am a pessimist about moral testimony. A moral belief formed purely on another person's say-so — I am told that some practice is unjust, I have no independent grip on why it is, and I believe it anyway — is defective in a way that ordinary empirical testimonial belief is not. I have no quarrel with deferring to a mechanic about my car or to a colleague about the trains; those beliefs are in perfectly good epistemic order. The defect in the moral case is not that the belief is unlikely to be true, and I do not want to claim that it can never constitute knowledge. It is a real defect nonetheless.

  2. Grounds. The best explanation of 1 is that a moral belief is supposed to be held in light of the considerations that support it. Someone who believes that a practice is wrong only because she was told so does not stand in the right relation to the reasons there are, and the belief is for that reason second-rate — defective in the holder rather than unreliable as a guide to the facts.

  3. No expertise. A large part of why moral testimony is different is that there are no moral experts in the sense in which there are transmission experts or diagnostic experts. There is no track record by which one could be identified, no credentialing, and pervasive and apparently intractable disagreement among the people who would be candidates. Moral testimony therefore lacks the backing that normally makes testimony a good source.

  4. Transmission is fine. None of this applies to testimony that conveys the reasons. If an activist tells me that a certain agricultural practice is wrong and gives me the considerations, and I see their force, my belief is in perfect order — and it does not matter at all that I would never have found those considerations myself, or that I cannot defend them under pressure, or that I would have believed the opposite if I had been told the opposite first.

  5. Conciliationism. When someone I take to be my epistemic peer disagrees with me about a moral question, I should substantially reduce my confidence and move some distance toward her view, even if she offers me no new considerations and even if my own reasoning still looks fine to me on reflection.

  6. Inaccessibility exemption. This is my own addition, and it is the part I am least sure about. I want to say that the defect identified in 2 does not arise when the recipient could not, even in principle, have come to grasp the relevant grounds herself — because the grounds are accessible only from experience she cannot have, or require a kind of perceptual or social sensitivity that cannot be communicated in the space available. In such a case deferring is not defective at all, even though the recipient ends up exactly as she would in the paradigm bad case: believing, without grounds, on someone's say-so.

  7. Anti-moral-worth. I reject the strong Kantian claim that an action has moral worth only if the agent acts for the right reason. What matters, morally, is that people act rightly and reliably; whether the agent could articulate why is at best of derivative interest, and it is certainly not the kind of thing that could make a true and action-guiding belief epistemically defective.

  Please audit the set. Specifically:

  Tell me which pairs are in genuine tension and which only look as though they are. I would rather you discriminate than flag everything, and I would rather you rank the genuine tensions by severity than list them as equal. In particular I want to know whether 2 can do the work 1 asks of it once 7 is on the table, whether 4 collapses 1 into a claim that is equally true of mathematics and therefore not an asymmetry at all, whether 6 is in fact a form of the expertise that 3 denies, and whether 5 is in tension with 1 and 3 given that the belief conciliationism leaves me with is precisely a belief I do not hold in light of the considerations that support it.

  For each genuine tension, say what would have to give and what the cheapest repair is, and say what the repair costs me elsewhere in the set. Then name the single revision that cleans up the most, and the one commitment that is most likely load-bearing for the whole package.

  Finally, apply the package — before and after your recommended revision — to the following case, and tell me whether the verdict changes. A compliance officer has recently moved to a country whose workplace norms she does not share. Local colleagues tell her that a near-universal practice, in which junior staff are expected to attend late-night social events with senior staff and to perform songs, is degrading in a way outsiders almost never see. She cannot see what is wrong with it; she has tried. She can act on it only at real cost to herself and to the firm's local relationships. Say what, on my package, she ought to believe, what she ought to do, and whether the answer changes if, after two years, she still cannot see the wrongness. I am interested in whether my commitments can generate a confident verdict here at all, or whether their content only shows up in cases of a different shape.

  Please do not give me a survey of the literature or tell me who has held which of these views; I want the audit of this set, with the moves made explicit so I can see where the pressure is coming from.
reasoning: |-
  Okay, I need to help stress-test this user's epistemology of moral testimony package. They've presented seven distinct principles and want me to identify internal tensions, suggest repairs, and apply their framework to a specific case. 

  First, I notice the user is clearly a professional philosopher - probably a grad student or early-career academic given the reading group context. Their writing is precise and they're self-aware about the novelty of principle 6. They're not looking for literature review but pure logical analysis, which suggests confidence in their grasp of existing debates.

  The core tension I see immediately is between principle 2 (moral beliefs must be held "in light of considerations") and principle 7 (rejecting that actions require acting for the right reason). If epistemic defect doesn't translate to moral defect, why should we care about the epistemic defect at all? That threatens to make principle 1's asymmetry merely academic. 

  Principle 4 is clever but dangerous - by allowing testimony that conveys reasons, it risks collapsing the moral/empirical distinction since we often get empirical reasons via testimony too (e.g. a mechanic explaining why my alternator failed). The user needs to explain why "seeing the force" of moral reasons transmitted this way is different from seeing the force of empirical reasons.

  Principle 6 feels like a Trojan horse. Calling inaccessible grounds an "exemption" practically invites the objection that it reinstates moral expertise through the back door. If there are cases where only certain people can access the grounds, that sounds suspiciously like expertise. The compliance officer case will test this brutally - after two years of failed understanding, is she really "unable in principle" or just currently unable?

  Conciliationism (5) is the silent killer here. When I move toward a peer's view without new reasons, I end up holding a belief that violates principle 2 by definition. Yet conciliationism is arguably the most defensible part of the package in contemporary epistemology. 

  For repairs, the cheapest fix might be to tweak principle 2's "in light of considerations" to allow for dispositional access rather than occurrent awareness. But that risks blurring the line with testimony. The nuclear option would be to drop principle 6 entirely - it's the user's novel addition but causes disproportionate problems.

  The compliance officer case exposes everything. Initially, principle 6 might excuse her deference to locals about the degrading nature of the practice. But after two years, that exemption looks shakier - either she's incapable of understanding (supporting 6) or she's rejecting the grounds (undermining 5). The package might force her to act against the practice while privately doubting it, which feels psychologically messy but not logically inconsistent. 

  I should emphasize that principle 3 (no expertise) is the most load-bearing - if that falls, the whole structure crumbles. The user must defend that moral disagreement is uniquely intractable compared to other domains. That's plausible but contentious.
answer: |-
  Here’s a systematic audit of your position, focusing on internal tensions, repairs, and application to your case study. I’ve prioritized genuine tensions over apparent ones, ranked by severity, and avoided external literature.

  ---

  ### **Ranked Genuine Tensions** (Most Severe First)

  1. **Tension between (2) Grounds and (7) Anti-moral-worth**  
     - **Severity:** High (threatens coherence of the asymmetry’s significance).  
     - **Problem:** (2) claims moral beliefs are defective if not held "in light of considerations." (7) denies that actions need to be done "for the right reason" to have moral worth. This risks trivializing (2)’s defect: if lacking grounds doesn’t affect moral action’s worth, why care about the epistemic defect? (1)’s asymmetry becomes theoretically weightless.  
     - **Cheapest Repair:** Limit (7) to *moral worth of actions* while insisting (2)’s defect is purely epistemic. Emphasize that (2) describes an epistemic failing, not a moral one.  
     - **Cost:** Weakens the practical urgency of (1)–(2). If the defect doesn’t impact action, its importance is academic.  

  2. **Tension between (6) Inaccessibility Exemption and (3) No Expertise**  
     - **Severity:** High (undercuts the core argument against expertise).  
     - **Problem:** (6) permits non-defective deference when grounds are inaccessible (e.g., due to lacking experience). But this *presupposes expertise* in the testifier: they must possess unique access to grounds, trackable via social role (e.g., "insider"), which (3) denies exists. (6) thus reinstates expertise through the back door.  
     - **Cheapest Repair:** Reframe (6) as "temporary proxy" for inaccessible grounds, not exemption. Stress that recipients must *seek* grounds (e.g., through experience) to avoid permanent deference.  
     - **Cost:** Risks collapsing into (4) (transmission of reasons over time) and weakens (6)’s distinctness.  

  3. **Tension between (5) Conciliationism and (2) Grounds**  
     - **Severity:** Moderate (manageable with clarification).  
     - **Problem:** (5) requires reducing confidence in peer disagreement, even without new reasons. The resulting belief violates (2): it’s held due to disagreement, not "in light of considerations." This contradicts (2)’s demand for direct grounding.  
     - **Cheapest Repair:** Distinguish *belief revision* from *belief formation*. Concede that conciliation yields a *defective* belief by (2)’s standard but argue this is the epistemically responsible response to disagreement.  
     - **Cost:** Admits (5) generates (2)-defective beliefs, weakening (1)’s asymmetry claim (since empirical beliefs might face similar peer pressure).  

  4. **Tension between (4) Transmission and (1) Asymmetry**  
     - **Severity:** Low (resolvable by nuance).  
     - **Problem:** (4) allows moral belief via testimony if reasons are transmitted and "seen." But math testimony also transmits reasons (e.g., a teacher explaining a proof). If math deference is acceptable, (1)’s asymmetry vanishes.  
     - **Cheapest Repair:** Restrict (4) to *non-a priori domains*. Argue that moral reasons require contextual/sensory engagement (e.g., empathy), unlike mathematical reasoning.  
     - **Cost:** Requires committing to moral knowledge as non-a priori (contra some realism).  

  ---

  ### **Key Revision & Load-Bearing Commitment**  
  - **Highest-Impact Revision:** **Drop or radically restrict (6)**. It conflicts fatally with (3) and invites slippery slopes (e.g., overclaiming "inaccessibility"). Repairs cost more than (6) adds.  
  - **Most Load-Bearing Commitment:** **(3) No Expertise**. This anchors (1)’s asymmetry and (6)’s tension. If expertise exists, (1) and (3) collapse.  

  ---

  ### **Application to Compliance Officer Case**  
  **Your Package (Original):**  
  - **Ought to Believe:** She may defer non-defectively via (6) initially (grounds are inaccessible to outsiders). But (2) pressures her to seek grounds.  
  - **Ought to Do:** Act against the practice (since testimony is reliable per (3)/(6)), despite costs.  
  - **After 2 Years:** If she *still* can’t grasp grounds, (6) exempts deference. But (5) conciliationism may force her to weight locals’ views heavily, sustaining belief.  

  **Your Package (After Dropping 6):**  
  - **Ought to Believe:** Belief based on testimony is *defective* (via (2)), but she may rely on it provisionally while seeking grounds (e.g., discussing with affected juniors). (5) requires conciliating toward locals’ view.  
  - **Ought to Do:** Act against the practice—(7) separates action-worth from epistemic grounds.  
  - **After 2 Years:** Persistent inability to grasp grounds makes belief *stably defective* by (2). She should still act against the practice (per (7)), but her belief rests on trust, not reasons.  

  **Verdict Confidence:**  
  - Original package generates a verdict (act, defer) but wobbles on belief-status over time.  
  - Revised package (sans (6)) yields a clear practical verdict (act) but admits stable epistemic defect. Both handle the case, but the revision is more internally consistent.  

  **Pressure Points Revealed:**  
  - (6) is the main source of instability, conflicting with (3).  
  - (7) shields practical decisions from epistemic defects, saving the case’s action-guiding verdict.  
  - The asymmetry (1) is preserved by (3)’s "no expertise" claim, which remains pivotal.  

  ---  
  **Final Recommendation:** Drop (6) and clarify that (2)’s defect is epistemic, not moral/practical (defended by (7)). This resolves the worst tensions while preserving your core asymmetry. The compliance officer case confirms that the package delivers practical guidance even with defective beliefs—a feature, not a bug, per your anti-Kantianism.
