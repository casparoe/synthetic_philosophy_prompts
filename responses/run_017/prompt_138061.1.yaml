  ### Thought Experiment: Procrastination Without Weakness of Will  
  **Scenario for the Column (97 words):**  
  "Alex, a freelance writer, has two days to complete an article. He can either draft a quick version today for $100 tomorrow or write a polished piece over both days for $120 the day after. On Monday, he prefers the polished piece and commits to it. But on Tuesday, he chooses the quick draft, which pays $100 that day. Alex knew this would happen on Monday, regrets his choice, and would have used an app to lock in the polished plan. He ends up with $100, not $120, and feels weak-willed."

  ### Walkthrough  
  **1. Reversal from Discounting Model (Not Stipulated):**  
  - **Functional form**: Quasi-hyperbolic (β-δ) discounting. Utility at time \(t\): \(U_t = u_t + \beta \sum_{k=t+1}^{T} \delta^{k-t} u_k\), where \(u_k\) is the reward at time \(k\).  
  - **Parameters**: \(\beta = 0.8\) (present bias), \(\delta = 0.95\) (exponential discount factor). Rewards: Smaller-sooner (SS) = $100 at delivery time (1 day away), Larger-later (LL) = $120 at delivery time (2 days away).  
  - **Computations**:  
    - **Choice point 1 (Monday, t=0)**:  
      - SS: $100 at t=1 → Discounted utility = \(\beta \delta \times 100 = 0.8 \times 0.95 \times 100 = 76\).  
      - LL: $120 at t=2 → Discounted utility = \(\beta \delta^2 \times 120 = 0.8 \times (0.95)^2 \times 120 = 0.8 \times 0.9025 \times 120 = 86.64\).  
      - Verdict: 86.64 > 76 → Prefers LL.  
    - **Choice point 2 (Tuesday, t=1)**:  
      - SS: $100 at t=1 (now) → Discounted utility = \(100\) (immediate, no discount).  
      - LL: $120 at t=2 → Discounted utility = \(\beta \delta \times 120 = 0.8 \times 0.95 \times 120 = 91.2\).  
      - Verdict: 100 > 91.2 → Prefers SS.  
  - **Inequality flip**: At t=0, LL (86.64) > SS (76); at t=1, SS (100) > LL (91.2). This reversal emerges from \(\beta < 1\), which steeply discounts near-future rewards when they are not immediate.

  **2. No Acting Against Better Judgment:**  
  Alex always chooses what he judges best *at each moment*:  
  - On Monday, he judges LL better (86.64 > 76) and plans it.  
  - On Tuesday, he judges SS better (100 > 91.2) and takes it.  
  He is sophisticated: On Monday, he fully predicts his Tuesday behavior but cannot "precommit" without external help (no new information, forgetting, or impulse). This satisfies specification 2—no akrasia (acting against judgment).

  **3. Worse Off by Own Lights and Desire for Commitment:**  
  Alex ends up worse off: He receives $100 (SS) instead of $120 (LL), so he loses $20.  
  - **Why Monday’s perspective counts for welfare**:  
    - At t=0, Alex uses a time-consistent exponential discounting (\(\delta\) only) for *evaluating overall welfare* (a common standard in behavioral economics). This reflects his "long-term self" in a cool, unbiased moment:  
      - SS: \(\delta \times 100 = 0.95 \times 100 = 95\).  
      - LL: \(\delta^2 \times 120 = (0.95)^2 \times 120 \approx 108.3\).  
      - Since 108.3 > 95, LL is better for his overall welfare.  
    - By contrast, Tuesday’s preference (SS) is "biased" by \(\beta < 1\), overweighting immediacy. Alex regrets his choice and seeks commitment devices to align actions with his unbiased welfare judgment. An ordinary reader calls this weak-willed because he caves to short-term temptation despite knowing the cost.

  **4. Key Feature, Minimal Variant, and Akratic Sibling:**  
  - **Working feature**: Present bias (\(\beta < 1\)). This allows preferences to shift "legitimately" (specs 1–2) while causing welfare loss (spec 3).  
  - **Minimal variant**: Change \(\beta\) to 1 (no present bias), keep other parameters identical.  
    - t=0: SS = \(\delta \times 100 = 95\), LL = \(\delta^2 \times 120 \approx 108.3\) → Prefers LL.  
    - t=1: SS = 100, LL = \(\delta \times 120 = 114\) → Prefers LL (no reversal).  
    - **Breaks verdict**: (3) is false—Alex follows through, gets $120, and feels no regret. The welfare loss and "weak-will" feeling vanish.  
  - **Akratic sibling**: Add a **temporary visceral factor** (e.g., Tuesday anxiety) that doesn’t alter Alex’s judgment but causes action against it.  
    - Scenario: On Tuesday, Alex *judges* LL better (exponential view: 114 > 100) but feels overwhelmed and chooses SS anyway.  
    - **Why it produces genuine akrasia**: He acts against his all-things-considered judgment (spec 2 broken) due to a "moment of weakness," fitting the classic definition of weakness of will.

  **5. Objections and Replies:**  
  - **Objector (shifting preferences)**: "Alex’s Tuesday preference is valid—why privilege Monday’s view? Calling this ‘weakness’ moralizes normal preference shifts."  
  - **Reply**: Welfare should reflect the agent’s unbiased, long-term perspective (t=0 with \(\delta\) only), as it’s time-consistent and avoids arbitrary temporal bias. Alex’s regret and desire for commitment show he disavows Tuesday’s choice.  
  - **Force**: **Serious but not fatal**. The welfare standard is contested (see below), but Alex’s consistency-seeking behavior supports the t=0 perspective.  

  **Settled vs. Contested Claims:**  
  | Claim | Status | Note |  
  |-------|--------|------|  
  | Present bias explains procrastination reversals. | Settled | Robust evidence in behavioral economics. |  
  | Welfare should use time-consistent (exponential) discounting. | Contested | Some argue for "current preferences" as welfare-relevant. |  
  | Weakness of will requires acting against judgment. | Settled | Philosophical consensus (akrasia definition). |  
  | Present-biased procrastination counts as weakness of will. | Contested | Depends on whether "will" includes preference shifts. |  
  | Sophistication (self-awareness) mitigates procrastination. | Contested | Evidence mixed; may increase anxiety without commitment. |  

  **Conclusion for the Column**: The case shows the question—"Is procrastination a failure of will or timing?"—is badly posed. It’s both: Timing-driven preference shifts (discounting) cause welfare loss without akrasia, but this loss feels like weak will. The core issue is not a "moral failure" but misalignment between biased momentary preferences and long-term welfare.

