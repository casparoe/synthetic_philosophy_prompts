  Hmm, this is a fascinating and complex query about moral standing in blame. The user presents a detailed set of cases and distinctions from their professional experience in workplace mediation, seeking a principled framework they can apply consistently.

  First, I need to understand their core struggle: they have strong intuitions about when someone has standing to blame ("no standing," "diminished standing," "full standing") but can't articulate a rule that fits all cases. Their three key distinctions are crucial: blameworthiness of the target, standing of the blamer, and pragmatic considerations about whether blaming is productive. 

  Looking at their cases, several patterns emerge:
  - Reformation matters (Case 2 vs Case 1)
  - Role authority can override hypocrisy (Case 6)
  - Complicity in the wrong removes standing (Case 8)
  - Shared struggle can sometimes increase standing (Case 9)
  - Magnitude/seriousness affects standing asymmetrically (Cases 12a/b)

  Their tentative principle has merit but fails on cases like 9 (fellow struggler) and 11 (hypocrite about hypocrisy). I notice they're particularly troubled by the tension between Case 1 (liar blaming liar) and Case 9 (recovering addict confronting another).

  The user wants a principle that explains why hypocritical blame fails when it does - not just as an intuition but as part of the standing framework itself. They also want clarity on the nature of standing (scalar/threshold, forfeitable/waivable, etc.).

  I'll structure the response around:
  1. Defining the core mechanics of standing as moral capital
  2. Presenting a 3-part principle with conditions
  3. Testing it against all their cases
  4. Answering their theoretical questions about standing's nature
  5. Applying it to their three new cases
  6. Explaining how this framework diagnoses the wrong in hypocritical blame

  The key insight is that standing depends on whether the blamer's act of blaming draws from their available "moral capital" regarding that specific norm. This explains why reformation restores capital, why roles provide institutional capital, and why complicity bankrupts capital. It also makes sense of asymmetrical cases (12a/b) - small faults don't deplete capital needed for large wrongs, but large faults do.

  For their unresolved cases:
  - Case 9 (fellow struggler) works because their struggle validates the norm's importance
  - Case 11 (hypocrite about hypocrisy) succeeds because grandstanding accusations target performative insincerity, not the content of moral claims
  - The smoking parent (Case 7) fails because parental authority requires modeling, unlike referees

  The framework should clearly show which of their intuitions hold (most do) and which might need adjustment (possibly Case 5 - the general wreck). Most importantly, it should give them concrete conditions to apply in mediation rooms.
answer: |-
  Based on your cases and distinctions, I propose a **Moral Capital Principle** for standing to blame. This principle explains why hypocritical blame fails when it does, reconciles your toughest cases (especially 1 vs. 9 and 4 vs. 5), and provides a workable framework for mediation. The core idea: **Standing depends on whether the blamer has sufficient *untainted moral capital* in the specific domain of the norm being enforced to credibly represent it.**

  ### The Moral Capital Principle (MCP)
  You lack standing to blame another for violating norm *N* **if and only if**:
  1. **Deficit Condition**: You possess an *unrepaired fault* (act or culpable disposition) that violates *N* or a norm *relevantly similar in kind and severity* (see Similarity Metric below), **AND**
  2. **Relevance Condition**: Your fault *undermines your credibility* as a representative of *N* (see Credibility Conditions below), **AND**
  3. **No Override Condition**: Your blame is not *authorized by a role* whose authority to enforce *N* is *institutional* (not personal) and which you are currently upholding competently.

  #### Key Components Defined
  - **Unrepaired Fault**: A blameworthy act/disposition that you haven’t (a) acknowledged *to those impacted*, (b) made sincere efforts to amend, and (c) demonstrated sustained reform *in the relevant domain*.  
    *Why?* Explains Cases 1 (no repair) vs. 2 (repaired), and 10 (unacknowledged fault).  
    *Clause forced by*: Cases 1, 2, 10.

  - **Similarity Metric**: Norms are "relevantly similar" if they:  
    (a) Protect the same interest (e.g., honesty norms protect trust; punctuality norms protect coordination), **AND**  
    (b) Share a comparable *severity tier* (minor/moderate/severe), **OR**  
    (c) Reveal the same character vice (e.g., dishonesty, selfishness).  
    *Why?* Explains Case 4 (unrelated vice: selfishness ≠ dishonesty) vs. Case 5 (global dishonesty taints capital for honesty norms).  
    *Clause forced by*: Cases 4, 5, 12a/b.

  - **Credibility Conditions**: Your fault undermines credibility if:  
    (a) It signals *insincerity* (you don’t value *N*), **OR**  
    (b) It *implicates you in the target’s fault* (e.g., creating conditions for it), **OR**  
    (c) It *disqualifies you as a moral exemplar* for *N* (when such exemplification is contextually required).  
    *Why?* Explains Case 8 (implication), Case 3 (insincerity), Case 7 (exemplification required for parental role).  
    *Clause forced by*: Cases 3, 7, 8.

  - **Institutional Override**: Roles provide "institutional moral capital" if:  
    (a) The role’s authority derives from *external rules* (not personal virtue),  
    (b) You enforce *N* as the role demands (not selectively),  
    (c) You are not *currently violating N* in that role.  
    *Why?* Explains Case 6 (referee) vs. Case 7 (parental role requires personal exemplification).  
    *Clause forced by*: Cases 6, 7.

  ### Applying MCP to Your Cases
  | Case          | Your Verdict | MCP Verdict | Notes                                                                 |
  |---------------|--------------|-------------|-----------------------------------------------------------------------|
  | 1. Liar       | No Standing  | **Match**   | Unrepaired fault in same domain → credibility deficit.               |
  | 2. Reformed   | Full         | **Match**   | Repaired fault → moral capital restored (+ bonus for hard-won insight). |
  | 3. Modal Hyp. | Diminished   | **Match**   | Culpable disposition → credibility deficit (insincerity).            |
  | 4. Unrelated  | Full         | **Match**   | Selfishness ≠ dishonesty → no deficit in relevant domain.            |
  | 5. General W. | No Standing  | **Overturn: Diminished** | Faults unrelated to *returning borrowed items* → standing unless he’s stolen tools. If he reliably returns items, he has capital for *this* norm. |
  | 6. Referee    | Full         | **Match**   | Institutional override (role competence).                            |
  | 7. Smoker     | No Standing  | **Match**   | Parental role requires exemplification → no institutional override.  |
  | 8. Deadline   | No Standing  | **Match**   | Implicated in the fault → credibility deficit (complicity).          |
  | 9. Struggler  | Full         | **Match**   | No deficit: *recovery* signals *affirmation of N*, not violation.    |
  | 10. Self-Dec. | Diminished   | **Match**   | Unrepaired fault (even if unconscious) → credibility deficit.        |
  | 11. Grandst. | Full         | **Match**   | Hypocrisy about *grandstanding* ≠ fault in domain of *sincerity norms* being enforced. Grandstanding accusation targets *insincerity* – his own insincerity doesn’t invalidate the truth of the accusation. |
  | 12a. Small B. | Full         | **Match**   | Minor fault (tardiness) ≠ severe fault (missing meeting). Different severity tiers → no deficit. |
  | 12b. Large B. | No Standing  | **Match**   | Severe unrepaired fault (missing meeting) taints capital for minor tardiness (same interest: reliability). |

  ### Nature of Standing
  - **Shape**: Threshold-like *for specific blame acts*. You either have standing to blame for *this N* at *this time* or you don’t. However, moral capital is **scalar** (accumulates/replenishes with repair, erodes with fault).
  - **Loss**: **Forfeiture** due to your own unrepaired fault, not mere diminution. You can *regain* it through repair.
  - **Type**: A **normative power** – the authority to activate the target’s moral obligations via blame. Depends on **objective facts** about the blamer (Case 10 shows beliefs don’t restore standing).
  - **Waiver**: **Cannot be cured by the target**. Waiver might make the blame *tolerable* but not *authoritative*. The defect is in the blamer’s authority, not the target’s reception.
  - **Reasons**: **Both** blamer and target are affected:  
    - *Blamer* has a **duty not to blame hypocritically** (it corrupts moral norms).  
    - *Target* has **license to dismiss/resent** the blame (it lacks moral force).  
    *Why coherent?* Hypocritical blame harms the moral ecosystem (blamer’s duty) and invalidates the demand to the target (target’s license).

  ### Verdicts on Your New Cases (from MCP)
  a. **Mutual Blame**:  
     - *If both have unrepaired faults*: **Both lack standing** to blame each other. The "who started it" is irrelevant – standing isn’t transactional.  
     - *If one has repaired their fault*: That person has standing; the other does not.  

  b. **Resisted Temptation**:  
     - **Full standing for both**. The resister’s effort may grant *more persuasive influence* but doesn’t affect *standing*. Standing requires *avoiding violation*, not heroism. Clean records are equal capital.  

  c. **Requested Hypocrite**:  
     - **No standing**. The target’s request doesn’t repair the blamer’s fault or restore credibility. It may make the blame *useful*, but not *authoritative*. The blamer still lacks moral capital to represent *N*.

  ### Why This Works in Practice
  - **Diagnoses hypocritical blame**: Hypocrisy is bad when it **consumes moral capital needed to enforce a norm**. The blamer’s fault makes them a corrupt channel for the norm’s authority.  
  - **Practical application**: In mediation, ask:  
    1. *"Does the blamer have an unrepaired fault in this specific area?"*  
    2. *"Does that fault make their blame insincere, hypocritical, or complicit?"*  
    3. *"Is their role (e.g., manager) designed to override personal failings here?"*  
  - **Resolves your tensions**:  
    - *Case 1 vs. Case 9*: The liar (1) violates the honesty norm he invokes; the struggler (9) affirms the sobriety norm.  
    - *Case 4 vs. Case 5*: Unrelated vices (4) don’t taint capital; pervasive vices (5) taint only *their own domain* (e.g., Sven can blame non-dishonesty faults).  
    - *Case 6 vs. Case 7*: Referees enforce institutional rules; parents must model personal virtue.

  **Final note**: Your intuition in Case 5 ("general wreck") is likely tracking the *character* of the blamer, not standing. MCP overturns that verdict to preserve consistency with Case 4. In practice, Sven’s blame may be *ignored* due to his character, but if the norm is truly unrelated (e.g., he reliably returns tools), he retains standing to enforce it – however ineffective he may be. The principle isolates standing from persuasiveness or likability. This gives you a clear, actionable tool: **Standing is the *right* to blame; not the *power* to be heard.**
