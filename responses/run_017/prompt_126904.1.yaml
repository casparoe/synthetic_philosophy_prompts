prompt: |-
  Hey — weird one, and sorry in advance, it's not the usual sort of thing. I'm about two hundred pages into a novel and I've painted myself into a corner with a language I invented for one of the cultures in it.

  The grammer I gave myself works roughly like this: every verb describing an action has to carry a marker saying whether the action achieved what it was for. Not tense, not whether it's finished — whether it came off. You can't say I went to the well without also saying whether the water got fetched, and there's no neutral or unmarked option. There's also no standalone verb meaning to try or to intend that doesn't itself carry the same succeeded/failed marking. And the bit I didn't think through when I started: the marker is required for stuff that hasn't happened yet too. So I'll go to the well tomorrow already commits you, right there in the morphology, to whether the trip is going to work out.

  The scene I'm stuck on is the emotional centre of the book. My narrator — grew up in this language, and I'm writing in English but I want the reader to feel the shape of the original, if that makes sense — has to decide whether to attempt something genuinely risky and probably stupid: a crossing, bad weather, a kid with her. She's alone, turning it over, and the whole point is that she doesn't know if it'll work and chooses anyway. But every time I try to write her thinking it through in her own head the language seems to slam the door: she can't even put the option to herself without already declaring it a success or a failure. Which either makes the scene unwritable or makes her look incapable of basic practical reasoning, and I don't want that — she's meant to be competent, and I really don't want to write a character who's intellectually disabled by her own grammar. Feels cheap, and kind of gross besides.

  So what would actually be going on? Does the language really box her in, or would she have workarounds — roundabout phrasings, conditionals, quoting or ventriloquizing herself, some irrealis or hedging form, a special shape for vows and hopes — and if so how awkward would those feel to her, and would that awkwardness be visible in the prose? Also the knock-on stuff: if you have to mark outcome every single time, would she be unusually preoccupied with whether things actually worked, unusually bad at I did my best as an excuse, unusually hard on people who failed through no fault of their own? Or is that overstating it, and she'd just mark it the way I mark tense, automatically, without it coloring anything? And is it even stable — wouldn't speakers invent a neutral form inside a generation or two, given how often they'd need one?

  One more thing I keep going back and forth on: whether it's coherent to say she thinks in this language at all. Half the time my own thoughts don't feel like sentences.

  What I'm after is: what can I plausibly let the grammar do to her, what should I keep off-limits, and how do I show any of it in English without stopping every other paragraph to explain.
reasoning: |-
  Okay, this is a fascinating linguistic and narrative puzzle. The user has built a conlang with a mandatory "outcome inflection" (success/failure marking) on all action verbs, even for future events, and it's causing a narrative crisis in their novel. The core issue is that their protagonist literally can't think about attempting a risky action without committing to its success or failure in her internal monologue, which undermines the pivotal moment of uncertain choice.

  First, let's unpack what's psychologically realistic. The user worries this grammar might make speakers seem developmentally stunted, but that's unlikely—human cognition always develops workarounds for linguistic constraints. I'm reminded of how languages with mandatory evidentiality (like Tuyuca) force speakers to specify how they know something, yet speakers don't become obsessed with epistemology. The key is distinguishing grammatical obligation from cognitive burden.

  For the protagonist's dilemma, we need evasion strategies that feel native to the language:
  - Subjunctive-like constructions using modal particles ("if there were a crossing...")
  - Nominalization to avoid finite verbs ("the making of an attempt")
  - Third-person framing ("one might cross...")
  - Borrowing structures from adjacent dialects
  These wouldn't feel clunky to her—they'd be automatic linguistic reflexes. The tension comes from how the grammar forces her to confront the binary when she least wants to.

  The cultural implications are rich: this language would breed hyper-pragmatism. Apologies like "I tried" would sound hollow without outcome marking. Failure might be linguistically sterilized through euphemisms. But crucially, speakers wouldn't be neurotic about outcomes—just as English speakers don't consciously process tense—though they might develop cultural narratives around uncertainty avoidance.

  For the writing challenge, showing rather than explaining is vital. English can mirror the constraint through:
  - Deliberate verb choices that imply outcome ("I will fail-cross the pass")
  - Strategic omission of verbs in thought
  - Metaphors of linguistic confinement ("the words turned to stone in her mouth")
  The protagonist's frustration with her own grammar could actually heighten the stakes.

  Lastly, the stability question: yes, the language would evolve neutral forms, but likely in specific registers (e.g., hypotheticals, poetry). The protagonist might use these "edge cases" creatively, making her choice feel more transgressive.

  This isn't about intellectual disability—it's about how language shapes the articulation of hope. The grammar isn't a cage; it's the knife-edge on which her decision balances.
answer: |-
  What a brilliant and brutal linguistic constraint! Your instincts are spot-on—this grammar *would* create fascinating cognitive pressure, but **no, it wouldn't trap her into stupidity or make the scene unwritable.** Speakers would develop sophisticated, almost subconscious workarounds. Here's how to navigate it:

  **How She Thinks About the Uncertain Future (Workarounds in Action):**

  1.  **Conditional Framing & Subjunctive Space:** This is your primary escape hatch. She wouldn't think "*I will cross* (success/failure implied)", she'd think:
      *   **"If I were to cross..." / "Were a crossing made..."**: Using conditional or subjunctive moods inherently avoids committing to the outcome marker on the main action verb. The outcome marker gets pushed onto the *consequence* clause, which is safer ("...then the child *would-die*" / "...then we *would-arrive*").
      *   **Nominalization:** Turning the verb into a noun avoids the inflection. "The *crossing* (noun) in this weather... it holds danger." "The *attempt* itself..." Thoughts become about the abstract *concept* of the action, not its instantiated success/failure.
      *   **Generic/Indefinite Subjects:** "A person *might-succeed* crossing here... or *might-fail*." "One *could-try*..." Distancing herself from the commitment by speaking generically.
      *   **Quoting or Hypothesizing Others:** "Old Kael would say this crossing *will-succeed* only in calm." "My mother would mark this *as-folly*." Ventriloquizing allows the outcome marker to apply to *someone else's* assertion or belief.
      *   **Focus on Components:** Break down the action into sub-actions where the outcome marker is less loaded or can be hypothetical. "To *reach* (success implied? failure?) the first ridge is possible. *Staying* (success? failure?) on the path in the snow... *Finding* (success? failure?) the marker stone..." Each micro-action might feel less existentially committing than the whole "crossing".
      *   **Modal Verbs + Outcome (Carefully):** Pairing modals ("might", "could", "would") with the outcome-inflected verb *softens* the commitment. "I *might-succeed* crossing" acknowledges the possibility without absolute certainty. "I *could-fail* horribly" states the risk. This might feel slightly hedging or formal, but not unnatural. The key is the modal introduces the uncertainty the outcome marker itself lacks.

  **The Awkwardness & How It Feels:**

  *   **Not Constant Struggle:** For most daily actions, the marking is automatic and unthinking, like tense for us. She doesn't agonize over "I *succeeded*-brushing my teeth".
  *   **Pain Points:** Uncertainty *is* linguistically uncomfortable. Thinking about genuine risk *feels* like navigating verbal minefields. The workarounds are fluent but carry a subtle cognitive load – a slight hesitation, a preference for roundabout phrasing when stakes are high. This isn't intellectual disability; it's heightened linguistic *sensitivity* around commitment and consequence.
  *   **The Core Scene's Feel:** As she approaches the decision, her thoughts will naturally gravitate *away* from direct declarative future statements ("I *will-succeed/fail*") and towards the workarounds above. This creates a natural psychological tension:
      *   **Avoidance:** Her mind skitters away from directly formulating the plan in simple future terms. This feels realistic for high-stakes decisions.
      *   **Testing the Waters:** She might tentatively try framing it hypothetically: "*If* I crossed... *then* we *would-arrive*... *or would-perish*..." Feeling the weight of each outcome as she voices it internally.
      *   **The Choice Moment:** Her final commitment might *still* avoid the pure future form. It could be a nominalized resolve ("The crossing *must-be-attempted*") or a shift to the meta-level of *choosing the attempt itself*, regardless of outcome ("I choose the *path of crossing*" – where the outcome marker attaches to "choose", implying she *succeeds* in committing to the attempt, not necessarily the crossing itself).

  **Cultural & Psychological Knock-On Effects:**

  *   **Hyper-Pragmatism:** Excuses like "I tried my best" would indeed ring hollow. The language focuses relentlessly on *what was achieved*. Mitigating circumstances would need explicit framing *alongside* the outcome marker. "The bridge *collapsed-failure*, though the ropes *were-sound*." Failure is linguistically central and undeniable.
  *   **Heightened Outcome Awareness:** Speakers would be *acutely* aware of whether actions achieved their intended purpose. This fosters practicality and potentially a lower tolerance for repeated, unexplained failure. "Why attempt what *will-fail*?" is a fundamental question.
  *   **Nuance Around Blame:** The language *doesn't* inherently assign blame, just outcome. Distinguishing "failure due to incompetence" from "failure due to circumstance" would rely on additional clauses and context. "He *failed-reach* the summit (outcome), the storm *was-savage* (context)."
  *   **Taboo on Rash Promises?** Making bold future claims with a success marker carries immense weight, as you're linguistically committing to success. People might be more cautious about guarantees. Vows might use specific, perhaps archaic or ritualistic, subjunctive/optative forms to express *hope* without absolute grammatical certainty.
  *   **Stability & Evolution:** A neutral form *would* likely evolve, but probably in specific contexts:
      *   **Hypotheticals:** Developing a dedicated irrealis mood for pure speculation.
      *   **Quoting/Reporting:** "He *said* he *will-succeed* cross" – the outcome marker applies to *his claim*, not necessarily the event.
      *   **Intentional "Try":** A verb like "strive/attempt" *might* emerge, carrying a "neutral" or "unknown outcome" marker specifically for that verb. It would still need marking, but it signifies the *effort*, not the result. This is the most likely pressure valve.

  **Does she "think" in it? Absolutely, with caveats:**

  *   **Core Cognition:** For habitual actions, immediate perceptions, and ingrained concepts, yes, the grammatical structures shape the thought. "The latch *clicked-failure*" is the primal way she perceives the event.
  *   **Complex Reasoning:** For abstract thought, planning under uncertainty, and novel problem-solving, her cognition likely involves pre-verbal concepts, images, and *feelings* that are then *clothed* in language using the available grammatical tools (the workarounds). The language constrains *expression*, not necessarily the pre-linguistic spark of an idea.

  **How to Show This in English (Without Constant Explanation):**

  1.  **Verb Choice is Key:** Use English verbs that subtly imply success/failure where you want the inflection felt.
      *   *Success-Leaning:* Achieve, secure, manage, attain, succeed (in), find, win, fix, heal, convince.
      *   *Failure-Leaning:* Fail (to), miss, lose, break, drop, spoil, waste, forget, collapse.
      *   *Example:* Instead of "She thought about crossing," use: "She weighed the *achieving* of the crossing against the *disaster* of failing it." "Could she even *manage* the first ridge?"
  2.  **Structure Mimics Workarounds:**
      *   **Use Conditionals & Hypotheticals:** Fill her thoughts with "If... then..." structures. "If she set out at dawn, *would* they *clear* the pass before the storm? Or *would* the snow *claim* them halfway?"
      *   **Nominalize Actions:** "The *crossing* loomed. The *risk* was palpable. Any *attempt* felt like folly. Yet *not attempting* meant *failure* by default."
      *   **Passive Voice / Generic Subjects:** "The path *could be taken*, but *safety* wasn't *guaranteed*." "One *might reach* the other side. Or one *might perish* in the attempt."
      *   **Focus on Components:** "Getting the child ready *was possible*. Finding the trailhead *might work*. Keeping direction in the whiteout... *that* was where *failure* waited."
      *   **Internal Dialogue as Debate:** Have her argue hypotheticals with herself, each side using outcome-inflected phrasing. "*Going* now *dooms* us!" "But *staying* here *means* slow *failure*!"
  3.  **Show the Discomfort:**
      *   **Hesitation in Thought:** "She started to form the words... *I will--* but the suffix choked her. Success? Failure? She didn't *know*."
      *   **Physical Manifestation:** Describe the tension of trying to force an unformed thought. A clenched jaw, frustration at the language's limitations at this precise moment.
      *   **Metaphor:** "The grammar was a straightjacket, binding her thoughts into rigid boxes of *did* or *didn't*, *will* or *won't*, with no room for *maybe*."
      *   **Contrast with Other Characters/Languages:** If another POV character speaks a different language, show their more fluid internal monologue about uncertainty.
  4.  **Context is Everything:** Establish the grammar's implications *early* in small ways. Show her frustration when someone makes a vague promise, her instant assessment of minor actions as success/failure, her aversion to gambling. By the time the big scene arrives, the reader intuitively understands the pressure she's under.

  **What the Grammar Can Plausibly Do:**

  *   Force linguistic contortions when confronting genuine uncertainty.
  *   Create cultural emphasis on results and practical efficacy.
  *   Heighten the emotional weight of declaring future intentions.
  *   Make internal conflict around risk-taking linguistically explicit and uncomfortable.
  *   Foster quick, decisive assessment of *past* and *present* actions.

  **What It Shouldn't Do (Off-Limits):**

  *   Make her literally incapable of conceiving of an attempt without knowing the outcome. She *can* conceive of it, she just struggles to *phrase* it fluently within her language's constraints.
  *   Render her generally incompetent or unintelligent. The struggle is *specific* to verbalizing uncertainty, not general reasoning.
  *   Feel like a gimmick that only exists to cause this one scene's problem. It needs deeper integration and earlier establishment.

  **Your Core Scene - A Possible Approach:**

  Her thoughts circle the crossing using conditionals, generics, and component parts. She tests hypothetical outcomes, feeling the linguistic weight of each *success* or *failure* scenario. She avoids the direct "I will cross". The frustration mounts – the language offers no clean way to embrace the *maybe*. Finally, her resolve crystallizes *not* as "I will succeed," but as a rejection of the alternative's guaranteed failure, or a commitment to the *act of attempting itself*, perhaps marked grammatically as the *success* of making that choice: "I *choose* the crossing path. This *is-decided*. We *go*." (Where *go* might carry a "success" marker meaning "the departure is initiated successfully," carefully avoiding claiming success for the *entire* crossing). The uncertainty remains, but the decision is made *despite* the grammar, using its tools to frame the commitment to the *attempt*.

  This is a fantastic linguistic challenge that can deeply enrich your character and world. Lean into the friction it creates – it's not a bug, it's a feature that reveals her psychology under pressure. Good luck!
