  Hmm, their provisional rule about maximizing expected utility from the initial prior while counting logically swayed entities is insightful but incomplete. The discomfort with cases 2, 5, 6 and 8 reveals gaps, particularly around partial dependence and self-locating uncertainty. What's interesting is how their intuitions track functional dependence even when they can't formally define it - like in the Twin PD cases where identical reasoning creates cooperation but imperfect alignment doesn't.

  Ah! The key might be recognizing that their intuitions distinguish between:
  - Logical control (where outputs deterministically depend on their decision algorithm)
  - Statistical correlation (mere probabilistic alignment)
  - Causal independence (truly separate systems)

  This explains why they cooperate with perfect copies (case 4) but defect against strangers (case 5), and why fidelity matters in case 8. Their smoking lesion verdict shows they reject evidential decision theory when dependence is absent, even if correlation exists.

  For the problematic cases:
  - Transparent Newcomb (case 2) needs functional dependence to override local dominance
  - Absent-minded driver (case 6) requires handling indexical uncertainty separately from policy optimization
  - Imperfect predictors (case 8 extension) should weight simulations by their reliability

  The user's discomfort with thresholds is valid - a continuous weighting system for partial dependence would better match their intuitions. Their "least comfortable" verdict (defecting in case 5) is actually correct under this framework since the distant twin isn't functionally dependent.

  Notably, they didn't ask about updatelessness per se, but their initial prior focus suggests they're groping toward that concept. The refined principle should make the "no updates except situational awareness" clause explicit to handle cases like transparent Newcomb.

  For the unanswered cases: 
  - 90% Newcomb should still one-box with high confidence
  - Altruistic twin dilemma would defect since no functional reason to cooperate

  The beauty is how this system preserves all their "right-feeling" verdicts while resolving inconsistencies. Their self-awareness about verdict 5 being hard to accept shows intellectual honesty - the principle explains why it feels wrong (we wish rational cooperation was always possible) but is logically necessary.
answer: |-
  Your intuitions reveal a consistent decision-theoretic stance centered on **functional dependence and updateless optimization**. The principle unifying your verdicts is:

  **"Choose the policy that maximizes expected utility under your initial prior, where you condition on the logical output of your decision procedure determining all instances that counterfactually depend on it (including simulations, copies, and predictors modeling your policy), while treating causally independent actors as separate. Never update your preferences or decision rule based on information that is functionally dependent on your choice."**

  Here's how it maps to your cases, with clarifications:

  1.  **Counterfactual Mugging:** You pay because the simulation's output *logically depends* on your decision procedure. Conditioning on your policy, paying maximizes expected utility ($500k expected gain vs. $0).  
      *Motivation:* Functional dependence overrides causal irrelevance.

  2.  **Transparent Newcomb:** Your flexible policy is correct. Seeing the box empty means Omega *counterfactually depended* on your policy predicting two-boxing. Taking both boxes nets $1k (since you can't change the past prediction). Seeing the box full means Omega depended on your one-boxing policy, so taking only it nets $1M. A rigid one-box policy fails when the box is empty.  
      *Why your rule was confused:* Your initial principle didn't specify how to *act* upon discovering your situation (the box state). The refined rule says: once you know the prediction (and thus which counterfactual branch you're in), act to maximize *local* utility given fixed past dependencies. Your policy is defined *before* seeing the box.

  3.  **Smoking Lesion:** You smoke. The lesion's state is *causally independent* of your choice; smoking doesn't cause cancer. Conditioning on your decision procedure doesn't affect the lesion. Evidential correlation is irrelevant.  
      *Motivation:* Distinguishes functional/logical dependence from mere correlation.

  4.  **Twin PD (Exact Copy):** You cooperate. Your twin's output is *logically determined* by the same decision procedure. Conditioning on your policy, mutual cooperation is optimal. Knowing "who is original" doesn't break the symmetry of dependence.  
      *Motivation:* Copies running identical algorithms are functionally dependent.

  5.  **Twin PD (Distant Stranger):** Defect is correct. The stranger's choice is *statistically correlated* but not *logically determined* by your decision procedure. There's no functional dependence; your policy doesn't compute their output. Optimizing under the initial prior means defecting dominates (higher payoff if they cooperate, same payoff if they defect).  
      *Key Difference from 4:* Here, dependence is statistical (99%), not logical (100%). Your discomfort arises because your intuition weights *similarity*, but the principle requires *functional determination*.  
      *Threshold:* Logical determination (output is a *necessary consequence* of your algorithm) is binary. 99% correlation is insufficient.

  6.  **Absent-Minded Driver:**  
      - **Ex-ante:** Commit to continuing with p=2/3 (optimizes expected utility: 4 * (1-p)p + 1 * (1-p)^2 + 0 * p, max at p=2/3).  
      - **At intersection:** Exit. With 3/5 credence it's the first exit, *local* EU(exiting) = (3/5)*0 + (2/5)*4 = 1.6, EU(continuing) = (3/5)*4 + (2/5)*1 = 2.8? (Wait, miscalculation! Correct: If first exit (p=3/5): Exit=0, Continue→second exit=4. If second exit (p=2/5): Exit=4, Continue=1. So EU(Exit) = (3/5)*0 + (2/5)*4 = 1.6; EU(Continue) = (3/5)*4 + (2/5)*1 = 2.4 + 0.4 = 2.8. Continuing is better locally!)  
      *Resolution:* The principle prioritizes *ex-ante policy optimization*. At the intersection, you face self-locating uncertainty, but your *decision rule* was set ex-ante to maximize overall utility. You should follow the precomitted p=2/3 randomization. Your "exiting looks better" calculation ignores that your action affects *both* exits (if this is the first).

  7.  **Randomization:**  
      - **Newcomb:** Predictable one-boxing is best. Omega's prediction *depends functionally* on your policy; randomization lowers P(predicted one-box).  
      - **Death in Damascus:** Randomization is essential. The predictor is *causally independent* but tries to correlate with you. Randomizing breaks correlation, making you unpredictable.  
      *Motivation:* Distinguishes when your policy's determinism affects dependent systems (Newcomb) vs. when randomness decouples you from independent predictors (Damascus).

  8.  **Coarse-Grained Models (Mugging & Twin):**  
      - **Mugging:** Pay. Omega's simulation, though imperfect, *counterfactually depends* on your decision rule. Expected utility favors paying: 0.8 * (-1000 + 1e6) + 0.2 * (-1000) >> 0.  
      - **Twin PD with Model:** Defect. The model's output is correlated (80%) but not *determined* by your policy. Your choice doesn't logically control its output; it's generated by a separate process fitted to past data. Defection dominates (gain if it cooperates, no loss if it defects).  
      *Handling Degrees:* The principle *can* handle degrees! For functionally dependent systems (like Omega's sim in mugging), weight outcomes by their conditional probability *given your policy*. For independent systems (like the "twin" model), treat correlation as passive information. Your willingness to cooperate scales with fidelity because higher correlation makes mutual cooperation *evidentially* more likely, but defection *still dominates locally* since you don't control it. The threshold is functional dependence vs. correlation.

  **Unanswered Cases & Refinements:**

  - **Newcomb with 90% Predictor:** **One-box.** Omega's prediction *counterfactually depends* on your policy, even if imperfectly. EU(one-box) = 0.9 * 1e6 + 0.1 * 0 = 900,000; EU(two-box) = 0.9 * 1,000 + 0.1 * 1,001,000 = 101,000. One-boxing dominates.
  - **Twin PD (Same Procedure, Altruistic Utility):** **Defect.** Your twin's decision procedure is identical, but their utility function doesn't value your payoff. They will defect regardless of your choice (since cooperating helps you but costs them with no gain). Your choice doesn't affect theirs. Defect is the dominant strategy.

  **Where Your Verdicts Stand:**
  - Fully Captured: 1, 2 (with clarification), 3, 4, 5, 7, 8.
  - Corrected: 6 (you should continue with p=2/3 at the intersection; your local EU calculation was mistaken).
  - Clarified Threshold: Functional/logical dependence (instances whose outputs are computed *by* your decision algorithm) is binary. Mere correlation is not dependence. In case 5 (stranger) and case 8 (model twin), defection is mandated because no functional dependence exists.

  **Core Principle Restated:**  
  Optimize your decision rule *once*, from the initial prior. Treat all systems whose outputs are *logical consequences of your algorithm* (simulations, perfect copies, predictors of your policy) as parts of a single "decision node" that you control counterfactually. Treat all other systems (causally independent agents, correlated but non-dependent models) as part of the environment—act on local dominance or expected utility given passive information. Never alter your optimization criterion after learning indexical or dependent information.

  This framework—**Updateless Decision Theory with Functional Dependence**—validates your core intuitions while resolving your discomfort in cases 5 and 8. It explains why correlation isn't control, and why the "same plasticity" has opposite verdicts in Newcomb vs. Damascus.
