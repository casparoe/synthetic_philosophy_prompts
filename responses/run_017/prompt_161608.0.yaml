  ### Scenario: Database Migration Strategies  
  A team is deciding between two strategies for migrating a critical database to a new version. The conservative strategy (Option A) involves comprehensive pre-validation, reducing the risk of moderate issues but with a lower chance of a flawless outcome. The streamlined strategy (Option B) skips some validations for faster deployment, increasing the chance of a flawless outcome but risking more moderate issues. The currency is expected hours of customer-visible downtime over the next quarter.  

  **Option A Outcomes (Conservative):**  
  - Worst: 100 hours downtime (prob. 0.10)  
  - Middle: 30 hours downtime (prob. 0.70)  
  - Best: 0 hours downtime (prob. 0.20)  

  **Option B Outcomes (Streamlined):**  
  - Worst: 100 hours downtime (prob. 0.10)  
  - Middle: 10 hours downtime (prob. 0.20)  
  - Best: 0 hours downtime (prob. 0.70)  

  ### Key Properties  
  - **Worst outcome:** 100 hours for both (prob. 0.10).  
  - **Best outcome:** 0 hours for both.  
  - **Best-outcome probability:** Option A (0.20) < Option B (0.70).  
  - **Dominance check:**  
    - Option A has better (lower) middle outcome (30 vs 10 hours), but Option B has higher best-outcome probability.  
    - Neither dominates: For downtime \(d\), \(P_A(d \leq k)\) and \(P_B(d \leq k)\) cross:  
      - At \(k=30\): \(P_A(d \leq 30) = 1.0\) > \(P_B(d \leq 30) = 0.80\)  
      - At \(k=10\): \(P_A(d \leq 10) = 0.30\) < \(P_B(d \leq 10) = 0.30\)?  
        Correction:  
        \(P_A(d \leq 10) = P_A(\text{0 hours}) = 0.20\) (since 30 > 10)  
        \(P_B(d \leq 10) = P_B(\text{0 or 10 hours}) = 0.70 + 0.20 = 0.90\)  
      - Thus, no stochastic dominance.  

  ### Expected Value (EV) Calculation  
  Utility \(u(x) = -x\) (since downtime is minimized; equivalent to maximizing negative downtime).  
  - **Option A:**  
    \(EV_A = 0.10 \times (-100) + 0.70 \times (-30) + 0.20 \times 0 = -10 - 21 = -31\)  
  - **Option B:**  
    \(EV_B = 0.10 \times (-100) + 0.20 \times (-10) + 0.70 \times 0 = -10 - 2 = -12\)  
  EV ranks B > A (since \(-12 > -31\)).  

  ### REU Calculation with \(r(p) = p^2\)  
