    \(w_2 = r(0.90) - r(0.20) = 0.9^2 - 0.2^2 = 0.81 - 0.04 = 0.77\)  
  - Outcome \(0\):  
    \(T_3 = P(\geq 0) = 0.20\)  
    \(U_3 = P(> 0) = 0\)  
    \(w_3 = r(0.20) - r(0) = 0.2^2 - 0^2 = 0.04\)  
  Sum: \(0.19 + 0.77 + 0.04 = 1.00\).  
  REU_A = \(0.19 \times (-100) + 0.77 \times (-30) + 0.04 \times 0 = -19 - 23.1 = -42.1\)  

