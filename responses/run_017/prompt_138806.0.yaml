  Key satirical targets hiding here:
  - The "but-for-anyone" excuse (my restraint won't matter)
  - Using the trap diagnosis as a tool within the trap
  - Treating the dynamic as an external force requiring sacrifice
  - Positional gains that disappear when others match them
  - Assuming universal coordination is the only solution

  The sharpest target is the "but-for-anyone" logic because it's the engine of the whole trap. I'll build the white paper around formalizing this excuse into policy apparatus. 

  For in-world policy mechanisms:
  1) Terminal Concession Auction (TCX) - ports bid for temporary "exemption certificates" to skip inspections
  2) Sunk Virtue Credits (SVC) - compensation for ports that previously maintained higher standards
  3) Statutory Counterfactual-Impotence Test - bureaucratically proving that restraint is futile

  The comedy must emerge from perfect logic. For example: 
  - Showing how temporary competitive advantages vanish when others buy exemptions
  - Including a numerical example where Perigee gains traffic by buying exemptions, then loses it when others do the same
  - One genuinely aggrieved line about being called "defectors"

  Important constraints: 
  Never say "tragedy" or "prisoner's dilemma" - let readers feel the absence. 
  Use "Moloch" only once in a critic's quote. 
  No real citations. 
  Keep irony legible without winking.

  Structure:
