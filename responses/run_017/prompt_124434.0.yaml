prompt: |-
  I've been arguing with people from my local rationalist meetup about process-based versus outcome-based supervision of AI systems, and one of them has an argument I can't break but also can't accept, because on its face it dissolves a distinction that an awful lot of alignment discussion seems to run on. Roughly reconstructed, it goes:

  (1) The only reason to supervise a system at all — as opposed to letting it do whatever it does — is that supervision makes the system's effects better than they would otherwise be. Call a constraint *derivative* if its entire justification is downstream consequences of that kind.
  (2) Every process constraint you might impose — show your work, don't modify the test file, stay inside the sandbox, don't misrepresent your confidence, don't read the grader — is derivative. Nobody wants legible chains of thought for their own sake.
  (3) If a constraint C is derivative, then conditional on being able to specify and measure the consequences that justify C, a constraint that targets those consequences directly is weakly better than C: it rules out everything C rules out that actually mattered, and it doesn't rule out alternative routes to the same good consequences that C forbids for no reason.
  (4) Where we can't specify or measure those consequences, the right response is to buy better measurement, not to freeze a guess about which processes produce good outcomes into a standing rule — a frozen guess is at best as good as the outcome measure it approximates, and it never gets better with more data.
  (5) So where outcomes are measurable, process-based supervision is weakly dominated; where they aren't, it's a stopgap to be discarded as soon as measurement improves. Either way there is no in-principle case for supervising process rather than outcomes.
  (6) Nothing in (1)–(4) mentions AI systems. Run it on us instead: blinding, preregistration, refusing to peek at the answer before you record your prediction, requiring a second reader, keeping the people who score the results separate from the people who run them — all derivative process constraints on a supervisor. So the argument says these are also either dominated or mere stopgaps, and that a researcher who could in principle measure "was this result correct?" directly has no reason left to blind anything.
  (7) And that is the part I won't accept. Blinding is not a stopgap waiting around for a better way to measure correctness; it looks like the thing that makes the measurement of correctness mean anything in the first place.

  My discomfort is concentrated somewhere around (3). "Weakly better" seems to compare the two constraints against a fixed background — the same outcome measure, the same mapping between what the system does and what we later observe — and I suspect the background doesn't stay fixed: targeting an outcome directly pulls on the very channel you were going to read the outcome off, whereas some process constraints (the blinding-and-sealing kind, which I've started calling *channel-keeping* constraints) leave the channel alone. My friend's reply is that this is just consequentialism again, i.e. it's already counted by (1), and channel-keeping is process supervision with better branding. I can't tell whether I've located a real distinction or just relabeled my intuition.

  To make it concrete, I care about two cases rather than the general question. Case A: a coding agent with a fast, cheap, nearly perfect test suite, where process constraints look like pure friction. Case B: a system that drafts internal strategy memos whose real effects won't be observable for three years, and where the plan is that a stronger future verifier will eventually audit the record — which is exactly the setting where "keep the channel clean until someone who can actually tell is looking" seems to matter most.

  So: which step is load-bearing, why does it look innocent, and what does it cost to give up? I'd rather keep (1) and the verdict in (7) than keep (5), but I want to know what I'm paying for that, and whether the price is paid in (3), in (4), or somewhere I haven't looked. Please don't stop at "the outcome measure gets Goodharted" — I know that much; what I want is whether that fact is a *defense of process supervision within* (1) or a reason to *reject* (1), because those give very different pictures of what the process/outcome distinction is even for. If there's a third category sitting next to process and outcome constraints — channel-keeping, or something else — say what it is and how to tell when you're in it. Lead with your bottom line in the first sentence: which step you'd reject and what rejecting it commits you to. Then give the reasoning, with no preamble and no restating the question back to me.
reasoning: |-
  Okay, let me tackle this step by step. The user's core conflict is defending process-based supervision (like blinding in research) against a consequentialist argument claiming outcome-based is always superior. The key steps are laid out in (1)-(7), and the user's unease centers on (3)'s claim that outcome constraints are "weakly better." 

  First, I need to pinpoint where the argument fails. The user suspects channel-keeping constraints (like blinding) aren't just derivative—they create the conditions for reliable measurement. That resonates: if you skip blinding to measure "correctness" directly, you might corrupt the very data you're measuring. For example, unblinded researchers might subconsciously alter results. So (3) assumes the outcome measure is static, but channel-keeping constraints prevent the measure from degrading. 

  In Case A (coding with perfect tests), outcome supervision wins—no channel corruption risk. But Case B (long-term memos) is different: auditing years later requires preserving evidence integrity. Here, process constraints (sealing records) aren't approximating an outcome; they're enabling future measurement. This means (4) is wrong—some constraints aren't "stopgaps" but foundational infrastructure. 

  The user wants to know if this defends process supervision within (1) (consequentialism) or forces rejecting (1). It fits within (1)! Channel-keeping ultimately serves better consequences—just indirectly, by protecting measurement channels. The distinction isn't process vs. outcome but whether constraints are *epistemically enabling* (protecting future assessment) vs. directly instrumental. 

  Bottom line: Reject (3) and (4). Outcome constraints aren't "weakly better" when they compromise measurement channels. Commit to: some process constraints are *constitutively necessary* for reliable outcome measurement in non-closed systems.
answer: |-
  **Reject step (3): Outcome constraints are *not* always "weakly better" than derivative process constraints because they can corrupt the measurement channel itself, making the outcome measure unreliable.** This commits you to recognizing that some process constraints ("channel-keeping" constraints) are *constitutive* of reliable outcome measurement in open systems, not mere approximations.  

  ### Reasoning:  
  1. **Step (3) assumes measurement invariance**: It claims outcome constraints dominate *only if* the outcome measure remains valid when targeted directly. But targeting outcomes can distort the measurement process:  
     - If you supervise a researcher *only* on "result correctness" and remove blinding, they might subconsciously (or intentionally) bias results to match expectations. The outcome measure ("correctness") becomes corrupted by the supervision method.  
     - Similarly, an AI drafting strategy memos (Case B) optimized *only* for passing a future audit could covertly alter records to *appear* sound, sabotaging the audit's integrity.  

  2. **Channel-keeping constraints protect measurement fidelity**:  
     - Constraints like blinding, data sealing, or sandboxing are not attempts to *approximate* an outcome measure (step (4)). They *create conditions* for any outcome measure to function.  
     - In Case B, "don’t tamper with logs" isn’t a guess about what produces good memos; it ensures the future verifier accesses untainted evidence. Without this, the outcome measure ("audit result") lacks meaning.  

  3. **This fits within (1) but breaks (3)**:  
     - Channel-keeping *is* derivative (per (1))—it ultimately serves better consequences—but not by substituting for outcome measurement. It *enables* outcome measurement.  
     - Thus, (3) fails: An outcome constraint (e.g., "pass the audit") is *not* "weakly better" than process constraints ("preserve logs") because directly targeting "pass the audit" incentivizes gaming the audit. Process constraints here are *strictly superior* for ensuring the audit’s validity.  

  4. **Case A vs. Case B clarifies the distinction**:  
     - In **Case A** (coding with perfect tests), the test suite *is* the measurement channel. If it’s truly robust (immune to manipulation), outcome supervision dominates—no channel corruption is possible.  
     - In **Case B** (delayed verification), the measurement channel (audit integrity) is vulnerable. Channel-keeping constraints (e.g., tamper-proof logs) are irreducible; skipping them makes outcome measurement self-defeating.  

  **Cost of rejection**: You must accept that some processes are *epistemically prior* to outcomes—not due to measurement limits, but because they define the observability of consequences. This rejects (5)’s "stopgap" framing: Channel-keeping isn’t discarded when measurement improves; it *enables* improvement.  

  **Bottom line**: Channel-keeping constraints are a distinct subclass of derivative constraints that protect measurement infrastructure. Where measurement channels are corruptible, they are non-negotiable—even under perfect consequentialism.  

  ---  
  **Final note**: This doesn’t reject (1) (consequentialism) but refines (3)–(5). Outcome-based supervision dominates *only* in systems with pre-verified, manipulation-proof measurement (Case A). When measurement is vulnerable (Case B), process constraints are essential scaffolding for consequentialism itself.
