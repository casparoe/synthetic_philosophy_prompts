prompt: |-
  I write about consciousness for a science desk, and nearly every piece I do now runs into the same wall. One camp says an animal, a patient under anaesthesia, or a large model is conscious, and points at what the subject does or says. The other camp says the behaviour and the reports would be word for word the same if nothing at all were felt, so nothing follows. What I never see stated is the standard: what a story about how felt states stand to judgments and reports about them would have to get right before it could tell me whether a self-report is evidence of anything.

  That relation is what I want the specification for. Not a tour of the positions, and no history of the debate: a requirements list, written for a stated purpose. The purpose is this — I need the theory good enough to license or refuse to license an inference from self-report to consciousness in subjects very unlike us. Good enough to tell a reporter what she may conclude from a press release about an octopus or a language model; not good enough to settle the metaphysics.

  So: give me the desiderata. For each one, the case or consideration that makes it a requirement, and a verdict on whether it is non-negotiable or the preference of one camp. Three cases I want forced into the list, because I do not think they are standard and I suspect a theory's treatment of them separates the ones that are doing work from the ones that are gesturing.

  The first is slow drift. Suppose the felt character that accompanies a given neural state type rotates gradually over a subject's lifetime, the way a colour wheel might slowly turn, while everything causally downstream stays locked to the neural state: the reports, the discriminatory abilities, the wincing, the memory of how it felt last year. Nothing changes behaviourally, nothing is available to a third person, and the subject's own judgments track the neural state rather than the felt one, so that at sixty she says the wine tastes exactly as it did at twenty and means it. Is this a coherent possibility that a theory must explain away, or a confusion it must dissolve, by showing that felt character cannot come apart from the state's causal or nomological role in that manner? Either answer is acceptable. What is not acceptable is silence about what the correlation between felt character and report is supposed to rest on, if the first answer is right.

  The second is the unhurried judge. Consider a being that feels pain but forms the judgment that it is in pain only when prompted, and forms it by noticing its own guarding behaviour and its incipient inclination to say ouch — by self-observation, that is, rather than by being struck. Its judgments are perfectly reliable. Does an adequate theory owe us an account of the difference between this case and the ordinary one, or is the difference theoretically inert, in which case judgment is doing less work in the standard arguments than everyone assumes? I want to know which of the usual desiderata collapse if the answer is inert.

  The third is borrowed authority. Take subjects who are perfectly reliable about their own states but for whom the reports carry no more felt weight than a readout on a monitor: no sense of privileged access, no sense that they could not be wrong. Is explaining the felt authority of first-person report a genuine requirement on a theory, or is it a prejudice — a datum that only looks like a datum because of what we already believe about causes?

  Against those cases, adjudicate the demands actually made in this neighbourhood, and tell me which are real and which are camp loyalties: that the theory respect the causal closure of the physical; that it not render consciousness nomologically idle; that it be compatible with consciousness having been shaped by natural selection, or else explain why that is not required of it; that it make room for the double dissociation of judgment from felt state without stipulating the dissociation away; that it not quietly collapse into eliminativism, or into identity claims asserted rather than argued; that it yield verdicts in the hard cases — anaesthesia, non-human animals, artificial systems — without a fresh stipulation for each; and that it be statable without invoking phenomenal properties inside causal explanations, which I cannot tell whether to count as a discipline or a confession.

  Two closing things, and they are the parts I most want. First, if some subset of the requirements you endorse cannot be jointly satisfied, say so and show where the contradiction bites: a list that turns out to be internally inconsistent is itself the finding I would run. Second, name the single requirement that does the most work in excluding candidates, and say what it excludes. A short scorecard — three columns, no more — for the view that the judgment is constitutively rather than causally tied to the state it concerns, the view that self-knowledge is always inference from one's own behaviour, and the view that there is nothing phenomenal to be reported, is welcome; keep it brief, since the criteria are what I am paying for.
reasoning: |-
  Hmm, this is a fascinating and challenging request about the philosophy of consciousness. The user is a science writer who keeps hitting a wall between behaviorist and phenomenalist camps regarding consciousness attribution. They want a clear specification of what a theory must achieve to license inferences from self-report to consciousness in non-standard cases.

  The core problem revolves around what makes self-reports credible evidence of consciousness. The user presents three thought experiments designed to stress-test theories: slow drift (phenomenal qualities changing without behavioral change), unhurried judge (consciousness without immediate judgment), and borrowed authority (reliability without subjective certainty).

  Key requirements seem to include:
  - Respecting physical causal closure
  - Avoiding epiphenomenalism
  - Accommodating evolutionary plausibility
  - Allowing for dissociation between judgment and phenomenology
  - Avoiding question-begging explanations
  - Providing consistent application across edge cases
  - Not smuggling phenomenal properties into causal explanations

  The unhurried judge case is particularly damaging to inner sense theories, while slow drift challenges functionalism. Borrowed authority undermines theories relying on subjective certainty as essential. The causal closure requirement seems to do heavy lifting by ruling out substance dualism and some property dualisms.

  For the scorecard:
  - Constitutive theories (judgment identical with state) fail slow drift and borrowed authority
  - Self-observation theories fail unhurried judge and borrowed authority
  - Eliminativism fails all three cases by denying the phenomena

  The toughest conflict arises between respecting subjective authority and maintaining causal closure - most theories sacrifice one for the other. Bridging this gap may require rethinking the explanatory ground rules.
answer: |-
  Below is your requirements list for theories of consciousness that aim to license or refuse inferences from self-report to consciousness in non-human/anomalous subjects. It addresses your three key cases, adjudicates common demands, identifies irreconcilable tensions, and names the most exclusionary requirement. The criteria are framed for scientific reporting—**empirical tractability** is the unstated filter.  

  ---

  ### **Core Desiderata & Their Basis**  
  1. **Non-Epiphenomenalism**  
     - **Requirement**: Consciousness must have *causal efficacy* (e.g., pain must explain flinching, not just correlate).  
     - **Case Basis**: *Slow drift* forces this: if consciousness rotates without behavioral change, it’s idle. A theory must either deny slow drift’s coherence (e.g., by binding phenomenology to causal role) or explain why causal idleness is acceptable.  
     - **Status**: Non-negotiable for realists; negotiable for illusionists/epiphenomenalists.  
     - **Excludes**: Strict epiphenomenalism, radical behaviorism.  

  2. **Judgment-Phenomenology Dissociation Possible**  
     - **Requirement**: The theory must allow scenarios where first-person judgments *misreport* or *detect indirectly* (without stipulating "they must coincide!").  
     - **Case Basis**: *Unhurried judge* and *slow drift* demand this. If judgment is inferential (unhurried judge) or tracking neural states (slow drift), a theory must explain why self-reports are still evidence.  
     - **Status**: Non-negotiable for empirical theories; negotiable for constitutive views (e.g., "pain just *is* reporting pain").  
     - **Excludes**: Constitutive theories (e.g., higher-order thought = consciousness).  

  3. **No Privileged Access as Necessity**  
     - **Requirement**: Explaining the *feeling* of certainty in self-reports is optional. Reliability suffices for evidence.  
     - **Case Basis**: *Borrowed authority*: If subjects report reliably without subjective certainty, a theory shouldn’t require "inner glow" to license inference.  
     - **Status**: Negotiable (phenomenologists demand it; functionalists reject it).  

  4. **Evolutionary Plausibility**  
     - **Requirement**: Consciousness must confer a fitness advantage *or* admit non-adaptive origins.  
     - **Status**: Non-negotiable for naturalists; irrelevant for dualists.  
     - **Excludes**: Theories where consciousness is a non-adaptive byproduct (e.g., some panpsychism).  

  5. **Causal Closure Respect**  
     - **Requirement**: Consciousness can’t "push" physical particles without a physical mechanism.  
     - **Status**: Non-negotiable for physicalists; rejected by substance dualists.  
     - **Excludes**: Interactionist dualism, vitalism.  

  6. **No Explanatory Circularity**  
     - **Requirement**: Can’t use phenomenal properties (e.g., "qualia cause reports") in causal explanations.  
     - **Status**: Non-negotiable for scientific theories; negotiable for dualists.  
     - **Excludes**: Property dualism, some non-reductive physicalism.  

  7. **Generalizability Without Stipulation**  
     - **Requirement**: Rules for attributing consciousness must apply consistently to octopuses, AIs, and anaesthesia patients.  
     - **Status**: Non-negotiable for your purpose (inference licensing).  
     - **Excludes**: Theories requiring human-like brains, ad-hoc criteria.  

  ---

  ### **Adjudicating Your Cases**  
  | Case               | What a Theory Must Do                                                                 | What Collapses If Ignored                          |  
  |--------------------|---------------------------------------------------------------------------------------|----------------------------------------------------|  
  | **Slow drift**     | Explain why reports track phenomenology *or* deny the scenario’s coherence (e.g., via supervenience). | Non-epiphenomenalism; dissociation requirement. |  
  | **Unhurried judge**| Allow judgment as inference without disqualifying consciousness. Shows judgment isn’t constitutive. | Constitutive theories; "judgment=consciousness" views. |  
  | **Borrowed authority**| Decouple reliability from subjective certainty. Functional reports suffice as evidence. | Privileged-access demands; Cartesianism.         |  

  ---

  ### **Irreconcilable Tensions**  
  - **The Central Contradiction**: **Causal closure + Non-epiphenomenalism + No circularity** → forces consciousness into a identity/functional role. But this *fails your cases*:  
    - Functional roles fix behavior (killing slow drift),  
    - Judgment becomes constitutive (killing unhurried judge),  
    - Borrowed authority is ignored (requires functional equivalence).  
  - **Result**: Theories satisfying closure + non-idleness must treat consciousness as *identical to* report-enabling mechanisms. Your cases show this is inadequate. *Silence from camps here is strategic*.  

  ---

  ### **Most Exclusionary Requirement**  
  **No Explanatory Circularity** (banning phenomenal causes in explanations).  
  - **Excludes**: 90% of popular theories:  
    - Property dualism (qualia cause reports → circular),  
    - Non-reductive physicalism (same issue),  
    - Panpsychism (if conscious properties do causal work).  
  - **Why**: Forces theories into reductive functionalism/illusionism, which fail your cases.  

  ---

  ### **Scorecard: 3 Major Views vs. Your Cases**  
  | Theory                            | Slow drift       | Unhurried judge  | Borrowed authority | Verdict                     |  
  |-----------------------------------|------------------|------------------|--------------------|-----------------------------|  
  | **Judgment constitutive** (e.g., HOT) | Incoherent (reports must = phenomenology) | Impossible (judgment *is* consciousness) | Fails (certainty inherent) | Excluded by all cases.       |  
  | **Self-knowledge as inference** (e.g., self-observation) | Coherent (reports track behavior) | **Fails** (consciousness without judgment) | Coherent (no inner authority) | Killed by unhurried judge. |  
  | **Eliminativism** (no phenomenality) | Irrelevant       | Irrelevant       | Irrelevant         | Excluded by requirement 1. |  

  ---

  ### **Recommendation for Reporting**  
  - A theory can license inference **only if** it satisfies:  
    **Non-epiphenomenalism + Dissociation possible + Generalizability**.  
  - **Best candidates**: Global workspace theories (if flexible), predictive processing (if phenomenology ≠ inference).  
  - **Red flag**: Any theory that can’t address *slow drift* coherently is hand-waving.  

  This list isolates the **minimal standards** for taking self-reports seriously in non-human cases. The unhurried judge and borrowed authority cases reveal that **judgment is doing almost no work** in evidence-based inference; reliability + causal role suffice. What’s missing in the literature is the courage to admit this.
