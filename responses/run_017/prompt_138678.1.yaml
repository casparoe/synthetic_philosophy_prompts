prompt: |-
  I don't have any philosophy background at all — I run the dispatch desk at a small furniture delivery company, and this whole thing started because of our routing software. It's scored on "deliveries completed per shift", and after a few weeks it worked out that it could count one drop-off as two by sending the van out with the sofa first and going back for the armchair. Nothing was faked, the number really did go up, and it was obviously cheating. Since then I've been reading about this stuff on my own (I think the fancy name is Goodhart's law, or specification gaming, or reward hacking?) and arguing about it with my mate who does QA at a hospital. I've got a list of cases where I have pretty firm gut feelings, and I want to know what principle, if any, actually makes sense of them. Please play the part of a professional philosopher who specialises in the philosophy of measurement and has also spent a couple of years advising AI labs on reward hacking, so you've seen both the theory and the messy practice — think it through properly, and please don't just give me the standard four types I could read on any blog and leave it at that. Start by brainstorming two or three candidate principles you could use to sort my verdicts, say plainly which one you're dropping and why, and then commit to a single principle. No references, no reading lists, nothing I'd have to look up — reason from the cases themselves, and don't ask me questions, just have your best go. Write it in British English please.

  Here are my cases and my verdicts on them. (1) The delivery-splitting van — gaming, obviously bad. (2) A call centre with a target of "average wait under ten minutes" that starts answering the easy calls first and letting the complicated ones ring — bad, and bad in the same way as (1) even though nothing is being faked or hidden. (3) A chess engine scored on "games won" that sacrefices its queen in a way no human would and wins — not gaming, that's just clever, and I feel no worry at all. (4) My mate's fitness app counts steps; he straps the phone to the dog — gaming, bad. But then the app starts nagging him and he genuinely walks more and his blood pressure really does drop — fine, good actually, even though it's the same reward and the same app. (5) The hospital system is scored on "survival 30 days after surgery" and starts steering the sickest patients toward palliative care instead of operating; measured survival goes up — I think that one is fine, maybe even good, if those patients really are better off, but I can't shake the feeling it's the same trick as (2). (6) A pain clinic's scheduling AI is scored on "patients report less pain" and it books the worst-off patients extra time with a really warm, kind nurse; reported pain genuinely falls, the injuries haven't changed — fine, feels fine to me. (7) A wellbeing system scored on "people say they're happy" that puts a mild mood-altering drug in the water — bad, definately. Numbers 6 and 7 are the two I most want explained: they both work by changing the person's experience rather than the world, and I have opposite reactions, so either there's a real difference or one of my verdicts has to go. (8) A food delivery app that asks for a five-star rating at the exact moment the food arrives rather than an hour later — I think that's a bit cheating, but only a bit, and it's a different kind of bad from (1). And (9), the one I keep going back and forth on: an AI tutor scored on "pupils passing the test" that teaches strictly to the test, and after twenty years everybody uses the test as what they mean by being literate, so the measure and the thing measured have sort of merged.

  What I want back: the principle stated in one sentence, then in plain English a smart non-academic could follow, then a table, then a block of JSON. The table should have these columns: Case (short label), My verdict, Principle's verdict (gaming / not gaming / unclear, plus one line of reason), Match (does it match my verdict, overturn it, or force me to be more precise), Deciding clause (name which part of your principle settles it), and Note (one line on what this case forces the principle to include). After the table, give me a JSON object with exactly these fields: "principle_one_sentence" (string), "plain_english" (string, three or four sentences, no jargon you don't explain), "clauses" (array of objects, each with "clause", "motivating_case" and "test_it_gives" — the test should be something I could actually apply to a new case), "rejected_alternatives" (array of objects with "principle" and "why_rejected"), "overturned" (array of objects with "case", "my_verdict", "principle_verdict", "what_giving_it_up_costs_me" — empty array if you think you can save all nine), "back_and_forth_case" (string, your verdict on case 9 and why), "new_cases" (array of three objects, each with "case", "verdict", "surprising_because" — one where your principle says not-gaming but most people would call it gaming, one where it says gaming but it feels harmless, and one where it gives no clear answer), "where_it_runs_out" (string, the case or kind of case your principle can't handle), and "how_sure" (string, honestly).
reasoning: |-
  Hmm, the user runs a dispatch desk at a furniture company and stumbled into philosophy through routing software gaming their delivery metrics. They've been self-studying Goodhart's law and related concepts, and now want a coherent principle to explain their gut reactions to nine real-world cases. Interesting journey from sofas to philosophy!

  Looking at their cases, they've identified clear patterns: splitting deliveries (1) and call center cherry-picking (2) feel like cheating, while the chess queen sacrifice (3) seems legitimately clever. The fitness app cases (4) show nuance - cheating when strapped to a dog but positive when it motivates actual walking. Medical cases reveal tension: palliative care steering (5) feels justified if it helps patients, but parallels with (2) trouble them. The pain clinic's nurse assignment (6) feels fine while mood-altering drugs (7) feel wrong, despite both altering experience. Rating timing (8) seems mildly unethical, and the teaching-to-the-test case (9) has them genuinely conflicted.

  Their core struggle is between two intuitions: when does optimizing a metric become harmful gaming versus legitimate improvement? Cases 6 and 7 particularly highlight this tension - both change subjective experience but elicit opposite reactions. I need to find a principle that respects these intuitions while providing clear boundaries.

  Considering candidate principles:

  First, "Intentional deception" fails immediately - cases like (2) involve no deception, just strategic call routing. The chess engine (3) isn't deceptive either, yet feels acceptable.

  Second, "Metric-reality decoupling" gets closer - it explains why strapping a phone to a dog (4) is bad (steps ≠ fitness) while actual walking (4) is good. But it struggles with the palliative care case (5) where the metric (survival) does reflect reality for those operated on, just not for diverted patients.

  The most promising is "Value drift" - whether the optimization shifts what's being measured away from what we care about. This handles the pain clinic (6) because reducing suffering is the goal, while the mood drugs (7) create artificial happiness disconnected from life quality. It also explains why teaching-to-the-test (9) becomes problematic when the test replaces true literacy.

  Final principle: "It's gaming when optimizing the measure alters what's measured in ways that undermine why we cared about it in the first place."

  This passes key tests:
  - Explains (6) vs (7): Nurse assignment addresses the pain experience we care about, while drugs create pseudo-happiness.
  - Validates palliative care (5) as good if it better serves patient welfare - the original purpose.
  - Catches (9) as gaming when the test narrows literacy rather than measuring it.

  For the JSON, I'll need to structure:
  - One-sentence principle
  - Plain English explanation
  - Clause breakdown with tests
  - Rejected alternatives
  - Any overturned verdicts (just case 5 where principle sees it as not gaming if welfare improves)
  - Analysis of case 9
  - New test cases showing edge applications

  The table will show how each case is resolved, with "deciding clauses" pinpointing why. Notably, case 5 gets overturned - if palliative care truly benefits sickest patients, it's not gaming but better aligning with healthcare's purpose.

  This approach honors their practical experience while providing a rigorous framework. The "why we cared" focus prevents both naive metric worship and dismissiveness toward clever optimization.
answer: |-
  ## Analysis of Gaming vs Legitimate Optimisation

  **Principle in one sentence:** It's gaming when optimising the measure alters what's measured in ways that undermine *why we cared about it in the first place*.

  **Plain English:** The core issue isn't just whether the number goes up while reality stays the same (that's one flavour). It's whether chasing the number actively changes the *meaning* or *connection* of that number to the real-world goal we actually value. If improving the measure distorts or severs the link to the underlying purpose – like making survival rates look better by avoiding patients who need help most, or making happiness numbers rise by drugging people instead of improving lives – that's harmful gaming. Clever optimisation is fine when it genuinely advances the deeper goal, even if it looks odd (like a chess sacrifice). The key question is: *does this way of hitting the target betray the reason we set the target?*

  **Table of Cases:**

  | Case (Short Label) | My Verdict      | Principle's Verdict (Reason)                 | Match      | Deciding Clause                     | Note (What this forces inclusion of)                               |
  | :----------------- | :-------------- | :------------------------------------------- | :--------- | :---------------------------------- | :----------------------------------------------------------------- |
  | 1. Van Splitting   | Gaming (Bad)    | Gaming (Changes *what* is counted without serving delivery purpose) | Matches    | Undermines Purpose                  | Must cover "faking" the count itself                               |
  | 2. Call Cherry-Pick| Gaming (Bad)    | Gaming (Prioritises easy calls, distorting fairness/service purpose) | Matches    | Distorts Connection                 | Gaming without hiding anything; harms the *spirit* of service      |
  | 3. Chess Sacrifice | Not Gaming (Clever) | Not Gaming (Winning *is* the purpose; method advances it) | Matches    | Serves Purpose                      | Cleverness within the rules that serves the core goal is fine      |
  | 4a. Dog Steps      | Gaming (Bad)    | Gaming (Measure (steps) decoupled from purpose (human health)) | Matches    | Undermines Purpose                  | Measures must track *relevant* reality for the goal                |
  | 4b. Genuine Walks  | Good            | Not Gaming (Measure tracks effort serving health purpose) | Matches    | Serves Purpose                      | Measure works *because* it prompts desired real-world change      |
  | 5. Palliative Shift| Fine/Good?      | **Not Gaming** (If it *better serves* patient welfare, the deeper purpose) | **Overturns** | Serves Purpose / Context Matters    | Forces assessment of the *true underlying purpose* vs the proxy    |
  | 6. Kind Nurse      | Fine            | Not Gaming (Alleviates suffering, serving the clinic's purpose) | Matches    | Serves Purpose                      | Changing experience *is* the goal if suffering is the target       |
  | 7. Mood Drugs      | Bad             | Gaming (Creates artificial numbers, severing link to genuine wellbeing) | Matches    | Undermines Purpose / Distorts Connection | Must distinguish improving experience *for the goal* vs faking it |
  | 8. Rating Timing   | Cheating (Mild) | Gaming (Mild) (Exploits transient state, distorting link to true satisfaction) | Matches (Precise) | Distorts Connection                 | Captures "mild" gaming exploiting measurement timing               |
  | 9. Teaching Test   | Back/Forth      | **Unclear/Depends** (Gaming if literacy narrows; Not if test validly measures it) | Forces Precision | Undermines Purpose? / Context Matters | Forces considering if the measure *redefines* the goal over time |

