prompt: |-
  I keep noticing the same pattern in the way practical skills and rules of thumb change as they pass from person to person, and I want to know whether the Darwinian or cultural-evolution literature — the tradition that treats practices, recipes and techniques as reproducing variants subject to selection — already has a concept for it, or whether it needs one. A bare label will not help me. I want to know what exactly this thing is, what it is not, and where its edges lie, so please carve rather than name; and since I am reading on my own without library access, don't give me a bibliography or tell me who to go read.

  Three cases that seem to me to be the same thing.

  A village bread method involves a long cold rest. Written on a card and passed around, the rest becomes an hour somewhere warm. The loaf still rises and still browns, and nobody who learned it from a card can taste what was lost, because the payoff of that step — flavour, keeping quality, texture — is only detectable by comparison, and the comparison loaf is no longer being baked. Within two decades the long version survives only as something the old people insisted on.

  A fishing community has a reliable rule: set the nets where the birds are working. It comes with a clause — except in the last week of the season, when the shoals have moved inshore and the birds are on something else. The clause is the first thing to go, because it is a conditional with a narrow antecedent. The unqualified rule then gets applied in precisely the week it fails; the failure is filed under weather and luck; and the rule is now taught with more confidence than before, since it no longer carries a hedge.

  A boatyard technique for making a spliced eye in rope includes steps that take a season to teach and whose point becomes visible only when the splice is loaded to failure. A two-day course teaches a shortened version that looks identical, holds under every load anyone present has ever seen, and is taught by its own graduates to the next cohort. Nobody decided to lower a standard. The length of the course now sets the content of the practice.

  What I think the general shape is: a practice carries a visible core that makes it look like a thing of its kind, plus a set of qualifications, preconditions and slow steps whose point is only visible downstream. When transmission moves through a thinner channel — a shorter apprenticeship, a card, a video, a shift handover — the second group drops out systematically, the first survives, and the surviving version is easier to teach, easier to feel confident about, and destroys the feedback that would have revealed the loss: what disappeared was just what would have let a user read a failure as diagnostic. So the population converges on the worse variant without anyone's preferences changing, and it does not revert even when the intact version is still available somewhere.

  Why I don't think the obvious answers settle it. It is not merely that cultural variants are selected for their own transmissibility rather than for their usefulness to the holder; that is true here but too generic to tell me which parts get dropped. It is not the familiar distortion of a story retold down a line of people, because my question is why the degraded form displaces the intact one and then stays displaced. It is not drift, because the direction is predictable in advance from the shape of the channel. It is not the loss of technological complexity that small or isolated populations undergo, because here population size and contact are unchanged and only the channel changed. It may be close to the phenomenon safety engineers describe, where a shortcut becomes normal because each deviation is judged against the last one rather than against the original specification — but in my cases there is no written specification to deviate from; the practice is its own standard. And it may be close to the finding that languages get reshaped by having to squeeze through the heads of learners — except that there the resulting structure is functional for transmission and harmless or better for use, while here the very same adaptation to the channel is what ruins the practice.

  So: does this configuration have an established name or a standard treatment, or is it a composite that the field handles only in pieces? If several neighbouring concepts compete, say which fits best and what each of them would predict about the mechanism — in particular, is the variant being pulled toward a mental prototype of what such a practice looks like, or being squeezed by the channel, and what observation would distinguish those two? If nothing established fits, give me a term and a definition, plus boundary cases: does it still count when the practice is purely expressive and nothing functional is lost; when a single expert restores the missing material and it re-drops within a generation; when the channel is thickened again and the loss fails to reverse? And tell me what would show I have misdescribed the thing.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're describing a pattern where practical skills degrade systematically when transmitted through limited channels, like written instructions or short training sessions. The core elements remain, but nuanced steps or conditions get lost because their importance isn't immediately visible. The user wants to know if cultural evolution theory has a concept for this.

  First, I recall that cultural evolution does discuss transmission fidelity. Boyd and Richerson's work on biases comes to mind—content bias, model-based bias. But those might not fully capture the systematic loss here. The user mentions it's not just about transmissibility but the predictable stripping of non-salient elements. 

  Then I think about the concept of "attrition of tacit knowledge." Tacit knowledge is hard to formalize, so it's often lost first. But is that a recognized term in cultural evolution? Polanyi talked about tacit knowledge, but within this field, it might be part of "lossy cultural transmission." 

  The user's examples highlight that the lost components are those without immediate feedback. That reminds me of adaptive systems where delayed rewards aren't reinforced. In cultural evolution, this could tie into the idea of "invisible costs." If the benefit of a practice element is only apparent long-term or through failure, it's prone to dropout. 

  I also consider whether this is related to "ritualization" where practices become simplified symbols. But the user's cases involve functional loss, not just symbolism. The boatyard splice failing under extreme load shows functionality is compromised. 

  The user rejects several existing concepts: drift, isolation effects, or mere narrative distortion. They emphasize the channel's role in shaping what's retained. So maybe "channel-driven maladaptive simplification" is a term that fits. It combines the transmission bottleneck with the non-adaptive outcome. 

  I should differentiate between cognitive prototypes and channel constraints. If it's cognitive, people might reconstruct the practice to fit a mental schema. If it's channel-driven, the medium limits what can be conveyed. The fishing rule losing the exception clause is a channel issue—written rules simplify conditionals. 

  Boundary cases: if the loss is in expressive practices with no function, is it still the same? Probably not, since the core issue is undetectable functional loss. If an expert reintroduces the full practice but it drops again, that reinforces the channel's role over population size. If thickening the channel doesn't reverse the loss, it suggests path dependency or established norms. 

  The user's deep need seems to be understanding why good practices degrade predictably and how to prevent it. They might be involved in education, craftsmanship, or safety-critical fields where this degradation has real consequences. They want a framework to diagnose and address this erosion, not just a label.
answer: |-
  Your pattern is a precise and underappreciated phenomenon in cultural evolution. It lacks a single established label but fits within the framework of **channel-driven maladaptive simplification through selective tacit-knowledge attrition**. Let's carve it at the joints:

  ### Core Definition
  This is the **systematic erosion of non-salient, high-latency functional elements** during cultural transmission when constrained by:
  1.  **Channel Bandwidth:** Transmission mode (e.g., card, short course, verbal handover) lacks fidelity/capacity for nuanced details, slow processes, or conditional logic.
  2.  **Feedback Attenuation:** The lost elements provide benefits (or avoid failures) only under specific, infrequent, or delayed conditions. Their absence isn't immediately detectable *without direct comparison to the intact version or catastrophic failure*.
  3.  **Self-Reinforcement:** The simplified variant is easier to transmit, learn, and execute, *and* its adoption destroys the very evidence (comparisons, failures traceable to the omission) needed to diagnose the loss.

  ### What It Is NOT (Refining Boundaries)
  *   **Not General "Selection for Transmissibility":** While transmissibility drives it, the *predictable pattern* is the selective loss of elements with *low perceptual salience* and *high outcome latency*. Transmissibility selects *against* these specific traits.
  *   **Not Drift:** Drift is random change. This is directional and predictable: elements requiring bandwidth (time, complexity, conditionals) are lost first.
  *   **Not Fade-Out in Small Populations:** Population size/contact is stable here. The bottleneck is the *transmission event itself*.
  *   **Not Normalization of Deviance:** That requires conscious deviation from a known standard. Here, *the standard itself changes obliviously*; the channel *defines* the new standard.
  *   **Not Creole Formation/Learner Bias:** Learner bias simplifies *for learnability*, often yielding functional systems. Here, simplification *degrades latent functionality* crucial for robustness or edge cases. The adaptation *is* the dysfunction.

  ### Mechanism: Channel Squeeze vs. Prototype Pull
  *   **Channel Squeeze (Dominant Force):** The transmission medium physically filters out elements it cannot carry well: long durations ("season to teach"), complex conditionals ("except in the last week"), subtle sensory feedback ("taste what was lost"). This is primary.
  *   **Prototype Pull (Secondary Reinforcement):** Learners form a mental schema ("what a bread recipe / net rule / splice *should* look like") based on the *transmitted* core. This schema then acts as a filter, making reintroduction of omitted elements feel like unnecessary "add-ons," not core components. The simplified practice *becomes* the prototype.
  *   **Distinguishing Observation:** If **channel squeeze** is key, *improving the channel* (longer apprenticeship, richer media) should *prevent* or *reverse* the loss (if intact source exists). If **prototype pull** dominates, even with a better channel, learners might *still omit* elements perceived as non-prototypical *even if transmitted*, because they don't fit the mental model formed from prior simplified exposures. (Your "re-drops within a generation" case hints at this).

  ### Boundary Cases & Refinements
  1.  **Purely Expressive Practice (No Functional Loss):** *Not the same phenomenon.* The core mechanism relies on the *undetectable loss of latent function*. If nothing functional is lost, it's just stylistic drift or simplification under channel constraints.
  2.  **Expert Restoration & Re-Drop:** *Confirms the phenomenon.* It shows the simplified variant has become entrenched as the cultural "wild type." Its transmissibility advantage persists. The expert acts as an external perturbation; the system (channel + learner expectations) snaps back to the simplified equilibrium. This highlights path dependence and the self-reinforcing nature.
  3.  **Thickened Channel, No Reversal:** *Still counts, but reveals entrenchment.* Possible reasons:
      *   **Prototype Entrenchment:** The simplified practice is now the cognitive norm; the "lost" elements seem alien.
      *   **Functional Irrelevance:** Environmental change made the original latent function obsolete (e.g., birds now reliably track shoals year-round). The loss wasn't maladaptive *anymore*.
      *   **Cost-Benefit Shift:** The cost (time, effort) of restoring the full practice now outweighs its perceived (diminished) benefit in the simplified-context.

  ### If You've Misdescribed It
  These observations would challenge your core thesis:
  *   **Loss is Random:** If omitted elements show no correlation with latency, conditionality, or teaching cost.
  *   **Immediate Feedback Halts Loss:** If users *quickly* detect the functional deficit from the omission *within their own experience* (not needing comparison) and reliably correct it, preventing fixation of the worse variant.
  *   **Simplification is Adaptive:** If the "degraded" variant proves *superior* in the new context (e.g., the hour-rise bread suits modern yeast/wheat better). Your cases imply the loss is genuinely maladaptive but undetectable.
  *   **Conscious Optimization:** If the changes result from deliberate cost-benefit analysis ("the old way isn't worth the time"), not unconscious attrition via transmission.

  ### The Best Fit & Needed Concept
  *   **Closest Established Fragment:** This aligns with Boyd & Richerson's concept of **"Content Biases"** in cultural transmission, specifically the bias *against* hard-to-transmit content. However, it lacks the specific focus on *latent functionality* and *self-reinforcing feedback destruction*.
  *   **Composite Concept:** It combines:
      1.  **Lossy Transmission:** Due to channel constraints (like Sperber's "epidemiology of representations").
      2.  **Tacit Knowledge Erosion:** (Polanyi) - Knowledge that cannot be easily articulated (like the *why* of the long rest or the splice step) is lost first.
      3.  **Delayed Reward Problem:** (From behavioral psychology) - Elements with delayed/punitive reinforcement (avoiding rare failure) are less robustly acquired/maintained.
      4.  **Path Dependence & Lock-In:** (Economics/tech evolution) - The simplified variant becomes entrenched due to increasing returns to adoption (easier teaching).
  *   **Proposed Term:** **Attrition of Latent Function (ALF)** or **Channel-Driven Robustness Erosion (CDRE)**. Core elements:
      *   *Agent:* Constrained transmission channel.
      * *Process:* Selective attrition of elements with low salience & high latency.
      *   *Outcome:* Maladaptive simplification, loss of robustness, self-reinforcing entrenchment.
      *   *Key Differentiator:* Destruction of diagnostic feedback loops.

  Your cases brilliantly illuminate a critical gap: how cultural evolution *predictably degrades robustness* not through external selection, but through internal transmission bottlenecks eroding the very knowledge needed to perceive the degradation. It's a powerful explanation for the silent decay of complex, adaptive traditions.
