prompt: |-
  I write a column on science and ideas, and over the past two years I have come to lean on language models for parts of the job. I am trying to work out what I actually think about when that dependence costs me something, going by my gut on cases, and I would like a principle rather than a vibe.

  Arithmetic and algebra handed to a computer algebra system, in a piece where I only need the result: no loss I care about. Letting a model summarize a paper outside my beat and writing a paragraph from that summary: a real loss, and I would be exposed if a source pushed back on it. The same paper, the same paragraph, but summarized by a colleague who works in that field: fine, or close to it. A model summarizing a paper inside my beat, where I would almost certainly catch a bad summary: mostly fine, but not entirely. Asking a model to walk me through a statistical technique until I can run it myself: clearly fine, maybe better than fine. Dictating drafts by speech-to-text: fine, even though I have noticeably lost the ability to type quickly. GPS in a city I have visited twice: fine. GPS in the neighborhood I have lived in for fifteen years: not fine. Autocomplete for a throwaway data-cleaning script: fine. Autocomplete across a codebase I will maintain for years: worry. A model producing a first draft of my column in something close to my own voice, which I then rewrite heavily: this bothers me most of all, more than the off-beat-paper case, even though I can audit it far better. Turning my own bullet points into a letter of recommendation for a former intern: I think that is fine. A condolence note to a friend: not fine, and I cannot explain why without sounding sentimental.

  My tentative principle is that dependence erodes understanding when it displaces a capacity I would otherwise have exercised and when I cannot audit the tool's distinctive failure modes. But that predicts the voice-draft case should be the least troubling of the set when it is in fact the most, and it has nothing to say about why the recommendation letter and the condolence note come apart. Is there a single principle that handles all of these, or do the epistemic cost and something like an authorship or self-knowledge cost have to be tracked separately? Please state the principle, or the small set of candidates, precisely; say which case motivates each clause; say what it predicts about two cases I have not settled — using a model to pressure-test an argument of mine before publishing it, and relying on one for a medical or financial decision; and say plainly which of my verdicts it cannot accommodate and would have me abandon. I would also like to know whether erosion of understanding is the right description at all, or whether what I am losing in the last two cases is some other thing that merely looks like it.
reasoning: |-
  Hmm, the user is a science columnist grappling with the ethical and cognitive implications of using AI tools in their work. They've presented a detailed list of scenarios where they feel either comfortable or uncomfortable with AI assistance, and they're seeking a unifying principle to explain these intuitions. 

  The user is clearly intellectually rigorous - they've cataloged nuanced cases ranging from technical tasks (algebra, coding) to creative ones (drafting columns) to deeply personal communications (condolence notes). Their discomfort seems strongest when AI touches either core professional competencies (like synthesizing research) or intimate human connections. 

  What's interesting is how their "gut reactions" sometimes contradict their own tentative principle about "eroding understanding." For instance, they feel worse about AI drafting their column (which they can audit) than summarizing an unfamiliar paper (which they can't). This suggests there's more at play than just epistemic risk - perhaps something about identity or authenticity.

  The condolence note vs recommendation letter contrast is particularly telling. Both involve personal expression, but one feels sacred while the other feels transactional. This makes me think the underlying principle might involve what philosophers call "constitutive practices" - activities where the process itself defines who we are. 

  For medical/financial decisions, the stakes are high but the nature is different - it's about delegating judgment rather than expression. Pressure-testing arguments sits somewhere in between: useful as a foil, dangerous as a crutch. 

  I suspect no single principle will perfectly fit all their cases because different dimensions are in tension: competence preservation, error detectability, personal authenticity, and relational sincerity. The best approach might be a dual framework with clear thresholds for when each applies.
answer: |-
  Here's a principled framework that reconciles your intuitions, derived from your cases:

  **The Principle of Constitutive Instrumentality:**

  > *Relying on a tool is permissible when the tool serves as an instrument for an end **external** to the core competence or identity the activity constitutes. It is impermissible when the tool replaces the exercise of that competence or identity, making the activity merely instrumental **for** the tool's output rather than constitutive **of** the agent's capacity or self-expression.*

  **Breakdown & Case Motivation:**

  1.  **"Constitutive Activity" Clause (Motivation: Voice Draft, Condolence Note, GPS in Home Neighborhood):**
      *   Activities are "constitutive" when performing them *is* an expression of core professional competence, personal identity, or essential relationship. Using a tool here replaces *who you are* or *what you do* in that domain.
      *   Cases:
          *   *Voice Draft:* Writing *is* your core professional competence and identity. AI drafting replaces the constitutive act of *your* initial synthesis/expression, even if audited.
          *   *Condolence Note:* Expressing genuine personal grief/solidarity *is* the constitutive act of friendship/care. AI replaces *your* constitutive emotional expression.
          *   *GPS in Home Neighborhood:* Navigating without aids *is* part of the constitutive competence of truly knowing/living in a place. GPS replaces that embodied knowledge.
          *   *Long-term Codebase Autocomplete:* Deeply understanding and shaping the core structure *is* the constitutive competence of maintaining it. Autocomplete risks replacing that constitutive understanding.

  2.  **"External Instrumentality" Clause (Motivation: Algebra, Off-Beat Summary, Statistical Walkthrough, Recommendation Letter, Throwaway Script):**
      *   Tools are permissible when the activity itself isn't core to your competence/identity, but is merely a *means* to an end. The tool's output is the goal; the *process* isn't constitutive.
      *   Cases:
          *   *Algebra/Throwaway Script:* The arithmetic/code is purely instrumental to the result. The process isn't constitutive of your role.
          *   *Off-Beat Summary (by AI):* Understanding that *specific* paper isn't core to your competence. The summary is an instrumental input to your writing. (*Colleague summary is fine as it's delegating an instrumental task to another constitutive agent*).
          *   *Statistical Walkthrough:* Learning the technique *is* constitutive of your competence. The AI acts as a tutor (an external instrument *for* your learning), not a replacement *for* your understanding.
          *   *Recommendation Letter:* The goal is conveying a positive assessment efficiently. The *crafting of prose* is instrumental to that goal, not constitutive of your core identity or relationship with the intern. Your judgment (bullet points) is the constitutive input.

  3.  **"Auditability Constraint" Clause (Motivation: Off-Beat Summary, On-Beat Summary, Medical/Financial Decisions):**
      *   *Even for instrumentally permissible uses*, reliance requires the ability to audit the tool's output for critical failure modes *specific to that tool*, or the stakes must be low enough to tolerate potential errors. High-stakes delegation without auditability is reckless.
      *   Cases:
          *   *Off-Beat Summary (by AI):* Impermissible because you *lack* the constitutive competence to audit AI's distinctive failures (misinterpretation, hallucination) in that domain. High risk of exposure.
          *   *On-Beat Summary (by AI):* *Mostly* fine because your constitutive competence *enables* auditability of AI failures. Residual worry aligns with "mostly fine, not entirely" – auditability isn't perfect, but sufficient for instrumental use *in your domain*.
          *   *Medical/Financial Decision:* High stakes + potential inability to audit AI's complex reasoning or data biases = **Impermissible for sole reliance.** Requires human expert oversight/audit.

  **Predictions for New Cases:**

  1.  **Pressure-Testing an Argument:**
      *   **Permissible (with caution).** The core constitutive act is *your* argument formation. Using AI as an adversarial instrument ("devil's advocate") serves an external goal (finding weaknesses). It doesn't replace your reasoning; it tests it. *Requires Auditability:* You must critically evaluate the AI's counterpoints, not accept them blindly. Your verdict should align with whether the AI's output is treated as instrumental feedback for *your* argument, not as the argument itself.

  2.  **Medical/Financial Decision (Sole Reliance):**
      *   **Impermissible.** (As above under Auditability). These decisions are constitutive of personal well-being/security. Delegating the core judgment to an unauditable black box replaces your (or a trusted professional's) constitutive responsibility and understanding. High stakes amplify the risk.

  **Accommodation & Abandonment:**

  *   **Accommodates:**
      *   Algebra/Throwaway Script (Pure instrumentality)
      *   Off-Beat Summary by AI (Lacks constitutive competence + Lacks auditability) vs. Colleague (Delegated instrumentality)
      *   On-Beat Summary (Instrumental use enabled by constitutive auditability)
      *   Statistical Walkthrough (Instrument for constitutive learning)
      *   GPS in New City (Instrumental) vs. Home (Constitutive competence)
      *   Autocomplete in Throwaway (Instrumental) vs. Long-term Codebase (Risks constitutive competence)
      *   Voice Draft (Replaces constitutive expression)
      *   Recommendation Letter (Instrumental expression of judgment) vs. Condolence Note (Replaces constitutive personal expression)
  *   **Requires Abandonment/Modification:**
      *   Your initial "erodes understanding when it displaces a capacity... and when I cannot audit" principle.
          *   **Why:** It fails on the Voice Draft (auditable but still impermissible) and the Condolence/Recommendation split (displacement similar, but permissibility differs). The constitutive/instrumental distinction explains these better than displacement+auditability alone.
      *   The "erosion of understanding" description for the condolence note/recommendation letter split. While understanding *is* involved (e.g., understanding your own feelings enough to express them genuinely), the primary issue is **authenticity and constitutive expression.**

  **Is it "Erosion of Understanding"?**

  *   **For epistemic cases (summaries, code, stats):** Yes, "erosion of understanding" is apt when tools displace constitutive competence *and* auditability is lacking. You lose the capacity to perform or deeply grasp the task.
  *   **For expressive/identity cases (voice draft, condolence note):** **No.** What's lost is **authenticity, self-authorship, or the constitutive expression of relationship.** It's about the *source* and *nature* of the expression, not just the understanding behind it. A perfectly accurate AI condolence note lacks *your* authentic voice and feeling, making it a constitutive failure of friendship, even if you understand the sentiment perfectly. This is a distinct cost, though often intertwined with understanding in complex tasks.

  **Conclusion:**

  The Principle of Constitutive Instrumentality, with its three clauses, explains your intuitions more consistently than a focus solely on understanding erosion or displacement/auditability. It distinguishes between using tools *as instruments* for external goals versus allowing tools to *replace* the core activities that define your competence, identity, or relationships. It incorporates auditability as a critical constraint for permissible instrumental use, especially under high stakes. This framework acknowledges that the cost of dependence isn't always epistemic; sometimes, it's about authenticity and self-constitution.
