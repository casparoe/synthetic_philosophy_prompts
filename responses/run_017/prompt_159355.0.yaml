prompt: |-
  I'm rewriting the personhood unit for my grad seminar — the MA reading list is due next week and I've been argueing with a colleague in religious studies who keeps saying that ubuntu is just communitarianism with an African hat on, which I think is wrong but can't quite say why yet — and before I throw the neo-Lockeans, Parfit, the animalists and the ubuntu literature at my students I want the spec first. What would an account of what a person is have to get right in order to be worth teaching at all? Give me the desiderata, each with the case or consideration behind it, and mark which ones are non-negotiable for any theory whatever its stripe and which are the house preferences of one camp that I should tell students to discount. The theory is supposed to do normative work: it has to be usable for medical decision-making at the end of life, for criminal responsibility, and for questions about what we owe to social mammals, to corporations, and maybe someday to AI systems.

  Here's the territory I want covered, and please push back where my framing is bad rather than adopting it. The cases: advanced dementia, the newborn, the permanently unconscious patient, a fission case, a social mammal with real second-order social cognition, a corporation, and a language model that passes every conversational test we can devise — which of these are genuinely load-bearing, and which do people only wheel out because they already know the answer they want? The distinctions a theory may not collapse: being a person versus being a member of the species; being a person versus having moral status; whether any status versus how much; personhood at a time versus identity over time; and the Strawsonian point that persons are the things we address with reactive attitudes and demands for justification — does a theory owe us an account of that, or is that just one camp's hobby horse? And the bit the unit actually turns on: I keep finding three readings of the slogan that a person is a person through other people — relations as constitutive of personhood, relations as merely the epistemic criterion by which we pick persons out, relations as the developmental enabling condition without which the capacity never gets built. I want a desideratum that says which reading, if any, an adequate theory is obliged to take, and in particular I want the 'repudiated person' handled: someone whose community withdraws recognition entirely, an outcast, a person universally and systematically misrecognised as sub-personal. If relations constitute, is that person now not a person, or only not treated as one? And the counterfactual version: would they have been a person had they been recognised? I suspect this case forces relational views into an asymmetry they can't state cleanly — personhood can be lost through the subject's own deterioration but should not be lost through other people's attitudes — and I want to know whether that asymmetry is a genuine requirement or just my own liberal scruple dressed up as one. Last thing: should the list demand an applicable criterion that settles cases, or an analysis of what personhood really is, or both? I have a feeling that demanding both is exactly where the list breaks, so if some subset of the desiderata is jointly unsatisfiable, say so plainly and show me the incompatibility — that's the part I most want.

  Then, briefly and at the end only — a short table is fine, don't pad it — say how the psychological-continuity family, the animalist organism view, and a relational ubuntu-style view do against the list, and name the single requirement that kills the most otherwise-live candidates. Where you are making a judgment call rather than reporting something the field agrees on, mark it and give me reasons I can argue with in seminar. Lead with your bottom line in the first sentence — the one desideratum you'd put at the top, or the claim that no such list can be made coherent — then give the reasoning; no preamble and no restating my question back at me.
reasoning: |-
  Okay, the user is rewriting a grad seminar unit on personhood and needs a set of desiderata for evaluating theories of personhood. They have several specific concerns: their colleague dismisses ubuntu as just communitarianism with an African twist, they need the theory to handle normative applications like medical decisions and criminal responsibility, and they're wrestling with relational views of personhood. 

  First, I need to identify the core requirements any personhood theory must meet. The non-negotiables should include avoiding speciesism (since personhood isn't just biological humanity), distinguishing between personhood and moral status (to handle cases like corporations vs. animals), and maintaining the being/status distinction (to prevent absurdities like withdrawing rights arbitrarily). The Strawsonian reactive attitudes point feels like it might be a camp-specific preference rather than universal - it's useful for accountability contexts but less so for beings like dementia patients. 

  The cases they listed vary in importance. Advanced dementia and permanent unconsciousness are crucial for medical ethics, while fission cases are more theoretical. The "repudiated person" scenario is particularly vital for testing relational theories - if personhood depends on recognition, does systematic misrecognition destroy it? That reveals a tension between relational views and the liberal intuition that personhood can't be revoked by others. 

  For the "person through others" slogan, I think the constitutive reading is the most philosophically significant but also the most problematic. The repudiated person case shows why: if relations constitute personhood, then someone stripped of recognition might cease to be a person. But that clashes with the strong intuition that personhood is inherent. This suggests constitutive relational views may need to compromise on that asymmetry requirement. 

  When comparing theories, psychological continuity handles many cases well but fails on newborns and dementia patients. Animalism solves those but can't explain brain transplants or AI. Relational ubuntu views excel at social contexts but stumble on repudiated persons and non-human cases. The killer requirement seems to be the asymmetry condition - it's what forces relational views into uncomfortable positions. 

  The user's deepest need here is clarity on whether their liberal intuitions about inherent personhood are negotiable. By framing the asymmetry as a desideratum rather than universal, they can present it as a choice point for theories - which might help resolve their debate about ubuntu being more than just communitarianism.
answer: |-
  Here is the core desiderata for a personhood theory capable of normative work, ranked by criticality, with cases/distinctions and negotiability flagged. The bottom line: **The non-negotiable requirement is *Ontological Robustness*: Personhood cannot be wholly contingent on external recognition or attitudes (due to the repudiated person & normative incoherence).**

  ### Non-Negotiable Desiderata (Any viable theory MUST satisfy these)
  1.  **Ontological Robustness:** Personhood must be an intrinsic property (or relational property robust against external denial) such that it *cannot be extinguished solely by others' attitudes or actions*.  
      *   **Case/Reason:** The *Repudiated Person* (universal misrecognition). If relations *constitute* personhood, the outcast ceases to be a person. This leads to normative collapse: we lose grounds to condemn the misrecognition itself and face absurdity (e.g., genocidal logic validated). The counterfactual ("would they be a person if recognized?") highlights the dependency problem. The asymmetry (loss via intrinsic degradation = acceptable, loss via others' attitudes = unacceptable) is not merely liberal scruple; it's foundational for stable normative application (rights, responsibility, inherent dignity).
      *   **Distinction Guarded:** Being a person vs. being *treated* as one; Status vs. recognition/capacity.
  2.  **Distinction: Personhood ≠ Biological Species Membership:**  
      *   **Case/Reason:** Corporations, potentially advanced AI, profoundly disabled humans, non-human persons (social mammals). A theory collapsing this cannot handle normative questions about non-human entities or humans lacking species-typical capacities without speciesism. Necessary for medical ethics (dementia) and AI/corporate questions.
  3.  **Distinction: Personhood ≠ Moral Status (Full Stop):**  
      *   **Case/Reason:** Newborns, advanced dementia, permanently unconscious patients, social mammals. Some entities may have high moral status (deserving protection) without being persons (e.g., lacking capacities for responsibility, complex agency). A theory conflating them cannot explain *differential* normative treatment (e.g., why we don't put corporations in prison *even if* they are persons, or why we care for permanently unconscious patients differently than typical persons).
  4.  **Distinction: Personhood-at-a-time vs. Identity-over-time:**  
      *   **Case/Reason:** Advanced dementia, fission, permanent unconsciousness. Norms require knowing *who* bears responsibility/rights *now* (person-at-a-time) and *who* is the *same* entity over time to apply past/future norms (identity). Medical decisions (advance directives) and criminal justice (punishment) demand this separation. Fission cases stress identity theories.

  ### Highly Important, But Camp-Specific Desiderata (Essential for *some* theories/norms, mark as such)
  5.  **Strawsonian Point (Reactive Attitudes):** The theory should explain *why* persons are the primary targets of reactive attitudes (resentment, gratitude, moral demands) and demands for justification.  
      *   **Case/Reason:** Criminal responsibility, basic social interaction, corporate blame/AI interaction. *Crucial* for responsibility-focused theories. *Less critical* for theories focused solely on basic rights or life/death decisions. Mark as a key commitment of agency/responsibility-focused camps (e.g., Frankfurt, Strawson).
  6.  **Developmental/Epistemic vs. Constitutive Relations:** A theory must clearly state the role of relations:  
      *   *Developmental:* Relations enable capacity-building (non-negotiable for plausible theories – e.g., feral child).  
      *   *Epistemic:* Relations help us *identify* persons (often necessary pragmatically).  
      *   *Constitutive:* Relations *are* (part of) what it *is* to be a person. **Here's the crux:** Ontological Robustness *rules out Pure Constitutivism*. If relations *constitute* personhood, repudiation destroys it. A viable constitutive view must make relations *internal* or *counterfactually robust* (e.g., "capacity for relation" or "relational nature persisting despite denial"), moving towards a modified intrinsic view. **Mark:** Strong constitutive relationalism (pure Ubuntu reading) fails Robustness; modified versions are possible but contentious.
  7.  **Applicable Criterion vs. Deep Analysis:** Prioritize an *applicable criterion* for settling cases *in context* over a perfect metaphysical analysis.  
      *   **Reason:** Demanding *both* a universally applicable, clear-cut criterion *and* a deep analysis of the "real essence" is likely impossible (the "breaks" point). Psychological continuity offers a criterion but struggles with essence/dementia/newborns. Animalism offers essence but a poor criterion (corporate persons?). Relational views offer social criteria but murky essence/robustness. **Focus on a criterion usable *within the normative domains specified*** (medicine, law, AI ethics).

  ### Case Load-Bearing vs. Theoretical
  *   **Load-Bearing:** Advanced Dementia, Permanent Unconsciousness, Newborn, Repudiated Person, Social Mammal (with cognition), Corporation. These stress core distinctions and normative applicability.
  *   **Primarily Theoretical/Argumentative:** Fission (tests identity theories specifically), Conversational AI (tests capacities/criteria but often used ideologically).

  ### Theory Performance Against Key Desiderata (Summary)

  | Theory              | Ontological Robustness | Person ≠ Species | Person ≠ Status | At-time vs. Over-time | Strawsonian | Relations (Robust?) | Applicable Criterion? |
  | :------------------ | :--------------------- | :--------------- | :-------------- | :-------------------- | :---------- | :------------------ | :-------------------- |
  | **Psychological**   | ✓ (Intrinsic capacity) | ✓                | ✗ (Often conflates) | ✓ (But identity issues) | ✓           | ✗ (Developmental/Epistemic) | ✓ (But fails infants/dementia) |
  | **Animalism**       | ✓ (Biological)         | ✗ (Collapses)    | ✓               | ✓ (Biological identity)| ✗           | ✗                   | ✗ (Fails corporations/AI) |
  | **Relational (Ubuntu)** | ✗ (Pure Constitutive) / △ (Modified) | △ (Usually human-focused) | △ (Can conflate) | △ (Can be fuzzy)      | ✓           | ✓ (But robustness?) | ✓ (Social context)    |

  **The Requirement That Kills:** **Ontological Robustness** kills pure constitutive relational views (common Ubuntu readings) and strong social constructivism. It also pressures psychological views regarding permanent capacity loss (dementia) and animalism regarding non-biological persons.

  **Key Judgment Calls & Arguments:**
  1.  **Ontological Robustness as Non-Negotiable:** *(My strong claim)*. Argue: Without it, personhood becomes a socially conferred status vulnerable to tyranny/majoritarianism, undermining the very normative work (protecting rights, assigning responsibility justly) it's meant to do. The repudiated person case is decisive.
  2.  **Pure Constitutive Relationalism Fails:** *(My claim, contra some Ubuntu interpretations)*. Argue: If "a person is a person through other people" means *constitutive* recognition, then universal misrecognition logically entails non-personhood. This is normatively intolerable and renders the concept useless for condemning such misrecognition. Modified views ("inherent relational nature," "capacity for relation") survive but resemble intrinsic views + social importance.
  3.  **Prioritize Criterion over Essence:** *(My pragmatic claim)*. Argue: For *this seminar's goal* (normative application in medicine, law, AI), a workable criterion for identifying persons *in context* is more valuable than a perfect metaphysical essence (likely unattainable). Essence debates are vital but secondary to application here. This lets different theories shine in different domains.
  4.  **Ubuntu ≠ Communitarianism Lite:** *(Your defense)*. Argue: Ubuntu *can* offer a *unique* constitutive view grounded in specific African metaphysics and ethics, emphasizing interdependence and harmony as *ontologically fundamental*, not just politically desirable. *However*, point out its vulnerability to the Robustness critique unless modified. Its strength is reframing the *basis* of intrinsic value/relation away from Western individualism, not necessarily denying robustness.
