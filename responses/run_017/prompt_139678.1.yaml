prompt: |-
  Hi — I'm a journalist, I mostly cover the economics of platforms and the odd ideas-and-society piece, and right now I'm trying to write something about why the phrase fair price keeps clawing its way back into public argument every time there's a scandal about surge pricing, ticket fees, dynamic supermarket shelf tags, or some app quietly setting what a driver gets paid. Everyone I interview who has any theory at all ends up reinventing a very old wheel, and I keep getting pointed back to Aristotle: the stretch in Book V of the Nicomachean Ethics where a builder and a shoemaker have to be brought to some kind of equality before there can be an exchange between them at all, where the real measure is supposed to be need rather than money, and money is only a conventional stand-in (and, as I understand it, a kind of pledge that future exchange will be possible); and then the early part of the Politics where he grumbles about trade aimed purely at profit and about money apparently breeding more money. I've dipped into the secondary literature and honestly most of it is scholars arguing about what he meant, which is useless for a magazine piece, so please don't give me exegesis, a reading list, or any page citations — I'm writing this on a train with no library access and nothing to look things up on.

  What I actually want is a spec, because I've noticed I don't have one. Before I read any more theories of what makes an exchange fair, exploitative, or merely grubby, tell me what such a theory has to deliver: the cases it has to get right, the distinctions it mustn't collapse, and the background facts about actual markets it isn't allowed to contradict — each with the case or the reason behind it, so I can see where the bite is. Please make sure the list covers at least these: straightforward producer-for-producer trade (my builder and shoemaker baseline); exchange of things nobody produced and whose supply is basically fixed — land, attention, personal data, offsets; cases where no human sets the number at all because an algorithm or a platform does, so it's unclear whose will is in the exchange and whether voluntary is a coherent description; markets where money is deliberately banned and allocation runs on need or on matching instead (organ donation, paired kidney exchange), which might vindicate the need-measure reading or might be a totally different principle wearing its clothes; exchange stretched across time, i.e. credit and interest, where I want to know whether the objection to money making money falls out of the framework or is a detachable prejudice of his; unequal-outside-option cases where both parties genuinely consent but one has nowhere else to go; and the nasty one I can't stop thinking about, where the unit of measurement is itself somebody's tradeable asset — platform tokens, airline miles, in-game currency, a stablecoin issuer.

  Two things I'd most like from you. First, sort the requirements: mark which are genuinely mandatory for a theory good enough to judge real markets by, and which are just the tastes of one camp dressed up as rigor (I suspect a few of the things people demand — that it never appeal to anything but observed consent, or that it never appeal to anything but a single quantity — are exactly this, but tell me which). Second, commit: if some subset of the requirements can't all be satisfied together, say which pair collides, show me the case that makes them collide, and then actually pick — if you had to drop one, drop it and defend dropping it. I'd also like your bet on which single requirement kills off the most popular contemporary account of fair exchange. A short closing paragraph on how three contenders fare against your list would help me see if it's usable — Aristotle's own need-based one, the consent-plus-competition-is-all-there-is one, and something like a cost-of-production or labor-input one — but the criteria are the part I'm paying for, not the scorecard. And since I'm going to quote someone on this, flag the one place in your list where you're least confident or where you think a decent philosopher would tell me you've oversimplified.
reasoning: |-
  Okay, the user is a journalist writing about the recurring debate on "fair price" during scandals like surge pricing or hidden fees. They want a spec for a theory of fair exchange without academic exegesis. Let me break down their request.

  First, they need the essential requirements such a theory must meet. They listed specific cases: producer-to-producer trade, fixed-supply exchanges, algorithm-driven prices, non-monetary markets, credit/interest, unequal bargaining power, and when the currency itself is an asset. I need to cover each, marking mandatory vs. optional demands.

  The user wants clarity on conflicts between requirements. For example, "voluntary consent" versus "need fulfillment" might clash in kidney exchanges where consent is present but need is the allocation basis. I should identify such collisions and choose which to prioritize, explaining why.

  They also want to know which requirement trips up popular theories. For instance, the consent-only approach fails with algorithmic pricing because consent isn't meaningful when prices are opaque. Highlighting this shows the theory's gap.

  I need to assess Aristotle, consent-competition, and cost-based theories briefly. Pointing out where each struggles against the criteria will demonstrate the spec's applicability. The user mentioned not wanting a scorecard, but a quick comparison helps validate the framework.

  The user might have deeper needs: a practical tool to critique real-world issues without academic jargon. They need clear, actionable criteria to structure their article. Also, they might want to challenge common assumptions, like whether consent alone ensures fairness, especially in power imbalances.

  I should flag the trickiest part, maybe the "currency as asset" case, where measuring fairness gets complex with volatile valuations. Admitting uncertainty here adds credibility.

  Finally, ensure the response stays concise, avoids citations, and focuses on applicability. Prioritize real-world examples to illustrate each point, making the abstract concepts tangible for readers.
answer: |-
  Here’s a spec for a theory of fair exchange, designed to handle the cases you outlined. Requirements are sorted into **Mandatory** (core to judging real markets) and **Contested** (reflect philosophical/political leanings). Conflicts are identified, and a choice is made where necessary.

  ---

  ### Mandatory Requirements (Must-Have)
  1.  **Handles Baseline Producer-for-Producer Exchange:** Must explain why a direct exchange (shoemaker's shoes for builder's house-hours) *can* be fair, even without money, by capturing a reciprocal relationship based on contribution/effort/need. *Reason:* This is the foundational case Aristotle identified; failing here makes the theory irrelevant to core economic activity.
  2.  **Distinguishes Value from Price:** Must provide a conceptual basis for "value" (whether need, labor, utility, etc.) that isn't solely defined by the monetary price paid in a specific transaction. *Reason:* Otherwise, every market price is tautologically "fair," negating the concept and making scandals about pricing irrational.
  3.  **Accounts for Power Asymmetry & Outside Options:** Must acknowledge that fairness can be undermined even with "consent" when one party faces dire alternatives (e.g., a worker needing *any* job, a tenant facing eviction). *Reason:* Real markets are rife with inequality; ignoring this renders the theory naive and useless for analyzing exploitation.
  4.  **Explains the Fairness Problem in Algorithmic/Platform Pricing:** Must address the opacity, lack of human agency, and potential manipulation inherent in non-human price-setting. *Reason:* This is a dominant modern mode of exchange; the theory must grapple with whether "voluntary" consent is meaningful when the process is inscrutable.
  5.  **Accommodates Non-Monetary Allocation Systems (e.g., Organ Donation):** Must be able to assess fairness in systems explicitly rejecting money and using need/matching. *Reason:* These exist and claim ethical superiority; a theory must judge if their fairness principle is coherent and distinct.
  6.  **Recognizes Time & Risk (Credit/Interest):** Must provide a framework for judging the fairness of lending and the charging of interest that isn't purely prejudicial. *Reason:* Credit is fundamental; condemning *all* interest as "money breeding money" is impractical, but unrestrained usury is exploitative. The theory must navigate this.

  ### Contested Requirements (Often Camp-Specific)
  7.  **Requires Observable Consent as Sufficient:** *Contested Demand (Libertarian/Formalist Camp).* Holds that if both parties freely agree without fraud/coercion (narrowly defined), the exchange is fair. *Problem:* Collides with **Mandatory #3 (Power Asymmetry)**. A desperately poor person "consenting" to a predatory loan isn't widely seen as fair. *Verdict:* **Drop this as sufficient.** Consent is necessary but *not sufficient* for fairness; power dynamics matter.
  8.  **Requires a Single Quantifiable Measure (e.g., Labor Hours, Utility):** *Contested Demand (Some Marxist/Utilitarian Camps).* Insists fairness must be reducible to one objective metric. *Problem:* Collides with **Mandatory #5 (Non-Monetary Allocation)** and **Mandatory #2 (Value vs. Price)**. Need in kidney allocation isn't quantifiable like labor; value is often multidimensional. *Verdict:* **Drop this as necessary.** A good theory can handle plural or incommensurable sources of value/need.
  9.  **Requires No Appeal to Subjective "Need" or "Desert":** *Contested Demand (Strict Subjectivist/Revealed Preference Camp).* Argues fairness is only about process (consent/competition), not outcomes based on unobservable states. *Problem:* Makes **Mandatory #5 (Non-Monetary Allocation)** unintelligible and fails to capture intuitions behind **Mandatory #1 (Baseline Exchange)** and scandals involving necessities. *Verdict:* **Reject this demand.** Assessing fairness requires grappling with concepts like need, contribution, or desert, however imperfectly measured.

  ### Tricky Case: Currency as Asset (Tokens, Miles, Stablecoins)
  10. **Must Address Valuation Instability & Control:** The theory needs to handle cases where the *medium* of exchange itself has:
      *   **Fluctuating Value:** Is fairness judged at transaction time, or does subsequent devaluation matter?
      *   **Control by a Party:** Does the issuer manipulating the token's value or utility (e.g., devaluing miles, platform fees) introduce unfairness?
      *   *Reason:* This blurs the line between the *terms* of exchange and the *tool* of exchange, creating novel power dynamics and risks.

  ---

  ### Conflicts & Choices
  *   **The Sharpest Collision:** **Mandatory #3 (Power Asymmetry)** vs. **Contested #7 (Consent as Sufficient)**.
      *   **Case:** A worker in a company town with one employer "consents" to below-subsistence wages because the alternative is starvation. Formal consent exists, but profound power imbalance exists.
      *   **Choice:** **Mandatory #3 wins. Consent is dropped as *sufficient*.** Fairness requires mitigating extreme power imbalances; mere consent doesn't guarantee it. The theory must incorporate a concept of baseline security/acceptable alternatives.

  ---

  ### Which Requirement Kills the Most Popular Contemporary Account?
  **The "Consent + Competition is All That Matters" theory (often underpinning deregulatory arguments) is killed by Mandatory #4 (Algorithmic Pricing) and Mandatory #3 (Power Asymmetry).**
  *   **Why:** In opaque algorithmic pricing (e.g., Uber surge, dynamic shelf tags), meaningful consent is eroded – the consumer can't understand *why* the price is what it is or negotiate. Competition often doesn't prevent exploitative algorithms (e.g., landlords using yield software). It also completely fails Mandatory #3 – competition doesn't magically erase power imbalances like a worker with no savings facing an employer.

  ---

  ### Contenders Against the List (Briefly)
  1.  **Aristotle (Need/Reciprocity):**
      *   **Strengths:** Nails **#1 (Baseline)**, **#2 (Value≠Price)**, strong on **#5 (Non-Monetary)**. Explains grumbling about profit-for-its-own-sake (**#6 Time/Risk** hint).
      *   **Weaknesses:** Vague on quantifying "need" for complex goods. Struggles terribly with **#4 (Algorithms)** (whose need? opaque process?) and **#10 (Currency Asset)**. Weak on **#3 (Power)** – assumes rough equality of citizens.
  2.  **Consent + Competition is Sufficient:**
      *   **Strengths:** Clear on process. Simple.
      *   **Weaknesses:** Fails **#3 (Power)**, **#4 (Algorithms)**, **#5 (Non-Monetary)**. Ignores **#2 (Value≠Price)**. Useless for your scandals.
  3.  **Cost-of-Production/Labor Theory (e.g., some Marxists):**
      *   **Strengths:** Addresses **#2 (Value≠Price)**, strong on **#1 (Baseline)** if labor is the input, can handle **#3 (Power)** via exploitation theory.
      *   **Weaknesses:** Struggles with **#5 (Non-Monetary)** (need ≠ labor cost), **#6 (Time/Risk)** (justifying interest is hard), **#10 (Currency Asset)** (what's the labor in a token?). Utterly fails **#4 (Algorithms)** – the algorithm's "labor" isn't the relevant cost.

  ---

  ### Flagged Oversimplification
  **The biggest oversimplification is likely in Mandatory #2 (Distinguishing Value from Price).** Philosophers/economists have argued for centuries (objectively, subjectively, intrinsically, relationally) about what "value" *is*. I've sidestepped this by making it a functional requirement ("must provide *a* basis"), but a decent philosopher would rightly point out this is the core unresolved problem. Any theory's choice of "value" (need, utility, labor, etc.) is its most consequential and debatable move. My spec demands the distinction exists but doesn't resolve the underlying metaphysics.

  This spec gives you the bite points: a theory must handle foundational exchange, power, opacity, non-money systems, time, and tricky new assets, while rejecting the sufficiency of pure consent or single metrics. The collision between power and consent is where real blood is drawn.
