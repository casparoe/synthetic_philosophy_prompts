answer: |-
  Here's my adjudication of the debate, following your structure and constraints. I'll address each move in sequence with a rating and brief justification, then determine who is more right overall, note what both are missing, and answer your three sub-questions.

  ### Move-by-Move Ratings
  1. **Nadia (Renée lied or did what a liar does)**: *Partly right*. Justification: She correctly identifies Renée’s deceptive intent and the harm of hiding behind "literal truth," but lying typically requires a false statement—not just a misleading implication. Her claim that Renée "did what a liar does" conflates lying with intentional deception broadly.  
  2. **Rowan (Renée misled without lying due to Gricean Quality)**: *Clearly right*. Justification: Grice’s Quality maxim explicitly governs *saying* (asserting false propositions), not implicating. Renée’s statements were factually true, and her defense holds at the level of what was said. Cancellability reinforces this: she *could* have denied the implication without contradicting her words.  
  3. **Nadia (Supermaxim covers implicature; cancellability worsens Renée’s case)**: *Partly right*. Justification: She’s right that cancellability makes Renée’s choice more ethically suspect, as it reveals calculated dishonesty. But she’s mistaken about the supermaxim: Grice’s supermaxim ("make your contribution truthful") summarizes the sub-maxims (which target *saying*), and he treats implicature as governed by other maxims (like Relevance or Quantity), not Quality.  
  4. **Rowan (Supermaxim isn’t additional; irony isn’t lying)**: *Clearly right*. Justification: Grice’s framework treats Quality violations as strictly about false statements. Irony exemplifies how implicating falsehoods isn’t lying—the hearer grasps the speaker isn’t asserting the literal meaning. This refutes Nadia’s broader "meaning = lying" claim.  
  5. **Nadia (Gricean speaker meaning includes intention; uptake matters)**: *Partly right*. Justification: She’s correct that Renée intended the committee to form a false belief via recognized intention (fitting Grice’s "speaker meaning"). But she overreaches by implying this *is* lying. Grice distinguishes "meaning" from "saying"—speaker meaning covers implicature, but lying is defined by false assertion.  
  6. **Rowan (Dispute is about inducing false belief, not lying)**: *Clearly right*. Justification: He refocuses correctly: lying is a subset of deception. His underinformative-reply example (e.g., "the room was full" to avoid criticizing a talk) shows not all implicative deception is lying. The hearer *might* infer falsely, but the speaker hasn’t asserted anything untrue.  
  7. **Nadia (Renée’s case exploits trust parasitically)**: *Clearly right*. Justification: She nails why Renée’s act is distinct from Rowan’s underinformative reply. The committee reasonably assumed Renée was cooperative (invoking Grice’s "cooperative principle"), so her implicature wasn’t just inferred—it was *engineered* by exploiting institutional trust in a way ordinary evasion doesn’t.  

  ### Overall Verdict
  **Rowan is more right overall**. He correctly anchors the debate in Grice’s definitions: lying requires a false statement, while Renée’s literal assertions were true. Nadia’s points about intent and ethical harm are valid but don’t redefine lying—they highlight a morally gray area of *misleading*. Rowan’s consistency on Gricean terms (moves 2, 4, 6) outweighs Nadia’s perceptive but overextended critiques.  

  ### What Both Are Missing
  - **Rowan** underplays how Renée’s institutional role (as a recommender) heightens her duty to avoid misleading, making her "deniability" more insidious than everyday evasion.  
  - **Nadia** misses that Grice’s framework *allows* for non-lying deception (e.g., politeness), so condemning Renée requires ethical arguments beyond linguistics.  
  - **Both** ignore the emeritus’s "not going to die" example, which challenges Rowan’s clean saying/implicating split by suggesting contextual enrichment can blur what is "said."  

  ### Answers to Sub-Questions
  1. **Does the saying/implicating line fall where Rowan puts it in Renée’s case?**  
     Broadly, yes. Rowan is right that Renée *said* only true things (e.g., "Dana reads everything" is factual) and *implicated* falsehoods (e.g., "the work is original"). But the "not going to die" example shows "what is said" can be contextually enriched (e.g., "not going to die *from this cut*"), which might apply here—if "reads everything" enriches to "reads everything *relevant*," it could imply false originality. Still, in standard Gricean terms, Rowan’s boundary holds.  

  2. **Does Gricean Quality govern what is implicated?**  
     No. Quality’s sub-maxims ("do not say what is false") explicitly regulate *saying*. Implicatures are guided by other maxims (e.g., Relevance or Quantity) and the cooperative principle. Violating Quality requires a false statement; generating false implicatures may break other maxims but isn’t a Quality violation.  

  3. **How much weight should the "not going to die" example carry?**  
     Significant weight. It exposes a flaw in Renée’s "only said true things" defense by demonstrating that "what is said" isn’t always minimal or literal—it can absorb unstated qualifiers through pragmatic enrichment. If "reads everything" implies "reads everything *important*," Renée’s statement might *directly* imply falsity, undermining her defense. This challenges Grice’s original saying/implicating divide and suggests Rowan’s stance relies on an outdated, overly narrow view of "saying."  

  ### Final Note
  Renée’s act is deceptive and ethically dubious, but under Grice’s system, it isn’t lying—it’s a calculated exploitation of implicature. The "not going to die" case, however, hints that real-world language often resists such neat categorization, making Renée’s literal-truth defense weaker than Rowan claims.
