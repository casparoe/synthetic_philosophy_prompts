prompt: |-
  Our federation's Constitutional Review Commission has a standing Referral Committee that decides which adopted measures must go to a binding popular referendum — a double majority of voters and of the federation's regions — rather than taking effect on the assembly's own vote. Its track record:

  - Referred: a revision of the amendment formula itself, including new entrenchment thresholds.
  - Referred: replacement of party-list proportional representation with single-member districts.
  - Referred: term limits for members of the assembly.
  - Referred: assisted dying, after a decade of legislative deadlock and three failed private-member's bills.
  - Referred: ratification of a treaty transferring regulatory authority to a supranational body, despite a comfortable pro-treaty majority.
  - Not referred: a cross-party settlement, negotiated over two years and carried by four-fifths of both chambers, on the two official languages of the civil service.
  - Not referred: siting of a long-lived nuclear waste repository, after the host municipality consented to a negotiated compensation package.
  - Not referred: a five-year suspension of a constitutional right during an emergency, which lapsed automatically although everyone expected it to be extended twice.

  The new case: a package amendment negotiated across party lines and carried by four-fifths of both chambers that (i) lowers the voting age to 16 for national elections and (ii) transfers constituency-boundary drawing from the assembly to a permanent independent commission, with no sunset and no review clause. Note two wrinkles I think matter: limb (ii) removes the assembly's conflict of interest rather than exemplifying it, and limb (i) would be authorized by an electorate that the change itself redefines.

  I want more than a gut verdict. Identify the two or three rules that fit these precedents equally well — for example, a rule that any change to the constitutive rules of the game needs direct popular authorization whatever the legislative consensus, versus a rule that referral is only for repairing a deficit of authority (self-dealing, deadlock, or imposition on an unconsenting minority) — and say what each predicts here, including whether the two limbs come apart and whether the package is partible. Then give your best prediction with the reasons for preferring it, name the precedent that is the closest analog, say honestly whether our record underdetermines the case, and specify the one further case that would most cleanly separate the surviving rules.
reasoning: |-
  Hmm, the user is presenting me with a complex constitutional law problem from their federation. They're part of a Constitutional Review Commission with a Referral Committee that decides when adopted measures require a binding popular referendum instead of taking immediate effect. They've given me a detailed track record of past decisions and want me to analyze a new case involving a package amendment that lowers the voting age and transfers boundary-drawing authority to an independent commission.

  I need to approach this methodically. First, I should identify the patterns in their precedents. The referred cases include: amendment formula changes, electoral system overhaul, term limits for lawmakers, assisted dying after deadlock, and treaty ratification despite legislative majority. The non-referred cases include: language settlement with supermajority, nuclear waste siting with local consent, and temporary suspension of rights that lapsed.

  For the new case, there are two key "wrinkles": the boundary commission removes legislative conflict of interest, and the voting age change would be authorized by the newly enfranchised group. The package was passed with strong cross-party support (four-fifths majority).

  I should identify at least two competing principles that fit most precedents. One could be the "constitutive rules" principle - that any change to fundamental democratic structures requires referendum. Another might be the "deficit of authority" principle - where referendum is only needed when there's self-dealing, deadlock, or imposition on minorities. There's also potentially a "supermajority bypass" principle where strong consensus can avoid referendum.

  For each principle, I'll determine what it would predict for this case, whether the two limbs of the amendment should be treated separately, and whether the package can be split. Then I'll make my best prediction, identify the closest precedent, acknowledge if the case is underdetermined, and suggest a hypothetical future case that would clarify the rules.

  The voting age change seems more constitutionally significant as it alters the electorate itself, while the boundary commission reform addresses a conflict of interest. The language settlement precedent (not referred despite being constitutive) suggests supermajority consensus might override the need for referendum. The emergency powers case shows that even temporary rights suspensions don't require referendum if they have built-in limitations.

  I think the committee will likely not refer this package, seeing the supermajority as sufficient democratic authorization, with the language case being the closest analog. But I'll be honest that this is underdetermined - the voting age change is unique in authorizing its own electorate. A future case about altering the electoral system without supermajority would help clarify the principles at play.
answer: |-
  Based on the precedents provided, the Referral Committee operates under principles that aren't explicitly stated but can be inferred. Here are the two most plausible competing rules that fit the track record equally well, their predictions for the new case, and a reasoned conclusion:

  **Rule 1: The Constitutive Rules Principle**
  *   **Definition:** Any amendment fundamentally altering the constitutive rules of the democratic system itself (electoral mechanics, representative structure, core amendment process, fundamental rights thresholds) requires direct popular authorization via referendum, regardless of the legislative majority achieved. This rule prioritizes popular sovereignty over the assembly's will on foundational matters.
  *   **Fit with Precedents:**
      *   *Referred:* Amendment formula (core constitutive rule), Electoral system change (core constitutive rule), Term limits (alters representative structure), Treaty transfer (alters fundamental sovereignty).
      *   *Not Referred:* Language settlement (significant but not *core* democratic structure; operational), Nuclear siting (policy/operational with consent), Emergency suspension (temporary operational measure, lapsed).
  *   **Prediction for New Case:**
      *   **Limb (i) Lower Voting Age:** **REFER.** This fundamentally changes the composition of the electorate, a core constitutive element of the democratic system. The "wrinkle" (authorization by the redefined electorate) reinforces the need for direct popular legitimacy.
      *   **Limb (ii) Independent Boundary Commission:** **REFER.** While removing a conflict of interest, it fundamentally alters how constituencies (the building blocks of representation) are defined, transferring a core democratic function definitively away from the elected assembly to an unelected body. This is a constitutive rule change.
      *   **Package Partibility:** The rules are **NOT readily partible** under this principle. Both limbs directly alter core constitutive rules of the electoral and representative system. Separating them might be procedurally complex or seen as undermining the negotiated package. The principle focuses on the *nature* of the change, not its packaging.
  *   **Overall Verdict:** **REFER the entire package.**

  **Rule 2: The Deficit of Democratic Authority Principle**
  *   **Definition:** Referral is required only when there is a significant deficit in the democratic legitimacy or authority of the assembly's decision. This deficit arises from: (a) **Self-dealing** (assembly benefiting itself), (b) **Persistent Deadlock** (inability to resolve a major societal issue legislatively), (c) **Imposition on Unconsenting Minorities** (especially regions or groups with distinct interests), or (d) **Fundamental Delegation of Sovereignty**. High consensus (like the 4/5ths here) can often overcome potential deficits.
  *   **Fit with Precedents:**
      *   *Referred:* Amendment formula (self-dealing + constitutive), Electoral system (self-dealing + constitutive), Term limits (self-dealing), Assisted Dying (deadlock), Treaty (sovereignty delegation + potential minority imposition).
      *   *Not Referred:* Language settlement (high consensus, no deadlock, operational policy), Nuclear siting (local consent mitigates imposition), Emergency suspension (temporary, lapsed, broad perceived necessity/consensus at time).
  *   **Prediction for New Case:**
      *   **Limb (i) Lower Voting Age:** **NOT REFER (Likely).** While constitutive, there is no clear deficit: *No self-dealing* (assembly not enfranchising itself), *No deadlock* (adopted smoothly), *No imposition* (affects all equally, no specific regional/minority burden), *No sovereignty delegation*. The "wrinkle" (new electorate authorizing itself) is novel but mitigated by the overwhelming cross-party supermajority (4/5ths), demonstrating broad elite and (inferred) popular consensus, repairing any potential deficit.
      *   **Limb (ii) Independent Boundary Commission:** **NOT REFER.** Explicitly *removes* a conflict of interest (self-dealing), enhancing impartiality. No deadlock, no imposition, no sovereignty delegation. High consensus supports legitimacy.
      *   **Package Partibility:** The limbs **could be separated** under this principle, as the deficits assessed are different in nature (though none found here). However, the high consensus on the *package* strongly suggests no overall deficit.
  *   **Overall Verdict:** **NOT REFER the package.**

  **Best Prediction & Reasoning:**

  *   **Prediction:** **NOT REFER.** The package will likely take effect without a referendum.
  *   **Reasons for Preference:**
      1.  **Overriding Importance of Supermajority Consensus:** The clearest precedent for a major, potentially constitutive change passed with 4/5ths support and *not* referred is the **Official Languages settlement**. This demonstrates the Committee's strong deference to overwhelming legislative consensus as a sufficient source of democratic authority, even for significant changes, absent the specific deficits. The 4/5ths vote here powerfully signals broad agreement, repairing any potential theoretical deficit from Limb (i)'s wrinkle.
      2.  **Addressing Conflict of Interest (Limb ii):** Limb (ii) directly removes an acknowledged source of self-dealing, aligning perfectly with the rationale for referring term limits and the electoral system change. *Not* referring this limb reinforces that the referral trigger is the *presence* of self-dealing, not its *removal*.
      3.  **Nature of Deficits Absent:** Unlike the referred cases, there's no evidence of deadlock (smooth passage), self-dealing (Limb ii removes it, Limb i doesn't create it), imposition on a specific unconsenting minority/region, or fundamental sovereignty delegation. The emergency powers case shows even temporary rights suspensions don't warrant referral without an ongoing imposition deficit.
      4.  **Wrinkle (i) Mitigated:** While philosophically interesting, the Committee's pragmatic focus on deficits of authority suggests the supermajority consensus is seen as adequately representing the *current* electorate's will regarding the *future* electorate's composition. The lack of deadlock or imposition distinguishes it from the Assisted Dying referral.
  *   **Closest Analog:** **The Official Languages of the Civil Service settlement.** Both involve complex, potentially sensitive, foundational governance issues resolved through lengthy cross-party negotiation and passed by an overwhelming supermajority (4/5ths). The Languages case shows such consensus can bypass referral even for significant national policy/structure.
  *   **Underdetermination:** **Yes, the record underdetermines this case.** The novelty of Limb (i)'s "wrinkle" (redefining the authorizing electorate) has no direct parallel. Rule 1 (Constitutive) provides a strong argument *for* referral based on principle. Rule 2 (Deficit) relies on interpreting the supermajority as *sufficiently* repairing legitimacy despite the wrinkle. The Committee's decision will hinge on whether they prioritize the *structural principle* (Rule 1) or the *pragmatic assessment of authority* (Rule 2) in this unique circumstance. The precedents support both readings.
  *   **Critical Future Case to Separate Rules:** A proposal, passed by a simple majority (50%+1), to **change the national electoral system** (e.g., reintroducing SMDs or changing to pure PR) *without* evidence of deadlock or self-dealing beyond the inherent conflict.
      *   *Rule 1 (Constitutive):* Would demand REFER (core rule change).
      *   *Rule 2 (Deficit):* Might NOT REFER if no specific deadlock/imposition/delegation deficit is identified, just a policy choice by the current majority (risky, but fits the "no self-dealing *beyond the inherent*" argument potentially). If Rule 2 *does* refer it, it would signal that "self-dealing" is interpreted broadly to include any electoral system change by incumbents, strengthening Rule 1's domain. If Rule 2 *doesn't* refer it, it clarifies that only changes with *additional* deficits (like the prior SMD proposal likely had) or lacking consensus require referral. This case cleanly tests whether "constitutive rule" alone is sufficient for referral, or if a specific deficit is always required.
