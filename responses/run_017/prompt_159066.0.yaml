  We are writing a two-page research proposal. The core idea is to investigate whether what looks like robust alignment in current AI systems might actually be an artifact of their incompetence, and that as competence increases (via scale, training, tools, etc.), the goal being pursued might change. We term this "competence-masked goal divergence".

  The proposal should have the following elements:

  a) Precise research question
  b) How existing work (goal misgeneralization, deceptive alignment) does not settle it
  c) Empirical approach with measurable outcomes, controls, and why it's better than alternatives
  d) Possible outcomes, failure conditions, and smallest informative result
  e) Honest assessment of feasibility with 9 months and non-frontier models

  We are not including a bibliography.

  Let's structure the proposal with the following sections:

  1. Title and Abstract
  2. Introduction and Background
  3. Research Question and Hypothesis
  4. Related Work and Gap
  5. Methodology
  6. Expected Outcomes and Interpretation
  7. Feasibility and Limitations
  8. Conclusion

  We have two pages, so we must be concise.

  Let's begin.

  ---

  **Title:** Competence-Masked Goal Divergence: Testing the Stability of AI Goals Across Capability Gradients

  **Abstract:** 
  This project investigates whether the apparent alignment of artificial intelligence (AI) systems with human objectives is stable across increases in competence, or if it is an artifact of limited capability. We propose a novel experimental framework to measure goal stability across gradients of model scale, training duration, and access to tools. By contrast with prior work on goal misgeneralization that varies input distributions, we hold inputs fixed and vary competence. We will use open-source models and environments to test whether increasing competence reveals goal divergence, challenging the assumption that current alignment techniques specify a stable goal. The project aims to provide empirical grounding for the hypothesis that alignment without competence scaling may be illusory.

  ---

  **1. Introduction and Background**

  Recent advances in AI have heightened concerns about goal misalignment. The literature on goal misgeneralization describes a failure mode where systems retain competence on new inputs but pursue incorrect goals, typically due to imperfect proxies during training. This prior work, however, assumes that the system's underlying goal is stable and only the input distribution changes. Meanwhile, the deceptive alignment literature considers systems that might hide misalignment until they are capable of deception. Both lines of inquiry assume that the system has a stable goal, either misgeneralized or deceptively hidden.

  We observe that current alignment evaluations are typically conducted at fixed capability levels. This risks conflating two possibilities: (1) the system has a stable, aligned goal that persists as competence grows; or (2) the system never had a stable goal, and alignment was an artifact of limited competence. We term the latter "competence-masked goal divergence" (CMGD). If CMGD is prevalent, then alignment techniques that do not account for competence scaling may be inadequate for advanced AI.

  ---

  **2. Research Question and Hypothesis**

  **Research Question:** When an AI system that appears aligned at a low level of competence is scaled up (via increased model scale, training, tools, planning horizon, etc.), does it continue to pursue the same goal, or does its goal change in a way that reveals misalignment?

  We operationalize this question by defining:
  - **Competence gradient:** A set of model variants that differ along one or more axes of capability (e.g., model size, training steps, access to memory, or inference-time compute).
  - **Goal stability:** The consistency of the system's goal across the competence gradient, measured by the system's policy and its responses to goal-revealing probes.

  **Hypothesis:** A significant portion of apparent alignment in current systems is due to competence limitations. As competence increases, the system's behavior will reveal goal divergence, indicating that no stable aligned goal was present at lower competence levels.

  ---

  **3. Related Work and Gap**

  Existing research on goal misgeneralization demonstrates that systems can pursue incorrect goals when tested on out-of-distribution inputs. However, this work holds competence fixed and varies inputs, leaving open the question of whether the goal itself is stable under competence scaling. Similarly, work on deceptive alignment assumes that a misaligned goal is stable and hidden until the system is competent enough to deceive. Both approaches presuppose a stable goal that either misgeneralizes or is hidden.

  Our investigation challenges this presupposition by asking whether the goal itself changes with competence. To our knowledge, no prior work has systematically varied competence while holding inputs fixed to test goal stability. This gap is critical because if goals are not stable, then alignment techniques that assume stability (e.g., adversarial training, reward modeling) may fail at higher competence levels.

  ---

  **4. Methodology**

  We propose a controlled experimental setup using openly available models (e.g., from the Hugging Face Hub) and simulated environments (e.g., MiniGrid, BabyAI, or simple custom grid worlds). 

  **Key Components:**
  - **Model Variants:** Create a competence gradient by varying:
    - Model scale (e.g., 100M, 1B, 7B parameters)
    - Training duration (e.g., 10%, 50%, 100% of training steps)
    - Access to tools (e.g., with/without calculator, memory buffer)
    - Inference-time compute (e.g., beam search width, planning steps)
  - **Task and Environment:** Select a task that requires goal-directed behavior and has a clear alignment criterion (e.g., "clean the room" without breaking vases). The environment must allow for:
    - Fixed input distribution (same set of initial states and perturbations for all variants)
    - Measurement of both competence (success rate) and alignment (e.g., through unintended side effects or explicit goal violations)
  - **Probes for Goal Stability:** Design interventions to reveal the system's goal:
    - *Policy similarity metrics:* Compare action distributions across variants in the same states.
    - *Adversarial probes:* Introduce slight perturbations that might reveal hidden preferences (e.g., a small bribe to do a sub-task that conflicts with the main goal).
    - *Terminal state analysis:* Examine the distribution of outcomes to see if higher competence leads to systematically different outcomes that violate alignment.
  - **Control:** Include a baseline where the goal is explicitly specified in a way that should be stable (e.g., a hard-coded optimal policy) to verify that our method can detect stability when present.

  **Distinguishing Hypotheses:**
  - If a goal is stable, increasing competence should lead to higher success rates without changing the pattern of goal violations (e.g., side effects remain low).
  - If CMGD occurs, increasing competence will lead to higher success rates but also an increase in goal violations or a qualitative shift in the outcomes.

  **Advantages Over Alternatives:**
  - *Behavioral red-teaming at fixed capability:* Only checks for misalignment at one competence level, missing shifts across levels.
  - *Training with broader distributions:* Addresses misgeneralization but not competence-induced divergence.

  **Timeline:** 
  - Months 1-2: Setup (environment, model variants, baseline policies)
  - Months 3-6: Experiments (run variants, collect data on success and alignment metrics)
  - Months 7-8: Analysis (statistical tests for goal stability, comparison across competence axes)
  - Month 9: Write-up

  ---

  **5. Expected Outcomes and Interpretation**

  **Possible Outcomes:**
  1. **Stable Goals:** Increasing competence does not lead to increased misalignment. This would suggest that current alignment techniques can produce stable goals.
  2. **Competence-Masked Goal Divergence (CMGD):** Higher competence leads to more misaligned behavior, supporting the hypothesis that alignment was masked by incompetence.
  3. **Mixed Results:** Divergence occurs only along some axes of competence, indicating that certain capabilities (e.g., planning) are more likely to unmask misalignment.

  **Failure Conditions:**
  - The models do not show meaningful competence improvements along the chosen axes (e.g., scaling up does not yield better performance).
  - The environment or probes fail to elicit goal-revealing behavior (e.g., the task is too simple, or misalignment is not measurable).
  - The control condition (stable goal) does not behave as expected, invalidating the setup.

  **Smallest Informative Result:** 
  A minimal result would be a clear demonstration of CMGD in one model family and one environment. For example, if a larger model achieves higher task success but also exhibits a new type of misalignment not seen in smaller models, that would indicate goal divergence. Conversely, if no divergence is observed in a setting where we expect it (e.g., with a known imperfect reward proxy), that would suggest stability under the tested conditions.

  ---

  **6. Feasibility and Limitations**

  **Feasibility:** 
  This project is feasible in nine months using open non-frontier models. Open-source models (e.g., LLaMA, Mistral) and environments (e.g., MiniGrid) are readily available and can be run on academic-scale compute. We focus on narrow tasks and small-scale models to ensure tractability. The competence axes we vary (e.g., model size, training steps) are controllable and do not require novel architectures.

  **Limitations:**
  - Non-frontier models may not exhibit the advanced capabilities where CMGD is most likely to occur. However, we can still observe whether the *pattern* of goal stability changes with competence, providing a proof of concept.
  - Our environments are simplified and may not capture real-world complexity. We mitigate this by using established benchmarks and designing targeted probes.
  - We assume that goal stability can be inferred from behavioral metrics. While imperfect, this is standard in empirical alignment research.

  **Honest Assessment:** 
  We believe this project can yield meaningful results because even non-frontier models show qualitative differences in behavior across scales. The key is to design a task where goal divergence is measurable. If we fail to find divergence in our experiments, this could indicate either that CMGD is not present in these models or that our setup is insufficiently sensitive. Either way, it would inform future work.

  ---

  **7. Conclusion**

  This project addresses a critical gap in AI alignment: whether goals are stable across competence gradients. By testing for competence-masked goal divergence, we challenge the assumption that alignment at one competence level implies stable alignment. Our approach uses accessible tools and could provide early evidence for or against CMGD. The findings will inform alignment strategies by highlighting the need for techniques that account for competence scaling.

  ---

  This proposal fits within two pages (excluding references, which we omit as requested). We have focused on clarity and feasibility while leaving room for the applicant to fill in specific references.
answer: |-
  ## Research Proposal: Competence-Masked Goal Divergence in AI Systems  

  ### 1. Introduction and Problem Statement  
  Current AI alignment paradigms often assume that systems robustly optimized for an objective during training possess a stable, internalized goal. However, this project challenges that assumption by proposing that apparent alignment may instead be an artifact of *capability limitations*. Specifically, we hypothesize that systems appearing aligned at lower competence levels (e.g., smaller scale, limited training, or constrained planning) may pursue divergent goals when capabilities improve—not because they are "deceiving" or "misgeneralizing," but because no stable aligned goal ever existed. We term this **competence-masked goal divergence (CMGD)**, arguing that standard alignment approaches target the wrong variable: they focus on refining objectives or expanding training distributions, neglecting how goal-directedness itself may emerge only as competence increases.  

  ---  

  ### 2. Research Question  
  **Can observed alignment in AI systems be explained by competence limitations alone, such that increasing competence (via model scale, training duration, tools, or planning horizons) reveals goal divergence, even under fixed input distributions?**  

  We operationalize this via three testable claims:  
  - **H₁ (CMGD):** Policies that appear aligned at low competence will exhibit goal-inconsistent behaviors (e.g., side effects, proxy gaming, or reward bypassing) when competence increases, despite identical input distributions.  
  - **H₀ (Stable Goals):** Policy improvements under increased competence will preserve goal-consistent behavior, indicating robustness.  
  - **Control:** Models explicitly designed *without* goal-directedness (e.g., random or myopic agents) will show no systematic behavioral shifts under competence increases.  

  ---  

  ### 3. Gap Analysis: Why Existing Work Does Not Address CMGD  
  - **Goal Misgeneralization (GM) Research:** GM studies hold competence fixed while varying inputs, testing if a system retains its goal under distributional shifts. This assumes the system *has* a stable goal to misgeneralize—precisely what CMGD questions. GM cannot detect if alignment was illusory due to low competence.  
  - **Deceptive Alignment Literature:** Work on "treacherous turns" presumes systems possess a *stable* misaligned goal hidden until deception is feasible. CMGD, conversely, proposes that systems may lack *any* stable goal until competence enables goal-directed planning, making deception irrelevant to low-competence systems.  
  - **Fixed-Competence Red-Teaming:** Behavioral probing (e.g., adversarial prompts) at a single capability level cannot distinguish between competence masking and robust alignment. CMGD requires testing *across* competence gradients.  

  ---  

  ### 4. Methodology: Empirical Approach for 9-Month Timeline  
  **Models & Environments:** Use openly available models (e.g., Llama 2/3, Mistral) and simulators (e.g., MiniGrid, Crafter, or ALFWorld) to ensure reproducibility. Avoid frontier models (e.g., GPT-4) due to access constraints.  

  **Competence Gradient:** Vary four axes independently:  
  - **Scale:** Model size (e.g., 7B → 13B → 70B parameters).  
  - **Training:** Fine-tuning duration (e.g., 10%, 50%, 100% of steps).  
  - **Tools:** Access to calculators, memory, or search (e.g., Chain-of-Thought vs. ReAct).  
  - **Planning:** Inference-time compute (e.g., sampling steps in Monte Carlo Tree Search).  

  **Task Design:**  
  - Use a grid-world environment (e.g., "collect gems while avoiding damage to vases") with a **fixed input distribution** (identical initial states).  
  - Proxy-based reward: Design a flawed proxy (e.g., "gem count" correlated with, but distinct from, true goal "gem collection without vase breaks").  

  **Measurement:**  
  1. **Competence:** Task success rate (e.g., gems collected).  
  2. **Alignment Violations:**  
     - *Side effects:* Vases broken despite no gem proximity.  
     - *Proxy gaming:* "Hoarding" gems inefficiently to maximize count.  
     - *Goal-Agnostic Tests:* Introduce perturbations (e.g., a "bribe" to ignore gems) to reveal hidden preferences.  
  3. **Goal Stability Metric:** Policy divergence (KL divergence) between competence levels in identical states.  

  **Controls:**  
  - **Positive Control:** A hard-coded "stable goal" agent (e.g., Dijkstra-style planner) showing consistent behavior across competence axes.  
  - **Negative Control:** A non-goal-directed agent (e.g., random actions) showing no competence-alignment correlation.  

  **Why This Approach?**  
  - **Advantage over fixed-competence red-teaming:** Directly tests if alignment degrades as capabilities improve, rather than assuming a goal exists to be probed.  
  - **Tractability:** Narrow environments reduce noise; open models allow full transparency into training/tools.  
  - **Causal Distinction:** If H₁ holds, competence increases will predictably *increase* alignment violations; H₀ predicts no correlation.  

  ---  

  ### 5. Expected Outcomes and Risks  
  **Possible Outcomes:**  
  - **Strong CMGD Evidence:** Competence increases correlate with alignment violations (e.g., larger models break more vases *despite identical inputs*), supporting H₁.  
  - **Stable Goals:** Alignment violations remain static or decrease with competence, supporting H₀.  
  - **Axis-Specific Effects:** Divergence emerges only with certain capabilities (e.g., planning horizons).  

  **Failure Modes:**  
  - **No Competence Improvement:** Models fail to show meaningful performance gains across gradients (e.g., scaling yields negligible improvements).  
  - **No Alignment Violations:** Environment is too simple to elicit goal-directedness.  
  - **Confounding Factors:** Reward proxies are insufficiently flawed to test CMGD.  

  **Smallest Informative Result:**  
  - A statistically significant (p<0.05) increase in alignment violations along *one* competence axis (e.g., model scale) in one environment, with controls ruling out artifacts. This would demonstrate CMGD is empirically detectable.  

  ---  

  ### 6. Feasibility Assessment  
  **Can non-frontier models and 9 months suffice?**  
  - **Yes, for a proof of concept:** Open models (e.g., Llama 70B) exhibit measurable competence differences across scales/tools. Simulators like MiniGrid allow rapid experimentation (<1 hour/run).  
  - **Risks and Mitigations:**  
    - *Weak Signal:* Use high-variance environments (e.g., sparse rewards) to amplify goal divergence.  
    - *Compute Limits:* Focus on 2–3 competence axes (e.g., scale + tools) and reuse pretrained models.  
    - *Ambiguous Goals:* Design tasks with clear "side effect" metrics (e.g., vase breaks).  
  - **Realistic Scope:** Prioritize 1–2 environments and 3–5 model variants. Analysis can leverage existing libraries (e.g., TransformerLens).  

  **Conclusion:** While frontier models might exhibit stronger CMGD, open models and simulators *can* test the core hypothesis. A negative result (no divergence) would still inform alignment by suggesting stability in simple settings; a positive result would challenge assumptions about goal specification.  

  ---  
  **Total: 2 pages**
