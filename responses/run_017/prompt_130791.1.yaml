  Therefore, the lesson for the journalist's column is: Deferring to the number is usually right, but it becomes a trap when you have new, relevant information that the chance number does not (and could not) account for. In such cases, you should use the updated probability that incorporates that new information.
answer: |-
  ### The Case: Hospital Discharge Decision  
  **Setting:** A hospital discharge committee must decide whether to release a patient recovering from a transient ischemic attack (TIA). The patient has been stable for 24 hours. If discharged, the patient faces a risk of stroke within the next week; if kept, the hospital incurs $10,000 in unnecessary costs. The committee uses two risk scores:  
  - **Handed-down number (Model M):** At 8:00 AM, an algorithmic model processes the patient’s overnight vitals and outputs a **5% objective chance** of stroke within 7 days. This is the true chance at 8:00 AM, derived from a validated causal model of TIA progression.  
  - **Rival number (Clinical Desk D):** At 10:00 AM, the desk—staffed by neurologists—reviews the same data plus a **real-time electroencephalogram (EEG)** stream (noisy, low-resolution brain activity data). They output a **10% probability** of stroke, calibrated from 1,000 past cases.  

  The EEG shows anomalous theta waves, a known stroke precursor. The model *cannot* incorporate real-time EEG because it runs on static overnight data. The desk’s disagreement stems *only* from the EEG readout.  

  ### Why the Desk Wins  
  **Admissibility clause (Lewis's Principal Principle):**  
  > *Credence in A should be x if the chance of A is x, **unless** you possess "inadmissible" information—i.e., information about A’s truth that is not screened off by the chance at t₀.*  

  - **Credence if deferring to Model M:** 5% (ignores EEG).  
  - **Credence if deferring to Desk D:** 10% (incorporates EEG).  
  **The rational bet:** At 10:00 AM, you are offered a wager:  
  - *Bet 1:* Pay $0.05 to win $1 if stroke occurs (expected value = 0 at 5% chance).  
  - *Bet 2:* Pay $0.10 to win $1 if stroke occurs (expected value = 0 at 10% chance).  
  Desk D’s 10% is better because the EEG reveals a deterioration since 8:00 AM. Betting at 5% would lose money: the *actual* post-EEG stroke risk is 10%, making Bet 1’s expected value -$0.05. Desk D’s number maximizes expected utility.  

  ### Why the Desk’s Edge Isn’t "Better Evidence"  
  The EEG is **inadmissible information** relative to the 8:00 AM chance:  
  - It is a noisy, non-predictive measurement *of the present state* (brain activity at 10:00 AM), not future outcomes.  
  - It is not "better" in the scoring-rule sense: Model M is perfectly accurate *for the 8:00 AM chance*. Desk D wins solely by using a **later, noisily measured state** that the chance at t₀ doesn’t screen off.  

  ### The Single Gap-Opening Feature  
  **Temporal delay between chance assessment and decision.**  
  - At 8:00 AM, 5% was the true chance. By 10:00 AM, the patient’s state evolved. The EEG detects this evolution.  
  - **Delete this feature:** If the decision occurred *at 8:00 AM* (no delay), the EEG wouldn’t exist. Desk D would have no basis to dispute Model M, and deference to 5% would be correct.  

  ### Strongest Reply from Chance Deferrers  
  **Reply:** "The EEG is inadmissible, so the Principal Principle *permits* overriding the chance. This doesn’t violate careful deference—it follows the rule."  
  - **Why it’s more interesting than "that’s what inadmissible means":** It forces a confrontation with **operational realism**. In practice, "admissibility" is judged by whether information *feels* like direct evidence of the outcome (e.g., a partial vote count). Here, the EEG is merely a fuzzy state measurement—the kind often dismissed as "already factored into chances." The case shows that even mundane state updates break deference if the chance is stale.  

  ### Conclusion: What the Case Shows  
  **The careful Principal Principle survives; the bumper-sticker version burns.**  
  - The case confirms that deference to objective chances is correct *when paired with all admissible information*.  
  - **The trap:** Institutions often present chances as "the final word," ignoring that **staleness converts admissible state data into inadmissible evidence**. The desk wins by recognizing that *all post-chance information is inadmissible by default* if the world changes.  
  - **Lesson for practitioners:** Defer to chances *only after confirming no relevant state changes occurred*. If time passes, distrust the number—even if it was perfect when issued.  

  ---  
  **Final note:** This case is a "near-miss" for hardcore chance deference. It exposes that the real world rarely offers static chances—and that competent users *must* override them with boring, time-sensitive readouts. No demons needed.
