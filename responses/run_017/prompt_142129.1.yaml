answer: |-
  ### Scenario
  Two property developers, Alpha and Beta, vie for a prime urban lot. Alpha exercises a purchase option first, paying a non-refundable $2M deposit and signing binding contracts (deep commitment). Beta then announces plans for a nearby high-rise that would block sunlight to Alpha's planned luxury condos, causing immediate pre-sale cancellations. Beta's announcement is shallow—retractable via a press release—but the reputational damage and buyer distrust cannot be undone. Alpha abandons the project, forfeiting the deposit. Beta buys the lot and develops as planned.

  ### Demonstration
  - **Payoffs**:  
    Alpha's ranking:  
    1. Alpha buys land, Beta no action → builds condos (+$10M profit).  
    2. Neither acts → status quo ($0).  
    3. Alpha commits, Beta announces → Alpha backs out (-$2M loss).  
    4. Beta buys land alone → Alpha excluded ($0).  
    Beta's ranking:  
    1. Beta buys land alone → builds high-rise (+$8M).  
    2. Alpha commits, Beta announces → Beta buys land after Alpha exits (+$6M after costs).  
    3. Neither acts → status quo ($0).  
    4. Alpha buys land, Beta no action → Beta excluded ($0).  
  - **Timing**:  
    t0: Both consider options.  
    t1: Alpha exercises option (deep commitment).  
    t2: Beta announces high-rise (shallow commitment).  
    t3: Alpha backs out; Beta exercises option.  
  - **Why shallow commitment binds**: Beta’s announcement triggers irreversible market damage (pre-sale collapse) despite being cheap to retract. Alpha’s deep commitment becomes unviable due to restoration costs (buyer trust cannot be rebuilt quickly).  
  - **Load-bearing feature**: High restoration lag/cost of market perception. Beta’s action destroys intangible asset value faster than Alpha can recover it.  
  - **Ablation**: If market damage were instantly reversible (e.g., buyers return after retraction), Alpha would build and win (+$10M).  

  ### Best Objection and Reply  
  - **Objection**: "Alpha could ignore Beta’s announcement and build anyway, minimizing losses."  
