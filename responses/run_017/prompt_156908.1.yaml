  First, I need to unpack the core positions. The generalists see conspiracy theories as having structural epistemic flaws - opposition to official narratives, self-sealing mechanisms, and requiring improbable silence from many people. The particularists argue each theory should be evaluated individually as empirical claims, with the "conspiracy theory" label being a sociological accident. 

  For the agreed claims section, I can build on points both sides would accept: the mathematical relationship between conspirator numbers and credibility, information contamination in intelligence contexts, and the fact that any theory (official or alternative) can exhibit self-sealing structures. These are substantive yet neutral enough for both parties. 

  The disagreements table requires careful phrasing to avoid strawmen. Key differences lie in whether conspiratorial structure inherently shifts evidential burdens, and whether the label "conspiracy theory" carries epistemic content beyond its literal meaning. I'll use each side's actual terminology - "epistemic markers" for generalists, "sociological descriptor" for particularists.

  The cruxes are the most crucial part. For the vindication audit, generalists would predict most now-accepted conspiracies would've failed their criteria initially, while particularists would predict they'd pass. The bounty institution test probes whether distrust is environmental or structural - generalists would claim minimal shift, particularists significant. Decomposition forces clarity on what's being evaluated: generalists see the composite story as inseparable, particularists argue for separable mechanism claims. Leakiness examines institutional credibility - generalists see internal checks as legitimate boosts, particularists view this as status quo bias.

  Finally, the verbal disputes center on terminology. Both sides likely agree that "conspiracy theory" is often used pejoratively, but disagree on whether this affects epistemic evaluation. The "official story" definition is similarly contested but doesn't impact their core epistemic disagreement.

  Throughout, I'll maintain strict neutrality, avoid academic citations per request, and ensure each section meets the word count while preserving substantive disagreements. The goal is a document where both scholars can recognize their views without compromise, while clarifying the precise points of contention for workshop discussion.
answer: |-
  ## Joint Statement on the Epistemology of Conspiracy Theories: Draft for Mediation

  **Agreed Claims: Foundational Mechanics**

  1.  **Credibility and Scale/Silence:** The credibility of *any* account positing a coordinated, hidden action by multiple actors is inversely related to (a) the number of participants required to maintain secrecy, (b) the duration over which secrecy must be maintained, and (c) the incentive structures (e.g., risk of exposure, potential benefits) facing participants. This relationship is probabilistic and non-linear; smaller conspiracies involving fewer actors over shorter durations are generally more plausible *ceteris paribus* than vast, decades-long plots involving thousands.
  2.  **Information Environment & Contamination:** Evaluating claims about hidden coordination occurs within complex information environments characterized by deliberate manipulation ("contamination"). This includes:
      *   *Active Deception:* Interested parties (including state/non-state actors) may seed false information (disinformation) to discredit true claims *or* fabricate false confirmation (misinformation) to support false claims.
      *   *Error Amplification:* This environment systematically increases the base rate of both false positives (believing a conspiracy exists when it doesn't) and false negatives (failing to believe a conspiracy exists when it does) for observers relying on available evidence.
      *   *Source Ambiguity:* Determining the provenance and motive behind leaked or discovered information is often intrinsically difficult, adding significant epistemic noise.
  3.  **Theory Structure - Self-Sealing/Expansion:** A formal property exists whereby a theory becomes resistant to counter-evidence by systematically reinterpreting that evidence as *further proof* of the conspiracy's power, reach, or cleverness ("self-sealing"). A related property involves the *ad hoc* expansion of the conspiracy's scope (actors, motives, methods) to absorb inconsistencies ("expansion"). Crucially:
      *   This structural property is **content-neutral.** It can characterize *both* theories labeled "conspiracy theories" *and* theories often considered "official accounts" or mainstream explanations.
      *   Possessing this structure is an *epistemic liability* for a theory, making it less falsifiable and demanding a higher evidential threshold.

  **Residual Disagreements: Core Philosophical Differences**

  | Disagreement Area              | Generalist Position (as they would phrase it)                                                                 | Particularist Position (as they would phrase it)                                                                 |
  | :----------------------------- | :------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------- |
  | **1. Distinctive Epistemic Status** | Conspiracy theories, *as a recognizable class*, exhibit characteristic epistemic markers (opposition to institutional narratives, proneness to self-sealing/expansion, reliance on distrust) that necessitate a distinctively cautious epistemic stance and a shifted burden of proof *in addition to* assessing specific evidence. | Conspiracy theories lack inherent epistemic properties beyond the specific empirical claims they make. Alleged "markers" are either artifacts of sociological labeling or features that can (and do) apply to any complex causal claim, including institutional ones. Evaluation is solely case-by-case against rival hypotheses. |
  | **2. Role of "Official Story"**     | The existence of a widely accepted institutional account ("official story") is a constitutive feature of a conspiracy theory; the theory defines itself *in opposition* to this account, shaping its evidence-gathering and reasoning patterns. | "Official story" is a fluid, context-dependent designation. Opposition to an institutional account is neither necessary nor sufficient to define a conspiracy theory. Many true conspiracies *are* the official story until exposed. Focus should be on the *rival empirical claims*, not their institutional alignment. |
  | **3. Burden of Proof & Distrust**   | The structural features common to conspiracy theories (scale/silence requirements, self-sealing potential) generate a *prima facie* warrant for heightened skepticism and place a justificatory burden on proponents *beyond* that required for non-conspiratorial explanations of the same event. | Skepticism should be proportional to the *specific* empirical challenges of the claim (e.g., number of actors needing silence), not the label "conspiracy theory." The burden of proof lies equally on all parties making factual claims about an event. Attributing a "distinctive distrust" risks prejudicial dismissal. |
  | **4. Semantic Load of "CT" Label** | The phrase "conspiracy theory" legitimately carries epistemic content, signaling the presence of the structural features noted in Agreed Claim #3, which warrant specific critical attention. Its pejorative use often stems from recognizing these liabilities. | The phrase "conspiracy theory" is overwhelmingly a rhetorical and sociological tool of dismissal, lacking consistent epistemic meaning. Its application is often arbitrary and politically motivated, obscuring rational assessment of the underlying claim. |

  **Cruxes: Predictions and Resolvability**

  1.  **Vindication Audit:** *Examine historically confirmed conspiracies (e.g., Watergate, Tuskegee, Iran-Contra) using only evidence plausibly available to a careful contemporary observer. Would they have triggered the Generalist's structural markers (opposition, self-sealing, large scale/silence)?*
      *   **Generalist Prediction:** Most confirmed conspiracies *would* have triggered these markers at the time. They *were* opposed to official narratives, *did* require significant silence, and *were* often dismissed using reasoning similar to ours. This shows the markers identify genuine epistemic risks, but risks that can sometimes be overcome by strong evidence. The heuristic is reliable but imperfect; some true conspiracies will resemble paradigmatic defective ones initially.
      *   **Particularist Prediction:** Many confirmed conspiracies *would not* have exhibited strong forms of the problematic markers early on, or would have exhibited them no more than institutional denials did. Their initial dismissal was often due to institutional power suppressing evidence or analysis, not inherent structural flaws. This weakens the claim that the Generalist markers reliably signal epistemic defectiveness distinct from other complex claims.
      *   **Resolvability:** Both sides would accept a rigorous historical study as highly relevant. Agreement on the *results* might shift views on the *reliability* and *scope* of the Generalist markers. The Generalist might concede the heuristic is blunter, the Particularist might concede some structural patterns are meaningfully common.

  2.  **Bounty Institution:** *Assume a state with robust, anonymous whistleblower rewards, legal protections, and strict automatic declassification (e.g., all documents public after 15 years). Does this significantly alter the Generalist's distinctive distrust of conspiracy theories?*
      *   **Generalist Prediction:** Distrust would decrease *moderately* but *not disappear*. While reducing secrecy duration and increasing leak likelihood lowers the barrier, the *structural features* (need for coordination/secrecy, inherent potential for self-sealing/expansion) remain epistemic challenges demanding careful scrutiny. The information environment improves, but the core nature of the claims still warrants a distinctively cautious approach.
      *   **Particularist Prediction:** Distrust should decrease *significantly and fundamentally*. The primary epistemic barrier identified (improbable large-scale/long-term secrecy) is drastically reduced by the institution. Remaining skepticism would be akin to that for any complex historical claim, negating the need for "distinctive" distrust aimed at conspiracy theories as a class.
      *   **Resolvability:** Both sides would accept the outcome as probative. A significant shift in Generalist stance would support the Particularist view that distrust is primarily environmental. Minimal shift would support the Generalist view that structural features are inherently challenging regardless of environment.

  3.  **Decomposition:** *Is the core epistemic object the minimal mechanism claim ("Actor(s) X secretly coordinated to achieve Y") or the full composite narrative (including motives, methods, scope, cover-up)?*
      *   **Generalist Stance:** Assessment must focus on the *full composite narrative*. The minimal mechanism is often plausible *in isolation*, but the epistemic burdens arise precisely from the *additional claims* about scope, secrecy maintenance, motive, and the rejection of alternatives that make up the "theory." The self-sealing/expansion dynamics apply to the composite.
      *   **Particularist Stance:** Epistemic assessment should rigorously separate the minimal mechanism claim from auxiliary hypotheses. Establishing *that* a conspiracy occurred is distinct (and often simpler evidentially) from establishing *its full extent, motives, or methods*. Conflating them allows dismissal of the core claim based on flaws in auxiliary (and potentially revisable) elements.
      *   **Resolvability:** This is a fundamental methodological disagreement unlikely to be resolved by the other cruxes alone. Agreement might be possible that *both* levels require assessment, but the core dispute over *which level carries the distinctive epistemic weight* would likely persist. It underpins their differing views on burden of proof.

  4.  **Leakiness/Internal Accountability:** *Do the internal checks and balances within institutions (e.g., courts, inspectors general, rival factions, investigative journalism) grant their official accounts a legitimate default credibility boost over opposing conspiracy theories?*
      *   **Generalist Prediction:** Yes. Functional internal accountability mechanisms (even if imperfect) provide *some* warrant for trusting institutional outputs *absent specific evidence of their failure or capture in a given case*. This creates a justifiable asymmetry; the conspiracy theory, lacking such mechanisms, bears the burden of overcoming this default credibility.
      *   **Particularist Prediction:** No. Treating internal mechanisms as conferring default credibility is unwarranted deference to institutional power. These mechanisms often fail spectacularly, and their existence doesn't preclude systemic corruption or capture. Credibility must be earned by *all* claims based on evidence, not granted based on institutional status.
      *   **Resolvability:** Both sides would accept evidence on the track record of specific accountability mechanisms. Agreement might be possible that *functional* mechanisms provide *some* evidence of reliability *for specific claims they vet*, but the Particularist would reject this as a *general* boost for "official stories," while the Generalist sees it as a defeasible baseline.

  **Verbal/Sociological vs. Substantive Disputes**

  1.  **"Conspiracy Theory" as Label:** A significant portion of the disagreement *is* verbal/sociological concerning the **connotations and appropriate usage** of the phrase "conspiracy theory." Both sides likely agree:
      *   The phrase is frequently used pejoratively as a dismissal.
      *   This pejorative use is often socio-politically motivated.
      *   The phrase *can* neutrally denote the proposition that a conspiracy occurred.
      *   **Substantive Core:** The disagreement lies in whether the phrase *should also* carry epistemic content signifying the structural features (Agreed Claim #3) that Generalists argue are commonly associated with it. The Particularist sees this as smuggling in the pejorative meaning; the Generalist sees it as describing a real phenomenon.

  2.  **Defining "Official Story":** Disagreement over what constitutes the "official story" (e.g., is it the current government line, the consensus of experts, the outcome of official inquiries?) involves semantics and sociology. **Substantive Core:** The disagreement lies in whether *opposition to an institutional narrative* (however defined) is a relevant epistemic factor shaping the theory's development and reception (Generalist) or merely a contingent sociological fact irrelevant to its truth (Particularist).

  3.  **"Distinctive" vs. "Heightened" Skepticism:** Some disagreement may stem from the degree implied by "distinctive." The Particularist hears it as implying conspiracy theories are *sui generis* irrational; the Generalist means it warrants a *specific pattern* of scrutiny focused on secrecy maintenance and self-sealing potential, which *can* be warranted for non-labeled theories too. Clarifying the **specific epistemic mechanisms** (Agreed Claim #3) that trigger this scrutiny, and acknowledging they can apply elsewhere, reduces verbal dispute.

  **Conclusion:** This statement identifies substantial agreement on the underlying mechanics of evaluating hidden coordination claims (§1). Core disagreements persist regarding the epistemic significance of classifying theories as "conspiracy theories," the role of institutional opposition, burden of proof allocation, and the legitimacy of default institutional credibility (§2). The proposed cruxes (§3) offer concrete pathways to test these disagreements, potentially narrowing them or clarifying their foundations. While semantic and sociological disputes surround the labels (§4), the core philosophical differences concerning epistemic principles and assessment methodologies remain substantive.
