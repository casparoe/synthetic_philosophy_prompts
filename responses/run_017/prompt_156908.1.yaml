  You're a professional philosopher who specialises in social epistemology and who has mediated adversarial collaborations before — please think carefully, and start by brainstorming a page of rough notes before you write anything polished, because what I want is the drafting work itself, not a survey of a debate. I'm co-organising a small workshop on the epistemology of conspiracy theories next spring, and two of the people on the programme have been going back and fourth in print for years and have now, reluctantly, agreed to co-author a single joint document that I have to edit. Call them the generalists and the particularists. The generalists hold that conspiracy theories as a class carry a distinctive epistemic defect: they are partly defined by their opposition to an "official story", they characteristically inflate as they go (each item of contrary evidence gets redescribed as further evidence of the plot's reach), they are often structured so that no evidence anyone could actually acquire would settle them, and they require an expanding circle of people to keep quiet, so a distinctive kind of distrust — or at least a shifted burden of proof — attaches to them over and above whatever the evidence in the particular case happens to be. The particularists hold that a conspiracy theory is nothing but the theory that some event of public interest was brought about by a conspiracy, that it ought to be assessed exactly like any other empirical claim and against its rivals, that the pejorative charge the phrase carries is a sociological accident of who has deployed it and against whom, and that no general claim about the class can survive the existence of conspiracy theories that turned out true after being dismissed for exactly the reasons the generalists give. What I need from you is the document: a joint statement both of them could put their names to.

  Concretely, I want four things in it. (1) A numbered section of agreed claims that is not vacuous — "evidence matters" and "some conspiracy theories are true" are the sort of line that will make me bin the whole thing. I want claims about the mechanics that both sides already accept: that the credibility of a conspiracy account is a function, somehow, of the number of people who would have to stay silent and of how long they'd have to stay silent; that the information environment in which such claims get evaluated is one where interested parties plant both confirming and disconfirming material, so a reader's error rates are pushed up in both directions at once (my friend who works in intelligence studies calls this contamination — call it whatever you want); and that the escalating, self-sealing shape is a formal property of a theory, detachable from its content, so that an official account can have it too. (2) A table of the residual disagreements, each row phrased in words that side would accept for its own view and would not reject as a strawman: the generalist's actual claim is definately not that conspiracy theories are false, and the particularist's is not that we should believe everything. (3) The cruxes, which is where I most need you. I have four candidates — cut or add as you see fit. First, the vindication audit: take a batch of conspiracy theories that are near-universally accepted now and reconstruct, using only what a careful reader had at the time rather than hindsight, whether they would have passed the generalist's own tests then — did they oppose an official account, did they inflate, did they posit many silent participants? If they'd have failed, is that a reductio of the generalist test or just the expected cost of a reliable but blunt heuristic? Both parties agree this study bears on the dispute; I want each side's prediction written down before the result. Second, the bounty institution: imagine a state whose agencies let any insider release documents anonymously with legal protection and a payment, plus automatic declassification of everything after a fixed number of years. Does the generalist's distrust shift under that regime? If it does, the distrust was aimed at the information environment; if it barely moves, it is aimed at the structure of the theories themselves. Third, the decomposition question: is the thing being assessed the full composite story, or only a minimal mechanism claim of the form "these people coordinated on this"? Fourth, leakiness: whether an institution's internal accountability machinery — rival factions, courts, a press with sources, routine leaking — gives its account a default boost that a theory opposed to that account does not get, or whether treating that as a boost is just deference to the status quo. For each crux, give me what each side predicts and whether both would accept the result as moving at least one of them. (4) Finally, tell me which parts of this fight are verbal rather than substantive — my suspicion is that a good deal of it is about whether the phrase "conspiracy theory" is a neutral description or an insult, and about who counts as an "official" source, and that those are disputes about words and about sociology, not about what anybody is warranted in believing.

  Practical notes, sorry this is a big ask: I know this literature reasonably well, so please don't give me a reading list, footnotes, or citations — I can find those myself, and the document has to stand on its own without them. Don't hedge everything into mush, don't resolve the dispute by splitting the difference, and don't tell me both sides are partly right unless you can name exactly which claims. Where you can't find a formulation both would sign, say so and explain what blocks it. Aim for roughly 900–1200 words for the document itself: numbered agreed-claims section first, then the disagreements table, then the cruxes with each side's prediction, then your verdict on which parts are merely verbal.
