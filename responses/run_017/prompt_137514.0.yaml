prompt: |-
  hi — novelist here, not a philosopher, and I'm hoping you can tell me whether something I keep tripping over has a name, because I've had it described to me in a way that doesn't quite match what I'm seeing.

  Twice now I've had the same argument in a workshop about the same scene with one thing changed. Scene A: a hydrologist named Ilse diverts a river to keep a town from washing away. She knows — and says so, in first-person narration, in the scene — that the diversion will silt up a downstream marsh that a neighbouring village lives off. There's no way to save both. The text is explicit that she has no feelings about the marsh either way; she just wants the town dry. My readers come out of it convinced she destroyed the marsh on purpose, that she wanted it gone, and that this is secretly what the chapter is "about." When I add a line where she says out loud that she's sorry about the marsh and wishes there were another way, they read it as insincere, or as a tell.

  Scene B: identical, same sentences, same foresight, same lack of alternatives, except the side effect is good — the diverted water refills a marsh that's been dry for years. She's equally indifferent in the narration. Nobody says she restored the marsh on purpose or wanted to. And here's the bit I actually care about: in B, one line is enough. If she says "I didn't have the marsh in mind at all," readers accept it and stop giving her credit for it. In A, nothing works. I've tryed three drafts. The intentional reading sticks, and every line I add to soften it gets absorbed as further evidence — the denial becomes the proof.

  So far as I can tell that's two things, and I can't tell whether they're one: (1) whether a side effect is bad or good decides whether we hear it as something the character did at all, as opposed to something that just happened; and (2) the bad version is sticky in a way the good version isn't — it resists correction and feeds on it, while the good version evaporates the moment you poke it.

  Someone at a reading waved at "the Knobe effect," but when I looked into it, it seemed to be about what people say when you ask them a direct question in a survey, which isn't quite the same as readers holding onto an interpretation against the plain sense of the text. And (2) — the part where the disclaimer is read as a confession — I can't find anything for at all.

  So: is this one named thing or two? What are the nearest established concepts for each, and how exactly does each differ from what I've described? Does it matter that she had no alternative, that she's stated to be indifferent, that the harm falls on a village rather than a person — i.e. which of those details are load-bearing and which are incidental? If part of it has no name, coin one and define it tightly enough that it doesn't just collapse into the general claim that people are quicker to blame than to praise, and give me a nearby case that would NOT be an instance of it. I don't just want a label — I want the carving, since I'm going to have to make a decision about this scene either way.
reasoning: |-
  Okay, the user is a novelist struggling with a specific reader interpretation issue across two versions of a scene. Let me unpack this carefully. 

  First, the core problem: readers persistently attribute malicious intent to the protagonist Ilse in Scene A (where her action harms a marsh) despite explicit textual evidence to the contrary, while in Scene B (where the side effect is beneficial) they readily accept her stated indifference. The asymmetry is fascinating - negative interpretations stick like glue and even weaponize disclaimers against the character, while positive ones vanish at the slightest contradiction. 

  Hmm, the Knobe effect reference makes sense as a starting point since it deals with asymmetric intent attribution, but the user's already spotted key differences: this isn't survey data but narrative interpretation, and the "disclaimer-as-proof" phenomenon seems distinct. Need to disentangle two mechanisms here: (1) the basic valence-driven intent attribution (Knobe-like) and (2) the extraordinary persistence of negative interpretations against textual counterevidence. 

  For part one, the Knobe effect is absolutely relevant despite the different context. Studies show people judge harmful side effects as more intentional than beneficial ones even under identical scenarios. The cognitive roots run deep - negative outcomes trigger stronger causal reasoning and responsibility assignment. In fiction, this likely amplifies because readers actively hunt for character motivations. Interesting that the marsh being tied to a village (rather than an individual) didn't weaken the effect; collective harm still registers strongly. 

  But part two is where it gets really thorny. That negative interpretations actively consume disclaimers as fuel feels like a distinct psychological phenomenon. Reminds me of belief perseverance and confirmation bias in action: once readers form the "she's malicious" hypothesis, every subsequent detail gets twisted to fit it. Her apology reads as performative, her indifference as coldness - classic motivated reasoning. The positive version lacks this because there's no "crime" to explain away. 

  Wait - the user also asked which details are load-bearing. The lack of alternatives actually strengthens the negative interpretation paradoxically: if she couldn't avoid harming the marsh, readers might subconsciously think she should feel worse about it, making her indifference seem more damning. Whereas in the beneficial case, lack of alternatives makes her indifference more plausible ("it was just luck"). 

  For naming, "Knobe effect" covers the asymmetry in intent attribution well enough for part one. For the disclaimer-absorption effect, "intentionality contagion" might work - negative intent interpretations spread to consume all textual evidence. Could also call it "moral framing persistence." 

  Practically, the user might need to accept that some readers will always suspect Ilse in Scene A - not a flaw in writing but in human cognition. To mitigate: make the tradeoff more physically urgent (collapsing bridge?), show her exhaustion, or have another character defend her choice neutrally. But interestingly, the persistence of the negative reading might actually serve the story by creating productive ambiguity about responsibility...
answer: |-
  This is a brilliant observation of a real, documentable cognitive asymmetry—and you're right that it's related to the Knobe effect but extends beyond it in narratively crucial ways. Let's carve this precisely:

  ### The Two Mechanisms at Play
  1.  **Valence-Driven Intentionality Attribution (The Knobe Core)**
      *   **What it is:** Observers are significantly more likely to judge a foreseen side effect as *intentional* if it is *harmful* than if it is *beneficial*, even when the agent's stated goals and indifference are identical.
      *   **Your Cases:** In Scene A (harm: marsh destroyed), readers insist Ilse *intended* the harm. In Scene B (benefit: marsh restored), readers readily accept she *didn't intend* the benefit. The valence (harm vs. benefit) alone flips the interpretation of intentionality against the textual evidence.
      *   **How it differs from pure survey Knobe:** You're seeing it play out dynamically *within narrative interpretation*, not just in isolated survey judgments. Readers aren't answering a question "Did she intentionally destroy/restore the marsh?"; they are *inferring her motive and the scene's meaning* based on the outcome's valence.
      *   **Load-Bearing Details:**
          *   **Foresight:** Critical. If she didn't foresee it, it couldn't be intentional. Your scenes nail this.
          *   **Valence (Harm/Benefit):** The core driver. Harm triggers intentionality attribution.
          *   **Indifference:** Paradoxically *enables* the effect. Her lack of positive *or* negative feeling about the side effect creates a vacuum filled by the valence. If she actively *desired* the harm, it wouldn't be an effect; if she actively *desired* the benefit, the Knobe asymmetry might lessen. Indifference is key to isolating the valence trigger.
          *   **No Alternative:** Strengthens the Knobe effect. Since she *must* act and the harm is unavoidable, readers feel she "owns" the negative consequence more intensely. ("She chose *this* path knowing *that* would happen, so she *meant* it"). For the benefit, lack of alternatives makes indifference more plausible ("She was just lucky").
          *   **Victim Type (Village):** Less critical than the *presence* of harm. Harm to a collective can still trigger strong intentionality judgments, though harm to a specific, named individual might intensify it slightly via empathy.

  2.  **Negative Intentionality Persistence / Disconfirmation Absorption (The Narrative Amplifier)**
      *   **What it is:** Once a negative intentionality judgment is triggered (via the Knobe mechanism), it becomes highly resistant to disconfirming textual evidence within the narrative. Denials, expressions of regret, or explicit statements of indifference are not merely ignored but are actively reinterpreted as *confirmation* of negative intent (insincerity, guilt, hiding true motives). This resistance and reinterpretive absorption are *not* symmetrically present for positive or neutral interpretations.
      *   **Your Cases:** In Scene A, Ilse's indifference reads as callousness; her apology reads as insincere or performative; any denial becomes a "tell" revealing guilt. Adding lines *strengthens* the negative reading. In Scene B, a simple denial ("I didn't have the marsh in mind") is readily accepted at face value. The positive interpretation is fragile; the negative interpretation is robust and self-reinforcing.
      *   **Why it happens (Cognitive Mechanisms):**
          *   **Motivated Reasoning:** Readers want characters' actions to make psychological sense. A harmful outcome *demands* a motive. "She caused harm *and* doesn't care? She *must* be malicious!" Denials conflict with this satisfying explanation, so they are discounted.
          *   **Confirmation Bias:** Once the "malicious Ilse" hypothesis forms, readers selectively focus on evidence supporting it and reinterpret ambiguous/contradictory evidence to fit.
          *   **Belief Perseverance:** Established beliefs (like "Ilse is malicious") resist change, even when the evidence supporting them is discredited.
          *   **Theory of Mind Overdrive:** Readers are constantly modeling character minds. Negative traits (deceit, hidden motives) are often more narratively compelling and "explain" indifference + harm better than genuine indifference. Her apology becomes part of her *performance*, not evidence against malice.
          *   **Moral Dyad Theory:** Harm triggers a search for a *moral agent* responsible. Ilse is cast in that role, and disclaimers feel like evasion of that responsibility.
      *   **Load-Bearing Details:**
          *   **Presence of Harm:** The essential trigger.
          *   **Agent's Indifference/Denial:** The fuel for reinterpretation. Expressions of regret are *especially* potent fodder for absorption (seen as insincere, guilt-ridden, performative).
          *   **Narrative Context:** The effect is strongest in contexts where psychological realism is expected (like literary fiction). It might be weaker in highly stylized or absurdist genres.
          *   **(Less Critical):** The *specificity* of the denial matters less than its existence. A simple "I didn't mean to" or a complex apology both get absorbed similarly.

  ### Naming the Phenomena

  1.  **Valence-Driven Intentionality Attribution:** This is firmly rooted in the **Knobe Effect**. While originally studied in surveys, its core mechanism (harm -> perceived intentionality) is what drives the *initial, divergent interpretation* in your scenes. We can specify it as the **Narrative Knobe Effect**.
  2.  **Negative Intentionality Persistence / Disconfirmation Absorption:** This is the more novel and narratively crucial observation. I propose **Intentionality Backfire Effect (IBE)**.
      *   **Definition:** In narrative interpretation, once a negative intentionality judgment is formed (often triggered by harmful outcomes + foresight), explicit textual evidence *contradicting* that judgment (denials, stated indifference, regret) is not only discounted but actively reinterpreted as *further evidence supporting* the negative judgment, making it resistant to disconfirmation.
      *   **Nearby Case that is NOT IBE:** Imagine Ilse *actively celebrates* the marsh's destruction in Scene A. Readers believe she intended it. The author adds lines showing she was forced under duress to destroy it and secretly regrets it. Readers *update* their interpretation: she intended it *but* had mitigating reasons. The *intentionality* judgment remains, but the *disconfirming evidence* (her regret, the duress) is *accepted* and *modifies* the interpretation (adding nuance/mitigation), not used to reinforce the original malicious reading. This is belief updating, not backfire.
      *   **Why "Backfire"?** Because the author's attempt to *reduce* the perception of malice (adding the apology) paradoxically *increases* it in the reader's mind. The disclaimer *is* the proof.

  ### How They Work Together in Your Scene

  1.  **Scene A (Harm):** The **Narrative Knobe Effect** triggers the initial judgment: "Harm + Foresight + Indifference = She *intended* it." Then, the **Intentionality Backfire Effect (IBE)** takes over: her apology and any denials are absorbed as proof of insincerity/guilt, *cementing* the malicious reading.
  2.  **Scene B (Benefit):** The **Narrative Knobe Effect** means readers don't initially attribute intentionality: "Benefit + Foresight + Indifference = She *didn't intend* it." There is *no* strong negative intentionality judgment to persist. Therefore, her denial ("I didn't have the marsh in mind") is accepted at face value. There is nothing for disconfirming evidence to "backfire" against. The interpretation remains surface-level and readily updated.

  ### What This Means for Your Scene

  *   **The Problem is Real (and Cognitive):** It's not your writing; it's deeply ingrained reader psychology. You cannot "logic" readers out of the malicious interpretation in Scene A with direct textual statements from Ilse. Those statements become fuel for IBE.
  *   **Strategies to Mitigate (Focus on Scene A):**
      *   **Shift Focus to the Constraint:** Emphasize the *impossibility* and the *urgency* of saving the town. Make the trade-off physically palpable and unavoidable *before* the action. Show the collapsing bridge, the frantic mayor, the rising water gauge. Highlight her professional *duty* to the town she was hired to save.
      *   **Externalize the Indifference/Regret:** Don't have *Ilse* say she's sorry or doesn't care. Have *another character* accuse her of not caring about the marsh village. Have her react with exhaustion or frustration at the *impossibility* ("Do you see another way? Point it out!"). Her focus stays on the *task* (saving the town) and the *lack of options*, not on her feelings about the marsh. Readers are less likely to reinterpret *another* character's words as proof of *Ilse's* hidden malice.
      *   **Show, Don't Tell (the Trade-off):** Instead of stating indifference, show her making the calculation clinically, perhaps referencing hydrological models or past case studies where trade-offs were necessary. Frame it as an engineering necessity, not a moral choice she's detached from. Her professionalism becomes the shield against malice attribution.
      *   **Embrace the Ambiguity (If Useful):** If a *hint* of ambiguity about her true feelings serves the larger story, lean into the Knobe effect *without* triggering full IBE. Keep her internal narration focused purely on the technical problem and the town. Let the *reader's* unease about the marsh exist externally. This makes the moral weight of the decision felt without pinning malice on Ilse.
      *   **Avoid the Apology/Denial Trap:** Resist the urge to have her voice regret or deny malicious intent *in the moment of action or immediately after*. These are IBE kindling. If regret is necessary, place it much later, in a different context, perhaps when seeing the consequences firsthand, where it might read as genuine hindsight rather than a performative disclaimer.

  You've identified a powerful and specific cognitive-narrative mechanism. The Knobe effect sets the trap, and the Intentionality Backfire Effect ensures your character can't easily climb out of it in the reader's mind when harm is done. Understanding this duality is key to navigating the scene effectively.
