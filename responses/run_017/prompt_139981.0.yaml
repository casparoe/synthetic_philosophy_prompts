  Breaking down the supervisor's pattern: she consistently rejects cases where the functional role is externally maintained (technicians, clerk + filing cabinets) or lacks causal integration (population wired together). She accepts non-biological realizers (silicon aliens, gradual replacement) even without behavior (alien with internal-only pain). The inverted qualia and zombie cases confirm she's a hardcore functionalist - mental states equal functional roles.

