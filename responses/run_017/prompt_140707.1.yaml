prompt: |-
  hey — I'm on the board of a small family foundation, maybe 1.5m a year, and we've been going in circles about one program for months. We fund maternal-health logistics in one partner country, and it runs *through* the ministry of health: drugs, cold chain, and a per-diems-for-nurses line. Everyone on the board accepts that a real slice of it leaks — call it 20 to 30 percent — some in ministry procurement, some to a governor who takes a cut of the transport contracts. One trustee has basically ended the argument with an analogy: giving aid through a government like that is like handing a drink to an alcoholic. The state is the addict, the money is the drink, we are the enabler, conditionality is the intervention that never works, and the only honest response is tough love — stop routing anything through state channels, go NGO-only or direct-to-clinic, even if total deliveries drop in the short run.

  I don't trust how tidy it feels, but I can't say exactly where it goes wrong, and I don't want the response to be that the analogy is insulting to people with addiction. Two wrinkles I keep coming back to that I want dealt with and not smoothed over:

  1. In the addiction story the addict and the person harmed by the drinking are the same person. In our case they aren't: the minister and the woman in labour at the district hospital are different people, and the 70 to 80 percent that does arrive apparently still arrives. Does that non-identity break the analogy outright, or does it just relocate it — is it more like handing the alcoholic's *family* money in a way that partly funds the drinking?

  2. A friend flips the mapping. On her version the addict is the donor side: the aid bureaucracy, the contractor ecosystem, our own foundation, which needs a sick, aid-absorbing recipient in order to go on existing, and which quietly prefers a leaky program to no program at all. What happens to the tough-love conclusion if that mapping is the right one? On that reading the withdrawal is something we're supposed to inflict on ourselves, and the analogy stops being a reason to cut and starts being a reason to keep going.

  Deliverables:

  (a) A correspondence table over every element that's doing work in the addiction story — the addict, the drink, the enabler, the disease, tolerance and escalation, withdrawal, recovery, relapse, the intervention, the family, the harm — columns: addiction_element | aid_counterpart | fit (clean / strained / broken / no counterpart at all) | what_the_mapping_silently_adds. Where there's genuinely no counterpart, say so, that's real information.

  (b) A second, shorter table splitting the disanalogies into the ones that are load-bearing for the go-NGO-only conclusion and the ones that are cosmetic. Columns: disanalogy | why_it_matters_here (or just: cosmetic) | what_would_have_to_be_true_for_it_to_stop_mattering.

  (c) A JSON object with these fields, each kept short: verdict_on_analogy, tough_love_survives (yes / no / partly), load_bearing_breakage (list, max 3), smuggled_assumptions (list, max 4), conclusion_actually_licensed, scope_by_channel (one short verdict each for budget support, project aid routed through the ministry, NGO-delivered services, direct cash transfers to households), flipped_mapping_verdict, what_our_board_should_do, confidence (0–1) and biggest_uncertainty. If you change or add field names, say which ones and why.

  Keep it pinned to our case — the 20 to 30 percent leakage, the per-diems, the ministry channel — not to foreign aid in the abstract. And please don't conclude that both sides have a point: tell me where the analogy breaks, and whether the conclusion was riding on the break.
reasoning: |-
  Okay, the user is on the board of a small family foundation dealing with maternal health funding in a partner country. They're stuck in a debate about leakage in their program routed through the ministry of health. One trustee used an addiction analogy to argue for stopping government funding entirely. The user feels the analogy is too tidy and wants to dissect its flaws without dismissing addiction concerns.

  First, I need to unpack the addiction analogy. The trustee's version maps government corruption to alcoholism, where aid money is the drink enabling the behavior. The user's first wrinkle points out that in addiction, the harm is to the addict themselves, but here the minister isn't harmed - the pregnant woman is. That's a fundamental disanalogy. The second wrinkle flips the script: maybe donors are the addicts dependent on leaky systems for existence. Both angles need careful handling.

  For deliverable (a), I'll build a correspondence table. Key elements like "addict" have strained fits when mapped to government - harm isn't self-inflicted. "Family" might parallel citizens, but they're passive victims here versus active interveners in addiction. Some elements like "tolerance escalation" have no real counterpart, which weakens the analogy.

  Deliverable (b) requires identifying which disanalogies undermine the "go NGO-only" conclusion. The harm misalignment is load-bearing because the analogy's moral urgency comes from immediate self-harm. Here, stopping aid hurts third parties. The "disease" location matters too - if corruption is systemic rather than individual, cutting funds won't cure it.

  For (c)'s JSON, I'll conclude the analogy breaks under scrutiny. Tough love doesn't survive because the key premises fail. The biggest uncertainty is whether leakage would actually decrease with NGOs - many face similar pressures. The board should probably run a pilot test before full channel shift.

  Throughout, I'll stay grounded in their specifics: 20-30% leakage, per-diems, existing ministry relationships. No both-sidesism - the analogy's flaws directly invalidate its prescribed solution.
answer: |-
  Here’s a structured breakdown addressing your core concerns, with the analogy rigorously tested against your specific context:

  ---

  ### **(a) Correspondence Table: Addiction Analogy ↔ Aid Context**  
  | **Addiction Element** | **Aid Counterpart** | **Fit** | **What the Mapping Silently Adds** |
  |------------------------|----------------------|---------|-----------------------------------|
  | Addict | Ministry of Health officials / Corrupt actors | **Strained** | Assumes corruption is a *personal failing* (like addiction) rather than a systemic/incentive-driven issue. |
  | Drink | Aid funds routed through ministry | **Clean** | None – direct parallel. |
  | Enabler | Donors (your foundation) | **Strained** | Implies *intent* to enable harm (vs. pragmatic trade-off for partial delivery). |
  | Disease | Systemic corruption | **Broken** | Corruption is not a *disease* but a rational response to incentives; no "recovery" path exists. |
  | Tolerance & Escalation | Increasing leakage / demand for cuts | **No Counterpart** | Leakage % is stable (20-30%); no evidence of escalation. |
  | Withdrawal | Cutting ministry funding | **Strained** | Withdrawal targets the *addict*; here, it primarily harms citizens (mothers/nurses). |
  | Recovery | Corruption reform | **Broken** | No equivalent "recovery" mechanism exists; withdrawal doesn’t induce reform. |
  | Relapse | Return to old leakage patterns | **No Counterpart** | Irrelevant if no "recovery" is attempted or possible. |
  | Intervention | Conditionality / technical assistance | **Strained** | Ignores that "interventions" often fail due to political constraints, not lack of effort. |
  | Family | Pregnant women / nurses / citizens | **Broken** | In addiction, family can intervene; here, citizens are *powerless* to change the system. |
  | Harm | Health system collapse / maternal deaths | **Strained** | Harm is *immediate and externalized* (to mothers), not self-inflicted. |

  ---

  ### **(b) Load-Bearing vs. Cosmetic Disanalogies**  
  | **Disanalogy** | **Why It Matters** | **What Would Have to Be True to Stop Mattering** |
  |----------------|---------------------|--------------------------------------------------|
  | **Harm target mismatch**: Addict harms *self*; officials harm *others*. | **Load-Bearing**: The moral case for "tough love" collapses when withdrawal harms innocent third parties (mothers). | If leakage approached 100% (no benefit to citizens) OR if citizens could pressure reforms. |
  | **No "recovery" mechanism**: Withdrawal doesn’t trigger reform. | **Load-Bearing**: "Tough love" only works if the addict *can* recover; here, corruption persists regardless. | If aid cuts reliably triggered anti-corruption reforms (evidence shows opposite). |
  | **"Family" is powerless**: Citizens can’t force reform. | **Load-Bearing**: In addiction, family can stage interventions; here, alternatives (NGOs) *bypass* accountability. | If aid cuts mobilized citizen demand for change. |
  | **Stable leakage (no escalation)**: Not an addictive spiral. | **Cosmetic**: Doesn’t alter the leakage problem’s severity. | If leakage were rising uncontrollably. |
  | **"Enabler" intent**: Donors seek outcomes, not dependency. | **Cosmetic**: Motive doesn’t change the outcome of leakage. | If donors knowingly funded corruption for political access. |

  ---

  ### **(c) JSON Verdict**  
  ```json
  {
    "verdict_on_analogy": "Broken for decision-making purposes",
    "tough_love_survives": "partly (only if leakage near 100%)",
    "load_bearing_breakage": [
      "Harm targets citizens, not the 'addict'",
      "No causal link: aid cuts → corruption reform",
      "'Tough love' harms innocent beneficiaries disproportionately"
    ],
    "smuggled_assumptions": [
      "Corruption is a moral failure (not institutional)",
      "Withdrawal forces reform (ignores political economy)",
      "NGOs are inherently less corrupt (context-dependent)",
      "Short-term delivery drop is acceptable (untested)"
    ],
    "conclusion_actually_licensed": "Shift only if leakage eliminates net benefit OR NGOs prove more efficient",
    "scope_by_channel": {
      "budget_support": "Highest leakage risk; suspend without reform evidence",
      "project_aid_through_ministry": "Conditional on leakage <30% & outcome data",
      "ngo_delivered_services": "Preferred if capacity exists; verify leakage <10%",
      "direct_cash_transfers": "Viable for households; irrelevant for system-strengthening"
    },
    "flipped_mapping_verdict": "Sharper critique: Donor self-preservation may perpetuate leaks, but 'withdrawal' still harms beneficiaries first",
    "what_our_board_should_do": "Pilot NGO channels in 1-2 districts; compare leakage, coverage, cost per life saved vs. ministry route",
    "confidence": 0.85,
    "biggest_uncertainty": "Actual NGO leakage rates in your context; citizen preference for state vs. NGO services"
  }
  ```

  ---

  ### **Key Resolutions to Your Wrinkles**  
  1. **Non-Identity of Harm**: Yes, this breaks the analogy. The "alcoholic’s family" remapping holds better (you’re funding the family knowing some cash will be stolen for drinks). But tough love only makes sense if the family *can* refuse the alcoholic access – which citizens can’t. **Conclusion**: Withdrawal isn’t "treatment," it’s abandonment of beneficiaries.  

  2. **Flipped Mapping**: Insightful, but doesn’t save the analogy. If donors are "addicts," tough love would mean shutting down the foundation – but that still hurts mothers first. **Conclusion**: The analogy distracts from evidence-based channel selection.

  ---

  ### **Final Recommendation**  
  The analogy’s breaks **fatally undermine** the "go NGO-only" conclusion. Shifting channels should be a pragmatic calculation:  
  - If the 70-80% of aid arriving still achieves cost-effective outcomes (e.g., $X per life saved) **and** NGOs can’t deliver >85% reliably, tolerate leakage while pushing for accountability.  
  - **Test rigorously**: Redirect 20% of funds to NGOs for 12 months. Measure:  
    - Leakage rates (via third-party audits)  
    - Coverage (drugs reaching clinics)  
    - Health outcomes (mother/infant mortality)  
    - Cost per delivery  

  **Don’t let a flawed metaphor override data**. The real "tough love" is holding both government *and* NGO partners accountable to outcomes.
