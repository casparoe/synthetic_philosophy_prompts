          * For one artwork: two claim cards (verdictive and predictive) and two informant report cards (each with a hit rate and a report).
     - Betting slips.

  Timeline (adjusted for time):

  0-5: Introduction
  5-25: Calibration Round (20 minutes)
     - Distribute materials (5 minutes)
     - Betting (5 minutes)
     - Reveal and settle (10 minutes)
  25-30: Calibration debrief (5 minutes)
  30-55: Target Round (25 minutes)
     - Distribute materials (5 minutes)
     - Betting (10 minutes) [because two claims per student]
     - Reveal artworks and settle bets (10 minutes): 
          Step 1: Show artwork A to group 1 and B to group 2? But then we need to show both to all for the verdictive vote. So:
          - Show artwork A to the whole class. Take a vote: is it good? (by show of hands, count) -> set the truth for verdictive claims about A.
          - Show artwork B to the whole class. Take a vote for B.
          - For each student, for the verdictive claim: check if the informant's report matches the class vote.
          - For predictive: ask each student privately (by show of hands or by marking) whether they like the artwork they were assigned. Then check if the informant's report matches.
          - Settle bets.
  55-75: Debrief (20 minutes)

  Debrief outline:
  1. Ask: In the calibration round, did you bet? Why was it rational?
  2. In the target round, for the predictive claim, did you bet? Why?
  3. For the verdictive claim, did you bet? If not, why not?
  4. Map to the concepts:
     - Verdictive testimony: they were reluctant -> aesthetic-testimony pessimism about gaining knowledge.
     - Predictive testimony: they were willing -> no problem.
     - We didn't test understanding and recognition: these are separate. The optimist would say that knowledge does not require understanding, but the pessimist might disagree.
  5. Steelman the optimist: If the hit rate is high, you should be able to gain knowledge. The decay of reliability in a chain is the same as in non-aesthetic cases. The only difference is the subject matter, but why should that matter?
  6. What went wrong: Some students might have bet on the verdictive claim. We can ask: "Did anyone feel uneasy about it?" We can point out that in the reveal, the class vote might not match their own judgment, so they might have been right to be cautious.
  7. What the game cannot reproduce: The game shows reluctance to bet, but it doesn't capture the idea that testimony cannot give you the first-hand experience of the aesthetic qualities. We cannot simulate the understanding aspect.

  Last line: 
  \answer{Calibration round establishing real hit rates for non-aesthetic claims.}
answer: |-
  ### Game Design: "The Aesthetic Relay"

  **Goal:** Students experience aesthetic-testimony pessimism through betting behavior, isolating subject matter as the variable while contrasting verdictive/predictive testimony.  
  **Materials:**  
  - Index cards (for claims, reports, and voting).  
  - Sealed envelopes (for artworks, hidden until reveal).  
  - Poker chips (3 per student initially; 1 chip = $0.50 imaginary value).  
  - Pre-printed artworks (2 target works, e.g., abstract paintings, reproduced on card stock).  

  **Setup:**  
  - **Artworks:** Two target artworks ("X" and "Y") are sealed in envelopes. Two non-aesthetic calibration items (a paragraph for word count, two thermal cups with hidden temperatures) are prepared.  
  - **Hit Rates:** Assign each student a unique informant ID with pre-tested hit rates (70%, 80%, or 90%) for specific claim types. Calibration round validates these rates.  

  ---

  ### Rules and Timeline (75 Minutes Total)  
  **Phase 1: Calibration Round (25 Minutes)**  
  *Validate hit rates for non-aesthetic claims; students learn updating on track records is rational.*  
  - **0-5 min:** Explain rules. Each student gets:  
    - 1 index card with a **non-aesthetic claim** (e.g., "This paragraph has >100 words" or "Cup A is hotter than Cup B").  
    - 1 informant report card: "Informant #[ID] says: [TRUE/FALSE]. Hit rate: [X]% on [claim type]."  
    - 3 poker chips.  
  - **5-15 min:** **Betting.** Students bet 0-3 chips on whether the claim is true. Record bets.  
  - **15-20 min:** **Reveal & Payout.** Verify claims (count words/measure temperature). Students who bet correctly double their chips.  
  - **20-25 min:** **Calibration Debrief.** Discuss: "Did the hit rates hold? Was betting rational?" *Students confirm: "Free money" when hit rates are reliable.*  

  **Phase 2: Target Round (25 Minutes)**  
  *Apply identical structure to aesthetic claims; contrast verdictive vs. predictive testimony.*  
  - **25-30 min:** Distribute materials. Each student gets for **one artwork** (half on X, half on Y):  
    - **Verdictive claim card:** "Artwork [X/Y] is good."  
      - *Attached:* "Informant #[ID] says: [TRUE/FALSE]. Hit rate: [X]% on *artistic merit claims*."  
    - **Predictive claim card:** "You will like Artwork [X/Y]."  
      - *Attached:* "Informant #[ID] says: [TRUE/FALSE]. Hit rate: [X]% on *taste prediction claims*."  
    *Hit rates match calibration round (same IDs, same %).*  
  - **30-40 min:** **Betting.** Students bet 0-3 chips separately on each claim.  
  - **40-50 min:** **Reveal & Payout.**  
    - Unseal artworks. Students view their assigned artwork.  
    - **Predictive payout:** Students self-report: "Did you like it?" Match to informant’s prediction. Correct bets double.  
    - **Verdictive payout:** *Deferred to debrief* (truth = class vote).  

  **Phase 3: Debrief (25 Minutes)**  
  *Map behaviors to philosophical concepts.*  
  - **50-55 min:** **Verdictive Settlement.** Vote by show of chips: "Is X good? Is Y good?" Majority = "truth." Settle verdictive bets.  
  - **55-70 min:** **Discussion:**  
    1. **Reluctance Mapping:**  
       - *Verdictive bets:* Most decline/low-bet. "You couldn’t *know* it was good without seeing it." → Pessimism about knowledge-transfer.  
       - *Predictive bets:* High uptake. "You trusted the informant about *your own response*." → Optimism about testimony for subjective experience.  
       - *Recognition:* "When you saw the artwork, did you *understand* why it was (not) good?" → Pessimism: Testimony doesn’t confer understanding.  
       - *Contrast:* Predictive testimony worked; verdictive felt "hollow" without first-hand experience.  
    2. **Steelman Optimist:**  
       - "If hit rates are reliable, why distrust verdictive claims? You’d accept a 90% hit rate on medical testimony! Aesthetic decay is just epistemic decay—no special pessimism needed."  
    3. **Predictable Issues & Fixes:**  
       - *Problem:* Students might over-bet on verdictive claims ("It’s just like calibration!").  
       - *Fix:* Highlight the betting asymmetry in debrief: "Who bet less on verdictive than predictive? Why?"  
       - *Problem:* Disagreement in verdictive voting causes frustration.  
       - *Fix:* "This mirrors real aesthetic disagreement—truth isn’t obvious even post-reveal."  
    4. **Limitation of the Game:**  
       - *Cannot reproduce:* The **non-propositional nature** of aesthetic understanding (e.g., "seeing the grace" in a dance). Students grasp *that* testimony fails, but the game can’t simulate *why* it fails—this requires lecture supplementation.  
  - **70-75 min:** **Closing:** "Pessimism isn’t about reliability decay; it’s about whether testimony can *deliver aesthetic knowledge* versus mere belief."  

  ---

  \answer{Calibration round validating non-aesthetic hit rates.}  

  **Key Design Choice:** The calibration round forces students to acknowledge that updating on track records is rational for non-aesthetic claims. When they *reject identical bets* for aesthetic verdicts, the subject matter is isolated as the variable—making their reluctance the experiential core of pessimism. Without this, generic decay explanations dominate.
