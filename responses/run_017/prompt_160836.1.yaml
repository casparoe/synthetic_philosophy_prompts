  The stipulations are simplified but must be taken as given. Key points include: insects' moral significance, ignoring farmed animal welfare and climate except for land-use feedbacks, and specific assumptions about each diet's impact. For example, tillage kills more animals during harvest than pesticides, and grazing displaces native species.

