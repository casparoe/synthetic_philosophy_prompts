  - **Virtue and Credibility (Fricker)**: Child justified (2→YES), agent required (3→NO), no distributed reasons (6→NO), testimonial injustice is distinct failure (8→YES).
  - **Credulity/Acceptance (Reid, Burge)**: Child justified (2→YES), agent required (3→NO), no distributed reasons (6→NO), testimonial injustice not distinct (8→NO), and assurance case justified (9→YES).
  - **Assurance View (Moran)**: Child justified (2→YES), agent required (3→NO), no distributed reasons (6→NO), testimonial injustice not distinct (8→NO), and assurance case not justified (9→NO).

  The child case (node 2) does the most work by splitting reductionist and anti-reductionist.

