     - YES (anti-reductionist) → Go to 3
     - NO (reductionist) → Go to 4

  3. **Non-Agent Source**: You see a digital display at the train station that says the train leaves at 4:03. The display is known to be 99% accurate. You form the belief. Is the justification for this belief the same kind as in the stranger case?
     - YES (non-agent testimony allowed) → Go to 5
     - NO (agent required) → Go to 6

