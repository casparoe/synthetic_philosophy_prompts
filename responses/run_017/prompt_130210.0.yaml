     - YES → **Credulity/Acceptance (Reid, Burge) (leaf)**
     - NO → **Assurance View (Moran) (leaf)**

  Scoring Key:

  - **Global Reductionism**: Child not justified (2→NO) and every instance requires positive reasons (4→YES).
  - **Local Reductionism**: Child not justified (2→NO) and not every instance requires reasons (4→NO).
  - **Unoccupied: non-agent and distributed**: Child justified (2→YES), non-agent same as agent (3→YES), distributed reasons (5→YES).
  - **Unoccupied: non-agent and individual**: Child justified (2→YES), non-agent same as agent (3→YES), no distributed reasons (5→NO).
  - **Communitarian Anti-Reductionism (Coady)**: Child justified (2→YES), agent required (3→NO), distributed reasons (6→YES), long chain justified (7→YES).
