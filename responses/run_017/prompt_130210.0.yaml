answer: |-
  ### Testimony Justification Sorting Instrument  
  **Start:** You're at a train station. A stranger says, "The train leaves at 4:03." You believe it and are justified.  

  #### Decision Tree:  
  1. **Child Case:**  
     A 3-year-old hears her mother say, "There's milk in the fridge." The child believes this *without* checking past reliability. Is the child justified?  
     - **YES** → Go to 2  
     - **NO** → Go to 3  

  2. **Non-Agent Reliability:**  
     A weather station’s sensor (99% accurate, no human involved) says, "Rain in 5 mins." You believe it. Is this *as justified* as the stranger’s train claim?  
     - **YES** → Go to 4  
     - **NO** → Go to 5  

  3. **Reductionist Scope:**  
     For the stranger’s train claim, must you *always* have personal evidence (e.g., past checks of strangers) to be justified?  
     - **YES** → **Global Reductionism (Humean)**  
     - **NO** → **Local Reductionism**  

  4. **Discounted Speaker:**  
     A reliable female scientist says, "My experiment proves X." Her male colleagues dismiss her *because she’s a woman*, not due to evidence. Is this dismissal:  
     - **A) Typical (they lack personal evidence)** → Go to 6  
     - **B) Unique (a distinct injustice)** → Go to 7  

  5. **Hearsay Chain:**  
     Your friend heard from a friend (who heard from a stranger) that "Train 601 is delayed." You believe it *without* tracing sources. Justified?  
     - **YES** → Go to 8  
     - **NO** → Go to 9  

  6. **Backing Evidence Location:**  
     To trust a doctor’s diagnosis, must *you* personally recall evidence of their skill, or can it rely on hospital reputation/records?  
     - **Personal recall needed** → **Unoccupied (unstable: anti-reductionist + individualist)**  
     - **Reputation/records suffice** → **Communitarian Anti-Reductionism (Coady)**  

  7. **Speaker Intent:**  
     A lost tourist asks for directions. A local *lies* to be helpful. You believe them. Are you justified?  
     - **YES** → Go to 10  
     - **NO** → **Assurance View (Moran)**  

  8. **Environment vs. Agent:**  
     Justifying the hearsay belief hinges more on:  
     - **Social practices (e.g., norms of info-sharing)** → **Communitarian Anti-Reductionism (Coady)**  
     - **The speaker’s character/behavior** → Go to 11  

  9. **Attentiveness Requirement:**  
     To trust the stranger’s train claim, must you *actively assess* their demeanor (e.g., confidence, motives)?  
     - **YES** → **Virtue & Credibility (Fricker)**  
     - **NO** → **Credulity/Acceptance (Reid/Burge)**  

  10. **Non-Agent + Injustice Hybrid:**  
      For the weather sensor claim, if it was made by a female voice systematically ignored, is the dismissal:  
      - **A) Typical (sensor isn’t "testimony")** → **Credulity/Acceptance (Reid/Burge)**  
      - **B) Unique injustice** → **Unoccupied (unattractive: conflates agent/non-agent)**  

  11. **Long Chain + Virtue:**  
      In the hearsay chain, is your belief justified *only if* you gauge the *final speaker’s* trustworthiness?  
      - **YES** → **Virtue & Credibility (Fricker)**  
      - **NO** → **Credulity/Acceptance (Reid/Burge)**  

  ---

  ### Scoring Key  
  | Path (Answers) | Position | Notes |  
  |----------------|----------|-------|  
  | 1: NO → 3: YES | **Global Reductionism** | Humean stance: always need backing. |  
  | 1: NO → 3: NO | **Local Reductionism** | Backing needed per instance. |  
  | 1: YES → 2: YES → 4: B → 7: NO | **Assurance View** | Relies on speaker’s commitment. |  
  | 1: YES → 2: NO → 5: YES → 8: A | **Communitarian** | Justification from social practices. |  
  | 1: YES → 2: NO → 5: YES → 8: B → 11: NO | **Credulity/Acceptance** | Default trust in speakers. |  
  | 1: YES → 2: NO → 5: YES → 8: B → 11: YES | **Virtue & Credibility** | Requires active credibility assessment. |  
  | 1: YES → 2: NO → 5: NO → 9: YES | **Virtue & Credibility** | Attentiveness mandatory. |  
  | 1: YES → 2: NO → 5: NO → 9: NO | **Credulity/Acceptance** | No attentiveness needed. |  
  | 1: YES → 2: YES → 4: A → 6: Personal | **Unoccupied** | Unstable: anti-reductionism + individualism. |  
  | 1: YES → 2: YES → 4: B → 7: YES → 10: B | **Unoccupied** | Unattractive: non-agent testimonial injustice. |  

  **Most Discriminating Node:** #1 (Child Case). It cleanly separates reductionists (demand evidence even for children) from anti-reductionists (default trust).  

  **Design Notes:**  
  - **Fricker vs. Reid/Burge:** Collapsed into one branch (#9 and #11). Fricker *requires* attentiveness; Reid/Burge treat trust as automatic.  
  - **Non-Agent (#2):** Sorts broadly: assurance/communitarian views reject it as testimony; credulity/virtue views accept it.  
  - **Discounted Speaker (#4):** Isolates Fricker (B) from others (A). Reductionists see it as evidentiary; assurance sees it as interpersonal breach.  
  - **Hearsay (#5) + Distributed Evidence (#6/8):** Key for Coady (community-dependent) vs. individualist views.  
  - **Unoccupied Positions:** Marked where combinations are unstable (e.g., anti-reductionism + strict individualism) or unattractive (e.g., attributing injustice to non-agents).  

  Print double-sided for seminar use. Students self-sort by cases; reveal labels afterward to spark debate on what the patterns imply.
