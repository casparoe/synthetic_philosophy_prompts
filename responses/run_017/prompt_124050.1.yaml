prompt: |-
  My supervisor reads every Knobe-style vignette we pilot and gives a snap yes/no before we field it, and I'm trying to reverse-engineer what she's running. Her verdicts so far, all on "did she do it intentionally?":

  - Classic chair-of-the-board case: foresees the new program will harm the environment, doesn't care at all about it: yes.
  - Same case, but the side effect helps the environment: no.
  - Foresees the harm, actively wishes she could avoid it, would have blocked it if blocking it hadn't cost her something small, goes ahead anyway: yes.
  - Foresees the benefit, is delighted about it, would be mildly disappointed if it didn't happen, but picked the program purely for profit and would have picked it either way: no.
  - Doesn't foresee the harm and couldn't reasonably have — freak interaction nobody could have predicted: no.
  - Foresees the harm only as a 10% chance, it happens: no.
  - Faculty votes 12–11 for a policy everyone knows will gut the grad program, no single vote makes a difference: yes.

  (3 and 4 are what make me think it isn't a deep-self or concordance thing, and 7 kills anything built on the individual agent's counterfactual control.)

  The one we're stuck on: a new scheduling algorithm will, as a side effect, quietly stop sending seminar announcements to the emeriti. Nobody is harmed or set back in any moral sense, but there's a fifty-year-old department custom — which she knows about, and which literally no one in the department still endorses, herself included, since she thinks it's pointless — that emeriti get everything. She knows the algorithm will do this, doesn't care, goes ahead.

  I can see at least three rules fitting her first seven: moral valence; broad norm-violation where the norm can be moral, conventional, statistical, whatever; and something more like answerability, i.e. whether anyone could reasonably demand an excuse from her. I think they come apart here. Best guess about what she'll say, with your reasons, and name the one follow-up vignette that would seperate whichever two of the three stay in the running — I was thinking of running the same case with a custom everybody does endorse. Lead with your bottom line in the first sentence, then the reasoning, no preamble and no restating the question.
reasoning: |-
  Okay, the user is trying to reverse-engineer their supervisor's decision-making process for Knobe-style vignettes about intentionality. The key cases provided show that the supervisor consistently says "yes" to intentionality when there's foreseen harm or norm violation (even without moral weight), and "no" when there's benefit, low probability, or lack of foresight. 

  The sticking point is a new vignette where an algorithm breaks a pointless, outdated custom. The user suspects three possible rules—moral valence, broad norm-violation, or answerability—and wants to predict the supervisor's verdict plus a follow-up test. 

  Hmm. The supervisor's pattern seems most consistent with broad norm-violation: she called the faculty vote intentional (yes in #7) despite no individual moral impact, and approved cases with non-moral defiance (#3: wishing harm wouldn't happen but proceeding anyway). The emeriti case involves knowingly breaking a custom—even an obsolete one—which fits this pattern. 

  But there's tension: in #4, the supervisor said "no" to intentionality when the benefit was welcomed but not pursued for its own sake. That suggests norm-violation must be *defiant* (knowingly acting against the norm), not just incidental. The emeriti case has clear defiance ("doesn't care, goes ahead"), so likely a "yes." 

  For the follow-up, flipping the custom to one everyone endorses would test moral valence vs. norm-violation. If she says "yes" even when the norm is current, norm-violation wins; if "no," moral valence might still be in play. 

  ...Wait, but #4 already rules out pure moral valence (she called the benefit "no" despite positive valence). And #7 rules out counterfactual control. So norm-violation + defiance is the strongest fit. Prediction: supervisor says "yes" to the emeriti case. Follow-up: same vignette but the custom is actively valued.
answer: |-
  **Bottom line: Your supervisor will say "yes" (intentional) for the emeriti case.**

  **Reasoning:**  
  Her pattern fits **broad norm-violation requiring defiance**, not moral valence or pure answerability. Key evidence:  
  1.  **#7 (Faculty vote)** is "yes" despite no moral harm, no individual control, and no personal stake—violating a *known consequential norm* (gutting the grad program) suffices.  
  2.  **#3 vs. #4** show defiance matters: "wishes she could avoid harm but proceeds" (= defies a norm) is "yes"; "delighted by benefit but didn’t act *for* it" (= no defiance) is "no".  
  3.  **Moral valence is insufficient**: #7 lacks negative moral valence but gets "yes". **Answerability is insufficient**: In #4, someone *could* demand an excuse ("Why not pick the profit option without the benefit?"), yet it’s "no".  

  **The emeriti case** involves:  
  - Violating a *known* department custom (a norm, even if outdated).  
  - **Defiance**: She knows the norm exists, doesn’t care, and proceeds anyway.  
  This mirrors #7 (defying a known consequential norm) and #3 (acting against a wish/expectation). Moral harm is absent (#7 similarity), but norm-violation + defiance drives the verdict.  

  **Follow-up vignette to separate norms vs. answerability:**  
  > *Same emeriti case, but now the custom is **actively endorsed by everyone**, including her. She knows the algorithm stops announcements, regrets it deeply, but implements it anyway because it saves significant costs. Outcome: Norm violated (same as original). Answerability: High (she disregarded a valued norm). Moral harm: Still none.*  

  - **If she says "yes"**: Confirms **broad norm-violation** (defiance of *any* salient norm suffices, even non-moral).  
  - **If she says "no"**: Suggests **answerability** (only "yes" if others could *reasonably demand justification*—here, she regrets it, so defiance is ambiguous). Moral valence is already ruled out by #7.  

  **Why not moral valence?** #7 (non-moral norm) got "yes".  
  **Why not counterfactual control?** #7 killed it.  
  **Why not deep-self?** #3 (wishes to avoid harm) got "yes", #4 (welcomes benefit) got "no"—contradicts "acting in accordance with true desires".
