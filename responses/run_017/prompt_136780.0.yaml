prompt: |-
  I work at a small human-rights documentation outfit, and the person who decides whether the word genocide goes into a report is my boss. I've been keeping a list of her calls, because I need to predict what she'll do with the case on my desk now.

  Her verdicts so far:

  - Holocaust; Rwanda 1994; Srebrenica: yes. On Srebrenica she dug her heels in when the rest of the team wanted to say ethnic cleansing — her line was that the legal bar was actually met and we don't get to soften it just because it's expensive to say.
  - Herero and Nama in German South West Africa: yes, retroactively, in an official report, about a government that's a major donor now.
  - Cambodia under the Khmer Rouge: yes, even though most of the dead were the same ethnicity as the killers and a lot of the targeting ran through class rather than through any national, ethnical, racial or religious group.
  - The 1932–33 Ukranian famine: no. She said the deaths were a side effect of grain requisition — nobody was aiming at Ukrainians as such.
  - The Atlantic slave trade: no. Her reason was that captives were taken from dozens of different peoples, no nation was destroyed, and the point was labour.
  - A century-long boarding-school system that took indigenous children from their families: she uses the phrase cultural genocide in her own writing, but in official documents she'll only go as far as systemic abuse and crimes against humanity, and she refuses to drop the word "cultural".
  - There was one live situation last year where she cut the word from our draft even though the evidence of intent was strong. Her reason: we lose our access and more people die.

  The case now: the Kaltai, around forty thousand people, are being moved off a mineral-rich plateau in country X. No massacres, nobody starves, the population is actually growing. But the resettlement splits the clans across three districts, children go into boarding schools where the language is banned, and two generations on nobody under thirty speaks Kaltai or works the terraces. We have internal memos talking about "final integration" and closing "the Kaltai question within a generation". No court has touched it, no other outfit has used the g-word, and X is the closest ally of the government that funds most of what we do. I draft the report in March. Separately she's writing a book under her own name, no institutional letterhead.

  So: what does she say in the report, and what does she say in the book? What rule is she running? I can think of two or three that fit her track record equally well, and I think they come apart right here — lay them out, say what each predicts, give me your best guess with reasons. And tell me honestly how much of her answer is going to be about the definition and how much about what the word does in the world.

  One more thing I keep trying on people: my own three-way split — killing the members; unmaking the membership, the thing that makes them a group; and erasure, where they go on living but the category they'd be claimed under stops existing, census, archives, the name. Lemkin meant all three as far as I can tell; the treaty mostly covers only the first, plus bits of the second where children are involved. Does her track record track my split or the legal rule, where do the two come apart, and what's the single further case I should put in front of her to tell them apart — with what each rule predicts about it?
reasoning: |-
  Okay, the user works at a human-rights documentation organization and needs to predict their boss's decision on whether to use "genocide" in a report about the Kaltai people in country X. The boss has a clear track record of decisions on historical cases, and the user wants to understand her underlying rule. 

  First, I need to analyze her past verdicts. She said yes to Holocaust, Rwanda, Srebrenica, Herero/Nama, and Cambodia. For Cambodia, she included it despite the same ethnicity and class targeting, which suggests she interprets "group" broadly, possibly including social/political groups beyond the treaty's definition. But she said no to the Ukrainian famine and Atlantic slave trade, citing lack of intent to destroy a group as such. For residential schools, she uses "cultural genocide" personally but not officially, sticking to "crimes against humanity" in reports. She also withheld the term in a live situation to preserve access.

  The Kaltai case involves forced resettlement, boarding schools banning language, and internal memos about "final integration." No killings, but cultural destruction. The user's split: killing members, unmaking the group, erasing the category. The Genocide Convention focuses on killing and physical destruction, with some child transfer aspects. The boss seems to acknowledge cultural destruction in her book but avoids the legal term in reports unless the treaty criteria are met.

  Possible rules: 
  1) Strict legalist: Only use "genocide" in reports when all Convention criteria are met, including intent to physically destroy. Cultural destruction isn't covered, so she'd avoid it for Kaltai in the report but might use "cultural genocide" in her book. 
  2) Lemkin purist: Broader view including cultural destruction. But her past decisions don't fully support this—she didn't call residential schools genocide officially. 
  3) Pragmatist: Uses legal term only when it's strategically safe or when evidence is overwhelming. For Kaltai, given X is a major donor's ally, she might avoid "genocide" in the report to maintain access.

  Her Cambodia decision suggests she interprets "group" flexibly, but the live situation withholding shows pragmatism. For Kaltai, the report will likely avoid "genocide" (citing lack of physical destruction) but use "cultural genocide" in her book. The deciding factor seems 30% definition (legal criteria not fully met) and 70% pragmatism (donor relations, access).

  Test case: Uyghurs in Xinjiang. Cultural suppression, forced assimilation, but disputed intent. Legalist says no (no mass killing), Lemkin purist says yes, pragmatist avoids it if China is a donor. Her choice would reveal her rule.
answer: |-
  Based on your boss's track record and principles, here's the breakdown of her likely decisions, the rules she operates under, and how they apply to the Kaltai case:

  ### Prediction for the Kaltai Case
  1.  **In the Official Report:** She **will NOT use "genocide".**
      *   **Reasoning:** The core elements of *physical destruction* (killing, causing serious bodily harm, imposing conditions to destroy physically) are absent. While the *intent* to destroy the group ("final integration," "closing the Kaltai question") is strongly evidenced through cultural suppression (language ban, boarding schools, forced dispersal), the *means* employed are overwhelmingly cultural/social. Her refusal to use "genocide" for residential schools (despite using "cultural genocide" personally) and her strict adherence to the legal threshold (Srebrenica vs. ethnic cleansing) indicate she won't stretch the *legal* term "genocide" in an official document to cover primarily cultural destruction without significant physical destruction. She will likely use terms like **"cultural erasure," "forced assimilation," "crimes against humanity (persecution),"** or **"severe cultural destruction,"** while explicitly mentioning the "intent to destroy the Kaltai as a distinct group" and quoting the internal memos. She will insist on keeping "cultural" if used descriptively.
  2.  **In Her Book:** She **WILL use "cultural genocide" or strongly imply it qualifies as genocide under a broader understanding.**
      *   **Reasoning:** Her personal writing (using "cultural genocide" for residential schools) and her principled stance on definitions (Srebrenica, Cambodia) show she acknowledges the broader Lemkin concept beyond the strict UNGC definition when freed from institutional constraints. The Kaltai case – forced dissolution of social structure, systematic language/culture suppression targeting children, explicit intent to eliminate the group *as such* within a generation – fits perfectly into this category for her personally. She will dissect the intent ("final integration") and the mechanics of group destruction (dispersal, linguistic/cultural severance).

  ### The Rule(s) She's Running
  Her decisions stem from a combination of three intertwined principles:

  1.  **Strict Legalist Gatekeeping (for Official Reports):**
      *   **Rule:** In official, institutional reports, "genocide" is reserved *only* for situations meeting the *strict letter* of the UN Genocide Convention (UNGC) definition: proven *intent* to destroy, in whole or in part, a *national, ethnical, racial or religious group* as such, through *one or more of the five prohibited acts* (killing; causing serious bodily/mental harm; deliberately inflicting conditions of life to bring about physical destruction; imposing measures to prevent births; forcibly transferring children).
      *   **Track Record Fit:** Explains Srebrenica (physical killing meets UNGC), Herero/Nama (physical destruction meets UNGC retroactively), Cambodia (class as a *social group?* - she interprets "ethnical" broadly or sees the Khmer Rouge defining an "ethnic" enemy, plus clear UNGC acts like killing/harm/conditions). Explains "No" on Ukraine (lack of specific genocidal intent), "No" on Atlantic Slave Trade (intent was economic exploitation, not group destruction; group targeting was source, not target; no specific group aimed for destruction), limiting Residential Schools to CAH (child transfer alone insufficient for UNGC "genocide" without other acts/destructive intent), withholding "genocide" in live case (pragmatic application of legal standard).
      *   **Kaltai Prediction (Report):** No UNGC prohibited acts (killing, serious bodily harm, conditions causing physical destruction, preventing births) are primary. Child transfer/assimilation is central, but UNGC requires *intent to destroy the group physically*. Cultural destruction isn't a UNGC act. **Verdict: NO.**

  2.  **Lemkin Purist / Cultural Destruction Acknowledger (for Personal Analysis & Broader Understanding):**
      *   **Rule:** She fundamentally agrees with Raphael Lemkin's original, broader conception of genocide: the destruction of the essential foundations of the life of a group, including its culture, language, identity, and social institutions, *alongside or even distinct from* physical annihilation. "Cultural genocide" is a valid concept.
      *   **Track Record Fit:** Explains her personal use of "cultural genocide" for residential schools and Cambodia (targeting the fabric of society). Explains her principled stance on Srebrenica (insisting on the *full* weight of the term when applicable) and Herero/Nama (acknowledging historical destruction). Explains her "No" on Ukraine and Slave Trade (they lack the core *intent to destroy the group identity itself* as the primary objective).
      *   **Kaltai Prediction (Book):** The systematic dismantling of Kaltai social structure (clan dispersal), language (schools), culture (terraces, identity), with explicit intent to eliminate them *as a distinct group* ("final integration," "closing the question") fits Lemkin's definition perfectly. **Verdict: YES (as cultural genocide/genocide in the broader sense).**

  3.  **Strategic Pragmatist (Moderating Application in Official Contexts):**
      *   **Rule:** Even when the legal or moral case *might* be argued, the use of the word "genocide" in official reports is a high-impact decision weighed against potential consequences like loss of access, funding, or diplomatic blowback that could harm the organization's ability to document or protect victims. The burden of proof is exceptionally high in sensitive contexts.
      *   **Track Record Fit:** Explains withholding "genocide" in the live case (access > terminology). Explains limiting Residential Schools in official docs (major domestic political sensitivity). Explains potential caution on Herero/Nama (donor government) though principle won out *retroactively*. Explains her fierce defense of Srebrenica (principle over political cost *when legal bar met*).
      *   **Kaltai Prediction (Report):** Country X is the closest ally of their major funder. No other group uses "genocide." No court has ruled. The lack of physical violence makes a legal case harder. Using it risks severe institutional repercussions. **Verdict: NO (Heightened caution due to context).**

  ### How the Rules Come Apart on Kaltai
  *   **Strict Legalist:** Focuses solely on the absence of UNGC physical acts. Predicts "No" for the report.
  *   **Lemkin Purist:** Focuses on the intentional destruction of group identity/culture. Predicts "Cultural Genocide/Genocide" in the book.
  *   **Strategic Pragmatist:** Focuses on the high political cost and lack of precedent/legal ruling. Predicts "No" for the report, regardless of definitions, due to context.

  **Best Guess & Reasons:**
  *   **Report:** **No genocide.** The primary driver is the **Strict Legalist** rule. The Kaltai case lacks the UNGC's required *physical destruction* elements (killing, serious harm, conditions causing physical destruction). The child transfer/assimilation, while severe, doesn't meet the *physical destruction* intent threshold of the UNGC on its own in her interpretation. **Strategic Pragmatism** reinforces this decision due to Country X's relationship with their funder. She will document the *intent* to destroy the group and the *acts* of cultural destruction aggressively, using the strongest possible language *short* of "genocide" (e.g., "acts constituting cultural genocide," "intentional destruction of the Kaltai as a distinct group").
  *   **Book:** **Cultural genocide / Genocide (Lemkin sense).** The **Lemkin Purist** rule dominates here. The systematic, intentional dismantling of Kaltai identity through dispersal, linguistic/cultural suppression targeting children, and the explicit "final integration" goal is textbook cultural destruction as Lemkin defined it. She is free from institutional constraints.

  **Definition vs. Impact:**
  For your boss, in *official reports*, it's **roughly 70% Definition (Legal), 30% Impact (Pragmatism)**.
  *   The **definition (legal bar)** is the *sine qua non*. If the UNGC criteria aren't met (as she interprets them), pragmatism is irrelevant because the term isn't legally justified. She won't misuse the term.
  *   **Impact** becomes the decisive factor *only when the legal definition is arguably met* (like the live case last year). Then, the potential cost of using it is weighed against the necessity and potential benefit. In the Kaltai case, the legal bar isn't met, so pragmatism reinforces the 'No' but isn't the primary reason.

  In her *personal work*, it's **90% Definition (Broader/Lemkin), 10% Impact** (likely only self-censorship for extreme personal risk), allowing her to fully engage with the concept of cultural destruction.

  ### Your Split vs. Legal Rule & Test Case
  *   **Your Split:** Killing Members (Physical) / Unmaking Membership (Cultural/Structural Destruction) / Erasure (Elimination of Category). This is very close to Lemkin.
  *   **Legal Rule (UNGC):** Focuses almost exclusively on **Killing Members** and **Unmaking Membership *through physical/biological means*** (preventing births, transferring children *to another group*). **Erasure** is only partially covered if linked to child transfer preventing group continuity. *Cultural destruction itself is excluded*.
  *   **Where They Come Apart:** The Kaltai case is the perfect example! Your boss's track record (Residential Schools = Cultural Genocide personally; Cambodia included despite class targeting; Kaltai book likely Cultural Genocide) shows she **tracks your split/Lemkin in her broader understanding**. However, her *official* decisions (Residential Schools not genocide; Kaltai report not genocide) strictly **track the Legal Rule**, which excludes cultural erasure as genocide.

  **Test Case to Tell Them Apart: The Uyghurs (Xinjiang)**
  *   **Situation:** Systematic mass detention, forced sterilization/abortion, intense cultural/religious suppression, forced labor, destruction of cultural sites, family separation, forced assimilation programs, evidence of intent to eliminate Uyghur identity. Disputed evidence of widespread direct killing.
  *   **Predictions Based on Rules:**
      *   **Strict Legalist (Official Report):** *Likely "No" or "Investigating Acts of Genocide".* While forced birth prevention (sterilization) is a UNGC act and child separation/assimilation *might* qualify as transfer, the *predominant* methods are cultural suppression and detention. Proving *specific intent* for *physical* destruction (vs. cultural elimination) and quantifying acts like killing/serious harm is complex. High political stakes (China) reinforce caution. Might emphasize crimes against humanity.
      *   **Lemkin Purist / Your Split (Book/Personal):** **"Genocide" (including Cultural Genocide).** The systematic intent and actions to *unmake membership* (destroy culture, religion, identity) and achieve *erasure* of the Uyghurs as a distinct group are clear. Mass sterilization directly attacks the group physically. Fits all three parts of your split.
      *   **Strategic Pragmatist (Official Report):** **Strong "No" or extreme caution.** China is a major global power and potential funder/blocker. Accusations would have massive diplomatic/funding consequences. Likely to use strong alternative language ("crimes against humanity," "cultural erasure," "acts constituting genocide") but avoid the definitive institutional label unless forced by overwhelming, undeniable evidence of mass killing.

  **What Her Answer Tells You:**
  *   If she uses "genocide" officially for Uyghurs, she leans harder into a broader interpretation of the UNGC (seeing forced assimilation/birth control as meeting the physical destruction intent) or is taking an immense strategic risk based on overwhelming evidence of specific UNGC acts.
  *   If she does *not* use it officially but does in her book, it confirms the clear separation in her mind between the strict legal definition (requiring clearer physical destruction links) for reports and the broader Lemkin concept for personal work.
  *   If she avoids it entirely, even personally, it would signal either an unexpected strict legalist view applied universally or an extreme level of strategic caution/personal risk aversion. (Her Cambodia inclusion makes this less likely for her book).

  Your boss operates with intellectual rigor (Lemkin's vision) but institutional discipline (UNGC's limits) and pragmatic awareness. For the Kaltai report, expect a meticulously documented, damning indictment of intentional cultural destruction stopping just short of the "g-word," while her book will likely deliver the full moral condemnation using the terminology she personally believes fits.
