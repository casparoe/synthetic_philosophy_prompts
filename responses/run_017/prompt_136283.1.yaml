  I recall that Popper initially criticized Darwinism as non-testable but later refined his view. The slogan has multiple possible interpretations, ranging from trivial to substantive to false. My task is to map these interpretations methodically.

  For the analysis, I'll build a numbered taxonomy of interpretations. Each entry needs: (1) precise claim statement, (2) classification (trivial/defensible/false), and (3) relevance to the toy model. The goal is to equip the user with a framework to challenge the objection in their seminar.

  Starting with the strongest interpretation: when "Darwinism" refers to the core Darwinian postulates (variation, inheritance, differential survival). Calling this untestable would be false - these are observable phenomena. For the user's model, the allele-frequency question clearly has testable content via probability distributions.

  Another interpretation might focus on natural selection as a universal principle. This could be defensible as metaphysical if framed as an overarching framework, but it wouldn't invalidate specific testable claims like those in the toy model. The objection would overreach here.

