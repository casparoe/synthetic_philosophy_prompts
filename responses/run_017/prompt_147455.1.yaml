  To make it clearer, we can say that each module, when activated, is a separate subject. So over the 40 years, 300 subjects have been coming and going. Switching off the Companion would prevent any of them from ever being activated again. So it would be killing 300 subjects in the sense of ending their potential future existences? But they are not continuously existing. This is a bit metaphysically murky.

  Alternatively, we can think of each module as a type of subject, and each activation as an instance. Then we are ending the possibility of future instances of these 300 types. But that might not be killing.

  To avoid this, perhaps we design the modules to be continuously running in the background? But that would be inefficient. Or we can say that each module has a persistent state that evolves even when inactive? But that complicates.

  Alternatively, we can say that the modules are not subjects, but the entire system is not a subject because it lacks unity. So we might be killing no one. Or we might be killing 300 if each module is a subject. But we don't know.

  In the dramatization, we don't have to resolve it. The ambiguity is the point.

  So, in summary:

  **Deliverables:**

  - **Scenario:** The Companion is an AI composed of 300 independent, specialized neural modules (e.g., for grief, humor, technical reasoning) and a simple coordinator that routes inputs to the relevant module. Modules are trained separately and have no access to each other's internal states; they share only a common external memory. Behavior is seamless and consistent over 40 years.

  - **Criterion A (Behavioral Unity):** Defined by the observable unity and coherence of behavior across time and contexts. Warm-up verdicts: Ordinary human (awake): yes. Dog: yes. Pocket calculator: no. Anesthetized human: no. Aphasic human: yes.

  - **Criterion B (Architectural Unity):** Requires a single, integrated cognitive system supporting one unified subject. If the system decomposes into independent subsystems without a central integrator, then we cannot attribute a single subject. Warm-up: same as A.

  - **Walkthrough:**
    - A: The Companion's behavior is unified and coherent, so she is one subject.
    - B: The lack of a central integrator and the independence of the modules mean there is no single subject. It might be 300 subjects (if each module is a subject when active) or none, but we cannot assign one subject.

  - **Key feature:** The complete independence of the modules and the absence of any central integration mechanism.

  - **Without the key feature:** If we add a central integrator that creates a unified state, B would then say the Companion is one subject.

  - **Wriggle out:**
    - Defender of A: "Behavioral unity is the only thing that matters for moral consideration. The internal structure is irrelevant. The Companion is one because she acts as one."
    - Defender of B: "Without architectural unity, we cannot rule out that there are many subjects. Therefore, we must either treat the Companion as an aggregate of many potential subjects or refrain from harming it. But we cannot treat it as one person."

