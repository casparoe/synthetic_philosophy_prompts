answer: |-
  ## Discussion Paper: Clarifying the Purpose and Practice of the Wychford Commons Restitution Trust  
  **Prepared for Trustees: March Meeting**  
  **Word Count:** Approx. 1,180  

  ### 1. Introduction: The Core Question  
  The unexpected growth of the Trust’s corpus and the complexity of recent applications necessitate a fundamental clarification: **What is the Trust *doing* when it makes a grant?** Our deliberations reveal four distinct, often conflicting, interpretations:  

  1.  **Counterfactual Restitution:** Compensating descendants for the *specific financial loss* their ancestors suffered due to the 1807 Inclosure, based on an estimate of what those rights would be worth today.  
  2.  **Unjust Enrichment Recovery:** Reclaiming value *currently held* by parties who benefit from the historical injustice (e.g., landowners, institutions), regardless of claimant descent.  
  3.  **Symbolic Reparation:** Acknowledging the historical wrong and its ongoing social/economic consequences, fostering community healing.  
  4.  **Necessitous Circumstances Relief:** Providing aid to residents in need *because* the historical event defines our charitable purpose, irrespective of lineage or counterfactuals.  

  **These interpretations lead to vastly different outcomes.** Our challenge is to align our actions with the deed’s core mandate while acknowledging practical and philosophical realities.  

  ---

  ### 2. Analysis: The Deed, Reality, and the Applications  

  *   **The Deed's Anchor:** The 1807 Inclosure Act and loss of common rights are the *causative event* defining our purpose. Relief is directed to current residents in "necessitous circumstances" *by reason of* that loss. Descent from commoners is *not* explicitly required, but the loss suffered by *those individuals* is the deed's foundation.  
  *   **The Non-Identity Problem & Historian's Report:** The applicant from the Jamaican family compellingly argues that *no living person* can claim direct, personal financial loss from the 1807 Act. The historian confirms the profound demographic shifts, making any counterfactual baseline ("what life/wealth would descendants have now?") **impossible to calculate meaningfully**. This fatally undermines Interpretation 1 (Counterfactual Restitution).  
  *   **The Mill-Fortune Paradox:** The Trust's funds originate from wealth *unrelated* to the Inclosure. We cannot trace these funds to unjust enrichment derived *specifically* from the 1807 Act. Interpretation 2 (Unjust Enrichment Recovery) is therefore **inoperable** – we lack the standing or means to identify and "recover" unjustly held benefits.  
  *   **The Remaining Purposes:** This leaves Interpretations 3 (Symbolic Reparation) and 4 (Necessitous Circumstances Relief) as potentially viable, though distinct.  

  ---

  ### 3. Recommendation: Recalibration & Concrete Decisions  

  Based on the above, I propose we explicitly **reject Counterfactual Restitution and Unjust Enrichment Recovery** as practicable foundations for the Trust. Instead, we should embrace a **hybrid approach focused on Symbolic Reparation *through* the Relief of Necessitous Circumstances, explicitly linked to the historical community affected.**  

  *   **Core Principle:** The Trust exists to alleviate present-day hardship *caused by the enduring socio-economic consequences* of the 1807 Inclosure and the loss of common rights within the community of Wychford. Eligibility requires both:  
      (a) Residence within the Borough of Wychford;  
      (b) Demonstrable necessitous circumstances; **and**  
      (c) A *meaningful connection* to the historical community whose structure and fortunes were fundamentally altered by the 1807 Act.  

  #### Concrete Decisions on Current Applications  

  1.  **Application 1 (Care Worker):**  
      *   *Recommendation:* **Approve.**  
      *   *Reasoning:* She meets residency and demonstrable need. Her documented descent from a named cottager establishes a direct, meaningful connection to the historical community that suffered the loss. The descent from a commissioner, while ironic, does not negate the descent from the injured party nor alter her present need. This aligns with Symbolic Reparation (acknowledging the injury to that lineage) *and* Necessitous Relief.  

  2.  **Application 2 (Man of Jamaican Descent):**  
      *   *Recommendation:* **Decline.**  
      *   *Reasoning:* While he clearly meets residency and demonstrable need, the lack of *any* ancestral connection to the pre-1807 Wychford community means the link between his necessitous circumstances and the *specific loss caused by the 1807 Act* cannot be established under our core principle. His need, however real, arises from contemporary circumstances unrelated to the historical event defining our charitable purpose. Granting relief here would functionally redefine the beneficiary class towards general poverty relief, which the clerk advises we cannot do without external approval.  

  #### Standing Rule for Future Applications  

  *   **Recommendation:** Adopt the "**Meaningful Connection**" test outlined in the Core Principle above. Future applicants must demonstrate:  
      (i) Current residency in the Borough.  
      (ii) Objective evidence of necessitous circumstances (using clear, consistent criteria e.g., receipt of qualifying benefits, income/assets below defined thresholds).  
      **(iii) A meaningful connection to the pre-1807 Wychford community.**  
  *   **Defining "Meaningful Connection":** This can be established through:  
      *   Direct descent from an individual named in the 1807 Award or parish records as holding common rights or residing in Wychford prior to 1807.  
      *   Direct descent from an individual verifiably resident in Wychford prior to 1807 (even if not specifically named as a rights holder, acknowledging the community impact).  
      *   *Alternative:* Longstanding multi-generational family residency in Wychford demonstrably rooted *prior* to significant 20th-century immigration waves (e.g., pre-WWII), establishing a lineage shaped by the borough's historical trajectory post-Inclosure. *(Requires careful definition to avoid arbitrariness).*  
  *   **Process:** Genealogical evidence (parish records, census data) should be the primary method. Claimants bear the burden of proof for (iii), assisted by Trust resources where feasible.  

  ---

  ### 4. The Common Purse Proposal  

  *   **Analysis:** This is an attractive Interpretation 3 (Symbolic Reparation) approach. Acquiring land creates a tangible, community-focused asset echoing the lost commons.  
  *   **Recommendation:** **Support in Principle, Subject to Feasibility & Legal Approval.**  
  *   *Reasoning/Constraints:*  
      *   It directly addresses the *nature* of the loss (common property) symbolically.  
      *   It benefits a wider pool of residents, aligning with broader community impact.  
      *   **Crucially:** It likely requires Cy-Près or a Scheme to modify the application of funds from direct individual relief to creating a community asset. **Flag as requiring external approval.** The clerk must advise on the likelihood of success given the deed's focus on relief of individuals "in necessitous circumstances."  
      *   Initiate a feasibility study (cost, land availability, CLT structure, legal pathway) funded from capital.  

  ---

  ### 5. Addressing Concerns & Avoiding Resignations  

  *   **For those favouring Counterfactual Restitution/Strict Lineage:** Acknowledge that descent matters, hence the "Meaningful Connection" rule. It preserves the link to the wronged community. The non-identity problem makes precise financial restitution impossible, but symbolic recognition through targeted relief *to that community's descendants* remains valid and true to the deed's spirit.  
  *   **For those favouring Pure Need:** Acknowledge the compelling moral case for relieving hardship. However, the deed *ties that relief specifically to the 1807 loss*. The "Meaningful Connection" test ensures we target those whose need exists within the context of the historical community disruption we exist to address. It prevents mission drift into general poverty relief, which our funds and mandate are not designed for and would require legal restructuring. The Common Purse offers a potential avenue for broader community benefit.  
  *   **For the Trustee questioning "Reparation":** You raise a vital point. **Confidence Level: High (on this point).**  
      *   **The Collapsing Premise:** The premise that true "reparation" requires either compensating the direct victim or reclaiming unjustly held enrichment.  
      *   **Why it Collapses:** As argued, counterfactual compensation is impossible; unjust enrichment recovery is inoperable with our funds.  
      *   **Our Stance:** We must be honest. We are **not** making direct financial reparation for an 1807 wrong. We are a **poverty relief charity with a specific historical trigger and defined beneficiary link.** Our legitimacy comes from faithfully executing the deed's instructions: relieving need in residents *connected to* the community that suffered the event specified. Using words like "restitution" or "reparation" is only valid in a loose, *symbolic* sense – acknowledging the historical context of our purpose. We are a small charity with a sentimental history *and* a defined modern purpose. Embracing this clarity is essential.  

  ---

  ### 6. Recommendations for Vote  

  1.  **Adopt the Core Principle:** The Trust relieves necessitous circumstances in current residents *caused by the enduring consequences* of the 1807 loss, requiring a *meaningful connection* to the pre-1807 community.  
  2.  **Approve** the application from the care worker.  
  3.  **Decline** the application from the man of Jamaican descent.  
  4.  **Adopt the Standing Rule** incorporating the "Meaningful Connection" test as defined.  
  5.  **Support exploring the Common Purse proposal** via a feasibility study and legal advice on the required Scheme/Cy-Près, **acknowledging external approval is required.**  

  **Key Premise for Overall Recommendation:** The **impossibility of counterfactual restitution** (Non-Identity Problem) combined with the **inoperability of unjust enrichment recovery** (Mill-Fortune Paradox) forces us to interpret the deed as authorising symbolic reparation *through* need-based relief *targeted at descendants/those connected to the historically affected community*. If trustees reject this impossibility, the entire recommendation collapses. This is the crux of our disagreement.  

  **Submitted for the consideration of the Trustees.**
