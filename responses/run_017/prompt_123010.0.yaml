prompt: |-
  I want the specification before the theories. I am working on the norms governing assertion — whether the bar for permissibly stating something is knowledge, truth, reasonable belief, or something else — and before I weigh the candidates I want it fixed what such a norm is supposed to be for. Fix the purpose as follows: the norm should be able to do work elsewhere, underwriting both an account of what a hearer acquires when they are told something and an account of what institutions owe the public when they issue statements.

  Write the desideratum list on that understanding: the data any account has to accommodate, the distinctions it must not collapse, and the structural features it must have, each with the case or consideration that makes it a requirement. The distinctions I care about include sincerity versus warrant, the act's being defective versus the speaker's being blameworthy, and a norm constitutive of assertion versus one that merely regulates an act we could perform without it. Then sort the requirements into non-negotiable, negotiable, and mere prejudice of one camp — demands such as that the norm be a single unitary rule, or that it be formulable in terms of knowledge, strike me as things no theory should have to grant.

  Among the cases I want covered: hedged versus unhedged assertion; the infelicity of stating something while disavowing knowledge of it; assertions whose stakes are low for the speaker and the immediate audience but high for someone further downstream who will act on them; assertion addressed to no one who can take it up; assertion by a collective that has no single mind; and assertion of moral, aesthetic, or legal contents where truth-aptness is itself contested.

  Finally, say which pair of requirements you suspect cannot be jointly satisfied, and which single requirement does the most to exclude otherwise attractive candidates. Touch on the familiar norms only to mark where each fails a requirement; I will do the scoring myself.
reasoning: |-
  Okay, the user is deep into the philosophy of language, specifically the norms of assertion. They want a clear specification of desiderata before evaluating theories. Let me break down their request systematically.

  First, they emphasize the purpose: the norm must underwrite both what a hearer acquires from an assertion and what institutions owe the public. That's the dual foundation. I need to structure the desiderata around this core function.

  The distinctions they care about are crucial. Sincerity vs. warrant—how to handle cases like a believer who lacks evidence. Then, defective act vs. speaker blameworthiness, like unintentional falsehoods. And constitutive vs. regulative norms, which speaks to whether assertion is defined by the norm. These can't be collapsed.

  Key cases to cover: hedged assertions (how "I think" changes obligations), knowledge disavowal infelicity (Moorean paradox), downstream stakes (low for speaker, high for remote actors), assertions without an audience, collective assertions without a single mind, and contested domains like morality where truth itself is debated. Each tests different aspects.

  Now, sorting requirements into tiers. Non-negotiables: dual-purpose function, sincerity-warrant distinction, constitutive nature. These are bedrock. Negotiables might include whether the norm must cover all assertion types universally. Prejudices are demands for a single rule or knowledge formulation—theories shouldn't be forced into these boxes.

  The tension between "constitutive norm" and "non-mentalist cases" jumps out. If assertion is defined by a norm requiring individual warrant, how can collectives without unified minds assert? Yet institutions do assert. That's a probable dealbreaker clash.

  The "downstream stakes" requirement seems like the silent killer. Most norms focus on speaker/hearer context. Extending to third parties acting remotely—especially when stakes are asymmetric—could wreck otherwise elegant theories like reasonable belief or truth-based norms.

  I'll touch lightly on standard norms only to flag failures. Knowledge norm struggles with non-mentalist cases; truth norm can't explain blameworthiness gaps; reasonable belief falters on downstream stakes. But the user wants to score themselves, so just brief signposts.

  The user's framing suggests they're synthesizing epistemology, social practice, and institutional accountability. They might be preparing a paper or thesis chapter. Their rejection of "prejudices" hints they suspect existing debates are constrained by unexamined assumptions. I should honor that by keeping the desiderata neutral but rigorous.

  Biggest lift: making the constitutive norm requirement coexist with collective assertion. That might require rethinking "warrant" as something institutional rather than individual. But I won't solve it—just highlight the tension for their theory-building.
answer: |-
  Based on your stipulated purpose and concerns, here is a specification of desiderata for a norm of assertion, categorized and analyzed:

  **Core Purpose:** The norm must underwrite both:
  1.  **The Hearer's Acquisition:** Explaining what epistemic/communicative state a hearer gains or is entitled to form upon receiving an assertion ("being told").
  2.  **Institutional Obligation:** Explaining the specific epistemic duty institutions owe the public when issuing statements (e.g., press releases, scientific reports, government announcements).

  ## Non-Negotiable Desiderata (Essential for any viable theory)

  1.  **Dual-Purpose Functionality (D):** *The norm must be capable of fulfilling the Core Purpose.*
      *   *Case:* Explaining both why a citizen gains a defeasible right to rely on a public health warning *and* what epistemic standard the health agency violated if the warning was negligently issued (even if true by luck). A norm explaining only individual blameworthiness fails the institutional side.

  2.  **Sincerity/Warrant Distinction (D):** *The norm must accommodate assertions that are sincere but unwarranted, and warranted but insincere, marking different defects.*
      *   *Case:* (Sincere/Unwarranted) A conspiracy theorist asserts P based on flawed reasoning, genuinely believing it. (Warranted/Insincere) A corrupt scientist asserts true, well-supported P while privately disbelieving it for personal gain. The norm must mark the first as defective due to warrant, the second due to sincerity.

  3.  **Defective Act / Blameworthy Speaker Distinction (D):** *The norm must allow for assertions that are defective (violate the norm) without the speaker being blameworthy, and blameworthy assertions that may not violate the core norm.*
      *   *Case:* (Defective not Blameworthy) Asserting P based on excellent but misleading evidence; P is false. The act is defective, but the speaker isn't culpable. (Blameworthy not Defective?) Asserting true P with warrant, but for malicious reasons (e.g., to embarrass). The act may satisfy the core norm but the speaker is blameworthy for motives.

  4.  **Constitutive Norm Requirement (S):** *The norm must be plausibly constitutive of the act of assertion itself, not merely regulative of a pre-existing act.*
      *   *Consideration:* If assertion is a distinct speech act, its defining rule(s) should set it apart from guessing, conjecturing, opining, or commanding. A merely regulative norm (e.g., "be polite") doesn't define the act.

  5.  **Hedging Accommodation (D):** *The norm must explain the function and normative effect of hedges (e.g., "I think," "probably").*
      *   *Case:* Asserting "P" vs. "I think P." The latter intuitively lowers the normative bar or shifts the responsibility accepted. The norm must explain *how* hedging modifies the speaker's commitment relative to the unhedged case.

  6.  **Knowledge-Disavowal Infelicity (D):** *The norm must explain the infelicity/paradoxical nature of asserting P while adding "but I don't know that P".*
      *   *Case:* Moorean Paradox: "It's raining, but I don't know it is." Any viable norm must render this combination problematic.

  ## Negotiable Desiderata (Theories may reasonably differ, but solutions must be plausible)

  7.  **Downstream Stakes Sensitivity (D):** *The norm must account for assertions where stakes are low for speaker/immediate audience but high for a remote party who will act on the assertion.*
      *   *Case:* A researcher casually mentions an unverified preliminary finding (low stakes for lab group); a journalist overhears and publishes it; a policymaker acts on it with significant consequences (high stakes). Does the researcher's original assertion incur greater normative responsibility due to foreseeable downstream use?

  8.  **Non-Addressed Assertion (D):** *The norm must accommodate assertions not directed at any specific hearer who can "take it up" (e.g., diaries, public proclamations into the void).*
      *   *Case:* A statement etched on a monument asserting a historical claim to future, unknown generations. Does the core norm still apply? What constitutes "acquisition" here?

  9.  **Non-Mentalist Assertion (D):** *The norm must accommodate assertions by collective agents lacking a single, unified mind (e.g., corporations, governments, committees).*
      *   *Case:* A corporate press release stating earnings. The norm must apply meaningfully to the collective entity, distinct from the epistemic states of individual drafters/approvers.

  10. **Contested Domain Applicability (D):** *The norm must apply meaningfully to assertions in domains where truth-aptness is contested (e.g., moral, aesthetic, legal assertions).*
      *   *Case:* Asserting "That policy is unjust" or "That painting is beautiful." The norm must specify the relevant standard of correctness/warrant for such assertions, even granting meta-ethical/ontological debates.

  ## Mere Prejudices (Should not constrain theory-building)

  11. **Single Unitary Rule Prejudice (S):** The demand that the norm be one simple, exceptionless rule (e.g., "Assert only what you know"). Complex acts may have complex norms.
  12. **Knowledge-Formulability Prejudice (S):** The insistence that the norm *must* be stated using the concept "knowledge" (e.g., "Assert only what you know"). Other concepts (truth, justification, reasonableness, supportedness) may be fundamental.
  13. **Blameworthiness as Core Prejudice (S):** The conflation of the constitutive norm with the conditions for speaker blameworthiness. While related, they are distinct (see Desideratum 3).

  **Suspected Incompatible Pair:** **Constitutive Norm Requirement (4)** and **Non-Mentalist Assertion (9)** present a deep tension.
  *   Constitutive norms often link the act's nature to the *speaker's* state (belief, knowledge, evidence). How can this apply constitutively to a diffuse collective lacking a unified cognitive state? Can a "collective warrant" exist that isn't reducible to, or significantly different from, individual warrants? Resolving this requires significant conceptual innovation regarding collective agency and epistemic grounding.

  **Most Exclusionary Requirement:** **Downstream Stakes Sensitivity (7)** does the most work in excluding otherwise attractive candidates.
  *   **Truth Norm:** Fails utterly. If you assert a truth based on good evidence (satisfying Truth + perhaps sincerity/warrant), why should *foreseeable* downstream consequences raise the bar?
  *   **Knowledge Norm:** Struggles significantly. If you know P (based on your context/stakes), why should *others'* stakes retroactively make your assertion impermissible? It pushes towards highly context-sensitive or "impurist" knowledge, which many find unattractive.
  *   **Reasonable/Justified Belief Norm:** Also struggles. Your belief may be perfectly reasonable *given your context and stakes*. Holding you responsible for remote, high-stakes contexts you couldn't anticipate seems overly demanding and disconnected from the speaker's epistemic situation at the time of assertion.
  *   *Why it's exclusionary:* It forces the norm to incorporate elements of *foreseeable social impact* or *reasonable audience construal* that are external to the speaker's immediate epistemic state and relationship with the direct hearer, fundamentally altering the nature of the proposed norm.

  ## Familiar Norm Failures (Illustrative, not exhaustive)
  *   **Truth Norm:** Fails (3) (Defective act without blameworthiness - false but reasonable assertion), likely fails (7) (Downstream Stakes), struggles with (10) (Contested Domains if truth-aptness is denied).
  *   **Knowledge Norm:** Faces significant challenges with (9) (Non-Mentalist Assertion - collective knowledge?), (7) (Downstream Stakes - context-sensitivity of knowledge?), and potentially (10) (Contested Domains - moral knowledge?).
  *   **Justified/Reasonable Belief Norm:** Faces major pressure from (7) (Downstream Stakes - reasonableness relative to whom?), may struggle with (1) (Institutional Obligation - what counts as institutional justification?), and (4) (Constitutive? - seems more regulative).
  *   **Belief Norm (Assert only what you believe):** Fails (2) (Sincerity/Warrant - says nothing about warrant), fails (1) (Institutional Obligation - institutions don't "believe"), fails (6) (Knowledge-Disavowal - no inherent link to knowledge).

  This specification provides the rigorous framework you requested, centered on your defined purpose and critical distinctions, while highlighting the key tensions and exclusionary power of the downstream stakes requirement. You are now equipped to score candidate theories against these desiderata.
