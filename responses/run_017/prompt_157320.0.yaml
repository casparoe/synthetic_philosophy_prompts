prompt: |-
  A port city with its own legislative assembly decides some questions by binding referendum, and a standing Franchise Board fixes the demos separately for each referendum instead of applying one permanent franchise. On the last referendum, about harbour dues, its verdicts were: resident citizens, in; non-citizen residents of eight or more years' standing, in; seasonal workers present four months of the year, out; former residents who have moved away permanently and retain neither property nor tax liability, out; and, over recorded dissent, absentee owners of businesses registered in the port, who live abroad and visit twice a year, in. Its written reasons invoke two formulas: that the demos for a decision should contain everyone whose serious interests that decision will materially affect, and, in the case that produced the dissent, a nowhere-else-to-be-heard test — those whom no other assembly has any reason to weigh, because their own government will not take up their case and they have standing nowhere else.

  The next referendum is on closing the container port and returning the estuary to wetland. The question before the Board is whether to enfranchise the residents of a town twenty kilometres downstream, across the border in the neighbouring country, whose piped water and whose single large employer both depend on the estuary remaining open, and whose own government has shown no interest in their position. They are not subject to the city's laws, owe it no taxes, and cannot vote in its elections.

  Predict the Board's ruling on the downstream town, and say what it should rule if it wants to be consistent with its own record. Set out the competing rules explicitly — affectedness, subjection to the city's coercive power, durable stake or social membership, the nowhere-else-to-be-heard test, or something better — say which of them fit the earlier verdicts and which come apart on this one, name the single further case that would best tell the surviving rules apart, and identify which precedent is genuinely the closest analog. Finally, separate what is comparatively settled about the boundary problem from what is contested among people who work on it, and mark clearly whenever you are taking a contested side.
reasoning: |-
  Hmm, this is a fascinating political theory puzzle about democratic boundary-setting. The user presents a highly specific case study of a port city's Franchise Board grappling with inclusion principles for referendums. 

  First I need to parse all the moving parts: the Board's past rulings establish several inclusion/exclusion logics (affected interests, nowhere-else-to-be-heard), while the new case introduces cross-border impacted communities. The user wants both predictive and prescriptive analysis with philosophical grounding.

  Noticing how meticulously the user constructed this - it's clearly testing boundary problems in democratic theory. The absentee business owners precedent feels deliberately tricky since they were included despite minimal physical presence. Meanwhile the downstream town has massive material stakes but zero institutional ties to the city. 

  The key tension emerges between affectedness (which would include the town) and coercion-based membership (which would exclude them). The nowhere-else-to-be-heard test becomes crucial here since their own government ignores them. I recall similar debates in Goodin's "all affected interests" theory versus Bauböck's stakeholder models.

  For prediction, the Board's pattern suggests they'll stretch to include the town - their previous dissent override for absentee owners shows receptiveness to extra-territorial claims when vital interests are unprotected elsewhere. But consistency is messy because the physical/civic detachment is greater here. 

  Philosophically, this exposes the core dilemma in democratic boundary problems: circularity (demos defines itself) versus arbitrariness. The user seems aware of this from their "contested/settled" request. I should flag where theorists disagree - like whether "affectedness" requires proximity thresholds or can extend indefinitely downstream (literally here!). 

  The perfect test case? Hypothetical absentee workers who are materially affected but have representation elsewhere. That would force the Board to choose between affectedness and nowhere-else-to-be-heard when they conflict. Right now these principles align for the downstream town.
answer: |-
  Based on the Franchise Board's established precedents and reasoning, here is the analysis:

  1.  **Prediction for Downstream Town:** The Board will **enfranchise** the residents of the downstream town.
  2.  **Consistent Ruling:** To be consistent with its record, the Board **should enfranchise** them.

  **Competing Rules:**

  *   **Affectedness (Invoked):** "everyone whose serious interests that decision will materially affect." (Strong fit for downstream town - water & jobs).
  *   **Subjection to Coercive Power:** Exclusion based on not being subject to the city's laws/taxes/voting. (Fits exclusion of seasonal workers, former residents).
  *   **Durable Stake / Social Membership:** Implied by residency/citizenship requirements. (Fits inclusion of residents/citizens, exclusion of seasonal/former residents).
  *   **Nowhere-Else-to-Be-Heard Test (Invoked):** "those whom no other assembly has any reason to weigh." (Strong fit for downstream town - own government uninterested).
  *   **Formal Legal Status (Citizenship/Property/Tax):** Evident in inclusions/exclusions, but overridden for absentee owners.

  **Analysis of Fit with Earlier Verdicts:**

  *   **Fits All Verdicts Well:**
      *   **Affectedness:** Harbour dues affect residents (in), citizens (in), likely absentee owners (businesses affected, in). Less directly affects seasonal workers (out), former residents (out). *Downstream town is clearly materially affected.*
      *   **Nowhere-Else-to-Be-Heard:** Absentee owners (in - dissent case: own government abroad won't take up case). *Downstream town fits perfectly - own government shows no interest.*
  *   **Fits Most Verdicts, Conflicts Here:**
      *   **Subjection to Coercive Power:** Residents/citizens subject to laws/taxes (in). Non-citizen residents likely subject (in). Seasonal workers less subject? (out). Former residents not subject (out). Absentee owners *not* subject to laws/taxes/voting? (But included *despite* dissent, showing this principle was overridden). Downstream town not subject (out) - **conflicts** with the Board's decision to override this for absentee owners.
      *   **Durable Stake / Social Membership:** Resident citizens (in), long-term non-citizen residents (in) have stake/membership. Seasonal workers (out), former residents (out) lack durable stake. Absentee owners lack physical presence/social membership (but included). Downstream town lacks social membership in the city (out) - **conflicts** with inclusion of absentee owners.
  *   **Inconsistent:**
      *   **Formal Legal Status (Citizenship/Property/Tax):** Was overridden for absentee owners (in despite no citizenship/residency/property retained? / tax liability unclear), showing it's not determinative.

  **Key Conflict:** The downstream town case forces a choice between **Affectedness + Nowhere-Else-to-Be-Heard** (which strongly support inclusion) and **Subjection to Coercive Power + Durable Stake** (which support exclusion). The precedent of **including absentee owners** shows the Board prioritizes Affectedness + Nowhere-Else-to-Be-Heard over Subjection and Durable Stake when the former are strongly present and the latter are weak or absent.

  **The Crucial Precedent:** The **absentee business owners** case is the closest analog. Both involve:
  *   Strong material affectedness (businesses depend on port / town depends on estuary).
  *   Lack of subjection to the city's coercive power (absentees abroad / foreign citizens).
  *   Lack of durable stake/social membership in the city (physical absence / foreign residency).
  *   Meeting the nowhere-else-to-be-heard test (own government won't take up their case).

  **Best Test Case to Tell Rules Apart:**

  *   **Hypothetical:** *Resident citizens of a neighbouring country who work remotely for city-registered businesses, pay city taxes via withholding, and are directly affected by the decision, but whose own government is actively advocating for their interests.*
  *   **Why:** This tests the conflict between **Affectedness + Subjection (via tax)** and the **Nowhere-Else-to-Be-Heard** test. They are affected and subject to some power (taxation), but fail the nowhere-else test (their government *is* taking up their case). Would the Board include them based on affectedness/subjection or exclude them based on failing nowhere-else and lacking formal citizenship? This directly pits the two invoked principles against each other.

  **Settled vs. Contested in Democratic Boundary Theory:**

  *   **Relatively Settled:**
      *   The "boundary problem" exists: Defining the demos logically precedes democratic decisions but cannot itself be decided democratically without circularity. *(Most theorists accept this)*
      *   Purely territorial or birthright citizenship criteria are often seen as insufficient or arbitrary for justifying inclusion/exclusion in specific decisions. *(Widely acknowledged)*
      *   "All affected interests" is a powerful intuitive principle but faces severe practical limitations (indeterminate scope, chain effects). *(Common ground)*
      *   "All subjected" (to coercive laws) is a major competing principle emphasizing legitimacy and autonomy. *(Core principle in liberal theory)*
  *   **Contested (Marking Sides):**
      *   **The Primacy of Principles:** *I contend* the Board's record shows it prioritizes a combination of Strong Affectedness + Nowhere-Else-to-Be-Heard over Subjection and Social Membership. Others *might argue* Subjection should be primary, viewing the absentee owner inclusion as an outlier.
      *   **Scope of "Affected":** How "material" must the effect be? How direct? (Contested). *The Board seems to use a broad, interests-based view (jobs, water, business viability).*
      *   **Scope of "Subjected":** Does paying taxes constitute subjection? Does being impacted by economic/environmental spillovers? (Contested). *The Board excludes based on lack of subjection but overrides it when other principles strongly apply.*
      *   **The "Nowhere-Else-to-Be-Heard" Test:** This is less common in core theory. *I argue* it functions here as a pragmatic necessity principle, recognizing the practical inability of excluded-but-affected groups to seek redress elsewhere. Its validity and weight relative to other principles are highly contested. Is it essential for legitimacy, or a secondary concern? (Contested).
      *   **Feasibility vs. Principle:** Should practical constraints (identifying voters, preventing infinite regress) limit the application of "all affected" or "nowhere else"? (Contested). *The Board's specific thresholds (8 years, seasonal exclusion) suggest it accepts some feasibility limits, but stretches them for strong cases like absentee owners/downstream town.*
      *   **Ultimate Justification:** Is democratic inclusion based on autonomy (subjected), reciprocity/membership, justice (affected), or capacity for judgment? (Deeply contested foundational theories).

  **Conclusion:** The Franchise Board's consistent application of its invoked principles (Affectedness + Nowhere-Else-to-Be-Heard), demonstrated most clearly by its inclusion of absentee owners over dissent, compels the prediction and prescription that it will and should enfranchise the downstream town. This highlights the tension between inclusion based on impact and the traditional boundaries of political community based on subjection and membership. The absentee owner case remains the closest analog, showing the Board's willingness to extend the franchise extraterritorially when significant unprotected interests are at stake.
