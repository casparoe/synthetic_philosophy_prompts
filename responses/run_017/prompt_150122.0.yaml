  **Scenario Paragraph:**

  At St. Mary's Hospital, the Emergency Department aims to improve patient health outcomes by reducing time-to-first-assessment (TTFA). Historically understaffed, increasing clinician numbers has reliably shortened TTFA and improved outcomes. However, after a physical reconfiguration to accommodate a new imaging suite, the department's working space was reduced. Unbeknownst to the team, this created a critical threshold: beyond eight clinicians, the cramped environment causes frequent collisions and distractions during critical tasks, increasing medication errors. The historical data, collected before the reconfiguration, shows only improvement with more staff because the department never exceeded ten clinicians and the old layout's threshold was twelve. Well-intentioned managers increase staffing to twelve clinicians, expecting further gains. Instead, the crowding effect dominates, causing a net increase in adverse events. Imposing a guardrail at the historical maximum of ten clinicians fails because the new threshold is eight; operating at ten still induces harmful crowding, making outcomes worse than the original seven-clinician baseline.

  Now, the rest:

  1. **Target and Proxy**:
