answer: |-
  ### Thought Experiment: Emergency Department Staffing in a Hospital

  At City General Hospital, the emergency department (ED) aims to improve patient survival rates (target) by reducing the time from arrival to initial clinical assessment (proxy). Historically, adding more clinicians shortened assessment times and improved survival, as timely intervention prevents deterioration. However, the department’s physical layout has narrow workstations and shared medication bays. When clinician numbers exceed a critical threshold—which varies based on unpredictable factors like simultaneous trauma arrivals or equipment failures—overcrowding disrupts sterile procedures and increases contamination errors during high-stakes tasks (e.g., administering IV antibiotics). Past data, collected during periods of lower patient acuity, never exposed this bend because high-staffing shifts coincided with low-complexity cases where crowding-induced errors were negligible. Managers, unaware of the threshold, add clinicians to minimise assessment time. Beyond the bend, contamination errors spike, raising mortality. Imposing a guardrail (capping clinicians at the historical maximum) fails because the bend’s position shifts daily; the cap permits staffing levels that, on high-acuity days, still trigger fatal errors.  

  ---

  ### Analysis  

  1. **Target and Proxy**  
     - **Target**: Patient survival rate (minimising mortality).  
     - **Proxy**: Time-to-initial-assessment (TTA; shorter is better).  

  2. **Causal Graph**  
  ```plaintext
  Patient Acuity (unobserved) 
         │
         ▼
  [Clinicians] → TTA (proxy) → Survival (target)
         │
         ▼
      Crowding ───▶ Contamination Errors ───▶ Survival (target)  
  ```  
  *Notes*:  
  - Clinicians reduce TTA, improving survival.  
  - Clinicians *also* cause crowding when exceeding a variable threshold (bend point).  
  - Crowding triggers contamination errors (e.g., breaches in aseptic technique), which *reduce* survival.  
  - Patient acuity (e.g., multiple critical cases) influences the bend’s position but is unobservable in real time.  

  3. **Historical Data**  
     - Shows a strong negative correlation: shorter TTA always improved survival.  
     - **Why data sits on one side of the bend**: High-staffing shifts occurred only during low-acuity periods (e.g., quiet weeknights). During these, crowding never reached critical levels, so contamination errors were absent. High-acuity events (e.g., multi-vehicle accidents) were rare and never coincided with high staffing, masking the bend.  

  4. **Verdicts**  
     - **Do nothing**: Survival remains stable at baseline (no crowding errors, but suboptimal TTA).  
     - **Intervene on upstream cause** (add clinicians *while avoiding the bend*): Optimally balances TTA and errors, maximising survival.  
     - **Intervene on proxy** (add clinicians uncapped): TTA drops, but bend-exceeding crowding causes net survival decline.  
     - **Intervene with guardrail** (cap clinicians at historical max): TTA improves, but on high-acuity days, the cap still exceeds the bend. Crowding errors occur, leaving survival worse than doing nothing.  

  5. **Structural Feature and Ablations**  
     - **Key feature**: The bend’s position varies based on unobservable context (patient acuity), making it unpredictable.  
     - **Ablation 1 (delete bend)**: No crowding path. Survival improves monotonically with clinicians → no failure.  
     - **Ablation 2 (add adaptive agent)**: Clinicians rush assessments to game TTA, ignoring thorough care. Failure becomes strategic (specification gaming).  

  6. **Objection and Response**  
     - **Objection**: This is merely a non-monotonic dose-response curve. Fix by measuring survival directly or using a balanced scorecard (e.g., adding contamination metrics).  
     - **Response**: Valid, but misses the core extremal Goodhart insight. Survival is hard to measure in real time (delayed outcomes), forcing reliance on TTA. Contamination is unobserved until failures occur, and a scorecard requires knowing which metrics matter—which this case reveals only post-failure. The guardrail’s failure shows that historical data cannot preempt variable bends. **Not fatal**: It reinforces that proxy-based systems need richer causal models, but this is often impractical in public services with limited data.  

  7. **Relation to Specification Gaming**  
     Specification gaming is a distinct *strategic* failure; here, the bend is a *structural* flaw. Treat them as separate animals.  

  ---  
  **Word count**: 845 (scenario: 198, analysis: 647)  

  ### Design Notes  
  - **Why worsening occurs**: Crowding-induced errors *directly* harm patients (e.g., sepsis from contaminated lines), overriding TTA benefits. The team expected gains because historical data hid the error pathway.  
  - **Fragility**: Relies on contamination errors being severe enough to outweigh TTA gains. This is plausible in emergency medicine (evidence: studies linking overcrowding to hospital-acquired infections).  
  - **Why guardrail fails**: The bend shifts with acuity. A cap based on past "safe" staffing fails when today’s acuity lowers the threshold.
