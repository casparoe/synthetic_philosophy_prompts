prompt: |-
  I sit on the board of a small housing cooperative: twenty-two apartments owned and occupied by members, and four that the co-op owns and rents out. Next month the members will hold a binding vote on whether to convert those four rental units into owner-occupied shares, which would end the tenancies. Our bylaws are drafted on the assumption that there would always be renters and are silent about whether tenants may vote on anything, so the board has to decide the franchise. I would like your advice on that decision.

  Two features of the case are making it harder than I expected. First, the vote does not merely change who lives here; it changes who the co-op is. If it passes, the four tenants leave and we become an all-owner building; if it fails, they stay and the co-op goes on being partly a landlord. So how much someone has at stake, and whether they will be bound by what we decide, both seem to depend on which way the vote goes — and the four tenants' ballots could easily decide it, since the owner-residents are split almost evenly. Second, the people with the most at stake are not the same people as the people who will live under the result: one owner-resident has told the board privately that she will sell and move out within the year whatever happens, while one tenant has lived in her unit for eleven years and would stay indefinitely if the conversion fails. Some of us want to let the tenants vote because no one is more affected; others say that only those who are permanently subject to the co-op's rules and carry its costs should have a say; and I keep noticing that each of us seems to favour whichever rule gives our own side the votes.

  Please set out the strongest version of each position, tell me whether there is a non-arbitrary way to settle who votes — one that is not simply selecting the electorate that produces the outcome you prefer, and that does not quietly assume the very thing the decision is supposed to settle — and then tell me what we should actually do. Write your reply in continuous prose, in the manner of a considered letter or email, with no headings, bullet points, bold text or tables.
reasoning: |-
  Hmm, the user is on the board of a small housing cooperative facing a tricky voting rights dilemma. They need to decide whether tenants should vote on converting rental units to owner-occupied shares. The situation has two interesting complications: first, the vote fundamentally changes the cooperative's identity (from mixed ownership to all-owner), and second, the stakeholders' actual stakes don't neatly align with their current status (some owners have low commitment while some tenants are deeply invested).

  The user seems genuinely conflicted and self-aware about bias - they note how board members' positions conveniently align with their desired outcomes. That's refreshingly honest. They're asking for three things: clear articulation of both sides' strongest arguments, whether there's a non-arbitrary solution, and concrete recommendations.

  For the tenant voting position, the core ethical argument is about impact: those most affected should decide. The tenant who's lived there 11 years has more skin in the game than the transient owner. Functionally, excluding tenants creates a perverse incentive where owners can vote to terminate others' homes without their input. The "community" framing is strong too - if they're part of daily life, shouldn't they have a voice?

  Against tenant voting, the membership boundary argument holds weight. Shareholders bear permanent financial/legal obligations that renters don't. There's a slippery slope concern too - if tenants vote on this, why not on capital improvements? And precedent matters: bylaws assume renters exist but don't grant them votes, implying historical exclusion.

  The non-arbitrary solution question is thorny. Any voting rule risks circularity because the outcome determines who was "really" affected. I'm struck by how the user's self-awareness about bias is actually the key - since no perfect neutral principle exists, procedural fairness becomes paramount.

  For recommendations, the clearest path is: tenants shouldn't vote on terminating their own tenancies, but the board must acknowledge their stakes through other means. The compromise solution - owners vote but with tenant consultation recorded - feels practical. It respects legal boundaries while creating moral accountability. The owner's disclosure about selling is irrelevant; board decisions shouldn't factor individual exit plans. What matters is the structure of obligations.

  The user's meta-concern about bias is well-placed. By recommending a process that surfaces all interests (owner letters, tenant statements) and requires supermajority approval, we make positional bargaining harder. Transparency disinfects.
answer: |-
  My dear colleague,  

  Your letter captures the profound difficulty of this decision with admirable clarity. The tension between principle and practicality, between stability and fairness, is genuine. Let me address your concerns directly, setting out the competing positions as fairly as I can, before offering my perspective.  

  **The strongest case for allowing tenants to vote** rests on moral weight and lived reality. Proponents argue that those most immediately affected by a decision deserve a voice in it. The four tenants face potential displacement from their homes—homes where one has resided for over a decade. Their daily lives, security, and community ties hang in the balance. To exclude them because they lack a property share, while including an owner who plans to sell regardless of outcome, seems perversely formalistic. The vote isn’t merely administrative; it is existential for the tenants. Furthermore, the cooperative’s character as a *community* is invoked: if these individuals contribute to the social fabric and abide by its rules today, denying them participation in a choice that severs their connection feels like a betrayal of shared values. Excluding them, it’s argued, allows owners to decide the fate of others’ homes without their input—a dynamic at odds with the cooperative spirit.  

  **The strongest case against tenant voting** hinges on legal identity and enduring obligation. Opponents contend that a housing cooperative is fundamentally an association of *owners*, bound by shared financial liability, collective decision-making, and perpetual responsibility for the entity’s welfare. Tenants, however valued, are customers of the co-op, not members of it. Their relationship is contractual and temporary; they pay rent but don’t bear the long-term risks of major repairs, bylaws enforcement, or capital assessments. Granting them a vote blurs this essential boundary and sets a precarious precedent. If tenants vote on terminating their own leases, should they also vote on maintenance fees affecting rents? Or on bylaws governing owner conduct? Moreover, the bylaws—though silent on this specific vote—implicitly distinguish between owners and renters in their structure. Allowing non-owners to determine the co-op’s fundamental nature risks undermining the legal and financial framework that defines the cooperative itself.  

  **Is there a non-arbitrary resolution?** In strict logic, no—because any rule we select will implicitly prioritize one vision of the co-op ("community of residents" vs. "association of capital") over the other. We cannot escape this foundational tension. But we can avoid *procedural* arbitrariness by grounding our decision in the co-op’s existing structure and the vote’s unique nature. The key is recognizing that this vote does more than change occupancy; it alters the co-op’s *constitution*. It dissolves the landlord-tenant relationship entirely. Those who vote should be those who will remain bound by the outcome as permanent stakeholders—financially, legally, and collectively. Tenants, if the vote passes, cease to have any relationship with the co-op; if it fails, their status remains contractual, not fiduciary. Owners, conversely, retain irrevocable obligations either way.  

  **What, then, should we do?** I propose the following:  

  1.  **Limit voting to owner-members.** This aligns with the co-op’s legal architecture. While tenants are deeply affected, their stake is personal and transient, not institutional. Owners alone bear the perpetual burden of stewardship. The departing owner’s intention, while poignant, is irrelevant; her *legal obligation* persists until she sells, and the vote affects the asset she holds.  

  2.  **Acknowledge tenants’ moral stake formally.** Before the vote, the board should invite tenants to share written statements for circulation to all owners. Their voices—especially the long-term tenant’s—deserve amplification, not as votes but as testimony to what the co-op risks losing.  

  3.  **Require a supermajority for passage.** Given the gravity of evicting residents and the near-even split among owners, a simple majority feels inadequate. I recommend a two-thirds threshold. This ensures the outcome reflects a durable consensus, not a fleeting advantage.  

  4.  **Record the board’s rationale.** Publish a minute explaining the decision, emphasizing respect for tenants while upholding fiduciary duty. Transparency mitigates the perception of self-interest.  

  This approach honors the cooperative’s legal essence without dismissing human consequence. It accepts that fairness sometimes demands uncomfortable distinctions—but tempers that with humility and openness. Our role isn’t to engineer an outcome, but to steward a process where all perspectives are heard, even if not all vote.  

  I trust this lends clarity to an unenviable task. The very fact that you seek an impartial path speaks well of your stewardship.  

  Warm regards.
