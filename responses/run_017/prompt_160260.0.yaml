answer: |-
  Below is a decision tree designed to sort students among key positions on the problem of "dirty hands" in politics. The tree uses seven binary questions (Agree/Disagree) based on concrete cases, making it accessible without prior philosophy training. Each question isolates a core distinction in the logical space (e.g., doing vs. permitting, institutional role, publicity). After answering, students locate their position among the leaves, which include named views and unnamed combinations. For clarity, cases are italicized, and answers cascade from top to bottom.  

  ---

  ### **The Decision Tree**  
  *Start at Question 1. Answer Agree (A) or Disagree (D) to each claim.*  

  1. **Omission as Blameworthy**:  
     *A minister who does nothing and allows 100 preventable deaths is just as responsible as if she had actively caused them.*  
     - **A** → Go to Q2  
     - **D** → Go to Q3  

  2. **Commission as Justifiable**:  
     *A mayor who authorizes a raid she knows will kill one innocent to prevent a bomb killing 100 is morally justified.*  
     - **A** → Go to Q4  
     - **D** → Go to Q5  

  3. **Institutions Dissolve Responsibility**:  
     *A civil servant who leaks classified docs to stop a lawful but unjust policy is blameworthy—she isn’t above society’s rules.*  
     - **A** → Go to Q5  
     - **D** → Go to Q6  

  4. **Office Permits Exceptions**:  
     *A legislator voting for a flawed bill to block a worse one is permitted only because her role demands it (an ordinary person couldn’t).*  
     - **A** → Go to Q7  
     - **D** → Go to Q8  

  5. **Refusal Regardless of Cost**:  
     *An official must refuse to do wrong (e.g., authorize the raid), even if a worse person takes her job and causes more harm.*  
     - **A** → **Leaf: Absolutism**  
     - **D** → Go to Q9  

  6. **Guilt Follows Covert Action**:  
     *A campaign strategist who quietly benefits from a supporter’s smear would act less wrongly if she openly endorsed it.*  
     - **A** → **Leaf: Publicity Requirement**  
     - **D** → **Leaf: Unnamed (Omission Leniency)**  

  7. **Dilemma Origins Matter**:  
     *If the legislator’s flawed-bill dilemma arose from her own past choices (e.g., partisan tactics), her vote is impermissible.*  
     - **A** → **Leaf: Institutional Reform**  
     - **D** → Go to Q10  

  8. **Punishment Acceptable for Justified Acts**:  
     *The justified mayor must willingly accept punishment for the raid.*  
     - **A** → **Leaf: Classic Dirty Hands**  
     - **D** → **Leaf: Role Morality**  

  9. **Institutions Cause Dilemmas**:  
     *Dirty-handed dilemmas mostly arise from broken systems (e.g., polarised legislatures), not bad luck.*  
     - **A** → **Leaf: Institutional Reform**  
     - **D** → **Leaf: Unnamed (Prudential Permissibility)**  

  10. **Public Scrutiny Cleanses**:  
      *The legislator’s vote for the flawed bill would be less troubling if she publicly confessed it was wrong.*  
      - **A** → **Leaf: Classic Dirty Hands**  
      - **D** → **Leaf: Role Morality**  

  ---

  ### **Resulting Positions (Leaves)**  
  After answering all questions, match your answer-path to a leaf below. Each leaf includes:  
  - **Name** (or "unnamed"),  
  - **Most awkward commitment** (a key challenge),  
  - **Public treatment** (how society should respond to the official afterward).  

  | Leaf | Answer-Path | Name | Most Awkward Commitment | Public Treatment |  
  |------|-------------|------|--------------------------|------------------|  
  | 1 | 1A, 2D, 5A | **Absolutism** | Must let catastrophes happen to avoid moral corruption (e.g., the raid refusal allows 100 deaths). | Praise refusal; punish/remove if act done. |  
  | 2 | 1A, 2A, 4D, 8A | **Classic Dirty Hands** (Walzer) | The agent is *guilty* despite doing what’s necessary (justification ≠ innocence). | Demand public confession; tolerate but punish symbolically. |  
  | 3 | 1A, 2A, 4A, 7D, 10D | **Role Morality** (Weber) | Anything required by the office is guilt-free (e.g., torture if "part of the job"). | Tolerate; no punishment if act fits role. |  
  | 4 | 1A, 2D, 5D, 9A | **Institutional Reform** | Current dirty-handed acts are always wrong; focus solely on fixing systems. | Remove official if complicit; reward reformers. |  
  | 5 | 1A, 2A, 4D, 8D | **Unnamed: Prudential Permissibility** | No guilt for justified acts, but no special role permissions either (ordinary ethics suffices). | Praise if outcome good; blame if bad. |  
  | 6 | 1D, 3A, 5D, 9D | **Unnamed: Omission Leniency** | Inaction (e.g., the minister) is excusable, but action (e.g., the leak) isn’t—even to prevent harm. | Tolerate inaction; punish covert action. |  
  | 7 | 1D, 3D | **Publicity Requirement** (Rawlsian) | Covertness *makes* the act wrong (e.g., the strategist’s quiet smearing is corrupting). | Tolerate if public/justified; punish if covert. |  

  ---

  ### **Notes on the Tree**  
  - **Distinctions captured**:  
    - Doing (Q2) vs. permitting (Q1, Q3),  
    - Dilemma origins (Q7, Q9),  
    - Punishment/removal (Q8),  
    - Dirt on person (Leaves 2, 5) vs. office/systems (Leaves 3, 4).  
  - **Cases covered**: Legislator’s vote (Q4, Q7, Q10), mayor’s raid (Q2, Q8), minister’s inaction (Q1), strategist’s smear (Q6), civil servant’s leak (Q3), refusal enabling worse successor (Q5).  
  - **Required leaves hit**: Ordinary conflict (Leaf 5), justified act/guilty agent (Leaf 2), role permissions (Leaf 3), refusal required (Leaf 1), institutional reform (Leaf 4), publicity (Leaf 7).  
  - **Indistinguishable pair**:  
    - *Classic Dirty Hands* (1A→2A→4D→8A) and *Role Morality* (1A→2A→4A→7D→10D) **cannot be separated** on punishment (Q8 vs. Q10) if the agent feels guilt voluntarily. This reflects a real debate about whether guilt is felt or imposed.  
  - **Unoccupied combinations**:  
    - **1D→2A**: Blames omission less but permits commission (e.g., "inaction bad, action ok"). *Diagnosis: Unattractive*—absolves officials who "allow" disasters but praises those who "cause" lesser harms.  
    - **1A→2A→4A→7A**: Role permits dirty acts *unless* self-caused dilemma (e.g., "do evil only if forced"). *Diagnosis: Incoherent*—roles either override ordinary ethics or they don’t; origins shouldn’t flip permissions.  

  This tree isolates core tensions (e.g., Q5 forces a choice between purity and consequences) while showing why some combinations lack advocates. Use it to spark debate about real cases!
