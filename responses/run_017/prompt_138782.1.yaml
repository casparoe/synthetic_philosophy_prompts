prompt: |-
  You are a philosopher of mind and action who also advises research institutions on the epistemology of collective and distributed reasoning; you have written on how far recursive decomposition can serve as an idealization of careful deliberation, and on where that idealization breaks. Work carefully and in stages. Before you commit to anything, write a private brainstorming section in which you list at least four candidate principles that the decision-making body described below could be running, test each of them against every precedent, and note where each one strains. Only then give your ruling. Do not resolve the tension by declaring the whole exercise confused; the body's track record is imperfect but not arbitrary, and part of your job is to say which part of it is doing real work.

  Context. A large foundation answers hard questions using a recursive decomposition protocol of the kind discussed in the machine-intelligence literature under names like factored cognition or HCH. (If you do not know that literature, nothing below depends on it: everything you need is stated here.) A judge splits a question into sub-questions. Consultants answer each sub-question seeing only that sub-question and, where relevant, the answers to its children; no consultant sees the top-level question, the identity of the asker, or the sibling sub-questions, and this concealment is deliberate, on the theory that knowing the destination would contaminate the parts. The judge merges the sub-answers into an answer to the parent, and that answer becomes an input one level up.

  A standing review board decides, for each question the protocol is asked to answer, whether the question may be settled by decomposition at all or must instead be answered undistanced, in a single act by a designated person or by the board sitting together. The board also distinguishes two different denials: this question is not decomposable, versus this tree is not a decomposition of that question. And it has a third disposition short of approval: shadow mode, in which the tree is run anyway, its output is compared with an undistanced answer, and any divergence triggers review rather than being treated as the answer.

  The board's precedents, condensed from its minutes:

  1. Should the city approve the revised levee design? Approved without conditions: hydrology, geotechnical risk, cost, and environmental impact were split out and recombined by the judge.

  2. What was the median household income in the district last year? Approved with a note that this is the sort of thing the protocol exists for.

  3. Should the journal publish the dual-use paper? Approved on the second attempt, with two conditions: the consultants assessing expected benefit and misuse potential were not told which recommendation the editors were thought to favour, and the judge had to write a synthesis memo stating the weights used.

  4. Which of the two finalists should be hired? Split disposition: the tree was approved for scoring each candidate on stated dimensions, but the final choice was reserved to the committee, which had to read the dimension scores and then decide itself. The reasoning was that the choice had to be the committee's own.

  5. Was the defendant's confession voluntary? Denied. The board held that pressure, duration, and vulnerability cannot be assessed separately without changing what each of them is, and that the judgment is about the interrogation as a whole.

  6. Did Ana act courageously? Denied, on the ground that the verdict is not built additively out of independently answerable parts.

  7. Is this recording of the late quartet beautiful? Denied, with the observation that even a well-run tree would only tell you what such a tree says about the recording.

  8. Should I forgive my brother? Denied on a different ground: the answer is not a report on a state of affairs but the stance itself, and a stance cannot be delegated to parts that do not know they are contributing to it.

  9. Should the lab promote Ravi? The board refused to rule the question undecidable, but rejected the proposed tree: its sub-questions were framed so as to invite a list of Ravi's shortcomings, with no paired questions about the other candidate. It invited a re-specified tree.

  10. Is the contractor's statistical analysis sound? Approved, even though no single consultant read the analysis as a whole and no consultant was told what conclusion the analysis was used to support.

  The new case. The Halvorsen Institute was founded in 1961 to study human population biology. Between 1968 and 1979 one of its research programmes produced data sets and a classificatory scheme that were later cited in another country to justify a programme of compulsory sterilisation. The Institute never performed or advocated the sterilisation, and whether its work was a cause of it, a pretext for it, or merely available to it is genuinely contested. The Institute's current director has asked the protocol a two-part question: should the Institute issue a public acknowledgment, and if so, what should the acknowledgment say?

  The tree the protocol office has proposed has four top-level sub-questions, to be answered by consultants who do not know they are working on this question: (a) what did the Institute's programme actually do, and what was known in the field at the time; (b) how strong is the causal chain from the data sets and the classification to the sterilisation programme, compared with available counterfactual accounts; (c) what do comparable institutions do when their historical materials have been used this way; (d) would an acknowledgment help or damage the Institute's standing with its funders and its scientific partners. A judge would combine the four into a yes or no and, if yes, into a draft statement.

  What I want from you, in about 900 to 1,100 words, under headings:

  First, the candidate principles. State at least four rules the board could be running that fit all ten precedents, name each one, and say where each of them explains a precedent less well than it appears to.

  Second, what each rule predicts about the new case, treating the three parts separately where they come apart: the historical and causal findings, the yes-or-no decision whether to acknowledge, and the drafting of the wording.

  Third, your recommended disposition for the board, if the board wants to be consistent with itself. Say which precedent is the closest analog and why, say whether the ruling should be approval, denial, a split disposition, or shadow mode, and say plainly what principle the board would be adopting with each of the options it rejects. If its precedents genuinely underdetermine the case, say so and say what the board would have to concede about itself either way.

  Fourth, an assessment of the proposed tree: is any defect you find in it a defect of the tree or of the question, and does the board's own distinction in precedent 9 settle which?

  Finally, name one or two further cases the board could put to itself that would best separate the two rules you take to be the live contenders, and say what each rule predicts about them.
reasoning: |-
  Hmm, the user is asking me to role-play as a philosopher of mind and action with expertise in collective reasoning systems. They've presented a complex case involving a foundation's recursive decomposition protocol and its review board's precedents. I need to analyze a new case about whether an institute should issue an apology for historical research that was misused.

  The user wants me to follow a very structured approach: first brainstorm candidate principles that explain all ten precedents, then apply them to the new case, make a recommendation, assess the proposed question tree, and suggest test cases. The key challenge is that the precedents contain apparent contradictions - some questions are approved for decomposition while similar-seeming ones are denied.

  Looking at the precedents, I notice several patterns: factual questions (#2) are easily approved, while value-laden (#5,6,7,8) or synthetic judgments (#5) are often denied. There's also concern about bias (#3), institutional responsibility (#4), and framing effects (#9). The sterilization case involves both factual elements and moral/political judgment.

  For candidate principles, I consider:
  1) The Epistemic Independence Principle - whether sub-questions can be answered without context
  2) The Ontological Composition Principle - whether the whole is reducible to parts
  3) The Stance-Constitution Principle - whether the answer creates rather than reports
  4) The Institutional Role Principle - about who must own the decision

  Each has weaknesses: Principle 1 struggles with precedent #10, Principle 2 with #1, Principle 3 with #4, and Principle 4 with #2. For the new case, Principle 1 would approve parts but not the whole, Principle 2 would deny, Principle 3 would deny the decision but approve facts, and Principle 4 might require board ownership.

  I think precedent #8 about forgiveness is the closest analog - both involve taking a moral stance. But precedent #3 shows value judgments can sometimes be decomposed with safeguards. The board's distinction in #9 suggests the tree could be fixed, but the core issue is whether "should we apologize" can be delegated.

  My recommendation is a split disposition: approve decomposition for facts (sub-questions a,b,c) but require the board to make the yes/no decision and draft the statement, using the factual reports as input. This respects the institutional responsibility concern while leveraging the protocol's strengths.

  The proposed tree's main defect is framing sub-question (d) about institutional standing rather than moral responsibility - this reflects a flaw in the question's conception. Precedent #9 shows this could be fixed, but the core delegation problem remains.

  To clarify the underlying principles, I suggest test cases about art valuation and medical triage - these would force the board to decide whether some judgments are inherently non-decomposable.
answer: |-
  ## Private Brainstorming: Candidate Principles

  Before committing to an analysis of the new case, I must generate and test candidate principles that explain the board's pattern of approvals and denials across the ten precedents. Each principle must accommodate all precedents without contradiction, though some will fit better than others. I note where each principle "strains" – where it provides a less satisfying or more forced explanation for a precedent.

  1.  **Principle of Non-Decomposable Phenomenology (Phenomenal Unity):**
      *   **Rule:** A question cannot be decomposed if its answer requires a direct, unified apprehension or evaluation of an irreducible experiential whole. The "what-it's-like" or the evaluative gestalt cannot be reconstructed from atomized reports.
      *   **Precedent Fit & Strain:**
          *   Fits #5 (Confession Voluntariness): The pressure, duration, and vulnerability are experienced *together* by the defendant; their interaction *is* the phenomenon judged.
          *   Fits #6 (Courage): Courage is a holistic assessment of action-in-context, not a sum of bravery + risk calculation + noble cause.
          *   Fits #7 (Beauty): Beauty judgment requires direct aesthetic experience; decomposed reports are *about* the experience, not the experience itself.
          *   **Strains on #1 (Levee):** While complex, the levee design's components (hydrology, cost, etc.) *are* functionally separable and quantifiable. The principle struggles to explain why this gestalt *is* decomposable when courage or beauty are not. It implies the levee assessment isn't truly *phenomenological* in the same way, but this distinction feels arbitrary without more criteria.
          *   **Strains on #10 (Statistical Soundness):** Soundness is arguably a gestalt property of the analysis as a whole. The principle must argue that soundness is *epistemically* rather than *phenomenally* holistic, or that its components (method choice, execution, interpretation) *can* be assessed independently without losing the essence. This is possible but requires careful defense against #5/#6/#7.

  2.  **Principle of Non-Delegatable Stance-Constitution (Constitutive Commitment):**
      *   **Rule:** A question cannot be decomposed if answering it *constitutes* adopting a normative stance, attitude, or commitment that must be owned directly by the responsible agent(s). The answer isn't a report *about* the world but an act *in* the world that cannot be meaningfully outsourced to parts unaware of the act they are performing.
      *   **Precedent Fit & Strain:**
          *   Fits #4 (Hiring Final Choice): The committee *must* own the choice; it's their constitutive act of selection and endorsement.
          *   Fits #8 (Forgiveness): Forgiveness *is* the stance; delegating its calculation voids the act. The forgiver must know they are forgiving.
          *   Fits #3 (Dual-Use Publish) *Conditionally:* The conditions (masking bias, requiring weight disclosure) mitigate stance-delegation risks by forcing transparency and limiting influence, suggesting the *judgment* (benefit vs. risk) *can* be decomposed, but the *decision* (publish/not) might still require ownership. The principle explains the need for conditions but strains on why judgment decomposition is *allowed*.
          *   **Strains on #2 (Median Income):** A pure fact-finding exercise, no stance constituted. Fits perfectly, but doesn't test the core of the principle.
          *   **Strains on #1 (Levees):** Approval implies that the "should" here is seen as a conclusion *about* risks/benefits, not a constitutive commitment *by* the foundation. The principle must argue convincingly that infrastructure approval is fundamentally different from forgiveness or hiring in terms of stance-constitution.
          *   **Strains on #5/6/7:** While these involve evaluation, the principle must distinguish why *this* evaluation (voluntariness, courage, beauty) isn't stance-constitution in the same way forgiveness is. Are they "reports" on properties rather than commitments? This feels blurry.

  3.  **Principle of Contextual Indispensability (Irreducible Context-Dependence):**
      *   **Rule:** A question cannot be decomposed if the meaning or truth-value of any essential sub-question critically depends on the context of the whole question, such that isolating the sub-question fundamentally changes what is being asked or answered. The parts lose their identity or significance outside the whole.
      *   **Precedent Fit & Strain:**
          *   Fits #5 (Confession): Assessing "pressure" depends entirely on the context of the specific interrogation and vulnerability; isolated assessment is meaningless.
          *   Fits #6 (Courage): Assessing "risk" depends on the specific context and goal; isolated assessment loses relevance.
          *   Fits #9 (Promote Ravi): The proposed sub-questions lacked the necessary context (the other candidate), making them misleading/incomplete. Fits the "tree not decomposition" denial.
          *   **Strains on #10 (Statistical Soundness):** Approved despite the holistic nature of soundness. The principle must argue that while context *matters* for interpretation (hence the concealment of the conclusion it supported), the core components *can* be assessed for soundness (method choice, execution, internal validity) without knowing the ultimate use, *as long as* the question is purely about internal soundness. This requires accepting a narrower scope for "context."
          *   **Strains on #3 (Dual-Use):** Approved with conditions masking the editors' bias. This shows contextual knowledge *can* be deemed harmful and excluded, implying sub-questions *can* be insulated from some aspects of the top-level context. The principle struggles to define which contextual elements are indispensable vs. contaminating.
          *   **Strains on #1 (Levees):** Hydrology, cost, etc., were deemed separable *from each other and the whole*. The principle must argue that the context (the specific levee design & location) *was* adequately captured in each sub-question specification.

  4.  **Principle of Institutional Role Integrity (Agency Non-Alienation):**
      *   **Rule:** Decomposition is impermissible if it would alienate the responsibility for a judgment or decision that inherently belongs to a specific agent or body, violating the integrity of their role. The answer must be traceable to an act of judgment by the entity entrusted with that duty.
      *   **Precedent Fit & Strain:**
          *   Fits #4 (Hiring Final Choice): The committee's role *is* to choose; decomposing the final choice alienates their core function.
          *   Fits #8 (Forgiveness): The "I" must own the stance; delegation alienates personal responsibility.
          *   Fits #5 (Confession) & #6 (Courage) *by extension:* The judge/jury's role is to apprehend the whole phenomenon; decomposing alienates that evaluative duty.
          *   **Strains on #1 (Levees):** Approval implies the foundation (acting as judge) can delegate the *components* of the assessment without alienating its role in the final approval decision. The principle must clearly define the boundary between delegatable *fact-finding/analysis* and non-delegatable *final judgment* for different roles.
          *   **Strains on #2 (Median Income):** Pure delegation of fact-finding, perfectly acceptable under this principle. Doesn't test the core conflict.
          *   **Strains on #3 (Dual-Use):** Approval implies the *judgment* of benefit vs. risk *can* be delegated (with safeguards), while the *editorial decision* might still rest with the editors (implied but not stated). The principle struggles to explain why *this* judgment is delegatable when the confession/courage judgments are not, beyond appealing to the specific institutional role of the journal/protocol.
          *   **Strains on #7 (Beauty):** The denial reason ("only tell you what such a tree says") hints at alienation – the answer isn't *the board's* aesthetic judgment but the tree's output. Fits well.

  ---

  ## Candidate Principles and Predictions for the Halvorsen Case

  1.  **Phenomenal Unity:**
      *   **Historical/Causal Findings (a,b):** *Approved.* These appear to be factual reports about past events and causal chains, potentially decomposable without requiring a unified phenomenal experience.
      *   **Yes/No Decision & Wording (c,d -> Synthesis):** **Denied.** The decision to acknowledge and the wording constitute a complex moral/political/institutional stance regarding responsibility, harm, and reconciliation. This stance involves an irreducible evaluative gestalt concerning the Institute's identity and relationship to its history and victims. Knowing "comparable actions" (c) or "impact on standing" (d) feeds into this, but the core judgment of "should we, and what does that mean?" requires a unified apprehension of the moral weight. Precedent #8 (forgiveness) is the strongest analog.
      *   **Overall:** Split Disposition or Denial of the top-level synthesis.

  2.  **Constitutive Commitment:**
      *   **Historical/Causal Findings (a,b):** *Approved.* Reporting facts does not constitute a stance.
      *   **Yes/No Decision & Wording (c,d -> Synthesis):** **Denied.** Issuing an acknowledgment (or deciding not to) is a performative act by the Institute constituting an official stance on its past and its responsibility. This act of moral and institutional accounting cannot be delegated to consultants unaware they are crafting such a stance. The answer *is* the commitment. Precedent #8 (forgiveness) is the closest analog. Precedent #3's allowance for decomposed *judgment* (benefit/risk) doesn't extend to *this* kind of constitutive act.
      *   **Overall:** Split Disposition or Denial of the top-level synthesis.

  3.  **Contextual Indispensability:**
      *   **Historical/Causal Findings (a,b):** *Approved (Conditionally).* While the causal chain (b) might be assessable independently, the historical context (a) and causal assessment (b) are deeply intertwined with the *meaning* of the sterilization program. However, if specified carefully to include the relevant context *within* the sub-question, it *might* pass (like #10). Strain similar to #10.
      *   **Yes/No Decision & Wording (c,d -> Synthesis):** **Likely Denied.** Sub-question (c) "comparable institutions" loses meaning without knowing *this* Institute's specific history and context. Sub-question (d) "impact on standing" is inherently defined by what the acknowledgment *is* and *says*, creating circularity if the wording isn't known. The synthesis requires understanding the unique moral and historical weight *of this specific case*, which the isolated sub-questions cannot capture. Precedent #9 (flawed framing) is relevant, but the flaw here seems deeper – the context *is* indispensable. Precedent #5/6/7 are stronger analogs for the synthesis.
      *   **Overall:** Likely Denial, or Shadow Mode to test if context isolation fatally distorts sub-answers.

  4.  **Institutional Role Integrity:**
      *   **Historical/Causal Findings (a,b,c):** *Approved.* Fact-finding and comparative analysis can be delegated.
      *   **Yes/No Decision & Wording (c,d -> Synthesis):** **Denied.** The decision to acknowledge and the crafting of the acknowledgment constitute a core act of institutional moral responsibility and identity formation for the Halvorsen Institute. This responsibility cannot be alienated to a decomposed process; the Director and/or governing board *must* own this act directly. Precedent #4 (final hiring choice) and #8 (forgiveness) are strong analogs. The decomposed output could inform the decision, but the act itself must be undistanced. Precedent #3 shows delegated *judgment* is possible, but this is a different level of institutional commitment.
      *   **Overall:** Split Disposition: Approve decomposition for (a,b,c), deny for the synthesis (Yes/No & Wording), reserving the final decision and drafting to the Director/Board, informed by the factual reports.

  ---

  ## Recommended Disposition & Principle

  **Closest Analog:** Precedent #8 ("Should I forgive my brother?") is the strongest analog for the core "should we acknowledge?" question. Both involve taking a profound moral stance that constitutes the answer itself. Precedent #4 (reserving the final hiring choice) is also highly relevant regarding institutional ownership. Precedent #9 highlights a framing flaw, but the issue here is deeper than just framing.

  **Recommended Disposition:** **Split Disposition.**

  *   **Approve** the decomposition for sub-questions (a), (b), and (c) ("what did the programme do/know?", "causal chain strength?", "what do comparable institutions do?"). These are factual or analytical components where isolation may reduce bias and the protocol excels.
  *   **Deny** the decomposition for the top-level synthesis – the "Yes/No" decision and the drafting of the wording. This decision and act of drafting constitute the Institute's official stance and must be owned directly by the Director and/or governing board, informed by the outputs of (a), (b), and (c). Running the tree for synthesis would violate Institutional Role Integrity and Constitutive Commitment.

  **What the Board Adopts/Rejects:**
  *   **By Approving factual decomposition:** The Board affirms that factual history, causality, and comparable cases *can* be assessed distanced, supporting Contextual Indispensability *if* questions are well-framed, and aligning with Epistemic Independence for factual matters.
  *   **By Denying synthesis decomposition:** The Board affirms the Principles of Constitutive Commitment ("should we?" is the stance itself) and Institutional Role Integrity (the Institute *must* own its moral accounting). It implicitly rejects applying a pure Phenomenal Unity argument to the facts or a Contextual Indispensability argument that the facts *cannot* be isolated, and rejects extending the judgment-decomposition logic of #3 to this level of institutional self-definition.
  *   **Rejecting Full Approval:** Avoids the risk of an alienated, context-stripped stance (violating Commitment/Role Integrity) or a distorted synthesis due to indispensable context loss.
  *   **Rejecting Full Denial:** Acknowledges the protocol's value for the factual/analytical components, avoiding unnecessary blanket rejection.
  *   **Rejecting Shadow Mode:** While potentially informative, Shadow Mode for the synthesis still runs the core risk – generating an answer that *could* be mistaken for the Institute's owned stance during the process or in review, and doesn't resolve the fundamental non-delegatability. It's insufficient for this core issue.

  **Underdetermination?** The precedents strongly point towards non-delegatability for the synthesis, especially given #4 and #8. A consistent board cannot approve full decomposition without significantly weakening the force of #4 and #8, implying that only personal, not institutional, stances are non-delegatable, or that some institutional stances lack the requisite gravity. Conversely, denying decomposition for the *facts* would contradict #1, #2, #10, and the spirit of #3, implying a much broader skepticism about decomposition than the board has shown. The split disposition respects the full range of precedents.

  ---

  ## Assessment of the Proposed Tree

  The proposed tree has a significant **defect**, and it stems primarily from **a defect in the conception of the question**, though it manifests *in* the tree.

  1.  **Defect in the Tree/Question:** Sub-question (d) "would an acknowledgment help or damage the Institute's standing..." is problematic. It frames the core moral/political decision primarily in terms of instrumental consequences (standing with funders/partners) rather than inherent responsibility or moral duty. This reflects a flawed conception of the "should" question – reducing it to a reputational cost-benefit analysis. Precedent #9 is directly relevant here: the tree is framed to invite answers skewed towards one perspective (cost/risk) without a counterbalancing question about moral obligation, historical responsibility, or duties to affected communities. The proposed tree lacks a sub-question like "What does moral responsibility demand of the Institute in light of its history and the misuse?"

  2.  **Board's Distinction (Precedent 9) and Which Defect:** Precedent #9 distinguishes between "question not decomposable" and "tree not a decomposition of that question." The flaw in sub-question (d) strongly suggests the **tree is not a proper decomposition of the intended question**. The omission of a sub-question addressing the core issue of *moral responsibility* means the tree fails to decompose the actual normative weight of "should we acknowledge?". It decomposes a *different*, more instrumental question. Fixing the tree (e.g., adding a sub-question on moral responsibility) would be necessary for a *proper* decomposition of the intended question.

  3.  **However, the Core Issue Remains:** Even if the tree were fixed (adding a sub-question (e) on moral responsibility), the **recommended split disposition would still apply**. Decomposing the *judgment* on moral responsibility, reputational impact, and precedents might be *possible* (analogous to #3's decomposed benefit/risk judgment). But the **synthesis** – turning those judgments into the Institute's "Yes/No" decision and the specific wording of its acknowledgment – remains a non-delegatable act of constitutive commitment and institutional role integrity. A better tree makes decomposition of the *components* valid (avoiding a #9 rejection), but does not resolve the #4/#8 issue for the final act.

  ---

  ## Test Cases to Separate Live Contenders

  The two live contenders for governing the non-delegatable core are **Constitutive Commitment (CC)** and **Institutional Role Integrity (IRI)**. While overlapping, they diverge when a stance *could* be delegated but *shouldn't* due to role, or when a role *could* delegate but the stance itself resists it. Test cases:

  1.  **The Art Acquisition:**
      *   **Case:** "Should the National Gallery acquire 'Portrait of X' for its permanent collection?" (Assume significant cost, contested artistic merit, and historical controversy about the subject).
      *   **CC Prediction:** The decision *constitutes* the Gallery's official valuation and endorsement of the artwork and its place in the national canon. This stance cannot be delegated; the Gallery's trustees must own the judgment directly. Decomposition denied for the final decision (though analysis of cost, provenance, art-historical significance might be approved).
      *   **IRI Prediction:** The *role* of the trustees includes making final acquisition decisions as an act of institutional judgment and stewardship. Delegation would alienate this core function. Similar denial. *Weak separation.*
      *   **Modified Case for Separation:** "**What is the art-historical significance of 'Portrait of X'?**" (Asked *by* the Gallery to inform its decision).
      *   **CC Prediction:** *Approved.* This is a report *about* a property, not the Gallery constituting a stance *of* endorsement or acquisition via the answer.
      *   **IRI Prediction:** **Potentially Denied if Strict.** If the board interprets the Gallery's role as *requiring* its own curators to form holistic judgments of significance as part of their core expertise (not delegatable to external atomized consultants), it might deny. Precedent #7 hints at this. This separates them: CC allows delegation of reports on properties; strict IRI might not if it's core to the institution's defined role.

  2.  **The Triage Protocol:**
      *   **Case:** "Should Hospital Y allocate its last ventilator to Patient A or Patient B?" under a defined crisis triage protocol. The protocol office proposes decomposing: (a) each patient's short-term survival probability with vent, (b) each patient's long-term projected life-years with vent, (c) each patient's dependent care responsibilities, (d) consistency with triage protocol rules. Judge combines scores.
      *   **CC Prediction:** **Denied.** The allocation decision *constitutes* a life-or-death prioritization, a profound moral stance by the hospital/system. Delegating the synthesis voids the gravity of the commitment. The answer *is* the act of prioritization.
      *   **IRI Prediction:** **Approved (Possibly with Conditions like #3).** If the hospital's role is defined as *implementing* a pre-defined, transparent protocol fairly, then decomposing the *application* of the protocol's criteria might be permissible (ensuring no single clinician bears the full burden). The institutional commitment is *to the protocol*, and decomposition ensures its consistent application. The *stance* is embedded in the protocol, not constituted by the allocator. Precedent #1/10 support this. This cleanly separates CC (denies) from IRI (approves, if role is protocol-implementation). Precedent #4 leans towards denial, but #4 involved a *choice* exceeding mere scoring; strict protocol application is different.
