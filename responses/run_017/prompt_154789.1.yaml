prompt: |-
  Looking for a concept here, not just a label — I want to know what this thing is, what it isnt, and where its edges are.

  Pattern I keep running into: an utterance whose literal wording commits the speaker to nothing, where the *kind of act* it turns out to be gets settled by what the hearer does with it afterwards, and where the speaker seems to be aiming for exactly that.

  Two cases. My boss says, very pleasantly: "it'd be a real shame if your name didnt end up on this filing." No order, no promise, nothing about his own future conduct. If I take it as pressure and comply, it was pressure; if I laugh it off, it apparently was only ever a remark, and he can always retreat to the sentence he actually said. Same shape: a neighbour says "nice bike, be a shame if anything happened to it."

  The thing I want to seperate this from is the speaker implying extra content. I half-remember the word "implicature" from a class, but that seems to be about extra content, and here nothing extra is being communicated — the content is fully out in the open, it's the force that's up in the air. What looks distinctive is that the force gets deliberately handed over: he intends, roughly, that whatever you take him to be doing is what he's doing. The intention is about the uptake rather than prior to it, which seems to break both of the obvious stories — force fixed by what the speaker meant, and force fixed by the rules or conventions attached to the sentence.

  So: does this configuration have an established name, and how does it sit with the nearest ones — is "indirect speech act" this, or something else? If nothing fits, say so and coin a term with a definition, plus one case that barely qualifies and one that looks similar but doesnt. Dont just hand me a list of names and papers, I want the carving.
reasoning: |-
  Okay, the user is presenting a really interesting linguistic phenomenon they've observed. They're describing utterances where the literal wording commits the speaker to nothing, and the illocutionary force (what the utterance actually does) gets determined by how the hearer responds. The key examples are the boss's "it'd be a real shame if your name didn't end up on this filing" and the neighbor's "nice bike, be a shame if anything happened to it."

  Hmm, what makes this tricky is that they specifically want to distinguish this from implicature (like Grice's conversational implicature) because there's no hidden content here. The threat is completely transparent, yet deniable. The force isn't fixed by speaker intention alone or by conventional rules - it depends on the hearer's uptake.

  The user is clearly knowledgeable about linguistics - they mention implicature and indirect speech acts but correctly note those don't quite fit. They're asking for precise conceptual carving, not just labels. This feels like someone who's read some Austin or Searle but finds existing categories inadequate.

  Let me think through why indirect speech acts don't fit. Indirect speech acts (like "Can you pass the salt?" being a request) rely on shared conventions. But in these examples, there are no such conventions - the force emerges purely from the hearer's reaction. That's the crucial difference.

  I recall Austin's concept of "perlocutionary" effects, but that's about consequences rather than force determination. What makes these examples special is the speaker's intention to let the hearer decide the force. It's like handing over interpretative control.

  For a name... "uptake-dependent illocution" seems accurate because the illocutionary force depends on uptake. "Force delegation" captures the intentional handing-over aspect. "Deniable directive" describes what it often is functionally.

  The user would probably appreciate the edge cases too - like the "I love what you've done" example that's almost-but-not-quite the same because it lacks the threat element. And the "Is that your final decision?" example that looks similar but actually has conventional force.

  This is sophisticated linguistic analysis they're asking for - I should emphasize why existing terms don't fit while providing a precise new framing. The coining of terms should feel rigorous, not arbitrary. And those clear examples of what does and doesn't qualify will help cement the concept.
answer: |-
  This is a sharp observation of a genuine gap in speech act theory. You've identified a configuration where **the illocutionary force is intentionally delegated to the hearer's uptake, making the act's nature (and the speaker's commitment) retroactively defined by the response.** Existing terms like "implicature" or "indirect speech act" don't fully capture this because the core mechanism differs.

  Here's the conceptual carving:

  1.  **What It IS:**
      *   **Core Mechanism:** The speaker utters a sentence whose *literal* meaning is non-committal (often a statement of hypothetical consequence, opinion, or fact) but embedded within a clear context of power imbalance, threat, expectation, or obligation.
      *   **Intentional Delegation:** Crucially, the speaker *intends* for the hearer to interpret this utterance as having a specific force (e.g., threat, warning, veiled order, solicitation). However, they *also* intend to avoid committing to that force *until* the hearer acknowledges it through their response.
      *   **Uptake-Defines-Force:** The illocutionary force (e.g., "threat," "order," "solicitation") isn't fixed by the speaker's private intention alone, nor solely by conventional meaning. It becomes *established* by the hearer's specific uptake (e.g., compliance, visible fear, explicit challenge, dismissal).
      *   **Plausible Deniability:** The speaker retains the ability to deny the intended force ("I was just making an observation!") because the literal wording supports the weaker interpretation. The *act* only "becomes" the stronger force if the hearer makes it so through their reaction.
      *   **Goal:** To achieve the desired outcome (compliance, fear, contribution) while minimizing accountability and the risk of direct confrontation or refusal. It exploits the hearer's recognition of the implied consequence and their likely desire to avoid it.

  2.  **What It Is NOT:**
      *   **Implicature (Gricean):** Implicature conveys *additional propositional content* beyond the literal meaning (e.g., "It's cold in here" implying "Please close the window"). Your examples convey the *entire propositional content* literally ("shame if X happened"). The ambiguity isn't in *what* is said, but in *what the speaker is doing by saying it* (the force).
      *   **Standard Indirect Speech Act:** Conventional indirect speech acts rely on shared linguistic/conversational rules mapping form to force (e.g., "Can you pass the salt?" conventionally = request). Your examples lack this conventional mapping. The force isn't conventionally attached to the form; it's negotiated in the specific interaction via uptake.
      *   **Perlocutionary Effect Only:** While perlocution (the effect on the hearer) is crucial, your focus is on how uptake *defines the illocutionary act itself* retroactively. The perlocution (e.g., fear, compliance) is evidence of the force the act has taken on.
      *   **Ambiguity or Vagueness:** The ambiguity isn't semantic (about word meaning) or syntactic. It's pragmatic ambiguity about the *act* being performed, deliberately engineered by the speaker.
      *   **Simple Hinting:** Hints rely on the hearer inferring *content*. Here, the content is clear; the ambiguity is about the speaker's *commitment* and the *type of act*.

  3.  **The Edges:**
      *   **Speaker Intention:** The speaker *must* intend for the hearer to recognize the potential threatening/coercive/expectant force *and* intend to avoid commitment unless forced by uptake. Without this dual intention (delegate force/retain deniability), it's something else.
      *   **Contextual Power:** The mechanism relies heavily on a contextual power imbalance (boss/employee, mobster/victim, implicit social obligation). Without this leverage, the utterance remains merely an observation.
      *   **Hearer Recognition:** The hearer *must* recognize the potential force for the mechanism to work. If they genuinely miss it, the act likely remains the literal, weaker interpretation ("Oh, yeah, it *would* be a shame!").
      *   **Literal Non-Committal Form:** The utterance must literally be non-committal (statement of fact, hypothetical, opinion). If the literal form commits the speaker (e.g., "I will break your bike"), it's a direct threat, not this delegated-force type.

  **Why "Indirect Speech Act" Doesn't Quite Fit:**
  Indirect Speech Acts (ISA) typically involve:
  1.  A primary illocutionary point (e.g., request) achieved *by means of* performing another, more literal act (e.g., questioning ability: "Can you pass the salt?").
  2.  Reliance on *conventions* or *general principles of cooperation* (like Grice's maxims) to allow the hearer to infer the primary act.
  In your cases:
  *   There isn't necessarily a *literal* act being performed *in order to* achieve the primary act. The literal statement *is* the vehicle, but its force isn't conventionally indirect.
  *   The force isn't *inferred* via conventional rules or cooperation; it's *assigned* based on the hearer's reaction within a power dynamic. The speaker isn't being cooperative; they're being deliberately non-committal.
  *   Deniability is central and structural in your cases, whereas conventional ISAs often function precisely *because* the force is mutually understood, even if indirect.

  **The Established Gap & Coined Terms:**

  This specific configuration of **deliberate force-delegation via non-committal form, relying on contextual power and defined retroactively by uptake**, lacks a single, universally established name. It sits at the intersection of veiled threats, strategic ambiguity, and uptake theory, but isn't perfectly captured by any.

  **Proposed Terms:**

  1.  **Uptake-Dependent Illocution:** Emphasizes the core mechanism – the illocutionary force is contingent on and defined by the hearer's uptake. (*Most descriptive*)
  2.  **Force-Delegating Utterance (FDU):** Highlights the speaker's intentional handing over of the force-determination process. (*Highlights speaker strategy*)
  3.  **Retroactive Force Assignment:** Emphasizes that the act's nature is settled *after* the utterance, based on response. (*Highlights temporal aspect*)
  4.  **Deniable Directive/Threat/Solicitation (as specific subtypes):** Functional descriptions based on the common outcomes. (*Highlights function/effect*)

  **Definition (using Uptake-Dependent Illocution):**
  An **Uptake-Dependent Illocution** is a speech act where:
  1.  The speaker utters a sentence whose literal meaning is non-committal regarding the intended illocutionary force (e.g., threat, order, strong request).
  2.  The speaker intends the hearer to recognize the potential for a stronger force within the specific context (usually involving power imbalance or negative consequence).
  3.  The speaker *further intends* that the actual illocutionary force of the utterance (and thus their commitment) be determined by the hearer's specific uptake (e.g., compliance, acknowledgment, visible concern, refusal, dismissal).
  4.  This structure provides the speaker with plausible deniability of the stronger force if challenged.

  **Cases:**

  1.  **Barely Qualifies: "I love what you've done with the place! Really... bold choices."**
      *   *Literal:* Compliment/observation.
      *   *Context:* Said with a strained smile to a subordinate after a controversial office redesign.
      *   *Potential Force:* Veiled criticism, warning it's unacceptable.
      *   *Uptake Dependence:* If the subordinate beams and says "Thanks!", the act *remains* a (possibly insincere) compliment. If the subordinate looks worried and says "Oh, should I change it?", the act *becomes* a criticism or warning. The speaker can retreat to the literal compliment ("I just said I loved it!").
      *   *Why Barely?* The power imbalance is less inherent, the negative consequence less direct/clear, and the ambiguity might be more about sincerity than fundamental force. It leans more towards heavy sarcasm or insincere compliment than a core FDU.

  2.  **Looks Similar But Isn't: "Is that your final decision?" (Asked by a judge to a defendant)**
      *   *Literal:* Yes/No question.
      *   *Context:* High-stakes, clear power imbalance.
      *   *Apparent Force:* Potentially a warning to reconsider.
      *   *Why it's NOT an FDU/Uptake-Dependent Illocution:* The force is largely conventional and fixed. Within the legal context, this question has a well-understood illocutionary force – it *is* a procedural step offering a final chance for reconsideration before consequences are applied. The judge *is* committed to the act of giving that final opportunity by uttering it, regardless of the defendant's immediate reaction (e.g., a defiant "Yes!" vs. a hesitant "Uh..."). The force is prior and conventional, not delegated to the defendant's uptake to define the nature of the act itself. Uptake determines the *next step* (sentence vs. continuance), not *what act the judge just performed*.

  This configuration highlights the dynamic, negotiated, and sometimes coercive nature of communication within power structures, where control over the definition of the act itself becomes a strategic tool.
