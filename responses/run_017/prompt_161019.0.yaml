  Hmm, their frustration is palpable—they’ve wrestled with this for a week. The challenge is translating abstract democratic theory into embodied tension without didacticism. They’re allergic to clichés (Brexit/voter-ID parallels), so freshness is key. Their hidden need might be to *feel* the mechanism’s cruelty through character and sensory detail, not debate it. The tide-register keeper as a neutral observer is brilliant—she’s the perfect lens: complicit yet detached, holding records that doom people.  

  I’ll avoid naming the problem (democracy theorists would recognize it as the "constitutive dilemma" or "boundary paradox," but the story mustn’t). Instead, focus on the physicality: brine-rotted stilts, the wall’s shadow, the ledger’s ink. The cruelty is in the cycle—the stilt-folk only vote *after* harm, never before. Their power exists solely to reverse what can’t be undone (a drained fishery).  

  Structure-wise: open with the keeper weighing the vote’s outcome, then flashback to the first enclosure vote’s manipulation (city voters salivating over land wealth while ignoring the human cost). Highlight the stilt-folk’s silent presence—ignored until they’re momentarily "counted." End at the precipice of the second vote, keeper’s pen hovering. No resolution; the machine must keep grinding.  

  Key images:  
  - The ledger: names added/erased by geography, not choice.  
  - The sluice-gates: literal controls of fate.  
  - "Salt ghosts": the keeper’s term for those erased by tides, echoing the stilt-folk’s political erasure.  

  Voice must be terse, marine-bleak. No metaphors—just silt, wind, ink. The city’s greed should feel banal, not villainous. And the keeper? She’s the horror of bureaucracy: meticulous, amoral, keeping score as the pump swings.  

  Word count tight at ~1500. Every sentence must serve the dread. No infodumps—worldbuilding via the keeper’s tasks (e.g., checking sluices implies control; tide-logs show manipulation).  

  This should unstick their chapter by making the abstract *physically nauseating*. The "machine" isn’t named; it’s the click of the keeper’s pen, the wall’s shadow on the mud.
