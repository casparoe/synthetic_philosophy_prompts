  The salt-wind always found Jessa, even in the Tide-Register’s stone vault. It seeped under the door, smelling of mud, decay, and the distant tang of open ocean. Outside, the city of Saltrise hummed with the aftermath of the Enclosure Vote. Inside, the only sounds were the drip of condensation on stone and the rasp of Jessa’s pen as she recorded the final sluice adjustments for the night. The great sea-wall held back the tide; beyond it, the vast flats lay exposed, skeletal stilt-houses stark against the grey expanse. Soon, they wouldn’t be.

  The vote had passed. By a comfortable margin. The wall would extend, swallowing the tidal flats. The sluices would close permanently. The marsh would be drained, the silt beneath transformed into valuable, dry land. The arguments had been practical, loud, filling the taverns for weeks: safety from storm surges (dubious, Jessa thought), new space for granaries and workshops (certain), increased harbour dues (immediate). The wealth would flow in.

  No one in the debates, not officially, mentioned the two thousand souls clinging to the mud beyond the current wall. The Stiltfolk. Their houses, perched on spindly legs, shifted with every tide dictated by Saltrise’s sluice-masters. Their lives were governed by the city’s decisions – when the water rose, where the channels silted, when the fishing grounds were choked – yet they slept outside the wall on New Year’s night. They were not Citizens. They did not vote.

  Jessa dipped her pen. Her job was the water, not the people. She recorded the tidal pull, the sluice settings, the wall’s integrity. She noted the encroaching rot on the Stiltfolk timbers, worsened by recent, deliberate shifts in the drainage patterns. She didn’t decide; she documented. Yet, the ledger felt heavier tonight.

  She remembered the night the vote passed. The celebrations in the squares, fueled by cheap gin and visions of dry gold. And she remembered the silence that fell when old Manus, rarely seen in the city proper, shuffled onto the speaking-stone. He spoke no Charter law, no theory. He simply held up a net, thick with silt-clogged mesh. "You drain it," he rasped, his voice like rope fraying, "you kill the water. Kill the fish. Kill us." He dropped the net. "Then what? You build on our graves?"

  A ripple of unease, quickly drowned by shouts about progress and land value. Someone yelled, "But you’ll be inside next year! You’ll get your vote then!"

  Jessa had seen the calculation flicker across the faces of the Council leaders, the wealthy merchants pushing the measure. She saw it mirrored in the eyes of ordinary voters counting potential coin. Enclosing the flats meant *including* the Stiltfolk within the new wall. Next New Year’s night, they would be sleeping *inside*. They would be Citizens. They would be on the Roll.

  And everyone knew what they would do with that vote.

  *Breach the wall. Let the sea back in. Restore the flats.*

  It was the only thing that made sense for them. Saltmarsh was their lifeblood; dry land was their death. So the great pump would swing. Enclose. Drain. Build (a little, hastily, expecting the reversal). Then, the newly minted Citizens – the former Stiltfolk – would vote to undo it all. To become outsiders again.

  And the cycle would begin anew. Enclose. Drain. Vote to flood. Repeat. Profit squeezed from the transitions, from the land speculation in the brief dry periods, from the disruption itself.

  The cruelty wasn’t just in the displacement, the destruction of a way of life. It was in the timing. It was the ledger in Jessa’s mind:

  *   **The Enclosure Vote:** Decided by Saltrise Citizens. The Stiltfolk, outside, affected utterly, have no say. The harm is *done* to them.
  *   **The Breach Vote (Next Year):** Decided by the *new* Citizens (the former Stiltfolk). They vote to reverse the harm *already inflicted*. To return to the unstable, controlled margins.
  *   **Consequence:** They immediately place themselves back *outside* the wall. Off the Roll. Powerless again.
  *   **The Next Enclosure Vote:** Decided again by the Saltrise Citizens (the original group, minus those ruined by the previous cycle, plus new speculators). The Stiltfolk, outside again, have no say as the process starts over. The *next* harm is planned for them.

  They only ever got a vote on the aftermath. Never on the impending blow. They were only Citizens long enough to legitimize the reversal, only inside the boundary long enough to lose it again. Their political existence was a brief, desperate spasm of reaction, not agency.

  Jessa closed the current ledger, the ink on the final pre-enclosure sluice settings barely dry. She pulled out the next volume, bound in salt-stiffened leather. The first pages would record the groundbreaking for the new wall extension. Later pages would hold the names added to the Citizen Roll next New Year’s Eve – names like Manus, and his kin, currently out on the doomed flats.

  A year from now, she would open this book again. To record the Breach Vote.

  Outside, the wind picked up, whistling through a crack in the vault’s mortar. It carried the faint, rhythmic *thump* of hammers from the shipyards. Preparations. Always preparations. For the enclosure. Then, inevitably, for the salvage after the breach.

  Jessa dipped her pen in the iron-gall ink. Black as the mud beneath the stilts. She poised it over the first, blank page of the new ledger. The page awaited the declaration of the Breach Vote’s result. A vote that hadn't happened yet, but whose outcome felt as certain as the tide.

  Her hand hovered. The inkwell reflected the guttering lantern light, a tiny, distorted star in the blackness. She was the keeper of the water’s comings and goings, the recorder of decisions made by those who happened to be asleep within a line drawn on a map on one specific night. She was neither hero nor villain. She was the one who wrote down what the machine did. The pen trembled, just slightly, not with indecision, but with the cold, and the weight of the next turn of the wheel. She touched the nib to the paper, ready to inscribe the inevitable, the only thing left for the newly counted to choose.
