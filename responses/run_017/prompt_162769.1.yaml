  The user has outlined six specific cases that a theory must handle:

  1. Constructs with within-population transmission advantage but group-level harm (gene vs group conflict)
  2. Engineered symbionts with horizontal gene transfer (no clear replicating unit)
  3. Releases with related groups (kin vs group selection equivalence)
  4. Organisms modifying their own selection environment (niche construction)
  5. Systems where lower-level units lose independence (evolving unit status)
  6. The retrofitting problem (testability in advance)

  I need to build a specification around these cases, keeping adequacy tied to the purpose of planning releases. For each requirement, I'll explain the case behind it and mark it as non-negotiable or camp preference. I'll also clarify which distinctions a theory must respect and which are spurious, like between replicators and interactors, or selection of vs for.

  Key distinctions to address include:
  - Replicator vs interactor vs beneficiary (must respect)
  - Selection of unit vs for trait (must respect)
  - Selection acting at level vs strongest level (spurious)
  - Unit of selection vs bearer of adaptation (must respect)
  - Causal claim vs bookkeeping decomposition (must respect)

  I should flag if requirements conflict internally - for example, generality across substrates vs testability with noisy data. The user wants to know if the specification is unsatisfiable. I'll also identify which requirement does the most work in excluding popular theories.

  Finally, I'll provide a short table scoring gene-level selectionism, multi-level selection, and inclusive-fitness approaches against the specification, keeping it brief and focused on the criteria.

  The specification should be accessible to regulators who aren't population geneticists, so I'll avoid jargon and explain clearly what each requirement does. The deliverable is the set of criteria and their motivating cases, not a literature review.
answer: |-
  Here is the specification for an adequate theory of units of selection, designed for planning and auditing deliberate releases of genetically engineered organisms into evolving systems. The core purpose is **predictive and operational adequacy**: the theory must guide *what to measure before release* and *how to interpret early monitoring data* to resolve conflicts between different levels of analysis and make actionable risk decisions.

  ### Core Requirements (Non-Negotiable for Purpose)
  1.  **Resolve Gene-Level vs. Group-Level Conflict Predictively:**
      *   **Case:** A construct (e.g., gene drive) has strong within-host/vector/pest-population transmission advantage (+), but its spread decreases group productivity/viability (-), potentially causing local extinction.
      *   **Requirement:** The theory must provide a *quantifiable criterion* to predict *which level's effect will dominate the net outcome* (e.g., spread vs. extinction). It cannot merely describe the conflict post-hoc. This requires integrating the strength of within-group selection *for* the construct and between-group selection *against* constructs/groups carrying it into a single, measurable *net selection coefficient* or equivalent predictive metric.
      *   **Distinctions:** MUST respect *selection FOR a trait* (e.g., drive efficiency) vs. *selection OF a unit* (e.g., gene, group). CAN treat replicator/interactor distinctions as implementation details *if* the predictive metric remains robust. MUST treat "bearer of adaptation" as secondary to predicting dynamics.

  2.  **Handle Non-Tree-Like Inheritance & Fuzzy Units Actionably:**
      *   **Case:** Engineered symbiont in a host-microbiome; HGT is significant; "lineages" are networks; reproduction isn't clonal or strictly parent-offspring.
      *   **Requirement:** The theory must define a *measurable "evolutionary individual"* (or equivalent concept) *without presupposing tree-like inheritance*. This definition must be operational (e.g., based on correlated fate, shared selection pressure, or persistence of association over the relevant timescale) and yield testable predictions about spread/persistence of the engineered element *and its effects*. It must specify what constitutes "replication" or "persistence" in this context.
      *   **Distinctions:** MUST move beyond "degenerate case" dismissal. CAN be agnostic about replicator ontology *if* it provides predictive rules for heritable change. MUST bridge replicator/interactor concepts pragmatically.

  3.  **Be Invariant to Equivalent Descriptions (Kin/Group):**
      *   **Case:** Release design where groups are kin-structured, making kin selection and group selection models mathematically equivalent for predicting trait spread.
      *   **Requirement:** The theory must *recognize this equivalence* and treat both descriptions as yielding the *same prediction* for trait frequency change and system-level outcomes. It cannot privilege one description as more "fundamental" if they predict identically. Predictions and required measurements must be identical regardless of the chosen framing.
      *   **Distinctions:** MUST treat "selection acting at level X" vs. "kin selection" framings as *descriptive choices*, not causal differences, *when predictions are identical*. Selection *of* groups vs. selection *for* altruism via kin selection is a spurious distinction here. The predictive math is paramount.

  4.  **Incorporate Niche Construction & Feedback Dynamics:**
      *   **Case:** Engineered organism modifies its environment (e.g., alters resource density, induces host immune response, changes competitor behavior), changing the selection pressures acting upon it or other units.
      *   **Requirement:** The theory must explicitly model the *feedback loop* between the trait(s) under selection and the "environmental" variables they alter. It must provide guidance on measuring *environmental modification rates* and *their heritable basis* alongside standard fitness components. Predictions must account for how the selective landscape co-evolves with the trait.
      *   **Distinctions:** MUST reject strict decompositions treating environment as fixed/independent. Selection *for* a niche-constructing trait is inseparable from the altered selection pressures it creates. The unit of selection may encompass the trait *and* its characteristic environmental effect.

  5.  **Accommodate Shifting Unit Boundaries Over Time:**
      *   **Case:** Lower-level units (e.g., engineered genes in a symbiont) progressively lose independent reproductive capacity (e.g., due to co-adaptation, dependency, integration) over the release timescale.
      *   **Requirement:** The theory must provide a *dynamic framework* where the "status" of a candidate unit (e.g., is it an independent replicator? part of a higher unit?) is not fixed but is *itself an evolvable trait*. It must specify measurements (e.g., heritability of fitness, correlation of fate) to assess the *degree of integration or dependency* and predict how this shifts the effective level of selection over the monitoring window.
      *   **Distinctions:** MUST allow the "unit" to be a *process* rather than a static entity. The distinction between replicator and interactor may become blurred; the theory must handle this transition quantitatively.

  6.  **Ensure Pre-Release Testability & Falsifiability:**
      *   **Case:** The "retrofitting" problem: any observed outcome can be explained by choosing an appropriate level of selection post-hoc.
      *   **Requirement:** The theory must mandate *specific, quantifiable predictions* made *before release* about:
          *   The *primary level(s)* expected to dominate dynamics *for the specific trait/system*.
          *   The *expected rates* of change (frequency, abundance, spatial spread) at relevant levels.
          *   *Critical thresholds* (e.g., group size, relatedness, migration rate) where dominance shifts between levels.
          *   **Falsification Condition:** The theory fails if (a) predicted rates/thresholds are significantly violated by monitoring data *within the 2-year window*, AND (b) violation cannot be attributed solely to unmeasured environmental stochasticity or insufficient resolution of pre-release parameters. It must specify *which measurements* constitute a strong test (e.g., covariance of fitness and trait, group productivity vs. individual advantage).
      *   **Distinctions:** MUST prioritize *causal claims* testable via intervention/manipulation/correlation over *bookkeeping decompositions*. Mathematically equivalent models (e.g., MLS vs. IFT) must make identical testable predictions. Claiming "selection acted at level X" is only meaningful if it leads to distinct *predictions* from "selection acted at level Y".

  ### Key Conflicts and the Most Excluding Requirement
  *   **Conflict:** **Generality vs. Testability (Req 2 & 6 vs. Req 1 & 6):** Defining universally applicable "units" for messy systems (Req 2) while demanding specific, falsifiable pre-release predictions with noisy field data (Req 6) is inherently tense. Req 6 is the constraint doing the hardest work here.
  *   **Conflict:** **Process vs. Hierarchy (Req 5 vs. some interpretations of Req 1 & 3):** Accommodating shifting units (Req 5) challenges theories presupposing a fixed hierarchy of levels (e.g., strict MLS levels). Req 5 is a major challenge for rigid frameworks.
  *   **The Most Excluding Requirement:** **Requirement 6 (Pre-Release Testability & Falsifiability)** does the most work in excluding otherwise popular theories. Many philosophical/theoretical frameworks (e.g., pluralistic "it depends" views, purely descriptive replicator frameworks, approaches focused solely on ultimate adaptation) fail because they lack machinery to make *specific, quantifiable, and falsifiable pre-release predictions* about *which level will dominate* in a novel, engineered system within a short monitoring window. They excel at description but falter at actionable prediction under uncertainty.

  ### Scoring of Major Frameworks (Illustrative, not Exhaustive)
  | Requirement                     | Gene-Level Selectionism        | Multi-Level Selection (MLS)      | Inclusive Fitness Theory (IFT)  |
  | :------------------------------ | :----------------------------- | :------------------------------- | :------------------------------ |
  | **1. Resolve Gene/Group Conflict** | Fails: Ignores/denies group effects. Predicts spread regardless. | **Partial:** Framework exists (Price eq.), but often lacks predictive thresholds for dominance. | **Partial:** Math equivalent to MLS1, same predictive limitation. |
  | **2. Non-Tree-Like Inheritance** | Fails: Assumes gene is replicator; struggles with HGT/networked units. | **Partial:** Can define interactors flexibly, but often defaults to organisms/groups. | Fails: Relies on relatedness (r), undefined in non-tree cases. |
  | **3. Kin/Group Equivalence**    | Fails: Often rejects group framing. | **Pass:** Explicitly incorporates group selection; recognizes equivalence. | **Pass:** Explicitly incorporates kin selection; recognizes equivalence. |
  | **4. Niche Construction**       | Fails: Environment fixed.      | **Partial:** Can incorporate, but not core. Feedback dynamics often ad-hoc. | **Partial:** Environment usually fixed; feedback not naturally modeled. |
  | **5. Shifting Unit Boundaries** | Fails: Units fixed (genes).    | **Partial:** Levels can be defined, but shifting boundaries awkward. | Fails: Units fixed (organisms). |
  | **6. Pre-Testability/Falsifiability** | **Partial:** Clear predictions *only* if gene-level wins. Falsified if group effects dominate. | **Partial:** Predictions possible, but often complex; falsification criteria vague. | **Partial:** Clear predictions if r known; falsification hard if r changes/undefined. |

  **Conclusion:** No existing popular framework fully satisfies all requirements for this operational purpose. **Requirement 6 (Pre-Testability)** is the primary gatekeeper. An adequate theory must be **dynamical, quantitative, prediction-first, and focused on measurable parameters** (e.g., heritabilities, covariances, selection coefficients, modification rates) that integrate effects across potential levels and whose violation constitutes a clear test. It must treat "units" as **hypothesized focal points for selection in a specific context over a defined timescale**, validated by predictive success, not as ontologically prior entities. The inability of any theory to robustly satisfy Req 6 across all cases would signal the need for more conservative release designs or monitoring strategies explicitly accounting for level-of-selection uncertainty.
