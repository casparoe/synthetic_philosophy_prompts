  ### Grading of Question 5

  **Total Score: 24/30**

  #### Part (a): Derive the condition on w for GRIM resisting invasion by ALL-D (10 points)
  **Score: 10/10**  
  **Comments:**  
  - **Claim 1:** "V(GRIM | GRIM) = 3/(1−w)" is correct. With no defections, mutual cooperation occurs in every round, so the expected total payoff is \(R + wR + w^2R + \cdots = R/(1-w) = 3/(1-w)\).  
  - **Claim 2:** "V(ALL-D | GRIM) = 5 + w/(1−w)" is correct. Against GRIM, ALL-D gets T=5 in the first round. After that, GRIM defects forever (due to the defection), resulting in mutual defection (P=1) in subsequent rounds. The expected payoff is \(5 + w \cdot 1 + w^2 \cdot 1 + \cdots = 5 + w/(1-w)\).  
  - **Claim 3:** The inequality "3/(1−w) ≥ 5 + w/(1−w)" is set up correctly for GRIM resisting invasion (i.e., V(resident | resident) ≥ V(mutant | resident)).  
  - **Algebraic derivation:** Simplifying to "3 ≥ 5(1−w) + w" (which is \(3 ≥ 5 - 4w\)) and solving for \(w ≥ 1/2\) is correct.  
  - **Conclusion:** The condition \(w ≥ 1/2\) is correct and well-justified.

  #### Part (b): Expected rounds to first accidental defection, payoff implications, and long-run average (8 points)
  **Score: 2/8**  
  **Comments:**  
  - **Expected number of rounds to first accidental defection (substantive error):**  
    - **Claim:** "The number of rounds up to and including the first accidental defection is geometric with mean 1/e" is incorrect.  
    - **Error:** The probability that a pair gets through a round unharmed (no accidental defection) is \((1-e)^2\), not \(1-e\). The student incorrectly uses \(1-e\) for the pair, but it should be \((1-e)^2\) since trembles are independent per player.  
    - **Correct derivation:** The probability of at least one accidental defection in a round is \(q = 1 - (1-e)^2\). The number of rounds until the first accidental defection (inclusive) follows a geometric distribution with success probability \(q\), so the expected number is \(1/q = 1/[1 - (1-e)^2] = 1/(2e - e^2)\), which for small \(e\) is approximately \(1/(2e)\).  
    - **Consequence:** The student's mean of \(1/e\) is incorrect; it should be roughly half of that (e.g., for small \(e\)).  
  - **Payoff against itself as e grows (substantive error):**  
    - **Claim:** "GRIM's payoff against itself is roughly R/e" is incorrect.  
    - **Error:** This is derived from the incorrect expected number of rounds. With the correct mean \(1/(2e - e^2)\) for the first defection, the expected number of full cooperative rounds before defection is approximately \(1/(2e)\). The expected total payoff for GRIM against itself is dominated by \(R \times \text{(expected cooperative rounds)} \approx R/(2e)\) for small \(e\), not \(R/e\). The student's value is about twice as large as it should be.  
    - **Correct implication:** As \(e\) grows (i.e., noise increases), GRIM does perform poorly against itself because accidental defections trigger permanent defection, reducing payoffs. However, the specific "roughly R/e" is quantitatively wrong due to the earlier error.  
  - **Long-run average payoff per round (correct):**  
    - **Claim:** "With probability 1, a pair of GRIM players ends up earning P per round in the long run" is correct.  
    - **Reasoning:** After the first accidental defection, GRIM defects forever, so if the interaction lasts long enough, the per-round payoff approaches P=1. Since \(e > 0\), the first defection occurs with probability 1, and the long-run average per-round payoff converges to P=1 with probability 1.  
  - **Partial credit:** The long-run average claim is correct and earns points (2/8), but the expected number and payoff implication are fundamentally wrong due to the probability error, earning 0 for those parts.

  #### Part (c): Comparison of PENANCE and TFT (12 points)
  **Score: 12/12**  
  **Comments:**  
  - **(i) Why PENANCE avoids echo and cost of tremble (correct):**  
    - **Claim 1 (no echo):** Explanation of why PENANCE avoids alternating defections after one accidental defection is correct. After a tremble (e.g., A defects accidentally in round t), A's standing becomes BAD, and B remains GOOD. In round t+1, A (BAD) cooperates (atones), and B (GOOD) defects (punishes without losing standing). After round t+1, both standings return to GOOD, and mutual cooperation resumes in round t+2. TFT, by contrast, falls into alternating (D,C), (C,D) indefinitely after one tremble.  
    - **Claim 2 (tremble cost):** For TFT in self-play, a tremble leads to an average per-round payoff of (T+S)/2 = 2.5 instead of R=3, costing 0.5 per round per player indefinitely. For PENANCE, the tremble costs one round of T+S=5 (joint) and one round of S+T=5 (joint), compared to two rounds of R+R=6 (joint), resulting in a one-time joint payoff loss of 1 (or 0.5 per player) before resuming cooperation. This is correct.  
  - **(ii) Why PENANCE may not displace TFT and invasion by ALL-D (correct):**  
    - **Claim 1 (not displacement):** Explanation that PENANCE may not displace TFT despite better self-play recovery is correct. Invasion fitness depends on payoffs against the resident strategy and other mutants, not just self-play. PENANCE's forgiveness makes it vulnerable to exploitation (e.g., by ALL-D), whereas TFT may be stable against ALL-D for \(w \geq 1/2\).  
    - **Claim 2 (invasion by ALL-D, ignoring trembles):** Derivation of the condition for ALL-D to invade PENANCE is correct, and trembles are ignored as instructed.  
      - V(PENANCE | PENANCE) = 3/(1−w) is correct (no trembles, mutual cooperation always).  
      - V(ALL-D | PENANCE) = (5 + w)/(1 − w²) is correct: against PENANCE, ALL-D gets T=5 in odd rounds and P=1 in even rounds, leading to the series sum \((5 + w)/(1 - w^2)\).  
      - Setting \(3/(1−w) \geq (5 + w)/(1 − w^2)\) simplifies to \(3(1+w) \geq 5 + w\), then \(2w \geq 2\), so \(w \geq 1\). Thus, for \(w < 1\), ALL-D invades, which is correct.  
    - **Conclusion:** PENANCE is less stable against ALL-D than TFT (which requires only \(w \geq 1/2\)) due to its exploitability, as derived.
