  Looking at the core challenge, the key is sequencing ideas correctly. I need to start by distinguishing between ordinal rankings (which outcome is better for a person) and cardinal measurements (how much better it is), which is essential before introducing social decisions that require more than rankings. Then I must clarify that "who is better off," "whose gain is larger," and "offsetting gains" represent distinct demands rather than variations of one demand. Finally, participants need to understand that using a common currency like money or QALYs relocates rather than solves the comparison problem - this must come before someone suggests such currencies.

  For the case study, the user's example of joint replacements vs talking therapies works well. It has two groups with incomparable self-reports (chronic pain vs depression), lacks cash equivalents or identifiable victims, and survives attempts to find common currencies. It prevents settling by head-counting or need-based decisions alone. I'll stick with this case as it meets all requirements.

  I anticipate several misconceptions that will surface: the idea that comparisons require mind-reading, that using the same 0-10 scale solves everything, that anchoring endpoints defines the scale shape, that incomparability justifies equal treatment, and that imperfect comparisons mean no comparisons are possible. I need to address each at specific points - for example, the mind-reading fallacy early during cardinal measurement introduction, and the scale-shape issue when discussing anchors.

  The diagnostic task in the final ten minutes should reveal whether participants truly grasp the problem. I'll use a question about whether a specific utility gain for Group A could ever be smaller than a different gain for Group B, which would test their understanding of admissible rescaling rather than just parroting "utilities aren't comparable."

  For scope management, I'll explicitly exclude technical terms like Pareto efficiency, aggregation formulas, and philosophical debates about utilitarianism, framing these as intentional omissions to maintain focus.

