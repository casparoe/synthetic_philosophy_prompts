answer: |-
  **Session Plan: Understanding the Difficulty in Health Prioritisation**

  **1. Sequence of Ideas**
  (a) **Individual Preference Ordering (15 mins):** Establish that *for one person*, we can rank outcomes (e.g., "Less depressed" > "More depressed"). Distinguish this *ordinal* ranking ("which is better?") from needing to know *how much* better one outcome is than another (*cardinal* measurement). Use simple personal examples (e.g., tea vs coffee preference ranking vs intensity of preference).
  (b) **Social Decision Needs Cardinality (20 mins):** Introduce the funding choice (joints vs therapy). Show that merely knowing each group prefers *their* treatment tells us nothing about *which treatment to fund*. Voting requires comparing the *size* of the benefit *across* groups. Highlight the three distinct demands: 1. Which *group* is worse off? (Ordinally comparable *if* we agree on a metric, but often contested). 2. Which *gains* (from treatment) are larger? (Cardinal comparison needed). 3. How many smaller gains offset one larger gain? (Requires a ratio scale, even harder). Emphasise their vote **covertly requires #2 (whose gain is larger)** to choose between programmes benefiting different groups.
  (c) **The Currency Illusion (20 mins):** *Before* participants suggest it, introduce the idea of a "common currency" (money, WTP, QALYs). Explain it *relocates* the comparison: instead of directly comparing pain relief to mood improvement, we compare £ values or QALY values. The core difficulty (comparing fundamentally different experiences/valuations) is now embedded *within the construction and interpretation of the currency itself* (e.g., how is a QALY weight derived for pain vs depression?).

  **2. The Core Case Study**
  The **joint replacements (chronic pain, older people) vs talking therapies (severe depression, younger people)** case **carries it effectively**. It possesses:
  *   **Essential:** Two groups with qualitatively different experiences (physical pain vs mental distress) making self-report scales (0-10 pain reduction vs 0-10 mood improvement) intuitively non-comparable. The trade-off persists – attempts to force QALYs or WTP simply move the interpersonal comparison into the valuation methodology without resolving it. No obvious cash equivalence or single victim exists. Need alone is insufficient (both severe) and counting heads ignores the potential disparity in individual gain size.
  *   **Avoided:** No cash payouts, no identifiable victims, avoids simple need/head-count resolution. It clearly forces the cardinal comparison across persons.

  **3. Misconceptions & Timing for Intervention**
  *   **"Need to be inside their head" (Point a):** Head off immediately when introducing *cardinal* measurement. Stress we don't need phenomenology to know *they* prefer less pain/depression; the difficulty is *quantifying* the improvement *relative to others' improvements*.
  *   **"Same 0-10 scale solves it" (Point a/b transition):** Challenge early when moving to social choice. Ask: "Does a '7' improvement in pain mean the *same* as a '7' improvement in mood? How do you know?"
  *   **"Anchors define the scale" (During scale discussion):** Intervene when discussing anchoring (e.g., "worst imaginable health=0, full health=10"). Point out this fixes endpoints but says nothing about the *shape* in between (linear? logarithmic? clustered at one end?). A '5' might be midway for one, but represent a much larger subjective jump for another.
  *   **"Incomparability justifies equal treatment" (Point b/c):** Counter when discussing the social decision impasse. Argue that treating everyone alike (e.g., fund whichever helps more people, or flip a coin) *is itself a specific, contestable way of making the interpersonal comparison* (implicitly valuing all gains equally, or randomness).
  *   **"No full scale = No comparison possible" (Point c & Final Synthesis):** This is critical. After establishing the currency relocation, explicitly state: "The difficulty isn't that *no* comparisons are possible; it's that *full, precise cardinal comparisons on a single scale* are unavailable." **Pre-requisite:** Cardinality distinction (Point a), the three demands (Point b), and the currency illusion (Point c) must be understood. **Where it fits:** Final 15 mins. Introduce the **concept of "admissible rescaling"**: Each person's cardinal scale can be non-linearly transformed (stretched/squished, respecting their ordering and endpoints) without changing their *personal* truth. The *only* comparisons that survive *every possible* such rescaling for both individuals are those where the difference is so stark it holds under any plausible interpretation (e.g., curing a stubbed toe vs saving a life). For less stark cases (like our therapy vs joints), the comparison *depends* on which rescaling we choose – that's the locus of the difficulty. Our vote requires choosing an *implicit* rescaling.

  **4. Diagnostic Final Task (10 mins)**
  **Question:** "Imagine we agree that, *for the depressed group*, moving from 'Severely Depressed' to 'Moderately Depressed' is a utility gain of +5 units on their scale. We also agree that, *for the pain group*, moving from 'Severe Chronic Pain' to 'Mild Chronic Pain' is a gain of +8 units on their scale. Does this *necessarily* mean the gain for the pain group (+8) is *larger* than the gain for the depressed group (+5)? Why or why not?"
  *   **Diagnostic Wrong Answer:** "Yes, obviously 8 is bigger than 5." (Shows failure to grasp interpersonal rescaling).
  *   **Diagnostic Correct Answer:** "Not necessarily. The units might be different. We could rescale the depressed group's scale so that their +5 gain becomes equivalent to a +10 gain on the original pain scale, making their gain *larger*. Or rescale the pain scale to make +8 very small. The raw numbers alone don't tell us whose gain is objectively larger across persons without agreeing on how to interpret the scales relative to each other."

  **5. Explicit Exclusions (Stated at Start/When Raised)**
  "To use our time effectively on the core difficulty of comparing across different experiences, we will *deliberately not cover*:
  1.  Specific formulas for aggregating preferences (like cost-benefit ratios or QALY calculations).
  2.  Technical terms like 'Pareto efficiency' or 'Kaldor-Hicks compensation'.
  3.  Broader philosophical debates about the foundations of utilitarianism.
  4.  Detailed alternative decision rules (e.g., Rawlsian maximin). We focus solely on the comparison problem inherent in *this* type of funding vote."
