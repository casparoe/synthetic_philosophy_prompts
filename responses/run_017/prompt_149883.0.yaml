  ### Session Plan: Understanding Gibbard-Satterthwaite

  **Total Time:** 90 minutes  
  **Goal:** Participants can state the Gibbard-Satterthwaite (GS) theorem, explain why each condition is necessary, and distinguish real escape routes (e.g., randomization) from imaginary ones (e.g., approval voting).  
  **Core Example:** Three voters (V1, V2, V3), three options (A, B, C), with a Borda count (scores 2,1,0).  
  - **Truthful profile:**  
    - V1: A>B>C (scores A:2, B:1, C:0)  
    - V2: A>B>C (A:2, B:1, C:0)  
    - V3: C>B>A (C:2, B:1, A:0)  
    Outcome: A wins (A:4, B:3, C:2).  
  - **Manipulation:** V3 (true: C>B>A) reports B>C>A → B:2, C:1, A:0.  
    New outcome: A:4, B:4, C:1 → Tie. With tie-breaker favoring B, B wins. V3 prefers B over A → manipulation succeeds.  

  #### Order of Components (Timing & Rationale)
  1. **Voting Rule as a Function (15 min)**  
     - **Define:** A rule is a function mapping a profile (list of rankings) to a single outcome.  
     - **Why now?** Foundation for everything. Without this, manipulability is meaningless.  
     - **What breaks if late?** Jumping to manipulability without defining "rule" causes confusion about what’s being manipulated.  

  2. **Manipulability (15 min)**  
     - **Define:** A rule is manipulable if there exists a profile where a voter, by reporting a false ranking, gets a strictly better outcome.  
     - **Use core example:** Show V3’s successful manipulation.  
     - **Why now?** Concrete illustration after defining rules. Delay conditions to avoid overload.  
     - **What breaks if late?** If conditions come first, the example lacks context; participants won’t grasp "why" conditions matter.  

  3. **Conditions Mistaken for Technicalities (20 min)**  
     - **Condition 1: ≥3 Attainable Outcomes**  
       - Explain: Outcomes must be "in play" (A, B, C all winnable via some profile).  
       - **Why?** With 2 outcomes (e.g., majority rule), non-manipulable rules exist.  
       - **Breakage if late:** Without this, the example seems arbitrary ("why not two options?").  
     - **Condition 2: No Dictator**  
       - Define: No voter always gets their top choice among attainable outcomes.  
       - **Why?** Dictatorial rules are trivially non-manipulable.  
       - **Breakage if late:** If introduced after GS, participants may conflate "no dictator" with "no manipulation."  

  4. **Gibbard-Satterthwaite Statement (10 min)**  
     - **State:** Any voting rule with ≥3 attainable outcomes and no dictator is manipulable.  
     - **Tie to example:** "In our Borda example, 3 outcomes, no dictator → manipulable."  
     - **Why now?** Conditions justify the theorem; example makes it tangible.  

  5. **Misconception Map (20 min)**  
     Address in this order (each ~3-4 min):  
     - **"This is Arrow’s theorem"**: Clarify: Arrow is about ranking aggregation (welfare), GS about single-winner choice (manipulability). Sequence: After GS statement to contrast.  
     - **"Shows democracy is impossible"**: Emphasize: GS says manipulation is *possible*, not *ubiquitous*. Sequence: After GS to prevent fatalism.  
     - **"Five seats exempt us"**: Explain: GS applies to single-winner; multi-winner rules have *stronger* manipulability results. Sequence: Late to avoid early dismissal.  
     - **"Approval/score ballots evade GS"**: Refute: GS extends to non-ordinal ballots. Approval is manipulable (e.g., burying). Sequence: After GS to block false escapes.  
     - **"Vickrey-style tricks work"**: Clarify: Vickrey is for auctions (transfers), not voting rules without payments. Sequence: Late to preempt over-engineering.  
     - **"Manipulation is constant"**: Correct: GS guarantees an *existential* threat, not frequent occurrence. Sequence: Last to separate theory from practice.  

  6. **Randomization (5 min)**  
     - **Include here** (after misconceptions) as an escape route.  
     - **State:** Random rules (e.g., random dictatorship) are strategy-proof but often unacceptable.  
     - **Why?** It’s a real but impractical escape. Omit proof; say: "We’re skipping how randomization collapses to unappealing rules."  

  #### Core Example Requirements
  - **≥3 Attainable Outcomes**: With two, majority rule is non-manipulable. Example would fail.  
  - **Manipulation Succeeds**: If V3’s lie changed the winner but harmed her (e.g., C wins), it wouldn’t prove manipulability.  
  - **Deviating Voter Sees Ballots**: If V3 couldn’t anticipate outcomes, manipulation isn’t deliberate. In the example, she deduces B wins if she lies.  
  - **No Intensities/Ties/Uncertainty/Morality**:  
    - Only ordinal rankings (no "how much" preferences).  
    - No ties in voter preferences (strict rankings).  
    - Deterministic rule (no coin-flips).  
    - Avoid "cheating" language—focus on incentives, not ethics.  

  #### What to Omit & Final Activity
  - **Omit the proof**: Say aloud: "We’re skipping the proof (e.g., pivotal voter skeleton) to focus on intuition."  
  - **Final Activity (10 min)**:  
    - **Rule on board:** "Plurality, but if the top two are within one vote, the winner is the one more voters rank above the other in pairwise comparison."  
    - **Task:** "Find a profile and a voter who can manipulate."  
    - **Why it works:** Tests if they can apply GS logic (e.g., in a profile like V1: A>B>C, V2: B>C>A, V3: B>A>C, V3 can elect B by ranking A first, forcing a runoff).  
    - **Better test?** Use their real project context: "Design a rule for your 5-seat election that you suspect is manipulable and explain why." (Time-permitting.)  
  - **Success Sentence**: If a participant says: **"Every non-dictatorial voting rule with three or more possible winners has a scenario where lying pays off."**  

  ---

  **Why This Sequence Works**  
  - **Flow:** Builds from concrete (rules, example) to abstract (theorem, conditions) to corrective (misconceptions).  
  - **Example Anchors Everything**: Conditions and manipulation are demonstrated via the Borda example.  
  - **Escape Routes Contextualized**: Randomization is a dead end; misconceptions are debunked after GS lands.  
  - **Practical Hook**: Activity and project focus make theory actionable.
