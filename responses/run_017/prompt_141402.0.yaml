prompt: |-
  I teach one fifty-minute section next week introducing the Frege–Geach problem to second-years who can recite the non-cognitivist package — moral judgments are not beliefs, they are desire-like states that assertion expresses — but who have met none of the responses. Give me a plan for the hour, not an explanation of the problem.

  My half-formed idea is about sequencing. Presentations I have seen all open with the moral modus ponens, and I now think that is a mistake: the conditional is exactly the embedding where the standard reply, states directed at combinations of states, gets its grip most easily, so students conclude they have answered the problem before they have felt it. I want to open with negated and disjoined moral sentences instead — Murder is not wrong, and Either lying is wrong or promise-breaking is — where there is no tidy combination of attitudes for that reply to take hold of, and only then move to the conditional and to inference. Tell me whether that ordering survives scrutiny, what it costs (I worry it lets the problem look like a puzzle about disapproval rather than about validity), and whether I should also drop the usual warm-up of paraphrasing each moral clause into an attitude and watching the argument stop looking valid, which has always struck me as making the whole thing feel like a parlor trick.

  Then: the one example that should carry the hour and what it must have and lack; the misconceptions in the order they will form — I expect the crude boo–hurrah caricature, the idea that expressivists can simply hand over a truth-conditional semantics, and the conflation of this problem with the problem of moral disagreement — each with the point in the sequence where it should be defused; what I need to say about validity before any semantics is on the board; what to decline to get into at this level; and one question for the last five minutes that would show me a student has the problem rather than the slogan.
reasoning: |-
  Okay, the user is teaching a fifty-minute class on the Frege-Geach problem to second-year students who know the basics of non-cognitivism but haven't encountered responses to the problem. They're concerned about the standard approach starting with modus ponens and want advice on their alternative sequencing idea.

  The user's main idea is to start with negation and disjunction instead of modus ponens. They think beginning with conditionals makes the solution seem too easy, and they want students to feel the problem more deeply. But they're worried this might make the issue seem like it's just about disapproval rather than validity. They also question whether to include the standard paraphrasing warm-up exercise.

  I think their sequencing idea is pedagogically sound. Starting with negation and disjunction creates a stronger cognitive dissonance since there's no obvious combination of attitudes for these operators. This prevents students from jumping to premature solutions. The validity concern can be addressed by explicitly linking the embedding problem to inference preservation later.

  For the lesson plan, a concrete example is crucial. I suggest using "Lying is wrong" and its negation/disjunction to build up to a conditional argument. The example must be simple, involve clear moral terms, and show how embedding changes the attitude expression. I'll include a quick validity primer to anchor the discussion.

  Common misconceptions to address include: the boo-hurrah caricature (early on), thinking expressivists can just adopt truth-conditional semantics (when introducing embedding), and conflating this with moral disagreement (during inference discussion). Each needs targeted defusing at specific points.

  The warm-up paraphrasing exercise should be kept but framed carefully - not as a trick but as diagnostic. We can acknowledge its artificiality while showing it reveals a genuine puzzle.

  For assessment, a good closing question would test if students can identify why a disjunction like "Either stealing is wrong or joyriding is fun" poses a problem - specifically what attitude is being expressed when someone asserts this. This probes whether they see the embedding challenge beyond surface slogans.

  The user clearly has sophisticated pedagogical instincts. Their sequencing innovation shows deep understanding of how students prematurely resolve the problem. I'll structure a tight 50-minute plan that leverages their insight while addressing validity systematically. The key is maintaining focus on what makes embedded contexts semantically problematic for non-cognitivism rather than letting it devolve into a discussion of disapproval mechanics.
answer: |-
  Here's a battle-tested plan leveraging your sequencing insight, addressing your concerns, and targeting common pitfalls:

  **Core Pedagogical Insight Validated:** Starting with **negation and disjunction** is superior. It forces students to confront the *semantic emptiness* of non-cognitivism under embedding *before* a seemingly neat solution (like combinations for conditionals) is available. This makes the problem feel deeper and more structural. The validity concern is manageable.

  **The Cost & Mitigation:** The risk is making it *only* about "expressing disapproval wrongly." **Mitigation:** Explicitly frame the embedding challenge from the start as: *"What does this complex sentence MEAN (semantically) for the expressivist, and crucially, how does that meaning allow it to FUNCTION LOGICALLY in inferences?"* Constantly tie the attitude expression puzzle back to the sentence's role in argument patterns.

  **The Warm-Up Paraphrase:** **Keep it, but reframe it.** Do it quickly (5 mins max), presenting it *not* as a "trick," but as the **naive expressivist attempt at semantic analysis**. Acknowledge its intuitive pull *and* its immediate failure under embedding. Say: "This is where expressivism starts, but it clearly hits a wall here. Our job is to understand *why* this wall exists and how deep the problem goes." This sets the stage.

  **The 50-Minute Plan:**

  1.  **(5 mins) Recap & Set-Up:**
      *   Quick review: Non-cognitivism = Moral judgments express pro/con attitudes (disapproval, commitment), not beliefs tracking truth.
      *   **Crucial Preliminaries:** Define "validity" for the context: *"An argument is valid if it's impossible for the premises to be TRUE and the conclusion FALSE. Truth-preservation is key."* Emphasize this is about the *sentences* and their logical relationships. (Don't mention truth-*conditions* yet!).
      *   **State the Challenge:** "If moral sentences aren't truth-apt, how can they *mean* things that allow them to stand in logical relations (like validity) just like descriptive sentences? How can 'murder is wrong' be a premise in a logically valid argument?"

  2.  **(5 mins) The Paraphrase Warm-Up (Reframed):**
      *   Take a simple atomic moral sentence: "Lying is wrong." Naive paraphrase: Expresses disapproval of lying.
      *   **Point:** "This captures the *force* of asserting it. But what is its *content*? What does the sentence *mean* that allows it to play logical roles?"
      *   **Stop here.** Don't do an argument yet. Just note the paraphrase captures the speech act.

  3.  **(15 mins) Embedding I: Negation & Disjunction - Feeling the Void**
      *   **Negation:** Write: "Lying is not wrong." Ask: *"According to naive expressivism, what does asserting THIS express?"*
          *   Students will flounder: "Disapproval of not lying?" "Lack of disapproval?" "Approval of lying?" Point out: None cleanly capture "not wrong" as a *single semantic content*. Is it an attitude? Which one? How does it logically contradict "Lying is wrong"?
      *   **Disjunction:** Write: "Either lying is wrong or promise-breaking is wrong." Ask: *"What attitude does asserting THIS express?"*
          *   "Disapproval of lying OR disapproval of promise-breaking?" But that's not a single attitude state. "Disapproval of the *situation* where neither is wrong?" Unmotivated and complex. How does this function logically as a disjunction?
      *   **Key Point:** "The naive 'express an attitude' model breaks down completely here. We have no clear account of what these complex sentences *mean* for the expressivist. They seem semantically inert or chaotic under embedding. How could they possibly be part of a valid inference?"

  4.  **(15 mins) Embedding II: The Conditional & Inference - Where the Problem Bites**
      *   **Introduce the Argument:** "Now let's look at a classic valid inference involving a moral conditional:"
          *   P1: If lying is wrong, then getting your little brother to lie is wrong.
          *   P2: Lying is wrong.
          *   C: Therefore, getting your little brother to lie is wrong.
      *   **Validity Check:** Confirm students see it's intuitively valid (modus ponens).
      *   **Naive Paraphrase Attempt:** Try paraphrasing P1: "What attitude? Disapproval of... lying *and* not disapproving of getting your brother to lie?" This is messy and doesn't look like a conditional *belief*. Paraphrase P2: Disapproval of lying. Conclusion: Disapproval of getting brother to lie.
      *   **The Gap:** Point out: The paraphrased "premises" (complex attitude for P1, simple attitude for P2) do NOT logically entail the paraphrased "conclusion" (simple attitude). The *inferential connection is lost* in the attitude translation. The validity vanishes.
      *   **Frege-Geach Problem Defined:** "This *is* the Frege-Geach problem: How can non-cognitivism explain the identical semantic behavior (embedding, logical roles like validity) of moral sentences in complex contexts compared to descriptive sentences, given their radically different *atomic* analysis (attitude vs. belief)?"

  5.  **(5 mins) Why It's Hard & Misconceptions Defused**
      *   **Defusing Caricatures:**
          *   **Boo-Hurrah:** (Defuse during Negation/Disjunction): "This isn't just about finding fancier 'boos'. It's about *semantic content* enabling logic. Saying 'Boo lying and not boo getting brother to lie' doesn't capture the conditional *meaning* or make the inference work."
      *   **Truth-Conditions Hand-Over:** (Defuse when introducing Inference): "Can expressivists just say moral sentences *have* truth-conditions? No! That contradicts their core thesis – moral judgments aren't *beliefs* about truth-apt matters. They need an explanation *consistent* with non-cognitivism."
      *   **Moral Disagreement Conflation:** (Defuse throughout, emphasize at end): "This is NOT primarily about explaining why we argue. We can argue about desires ('I want coffee!' 'No, I want tea!'). It's about explaining how moral sentences can have the *logical form and properties* necessary to *be* the premises and conclusions in valid arguments we actually use."

  6.  **(4 mins) Scope & What to Skip:**
      *   **Do NOT:** Dive into specific solutions (Gibbard, Blackburn, etc.). Briefly mention they exist (e.g., "sophisticated expressivists develop complex semantic frameworks for moral vocabulary") as the *response* to *this* problem.
      *   **Do NOT:** Get bogged down in deep metaphysics of truth or propositions. Stick to the functional/logical challenge.
      *   **Focus:** The problem is showing the *incompleteness* of the core expressivist semantic thesis when faced with logic. The challenge is *explaining logical properties*.

  7.  **(1 min) The Killer Closing Question:**
      *   "Imagine someone sincerely asserts: 'Either stealing is wrong or joyriding is fun.' According to the naive expressivist view, what specific *attitude* is the speaker expressing by asserting this entire disjunction? And how could that attitude assignment explain how this sentence can function as a premise in a logically valid disjunctive syllogism?"

  **Why this question works:** It combines the embedding challenge (disjunction) with the logical function requirement (validity). A student who "gets it" will struggle to name *one* attitude for the complex sentence and see the disconnect from its logical role. A student stuck on slogans will try to name an attitude without addressing the inference problem.

  **The One Example:** Use "Lying is wrong" consistently throughout. **Why it works:**
  *   Simple, clear moral term.
  *   Allows building: Atomic -> Negation -> Disjunction (with "promise-breaking is wrong") -> Conditional Premise -> Full MP Argument.
  *   **Lacks:** Ambiguity, thick concepts, complex real-world scenarios. Keep it barebones to focus on the logical structure.

  **Key Sequencing Rationale:** By making students wrestle with the semantic void in negation/disjunction *first*, they experience the core embedding problem in its raw, unsolved state. When you *then* show the conditional/inference failure, they understand it as a *symptom* of this deeper semantic deficit, not just a puzzle about combining attitudes. This prevents the premature "solution" feeling and makes the need for a robust semantic theory (like planning or normative frameworks) much clearer later. The validity primer upfront and constant linking of embedding to logic mitigate the disapproval-conflation risk. The reframed warm-up serves its purpose without feeling gimmicky.
