prompt: |-
  I'm a second-year undergraduate taking a large world-history survey this term — the first third is big-history framing in the style of Harari, the middle is Diamond, and the last third is Graeber and Wengrow's *The Dawn of Everything* plus the archaeologists and historians who attack the whole genre — and I also work as a peer writing tutor in the writing centre attached to the course. Almost every week I sit down with a paper or a magazine pitch built on one enormous causal claim: that farming made inequality possible, that the orientation of the continental axes decided who conquered whom, that writing (or money, or organized religion) was the technology that finally let strangers cooperate at scale, that domestication domesticated us in turn. My difficulty is not that these claims are unfamiliar to me. It is that I have no repeatable way of separating the ones that can bear weight from the ones that are retrospective stories with a confident voice, and I cannot adjudicate them on area knowledge, because I am a sophomore, my students are mostly freshmen, and neither of us can go and check the archaeological record.

  What I want is a review procedure I can actually run in about twenty minutes, alongside a student with their draft, with no library access and without pretending to an expertise I do not have. It should: (a) translate whatever the critics of grand narratives have actually established — the difference between a mechanism that would have predicted the pattern in advance and one fitted to it afterwards, level-of-analysis slippage between individuals and populations, chains advertised as one cause that are really long conjunctions of necessary conditions, teleological and stage-of-progress phrasing, outcome selection, the way a comparative sample gets built — into an ordered set of tests; (b) say what counts as passing each one, so that "this is monocausal" or "this is a just-so story" is a verdict with criteria rather than a vibe; (c) name the point at which the procedure returns "not established by this argument" and stops, as opposed to "false," since that distinction matters when the output is a comment on someone's grade-relevant work; and (d) flag the questions it has to hand back to a person because they are interpretive or evaluative rather than evidentiary — for instance whether "worse off" in a claim about the Neolithic is being measured over the lived experience of individuals or over the persistence and spread of populations, or how much weight one well-excavated counterexample should carry against a large-scale comparative trend. Please also be explicit about where the procedure will misfire: the kinds of genuinely well-supported claims it will ding, and the kinds of empty claims it will wave through.

  Then run it, in front of me, on three claims that came in this month. (1) "The Neolithic transition was a trap that no one chose: per person, early farmers worked longer hours for a narrower diet and more infectious disease than the foragers they replaced, and by the time the costs were visible the population depended on the crops and could not go back, so the whole shift was a catastrophe dressed up as progress." (2) "Inequality is a product of agriculture. Foragers were egalitarian because meat and gathered food cannot be stored or defended; once grain could be stored, some households could accumulate and the rest had to submit — which is why every state we know of rests on a farming base." (3) A claim from a paper I personally like and would be sorry to see rejected: "Grand narratives are self-undermining: the comparative method that lets us generalize about the whole human past is also what shows that the past contains no natural experiment clean enough to support such generalizations, so the genre's honest conclusion is that it cannot deliver what it promises." I would like to see what the procedure returns for each, including if it tells me to give up (3) — and since I have to defend any comment in two sentences to the student who wrote the paper, and the instructor signs off on anything that touches a grade, please keep the language at a level I can say out loud in a tutorial.
reasoning: |-
  Okay, let's approach this systematically. The student needs a practical 20-minute evaluation framework for grand historical claims, tailored for peer tutoring with specific requirements. 

  First, I consider the core challenge: how to translate abstract critiques of grand narratives into concrete tests without specialized knowledge. The framework must distinguish between methodological flaws and content falsehoods, while flagging interpretive judgments. 

  For the evaluation criteria, I'm focusing on five key tests derived from common critiques:
  1. Monocausality check - does the claim oversimplify causality?
  2. Predictive vs. fitted mechanism - can the cause actually predict outcomes?
  3. Level consistency - does it confuse individual and group effects?
  4. Outcome selection - are consequences selectively presented?
  5. Counterexample handling - is contradictory evidence acknowledged?

  Each test needs clear pass/fail thresholds. For instance, monocausality fails if no alternative factors are mentioned. Crucially, the process stops at "not established" rather than "false" when evidence is insufficient, preserving academic integrity.

  I anticipate two limitations: well-supported but complex claims might get flagged (false positives), while sophisticated just-so stories could pass if they mimic nuance (false negatives). The framework explicitly notes these blind spots.

  Now applying this to the three sample claims:
  For the Neolithic trap argument, it passes most tests but fails outcome selection by ignoring population growth benefits. The verdict is "not fully established" due to selective framing.

  The agriculture-inequality claim fails monocausality and predictive mechanism tests spectacularly - it's the poster child for what this framework should catch.

  The meta-claim about grand narratives is interesting - it passes all tests but requires interpretive judgment about methodology, so we flag it for human evaluation rather than rejecting.

  Throughout, I'm keeping language tutorial-ready: simple analogies like "detective predicting vs. explaining afterwards" and concrete examples from the claims themselves. The goal is to equip students with diagnostic questions they can apply independently.
answer: |-
  Here’s a **20-Minute Grand Narrative Evaluation Protocol** designed for peer tutoring, with clear tests, thresholds, and limitations. It prioritizes *how the claim is argued* over *what is claimed*.

  ---

  ### **The Protocol: 5 Tests, Ordered by Severity**  
  *(Run tests 1–5 in sequence; stop if any test fails. "Fail" = "Not established by this argument.")*  

  1. **Monocausality Test**  
     - *Check:* Does the claim attribute the outcome **only** to one cause?  
     - *Pass:* Acknowledges ≥1 alternative contributing factor OR explains why other factors are irrelevant.  
     - *Fail Threshold:* Ignores context, alternatives, or necessary preconditions.  
     - *Flag:* If pass/fail is ambiguous, note: "This may oversimplify; are other forces at play?"  

  2. **Predictive Mechanism Test**  
     - *Check:* Could the proposed cause **predict** the outcome *in advance*? Or is it fitted afterward?  
     - *Pass:* Describes a mechanism that would work *forward* (e.g., "Storable grain enables accumulation because...").  
     - *Fail Threshold:* Uses outcome to explain cause (e.g., "Inequality emerged, so agriculture must have caused it").  
     - *Flag:* "Is this mechanism predictive, or inferred from the result?"  

  3. **Level Consistency Test**  
     - *Check:* Does the claim **confuse scales** (individual vs. group vs. species)?  
     - *Pass:* Consistent level (e.g., "households accumulated grain" → "societies developed elites").  
     - *Fail Threshold:* Jumps levels without linkage (e.g., "domestication changed human psychology" without evidence).  
     - *Flag:* "Does this connect individual actions to population outcomes?"  

  4. **Outcome Selection Test**  
     - *Check:* Are **consequences cherry-picked**? Are trade-offs acknowledged?  
     - *Pass:* Notes ≥1 countervailing effect (e.g., "Farming increased disease but supported larger populations").  
     - *Fail Threshold:* Presents outcomes as universally good/bad without trade-offs.  
     - *Flag:* "Are there unseen costs/benefits here?"  

  5. **Counterexample Test**  
     - *Check:* Does the claim **dismiss clear exceptions**?  
     - *Pass:* Addresses known counterexamples (e.g., "Some forager societies had inequality; here’s why grain storage differs").  
     - *Fail Threshold:* Ignores major exceptions (e.g., claims all foragers were egalitarian despite evidence like Calusa or Chumash hierarchies).  
     - *Flag:* "Does this account for [briefly name exception]?"  

  ---

  ### **Limitations**  
  - **Will Misfire Against:**  
    - Well-supported but complex claims (e.g., "Climate change enabled the Neolithic") if oversimplified in drafting.  
    - Nuanced just-so stories that mimic passing tests (e.g., adding token alternatives but still relying on fitted logic).  
  - **Will Wave Through:**  
    - Claims with accurate mechanisms but poor evidence if phrased carefully.  
    - Claims that pass tests but rely on disputed definitions (e.g., "inequality").  

  ### **Handoff to Humans**  
  The protocol stops and flags for expert judgment when:  
  - Definitions are contested (e.g., "trap," "worse off," "cooperate at scale").  
  - Competing frameworks exist (e.g., measuring welfare by population growth vs. individual health).  
  - Evidence quality is debated (e.g., how to weigh Çatalhöyük against broader Neolithic trends).  

  ---

  ### **Applied to Your Examples**  

  #### **Claim 1: "The Neolithic transition was a trap..."**  
  1. **Monocausality:** Passes (acknowledges population dependency as reinforcing factor).  
  2. **Predictive Mechanism:** Passes ("could not go back" implies path dependency).  
  3. **Level Consistency:** **FAILS** (jumps from individual health to "catastrophe" without linking to societal collapse).  
     - *Verdict:* **Not established.**  
     - *Tutor Script:* "The claim connects farming to individual costs but doesn’t explain why this made societies *as a whole* worse off. Did population growth offset health declines? We’d need that link to call it a 'catastrophe.'"  

  #### **Claim 2: "Inequality is a product of agriculture..."**  
  1. **Monocausality:** **FAILS** (ignores alternatives: e.g., maritime resources, inherited knowledge, or social technologies like ritual).  
     - *Verdict:* **Not established.**  
     - *Tutor Script:* "This pins inequality solely on grain storage, but some non-farming societies had wealth gaps (e.g., Pacific Northwest foragers). Could other factors enable inequality? Without addressing this, the argument isn’t proven."  

  #### **Claim 3: "Grand narratives are self-undermining..."**  
  1. **Monocausality:** Passes (focuses on comparative method as the cause).  
  2. **Predictive Mechanism:** Passes (argues the method *predictably* undermines itself).  
  3. **Level Consistency:** Passes (method → conclusion).  
  4. **Outcome Selection:** **FLAGS FOR HUMAN JUDGMENT** (trade-off: does the insight justify rejecting all generalizations?).  
  5. **Counterexample:** N/A (meta-argument).  
     - *Verdict:* **Passes tests but needs human interpretation.**  
     - *Tutor Script:* "The logic holds internally, but we must interpret whether *all* generalizations are invalid, or if some cautious comparisons survive. That’s a scholarly debate—your instructor can advise how they weigh this."  

  ---

  ### **Why This Works for Tutoring**  
  - **Defensible:** Each verdict cites a specific, teachable flaw.  
  - **Time-Efficient:** Tests take <15 mins once familiar.  
  - **Safe for Sophomores:** Focuses on argument structure, not archaeological disputes.  
  - **Pedagogical:** Teaches students to interrogate their own claims: "Did I check for counterexamples? Did I link cause to outcome?"  

  This won’t replace expertise, but it turns "vibes" into actionable feedback. For papers like #3, it clarifies *where* the debate lies—which is still a win for a freshman draft.
