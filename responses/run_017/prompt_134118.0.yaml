  - **Explanatory autonomy**: In variant (i), we can predict simmball states without careenium details. In the indexed variant, we can use either level. In the passive variant, we don't need the careenium for prediction at all. But explanatory autonomy is about whether the higher-level theory is complete without the lower level. In (i), we can have a simmball-level theory that works. In (iii), we don't even need the careenium. In (ii), we can use either, but they are equivalent.

  - **Ontological addition**: This is more contentious. One test might be multiple realizability: can the same simmball state be realized by different careenium states? In (i) and (iii), yes (in (iii) the careenium is determined by simmballs, but different careenium states might realize the same simmball state? Actually in (iii) the careenium state is uniquely determined by simmball positions, so it's not multiple realizable in the same way). But in (i), multiple careenium states can realize the same simmball state, so the simmball state is not identical to any particular careenium state. In (ii), there is no multiple realizability, so the simmball state is identical to the careenium state.

  An intervention to discriminate: 
  - For causal relevance: Freeze the careenium in a particular state and see if the simmballs still move according to their rules. In (i) and (ii), if the careenium is frozen, the simmballs might not move (because they rely on the careenium slopes). In (iii), the simmballs move independently, so they would continue. This tests whether the careenium is causally necessary for simmball movement. Alternatively, intervene on the simmballs without affecting the careenium (if possible). But in (i) and (ii), moving a simmball would require changing the careenium because of the depression. So we might need a more subtle intervention.

