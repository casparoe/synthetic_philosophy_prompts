  ### 3. Predictive indispensability vs. causal standing

  Suppose the careenium-level evolution is intractable (e.g., chaotic or too complex) but the simmball-level rules are tractable. This makes the simmball level predictively indispensable. However, does that confer causal standing?

  Causal standing is about what actually produces the effects in the world, not about our ability to predict. Predictive indispensability is epistemic; causal standing is metaphysical. In the interventionist account, causal standing is defined by what would happen under interventions. If we can show that interventions on simmball states (while holding other factors fixed) change the outcome, then the simmball level has causal standing. The tractability of the simmball level does not by itself confer causal standing; it might be that the simmball level is just a convenient summary of the underlying causes. But if the interventionist criterion is met, then it has causal standing.

