  ### 2. Coarse-graining cuts both ways

  Coarse-graining (many-to-one mapping) allows the higher level (simmball) to abstract away irrelevant details (e.g., exact careenium microstates that don't affect simmball outcomes). This makes the simmball level a useful, efficient description. However, because every simmball event is realized by some careenium event, and the careenium dynamics are sufficient to explain the entire evolution, the simmball level can seem epiphenomenal.

