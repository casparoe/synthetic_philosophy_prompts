  ### 1. When is the shoving question well-posed?

  The shoving question ("who shoves whom?") is about causal direction between levels.

  - **Variant (i) Pliable**: 
    - The mapping from careenium to simmball is many-to-one (coarse-grained). 
    - Causation is bidirectional: simmball positions deform the careenium, and careenium deformations influence simmball movements.
