  - **Variant (ii) Indexed**:
    - One-to-one mapping: each simmball state corresponds to exactly one careenium state and vice versa.
    - The dynamics are defined at the careenium level, but because of the mapping, we can also describe the same dynamics at the simmball level without loss. 
