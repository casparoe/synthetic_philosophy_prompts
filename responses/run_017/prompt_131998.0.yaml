          Step 1: To connect A and B, they must use a connector R1. They place R1 between A and B and say that R1 connects A and B. Now they have a structure: A-R1-B. But they have three distinct items. How are A and R1 connected? They haven't connected them. They just placed them next to each other. So we need a rule that every connection between two items requires a connector. 

