          - Rule: To connect two items (which can be atomic or a composite structure), you must use one white connector block. You attach the two items to the white block (say, by placing the white block between them and touching both). But then the white block is now connected to both? Then we have three items. The white block is now part of the structure. But the problem is that the white block is now connected to the two blocks, but we haven't connected the two blocks to each other? 

