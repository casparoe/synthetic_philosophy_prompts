prompt: |-
  I teach a first-year seminar on practical reasoning, and I keep running into a pattern in student case discussions that I can neither name nor place. I would be grateful for help identifying it, and I do not want just a label: I want to know what exactly the phenomenon is, what it is not, and where its edges are.

  Here is the abstract shape I think I am seeing. Standard doctrine holds that a fully rational agent can never lose, in expectation, by being handed a free and perfectly accurate signal before she chooses: she can always ignore what she learns and do what she would have done anyway, so the information can only help her match her action to the world. A colleague said this is called something like Good's theorem. But my students keep producing cases in which the agent reasonably declines free and reliable information, for a reason that is not the obvious one. She is not afraid of bad news, she does not distrust the source, she is not avoiding a cost or an effort, and she does not think her future self will panic or be tempted. What she says is roughly this: if I knew, I would have to act on it, and I would rather act on what I have now. Two examples from last term. First, a woman is offered, at no cost, a highly accurate predictive test before deciding whether to continue a pregnancy; she declines, and when pressed she insists she is certain she would respond to an unfavorable result exactly as she ought to respond — that is precisely the trouble, because the response she would then owe is one she does not want to make, and she would rather remain in the position where what she owes is to continue. Second, a mid-level manager at a firm being audited arranges not to be read into certain internal findings, not to protect anyone and not out of fear, because if she knew she could no longer truthfully tell the auditors that she had not known: the knowledge would remove a thing she can presently do — speak, assert, vouch, hope — and she wants to keep that available. In the second case the loss looks as though it lives in the space of actions; in the first it looks as though it lives in what the agent takes herself to have reason to do. In both, the agent concedes that the information is free, accurate, and would be used correctly, and still chooses ignorance.

  So my questions. Does this configuration have an established name — ignorance used as a way of keeping some action, or some set of reasons, available to oneself, by an agent who concedes the information would be used well? If it does, give me the carving rather than the term: which of the nearby notions is the right one, and exactly how does my case differ from each of the others? I can think of several that are close but that I do not think fit: the psychological literature on avoiding information one would feel bad about having; the stories in which a present self hides information from a future self who would otherwise give in to temptation; the cases where better information makes everyone worse off because it destroys the possibility of pooling, insuring, or being trusted; and the findings that some simple rules decide better on less data. None of these seems to be what is going on, but I cannot say precisely why. If the pattern has no name, please name and define it yourself, state its boundary cases, and say whether it is a genuine exception to the free-information result — that is, which assumption of that result it violates — or whether it collapses into incoherence once the case is described properly. Lead with a one-sentence verdict, then give the carving, and keep the whole answer under 600 words, in compressed prose or a compact bulleted layout, whichever fits more in.
reasoning: |-
  Alright, let me tackle this professor's query. They teach a practical reasoning seminar and noticed a pattern where students present cases where agents decline free, reliable information not due to standard reasons like cost or temptation. Instead, the agent wants to preserve their current set of actions or reasons. 

  First, the professor mentions Good's theorem, which states that rational agents shouldn't refuse free information. But the examples challenge this. The pregnancy test case: the woman knows she'd act correctly on bad news but prefers avoiding that obligation. The manager avoids knowledge to maintain plausible deniability, not out of fear but to keep certain actions available. 

  The key here is that the value lies in the agent's current epistemic state enabling specific actions or reasons. The professor wants to distinguish this from concepts like information avoidance due to emotion, strategic ignorance, or rational inattention. 

  Looking deeper, the core is about the instrumental value of ignorance for preserving optionality. The woman keeps the reason to continue the pregnancy; the manager keeps the ability to truthfully deny knowledge. This isn't about psychological comfort but about maintaining a normative position. 

  I recall Kavka's "toxin puzzle" where intending to drink toxin requires not knowing you won't, but that's different. Here, it's about the action-space being constrained by knowledge. The violation of Good's theorem comes from the state-dependent action sets. Once informed, certain actions become impossible or obligatory, changing the available options. 

  So, the phenomenon is "Epistemic Entrenchment of Agency" or "Normative Option Preservation." It violates Good's theorem's assumption that the action set remains constant. In these cases, knowing alters what one can or must do, making ignorance valuable for preserving current capacities.
answer: |-
  ### Verdict
  This is **Normative Option Preservation**: rational refusal of free information to maintain access to current permissible actions or reasons, where knowledge would *alter one's normative position* by eliminating options or imposing obligations.

  ---

  ### Carving the Phenomenon  
  1. **Core Mechanism**:  
     - Knowledge changes the *set of normatively available actions/reasons*, not just beliefs.  
     - Ignorance preserves a **valuable action or reason-set** that would be *inaccessible* if informed.  
     - *Not* about emotional cost, distrust, or strategic coordination failures.  

  2. **Boundary Cases**:  
     - **INCLUDES**:  
       - *Pregnancy test*: Uninformed, she has a reason to continue; informed (if unfavorable), she has an obligation to abort. Ignorance preserves "reason to continue."  
       - *Manager*: Uninformed, she can truthfully deny knowledge; informed, she cannot. Ignorance preserves "capacity for truthful denial."  
     - **EXCLUDES**:  
       - *Affective avoidance* (e.g., refusing cancer screening due to anxiety).  
       - *Self-binding* (e.g., Ulysses avoiding sirens).  
       - *Strategic ignorance* (e.g., avoiding knowledge to enable plausible deniability in *deception*).  
       - *Information cascades* (e.g., herding effects damaging group outcomes).  

  3. **Violation of Good’s Theorem**:  
     - **Assumption violated**: *Fixed action set*.  
       - Good’s theorem assumes knowledge expands options (by refining beliefs) without *removing* actions.  
       - Here, knowledge *eliminates actions* (e.g., truthful denial) or *imposes obligations* (e.g., abortion duty), altering the choice architecture.  
     - **Coherence**: Robust—agents maximize expected utility *over trajectories of normative positions*, not just world-states.  

  ---

  ### Distinctions from Nearby Concepts  
  | Concept               | Key Difference                                  |  
  |-----------------------|------------------------------------------------|  
  | **Motivated Ignorance** | Avoids *discomfort*; here, avoids *normative loss* (e.g., obligation). |  
  | **Precommitment**     | Controls *future irrationality*; here, future self is fully rational. |  
  | **Rational Inattention** | Weighs *cost* of info-acquisition; here, info is free. |  
  | **Signaling Games**   | Focus on *equilibria* among agents; here, single-agent normative shift. |  

  ### Status  
  - **Genuine exception** to Good’s theorem due to **state-dependent action sets**.  
  - **Not incoherent**: Reflects higher-order rationality about one’s agential constraints.  

