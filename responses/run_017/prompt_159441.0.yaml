  The feature that does the work is the externality: each person's action affects the other. The conflict does not rely on meddlesome preferences (approving or disapproving of the other's choice per se) but on the material impact. 

  If we remove the preferences that range across another person's sphere, note that in this example, the only preferences they have are based on their own material welfare, which is affected by the other's action. If we were to forbid any preference that is affected by another's action in their personal sphere, then we would have to say that the personal sphere actions have no external effects. But then the whole economic problem of externalities would be assumed away. In that case, the conflict might not arise, but that is because we've assumed no externalities.

  Escape routes for a defender of Paretian liberalism:

  1. Refusing to count cross-sphere preferences when assigning rights: 
