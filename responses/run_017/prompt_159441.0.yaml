  The least damaging escape route might be to allow for incomplete orderings, but then we have to explain why society cannot compare A and D even though both individuals prefer D to A.

  What to tell students: The liberal paradox is not just about meddlesome preferences. It can arise from ordinary externalities where each person's private action has a material impact on the other. The core of the problem is the combination of individual rights over personal actions and the Pareto principle when there are externalities. The conflict is between two kinds of efficiency: one based on individual liberty and the other based on mutual improvement. A rights assignment that ignores externalities may lead to Pareto-inefficient outcomes, and the Pareto principle may then conflict with the exercise of those rights.

