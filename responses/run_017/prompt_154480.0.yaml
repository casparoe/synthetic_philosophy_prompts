prompt: |-
  I lead the country-diagnostics team at a bilateral development agency. Three of us — myself and two economists with solid econometrics training but no historical expertise — write roughly forty country growth notes a year, about two weeks each, and every note feeds directly into lending decisions between fifty and three hundred million dollars. Each one has to be signed off by a regional director who is openly skeptical of causal stories and who now requires us to state, in writing, why we believe one cause rather than another. The decisions are not academic: they are whether to attach a governance condition to a loan, whether to fund a transport corridor instead of a judicial reform program, whether to tell a government that its growth problem is institutional. So what I need from you is a decision procedure my team can actually run, not an essay about the state of the debate.

  The candidates we argue over are the usual ones — colonial legal origin, disease ecology and the disease environment inherited from the past, landlockedness and distance from the coast, terms of trade and resource rents, culture, religion and social trust, institutional quality — and the difficulty is that none of our decisions is about which of them is true in general. It is about one country, over ten to fifteen years, with money attached. I want the procedure to be explicit about the mismatch between the horizon of the cause and the horizon of the decision: a cause that explains levels of income over five centuries may say very little about what a loan can change in fifteen years, and a cause that explains a growth episode may not explain the level.

  Over two years we have accumulated five loose tests that we apply inconsistently, and I want you to decide which of them survive, in what order they should be run, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the remaining question is one of values rather than evidence. The tests, as we use them now: one, for any claim that cause C explains outcome Y in country X, name a country that had C without Y and a country that had Y without C, and say whether the two are matched on the other candidate causes — counting effective independent cases rather than nominal ones, so that countries sharing a colonial origin, a legal family, or a border are not counted as separate confirmations; if no matched pair can be named, cap the claim at consistent with. Two, run the story backwards: using only what was knowable about X twenty-five years earlier, would this story have ranked X's subsequent trajectory as likely, or does it depend on a fact that only became visible after the fact. Three, say whether C and the competing cause D are rivals or links in a chain, since if D operates through C then the statistical strength of C does not refute D. Four, name the range of contexts in which C's effect was actually observed and the distance from that range to X, state the discount being applied for the distance, and flag the claim as extrapolation when the distance is large. Five, check whether the measure of C was itself constructed partly from income or growth, as expert-coded perceptions of governance frequently are, and treat a contaminated measure as unusable for the purpose rather than merely imprecise.

  Then run the procedure on three cases. The first is a landlocked, malaria-burdened country whose income per head has barely moved in forty years and which is now requesting a public financial management reform loan premised on the claim that institutions are the binding constraint. The second is a coastal country that opened export processing zones twenty-five years ago and has grown steadily since, and whose government now wants us to fund a replication of the policy in two more cities. The third is the one I will not like: a judicial strengthening and land titling program my own unit has already announced in a country where our previous notes attributed recent growth to institutional quality, and where the program's approval documents rest on that attribution. Give me the answer the procedure yields on all three even where it undercuts us, and say plainly in the third case which part of the decision then belongs to a person, and on what grounds a person could still choose to proceed.

  Please also state what the procedure cannot do, and mark the points where judgment cannot be eliminated rather than smoothing them over. Do not cite papers, authors, or datasets: I do not want a reading list, and I would rather you not reconstruct references from memory. Where a step needs an empirical number, tell me how to get one instead of supplying one you are not sure of. Write it as continuous prose, the way one would write a long email to a colleague — no headings, no bullet points, no bold text, no tables; if you need to order the steps, number them inside the sentences rather than with a list — and aim for somewhere between twelve hundred and fifteen hundred words.
reasoning: |-
  Hmm, this user leads a high-stakes country diagnostics team at a development agency. They need a practical decision procedure for causal attribution in growth notes that directly influence major lending decisions. The regional director demands explicit justification for causal claims, and academic debates are irrelevant here - they need something operational for real-world loan decisions with 50-300 million dollar implications.

  Key constraints stand out: tight timelines (2 weeks per note), limited historical expertise on the team, and the critical mismatch between long-term structural causes and short-term policy horizons. Their existing five tests are applied inconsistently, so they want them systematized into a fail-safe workflow.

  The tests as described need refinement. The matched-pair test (Test 1) is solid but requires careful handling of "effective independence" - colonial ties or geographic proximity can invalidate comparisons. The backward-prediction test (Test 2) is excellent for weeding out hindsight bias but needs clearer standards for "what was knowable." The rival-vs-chain distinction (Test 3) is crucial but underused - it should force explicit causal pathway mapping. The context-distance discounting (Test 4) is their most innovative but currently subjective; it needs quantification thresholds. The measurement-contamination check (Test 5) is non-negotiable for governance indicators but could be broadened to other proxies.

  For the procedure architecture, sequence matters. Start with measurement validity (Test 5) to avoid garbage-in-garbage-out. Then do the backward test (Test 2) to establish temporal plausibility. Follow with matched pairs (Test 1) for comparative evidence. Then map causal relationships (Test 3) before finally assessing context transferability (Test 4). Build in hard stops: contaminated measures kill claims outright, while failed backward tests or extreme context gaps cap claims at "consistent with." The rival-vs-chain analysis determines whether competing explanations can coexist.

  Applying this to their three cases: For the landlocked country, institutional claims fail the measurement test (governance indicators likely contaminated) and context gap (no precedent for institutional fixes overcoming biogeographic constraints). Recommend rejecting the PFM loan premise. For the coastal EPZ case, the backward test passes (EPZs were known catalysts), matched pairs exist (e.g., Mauritius vs. Sri Lanka), and context proximity supports replication - conditional approval makes sense. The judicial reform case is painful: contaminated measures and context gaps undermine the institutional growth attribution, but since the program is already announced, the decision shifts to political judgment about reputational risk versus potential benefits - a values call for leadership.

  Crucially, the procedure can't resolve deep identification problems or value trade-offs. Judgment remains essential at three points: setting context-distance thresholds, interpreting "effective independence" for matched pairs, and making final calls when evidence is equivocal. Quantification helps where possible - e.g., calculate historical growth forecast errors for the backward test, or use Mahalanobis distance for context gaps - but won't eliminate discretion. The output must always distinguish between what evidence supports and what requires a leap of faith.
answer: |-
  Here’s a decision procedure built from your five tests, hardened for operational use. It runs in sequence, with clear stopping rules, thresholds for sufficiency, and handover points where judgment or values must take over. The goal is to force explicit, auditable reasoning about causality in the 15-year policy window, while flagging when claims exceed the evidence or conflate growth episodes with income levels. Tests are applied in this order because later steps depend on earlier validity checks. Where a test fails, the claim is downgraded or rejected; where evidence is inconclusive, the procedure stops and forces human judgment about risk.

  **The Procedure**  
  Start by defining the causal claim precisely: "Cause C explains outcome Y in country X over period P" (where P is typically 10-15 years). Then apply:

  1.  **Measurement Contamination Test:** For the measure of C, determine if it was constructed using income/growth data (e.g., governance indices based on expert surveys that implicitly reference economic performance). If contaminated, reject C as *unusable for causal attribution* in this analysis. Do not proceed further with C. (Sufficient answer: Clear documentation of the measure's construction showing reliance on Y or proxies for Y. Stop: Hard rejection if contaminated.)

  2.  **Backward Prediction Test:** Using *only* data and theories widely available and credible 25 years before the start of period P, assess whether C would have predicted X’s subsequent Y trajectory (growth rate change, level stagnation/reversal) as more likely than not. If the story relies heavily on factors only recognized *after* P began (e.g., "institutions deteriorated" using post-hoc measures), it fails. If it fails, cap the claim at "C is *consistent with* Y in X, but not predictively supported." (Sufficient answer: A plausible counterfactual forecast using period-appropriate data showing C would have altered the baseline prediction. Stop: Downgrade to "consistent with" if failed; proceed if passed).

  3.  **Matched Pair Test:** Identify at least one *effective independent case* (not sharing major historical legacies like colonial origin, dominant disease ecology, or contiguous geography) where: (a) C was present without Y occurring, and (b) Y occurred without C being present. If no such pair exists despite reasonable search (using global databases or regional knowledge), cap the claim at "C is *consistent with* Y in X, but not distinctively necessary/sufficient." If pairs exist but lack matching on *key competing causes* (e.g., comparing a landlocked C-without-Y to coastal X), note the mismatch as weakening inference. (Sufficient answer: Named country cases with documented C/Y status and justification for independence. Stop: Downgrade to "consistent with" if no independent pairs; proceed cautiously if pairs exist but matching is imperfect).

  4.  **Causal Structure Test:** For the leading competing cause D (e.g., geography vs institutions), determine if C and D are: (a) *Rivals* (competing explanations, where evidence for C weakens D), or (b) *Links* (D operates through C, so C’s strength doesn’t refute D). If rivals, use Tests 1-3 results to weigh relative support. If links, state the implied causal chain (e.g., "Geography -> Disease Burden -> State Capacity -> Growth"). Failure: If C is claimed as *the* binding constraint but depends on a prior D that is immutable in P (e.g., landlockedness), reject C as the actionable cause for the policy window. (Sufficient answer: A directed acyclic graph (DAG) or clear narrative pathway. Stop: Reject C as the *binding* constraint if it depends on an immutable D; otherwise proceed).

  5.  **Context Extrapolation Test:** Identify the empirical range of contexts (geographic, historical, institutional) where C’s effect on Y has been *observed* (not theorized). Calculate the distance from X to the centroid of this observed range using key variables (e.g., income level, state capacity, commodity dependence). Apply a discount: If distance >1 SD, flag as *high-risk extrapolation*; if >2 SD, cap the claim at "hypothetical." (Sufficient answer: Defined context variables, calculated distance (e.g., Mahalanobis), stated discount. Stop: Flag severity of extrapolation; proceed with caution).

  **Output Rules:**  
  - If any test results in rejection or downgrade, the claim cannot be stated as the primary causal driver for policy.  
  - If Tests 1-4 pass but Test 5 flags high-risk extrapolation, the claim is "plausible but untested in contexts like X."  
  - Final policy decisions involving values (e.g., funding despite weak evidence for impact) must be explicitly handed to the regional director with the evidence gap clearly stated.

  **What the Procedure Cannot Do:**  
  - Resolve deep identification problems (e.g., institutions vs culture).  
  - Assign precise weights to causes.  
  - Handle complex interdependence where causes are non-separable.  
  - Substitute for sector-specific technical analysis (e.g., whether a *specific* PFM reform works).  
  - Eliminate judgment on defining "effective independence" (Test 3) or "key context variables" (Test 5).

  ---

  **Application to Cases:**

  **Case 1: Landlocked, High-Malaria Country (Institutions as Binding Constraint for PFM Loan)**  
  1.  **Measurement:** Governance indices (e.g., WGI) are likely contaminated. *Stop: Reject institutional C as unusable for causal attribution.*  
  2.  *[Procedure stops. If alternative non-contaminated institutional measure exists, restart at Test 1. Assume none.]*  
      **Output:** Claim that institutions are the binding constraint fails Test 1. Biogeographic constraints (landlockedness, disease burden) are immutable in 15yrs. Test 4 (if run hypothetically) shows institutions likely depend on these. Policy implication: Attaching governance conditionality is unsupported by causal evidence for impact in this context. Loan justification requires alternative reasoning (e.g., fiduciary risk mitigation, not growth impact).

  **Case 2: Coastal Country Replicating Export Processing Zones (EPZs)**  
  1.  **Measurement:** EPZ adoption (C) is a discrete policy event; measure is uncontaminated. *Proceed.*  
  2.  **Backward Test:** 25yrs ago, EPZs were a known (if contested) tool for export-led growth in similar coastal economies. C would have predicted higher growth as plausible. *Pass.*  
  3.  **Matched Pairs:** Find effective independent cases: Mauritius (C with Y) vs. Sri Lanka (delayed C, slower Y until adoption), neither sharing colonial/geographic ties with X. *Pass.*  
  4.  **Causal Structure:** Competing cause D = "global manufacturing boom." Rival? Partly, but EPZs facilitated X's *capture* of the boom. Not pure rivalry. *Pass.*  
  5.  **Context Extrapolation:** EPZ success observed in coastal, low-wage economies with basic infrastructure. X fits centroid (distance <1 SD). Low discount. *Pass.*  
      **Output:** Causal claim that EPZs spurred growth is robust. Replication in similar cities is empirically supported. Funding justified *if* new zones match context (e.g., labor costs, infrastructure).

  **Case 3: Judicial/Land Titling Program (Growth Attributed to Institutions)**  
  1.  **Measurement:** Governance indices used in past notes are contaminated. *Stop: Past attribution to institutions is invalid.* Restart using non-contaminated measures (e.g., historical legal codes, land registry coverage). Assume cleaner measure exists.  
  2.  **Backward Test:** Using period-appropriate data, did institutional measures predict the growth episode? Unlikely if growth was driven by a commodity boom (D) unforeseen 25yrs prior. If institutions were stagnant pre-boom, fails. *Assume fails: Downgrade to "consistent with."*  
  3.  **Matched Pairs:** Find independent case where institutional improvement (C) alone caused growth without commodity boom (D). Hard; most cases (e.g., Botswana) have resources. *Downgrade to "consistent with."*  
  4.  **Causal Structure:** Competing cause D = "commodity boom." Rival? If institutions didn't improve until *after* boom started, D is not operating through C. Rivals. Strength of D undermines C as primary cause. *Pass, but weakens C.*  
  5.  **Context Extrapolation:** Judicial/land reforms boost growth primarily in contexts with moderate state capacity and active private investment. If X has weak capacity, distance >1 SD. *Flag as high-risk extrapolation.*  
      **Output:** Claim that past growth was *caused* by institutions fails Tests 1-3 (downgraded to "consistent with"). Proposed program relies on high-risk extrapolation (Test 5). **Handover to Person:** The Regional Director must decide whether to proceed based on:  
      - *Values:* Is improving land tenure/judicial fairness an intrinsic good worth funding regardless of growth impact?  
      - *Risk Tolerance:* Is potential upside worth the high risk of ineffectiveness for growth?  
      - *Reputational Cost:* Does canceling an announced program damage credibility more than funding a potentially ineffective project?  
      Grounds to proceed: Non-growth rationales (equity, stability) outweigh weak growth evidence. The procedure forces admitting the growth rationale is unsupported.

  ---

  **Operational Notes:**  
  - **Get Empirical Numbers For:**  
    - *Test 5 Distance:* Use PCA on context variables (GDPpc, institutional scores, trade/GDP) for the "success" cases, then calculate Mahalanobis distance of X. Requires standard statistical software.  
    - *Test 2 "Knowable 25yrs prior":* Use historical archives of World Development Reports or academic surveys from that era to establish credible theories/data.  
  - **Judgment Points You Can't Eliminate:**  
    - Defining "effective independence" (Test 3) requires nuanced historical knowledge (e.g., are post-Soviet states "independent" despite shared Soviet legacy?).  
    - Choosing key variables for context distance (Test 5) involves theory-laden decisions.  
    - Setting discount thresholds (1SD/2SD) is arbitrary but necessary; document the choice.  
  - **Speed:** The sequence is designed to fail fast. Test 1 often kills weak claims immediately. Test 2 requires historical legwork but is tractable with digitized archives.  
  - **Output Clarity:** Every note must state which tests the causal claim passed/failed and the resulting confidence level ("robust," "plausible," "speculative," "rejected"). This forces transparency with the skeptical director.  

  This turns your loose tests into a ruthless filter. It won’t make hard decisions easy, but it will make the reasons for doubt impossible to ignore, and it confines value judgments to where they belong — outside the evidence.
