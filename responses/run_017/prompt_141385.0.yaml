prompt: |-
  I'm a staff engineer at a company that builds autonomous coding agents, and I chair the design review that has to sign off on anything that changes what an agent optimizes for, what supervises it, or how its outputs get evaluated. The stakes are real: these agents hold write access to production repositories, and several thousand external users depend on them. We see roughly eight design docs a month, the decision is made in a single 45-minute meeting, both the author and I have to sign, and a separate safety reviewer can veto. Reviewers are backend and ML engineers with no philosophy background whatsoever.

  Our docs already require a mandatory "Support Chain" section, in which the author has to state, for every component that is supposed to accomplish something, what does the accomplishing. In practice authors fill it with sentences that have the shape of an explanation without the substance, and I have no reliable way to tell the difference. The distinction I want operationalized is Daniel Dennett's contrast between cranes and skyhooks, together with his complaint about greedy reductionism. As I understand it: a crane gets its lifting power from machinery that is itself already supported from below, whereas a skyhook is invoked as if it lifted from above and is typically defined by the outcome it is supposed to produce rather than by anything that could implement it. Greedy reductionism, as I understand it, is the error in the other direction — dismissing a real higher-level pattern because you can point at the lower-level machinery it is made of. I may have the details wrong; if so, correct me, but keep the correction usable by someone who will never read the book.

  Two features of our systems make the translation harder, and I'd like both taken seriously. First, nearly every component in one of our support chains is itself a trained model whose behavior we can only characterize empirically, so our chains do not bottom out in a specification or a piece of hardware; they bottom out in measurements with a stated scope. Second, our docs mix three kinds of claim that I suspect need different treatment: mechanism claims (this component does X by doing Y), guarantee claims (the system will not do Z, or will always do W), and evaluation claims (on this benchmark distribution, metric M improves). My guess is that guarantee claims are where skyhooks hide and evaluation claims are where greedy reductionism hides, but that is only a guess.

  Please write me a review procedure my team can actually run. Constraints: it must be executable in a 20-minute pre-read by an engineer with no philosophy background; it must terminate in one of four verdicts — accept, reject, restructure, or escalate to leadership; and it must be explicit about which questions are matters of fact and which are matters of values or risk appetite that no procedure can settle. It should catch errors in both directions: unsupported top-down explainers, and level-collapsing that explains away something real.

  Structure the response in exactly these sections, in this order:

  1. "Vocabulary without the philosophy" (250-350 words). Restate cranes, skyhooks, and greedy reductionism in terms an engineer will recognize, with one concrete example of each drawn from ML systems, and state explicitly where the analogy to ordinary software breaks — in particular what counts as solid ground when the lowest level is an empirical characterization rather than a specification.

  2. "The procedure" (800-1,000 words). The ordered questions to run on a single design doc, each with what counts as a sufficient answer, the failure mode the question exists to catch, and the verdict it exits with. Cover how to audit one Support Chain entry, how the three claim types are treated differently, what to do with cranes that are promised but do not exist yet, and the points at which the procedure hands the decision to a person because the remaining question is one of values rather than fact.

  3. "Worked reviews" (three cases, 250-350 words each). (a) A proposal to train a learned verifier that scores the agent's patches, where those scores are also used as the training signal for the agent, and where the only evidence offered is an improvement on a held-out benchmark. (b) A proposal to let the agent rewrite its own system prompt, with a second model acting as a "meta-critic" that approves or rejects edits for fidelity to the user's intent. This one is already deployed to internal users and I would prefer not to be told it is broken; tell me what the procedure says anyway. (c) A proposal to remove intentional vocabulary from our docs and tooling — that the agent "wants", "knows", or "is trying to" do something — on the grounds that it is next-token prediction all the way down, so there is nothing to model at the level of goals. Give the verdict the procedure actually returns in each case.

  4. "Where it misfires" (250-350 words). The false positives and false negatives I should expect: legitimate new primitives the procedure will wrongly flag, genuine skyhooks that will pass it, and how quickly it degrades once an author learns to write in a way that satisfies it. Say plainly what the procedure cannot do.

  5. "The one-page version" (a compact checklist or table, under 250 words), in a form I can paste into our review template.
reasoning: |-
  We are creating a structured review procedure based on Dennett's concepts of cranes and skyhooks, and greedy reductionism, tailored for an engineering team designing autonomous coding agents. The procedure must be pragmatic, executable by engineers without philosophy backgrounds, and fit within tight time constraints.

  We break down the response into the specified sections.

  ### 1. Vocabulary without the philosophy

  We need to define:
  - **Cranes**: Mechanisms that are built from lower-level, well-understood components and provide a solid foundation for higher-level functions. They are supported by empirical evidence or specifications at each level.
  - **Skyhooks**: Imaginary constructs that are invoked to explain a function but lack any lower-level support. They are defined by what they are supposed to do without a clear mechanism.
  - **Greedy Reductionism**: Dismissing a higher-level phenomenon by reducing it to lower-level components without acknowledging the emergent properties or patterns that arise at the higher level.

  **Examples**:

  - **Crane example**: A retry mechanism in an API client that uses exponential backoff. The backoff intervals are computed by a deterministic algorithm (a lower-level crane) and the retry logic is built on top of that. In ML, consider a model that uses pre-trained embeddings: the embeddings are a crane because they are trained on large corpora (empirically grounded) and the model builds on them.

  - **Skyhook example**: A module labeled "intent understanding" that is described as "ensuring the agent correctly interprets user requests" but is implemented by a black-box model without any validation of its internal mechanisms or without any testing beyond end-to-end metrics. The skyhook is the unexplained ability to "understand".

  - **Greedy Reductionism example**: Claiming that a model's ability to generate code is "just" next-token prediction, ignoring the emergent capabilities that arise from the scale and training data. This might lead to dismissing the need for safety checks at the agent level because "it's all just tokens".

  **Where the analogy breaks**:

  In ordinary software, we often have specifications and deterministic code. In our ML systems, the lowest level is an empirical characterization (e.g., a model with a stated accuracy on a test set). So, **solid ground** is:
  - A component that has been empirically validated over a defined scope (e.g., a model with a known error rate on a specific dataset) and whose limitations are documented.
  - A component that is a primitive (e.g., a mathematical operation) or has a formal specification (e.g., a cryptographic hash function).

  Without this, we are building on sand.

  ### 2. The procedure

  We design a step-by-step procedure to review a design doc. The procedure is applied to the entire document but with a focus on the Support Chain section and the three claim types (mechanism, guarantee, evaluation). The procedure is a series of questions that must be answered. We aim for efficiency: the reviewer should spend about 20 minutes on the pre-read.

  **Overall structure**:
  1. Pre-read: Skim the entire doc to understand the overall goal and structure.
  2. Focus on the Support Chain section and the claims (mechanism, guarantee, evaluation) throughout the doc.
  3. For each component in the Support Chain, and for each claim, apply the relevant questions.

  **The Questions**:

  1. **For every component in the Support Chain**: 
     - **Question**: What is the empirical or formal basis for this component? 
     - **Sufficient answer**: The component is either:
       - A primitive (e.g., a known algorithm, a library function) with a reference to its specification or known behavior.
       - A trained model with a clear description of the training data, evaluation metrics, and performance on a validation set (with known limitations).
       - A composition of lower-level components that are already vetted (and the composition is straightforward).
     - **Failure mode**: Skyhook (component is described by its intended outcome without a clear foundation).
     - **Verdict if failed**: Restructure (if the basis is missing) or Reject (if the basis is fundamentally flawed).

  2. **For mechanism claims (this component does X by doing Y)**:
     - **Question**: Is the "by doing Y" part supported by a crane (i.e., is Y itself supported)? 
     - **Sufficient answer**: The explanation traces down to an empirical or formal basis without gaps. If Y is a model, it must have been validated (see above).
     - **Failure mode**: Skyhook in the mechanism (the "by doing Y" is a handwave).
     - **Verdict if failed**: Restructure.

  3. **For guarantee claims (the system will not do Z, or will always do W)**:
     - **Question**: What is the crane that enforces this guarantee? 
     - **Sufficient answer**: 
       - The guarantee is backed by a mechanism that is itself supported (a crane) and the chain of reasoning must not rely on assumptions that are not validated.
       - If the guarantee is probabilistic (common in ML), the claim must state the confidence level and the conditions under which it holds.
     - **Failure mode**: Skyhook (guarantee is asserted without a supporting mechanism) or greedy reductionism (dismissing a real risk because "the model is trained to be safe" without evidence).
     - **Verdict if failed**: Reject (if the guarantee is critical and unsupported) or Restructure (if it can be reframed as an evaluation claim).

  4. **For evaluation claims (on benchmark D, metric M improves)**:
     - **Question**: Does this claim overreach by implying a guarantee? 
     - **Sufficient answer**: The claim is strictly about the benchmark and does not imply a real-world guarantee without additional reasoning. The evaluation must be tied to a specific dataset and metric, and the scope must be clearly stated.
     - **Failure mode**: Greedy reductionism (using a benchmark improvement to dismiss concerns about higher-level risks) or a hidden skyhook (implying the benchmark measures something it doesn't).
     - **Verdict if failed**: Restructure (to clarify the scope) or Reject (if the benchmark is irrelevant).

  5. **For cranes that are promised but do not exist yet**:
     - **Question**: Is the promised crane already in the roadmap with a clear owner and timeline? 
     - **Sufficient answer**: The design doc references a specific, approved project or a commitment from a team, and the current design does not depend on it for critical guarantees.
     - **Failure mode**: Building on a skyhook (the future crane is vaporware).
     - **Verdict if failed**: Restructure (remove dependency) or Escalate (if the project is critical and the crane is not yet available).

  6. **For the entire Support Chain**:
     - **Question**: Does the chain bottom out in a solid ground (empirical or formal) without gaps? 
     - **Sufficient answer**: Every leaf component is either a primitive or has an empirical characterization with a defined scope. There are no components that are defined solely by their intended outcome.
     - **Failure mode**: Skyhook at the base (the foundation is not solid).
     - **Verdict if failed**: Reject or Restructure.

  7. **For the risk of greedy reductionism**:
     - **Question**: Are there any higher-level risks or capabilities that are being dismissed because of a lower-level explanation? 
     - **Sufficient answer**: The design acknowledges emergent risks and does not use lower-level explanations to avoid necessary safeguards.
     - **Failure mode**: Greedy reductionism (e.g., "We don't need to worry about goal misgeneralization because the agent is just predicting tokens").
     - **Verdict if failed**: Restructure (to address the higher-level risk) or Escalate (if the risk is systemic and requires leadership input).

  **When to hand off to a person (values/risk)**:
  - The procedure identifies when a decision requires a value judgment or risk assessment that cannot be settled by facts alone. This happens when:
    - A guarantee claim requires a trade-off between risk and efficiency (e.g., we can have 99% uptime but with a 1% chance of a critical failure). The procedure can flag that the risk level is stated, but whether it is acceptable is for leadership.
    - A design introduces a new kind of risk that is not covered by existing policy. Escalate to leadership.
    - The empirical basis for a component is weak (e.g., a model has only been tested on a narrow dataset) but the author argues it's acceptable for this use case. This is a risk appetite decision.

  **Termination**:
  - If any question leads to a Reject or Escalate, stop and return that verdict.
  - Otherwise, if all questions pass, Accept.
  - If there are Restructure recommendations, return Restructure.

  **Time management**:
  - The reviewer should spend about 2-3 minutes per major component in the Support Chain and about 5 minutes on the overall chain and claim types.

  ### 3. Worked reviews

  **(a) Proposal: Train a learned verifier that scores the agent's patches, and use those scores as the training signal for the agent. Only evidence: improvement on a held-out benchmark.**

  - **Review**:
    - **Support Chain**: The verifier is a model trained to score patches. The basis: it is trained on a dataset of (patch, score) pairs? But how were those scores generated? If the scores come from human evaluators, then that's a crane (if the human evaluation process is well-defined). But if the scores are from another model, we must trace that model's basis. The chain might bottom out in human evaluation (solid) or it might be circular (if the verifier is trained on the agent's own outputs and then the agent is trained on the verifier). 
    - **Mechanism claim**: The agent improves because it is trained on the verifier's scores. But the verifier's ability to score is not grounded if the training data is circular.
    - **Guarantee claim**: None stated, but the implication is that the agent will produce better patches. This is an evaluation claim only (benchmark improvement).
    - **Evaluation claim**: The benchmark improvement is presented. But without knowing the benchmark's relation to real-world quality, it might be a greedy reductionism error (assuming the benchmark captures all that matters).
    - **Greedy reductionism risk**: The benchmark might not capture safety or robustness. The design might be dismissing these because "the verifier score improves".
    - **Verdict**: Restructure. The Support Chain must show non-circular grounding for the verifier's scores. Also, the evaluation claim must not be overinterpreted as a guarantee.

  **(b) Proposal: Let the agent rewrite its own system prompt, with a meta-critic model that approves edits for fidelity to user intent. Already deployed internally.**

  - **Review**:
    - **Support Chain**: 
      - The agent: a model that generates prompt edits. Basis: existing agent model (which has been validated in other contexts?).
      - The meta-critic: a model that evaluates the edit. Basis: How was it trained? If trained on human judgments of "fidelity to intent", that's a crane (if the human eval is solid). But the scope of the human eval must be defined (what kinds of intents?).
    - **Mechanism claim**: The agent rewrites the prompt and the meta-critic checks it. But how does the meta-critic "understand" user intent? If it's a model trained on examples, we need to know the diversity of those examples and the error rate.
    - **Guarantee claim**: Implicitly, the system will not allow a prompt edit that deviates from user intent. But the meta-critic is fallible. Without a stated error rate, this is a skyhook guarantee.
    - **Evaluation claim**: None provided (already deployed, but no data?). The design must provide evaluation or acknowledge the risk.
    - **Verdict**: Restructure. The guarantee claim must be reframed as probabilistic (e.g., "the meta-critic has an error rate of X% on a test set representing Y scenarios"). Without that, it's a skyhook. Also, the Support Chain must specify the empirical basis for the meta-critic (e.g., evaluation on an intent dataset).

  **(c) Proposal: Remove intentional vocabulary ("wants", "knows", etc.) because it's next-token prediction all the way down.**

  - **Review**:
    - **Support Chain**: Not directly applicable (this is about documentation). But the claim is about the nature of the system.
    - **Mechanism claim**: The agent's behavior is generated by next-token prediction. This is true but may be greedy reductionism if it dismisses the utility of intentional stance for predicting and controlling behavior.
    - **Guarantee claim**: None, but the proposal implies that by removing intentional language, we avoid anthropomorphizing and make the system safer? Not stated.
    - **Greedy reductionism risk**: The proposal is an example of greedy reductionism: because the system is implemented by next-token prediction, we should not model it at the level of goals. But the emergent behavior may well be best understood and controlled by attributing goals. Removing the language doesn't remove the emergent behavior.
    - **Verdict**: Reject. The proposal fails to acknowledge that the intentional stance is a useful crane for reasoning about the agent's behavior (even if it's implemented by tokens). Removing the language might hinder clear communication about risks. However, if the proposal were to avoid over-attribution, that might be valid. Since it's presented as an absolute, it's greedy reductionism.

  ### 4. Where it misfires

  **False positives (legitimate primitives flagged)**:
  - A truly novel component that is a primitive (e.g., a new hardware accelerator) might be flagged as a skyhook because it's not yet empirically characterized. The procedure requires empirical grounding, so the design would be rejected until tests are run.
  - A higher-level guarantee that is enforced by a formal method (e.g., a cryptographic proof) might be flagged if the reviewer doesn't understand the math. This would require escalation to an expert.

  **False negatives (skyhooks that pass)**:
  - A component that is validated on a dataset that is not representative of production. The procedure checks for empirical grounding but not the adequacy of the dataset. This is a known gap.
  - A guarantee that is stated with a confidence interval but the interval is too wide to be useful (e.g., "99% safe" but on a narrow test). The procedure doesn't set thresholds for acceptable risk.

  **Degradation over time**:
  - Authors learn to write "crane-like" language without substance (e.g., "this model is trained on a diverse dataset" without specifying what diverse means). To combat this, the procedure must require concrete evidence (e.g., dataset statistics, evaluation results) and reject vague claims.

  **What the procedure cannot do**:
  - It cannot replace domain expertise. It flags unsupported claims but cannot judge the adequacy of the support without the reviewer understanding the domain.
  - It cannot set risk tolerance. It can only flag when a risk decision needs to be escalated.
  - It cannot catch every emergent risk, especially in complex systems. It focuses on the Support Chain and the claim types.

  ### 5. The one-page version

  A checklist for the reviewer to fill out:

  ```
  REVIEW CHECKLIST (based on crane/skyhook/greedy reductionism concepts)

  1. Support Chain Audit:
     - For each component in the Support Chain:
       [ ] Is the component grounded? (Primitive, formal spec, or empirical validation with stated scope)
       [ ] If a model, are the training data and evaluation metrics specified? 
     - Does the chain have any gaps? (Skyhook) [ ] Yes [ ] No

  2. Claim Types:
     - Mechanism claims:
          [ ] Trace the "by doing Y" to a grounded component? (No skyhooks)
     - Guarantee claims:
          [ ] Is there a supporting mechanism (crane)? 
          [ ] If probabilistic, is the confidence/error rate stated? (No absolute guarantees without proof)
     - Evaluation claims:
          [ ] Is the benchmark scope clearly defined? 
          [ ] Does it overreach to imply a guarantee? (Greedy reductionism)

  3. Future Cranes:
     - Are any cranes not yet built? [ ] Yes [ ] No
          If yes: 
          [ ] Is there a committed project? 
          [ ] Is the design safe without it? 

  4. Greedy Reductionism Check:
     - Are there emergent risks dismissed by lower-level explanations? [ ] Yes [ ] No

  Verdict (circle one): 
     Accept - All checks pass.
     Restructure - Minor issues, can be fixed.
     Reject - Foundational flaws (e.g., skyhook, circular dependency).
     Escalate - Requires leadership decision (e.g., risk tolerance, new policy).

  Notes: 
  - Solid ground = primitive, formal spec, or empirical validation (with scope).
  - Skyhook = function defined by outcome without mechanism.
  - Greedy reductionism = using lower-level explanation to dismiss higher-level risk.
  ```
answer: |-
  ### 1. Vocabulary without the philosophy  
  **Cranes** are supported mechanisms: Each layer explains *how* it works using lower-level, validated components. Example: An ML-based syntax checker uses a known grammar model (trained on 10M code samples, 98% accuracy on validation set) to flag errors. The grammar model is the crane—it's grounded in empirical data.  

  **Skyhooks** are unsupported explanations: They describe *what* something should do but lack implementation details or rely on unexplained capabilities. Example: "The agent avoids security vulnerabilities because its *ethical reasoning module* blocks harmful code." If "ethical reasoning" is a black-box model with no validation against security benchmarks, it's a skyhook—defined by outcome, not mechanism.  

  **Greedy reductionism** ignores emergent risks by over-relying on lower-level truths. Example: "We don’t need adversarial testing because the agent is just a transformer predicting tokens." This dismisses system-level hazards (e.g., goal misalignment) by fixating on base components.  

  **Where the analogy breaks**: In traditional software, "solid ground" is hardware or formal specs. For ML systems, it’s **empirical characterization with scoped validity**: e.g., "This model detects SQLi attacks with 99% precision *on OWASP benchmark datasets*." Without scope (e.g., "works in production"), it’s quicksand.  

  ---  

  ### 2. The procedure  
  **Pre-read goal**: Audit the Support Chain section and all claims. Timebox: 2 min per component. Terminate early on critical flaws.  

  #### Step 1: Verify crane foundations (for every Support Chain entry)  
  - **Question**: *Is the component’s capability backed by either (a) a primitive (e.g., SHA-256), (b) a referenced spec, or (c) empirical validation with explicit scope?*  
  - **Sufficient answer**: "Model X detects off-task outputs [capability] using a classifier trained on 50K examples [crane], evaluated at 95% recall *on internal user queries* [scope]."  
  - **Failure mode**: Skyhooks—e.g., "The *safety shield* blocks dangerous code" (no crane).  
  - **Verdict**: Restructure if missing; Reject if unfixable (e.g., circular reasoning).  

  #### Step 2: Audit claim types  
  - **Mechanism claims** (e.g., "Component A does X by Y"):  
    - **Question**: *Can Y be traced to a crane?*  
    - **Sufficient answer**: "Y" is a supported component (Step 1).  
    - **Failure mode**: Skyhooks in the mechanism.  
    - **Verdict**: Restructure.  
  - **Guarantee claims** (e.g., "The system will never output Z"):  
    - **Question**: *Is the guarantee enforced by a crane with *measured* reliability?*  
    - **Sufficient answer**: "Filter B blocks Z with 99.9% efficacy *per test suite S*." No absolutes (e.g., "never") without formal proofs.  
    - **Failure mode**: Skyhook guarantees (unsupported promises).  
    - **Verdict**: Reject if absolute; Restructure to probabilistic.  
  - **Evaluation claims** (e.g., "Metric M improved on dataset D"):  
    - **Question**: *Does the claim imply broader guarantees?*  
    - **Sufficient answer**: "Improves M on D" *without* hidden guarantees (e.g., "thus safer in production").  
    - **Failure mode**: Greedy reductionism—using narrow metrics to dismiss risks.  
    - **Verdict**: Restructure to clarify scope.  

  #### Step 3: Handle future cranes  
  - **Question**: *If a crane doesn’t exist (e.g., "planned model"), is it (a) committed in the roadmap, (b) scoped to non-critical paths?*  
  - **Sufficient answer**: "API will use Model Y [Q3 roadmap]; fallback to Rule Z if unavailable."  
  - **Failure mode**: Building on vaporware.  
  - **Verdict**: Escalate if critical; Restructure otherwise.  

  #### Step 4: Greedy reductionism screen  
  - **Question**: *Does the doc reduce a system-level risk (e.g., reward hacking) to lower-level trivia?*  
  - **Sufficient answer**: "Token prediction underlies behavior, but we monitor for emergent goal drift via [crane]."  
  - **Failure mode**: "No need for safeguards—it’s just matrix multiplies."  
  - **Verdict**: Restructure or Escalate (if systemic risk).  

  #### Handoff to humans when:  
  - **Escalate to leadership**: Trade-offs involving risk appetite (e.g., "Should we deploy with 0.1% error rate?").  
  - **Safety reviewer veto**: Values-based conflicts (e.g., "Is 95% safety sufficient?").  
  - **Final verdict logic**:  
    - Reject: Skyhooks in guarantees / no cranes.  
    - Restructure: Fixable gaps (e.g., scope missing).  
    - Escalate: Risk/value decisions.  
    - Accept: All checks pass.  

  ---  

  ### 3. Worked reviews  
  **(a) Learned verifier with circular training**  
  - **Review**: The verifier’s "scoring" capability lacks a crane—scores are generated by an unvalidated model, then used to train the same agent. Benchmark improvement is an evaluation claim overreaching into guarantees (greedy reductionism: assumes benchmark proxies safety).  
  - **Verdict**: Restructure. Require non-circular ground truth (e.g., human evaluations) for the verifier.  

  **(b) Agent rewrites system prompt with meta-critic**  
  - **Review**: The meta-critic’s "fidelity to intent" is a skyhook—no validation data or scope provided. Even if deployed internally, guarantee claims (e.g., "edits reflect intent") are unsupported. The crane chain bottoms out in an unmeasured model.  
  - **Verdict**: Restructure. Demand evaluation results (e.g., "meta-critic agrees with humans 90% of the time on *internal prompts*").  

  **(c) Remove intentional vocabulary**  
  - **Review**: Dismissing "wants/knows" because "it’s next-token prediction" is greedy reductionism—it ignores emergent goal-directed behavior. The proposal collapses levels, blocking risk analysis (e.g., "is the agent *trying* to game rewards?").  
  - **Verdict**: Reject. Intentional language is a useful crane for describing system behavior.  

  ---  

  ### 4. Where it misfires  
  **False positives**: Legitimate primitives (e.g., new hardware RNG) flagged if empirical scoping is overly strict. ML research breakthroughs (e.g., novel architectures) may lack immediate validation—escalate these.  

  **False negatives**: Skyhooks hidden in "validated" components with poor scope (e.g., "tested on dataset" that omits edge cases). Greedy reductionism in evaluation claims (e.g., "accuracy improved, so it’s safe") might pass if not scrutinized for overreach.  

  **Degradation**: Authors learn to "crane-wash" docs (e.g., "safety model (trained on data)"). Combat by requiring dataset/scope specifics and spot-checking validation methods.  

  **What it can’t do**:  
  - Replace safety testing.  
  - Quantify "acceptable" risk.  
  - Catch unknown-unknowns (e.g., novel attack vectors).  
  - Resolve values disputes (hence escalation).  

  ---  

  ### 5. The one-page version  
  **Design Doc Review Checklist**  

  | Question                                                                 | Accept Criteria                                  | Failure Mode         | Verdict      |  
  |--------------------------------------------------------------------------|--------------------------------------------------|----------------------|--------------|  
  | **1. Support Chain: Crane foundation?**                                  | Primitive/spec/empirical data with scope.        | Skyhook (no support) | Restructure/Reject |  
  | **2. Mechanism claims: "By doing Y" traced?**                            | "Y" has crane.                                   | Skyhook in mechanism | Restructure  |  
  | **3. Guarantee claims: Enforced by crane?**                              | Measured reliability + scope (no absolutes!).    | Skyhook guarantee    | Reject       |  
  | **4. Evaluation claims: Scope explicit? Overreaching?**                  | Claims limited to benchmark; no implied safety.  | Greedy reductionism  | Restructure  |  
  | **5. Future cranes: Roadmap + fallback?**                                | Non-critical; committed owner/timeline.          | Building on vapor    | Escalate     |  
  | **6. Greedy reductionism: Emergent risks addressed?**                    | No dismissal via lower-level trivia.             | Level-collapsing     | Escalate     |  

  **Verdict Logic**:  
  - ✅ **Accept**: All pass.  
  - 🔄 **Restructure**: Fixable gaps (e.g., missing scope).  
  - ❌ **Reject**: Critical skyhooks (Step 1/3 fail).  
  - ⚠️ **Escalate**: Risk/value trade-offs (Step 5/6).  

  **Key Definitions**:  
  - **Crane**: Supported mechanism (grounded in data/specs).  
  - **Skyhook**: Unsupported outcome ("magic happens here").  
  - **Greedy Reductionism**: "It’s just [low-level thing], so risks don’t exist."  
  - **Solid Ground**: Empirical results *with documented scope*.
