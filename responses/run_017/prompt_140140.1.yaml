  ### Concrete Example: Finite-Horizon Betting Scenario

  **Scenario**: A small trading firm has $1 million in working capital and a repeatable opportunity: over the next 10 trades, each trade either doubles the amount risked (win, probability 0.55) or loses it entirely (loss, probability 0.45). Trades are independent and sequential, with no external cash infusions or withdrawals. The firm must choose a fraction \(f\) of its current capital to risk on each trade. The goal is to optimize terminal wealth after exactly 10 trades.

  ---

  ### Exact Enumeration and Verdicts
  Terminal wealth after \(k\) wins and \(10-k\) losses:  
  \[
  W_f(k) = (1 + f)^k (1 - f)^{10-k} \quad (\text{in units of initial wealth})
  \]

  - **Kelly stake (maximizes expected log wealth)**:  
    \[
    f_{\text{kelly}} = 2p - 1 = 2 \times 0.55 - 1 = 0.10
    \]
    Expected log wealth:  
    \[
    \mathbb{E}[\log W] = 10 \left[0.55 \log(1.1) + 0.45 \log(0.9)\right] \approx 0.0501
    \]

  - **Median-maximizing stake**:  
    Binomial distribution parameters: \(n = 10\), \(p = 0.55\).  
    Cumulative probabilities:  
    \[
    \begin{align*}
    P(k \leq 5) &\approx 0.4956 < 0.5, \\
    P(k \leq 6) &\approx 0.7336 \geq 0.5.
    \end{align*}
    \]
    Median number of wins \(m = 6\). Maximize \(W_f(6) = (1 + f)^6 (1 - f)^4\):  
    \[
    f_{\text{med}} = \frac{2m - n}{n} = \frac{2 \times 6 - 10}{10} = 0.20
    \]
    Median terminal wealth:  
    \[
    W_{0.20}(6) = (1.2)^6 (0.8)^4 \approx 1.2229 \quad (\text{\$1,222,900})
    \]

  - **Expected-wealth-maximizing stake**:  
    \[
    \mathbb{E}[W] = \left[1 + f(2p - 1)\right]^{10} = (1 + 0.10f)^{10}
    \]
    Maximized at \(f = 1.00\) (full leverage):  
    \[
    \mathbb{E}[W] = (1.10)^{10} \approx 2.5937 \quad (\text{\$2,593,700})
    \]

  **Summary of stakes**:  
  - Kelly: \(f = 0.10\)  
  - Median: \(f = 0.20\)  
  - Expected wealth: \(f = 1.00\)  

  **Separation**:  
  - Median wealth at \(f_{\text{med}} = 0.20\): \$1,222,900  
  - Median wealth at \(f_{\text{kelly}} = 0.10\): \((1.1)^6 (0.9)^4 \approx 1.1620\) (\$1,162,000)  
  - **Difference**: \(+5.24\%\) for median-maximizing stake.  
  - The gap is unambiguous (no ties) and material (\(>2\%\)).

  ---

  ### What Drives the Divergence?
  The key is **skew in the binomial distribution of wins**.  
  - Mean wins: \(np = 10 \times 0.55 = 5.5\)  
  - Median wins: \(m = 6 > 5.5\) (due to left skew from \(p > 0.5\)).  
  - Median-maximizing stake: \(f_{\text{med}} = (2m - n)/n = 0.20\).  
  - Kelly stake: \(f_{\text{kelly}} = 2p - 1 = 0.10\).  
  Since \(m > np\), \(f_{\text{med}} > f_{\text{kelly}}\).

  **General formula**: For \(n\) rounds, win probability \(p\), and median wins \(m\),  
  \[
  f_{\text{med}} = \frac{2m - n}{n}, \quad f_{\text{kelly}} = 2p - 1.
  \]

  ---

  ### Restoring Coincidence
  **Increase \(n\) to 100** (asymptotic limit):  
  - Mean wins: \(100 \times 0.55 = 55\), median \(\approx 55\) (symmetric Gaussian).  
  - \(f_{\text{med}} = (2 \times 55 - 100)/100 = 0.10\),  
  - \(f_{\text{kelly}} = 2 \times 0.55 - 1 = 0.10\).  
  **Result**: Gap vanishes due to symmetry and law of large numbers.

  ---

  ### What This Establishes (and Doesn’t)
  - **Establishes**: Kelly and median maximization are distinct criteria in finite horizons. The divergence arises from skew in the outcome distribution, not computational artifacts.  
  - **Does not establish**: That median maximization is generally superior. It is horizon-dependent and fails composition (adding an 11th trade changes the optimal stake).  
  - **Strongest argument for Kelly**:  
    - **Myopic**: Optimal for each trade, regardless of horizon.  
    - **Composable**: Maintains optimality if opportunities extend beyond \(n\) rounds.  
    - **Growth-optimal**: Maximizes asymptotic growth rate; median maximization at \(f = 0.20\) yields *negative expected log growth* (\(\mathbb{E}[\log W] \approx -0.0014\) per round here).  
  - **Strongest argument for median**: If the horizon is truly fixed and the agent exclusively cares about the median outcome (e.g., survival in a tournament), it prioritizes robustness over growth.  

  **Defense of Kelly**: The horizon-dependent nature of median maximization is a critical flaw. Real agents rarely face absolute, immutable endpoints. Kelly’s composability and long-run guarantees make it the coherent choice for geometric rationality.

  ---

  ### Why This Matters to a Practitioner
  > **For a real better sizing a finite sequence of bets, median maximization offers a higher typical outcome at the cost of negative expected growth—a tradeoff that risks long-term ruin for short-term robustness**.

  In this example:  
  - At \(f = 0.20\), median wealth is 5.24% higher than Kelly.  
  - But \(\mathbb{E}[\log W] < 0\): Capital decays on average with repeated play.  
  - Kelly’s \(f = 0.10\) preserves positive growth (\(\mathbb{E}[\log W] > 0\)) while accepting lower median wealth **for this specific horizon**.

  ---

  ### Confidence Assessment
  - **High confidence**:  
    - Binomial median calculation (\(m = 6\)) and stakes (\(f_{\text{kelly}} = 0.10\), \(f_{\text{med}} = 0.20\)).  
    - Expected log wealth at \(f = 0.20\) is negative (exact: \(-0.001377\) per round).  
  - **Moderate confidence**:  
    - The gap closes for large \(n\) (asymptotics are reliable).  
  - **Least confident**:  
    - General formula \(f_{\text{med}} = (2m - n)/n\) holding universally (depends on strict monotonicity of wealth in wins, which holds here).

  All constraints are satisfied. Parameters: \(n = 10\), \(p = 0.55\), edge \(= 0.10\), no ties, verifiable by binomial enumeration.
