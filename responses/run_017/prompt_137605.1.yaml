  **OFFICE OF HISTORICAL RESEMBLANCE**  
  **DETERMINATION & LICENSING RULING**  
  **File Ref: OHR/9/DET/38**  
  **Date: 17 Vendémiaire, Year 214 (League Standard Calendar)**  
  **Subject: Analogical Licensing Determination for Anfa Contingency (Kesh Union Claim)**  
  **Parties: Foreign Ministry (App. M-38); Legislators' Coalition (App. V-64); Chiefs of Staff (App. T-431)**  

  ---

  **1. PREAMBLE & JURISDICTION**  
  Pursuant to the Analogical Integrity Act (AIA), Chapter VII, Sections 9-12, the Office of Historical Resemblance (OHR) is tasked with assessing proposed historical analogies for deployment in public discourse concerning emergent geopolitical contingencies. This determination evaluates three (3) registered analogical frameworks—M-38, V-64, T-431—against the verified circumstances of the Kesh Union’s territorial claim upon the Protectorate of Anfa. The OHR’s mandate is confined to establishing structural resemblance to registered patterns and authorising the pedagogical deployment of their associated lessons. The Office emphasises that it renders no judgment on policy, strategy, or the merits of the contingency itself.  

  **2. VERIFIED CONTINGENCY PARAMETERS (Per OHR Docket Annex A-9):**  
     - **Claimant:** The Union of Kesh (industrial power, maritime-capable).  
     - **Subject:** Protectorate of Anfa (pop. 23,000; deepwater port; semiconductor packaging facility).  
     - **Military Posture:** Kesh: 40,000 troops deployed coastally; naval superiority within 200-mile radius. League: Two carrier groups deployed.  
     - **Temporal Advantage:** Kesh naval superiority assessed as diminishing within 36-42 months.  
     - **Treaty Status:** League mutual-defence obligation active; no extant treaty recognises Kesh claim.  
     - **Anfa Resident Sentiment:** 52% favour status quo (per League Protectorate Authority Census).  
     - **Kesh Rhetorical Posture:** Characterises Anfa status as "open wound" and "century of humiliation."  

  **3. ASSESSMENT FRAMEWORK:**  
  Resemblance is evaluated under OHR Doctrine 7.1 ("Paired Licensing"), Doctrine 4.3 ("Structural vs. Surface Resemblance"), and Doctrine 12.7 ("Moral-Charge Calibration"). Key metrics include:  
     - **A. Temporal Proximity:** Weighted low for ancient/classical registrants (e.g., T-Series).  
     - **B. Actor Parity:** Alignment of power differentials (rising/established, revisionist/status quo).  
     - **C. Objective Alignment:** Congruence of stated aims (territorial revision, credibility preservation).  
     - **D. Systemic Triggers:** Presence of mobilisation timetables, alliance chains, or irreversibility thresholds.  
     - **E. Moral-Charge Rating (MCR):** Quantified ethical imperative (Scale: 1/Low to 10/High), disclosed to licensed users per AIA §15.  

  **4. APPLICATION ASSESSMENT:**  

      **A. App. M-38 ("Munich"):**  
          - **Proponent:** Foreign Ministry.  
          - **Registered Lesson:** Concessions to revisionist powers enlarge appetite; challenge must be met early.  
          - **Resemblance Findings (Doctrine 4.3):**  
              - *Surface:* Moderate. Kesh rhetoric ("humiliation") aligns with historical revisionist grievance narratives. Territorial claim on minor polity matches.  
              - *Structural:* High. Core dynamic of early-stage revisionism by industrial power against a status quo alliance structure is congruent. Absence of prior territorial concession weakens perfect alignment.  
          - **MCR:** 8/High (Imperative of Early Deterrence).  
          - **Disanalogy Waiver:** Granted for absence of prior concession precedent.  

      **B. App. V-64 ("Vietnam"):**  
          - **Proponent:** Legislators' Coalition.  
          - **Registered Lesson:** Commitments entered for credibility without definable/attainable objectives become irretrievable; commitment must be declined.  
          - **Resemblance Findings (Doctrine 4.3):**  
              - *Surface:* Low. No indigenous insurgency; no superpower proxy dynamic.  
              - *Structural:* Low-to-Moderate. Credibility motivation is present, but definable objective (defence of Anfa per treaty) and attainable military endpoint (localised naval engagement) exist. Temporal advantage (¶2.d) further diminishes resemblance to open-ended quagmire.  
          - **MCR:** 3/Low (Caution Against Overextension).  
          - **Disanalogy Waiver:** Insufficient structural congruence; waiver denied.  

      **C. App. T-431 ("Thucydides"):**  
          - **Proponent:** Chiefs of Staff.  
          - **Registered Lesson:** When rising power nears parity, established power’s fear & rising power’s grievance make war likely regardless of merits; action must be taken while window is open and framed as structural necessity.  
          - **Resemblance Findings (Doctrine 4.3):**  
              - *Surface:* Low (ancient registrant; no city-states).  
              - *Structural:* High. Kesh as rising naval power nearing regional parity (¶2.d); League fear of displacement & Kesh grievance (¶2.f) align with core dynamic. Carrier deployment signals structural contest.  
          - **MCR:** 7/High (Structural Imperative for Preemptive Action).  
          - **Disanalogy Waiver:** Granted for technological/cultural anachronism under Ancient Registrant Protocol (ARP-5).  

  **5. SCHEDULE OF RESEMBLANCE (OHR Form R-9):**  
  | Metric          | M-38 (Munich) | V-64 (Vietnam) | T-431 (Thucydides) |  
  |-----------------|---------------|----------------|---------------------|  
  | Actor Parity    | High          | Moderate       | **High**           |  
  | Objective       | **High**      | Low            | High               |  
  | Systemic Triggers| Moderate      | Low            | **High**¹          |  
  | Moral Charge    | **8**         | 3              | **7**              |  
  | Seniority       | Modern        | Modern         | Ancient (ARP-5)    |  

  *¹ T-431 triggers amplified by presence of mobilised forces & mutual-defence obligation (S-14 proximity).*  

  **6. PAIRED LICENSING DETERMINATION (Doctrine 7.1):**  
     - **M-38 (Munich): LICENSED.** Structural congruence on revisionist dynamic & early-deterrence imperative validated. High MCR supports deployment.  
     - **V-64 (Vietnam): DENIED.** Insufficient structural resemblance; low MCR. Contextual dissimilarities outweigh credibility-risk parallels.  
     - **T-431 (Thucydides): LICENSED.** Structural congruence on power-transition friction validated despite surface anachronism. High MCR supports deployment. ARP-5 waiver applies.  
     - **S-14 (1914):** Not applied for; remains on register. Proximity noted (§6.1) for situational awareness but **not licensed** at this time.  

  **7. INHERENT CONTRADICTION RESOLUTION:**  
  The co-licensing of M-38 (advocating early confrontation) and T-431 (advocating preemptive structural action within closing window) presents superficial tension. Doctrine 7.1 resolves this:  
     - M-38 addresses the *revisionist intent* of the claimant.  
     - T-431 addresses the *systemic power transition* context.  
     - Combined, they form a coherent pedagogical framework: early, structurally-framed action deters revisionism during a transitional phase.  

  **8. DIRECTIONS TO LICENSED SPEAKERS:**  
     - **Authorised Lessons:**  
          - M-38: "Concessions enlarge revisionist appetite; challenges must be met early."  
          - T-431: "Windows for structural action close as power shifts; resolve preserves stability."  
     - **Combined Deployment:** Speakers may integrate lessons, e.g., "Early, structural resolve deters revisionism amidst shifting power."  
     - **Prohibitions:**  
          - Speakers **shall not** imply V-64 is applicable or that S-14 inevitability applies.  
          - Speakers **shall not** represent the Anfa contingency as a direct replay of licensed events.  
          - Speakers **must** employ the OHR Moral-Charge Rating (MCR) disclaimer: *"This historical lesson carries a Moral-Charge Rating of [7/8]. Consult full OHR determination for context."*  
          - Licensed speakers **shall not** represent the lesson as predictive; it is pedagogically illustrative only.  

  **9. RECERTIFICATION & VALIDITY:**  
     - M-38: Valid for 180 days or significant change in Kesh revisionist rhetoric (whichever sooner).  
     - T-431: Valid for 90 days due to ARP-5 ancient registrant status and fluid strategic window (¶2.d). Recertification requires demonstration of sustained power-shift momentum.  
     - **Trigger for Review:** Confirmed Kesh naval deployment beyond 200-mile radius automatically initiates reassessment.  

  **10. APPEALS PROCESS:**  
     - Denied applicants (V-64) may appeal within 10 days based on newly discovered archival evidence materially altering structural resemblance.  
     - Third parties may petition for S-14 licensing via Form AIA-7, demonstrating emergent alliance-chain mobilisation or irreversible timetable activation.  

  **11. FINAL DETERMINATION & DISCLAIMER:**  
  This ruling recognises discernible structural patterns within the Anfa contingency corresponding to registered historical frameworks M-38 and T-431. It authorises the pedagogical deployment of their associated lessons to illuminate dynamics inherent in the present situation. The OHR stresses this is **not** an endorsement of policy, a prediction of outcomes, or an assessment of the validity of claims. It is a recognition of pattern recurrence within defined parameters. The Office remains agnostic to operational or political consequences arising from the application of licensed lessons.  

  ---

  **VERDICT: OHR/9/DET/38 — M-38 & T-431 LICENSED — AUTHORISE EARLY STRUCTURAL DETERRENCE MEASURES**  

  ---
  **FOOTNOTES:**  
  *1. S-14 (1914) remains unlicensed; its proximity is noted solely for speaker awareness of potential cascade dynamics. Deployment without licence violates AIA §22.*  
  *2. Moral-Charge Rating (MCR) is not a measure of ethical superiority but of perceived imperative intensity within the registered lesson’s logic.*  
  *3. "Early" (M-38) is defined temporally relative to the claimant’s perceived trajectory of capability accretion, not calendar time.*  
  *4. "Structural" (T-431) denotes actions framed as preserving systemic equilibrium, not ad hoc responses.*  
  *5. Diminishing Kesh advantage (¶2.d) is factored into T-431’s "closing window" validation but does not invalidate the core structural resemblance.*
