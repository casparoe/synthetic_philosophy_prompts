prompt: |-
  I'm putting together the final for my upper-level epistemology seminar — third-years, they've done a block on peer disagreement and conciliationism (the equal-weight and total-evidence views), some calibration stuff, a week on permissivism, and one session on epistemic akrasia. Closed book, in class, 60 minutes, and I want one essay question out of 20 marks on higher-order evidence that can't be answered by lining up "split the difference / give the peer's view some independent weight" against "higher-order evidence is just more evidence, reweigh the lot and believe whatever that supports" and then picking a side. That's literally all last year's scripts did, and it told me nothing about whether anyone could do anything with the distinction. So I've been trying to build a case where both of those moves hit the same wall, and I think I've got something but I'm not sure the numbers are behaving.

  Sketch, tell me if it's broken before you build on it: you spend a week with the trial data on whether some drug cuts hospitalisations and end up 80% that it does. Then an envelope arrives with two findings about a tasteless compound, K, which you were given with probability 1/2 at the start of the week and cannot detect. (1) K leaves people's first-order reading of data completely intact but inflates the confidence they report on questions of this exact kind by about 20 points. (2) K also scrambles how people respond to findings like (1): it shifts the response by some amount between minus 30 and plus 30 points, direction unknown, uncorrelated with anything you can notice from the inside — so unlike in the usual cases, you can't use your own reaction as a clue about whether you got K. My thought was that the arithmetic still says aim for 70 (halfway between the 80 you're at and the 60 you'd be at if sober), but you now have no reason at all to think that your landing on 70 is the sober landing rather than the scramble, and yet 70 is still somehow the right number — which looks like it prises apart the correctness of the credence from any justification you could have for arriving at it, and leaves the thing people call the enkratic requirement (roughly: if you judge that your evidence supports p then rationality requires you to believe p) with nothing to grip. Is that the actual crux, or is there a better one buried in there, and does the case as stated let a sharp student wriggle out by self-diagnosing anyway — and if so, how do I close that route without making the setup look rigged?

  What I want from you, assuming the case survives: write the question as it would actually appear on the page (it should force them to keep outright belief separate from credence, and to say whether the case shows rationality can require something akratic or whether it instead shows the requirement was misdescribed in the first place); then a model answer of about 700 words; then a marking scheme out of 20 built around four or five must-hit moves, with the marks each is worth and one line on how people usually botch it. Please make the scheme genuinely separate an A from a B — I want to be able to point at what the B answer is missing rather than just giving it fewer marks for being shorter — and in particular I want "permissivism means any response in the range is fine, so there's nothing to say" to lose marks rather than pass as a subtlety. If you think a part (b) earns its keep where you then lose your notes entirely and can't reconstruct the first-order data at all, only your final 80% and the two findings, go ahead and include it, but only if it's doing real work and not padding.
reasoning: |-
  Okay, I need to help this professor create a challenging epistemology exam question on higher-order evidence that moves beyond simple conciliationism vs. total-evidence debates. The scenario they've sketched involves a drug efficacy assessment with an added layer of uncertainty about an undetectable confidence-altering compound K. 

  First, I should verify if the case works as intended. The professor wants a situation where both standard approaches to peer disagreement lead to the same problematic outcome - aiming for 70% confidence while being unable to justify that credence. The key seems to be that K scrambles reactions to evidence about itself, blocking any self-diagnosis. This creates tension between correctness and justification.

  For the question design, I'll need to:
  - Clearly separate belief from credence in the wording
  - Force engagement with akrasia by making the student address whether rationality can require a credence they can't justify
  - Prevent the "permissivism escape hatch" by showing the case demands precision
  - Possibly add a part (b) that removes first-order data to intensify the dilemma

  The model answer should demonstrate:
  - Why both standard approaches converge on 70%
  - Why this credence is unjustifiable yet correct
  - How this challenges the enkratic requirement
  - Why permissivism doesn't resolve the tension

  For the marking scheme, I'll identify key moves worth 4-5 points each:
  1. Recognizing convergence of approaches
  2. Explaining unjustifiability of 70%
  3. Analyzing akrasia implications
  4. Critiquing permissivism
  5. (If part b) Handling lost notes scenario

  Common mistakes to penalize:
  - Treating K evidence as first-order
  - Claiming self-diagnosis is possible
  - Invoking permissivism to avoid precision
  - Missing the akrasia challenge
  - Confusing belief with credence

  The part (b) extension seems valuable - losing the first-order data makes the 70% credence entirely dependent on the higher-order evidence, heightening the justificatory paradox. It does real work by removing any anchor to the original assessment.
answer: |-
  Here’s a complete exam question package designed to force students beyond surface-level debates, challenge the enkratic requirement, and block common escapes. The case is tightened to prevent self-diagnosis while preserving the convergence of conciliationist and total-evidence approaches.

  ---

  ### **Exam Question (as it would appear)**  
  **Time Allowed:** 20 minutes  
  **Marks:** 20  

  **Background:** You are a researcher assessing whether drug X reduces hospitalizations. After a week reviewing trial data, you assign an 80% credence to "X is effective." You then receive an envelope containing two verified findings about Compound K:  
  - You were unknowingly administered K at the start of the week with 50% probability. K is tasteless/undetectable and *does not alter* first-order data interpretation.  
  - **Finding 1:** K inflates reported confidence on "drug efficacy" questions by exactly 20 percentage points (e.g., a sober 60% credence would be reported as 80%).  
  - **Finding 2:** K also scrambles reactions to confidence-adjustment evidence (like Finding 1): it shifts responses by a *random amount between -30 and +30 points*, with no correlation to internal states. You cannot use your own reaction to gauge K’s presence.  

  **Part (a)** (15 marks)  
  Explain what credence you should now assign to "X is effective." Argue why *both* conciliationism ("split the difference") and the total-evidence view ("reweigh all evidence") converge on the same credence. Then, discuss: Does this case show that rationality can require an *akratic* state (where your credence conflicts with your assessment of your evidence)? Or does it undermine the enkratic requirement? Defend your view.  

  **Part (b)** (5 marks)  
  Suppose you lose your original notes and cannot reconstruct the first-order data. You only remember:  
  - Your final pre-envelope credence was 80%.  
  - Findings 1 and 2 about K (as above).  
  Does this change your credence? Why/why not?  

  *Clarify: "Credence" = degree of belief. "Akratic" = believing against your own epistemic judgment.*  

  ---

  ### **Model Answer** (Approx. 700 words)  

  **Part (a)**  
  Both conciliationism and the total-evidence view mandate a 70% credence that X is effective, but this convergence exposes a deeper problem for epistemic rationality.  

  First, conciliationism treats your pre-envelope self (80%) and a "sober peer" as disagreeing peers. The sober peer’s credence is inferred from Finding 1: if K inflates confidence by 20 points, your 80% implies a sober baseline of 60%. Conciliationism (e.g., equal-weight) splits the difference: (80% + 60%)/2 = 70%.  

  The total-evidence view also arrives at 70%. Your total evidence includes:  
  - The first-order data (supporting 80% pre-envelope).  
  - Finding 1: 50% chance K inflated your confidence by +20 points.  
  - Finding 2: If you have K, your reaction to Finding 1 is scrambled (±30 points randomly).  

  Crucially, Finding 2 blocks self-diagnosis. Normally, you might think, "I feel doubtful about K, so I’m likely sober." But Finding 2 makes your doubt/confidence *epistemically inert*: scrambling (±30) dwarfs the true signal (sober: 60% vs. +K: 80%). Bayes’ theorem shows your reaction is noise: the likelihoods of feeling "doubtful" given K or no K are indistinguishable. Thus, you must treat the probability of K as 50% *unrevisable* by introspection.  

  Given this, calculate:  
  - 50% chance no K → credence based on data: 80%  
  - 50% chance K → sober credence is 80% − 20% = 60%  
  ∴ **Expected credence = (0.5 × 80%) + (0.5 × 60%) = 70%.**  

  This 70% is *correct* but *unjustifiable* from your perspective. Finding 2 ensures you cannot know whether 70% is "sober" or scrambled. For all you know, the scramble shifted you to 70% from 40% or 100%, making your credence arbitrarily disconnected from your evidence-assessment. Yet, objectively, 70% is rational given the probabilities.  

  This challenges the enkratic requirement ("if you judge your evidence supports C, you must have C"). Here, your evidence *objectively* supports 70%, but you *cannot judge* that it does. Any justification you offer for 70% could be a K-induced scramble. Thus, rationality requires a credence you cannot justifiably endorse, creating an **akratic state**: you believe *p* at 70% but must suspend judgment on whether 70% is rational.  

  This does not *undermine* the enkratic requirement; it *exposes its limits*. Enkrasia assumes you can access your evidence’s support, but Finding 2 severs this access. The case shows that in higher-order evidence scenarios with introspective noise, rationality can demand akrasia—not because enkrasia is false, but because it becomes *impossible to satisfy* when higher-order uncertainty corrupts meta-judgment.  

  **Part (b)**  
  Losing the first-order data changes nothing. The total evidence still implies 70%. Without the original data, you know:  
  - Your pre-envelope credence was 80%.  
  - Finding 1 implies a 50% chance this was inflated by 20 points (sober: 60%).  
  - Finding 2 still blocks self-diagnosis.  
  Thus, the calculation remains: 50% × 80% + 50% × 60% = 70%. The first-order data’s irrecoverability is irrelevant because *your memory of your credence* is all the evidence you need—and it is already embedded in the calculation.  

  ---

  ### **Marking Scheme** (20 marks total)  
  **A (17–20)**: Hits all must-move targets; distinguishes correctness/justification; blocks permissivism/self-diagnosis; precise on akrasia.  
  **B (13–16)**: Misses 1–2 key moves; vague on akrasia or enkrasia; minor errors in probability.  
  **C (9–12)**: Superficial; conflates approaches; appeals to permissivism; ignores Finding 2.  

  #### **Must-hit moves** (with common botches):  
  1. **Convergence to 70%** (4 marks):  
     - *Conciliationism*: Sober peer = 60% (80% − 20%), split difference → 70%.  
     - *Total-evidence*: 50% × 80% + 50% × 60% = 70%.  
     - *Botch*: Ignores Finding 2 or misapplies probability (e.g., "sober credence could be anything").  

  2. **Blocking self-diagnosis via Finding 2** (5 marks):  
     - Explains why scrambling (±30) makes introspection unreliable (likelihoods swamped by noise).  
     - *Botch*: Claims "I feel doubtful, so likely no K" (ignores scrambling) or "I can ignore K."  

  3. **Akrasia challenge** (5 marks):  
     - Identifies 70% as *correct* but *unjustifiable* (cannot know if 70% is scrambled).  
     - Argues enkrasia is *impossible*, not false (rationality requires akrasia as a byproduct).  
     - *Botch*: "No problem—just believe 70%" (ignores justification) or "enkrasia is false."  

  4. **Shutting down permissivism** (3 marks):  
     - Permissivism fails: The case demands *precise* 70% (calculative necessity), not a range.  
     - *Botch*: "Any credence 40–100% is fine" (ignores probability math) or "no unique answer."  

  5. **Part (b) consistency** (3 marks):  
     - Losing notes changes nothing—memory of credence suffices for calculation.  
     - *Botch*: "No first-order data = no basis" (misunderstands higher-order evidence).  

  ---

  ### **Why this works**  
  - **Self-diagnosis blocked**: Finding 2 (±30 scramble) makes introspection evidentially worthless, closing the wriggle-out route.  
  - **Permissivism penalized**: The math forces 70%, so "any credence is fine" scores 0 on move 4.  
  - **A/B differentiation**: B answers miss, e.g., why self-diagnosis fails or why akrasia is unavoidable.  
  - **Part (b) adds value**: Tests if students grasp that higher-order evidence operates *independently* of first-order recall.  

  This question forces engagement with the *structure* of higher-order evidence—not just tribal divides—while making akrasia inescapable. Use it verbatim; it’s exam-ready.
