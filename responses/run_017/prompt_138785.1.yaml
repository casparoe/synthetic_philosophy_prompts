answer: |-
  ## Project Proposal: The Sequence Dependence of Idealization in Indirect Normativity

  **Abstract:** Indirect normative theories (e.g., Railton's ideal advisor, Smith's rationalist convergence) determine what an agent ought to do by appealing to the verdicts of an idealized counterpart – fully informed, coherent, and rational. This project identifies a critical under-specification in such theories: generating the idealized surrogate involves applying several distinct idealizing operations (e.g., adding information, imposing coherence, removing bias). Crucially, these operations may not be commutative; the order in which they are applied could alter the surrogate’s final verdict. Furthermore, ambiguity about whether the surrogate’s verdict functions as *advice* (permitting opaque deference) or as the *continuation* of the agent’s own deliberation (requiring transparency) interacts problematically with this sequencing issue. This project systematically maps these operations, tests their commutativity, and analyzes the implications of non-commutativity combined with the advisory/continuation ambiguity. The outcome will reveal whether indirect normativity yields determinate verdicts, requires smuggling in new normative commitments to fix an ordering, or must retreat to a severely restricted domain, fundamentally reshaping our assessment of this influential metaethical approach.

  **1. The Core Question: Does the Order of Idealization Determine Normative Verdicts?**

  The central question is: **Does the sequence in which distinct idealizing operations are applied to generate an idealized agent surrogate systematically affect the normative verdict that surrogate delivers, and if so, what are the implications for the viability and interpretation of indirect normative theories?**

  This question demands a determinate answer. It is not acceptable to respond that idealization is inherently vague or that any idealization suffices. We must investigate whether the *procedure* itself introduces an irreducible indeterminacy or normative commitment not accounted for by proponents of indirect views. To make this tractable, we focus on paradigmatic indirect views centered on idealized deliberation (e.g., Railton, Smith) and set aside views primarily based on evolutionary or social selection pressures (e.g., some forms of rule consequentialism). We also assume a broadly cognitivist framework where reasons are facts.

  **2. Why Existing Positions Leave the Question Open**

  Indirect normative theories require idealized surrogates to fulfill specific roles: they must be *authoritative* (their verdicts bind the actual agent), *accessible* in principle (serving as a guide), and *corrective* (fixing defects in the actual agent's reasoning or epistemic state). Proponents typically treat idealization as a monolithic process – "turning up the dial" on rationality and information simultaneously – assuming this yields a unique, convergent point. This assumption manifests in two common replies:

  1.  **The Canonical Idealization Reply:** Defend a specific bundle (e.g., "full information plus coherence plus impartiality") as intuitively correct. This simply assumes the bundle is unproblematic and sidesteps whether *how* we build that bundle matters.
  2.  **The Convergence Reply:** Argue that all "reasonable" idealizations will converge on the same verdicts. This assumes commutativity implicitly – that different paths to idealization lead to the same endpoint.

  These replies do not settle the sequencing question because they fail to:
  *   **Acknowledge operational distinctness:** They don't analyze the constitutive steps (adding information, correcting coherence, removing specific biases, extending reasoning time, enhancing imaginative realization) as potentially independent manipulations.
  *   **Test path dependence:** They don't investigate whether varying the sequence of applying these manipulations changes the surrogate's final state and verdict.
  *   **Address the ambiguity:** They often remain vague on whether the surrogate’s verdict is *advice* (allowing the actual agent to defer without grasping the reasons) or the *continuation* of her own deliberation (requiring that she could, in principle, trace the reasoning). This ambiguity directly impacts which idealizations are permissible (e.g., vast information leaps might be acceptable for an advisor but not for a deliberative continuation).

  Consequently, the core mechanics of generating the normative standard remain insufficiently examined, leaving a gap regarding the determinacy and nature of the verdicts indirect views deliver.

  **3. Method: Formal Mapping, Case Analysis, and Conceptual Synthesis**

  This purely conceptual project leverages formal modeling techniques from decision theory and epistemology within an armchair philosophical methodology. Progress is made by rigorously disambiguating concepts, constructing precise models of idealization procedures, and testing their implications through carefully constructed cases. This is superior to:
  *   *Intuitive case-work alone:* While intuition pumps are valuable, they lack the precision to isolate and test the interaction effects of multiple distinct operations systematically. Formal mapping provides necessary structure.
  *   *Abandoning idealization:* While non-ideal theories are crucial, understanding the *failures* of idealization is essential metaethical groundwork. Diagnosing problems within the idealizing project informs both its potential reform and the justification for non-ideal approaches.

  **Work Packages & Deliverables (Sequenced by Term):**

  *   **Year 1, Term 1: Taxonomy & Formal Modeling of Idealizing Operations.**
      *   *Activity:* Systematically identify and define core idealizing operations (e.g., Info+: Adding true information; Coh-: Removing belief incoherence; Bias-: Mitigating specific biases (e.g., self-interest, framing); Time+: Extending reasoning capacity; Img+: Enhancing imaginative realization of known facts; Ends-Coh: Coherence requirements on desires/ends). Develop simple formal models (e.g., using possible worlds, credence/probability functions, utility functions) to represent the effect of each operation on an agent state.
      *   *Deliverable:* A working paper: "The Anatomy of Idealization: Mapping the Operations."
      *   *Why Armchair?* Conceptual analysis and formal modeling are paradigmatic armchair methods. Defining the operations and their formal effects requires careful philosophical scrutiny and logical structuring, not empirical data.

  *   **Year 1, Term 2: Testing Commutativity & The Advisory/Continuation Distinction.**
      *   *Activity:* Develop pairs of sequences for applying operations (e.g., [Info+ then Coh-] vs. [Coh- then Info+]; [Bias- then Img+] vs. [Img+ then Bias-]). Analyze formally and through constructed philosophical cases whether different sequences lead to divergent surrogate verdicts. Crucially, test cases under both interpretations of the verdict: as *advice* (opaque deference allowed) and as *deliberative continuation* (transparency required).
      *   *Deliverable:* A working paper: "Order Matters: Non-Commutativity and the Interpretation of Ideal Verdicts," featuring formal analysis and multiple worked cases.
      *   *Why Armchair?* Testing conceptual relationships (commutativity) and the normative implications of different interpretations (advisory/continuation) is achieved through logical analysis and thought experiments.

  *   **Year 2, Term 1: Implications for Indirect Normativity: Possible Verdicts.**
      *   *Activity:* Synthesize findings to evaluate the three possible conclusions:
          1.  *Collapse:* Non-commutativity + ambiguity lead to pervasive indeterminacy; indirect normativity fails as a reductive account.
          2.  *Principled Ordering:* A specific sequence is normatively required (e.g., coherence before information addition). Analyze whether this smuggles in substantive normative commitments the view aimed to derive indirectly.
          3.  *Robust Core:* Only verdicts invariant across reasonable sequences/interpretations bind, significantly limiting the theory's scope.
      *   *Deliverable:* A detailed research manuscript draft: "The Fragmented Ideal: Sequence Dependence and the Future of Indirect Normativity."
      *   *Why Armchair?* Evaluating the metaethical implications of the formal and case-based findings is a core task of normative philosophy.

  *   **Year 2, Term 2: Refinement, Dissemination & Future Directions.**
      *   *Activity:* Revise manuscript based on feedback, prepare journal submissions, develop presentations. Outline implications for related debates (e.g., constitutive vs. normative accounts of rationality, ideal vs. non-ideal theory, moral uncertainty).
      *   *Deliverable:* Finalized manuscript submitted to a leading journal; conference presentations.

  **4. Possible Conclusions and Assessment**

  1.  **The Collapse Verdict:** Non-commutativity is widespread, and the advisory/continuation ambiguity prevents stable resolution. Different sequences/interpretations yield genuinely conflicting "oughts" for the same situation. *Deciding For:* Finding numerous robust cases where sequencing matters and no principled way to resolve the ambiguity or select an ordering. *Deciding Against:* Finding that commutativity holds for key operation pairs or that the ambiguity can be definitively resolved in one direction. *Assessment:* Plausible, especially for complex cases involving bias removal and information addition. High risk for indirect normativity.

  2.  **The Principled-Ordering Verdict:** A specific sequence is normatively privileged (e.g., achieve minimal coherence *before* adding information to avoid "garbage-in, gospel-out"; remove core biases *before* imaginative enhancement). *Deciding For:* Identifying sequences that seem uniquely rational or necessary for the surrogate's verdict to be action-guiding under the deliberative continuation model. *Deciding Against:* Finding that defending the sequence requires appealing to normative principles *outside* the idealization process itself (e.g., independent norms of rational procedure), undermining the indirectness. *Assessment:* Likely. My assessment leans towards this being the most probable outcome, but it reveals a deep tension: the idealization *procedure* itself carries normative weight, meaning the view is less purely "indirect" than claimed, as it relies on norms governing the construction of the surrogate.

  3.  **The Robust-Core Verdict:** Only normative verdicts that remain stable across plausible sequences and interpretations are binding. Many ordinary cases fall outside this core, leaving them indeterminate. *Deciding For:* Identifying a significant class of cases (perhaps involving clear-cut moral rules or uncontroversial prudential reasoning) where verdicts are sequence/interpretation invariant. *Deciding Against:* Finding the invariant core vanishingly small or practically irrelevant. *Assessment:* Possible, but likely restrictive. It salvages a fragment of indirect normativity at the cost of conceding significant indeterminacy elsewhere.

  **5. Worked Toy Cases & Commutativity Matrix**

  **Case 1 (Ordering Matters - Paternalism):** *Actual Agent (A):* Deeply values independence, but has a false belief (based on outdated info) that a medical procedure is low-risk. *Scenario:* Idealized surrogate must decide whether to override A's refusal of the procedure.
  *   **Sequence 1 [Info+ then Bias- (Self-Interest)]:** Surrogate first learns the true high risk. *Then*, considering A's core value of independence, judges overriding refusal is unjustified paternalism. *Verdict: Respect refusal.*
  *   **Sequence 2 [Bias- (Self-Interest) then Info+]:** Surrogate first corrects for potential self-interest (though A wasn't motivated by it here). *Then* learns the true high risk. With self-interest discounted, the overwhelming risk dominates, prioritizing safety over autonomy. *Verdict: Override refusal.*
  *   *Why it matters:* The verdict flips based solely on the order of idealization operations. The advisory/continuation ambiguity also plays a role: as *advice*, "override" might be accepted; as *continuation*, A might reject it as alien.

  **Case 2 (Advisory/Continuation & Information):** *Actual Agent (A):* Considers betraying a friend for a moderate gain. A lacks crucial information about the friend's past loyalty during A's own crisis.
  *   **Advisory Model:** A fully informed surrogate knows the loyalty history. It advises "Don't betray." A can rationally defer to this opaque advice.
  *   **Continuation Model:** For the verdict to be A's *own* completed deliberation, the information added must be something A could potentially have recalled or accessed. Simply endowing the surrogate with the fact breaks the deliberative thread. The surrogate must "realize" the information through enhanced imagination *based on clues A actually possessed*. This might fail, leaving no determinate verdict from the continuation perspective.
  *   *Why it matters:* The permissibility of adding vast information depends crucially on the role assigned to the surrogate's verdict.

  **Commutativity Matrix (Illustrative):**

  | Operation Pair          | Commutative? | Plausible Reason Why/Why Not                     |
  | :---------------------- | :----------- | :----------------------------------------------- |
  | **Info+ & Coh-**        | **No**       | Adding info to incoherent beliefs may yield different coherent sets than fixing coherence first then adding info. (Garbage-in vs. Coherent-update) |
  | **Bias- (Framing) & Img+** | **Likely No** | Removing framing bias might alter *which* aspects of a known situation are vividly imagined later. Enhancing imagination first might make a particular framing *more* salient, affecting bias detection. |
  | **Ends-Coh & Time+**    | **Yes?**     | Achieving coherence among ends might be unaffected by having more time to deliberate, or vice versa (if ends are fixed prior to deliberation). Contested. |
  | **Info+ & Time+**       | **Yes**      | Having more time to process information doesn't usually change *which* information is added first. Order likely irrelevant. |

  **6. Risks, Failure Conditions, and Scope**

  *   **Risk: Indeterminacy Overload:** The project might reveal so many non-commuting pairs and deep ambiguities that the conclusion is simply "indirect normativity is hopelessly indeterminate," which risks being dismissed as a restatement of older, more general objections to idealization (e.g., the "different starting points" problem for full-information accounts). **Mitigation:** Focus tightly on the *procedural* aspect – the *sequence dependence within the construction of a single surrogate for a single agent* – distinguishing it from worries about varying starting points or the content of full information. Emphasize the *interaction* with the advisory/continuation ambiguity as a novel factor.
  *   **Risk: Intractability of Modeling:** Formally modeling complex interactions between many operations might become unwieldy. **Mitigation:** Prioritize key, representative pairs (as in the matrix) and rely heavily on clear, compelling philosophical cases to illustrate interactions where formal modeling becomes too complex.
  *   **Risk: Scope Creep:** The project could expand into analyzing every variant of indirect theory or every possible bias. **Mitigation:** Strict adherence to the core question and the defined work packages. Focus on paradigmatic versions centered on idealized deliberation.
  *   **Failure Condition:** If preliminary analysis shows strong commutativity holds for almost all operation pairs deemed essential to idealization, the project's central worry dissolves. **Mitigation:** Initial work (WP1) will test this early; if commutativity holds robustly, the project pivots to analyzing *why* and its significance for defending indirect views.
  *   **Smallest Valuable Result:** Even if full synthesis isn't achieved, a rigorously developed taxonomy of idealizing operations and a clear demonstration of non-commutativity in several key, philosophically significant pairs (with analysis of the advisory/continuation interaction) would be a substantial contribution. It would provide essential tools and arguments for anyone developing or critiquing idealizing approaches.
  *   **Useful Deliverable:** The matrix analyzing commutativity of core operation pairs (developed in WP1/WP2) will be a concrete tool for theorists. The analysis of how verdict interpretation (advisory/continuation) constrains permissible idealizations will provide a crucial framework for evaluating specific indirect proposals.

  This project addresses a fundamental yet overlooked structural problem within a dominant metaethical framework. By rigorously dissecting the process of idealization and exposing potential path-dependence and ambiguity, it promises to significantly advance our understanding of whether and how idealized agents can serve as authoritative sources of normative judgment.
