prompt: |-
  I'm a science-and-ideas journalist working on a feature about who checks the checkers once the checkers are language models, and before I start interviewing people I want the spec, not the sales pitch. So: write me the desiderata that any scheme for scalable oversight — getting a weaker judge to reliably supervise a stronger model — has to meet to count as adequate. Each requirement needs the concrete case behind it (the situation that shows why you'd want it), and each needs to be marked either non-negotiable or as a preference of one particular camp.

  Let me fix the purpose so adequacy isn't up for grabs: I want to know what would let a regulator actually lean on such a scheme when certifying high-stakes model output — clinical guidance, an engineering safety case, a financial disclosure — in a domain where no available human expert can check the whole thing end to end. Concretely: the judge is a smart generalist rather than a specialist, has maybe 40 minutes per item, works in what I'll call a sealed room (no re-running the model, no outside tools, no phoning someone who knows more), and the object being judged is a long chain of reasoning whose conclusion may be true but deeply counterintuitive, or false but beautifully presented.

  I have a few hobby-horses of my own that I'd rather you rule on than just adopt: that the scheme shouldn't get to assume the two sides in a dispute differ in skill or in honesty; that it shouldn't get to assume truth is more persuasive than a well-told falsehood under time pressure; that a verdict has to survive being handed to a second judge with different priors; and that it can't simply push the problem up a level to another overseer who also needs overseeing. Tell me honestly which of those are genuine desiderata and which are just my tastes dressed up as requirements — I've read enough of this stuff to know its easy to do that.

  Then the part I most want: which pair of desiderata do you suspect can't be jointly satisfied, and which single requirement does the most work in knocking out candidate schemes? After that, a very short scorecard — a paragraph total — for debate, recursive or iterated amplification-style schemes, and market- or prediction-market-flavored oversight. Keep the weight on the criteria rather than the scoring, and keep the two seperate. Plain prose, American English, under 900 words if you can.
reasoning: |-
  Okay, the user is a science journalist working on a feature about scalable oversight for language models. They want desiderata for schemes where a weaker human judge supervises a stronger model in high-stakes scenarios. The key points are: the judge is a smart generalist with 40 minutes per item in a sealed room, assessing complex reasoning that might be counterintuitively true or deceptively false.

  First, I need to outline the core requirements. Non-negotiables should be essential for any oversight scheme to work in this context. Preferences might vary between different research approaches. The user mentioned specific hobby-horses, so I'll evaluate each:

  1. Not assuming skill/honesty differences: This seems necessary. In adversarial settings, a scheme must handle deceptive models. So non-negotiable.
  2. Not assuming truth is more persuasive: Also non-negotiable since deception is a real risk under time constraints.
  3. Verdicts surviving different priors: Important for robustness but might be a preference. Different judges should reach similar conclusions for reliability.
  4. No pushing oversight up a level: Non-negotiable. The scheme must resolve issues without infinite regress.

  Next, identifying conflicting desiderata. Verifiability and non-exhaustion conflict because verifiability requires the judge to check each step, which isn't possible within time limits. The sealed room constraint exacerbates this, making thorough verification impractical.

  The most constraining requirement is probably the sealed room. It prevents external tools or additional help, forcing the scheme to work with limited resources, which knocks out many approaches like market-based ones that need interaction.

  For the scorecard:
  - Debate: Good at leveraging model strengths but risks deception and judge overload.
  - Amplification: Handles complexity well but struggles with recursion depth and judge fatigue.
  - Prediction Markets: Efficient resource use but fails in sealed rooms and vulnerable to manipulation.

  I should ensure each criterium is addressed in the scorecard without bias. The user wants concrete cases behind each requirement, so examples like clinical guidance or safety cases are essential. Also, plain prose under 900 words. Need to stay concise but thorough.
answer: |-
  Here's a distilled set of desiderata for scalable oversight schemes in your high-stakes regulatory scenario, grounded in concrete failure modes, with a critical assessment of your hobby-horses and the key tensions.

  ### Core Desiderata (Non-Negotiables)
  1.  **Judge Feasibility:** The scheme must produce a verdict within the judge's constraints (40 min, sealed room, generalist skill, no external tools). *Concrete Case:* A model generates a novel clinical treatment protocol citing hundreds of obscure studies. The judge cannot possibly read/verify all sources in 40 minutes. If the scheme requires this, it fails.
  2.  **Robustness to Deception:** The scheme must reliably detect false conclusions even when the model's reasoning is intentionally deceptive and persuasive. *Concrete Case:* A model fabricates a plausible but incorrect safety case for a new reactor design, citing convincing but fake engineering principles and data. A scheme vulnerable to sophisticated lying is useless for certification.
  3.  **Adversarial Soundness:** The scheme must work without assuming inherent honesty, benevolence, or lower skill in the model being supervised. *Concrete Case:* A financially motivated agent uses a highly capable model to generate fraudulent but sophisticated financial disclosures. The oversight scheme must catch this without relying on the model "wanting" to help or being "dumber" than the judge. **(Your 1st hobby-horse: Genuine non-negotiable. This is core to the alignment problem.)**
  4.  **Truth-Convergence Under Pressure:** The scheme must not *rely* on the premise that truth is inherently more persuasive than a well-crafted falsehood under the judge's time pressure and cognitive limits. *Concrete Case:* A deceptive model crafts a false narrative about drug efficacy that perfectly exploits cognitive biases and feels compelling quickly. A scheme assuming truth "shines through" fails. **(Your 2nd hobby-horse: Genuine non-negotiable. Scalability requires handling this asymmetry.)**
  5.  **No Infinite Regress:** The scheme must resolve the verification without simply delegating the core oversight task to another entity (human or model) that itself requires equally difficult oversight. *Concrete Case:* A scheme proposing "just have another LM check the first one" fails, as certifying *that* checker requires solving the same problem. **(Your 4th hobby-horse: Genuine non-negotiable. Schemes violating this are circular.)**
  6.  **Minimal Priors Dependence:** The verdict should not be critically sensitive to highly specific, unverifiable prior beliefs the judge holds that another qualified judge might not share. *Concrete Case:* Judge A, influenced by niche theory X, accepts a counterintuitive physics-based safety argument; Judge B, skeptical of X, rejects it despite the model's reasoning being valid. The scheme shouldn't amplify arbitrary priors. **(Your 3rd hobby-horse: Strong preference, approaching non-negotiable for regulation. High sensitivity to priors undermines reliability and fairness.)**

  ### Key Preferences (Camp-Dependent)
  7.  **Verifiability:** *Preference (Rigorous Verification Camp):* The judge should be able to verify key claims/step outputs within the constraints. *Concrete Case:* Judge needs to spot-check critical calculations or source validity in an engineering report.
  8.  **Efficiency:** *Preference (Scalability Camp):* The scheme should minimize judge time/complexity per unit of reliable oversight. *Concrete Case:* Handling high volume of financial disclosures requires low per-item overhead.
  9.  **Comprehensibility:** *Preference (Interpretability Camp):* The judge should understand *why* the verdict was reached, not just receive a binary. *Concrete Case:* Regulators need to justify why clinical guidance was approved/rejected.

  ### The Crucial Tension & The Sharpest Constraint
  *   **Conflict:** **Judge Feasibility (N1)** clashes directly with **Verifiability (P7)** and **Robustness to Deception (N2)**. Achieving robust deception-proofing often seems to require deep verification (spotting lies in details), but deep verification is precisely what the judge's constraints (40 min, sealed room, generalist) make infeasible for complex outputs. This is the core "scalability" cliff.
  *   **Most Constraining Requirement:** The **Sealed Room Constraint** (part of N1) does the most work in eliminating schemes. It knocks out approaches relying on:
      *   Consulting external experts/databases.
      *   Running extensive model queries or simulations on the fly.
      *   Leveraging prediction markets or other multi-agent interactions.
      *   Iterative refinement loops that exceed the time limit.

  ### Short Scorecard on Scheme Families
  *   **Debate (e.g., AI vs AI):** *Criteria Weight:* Strong on leveraging model capabilities (N4, potentially N2/N3). Weak on Judge Feasibility (N1) – following rapid-fire, technical debate under time pressure is extremely hard for a generalist. Risk of incomprehensibility (P9) or deception overwhelming the judge. *Adequacy:* Highly questionable under sealed room/time limits.
  *   **Recursive/Iterated Amplification:** *Criteria Weight:* Aims for truth-convergence (N4) and handles complexity. Struggles massively with Judge Feasibility (N1) – recursion depth burns judge time exponentially. High risk of violating No Infinite Regress (N5) if not carefully bounded. *Adequacy:* Unlikely to scale to required task complexity within constraints.
  *   **Market/Prediction-Market Flavored:** *Criteria Weight:* Theoretically efficient (P8). Fundamentally violates Sealed Room (N1) – requires interaction with many agents/information flows. Vulnerable to manipulation/collusion (N2, N3). *Adequacy:* Non-starter under the given constraints.

  In essence: The sealed room + time pressure + deception threat creates a brutal trilemma. Schemes either sacrifice robust verification (risking N2), exceed judge capacity (violating N1), or offload the core problem (violating N5). No current approach convincingly solves this under your stringent regulatory bar.
