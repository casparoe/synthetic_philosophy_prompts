prompt: |-
  I write fiction for a living, and I'm drafting a novel in which two characters argue about which markets the law should shut down. I want their disagreement to turn on a distinction that would actually survive being argued with, so I've been collecting my own gut verdicts on a batch of cases and trying to see what they add up to. Here they are, with the verdicts I keep landing on:

  A living person sells a kidney to the highest bidder — no, and I'd keep it banned.

  The same kidney sale, except that the price is fixed by statute and the recipient is drawn by lottery from the waiting list — still no, but my recoil is much weaker, and I can't say why, since the same organ, the same surgery, and the same money are involved.

  Selling one's corneas, to be taken after death, the fee paid to one's estate — fine; no recoil at all.

  Paid surrogacy under an enforceable contract — permissible, though uneasy. This is the pair I can't reconcile: it seems to me to involve exactly what the kidney case involves, namely the state eventually backing a claim over a living person's body, yet I judge the two differently.

  Selling eggs for IVF — fine.

  Two hundred dollars for a vote — no; a crime, and I think rightly so. Yet paying people a modest sum for the time it takes to register and vote, with no condition on how they vote, strikes me as fine, and I know the two are hard to tell apart in their effects.

  Eighty dollars for a case of bottled water after a hurricane — no; I'd prohibit it, and the argument that high prices draw in supply doesn't move me. Eighty dollars for the same case at a desert music festival — also no, but markedly less bad.

  A thriller I'm commissioned to write for a defense contractor that supplies plot points and holds a veto over how its drone operators are portrayed — not fine. A novel commissioned by a hotel chain that leaves me full editorial control — fine.

  A fee to put my name on a novel I did not write — not fine, and worse than writing a novel that carries someone else's name, which is fine.

  And the case I find worst of all: a buyer who pays a premium not for the organ but for the seller's willingness — for the meeting, the thanks, the fact that the seller was willing at all. Nothing extra changes hands and no extra coercion is involved, yet this strikes me as worse than the plain sale.

  Is there one principle, or a small set, that gets all of these or nearly all? I'd like it stated precisely enough to argue with, with the case that motivates each clause. I especially want to know where you think the repugnance actually lives — in what is transferred, in what the transaction expresses to others, or in what the state would have to do to enforce it — because only one of those can be shown on the page, and I need to know which of my verdicts I'd be sacrificing if I built the argument around it. Tell me honestly which verdicts your principle cannot accommodate, and whether you'd have me drop them or bend the principle to keep them. Then give me its verdicts on two cases I haven't settled: a publisher paying my estate for the right, after my death, to produce new novels in which my characters appear, generated by a model trained on my work; and a state monopsony that is the only legal buyer of kidneys, paying a fixed sum, with no resale and no contact between buyer and seller.

  Please answer in American English.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating ethical puzzle about market boundaries in fiction writing context. As a novelist, they need a philosophically robust framework that can withstand character arguments, so the solution must be both logically consistent and dramatically viable.

  First, I notice the user's intuitions cluster around three dimensions: physical invasion (kidneys vs corneas), agency compromise (vote buying vs voting stipends), and expressive integrity (ghostwriting vs commissioned work). The strongest emotional responses seem tied to violations of bodily integrity and personal dignity, especially when living bodies become transferable property. 

  The surrogacy-kidney discrepancy is particularly telling. Both involve contracts over biological processes, but surrogacy feels less repugnant because: (1) it's temporally bounded, (2) involves creation rather than subtraction, and (3) maintains the surrogate's bodily autonomy during pregnancy. The organ sale's permanence triggers deeper unease.

  For the hurricane price gouging case, the user's rejection of standard economic arguments suggests they prioritize crisis ethics over market efficiency. The desert festival scenario is less offensive because participants aren't vulnerable - consent isn't compromised by desperation. This points to a "vulnerability principle" underlying their judgments.

  The commissioned novel cases reveal another layer: degradation of creative expression. When the defense contractor controls portrayal, it's not just a service transaction but compelled speech. The hotel chain's hands-off approach preserves artistic integrity, making it acceptable despite similar commercial context.

  The "worst case" - paying for willingness - is illuminating. The objection isn't to the transfer but to the symbolic reduction of human dignity to a purchased performance. This suggests their revulsion lives in the expressive dimension of transactions, not merely their mechanics.

  Now constructing the framework: I'll propose three core principles with caveats. The bodily integrity principle explains organ sales but needs refinement for surrogacy. The agency preservation principle covers vote buying but must distinguish time-compensation from influence. The expressive non-degradation principle handles creative work and the "willingness" case. 

  For the unresolved cases: Posthumous AI novels likely violate expressive integrity if the author's voice is co-opted without ongoing consent. A state kidney monopsony might be acceptable under the framework if it prevents exploitation, though fixed pricing could be problematic if set too low.

  The trickiest fit is paid surrogacy - I'll acknowledge the tension but argue pregnancy involves stewardship rather than alienation of bodily resources. If the user's unease persists, we might need an additional clause about irreversible biological transfers.

  Finally, for writing purposes, the expressive dimension seems most dramatizable - characters can directly debate what transactions "say" about human value. The enforcement mechanics (state coercion aspect) would require more exposition but could fuel ideological conflict.
answer: |-
  Based on your intuitions, here's a principle designed to capture most of your verdicts, along with an analysis of its fit, the source of repugnance, and verdicts on your new cases:

  **The Core Principle: Non-Degradation of Essential Human Attributes in Transferable Markets**

  1.  **Bodily Integrity:** Markets facilitating the *irreversible transfer of vital, non-regenerative physical components of a living person's body* are prohibited because they degrade the person from an end-in-themselves to a source of spare parts. Enforcement necessitates state coercion over a living body, violating inherent dignity.
  2.  **Essential Agency:** Markets facilitating the transfer of *fundamental expressions of civic or personal agency* (where the act *is* the expression) are prohibited because they commodify and degrade the core act of self-governance or identity. Enforcement requires the state to treat these acts as property, not inherent rights.
  3.  **Expressive Authenticity:** Markets requiring the *substantial misrepresentation of personal creative contribution or the compelled distortion of authentic expression under another's control* are prohibited because they degrade artistic/speech integrity and personal authenticity. Enforcement compels inauthentic expression.
  4.  **Vulnerability Exploitation:** Markets enabling *extreme price premiums due to acute, non-substitutable need during crisis or profound vulnerability* are prohibited because they exploit desperation, degrading the vulnerable party. Enforcement upholds exploitative gains during suffering.

  **Where the Repugnance Lives: Primarily in what the transaction expresses to others (and oneself) about human value and dignity, and secondarily in what the state must do to enforce it.**

  *   **Expression:** Your strongest recoil (the "willingness premium," vote buying, ghost-naming, crisis gouging, controlled speech) centers on transactions that symbolically *reduce a person or their core attributes/acts* to a mere commodity, signaling that dignity, agency, or authenticity are for sale. This degradation *to societal perception and self-perception* is the core driver of repugnance. It makes the irreversible kidney sale worse than surrogacy (temporary use, creation), the willingness premium worse than the plain sale (explicitly commodifying the act of consent itself), vote buying worse than time compensation (commodifying the sacred act vs. removing a barrier to it), and crisis gouging worse than festival gouging (preying on desperation vs. convenience).
  *   **State Enforcement:** The *necessity* of state action reinforces the repugnance. Enforcing a kidney contract requires state power to literally seize a vital organ from a living person, an extreme violation of bodily sovereignty. Enforcing a vote sale requires treating the franchise as property. Enforcing the willingness premium compels the performance of gratitude. This *visible state backing* of the degrading act makes the repugnance concrete and institutionalizes it.
  *   **The Thing Transferred:** This is often the *trigger* (kidney, vote, creative control) but isn't inherently repugnant in all contexts (corneas after death, eggs, water at a festival). The repugnance arises when transferring that *specific thing* under *specific conditions* degrades human attributes or exploits vulnerability, as defined above.

  **Applying the Principle to Your Cases (Fit & Misfits):**

  1.  **Living Kidney Sale (Highest Bidder):** **Banned.** Violates (1) Bodily Integrity (vital, non-regenerative, irreversible transfer from living person). State enforcement is profoundly degrading.
  2.  **Living Kidney Sale (Fixed Price, Lottery):** **Banned.** Still violates (1). The fixed price/lottery mitigates *exploitation* but doesn't negate the fundamental degradation of commodifying a vital bodily component from a living person. *(Your weaker recoil might stem from reducing the "Vulnerability Exploitation" element, but the core Bodily Integrity violation remains strong.)*
  3.  **Corneas After Death:** **Permitted.** Does *not* violate (1) as the person is dead; bodily integrity concerns lapse. Does not involve vulnerability exploitation. The estate receives compensation for a resource no longer essential to the person.
  4.  **Paid Surrogacy (Enforceable Contract):** **Permitted (Uneasy).** *Fits uneasily.* **Argument for Fit:** It involves the temporary *use* of bodily capacity for creation, not the irreversible transfer of a vital component. The state enforces a service contract (carrying a child), not a claim to an organ itself. It doesn't inherently commodify agency or expression. The uneasiness might stem from the *potential* for exploitation (addressed by regulation) or the unique intimacy, but it doesn't clearly violate the core principles. **Misfit:** Your unease suggests the framework might need refinement for unique bodily *services*. However, it captures the key distinction from kidney sales: lack of *irreversible removal of a vital component*.
  5.  **Selling Eggs:** **Permitted.** Similar to (3). Involves renewable tissue, not vital organs. No irreversible harm to bodily integrity. Compensation for time/medical procedure.
  6.  **$200 for a Vote:** **Banned.** Violates (2) Essential Agency. Voting is a fundamental expression of civic agency; selling it commodifies and degrades that act. Enforcement treats the franchise as property.
  7.  **Modest Sum for Voting Time:** **Permitted.** Compensates for time/effort (a barrier), *not* for the vote itself. Does not commodify the act of agency/expression. Removes a disincentive without purchasing the expression.
  8.  **$80 Water After Hurricane:** **Banned.** Violates (4) Vulnerability Exploitation. Exploits acute, non-substitutable need during crisis. Price premium is due solely to desperation.
  9.  **$80 Water at Desert Festival:** **Permitted (Less Bad).** High price reflects convenience/scarcity in a non-crisis, elective setting. Consumers have alternatives (bring their own, leave). Does not exploit profound vulnerability. Your "less bad" sense fits – it's arguably *unfair* but not *exploitative degradation* within the principle.
  10. **Thriller w/ Contractor Control:** **Not Fine.** Violates (3) Expressive Authenticity. Substantial control/veto by the client forces distortion of authentic expression. It's compelled speech degrading artistic integrity.
  11. **Novel w/ Full Editorial Control:** **Permitted.** Commissioned work with authentic authorship preserved. No violation of (3).
  12. **Fee for Name on Unwritten Novel:** **Not Fine (Worse).** Violates (3) Expressive Authenticity *severely*. It's pure misrepresentation of creative contribution, degrading both authenticity and public trust. Worse than ghostwriting because the *named author* actively sells the lie of their contribution.
  13. **Ghostwritten Novel:** **Permitted.** The writing is authentic labor (even if anonymous). The *named author* may be misrepresenting contribution, but the *transaction* being enforced (paying for writing services) is authentic. The degradation is interpersonal deception, not inherent to the *market structure* enforced by the state. *(This is the trickiest fit – your intuition that putting your name on someone else's work is worse than writing under their name is strong. The principle focuses on the core transaction enforced: paying for authentic writing vs. paying for a false attribution of authorship.)*
  14. **Premium for Willingness (Meeting/Thanks):** **Banned (Worst).** Violates (1) & (2) profoundly *in expression*. It explicitly commodifies not just the organ, but the *act of consent and human connection itself* (agency and dignity). Paying extra for the performance of gratitude/altruism degrades the seller's humanity into a purchased emotional experience for the buyer. State enforcement compels this performance. The "nothing extra changes hands" highlights that the degradation is purely expressive/symbolic.

  **Accommodation & Sacrifices:**

  *   **Good Fit:** 1, 2, 3, 5, 6, 7, 8, 9, 10, 11, 12, 14.
  *   **Uneasy Fit:** **4. Paid Surrogacy.** The principle permits it, but your unease remains. *Recommendation:* Acknowledge the tension in the narrative. Perhaps refine the principle with an addendum: "...particularly where the service involves extreme, irreversible physical alteration or unique, profound bodily intimacy." This *could* capture surrogacy unease but risks overreach. Your character arguing *for* surrogacy might point out the lack of irreversible removal.
  *   **Debatable Fit:** **13. Ghostwriting.** The principle permits it, focusing on the *writing service* transaction as authentic. Your "fine" verdict aligns. The misrepresentation is a separate ethical issue, not directly about the *market* the state enforces (paying for writing). To ban ghostwriting would require broadening (3) significantly, potentially catching legitimate collaborations/editing. *Recommendation:* Keep your verdict and the principle's permission here. The degradation in ghost-*naming* (case 12) is sufficiently captured.

  **Verdicts on New Cases:**

  1.  **Publisher Pays Estate for AI-Generated Sequels:**
      *   **Verdict: Not Fine / Banned.**
      *   **Why:** Violates (3) Expressive Authenticity. It facilitates the creation and sale of works that fundamentally misrepresent the creative contribution. The AI output mimics the author's voice/style but lacks their authentic creative agency and intent. The estate sells the *right to impersonate* the author's creative expression posthumously, degrading their artistic legacy and public understanding of authorship. Enforcement upholds this inauthenticity.

  2.  **State Monopsony for Kidneys (Fixed Price, No Resale/Contact):**
      *   **Verdict: Permitted (with reservations).**
      *   **Why:** *Avoids* the worst repugnance drivers:
          *   **(1) Bodily Integrity:** The irreversible removal violation remains. *However*, the monopsony structure drastically reduces (4) Vulnerability Exploitation (no bidding wars, price fixed) and eliminates the expressive degradation of (14) (no contact, no performance of gratitude). The fixed price aims at fairness.
          *   **(2) Essential Agency:** It commodifies the organ, but the monopsony structure avoids the extreme commodification of *finding a specific buyer* or *negotiating price*.
          *   **State Enforcement:** Remains problematic (seizing an organ), but the context (fixed price, lottery allocation like dialysis) frames it more akin to a highly compensated, extreme societal duty than a pure market, mitigating the expressive degradation.
      *   **Reservations:** Is the fixed price truly non-exploitative? Does it still violate bodily integrity too profoundly? Your principle *permits* it mainly by mitigating the other sources of repugnance (exploitation, degrading expression) inherent in a free market. Your character *opposing* it would focus relentlessly on the bodily integrity violation and state coercion. Your character *supporting* it would argue it minimizes the other harms and saves lives within the least degrading framework possible for a living donor system.

  **For Your Novel:**

  *   **Focus on Expression:** Since repugnance primarily lives in what the transaction *expresses* about human value and dignity, this is the most powerful angle for dramatization. Characters can passionately argue about what selling a kidney, a vote, or creative control *says* about us as a society, whether it degrades the seller, corrupts the buyer, or erodes shared values. The state enforcement angle provides concrete stakes (e.g., "Should sheriffs really repo a kidney?" or "Should courts force a surrogate to abort?").
  *   **Acknowledge Tensions:** The surrogacy case is the principle's weakest fit with your intuition. Let that tension exist in the argument! One character can use the principle to defend it, the other can argue it *feels* like a bodily integrity violation due to the intimacy and physical risk, even if not an "irreversible transfer of a vital component."
  *   **Use the New Cases:** The AI sequel case is a fantastic modern dilemma highlighting expressive authenticity. The state monopsony is a pragmatic but ethically fraught proposal – perfect for nuanced debate showing characters grappling with trade-offs between repugnance and necessity.

  This framework provides a coherent, arguable foundation rooted in preventing the *degradation of essential human attributes* through specific market structures, explaining most of your intuitions while highlighting the critical role of expressive meaning and state enforcement in generating repugnance.
