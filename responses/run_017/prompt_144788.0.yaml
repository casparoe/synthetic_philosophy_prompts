   But note: the original step (1) says that the agent must be indifferent. Step (5) says that because of indifference, it has no reason to preserve the off-switch. So we have a tension.

   How can we resolve this?

   We might add a separate component: the agent is designed to preserve the off-switch because we (the designers) want it to. We can build that into the utility function. For example, the agent might get a very large penalty if it tampers with the off-switch. Then it is not indifferent about tampering: it actively avoids it.

