   But let's go back to the main counterexample and step (3). The user's batch job example shows that step (3) is misapplied in the flat case. Therefore, step (4) does not follow for the indifferent agent.

   So the hole in the argument is step (3) as applied to a flat utility function. The reasoning in step (3) only creates incentives when there is a functional dependence (i.e., when the utility varies with the variable). In the flat case, there is no variation, so no incentive.

