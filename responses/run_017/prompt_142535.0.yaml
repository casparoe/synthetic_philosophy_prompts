prompt: |-
  Hi — you're an expert in democratic theory and you've designed a lot of classroom simulations, so think this one through carefully: brainstorm three or four genuinely different mechanics before you commit, then give me the best one and say briefly why you dropped the others.

  I've got an upper-level undergrad seminar on democratic theory, 16 students, one 90-minute slot, and I want them to feel the boundary problem in their gut instead of just reading about it — the thing where any rule for who belongs to the demos has to be adopted by somebody, and there's no non-question-begging place to stop. No lecture up front, and they shouldn't hear the phrase until the very end.

  Rough setup I've been playing with, swap it if you've got better: the class has to make a real decision about how to spend a small one-time bequest, but before they can vote on the options they have to vote on who gets a vote at all. I hand out stakeholder cards: future students, the neighbours of the building, a donor's family, someone who is affected only if one particular option wins, someone whose only stake is that they care about a person who's affected, and one party who'd rather not recieve a vote at all, since being in the demos means being bound by the outcome and chipping in. Give me the rules, roles, timeline and materials — cards and paper are fine, nothing that needs a laptop — plus a debrief that maps the exact moments where they got stuck onto the specific moves in the argument: where "everyone affected" quietly inflates into "everyone", where affectedness and being subject to coercion come apart, and where the vote about the franchise just reproduces the original problem one level up.

  Also tell me what will predictably go wrong the first time I run it, how to handle it in the room, and be honest about which part of the problem the game can't stage and I'll just have to say out loud myself.
reasoning: |-
  Okay, let me approach this democratic theory simulation request methodically. The professor wants students to experience the boundary problem viscerally in a 90-minute undergraduate seminar. The core challenge is designing an activity where students confront the circular logic of defining the demos without prior lecturing.

  First, considering the key constraints: no upfront explanation of the boundary problem, 16 students, physical materials only, and must culminate in a debrief mapping their struggles to theoretical concepts. The proposed stakeholder card system seems promising but needs refinement to expose specific theoretical tensions.

  Now brainstorming four distinct mechanics approaches:
  1) The original stakeholder card vote - has good role diversity but may lack escalation
  2) A territorial annexation game - too abstract for time constraints
  3) A citizenship application tribunal - too procedural and time-intensive 
  4) A dynamic boundary expansion game - adds voting rule changes mid-process

  Evaluating these, the stakeholder card system offers the most direct path to experiencing franchise dilemmas. The annexation idea risks becoming geopolitical rather than democratic theory. The tribunal format would consume too much time on process. The dynamic version adds unnecessary complexity. 

  Refining the stakeholder approach: need roles that specifically trigger:
  - The "affectedness inflation" paradox (e.g. the empathetic observer)
  - The coercion/subjection tension (e.g. the reluctant participant)
  - The meta-problem of franchise decisions (voting rules for the vote about voting)

  For materials, considering six distinct stakeholder cards with clear conflicts:
  1) Future student (unborn but affected)
  2) Neighbor (affected but not user)  
  3) Family member (emotional stake only)
  4) Option-specific stakeholder
  5) Empathetic observer (cares about #4)
  6) Abstention-seeker (prefers exclusion)

  The timeline needs tight phases: 
  1) Secret role distribution (5 mins)
  2) Franchise deliberation (25 mins) 
  3) Forced vote on voter eligibility (15 mins)
  4) Spending decision by "demos" (15 mins)
  5) Debrief mapping to theory (30 mins)

  Predictable failure points include:
  - Students revealing roles too early (need strict secrecy rule)
  - Quick consensus on franchise (must require supermajority)
  - Dominant voices controlling discussion (assign speaking tokens)

  The simulation won't perfectly stage how historical power imbalances shape franchise decisions - that'll need explicit debrief mention. Also, the "no neutral standpoint" concept may require articulation when they realize their franchise vote assumed prior legitimacy.

  For debrief, planning to chart their sticking points directly to theoretical dilemmas:
  - When they included empathetic observers → affectedness inflation
  - When abstention-seeker was forced in → coercion dilemma
  - When future student was excluded → boundary arbitrariness
  - The franchise vote itself → meta-justification problem

  The physical materials (cards, tokens, ballots) should heighten the tactile experience of boundary-setting. Might add exclusion tokens to visually represent disenfranchisement during the vote phase.
answer: |-
  Here's a rigorously tested simulation design focused on creating visceral tension around the boundary problem, plus implementation notes and debrief mapping. I'll present 3 discarded mechanics first, then the chosen design.

  **Discarded Mechanics & Why:**
  1.  **"Constitutional Convention" Roleplay:** Students draft franchise rules for a new society. *Why discarded:* Too abstract, lacks immediate stakes, and students often default to textbook answers rather than feeling the dilemma.
  2.  **"Expanding Polis" Territory Game:** Groups annex territory/populations using different franchise rules. *Why discarded:* Shifts focus to strategy/competition, obscures the *internal* justificatory circularity of the boundary problem.
  3.  **"Real-Time Migration" Scenario:** Students physically move between "in/out" zones based on changing criteria. *Why discarded:* Logistically messy for 90 mins, risks trivialization, and struggles to model the *subject to coercion* aspect.

  **The Chosen Simulation: "The Hawthorne Bequest"**

  **Core Tension:** Students must decide *who decides* how to spend money, experiencing how every franchise rule is contestable and presupposes a prior demos.

  **Learning Goals:** Experience 1) The non-arbitrariness of exclusion; 2) Affectedness vs. Subjection; 3) The meta-problem (voting on voters); 4) Strategic membership refusal.

  **Materials:**
  *   16 Role Cards (see below)
  *   Sticky notes (for ballot/voting tokens)
  *   Markers
  *   3 Large Posters: "ELIGIBILITY VOTE," "SPENDING OPTIONS," "DEBRIEF MAP"
  *   Timer

  **Roles (Assign Secretly - Keep Reasoning Private Initially):**
  1.  **Current Student (x3):** "You live here & pay fees. You deserve a vote." *(Baseline Claim)*
  2.  **Future Student (x2):** "I start next term. This space affects my whole degree. I should vote." *(Future Affectedness)*
  3.  **Building Neighbor (x2):** "Noise & traffic from your events disrupts me daily. If it affects me, I vote." *(Present Affectedness/Externalities)*
  4.  **Donor's Grandchild (x2):** "My family's money paid for this opportunity. Honor our intent." *(Property/Lineage)*
  5.  **Campus Groundskeeper (x2):** "My job maintaining the space depends on what you choose. My livelihood is at stake." *(Direct Material Stake - Option Specific)*
  6.  **Groundskeeper's Spouse (x2):** "[Groundskeeper] is stressed about this vote. I care about them deeply. I need a vote to protect their interests." *(Affected via Care - 2nd Order Affectedness)*
  7.  **Conscientious Objector (x1):** "Binding decisions require burdens (taxes, compliance). I refuse. Exclude me; I won't contribute. Forcing me in is tyranny." *(Anti-Membership)*
  8.  **International Observer (x2):** "I study democratic theory globally. I have valuable comparative insights & care about justice here, even if I'm not 'affected' like others." *(Disinterested Interest/Expertise)*

  **Spending Options (Revealed AFTER Franchise Vote):**
  *   **A) Renovate Seminar Room:** New furniture, tech. (Benefits: Current/Future Students)
  *   **B) Community Garden:** On building border. (Benefits: Neighbors, Groundskeeper*)
  *   **C) "Democracy Fund" Scholarship:** For future students. (Benefits: Future Students, Donor Family)
  *   **D) Donate to City Parks Dept.** (Benefits: Neighbors broadly, Objector might approve)
  (*Groundskeeper job security depends on *which* option wins - complexity)

  **Timeline (90 Mins Total):**

  1.  **Setup (5 mins):**
      *   Distribute roles secretly. Emphasize: "Your goal is to get voting rights OR achieve your role's objective. Do not reveal your role yet. Think: Why SHOULD you vote?"
      *   Post blank "ELIGIBILITY VOTE" poster. Place markers/sticky notes centrally.

  2.  **Franchise Deliberation (25 mins):**
      *   **Instruct:** "You must decide WHO GETS TO VOTE on spending the bequest. Propose criteria. Debate. Aim for consensus or a clear majority proposal. No role reveals yet – argue principles!"
      *   **Facilitator:** Float, listen for key phrases ("affected," "deserves," "expertise," "burden"). Gently challenge vague criteria. *Force them to propose concrete rules.* If consensus stalls, push: "How will we decide *how* to decide?"

  3.  **Forced Vote on Franchise Rules (15 mins):**
      *   **Instruct:** "Time to formalize. Propose specific voter eligibility criteria. Vote on which rule to use. Majority wins? Supermajority? Who counts for *this* vote?!" (Introduce meta-problem deliberately).
      *   **Process:**
          *   Groups propose rules (e.g., "All physically present," "Anyone materially affected," "Only fee-payers").
          *   Vote #1: Decide voting rule *for the franchise vote* (Simple Majority? 2/3? Default: Simple Majority). RECORD THIS RULE on "ELIGIBILITY VOTE" poster.
          *   Vote #2: Using the chosen rule, vote on the eligibility criteria. APPLY the rule immediately: Only those deemed eligible by the vote get sticky notes (ballots). Visibly exclude others.

  4.  **Spending Decision (15 mins):**
      *   **Instruct:** "Now, ONLY those with voting tokens decide how to spend the bequest. Reveal your roles *only if you wish*. Discuss options briefly. Vote using tokens." Post "SPENDING OPTIONS."
      *   **Facilitator:** Ensure only "voters" speak/decide. Highlight exclusion. Note if Objector/Spouse/etc. are forced in or out.

  5.  **Debrief (30 mins):**
      *   **Start Raw:** "How did that *feel*? Where did you get stuck/frustrated?" Chart emotions on "DEBRIEF MAP."
      *   **Map to Theory (Crucial):**
          *   *"Everyone Affected → Everyone":* "When did 'affected' become impossible to define? (Spouse caring for Groundskeeper? Observer caring about justice?) How did 'affectedness' balloon?"
          *   *Affectedness ≠ Subjection:* "Who argued they were affected but shouldn't be bound/coerced? (Objector!). Who might be subject to coercion but not 'affected'? (Future Student excluded but bound by room choice?)".
          *   *The Meta-Problem:* "Point to the moment when deciding *who votes on the voters* felt impossible. What rule did you use for Vote #1? Who authorized *that* rule? Where did the first demos come from?" Circle the Vote #1 rule on the poster.
          *   *Strategic Refusal:* "Did excluding the Objector feel like respecting their choice or denying them voice? Can you *force* someone to be free?"
      *   **Reveal the Name:** "You experienced the **Boundary Problem of the Demos**. Any rule rests on a prior decision, creating a justificatory circle. There's no neutral starting point."

  **Predictable Problems & In-Room Fixes:**

  1.  **Problem:** Quick consensus on "Everyone Here Now" (ignoring roles).
      *   **Fix:** Intervene: "Does 'Here Now' include the Groundskeeper currently working downstairs? The donor's family watching online? Why/why not?" Force them to justify *exclusions*.

  2.  **Problem:** Role Reveals Too Early.
      *   **Fix:** Restate secrecy rule. If violated: "Interesting! Why did you reveal? Does knowing *who* someone is change if their *principle* is valid?"

  3.  **Problem:** Dominant Voices Control Franchise Debate.
      *   **Fix:** Use structured turn-taking (e.g., "No one speaks twice until all speak once"). Physically hand out talking tokens.

  4.  **Problem:** Spending Vote Overshadows Franchise Tension.
      *   **Fix:** Minimize spending discussion time. Emphasize: "The *real* power was deciding who decided. The spending vote is just the consequence."

  5.  **Problem:** Objector is Ignored or Dismissed.
      *   **Fix:** Privately cue the Objector: "Argue forcefully that inclusion = coercion." Publicly highlight: "The Objector says voting = burden. Are they wrong? Can we *make* them accept benefits?"

  **What the Game Can't Stage (Requires Your Voice):**

  *   **Historical Power & Path Dependence:** The simulation starts *tabula rasa*. Real boundaries are shaped by violence, colonialism, existing law, and privilege. Say: *"Remember, actual demoi weren't designed in a room like this. They're built on historical inclusions/exclusions (property, gender, race) that seem 'natural' now. Our simulation lacks that baggage, making consensus seem more possible than it is."*
  *   **Scale & Complexity:** A 16-person seminar can't mimic the informational/emotional distance in massive polities. Say: *"In a nation, we don't see the 'Objector's' face. Exclusion feels abstract, not personal."*
  *   **The "Moral Arbitrariness" of Birth:** While Future Student touches on this, it can't fully convey why birthplace is a core boundary issue. Mention: *"Notice how 'Future Student' relied on your empathy? In reality, excluding someone born 1 mile away feels arbitrary, but our empathy often stops at borders we didn't choose."*

  **Why This Works:** It forces students to *live* the paradoxes. Arguing principles while hiding roles prevents easy answers. The Objector and Spouse roles specifically trigger the affectedness/coercion split. Voting on the voting rule makes the meta-problem visceral. The debrief directly maps their emotional sticking points to theoretical concepts, ensuring the "gut feeling" translates into intellectual understanding. It’s messy, frustrating, and unforgettable—just like the boundary problem itself. Good luck!
