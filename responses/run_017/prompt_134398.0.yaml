  Below is a decision procedure for determining if the strategy-stealing argument applies to an abstract strategy game, structured as a sequence of ordered questions. Each question must be answered based on the game's rules. The output is one of three verdicts:
  - **Publish as is**: The strategy-stealing argument does not prove a first-player forced win or second-player non-win, so no structural flaw is detected by this method.
  - **Add a swap rule**: The argument proves the first player has a forced win (due to no draws), so adding a swap rule (e.g., pie rule) is recommended to balance the game.
  - **Reject**: Not used in this procedure; structural flaws not covered by strategy-stealing (e.g., inherent second-player wins) are not detected here. If the argument doesn't apply, default to "publish as is" and rely on playtesting.

  The procedure relies on necessary conditions for the strategy-stealing argument. If any condition fails, the argument does not apply, and the verdict is "publish as is". The procedure cannot:
  - Provide a winning strategy (only proves existence).
  - Quantify the size of the advantage.
  - Fix games where the argument shows a forced draw (outputs "publish as is").
  - Handle games with draws perfectly (may miss first-player wins).

  ### Decision Procedure:
  1. **Chance or hidden information?**  
     - *Yes*: Argument fails → "publish as is".  
     - *No*: Proceed.  
     *Necessary. Judgment: Ensure no dice, randomness, or hidden states.*

  2. **Finite and deterministic?**  
     - *No* (e.g., loops, non-terminating): Argument fails → "publish as is".  
     - *Yes*: Proceed.  
     *Necessary. Game must end in finite moves with perfect information.*

  3. **Role symmetry?**  
     Check if swapping player roles leaves the game unchanged, via either:  
     - *Option A (Identical rules)*: Both players have identical moves and goals (e.g., both aim for the same win condition).  
     - *Option B (Board symmetry)*: There is a board involution (e.g., reflection, rotation) that swaps the players' win conditions.  
     - *Neither*: Argument fails → "publish as is".  
     *Necessary. Judgment: For Option B, ensure the involution cleanly maps one player's win condition to the other's.*

  4. **Monotonicity?**  
     - Adding a stone of your color to an empty cell must never harm your position (e.g., it cannot create a loss condition for you or destroy a win condition you had).  
     - *Yes*: Proceed.  
     - *No* (e.g., creating a forbidden pattern hurts you): Argument fails → "publish as is".  
     *Necessary. Judgment: Focus on immediate harm; assume blocking opponents helps unless rules penalize your own patterns.*

  5. **Draws possible?**  
     - *Yes* (e.g., board fill without a win): Argument shows first player can force at least a draw (second player cannot win), but not necessarily a win → "publish as as".  
     - *No*: Proceed to verdict.  
     *Determines if the argument proves a win (no draws) or only non-loss (draws possible).*

  6. **Verdict if all prior yes:**  
     - Draws are impossible → First player has a forced win → "add a swap rule".  
     *(This concludes the procedure; if any step fails, default to "publish as is".)*

