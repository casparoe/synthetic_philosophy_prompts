  1. **Symmetry**: The game is symmetric under the roles of the two players. This symmetry must be such that there is an involution (a symmetry of order two) that swaps the roles of the players. This could be a symmetry of the board (like a reflection or rotation) or a relabeling of moves.

  2. **Monotonicity**: Having an extra stone (or move) of your own color never hurts your own position. This is often stated as: if a position is winning for a player, then adding an extra stone of that player (without changing the opponent's stones) in an empty spot should not turn it into a loss for that player.

  3. **Determinacy**: The game is determined, meaning that from every position, one of the players has a winning strategy or both can force a draw. We assume perfect information and no chance.

  4. **Availability of a "pass" or a "wasted" move**: The first player can use the second player's strategy by making an arbitrary first move and then, when the second player makes a move, the first player can imagine that the arbitrary first move was not there and follow the second player's strategy. This requires that the arbitrary first move does not harm the first player (by monotonicity) and that the game state after the first move is symmetric to the original state without that move.

  5. **No Hidden Information or Chance**: The game must be one of perfect information and without chance elements.

