  Below is a concrete, runnable game design for your seminar, structured to help students experientially grasp the differential-cost requirement of the handicap principle. The game uses index cards for hidden types, signals, and decisions, with a projector to display rules/payoffs. Reputation is blocked via anonymous random re-matching each round. The debrief (provided at the end) avoids technical jargon until students have experienced the dynamics.

  ---

  ### **Game Setup**
  - **Students**: 18 (each assigned a fixed anonymous ID: e.g., S1 to S18).
  - **Types**: Three hidden qualities—Low (L), Medium (M), High (H)—assigned randomly at the start of each condition. **Distribution**: 6 L, 6 M, 6 H (balanced).
  - **Signals**: Integers 0–5 (chosen per round; 0 = no signal).
  - **Matching**: Each round, students are randomly re-paired anonymously (no repeated pairs). Use index cards to shuffle and redistribute assignments.
  - **Rounds per condition**: 
    - Condition 0 (free signals): 2 rounds (quick baseline).  
    - Condition 1 (flat cost): 3 rounds.  
    - Condition 2 (differential cost): 5 rounds (key insight).  
    - Condition 3 (unfakeable index): 2 rounds.  
    - Condition 4 (noisy public cue): 5 rounds.  
    - *Total*: 17 rounds (~5 min/round = 85 min).
  - **Payoffs** (displayed via projector):  
    - **Signaller payoff** = `Benefit if accepted - Signal cost`.  
      - Benefit if accepted: L = 4, M = 5, H = 6.  
      - Benefit if rejected: 0.  
    - **Receiver payoff** = `Type value if accepted` (reject = 0).  
      - Type value: L = -1, M = 0, H = 1.  
    - **Signal costs by condition**:  

      | Condition        | Cost for L | Cost for M | Cost for H | Notes                                                                 |
      |------------------|------------|------------|------------|-----------------------------------------------------------------------|
      | 0: Free          | 0          | 0          | 0          | No cost.                                                              |
      | 1: Flat cost     | s × 1      | s × 1      | s × 1      | Identical cost per unit signal (s).                                   |
      | 2: Falling cost  | s × 2      | s × 1      | s × 0.5    | Cost falls with quality (key differential).                           |
      | 3: Index         | s × 2      | s × 1      | s × 0.5    | Receiver sees *true type* on index card.                              |
      | 4: Noisy cue     | s × 2      | s × 1      | s × 0.5    | Receiver sees signal *and* a noisy cue (details below).               |

    *Example*: A High type signalling s=3 in Condition 2 gets `6 - (3 × 0.5) = 4.5` if accepted; `0 - 1.5 = -1.5` if rejected.

  ---

  ### **Game Procedure (Per Round)**
  1. **Assign types** (start of each condition):  
     - Distribute index cards with hidden types (L/M/H). Students keep this card private.
  2. **Signal choice**:  
     - Each student writes their **signal (0–5)** and **student ID** on an index card.  
     - *Condition 4 only*: Add a **noisy public cue** (pre-generated by instructor; see below).
  3. **Random matching**:  
     - Collect all cards. Shuffle and redistribute randomly—each student receives one card (not their own).  
     - They are now the **receiver** for that signaller’s signal.  
  4. **Receiver decision**:  
     - Receiver writes **Accept/Reject** on the card, using *only the signal (and cue in Condition 4)*.  
     - *Condition 3 (index)*: **Write true type on the card** before redistribution (e.g., "Type: M").
  5. **Compute payoffs**:  
     - Instructor collects cards, calculates payoffs based on:  
       - Signaller’s true type (from master list).  
       - Receiver’s decision.  
       - Signal cost (condition-dependent).  
     - Return payoff summaries (no partner IDs) to students.  
  6. **Repeat**: Re-pair randomly each round. Reassign types only at the start of a new condition.  

  ---

  ### **Special Conditions**
  - **Condition 3 (Unfakeable index)**:  
    - Receiver sees the *true type* on the card. Signals become redundant (prediction: signals drop to 0).
  - **Condition 4 (Noisy public cue)**:  
    - **Cue generation** (pre-round; instructor preps envelopes):  
      - L: 70% cue=0, 30% cue=1.  
      - M: 70% cue=1, 30% cue=0.  
      - H: 70% cue=2, 30% cue=1.  
    - Receiver sees *both signal and cue*. Predicts counter-signalling: Ms signal hardest (to separate from Ls with cue=1), Hs/Ls signal less.  

  ---

  ### **Blocking Reputation**
  - **How**: Anonymous random re-matching each round (no record of past partners). Student IDs are used *only* for payoff calculation—receivers never see signaller IDs.  
  - **If students try to build reputation**:  
    - Gently remind them: "Your decision is for one interaction only. You will never see this partner again."  
    - Ignore reputation-based strategies in payoff calculations (treat as random noise). Focus discussion on aggregate patterns.  

  ---

  ### **Debrief Guide**  
  **Avoid terms**: Handicap principle, separating equilibrium, counter-signalling until after discussion.  
  **Start with observations**: "What patterns did you notice? When did signals feel trustworthy? Why?"  

  1. **Map conditions to concepts**:  
     - **Condition 0 (free signals)**: Signals are "cheap talk"—no cost, no trust. Low types signal high to scam; receivers ignore signals.  
     - **Condition 1 (flat cost)**: Trust emerges for *high signals* but pools M/H. *Why?* Cost deters Ls (costs them more relative to benefit), but M/H pay the same cost. Textbook error: "Expensive = honest" misses differential cost.  
     - **Condition 2 (falling cost)**: Trust for *all types*. Ls signal low (s=0), Ms (s=2–3), Hs (s=4) separate cleanly. *Insight*: H signals more because it costs them *less*—differential cost enables honesty.  
     - **Condition 3 (index)**: Signals vanish (s=0). Honesty needs no cost if type is directly observable.  
     - **Condition 4 (noisy cue)**: Ms signal hardest (avg s=2–4), Hs/Ls signal less (avg s=0–1). *Why?* Ms need to separate from Ls who share cue=1; Hs (cue=2) and Ls (cue=0) are "revealed." Counter-signalling emerges.  

  2. **Troubleshoot Condition 1**:  
     - **Likely deviation**: Ms and Hs pool at medium signals (e.g., s=3). Receivers accept all s≥3, but can’t distinguish M/H.  
     - **Recover**: Ask: "Could Hs afford to signal even higher? Why didn’t they?" Highlight flat costs: Hs pay the same as Ms, so they gain nothing from signalling higher. Contrast with Condition 2 (Hs pay half).  

  3. **Limitations of the game**:  
     - **Biology vs. game**: In nature, signals evolve via selection (not individual choice). Costs are fitness-based (survival/reproduction trade-offs), not points.  
     - **Noise and context**: Real cues/signals are noisier; ecology (predation, resource scarcity) alters cost structures.  
     - **Generalizability**: The game simplifies to 3 types; continuous quality gradients change dynamics.  

  ---

  ### **Why Skip the "Gift" Condition?**
  A round where signallers "burn" cost vs. gift it to receivers *could* show that waste is necessary for honesty—gifts invite mimicry (e.g., Ls gift-high to get accepted). However, it complicates payoff structures and adds minimal insight beyond Condition 2. Given time constraints, it’s omitted. If included, use:  
  - **Setup**: Signallers choose to burn s (receiver gets 0) or gift s (receiver gains s if accepted).  
  - **Payoffs**: Receiver sees s but not burn/gift choice.  
  - **Settles**: Burning sustains honesty (differential cost matters); gifting causes pooling (Ls gift-high, receivers accept due to added gain).  

  ---

  This design forces students into the "expensive = honest" trap (Condition 1), then reveals the differential-cost solution (Condition 2). The noisy cue round (Condition 4) challenges intuitions about who signals. Use the projector to display payoffs/cues, and index cards for all hidden choices—no budget needed.
