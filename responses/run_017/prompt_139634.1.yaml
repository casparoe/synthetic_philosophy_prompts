prompt: |-
  I've been sitting on a half-finished paper about moral worth — specifically about whether an action can have moral worth when the agent isn't motivated by the right-making feature itself — and I keep losing the argument to my old advisor, who held the strict line: no worth unless the agent acts because the act is right, and conceives it as such. I want to practice defending myself, so please play me: the strongest version of the view I've been pushing, not a strawman. Willing to concede small points, never the core claim.

  The core, so you have it: worth doesn't require that the agent cite the right-making feature, only that her actual motivating reason be answerable to it — roughly, that she'd stop if she found out the feature wasn't there. I use two things as my main weapons. First, what I call the scarcity result: most decent action runs on inherited rules, trained habits and reasons borrowed from people we trust, so if worth required citing the feature, almost nothing would have worth, which I take as a reductio of the strict view. Second, the flip side: there are people who do the right thing from a genuinely warm motive but who'd keep doing it even if the good were entirely absent, and those look to me like cases where worth leaks out.

  Stay in character until I say stop, keep it to a paragraph or two a turn, argue rather than summarize, and dont prop anything up with citations — if the position has a resource, use the resource.

  Here's my objection, and it's the one I'm scared of. A portfolio manager pledges an enormous gift to a malaria charity mainly to impress a client who cares about effective giving. She'd quietly withdraw the pledge if she learned the charity wasn't actually saving anyone — not because of that, but because the client would lose interest. Her motivating reason is counterfactually sensitive to exactly the right-making feature, so on my own view I seem committed to saying the gift has moral worth, which is absurd: that's tracking without caring. I'm giving this as a department talk in three weeks and I'd much rather find the hole myself than have it found from the floor. Answer that.
reasoning: |-
  Okay, the user is working on a philosophy paper about moral worth and needs help defending their core claim against a specific objection. Their main argument is that an action has moral worth if the agent's motivating reason is counterfactually sensitive to the right-making feature, even if they don't consciously recognize that feature. They've presented a tricky portfolio manager case that seems to challenge this view.

  Hmm, this user is clearly deeply engaged with the philosophical nuances here. They're not just looking for surface-level answers but want to pressure-test their argument in preparation for an academic talk. The portfolio manager example is clever because it creates tension between their criterion (counterfactual sensitivity) and intuitive judgments about moral worth.

  The user's anxiety about this objection is palpable - they mention being "scared" of it and not wanting it exposed during their talk. That suggests they need more than just a logical counterargument; they need one that feels philosophically satisfying and preserves the spirit of their original position. Their emotional stake in this is high.

  Let me break this down carefully. The portfolio manager case has three key elements: 
  1) The action (donating) is objectively right (malaria charity saves lives)
  2) The agent would stop if the right-making feature disappeared (if charity became ineffective)
  3) But the sensitivity comes from instrumental reasons (impressing client) not moral concern

  The user's theory seems committed to calling this morally worthy, which clashes with intuition. My challenge is to defend their position without abandoning its core. 

  I recall their two main weapons: the scarcity result (strict view makes moral worth too rare) and the leakage argument (people with good motives but bad counterfactuals lack worth). Neither directly helps here. I need to find a way to show that the portfolio manager case either (a) doesn't satisfy their criterion properly or (b) isn't counterintuitive after all.

  Perhaps the solution lies in distinguishing between the target of sensitivity. The user's criterion requires sensitivity to the right-making feature itself, but in this case, the manager is only sensitive to the client's perception of that feature. If the charity stopped being effective but the client remained fooled, would she still donate? That might expose the disconnect.

  Alternatively, maybe we can argue that moral worth comes in degrees. The manager's action has some minimal worth via sensitivity, but less than truly virtuous action. But that might concede too much - the user called the intuitive judgment "absurd."

  The most promising angle seems to be tightening the sensitivity requirement: it must be sensitivity to the feature qua right-making, not just contingently. The manager tracks effectiveness only as a sign of client approval, not as valuable in itself. This preserves their core while handling the objection.

  User will probably push back, so I should prepare follow-up arguments about the epistemic transparency of right-making features. But for now, this direct response should give them a solid defense to work with.
answer: |-
  Your objection cuts deep, but it doesn’t sink the ship—it just forces us to tighten the rigging. Let’s dissect your portfolio manager. Yes, her pledge *is* counterfactually sensitive to the malaria charity’s efficacy: if it stops saving lives, she withdraws. But your view smuggles in a hidden premise—that *any* sensitivity to the right-making feature (here, saving lives) automatically satisfies the "answerable to" condition. That’s too loose. My core claim isn’t just about *tracking* the feature; it’s about *whether her motivating reason is constitutively responsive to the feature’s normative force*, even if she doesn’t articulate it.  

  Her reason isn’t "this charity saves lives, and saving lives matters." Her reason is "this charity impresses Client X, and Client X cares about efficacy." The right-making feature (saving lives) is merely a *proxy* for her actual goal: social capital. She’s sensitive to efficacy only insofar as it signals client approval. If the charity stopped saving lives *but the client remained fooled*, she’d still donate! Her reason isn’t answerable to the *good itself*; it’s answerable to the *client’s perception* of the good. The counterfactual sensitivity you note is *incidental*—it’s collateral damage from tracking the client’s values, not hers.  

  This exposes the flaw in treating "would she stop if the feature vanished?" as a standalone test. We must ask: *Why* would she stop? If the answer reveals her reason reduces the right-making feature to a mere instrument for an alien aim—like status—then her action lacks moral worth. Worth requires that the feature’s *normative presence* (not just its empirical presence) anchors her motivation. She acts *because* the act is life-saving, even if she’d describe it as "what Client X respects." But if her psyche treats the good as fungible—replaceable by anything that impresses the client—then the good isn’t actually guiding her; it’s being used.  

  So no, I’m not committed to granting her gift moral worth. The sensitivity is real but parasitic. Your case is tracking *without normative grip*—exactly why worth "leaks out."  

  *Your move. Sharpen the case: what if she* knows *efficacy matters morally but still acts for status? Does my "why" test hold?*
