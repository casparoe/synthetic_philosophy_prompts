  For the draft, I'll start each stanza with the excluded day (Friday first, per reverse elimination) but let the end words resurrect eliminated days in new permutations. The envoi will focus on the premise undermining itself—"the riddle swallows its tail" keeps it open-ended. Voice should feel like a student's internal monologue: urgent, slightly desperate. 

  Biggest risk is making it too abstract. Need concrete images ("clock," "calendar," "locked door") to ground the logic. The "surprise" end word must shift meanings: from exam shock to logical contradiction to existential unease. Final stanza's image of a door that "won't stay closed" hopefully nails that circular tension.
answer: |-
  ## Sestina for the Hanging (Or the Exam Unseen)

  The teacher said: *Before Friday* it will fall,
  A consequence you cannot see in time,
  A sudden shock, a true and sharp **surprise**.
  We scanned the week, its measured, certain span:
  First **Monday**, open; then the turn to **Tuesday**;
  **Wednesday**’s pivot; **Thursday**’s deepening hue;
  And finally, the stark, concluding **Friday**.

  But logic stirs. Consider final **Friday**:
  If all prior days pass without the fall,
  Then expectation gathers, dense and blue
  On **Thursday** night. Where else could lie surprise?
  The blow, foreseen, negates the promised span.
  So Friday cannot hold the lurking **surprise**.

  We strike it out. Now focus on **Thursday**.
  If **Monday**, **Tuesday**, **Wednesday** show no fall,
  Then **Thursday** stands exposed. Where hides **surprise**
  When only two days anchor the week's span?
  The trap seems sprung before the final **Friday**.
  The known path narrows towards **Thursday**'s due.

  Eliminate **Thursday**. Now turn to **Wednesday**.
  If **Monday** dawns and passes, blank and free,
  Then **Tuesday** holds the weight. If no fall
  Marks **Tuesday** either, focus shifts anew
  To **Wednesday**. Certainty begins to span
  The gap. Anticipation bleeds **surprise**.

  So **Wednesday** falls. We pivot to **Tuesday**.
  If **Monday** yields no test, no sudden call,
  Then **Tuesday** stands alone within the span,
  The obvious target. Where remains **surprise**
  When only one clear candidate can fall?
  The dread seems fixed long before **Friday**.

  And **Monday**? If the week begins its span
  With nothing, logic points towards **Tuesday**.
  But wait! Our chain, built link by link, must fall.
  We started from the threat of final **Friday**,
  Dismantling backwards, claiming no **surprise**
  Could live on any day within the span.

  The teacher’s word, our necessary span,
  Demands a blow unseen, a true **surprise**.
  Yet tracing back from looming, doomed **Friday**
  Through **Thursday**, **Wednesday**, **Tuesday**, **Monday**'s fall,
  We find each candidate must be denied.
  The premise crumbles where we thought to stand.

  This is the knot: the sentence feeds the span
  That kills it. Logic’s path ensures no **surprise**
  Can land on **Monday**, **Tuesday**, **Wednesday**, **Thursday**, **Friday**.
  We used the threat to prove the threat must fall.
  The riddle swallows its tail, strand by strand.
  The door swings shut, yet won’t stay closed. The clock
  Stands still, yet ticks. The trap is always set. Look—nothing falls.
