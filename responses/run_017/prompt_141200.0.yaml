  Hmm, the key challenge is making the poetic form serve the logical argument. The elimination logic must run backwards—starting from Friday being impossible as the "last day," then Thursday inheriting the problem, and so on. But the sestina's word rotation ensures no day is ever truly eliminated, mirroring how the premise self-destructs. 

