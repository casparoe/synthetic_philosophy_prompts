prompt: |-
  Hey — I'm on the program committee for a small academic society (seven of us, we meet four times a year, and we somehow always end up arguing about procedure). We mostly decide two kinds of things: which submissions to accept given a rough capacity limit, and a big pile of low-stakes housekeeping motions where the status quo wins if nothing passes. Right now we use plain plurality with the chair breaking ties, everyone hates it, so we've agreed to pick a new rule — and this is the part I keep going back and forth on — we've also agreed to re-open the choice of rule every two years, using whatever rule is currently in force to decide whether to change it. I've been reading about Arrow's theorem and Gibbard–Satterthwaite and I think I get the headline: no ranked-ballot rule gives you unrestricted domain, Pareto, independence of irrelevant alternatives and non-dictatorship all at once, and any non-dictatorial rule with three or more possible outcomes is manipulable somewhere. I also get the standard move that cardinal methods like approval and score aren't really in the theorem's crosshairs because they ask voters for more than a ranking — though a friend of mine who does mechanism design says that just relocates the problem, since you then need interpersonal comparisons of intensity, and Harsanyi-style aggregation only works if you can actually put people's utilities on a common scale, which we definitely can't for a room of seven tired professors.

  What I actually want from you is a ranked tier list. Please sort these — plurality, instant-runoff, Borda, a Condorcet/Schulze-type method, approval voting, score voting (0–5), random dictatorship (one randomly drawn member's ballot decides each motion), and a sociocracy-ish consent rule where a motion passes unless someone formally objects — into tiers by how good they'd be for a committee like ours, and give each a 0–100 score plus a sentence on why it lands there. Judge them on the things that actually bite for us: how often they'd pick something most of us really prefer, how badly they degrade once people start voting strategically instead of sincerely, how easy they are to explain and hand-count at 6pm, how exposed they are to whoever sets the agenda or the order of motions, and how they handle the fact that most of our votes are near-unanimous ratifications of a status quo rather than real contests.

  Then the bit I can't get straight, and which matters more to me than the list itself: the meta-level. Our ranking of the rules is itself a collective choice among more than two options, made by voters whose preferences over the rules are vague, unstable and partly strategic — so by Arrow's own logic, shouldn't we expect that ranking to be exactly as impossible to do well as any other? Does the impossibility eat itself, or is choosing a rule relevantly different from choosing an outcome, e.g. because we choose it rarely, behind a partial veil of ignorance about which proposals we'll face later, or because it's the kind of choice where we'd happily accept randomness in a way we wouldn't for an actual decision? And then concretely: if we re-vote on the rule every two years under the rule itself, which of your top-tier rules has a stable fixed point, i.e. would it ever vote to replace itself with something lower on your list? Is a rule's tendency to preserve itself a point in its favour or an argument against it?
reasoning: |-
  Okay, let me unpack this complex committee voting problem. The user is part of a small academic committee struggling with voting procedures, and they've presented a multifaceted challenge that blends practical implementation concerns with deep theoretical voting theory questions.

  First, I need to grasp their actual context: seven members, bimodal decision types (accept/reject submissions with capacity limits + low-stakes housekeeping), current dissatisfaction with plurality voting, and this fascinating meta-layer where they'll revisit the voting rule itself every two years using whatever rule is current. The user clearly has solid theoretical grounding - they reference Arrow, Gibbard-Satterthwaite, and Harsanyi correctly - but needs help translating theory to practice.

  The core request is a tiered evaluation of specific voting methods against their operational needs. But the more interesting puzzle is the meta-question about whether choosing a voting rule suffers from the same impossibilities as regular decisions, and whether any rule would stably maintain itself under their revision system.

  For the tier list, I'll weigh these factors:
  - Robustness to strategic voting (critical given their history of arguments)
  - Handling status-quo bias (most votes are rubber-stamps)
  - Resistance to agenda manipulation
  - Simplicity for hand-counting
  - Performance with near-unanimous vs contested decisions

  The meta-problem is thornier. Arrow's theorem formally applies to any aggregation of preferences over three+ alternatives, so yes, choosing a voting rule is equally "impossible" in theory. But in practice, the veil of ignorance effect matters - when choosing rules, members don't know which future proposals will benefit them, leading to more impartiality. Randomness might be more acceptable here too since it's procedural rather than substantive.

  For stability under self-application:
  - Consent-based rules likely emerge as fixed points because they're hard to dislodge without consensus
  - Condorcet methods have strong theoretical properties but may be vulnerable to strategic replacement attempts
  - Approval could self-sustain due to simplicity and centrism
  - Score voting might be targeted for replacement due to manipulability concerns

  The user's awareness that rule-preservation could be a bug (entrenching suboptimal systems) or feature (stability) shows sophisticated thinking. I should acknowledge this duality - stability is good if the rule works well, bad if it doesn't.

  I'll structure the response by:
  1. Directly answering the tier list request with concrete ratings
  2. Addressing the meta-questions about impossibility theorems applying to themselves
  3. Analyzing stability under self-application for each top-tier method
  4. Highlighting that their "re-vote every two years" system is actually a clever mechanism for maintaining legitimacy through revisability
answer: |-
  Below is a tiered analysis of voting rules for your committee, followed by a breakdown of the meta-level questions. I've scored each rule (0–100) based on your criteria: **satisfaction with outcomes, robustness to strategy, simplicity, agenda resistance, and handling near-unanimous "status quo" votes**. The tier list prioritizes *practical performance in small committees* over theoretical ideals.

  ---

  ### **Tier List & Ratings**
  **S-Tier (Ideal Solutions)**  
  1. **Approval Voting (Score: 95)**  
     Voters approve/reject each option; most approvals wins.  
     *Why*: Handles status quo bias perfectly (explicit vote to keep/change), strategy-resistant in small groups, trivial to hand-count, no agenda effects. Excels when most votes are uncontested (e.g., "approve all non-objectionable motions").  

  2. **Consent Rule (Sociocracy-Style) (Score: 90)**  
     Motion passes unless a formal objection is raised (no objection = consent).  
     *Why*: Tailor-made for low-stakes housekeeping—preserves status quo efficiently while allowing vetoes for serious concerns. Minimal voting effort, no counting needed for uncontested items. Weak only for contentious debates.  

  **A-Tier (Strong Contenders)**  
  3. **Condorcet/Schulze Method (Score: 85)**  
     Elects the option beating all others in pairwise comparisons.  
     *Why*: Picks broadly acceptable outcomes, resists agenda manipulation, handles rankings well. But: complex hand-counts (tedious for 7 voters), and strategic ranking can distort results.  

  4. **Instant-Runoff Voting (IRV) (Score: 75)**  
     Ranks options; eliminates least-popular and redistributes until majority.  
     *Why*: Better than plurality for polarized choices, decent status quo handling (if ranked last). However, vulnerable to "center-squeeze" strategy and agenda order (e.g., elimination sequence matters).  

  **B-Tier (Flawed but Viable)**  
  5. **Random Dictatorship (Score: 65)**  
     Randomly selects one voter’s ballot as the decision.  
     *Why*: Unbeatable simplicity and strategy-proof (no incentive to lie). But outcomes feel arbitrary, fails Pareto (may ignore strong preferences), and stumbles on status quo (one objector can force change).  

  **C-Tier (Problematic)**  
  6. **Score Voting (0–5) (Score: 50)**  
     Rates options on a numerical scale; highest average wins.  
     *Why*: Sensitive to preference intensity *in theory*, but in practice: strategic rating (e.g., min/max scores), interpersonal comparisons muddy, and status quo bias unclear. Hand-counting scales is messy.  

  7. **Borda Count (Score: 40)**  
     Ranks options; points assigned by position (e.g., 1st=3pts, 2nd=2pts, etc.).  
     *Why*: Easily manipulated via "burying" rivals, agenda-dependent (adding options changes scores), and overcomplicates near-unanimous votes. Goodwill falters fast.  

  **D-Tier (Avoid)**  
  8. **Plurality (Score: 20)**  
     Most top-choice votes wins.  
     *Why*: The status quo—fragile to vote-splitting, ignores preferences beyond top choice, exacerbates arguments. Fails all your criteria except simplicity.  

  ---

  ### **The Meta-Level: Impossibility, Stability, and Self-Application**
  **1. Does Arrow’s impossibility apply to choosing voting rules?**  
  Yes—but **less severely** in practice. Theorems assume unrestricted preferences, but your context has mitigating factors:  
  - **Veil of ignorance**: Committee members don’t know future proposals, incentivizing impartial rules.  
  - **Stability over time**: Rules are chosen rarely, reducing opportunities for manipulation.  
  - **Acceptance of randomness**: Committees tolerate procedural randomness (e.g., random dictator) more than substantive arbitrariness.  
  - **Meta-preferences may align**: Members likely agree on core goals (e.g., "minimize arguments"), making intransitivity less likely.  

  **2. Stability under self-application (will a rule replace itself?)**  
  - **Approval Voting**: **Stable**. Favors centrist, broadly acceptable rules. Unlikely to switch to polarizing methods (e.g., plurality).  
  - **Consent Rule**: **Highly stable**. Changing the rule requires an objection—hard to justify without consensus.  
  - **Condorcet/Schulze**: **Conditionally stable**. If members agree on "fairness," it holds; but strategic voters may push to replace it with approval/consent.  
  - **IRV/Plurality**: **Unstable**. Both vulnerable to strategic replacement (e.g., IRV might be overturned by approval in a head-to-head vote).  

  **3. Is self-preservation a virtue or a vice?**  
  - **Virtue** if the rule works well (e.g., approval/consent): Stability reduces procedural chaos.  
  - **Vice** if the rule is flawed (e.g., plurality): Entrenchment prevents improvement.  
  *Your best picks (approval/consent) are stable **because** they perform well—not due to artifice.*  

  ---

  ### **Recommendation**
  Adopt **Approval Voting** for substantive decisions (e.g., paper selection) and the **Consent Rule** for housekeeping motions. This hybrid leverages simplicity and strategy-resistance where needed, while respecting your committee’s bias toward the status quo. Approval’s stability under self-review ensures longevity, and consent handles 90% of votes with near-zero effort.  

  **Why this avoids the impossibility trap**:  
  - Approval escapes Arrow/Gibbard-Satterthwaite by using cardinal ballots (no rankings to manipulate).  
  - Consent operates outside traditional voting—objections are rare, making "preference aggregation" irrelevant.  
  - Re-voting on rules every 2 years under approval ensures the system self-corrects without chaos.  

  If forced to pick one rule: **Approval** (95) is marginally more versatile for contested decisions.
