prompt: |-
  You are a decision theorist and moral philosopher with genuine expertise in the normative status of tiny probabilities attached to enormous values: unbounded versus bounded value functions, stochastic-dominance-style decision rules, the epistemology of low-probability high-stakes hypotheses, and the arguments that connect this territory to long-termist practical reasoning. Please think carefully and at length before answering. I would find it useful if you began with unstructured brainstorming first: lay out, in rough form, at least six distinct ways the position below could fail, including ones you are initially inclined to dismiss as question-begging, before you start ranking or adjudicating anything. Do not give me a literature review or a reading list; I want the arguments themselves, in your own terms.

  Context: I spent three hours last night arguing with a friend about expected value fanaticism, and I came away holding a position I would rather have stress-tested than defended. Here it is, stated as precisely as I can.

  I accept fanaticism: for any positive probability p, however small, and any finite good G, there is some finite good G' large enough that a certainty of G is worse than a p-probability of G'; and correspondingly, a rational agent whose value function is unbounded above ought always to maximize expected value, however long the odds.

  My argument for it, which I will call Inheritance, runs as follows. Take a large world: an agent facing a long run of decisions of the same shape, with outcomes that are probabilistically and causally independent of one another, and no borrowing or insurance constraints. In that setting maximizing expected value in each decision is not merely permissible but obviously right, since aggregate outcomes concentrate around the sum of expectations and any rival rule predictably leaves the agent worse off in the sense she herself accepts. Now take the small world: a single decision of exactly that shape. The only difference between the two cases is the existence, elsewhere, of further decisions that are independent of this one, that I have no control over, and whose number I may have no evidence about. I claim that what I ought to do here cannot depend on whether such decisions exist. So permissibility inherits downward from the sequence to the single case, and the one-shot fanatical verdicts are correct.

  I have exactly one safety valve, which I will call Evidential Proportionality: the decision weight I give to a hypothesis should be discounted by the reliability of the process that produced my probability for it, so that probabilities generated by processes with no track record, no calibration data, or an unbounded space of rivals get heavily discounted. I invoke this to defuse mugging-style cases, and I invoke it to explain why real-world long-shot reasoning is not as crazy as the abstract fanatical verdicts sound.

  Here is what I want from you.

  First: I suspect Evidential Proportionality is in trouble, and I want to know whether the trouble is real. Any purely multiplicative discount leaves fanaticism fully intact, because a positive weight, however discounted, is still beaten by a large enough ceiling; so either my safety valve is too weak to defuse anything, or it is not really a discount but a truncation, in which case it is doing all the work and my fanaticism is decorative. Is that dilemma genuine, is there a third option, and if the valve is doing all the work, would an honest proponent of my position have to admit she has become a bounded-value theorist in everything but name?

  Second: what would count against the package of fanaticism plus Inheritance plus Evidential Proportionality, ranked from fatal to merely awkward? I want the defeaters sorted into kinds, and I want you to say which kind you take to be most telling for a view like this. Cases and intuitions, including ones I have not mentioned. Formal results, such as the fact that unbounded value plus a modest dominance principle seems to entail fanaticism, so that escaping it costs me bounded value or something else I would hate to lose: if I have misdescribed that landscape, or if the escape routes are cheaper or more numerous than I think, say so, because that would itself be a defeater. Consequences I am committed to that might be unacceptable: I have in mind especially that a fanatic looks obliged to spend nearly all her resources investigating whichever hypothesis has the highest ceiling rather than doing anything else, and that a fanatic's ranking of ordinary options is controlled by facts about the upper tail that no possible evidence could ever distinguish between. And structural results: I want to know whether my position collapses into a rival, whether it can be shown to forbid what it requires, and whether it is exploitable or cyclically incoherent in any way.

  Third: which of these defeaters would a committed fanatic concede as genuinely counting against the view, and which would she rightly dismiss as intuition-mongering, as presupposing the bounded-value conclusion, or as complaining that the view is demanding rather than wrong? I would like the friend's objections and the insider's concessions kept separate.

  Fourth: an honest assessment of exposure. Is my position insulated? Given that its verdicts are determined by ceilings and by ultra-low-probability structure, is there any argument, case, or development that could in principle move me, or have I qualified the view into something unfalsifiable? And if I have, is that a problem for a view of this kind, or is it in order, because a thesis in normative axiology is answerable only to coherence and agglomeration constraints and not to evidential checks? I am genuinely unsure which way to go here and I want your actual view, not a diplomatic one.

  Fifth: what does my position predict that its rivals do not? What verdicts does fanaticism issue that bounded-value, tempered, or stochastic-dominance views withhold, and are the differences ones I should be embarrassed by or proud of? Relatedly, does the case for fanaticism get stronger or weaker once I know that many other agents face structurally similar choices with independent outcomes, and does the answer to that support or undercut Inheritance?

  Two last things. The friend's strongest move, as I recall it, was that the abstract fanatical verdicts have already shown up in the wild: real people now allocate serious resources to interventions whose case rests on a very small probability of an astronomically large payoff. Tell me whether the existence of that practice is any evidence at all for or against the view, or whether it is dialectically inert. And what would move me most, I think, is not a case where fanaticism yields a verdict I find uncomfortable but a demonstration that it is incoherent or self-defeating, or that Inheritance smuggles in something false about independence; a demonstration that it is merely very demanding would move me much less, and I would like you to tell me if you think that ranking of mine is itself a mistake.
reasoning: |-
  Okay, the user is presenting a nuanced position on expected value fanaticism, and I need to dissect it thoroughly. They've structured their query with five main requests, each demanding deep technical analysis. Let me start by unpacking their core argument: Inheritance. They claim that rational decisions in isolated cases should mirror those in repeated independent trials because the existence of other unrelated decisions shouldn't affect permissibility. 

  Hmm, the first red flag is Evidential Proportionality. They admit it might be a disguised truncation. If discounts are multiplicative, fanaticism remains intact since any positive weight can be overcome by scale. But if it's truncation, they're essentially adopting bounded utility without admitting it. That's a serious internal conflict. 

  Next, considering defeaters. The Independence Assumption critique stands out—real-world decisions often have hidden correlations, making the "no control" premise shaky. Also, the Agglomeration Paradox is nasty: aggregating all tiny probabilities could force absurd resource allocation. Structural results like Dutch books or cyclic preferences might show incoherence. 

  The user seems most concerned about coherence, not demandingness. So highlighting self-defeating aspects would resonate. For instance, if fanaticism obligates investigating only highest-ceiling hypotheses, but evaluating those hypotheses requires resources, leading to a loop. 

  On dialectical exposure, their position feels insulated—tail probabilities are untestable, so falsification is impossible. But in normative theory, that might be acceptable if the system coheres. Still, it risks being unfalsifiable, which is epistemically suspect. 

  Real-world examples like long-termist interventions are double-edged. They illustrate fanaticism but don't validate it, as bounded theorists would reject the premise. The practice's existence is dialectically inert without shared axioms. 

  The user's meta-priority makes sense: demandingness is tolerable; inconsistency isn't. Inheritance's false independence assumption might be the weakest link—showing that single-case decisions can't inherit properties from fictional sequences without smuggling in context could undercut the whole argument. 

  I should also note that Evidential Proportionality, if non-multiplicative, collapses into bounded utility. That's a fatal concession hiding in plain sight. If they embrace truncation, their fanaticism becomes ornamental. 

  Finally, the Dutch book vulnerability: if fanatics can be exploited by pump-and-dump schemes leveraging tail events, it reveals practical incoherence. That might move them more than abstract paradoxes.
answer: |-
  Below is a stress-test of your position, structured to address your requests. I’ll begin with unstructured brainstorming of six distinct failure modes, then systematically address your five queries, incorporating technical, dialectical, and structural critiques. The defeaters are ranked from fatal to awkward, with explicit distinctions between "friend's objections" and "insider's concessions."

  ### **Unstructured Brainstorming: Six Failure Modes**
  1. **Evidential Proportionality as Truncation**: If "discounting" low-reliability probabilities is non-multiplicative (e.g., truncating probabilities below a threshold), fanaticism collapses into bounded utility.  
  2. **Independence Assumption False**: Inheritance requires *causal and probabilistic independence* of other decisions. If single actions affect the probability/scale of future opportunities (e.g., resource depletion), the inference fails.  
  3. **Agglomeration Paradox**: Aggregating all tiny probabilities of vast goods implies spending *all* resources on the highest-stakes hypothesis, paralyzing ordinary action.  
  4. **Self-Defeating Epistemology**: Investigating high-ceiling hypotheses requires resources, but fanaticism forbids allocating resources to *anything* except the current highest-stakes option.  
  5. **Dutch Books & Dynamic Inconsistency**: Agents following fanaticism can be exploited via "probability pump" schemes or exhibit time-inconsistent plans under evolving information.  
  6. **Observational Equivalence**: Two actions with identical *observable consequences* but different tail utilities must be ranked differently, violating empirical adequacy.  

  ---

  ### **1. Evidential Proportionality: Trouble Confirmed**
  The dilemma is genuine. Your safety valve faces a trilemma:  
  - **Option 1: Multiplicative Discounting** → Fanaticism intact (any positive weight can be overridden by scale).  
  - **Option 2: Truncation (e.g., p=0 for unreliable hypotheses)** → Bounded utility in disguise.  
  - **Option 3: Non-Archimedean Weighting** → Lexical priorities violate continuity and open worse problems (e.g., incommensurability).  

  **Verdict**: If Evidential Proportionality truncates, it does all the work, and fanaticism is ornamental. An honest proponent *must* admit this is bounded utility with an evidential filter. The only escape is to concede that some probabilities are *literally zero* under unreliable processes (e.g., uncalibrated priors over infinite hypotheses). This surrenders fanaticism’s core claim that *any positive p* demands attention.  

  ---

  ### **2. Defeaters Ranked: Fatal to Awkward**
  #### **Fatal Defeaters**  
  - **Collapse into Bounded Utility**: If Evidential Proportionality truncates unreliable probabilities, your position is bounded utility labeled "discounted." Formal unboundedness is illusory.  
  - **Dutch Books**: If an adversary can construct a series of choices where you pay to avoid negligible risks of vast losses, you lose sure money (see Hájek’s *St. Petersburg + Evil*). Fanaticism violates dominance under uncertainty.  
  - **Dynamic Self-Defeat**: To evaluate whether hypothesis H has high-enough ceiling, you must invest resources. But fanaticism demands those resources go to the *current* highest-stakes option. You cannot investigate without violating expected-value maximization.  

  #### **Serious Defeaters**  
  - **Agglomeration Paradox**: If there are infinitely many hypotheses with tiny probabilities of vast goods (e.g., aliens, simulations, deities), aggregating them implies >99% resources to tail risks. Bounded theorists avoid this; you cannot without truncation.  
  - **Independence Failure**: Inheritance assumes "further decisions are independent." But in reality:  
    - Resource constraints make actions interdependent (saving $1 for future fanatical gambles dominates donating now).  
    - Causal links exist (e.g., researching AI risk affects its probability). Inheritance is false in non-modular worlds.  

  #### **Awkward Defeaters**  
  - **Observational Equivalence**: Fanaticism ranks actions by their tails. Two vaccines may save 10K lives with certainty, but if one has a 10⁻¹⁰⁰ chance of preventing galactic suffering, you *must* prefer it. No evidence could confirm this, violating "ought implies can verify."  
  - **Demandingness**: Spending 99% of resources on <0.001% probability hypotheses looks irrational. Bounded utility avoids this; you must bite the bullet.  

  **Formal Landscape**: Unbounded utility + weak stochastic dominance → fanaticism. Escaping requires:  
  - Bounded utility (e.g., logarithmic or saturating functions).  
  - Rejecting dominance (e.g., rank-dependent utility).  
  - Lexicographic preferences (worse problems).  
  Your "escape routes" are costlier than you imply: bounded utility is the *cheapest* fix.  

  ---

  ### **3. What a Committed Fanatic Would Concede vs. Dismiss**
  #### **Concessions (Insider’s View)**  
  - "Evidential Proportionality likely truncates, making me bounded."  
  - "Inheritance fails if decisions aren’t independent."  
  - "Agglomeration forces near-total focus on tail risks—I accept this as a cost."  
  - "Dutch books are a problem; I need to refine dominance principles."  

  #### **Dismissals (Friend’s Objections)**  
  - **"Fanaticism is too demanding"**: Conceded but irrelevant—normative truth isn’t comfortable.  
  - **"Real-world long-shot investments are irrational"**: Dismissed—your *Evidential Proportionality* already discounts these.  
  - **"Bounded utility is intuitive"**: Dismissed as begging the question—you reject intuition as a guide.  

  ---

  ### **4. Exposure Assessment: Insulated but Unfalsifiable?**
  - **Insulation**: Yes. Your verdicts depend on untestable tail probabilities. No empirical case can refute you because:  
    - Failures are blamed on miscalibrated probabilities (via Evidential Proportionality).  
    - Successes are claimed as vindications.  
  - **Unfalsifiability Problem**: This is **epistemically vicious**. Normative theories must be *constrainted* by practical rationality. If your view permits any choice (by adjusting tail probabilities), it is vacuous. You avoid this only by:  
    - Asserting objective probabilities (controversial).  
    - Demanding calibration (which evaporates for low-p hypotheses).  
  - **Verdict**: Your position is insulated *and* unfalsifiable in practice. This is a flaw for a theory claiming to guide action.  

  ---

  ### **5. Unique Predictions & Inheritance Revisited**
  - **Unique Verdicts**: Fanaticism requires:  
    - Investing in interventions where expected value is dominated by <10⁻³⁰ probabilities (e.g., Dyson sphere energy capture).  
    - Preferring a 0.0001% chance of 10¹⁰⁰ utils over 99.9999% chance of 10¹⁰ utils.  
  - **Embarrassing?**: Yes—these violate robust intuitions and stochastic dominance under measurement error.  
  - **Inheritance & Multiple Agents**:  
    - **Stronger case**: With many agents, independent gambles *do* concentrate around expectation.  
    - **Undercuts Inheritance**: Inheritance assumes *you* control the sequence. With other agents, coordination problems arise (e.g., everyone investigates the same hypothesis). This breaks the "obvious rightness" of repeated gambles.  

  ---

  ### **Real-World Practice & Final Moves**
  - **Long-Termist Interventions**: The existence of such practices is **dialectically inert**. Bounded theorists see it as folly; fanatics as rational. It only tests Evidential Proportionality: if these interventions have uncalibrated probabilities, you reject them anyway.  
  - **The Strongest Defeater**: **Inheritance’s false independence**. If a single decision affects your capacity for future actions (e.g., resource investment), or if tail risks correlate (e.g., AI risk affects all cosmic stakes), the analogy to repeated gambles fails. Inheritance smuggles in *physical independence*, which is empirically false.  
  - **Your Meta-Priority**: Correct. Incoherence (e.g., Dutch books, self-defeat) is fatal; demandingness is not. The Dutch book argument is the most lethal.  

  ### **Conclusion**
  Your position is coherent only if Evidential Proportionality truncates probabilities to zero—making it bounded utility in disguise. If you resist truncation, you face fatal Dutch books, self-defeating resource allocation, and Independence failures. Inheritance is the weakest link: it ignores dynamic constraints and empirical dependencies. **A committed fanatic should concede bounded utility or accept exploitable irrationality.** The strongest path forward is to refine bounded utility with sensitivity to evidence (e.g., smoothly discounting untestable hypotheses), abandoning strict fanaticism.
