  We are designing an exercise for a 90-minute session on hindsight bias and narrative fallacy. The exercise must use printed materials only (handouts, index cards, envelopes, pens). The main elements are:
    1. A dossier of 14 dispatches from an invented crisis (e.g., at a trading post, water authority, research station) with:
        - 3 dead ends: leads that seemed important but led nowhere.
        - 2 counter-indications: pointing away from the actual outcome.
    2. The exercise has two phases:
        Phase 1 (Individual): Each student assigns probabilities to 4 candidate outcomes using a quadratic scoring rule (Brier) that rewards honesty.
        Phase 2 (Group): Groups of 4-5 students are given a sealed envelope with an outcome (but note: we are considering a twist) and must write a 150-word explanation of why it had to happen.

    The twist: We are considering two versions:
        Version A: Half the groups get one outcome, half get a different incompatible outcome. Then we reveal that neither was real; the actual outcome was anti-climactic (crisis petered out).
        Version B: All groups get the same false outcome, then we reveal it was false and the real outcome was anti-climactic.

    We want to avoid feeling like a trick. Also, we need measures to quantify narrative smoothness.

    Proposed measures:
        a. Compression ratio: (number of dossier facts) vs (facts cited in explanation) and also facts cited with reversed valence?
        b. Dead-end audit: How many dead ends were dropped? How many were retro-fitted into causes?
        c. Counterfactual gradient: Rate branch points for closeness to going the other way, before and after.

    We must write:
        - Full dossier (14 items) with notes on dead ends, counter-indicators, and an honest forecast.
        - Rules, scoring rule, credit conversion.
        - Timeline (minute-by-minute).
        - Debrief: mapping exercise moments to concepts (hindsight bias, narrative fallacy) and what students should realize.
        - Predictable problems and how to handle them.
        - What the exercise cannot capture (e.g., archival filtering).

