        - Note the compression: they used only a subset of the facts. Real history is the same: we select from the archive.
        - But also note: the archive itself is incomplete. We only have these 14 dispatches, but in reality, many more events occurred that were not recorded, and many records were lost. So the filtering happens at two levels: the record and the historian.

