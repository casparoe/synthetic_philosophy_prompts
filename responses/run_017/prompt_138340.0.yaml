answer: |-
  ### Exercise Design: "The Veridian Standoff"  
  **Setting:** A chartered trading post (East Veridia Company) on a fictional island. Crisis: Conflict over charter renewal amid financial strain, theft, illness, storms, and local tensions.  

  ---

  ### **Dossier: 14 Dispatches**  
  *(Dead ends: †; Counter-indicators: ‡)*  
  1. **Day 1:** *Company ship "Prosperity" arrives. New agent, Mr. Alder, orders cost review amid charter renewal talks.*  
  2. **Day 3:** *Chief Kaelen demands revised trade terms, threatens blockade if ignored.*  
  3. **Day 5:** **†** *Alder discovers missing luxury furs; launches theft inquiry.* (Dead end: Inquiry fizzles; minor clerk fired, no larger impact.)  
  4. **Day 7:** **‡** *Alder’s report to Board: "Shut down post unless costs drop 30% and unrest ends."* (Counter-indicator: Points to decisive action.)  
  5. **Day 10:** **†** *Alder collapses with fever; surgeon suspects contagion. Operations halt.* (Dead end: He recovers fully by Day 18.)  
  6. **Day 12:** *Islanders protest at gates; demand immediate negotiations.*  
  7. **Day 15:** **‡** *Board replies: "Envoy Sir Edward arriving in 3 weeks to decide renewal."* (Counter-indicator: Implies imminent resolution.)  
  8. **Day 18:** *Alder recovers; writes new report: "Renewal possible with minor concessions."*  
  9. **Day 20:** **†** *Storm wrecks warehouse and ship. Repairs begun; trade suspended.* (Dead end: Repaired by Day 35; no long-term effect.)  
  10. **Day 22:** *Clerk Finch caught stealing; dismissed and shipped out.*  
  11. **Day 25:** *Kaelen’s ultimatum: "Meet demands in 7 days or face blockade."*  
  12. **Day 28:** *Alder learns Sir Edward’s ship is delayed by storms; arrival uncertain.*  
  13. **Day 30:** *Alder and Kaelen agree to truce; await Sir Edward.*  
  14. **Day 35:** *Warehouse repairs done. Trade resumes weakly. No further updates.*  

  **Private Notes:**  
  - **Dead ends (3):** Items 3, 5, 9 (seem critical but resolve inconsequentially).  
  - **Counter-indicators (2):** Items 4, 7 (suggest decisive change is inevitable).  
  - **Honest forecast distribution (pre-reveal):**  
    - Outcome A (Renewal, favorable terms): 25%  
    - Outcome B (Shutdown): 25%  
    - Outcome C (Renewal, strict oversight): 25%  
    - Outcome D (Takeover by islanders): 25%  
    *Rationale: Dossier balances tensions (e.g., ultimatums) with stabilizing events (truce, repairs). No single item dictates an outcome; high uncertainty is rational.*  

  ---

  ### **Rules & Scoring**  
  **Phase 1: Individual Forecast (20 mins)**  
  - Students assign probabilities to **4 outcomes** (summing to 100%):  
    > **A:** Charter renewed on trader-friendly terms.  
    > **B:** Post shut down.  
    > **C:** Charter renewed with strict oversight.  
    > **D:** Islanders seize control.  
  - **Scoring rule:** Brier score. For outcome \(i\) with forecast probability \(p_i\):  
    \[
    \text{Brier score} = \frac{1}{4} \sum_{i=1}^{4} (p_i - a_i)^2  
    \]  
    where \(a_i = 1\) if \(i\) is true, else \(0\).  
  - **Credit conversion:** Max 3 seminar credits for best calibration (lowest score). Scores converted linearly:  
    - Best score in class = 3 credits  
    - Worst score = 1 credit (all receive at least participation credit).  
    *Note: True outcome (E) is hidden; scores calculated assuming one of A–D occurred. After reveal, explain this incentivized honest uncertainty despite E’s absence.*  

  **Phase 2: Group Explanation (30 mins)**  
  - Groups of 4–5 receive a **sealed envelope** with a **false outcome**:  
    - Half get **B (Shutdown)**.  
    - Half get **D (Takeover)**.  
  - Task: Write a **150-word explanation** for why this outcome was *inevitable*, using dossier evidence.  
  - **Twist rationale:** Forces groups to rationalize a false climax, exposing narrative pressure.  

  **Reveal & Audit (15 mins)**  
  - Reveal **true outcome E:** *"Crisis faded. Charter never renewed; post operated under old terms indefinitely. Sir Edward’s ship vanished; tensions cooled."*  
  - Distribute **audit worksheet** to measure narrative distortion:  
    1. **Compression ratio:** (Facts cited / 14 dossier facts). *High ratio = cherry-picking.*  
    2. **Dead-end audit:** For each dead end (3 total):  
       - 0 = Ignored.  
       - 1 = Cited but not a cause.  
       - 2 = Cited as causal.  
    3. **Counter-indicator usage:** For each counter-indicator (2 total):  
       - 0 = Ignored.  
       - 1 = Cited as supporting false outcome.  
  - Groups self-score audits; discuss patterns.  

  ---

  ### **Timeline (90 mins)**  
  - **0–5 mins:** Introduce crisis. Distribute dossiers.  
  - **5–25 mins:** **Phase 1.** Students read, write forecasts. Collect sheets.  
  - **25–30 mins:** Form groups. Distribute outcome envelopes (B or D).  
  - **30–55 mins:** **Phase 2.** Groups write explanations.  
  - **55–60 mins:** Collect explanations. Reveal **true outcome E.**  
  - **60–70 mins:** Distribute audit worksheets. Groups compute ratios.  
  - **70–80 mins:** **Debrief:** Return forecasts. Contrast recalled vs. actual uncertainty (hindsight bias). Share audit results (narrative fallacy).  
  - **80–90 mins:** Name concepts, discuss real-history parallels.  

  ---

  ### **Debrief Guide**  
  - **Hindsight bias:**  
    - *Trigger:* Comparing recalled vs. written forecasts. Students will claim "I knew E was likely."  
    - *Reveal:* Show actual forecasts (e.g., 25% for B/D). Ask: *"Why did uncertainty feel smaller in hindsight?"*  
  - **Narrative fallacy:**  
    - *Trigger:* Group explanations for B/D.  
    - *Reveal:* Audit results. Typical patterns:  
      - Low compression ratio (avg. 5/14 facts cited).  
      - Dead ends retrofitted as causes (e.g., "Storm caused shutdown").  
      - Counter-indicators overused (e.g., "Envoy’s delay *proves* takeover was inevitable").  
    - Ask: *"Why did chaos feel like a plotted story?"*  
  - **Key insight:** Outcomes feel inevitable only *after* we know them. Historians impose agency/turning points on conjunctural chaos.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"It was all chance; no explanation!"**  
     - *Fix:* "Even chance events need contextualizing. Explain *why* chaos dominated." Award credit for engaging.  
  2. **Guessing the twist:**  
     - *Fix:* If groups suspect E, say: *"Assume your envelope’s outcome is real. Your job is to explain it."* Post-reveal, discuss why E felt "unsatisfying."  
  3. **Time shortages:**  
     - *Fix:* Trim dossier reading (summarize key events aloud). Enforce strict timers.  
  4. **Audit confusion:**  
     - *Fix:* Provide a completed example (e.g., "Dead end: Storm. Cited as cause? ✓").  
  5. **Frustration with "trick":**  
     - *Fix:* Emphasize: *"This isn’t about ‘winning.’ It’s about feeling how history gets smoothed in retelling."*  

  ---

  ### **Limitation & Mitigation**  
  - **Cannot reproduce archival filtering:** The dossier is "complete," but real archives are fragmented by survival bias and recorder subjectivity.  
  - **Mitigation:** In debrief, note: *"We gave you all 14 dispatches. Real historians work with gaps, burning libraries, and silences. That *adds* another layer of distortion."*  

