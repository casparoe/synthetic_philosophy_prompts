        Half the groups get: "Outcome D: The post is taken over by the local islanders."

    Real outcome: E: The charter was never renewed, but the post continued operating under the old charter. Sir Edward's ship was lost at sea (or delayed indefinitely), and the crisis simply faded. The post continued for years without a renewed charter.

    Rules:

        Phase1 (Individual):
