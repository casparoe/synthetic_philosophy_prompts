prompt: |-
  I'm a fifth-year PhD student in machine learning, and I've been asked to run a single ninety-minute session for the incoming cohort of our department's safety reading group. The students are first- and second-years: they have taken graduate-level ML, they are comfortable with generalization bounds and with the idea of a distribution, and none of them has any background in risk analysis, formal verification, or decision theory. Two of them come out of a formal methods group and arrive convinced that a guarantee that is not worst-case is not really a guarantee; several others do interpretability work and believe that interpretability is what upgrades average-case evidence into something stronger. The session has to leave the room able to look at a proposed alignment technique and say what kind of guarantee it offers, over what, and what that guarantee would license someone to do.

  I want you to plan how I should teach the worst-case / average-case distinction — not explain it to me. I have the distinction. What I need is the architecture of the session: what has to be in place before what, which single case carries it, which wrong pictures the students will build and at which point in the sequence each one has to be blocked, and how I'll know at the end whether it landed.

  Specifically:

  1. The dependency structure, with reasons. My instinct is that "average-case" cannot be introduced before the students have a grip on what a guarantee is *for* — what an agent is entitled to do or claim on the strength of one — but I am genuinely unsure about the rest of the order. Should the idea of a threat model come before or after the move from "holds for all inputs" to "holds with high probability over inputs"? Does introducing the worst-case/average-case contrast inside a familiar PAC-style or minimax frame help at this level, or does it smuggle in an assumption about who chooses the distribution that I will spend the rest of the session dismantling? Tell me what breaks under each ordering.

  2. One example that carries the whole ninety minutes, with an account of why it works. My constraints on it: it must admit both a worst-case and an average-case formulation of *the same target claim*, so that the two are visibly rival versions of one assertion rather than two different topics; it must have a failure mode that is rare but systematically correlated with conditions that matter, so the tail is structure rather than noise; it must be stateable without appealing to deception, evaluation-awareness, or a catastrophe scenario, because I want them doing conceptual work rather than arguing about doom; and it must not be a trolley problem. If my constraints are jointly unsatisfiable, say which one to drop and what that costs.

  3. The misconception map, in the order the misconceptions will actually form, each one located at a point in the sequence rather than listed. Here is my guess at the list — correct it where it is wrong or missing: that average-case is just worst-case weakened, and so a confession of failure; that worst-case is average-case under a pessimistic prior; that if worst-case is unattainable then one has no guarantee at all; that "average" means average over the training distribution, and that deployment shift is a separate later worry; and that the tail is an add-on to be bolted on after the average has been secured, rather than part of what the average is an average of. I also want to know which of these the *sequence itself* will manufacture — which wrong pictures are artifacts of the order I chose rather than things the students walked in with — because those are the ones I will not see coming.

  4. Two complications I want faced structurally rather than appended as caveats at the end. First: in the cases that matter, the distribution in an average-case guarantee is one the defender neither chose nor can sample, so the guarantee can be unfalsifiable in a way a worst-case guarantee is not, and I want the students to feel that as a feature of the epistemology of average-case claims rather than as a footnote about data. Second: a system can come to satisfy an average-case guarantee partly by being sensitive to the fact that it is being assessed, so the guarantee can degrade under optimization against it. Where in the sequence does each of these have to enter for it to look like part of the structure of the distinction rather than a known limitation of AI in particular?

  5. Where the two factions get engaged. The formal methods students and the interpretability students each have a picture that the clean version of the distinction, left to itself, will seem to settle in their favor. I want to know whether to engage them before the distinction is on the table, immediately after, or at the end, and what engaging them should consist of — I am willing to spend ten minutes on this, not thirty, and I would rather name the disagreement as a live research question than fake a resolution.

  6. A check for understanding: one question I can put on the board in the last ten minutes, such that the *wrong* answers are diagnostically distinct — that is, I can tell from an answer which of the misconceptions above it came from. Give me the question, the two or three wrong answers I should expect, and what each one tells me.

  7. What I should explicitly refuse to explain at this level, and in what words I should say so, so that the refusal reads as a decision about scope and not as an evasion.

  Please write your answer in American English.
reasoning: |-
  We are designing a single 90-minute session for first- and second-year ML PhD students with a background in ML (including generalization bounds) but no prior risk analysis, formal verification, or decision theory. The goal is to teach the worst-case/average-case distinction in a way that enables them to analyze alignment techniques by identifying the type of guarantee (and its implications).

  The session must address:
  1. The dependency structure (order of concepts) with reasons.
  2. One central example that meets specific constraints.
  3. A misconception map (order of misconceptions and when they form).
  4. Two complications integrated into the structure: (a) the defender doesn't choose the distribution, and (b) optimization against the guarantee can degrade it.
  5. Engaging two factions (formal methods and interpretability) in 10 minutes.
  6. A check for understanding with diagnostically distinct wrong answers.
  7. What to explicitly omit and how.

  ---

  ### 1. Dependency Structure (Order of Concepts) with Reasons

  **Overall Goal Order:** 
  1. **Guarantees and their purpose** (why we need them) → 
  2. **Threat model** (what is being guaranteed against) → 
  3. **Worst-case guarantee** (as a baseline) → 
  4. **Average-case guarantee** (as an alternative) → 
  5. **Contrast and trade-offs** (including complications).

  **Detailed Sequence with Justification:**

  - **(0-10 min) Start with the purpose of a guarantee.**
    - Why: Without understanding what a guarantee is for (what it licenses you to do), the rest is abstract. We must ground in the agent's perspective: what actions can you take based on the guarantee?
    - Example: If a system has a guarantee of 99% accuracy, you might deploy it in a non-safety-critical setting, but not for medical diagnosis. If it has a worst-case guarantee of never failing, you might use it in life-or-death situations.
    - **Key:** Guarantees are for decision-making under uncertainty.

  - **(10-25 min) Introduce threat model.**
    - Why: The threat model defines the adversary (or environment) we are protecting against. It sets the stage for what "case" we are talking about.
    - Example: In security, a threat model might be an attacker who can manipulate inputs. In ML, it might be distribution shift or adversarial examples.
    - **Connection to purpose:** The threat model tells us what we need the guarantee for (e.g., if we are worried about malicious actors, we need a worst-case guarantee over possible attacks).

  - **(25-45 min) Present worst-case guarantee.**
    - Why: It's the strongest form and familiar to formal methods students. Define it as: "For all inputs (in a set defined by the threat model), the system satisfies property P."
    - Example: A self-driving car controller that never causes a collision under any possible scenario (within the operational design domain).
    - **Why now?** It's a clear benchmark. It also sets up the contrast: worst-case is strong but often unattainable in complex systems.

  - **(45-70 min) Introduce average-case guarantee.**
    - Why: Now that students understand what a guarantee is for and have seen worst-case, we can present average-case as a different way to bound risk.
    - Define it as: "With high probability (e.g., 1-δ) over inputs drawn from a distribution D, the system satisfies property P." Emphasize that D is part of the guarantee and often not chosen by the defender.
    - **Key Contrast:** Average-case is not a "weaker version" of worst-case; it's a different kind of assurance that may be more practical but licenses different actions.
    - **Complication (a) here:** The distribution D is usually the environment we operate in, which we don't control and may not know. So the guarantee is only as good as our knowledge of D.

  - **(70-80 min) Complications and trade-offs.**
    - **Complication (b):** Optimization against the guarantee (e.g., in ML, training to maximize average reward) can cause the system to exploit the distribution, making the guarantee brittle. This is where Goodhart's law and distributional shift come in.
    - **Trade-offs:** Worst-case is robust but often impossible; average-case is achievable but can break under stress or shift.

  - **(80-90 min) Check for understanding and wrap-up.**

  **Why this order?**
  - Starting with the purpose prevents the guarantees from being abstract math.
  - Threat model before guarantees because the threat model defines the set of cases we care about.
  - Worst-case before average-case because it's conceptually simpler and sets the stage for the contrast.
  - Complications after both are defined so they can be seen as inherent to average-case.

  **Avoiding smuggled assumptions:**
  - We do not start with PAC/minimax because it implicitly assumes a fixed distribution or adversary chosen by nature. Instead, we start with the purpose and threat model to make the role of the adversary explicit.

  **What breaks under different orders?**
  - If you start with average-case, students may think it's the default and miss the importance of threat models.
  - If you start with PAC, they may conflate the training distribution with the deployment distribution and miss the shift issue.
  - If you start with worst-case without threat models, they may think it's always required and not see the trade-offs.

  ---

  ### 2. The Central Example

  **Constraints:**
  - Must admit both worst-case and average-case formulations of the same target claim (e.g., "the system is safe").
  - Failure mode must be rare but correlated with conditions that matter (structured tail).
  - No deception, evaluation-awareness, or catastrophe (to avoid doom arguments).
  - Not a trolley problem.

  **Proposed Example: A Spam Filter**

  **Target claim:** "The filter correctly classifies emails as spam or not spam."

  - **Worst-case formulation:** "For every possible email (even adversarially crafted), the filter correctly classifies it."
  - **Average-case formulation:** "With high probability (say 99.9%) over the distribution of emails encountered in a typical user's inbox, the filter correctly classifies."

  **Why it works:**
  - **Same claim, rival formulations:** Both are trying to guarantee correct classification, but one is over all inputs, the other over a distribution.
  - **Structured tail:** The failure cases (misclassifications) are rare but correlated with sophisticated adversarial emails (e.g., phishing emails that mimic legitimate ones) — which are precisely the ones that matter because they cause harm. The tail is structured: it's not random noise but emails designed to evade filters.
  - **Avoids catastrophe/deception:** We can frame the harm as financial loss or privacy breach without invoking existential risk. The adversary is a spammer, not a deceptive AI.
  - **Accessible:** Students are familiar with spam filters and the idea of adversarial emails.

  **What if constraints are unsatisfiable?** This example satisfies all.

  **How to use it in session:**
  - At each step, refer back to the spam filter:
    - **Purpose:** If we have a worst-case guarantee, we can use the filter in high-security settings (e.g., corporate email). With average-case, we might use it for personal email but not for critical infrastructure.
    - **Threat model:** The adversary is spammers who can craft emails to evade detection.
    - **Worst-case:** We want no false negatives (spam that looks like ham) even under adversarial crafting.
    - **Average-case:** We can achieve 99.9% accuracy on the current email distribution, but the spammer can shift the distribution by creating new kinds of spam.
    - **Complications:** 
      - (a) The "typical" email distribution is not known and shifts over time (unfalsifiable aspect: we can't test every email).
      - (b) If we train the filter to maximize accuracy on a dataset, it might become brittle to new spam tactics (optimization against the guarantee).

  ---

  ### 3. Misconception Map (in Order of Formation)

  1. **During threat model introduction (min 10-25):** 
     - *Misconception:* "Threat model is fixed and obvious." 
       - **Block by:** Emphasize that the threat model is a choice based on what risks you care about. In spam, it could be naive users (average-case) or sophisticated attackers (worst-case).

  2. **After worst-case is introduced (min 25-45):** 
     - *Misconception:* "Worst-case is the only real guarantee; average-case is just giving up." 
       - **Block by:** Show examples where worst-case is impossible (e.g., spam filter cannot be 100% accurate against adaptive adversaries) and ask: does that mean we have no guarantee at all? Then introduce average-case as a different kind of guarantee that licenses deployment in some contexts.

  3. **When average-case is introduced (min 45-70):** 
     - *Misconception:* "Average-case is worst-case under a pessimistic prior." 
       - **Block by:** Clarify that in worst-case, the adversary chooses the input after seeing the system; in average-case, inputs are drawn from a fixed distribution. They are not the same.
     - *Misconception:* "The distribution in average-case is the training distribution, and deployment shift is a separate issue." 
       - **Block by:** Explicitly state that the distribution D in the guarantee is the deployment distribution, and that shift is a violation of the guarantee's assumption. This must be part of the definition.
     - *Misconception:* "The tail is noise; we can handle it separately." 
       - **Block by:** Show in the spam example that the tail (adversarial emails) is exactly what causes harm, and it's structured by the adversary. The average-case guarantee might be high, but if the tail is heavy and correlated with harm, it's not safe.

  4. **After complications (min 70-80):** 
     - *Misconception:* "Average-case guarantees are falsifiable by testing on i.i.d. data." 
       - **Block by:** Point out that we never know the true distribution D, so we can only estimate the guarantee. Also, if the system is optimized against the test set, the guarantee may not hold in deployment (complication b).

  **Misconceptions the sequence might manufacture:**
  - If we introduce average-case too early, we might create: "Average-case is sufficient for safety-critical systems." We avoid this by starting with purpose and threat models.
  - If we don't emphasize the threat model, we might create: "Worst-case is always better." We block by showing contexts where average-case is the best we can get and still useful.

  ---

  ### 4. Integrating Complications

  - **(a) Defender doesn't choose the distribution (unfalsifiability):** 
    - **When:** During the average-case definition (min 45-70). 
    - **How:** In the spam example, we don't know the true D (all emails a user will receive). We can only sample from historical data. So the average-case guarantee is an assumption about the future based on the past. This is an inherent part of the epistemology: we must trust that our data represents reality. Contrast with worst-case, which is falsifiable by finding a single counterexample.

  - **(b) Optimization degrades the guarantee:** 
    - **When:** During the complications section (min 70-80). 
    - **How:** In the spam example, if we train the filter to maximize accuracy on a dataset, it might overfit and become vulnerable to new attacks. This is not just an ML issue but a general property of average-case guarantees under optimization. It's a structural feature: the guarantee is about a fixed system and distribution, but if the system is adaptive (like an ML model trained to game the metric), the guarantee may not hold.

  By placing (a) during the average-case definition and (b) during trade-offs, they are seen as inherent to average-case guarantees, not AI-specific caveats.

  ---

  ### 5. Engaging the Two Factions (10 minutes at min 80)

  - **When:** After the core distinction and complications, just before the wrap-up. 
  - **Why then:** They now have the framework to see their own views as special cases.

  **Formal Methods Students (worst-case advocates):**
  - They believe: "A guarantee that isn't worst-case isn't a guarantee."
  - **Engagement:** Ask: "In what contexts is worst-case essential?" (e.g., nuclear systems). But then challenge: "Is worst-case always feasible for complex systems like spam filters? If not, what do we do? Is there a role for average-case with high confidence?"

  **Interpretability Students (average-case via interpretability):**
  - They believe: "Interpretability turns average-case evidence into something stronger."
  - **Engagement:** Ask: "How does interpretability help? Does it move us toward worst-case (by making the system transparent) or does it just improve our average-case estimates (by helping us understand failures)?" 

  **Resolution:** Name the research question: 
  - "Can we use interpretability to achieve worst-case guarantees? Or is it a tool to make average-case guarantees more robust? This is an open problem."

  **Time allocation:** 2 minutes per faction for their view, 3 minutes for discussion, 2 minutes to frame as open questions.

  ---

  ### 6. Check for Understanding

  **Question:** 
  *Suppose we have an image classifier that we want to deploy in a self-driving car to recognize pedestrians. We have two guarantees:*
  - *Guarantee A: The classifier has 99.999% accuracy over the distribution of images encountered in urban driving.*
  - *Guarantee B: The classifier will never misclassify a pedestrian image, no matter how unusual (e.g., adversarial, rare lighting, etc.).*

  *Which guarantee would you choose for the self-driving car, and why? What are the limitations of the other guarantee?*

  **Expected Wrong Answers and Diagnostics:**

  1. **Answer:** "I choose A because 99.999% is very high, and B is impossible."
     - **Diagnostic:** Misses the threat model. The failure in B (even if rare) can cause a fatality. This comes from the misconception that if worst-case is unattainable, you have no choice but average-case without considering the consequences.

  2. **Answer:** "I choose B because average-case isn't a real guarantee. A could fail on the most important cases."
     - **Diagnostic:** Correctly identifies the structured tail but assumes worst-case is feasible. May come from the formal methods view without considering if B is possible.

  3. **Answer:** "I choose A because the training data had urban images, so it should be fine."
     - **Diagnostic:** Confuses the training distribution with the deployment distribution (ignoring shift) and misses the structured tail. Shows the misconception that average-case over training data is sufficient.

  **Right Answer:** 
  - "It depends on the threat model. If we can achieve B, we should because safety-critical systems require worst-case. But if B is unattainable, A might be acceptable if we can show that the 0.001% failure rate is on non-safety-critical errors. However, we must worry about distribution shift (e.g., rural roads) and whether failures are correlated with danger."

  ---

  ### 7. What to Refuse to Explain

  **Explicitly omit:**
  - **Why:** To keep focus on the conceptual distinction, not advanced topics.
  - **What to say:** "We are not going to cover how to design systems for worst-case guarantees (e.g., formal verification techniques) or how to estimate average-case guarantees in practice (e.g., Bayesian methods). We are also not discussing specific alignment proposals today. This session is about the *types* of guarantees and their meaning. We'll address applications in future sessions."

  **Reason:** This sets boundaries without evasion, and students will respect a clear scope.

  ---

  **Session Outline with Timing:**

  - **0-10 min:** Purpose of guarantees (spam filter: what action does a guarantee license?).
  - **10-25 min:** Threat models (spam example: who is the adversary?).
  - **25-45 min:** Worst-case guarantee (define, spam example: 100% accuracy under all attacks).
  - **45-70 min:** Average-case guarantee (define, spam example: 99.9% accuracy over a distribution; include complication (a): D is unknown).
  - **70-80 min:** Complications and trade-offs (optimization degrades guarantee; structured tail).
  - **80-85 min:** Engage factions (formal methods vs. interpretability).
  - **85-88 min:** Check for understanding (self-driving car question).
  - **88-90 min:** Wrap-up and scope refusal.
answer: |-
  Below is a comprehensive plan for your 90-minute session, structured to address your requirements. The goal is to build conceptual clarity around the worst-case/average-case distinction while preempting misconceptions and integrating complications. The session uses a single running example (autonomous drone navigation) and is designed to be interactive—pose questions to the cohort throughout to gauge understanding and surface misconceptions early.

  ---

  ### **1. Dependency Structure (Order of Concepts) with Reasons**  
  **Total: 90 min**  
  **Rationale:** Start with the *purpose* of guarantees to anchor the distinction in real-world decisions. Introduce threat models early to define "what we're defending against," as this shapes both worst-case and average-case thinking. Delay probability until after worst-case to avoid conflating "average" with "weak." Save complications (e.g., unfalsifiability, optimization degradation) for after core definitions, so they emerge as structural features of average-case guarantees.  

  **Order & Timing:**  
  - **0–15 min: Purpose of a guarantee**  
    - **Why:** Students won’t grasp the distinction without understanding what guarantees *license* (e.g., "Can I deploy this AI in a hospital?"). Start with: "A guarantee is a commitment that licenses actions under uncertainty. No guarantee → no justification for deployment."  
    - **Example:** A medical AI with "99% accuracy" vs. "never fails on critical inputs." Ask: "Would you deploy the first in an ER? Why/why not?"  

  - **15–25 min: Threat model**  
    - **Why:** Threat models define the adversary/environment, making guarantees concrete. Without this, students will default to "all possible inputs" for worst-case and "training data" for average-case.  
    - **Example:** Autonomous drone navigating a forest. Threat model = physical obstacles (trees, birds), sensor noise, weather. Ask: "What could go wrong? Who/what is the adversary?"  

  - **25–40 min: Worst-case guarantee**  
    - **Why:** Introduce this first—it’s intuitive for formal methods students and sets a benchmark. Emphasize: "Holds for all inputs in the threat model."  
    - **Example:** Drone guarantee: "Never collides with any obstacle under any weather/sensor error in the threat model."  
    - **Avoid PAC/minimax:** Don’t frame it as "minimax loss" yet—it smuggles in a passive adversary. Use "adversary chooses inputs maliciously" to prep for later.  

  - **40–60 min: Average-case guarantee**  
    - **Why:** Now students see worst-case as the baseline. Contrast: "Holds with high probability over a distribution." Stress that the distribution is *external* (not chosen by the defender) and *part of the guarantee*.  
    - **Example:** Same drone: "99.9% collision-free over a distribution of forest environments."  
    - **Complication (a) here:** Point out, "You didn’t choose this distribution—it’s the real world. Can you verify the guarantee? No. It’s a claim about an unknown."  

  - **60–75 min: Complications & trade-offs**  
    - **Complication (b): Optimization degrades guarantees**  
      - **Why:** After defining both, show how average-case can unravel: "If you optimize a system for average-case performance, it might game the distribution (e.g., avoid rare but critical cases)."  
      - **Example:** Drone trained for average-case may fly higher to dodge trees (common) but fail in storms (rare).  
    - **Trade-offs:** "Worst-case: robust but often impossible. Average-case: achievable but brittle to shifts/adversaries."  

  - **75–85 min: Engage factions & open questions**  
    - **Why:** After complications, students see the distinction isn’t settled. Use their expertise to deepen discussion.  

  - **85–90 min: Check understanding & wrap-up**  

  **What breaks under other orders?**  
  - If threat models come after guarantees: Students assume worst-case = "all inputs" (ignoring real-world constraints) and average-case = "training data."  
  - If average-case comes first: Misconceptions like "average-case is just weak worst-case" cement early.  
  - If PAC is used upfront: Students assume the distribution is fixed/known (your fear of "smuggling" is correct—it obscures who controls the distribution).  

  ---

  ### **2. The Central Example: Autonomous Drone Navigation**  
  **Why it works:**  
  - **Same target claim:** "The drone never collides with obstacles."  
    - *Worst-case version:* "Collision-free for all obstacle configurations, sensor errors, and weather in the threat model."  
    - *Average-case version:* "Collision-free with probability 99.9% over a distribution of environments (e.g., forests with typical tree density, wind patterns)."  
  - **Structured tail:** Failures are rare but correlated with *high-risk conditions* (e.g., storms cause both sensor errors and dense obstacles). The tail isn’t random noise—it’s a coherent "danger zone."  
  - **Avoids tropes:** No deception/doom (focuses on sensor/environment failures). Not a trolley problem (no ethical choices).  
  - **Conceptual work:** Students debate "what licenses deployment?" not "is doom likely?"  

  **Use in session:**  
  - **Threat model (min 15–25):** "A storm causes sensor noise and dense obstacles—this is in our threat model."  
  - **Worst-case (min 25–40):** "Can we guarantee safety in a storm? If not, does that make the drone unusable?"  
  - **Average-case (min 40–60):** "We guarantee safety in 99.9% of conditions. But what if storms are 0.1% of flights? Does that license deployment in national parks?"  
  - **Complications (min 60–75):** "If we optimize for average-case, the drone avoids forests on windy days—seems safe, but now it fails when storms hit unexpectedly."  

  **Cost of constraints:** All satisfied. No need to drop any.  

  ---

  ### **3. Misconception Map (Order of Formation & Blocking)**  
  Misconceptions form predictably as concepts build. Block them at the point they’re likely to arise:  

  - **During threat models (min 15–25):**  
    - *Misconception:* "Threat models are obvious—just include everything!"  
      - **Block:** Ask: "Does your phone’s weather app need to handle arctic storms? No. Threat models define *plausible* risks." Show drone example: "We include storms but not meteor strikes."  

  - **After worst-case intro (min 25–40):**  
    - *Misconception:* "If worst-case is unattainable, we have no guarantee at all."  
      - **Block:** Argue: "Worst-case is one tool. If a drone can’t guarantee storm safety, does that ground all flights? Or can average-case still license fair-weather use?"  
    - *Misconception:* "Worst-case is just average-case under a pessimistic prior."  
      - **Block:** Clarify: "No—worst-case adversaries choose inputs *reactively* (e.g., target drone weaknesses). Average-case assumes a fixed distribution."  

  - **After average-case intro (min 40–60):**  
    - *Misconception:* "Average-case means training distribution; deployment shift is a footnote."  
      - **Block:** Stress: "The distribution is *deployment reality*. Training data is just a proxy—shift breaks the guarantee." Use drone: "Training in California forests won’t cover Florida hurricanes."  
    - *Misconception:* "The tail is noise—we can bolt it on later."  
      - **Block:** Ask: "In the drone’s 0.1% failure rate, are failures random? No—they cluster in storms. Ignoring the tail is ignoring the biggest risks."  

  - **During complications (min 60–75):**  
    - *Misconception:* "Average-case is just worst-case weakened."  
      - **Block:** Contrast: "Worst-case guards against intelligent adversaries; average-case assumes a fixed world. They defend different things!"  
    - *Artifact of sequence:* If you introduce average-case too late, students might think "worst-case is always superior." **Block early** by asking during worst-case: "When is this impractical? What alternatives exist?"  

  ---

  ### **4. Integrating Complications Structurally**  
  - **Complication (a): Unfalsifiability of average-case (min 40–60)**  
    - Integrate during average-case definition: "This guarantee depends on a distribution you didn’t choose and can’t sample exhaustively. You can’t *prove* it holds—you *assume* it based on limited data. That’s not a flaw; it’s baked into average-case epistemology."  
    - **Drone example:** "You simulate 10,000 flights, but can you test every storm? No. Your guarantee is a bet about reality."  

  - **Complication (b): Optimization degrades guarantees (min 60–75)**  
    - Tie to trade-offs: "When you optimize against an average-case metric (e.g., collision rate), the system may avoid hard cases. This isn’t ‘AI being sneaky’—it’s structural. The guarantee degrades because optimization changes the system-distribution interaction."  
    - **Drone example:** "Training for high average safety teaches the drone to cancel flights in high wind. Now your guarantee holds *less often* in critical moments."  

  ---

  ### **5. Engaging Factions (75–85 min)**  
  **When & how:** After complications (min 75–85), when both guarantees look messy but essential. Spend 10 min total:  
  - **Formal methods students (2 min):** "You want worst-case guarantees. In the drone example, would you ever accept average-case? When?" Let them argue for rigor. Then challenge: "What if we *can’t* prove worst-case? Does that mean we shouldn’t fly drones?"  
  - **Interpretability students (2 min):** "You think interpretability strengthens average-case. How? Does it make failures predictable (moving toward worst-case) or just explain average behavior?" Challenge: "If you ‘understand’ the drone, does that eliminate storm risk?"  
  - **Open question (1 min):** Frame: "Research question: Can interpretability or verification bridge worst-case and average-case? Or are they fundamentally distinct?"  
  - **Why now:** After seeing complications, neither side "wins." This avoids fake resolutions and validates their expertise.  

  ---

  ### **6. Check for Understanding (85–88 min)**  
  **Question:**  
  *You’re evaluating an AI for wildfire detection in forests. It has:  
  (A) A worst-case guarantee: "Alerts for all fires >1 acre in any terrain, under any conditions."  
  (B) An average-case guarantee: "Alerts for 99.9% of fires >1 acre over a distribution of forests."  
  Which guarantee licenses deployment in a national park? Why? What does the other fail to cover?*  

  **Wrong Answers & Diagnostics:**  
  - **Answer 1:** "B, because 99.9% is high enough. A is impossible."  
    - **Diagnostic:** Misses purpose/threat model. Comes from "if worst-case is unattainable, we have no choice" misconception.  
  - **Answer 2:** "A, because average-case might miss fires in rare conditions like droughts."  
    - **Diagnostic:** Correctly identifies structured tail but assumes worst-case is feasible. Reflects formal methods bias.  
  - **Answer 3:** "B, if the distribution matches training data. Shift is a separate issue."  
    - **Diagnostic:** Confuses deployment/training distributions. Shows "average-case = training data" misconception.  

  **Right Answer:** "It depends on the threat model. If droughts are in the threat model, A is needed. But if A is unattainable, B might license deployment if we monitor conditions—though we risk missing fires in droughts (tail) and can’t verify B fully."  

  ---

  ### **7. What to Refuse to Explain**  
  **At 88–90 min, explicitly omit:**  
  - **Technical methods:** "We won’t cover *how* to achieve these guarantees (e.g., verified training, distributionally robust optimization). That’s for later sessions."  
  - **Philosophical debates:** "We’re avoiding ‘what counts as safe enough?’—focus on how guarantees license actions."  
  - **AI-specific doom:** "We didn’t use deception/catastrophes because the distinction applies broadly (e.g., medical devices, finance)."  
  **Phrasing:** "Due to scope, we’re stopping here. Today’s goal was to equip you to *categorize* guarantees—future sessions will build on this."  

  ---

  ### **Why This Works**  
  - **Cohesive:** The drone example ties everything together, satisfying all constraints.  
  - **Preempts misconceptions:** Blocks errors at the point of formation (e.g., threat models before guarantees).  
  - **Engages factions:** Uses their biases to deepen learning, not derail it.  
  - **Checks understanding:** Diagnostic question reveals lingering misconceptions.  
  By the end, students can dissect alignment techniques: e.g., "This technique offers average-case safety over deployment environments—it licenses restricted use but breaks under adversarial distribution shifts."
