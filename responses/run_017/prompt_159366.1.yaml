prompt: |-
  I run a small type foundry, and I need help turning an idea into something my team can actually use. We maintain a variable superfamily covering Latin, Greek and Cyrillic, and for the past eight months we have been contracted to extend it to a language whose orthography was standardized only in the 1990s and which has, as far as we can tell, no typographic tradition beyond a few handwritten primers and some photocopied church bulletins. Our workflow is that a generative model trained on our existing masters proposes candidate glyphs and a human reviewer accepts or rejects them: about two hundred candidates a month, under fifteen minutes per review, and the reviewers are junior designers with no training in linguistics or philosophy. A rejection costs us roughly a week of regeneration; a bad acceptance ships to readers who notice at once that the letter was drawn by someone who does not read the language. Sign-off is mine, with a two-person advisory board of native readers I can consult maybe twice a month and who do not always agree.

  A friend described to me a research project on letterform design whose central claim — I only ever got it second-hand, so treat my summary as hearsay and please don't lean on knowing the source — is that what makes every 'a' an 'a' is not a list of features you can check off. Roughly: the parts of the glyph (the bowl, the stem, the aperture, the terminal) each play a role; the same role can be filled in many different ways; and a letter is identified as much by its place in a system of contrasts with the other letters of its alphabet as by anything intrinsic to it, so that an 'a' is partly what is not an 'o', not a 'd', not a 'u'. Right now my reviewers have no procedure at all — they look at a candidate and say that's not an a, and when I ask why, they gesture at the shape. I want better than that, and I want it usable by someone who has never thought about categories.

  Please write me an accept/reject procedure my reviewers can run, in words, in the order the questions should be asked: what to look at first, what counts as a sufficient answer at each step, where a candidate is rejected outright, where it is handed on to me because the remaining question is one of judgment or house values rather than fact, and how a reviewer should separate a deviation of style from a failure of category — the difference between a candidate whose stem is straighter than ours because the model learned a different model of the skeleton, which is fine, and one that will be read as a different letter or by nobody at all. It has to survive three complications I cannot design away. First, the new script has almost no tradition: there is no settled prototype to compare against, and the tempting move of importing the Latin contrast set may simply be importing an answer. Second, the superfamily includes a micro master for ten-pixel interface labels and an accessibility master aimed at readers with dyslexia, where our 'a' is deliberately exaggerated and the ordinary tests may not apply. Third, for nearly every candidate we can run no empirical test at all: a few thousand speakers, no eye-tracking, two advisors. Say what the procedure does when it cannot get an answer from a reader, and be explicit about which steps are judgment calls wearing procedural clothing.

  Then run it on three cases. First: the model's candidate 'a' for the new script — a closed bowl, a straight stem on the right, a small foot serif — where two reviewers say it reads as an 'o' with a tail, one says it is fine, and the advisory board is split. Second: a candidate where, generating for the Cyrillic codepoint, the model produced something very close to the Greek alpha our family already ships, and which reads perfectly well to a monolingual Latin reader. Third: a candidate I drew by hand myself and would like to keep — a single-storey 'a' whose bowl opens very wide where it meets the stem — which the reviewers love, and which at the micro master becomes hard to tell from both our 'o' and our 'c'; I expect the procedure to tell me something I do not want to hear about this one, and I would rather hear it. Finally, tell me plainly where the procedure will misfire and what it cannot do, and in particular whether it can ever settle the question of whether two shapes are the same letter across two different scripts, or whether that question belongs to Unicode and to the community of readers rather than to us.
reasoning: |-
  We are designing an accept/reject procedure for glyph candidates in a variable type superfamily, focusing on a new script with little typographic tradition. The procedure must be usable by junior designers without linguistic training and must handle three complications: no settled prototype, multiple masters (including micro and accessibility), and limited empirical testing.

  The procedure is based on the idea that a letter is defined by:
  1. The roles of its parts (e.g., bowl, stem, aperture, terminal) and how they are realized.
  2. Its place in a system of contrasts with other letters (so that an 'a' is what is not an 'o', not a 'd', etc.).

  We will break down the review into a step-by-step procedure. The goal is to catch failures of category (where the glyph is misread as another letter or not recognized) and to flag stylistic deviations that may require higher-level judgment.

  **Procedure for Reviewing a Glyph Candidate**

  **Step 0: Preparation**
  - Have the candidate glyph displayed in the context of the entire alphabet (or at least the most confusable letters) for the script being designed. Also, display the candidate in the specific master (micro, accessibility, etc.) for which it is intended.
  - For the new script, have a reference set of the most basic forms (from handwritten primers or church bulletins) if available. If not, note that we are building from a minimal tradition.

  **Step 1: Check for Critical Structural Elements (Role Fulfillment)**
  - Identify the key structural elements of the letter (e.g., for an 'a'-like letter: bowl, stem, aperture, terminal). 
  - Question: Does the candidate have all the required structural elements for this letter? (e.g., does it have a bowl? a stem? an aperture?)
    - If any critical element is missing, reject and note which element is missing.
    - If all elements are present, proceed.

  **Step 2: Check Element Roles (How they are realized)**
  - For each element, check if it is realized in a way that is consistent with the role it must play. For example:
    - The bowl must be sufficiently large and enclosed (or open) to be perceived as a bowl.
    - The stem must be sufficiently vertical and distinct from the bowl.
    - The aperture (if expected) must be open enough to be noticeable.
  - Question: Are the elements realized in a way that they can perform their function? (e.g., if the bowl is too small or too open, it might not be seen as a container; if the stem is too curved, it might be mistaken for part of the bowl).
    - If an element is so poorly realized that it cannot be recognized as performing its role (e.g., a stem that is just a bump), reject and note the element and issue.
    - If all elements are adequately realized, proceed.

  **Step 3: Check Contrasts with Confusable Letters (Systemic Contrast)**
  - Display the candidate alongside the most confusable letters in the same script (e.g., for 'a', compare with 'o', 'd', 'u', etc.). 
  - Question: Does the candidate maintain sufficient contrast with each of these confusable letters? Specifically, check:
    - The overall shape (e.g., 'a' vs. 'o': the bowl of 'a' is typically less circular and may have a stem; 'a' vs. 'd': the bowl is on the left for both, but the stem of 'd' is typically on the right and may be taller; etc.).
    - Key differentiating features (e.g., presence/absence of a stem, shape of the bowl, aperture size, etc.).
  - If the candidate is too similar to any confusable letter (so that they are hard to distinguish at a glance, especially at the intended master size and in context), reject and note which letter it is confusable with.
  - If the contrasts are maintained, proceed.

  **Step 4: Master-Specific Checks**
  - For the micro master (10-pixel): render the candidate at the intended size and check:
    - Are the critical features (from steps 1-3) still discernible?
    - Does it become confusable with any other letter at this size?
  - For the accessibility master (dyslexia-friendly): check that the features that aid recognition (e.g., heavier bottoms, exaggerated features) are present and effective without introducing confusability.
  - If the candidate fails at the intended master (e.g., at micro size, the stem disappears or the bowl becomes a blob, making it look like an 'o'), reject and note the master and issue.
  - If it passes, proceed.

  **Step 5: Adjudicate Stylistic Deviations (If the candidate passes the above)**
  - If the candidate has passed all the previous steps, then any remaining issues are likely stylistic (e.g., the stem is straighter than our current design, the bowl is rounder). 
  - Question: Does the stylistic deviation:
    - Break the consistency of the superfamily? (e.g., if the entire family has a certain slant and this one is straight, that might be an issue.)
    - Violate any explicit design guidelines? (e.g., we avoid serifs in the micro master.)
    - If the deviation is acceptable, then the candidate can be accepted. Otherwise, it is a judgment call and should be escalated to the sign-off person (you) with notes.

  **Step 6: Escalation and Ambiguity Handling**
  - If at any step the reviewer is unsure (e.g., in step 3, the contrast is borderline), or if the candidate passes but the reviewer has a nagging doubt, escalate to you with detailed notes.
  - If there is a conflict between reviewers (e.g., one says it's confusable, one says it's not), escalate.
  - When empirical testing is not possible (which is most of the time), the procedure relies on the reviewer's judgment in steps 1-4. However, if the reviewer cannot get an answer (e.g., they are not sure about the contrast because the script is new and there are no reference letters), they must escalate. Do not guess.

  **Summary of Rejection Triggers:**
  - Missing critical structural element (Step 1).
  - Critical element not fulfilling its role (Step 2).
  - Insufficient contrast with confusable letters (Step 3).
  - Failure at the intended master (Step 4).

  **Escalation Triggers:**
  - Borderline cases in any step.
  - Stylistic concerns that might break family consistency (Step 5).
  - Any ambiguity or lack of reference.

  **Applying the Procedure to the Three Cases**

  **Case 1: Candidate 'a' for the new script (closed bowl, straight stem on the right, small foot serif)**
  - Step 1: It has a bowl, a stem, and a terminal (serif). All elements present.
  - Step 2: The bowl is closed (which might be acceptable, but we must check the role). The stem is straight and distinct. The serif is small but present. Seems okay.
  - Step 3: Compare with 'o'. The candidate has a stem and the 'o' does not. However, if the stem is too small or the bowl too circular, it might be read as an 'o' with a tail (which is exactly the concern). At normal size, the stem might be clear, but at micro? We must check Step 4.
  - Step 4 (Master-specific): 
    - For the main masters: the stem might be discernible, but if reviewers say it reads as an 'o' with a tail, that suggests the stem is not prominent enough to break the circularity of the bowl. 
    - For the micro master: if the stem and serif become a tiny bump, it might look exactly like an 'o'. 
    - For accessibility: the stem must be clear to avoid confusion.
  - Step 5: If it passes step 4, then stylistic issues (like the serif style) would be escalated. But here, step 3 and 4 are problematic.
  - Decision: The candidate is rejected at Step 3 or 4 because of insufficient contrast with 'o'. Even though the stem is present, if it does not create a strong enough contrast, it fails. Since the advisory board is split and reviewers are concerned, we must reject. Note: The procedure would have caught it in step 3 (if the contrast is insufficient) or step 4 (if at micro it becomes an 'o').

  **Case 2: Cyrillic candidate that looks like Greek alpha (and reads well to a Latin reader)**
  - Step 1: The Cyrillic letter has specific structural requirements. We must know what they are. If the model produced a Greek alpha, it might not have the correct elements for the Cyrillic letter. For example, the Cyrillic letter might require a double-storey form, but the candidate is single-storey. Check: does it have the required elements? If the Cyrillic letter is supposed to have a crossbar and the candidate does not, then reject at Step 1.
  - Step 2: Even if the elements are present, they might be realized incorrectly (e.g., the crossbar might be too high or too low). But in this case, if it's missing an element, we reject at step 1.
  - Step 3: Compare with confusable Cyrillic letters. If the candidate looks like Greek alpha, it might be confused with a different Cyrillic letter? Also, note that the script context is Cyrillic, so the contrast set is Cyrillic, not Greek. Even if it looks like a recognizable letter to a Latin reader, that does not help a Cyrillic reader. We must check against the Cyrillic alphabet. If it looks like a letter that is not in Cyrillic, that might be acceptable? But if it looks like a Cyrillic letter that it is not, then that is a problem. Example: if the Cyrillic letter is 'д' (which is like a Greek delta) and the candidate looks like alpha, then it might be confused with nothing? But then step 1 and 2 must be passed. However, the problem is that it is not the expected form for the Cyrillic letter. The issue is that the model generated a Greek form for a Cyrillic codepoint. The reviewers must have a reference for what the Cyrillic letter should look like (even if minimal, from handwritten primers). If the reference shows a different structure, then step 1 fails.
  - Step 4: Check at micro and accessibility. Even if it passes step 1-3 for Cyrillic, it might be acceptable? But note: the candidate is for a Cyrillic codepoint, so it must be the Cyrillic letter. If the Cyrillic letter traditionally has a different form, then the candidate is wrong. Reject at step 1 (missing critical element) or step 2 (element not fulfilling role) because it does not match the expected structure of the Cyrillic letter.
  - Decision: Reject at Step 1 if the candidate does not have the required structural elements for the Cyrillic letter (e.g., if the Cyrillic letter should have a crossbar and the candidate does not). Even if it is readable to a Latin reader, that is irrelevant. We are designing for the script's readers.

  **Case 3: Hand-drawn single-storey 'a' with a wide-open bowl (becomes confusable at micro)**
  - Step 1: It has a bowl and a stem. The bowl is open (wide aperture). The aperture is part of the structure. So, elements are present.
  - Step 2: The bowl is open wide. Is that acceptable? The role of the bowl is to be a container, but an open bowl is still a bowl. The stem is present. So, it passes step 2.
  - Step 3: Contrast with 'o' and 'c'. In the main masters, the wide-open bowl might make it look like a 'c' with a stem? But an 'a' typically has a bowl and a stem, while 'c' is just a curve. The contrast might be maintained if the stem is clear. However, at the micro master (step 4) we have a problem.
  - Step 4: At micro, the wide opening might make the bowl look like a 'c' (which is just an open curve) and the stem might become a small hook, so it becomes a 'c'. Alternatively, if the bowl is too open and the stem is not prominent, it might look like an 'o' that is broken? So, at micro, it becomes confusable with both 'o' and 'c'. Therefore, it fails step 4 for the micro master.
  - Step 5: Even if it passes for other masters, the micro master failure requires rejection. But note: we might design a separate micro version? However, the procedure is for the candidate in the intended master. If this candidate is for the micro master, then it fails. If it is for the main master, then we must also check the micro master version of this design (if it will be derived) and if it fails, we must reject the design for the entire family because it will break at micro. Alternatively, we might have to design a separate glyph for micro. But the procedure is per candidate per master? Since the superfamily is variable, we are generating for each master. So, if this candidate is for the main master, then we must also simulate how it will look at micro (and accessibility) and if it fails, we must reject or flag that the micro master will need a different design. However, the procedure is applied to the candidate for a specific master. So, if the candidate is for the main master, step 4 would check the main master and then we would note that when we derive the micro, it might fail. But the procedure is for the candidate at hand. We must assume the candidate is for a specific master. Let's say this candidate is for the main master. Then step 4 for the main master passes? But step 4 says to check at the intended master. For the main master, it might be acceptable. Then step 5: stylistic issue (wide aperture) is acceptable? But then we must note that the micro master will have a problem. However, the procedure is designed to catch problems in the candidate for its intended master. The candidate for the main master might pass, but then when we generate the micro master, we must run the procedure again and then it will fail. Alternatively, if the candidate is intended for the micro master, then it fails at step 4. The problem is that you drew it for the main master but worry about micro. The procedure should include a note that if the candidate is for a master that will be interpolated to others, we must check the extremes. But to keep it simple, we assume the candidate is for a specific master. 
  - Decision: If the candidate is for the micro master, it is rejected at step 4. If it is for the main master, it might pass steps 1-4 for the main master, but then step 5 would note that the wide aperture is a stylistic choice and that it may cause issues in the micro master. This must be escalated to you (the sign-off) with a warning that the micro master will need a different design. However, if the candidate is intended to be used across the entire family (including micro by interpolation), then it fails because it does not work at micro. So, we must reject.

  **Limitations of the Procedure**

  1. **Misfires**:
     - The procedure might reject a glyph that is actually acceptable if the reviewer misapplies the steps (e.g., if they are too strict in step 2 about what constitutes a bowl). Training and examples are needed.
     - It might accept a glyph that is confusable in a context we didn't test (e.g., in a word with specific neighbors).
     - It relies on the reviewer's ability to identify the critical structural elements and confusable letters. For a new script, this identification might be challenging.

  2. **What it cannot do**:
     - It cannot create a typographic tradition where none exists. It can only ensure internal consistency and contrast within the system we are building.
     - It cannot replace empirical testing with real readers. When in doubt, we must rely on the advisory board or escalate.
     - It cannot settle questions of style or aesthetic preference beyond basic legibility and contrast.

  3. **Cross-script identity**:
     - The procedure does not and cannot determine whether two shapes from two different scripts are the "same letter". That is a matter for Unicode (which assigns codepoints) and the community of readers (who associate shapes with meanings). Our job is to design a glyph that fulfills the expected role for the codepoint in the target script, as determined by the script's tradition (however minimal) and the contrast set within that script.

  **Final Note**: The procedure is a tool to standardize the review process and catch obvious errors. It cannot replace the judgment of experienced designers and native readers, but it can make the implicit explicit and reduce the number of bad acceptances.
answer: |-
  Below is a structured accept/reject procedure for your reviewers, designed around the principles of **role fulfillment** and **systemic contrast**. It prioritizes critical functional issues over stylistic preferences, escalates ambiguous cases, and accounts for your constraints (no tradition, multiple masters, limited testing). The procedure is sequential—each step must be passed to proceed. Steps 1–3 are binary (pass/reject); Steps 4–5 involve judgment and escalation. 

  ---

  ### **Glyph Review Procedure: Accept/Reject Checklist**  
  *(Run per candidate, per master)*  

  #### **Step 1: Verify Critical Structural Roles**  
  **Question:** *Does the candidate have all essential structural roles for this letter (e.g., bowl, stem, aperture, terminal) in a minimally recognizable form?*  
  - **What to do:**  
    - Identify 2–3 core roles for the target letter (e.g., for "a": bowl, stem, aperture). Use handwritten primers as a baseline. If unsure, default to Latin roles but note this as a risk.  
    - Check if each role is physically present and distinct (e.g., a "bowl" must enclose space; a "stem" must be a vertical/horizontal anchor).  
  - **Reject if:** Any role is missing (e.g., no bowl) or critically deformed (e.g., stem merged into bowl).  
  - **Escalate if:** Roles exist but are ambiguous (e.g., "Is this a curved stem or part of the bowl?").  
  - **Sufficient answer:** "Bowl/stem/aperture are present and separable." No need for stylistic alignment.  

  #### **Step 2: Check Contrast with Key Confusable Letters**  
  **Question:** *Does the candidate clearly differentiate from the top 1–2 confusable letters in its script?*  
  - **What to do:**  
    - Display candidate alongside confusables (e.g., for "a", compare with "o", "d", "u"). Use handwritten references or your superfamily’s existing glyphs.  
    - Focus on **one decisive contrast** per confusable (e.g., "a" vs. "o": aperture vs. closure; "a" vs. "d": stem position).  
    - Test at intended master size (e.g., 10px for micro).  
  - **Reject if:**  
    - The candidate shares the decisive contrast feature of a confusable (e.g., "a" is fully closed like an "o").  
    - Differentiating features vanish at the target master size (e.g., micro candidate’s aperture is invisible).  
  - **Escalate if:** Contrast is borderline (e.g., aperture is narrow but present) OR no confusables exist yet (new script).  
  - **Sufficient answer:** "At [size], this avoids [confusable] because [feature]."  

  #### **Step 3: Validate Role Functionality**  
  **Question:** *Can each role fulfill its function in the system?*  
  - **What to do:**  
    - Map roles to functions (e.g., bowl = container; stem = anchor; aperture = entry/exit).  
    - Verify no role conflicts with its purpose (e.g., a "closed" bowl blocks the aperture role; a "stem" angled >30° fails anchoring).  
  - **Reject if:** A role cannot perform its core function (e.g., aperture sealed shut; stem fused to bowl).  
  - **Escalate if:** Function is achieved unusually (e.g., aperture implied via negative space).  
  - **Sufficient answer:** "Bowl contains space, stem anchors, aperture opens."  

  #### **Step 4: Assess Master-Specific Risks**  
  **Question:** *Does the candidate compromise legibility in this specific master?*  
  - **What to do:**  
    - **Micro master (10px):** Check if critical features (Step 1–3) dissolve into noise. Trace with a 1px brush: if >50% of key features blur, flag.  
    - **Accessibility master:** Ensure no features exacerbate confusion (e.g., exaggerated bowls that mimic "o").  
    - **Other masters:** Verify weight/width contrasts are consistent with superfamily.  
  - **Reject if:** Micro/accessibility tests fail (e.g., stem vanishes at 10px; bowl mimics "o" in dyslexia master).  
  - **Escalate if:** Legible but stylistically atypical (e.g., "Stem is 20% thicker than superfamily average").  
  - **Sufficient answer:** "At [master], [feature] remains clear."  

  #### **Step 5: Style & Consistency Check**  
  **Question:** *Does the candidate fit the superfamily’s style without causing systemic drift?*  
  - **What to do:**  
    - Compare to the closest superfamily master (e.g., Latin "a" for new scripts).  
    - Flag deviations that could cascade (e.g., a wider bowl might force "d" to widen).  
  - **Reject:** Never reject here—**escalate all** to you. Style is a judgment call.  
  - **Sufficient answer:** "Fits style" or "Deviates in [way], may impact [other letters]."  

  ---

  ### **Handling Ambiguity & Constraints**  
  - **No reader feedback?** Escalate after Step 2. Never guess.  
  - **Conflicting references?** Reject if Step 1–3 fail; else escalate.  
  - **New script with no tradition?** Steps 1–3 define your *emerging* system. Document all decisions.  
  - **Judgment calls disguised as procedure:** Steps 2 (contrast) and 4 (master risks) are most subjective. Reviewers must describe *why* a feature succeeds/fails.  

  ---

  ### **Testing the Procedure: Three Cases**  

  #### **Case 1: New Script "a" (reads as "o with tail")**  
  - **Step 1:** Bowl, stem, terminal roles present → Pass.  
  - **Step 2:** Contrast with "o": Decisive contrast (aperture) is missing (closed bowl). At micro, stem may vanish → **Reject at Step 2.**  
  - **Why:** Functional failure. Closed bowl blurs systemic contrast with "o", regardless of tradition.  

  #### **Case 2: Cyrillic Candidate Resembling Greek Alpha**  
  - **Step 1:** Check Cyrillic reference: If the target letter requires features alpha lacks (e.g., crossbar, double-story), reject. Else, pass.  
  - **Step 2:** Contrast with Cyrillic confusables (e.g., "д" or "г"): If alpha-like shape matches a different Cyrillic letter → **Reject at Step 2.**  
  - **Step 3:** If Cyrillic expects an open counter but alpha is closed → **Reject at Step 3.**  
  - **Verdict:** Likely rejected early. Resembling Greek is irrelevant—systemic contrast is script-specific.  

  #### **Case 3: Your Hand-Drawn Single-Storey "a" (wide bowl)**  
  - **Step 1:** Bowl, stem, aperture present → Pass.  
  - **Step 2:** Contrast with "o": Wide aperture differentiates it, but at micro, aperture and stem blur → **Reject at Step 4 for micro master.**  
  - **Step 4:** In micro master, wide bowl + minimal stem merges with "c" and "o" → **Reject.**  
  - **Step 5:** For other masters, stylistic wide bowl is escalated to you.  
  - **Verdict:** Rejected for micro master (functional failure). For other masters, it passes Steps 1–3 but escalates as a style choice.  

  ---

  ### **Where the Procedure Fails**  
  1. **Misfires:**  
     - May reject innovative but valid glyphs if confusables are poorly chosen (e.g., in new scripts).  
     - Over-relies on Latin contrasts when no references exist.  
     - Cannot resolve advisor disagreements; it surfaces conflicts but doesn’t solve them.  

  2. **Fundamental Limits:**  
     - **Cross-script identity is outside scope.** Whether a shape "is" an "a" across scripts is a linguistic/community issue (Unicode’s domain). We only ensure the glyph fulfills its codepoint’s role in its *native* system.  
     - **Cannot predict reader acceptance.** With no tradition, readers may reject even "correct" glyphs.  
     - **Style vs. function blur.** In accessibility masters, "exaggerated" features may break contrast (e.g., a hyper-wide "a" bowl invading "e" space).  

  **Recommendation:** Use this procedure to catch 80% of errors (misplaced roles, failed contrasts). For escalated cases, weight advisor input >70% and document rationales. For new scripts, build a "contrast map" of key differentiators over time.  

  ---  
  This procedure prioritizes *functional defensibility* over perfection. It won’t replace advisors or guarantee reader approval, but it forces reviewers to articulate *why* a glyph fails—moving beyond "gesturing at the shape."
