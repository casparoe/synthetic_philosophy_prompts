prompt: |-
  I am a professor of philosophy, and I sit on our university's Committee on Enhancement and Academic Practice. Our remit is deliberately narrow: we decide only which interventions the university health service will provide or prescribe at university cost, never what students may obtain privately. In four years we have ruled as follows: we approved stimulant medication for a student with a diagnosed attention disorder, and approved extra examination time for a student with the same diagnosis who declines medication; we declined the same stimulant for an undiagnosed student preparing for finals, noting explicitly that our ruling was about provision, not permission; we approved an antidepressant for a student with a diagnosed depressive episode and declined the same drug for a student with subclinical low mood who wanted more drive; we declined a cochlear implant for a congenitally deaf student who is a fluent signer and does not consider herself disabled, funding interpreters and real-time captioning instead, while approving an implant for a student who lost his hearing at nineteen and does not sign; we approved, narrowly and on grounds of risk to patients, a wakefulness agent for a healthy senior medical resident on night rotations with no sleep disorder; and we approved without discussion reading glasses for age-related presbyopia in faculty and elective laser correction for mild myopia in a student who manages perfectly well with glasses.

  Next week's request is this. A healthy thirty-four-year-old doctoral student with no diagnosis asks us to provide, at university cost, a newly licensed sleep-compression agent — it does not improve cognition; it simply delivers a full night's restorative sleep in five hours rather than eight, with no measurable health cost on the evidence before us. She is the sole carer of a four-year-old and wants the three recovered hours for her dissertation. She has declined a reduced teaching load, which would take her past her funding deadline, and says the childcare subsidy available to her would not help, since the bottleneck is hours after her daughter is asleep rather than money.

  I want three things from you. First, the rule, or short list of rules, that best describes our record, together with at least one substantially different rule that fits it equally well: I suspect a diagnosis-based reading, a welfarist reading, and a "change the environment before the person" reading all survive the precedents, and I want to know exactly where they diverge. Second, your recommendation for the new case on grounds of consistency with what we have already done, with the closest analog identified and an explicit statement of the principle we would be adopting under each ruling — including whether the therapy/enhancement distinction is doing any real work in our decisions, or whether we have in fact been tracking something else, such as welfare, positional advantage, risk to third parties, or the availability of an environmental fix. Third, the further case you would place in front of us to tell the surviving rules apart. Argue from our record rather than from the literature: I do not want a survey of the enhancement debate, citations, or reading suggestions, since nothing we decide can rest on them.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle from a philosophy professor on a university committee. The user presents a series of past decisions about medical interventions and now wants to analyze the underlying principles for a new sleep-compression drug request.

  First, I need to crack the committee's decision pattern. Looking at their rulings: they consistently require medical diagnoses when interventions affect personal physiology (stimulants, antidepressants), but make exceptions when there's either third-party risk (resident's wakefulness agent) or non-bodily environmental solutions (interpreters for deaf student). The glasses cases are interesting outliers - approved without discussion, suggesting they see vision correction as fundamentally different from cognitive interventions.

  For the sleep-compression request, the doctoral student has no diagnosis and wants it purely for time management. The closest precedent seems to be the undiagnosed student denied stimulants - but there's a twist. The resident's case created an exception for third-party risk, which doesn't apply here. The environmental fix principle (like offering interpreters instead of implants) might suggest offering childcare instead, but the student has already refused teaching load reduction.

  I suspect the therapy/enhancement distinction isn't doing the real work here. The committee seems more concerned about medical necessity and whether the intervention alters "normal" functioning versus compensating for impairment. The deaf student cases show they respect personal identity - funding implants only when aligned with the student's self-perception.

  For the test case that would distinguish between the possible rules, I'd propose a request for mild cognitive enhancers by a healthy student caring for a disabled parent. It mirrors the sleep-compression scenario but without the "restorative" aspect of sleep, forcing the committee to show whether restoration versus enhancement matters, or if caregiving alone justifies exceptions.

  The philosophical tension lies in whether they're practicing diagnosis-gatekeeping, welfarist pragmatism, or bodily integrity preservation. The glasses cases undermine a strict therapy/enhancement divide, while the resident case shows welfare can override diagnosis when others are at risk. This new request presses exactly where these principles conflict - personal benefit versus medical need.
answer: |-
  Based solely on your committee's precedents, here is the analysis you requested:

  **1. Rules Describing Your Record & Key Divergence Points:**

  *   **Rule A (Diagnosis/Preservation of Normal Function):** "We fund interventions only to treat diagnosed medical conditions impairing normal species-typical functioning, or to provide reasonable accommodation for such conditions when treatment is declined, *except* where significant risk to third parties exists."  
      *   *Fits:* Stimulants (diagnosed ADHD), extra time (accommodation for same), antidepressant (diagnosed depression), cochlear implant (acquired hearing loss impairing normal function), wakefulness agent (risk to patients), reading glasses/laser correction (restoring normal visual function impaired by age/genetics).  
      *   *Explains Denials:* Undiagnosed stimulant seeker (no condition), antidepressant for low mood (subclinical, not impairing normal function), cochlear for fluent signer (not considered impaired by condition).

  *   **Rule B (Welfare/Necessity & Environmental Priority):** "We fund interventions necessary to mitigate significant welfare deficits caused by health conditions or unavoidable role demands, prioritizing environmental adjustments where effective and feasible, unless the intervention itself poses minimal risk/alteration and addresses a core welfare need unmet by alternatives."  
      *   *Fits:* Stimulants/extra time (mitigate academic welfare deficit from ADHD), antidepressant (mitigate welfare deficit from depression), interpreters/captioning (environmental fix for welfare deficit preferred over implant), wakefulness agent (necessity due to role demand/risk, no feasible environmental fix), reading glasses/laser (minimal risk/alteration, core welfare need - vision - unmet by alternatives like squinting).  
      *   *Explains Denials:* Undiagnosed stimulant (no significant welfare deficit *from condition*), antidepressant for low mood (subclinical deficit, alternatives likely), cochlear for signer (environmental fix preferred, no welfare deficit claimed), sleep-compression? (See below).

  *   **Divergence Point 1: The Fluent Signer vs. Acquired Hearing Loss.**  
      *   Rule A sees one as a "condition" requiring restoration (acquired loss), the other not (congenital, accommodated).  
      *   Rule B sees one welfare deficit mitigated best by an implant (acquired loss, no sign), the other best by environmental fixes (signer's preference/no deficit claimed).

  *   **Divergence Point 2: Glasses/Laser Correction vs. Subclinical Low Mood/Undiagnosed Stimulant.**  
      *   Rule A sees presbyopia/mild myopia as impairments of normal function needing correction. Subclinical low mood/undiagnosed focus issues are not.  
      *   Rule B sees glasses/laser as low-risk interventions addressing a near-universal core sensory need (clear vision) where environmental fixes (larger fonts, sitting closer) are inadequate. Subclinical mood/focus lack equivalent severity, necessity, or failure of alternatives (lifestyle changes, study techniques).

  **2. Recommendation for Sleep-Compression Case & Principle Adopted:**

  *   **Recommendation: Decline the request.**  
  *   **Closest Analog:** **The undiagnosed student seeking stimulants for finals preparation.**  
  *   **Reasoning & Principle:**  
      *   **Under Rule A:** The student has no diagnosed medical condition (sleep disorder) impairing normal function. Her need stems from life circumstances (caregiving, dissertation), not pathology. Like the undiagnosed stimulant seeker, this is enhancement, not treatment. The wakefulness agent exception was based on *unavoidable role demand creating third-party risk* (medical resident), which is absent here. Glasses correct a near-universal age-related *impairment*; this alters normal sleep duration without correcting an impairment.
      *   **Under Rule B:** While she faces a significant welfare deficit (time poverty), the cause is her life structure (single parenting + PhD), not a health condition or inherent role demand like residency. A feasible environmental adjustment exists (reduced teaching load), which she declined due to funding deadlines – a *financial* welfare issue outside your remit. The childcare subsidy doesn't address the specific bottleneck (post-bedtime hours). The wakefulness agent was approved due to *irreducible* role demand and *third-party risk*. The glasses/laser address a core sensory need with minimal alteration; this fundamentally alters a core biological process (sleep) for efficiency, not restoration of function. Funding this would set a precedent for pharmacologically altering normal physiology for time management in any demanding situation.
  *   **Therapy/Enhancement Distinction:** It *is* doing work, but **not alone**. Your committee consistently denies requests lacking a diagnosed medical condition *or* a specific, compelling justification tied to unavoidable role demands with third-party risk (resident) or the restoration of basic sensory function (glasses). The enhancement requests denied (undiagnosed stimulant, subclinical antidepressant, implant for non-impaired signer) lack these elements. The therapy/enhancement line is blurred by the glasses/laser (enhancing vision beyond "normal" for age/genetics?), but the committee treats restoring sensory function as categorically different from enhancing cognition or altering sleep duration. **You are primarily tracking: 1) Presence of a diagnosed medical condition impairing function, 2) Risk to third parties, 3) Restoration of core sensory function, and 4) Feasibility/priority of environmental fixes over bodily interventions when identity/preference aligns (deaf signer). Welfare is considered, but mediated through these filters (e.g., welfare deficit must stem from a *condition* or *unavoidable role with risk*). Positional advantage (e.g., extra exam time) is only funded when linked to a diagnosed disability.**

  **3. Test Case to Distinguish Surviving Rules:**

  *   **The Case:** A healthy, elite university athlete with no diagnosed cardiac condition requests funding for a newly approved, safe cardiac output enhancer. It doesn't improve health or longevity; it solely increases maximal oxygen uptake (VO2 max) by ~10%, allowing significantly higher sustained performance. They argue this is necessary to remain competitive at the international level, which is crucial for their scholarship and future career prospects. They train full-time; environmental fixes (better coaching, nutrition) are already maximized.  
  *   **How it Distinguishes:**  
      *   **Rule A (Diagnosis/Normal Function):** Would decline. No diagnosed condition. Enhancing performance beyond normal function. Unlike glasses, this alters physiology beyond species-typical norms for competitive advantage, not restoring basic function.
      *   **Rule B (Welfare/Necessity & Environment):** Would decline. While welfare (scholarship/career) is impacted, the cause is competitive pressure, not an unavoidable role demand with third-party risk (like the resident) or the failure to meet a basic need (like vision). Environmental fixes are exhausted, but the intervention alters core physiology for positional advantage, unlike the low-risk restoration of vision. The welfare deficit stems from the *level* of competition, not a health barrier.
      *   **Divergence Confirmed:** If Rule B leaned towards funding based on "welfare necessity" and "exhausted environmental fixes," this case would force that inconsistency. Your precedents (undiagnosed stimulant denial, wakefulness agent *only* for risk) suggest this would be declined, supporting that welfare alone, without a medical condition or specific risk/restoration justification, is insufficient. This case lacks the third-party risk of the resident and the universal sensory restoration of the glasses, aligning it clearly with the denied enhancement requests. It tests whether "competitive necessity" in a chosen field is equivalent to the resident's unavoidable, high-stakes role. Your record suggests it is not.
